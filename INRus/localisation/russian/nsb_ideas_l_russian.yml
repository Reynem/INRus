 only_big_guns_spirit: "Только большие пушки"
 only_big_guns_spirit_desc: "Боевые корабли - бесспорные королевы открытого моря."
 close_combat_navy_spirit: "Близкая борьба"
 close_combat_navy_spirit_desc: "Сблизиться - это ключ к победе."
 night_fighting_spirit: "Ночные бои"
 night_fighting_spirit_desc: "Привыкание к сражениям в темноте дает определённые преимущества."
 surprise_attacks_spirit: "Сюрпризные нападения"
 surprise_attacks_spirit_desc: "Ударить врага до того, как он узнает об угрозе. ~n §GЭтот дух доступен благодаря нашим доктринам.§!"
 efficient_communications_spirit: "Эффективная связь"
 efficient_communications_spirit_desc: "Коммуникация, коммуникация и коммуникация."
 discrete_valor_spirit: "Дискреционный валор"
 discrete_valor_spirit_desc: "Умирать, чтобы сражаться в другой день."
 surface_raiders_spirit: "Наземные рейдеры"
 surface_raiders_spirit_desc: "Почему подлодки делают все эти рейды? Этот дух доступен благодаря нашим доктринам.§!"
 decisive_battle_spirit: "Решительная битва"
 decisive_battle_spirit_desc: "Всё, что нужно для битвы, всегда даст вам инициативу. ~n §GЭтот дух доступен благодаря нашим доктринам.§!"
 inclimate_weather_experience_spirit: "Погодный опыт"
 inclimate_weather_experience_spirit_desc: "Нет такой вещи, как плохая погода..."
 brave_commanders_spirit: "Храбрые командиры"
