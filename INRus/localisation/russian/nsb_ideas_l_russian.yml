 brown_water_spirit: "Литоральная борьба"
 brown_water_spirit_desc: "Навигация и боевые действия на архипелаге требуют особого набора навыков."
 green_water_spirit: "Зеленая вода"
 green_water_spirit_desc: "Держаться рядом с берегом - самая безопасная ставка."
 blue_water_spirit: "Голубая вода"
 blue_water_spirit_desc: "Глубокий океан - настоящий дом моряка."
 poor_damage_control_training_spirit: "Неудовлетворительная подготовка по вопросам контроля за ущербом"
 poor_damage_control_training_spirit_desc: "Мы должны бить врага, а не наоборот."
 limited_sea_time_spirit: "Ограниченное время моря"
 limited_sea_time_spirit_desc: "Сохранение флота в море делает его более дорогим."
 cult_of_the_signal_flag_spirit: "Культ сигнального флага"
 cult_of_the_signal_flag_spirit_desc: "Пока все следуют приказам, никто не может быть обвинен."
 overbearing_admirality_spirit: "Напористость адмиралтейства"
 overbearing_admirality_spirit_desc: "Всегда проверяйте адмиралность."
 bold_attack_spirit: "Жесткая атака"
 bold_attack_spirit_desc: "Как гласит пословица: "Сильное преступление - это лучшая защита"."
 tenacious_defense_spirit: "Противоправная оборона"
 tenacious_defense_spirit_desc: "Они не пройдут!"
 meticulous_preparation_spirit: "Смешная подготовка"
 meticulous_preparation_spirit_desc: "Война - это хаос, но к хаосу можно подготовиться."
 best_of_the_best_spirit: "Лучший из лучших"
 best_of_the_best_spirit_desc: "Мало у кого есть то, что нужно, чтобы привести солдат в бой."
 academy_scholarships_spirit: "Стипендии Академии"
 academy_scholarships_spirit_desc: "Никто не должен быть лишен возможности служить своему народу из-за простой нехватки денег. ~n §GЭтот дух доступен из-за нашей идеологии.§!"
 political_loyalty_spirit: "Политическая преданность"
 political_loyalty_spirit_desc: "Ненадежный военный - это угроза для государства, которое он призван защищать. n §GЭтот дух доступен из-за нашей идеологии.§!"
 political_loyalty_spirit_tt: "Новые офицеры: начать с любой §Y"Politically Connected"§! or §Y"Media Personality"§! traits."
 inventive_leadership_spirit: "Инновационное руководство"
 inventive_leadership_spirit_desc: "Предсказуемый генерал - побежденный генерал."
 inventive_leadership_spirit_tt: "Новые офицеры: §G50% шанс §!"Commando"§!, §Y"Trickster"§!, or §Y"Invader"§! traits."
 mobile_warfare_academy_spirit: "Обретайте будущее"
 mobile_warfare_academy_spirit_desc: "Где бы ни вели боевые действия в будущем, решающую роль будут играть бронированные войска."
 mobile_warfare_academy_spirit_tt: "Новые офицеры: §G50% шанс §!"Panzer Officer"§! trait."
 superior_firepower_academy_spirit: "Инженерные школы"
 superior_firepower_academy_spirit_desc: "Есть много науки, связанной с выкапыванием подходящей канавы. ~n §GЭтот дух доступен благодаря нашим доктринам.§!"
 superior_firepower_academy_spirit_tt: "§G50% шанс §! что новые офицеры созданы с §Y"Engineer Officer"§! trait."
 theatre_training_spirit: "Театральная подготовка"
 theatre_training_spirit_desc: "Некоторые офицеры могут быть "родными", но туземцы очень хорошо сражаются на выбранной ими местности. ~n §GЭтот дух доступен благодаря нашим доктринам.§!"
 theatre_training_academy_spirit_tt: "§G50% шанс §! что новые офицеры созданы с §Y"Brilliant Strategist"§! or §Y"Inflexible Strategist"§! trait."
 mass_assault_academy_spirit: "Королева битвы"
 mass_assault_academy_spirit_desc: "Пехотная пехота - королева битвы, и королева идет туда, куда ей угодно."
 underfunded_academy_spirit: "Недофинансированная Академия"
 underfunded_academy_spirit_desc: "Есть вещи, на которые лучше тратить деньги, чем учить людей убивать друг друга более эффективно."
 nepotism_academy_spirit: "Непотизм"
 nepotism_academy_spirit_desc: "Мой дядя руководит армией и говорит, что я могу получить собственную дивизию, когда захочу!"
 professional_officer_corps_spirit: "Корпус сотрудников категории специалистов"
 professional_officer_corps_spirit_desc: "Мы профессионалы, и война - это наша профессия."
 elevated_engineering_corps_spirit: "Высший инженерный корпус"
 elevated_engineering_corps_spirit_desc: "Лучший судья в отношении способности и характера человека - дать ему лопату и день, чтобы сделать с ней что-то полезное."
 proper_heritage_spirit: "Надлежащее наследие"
 proper_heritage_spirit_desc: "Хороший генерал может быть обучен, но великий генерал должен быть создан, как лошади, в каком-то смысле."
 quick_improvisation_spirit: "Быстрая импровизация"
 quick_improvisation_spirit_desc: "Поймите быстрее, думайте быстрее, действуйте быстрее - это ключ к победе."
 adaptable_modernizers_spirit: "Адаптивные модернизаторы"
 adaptable_modernizers_spirit_desc: "Доктрину, которую нельзя изменить, можно также назвать догмой."
 relief_of_command_spirit: "Чрезвычайная помощь со стороны командования"
 relief_of_command_spirit_desc: "Армия не существует, чтобы прокормить эго своих генералов. ~n §GЭтот дух доступен из-за нашей идеологии.§!"
 ideological_loyalty_spirit: "Идеологическая преданность"
 ideological_loyalty_spirit_desc: "Нельзя ожидать, что тот, у кого нет правильной идеологии, добьется правильного результата в битве."
 state_serves_the_military_spirit: "Государство служит военным"
 state_serves_the_military_spirit_desc: "Цель государства - вести войну против других государств. Всё остальное либо в поддержку этого, либо в бесполезное отвлечение внимания."
 mobile_warfare_army_spirit: "Моторизованный двигатель"
 mobile_warfare_army_spirit_desc: "Ударь быстрее, иди дальше, побеждай сильнее! Это дух доступен благодаря нашим доктринам.§!"
 superior_firepower_army_spirit: "Огненная мощь"
 superior_firepower_army_spirit_desc: "Если артиллерия не выиграет ваши битвы, вы не будете использовать их достаточно. ~n §GЭтот дух доступен из-за наших доктрин.§!"
 grand_battleplan_army_spirit: "Копье Копья"
 grand_battleplan_army_spirit_desc: "Кинжал в ночи часто более эффективен, чем длиннейший меч в день. ~n §GЭтот дух доступен благодаря нашим доктринам.§!"
 mass_assault_army_spirit: "Прочность байонета"
 mass_assault_army_spirit_desc: "Когда все сказано и сделано, танк или самолет не могут держать участок земли. ~n §GЭтот дух доступен благодаря нашим доктринам.§!"
 political_connections_spirit: "Политические связи"
 political_connections_spirit_desc: "Что ж, посмотрим, что министр скажет по этому поводу!"
 entrenched_old_guard_spirit: "Старая гвардия"
 entrenched_old_guard_spirit_desc: "Кто этот идиот, и почему он опять говорит об этом "аэроплане"?"
 doctrinal_orthodoxy_spirit: "Доктринальная православная церковь"
 doctrinal_orthodoxy_spirit_desc: "Раньше мы так не делали."
 excessive_parade_drill_spirit: "Чрезмерный парадный дрилл"
 excessive_parade_drill_spirit_desc: "Главная цель солдата - хорошо выглядеть на параде."
 static_warfare_spirit: "Статическая война"
 static_warfare_spirit_desc: "Нет такой вещи, как слишком много работы над траншеями, есть только "недостаточно" и "очень достаточно"."
 flexible_organization_spirit: "Гибкая организация"
 flexible_organization_spirit_desc: "Главное - это выполнить работу, а не выполнить приказы."
 aggressive_reconnaisance_spirit: "Агрессивное разведка"
 aggressive_reconnaisance_spirit_desc: "Если вы хотите знать, что задумала другая сторона, идите туда и спросите их напрямую!"
 reserve_officers_spirit: "Сотрудники по резервам"
 reserve_officers_spirit_desc: "Не всем нужно делать военную профессию своей, но во время войны они все еще могут служить."
 upbeat_command_spirit: "Команда подъема"
 upbeat_command_spirit_desc: "Доброе слово или общая шутка с общим солдатом часто больше помогает в общем успехе подразделения, чем дополнительная артиллерийская батарея."
 victory_or_death_spirit: "Победа или смерть"
 victory_or_death_spirit_desc: "Лучше умереть славой, чем жить в позоре поражения."
 maneuver_warfare_spirit: "Война Маноевр"
 maneuver_warfare_spirit_desc: "Настоящая, цивилизованная война больше похожа на шахматный матч, чем на драку. Зачем сражаться с врагом, с которым ты можешь манипулировать?"
 smoke_and_fire_spirit: "Дым и огонь"
 smoke_and_fire_spirit_desc: "Крутящийся снаряд снаряд удивительно эффективен, чтобы не дать врагу выстрелить в ответ. ~n §GЭтот дух доступен благодаря нашим доктринам.§!"
 logistical_focus_spirit: "Материально-техническое обеспечение"
 logistical_focus_spirit_desc: "Военнослужащие могут съесть ремни, но в танках должен быть газ. n §GЭтот дух доступен благодаря нашим доктринам.§!"
 operational_reserve_spirit: "Оперативные резервы"
 operational_reserve_spirit_desc: "Всегда есть что-то в рукаве. Всегда."
 intercommand_rivalries_spirit: "Взаимные вибрации"
 intercommand_rivalries_spirit_desc: "Самые важные битвы ведутся в комитетах по ассигнованиям, и именно там рождаются самые уродливые обиды."
 disregard_for_the_common_soldier_spirit: "Невнимательное отношение к общему военнослужащему"
 disregard_for_the_common_soldier_spirit_desc: "Обычный солдат - самое тупое, уродливое, ленивое существо, которое может быть в форме."
 constraining_hierarchy_spirit: "Иерархия консструкции"
 constraining_hierarchy_spirit_desc: "Если вы не будете внимательно следить за тем, где находятся ваши подчиненные, кто-то может их украсть."
 disdain_for_the_digging_spirit: "Отклонение от выемки"
 disdain_for_the_digging_spirit_desc: "Вся эта грязь попадает на униформу, и тогда войскам придется потратить много времени на их чистку."
 traditionalism_academy_spirit: "Традиционализм"
 traditionalism_academy_spirit_desc: "Война никогда не меняется."
 expeditionary_spirit: "Экспедиционные военные действия"
 expeditionary_spirit_desc: "Победа в войне означает путешествие в страну другого парня и разрушение многих вещей."
 penny_pinching_spirit: "Пенни-пинг"
 penny_pinching_spirit_desc: "Ты хоть представляешь, сколько стоит застрелить эту пулю?"
 bold_attack_spirit_tt: "§G50% вероятность §! §Y+1 Attack§! на уровне."
 tenacious_defense_spirit_tt: "§G50% шанс §! из §Y+1 обороны! на уровне."
 meticulous_preparation_spirit_tt: "Офицеры: §G50% шанс §! § §Y+1 планирования и логистики §! на уровне."
 best_of_the_best_spirit_tt: "Новые сотрудники: при приеме на работу не было получено никаких личных качеств."
 academy_scholarships_spirit_tt: "Новые сотрудники: при приеме на работу не было получено никаких личных качеств."
 mass_assault_academy_spirit_tt: "Новые офицеры: §G50% шанс §!"Infantry Officer"§! trait."
 nepotism_academy_spirit_tt: "§R-50% вероятность §! что новые офицеры созданы с позитивными чертами."
 traditionalism_academy_spirit_tt: "§R-20% вероятность §! что новый офицер нанят с §YArmour Office §! trait. §R20% шанс §! что новый офицер нанят с меньшим §YAttack §! или §Defence§!"
 academy_spirit: "Дух Академии"
 army_spirit: "Дух армии"
 division_command_spirit: "Дух разделения Командование"
 naval_academy_spirit: "Дух Морской академии"
 navy_spirit: "Дух ВМС"
 naval_command_spirit: "Дух военно-морского командования"
 air_force_academy_spirit: "Дух Академии военно-воздушных сил"
 air_force_spirit: "Дух военно-воздушных сил"
 air_force_command_spirit: "Дух командования военно-воздушными силами"

 heritage_of_accomplishment: "Достигнутое наследие"
 heritage_of_accomplishment_desc: "История и достижения наших полков свидетельствуют о героизме наших солдат."
