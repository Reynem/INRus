l_russian:
 independent_air_force_spirit: "Независимые военно-воздушные силы"
 independent_air_force_spirit_desc: "Военно-воздушные силы — это независимая ветвь, столь же важная, как и армия или военно-морские силы."
 industrial_destruction_spirit: "Промышленное уничтожение"
 industrial_destruction_spirit_desc: "1000 бомбардировщиков могут изменить ход войны одним ударом."
 dive_bombing_spirit: "Бомба с погружением"
 dive_bombing_spirit_desc: "Спрячь одну плоскую верхушку. ~n §GЭтот дух доступен благодаря нашим доктринам.§!"
 material_destruction_spirit: "Материальное уничтожение"
 material_destruction_spirit_desc: "Уничтожение оборудования и нарушение линий связи противника запечатлеют победу быстрее, чем любое из причиняемых потерь."
 air_modernizers_spirit: "Воздушные модернизаторы"
 air_modernizers_spirit_desc: "С тех пор, как "Фоккер Э.III" был лучшим боецом в мире, всё быстро меняется."
 industry_liasons_spirit: "Промышленные связи"
 industry_liasons_spirit_desc: "Только без трений сотрудничество между авиационной промышленностью, военными и правительством обеспечит наивысшее качество."
 air_crew_surveys_spirit: "Обследования летных экипажей"
 air_crew_surveys_spirit_desc: "В конце концов, именно они используют оборудование, так почему бы не спросить их?"
 maritime_patrol_spirit: "Морское патрулирование"
 maritime_patrol_spirit_desc: "Он летит, мы можем его найти."
 long_range_patrol_spirit: "Длинный патруль"
 long_range_patrol_spirit_desc: "Доминирование воздушного пространства вне дома."
 efficient_ground_crews_spirit: "Эффективный дух наземных экипажей"
 efficient_ground_crews_spirit_desc: "Пилоты и все такое, но что действительно важно, так это поднять самолёты в воздух как можно быстрее."
 effective_training_programs_spirit: "Эффективные программы профессиональной подготовки"
 effective_training_programs_spirit_desc: "Ничего не сравнится с хорошим образованием."
 branch_independence_spirit: "Дух независимости филиала"
 branch_independence_spirit_desc: "Ни один военно-морский парень не может приказать нам, мы делаем все по-своему."
 air_theory_spirit: "Теория воздуха"
 air_theory_spirit_desc: "Есть наука для воздушной борьбы."
 subservience_to_army_spirit: "Подчинение армии"
 subservience_to_army_spirit_desc: "Это простое описание работы, бомба, где генералы говорят вам бомбить."
 subservience_to_navy_spirit: "Субсидия военно-морским силам"
 subservience_to_navy_spirit_desc: "Самолеты действительно полезны только как военно-морское оружие и разведка."
 no_focus_on_training_spirit: "Отсутствие акцента на профессиональной подготовке"
 no_focus_on_training_spirit_desc: "Зачем нам это делать? Это легко! Кроме того, экономит топливо."
 disorganised_ground_crews_spirit: "Дисорганизованные наземные экипажи"
 disorganised_ground_crews_spirit_desc: "Наземная команда, кто они такие, почему они должны иметь значение?"
 conflicting_branches_spirit: "Коллизионные филиалы"
 conflicting_branches_spirit_desc: "Но они сказали..."
 elite_fighter_pilots_spirit: "Элитные истребители"
 elite_fighter_pilots_spirit_desc: "Помните, парни, нет очков для второго места."
 long_range_navigation_spirit: "Навигационное плавание на большие расстояния"
 long_range_navigation_spirit_desc: "Они могут бежать, но не могут спрятаться."
 dogfighting_training_spirit: "Подготовка к собачьей борьбе"
 dogfighting_training_spirit_desc: "Это не поворот Иммелмана, это половина петли."
 expert_marksmen_spirit: "Эксперт-маркеры"
 expert_marksmen_spirit_desc: "Всё дело в том, чтобы знать, куда целиться и когда нажать на курок."
 battlefield_air_interdiction_spirit: "Воздушно-воздушное противостояние боевого поля"
 battlefield_air_interdiction_spirit_desc: "Тесное сотрудничество между военно-воздушными и наземными силами."
 cag_night_fighting_spirit: "CAG Ночные бои"
 cag_night_fighting_spirit_desc: "Попробуй приземлиться на авианосце посреди ночи!"
 veteran_air_instructors_spirit: "Ветеранские инструкторы по авиаперевозкам"
 veteran_air_instructors_spirit_desc: "Позволяю лучшим тренировать остальных."
 steel_wings_steel_hearts_spirit: "Стальные крылышки, сталь Сердца"
 steel_wings_steel_hearts_spirit_desc: "Для ведения войны на высоте 10 000 футов требуется определенное мужество."
 home_defence_spirit: "Внутренняя оборона"
 home_defence_spirit_desc: "Мы будем защищать наш остров, независимо от стоимости."
 centralized_control_spirit: "Централизованный контроль"
 centralized_control_spirit_desc: "Эффективное управление ресурсами обеспечивает, чтобы самолеты добирались до тех мест, где они больше всего нужны."
 air_power_projection_spirit: "Прогнозируемый объем авиационной энергии"
 air_power_projection_spirit_desc: "Чтобы сражаться подальше от дома, требуется особая смелость."
 massed_strike_spirit: "Массовый удар"
 massed_strike_spirit_desc: "Разрушение вражеских наземных сил - лучший способ победить их. ~n §GЭтот дух доступен благодаря нашим доктринам.§!"
 continuous_strike_spirit: "Непрерывный удар"
 continuous_strike_spirit_desc: "Уничтожение основного вражеского оборудования имеет жизненно важное значение."
 strategic_strike_spirit: "Всего"
 strategic_strike_spirit_desc: "Огромные стратегические удары по сердцевине врага разрушат их способность к сражению. ~n §GЭтот дух доступен благодаря нашим доктринам.§!"
 duelling_obsession_spirit: "Склонение к одержимости"
 duelling_obsession_spirit_desc: "Единственный достойный и джентльменский способ сражаться в воздухе."
 lax_safety_regulations_spirit: "Правила безопасности на лаксах"
 lax_safety_regulations_spirit_desc: "Я имею в виду, никто на самом деле не следует инструкциям, так в чем смысл?"
 officers_clique_spirit: "Офицеры Клик"
 officers_clique_spirit_desc: "Они могут быть пилотами, но они все еще просто частные, верно?"
 not_worth_the_risk_spirit: "Не стоит рисковать"
 not_worth_the_risk_spirit_desc: "Самолёты очень дорогие."

 merchant_mariners_spirit: "Торговые моряки"
