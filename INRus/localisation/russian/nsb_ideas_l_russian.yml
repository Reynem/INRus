 fleet_in_being_academy_spirit: "Большой флот"
 fleet_in_being_academy_spirit_desc: "Крупномасштабная тактика тренировки. n §GЭтот дух доступен благодаря нашим доктринам.§!"
 fleet_in_being_academy_spirit_tt: "Новые адмирали: §G50% шанс §!"Gunnery Expert"§! trait."
 merchant_mariners_spirit_tt: "Новые адмирали: §G50% шанс §!"Naval Lineage"§! trait"."
 trade_interdiction_academy_spirit: "Война в конвое"
 trade_interdiction_academy_spirit_desc: "Торговые конвои требуют особой тактики и тренировки."
 trade_interdiction_academy_spirit_tt: "Новые адмирали: §G50% шанс §!"Seawolf"§! or §Y"Blockade Runner"§! traits."
 base_strike_academy_spirit: "Комплексная зенитная зенитная машина"
 base_strike_academy_spirit_desc: "Тесное сотрудничество между воздушными и морскими подразделениями имеет жизненно важное значение!"
