 naval_academy_scholarships_spirit: "Стипендии Академии"
 naval_academy_scholarships_spirit_desc: "Всё дело в том, чтобы дать нужным людям шанс сиять."
 naval_academy_scholarships_spirit_tt: "Новые адмирали: начать без каких-либо личностей."
 underfunded_naval_academy_spirit: "Недофинансированная Морская академия"
 underfunded_naval_academy_spirit_desc: "По крайней мере, у нас есть один..."
