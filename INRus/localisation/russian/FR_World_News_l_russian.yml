 worldnews.104.d: "На протяжении последних нескольких лет после провозглашения независимости мексиканской Республикой после резкого экономического спада в Соединенных Штатах Америки, в течение нескольких лет вдоль границы между США и Мексикой вспыхивали напряженные настроения. К удивлению, что по существу не было международного зрителя, эта напряженность вспыхнула более дня назад, поскольку, как представляется, давно спланированная диверсионная миссия была развернута мексиканским правительством, за которой последовало несколько коротких часов спустя официальное объявление войны. Первоначальные потери были чрезвычайно высокими, вероятно, неожиданными. Мир смотрит на это, не уверен, может ли эта война быть предвестнее другим."

 worldnews.105.d: "Уважаемый Пирс Лонг, губернатор Луизианы и популистский шип на стороне американской политики, был официально объявлен инаугурирующим президентом Соединенных Штатов Америки. Первый президент Демократической партии за более чем три десятилетия пришел на пост многообещающего богатства, наследства и экономических реформ. Долгожданный вспыхнул в Белый Дом после одной из самых напряженных кампаний в американской истории. Говоря о напряженности между Мексикой и Соединенными Штатами, Лонг заявил, что он "выполнил задание, а не человек, который нападает первым", хотя многие политические комментаторы выразили свое неверие в такое заявление. Независимо от мнения некоторых, политика Лонга явно повторяется со многими, и трудно сказать точно, куда Соединенные Штаты пойдут отсюда..."

 worldnews.106.d: "Губернатор штата Нью-Йорк и сын американского героя Теодор Рузвельт был официально объявлен инаугурирующим президентом Соединенных Штатов Америки. Противоречия и жестокие слова обменивались о форме его политики - главным образом, о том, что они очень близко следуют за его отцом. Расширение избирательной реформы является его первой целью; о расовой сегрегации в США он сказал, что "он сделает для чернокожего то, что сделал [его] отец для другого пола". Что касается отношений с Мексикой, то Рузвельт постоянно подтверждал свою веру в упреждающую политику, направленную на предотвращение мексиканского восстания в Соединенные Штаты. Его президент, похоже, уже испытывает недовольство, но несмотря на то, что он остается очень популярным."

 worldnews.107.d: "Алфред "Альф" Лэндон, губернатор Канзаса и народный экономический деятель, официально объявлен инаугурирующим президентом Соединенных Штатов Америки. Приступив к исполнению своих обязанностей с большим кабинетом экономических реформ, администеров и титанов промышленности, Лэндон, похоже, намерен повернуться вокруг Великой депрессии, поощряя малые предприятия, расширяя план, который он осуществил в Канзасе, когда государство достигло третьего самого низкого уровня безработицы в стране. Хотя он выступал за консервативный тип либерализма, он обещал, что карманная книга Соединенных Штатов "не будет полностью запечатана"."

 worldnews.108.d: "Джон Нэнс Гарнер, спикер палаты представителей и Тексанской палаты, был официально объявлен инаугурирующим президентом Соединенных Штатов Америки. Будучи убежденным в принятии упреждающих мер, Гарнер нашел свое место в консервативной политике за последнее десятилетие. Хотя он находится в позитивном ключе от консервативных дебатов по поводу политики Теодора Рузвельта, его позиция в поддержку обороны привела к тому, что многие другие консерваторы, которые хотели видеть демократа на самом высоком посту в стране, уже обещают масштабную военную реформу, многие мексиканские дипломаты начинают возмущаться в своей стране по отношению к США за то, что они заняли опасную позицию. Когда Гарнер просто сказал, что наши намерения будут только столь же вредны, как и его действия."

 ##############
 ## FENGTIAN ##
 ##############

 worldnews.109.d: "В то время как японцы застрелили лидера Фенгтианского правительства под знаменем Ассоциации Конкордии. Пекин, который был частью Фентиан всего лишь несколько лет назад, стал ярким примером приверженности Китая как прошлому, так и будущему, а также столице де-юре самого государства. Самое странное, что Зуолин был в столице в тот день, обсуждая потепление отношений между правительством Фентии и Японской империей. Торжество речей, которые были отмечены одним из наиболее важных действий Зуолина, когда он находился у власти, было расценено многими как одно из самых важных политических событий в Китае за последние несколько лет. Что бы ни было, международные зрители надеялись получить выгоду от этих слов теперь навсегда были потеряны по мере того, как Китай становится все ближе ко всей войне."

 ##############
 ##   RUS     ##
 ##############
 worldnews.110.d: "Враги социализма на Дальнем Востоке одержали победу в войне против Советского Союза, теперь им предстоит грандиозная задача - уничтожить наследие социализма и контролировать землю. Это положило конец власти Советского Союза, которая длилась многие годы, и только оппозиция является остатками Белого Движения в Сибири, поддерживаемыми Японией и США. Если правительство будет иметь возможность постоянно контролировать эту землю, то все, что мы знаем, это коренным образом изменило геополитический ландшафт."
 worldnews.111.d: "[Этот глагол газет] [RUS.GetNameDef] был побежден Советским Союзом, это практически устранило любую серьезную угрозу Советскому Союзу, которая близка к ним. В то время как интеграция новой земли будет сопряжена с трудностями из-за антисоциализма, который присутствует в регионе, расположенная там индустрия окажется полезной для режима."
 worldnews.112.d: "USM, выступивший в Союзе спасения Родины, победил на выборах в [RUS.GetNameDef], коалиция состоит из NUS и Ottoberistов. Оба очень милитаристские, NUS старший партнер также поддерживает прогрессивные идеалы, такие как женский суффраж и гражданский национализм. Они также хотят реформировать правительство, делая верхнюю палату, состоящую из ученых, инженеров и писателей, и нижнюю палату полностью состоит из бизнесменов. Если демократия будет сохранена, то маловероятно, что она будет авторитарной."
 worldnews.113.d: "Союз Регенерации выиграл выборы в [RUS.GetNameDef], коалиция состоит из Народной социалистической партии, Кадетов и Социал-революционеров. Они хотят покончить с дискриминацией меньшинств, поддерживают создание государства всеобщего благосостояния для оказания помощи бедным, осуществления прогрессивных реформ в целях создания более справедливой и равноправной нации и национализации земли."
 worldnews.114.d: "Национальный центр победил на выборах в [RUS.GetNameDef], партия состоит из бывших членов партии Кадет, которые ненавидели партийное руководство и впоследствии присоединились к партии, став основным игроком в политической сфере. Партия хочет восстановить монархию, но конституционную. Они также поддерживают инвестиции в образование, считая, что лидером является бывший учитель, интенсифицируя реформы на рынке и поддерживая консервативные ценности."
 worldnews.115.d: "Корнилов переворотил российское правительство и установил марионеточное правительство под руководством Спиридона Дионишовича Меркулова. Он был избран для того, чтобы возглавить нацию, чтобы обмануть японцев и предотвратить немедленное вмешательство. Цель состоит в создании националистического государства под руководством монарха и изгнании недружелюбного иностранного влияния. Они также в высшей степени милитаристские обещания атаковать Советы до 1939 года и очистить общество. Если они хотят быть успешными, то они не уверены."

 ###############
 ##   JAP     ##
 ###############

 worldnews.116.d: "По мере роста японско-американской напряженности в Тихом океане японцы вновь предприняли довольно провокационные действия, на этот раз начав военно-морские учения в заливе Манилья, недалеко от столицы Филлипина. Во время военно-морских учений японские самолеты совершили облет Манильи, прежде чем напасть на филиппинские военные базы и вызвать многочисленные потери среди филиппинцев. Нападение повредило филиппинским военным базам, аэродромам и верфи, а также нанесло ущерб американскому посольству. Глава государства Филлиппин уже обратился за помощью к американскому президенту, и президент призвал Палату и Сенат разрешить объявить войну японской империи. Два быстро позволивших, и американский президент объявил о состоянии войны. Все зрители войны не уверены в ее исходе, и тот, кто одержит победу, неизвестен."
 worldnews.117.d: "Мир задумывается о том, что произойдет с островным государством Японии, когда пройдет одна из самых бурных недель. Нынешнее демократическое правительство только что арестовало многих из своих военно-морских работников, которые, по словам представителя правительства, были арестованы, «вытеснив переворот» не против правительства». Японское правительство отказалось выпустить список арестованных, уверено, что многие теоретики, официанты и некоторые кадеты были арестованы, в то время как неподтвержденные сообщения говорят, что более 1000 человек арестованы. Многие военно-морские эксперты уверены, что это вызовет массовую утечку мозгов, так как многие арестованные занимают определенные важные позиции, и возможная военно-морская доктрина меняется по мере ареста традиционалистов. Многие военно-морские деятели обеспокоены будущим японского военно-морского флота, но то, что ложь и ожидание для Японии, это чудо мира."
 worldnews.118.d: "Сегодня утром в Вашингтоне, округ Колумбия, президент США [USA.Get Header] объявил о создании Тихоокеанской коалиции с Японской империей против некоторых «неназванных» угроз, которые планируют напасть на интересы обеих стран. Будущее неопределенное, но с двумя оплотами Тихого океана вместе, они будут защищать демократию от тех, кто хочет подорвать союз и их интересы. Европейская связь и Имперский альянс защиты шокированы довольно внезапной интервенционистской Америкой, формируя союз с Японией. Лидер Соединенного Королевства, [ЭНГ. Гейтер], любопытно, не комментирует резкий рост такого союза."
 worldnews.122.d: "Министр иностранных дел Великобритании только что провел пресс-конференцию, чтобы объявить об аресте подозреваемого японского шпиона в Британской Адмиралтействе, обвинив японское правительство в провоцировании агрессии. Японское правительство отказалось комментировать такие обвинения, утверждая, что «Япония не намерена провоцировать возмущение и наносить ущерб отношениям между двумя близкими союзниками»."

 ###############
 ##   SWI    ##
 ###############

 worldnews.119.d: "На мировой рынок было выпущено несколько полных копий пьесы, и правительство Швейцарии, которое стало более осторожным с социалистическими средствами массовой информации после катастрофических ударов 1935 года, позволило провести эту пьесу в знак доброй воли твердо демократического государства. Эта пьеса прошла через ограниченное представление в других местах, таких, как Франция и Соединенные Штаты. В ней подробно описываются «геройские» усилия социалистических активистов в конце Великой войны и во время Красного года в Италии, и основное внимание уделяется жизни Бенито Муссолини, который был бесцеремонно исполнен королевскими стражами."
 worldnews.120.d: ""Иль Матир ди Рома", пьеса, которая была создана в Северной Италии и которая была синдицирована в последние месяцы в южном кантоне Тичино Швейцарии, не была выпущена на мировой рынок. Немногие полные копии пьесы, которые стали редкими в последние месяцы, были прекращены швейцарскими властями. Их нынешнее местоположение неизвестно, но предполагается, что они были сожжены или выброшены. Поскольку в обращении не осталось никаких известных полных копий, похоже, что это конец для пролитого социалистического театра, в котором подробно говорится о пользе протагониста Бенито Муссолини в последние дни Великой войны и Красного года в Италии. Оно было охарактеризовано как подлинное, но непоследовательное в тоне. Ожидается, что никто больше не увидит полного выпуска пьесы."
 worldnews.121.d: "В течение последней недели королевские власти Габсбурга, включая Италию, Венгрию и Соединенное Королевство, собрались для празднования исторического брака, который во многих отношениях потряс исторический европейский королевский институт до глубины души. Брак между Вильгельмом IV, главным выпуском дома Хоэнзолерна, и архиепископом Роза фон Остеррейхом, одной из главных герцогинь Хабсбургского дома, были женаты в Люцерне, Швейцария, в течение выходных. В то время как оба дома запретили, неофициально или официально, марридж законнорожденного потомка на неземных женихов, этот брак имел место в самом лучшем из обоих домов. В то время как оба супруга де-юре имеют право на то, чтобы ни один из их предков не имел власти на родине их рождения."

 ###############
 # EAST INDIES #
 ###############

 worldnews.130.t: "Восстание инсулиндов"
 worldnews.130.d: "Новости о восстании инсулиндов распространились по всему миру, острова, которые на протяжении многих лет находились под колониальным контролем, сначала голландцами, а не англичанами, были погружены в восстание."
 worldnews.130.a: "Они будут уничтожены!"
 worldnews.130.b: "Ещё один отвращения против англичан"

 ###############
 #   Soviet    #
 ###############

 worldnews.132.d: "После смерти Ленина Тухачевский решил переворотить правительство, чтобы положить конец хаосу, вызванному смертью Ленина."
 worldnews.133.d: "После смерти Ленина Молотова, Бухарина и Зинониева образовалась тройка, противостоящая захвату Троцкого, но после того, как Троцкий был изгнан Зинониев, он решил заключить союз с Троцким, из-за различных идей Троцкого, Молотова и Бухарина, тройка закончилась постоянной хитростью и хитростью."
 worldnews.134.d: "Жена Ленина Надежда Крупская представила письмо, в котором она заявила, что Киров является его любимым наследником после смерти мужа."bourgeois" elements". Which one will prevail and become new premier is uncertain... "
 worldnews.135.d: "Бухарин, человек, которого многие называют "Золотым мальчиком партии", стал новым премьером сегодня после того, как он смог заявить о себе в тройке между Троцким, Молотовым и ним. Он обещает дебюрократизацию экономики и демократизацию Советского Союза."
 worldnews.136.d: "Молотов стал новым премьером сегодня после того, как смог заявить о себе в тройке между Троцким, Бухарином и ним. Он планирует реализовать идеологию национального коллективизма, которую он создал на основе провалившейся Гамбургской коммуны, включая коллективизацию сельского хозяйства и центральное планирование экономики."

 ################
 # South Africa #
 ################
 worldnews.142.t: "Южная Африка покидает Империю"
 worldnews.142.d: "Союз Южной Африки, долгое время являвшийся основой британского колониализма в Африке, провозгласил независимость от британского политического и военного влияния. Новое правительство Южной Африки заявило, что оно «начнет свой собственный путь в предстоящие десятилетия» и оформит это заявление как борьбу за свободу от репрессивного и всемогущего врага. Министерство иностранных дел Великобритании мало что говорило о развитии событий, отталкивая их от «популистской пропаганды» и заявляя, что оно будет продолжать работать с правительством колонии, когда оно восстановит свои чувства. Британия по-прежнему сталкивается с целым рядом проблем, связанных с ее влиянием по всему миру, но ее министерство отказалось комментировать вопрос о том, сможет ли оно силой вернуть Южную Африку в империю. Теперь «независимая» нация будет стремиться к получению союзников и созданию правительства, свободного от британского влияния."
 worldnews.142.a: "Ещё один удар по Британской империи."
 worldnews.142.b: "Они вернутся... так или иначе."

 worldnews.143.t: "Южная Африка претендует на Империю"
 worldnews.143.d: "Сегодня правительство независимого южноафриканского государства провозгласило конец европейского империализма в Африке и начало новой африканской империи. Южноафриканское министерство иностранных дел установило равнины на будущее, которые включают в себя «отстранение» всей Африки от европейского колониализма и поощрение волнений и восстаний элиты и прославленных колонистов высшего класса как в британских, так и во французских колониях на континенте. Многие внешние наблюдатели назвали провозглашение Южной Африки лишь отчаянной попыткой привлечь внимание мировой общественности, а члены британских и французских министерств иностранных дел угрожали наложить экономические санкции на страну и принять военные меры, если это необходимо."
 worldnews.143.a: "Они не могут быть серьёзно."
 worldnews.143.b: "Слава нам!"

