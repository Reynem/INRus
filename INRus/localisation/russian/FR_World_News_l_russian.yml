l_russian:

 #### Events ####

 worldnews.1.t: "Убийство Абдюльмесида II"
 worldnews.1.d: "13 января 1936 года султан Абдюльмецид II был очень внезапно застрелен неизвестным нападавшим! Местная жандармерия не смогла отреагировать вовремя, чтобы спасти султана, убив нападавшего только после смертельного выстрела, который оставил султана мертвым. Несмотря на непопулярность Османской династии после Великой войны, султан Абдюльмесид II и остальные члены Оттоманской королевской семьи были поддержаны властью Энтенте и сохраняли относительно стабильную империю. С гибелью султана теперь неопределенность правит в Османской империи."
 worldnews.1.a: "Как ужасно!"
 worldnews.1.d: "В этот день, 13 января 1936 года, султан Абдюльмесид II был очень внезапно застрелен неизвестным нападавшим! Местная жандармерия не смогла отреагировать вовремя, чтобы спасти султана, убив нападавшего только после смертельного выстрела, который оставил султана мертвым. Несмотря на непопулярность Османской династии после Великой войны, султан Абдюльмесид II и остальные члены Оттоманской королевской семьи были поддержаны силой Энтенте и сохраняли относительно стабильную империю."
 worldnews.1.a: "Как ужасно!"
 ###
 worldnews.2.t: "Черная среда."
 worldnews.2.d: "В течение некоторого времени Лондонская фондовая биржа находилась в упадке. Никто не мог отрицать новый мировой спад, который имел место. Однако они не могли предсказать полного и полного краха Лондонской фондовой биржи. К часу валюта теряет свою стоимость, и хлеб в Центральном Лондоне стоит сейчас примерно 1700 фунтов стерлингов. Весь мир парализован этой трагедией, и уже ослабленные государства теперь сталкиваются с перспективой полного и полного краха. Некоторые страны уже работают над тем, чтобы обратить вспять последствия новой «черной среды», но сомнительно, что страны мира смогут оправиться, не принимая каких-либо крайних мер. Это расстроит и без того хрупкое плавание мира?"
 worldnews.2.a: "Боже, помоги нам всем..."
 ###
 worldnews.3.t: "Ремилитаризация Константинополя"
 worldnews.3.d: "После убийства бывшего султана Абдюльмесида II многие группировки в Турции боролись за власть, и среди них появились Туранцы, возглавляющие Хюсейина Нихал Бея. Одной из его первых целей на посту была ремилитаризация Константинополя, который был объявлен демилитаризованной зоной силами Энтези после окончания Великой войны. Многие во всем мире беспокоятся, может ли это стать подъемом реваншистской Турции. Источники говорят, что Греция также была брошена в безумное состояние этим событием, планируя свой следующий шаг."
 worldnews.3.a: "Волнуюсь."
 ###
 worldnews.4.d: "Несколько часов назад Франция объявила Парижскую колониальную выставку открытой после нескольких месяцев обширного планирования. Франция, столкнувшись с чрезмерным пятном за свои колониальные владения из других стран, таких, как Германия и СССР, решила провести фестиваль, посвященный показу огромных ресурсов ее колоний среди множества других субъектов. Несмотря на осуждение со стороны немецкого и советского правительств, в этом мероприятии приняли участие многие другие страны, особенно другие страны, обладающие колониями. Тем не менее, это мероприятие планируется продолжить еще несколько месяцев до тех пор, пока оно не будет закрыто по усмотрению Франции."
 ###
 worldnews.5.d: "В неожиданный поворот событий Французская Республика потерпела переворот со стороны своих военных прошлой ночью, это событие было объявлено Филиппом Петеном вскоре после того, как французские военные подразделения захватили различные правительственные здания и задержали несколько ранее управлявших политиками. ~ В то время как Франция не смогла противостоять Германии на протяжении всех своих дипломатических противостояний за последние несколько месяцев, несомненно, не встретила энтузиазма со стороны французских военных. Полевой маршал Филипп Петен и адмирал Франсуа Дарлан организовали военный переворот, полагая, что, если Франция позволит продолжить немецкий прогресс по всему континенту, Франция в конечном итоге не сможет поставить их под сомнение. Тем не менее можно с уверенностью сказать, что Франция будет более уверена в своей дипломатии в предстоящие месяцы."
 ###
 worldnews.6.d: "В последние недели ряд неудачных решений, принятых недавно избранным правительством Австрии, привел к вспышке хаоса внутри страны. Похоже, что немецкий фюрер Адам Дрезслер хотел воспользоваться ситуацией. Без какого-либо официального предупреждения немецкие войска въехали в Австрию, захватив несколько ключевых мест с целью «соблюдения порядка в регионе». Австрия вскоре была полностью помилована Германией, которая, как это ни странно, не ожидала."insisted" that the Austrian Nationalrat held a vote concerning the unification of the two nations 'for the sake of mutual security'. The results were decisively Pro-Union, with 106 out of the 165 members of the Nationalrat ruling in favour of Union. However, the honesty of the vote is dubious, as the ruthless German Thuleschutztruppe was heavily present in the Nationalrat during the vote."
 ###
 worldnews.7.d: "История Килевой зоны была невероятно бурной с момента ее создания. В 1927 году восстание первого Гамбургского коммуны, которая почти одержала победу над датскими оккупационными силами, было едва побеждено из-за сочетания плохой организации от имени коммуны и нескольких удач от имени датчан."
 ###
 worldnews.8.d: "После потери РКП на парламентских выборах 1936 года новое советское правительство стремилось установить более прямой контроль над ССР Советского Союза. Несмотря на массовое влияние на соответствующие ССР Советского Союза, похоже, что этот проект был успешным. Советский Союз был эффективно централизован и теперь является единой нацией, в отличие от различных ССР, которые подбросили Евразию до указанной централизации. Эксперты утверждают, что это всего лишь вопрос времени, прежде чем новый Супергиант начнет перестраивать свои силы на других соседей."
 ### Literature
 worldnews.13.t: "Эрнест Раймонд - четвертый Рим"
 worldnews.13.d: "Вне зависимости от того, что произошло с английским романтиком Эрнестом Раймондом, он выпустил свою новую книгу «Четвёртый Рим». Это стало последним крупным делом альтернативной истории Британской империи и имело заметное культурное преимущество для народов различных наций. «Несмотря на то, что роман распространяется вокруг продолжающихся военных действий между Великобританией и Францией после 1890-х годов, общая точка расхождения заключается в том, что немецкий император Фридрих III никогда не принимал привычку курить в 1880-х годах. Вражде между Великой и Францией было бы достаточно для того, чтобы сделать так, чтобы британцы могли использовать свое наследие для борьбы с Францией, и выжить немецкий император Фридрих III помогали улучшить отношения между Великой Ирландией и Германией, проложив путь к альянсу между двумя сторонами. Франция, однако, смогла совокупить Италию и Россию в свою собственную привычку."
 worldnews.13.a: "Какая детская фантазия."
 worldnews.14.t: "Эрик Блэр - тени революции"
 worldnews.14.d: "Англиканский писатель, известный как Эрик Блэр, выпустил «The Tides of Revolution» («Тиды революции») в начале сегодняшнего дня, сюжет которого часто воспринимался как шокирующий и противоречивый со стороны подавляющего большинства населения имперского общества. «Действительная история о британской дружелюбной дружбе с «Фрайпактом» («The Tides of Entente» 66/; «Схватка мира» победила Великую войну, но ценой огромных потерь.» — «Недостаток американских государств во всем мире»."
 worldnews.14.a: "Он пытается сделать эту Вселенную настолько плохой, насколько это возможно?"
 worldnews.15.t: "Андре Малро - Нож в письме"
 worldnews.15.d: "Спорный рассказ французского писателя Андре Малро о будущем времени недавно достиг полки Франции, изображая сценарий нового мирового порядка после Второй Великой Войны. Несмотря на то, что история озвучивала в мире диктоватую дерзкую историю о том, что американский человек выжил на разделенном среднем западе в мире, запертом в ядерном застое. В это время Немецкий Рейх идет на войну и успешно побеждает мексиканское государство и берет под контроль Западную Европу. На восточном фронте, когда хаос разделяет русские силы, Советский Союз тоже очень быстро падает, заставляя Штальпакта господствовать над всем европейским континентом. Тем временем, в Новом мире, расколотый и плохой Соединенные Штаты впадают в реваншистское мексиканское государство, федеральное правительство рухнуло и захватывает контроль над Западной Европой. На восточном фронте, в то время как хаос, в то время как поднимается на сторону русского влияния в Новом мире, он вступает в конфликт с Британской империей империей. Вой войны замедляется в падение в падение, до тех пор, пока Германия не создаст полный мир, когда она творит, а Германия творит с другим оружием."
 worldnews.15.a: "С каких это пор Псевдо-научная фантазия так популярна?"
 worldnews.16.t: "Эрнест Раймонд - Цезарьрих"
 worldnews.16.d: "В 1915 году американский герцог, называющий себя «дьяволом» и имеющий заметный культурный эффект для народов различных наций. Ничего, история — это эмоциональная история о жизни германско-американского ветряного ветерана, пытающегося жить в пострадавшей и побежденной Великобритании. В этот момент плохая европейская революция, ведущая к окончанию подводных герцогств в 1915 году, привела к потоплению американского ганского режима и в конечном счете к вступлению Америки в Германию во Великую Войну и победе для центральных держав после длительной войны, которая заканчивается совместным германо-американским блокадом Британских островов, но не до того, как Австрия и Венгрия стали открытой. В этот период цеплялись за грязную революцию, ведущую к окончанию австрийской монастыря и к рождению дануцкой социалистической федерации. В качестве авторитарной хунты они берут под контроль гражданское правительство в том, что осталось от Соединенного Королевства, новорождное ультранационалистское движение захватывает Италию как Марко Брескиль, который проповедует себя и пытается, и пытается, оставляют в Древа, оставляют в Древа, остановку, оставляющуюся в Древа, как остановку."
 worldnews.16.a: "Какая детская фантазия."

 ### Italy
 worldnews.20.t: "Коммунистическое победоносное большинство на выборах в Италии"
 worldnews.20.d: "В неожиданной победе Коммунистическая партия одержала победу на выборах 1936 года в Италии. Хотя результаты весьма противоречивы, можно найти маленький случай мошенничества. Экономическая катастрофа Черной среды подтолкнула многих итальянских избирателей на крайние цели политики. Это не остановило многих справа от протеста против их победы. Коммунисты имели долгую историю, вызывая социальные беспорядки в Италии с требованиями радикальных социальных и правовых изменений. Многие обеспокоены тем, что это может быть окончанием итальянской демократии, как мы это знаем, и даже утверждением о том, что лидер партии Антонио Грамши, который, по слухам, имеет связи с Советским Союзом, может создать единое партийное государство. Эти выборы в значительной степени обесценили как Энтезию, так и Западную Европу в целом."
 worldnews.20.a: "Революция идет на запад!"
 #
 worldnews.21.t: "Либералы поддерживают большинство на выборах в Италии"
 worldnews.21.d: "Несмотря на то, что Партии Либеральности удалось отстоять и выиграть выборы в Италии 1936 года, после того, как «Черная среда» разорвала поддержку партии, но для основного итальянского избирателя либералы рассматриваются как самая разумная и практичная партия перед лицом постоянно меняющегося мира. Это будет несколько лет впереди Луиджи Эйнауди и его партии. Коммунисты винят его экономическую политику «Лайссез-Файр» за недавнюю депрессию, влияющую на Италию, в то время как правое крыло критикует его правительство за слабость и неэффективность. Несмотря на это, Либеральная партия будет оставаться основой итальянской политики в течение некоторого времени."
 worldnews.21.a: "Миру нужны более разумные политики."
 #
 worldnews.22.t: "Прогрессивное большинство на выборах в Италии"
 worldnews.22.d: "Партито Социал-демократический был признан единственной партией, способной победить Партито Либералий на выборах 1936 года, и после трудной предвыборной кампании они вышли победителями. Чёрная среда показала многим итальянцам, что либеральная экономика не сможет обеспечить экономическую стабильность в стране. Многие центристские избиратели, которые разочаровались в либералах, рассматривают социал-демократов как единственную разумную реформистскую партию в Италии. Даже некоторые из более умеренных коммунистов признают, что тихая победа может привести к столь необходимым реформам. Сейчас, когда у власти, мы надеемся, Прогрессивные выполнят свои обещания и введут систему социального обеспечения в Италию."
 worldnews.22.a: "В трудные времена потребуется реформист."
 #
 worldnews.23.t: "Консервативы выигрывают большинство на выборах в Италии"
 worldnews.23.d: "В непредвиденном исходе Партито Пополяре лидер Луиджи Стурцо победил на выборах 1936 года в Италии. Большинство коммунистов и левых в ярости от результатов, и многие уже начали протестовать на улицах. Луиджи Штурцо, похоже, не беспокоится об этом и обещает «консервативно вести дела» с экстремистами, угрожающими стабильности Италии. &lt; &lt; Штурцо &gt; &gt; имеет давнюю историю угрозы насилия в отношении левых и в Италии, которая, похоже, на грани коммунистического восстания, многие видят его единственным человеком, который может гарантировать свое спасение. &lt; &lt; Консерваторы &gt; &gt; обещают развивать итальянские колониальные территории и степные отношения с Великобританией и ее Империей и с внутренней стороны они обязуются защищать традиционную итальянскую культуру и вести нацию к экономическому восстановлению."
 worldnews.23.a: "Миру нужны смелые лидеры."
 worldnews.24.t: "Армия взяла под свой контроль Италию"
 worldnews.24.d: "Итальянские выборы, направленные на определение подходящего правительства, заставили военных, возглавляемых Итало Бальбо и Пьетро Бадоглио, выйти на улицы Рима и штурмовать здание парламента. Большинство депутатов, участвовавших в перевороте, в то время как те немногие, которые пытались противостоять, главным образом коммунистические, были вытащены наружу и казнены расстрелом. Франция и Англия протестовали против переворота и еще не признали новое правительство. Теперь, когда итальянские военные захватили контроль над некоторыми лидерами, такими как Луиджи Капелло, героем Великой войны, предлагают быстро восстановить гражданское правительство, а Пьетро Бадоглио вместо этого предложил пригласить третьего герцога Савой-Аоста, Амедео, стать главой государства, но слухи о том, что Итало Бальбо может использовать свое новое влияние, чтобы объявить себя диктатором или амедео."Duce" of Italy."
 worldnews.24.a: "Это действительно трудное время для Италии."
 #
 worldnews.25.t: "Коммунистическая кубок в Италии"
 worldnews.25.d: "Итальянская коммунистическая партия прибегла к многочисленным реформам, чтобы помочь Италии восстановиться, но оппозиционные партии успешно заблокировали свое законодательство. Массовая безработица привела к тому, что многие люди поддерживают коммунистов, и с петициями в любое время они начали переворот. При предполагаемой поддержке со стороны Советского Союза Антонио Грамсчи вел сторонников на улицы Рима, и оттуда, при поддержке местных армейских дивизий, легко могли занять большинство правительственных зданий. После короткого, но напряженного противостояния бывшее правительство сдалось коммунисту, чтобы избежать полномасштабной гражданской войны. Теперь, когда коммунисты контролируют многие радикальные реформы как итальянской культуры, так и экономики, ожидается,"
 worldnews.25.a: "Революция идет на запад."
 #
 worldnews.26.t: "Коммунистический кубок не срабатывает в Италии"
 worldnews.26.d: "Итальянская коммунистическая партия прибегла к многочисленным реформам, чтобы помочь Италии оправиться, но оппозиционные партии успешно блокировали свое законодательство. Массовая безработица привела к тому, что многие люди поддерживали коммунистов, и с петициями в любое время они пытались совершить переворот. При предполагаемой поддержке со стороны Советского Союза Антонио Грамши имел ведущих сторонников на улицах Рима и оттуда боролся за захват зданий местных органов власти. Итальянская армия смогла оттолкнуть коммунистические силы и после нескольких часов борьбы с «Грамши» была найдена и арестована за измену. Это был серьезный удар по коммунистическому делу, не только в Италии, но и в Европе в целом."
 worldnews.26.a: "Истинная победа прагматической политики."
 #
 worldnews.27.t: "Итальянская армия удорожает Ливию"
 worldnews.27.d: "При резком изменении колониальной политики итальянское правительство приняло решение отменить всю автономию, ранее предоставленную районам Ливии. Итальянские вооруженные силы приземлились во многих прибрежных городах и готовятся обеспечить соблюдение нового законодательства. Повстанческие группы всегда представляли собой экстремальную проблему в Ливии, однако рост враждебности почти наверняка приведет к увеличению числа ливийцев на их пути. Итальянское правительство обещает защитить безопасность всего населения Ливии, Италии или Ливии, и что тем, кто следует закону, не придется беспокоиться об увеличении военного присутствия. Большинство иностранных экспертов считают, что эти действия, несомненно, приведут к затяжному конфликту, который обойдется обеим сторонам очень дорого. Лишь время покажет, приведут ли эти радикальные меры к интеграции Ливии в более широкую Итальянскую империю."
 worldnews.27.a: "Надеюсь, это не будет признаком еще большей жестокости."
 #

 worldnews.203.d: "Разрушение Британии в социализме и конец Империи вызвали американскую попытку возродить старые притязания и отомстить за 1812 год. Эта попытка теперь вышла из-под контроля в общеконтинентальное состояние войны, в то время как Мексика объявила войну США. В то время как американцы смогли застать канадцев врасплох, это не было простой задачей марша, как они верили, и с мобилизацией Мексики и последующим объявлением войны США оказались в борьбе за выживание. Международные наблюдатели не уверены в исходе, с хорошо обученной, но небольшой армией Канады, большими ресурсами Америки, но слабыми военными, и слабостью Мексики в обоих аспектах, но сильным реванчистским духом, война, несомненно, будет динамичной. Все, о чем международные наблюдатели могут согласиться прямо сейчас, это то, что война, вероятно, будет затяжным конфликтом и результатом которой станет огромная потеря жизни."

 #

 worldnews.204.t: "Советский Союз Объявляет претензии"
 worldnews.204.d: "Сегодня Советский Союз объявил о намерении изменить эту ситуацию, претендуя на большую часть бывшей царской империи и за ее пределами. Многие восточноевропейские и белые нации спешно готовят оборону, ожидая того, что сейчас кажется неизбежным прибытием советской Орды. Ясно, что эра советской изоляции на Востоке, которая существовала под Ленином, наконец-то закончилась."
 worldnews.204.a: "Русский медведь проснулся от сна." 

 #

 worldnews.205.d: "То, что началось как очередная война между Венгрией и Румынией по поводу Трансильвании, вышло из-под контроля, и вмешались Сербия и Болгария, и теперь все Балканы поглощаются войной."

 #SA
 worldnews.50.d: "После волны гражданского недовольства и всепроникающей неспособности правительства обеспечить стабильную обстановку для боливийского общества, особенно после их поражения во время войны в Чако, несколько диссидентских групп, сформированных в горной стране."
 worldnews.51.t: "Гражданская война в Бразилии"
 worldnews.51.d: "В случае, которое никого не шокировало, Хаос и волнения вновь вспыхнули в Южной Америке. На этот раз, это южноамериканский гигант, Бразилия, разделённый внутренними проблемами."corrupt" Brazilian Republic in the west side of the country, in the south, traditionalists and nationalists group that have no loyalty for either the Republic or the socialist Insurgency have taken the matter into their own hands and risen as well.\n\nOne thing is for certain, this is the largest civil war the continent has seen in a long time, and its effects will be great."
 worldnews.51.a: "Стабильности больше не найти."
 worldnews.52.t: "Вторая война Летисии"
 worldnews.52.d: "История повторяет, когда перуанские и колумбийские страны мобилизуют свои силы и ссорятся в бою. Всего несколько лет назад простой пограничный конфликт в районе Летисии перерос в обширную войну, которая навсегда шокировала обе страны. ~n ~Нет, с подъемом радикального реванчистского правительства в Колумбии и агрессивной внешней политикой Перу, упорной борьбы за свою гегемонию, конфликт был неизбежным, и все, что произошло, возвращается в регион."
 worldnews.52.a: "Война - это болезнь."
 ### Germany
 worldnews.39.t: "Олимпийский комитет выбирает Берлина для проведения Олимпийских игр"
 worldnews.39.d: "[Это. "Глава газет"] / хватай мяч, набирай очки"
 worldnews.39.a: "Мы с радостью примем участие в этом году."
 worldnews.40.t: "Внешняя политика Германии - пангерманизм"
 worldnews.40.d: "В недавней речи канцлер Германии Адам Дресслер выступил с чудовищными утверждениями об объединении всех немцев под одним флагом. В особенно жаркий момент в своей речи Дресслер страстно заявил, что «все немцы будут воссоединены любыми необходимыми средствами». Это явная угроза суверенитету всех наций, которые граничат с Германией, но многие, такие как французский министр войны, уверены, что Дресслер вся лает и не кусается. Только время покажет, правильно ли эти надежды."
 worldnews.40.a: "Это скоро закончится."
 worldnews.41.t: "Франция поддерживает Австрию"
 worldnews.41.d: "Германия прислала ультиматум в Австрию, требуя аннексии рейха, в ответ на просьбу Австрии о военной поддержке со стороны Контенте, хотя многие сочли, что Франция вряд ли выбрала защиту независимости Австрии. Мир держит дыхание, когда эти две мировые державы готовятся к войне. Надеюсь, мирное решение можно быстро найти."
 worldnews.41.a: "Зачем умирать за Дюрнкрута?"
 worldnews.42.t: "Франция поддерживает Данию"
 worldnews.42.d: "Германия отправила в Данию ультиматум с требованием провести референдум, чтобы определить, какая страна должна принадлежать немецкому народу в Гольштейне. В ответ Дания попросила военную поддержку у Константи. Хотя многие сочли, что Франция вряд ли выбрала защиту суверенитета Дании. Мир держит дыхание, когда эти две мировые державы готовятся к войне. Надеюсь, мирное решение можно быстро найти."
 worldnews.42.a: "Зачем умирать за Данию?"
 worldnews.43.t: "Германия аннексирует Рейн"
 worldnews.43.d: "Прошлой ночью, когда пришли результаты референдума по Рейнленду, Рейнленд снова станет частью Германии. Шокирующие результаты вызвали много споров. Во Франции жалобы на мошенничество в выборах со стороны ринишской Валькистской партии стали все более распространенными, но нет никаких существенных доказательств. Сегодня кажется, что баланс сил в Европе постепенно перешел в пользу Германии."
 worldnews.43.a: "По-настоящему неловкий поворот событий для Франции."
 worldnews.44.t: "Франция поддерживает чешское государство"
 worldnews.44.d: "Франция объявила, что она окажет поддержку чешскому государству в борьбе против Германии. Немецкий национализм в приграничных районах Чехии импровизировал Германию для принятия мер по аннексии этих регионов. Правительство Чешского государства, ослабленное множеством внутренних проблем, обратилось к французскому правительству с просьбой оказать им военную поддержку в случае, если между ними и Германией вспыхнет война. Министр иностранных дел Франции заявил: «Мы не можем позволить немцам реорганизовать Европу по прихоти»."
 worldnews.44.a: "Зачем умирать за Дечина?"
 worldnews.45.t: "Франция поддерживает балтийские государства"
 worldnews.45.d: "Германия прислала ультиматум нескольким балтийским государствам, требуя представления рейху, ссылаясь на Ливонский притязания на регион и на присутствие немецких меньшинств, нуждающихся в защите от Красной угрозы. В ответ Латвия и Эстония попросили об оказании военной поддержки. Удивительно, что французское правительство объявило о своей поддержке балтийских государств."
 worldnews.45.a: "Зачем умирать за Ригу?"

 ### World News (Wars)
 worldnews.100.d: "После нескольких месяцев напряженных дипломатических противостояний и враждебных отношений между Французской Республикой и Германской империей война наконец-то вспыхнула между двумя нациями. Многие считали, что это неизбежно после заключения мирного договора, расчленившего Германию, и последующего подъема валькистов, это стало неожиданностью, когда новости транслировались по радио в нескольких странах. Несмотря на то, что официальное объявление войны было отправлено всего несколько дней назад, боевые действия уже были значительными в районах, граничащих с Францией и Германией. Что бы ни приводило к этой войне, судьба Европы будет решена, и одного этого может быть достаточно для того, чтобы затащить в другие страны, заинтересованные в восстановлении статуса-кво."

 worldnews.101.t: "Революция в Османской империи!"
 worldnews.101.d: "Похоже, страна вспыхнула в гражданской войне из-за недавних реформ нового султана Османа IV, который хочет укрепить власть в руках султана и &quot; правых ошибок &quot; Великой войны. Это явно подтолкнуло его политическую оппозицию (главным образом туранцев и кемалистов) на грань, которая мобилизовала население и встала на борьбу против правления тиранического лидера, объявляя себя истинными наследниками Османской империи. Такое событие является большим и может угрожать стабильности на Ближнем Востоке. Что бы ни случилось, это, несомненно, решающий и переломный момент в истории Оттомана."
 worldnews.101.a: "Боже мой!"
 worldnews.103.t: "Революция в Турецкой Республике!"
 worldnews.103.d: "Похоже, что страна вспыхнула в гражданской войне из-за недавних реформ нового президента Исмета Инёню, который хотел бы модернизировать и оживить страну, вытащив ее из тёмных веков. Это, очевидно, подтолкнуло его политическую оппозицию (в первую очередь традиционных активистов, поддержавших ныне мертвую Остоманную империю) на край, которая мобилизовала население и вела борьбу против правления лидера, объявляя себя наследниками Османской империи. Такое событие является большим и может угрожать стабильности на Ближнем Востоке. Что бы ни случилось, это, несомненно, решающий и переломный момент в турецкой истории."
 worldnews.103.a: "Боже мой!"
 ###
 worldnews.137.d: "В начале этой недели между французскими и британскими империями усилилась дипломатическая напряженность, когда французское правительство заказало строительство нескольких прибрежных крепостей вдоль их северного побережья и активно проводило антибританскую внешнюю политику. В то время как полномасштабная война между этими двумя титанами не представляется вероятной, мир остановился и задержал свое коллективное дыхание, чтобы наблюдать за исходом этого события."
 WORLD_FRA_ENG_tensions: "Англо-французская напряженность"
 ###
 worldnews.138.d: "По мере того, как в Испании бушует гражданская война, небольшая группа французских морских пехотинцев оккупировала Канарские острова в течение 24 часов. Сейчас острова находятся под управлением французской военной администрации, и Морская национальная морская блокада была установлена вокруг острова. Французы заявили, что вторжение было направлено на обеспечение того, чтобы острова не были разрушены испанской гражданской войной, и что местное население просило иностранной защиты от правления фалангистов. Однако все стороны испанской гражданской войны выразили свое возмущение по поводу иностранной державы, аннексирующей их территорию."
 ###
 worldnews.139.d: "Вот уже более двух лет гражданская война бушует в Испании и уничтожает страну. Недавно левые группировки, базирующиеся в Барселоне, набирали верх и толкали другие остающиеся группировки далеко в сельскую местность. В связи с таким поворотом событий французское правительство объявило об операции по захвату горных пересечений, пересекающих франко-испанские границы, чтобы, по их словам,"Safeguard the Spanish people living in and around the Pyrenees from the devestation of the civil war".\n\nFew are fooled by this deception however, and it is clear that the purpose of this operation was to seize important border regions which the Spanish could have potentially used in a future invasion of Southern France. Once more, all Spanish factions have expressed their outrage at the French picking apart their country while it goes through this period of great turmoil."
 ###
 worldnews.140.d: "После возрождения авторитарного и милитаристского режима во Франции бельгийское правительство было вынуждено сдать регион Валлония и признать французскую гегемонию над регионом. Бельгийское правительство, не способное справиться с силой Французской империи, не имело иного выбора, кроме как отказаться от региона и бежать с хвостом между ног. Французе сообщили, что это является яркой победой европейской политической стабильности, а также объявили о дальнейших планах экспансии, которые идут в прямом конфликте со многими другими европейскими странами. Несмотря на то, что несколько пробельгских восстаний в Валлонии были раздавлены передовой французской армией, многие члены международного сообщества осудили их как массовые убийства местного населения, баланс сил в Европе еще больше повернул в сторону Франции, и независимость региона Бенелюкс, похоже, вновь оказалась под угрозой."
 worldnews.140.a: "Бельгийский льв не совпадал с французским петухом." #wow that sounds fucking dumb
 ###
 worldnews.141.d: "В регионе Бенилюкс растет число центов, поскольку французские требования в отношении региона Валлония из Белигума были встречены с сильным дипломатическим сопротивлением. Новые сообщения пришли, заявив, что сама Великобритания обрела независимость Бельгии и обещала им полную военную поддержку, если французы решат предпринять военные действия."
 worldnews.141.a: "Разве они не могут просто поговорить за чаем?"
 ###
 worldnews.202.t: "Германия отзывает Версаля"
 worldnews.202.d: ""
 worldnews.202.a: "Темные облака плывут над Европой..."
