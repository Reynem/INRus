 # Congo Partition #
 ################
 worldnews.144.t: "Франция и Великобритания Оккупируют Конго"
 worldnews.144.d: "В результате гражданской войны в Бельгии представители министерств иностранных дел Франции и Великобритании объявили о совместной оккупации бельгийской колонии в Конго. Африканская колония богата ресурсами, и оккупация состоит в том, чтобы предотвратить ее попадание в социалистические руки или провозглашение независимости вообще. Представители обоих правительств заявили, что эта оккупация не будет окончательной, и что колония может быть возвращена Бельгии после окончания конфликта, хотя внешние наблюдатели скептически относятся к тому, что обе империи когда-либо серьезно подумают о том, чтобы освободить эту территорию."
 worldnews.144.a: "Снова удалось избежать кризиса!"
 worldnews.144.b: "Похоже, империализм жив и здоров в мире."

 worldnews.145.t: "Франция оккупирует Конго"
 worldnews.145.d: "В связи с гражданской войной в Бельгии представители французского министерства иностранных дел объявили о немедленной оккупации бельгийской колонии в Конго; африканская колония богата ресурсами, и односторонний характер оккупации направлен на то, чтобы не допустить ее попадания в социалистические руки или провозглашения независимости вообще; представители французского правительства заявили, что эта оккупация не будет окончательной и что колония может быть возвращена Бельгии после окончания конфликта, хотя внешние наблюдатели скептически относятся к тому, что империя когда-либо серьезно подумает о том, чтобы освободить территорию."
 worldnews.145.a: "Французская империя становится все сильнее!"
 worldnews.145.b: "Они пожалеют об этом..."
 worldnews.145.c: "Похоже, империализм жив и здоров в мире."

 ################
 # Centroamerica Annexes Honduras #
 ################
 worldnews.146.t: "Гондурасский центр &lt; &lt; Центрамерика &gt; &gt;"
 worldnews.146.d: "Сегодня Великая Республика Центрамерика аннексировала соседнюю нацию Гондураса, положив конец более чем столетию борьбы страны за независимость и распространение социализма по всей Центральной Америке. Это происходит через несколько недель после того, как социалистическое правительство взяло на себя руководство парламентом Гондураса, и новая объединённая нация уже поклялась противостоять «американскому империализму» и распространить ценности социализма на остальной части Америки."
 worldnews.146.a: "Великая Республика становится сильнее!"
 worldnews.146.b: "И социализм распространяется..."

 #################
 #  Afghanistan  #
 #################

 worldnews.200.t: "Афганские солдаты пересекают Дюранскую линию"
 worldnews.200.d: "Несколько часов назад, до всего мира дошли сообщения о том, что афганская армия идет в северо-западную пограничную провинцию Британской Индии, судя по всему, в ответ на продолжающееся восстание в Индии."
 worldnews.200.a: "Разгневанный!"
 worldnews.200.b: "Ещё беды в Индии?"

 worldnews.201.t: "Четвертая англо-афганская война"
 worldnews.201.d: "Несколько дней назад до остального мира дошли сообщения о том, что афганская армия идет в северо-западную пограничную провинцию Британской Индии, судя по всему, в ответ на продолжающееся восстание в Индии. В результате ситуация в северо-западной пограничной провинции Британской Индии превратилась сейчас в полномасштабную войну между Афганистаном и Британской империей. /n/n множество пытаются предсказать исход этой войны, при этом некоторые говорят, что Афганистан будет раздавлен за свою жадность. Некоторые, с другой стороны, говорят, что Британской империи уже слишком многое предстоит сделать для того, чтобы добиться победы над афганцами."
 worldnews.201.a: "Давайте посмотрим, что происходит."


 ####################
 #                  #
 #Imperial Nostalgia#
 #                  #
 ####################

 worldnews.206.d: "В то время как Великая Война увидела решающую победу Великобритании, Вторая Великая Война стала свидетелем того, как Великобритания отошла в свою островную крепость, не имея возможности проникнуть в доминирующий в Германии континент, угрожающий Британии из-за границы. Между тем, немцы сильно боролись под жесткой британской морской блокадой. В свете этого, Великобритания приняла немецкие призывы к переговорам о перемирии с немцами, и они были успешными и был подписан полный мирный договор."

 worldnews.207.d: "До шока мира Мексика победила американские войска и подписала мирное соглашение о передаче обширных участков территории на юго-западе. Цены на нефть продолжают расти во всем мире, поскольку огромные нефтяные поля юго-запада превращаются из поля битвы в цель для американского сопротивления. ~ ~ Несмотря на то, что американская армия и правительство разрушаются, а население бунтует, кажется, что этот результат не изменится ни в какое время. Однако пока не видно, насколько эффективно Мексика сохранит контроль над регионом, поскольку она сталкивается с демографическим кризисом, поскольку регион почти полностью англоязычен, а население Мексики находится в регионе в минуту."

 worldnews.208.d: "К шоку немногих, американский жгуннаут положил конец мексиканской угрозе и полностью оккупировал свой южный сосед. Цены на нефть постепенно возвращаются в нормальное состояние после того, как нефтяные месторождения США были превращены в поле битвы, при этом многие опасаются, что это будет долгосрочным состоянием дел в случае мексиканской победы. ~ Несмотря на то, что для реконструкции после разрушения войны потребуются значительные усилия, прогнозируется, что США вскоре вернутся на международную арену, омоложения."

 worldnews.209.d: "С тех пор, как началась Великая Депрессия и мексиканское клиентское государство США успешно провозгласило независимость, США вели на Филиппинах войну с повстанцами низкого уровня. Хотя их участие в крупной войне в значительной степени сдерживалось, это дало филиппинцам прекрасную возможность для всеобщего восстания. Это произошло сейчас, когда государство Филиппины было объявлено в Маниле. Немногие ставят под сомнение способность США остановить такое восстание, поскольку они сильно отвлекаются от своих других обязательств. В любом случае, ясно, что острова будут видеть кровь."

 worldnews.210.d: "После победы во второй Великой войне Франция начала оказывать давление на страны Европы в сфере своего влияния." #christ who wrote this

 worldnews.211.d: "В течение нескольких месяцев Великобритания пребывала в хаосе, многие верили в то, что дни Британской империи заканчиваются. С революционерами на улицах, военным мятежом и противостоянием между лояльными и мятежными армейскими элементами, сейчас Великобритания вспыхнула в гражданской войне. Когда-то мирная и спокойная островная нация была настигнута кровожадной яростью, сосед против соседа, отец против сына, забирая жизни друг друга за то, что они выступают в поддержку как реакций, так и революции."

 worldnews.212.d: "В конце Великой войны старая Остоманская империя была разделена по Севрскому договору, с восстанием турецких националистов, против как османского правительства, так и договора, решительно раздавленной вмешательством Энтенте. Убийство Абдюльмесида II предвещало революцию в политике [TUR.GetAductive Cap], которая привела к тому, что турки движутся по ревауншистскому пути. ~ ~ ~ После большой борьбы, против армян, грузин, греков, французов, ливанцев и итальянцев, Анатолия снова находится под прикрытием [TUR. GetAdquitive Cap]. Теперь, с новой потенциальной великой силой на мировой арене, нации Балкан и Аравии опасаются, что они станут следующей мишенью правительства Константинопола."

 worldnews.213.d: "Хорошо известно, что этнические разногласия разрывались между Западославией с момента ее зачатия, и даже до этого, когда она была всего лишь Чехословакией. Несмотря на то, что она была штатом для западных славян, самой большой этнической группой в стране были немцы, государство имело враждебные отношения со своим северо-западным славяным соседом, Польшей, и даже среди входящих в нее наций, словаки и многие чехи были неинтуссиозны в отношении мечты Западослава. ~ nn nn that that is is by peads by speed years concerned as with the Zapadoslavia down. Словаки объявили независимость, поляки переехали в Западную Галицию, немецкая Силезия разорвалась, и правительство в Брно было перевезено в Прагу и реформировано в чешское государство."

 worldnews.214.d: "Серия событий привела к жарким бельгийским выборам, в ходе которых к власти пришла националистическая коалиция с Леоном Дегрелем в качестве своего самого старшего партнера. Обвинения в вмешательстве Германии и запугивании избирателей широко распространены, но мало что изменило тот факт, что они сейчас у власти. Дни бельгийской монархии теперь пронумерованы, так как в Амстердаме есть и надежда, и озабоченность по поводу голландских националистических элементов в коалиции, и по поводу того, являются ли они моими друзьями или противниками."

 worldnews.215.d: "В первые часы [? global.date.getDateStringNoHourLong] общее нападение на швейцарскую границу началось с французских и итальянских сил, вступающих в контакт со Швейцарией. Это происходит после периода напряженности между западноевропейскими державами и ультиматиумом Швейцарии, чтобы передать французскую и итальянскую говорящую территории своим соответствующим странам. Их отказ привел к совершенному нападению на "Entente". ~ Нн Фью питает большие надежды на швейцарские власти, поскольку нападение двух великих держав на всем южном и западном фронте — это не что-то даже готовое, а швейцарцы, скорее всего, смогут удержаться. Лондон и Берлин смотрят на Швейцарию с надеждой на то, что они смогут убить французских и итальянских сухожих в Альпах, но нет никакой реальной надежды на швейцарскую победу."

 worldnews.216.d: "Выборы националистов в Болгарии отражали неизменную надежду болгарского народа на то, что их нация может вновь стать великой и что может быть создана большая Болгария. Последние остатки этой надежды исчезли, так как Болгария попала в гражданскую войну после недавнего военного поражения. / nhhortly после ее поражения Болгария была взята на себя военным правительством, которое теперь должно бороться с Фронтом Отечества, социалистическими революционерами, стремящимися сделать Болгарию красной. Соседи Болгарии, похоже, довольны сидящими и наблюдающими за тем, как она разрывается на части, рады, что то, что могло быть угрозой, сейчас просто неудачное государство."

 worldnews.217.d: "Окончание Великой войны стало причиной полного военного краха Болгарии, так как после того, как Берлин разорвал армию, армия впала в полный бунт. В Договоре Нойлли-сюр-Сейн Болгария была оторвана от конечностей своими соседями и оставлена в качестве слабого государства в углу Европы. ~ После политической слабости в 1920-х годах, в 1934-х годах был избран молодой Дочев и его реваншист НРП, однако их правление было далеко от безопасности. После большого политического хаоса и насилия НРП наконец-то смогла обеспечить полную власть над болгарской нацией. Болгарская Республика пришла к концу, и вместо нее новое болгарское государство готово привести болгарский народ к восстановлению Большой Болгарии."

 worldnews.218.d: "Гражданская война в Испании наконец закончилась, и кажется, что [SPA.GetNameDef] стала триумфальной. Большая часть сельской местности находится в руинах, и порядок не был полностью восстановлен, но правительство [SPA.GetAductive] объявило о том, что старый феодальный порядок наконец-то покоится, и что народ Испании теперь выиграет от упорядоченного перехода к социалистическому режиму. ~nnnmasive толпа, собравшаяся в Барселоне, чтобы приветствовать возвращающихся боевиков и предложить молитву о том, что новый мир превратится в постоянный. Это также победа для советов, которые поддерживали социалистические испанцы на протяжении всего конфликта."

 worldnews.219.d: "Испанская гражданская война наконец закончилась, и кажется, что [SPF.GetNameDef] стала триумфальной. Большая часть сельских районов находится в руинах, и порядок не был полностью восстановлен, но правительство [SPF.GetAductive] объявило, что Альфонсистские, республиканские и социалистические угрозы были окончательно устранены. Хотя Карлистско-Фалангистская коалиция выиграла войну вместе, мало кто верит, что у нее есть надежды на то, что она выживет. Мало кто верит в то, что настанет еще один конфликт, хотя и политический конфликт, чтобы увидеть, какая фракция придет к власти. Ни в свою очередь Хавьер И де Борбон-Парма объявил день праздника, заявив, что справедливость наконец-то была отдана испанским притворцам и что Карлистская королевская линия является шагом к тому, что должно быть. Между тем, Хосе Антонио Примо де Ривера объявил победу триуму для новой Испании, который станет постоянным в ближайшее время."

 worldnews.220.d: "Испанская гражданская война наконец закончилась, и кажется, что [SPM.GetNameDef] стала триумфальной. Большая часть сельской местности находится в руинах, и порядок не был полностью восстановлен, но правительство [SPM.GetAductive] объявило, что националистические, республиканские и социалистические угрозы были окончательно устранены и вряд ли в скором времени восторжествуют."

 worldnews.221.d: "Гражданская война в Испании наконец закончилась, и кажется, что [SPR.GetNameDef] стала триумфальной. Большая часть сельских районов находится в руинах, и порядок не был полностью восстановлен, но правительство [SPR.GetAdquestiative] объявило, что реакционные и социалистические угрозы были окончательно устранены. Почти все стороны в начале конфликта окружили победу республиканского испанского, несомненно, замечательны."

 worldnews.222.d: "В конце Великой войны Венгрия провозгласила независимость, и Австро-Венгерская империя развалилась, и Западославия стала новой высшей державой, хотя и шаткой, в Центральной Европе. С восхождением Карла I дома Хабсбург-Лоррена на венгерский трон, благодаря Хорти, многие подозревали, что это может измениться, и после периода отрицания статуса австрийской элиты и избирательного процесса Австрия-Венгрия возвращается на карту. Несмотря на то, что Бёрлин с презрением смотрит на юг, как будто тюрьма народов и барьер для пангеранского единства каким-то образом вернулись. Окруженные враждебными соседями со всех сторон, как слабыми, так и могущественными, у габсбургской монархии и ее народа есть проблемы на несколько лет впереди, особенно если они хотят вернуть империю к ее прежней славе."

 worldnews.223.d: "Во время выступления в Табризе, Реза Хан, военный диктатор Ирана, взорвал бомбу под платформой, на которой он стоял. В то время, как он шел в больницу, было мало что можно сделать, и ровно 13 лет спустя после того, как власть Резы Хана как диктатора на всю жизнь закончилась. Несмотря на то, что нация скорбит, это знаменует собой новую эру в иранской политике, где мало кто может предсказать, куда страна может направиться в предстоящие месяцы. Это также является высоким водным знаком для послевоенной ближневосточной нестабильности, что является вторым убийством главы государства на Ближнем Востоке в этом году, всего лишь через несколько недель после стрельбы Абдюльмайда II, что также привело к значительным изменениям в политике [ТУР. Гетнаме]."

 worldnews.224.d: "С момента поражения Франции во второй Великой войне страна страдает от периода больших гражданских волнений и насилия, гнева на мертвецов за то, что всенародно воспринимается как бессмысленная война, наряду с полным отсутствием веры в французскую правящую элиту, привели к полному развалу порядка в стране. Несмотря на то, что это насилие и беспорядки теперь организованы вокруг контрэлита, и теперь принимают форму революции, во всей северной части Франции сформирован сплоченный социалистический фронт и провозглашено новым правительством Франции. В настоящее время насилие во Франции усилилось в безумии по мере начала боевых действий, и началась последняя битва за Францию."

 worldnews.225.d: "После падения династии Цин в 1911 году и неудачной попытки Юана Шикаи объявить себя императором в 1915 году Китай был расколот на штаты военных баронов, и лишь несколько из них заявили о том, что они являются законным правительством Китая."

 worldnews.226.d: "Так как несколько лет назад многие страны наконец оправились от Лондонского фондового рынка, мир вновь потерпел еще один экономический кризис, этот - результат нехватки черного золота. Несмотря на то, что мексиканские армии вступают дальше в американский юго-запад, дипломатическая революция произошла на Американском континенте с падением доктрины Монро. Многие считали это ограниченным по своим масштабам и считали себя незащищенными от последствий войны. Теперь, когда нефтяные поля Америки являются сражением между двумя странами, гордость более широкого мира оказалась фатальной. / Несмотря на это, многие другие нефтедобывающие страны во всем мире извлекли пользу из этого кризиса, в частности Советский Союз, государство, которое широко воспринимается как уязвимое к атаке, чье почти фатальное отсутствие индустриализации теперь было компенсировано кавказской нефтью."

 worldnews.227.d: "Сражение за Францию окончено, и в восточной Франции под германской оккупацией немецкий флаг гордо махал из Эйфелевой башни над городом света, и французская армия избита и сбита, единственный выбор, оставшийся у французов, это смерть, или бесчестье. ~ n ~ В поезде в Компьене французские чиновники чувствовали истинное унижение последнего, подвергшиеся ритуальному унижению, подражающему обращению с немецкой делегацией в 1918 году [ГЕР.Генератор] убедились в том, что детали унижений Германии были возвращены в натуре к самым маленьким деталям, включая штурм поезда, как у Маршала Фоха. Когда чернила высохла, Франция осталась с огромными территориальными уступами на востоке, распадом ее международных союзов и письменным обязательством не вмешиваться в будущие европейские дела."

 worldnews.228.d: "После жестокого военного поражения и разграбления своих земель Швейцария оказалась в хаосе, с недовольством и насилием на улицах. Вход в властную ваккумацию является одним из военных лидеров Эугена Бирчера и немецких педофилов, которые виртуально выступают против французского ордена Энтента, который обрушился на европейский континент после Версалья. /nn/Nновое правительство стремится к внутренним изменениям, чтобы сделать Швейцарию финансовой немецкой нацией. На международном уровне правительство Бирчера призывает к установлению более тесных связей с Германией и восстановлению ее потерянных земель. Это очень важное дипломатическое развитие, поскольку оно может привести к дублированию планов войны."

 worldnews.229.d: "На протяжении многих лет между Берлином и Варшавой нарастала напряженность в отношении статуса германских населенных северных и западных территорий [POL.GetNameDef]. Однако наиболее ожидаемый удар не наступал, поскольку польские и немецкие дипломаты собрались для подписания соглашения, подтверждающего вознесение Польши в Штальпакт. ~n-Both Moscla и Paris смотрят на его развитие с тревогой и презрением, в то время как многие в Польше недовольны утратой террора. Однако многие рады, что ни немецкая, ни польская кровь не прольется на эти земли, и что независимость Польши теперь защищена от потенциальных германских и советских угроз."

 worldnews.230.d0: "Доминирование Германии на европейском континенте сегодня продвинулось еще дальше, так как итальянское и немецкое правительства подписали мирное соглашение, которое полностью, но подтверждает доминирование Германии в Альпском регионе."

 worldnews.230.d1: "Доминирование Германии на европейском континенте сегодня продвинулось еще дальше, так как итальянское и немецкое правительства подписали мирное соглашение, которое полностью, но подтвердило доминирование Германии в Альпском регионе. После жестоких боев в Альпах победа Германии была наконец обеспечена, а Рим стал смирительным. Несмотря на то, что победа Германии была подтверждена, их продвижение было ограниченным, и в результате территориальные уступки итальянцев были легкими. Наблюдатели музают, что, хотя Италия может быть побеждена, она не утратила своего статуса Великой державы и будет жить, чтобы сражаться с немцами в другой день."

 worldnews.230.d2: "Сегодня доминирование Германии на европейском континенте стало еще одним шагом вперед, так как итальянское и немецкое правительства подписали мирное соглашение, которое полностью, но подтверждает доминирование Германии в Альпском регионе. После жестоких боев в Альпах германская победа наконец-то была обеспечена, а Рим смирился. Несмотря на то, что германская победа привела к некоторым крупным территориальным уступкам, главным образом на северо-востоке, когда Германия захватила бывшие австро-венгерские территории, которые были захвачены после Великой войны. Переворот итальянских завоеваний в Великой войне является сокрушительным ударом по Риму, поскольку этот мир сделал недействительными жертвы итальянского народа как в этой войне, так и в первой Великой войне."

 worldnews.230.d3: "Сегодня доминирование Германии на европейском континенте стало еще одним шагом вперед, так как итальянское и немецкое правительства подписали мирное соглашение, которое полностью, но подтверждает доминирование Германии в Альпском регионе. После жестоких боев в Альпах, победа Германии была наконец обеспечена, и Рим стал смирительным. ~ nn n that a german drough в Италию, немцы навязали итальянцам суровый мир. Наряду с захватом бывшей австро-венгерской территории, немцы установили клиентские государства из итальянских земель. Такое унизительное мирное соглашение привело к тому, что Италию стали рассматривать лишь как вторую власть. В Италии гнев на такое поражение угрожает кипеть, поскольку кровопролитие за последние 40 лет ничего не принесло, кроме возвращения итальянских территориальных завоеваний к 1866 году."

 worldnews.232.d: "Недавняя победа Континентального Континентального Континентума в Европе, казалось, гарантировала доминирование Парижа над континентом. Однако с потерей общего врага это единство оказалось эфемерным. Множество споров о политическом и военном будущем Европы резко завершилось выходом Варшавы из Континенте. Несмотря на то, что поляки теперь выходят из Константи, они стремятся создать свой собственный блок: Intermarium. Долгая мечта со времен Великой войны, задуманной Пилсудским и сохранившейся в живых польской интеллигенцией, поляки надеются обеспечить суверенитет региона от великих держав как востока, так и запада, занимая свое место как великая держава Европы. Время покажет, будет ли этот шаг рассматриваться как гордый обман, который оставит Варшаву изолированным и угрожающим, или геополитический маг, дающий полюсам региональное господство."

 worldnews.233.d: "Вот уже более десяти лет Итальянская Восточная Африка действует как тюрьма наций, и теперь жемчужина в короне итальянской колониальной империи разрушена. Разрыв этнических недовольств и призывов к свободе, а бывшая колония сейчас находится в полной анархии. Немногие соперничающие правительства, движимые ожесточенным региональным национализмом, начали надеяться на то, что после многих лет колониального правления, хотя до сих пор их усилия были в большей степени сосредоточены на выживании с множеством этнических и политических врагов вокруг них. По мере того, как последние гарнизоны убегают в Рим, очевидно, что итальянский проект на Африканском Роге написал свою последнюю кровавую главу."
