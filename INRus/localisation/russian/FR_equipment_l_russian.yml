l_russian:
 ship_hull_light: "Разрушители"
 ship_hull_light_cruiser: "Легкие круизеры"
 ship_hull_heavy_cruiser: "Тяжелые круизеры"
 submarine: "Подводные лодки"
 submarine_desc: "Подводные лодки используют скрытые и мощные торпеды, чтобы уничтожить вражеские колонны."
 both_cruisers_desc: "Light Cruiser - лёгкое скрининговое судно. Его главная обязанность - защищать капиталные суда от вражеских легких судов, но также может выпускать мощные торпеды, которые могут нанести вред более крупным кораблям. / nnnHeavy Crusier - большой бронированный крейсер, довольно гибкий. Хороший выбор для стран, которые не могут позволить себе строить крупные капитальные корабли."
 light_cruiser: "Легкий круизер"
 light_cruiser_desc: "На нем лежит главная обязанность защитить заглавные корабли от вражеских легких судов, но он может также выпустить мощные торпеды, которые могут навредить более крупным кораблям."
 heavy_cruiser: "Тяжелый крузер"
 heavy_cruiser_desc: "Большой бронированный крейсер, довольно гибкий, хороший выбор для стран, которые не могут позволить себе строить крупные капитальные корабли."
 destroyer: "Уничтожить"
 cat_special_units: "Специальные силы"
 destroyer_desc: "Самый легкий скрининговый корабль, его задача - защищать более крупные корабли и находить и уничтожать подводные лодки."
 carrier: "Перевозчик"
 carrier_desc: "Капитальный корабль, способный нести крылья мощного летательного аппарата в бою, также полезен в качестве плавающего аэродрома, который вы можете разместить у побережья вашего врага."
 battleship: "Боевой корабль"
 battleship_desc: "Такие дорогие инвестиции заслуживают надлежащей поддержки небольших скрининговых судов."
 battle_cruiser: "Боевой круизер"
 battle_cruiser_desc: "Крупный стоящий корабль часто имеет наступательные способности, близкие к способностям боевого корабля, но с более слабыми доспехами, обмениваясь на более быструю скорость."
 submarine_pre: "Подводная лодка, предшествовавшая Великой войне"
 submarine_pre_desc: "Первые подводные лодки открыли новые горизонты для ведения военно-морской войны."
 destroyer_pre: "Уничтожитель до Великой войны"
 destroyer_pre_desc: "До Великой войны эти эсминцы использовались для защиты столиц от торпедных лодок, некоторые из которых сами были оснащены торпедами."
 light_cruiser_pre: "Лайт-крузер до Великой войны"
 light_cruiser_pre_desc: "Защищенные круизеры использовались для защиты торговых путей и поиска вражеских вод, некоторые из которых были оснащены торпедами, эффективно делающими их торпедными крейсерами."
 heavy_cruiser_pre: "Тяжелый крузер до Великой войны"
 heavy_cruiser_pre_desc: "Бронированный крейсер был своего рода военным кораблем конца XIX и начала XX века. Он был спроектирован, как другие типы крейсеров, чтобы работать как корабль дальнего радиуса действия, независимый, способный победить любой корабль, кроме корабля, и достаточно быстро, чтобы убежать от любого крейсера, с которым он столкнулся."
 battle_cruiser_pre: "Боевой крузер до Великой войны"
 battle_cruiser_pre_desc: "Первые боевые круизеры были спроектированы в Соединенном Королевстве в первом десятилетии века как развитие бронированного крейсера в то же время, когда "Ужасные" унаследовали предупредительный корабль. Цель этого проекта состояла в том, чтобы убежать от любого корабля с аналогичным вооружением и преследовать любое судно с меньшим вооружением; они были предназначены для того, чтобы охотиться на более медленные, старые бронированные крейсеры и уничтожать их тяжелыми пулями, избегая при этом боя с более мощными, но медленными боевыми кораблями. Однако, по мере того как все больше и больше боевых круизеров было построено, они все чаще использовались вместе с более защищенными боевыми кораблями."
 battleship_pre: "Боевой корабль, предшествовавший Великому Войне"
 battleship_pre_desc: "По мнению одних, это реликвия старой эпохи военно-морской войны, по мнению других, как самые впечатляющие когда-либо сооружавшиеся корабли, никто не может отрицать, что эти остатки гонки вооружений на военно-морском корабле представляют собой одни из самых хорошо вооруженных и бронетранспортеров, когда-либо сооружавшихся."
 carrier_pre: "Предшествующий войне перевозчик"
 carrier_pre_desc: "Эти эскорт-перевозчики и тендеры были предшественниками современных авианосцев."
 convoy: "Конвой"
 convoy_desc: "Конвои, используемые для международной торговли товарами и ресурсами, также используются для переправки войск вокруг и для совершения военно-морских нападений."
 sh_battleship: "Сверхтяжелый боевой корабль"
 sh_battleship_desc: "Такие дорогие инвестиции заслуживают надлежащей поддержки небольших скрининговых судов."
 light_airframe: "Световоздух"
 light_airframe_desc: "Самолеты на легкой ЭВМ"
 medium_airframe: "Средняя авиамашина"
 medium_airframe_desc: "Самолеты, базирующиеся на средних авиарейсах"
 heavy_airframe: "Тяжелое воздушное пространство"
 heavy_airframe_desc: "Самолеты большой авиации"
 jet_engines: "Двигатели-реактивы"
 JET_ENGINES_SPECIAL: "Разработка Jet Motors является необходимой предпосылкой для разработки реактивных летательных аппаратов."
 jet_engines_desc: "В качестве прорыва в технологии тяги, Jet Motor позволит разработать совершенно новое поколение летательных аппаратов."
 convoy_1: "Конвой"
 motorized_equipment: "Грузовой автомобиль"
 motorized_equipment_desc: "Грузовики, используемые для перевозки войск, предметов снабжения и для автомобилизации дивизий."
 motorized_equipment_0: "Ранний грузовой автомобиль"
 motorized_equipment_0_desc: "Во время Великой войны армия начала использовать основные гражданские грузовики для перевозки предметов снабжения и оборудования, которые с тех пор стали неотъемлемой частью большинства армий."
 motorized_equipment_1: "Грузовой автомобиль"
 motorized_equipment_1_desc: "Автомобильная пехота является первым шагом на пути к механизации армии. Гражданские грузовики легко приспособлены для использования в военных целях для перевозки солдат, буксировки оружия и перевозки техники и предметов снабжения, что значительно повышает стратегическую мобильность пехотных подразделений, которые в противном случае будут вынуждены идти."
 support_equipment_short: "Поддержка Eq."
 support_equipment: "Вспомогательное оборудование"
 support_equipment_desc: "Радио, джипы, понтоны и прочее оборудование, используемое для поддержки войск."
 support_equipment_1: "Вспомогательное оборудование"
 support_equipment_1_desc: "Радио, джипы, понтоны и прочее оборудование, используемое для поддержки войск."
 scout_plane: "Скаутский план"
 scout_plane_equipment_desc: "Самолёт, разработанный специально для фоторазведки."
 scout_plane_equipment: "Планы скаутов"
 scout_plane_equipment_1: "Скаутский самолет I"
 scout_plane_equipment_1_desc: "Сбор разведывательных данных о передвижениях вражеских войск и представление сообщений о развертывании вражеских военно-морских сил были первоначальной миссией для самолетов с момента их первого развертывания во время Великой войны и по-прежнему являются важной миссией."
 scout_plane_equipment_2: "Скаутский самолет II"
 scout_plane_equipment_2_desc: "Разрабатывая специальные самолеты для воздушного наблюдения и разведки на большие расстояния, мы обеспечиваем получение и поддержание точной картины намерений и возможностей нашего противника."

