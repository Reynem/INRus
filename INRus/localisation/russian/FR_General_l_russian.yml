 ###OTHER COUNTRIES DESC###
 OTHER_FUHRERREICH_DESC: "Это 1936 год, и мир находится на грани новой, неизбежной войны. Но мир состоит из более чем нескольких монолитных империй. Самые маленькие камни могут привести к приливным волнам, и эти малые государства могут принести много перемен. Вы присоединитесь к валькистам? Продолжите ли вы факел революции? Или, может быть, вы предоставите ваш народ истинную свободу, подобных которой они никогда не видели? Мир скоро сорвется со своего мирного существования, упав в аду войны. И он не будет ждать ваших решений."

 ###LEADER DESCRIPTIONS###
 POLITICS_GEORGE_V_DESC: "Джордж V из Виндзора является королем-эмператором Британской империи, более чем просто во имя. Правя почти в три раза дольше, чем его отец, Эдвард VII, он восстал, чтобы стать одним из самых любимых монархов в британской истории. Под его правлением Британская империя вновь заявила о себе как о Глобальном Гегемоне и экономически затмила как своих соперников, так и бывших союзников после возвращения Империи к Великой изоляции. Однако его непобедимый образ не полностью соответствует реальности. По мере продвижения вперед состояние здоровья короля Георгия неуклонно ухудшается, что заставляет его сына, принца Эдуарда, выполнять часть своих обязанностей. Некоторые лучшие медицинские эксперты Империи ожидают, что он проживет еще 10 лет, хотя король Джордж в частном порядке придерживается противоположного мнения, несмотря на его часто стоическую природу."

 POLITICS_EDWARD_VIII_DESC: "С кончиной любимого короля Георга Эдуарда VIII Виндзора наследовал не только империю, простирающуюся от Ванкувера до Веллингтона, но и более широкий по сравнению с жизнью образ, который был создан его отцом. Харизматичный, уверенный и вооружённый опытом последних лет правления его Отца; вновь коронированный король-Эмперор готов взять на себя любые обязанности, которые могут быть от него требоваться в предстоящие годы."

 POLITICS_ADAM_DRESSLER_DESC: "В 1932 году Дресслер попытался оказать помощь в перевороте под руководством ДНВП только в 1923 году, который был сокрушен и принудительно заключен под стражу. Во время своего пребывания в тюрьме Дресслер написал фанатический роман под названием "Mein Deutschland das Siegreiche" ( &quot; Майн Дейтслэнд да Сегрейч &quot; ), в котором подробно рассказывалось о мести западным державам и разрушении Советов. &quot; Дресслер &quot; стал невероятно популярным. &quot; Дресслер &quot; , после случая, доказавшего незаконность тюремного заключения Дресслера; его освободили из тюрьмы и приветствовали сотни сторонников. &quot; Дрезслер &quot; затем наращивал поддержку своему недавно учрежденному Валькистику Фолькспартей Дейшландс &quot; , а затем баллотировался за должность в 1932 году. &quot; Дресслер &quot; , &quot; Дрет &quot; , &quot; , &quot; Дрет &quot; , который &quot; , &quot; , &quot; , &quot; , &quot; , &quot; , &quot; , &quot; , &quot; , &quot; , &quot; , &quot; Дрет &quot; , &quot; , &quot; , &quot; , &quot; ... &quot; , &quot; ... &quot; , &quot; , &quot; , &quot; , &quot; , &quot; , &quot; , &quot; , &quot; , &quot; , &quot; , &quot; ,"

 POLITICS_PAUL_REYNAUD_DESC: "В 1925 году, в августе, Айзек подал в отставку с поста председателя Федеративной республики и попытался назначить себе преемника Милитариста для укрепления платформы партии. Рено был естественным кандидатом из-за своей популярности в партии и твердой позиции в отношении иностранных союзников. В 1928 и 1932 годах Федерация Републикайна сумела собрать наибольшее число голосов и мест на обоих выборах. В высшей степени прагматичный человек Рейно следует одной доктрине внешней политики; Франция не имеет друзей и только интересов."

