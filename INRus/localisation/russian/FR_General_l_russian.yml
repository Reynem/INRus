 #Generic Events
 Generic_LSMC_idea_loc: "Последствия ЛМСК"
 Generic_LSMC_idea_loc_desc: "Лондонский фондовый рынок охватил все четыре уголка земного шара, и мы не исключение."
 Generic_ai_idea_tt: "§g Если эта нация контролируется игроком, они получат:§!"
 generic_became_a_major: "Есть ли великая сила"

 oil_crisis_staying_idea_tt: "Пока мексиканская американская война так или иначе не закончится, мы пострадаем от последствий этого кризиса!"

 oil_crisis_staying_idea_good_tt: "До тех пор, пока мексиканская американская война так или иначе не закончится, мы выиграем от этого кризиса!"

 Generic_Oil_Crisis_loc: "Большой дефицит нефти"
 Generic_Oil_Crisis_loc_desc: "До третьей мексиканско-американской войны США доминировали в мировом добыче нефти, при этом ежегодно производится более 180 млн. метрических тонн, при этом Венесула является вторым по величине производителем, производящим всего 30 млн. метрических тонн."

 Generic_Oil_Crisis_Profit_loc: "Увеличение поступлений от продажи нефти"
 Generic_Oil_Crisis_Profit_loc_desc: "Хотя огромный скачок цен на сырую нефть негативно сказался на большинстве стран, мы оказались в состоянии получать прибыль из-за наших крупных запасов нефти."

 genworld.1.d: ""
 genworld.2.d: "По мере того, как последствия кризиса на Лондонском фондовом рынке распространились по всему миру в результате домино, мы сами оказались поражены его последствиями. Наша промышленность уже замедляется, безработица растет, и наши люди требуют от банков свои деньги. Надеюсь, со временем мы оправимся."
 genworld.3.d: "После короткого периода времени наша экономика начала стабилизироваться. &lt; &lt; Интуитивные &gt; &gt; последствия угасли, и мы можем вновь продвигаться к процветанию."
 genworld.4.d: "Наша экономика сейчас все больше возвращается в нормальное русло, и, хотя мы все еще страдаем от укуса катастрофы, мы больше не должны бояться ее последствий, которые полностью погубят нас."
 genworld.5.d: "В то время как последствия аварии по - прежнему видны в повседневной жизни, в основном все возвращается в нормальное русло."
 genworld.6.d: "После периода восстановления положение наконец-то нормализовалось, и мы больше не страдаем от последствий глобального экономического кризиса."
 genworld.7.d: ""
 genworld.8.d: "Цены на нефть во всем мире резко возросли. Это происходит в результате того, что крупнейший производитель нефти в мире превратил свои крупнейшие нефтяные месторождения в поле боя, и торговля через Мексиканский залив оказывается в значительной степени затрудненной."
 genworld.9.d: ""
 genworld.10.d: "С окончанием третьей мексиканско-американской войны к лучшему или к худшему, это, безусловно, к лучшему для нашей экономики, экспорт возобновился, а теперь капитальные затраты в нашей экономике уменьшились."
 genworld.11.d: ""
 genworld.12.d: "Цены на нефть во всем мире резко возросли. Это происходит в результате того, что крупнейший производитель нефти в мире превратил свои крупнейшие нефтяные месторождения в поле боя, и торговля через Мексиканский залив становится крайне затрудненной. Несмотря на то, что этот кризис предоставляет нам возможность. Из-за наших крупных нефтяных запасов мы можем продавать нефть на международный рынок по возросшей цене. Мы, возможно, захотим рассмотреть вопрос о расширении нашего экспорта, с тем чтобы получить еще больше богатства. Однако мы должны быть осторожными в отношении продажи наших национальных ресурсов иностранцам."
 genworld.13.d: ""
 genworld.14.d: "После окончания третьей мексиканско-американской войны она также положила конец эпохе великого процветания."
 genworld.15.d: ""


 # --- Event 20: Become a Puppet ---
 generic.20.t: "Вопрос о суверенитете"
 generic.20.d_friends: "Наша тесная связь с [Гетнамом] достигла окончательного перепутья, их дипломаты предложили, чтобы для нашего собственного дальнейшего процветания и безопасности мы официально привели нашу администрацию в соответствие со своей, хотя технически это положило бы конец нашему статусу полностью независимого субъекта на мировой арене, защиту, предлагаемую таким могущественным благодетелем, трудно игнорировать, а присоединение к ним в качестве охраняемого государства обеспечило бы нашу безопасность в эти неспокойные времена."
 generic.20.d_enemies: "Последнее сообщение от [от GetName] - это не что иное, как ультиматум. Они требуют, чтобы мы подчинялись их власти, фактически став государством-клиентом под их непосредственным контролем. Их тон холоден, и последствия очевидны: либо мы принимаем «руководство» их правительства, либо мы сталкиваемся с последствиями того, что мы стоим в одиночестве против их силы. Наша независимость висит на волоске."
 generic.20.a: "У нас нет иного выбора, кроме как подчиниться."
 generic.20.b: "Мы будем процветать под их защитой."
 generic.20.c: "Мы никогда не откажемся от своей независимости!"

 # --- Event 21: Overlord Confirmation ---
 generic.21.t: "Новый защитник"
 generic.21.d: "С этого дня их внешняя политика и ресурсы будут направлены на общее благо нашей сферы влияния. Карты должны быть переработаны, чтобы отразить их новый статус как верного подчиненного."
 generic.21.a: "Огромное дополнение к нашему сближению."

 # --- Event 22: Overlord Denied ---
 generic.22.t: "Недостаток в [изобилии]"
 generic.22.d: "Глупые люди [от Гетнама] сочли нужным отвергнуть наше великодушное предложение о защите, их лидерство по-прежнему упрямо привязано к их заблуждениям о полном суверенитете, несмотря на явную реальность геополитической ситуации, столь вопиющее унижение нашей власти не может остаться без ответа. Если они не присоединятся к нам с помощью дипломатии, то, возможно, они будут учиться с помощью более... прямых методов."
 generic.22.a: "Они выбрали путь конфронтации."

 # --- Event 23: Demand Territory ---
 generic.23.t: "Требования о территориальном отчуждении"
 generic.23.d: "Правительство [от Гетнама] официально потребовало немедленной передачи нашей территории, они утверждают, что этот регион исторически принадлежит им, или, возможно, они просто считают, что мы слишком слабы, чтобы удерживать его."
 generic.23.a: "Это горькая таблетка, но мы должны сдать землю."
 generic.23.b: "Ни один дюйм нашей земли не будет сдан!"

 # --- Event 24: Territory Accepted ---
 generic.24.t: "Территориальные требования"
 generic.24.d: "К удивлению многих в Уайтхолле, их правительство согласилось на полную передачу требуемых территорий нашей администрации. Наши пограничники уже въезжают, чтобы обезопасить новую границу, и местное население информируется об их новой верности. Это большая победа для нашего престижа без единого выстрела."
 excellent: "Триумф нашей дипломатии."

 # --- Event 25: Territory Refused ---
 generic.25.t: "Ультиматум отвергнут"
 generic.25.d: "Наши требования в отношении территориальной компенсации были решительно отвергнуты [от Гетнама], они решили занять позицию, играя в азартные игры, что у нас не будет желания вести полномасштабную войну по этому вопросу, так открыто пренебрегая нами, они оставили нам только два варианта: отступить в позоре и потерять свое положение на мировой сцене, или мобилизовать наши силы и взять сталь, в которой нам было отказано по чернилам."
 generic.25.a: "Тогда это будет война."
