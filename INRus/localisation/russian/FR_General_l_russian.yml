 military_development: "Военное развитие"

 very_low_development: "Военные"
 very_low_development_desc: "Наши вооруженные силы находятся в полном беспорядке, недисциплинированные солдаты, некомпетентное высшее командование, тренировка, тактика и методы, которые принадлежали предыдущим столетиям, чтобы стоять на ногах с другими силами, мы должны модернизировать наши силы."

 low_development: "Немодернизированные военные"
 low_development_desc: "Хотя наша армия не является неофициальной или полностью некомпетентной, она глубоко устарела и будет страдать против вооруженных сил более современных держав."

 lower_medium_development: "Низкий уровень военного развития"
 lower_medium_development_desc: "В то время как наши военные, хорошо оснащенные и обученные, которые можно охарактеризовать как «готовые к бою», отсутствуют по сравнению с другими силами."

 upper_medium_development: "Среднее военное развитие"
 upper_medium_development_desc: "Наши военные звания среди среднего числа мельниц во всем мире. что мы не отсталая сила, а настоящая современная армия, скорее всего, будет унижена."

 high_development: "Высокий уровень военного развития"
 high_development_desc: "Наши военные хорошо развиты, и, пройдя обширную реформу, они не испытывают недостатка против вторичных держав, а против великих держав и развитых стран мы можем счесть войну несколько асимметричной."

 modern_development: "Современные военные"
 modern_development_desc: "Благодаря новейшим методам подготовки, возможностям, тактике и оборудованию наши военные хорошо организованы и способны стоять на ногах с любой другой силой, с которой они могут столкнуться."

 in_military_development_disable: "Отключено"

 colonial_economy: "Колониальная экономика"
 colonial_economy_desc: "Наш экономический и политический успех зависит от состояния и благодати нашего повелителя."

 undisturbed_isolation: "Прекрасная изоляция"
 undisturbed_isolation_desc: "С победой в Великой войне Великобритания вновь отошла в изоляцию, чтобы управлять своей империей и избегать дальнейших запутаний на европейском континенте. С началом политических событий в Британской Индии и колониальной Африке внимание Британской империи сосредоточено исключительно на внутренних делах."

 isolation: "Изоляция"
 isolation_desc: "Приоритизация внутренних дел и управление нашей собственной нацией является предпочтительной альтернативой иностранному вмешательству."

 civilian_economy: "Демобилизация в мирное время"
 civilian_economy_desc: "Нет необходимости перенаправлять людей и материальные средства на военные цели."

 low_economic_mobilisation: "Ранняя мобилизация"
 low_economic_mobilisation_desc: "Нет необходимости поспешно готовиться к войне полностью, хотя было бы глупо оставлять военную промышленность и наши страны в стороне от обороны."

 partial_economic_mobilisation: "Частичная мобилизация"
 partial_economic_mobilisation_desc: "По мере роста потенциальных врагов и того, как наше население начинает опасаться, что война может дойти до наших земель, мы должны начать необходимую подготовку к конфликту."

 war_economy: "Мобилизация в военное время"
 war_economy_desc: "Сейчас мы находимся в состоянии войны и должны принять соответствующие меры. Мужчины должны быстрее достичь поля боя, а наша индустрия должна создать средства для победы в большем объеме. Наш народ должен подготовиться к трудностям."

 tot_economic_mobilisation: "Итого, мобилизация"
 tot_economic_mobilisation_desc: "В это время конфликта не должно быть места для роскоши."

 free_trade: "Свободная торговля"
 free_trade_desc: "Глобальные рынки и свободная торговля, как правило, стимулируют экономический рост и ведут к снижению цен на многие товары."

 export_focus: "Открытые рынки" #Export Focus
 export_focus_desc: "Я не против свободной торговли, если это справедливая торговля, но я против плохих торговых сделок."

 limited_exports: "Регулируемые рынки" #Limited Exports
 limited_exports_desc: "Я посетил уволенных рабочих фабрик и общины, разрушенные нашими ужасными и несправедливыми торговыми сделками, это забытые мужчины и женщины нашей страны, и они забыты, но они не будут забыты долго."

 closed_economy: "Закрытые рынки" #Closed Economy
 closed_economy_desc: "Мы не можем допустить, чтобы наша экономика бежала на благо иностранных интересов."

 disarmed_nation: "Разоруженная нация"
 disarmed_nation_desc: "У нас нет причин развертывать огромные армии."

 volunteer_only: "Добровольцы-только"
 volunteer_only_desc: "A"Just War" - if there could be such a thing - would not require conscription. Volunteers would be plentiful.\n"

 limited_conscription: "Ограниченная воинская обязанность"
 limited_conscription_desc: "При необходимости призыв на военную службу, но не обязательно призыв на военную службу."

 extensive_conscription: "Обширная воинская обязанность"
 extensive_conscription_desc: "Наказание — это жизнеспособность нации, очищение ее нравственности и реальные основы всех ее привычек."

 service_by_requirement: "Служебная деятельность по требованию"
 service_by_requirement_desc: "Ты делаешь свою работу?"

 all_adults_serve: "Все взрослые служат"
 all_adults_serve_desc: "Чем хуже человек, тем лучше солдат."

 scraping_the_barrel: "Сломанный баррель"
 scraping_the_barrel_desc: "Каждый мужчина, каждая женщина и каждый ребенок будут вносить свой вклад в войну так или иначе."

