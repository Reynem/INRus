 FUHRERREICH_NAME: "Наследие Великой войны"

 FUHRERREICH_DESC: "В конце Великой войны империи старых - оттоманцев, австрийцев и немцев - рухнули с большой силой и влиянием, в то время как Соединенные Штаты, Великобритания и Франция поднялись. В то время как многие думали, что Великая война приведет к новой эпохе мира, кажется, что напряженность старых еще не исчезла и вместе с ними может угрожать хрупкому миру, который остается..."

