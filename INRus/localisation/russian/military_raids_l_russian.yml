 raid_type_facility_strike: "Забастовка объекта"
 raid_type_facility_strike_desc: "Воздушный удар по вражескому экспериментальному объекту с целью нанести серьезный ущерб объекту и любому проекту там."

 raid_type_lock_bombing_raid: "Бомба на замке"
 raid_type_lock_bombing_raid_desc: "Самолеты, оснащенные специальными взрывающими бомбами, пытаются уничтожить замки, чтобы предотвратить проход через канал."
 raid_type_lock_bombing_raid_no_bba: "$raid_type_lock_bombing_raid$"
 raid_type_lock_bombing_raid_no_bba_desc: "$raid_type_lock_bombing_raid_desc$"

 raid_type_dam_bombing_raid: "Бомбардировка плотины"
 raid_type_dam_bombing_raid_desc: "Самолеты, оснащенные специальными взрывающими бомбами, пытаются уничтожить плотину, понизив ее эффективность и затруднив для противника передвижение в этом районе."
 raid_type_dam_bombing_raid_no_bba: "$raid_type_dam_bombing_raid$"
 raid_type_dam_bombing_raid_no_bba_desc: "$raid_type_dam_bombing_raid_desc$"

 raid_type_gun_emplacement_raid: "Стрельба с применением огнестрельного оружия"
 raid_type_gun_emplacement_raid_desc: "Полет бомбардировщиков, оснащенных бомбой, пытается уничтожить установку на $mega_gun_emplacement$"
 raid_type_gun_emplacement_raid_no_bba: "$raid_type_gun_emplacement_raid$"
 raid_type_gun_emplacement_raid_no_bba_desc: "$raid_type_gun_emplacement_raid_desc$"

 raid_type_mega_gun_emplacement_strike: "Забастовка Мега-Гун"
 raid_type_mega_gun_emplacement_strike_desc: "Нападение на Мега-Гун-место с использованием бомб Земного Земного Взрыва"
 raid_type_mega_gun_emplacement_strike_no_bba: "$raid_type_mega_gun_emplacement_strike$"
 raid_type_mega_gun_emplacement_strike_no_bba_desc: "$raid_type_mega_gun_emplacement_strike_desc$"

 raid_type_oilfield_raid: "Нефтяное поле"
 raid_type_oilfield_raid_desc: "Воздушный удар, направленный на снос крупного нефтяного месторождения, и он соединяет нефтеперерабатывающие заводы, чтобы серьезно сорвать производство топлива противника в течение длительного периода времени."
 raid_type_nuclear_strike: "Ядерный удар"
 raid_type_nuclear_strike_desc: "Стратегический бомбардировщик и его эскорт прилетят к заданной цели и развернут атомную бомбу."
 raid_type_nuclear_missile_strike: "Ядерный ракетный удар"
 raid_type_nuclear_missile_strike_desc: "Ракета большой дальности последует подорбитальной баллистической траектории от установленной пусковой площадки к заданной цели. В соответствующий момент на борту боеголовка взорвет атомный взрыв."
 raid_type_paratrooper_facility_sabotage: "Саботажные работы на объекте"
 raid_type_paratrooper_facility_sabotage_desc: "Команда десантников сбрасывается на вражеский объект и пытается уничтожить жизненно важное оборудование с помощью стационарных зарядов, с тем чтобы сорвать их научный прогресс."
 raid_type_mine_sabotage_raid: "Минная саботажная рэйд"
 raid_type_mine_sabotage_raid_desc: "Команда десантников сбрасывается на главный вражеский минный комплекс и пытается запустить заряды, которые надолго прервут производство."
 raid_type_pathfinder_raid: "&quot; Патфайндер рэйд &quot;"
 raid_type_pathfinder_raid_desc: "Команда десантников бродит за линию врага, чтобы подготовиться к предстоящему вторжению, уничтожая критические мосты, устраивая засады и, как правило, отвлекая внимание."
 raid_type_commando_port_raid: "Морской порт &lt; &lt; Рейд &gt; &gt;"
 raid_type_commando_port_raid_desc: "Группа морских пехотинцев нанесла ущерб большому, контролируемому противником, $naval_base$. Корабли в порту могут также понести ущерб."
 raid_type_commando_facility_raid: "Морское судно &lt; &lt; Рейд &gt; &gt;"
 raid_type_commando_facility_raid_desc: "Группа морских пехотинцев направляется для нанесения ущерба экспериментальному объекту в одной из прибрежных провинций."
 raid_type_airfield_raid: "Рейд на аэродроме"
 raid_type_supply_hub_raid: "Рейд &lt; &lt; Центр снабжения &gt; &gt;"
 raid_type_demo_dam_raid: "Разрушительная бойня &lt; &lt; Демо &gt; &gt;"
 raid_type_thermonuclear_strike: "Термоядерный удар"
 raid_type_thermonuclear_strike_desc: "Стратегический бомбардировщик и его эскорт прилетят к заданной цели и развернут термоядерную бомбу."
 raid_type_thermonuclear_missile_strike: "Термоядерный ракетный удар"
 raid_type_thermonuclear_missile_strike_desc: "Ракета большой дальности последует подорбитальной баллистической траектории от установленной пусковой площадки к заданной цели. В соответствующий момент на борту боеголовка взорвет термоядерный взрыв."
 raid_type_CHI_huansheng_raid: "Операция &lt; &lt; Уэншэн &gt; &gt;"
 raid_type_CHI_huansheng_raid_desc: "Наша разведка утверждает, что, хотя в данный момент нашим военно-воздушным силам слишком трудно правильно нанести удар по ценным мишеням, сталь Явата и военно-морский архиепископ Сасебо, поэтому было принято решение о том, что наиболее эффективным способом остановить эту войну было бы поднять совесть японского народа против зверств, совершенных империалистическими японскими поджигателями в Китае, сбрасывая листовки по таким городам, как Нагасаки, Фукуока, Сага и Осака."

