l_russian:
 lar_operative_event.1.t: "Агент захвачен"
 lar_operative_event.1.desc: "Находясь за вражеской линией, [это.Гетнам] был задержан противником [от. Гетеектива] контрразведки. Сообщения из других источников указывают, что [это.Гетшехэ] содержится в удаленном месте для допроса, хотя мы считаем, что [это.Гетше Хе] попытается сопротивляться допросу как можно дольше, скорее всего, враг в конечном итоге получит полезный интеллект, если [Это.Гетхэ] не будет спасен или убит до того, как [Это.Гетхэ] сломается."
 lar_operative_event.1.a: "Мы должны провести спасательную операцию!"
 lar_operative_event.2.t: "Агент был вынужден скрываться"
 lar_operative_event.2.desc: "Во время назначения в [отправке от GetNameDef] [это.GetName], очевидно, был обнаружен контрразведкой. В последнем сообщении [Это.GetSheHe] было сказано, что [это.GetSheHe] заметили слежку противника за [этим.getHerHim] и что [это.GetSheHe] собирался осуществить процедуры уклонения и побега. В рамках этих процедур [Это.GetName], естественно, нарушит контакт с [Это. GetHerHe] операторами [Это.Get HeerHis], чтобы не нанести ущерба им или другим. / ni Если успех, то [это.GetName] снова свяжется с нами через несколько недель."
 lar_operative_event.2.a: "Мы ничего не можем сделать, кроме как ждать и надеяться."
 lar_operative_event.3.t: "Агент Убит"
 lar_operative_event.3.desc: "Похоже, что [это.Гетнам], один из наших агентов, развернутый в [от.Гет Наме Дефа], принес конечную жертву и умер при исполнении своих обязанностей. Сообщения из [от источников.Гетеективов] незначительны, но, как представляется, [Это.Гетнам] отслеживается контрразведкой. Похоже, что [Это.Гетшехе] чуть было не схватили и либо выбрали смерть, чтобы избежать передачи жизненно важной информации в ходе допроса, либо были убиты агентами при сопротивлении аресту."
 lar_operative_event.3.a: "Герой, которого пригласили на последний отдых."
 lar_operative_event.4.t: "Агент ранен"
 lar_operative_event.4.desc: "После близкого контакта с контрразведкой, [это.Гетнам] сообщил, что [это.Гетшехе] не будет действовать какое-то время, чтобы добраться до травм [Это.Гетшехе], полученных в ходе борьбы с попыткой задержать [Это.Гетхерхим]. ~n [Это.Гетнам] сейчас находится в безопасном месте, наблюдая за ранами [Это.Гет Хезерс], и будет отсутствовать в течение нескольких недель, пока [Это.Гетхэ] не выздоровеет."
 lar_operative_event.4.a: "Скоро вернётся в бой."
 lar_operative_event.5.t: "Вражеский Агент повернулся"
 lar_operative_event.5.desc: "Наша служба контрразведки добилась значительного успеха: после продолжительного допроса и после получения информации о вероятной судьбе, если [это.Гетшехе] обвиняется в шпионаже, захваченный агент [от. Гетеектива] согласился сотрудничать с нами в обмен на полную амнистию преступлений против государства."
 lar_operative_event.5.a: "Но мы ожидали, что он умрёт?"
 lar_operative_event.6.t: "Операция захвачена!"
 lar_operative_event.6.desc: "[Это.Гетем] был пойман в попытке проникнуть в нашу администрацию и слить секретную информацию обратно [это.Гетхе] начальству; после допроса, [это.Гетхэ] открыл, что он является иностранным достоянием для [отправляйся в агентство], которое действует на земле, но пока неизвестно, каков точный характер [относительно] интереса к нашей стране или какие части нашей администрации уже были обнаружены в глазах [откровения] разума. [От этого догадываясь], мы можем только надеяться, что в конце концов [это.Гетсехе] раскроет все, что можно знать об операциях [от Гетнам дефакта]."
 lar_operative_event.6.a: "У нас есть способы заставить тебя говорить."
