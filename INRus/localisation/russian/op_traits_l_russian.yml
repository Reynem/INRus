l_russian:

 ### Operative Traits ###
 operative_bold: "Крепкое"
 operative_bold_desc: "Операционный отлично принимает быстрые решения и вычисляет лучшее время для забастовки."
 operative_cautious: "Осторожно."
 operative_cautious_desc: "Иногда благоразумие - это лучшая часть величия."
 operative_reckless: "Безымянный"
 operative_reckless_desc: "Делает свою работу, но, кажется, меньше беспокоится о личной безопасности."
 operative_military_background: "Военная история"
 operative_military_background_desc: "Оператор знает, как обстоят дела с военными, говоря на универсальном языке солдат повсюду."
 operative_political_connections: "Политические связи"
 operative_political_connections_desc: "Знать нужных людей в высших местах может быть полезно."
 operative_highly_educated: "Высокообразованные"
 operative_highly_educated_desc: "Иногда это помогает понять разницу между кислотой и основанием."
 operative_efficient: "Эффективные"
 operative_efficient_desc: "Работает с таким количеством инструментов, как нужно."
 operative_streetwise: "Улицы"
 operative_streetwise_desc: "Их прошлое может быть скрытым, но оперативник имеет контакты там, где это имеет значение."
 operative_master_infiltrator: "Мастер Инфильтратор"
 operative_master_infiltrator_desc: "Этот оперативник мастер в адаптации к любой окружающей среде и безукоризненно смешивается."
 operative_survivor: "Выжившие"
 operative_survivor_desc: "Каким-то образом, этот оперативник, кажется, всегда выживает."
 operative_master_commando: "Мастер солдат"
 operative_master_commando_desc: "Этот оперативник является одним из лучших военных инструкторов, имеющихся в его распоряжении."
 operative_master_saboteur: "Мастер Саботеур"
 operative_master_saboteur_desc: "Если этот оперативник может приблизиться к нему, они могут саботировать его."

 ### Unit Leader Traits ###
 artillery_officer: "Артиллерийский офицер"
 artillery_officer_desc: "Офицер артиллерии!"
 artillery_specialist: "Специалист по артиллерии"
 artillery_specialist_desc: "Умел управлять артиллерией в бою!"
 artillery_expert: "Эксперт по артиллерии"
 artillery_expert_desc: "Настоящий эксперт в управлении артиллерией."
 artillery_ratio_over_30: "Артиллерийское соотношение > §H30%§!"
