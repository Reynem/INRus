 XSM_ma_wanfu_commander_desc: "Ма Ванфу вернулся из своего хаджа для того, чтобы привнести новые новшества в иматату Гансу в 1888 году, раскритиковав ортодоксальность Сидаотанга. Маанфу основал секту Ихевани, исламскую фундаменталистику Ханафи, которая противостояла бубалистским аспектам суфизма. Маанфу был создан в качестве парии, когда он поддерживал восстание Дугана в 1895 году, и был вынужден скрываться в течение десятилетий. Янг Цзэнксин арестовал и пытался унизить Маанфу до его казни в 1915 году, но губернатор Цинхай Ма Ци спас его и укрепил власть Ихевани в Цинхае. Ма Ки сделал Маанхай преподавателем Ма Буфанго, который, как утверждается, питал внфу Мабуфанге внгаху внутреннюю ненависть к Маанфу в Мабуфанге."

