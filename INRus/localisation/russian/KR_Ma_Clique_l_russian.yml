 XSM_ma_lin_leader_desc: "Ма Лин был сыном известной мусульманской секты &lt; &lt; Сидаотанг Ханафи &gt; &gt; , которая вместе с Ма Фусяном в 1900 году сражалась с &lt; &lt; Альянсом восьми национальностей &gt; &gt; . &lt; &lt; Ма Лин &gt; &gt; в период войны в Гансу, Ма Лин вступил в союз с мусульманской сектой &lt; &lt; Сидаотанг Ханафи &gt; &gt; . &lt; &lt; Ма Лин &gt; &gt; часто выступала в качестве посредника в первые два десятилетия XX века с более радикальными членами семьи &lt; &lt; Ма &gt; &gt; , в том числе с Ма Чжуфангом. &lt; &lt; Ма Лин &gt; &gt; в 1935 году в качестве губернатора увидела расширение &lt; &lt; Цинхай &gt; в Амдо &gt; . В конце 1935 Ма Лин разработал план с &lt; &gt; &lt; &lt; &lt; &lt; &gt; &lt; &lt; &lt; &lt; &lt; &gt; &lt; &lt; &lt; &lt; &gt; &gt; &lt; Фу &gt; &gt; &lt; &gt; , &lt; , &gt; &lt; &lt; , &gt; интегр &lt; , &lt; Фу &gt; Фу &gt; интегр &gt; , &gt; , &lt; , &lt; , &lt; Фу &gt; , &gt; , &lt; Фушан &gt; соединин &lt; , но &lt; , но &lt; соединин &lt; Кин &lt; соединин &l"

 XSM_ma_hongbin: "Ма Хонбин"
 XSM_ma_hongbin_leader_desc: "Ма Хонбин вырос в тени своего отца, Ма Фулу, который отдал свою жизнь против Восемь-Национального альянса в 1900 году. В отличие от своего отца Ма Хонбин решил защитить христианскую миссию в Сан-Даохе и получил орден Леопольда за это действие после восстания боксера. Раннее во время эпохи Уорлорда Ма Хонгбин официально осудил Чианга в 1925 году. К сожалению для Махонгбина Ма Хункуи в 1920 году в связи с отношениями Махонгбина с КМТ был объявлен гигантом и публично осудил Махонгбина как социалистического шпиона в 1930 году."
 XSM_ma_hongbin_commander_desc: "Гансу, Цин Эмпайр §Y Военная карьера: §L\nMa Hongbin вырос в тени своего отца Ма Фулу, который отдал свою жизнь против Восемь-нистского альянса в 1900 году. В отличие от своего отца Ма Хунбин решил защитить христианскую миссию в Сан-Даохе и получил орден Леопольда для этой акции после восстания боксера. Рано в эпоху бокса Ма Хунбин совершил перевороты союзникам с КМТ, направил генералу Чиангу Кай-Шеку уведомление о своем новом управлении Нингсией в 1920 году. Неожиданно, Чианг в 1921 году обратился к Ма Хонбину с просьбой открыть Нинся в Ханские поселения, что нарушило бы автономию Гуй. Махонгбин официально осудил Чинга в 1925 году. К сожалению, Ма Хункуи встал в 1920 году в отношениях Махонгбина с КМТ и осудил Махонгбина как социалиста."

 XSM_ma_fuxiang: "Ма Фусян"
 XSM_ma_fuxiang_leader_desc: "Ма Фусян считается одним из основателей семейной клики Ma Family Clique, которая скрепила себя на северо-западе. Работая, как и многие другие члены его семьи под руководством Дон Фусяна, он сделал себе имя в боксеровском восстании. К рассвету Синьхайской революции он и его племянник Ма Хонбин защищали католические миссии, в то время как такие фигуры, как Ма Анлианг, боролись от имени Цина против республиканцев. В то время как Анлиангу удалось добиться победы во время революции, неизбежное падение династии заставило Анлианг и остальных членов семьи заявить о своей верности республике. Анлианг вскоре скончался, оставив Фусианг в качестве объединяющей фигуры северного клика. Фусянг в основном стремится к тому, чтобы они не утратили своего положения на северо-западе. И наконец, он и остальные члены семьи были связаны с Гуоминьской миссией, которая занимала верхнюю роль Гуминсу в кровной кампании. Однако это недолго долгое с остальной частью семьи, которая следует за ним."humanising\" the Huis to the Han through his unique blend of Confucian and Islamic beliefs that has had moderate success, with some even citing him as a scholar. A decade of peace has been brought by Fuxiang, one that will last for as long as he does."
 XSM_ma_fuxiang_commander_desc: "Ма Фусян считается одним из основателей семейной клики Ma Family Clique, которая скрепила себя на северо-западе. Работая, как и многие другие члены его семьи под руководством Дон Фусяна, он сделал себе имя в боксеровском восстании. К рассвету Синьхайской революции он и его племянник Ма Хонбин защищали католические миссии, в то время как такие фигуры, как Ма Анлианг, боролись от имени Цина против республиканцев. В то время как Анлиангу удалось добиться победы во время революции, неизбежное падение династии заставило Анлианг и остальных членов семьи заявить о своей верности республике. Анлианг вскоре скончался, оставив Фусианг в качестве объединяющей фигуры северного клика. Фусянг в основном стремится к тому, чтобы они не утратили своего положения на северо-западе. И наконец, он и остальные члены семьи были связаны с Гуоминьской миссией, которая занимала верхнюю роль Гуминсу в кровной кампании. Однако это недолго долгое с остальной частью семьи, которая следует за ним."humanising\" the Huis to the Han through his unique blend of Confucian and Islamic beliefs that has had moderate success, with some even citing him as a scholar. A decade of peace has been brought by Fuxiang, one that will last for as long as he does."

 XSM_ma_bufang: "Ма Буфан"
 XSM_ma_bufang_leader_desc: "Ма Буфанг был младшим братом Ма Буцинга и сына Ма Ци и служил вместе с ними в армии Цинхая начиная с 1915 года, и это назначение было одобрено правительством Бейянга в 1919 году и позволило Ма Буфангу укрепить свою репутацию. Ма Буфан изучал ислам во время своего пребывания в армии, знакомясь с мечетью Донггуань и Йихевани Ма Ванфу до его продвижения по службе перед генералом. Ма Буфанг последовал за союзным гуминьюном Ма Фусяна в 1933 году, официально одобрив его в качестве главной патриотической формы ислама. Ма Буфан имеет менее активные отношения с Махунбином и Ма Хункуи, когда Ма Лин был назначен губернатором Цинхая в 1931 году, Мафунг глубоко впал в свою веру мусульманам, официально одобряя его предательство в семье."
 XSM_ma_bufang_commander_desc: "После того как Ма Лин был назначен губернатором Кингайской мечети в 1931 году, Ма Буфанг глубоко покорился своей мусульманской преданности, официально одобрив Ифьяна в 1933 году в качестве главной патриотической формы ислама."

 XSM_ma_hongkui: "Ма Хонкуи"
 XSM_ma_hongkui_leader_desc: "Ма Хункуи был сыном «Героя северо-запада» Ма Фусяна Ма Хонкуи окончил военную академию Гансу в 1909 году и присоединился к Синьхайской революции в 1912 году Ма Хункуи объявил себя «Командатором по борьбе с бандитами», который первоначально поместил его в Гуоминьджун как часть альянса Ма Фусяна с кликой. Когда Фэн Юсян предал Мэ Фусяна, Ма Хункуй жестоко очистил свою бригаду Гуоминьцзюна в ходе войны в Ма-Гуоминьджуне. После разрушения Гансу Ма Хункуи удвоился в оппозиции к КМТ, что привело к денонсации Махонгбина за его прежнюю связь с ними. В начале 1930-х годов борьба Ма Хонгбина уравновешивала губернаторство Гансу, которое он унаследовал от своего отца, экономическими проблемами, вызванными иммиграцией Хана."
 XSM_ma_hongkui_commander_desc: "§L\nMa Hongkui является сыном «Героя северо-западного» Ма Фусян Ма Хункуи окончил Военную Академию Гансу в 1909 году и присоединился к Синьхайской революции в 1912 году Ма Хункуи объявил себя «Командующим сурпрессией», который первоначально поместил его в Гуоминьцзюн в союз с кликом Мафусяна. Когда Фэн Юсян предал Ма Фусианг, Ма Хункуи жестоко очистил свою бригаду Гуоминь как часть войны с Гуоминьюном, после разрушения Гансу, Ма Хункуи удвоился в своем противостоянии КМТ, чтобы осудить Махонгбина за его прежнюю связь с ними. Война Махонгбина в начале 1930-х годов была смешана между губернатором Гансу, унаследованным иммиграцией Хана, и экономическими бедами."

 XSM_ma_biao: "Ма Биао"
 XSM_ma_biao_commander_desc: "Еще один молодой солдат &quot; Кансу хравес &quot; Ма Биао взял на себя активную роль в борьбе с &quot; Альянсом восьми национальностей &quot; в пользу Цина, когда он сопровождал их в Сян. &quot; Ма Биао &quot; была повышена до бригадного командующего Цинхайской армией в начале 1935 года с Тибетом, где он возглавил мужественную защиту Юсю против тибетской армии. &quot; Ма Биао &quot; последовала жестокая месть против народа Голока, которого он считал предателем Масы. &quot; Ма Биао &quot; наблюдал за разрушением городов Голока и объявил это шагом вперед к росту народа Донгсианг, с которым он воевал. &quot; Ма Биао &quot; вернулся в Цинхай, где многие жители презирали его за резню. &quot; Ма Биао &quot; был спасен благодаря его хвалу хи за храбство и его новый союз с лидером &quot; Донгсианг Имамом Ма Ванфу &quot; , лидером Ихевани."

 XSM_ma_dunjing: "Ма Дюнжин"
 XSM_ma_dunjing_commander_desc: "§L\n1906\nHezhou, Gansu, Qing Empire\n §Y Военная карьера: §L\n Третий сын Ма Хунбин Ма Данжин служил под командованием Армии борьбы с бандитами Ма Хункуи и был сильно затронут идеологией Ма Хункуи."

 XSM_ma_zhongying: "Ма Чжунинг"
 XSM_ma_zhongying_commander_desc: "Гансу, Цин Империя, Военная Карьера: §L\nMa Zhonging — черная овца семей Ма, и она хорошо завоевала эту репутацию. Ма Чжунинг последовал по стопам своих старших родственников и вступил на военную службу всего лишь в 14 лет. 17 лет Ма Чжонинг шокировал свою семью, дезертировав из битвы Гансу против Фэн Юсяна, забрав с собой кавалерию на север в Нинксию. В следующее десятилетие Ма Чжонинг пытался вырезать свою собственную фифотомию из восточных провинций Ма, своего единственного дальнего двоюродного брата Ма Хушана. Единственное убеждение Ма Чжонгинга в том, что это Сяоатангская школа ислама, заставило его нацелиться на мечети Кхуфийя, чтобы содействовать своим убеждениям с помощью сектантского насилия."

 XSM_ma_hushan: "Ма Хушан"
 XSM_ma_hushan_commander_desc: "Гансу, Цинг Империя, н §Y Военная карьера: §L\nMa Hushan, как и его зять Ма Чжуньинг, давно ищет влияния на запад в Синьцзяне. В отличие от своего брата, Махусану не хватает желания предать свою семью ради этой цели. Работая под руководством Ма Хонгбина, Ма Хушан устала от конфликтов, которые поражают западные провинции, и стремится к национальному единству."

 XSM_ma_jiyuan: "Ма Цзюань"
 XSM_ma_jiyuan_commander_desc: "§L\n §YBorn: §L\n 18 января 1921/nHezhou, Gansu, Republic of China_n §Y Военная карьера: §L\n Младший командир в семье Ма, Ма Цзюань, служит под началом своего отца Ма Буфана, чтобы принести славу своему отцу в Ма Клик. Ма Цзюань сосредоточил свои усилия в Цинхайской армии на модернизации своих кавалерийных бригад, надеясь, что они смогут преодолеть огромные расстояния до севера в случае необходимости."

 XSM_ma_buqing: "Ма Букинг"
 XSM_ma_buqing_commander_desc: "В отличие от своего брата, Ма Букин получил дорогое образование на классическом китайском языке, что в конечном итоге сделало его непригодным для ведения межэтнического конфликта против тибетцев в 1935 году."

 XSM_han_youwen: "Хан Ювен"
 XSM_han_youwen_commander_desc: "§L\nHan Youwen является единственным салар-турковым командиром в Ma Clique и завоевал свое место благодаря службе своего отца в Gansu Hraves. Хан Ювен служит под руководством Ma Bufang и опирается на исламские модернистские тенденции Ма Буфанга, чтобы оставаться значимым в клике, где доминирует Гуй."

