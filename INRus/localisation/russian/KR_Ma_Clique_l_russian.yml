### Leaders ###
 POLITICS_XSM_MA_FUXIANG_DESC: "Ма Фусян считается одним из основателей семейной клики Ma Family Clique, которая скрепила себя на северо-западе. Работая, как и многие другие в своей семье под руководством Дон Фусяна, он смог сделать себе имя в боксеровском восстании. К рассвету Синьхайской революции он и его племянник Ма Хонгбин защищали католические миссии, в то время как такие фигуры, как Ма Анлианг, боролись от имени Цина против республиканцев. В то время как Анлианг сумел добиться победы во время революции, неизбежное падение династии заставило Анлианг и остальных членов семьи заявить о своей верности республике. Анлианг вскоре скончался, оставив Фусианг в качестве объединяющей фигуры северного клика. Фусианг, главная цель которого по-прежнему была верна, чтобы они не утратили своего положения на северо-западе, он и остальные члены семьи, после того как они заняли Гуоминсу в кровопролитной кампании. Однако это было недолго долгой целью, которая по-прежнему остается в том, что они по-прежнему были праведны с остающимсяи германными группами, по отношению друг к другу, по отношению друг к другу, по отношению к другу по отношению к другу, по отношению к другу, по отношению к Дю, по отношению к Дю, по отношению к Дю, по отношению к Гу, по-гангу, по-гангу, по-гангу, он по-Д, он по-Д, он по-Дэнсень, он по-День, он по-Д, он по-Д, он по-День, он по-День, он по-День, он по-День, он по-День, и остальные, он по-День-День, он по-День, он по-День, он по-День, он по-День, он по-День, он, он, он, он, он, он по-День-День, он по-День, и остальные, он почти почти почти почти по-г-г-г-Г, он почти по-г-г-г-День-День-День, по"humanising" the Huis to the Han through his own unique blend of Confucian and Islamic beliefs that has had managed to have moderate success, with some even citing him as a scholar. A decade of peace has been brought by Fuxiang, one that will last for as long as he does."
 POLITICS_XSM_MA_LIN_DESC: "Ма Лин был сыном известной секты хидау храбрости Ма Хайян, которая в 1900 году вместе с Ма Фусяном сражалась с Альянсом восьми национальностей, в том числе с Ма Чжонгингом. Ма Лин смог оттолкнуться от рейдов Ма Чжонгиинга в Гансу во время войны в Ма-Гуоминьюне. Ма Лин стал преемником своего брата Ма Ки, губернатора Цинхая, после его смерти в 1931 году. Это назначение вызвало глубокое разочарование у его племянника Ма Буфанга, который выразил свою квалификацию губернатора. Ма Лина в качестве губернатора увидел расширение Цинхая в 1935 году, получив похвалу от семей Ма. В конце 1935 года Ма Лин разработал с Ма Фусиангом план интеграции Юсху в нужную Цинхай, но это было сокращено смертью Ма Фусяна."
 POLITICS_XSM_MA_HONGBIN_DESC: "Ма Хонбин вырос в тени своего отца, Ма Фулу, который отдал свою жизнь против Восемь-Национального альянса в 1900 году. В отличие от своего отца Ма Хонбин решил защитить христианскую миссию в Сан-Даохе и получил орден Леопольда за это действие после восстания боксера. Раннее во время эпохи Уорлорда Ма Хонгбин официально осудил Чианга в 1925 году. К сожалению для Махонгбина Ма Хункуи в 1920 году в связи с отношениями Махонгбина с КМТ был объявлен гигантом и публично осудил Махонгбина как социалистического шпиона в 1930 году."
 POLITICS_XSM_MA_HONGKUI_DESC: "Ма Хункуи был сыном «Героя северо-запада» Ма Фусяна Ма Хонкуи окончил военную академию Гансу в 1909 году и присоединился к Синьхайской революции в 1912 году Ма Хункуи объявил себя «Командатором по борьбе с бандитами», который первоначально поместил его в Гуоминьджун как часть альянса Ма Фусяна с кликой. Когда Фэн Юсян предал Мэ Фусяна, Ма Хункуй жестоко очистил свою бригаду Гуоминьцзюна в ходе войны в Ма-Гуоминьджуне. После разрушения Гансу Ма Хункуи удвоился в оппозиции к КМТ, что привело к денонсации Махонгбина за его прежнюю связь с ними. В начале 1930-х годов борьба Ма Хонгбина уравновешивала губернаторство Гансу, которое он унаследовал от своего отца, экономическими проблемами, вызванными иммиграцией Хана."
 POLITICS_XSM_MA_BUFANG_DESC: "Ма Буфанг был младшим братом Ма Буцинга и сына Ма Ци и служил вместе с ними в армии Цинхая начиная с 1915 года, и это назначение было одобрено правительством Бейянга в 1919 году и позволило Ма Буфангу укрепить свою репутацию. Ма Буфан изучал ислам во время своего пребывания в армии, знакомясь с мечетью Донггуань и Йихевани Ма Ванфу до его продвижения по службе перед генералом. Ма Буфанг последовал за союзным гуоминьюном Ма Фусяна в 1933 году, официально одобрив в качестве главной патриотической формы ислам. Мабуфан имеет менее-полезные отношения с Махунбином и Махонгкуи, когда Ма Лин был назначен губернатором Цинхая в 1931 году, Мафанг глубоко впал в свою мулимскую веру, открыто одобряя предательство своей семьи."

 POLITICS_XSM_MA_FUXIANG_ARMY_DESC: "Ма Фусян считается одним из основателей семейной клики Ma Family Clique, которая скрепила себя на северо-западе. Работая, как и многие другие в своей семье под руководством Дон Фусяна, он смог сделать себе имя в боксеровском восстании. К рассвету Синьхайской революции он и его племянник Ма Хонгбин защищали католические миссии, в то время как такие фигуры, как Ма Анлианг, боролись от имени Цина против республиканцев. В то время как Анлианг сумел добиться победы во время революции, неизбежное падение династии заставило Анлианг и остальных членов семьи заявить о своей верности республике. Анлианг вскоре скончался, оставив Фусианг в качестве объединяющей фигуры северного клика. Фусианг, главная цель которого по-прежнему была верна, чтобы они не утратили своего положения на северо-западе, он и остальные члены семьи, после того как они заняли Гуоминсу в кровопролитной кампании. Однако это было недолго долгой целью, которая по-прежнему остается в том, что они по-прежнему были праведны с остающимсяи германными группами, по отношению друг к другу, по отношению друг к другу, по отношению к другу по отношению к другу, по отношению к другу, по отношению к Дю, по отношению к Дю, по отношению к Дю, по отношению к Гу, по-гангу, по-гангу, по-гангу, он по-Д, он по-Д, он по-Дэнсень, он по-День, он по-Д, он по-Д, он по-День, он по-День, он по-День, он по-День, он по-День, и остальные, он по-День-День, он по-День, он по-День, он по-День, он по-День, он по-День, он, он, он, он, он, он по-День-День, он по-День, и остальные, он почти почти почти почти по-г-г-г-Г, он почти по-г-г-г-День-День-День, по"humanising" the Huis to the Han through his own unique blend of Confucian and Islamic beliefs that has had managed to have moderate success, with some even citing him as a scholar. A decade of peace has been brought by Fuxiang, one that will last for as long as he does."
 POLITICS_XSM_MA_HONGBIN_ARMY_DESC: "Гансу, Цин Эмпайр §Y Военная карьера: §L\nMa Hongbin вырос в тени своего отца Ма Фулу, который отдал свою жизнь против Восемь-нистского альянса в 1900 году. В отличие от своего отца Ма Хунбин решил защитить христианскую миссию в Сан-Даохе и получил орден Леопольда для этой акции после восстания боксера. Рано в эпоху бокса Ма Хунбин совершил перевороты союзникам с КМТ, направил генералу Чиангу Кай-Шеку уведомление о своем новом управлении Нингсией в 1920 году. Неожиданно, Чианг в 1921 году обратился к Ма Хонбину с просьбой открыть Нинся в Ханские поселения, что нарушило бы автономию Гуй. Махонгбин официально осудил Чинга в 1925 году. К сожалению, Ма Хункуи встал в 1920 году в отношениях Махонгбина с КМТ и осудил Махонгбина как социалиста."
 POLITICS_XSM_MA_HONGKUI_ARMY_DESC: "§L\nMa Hongkui является сыном «Героя северо-западного» Ма Фусян Ма Хункуи окончил Военную Академию Гансу в 1909 году и присоединился к Синьхайской революции в 1912 году Ма Хункуи объявил себя «Командующим сурпрессией», который первоначально поместил его в Гуоминьцзюн в союз с кликом Мафусяна. Когда Фэн Юсян предал Ма Фусианг, Ма Хункуи жестоко очистил свою бригаду Гуоминь как часть войны с Гуоминьюном, после разрушения Гансу, Ма Хункуи удвоился в своем противостоянии КМТ, чтобы осудить Махонгбина за его прежнюю связь с ними. Война Махонгбина в начале 1930-х годов была смешана между губернатором Гансу, унаследованным иммиграцией Хана, и экономическими бедами."
 POLITICS_XSM_MA_BUFANG_ARMY_DESC: "После того как Ма Лин был назначен губернатором Кингайской мечети в 1931 году, Ма Буфанг глубоко покорился своей мусульманской преданности, официально одобрив Ифьяна в 1933 году в качестве главной патриотической формы ислама."
 POLITICS_XSM_MA_BIAO_ARMY_DESC: "Еще один молодой солдат &quot; Кансу хравес &quot; Ма Биао взял на себя активную роль в борьбе с &quot; Альянсом восьми национальностей &quot; в пользу Цина, когда он сопровождал их в Сян. &quot; Ма Биао &quot; была повышена до бригадного командующего Цинхайской армией в начале 1935 года с Тибетом, где он возглавил мужественную защиту Юсю против тибетской армии. &quot; Ма Биао &quot; последовала жестокая месть против народа Голока, которого он считал предателем Масы. &quot; Ма Биао &quot; наблюдал за разрушением городов Голока и объявил это шагом вперед к росту народа Донгсианг, с которым он воевал. &quot; Ма Биао &quot; вернулся в Цинхай, где многие жители презирали его за резню. &quot; Ма Биао &quot; был спасен благодаря его хвалу хи за храбство и его новый союз с лидером &quot; Донгсианг Имамом Ма Ванфу &quot; , лидером Ихевани."
 POLITICS_XSM_MA_DUNJING_ARMY_DESC: "§L\n1906\nHezhou, Gansu, Qing Empire\n §Y Военная карьера: §L\n Третий сын Ма Хунбин Ма Данжин служил под командованием Армии борьбы с бандитами Ма Хункуи и был сильно затронут идеологией Ма Хункуи."
 POLITICS_XSM_MA_ZHONGYING_ARMY_DESC: "Гансу, Цин Империя, Военная Карьера: §L\n Ma Zhongying — черная овца семей Ма и хорошо завоевала эту репутацию. Ма Чжунинг последовал по стопам своих старших родственников и вступил на военную службу только в 14 лет. 17 лет Ма Чжонинг потряс свою семью, дезертировав из битвы Гансу против Фэн Юсяна, взяв с собой кавалерию к северу от Нинксии. В следующее десятилетие Ма Чжонинг пытался вырезать свою собственную фифотомию из восточных провинций Ма, своего единственного отдалённого двоюродного брата Ма Хушана."
 POLITICS_XSM_MA_HUSHAN_ARMY_DESC: "Гансу, Цинг Империя, н §Y Военная карьера: §L\nMa Hushan, как и его зять Ма Чжуньинг, давно ищет влияния на запад в Синьцзяне. В отличие от своего брата, Махусану не хватает желания предать свою семью ради этой цели. Работая под руководством Ма Хонгбина, Ма Хушан устала от конфликтов, которые поражают западные провинции, и стремится к национальному единству."
 POLITICS_XSM_MA_BUQING_ARMY_DESC: "В отличие от своего брата, Ма Букин получил дорогое образование на классическом китайском языке, что в конечном итоге сделало его непригодным для ведения межэтнического конфликта против тибетцев в 1935 году."
 POLITICS_XSM_MA_JIYUAN_ARMY_DESC: "§L\n §YBorn: §L\n 18 января 1921/nHezhou, Gansu, Republic of China_n §Y Военная карьера: §L\n Младший командир в семье Ма, Ма Цзюань, служит под началом своего отца, Ма Буфана, чтобы принести славу своему отцу в Маклик. Ма Цзюань сосредоточил свои усилия в Цинхайской армии на модернизации своих кавалерийных бригад, надеясь, что они смогут преодолеть огромные расстояния до севера, если возникнет необходимость."
 POLITICS_XSM_HAN_YOUWEN_ARMY_DESC: "§L\nHan Youwen является единственным салар-турковым командиром в Ma Clique и завоевал свое место благодаря службе своего отца в Gansu Hraves. Хан Ювен служит под руководством Ma Bufang и опирается на исламские модернистские тенденции Ма Буфанга, чтобы оставаться значимым в клике, где доминирует Гуй."
 POLITICS_MA_WANFU_DESC: "Ма Ванфу вернулся из своего хаджа для того, чтобы привнести новые новшества в иматату Гансу в 1888 году, раскритиковав ортодоксальность Сидаотанга. Маанфу основал секту Ихевани, исламскую фундаменталистику Ханафи, которая противостояла бубалистским аспектам суфизма. Маанфу был создан в качестве парии, когда он поддерживал восстание Дугана в 1895 году, и был вынужден скрываться в течение десятилетий. Янг Цзэнксин арестовал и пытался унизить Маанфу до его казни в 1915 году, но губернатор Цинхай Ма Ци спас его и укрепил власть Ихевани в Цинхае. Ма Ки сделал Маанхай преподавателем Ма Буфанго, который, как утверждается, питал внфу Мабуфанге внгаху внутреннюю ненависть к Маанфу в Мабуфанге."

