Holdout_Decisions: "Немецкая атака"
Holdout_Decisions_desc: "К сожалению, немецкий зверь повернул свои голодные глаза на наши земли. Немцы объявили войну нам, не имея большой силы, чтобы защитить нас, и мы оказались в дипломатической изоляции, сталкиваясь с полной тяжестью немецкой военной машины. Все, что мы можем сделать, это надеяться на то, что они пройдут достаточно долго, чтобы они могли подумать о заключении мирного соглашения."
