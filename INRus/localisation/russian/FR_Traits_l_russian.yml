 ### Leader traits ###
 SOV_father: "Отец §gLenin родился 22 апреля 1870 года в Симберске. Семья Ленина была частью растущего среднего класса в России. После казни его брата в 1887 году из-за революционных действий он стал социалистом. В 1893 году он переехал в Ленинград и стал важным революционером в России. В 1897 году он был арестован за подстрекательство и изгнан в Шушенское, он женился там на Надежарской революции Германии. После изгнания он переехал в Западную Европу, где работал на РСДЛП. В 1903 году РСДЛП разделился на две фракции, во главе с Болшевиком Ленином и Меншевиком во главе с Юлием Мартовым. С началом Фебурской революции Германия отправила его в опечатанный поезд в Россию, чтобы выступать за прекращение войны. В 1903 году русское правительство пошло на Ленинградское временное правительство и вновь попросило помощи советов, возглавляемых Ленином. ~ 7 ноября Революция развязала его с большевиршами, а также на западную экономику."
