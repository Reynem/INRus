 medium_tank_flame_chassis: "Средняя огневая цистерна"
 heavy_tank_flame_chassis: "Тяжелое пламя"
 amphibious_tank_chassis: "Шасси амфибийных цистерн"
 amphibious_tank_chassis_desc: "Для этого должны быть установлены строгие ограничения в отношении размеров оружия и толщины бронежилетов, на которые распространяется транспортное средство."
 amphibious_tank_chassis_1: "Шасси амфибийных цистерн"
 gwtank_chassis: "Межвоенные танкеры"
 gwtank_chassis_desc: "В то время как в последующие годы темпы развития замедлились, он, несомненно, сыграет важную роль в предстоящих войнах."
 armor_tech_1: "Базовая бронезащита"
 armor_tech_1_desc: "Танки во время Великой войны были вынуждены бороться только со стрелковым оружием противника, и как таковые они сбежали с довольно тонкими доспехами, новое поколение противотанкового оружия сделало поле боя гораздо более опасным местом для танка, и требуется гораздо большая защита."
 armor_tech_2: "Совершенствование системы защиты бронированных боеприпасов"
 armor_tech_2_desc: "С размещением по всему миру более тяжелого и тяжелого противотанкового оружия следующее поколение танков потребует еще более эффективной защиты."
 armor_tech_3: "Усовершенствованная бронезащита"
 armor_tech_3_desc: "Несмотря на то, что предел развернутых противотанковых пушек, вероятно, достигнут, новое поколение танков будет перевозить более современное оружие, которое может пробить любой нынешний уровень защиты на дальнем расстоянии."
 armor_tech_4: "Современная бронезащита"
 armor_tech_4_desc: "Во время войны угрозы, с которыми сталкиваются танки, возросли: от вражеских танков, противотанковых пушек, специальных танковых уничтожителей до современных пехотных орудий, которые могут проникнуть даже в тяжелые бронежилеты."
 engine_tech_1: "Базовый двигатель"
 engine_tech_1_desc: "Там, где танки Великой войны были медлительными, пиломатериалистыми зверями, современный танк полагается на скорость и мобильность, чтобы достичь победы."
 engine_tech_2: "Усовершенствованный двигатель"
 engine_tech_2_desc: "С большим оружием и более тяжелыми бронежилетами новое поколение танков требует более мощного двигателя, чтобы оставаться мобильным."
 engine_tech_3: "Усовершенствованный двигатель"
 engine_tech_3_desc: "Механизированная война — это форма боевых действий, которая требует быстрого принятия решений и быстрого перемещения войск и поставок."
 engine_tech_4: "Современный двигатель"
 engine_tech_4_desc: "Для перемещения всей этой массы нам нужны двигатели, которые обладают большой мощностью."
 DESIGNER_CHASSIS_BASE: "Шасси:"
 DESIGNER_FROM_MODULES: "Модуль:"
 DESIGNER_UNSAVED_CHANGES: "Несохраненные изменения:"
 tank_rocket_launcher: "Ракета-носитель"
 tank_rocket_launcher_desc: "Многоствольные ракеты-носители для неуправляемых высоковзрывоопасных ракет."
 tank_rocket_launcher_2: "Усовершенствованная ракетная пусковая установка"
 tank_rocket_launcher_2_desc: "Несмотря на ряд улучшений в плане точности, основное преимущество этой усовершенствованной ракеты-носителя заключается в том, что она может удерживать больше ракет для стрельбы по врагу."
 tank_wheeled_suspension: "Колесная подвеска"
 tank_wheeled_suspension_desc: "Эта подвеска, полученная из шасси грузовика, весьма ограничена по грузоподъемности и имеет ограниченные характеристики по всей стране, но имеет преимущество быть очень дешевым."
 tank_half_track_suspension: "Приостановление на полпути"
 tank_half_track_suspension_desc: "Гибрид между полностью пройденным транспортным средством и обычной колесной подвеской, эта установка имеет пару колес впереди для рулевого управления и отслеживаемую заднюю ось для повышения эффективности работы поперек страны."
 squeezebore_adaptor: "Адаптор кишечника"
 squeezebore_adaptor_desc: "Специальный адаптор в конце ствола опускает диаметр ствола и сжимает корпус до меньшего калибра, значительно увеличивая скорость пучка и тем самым проникая в него, и требует специальных боеприпасов, изготовленных из редких материалов."
 armor_skirts: "Броневые скирты"
 armor_skirts_desc: "Комплект тонких металлических пластин, установленных на боковой стороне транспортного средства, который обеспечивает дополнительную защиту от противотанковых винтовок и зарядов."
 dozer_blade: "Дозерный клинок"
 dozer_blade_desc: "Лопачок дозера позволяет машине быстро строить боевую позицию на поле без поддержки инженеров."
 auto_loader: "Автопогрузчик"
 auto_loader_desc: "Ауоматический механизм, который загружает скорлупы и позволяет цистерне сохранять высокую скорость возгорания в течение длительного периода времени."
 easy_maintenance: "Легкое обслуживание"
 easy_maintenance_desc: "Шлемы вокруг транспортного средства обеспечивают доступ к многочисленным элементам транспортного средства и позволяют экипажу достаточно легко осуществлять даже сложные работы по техническому обслуживанию."
 additional_machine_guns: "Дополнительные пулеметы"
 additional_machine_guns_desc: "Комплект пулеметов в спонтах и специальных щипцах обеспечивает более эффективную защиту автомобиля от нападения пехоты в непосредственной близости."

