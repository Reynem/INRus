 lc_heavy_naval_guns: "Тяжелые военно-морские пушки"
 lc_heavy_naval_guns_desc: "Стандартное основное вооружение для такого массивного бронетранспортера, эти мощные военно-морские пушки приспособлены для прямого противостояния, доставляя разрушительные огневые силы как против бронированных, так и для укрепленных целей."
 lc_super_heavy_railway_gun: "Пистолет сверхтяжелой железной дороги"
 lc_super_heavy_railway_gun_desc: "Этот массированный пистолет, изначально построенный для железнодорожных платформ, способен бомбардировать цели с крайних дальностей с беспрецедентной разрушительной силой."
 lc_high_impact_obliterator_cannon: "Высокоэффективная пушка"
 lc_high_impact_obliterator_cannon_desc: "Специально для того, чтобы проникнуть в очень густые доспехи, высокая кинетическая энергия этого оружия делает его грозным противником других сверхтяжелых танков."
 lc_heavy_anti_air_platform: "Платформа для борьбы с тяжёлым воздухом"
 lc_heavy_anti_air_platform_desc: ":: платформа для установки большого количества бронебойных орудий, предназначенная для защиты от вражеских бомбардировщиков и разведывательных самолетов, которые угрожают Лэндкрузер ."
 lc_medium_naval_guns: "Среднеморские пушки"
 lc_medium_naval_guns_desc: "Благодаря сбалансированному сочетанию стрелкового оружия и огневой мощи, эти пулеметы являются эффективными в использовании легковых автомобилей и оказании поддержки в борьбе с небронированными целями."
 lc_hull_mounted_railway_gun: "Железнодорожное оружие"
 lc_hull_mounted_railway_gun_desc: "Ретроспективное железнодорожное оружие, встроенное непосредственно в корпус для обеспечения максимальной стабильности, обеспечивает тяжёлую огнестойкость и может с высокой точностью наносить удары по отдаленным целям."
 lc_super_heavy_howitzer: "Супер-тяжелая гаубица"
 lc_super_heavy_howitzer_desc: "Крупный гаубиц, предназначенный для размывания укреплений и городской обороны. Этот вариант специализируется на доставке высоковзрывчатых снарядов, идеальном для расчистки укоренившихся позиций и уничтожения укрепленных структур."
 lc_heavy_high_velocity_cannons: "Тяжелые высокоскоростные пушки"
 lc_heavy_high_velocity_cannons_desc: "Противотанковые пулеметы, предназначенные для поражения и уничтожения вражеских бронежилетов с четко определенной точностью."
 lc_heavy_anti_air_battery: "Тяжелые противовоздушные батареи"
 lc_heavy_anti_air_battery_desc: "Противовоздушная батарея, оснащенная крупногабаритными пушками для поражения высокоскоростного и высотного самолета, обеспечивает оборонительный пузырь вокруг автомобиля."
 lc_medium_cannon_turret: "Средняя пушечная турретка"
 lc_medium_cannon_turret_desc: "Стандартная турнирная пушка, способная использовать пехотные и легкие транспортные средства."
 lc_assault_gun: "Огнестрельное оружие"
 lc_assault_gun_desc: "Это оружие доставляет мощные, высоковзрывные снаряды для расчистки пехоты и затвердевших целей."
 lc_high_velocity_cannon_turret: "Высокоскоростная пушка"
 lc_high_velocity_cannon_turret_desc: "Турнир, оборудованный быстродействующей пушкой для применения вражеских бронежилетов."
 lc_light_anti_air_battery: "Легкая противовоздушная батарея"
 lc_light_anti_air_battery_desc: "Легкая зенитная батарея, предназначенная для нанесения ударов по низколетающим летательным аппаратам и для защиты транспортного средства от пробега и взрывателей."
 lc_flamethrower_turret: "Горячий туррет"
 lc_flamethrower_turret_desc: "Специальная башня, которая проецирует поток огня, идеально для того, чтобы расчистить укрепленные позиции, пехотные и засадные пункты."
 lc_rocket_launcher: "Ракета-носитель"
 lc_rocket_launcher_desc: "Модульная ракетная система, установленная на Лэнд крузер , доставляет разрушительные ракетные снаряды для подавления противника и поражает крупные формирования."
 lc_radio_1: "$tank_radio_1$"
 lc_radio_1_desc: "$tank_radio_1_desc$"
 lc_radio_2: "$tank_radio_2$"
 lc_radio_2_desc: "$tank_radio_2_desc$"
 lc_radio_3: "$tank_radio_3$"
 lc_radio_3_desc: "$tank_radio_3_desc$"
 lc_command_center: "Командный центр"
 lc_command_center_desc: "Полностью интегрированный командный центр, который преобразует Лэнд крузер в мобильный штаб, оснащенный передовыми системами связи для координации крупномасштабных военных операций."
 lc_radar: "Радиолокатор"
 lc_radar_desc: "Система раннего обнаружения, которая повышает осведомленность о вражеских самолетах и близлежащих войсках, позволяя «Лэндкрузеру» подготовиться к потенциальным воздушным или наземным угрозам."
 lc_aircraft_catapult: "Самолеты"
 lc_aircraft_catapult_desc: "Система запуска малых разведывательных летательных аппаратов, позволяющая Лэнд крузер разведать отдаленные районы и обеспечивать разведку на поле боя в режиме реального времени."
 lc_helipad: "Вертолётная площадка"
 lc_helipad_desc: "Платформа для запуска вертолетов, предназначенная для обеспечения передовой воздушной разведки и повышения осведомленности о ситуации на поле боя."
 lc_armored_skirts: "Бронированные скирты"
 lc_armored_skirts_desc: "Укрепленные бронежилеты, установленные вдоль сторон для защиты уязвимых путей и подвесных систем от противотанкового оружия и стрелкового оружия."
 lc_bunker_emplacement: "Размещение бункеров"
 lc_bunker_emplacement_desc: "Внутреннее укрепленное здание, преобразующее Land Cruiser в мобильный бункер, позволяет команде держать оборонительные позиции и стрелять по врагу, даже когда он находится под сильным огнем."
 lc_obstacle_clearance_gear: "Противостоятельная передача"
 lc_obstacle_clearance_gear_desc: "Тяжелые приспособления, такие, как массивные бульдозерные лезвия и краны, предназначенные для расчистки мусора, создания путей по трудной местности и оказания помощи в проведении операций по закреплению."
 lc_internal_fuel_tanks: "Внутренние топливные баки"
 lc_internal_fuel_tanks_desc: "Расширенные топливные отсеки в корпусе, увеличивающие эксплуатационный диапазон транспортного средства и уменьшающие необходимость частых остановок на заправке во время расширенных кампаний."
 lc_internal_ammunition_compartments: "Сопоставительные материалы по внутренним боеприпасам"
 lc_internal_ammunition_compartments_desc: "Укрепленные складские помещения для перевозки дополнительных боеприпасов, что позволяет компании Лэнд крузер осуществлять длительные операции без пополнения запасов."
 lc_wet_ammunition_storage: "Хранение мокрых боеприпасов"
 lc_wet_ammunition_storage_desc: "Специализированные отсеки, наполненные жидкой охлаждающей жидкостью для сведения к минимуму риска взрыва боеприпасов в результате ударов противника, что значительно повышает безопасность экипажа."
 lc_smoke_generators: "Генераторы дыма"
 lc_smoke_generators_desc: "Система, предназначенная для установки толстых дымовых экранов, маскировки движения транспортного средства и уменьшения его видимости как наземными, так и воздушными угрозами."
 lc_stabilizers: "Стабилизаторы"
 lc_stabilizers_desc: "Механические устройства, которые уменьшают откат и поддерживают регулировку оружия при стрельбе, что позволяет быстрее вновь приобрести цель и более точно стрелять во время коротких остановок."
