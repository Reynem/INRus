 modern_tank_chassis_desc: "Модернизация шасси, которая в значительной степени заимствована из предыдущих средних цистерн, но в то же время делает гораздо больший упор на скорость и маневренность, а также позволяет использовать больше бронежилетов и пушек, чем обычно перевозить на средних емкостях."
 main_battle_tank_chassis_desc: "Опыт показывает, что конструкция легкого, среднего и тяжелого танков все больше сливается. Тяжелые танки становятся все более мобильными, в то время как легкие танки несут более тяжелые вооружения и бронежилеты, чтобы выжить."
