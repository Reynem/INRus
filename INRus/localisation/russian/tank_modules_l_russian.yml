 basic_heavy_tank_chassis_desc: "Тщательный анализ Великой войны показал, что существует необходимость в тяжелом автомобиле, чтобы пробиться через вражескую траншею и открыть путь для более легких сил, которые могли бы использовать этот прорыв, но такой автомобиль должен быть хорошо вооружен и хорошо бронирован, но не должен быть очень быстрым."
