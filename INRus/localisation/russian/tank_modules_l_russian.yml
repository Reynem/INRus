 ### EQUIPMENT MODULES ###

 tank_gasoline_engine: "Газовый двигатель"
 tank_gasoline_engine_desc: "Двигатель, работающий на бензине, будет работать быстрее для данного размера двигателя, но топливо будет гораздо более подверженным возгоранию."
 tank_diesel_engine: "Дизельные двигатели"
 tank_diesel_engine_desc: "Двигатель, работающий на дизельном топливе, является более надежным, чем бензиновый двигатель, но не столь быстрым для одного и того же размера двигателя."
 tank_petrol_electric_engine: "Топливно-электрический двигатель"
 tank_petrol_electric_engine_desc: "Комбинация бензинового двигателя, обеспечивающего подачу электроэнергии на электродвигатель, является сложной, дорогостоящей и ненадежной, однако она обеспечивает несопоставимые характеристики в тактических движениях."
 tank_gas_turbine_engine: "Газовая турбина"
 tank_gas_turbine_engine_desc: "Высокое потребление топлива, но самая высокая частота вращения любого двигателя при данном уровне двигателя."
 tank_riveted_armor: "Заряженный бронетранспортер"
 tank_riveted_armor_desc: "Броневые таблички болтаются к раме и удерживаются заклепками, приготавливаемыми к краям. Очень доказанная технология, которая довольно дешева, но завёрнутые края обеспечивают слабые точки в бронежилетах и могут навредить команде, если заклепки попадут в заклепки."
 tank_cast_armor: "Касковый бронежилет"
 tank_cast_armor_desc: "Весь шасси, включая доспехи, выставлен как единое целое, дорогостоящий и трудоемкий процесс, который позволяет гораздо толще доспехов с меньшим количеством слабых точек."
 tank_welded_armor: "Сварочный бронежилет"
 tank_welded_armor_desc: "Броневые пластины приварены к шасси."
 NOR_tank_rikstanken_armor: "Смена бронетранспортера"
 NOR_tank_rikstanken_armor_desc: "Сделано из чугуна вместо стали, чтобы экономить деньги, лучше, чем без бронежилетов... вероятно."
 tank_torsion_bar_suspension: "Коллаж крутящего момента"
 tank_torsion_bar_suspension_desc: "достаточно надежная система подвески металлических стержней, прикрепленных к шасси транспортного средства и обеспечивающих более плавный ход по сравнению с другими типами подвески."
 tank_christie_suspension: "Кристи Приостановление"
 tank_christie_suspension_desc: "Разработанный американским изобретателем, это расслабление допускает исключительно высокие скорости."
 tank_bogie_suspension: "Подвеска Боги"
 tank_bogie_suspension_desc: "Простой и довольно дешевый тип подвески, в котором автомобильные колеса устанавливаются отдельно, что позволяет легко заменить их в случае повреждения."
 tank_interleaved_suspension: "Пересеченные дорожные колеса"
 tank_interleaved_suspension_desc: "Благодаря пересечению автомобильных колес многие из них могут находиться на одинаковой длине корпуса, что повышает мобильность, а также обеспечивает определенную дополнительную защиту в пашинах."
 tank_light_one_man_tank_turret: "Туррет-человек"
 tank_light_one_man_tank_turret_desc: "Маленькая башня едва ли достаточно большая, чтобы удержать одного члена экипажа, которому поручено нацелить и погрузить основное вооружение, а также следить за целями и угрозами."
 tank_light_two_man_tank_turret: "Два мужика-туррета"
 tank_light_two_man_tank_turret_desc: "Турнир, который позволяет двум членам экипажа делиться работой по управлению вооружением и наблюдению за ситуацией, по-прежнему не позволяет эффективно распределять работу между членами экипажа."
 tank_light_three_man_tank_turret: "Тройной туррет"
 tank_light_three_man_tank_turret_desc: "- достаточно большой для того, чтобы три члена экипажа разделяли задачи по погрузке и направлению основного вооружения, а также были в курсе ситуации вокруг них."
 tank_light_fixed_superstructure_turret: "Легкая фиксированная суперструктура"
 tank_light_fixed_superstructure_turret_desc: "Стационарная надстройка позволяет только основным вооружениям передвигаться в небольшой дуге, не поворачивая весь автомобиль, однако она позволяет транспортному средству монтировать более крупные вооружения, будучи в целом небольшими по размеру, что делает автомобиль идеальным для засад."
 tank_medium_one_man_tank_turret: "Туррет-человек"
 tank_medium_one_man_tank_turret_desc: "Маленькая башня едва ли достаточно большая, чтобы удержать одного члена экипажа, которому поручено нацелить и погрузить основное вооружение, а также следить за целями и угрозами."
 tank_medium_two_man_tank_turret: "Два мужика-туррета"
 tank_medium_two_man_tank_turret_desc: "Турнир, который позволяет двум членам экипажа делиться работой по управлению вооружением и наблюдению за ситуацией, по-прежнему не позволяет эффективно распределять работу между членами экипажа."
 tank_medium_three_man_tank_turret: "Тройной туррет"
 tank_medium_three_man_tank_turret_desc: "- достаточно большой для того, чтобы три члена экипажа разделяли задачи по погрузке и направлению основного вооружения, а также были в курсе ситуации вокруг них."
 tank_medium_fixed_superstructure_turret: "Средняя фиксированная суперструктура"
 tank_medium_fixed_superstructure_turret_desc: "Стационарная надстройка позволяет только основным вооружениям передвигаться в небольшой дуге, не поворачивая весь автомобиль, однако она позволяет транспортному средству монтировать более крупные вооружения, будучи в целом небольшими по размеру, что делает автомобиль идеальным для засад."
 tank_heavy_two_man_tank_turret: "Два мужика-туррета"
 tank_heavy_two_man_tank_turret_desc: "Турнир, который позволяет двум членам экипажа делиться работой по управлению вооружением и наблюдению за ситуацией, по-прежнему не позволяет эффективно распределять работу между членами экипажа."
 tank_heavy_three_man_tank_turret: "Тройной туррет"
 tank_heavy_three_man_tank_turret_desc: "- достаточно большой для того, чтобы три члена экипажа разделяли задачи по погрузке и направлению основного вооружения, а также были в курсе ситуации вокруг них."
 tank_heavy_fixed_superstructure_turret: "Тяжелая фиксированная суперструктура"
 tank_heavy_fixed_superstructure_turret_desc: "Стационарная надстройка позволяет только основным вооружениям передвигаться в небольшой дуге, не поворачивая весь автомобиль, однако она позволяет транспортному средству монтировать более крупные вооружения, будучи в целом небольшими по размеру, что делает автомобиль идеальным для засад."
 tank_super_heavy_four_man_tank_turret: "Туррет четырёх человек"
 tank_super_heavy_four_man_tank_turret_desc: "Огромная башня с дополнительным пространством для второго погрузчика, чтобы обслуживать главный пистолет."
 tank_super_heavy_three_man_tank_turret: "Тройной туррет"
 tank_super_heavy_three_man_tank_turret_desc: "- достаточно большой для того, чтобы три члена экипажа разделяли задачи по погрузке и направлению основного вооружения, а также были в курсе ситуации вокруг них."
 tank_modern_tank_turret: "Современный туррет"
 tank_modern_tank_turret_desc: "Хорошо проложенная башня позволяет трем членам экипажа эффективно управлять основным вооружением и следить за своим окружением."
 tank_heavy_machine_gun: "Тяжелое пулеметное оружие"
 tank_heavy_machine_gun_desc: "Даже при наличии специальных бронебойных боеприпасов его противотанковые действия оставляют желать много лучшего."
 flamethrower: "Огнетушитель"
 flamethrower_desc: "Прибор для прогнозирования потока горящей жидкости, который, будучи весьма полезным в городских боях и в борьбе с фортификацией, не обеспечивает противотанковых средств и должен использоваться специально подготовленным экипажем в отдельном подразделении для обеспечения его эффективности."
 advanced_flamethrower: "Усовершенствованный Flamethrower"
 advanced_flamethrower_desc: "Усовершенствованные системы огнеметов, идеальные для расчистки укрепленных позиций и нанесения разрушительного ущерба в бою в непосредственной близости от кварталов."
 tank_auto_cannon: "Автоматическая пушка"
 tank_auto_cannon_desc: "Эта автоматическая пушка, адаптированная к быстродействующему противовоздушному ружью, может положить град огня, который губит мягкие цели."
 tank_auto_cannon_2: "Усовершенствованная автоматическая пушка"
 tank_auto_cannon_2_desc: "Эта автоматическая пушка, адаптированная к быстродействующему противовоздушному ружью, может положить град огня, который губит мягкие цели."
 tank_anti_air_cannon: "Базовое противовоздушное оружие"
 tank_anti_air_cannon_desc: "Быстродействующий автоматический пистолет, предназначенный для поражения летательных аппаратов, обладает ограниченным потенциалом в качестве средства пожаротушения наземных целей."
 tank_anti_air_cannon_2: "Усовершенствованное противовоздушное оружие"
 tank_anti_air_cannon_2_desc: "Быстродействующий автоматический пистолет, предназначенный для поражения летательных аппаратов, обладает ограниченным потенциалом в качестве средства пожаротушения наземных целей."
 tank_anti_air_cannon_3: "Усовершенствованное противовоздушное оружие"
 tank_anti_air_cannon_3_desc: "Быстродействующий автоматический пистолет, предназначенный для поражения летательных аппаратов, обладает ограниченным потенциалом в качестве средства пожаротушения наземных целей."
 tank_medium_howitzer: "Средняя гаубица"
 tank_medium_howitzer_desc: "Средние полевые гаубицы, приспособленные для установки в транспортном средстве, предназначены прежде всего для оказания непрямой огневой поддержки в борьбе с мягкими целями, однако при необходимости они могут быть обстреляны непосредственно по цели, но с небольшим количеством бронетанковых боеприпасов они не подходят для противотанковых работ."
 tank_medium_howitzer_2: "Улучшенный средний гаубиц"
 tank_medium_howitzer_2_desc: "Средние полевые гаубицы, приспособленные для установки в транспортном средстве, предназначены прежде всего для оказания непрямой огневой поддержки в борьбе с мягкими целями, однако при необходимости они могут быть обстреляны непосредственно по цели, но с небольшим количеством бронетанковых боеприпасов они не подходят для противотанковых работ."
 tank_heavy_howitzer: "Тяжелая гаубица"
 tank_heavy_howitzer_desc: "Говяжье поле, приспособленное для установки в автомобиле, предназначено прежде всего для оказания непрямой огневой поддержки в борьбе с мягкими целями, однако при необходимости оно может быть обстреляно непосредственно по цели, но при этом имеется лишь небольшое количество бронетанковых боеприпасов, что не подходит для противотанковых работ."
 tank_small_cannon: "Маленькая пушка"
 tank_small_cannon_desc: "Маленькая и дешевая пушка, способная стрелять как из пушечных, так и из артиллерийских орудий."
 tank_small_cannon_2: "Усовершенствованные малые пушки"
 tank_small_cannon_2_desc: "Маленькая и дешевая пушка, способная стрелять как из пушечных, так и из артиллерийских орудий."
 tank_medium_cannon: "Средняя пушка"
 tank_medium_cannon_desc: "Оружие общего назначения, вполне пригодное для выполнения широкого круга задач, не является ни противотанковым, ни противотанковым, но обеспечивает большую гибкость."
 tank_medium_cannon_2: "Усовершенствованные средние пушки"
 tank_medium_cannon_2_desc: "Оружие общего назначения, вполне пригодное для выполнения широкого круга задач, не является ни противотанковым, ни противотанковым, но обеспечивает большую гибкость."
 tank_high_velocity_cannon: "Базовая высокоскоростная пушка"
 tank_high_velocity_cannon_desc: "Пушка, специально предназначенная для достижения высокой скорости музыки, используя специальные боеприпасы, обладает превосходными антиармортными характеристиками, но ее эффективность в сравнении с мягкими целями страдает."
 tank_high_velocity_cannon_2: "Усовершенствованная высокоскоростная пушка"
 tank_high_velocity_cannon_2_desc: "Пушка, специально предназначенная для достижения высокой скорости музыки, используя специальные боеприпасы, обладает превосходными антиармортными характеристиками, но ее эффективность в сравнении с мягкими целями страдает."
 tank_high_velocity_cannon_3: "Усовершенствованная высокоскоростная пушка"
 tank_high_velocity_cannon_3_desc: "Пушка, специально предназначенная для достижения высокой скорости музыки, используя специальные боеприпасы, обладает превосходными антиармортными характеристиками, но ее эффективность в сравнении с мягкими целями страдает."
 tank_heavy_cannon: "Базовая тяжелая пушка"
 tank_heavy_cannon_desc: "Оружие, которое может выстрелить из большого снаряда."
 tank_heavy_cannon_2: "Усовершенствованные тяжелые пушки"
 tank_heavy_cannon_2_desc: "Оружие, которое может выстрелить из большого снаряда."
 tank_heavy_cannon_3: "Усовершенствованная тяжелая пушка"
 tank_heavy_cannon_3_desc: "Оружие, которое может выстрелить из большого снаряда."
 tank_super_heavy_cannon: "Супер-тяжелая пушка"
 tank_super_heavy_cannon_desc: "Нелепо крупное оружие с непритягательными характеристиками. Есть очень мало вещей, которые это оружие не может уничтожить, и ни один из них не имеет никакого отношения к стрельбе по танку."
 tank_close_support_gun: "Огнестрельное оружие"
 tank_close_support_gun_desc: "Стрелковое оружие, предназначенное для обстрела боевых снарядов противника, чтобы помочь пехоте в нападении."
 tank_radio_1: "Базовое радио"
 tank_radio_1_desc: "Базовое двухстороннее радио позволяет цистернам координировать свои тактические маневры в небольших масштабах."
 tank_radio_2: "Совершенствование радиосвязи"
 tank_radio_2_desc: "Усовершенствованная радиостанция позволяет командирам осуществлять эффективный контроль за более крупными группами танков, что позволяет осуществлять крупномасштабные оперативные маневры."
 tank_radio_3: "Передовая радиостанция"
 tank_radio_3_desc: "С более мощным передатчиком и лучшим приемом, это радио позволяет общаться на расстоянии десятков километров и перед лицом глушения врага."
 amphibious_drive: "Амфибийный двигатель"
 amphibious_drive_desc: "Комплект поплавковых устройств и небольшой винт позволяют быстро смонтировать этот резервуар в воду с судов на берег или через реку."
 secondary_turret_hmg: "Тяжелое пулеметное оружие"
 secondary_turret_hmg_desc: "Тяжелый пулемёт в вторичной башне. Помещение башни ограничивает дугу огня, снижая общую эффективность пистолета, но это позволяет танк атаковать больше целей. Это особенно полезно, когда наступает атака."
 secondary_turret_small_cannon: "Маленькая пушка"
 secondary_turret_small_cannon_desc: "Маленькая пушка в вторичной башне. Помещение башни ограничивает ее дугу огня, снижая общую эффективность пистолета, но это позволяет танк атаковать больше целей. Это особенно полезно, когда наступает атака."
 secondary_turret_close_support_gun: "Огнестрельное оружие"
 secondary_turret_close_support_gun_desc: "Установка башни ограничивает дугу огня, снижая общую эффективность пистолета, но она позволяет танку использовать больше целей. Это особенно полезно в момент нападения."
 sloped_armor: "Бронированный бронежилет"
 sloped_armor_desc: "Броневик, расположенный под углом к входящему корпусу, имеет гораздо более высокую эффективную толщину, чем то же количество бронежилетов, установленных вертикально; это также повышает вероятность того, что корпус просто отскочит безвредно; однако для этого требуется, чтобы вокруг него была сконструирована вся цистерна, что затрудняет сборку транспортного средства."
 stabilizer: "Стабилизатор"
 stabilizer_desc: "Механическое устройство, позволяющее держать пистолет в том же направлении, когда танк движется."
 smoke_launchers: "Дымовые пусковые установки"
 smoke_launchers_desc: "Батарея пиротехнических устройств, которая может быть сработана изнутри цистерны, чтобы создать густую дымовую оболочку, чтобы спрятать танк."
 extra_ammo_storage: "Дополнительное хранение боеприпасов"
 extra_ammo_storage_desc: "Дополнительные стойки готовых боеприпасов позволяют танку гораздо дольше оставаться в бою без пополнения запасов, однако в случае проникновения бронежилетов результаты могут быть катастрофическими, что особенно проблематично при нападении."
 wet_ammo_storage: "Хранение мокрых боеприпасов"
 wet_ammo_storage_desc: "Водяные жилеты, добавляемые в стеллажи боеприпасов, резко уменьшают опасность взрыва боеприпасов после попадания в танк, что высоко ценится экипажами."
 armor_tech_1_tt: "Включает усовершенствование стоимости бронетранспортера в 5 и выше."
 armor_tech_2_tt: "Включает повышение уровня боевой готовности на 10 и более единиц."
 armor_tech_3_tt: "Включает повышение уровня боевого состава до 15 и выше."
 armor_tech_4_tt: "Включает повышение уровня боезаряда в 18 и более лет."
 engine_tech_1_tt: "Включает усовершенствование значений для двигателя в 5 и выше."
 engine_tech_2_tt: "Включает усовершенствование значений для двигателя в 10 и более."
 engine_tech_3_tt: "Способствует модернизации двигателей в 15 и более раз."
 engine_tech_4_tt: "Способствует модернизации двигателей на уровне 18 и более."
