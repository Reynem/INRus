 improved_heavy_tank_chassis: "Усовершенствованные тяжелые цистерны"
 improved_heavy_tank_chassis_desc: "Хотя характер войны изменился, все еще есть место для тяжелого автомобиля с толстыми доспехами, чтобы создать прорыв в вражеских линиях или укрепить оборону против нападения против врага."
