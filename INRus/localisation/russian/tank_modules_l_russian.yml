 light_flame_tank: "Компания &quot; Легкий пожарный танк &quot;"
 light_flame_tank_desc: "Компания легковых автомобилей, оснащенных огнеметами, для оказания поддержки в нападениях на города и фортификационные сооружения."
 medium_flame_tank: "Компания Миддл фламанд"
 medium_flame_tank_desc: "Компания средних транспортных средств, оснащенных огнеметами, для оказания поддержки в нападениях на города и фортификационные сооружения."
 heavy_flame_tank: "&quot; Тяжелое пламя-танкерное предприятие &quot;"
 heavy_flame_tank_desc: "Компания тяжелых автомобилей, оснащенных огнеметами, для оказания поддержки в нападениях на города и фортификационные сооружения."

 light_tank_amphibious_chassis_desc: "Легкий бак, оборудованный устройствами поплавка и винтом."
 medium_tank_amphibious_chassis_desc: "Средняя цистерна, оборудованная устройствами поплавка и винтом."
 heavy_tank_amphibious_chassis_desc: "Тяжелая цистерна, оборудованная устройствами для поплавков и винтом."

 expanded_fuel_tank: "Топливный барабан"
 expanded_fuel_tank_desc: "Топливный барабан с внешней монтировкой, предназначенный для расширения рабочего диапазона бронетранспортера."

 land_cruiser_chassis: "Лэнд крузер Шасси"
 land_cruiser_chassis_desc: "Гангантуанский шасси, сильно бронированный и предназначенный для поддержки сверхтяжелого оружия и выдерживающий огромные мучения на поле боя, но с высоким потреблением топлива и медленной скоростью из-за его огромных размеров."
 land_cruiser_chassis_1: "Лэнд крузер Шасси"

