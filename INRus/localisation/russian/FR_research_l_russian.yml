 landing_craft: "Посадка"
 landing_craft_desc: "Наземные суда, совершающие вторжение, приземляются на враждебной территории слегка меньше головной боли."
 tank_landing_craft: "Усовершенствованный посадочный корабль"
 tank_landing_craft_desc: "Усовершенствованное посадочное судно означает, что наши мальчики могут попасть на пляж быстрее и эффективнее во время вторжения."
