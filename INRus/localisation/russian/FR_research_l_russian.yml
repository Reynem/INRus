 blitzkrieg_desc: "Война «Маньювер» означает стратегию быстрого движения бронированных сил при поддержке мобильной пехоты и авиаподдержки, которые пересекают вражеские линии, чтобы дезорганизовать и окружить их."
 modern_blitzkrieg: "Современная война в Маневере"
 modern_blitzkrieg_desc: "Первостепенное звено Mobile Warfare, Modern Maneuver Warfare включает в себя все последние технологические достижения и уроки, извлеченные из предыдущих доктрин."
 BLITZKRIEG_LABEL: "МАНУВЕР ВОЙНЫ"
