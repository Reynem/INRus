 RESEARCH_MESSAGE_UNLOCKED_TITLE: "Исследование закончено!"
 RESEARCH_MESSAGE_UNLOCKED_DESC: "Наша страна завершила исследование по вопросу о $NAMERY$.n $DESC$"
 RESEARCH_INSTANT_DESC: "Исследования — это момент, когда дерево изменяется с помощью более чем одной технологии, исследуемой в текущем дереве."
 infantry_folder: "Пехотные подразделения"
 infantry_folder_desc: "Оборудование и оружие для пехотных подразделений."
 support_folder:1 "Вспомогательные компании"
 support_folder_desc: "Разведка, инженеры, полевые больницы и другие вспомогательные компании."
 armour_folder: "Бронирование"
 armour_folder_desc: "Цистерны и их варианты."
 artillery_folder: "Артиллерия"
 artillery_folder_desc: "Артиллерийское, противотанковое и противовоздушное оружие для дивизий."
 land_doctrine_folder: "Земельная доктрина"
 land_doctrine_folder_desc: "Земельная доктрина, как сражаются ваши сухопутные силы."
 naval_folder: "Морской транспорт"
 naval_folder_desc: "Корабли и подводные лодки."
 mtgnavalfolder: "Морской транспорт"
 mtgnavalfolder_desc: "Корабли и подводные лодки, исследуйте новые модули для настройки ваших кораблей."
 naval_doctrine_folder: "Морская доктрина"
 naval_doctrine_folder_desc: "Морская доктрина, как твой флот сражается."
 air_techs_folder: "Воздух"
 air_techs_folder_desc: "Самолёт."
 air_doctrine_folder: "Воздушный доктрина"
 air_doctrine_folder_desc: "Воздушный доктрина, как ваши военно-воздушные силы сражаются."
 industry_folder: "Промышленность"
 industry: "Промышленность"
 industry_folder_desc: "Промышленность и производство."
 electronics_folder: "Инженерное дело"
 electronics_folder_desc: "Инженерные, радиолокационные, шифровальные и передовые технические исследования."
 secret_weapons_folder: "Секретное оружие"
 secret_weapons_folder_desc: "Чудесное оружие, продукт безумной науки."
 mobile_warfare: "Мобильная военная авиация"
 mobile_warfare_desc: "Mobile Warfare — это сосредоточение внимания на скорости и маневре, с тем чтобы отрезать и дезорганизировать вражеские силы."
 delay: "Задержка"
 delay_desc: "Даже в тех случаях, когда битва не может быть выиграна, было бы выгодно замедлить ход нападения на силы с помощью засад и тактики проволочек."
 elastic_defence: "Эластичная оборона"
 elastic_defence_desc: "Вместо того, чтобы сфокусировать всю силу на линии фронта, эластичная защита создает «слой защиты обезьян», который дает защитнику больше времени на реакцию и контрнападение, пока нападавший растянут и сбит."
 mobile_infantry: "Мобильное пехотное подразделение"
 mobile_infantry_desc: "Часто регулярные пехотные подразделения слишком медлительны, чтобы успевать за быстро движущимися бронированными силами, реагировать на них или убегать от них."
 mass_motorization: "Массовая моторизация"
 mass_motorization_desc: "Еще больше внимания уделяется моторизованным войскам."
 mechanised_offensive: "Механизированные наступательные операции"
 mechanised_offensive_desc: "Моторизованные войска хороши и хороши, но для того, чтобы возглавить наступательные операции, нам нужны пехотные подразделения, которые могут въехать в бронированные транспортные средства, которые защищают их и носят тяжелые вооружения."
 armored_spearhead: "Бронированная головка"
 armored_spearhead_desc: "Чтобы использовать Танки в полной мере, их нельзя привязать к пехоте, вместо этого они должны быть преобразованы в быстро движущиеся, независимые подразделения, которые могут вести атаки."
 schwerpunk: "Шверпанкт"
 schwerpunk_desc: "В любой операции должен быть определен Шверпанкт, или координационный центр, и максимальная сила должна быть сконцентрирована для того, чтобы выиграть в этот момент."
 blitzkrieg: "Блицкриг"
 blitzkrieg_desc: "Блицкриг ссылается на стратегию быстрого движения бронированных сил при поддержке мобильной пехоты и авиационной поддержки, которые пробиваются по вражеским линиям, с тем чтобы дезорганизовать и окружить их."
 kampfgruppe: "Кампфгруппе"
 kampfgruppe_desc: "&quot; Кампфгруппе &quot; является специальной структурой, которая была организована для выполнения конкретной задачи."
 firebrigades: "Пожарные бригады"
 firebrigades_desc: ""Огненные бригады" были поспешно сброшены вместе, чтобы отреагировать на вражеские прорывы или другие критические вопросы."
 backhand_blow: "Задний удар"
 backhand_blow_desc: "Вместо того, чтобы сражаться за каждый дюйм земли, проникновение противника во многом удается избежать до тех пор, пока они сами не разойдутся, и тогда они могут быть отрезаны и уничтожены контратаками."
 modern_blitzkrieg: "Современный Блицкриг"
 modern_blitzkrieg_desc: "В вершине &quot; Мобильной войны &quot; , Современный блицкриг , учитываются все последние технологические достижения и уроки, извлеченные из предыдущих доктрин."
 volkssturm: "Фолькстурм"
 volkssturm_desc: "Фолькстурм, или народная милиция, состоял из мужчин, которые были слишком старыми, слишком молодыми или иным образом не пригодными для регулярной военной службы."
 nd_conscription: "Недискриминационный призыв"
 nd_conscription_desc: "Даже инвалиды и калеки должны быть собраны, не может быть такого понятия, как гражданское лицо."
 werwolf_guerillas: "Паррилья Верволф"
 werwolf_guerillas_desc: "Верволвы были планируемой германской группой сопротивления, которая будет бороться против оккупационных держав, когда война проиграет."
 superior_firepower: "Высший огневой мощью"
 superior_firepower_desc: "Эта доктрина сосредоточена на бросании снарядов, а не людей, в врага. Наша сила ценна, пули дешевы."
 sup_delay: "Задержка"
 sup_delay_desc: "Даже в тех случаях, когда битва не может быть выиграна, было бы выгодно замедлить ход нападения на силы с помощью засад и тактики проволочек."
 mobile_defence: "Мобильная оборона"
 mobile_defence_desc: "Мобильные силы могут быть использованы для укрепления обороны, где бы противник не напал."
 intergrated_support: "Комплексная поддержка"
 intergrated_support_desc: "Тесная интеграция сил поддержки с боевыми войсками приводит к расколу, который сильнее при нападении."
 regimental_combat_teams: "Полковые боевые группы"
 regimental_combat_teams_desc: "Полковая боевая команда представляет собой пехотный полк, тесно интегрированный с вспомогательными подразделениями, такими, как артиллерийские, танки и разведывательные элементы, с тем чтобы сформировать небольшое самодостаточное подразделение, которое обеспечивает бóльшую гибкость при нападении."
 dispersed_support: "Поддержка в разрозненных подразделениях"
 dispersed_support_desc: "Разъединяя наши подразделения поддержки, они могут охватить более широкий район, оставаясь вне линии огня, что приведет к расколу с большей защитой."
 overwhelming_firepower: "Огненная мощь"
 overwhelming_firepower_desc: "Призыв всех имеющихся подразделений поддержки предоставить подавляющую огневую мощь может значительно смягчить цель или, что еще лучше, серьезно разрушить день нападавшего."
 sup_mechanized_offensive: "Механизированные наступательные операции"
 sup_mechanized_offensive_desc: "Моторизованные войска хороши и хороши, но для того, чтобы возглавить наступательные операции, нам нужны пехотные подразделения, которые могут въехать в бронированные транспортные средства, которые защищают их и носят тяжелые вооружения."
 concentrated_fire_plans: "Концентрированные планы пожаротушения"
 concentrated_fire_plans_desc: "Сосредоточив огонь различных батарей на синхронизированных бомбардировках, противнику может быть причинен гораздо больший ущерб."
 combined_arms: "Комбинированные вооружения"
 combined_arms_desc: "Броневые, пехотные и вспомогательные подразделения, работающие совместно в хорошо организованных группах, гораздо эффективнее, чем те же силы, которые используются отдельно."
 tactical_control: "Тактический контроль"
 tactical_control_desc: "Офицеры, знакомые с комбинированными операциями с оружием на передовых позициях, теперь могут непосредственно контролировать все операции подразделений."
 air_land_battle: "Битва за Землю"
 air_land_battle_desc: "С учетом того, что наземные силы уже действуют в составе объединенных групп вооружений, в битве «Эйр-Лэнд» в настоящее время также подчеркивается тесная координация между наземными и военно-воздушными силами, в результате чего боевые действия на воздушном и сухопутном пространствах сводятся в единое целое."
 centralized_fire_control: "Централизованная система пожаротушения"
 centralized_fire_control_desc: "Централизованная система пожаротушения позволяет оценивать все призывы к артиллерийской поддержке в одном месте, а в случае необходимости вся огневая мощь дивизии сконцентрирована на цели, а не только на подразделениях, которые могут запрашивать огонь от установленной для них артиллерии."
 forward_observers: "ПЕРСПЕКТИВНЫЕ НАБЛЮДАТЕЛИ"
 forward_observers_desc: "Передовые наблюдатели занимают позиции, в которых они могут непосредственно наблюдать за точностью и последствиями артиллерийского огня, и возвращают полученные результаты на оружие для исправления."
 advanced_firebases: "Усовершенствованные пожарные базы"
 advanced_firebases_desc: "Артиллерийские лагеря могут размещаться вблизи линии фронта на укрепленных базах, с тем чтобы оказывать максимально возможную поддержку передовым силам."
 shock_and_awe: "Шок и благоговение"
 shock_and_awe_desc: "Массовая концентрация огневой мощи приведет к тому, что этот подавляющий уровень Шока и Аве будет навязан противнику на незамедлительной или достаточно своевременной основе, с тем чтобы парализовать его волю к продолжению."
 grand_battle_plan: "Большой боевой план"
 grand_battle_plan_desc: "Ключом к успеху является тщательное планирование и подготовка до начала боевых действий."
 trench_warfare: "Тренч Война"
 trench_warfare_desc: "Лопата часто является лучшим оружием пехоты."
 prepared_defense: "Готовая оборона"
 prepared_defense_desc: "Более обширные системы полевого обогащения значительно улучшают защиту подразделения."
 grand_assault: "Нападение"
 grand_assault_desc: "Как только будет сформировано достаточно сил и хорошо спланированы их цели, мощное нападение не может не уничтожить врага."
 grand_mechanized_offensive: "Механизированные наступательные операции"
 grand_mechanized_offensive_desc: "Моторизованные войска хороши и хороши, но для того, чтобы возглавить наступательные операции, нам нужны пехотные подразделения, которые могут въехать в бронированные транспортные средства, которые защищают их и носят тяжелые вооружения."
 assault_concentration: "Концентрация нападения"
 assault_concentration_desc: "Перед нападением ведущие элементы тщательно подготовлены и помещены на передние позиции, что обеспечивает возможность применения максимальной силы в первые моменты."
 branch_interoperation: "РБ: ВР:"
 branch_interoperation_desc: "Улучшение координации между различными подразделениями вооруженных сил позволяет им лучше работать в рамках совместных операций с оружием."
 assault_breakthrough: "Проскок взлома"
 assault_breakthrough_desc: "Вместо того, чтобы совершить грандиозное нападение по всему фронту, может быть гораздо более эффективным сконцентрировать удар только на одном или нескольких точках линии врага и добиться прорыва в этом направлении."
 central_planning: "Централизованное планирование"
 central_planning_desc: "В настоящее время сотрудники всех подразделений участвуют в планировании той или иной операции, с тем чтобы обеспечить ее максимальную эффективность."
 c3i_theory: "C3I"
 c3i_theory_desc: "Эффективные штабные офицеры обеспечивают командование, контроль, связь и разведку между командиром и контролируемыми им подразделениями."
 infantry_offensive: "Нападение пехотных подразделений"
 infantry_offensive_desc: "Наступательный дух пехоты является решающим элементом победы в битвах."
 armored_operations: "Бронированные операции"
 armored_operations_desc: "Танки и другие бронированные машины весьма полезны для доставки пехоты на поле боя и для оказания прямой поддержки в боевых действиях."
 infiltration_assault: "Противодействие инфильтрации"
 infiltration_assault_desc: "При открытии боевых пехотинцев они должны нацелиться на слабые точки в линии противника, с тем чтобы обойти и изолировать более хорошо защищенные части, которые затем могут быть уничтожены остальными нападающими силами."
 night_assault_tactics: "Нападение на ночлег"
 night_assault_tactics_desc: "Солдаты, которые привыкли передвигаться и сражаться ночью, могут либо предвосхищать себя для нападения, либо непосредственно нападать на подозрительные вражеские силы."
 attritional_containment: "Сдерживание атрибуции"
 attritional_containment_desc: "Если мы не можем совершить нападение, чтобы снять вражескую позицию, то он должен, тем не менее, подвергаться постоянным незначительным нападениям, которые могут привести к потерям и помешать врагу совершить свои собственные нападения."
 infiltration_in_depth: "Инфильтрация в глубине"
 infiltration_in_depth_desc: "Наши силы теперь обучены обходить и изолировать вражеские сильные точки на гораздо большую глубину, и в идеале наши ударные силы не должны останавливаться до тех пор, пока они не достигнут задних районов врага и их силы полностью отрезаны."
 mass_assault: "Массовое нападение"
 mass_assault_desc: ""Идеальное" оружие переоценивается, большое количество "хорошего" оружия - путь к победе!"
 pocket_defence: "Карманная защита"
 pocket_defence_desc: "Вполне возможно, что наши войска будут пойманы в кармане, и в этом случае они будут просто держаться до тех пор, пока неизбежная контратака не освободит их."
 defence_in_depth: "Защита в глубине"
 defence_in_depth_desc: "Предлагая относительное легкое сопротивление и временно устанавливая почву, мы можем продать пространство на время и позволить атакующим силам исчерпывать себя до контрнападения."
 large_front_operations: "Операции с крупным фронтом"
 large_front_operations_desc: "Борьба за большой фронт предполагает координацию усилий многочисленных подразделений на большие расстояния: на оперативном уровне, а не на тактическом уровне."
 deep_operations: "Глубокие операции"
 deep_operations_desc: "Концепция Deep Operations, или Deep Battle, состоит в том, чтобы прорваться через оборонительные линии противника в различных точках и уничтожить его оперативные резервы, его оперативную глубину и занять как можно большую часть его стратегической глубины."
 operational_concentration: "Оперативная концентрация"
 operational_concentration_desc: "Ключом к любым военным действиям является подавляющее местное превосходство, не будучи подавляющим превосходством на всем фронте, это предполагает ослабление части вашей линии фронта, с тем чтобы сконцентрировать войска там, где это необходимо, а не пытаться быть сильным повсюду."
 vast_offensives: "Огромные наступления"
 vast_offensives_desc: "Если прорыв может быть достигнут, его необходимо использовать как можно более активно: широкомасштабное наступление, проталкивающее по вражеским линиям как можно глубже, сделает защиту их фронта более сложной, невозможной или неактуальной."
 breakthrough_priority: "Приоритет"
 breakthrough_priority_desc: "По мере расширения оперативной концентрации все потребности фронта зависят от необходимости концентрации сил на прорывах."
 mechanized_wave: "Механизированная волна"
 mechanized_wave_desc: "Механизированные силы идеально подходят для быстрого продвижения вперед, необходимого для надлежащего использования Прорывов, как для поддержки бронетранспортеров, так и для защиты флангов."
 continuous_offensive: "Непрерывные наступательные действия"
 continuous_offensive_desc: "Несмотря на то, что должным образом использованные проблески зачастую являются весьма эффективными, рано или поздно нападавший всегда истощается и защитник может реорганизовать и реформировать новые оборонительные линии, однако при наличии достаточных резервов и надлежащей организации наступление может быть продолжено до гораздо большей глубины с разрушительными последствиями для противника."
 human_wave_offensive: "Наступление человеческой волны"
 human_wave_offensive_desc: "Нападение на Человеческую волну представляет собой пехотную тактику, в рамках которой нападавший совершает фронтальное нападение с густонаселенными пехотными формированиями на линию противника с намерением захватить правозащитников путем ведения боевых действий."
 human_infantry_offensive: "Нападение пехотных подразделений"
 human_infantry_offensive_desc: "Наступательный дух пехоты является решающим элементом победы в битвах."
 large_front_offensive: "Крупные наступательные силы фронта"
 large_front_offensive_desc: "Проводя или угрожая наступлением человеческой волны на многочисленные районы фронта, мы можем помешать врагу сфокусировать свою огневую мощь на любой одной атаке."
 peoples_army: "Народная армия"
 peoples_army_desc: "Народная армия верит в главенство людей над оружием, при этом высшая мотивация компенсирует более низкие технологии, и пользуется широкой поддержкой гражданского населения."
 guerilla_warfare: "Гепардная война"
 guerilla_warfare_desc: "Враг продвигается вперед, мы отступаем, вражеские лагеря, мы притесняем, вражеские шины, мы атакуем, враг отступает, мы преследуем."
 infantry_weapons2: "Усовершенствованное пехотное оборудование I"
 infantry_weapons2_desc: "Персонал и экипаж поставляли оружие для пехоты, а также различные другие комплекты, в которых нуждался солдат."
 improved_infantry_weapons_2: "Усовершенствованное пехотное оборудование II"
 improved_infantry_weapons_2_desc: "Персонал и экипаж поставляли оружие для пехоты, а также различные другие комплекты, в которых нуждался солдат."
 advanced_infantry_weapons2: "Усовершенствованное пехотное оборудование III"
 advanced_infantry_weapons2_desc: "Личный состав и экипаж поставляли оружие для пехоты, а также различные другие комплекты, в которых нуждался солдат."
 infantry_at: "Пехотные подразделения по борьбе с наркотиками I"
 infantry_at_desc: "Бронирование наших пехотных подразделений противотанковыми винтовками позволит им изымать более легкие бронированные машины при сохранении мобильности."
 infantry_at2: "Пехотные подразделения по борьбе с бандитизмом II"
 infantry_at2_desc: "Для того чтобы пехота могла эффективно втягивать более тяжелые бронетанковые подразделения, необходимо сделать противотанковое оружие большого размера меньшим и легким."
 support_weapons: "Оружие первой поддержки"
 support_weapons_desc: "Автоматическое оружие становится все более портативным. Машинное оружие уже доказало свою эффективность, и разработка ручных вспомогательных вооружений должна продолжаться."
 support_weapons2: "Оружие II"
 support_weapons2_desc: "Разработка автоматического оружия, сочетающего в себе аспекты легких и тяжелых пулеметов, позволяет добиться универсальности в том, как наша пехота использует свое снаряжение."
 support_weapons3: "Оружие III"
 support_weapons3_desc: "Поддерживая и повышая надежность пулемётов, мы можем также экспериментировать с более высокими коэффициентами стрельбы, чтобы обеспечить смертоносность постоянного потока пуль."
 support_weapons4: "Вспомогательное оружие IV"
 support_weapons4_desc: "С расширением использования штурмовых винтовок разработка надежного автоматического оружия, которое может быть использовано в любой среде всеми солдатами, является одной из приоритетных задач современной армии."
 paratroopers: "Десантники I"
 paratroopers_desc: "За счет включения воздушных сил в нашу армию мы можем произвести принудительные входы и разместить ключевые войска в ранее недоступных районах, что позволит создать новые тактические возможности."
 paratroopers2: "Десантники II"
 paratroopers2_desc: "Переход от небольших операций с несколькими десантниками к более крупным авиационным дивизиям открывает путь для массовых воздушных высадок, выводя эти силы за пределы новизны в естественную часть войны."
 paratroopers3: "Десантники III"
 paratroopers3_desc: "Усвоение навыков адаптации парадров к погодным условиям, стандартизация оборудования, такого, как сапоги для прыжков, и расширение специализированной подготовки позволят свести к минимуму путаницу и риски, связанные с этими опасными полетами."
 marines: "Морские пехотинцы I"
 marines_desc: "Импровизированные методы и снаряжение становятся достоянием прошлого, поскольку наша военно-морская пехота поддерживается специализированными посадочными аппаратами и тренировками."
 marines2: "Морские пехотинцы II"
 marines2_desc: "Совершенствование материально-технической поддержки и портативных гаваней может позволить нашим морским пехотинцам производить посадку, которая в противном случае была бы невозможной."
 marines3: "Морские пехотинцы III"
 marines3_desc: "Морские пехотинцы могут быть не просто амфибией, и в будущем наш морской корпус будет одним из самых дисциплинированных и организованных специальных сил."
 tech_mountaineers: "Пехотное подразделение I"
 tech_mountaineers_desc: "Боевые действия на горных хребтах подвергают войскам множество опасностей, но иногда их невозможно избежать."
 tech_mountaineers2: "Пехотное подразделение II"
 tech_mountaineers2_desc: "Если мы не выживем, наши силы могут быть обучены использовать горы в своих интересах, с помощью легкого оборудования и муловых транспортных средств, они могут управлять этой местностью лучше, чем другие пехотинцы."
 tech_mountaineers3: "Пехотная группа Гора III"
 tech_mountaineers3_desc: "Подготовка к самым трудным горным полетам на больших высотах и при низких температурах потребует чрезвычайной подготовки и дисциплины со стороны наших горных войск."
 tech_special_forces: "Специальные силы"
 tech_special_forces_desc: "Мы должны обеспечить, чтобы наши войска были готовы и могли адаптироваться к тяжелым условиям."
 advanced_special_forces: "Повышение квалификации спецназовцев"
 advanced_special_forces_desc: "Благодаря интенсивной подготовке мы можем обеспечить, чтобы наши специальные силы могли действовать сверх обычных мужчин."
 improved_special_forces:1 "Расширенная программа специальных сил"
 improved_special_forces_desc:1 "Мы должны расширить учебные программы, чтобы повысить квалификацию наших солдат."
 extreme_environment_training: "Профессиональная подготовка по вопросам охраны окружающей среды"
 extreme_environment_training_desc: "Мы должны иметь возможность бороться в самых суровых условиях, при надлежащей подготовке и оснащении наши войска смогут сражаться в самых экстремальных условиях."
 survival_training: "Профессиональная подготовка по вопросам выживания"
 survival_training_desc: "Наши специальные силы часто будут сражаться за линии противника и в дефиците."
 elite_forces: "Элитные силы"
 elite_forces_desc: "Только лучшие из лучших станут специальными силами, солдаты, которые пройдут подготовку, будут сильнее, быстрее и сильнее, чем кто-либо другой."
 jungle_warfare: "Война джунглей"
 jungle_warfare_desc: "Специальное обучение, чтобы сделать наших солдат эффективными в джунглях."
 HUN_light_infantry_tech: "Доктрина легких пехотных подразделений"
 HUN_light_infantry_tech_desc: "Сокращение количества поддерживающих вооружений в наших пехотных дивизиях делает их более гибкими и дает им преимущество в боевых действиях в таких ограниченных районах, как города и леса."
 tech_recon: "Разведывательная компания I"
 tech_recon_desc: "Послание небольших групп вперёд на разведку, прежде чем передвигаться в главных силах, позволяет нам собрать информацию о том, где находится враг и скольких мы встречаемся."
 tech_recon2: "Разведывательная компания II"
 tech_recon2_desc: "Подготовка наших патрулей к быстрому передвижению и выводу и оснащение их для устранения препятствий, создаваемых противником, увеличит их шансы вернуться живыми."
 tech_recon3: "Разведывательная компания III"
 tech_recon3_desc: "Совершенствование радиотехнологий изменяет методы проведения разведывательных миссий, что позволяет быстро передавать собранные разведывательные данные."
 tech_recon4: "Разведывательная компания IV"
 tech_recon4_desc: "Глубокие разведывательные операции, смешивание шпионажа, партизанские операции и обучение командному составу помогут нам сделать тактический выбор и позволят нам быстро адаптировать процесс принятия решений."
 tech_engineers: "Инженерная рота I"
 tech_engineers_desc: "Сооружение укреплений и преодоление препятствий делают боевых инженеров жизненно важными на местах, а наделение наших инженеров разносторонней ролью позволяет нам развертывать их в различных ситуациях, в которых они будут необходимы."
 tech_engineers2: "Инженерная рота II"
 tech_engineers2_desc: "Благодаря современному оборудованию и высоким взрывчатым веществам наши инженеры могут выйти за рамки своих традиционных задач и удивить врага своей изобретательностью на суше и на море."
 tech_engineers3: "Инженерная рота III"
 tech_engineers3_desc: "Сооружение передовой инфраструктуры позволяет осуществлять операции, требующие поставок сверх того, что обычно имеется на местах."
 tech_engineers4: "Инженерная рота IV"
 tech_engineers4_desc: "Поддержание местной мобильности при строительстве того, что ранее считалось бы постоянным креплением и системами снабжения, военные инженеры будущего будут обеспечивать, чтобы, где бы наши войска ни подвергались нападению, они были готовы."
 hospital_tech: "Полевые больницы"
 logistics_tech: "Логистическая рота"
 recon_tech: "Разведывательная компания"
 tech_field_hospital: "Полевая больница I"
 tech_field_hospital_desc: "Жертва не должна означать мертвого солдата."
 tech_field_hospital2: "Полевая больница II"
 tech_field_hospital2_desc: "Устанавливая портативные больницы, доставляя медицинскую помощь туда, где она необходима, мы можем остановить многие ненужные смерти и постоянные травмы."
 tech_field_hospital3: "Полевая больница III"
 tech_field_hospital3_desc: "Хирургия является одним из наиболее распространенных чрезвычайных процедур, необходимых на местах, и процедуры и инструменты для этого должны быть доступны ближе к фронту, и мы должны обеспечить, чтобы квалифицированные хирурги входили в состав военных медицинских подразделений."
 tech_field_hospital4: "Полевая больница IV"
 tech_field_hospital4_desc: "Несмотря на многочисленные улучшения в области полевой медицины, многие достижения носят самодельный характер и нам не хватает устоявшейся доктрины."
 tech_logistics_company: "Группа материально-технического обеспечения I"
 tech_logistics_company_desc: "Наличие в наших рядах специалистов по материально-техническому обеспечению обеспечит использование сетей поддержки для сведения к минимуму отходов."
 tech_logistics_company2: "Логистическая рота II"
 tech_logistics_company2_desc: "Адаптация нашего анализа рисков к новым условиям войны повысит безопасность нашей материально-технической поддержки."
 tech_logistics_company3: "Логистическая рота III"
 tech_logistics_company3_desc: "Постоянная статистическая оценка потребностей в войсках способствует максимальному использованию наших ресурсов."
 tech_logistics_company4: "Логистическая рота IV"
 tech_logistics_company4_desc: "Разработка стандартизированных классификаций поставок позволит свести к минимуму путаницу и повысить эффективность планирования."
 tech_military_police: "Военная полиция I"
 tech_military_police_desc: "Включение военной полиции в состав наших сил обеспечит наличие людей на местах для реагирования на сопротивление и расследования случаев диверсии."
 tech_military_police2: "Военная полиция II"
 tech_military_police2_desc: "Выполняя регулярные полицейские функции на оккупированных территориях, такие, как управление движением и поддержание общественного порядка, наша военная полиция может свести к минимуму хаос и путаницу, в которых процветают партизанские движения."
 tech_military_police3: "Военная полиция III"
 tech_military_police3_desc: "В сотрудничестве с местными шпионскими сетями и информаторами, созданными до оккупации, наша военная полиция может активно подготовиться к тому, где, вероятно, возникнет сопротивление."
 tech_military_police4: "Военная полиция IV"
 tech_military_police4_desc: "Наша военная полиция должна обеспечить скорейшее начало этого процесса, с тем чтобы обеспечить безопасность как солдат, так и гражданских лиц."
 tech_signal_company: "Сигнал I"
 tech_signal_company_desc: "Создание и поддержание связи на местах всегда требовало специальных навыков."
 tech_signal_company2: "Сигнал Компания II"
 tech_signal_company2_desc: "Сигнальные компании, занимающиеся вопросами связи между различными подразделениями вооруженных сил, могут обеспечить, чтобы наземные силы могли координировать свои усилия с морскими и воздушными операциями и планировать свои передвижения более оперативно."
 tech_signal_company3: "Сигналная компания III"
 tech_signal_company3_desc: "Все более жизнеспособной становится переносная коммуникационная технология, которая сама по себе является рюкзаком, что требует более высокой мобильности сигнального корпуса."
 tech_signal_company4: "Сигнальная компания IV"
 tech_signal_company4_desc: "Среди наших специалистов по сигналам есть люди, обладающие беспрецедентными непосредственными знаниями об использовании этого оборудования на местах, и, привлекая их к изучению новых коммуникационных технологий, мы можем использовать их опыт."
 tech_maintenance_company: "Ремонтно-эксплуатационная компания I"
 tech_maintenance_company_desc: "Техническое обслуживание, ремонт и ремонт имеют важное значение для обеспечения надежности и безопасности использования военной техники."
 tech_maintenance_company2: "Ремонтно-эксплуатационная компания II"
 tech_maintenance_company2_desc: "Обычные процедуры оперативного обслуживания сводят к минимуму риски, связанные с разрушением оборудования, и предупреждают военнослужащих о необходимости его замены до того, как это произойдет."
 tech_maintenance_company3: "Ремонтно-эксплуатационная компания III"
 tech_maintenance_company3_desc: "Обеспечение того, чтобы наши войска всегда располагали основными материалами на местах для проведения общих ремонтных работ, позволит предотвратить дальнейшее использование оборудования, которое, как известно, было повреждено."
 tech_maintenance_company4: "Ремонтно-эксплуатационная компания IV"
 tech_maintenance_company4_desc: "Опыт проектирования активной резервной системы во время Великой войны можно обновить, с тем чтобы работать с более современным оборудованием, облегчающим техническое обслуживание."
 motorised_infantry: "Моторизованное пехотное подразделение"
 motorised_infantry_desc: "Благодаря расширению использования автотранспортных средств в пехотных перевозках на местах мобильность медленно движущихся пехотных подразделений может быть значительно улучшена, что позволит быстрее реагировать и разрабатывать новые стратегии."
 night_vision: "Видение ночи I"
 night_vision_desc: "Способность видеть врага без его вида является ключом к ночным операциям. с изобретением инфракрасной технологии мы можем оснастить нашу армию устройствами, которые, хотя и неудобны, делают это возможным."
 night_vision2: "Видение ночи II"
 night_vision2_desc: "Ранние инфракрасные области, хотя первоначально предназначались для использования снайперами, имели ограниченный диапазон зрения."
 basic_machine_tools: "Базовое машинное оборудование"
 basic_machine_tools_desc: "В военном производстве могут использоваться различные новые мельничные машины, начиная с мелких и разнородных типов, доступных для любого машинного магазина, и заканчивая крупными, передовыми моделями, повышающими технологические пределы."
 improved_machine_tools: "Усовершенствованные машины"
 improved_machine_tools_desc: "Обеспечение эффективного строительства и использования самих латов даст нам значительные промышленные преимущества."
 advanced_machine_tools: "Инструменты усовершенствованной машины"
 advanced_machine_tools_desc: "Автоматизация машинного оборудования с использованием сергоманизма уже обсуждалась ранее."
 assembly_line_production: "Производственная линия Собрание"
 assembly_line_production_desc: "Электрическая сборочная линия, которая уже используется во многих отраслях, может изменить ход войны, позволив беспрецедентной лавине производства."
 flexible_line: "Гибкая линия"
 flexible_line_desc: "Как бы хорошо ни была смазана машина, она по-прежнему укомплектована людьми, что позволяет ей адаптироваться, когда это необходимо."
 streamlined_line: "Упорядоченная линия"
 streamlined_line_desc: "Стандартизация и жесткая структура сборочной линии являются ключевыми элементами ее эффективности и безопасности, которые должны стать ключевыми аспектами развития нашего промышленного производства."
 improved_equipment_conversion: "Преобразование усовершенствованного оборудования"
 improved_equipment_conversion_desc: "Прогресс в области инженерного прогресса позволяет нам решить проблемы, которые мы нашли в предыдущих моделях, и обновить их, с тем чтобы они отвечали нашим нынешним потребностям."
 advanced_equipment_conversion: "Преобразование усовершенствованного оборудования"
 advanced_equipment_conversion_desc: "Создание специализированных групп и сборочных линий для модернизации наших устаревших моделей всегда будет приводить к гибели нашей военной машины."
 concentrated_industry: "Концентрированная промышленность I"
 concentrated_industry_desc: "Сосредоточение нашего промышленного производства на нескольких ключевых участках позволит нам резко повысить его эффективность."
 concentrated_industry2: "Концентрированная промышленность II"
 concentrated_industry2_desc: "Дальнейшая концентрация производства поможет снизить издержки."
 concentrated_industry3: "Концентрированная промышленность III"
 concentrated_industry3_desc: "Инфраструктурные расходы можно снизить за счет адаптации сетей к нашей более целенаправленной промышленности."
 concentrated_industry4: "Концентрированная промышленность IV"
 concentrated_industry4_desc: "Сохранение ключевых точек в нашей отрасли в непосредственной близости друг от друга повышает воздействие этих концентрированных участков."
 concentrated_industry5: "Концентрированная промышленность V"
 concentrated_industry5_desc: "Крупные промышленные комплексы сегодня объединяют многие части нашей промышленности, сводя к минимуму расходы на транспорт и рабочую силу."
 dispersed_industry: "Промышленность I"
 dispersed_industry_desc: "Распространяя нашу промышленность, мы можем обеспечить, чтобы врагам было трудно преследовать во время войны."
 dispersed_industry2: "Промышленность II"
 dispersed_industry2_desc: "Дальнейшая децентрализация нашей обрабатывающей промышленности затрудняет удар по конкретным ее частям."
 dispersed_industry3: "Отраслевая промышленность III"
 dispersed_industry3_desc: "Если заводы будут работать под прикрытием других операций, это уменьшит риск прямых нападений."
 dispersed_industry4: "Промышленность IV"
 dispersed_industry4_desc: "Комапуфлирование и рассеивание наших заводов создает сеть, которая очень трудно полностью разрушить."
 dispersed_industry5: "Разъединенная промышленность V"
 dispersed_industry5_desc: "Благодаря не только нашей промышленности, но и инфраструктуре, связывающей ее вместе, мы можем сделать еще более сложным уничтожение с помощью воздушных атак."
 synth_oil_experiments: "Синтетические эксперименты с нефтью"
 synth_oil_experiments_desc: "Для уменьшения зависимости от нефти можно исследовать процессы производства заменителей других веществ и материалов."
 early_refining: "Ранняя доработка"
 early_refining_desc: "Для создания современной отрасли необходимо продолжать использовать эти методы."
 oil_processing: "Обработка нефти"
 oil_processing_desc: "Следующим шагом на пути к обеспечению поставок топлива для нашей страны является создание сети заводов по синтетической перегонке и переработке нефтепродуктов."
 improved_oil_processing: "Совершенствование переработки нефти"
 improved_oil_processing_desc: "Переход ранее экспериментальных методов перегонки к крупномасштабным операциям позволит нам лучше адаптироваться к имеющимся материалам и потребностям."
 advanced_oil_processing: "Усовершенствованная обработка нефти"
 advanced_oil_processing_desc: "Новые экспериментальные методы очистки, такие, как гидрообработка, могут использоваться при производстве нефти для значительного улучшения конечного продукта."
 modern_oil_processing: "Современная переработка нефти"
 modern_oil_processing_desc:1 "Наши нефтеперерабатывающие заводы могут быть усовершенствованы с помощью новых передовых методов переработки нефти, таких, как гидрократизация, алкилизация, окисление Меркаптана и изомеризация."
 rubber_processing: "Обработка каучука"
 rubber_processing_desc:1 "Промышленная обработка синтетического каучука необходима для уменьшения нашей зависимости от натурального каучука."
 improved_rubber_processing: "Улучшение обработки каучука"
 improved_rubber_processing_desc:1 "Крупномасштабное производство синтетического каучука возможно с использованием новых процессов для ускорения реакций дегидрогенации."
 advanced_rubber_processing: "Усовершенствованная обработка каучука"
 advanced_rubber_processing_desc:1 "Общецелевая синтетическая резиновая реципия с улучшенными процессами, такими, как додизил-меркаптановые полимеризаторы, позволит нам расширить производство синтетического каучука."
 modern_rubber_processing: "Современная обработка каучука"
 modern_rubber_processing_desc:1 "Переход к более оптимальным процессам полимеризации приведет к снижению затрат и увеличению объема производства."
 construction1: "Строительство I"
 construction1_desc: "Усовершенствованные методы и материалы позволяют нам быстрее строить здания, как гражданские, так и военные."
 construction2: "Строительство II"
 construction2_desc: "Модернизация наших инструментов и оборудования будет еще больше способствовать нашим усилиям в области строительства."
 construction3: "Строительство III"
 construction3_desc: "Для того чтобы значительно ускорить ремонт, можно использовать современные транспортные средства и опыт, накопленный в ходе наших строительных работ."
 construction4: "Строительство IV"
 construction4_desc: "Более высокая степень механизации и более совершенные процедуры способствуют дальнейшему повышению скорости строительства зданий."
 construction5: "Строительство V"
 construction5_desc: "Будущее эффективного строительства потребует более широкого планирования отдельных проектов, а также, где это возможно, стандартизированных решений."
 excavation1: "Раскопки I"
 excavation1_desc: "Совершенствование методов бурения позволяет нам выкапывать ресурсы, которые не удалось достать раньше."
 excavation2: "Раскопки II"
 excavation2_desc: "Новые методы помогают нам более эффективно собирать ресурсы."
 excavation3: "Раскопки III"
 excavation3_desc: "Прогресс в области геологии помогает нам определить место нахождения ресурсов, и теперь мы можем сосредоточить наши усилия по добыче в тех местах, где существует большая вероятность того, что будут найдены значительные объемы природных ресурсов."
 excavation4: "Раскопки IV"
 excavation4_desc: "Автоматизация ключевых процессов и совершенствование механики делают все наши ресурсные сайты гораздо более эффективными."
 excavation5: "Раскопки V"
 excavation5_desc: "Прогресс в таких областях, как поверхностная добыча полезных ископаемых, дает нам больше ресурсов из наших нынешних мест добычи."
 excavation_tech: "Экскавационные технологии"
 electronic_mechanical_engineering: "Электронное механическое оборудование"
 electronic_mechanical_engineering_desc: "Мы живем в эпоху, когда электротехники не только тепло и светят нас, но и помогают нам мыслить и общаться."
 radio: "Радио"
 radio_desc: "Принятие изобретений радиооператоров-любителей и расширение использования радиостанций ЧМ позволит уменьшить радиопомехи и найти новые способы использования радиотехнологий."
 radio_detection: "Радиообнаружение"
 radio_detection_desc: "Разработка RADAR, Radio Discrimination и Ranging позволяет использовать радиоволны для обнаружения физических объектов."
 decimetric_radar: "Дециометрический радиолокатор"
 decimetric_radar_desc: "Многие подразделения используют элемент неожиданности для обеспечения своей эффективности."
 improved_decimetric_radar: "Усовершенствованный дециометрический радиолокатор"
 improved_decimetric_radar_desc: "Использование радиолокатора уже доказало свою важность, но наши дециметрические радиолокационные установки слишком малы, чтобы обеспечить хороший охват."
 centimetric_radar: "Центиметрический радиолокатор"
 centimetric_radar_desc: "Новые радиолокаторы, функционирующие в микроволновых полосах, позволяют нам обнаружить объекты слишком малы, чтобы их можно было засекать."
 improved_centimetric_radar: "Усовершенствованный центрометрический радиолокатор"
 improved_centimetric_radar_desc: "Внедрение современных радиолокационных технологий, таких, как монопульсные радиолокаторы, в ключевых операциях позволит обеспечить экстремальную точность слежения."
 advanced_centimetric_radar: "Усовершенствованный центрометрический радиолокатор"
 advanced_centimetric_radar_desc: "Несмотря на наши передовые радары, у врага все еще есть способы избежать обнаружения."
 mechanical_computing: "Механические вычисления"
 mechanical_computing_desc: "Строительные машины, способные проводить усовершенствованный дифференциальный анализ, радикально изменят то, какие расчеты могут производиться с помощью машин."
 computing_machine: "Компьютерная машина"
 computing_machine_desc: "Разработка теоретической основы для современных компьютеров и строительство электромеханических машин для их практического применения станут первыми шагами в этой области возможностей."
 improved_computing_machine: "Усовершенствованная вычислительная машина"
 improved_computing_machine_desc: "Электронные цифровые компьютеры теперь можно сделать программируемыми."
 advanced_computing_machine: "Усовершенствованная вычислительная машина"
 advanced_computing_machine_desc: "Начиная работать с компьютерами, способными хранить программы и использовать транзисторы, мы встанем на путь цифровой революции, где эти машины могут использоваться практически в любой области."
 basic_encryption:1 "Шифрование - полиальфабетические циферы"
 basic_encryption_desc: "С появлением новых методов связи возникают новые риски перехвата."
 improved_encryption:1 "Шифрование - циклические препоны"
 improved_encryption_desc: "Ограничение случайности шифровальных машин может быть использовано, чтобы сломать шифры. Улучшая случайность роторной механики, мы можем сделать этот тип криптографического анализа более сложным."
 advanced_encryption:1 "Модуляция шифрования - импульсный код"
 advanced_encryption_desc: "Технологические усовершенствования и с большим трудом накопленный опыт позволяют нам принимать более активные меры по обеспечению безопасности дорожного движения в рамках нашей коммуникации."
 basic_decryption:1 "Расшифровка - Частотный анализ"
 basic_decryption_desc: "Криптографический анализ становится все более продвинутой математической наукой."
 improved_decryption:1 "Расшифровка - Боковая атака"
 improved_decryption_desc: "Разработка более сложных компьютеров позволяет применять новые методы криптографического анализа, такие, как различия, которые могут использоваться для разрушения передовых циферов в сочетании с новыми методами шифрования рук."
 advanced_decryption:1 "Расшифровка - Автоматизированная дедукция"
 advanced_decryption_desc: "Увеличение вычислительной мощности, которое улучшило наш криптографический анализ, угрожает создать в будущем почти нерушимые шифры."
 experimental_rockets: "Экспериментальные ракеты"
 experimental_rockets_desc: "Продвижение науки о ракетах за счет повышения дальности и надежности ракет, работающих на жидком топливе, позволит нам достаточно подробно ознакомиться с технологией, которая позволит построить пусковые площадки для более совершенных моделей."
 rocket_engines: "Ракетные двигатели"
 rocket_engines_desc: "Знания о ракетной тяге достигают такой точки, где мы можем построить летающие бомбы и ракетные самолеты, которые будут работать с ранее недостижимой скоростью."
 improved_rocket_engines: "Усовершенствованные ракетные двигатели"
 improved_rocket_engines_desc: "Первые баллистические ракеты большой дальности можно построить и сделать еще более точными, охватив отдаленные вражеские города и даже в космос."
 advanced_rocket_engines: "Усовершенствованные ракетные двигатели"
 advanced_rocket_engines_desc: "Будущее ракет открывает такие возможности, как межконтинентальные ракеты, радиус действия которых не знает никаких границ, в то время как полезная нагрузка становится все более смертоносной."
 atomic_research: "Атомные исследования"
 atomic_research_desc: "В области ядерного деления разделение атома приносит огромное количество энергии и безграничный разрушительный потенциал."
 rocket_interceptor: "Перехватчик ракет"
 rocket_interceptor_desc: "Ракетный перехватчик, основанный на глайдерах, может в течение короткого периода времени двигаться быстрее, чем любой другой самолет."
 rocket_interceptor_2: "Перехватчик ракет II"
 rocket_interceptor_2_desc: "По-прежнему считается крайне опасным для функционирования, что истребителям, работающим на ракетах, в настоящее время оказывают помощь самолёты и буксируют другие самолеты, с тем чтобы максимально использовать их экстремальную скорость, но короткое топливное окно."
 rocket_interceptor_3: "Перехватчик ракет III"
 rocket_interceptor_3_desc: "Новые методы посадки и более безопасные топливные системы значительно повысили шансы ракетных истребителей на успех и выживание, что позволило реализовать некогда теоретический потенциал этих передовых транспортных средств."
 nukes: "Ядерные бомбы"
 nukes_desc: "Проект по созданию атомной бомбы станет одной из самых скрытных и трудных задач, которые может выполнить страна, но в случае успеха может изменить не только ход сегодняшних войн, но и будущее мира."
 interwar_artillery: "Межвоенная артиллерия"
 interwar_artillery_desc: "Уроки, извлеченные в ходе разработки различных видов артиллерийских орудий, могут быть использованы при проектировании других предметов."
 artillery1: "Артиллерия I"
 artillery1_desc: "С помощью более современных материалов и механизмов гаубицы и полевые пушки из Великой войны могут быть переоборудованы и модернизированы для современных боевых действий."
 artillery2: "Модернизация артиллерии I"
 artillery2_desc: "Потребуются новые гаубицы с использованием новых гидравлических устройств оттока и более длинных бочек."
 artillery3: "Модернизация артиллерии II"
 artillery3_desc: "Для обеспечения более тяжелых пушек на более легких вагонах в гаубицы могут быть включены тормоза."
 artillery4: "Артиллерия IV"
 artillery4_desc: "Разработка легкой артиллерии, способной быть разбитой на транспорт, позволит доставлять артиллерийскую поддержку в районы, которые ранее были труднодоступными."
 artillery5: "Модернизация артиллерийской артиллерии"
 artillery5_desc: "Артиллерийские конструкции с меньшими силуэтами будут труднее для противника."
 mountain_gun: "Горное оружие"
 mountain_gun_desc: "Горная местность Северной Индии привела к разработке артиллерии, которая может быть демонтирована и перевезена туда, где это необходимо."
 rocket_artillery2: "Артиллерийская артиллерия Модернизация I"
 rocket_artillery2_desc: "Самоходная артиллерия, использующая несколько ракет, сможет быстро вызвать широкомасштабные разрушения, сохраняя при этом мобильность, с тем чтобы избежать контрострела."
 rocket_artillery3: "Артиллерийская артиллерия Модернизация II"
 rocket_artillery3_desc: "Если мы пожертвуем дальностью удара, мы можем запустить более тяжелые ракеты на более крупных автомобилях, работая в командах, эти артиллерийские батареи могут сотрудничать, чтобы быстро перезарядить и переместиться."
 rocket_artillery4: "Ракетные артиллерии III"
 rocket_artillery4_desc: "Стабилизированные ракеты могут увеличить дальность применения более легких артиллерийских батарей."
 antiair1: "Модернизация противовоздушной среды"
 antiair1_desc: "С помощью механизмов быстрой перегрузки противовоздушные орудия, перевозящие крупные снаряды, по-прежнему могут сохранять необходимую скорость стрельбы."
 antiair2: "Противоядие II"
 antiair2_desc: "Для нанесения ударов по высоколетающим самолетам потребуются более длинные патроны и бочки на противовоздушных ружьях."
 antiair3: "Улучшенная система борьбы с воздушно-воздушными заболеваниями I"
 antiair3_desc: "По мере совершенствования радиолокационных систем использование радиолокационного направления зенитных орудий становится более жизнеспособным."
 antiair4: "Повышение уровня готовности к воздушно-воздушным работам"
 antiair4_desc: "Для быстрого реагирования на более быстрые летательные аппараты необходимо будет объединить современные системы радиолокационных, компьютеризированных и автопогрузчиков."
 antiair5: "Противовоздушные силы V"
 antiair5_desc: "Разработка мобильной платформы для этих целей должна стать нашей следующей целью."
 antitank1: "Противоядие"
 antitank1_desc: "Важность эффективного противотанкового оружия была установлена во время Великой войны, и для борьбы с современными конструкциями танков потребуется введение нового поколения такого оружия."
 antitank2: "Антитанк II"
 antitank2_desc: "Большинство противотанковых пушек пока довольно легкие. Для борьбы с тяжёлыми танками с наклонной броней потребуются более крупные ружья."
 antitank3: "Улучшенная антитанковая модернизация I"
 antitank3_desc: "В противотанковой артиллерии могут использоваться снаряды HEAT (высоковзрывные противотанковые) для компенсации ограниченной скорости музыки."
 antitank4: "Улучшенная антитанковая модернизация второго класса"
 antitank4_desc: "Новые разносторонние противотанковые пулеметы, в которых используются бронебойные выстрелы из саботов, могут проникнуть в доспехи почти любого танка."
 antitank5: "Антитанк V"
 antitank5_desc: "Сочетая различные виды новой технологии боеприпасов с пушками с более высокой скоростью музыки, мы можем быть готовы к любым новым доспехам, которые могут появиться у наших врагов."
 air_superiority: "Воздушная высота"
 air_superiority_desc: "Достижение величия в воздухе затруднит использование вражеских бомбардировщиков против нашей страны, позволит использовать наших бомбардировщиков против наших врагов."
 formation_flying: "Формирование летательного аппарата"
 formation_flying_desc: "Летая в составе самолетов, они могут поддерживать друг друга или работать вместе, чтобы атаковать врагов."
 air_offense: "Сопровождение истребителей"
 air_offense_desc: "Сосредоточившись на бомбардировках в течение дня, мы должны защитить наших бомбардировщиков от перехвата боевиков."
 fighter_baiting: "Бойц-приманщик"
 fighter_baiting_desc: "Став уязвимыми, наши бойцы могут заманить вражеские самолеты в засаду."
 dogfighting_experience: "Опыт собачьей борьбы"
 dogfighting_experience_desc: "Нелегко следить за относительными позициями друзей и врагов в бурной схватке собачьей драки, но по мере того, как наши пилоты приобретают опыт, они становятся более находчивыми в этом."
 fighter_ace_initiative: "Инициатива Боевые узы"
 fighter_ace_initiative_desc: "Предоставление специальных наград и статуса пилотам, достигшим статуса Эйса, путем уничтожения пяти врагов, поощрения рисков и создания чувства элитности в пилотах Эйса, хотя это, как правило, приводит к тому, что опытные пилоты остаются на боевых позициях."
 multialtitude_flying: "Множественное плавание"
 multialtitude_flying_desc: "Воздушные бои проходят в трех измерениях, но большинству пилотов труднее следить за самолетами, летящими над ними или под ними."
 offensive_formations: "Формирование наступательных потенциалов"
 offensive_formations_desc: "Обучение в более агрессивных формированиях делает наших бойцов более смертоносными в бою."
 fighter_sweeps: "Боевые свитки"
 fighter_sweeps_desc: "Агрессивное патрулирование боевиков над территорией противника может поймать их самолеты, взлетающие или приземляющиеся, когда они особенно уязвимы, или нарушить полеты противника."
 force_rotation: "Вращение силы"
 force_rotation_desc: "Борьбы, или просто длительные периоды интенсивной концентрации, утомительны, но, по возможности, обмениваясь свежими силами, мы можем уменьшить ошибки из-за усталости пилота."
 air_defence: "Воздушная оборона"
 air_defence_desc: "Обучая наших пилотов постоянно быть на страже, даже когда, по всей видимости, нет опасности, их шансы перехватить вражеские самолеты повышаются."
 dispersed_fighting: "Разъединенные боевые действия"
 dispersed_fighting_desc: "Принятие более рассредоточенного состава позволяет такому же числу самолетов патрулировать более широкий район."
 forward_interception: "Перехват вперед"
 forward_interception_desc: "Приближаясь к вражескому воздушному пространству, становится более вероятным, что наши истребители смогут перехватить вражеские самолеты, прежде чем они смогут достичь своих целей."
 fighter_veteran_initiative: "Инициатива Боевые ветераны"
 fighter_veteran_initiative_desc: "Уделение особого внимания долгосрочному выживанию экспериментальных проектов как с помощью осмотрительной тактики, так и путем ротации опытных пилотов на должности, связанные с профессиональной подготовкой, означает, что они могут передавать опыт, который они извлекли, новым пилотам."
 formation_fighting: "Формирование боевых действий"
 formation_fighting_desc: "Полет в правых формациях позволяет пилотам прикрывать слепые пятна друг друга, что ведет к повышению способности обнаруживать вражеские самолеты."
 air_skirmish: "Воздушный скирмиш"
 air_skirmish_desc: "К сожалению, не всегда возможно уничтожить каждый вражеский самолет, найденный над нашей страной, но можно преследовать их с момента их обнаружения и до момента, когда они уходят, постоянно измывая их."
 home_defence: "Внутренняя оборона"
 home_defence_desc: "Споттеры на земле, а также посты обнаружения и прослушивания работают совместно с нашими военно-воздушными силами, чтобы отслеживать и уничтожать вражеские вторжения."
 battlefield_destruction: "Уничтожение поля боя"
 battlefield_destruction_desc: "В то время как военно-воздушные силы могут наносить удары в далекое от вражеских стран, они также могут быть весьма полезны для оказания непосредственной поддержки армии в боевых действиях."
 dive_bombing: "Бомба с погружением"
 dive_bombing_desc: "Взрывы с погружением в воду позволяют повысить точность, однако для достижения наилучших результатов требуется специализированный самолет, способный замедлить их ныряние и выдержать стресс при выходе из него."
 direct_ground_support: "Непосредственная наземная поддержка"
 direct_ground_support_desc: "Тесно координируя пилоты СВК с наземными наблюдателями, авиационные огневые силы могут быть направлены именно на то, чтобы наилучшим образом помочь войскам в бою."
 bomber_veteran_initiative: "Инициатива Бомбардировщики-ветераны"
 bomber_veteran_initiative_desc: "Политика передачи знаний ветеранам новым новобранцам в значительной степени способствует их выживанию."
 bomber_ace_initiative: "Инициатива Бомбардировщик туз"
 bomber_ace_initiative_desc: "Официальное признание и поощрение пилотов-бомбардировщиков Ace поощряет смелость и инициативу."
 cas_veteran_initiative: "Инициатива в отношении ветеранов наземных боевых действий"
 cas_veteran_initiative_desc: "Политика передачи знаний ветеранам новым новобранцам в значительной степени способствует их выживанию."
 cas_ace_initiative: "Инициатива Наземный атлет"
 cas_ace_initiative_desc: "Официальное признание и поощрение пилотов Ace CAS поощряет смелость и инициативу."
 hunt_and_destroy: "Охота и уничтожение"
 hunt_and_destroy_desc: "Наряду с обеспечением прямой пожарной поддержки подразделения КАС могут самостоятельно охотиться на цели, часто нападая на вражеские наземные силы неожиданно, когда они приближаются к линии фронта."
 naval_strike_torpedo_tactics: "Торпедо-тактика на военно-морском шоссе"
 naval_strike_torpedo_tactics_desc: "Обучение пилотов более точно ударить торпедами сделает наши воздушные налеты на вражеские корабли более эффективными."
 naval_strike_torpedo_tactics_oi: "Торпедо-тактика на военно-морском шоссе"
 naval_strike_torpedo_tactics_oi_desc: "Обучение пилотов более точно ударить торпедами сделает наши воздушные налеты на вражеские корабли более эффективными."
 naval_strike_tactics: "Техника для военно-морского удара"
 naval_strike_tactics_desc: "Обучение пилотов прогнозированию движения судов и координации нападений сделает наши воздушные налеты на вражеские корабли более эффективными."
 low_echelon_support: "Низкая эшелонная поддержка"
 low_echelon_support_desc: "Назначая подразделения КАС непосредственно небольшим наземным группам, они всегда имеют дополнительную огневую мощь, даже если они не имеют доступа к традиционным артиллериям."
 combat_unit_destruction: "Уничтожение боевых подразделений"
 combat_unit_destruction_desc: "Подготовка наших пилотов КАС к неоднократным атакам одной и той же цели до тех пор, пока не будет подтверждено, что она уничтожена, чтобы не оставить цели в одиночестве после близкого промаха."
 operational_destruction: "Оперативное уничтожение"
 operational_destruction_desc: "Нападение на линии снабжения вражеских наземных сил ограничивает их способность перемещаться между полями боя."
 infrastructure_destruction: "Разрушение инфраструктуры"
 infrastructure_destruction_desc: "Обучение наших пилотов лучшим методам нападения на инфраструктуру, такие как железные дороги и мосты, позволяет повысить эффективность тактических бомбардировок."
 logistical_bombing: "Материально-техническое обеззараживание"
 logistical_bombing_desc: "Уделение большего внимания атаке на линии снабжения противника с воздуха дает больше преимуществ нашим собственным наземным силам в этом районе."
 battlefield_support: "Боевая поддержка"
 battlefield_support_desc: "Тактическим бомбардировщикам трудно атаковать цели вблизи места, где находятся наши наземные силы, поскольку бомбардировка на уровне менее точна, чем бомбардировка на ныряльщиках, однако более активная подготовка и взаимодействие с наземными наблюдателями могут помочь преодолеть эти проблемы."
 carousel_bombing: "Бомбардировка каучука"
 carousel_bombing_desc: "Бомбардировщики часто просто хотят сбросить все свои бомбы, как только они достигнут своей цели, а затем как можно скорее прилетают домой."
 keypoint_bombing: "Взрывы по ключевым точкам"
 keypoint_bombing_desc: "Точная бомбардировка ключевых точек на поле боя в поддержку наших сухопутных сил может в значительной степени помочь им победить врага."
 ground_support_integration: "Интеграция наземной поддержки"
 ground_support_integration_desc: "Полное объединение наших тактических бомбардировщиков с наземными наблюдателями повышает их точность и позволяет им непосредственно поддерживать наши наземные силы в боевых действиях."
 strategic_destruction: "Стратегическое уничтожение"
 strategic_destruction_desc: "Наши пилоты могут получить доступ к стратегическим целям гораздо быстрее, чем наши военно-морские или наземные силы."
 high_level_bombing: "Взрыв на высоком уровне"
 high_level_bombing_desc: "С более высоких высот мы можем избежать некоторых воздушных столкновений и зенитного оружия."
 massed_bomber_formations: "Формирование массовых бомбардировщиков"
 massed_bomber_formations_desc: "Оставаясь в строю, наши бомбардировщики могут защитить свою группу и повысить наши шансы на успешное падение бомб."
 night_bombing: "Ночная бомбардировка"
 night_bombing_desc: "С опущенными противостоящими средствами обороны и бомбардировщиками, покрытыми тьмой, мы можем оставаться наступательными и эффективными круглосуточно."
 dead_reckoning_bombing: "Мертвая бомбардировка"
 dead_reckoning_bombing_desc: "Измеряя скорость, направление и дрейф с предыдущих позиций, мы можем рассчитать более точные сбрасывания бомб даже в ночное время."
 infiltration_bombing: "Инфильтрация"
 infiltration_bombing_desc: "Вступление в вражеские формирования или возвращение их домой на базу может показаться безумием."
 pathfinder_groups: "Группы &quot; патологоанатомов &quot;"
 pathfinder_groups_desc: "Ветеранские пилоты оснащены лучшими инструментами для освещения целевых позиций, ни дыма, ни плохой погоды не могут помешать бомбардировщикам выполнить свою миссию."
 day_bombing: "Дневной взрыв"
 day_bombing_desc: "Сосредоточенные усилия в течение дня опустошают из-за большого преимущества видимости."
 escort_relay_system: "Система эскорт-релей"
 escort_relay_system_desc: "Бомбардировщики, сопровождаемые бойцами, значительно повышают нашу способность реагировать на вражеский огонь."
 flying_fortress: "Летающая крепость"
 flying_fortress_desc: "Посадить наших высоколетающих тяжелых бомбардировщиков пушками, чтобы защитить себя, и хватит доспехов, чтобы избить и все равно вернуться домой."
 mass_destruction: "Массовое уничтожение"
 mass_destruction_desc: "Бомбардировщики оснащены самым разрушительным оружием в больших количествах."
 fleet_in_being: "Быть флотом"
 fleet_in_being_desc: "Корабли остаются в порту, где они безопаснее, и только в нужные моменты нападают на врагов."
 battlefleet_concentration: "Концентрация боевого флота"
 battlefleet_concentration_desc: "Позвоните на близлежащие корабли, как только будет замечен вражеский корабль, спланированный целенаправленный огонь быстро сделает вражеские корабли бесполезными, охотитесь на них по одному."
 battlefleet_concentration_ti: "Концентрация боевого флота"
 battlefleet_concentration_ti_desc: "Позвоните на близлежащие корабли, как только будет замечен вражеский корабль, спланированный целенаправленный огонь быстро сделает вражеские корабли бесполезными, охотитесь на них по одному."
 subsidiary_carrier_role: "Роль дочернего перевозчика"
 subsidiary_carrier_role_desc: "Карьеры поддерживают боевые корабли, повышая их готовность к переходу от обороны к нападению."
 subsidiary_carrier_role_ti: "Роль дочернего перевозчика"
 subsidiary_carrier_role_ti_desc: "Карьеры поддерживают боевые корабли, повышая их готовность к переходу от обороны к нападению."
 hunter_killer_groups: "Группы убийц-охотников"
 hunter_killer_groups_desc: "Разрушители формируют группы для охоты на вражеские подводные лодки."
 floating_fortress: "Плавающая крепость"
 floating_fortress_desc: "С боевыми кораблями повышенной боевой готовности мы всегда будем готовы к ответу, если враг посмеет угрожать нашим водам."
 floating_fortress_ti: "Плавающая крепость"
 floating_fortress_ti_desc: "С боевыми кораблями повышенной боевой готовности мы всегда будем готовы к ответу, если враг посмеет угрожать нашим водам."
 floating_fortress_bs: "Плавающая крепость"
 floating_fortress_bs_desc: "С боевыми кораблями повышенной боевой готовности мы всегда будем готовы к ответу, если враг посмеет угрожать нашим водам."
 floating_airfield: "Плавучее воздушное поле"
 floating_airfield_desc: "Улучшенная интеграция перевозчиков в наш флот позволяет нам готовиться к удару как с моря, так и с воздуха."
 floating_airfield_ti: "Плавучее воздушное поле"
 floating_airfield_ti_desc: "Улучшенная интеграция перевозчиков в наш флот позволяет нам готовиться к удару как с моря, так и с воздуха."
 floating_airfield_bs: "Плавучее воздушное поле"
 floating_airfield_bs_desc: "Улучшенная интеграция перевозчиков в наш флот позволяет нам готовиться к удару как с моря, так и с воздуха."
 grand_battlefleet: "Большой боевой флот"
 grand_battlefleet_desc: "Обучение лидерству позволяет нашим командирам сохранять спокойствие в жаре боя, даже когда командуют огромными флотами."
 convoy_sailing: "Плавание в конвое"
 convoy_sailing_desc: "Введение обязательного рейса автоколонны облегчит выявление вражеских рейдов и принятие ответных мер во времени."
 convoy_sailing_ti: "Плавание в конвое"
 convoy_sailing_ti_desc: "Введение обязательного рейса автоколонны облегчит выявление вражеских рейдов и принятие ответных мер во времени."
 convoy_sailing_bs: "Плавание в конвое"
 convoy_sailing_bs_desc: "Введение обязательного рейса автоколонны облегчит выявление вражеских рейдов и принятие ответных мер во времени."
 convoy_escorts: "Сопровождаемые лица"
 convoy_escorts_desc: "Быстрые наземные корабли как часть наших конвоев позволят нам засекать вражеские подводные лодки и вовремя реагировать."
 convoy_escorts_bs: "Сопровождаемые лица"
 convoy_escorts_bs_desc: "Быстрые наземные корабли как часть наших конвоев позволят нам засекать вражеские подводные лодки и вовремя реагировать."
 escort_carriers: "Эскорт-перевозчики"
 escort_carriers_desc: "Обеспечение притока ресурсов имеет важнейшее значение."
 integrated_convoy_defence: "Комплексная защита конвоя"
 integrated_convoy_defence_desc: "Улучшенная координация военно-морских и воздушных перевозок позволяет нам нанести удар по врагам за несколько миль до того, как они будут приближаться к нашим торговым конвоям."
 integrated_convoy_defence_bs: "Комплексная защита конвоя"
 integrated_convoy_defence_bs_desc: "Улучшенная координация военно-морских и воздушных перевозок позволяет нам нанести удар по врагам за несколько миль до того, как они будут приближаться к нашим торговым конвоям."
 submarine_operations: "Подводные лодки"
 submarine_operations_desc: "Мы не должны нападать на вражеский флот, чтобы выиграть войну. Нанести удар по их торговым конвоям, прежде чем они смогут снова реагировать и исчезнуть под поверхностью. Вы не можете бороться с тем, что вы не видите."
 submarine_operations_bs: "Подводные лодки"
 submarine_operations_bs_desc: "Мы не должны нападать на вражеский флот, чтобы выиграть войну. Нанести удар по их торговым конвоям, прежде чем они смогут снова реагировать и исчезнуть под поверхностью. Вы не можете бороться с тем, что вы не видите."
 undersea_blockade: "Подводные блоки"
 undersea_blockade_desc: "Подводные лодки - это идеальный инструмент для сокращения притока врагом важных сырьевых материалов."
 undersea_blockade_bs: "Подводные блоки"
 undersea_blockade_bs_desc: "Подводные лодки - это идеальный инструмент для сокращения притока врагом важных сырьевых материалов."
 convoy_interdiction: "Препятствие сговора"
 convoy_interdiction_desc: "Улучшенная координация наших подводных лодок позволит им нанести удар по торговым автоколоннам в пути."
 convoy_interdiction_ti: "Препятствие сговора"
 convoy_interdiction_ti_desc: "Улучшенная координация наших подводных лодок позволит им нанести удар по торговым автоколоннам в пути."
 convoy_interdiction_bs: "Препятствие сговора"
 convoy_interdiction_bs_desc: "Улучшенная координация наших подводных лодок позволит им нанести удар по торговым автоколоннам в пути."
 submarine_offensive: "Нападение на подводные лодки"
 submarine_offensive_desc: "Мы уничтожим вражеские торговые колонны быстрее, чем они смогут их заменить."
 submarine_offensive_bs: "Нападение на подводные лодки"
 submarine_offensive_bs_desc: "Мы уничтожим вражеские торговые колонны быстрее, чем они смогут их заменить."
 trade_interdiction: "Торговое препятствование"
 trade_interdiction_desc: "Чем скорее мы найдем вражеские корабли, тем быстрее мы сможем их уничтожить."
 unrestricted_submarine_warfare: "Неограниченная подводная война"
 unrestricted_submarine_warfare_desc: "Пусть наши подводные лодки утопят любое судно без предупреждения, гражданское или нет."
 wolfpacks: "Упаковки для вулканов"
 wolfpacks_desc: "После того, как наши подводные лодки были построены в стаи, координация между ними значительно улучшилась."
 advanced_submarine_warfare: "Усовершенствованные подводные бои"
 advanced_submarine_warfare_desc: "Огромное улучшение связи между нашими подводными лодками позволяет им атаковать время до совершенства, когда они наконец увидят нас, это будет с тонущего корабля."
 combined_operations_raiding: "Объединенные операции"
 combined_operations_raiding_desc: "Координация между нашим главным флотом и подводными лодками заставляет наш флот всегда быть начеку, ни один корабль не останется незамеченным в наших водах."
 raider_patrols: "Рейдерские патрули"
 raider_patrols_desc: "Патрули как быстрых, так и боевых тяжелых кораблей оставляют вражеским торговым конвоям негде спрятаться. Не только подводные лодки могут охотиться."
 capital_ship_raiders: "Рейдеры Капитальные суда"
 capital_ship_raiders_desc: "С нашими самыми могущественными кораблями на охоте за торговыми конвоем враг больше не найдет безопасности в количестве. Они сидящие утки, молятся, чтобы мы их не нашли."
 carrier_operations: "Операции перевозчиков"
 carrier_operations_desc: "Перевозчики позволят нашим пилотам ударить по морю быстрее и легче, чем с наших авиабаз на суше."
 naval_air_operations: "Морской воздушный транспорт"
 naval_air_operations_desc: "Пилоты, обученные выполнять миссии от перевозчиков, открывают нам новый путь к доминированию в морях."
 base_strike: "Базовая забастовка"
 base_strike_desc: "Штурм в портах противника подорвет их способность восстанавливать флот, что позволит нам доминировать над морями по количеству."
 carrier_primacy: "Примат перевозчика"
 carrier_primacy_desc: "Современные самолеты имеют более высокую дальность и точность, чем обычные военно-морские пушки."
 carrier_task_forces: "Целевые группы перевозчиков"
 carrier_task_forces_desc: "Организованные оперативные группы с перевозчиками и легкими крейсерами обеспечивают, чтобы враг никогда не застал нас врасплох."
 massed_strikes: "Массовые удары"
 massed_strikes_desc: "Эксперименты, подготовленные для миссий-носителей, позволят даже переполненному перевозчику нормально функционировать, уничтожая противника и значительно повышая его эффективность в военно-морских боях."
 carrier_battlegroups: "Боевые группы Карьер"
 carrier_battlegroups_desc: "Перевозчики могут нанести удар по врагу с большей дистанции, чем любые военно-морские пушки, и с глазами в небе нас никогда не поймают врасплох. Карьеры в массе -- это сила, с которой нужно считаться."
 escort_patrols: "Патрульные эскорт-патрули"
 escort_patrols_desc: "Совершенствование обнаружения делает наше конвойное сопровождение гораздо более смертоносным до подводных лодок, и негде спрятаться, они не представляют реальной угрозы."
