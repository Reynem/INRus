 bicycle_infantry: "Пехота на велосипеде"
 bicycle_infantry_desc: "Регулярные пехотинцы с велосипедами более мобильны, чем их марширующие коллеги, за очень скромную цену."
 torpedo_cruiser_mtg: "Торпедо Крузер"
 amphibious_mechanized_infantry: "Амфибийные тракторы"
 amphibious_mechanized_infantry_desc: "Амфибийные тракторы, или амтраки, позволяют высадить морских пехотинцев на пляже под бронированной защитой."
 amphibious_mechanized_infantry_2: "Усовершенствованные амфибийные тракторы"
 amphibious_mechanized_infantry_2_desc: "Эти амтраки имеют несколько усовершенствований по сравнению с базовой версией, таких, как задняя погрузочная аппарель для облегчения разгрузки на пляже."
 amphibious_tank: "Цистерна для амфибий"
 amphibious_tank_desc: "Амфибийные танки предназначены для того, чтобы обеспечить морской пехотинец огневой поддержкой во время нападения на пляж."
 amphibious_tank_2: "Усовершенствованный амфибийный бак"
 amphibious_tank_2_desc: "Во втором поколении резервуаров с амфибиями обеспечивается более эффективная защита и повышается огневая мощность."
 NAVAL_TITLE_MINES: "МЕНЯ ВОЙНЫ"
 basic_naval_mines: "Контактный"
 basic_naval_mines_desc: "Простая плавучая бомба, прикрепляемая к морскому дну, взрывается, когда она вступает в контакт с кораблем."
 improved_naval_mines: "Магнитная шахта"
 improved_naval_mines_desc: "Эта изощренная мина взрывается, когда обнаруживает изменения в магнитном поле, связанные с проходящим кораблем."
 advanced_naval_mines: "Акустическая шахта"
 advanced_naval_mines_desc: "Этот тип морских мин взрывается, когда его датчики обнаруживают шум близлежащего судна."
 modern_naval_mines: "Давление в шахте"
 modern_naval_mines_desc: "Этот высокоразвитый рудник обнаруживает небольшие изменения в давлении воды, вызванные движущимся поблизости судном."
 degaussing: "Дегауссирование"
 degaussing_desc: "Устанавливая мощные электромагнитные катушки, магическая сигнатура корабля может быть резко уменьшена, что делает его гораздо менее уязвимым для магнитных мин."
 submarine_mine_laying: "Подводные лодки"
 submarine_mine_laying_desc: "Устанавливая специальное оборудование для хранения и высвобождения мин, специально спроектированная подводная лодка может развертывать мины во время погружения в воду и, как мы надеемся, без обнаружения."
 improved_submarine_mine_laying: "Развертывание минных полей Торпедо-труба"
 improved_submarine_mine_laying_desc: "Модернизация мин с целью их установки в торпедные трубки позволяет любой подводной лодке стать миноубийцей, хотя и за счет перевозимых торпед."
 airdrop_mines: "Воздушное минирование"
 airdrop_mines_desc: "Установив мины небольшим парашютом, они могут быть безопасно сброшены с самолетов, что позволяет быстро и эффективно создавать минные поля."
 airsweep_mines: "Воздушная мина плачет"
 airsweep_mines_desc: "Самолеты могут быть оснащены специальным оборудованием для обнаружения и безопасного взрыва военно-морских мин с воздуха."
 naval_mines: "Технологии минной войны"
 concentrated_industry_category: "Концентрированные промышленные технологии"
 dispersed_industry_category: "Разрозненные промышленные технологии"
 NAVAL_TITLE_ARMAMENT: "ВООРУЖЕНИЯ"
 NAVAL_TITLE_DAMAGE_CONTROL: "КОНТРОЛЬ ЗА ПАССАЖИРОВ"
 NAVAL_TITLE_FIRE_CONTROL: "МЕТОДЫ ОГРАНИЧЕНИЯ ОПАСНОСТИ"
 early_ship_hull_carrier: "Преобразование Палубных единиц"
 early_ship_hull_carrier_short: "Преобразование Палубных единиц"
 early_ship_hull_carrier_desc: "Преобразование старых корпусов позволяет проводить дешевые эксперименты с военно-морской авиацией для накопления опыта в строительстве и эксплуатации перевозчиков."
 cruiser_submarines: "Подводные лодки круизеров"
 coastal_defense_ships: "Корабли береговой обороны"
 basic_ship_hull_heavy: "1936 Грузовой корпус"
 basic_ship_hull_heavy_short: "1936 Грузовой корпус"
 basic_ship_hull_cruiser: "1936 года Круазерная Шапка"
 basic_fire_control_system: "Базовая система пожаротушения"
 basic_fire_control_system_desc: "Вся стрельба из оружия корабля контролируется с центральной позиции, что обеспечивает более жесткую группировку выстрелов и повышает точность."
 improved_fire_control_system: "Совершенствование системы пожаротушения"
 improved_fire_control_system_desc: "Входя на курс, скорость и расстояние от цели, механический компьютер может точно предсказать, где будет цель, когда следующий сальво будет готов к выстрелу."
 advanced_fire_control_system: "Усовершенствованная система пожаротушения"
 advanced_fire_control_system_desc: "Крупный и сложный механический компьютер, который отслеживает большое количество входных данных как о цели, так и об огневом судне, а также о погодных условиях и состоянии моря, позволяет производить очень точные баллистические расчеты."
 sonar: "Пассивный сон"
 sonar_desc:1 "Базовый набор гидрофонов позволяет отслеживать подводные мишени посредством обнаружения звука, который они издают. ~n nn Mounding этот модуль в §YElectronics Slot§! на §YLight Ships §! или §YCruisers§! поможет им обнаружить вражеские §YSubmarins §!"
 improved_sonar: "Активный Сонар"
 improved_sonar_desc:1 "С помощью модулярированных звуковых волн эта система может точно измерять подвеску и расстояние до погруженной цели. ~nn Mounding этот модуль в §YElectronics Slot§! на §YLight Ships §! или §YCruisers §! поможет им обнаружить вражеские §YSubmarins §!"
 smoke_generator: "Генераторы дыма"
 smoke_generator_desc: "Некоторые незначительные модификации двигателей и дымовых стоек легких и средних судов позволяют им делать много дыма, чтобы избежать или разорвать контакт с противником."
 depth_charges_advice_tt: "~Ne Mounding the §Y Depth Back §! Модуль на §YLight Ships! и §YKruisers§! , позволит им атаковать вражеский §YSubmarines§!"
 sonar_advice_tt: "§YSonar§! На §YLight Ships! и §YCruisers§! позволит им обнаружить вражеские §YSubmarines§!"
 basic_depth_charges: "Основные сборы за глубину"
 basic_depth_charges_desc:1 "Простой взрывной контейнер с чувствительным к давлению спусковым сигналом взрывается, когда он попадает в заранее установленную глубину. no Mounding этот модуль на §YLight Ships §! и §YCruisers§! позволит им атаковать вражеские §YSubmarines§!"
 improved_depth_charges: "Глубина заряда"
 improved_depth_charges_desc:1 "Простое механическое устройство, которое сбрасывает глубину на расстояние от корабля. Это означает, что эсминец больше не должен ехать прямо через цель, чтобы попасть в него. ~n mounding этот модуль на §YLight Ships! и § §YCruisers§! позволит им атаковать вражеский §YSubmarines§!"
 advanced_depth_charges: "Глубина заряда миномета"
 advanced_depth_charges_desc:1 "Миномет на борту эсминца может забросать взрывной заряд гораздо дальше, что позволит судну поддерживать сонарный контакт с подводной лодкой на протяжении всего нападения и резко повысить его точность."
 modern_depth_charges: "Усовершенствованный миномет большой глубины"
 modern_depth_charges_desc:1 "Большой метательный заряд забрасывает на конкретную глубину подводную лодку с большой дистанции. ~nn Mounding этот модуль на §YLight Ships §! и §YCruisers§! позволит им атаковать вражеские §YSubmarines§!"
 improved_airplane_launcher: "Усовершенствованная авиакатапульта"
 improved_airplane_launcher_desc:1 "Усовершенствованный пневматический механизм позволяет запускать гораздо большие самолёты через катапульт. Это увеличивает их радиус поиска. no Mounding этот модуль на §YCruisers §!, §YHeavy Ships§! или специализированные §YSubmarines §! улучшает их способность обнаруживать вражеские корабли."
 airplane_launcher_advice_tt: "§YCatapult§! Улучшает их способность обнаруживать вражеские корабли."
 cruiser_armor_advice_tt: "Улучшает их способность выдерживать повреждения."
 heavy_armor_advice_tt: "§YYArmor§! Модуль на §Yheavy Koards§! Улучшает их способность выдерживать повреждения. §YBattlectories §! и §YYBattlecruisers §! определяются их разными схемами §!, с боеготовами, как правило, с худшими бронями."
 basic_cruiser_armor_scheme: "Базовая бронетранспортерная схема"
 basic_cruiser_armor_scheme_desc:1 "План бронежилетов, который копирует разделение между ремнем и палубными бронежилетами, видимыми на Капитал Корабли, и обеспечивает определенную защиту от заноз и пушек малого калибра. ~n un Mounding этот модуль на §YCruisers §!, улучшает их способность §!, но также §R уменьшает § § § § §!"
 improved_cruiser_armor_scheme: "Закрепленная бронетранспортерная схема &quot; Пояс крузер &quot;"
 improved_cruiser_armor_scheme_desc:1 "Поставив броню под угол, такой же вес и толщину бронежилетов гораздо труднее пронзить. non Mounding этот модуль на §YCruisers §! Улучшает их способность §!, но также §R сокращает § § §!"
 advanced_cruiser_armor_scheme: "Система бронетранспортеров все или ничего"
 advanced_cruiser_armor_scheme_desc:1 "Эта схема направлена только на защиту наиболее важных участков корабля, игнорируя при этом неважные части. no Mounding этот модуль на §YCruisers§! Улучшает их способность §!, а также §R уменьшает §! их §YSpeed§!"
 basic_heavy_armor_scheme: "Уплотненная бронетранспортерная схема"
 basic_heavy_armor_scheme_desc:1 "Поставив броню под угол, такой же вес и толщину бронежилетов гораздо труднее пронзить. Несмотря на то, что этот модуль на §YHeavy Ships§! Улучшает их способность §!!. §YBattlecruisers §! определены в их различных схемах §YArmor!"
 improved_heavy_armor_scheme: "Система бронетехники для всех или для всех"
 improved_heavy_armor_scheme_desc:1 "Эта схема направлена только на защиту наиболее важных участков судна, игнорируя при этом неважные части. ~nn Mounding этот модуль на §YHeavy Ships §! Улучшает их способность §!. §YBattlectronices §! и § §YBattlecruisers §! определяются их различными схемами §YArmor!"
 torpedo_advice_tt: "~n Mouning §Tytorpedo Rackers §!! на §YYLight Ships §! или §YCruisers§! ! позволяет им нанести значительный ущерб вражеским §Y Capital Ships§! в §YBattleline §!, если они могут одолеть вражескую группу §YScreening§!"
 basic_torpedo: "Базовый Торпед"
 basic_torpedo_desc:1 "Самоходное оружие со взрывной боеголовкой, которая двигается по заранее определенному курсу до тех пор, пока она не попадет в цель под ватерлинией. ~n un Mounding этот модуль на §YLight Ships! или § §YCruisers §!, позволяет им нанести значительный ущерб вражеским §Y Capital Корабли §!"
 magnetic_detonator: "Магнитный детонатор"
 magnetic_detonator_desc: "Новый детонатор обнаруживает смещение магнитного поля Земли, когда торпеда проходит под целью."
 homing_torpedo: "Тормпедо"
 homing_torpedo_desc: "С помощью аккустного детектора торпеда может находиться на самом большом источнике шума, который перед ней - обычно цель."
 electric_torpedo: "Электрический торпед"
 electric_torpedo_desc: "Вместо того, чтобы оставить легко обнаруженный след из пузырей, торпеда с электрическим двигателем остается практически невидимой до тех пор, пока она не ударит. Это также означает, что нет следов, ведущих к стартовой подводной лодке."
 improved_ship_torpedo_launcher: "Усовершенствованный корабль-носитель Торпедо"
 improved_ship_torpedo_launcher_desc:1 "Сильнейшие двигатели позволяют устанавливать больше трубок на одной площадке и быстрее готовиться к цели. ~n nn Mouning этот модуль на §YLight Ships §! или §YCruisers §! позволяет им наносить значительный ущерб вражеским §Y Capital Ships §!."
 advanced_ship_torpedo_launcher: "Усовершенствованный корабль-носитель Торпедо"
 advanced_ship_torpedo_launcher_desc:1 "Большие торпеды с более тяжелыми боеголовками допускаются к более крупным торпедным трубкам. ~n nn Mounding этот модуль на §YLight Ships §! или §YCruisers §! позволяет им нанести значительный ущерб вражеским §Y Capital Ships §!"
 modern_ship_torpedo_launcher: "Современный корабль-носитель &quot; Торпедо &quot;"
 modern_ship_torpedo_launcher_desc:1 "Мощные сжатые воздушные заряды позволяют запускать более тяжелые торпеды на более высоких скоростях."
 snorkel_advice_tt: "§YSnorkels §! на §YSubmarines §! резко уменьшают их §YYVisability§!, что усложняет их зрение и борьбу за вражеские корабли."
 basic_submarine_snorkel: "Базовая подводная лодка"
 basic_submarine_snorkel_desc:1 "Простая дыхательная труба, протекающая из машинного отделения в диспетчерскую. Расширенная, она позволяет подводной лодке управлять двигателями и зарядить двигатели, пока они еще погружены в воду. ~n un Mounding этот модуль на §YSubmarines§!, уменьшает их §YVisibility§!, что затрудняет их обнаружение."
 improved_submarine_snorkel: "Усовершенствованные подводные лодки"
 improved_submarine_snorkel_desc:1 "Усовершенствованный дизайн не позволяет всасывать воду в двигатели, а также уменьшает радиолокационное эхо головки сноркеля. ~n un Mounding этот модуль на §YSubmarines §! уменьшает их §YVisibility §!, что затрудняет их обнаружение."
 light_battery_advice_tt: "§YYLight Battery §! Модуль на §YLight Torps §! и §YKruisers §! Улучшает их §YLight Gun Attack §!, что помогает уничтожить вражеские §YScreen Ships §!. § § Light Batteries §!, как правило, плохо действуют против таких бронебойных кораблей, как §YKruisers §! и §YYavy Корабли §!"
 medium_battery_advice_tt: "~NNNMOLYLight Medium Battery §! или §YMedium Battery §!! Модуль §YCruisers §! Улучшает их §! или §YYAvy Gun Attack §!, давая им возможность бороться с вражескими §YScreen §! или §YYMedium Batter §!. Установка любого §YMedium §! Назначит корабль как §Yavy Cruiser§!"
 heavy_battery_advice_tt: "§Yeavy Battery §! модули увеличивают §Yheavy Shipple §!», §Yeavy Gun Attack§!, позволяя ему атаковать и уничтожать вражеские §Yeavy Batteries §!, как правило, плохо действуют против небольших судов, таких как § § § §! и § § § § § § § § § § § § § § § § § § § § § § § § §."
 basic_battery: "Военно-морское оружие"
 basic_battery_desc: "Базовая конструкция для подготовки и повышения механики военно-морского оружия."
 basic_light_battery: "Базовая световая батарея"
 basic_light_battery_desc:1 "Открытая, заряженная гора для малокалиберного оружия, предназначенного для использования на малых кораблях. ~n nn Mounding этот модуль увеличивает §YLight Gun Attack§!, что помогает вражескому §YScreing Корабли!!"
 improved_light_battery: "Усовершенствованная световая батарея"
 improved_light_battery_desc:1 "Закрытая, заряженная монтировка для малокалиберного пистолета дает команде некоторую защиту от элементов и осколков панелей. Несмотря на то, что этот модуль увеличивает §YLight Gun Attack§!, что помогает вражескому §YScreening Корабли§!"
 advanced_light_battery: "Усовершенствованная световая батарея"
 advanced_light_battery_desc:1 "Передовая гора близнецов приносит гораздо больше огневой мощи под бронезащитой. Несмотря на то, что этот модуль поднимает §YLight Gun Attack§!, это помогает вражескому §Screing Корабли!"
 basic_light_shell: "Пирсинговая скорлупа малокалиберного типа &quot; Полуармор &quot;"
 basic_light_shell_desc: "Компромисс между бронебойными характеристиками и взрывной энергией, этот снаряд наносит гораздо больший ущерб после того, как он пробивает слабые доспехи легких кораблей."
 improved_light_shell: "Маленькая бронебойная скорая"
 improved_light_shell_desc: "Надлежащий бронебойный снаряд для небольших калибров дает эсминцам и другим легким кораблям шанс бороться против бронебойных оппонентов."
 basic_medium_battery: "Базовая средняя батарея"
 basic_medium_battery_desc:1 "Мощная батарея с двумя-тремя стволами среднего калибра для использования на крейсерах. ~Nn Mounding codelight Medium Battery §! Усиливает §YLight Gun Attack §!, что помогает в вовлечении вражеских §YScreing Корабли!! ~ Установка модуля §YMedium Battery §! § §Yavy Gun Attack §!, что помогает в вовлечении вражеских §YCeapers §!"
 improved_medium_battery: "Усовершенствованные средние батареи"
 improved_medium_battery_desc:1 "Улучшенная планировка галереи позволяет быстрее загружать, а лучшие доспехи улучшают выживаемость. Несмотря на то, что модуль §YLight Medium Battery §!, он увеличивает §YLight Gun Attack §!, что помогает задействовать вражеские §YScreening Корабли!!. Установка модуля §YMedium Battery §! Усиляет §Yavy Gun Attack §!, что помогает втягивать вражеские §YCreating Корабли §!"
 advanced_medium_battery: "Усовершенствованная средняя батарея"
 advanced_medium_battery_desc:1 "Современные крейсеры могут достичь скорости огня и точности, которая до сих пор считалась невозможной. Несмотря на то, что модуль §YLight Medium Battery §! увеличивает §YLight Gun Attack §!, что помогает в вовлечении вражеских §YScreening Корабли §!. Установка модуля §YMedium Battery §! Усиливает §YYavy Gun Attack §!, что помогает в вовлечении вражеских §Y Capital Корабли §!"
 basic_medium_shell: "Снаряды средней емкости с бронежилетом"
 basic_medium_shell_desc: "Установив баллистический капюшон, снаряды можно сделать более аэродинамическими, сохраняя при этом свои бронебойные характеристики."
 improved_medium_shell: "Полуарная пирсинговая скорлупа среднего калибра"
 improved_medium_shell_desc: "Компромисс между бронебойными характеристиками и взрывной энергией, этот снаряд наносит гораздо больший ущерб после того, как он пробивает слабые доспехи легких кораблей."
 basic_heavy_battery: "Базовая аккумуляторная батарея"
 basic_heavy_battery_desc:1 "Гигантская турнирная галерея с огромными ружьями под тяжелыми доспехами. ~Nn Mounding the §YHeavy Battery §!"
 improved_heavy_battery: "Усовершенствованная аккумуляторная батарея"
 improved_heavy_battery_desc:1 "Мощность Раммеров повышает скорость загрузки тяжелых пушек, а автоматические светоотражающие двери повышают безопасность. ~n Mounding a §YHeavy Battery §!!"
 advanced_heavy_battery: "Усовершенствованная тяжелая батарея"
 advanced_heavy_battery_desc:1 "Усовершенствованные механизмы сокращения выбросов и задержки катушек уменьшают помехи снарядам в полете и резко повышают точность. ~n Mounding a §YHeavy Battery §!"
 basic_heavy_shell: "Крышка с пневматическим бронежилетом"
 basic_heavy_shell_desc: "Установив баллистический капюшон, снаряды можно сделать более аэродинамическими, сохраняя при этом свои бронебойные характеристики."
 improved_heavy_shell:1 "Сверхвостая бронетанковая скорлупа"
 improved_heavy_shell_desc: "Взвешивая больше тонны, эти огромные снаряды нападают беспрецедентной силой и создают серьезную угрозу даже для самых тяжелых доспехов."
 secondary_battery_advice_tt: "§Ysecondary Battery §! позволяет §YCruisers §! и §YHeavy Koards§! вражеским §YScreening Ships §! в качестве вторичных целей, когда наносится ущерб другой цели."
 basic_secondary_battery: "Вторичная батарея"
 basic_secondary_battery_desc:1 "Находящиеся в отверстиях вдоль корпуса, эти небольшие пушки дают судну некоторую защиту от небольших кораблей, но имеют ограниченное поле огня. Несмотря на §YYSecondary Battery §! Модуль дает §YCruiser §!, §YCarrier §, или § § § § § § § § § § § § § § § § § § § § § § § § § § § § §YYight rough roun apport §!, и позволяет ему использовать вторую цель."
 improved_secondary_battery: "Вторичная аккумуляторная батарея"
 improved_secondary_battery_desc:1 "Устанавливая вторичные пушки в заряженных батареях, они получают гораздо более широкое поле огня за счет увеличения веса и снижения стабильности в тяжелых морях. Несмотря на то, что модуль §Вторая батарея!"
 dp_secondary_battery: "Двухцелевая вторичная батарея"
 dp_secondary_battery_desc:1 "Комбинирование противокорабельных и противовоздушных пушек на одной горе позволяет проявлять большую гибкость и сохранять вес. Несмотря на то, что модуль §YYCruiser §, §YCarrier §, § § § § § § § § § § § § § § § § § § § § § § § § § § § § § § § § § § § § § § § § § § § § § § § § § § § § § § § § § § § § § § § § § § §"
 damage_control_1: "Противопожарные дриллы"
 damage_control_1_desc: "Каждый член экипажа судна, от капитана до простого моряка, должен быть в состоянии помочь в сдерживании и тушении пожаров на борту судна."
 damage_control_2: "Отдельные пожарные колонны"
 damage_control_2_desc: "Разделяя основные водные линии вокруг корабля, вероятность удара, делающего судно полностью неспособным противостоять пожарам, значительно уменьшается."
 damage_control_3: "Аварийные насосы с дизельным двигателем"
 damage_control_3_desc: "Поскольку тяжелые насосы, как правило, зависят от главных двигателей для получения энергии, однократный и достаточно легкий удар в машинном отделении может привести к тому, что судно не сможет оставаться на плаву."
 fire_control_methods_1: "Стрельба в скетче"
 fire_control_methods_1_desc: "Для того, чтобы попасть в цель, первый шаг состоит в том, чтобы пересечь ее, стреляя из нескольких пушек одновременно до тех пор, пока удары не ударят по обеим сторонам цели."
 fire_control_methods_2: "Стрельба по парням"
 fire_control_methods_2_desc: "Вместо того, чтобы стрелять по цели и терять следы ударов за вражеским судном, выстрелы преднамеренно опускаются ниже цели и расстояния между ударом и целью, измеренного для определения дальности."
 fire_control_methods_3: "Shell Dyes"
 fire_control_methods_3_desc: "Добавляя маленькие цветные пакеты в скорлупы, когда они стреляют по цвету, удары вокруг цели позволяют нескольким кораблям нападать на одну и ту же цель, не путая их с ударами друг друга."
 fuel_silos: "Хранение топлива"
 fuel_silos_desc: "Для массового хранения топлива требуется сложный набор цистерн, трубопроводов и клапанов, с тем чтобы он был как надежным, так и легкодоступным."
 fuel_refining: "Очистка топлива I"
 fuel_refining_desc: "Улучшение положения в области химического растрескивания позволяет повысить урожайность легкого топлива из нефти."
 fuel_refining2: "Переоснащение топлива II"
 fuel_refining2_desc: "Совершенствование планирования планировки нефтеперерабатывающих заводов позволяет сократить потери топлива."
 fuel_refining3: "Очистка топлива III"
 fuel_refining3_desc: "Совершенствование методов утилизации позволяет производить переработку топлива из побочных продуктов."
 fuel_refining4: "Очистка топлива IV"
 fuel_refining4_desc: "Новые разработки в области химической инженерии позволяют производить переработку топлива из новых источников."
 fuel_refining5: "Очистка топлива V"
 fuel_refining5_desc: "Использование новых методов и усовершенствованных планировок при строительстве нефтеперерабатывающих заводов резко увеличивает пропускную способность при одновременном сокращении потерь."
 scout_plane1: "Скаутский самолет I"
 scout_plane1_desc: "Сбор разведывательных данных о передвижениях вражеских войск и представление сообщений о развертывании вражеских военно-морских сил были первоначальной миссией для самолетов с момента их первого развертывания во время Великой войны и по-прежнему являются важной миссией."
 scout_plane2: "Скаутский самолет II"
 scout_plane2_desc: "Разрабатывая специальные самолеты для воздушного наблюдения и разведки на большие расстояния, мы обеспечиваем получение и поддержание точной картины намерений и возможностей нашего противника."
 SURRENDER_REDUCTION_TOOLTIP: "Сотрудничество в $COUNTRY_H$ позволит снизить уровень их капитуляции на $VALUE(+%.0 долл. США)"
 COLLABORATION_EFFECTS_TOOLTIP: "$COLLABORATIATION()+%.0 долларов сотрудничества в $COUNTRY.H$. Это позволит снизить уровень их возврата на $SURENDER()+%.0 долл. и даст $COMLINAINS&+%.0 долл., когда вражеские капитуляции будут использованы для открытия дополнительных модификаторов соответствия."
 COLLABORATION_EFFECTS_OTHER_SIDE_TOOLTIP: "$OTHER_COUNTRY|H$ have $COLLABORATION|+%.0$ collaboration in $COUNTRY|H$. This will reduce $COUNTRY|H$'s surrender level by $SURRENDER|+%.0$ and will give $COMPLIANCE|+%.0$ compliance when the enemy capitulates which will be used for unlocking additional compliance modifiers."
