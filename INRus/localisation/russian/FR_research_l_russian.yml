 BLITZKRIEG_LABEL: "БЛИЖНИЙ БЛИЖНИЙ"
 BLITZKRIEG_LABEL_TT: "Улучшить организацию бронированных подразделений."
 DESPERATE_DEFENSE_LABEL: "ДЕСПЕРАТИВНОЕ ОБЯЗАТЕЛЬСТВО"
 DESPERATE_DEFENSE_LABEL_TT: "Максимизировать вербовку и партизанскую тактику."
 MODERN_BLITZKRIEG_LABEL: "МЕЖПРАВИТЕЛЬСТВЕННЫЙ БЛИЖНИЙ"
 MODERN_BLITZKRIEG_LABEL_TT: "Улучшить организацию армии и противодействующую тактику."
 DISPERSED_SUPPORT_LABEL: "ОТДЕЛЬНАЯ ПОДДЕРЖКА"
 DISPERSED_SUPPORT_LABEL_TT: "Улучшить организацию и эффективность линейной артиллерии."
 INTEGRATED_SUPPORT_LABEL: "КОМПЛЕКСНАЯ ПОДДЕРЖКА"
 INTEGRATED_SUPPORT_LABEL_TT: "Улучшить организацию и эффективность вспомогательных подразделений."
 AIRLAND_BATTLE_LABEL: "АИРЛАНДНАЯ БАТАЛЛА"
 AIRLAND_BATTLE_LABEL_TT: "Улучшить потенциал армии в плане атаки."
 SHOCK_AND_AWE_LABEL: "ШУМ & AWE"
 SHOCK_AND_AWE_LABEL_TT: "Повышение общей эффективности армии."
 ASSAULT_LABEL: "АССАМБЛЕИ"
 ASSAULT_LABEL_TT: "Сосредоточьтесь на прямых и фронтальных атаках с доспехами."
 INFILTRATION_LABEL: "ИНИЦИТАЦИЯ"
 INFILTRATION_LABEL_TT: "Сосредоточьтесь на обмане и нетрадиционных пехотных стратегиях."
 DEEP_BATTLE_LABEL: "БАТАЛКА ДЕЙСТВИЯ"
 DEEP_BATTLE_LABEL_TT: "Улучшить поддержку и возможности для нанесения ударов по вражеской территории."
 MASS_MOBILIZATION_LABEL: "МОБИЛИЗАЦИЯ МАСС"
 MASS_MOBILIZATION_LABEL_TT: "Максимальное увеличение числа набранных сотрудников и увеличение их численности."
 FLEET_IN_BEING_DESC: "Сильный флот, сосредоточенный вокруг боевых кораблей, означает, что мы - сила, с которой нужно считаться, когда мы развертываемся в море."
 TRADE_INTERDICTION_DESC: "Против более сильного военно-морского противника мы можем сосредоточиться на том, чтобы связать их флот и уничтожить линии снабжения, чтобы заморозить их военную машину."
 BASE_STRIKE_DESC: "С особым упором на перевозчиков и их поддержку ни один враг не будет вне нашей досягаемости, будь то на суше или на море."
 AIR_SUPERIORITY_DESC: "Наши бойцы являются основой военно-воздушных сил и оба защищают наше небо, сопровождают бомбардировщиков и очищают небо врагов для наших сухопутных войск."
 BATTLEFIELD_SUPPORT_DESC:1 "Улучшая взаимодействие между авиаподдержкой и дивизиями, мы можем растрачивать деньги на вражеские дивизии при оптимальной поддержке"
 OPERATIONAL_INTEGRITY_DESC: "Тактические бомбардировщики являются гибкими и могут обеспечивать как наземную поддержку, так и регулярные бомбардировки"
 STRATEGIC_DESTRUCTION_DESC: "Взрывая вражеские фабрики ночью или, что более опасно, днем мы можем серьезно помешать их военной машине."
