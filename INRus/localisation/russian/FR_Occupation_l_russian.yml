#Majors
 annexation_28: "Судьба Альзаса-Лоррена"
 annexation_28_desc: "После капитуляции наших последних врагов в Европе наша военная администрация управляла территориями Альзас и Лоррейн, долгое время спорящие с Германией и Францией, с военным законодательством. С миром, однако, возникают надежды на перемены, и посланники из Страсбурга, часто сопровождаемые непримиримыми французскими послами, были замечены в коридорах власти в [РООТ. Капитальный. Гетнам], надеясь оказать давление на бюрократов, чтобы они восстановили главным образом германоязычную территорию во Франции, прежде чем кто-либо в нашей администрации сможет сесть и в полной мере рассмотреть этот вопрос. Должны ли мы удовлетворить их просьбы? Является ли Алсаче раз и навсегда для всего немецкого? Или же мы должны дать альцатианцам несколько хороших лет [РООТ.Гетадективной] оккупации, прежде чем должным образом рассмотреть этот вопрос, когда ситуация в мире позволит лучше всего?"
 annexation_events.1001.a: "[герман_palatinate. GetGrantTerritoryEvent Вариант]"
 annexation_events.1001.b: "[Герман_баден. Вариант GrantTerritoryEvent]"

 annexation_8: "Судьба Люксембурга"
 annexation_8_desc: "На протяжении веков люксембургский вопрос беспокоил великие державы. После Вельткрига и 25 лет немецкого правления мало кто из люксембургского народа жаждет независимости, и в эпоху синдикализма, тесной воздушной поддержки и криптологической расшифровки любое упоминание о салическом законе было встречено не столько с презрением, сколько сужением. Великое Герцогство Люксембург не вернется на карту Европы. Однако также нет необходимости возвращать его в Германию. Люксембург был частью Франции и затем Бельгии немногим более века назад без жалоб, и если решение будет служить нашей внешней политике, то нет никаких сомнений в том, что Люксембург на этот раз тоже не вызовет никаких проблем."

 annexation_781: "Судьба Рейнской земли"
 annexation_781_desc: "Поражающее сердце немецкой промышленности, основа прусского доминирования Германии и жестокая стадия Второй Велткриг - Рейнленд в некоторых отношениях является местом, в наибольшей степени ответственным за ужасы XX века. Поэтому некоторые советники нашего правительства рекомендовали вывести Рейнленд из Германии и даже наложить огромные репарации для того, чтобы повредить региону. С другой стороны, с недавним завершением войны Германия вряд ли сможет вновь угрожать нам в ближайшее время, и они могут стать гораздо более способным союзником и экономическим партнером, а не без литей Рухра. Что бы мы ни решили, было бы разумно сделать это быстро, поскольку чем дольше мы оккупируем Рейнленд, тем больше наших ресурсов она будет поглощать, чем производить."
 annexation_events.1003.a: "Отпустите рейнское государство."
 annexation_events.1003.b: "Освобождайте рейнское государство и взыщите суровую компенсацию."
