l_russian: 

occupation.1.d: "После ожесточенной борьбы наших храбрых людей против польских сил Польша теперь потеряна своим защитникам."
occupation.2.d: "Кровавая битва в Альпах оставила швейцарский народ пораженным тем, что одна из наиболее защищенных и защищенных стран на земле упала. В Берне все еще можно услышать выстрелы из винтовок, поскольку становится ясно, что мы не все приветствуем в Швейцарии. Мы, возможно, захотим рассмотреть возможность освобождения дружелюбного правительства в горной крепости, с тем чтобы больше наших людей не пало швейцарскими ополчениями, или мы могли бы продолжать оккупацию, потенциально ценой больших затрат."
occupation.3.d: "Шведская нация упала под наши ботинки, а жители Стокгольма с ужасом наблюдают, как наши войска героически идут по своим улицам."
occupation.4.d: "Жестокие боевые действия на фьордах и горах Норвегии привели к оккупации нашей страны и оккупации города Осло."

#KR
occupation.5.d: "После короткой кампании по многим островам Дании и захвата ее столицы нам удалось уничтожить страну. Копенгаген теперь в наших руках! Статус атлантических островов Дании является особенно интересным случаем, но нам в любом случае придется принять решение о будущем Дании."
occupation.6.d: "Австрия была вынуждена капитулировать, и наши войска патрулируют улицы Вены, чтобы предотвратить восстание или что-либо, что могло бы привести к дальнейшей нестабильности."
occupation.7.d: "Венгерская нация полностью побеждена, наши силы охраняют улицы Будапешта, а партизаны задерживаются по всей сельской местности, но должно ли это положение оставаться постоянным? Что нам делать с венгерскими землями?"
occupation.8.d: ""
occupation.9.d: "После короткой кампании в горах Словакии нам удалось разрушить оборону страны."
occupation.10.d: "Литва была передана под наше руководство, и наши войска оккупировали этот район, и сейчас мы должны решить, что с ним делать."
occupation.11.d: "Большая часть Латвии была поставлена под наш контроль, поскольку наши войска оккупировали регион, и сейчас мы должны решить, что с ним делать."
occupation.12.d: "Большая часть Эстонии оказалась под нашим контролем, поскольку наши войска оккупировали регион, и сейчас мы должны решить, что с ним делать."
occupation.13.d: "Финские солдаты были побеждены, и наша армия проходит через Хельсинки, теперь мы должны решить вопрос о том, как лучше управлять финнами."
occupation.14.d: "После короткой кампании в болотах и городских центрах Нидерландов нам удалось свергнуть гордую нацию."
occupation.15.d: "После короткой кампании по всей Бельгии мы теперь контролируем регион и должны решить, что с ним делать."
occupation.16.d: "Румынские силы наконец-то схватились за нашу превосходящую силу."
occupation.17.d: "Сербское государство было фактически ликвидировано, и его армия полностью перенаселилась нашими силами."
occupation.18.d: "Черногория теперь прочно находится в наших руках после оккупации этого района, но мы не можем оставаться в неспокойной Черногории навсегда, мы должны решить, что с ней делать."
occupation.19.d: "После долгой ссоры с болгарами мы начали полное наступление и заставили болгарскую армию сдаться."
occupation.20.d: "После проведения кампании по всей албанской деревне наши враги в Тиране, наконец, захватили власть над своей страной, и наше положение в Адриатике было укреплено, но теперь мы должны решить, что делать с Албанией."
occupation.21.d: "Греческий полуостров защищен, и вся греческая армия капитулировала."
occupation.22.d: "Мы уничтожили последние остатки турецкого государства и, наконец, поместили «больного человека Европы» в его могилу. Наши войска патрулируют улицы Анкары, но мы не можем оставаться оккупантами вечно. Необходимо будет принять решение в отношении будущего правительства турецкого народа."
occupation.23.d: "После ожесточенных боев на Кавказе мы захватили и аннексировали Армению. Армянская армия сдалась, и территория находится под нашим контролем, но народ все еще сопротивляется, но вскоре они сдадутся."
occupation.24.d: "Наши армии взяли под свой контроль северную часть Леванта, и местное курдское население требует самоуправления."
occupation.25.d: "Мы завоевали плодородные земли Ирака, включая большой и древний город Багдад."
occupation.26.d: "После долгой ссоры с арабами мы начали полное наступление и заставили Армию арабских государств сдаться."
occupation.27.d: "Город Бейрут был передан под наш контроль, когда наши войска оккупировали регион. Маронитская мечта о Леванте, которым они управляли, мертва. Теперь мы должны решить, что делать с оставшимися от их народа."

#IN
occupation.28.d: "Мы добились победы на Святой земле, и теперь наши силы взяли под свой контроль земли вокруг реки Иордан, и по мере того, как и арабы, и евреи начинают более сопротивляться нашей оккупации по мере увеличения ее продолжительности, становится ясно, что мы должны иметь постоянное решение для нашего контроля на этих землях, что мы, возможно, захотим рассмотреть вопрос об освобождении еврейского государства, сохранении статус-кво и существующих силовых структур в дни британского правления на этих землях, или же мы, возможно, захотим рассмотреть вопрос о том, чтобы освободить палестинское арабское государство для арабского мусульманского и христианского населения этих земель, или же, может быть, стоит оккупировать землю во всей ее полноте, поскольку предыдущие варианты не угодны всем на этих землях, и у нас, возможно, есть планы на этой территории."

#KR
occupation.29.d: "Наши вооруженные силы победили грузинский режим и сейчас триумфально идут по улицам Тбилиси."
occupation.30.d: "После ожесточенных боевых действий на Кавказе мы захватили и аннексировали Азербайджан. Армия азербайджанцев сдалась, и ее территория находится под нашим контролем, но народ все еще сопротивляется. Что нам делать с нашими вновь завоеванными землями?"
occupation.31.d: "Правительство Лиссабона, наконец, было вынуждено принять решение о судьбе португальского народа."
occupation.32.d: "После недавних конфликтов мы стали контролировать ряд территорий, которые когда-то принадлежали испанскому государству."
occupation.33.d: "Великое Герцогство Люксембург находится сейчас под нашим правлением, и мы должны решить, что делать с этой политикой."
occupation.34.d: "После короткой кампании по всей Беларуси нам удалось разрушить оборону Минска."
occupation.35.d: "После долгой битвы с Брэдбаскетом Европы мы начали полное наступление и заставили Украинскую армию сдаться."
occupation.36.d: "Мы взяли под контроль хорватские территории, и местные жители в определенной степени сопротивляются, и мы должны решить, что делать с их землями."
occupation.37.d: "Судьба ирландского народа находится сейчас в наших руках."
occupation.38.d: ""
occupation.39.d: ""
occupation.40.d: "Наши армии наконец взяли под свой контроль столицу Парагвая и оккупировали территорию бывшего штата Парагвай, и сейчас мы должны решить, как создать компетентную администрацию в этом районе."
occupation.41.d: "После долгой кампании по враждебным чилийским Андам нам наконец удалось разрушить чилийскую оборону."
occupation.42.d: "После завоевания огромного аргентинского государства мы должны организовать компетентные администрации, чтобы держать территорию под контролем."
occupation.43.d: "После проведения кампании через джунгли и пустыни Боливии нам, наконец, удалось добраться до ворот Анд. &lt; &lt; Ла-Пас &gt; &gt; теперь в наших руках! &lt; &lt; Теперь мы должны решить будущее Боливии &gt; &gt; ."
occupation.44.d: "После кампании против враждебных перуанских Анд нам, наконец, удалось разрушить перуанскую оборону."
occupation.45.d: "После кампании по всему Эквадору нам наконец удалось разрушить эквадорскую оборону, Кито теперь в наших руках!"
occupation.46.d: "После кампании по всей Колумбии нам, наконец, удалось разрушить колумбийскую оборону, Богота теперь в наших руках!"
occupation.47.d: "После кампании по всей Венесуэле нам наконец удалось разрушить венесуэльскую оборону."
occupation.48.d: "После продолжительной кампании в Уругвае нам, наконец, удалось разрушить их оборону."
occupation.49.d: "После завоевания огромной бразильской нации мы должны организовать компетентные администрации, чтобы держать территорию под контролем, даже если великолепный город Рио находится под ботинками наших солдат, мы не можем держать его вечно."
occupation.50.d: "После продолжительной кампании в Канаде нам, наконец, удалось разрушить их оборону."
occupation.51.d: "Теперь, когда война закончилась, мы должны решить, что делать с нашей оккупированной землей в Америке."
occupation.52.d: "После долгой кампании по всей Мексике мы наконец-то смогли разрушить мексиканскую оборону. Мехико теперь в наших руках! Теперь мы должны решить будущее Мексики."
occupation.53.d: "Гватемальское государство было вынуждено капитулировать, а наши войска идут в столицу Гватемалы."
occupation.54.d: "Сальвадор был аннексирован нашими гордыми армиями, и наши войска движутся в Сан-Сальвадоре."
occupation.55.d: "Наши армии свергли правительство Гондураса и патрулируют столицу Тегусигальпы."
occupation.56.d: "Теперь, когда Манагуа находится в наших руках, мы контролируем Никарагуа и можем решить, что делать с этими землями."
occupation.57.d: "Наш славный армейский корпус прошел по земле и теперь занимает столицу бывшего коста-риканского правительства."
occupation.58.d: "После быстрой кампании вокруг Панамского канала нам, наконец, удалось разрушить панамскую оборону. &lt; &lt; Панама &gt; &gt; теперь в наших руках! &lt; &lt; Панама &gt; &gt; . &lt; &lt; Сейчас мы должны решить будущее Панамы &gt; &gt; ."
occupation.59.d: "После короткой кампании по всему острову Куба, наконец, нам удалось разбить кубинскую оборону. Гавана теперь в наших руках! Теперь мы должны решить вопрос о будущем Кубы."
occupation.60.d: "После короткой кампании на острове Испаньола нам, наконец, удалось разрушить гаитянскую оборону. &lt; &lt; Порт-о-Пренс &gt; &gt; сейчас в наших руках! &lt; &lt; Теперь мы должны решить будущее Гаити &gt; &gt; ."
occupation.61.d: "После короткой кампании на острове Испаньола нам, наконец, удалось разрушить доминиканскую оборону. &lt; &lt; Санто-Доминго &gt; &gt; теперь в наших руках! &lt; &lt; Теперь мы должны решить будущее Доминиканской Республики &gt; &gt; ."
occupation.62.d: "После долгой ссоры с российским государством мы начали полное наступление и заставили российские вооруженные силы сдаться."
occupation.63.d: "После долгой ссоры с перцами мы начали полное наступление и заставили персидскую армию сдаться. [266.Гетнам] теперь в наших руках!"
occupation.64.d: "Туркестан был поставлен под наш контроль, когда наши войска оккупировали регион, и сейчас мы должны решить, что с ним делать."
occupation.65.d: "Казахстан находится под нашим контролем, поскольку наши войска захватывают регион, и сейчас мы должны решить, что с ним делать."
occupation.66.d: "После продолжительной ссоры с афганцами мы начали полное наступление и заставили афганскую армию сдаться и бежать в горы. &quot; Кабул &quot; и основные дороги теперь в наших руках, но сельская местность сплотилась против нас, и у нас может быть большая борьба, если мы попытаемся оккупировать так называемый &quot; верфь империй &quot; ."
occupation.67.d: "После нашей успешной кампании в степях Монголии перед нами стоит задача создать новый местный административный орган для восстановления мира, однако у нас есть несколько вариантов выбора."
occupation.68.d: "Древнее сердце чехов было завоевано нашими победоносными войсками, благородный камень Молдау, Прага, оккупирован нашими войсками, которые умело шевелятся по площади Венсеслас, должны ли мы поддержать чешское правительство, преданное планам нашего собственного государства, или сохранить эту великолепную военную оккупацию?"
occupation.69.d: "Нашим армиям удалось взять под свой контроль Индонезию, и теперь сами острова заняты нами. У нас есть несколько вариантов: мы можем либо марионеткой заполучить остров, либо забрать его для себя, поскольку он занимает ключевую позицию в Юго-Восточной Азии и располагает многими стратегически ценными ресурсами."
occupation.70.d: ""
occupation.71.d: "После окончательного освобождения гордой Кореи на нас была возложена ответственность за организацию управления вновь завоеванными территориями, что нам делать?"
occupation.72.d: "Сейчас мы контролируем дикие районы Индокита и должны решить, что делать со всеми этими различными народами."
occupation.73.d: "После нашей успешной кампании на японских островах мы теперь должны создать новую местную администрацию для восстановления мира, но есть несколько вариантов выбора..."
occupation.74.d: "После нашей успешной кампании в тибетском плато перед нами стоит задача создать новую местную административную власть для восстановления мира, однако у нас есть несколько вариантов выбора."
occupation.75.d: "После нашей успешной кампании в Эфиопии у нас теперь есть задача создать новую местную административную власть для восстановления мира, но есть несколько вариантов для нашего выбора..."
occupation.76.d: "Наконец, африканская власть над Южной Африкой капитулировала перед нашими славными армиями, которые сейчас проходят через мыс. После начала нашей военной оккупации и окончания войны появились голоса, утверждающие, что нам нужно создать марионетку южноафриканского народа, чтобы держать этот район под нашим контролем."
occupation.77.d: "Наша аннексия бывшей португальской колонии Анголы оставила нас для того, чтобы управлять этими миллионами африканцев далеко от моря."
occupation.78.d: ""
occupation.79.d: ""
occupation.80.d: "Наша аннексия бывшей португальской колонии Мозамбика оставила нас для того, чтобы управлять этими миллионами африканцев далеко от моря."
occupation.81.d: "Теперь, когда мы контролируем бывшую британскую колонию Северная Родезия, у нас остается выбор, как управлять этим районом, создать независимую Северную Родезию или занять ее?"
occupation.82.d: "Теперь мы занимаем перекресток бывшей немецкой колонии Восточной Африки, позднее британской колонии Танганьика, теперь наша, со столицей Дар-эс-Салама."
occupation.83.d: "Степи Кении теперь находятся под нашим грациозным контролем, что нам с ними делать?"
occupation.84.d: "Теперь мы контролируем территории бывшей итальянской колонии Сомали, и этот неудобный район, населённый сомалийцами, окажется трудно поддерживать посредством оккупации, может быть, нам следует позволить сомалийцам организоваться в какой-то степени?"
occupation.85.d: "Наша аннексия бывшей бельгийской колонии Конго оставляет нам выбор, должны ли мы продолжать оккупировать ее, чтобы добавить ее в нашу империю, или же мы должны оставить определенную автономию конголезцам и создать марионеточное государство?"
occupation.86.d: "Теперь мы контролируем бывшую французскую колонию Габона и вместе с ней массы африканцев, жаждущих свободно дышать, должны ли мы предоставить им эту свободу под нашим пристальным наблюдением или же эта мечта тщетна?"
occupation.87.d: "С нашей недавней аннексией колонии Камеруна, бывшая итальянская администрация упала, и эта территория нуждается в новой способной администрации."
occupation.88.d: ""
occupation.89.d: "Теперь мы аннексируем Бурунди, бывшую британскую колонию, и должны ли мы восстановить независимость Бурунди и позволить ей управлять своими землями?"
occupation.90.d: "После освобождения Руанды из британской колониальной хватки у нас остался выбор позволить руандийцам управлять собой в какой-то степени или нет, должны ли мы это сделать?"
occupation.91.d: "Теперь мы оккупировали бывшую британскую колонию Уганды, и этот регион, населенный и близкий к Великих озер, далек от того, что мы могли бы контролировать, должны ли мы облегчить его, предоставив им уровень самоотдачи или же мы должны продолжать оккупацию?"
###################
occupation.92.d: "Теперь мы должны решить, управлять ли остров напрямую или же найти местных элементов, готовых сотрудничать с нашей администрацией."
occupation.93.d: "Стратегический порт Джибути находится под нашим контролем."
occupation.94.d: "Создание здесь верного режима обеспечило бы стабильную базу на побережье Красного моря."
occupation.95.d: "Для эффективного управления этой разрастающейся территорией нам необходимо надежное кооперационистское правительство."
occupation.96.d: "Наши войска обеспечили доступ к пустыням Чада, и мы должны определить, лучше ли сохранять военное правление или делегировать власть дружественной местной исполнительной власти."
occupation.97.d: "В настоящее время в наших руках находится долина Нил в Судане, и лояльная местная администрация могла бы сыграть неоценимую роль в обеспечении открытости и безопасности региональных торговых маршрутов."
occupation.98.d: "Контроль над этой древней землей требует деликатного выбора между прямой силой или соответствующим марионеточным режимом."
occupation.99.d: "Старая администрация Нигера рухнула, и мы должны решить, стоит ли нам создать лояльное правительство для поддержания порядка по всему Сахелю."
occupation.100.d: "Создание дружественного местного режима помогло бы нам более эффективно управлять обширными внутренними районами."
occupation.101.d: "Песок Мавритании находится сейчас под нашим контролем, и мы должны выбрать между бременем военного губернаторства и удобствами кукольного государства."
occupation.102.d: "Дагомея была защищена нашими передовыми колоннами, кооперационистское правительство могло бы помочь успокоить побережье, пока мы смотрим на дальнейшее расширение."
occupation.103.d: "Занятие Верхнего Вольта завершено, и мы должны решить, способна ли местная администрация поддерживать требуемую нами стабильность."
occupation.104.d: "Теперь мы должны официально закрепить наше правление, либо через наших офицеров, либо через лояльный режим."
occupation.105.d: "Местная марионетка могла бы справиться с региональными трудностями, пока мы будем охранять стратегические залежи полезных ископаемых."
occupation.106.d: "С падением Дакара Сенегал фактически является нашим, и мы должны решить, как наиболее эффективно управлять этим порталом в Западную Африку."
occupation.107.d: "Узкий анклав Гамбии был оккупирован. &lt; &lt; Дружественная местная администрация &gt; &gt; упростит управление этой стратегически расположенной полосой земли."
occupation.108.d: "Наши силы установили контроль над Сьерра-Леоне, и мы должны выбрать между постоянным военным гарнизоном и более гибким кооперационистским правительством."
occupation.109.d: "Республика Либерия была оккупирована, и ее старый порядок был ликвидирован."
occupation.110.d: "Мы должны решить, следует ли нам управлять этим процветающим регионом напрямую или через кукловода."
occupation.111.d: "Нигерия с ее огромным населением и ресурсами в настоящее время находится под нашим контролем."
occupation.112.d: "Мы должны решить, стоит ли прилагать усилия для сохранения военного губернатора или достаточно кукольного государства."
occupation.113.d: "Местная администрация, занимающаяся вопросами сотрудничества, могла бы помочь в управлении трудной местностью и в поддержании общественного порядка."
occupation.114.d: "Департаменты Алжира находятся под нашей юрисдикцией, и мы должны решить, интегрировать ли территорию или укрепить лояльное местное правительство."
occupation.115.d: "Королевство Марокко находится под нашей защитой, и мы должны определить, будем ли мы править из Рабата непосредственно или через соответствующий местным властям."
occupation.116.d: "Для поддержания мира мы должны выбрать между военной оккупацией и режимом сотрудничества."
occupation.117.d: "Сейчас пустыня Ливии находится под нашим контролем, и мы должны решить, как наиболее эффективно управлять этой обширной и малонаселенной территорией."
occupation.118.d: "Дружелюбное местное правительство стало бы жизненно важным союзником в поддержании порядка вдоль этой чувствительной границы."
occupation.119.d: "Филиппинский архипелаг сейчас в наших руках, и мы должны решить, будем ли мы управлять островами напрямую или же создадим лояльную республику."
occupation.120.d: "Наши силы оккупировали Королевство Сиам, и мы должны определить, является ли марионеточная монархия или прямое военное правление наилучшим путем вперед."
occupation.121.d: "Для управления этими островами требуется либо огромный гарнизон, либо лояльное кооперационистское государство."
occupation.122.d: "Индийский субконтинент пал. Мы должны выбрать между сохранением единой марионетки, разделением земли на более мелкие лояльные королевства или прямым правлением."
occupation.123.d: "Мы должны решить, сохраняем ли мы военное присутствие или восстанавливаем порядок через соответствующий местному режиму."
occupation.124.d: "Наши силы добрались до горного королевства Бутана."
occupation.125.d: "Непал был защищен нашими войсками, и мы должны решить, будем ли мы править этой изогнутой местностью непосредственно или через посредство дружелюбного марионеточного правительства."
occupation.126.d: "Мы должны выбрать между военным губернаторством или режимом сотрудничества для управления местной администрацией."
occupation.127.d: "Мы должны решить, как наиболее эффективно управлять этим жизненно важным стратегическим центром."
occupation.128.d: "Султанат Оман был занят, и мы должны решить, сохранять ли нашу собственную военную администрацию или установить более послушный местный правитель."
occupation.129.d: "Наши силы обезопасили озлоблённую территорию Йемена, и лояльное местное правительство поможет нам обезопасить южный вход в Красное море."
occupation.130.d: "Левант стал свидетелем смены хозяев с нашей оккупацией Сирии, и мы должны решить, будем ли мы править из Дамаска напрямую или через марионеточный режим."
occupation.131.d: "Административный центр Браззавиля находится под нашим контролем."
occupation.132.d: "Теперь, когда Словения находится под нашим контролем, мы должны решить, как управлять этой территорией, мы можем попытаться умиротворить регион, создав лояльную кооперационную администрацию, уступив администрации Австрии, если они в состоянии справиться с ней, или сохранив прямую, железную военную оккупацию."
occupation.133.d: "Наши силы установили жесткий контроль над обширными китайскими территориями, непосредственно управляя миллионами Китая, наложит огромное бремя на наши военные ресурсы и государственный аппарат, создание национального кооперационистского правительства может обеспечить ресурсы, которые нам нужны, не мешая нашей армии вести бесконечную партизанскую войну."
occupation.134.d: ""

fra.partition.2.d: "Париж захвачен, французы побеждены, теперь мы должны решить, что делать с оккупированной Францией."
fra.partition.3.d: "Наши армии взяли под свой контроль Альзас-Лоррейн после наших последних кампаний, региона, который спорил между Францией и Германией на протяжении последних 70 лет."
fra.partition.4.d: "Теперь, когда мы контролируем остров Корсика, должны ли мы сами управлять этим районом или передать его нашим местным союзникам?"
fra.partition.5.d: ""


