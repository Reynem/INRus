 annexation_59: "Судьба Северной Германии"
 annexation_59_desc: "Мы можем создать марионеточное государство, расположенное в Гамбурге или Брансуике, впервые за сто лет переместив центр немецкой политической жизни на запад. В противном случае, мы могли бы принять решение в пользу одного из наших других немецких союзных государств, возможно, укрепив их легитимность и силу для воссоединения Германии в один прекрасный день. Можем ли мы воспользоваться шансом? Или ради безопасности Европы, должны ли наши солдаты оккупировать Северную Германию в обозримом будущем?"
 annexation_events.1004.a: "Выпустить штат Северной Германии."

 annexation_784: "Судьба [784. GetName]"
 annexation_784_desc: "Одной из первых жертв прусского империализма стала Датскоязычная провинция [784. GetName]. &lt; &lt; Пруссия &gt; &gt; смогла доминировать в Германии после войны, начавшейся вокруг ее базы в регионе, и с ее возвращением в Данию после Великой войны, она оставалась болезненным местом между двумя державами. &lt; &lt; Однако иногда дипломатическая и военная необходимость перевешивает туманные вопросы языковой истории &gt; &gt; , и нет сомнений в том, что эта территория будет безопаснее в руках немецкого союзника, чем датский враг. &lt; &lt; Наш военный командир в регионе &gt; &gt; в настоящее время в состоянии справиться с беспорядками, но мы должны принять решение о будущем [784.Гетнам] и избавить его от неприятностей? &gt; &gt; ."

 annexation_64: "Судьба Пруссии"
 annexation_64_desc: "Бранденбург был центром тяжести германского рейха. На протяжении десятилетий Берлин активно работал, главным образом с политиками и дипломатами великих держав, но с [Гудение] с колючими приказами и криками солдат, и теперь он был введен в действие в соответствии с военным законодательством. С окончанием бывшего германского рейха почти неизбежно наступает начало нового. Немецкое государство, базирующееся в Берлине, будет мощным претендентом на воссоединение Германии в один прекрасный день, так что некоторые в нашем правительстве предложили предоставить Бранденбургу и Берлину немецкое государство, расположенное в западном городе, чтобы Германия больше никогда не могла подняться. Другие указывают на необходимость сильного прусского целого, чтобы противостоять нашим врагам на своих границах, и утверждают, что с нашим военным господством над Европой Пруссия больше никогда не мечтает о том, чтобы бросить нам вызов. Конечно, ни в коем случае, Прусцы могли бы оценить иронию хорошего, долгого \"temporary\" military occupation."
 annexation_events.1006.a: "Отпустите штат Центральная Германия."
