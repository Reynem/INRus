l_russian:

 white.1.t: "Граждане Рут-Гетнама требуют мира!"
 white.1.d: "Граждане [Королевы Гетнам] маршируют по улицам, протестуя против неспособности нашей армии защитить нашу нацию, они требуют, чтобы [Круг. Возьми лидера] надавил правящая партия [Круг. Гетрулинг Партия] на то, чтобы добиться мира и положить конец ненужному кровопролитию, прежде чем она охватит всю нашу страну."
 white.1.a: "[Королева. Найти] должен вести переговоры о мире."
 white.1.b: "Они будут сражаться до самого конца."
 white.2.t: "[Возникновение] подает в суд иск о мире."
 white.2.d: "Силы решительно победили армию в нескольких ключевых битвах, и теперь мы полностью контролируем спорные области между нашими двумя странами."
 white.2.a: "Мы принимаем условия [от имени Аллаха]"
 white.2.b: "[Круг. Гетем] примет не что иное, как безоговорочную капитуляцию."
 white.3.t: "[[Всевышний Аллах поведал о том, что люди отказываются уверовать в Него и отрекаются от того, что Он запретил. Они отказываются уверовать в Его знамения и отворачиваются от них.]]"
 white.3.d: "Несмотря на наше великодушное предложение, ненасытные отрицают мир; теперь этот конфликт перерос в полную войну за выживание самого себя; мы должны пожертвовать всем, что потребуется, чтобы спасти наш народ и народ от варварского."
 white.3.a: "К объятиям!"

 whitepeacein.1.t: "Мир с нашими врагами?"
 whitepeacein.1.d: "Силы решительно победили вражеские вооруженные силы в нескольких ключевых сражениях, и теперь мы полностью контролируем спорные области между нашими двумя странами. Наша невероятная победа разрушила решимость наших врагов, и, вероятно, они примут мирные условия, которые мы предлагаем, что приведет к передаче любых спорных территорий нам и нашим подданным и к строгому мирному соглашению. Постараемся ли мы расширить оливковую ветвь или раздавить ее под нами?"
 whitepeacein.1.a: "Мы приведем победоносный мир"
 whitepeacein.1.b: "Вместо этого мы их раздавим."
 whitepeacein.2.t: "Они требуют мира."
 whitepeacein.2.d: "Беспорядок продолжает расти по мере того, как силы [отправляются] дальше в наши земли, и теперь правительство в [отстоящем капитале.Гетнаме] предлагает нам принять мирное соглашение, и это соглашение позволит [отправиться на помощь] земли нашим врагам в обмен на прекращение боевых действий, которое, если оно будет продолжаться, может быть больше взято у нас."
 whitepeacein.2.a: "Мы принимаем условия [от имени Аллаха]"
 whitepeacein.2.b: "Победа будет только у Аллаха."
 whitepeacein.3.t: "[[Всевышний Аллах поведал о том, что люди отказываются уверовать в Него и отрекаются от того, что Он запретил. Они отказываются уверовать в Его знамения и отворачиваются от них.]]"
 whitepeacein.3.d: "Несмотря на наше великодушное предложение, ненасытные отрицают мир; теперь этот конфликт перерос в полную войну за выживание самого себя; мы должны пожертвовать всем, что потребуется, чтобы спасти наш народ и народ от варварского."
 whitepeacein.3.a: "К объятиям!"
 hunscriptedpeace.6.d: "Венгерские силы рухнули под властью нашей армии, и теперь они предлагают нам Южную Словакию в обмен на мир."
 hunscriptedpeace.2.b: "Мы оккупируем ВСЕ Венгрию!"
