 demobilization: "Демобилизация"
 demobilization_economic: "Демобилизовать нашу экономику"
 demobilization_manpower: "Успокойся."
 demob_economic_mission: "Демобилизовать нашу экономику"
 demob_manpower_mission: "Успокойся."
 demobilization_desc: "С учетом того, что угроза войны кажется отдаленной, люди больше не хотят мириться с трудностями военного законодательства, нам необходимо пересмотреть наши законы и рассмотреть возможность их изменения, с тем чтобы успокоить протестующих до того, как ситуация усугубится."
 demobilization_economic_desc: "Мы должны пересмотреть наши экономические законы и рассмотреть вопрос о том, чтобы изменить их, с тем чтобы производить больше потребительских товаров для удовлетворения их потребностей."
 draft_dodging_mission: "Рассмотреть проект кризиса, связанного с эвакуацией"
 draft_dodging_mission_desc: "Если не решить быстро, вопрос о призывниках, отклоняющих проект, только ухудшится и может привести к тому, что люди будут ставить под сомнение авторитет самого правительства."
 foreign_policy: "Внешняя политика"
 promises_of_peace: "Обещания мира"
 promises_of_peace_desc: "История научила нас ужасам войны, и мы никогда не должны допустить, чтобы это повторилось."
