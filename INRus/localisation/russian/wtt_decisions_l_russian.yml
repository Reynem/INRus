l_russian:
 foreign_support: "Внешняя поддержка"
 war_measures: "Военные меры"
 women_in_the_workforce: "Женщины в составе рабочей силы"
 women_in_the_workforce_desc: "По мере того как мужчины отправляются на войну, тысячи женщин берутся за работу на фабриках, чтобы держать военную машину в рабочем состоянии."
 scientist_refuge: "Убежище для ученых"
 scientist_refuge_desc: "С учетом нынешней политической обстановки в Европе, ряд ученых решили покинуть свою страну, они подали заявление на въездную визу в нашу страну, предоставив нам бонус на исследования, но также расстроят некоторых людей, которые считают, что это внутреннее дело, в которое нам не следует вмешиваться."
 operations: "Операции"
 emergency_factory_conversion_defensive: "Экстренная конверсия предприятий"
 emergency_factory_conversion_defensive_desc: "Нам срочно необходимо переоборудовать больше заводов для производства оружия и транспортных средств в целях защиты нашей страны."
 emergency_factory_conversion_offensive: "Экстренная конверсия предприятий"
 emergency_factory_conversion_offensive_desc: "Наши войска срочно нуждаются в большем снаряжении."
 propaganda_efforts: "Пропаганда"
 war_propaganda: "Пропаганда войны"
 war_propaganda_desc: "По мере того, как вокруг нас горит мир, наш народ, к сожалению, не готов к войне, и мы должны мобилизовать его поддержку для того, чтобы взяться за оружие для нашей нации."
 desperate_defense: "Отчаянная оборона"
 desperate_defense_desc: "Мы не можем больше отступать, наши солдаты должны копаться и держать линию."
 war_bonds: "Военные облигации"
 war_bonds_desc: "Нам нужно больше ресурсов для нашей военной экономики, и военные облигации — это лишь способ их получения."
 political_actions: "Политические действия"
 object_to_attaches: "Объект для атташе"
 object_to_attaches_desc: "Наши враги получают иностранную помощь!"
 infrastructure_building_slot: "Промышленная интеграция в масштабах всего региона"
 infrastructure_building_slot_flag: "Инфраструктура еще не получила дополнительного строительного участка."
 war_building_slot: "Промышленные земли"
 war_building_slot_flag: "Еще не получил дополнительного строительного участка за счет ассигнований на земельные участки."
 special_projects: "Специальные проекты"
 foreign_politics: "Внешняя политика"
 foreign_politics_desc: "Хорошая внешняя политика имеет жизненно важное значение для выживания нации, независимо от ее размеров. В то время как некоторые страны предпочитают сосредоточиться на создании альянсов, другие, более агрессивные, державы предпочитают бросать вызов своим противникам в открытом конфликте. Что бы мы ни выбирали, мы не должны быть безрассудными, ибо только посредством тактичной внешней политики мы можем построить дружбу и уничтожить наших врагов."
 prospect_for_resources: "Поиск ресурсов"
 prospect_for_resources_desc: "Наши геологи обнаружили на нашей территории ряд многообещающих месторождений ресурсов, и мы можем тратить немного капитала на развитие этих месторождений."
 economy_decisions: "Экономическая политика"
 war_propaganda_against_tension: "Пропаганда войны"
 war_propaganda_against_tension_desc: "Наш народ зависит от того, что каждый человек сделает, чтобы защитить нас."
 war_propaganda_against_warmonger: "Пропаганда войны"
 war_propaganda_against_warmonger_desc: "Народ призывает каждого мужчину, женщину и ребенка внести свой вклад в борьбу с этим злом!"
 war_propaganda_against_warmonger_neighbor: "Пропаганда войны"
 war_propaganda_against_warmonger_neighbor_desc: "Завтра мы станем нашим врагом, нам нужно, чтобы вы защищали свою страну сегодня!"
 crisis_in_progress: "Текущий кризис"
 crisis_solution_in_progress: "Уже пытаюсь урегулировать кризис."
