l_russian:

 #### Ideas ####

 TRA_political_isolation: "Политическая изоляция"
 TRA_political_isolation_desc: "Румынам было обещано территория Трансильвании во время Великой войны, но "Согласие" решило вместо этого внушить нам нашу независимость. Хотя мы всегда великодушны за эту зависимость, она оставила нас в политической изоляции. И венгры, и румынцы стремятся вернуть свою потерянную землю, и "Согласие" медленно теряет интерес к сохранению независимого Трансильванского государства."
 ###
 tra_danube_research: "Член научно-исследовательской группы в Дунае"
 tra_danube_research_desc: "Мы участвуем в дунайском исследовательском Блоке, давая нам и всем другим участвующим в нем нациям импульс нашим исследовательским способностям, и нам было бы мудро поддерживать хорошие отношения со всеми другими членами Блока."
 ###
 tra_integrated_officers: "Объединенный корпус сотрудников"
 tra_integrated_officers_desc: "Попытки сближения наших наций с военной точки зрения привели к формированию транснационального офицерского корпуса, в состав которого вошли генералы из всех членов группировки, хотя культурный и языковой разрыв и является трудным, со временем он станет одним из величайших наших достижений."
 ###
 tra_interlaced_economy: "Связанная экономика"
 tra_interlaced_economy_desc: "Мы приложили активные усилия к тому, чтобы связать нашу экономику с другими членами наших группировок, что позволило нам лучше выделять ресурсы на строительство и военное производство."

 ### Events ###

 trans.1.t: "Трансильванское Королевство"
 trans.1.d: "В 1921 году Трансильванское королевство стало результатом провала между Энтенти, Венгрией, и Румынией, чтобы решить, кто должен иметь контроль над Трансильванским регионом. Было внесено много предложений, но все они провалились. В конце концов, независимое Трансильванское Королевство было названо &quot; временным решением &quot; , которое будет пересмотрено на более позднем этапе. В настоящее время это решение рассматривается по всей Европе как перманентное, и маловероятно, что &quot; Энтенте &quot; захочет вновь вступить в этот регион."
 trans.1.a: "У нас есть враги со всех сторон..."

 trans.2.t: "Венгры предлагают нам перемирие!"
 trans.2.d: "С тех пор, как в 1920 году мы стали зависимыми, мы опасаемся нападения Венгрии на наши земли, чтобы вернуть нас под их защиту, однако, как представляется, политическая позиция в Венгрии изменилась, и президент направил нам письмо, в котором выразил свои желания в отношении договора о ненападении между нами, неважно, является ли это политическим шагом или просто актом дружбы, неизвестно, но независимо от того, должны ли мы отвечать на их просьбу."
 trans.2.a: "Договор лучше всего служит нашим интересам."
 trans.2.b: "Мы никогда не заключим сделку с дьяволом Магьяр!"

 trans.3.t: "Венгрия приглашает нас к их фракции."
 trans.3.d: "Мы были приглашены в официальный союз с венгерцами, они утверждают, что лучше всего для стабильности в регионе, если мы все объединим усилия в сотрудничестве и дружбе."
 trans.3.a: "Мы присоединимся к фракции."
 trans.3.b: "Мы так легко не подпишем нашу зависимость!"

 trans.4.t: "Венгрия требует Трансильвании!"
 trans.4.d: "Сегодня венгерское правительство направило нам официальное письмо, в котором потребовало, чтобы мы передали контроль над Трансильвании королю Хорти, что приведет к восстановлению венгерского господства в регионе."
 trans.4.a: "Мы должны защитить наш народ, принять его требования."
 trans.4.b: "Мы никогда не сдадимся!"

 trans.5.t: "Венгрия предлагает нам защиту"
 trans.5.d: "Румынцы никогда не хотели нас защищать, они хотели только аннексировать и интегрировать нас в свое государство. Венгры обратились к нам с предложением защиты. Если мы не согласимся, румыны могут перепрыгнуть на опертуанность и вторгнуться."
 trans.5.a: "Единообразно с Венгрией, еще раз."
 trans.5.b: "Мы никогда не потеряем нашу независимость!"

