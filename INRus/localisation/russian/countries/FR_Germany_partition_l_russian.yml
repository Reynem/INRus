l_russian:

 ger.partition.2.d: "Теперь, когда Германия побеждена, мы сами должны решить, каким должно быть будущее Германии. Мы можем решить освободить дружественную Германию, которая станет нашей марионеткой."
 ger.partition.3.d: "Мы завоевали район Силезии, есть несколько вариантов того, как разделить эту территорию."
 ger.partition.4.d: "Мы завоевали район Шлезвиг-Гольштейн, есть несколько вариантов, как разделить эту территорию."
 ger.partition.5.d: "Мы завоевали регион Восточной Пруссии, на столе есть несколько вариантов того, как разделить эту территорию."
