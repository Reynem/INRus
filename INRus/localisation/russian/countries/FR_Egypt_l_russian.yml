 EGY_Egyptian_Army: "Египетская армия"
 EGY_Through_Sea: "Через море"
 EGY_Legacy_Great_War: "Наследие Великой войны"
 EGY_Legacy_Great_War_desc: "Великая война была трагедией, и многие египетские солдаты погибли на полях Палестины, но мы должны учиться на ее ошибках и избегать их в будущем."
 EGY_Mobile_Army: "Мобильная армия"
 EGY_Mobile_Army_desc: "Чтобы избежать войны, которая характеризовала и застопорила Великую Войну, мы должны сосредоточиться на создании армии, которая всегда может быть мобильной и всегда нажимать на атаку."
 EGY_Versatile_Supply: "Вещество"
 EGY_Versatile_Supply_desc: "Для того чтобы иметь многофункциональную армию, мы должны иметь многофункциональную линию снабжения, которая бы соответствовала скорости и мобильности."
 EGY_Planning_Initiatives: "Инициативы в области планирования"
 EGY_Planning_Initiatives_desc: "Мы должны обеспечить, чтобы наши планировщики проявляли инициативу в отношении любых конфликтов, которые могут возникнуть."
 EGY_Offensive_Tactics: "Нападающие тактики"
 EGY_Offensive_Tactics_desc: "Наступательная тактика имеет жизненно важное значение для мобильных боевых действий, и мы должны научиться, как вести борьбу противника, а не сидеть и позволять им приходить к нам."
 EGY_Through_the_Hills: "Через холмы"
 EGY_Through_the_Hills_desc: "Мы должны понимать, что война заключается не только в нападениях, но и в защите, и самое простое место для защиты нашего дома находится на холмах."
 EGY_Mahdist_War_Legacy: "Наследие мадистской войны"
 EGY_Mahdist_War_Legacy_desc: "Махдистская война научила нас многому о партизанских войнах и боях в пустыне и горах. Мы должны учиться у них, чтобы избежать их повторения или, если необходимо, выиграть их быстрее."
 EGY_Shock_Initiatives: "Инициативы, связанные с шоком"
 EGY_Shock_Initiatives_desc: "Шок и благоговение очень эффективны в том, что касается срыва вражеских движений и их рассеивания."
 EGY_Defensive_Tactics: "Защитная тактика"
 EGY_Defensive_Tactics_desc: "Наш дом - это то, за что мы боремся."
 EGY_Scorched_Earth: "Пожарная Земля"
 EGY_Scorched_Earth_desc: "Наши солдаты должны быть оснащены для того, чтобы стереть все, что они найдут, в случае необходимости. Махдисты спрятались в пещерах и полях во время своих войн. Мы должны убедиться, что наши враги не смогут сделать то же самое."
 EGY_Living_off_Land: "Жить за пределами земли"
 EGY_Living_off_Land_desc: "Вместо того чтобы беспокоиться о обременительных линиях снабжения, мы должны обеспечить, чтобы наши солдаты обладали навыками и инструментами, необходимыми для того, чтобы при необходимости жить на земле, которую они занимают."
 EGY_British_Doctraines: "Британские докрэйнсы"
 EGY_British_Doctraines_desc: "Империя - за все свои недостатки - научила нас многому."
 EGY_Egyptian_Startegies: "Египетская стратегия"
 EGY_Egyptian_Startegies_desc: "Хотя мы можем многому научиться у других, мы должны обеспечить, чтобы мы могли быть самодостаточными в разработке наших собственных стратегий и планов боевых действий."
 EGY_Army_for_Egypt: "Армия для Ум-Ал-Дунии"
 EGY_Army_for_Egypt_desc: "Наконец, мы можем сказать, что у нас есть собственная армия, которая не была скована или диктована Империей, а была создана и управляется нашим собственным Союзом."

 EGY_Egyptian_Fleet: "Египетский флот"
 EGY_Egyptian_Fleet_desc: "В то время как мы по-прежнему полагаемся на Британию в обеспечении защиты на море, мы являемся прибрежным государством, и поэтому, возможно, мы захотим увидеть, сколько мы можем себе позволить."
 EGY_Imperial_Reliance: "Полагайтесь на Британский ВМС"
 EGY_Imperial_Reliance_desc: "В то время как создание нашего флота является привлекательной идеей, это как непрактично, так и пустая трата средств."
 EGY_Buy_British_Ships: "Покупайте старые корабли"
 EGY_Buy_British_Ships_desc: "Британия будет рада продать нам более устаревшие боевые корабли, это лучше, чем строить наши собственные, и хранить деньги в имперской экономике."
 EGY_New_Upgrades: "Новые усовершенствования"
 EGY_New_Upgrades_desc: "Даже старые корабли могут быть модернизированы новыми конструкциями."
 EGY_Offensive_Fleet: "Наступательный флот"
 EGY_Offensive_Fleet_desc: "Полагаясь на Имперский флот, мы полагаемся на флот, который может привести борьбу к нашим врагам, далеко от наших берегов."
 EGY_Dockyard_Construction: "Докьярд Строительные работы"
 EGY_Dockyard_Construction_desc: "Наши существующие военно-морские базы испытывают острую нехватку современного оборудования, мы должны модернизировать наши существующие доки и построить новые, с тем чтобы иметь флот, которым мы могли бы гордиться."
 EGY_Grand_Battlefleet: "Большой боевой флот"
 EGY_Grand_Battlefleet_desc: "Давайте же работать над созданием большого флота, чтобы раздавить всех врагов, настолько глупых, чтобы бросить нам вызов."
 EGY_Submarine_Warfare: "Подводные бои"
 EGY_Submarine_Warfare_desc: "Времена изменились, как и военные действия в открытом море, подводные лодки — это суда разрушения, способные уничтожить целые конвои, это будущее морской войны и будущее, которое мы должны преследовать."
 EGY_Reliance_on_Ourselves: "Полагайтесь на себя"
 EGY_Reliance_on_Ourselves_desc: "Имперский флот выполнил свою задачу, но что будет, если Империя станет нашим врагом?"
 EGY_Protect_Our_Shores: "Защищайте наши бои"
 EGY_Protect_Our_Shores_desc: "В то время как наша армия более чем способна защищать нашу страну на суше, мы по-прежнему рискуем вторжением на море, и наш флот должен быть хорошо оснащен для защиты наших берегов и обеспечения безопасности нашего народа."
 EGY_Escort_Ships: "Сопровождающие суда"
 EGY_Escort_Ships_desc: "Наши торговые конвои необходимы для нашего экономического роста и дальнейшего развития."
 EGY_Defensive_Fleet: "Оборонительный флот"
 EGY_Defensive_Fleet_desc: "Наш собственный флот будет оборонительным, сосредоточенным гораздо больше на защите наших берегов, чем на борьбе с врагом. Пусть они придут к нам, чтобы мы могли показать им могущество Египта."
 EGY_Fleet_Command: "Командование флота"
 EGY_Fleet_Command_desc: "Мы должны обеспечить, чтобы наши адмиралы и капитаны были лучшими из лучших, способными выполнять свои задачи и обязанности в связи с письмом."
 EGY_Africa_Naval_Superpower: "Морская суперсила Аравии"
 EGY_Africa_Naval_Superpower_desc: "Благодаря напряженной работе, которую мы вложили в наш военно-морской флот в последние месяцы и годы, мы стали главной военно-морской супердержавой в Аравии."

 EGY_Egyptian_Airforce: "Египетские военно-воздушные силы"
 EGY_Egyptian_Airforce_desc: "Нашим военно-воздушным силам не хватает сил и сил, но пришло время изменить это."
 EGY_Air_Ground_Support: "Поддержка воздух-перелет"
 EGY_Air_Ground_Support_desc: "Мы должны обучить наших пилотов методам наземной поддержки, с тем чтобы они могли разрушать наших врагов."
 EGY_War_Exercises: "Военные учения"
 EGY_War_Exercises_desc: "Любой хороший генерал-планировщик знает, что лучший способ для военно-воздушных сил - проводить военные учения, наши враги могут появиться откуда угодно в любое время, поэтому мы должны всегда быть готовыми и бдительными."
 EGY_Radar_Expansion: "Расширение радиолокационной сети"
 EGY_Radar_Expansion_desc: "Радиолокатор оказывает нам огромную помощь в перехвате прибывающих самолетов и отслеживании наших собственных операций."
 EGY_Rocketry: "Ракета"
 EGY_Rocketry_desc: "Экспериментальная по природе, но вдохновляющая по потенциалу, ракета - это то, что некоторые называют будущим войны."
 EGY_Total_War: "Итого, война"
 EGY_Total_War_desc: "Великая война доказала, что в войне больше нет ничего необычного. Давайте тренируем наши самолеты и бомбардировщиков, чтобы они нацеливались на стратегические цели наряду с военными, чтобы деморализовать врага."
 EGY_Strategic_Bombing: "Стратегическая бомбардировка"
 EGY_Strategic_Bombing_desc: "Наши бомбардировщики должны быть уверены в точности всех операций, независимо от того, где могут находиться цели."
 EGY_The_RAF: "РВС"
 EGY_The_RAF_desc: "Мы должны взять страницу из книги Империи и посмотреть, есть ли что-то, что мы можем скопировать в отношении наших собственных ВВС."
 EGY_Fighter_Improvements: "Улучшения для истребителей"
 EGY_Fighter_Improvements_desc: "Сила воздушного флота лежит в его боевиках. если придти сюда будет настолько глупо."
 EGY_The_EAF: "EAF"
 EGY_The_EAF_desc: "Мы не можем продолжать полагаться на вещи, которые империя уже создала. Королевские военно-воздушные силы известны своей мощью и мастерством. Однако египетские военно-воздушные силы будут намного лучше."
 EGY_Bomber_Improvements: "Усовершенствование бомбардировщиков"
 EGY_Bomber_Improvements_desc: "Наши бомбардировщики должны быть готовы к всевозможным условиям и миссиям."
 EGY_African_Skies: "Египетские небеса"
 EGY_African_Skies_desc: "Как и в случае с сушей и морем, наш народ вновь покорил небеса этого континента, пусть наши враги дрожат и умирают, если они настолько глупы, что приходят к нам."
 EGY_Our_Own_Air_Force: "Наши собственные военно-воздушные силы"
 EGY_Our_Own_Air_Force_desc: "Благодаря реформам, которые мы привнесли в структуру наших военно-воздушных сил, мы обеспечили, чтобы у нас были самолеты, которыми можно гордиться, и небеса, находящиеся под нашим собственным контролем."
