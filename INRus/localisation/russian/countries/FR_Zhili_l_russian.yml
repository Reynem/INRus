 ## Army Staff
 ZHI_jiang_baili: "Цзян Баили"
 ZHI_jiang_baili_commander_desc: "§L\n/Born в относительно процветающую семью Цзян вступил в гражданскую службу Цин в молодости и поступил в Университет Цинхуа, выпускной в 1901 году. Он учился в Японии, вернулся в 1910 году на короткое место в управлении, прежде чем снова уехать за границу, на этот раз в Германию. Он служил в правительстве Юань Шикайс до того, как объявил себя императором, решение Цзян решительно против. После краха Юаньса &quot; Эмпир &quot; он начал работать с Ву Пефу, став близким посредником и помогая ему победить Фенгтианскую клику в 1928 году. Он оставался близким союзником Ву и провел большую часть первых 1930-х годов, пытаясь подготовить страну к угрозе японского вторжения, что-то, что он видит как неизбежность."

 ZHI_wang_huaiqing: "Ван Хуайцин"
 ZHI_wang_huaiqing_commander_desc: "§L\n1875\nningjin, Zhili, Qing Empire\n §Y Военная карьера: §L\n Vang был рожден в хитроумной семье бюрократов высшего класса, его правый алкоголизм и азартные игры привели семью в нищету. Ван покинул свою семью и вступил в ряды военных в молодом возрасте, помогая подавлять восстания в 1905 году и превращаясь в навязчивых солдат Юань Шикай. Когда Сикайс поверил в то, что его десантный хитрый хитрый хитрый хитрый хитрость, как хитрость его хитроумный хребет, стал близким сообщником Као Куна и Ву Пефу. Хотя он номинально командовал несколькими разделами войск под командованием Цин, он по сути использовал эти китайские хитрости в качестве хитрых вымогателей и требовал, чтобы его хитральные хватки из городов он хвали его хи, он хитрил его х, и х х, он . ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪"

 ZHI_aisin_gioro_zaitao: "Айзен-Гиоро Зайтао"
 ZHI_aisin_gioro_zaitao_commander_desc: "В 1910 году дядя Пуйи, младший брат императора Гуангсу, был знаком с младенцем Пуйи, когда он был подростком. В 1912 году, когда Пуйи был свергнут. В 1917 году он был незамедлительно возвращен на должность генерального инспектора в 1909 году, прежде чем он отправился в тур по миру, и принял участие в похоронах короля Георга V в 1911 году. В 1911 году он был назначен главой Императорской гвардии. Один из основателей Партии Зонгшэ, Зайтао, стал более открытым для проведения реформы, чем в 1917 году."

 ZHI_aisin_gioro_pujie: "Айзен-Гиоро Пуджие"
 ZHI_aisin_gioro_pujie_commander_desc: "Брат Айзен-Гиоро-Пуйи провел свое детство в качестве товарища своего брата, который был известен своей вспыльчивостью и памперской природой. Хорошо известный инцидент рассказал о том, как Пуйи бросал истерику, когда он увидел, что в тени своего брата, который был жёлтым, был жёлтым, потому что жёлтый был цветом, зарезервированным только для императора. После восстановления в 1927 году Пуджие посещал университет в Берлине, где ему дали прозвище "Петер" своими одноклассниками, как ему было слишком трудно произносить. Несмотря на то, что он держит в тени своего брата, Пуджид взглянул на то, что он, в частности, позавидовал императору, который был прикован к церемониальным обязанностям и не имел большого образования, кроме судебных формальностей. Пуджие, с другой стороны, был подвержен последним западным наукам, образованию и культуре. Несмотря на то, что он становился в западной индустрии, он тянулся к своему брату."

 ZHI_cai_chengxun: "Кай Чэнксун"
 ZHI_cai_chengxun_commander_desc: "§L\n1871\nTianjin, Zhili, Qing Empire\n §Y Военная карьера: §L\nA выпускник Академии Тяньцзин-Вубей, Cai Chengxun служил в армии с 1900 года, в том числе в короткой форме в качестве военного губернатора Гансу, где он присоединился к Zhili Clique."

 ZHI_liu_menggeng: "Лю Менгген"
 ZHI_liu_menggeng_commander_desc: "§L\n1881\nFuning, Zhili, Qing Empream\n §Y Военная карьера: §L\n en chen's Army Army Medical School, Лю стал ближе к многим в Цилийской Клике, работая в различных медицинских и медицинских учреждениях, в результате чего он стал деканом Медицинской академии Баодинга. Он служил в качестве «министра здравоохранения» в Пекине с 1931 года и предложил амбициозный и далеко идущий план военной реформы, который включает в себя различные медицинские реформы. §Yimpostant notes: §L\nHas тесно связаны с многими в Цилийской академии, будучи двоюродным братом Као Кун.nHe также является министром разведки Као Кун и Зили Клика."

 ZHI_wang_chengbin: "Ван Чэнбин"
 ZHI_wang_chengbin_commander_desc: "§L\nBorn — один из первых союзников Ванга, помог ему подавить неудачное восстановление Цин в 1917 году. В 1923 году он повел войска вокруг президента Ли Юаньхуна на железнодорожной станции Тяньцзюнь. Он взял президентскую печать, чтобы помочь Каокуну стать президентом. Чэнгбин в основном отделился от других генералов Цили, и многие обеспокоены тем, что его смерть разоблачит глубокие разногласия в рамках внутренней деятельности Клики и Ассоциации гармонии."

 ZHI_gobulo_runqi: "Губуло Ранки"
 ZHI_gobulo_runqi_commander_desc: "§L\nBorn в одну из благородных семей Манчжу с длинными связями с кланом Айсин-Гиоро Гобуло Рунки родился сразу после того, как Цин был свергнут впервые. Будучи ребёнком, Рунки вошёл в подростковый возраст, когда германское вмешательство в Китай достигло своего зени. Один из его самых отличительных детских воспоминаний явился на свадьбу его сестры Ванрона с империей изгнанного в Тяньцзине в возрасте 10 лет. После того как германское вмешательство вернуло его зятя на трон, Рунки узнал от орды бизнесменов и военных атташе, которая появилась в Пекине в конце 1920-х и начале 1930-х годов."

 ZHI_zhang_qihuang: "Чжан Цихуан"
 ZHI_zhang_qihuang_commander_desc: "§L\nZhang Qihuang начал свою военную карьеру в Республиканских войсках на юге Китая, быстро поднялся в ряды, завершившись тем, что он стал губернатором Гуандуна. Когда Юань Шикай объявил себя императором, он ушел в отставку в отвращении и отправился в Шанхай. Его брат познакомил его с Ву Пейфу, и они быстро стали близкими союзниками. Он был преданным советником Ву, и в конечном итоге был повышен до нескольких независимых армейских команд."Iron Mouth." Wu Peifu rarely does anything without the advice of Zhang first."

 ZHI_lu_xiangting: "Лу Сянтинг"
 ZHI_lu_xiangting_commander_desc: "§L\n en general Profinition\n§YBorn: §L\n1880\nHejian, Zhili, Qing Empire\n §Y Военная карьера: §L\nA выпускник как Baoding Academy, так и японской сержантской школы, Лу был первоначально подчиненным губернатором в Лиге восьми провинций Сунь Чуанфан, но Lugs открыто презрение к сотрудничеству Сунь с Германией и его ненависть к иностранным концессиям привели к его увольнению со стороны Sun. Вместо этого он предпочел работать с Ву Пейфу. Он тесно сотрудничал с Цзяном Баили в разработке планов по борьбе с японским вторжением, поскольку единственное, что он презирает больше, чем немцы, это японское господство над Манчурией. §L\nStill поддерживает контакты со многими бывшими подчиненными в Лиге."

 ZHI_xiao_yaonan: "Сяо Яонан"
 ZHI_xiao_yaonan_commander_desc: "Он был вынужден отказаться от своей мечты стать имперским чиновником из-за нехватки средств, вместо этого он был избран Чжаном Чжидуном для вступления в свою новую военную академию &quot; Хубэй &quot; . Сяо окончил свою школу в 1909 году и использовал связи с семьей Као Кунз, чтобы остаться в неурядице революции в Синьхае, а затем использовать их для того, чтобы стать губернатором Губея. Он укрепил свое правление над провинцией и помог организовать &quot; Губейские генералы &quot; , неофициальную группу текстильных производителей, главную индустрию Хубей. Он едва выжил после покушения, совершенного в 1926 году врагами Као Куна, и был втянут еще дальше и дальше в одну область Жили во время и после немецкого вмешательства. Он все еще сохраняет свое господство над провинции Хубей, работая с Пекином."

 ZHI_li_bingzhi: "Ли Бинжи"
 ZHI_li_bingzhi_commander_desc: "После волнений 1917 и 1918 годов он присоединился к кругу Ву Пейфус в качестве начальника штаба к союзнику Ву Чжану Фулай."

 ZHI_aisin_gioro_xiqia: "Айсин-Гиоро Сиция"
 ZHI_aisin_gioro_xiqia_commander_desc: "ГЕНЕРАЛЬНОЕ ОПИСАНИЕ: 18 октября 1883 года, Цин Эмпайр, n §Y Военная карьера: §L\n дальняя двоюродная сестра Пуйи, Айсин-Гиоро Сиция была образована в Японии и служила Фенгтианской клике до восстановления в 1927 году."

 ZHI_cao_shijie: "Као Шиджи"
 ZHI_cao_shijie_commander_desc: "После восстания 1917 года Као Шиджи присоединился к Клике Зили и стал президентом президентской гвардии, подкупив свой путь в президентскую академию в 1923 году; скандал вокруг Пекинского кубка 1924 года вытолкнул Шиджи из власти, но в последние годы он вновь занял видное место среди генералов Цили."

 ZHI_aisin_gioro_jixing: "Джиксинг Айзен-Гиоро"

 ZHI_zhang_shaozeng: "Чжан Шаозенг"
 ZHI_zhang_shaozeng_commander_desc: "§L\nZhang вошел в Академию Имперской японской армии в 1899 году, чтобы научиться артиллерийской тактике и стратегии, и, вернувшись в Китай, вступил в бейянскую армию Юань Шикай. В 1906 году он был переведен в Фенгтскую провинцию, в которой тайно присоединился к Тонгменгуи. В 1911 году он не подчинился приказам подавить восстание, а вместо этого настаивал на конституционной монархии. После революции он был назначен Юаном Шикаем губернатором Суйюана. В 1917 году он участвовал в деятельности Дуана Цируи против Чжана Ксуна. В 1920 году он присоединился к Цхили Клике, потому что он был родственником Вуанка Пейфу и Фэн Юсяна, и его тесная личная дружба с Као Кунь. Он служил на различных министерских постах в конце 1920-х и ранних 1930-х годов, и был ограничен в попытках покушен в 1928 году."

 ZHI_du_xijun: "Дю Сиджун"
 ZHI_du_xijun_commander_desc: "§Y General Profinition\n§YBorn: §L\n1882\nHejian, Zhili, Qing Empream\n §Y Военная карьера: §L\nDu был одним из многих китайских студентов, направленных за границу для изучения японской военной тактики в рамках попытки Цин Династии модернизировать реформы до революции. Точная роль Дю в событиях 1911 года была в значительной степени оспорена, причем некоторые утверждали, что он первоначально был предан Цубейской провинции, и другие обвиняли его в том, что он является одним из ключевых деятелей в организации вторжения Куоминтанга на контролируемую им территорию Цухили во время северной экспедиции. После того, как Цилийу удалось обратить его на правую сторону войны, Ду взял на себя полный контроль над Хубеем, управляя стабилизацией разорванной войны провинции Убей, вслед за крепившим его креплением Zhili, он также поддерживал высокомерную власть над Зилий."

 ZHI_wang_lingyun: "Ван Линьюн"
 ZHI_wang_lingyun_commander_desc: "§L\n §YBorn: §L\n 27 сентября 1899\nLuoyang, Henan, Qing Empream\n §Y Военная карьера: §L\nWang Lingyun присоединился к инженерному батальону Ву Пейфунс в 1920 году, но вскоре после этого он поступил в Иянскую академию. В 1924 году он вступил в ряды армии Чжэньсуна во главе с Лю Чжэньхуа. Во время северной экспедиции армия Чженсонга присоединилась к Цили Клике и боролась против НРА, впоследствии приняла участие в четвертой Зили-Фенгтской войне. За его выдающееся выступление Ван был интегрирован в Зили Клику и вошел в личный круг Ву Пейфу, выступая в качестве советника по инженерным и крепильным вопросам. После реформ, проведенных Ву и другими старшими генералами Цили, он был повышен до бригадного генерала, самого молодого временной имперской армии."

 ZHI_guo_jijiao: "Гу Цззяо"
 ZHI_guo_jijiao_commander_desc: "В 1921 году Гуо был переведен в Баодингскую военную академию, а в 1923 году окончил Пекинскую военную академию. В 1917 году Гу Цзюй вступил в первую подготовительную школу Цинхе. Два года спустя он был назначен в Первую дивизию Артиллерийского корпуса и вторую смешанную бригаду Северо-Западной обороны. В 1921 году Гу был переведен в Баодингскую военную академию и окончил ее с полным отличием. В 1923 году Гуй вступил в первую подготовительную школу Цхилика. В то время как его молодая девушка не могла быстро повыситься. В этот период он стал союзником Лю Менггена, а Лю был выбран для руководства его национальным планом обороны, Гу был повышен до полного статуса."

 ZHI_wei_yisan: "Вей Исан"
 ZHI_wei_yisan_commander_desc: "§L\n§YBorn: 25 февраля 1884/nGaocheng, Zhili, Qing Empire\n §Y Военная карьера: §L\nWeiñn учился в Военной академии Баодингской армии, а в 1920 году он был главой 4-й Смешанной военной бригады Северо-западных сил обороны. В 1921 году он присоединился к Фенгтианской клике и стал главой 39-го полка, перешел на преподавание в 1923 году, когда работал инструктором Северо-восточной армии, а затем был начальником штаба 27-й дивизии Северо-восточной армии, а также различных команд в начале 1920-х годов, однако в мае 1926 года он дезертировал из Фенгтиан и присоединился к Ву Пейфус Зили Клике."

 ## Air Force
 ZHI_gao_zhihang: "Гао Чжиханг"

 ## Navy Staff
 ZHI_du_xigui: "Дю Сиги"
 ZHI_du_xigui_admiral_desc: "12 ноября 1874 года он закончил Нанкин Цзянньскую военно-морскую академию, Фуджиан, Цин Империя §YNaval Карьера: §L\nBorn в бедную семью, Дю пошел по стопам своих братьев и присоединился к военно-морскому флоту, чтобы спасти свою семью от обнищания. В 1902 году он закончил Наньцзин Цзяннанскую военно-морскую академию, после чего продолжил обучение в Соединенном Королевстве. За этим последовала карьера в модернизирующемся флоте Цин, где Дю служил и командовал одним из самых больших китайских кораблей. В ходе восстания в Вучанге он оставил Цинскую империю и присоединился к Цилийской клике. Во время правления Цили в 1923/1924 году он служил в качестве министра ВМС."

 ZHI_wu_renli: "Ву Ренли"
 ZHI_wu_renli_admiral_desc: "§L\n1874\nHefei, Anhui, Qing Empire\n §YNaval Profession: §L\documents on Wu_s ранние годы жизни, но в 1890 году он поступил в Вейхайскую морскую академию, хотя, как представляется, он перевелся в Военно-морскую академию Тяньцзин Бейян и окончил ее с отличием в 1896 году."

 ZHI_sa_zhenbing: "Sachenbing"
 ZHI_sa_zhenbing_admiral_desc: "После этого он посетил Королевский военно-морской колледж в Соединенном Королевстве, где столкнулся с современными военно-морскими новшествами. Возвращаясь домой, он участвовал в китайско-японской войне, где, будучи самым молодым командиром военно-морского флота в Цин, он был вынужден сдаться японцам после битвы в Вейхавеи, после того как все его командиры совершили самоубийство. В 1920 году он руководил военно-морскими реформами после подписания мирного договора, в значительной степени был невнимателен к более крупным политическим маврикиям, записанным в Китае. Во время восстания в Вучанге он столкнулся с полномасштабной мутинией и ушел в Шанхай, вместо того чтобы поджечь своих собственных людей, или предать свою страну."

 ZHI_aisin_gioro_zaixun: "Айзен-Гиоро Зайшун"
 ZHI_aisin_gioro_zaixun_admiral_desc: "В 1887 году он был переименован в &quot; Князь Дуан второго ранга &quot; , а затем был вновь повышен до финга фугуо Гонга в 1889 году, а Фэн &quot; Чжэнджуо гонг &quot; в 1890 году. В 1900 году предшественник Зайсуна Зайи, который сменил Идзи на &quot; Принц Руи второго ранга &quot; (позднее переименован в &quot; Князь Дюан второго ранга &quot; ), был лишен титула знаменателя и изгнан в Синьцзян в 1890 году. В 1900 году он стал предшественником Зайсуна Зайи, который сменил &quot; Принца Руи &quot; . В 1908 году он был преобразован в &quot; принцессу Дюань &quot; , а в 19-й был назначен министром ВМС США."

