 ###FOCUSES###
 ZHI_MAIN_far_east: "Далеко до востока"
 ZHI_MAIN_far_east_desc: "За воротами на восток лежит некогда единое королевство, которое боялось больших и далеких земель, Китай, Среднее Королевство. С тех пор, как первый президент Китайской Республики Юань Шикай объявил себя гонксовским императором Китая, ведущим к гражданской войне, которая уже десятилетиями поражает Китай, Клика Жили была там."
 ZHI_MAIN_industry: "Наша крушительная индустрия"
 ZHI_MAIN_industry_desc: "Возвращение к нашей первой мощи является прежде всего важным для нашей промышленности, которая должна быть обновленной и работать на полную эффективность, и не секрет, что у Китая в целом не только ужасные рабочие зачатки, но и отсутствие модернизации как в промышленности, так и в вооружениях."
 ZHI_MAIN_clear_forests: "Очистить леса"
 ZHI_MAIN_clear_forests_desc: "Для того чтобы сделать место для наших новых заводов и будущей промышленности, необходимо будет расчистить большие заготавливаемые районы."
 ZHI_MAIN_factories: "Создать новые фабрики"
 ZHI_MAIN_factories_desc: "Для улучшения нашей промышленной ситуации крайне важно, чтобы мы существенно увеличили размеры нашей промышленности, хотя сейчас это кажется отдаленной целью, мы можем вскоре оказаться на пороге промышленной революции в Восточной Азии."
 ZHI_MAIN_subsidies: "Субсидии для новых компаний"
 ZHI_MAIN_subsidies_desc: "У нескольких людей в нашей стране есть товары, которые они хотят производить и продавать как на местном, так и на международном рынках. Однако экономика в нашем государстве настолько бедна, что у них нет средств для создания указанных компаний. Спонсируемая государством программа субсидирования поможет решить эту проблему."
 ZHI_MAIN_jap_funds: "Спросите у японцев о фондах"
 ZHI_MAIN_jap_funds_desc: "С учетом того, что японцы являются нашим союзником, было бы разумно использовать это в наших интересах."
 ZHI_MAIN_jap_corps: "Приглашать японские корпорации"
 ZHI_MAIN_jap_corps_desc: "Вместо того, чтобы финансировать местные компании, нам было бы полезно пригласить уже хорошо зарекомендовавшие себя корпорации и компании из Японии."
 ZHI_MAIN_jap_imports: "Увеличение импорта из Японии"
 ZHI_MAIN_jap_imports_desc: "Боязнь еще одного голода, подобного тому, который был в 1920-х годах, привела к тому, что многие поверили, что увеличение и без того значительного импорта из Японии может быть разумной идеей."
 ZHI_MAIN_military: "Наши могущественные военные"
 ZHI_MAIN_military_desc: "Как ясно видно из вида нашей великой и славной армии, Клик Жили может быть почти чем-то, кроме как антивоенным. С одной из крупнейших, самых опытных и хорошо руководимых армий в Китае, Жили является гордым напоминанием о том, к чему должен стремиться весь Китай. Но, как бы хорошо ни выглядела ситуация снаружи, армия находится во всём, кроме хорошего государства. Воинства, состоящие из бандитов, свободно бродят по стране, когда они не служат в армии, оружие, используемое в армии, устарело, и наши войска испытывают острую нехватку дисциплины и склонны не подчиняться прямым приказам. Последние из этих вопросов связаны с тем фактом, что наши люди и армии состоят из непримиримых людей в оружии. Эти вопросы следует рассматривать, чтобы мы могли выиграть в предстоящей войне."
 ZHI_MAIN_wu_reforms: "Реформы Ву Пейфу"
 ZHI_MAIN_wu_reforms_desc: "Для повышения не только боевой эффективности нашей армии, но и административной эффективности Ву Пейфу придумал ряд реформ, которые он хотел бы провести."
 ZHI_MAIN_jap_advisors: "Японские военные советники"
 ZHI_MAIN_jap_advisors_desc: "Чтобы повысить эффективность наших армий для предстоящей войны, мы должны просить советников из японской имперской армии больше учиться новым методам ведения войны."
 ZHI_MAIN_org_militia: "Организация военизированных формирований"
 ZHI_MAIN_org_militia_desc: "Значительная часть наших армий состоит из обычных бандитов и бандитов, которые завербовываются, когда начинается война, потому что наша экономика просто не может заплатить всю нашу армию, поскольку она слишком велика, а наша нация слишком мала, поэтому мы предложили ряд различных решений этой растущей проблемы."
 ZHI_MAIN_why_fight: "Напомни им, почему мы сражаемся"
 ZHI_MAIN_why_fight_desc: "Наши армии борются за нас, но борются только за эгоизм."
 ZHI_MAIN_mil_budget: "Запрашивать у Японии помощь по военному бюджету"
 ZHI_MAIN_mil_budget_desc: "Наш военный бюджет может быть большим, но он может быть больше."
 ZHI_MAIN_jap_weapons: "Японское оружие"
 ZHI_MAIN_jap_weapons_desc: "Оружие, используемое в наших армиях, ужасно устарело и неэффективно, мы должны импортировать новые, японские модели, чтобы компенсировать этот огромный недостаток."
 ZHI_MAIN_jaden_jewel: "Жемчужина Китая Джаден"
 ZHI_MAIN_jaden_jewel_desc: "Мы улучшили наши провинции и целую клику, до такой степени, что многие стали называть Клику Жили как"Jaden Jewel" of China, in reference to our leader. The pride can be felt not only in the armies, but also in the streets of our cities. Zhili, has returned to its former glory."
 ZHI_MAIN_broken_jewel: "Сломанная драгоценность Китая"
 ZHI_MAIN_broken_jewel_desc: "Если под каким-то ужасным происшествием мы никогда полностью не восстановим нашу великую нацию, это может привести к губительной и разрушительной кончине нашей когда-то доминирующей клики."
 ZHI_MIL_traitors: "Клика предателей"
 ZHI_MIL_traitors_desc: "Армия, готовая к самоподдерживанию, вовсе не армия."
 ZHI_MIL_suns_plan: "План Сунь Чуаньфанга"
 ZHI_MIL_suns_plan_desc: "Сунь Чуанфан предложил план, предусматривающий оснащение наших войск самым лучшим оборудованием и использование артиллерийских орудий в большем количестве, что, безусловно, улучшит нашу военную ситуацию."
 ZHI_MIL_sun_jap_help: "При поддержке Японии"
 ZHI_MIL_sun_jap_help_desc: "Мы должны двигаться вперед при поддержке Японии."
 ZHI_MIL_rising_sun: "Свет, ослепляющий восходящее солнце"
 ZHI_MIL_rising_sun_desc: "Опыт Китая в использовании более новой и современной военной техники ограничен, и поэтому наем японских инструкторов для обучения наших людей использованию этой техники станет значительным преимуществом в будущем."
 ZHI_MIL_quality_equip: "Качественное оборудование"
 ZHI_MIL_quality_equip_desc: "С помощью Японии мы наконец-то можем начать производство самого лучшего оборудования в Китае."
 ZHI_MIL_sun_no_help: "Без поддержки Японии"
 ZHI_MIL_sun_no_help_desc: "Мы должны двигаться вперед без поддержки Японии."
 ZHI_MIL_thunder_rains: "Громкие дожди от Неба"
 ZHI_MIL_thunder_rains_desc: "Сверху будет дождь, когда наши враги убегут от вопящих осколков гранат и снарядов, которые бьются по ним, и будет и никогда китайская армия, хорошо оснащенная и эффективно работающая, как армия Жили."
 ZHI_MIL_well_equipped: "Хорошо эвкуированная армия"
 ZHI_MIL_well_equipped_desc: "Наши армии лучше всех оснащены во всем Китае, но наши винтовки и артиллерия не сравняются."
 ZHI_MIL_jade_marshall_plan: "План Маршала Джейд"
 ZHI_MIL_jade_marshall_plan_desc: "Ву Пейфу считает, что мы должны использовать высшее планирование и дисциплину, чтобы выиграть предстоящие войны, все остальное является второстепенным."
 ZHI_MIL_replace_artillery: "Заменить старую артиллерию"
 ZHI_MIL_replace_artillery_desc: "Наша артиллерия стара и устарела, и мы должны стремиться полностью заменить ее и производить новое и более современное оборудование."
 ZHI_MIL_grand_with_jap: "При поддержке Японии"
 ZHI_MIL_grand_with_jap_desc: "Японцы знают дисциплину, как никто другой."
 ZHI_MIL_jap_org: "Японская организация"
 ZHI_MIL_jap_org_desc: "Для модернизации наших армий мы должны получить вдохновение от организации их. Структурирование разногласий и будущих подразделений имеет решающее значение для победы в любой войне."
 ZHI_MIL_jap_officers: "Японские офицеры в армии"
 ZHI_MIL_jap_officers_desc: "Чтобы научить наших солдат, мы наймем японских офицеров, которые возглавят несколько эскадрильей в армии..."
 ZHI_MIL_grand_without_jap: "Без поддержки Японии"
 ZHI_MIL_grand_without_jap_desc: "Японцы - пиявка на нашу страну, без них мы справимся."
 ZHI_MIL_plan_scenarios: "Планирование военных сценариев на будущее"
 ZHI_MIL_plan_scenarios_desc: "Даже из 14 миллионов фьючерсов не может быть ни одного случая, когда мы проиграем."
 ZHI_MIL_enforce_loyalty: "Принудительная преданность"
 ZHI_MIL_enforce_loyalty_desc: "Верность начальству в нашей армии ослабла и ослабла, и мы ратифицируем ее, обеспечив строгое соблюдение кодекса законов в армии."
 ZHI_MIL_well_led: "Хорошая армия"
 ZHI_MIL_well_led_desc: "Ни одна армия в Китае, возможно весь мир, не так хорошо управляется, как армия Жили Клик."
 ZHI_modern_military: "Современные военные"
 ZHI_modern_military_desc: "С помощью чрезвычайных усилий наши военные наконец-то достигли стандартов современной нации, все кланяются перед новыми хозяевами Китая, клика Жили."
 ZHI_comittee_fails_to_make_a_decision: "Комитет не может принять решение"
 ZHI_comittee_fails_to_make_a_decision_desc: "Каким-то образом комитет потерпел неудачу... как?"
 ZHI_use_our_vast_manpower: "Используйте нашу огромную силу"
 ZHI_use_our_vast_manpower_desc: "У нас есть люди, давайте используем их!"
 ZHI_new_weapons: "Приобретать новое оружие"
 ZHI_new_weapons_desc: "Даже если наши армии большие, они ничто без оружия."
 ZHI_depth_in_lines: "Глубина линий"
 ZHI_depth_in_lines_desc: "Если один солдат падет, двое должны занять его место."
 ZHI_strategically_placed_operations: "Стратегические концентрации"
 ZHI_strategically_placed_operations_desc: "Если мы стратегически сосредоточим наши силы в конкретных местах вдоль фронта, мы сможем более эффективно страдать от постоянных атак и контратаки."
 ZHI_not_modern_military: "Современные военные?"
 ZHI_not_modern_military_desc: "Наши военные могут быть не совсем в соответствии с современными стандартами, но, на самом деле, нам это нужно?"
 ZHI_jade_emperor_domain: "Дом Императора Джейда"
 ZHI_jade_emperor_domain_desc: "Император нефритов руководит небесами, его царством, и мы, наконец, воззовем к сухопутному доминированию Жили Клика над небесами!"
 ZHI_grand_scheme: "Великая схема"
 ZHI_grand_scheme_desc: "Разрушая производственные методы и инфраструктуру с неба, мы можем предотвратить продолжение врагами войн."
 ZHI_minor_support: "Незначительная поддержка"
 ZHI_minor_support_desc: "Самое важное - поддержка собственных войск в небе."
 ZHI_winds_of_destruction: "Ветры разрушения"
 ZHI_winds_of_destruction_desc: "Мы планируем создать элитные подразделения бомбардировщиков, которые летят в суровую погоду, чтобы поймать врага врасплох, мы называем их "Воротами уничтожения" Мы никогда не будем связаны правилами природы!"
 ZHI_dragon_of_the_east: "Дракон Востока"
 ZHI_dragon_of_the_east_desc: "Построив больше авиабаз и производя больше самолётов, мы сможем править небесами."
 ZHI_legacy_of_the_monkey_king: "Наследие Короля Обезьяны"
 ZHI_legacy_of_the_monkey_king_desc: "Солнце Вуконг, король Обезьян, использовал свой ум и силу, чтобы победить своих врагов."
 ZHI_heaven_bow_before_us: "Небеса преклоняются перед нами"
 ZHI_heaven_bow_before_us_desc: "Все враги, которые осмеливаются противостоять нам, столкнутся с жестоким сопротивлением на небе."
 ZHI_dragon_of_eastern_sea: "Дракон Восточного моря"
 ZHI_dragon_of_eastern_sea_desc: "Несмотря на то, что в настоящее время мир не может править как на суше, так и на море, в будущем мир научится бояться гнева китайских военных флотов, а для того, чтобы построить и обеспечить присутствие в Желтом море и за его пределами, он должен быть одним из наших главных приоритетов."
 ZHI_serpent_of_the_deep: "Змеи глубины"
 ZHI_serpent_of_the_deep_desc: "Один путь над морем, один под ним."
 ZHI_unshakable_pursuit: "Несдерживаемый костюм"
 ZHI_unshakable_pursuit_desc: "Теперь, когда заложены основы нашего военно-морского флота, мы должны рассмотреть тактику, которая будет использоваться для преследования вражеских кораблей."
 ZHI_under_the_cover_midnight: "Под покровом полуночи"
 ZHI_under_the_cover_midnight_desc: "Страйк ночью обеспечит, чтобы враг был пойман в неведении, что сделает удар наших подводных лодок еще больше."
 ZHI_undetected_unexpected: "Необнаруженные, неожиданные"
 ZHI_undetected_unexpected_desc: "Новые технологии, импортируемые из европейских стран, позволяют нам"hide" from the radars of enemy ships. This will surely prove immeasurably useful."
 ZHI_dragon_seas_of_the_high_sea: "Драконы открытого моря"
 ZHI_dragon_seas_of_the_high_sea_desc: "Один путь под морем, один над ним, хотя у нас нет много средств производства более крупных классов кораблей, это, очевидно, путь вперед."
 ZHI_unbreakble_scales: "Неповрежденные шкалы"
 ZHI_unbreakble_scales_desc: "Наши корабли продемонстрируют свое превосходство перед другими в жизнеспособности вместо высокой скорости."
 ZHI_the_dragon_breath: "Дыхание дракона"
 ZHI_the_dragon_breath_desc: "С решением вопросов, связанных с доспехами, настало время увеличить количество и мощность наших нынешних ружей."
 ZHI_dragon_king_of_the_seas: "Король морей Дракона"
 ZHI_dragon_king_of_the_seas_desc: "Теперь, когда мы спланировали потенциал нашего флота, мы должны начать строительство великого флагманского комплекса, чтобы быть на переднем крае всех наших военно-морских сражений."
 ZHI_masters_yellow_sea: "Мастеры Желтого моря"
 ZHI_masters_yellow_sea_desc: "И наконец, у нас есть флот, достойный китайского государства! Настало время для того, чтобы мир опасался нашей мощи и почувствовал гнев тысячи громовых пушек или быстрых сдвигов наших подводных лодок. Сегодня начинается новая эра в китайской истории, слава."
 ZHI_fifth_zhili_fengtian_war: "Пятая Жили-Фенгтианская война"
 ZHI_fifth_zhili_fengtian_war_desc: "Возможно, это величайшая война, с которой мы когда-либо столкнемся, хотя это пятая война такого рода, последствия проигрыша имеют катастрофические последствия."
 ZHI_our_japanese_ally: "Наши японцы"Friends""
 ZHI_our_japanese_ally_desc: ""
 ZHI_japan_supports_us: "Япония поддерживает нас"
 ZHI_japan_supports_us_desc: ""
 ZHI_japan_supports_fengtian: "Япония поддерживает Фенгтиан" #What a bunch of losers
 ZHI_japan_supports_fengtian_desc: ""
 ZHI_the_great_rivalry_is_won: "Великая цивилизация - Вон." #Zhili Gang
 ZHI_the_great_rivalry_is_won_desc: "Отпразднуем, потому что мы победили, величайший триумф на Клике Жили, парады будут проходить по всей стране, многочисленные фейерверки зажгут небо, и сегодня, и каждую ночь после этого, мы будем известны как истинные лидеры Китая!"
 ZHI_what_now: "Что будет дальше?"
 ZHI_what_now_desc: "Переворот надвигается..."
 ZHI_a_new_dawn_for_zhili: "Новый рассвет для Жили"
 ZHI_a_new_dawn_for_zhili_desc: "Нефритовый маршал пропал, ополченцы нового Военачальника бродят по улицам и деревням, кто может сказать, к чему приведет это изменение?"
 ZHI_jade_marshal_prevails: "Нефритовый маршал Превилс"
 ZHI_jade_marshal_prevails_desc: "Клика Жили оправдала свой предательский характер, но опять же маршал-нефрид одержал триумф."
 ZHI_some_things_never_change: "Некоторые вещи никогда не меняются"
 ZHI_some_things_never_change_desc: "Он лишился своей власти, его люди казнили, и без армии за ним теперь стоит один."
 ZHI_arrest_disloyal_officers: "Арестовать дисплойских офицеров"
 ZHI_arrest_disloyal_officers_desc: "Принимая во внимание недавние события, маршал Джейд счел нужным вывести из игры некоторых офицеров нашей армии, хотя это может не нравиться армии, это принесет стабильность на будущее."
 ZHI_our_greatest_glory: "Наша величайшая Слава..."
 ZHI_our_greatest_glory_desc: "Хаос, вот к чему это пришло. Некоторые верят, что другой игрок тихо ждал такой возможности. Мы просто должны увидеть."
 ZHI_is_not_in_ever_falling: "Это не никогда не падёт..."
 ZHI_is_not_in_ever_falling_desc: "За открытой и официальной политической сценой кто-то заключает соглашения о возвращении республики в лучшее время, когда насилие не было единственным фактором, влияющим на ее власть."
 ZHI_but_in_rising_every_time_we_fall: "Но каждый раз, когда мы падаем,"
 ZHI_but_in_rising_every_time_we_fall_desc: "Као Кун объявил новое президентское правительство!"
 ZHI_power_cement: "Силу маршала"
 ZHI_power_cement_desc: "Никто не может править Китаем, как Ву Пейфу, это известно, мы должны обеспечить, чтобы он оставался лидером как можно дольше, чтобы наша власть еще больше гарантировала, что мы объявим новое правительство Бейянга, которое может сильно разозлить окружающие нас государства, но у них нет возможности остановить нас."
 ZHI_no_turning: "Нет возврата сейчас"
 ZHI_no_turning_desc: "С антагонизацией других китайских кликов, достигающих точки кипения, наконец, настало время вновь взять то, что по праву принадлежит нам, Китаю."
 ZHI_beiyang_centralise: "Централизация правительства Бейянга"
 ZHI_beiyang_centralise_desc: "Настало время для того, чтобы мы вывели могущественные армии Жили, сейчас под руководством правительства Бейянга, наши силы воевали и готовы к войне, чтобы вернуть землю, которую мы так упорно сражались на протяжении многих лет."
 ZHI_no_kyakhta: "Больше никаких Kyahta Agreements!"
 ZHI_no_kyakhta_desc: "Кьяхтское соглашение было ошибкой, предоставление монголовской автономии только закончилось тем, что они захватили еще больше земель в Китае, чем было первоначально согласовано, пришло время дать им ясное требование о подчинении."
 ZHI_white_deal: "Защитный пакт с белыми"
 ZHI_white_deal_desc: "Белые выступают против советской угрозы на севере почти в одиночестве, и в будущем мы будем выступать за то, чтобы помочь белым победить Советов и, возможно, установить дружественное правительство в России. Во-первых, мы попросим их помочь нам в обмен на нашу помощь."
 ZHI_admin_expansion: "Крушить Зонгчан"
 ZHI_admin_expansion_desc: "Зонгчан представляет собой худшие эксцессы периода военного барона. Он и штат Анхуй на юге должны быть прекращены."
 ZHI_die_kmt: "Уничтожить южную претенду"
 ZHI_die_kmt_desc: "Клики и правительства на нашей южной границе - единственное, что сидит между нами и полным господством Китая, пришло время изменить это."
 ZHI_yunnan_offer: "Предложение для Длинного Юна"
 ZHI_yunnan_offer_desc: "Лонг Юн однажды заявил о своей верности правительству Бейянга в Китае, хотя он уже давно один, и может принять приглашение вернуться или выступить, если мы позволим ему сохранить контроль над районом Юньнань."
 ZHI_ma_attack: "Уничтожить маму"
 ZHI_ma_attack_desc: "Ма-Кликс на западе слишком долго был шипом на стороне всего Китая, и они должны быть ликвидированы как можно скорее."
 ZHI_tibet_is_china: "Покорить тибетцев"
 ZHI_tibet_is_china_desc: "Тибет всегда будет частью китайского государства, и мы напомним им об этом, чтобы они не забыли."
 ZHI_Sichuan_offer: "Предложение для Дэн Сихоу"
 ZHI_Sichuan_offer_desc: "Дэн Сихоу однажды заявил о своей верности правительству Бейянга, хотя он уже давно один, и, возможно, примет приглашение присоединиться к нему, если мы позволим ему сохранить контроль над Сычуаньским регионом."
 ZHI_no_imperialism: "Против иностранного империалиста!"
 ZHI_no_imperialism_desc: "Цин отдал все больше и больше земель в последние годы своего ужасного правления, и мы ратифицируем это и требуем, чтобы иностранные державы вернули то, что по праву принадлежит нам сейчас, когда у нас есть сильное правительство."
 ZHI_shanxi_traitors: "Уничтожить предателей Шанкси"
 ZHI_shanxi_traitors_desc: "Ян Сишан когда-то был одним из нас, частью правительства Бейянга, он предал эту причину править Шаньси для себя, пришло время напомнить эгоистическому ублюдку, который правит Китаем."
 ZHI_cao_constitution: "Новая конституция"
 ZHI_cao_constitution_desc: "Если мы хотим направиться к более открытой и демократической республике, нам понадобится новая конституция, чтобы сделать это... число демократии еще не определено."
 ZHI_elected_officials: "Избранные должностные лица"
 ZHI_elected_officials_desc: "Многие люди в нашей стране не любят это и верят, что мы должны были избрать региональных администраторов... это хорошая идея?"
 ZHI_election: "Выборы"
 ZHI_election_desc: "Наконец, выборы, за которые проголосовал народ, за народ, наступают годы и станут одним из величайших и величайших событий в истории Китая со времени провозглашения новой республики Саном Ятсеном."
 ZHI_lfp: "Наследие Лиги"
 ZHI_lfp_desc: "Во время Второй Жили-Фенгтианской войны Сунь Чуанфан создал Лигу пяти провинций на юге Китая, чтобы централизовать власть вокруг себя. В конце концов, Лига упала, но ее великий лидер выжил. Память об этом государстве никогда не должна увянуть, даже в наши последние годы, символ Лиги будет висеть на нашем флаге."
 ZHI_no_imperialists: "Выбросить иностранных должностных лиц"
 ZHI_no_imperialists_desc: "Иностранные паразиты поражают каждый город и административное здание, которое они могут. Это западное влияние нужно подавить, если мы хотим поставить себя на трон мира. Принудительная депортация должна будет сделать это до сих пор, более стойкие иностранцы предстанут перед судом за измену государству."
 ZHI_nanking_warlord: "Война Нанкина"
 ZHI_nanking_warlord_desc: "Будучи бывшим лидером Лиги пяти провинций, Чуаньфан был известен как"Nanking Warlord". Known for his ruthless attacks and cunning tactics, he helped stem the tide of the Northern Expedition when the Zhili Clique's situation was heading for its absolute lowest point. We must remind the people of who their leader is and what he is capable of."
 ZHI_closed_borders: "Закрыть народ"
 ZHI_closed_borders_desc: "Теперь, когда мы наконец избавились от крыс в наших стенах, пришло время убедиться, что они никогда не вернутся."
 ZHI_private_army: "Частная армия Солнца"
 ZHI_private_army_desc: "С тех пор, как Лига пяти провинций, большая сила солдат Жили собралась к знаменателю Сунь Чуанфанга и поклялась лично ему в верности."
 ZHI_eternal_warlord: "Вечный Воин Китая"
 ZHI_eternal_warlord_desc: "Убить или быть убитым, это философия, которой мы живём. Война за Китай только началась и не закончится, пока мы не добьемся полного господства над всеми слабыми государствами. Ветер дует, дождь падает, сильная добыча на слабых. Всё так, как должно быть."
 ZHI_beiyang_state: "Централизация государства Бейян"
 ZHI_beiyang_state_desc: "Сильный штат требовал сильного лидера. У нас есть оба этих человека. Теперь, чтобы пожинать то, что мы посеяли. Китай - это наше предназначение."
 ZHI_shanxi_conquest: "Голова Яна Сишана"
 ZHI_shanxi_conquest_desc: "Ян Сишхан в последний раз предал свою страну."splendid" isolation he'll be safe from the coming storm. He is wrong."
 ZHI_get_zongchang: "Голова Чжана Цзончана"
 ZHI_get_zongchang_desc: "Зонгчан представляет собой худшие эксцессы периода военного барона. Он и штат Анхуй на юге должны быть прекращены."
 ZHI_south_weakness: "Взрыв южной слабости"
 ZHI_south_weakness_desc: "КМТ продемонстрировала свою слабость. Парламентаризм Чианг Кай-Шека слаб, мы раздавим южные притворные штаты всего за несколько недель."
 ZHI_steppe_conquest: "Прижмите степку к колену"
 ZHI_steppe_conquest_desc: "Северная граница Китая всегда создавала проблему для государства с момента образования Китая под династией Ся."
 ZHI_steppe_resist: "Разберись с Сопротивлением"
 ZHI_steppe_resist_desc: "Доказательство того, что эта степь является более стойкой, чем ожидалось раньше, помогает нам оккупаться, и, возможно, было бы мудро потратить некоторое время на борьбу с этим жалким повстанцем."
 ZHI_hui_conquest: "Осквернять земли хуи"
 ZHI_hui_conquest_desc: "Мусульмане на нашем западе не знают ценностей своей родины, и мы должны научить их тому, что мы делаем с предателями нашей великой и славной нации."
 ZHI_enforce_values: "Применить китайские ценности Хана"
 ZHI_enforce_values_desc: "Мы должны исправить это, отправив их в специальные лагеря перевоспитания, где они будут."taught" to follow Chinese values."
 ZHI_yunnan_conquest: "Голова Длинного Юн"
 ZHI_yunnan_conquest_desc: "Лонг Юн предатель китайского государства и должен быть наказан за свои действия."
 ZHI_sichuan_conquest: "Голова Дэн Сихоу"
 ZHI_sichuan_conquest_desc: "Дэн Шоу не отличается от других диссидентов, мы уничтожим его так называемую Сычуаньскую Клику и поднимем его голову на кол!"
 ZHI_tibet_conquest: "Удаление тибетского плато"
 ZHI_tibet_conquest_desc: "Тибетская независимость продлится достаточно долго! Время резать и сжигать их здания, сломать основы их зданий и казнить их лидеров. Это время Китая."
 ZHI_white_conquest: "Противостояние белым"
 ZHI_white_conquest_desc: ""Белые" на севере контролируются. "Внешняя Манчжурия" мы должны вернуть наши потерянные земли и выгнать этих империалистических свиней!"
 ZHI_imperial_conquest: "Уничтожить иностранных нарушителей"
 ZHI_imperial_conquest_desc: "Теперь, когда мы держим самые важные части Китая, настало время вернуть земли, которые Цин так трусливо отдал."
 ZHI_imperial_propaganda: "Антиимпериалистическая пропаганда"
 ZHI_imperial_propaganda_desc: "Они пришли сюда, чтобы воспользоваться нами, они никогда не были здесь, чтобы помочь, они требовали портов и концессий, в то время как наш народ голодал и погружался в экономический крах, нет причин проявлять к ним милосердие."
 ZHI_sovereignty: "Китайский суверенитет"
 ZHI_sovereignty_desc: "Китай воцарился прежде всего, и это скоро будет известно во всем мире."
 ZHI_savarkar_support: "Предложение для Саваркара"
 ZHI_savarkar_support_desc: "У Саваркара, лидера Временного правительства Индии, есть те же цели, что и у нашего правительства."
 ZHI_world_stage: "Наше место на мировой сцене"
 ZHI_world_stage_desc: "Пришло время занять наше место среди великих держав мира."
 ZHI_alliances: "Международные альянсы"
 ZHI_alliances_desc: "Если мы хотим выжить как государство, нам нужны союзники за границей."
 ZHI_support_whites: "Поддержка белых"
 ZHI_support_whites_desc: "С принятием нашего пакта о взаимной обороне белыми мы наконец-то сможем расширить нашу поддержку, снабжая наших друзей в России оружием."
 ZHI_anti_soviet: "Антисоветский альянс"
 ZHI_anti_soviet_desc: "Когда Китай под нашим ботинком, наконец-то пришло время помочь белым победить Советов раз и навсегда, наша северная граница будет в безопасности, и у белых не будет причин ничего делать, кроме как помогать нам."
 ZHI_further_improvement: "Дальнейшее улучшение"
 ZHI_further_improvement_desc: "Настало время решить различные экономические, технологические и образовательные проблемы в Китае."
 ZHI_fund_a_new_project: "Фонд Новые проекты"
 ZHI_fund_a_new_project_desc: "Открывая новые возможности для наших соотечественников, мы должны будем приложить гораздо больше усилий, чем просто вложить дополнительные средства в наши обычные программы, чтобы расширить их."
 ZHI_a_new_military_academy: "Новая военная академия"
 ZHI_a_new_military_academy_desc: "Настало время заложить основы для новой военной академии в Джинане, и центральная позиция Джинана должна помочь в продвижении большего числа людей в сторону подготовки солдат, и, надеюсь, по мере роста престижа Академии мы сможем расширить ее, включив в нее не только военную теорию."
 ZHI_better_schools: "Лучшие школы"
 ZHI_better_schools_desc: "Для этого мы начнем с введения классической литературы в китайских классах и пригласим поэтов и писателей по всей стране для чтения лекций."
 ZHI_better_schools2: "Расширение учебной программы"
 ZHI_better_schools2_desc: "Расширение учебной программы китайских школ и университетов будет во многом способствовать расширению не только нашего резерва образованных специалистов, но и нашего понимания новых технологий."
 ZHI_expand_shandong_university: "Расширение Пекинского университета"
 ZHI_expand_shandong_university_desc: "Университет Шаньдун является одним из самых престижных в Китае, и мы должны гордиться этим и расширить этот университет, включив в него больше классов, чем когда-либо прежде, принимая студентов со всей страны для обучения искусству и наукам Китая."
 ZHI_education_army: "Образовательные стандарты в армии"
 ZHI_education_army_desc: "Армия составляет огромную часть нашего общества, это означает, что если мы хотим повысить уровень грамотности в армии, то мы по существу расширяем их по всей стране."
 ZHI_mil_funding: "Расширение военного финансирования"
 ZHI_mil_funding_desc: "Департаменты НИОКР в армии испытывают острую нехватку финансовых средств, и это должно быть ратифицировано, чтобы мы могли приобрести больше оборудования на местах."
 ZHI_mil_industry: "Военная индустриализация"
 ZHI_mil_industry_desc: "Увеличение производства оружия и транспортных средств любого рода является первоочередной задачей для правительства."
 ZHI_industrial_rev: "Китайская промышленная революция"
 ZHI_industrial_rev_desc: "Настало время индустриализации остальной части Китая, поскольку, хотя Манчжурия относительно богата, остальная часть шианцев, включая провинцию Анхуй и окружающие ее земли, к сожалению, не индустриализована."
 ZHI_mass_production: "Методы массового производства"
 ZHI_mass_production_desc: "Стандартизация методов, используемых для производства нашей продукции и поставок, будет иметь решающее значение для наших усилий по повышению эффективности производства на наших заводах, а также для обновления используемых машин."
 ZHI_efficiency: "Стандарты эффективности"
 ZHI_efficiency_desc: "На фабриках всегда нужен квалифицированный работник, чтобы наши производственные линии работали эффективно. Мы будем продвигать тех, кто делает все, что в их силах, и наказывать тех, кто не делает этого. Это должно побудить наших рабочих работать усердно и чувствовать, что они заработали свою зарплату."
 ZHI_south_industry: "Промышленные комплексы на юге"
 ZHI_south_industry_desc: "С захватом Южного Китая пришло время увеличить и индустрию здесь."
 ZHI_qinghai_industry: "Промышленное развитие в Цинхайе"
 ZHI_qinghai_industry_desc: "Одно из более пустынных мест в Китае, Цинхай, теперь нуждается в индустриализации, чтобы догнать Восточный Китай."
 ZHI_industry_giant: "Промышленный гигант"
 ZHI_industry_giant_desc: "Китай в ближайшие несколько десятилетий станет мировой державой, нам удалось зажечь взрыватель, который резко поднимет китайскую индустрию и заинтересует ее интересы."

 ###SPIRITS###
 ZHI_traitors: "Клика предателей"
 ZHI_traitors_desc: "Клика Жили была создана из очень размытых отношений между ее членами, что привело к тому, что ее члены стали более склонны к предательству и лжи, чтобы получить личную выгоду."
 ZHI_traitors2: "Клика предателей"
 ZHI_traitors2_desc: "Клика Жили была создана из очень размытых отношений между ее членами, что привело к тому, что ее члены стали более склонны к предательству и лжи, чтобы получить личную выгоду."
 ZHI_fallen_grace1: "Падение от Грейс"
 ZHI_fallen_grace1_desc: "Когда-то мы были на переднем крае китайского господства, но это было давно, несколько неудач и войн в пользу наших врагов привели к тому, что мы оказались в тяжелом положении."
 ZHI_fallen_grace2: "Вернуться на ноги"
 ZHI_fallen_grace2_desc: "Мы несколько оправились от опасностей нашего прошлого."
 ZHI_jap_grace2: "Благодать Крейна"
 ZHI_jap_grace2_desc: "Немногие могут совместиться с нашей мощью, меньшее еще может совпадать с нашим умом и точностью."
 ZHI_jade_marshall: "Маршал-нефрит"
 ZHI_jade_marshall_desc: "Ву Пейфу, нефритный маршал, мастер и лидер Жили Клик, возможно, величайший стратег в Китае, и никто с умом в нужном месте не осмелился бы противостоять его военному мастерству, если бы мы оказались на войне, он непременно привел бы нас к победе."
 ZHI_japanese_backing: "Японская поддержка"
 ZHI_japanese_backing_desc: "При экономической и промышленной поддержке со стороны японского правительства у нас есть чёткое преимущество по отношению к другим кликам, длиннее, чем на суше, хотя это не наша любимая позиция, пока мы должны тянуть время и прекращать наши связи, когда придет время."
 ZHI_japanese_backing2: "Японская поддержка"
 ZHI_japanese_backing2_desc: "При экономической и промышленной поддержке со стороны японского правительства у нас есть чёткое преимущество по отношению к другим кликам, длиннее, чем на суше, хотя это не наша любимая позиция, пока мы должны тянуть время и прекращать наши связи, когда придет время."
 ZHI_subsidies: "Субсидии для новых компаний"
 ZHI_subsidies_desc: "Мы начали финансировать небольшие компании, и как таковые мы получили достойный приток новых владельцев заводов, спонсируемых государством и другими."
 ZHI_jap_funds: "Японские фонды"
 ZHI_jap_funds_desc: ""
 ZHI_jap_corps: "Японские корпорации"
 ZHI_jap_corps_desc: ""
 ZHI_thunder_rains: "Артиллерийская подготовка"
 ZHI_thunder_rains_desc: ""
 ZHI_jaden_jewel: "Джаден Джуэль из Китая"
 ZHI_jaden_jewel_desc: "Мы улучшили наши провинции и целую клику, до такой степени, что многие стали называть Клику Жили как"Jaden Jewel" of China, in reference to our leader."
 ZHI_well_equipped: "Хорошо экваториальная армия"
 ZHI_well_equipped_desc: "Хотя наша армия, возможно, не имеет наиболее компетентного руководства на уровне подразделений, использованное оборудование является исключительным и будет весьма полезным."
 ZHI_well_led: "Хорошо налаженная армия"
 ZHI_well_led_desc: "В то время как в некоторых областях у нас отсутствует оборудование, нельзя ставить под сомнение компетентность нашего руководства."
