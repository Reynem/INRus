 ### DESCRIPTION ###
 ZHI_FUHRERREICH_DESC: "Ву Пейфу является китайцем, который, несмотря на то, что ему не нравится союз с японцами, считает, что союз с Японией необходим для выживания его Клика. Он, как и многие другие государства в Китае, находится во многих войнах и имеет ветеранскую силу из многих солдат и генералов, но ему не хватает хорошей промышленности. Ннн Фенгтиан, соперник Жилийской Клики, лежит на севере, насмехается над ними на каждом шагу. Война надвигается... и Zhili Clique будет ее победителем."

 ### EVENTS ###
 zhi.1.t: "Далеко до восточной части 1"
 zhi.1.d: "В 1917 году, после того, как Цахилианская клика стала одним из офицеров бывшего правительства Бейянга, которая не привела к нашей клике, в частности, у нас были очень дальние связи между ее членами. Наше путешествие к величию началось с лидерства Фэн Гузханга. В 1917 году, когда дядя Джан Цюньхонз бежал в Пекине, чтобы вернуть Цин династию на трон, Фэн Гужан, который в это время был исполняющим обязанности вице-президента республики, был приведен к присяге. После этого, Анхуай Цикэ (вместе с Дуаном Цируем) и Зилианская армия вырвалась в Китай в качестве доминирующих сил. В конце 1918 года появился термин "Цин Гужан", и он собирался умереть в 1919 году."
 zhi.1.a: "Часть 2"
 zhi.101.t: "Далеко до восточной части 2"
 zhi.101.d: "Во время второй войны в Жили-Фенгтиане остались нестабильные триумвираты Фэна (Гуоминджун), Дюана (Аньхуи) и Чжана (Фентиана). ~ ~ ~ ~ theng havthian lique lique that that have that that have that that that that that that that that that that that that that that that that that that that that that that that thing that that that that that that that that that that that that that that that that moding that that the that the that that the that the that the th the th the that the that the that the that that th th th th th th th th th th th th th th th th th th th th th th th th it th th th th th th th th th it it it it th th th th th th th it th th th th th th th th th it th th th th th th th th it th th th it it th it it it th it it it it it it it it it it th th th th it it it th th th th th th th th th th th th th th it th th th th it th it it it it it it th"
 zhi.101.a: "Ни дюйма земли нашим врагам!"
 zhi.2.t: "Военный комитет"
 zhi.2.d: "Через несколько дней наш военный комитет примет решение о плане наших будущих наступательных действий."
 zhi.2.a: "Решение должно быть принято"
 zhi.3.t: "Комитет начинает свою работу"
 zhi.3.d: "Все наши офицеры собрались в нашем военном штабе, чтобы, наконец, принять решение по доктрине войны, которая должна быть использована в предстоящей войне против Фенгтианской клики. Два плана, один из которых был предложен Сунь Чуанфангом, Ву Пейфу и Доверенным генералом, а другой - Ву Пейфу. Нн Сун Чуаньфаном, предполагает, что если нам удастся получить более высокое оружие с более разрушительным потенциалом, чем у Фенгтианской клики, то у них не будет шансов против нашей армии. Ву Пейфу, однако, считает наше оружие второстепенным по отношению к руководству наших войск, и считает, что мы должны сосредоточиться на обеспечении более жесткой власти в нашей армии, особенно с предательством Фэна Юксиана, все еще живого в памяти."
 zhi.3.a: "Выбери план Сан Чуанфанга без помех."
 zhi.3.b: "План Су Чуаньфанга отменяется Ву Пейфу!"
 zhi.3.c: "Комитти падает на бессмысленные споры и не может принять решение..."
 zhi.4.t: "Организация военизированных формирований"
 zhi.4.d: "В сельской местности, внутри нашего могучего государства, есть банды боевиков, которые не находятся под нашим непосредственным контролем и которые, хотя и стремятся к лучшему для клики Жили, непредсказуемы и не поддаются легкому контролю."
 zhi.4.a: "Включите солдат, казните офицеров."
 zhi.4.b: "Заключите в тюрьму лидеров и разгоните ополчение, они нам не помогут."
 zhi.4.c: "Офицеры могли бы оказаться полезными, разогнав ополчения"
 zhi.5.t: "Методы обучения в Японии"
 zhi.5.d: "Благодаря знанию наших японских союзников мы смогли значительно улучшить положение в нашей армии. Это должно быть наиболее полезным в наших будущих войнах."
 zhi.5.a: "Через дисциплину приходит свобода."
 zhi.6.t: "Напомни им, почему мы сражаемся"
 zhi.6.d: ""We are surrounded by enemies on all sides, by foreign imperialists, traitors of the Beiyang Government, former brothers in arms now turned against us. All we have, my countrymen and people of the Zhili state, is ourselves and the comradery between us. Let that go and what are we left with? Happiness? No. Fear. Fear and despair. Without your brothers in arms, the fight for freedom would be without hope and all would be lost. The Zhili Clique exists, not as a reminder of what the Beiyang Government should have been, but what the people of China can be! We are not a group of unorganised rascals, far from it. We're the Zhili Clique, masters of all doctrines of war and instruments of battle! So, if you have nothing to fight for. Fight for your brothers. FIGHT FOR CHINA!"\n\nSo went the speech of Wu Peifu this morning outside the Zhili headquarters in Hefei. His men were quick to cheer, even if the words were not of the most profound kind."
 zhi.6.a: "Грустная горечь предстоящей войны стала еще более яркой, хотя бы незначительной."
 zhi.7.t: "Флаг Жили"
 zhi.7.d: "Не секрет, что наш текущий флот жалкий, нам нужен крупный корабль, который возглавит наш флот и принесет страх нашим врагам, строительство будет завершено как можно скорее в следующем году."
 zhi.7.a: "Год!"
 zhi.8.t: "Девушка вуага Ян Уанга"
 zhi.8.d: "После года подготовки наш новый флаг наконец-то готов к использованию! «Янг Уанг», названный в честь императора нефритов китайского мифа, имеет 145 метров в длину и носит 8 меньше 50 пушек калибра вместе со своими более тяжелыми 3фунтными пушками."
 zhi.8.a: "Это, конечно, запугает наших врагов!"
 zhi.9.t: "Пятая Жили-Фенгтианская война"
 zhi.9.d: "Великая извилистость, которая существует между Жилийской кликой и Фенгтианской кликой на севере, наконец-то пришла в голову. Поскольку движение Фенгтианцев вдоль границы превратилось в полное раздутое нападение на наши передние позиции, теперь есть только один способ покончить с этим раз и навсегда. Но конец Фенгтианской клики уже близок."
 zhi.9.a: "Слава клике Жили!"
 zhi.9.b: "Но мы не готовы!"
 zhi.200.d: "Проклятая клика Жили вынудила бывших бандитов в нашем славном царстве вернуться к их прежней оккупации."
 zhi.200.a: "Предатели!"
 zhi.201.t: "Клика Жили просит об оказании помощи"
 zhi.201.d: "Согласившись с Чжили Клик до начала пятой Жили-Фентийской войны, они ожидают, что мы отправим им помощь в виде поставок."
 zhi.201.a: "Мы должны выполнить наше соглашение, послать им оружие!"
 zhi.201.b: "Конечно, мы должны увеличить наше влияние в Китае."
 zhi.201.c: "Заставить врага японцев - это последнее, чего мы хотим."
 zhi.202.t: "Британцы послали нам оружие!"
 zhi.202.d: "Британцы продемонстрировали свою поддержку, предоставив нам очень необходимое оружие."
 zhi.202.a: "Сегодня мы вместе с иностранным империалистом."
 zhi.203.t: "Британцы послали нам и добровольцев, и оружие!"
 zhi.203.d: "Британцы продемонстрировали свою поддержку, предоставив нам очень необходимое оружие и людей."
 zhi.203.a: "Сегодня мы вместе с иностранным империалистом."
 zhi.204.t: "Британцы отклонили нашу просьбу!"
 zhi.204.d: "Похоже, единственный истинный союзник, на которого может положиться Клик, - это он сам."
 zhi.204.a: "Мы остаемся одни... как всегда."
 zhi.205.t: "Жили Клик просит британских офицеров-добровольцев"
 zhi.205.d: "Мы получили сообщение от самого маршала Джейда, что Жили Клик нуждается в иностранных офицерах, чтобы подготовить новые войска для фронта."friend"?"
 zhi.205.a: "Пошлите того, кто свободен."
 zhi.205.b: "Это только пустая трата времени."
 zhi.206.t: "Британцы предоставили нам запасных офицеров!"
 zhi.206.d: "С ними мы наконец-то сможем подготовить наши новые войска к поле."
 zhi.206.a: "У нас наконец-то может быть настоящая армия..."
 zhi.207.t: "Британцы отклонили нашу просьбу!"
 zhi.207.d: "Наша просьба была отклонена всего лишь четырьмя словами в сообщении, которое было отправлено назад"Waste of our time"."
 zhi.207.a: "Скоро мы научим их уважать."
 zhi.208.t: "Блокада Желтого моря?"
 zhi.208.d: "Лидер Жили Клик и маршал Ву Пейфу предложили заблокировать Желтое море, чтобы остановить транспортировку всех жизненно важных товаров из внешних источников в Фенгтиан, хотя это звучит как отличная идея на бумаге, у нас могут быть проблемы с Фенгтианом, если они выиграют войну."
 zhi.208.a: "Приготовьте флот, мы верим в маршала Джейд."
 zhi.208.b: "Сообщите им, что мы не можем сделать это по этическим причинам."
 zhi.10.t: "Великое восстание окончено"
 zhi.10.d: "После многих лет постоянных войн мы наконец-то одержали победу над Фенгтианской Кликой."
 zhi.10.a: "Наконец-то всё кончено."
 zhi.11.t: "Неустанная тишина наполняет воздух"
 zhi.11.d: "С тех пор, как мы одержали победу над нашим величайшим врагом, мир и регулярные военные парады были проведены по всей столице Пекина, но в последние дни в стенах столиц правительства Бейян было необычайно нервозное чувство, может быть, это просто слухи, но некоторые сообщали о том, что видели массовые собрания в закрытых зданиях, странные ящики, прибывшие из негенетических провинций, и самое странное, новый флаг, распространяющийся по всему городу..."
 zhi.11.a: "Убедите персонал, что это не что иное, как слухи."
 zhi.11.b: "Брайб, убийство и допрос."
 zhi.12.t: "Кубок Сунь Чуаньфана"
 zhi.12.d: "Слухи оказались правдой: сегодня утром Сун Чуанфан перевел свою частную армию наемников и ветеранов Лиги пяти провинций из скрытых хранилищ, быстро захватив стратегические здания и оружейные склады в городе. Скоро вся столица находилась в полной изоляции с Ву Пейфу, окруженным войсками, лично возглавляемыми Солнцем, он решил сражаться с предателем, а не быть брошенным в сторону."
 zhi.12.a: "Ву Пейфу умирает в следующей битве..." # :(
 zhi.12.b: "...но он забирает с собой Сан Чуанфан." #Yay?
 zhi.13.t: "Арест Сунь Чуанфанга"
 zhi.13.d: "С помощью насилия мы наконец-то арестовали подавляющее большинство преступников в городе. Похоже, что все они были либо бывшими членами Лиги пяти провинций, либо наемниками, которые заплатили непосредственно из доходов Сунь Чуанфанга. Сегодня утром в 4 часа утра нашим войскам было сказано окружить дом Сунь Чуанфанга и арестовать его. Однако, похоже, он был заранее предупрежден о нашем подходе и смог собрать свои силы для последней демонстрации сопротивления."
 zhi.13.a: "Из всех людей, ты, я бы никогда не предала меня" #Heart = broken
 zhi.14.t: "Суд над Сунь Чуаньфангом"
 zhi.14.d: "Звонок звонит трижды перед заседанием суда. Солнце Чуанфанг, бывший лидер Лиги пяти провинций и доверенный протеже Ву Пейфу, был признан виновным в измене. Недолго после того, как его повесят на виселицу, хотя и не вместе с повешенными преступниками, как это обычно бывает, нет. Горы были расчищены для этого ужасного события, как просил Ву Пейфу. Пять долгих минут прошло, и все кончено. Он мертв. Ущерб, который понесет армию, и нацию в целом, еще предстоит увидеть, хотя его точно не будет хватать."
 zhi.14.a: "Он хорошо служил своей стране и навсегда останется в памяти как герой Китая." #Heart = double broken
 zhi.15.t: "Наша претензия правительству Бейянга"
 zhi.15.d: "Не так много лет назад мы были бесспорными правителями Китая, пришло время вернуть наш золотой век и ввергнуть Китай в эру процветания и могущества."
 zhi.15.a: "Правитель Китая - это я!"
 zhi.16.t: "Наша претензия правительству Бейянга"
 zhi.16.d: "Не так много лет назад мы были бесспорными правителями Китая, пришло время вернуть наш золотой век и ввергнуть Китай в эру процветания и могущества."
 zhi.16.a: "Праведные правители Китая вернулись."
 zhi.17.t: "Наша претензия правительству Бейянга"
 zhi.17.d: "Не так много лет назад мы были бесспорными правителями Китая, пришло время вернуть наш золотой век и ввергнуть Китай в эру процветания и могущества."
 zhi.17.a: "Праведные правители Китая вернулись."
 zhi.18.t: "Выборы"
 zhi.18.d: "Голосование было быстрым, при этом большая толпа собралась вокруг назначенных групп, которые точно знали, за кого голосовать."
 zhi.18.a: "Победа на выборах проста... с небольшой помощью."
 zhi.19.t: "Движение за выборную региональную администрацию"
 zhi.19.d: "Многие люди в нашей стране не любят это и верят, что мы должны были избрать региональных администраторов... это хорошая идея?"
 zhi.19.a: "Закон принят, и выборы начнутся прямо сейчас."
 zhi.19.b: "Это может вызвать проблемы с этими администраторами..."
 zhi.20.t: "Новая конституция"
 zhi.20.d: "Теперь, когда у нас есть полный контроль над управлением республики, нам нужно принять решение по конституции. Народ, конечно, жаждет демократии, как они это делали на протяжении многих лет. Должны ли мы уступить этим крикам о так называемой свободе?"
 zhi.20.a: "Дай людям то, что они хотят!"
 zhi.20.b: "Дайте людям то, что они хотят, но с небольшими страховками."
 zhi.20.c: "Президентский диктатор будет в порядке."
 zhi.21.t: "Возвращение к нашей прежней славе"
 zhi.21.d: "Китай расщеплен, разбит между военными кликами во всех направлениях, с некоторыми из них, возможно, можно вести переговоры, с другими - не столько. Только время покажет, кто присоединится к нашей славной нации в единой нации и кого нам придется отбросить вдоль пути. Прогресс не прекратится для всех."
 zhi.21.a: "Мы снова сделаем Китай великой нацией."
 zhi.22.t: "Китайцы требуют нашего порабощения."
 zhi.22.d: "Новое китайское правительство в Пекине требует, чтобы мы сложили оружие и присоединились к тому, что представляется очень жестоким и односторонним договором, в отличие от того, который был предоставлен нам в предыдущие годы."
 zhi.22.a: "Если это пощадит наших граждан..."
 zhi.22.b: "Мы никогда не сдадимся иностранным захватчикам!"
 zhi.23.t: "Монголы ответили, что они"rather die than surrender""
 zhi.23.d: "В довольно прямом письме монголы строго ответили, что соглашение, которое мы им дали, возмутительно и мобилизовано против нас. Они готовы к войне."
 zhi.23.a: "И мы отдадим его им."
 zhi.24.t: "Монголы на коленях"
 zhi.24.d: "Руководство Монголя решило, что, чтобы избавить граждан своей страны, они согласятся с нашим договором."
 zhi.24.a: "Они знают, что лучше для них."
 zhi.25.t: "Предложение правительства Бейянга"
 zhi.25.d: "Правительство Бейянга направило нам предложение, в котором предлагается пакт о взаимном ненападении, который освободит фронт и даст нам больше времени для того, чтобы сосредоточиться на более серьезной угрозе, советских, и может даже открыться для будущей китайской поддержки."
 zhi.25.a: "Замечательная идея!"
 zhi.25.b: "У нас достаточно поддержки."
 zhi.26.t: "Русский согласился"
 zhi.26.d: "Русские ответили, что они с радостью согласятся с таким предложением."
 zhi.26.a: "Еще один фронт освободился."
 zhi.27.t: "Русские отказались."
 zhi.27.d: "Русские считают, что у них достаточно поддержки, и поэтому они отклонили наше предложение."
 zhi.27.a: "Тогда нам придётся приглядывать за ними."
 zhi.28.t: "Правительство Бейянга предлагает интеграцию"
 zhi.28.d: "Правительство Бейянго предложило нам довольно интригующее предложение: оно предлагает нам присоединиться к их нации как к более широкому составу и, в свою очередь, сохранить контроль над регионом Юньнань в качестве регионального администратора."
 zhi.28.a: "Тогда я останусь у власти?"
 zhi.28.b: "Если они так хотят Юннана, они могут прийти и забрать его!"
 zhi.29.t: "Длинный Юн согласился"
 zhi.29.d: "Лонг Юн решил, что номинальное положение в законном правительстве Китая было бы предпочтительнее войны."
 zhi.29.a: "Отлично!"
 zhi.30.t: "Длинная юнь выступает против"
 zhi.30.d: "Юньнанский клик противостоит нашим требованиям и готовится к войне."
 zhi.30.a: "Ненадолго."
 zhi.31.t: "Правительство Бейянга предлагает интеграцию"
 zhi.31.d: "Правительство Бейянго предложило нам довольно интригующее предложение: оно предлагает нам присоединиться к их нации в качестве части большего целого и, в свою очередь, сохранить контроль над регионом Сычуань в качестве регионального администратора."
 zhi.31.a: "До тех пор, пока я сохраняю контроль над Сычуаном"
 zhi.31.b: "Как будто я когда-нибудь откажусь от контроля."
 zhi.32.t: "Дэн Шоу согласился."
 zhi.32.d: "Дэн Сихоу решил, что номинальное положение в законном правительстве Китая было бы предпочтительнее войны."
 zhi.32.a: "Хороший выбор"
 zhi.33.t: "Дэн Сихоу выступает против"
 zhi.33.d: "Клика Сычуань противостоит нашим требованиям и готовится к войне."
 zhi.33.a: "Он очень быстро пожалеет об этом решении."
 zhi.34.t: "Правительство Бейянга предоставило оружие!"
 zhi.34.d: "Правительство Бейянга, в рамках нашего предыдущего соглашения, прислало нам оружие, чтобы помочь нам в борьбе с советскими войсками!"
 zhi.34.a: "Наши друзья на юге становятся все более полезными."
 zhi.35.t: "Правительство Бейянга предлагает антисоветский альянс"
 zhi.35.d: "Правительство Бейянга предполагает, что мы могли бы лучше защитить себя и занять свое непристойное место в Москве, если бы нам помогла китайская нация, что, несомненно, дало бы нам огромное преимущество против наших врагов и, возможно, будущих уз, которые могли бы завести как российскую, так и китайскую нации в золотой век сотрудничества."
 zhi.35.a: "Со всем Китаем на нашей стороне, мы не можем проиграть!"
 zhi.35.b: "Мы не смеем угрожать нашим нынешним сторонникам таким соглашением."
 zhi.36.t: "Русские согласились!"
 zhi.36.d: "Новая власть поднимется в виде временно названных"Anti-Soviet Alliance", which will perhaps have to be renamed once the Soviet menace is destroyed. For now, this is a momentous occasion and one that should strike fear into our enemies."
 zhi.36.a: "Пришло время уничтожить социалистическую угрозу!"
 zhi.37.t: "Русские отключились."
 zhi.37.d: "Сегодня мы получили печальную новость о том, что русские не разделяют наше видение альянса, объединяющегося против Советов."
 zhi.37.a: "Разочарование"
 zhi.38.t: "Мир будет бояться нашей силы еще раз!"
 zhi.38.d: "Давным-давно имя"China" once struck fear into the hearts of Kings and Emperors far and wide, now it is but a fraction of what it once was. This will not do. We shall remake the might of China under the rule of Sun Chuanfang, the great Warlord and leader of the new Chinese nation! Hail the Nanking Warlord! Hail Sun!"
 zhi.38.a: "Дракон рычит!"
 zhi.39.t: "Монгольское сопротивление"
 zhi.39.d: "Наша оккупация Монголии не ушла"quite" as expected, with the military general Khatanbaatar escaping our grasp and recruiting what amounts to a small army, raiding supply lines going to and from Mongolia, steadily wearing our forces down, who can say how long we'll be able to hold out?\nThese nomadic barbarians have already thrown off Chinese occupation twice, if we don't act fast we WILL be the third."
 zhi.39.a: "Сколько? 2 ТЫСЯЧИ? Как!"
 zhi.40.t: "Предложение от Большого Маршала"
 zhi.40.d: "Умная памятка - очень умная памятка Гиахахахалкалмуар... Калмуар очень хорош, большой THIGHS. Hphms. (Если вы видите это, мне очень жаль) отладчик здесь, Wtf я читаю"
 zhi.40.a: "Упс."
 zhi.41.d: "Вот уже много лет, наш величайший соперник Фенгтианский Клик сидит на нашей границе, хвастаясь нами каждый день. Теперь мы готовы. Мы дадим им войну, в отличие от других. Огонь и бурный камень, артиллерийские снаряды с небес, как гром. Прилив поворачивается... и Жили Клик пожинает свои дары."
 zhi.42.d: "Вот уже много лет, наш величайший соперник Жили Клик сидит на нашей границе, хвастаясь нами каждый день. Теперь мы готовы. Мы дадим им войну, в отличие от других. Огонь и бурный камень, артиллерийские снаряды с небес, как гром. Прилив поворачивается... и Фенгтианская клика пожинает свои дары."
 zhi.41.a: "Пришло время вновь занять наше место в Китае!"
 zhi.41.b: "Мы отпустим время и подождем более подходящий момент."
 zhi.209.d: "Жили нужны оружие в войне за китайское превосходство, и, поскольку мы заявили о нашей поддержке их, они сочли нужным запросить материальную поддержку."
 zhi.209.a: "Принадлежности и материалы будут необходимы во время войны."
 zhi.209.b: "Похоже, это не так уж и важно."
 zhi.210.d: "В Желтом море расположен большой флот кораблей, которые останавливают большинство, если не все, наших конвоев."
 zhi.210.a: "Черт побери, японцы!"
 zhi.211.d: "Наша просьба была удовлетворена, и при поддержке Японии у Фенгтиана нет шансов."
 zhi.211.a: "Надежно, как всегда"
 zhi.212.d: "Мы отклонили нашу просьбу."
 zhi.212.a: "Разочаровывающе, но не неожиданно"
 zhi.213.d: "Полная партия оружия прибыла сегодня в гавань Циндао, и ее быстро доставили на передние линии."
 zhi.213.a: "Отлично."
 zhi.214.d: "Наш запрос на оружие из Японии был отклонен."
 zhi.214.a: "Жаль, но не совсем неожиданно."
 zhi.250.t: "Китайцы требовали, чтобы мы покинули Китай!"
 zhi.250.d: "Новое правительство Китая, бывшая клика Жили, потребовало, чтобы мы немедленно покинули наши колонии в Китае и, в свою очередь, передали их"rightful" government."
 zhi.250.a: "Если они так хотят их, они могут прийти и забрать их!"
 zhi.250.b: "Китайцы сильнее, чем когда-либо, смотреть им в глаза было бы виртуальным самоубийством."
 zhi.251.t: "Британцы сопротивляются!"
 zhi.251.d: "Британцы решили встать на свою позицию и, кажется, не сдадут свои территории в ближайшее время."lease" end."
 zhi.251.a: "Тогда у нас нет выбора, кроме как захватить колонии силой."
 zhi.251.b: "Мы не готовы к войне с англичанами."
 zhi.252.d: "После долгих дебатов британцы подчинились нашим требованиям."
 zhi.252.a: "Отличные новости"
 zhi.253.d: "Столкнувшись с противодействием британского народа, китайцы решили сбежать вместо того, чтобы сражаться."new China" isn't much different from the old one after all."
 zhi.253.a: "Жалкое зрелище"
 zhi.254.d: "Пекин, столица бывшей Китайской Республики, теперь находится в руках ее мошенников, и наконец, у нас вновь есть столица, достойная нашего великолепия."
 zhi.254.a: "Мастеры Китая вернулись на свое законное место."
 zhi.255.d: "Новое правительство Китая, бывшая клика Жили, потребовало, чтобы мы немедленно покинули наши колонии в Китае и, в свою очередь, передали их"rightful" government."
 zhi.255.a: "Этот вопрос должен быть решен во Франции!"
 zhi.255.b: "Франции не стоит беспокоиться об этом."
 zhi.256.d: "Были выдвинуты требования о том, чтобы мы передали наше китайское имущество новому правительству Бейянга; если мы не выиграем возможную войну с этой фракцией, то это может означать прекращение французского правления в Восточной Азии."
 zhi.256.a: "Мы будем сражаться с последним человеком за нашу славную империю!"
 zhi.256.b: "Мы не можем рисковать потерять больше нашего восточно-азиатского имущества."
 zhi.257.d: "Французы противостоят нашим требованиям, однако французская колониальная империя - это не что-то легкое, с их вниманием к германской угрозе, которая может стать войной, которую мы можем выиграть."
 zhi.257.a: "Если война - это то, чего они хотят, тогда война будет у них."
 zhi.257.b: "Это может быть больше, чем мы можем выдержать."
 zhi.258.d: "Французы подчинились нашим требованиям и как таковые передают всю территорию Китая нашему праведному правительству."
 zhi.258.a: "Империалисты падают один за другим"
 zhi.259.d: "Китайское правительство отказалось, и мы должны ожидать от них больше никаких хлопот."
 zhi.259.a: "Тужься"
 zhi.260.d: "Новое правительство Китая, бывшая клика Жили, потребовало, чтобы мы немедленно покинули наши колонии в Китае и, в свою очередь, передали их"rightful" government."
 zhi.260.a: "У нас нет выбора..."
 zhi.260.b: "Мы можем хотя бы подраться с ними!"
 zhi.261.d: "Португальцы подчинились нашим требованиям и передали порту Макао."
 zhi.261.a: "Отличные новости!"
 zhi.262.d: "Португальцы отказались отказаться от колонии в Китае."
 zhi.262.a: "Они просили об этом."
 zhi.262.b: "Может, мы все-таки не готовы..."
 zhi.263.d: "Новое правительство Китая, бывшая клика Жили, потребовало, чтобы мы немедленно покинули наши колонии в Китае и, в свою очередь, передали их"rightful" government."
 zhi.263.a: "Не сдаваться!"
 zhi.263.b: "Немедленно отправьте в британское посольство!"
 zhi.263.c: "Мы отдадим его..."
 zhi.271.t: "Китайцы требуют Тайвань!"
 zhi.271.d: "Новое китайское правительство, ранее Жили Клик, потребовало, чтобы мы немедленно покинули Тайвань и передали его им."rightful" government."
 zhi.271.b: "У нас нет выбора..."
 zhi.271.a: "Мы можем хотя бы подраться с ними!"
 zhi.273.t: "Япония отвечает нашим требованиям."
 zhi.273.d: "Японцы подчинились нашим требованиям и передали остров Тайвань."
 zhi.273.a: "Отличные новости!"
 zhi.272.t: "Японцы сопротивляются!"
 zhi.272.d: "Японцы сопротивляются нашим требованиям."Proper Japanese Territory", and that they wont be relinquishing it to our government."
 zhi.272.a: "Если они думают, что флот может спасти их, они сильно ошибаются."
 zhi.272.b: "К сожалению, нам понадобятся десятилетия, чтобы построить флот, достаточно сильный, чтобы соревноваться..."
 zhi.274.t: "Китайский задний ход"
 zhi.274.d: "Китайцы отказались и не будут добиваться удовлетворения своих требований на Тайване."
 zhi.274.a: "Слава Богу!"
 zhi.275.d: "Война Фенгтианской Клики кажется совсем проигранной, они были отброшены назад после выздоровления, возможно, пришло время нам вмешаться и предложить мир, благоприятный для нас и для Жили Клик."
 zhi.275.a: "Манчжурия проиграла, у них нет другого выбора, кроме как подчиниться."
 zhi.276.d: "Японцы послали нам просьбу о том, чтобы мы заключили мир с Кликой Жили и отказались от оставшейся земли в Манчжурии, чтобы избавить китайский народ от дальнейшего кровопролития... мы, конечно, знаем, что это всего лишь уловка, чтобы отдать ему нашу землю."
 zhi.276.a: "Наша сила слишком калека, чтобы продолжать"
 zhi.276.b: "Мы сражаемся... даже если это кажется обреченным усилием."
 zhi.277.d: "Японцы стали посредником в установлении мира, который, как представляется, и нам, и им. Они считают, что это конец их усилий в Китае, связанных с нами. Мы знаем, что они сильно ошибаются."
 zhi.277.a: "Не демобилизуйте ни одного солдата... они нам понадобятся."
 zhi.278.d: "Фенгтианская клика согласилась с нашим мирным предложением, и мы захватили власть над согласованными частями региона Манчжурии."
 zhi.278.a: "Как и ожидалось"
 zhi.279.d: "Недавно мы получили сообщение о том, что просьбы от японцев, которые должны представить Фенгтианская клика, были отклонены."
 zhi.279.a: "Мы сражаемся!"
 zhi.280.d: "Фенгтианская клика отклонила наше предложение и решила продолжить свою безнадежную борьбу в Китае."
 zhi.280.a: "Они увидят заблуждение во времени,"
 zhi.281.d: "Теперь, когда британцы полностью оправились от экономического кризиса, в наших интересах, возможно, обратиться к ним за помощью."
 zhi.281.a: "Почему Япония должна быть нашей единственной помощью в грядущей войне?"
 zhi.281.b: "Было бы неразумно объединить себя с более империалистами."
 zhi.282.d: "Поскольку ситуация в Жили-Фенгтиане быстро приближается к будущей войне, Клика Жили обратилась к нам за заверениями в том, что мы окажем им поддержку в случае будущей войны, что потенциально могло бы дать нам сильного союзника в Восточной Азии, который был бы бесценным, если бы Япония стала проблемой."
 zhi.282.a: "Интересы в Китае должны быть строго защищены."
 zhi.282.b: "Почему ты беспокоишь меня такой ерундой?!"
 zhi.283.d: "Британцы послали сообщение о том, что они пришлют поддержку в случае войны с Фенгтианом."
 zhi.283.a: "Пригласи своих посланников на ужин немедленно!"
 zhi.284.d: "Британцы ответили, что они не заинтересованы в нашей поддержке."
 zhi.284.a: "Жаль, но мы все равно готовы к войне."
 zhi.285.d: "Утром мы получили сообщение о том, что произошел инцидент на границе Жили недалеко от Манчжурии. 547 человек погибли, и это лишь мрачный повод показать. Ву Пейфу утверждает, что эти люди действовали по своему усмотрению, но наши люди сообщают по-другому. В наших сообщениях говорится, что эти люди действовали под жесткой координацией и не без порядка или дисциплины, как нам казалось."
 zhi.285.a: "Что бы мы ни делали, мы должны действовать осторожно."
 zhi.285.b: "Этого достаточно, чтобы воевать!"
 zhi.286.d: "Солдаты Жили открыли огонь по японским эскадрильям, на этот раз патрульные вблизи Циндао были обстреляны артиллерийскими снарядами издалека, при этом в подразделениях, о которых мы слышали до сих пор, почти никто не выжил."
 zhi.286.a: "Сэвидж бандиты заплатят вовремя."
 zhi.286.b: "Хватит!"
 zhi.287.d: "Только сегодня днём отдел или двое из армии Жили снова пересекли границы между ними и Циндао, напав сначала на военную базу, а затем напасть на войска реагирования, которые пришли остановить их."
 zhi.287.a: "Это слишком, готовьтесь к войне, в отличие от других!"
 zhi.288.d: "Японцы любят находиться на китайской земле. Это не сработает. План был разработан для проведения серии пограничных налетов на японские войска и военные позиции таким образом, чтобы никто из китайских гражданских лиц не пострадал. Мы надеемся, что это в конечном итоге вызовет японцев достаточно, чтобы начать войну, возможно, даже в ослабленном состоянии."
 zhi.288.a: "Давайте покажем им, кто владеет Китаем."
 zhi.289.d: "После вчерашнего жестокого испытания на Манчжурской границе японцы потребовали, чтобы мы принесли им извинения за то, что сделали наши люди."
 zhi.289.a: "Упс?"
 zhi.290.d: "Японцы предупреждают нас, что если мы продолжим это, они будут вынуждены ответить с силой."
 zhi.290.a: "Какая слабая реакция"
 zhi.291.d: "Большинство японского имущества в материковом Китае было вынуждено покинуть их руки, и с земельной армией, достаточной для того, чтобы трижды победить японцев, мы можем покончить с этим сейчас."
 zhi.291.a: "Отправить требования"
 zhi.291.b: "Нет, у нас должна быть полная победа!"
 zhi.292.d: "Маршал Жили Ву Пейфу приказал нам сложить оружие и отказаться от наших территорий в континентальном Китае, поскольку у нас нет сил для их возвращения."
 zhi.292.a: "У нас нет выбора, кроме как сдаться."
 zhi.293.d: "Артиллерийские снаряды бушуют по фронлинам, мертвецы заполняют траншеи, пули и запах пороха наполняют воздух. Действительно, на нас обрушиваются ужасы войны. Сообщения о мертвых глазах людей, которые когда-либо были вынуждены во имя победы, становятся все более частыми по мере продолжения боевых действий. Однако у нас нет иного выбора, кроме как продолжать."
 zhi.293.a: "Ужас!"
 zhi.294.d: "Лао, известная писательница из Пекина, только что выпустила свою новую книгу."Rickshaw Boy". The book tells the story of a boy named "Xiangzi" who makes a living pulling a rickshaw and story largely revolves around this fact. The book has received very favourable reviews and surprisingly hasn't been banned for its portrayal of the Warlord armies."
 zhi.294.a: "Абсолютно потрясающая работа"
 zhi.295.d: "Так называемое движение за восстановление сельских районов направлено не только на восстановление экономики на макроуровне, но и на улучшение жизни и производительности сельских рабочих, подчеркивает важность модернизации не только заводов в Китае, но и административных подразделений, которые, например, занимались сбором налогов."
 zhi.295.a: "Достойная похвалы цель"
 zhi.296.d: "Император Японской империи Хирохито вчера посетил нашу гордую страну, где был ужин с Ву Пейфу и обсуждение возможного решения проблемы Фенгтианцев."
 zhi.296.a: "Японцы останутся нашими друзьями... пока что."
 zhi.301.d: "Они считают, что это укрепит наши связи на востоке и что, возможно, в будущем, как только они объявят себя подлинным правительством Китая, мы будем готовы передать Гонконг."
 zhi.301.a: "Отличное дополнение к нашему альянсу!"
 zhi.301.b: "Они не подходят для Имперского Альянса."
 zhi.302.d: "Британцы приняли наше предложение и будут поддерживать нас в любых будущих войнах."
 zhi.302.a: "Отличные новости!"
 zhi.303.d: "Британцы отклонили нашу просьбу, они не верят, что мы подходим для их альянса."
 zhi.303.a: "Напыщенные империалисты"
 zhi.304.d: "Правительство Бейянга пригласило нас присоединиться к своей военной фракции, считает, что для противодействия агрессии со стороны японцев необходима более широкая ассоциация азиатских государств."
 zhi.304.a: "Прекрасная идея!"
 zhi.304.b: "Нам лучше быть одному."
 zhi.305.d: "Восточная Азия скоро освободится от оков угнетения иностранных держав."
 zhi.305.a: "Отлично."
 zhi.306.d: "Наше приглашение отклонено."
 zhi.306.a: "Им не хватает перспективы"
 zhi.307.d: "Французы потеряли все свои владения и в Китае, и в Индокитах."
 zhi.307.a: "Они должны принять"
 zhi.307.b: "Нет, мы нажимаем."
 zhi.308.d: "Китайцы полностью вытеснили нас из Азии и требуют, чтобы мы сдались сейчас или пострадали от последствий."
 zhi.308.a: "У нас нет выбора."
 zhi.308.b: "Мы сражаемся до смерти!"
 zhi.309.d: "Наша война против империализма наконец закончилась победой."
 zhi.309.a: "У них никогда не было шансов."
 zhi.310.d: "Похоже, наш враг не сдастся даже в этой ужасной ситуации."
 zhi.310.a: "Если они хотят сделать это по-тяжёлому"
 zhi.311.d: "Большинство наших генералов согласны с тем, что это подходящий момент для того, чтобы послать британцам условия капитуляции, чтобы уступить все их порты в Китае напрямую нам."
 zhi.311.a: "Мы достаточно долго ждали."
 zhi.311.b: "Нет, нам нужна полная победа."
 zhi.312.d: "Китайцы считают, что после нескольких месяцев неудачных военно-морских вторжений и еще менее успешной защиты наших портов, нам пора сдаться."
 zhi.312.a: "Наших людей лучше потратить где-то в другом месте."
 zhi.312.b: "Мы сражаемся до последнего умирающего дыхания!"
 zhi.313.d: "Португальцы явно проиграли эту войну и, скорее всего, согласятся с условной капитуляцией."
 zhi.313.a: "Они должны принять"
 zhi.313.b: "Нет, мы нажимаем."
 zhi.314.d: "Китайцы удерживали Макао несколько месяцев без успешного вмешательства, и похоже, что эта тенденция будет продолжаться."
 zhi.314.a: "Если это означает конец кровопролития..."
 zhi.314.b: "Нет, мы сражаемся, Глория в Португалии!"
 zhi.315.d: "Португальцы явно проиграли эту войну и, скорее всего, согласятся с условной капитуляцией."
 zhi.315.a: "Они должны принять"
 zhi.315.b: "Нет, мы нажимаем."
 zhi.323.d: "Лидер Фенгтиан приказал нам сложить оружие и отказаться от наших территорий в материковом Китае, поскольку у нас нет сил взять их обратно."

