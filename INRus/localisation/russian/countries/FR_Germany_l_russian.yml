 GER_wilhelm_iii_regnal: "Вильгельм III"
 GER_wilhelm_iii_leader_desc: "Император Вильгельм III, несмотря на то, что во время возвращения в Вельткриг в качестве командующего германской Армией Б, был признан героем. После смерти отца Вильгельм, герой войны, стал новым немецким императором. Вильгельм является другом и союзником Курта фон Шлейхера и подтверждает важность аристократии в управлении."
 GER_wilhelm_iii_commander_desc: "§L\n§YBorn: 6 мая 1882 года в Марморфале Потсдама, королевство Пруссии, Немецкая империя, Немецкая Империя §Y Военная Карьера: §L#Но наследный принц Вильгельм был украшенным командиром Имперской немецкой армии в своем собственном праве. Современный королевский герой, известный в немецком обществе, компетентный эквастик и студент административного права, он начал свою карьеру в армии в 1911 году, получив задание командовать 1-м полке Хуссара. Когда Вельтриг начал командовать 5-й армией, а затем Армия Кронпринца Вильг, несмотря на свой юный возраст и отсутствие военного опыта. Его влияние на принятие решений на фронте было минимальным, и Вильгельм вместо этого использовал престиж своей должности в поддержку Пола фона Гинденбурга и Эриха Людендорфа - он описал свержение Техольфона Бетмана Голвега как"the most beautiful day of his life".\n\nCrown Prince Wilhelm returned from the Western Front a war hero and continued his duties as the heir apparent. In the post-war years, he has retained his position in the Army, while growing increasingly close with the German right wing - especially Kurt von Schleicher, who is a friend and ally of Wilhelm's."

