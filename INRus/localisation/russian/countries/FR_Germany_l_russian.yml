 GER_russian_puppet_give_karelia_desc: "Наша страна занимает обширные участки бывшей советской территории в Восточной Европе. Большинство командиров ясно, что мы не можем продолжать военное правительство над такой большой территорией вечно. Создание гражданской администрации России под нашим собственным контролем поможет облегчить административное обслуживание этого региона."
 GER_russian_puppet: "Судьба России"
 GER_russian_puppet_desc: "Наша страна занимает обширные участки бывшей советской территории в Восточной Европе. Большинство командиров ясно, что мы не можем продолжать военное правительство над такой большой территорией вечно. Создание гражданской администрации России под нашим собственным контролем поможет облегчить административное обслуживание этого региона."
 GER_annex_poland: "Немецкая Польша"
