 ### Generals ###
 GER_Erwin_Rommel_desc: "В 1910 году он начал свою военную карьеру в школе офицера кадета в Данциге и быстро стал лейтенантом в 1912 году. Во время Великой войны Роммель вел свой батальон в миссии по захвату итальянской позиции в горах северных Фриули. В течение двух дней он и его люди выполнили свою задачу, захватив в ходе этого процесса 9000 человек. К концу войны в 1919 году Роммель стал популярным героем немецкого народа. Роммель в основном не заинтересован в политике и когда партия Дресслера Валька получила власть 1933 года."
 GER_Mazimilian_von_Weichs: "§W12 ноября 1881 года Дессау, Германия#n §G Военная карьера: §WVon Weichs вступил в вооруженные силы Германии в 1900 году после окончания школы. Он был быстро признан пригодным к исполнению служебных обязанностей в генеральном штабе Германии. Во время Великой войны он служил во многих различных ролях, самым высоким из которых был штаб-атташе II. Баварской армии. После Великой войны он продолжал служить в вооруженных силах, теперь снизившись до тени своего бывшего себя. Будучи директором школы офицеров в Тюрингии и ранним сторонником [ГЕР. Хранитель] и валькизма, он смог обучить многих своих студентов этой новой и экстремальной идеологии. ~ Не в 1915 году он уступил Иронскому Кресту. ~ Управлялся Королевским орденом Дома Хохензоллерна в 1918 году.\n §GNotes: §W\n-Standed and Expered in Staffer-Ardenter of Valkism-Ardent"
 GER_Paul_Hausser_desc: "В 1899 году он вступил в армию и был быстро повышен до звания лейтенанта. В 1912 году он был принят в состав генерального штаба Германии. В 1912 году в ходе Великой войны он служил на различных штабных постах. После Великой войны он был одним из немногих, кто был принят в новый Рейхсвер. В Рейхсвере он был командиром 4-го пехотного полка, но был вынужден покинуть армию в 1923 году из-за его тесных связей с Валькистской партией и их попытки вступить в сговор в том же году. До [ГЕР. Главнер] . В 1933 году он был одним из самых способных офицеров пушистского пехотного полка, но был вынужден покинуть армию в 1923 году из-за его тесных связей с Валкистской партией и их попытки наняться из Себоттендорф Туле Гессхафт. До [ГЕР. Гейдер] . В 1933 году Хейспер был одним из тех, кто был избран в качестве одного из тех, кто был почитался в Школеорканте."
 GER_Sepp_Dietrich_desc: "§GMilitary Dossier\n§GBorn:§W28 May 1892 Hawangen, Germany\n§GMilitary Career:§WBeing born to poor parents, Dietrich left Germany after going to school for eight years and was a skilled hotelier in Switzerland. At the outbreak of the Great War Dietrich joined a field artillery regiment and later on went to join a Stormtrooper Battalion and fought in Italy where he was wounded three times. At the end of the Great War he was the Gunner of a captured Mark IV tank in the Sturmpanzerwagen-Abteilung 13. After the War Dietrich quickly joined a Freikorps and served there until the failed Coup of 1923 where he was wrongly imprisoned among other participants. He quickly joined the underground Valkist Party and after orders from Sebottendorf and Hausser he trained and commanded the first TST Regiment “Leibgarde [GER.GetLeader]” and later on went to become Commander of [GER.GetLeader]s personal Guard. After Dressler’s rise to power he was awarded for his loyalty by being promoted to a TST General and currently commands the Leibgarde.\n-Awarded the Iron Cross in 1914.\n-Awarded Medal for Bravery from Austria Hungary in 1918.\n§GNotes:§W\n-Charismatic\n-Ruthless\n-Loyal to the bone
 GER_Walter_Kruger_desc: "Военная доссирская карьера: §W27 февраля 1890 года Страбург, Австрия-Венгрия §G Военная карьера: §Joining the немецкой армии в 1908 году в звании лейтенанта он быстро продемонстрировал свои навыки во время Великой войны, где он служил в Альпенкорпах и был повышен до Хауптманна за свою смелость. В конце войны он был командующим батальоном. После Великой войны он ушел из армии и работал банкиром до 1929 года, когда он вступил в Валькистскую партию и ТБТ и был одним из их дрифтинговых офицеров для будущих военных полицейских. В конце 1935 года он был повышен до генерала и стал сторонником так называемого &quot; Мобильного военного движения &quot; , которое включает быстрое и решительное движение моторизованных пехотинцев и танков в целях предотвращения тупиковой ситуации Великой войны."
 GER_Walter_Model_desc: "После окончания школы в 1909 году он вступил в ряды вооруженных сил в качестве офицера кадета и отличился во время Великой войны, где он был назначен начальником роты прусского спасательного полка. В конце войны он служил в Генеральном штабе в отделе Гарде-Эрсатца. После войны он служил на демобилизационной службе во многих дивизиях и наблюдал за их надлежащим распадом. В конце 1920-х годов он служил в Штурме в Берлине и преподавал много молодых и многообещающих офицеров. В последующие месяцы [ГЕР. Главщик] . Модель поднялась к власти после Манштейна и Роммеля, одного из ведущих адвокатов Мобильной войны, и была зачтена за развитие идеи относительно Штурмгешц, серии хорошо охраняемых, легких автомобилей."
 GER_Wilhelm_List_desc: "Военный досьер: §W14 мая 1880 года Ульм, Германия §G Военная карьера: §WList вступил в армию в 1898 году и быстро поднялся в ряды, что привело его к тому, что он стал генеральным штабом второго баварского посева в начале Великой войны. К концу Великой войны он служил в Министерстве Войны. После того, как он работал на многих должностях в учебном департаменте министерства обороны и был наконец назначен начальником департамента в 1927 году. В 1935 году он был повышен до генерала и служил в качестве главнокомандующего IV. Армейским корпусом нового Вермахта."
 GER_Wilhelm_Ritter_von_Leeb_desc: "В 1895 году, будучи офицером Кадетом, он быстро увидел реальность войны, когда был частью западных экспедиционных сил, которые отправились в Китай, чтобы победить боксеров. В начале Великой войны он был офицером генерального штаба I. Армия. Он принял участие во многих важных битвах во время Великой войны, таких, как завоевание крепостей Премиселя, что привело его к принятию благородного титула «Риттер фон Либ». После Великой войны он продолжал служить в качестве офицера в различных штабах до тех пор, пока он не был повышен до генерала и не стал командующим Генеральным штабом 7-й дивизии. Либ скептически относился к приходу к власти [ГЕР.Государственный лидер]."
 GER_Gerd_von_Rundstedt_desc: "§W12 December 1875 Aschersleben, Germany\n§G Военная карьера: §Joining the Arms в 1892 году, Rundstedt уже был очень опытным и служил в Великом германском Генеральном штабе, когда началась Великая война. Он служил штабным офицером как в Турции, так и на Западном фронте и был быстро повышен до майора. После Великой войны он служил штабным офицером до повышения до генерала и командовал 2-м Каваллерийским дивизионным отделом до 1932 года, где он был командован генералом Группенкоммандо I в Берлине. После того, как Дресслер пришел к власти, он был назначен начальником секретной группы персонала, которая разработала планы для войн против Рейнленда, Франции и Польши, соответственно."
 GER_Gunter_von_Kluge_desc: "Военная карьера: §W30 October 1882 Посен, Немецкая Кайзеррейх (сейчас Польша)/n §G Военная карьера: §WKluge вступил в армию в 1901 году и сражался в качестве Хауптмана за бóльшую часть Великой войны. В битвы при Вердуне он был ранен и часто проявлял мужество и интеллект, приведя свои войска к многочисленным победам. В годы после Великой войны фон Клуге служил на многих различных постах в штабе до тех пор, пока он не был повышен до генерала в 1933 году вскоре после того, как [ГЕР. Генер] пришел к власти. После того, как он командовал VI. Армекорпс."
 GER_Albert_Kesselring_desc: "§W30 ноября 1885 года Маркстефт, Германия §G Военная карьера: §WKesseling вступил в армию в 1904 году и быстро начал интересоваться авиацией, не попав в состав немецких военно-воздушных сил, он с огромным успехом служил на различных штабах и командных постах во время Великой войны. После войны он служил в штабе верховного командования до тех пор, пока в 1933 году он не присоединился к секретному Luftstreitkräfte."
 GER_Alfred_Jodl_desc: "§WJodl вступил в армию в 1910 году и был повышен до лейтенанта, он служил в 4-м фельдартиллерийском полке «Кёниг» Баварской армии и служил до тех пор, пока не был ранен в 1916 году на Западном фронте. После того, как был объявлен пригодным для службы в 1917 году, он служил генеральным штабом в Эльзасе, где отвечал за организацию обороны против союзников до конца 1919 года. После войны он преподавал тактику и историю в школе офицерского училища в Берлине до 1932 года, где он был повышен до уровня руководителя секретного генерального штаба Германии. Он был одним из организаторов подземных операций «Валькист» в Рейнленде и Шлезвиг Гольштейне, и ему очень нравились подпольные валькистские ячейки в оккупированных странах."
 GER_Erich_von_Manstein_desc: "В 1935 году он был назначен начальником оперативного отдела Генерального штаба, где участвовал во многих военных планах и в конечном счете в перевоспитании Германии после [ГЕР. Гейлер] Коуп Детат. Он был яростной поддержкой Мобильного Война и был зачислен вместе с Гудерианом в качестве отца немецкого бегунгскрега. В 1935 году он был повышен до уровня Генерального штаба и начал разработку многих военных планов, в первую очередь операции по объезду войск Франции в Рейнленде через Нидерланды и Бельгию и в окружении их, так называемого Королевского ордена 69/."
 GER_Ernst_Eberhard_hell_desc: "Военный досьер: §W19 сентября 1887 года Стад, Германия §G Военная карьера: §WHell вступил в армию в 1906 году в качестве офицера-кадета и командовал батареей в Аргонском лесу во время Великой войны до 1915 года, когда он стал членом немецкой военной экспедиции Османской империи. Там он командовал войсками на Кавказе и стал экспертом в Зимней войне, а позднее получил награду за так называемую «Победу дома Отмана, штурм крепости Карса в 1918 году». Оттоманский войска под его руководством осадили город Карс, который был очень хорошо защищен и умудрился штурмовать его после одной недели с минимальными потерями. Хеллс отстранил план проникнуть в город из-за обмена заключенными, которые служили в качестве секретных агентов, отдали многие российские планы и позиции. ~ против Железного креста в 1914 году. ~ Защитил Звезду Галлиполи в 1915 году."
 GER_Karl_Donitz_desc: "В 1910 году он служил во время Великой войны офицером подводных лодок в Средиземном и Черном морях. Он был захвачен британскими войсками и жил в лагере военнопленных до конца войны, хотя он был освобожден через несколько месяцев после ее окончания. После Великой войны он продолжал служить под началом нового правительства Веймара Рейхсмарина. Когда переворот и [ГЕР. Хранитель] Партии захватил власть, Дёниц оставался преданным правительству Валькиста и был очень восхищен [ГЕР.Ветерлидер]. В настоящее время он является лидером У-Боатского отделения нового корпуса Крейгсмарина."
 GER_Alfred_Saalwachter_desc: "Военная карьера: §W10 January 1883 Nova Sól, Немецкая Кайсеррейх (сейчас Польша) §G Военная карьера: §WSAalwächter вошла в морской пехоту Кайзерлихе в 1901 году и служила в аккорде кораблей, ведущих к Великой войне. В 1915 году, после начала Великой войны, он стал флагманом Фридриха дер Гросс, флагманского флота открытого моря. В 1916 году он был командован несколькими U-Boats и служил командованием до 1919 года. После окончания войны он был помещен в качестве Корветенкапитена в правительство Веймара Рейхсмарина. Он командовал несколькими кораблями, прежде чем был назначен инспектором морского строительства, а в 1935 году был повышен до Визеадмирала Крейгсмарина."
 GER_Erich_Raeder_desc: "Военный досьер: §W24 апреля 1876 года Вандсбек, Германия \n§G Военная карьера: §Wraeder присоединился к военному пехоте Кайсерлихе в 1894 году и быстро поднялся в звании, став начальником штаба Франца фон Хиппера в 1912 году. Его умная, тщательная и хорошая этика привела его начальство к его благосклонности, и он стал несколько популярным. В это время, до Великой Войны, он служил наблюдателем в Руссо-Японской войне и был личным яхтом Кайсера. В течение всей Великой войны он играл важную роль в планировании и проведении различных нападений на британские корабли. После войны он продолжал служить в Веймарском военно-морском флоте до тех пор, пока его не повысили до уровня начальника немецкого флота в 1928 году. Когда Дресслер пришел к власти, он остался верным Рейху, хотя Рейдер не доверяет политикам и не согласен с [ГЕР. Возглавитель] относительно полезности морской войны в современной войне."
 GER_Erwin_von_Witzleben_desc: "В 1901 году, после выхода из прусского кадетского корпуса, он был назначен в Гренадирский полк Кёниг Вильгельм I No 7 в качестве лейтенанта. В начале Великой войны Вицлебен служил адъютантом в 19-й резервной пехотной бригаде, а затем стал командиром. После этого он был направлен в генеральный штаб и стал свидетелем окончания войны первым генеральным офицером 121-й дивизии. В Рейхсвере Республики Витцлебен был повышен до коменданта компании. В 1923 году он оказался в четвертом дивизионе в Дрездене в качестве майора. В конечном счете, он был отправлен в состав Генерального штаба и стал свидетелем окончания войны в качестве первого генерального офицера 121-й дивизии. В 1933 году, когда [Гегер. Грейдер] пришел к власти, он был переведен на пост пехотного лидера VI в Ганновере. В 1934 году он был отстранен от командования Четвертой дивизии в Дрезент-Д."
 GER_Ewald_von_Kleist_desc: "§G Военная Доссир §GBorn: §W8 августа 1881 года Браунфельс, Германия §G Военная карьера: §WEwald фон Клейст вступил в армию 9 марта 1900 года в качестве фахенджункера в полевом артиллерийском полке"General Feldzeugmeister" No. 3 , where he was promoted to lieutenant on 18 August 1901 . On March 22, 1914 he was transferred as a Captain to the Leibhusarenregiment  No. 1. After the beginning of the First World War, Kleist participated in the Battle of Tannenberg. From 1915 to 1919 he was used as a staff officer on the Western Front. In 1920 Kleist joined the Freikorps and remained part of the organisation as a tactics teacher throughout the remainder of the interwar but went back into the army in 1930. Kleist was promoted to Colonel in 1931 and became commander of the 9th (Prussian) Infantry Regiment in Potsdam and in 1932 commander of the 2nd Cavalry Division. In October 1932 in this position was promoted once again to Major General and finally in 1933 he attained the rank of Lieutenant General. Because of his excellence and skill as a teacher and strong support of Valkism, he was able to spread [GER.GetLeader]’s philosophy to many up and coming officers of the new German army.\n-Awarded the Iron Cross in 1914.\n§GNotes:§W\n-Effective Calvalry and Motorized Commander\n-Early Supporter of Valkism\n-Excellent tactics teacher\n-Popular among his students"
 GER_Friedrich_Paulus_desc: "После того, как он не смог обеспечить кадетство в Германской военно-морской академии, он присоединился к 111-му пехотному полку в качестве офицера-кадета в феврале 1910 года, во время Великой войны его подразделение использовалось во Франции, Италии, Румынии и Сербии до того, как он вернулся на Западный фронт."
 GER_Friedrich_Schulz_desc: "Военный досьер: §W15 октября 1897 Guxhagen, немецкий Кайсеррейх (сейчас Польша)\n §G Военная карьера: §W Когда разразилась Великая война, Шульц присоединился к Полевому полку Ноймарка No 54 в качестве добровольца. 1 апреля 1925 года он был повышен до лейтенанта и стал адъютантом 3-го пехотного полка Посена No 58. После войны он был переведен в Рейхсвер. 1 ноября 1931 года он был впервые использован в 8-м (Прусском) пехотном полке в качестве офицера 6-й роты в Глогу. 1 апреля 1925 года он был повышен до лейтенанта и стал адъютантом III. Батальоны в Гёрлице. В 1930 году он перешёл в штаб 4-й дивизии Дресдена и 1 ноября 1931 года был повышен до капитана."
 GER_Felix_Steiner_desc: "Военная доссирская карьера: §W15 23 мая 1896 года, Stalloffen\n §G Военная карьера: §W Flicks Stencils присоединился к Королевской пехотной армии в качестве пехотного кадета. Во время Первой мировой войны он был ранен в августе, но в конечном итоге был повышен до лейтенанта, а затем служил на Восточном фронте. В 1919 году Штайнер присоединился к Фрейкорпам в Восточном Прусском городе Мемель и был включен в Рейхсвер в 1921 году. В конце концов, когда Валькисты пришли к власти, он был повышен до колониля и в конечном итоге получил свой собственный режим TST-Verfügstrup, который впоследствии был назначен для обучения и сверки TST, с тем чтобы они могли быть надлежащим образом использованы на фронте, если они позднее придут к власти."
 GER_von_Randow_desc: "После того как он служил в различных полках и когда война закончилась в конце 1919 года, ему было поручено создать фрейкорп для защиты немецких железных дорог от коллективной агрессии. Он быстро стал одним из крупнейших детах в Восточной Германии, имеющих более 2000 членов, и стал известен своей жестокостью, когда он боролся с спартацистами во время их восстания. После того, как Рэндоус был включен в состав новой немецкой армии, он продолжал свою военную карьеру еще дальше. Когда [ГЕР. Возьми лидер] поднялся к власти, он сразу же поднялся на сторону фон Рандов, который возглавляет «Инфатеришу Кёлн» перед генералом и поручил ему расширить кадровый пул «ТСТ»."
 GER_von_Stephani_desc: "Военная карьера: §W12 июня 1876 года Билефельд, Немецкая Кайзеррейх §G Военная карьера: §WFRANz фон Стефани воевал в первой мировой войне как майор в 1. Garde-Regiment zu Fujo, и стал высокоодетым во время войны. Будучи демобилизованным после первой мировой войны, он быстро основал свой собственный Фрейкорп и мужественно боролся с Красной Революцией. После революции он вступил в Валькистскую партию и быстро поднялся к власти, будучи одним из ее лучших пропагандистов и администраторов."
 GER_el_cher_desc: "§WHort Sabac el Cher — сын известного музыканта и валькиста, поддерживающих Густава Сабака эль-Шер. После вступления в армию в 1918 году в качестве офицера Кадета он не видел никаких действий до окончания войны и продолжал свой офицер Карреер в новом Рейхсвере. Тайно поддерживая Валькистское пристанище вместе со своим отцом, так как валькисты обещали положить конец дискриминации против чернокожих немцев. В 1935 году он стал генералом под командованием Дресслера и был назначен командующим 3-й пехотной дивизией nn-послушным отделом в 1933 году."
 GER_von_Stierlitz_desc: "§W12 June 1885 Berlin, German Kaiserreich n §G Военная карьера: §WW. Настоящий немецкий персонаж. Скандинавский характер, поддерживает. Поддерживает хорошие отношения с коллегами. Неукоснительно выполняет свой долг. Безжалостно выполняет свой долг. Безжалостно перед врагами Рейха. Большой спортсмен: чемпион Берлина в теннисе. Он вступил в состав немецкой армии в 1903 году и стал главнокомандующим полком в начале первой мировой войны и возглавлял свой полку с неметалированными Скиллом. Наградил Pour le Merite и Iron Cross во время первой мировой войны."
 GER_Mahraun_desc: "В 1908 году он присоединился к Арме Кайзерлихе, так как Фахненджункер Махраун был сильно украшен во время WW1 и присоединился к Фрейкорп und фон Рэндоу."





