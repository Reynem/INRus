 #### Ideas ####
 GER_temporary_nowars: "Вторжение в Западославию"
 GER_black_wed_idea: "Последствия столкновения"
 GER_desire_revenge: "Желание мести"
 GER_desire_revenge_desc: "Наша нация была унижена французами в Версале и вырезана у нас на глазах. Мы стоим с миллионами немцев, проживающих в граничащих с нами странах, под защитой французов. Мы должны уничтожить французскую угрозу, чтобы мы могли установить новый европейский порядок, который будет соответствовать нашей воле, а не воле Парижа!"
 GER_three_front: "Три фронта войны"
 GER_three_front_desc: "Нас окружают наши враги, и они не понимают, что не мы находимся в нежелательной ситуации, а они."
 GER_nation_reborn: "Возрождение нации"
 GER_nation_reborn_desc: "Наша великая страна была неизмеримо унижена за столами Версаля. Так много земель, которые были преимущественно немцами, были переданы, как нежелательные карманные изменения. Новая судьба немецкого народа - исправить эти ошибки. Рейхсадлер восстанет снова, как феникс из пепла. Германия снова протянется от Мюза до Немана, но не под Кайзером. На этот раз он будет под нашим Фюрером."
 GER_military_reformed: "Военная реформа"
 GER_military_reformed_desc: "Теперь мы покончим с нашей неэффективной военной структурой. С реформированной и современной военной структурой дивизии смогут лучше общаться, подкрепление доходит до фронта быстрее, и, надеюсь, они смогут вернуться к борьбе быстрее."
 GER_industrial_regulations: "Промышленное регулирование"
 GER_industrial_regulations_desc: ""
 hitlers_four_year_plan: "Четырехлетний план Гитлера"
 reich_labor_service: "Служба труда Рейха"
 reich_labor_service_desc: "Служба труда Рейха - это организация, призванная содействовать снижению воздействия безработицы на экономику Германии, милитаризации рабочей силы и лоббированию трудящихся с помощью государственной пропаганды."
 reich_labor_front: "&lt; &lt; Рейх лейбористский фронт &gt; &gt;"
 reich_labor_front_desc: "Сформированная для создания подлинного социального и продуктивного общества, Служба труда Рейха является национальным профсоюзом Германии, в который должны вступать все трудящиеся. Ее цель заключается в том, чтобы функционировать в качестве средства, с помощью которого трудящиеся и владельцы могли бы взаимно представлять свои интересы. Работники получают относительно высокую заработную плату и гарантию занятости, а также другие льготы для поощрения лояльности государству."
 beauty_of_labor: "Красота труда"
 beauty_of_labor_desc: "Красота труда является пропагандистским департаментом, цель которого состоит в стимулировании производительности труда на рабочем месте при одновременном установлении чувства общности среди трудящихся."
 GER_standardize_equipment: "Стандартизация оборудования"
 GER_standardize_equipment_desc: "Мы не можем позволить своим войскам воевать с ненадежным оружием, а каждая винтовка, граната, нож и шлем должны отвечать строгим стандартам, прежде чем их будут использовать наши силы."
 GER_command_structure: "Немецкая командная структура"
 GER_command_structure_desc: "Для успеха военных крайне важно подчеркнуть порядок подчинения: должна быть иерархия с мужчинами, которые отдают приказы, и с мужчинами, которые следуют за приказами; если приказ отдается, независимо от того, насколько аморальным он может показаться, он должен выполняться."
 GER_strategic_planning_school: "Школа стратегического планирования"
 GER_strategic_planning_school_desc: "Если мы ожидаем, что наши войска будут следовать приказам, то лицо, отдавшее приказы, должно быть хорошо образовано и должно уважаться. &lt; &lt; Национальная школа планирования для подготовки генералов завтрашнего дня &gt; &gt; должна выполнить эту задачу."
 GER_blitzkrieg: "Bewegungskrieg"
 GER_blitzkrieg_desc: "Бевегунгскриг, буквально манипулируя войной, сосредоточивается на использовании танков и моторизованных войск, чтобы пробиться через вражеские линии и окружить их."
 GER_BLITZKRIEG_LABEL: "БЕЖЕНСКИЙ СТРУКТУР"
 GER_MODERN_BLITZKRIEG_LABEL: "МЕЖПРАВИТЕЛЬСТВЕННЫЙ БЕЖЕНЧЕСКИЙ"
 GER_modern_blitzkrieg: "Современный Bewegungskrieg"
 GER_modern_blitzkrieg_desc: "В вершине Бевегунгскрига, «Современный Бевегунгскриг» отражены все последние технологические достижения и уроки, извлеченные из предыдущих доктрин."
 GER_rule_the_skies: "Править небом"
 GER_rule_the_skies_desc: "Наши бойцы доминируют в небе, постоянно превосходят и подавляют вражеские военно-воздушные силы."
 GER_rain_of_fire: "Дождь из огня"
 GER_rain_of_fire_desc: "Our bombers will relentlessly shower enemy forces with bombs, crushing industry and destroying air bases wherever possible. Our bombers will block out the sun. The only rain to be felt will be that of our bombs.
 GER_new_wehrmacht: "Новая вермахт"
 GER_new_wehrmacht_desc: "Наша реорганизация армии прошла успешно."
 GER_submarines: "Подводная база Гамбурга"
 GER_cruisers: "База круизеров Гамбурга"
 GER_carriers: "Гамбургская база перевозчиков"
 GER_germania_rules_the_waves: "Немецкие правила Волны"
 GER_germanic_conquer: "Немецкий экспансионизм"
 GER_germanic_conquer_desc: "Наша главная внешнеполитическая цель состоит в том, чтобы воссоединить весь немецкий народ, и мы должны сосредоточить все наши усилия на достижении этой цели."
 GER_naval_treaty: "Соглашение по Бремену"
 GER_naval_treaty_desc: "После Великой войны, когда-то в Германии был захвачен огромный флот, и Великобритания заставила слабое правительство Германии принять постоянный предел размера Рейхсмарина. Если мы хотим стать мировой державой, мы должны обойти положения Бременского соглашения и создать великие военно-морские силы."
 GER_naval_treaty_light: "Соглашение по Бремену"
 GER_naval_treaty_light_desc: "После Великой войны, когда-то в Германии был захвачен огромный флот, и Великобритания заставила слабое правительство Германии принять постоянный предел размера Рейхсмарина. Если мы хотим стать мировой державой, мы должны обойти положения Бременского соглашения и создать великие военно-морские силы."
 CHI_german_advisors: "Немецкие советники"
 CHI_german_advisors_desc: "Германия предложила направить в нашу страну советников для оказания нам помощи в модернизации нашей экономики и вооруженных сил."
 GER_valkist_scandinavia: "Валькистское влияние в Норвегии"
 GER_valkist_scandinavia_desc: "Германия финансирует ультраправые националистические группы в нашей стране."
 GER_army_treaty: "&quot; Возрождение Фервента &quot;"
 GER_army_treaty_desc: "Немецкий народ отвергает идею проиграть еще одну войну и, скорее всего, бросает все, что у него есть, на тех, кто выступает против своего видения Европы."
 #GER_army_treaty: "Секретное перевооружение"
 #GER_army_treaty_desc: "В соответствии с положениями Версальского договора Германии не разрешается иметь армию, способную наступать на войну."
 #GER_army_treaty2: "Открытая репродукция"
 #GER_army_treaty2_desc: "Теперь, когда Франция страдает от Лондонского рынка, мы можем восстановить нашу армию, не боясь вмешательства Энтента."
 GER_eco_reborn: "Экономика возрождается"
 GER_eco_reborn_desc: ""
 GER_carrier_focus: "Гамбургские транспортные средства"
 GER_carrier_focus_desc: "Теперь, когда мы контролируем Гамбург, у нас есть возможность восстановить забытый портовый город."
 GER_capital_focus: "Столовые суда Гамбурга"
 GER_capital_focus_desc: "Теперь, когда мы контролируем Гамбург, у нас есть возможность восстановить забытый портовый город."
 GER_sub_focus: "Гамбургские морские суда"
 GER_sub_focus_desc: "Теперь, когда мы контролируем Гамбург, у нас есть возможность восстановить забытый портовый город."
 GER_purge_started: "Великая чистка"
 GER_purge_started_desc: "Предатели, коммунисты и марионетки Энтенти пытались подорвать Германию с тех пор, как мы получили власть."
 GER_divided_govt: "Разделенное правительство"
 GER_divided_govt_desc: "[ГЕР.Ведущий] и его валькист популярны среди рабочего класса, сердца Германии, но многие интеллектуалы считают его движение незаконным."
 GER_purged_army: "Очищенные армейские офицеры"
 GER_purged_army_desc: "На протяжении многих лет [ГЕР.Генератор] боялся, что кампфский полкентер, коллекция многих правых боевиков, стал слишком влиятельным и амбициозным. Почти каждый аспект немецкого правительства зависит от их власти и насилия. Слухи о перевороте пролились в кабинете [ГЕР.Гедера], и потребуются действия, чтобы остановить любое возможное восстание."
 GER_news_paper: "Государственная газета"
 GER_news_paper_desc: "Многие враги государства использовали средства массовой информации для того, чтобы печатать непристойную ложь о нашей партии, и такие газеты будут запрещены к распространению, и вместо этого будет создан надлежащий источник новостей, "Volksnachrichten", чтобы информировать немецкий народ об истине."
 GER_wessel_dead: "Уничтожен Хорст-Вессель"
 GER_wessel_dead_desc: "Ведущая команда Кэмпф Страхунтера Хорст Вессель представляет растущую угрозу для Валькистской партии. Вессель требует усиления контроля над национальной армией, что даст ему полный контроль над Германией. Его таинственная смерть неизвестному стрелку не видела особого сочувствия со стороны внутреннего круга Валькистской партии."
 GER_goring_dead: "Германн Горинг ликвидирован"
 GER_goring_dead_desc: "Германн Горинг возглавляет вторую по величине фракцию в Германии, и он использовал эту силу, чтобы подорвать Валькистов, несмотря на свою общественную поддержку [ГЕР.Гедер], наши две стороны не видят в себе, когда дело доходит до будущего Германии, и как таковой он бесполезен для нас. Его таинственная смерть неизвестному стрелку не видела большого сочувствия со стороны внутреннего круга Валькистской партии."
 GER_loyal_generals: "Присяга верности"
 GER_loyal_generals_desc: "Армия и кампфский полкентер должны поклясться в верности не только немецкому народу, но и фюреру, Адаму [ГЕР.Гедеру] самому. [ГЕР.Генератор] является спасителем Германии, и все немцы должны смотреть на его направляющую руку."
 GER_no_unions: "Запрещенные профсоюзы"
 GER_no_unions_desc: "Профсоюзы являются питательной средой для коллективистской мысли, они вредят экономике Германии и отравляют ум немецкого человека."
 GER_yes_unions: "Профсоюзы, контролируемые государством"
 GER_yes_unions_desc: "Профсоюзы дают власть немецкому трудящемуся. Государство должно создавать союзы, которые уравновешивали бы потребности человека с потребностями общины."
 GER_no_books: "Запрещенная левая литература"
 GER_no_books_desc: "Социализм - это идеология, которая заставляет сильных поддерживать слабых. Немцы заслужили свое место на мировой арене и должны сохранить эту позицию, не думая ни о чем другом. Любая книга, подрывающая эту позицию, должна быть запрещена, чтобы не затуманить умы нашего народа."
 GER_holstien_docks: "Немецкая собственность на Гамбургские доки"
 GER_holstien_docks_desc: "Ценный прибрежный город Гамбург предоставляет нашей стране доступ к открытому морю."
 GER_ban_den: "Запрет датчан от политики Гольштейна"
 GER_ban_den_desc: "Датское влияние возросло в Гольштейне с момента оккупации во время Великой войны. Датские должностные лица составляли значительную часть правительства территории. Теперь их высылка открывает эти рабочие места для наших немецких граждан. Хотя для адаптации Гольштейна потребуется время, это необходимый шаг, чтобы создать Гронедучланд."
 GER_yes_den: "Разрешить датскому гражданскому контролю над Ютландией и Шелландией"
 GER_yes_den_desc: "Постоянная военная оккупация основных датских территорий никогда не была частью наших планов для скандинавского государства."
 SWE_german_advisors: "Немецкие советники в Стокгольме"
 SWE_german_advisors_desc: "Германия проявляет большой интерес к нашему выживанию и направляет советников для наблюдения за развитием нашего военного персонала и улучшением нашей военной индустрии."
 GER_ban_lit: "Поощрение немецкой иммиграции в Литву"
 GER_ban_lit_desc: "Прусцы когда-то составляли значительную часть населения Литвы, и сегодня их влияние может ощущаться в балтийском государстве."
 GER_ban_poles: "Выдворенные поляки из Восточной Германии"
 GER_ban_poles_desc: "В конце Великой войны у нас были украдены и переданы изменчивому польскому народу основные территории Посена и Сюдпреуэна. Мы должны принять все необходимые меры для того, чтобы избежать подобных трагедий снова."
 GER_yes_poles: "Гражданство Польши"
 GER_yes_poles_desc: "В ходе Великой войны почти миллион поляков мужественно сражались за центральные державы, эти войска были преданы делу Германии и сражались вдоль наших собственных войск как на восточном, так и на западном фронте на протяжении всего конфликта, и эти люди и их дети должны быть приняты в Большой Рейх в качестве почетных немцев, предоставляя им одинаковые права и привилегии."
 GER_polish_occupation: "Затраты на профессию в Польше"
 GER_polish_occupation_desc: "Захват больших пластов польских территорий является для нашего государства большим бременем."
 GER_purge_started: "Великая Чистая Начала"
 GER_purge_started_desc: "Величайшая угроза Валькистской партии исходит не от французов или британцев, а от самой Германии. Многие фракции стремились получить власть в эти бурные годы. Мы должны очистить этих врагов государства и обеспечить постоянную стабильность. Расследования проводятся в отношении многих более активных противников правления [ГЕР.Генератор]. Те, кто не осудит их прошлые критические замечания и не даст клятву верности Валькистской партии, будут рассмотрены на постоянной основе."
 GER_divided_govt: "Разделенная нация"
 GER_divided_govt_desc: "С момента переворота в 1933 году немецкое государство не смогло создать стабильное правительство, многие фракции борются за власть и влияние, которые только ослабляют нашу великую нацию."
 GER_news_paper: "Фолькснахрихтен"
 GER_news_paper_desc: "Volksnachrichten или "People's Papers's Paper" - это правительственные новости, которые демонстрируют славу немецкой культуры и превосходство валькистской философии."
 GER_purged_army: "Очищенные армейские офицеры"
 GER_purged_army_desc: "Лояльность многих должностных лиц армии находится под вопросом уже многие годы. Эти люди, у которых железный кулак немецкого государства, представляют собой величайшую угрозу для нашего режима. Их ликвидация является ключом к сохранению нашего контроля над Германией, но потребуется некоторое время для того, чтобы новые и преданные офицеры восполнили потери неопытных людей."
 GER_wessel_dead: "Уничтожен Хорст-Вессель"
 GER_wessel_dead_desc: "Хорст Вессель, лидер военизированной «Кампф-рефронттер», возможно, был самым влиятельным человеком в Германии. В соответствии с положениями Версальского договора Германия не имела законного права создавать свои вооруженные силы. Вместо этого многие неофициальные военизированные группы поднялись, чтобы помочь защитить Германию. Чтобы поддержать захват власти Валькистом [ГЕР.Главный лидер] и его некогда близкий помощник Хорст Вессель объединили многие из этих разрозненных групп в единую полувоенную силу, но оставить это влияние в руках одного человека было серьезной ошибкой. Вессель все больше требовал более жесткого контроля над нашей военной перевооруженностью, уловки, чтобы получить полную монополию на власть государства. Для дальнейшей безопасности Германии смерть Весселя и демонтаж Кэмпфрентера была необходимостью."
 GER_goring_dead: "Германн Геринг ликвидирован"
 GER_goring_dead_desc: "Гёринг когда-то возглавлял крупнейшую оппозиционную фракцию в Германии. Популярный герой войны и страстный немецкий националист, Гёринг использует в качестве полезного союзника [ГЕР.Гедер], но недавние разногласия привели к тому, что они разделились. До своей смерти Геринг имел значительное политическое влияние, его критику валькизма и [ГЕР.Гедер] распространился по всей Германии, несмотря на их хрупость. Чтобы обеспечить стабильность нашего режима Геринга и его сообщников, нужно было ликвидировать."
 GER_loyal_generals: "Присяга от генералов"
 GER_loyal_generals_desc: "Все генералы будут вынуждены дать присягу на верность [ГЕР.Германскому лидеру], персонажу и защитнику немецкого народа и государства."
 GER_no_unions: "Запрещенные профсоюзы"
 GER_no_unions_desc: "Многие профсоюзы в Германии являются питательной средой для социализма. Это подрыв государственной власти должен прекратиться. Мы должны положить конец этим союзам и позволить корпорациям обращаться с социалистами так, как они хотят."
 GER_yes_unions: "Государственные союзы"
 GER_yes_unions_desc: "Многие капиталисты эксплуатируют своих коллег-немцев, крадя доходы от их труда, мы должны организовать разрозненные союзы в единое государственное происхождение, чтобы, наконец, остановить эту эксплуатацию."
 GER_no_lefties: "Брошюры левых"
 GER_no_lefties_desc: "Многие левые распространяют социалистические книги и брошюры по всей Германии, чтобы отравить ум нашей молодежи."
 GER_tst_army: "TST Ведущие отделы"
 GER_tst_army_desc: "Подразделения ТБТ должны быть разделены на элитные и хорошо оснащенные подразделения, способные совпадать с любой угрозой или сценарием."
 GER_tst_support_wing: "Группы поддержки ТБТ"
 GER_tst_support_wing_desc: "К существующим подразделениям следует добавить подразделения, обеспечивающие им руководство и гибкость, необходимые для достижения любой цели"
 GER_tst_support_defense: "Полк-инженер &lt; &lt; TST &gt; &gt;"
 GER_tst_support_defense_desc: "Подразделения ТБТ проходят подготовку по вопросам проведения оборонительных операций и хорошо оснащены как мужчинами, так и материалами, необходимыми для строительства прочных укреплений"
 GER_tst_support_scouts: "ОТК разведывательные полки"
 GER_tst_support_scouts_desc: "Спецподразделения TST проходят подготовку для проведения разведывательных операций, и их навыки скаутинга дадут нашим основным силам информацию, необходимую для решительных действий."
 GER_tst_no_partisans: "TST Антипартийная роль"
 GER_tst_no_partisans_desc: "Подразделения ТБТ проходят подготовку по вопросам проведения антипартийных операций и будут помогать нашим оккупационным силам в выявлении возможных мест сбора партийных партий и свертывании их планов."
 GER_tst_secret_bois: "Секретная полиция"
 GER_tst_secret_bois_desc: "ТБТ должна следить за нашими гражданами и принимать меры в отношении любых нежелательных лиц, которые хотят подорвать власть нашего государства и безопасность народа."
 GER_political_comissars: "Политические коммиссары"
 GER_political_comissars_desc: "Коммиссары будут обучены держать наши основные силы в узде дезертиров и следить за тем, чтобы дивизии продолжали преследовать цели, даже несмотря на кажущиеся непреодолимыми разногласия."
 GER_tst_manse_contract: "Контракт MAN SE"
 GER_tst_manse_contract_desc: "MAN SE выиграла контракт на разработку оборудования для TST. Их опыт в разработке Panzer будет очень полезен для нас."
 GER_tst_dp_contract: "Контракт &quot; Даймлер-Бенз &quot;"
 GER_tst_dp_contract_desc: "Даймлер-Бенз выиграл контракт на разработку оборудования для ТБТ."
 GER_tst_state_contract: "Государственные центры военного развития"
 GER_tst_state_contract_desc: "Частью плана Страссера по национализации большинства аспектов немецкой экономики является создание государственных институтов для развития военного времени, что позволит избежать неэффективности, замедляющей частные решения."
 POL_german_equipment: "Сделка с польско-немецким оружием"
 POL_german_equipment_desc: "Немецкое оружие и производственное оборудование составляют значительную часть наших национальных запасов, и, хотя это помогает увеличить численность наших вооруженных сил, оно также уменьшило потребность в том, чтобы производители оружия, принадлежащие Польше, новировали и развивали этот ныне затопленный рынок."
 GER_polish_trade: "Прибыль от польской продажи оружия"
 GER_polish_trade_desc: "Наша оружейная сделка с Польшей принесла столь необходимый доход в Германию, но некоторые из наших генеральных сотрудников по-прежнему предупреждают об опасности предоставления потенциального врага, несмотря на гарантии Гитлера о том, что Польша вскоре будет слишком зависеть от нас, чтобы мобилизовать любую оппозицию."
 LIT_german_navy: "Немецко-литовские военно-морские базы"
 LIT_german_navy_desc: "Несмотря на эти позитивные моменты, многие министры по-прежнему опасаются влияния немецкой компании &quot; Норддеутшер Ллойд &quot; , которая владеет большинством акций на этих новых объектах. &quot; Норддеутшер Ллойд &quot; утверждает, что она более предана целям немецкого правительства, чем потребностям литовцев, но их компания приносит столь необходимый доход в Литву."
 GER_lit_trade: "Прибыль с литовских военно-морских баз"
 GER_lit_trade_desc: "Литва согласилась оказать ей помощь в строительстве новых верфей на их побережье."
 RHI_no_work_visas: "Германия запрещает рейнские трудовые визы"
 RHI_no_work_visas_desc: "Немецкое правительство по совету министра экономики Адольфа Гитлера провело радикальные реформы в отношении своей политики выдачи виз на работу. Германия больше не будет выдавать эти визы гражданам Рэйниша, и все существующие визы теперь не имеют юридической силы. На пресс-конференции Гитлер заявил: "Почему истинное немецкое государство должно позволять этим французским марионеткам высасывать богатство нашей великой нации, чтобы субсидировать их слабое и умирающее? Настоящие немцы, застрявшие в рейнском кукольном штате, должны вернуться домой в Германию, где их снова заберут на открытых объятиях"."
 AUS_no_iron: "Австро-германская железная торговля"
 AUS_no_iron_desc: "Хотя этот доход помог сократить наш национальный долг, многие австрийские производители теперь жалуются на нехватку этого жизненно важного ресурса."
 GER_austria_imports: "Железнодорожные партии из Австрии"
 GER_austria_imports_desc: "Австрийский Железо сейчас попадает в Германию. Теперь, когда поставки этого ресурса в безопасности, мы сможем сосредоточиться на нашей перевооружении без колебаний."
 GER_danube_payments: "Расходы на строительство данубийской плотины"
 GER_danube_payments_desc: "Проклятие Дуная является одним из самых амбициозных планов, когда-либо реализованных правительством Германии."
 GER_danube_rekt: "Дунай прогоняется сухо"
 GER_danube_rekt_desc: "В Германии проект строительства данубийской плотины серьезно сказался на водотоке реки."
 GER_danube_done: "Электрический выход Данубийской плотины"
 GER_danube_done_desc: "В настоящее время завершена реализация проекта строительства плотины на Дунае, которая обеспечивает электроэнергией миллионы немцев в австрийском и баварском регионах."
 SWE_no_tungsten: "Шведско-немецкая торговая сделка вольфрама"
 SWE_no_tungsten_desc: "Хотя этот доход помог сократить наш национальный долг, многие шведские производители теперь жалуются на нехватку этого жизненно важного ресурса."
 GER_swedish_imports: "Поставки вольфрама из Швеции"
 GER_swedish_imports_desc: "Шведский вольфрам сейчас попадает в Германию. Теперь, когда поставки этого ресурса в безопасности, мы сможем сфокусироваться на нашей перевооружении без колебаний."
 GER_sudetan_nope: "Экономическая дрифта западославии к Германии"
 GER_sudetan_nope_desc: "Недавние экономические реформы в Германии сделали более выгодными для тех, кто живет в Судетанленде, немецко-чехском, продавать и покупать товары в Германии, а не в Западославии. Это оказало негативное воздействие на наш экономический рост, поскольку многие наши немецкие граждане смотрят на валькистский режим экономической поддержки, а не на свою собственную нацию."
 GER_sudetan_profits: "Поступления от немецких и чешских корпораций"
 GER_sudetan_profits_desc: "В связи с благоприятными условиями торговли многие немецкие и чешские корпорации теперь предпочитают экспортировать товары в Германию, а не в остальной Западославию, принося богатства нашим странам, медленно убивая их."
 GER_volkswohlfahrt: "Валькист Фольксвольфахрт"
 GER_volkswohlfahrt_desc: "Слишком многие страны находятся в рейтинге успеха своих немногих самых сильных членов, а не того, как они относятся к своим беднейшим. Для того чтобы наша нация выдержала испытание временем, мы должны гарантировать экономическую безопасность наших граждан. Валькист Фольксволфахрт или VV обеспечит социальное обеспечение всем немцам, нуждающимся в помощи."
 GER_child_care: "Лебенсборн"
 GER_child_care_desc: "По мере того, как все больше и больше женщин присоединятся к рабочей силе, будет возрастать потребность в соответствующих услугах по уходу за детьми. &quot; Лебенсборн &quot; была создана в качестве государственной службы по оказанию помощи в обеспечении ухода, питания и надзора за следующим поколением немецкой молодежи."
 GER_new_cooperative: "Промышленная палата Рейха"
 GER_new_cooperative_desc: "Отто Страссер создал централизованную палату, чтобы не обращать внимания на развитие немецкой промышленности."
 GER_infantry_standards: "Правила, касающиеся пехотного оборудования"
 GER_infantry_standards_desc: "Разрозненные производители оружия в Германии очень редко сотрудничают и делятся взаимозаменяемыми частями."
 GER_support_quality: "Положения о вспомогательном оборудовании"
 GER_support_quality_desc: "Изготовители разрозненного оборудования Германии очень редко сотрудничают и делятся взаимозаменяемыми частями. Даже в рамках одной компании большинство поставок требуют какого-то рода ремесленного труда, прежде чем быть готовыми к полевому использованию. Все эти недостатки складываются и подрывают нашу способность поставлять наши силы. Для стандартизации деталей, видов поставок и даже производственных процессов все это сделает нашу военную индустрию более эффективной."
 GER_artilley_quality: "Правила, касающиеся артиллерийского оборудования"
 GER_artilley_quality_desc: "Разрозненные производители оружия в Германии очень редко сотрудничают и делятся взаимозаменяемыми частями."
 GER_bunker_focus: "Укрепление фокуса"
 GER_bunker_focus_desc: "Враги со всех сторон угрожают выживанию Немецкого Рейха."
 GER_begone_monopoly: "Антитрестовское законодательство Германии"
 GER_begone_monopoly_desc: "С момента окончания Великой войны и все чаще некоторые предприятия продолжают контролировать экономику Германии. Эти монополии приносят пользу их акционерам только за счет их рабочих. Мы должны разрушить эти корпорации, прежде чем они могут угрожать нашей стабильности."
 GER_yay_workers: "Трудящиеся ведут переговоры с владельцами предприятий"
 GER_yay_workers_desc: "Такой децентрализованный подход позволяет каждому сектору экономики заключать познавательные сделки, которые непосредственно способствуют улучшению их положения."
 GER_yay_state: "Переговоры правительства с владельцами предприятий"
 GER_yay_state_desc: "Чтобы гарантировать, что предприятия выполнят требования рабочих, правительство должно заключить справедливые сделки от их имени, что позволит нам принять решение о том, что большинство из них выгодно нуждающимся работникам, бизнесу и государству."
 GER_intergrate_privates: "Национализированные ключевые сектора экономики"
 GER_intergrate_privates_desc: "Многие жизненно важные сектора экономики Германии больше не могут находиться в частных руках. &lt; &lt; Прибыль и конкуренция &gt; &gt; лишь вредят среднему немецкому населению и потребностям государства. &lt; &lt; Мы должны национализировать &gt; &gt; ключевые сектора экономики на благо всех немцев."
 GER_increased_taxes: "Увеличение налогов на высокие доходы"
 GER_increased_taxes_desc: "Многие высокодоходные работники хвастаются своим богатством, которое лишь тормозит нашу экономику, и мы должны увеличить налоги на этих людей и вернуть эти деньги в оборот."
 GER_airship_spying: "Армейские позиции были скомпрометированы"
 GER_airship_spying_desc: "Немецкая армия, похоже, хорошо осведомлена о позициях и передвижениях наших войск, мы не можем их поймать врасплох, мы должны организовать наши подразделения под покровом тьмы, чтобы избежать дальнейших утечек, но пока наша армия не будет скомпрометирована."
 GER_youth_soldiers: "Программы борьбы и выживания для молодых людей"
 GER_youth_soldiers_desc: "В условиях все более враждебной Европы все немецкие мужчины должны быть готовы при необходимости защищать свои дома."
 GER_youth_support_role: "Роль военной поддержки немецкой молодежи"
 GER_youth_support_role_desc: "Мальчики в возрасте от 16 до 18 лет теперь могут поступать в армию в качестве вспомогательных, некомбатантских подразделений, где они будут оказывать помощь инженерно-техническим, медицинским и материально-техническим подразделениям нашей армии."
 GER_youth_infrastructure: "Образование в области гражданского строительства"
 GER_youth_infrastructure_desc: "Германия является домом для некоторых из величайших мировых инженеров и строительных проектов. Мы должны расширить знания об этом наследии в следующем поколении, с тем чтобы немецкие снаряды могли продолжать безо всяких проблем."
 GER_youth_civillian: "Общинные проекты"
 GER_youth_civillian_desc: "Молодые мужчины должны участвовать в деятельности по улучшению социального положения своих общин."
 GER_youth_farms: "Семейные фермы"
 GER_youth_farms_desc: "Для облегчения этого бремени, лежащего на нашей экономике, мы должны поощрять немецкие семьи к тому, чтобы они субсидировали свое питание отечественными фруктами и овощами."
 GER_funding_zuse: "Финансирование Konrad Zuse"
 GER_funding_zuse_desc: "Конрад Зузе — немецкий математик, который в настоящее время разрабатывает механические калькуляторы с электрическим приводом. Хотя их функционирование в настоящее время ограничено, Zuse предполагает, что их способность рассчитать большие уравнения вскоре превзойдет возможности человека. Эта расчетная мощность может быть использована как для шифрования наших передач, так и для расшифровки вражеских передач."
 GER_funding_diebner: "Финансирование Курта Дибнера"
 GER_funding_diebner_desc: "Немецкий физик Курт Дибнер гипотетизировал потенциальное военное применение ядерного взрыва. Когда происходит деление невероятно большого количества энергии в процессе. Возможность создания взрывного оружия, основанного на этом явлении, дала бы Германии такое большое преимущество, что ни одна страна на Земле не смогла бы конкурировать, но в настоящее время мало исследований было проведено в этой области, мы должны исправить это."
 GER_banned_from_kiel: "Германия запретила нашим кораблям кильский канал"
 GER_banned_from_kiel_desc: "Немецкий рейх, на удивление враждебно вступая во внешнюю политику, запретил нашим кораблям входить в Кильский канал. Очевидно, что этот шаг направлен на ослабление нашего влияния в Атлантике. Мы должны искать другие торговые пути сейчас."
 GER_no_oil_sov: "Уничтожены нефтяные месторождения Баку"
 GER_no_oil_sov_desc: "Немецкий воздушный удар по Бакинским нефтяным месторождениям сделал их полностью неоперабельными."
 ENG_german_deal: "Торговый договор Германии по тяжелой промышленности"
 ENG_german_deal_desc: "В обмен на продажу военно-морского оборудования в Германию мы получаем от них высококачественное оборудование для тяжелой промышленности, что, безусловно, поможет в производстве современных бронированных единиц."
 GER_english_deal: "Торговый договор английской военно-морской промышленности"
 GER_english_deal_desc: "В обмен на продажу тяжелой техники в Британию мы получаем от них высококачественное военно-морское оборудование, что, безусловно, поможет в производстве продвинутых боевых кораблей."
 GER_kiel_profits: "Прибыль от налогов Kiel Channel"
 GER_kiel_profits_desc: "Увеличение налогов на суда, въезжающие в Кильский канал, обеспечивает столь необходимый доход для нашего государства."
 GER_kampfregimenter: "Влияние кампфа"
 GER_kampfregimenter_desc: "В Версальском договоре Германии запрещено создавать армию численностью более 100 000 человек. Французы заверили нас в том, что этого будет более чем достаточно для защиты наших границ, но когда после Великой войны их армия оккупировала Рейнленд, всем в Германии стало ясно, что для того, чтобы обойти положения этого договора, крайне необходимо расширение вооруженных сил. Многие ультраправые группы сформировали частные ополчения для защиты своих городов от провокаторов Германии. Хотя их люди в основном не готовы бороться с их верностью своим командирам, они перевешивают свою преданность государству, которое подвергает наш режим опасности восстания. Кампфский пограничник должен быть упразднен и заменен организацией, преданной только Фюреру."
 GER_versialles_no_good: "Второй Версальский договор"
 GER_versialles_no_good_desc: "После второй Великой войны победившие французы заставили Германию подписать второй Версальский договор, в котором французы ограничили размеры немецкой армии и должны навсегда распустить свой генеральный штаб, который организовал большинство немецких военных усилий. Оба эти условия серьезно ослабили наше государство и нашу способность претендовать на наше место как мировой державы."
 FRA_german_sanctions: "Санкционирование Германии"
 FRA_german_sanctions_desc: "В соответствии с политикой Совета Энтези мы согласились на введение санкций в отношении Германии, мы больше не будем продавать военные материалы там, хотя это решение было популярным среди делегатов Совета, многие предприниматели в секторе вооружений утверждали, что эти санкции лишь наносят ущерб их доходам и нашей экономике."
 FRA_austerity_measures: "Меры экономии"
 FRA_austerity_measures_desc: "В ответ на Лондонский кризис на фондовом рынке Совет по сотрудничеству согласился координировать меры жесткой экономии. Сотрудничающие члены увеличат налогообложение на своих самых высокооплачиваемых граждан, а также субсидии, предоставляемые в настоящее время открытой промышленности. Помимо этого, члены Совета будут продолжать экспортировать природные ресурсы другим членам, если они в этом нуждаются. Вместе мы будем поддерживать друг друга в целях экономического восстановления."
 GER_german_sanctions1: "Приобретение санкций"
 GER_german_sanctions1_desc: "Эти трусливые французы оказывают давление на орду наций, с тем чтобы санкционировать нашу страну, пытаясь нанести ущерб нашей оружейной промышленности."
 GER_german_sanctions2: "Приобретение санкций"
 GER_german_sanctions2_desc: "Эти трусливые французы оказывают давление на орду наций, с тем чтобы санкционировать нашу страну, пытаясь нанести ущерб нашей оружейной промышленности."
 GER_german_sanctions3: "Приобретение санкций"
 GER_german_sanctions3_desc: "Эти трусливые французы оказывают давление на орду наций, с тем чтобы санкционировать нашу страну, пытаясь нанести ущерб нашей оружейной промышленности."
 GER_british_compromise: "Англо-германский морской договор"
 GER_british_compromise_desc: "Одним из крупнейших вкладов Великобритании в Версальский договор было положение о том, что Германия не должна поддерживать флот, способный к наступательным операциям. Сегодня, хотя обе стороны согласились аннулировать эту часть договора. Британия позволит Германии построить его флот до «управляемого уровня» без вмешательства."
 FRA_uprepared_for_war: "Неподготовленный военный штаб"
 FRA_uprepared_for_war_desc: "Французские военные потеряли большую часть своего престижа и опыта со времени окончания Великой войны, Франция стала слишком комфортной в своем положении в Европе и не смогла успеть успеть за военными своими соседями, особенно Германией, поскольку недавний экономический спад по-прежнему затронул нашу экономику, для того чтобы наши опустошённые военные могли получить бюджет и подготовку, необходимые для ведения современной войны."
 GER_internal_education: "Образование на гражданской службе"
 GER_internal_education_desc: "Финансирование курсов гражданской службы в наших университетах поможет создать поколение немцев, хорошо подготовленных к строительству и месттианцам такой славной нации, как наша."
 GER_external_education: "Военное образование"
 GER_external_education_desc: "Финансирование образования, чтобы научить следующий родословный искусству войны, поможет Германии поднять поколение, способное преодолеть угрозу нашему славному государству."
 GER_public_bonus: "Финансирование государственного образования"
 GER_public_bonus_desc: "Образование - это право для всех немцев. Для достижения этой цели мы должны увеличить финансирование государственного образования."
 GER_wartime_conversion: "Министерство вооружений"
 GER_wartime_conversion_desc: "Для соблюдения производственных квот германская промышленность в настоящее время добавила соответствующие военные временные меры и теперь сосредоточит свое внимание на военных материалах, а не на гражданских товарах."
 GER_stole_er_jerbs: "Иностранные рабочие"
 GER_stole_er_jerbs_desc: "По мере увеличения числа немецких мужчин на военную службу министерство вооружений начало нанимать людей с нашей оккупированной территории для заполнения вакантных рабочих мест на фабриках, и, хотя это помогает нашей промышленности соблюдать квоты на поставки оружия, оно также очень непопулярно для многих германских националистов."
 GER_responsible_industry: "Самоотчуждаемость промышленности"
 GER_responsible_industry_desc: "Бюрократия нашего правительства лишь замедлила усилия нашей промышленности по адаптации к военным усилиям Адольф Гитлер предложил форму экономической автономии немецких промышленных гигантов, которую он называет "самоответственностью"."
 GER_special_equipment: "Специализация оборудования"
 GER_special_equipment_desc: "Для содействия достижению наших целей по упорядочению германского производства оружия министерство вооружений приняло указ, в соответствии с которым контролируемые Германией предприятия должны будут сосредоточить свое внимание на едином военном оборудовании, упрощая в ходе этого процесса производственные линии."
 GER_air_defense: "Антивоздушный фокус"
 GER_air_defense_desc: "Чтобы защитить нашу индустрию от вражеских бомбардировок, мы должны сосредоточиться на разработке достаточного оборудования для борьбы с воздушными пожарами, чтобы предотвратить любые нападения на наши фабрики."
 GER_protected_industry: "Подземные сооружения"
 GER_protected_industry_desc: "Чтобы лучше защитить нашу индустрию от вражеских воздушных налетов, министерство вооружений поместило ключевые сектора нашего военного производства в укрепленные подземные объекты, безопасные от даже большого количества бомбардировщиков."
 GER_kiev_oil: "Импорт нефти в Украниан"
 GER_kiev_oil_desc: "Чтобы помочь в создании нашей армии, мы решили помочь усовершенствовать нефтяную промышленность Украины."
 GER_kiev_exporting: "Экспорт нефти в Германии"
 GER_kiev_exporting_desc: "Чтобы помочь увеличить национальные доходы, мы согласились позволить немецким инженерам помочь нам усовершенствовать нашу нефтяную инфраструктуру."
 GER_kiev_corn: "Импорт укранианских продуктов питания"
 GER_kiev_corn_desc: "Чтобы помочь нашему постоянно растущему населению, мы решили обратиться за помощью к украинской корзине хлеба, чтобы помочь нашему сельскохозяйственному сектору в обеспечении нашего народа продовольствием."
 GER_corn_export: "Экспорт продовольствия в Германии"
 GER_corn_export_desc: "Наше сельское хозяйство является ядром нашей экономики, и потребность Германии в большем количестве продуктов питания приносит нам большую пользу, даже если цены на продукты питания несколько возросли для наших собственных граждан."
 GER_desperate_defence: "Отчаянная защита"
 GER_desperate_defence_desc: "По мере того, как французские силы все глубже проникают на территорию Германии, наши командиры отчаянно адаптируются к оборонительной войне, используя все еще имеющиеся материалы, но эти запасы начинают резко сокращаться."
 SOV_desperate_defence: "Отчаянная защита"
 SOV_desperate_defence_desc: "По мере того, как вражеские силы все глубже проникают на советскую территорию, наши командиры отчаянно адаптируются к оборонительной войне с любыми материалами, которые все еще имеются в наличии, но эти запасы начинают критически сокращаться."
 GER_disorganized_staff: "Дезагрегированный генеральный персонал"
 GER_disorganized_staff_desc: "Единая организация, помогающая Энтези выиграть Великую Войну 20 лет назад, была потеряна."
 GER_new_wehrmachtA: "Расширенная воинская обязанность"
 GER_new_wehrmachtB: "Новая мобилизация"
 GER_new_wehrmachtC: "Армия, готовая к войне"
 GER_fastasfuqA: "Первоначальные реформы"
 GER_fastasfuqB: "Мобильный и готовый"
 GER_command_structure1: "Немецкая командная структура"
 GER_command_structure1_desc: "Для успеха военных крайне важно подчеркнуть порядок подчинения: должна быть иерархия с мужчинами, которые отдают приказы, и с мужчинами, которые следуют за приказами; если приказ отдается, независимо от того, насколько аморальным он может показаться, он должен выполняться."
 GER_command_structure2: "Немецкая командная структура"
 GER_command_structure2_desc: "Для успеха военных крайне важно подчеркнуть порядок подчинения: должна быть иерархия с мужчинами, которые отдают приказы, и с мужчинами, которые следуют за приказами; если приказ отдается, независимо от того, насколько аморальным он может показаться, он должен выполняться."
 GER_arty_power: "Артиллерия &lt; &lt; Крупп &gt; &gt; , финансируемая из государственных фондов"

 #### Focuses ####
 GER_dutch_policy: "Голландская стратегия"
 GER_dutch_policy_desc: "Голландцы полностью изолированы в Европе, имеют с нами в целом нейтральные отношения и холодные отношения со своими западными и южными соседями."
 GER_invade_netherlands: "Проникнуть в Нидерланды"
 GER_invade_netherlands_desc: "Нидерланды занимают критическую стратегическую позицию на побережье Северного моря; их порты обеспечивают идеальную основу для того, чтобы угрожать Великобритании и обеспечить безопасность нашего морского фланга; кроме того, их нейтралитет представляет собой тонкую завесу; они не могут попасть под британское влияние или встать на пути выполнения наших стратегических требований; обеспечение голландского побережья и промышленных мощностей является необходимым шагом для обеспечения нашего господства в Западной Европе. &lt; &lt; Хир &gt; &gt; будет готов провести быструю кампанию по их включению в нашу сферу."

 GER_skilled_command: "Квалифицированное командование"
 GER_skilled_command_desc: "Великая война научила нас тому, что храбрая армия бесполезена без компетентной структуры командования. Наши офицеры должны быть лучшими в мире, обученными не только теории, но и практическому применению современной войны. Мы будем вкладывать средства в наши военные академии и офицерские школы, обеспечивая, чтобы каждый человек, возглавляющий наших солдат, был мастером своего ремесла, способным к независимой мысли и решительным действиям."

 GER_a_mobile_army: "Мобильная армия"
 GER_a_mobile_army_desc: "Мы никогда больше не будем гнить в траншеях, провал плана Шлиффена и последующие годы статичной войны были прямым результатом нашей неспособности поддерживать динамику. Будущее немецкой войны лежит в движении. Мы построим армию, которая будет измерять не победу в метрах грязи, а в километрах захваченной территории. Наша новая доктрина будет в виде скорости, прорыва и неустанной эксплуатации."

 GER_reorganised_command: "Реорганизованное командование"
 GER_reorganised_command_desc: "Мобильная армия требует мобильного командования. Старая, жесткая иерархия прошлого недостаточна для скорости современного боя. Мы должны реорганизовать командную структуру, с тем чтобы она была гибкой и гибкой, делегируя полномочия по принятию решений командирам на местах. За счет инициативности и адаптируемости наши офицеры смогут использовать возможности в момент их возникновения, задолго до того, как вялая команда противника сможет отреагировать."

 GER_speed_emphasis: "Упор на скорость"
 GER_speed_emphasis_desc: "В "Gefecht der glarundenen Waffen" - комбинированная скорость сражения с оружием - это важнейший элемент. Это новая, непреклонная высота. Подчеркнув скорость в наших доктринах, тренировках и проектировании оборудования, мы создадим силу, которая может достичь прорыва и быть глубоко в задней части врага, прежде чем они даже создадут новый фронт. Мы нанесем сильный удар, нападем быстро и уйдем прежде, чем они смогут защититься. Это новая война движений."

 GER_mass_mechanisation: "Современная механизация"
 GER_mass_mechanisation_desc: "Мечта о полностью передвижной армии не может быть реализована только с лошадьми и пехотой, она требует революции в материально-техническом обеспечении и транспорте. Эта инициатива позволит финансировать массовое производство грузовиков, полутреков и других моторизованных машин. Наши пехотинцы установят темп, и наша новая моторная пехота будет прямо за ними, обеспечивая возможности для эксплуатации и удержания наших прорывов. Эпоха двигателя горения уже здесь, и наша армия примет его."

 GER_infantry_support_mobile: "Эффективная поддержка пехотных подразделений"
 GER_infantry_support_mobile_desc: "В целях обеспечения целостности нашей доктрины совместных вооружений мы должны разработать новые способы поддержки нашей пехотиной бронетехники, включая разработку специализированного, мобильного вспомогательного оружия - пушечных пушек, легких противотанковых пушек и минометов, - которые могут быть оперативно доставлены для решения вопросов, связанных с укрепленными позициями и вражескими контрнападениями, что позволит панзерам сохранить свой импульс."

 GER_a_well_led_army: "Хорошая лидированная армия"
 GER_a_well_led_army_desc: "В то время как обсуждаются новые доктрины, фундаментальная истина о войне остается: хорошо руководимая армия всегда будет иметь преимущество. Мы должны развивать глубокие таланты не только в офицерском корпусе, но и в унтер-офицерском корпусе. Эти люди являются основой армии, которые переводят приказы в действие. Улучшая подготовку и авторитет наших НКЦ, мы создадим основу руководства, которая будет проходить через все отряды и секции Хеера."

 GER_modern_equipment: "Современное оборудование"
 GER_modern_equipment_desc: "Нельзя ожидать, что наши солдаты будут сражаться с оставшимися в Великой войне материальными средствами. Немецкий рабочий и инженер являются самыми лучшими в мире, и настало время заставить их работать над созданием новой армии. Эта программа будет нацелена на разработку и производство современного пехотного снаряжения - новых винтовок, надежных пулеметов и усовершенствованных средств личного назначения. Солдат, который доверяет своему снаряжению, является солдатом, который может с уверенностью бороться."

 GER_powerful_artillery: "Артиллерия &lt; &lt; Крупп &gt; &gt;"
 GER_powerful_artillery_desc: "Название "Крупп" было синонимом немецкой огневой мощи на протяжении поколений. Мы восстановим это наследие. В то время как другие сосредоточиваются на количестве, мы сосредоточимся на качестве, разработке самых современных артиллерийских орудий в мире. Наши новые орудия будут более точными, иметь более дальний радиус действия и стрелять более разрушительными, чем все, что могут сделать наши враги. Когда 'Feuerwalze' - пожарный вальс - begins, враг узнает, что немецкая артиллерия вернулась."

 GER_modernise_artillery: "Модернизация артиллерии"
 GER_modernise_artillery_desc: "Мы должны также усовершенствовать доктрины и системы для их применения. Эта инициатива будет сосредоточена на модернизации наших артиллерийских команд и управления, совершенствовании методов наблюдения на переднем этапе и стандартизации наших снарядов. Мы будем обеспечивать, чтобы наши стрелявшие могли в течение нескольких минут произвести разрушительный и точный огонь по любой цели, где бы они ни находились на поле боя."

 GER_new_divisions: "Новые подразделения пехоты"
 GER_new_divisions_desc: "При новом поколении техники и модернизированном корпусе офицеров настало время расширить "Хир", мы воздвигнем новые пехотные дивизии, привлекая патриотическую молодежь нации, эти новые формирования будут обучены с нуля нашим современным доктринам и будут оснащены новейшим оружием, они станут прочным, надежным ядром новой немецкой армии, стальной стеной, против которой наши враги разорвутся."

 GER_extensive_support: "Широкая поддержка"
 GER_extensive_support_desc: "Современная пехотная дивизия — это больше, чем просто люди с винтовками, это автономное подразделение с комбинированным оружием. Мы должны обеспечить, чтобы наши новые дивизии получали надлежащую поддержку со стороны прикрепленных батальонов инженеров, разведывательных, противотанковых и зенитных подразделений. Эти вспомогательные роты дадут нашим дивизиям гибкость в преодолении любых препятствий, будь то река, минное поле или вражеский танк."

 GER_a_powerful_army: "Сильная армия"
 GER_a_powerful_army_desc: "Усилия нашей страны принесли свои плоды. Новая немецкая армия готова к синтезу силы и движения. Наши пехотные дивизии, возглавляемые гибким и смелым командованием, являются мобильным лидером. Наши мощные пехотные дивизии, поддерживаемые необычайно высоким качеством нашей артиллерии, являются нерушимым назломом. Мы объединили уроки прошлого с технологией будущего, чтобы создать боевые силы без равных. Вермахт готов ответить на призыв Отечества."
 GER_invade_luxembourg: "Въезд в Люксембург"
 GER_invade_luxembourg_desc: "Поскольку Рейн чист, а Бельгийцы рядом с нами, единственное препятствие на нашем марше в Париж - это маленькая нация Люксембург, являющаяся частью нашего пангерманского проекта, они тоже должны быть аннексированы."
 GER_war_with_uob: "Война с Союзом Великобритании"
 GER_war_with_uob_desc: "Невероятно, что британцы отбросили своего короля и провозгласили социалистическую республику! Теперь они сидят в Северном море, замышляя наше уничтожение, без сомнения, вместе с нашим восточным врагом! Нельзя позволить им существовать больше, чтобы мы освободили англо-саксонов!"
 GER_conscription_policy: "Политика в отношении призыва на военную службу"
 GER_conscription_policy_desc: "Растущая напряженность в отношениях с Французской Республикой надвигается к открытому конфликту, который, возможно, является самым смертоносным из когда-либо наблюдавшихся в Европе."
 GER_ae_community: "Противоядное сообщество"
 GER_ae_community_desc: "Несмотря на то, что мы являемся страной, у которой есть лучшая причина ненавидеть грязных агло и самодовольных французов, мы не одни!"
 GER_pangerman: "Пангерманская политика"
 GER_pangerman_desc: "Главное руководство нашей партии - объединить всех германцев под одним флагом, как это делали наши предшественники под славным канцлером Железного Отто фон Бисмарком."
 GER_friend_china: "Дипломатическое представительство в Китай"
 GER_friend_china_desc: "Наш Фюрер [ГЕР.Генератор] всегда восхищался китайским народом за то, что он доминировал во всей азиатской области на протяжении веков. В своей книге он даже писал, что Китайская Республика будет одним из главных союзников Германии, которая доминирует на континенте. Давайте поддержим китайцев и сделаем предвестник [ГЕР.Главенер] сбывшимся."
 GER_china_advisors: "Советники в Китай"
 GER_china_advisors_desc: "Китай, похоже, модернизирует свою армию в последние годы. Давайте расширим продажи оружия, которые старая коррумпированная республика сделала с китайцами. Высшее командование предложило направить военную миссию под руководством Александра фон Фалькенхаузена в Китай, чтобы помочь им модернизировать свою армию и сделать Китай ужасным врагом даже для самых сильных наций на земле."
 GER_china_alliance: "Укрепить Альянс с Китаем"
 GER_china_alliance_desc: "Мы сотрудничаем с китайцами с начала 1920-х годов."
 GER_holstein_situation: "Ситуация со Шлезвигом Гольштейном"
 GER_holstein_situation_desc: "Грязный датчанин забрал Шлезвига Холштейна в последние месяцы Великой войны, мы должны отомстить за это воровство, требуя проведения референдума по вопросу о возвращении этой провинции к нам. Дания станет первой страной, которая почувствует силу нового Рейха."
 GER_break_naval_treaty: "Нарушение военно-морского договора"
 GER_break_naval_treaty_desc: "Союзные страны заставили нас принять ограничения на наш военно-морской потенциал, мы должны избавиться от этого и заставить англичан снова опасаться нашего могучего флота."
 GER_indian_rebels: "Поддержка индийских мятежников"
 GER_indian_rebels_desc: "Мы должны использовать любую возможность, чтобы ослабить Энтенсию. В последние годы в Индии царила большая нестабильность, и теперь там также вспыхнула открытая волна. Мы будем поддерживать восстающих индейцев против их тиранических повелителей!"
 GER_rhineland_referendum: "Референдум в Рейне"
 GER_rhineland_referendum_desc: "Рейнленд был незаконно взят у нас французами после Великой войны, чтобы разрушить нашу экономику и создать коридор между нашими странами, чтобы наша страна никогда больше не воевала. Требуя референдума, который, очевидно, пойдет в нашу пользу, мы напомним французам о том, кто на самом деле должен руководить Европой."
 GER_demand_alsace: "Спроси Элсасса Лотрингена"
 GER_demand_alsace_desc: "Рейнская долина уже более тысячелетия является немецкой, французская кровожадная после победы во время Великой войны взяла регион в свои руки, наши немецкие братья в этом регионе кричат о нашем возвращении, Эльзас Лотринген снова станет немцем."
 GER_invade_benelux: "Инварировать Бельгию"
 GER_invade_benelux_desc: "Некоторые высокопоставленные офицеры наших вооруженных сил предложили обойти французские линии обороны, настроенные на нашей границе, нападая на Бельгию и уничтожая ее, и использовать эту инициативу для быстрого нападения на север Франции и обеспечения того, чтобы война против Франции увидела быстрый конец, которого не произошло в результате Великой войны."
 GER_invade_britain: "Уничтожить Империю"
 GER_invade_britain_desc: "Даже после неизбежного поражения Франции нам все равно нужно избавиться от Соединенного Королевства."
 GER_invade_switzerland: "Инвад Швейцария"
 GER_invade_switzerland_desc: "Швейцария является дорожным заграждением, которое остановит наше продвижение во Францию и Италию. Быстро захватив маленькое государство, мы сможем объединить наши вооруженные силы на французском фронте с нашими силами на итальянском фронте для более скоординированных нападений. Швейцария всегда была и всегда будет немцем. Это будет большим катализатором для их включения в Рейх."
 GER_claim_voralberg: "Спрос на Воральберга"
 GER_claim_voralberg_desc: "Теперь мы контролируем Австрию, у нас есть правовая основа для подтверждения контроля над Воральбергом, похищенным швейцарцами после незаконного референдума вскоре после Великой войны."
 GER_invade_centroslavia: "Инвад Западославия"
 GER_invade_centroslavia_desc: "Так называемая нация Западославия противостояла нашему давлению с целью вернуть нам нашу законную землю мирным путем."
 GER_ae_propoganda: "Пропаганда против сопричастности"
 GER_ae_propoganda_desc: "Наши печатные работы и журналисты постоянно работают над все большим количеством историй, чтобы оскорбить Энтенс и поднять народ против них, что, безусловно, окажет позитивное воздействие на все по праву немецкие земли, которые все еще контролируются врагом."
 GER_destabilize_centroslavia: "Дестабилизировать Западославию"
 GER_destabilize_centroslavia_desc: "Так как наш фюрер также родом из прежних земель, известных как Западославия, и пользуется большой поддержкой немцев, живущих там, мы должны использовать эту популярность, чтобы дестабилизировать и в конечном итоге уничтожить Западославию изнутри."
 GER_annex_bohemia: "Приложение Западославия"
 GER_annex_bohemia_desc: "Несмотря на то, что нам удалось вернуть большую часть наших земель из Чехии, мы все равно должны стремиться к полному контролю над этими бывшими немецкими землями."

 GER_invade_bohemia_cze: "Спросите у Судетенленда"
 GER_invade_bohemia_cze_desc: "Так называемая нация Чехия противостояла нашему давлению с целью вернуть нам нашу законную землю мирным путем. Теперь мы должны потребовать ее силой, и теперь чехия не сможет вновь успешно сопротивляться."
 GER_destabilize_centroslavia_cze: "Дестабилизировать чешский народ"
 GER_destabilize_centroslavia_cze_desc: "Так как наш фюрер также родом из прежних земель, известных как Чехия, и пользуется большой поддержкой немцев, живущих там, мы должны использовать эту популярность, чтобы дестабилизировать и в конечном итоге уничтожить Богемию изнутри."
 GER_annex_bohemia_cze: "Приложение Чехия"
 GER_annex_bohemia_cze_desc: "Несмотря на то, что нам удалось вернуть большую часть наших земель из Чехии, мы все равно должны стремиться к полному контролю над этими бывшими немецкими землями."
 GER_war_bohemia_cze: "Введи в действие Богемию"
 GER_war_bohemia_cze_desc: "Настало время навсегда уничтожить Чехию, и этот рак на лице Европы, наконец, будет уничтожен одним ударом."

 GER_influence_austria: "Поддержка кубок валькистов в Австрии"
 GER_influence_austria_desc: "Австрия, будучи нашим надежным союзником во время Великой войны, теперь является тенью своего бывшего государства и не желает сотрудничать с нашей нацией."
 GER_balkan_influence: "Влияние на Балканы"
 GER_balkan_influence_desc: "Страны Балкан, не будучи нашими историческими друзьями, также занимают негативную позицию в отношении «Согласия», и мы должны извлечь выгоду из этой позиции и привести эти страны в соответствие с нашим мышлением."
 GER_translyvania_summit: "Встреча на высшем уровне в Трансильвании"
 GER_translyvania_summit_desc: "Нация Трансильвании была невезучим и деформированным результатом Великой войны."
 GER_fate_of_denmark: "Судьба Дании"
 GER_fate_of_denmark_desc: "Наконец, Дания была возвращена на свое место. Мы должны рассмотреть вопрос о том, чтобы защитить нашу северную границу от страшных датчан и убедиться в том, что все не кончится, как в 1919 году."
 GER_valkist_sweden: "&lt; &lt; Альянс со Швецией &gt; &gt;"
 GER_valkist_sweden_desc: "Шведское правительство, хотя оно официально и не является валькистом, наслаждалось тем, как мы справились с их хитрым врагом Данией. Мы должны активизировать усилия, чтобы Швеция и ее Steel остались на нашей стороне в следующей Великой войне. Официальное приглашение в наш Альянс будет гарантировать это."
 GER_valkist_norway: "Валькизм в Норвегии"
 GER_valkist_norway_desc: "Норвегия является последним бастионом Скандинавской страны, который по-прежнему занимает нейтральную позицию в международных вопросах, и мы будем пропагандировать валькизм и его идеалы в Норвегии и заставим их поддержать нас против врага."
 GER_norway_alliance: "Предложить Норвегию &lt; &lt; Альянс &gt; &gt;"
 GER_norway_alliance_desc: "Сейчас Норвегия находится в благоприятном положении для нас, и мы должны пригласить их в наш Альянс и обеспечить, чтобы наш северный фронт больше никогда не подвергался угрозе со стороны врага."
 GER_to_the_east: "Восточная политика"
 GER_to_the_east_desc: "Для того чтобы у нас было достаточно места для жизни быстро растущего населения, нам нужно захватить плодородные земли к востоку от нашей границы и колонии и сделать Германию еще больше, чем сегодня."
 GER_anti_bolshevik: "Пакт о борьбе с бандитизмом"
 GER_anti_bolshevik_desc: "Мы должны реализовать идеи Вернера Графа фон дер Шуленбурга и предложить договор о взаимной помощи в случае агитации и агрессии большевиков с другими странами, которым угрожает эта угроза."
 GER_soviet_war: "Удар по Советскому Союзу"
 GER_soviet_war_desc: "Настало время покончить с этой харадой и закончить то, что начали наши предки. С тех пор, как появился немецкий народ, он всегда подвергался угрозам со стороны русского народа. Пусть это будет Тевтонский Орден, славная Пруссия или Немецкий Кайзеррейх. Мы покончим с Россией и, наконец, наш народ сможет жить в безопасности, не боясь славянских орд."
 GER_attack_crimea: "Прикончить Южную Россию"
 GER_attack_crimea_desc: ""
 GER_baltic_influence: "Influence The Baltics
 GER_baltic_influence_desc: "Литовцы притесняются поляками, тщательно усиливая антипольские настроения, мы можем сделать так, чтобы Польша передала нам Литву и увеличила нашу силовую базу в Балтии."
 GER_invade_poland: "Инвадская Польша"
 GER_invade_poland_desc: "Мы пытались быть благоразумными, даже если это не было в нашей пользу. Это изменение происходит сейчас. Мы нападем на Польшу и уничтожим ее и позаботимся о том, чтобы исторический провал, называемый Польшей, был искоренен из книг истории."
 GER_silesia_for_alliance: "Предложить Польше защиту для Познана"
 GER_silesia_for_alliance_desc: "Несмотря на то, что Польша и наша нация не имеют лучших отношений, мы могли бы предложить им защиту от их врагов в обмен на земли Обера и Нидершлезьена."
 GER_invade_zapadnaslavia: "Разрушить Западославию"
 GER_invade_zapadnaslavia_desc: "Французы больше не могут защищать Европу, жалкая нация Западославия больше не будет троном на нашей стороне, теперь мы можем легко вторгнуться и интегрировать их немецкие земли обратно к их законному владельцу."
 GER_german_spirit: "Немецкий дух"
 GER_german_spirit_desc: "Немецкий народ всегда был сильным народом. В такие времена, как те, что впереди нас, мы докажем раз и навсегда, что немцы не могут быть побеждены."
 GER_consolidate_power: "Объединить нашу партию"
 GER_consolidate_power_desc: "Чтобы быть полностью готовыми к надвигающемуся шторму, нам нужно еще больше укрепить контроль над Германией, мы полностью заставим всю страну выйти на нашу линию и избавиться от любых элементов, которые вызывают проблемы."
 GER_mandatory_membership: "Мандат Членство в Volksdeutsche Jugend"
 GER_mandatory_membership_desc: "С этого момента каждый новый немецкий гражданин и каждый, кто хочет достичь более высокого положения, должны быть членами нашей славной партии, которая обеспечит внутреннюю стабильность и предотвратит еще один откат назад, как в 1919 году."
 GER_legal_reform: "Валькистские правовые реформы"
 GER_legal_reform_desc: "Назначая новых судей и реформируя общий департамент юстиции, мы полностью интегрировам наши взгляды в новый Немецкий Рейх. Справедливость будет вновь привнесена в немецкий народ. И на этот раз никто по-настоящему не будет в невыгодном положении."
 GER_build_radios: "Построить радиопередачи для людей"
 GER_build_radios_desc: "Отто Грисинг предложил старому коррумпированному правительству в 1933 году, мы используем это гениальное изобретение, чтобы заставить всех услышать голос нашего фюрера, даже в глубинах Вестервальда, все услышат громкие речи нашего фюрера и его подчиненных."
 GER_german_universities: "Новая университетская учебная программа &lt; &lt; Насильственное применение &gt; &gt;"
 GER_german_universities_desc: "История доказала, что любой университет в Германии всегда был местом встречи для либеральных и особенно социалистических идей."
 GER_nuke_program: "Проект создания ядерного взрыва"
 GER_nuke_program_desc: "Манфред фон Арденн и Карл Фридрих фон Вайцсекер, два многообещающих ученых в нашей стране, начали работать над так называемым Уранпроектом, целью которого является ядерное оружие, которое фон Арденн обещает поставить врагов Германии на колени всего за несколько секунд."
 GER_tst_question: "Дискуссия по ТСТ"
 GER_tst_question_desc: "С приходом к власти Thuleschutztruppe, короткое TST, неуклонно растет. Теперь нам нужно решить, какой путь выбирает TST. Высшее командование Вермахта предложило использовать TST в качестве полиции и оккупационных войск со специальной подготовкой. Фон Себоттендорф хочет, чтобы TST стала элитой Германии."
 GER_tst_police: "Как наши полицейские силы"
 GER_tst_police_desc: "Наш Фюрер решил прислушиваться к высшему командованию и приказал фон Себоттендорфу преобразовать ТБТ в Силы внутренней полиции, оккупационной службы и антипартизанской борьбы."
 GER_tst_training2: "Стандартизация подготовки сотрудников полиции"
 GER_tst_training2_desc: "Для того чтобы осуществить реформу, мы должны завершить обширные исследования в областях работы, которые будут определены ТБТ."
 GER_tst_special_training: "Окончание антипартийной роли TST"
 GER_tst_special_training_desc: "Теперь, когда начертано новое ТБТ, нам нужно продолжить осуществление специальных реформ, что будет означать создание нескольких так называемых Абтейлунгенов, которые будут заниматься определенными особыми задачами или конкретными областями работы, которые им поручены. Это обеспечит всегда наличие специального подразделения, которое будет готово, когда возникнет необходимость."
 GER_tst_special_equipment: "Специализированное оборудование для ТБТ"
 GER_tst_special_equipment_desc: "Иногда обычная винтовка и форма не подходят для особых задач."
 GER_tst_intelligence: "Укрепление сети секретной полиции"
 GER_tst_intelligence_desc: "Уолтер Шелленберг возглавляет Abteilung XIV 7a, которому поручено бороться с внутренними политическими врагами и иностранным влиянием на немецкие институты."
 GER_tst_comissars: "Полки комиссаров"
 GER_tst_comissars_desc: "Еще одному лидеру многообещающего Абтейлуна, майору Барби из Абтейлунга 683, было предложено добавить в состав каждого полка так называемых комиссаров, которые будут отвечать за дисциплину и политическую корректность, чтобы не допустить дезертирства, как в 1919 году."
 GER_tst_frontline: "Реформировать TST в элитных войсках"
 GER_tst_frontline_desc: "Наш Фюрер прислушался к слову своего бывшего Сподвижника фон Себоттендорфа и поручил ему преобразовать TST в новую ведущую элиту, способную даже успешно выполнять самые трудные задачи."
 GER_tst_training: "Стандартизация обучения на фронтальной основе"
 GER_tst_training_desc: "Чтобы достичь своего элитного статуса, нам нужны элитные офицеры по подготовке кадров."
 GER_tst_factories: "Изготовление нового оборудования TST"
 GER_tst_factories_desc: "Уолдемар Пабст объявил о своей поддержке того, как идет TST. Он предложил Фюреру план строительства специальных заводов, где лучшие из наших инженеров и ремесленников будут производить специальное оборудование, необходимое для такой элитной армии."
 GER_tst_division: "Поднять отделы TST"
 GER_tst_division_desc: "Сегодня в Мюнхене были приведены к присяге первые из наших полностью оснащенных и обученных дивизий ТСТ, которые станут лидером немецкой военной машины."
 GER_tst_tanks: "Форма TST PanzerDivisionen"
 GER_tst_tanks_desc: "С еще большей тренировкой мы смогли создать элитную танкную группу из лучших из наших танкеров, они полностью моторизованы и используют только лучшие бронированные машины, которые может предложить наша страна, это значит, что никто никогда не сможет остановить этих людей в их машинах."
 GER_direction_of_the_economy: "Направленность экономики"
 GER_direction_of_the_economy_desc: "Как Гитлер, человек, которому доверяют наши фюреры, так и Отто Страссер, человек, который быстро поднялся в ряды нашей партии в последние годы, предложили многообещающие планы по дальнейшему укреплению нашей экономики."
 GER_keep_hitler: "Оставьте Гитлера"
 GER_keep_hitler_desc: "Наш фюрер решил оставить Гитлера, человека, ответственного за то, чтобы сделать Германию такой, какой она есть сегодня. С его богатым опытом и большим количеством способных людей, он введет промышленность Германии в новый Золотой век, который продлится тысячу лет!"
 GER_hitlers_four_year_plan: "Четырехлетний план Гитлера"
 GER_hitlers_four_year_plan_desc: "Гитлер предложил четырехлетний план, состоящий из четырех отдельных этапов, чтобы подтолкнуть германскую экономику к полной войне со своими врагами, который предусматривает быструю индустриализацию сельских районов и расширение как оружейных заводов, таких, как Пабст-Верке, так и инфраструктуры в регионах, имеющих решающее значение для военных усилий Германии."
 GER_hitlers_plan1: "Продуктивная стадия"
 GER_hitlers_plan1_desc: "Первый этап нашего плана будет нацелен на производство достаточного количества основного оборудования для поддержки наших постоянно растущих армий, обеспечение того, чтобы у нас было достаточно винтовок и полицейских для каждого солдата, дает нам силы быстро мобилизовать армию, которая будет превзойти каждую армию, которая когда-либо видела лицо земли."
 GER_hitlers_plan2: "Расширение нашего военного флота"
 GER_hitlers_plan2_desc: "Второй этап нашего плана направлен на восстановление морского превосходства в Северном море и Атлантике. В период с сегодняшнего дня по 1919 год как англо-французские мореплаватели, так и даже российские военно-морские флоты, если вы можете назвать его чем-то иным, чем груз рыболовных судов, имеют в два или даже три раза бо́льшую силу нашего военно-морского флота."
 GER_hitlers_plan3: "Усилия по модернизации"
 GER_hitlers_plan3_desc: "На третьем этапе мы будем поддерживать как инфраструктуру, так и новую радиолокационную технологию, разработанную гением д-ра Рудольфа Кюнхольда, что укрепит способность луфтстрейткрэфте и Кригсмарина победить врагов."
 GER_hitlers_plan4: "Заключительный этап"
 GER_hitlers_plan4_desc: "В четвертом и последнем сегменте плана Гитлеров будет использоваться так называемая организация «Рейхсарбейтсдиенст», оказавшаяся в живых Гитлером, чтобы дать бедным и безработным возможность работать в Рейхе, поднять большие заводские залы с земли, которые начнут производить военное оборудование, как только они закончат. Более секретные части плана включают очень большой комплекс для дальнейшего расширения исследований синтетических масел и других новейших новых технологий."
 GER_choose_strasser: "Выбрать Страссера"
 GER_choose_strasser_desc: "Грегор Страссер, человек, который быстро поднялся в наши ряды с его интересными идеями и новыми представлениями о Германии, призывает к более радикальному плану. Его план включает национализацию всех частных компаний, борьбу с капитализмом и коррупцией, которую он приносит нам. С Страссером мы централизуем нашу экономику, чтобы убедиться в том, что мы будем иметь полный контроль над ней и вместе с ней, самой эффективной военной экономикой на Земле."
 GER_strassers_plan: "План Страссера"
 GER_strassers_plan_desc: "На прошлой неделе Страссер был назначен нашим рейхсвиршафтсменом, и сразу же начался процесс реформирования экономики Германии, был принят Гитлер Рейхсарбейтсдиенст и реформирован в Страссер-Группу. Эти люди немедленно начнут работать над производством новых фабрик, как для военного, так и для гражданского использования, используя модели, которые позволяют быстро производить переключатели в случае необходимости."
 GER_strassers_plan2: "Политика национализации"
 GER_strasser_plan2_desc: "Вторая важная вещь, которая была включена в Меморандум Страссера по рейхсвиртшафту, включала радикальную национализацию компаний. Это, очевидно, расстроит старую элиту и временно помешает нашему национальному единству. Но это ничто по сравнению с выгодами, которые принесут экономика, полностью находящаяся под нашим контролем. Экономика Германии будет процветать, а танки и винтовки будут построены быстрее, чем пулеметы могут выстрелить."
 GER_strassers_plan3: "Рейхсгеноссеншафтен"
 GER_strassers_plan3_desc: "С основами Рейхсгенсеншафтена мы можем включить всех работников Рейха, чтобы поделиться идеями о том, как еще больше повысить эффективность наших заводов и общее производство гражданского и военного оборудования."
 GER_strassers_plan4: "Ликвидация коррупции в столицах"
 GER_strassers_plan4_desc: "Финальная фаза Страссера требует самых радикальных изменений в Германии. С помощью DeGepo Эрхардта, Deutsche Geheimpolizei, ему удалось получить большой список всех, кого считают коррумпированными и капиталистическими. Давайте избавимся от людей, которые мешают Германии полностью реализовать свой потенциал и обеспечат, что больше никогда не будут капиталистами и наживающими толстых кошек, которые будут править индустрией."
 GER_economy_reborn: "Возрождение экономики"
 GER_economy_reborn_desc: "С тем, что экономика Германии наконец-то реформирована и избавлена от ее мешающих элементов, никто не ожидает, что мы превратимся в силовой дом. Сейчас действительно никто не может остановить Германию. За каждый танк, каждый ружье, которое будет уничтожено, на его место придет еще 100 человек. Солдату никогда больше не придется использовать устаревшее оборудование, как в 1919 году."
 GER_form_govt: "Укрепление нашего правительства"
 GER_form_govt_desc: "Многие фракции в Германии по-прежнему стремятся подорвать авторитет правящей партии Валькистов. Слухи о восстании бушуют через Германию. Мы должны узаконить вашу позицию, если мы хотим сохранить контроль над Германией."
 GER_great_purge: "Оппозиция &lt; &lt; Судьба &gt; &gt;"
 GER_great_purge_desc: "Тем не менее, в нашем парламенте есть коррумпированные политики, которые стремятся лишь ослабить нынешнюю систему и стремятся сохранить статус-кво, в котором нас держала Веймарская Республика."
 GER_purge_democrats: "Терпение демократических симпатизаторов"
 GER_purge_democrats_desc: "И хотя наша прежняя чистка была успешной и лишь укрепила нашу политическую власть, все еще есть некоторые должностные лица, которые могут представлять угрозу для Рейха в будущем."
 GER_kill_Schleicher: "Уничтожить Курта фон Шлейхера"
 GER_kill_Schleicher_desc: "Курт фон Шлейхер был бывшим канцлером Республики Веймар, из-за его измены и отказа работать с нами, что привело к расколу и расколу в нашем правительстве и, таким образом, к нашей способности вернуться к власти на мировой сцене. Именно из-за этого он должен раз и навсегда быть ликвидирован."
 GER_kill_Bose: "Уничтожить Герберта фон Бозе"
 GER_kill_Bose_desc: "Герберт фон Бозе всегда был на нашей стороне, как часть кабинета Франца фон Папена, он много раз принимал против нас оппозиционные и изменники, его план в 1934 году попытаться заставить фон Гинденбурга повернуться против нас смехотворно провалился, и его план по приезду в Рейхсвер для мобилизации против ТБТ так и не увенчался успехом, он больше не должен работать против нас."
 GER_state_papers: "Установите "Волкснахрихтен""
 GER_state_papers_desc: "Теперь, когда мы преодолели огромный разрыв внутри нашего правительства, настало время, наконец, полностью передать наши идеи, а также продвигать нашу точку зрения на события как на национальном, так и на международном уровнях. Это еще больше убедит людей в том, что наше дело правильно, и еще больше укрепит наше правительство."
 GER_ban_political_parties: "Запрет на деятельность политических организаций"
 GER_ban_political_parties_desc: "После нашей великой чистки мы уничтожили многих бывших великих политиков, и поэтому угроза для нас сведена к минимуму, однако это не остановит новых амбициозных людей, которые, возможно, не смогут прийти к власти в противостоящей партии."
 GER_purge_ambitious: "Дежурные военные офицеры"
 GER_purge_ambitious_desc: "Даже с успехом нашей предыдущей чистки мы не можем игнорировать то, что в армии есть много амбициозных фигур, которые хотят однажды захватить свою собственную власть или, возможно, попытаться активно использовать вооруженные силы против нас, если что-то не пойдет по их пути. Мы должны солить этих людей, прежде чем они смогут прорасти."
 GER_kill_Wessel: "Уничтожить Хорст-Вессель"
 GER_kill_Wessel_desc: "С тех пор, как он присоединился к TST в наши первые дни, Хорст Вессель доказал, что он является ценным достоянием для военизированных формирований, и даже внес вклад в некоторые исследования нашей земельной доктрины."
 GER_kill_Goring: "Уничтожить Германн Горинг"
 GER_kill_Goring_desc: "Герман Горинг снова и снова доказал свою популярность среди определенных слоев немецкого народа, однако он является ценным достоянием наших ВВС, и как таковой, если мы потеряем его, могут пострадать наши тактические исследования, хотя он является врагом нашего правительства, и поэтому он должен быть удален."
 GER_loyatly_oath: "Силовые прикрытия лояльности"
 GER_loyatly_oath_desc: "Мы наконец-то очистили многих из самых амбициозных военных чиновников и их подчиненных в Германии, но мы не можем позволить им стать мучениками среди новобранцев."
 GER_form_tst: "Нейорднунг Дойчландс"
 GER_form_tst_desc: "Поскольку последние следы сопротивления утихают, мы теперь в состоянии не только обеспечить политическое, но и символическое сохранение нашего места. Для подлинного национального возрождения необходимо отбросить иконографию и ловушки Республики, а на их месте поднимутся новые символы, представляющие новую Германию, которая с гордостью стоит на мировой сцене и ревниво защищает силу своего фюрера."
 GER_anti_commie: "Пропаганда антиколлективистов"
 GER_anti_commie_desc: "В Рейхе есть много людей, которые по-прежнему поддерживают коррумпированную и неэффективную идеологию социализма."
 GER_ban_unions: "ЗАПРЕЩЕНИЕ ПРОФЕССИОНАЛЬНЫХ ПРОФЕССИОНАЛЬНЫХ ПРОФЕССОВ"
 GER_ban_unions_desc: "Профсоюзы, как известно, коррумпированы и лишь стремятся встать на пути строительства и строительства нашего нового Рейха, поскольку они существуют только для того, чтобы еще больше помешать этому и бороться с ним, абсолютно необходимо, чтобы они были запрещены."
 GER_state_unions: "Создать контролируемые государством союзы"
 GER_state_unions_desc: "За каждой плитой бетона стоит человек, который закладывает ее. Трудящийся является важным инструментом, который создает и индустриализирует нацию. Профсоюзы стремятся защитить права работника, однако они делают это абсолютно неподходящим для любой нации образом, мы должны создать союзы, контролируемые государством, чтобы каждый трудящийся получил иллюзию о том, что у работника есть права, и извлечь из этого пользу."
 GER_ban_left_books: "Запрет левых литературных произведений"
 GER_ban_left_books_desc: "Хотя наша форма правления оказалась популярной среди более чем половины граждан Германии, все еще есть левые интеллектуалы, остающиеся от рака, который является Веймарской Республикой, и по-прежнему публикуют свои изменные мысли в своей страшной литературе, естественно, для поддержания поддержки мы должны уничтожить эти книги, чтобы сбить людей с пути большевизма."
 GER_no_commies: "Разрозненные коллективные организации"
 GER_no_commies_desc: "Благодаря нашим усилиям по сокращению поддержки социализма с помощью нашей пропаганды, мы наконец-то можем положить конец раку и болезням, которыми они являются, и никто даже не посмотрит в глаза."
 GER_western_focus: "Немецкие претензии на Западе"
 GER_western_focus_desc: "После нашей потери во время Великой войны мы лишились своей территории и были унижены западными державами."
 GER_anti_entente: "Пропаганда против сопричастности"
 GER_anti_entente_desc: "В самом сердце нашего поражения и потери нашей территории именно Энтенс принесла нашему Рейху большой позор. Теперь пришло время усилить пропаганду, показать многим немцам правду о Энтекте."
 GER_build_westwall: "Построить Westwall"
 GER_build_westwall_desc: "Во время Великой Войны одно из наших величайших поражений произошло, когда нас оттолкнули из Рейнленда, и в конце концов победили."
 GER_fate_of_rhine: "Судьба Рейна"
 GER_fate_of_rhine_desc: "В Рейнленде огромное немецкое население, которое по праву принадлежит нам, однако немцы в нем, к сожалению, угнетены французской оккупацией. После референдума ясно, что рейнские немцы больше не хотят заниматься оккупацией. Настало время вернуть их домой."
 GER_rhine_purge: "Ренишная чистка"
 GER_rhine_purge_desc: "Рейнленд, наконец, вернулся туда, где он должен быть, но есть много интеллектуалов, офицеров и политических чиновников, оставшихся от старого правительства, которое, несомненно, может вызвать проблемы у нашего правительства."
 GER_rhine_autonomy: "Ренистская автономия"
 GER_rhine_autonomy_desc: "Рейнленд, наконец, вернулся домой, однако после столь долгой французской оккупации нам, естественно, придется предоставить ему автономию и постепенно интегрировать его в Рейх, чтобы предотвратить любую дальнейшую оппозицию и по-прежнему использовать его ресурсы."
 GER_dismantle_entente: "Разрушить « Консенсус »"
 GER_dismantle_entente_desc: "Наконец-то мы вернулись на нашу территорию и собрали достаточно сил для того, чтобы отомстить за Великую Войну и наконец положить конец французам и Константу!"
 GER_austrian_ultimatum: "Австрийский ультиматум"
 GER_austrian_ultimatum_desc: "Когда придет время сражаться с Францией, они неизбежно призовут свою союзницу Италию в нашу войну, и мы не должны ограничиваться лишь Алсасом-Лорреном, поскольку это приведет к многочисленным застоям, не похожим на те, которые мы видели во время Великой войны, мы должны использовать Австрию для военного доступа, чтобы открыть второй фронт и повысить наши шансы на успех."
 GER_fall_of_france: "Падение Франции"
 GER_fall_of_france_desc: "Наконец-то мы победили французов и всех тех, кто погиб во время Великой войны и страдал под ними. Настало время, и мы должны решить, что нам делать с его бывшей территорией."
 GER_french_state: "Французское государство"
 GER_french_state_desc: "Мы успешно вернули наши земли из Франции и отомстили за всех тех, кто погиб во время войны, но мы не можем оставить Францию в покое, чтобы управлять собой, поскольку они будут лишь пытаться помешать нам в будущем. Мы поместим ее под контроль правительства Вальксита, чтобы она всегда оставалась верной."
 GER_french_puppet: "Французская кукла"
 GER_french_puppet_desc: "Хотя некоторые могут сказать, что мести достаточно, а значит, и наши новые земли, мы все еще должны реализовать мечту нашего Большого Немецкого Рейха, однако Франция слишком многого требует от нас, поэтому мы поставим преданного валькиста, как лидера, и создадим марионеточный режим, контролируемый нами."
 GER_expand_austria: "Расширение Австрии"
 GER_expand_austria_desc: "Со времени подписания Лондонского договора Италия оккупировала многие территории, которыми раньше владела Австрия, и эти земли на протяжении веков принадлежали Австрии, и итальянцы не заслуживают этого только из-за небольшого итальянского населения."
 GER_fall_of_italy: "Падение Италии"
 GER_fall_of_italy_desc: "Точно так же, как и ряд домино, Италия присоединилась к Франции, так же как и Франция, мы должны внимательно следить за тем, как мы должны управлять ею, а также управлять ее территориями."
 GER_italian_state: "Итальянское государство"
 GER_italian_state_desc: "Мы решили, что король умберто будет свергнут, и на его месте Итало Бальбо восстанет в качестве нового правителя Валькистской Италии и приведет их на путь процветания, порядка и стабильности в Италии через свою версию и Тенанта Валькизма, и останется верным нам при этом."
 GER_alpine_airbases: "Альпийские базы"
 GER_alpine_airbases_desc: "Когда придет время для Великой войны, нам необходимо иметь ценные воздушные базы, близкие к Италии и Франции, чтобы мы могли использовать их в координации с нашей армией для достижения ошеломляющей победы над ними. Мы должны создать базы в Альпах, поскольку они являются воротами для наших самолетов в Италию и Францию."
 GER_tyrol_forts: "Укрепить тирол"
 GER_tyrol_forts_desc: "Чтобы защитить многих немцев в Австрии от попадания в руки грязных итальянцев, мы должны разместить там войска и соорудить изощренные крепости, чтобы эти немцы никогда не были угнетены ими."
 GER_demand_tyrol: "Спрос Sudtirol"
 GER_demand_tyrol_desc: "Южный Тирол всегда был частью Австрии. Италия не заслуживает этого из-за небольшого итальянского населения и одного проклятого договора. Мы будем требовать от него Тирола, иначе будут ужасные последствия."
 GER_british_strategy: "Британская стратегия"
 GER_british_strategy_desc: "После Великой войны у Энтези-Пауэрс в конечном итоге возникли дипломатические разногласия в Версале. С тех пор Великобритания отступила от изоляционизма, и хотя французы и продолжают усугублять нас, они не вмешивались в него. Возможно, мы могли бы установить с ними связи, чтобы мы могли лучше подготовиться к возможной войне с Францией и не допускать их участия в ней."
 GER_british_alliance: "Сотрудничество с Великобританией"
 GER_british_alliance_desc: "После Версаля в конце концов проснулось многовековое франко-британское соперничество, и были разорваны дипломатические связи. Британия также хорошо служила королевству Пруссия и многим другим немцам в XVIII и XIX веке. Теперь, когда Энтези является нашим врагом, мы могли бы договориться о дипломатическом союзе с ними, чтобы сохранить баланс сил в Европе и предотвратить их вмешательство в нашу войну."
 GER_british_naval_treaty: "Переговоры по Бременскому соглашению"
 GER_british_naval_treaty_desc: "После налаживания дипломатических связей с Британской империей мы должны договориться с ними о статусе военно-морского договора, чтобы мы могли построить надлежащий и мощный флот, соответствующий нашему новому Рейху!"
 GER_anti_british: "Антибританская политика"
 GER_british_naval_treatytwo: "Переговоры по Бременскому соглашению"
 GER_british_naval_treatytwo_desc: "После налаживания дипломатических связей с Британской империей мы должны договориться с ними о статусе военно-морского договора, чтобы мы могли построить надлежащий и мощный флот, соответствующий нашему новому Рейху!"
 GER_anti_british: "Антибританская политика"
 GER_anti_british_desc: "Если бы не британцы, реализующие блокада Северного моря, мы бы выиграли Великую Войну. Это были те, кто настоял на том, чтобы ограбить наши земли в Версале и вынудил нас к суровому возмещению ущерба и заключению договоров. Мы должны попытаться предпринять действия, которые покажут, что мы не будем мириться с ними, и попытаться ограничить их влияние."
 GER_usa_support: "Поддержка США"
 GER_usa_support_desc: "Соединенные Штаты Америки располагают невероятно огромными и богатыми ресурсами, индустрией и людьми. Если бы они когда-нибудь воевали с нами, то это был бы один из наших величайших противников. Однако в настоящее время они втягиваются в политические разногласия с Мексикой, и если мы их поддерживаем, это может сделать нас дружественными по отношению к нам."
 GER_naval_buildup: "Наращивание военно-морского флота"
 GER_naval_buildup_desc: "У нас скоро будет большой флот, который будет оспаривать как Англию, так и Энтент, и вскоре Германия будет править волнами!"
 GER_normandy_base: "База в Нормандии"
 GER_normandy_base_desc: "Нормандия является одной из самых важных областей, где в военное время флот был создан, поскольку он был полезен для того, чтобы получить прямой контроль над Английским каналом, но также и полезный торговый порт, и район для получения поставок. Мы должны приобрести базу в Нормандии, так что мы можем использовать это для продвижения наших военно-морских целей в предстоящей войне."
 GER_norway_base: "Базы в Норвегии"
 GER_norway_base_desc: "Норвегия занимает одно из наиболее важных прибрежных районов, поскольку они обеспечивают большую гибкость в военно-морских вопросах в Северном море и Скандинавии, а также являются жизненно важными портами торговли, поставок и стыковки."
 GER_no_british_kiel: "Запрет Британии от кильского канала"
 GER_no_british_kiel_desc: "Кил стал одним из самых прибыльных и важных портово-торговых городов с течением времени. Большинство товаров из Центральной и Германии обычно продаются и экспортируются через Kiel. Таким образом, чтобы ограничить британское влияние и товары, мы запретим им доступ в этот ценный город."
 GER_krill_britain: "Противостояние льву"
 GER_krill_britain_desc: "Европа слишком мала для двух великих европейских держав. Англо продолжает передвигаться по каналу, угрожая срубить нас в момент слабости. Мы не проявим слабости."
 GER_central_europe: "Претензии в Центральной Европе"
 GER_central_europe_desc: "В самом сердце Европы большинство наших притязаний и немцев покидают наш дом. Настало время вернуть себе территории, которые по праву принадлежат нам, и вернуть туда немцев, живущих там, в законные дома. Мы должны также продемонстрировать, что мы доминируем в Центральной Европе, тем самым ограничивая шансы в нашу пользу."
 GER_austrian_coup: "Кубок валькистов в Австрии"
 GER_austrian_coup_desc: "После Великой войны Австрия была лишена многих своих прежних слав, престижа и земли и заменена слабой, неэффективной республикой."
 GER_annex_austria: "Приложение Австрии"
 GER_annex_austria_desc: "Австрия, несомненно, должна быть аннексирована, чтобы все немцы, находящиеся в ней, наконец, могли вернуться в свой законный дом, королевство и территорию."
 GER_austria_puppet: "Австрийская кукла"
 GER_austria_puppet_desc: "Многие в Австрии до сих пор держатся и ностальгируют за свой прежний престиж, порядок и власть, и многие из них хотят объединиться с немцами, но не за полную аннексию, мы должны вместо этого марионеткой куклы и помочь восстановить его славу."
 GER_berlin_award: "Венгерская поддержка в выпуске "Западославия""
 GER_berlin_award_desc: "Словакия, исторический регион Королевства Венгрия, была оккупирована Западославией после Великой войны, и этот регион явно находится в поле зрения венгерских националистов, и мы должны обратиться к Венгрии, чтобы поддержать наше вторжение в Западославию в обмен на эту территорию."
 GER_invade_bohemia: "Спрос на немецкую Западославию"
 GER_invade_bohemia_desc: "Теперь, когда мы отделили Западославию от ее соседей, мы можем безопасно потребовать оккупированных немецких территорий."
 GER_puppet_bohemia: "Куклы Западославия"
 GER_puppet_bohemia_desc: "Наконец, мы раз и навсегда положили конец чехам, однако, как бы непосредственно они ни аннексировались, это, безусловно, могло бы вызвать внутренние проблемы и конфликты, и, сделав это, мы все еще могли бы получить все блага, но ни один из недостатков, которые с ними связаны."
 GER_scandinavia_focus: "Дипломатия в Скандинавии"
 GER_scandinavia_focus_desc: "В Скандинавии находятся многие из наших территориальных притязаний, а также там, где могут быть и будущие союзники."
 GER_own_hamburg: "Собственность Гамбурга"
 GER_own_hamburg_desc: "Наконец-то нам удалось вернуть Гольштейна, и вместе с ним, Гамбург. Теперь, когда мы владеем городом, мы наконец можем использовать его статус как ценной военно-морской базы, так и международного торгового порта."
 GER_ban_danes: "Запрещение датчан от политики Гольштейна"
 GER_ban_danes_desc: "Именно датчане забрали у нас Гольштейна во время Великой войны, после этого невыносимого акта захвата мы не должны больше позволять им работать и управлять теми же городами и территориями, которые они украли."
 GER_annex_dane: "Дания"
 GER_annex_dane_desc: "После того, как мы избивали их на войне, мы не должны больше щадить датчан в течение какого-либо времени, с этого дня, до самого последнего, они навсегда останутся частью Рейха."
 GER_accept_danish_ministers: "Примите Датскую автономию"
 GER_accept_danish_ministers_desc: "Датцы доказали, что они относительно соблюдают наше правление над ними и до сих пор остаются лояльными, и для того, чтобы они не стали враждебными по отношению к нам, мы должны предоставить им форму самоуправления, чтобы они могли чувствовать, что у них есть автономия."
 GER_puppet_dane: "Кукольная Дания"
 GER_puppet_dane_desc: "Единственное, что нам нужно от Дании, это наши бывшие территории, и мы их достигли, но всегда хорошо распространять валькизм и расширять сферу нашего влияния."
 GER_swede_ministers: "Шведские министры"
 GER_swede_ministers_desc: "У Швеции, как и у нас, есть много ценных, образованных и высокоумных министров. Мы должны заключить сделку о направлении советников друг другу, как для того, чтобы укрепить нас в целом, так и для того, чтобы улучшить отношения."
 GER_swede_divisions: "Шведские отделения"
 GER_swede_divisions_desc: "В дни Паганов шведские викинги были легендарными за свои навыки и опыт в бою и общей войне."
 GER_swede_alliance: "Альянс со Швецией"
 GER_swede_alliance_desc: "Шведы нам очень помогли, и если бы мы смогли сделать их союзниками, это было бы очень ценно для нас обоих."
 GER_eastern_focus_desc: "На востоке находятся многие из наших бывших территорий, однако советская Менас до сих пор представляет собой призрак дегенеративного большевизма во всех странах и республиках Восточной Европы. Мы должны не только уничтожить их, но и весь Третий Интернационал."
 GER_polish_training: "Подготовка польских кадров"
 GER_polish_training_desc: "У польской армии достаточно людей, но она сильно отстает в некоторых современных и новейших технологиях для ее вооруженных сил, мы могли бы помочь модернизировать их военные силы, чтобы они могли противостоять советской угрозе."
 GER_polish_protection: "Польский альянс за немецкие территории"
 GER_polish_protection_desc: "В 1921 году польцам удалось успешно оттолкнуть советское вторжение, благодаря реке Вистула, офицерам и солдатам. Мы должны предоставить им дипломатическую защиту, чтобы они могли стать ценным союзником против советской угрозы. В обмен мы должны попросить их передать наши законные территории."
 GER_polish_forts2: "Укрепить польско-советскую границу"
 GER_polish_forts2_desc: "На случай, если Советы нападут первыми, или нам понадобится хорошее место, чтобы отступить и перегруппироваться, мы должны построить вдоль польско-советской границы подобающие укрепления, чтобы лучше подготовить нас к войне."
 GER_influence_baltics: "Влияние на Балтию"
 GER_influence_baltics_desc: "Литва по-прежнему находится под польским контролем и по-прежнему держит нашу прежнюю территорию, Мемельланд. Для того чтобы объединить балтийскую сторону с нами и вывести их из сферы влияния Польши, мы должны вооружить литовских националистов против их угнетателей."
 GER_spark_lits: "Осветить спарк в Литве"
 GER_spark_lits_desc: "Увы, несмотря на наши поставки оружия, литовцы до сих пор, похоже, довольствуются польским правлением железным кулаком."
 GER_polish_ultimatum: "Спрос на Литву"
 GER_polish_ultimatum_desc: "Наши прибалтийские братья в Литве кричат о свободе, и нам, наконец, пора потребовать от Польши отказаться от контроля над ними и вместо этого передать их нам."
 GER_puppet_lit: "Кукольная Литва"
 GER_puppet_lit_desc: "Теперь, когда польцы, наконец, отказались от контроля над Литвой, вместо того, чтобы аннексировать их, мы должны поддержать их суверенитет, чтобы как помочь населению в целом, так и получить Мемельланд."
 GER_take_memel: "Возьми Мемель."
 GER_take_memel_desc: "Теперь, когда мы наконец расширили сферу нашего влияния на Литву, мы должны вернуть территорию, которая была по праву нашей на протяжении всего этого времени."
 GER_annex_lit: "Литва"
 GER_annex_lit_desc: "Теперь, когда поляки, наконец, отказались от контроля над Литвой, мы должны не просто марионеткой, а а аннексировать ее для дальнейшего распространения идеологии валькизма на Балтию."
 GER_german_lit: "Немецкая Литва"
 GER_german_lit_desc: "Для того чтобы расширить германоязычное население Литвы и полностью интегрировать его, мы должны побудить многих немцев иммигрировать и поселиться там."
 GER_polish_war: "Война с поляком"
 GER_polish_war_desc: "Несмотря на то, что Польша уступила нам многие наши бывшие территории, мы не должны просто останавливаться на этом, мы должны наказать их за то, что они так часто сопротивлялись нам, и за то, что они давно лишили нас наших территорий, и мы покажем им свет валькизма, помимо этого."
 GER_polish_puppet: "Польская кукла"
 GER_polish_puppet_desc: "Однако полная аннексия просто не стоит того, так как создание нового валькистского правительства также сработало бы, а также могло бы помочь вдохновить поляков и сделать их ценным союзником для нас."
 GER_annex_poland: "Присоединение Польши."
 GER_annex_poland_desc: "Мы наконец-то погрузили грязные поляки в пыль, пора показать им истинный путь к валькизму, поставив их под наш прямой контроль, и завладеть многими ресурсами, которые несет Польша."
 GER_polish_forts: "Укрепить польско-советскую границу"
 GER_polish_forts_desc: "Теперь, когда мы поставили Королевство Польша в свое поле зрения, мы теперь имеем прямую границу с советской угрозой, мы должны должным образом укрепить эту границу, чтобы убедиться, что любые неожиданные нападения не поймают нас врасплох, и чтобы мы могли противостоять их наступкам."
 GER_demand_silesia: "Спрос"
 GER_demand_silesia_desc: "Поснан был несправедливо взят у нас после Великой войны, но он все еще содержит огромное немецкое население, которое должно по праву жить в нашем новом Большом Рейхе."
 GER_expel_polish: "Изгнать поляков из Поснана и Южной Пруссии"
 GER_expel_polish_desc: "Польские не заслуживают того, чтобы жить в том, что по праву и всегда было немецкой землей."
 GER_polish_citizenship: "Гражданство поляков"
 GER_polish_citizenship_desc: "Вместо того, чтобы массово депортировать поляков, мы можем поприветствовать их в наш Большой Рейх и показать им путь к истинному валькизму, предоставив им гражданство, и продемонстрировав им, что валькизм является истинной идеологией, которая заботится о народе."
 GER_romanian_protection: "Защита румын"
 GER_romanian_protection_desc: "There are many other countries in East Europe that are still haunted by the spectre of the Soviet Menace. The Republic of Romania is one of the many countries threatened by them.
 GER_romanian_forts: "Укрепить румынскую границу"
 GER_romanian_forts_desc: "Поскольку Румыния граничит с советской угрозой, мы должны активно укреплять ее, с тем чтобы большевизм никогда не достиг Балкан и не касался их."
 GER_reichskommissariat_ostland: "&quot; Рейхскоммиссарат Остленд &quot;"
 GER_reichskommissariat_ostland_desc: "На первом этапе нашего вторжения в советскую угрозу Балтии наконец-то попали под наш контроль. Теперь мы поставим их под марионеточный режим, управляемый одним из членов нашей валькистской партии, чтобы начать первые шаги нашего расширения."
 GER_reichskommissariat_ukraine: "&lt; &lt; Рейхскоммиссарат Украины &gt; &gt;"
 GER_reichskommissariat_ukraine_desc: "Благодаря нашим военным, мы смогли захватить ценный хлеб Европы, Украины, чтобы убедиться, что население не восстает, мы поместим его под новую, валькистскую администрацию."
 GER_reichskommissariat_kaukasus: "Рейхскоммиссарат Каукасус"
 GER_reichskommissariat_kaukasus_desc: "Мы снова смогли получить еще одну ценную часть советской угрозы, Каукасус, внутри которой находится ценное сельское хозяйство, нефть и гораздо больше ресурсов, чтобы сделать их ценными для нас, мы создадим марионеточную валькистскую администрацию и сделаем их безопасным местом для казаков, живущих там."
 GER_reichskommissariat_moskowien: "Московьен"
 GER_reichskommissariat_moskowien_desc: "Наконец-то мы захватили самое сердце советской угрозы и большевизма, и пришло время поставить ее под законную, валькистскую администрацию. Бывшие граждане и овцы увидят истинный путь к валькизму, и большевисм наконец придет к концу!"
 GER_reichskommissariat_turkestan: "Рейкоммиссарат Туркестан"
 GER_reichskommissariat_turkestan_desc: "Вместе с остальной советской угрозой Туркестан, наконец, упал, их земля мала и пуста, что идеально для новой немецкой колонии, богатой как ресурсами, так и немцами."
 GER_block_kiel: "Блокировать Советы из Киля"
 GER_block_kiel_desc: "Кил - один из многих ценных портовых городов, но грязный большевист все еще получает многие из своих товаров отсюда. Если мы сможем лишить их доступа к нему, это, несомненно, повлияет на их хрупкую экономику."
 GER_block_straights: "Блокировать босфорные проливы"
 GER_block_straights_desc: "Мы должны умирать от голода и высыхать от советской угрозы столько, сколько сможем, чтобы наконец положить конец их несчастным."International", and Bolshevism in Europe, and spread the great ideology of Valkism, and the influence of our Greater Reich!"
 GER_persian_bombers: "Кампания по бомбардировке города Баку"
 GER_persian_bombers_desc: "Османская империя близка к советской угрозе и разделяет нашу враждебность по отношению к ним. Мы должны использовать их воздушные базы и близость к Каукасу в нашу пользу. Бакинские нефтяные месторождения обеспечивают СССР большей частью поставок нефти. Уничтожение этих запасов может поставить Россию на колени."
 GER_finnish_forts: "Финские фортификации"
 GER_finnish_forts_desc: "С 1920-х годов Финляндия всегда была разделена между генералом Мандерхаймом и большевистом Финляндии. Настало время укрепить Финляндии Манхейма, так что советская Менас не распространяется дальше, и поэтому мы можем совершить нападение на Петроград с севера."
 GER_legacy_of_the_weltkrieg: "Наследие Вельткрига"
 GER_legacy_of_the_weltkrieg_desc: "Вельткриг был одним из самых дорогих и унизительных потерь в истории Германии, оставил глубокий шрам на нашем населении и на многих немцах в других местах, который никогда не будет полностью зажил. Мы должны двигаться вперед и попытаться исцелить этот психический шрам, реформировав вооруженные силы, чтобы мы больше никогда не проиграли."
 GER_bock_reform: "Реформы фон Бока"
 GER_bock_reform_desc: "Федор фон Бок быстро поднялся в ряды вооруженных сил и проявил себя как великий командир. &lt; &lt; Герр Бок &gt; &gt; предлагает нам принять доктрину бросания снарядов, а не людей в противника, используя поддержку и передовую артиллерию для достижения стратегических прорывов и побед против врага, а также создавая систему стандартного снаряжения."
 GER_research_advanced_equipment: "Усовершенствованное оборудование для исследований"
 GER_research_advanced_equipment_desc: "Для того чтобы должным образом модернизировать нашу армию с помощью новых технологий, нам необходимо выделять больше ресурсов на обучение тому, как делать новейшие вооружения и как делать это, с тем чтобы мы могли создать должным образом оснащенную современную армию."
 GER_war_economy: "Немецкая национальная мобилизация"
 GER_war_economy_desc: "Чтобы профинансировать наше восстановление наших законных территорий, победить Энтези и противостоять советской угрозе, мы должны подготовиться к быстрой и широкой мобилизации населения Германии."
 GER_seeckt_reform: "План Видеть"
 GER_seeckt_reform_desc: "Генерал Ханс фон Сикт предложил реформу немецкой структуры командования, которая основана на углубленном и стратегическом планировании для осуществления наступательных действий, а также на расширении возможностей командиров."
 GER_guderian_reform: "Реформа Гудериана"
 GER_guderian_reform_desc: "Один из ведущих экспертов в области мобильных боевых действий, Герр Гудериан, предложил реформу, основанную на тактических маневрах и тяжелых прорывах, используя танки и моторизованные машины для быстрого и быстрого продвижения вперед и подавив врага."Bewegungskrieg""
 GER_panzer_programs: "Программы панзеров"
 GER_panzer_programs_desc: "Чтобы лучше реализовать доктрину Гудериана Bewegungskrieg, мы должны начать программы, чтобы начать исследования по новейшим бронетехникам и цистернам, так что мы можем выполнить ее только самым лучшим немецким инженером."
 GER_tigerfibel: "Тигрфибель"
 GER_tigerfibel_desc: "Были предложены заключительные этапы доктрины Гудериана о Бевегунгскриге, что позволит нашим бронетранспортерам добиться больших успехов на территории и подавить врага сочетанием скорости и огневой мощи. С этой новой революционной доктриной наши танки будут непреодолимыми."
 GER_air_bases: "Строительство Луфтстрейткрэфте"
 GER_air_bases_desc: ""
 #GER_air_bases: "Строительство военно-воздушной базы"
 #GER_air_bases_desc: "С огромными успехами в самолётах и воздушной боестолкновении сильные военно-воздушные силы, безусловно, будут иметь важное значение для обеспечения ключевой победы, как для оказания помощи нашим войскам, так и для нанесения ущерба инфраструктуре и линиям снабжения противника."
 GER_goring_plan: "План Геринга"
 GER_goring_plan_desc: "Один из героев военно-воздушных сил Великой войны, также прибывший из эскадрильи Ричтофена Германн Геринг, предложил воздушную доктрину, основанную на среднем бомбардировщике, Heinkel He 111, которая включает сочетание стратегических бомбардировок в вражеской стране, а также обеспечение непосредственной воздушной поддержки наших войск на земле."
 GER_richtofen_plan: "План Ричтофена"
 GER_richtofen_plan_desc: "Наш величайший герой военно-воздушных сил от Великой войны, сам Красный барон, предложил доктрину военно-воздушных сил, основанную на достижении тактического превосходства, а также перехвате и сопровождении наших бомбардировщиков."
 GER_paratroopers: "Исследования в области десантников"
 GER_paratroopers_desc: "С недавним расширением и наращиванием «Люфтстрейткрэфте» было много призывов увеличить и обучить число паратроперов. Эти десантники были бы полезны, поскольку они могли бы легко пересечь хорошо защищенные линии врага и захватить ключевые города, крепости и города."
 GER_next_gen_fighters: "Боевики следующего поколения"
 GER_next_gen_fighters_desc: "Чтобы убедиться, что наши бойцы не что иное, как лучшие, и помочь нам добиться многих побед в воздухе, мы должны предпринять шаги к исследованию все большего числа самолетов следующего поколения, чтобы убедиться, что Луфтстрейткрэфте скоро будет править небесами!"
 GER_next_gen_bombers: "Бомбардировщики следующего поколения"
 GER_next_gen_bombers_desc: "Для того чтобы наши бомбардировщики нанесли как можно больший ущерб, а также для того, чтобы наземная поддержка наших войск была адекватной, мы должны предпринять шаги в направлении исследования новых, обновленных бомбардировщиков, чтобы обеспечить победу как в доме врагов, так и на полях боя для наших войск"
 GER_oslo_raid: "Инфильтировать Осло"
 GER_oslo_raid_desc: "Шведы находятся в состоянии войны с коммунистической нацией Норвегии, в настоящее время она сдерживается как локальный конфликт, но мы должны помочь повлиять на волну войны в пользу Швеции. Норвежская столица Осло очень близка к нашей собственной территории. Отто Скорзени был выбран группой военных планировщиков, чтобы проникнуть в город и саботировать их военную индустрию."
 GER_ruling_the_skies: "Регулирование неба"
 GER_ruling_the_skies_desc: "Первая цель каждой будущей операции должна состоять в том, чтобы обеспечить воздушное превосходство над вражескими силами."
 GER_raining_fire: "Огонь"
 GER_raining_fire_desc: "Мы должны нацелиться на вражеские позиции с целью их полного разрушения и без колебаний использовать наших бомбардировщиков в максимально возможной степени и уничтожить вражеские силы, прежде чем они могут создать опасность для наших собственных людей."
 GER_air_doctrine_effort_1: "Новые авиабазы"
 GER_air_doctrine_effort_1_desc: ""
 GER_air_doctrine_effort_2: "Воздушная оборона"
 GER_air_doctrine_effort_2_desc: ""
 GER_superiority_doctrine: "Защищать наши небеса"
 GER_superiority_doctrine_desc: ""
 GER_supporting_troops: "Поддержка наших людей"
 GER_supporting_troops_desc: ""
 GER_jet_fighters: "Реактивные истребители"
 GER_jet_fighters_desc: "Компания Эрнста Хайнкеля, Heinkel Flugzeugwerke, предложила планы для гипотетического истребителя с реактивными двигателями. Этот тип самолетов полностью превзошел бы все традиционные истребители на основе двигателей сгорания, которые используются в настоящее время. Heinkel предположил, что при большем финансировании производство этих самолетов может начаться в ближайшем будущем."
 GER_rockets: "Ракеты"
 GER_rockets_desc: "Немецкий инженер Вернер фон Браун подготовил проектную документацию для ракетного автономного оружия. Эти баллистические ракеты были бы дешевыми для создания, не требовали бы работы экипажа и причиняли бы значительный ущерб вражеской инфраструктуре. Брауну нужна лишь дополнительная техническая поддержка для того, чтобы обеспечить производство этого оружия."
 GER_jet_bombers: "Бомбардировщики реактивного типа"
 GER_jet_bombers_desc: "Эти реактивные бомбардировщики, как и их истребители, могли бы увеличить дальность и скорость по сравнению с обычными бомбардировщиками."
 GER_dockyards: "Крейгсмарин"
 GER_dockyards_desc: "Чтобы соревноваться на мировой арене, Германии понадобится мощный флот, способный совместить любую угрозу."
 GER_saalwachter: "План Салвахтера"
 GER_saalwachter_desc: "Для Германии, чтобы соревноваться с такими военно-морскими силами, как Великобритания, Альфред Салвахтер предлагает построить большой и разнообразный флот с достаточной способностью к проецированию энергии."
 GER_donitz: "План Доница"
 GER_donitz_desc: "Карл Дёниц возглавляет вокальную фракцию в Кригсмарине, которая считает, что Германия не будет готова к прямому взаимодействию с другими военно-морскими державами к тому времени, когда может разразиться другой конфликт."
 GER_raeder: "План Рейдера"
 GER_raeder_desc: "Немецкая индустрия является одним из наиболее развитых в мире, некоторые из самых впечатляющих средств ведения войны были разработаны в пределах наших границ, и в этой связи адмирал Эрих Рейдер разработал планы для мощных боевых кораблей, больших и более вооруженных, чем то, что в настоящее время производится Великобританией или Францией, с такими кораблями как это, которые являются ядром нашего флота, ни одна страна не сможет соперничать с нашей подавляющей огневой мощью."
 GER_rebuild_hamburg: "Восстановление Гамбурга"
 GER_rebuild_hamburg_desc: "Теперь, когда Гамбург воссоединился с Германией, мы должны устранить десятилетия ущерба, нанесенного неудачным правительством Киля, хотя это замедлило наши военно-морские планы перевооружения, это также дает нам возможность разработать более современные и специализированные объекты для ускорения будущего производства судов."
 GER_expand_seebattalion: "Расширить поле боя"
 GER_expand_seebattalion_desc: "Эта новая Великая война переросла в глобальный конфликт, наша армия в настоящее время не имеет ни опыта, ни подготовки к развертыванию за рубежом, мы должны приступить к созданию морских сил для противостояния вражеским войскам во всех уголках земного шара, если это необходимо."
 GER_invasion_transports: "Взрывные перевозки"
 GER_invasion_transports_desc: "Для противодействия вражеским угрозам в любом уголке земного шара необходимо будет разработать более передовые и способные перевозки войск."
 GER_modernize_the_fleet: "Модернизация флота"
 GER_modernize_the_fleet_desc: "Война с Францией еще больше подтолкнула наш флот, чем когда-либо прежде, и мы должны продолжать развивать наши корабли, чтобы противостоять любым успехам, которые пытаются сделать французы."
 GER_expand_navy_bases: "Расширение военно-морских баз"
 GER_expand_navy_bases_desc: "По мере того, как эта война с Францией перерастает в глобальный конфликт, мы как никогда нуждаемся в современных военно-морских объектах, которые могут обеспечить достаточное количество наших войск по всему миру."
 GER_protect_our_ports: "Защищать наши порты"
 GER_protect_our_ports_desc: "Многие из наших портов находятся в зоне рейдов как Франции, так и Великобритании."
 GER_volkdeutsch_jugend: "Volksdeutsche Jugend"
 GER_volkdeutsch_jugend_desc: "Молодежь - это будущее нашей нации, и как таковая она должна получить надлежащее образование по валькистской философии."
 GER_youth_military: "Программы выживания для молодежи"
 GER_youth_military_desc: "Европа — это суровое место. Враждебные отношения между странами переросли в глобальные конфликты, которые привели к гибели миллионов людей. Мужчины с раннего возраста должны быть обучены тактике выживания в случае, если вспыхнет еще одна Великая война, которая подтолкнет нашу страну к переломному моменту."
 GER_youth_support: "Роль военной поддержки немецкой молодежи"
 GER_youth_support_desc: "Хотя призывной возраст в Германии составляет 18 лет, офицеры армии предлагают снизить возраст добровольцев до 16 лет, эти молодые новобранцы будут выполнять не связанные с боевыми действиями функции поддержки, такие, как материально-техническая поддержка и строительство укреплений, что позволит пожилым солдатам принимать участие в передовых операциях. Многие в вашем кабинете, хотя и считают, что разрешение молодым людям отказаться от высшего образования негативно скажется на нашей администрации в долгосрочной перспективе."
 GER_civil_engineering: "Просвещение по вопросам гражданского строительства"
 GER_civil_engineering_desc: "После того, как Германия займет высочайшее положение на мировой арене, необходимо будет создать славные строительные проекты, чтобы навсегда обеспечить этот престиж. Будущие лидеры Германии должны быть хорошо образованы по дисциплине гражданского строительства, чтобы наша мечта могла стать реальностью."
 GER_community_projects: "Общинные проекты"
 GER_community_projects_desc: "В XX веке многие немцы по-прежнему живут в нищете. Это неприемлемое положение дел для современной валькистской нации. Все немцы обязаны оказывать поддержку своим соседям, если они в этом нуждаются."
 GER_family_farms: "Семейные фермы"
 GER_family_farms_desc: "Немецкий сельскохозяйственный сектор очень неэффективен. Наша страна по-прежнему обязана ежегодно импортировать миллионы тонн зерна только для того, чтобы правильно прокормить наш собственный народ. Ваш кабинет предложил ввести законы, требующие от всех немецких семей содержать личные сады, чтобы дополнить их потребности в питании, что отнимет значительную нагрузку на наш промышленный сельскохозяйственный сектор."
 GER_construct_airship: "Построить Зеппелин "Тангриснир""
 GER_construct_airship_desc: ""
 GER_valkist_tour: "Мировой тур валькистов"
 GER_valkist_tour_desc: "Таннгриснир - это новый пик в немецкой инженерии. Мы должны проверить способность на расстоянии и объезжать судно по всему земному шару. Слава Валькизма и Германии должна быть известна на всех уголках Земли."
 GER_high_espionage: "Высокоскоростное эспионирование"
 GER_high_espionage_desc: "Таннгриснир относится к классу зеппелинов, способных летать на большой высоте, практически не поддающихся обнаружению наземными силами. Мы могли бы использовать этот потенциал для разведывательных целей. Узнав местоположение нашего врага, наши войска получили бы ощутимое преимущество."
 GER_british_mission: "Миссия над Британскими островами"
 GER_british_mission_desc: "Военная ситуация вокруг Британских островов является в основном загадкой для нашего военного кабинета."
 GER_ussr_mission: "Миссия над Советским Союзом"
 GER_ussr_mission_desc: "Советский Союз является крупнейшей страной на Земле. Ни одна стандартная разведывательная операция никогда бы не надеялась собрать всю информацию, необходимую для успешного вторжения."
 GER_pangerman_policies: "Пангерманская политика"
 GER_pangerman_policies_desc: "Следует создать институт в интересах всех германских наций для общего блага друг друга."
 GER_valkist_education: "Стандартное валькистское образование"
 GER_valkist_education_desc: "Немецкие университеты должны преподавать только валькистские курсы, а образование должно быть сосредоточено на улучшении положения немецкого народа."
 GER_germanic_research: "Институт немецкой истории"
 GER_germanic_research_desc: "История немецкого народа длинная и экспансивная, но до того, как писания римских историков затерялись для нас. Институт исследований и открытий этой потерянной истории должен быть создан и использован для распространения чести доисторического немецкого общества."
 GER_archeology_mission: "Археологическая миссия в Скандинавию"
 GER_archeology_mission_desc: "По общему мнению ученых, немецкий народ родом из южной Скандинавии, чтобы раскрыть секреты нашего прошлого, мы должны послать археологию в Швецию для исследования ранних германских сайтов."
 GER_experimental_research: "Экспериментальные исследования"
 GER_experimental_research_desc: "Германия является лидером в научном мире и домом некоторых из ее величайших исследователей, среди которых ученые Конрад Зузе и Курт Дибнер, два человека, которые обратились к правительству с просьбой о финансировании их специализированных областей."
 GER_konrad_zuse: "Конрад Зузе"
 GER_konrad_zuse_desc: "Конрад Зузе — немецкий математик, который в настоящее время разрабатывает механические калькуляторы с электрическим приводом. Хотя их функционирование в настоящее время ограничено, Zuse предполагает, что их способность рассчитать большие уравнения вскоре превзойдет возможности человека. Эта расчетная мощность может быть использована как для шифрования наших передач, так и для расшифровки вражеских передач."
 GER_kurt_diebner: "Курт Дибнер"
 GER_kurt_diebner_desc: "Немецкий физик Курт Дибнер гипотетизировал потенциальное военное применение ядерного взрыва. Когда происходит расщепление невероятно большого количества энергии в процессе. Возможность создания взрывного оружия, основанного на этом явлении, дала бы Германии такое большое преимущество, что ни одна страна на Земле не смогла бы конкурировать, но в настоящее время в этой области было проведено мало исследований."
 GER_anti_speech: "Спорная смерть Герберта фон Бозе"
 GER_anti_speech_desc: "Герберт фон Бозе был вокальным противником режима Валькиста на протяжении многих лет, что привело к его недавней загадочной смерти. Несмотря на мрачные обстоятельства стрельбы, которая покончила с жизнью Боса в ту ночь, большинство международного сообщества согласились, что его смерть была предписана самим фюрером. Этот спор сделал Германию парией в Европейском сообществе."
 GER_inneficient_gov: "Очищенная бюрократия"
 GER_inneficient_gov_desc: "Многие из длинных политических деятелей режима Веймера либо были убиты, либо изгнаны из Германии, включая влиятельного бывшего канцлера Курта фон Шлейхера."
 GER_polish_arms_deal: "Польская оружейная сделка"
 GER_polish_arms_deal_desc: "Великая немецкая нация имеет большую индустрию с избытком неиспользованного оружия, однако наш восточный сосед имеет жалкую индустрию и заплатит хорошую цену за вооружение своих военных, так что мы сможем предложить им сделку, которая пойдет на пользу нам обоим."
 GER_lithuania_bases: "Литовские базы"
 GER_lithuania_bases_desc: "Литовская нация является просто рабом полюсов с крайне недостающей армией и военно-морскими силами. Мы должны предложить улучшить их военно-морские базы для нашей собственной выгоды, а также вырвать их из сферы полировки."
 GER_ban_rhine_workers: "Организация &lt; &lt; За запрещение рабочих-ренистов &gt; &gt;"
 GER_ban_rhine_workers_desc: "Ренишское государство, созданное после Великой войны, украло у нас большое количество немецкой промышленности. Даже сегодня рейнские рабочие работают в Германии, когда они живут в Рейнленде, крадут немецкие рабочие места. Слишком много немцев не имеют работы, в то время как рейнские мужчины работают на работу, на которую мы могли бы нанять немецких граждан. Поэтому мы должны запретить им работать здесь и конфисковывать принадлежащие Ренишу бюзнессы."
 GER_austrian_iron: "Австрийское железо"
 GER_austrian_iron_desc: "Мы хотели бы улучшить отношения с нашей соседкой Австрией, и после Великой войны у нас было много железа, так что Гитлер предлагает сделку с австрийцами, чтобы купить немного железа, чтобы заправить нашу индустрию."
 GER_danube_dam: "Проклятие Дуная"
 GER_danube_dam_desc: "Дунай является важной частью континента с тех пор, как появились европейские цивилизации, и наш министр Гитлер предлагает построить большую гидроэлектростанцию, чтобы получить энергию от великой реки, которая даст нам большое количество энергии, необходимой для финансирования промышленности Рейха, и даст нам больший контроль над большим континентом."
 GER_swedish_tungston: "Шведский импорт вольфрама"
 GER_swedish_tungston_desc: "Адмирал-нация далеко от севера, Швеция, имеет в своих северных провинциях большое количество вольфрама, которое им не нужно."
 GER_tax_kiel: "Налоговый канал &lt; &lt; Кильский канал &gt; &gt;"
 GER_tax_kiel_desc: "Кильский канал был для нас большим ресурсом до тех пор, пока мы не потеряли его для датчан после Великой войны."
 GER_sudetan_tariff: "Более низкие ставки"
 GER_sudetan_tariff_desc: "Министр экономики Гитлер видит отличную возможность, связанную с нашим соседом Западославией. Он предлагает, чтобы, если мы понизим тарифы на товары из немецкой Западославии, они скорее отправят товары через свою собственную промышленность, предпочтут экспортировать свои товары в нас, укрепив нашу экономику, в то же время нанося ущерб своей."
 GER_volksgemeinschaft: "Volksgemeinschaft"
 GER_volksgemeinschaft_desc: "Во время Великой войны Volksgemeinschaft использовали, чтобы объединить людей и разрушить барьеры классового и религиозного характера, разделяющие немецкий народ и побуждающие его поддержать войну."
 GER_expand_volkswohlfahrt: "Расширить Volkswohlfahrt"
 GER_expand_volkswohlfahrt_desc: "Немецкое население делает все, что в его силах, чтобы поддержать немецкую индустрию, так что меньшее, что мы могли бы сделать, это облегчить их удачу немцам. Мы расширим общественное благосостояние, с тем чтобы безработные или немцы с низкой заработной платой могли обеспечивать свои семьи и чтобы их больше поощряли поддерживать нашу индустрию."
 GER_establish_winterhilfswerk: "Учредить Винтерхилфсверк"
 GER_establish_winterhilfswerk_desc: "Зимы холодны и жестки в Германии, особенно для бедных или бездомных немцев, поэтому мы должны обеспечить наше население одеялами, кровом и питанием для немецкого народа."
 GER_maternity_services: "Услуги по беременности и родам"
 GER_maternity_services_desc: "Матери имеют жизненно важное значение для воспитания детей Рейха, и если они не поддерживаются мужем, мы должны помочь в воспитании следующего поколения."
 GER_public_education: "Просвещение общественности"
 GER_public_education_desc: "Мы должны поддерживать образование наших людей и инвестировать в науку, чтобы поддерживать наш Рейх продвинутым и образованным медицинским и военным."
 GER_create_cooperative: "Промышленная палата"
 GER_create_cooperative_desc: "Под руководством Страссера он предлагает полностью реформировать промышленность при новой Промышленной палате с новыми промышленными стандартами и производственными планами, что позволит нашей экономике резко ускорить темпы роста, намного превосходящие те, которые позволили бы осуществить старые реформы."
 GER_industry_standards: "Промышленные стандарты"
 GER_industry_standards_desc: "Мы должны установить правила для наших заводов, чтобы мы не производили плохие материалы, мы позаботимся о том, чтобы наши продукты были достойны выражения &quot; Mede in Germany &quot; ( &lt; &lt; Сделка в Германии &gt; &gt; )."
 GER_firearm_standards: "Правила, касающиеся огнестрельного оружия"
 GER_firearm_standards_desc: "Благодаря нашим промышленным реформам мы должны установить стандарты в отношении нашей военной техники, включая оружие, которое мы используем, чтобы вооружать наших солдат."
 GER_support_standards: "Положения о вспомогательном оборудовании"
 GER_support_standards_desc: "Благодаря нашим промышленным реформам мы должны установить стандарты в отношении нашей военной техники, включая технику, которую мы используем для вооружения наших вспомогательных групп, мы будем следить за тем, чтобы все оборудование было хорошо и легко изготовлено."
 GER_artillery_standards: "Артиллерийские правила"
 GER_artillery_standards_desc: "Благодаря нашим промышленным реформам мы должны установить стандарты в отношении нашей военной техники, включая артиллерию, которую мы используем в наших пехотных командах."
 GER_new_factories: "Новые фабрики"
 GER_new_factories_desc: "Нам нужно реиндустриализировать германскую нацию, построив больше фабрик, чтобы мы могли снова стать великими."
 GER_new_civilian: "Новые гражданские фабрики"
 GER_new_civilian_desc: "Наша гражданская индустрия была полностью закрыта после Великой Войны, так что нам нужно реиндустриализировать гражданскую индустрию."
 GER_new_military: "Новые военные фабрики"
 GER_new_military_desc: "После Великой войны наша военная индустрия была полностью отрезана, поэтому нам нужно репромышленность военной промышленности."
 GER_new_bunkers: "Новые бункеры"
 GER_new_bunkers_desc: "Мы должны восстановить нашу нацию, поскольку большинство наших крепостей были демонтированы Энтентом после Великой войны."
 GER_no_monopolies: "Антитрестовское законодательство Германии"
 GER_no_monopolies_desc: "Монополии являются паразитом в экономике Германии, используя снижение цен для того, чтобы сделать любую форму конкуренции невозможной, и тем самым сделать себя единственным вариантом при обмане людей с качественными товарами. Мы должны разработать антитрестовские законы, с тем чтобы сделать такую паразитическую систему невозможной. С помощью этих антитрестовских законов мы можем избавиться от монополий, развращающих наше великое государство."
 GER_worker_collective: "Трудящийся коллектив"
 GER_worker_collective_desc: "Мы должны провести новые реформы, чтобы избавиться от любых антирабочих настроений в нашей стране. &quot; Деловые круги с плохими условиями труда не служат ни государству, ни народу. &quot; Они заполняют только карманы жадных паразитов и мы должны реформировать систему, чтобы создать &quot; Коллективные рабочие &quot; для переговоров с деловыми кругами."
 GER_collective_autonomy: "Группы самостоятельного работника"
 GER_collective_autonomy_desc: "Мы должны позволить работникам сами требовать от них обращения с работниками предприятий и предприятий в ходе переговоров с владельцами предприятий, которые, в конце концов, будут знать больше об обращении с работниками, чем сами работники."
 GER_collective_state: "Государственные корпорации"
 GER_collective_state_desc: "Мы должны обсудить отношение к работникам с самими предприятиями в ходе переговоров."
 GER_absorb_private: "Частные сектора"
 GER_absorb_private_desc: "Немецкое государство должно поглотить ключевые части нашей промышленной базы, чтобы мы могли получить непосредственную прибыль от этой отрасли и обеспечить ее для самих людей."
 GER_high_taxes: "Повышение налогов"
 GER_high_taxes_desc: "Высокие люди в нашей стране почти ничего не отдают Германии, при этом слишком много карманно для личного эгоистического использования."
 GER_tst_external_police: "Набор внешних сотрудников в полицию"
 GER_tst_external_police_desc: "СТТ следует искать новых членов, которые могли бы помочь им в руководстве и работе в Тулесчутцтруппе."
 GER_tst_anti_partisan: "Профессиональная подготовка по вопросам борьбы с членством"
 GER_tst_anti_partisan_desc: "Мы должны научить TST уничтожить любые формы групп сопротивления, которые могли бы замышлять заговор против нашего великого Рейха."
 GER_tst_commisars: "Политические комиссары"
 GER_tst_commisars_desc: "Создание политических комиссаров в наших рядах помогло бы дисциплине и командованию Тулесчутштуппе, что позволило бы более надежно осуществлять операции в рамках наших полицейских сил, что сделало бы нашу работу эффективной и способной служить государству."
 GER_tst_internal: "Внутренний контроль за деятельностью полиции"
 GER_tst_internal_desc: "Внештатное присутствие лишь ослабит сердцевину того, за что выступает организация и что она готова делать."
 GER_tst_secret_police: "Укрепление сети секретной полиции"
 GER_tst_secret_police_desc: "Уолтер Шелленберг возглавляет Abteilung XIV 7a, которому поручено бороться с внутренними политическими врагами и иностранным влиянием на немецкие институты."
 GER_burgenland_issue: "Спрос на бургенланд из Венгрии"
 GER_burgenland_issue_desc: "Бургенланд, территория Королевства Венгрия во время правления Гапсбурга, является большей частью немецкой провинции, управляемой иностранными магиарами, и очевидно, что этот регион должен воссоединиться с Большим Немецким Рейхом, но эти амбиции могут поднять гнев Франции."
 GER_tst_support: "TST В вспомогательных ролях"
 GER_tst_support_desc: "Их предысторические операции дадут нашей армии поддержку, необходимую для решительных побед."
 GER_tst_defense: "Полк-инженер &lt; &lt; TST &gt; &gt;"
 GER_tst_defense_desc: "На ТБТ следует возложить задачу по строительству передовых укреплений для защиты нашей армии."
 GER_tst_scouts: "ОТК разведывательные полки"
 GER_tst_scouts_desc: "ТБТ следует поручить разведчикам перед нашей армией и найти вражеские силы и подходящие места для боевых действий."
 GER_tst_divisions: "Разделы TST"
 GER_tst_divisions_desc: "В качестве верховного эшелона наших вооруженных сил должны быть сформированы элитные отделы ТБТ."
 GER_tst_manse: "Контракт MAN SE"
 GER_tst_manse_desc: "Компания MAN SE, опытная в производстве доспехов, явно выбирает специализированное оборудование для Thuleschutztruppe."
 GER_tst_state: "Государственное бюро по ТБТ"
 GER_tst_state_desc: "Министр экономики Отто Страссер считает, что производство и организация Тулесчуцтруппе должны контролироваться правительственным учреждением, а не оставаться на усмотрение неэффективных частных фирм."
 GER_tst_db: "Контракт &quot; Даймлер-Бенз &quot;"
 GER_tst_db_desc: "В течение последнего десятилетия компания &quot; Даймлер-Бенз &quot; доказала, что она является надежным производителем автотранспортных средств. &quot; Использование &quot; этих транспортных средств для использования в военных целях &quot; обеспечит дивизии &quot; Тулесчутцтруппе &quot; скорость и мобильность, необходимые для решительных операций."
 GER_expand_state: "Расширение возможностей ТБТ"
 GER_expand_state_desc: "Война с Францией оставила нас под контролем многих оккупированных земель."
 GER_poland_award: "Поддержка Польши в выпуске "Западославия""
 GER_poland_award_desc: "Польша является естественным союзником против Западославии. После Великой войны Западославия была оставлена под контролем польского большинства Лемковины. Мы должны пригласить Польшу поддержать наше вторжение в Западославию в обмен на эту территорию."
 GER_british_military_training: "Англо-германские военные учения"
 GER_british_military_training_desc: "Чтобы укрепить наши отношения с англичанами, мы должны пригласить их на военные учения с нашими силами."
 GER_british_trade: "Торговое соглашение по тяжелой промышленности"
 GER_british_trade_desc: "Торговля является первым показателем мира между государствами."
 GER_british_faction: "Антифранцузский альянс"
 GER_british_faction_desc: "Британия находится в состоянии войны с нашим смертельным врагом, Францией, мы должны укрепить наши отношения с Великобританией и официально оформить официальный союз, вместе наши нации станут вершиной Нового Ордена."
 #
 GER_lion_and_eagle: "Льв и орел"
 GER_lion_and_eagle_desc: "В нашем правительстве больше англофильцев, таких, как Адольф Гитлер, Рудольф Хесс и Альфред Розенберг, поощряют отношения между нашими двумя нациями, с тем чтобы обеспечить наше господство и мир с нашими братьями."
 GER_support_the_british_empire: "Поддержка Британской империи"
 GER_support_the_british_empire_desc: "Мы не можем просто поддержать Британскую Империю словами, мы должны обязать людей и материальные средства сделать так, чтобы они стояли над миром, точно так же, как они помогут нам стоять над Европой."
 GER_anglo_saxon_brotherhood: "Англо-Саксонское возрождение"
 GER_anglo_saxon_brotherhood_desc: "Англичане имеют такую же германскую породу, как и мы, и продемонстрировали это в своем доминировании над миром как супердержавой. Однако у себя дома эта немецкая культура не так сильна, как раньше, несмотря на свою собственную гордую культуру. Мы должны поощрять более прочные культурные связи между нашими нациями и поощрять более немецкую Англию!"
 GER_to_rule_the_world: "Вместе Atop The World"
 GER_to_rule_the_world_desc: "С нашим господством на европейском континенте и британским господством над остальным миром можно действительно сказать, что германские народы доминируют во всем мире. Пусть наш новый мировой порядок продлится 1000 лет!"
 #
 GER_war_bohemia: "Инвад Западославия"
 GER_war_bohemia_desc: "Настало время навсегда уничтожить Западославию."
 GER_wartime_economy: "Министерство вооружений"
 GER_wartime_economy_desc: "Министр экономики Адольф Гитлер недавно предложил, чтобы наше правительство создало министерство вооружений, которое будет контролировать и влиять на нашу промышленность в соответствии с производственными требованиями."
 GER_foreign_workers: "Программы &quot; Форегин &quot;"
 GER_foreign_workers_desc: "По мере того как все больше и больше немецких мужчин набираются на военную службу, многие немецкие фабрики начали страдать от нехватки рабочих, что делает невозможным для них установление квот на производство, и приглашение рабочих с оккупированных территорий занять эту вакантную должность помогло бы разрядить эту ситуацию, но также было бы непопулярным для многих немецких националистов."
 GER_self_resposibility: "Самоотчуждаемость промышленности"
 GER_self_resposibility_desc: "Бюрократия нашего правительства лишь замедлила усилия нашей промышленности по адаптации к военным усилиям Адольф Гитлер предложил форму экономической автономии немецких промышленных гигантов, которую он называет "самоответственностью"."
 GER_specialize_equipment: "Специализация оборудования"
 GER_specialize_equipment_desc: "Пытаясь упорядочить производство оружия в Германии, Адольф Гитлер разработал план, в котором каждая фабрика будет фокусироваться на одном продукте, что поможет уменьшить неуспеваемость в наших методах производства."
 GER_autobahn: "Автобан"
 GER_autobahn_desc: ""
 GER_air_defenses: "Противовоздушное производство"
 GER_air_defenses_desc: "Во время второй Великой войны наши враги пытаются уничтожить нашу индустрию, бомбардируя кампании, чтобы помочь защититься от этого, мы должны сосредоточиться на создании дополнительных противовоздушных оборон для наших городов."
 GER_underground_industry: "Подземные производственные объекты"
 GER_underground_industry_desc: "Очевидно, что нашей противовоздушной обороны может быть недостаточно для защиты всех наших заводов от налетов противника."
 GER_west_industry: "Эвакуировать промышленность из Западной Германии"
 GER_west_industry_desc: "По мере того, как вражеские силы возвращают нашу армию обратно в Отечество, очевидно, что большая часть нашей промышленности рискует попасть туда, мы должны эвакуировать ту отрасль, которую мы можем приблизить к Берлину, пока еще можем."
 GER_east_industry: "Эвакуировать промышленность из Восточной Германии"
 GER_east_industry_desc: "По мере того, как вражеская армия возвращает нашу армию в Западную Пруссию, очевидно, что большая часть нашей промышленности рискует попасть туда, мы должны эвакуировать ту отрасль, которую мы можем приблизить к Берлину, пока еще можем."
 GER_Alpenfestung: "Альпенфестунг"
 GER_Alpenfestung_desc: "Очевидно, что наши военные усилия рушатся, наши враги идут в нашу нацию, и наша способность сопротивляться продолжает уменьшаться."
 GER_slovakia_alliance: "Альянс со Словакией"
 GER_slovakia_alliance_desc: "Чтобы еще больше ослабить позицию Западославии в Центральной Европе, мы должны стремиться к альянсу с Восточно-Соседью Словакией."
 GER_slovakia_support: "Оказание поддержки Словакии"
 GER_slovakia_support_desc: "Теперь, когда мы объединяемся с небольшой нацией Словакии, в наших наилучших интересах будет оказывать материальную и техническую поддержку словацкой армии."
 GER_ukraine_wheat: "Импорт украинского пшеницы"
 GER_ukraine_wheat_desc: "Сельскохозяйственный сектор Германии напрягается под весом быстро растущего населения, и, поскольку земля падает до разрастания городов, она меньше доступна для сельского хозяйства. Украина хорошо известна как хлебная корзина Европы. Торговая сделка с ними может помочь положить конец любым страхам голода."
 GER_ukraine_oil: "Украинская нефтяная экспансия"
 GER_ukraine_oil_desc: "По мере быстрого роста и модернизации нашей армии становится ясно, что местные источники нефти не могут удовлетворить наши потребности."
 GER_baltic_front: "Давление в балтийских государствах"
 GER_baltic_front_desc: "Мы должны заставить нас оказать влияние на Латвию и Эстонию, прежде чем они смогут упасть в советский мир."
 GER_polish_claims: "Марш в Украину"
 GER_polish_claims_desc: "Во многом мы сражались во время Великой войны, чтобы вырвать восточные территории из-под влияния русского медведя, чтобы они не могли вновь угрожать нам. Для этого защита Украины была бы нашим коронным драгоценностями, но, к сожалению, мы не одержали победы. Теперь, когда Польша защищена и Украина изолирована, мы войдем прямо в Киев и объявим рейхскомисариат!"
 GER_attack_belarus: "Инвад Белоруссия"
 GER_attack_belarus_desc: "Беларусь слаба, разделена и неспособна защитить себя, и если мы не возьмем ее для себя, то она будет только под угрозой Советского Союза."
 GER_east_friends: "Восточноевропейская информационно-пропагандистская деятельность"
 GER_east_friends_desc: "Страны Восточной Европы постоянно рискуют попасть под советское влияние."
 GER_belarus_front: "Поездка в Минск"
 GER_belarus_front_desc: "Нация Беларуси находится в ключевом положении для того, чтобы угрожать Советским Союзам, с их аэродромов мы можем опозорить Москву, быть и союзничать с Беларусью имеет огромное значение."
 GER_ukraine_front: "Коммиссары в Киеве"
 GER_ukraine_front_desc: "На протяжении десятилетий Украина была хлебной корзиной, питающей большую часть Европы."
 GER_finland_front: "Финские друзья"
 GER_finland_front_desc: "Финляндия не может надеяться встать против Советов в одиночку, мы должны отстранить Советов от дальнейшего влияния на балтизме и привести Финляндию в Штальпакт. С такой договоренностью мы легко сможем вытеснить русских из Балтии, когда захотим."
 GER_ottoman_front: "Разговоры с турками"
 GER_ottoman_front_desc: "Как наш бывший союзник во время Великой Войны, Турция с любовью воспринимается многими немецкими ветеранами как неудачник, способный защитить себя от доминирующих британских сил. Два десятилетия спустя Турция оказалась в ключевом положении для нанесения удара как по советским владениям Черного моря, так и по оккупированному Леванту. Возможно, в наших интересах восстановить Тёркси-германский союз."

 ### Events ###
 gerblackwed.1.d: "Несмотря на то, что Германия не столь связана в международной экономике, как другие страны, в целом из-за более аутактической экономики, она по-прежнему активно торгует с Великобританией." 
 ger.10.t: "[ГЕР. Найдите национальный адрес]"
 ger.10.d: "10/10 - отличная речь."
 ger.10.a: "Да здравствует Германия!"
 ger.11.t: "Пангерманизм как наша внешняя политика"
 ger.11.d: "После нашего позорного поражения в Великой войне немецкий народ был несправедливо разделен между многими нациями. Эти государства не являются подлинными государствами с каким-либо наследием, но были неестественно замыслины победителями в попытке погубить нашу родину. Основатель Валькистской партии - это окончательное воссоединение всего немецкого народа любыми средствами. Подлинно перерождение Германии тянется от Нанцига до Посана и Кила до Лайбача."
 ger.11.a: "Однажды все немцы с гордостью назовут свой дом "Деучленд"."
 ger.100.t: "[ГЕР. Получите письмо-поддержку]"
 ger.100.d: "Канцлер Германии, [ГЕР.Главный лидер], направил письмо, прославляющее наше великое государство. [ГЕР.Главный лидер] прославляет уникальную историю нашей страны и силу таких лидеров, как Сунь Ят Сен, чтобы так быстро превратить ее в великую силу. [ГЕР.Главный лидер] завершает письмо словами: "Я никогда не считал, что китайцы ниже нас самих. Вы принадлежите к древней цивилизации, и я свободно признаю, что ваша история выше нашей собственной. Вы имеете право гордиться этим прошлым, как и мы имеем право гордиться цивилизацией, к которой мы принадлежим. Я верю, что чем терпимее китайцы будут гордиться своим прошлым, тем легче нашим народам будет мирно сосуществовать"."
 ger.100.a: "Мы запомним этот подарок."
 ger.101.t: "Германия предлагает советников"
 ger.101.d: "Мощное государство Германии предложило направить советников в нашу страну, чтобы помочь нашей армии в модернизации, хотя их советы и усилия будут почти наверняка полезны, было бы позором подтолкнуть местных китайских министров к оттеснению на сторону в пользу этих иностранных бюрократов."
 ger.101.a: "Примите помощь Германии."
 ger.101.b: "Нам лучше быть самим по себе."
 ger.102.t: "Германия предлагает альянс"
 ger.102.d: "Наш друг Германия послал нам официальное приглашение присоединиться к их альянсу "Штальпакт". В эти неспокойные времена, возможно, в наших интересах принять это приглашение. Сдерживание от угрозы коммунизма будет приветствоваться, но в то же время Германия может подтолкнуть нас к войне, в которую мы не готовы сражаться."
 ger.102.a: "Вместе мы можем бороться с коммунистическим бедствием."
 ger.102.b: "Мы не готовы к длительному конфликту."
 ger.103.t: "Китай отворачивается от наших советников"
 ger.103.d: "Китай отказался от нашего предложения направить советников, чтобы помочь реформировать свое правительство."
 ger.103.a: "В любом случае, нам лучше смотреть в Европу."
 ger.104.t: "Китай отказывается присоединиться к нашему альянсу."
 ger.104.d: "Китай отказался принять наш военный союз, мы сделали многое, чтобы улучшить отношения со своей страной, и это очень огорчает, что они не хотят брать на себя больше обязательств в отношении продолжения дружбы."
 ger.104.a: "Китай был пустой тратой времени."
 ger.105.t: "Валькист пошёл в Вену!"
 ger.105.d: "Тысячи членов Валькистской партии Австрии пытаются оказать давление и свергнуть наше правительство."
 ger.105.a: "Защищать здание парламента любой ценой."
 ger.106.t: "Австрия просит о помощи"
 ger.106.d: "Австрийский народ попросил нас поддержать его против угрозы Германии. В Версальском договоре ясно говорится, что союз между этими нациями является незаконным, и без буфера Австрии весь Балканский полуостров может оказаться под угрозой Валькиста. В наших интересах, возможно, противостоять угрозе Германии сейчас, а не позже, когда они собрали больше сил, но многие из наших генералов предупреждают нас, что наша армия может не быть готова к войне в настоящее время."
 ger.106.a: "Мы не должны позволять Германии отбирать Европу по отдельности."
 ger.106.b: "Зачем умирать за Дюрнкрута?"
 ger.107.t: "Франция отказывается поддержать нас."
 ger.107.d: "Наша делегация во Франции сообщила, что у ее правительства нет намерений выступать за Австрию против немецкой угрозы. Мы потратили слишком много драгоценного времени на французов, и теперь германский ультиматум приближается к своему сроку. Похоже, у нас не будет иного выбора, кроме как привлечь всех трудоспособных людей к оружию и борьбе за защиту нашей родины."
 ger.107.a: "Быстрее к оружию!"
 ger.108.t: "Австрия проигнорировала ультиматум."
 ger.108.d: "Вчера мы предложили жалкому австрийскому народу присоединиться к великой немецкой империи. Как бы великодушным ни было наше предложение, австрийские политики, слепые к желаниям своего народа, предпочли игнорировать его. Ни одна страна в Европе не выступала против наших притязаний на альпийскую территорию, и поэтому нам не нужно будет беспокоиться о каком-либо иностранном вмешательстве по мере того, как наши армии придут в Австрию."
 ger.108.a: "Мы будем ужинать в Вене к концу недели."
 ger.109.t: "Германия требует проведения референдума в Шлезвиг-Гольштейне"
 ger.109.d: "В 1919 году, когда началась Великая война, наше правительство решило вмешаться против Германии, чтобы вернуть наши территории, утраченные во время Второй Шлезвигской войны. Наши элитные мобильные подразделения в то время были одними из лучших обученных и оснащенных дивизий во всей Европе. Немецкая империя оставила несколько отсталых бригад для защиты своей северной границы, и в течение двух дней после объявления войны мы достигли окраины Берлина. Немецкая империя быстро призвала к перемирию. Стратегия, используемая для достижения этой быстрой и ошеломляющей победы, была с тех пор названа историками "Линкриг" или "Лайтинг Война". В 1919 году наши вооруженные силы были серьезно проигнорированы, так что мы не можем просто игнорировать эту просьбу и риск, связанный с войной, но это также было бы большим оскорблением против нашей нации, чтобы позволить Германии разлучить нас."
 ger.109.a: "Конечно, даже наши германские граждане гордятся тем, что они - датчане."
 ger.109.b: "Нам нужна поддержка Франции."
 ger.110.t: "Дания принимает наше предложение о референдуме"
 ger.110.d: "Дания выполнила наши требования, и сейчас проводится референдум для урегулирования «вопроса Гольштейна», результаты этого референдума не важны, но теперь у нас есть ясное свидетельство того, что европейское сообщество не будет вмешиваться в наш путь, когда мы вернем то, что принадлежит нам."
 ger.110.a: "Шлезвиг-Гольштейн снова немецкий!"
 ger.111.t: "Дания просит о помощи"
 ger.111.d: "Датский народ попросил нас поддержать его против угрозы Германии, Версальский договор наградил Гольштейна Данией, и поэтому его следует уважать, и без буфера Дании все скандинавские страны могут оказаться под угрозой Валькиста. Возможно, в наших интересах противостоять угрозе Германии сейчас, а не позже, когда они собрали больше сил, но многие из наших генералов предупреждают нас, что наша армия, возможно, не готова бороться с крупной войной в настоящее время."
 ger.111.a: "Мы не должны позволять Германии отбирать Европу по отдельности."
 ger.111.b: "Зачем умирать за Данию?"
 ger.112.t: "Франция отказывается поддержать нас."
 ger.112.d: "Наша делегация во Франции сообщила, что у ее правительства нет намерений выступать за Данию против немецкой угрозы. Мы потратили слишком много драгоценного времени на французов, и теперь германский ультиматум приближается к своему сроку. Похоже, у нас не будет иного выбора, кроме как привлечь всех трудоспособных людей к оружию и борьбе за защиту нашей родины."
 ger.112.a: "Быстрее к оружию!"
 ger.113.t: "Дания проигнорировала ультиматум."
 ger.113.d: "Вчера мы потребовали, чтобы Дания позволила немецкому народу в его стране выбрать страну, в которой он должен жить. Как бы справедливо ни было наше предложение, датские политики, слепые к желаниям своего народа, решили проигнорировать его. Теперь в наших руках принятие этого решения для них. Ни одна страна в Европе не выступает против наших притязаний на Гольштейн, и поэтому нам не нужно беспокоиться о каком-либо иностранном вмешательстве по мере того, как наши армии придут в Данию."
 ger.113.a: "Балтийское побережье скоро станет немецким."
 ger.114.t: "Западославия умирает."
 ger.114.d: "Правительство Западославии оказалось совершенно неэффективным, и теперь их нация разваливается, их экономика рухнула, они бунты на улицах, и их лидеры прячутся в столице, чтобы спастись от хаоса."
 ger.114.a: "Западославия мертва, Да здравствует Германия!"
 ger.114.b: "Мы не можем рисковать войной с французами."
 ger.115.t: "Западославия мертва."
 ger.115.d: "Правительство Западославии оказалось совершенно неэффективным, и теперь их нация почти не существует. Германия уже укусила первый раз. Пришло время вернуть нашу северную территорию."
 ger.115.a: "Западославия мертва, Да здравствует Австрия!"
 ger.116.t: "Немецкий сепаратизм"
 ger.116.d: "Германия финансирует сепаратистские группы в Западославии. У нашего правительства достаточно проблем, чтобы это оказало огромное дестабилизирующее воздействие на нашу страну."
 ger.116.a: "Чертовы немцы!"
 ger.117.t: "Судьба Дании"
 ger.117.d: "Балтийская линия жизни - это линия жизни Германии, без нее наша нация бы голодала. Контроль над ней имеет первостепенное значение, если мы хотим подтвердить наше господство по всей Европе. Энтези не проявила интереса к защите Дании, и как таковая у нас будет свободное правление, чтобы диктовать нашу волю крошечной нации. Многие планы были направлены вперед. Что нам делать?"
 ger.117.a: "Включите Данию в Рейх."
 ger.117.b: "Возьми Джутланд и отдай остальное Швеции."
 ger.117.c: "Возьмите Шлезвига и создайте дружественный режим в Дании."
 ger.118.t: "Германия требует проведения референдума в Рейнленде"
 ger.118.d: "Германия требует, чтобы мы позволили провести референдум в Рейнленде для определения того, в какой стране будет проживать рейнский народ. &lt; &lt; Ренишный национализм &gt; &gt; почти не существует, и народная партия &lt; &lt; Рениш Валькист &gt; &gt; на протяжении многих лет выступает за возвращение в Германию, так что любой референдум, скорее всего, не закончится в нашу пользу, а, с другой стороны, все демократические нации заслуживают права на самоопределение."
 ger.118.a: "Пусть референдум будет продолжен."
 ger.118.b: "Мы не можем позволить немцам так ослабить нас."
 ger.119.t: "Франция допускает проведение референдума в нашей стране"
 ger.119.d: "После оказания давления со стороны Германии Франция разрешила провести референдум по вопросу о союзе с Германией. Валькистская партия в нашей стране была более чем счастлива подтолкнуть прогерманскую пропаганду и их усилия окупились. Похоже, большинство нашего народа предпочли бы жить в Германии. Рейнлендский эксперимент закончился."
 ger.119.a: "Рейнленд мертв, Да здравствует Германия!"
 ger.120.t: "Франция отказывается от проведения референдума в Рейнленде"
 ger.120.d: "Упрямое французское правительство отказывается слушать желания немецкого народа в Рейнленде."
 ger.120.a: "Мы спасем Рейн от французской тирании!"
 ger.121.t: "Поддержать индийскую борьбу?"
 ger.121.d: "Мы должны использовать любую возможность, чтобы ослабить Британскую Империю."
 ger.121.a: "Подготовить поставки"
 ger.121.b: "У нас есть другие потребности, на которых мы должны сосредоточиться."
 ger.122.t: "Германия предлагает нам поддержку."
 ger.122.d: "Враг нашего врага - наш друг. Германия предложила послать наших новых национальных советников. Они помогут реформировать нашу армию и переключить нашу промышленность на военную экономику. Какими бы полезными ни были немцы, наше движение может показаться слабым, если мы позволим другому европейскому государству вновь повлиять на нашу страну."
 ger.122.a: "Мы должны принять любую помощь, которую мы можем получить."
 ger.122.b: "Освобождение Индии должно осуществляться индейцами."
 ger.123.t: "Германия толкает валькизм на Норвегию"
 ger.123.d: "Пытаясь приблизить нашу страну к сфере своего влияния, Германия оказывает поддержку ультраправым националистическим группировкам в нашей стране, несмотря на это, мы полностью уверены в том, что наш народ откажется от этой "валькистской" ерунды."
 ger.123.a: "Норвегия не будет играть вторую скрипку в Германии."
 ger.124.t: "Германия предлагает нам союз"
 ger.124.d: "Германия, самая могущественная страна в Балтии, предложила нам присоединиться к своему военному альянсу "Штальпакт". С угрозой советских войск на востоке, возможно, в наших интересах иметь могущественного союзника, на которого мы можем положиться, но Германия также может втянуть нас в войну, с которой мы не хотим бороться. Что нам делать?"
 ger.124.a: "Немецкое братство!"
 ger.124.b: "Мы бы предпочли оставаться нейтральными."
 ger.125.t: "Германия предлагает нам союз"
 ger.125.d: "Германия, самая могущественная страна в Балтии, предложила нам присоединиться к своему военному альянсу "Штальпакт". С угрозой советских войск на востоке, возможно, в наших интересах иметь могущественного союзника, на которого мы можем положиться, но Германия также может втянуть нас в войну, с которой мы не хотим бороться. Что нам делать?"
 ger.125.a: "Немецкое братство!"
 ger.125.b: "Мы бы предпочли оставаться нейтральными."
 ger.126.t: "Германия требует Альзаса."
 ger.126.d: "Наш соперник Германия требует, чтобы наша основная территория Альзаса. Наши солдаты уже прибывают на германскую границу, чтобы защитить регион. Германия знает, что мы не можем принять это предложение, это просто касус белли, чтобы вторгнуться в нашу страну. То, что мы делаем сейчас, будет непосредственно определять курс, который будет определять Европу на протяжении десятилетий. Нам нужно принять мудрое решение."
 ger.126.a: "Потеря одного региона не стоит миллионов смертей."
 ger.126.b: "Ильс не прохожий пас!"
 ger.127.t: "Франция отказывается от нашего требования"
 ger.127.d: "Франция решила сохранить территорию Альзаса, но теперь у нас есть необходимое оправдание для того, чтобы пойти в их страну и уничтожить их армию."
 ger.127.a: "Мы отомстим за Великую Войну!"
 ger.128.t: "Франция сдает альзас"
 ger.128.d: "Французы - трусливый народ, который не может сражаться со своими сражениями и будет дрожать даже от малейших угроз."
 ger.128.a: "Германия действительно является хозяином Европы."
 ger.129.t: "Встреча на высшем уровне в Трансильвании"
 ger.129.d: "Когда власти Энтези разделили Европу после Великой войны, они оставили народ Трансильвании без гражданства, французы и британцы не смогли договориться о том, какую страну, Венгрию или Румынию, они должны принадлежать, и этот вопрос остается нерешенным. Мы пригласим обе стороны и поможем принять окончательное решение."
 ger.129.a: "Венгрия, давний немецкий союзник, заслуживает Трансильвании."
 ger.129.b: "Румыния, наш враг во время Великой войны, но возможный союзник против Советов, заслуживает Трансильвании."
 ger.130.t: "Германия присуждает нам Трансильванию."
 ger.130.d: "Германия наградила нас нашей законной территорией Трансильвании."
 ger.130.a: "Тост за наших немецких друзей."
 ger.131.t: "Германия присуждает нам Трансильванию"
 ger.131.d: "Германия наградила нас нашей законной территорией Трансильвании."
 ger.131.a: "Тост за наших немецких друзей."
 ger.132.t: "Австрия сворачивается"
 ger.132.d: "Австрийское правительство сложило руки от давления своего народа и сдало всю автономию немецкому правительству."
 ger.132.a: "Сейчас Австрийская Республика является лишь примечанием истории."
 ger.133.t: "Германия требует Литвы"
 ger.133.d: "Большинство членов парламента согласны с тем, что наш доступ к балтизму имеет огромное значение для нашего суверенитета, и мы должны защищать его любой ценой, но многие должны защищать его справа, некоторые из которых подозреваются в немецком сочувствии, мы должны организовать нашу нацию вокруг про-Германияской внешней политики."
 ger.133.a: "Германия действительно наш друг."
 ger.133.b: "Германия всегда была врагом Польши."
 ger.134.t: "Польша хочет нашей помощи."
 ger.134.d: "Правительство Польши попросило нашу страну предоставить им защиту от Германии. Валькистское правительство использует германские националистические настроения в Литве в качестве предлога для аннексии этого региона. Очевидно, что это лишь первый шаг в плане получения полного влияния в Восточной Европе. Это явное нарушение Версальского договора и стало бы серьезной угрозой безопасности для нашей страны, но единственный порт Польши находится в глубине германских вод, что почти невозможно оказать им любую серьезную поддержку."
 ger.134.a: "Франция будет защищать своих друзей."
 ger.134.b: "Зачем умирать за Друскининкай?"
 ger.135.t: "Франция отказывается поддержать нас."
 ger.135.d: "Наша делегация во Франции сообщила, что у ее правительства нет намерений выступать за Польшу против немецкой угрозы. Мы потратили слишком много драгоценного времени на французов, и теперь германский ультиматум приближается к установленному сроку. Похоже, у нас не будет иного выбора, кроме как привлечь всех способных людей к оружию и борьбе за защиту нашей родины."
 ger.135.a: "Быстрее к оружию!"
 ger.136.t: "Польша проигнорировала ультиматум."
 ger.136.d: "Вчера мы потребовали, чтобы жалкая польская нация позволила своему немецкому народу вернуться в свой истинный дом. Как бы справедливо ни было наше предложение, польские политики, слепые к желаниям своего народа, предпочли игнорировать его. Ни одна нация в Европе не выступала против наших притязаний на Литву, и поэтому нам не нужно беспокоиться о каком-либо иностранном вмешательстве по мере того, как наши армии придут на балтийскую территорию."
 ger.136.a: "Мы обезопасим нашу Восточную границу."
 ger.1362.t: "Франция поддерживает польский суверенитет"
 ger.1362.d: "Несмотря на нашу благородную поддержку литовского дела, «Согласие» решило отказаться от всех принципов и поддержать польское порабощение Литвы."
 ger.1362.a: "Мы обезопасим нашу Восточную границу."
 ger.137.t: "Кризис в Гольштейне - Судьба датских арктических территорий"
 ger.137.d: "Гольштейнский кризис между Германией и Данией не смог найти мирного решения, и теперь эти страны находятся в состоянии войны. Ясно, что Германия вскоре станет победителем в этом конфликте и как таковая может оставить их под контролем Арктических территорий Исландии, Гренландии и Фарерских островов. Эти острова могут быть использованы в качестве базы для размещения кораблей и бомбардировщиков в радиусе действия, чтобы легко нанести удар по Британским островам. Мы не можем допустить этого. Корабли и морские пехотинцы уже готовятся захватить эти районы, и теперь нам нужно ваше слово."
 ger.137.a: "Операция может пройти."
 ger.138.t: "Немецкая армия марширует на Брно"
 ger.138.d: "С тех пор, как разразился Судейский кризис, немецкое правительство оказало большое влияние на нашу политику, и теперь их армия марширует на нашу столицу. Западославия станет новой провинцией Немецкого Рейха. Конец Западославии близок."
 ger.138.a: "Западославия мертва."
 ger.139.t: "Германия требует немецкой Западославии"
 ger.139.d: "Немецкие националисты на севере нашей страны привлекли внимание Германии. Валькистский режим требует, чтобы мы передали им эти регионы. Наша нация не в состоянии сражаться с немцами. Если мы хотим сохранить эти регионы, мы должны просить Францию защитить наш суверенитет."
 ger.139.a: "Мы не можем рисковать войной, дайте Германии то, что они хотят."
 ger.139.b: "Конечно, французы будут с нами."
 ger.140.t: "Западославия хочет нашей помощи."
 ger.140.d: "Правительство Западославии попросило нашу страну предоставить им защиту от Германии. Валькистское правительство использует немецкие националистические настроения в Германии и Чехии в качестве предлога для аннексии этих регионов. Очевидно, что это лишь первый шаг в плане полной ликвидации слабой Западославской нации, но мы, возможно, не сможем оказать стране запертой земли какую-либо реальную поддержку в случае войны."
 ger.140.a: "Франция будет защищать своих друзей."
 ger.140.b: "Зачем умирать за Дечина?"
 ger.141.t: "Франция бросила нас."
 ger.141.d: "Наша делегация во Франции сообщила, что у ее правительства нет намерений выступать за Западославию против немецкой угрозы. Мы потратили слишком много драгоценного времени на французов, и теперь германский ультиматум приближается к установленному сроку. Похоже, у нас не будет иного выбора, кроме как поднять каждого трудоспособного человека на оружие и сражаться за свою родину."
 ger.141.a: "Быстрее к оружию!"
 ger.142.t: "Западославия проигнорировала ультиматум."
 ger.142.d: "Вчера мы потребовали, чтобы жалкая нация Сападославия позволила своему немецкому народу вернуться в свой истинный дом. Как бы справедливо ни было наше предложение, политики Западославии, слепые к желаниям своего народа, предпочли игнорировать его. Ни одна нация в Европе не выступала против наших притязаний на эту территорию, и поэтому нам не нужно беспокоиться о каком-либо иностранном вмешательстве по мере того, как наши армии придут в Западославию."
 ger.142.a: "Я вернусь домой, Тетшен - героем!"
 ger.144.t: "Западославия мертва."
 ger.144.d: "Для многих было ясно, что народ Западославия был недолго в XX веке, Германия порезала голову нации, и теперь у нас есть шанс вернуть то, что принадлежит нам."
 ger.144.a: "Пусть наши братья вернутся домой."
 ger.147.t: "[ГЕР. Возьмите лидера] Объявляет Версальский договор мертвым"
 ger.147.d: "В рамках Версальского договора, официально положившего конец Великой войне, Германия была демонтирована и унижена в результате огромных территориальных уступок, поступавших в пользу «Согласия», когда наша партия пришла к власти в 1933 году, мы были вынуждены под угрозой вмешательства Франции соблюдать и соблюдать условия и ограничения, установленные Версальского договора, но теперь, когда Франция находится в разгаре разрушительного спада, мы уверены, что ее правительство будет слишком слабым, чтобы противостоять нам."
 ger.147.a: "Мы больше не будем кланяться Стеклянным Гигантам."
 ger.148.t: "Назначение нового министра экономики"
 ger.148.d: "Чтобы преодолеть влияние, которое власти Энтези имеют на Европу, мы должны переместить экономический центр Европы с Франции на Германию. Были разработаны два плана, с тем чтобы обеспечить, чтобы промышленная производительность Германии вышла за пределы Франции как можно скорее. Один из них - наш ведущий архитектор Адольф Гитлер, который хочет связать экономику менее развитых европейских стран с Германией, давая нам преимущество над ними и противоположный план Отто Странгтора, в котором государство возьмет на себя ключевую индустрию для достижения максимальной эффективности. Какой из них мы должны создать?"
 ger.148.a: "Гитлер - человек, он никогда не ошибался."
 ger.148.b: "Страссер - лучший выбор."
 ger.149.t: "Вопрос TST"
 ger.149.d: "Кэмпфский ремесленник был слишком автономным и дезорганизован, чтобы быть надежной военной силой для Германии. Тулесчуцтруппы были созданы [ГЕР.Главный лидер] для того, чтобы быть его собственной лояльной силой, не защищенной от влияния амбициозных офицеров. Недавняя экспансия, однако, оставила без ответа много вопросов о роли в немецких вооруженных силах. Два предложения были выдвинуты для ТБТ. Первое заключается в том, чтобы ТБТ возглавила нашу армию в наступательных операциях, используя там тщательную подготовку и навыки, чтобы добиться решающих результатов. Другое предложение заключается в том, чтобы ТБТ руководила внутренней безопасностью нашей нации и оккупированных территорий, ликвидировала оппозицию и сохранила наши войска в порядке, когда это необходимо."
 ger.149.a: "ТБТ должна быть частью операций на передовой линии."
 ger.149.b: "TST должен быть в резерве, чтобы поддерживать порядок."
 ger.150.t: "Стандартная учебная программа немецкого университета"
 ger.150.d: "Чтобы сохранить власть, мы должны быть уверены, что наши университеты будут соответствовать идеалам Валькиста."
 ger.150.a: "Им следует сосредоточить внимание на улучшении положения в Германии."
 ger.150.b: "Они должны сосредоточиться на распространении немецкого влияния."
 ger.155.d: "Сегодня немецкие панзеры отправились во французскую столицу Парижа. На этот раз никакое чудо Марны не остановило бы жестокость и скорость немецкого преступления. Теперь немецкие солдаты идут по улицам Парижа, празднуя там победу. [ГЕР.Генератор] даже объявил о своем намерении посетить город и установить флаг Валькиста на Эйфелеву башню."
 ger.156.d: "Итальянская оборона была отчаянной, но высшие немецкие войска смогли преодолеть город и захватить его. В хаосе ситуации многие итальянцы даже искали убежища в Ватикане, но спрос на убежище превзошел способность небольшой нации обеспечить его."
 ger.157.d: "Немецкие войска пересекли Альпы и захватили долину По, захватив ключевой порт Венеции в этом процессе."
 ger.158.d: "Несмотря на естественный барьер, обеспечиваемый рекой Рейн, смешанная французская и рейнская сила не смогла удержаться там от продвижения немецких панзеров, что, безусловно, означает конец рунской марионеточной системы."
 ger.159.d: "После быстрой кампании в Польше немецкие войска окружили польскую столицу Варшавы, после ночи интенсивного обстрела немецкие войска смогли захватить город с небольшой оппозицией, теперь, когда наши восточные территории защищены, мы можем сосредоточиться на Франции или натолкнуться на Советский Союз."
 ger.160.d: "После быстрой операции через Рейнленд нам удалось прорваться через оборону Альзаса, и сейчас наши силы идут к Парижу, дни Французской Республики сочтены."
 ger.161.d: "Впервые после завоевания Наполеона, альпийское государство Швейцарии пало на иностранное оружие, теперь, когда мы контролируем этот стратегический регион, мы можем расширить наши операции на Францию и Италию."
 ger.162.d: "Подобно имперской армии за 20 лет до нас, мы успешно продвинулись впереди французской армии через Бельгию, жалкое сопротивление бельгийских вооруженных сил не совпадало с нашими собственными войсками."
 ger.163.d: "Впервые после завоевания Нормана в 1066 году, город Лондон пал перед иностранной армией. &lt; &lt; Тауэр Бридж &gt; &gt; пострадала от обстрела британскими защитниками, когда немецкие пэнзеры пересекли границу, но однажды через британскую оборону быстро рухнуло. Теперь, когда сердце Империи находится под нашим контролем, это лишь вопрос времени, прежде чем она рухнет."
 ger.164.d: "Украинская армия, после многих лет удушения из Москвы, была совершенно неспособна остановить продвижение Германии по территории, теперь наши силы окружают последних отчаявшихся защитников Киева, как только город упадет, мы будем иметь контроль над обширными землями, накормить наш народ."
 ger.165.d: "Наша кампания в Балтии закончилась у ворот Ленинграда, родины русской революции, после нашей решительной осады город упал и русские защитники были изгнаны, теперь СССР отрезан от Балтии и изолирован от мира."
 ger.166.d: "После упорной кампании через Советский Союз мы захватили сердце коллективистской империи Москвы, очевидно, это начало конца дегенеративного марксистского государства."
 ger.167.d: "Гамбург наконец-то в нашей Руке, чтобы сделать его новым военно-морским узлом для Германии. Сотни кораблей будут построены на докьярдах его города. Остается вопрос о том, на каком приоритете должен быть."
 ger.168.d: "[ГЕРЦ.Главный] умер. Его правление определило Германию на протяжении почти последнего десятилетия. После Великой войны Германия была поражена победоносными державами и история Европы навсегда. Старый немецкий диагонист убил во время конфликта и из пепла появилось новое видение немецкого народа. Политическая философия и реформы Германии привели к тому, что Германия восторжествовала как доминантная сторона Европы. [Вторая Великая Война], которая развивала пограничную силу Европы, не должна была расти по всему континенту, германская армия могла легко одолеть Вражду и отомстить за несправедливость, совершенную в Версале. nn1942 открылась наша нация на мировой сцене. Немецкий народ, наконец, принадлежит к нации, чтобы гордиться, но не все хорошо в Берлине. [Вторая Великая Война], не должна была одолеть его дружелюбный десант. На встрече с "Горожером Ратером" [Генгером Гейгером Хейгером], он быстро попал в близкую госпиталь, где он не смог вернуть и умер несколько часов спустя. Ренил маленький ку ку ку ку ку ку ку ку ку ку кложному ку ку ку кану шрапью, и травмному кого кану, кого кого кого кого кого кого кого кого кого кого кого кого кого кого кого, кого кого кого кого кого кого кого кого кого кого кого кого-то кого-то кого-то, он, кого-то-то-то-то-то-то-то-то-то-то-то-то-то-на, он-то-то-то-то-то-на, он-то-то-то-на, он-на-на-на-на-на-на-на-на-на-на-на-то, он-то в своем, он-то-на-на-на-на-на-на-на-на-на-на-на-на-на-на"
 ger.169.d: "Летние игры начались. Атлеты со всего мира собрались в Берлине, чтобы соревноваться за славу. Немецкий канцлер [ГЕР.Гедер] не жалеет расходов, демонстрируя красоту и силу своей нации. Адольф Гитлер, любимый архитектор [ГЕР.Гегер], разработал изумительные общественные работы в Берлине и вокруг него, включая великолепный стадион Рейхспортфельд. В этом году конкурсы могут быть самыми интересными, но еще и самыми интересными, как страны со всего мира, сражающиеся за большинство медалей."
 ger.170.d: "После двух недель жесткой конкуренции летних игр 1936 года завершились. В то время как многие страны получили домашние медали, США и Германия выиграли больше всего. На церемонии закрытия [GER.Get Header] использовал победу немецких спортсменов, чтобы провозгласить превосходство «Нового Германа» человеком, свободным от ограничений традиционной христианской морали и способным вести свою жизнь так, как он считает нужным. Несмотря на то, что толпы, которые окружают Германию, восприняли это как предвестное заявление."
 ger.172.d: "С момента его строительства в XIV веке Нотр-Дам стал одним из самых восхитительных религиозных залов Европы. Группа молодых валькистов обратилась к нашему правительству с просьбой разрешить им проводить там ритуалы в церкви. Скандинавская группа желает исповедывать традиционную немецкую религию и надеется использовать ее для того, чтобы расширить свое движение. Хотя это может помочь распространить немецкое влияние среди жителей Валькиста в Париже, мы, возможно, захотим быть осторожными в том, чтобы расстроить более консервативных членов парижского общества и правительства."
 ger.175.d: "Начиная плавание вокруг земного шара, Зеппелин Таннгриснир взлетает на аэродроме за пределами Берлина. Путь воздушного корабля позволит ему приземлиться в самых престижных странах на Земле. Это первая остановка в Англии, где, по слухам, будет присутствовать Эдвард VIII, чтобы увидеть землю Таннгриснир. После этого корабль остановится во Франции, пересечет Атлантику в Нью-Йорк, заправится в Сан-Диего, переправится в Тихий океан по отношению к Японии, остановится в Индии и, наконец, сделает последний показ за пределами Инстанбула. Корабль размером и мощью размножит очевидное превосходство валькизма на международное сообщество."
 ger.190.d: "Споры между Отто Страссером и [ГЕР.Главой] растут уже много лет. Антикапиталистские взгляды Стассера привлекли к себе негативное внимание многих валькистов и даже заслужили его обвинения в сочувствии со стороны социалистов. Недавнее назначение его личного архитектора Адольфа Гитлера на пост министров экономики фактически подтолкнуло Страссера к нашей немецкой политике. В результате этого Страссер бежал в контролируемый Данией Гольштейн, чтобы поддержать его новое движение коллективистов. Этот поворот событий является национальным позором для партии Валькистов и служит только для того, чтобы дать аммо-призывчикам [ГЕР.Генератор]."
 ger.192.d: "После Великой войны Франция и другие державы Консенсус формируют себя в качестве контролеров и защитников Европы. Для достижения этой цели Франция учредила Совет Энтента в качестве организации для посредничества в любых конфликтах, возникающих на континенте. Каждый год делегаты со всей Европы собираются в Париже на две недели обсуждений и дебатов. В этом году формируется наиболее важный Совет. Экономическая депрессия, вызванная Лондонской фондовой биржей, заставляет страны сражаться за решения, а угроза немецкой перевооруженности все больше и больше бросается на нас. Постоянная стабильность Европы может зависеть от результатов работы этого Совета."
 ger.193.d: "Теперь, когда делегаты со всей Европы начали дискуссии, нам нужно обсудить многие вопросы, которые необходимо обсудить к концу этого совета. Мы должны определить, как справиться с полным несоблюдением Германией Версальского договора, что не должно оставаться неконтролируемым. Мы должны также коснуться недавнего экономического спада, охватившего Европу. Для быстрого восстановления мы должны согласовать единую стратегию. Последний вопрос, который предлагается обсудить, это дипломатический статус Советского Союза. В 1917 году наш союзник, Российская империя, ввязался в жестокую гражданскую войну, в которой либеральные демократические белые силы были настроены против коллекционистских краснокожих сил. К 1922 году большая часть белых сил была побеждена и многие из лидеров были иммигрированы в Париж. В акте солидарности Союз отказался признать СССР в качестве законного российского государства, но без британской поддержки и растущей угрозы Германии, возможно, настало время отбросить нашу идеологическую гордость и сосредоточиться на прагматических потребностях. Чтобы послать германскому рейхисту, мы должны быть в хороших отношениях с могущественным Советским Союзом."
 ger.194.d: "Когда [ГЕР.Главный] пришел к власти в Германии, он пообещал своим сторонникам, что он восстановит прежнюю славу Рейха. Теперь ясно, что он готов сделать это любой ценой. Когда Лондонский фондовый рынок пронесся по Франции и Европе, [ГЕР.Главный лидер] воспользовался возможностью объявить, что Германия больше не будет соблюдать Версальский договор. Когда наши делегаты говорят на немецкой военной машине, которая приводит к гибели более 20 миллионов человек во время Великой войны, вернутся к жизни. . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . ."
 ger.195.d: "После нескольких часов переговоров по немецкому вопросу было достигнуто окончательное голосование. Сторонники считают, что введение санкций в отношении германской оружейной промышленности подорвет способность Германии вести наступательную войну, но оппоненты считают, что это только нанесет ущерб отечественной оружейной промышленности, которая зависит от немецкого дохода, чтобы выжить."
 ger.196.d: "После нескольких часов дебатов Совет по вопросам присоединения проголосовал против введения санкций в отношении Германии, боясь, что эта акция нанесет ущерб собственной отрасли вооружений, процветает через зал делегатов, и теперь Франции придется найти свои собственные способы общения с Германией."
 ger.197.d: "После нескольких часов обсуждений Совет по вопросам присоединения проголосовал за введение санкций в отношении Германии, большинство делегатов были потрясены надеждой на то, что санкции в отношении германской оружейной промышленности уничтожат там планы перевооружения, только время покажет, правда ли это."
 ger.198.d: "Трусливые французы оказывают давление на орду наций, с тем чтобы санкционировать нашу страну, пытаясь нанести ущерб нашей оружейной промышленности. &lt; &lt; Энтентимент &gt; &gt; и ее союзники больше не будут продавать оружие и оборудование для производства оружия нашей стране. &lt; &lt; Несмотря на надежды Франции, это будет лишь небольшим препятствием на пути к достижению нашей цели -- доминирующей в Германии Европы &gt; &gt; ."
 ger.199.d: "Крушение Лондонского фондового рынка привело к тому, что, возможно, самая большая экономическая отдача когда-либо существовала в Европе. Безработица, поскольку компании и предприятия больше не в состоянии держать там двери. Франция разработала план экономического восстановления, с тем чтобы одолеть Европу в результате этого бедствия. В нем наша страна будет обязана увеличить налоги на высокопоставленных работников и использовать доходы для субсидий, действующих в настоящее время. Кроме того, нам необходимо будет продолжать экспортировать ресурсы для членов Совета, которые требуют их в попытке сохранить там свою деятельность. Надежда на то, что эта политика позволит предотвратить любые дальнейшие банкротства и остановить быструю безработицу. Многие делегаты обеспокоены тем, что эта политика является слишком жесткой и не учитывает конкретные потребности каждой отдельной страны."
 ger.200.d: "После нескольких часов споров было проведено окончательное голосование по вопросу о том, как подойти к восстановлению экономики. &lt; &lt; Сторонники &gt; &gt; утверждают, что для преодоления экономического спада потребуются экономическое сотрудничество и политика жесткой экономии, в то время как оппоненты утверждают, что план экономического восстановления Франции является слишком жестким и не учитывает конкретные потребности отдельных стран."
 ger.201.d: "Совет не смог прийти к согласию в отношении стратегии экономического восстановления."
 ger.202.d: "Несмотря на первоначальное несогласие с французским планом, делегаты Совета согласились поддержать его и установить его политику внутри собственных государств."
 ger.203.t: "Предположим, мы признаем Советский Союз законным российским правительством."
 ger.203.d: "Великая война была настолько разрушительным конфликтом, что она свела на нет самую мощную и обширную империю, которая когда-либо существовала, — Россию. После трех лет жестокой войны российское государство попало в гражданскую войну, в ходе которой либеральные белые силы сражались с коллективистскими Красными силами. В конечном счете, красные одержали победу, и многие белые лидеры были вынуждены бежать из России. Многие из этих людей оказались в Париже. В знак солидарности с бывшим российским союзником французы и американцы согласились не признавать СССР в качестве законного русского государства. В то время как это когда-то отвечало интересам Германии, растущая угроза Германии может вынудить нас пересмотреть эту политику."
 ger.204.d: "После нескольких часов споров делегаты собрались, чтобы принять решение о статусе СССР. &quot; Делегаты по признанию &quot; утверждают, что СССР слишком могуществен для нации, чтобы игнорировать и идеологическая одержимость побежденными белыми не приносит никакой пользы, в то время как делегаты по антипризнанию утверждают, что предоставление советским войскам любой легитимности вдохновит коллективистов, которые будут воспринимать наши действия как знак поддержки."
 ger.205.d: "Несмотря на растущую угрозу Немецкого Рейха, Совет Энтези решил продолжать там политику против Советского Союза. &lt; &lt; Константе &gt; &gt; будет продолжать не признавать СССР в качестве законного российского государства."
 ger.206.d: "В удивительном повороте событий Совет Согласия объявил, что он признает Советский Союз законным российским государством. &quot; Бывшие белые офицеры &quot; , проживающие в Париже, осудили этот шаг, назвав Совет &quot; гнилым логовом, полным ножевых пуль &quot; ."
 ger.207.d: "Франция объявила о том, что Совет Согласия теперь признает нас в качестве истинного преемника бывшей Российской империи. французы даже предложили нам бывшее российское посольство в Париже для советского использования. Это потепление отношений между нашими нациями придает нашей революции и борьбе легитимность на мировой арене."
 ger.208.d: "После нескольких дней дискуссий и важных решений, которые Франция завершила в эти годы, она выражает надежду на то, что решения и политика, принятые этим Советом, проложат путь к лучшему и более активному году в 1937 году."
 ger.209.d: "После ночи делегаты из самых престижных стран Европы вновь собрались в Совете Энтента для обсуждения наиболее важных вопросов, влияющих на Европу."
 ger.210.t: "Германия объявляет Версальский договор мертвым."
 ger.210.d: "Сегодня Германия объявила о начале наращивания вооружений в нарушение Версальского договора, договора, который положил конец Великой войне. [ГЕР.Главный лидер] даже высказал мнение о том, что данное Договором положение является «жестоким нападением на Германию и ее народ» и что «Девичленд никогда больше не будет подчиняться какой-либо власти». Это, безусловно, попытка Германии получить влияние в Европе в момент слабости и мы не можем его поддержать. Некоторые армейские чиновники, такие как Морис Гамелин, считают, что Франция должна будет реформировать свою армию, чтобы показать немцам, что мы готовы встретиться с любой силой."
 ger.210.a: "Мы должны остановить германскую агрессию любой ценой."
 ger.210.b: "Зеленые военные реформы."
 ger.211.t: "Столпактская конференция по продолжению военных усилий"
 ger.211.d: "С помощью жестоких завоеваний мы смогли отомстить за позорное поражение, которое мы пережили в ходе Великой войны почти 20 лет тому назад, мы являемся бесспорными хозяевами Европы и ни одна нация не может встать на нашем пути, несмотря на наше явное господство, упрямые французы по-прежнему пытаются сорвать наше правление из Северной Африки, расширяя этот конфликт с европейского конфликта до полной мировой войны. Конфликт такого масштаба потребует тесного сотрудничества между всеми членами Столпакта. Мы пригласим представителей Францозехера Фрейстатата и Италиенича Фрейстататата в Берлин для обсуждения планов и стратегий, направленных на то, чтобы помочь положить конец этой войне."
 ger.211.a: "Отправляйте приглашения."
 ger.212.t: "Германия предлагает нам обсудить военные усилия."
 ger.212.d: "Немецкие вооружения впервые с эпохи римлян объединили Европу за одну цель, несмотря на то, что бывшая Французская Республика продолжает сопротивляться Алжиру, чтобы положить конец этой войне, Немецкий Рейх пригласил нас на конференцию в Берлине для обсуждения единой стратегии, с тем чтобы быстро положить конец этой войне."
 ger.212.a: "Нам нужно многое обсудить."
 ger.213.t: "Делегаты прибывают в Берлин"
 ger.213.d: "Делегаты Франсозошера Фрейстата и Италиениша Фрейстата прибыли в Берлин для того, чтобы начать обсуждение вопроса о войне."
 ger.213.a: "Каков первый план?"
 ger.214.t: "Начало Берлинской конференции"
 ger.214.d: "Наши делегаты прибыли в Берлин для того, чтобы обсудить текущие военные усилия."
 ger.214.a: "Мы должны сосредоточиться на алжирском фронте"
 ger.214.b: "Мы должны сосредоточиться на Британских островах."
 ger.214.c: "Мы должны обезопасить Атлантику."
 ger.214.e: "Мы должны сосредоточиться на алжирском фронте"
 ger.214.f: "Мы должны укрепить полуостров"
 ger.214.g: "Мы должны определить свою позицию на Балканах"
 ger.215.t: "Первый день дискуссии"
 ger.215.d: "Настало время обсудить возможные военные планы для нашего альянса. Францозошер Фрейстаат и Италиенич Фрейстаат предложили нам рассмотреть два предложения, но военного материала становится все меньше. Мы должны принять решение только по одному."
 ger.215.a: "Мы должны развивать средиземноморское побережье Франции."
 ger.215.b: "Мы должны развивать Английский канал."
 ger.215.c: "Мы должны развивать Атлантическое побережье Франции."
 ger.215.e: "Мы должны развивать Сардинию и Сицилию."
 ger.215.f: "Мы должны укрепить Итальянский полуостров"
 ger.215.g: "Мы должны создаться на Балканах"
 ger.215.h: "Делегаты не завершили подготовку какого-либо плана"
 ger.216.t: "Берлинский совет принимает предложение"
 ger.216.d: "После долгих обсуждений и дебатов делегаты в Берлине приняли окончательное решение."
 ger.216.a: "Хорошо, давайте перейдем к следующему выпуску."
 ger.216.b: "Поддержка делегатами операций по борьбе с Алжиром"
 ger.216.b: "Делегаты поддерживают идею борьбы с Великобританией"
 ger.216.c: "Делегаты поддерживают расширение атлантических операций"
 ger.216.e: "Поддержка делегатов в укреплении Сицилии"
 ger.216.f: "Поддержка делегатами укрепления Итальянского полуострова"
 ger.216.g: "Делегаты оказывают поддержку операциям на Балканах"
 ger.218.t: "Второй день обсуждений"
 ger.218.d: "Поскольку конференция в Берлине подходит к концу, настало время завершить разработку возможных военных планов для нашего альянса. &lt; &lt; Францозошер Фрейстаат &gt; &gt; и &lt; &lt; Италиенич Фрейстаат &gt; &gt; предложили нам рассмотреть еще два предложения, но военного материала становится все меньше. &lt; &lt; Мы должны принять решение лишь по одному из них. &gt; &gt;"
 ger.219.t: "Берлинская конференция подходит к концу"
 ger.219.d: "Канцлер Германии принял решение о том, что Берлинская конференция уже выполнила все ее цели, что позволило осуществить шаги, необходимые для координации военных усилий, и принять многие новые стратегии, и надеется, что меры, принятые этим советом, приведут к быстрому завершению войны."
 ger.219.a: "Приветствую Победу!"
 ger.220.t: "Германия предлагает нам отделы поддержки"
 ger.220.d: "Наше правительство и наши интересы вполне хорошо совпадают с германскими, и как таковые они стремятся расширить сотрудничество между нашими нациями. 2 высококвалифицированные немецкие дивизии готовы отправиться в поддержку нашего дела, как только мы дадим слово."
 ger.221.t: "Немецкие подразделения возвращаются из Испании"
 ger.221.d: "После многих ожесточенных сражений в Испании наши добровольцы готовы вернуться домой с опытом, который они приобрели, когда уезжали."
 ger.220.a: "Добро пожаловать домой."
 ger.220.a: "Конечно."
 ger.222.t: "Вангарист берёт Данию под свой контроль!"
 ger.222.d: "Революция свела на нет умеренное датское правительство. Теперь вангуардистская партия контролирует нацию. Ходят слухи о том, что они намерены принести Революцию в Германию. Мы должны уничтожить это коллективное пламя, прежде чем оно может сжечь нашу плоть."
 ger.222.a: "На войну!"
 ger.222.b: "Мы не в том положении, чтобы начинать войны."
 ger.224.t: "Альянс с Германией?"
 ger.224.d: "Немецкий рейх послал дипломатов в нашу страну, чтобы договориться о нашем вступлении в Штальпакт, в то время как военная поддержка столь многих в правительстве предпочла бы поддерживать более тесные связи с Бритианом и опасаться экспансионистских амбиций Германии."
 ger.224.a: "Германия поможет сохранить нашу позицию в Центральной Европе"
 ger.224.b: "Мы не можем рисковать святостью нашей нации."
 ger.225.t: "Словакия присоединяется к Штальпакту"
 ger.225.d: "Предсказуемо, что слабый словацкий народ принял наше предложение о защите."
 ger.225.a: "Тост за наших словацких друзей"
 ger.226.t: "Словакия отказывается присоединиться к Штальпакту"
 ger.226.d: "The pathetic Slovakian nation has refused our offer for protection. Though this can hardly be considered a loss for us this action will doom there nation to become a foot note within future history books when stronger nations take the oppurtunity to conquer the weak nation.
 ger.226.a: "Мы должны искать других союзников на востоке."
 ger.227.t: "Германия предлагает нам материальную поддержку"
 ger.227.d: "Наш новый союзник Германия хорошо знает состояние наших вооруженных сил и промышленности. Для большинства ясно, что наша нация не готова к европейской войне, чтобы помочь нашей стране подготовить Германию, послала нам снаряжение как для нашей армии, так и для промышленности. Мы должны использовать эту поддержку разумно."
 ger.227.a: "Германия - настоящий друг."
 ger.230.t: "Судьба запасов чешских танков"
 ger.230.d: "Наша власть над чешским государством оставила нам контроль над их когда-то грозной танкерной промышленностью. В частности, 244 чешских легких танка теперь являются нашими для приема. Ясно, что это оружие должно быть поглощено для использования в наших вооруженных силах. Современная армия нуждается в современных танках."
 ger.230.a: "Панцер 35(t) заставит наш народ гордиться"
 ger.233.t: "Германия просит увеличить импорт продовольствия"
 ger.233.d: "Министр экономики Германии Адольф Гитлер прибыл в нашу страну в надежде подписать торговое соглашение об увеличении экспорта пшеницы в Германию. Сельскохозяйственный сектор Германии напрягается под весом быстро растущего населения, а земля падает до разрастания городов меньше, чем доступно для сельского хозяйства. Украина известна как хлебная корзина Европы. Наш сельскохозяйственный сектор является крупнейшей частью нашей экономики. Подписание соглашения с Германией поможет ему существенно расти в течение следующих нескольких лет, но некоторые министры опасаются, что Германия может иметь большие амбиции в Восточной Европе, и нам следует избегать любых угроз нашей безопасности, работая с ними."
 ger.233.a: "Эта сделка принесет нам пользу."
 ger.233.b: "Мы не должны работать с Германией."
 ger.234.t: "Украина соглашается экспортировать больше продовольствия"
 ger.234.d: "После долгих переговоров Украина согласилась увеличить экспорт пшеницы в нашу страну, что поможет нашему собственному сельскохозяйственному сектору справиться с нашим постоянно растущим населением."
 ger.234.a: "Пойдем поедим."
 ger.235.t: "Украина отказывается экспортировать больше продовольствия"
 ger.235.d: "Несмотря на многочасовые переговоры, Украина отказалась экспортировать больше продуктов питания в нашу страну, Восточная Европа слишком неустойчива в регионе, чтобы беспокоиться об этом, мы должны искать другие источники зерна, чтобы поддержать наше постоянно растущее население."
 ger.235.a: "Украине суждено стать советской мишенью"
 ger.236.t: "Германия хочет инвестировать в наши нефтяные месторождения"
 ger.236.d: "По мере того, как Германия расширяет свои вооруженные силы, спрос на нефть растет вместе с этим. Нефть в Европе дефицитна, но по мере того, как Германия становится более дипломатически изолированной на мировой арене, их спрос на более местные источники становится громче. Украина является страной, в которой находятся некоторые из крупнейших нефтяных запасов в Европе, но отсутствие инфраструктуры значительно снижает нашу способность экспортировать этот ресурс. Министр экономики Германии Адольф Гитлер, хотя и разработал план по исправлению этого положения. Германия будет финансировать расширение наших нефтеперерабатывающих заводов и взамен мы должны согласиться экспортировать требуемую сумму в Германию. Хотя это поможет нашей экономике, угроза немецкого оружия может не стоить риска."
 ger.236.a: "Позволь нефти течь"
 ger.236.a: "Пусть Пэнзеры голодают"
 ger.237.t: "Украина позволит нам улучшить там нефтяные месторождения."
 ger.237.d: "Сейчас, когда мы говорим о немецких инженерах, мы летим в Киев, готовясь к расширению добычи нефти в Украине."
 ger.237.a: "Позволь нефти течь"
 ger.238.t: "Украина отказывается позволить нам улучшить там нефтяные месторождения."
 ger.238.d: "Украинские политики отказались от нашего великодушного предложения расширить добычу нефти, ссылаясь на опасения, связанные с нашим быстрым подъемом. Украина выбрала плохое решение, защищая единственное государство, которое может защитить ее от советской угрозы. Теперь мы вынуждены искать другие, более отдаленные источники нефти."
 ger.238.a: "Как насчет угольных пэнзеров?"
 ger.241.t: "Французы прорвались!"
 ger.241.d: "Французы пересекли германскую границу, мы должны полностью мобилизоваться, мы серьезно недооценили французов, мы должны остановить их здесь или упасть, все, что мы можем собрать, будет использовано против французов, мы соберем оборонительный план, чтобы отреагировать на этот прорыв, и прижмем оружие Великой Войны к бою!"
 ger.241.a: "Нихт эйнен Шритт Цурюк!"
 ger.242.t: "Германия поддерживает польские претензии на креси"
 ger.242.d: "Похоже, Германия, пытаясь укрепить отношения между нашими государствами, теперь согласилась поддержать наши требования в Восточной Европе."
 ger.242.a: "Приготовьте наши армии."
 ger.243.t: "Германия предлагает нам место в Штальпакте."
 ger.243.d: "Немецкие дипломаты прилетели сегодня в Минск, чтобы предложить нашей стране союз. Мы уязвимы в Восточной Европе. Единственное советское наступление могло бы стереть наше состояние с карты, так что в наших интересах заручиться поддержкой Германии, но мы должны также быть осторожными в том, чтобы позволить валькистскому влиянию подавить нашу культуру."
 ger.243.a: "Наша безопасность важнее всех инъекций."
 ger.243.b: "Мы не должны связываться с валькистами."
 ger.244.t: "Беларусь присоединяется к Штальпакту"
 ger.244.d: "Увидев ценность немецкой гарантии защиты, правительство Минска согласилось присоединиться к Штальпакту, надеюсь, это пошлет сигнал советцам и обеспечит наше место как доминирующей державы в Европе."
 ger.244.a: "На шаг ближе к Москве"
 ger.245.t: "Беларусь отказывается присоединиться к Штальпакту"
 ger.245.d: "Несмотря на экзистенциальный риск, который Советы представляют для выживания своей нации, правительство Беларуси отказалось присоединиться к Штальпакту, и, когда придет время, нам, возможно, придется найти другие пути решения проблемы с Беларусью."
 ger.245.a: "Нейтралитет не спасет Беларусь."
 ger.246.t: "Германия предлагает нам место в Штальпакте."
 ger.246.d: "Немецкие чиновники встретились с нами сегодня в Киеве, чтобы обсудить возможный союз между нашими нациями. Наша позиция в Восточной Европе крайне уязвима. Единственное советское наступление могло бы стереть нас с карты, чтобы в наших интересах заручиться поддержкой Германии, но мы должны быть осторожны в том, что влияние валькистов сдерживает нашу культуру."
 ger.246.a: "Наша безопасность важнее всех остальных вопросов."
 ger.246.b: "Мы не должны попасть в руки Валькиста."
 ger.247.t: "Украина присоединилась к Штальпакту"
 ger.247.d: "Увидев ценность немецкой гарантии защиты, правительство Киева согласилось присоединиться к Штальпакту. Надеюсь, это пошлет сигнал советцам и обеспечит наше место в качестве доминирующей державы в Европе."
 ger.247.a: "Тост за наших украинских друзей"
 ger.248.t: "Украина отказывается присоединиться к Штальпакту"
 ger.248.d: "Несмотря на экзистенциальный риск, который Советы представляют для выживания своей нации, правительство Украины отказалось присоединиться к Штальпакту."
 ger.248.a: "Нейтралитет не спасет Украину."
 ger.249.t: "Германия требует, чтобы мы подчинились их правилам."
 ger.249.d: "Под притворством "защиты Балтии от влияния коллективистов" Германия теперь требует, чтобы мы согласились стать их протекторатом. В то время как некоторые скандируют "лучше, чем красный" в парламентских залах, большинство согласны, что мы не можем позволить Германии лишить свой суверенитет вот так. Мы должны призвать Францию помочь нам в этом кризисе."
 ger.249.a: "У нас нет шансов пересечь Германию."
 ger.249.b: "Мы должны пригласить французов."
 ger.2492.t: "Должностные лица из Эстонии и Латвии просят о помощи"
 ger.2492.d: "Даже когда они прибывают в Париж, Германия начала распространять его влияние на балтийские государства. Минстеры из этих стран ищут защиты от Энтенса, чтобы обратить вспять империалистические усилия Германии, но в то время как большинство во Франции сочувствуют своему делу, воспоминания о Великой войне свежи во многих мыслях, и немногие готовы их пережить."
 ger.2492.a: "Мы должны защитить балтийцев от немецкой угрозы."
 ger.2492.b: "Зачем умирать за Даугавпилса?"
 ger.2493.t: "Франция отказалась защищать нашу страну."
 ger.2493.d: "Несмотря на обещания защитить нации Европы, трусливые французы отказались поддержать нас против немецкой агрессии."
 ger.2493.a: "Черт побери, французы"
 ger.250.t: "Сдаётся нам."
 ger.250.d: "Неожиданно наш ультиматум [FROM.GetName] был принят без колебаний."
 ger.250.a: "Победа для Дойчланда!"
 ger.251.t: "[FROM.GetName] отказывается представлять"
 ger.251.d: "Наш ультиматум [FROM.GetName] упал на глухие уши. Они заплатят за упрямую упрямицу. Балтийская страна будет бежать красным с [FROM.GetAductive] кровью."
 ger.251.a: "Мы будем править Балтией"
 ger.253.t: "Германия формирует RK Ostland"
 ger.253.d: "Чтобы помочь управлять Балтийским регионом Германия реорганизовала наше правительство в Рейхскоммиссарат-Остленд, готовится ли правительство к переезду в нашу новую столицу Ригу, которая теперь дает нашей стране возможность стать крупной державой в Европе."
 ger.253.a: "Германия действительно наш друг."
 ger.254.t: "Германия требует, чтобы мы подчинились их правилам."
 ger.254.d: "После того, как мы вырезали нашу нацию, мстительные немцы по-прежнему требуют от нас большего, не меньше, чем наша полная капитуляция удовлетворит Берлин, ясно, что Энтези не заинтересована в спасении Польши. Если мы будем сопротивляться, мы должны сделать это сами."
 ger.254.b: "Польша еще не потеряна"
 ger.254.a: "Мы должны избегать кровопролития."
 ger.255.t: "Польша сдается"
 ger.255.d: "Правительство Варшавы мудро предпочло мирно сдаться нам."
 ger.255.a: "Иногда угрозы сильнее, чем Пэнзер."
 ger.256.t: "Польские будут сопротивляться."
 ger.256.d: "Несмотря на нашу подавляющую степь, дурацкие политики в Варшаве упорно решили сопротивляться нам."
 ger.256.a: "Никто не должен останавливать Германию."
 ger.257.t: "Германия предлагает нам защиту"
 ger.257.d: "Гражданская война в России имела последствия для нашей нации, и хотя мы, белые, вышли победителями угрозы коллетивистской менструации, все еще существует через нашу границу, альянс с Германией помог бы защитить наш суверенитет и, возможно, даже помочь нам защитить Карелию от русских."
 ger.257.a: "Мы должны союзничать с немцем."
 ger.257.b: "Валькистам нет места в Германии."
 ger.258.t: "Финляндия присоединяется к Штальпакту"
 ger.258.d: "Чтобы объединить наши усилия, чтобы ослабить Советы Финляндии согласились присоединиться к Столпакту, вместе мы оставим Россию нашей Балтии."
 ger.258.a: "Тост за наших финских друзей"
 ger.259.t: "Финляндия отказывается присоединиться к Штальпакту"
 ger.259.d: "Несмотря на угрозу, которую Советы представляют для их суверенности, Финляндия по-прежнему отказывается присоединиться к Штальпакту."
 ger.259.a: "Финляндия - это потерянное дело."
 ger.260.t: "Германия предлагает нам союз"
 ger.260.d: "В то время как многие в нашем правительстве считают это большим противопоставлением растущей советской угрозе северу, многие другие по-прежнему помнят последний раз, когда наши нации состояли в союзе."
 ger.260.a: "Пора объявить "Центральные державы 2""
 ger.260.b: "Сейчас неподходящее время."
 ger.261.t: "Присоединяется к Sholpakt"
 ger.261.d: "Не удивительно, что наш бывший союзник, турки, вновь присоединились к нашему альянсу, вместе мы заблокируем Россию от медидтерении и подтолкнем к французской телефонии."
 ger.261.a: "Тост за нашего турецкого союзника"
 ger.262.t: "[FROM.GetName] отказывается присоединиться к Sholpakt"
 ger.262.d: "Несмотря на наши исторические связи, турки отказались присоединиться к нашему новому альянсу."
 ger.262.a: "Турция - это потерянное дело."
 ger.263.t: "Дезагрегированный генеральный персонал"
 ger.265.t: "Литовская война за независимость"
 ger.265.d: "Литва оказалась в состоянии войны со своим бывшим хозяином Польшей. Война выглядит мрачной для Литвы, поскольку она ужасна, но в случае конфликта может быть легкой, если Германия вмешается. Это не только обезопасит нашу восточную границу, но и поможет распространить наше влияние на Литву и Балтии в целом."
 ger.265.a: "Предложение заключить союз с Литвой"
 ger.265.b: "Литва не стоит нашего времени."
 ger.266.t: "Германия поддерживает нашу независимость"
 ger.266.d: "Берлин пришел к нашему правительству, чтобы объявить о своем желании сформировать Литву и вступить в союз с ней, чтобы помочь нам обрести независимость от Польши."
 ger.266.a: "Нам нужна любая поддержка, которую мы можем получить"
 ger.266.b: "Нам лучше быть самим по себе."
 ger.267.t: "Литва согласна присоединиться к Штальпакту"
 ger.267.d: "Не удивительно, что Литва быстро согласилась с нашим предложением."
 ger.267.a: "Тост за нашего литовского союзника"
 ger.268.t: "Литва отказывается от нашего союза"
 ger.268.d: "Наивные литовцы отказываются от какой-либо помощи от нас, даже когда Польша входит в их границу."
 ger.268.a: "Литва - это потерянное дело."
 ger.269.t: "Германия требует контроля над Германией, Австрией"
 ger.269.d: "Похоже, что Германия не убеждена в наших притязаниях на Австрию, и теперь они требуют возвращения региона немецкого большинства к законному немецкому правительству в Берлине."
 ger.269.a: "Мы не можем защитить Австрию."
 ger.269.b: "Если они этого хотят, им придется их забрать."
 ger.270.t: "Венгрия сдает Австрию"
 ger.270.d: "Простой угрозой было то, что потребовалось, чтобы вернуть венгров назад, без кровопролития мы не получили контроля над Австрией и на шаг ближе к объединению всех немцев."
 ger.270.a: "Зиг Хейл"
 ger.271.t: "Венгрия отказывается сдать Австрию"
 ger.271.d: "Не считает ли Будапешт, что немецкие угрозы пусты? Они оскорбляют нас, думая, что Берлин не посвящён тому, чтобы стереть с карты жалкую нацию, если до этого дойдет. Австрия будет Германией, хочет она того или нет."
 ger.271.a: "Будапешт будет гореть"
 ger.272.t: "Германия предлагает помощь, чтобы победить бунт Киля"
 ger.272.d: "Датская аннексия Шлезвига-Гольштейна из Германии после Великой войны на протяжении почти двух десятилетий налаживала отношения между двумя странами. Несмотря на то, что Германия расширила оливковую ветвь и хотела бы поддержать наши усилия по установлению мира в Киле, но только если взамен мы уступим наши регионы немецкого большинства им. Кильское восстание уже разрушило нашу страну и промышленность. Любая поддержка, которую мы можем получить для установления мира, крайне необходима."
 ger.272.a: "Мы должны согласиться с предложением Германии."
 ger.272.b: "Никаких сделок с Германией"
 ger.273.t: "Дания принимает нашу поддержку"
 ger.273.d: "Дания мудро приняла нашу поддержку, чтобы положить конец восстанию в Киле. Как только мы раздавим Гамбургскую коммуну, мы вернем нашу законную территорию Германии и, надеюсь, обезопасим нашу северную границу."
 ger.273.a: "Мы раздавим социалистов."
 ger.274.t: "Дания отказывается от нашей поддержки"
 ger.274.d: "Несмотря на отчаянное положение Дании, они отказываются от помощи."
 ger.274.a: "Проклятье этих датчан"
 ger.275.t: "Германия требует военной поддержки"
 ger.275.d: "Война Германии через Европу охватила почти все страны континента, в результате чего они оказались на грани краха. В настоящее время турецкий союзник Германии находится на грани краха, и теперь Германия требует от нас поддержки, открыв новый фронт на греческой границе и разрешив поступление техники в Малую Азию, в ответ на это Германия обеспечит защиту и поддержит наши территориальные притязания в Албании, Италии и Греции. В то время как это предложение заманивает некоторых в наше правительство, наши военные беспокоятся о способности Сербии вести современную войну, но игнорирование требований Германии может заставить нас столкнуться с этим препятствием еще раньше."
 ger.275.a: "Мы будем поддерживать Германию"
 ger.275.b: "Мы предпочитаем оставаться нейтральными."
 ger.276.t: "Сербия присоединяется к Штальпакту"
 ger.276.d: "Сербия согласилась с нашими требованиями и поддержит нашу войну против Греции, которая, как мы надеемся, поможет стабилизировать положение на азиатском маленьком фронте и позволит расширить масштабы операций по всему Средиземноморью."
 ger.276.a: "Выпьем за нашего нового союзника Сербию"
 ger.277.t: "Сербия отвергает наши требования"
 ger.277.d: "Несмотря на наши угрозы, Сербия решила оставаться нейтральной в нынешнем европейском конфликте, без второго фронта на греко-сербской границе мы практически бессильны поддерживать нашего турецкого союзника."
 ger.277.a: "Приготовить панцеры"
 ger.278.t: "Турецкий фронт"
 ger.278.d: "Несмотря на все наши усилия по поддержке нашего турецкого союзника, кажется, что турки сталкиваются с трудностями в борьбе с объединенными силами Греко-энтенти, которые окружают их нацию. Мы опасаемся, что вскоре они рухнут, если мы не поможем им в ближайшее время. Сербия является единственной страной в отношениях между нами и Грецией. Требуя, чтобы Сербия открыла второй фронт на греческой границе, поможет ослабить давление на Турцию и закрепит себя в восточном Средиземноморье."
 ger.278.a: "Мы должны спасти Турцию"
 ger.278.b: "Нам не нужно расширять этот конфликт."
 ger.279.t: "Битва за Нижние земли"
 ger.279.d: "Как и во время первой Великой войны Германия решила поддержать французскую оборону, нападая на низменные районы, мы должны пригласить наших северных соседей в Контенте, чтобы помочь организовать единую оборону региона."
 ger.279.a: "Мы должны дозвониться."
 ger.279.b: "Нам не нужно тратить на них ресурсы."
 ger.280.t: "Франция хочет, чтобы мы присоединились к Согласию."
 ger.280.d: "Наша война с Германией угрожает северной границе Франции, и, как таковая, Франция предлагает нам место в военном союзе Энтенти, чтобы помочь нам организовать единую оборону против Германии."
 ger.280.a: "Мы присоединимся"
 ger.280.b: "Мы не работаем с французами."
 ger.281.t: "Отказывается присоединиться к Согласию."
 ger.281.d: "Несмотря на их отчаянную ситуацию, они отказываются от нашего союза."
 ger.283.t: "Советские силы отступают"
 ger.283.d: "Утром все было спокойно на восточном театре, стук советской артиллерии, который только вчера заполнил пустые огромные размеры степя, наконец-то замолчал, теперь русские отступают с фронта более организованно, чем обычно сжигают все пригодные для проживания земли на своем пути, ясно, что русские намерены заплатить нам германской кровью за каждый последний дюйм советской России, потребуется несколько месяцев, чтобы исправить ущерб, причиненный отчаявшимися защитниками, и даже больше, чтобы организовать новое наступление в Уралах, многие из наших офицеров даже предполагают, что война на востоке оправдала очевидный вывод, поскольку мы занимаем самую ценную землю, которую когда-либо владели бы советы."
 ger.283.a: "Нам не нужно расширяться мимо Уралов."
 ger.283.b: "Советский Союз не может существовать"
 ger.281.a: "Тогда нам нужно будет быстро укрепить наши границы."
 ger.284.t: "Стратегическое выездное совещание в Уралы"
 ger.284.d: "По мере того, как немецкие силы продолжают набирать обороты и отталкивать нашу армию назад, ясно, что наша способность продолжать войну быстро снижается. Многие генералы начинают организовывать отступление к востоку от Уралов, где мы можем организовать более постоянную защиту от немецких войск. Наша разведка твердо верит, что Германия не прогонит Уралов, давая нам еще больше времени для перевооружения без вмешательства."
 ger.284.a: "Начинайте отступать и сжигайте все на вашем пути."
 ger.284.b: "Ни Шагу Назад!"
 ger.285.t: "Судьба России"
 ger.285.d: "Наша страна занимает обширные участки бывшей советской территории в Восточной Европе. Для большинства командиров ясно, что мы не можем продолжать военное правительство над такой большой территорией вечно. Создание гражданской администрации России под нашим собственным контролем помогло бы облегчить административное обслуживание этого региона. (Если вы ощутите катастрофу вскоре после выбора первого варианта, выберите вариант и сохраните. Перезагрузить это сохранение, чтобы избежать катастрофы)"
 ger.285.a: "Форма R.K. Russland"
 ger.285.b: "Германия тянется к Уралам."
 ger.286.t: "Наша армия вынуждена вернуться!"
 ger.286.d: "Наши враги толкают нас вглубь нашей территории! мы должны полностью мобилизоваться! мы серьезно недооценили наших врагов, мы должны остановить их здесь или упасть! Все, что мы можем собрать, будет использовано против наших врагов, мы соберем оборонительный план, чтобы отреагировать на этот прорыв и прижмем оружие Великой Войны на службу!"
 ger.286.a: "Ни Шагу Назад!"
 ger.288.t: "Судьба Исландии"
 ger.288.d: "Британская оккупация Исландии и нескольких других ранее датских арктических территорий оставила нас под контролем региона, которому на протяжении десятилетий предоставлялось домашнее правление."
 ger.288.a: "Формировать Доминион Исландии"
 ger.288.b: "Исландия имеет слишком большое стратегическое значение, чтобы допустить гражданское правление"
 ger.289.t: "Судьба Теодерихшафенов"
 ger.289.d: "Теодерихшафен, известный как Севастополь для местного населения, был обитаем небольшой немецкой общиной с конца Римской империи. В рамках военно-морского флота были разработаны планы аннексии этого крупного портового города и его превращения в собственный немецкий Гибралтар на востоке. Это не только стало бы основным источником пропаганды для нашей нации, но и установило бы наше военное влияние прямо по соседству с Советским Союзом."
 ger.289.a: "Присоединяйтесь к порту"
 ger.289.b: "Давайте не будем расстраивать нашего нового украинского союзника"
 ger.292.d: "Мы оказались в состоянии войны на трех фронтах, с поляками, итальянцами и французами, пытающимися уничтожить нашу прекрасную отеческую землю, с нашими спинами к стене, нет трусости, нет разговоров о капитуляции людей, мы разрушим эти жалкие нации один за другим!"

 ger.263.d: "Со времени окончания Великой войны наша когда-то могущественная объединенная армия, разрушившая силы Кайзера 20 лет назад, перестала существовать."
 ger.1000.d: "В 1933 году наше правительство стало международным изгоем с момента окончания Великой войны. В Версальском договоре наша нация была отделена и она была тенью его бывшей славы. В 1933 году [ГЕР.Главный герцог] вел дикого дикта, который поставил во власть его «Валькистскую партию». Несмотря на то, что он был массово популярен народу Германии, державы, поддерживаемые Великобританией, ввели санкции на наши нации и распространили пропагандистские планы на наших граждан, могли бы быть взвешены. Взглянув на то, что наш герой] в качестве антихристианского хитрого агента, он сказал бы, что в это трудное время в Германии появились многие фракции, которые подорвали бы Валькистскую партию, используя для этого свои преимущества. Герман Горинг был лидером второй по величине националистической фракции в Германии на протяжении многих лет. Несмотря на то, что хватает внимание у хитрого хитрого хитранта, а в другом случае он не согласен с [ГЕР. Гладжерс] радикальной философской философией философии и твердо верит, что у него есть шанс выигратьный шанс выиграть другой войны, Германия должна быть полностью самодостатым."
 ger.1001.d: "Соединенные Штаты Америки воевали с Британской империей, эти две страны были нашими противниками во время Великой войны, но теперь мы можем использовать конфликт в наших интересах. Имперские британцы представляют гораздо больше угрозы для нашей нации, чем изоляционистские американцы. Враг моего врага - мой друг, так что, возможно, в наших интересах послать запасы и людей для поддержки их военных усилий и, надеюсь, раз и навсегда победить британскую угрозу."
 ger.1002.d: "Германия предложила послать поставки для поддержки наших военных усилий против британцев. В ходе Великой войны наша нация оказалась в состоянии войны с Немецкой империей, но теперь кажется, что наш бывший враг может быть нашим самым новым союзником. Многие в конгрессе против получения немецкого оборудования. Если взять руку от разочаровавшейся нации, то подобные Германии рисуют этот конфликт не в позитивном свете, а с другой стороны, мы должны сделать все возможное, чтобы выиграть эту войну."
 ger.1003.d: "Соединенные Штаты любезно приняли нашу поддержку, как изменились приливы. Однажды Арсенал демократии, США теперь вынуждены брать оружие у своего бывшего соперника. Это многое говорит о силе и престиже возрожденной Германии."
 ger.1004.d: "Соединенные Штаты невежественно отказались от нашей поддержки. Недостойные гордости американцы говорят, что им не нужна иностранная поддержка. Они переоценивают свои способности, как в битве при Шато-Тирри, и как тогда многие американские солдаты погибнут без нужды."
 ger.1005.d: "Удивительно, что правительство Германии прибыло в Великобританию для пересмотра ограничений в отношении их военно-морских сил. Они утверждают, что легальный тоннаж судов, предписанный Версиаллом, слишком мал для современной нации размером с Германию. Они стремятся увеличить максимальный размер флота, соглашаясь при этом с тем, что он не будет конкурировать с Королевским флотом. Кроме того, они хотят подписать договор о ненападении как обещание мира между нашими народами. Хотя все это звучит мило, многие в парламенте не хотят идти за спиной Франции, в то время как другие говорят, что это создает слишком большой риск для нашего флота и Британских островов."
 ger.1006.d: "Соединенное Королевство согласилось с пересмотром Версальского договора, и теперь у нас есть право увеличивать наш максимальный тоннаж судов и гарантировать, что война не разорвется между нашими государствами."
 ger.1007.d: "Соединенное Королевство отказывается вести переговоры по какому-либо из положений Версальского договора, эти слабые англичане по-прежнему играют вторую скрипку французам, ясно, что мы не получим никакой поддержки со стороны Запада, и поэтому мы должны относиться как к Франции, так и к Великобритании как к нашим врагам. Несмотря на этот отход, мы все еще должны увеличить нашу военно-морскую мощь, Версаль будет проклят."
 ger.1008.d: "Немецкий рейх требует, чтобы мы позволили войскам передвигаться через наши границы. Наша нация блокирует прямой доступ между Германией и Италией, двумя государствами, которые видят себя в состоянии войны сейчас. Если мы дадим им доступ, то это, несомненно, приведет наш народ в их сферу и приведет конфликт сюда, но мы также не в состоянии бороться с германским наступлением, даже если мы получим французскую поддержку."
 ger.1009.d: "Австрия отказывается выполнить наши требования, хотя это и не было неожиданным, но все же замедлит наш продвижение в Италию."
 ger.1010.d: "Австрия допускает доступ войск через их территорию, и благодаря этой свободе мы можем привести Австрию в нашу сферу и быстро разбить итальянскую армию."
 ger.1011.d: "Немецкий рейх запросил нашу поддержку в вопросе о Западославии. После Великой войны народ Западославия был сформирован как союз западных славян, но эта федерация была навязана своим членам против их воли. В настоящее время миллионы поляков вынуждены жить под иностранным и гнусным правительством. Германия обещала наградить нас этими польскими территориями, если мы поддержим их запланированную оккупацию чешского государства. Ясно, что французы не будут вмешиваться, слишком слабы и трусливы, чтобы противостоять какой-либо реальной угрозе в Европе, но мы должны также остерегаться работы с Германией. [ГЕР. Хранитель] не тот, кто следует традиционным правилам дипломатии, и мы никогда не должны относиться к его обещаниям особенно серьезно, хотя это может быть нашей единственной возможностью вернуть Лемко."
 ger.1012.d: "Немецкий рейх просил нас поддержать вопрос о Западославии. После Великой войны народ Западославия был сформирован как союз западных славян, но эта федерация была навязана своим членам против их воли. В настоящее время тираны в Брно занимают тысячи квадратных миль бывшей венгерской территории. Германия обещала вознаградить нас за эти территории, если мы поддержим запланированную оккупацию чешского государства. Ясно, что французы не будут вмешиваться, слишком слабы и трусливы, чтобы противостоять какой-либо реальной угрозе в Европе, но мы должны также остерегаться работы с Германией. [ГЕР. Грейдер] не тот, кто следует традиционным правилам дипломатии, и мы никогда не должны относиться к его обещаниям особенно серьезно, хотя это может быть нашей единственной возможностью вернуть Словакию."
 ger.1013.d: "Польское государство приняло наше предложение, когда наши армии пересечутся в Западославию, мы сможем рассчитывать на польские силы, чтобы поддержать наше вторжение и отвлечь чешские войска."
 ger.1014.d: "Венгерское государство приняло наше предложение, когда наши армии пересечутся в Западославию, мы сможем рассчитывать на венгерские силы, чтобы поддержать наше вторжение и отвлечь чешские войска."
 ger.1015.d: "Глупые поляки отказались поддержать наше дело, наше щедрое предложение, очевидно, было недостаточно для бюрократов в Варшаве."
 ger.1016.d: "Глупые венгры отказались поддержать наше дело, наше великодушное предложение, очевидно, было недостаточно для бюрократов в Будапеште, несмотря на эти изменения в планах, мы будем и впредь стремиться к ликвидации Западославии."
 ger.1017.d: "Немецкие войска прибыли в Западославию и в настоящее время взаимодействуют с чешской армией. В рамках нашего соглашения с Германией мы теперь обязаны начать нашу собственную военную операцию в Западославии. Наши силы обучены и готовы вернуться на нашу территорию, все, что нам нужно - это ваше слово."
 ger.10171.d: "После серии немецких побед верховному командованию Заподослава стало ясно, что любая дальнейшая оппозиция будет безнадежна. Чешская армия постоянно находится в пути, и маленькая территория остается для их защиты. В хаосе ситуации западославское правительство было вынуждено поспешно бежать во Францию, оставив там много великих людей. ~ И снова немецкая армия продемонстрировала ее подавляющую силу. Мечта о едином Гродеушландии на шаг ближе, но сейчас мы должны принять окончательное решение о том, как разделить бывшие территории Западославии."
 ger.10172.d: "Венгерцы оказались надежными союзниками, когда вторглись в Словакию в рамках нашей борьбы с Западославией. Теперь они требуют полного контроля над территорией, которую мы им обещали. Хотя в наших интересах поддерживать позитивные отношения с венграми, офицеры в армии считают, что продолжение военной оккупации Словакии и в конечном итоге установление верного режима будут лучше служить нашим экспансионистским целям. Венгрия является неподтвержденной нацией, но, как представляется, лояльной."
 ger.10173.d: "Несмотря на нашу поддержку Западославии, Германия решила оккупировать ранее обещанную территорию Словакии после короткой серии сражений немецкие войска оттолкнули нашу армию назад за довоенную границу. Вся эта кампания стала национальным смущением, оставив нашу когда-то гордую нацию слабым изгоем в рамках большего европейского сообщества."
 ger.10174.d: "Поляки доказали, что они являются надежными союзниками, когда вторглись в Лемко в рамках нашей борьбы с Западославией. Теперь они требуют полного контроля над территорией, которую мы им обещали. Хотя, возможно, в наших интересах поддерживать позитивные отношения с поляками, офицеры в армии считают, что продолжение военной оккупации Лемко и в конечном итоге установление лояльного режима будут лучше служить нашим экспансионистским целям. Польша является нацией, против которой направлены враги со всех сторон, но, возможно, союзником против советской угрозы."
 ger.10175.d: "Несмотря на нашу поддержку Западославии, Германия решила оккупировать ранее обещанную территорию Лемко. После короткой серии сражений немецкие войска оттолкнули нашу армию назад за довоенную границу. Вся эта кампания стала национальным смущением, оставив нашу когда-то гордую нацию слабой парией в рамках большего европейского сообщества."
 ger.1018.d: "По мере того, как напряженность вновь возрастает в Европе, крайне важно найти сильных союзников. Немецкий рейх предложил нам послать советников, чтобы проигнорировать развитие нашей промышленности и армии. Мы окружены экстремальной идеологией социализма, Норвегии на западе и Советов на востоке. Если мы хотим выжить в условиях революции, мы должны заручиться любой поддержкой. Многие из более умеренных должностных лиц шведского правительства предупреждают, что валькизм [ГЕР.Гедера] является еще одним лицом социализма и что мы должны заручиться поддержкой более устоявшихся и разумных демократий Западной Европы."
 ger.1019.d: "Наше дипломатическое предприятие в Швеции завершилось успехом, они приняли наших министров, и поэтому наши отношения неуклонно расширяются."
 ger.1020.d: "Шведы отвернулись от наших министров, утверждая, что у них нет желания получать поддержку от такого режима, как наш."
 ger.1021.d: "Наша война с Норвегией привлекла внимание многих антисоциалистов в Европе. Сотни германских националистов пересекли Балтию, чтобы добровольцы в нашем деле. Они невероятно преданы победе норвежского социализма и, казалось бы, преданы Швеции."
 ger.1022.d: "После нескольких недель планирования Отто Скорзени готов проникнуть в норвежскую столицу Осло. Он и его команда будут путешествовать по U-кватеру, избегая морских путей и приземляясь на окраине города рано утром под покровом темноты. Оттуда он войдет в город и поместит взрывные заряды на несколько промышленных объектов. Если этот план увенчается успехом, это серьезно ослабит норвежскую способность вести войну против Швеции."
 ger.1023.d: "Несмотря на то, что его команда проникла в город без каких-либо вопросов, они вскоре вызвали подозрения у местных властей, плохое знание норвежского языка Скорцени и очевидный австрийский акцент не помогли делу, но тем не менее он и его команда решили продолжить работу."
 ger.1024.d: "Неудовлетворительное планирование и отсутствие талантливого руководства привели к тому, что норвежские власти задержали Скорцени. Беды с самого начала осложнили операцию. U-Боат приземлился на видном месте Норвежской береговой охраны, вынуждая мужчин разбрасываться в местные леса, а не в назначенное место встречи. Пару часов после этого они провели перегруппировку, потеряв драгоценное время для операции. Когда группа наконец смогла проникнуть в местные власти Осло, которые уже были в состоянии быть в курсе предыдущих разоблачений, допросили незнакомых людей из места, где они ходят по своим улицам. Когда полиция подвергла сомнению чудовищную попытку Отто Скорцени в норвежском городе, наше правительство отрицало какую-либо связь с действиями Скорцени, но мало кто убежден. Провал Отто Скорцени был огромным смущением для нашей нации."
 ger.1025.d: "В ночное время раннего утра завод, производящий оружие для военных действий против Швеции, пострадал от катастрофического взрыва, в результате которого 29 рабочих либо погибли, либо получили ранения."
 ger.1026.d: "Сегодня утром рядом с водами Осло был замечен немецкий U-Boat. Корабль, который нырнул до того, как наш флот смог провести расследование, но поставки, оставшиеся на пляже, предположили, что контингент солдат, возможно, был оставлен позади. С этим знанием мы поставили полицию в Осло в состояние повышенной готовности. Пару часов спустя была замечена запутанная группа людей, ходящих по улицам. Когда полиция вела себя нервно и пыталась сообщить нам, что они спешат вернуться домой, или так мы думаем. Их толстый немецкий акцент затруднил понимание. Затем группа была взята под стражу для дальнейшего допроса. Ясно, что эти люди - немецкие агенты, но оба они и немецкое правительство остаются в молчании. Скоро будет назначен суд, в котором они, несомненно, будут признаны виновными в преступлениях против нашего государства."
 ger.1028.d: "Германия недавно обратилась к нашей стране с предложением продать нам оружие по значительно сниженной цене. Реформы немецкой армии сделали это оборудование устаревшим для них, но мы, возможно, сможем найти применение для этого оружия. Антипольская фракция в нашем правительстве поддерживает расширение сотрудничества с Германией, но большинство в рамках более консервативных группировок рассматривают Германию как угрозу нашему суверенитету. Нам нужно модернизировать нашу армию, но мы должны остерегаться немецкого влияния или быть изменниками полюсам."
 ger.1029.d: "Наше великодушное предложение литовцам было отвергнуто их министром иностранных дел, нам, возможно, придется пересмотреть наши планы игры литовцев с поляков. Слепое правительство в Каунасе скорее останется польскими рабами, чем будет иметь вкус свободы."
 ger.1030.d: "Литва приняла наше внешнее предложение о продаже оружия." solidify our relationship for future German-Lithuanian cooperation."
 ger.1031.d: "Разведывательное агентство Германии раскрыло нам документы, утверждающие, что польская армия на нашей границе построена. Если эти документы правдивы, то ясно, что Варшава планирует быстро захватить нашу родину. Если мы предпочтем прислушаться к совету Германии, мы должны действовать быстро и разоружить все польские бригады на нашей территории и подготовить нашу армию к защите от любых вторжений на нашей границе. Несмотря на возможные риски, многие из наших разведывательных кругов сомневаются в достоверности немецких документов. Есть неясные и подтверждающие доказательства. Хотя Германия, возможно, не самая доверчивая нация, мы не должны позволить личным скобкам отвлечься от реальной угрозы."
 ger.10311.d: "Несмотря на наши доказательства обратного, Литва отказывается верить в то, что Польша имеет какое-либо намерение ослабить свою автономию, они изгнали наших министров разведки и ясно дали понять, что они не стремятся к дальнейшему сотрудничеству с нашей страной."
 ger.1032.d: "Германия прислала нашему правительству ультиматум, в котором они требуют возвращения наших западных территорий, которые наш дом - большое немецкое население. После Великой войны большинство немцев покинули эти регионы, когда наше правительство взяло на себя власть, но это все еще не разубедило Немецкий фюрер, который утверждает, что эти территории являются частью «Гроёдушленда» или «Великой Германии». Помимо спроса на эту территорию, они также предусматривают, что мы поставим прогерманских министров на несколько важных правительственных позиций и что Германия будет иметь полный контроль над нашей внешней политикой. Это явное посягательство на наш суверенитет. Мы должны заставить французов поддержать нас в этом деле и помочь нам в борьбе, если ситуация приведет к этому. Наш военный персонал, с другой стороны, предупреждает, что любой вооруженный конфликт с Германией почти наверняка закончится поражением, и даже если французы согласятся поддержать нас, германское господство над Балтией не позволит нам добраться до нас."
 ger.1033.d: "В незамеченном повороте событий поляки согласились с нашим ультиматумом, в настоящее время польские войска уходят со своих бывших западных позиций, и наша армия движется к власти. Мечта о объединенной Германии приближается к нашей власти и с большей частью восточной Европы в нашей сфере влияния может начать подготовку к нашему крестовому походу против коллекционистского российского государства."
 ger.1034.d: "Наш ультиматум прошел, и поляки по-прежнему отказываются отказаться от Южной Пруссии и Поснан. Ясно, что этот кризис можно урегулировать только с помощью пуль и людей. Наши войска расположены на польской границе и призваны нанести удар. Дайте слово и наши армии раздавят Польшу."
 ger.1035.d: "Германия предложила послать военных офицеров и снаряжение, чтобы помочь нам модернизировать нашу армию против советской угрозы. В недавней речи немецкий фюрер [ГЕР.Гедер] заявил, что «Польша является передовой линией, защищающей цивилизации Европы от отвратительной философии коллективизма. Там смелые победы против Советского Союза должны вдохновлять всех граждан Германии». Благодарные слова, конечно, но немецкий народ никогда не доверял достойным друзьям Польши, поэтому мы должны быть невероятно осторожными в любой поддержке Германии."
 ger.1036.d: "Польша приняла наше предложение: с растущей угрозой Советского Союза польский военный персонал согласился с необходимостью более широкого международного сотрудничества и военной экспансии."
 ger.1037.d: "Польша отвергла любую поддержку от нас. Польское иностранное ведомство даже утверждает, что "Валькизм - это еще одно лицо коллективизма". Попытка работать с Польшей была не чем иным, как глупостью. Теперь нам придется найти различных союзников, чтобы противостоять угрозе России."
 ger.1038.d: "Немецкие дипломаты обратились к нашему правительству с просьбой об официальном союзе между нашими странами, что обеспечило бы прочную защиту от Советского Союза и облегчило бы нам доступ к немецким портам на Балтии, снижая экспортные и импортные издержки. Хотя эти положительные моменты высвечивают формулировки немецкого документа достаточно расплывчаты, чтобы потребовать от нашей страны поддержки немецких войн в Западной Европе, этот сценарий был бы катастрофическим для нашей страны, но защита от коллективизма может сделать эту сделку слишком важной, чтобы отказаться."
 ger.1039.d: "Польша отказывается официально оформить какой-либо союз с нашей страной, они предпочли бы поддерживать хорошие отношения с трусливыми французами, даже если они рискуют будущим своей страны."
 ger.1040.d: "Немецкий Рейх предложил нам защитный союз против Советского Союза, во время Гражданской войны в России мы захватили российскую территорию Бесарабии, которая была заявлена Украинской ССР с тех пор, для защиты нашего суверенитета нам, возможно, придется принять немецкий союз, как Франция, так и Британия слишком далеко, чтобы обеспечить серьезную защиту."
 ger.1041.d: "Несмотря на растущую угрозу Советского Союза, румынцы предпочитают оставаться в хороших отношениях с французами, не говоря уже о том, что французы слишком далеко от нас, чтобы оказать им помощь, эта информация, по всей видимости, привлекла румынское правительство, и нам придется искать других союзников в нашем крестовом походе против коллективизма."
 ger.1042.d: "Германия предложила продать нам военное оборудование и производственные инструменты по сниженной цене, что поможет обеспечить наши вооруженные силы, но наводнение немецкой техники может лишить польские компании возможности инвестировать средства в дальнейшие исследования и разработки. Ваш кабинет предупреждает, что это может помочь нашим вооруженным силам в краткосрочной, но долгосрочной зависимости от Германии может навсегда ослабить нашу нацию."
 ger.1043.d: "Польша приняла наше торговое предложение. Несмотря на возражения со стороны некоторых военнослужащих, эта сделка принесет средства Германии и, надеюсь, заставит польское государство стать зависимым от нас за поддержку."
 ger.1044.d: "Польша отказалась от нашего великодушного торгового предложения. Несмотря на отсталое состояние своей армии, польские военные по-прежнему настаивают на том, что они лучше сами по себе без вмешательства извне. Если Польша решит нарисовать себе цель для Советов, мы ничего не сможем сделать."
 ger.1046.d: "Наши порты являются спасательным каналом как для Литвы, так и для Польши, но под российским правлением они по-прежнему не используются. Сегодня они по-прежнему недостаточно развиты, что отрицательно сказывается на нашем экономическом развитии. Германия обратилась к нам с предложением о развитии этих портов. Это помогло бы расширить наш доступ к Атлантическому океану, но наши экономические советники предупреждают нас о том, что в соответствии с этим положением порты будут принадлежать большинству немецких инвесторов, которые, несомненно, ставят внешнеполитические цели Германии выше потребностей литовцев. Глобальная торговля является знаком великих наций, но амбиции Германии могут причинить нашему дому больше вреда, чем того стоит."
 ger.1047.d: "Литва согласилась разрешить Германии развивать там балтийские порты. Наше соглашение предоставит немецкой судоходной компании &lt; &lt; Норддеутшер Ллойд &gt; &gt; большинство акций в этих новых верфях, что позволит Германии оказывать значительное влияние на Литву. &lt; &lt; Балтика &gt; &gt; будет по праву находиться в сфере влияния Германии."
 ger.1048.d: "Литва отказалась от нашего предложения помочь им в развитии их военно-морских объектов."
 ger.1051.t: "Наш переворот был успешным!"
 ger.1051.d: "Наш хорошо спланированный переворот, который был совершен вчера Эрнстом Калтенбруннером, увенчался успехом, поскольку путшистам удалось установить контроль над Веной и прилегающими районами."
 ger.1051.a: "Отлично, приготовьте "Аншлюс"."
 ger.1051.b: "Отлично, давайте сохраним Австрию в качестве спутника."
 ger.1052.t: "Наш переворот в Австрии потерпел поражение!"
 ger.1052.d: "Хорошо спланированный переворот во главе с Эрнстом Калтенбруннером был разгромлен сегодня, когда пучники были пойманы в перестрелке с австрийскими полицейскими и военнослужащими, после чего большинство жителей Вены пытались проникнуть в австрийский парламент, где австрийское правительство при Доллфусе в настоящее время проводит конференцию, были пойманы в перестрелке с сотрудниками австрийской полиции и лояльными солдатами австрийской армии, которые с подкреплением, прибывшими из Св. Пёлтена, смогли оттолкнуть и разогнать их. &quot; Доллфуя &quot; официально осудил Германию за попытку подорвать австрийское правительство. &quot; Переворот &quot; назвал последним оскорблением Германии."
 ger.1052.a: "Мы не потерпим этого!"
 ger.1052.b: "Может, нам стоит подождать..."
 ger.1060.d: "Правительство Германии, по совету министра экономики Адольфа Гитлера, провело радикальные реформы своей политики выдачи виз на работу."
 ger.1061.d: "Министр экономики Германии Адольф Гитлер направил нашей стране всеобъемлющее торговое соглашение, касающееся наших запасов железа, в котором Германия покупает наше австрийское железо по более высокой рыночной стоимости, если мы обещаем отдавать предпочтение железным требованиям немецких компаний по сравнению с австрийскими. Хотя этот доход принес бы большую пользу нашему федеральному бюджету, возможный ущерб, который он может нанести нашей собственной промышленности, может быть того не стоит."
 ger.1062.d: "Австрийское правительство согласилось с нашим торговым предложением, теперь мы можем успокоиться, зная, что у нас есть надежный источник железа, который протекает в нашу страну, и надеюсь, что это сотрудничество с Австрией приведет к тому, что Альпийский народ станет, во-первых, зависимым от Германии и, во-вторых, де-факто частью Гродеуштленда."
 ger.1063.d: "Австрийское правительство отказывается участвовать в нашем торговом предложении, мы должны искать другие источники железа или принимать более убедительные доводы против Австрии."
 ger.1065.d: "Немецкий рейх приступил к осуществлению масштабного проекта в австрийских Альпах по плотине реки Дунай - это линия жизни почти каждой нации на Балканах, вода стимулирует производство продовольствия миллионами людей, любое нарушение его потока будет иметь огромные последствия для общин и промышленности, которые на него рассчитывают."
 ger.1066.d: "После долгих лет германской крови, пота и слёз Дунайская река была раздавлена, и, как немецкие инженеры, готовые к эксплуатации плотины, мы все должны восхищаться этим подвигом человеческой инженерии. Этот проект даст энергию миллионам немцев и поможет стимулировать рост нашей экономики в течение многих лет."
 ger.1067.d: "Одна из первых жертв в Германии, Австрия, стала местом сбора для впечатляющей Дунайской плотины. Этот проект стал сердцевиной немецкой промышленности. Сотрудники Армии Воздуха считают, что мы можем быстро нанести разрушительный удар по Германии, разрушая плотину в результате решительного бомбового удара. Пилоты уйдут рано утром и воспользуются покровом темноты, чтобы избежать обнаружения во время полета над австрийской территорией. Операция будет дорогостоящей и со всеми ночными полетами, очень трудной, но если мы сможем достичь этой цели, мы обретем преимущество над Германией, в которой мы очень нуждаемся."
 ger.1068.d: "Рано утром были замечены неопознанные самолеты, летевшие над западной Австрией, которые были быстро идентифицированы как французские воздушные суда, и их цель была определена как наша славная Дунайская плотина. Мы протащили наши ближайшие равнины, чтобы перехватить, но французы застали наши военно-воздушные силы врасплох и неподготовлены. Судьба почти всей промышленности в Австрии находится в руках наших храбрых немецких пилотов."
 ger.1069.d: "Французская атака на нашу территорию, к сожалению, была успешной, несмотря на смелость наших пилотов, они не смогли победить там французских противников, дунайская плотина лежит в руинах, для того чтобы вновь начать свою деятельность, потребуются миллионы рейхсмарк и месяцы работы."
 ger.1070.d: "Несмотря на то, что мы были пойманы врасплох, мы преодолели французскую атаку. Лишь немногие оставшиеся пилоты отчаянно улетели во Францию, слишком боясь сражаться, как настоящие люди. Мощные немецкие пилоты, которые сделали эту победу возможной, будут приветствоваться дома как герои Рейха. Мужчины, как и эти люди, вновь показывают то превосходство, которое имеет и Валькизм, и Германия над Европой."
 ger.1071.d: "Несмотря на тщательное планирование и подготовку наших пилотов, мы недооценили численность немецких сил в этом районе, что быстро привело к переполнянию французской ударной команды."
 ger.1072.d: "Благодаря быстроте и сюрпризу наших атак у немцев не было шанса перехитрить многие планы перехвата наших собственных; после короткой битвы с собаками французские пилоты расчистили путь к своей цели и успешно бомбили Дунайскую плотину. сердце немецкой промышленности лежит в руинах, и медленно Валькская военная машина остановится."
 ger.1073.d: "Министр экономики Германии Адольф Гитлер направил нашей стране всеобъемлющее торговое соглашение, касающееся наших запасов вольфрама, в котором Германия покупает наш шведский вольфрам по более высокой рыночной стоимости, если мы обещаем отдавать предпочтение вольфрамовым требованиям немецких компаний по сравнению со шведскими."
 ger.1074.d: "Шведское правительство согласилось с нашим торговым предложением, теперь мы можем успокоиться, зная, что у нас есть надежный источник вольфрама, который протекает в нашу страну."
 ger.1075.d: "Шведское правительство отказывается участвовать в нашем торговом предложении, мы должны искать другие источники вольфрама или принимать более убедительные доводы против Швеции."
 ger.1076.d: "Министр экономики Германии Адольф Гитлер объявил об увеличении платы за все иностранные суда, въезжающие в Кильский канал. Германия явно пытается оказать давление и контролировать нашу связь с остальным миром. Судоходные компании уже требуют, чтобы мы оказали им какую-то помощь перед лицом этих радикальных изменений."
 ger.1077.d: "Адольф Гитлер, министр экономики Немецкого Рейха, объявил новый закон, который позволит снизить импортные расходы на товары из «Соседей немецких общин»."
 ger.1078.d: "Зимы в Германии могут быть жестокими для тех, кто не может подготовиться. Каждый год с конца октября по начало марта начинается ежегодный привод Винтерхилфсверка, где миллионы немцев собирают продукты для менее удачливых. Миллионы тонн продовольствия, воды и одежды будут распределяться среди бедных матерей и детей по всей Большой Германии. Вместе мы поможем всем немцам пережить фригидную зиму."
 ger.1080.d: "После многих лет проектирования и строительства первого воздушного корабля класса &quot; Таннгриснир &quot; , построенного в Германии, был завершен и готов к полету. Названный в честь одного из козлов, который вытащил колесницу Одина в норвежской мифологии, &quot; Таннгриснир &quot; является самым передовым и впечатляющим воздушным судном Германии, построенным на сегодняшний день. Судно готово начать пассажирские рейсы на большие расстояния в течение последующих месяцев, но другие виды использования были предложены. . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . ."
 ger.1081.d: "Вскоре после объявления Германией войны против нашей нации, немецкие военно-воздушные силы подвергли бомбардировке многие из наших военно-воздушных полей и армейских гарнизонов, прежде чем у нас даже появилась возможность отреагировать. Многие из этих объектов должны были быть спрятаны в Германии. Даже немецкая армия, похоже, хорошо знает позиции и передвижения наших войск. Мы не можем поймать их врасплох. Мы должны организовать наши подразделения под покровом тьмы, чтобы избежать дальнейших утечек, но пока наша армия не будет скомпрометирована."
 ger.1083.d: "Увлечение дохристианской немецкой культурой заставило его профинансировать блестящую экспедицию в Швецию для исследования этого потерянного общества."
 ger.10832.d: "Несколько месяцев назад шведский фермер Альберт Йоханссон обнаружил труп человека в болоте у своего дома в Бокстене. Местные власти обнаружили, что к тому времени, когда прибыли наши специалисты, его трупу было по крайней мере несколько столетий, чтобы помочь в его исследовании. Дальнейший анализ человека "Бокстена" показал, что он был наиболее вероятным христианским священником, который жил примерно в XIII веке, хвост христианизации Скандинавии. Несмотря на его священное положение, кажется, что он был убит местным населением средневековой Швеции. В то время, как мы можем предположить, что это лишь последняя отчаянная попытка спасти свою чистую германскую культуру от коррумпированных когтей христианства Норсе Сведы региона избивали священника до смерти и закончили его колом через его сердце. Эту жестокость и страсть этих древних немцев следует рассматривать в качестве примера для всех будущих немцев, желающих защитить свою культуру и народ от иностранной коррупции."
 ger.1082.d: "В Германии находятся самые лучшие умы современной эпохи. Наше государство предоставило этим мужчинам и женщинам необходимые ресурсы для выполнения этих задач. С перевооружением, хотя мы должны быть осторожны в том, где мы тратим наши рейхсмарки. Несмотря на то, что великие умы просили наше правительство о финансовой поддержке для этих проектов. Кондрад Зуз, инженер и математик, выдвинул идею о расчетном двигателе, который мог бы быстрее и точнее обрабатывать сложную математику, а затем любой человек. Зуз выдвинул множество практических целей для этого устройства, таких как расчет баллистической физики для повышения точности нашей артиллерии или даже способности математически кодировать наши сообщения, чтобы они не могли быть децисфлированы противником. Несмотря на то, что другой человек, представляющий интерес, мог бы подумать о том, что Курт Дизбнер является физиком. Недавно открытие ядерного деления побудило его рассмотреть вопрос о возможной депонации этого явления. Когда ядро бомбардируется нейтронами, он может разбить ядро, высвобождая огромное количество энергии. Более глубокое понимание и осуществление ядерного деления может привести нас к созданию даже нового класса абсолютного оружия, если мы покажем, что мы должны более разумно выбиратье оружие."
 ger.1084.d: "Немецкий рейх, на удивление враждебно вступая во внешнюю политику, запретил нашим кораблям входить в Кильский канал. Очевидно, что этот шаг направлен на ослабление нашего влияния в Атлантике. Мы должны искать другие торговые пути сейчас."
 ger.1087.d: "Турция по приказу союзника Германии объявила, что советским кораблям больше не будет позволено проходить через Босфор прямо. Это полностью заблокирует нашу страну от Средиземноморья. Германия пытается заморозить наш народ до смерти. Мы должны найти новые торговые пути, чтобы противостоять этому."
 ger.1088.d: "Используя устаревшие австрийские притязания на землю, Немецкий Рейх потребовал, чтобы мы вернули им Тирола. Миллионы итальянцев сражались и погибли за эту территорию. Отдавать в Германию не только будет позором для наследия, но и без Тирола вся долина По не будет иметь никакой естественной защиты от дальнейшей германской агрессии. Хотя наши генералы готовы сражаться до смерти за эту землю, сыны погибших героев Великой Войны - нет."
 ger.1089.d: "Италия отказалась от наших требований, полностью игнорируя волю немцев, которые составляют большинство в Тироле."
 ger.1090.d: "Трусливые итальянцы сдались Тиролю. Эти люди будут склоняться перед любой угрозой, какой бы пустой она ни была. Союз "Согласность" вновь показывает, что он слишком слаб, чтобы противостоять любой агрессии. Германия скоро станет неоспоримым хозяином Европы."
 ger.1091.d: "Правительство в Париже отказалось поддержать независимость Австрии. Очевидно, что французы более чем рады позволить Германии ходить по ним. Теперь, когда Австрии суждено быть оккупированной Германией, это лишь вопрос времени, прежде чем к нам повернут амбиции. Австрия была естественным буфером между нашими государствами, и если это будет легкой добычей для Германии. Многие генералы поддерживают защиту Австрии от германской агрессии. При поддержке Италии горная нация может быть в состоянии защитить там территорию. Наш министр иностранных дел готов пригласить австрийских должностных лиц на встречу в маленьком озерном городе Штреса для обсуждения этих вопросов. Защита Австрии может быть последней надеждой нашей нации."
 ger.1092.d: "Итальянский министр иностранных дел пригласил нашу страну на встречу в маленьком озерном городе Стреса, где они хотели бы обсудить вопрос о создании оборонительного союза с нашей нацией для защиты нашего суверенитета от Германии."
 ger.1093.d: "Германия, взявшая на себя власть над австрийскими делами, потребовала, чтобы мы вернули ей территорию Бургенланда. Эта территория является частью Венгрии на протяжении сотен лет, но, несмотря на эту Германию, безосновательно утверждает, что немецкоязычное население региона желает вернуться к германскому правлению. Несмотря на наши плохие отношения с Францией, мы все еще должны привлечь внимание к этому кризису и обратиться к нему за поддержкой, но шансы на позитивный отклик со стороны Франции невелики. Чтобы избежать кровопролития, возможно, в наших наилучших интересах удовлетворить требования Германии."
 ger.1094.d: "Венгерцы услышали наши аргументы и согласились уступить нам область немецкого большинства Бергенленда. Эта победа укрепила поддержку нашего правления над Австрией. Цель объединения Гроневичленда приближается."
 ger.1095.t: "Венгрия просит о нашей поддержке"
 ger.1095.d: "Венгры раскрыли нашей стране ультиматум из Германии, в котором они требуют контроля над основной территорией Венгрии Бергенленд. Эта территория является частью Венгрии на протяжении веков, и местное население, в лучшем случае, амбивалентно к германскому правлению. В то время как политики могут поддержать действия против Германии, многие офицеры в нашей армии предупреждают, что наши вооруженные силы могут не быть готовы к борьбе против немецкого наступательного нападения, не говоря уже о поддержке далеко запертой на суше нации."
 ger.1095.a: "Мы должны бороться с германской агрессией."
 ger.1095.b: "Зачем умирать за Дебрецена?""
 ger.1096.d: "Министр иностранных дел Франции информировал наши страны о том, что Франция не в состоянии выступать посредником в конфликте между Германией, что оставляет нашей стране мало вариантов, так как немецкий ультиматум попадает в крайний срок, мы должны подготовить наши силы к защите нашей земли любой ценой."
 ger.1097.d: "Крайний срок для нашего ультиматума против Венгрии, Венгрия все еще отказывается покинуть Бергенленд, наша армия готова к этому и заберет эту территорию силой, как только вы дадите слово."
 ger.1098.d: "Венгерская армия и правительство рухнули. Решительные действия наших вооруженных сил оставили нас под контролем всей Карпатской нации, и теперь мы должны принять решение о плане прекращения нашей военной оккупации. Простая передача власти в пользу верного венгерского режима может быть самым простым планом, но наш министр иностранных дел также предложил разделить Венгрию между соседними балканскими государствами, чтобы улучшить наше положение с ними."
 ger.1099.d: "Территориальные споры с Венгрией на протяжении многих лет осложняют отношения между нашими нациями."
 ger.1100.d: "Немецкое правительство пригласило нашу страну на военные учения. Во время Великой войны наши силы вели борьбу друг с другом почти пять лет, обе стороны никогда не могли получить преимущество по сравнению с другими. До 1919 года наши войска должны были преодолеть германское нападение. Ясно, что мы оба можем многому научиться друг у друга, но шрамы Великой войны все еще ощущаются в наших военных штабах, многие из которых опасаются Германии."
 ger.1101.d: "Британия согласилась принять участие в военных учениях с нами, обе стороны, как мы надеемся, получат в результате этого столь необходимый опыт ведения современной войны, и, как представляется, британцы также заинтересованы в дальнейшем сотрудничестве с нашей страной."
 ger.1102.d: "Британия отказалась участвовать в военных учениях вместе с нами."
 ger.1103.d: "Офицеры и люди из обеих стран прибыли в Германию для проведения англо-германских военных учений, обе стороны будут поставлены под давление, поскольку там солдаты, машины и офицеры испытываются в имитационных боевых учениях."
 ger.1104.d: "Германия предложила нам торговую сделку, в рамках которой они будут продавать нам тяжелое транспортное оборудование по цене ниже рыночной, если мы взамен продадим им наше военно-морское оборудование."
 ger.1105.d: "Британское правительство согласилось продать нам ценное военно-морское оборудование в обмен на наше тяжелое транспортное оборудование."
 ger.1106.d: "Британское правительство отказалось продать нам какое-либо военно-морское оборудование."
 ger.1107.d: "Германия предложила нам союз против французов. Наши отношения с Францией уже много лет процветают, и, возможно, настало время урегулировать наши проблемы и поле боя. При поддержке Германии мы легко заставим французов подчиниться нашей воле. Несмотря на этот аргумент, многие минстеры все еще опасаются Германии, которая, предупреждая, не закончит с Францией. С тех пор, как наполеон вступил в союз с Берлином, мы уверены, что хотим изменить это?"
 ger.1108.d: "Британия согласилась присоединиться к Штальпакту, наши цели и амбиции совпадают. Эпоха Франции, доминирующей в Европе, должна прийти к концу, как и с Наполеоном сто лет назад, обвинение будет ведомо британским и прусским оружием."
 ger.1109.d: "Несмотря на нашу взаимную ненависть к французам, Великобритания отказалась подписать официальный союз с нами, хотя французы не будут проблемой для наших вооруженных сил, оккупирующая Франция может привести к конфликту между нашими двумя странами, и мы должны пока избегать этого."
 ger.1110.d: "Германия оккупировала Литву и вместе с литовскими войсками готовится аннексировать Латвию, в условиях этого хаоса у нас появилась возможность, без какой-либо международной поддержки мы не можем без беспокойства оккупировать северную Латвию, что приблизит нашу страну на один шаг к освобождению балтийских государств."
 ger.1332.t: "Польша сдает Литву"
 ger.1332.d: "Польша согласилась с нашим ультиматумом, и теперь Литва стала частью нашей сферы влияния. &lt; &lt; Литовское восстание &gt; &gt; оказало достаточное давление на Варшаву, с тем чтобы убедиться в обоснованности наших требований отказаться как от Литвы, так и от Латвии. &lt; &lt; Националистическая фракция в Каунусе &gt; &gt; теперь контролирует страну, и с этой помощью мы поможем придать валькистскую философию их населению и балтийцам в целом."
 ger.300.t: "Вена призывает к миру!"
 ger.300.d: "В то время как наши победоносные войска двигаются все глубже в Австрию по часам, австрийское правительство в Вене взяло на себя безоговорочную капитуляцию, теперь мы контролируем всю Австрию и сейчас на шаг ближе к славе, которая является Объединенной Германической империей!"
 ger.300.a: "Приветствуем славную Немецкую Отечество!"
 ger.1053.t: "Валькисты победили."
 ger.1053.d: "После серии сражений с полицией и армией Валькисты, возглавляемые Эрнстом Калтенбруннером, захватили здание парламента и в настоящее время контролируют Австрию."
 ger.1053.a: "Мы должны сбежать в Париж."
 ger.1054.t: "Валькисты побеждены."
 ger.1054.d: "Неорганизованная валькистская толпа потерпела поражение. Австрийская полиция смогла легко справиться с их попытками переворота, и теперь лидеры валькистов собираются на суд. Хотя мы не располагаем достаточной конкретной информацией, чтобы установить, что Германия явно стоит за этой попыткой восстания. Европа больше не в безопасности. Мы должны занять сторону, чтобы пережить это столетие. Констант, несомненно, будет сопричастен к нам против немецкой угрозы."
 ger.1054.a: "Судьба нашей нации будет определена в Париже."
 ger.10511.t: "Германия позволяет нам сохранять самоуправление."
 ger.10511.d: "После валькистского переворота ожидалось, что Германия инкорпорирует Австрию непосредственно в Большой Рейх, но декрет от немецкого канцлера [ГЕР.Гедер] позволил Австрии оставаться под контролем своих собственных внутренних дел, в то время как вся внешняя политика будет диктоваться Берлином. Германия также будет иметь право назначать и отстранять от должности любого правительственного чиновника, способного смириться с этим. В то время как это утешило некоторых австрийских политиков, многие все еще являются вокальными противниками Германии."
 ger.10511.a: "Германия действительно наш друг."
 ger.400.t: ""The Future of our Republic""
 ger.400.d: "В последние дни мы стали свидетелями полного краха наших линий фронта, когда немецкие силы бьют по нашим оборонам со скоростью молнии и с жестокой эффективностью. Многие объявили, что это последние дни Третьей Республики, и надежда мимолетна. Несмотря на то, что Чарлз де Голл, недавно получивший назначение бригадного генерала за его галантные действия на ранних этапах немецкого вторжения, приблизился к неустойчивому правительству с самым радикальным планом. На протяжении последней недели он отчаянно разрабатывал планы полной эвакуации наших военных и политических сил по Средиземному морю в наши владения в Алжире, чтобы мы могли продолжать борьбу там. Мало что нужно говорить о амбициозности этого плана и просто идея о нем вызвала большие разногласия в нашем и без того ослабленном правительстве. [РООТ. Гейтер] был вынужден решить, принять или не принять планы Де Голля, и не важно, что многие французы погибнут и что поддержка его партии будет потеряна. Генерал Де Голле неоднократно подчеркивал, что это решение о том, что мы, вероятно, победуем над германскими планами, является единственным решением о том, чтобы победить нас."
 ger.400.a: "Мы должны продолжать борьбу, независимо от того, как далеко мы должны бежать..."
 ger.400.b: "Чепуха, они у нас на задней ноге!"
 ger.401.t: "Французы бегут в Алжир."
 ger.401.d: "Франция - это наша страна! Правительство Франции рухнуло. Их слабая армия не совпадала с нашей армией, и теперь они бегут в Алжир. В Европе остается лишь несколько дезорганизованных французских дивизий, которые нам предстоит убрать. Как только мы создадим дружественный режим в Париже, мы начнем подготовку к вторжению в Северную Африку. Французский флот все еще достаточно сильен, так что мы должны тщательно спланировать это. В то время как Кригсмарин и Луфтстрейтклефте полностью поддерживают вторжение многих генералов Алжира в Вермахт считают, что мы должны сфокусировать наши военные силы на более легких целях в Европе. Наша сила на суше доказана, наша ВМС нет. Пока что, хотя мы утвердили себя как величайшую власть во всей Европе, мы должны тщательно выбрать направление, чтобы сохранить эту позицию."
 ger.401.a: "Зиг Хейл!"
 ger.402.t: "Промышленное оборудование, контрабандно вывозимое из Франции."
 ger.402.d: "Тем, кто решил бежать из Франции, пришлось оставить много своего имущества. Очень мало тяжелого оборудования было доставлено в Алжир до того, как Валькист захватил материк, но секретная сеть французских партизан смогла демонтировать большое количество промышленного оборудования с заводов в южной части Франции и в настоящее время готова отправить его в Алжир для повторного сбора, что значительно увеличит объем производства местной промышленности и значительно улучшит нашу способность вести войну против Германии."
 ger.402.a: "Французский дух не может быть разрушен!"
 ger.403.t: "Судьба Франции"
 ger.403.d: "Наша победа над Французской Республикой оставила нас под контролем почти всей западной Европы. 40 миллионов негерманцев в настоящее время живут под нашей оккупацией и, конечно, не согласны с ней. Были разработаны два плана по борьбе с беспорядками. Мы можем установить марионеточный режим в Париже, возглавляемый Валькистом и главой Французской народной партии Жаком Дориотом. Эта номинальная автономия могла бы успокоить некоторые беспорядки или, как минимум, сделать их проблему более эффективной, а не нашей, но многие офицеры также считают, что мы должны позволить нашим военным непосредственно следить за гражданами Франции и использовать любую необходимую силу, чтобы держать их в курсе. В то время как второй вариант был бы дороже, он мог бы быть более эффективным."
 ger.403.b: "Немцы во главе с немцами, французский - с французским."
 ger.403.c: "Гроёчланд тянется к Атлантике."
 ger.404.t: "Создать наше правительство"
 ger.404.d: "Чтобы защитить наш режим от любых нападений от того, что осталось от "Согласия", мы должны создать наши правительственные офисы и создать армию для их защиты."
 ger.404.a: "Немецкий действительно наш друг... верно?"
 ger.4041.t: "Фабрика по нанесению ущерба в результате бомбардировок террористов"
 ger.4041.d: "Французская партизанская группа, преданная алжирскому режиму, подозревается в том, что она несет ответственность за взрыв в одном из наших промышленных комплексов."
 ger.4041.a: "С этими трусами скоро разберутся."
 ger.405.t: "Фабрика по нанесению ущерба в результате бомбардировок террористов"
 ger.405.d: "Французская партизанская группа, преданная алжирскому режиму, подозревается в том, что она несет ответственность за взрыв в одном из наших промышленных комплексов."
 ger.405.a: "С этими трусами скоро разберутся."
 ger.406.t: "Республика мертва, да здравствует Франция."
 ger.406.d: "С помощью наших немецких союзников мы смогли уничтожить то, что осталось от Французской Республики. Гражданская война окончена, и мы продемонстрировали миру, что мы законное французское правительство. Вместе с Германией мы введем наши нации в новую золотую эру богатства и процветания."
 ger.406.a: "Мир трепетает от мощи новой Франции."
 ger.407.t: "Мы дома."
 ger.407.d: "Наши солдаты вернулись в свои дома как герои и освободители, мы уничтожили незаконное правительство немецкой марионетки Жака Дориота и готовы восстановить республику в Париже. Многие празднуют эту победу, но многое еще предстоит сделать. Немецкая империя может быть ранена, но она все еще качается. Мы должны поехать в Берлин, сердце немецкого зверя, и уничтожить его."
 ger.407.a: "Да здравствует республика!"
 ger.408.t: "Объединённые Провинции атакованы!"
 ger.408.d: "Германия напала на нейтральные провинции низких земель, пытается обойти нашу оборонительную позицию на Рейне, мы должны включить эти провинции в наш союз, чтобы мы могли координировать наши стратегии и нападения."
 ger.408.a: "Наш северный сосед не должен падать."
 ger.409.t: "Швейцарская Конфедерация атакована!"
 ger.409.d: "Германия напала на нейтральную Конфедерацию Швейцарии, пытается обойти нашу оборонительную позицию на Рейне и разделить наши силы на итальянские, мы должны включить Конфедерацию в наш союз для координации наших стратегий и нападений."
 ger.409.a: "Наш восточный сосед не должен падать."
 ger.410.t: "Итальянское правительство бежит в Триполи"
 ger.410.d: "К сожалению, наши силы были побеждены, и мы вынуждены вместе с остальными членами правительства, которым удалось бежать, бежать в Ливию, чтобы бежать от немецкой оккупации."
 ger.410.a: "Вива Италия, Вива-ла демокразия!"
 ger.411.t: "Итальянское правительство бежит в Триполи"
 ger.411.d: "Мы оттолкнули трусливых итальянцев за пределы Вечного города, Рима, и теперь они, наконец, сдались нашей великой армии. Остатки итальянского правительства сбежали из континента, выбрав вместо того, чтобы сдаваться, как люди, чтобы бежать, как собаки с хвостами между ног."
 ger.411.a: "Немецкая машина не остановить!"
 ger.413.t: "Судьба Италии"
 ger.413.d: "Теперь, когда мы покорили Италию, мы должны решить, что делать с землей, мы можем сформировать марионеточное валькистское правительство при кооперативном итальянском генерале Рудольфо Грациани, сократив стоимость длительной оккупации, но мы также можем продолжить нашу оккупацию и полностью покорить полуостров."
 ger.413.b: "Немцы возглавляют немцев. Итальянцы - итальянцы."
 ger.413.c: "Гроёчланд тянется к Средиземноморью."
 ger.414.t: "Создание администрации"
 ger.414.d: "Бывшее правительство Италии, бежавшее, заставляет нас с нуля строить совершенно новую, очень непопулярную, и мы создадим свои администрации, с тем чтобы мы могли восстановить нашу сломленную нацию и защитить наш народ."
 ger.414.a: "Это должно быть сделано."
 ger.415.t: "Промышленность по нанесению ущерба &lt; &lt; Партизанам &gt; &gt;"
 ger.415.d: "Несмотря на то, что наше новое правительство обеспечивает наших граждан, как и старое, у нас по-прежнему есть партизаны и повстанцы, которые цепляются за мертвые идеалы прошлой республики. &lt; &lt; Террористы &gt; &gt; подвергли бомбардировке некоторые из наших заводов, что делает их абсолютно бесполезными. &lt; &lt; Этих мятежников необходимо уничтожить &gt; &gt; ."
 ger.415.a: "Проклятые мятежники!"
 ger.416.t: "В конце концов, в мире"
 ger.416.d: "После поражения ложного «итальянского» правительства в Ливии мы доказали населению, что мы являемся законным правительством."
 ger.416.a: "Мир в наше время"
 ger.417.t: "Освобождение материковой части"
 ger.417.d: "Слишком долго в изгнании мы наконец-то отобрали нашу великую нацию из варварского правительства Германии, освободили нашу великую столицу и вернули наше правительство к власти там, где мы принадлежим. Италия является и будет оставаться великой нацией и никогда больше не будет выступать за тиранию!"
 ger.417.a: "Вива Италия!"
 ger.418.t: "Расширить Остмарк?"
 ger.418.d: "На протяжении XIX века и после Великой войны Италия аннексировала несколько кусочков австрийской земли Гапсбург. В Венеции и Милане уже почти сто лет существуют разногласия между двумя нациями. В настоящее время вопрос заключается в том, будем ли мы вновь утверждать эти прошлые притязания, распространяя австрийскую землю на Италию или забывая идеалы давно погибших монархий."
 ger.418.a: "Уважайте старые гепсбургские утверждения"
 ger.418.b: "У нас нет времени на это."
 ger.420.t: "Побег в Канаду"
 ger.420.d: "Германия вторглась на наш остров и завоевала его гораздо раньше, чем мы могли подозревать из-за размера их флота. Многие члены парламента вместе с королем бежали через море в Канаду, откуда мы возглавим Империю в изгнании, сражаясь за границу, пока мы не вернем нашу страну. Мы не остановимся, мы не сдадимся, пока не заберем Британию и Европу из Валькистов."
 ger.420.a: "Мы вернем наше право!"
 ger.421.t: "Британское правительство бежит в Канаду"
 ger.421.d: "Британские острова сейчас находятся под контролем Германии. Чтобы избежать полного поражения, многие правительства решили бежать и прятаться там, как трусы, где находится Канада. В речи толпам Оттавы Эдуард VIII заявил, что «это только начало нашей борьбы против Германии», Эдуард заявил бы: «Храбрые мужчины и женщины Британской империи не успокоятся, пока они снова не пойдут по пляжам Довера, прогуляются по зеленым полям Уэльса и плавают в великом лотосе Шотландии». Несмотря на восходящий тон его голоса, большинству ясно, что британская ситуация потеряна. Германия теперь является неоспоримой супердержавой Европы."
 ger.4211.t: "Судьба британской Родезии"
 ger.4211.d: "Падение Британских островов оставило мир в шоке, потеря крупнейшей мировой империи оставила судьбу многих наций в состоянии лимбо, во время схватки за Африку британская империя вынудила нашу нацию отказаться от цели объединения наших колоний Анголы и Мозамбика на суше, вместо того, чтобы британцы оккупировали эту территорию, но теперь у нас есть возможность исправить это зло, оккупируем ли мы Родезию в британском отсутствии?"
 ger.4211.a: "Розовая карта будет жить!"
 ger.4211.b: "Нам не нужно вредить нашим отношениям с Великобританией."
 ger.4221.d: "Португальцы захватили нашу колонию Родезии, разорвавшую британский контроль над мысом до Каира."
 ger.4212.t: "Конец Британской империи?"
 ger.4212.d: "Британские острова попали в руки Германии. Судьба Содружества неизвестна, и даже будущее нашей нации находится под угрозой. Наше правительство разделено между британским лояльным сторонником, который хочет продолжать войну против Германии, и националистом Африканерами, которые рассматривают это как прекрасную возможность создать себя в качестве независимого государства."
 ger.4212.a: "Африканерская фракция преуспевает"
 ger.4212.b: "Действительная фракция преуспевает"
 ger.4222.d: "Южная Африка также воспользовалась этой возможностью, чтобы украсть наши колонии Южной Родезии и Юго-Западной Африки."
 ger.4213.t: "Конец Британской империи?"
 ger.4213.d: "Британские острова попали в руки Германии. Судьба Содружества неизвестна, и даже будущее нашей нации находится под угрозой. Большинство ясно, что британцы не смогут защитить Тихий океан. Мы должны взять под контроль эту катастрофу и поставить под контроль Австралии разрозненные британские колонии Тихого океана. Это позволит нам лучше защитить их и объединить нашу стратегию. Некоторые в правительстве потеряли надежду на британское дело. Они утверждают, что сейчас Австралия должна объявить себя независимым государством, которое больше не зависит от несчастной Британской империи."
 ger.4213.a: "Мы должны централизовать и обеспечить безопасность Тихоокеанского региона"
 ger.4213.c: "Австралия теперь сама по себе."
 ger.4213.b: "Сейчас не время принимать такое решение."
 ger.4223.d: "Австралия объявила себя независимой от Британской империи и разорвала все дипломатические связи с Имперским альянсом защиты. Австралийский военно-морский флот также взял под непосредственный контроль многие из наших тихоокеанских колоний."
 ger.4215.t: "Коллапс Британской империи"
 ger.4215.d: "Немецкий рейх оккупирует Британские острова, отрезая главу Содружества. Это ставит судьбу большинства британских колоний в тупик. Для нас это оставляет ценные британские порты Гонконга и Вейхайвеи на побережье Китая без защиты. У нас есть возможность захватить эти порты, приумножив наше собственное богатство. Несмотря на честолюбие некоторых министров, многие правительственные чиновники пробританцы считают их одним из столпов нашей модернизации. Все, что может навредить нашим отношениям, запятнает это наследие."
 ger.4215.a: "Эти порты станут прекрасным дополнением к нашей Империи."
 ger.4215.b: "Мы должны оставаться в хороших отношениях с Британией."
 ger.4225.d: "Наш бывший союзник Японии украл наш китайский порт Гонконг и Вайхайвей. Похоже, что Япония решила покинуть запад, утверждая, что она является великой державой. Хотя мы не можем противостоять этому поступку в данный момент, мы не должны забывать об этом коварном поступке японцев."
 ger.4216.t: "Коллапс Британской империи"
 ger.4216.d: "Немецкий рейх оккупировал Британские острова, отрезав главу Содружества, что ставит судьбу большинства британских колоний в тупик, в результате чего Мальвинские острова остаются полностью незащищенными и открытыми для захвата, мы должны исправить ошибки Великобритании и подтвердить наш суверенитет над островами."
 ger.4216.a: "Острова являются аргентинскими."
 ger.4216.b: "Мы не можем рисковать войной."
 ger.4226.d: "Аргентинские силы оккупировали Фолклендские острова, и в настоящее время судьба британских поселенцев на острове неизвестна, но мы можем быть уверены в том, что наша позиция в Южной Атлантике серьезно ослаблена, хотя мы не можем противостоять этой акции в данный момент, мы не должны забывать об этом вероломном акте аргентинцев."
 ger.4240.d: "Победа Германии на Британских островах серьезно ослабла, наша способность управлять нашим колониальным имуществом, французы воспользовались этой возможностью, чтобы занять его в нашем отсутствие, министр иностранных дел Франции заявил, что французы хотят лишь продолжать мирное функционирование канала и будут уважать британские притязания на территорию, несмотря на эту историю, что французская нация приобрела большое влияние престижа в Европе за наш счет."
 ger.4231.t: "Немецкий рейх оккупировал Британские острова, разделив главу Содружества, в результате чего судьба большинства британских колоний оказалась в лимбо, включая Гибралтар. С начала испанской войны за правопреемство территория Гибралтара была оккупирована Великобританией, несмотря на несколько попыток вернуть ее, но теперь падение Британских островов дает нам возможность раз и навсегда урегулировать это. Мы пользуемся поддержкой как испанского народа, так и правительства. Возродим ли мы Гибралтар?"
 ger.4231.a: "Конечно."
 ger.4231.b: "Мы не в форме, чтобы бросать вызов Британии."
 ger.4232.d: "Немецкая победа на Британских островах серьезно ослабила нашу способность управлять нашим колониальным имуществом. Испанцы воспользовались этой возможностью, чтобы оккупировать нашу базу в Гибралтаре. Несмотря на то, что территория находится в руках Великобритании более 200 лет, испанцы используют архаичные притязания в качестве оправдания для аннексии полуострова. Мы, возможно, не в состоянии бороться за это с Испанией, но мы никогда не забудем об этом оскорблении нашей великой Империи."
 ger.4217.t: "Обеспечение безопасности Британской империи"
 ger.4217.d: "Немецкая победа в Европе, возможно, самая большая неудача, с которой когда-либо сталкивалось Содружество, но война должна бушевать. Канада обязана защитить Америку от германской агрессии. Для содействия достижению этой цели некоторые министры предложили, чтобы мы прямо притязали на суверенитет над Британским Карибским бассейном. Это поможет организовать нашу защиту Западного полушария."
 ger.4217.a: "Этот план должен пройти"
 ger.4217.b: "На данном этапе мы не должны принимать радикальных решений."
 ger.4218.t: "Коллапс Британской империи"
 ger.4218.d: "Немецкий рейх оккупировал Британские острова, отрезав главу Содружества, что ставит судьбу большинства британских колоний в тупик. На протяжении десятилетий британцы задушили Аравийский полуостров, пора освободить братьев и освободить их от оков империализма."
 ger.4218.a: "Мы должны воссоединить Аравию"
 ger.4218.b: "Мы не можем рисковать войной с Британией."
 ger.4228.d: "Королевство Аравия оккупировало наши территории на Аравийском полуострове, несмотря на то, что мы помогли установить режим Джидды, Абд аль-Илах решил запятнать эти отношения и оккупировать наши колонии Оман, Абу-Даби и Аден."
 ger.4229.t: "Конец Британской империи?"
 ger.4219.d: "Британские острова попали в руки Германии. Судьба Содружества неизвестна, и даже будущее нашей страны находится под угрозой. Мы должны сделать все возможное для того, чтобы обеспечить безопасность Тихоокеанского региона и Новой Зеландии в будущем, но многие министры в парламенте утверждают, что это может потребовать от нас прекращения связей с Великобританией. Что бы ни было решено в ближайшие несколько лет, это, безусловно, решит судьбу нашей нации."
 ger.4219.a: "Мы должны обеспечить безопасность Тихого океана с помощью Британии."
 ger.4219.c: "Новая Зеландия должна пойти одна."
 ger.4219.b: "Сейчас не время принимать такие решения."
 ger.4229.d: "В момент нашей слабости парламент Веллингтона решил разорвать связи с Содружеством и Великобританией. Они захватили какую-то территорию в Тихом океане под прикрытием «национальной безопасности». Это серьезно ослабило наше влияние в Тихом океане."
 ger.4230.t: "Падение Британской империи"
 ger.4230.d: "Немецкий рейх оккупировал Британские острова, отрезав главу Содружества, что ставит судьбу большинства британских колоний в лимбо, включая Суэцкий канал. &lt; &lt; Суэцкий канал &gt; &gt; , построенный французскими инженерами в 1860-х годах, является с тех пор главным связующим звеном между Европой и Азией. &lt; &lt; Суэцкий канал &gt; &gt; имеет жизненно важное значение для сохранения нашей колониальной империи и, как таковой, в наших интересах быстро захватить канал, прежде чем он может попасть в руки врага."
 ger.4230.a: "Оккупировать канал"
 ger.4230.b: "Нам лучше не расстраивать британцев."
 ger.421.a: "Мы непобедимы."
 ger.423.t: "Судьба Британии"
 ger.423.d: "После поражения Соединенного Королевства у нас есть выбор, что мы должны сделать с британией, мы могли бы марионетировать их под валькистской Британией, состоящей из всех Великобритании и Ирландии, мы могли бы также сделать выбор в пользу ослабления англичан и разделить острова на Англию, Шотландию и Ирландию, наш последний вариант был бы захватить их и использовать их промышленные центры для финансирования наших военных усилий."
 ger.423.a: "Куклы Британия"
 ger.423.b: "Разделить острова"
 ger.423.c: "Германия победит всех!"
 ger.424.t: "Создание администрации"
 ger.424.d: "Бывшее правительство Великобритании, бежящее, заставляет нас с нуля строить совершенно новую, очень непопулярную, и мы должны создать свои администрации, с тем чтобы мы могли восстановить нашу сломленную нацию и защитить наш народ."
 ger.4241.t: "Партизанский вопрос"
 ger.4241.d: "Британские лоялисты составляют значительную часть нашего населения и выступают против политики нашего правительства на каждом шагу. Несмотря на все наши усилия подземные партизанские движения процветают, чтобы подорвать наш режим. Потребуются годы принуждения, чтобы положить этому конец."
 ger.4241.a: "Проклятье этих крыс."
 ger.425.t: "Бомба взрывается на оружейном заводе"
 ger.425.d: "В дерзком шаге подземные партизаны заложили взрывчатку на местной оружейной фабрике, пытаясь остановить наши военные усилия, несколько рабочих были убиты в результате нападения, и здание было повреждено, и через некоторое время мы сможем вернуть эту фабрику в строй."
 ger.425.a: "Мы должны всегда быть бдительными."
 ger.424.a: "Это должно быть сделано."
 ger.426.t: "В конце концов, в мире"
 ger.426.d: "После поражения ложного «британского» правительства в Канаде мы доказали населению, что мы являемся законным правительством."
 ger.426.a: "Мир в наше время"
 ger.427.t: "Освобождение Британских островов"
 ger.427.d: "Слишком долго в изгнании мы, наконец, отобрали нашу великую нацию из варварского правительства Германии, освободили нашу великую столицу и вернули наше правительство к власти там, где мы принадлежим. Британия является и будет оставаться великой нацией и никогда больше не будет выступать за тиранию!"
 ger.427.a: "Да здравствует король!"
 ger.428.t: "Кайзер Вильгельм II найден в Швейцарии"
 ger.428.d: "Когда Германия столкнулась с поражением в конце Великой войны, немецкий Кайзер Вильгельм II отрекся от своего трона и бежал в Швейцарию. Это заклятое поражение для немецкого народа и навсегда повредило его репутации со многими его бывшими подданными, но, несмотря на это, некоторые до сих пор хранят ностальгию для Кайзера. Его спорное наследие разделило наше правительство на то, как с ним обращаться. Некоторые валькисты считают, что на хороших условиях с Кайзером поможет усилить поддержку более консервативных элементов немецкого Рейха, но [ГЕР. Глайдер] в яростном рейхе заявил: "Этот предатель оставил свой народ мертвым, когда он отрекся!" и "Этот человек должен заплатить за свои преступления"."
 ger.428.a: "Мы должны пригласить его на ужин."
 ger.428.b: "Этот старый человек не стоит нашего времени."
 ger.428.c: "Исполните предателя!"
 ger.1012.d: "Немецкий рейх пригласил нас на конференцию для обсуждения "вопроса Западославии". Союз западных славян - это неудавшийся союз, который только разделил страны Центральной Европы. Западославия был несправедливо предоставлен Словакии в результате Версальского договора без согласия венгров и словацких граждан, составляющих большинство населения территории. Германия обещает предоставить нам территорию, если мы присоединимся к их альянсу, Штальпакту, и поможем им в ликвидации нации. Союз с Германией мог бы дать нам рычаг, необходимый для возвращения Большой Венгерской территории из Италии, Сербии и Трансильвании, но [ГЕР. Гейтер] не кажется самым надежным человеком. Если мы рискуем безопасностью нашей нации, народа и будущим ради шанса карпатского господства?"
 ger.10172.d: "Венгрия последовала за нами и присоединилась к нам в борьбе с Западославией, с их помощью мы легко раздавили славянские силы, но теперь они требуют контроля над Словакией в рамках нашего соглашения, хотя это могло показаться хорошей идеей в то время, когда многие из наших генералов считали, что союз с венгерским государством будет больше бременем, чем действительно полезным, как Австрия подвела нас во время Великой войны, теперь они беспокоятся о том, что Венгрия поступит так же, вместо этого они предлагают установить марионеточный режим в Словакии, который мы можем полностью контролировать и игнорировать слабую нацию Магияр."
 ger.10173.d: "Несмотря на то, что мы полностью поддерживаем вторжение Германии в Западославию, те предатели в Берлине отказались дать нам контроль над Словакией, территорией, за которую мы сражались и за которую умерли."
 ger.2069.t: "Судьба Словакии"
 ger.2069.d: "Когда мы приходим к власти над бывшими землями Западославия, известными как Словакия, мы держим в руках территории с большой этнической напряженностью и борьбой, хотя прямой контроль над этими территориями может быть проблематичным для нашего правительства, если мы дадим им четвёртую автономию в качестве наших подданных под полным руководством Рейха, конечно же, мы можем использовать их верность и людей."
 ger.2069.a: "Учредить рейхскоммиссарат."
 ger.2069.b: "Они будут управляться непосредственно Германией."
 ger.2070.t: "Судьба Лемко"
 ger.2070.d: "В то время как мы приходим к власти над бывшими землями Западославия, на которых проживает Лемко, мы держим в руках территории большой этнической напряженности и борьбы, хотя прямой контроль над этими территориями может быть проблематичным для нашего правительства, если мы дадим им главную автономию в качестве наших подданных, под полным руководством Рейха, конечно же, мы можем использовать их верность и людей."
 ger.2070.a: "Учредить рейхскоммиссарат."
 ger.2070.b: "Они будут управляться непосредственно Германией."
 ger.429.d: "По мере того, как враг въезжает в наше сердце, антивалькистские элементы поднимаются на ноги, и сегодня это привело к попытке убийства нашего фюрера! Дресслера обстрелял одинокий стрелок в Берлине, и его видели ныряющим на пол, чтобы избежать пуль. Паника распространяется, как есть страх, что его ударят, в то время как министр экономики и заместитель Фюрера Адольф Гитлер готовы взять на себя ответственность, если понадобится."

 germanbritish.1.d: "В ходе Великой войны Германия лишилась многих своих колониальных прав и отошла в Европу. С исцелением англо-германских связей немцы обратились к нам за предложением об инвестициях в Восточную Африку в обмен на уступки в своей бывшей колонии [546.Гетнам]. Многие из них высказываются против такого предложения, утверждая, что оно придаст нежелательное влияние в нашей империи иностранной державе. Однако многие указывают на то, что немцы решительно поддерживают нашу империю, и сделка кажется взаимовыгодной."
 #
 germanbritish.2.d: "Британия отказалась от этой сделки, заявив, что такое соглашение поставит под угрозу их собственное экономическое господство в регионе."
 #
 germanbritish.3.d: "Британия согласилась, и уже немецкие люди и капитал льются в Восточную Африку. Дома многие рассматривают это как победу и частичный отказ от одного из последствий Версаля, ибо британцы очень поддерживают экономические инвестиции и увеличение численности европейского населения в их колониях. Пусть солнце никогда не закатится на Британскую Империю!"
 #
 germanbritish.4.d: "Не секрет, что пангерманское правительство Германии заинтересовано в немецкой истории Европы, уже совершив экспедиции в Скандинавию."
 #
 germanbritish.5.d: "Британия отказалась, заявив, что она не хочет, чтобы в результате этого сотрудничества их собственное валькистское движение стало более влиятельным."
 #
 germanbritish.6.d: "Британия согласилась, и уже спонсируемые государством группы по изучению культуры англо-саксонов в обеих странах процветают. Немецкие и британские археологи и антропологи объединяются, чтобы поискать новые находки в Англии и пересмотреть то, что уже известно. В результате наблюдается рост поддержки британских валькистских движений, по мере роста интереса к старой английской истории."
 #
 germanbritish.7.d: "Немцы обратились к нам с новым предложением: они предлагают укрепить нашу дружбу с подлинным альянсом, Лондонско-Берлинской осью, осью, которую они говорят, определит курс международной политики на оставшуюся часть XX века и далее. Некоторые опасаются такой идеи, что они не хотят быть прикованы к реваншистской Германии. Однако некоторые считают это естественным завершением последних двух десятилетий развития в Европе. Французская враждебность по отношению как к Англии, так и Германии, взаимная враждебность Великобритании и Германии по отношению к красной угрозе на Востоке и отсутствие противоречивых сфер влияния являются предпоследними в англо-германском соглашении."
 #
 germanbritish.8.d: "Удивительно, но британцы отвергли предложение альянса, считая, что Германия слишком угрожает существующему мировому порядку, чтобы быть присоединенной к Британии."
 #
 germanbritish.9.d: "Не удивительно, что британцы приняли наше предложение о союзе. Многие считают это естественным завершением последних двух десятилетий развития в Европе. Французская враждебность по отношению как к Англии, так и к Германии, взаимная вражда Великобритании и Германии по отношению к красной угрозе на Востоке и отсутствие противоречивых сфер влияния все предшествуют англо-германскому соглашению. Какими бы ни были доводы в пользу союза, англо-германская связь не может быть ближе и раны от пожаров Великой войны окончательно зажили. По всему миру дипломаты других Великих держав сражаются за реорганизацию после того, как это шокирующее новое развитие разрушило существующее равновесие сил."

 germany_anti_soviet_pact.1.d: "Наша славная борьба с большевиковыми ордами бушует по всему Востоку. Мы заметили, что другие страны Европы, движимые собственным чувством выживания, также вовлечены в конфликт между жизнью и смертью с Советским Союзом. Они не являются нашими союзниками и не являются нашими врагами; они просто совершённые против общего, экзистенциального врага. ~ n/Это предоставляет уникальную возможность. Приглашая Сталпакта, мы могли бы объединить эти разрозненные усилия под нашим руководством. Мы могли бы официально оформить панъевропейский крестовый поход, введя их армии в наше стратегическое командование и разрушив Ред Менас раз и навсегда. Единый фронт был бы мощным символом и практическим консолидацией нашей силы."

 germany_anti_soviet_pact.2.d: "Из Берлина прибыло дипломатическое сообщение с персональной печатью фюрера. [FROM.GetNameDef], признав нашу отчаянную борьбу против советской угрозы, официально пригласили присоединиться к Штальпакту. ~ n no Предложение просто: единство перед лицом уничтожения. Приниматься было бы присоединение к самому мощному военному альянсу в Европе, принося полную мощь немецкой военной машины на нашу помощь. Мы больше не будем сражаться в одиночку. ~ n nn Отказаться, однако, продолжать нашу борьбу в изоляции, пойманную между молотом Рейха и московским злом. Наше выживание на грани, и решение должно быть принято."

 germany_anti_soviet_pact.3.d: "Прекрасные новости с дипломатического фронта. [FROM.GetNameDef], признавая мудрость нашего предложения, официально приняли наше приглашение присоединиться к Штальпакту. ~Нет другой народ присоединяется к нашему общеевропейскому крестовому походу против большевизма. Теперь их армии будут поставлены под наше стратегическое командование, и их народ будет защищен силой Рейха. Это новое единство только ускорит окончательный крах советского режима."

 germany_anti_soviet_pact.4.d: "Война на Востоке окончена, и наш народ наконец-то обезопасен от Красной угрозы. Однако эта победа вызывает новые вопросы. Наше членство в Сталпакте было мерой отчаяния, необходимым соглашением для обеспечения нашего выживания. С побежденным общим врагом основа этого союза исчезла. Мы должны решить, находится ли наше будущее рядом с Берлином, или пришло время восстановить нашу полную независимость и поблагодарить немцев за их помощь... с безопасного расстояния."

 germany_anti_soviet_pact.5.d: "В предсказуемом, хотя и неблагодарном, дипломатическом маневре [FROM.GetNameDef] официально объявил о своем выходе из Сталпакта, обезопасив свои границы от Советов благодаря нашей защите, теперь они считают, что они достаточно сильны, чтобы стоять в одиночестве."


