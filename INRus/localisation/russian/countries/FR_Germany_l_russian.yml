 GER_spain: "Поддержка фалангистов в Испании"
 GER_spain_desc: "Наше правительство и наши интересы очень хорошо совпадают с интересами фалангистов, и как таковые мы должны стремиться к расширению сотрудничества между нашими нациями."
 GER_fall_weiss: "Падение Вайс"
 GER_fall_weiss_desc: "Если страны Восточной Европы не станут союзниками с нами, чтобы защититься от СССР, нам, возможно, придется непосредственно вмешаться, прежде чем они упадут под социалистический режим. &lt; &lt; Уайт &gt; &gt; -- &lt; &lt; Уайт &gt; &gt; -- это проект немецкого верховного командования о военном вторжении в наши восточные соседи &gt; &gt; ."
 fall_poland: "Вторжение Польши"
 fall_poland_desc: "Для обеспечения безопасности нашей восточной границы нам нужен полный контроль над суверенитетом Польши."
 fall_ukraine: "Вторжение Украины"
 fall_ukraine_desc: "Украина является экономическим центром Восточной Европы, если бы она упала на Советы, сила равновесия в Европе была бы постоянно перенесена в их пользу, подчинение Украине является ключом к нашей постоянной безопасности."
 fall_belarus: "Вторжение Беларуси"
 fall_belarus_desc: "Беларусь экономически незначительна, но ее местоположение, всего в нескольких сотнях миль от Москвы, имеет ключевое значение для любого немецко-советского конфликта."
 GER_fate_of_denmark_dec: "Судьба Дании"
 GER_fate_of_denmark_dec_desc: "Теперь, когда мы оккупируем прежнюю Данию, мы должны решить их окончательную роль в Великом Немецком Рейхе."
 annex_denmark: "Приложение Дании"
 annex_denmark_desc: "Чтобы защитить наше негерманное побережье, мы должны сохранять полный контроль над Данией."
 puppet_denmark: "Автономия для Дании"
 puppet_denmark_desc: "Даты всегда считались хорошими немецкими волками и должны уважаться как равноправный партнер в этом рептилии."
