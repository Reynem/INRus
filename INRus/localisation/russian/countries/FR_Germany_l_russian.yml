 ### German-Hungarian events ###
 gerhun.1.t: "Венгрия желает присоединиться к Штальпакту"
 gerhun.1.d: "Отношения с Венгрией в последние несколько месяцев неуклонно расширяются, и они, очевидно, хотят присоединиться к нам в европейском господстве. Венгрия будет хорошим балканским союзником и позволит нам опосредованно обезопасить регион. Однако нам придется также прийти на их помощь в любых глупых войнах, в которых они сами окажутся."
 gerhun.1.a: "Мы согласимся."
 gerhun.1.b: "Сейчас не время брать на себя дополнительное бремя."


