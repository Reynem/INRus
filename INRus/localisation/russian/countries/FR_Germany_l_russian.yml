l_russian:

 GER_FUHRERREICH_DESC: "Новый Рейх появился. Прошло четыре года с тех пор, как валькисты Дресслера завоевали власть после победы на скачковых выборах. Экономика снова процветает, когда валькисты тратят безбожные суммы денег на оружейную индустрию, чтобы в предстоящих войнах никто не противостоял величию Германии. Но только предстоящие годы будут решать, остаются ли мечты Дресслера мечтами или же фюреррейх станет больше, чем сумма его частей, с Германией как супердержавой, к которой она всегда стремилась."

