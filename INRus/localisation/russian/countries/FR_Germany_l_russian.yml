 ### Decisions ###
 GER_the_cold_war: "Холодная война"
 GER_strike_britain: "Нанести упреждающий удар по Великобритании"
 GER_fate_of_bohemia: "Судьба Западославии"
 GER_fate_of_bohemia_desc: "Теперь, когда мы покорили жалкую нацию Западославия, мы должны принять решение о прекращении нашей военной оккупации и установить дружественные режимы на этой территории. &lt; &lt; Планы &gt; &gt; разработаны для негерманских территорий Западославия, Словакии и Лемковины."
 puppet_bohemia: "Укрепить режим Валькиста в Западославии"
 puppet_bohemia_desc: "До правления Хапсбурга Королевство Западославия было одним из самых престижных государств во всей Европе. Мы должны уважать это наследие и предоставить чешскому народу автономию в рамках нового европейского порядка."
 puppet_slovakia: "Укрепить валькистский режим в Словакии"
 puppet_slovakia_desc: "Когда мы приходим к власти над бывшими землями Западославия, известными как Словакия, мы держим в руках территории с большой этнической напряженностью и борьбой, хотя прямой контроль над этими территориями может быть проблематичным для нашего правительства, если мы дадим им четвёртую автономию в качестве наших подданных под полным руководством Рейха, конечно же, мы можем использовать их верность и людей."
 puppet_lemko: "Укрепить режим Валькиста в Лемковине"
 puppet_lemko_desc: "В то время как мы приходим к власти над бывшими землями Западославия, на которых проживает Лемко, мы держим в руках территории большой этнической напряженности и борьбы, хотя прямой контроль над этими территориями может быть проблематичным для нашего правительства, если мы дадим им главную автономию в качестве наших подданных, под полным руководством Рейха, конечно же, мы можем использовать их верность и людей."
 GER_fate_of_austria: "Судьба Австрии"
 GER_fate_of_austria_desc: "Наш переворот в Австрии увенчался большим успехом, и теперь в Вене действует дружественный режим, и сейчас мы должны решить, какую роль будет играть Австрия в Большом Немецком Рейхе."
 annex_austria: "Включить ось"
 annex_austria_desc: "Австрийская страна, несомненно, немец. С этого момента страна, известная как Австрия, станет новой провинцией Немецкого Рейха, "Остмарк""
 puppet_austria: "Автономия Австрии"
 puppet_austria_desc: "На протяжении почти тысячелетий австрийская нация гордо стояла как одна из великих держав Европы, и мы должны уважать эту историю и предоставить национальную автономию в Большом Немецком Рейхе."
 GER_fate_of_france: "Судьба Франции"
 GER_fall_of_france: "Наша победа над Французской Республикой оставила нас под контролем почти всей западной Европы. 40 миллионов негерманцев в настоящее время живут под нашей оккупацией и, конечно, не согласны с ней. Были разработаны два плана по борьбе с беспорядками. Мы можем установить марионеточный режим в Париже, возглавляемый Валькистом и главой Французской народной партии Жаком Дориотом. Эта номинальная автономия могла бы успокоить некоторые беспорядки или, как минимум, сделать их проблему более эффективной, а не нашей, но многие офицеры также считают, что мы должны позволить нашим военным непосредственно следить за гражданами Франции и использовать любую необходимую силу, чтобы держать их в курсе. В то время как второй вариант был бы дороже, он мог бы быть более эффективным."
 puppet_france: "Укрепить режим Валькиста во Франции"
 puppet_france_regime: "Франция является большой и разнообразной страной с давним наследием, и для наших государств лучше всего, если мы быстро вернем контроль над Францией местному, но дружественному режиму."
 puppet_italy: "Укрепить валькистский режим в Италии"
 puppet_italy_desc: "Италия является большой и разнообразной страной с давним наследием, и для наших государств лучше всего, если мы быстро вернем контроль над Италией местному, но дружественному режиму."
 GER_fate_of_italy: "Судьба Италии"
 GER_fate_of_italy_desc: "Теперь, когда мы покорили Италию, мы должны решить, что делать с землей, мы можем сформировать марионеточное валькистское правительство при кооперативном итальянском генерале Рудольфо Грациани, сократив стоимость длительной оккупации, но мы также можем продолжить нашу оккупацию и полностью покорить полуостров."
