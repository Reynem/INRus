 ##ukr
 UKR_RK_ukraine: "Р.К. Украина"
 UKR_RK_ukraine_desc: "В отличие от большинства других рейхскоммиссариев, Р.К. Украина имеет здоровый уровень поддержки администрации из-за широкого спектра антироссийских настроений среди многих на Западе Украины. Правительство представляет собой комбинацию немецких администраторов и членов партии ОООН, последние из которых затаивали антипольские и антироссийские настроения среди населения, обеспечивая безопасность администрации с помощью российских шрамов вторжения."

 #vrs
 SOV_rk_russland: "Р.К. Рассленд"
 SOV_rk_russland_desc: "Несмотря на то, что Р.К. Руссленд утверждает, что он является законным правительством всей России, в действительности Р.К. Русленд является артификально образованным государством, которое следует приказам Берлина с его границами, охватывающими лишь значительную часть европейской России, отрезанным от мира с небольшой береговой линией без крупных портов. Местное население не имеет достаточной лояльности к правительству, вербовка чрезвычайно затруднена, большое число дезертиров и, вероятно, те немногие, кто борется за администрацию, скорее всего, не будут готовы сделать это против российской державы."

 SOV_rk_kaukasus: "Р.К. Каукасус"
 SOV_rk_kaukasus_desc: "В отличие от других Р.К., вырезанных из трупа Советского Союза, нет никакого намерения превращать Кауза в милитаризированную булавку против ременторов Советского Союза. Вместо этого Берлин гораздо больше заинтересован в том, что находится под землей: нефть. С планами расширения Р.К. Каукасуса на другие нефтедобывающие регионы, надежда в Берлине состоит в том, что немецкая военная машина сможет беспрепятственно работать на черном золото Каукасу."

 POL_rk_polen: "Р.К. Полен"
 POL_rk_polen_desc: "Падение Польши привело к наложению карфагинального мира на скромные поляки. Огромные участки земли на севере и Западе были вырезаны из Польши, независимо от того, имеет ли они немецкое население или нет, а теперь - просто правила государства в Варшаве, покорно подчиняясь диктату Берлина. Несмотря на это, немцы пытались укрепить лояльность и дружбу с поляками, обеспечивая справедливое обращение с поляками на прилагаемых территориях и кампании по вербовке в Р.К. Полене. Однако до сих пор они добились ограниченного успеха из-за горечью по отношению к обширным аннексиям."


