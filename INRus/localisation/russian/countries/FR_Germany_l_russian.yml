 VFR_illegitimate_government: "Незаконное правительство"
 VFR_illegitimate_government_desc: "Большинство граждан Франции не считают наш режим законным. Лишь немногие подписываются на армию, а наши бюрократы, похоже, отказываются от какой-либо существенной работы. Оба эти фактора серьезно ослабили нашу способность управлять нашей страной или защищать ее."
 VBR_illegitimate_government: "Незаконное правительство"
 VBR_illegitimate_government_desc: "Это правительство не считается законным для наших граждан. Лишь немногие хотят вступить в вооруженные силы, а гражданская администрация созрела с коррупцией и саботажом, что ограничивает нашу способность успешно защищать эти земли."
