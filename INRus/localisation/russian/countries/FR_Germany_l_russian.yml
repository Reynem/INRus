 GER_fate_of_britian: "Судьба Великобритании"
 GER_fate_of_britian_desc: "После поражения Соединенного Королевства у нас есть выбор, что мы должны сделать с британией, мы могли бы марионетировать их под валькистской Британией, состоящей из всех Великобритании и Ирландии, мы могли бы также сделать выбор в пользу ослабления англичан и разделить острова на Англию, Шотландию и Ирландию, наш последний вариант был бы захватить их и использовать их промышленные центры для финансирования наших военных усилий."
 puppet_britian: "Автономия на Британских островах"
