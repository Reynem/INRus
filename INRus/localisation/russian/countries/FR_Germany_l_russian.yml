 ##### Decisions #####
 GER_german_civilwar: "Немецкая невкусность"
 GER_german_civilwar_desc: "Послевоенное разделение Германии оставило нашу нацию слабой и уязвимой. Сегодня миллионы немцев живут под иностранным правлением, во главе с отсталыми правительствами. Мы должны проводить политику объединения Германии любыми необходимыми средствами."
 war_kingdom: "Проникнуть в королевство Германии"
 war_kingdom_desc: "Британское королевство Германии является явным марионеточным режимом, стремящимся вернуть Германию в состояние монархии. Это не только оскорбление для всех немцев, погибших в битве в Кайзере, но и для всех немцев, которые стремятся к справедливости и свободе для своей семьи. Мы должны свергнуть этого ложного короля, чтобы объединить Германию."
 war_republic: "Ввести в действие Республику Германия"
 war_republic_desc: "Французская ведущая Немецкая Республика - это просто современная Конфедерация Рейна. Пока Франция обладает каким-либо суверенитетом над Германией, Европа не является действительно свободной. Мы должны уничтожить эту ложную республику, чтобы объединить Германию."
 war_soviet: "Введите Немецкую ССР"
 war_soviet_desc: "Советская ведущая немецкая ССР - это всего лишь уловка для распространения социализма на все страны Европы. Стабильность на континенте не может быть гарантирована до тех пор, пока красная угроза находится в центре западной цивилизации. Мы должны уничтожить социализм и всех, кто его распространяет."
 war_bavaria: "Ввести в действие Немецкую Федерацию"
 war_bavaria_desc: "Ведущая немецкая Федерация США является последним примером американского империализма в Европе. Такое господство из Вашингтона является явным нарушением права нации на самоопределение. Чтобы ограничить американское влияние в Европу, мы должны атаковать любую опору, которую они пытаются занять."


 ##### Events #####
 gercw.0.d: "Оружие, наконец, утихло по всему континенту. От поля Франции до обширных уголков Востока, немецкий орлан стоит верх, наши враги смирились, их столицы заняты или их влияние разрушено. Однако, как только дым очищается, мы окажемся в измененном мире. Победа - это не конец, а начало. Мы оберегаем свое место на солнце, но тень новой борьбы, холодного, расчетного соперничества за будущее цивилизации уже начинает вспыхивать. Рейх пережил свое величайшее испытание; теперь он должен научиться править руинами, которые он завоевал."

 gerfate.1.t: "Алжирская конференция"
 gerfate.1.d: "Наш министр иностранных дел предложил, чтобы мы и все другие крупные державы, находящиеся в состоянии войны с Немецким Рейхом, собрались в городе Алжире для обсуждения вопроса о реорганизации Европы после войны."
 gerfate.1.a: "Мы должны оставить это между нами и Италией."
 gerfate.1.b: "Мы должны пригласить Бритиана."
 gerfate.1.c: "Мы должны пригласить все западные державы."
 gerfate.1.f: "Нам выгодно иметь хорошие отношения с Советами."
 gerfate.1.e: "Мы должны призвать все крупные державы обеспечить мир"
 gerfate.2.t: "Франция приглашает нас на Алжирскую конференцию"
 gerfate.2.d: "Наш союзник Франция пригласила нас на конференцию в городе Алжире для обсуждения окончательной судьбы немецкого рейха и послевоенной реорганизации Европы."
 gerfate.2.a: "Мы будем присутствовать."
 gerfate.2.b: "У нас свои планы."
 gerfate.5.t: "Франция приглашает нас на Алжирскую конференцию"
 gerfate.5.d: "Наша соседка Франция пригласила нас на конференцию в городе Алжир для обсуждения окончательной судьбы Немецкого Рейха и послевоенной реорганизации Европы."
 gerfate.5.a: "Мы будем присутствовать."
 gerfate.5.b: "У нас свои планы."
 gerfate.6.t: "Франция приглашает нас на Алжирскую конференцию"
 gerfate.6.d: "Франция пригласила нас на конференцию в городе Алжир для обсуждения окончательной судьбы немецкого рейха и послевоенной реорганизации Европы."
 gerfate.6.a: "Мы будем присутствовать."
 gerfate.6.b: "У нас свои планы."
 gerfate.7.t: "Франция приглашает нас на Алжирскую конференцию"
 gerfate.7.d: "Франция пригласила нас на конференцию в колониальном городе Алжире для обсуждения окончательной судьбы немецкого рейха и послевоенной реорганизации Европы."
 gerfate.7.a: "Мы будем присутствовать."
 gerfate.7.b: "У нас свои планы."
 gerfate.3.t: "[FROM.GetName] соглашается присутствовать"
 gerfate.3.d: "Для обеспечения мирного поствоенного перехода в Европе [FROM.GetName] согласился присоединиться к Алжирской конференции."
 gerfate.3.a: "Тост за [Фром. Найти имя]"
 gerfate.4.t: "[FROM.GetName] отказывается присутствовать"
 gerfate.4.d: "Амбициозный [FROM.GetName] отказался сдать какую-либо оккупированную территорию на благо европейского сообщества и подпишет свой собственный мир с Немецким Рейхом"
 gerfate.4.a: "Именно такое отношение и стало причиной этой войны."
 gerfate.10.t: "Судьба оккупированной Германии"
 gerfate.10.d: "Теперь, когда Германия подписала неограниченную капитуляцию союзным державам, нам пора решить, как нам поступить с нашей оккупационной зоной."
 gerfate.10.a: "Создать Германскую Республику"
 gerfate.10.b: "Мы должны разделить Германию"
 gerfate.11.t: "Судьба оккупированной Германии"
 gerfate.11.d: "Теперь, когда Германия подписала неподкупную капитуляцию союзным державам, настало время решить, как нам поступить с нашей оккупационной зоной."
 gerfate.11.a: "Отдай южную Германию Германской Республике"
 gerfate.11.b: "и дал им Австрию тоже."
 gerfate.11.e: "Германии лучше разделиться."
 gerfate.12.t: "Статус Рейнской земли"
 gerfate.12.d: "С большей частью Германии в нашей сфере влияния некоторые министры начали ставить под сомнение необходимость сохранения эритрейского сеперата из Германии. В знак доброй воли мы должны вернуть Рейнленд нашему новому немецкому союзнику."
 gerfate.12.a: "Германия воссоединится"
 gerfate.12.b: "Мы предпочитаем статус-кво"
 gerfate.13.t: "Польские претензии в Германии"
 gerfate.13.d: "С момента окончания Великой войны восточная граница Германии активно обсуждается между Берлином и Варшавой."
 gerfate.13.a: "Мы создадим польский коридор"
 gerfate.13.b: "и даровать им Верхнюю Силезию"
 gerfate.13.c: "Восточная Пруссия"
 gerfate.13.e: "Восточная Померания"
 gerfate.14.t: "Судьба Гольштейна"
 gerfate.14.d: "В ходе Великой войны Немецкий Рейх пришел, чтобы завладеть Гольштейном из-за датского правления, хотя это действие было незаконным, следует отметить, что большинство стран региона в большей степени связаны с Германией, чем с Данией, хотя на законном основании мы обязаны вернуть регион Дании, возможно, в наилучших интересах всех заинтересованных сторон вернуть регион в Немецкую Республику."
 gerfate.14.a: "Дания не имеет права на этот регион"
 gerfate.14.b: "Народ Шлезвига будет ценить Датское правление."
 gerfate.14.c: "Холстьен по закону является датчанином"
 gerfate.14.e: "Холстьен по закону является датчанином, даже Гамбургом."
 gerfate.17.t: "Судьба Германии"
 gerfate.17.d: "Теперь, когда Германия подписала неодиативную капитуляцию союзным державам, настало время решить, как нам поступить с нашей оккупационной зоной. В то время как многие министры поддерживают Единую Германскую Республику Франции, есть министры, которые предлагают создать единое немецкое Королевство, которое будет династически связано с нашей собственной монархией. Хотя сильный немецкий союзник мог бы принести большую пользу нам и Империи, он, возможно, не стоит того, чтобы иметь еще одну власть, способную вести с нами войну, именно поэтому некоторые минстеры разработали контрплан разделения нашей зоны на малые государства, зависящие от нас для выживания."
 gerfate.17.a: "Возвращение нашей зоны в Немецкую Республику"
 gerfate.17.b: "Мы разделим нашу зону"
 gerfate.17.c: "Мы создадим Королевство Германия."
 gerfate.18.t: "Судьба Германии"
 gerfate.18.d: "Теперь, когда Германия подписала неодиативную капитуляцию с союзными державами, настало время решить, как нам поступить с нашей оккупационной зоной. Наше правительство разделено между поддержкой французского плана для Германии и британского плана. Немецкая Республика более не согласна с нашей политикой самоопределения, но, возможно, лучше быть в хороших отношениях с Лондоном. В середине этой дискуссии в нашем правительстве есть и другие, кто поддерживает планы создания немецкой федерации под руководством США. Эти страны стали бы одним из аспектов свободы в хаосе Европы."
 gerfate.18.a: "Возвращение нашей зоны в Немецкую Республику"
 gerfate.18.b: "Возвращение нашей зоны в Немецкое Королевство"
 gerfate.18.c: "Мы создадим федерацию Германии."
 gerfate.19.t: "Судьба Германии"
 gerfate.19.d: "Теперь, когда Германия подписала неограниченную капитуляцию с союзными державами, нам пора решить, как нам поступить с нашей оккупационной зоной. Согласно нашему соглашению с Францией, у нас есть полная власть в нашей зоне, и как таковая мы должны использовать эту неприкрытость для освобождения рабочих Германии. Создание социалистического государства в Германии, родины Карла Маркса, помогло бы придать нашей идеологии легитимность на мировой арене. Некоторые члены нашего правительства, хотя и не желают расстраивать западные державы, особенно Францию. Возвращение этой зоны во Францию помогло бы поддерживать хорошие отношения. Очевидно, что это ревизионизм и его следует игнорировать, но не следует запутывать угрозу Германии. Разрушение нашей зоны в более мелкие и более зависимые государства помогло бы предотвратить повторную Войну."
 gerfate.19.a: "Мы создадим Немецкую ССР"
 gerfate.19.b: "Мы должны вернуть нашу зону в Немецкую Республику."
 gerfate.19.c: "Мы должны разделить Германию"
 gerfate.20.t: "Судьба Германии"
 gerfate.20.d: "Теперь, когда Германия подписала неограниченную капитуляцию с союзными державами, нам пора решить, как нам поступить с нашей оккупационной зоной. Согласно нашему соглашению с Францией, у нас есть полная власть в нашей зоне, и как таковая мы должны использовать эту неприкрытость для освобождения рабочих Германии. Создание социалистического государства в Германии, родины Карла Маркса, помогло бы придать нашей идеологии легитимность на мировой арене. Некоторые члены нашего правительства, хотя и не желают расстраивать западные державы, особенно Францию. Возвращение этой зоны во Францию помогло бы поддерживать хорошие отношения. Очевидно, что это ревизионизм и его следует игнорировать, но не следует запутывать угрозу Германии. Разрушение нашей зоны в более мелкие и более зависимые государства помогло бы предотвратить повторную Войну."
 gerfate.20.a: "Мы создадим Немецкую ССР"
 gerfate.20.b: "Мы должны вернуть нашу зону в Немецкую Республику."
 gerfate.20.c: "Мы должны разделить Германию"
 gerfate.8.t: "Сдача Германии"
 gerfate.8.d: "Сегодня германские делегаты пришли на переговоры о неодиативной капитуляции Германии. Выступая от имени министра иностранных дел Германии Альфреда Розенберга, делегаты пообещали немедленное разоружение всех немецких подразделений и сдачу всех правительственных чиновников в стране. Статус немецкого фюрера [ГЕР.Гегера] не был подтвержден немецкими делегатами, но подозревается, что он покинул страну и скрывается. Несмотря на это, мы можем вздохнуть с облегчением, что вторая Великая война, самый смертоносный конфликт в истории человечества, закончилась. Европа находится в мире, и сейчас настало время установить нашу оккупацию Германии."
 gerfate.8.a: "Консенсус будет заниматься оккупацией Германии."
 gerfate.8.b: ""Согласие" и "Британия" разберутся с оккупацией Германии."
 gerfate.8.c: "Согласие, Великобритания и США справятся с оккупацией Германии."
 gerfate.8.e: "Консенсус и США разберутся с оккупацией Германии."
 gerfate.8.f: "Консенсус и СССР будут заниматься оккупацией Германии."
 gerfate.8.h: "Все крупные державы должны принимать участие в оккупации"
 gerfate.20.t: "Германия объединёна."
 gerfate.20.d: "После многих лет борьбы Германия наконец объединилась под одним флагом."
 gerfate.20.a: "Einigkeit und Recht und Freiheit"

 ##### Ideas #####
 GER_divided_nation: "Разделенная нация"
 GER_divided_nation_desc: "Внешняя политика нашей страны номер один состоит в том, чтобы объединить Германию под одним флагом. Германия не может быть разделена. Наш долг состоит в том, чтобы воссоединить нашу страну выше всех нас."

 ###OST
 GER_lithuanian_puppet: "Р.К. Остленд"
 GER_lithuanian_puppet_desc: "Р.К. Остланд - это государство, которое просто танцует под песню диктата Берлина, что является продолжением немецкого государства на востоке. Он делает и стремится править большим количеством белых русских, литовцев, поляков, эстонцев и латышцев. &quot; Балтийская немецкая благородство &quot; , держит эти группы под контролем, внося при этом большой вклад в военные силы этих штатов, хотя их непропорциональное влияние на государство наносит ущерб легитимности нашего государства в глазах туземцев, которых мы ищем таким образом правят честно."
 GER_ostland: "Учредить Р.К. Остланд"
 GER_ostland_desc: "Вместо того чтобы иметь восток от различных малых государств на востоке, мы должны стремиться к созданию обширной балтийской ограды против российской угрозы. Объединение этих разрозненных национальностей под балтийским немецким правящим классом должно создать идеальную границу для защиты нашего восточного фланга."
 GER_expand_ostland: "Расширить Остленд"
 GER_expand_ostland_desc: "Теперь мы создали Остленд, и мы должны стремиться интегрировать новые территории в то, что мы намерены стать огромным буфером."
