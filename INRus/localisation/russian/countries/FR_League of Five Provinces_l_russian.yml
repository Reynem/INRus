 #Focus

 #Events
 lfp.1.t: "Битва за Янцзы"
 lfp.1.d: "Власти правительства Бейянга в последние недели испарились из Восточного Китая, и региональные военные бароны процветают по всей сельской местности, оккупируя все крупные города к северу от реки Янцзы, где отсутствует клика Жецзян. Несмотря на то, что наш контроль над Жецзяном гарантирован, Наньцзин, Сучжоу и Шанхай проживают лишь в нескольких километрах от враждебных провинций Анцин и Цзянсу, и их положение крайне уязвимо для внезапного нападения."
 lfp.1.a: "Провинции восстания будут умиротворены."
 ###
 lfp.2.t: "Анхуи и Цзянсу восстановлены!"
 lfp.2.d: "Признавая наши притязания на провинции Анхуи и Цзянсу, Северная Жили Клика согласилась вернуть нам эту провинцию, чтобы укрепить наш союз."
 lfp.2.a: "Доверчивые союзники стоят того."
 ###
 lfp.3.t: "Бедный Чжэцзян..."
 lfp.3.d: "Наньцзянская клика долгое время держала гегемонию над восточными провинциями Китая, простираясь от Цзянсу до Фучжоу и до Вучана. События предыдущих месяцев оказались не чем иным, как шокирующими, поскольку волна волнений опрокинула нашу позицию и превратила нас в румянец. Но даже в пределах территории, которая остается верной нам, мы не без проблем. В 1920—24 годах националистские силы Куоминтанга, базирующиеся в Гуанчжоу, начали несколько военных кампаний в Чжэцзяне в попытке вырвать от нас контроль над провинцией. В то время как каждый раз они были побеждены, это было в основном из-за неуверенности на юге и особенно из-за сопротивления Чэнь Цзюньминга доктрине Сун-Ятсена. Вслед за этим многие боевики Куоминтангов были вынуждены провести несколько военных кампаний в Чжэцзяне, пытаясь создать внутренний мятеж и создать самолётное движение, от которого правительство Гуанчжоу могло бы воспользоваться. Хотя эти мятежники были легко ввернуты в прошлые годы, наше внимание было разделено с активнымиными планами Цанцами, и нашими нападами, и мы, чтобы надолго надолга, мы нато надолго нато нато нато нападали, и мы, мы, и нападали на самом деле, и Цанге, мы, мы, мы, мы, мы, и нато, мы, и нападали на самом деле, мы, мы, мы, и на самом деле, мы, и нападаем на самом деле, мы, и нападаем на думаем на нашу х на ху на х на х на ху на х, на х на ху на ху на хуху, на хуху, на хухухухухухухуху, на хухухухухухухухухухуху, на ху, на ху, на ху, на хухуху, на ху, на ху, на"
 lfp.3.a: "Проклятые революционеры!"
 ###
 lfp.4.t: "Предложение Чжао Фэнки"
 lfp.4.d: ""
 lfp.4.a: "Выделить необходимые отделы"
 lfp.4.b: "Мы не можем тратить ресурсы"
 ###
 lfp.5.t: "Смелый план Ши Юсана"
 lfp.5.d: ""
 lfp.5.a: "Это может просто удержать их..."
 lfp.5.b: "Это только усугубит ситуацию."
 ###
 lfp.6.t: "Продвижение KMT застопорилось!"
 lfp.6.d: "И наконец, есть хорошие новости. Несмотря на то, что последствия наших усилий наконец-то проявились, мы видим, что деятельность Куоминтанга в Чжэцзяне в результате наших военных действий существенно застопорилась. Это позволило нам выиграть ценное время, но КМТ пока еще не была вывезена из региона, поскольку наша армия все еще связана с Севером, мы не можем совершить эффективное нападение для обеспечения безопасности нашего Южного фронта. Как только предатели потерпят поражение, мы сможем раздавить КМТ и утвердить свою позицию в Восточном Китае."
 lfp.6.a: "Какое облегчение."
 ###
 lfp.7.t: "Доклад для Пекина"
 lfp.7.d: "По мере того, как политическая ситуация вокруг Наньцзин становится все более отчаянной, мы привлекли внимание нашего начальства в Пекине."
 lfp.7.a: "Всё под контролем, ситуация нормальная, мы все в порядке, спасибо."
 lfp.7.b: "Ву, у нас будет компания."
 ###


 #Ideas
 lfp_war_for_shanghai: "Война за Шанхай"
 lfp_war_for_shanghai_desc: "Нелегкий мир вдоль Янцзы был разорван, а война заняла свое место над судьбой Шанхая."
 ###
 lfp_zhili_integration: "Постепенное снижение автономности"
 lfp_zhili_integration_desc: "С триумфом Северного Жили и их врагами на заднем плане правительство [BEI. Capital. GetName] сосредоточило усилия на повторной интеграции южного Жили, базирующегося в [LFP. Capital. GetName]."
 ###
 LFP_looming_kmt_threat: "Штринги в Чжэцзяне"
 LFP_looming_kmt_threat_desc: "Клика Наньцзян поклялась победить изменники провинций Анхуи и Цзянсу, сосредоточив свои усилия на Нортварде, однако в южных районах провинции Чжэцзян по-прежнему сохраняется крупномасштабное повстанческое движение в Куоминтанге, которое с каждым днем может перерасти в полномасштабное восстание."
 ###
 lfp_political_integration: "Политическая интеграция"
 lfp_political_integration_desc: "Северная Жили готовится к заключительным этапам интеграции для нашей Клик, скоро мы окажемся полностью поглощенными их командованием и снова будем под их непосредственным контролем."

 #Decision categories
 LFP_kmt_cat: "Угроза Куоминтанга"
 LFP_kmt_cat_desc: "С началом войны вдоль реки Янцзы мы были отрезаны от наших союзников по Жили в Пекине, и теперь Куоминтанг стоит на расстоянии от наших населенных пунктов. К счастью для нас, их мобилизация была медленной, а их армии все еще бурят, чтобы противостоять высшей армии Жили. Несмотря на то, что мы не сталкиваемся с непосредственной угрозой со стороны самого Куоминтанга, в южных районах нашего района остается большой контингент мятежников Куоминтанга. Нам нужно будет направить миссии для того, чтобы сорвать их деятельность, если мы хотим избежать полномасштабного восстания, пока наши армии будут заняты предателями на севере."

