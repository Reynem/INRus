 LFP_kmt_propaganda_attack: "[KMT.GetFlag] §YStrike в Lishui§!"
 LFP_kmt_propaganda_attack_desc: "Клетки Куоминтанга были обнаружены глубоко в сельской провинции Лишуи, организуя военную кампанию."
 ###
 LFP_kmt_sweep_towns: "[KMT.GetFlag] §YFlank Повстанцы Тайджоу §!"
 LFP_kmt_sweep_towns_desc: "Опыт Ши Юсана в ассиметрической войне дает ему преимущество в необычных сценариях, где более традиционный генерал может поколебаться, поэтому мы отправим его в провинцию Тайджоу, где он перебросит свою армию через побережье и перебросит Куоминтанг в регион, купив нам жизненно важное время."
 ###
 LFP_destroy_insurgents: "[KMT.GetFlag] §Gragester the Insurstion§!"
 LFP_destroy_insurgents_desc: "С обеспечением безопасности Северного фронта мы можем, наконец, обратить все внимание нашей армии на революционеров, причиняющих хаос на юге, и вытеснить их с нашей территории раз и навсегда."

