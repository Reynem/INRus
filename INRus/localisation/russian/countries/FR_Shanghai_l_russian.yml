 ### Ideas ###
 SHN_seppos: "Американское вмешательство"
 SHN_seppos_desc: "Американцы, конечно же, были наименее довольны захватом британскими властями международного урегулирования, особенно с учетом того, что его формирование произошло в результате объединения британских и американских зон в 1863 году, в результате чего американцы постоянно пытаются подорвать британские власти, используя как политические средства, так и накормить оружием злоумышленников, мы должны ограничить американское влияние, если мы хотим сохранить стабильность."
 SHN_royal_shanghai_defence_force: "Королевские силы обороны Шанхая"
 SHN_royal_shanghai_defence_force_desc: "Создание сил обороны из европейских общин и выходцев из Шанхая было в значительной степени успешным делом, они хорошо подготовлены, оснащены и подготовлены к любым попыткам вторжения в Шанхай, даже ведутся переговоры о приобретении британских кораблей для этих хорошо финансируемых сил обороны, однако для набора и подготовки этих сил требуется много времени, что означает быструю мобилизацию совершенно не обсуждается."
 SHN_british_takeover: "Британское правление Шанхая"
 SHN_british_takeover_desc: "В 1931 году, после Великой депрессии в США и серьезной нестабильности в Китае, британцы взяли на себя международное урегулирование, хотя многие страны тихо протестовали, громче всего в США, большинство из них признали, что поглощение было простой формальностью после усиления британского влияния и повышения значимости для безопасности Шанхая, Шанхай пережил достойный экономический рост и расширение торговли с остальной частью империи, в то время как многим секторам был нанесен ущерб в результате сокращения торговли с остальной частью Китая, который по-прежнему возмущен британским захватом и расширением территории Шанхая. Британцы в значительной степени выиграли от этого соглашения и готовы щедро инвестировать в процветание и безопасность Шанхая."

