 #### Political Ministers ####


 #####Ideas#####
 HOL_enemies_on_all_sides: "Враги со всех сторон"
 HOL_enemies_on_all_sides_desc: "Неоправданная агрессия против нас в Версале была лишь первой из серии предательств, которые оставляли нас в изоляции в нашем уголке Европы. На Юге бельгийцы, которые, как мы уверены, жаждут большего количества нашей земли, и которые, вероятно, будут сотрудничать с французами, остающимися враждебными по отношению к нам. На наш Юго-Восточный Восток - это Рейн, занятый враждебными французами, которые не хотели бы больше ничего больше, чем дружеское правительство. На нашем Востоке - немцы, потенциальный союзник, каким бы не был тот, который в последнее время увязал бельгийских граждан, и чья риторика о пан-германизме вызывает у нас опасения. На Западе - это британцы, которые в целом более нейтральны, но при этом испытывают явные соболезнования к правительству Суринама и продолжают действовать в качестве защитников подлых бельгийских властей. Пока мы не заключим союз с одной из этих держав, голландцы будут стремиться и готовы к любым попыткам вторгнуться в наши земли."

