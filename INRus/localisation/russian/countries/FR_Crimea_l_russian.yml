 #Leaders
 CRI_pyotr_wrangel: "Pytr Wrangel"
 # CRI_pyotr_wrangel_regnal: "Пиот IV"
 CRI_pyotr_wrangel_leader_desc: "Среди русских генералов балтийского немецкого происхождения, которых много, Пиотр Вранжел, возможно, самый знаменитый, талантливый офицер кавалерии из семьи, которая одарила несколько командиров Императорской российской армии, Врейнгл отличился во время наступательных действий Брусилова, где он показал себя агрессивным, но заслуживающим доверия командиром. В течение короткого времени, после Октябрьской революции, он работал с украинским государством Павло Скоропадски и до сих пор с любовью помнит Хетмана, но сдался с поста, чтобы не служить немецкой оккупации, и вызвался добровольцем в армию добровольцев. Это здесь легенда так называемой ."Black Baron\" began - the air of nobility and respectable loyalty around his persona built up gravitas among his men and his enemies, who started singing songs about the evil baron restoring the Tsar's throne.\n\nAfter the Russian Civil War, Wrangel remained in the army and rapidly climbed up in command thanks to the talent he showed during the war. Though generally apolitical, he vividly remembers the Russian Civil War and is willing to do anything it takes to prevent such a travesty from befalling Russia again - even if it means taking control of the nation and directing it with an iron fist. And no matter what he might do, his officers will follow him regardless - to this day, junior officers in the Army ask themselves: \"If Baron Wrangel was here, what would he do?\""
 #CRI_pyotr_wrangel_regnal_leader_desc: "Среди русских генералов Балтийского немецкого происхождения, которых много, Пиотр IV Вранжел, возможно, самый известный, талантливый офицер кавалерии из семьи, которая одарила несколько командиров Императорской Российской армии, Врейнгл отличился во время наступательных действий Брусилова, где он показал себя агрессивным, но заслуживающим доверия командиром. В течение короткого времени, после Октябрьской революции, он работал с украинским государством Павло Скоропадски и до сих пор с любовью помнит Хетмана, но ушел в отставку, чтобы не служить немецкой оккупации, и вместо этого вызвался добровольцем. Это здесь легенда так называемой так называемой добровольческой армии ."Black Baron"began - the air of nobility and respectable loyalty around his persona built up gravitas among his men and his enemies, who started singing songs about the evil baron restoring the Tsar's throne.\n\nAfter the Russian Civil War, Wrangel remained in the army and rapidly climbed up in command thanks to the talent he showed during the war. Though generally apolitical, he vividly remembers the Russian Civil War and is willing to do anything it takes to prevent such a travesty from befalling Russia again - even if it means taking control of the nation and directing it with an iron fist. And no matter what he might do, his officers will follow him regardless - to this day, junior officers in the Army ask themselves"If Tsar Pyotr was here, what would he do?""
