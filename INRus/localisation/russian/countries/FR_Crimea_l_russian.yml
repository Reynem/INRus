 #### Political Parties ####

 CRI_vanguardist_party: "РКП"
 CRI_vanguardist_party_long: "Российская Коммунистическая партия"
 CRI_collectivist_party: "РКП"
 CRI_collectivist_party_long: "Российская Коммунистическая партия"
 CRI_libertarian_socialist_party: "РКП"
 CRI_libertarian_socialist_party_long: "Российская Коммунистическая партия"
 CRI_social_democrat_party: "Социальные революционеры"
 CRI_social_democrat_party_long: "Партия была основана в 1900 году. В ее основе лежит идеология Народника, а их идеологическими предшественниками являются Александр Герцожен и Пиот Лавров. Партия была опущена в два крыла. Правое крыло предназначено для классовой коллаборации и является патриотичным. Левое крыло является аграрным. Партия использовала политический терроризм до 1909 года и была очень контровсеративной. В то время SR-Maximalist и народный социалист разделились с партией. В российской гражданской войне левое крыло партии, совпадавшее с большевиками, в то время как правое крыло было с белым движением."
 CRI_social_liberal_party: "Народная социалистическая партия"
 CRI_social_liberal_party_long: "Народная социалистическая партия является популистской партией, которая была основана в 1906 году. Истоки партии лежат в Народниках и Популистском законном движении. Николай Михайловский и Александр Херзен рассматриваются как идеологические предшественники. В российской гражданской войне было выдвинуто предложение объединиться с Трудовиками, но ей не хватало поддержки, так что она так и не была реализована.§!"
 CRI_market_liberal_party: "Кадеты"
 CRI_market_liberal_party_long: "В 1905 году в ходе российской революции Павел Милюков создал Konstitutsionno-Democratichesky Partya n §g Кадеты, которые были крайне радикальными в начале поддержки всеобщего избирательного права и намеков на республиканец."
 CRI_social_conservative_party: "Национальный центр"
 CRI_social_conservative_party_long: "Национальный центр состоит из бывших членов Кадетов, которые ненавидели идеи руководства. Они хотят восстановить монархию и уменьшить бюрократию в экономике. Они также хотят улучшить образование. §!"
 CRI_authoritarian_democrat_party: "Российский альянс"
 CRI_authoritarian_democrat_party_long: "Российский союз"
 CRI_paternal_autocrat_party: "Союз 17 октября"
 CRI_paternal_autocrat_party_long: ""Союз 17", "Октября" ..n §g§!"
 CRI_national_populist_party: "NP"
 CRI_national_populist_party_long: "NP состоит из реакционных генералов. Их целью является искоренение Советского Союза и исключение любого иностранного влияния."
 CRI_valkist_party: "НУС"
 CRI_valkist_party_long: "Natsional'nyy Soyuz Solidarnosti n §gThe NUS — очень предвзятая партия, поддерживающая создание государства, в котором высшая палата парламента полностью состоит из ученых, инженеров, писателей... и нижнюю палату бизнесменов, они хотят осуществить социально прогрессивные реформы и объединить всех людей российской культуры. Они были частью молодежной организации октобериста, но позднее превзошли партию.§!"

 #Decisions
 CRI_retaking_homeland: "Возвращение России"
 CRI_retaking_homeland_desc: "Хотя наш маленький аванпост на Черном море может показаться незначительным, наши амбиции велики; мы вернем Россию от красной угрозы!"
 CRI_core_sov: "Подготовить российскую администрацию"
 CRI_announce_claims: "Объявление большего количества российских претензий"

 #Event
 cri_russia.1.d: "Шрамы Гражданской войны по-прежнему глубоко пересекают территорию, на которую претендует южная Россия. Мы - нация, построенная на хрупком фундаменте белых побед и усталости большевиков, хрупкое государство, окруженное амбициями более сильных держав. На востоке находится колоссальный и задумчивый Советский Союз, враг которого идеологическая ненависть не остыла, а просто остановилась. Наша долгая, напряженная граница с Советами является постоянным источником военной и политической тревоги; стычки - это обычный процесс, а полномасштабное вторжение - это лишь вопрос времени и планирования Кремля. На севере мы осторожно смотрим на новую независимую, но не менее уязвимую Украину. Хотя у нас есть некоторые культурные связи и общая граница, точное разделение территории остается неустойчивым, и украинский национализм создает свою собственную сложную проблему. Наше правительство в Севастополе сохраняет хрупкую власть над коалицией казаковых хозёров. В то же время, возможно, мы имеем не только договор, но и перемирие. Воздушный воздух с ощущением как параной, так и возможности, в то время, когда мир является хрупкимым, может быть, ."
 cri_russia.2.d: "Южная российская армия, установив свою силовую базу после первоначального краха большевиков, с осторожностью наблюдает за возобновлением борьбы между Советскими и дальневосточными российскими войсками. Наша главная задача по-прежнему заключается в консолидации и реконструкции южной России, что является огромной задачей, требующей от каждого человека и ресурсов. Хотя мы не питаем любви к большевикам и все еще считаем их нашим конечным врагом, мы рассматриваем кампанию Дальнего Востока как дорогостоящее и далекое отвлечение внимания. Наше Высшее командование разделено: некоторые выступают за вмешательство в поддержку наших белых братьев и за ликвидацию угрозы колхозников, в то время как другие предупреждают, что размещение сил в этой кампании опасно протянуло бы наши границы и поставило бы под угрозу стабильность, которую мы так с трудом одержали. Пока война вдали от наших границ, и южная Россия должна решить, взять на себя обязательство вести решительную войну или приоритизировать внутреннюю силу и оборону."
 cri_russia.5.d: "Длинный, жестокий конфликт против режима большевиков наконец-то завершился. Наши две великие силы, отделив советского зверя от противоположных направлений, теперь стоят триумфально. Армия [от Гетнама], обеспечившая безопасность столицы в Москве, создала рамки нового правительства, но [РООТ.Гетнам] принес огромные жертвы и притязал на равную власть. С устранением советской угрозы неизбежный вопрос о едином контроле теперь висит на балансе. Их командир требует, чтобы руководство [РООТ.ГЕТ] признало наш единый знаменатель и присоединилось к нам, чтобы сформировать по-настоящему новую Россию."

 #Ideas
 RUS_final_stand_of_south_russia: "Окончательная позиция Южной России"
 RUS_final_stand_of_south_russia_desc: "После продвижения по Москве, совершенного по приказу Деникина, армия Южной России попала в дальний отъезд, только спасённый быстрой реорганизацией и стабилизацией под Wrangel. Почти 20 лет спустя, и это военное государство по-прежнему имеет лишь слабую гражданскую администрацию, настоящую армию с государством. По мере того, как красные снова взбунтовываются на восток, силы Врангла стоят на месте: последний аванпост российской цивилизации в Европе не рухнет!"

