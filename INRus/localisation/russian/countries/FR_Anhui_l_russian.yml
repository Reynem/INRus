 #Ideas
 japanese_monopolies: "Японские монополии"
 japanese_monopolies_desc: "Поскольку японцы владеют Циндао и мы, как известно, полагаемся на японцев для обеспечения стабильности, японцы постоянно эксплуатируют наш рынок в Шаньдуне."
 part_of_beiyang_council: "Часть Совета Бейянга"
 part_of_beiyang_council_desc: "После Северного экспедиции Фенгтиан стал единственной частью Совета Бейянга, однако помощь со стороны Анхуи и Шаньси позволила им также стать официальными членами совета, хотя этот совет гораздо более децентрализован, чем раньше."

 #Events
 anh.1.d: "Анхуай когда-то был абсолютной властью в правительстве Бейянга, контролируя почти все аспекты управления Китаем после революции. При поддержке Японии и крупной армии в его руках Анхуи казалось почти непреодолимым. Однако начало 4-го мая 1919 года, когда японцы получили порт Циндао, ослабило их и их японскую поддержку. К 1920 году началась война Анхуай-Зхили, в которой анхуи были побеждены. Несмотря на то, что Анхуй был официально прекращен в 1920 году, два губернатора Шаньдуна и Шанхая, которые входили в состав клуба &quot; Анфу &quot; , остались. Чжэн Шици и Лу Йонсиан пытались остаться нейтральными в китайской политике, но к 1924 году баланс Шанхая Анхуи был нарушен &quot; , и все это произошло в результате того, что было совершено &quot; Анти-Зилийской коалицией &quot; , двумя губернаторами Шанга, и Фентиантианом удалось слом &quot; . Однако единство коалиции быстро сошло на Куом &quot; , однако &quot; , &quot; держан &quot; , &quot; в прошлом &quot; побед &quot; тяжском &quot; тяжском &quot; ганском &quot; , &quot; , &quot; , &quot; , в прошлом &quot; тяже &quot; , в прошлом &quot; тяже &quot; , в прошлом &quot; ханьском &quot; ханьском &quot; ханском &quot; , в прошлом &quot; ханьском &quot; ханьском &quot; ханьском &quot; ханьском &quot; ханьском &quot; ганском &quot; ганском &quot; ганском &quot"


 ### Characters ###
 ANH_chen_tiaoyuan: "Чэнь Тяюань"
 ANH_chen_tiaoyuan_leader_desc: "В 1916 году, в возрасте 30 лет, Чэнь Тяйюань был начальником военной полиции в провинции Цзянсу. Эта скромная карьера была прервана из-за короткого правления Юань Шикай, чье военное приключение оставило вакуум власти для юных офицеров, таких, как он сам. В эти первые годы Чэнь служил вместе с Чжаном Зонгчаном, дружба которого закончилась, когда стало очевидно, что его дружба прекратилась. Верность Чэнь была столь же разорвана из Фенгтийской клики к Сун Чуаньфану, за что Сун проявил свою благодарность, отдав Чэнь командование армией Анхуай. В последние годы провинции Анхуай было отказано в инвестициях германского ауфсичарата. По сравнению с их соотечественниками в Цзянсу и Фуджиане провинция Анхуи была расстроена и беспомощна в промышленной инновации. Чэнь завоевал уважение и престиж за свое враждебное отношение к прогерманистской политике Сун Чэна. В последние годы взаимосвязанные интересы Германии и Сунь разрушили доверие Чена к Лиге и Сунь."
 ANH_chen_tiaoyuan_commander_desc: "В 1916 году Чэнь Тяйюань был начальником военной полиции в провинции Цзянсу. Эта скромная карьера была прервана недолговечным правлением Юана Шикая, чье военное приключение оставило вакуум сил для более молодых офицеров, таких, как он сам. В эти первые годы Чэнь служил вместе с Чжаном Цзончяном, дружба которого закончилась, когда стало очевидно, что его недисциплинация закончилась. Чен отошел от Фенгтианской клики к Сунь Чуаньфану, за что Сун проявил свою благодарность, дав командование армии Анхуи."

 ANH_zhang_zhongli: "Чжан Чжунли"
 ANH_zhang_zhongli_commander_desc: "ГЕНЕРАЛЬНОЕ ОПИСАНИЕ: §L\n1883\nXiaoxian, Jiangsu, Qing Empire\n §Y Военная карьера: §L\nZhang Zhongli вошел в армию в эпоху Бейянгской Республики, однажды в качестве командира бригады и командира дивизии в армии Сунь Чуанфанга. После Северного экспедиции он начал работать в финансовой сфере и стал государственным должностным лицом в провинциальном департаменте гражданских дел Цзянсу, а затем стал капитаном полиции по налогам на соль в ЛЕП, где он действовал с восхищением. Потому что кто-то критиковал, что Чжан Чжонли считал, что он стоит на посту КМТ, Сунь Чуаньфан организовал его из Цзянсу в Анхуи, что позволило ему познакомиться с Чэнь Тиауаном и стать партнером компании Anqing Clique."

 ANH_peng_xuefeng: "Пэн Сюэфэн"
 ANH_peng_xuefeng_commander_desc: "Общее описание §YBorn: §L\n 9 сентября 1907/nQili, Pingren, Qing Empire"

 ANH_liu_heding: "Лю Хединг"
 ANH_liu_heding_commander_desc: "В 1925 году он стал офицером в оставшейся армии Анхуайской клики, которая была командована Ма Сянгбином и участвовала в войне против Чжана Цзонгчана и в подавлении Даохуи в Луане."

 ANH_shi_zhongcheng: "Ши Чжончэн"
 ANH_shi_zhongcheng_commander_desc: "25 января 1897 года он поступил в Баодингскую военную академию, Анхуи, Цин Империя, §Y Военная карьера: §L\Shi Zhongcheng потерял своего отца, когда он был маленьким. Он пошёл и нашел убежище у своего дяди Ши Конгбина и поступил в Баодингскую военную академию в 1921 году. Он закончил школу через два года и был стажером в армии Ши Конгбина. Во время второй войны в Чхили-Фентиане Ши Конгбин, который был во главе с Чжаном Чжончхангом, был захвачен и казнен Сунь Чуаньчаном. Шихончэн продолжал служить в армии Чжана Цзонгчана и отвечал за охранников в районе Янтай. Во время своей службы в армии Шаньдунга он был свидетелем бесстыдства и греха Цунчань. Он был полностью разочарован Чжаном Цзончангом, он встретил Фен Анбанга, который с тех же взглядов и с тех же пор держался вдалинии от членов Цунчского клика."

 ANH_li_shengchun: "Ли Шенчхун"
 ANH_li_shengchun_commander_desc: "§L\nli Shenchun является заместителем командующего провинции Фуцзянь, который служит под командованием Чжоу Йинрена, военного губернатора Фуцзяна. Под руководством Чжоу он сражался с 17-й армией НРА, возглавляемой Хе Иньцинем во время северной экспедиции. ~ Однако отношения Ли с его начальством являются плохими. Он часто нарушал приказы и неоднократно отказывался очистить силы Куоминтанга от Повстанческой зоны Цзянфу."

