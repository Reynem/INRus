### National Spirits ###
SPF_condor_legion_idea: "Легион кондора"
SPF_condor_legion_idea_desc: "Сухопутный компонент Легиона Кондора под руководством Вильгельма Риттера фон Томы имеет важное значение для совершенствования наших сил в этом конфликте."

SPF_disloyal_militias_idea: "Дефилиарные ополчения"
SPF_disloyal_militias_idea_desc: "Многие правые военизированные группы, от консерваторов-националистов до радикальных валькистов, сделали выбор присоединиться к нашему делу, но есть и многие из них, которые не проявляют лояльности к нашему правлению."
SPF_organize_nationalist_forces_idea: "Дефилиарные ополчения"
SPF_organize_nationalist_forces_idea_desc: "Многие правые военизированные группы, от консерваторов-националистов до радикальных валькистов, сделали выбор присоединиться к нашему делу, но есть и многие из них, которые не проявляют лояльности к нашему правлению."
SPF_remove_outside_influences_army_idea: "Верность армии"
SPF_coalition_opposing_views_idea: "Коалиция противоположных мнений"
SPF_coalition_opposing_views_idea_desc: "Коалиция между всеми националистическими группами, которые составляют нашу сторону, охватывает многие противоположные точки зрения, некоторые из них более консервативны, в то время как другие более радикальны. Если это не уладится, это может привести к нашему упадку."
