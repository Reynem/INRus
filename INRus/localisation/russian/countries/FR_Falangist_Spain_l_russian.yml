### Events ###
carspain.0.t: "Националистическая коалиция"
carspain.0.d: "После вступления в брак короля Фердинанда II из Арагона и королевы Изабеллы I из Кастилля, Испания стала единым государством. После этого союза на новую Испанскую империю пришел Золотой век. Империя была найдена и расширена в Новый мир, приведя цивилизацию и христианство в Америку. С тех пор Испания стала еще слабее. С момента создания Республики в 1931 году Испания достигла самой слабой точки. Империя была разделена как на внешней, так и на внутренней основе, когда социалисты и республиканцы пытались уничтожить испанское государство. У нас не было иного выбора, кроме как отреагировать, когда на Испанию обрушилась гражданская война. Мы должны были спасти Испанию от внешних и внутренних врагов. Мы - националисты, фалангисты, национальные синдикалисты и многие другие - объединились в испанском патриотизме, сформировали националистический фронт и коалицию для борьбы с республиканцами и социалистами. Мы запустим реконку против них, введя Испанию в новый Золотой век!"
carspain.0.a: "Готовьте новую разведку!"

carspain.1.t: "Галицианское разочарование"
carspain.1.d: "В то время как Галиция больше склонна бороться за консервативные силы, чем за социалистов или республиканцев, некоторые из них все еще считают себя «нацией» своих собственных, хотя нам и нужно бороться с Галицианским национализмом и другими формами антисанитарского национализма, мы надеемся, что они понимают, кто является настоящим врагом."
carspain.1.a: "Лояльность Испании будет прибыльна."

carspain.2.t: "Поддержка со стороны валькистов и националистов"
carspain.2.d: "С новостями о нашем деле, достигшем мира, началась поддержка из таких стран, как Валькистская Германия, Голландское государство, Италия, Норвегия и Швеция, националисты и валькисты волонтеры для нашей борьбы, особенно от наших валькистов-друзей в Берлине."
carspain.2.a: "Спасибо, союзники Испании!"

carspain.3.t: "Мадрид под нашим контролем"
carspain.3.d: "Мадрид, столица Испании, попал под наш контроль."
carspain.3.a: "Да здравствует народ!"

carspain.4.t: "Валенсия под нашим контролем"
carspain.4.d: "Нам удалось подтолкнуть к юго-востоку и захватить Валенсия. Это прекрасный город на побережье, который находится под социалистической оккупацией с начала войны. С возвращением этого города социалисты скоро будут побеждены."
carspain.4.a: "Да здравствует народ!"

carspain.5.t: "Барселона под нашим контролем"
carspain.5.d: "Это один из самых важных городов в Испании и центр социалистической революции, где этот город находится под нашим контролем, он ознаменует собой конец социалистов."
carspain.5.a: "Да здравствует народ!"

carspain.6.t: "Падение республиканцев!"
carspain.6.d: "Республиканцы и социалисты, наконец, потерпели поражение, нам удалось победить силы, которые пытались создать антиавторитарные режимы в Испании, но пока это победа Испании, наша страна все еще разделена, теперь между альфонсистами и националистами, скоро вспыхнет конфликт."
carspain.6.a: "По крайней мере, есть два менее фейерверка."

carspain.7.t: "Конфликт с альфонсистами!"
carspain.7.d: "Соглашение о ненападении между нами и альфонсистами было нарушено. Новости о столкновениях на границе вновь привели к конфликту. Пришло время показать этим притворцам, кто является истинным королем Испании."
carspain.7.a: "Война продолжается"

carspain.8.t: "Севилье под нашим контролем"
carspain.8.d: "Нам удалось оттолкнуться на юг и захватить город Севилья, который работал в качестве базы для сил Альфонса в Испании, где они часто получали британскую поддержку через Гибралтар."
carspain.8.a: "Да здравствует народ!"

carspain.9.t: "Гражданская война окончена!"
carspain.9.d: "Гражданская война в Испании окончена, после вечных сражений, националисты вышли на вершину, хотя наш успех велик, после этой победы будут трудности."
carspain.9.a: "Испания снова Юнайтед!"

carspain.10.t: "Лондонский фондовый рынок поражает Галицию"
carspain.10.d: "Недавняя катастрофа на фондовом рынке в Лондоне пришла в Испанию, страна уже является плохой формой, когда речь идет о нашей экономике."
carspain.10.a: "Мы молимся, чтобы это не сокрушило Царство."

carspain.11.t: "Антиправительственные протесты"
carspain.11.d: "Многие начали винить националистическое правительство в их страданиях после Лондонского Крэша."
carspain.11.a: "Когда наступит мир, будет лучше."

carspain.12.t: "Лондонский фондовый рынок поражает Испанию"
carspain.12.d: "Недавняя катастрофа на фондовом рынке в Лондоне пришла в Испанию, страна уже является плохой формой, когда речь идет о нашей экономике."
carspain.12.a: "Мы молимся, чтобы это не разорвало Испанию"

carspain.13.t: "Национальный синдикализм Онесимо Редондо"
carspain.13.d: "Онесимо Редондо был комбатантом во время гражданской войны, который был лидером радикальной группировки боевиков, во время войны он был ранен, что дало ему время для изучения политики. Сегодня, спустя много времени после того, как оружие замолчало, он появился на публике с объявлением, он заявил, что будет участвовать в политике постгражданской войны в Испании с идеями национального синдикализма, многие националисты боятся, что он может быть левой угрозой."
carspain.13.a: "Сделай этого синдикалиста "Уходи""
carspain.13.b: "Он не может быть таким опасным..."

carspain.14.t: "Синдикалистский мученик"
carspain.14.d: "Синдикалист Онесимо Редондо был зарезан прошлой ночью в министридском холле. Незадолго до того, как его сделали мучеником. Многие валькисты и национальные синдикалисты считают, что он был убит социалистами и республиканцами. По крайней мере, хорошо, что они подозревают их, а не нас. Но весь этот инцидент придал слишком большое значение этому человеку и его взглядам."
carspain.14.a: "Мы надеемся, что он умрёт лучше, чем жив."

# Focus Tree Events #

carspain.100.t: "Кампания по набору кадров в Испании-националистке"
carspain.100.d: "Пропаганда вербовки на территориях, находящихся под нашим контролем, кажется, работает, и новые мужчины предлагают свои услуги силам испанской нации."
carspain.100.a: "Спасибо за ваше участие."

carspain.101.t: "Армия вновь сохранила верность"
carspain.101.d: "Полковники в армии, которые были даже немного антиреспубликанцами, были либо арестованы, либо убиты, либо депортированы."
carspain.101.a: "Да здравствует Испания!"

carspain.102.t: "Проблемы в коалиции"
carspain.102.d: "Коалиция, объединяющая многие националистические группы, партии и ополчения, начинает проявлять трещины, усиливающееся недовольство между радикалами и консервантами, валькистами и традиционистами, синдикалистами и монархистами."
carspain.102.a: "Нам нужно разобраться с этим!"

carspain.103.t: "Суксессор мученика"
carspain.103.d: "В то время как онесимо Редондо, который можно назвать отцом испанского национального синдикализма, мертв, его идеи не мертвы. Рамиро Ледесма Рамос стал лидером Национального синдикалиста, вместе с другими радикалами, они объединились в Кастелланас де Актуасьон Испаника. Эта фракция, вдохновляющая и поддерживающая Валькистскую Германию, может представлять угрозу для Коалиции и нашей собственной власти, но они также могут быть потенциальным союзником в борьбе за власть, которая кажется неизбежной."
carspain.103.a: "Лучше они, чем традиционалисты!"
carspain.103.b: "Мы сильны сами по себе!"

carspain.104.t: "Пакт &lt; &lt; Примо де Ривера -- Ледесма Рамос &gt; &gt;"
carspain.104.d: "Хосе Антонио Примо де Ривера и Рамиро Ледесма Рамос собрались сегодня и согласились сотрудничать, хотя у фалангистов и национальных синдикалистов есть некоторые разногласия, мы смогли создать своего рода политический союз, поскольку угроза консервативных традиционистов важнее, чем угроза самых откровенных радикалов, этот союз имеет смысл, и именно мы введем Испанию в будущее, а не разрушим его в прошлое, наши враги могут утверждать, что мы всего лишь немецкая марионетка, но вместе мы покажем им, что мы испанская нация."
carspain.104.a: "Ради испанской судьбы и нашего испанского будущего!"

carspain.105.t: "Очистить традиционалистов"
carspain.105.d: "Укрепив нашу силу и влияние, настало время убрать Традиционалистов с важных позиций, они представляют угрозу, которую мы не можем ослабить, мы должны удержать их и удалить их. Сделав это, ничто не может угрожать внутренней власти испанской нации, однако это не будет хорошо воспринято самыми консервативными слоями нашего населения, надеюсь, они поймут важность стабильного правления."
carspain.105.a: "Будущее принадлежит Фаланксу!"

carspain.106.t: "Стабильность Возвращение"
carspain.106.d: "После сокращения оппозиции у стабильности появилась возможность вернуться в Испанию. Хосе Антонио Примо де Ривера говорил за своих последователей, обещая, что испанцы больше не будут жить в страхе коррумпированного правления республиканцев, социалистов или монархистов. Дорога к испанской Судьбе лежит у наших ног."
carspain.106.a: "Да здравствует народ!"

carspain.107.t: "Хирурги не справляются"
carspain.107.d: "Пытаясь противостоять влиянию и силе традиционалистов и монархистов среди наших рядов, мы столкнулись с сильной оппозицией. Традиционисты начали выступать против наших попыток очистить их. Мы не получили практически никакой поддержки от радикальных национальных синдикалистов, некоторые из которых составляют третью сторону в этом конфликте. Это может быть концом нашего видения Испании."
carspain.107.a: "Это чёрт!"

carspain.108.t: "Традиционистский кубок"
carspain.108.d: "Появились новости о том, что традиционные лидеры вели банду солдат в города и города Испании, даже здесь, в столице Мадрида, вспыхнули столкновения между войсками, лояльными к нам, и войсками, лояльными к народным ополчениям, в этом беспорядке и путанице было передано письмо нашему лидеру Хосе Антонио Примо де Ривера от Рамиро Ледесмы Рамос, лидера национальных синдикалистов, он предлагает свою поддержку против традиционной угрозы, и это может быть хорошей идеей, даже если его группа получит больше власти и влияния."
carspain.108.a: "Мы можем победить в одиночку!"
carspain.108.b: "Мы должны принять их помощь!"

carspain.109.t: "Победа испанской националистической партии"
carspain.109.d: "Традиционалисты, монархисты и консерваторы-националисты, все они объединились в Испанской националистической партии, чтобы противостоять фаланксу, сегодня они штурмовали правительственные здания Испании, разрушив правление Хосе Антонио Примо де Ривера, и из этого восстанет сильная, гордая и независимая Испания, и Испания, истинная традиция, Бог, и монархия."
carspain.109.a: "Да здравствует народ! Да здравствует Испания!"

carspain.110.t: "Спасённый народ?!"
carspain.110.d: "Традиционистская угроза, наконец, побеждена, что вернет в Испанию определенную стабильность, но даже с этим популярность радикалов, национальных синдикалистов и валькистов возросла, они рассматриваются как спаситель народа и нации Испании, что может сделать их более сильными, чем мы."
carspain.110.a: "Мы посмотрим, куда это ведет..."

carspain.111.t: "Игра для Испании"
carspain.111.d: "Многие интриги приобрели место в стране, так как группировки формируются в поддержку либо Примо де Ривера, либо Ледесмы Рамос."
carspain.111.a: "Может быть, небольшие концессии, но не это"
carspain.111.b: "Чтобы сохранить народ в безопасности, мы должны согласиться"

carspain.112.t: "Рамиро Ледесма Рамос принимает командование"
carspain.112.d: "После того как Хосе Антонио Примо де Ривера согласился с предложением радикалов, возглавляемым Рамиро Ледесмой Рамос, произошла смена власти. &lt; &lt; Национальный синдикалист &gt; &gt; , &lt; &lt; Радикализм &gt; &gt; и &lt; &lt; Валькисты &gt; &gt; теперь занимают более прочное положение в стране. &lt; &lt; Аристократический &gt; &gt; и &lt; &lt; Консервативный фаланкс &gt; &gt; будет править Испанией."
carspain.112.a: "Да здравствует народ!"

carspain.113.t: "Король Испании Хавьер де Борбон-Парма"
carspain.113.d: "Сегодня король Испании был коронован Хавьером де Борбон-Пармой, одним из Карлистских претендентов на испанский трон."
carspain.113.a: "Да здравствует король!"

carspain.114.t: "Король Испании Хайме де Борбон"
carspain.114.d: "Сегодня король Испании был коронован Хайме де Борбоном, одним из альфонсистов, истреблявших престол Испании."
carspain.114.a: "Да здравствует король!"

carspain.150.t: "Испанское государство хочет присоединиться к Штальпакту"
carspain.150.d: "Наши националистические друзья в испанском государстве обратились к нам сегодня, чтобы обратиться с просьбой о въезде в Штальпакт, с ними на нашей стороне, наш союз защитит дополнительного союзника, который поможет нам окружить и победить Францию."
carspain.150.a: "Их приветствуют!"
carspain.150.b: "Простите, но нет"

carspain.151.t: "Немцы принимают нас в Штальпакт."
carspain.151.d: "Немецкий рейх ответил на нашу просьбу присоединиться к Штальпакту. К счастью для нас, они приняли наше усердие присоединиться к своему альянсу. С Германией как нашим союзником наша позиция в мире будет укреплена. Вместе мы построим новый мировой порядок, остановим социалистическое зло Советского Союза и станем противостоящей силой против империализма Франции и Соединенного Королевства."
carspain.151.a: "Испания и Германия будут сражаться вместе!"

carspain.152.t: "Немцы отвергают наше проникновение в Штальпакт"
carspain.152.d: "Немецкий рейх ответил на нашу просьбу присоединиться к Штальпакту, к сожалению, они отклонили нашу петицию о вступлении в свой союз. Хотя этот отказ вызывает разочарование, тот факт, что они все еще считают нас законным правительством Испании, может стать проблеском надежды. Наше правительство будет воспринимать это как потерю для Германии."
carspain.152.a: "Это будет их убыток."

carspain.153.t: "Наши контакты в Берлине"
carspain.153.d: "Связь между растущей властью Испании и Германии ясна, ранее объединённая под руководством Чарльза Великого, эти два могущественных образования были вместе на пороге 1500-х годов, постепенно обе державы стали свидетелями упадка, но сегодня нам удалось создать сильные правительства, и мы могли бы даже отомстить за боль, которую нам причинили французы и британцы."
carspain.153.a: "Весна для Испании и Германии!"

carspain.154.t: "Пропаганда испанизма"
carspain.154.d: "Встреча с представителями латиноамериканских стран, политических организаций и правительств позволила нам установить контакт с некоторыми влиятельными людьми в Новом мире. Мы выдвинули идею испаноязычных стран и районов, которые должны объединиться в новую испанскую нацию. Это может быть встречено оппозицией как со стороны региональных националистов в Южной Америке, так и со стороны тех, кто боится восстановления кастовой системы, существовавшей до достижения независимости. Есть также Соединенные Штаты, которые нам нужно помнить. Им не понравятся наши амбиции в Америке."
carspain.154.a: "Вива-эль-Испанисмо!"

carspain.160.t: "Растет международное признание"
carspain.160.d: "В мире растет признание нашего режима, и хотя он все еще довольно низок, приятно знать, что есть те, кто знает, что мы истинное правительство Испании."
carspain.160.a: "Да здравствует Испания!"

carspain.161.d: "В мире растет признание нашего режима, и все больше людей, стран и организаций признают нашу легитимность, и это несколько облегчает ситуацию, и все же многие не признают подлинное правительство Испании."

carspain.162.d: "В мире растет признание нашего режима, хотя большинство иностранных государств признают нас, некоторые из них все еще нас не признают, по крайней мере, мы можем сказать, что большинство стран действительно видят в нас подлинное правительство Испании."

carspain.163.d: "Сейчас только те, кто решительно поддерживает другие группировки и решительно выступает против нас, не признают нас."

carspain.165.t: "Признание международной торговли"
carspain.165.d: "Есть страны, которые не признают нас в качестве подлинного и законного правительства Испании, но с ростом торговой торговли и экспорта мы видим, что страны, которые ранее держались подальше от нас, обращаются к нам как к новому торговому партнеру, что, по сути, укрепляет международное признание нас."
carspain.165.a: "С торговлей приходит рост"

### Focuses ###
SPF_policy_for_nation: "Политика в отношении нации"
SPF_policy_for_nation_desc: "Истинные патриоты Испании должны быть сплочены в это время, защищая нашу политику против наших политических врагов, а также на поле битвы."
SPF_organize_nationalist_forces: "Организация националистических сил"
SPF_organize_nationalist_forces_desc: "Наши силы должны быть хорошо организованы для того, чтобы у них был шанс противостоять нашим врагам."
SPF_fortress_burgos: "Крепость Бургос"
SPF_fortress_burgos_desc: "Мы должны укрепить наши позиции в Кастилии и Леоне, чтобы у нас был шанс в этой гражданской войне, если только мы не окажемся застрявшими на холмах Галисии и Астурии."
SPF_front_national_unity: "Фронт национального единства"
SPF_front_national_unity_desc: ""
SPF_power_primo_de_rivera: "Расширение прав и возможностей &lt; &lt; Примо де Ривера &gt; &gt;"
SPF_power_primo_de_rivera_desc: ""
SPF_power_movement: "Расширить возможности Движения"
SPF_power_movement_desc: ""
SPF_legitimacy_strong: "Законность сильных"
SPF_legitimacy_strong_desc: ""
SPF_valkist_friends: "Наши валькисты-друзья"
SPF_valkist_friends_desc: ""
SPF_fighters_new_age: "Борцы за новую эру"
SPF_fighters_new_age_desc: ""
SPF_defence_of_leon: "Защита Леона"
SPF_defence_of_leon_desc: "Леон служит нашим домом против наших врагов, мы должны сделать все возможное, чтобы защитить его, если мы хотим победить их."
SPF_recruit_new_levies: "Набор новых Левитов"
SPF_recruit_new_levies_desc: "Важную роль в этом деле будет играть активизация усилий по набору персонала."
SPF_civil_war_offensive_planning: "Планирование наступательных действий в ходе гражданской войны"
SPF_civil_war_offensive_planning_desc: "Если мы не хотим, чтобы наши наступательные действия истощали наши силы, нам нужны новые планы."
SPF_provide_proper_army_transport: "Обеспечение надлежащего военного транспорта"
SPF_provide_proper_army_transport_desc: "Поскольку страна разделена, трудно обеспечить доставку товаров и оружия на фронт, и это необходимо сделать, если мы хотим, чтобы армия была на продвинутом этапе."
SPF_military_armament: "Военное оружие"
SPF_military_armament_desc: "Мы должны вооружить наших военных до зубов, если хотим выжить против наших врагов."
SPF_defend_castille: "Защищать Кастиль"
SPF_defend_castille_desc: ""
SPF_reintegrate_madrid: "Оживить Мадрид"
SPF_reintegrate_madrid_desc: ""
SPF_stomp_eastern_revolutionaries: "Потоп восточных революционеров"
SPF_stomp_eastern_revolutionaries_desc: ""
SPF_integrated_south: "Мир на юге"
SPF_integrated_south_desc: ""
SPF_spain_united_free: "Испания, &lt; &lt; Юнайтед &gt; &gt; и &lt; &lt; Свободные &gt; &gt;"
SPF_spain_united_free_desc: "Мы победили! Мы уничтожили республиканцев, скоиалистов и монархистов! Начнется новая эра испанского национализма, когда мы начнем процесс восстановления после гражданской войны."

SPF_reyes_navy: "Национальный ВМС Испании"
SPF_reyes_navy_desc: "Если мы хотим соревноваться с другими западными державами на мировой арене, одним из первых шагов, которые мы должны предпринять, является восстановление его прежней мощи."
SPF_expand_dockyards: "Расширить докьярды"
SPF_expand_dockyards_desc: "Расширение наших верфей крайне важно для строительства и причала большего числа кораблей."
SPF_assure_naval_merchant_ties: "Морские торговцы"
SPF_assure_naval_merchant_ties_desc: "Наши морские торговцы являются жизненно важным активом нашего флота."
SPF_modernize_destroyers: "Модернизация разрушителей"
SPF_modernize_destroyers_desc: "Модернизация наших эсминцев уже давно устарела и является важным аспектом совершенствования нашего флота."
SPF_rule_seas: "Повелевать морями"
SPF_rule_seas_desc: "У нашего флота должны быть средства и способность управлять морями с абсолютным превосходством."
SPF_hit_and_run: "Удар и беги"
SPF_hit_and_run_desc: "Наш флот не может править морями с превосходством, он должен полагаться на ударные нападения вместо того, чтобы нарушать вражеские линии."
SPF_new_spanish_flagships: "Новые испанские флаги"
SPF_new_spanish_flagships_desc: "Новые испанские флаги станут украшением нашего нового флота."
SPF_fund_submarine_research: "Фонд по исследованию подводных лодок"
SPF_fund_submarine_research_desc: "Подводные лодки будут одним из ключевых элементов нашего военно-морского фонда."
SPF_light_ship_models: "Модели легких судов"
SPF_light_ship_models_desc: "Для того чтобы усовершенствовать наш флот, мы должны сосредоточиться на совершенствовании наших легких судов."
SPF_heavier_cruiser_models: "Тяжелые крестовые модели"
SPF_heavier_cruiser_models_desc: "Для того чтобы улучшить наш флот, мы должны сосредоточиться на совершенствовании наших тяжелых крейсеров."
SPF_invest_coast_guard: "Инвестировать в береговую охрану"
SPF_invest_coast_guard_desc: "Наша береговая охрана уже располагает инфраструктурой, необходимой для нашего великого флота."
SPF_spanish_naval_doctrines: "Испанские военно-морские доктрины"
SPF_spanish_naval_doctrines_desc: "Мы должны сосредоточиться на разработке доктрины, которой должны следовать наши военно-морские силы, с тем чтобы отделиться от остального мира и гарантировать победу."

SPF_reyes_air_force: "Испанские национальные военно-воздушные силы"
SPF_reyes_air_force_desc: "Испания должна иметь новые военно-воздушные силы, чтобы соответствовать своему новому правительству, мы должны немедленно начать инвестировать в воздушное превосходство над нашими соседями."
SPF_expand_galicia_air_fields: "Расширение военно-воздушных полей Галисии"
SPF_expand_galicia_air_fields_desc: "Воздушные поля служат фундаментом для любых военно-воздушных сил."
SPF_interservice_cooperation: "Интерсервисное сотрудничество"
SPF_interservice_cooperation_desc: "Сотрудничество между ветвями нашей армии имеет важнейшее значение для создания действующих военно-воздушных сил."
SPF_invest_naval_fighters: "Инвестирование в военно-морских истребителей"
SPF_invest_naval_fighters_desc: "Военно-морские бойцы могут быть разницей между победой и поражением в открытом море."
SPF_invest_close_land_fighters: "Инвестируйте в скрытых борцов с землей"
SPF_invest_close_land_fighters_desc: "Близкие сухопутные борцы могут быть разницей между победой и поражением в крупных сражениях с землей."
SPF_modernize_old_planes: "Модернизация старых самолётов"
SPF_modernize_old_planes_desc: "Не все в наших новых военно-воздушных силах должно быть построено с нуля."
SPF_aggresive_air_force: "Агрессивные военно-воздушные силы"
SPF_aggresive_air_force_desc: "Наши военно-воздушные силы должны быть агрессивными в бою, особенно когда речь идет о разрушении инфраструктуры противника."
SPF_strategic_bomber_efforts: "Стратегические бомбардировщики"
SPF_strategic_bomber_efforts_desc: "Наши военно-воздушные силы должны содержать стратегических бомбардировщиков, предназначенных для уничтожения инфраструктуры противника и посевов хаоса среди своих рядов."
SPF_defensive_air_force: "Оборонительные военно-воздушные силы"
SPF_defensive_air_force_desc: "Наши военно-воздушные силы должны защищаться в бою, особенно когда речь идет о защите наших войск на местах."
SPF_interception_tactic_efforts: "Технологические усилия перехвата"
SPF_interception_tactic_efforts_desc: "Наши военно-воздушные силы должны уделять приоритетное внимание тактике перехвата, разработанной для уничтожения вражеских самолетов, прежде чем они смогут уничтожить наши наземные силы."
SPF_spanish_airial_doctrines: "Испанские авиационные доктрины"
SPF_spanish_airial_doctrines_desc: "Мы должны сосредоточиться на разработке доктрины, которой должны следовать наши военно-воздушные силы, с тем чтобы отделить себя от остального мира и гарантировать победу."

SPF_reyes_army: "Испанская национальная армия"
SPF_reyes_army_desc: "Наша новая страна нуждается в армии, чтобы сравняться с ней и сохранить ее в безопасности."
SPF_remove_outside_influences_army: "Удалить внешнее влияние из армии"
SPF_remove_outside_influences_army_desc: "Для того чтобы наша армия могла функционировать хорошо, она должна быть в первую очередь лояльной Испании, и мы должны работать над тем, чтобы исключить иностранное влияние из ее рядов, чтобы гарантировать ее верность."
SPF_basic_equipment_research: "Исследования в области основного оборудования"
SPF_basic_equipment_research_desc: "Несмотря на гражданскую войну, мы не можем допустить, чтобы наши военные технологии отставали от технологий наших соперников."
SPF_mobilize_spanish_army: "Мобилизовать испанскую армию"
SPF_mobilize_spanish_army_desc: "Испанская армия по-прежнему очень плохо организована, и важно, чтобы мы вели ее на полную мощность и набирали как можно больше людей, чтобы заполнить ее ряды."
SPF_invest_armour_research: "Инвестирование в исследования армора"
SPF_invest_armour_research_desc: "Хотя когда-то кавалерия могла быть ключом к победе в битвах, теперь победа заключается в танках и бронированных автомобилях."
SPF_let_fire_rain: "Пусть дождь будет огнём."
SPF_let_fire_rain_desc: "Артиллерия всегда была важным аспектом любой западной армии."
SPF_counter_air: "Противодействие воздуху"
SPF_counter_air_desc: "В других странах есть военно-воздушные силы, которые намного превосходят наши собственные."
SPF_planning_and_numbers: "Планирование и число"
SPF_planning_and_numbers_desc: "Для победы в битвах и войнах необходимо планирование, и выделение части нашего общего персонала на разработку планов боевых действий поможет нам в будущем."
SPF_new_general_staff: "Новый генеральный штаб"
SPF_new_general_staff_desc: "Старый генеральный штаб испанской армии был слабым, нескоординированным и неэффективным."
SPF_special_unit_efforts: "Специальные подразделения"
SPF_special_unit_efforts_desc: "Концентрация на специальных подразделениях — это хороший способ диверсифицировать нашу армию и обеспечить, чтобы мы могли справиться с любой ситуацией, которая нам не под силу."
SPF_support_brigades: "Вспомогательные бригады"
SPF_support_brigades_desc: "Бригады поддержки так же важны для нашей армии, как и боевые люди."
SPF_armada_of_tanks: "Арма танка"
SPF_armada_of_tanks_desc: "С учетом того, что сейчас западные армии имеют броню будущего, крайне важно, чтобы мы создали нашу собственную армаду танков, с тем чтобы мы не отставали от наших соседей."
SPF_mobile_artillary_efforts: "Мобильная артиллерия"
SPF_mobile_artillary_efforts_desc: "Артиллерия всегда была эффективной в борьбе с противостоящими армиями, но сделать ее мобильной является важным следующим шагом в достижении и превосхождении превосходства других европейских армий."
SPF_rifle_for_soldiers: "Винтовки для солдат"
SPF_rifle_for_soldiers_desc: "Мы должны производить винтовки массово, если хотим создать новую и развитую испанскую армию."
SPF_spanish_army_doctrines: "Доктрины испанской армии"
SPF_spanish_army_doctrines_desc: "Мы должны сосредоточиться на разработке доктрины, которой должна следовать наша армия, с тем чтобы отделить себя от остального мира и гарантировать победу."

SPF_economic_recovery: "Экономическое восстановление"
SPF_economic_recovery_desc: "Испанская экономика была разрушена, и в том же году нас поразила катастрофа на фондовом рынке и гражданская война."
SPF_sieze_unloyal_industries_assets: "Активы компании &quot; Seze Unloyal Industries &quot;"
SPF_sieze_unloyal_industries_assets_desc: "Как бы это ни было невероятно, многие отрасли в Испании по-прежнему преданы нашим врагам."
SPF_rebuilding_road_network: "Восстановление дорожной сети"
SPF_rebuilding_road_network_desc: "Возрождение этой инфраструктуры является первым шагом в восстановлении экономики нашей страны."
SPF_gradually_ending_austerity: "Постепенное прекращение жесткости"
SPF_gradually_ending_austerity_desc: "Мы не можем больше позволить себе сидеть и смотреть, как умирает наша экономика."
SPF_reopen_banks: "Вскрыть банки"
SPF_reopen_banks_desc: "Настало время вновь открыть многие банки, которые были закрыты в начале гражданской войны, сейчас, как никогда ранее."
SPF_higher_rations: "Увеличение объема продовольственных пайков"
SPF_higher_rations_desc: "Хотя продовольственные пайки были жизненно важной мерой, принятой в начале гражданской войны, мы должны увеличить объем выделяемых каждому человеку средств, с тем чтобы учесть, что наша экономика пострадала."
SPF_end_austerity_messures: "Меры экономии"
SPF_end_austerity_messures_desc: "Мы должны вернуться к вопросам нашей экономики, чтобы спасти ее."
SPF_invest_mineral_industry: "Инвестиции в горнодобывающую промышленность"
SPF_invest_mineral_industry_desc: "Добыча полезных ископаемых уже давно является достоянием Испании."
SPF_reopen_mineral_export: "Возобновить экспорт полезных ископаемых"
SPF_reopen_mineral_export_desc: "Экспорт наших полезных ископаемых в остальной мир гарантирует нам большую прибыль, и мы должны сделать это сейчас, пока не поздно спасти нашу экономику."

SPF_national_syndicalist_economy: "Национальная синдикалистская экономика"
SPF_national_syndicalist_economy_desc: "Теперь, когда истинное и простое руководство Испании, пришло время, чтобы испанская экономика начала отражать это, мы должны перейти к экономике со стороны национальных синдикалистов."
SPF_spanish_corporatism: "Испанский корпоратизм"
SPF_spanish_corporatism_desc: "Корпоратизм уже давно является одним из основных элементов национальной синдикалистской экономики."
SPF_work_for_people: "Служить людям"
SPF_work_for_people_desc: "Важно, чтобы ни один испанец не остался без работы."
SPF_agricultural_credits: "Сельскохозяйственные кредиты"
SPF_agricultural_credits_desc: "Мы должны субсидировать сельское хозяйство для обеспечения того, чтобы наши хлебные корзины никогда не были пустыми и чтобы этот сектор экономики не рухнул."
SPF_welfare_for_spain: "Обеспечение жизни и быта в Испании"
SPF_welfare_for_spain_desc: "Мы должны обеспечить благополучие каждого испанца в Испании."
SPF_industry_for_spanish_defence: "Промышленность испанской обороны"
SPF_industry_for_spanish_defence_desc: "В то время как мы выиграли гражданскую войну, важно, чтобы мы всегда были готовы к следующей войне."
SPF_economic_cooperation: "Экономическое сотрудничество"
SPF_economic_cooperation_desc: "Важно, чтобы все сектора нашей экономики работали сообща, чтобы достичь нашей конечной цели перехода."
SPF_new_mineral_industries: "Новые горнодобывающие предприятия"
SPF_new_mineral_industries_desc: "Мы должны сосредоточить внимание на природных ресурсах Испании, в частности на ее минеральных месторождениях."
SPF_connect_country: "Соединить страну"
SPF_connect_country_desc: "Железнодорожные дороги и другие виды национальной инфраструктуры уже давно недостаточно развиты в Испании."
SPF_nationalist_economic_boom: "Националистический экономический бум"
SPF_nationalist_economic_boom_desc: "Мы добились успеха не только в восстановлении нашей экономики, но и в обеспечении ее процветания."

SPF_victory_for_nationalistas: "Победа националистов"
SPF_victory_for_nationalistas_desc: "Мы одержали победу после гражданской войны!"
SPF_ban_socialist_militas: "&lt; &lt; Запрет социалистической милиции &gt; &gt;"
SPF_ban_socialist_militas_desc: "Социалисты причинили больше вреда этой стране, чем пользы."
SPF_ban_communist_party: "Запрет Коммунистической партии"
SPF_ban_communist_party_desc: "Мы должны преодолеть разногласия, возникшие в результате гражданской войны, и создать страну для всех."
SPF_curtail_republicanism: "Кудрявый республиканец"
SPF_curtail_republicanism_desc: "Испанская Республика была ошибочным и неудачным экспериментом."
SPF_ban_republican_parties: "Запрет Республиканских партий"
SPF_ban_republican_parties_desc: "Запрещение прямого участия республиканских партий в политическом процессе в Испании является важным аспектом восстановления его величия."
SPF_curtail_alfonsism: "Кудрявый альфонсизм"
SPF_curtail_alfonsism_desc: "Монархи предали нас в наш самый важный час, и монархисты должны быть подавлены, если этого не сделать, это может разжечь разногласия, за которые мы только что боролись."
SPF_ban_alfonso_from_spain: "Изгнать Альфонсо из Испании"
SPF_ban_alfonso_from_spain_desc: "Единственный способ положить конец монархистскому движению - это эмиграция проблемных элементов испанской монархии."
SPF_internal_struggle: "Внутренняя борьба"
SPF_internal_struggle_desc: "Возможно, мы выиграли гражданскую войну, но мы все еще сталкиваемся с идеологическими разногласиями, и мы должны быть уверены, что имеем дело с нашими врагами, а также с теми, кого мы видим."

SPF_phalanx_secures_power: "Сила Фаланкса безопасна"
SPF_phalanx_secures_power_desc: "Когда наши враги очистились от правительства, мы наконец-то завоевали власть."
SPF_falangist_dominance: "Фалангист Доминанс"
SPF_falangist_dominance_desc: "Наша некогда хрупкая правящая коалиция теперь чиста."
SPF_national_syndicalist_dominance: "Национальное синдикальное доминирование"
SPF_national_syndicalist_dominance_desc: "Наша некогда хрупкая правящая коалиция теперь чиста. Национальные синдикалисты завоевали свое господство над фалангистами в управлении нацией."
SPF_strengthen_our_unions: "Укреплять наши союзы"
SPF_strengthen_our_unions_desc: "Наши союзы всегда были неотъемлемой частью нашего общества."
SPF_pasify_traditionalists: "Удостоверься традиционалистов"
SPF_pasify_traditionalists_desc: "Традиционалисты нашего правительства долгое время были на нашей стороне, и мы должны предоставить им небольшие уступки, чтобы успокоить их на данный момент."
SPF_blue_shirts: "Голубые рубашки"
SPF_blue_shirts_desc: "Мы уже давно полагаемся на неофициальные силы безопасности для достижения наших целей среди населения. &lt; &lt; Полагаясь на них &gt; &gt; в официальной организации &lt; &lt; Голубые рубашки &gt; &gt; , на данный момент это всего лишь формальность."
SPF_forging_new_state: "Формирование нового государства"
SPF_forging_new_state_desc: "Испания находится в неизведанных водах, мы должны выбить и построить наше новое государство и нашу новую судьбу под нашим новым руководством."
SPF_will_to_empire: "Воля к Империи"
SPF_will_to_empire_desc: "Испанская империя была потеряна давным-давно, но воля к империи всегда присутствовала."
SPF_true_spaniard_spirit: "Истинный дух испанцев"
SPF_true_spaniard_spirit_desc: "Испанцы по всей Испании должны объединиться, чтобы создать новый порядок общества."
SPF_authority_and_order: "Полномочия и порядок"
SPF_authority_and_order_desc: "Наше новое испанское государство должно быть построено на двух вещах: авторитете и порядке."
SPF_ledesmas_cult: "Культ Ледесмы"
SPF_ledesmas_cult_desc: "Рамиро Ледесма Рамос был лидером национальных синдикалистов с тех пор, как страна объединилась."
SPF_one_state_one_party: "Одно государство, одна партия!"
SPF_one_state_one_party_desc: "Бесполезно позволять другим партиям в политической области пытаться подорвать наш авторитет."
SPF_primo_de_riveras_dictate: "Диктат Примо де Ривера"
SPF_primo_de_riveras_dictate_desc: "Хосе Антонио Примо де Ривера был лидером фалангистов с тех пор, как страна объединилась."
SPF_destino_espanol: "Дестино Эспоньоль"
SPF_destino_espanol_desc: "Мы построили испанское общество, которое должно быть прочным, и приняли свою судьбу."

SPF_spanish_nationalist_rule: "Испанское националистическое правило"
SPF_spanish_nationalist_rule_desc: "При нашем правлении Испания станет сильной и жесткой как общество, и мы должны обеспечить, чтобы наше правление было непоколебимым и чтобы его основы были прочными."
SPF_spanish_traditionalism: "Испанский традиционализм"
SPF_spanish_traditionalism_desc: "Традиционализм уже давно является ключевой частью испанского общества, и мы должны принять его, если мы хотим создать новое и прочное испанское государство."
SPF_nationalist_kingdom: "Националистическое Королевство"
SPF_nationalist_kingdom_desc: "Мы выиграли гражданскую войну против неудачного притворного монарха, теперь у нас есть шанс наследовать Карлистского короля и править Испанией за кулисами."
SPF_crown_carlist_pretender: "Корона Карлистский презент"
SPF_crown_carlist_pretender_desc: "Корон Карлистского притворца как нового короля Испании - лучший способ контролировать нацию, и обеспечить, чтобы она шла именно туда, куда мы хотим."
SPF_dios_patria_fueros_rey: "Диос, Патриция, Фуэрос, Рей"
SPF_dios_patria_fueros_rey_desc: "Для того чтобы создать триумфальное и успешное испанское государство, необходимо поддерживать четыре столпа нашего общества."
SPF_invite_alfonsite: "Пригласите Альфонсит."
SPF_invite_alfonsite_desc: "Вполне логично, что мы приглашаем на испанский трон альфонсита на переговоры, если не для того, чтобы по-настоящему вести переговоры, чем, по крайней мере, для того, чтобы показать, кем мы являемся."
SPF_settle_line_succession: "Устанавливайте линию правопреемства"
SPF_settle_line_succession_desc: "Мы должны сфабриковать документы, дать гарантии, получить заявления."
SPF_tackle_autonomous_communities: "Борьба с автономными сообществами"
SPF_tackle_autonomous_communities_desc: "Автономные общины, подобные тем, которые проживают в Каталонии, представляют угрозу для испанского государства, и их необходимо полностью искоренить, поскольку мы все являемся одним испанским народом."
SPF_root_out_carlists: "Корни Карлистов"
SPF_root_out_carlists_desc: "Мы должны избавиться от Карлистов, которые все еще заражают наше движение, они ничего не делают, кроме как препятствуют нашим усилиям по установлению контактов с общественностью и бывшими монархистами."
SPF_defender_faith: "Защитник веры"
SPF_defender_faith_desc: "Мы должны объявить себя защитниками веры, чтобы получить благословение Бога и поразить своих врагов Его гневом."
SPF_defender_nation: "Защитник нации"
SPF_defender_nation_desc: "Мы должны быть защитниками испанского государства и испанской нации, прежде всего, мы создали это общество, и мы должны защитить его от всех врагов."
SPF_religion_patria_y_monarquia: "Религия, Патриция и Монаркия"
SPF_religion_patria_y_monarquia_desc: "Мы построили испанское общество, которое должно быть прочным, и приняли свою судьбу."

### Nationalist Ministers ###
SPF_Francisco_Javier_de_Borbon_Parma_hog_pau: "Франсиско Хавьер де Борбон-Парма и Браганза"
SPF_Manuel_Fal_Conde_hog_pau: "Мануэль Фаль Конде"
SPF_Jose_Maria_Albinana_hog_npo: "Хосе Мария Альбиньяна"
SPF_Jose_Antonio_Primo_de_Rivera_hog_npo: "Хосе Антонио Примо де Ривера"

### Others ###
SPF_FUHRERREICH_DESC: "Испания увидела свой золотой век после объединения коронок Кастилля и Арагона, с империей, охватывающей как Новый мир, так и большие части Европы. Однако после этого золотого века Испания стала свидетелем падения благодати. Перед лицом угроз как вероломных республиканцев, так и стариков-монархистов, а также со стороны социалистов гражданская война дала нам шанс спасти Испанию."

SPF_internal_struggle_over_flag: "Внутренняя борьба была решена"
SPF_phalanx_secures_power_flag: "Либо фалангисты, либо национальные синдикалисты имеют власть в Испании."
SPF_spanish_nationalist_rule_flag: "Испанская националистическая партия захватила власть в Испании с консервативной помощью."
SPF_strengthen_german_ties_flag: "Твердые связи с Германией"

SPF_foreign_policy: "Внешняя политика испанской нации"
SPF_foreign_policy_desc: "В то время как социалисты и республиканцы, которые удерживали нашу нацию, побеждали, настало время для того, чтобы §Испанская нация! нашла в мире свое более важное место. Не все страны и правительства признают нас законным правительством Испании, и нам, среди прочего, нужно будет преодолеть это."

SPF_join_stahlpakt: "Присоединяйся к Штальпакту"
SPF_join_stahlpakt_desc: "В ходе гражданской войны Валькист Германия была хорошим международным другом, даже если они поддерживали национальных синдикалистов, их помощь помогла нам выиграть эту войну, нам нужно отплатить за их поддержку и присоединиться к новому мировому порядку."
SPF_strengthen_german_ties: "Укрепить немецкие тисы"
SPF_strengthen_german_ties_desc: "Германия была одним из наших крупнейших сторонников во время гражданской войны, и мы, безусловно, обязаны им укреплять связи между Мадридом и Берлином."
SPF_promote_hispanimo: "Поощрять испанизм за рубежом"
SPF_promote_hispanimo_desc: "Испанизмо, идея о том, что страны с испанским наследием, будучи Испанией и латиноамериканскими странами, связаны культурно, это идея, которую мы должны использовать для продвижения наших амбиций в Новом мире."
SPF_united_iberia: "Объединенная Иберия!"
SPF_united_iberia_desc: ""
SPF_regain_northern_catalonia: "Возвращение к Северной Каталонии"
SPF_regain_northern_catalonia_desc: ""
SPF_revenge_for_spanish_american_war: "Месть за испано-американскую войну"
SPF_revenge_for_spanish_american_war_desc: ""

