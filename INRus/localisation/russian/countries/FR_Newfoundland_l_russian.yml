 #### Events ####
 nfl.1.d: "В 1850-х годах Ньюфаундленду впервые было предоставлено ответственное правительство, и впоследствии он отказался стать участником Канадской Конфедерации. В предстоящие годы Ньюфаундленд оставался в изоляции и удовольствии от себя, осуществляя такие впечатляющие национальные проекты, как строительство Ньюфаундлендской железной дороги, в результате чего страна оказалась в долгах. Великая война началась и закончилась, и когда война закончилась, никто в Ньюфаундленде не стал вздыхать облегчением. Вопрос о военных пенсиях стал для правительства немедленным вызовом для большей задолженности, так как они оказались не только перед Канадой и Великобританией, но и для своего собственного населения. Для того чтобы замедлить их спираль в неприемлемом долге, Ньюфаундленд немедленно демобилизовал и массово сократил военные расходы и расходы на содержание. По мере того, как в 1920-е годы началась война и начался Имперский экономический бум, их экономический спад был постепенно остановлен."
 nfl.2.d: "После катастрофического падения стоимости акций на Лондонском фондовом рынке, экономическая депрессия последовала за всеми нациями в рамках империи и даже распространилась по всему миру. К сожалению, это распространяется на нас. Наша и без того хрупкая экономика получила единственную опору поддержки, выброшенную из-под нее, и мы начали быстро впадать в экономический кризис."
