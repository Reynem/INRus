 NFL_struggling_economy: "Стража экономики"
 NFL_struggling_economy_desc: "Наша экономическая зависимость от экспорта рыбы, бумаги и минерального сырья, а также отсутствие каких-либо промышленных или населенных пунктов привели нас к экономическим трудностям."
 NFL_the_unions: "Профсоюзы"
 NFL_the_unions_desc: "Союз защиты рыбаков доминирует в умеренных левых движениях в Ньюфаундленде, а Центральный союз шахтеров представляет движения радикальных синдикалистов. Поскольку профсоюзы, в состав которых входит почти половина наших рыбаков и шахтеров, профсоюзы стали очень влиятельными в Ньюфаундлендском политическом ландшафте и постоянно боролись за справедливые права и заработную плату для рыбаков и шахтеров по всей нашей стране."
 NFL_fish_price_collapse: "Коллапс цен на рыбу"
 NFL_fish_price_collapse_desc: "Наша попытка ужесточить наши пояса привела к краху рыболовных рынков, и мы будем вынуждены преодолеть любые последствия и взять на себя ответственность за эти действия."
 NFL_fish_price_maintained: "Стабилизация цен на рыбу"
 NFL_fish_price_maintained_desc: "Мы взяли на себя инициативу, вмешавшись в экономику, чтобы стабилизировать цены на рыбный промысел, ценой увеличения наших долгов."

 NFL_debt_crisis1: "Кризис задолженности"
 NFL_debt_crisis1_desc: "Наши решения о строительстве железной дороги от Сент-Джонс до Порт-о-Баски и о крупных военных расходах во время Великой войны привели к тому, что у нас возникли неожиданные долги с мрачными процентными ставками. Нашими основными кредиторами являются Великобритания и Канада, а еще одним незначительным кредитором является Австралия. Для погашения наших долгов потребуется огромное количество времени для страны нашего размера."
