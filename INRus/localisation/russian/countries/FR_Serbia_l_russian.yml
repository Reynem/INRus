 ### EVENTS ###

 serbia.1.t: "Сербское Королевство"
 serbia.1.d: ""
 serbia.1.a: "Нам предначертано величие!"

 serbia.2.t: "Венгрия приглашает нас в их фракцию"
 serbia.2.d: "В удивительном повороте событий мы получили письмо из Будапешта, одетое самому королю. Похоже, что венгры официально приглашают нас в фракцию с ними. Они говорят, что этот союз позволит провести между нами пограничный обмен и заключить договоры, и обе страны будут очень благоприятельны. Мы должны выбирать мудро."
 serbia.2.a: "Мы должны отложить старое соперничество."
 serbia.2.b: "Сербия должна проложить свой собственный путь в истории."

 serbia.3.t: "Венгрия требует Боснии!"
 serbia.3.d: "Венгры, в своем бесконечном преследовании власти, прислали нам список требований, включая все наши боснийские территории! Хотя мы, возможно, сможем отбросить венгерцев сами, это, несомненно, разрушит нацию и, возможно, разоблачит один из наших слабых точек."
 serbia.3.a: "Босния - это маленькая уступка миру..."
 serbia.3.b: "Мы никогда не вернемся в Магьяр!"

 serbia.4.t: "Босния во имя мира?"
 serbia.4.d: "Мы можем предложить им Боснию и Герзоговину в обмен на мир, но это будет рассматриваться как постыдный акт в глазах как нашего правительства, так и нашего народа."
 serbia.4.a: "Мы сдадим Боснию ради блага нации."
 serbia.4.b: "Магияры слабы, нам нужно еще несколько месяцев..."

 serbia.5.t: "Хорватский револьт распространяется на Боснию!"
 serbia.5.d: "Хорваты только недавно поднялись в Венгрии, надеясь заслужить свою зависимость от крови и железа."
 serbia.5.a: "Мы покажем хорватам, что значит восстать против нас."

 serbia.6.t: "Хорватия побеждает в их независимости."
 serbia.6.d: "Мы не можем победить хорватов вместе, не говоря уже о себе. Хорватия будет иметь свое государство до тех пор, пока следующая крупная война не позволит нам вернуть наши законные территории."
 serbia.6.a: "Это день, который будет жить в беспорядке..."

 serbia.7.t: "Венгрия требует Западного Баната!"
 serbia.7.d: "Сегодня венгерское правительство потребовало, чтобы мы вернули ему район Западного Баната или столкнулись с определенными угощениями. Этот регион чрезвычайно оправдывателен и ценен с стратегической точки зрения. Отказ от земли был бы глупым шагом, который сильно расстроил бы народ, но мы также должны учесть, что Венгрия-мау пытается взять его силой, если мы откажемся."
 serbia.7.a: "Вест-Банат не имеет большого значения, они могут забрать его."
 serbia.7.d: "Они должны вырвать его из наших холодных, мертвых рук."

 serbia_secondgreatwar.1.d: "С недавним присоединением Болгарии к Германии у нас появляется возможность для противодействия. Сербы находятся на обочине реваншизма после того, как болгары победили их не так давно и аннексировали Македонию; предложение им альянса откроет новый фронт и позволит нам нанести удар по Балканам и за их пределами; однако не вызывает сомнений тот факт, что сербы гораздо слабее болгарских и могут быть обременительным союзником."

 serbia_secondgreatwar.3.d: "Сербы увидели мудрость в нашем предложении и приняли его, и теперь у нас есть новый фронт, чтобы нанести удар по болгарам и за их пределами!"

 ### IDEAS ###
 ser_second_gw: "Сербский реванхизм"

 ser_danube_research: "Член научно-исследовательской группы в Дунае"
 ser_danube_research_desc: "Мы участвуем в дунайском исследовательском Блоке, давая нам и всем другим участвующим в нем нациям импульс нашим исследовательским способностям, и нам было бы мудро поддерживать хорошие отношения со всеми другими членами Блока."
 ###
 ser_integrated_officers: "Объединенный корпус сотрудников"
 ser_integrated_officers_desc: "Попытки сближения наших наций с военной точки зрения привели к формированию транснационального офицерского корпуса, в состав которого вошли генералы из всех членов группировки, хотя культурный и языковой разрыв и является трудным, со временем он станет одним из величайших наших достижений."
 ###
 ser_interlaced_economy: "Связанная экономика"
 ser_interlaced_economy_desc: "Мы приложили активные усилия к тому, чтобы связать нашу экономику с другими членами наших группировок, что позволило нам лучше выделять ресурсы на строительство и военное производство."
 ###
 ser_mutilated_victory: "Изувеченная победа"
 ser_mutilated_victory_desc: "Несмотря на сербские амбиции, в Венгрии, формально побежденной власти, по-прежнему сохраняются Хорватия и Марибор, несмотря на сербские утверждения."

