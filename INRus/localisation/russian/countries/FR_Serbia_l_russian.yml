 ### Characters ###
 SER_petar_ii: "Петар II"
 SER_petar_ii_leader_desc: "Первый и единственный ребенок Александра II Карадоревича, последнего короля Сербии до"republican" interregnum, Petar II was only two years old when he was taken from the overrun Royal Palace and handed over to the hands of Petar Živković. The young heir to the throne was moved out of the country and ended up in Canada, where the loyalists of the Karađorđević dynasty gave him to Prince Pavle, first cousin of Aleksandar II and a friend of the British royal family. While the White Hand continued the fight in the fallen Kingdom, the Prince was given the task of raising his nephew.\n\nThus, Petar grew up in the relatively liberal environment of Canada. He spent his childhood attending balls, speaking in English, and caring little about the impoverished Balkan state he still claimed the throne of. Though his guardian taught him little in the way of statecraft, the Westminster system he witnessed imprinted deep upon him. Once the time came for the young King to return home, he brought this British thinking with him.\n\nPersonality-wise, Petar is impulsive, naive and a hopeless idealist. His imagination of the political situation rarely coincides with reality. Though his kingdom may pale in comparison to his childhood home, he nevertheless sees the well-being of his subjects as his duty, even at the expense of political capital. This makes the young King easy to play with for those with actual political acumen. Thus, even if Petar may have good ideas in his mind, he has always been a tool for those who hold real power, and likely always will be."

 SER_temporary_national_representation: "Временное национальное представительство"

 SER_milan_grol: "Милан Грол"
 SER_milan_grol_leader_desc: "В 1876 году Милан Грол получил многодисциплинарное образование, в котором изучал философию, литературу, театр и искусство. В Париже он вернулся в Сербию в 1902 году в качестве учителя и писателя, часто оплодотворяя короля Александра I и династию Обреновича в прессе. Примерно в это время он начал работать слева, присоединяясь к Независимой радикальной партии. Его карьера в театре закончилась с началом Велкрига. Он переехал в Женеву во время конфликта и начал переосмысливать свою жизнь в отношении своих политических трудов и активной деятельности. В конце войны Сербия была оккупирована и унижена. Грол вернулся на свою родину, чтобы увидеть опустошенную нацию и вскоре помог найти Сербскую республиканскую партию. Виктори на выборах 1931 года увидел, как Грол занял пост премьер-министра при Драгисе Васиче. В результате этого он был признан естественным преемником Васича и поступил на пост президента. Владел наследием Любомира Стояновича на своих плечах, Милана Гроля и его партии теперь предоставлено право на проведение реформ, о которых они мечтали о земле."

