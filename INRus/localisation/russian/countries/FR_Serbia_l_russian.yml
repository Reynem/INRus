 SER_trifun_kaclerovic: "Трифун Каклерович"
 SER_trifun_kaclerovic_leader_desc: ":: Всё, что я знаю."old man of the socialists", Trifun "Triša" Kaclerović was born in 1879 in the Serbian countryside and became involved in the socialist movement during his student years. In the leadup to the May Coup of 1903, he and his fellow students organised a protest against the increasingly absolute Aleksandar I Obrenović.  He remained in opposition even after the king's assassination and the rise of the Karađorđevićs. Now a leading member of the Social Democratic Party, Kaclerović spent the years leading up to World War I fighting for labour rights, representing the workers in the Skupština and demanding rights for socialists.\n\nThe end of the Weltkrieg saw the socialist movement split. Some, radicalised by the Russian and French Revolutions, turned to violence. Others shunned themselves from the ideology entirely, or clung onto reformism even in the tense atmosphere of postwar Serbia. Kaclerović led his faction of the Social Democrats to the nascent Socialist Workers' Party, and commanded it for the following decades. A grand hegemon of the left, the SRP unites everyone from social democrats to open Syndicalists. Kaclerović stands at the top of it all - all of them can respect this elderly, collected founder of modern Serbian socialism."

 SER_zivko_topalovic: "Живко Топалович"

 SER_dragomir_vasic: "Драгомир Васич"
 SER_dragomir_vasic_leader_desc: "Драгомир"Dragiša" Vasić is the second President of the Serbian Republic, elected with the initiative of the Republican Party in 1931. Born in Morava in 1885, Vasić unfortunately happened to belong to the generation of Serbian men and women sent to die in the trenches of the Balkan Wars and the Weltkrieg. It was there, during the Second Balkan War, that Vasić the revolutionary began to develop - and Vasić the writer. His first real attempt, a short story titled "Pačko", depicts a Serbian soldier in the Battle of Bregalnica. Pitying a felled Bulgarian officer, he tries to give him a proper burial in no man's land, only to be shot by the enemy while erecting a wooden cross. This revolutionary fervour slowly lead to disillusion with the Karađorđević dynasty - especially after the Salonika Trial, as one of the members of the Black Hand executed was his cousin Ljubomir Vulović.\n\nAfter the war, Vasić returned to Serbia along the remaining exiles, pursued a legal career, and founded the newspaper "Progress". However, it was soon shut down and his lawyer's license suspended by the Royal Dictatorship for defending communists. In reaction, he joined the Republican Party and became a member of its main board, a crucial member of the underground organisation - not only thanks to his literary skill, but also his numerous contacts within the Serbian Army. When the Revolution came, Vasić joined it, was elected to the Skupština, and accepted his role as the Ambassador to the Commune of France. While visiting Paris and seeing its achievements did not convert him to a Syndicalist, it nevertheless fascinated him.\n\nThe Konspiracija, suspicious of President Jaša Prodanović's anti-militarist stance, forced him out of power in 1931. Discreetly inviting Vasić to succeed him in the next election, they expected him to be easier to control thanks to his past in the Black Hand. Reluctantly, Vasić agreed, and stands today as a leader torn between his progressive outlook and his debt to the conspirators. To him, the fight against Bulgaria is not just a matter of irredentism - it is a matter of liberty. Time and time again the Serbs have proven to be its beacon in the Balkans while the Bulgarians dabble in dim absolutism. But can Serbia really claim to be a harbinger of liberty in this state?"

 SER_milan_stojadinovic: "Милан Стоядинович"
 SER_milan_stojadinovic_leader_desc: "Названный в честь короля Сербии Милана Милана Стоядиновича, который родился в семье сельского судьи в Шумадии и следовал тем же курсом, что и многие в сербском интеллектуальном классе. &quot; Дружок детства Живко Топалович &quot; , он симпатизировал к социализму в своей молодости, прежде чем добиваться национального освобождения из-за классовой борьбы. &quot; Стоядинович &quot; , вместо этого, оказался в Народной радикальной партии. &quot; Стоядинович &quot; , провёл время перед &quot; Велкриагом &quot; за пределами Сербии, учился в западных университетах и представлял министерство финансов за рубежом, и вернулся на свою родину, чтобы служить в Балканских войнах. &quot; Сербские изгнанные в Корфу &quot; , включая Стоядиновича, нуждались в бюрократах - мужчинах, которые следили бы за тем, чтобы лишь немногие из их худших рядов, голодали и ушли от Сербии. &quot; Стодежник &quot; , который &quot; уш &quot; , собирал их &quot; х &quot; х &quot; , и &quot; х &quot; х &quot; х &quot; х &quot; хал &quot; хал &quot; своих &quot; своих &quot; в качестве своего &quot; х &quot; х &quot; х &quot; в качестве своего &quot; в качестве своего &quot; в качестве своего рода &quot; ха &quot; в качестве своего &quot; в качестве своего &quot; в качестве своего &quot; в качестве своего &quot; бога &quot; бога &quot; в качестве своего &quot; в качестве своего &quot; бога &quot; бога &qu"When it comes to the grand design which God has for the Serbian nation, there can be no compromise or half-measures". Freedom is strong, but collective, absolute power can be stronger."

 SER_milan_gavrilovic: "Милан Гаврилович"
 SER_zivojin_peric: "Живойин Перич"

 SER_petar_zivkovic: "Петар Живкович"
 SER_petar_zivkovic_leader_desc: "Для своих врагов он известен как омерзительный хитроумный монастырь, злобный кукловод, который держал Александра II в заложниках и сфабриковал печально известное королевское диктаторство вслед за Велкриагом. Для своих последователей он был самым верным монархом, который мог быть солдатом, стоявшим у дома Карадордевича, пока он жил. Петар Живкович родился в 1879 году и последовал за престижной карьерой герцогства. Он поднялся, чтобы стать членом королевской гвардии, где он играл ключевую роль во время событий 1903 года, как охранник, который открыл вход в Королевский суд и позволил Черной Руке уничтожить Дом Обреновича. Живкович вскоре растерялся с Чёрной Рукой, однако, полагая, что их лидер Апиас в своей хитрости пытался свергнуть Карадорских деспотиков. Следуя совету наследника, Петара создал Белую Руку - сопера, который занимался защитой правящей династи."

