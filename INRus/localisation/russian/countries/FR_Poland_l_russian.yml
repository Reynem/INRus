 polpeace.14.t: "Судьба Румынии"
 polpeace.14.d: "Польша вступила в войну с нашим восточным соседом Румынией, и большинство из них поняли, что Румыния была не более чем тираническим государством после незаконной аннексии венгерской территории, но теперь эти открытые боевые действия между Польшей и Румынией показывают нам, что ни одна из Великих держав не заинтересована в сохранении румынского суверенитета, что дает нам возможность воссоединить венгерское большинство, застрявшее в Румынии, и создать буфер против любых возможных вторжений Польши в нашу собственную страну."
 polpeace.15.t: "Венгрия вторгается в Трансильванию!"
 polpeace.15.d: "На протяжении десятилетий Венгрия выступает за контроль над венгерским населением, проживающим в северо-западных регионах, но, несмотря на подавляющее большинство международного консенсуса, подтверждающего нашу ответственность за эти регионы, Венгрия решила подорвать всю дипломатическую цивилизованность и пытается оккупировать эти территории. Война против Польши переросла в полную войну за выживание нашей нации и народа. Готовы ли мы пойти на жертвы, необходимые для спасения нашей нации?"
 polpeace.16.t: "Скажи венгерцам, чтобы они помирились?"
 polpeace.16.d: "Очевидно, что мы проиграли войну против Венгрии, они оккупировали спорные регионы и толкают наши силы в нашу нацию, и во имя нашего постоянного суверенитета мы должны подать в суд за мир и сдать предполагаемые регионы Венгрии, прежде чем они потребуют от нас большего."
 polpeace.17.t: "Румыния подает в суд иск о мире"
 polpeace.17.d: "Наши армии одержали победу после победы над румынскими войсками, после того как они сокрушили правительство в [ROM. Capital. GetName] согласились сдать спорные районы нам, чтобы положить конец конфликту."
