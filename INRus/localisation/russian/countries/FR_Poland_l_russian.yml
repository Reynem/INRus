 POLITICS_FRANCISZEK_RADZIWILL_DESC: "Король Фрэнсисек И Радзивил (полное имя: Януш Фрэнсисек Ксавэри Йозеф Лабре Бронислав Мария Радзивил) (Борн в Берлине 3 сентября 1880 года) является дворянином и королем Королевства Польша. Во время Великой войны он оказался на российской стороне прифронта, в своем семейном поместье в Олайке в Волхии. Летом 1918 года он организовал помощь беженцам из Конгресса Польши. В 1918 году в качестве члена Совета Регенции он вернулся в Польшу и стал членом правительства Яна Канти Стечковского в качестве директора Государственного департамента. Он отвечал за внешнюю политику Польши и за развитие польских дипломатических связей во всем мире. Летом 1918 года он задержал дипломатические переговоры с немецкими и австрийскими императорами, Вильгельм II и Карл I, о будущем Королевства Польша. В ходе встречи он рассматривал различные кандидатуры королевы Королевства Польша. В ходе встречи он также отказался стать кандидатом в польскую роль польского дипломатического члена в Королевстве Литвы."
 POL_Edward_Rydz_Smigly_desc: "Известный как наследник Йозефа Пилсудского, Ридз-Имигля получил славу после своих действий в польско-украинской войне, вдохнув украинские достижения с помощью методов, которые симилиарны по отношению к тем, которые использовались на западном фронте во время Великой войны. Разработав линию обороны, он позволил своему начальнику, Пилсудскому, сосредоточиться на роспуске окруженных украинских войск, защищающих местные районы."

