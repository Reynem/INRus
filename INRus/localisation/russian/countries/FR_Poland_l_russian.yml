 ### Events ###

 poland.1.tt: "Королевство Польша"
 poland.1.d: "В конце XVIII века Польша вновь обрела независимость 11 ноября 1919 года благодаря Версальскому договору. Королевство Польша является полуконституционной монархией, возглавляемой королем Францишеком И Радзивиллом, одним из самых известных польских магнатов. Возрождение промышленности и инфраструктуры страны было резко остановлено польско-украинской войной, которая вспыхнула в [ФИЛЛЕ С КОРРЕКТ-ДАТЕ]. Поляки одержали победу, удерживая на своей исторической территории Ред Рутению. Однако победа не была милосердной по отношению к самой территории, оставив ее полностью разрушенной, и с этим вновь возникли проблемы. Как только Маршал Польши, Йозеф Пилсудски, вышедший из политической жизни, и новое правительство было избрано демократическим путем, очевидно, что польская политика отдаст всю страну тяжелому времени. Многочисленные разногласия между и внутри партий привели к возникновению затворов, которые переполняли Сейм и вновь заставили король много раз распускать ее. Ситуация только в сентябре, когда один из членов польской партии, объединившийся в Нагудестском, был избранный народный народный народный."democracy", and lasted until Piłsudski fell ill in July 1935, and his influence and control over his supporters started fading away. The fights in the Sejm erupted once again, as strong as never before, with several parties splitting due to internal disagreements. The Polish King, for the third time, used his power to disband the government and the Sejm, but this time, only new Sejm elections were organised. Instead of electing a new government, the King appointed a group of advisors, to help him run the country. This state continues to this day, but the change may come any minute now, with Piłsudski's state of health getting only worse, and the Sejm starting to be inneffective as it always was."
 poland.1.aa: "Про Файд, Лег и Редж!"
 poland.2.t: "Законопроект о польской промышленности"
 poland.2.d: "За последние несколько лет польское промышленное законодательство вообще не было обновлено, это оказало негативное воздействие на польский народ и ее экономику. Для исправления ситуации обе стороны в Сейме представили план. МДЗ хочет снизить налоги на потребительские товары и построить дополнительные гражданские фабрики. В то время как ПДБ хочет подчинить военные фабрики. Какой план нам выбрать?"
 poland.2.a: "Выбрать план MOW"
 poland.2.b: "Выбрать план PSCD"
 poland.2.c: "Вето счёт весь в сборе!"
 poland.3.t: "Законопроект о налоговой реформе"
 poland.3.d: "Польская налоговая система устарела и излишне запутана, что приводит к массовому уклонению от уплаты налогов и к тому, что люди облагаются налогом более чем на 100%. Стороны в Сейме представили план по устранению этого беспорядка. У МДЖ есть предложение, в котором основное внимание уделяется несколько прогрессивной системе, и ПСКД хочет ввести единый налог. Какой из них мы должны выбрать?"
 poland.3.a: "Выбрать план MOW"
 poland.3.b: "Выбрать план PSCD"
 poland.3.c: "Вето счёт в целом"
 poland.4.tt: "Законопроект о свободе слова"
 poland.4.dd: "Этот законопроект был предложен МДЖ и ПСКД, и этот план направлен на осуществление универсального закона о свободе слова для всех жителей Королевства Польша, а не только для поляков, что сделало бы Литву очень счастливой, но более широкая свобода слова также снижает статус монархии и монарха. Что нам делать с этим законопроектом?"
 poland.4.aa: "Билл проходит!"
 poland.4.b: "Счёт Вето!"
 poland.5.t: "Привилегии меньшинств"
 poland.5.d: "В ходе сегодняшней дискуссии в Сейме консервативная партия ПСКД подняла эту тему. Вопрос заключается в том, что мы будем делать с этими правами? Население расколото по этому вопросу, так же как и члены парламента. Следует ли нам прислушиваться к ПСКД и понижать их права, или же нам следует прислушиваться к ППС и СЛ и либо оставить их, как есть, или же увеличить их?"
 poland.5.a: "Слушайте социалистов, больше привилегий."
 poland.5.b: "Послушай либералов, у них их достаточно."
 poland.5.c: "Послушай консерваторов, у них слишком много."
 poland.6.t: "Законопроект о реформе армии"
 poland.6.d: "В эти неспокойные времена необходимо усовершенствовать армию. Предлагаются два плана. МД предлагает просто набрать больше людей в обмен на наем меньшего числа исследователей, в то время как ПСКД хочет лишь увеличить число исследователей. Какой план мы должны выбрать?"
 poland.6.aa: "Выбрать план MOW"
 poland.6.b: "Выбрать план PSCD"
 poland.6.c: "Вето счёт в целом"
 poland.7.t: "Законопроект о реформе военно-воздушных сил"
 poland.7.dd: "Польские военно-воздушные силы до сих пор используют старые самолеты «Великой войны», которые не только невероятно устарели, но и невероятно неэффективны."
 poland.7.a: "Выбрать план MOW"
 poland.7.b: "Выбрать план PSCD"
 poland.7.c: "Вето счёт в целом"
 poland.8.t: "Великое сидение Сейма"
 poland.8.dd: "Несмотря на плохое положение в стране, сейм не обсуждал какие-либо проблемы в течение нескольких месяцев, и сейчас мы что-то делаем. Король приказал организовать величественное сидение Сейма. По аналогии с большими сеймскими заседаниями, которые были организованы во времена польско-литовского Содружества, это собрание займет невероятно много времени. Все дополнительные гости, такие, как представители меньшинств, готовятся в местах, расположенных ближе всего к зданию Сейма, и все потребности, такие, как питание, будут предоставляться в здании Сейма. Сессии начнутся в 10 час. 00 мин. и завершатся в 8 час. 00 мин. с перерывами. Каждый представитель, который не появится ни на одном из селений, будет лишен места в парламенте, поскольку это является вопросом первостепенной национальной важности."
 poland.8.aa: "Это лучшее решение."
 poland.9.t: ""
 poland.9.d: ""
 poland.9.a: ""
 poland.9.b: ""
 poland.9.c: ""
 poland.10.t: "Абсолютная монархия!"
 poland.10.d: "Польша превратилась из нестабильной полуконституционной монархии в абсолютную монархию."
 poland.10.a: "Да здравствует монархия!"
 poland.11.t: "Демократические выборы"
 poland.11.d: "Польский народ может вновь проголосовать за новый парламент, но на этот раз он немного отличается, это первый раз, когда более двух партий участвуют в выборах. Выбор между социал-демократической СПРД, социальной либеральной партией SL, рыночной либеральной партией SPR, социально консервативным PSD и авторитарными демократами MOW."
 poland.11.a: "СПРД побеждает!"
 poland.11.b: "SL выигрывает!"
 poland.11.c: "СРП побеждает!"
 poland.11.e: "PSCD выигрывает!"
 poland.11.f: "МНВ побеждает!"
 poland.12.t: "Демократические выборы"
 poland.12.d: "Польский народ может вновь проголосовать за новый парламент, но на этот раз что-то изменилось. Это будет последний раз, когда на выборах будут допущены только две партии, следующие выборы будут в общей сложности пять партий. Две партии являются консервативными ПДСП и авторитарно-демократическим МДМ, кто победит?"
 poland.12.a: "PSCD выигрывает!"
 poland.12.b: "МНВ побеждает!"
 poland.13.t: "Демократические выборы"
 poland.13.d: "Выборы вновь начались в нашей великой стране, как всегда, в выборах участвуют две стабильные и великие партии, консервативная ПДСП и авторитарно-демократическая МДЖД, опросы показывают, что результаты близки, кто победит, это вопрос для всех нас!"
 poland.13.a: "PSCD выигрывает!"
 poland.13.b: "МНВ побеждает!"
 poland.14.t: "Демократические выборы"
 poland.14.d: "Польский народ может вновь проголосовать за новый парламент, выбор между социал-демократической СПРД, социальной либеральной партией SL, рыночной либеральной партией SPR, социально консервативной PSCD и авторитарными демократами MOW."
 poland.14.a: "СПРД побеждает!"
 poland.14.b: "SL выигрывает!"
 poland.14.c: "СРП побеждает!"
 poland.14.e: "PSCD выигрывает!"
 poland.14.f: "МНВ побеждает!"
 poland.15.t: "&quot; Лондонский фондовый рынок &quot;"
 poland.15.d: "Лондонский фондовый рынок обрушился на Польшу, нанес ущерб нашей промышленности и финансам миллионов польских семей, что может стать одной из самых больших экономических проблем, с которыми Польша когда-либо сталкивалась в своей истории."
 poland.15.a: "О... ну, британцы снова ударили"
 poland.16.t: "Польша просит присоединиться к Континентальному соглашению"
 poland.16.d: "Польша попросила присоединиться к Континентальному сосуществованию, можем ли мы позволить им присоединиться?"
 poland.16.a: "Есть!"
 poland.16.b: "Нет!"
 poland.17.t: "Польша просит присоединиться к Штальпакту"
 poland.17.d: "Польша попросила присоединиться к Штальпакту, в обмен на это они дадут нам Судпреуссена и Нидершлезена, если мы позволим им присоединиться?"
 poland.17.a: "Есть!"
 poland.17.b: "Нет!"
 poland.18.t: "Присоединиться к Intermarium"
 poland.18.d: "Польша попросила нас присоединиться к их фракции, "Интермариум", а может, нам присоединиться к ней?"
 poland.18.a: "Есть!"
 poland.18.b: "Нет!"
 poland.19.t: "Польша требует нашей территории"
 poland.19.d: "Польша потребовала нашей территории, поскольку они утверждают, что она по праву является их землей, если мы откажемся от их требований, мы рискуем войной."
 poland.19.a: "Принять"
 poland.19.b: "Отказ"
 poland.20.t: "Присоединение латвийских земель"
 poland.20.d: "Мы успешно аннексировали латвийские земли, теперь они вернулись к своим законным владельцам!"
 poland.20.a: "Ура!"
 poland.21.t: "Латвия отвергла наши требования!"
 poland.21.d: "Следует ли нам объявить войну, чтобы получить нашу территорию?"
 poland.21.a: "Объявить войну!"
 poland.21.b: "Отойди."
 poland.22.t: "Польша требует нашей территории"
 poland.22.d: "Польша требует от нас всей нашей территории, поскольку они утверждают, что она по праву является их землей, если мы откажемся от их требований, мы рискуем войной."
 poland.22.a: "Принять"
 poland.22.b: "Отказ"
 poland.23.t: "Присоединение эстонских земель"
 poland.23.d: "Мы успешно аннексировали эстонские земли, теперь они вернулись к своим законным владельцам!"
 poland.23.a: "Ура!"
 poland.24.t: "Балтийская Советская Республика отвергла наши требования!"
 poland.24.d: "Балтийская Советская Республика отказалась от наших требований в отношении нашей законной земли!"
 poland.24.a: "Объявить войну!"
 poland.24.b: "Отойди."
 poland.25.t: "Включение Литвы"
 poland.25.d: "Королевство Польша потребовало, чтобы мы были аннексированы, они уже начали менять литовские статуи на польские и удалять литовские правительственные чиновники."
 poland.25.a: "Сегодня мы восстаем!"
 poland.25.b: "Мы должны принять нашу судьбу..."
 poland.26.t: "Литовское восстание!"
 poland.26.d: "Литовский народ решил восстать, после всего нашего справедливого и честного правления они решили вдруг бросить нас, не имея на то оснований, они предатели нашего великого народа и должны быть побеждены!"
 poland.26.a: "На войну!"
 poland.27.t: "Литовские ополченцы присоединяются к армии!"
 poland.27.d: "Местные литовские ополчения, которые боролись против Польши, пока мы были марионеткой, решили вступить в армию, вместе мы победим польского монстра!"
 poland.27.a: "Наши люди восстали!"
 poland.28.t: "Пилсудски мёртв."
 poland.28.d: "Сегодня вечером Пилсудский был найден мёртвым в своем кабинете. Вскорее обследование его тела выявило огромное внутреннее кровотечение, которое, вероятно, было вызвано раком печени, который развивался в течение длительного времени. В ответ на смерть одной из самых нелюдийных и любимых польских фигур король объявил о национальной неделе траура. Пилсудски будет похоронен рядом со своей матерью на цементном заводе в Вильнюсе, со всеми честью, которую получит величайший главнокомандующий Польши. Однако с его смертью возникнут и другие проблемы. Его популярность среди населения долгое время держала наше государство вместе. Но теперь, когда он ушел, партии в парламенте, возможно, снова начнут разваливаться, что приведет к катастрофе, которую мы уже пережили два раза за последние 5 лет. Вот почему мы должны организовать большую дискуссию как можно скорее, чтобы решить все проблемы перед всем апаратизмом силы Сейма снова исчезнут под разногласиями сторон и внутренними ссорами."
 poland.28.a: "Это ужасный день для нашей страны..."
 poland.29.t: ""
 poland.29.d: ""
 poland.30.t: "Вопрос о монархии"
 poland.30.d: "Король наш был навязан нам на Версальской конференции, монархия де-факто является искусственным творением в нашей стране, как бы она ни приносила нам пользу, вместе с какими-то незначительными недостатками. Вопрос в том, остаться ли или уйти? И если она должна остаться, то насколько она должна быть могущественной?"
 poland.30.a: "Он нам больше не нужен."
 poland.30.b: "Король должен иметь больше власти"
 poland.30.c: "Мы должны оставить его как есть."
 poland.31.t: "Вопрос о радикалах"
 poland.31.d: "Радикальные партии создают серьезную угрозу стабильности для нашей страны. Четверть нашего населения состоит из меньшинств, которые, согласно программам радикальных партий, должны быть полонизированы или даже изгнаны. Мы не можем допустить этого. Следует также отметить, что партия, противящаяся нам, ПДСП, планирует коалицию с национальными демократами. Запрет НДИ может помочь нам выиграть ближайшие выборы. Что нам с ними делать?"
 poland.31.a: "Мы должны запретить OnR"
 poland.31.b: "Мы должны запретить OnR и ND."
 poland.32.t: "Военные требуют определенной доли власти"
 poland.32.d: "Сегодня вечером маршал Польши Эдвард Ридз-Имигли вошел в кабинет короля с четким, но спорным предложением."General Inspector of the Army" rank. Śmigły stated that it should have the same power it had in the old days of the Polish-Bolshevik war, basically making it the most powerful government rank after the monarch. Although the proposal was presented peacefully, the King's advisors are afraid of an agressive response to a refusal. What should we do?"
 poland.32.a: "Можешь забрать..."
 poland.32.b: "Это моё!"
 poland.33.t: "Военные поддерживают короля."
 poland.33.d: "Теперь, при поддержке военных, власть принадлежит королю, и все предатели, желающие изменить этот статус, столкнутся с гневом верной армии короля!"
 poland.33.a: "А теперь... где моя корона..."
 poland.34.t: "Военный переворот!"
 poland.34.d: "Мой король, военные подразделения, которые предположительно были"training" on the outskirts of Warsaw are now openly hostile and entering the city! The Marshal of Poland, Edward Rydz-Śmigły has stated that "In order to preserve democracy, he is obliged to step in before the King assumes total power". The military has turned against us, and the last loyal units have been arrested or are fightning with the enemy on the streets of Warsaw. However their loyality can't save us. We are heavily outnumbered. This is the end of the monarchy."
 poland.34.a: "Мой король, вы арестованы за преступления против государства."
 poland.35.t: "Что нам теперь делать?"
 poland.35.d: "Государство находится под нашим полным контролем. Быстрый захват жизненно важных правительственных зданий во всех крупных городах был на удивление успешным, но теперь остается один вопрос: должны ли мы вернуть демократию, как обещал маршал в своей речи, или мы должны потребовать силу для себя и пощадить военную хунту?"
 poland.35.a: "Настало время править."
 poland.35.b: "Давайте вернем демократию."
 poland.36.t: "Первые выборы в новой республике"
 poland.36.d: "Мы отменили монархию, и сейчас это первые полностью свободные выборы в истории нашей страны."
 poland.36.a: "Давайте начнем"
 poland.37.t: "Рост волнений среди населения"
 poland.37.d: "Беспорядки, вызванные правительством, которое запретило Партию национальной демократии, усилились больше, чем ожидалось."Unlawful, undemocratic move of the current government". There are only two choices. We step down, or continue our plans. "
 poland.37.a: "Это было неверное решение."
 poland.37.b: "Они нас не остановят."
 poland.38.t: "Беспорядки поднимаются еще больше."
 poland.38.d: "Наша позиция никак не помогла с урегулированием беспорядков. На улицах еще больше людей, и полиция не может больше сдерживать протесты. Предыдущие небольшие стычки превратились в буквальные стены людей, двигающихся в сторону полицейских линий, и протестующие уже начали строить заграждения на улицах. Мы должны уйти или послать военных, иначе ситуация полностью выйдет из-под нашего контроля!"
 poland.38.a: "Мы сдаемся."
 poland.38.b: "Пошлите военных."
 poland.39.t: "Забастовка работников железнодорожного транспорта"
 poland.39.d: "Железнодорожные рабочие, поддерживающие протесты, организовали забастовку! Без действующих железных дорог мы не можем перевезти наши войска из других регионов в Варшаву, чтобы сдержать протесты, а городской гарнизон слишком мал, чтобы делать что-либо самостоятельно! Теперь только чудо может спасти нас."
 poland.39.a: "О-о-о-о"
 poland.40.t: "Люди движутся к столице!"
 poland.40.d: "Протесты бушевали по всей стране в течение нескольких дней, но мы получили сообщения о националистическом марше, направленном прямо в столицу. Ходят слухи о том, что Роман Дмовски ведет его сам. Между тем, все правительственные здания в Варшаве окружены, и нет выхода. Мы окружены и не в состоянии действовать. Военные беспомощны, поэтому мы здесь сами по себе. Начинаем молитвы..."
 poland.40.a: "Что мы теперь будем делать?"
 poland.40.b: "Что мы теперь будем делать?"
 poland.41.t: "Националистическое поглощение"
 poland.41.d: "Националистский марш легко въехал в столицу и после штурма нескольких правительственных зданий вынудил правительство, наконец, уйти в отставку."
 poland.41.a: "Начинается новая эра!"
 poland.42.t: "Формирование военизированных формирований на востоке страны"
 poland.42.d: "Благодаря нашему решению, принятому во время Великого Сейма, который предоставил меньшинствам широкий спектр новых прав, они сформировали военизированные группы в ответ на сложившуюся ситуацию."an unlawful revolt staged by nationalist radicals, who seek to destroy the current balance of rights between the nationalities of Poland". According to our informants, these groups are currently marching towards Warsaw, with a clear intention to disperse the nationalist militia."
 poland.42.a: "Мы спасены?"
 poland.43.t: "ND сдаётся"
 poland.43.d: "Националистический марш, услышав новости о восточных военизированных движениях в направлении Варшавы, распустился и покинул город."
 poland.43.a: "Воистину, второе чудо в Вистуле"
 poland.44.t: "Новая коалиция"
 poland.44.d: "Поскольку Национальная Демократия сорвалась, а Соцконсервативы потеряли важного союзника, мы можем безопасно объединить силы с социал-демократами и легко выиграть выборы!"
 poland.44.a: "Становится только лучше."
 poland.45.t: "Выборы без НД"
 poland.45.d: "Были организованы новые выборы, и теперь вместе с социал-демократами мы спасем эту страну от националистов и их консервативных марионеток!"
 poland.45.a: "Давайте начнем выборы."
 poland.46.t: "Встреча с королем."
 poland.46.d: "Сегодня утром группа советников короля встретилась с самим королем в его дворце в Варшаве."undemocratic and evil" monarch. The Social Liberal SL, which proposes a model of a benevolent dictatorship, which would help the poor and spread the wealth, and the Nationalist ND, which seeks to estabilish a homogenous Polish State, with the minorities sweeped to the margin."
 poland.46.a: "Выбрать предложение центриста"
 poland.46.b: "Выбрать националистическое предложение"
 poland.47.t: "Совещание должностных лиц"
 poland.47.d: "Сегодня вечером небольшая группа высокопоставленных офицеров встретилась с Эдвардом Ридзом-Имиголи в его новом офисе в Варшаве, цель которого состоит в том, чтобы определить путь для новой военной диктатуры. Среди многих предложений есть два, которые выставляются и, возможно, являются единственными жизнеспособными вариантами. Либо мы оставим позади центристскую, благотворительную диктатуру и заручимся поддержкой народа, помогая им, либо мы оставим националистическое правительство, с тем чтобы создать однородное польское государство, с меньшинствами, повергнутыми на дистанцию, с едва ли какими бы то ни было правами."
 poland.47.a: "Выбрать предложение центриста"
 poland.47.b: "Выбрать националистическое предложение"
 poland.48.t: "Польша просит защиты"
 poland.48.d: "Польша попросила у нас защиты, в обмен на это они сдадут Хмельницкий."
 poland.48.a: "Они наши враги."
 poland.48.b: "Мы должны защищать мир в регионе"
 poland.49.t: "Польша хочет включить Литву"
 poladn.49.d: ""
 poland.49.a: "Ни в коем случае, мы остаемся независимыми."
 poland.49.b: "Мы принимаем предложение."
 poland.50.t: "Литва отказалась!"
 poland.50.d: "Эти неблагодарные ублюдки отказались от нашего предложения!"
 poland.50.a: "Нападай!"
 poland.50.b: "Мы уважаем их решение."
 poland.51.t: "Возвращаю Галицию."
 poland.51.d: "Земля Галисии была незаконно захвачена у нас во время польско-советской войны, и с тех пор мы не можем вернуть ее обратно."
 poland.51.a: "Как забрать конфеты у ребенка..."
 poland.52.t: "Польша требует земли!"
 poland.52.d: "Польские чиновники требуют, чтобы мы уступали стратегически важные земли, заявляя, что это ради нашей общей безопасности."
 poland.52.a: "У нас нет шансов, позволь."
 poland.52.b: "Эти требования нелепы, приготовьтесь защищать наши земли!"
 poland.53.t: "Западославия отказалась!"
 poland.53.d: ""
 poland.53.a: "Нападай!"
 poland.53.b: "Ладно... они могут забрать его... пока."
 poland.54.t: "Польша хочет купить у нас оружие."
 poland.54.d: "В связи с нынешней ситуацией в регионе польское министерство обороны осознало, насколько велика потребность в новых вооружениях в польской армии."
 poland.54.a: "Мы должны помочь им с нашим оборудованием."
 poland.54.b: "Мы даже пистолет не можем пощадить."
 poland.55.t: "Польша обращается за помощью в расширении литовских портов"
 poland.55.d: "Из-за отсутствия доступа к морю Польша вынуждена использовать литовские порты в качестве своих портов для всех видов торговли. В связи с настоятельной необходимостью увеличения импорта польское правительство стремится расширить портовую и доковую инфраструктуру в литовском регионе, однако такие инвестиции являются дорогостоящими, и польская сторона обратилась к нам с просьбой о помощи."
 poland.55.a: "Мы должны помочь нашим союзникам."
 poland.55.b: "Мы не можем тратить сломанный франк."
 poland.56.t: "Польша просит оказать помощь в разработке новых бомбардировщиков"
 poland.56.d: "Министерство обороны Польши разработало план по созданию нового современного бомбардировщика, очевидно, что наши бомбардировщики выше других, и именно поэтому польцы обратились к нам и ищут помощи в разработке нового дизайна." 
 poland.56.a: "Наши бомбардировщики явно выше, давайте поделимся знаниями."
 poland.56.b: "Я думаю, нам не стоит"
 poland.57.t: "Польский западный план укрепления"
 poland.57.d: "В течение многих лет Польша испытывала проблемы со своим западным неприятелем, Германия. Теперь польское правительство решило изменить его, приняв план, сфокусированный на сорокалетии западной польской границы. Конечно, такие инвестиции возможны для польского народа, но им, безусловно, потребуются некоторые выдержанные ассистенты, поскольку они никогда раньше не строили такие вещи. Не следует ли нам послать некоторых наших специалистов в Польшу?"
 poland.57.a: "Защита от Германии является наиболее важным вопросом"
 poland.57.b: "Мы не можем пощадить наших специалистов."
 poland.58.t: "Франко-полоназис де хаминс де Фер"
 poland.58.d: "Благодаря тому, что Польша медленно впадает в сферу нашего влияния, французские бизнесмены начали вкладывать средства в некоторые части польской промышленности."Compagnie Franco-Polonaise de Chemins de Fer", or, in english "The French-Polish Rail Association". Its aim is to invest in the Polish railway infrastructure, and possibly developing it further more. Our loyal ally will for sure prosper from this."
 poland.58.a: "Отлично!"
 poland.59.t: "Предложение Польши о покупке Мадагаскара"
 poland.59.d: "После стабилизации морской и колониальной лиги в Польше польское правительство начало искать новые земли, из которых они могли бы собрать ресурсы и процветать. После нескольких дебатов они решили послать нам предложение купить Мадагаскар. Для нас это пустая земля, почти без ресурсов, так что они могут использовать ее больше, чем мы имеем в настоящее время."
 poland.59.a: "Мы принимаем предложение."
 poland.59.b: "Мы не должны продавать части нашей колониальной империи."
 poland.60.t: "Они отказались!"
 poland.60.d: "К сожалению, наше предложение было отклонено."
 poland.60.a: "Проклятье..."
 poland.61.t: "Предложение принято!"
 poland.61.d: "Французы приняли наше предложение!"
 poland.61.a: "Ура!"
 poland.62.t: "Польская морская и колониальная лига"
 poland.62.d: "После развития литовских портов польские власти приняли решение преобразовать Морскую и речную лигу в Морскую и колониальную Лигу, цель которой состоит в том, чтобы заботиться о своих делах и просвещать польскую нацию по морским вопросам, активно поддерживать развитие польского торгового флота и военно-морского флота, а также создание польских заморских территорий."
 poland.62.a: "Удачи."
 poland.62.b: "Давай отправим им маленький подарок, ладно?"
 poland.63.t: "Польские фортификационные фонды"
 poland.63.d: "Польша отправила нам деньги, чтобы помочь нам в сорока-дюймовом и защите нашей восточной границы."
 poland.63.a: "Мы не можем тратить деньги."
 poland.63.b: "Защита - это то, на что у нас всегда есть деньги."
 poland.64.t: "Урегулирование Трансильванского спора"
 poland.64.d: "После Версальской конференции Румыния и Венгрия стали ненавидеть друг друга, в связи с созданием Республики Трансильвания и притязаниями Румынии и Венгрии на регион произошли различные дипломатические споры, которые нанесли большой ущерб их отношениям."
 poland.64.a: "Трансильвания должна быть венгерской и румынской"
 poland.64.b: "Северная Трансильвания должна быть венгерской, Банатской и южной Трансильвании должна быть направлена в Румынию"
 poland.65.t: "Наши соседи согласились нас разлучить!"
 poland.65.d: "На протяжении многих лет мы были в безопасности только из-за разногласий между нашими восточными и западными соседями. Теперь, с Польшей как переговорщиком, они наконец пришли к соглашению о разделе нашей страны. Мы должны сделать что-то, пока не стало слишком поздно!"
 poland.65.a: "Мы никогда не сдадимся!"
 poland.65.b: "В любом случае, это искусственное творение."
 poland.66.t: "Наши соседи согласились нас разлучить!"
 poland.66.d: "На протяжении многих лет мы были в безопасности только из-за разногласий между нашими восточными и западными соседями. Теперь, с Польшей как переговорщиком, они наконец пришли к соглашению о разделе нашей страны. Мы должны сделать что-то, пока не стало слишком поздно!"
 poland.66.a: "Мы никогда не сдадимся!"
 poland.66.b: "В любом случае, это искусственное творение."
 poland.67.t: "Трансильвания отказалась принять сделку!"
 poland.67.d: "Даже с огромными усилиями, которые мы приложили, чтобы положить конец этой нечестивой мерзости, они все еще упрямы и отказываются принять наше соглашение!"
 poland.67.a: "Нападай!"
 poland.68.t: "Трансильвания отказалась принять сделку!"
 poland.68.d: "Даже с огромными усилиями, которые мы приложили, чтобы положить конец этой нечестивой мерзости, они все еще упрямы и отказываются принять наше соглашение!"
 poland.68.a: "Нападай!"
 poland.69.t: "Трансильвания отказалась принять сделку!"
 poland.69.d: "Даже с огромными усилиями, которые мы приложили, чтобы положить конец этой нечестивой мерзости, они все еще упрямы и отказываются принять наше соглашение!"
 poland.69.a: "Нападай!"
 poland.70.t: "Польша запрашивает военных советников"
 poland.70.d: "Похоже, что они воспринимают армию как величайшую армию на земле, и мы не удивлены."
 poland.70.a: "Отправьте советников"
 poland.70.b: "Нет, пока они не присоединятся к нашему альянсу."
 poland.71.t: "Польша просит оказать помощь в строительстве их восточных укреплений"
 poland.71.d: "Осознавая опасность быть граничащим с Красным Гигантом, Польша разработала план укрепления своей восточной границы, у которых достаточно средств, чтобы самостоятельно начать строительство, но их эффективность будет выше, если мы одолжим им некоторых наших специалистов по укреплению."
 poland.71.a: "Отправить специалистов"
 poland.71.b: "Они остаются с нами."
 poland.72.t: "Польша хочет купить у нас танки."
 poland.72.d: "После дебатов в польском министерстве обороны польские власти решили, что их армия срочно нуждается в новых танках."
 poland.72.a: "У них должны быть наши лучшие танки."
 poland.72.b: "Это только для нас."
 poland.73.t: "Польша предлагает сделку в отношении оружия"
 poland.73.d: "Сегодня нас посетил лак-дипломат с интересным предложением. Польское высшее командование решило, что их запасы оружия слишком малы, и обсудило этот вопрос. Похоже, что от различных подрядчиков мы были расценены как наиболее пристрастная нация, которая покупает оружие."
 poland.73.a: "Мы принимаем сделку."
 poland.73.b: "Мы не можем пощадить оружие."
 poland.74.t: "Польша обращается с просьбой об оказании финансовой помощи"
 poland.74.d: "Польские власти наконец решили укрепить свою наиболее уязвимую западную границу. Они знают, что их средств будет недостаточно для создания укреплений, достаточных для того, чтобы остановить немецкий шаг в их родную землю, поэтому они обратились к нам и обратились за финансовой помощью. Эти инвестиции могут быть полезны не только для них, так как готовые крепости, вероятно, остановят немцев в Польше, задолго до того, как они доберутся до нашей земли."
 poland.74.a: "Мы должны помочь им остановить германский экспансионизм."
 poland.74.b: "Они могут сделать это сами."
 poland.75.t: "Русская ССР отказалась от помощи"
 poland.75.d: "К сожалению, русские отказались предоставить нам финансовую помощь, что означает, что крепости должны быть гораздо меньше, и уж точно не так эффективны, как те, что у нас были в планах."
 poland.75.a: "Будем надеяться, что бункеры встанут против немцев."
 poland.76.t: "Польша хочет присоединиться к Международному союзу"
 poland.76.d: "Наши соотечественники польские социалисты решили искать защиты в нашем славном союзе!" "
 poland.76.a: "Ещё одно социалистическое государство в нашем союзе!"
 poland.76.b: "Нет"
 poland.77.t: "Ограбление банка в Лову!"
 poland.77.d: "Ужасные новости! Под прикрытием ночи грабители ворвались в один из субсидируемых польского Национального банка в Лову! Все депозиты вместе с наличными, которые хранились в сейфе банка, пропали, а стоимость ограбленных товаров оценивается примерно в 13 000 000 злоти! Грабители были професиональными, и их действия были прекрасно скоординированы. Полиция подозревает, что, когда один из грабителей ждал закрытия банка, остальные вошли в здание со спины, пробурив дыру в стене прилегающего дома. После закрытия банка грабитель, который ранее скрывался, лишил обеих охранников и получил ключи, а затем использовал их для быстрого побега через переднюю дверь. Мы должны действовать быстро, или грабители убегут со всеми ценными бумагами!"
 poland.77.a: "Найдите их!"
 poland.78.t: "Они исчезли!"
 poland.78.d: "Несмотря на огромные усилия, которые мы приложили, чтобы найти какие-либо подсказки, в буквальном смысле ничего нет. Мы обыскали все здание, и нет даже ни одного признака их работы, кроме дыры в стене и открытых депозитных ящиков."
 poland.78.a: "Найди что-нибудь!"
 poland.79.t: "Нашли тротуары!"
 poland.79.d: "Один из полицейских наткнулся на часть машины, которую грабители, предположительно, использовали, чтобы сбежать. Похоже, водитель сбил крыльцо, и часть бампера машины осталась на нем. Полиция подозревает, что машина была белым Опелем Олимпиа. Теперь нам просто нужно искать похожие машины."
 poland.79.a: "Ищите в городе!"
 poland.79.b: "Ищите в пригороде!"
 poland.80.t: "Ничего!"
 poland.80.d: "Мы просто тратим время на поиски машин, когда грабители сбегают с нашими деньгами!"
 poland.80.a: "Проверьте пригороды!"
 poland.81.t: "Инструменты & оружие найдено!"
 poland.81.d: "Мы нашли еще подсказки! при обыске возможных выездов из города патруль нашёл сумку, содержащую все инструменты, которые можно было бы использовать для взлома банка, точно так же, как это сделали грабители. Возможно, мы очень близки к их укрытию. Мы должны спланировать наши усилия в этом районе."
 poland.81.a: "Мы близко!"
 poland.82.t: "Таинственный информатор"
 poland.82.d: "Сегодня вечером звонил звонок на главный полицейский участок Льюва, охранник в ночную смену открыл дверь, но, к его удивлению, единственное, что было снаружи, это письмо на коврике. Он принес это письмо командиру так быстро, как он мог. Когда он открыл и прочитал его, уже стало ясно, насколько важна эта информация. Мы не знаем источник, но кто-то только что открыл, где прячутся грабители. Нам нужно добраться туда и арестовать их, прежде чем они сбегут!"
 poland.82.a: "Быстрее!"
 poland.83.t: "Прячься"
 poland.83.d: "Мы тайно окружили укрытие грабителей. Скауты утверждают, что они все еще внутри. Все подразделения готовы штурмовать дом. Однако существует опасность того, что грабители попытаются сжечь украденные деньги, и мы не можем рисковать, они также, предположительно, сильно вооружены."
 poland.83.a: "Давайте договоримся."
 poland.83.b: "Нападай на укрытие!"
 poland.84.t: "Ультиматум!"
 poland.84.d: "В ответ на наши попытки вести переговоры грабители выпустили ультиматум, они требуют половину украденных денег для себя, автомобиля и возможности уехать без того, чтобы полиция их не преследовала. Эти требования явно абсурдны, но это единственный способ предотвратить ненужную кровопролитие в укрытии и уничтожить наши деньги."
 poland.84.a: "Мы принимаем это."
 poland.84.b: "Их требования незаметны, приготовьте рейд!"
 poland.85.t: "Они исчезли!"
 poland.85.d: "После того, как мы приняли требования, мы вывели все подразделения из окрестностей дома; грабители вышли из дома, вошли в машину и уехали; как только они покинули поместье, мы послали за ними группу полицейских машин, но, к их удивлению, машины и вместе с ними, грабители исчезли, они снова обманули нас, и с другой стороны, подозреваемые оставили обещанную половину денег в доме."
 poland.85.a: "Опять?"
 poland.86.t: "Рейд-отчет"
 poland.86.d: "Был проведен быстрый полицейский рейд. Первое подразделение проникло в дом спереди через главную дверь, сразу же попав под перекрестный огонь, в ходе которого четыре полицейских были ранены и два убиты. Второе полицейское подразделение проникло в дом через вход в подвал, расположенный за пределами дома, и после того, как они проникли в дом через забаррикадированные двери подвала, удалось убить одного грабителя без каких-либо проступков. Другой подозреваемый сбежал наверх, где он заперся в комнате и забаррикадировал ее."defensive position" using a flipped toppled wardrobe and a table. It took another 2 killed policemen to force him out of there and kill him. This unsucessful action will for sure make it to the tommorow's newspaper headlines."
 poland.86.a: "Какая неудача."
 poland.87.t: "Возможное убежище найдено!"
 poland.87.d: "Полицейские патрули нашли возможное укрытие в окрестности маленькой деревни недалеко от главной дороги, хотя мы не совсем уверены, что сообщения правдивы, мы уже достаточно долго играли в кошку и мышь, пора обыскать их безопасное место и вернуть наши деньги!"
 poland.87.a: "Надрал!"
 poland.88.t: "Не тот дом!"
 poland.88.d: "Мы совершили налет на дом, принадлежащий ни в чем не повинным гражданским лицам!"
 poland.88.a: "Кто за это ответственен?!"
 poland.89.t: "Они сбежали!"
 poland.89.d: "Сегодня полиция нашла возможное убежище для грабителей, оно находится в лесу, недалеко от одного из главных выездов из города. К сожалению, оно пусто. Грабители исчезли, как и наши деньги."
 poland.89.a: "Кто за это ответственен?!"
 poland.90.t: "Предложение польско-литовской федерации"
 poland.90.d: ""
 poland.90.a: "Отличная идея, таким образом мы все можем быть равными"
 poland.90.b: "Я думаю, что мы должны остаться Польшей"
 poland.91.t: "Польша хочет заключить пакт о ненападении"
 poland.91.d: ""
 poland.91.a: "Да, это должно защитить Европу от повторения ошибок прошлого."
 poland.91.b: "Нет, я не думаю, что это имеет значение."
 poland.92.t: "Готовимся к вторжению"
 poland.92.d: "Поскольку вторжение на Украину потребует усилий, мы, возможно, захотим передать часть нашей власти нашим союзникам, чтобы они помогли нам во время битвы."
 poland.92.a: "Мы должны помочь Литве, нашей доверенной теме."
 poland.92.b: "Мы должны помочь Беларуси, поскольку она является стратегически важным союзником, когда речь идет о нападении!"
 poland.92.c: "Мы должны оставить оборудование самим себе."
 poland.93.t: "Польша вооружила нас для будущего вторжения в Украину."
 poland.93.d: ""
 poland.93.a: "Отлично, теперь мы можем продемонстрировать свою силу во время боя!"
 poland.94.t: "Вопрос о правлении"
 poland.94.d: "Мы можем либо принять решение о назначении марионеточного премьер-министра, либо позволить самому Ридзу-Миглу руководить страной."
 poland.94.a: "Мы должны выбрать Мочики, он кажется многообещающим премьер-министром."
 poland.94.b: "Военный опыт Симиглы обеспечит безопасность нации!"
 poland.95.t: "Доля Украины"
 poland.95.d: "Теперь, когда Украина потерпела поражение, мы можем потребовать от нашего союзника Польшу, чтобы предоставить нам наши основные территории."
 poland.96.t: "Беларусь хочет получить часть территории Украины."
 poland.96.d: "Белорусское правительство требует от нас вернуть их так называемые"core territory""
 poland.97.t: "Польша согласилась предоставить нам требуемую территорию."
 poland.97.d: ""
 poland.98.t: "Польша отказалась от наших требований"
 poland.98.d: "Самодовольное правительство нашего"ally" has refused to hand us the core territories we've demanded.\n Is this a sign of treachery?"
 poland.99.t: "Белорусы покинули нашу фракцию."
 poland.99.d: "Белорусское правительство, возмущенное нашим отказом, решило разорвать свои связи с нами."
 poland.100.t: "Поляки требуют Гродно."
 poland.100.d: "Польское правительство требует, чтобы мы вернули его территорию, прикрывая это тем, что у него много польского народа."
 poland.101.t: "Отказывается [от имени Аллаха]"
 poland.101.d: "Наши законные требования к восточным землям были отклонены."
 poland.103.d: "После многих лет борьбы под ярмом чехов, после того как нас украли, когда мы сражались с красными на востоке, территория Западной Галисии наконец вернулась под контроль Варшавы. Тысячи людей празднуют на улицах, когда другая часть Польши возвращается домой."

