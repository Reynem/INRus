 POL_advisors_council_desc: "В 1935 году король был вынужден в третий раз распустить как правительство, так и Сейм, видя, как парламентская система страны не работает и что она делает правительство беспомощным из-за непопулярности и раскола в парламенте, Францишек И Радзивил решил организовать только новые выборы в Сейме, оставив вопрос о правительстве на усмотрение назначенного совета его советников, хотя, предположительно, это лишь временное решение, ничто фактически не может помешать королю захватить всю власть над страной."

