 polpeace.23.t: "Засудите украинцев за мир?"
 polpeace.23.d: "Очевидно, что мы проиграли войну против Украины, они оккупировали спорные регионы и толкают наши силы в нашу нацию, ради нашего постоянного суверенитета мы должны подать в суд за мир и передать оспариваемую территорию Украине, прежде чем они потребуют от нас большего."
