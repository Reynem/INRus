 polpeace.10.d: "Наши армии одержали победу после победы над немецкими войсками, после того как они сокрушили правительство в [ГЕР. Столичие.Гетнам] согласились сдать нам свои районы с польским большинством, чтобы положить конец конфликту. Мы потеряли много хороших людей, захвативших эту землю, и у нас нет причин для того, чтобы растянуть наши силы на новые конфликты. Мы уже достаточно победили."
