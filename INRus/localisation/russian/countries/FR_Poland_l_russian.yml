 polpeace.1.t: "Судьба Словакии"
 polpeace.1.d: "Польша вступила в войну с нашим северным соседом Словакией, и большинству из них стало ясно, что Словакия была не более чем рухнувшим государством после краха Чехословакии, но теперь эти открытые боевые действия между Польшей и Словакией показывают нам, что ни одна из Великих держав не заинтересована в сохранении словацкого суверенитета, что дает нам возможность воссоединить венгерское большинство, застрявшее в южной части Словакии, и создать буфер против любых возможных вторжений Польши в нашу собственную страну."
 polpeace.2.t: "Венгрия вторгается в нашу южную границу!"
 polpeace.2.d: "На протяжении десятилетий Венгрия выступает за контроль над венгерским населением вблизи нашей южной границы, но, несмотря на огромный международный консенсус, подтверждающий нашу ответственность за этот регион, Венгрия решила подорвать всю дипломатическую цивилизованность и пытается оккупировать этот регион. Война против Польши переросла в полную войну за выживание нашей нации и народа. Готовы ли мы пойти на жертвы, необходимые для спасения нашей нации?"
 polpeace.3.t: "Скажи польцам, чтобы они помирились?"
 polpeace.3.d: "Очевидно, что мы проиграли войну против Польши, они оккупировали спорные регионы и толкают наши силы в нашу нацию, и во имя нашего постоянного суверенитета мы должны подать в суд за мир и передать заявленные регионы Польше, прежде чем они потребуют от нас большего."
 polpeace.4.t: "Украина подает в суд иск о мире"
 polpeace.4.d: "Наши армии одержали победу после победы над украинскими войсками, после того как они сокрушили правительство в [UKR. Capital.GetName] согласились сдать спорные районы нам, чтобы положить конец конфликту, мы потеряли много хороших людей, захвативших эту землю, и у нас нет причин для того, чтобы растянуть наши силы на новые конфликты, мы уже достаточно победили."
 polpeace.5.t: "Польша отказывается от мира"
 polpeace.5.d: "Несмотря на наши щедрые уступки, Польша отказалась от нашего предложения мира."
