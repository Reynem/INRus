 ### Focus ###
 POL_great_sitting: "Великое сидение Сейма"
 POL_great_sitting_desc: "Несмотря на плохое положение в стране, Сейм месяцами не обсуждал никаких серьезных проблем. Это вредит нашей стране, и мы должны что-то сделать. Король приказал организовать Великую Сейму. Это собрание займет невероятно много времени и, надеюсь, решит все наши текущие проблемы."
 POL_auth_dem: "Истинная конституционная монархия"
 POL_auth_dem_desc: "Демократия, как и наш монарх, восторжествует навсегда."
 POL_auth_elections: "Выборы"
 POL_auth_elections_desc: "Время организовать новые выборы и дать возможность населению выбрать свое будущее правительство."
 POL_WIP_2: "Чьено-Пиаст"
 POL_WIP_2_desc: "Чьено-Пиаст представляет собой коалицию правых и центристских партий, ПСКД и НДИ, которые стремятся уменьшить права меньшинств и полностью или частично национализировать промышленность страны."
 POL_centrolew: "Центр"
 POL_centrolew_desc: "Центрлью является коалицией левых и центристских партий, ППС и СЛ. Они стремятся обеспечить равенство между различными национальностями нашей страны и помочь беднейшим слоям нашего общества: фермерам и трудящимся."
 POL_pataut_mon: "Король - это все, что нам нужно."
 POL_pataut_mon_desc: "Демократия оказалась не чем иным, как трупом для нашей страны, и это прекратится сейчас, когда король станет нашим единственным истинным лидером."
 POL_imprison_opposition: "Заключите в тюрьму оппозицию"
 POL_imprison_opposition_desc: "Похоже, не все видели свет в конце нашего нового пути."Undemocratic system" of the Kingdom of Poland. Obviously, they are wrong, and we should correct their mistakes."
 POL_arrest_conspirators: "Арестовать заговорщиков"
 POL_arrest_conspirators_desc: "Несмотря на наши усилия по исправлению ошибок оппозиции, все еще есть люди, которые верят не в наши взгляды! Они возглавляют подпольные организации, которые стремятся дестабилизировать наше правление. Мы должны положить конец этим возмутительным действиям."
 POL_disband_sejm: "Разблокировать Sejm"
 POL_disband_sejm_desc: "Когда король берет на себя почти полную власть, нет необходимости в том, чтобы парламент стоял на его пути, это просто препятствие на нашем пути к светлому будущему!"
 POL_new_elections: "Новая Республика"
 POL_new_elections_desc: "По мере роспуска монархии к власти пришло новое демократическое правление."
 POL_the_actual_elections: "Новые выборы"
 POL_the_actual_elections_desc: "Время организовать новые выборы и дать возможность населению выбрать свое будущее правительство."
 POL_centrolew_coalition: "ACYCentrolew §!"
 POL_centrolew_coalition_desc: "Центрлью является коалицией левых и центристских партий, ППС и СЛ. Они стремятся обеспечить равенство между различными национальностями нашей страны и помочь беднейшим слоям нашего общества: фермерам и трудящимся."
 POL_Ch_P: "ACYChjeno-Piast§!"
 POL_Ch_P_desc: "Чьено-Пиаст представляет собой коалицию правых и центристских партий, ПСКД и НДИ, которые стремятся уменьшить права меньшинств и полностью или частично национализировать промышленность страны."
 POL_nationalism: "Новая эра"
 POL_nationalism_desc: "Наступила новая эра для нашей славной страны, когда предательский король и его министерства исчезнут, и мы сможем оживить эту страну, чтобы нам понравилось, и возродить национализм среди польского населения!"
 POL_one_leader: "Один руководитель"
 POL_one_leader_desc: "Нам нужен только один лидер. Сложные структуры демократии всегда были, были и будут неэффективными."
 POL_radicalist_approach: "Радиалистический подход"
 POL_radicalist_approach_desc: "Дмовски хорошо служил нам в реализации польской нации и для поляков, но его потомство лучше отвечало бы нашим потребностям лидера, который действительно для народа."
 POL_one_nationality: ""Единая национальность"!"
 POL_one_nationality_desc: "В этой стране правым является только одно гражданство. Польское государство будет править в одиночку в своей стране, а другие национальности будут подчинены польскому!"
 POL_one_party: "Одна Сторона"
 POL_one_party_desc: "В этой стране есть только одна настоящая партия, и любые взгляды, отличные от наших, будут сведены на нет."
 POL_military_junta: "Военная хунта"
 POL_military_junta_desc: "Незаконные действия короля подтолкнули военных к действиям против него."
 POL_punish_me_daddy: "Наказание полков, преданных королю"
 POL_punish_me_daddy_desc: "Во время нашей борьбы за власть было несколько полков, которые отказались поддержать наше дело, а вместо этого защищали королевский режим."
 POL_stabilise_situation: "Стабилизировать ситуацию"
 POL_stabilise_situation_desc: "Быстрый захват страны военными оставил тысячи людей и бюрократов в замешательстве."
 POL_puppet_prime_minister: "§ § Вопрос о нашем правителе!"
 POL_puppet_prime_minister_desc: "Иметь марионеточного премьер-министра с"legitimate" government will greatly help us in our efforts to stabilize the situation. Either that or we'll a point our Marshal himself as the leader."
 POL_guiding_hand: ""Королевская правая рука"!"
 POL_guiding_hand_desc: "Рука короля будет охранять эту страну и решать ее судьбу. Власть короля будет бесспорна, навсегда."
 POL_restart_the_economy: "Прыжок в экономику"
 POL_restart_the_economy_desc: "В последние десять лет Польша медленно индастриализирует свою экономику, и мы очень сильно отстаем от наших коллег-членов Совета, и небольшие инвестиции в нашу экономику обеспечат, чтобы мы были впереди наших соседей и еще больше укрепили нашу позицию в Восточной Европе."
 POL_protect_the_consumer: "Защита потребителя"
 POL_protect_the_consumer_desc: "Из этих двух предложений мы выбрали защиту потребителя. Экономическая безопасность нашего народа является одним из самых важных вопросов, и мы никогда не будем уделять больше внимания крупным корпорациям, которые могут управляться сами по себе."
 POL_subsudise_local_industries: "Субсудная местная промышленность"
 POL_subsudise_local_industries_desc: "Местные отрасли промышленности важны для развития нашей страны.""
 POL_encourage_domestic_industry: "Поощрение отечественной промышленности"
 POL_encourage_domestic_industry_desc: "Внутренние отрасли были, являются и всегда будут иметь для нас более важное значение, чем крупные международные или иностранные интересы, поскольку именно они гарантируют доступ к большинству товаров, необходимых нашему населению, и поэтому мы должны сосредоточиться на развитии этого сектора нашей экономики."
 POL_warsaw_to_wilno_railway: "Возвращение из Крэша"
 POL_warsaw_to_wilno_railway_desc: "Последствия крушения Лондонского фондового рынка вызывают экономический хаос в Польше, мы должны как можно скорее провести реформы, чтобы исправить эту катастрофу, мы начнем с расширения нашей инфраструктуры и начнем строительство железной дороги от Варшавы до Уилно."
 POL_rail_to_lwow: "Расширить железнодорожный транспорт до Lwow"
 POL_rail_to_lwow_desc: "Поскольку железнодорожная система была расширена до Уилно, теперь мы должны соединить южную часть нашей страны с остальной частью."end station" for the southern branch of our railway network."
 POL_wolnosc_mine: "Фонд Вольноскской шахты"
 POL_wolnosc_mine_desc: "В то время как наша экономика наконец восстанавливается, мы должны принять меры для обеспечения того, чтобы люди были трудоустроены и государство все еще зарабатывает капитал. Мы можем обеспечить это за счет финансирования создания в Познани железных шахт и сталелитейных заводов."
 POL_support_our_military_industrial_complex: "Поддержка военно-промышленного комплекса"
 POL_support_our_military_industrial_complex_desc: "Из этих двух предложений мы решили воспользоваться финансовым положением в Польше и предложить общественные работы бедным слоям населения за довольно достойную заработную плату, которые будут заниматься развитием польских военных промышленных комплексов, что сделает эту ситуацию беспроигрышной как для нашего населения, так и для нашей армии."
 POL_expand_warsaw_arsenal: "Расширить Варшавский Арсенал"
 POL_expand_warsaw_arsenal_desc: "Видя состояние распада Варшавского Арсенала, мы должны разработать план его обновления и расширения."
 POL_krakow_arms_industry: "Оружейная промышленность Кракова"
 POL_krakow_arms_industry_desc: "Промышленные комплексы Кракова хорошо известны своей военной значимостью. Однако количество оружия, которое они производят, недостаточно для удовлетворения потребностей польской армии. Мы должны расширить оружейную промышленность Кракова, чтобы выполнить эти требования."
 POL_end_of_reforms: "Прекращение экономических реформ"
 POL_end_of_reforms_desc: "В конце концов, тысячи, если не миллионы семей снова встали на ноги, уровень безработицы снизился, и нищета тоже. Наши планы сработали идеально! Несмотря на этот успех и его влияние на популярность нашей партии, мы точно не хотим никаких сиквелов."
 POL_warsaw_university: "Варшавский университет"
 POL_warsaw_university_desc: "Теперь, когда мы успешно избавились от экономического краха, мы можем финансировать расширение Варшавского университета и показать миру множество ярких и блестящих умов Польши."
 POL_foreign_policy: "§ Внешняя политика!"
 POL_foreign_policy_desc: "Настало время серьезно отнестись к иностранным делам и официально заявить о своей позиции в отношении ситуации в регионе."
 POL_our_place_in_the_world: "Много вариантов, один ответ"
 POL_our_place_in_the_world_desc: ""
 POL_the_old_alliance: "Старый альянс"
 POL_the_old_alliance_desc: "У нас всегда были хорошие отношения с нашим западным другом Францией, они помогали нам на протяжении всей истории, и теперь мы им поможем!"
 POL_deal_with_the_devil: "Разобраться с Дьяволом"
 POL_deal_with_the_devil_desc: "Отчаянные времена требуют отчаянных мер."
 POL_the_intermarium: "Интермарий"
 POL_the_intermarium_desc: "Польша является, нравится нам это или нет, региональной супердержавой, и у нас есть влияние и отношения, чтобы создать свой собственный европейский союз, и мы надеемся, что у нас есть шанс против наших врагов."
 POL_invite_romania: "Пригласить Румынию"
 POL_invite_romania_desc: "Мы должны расширить наш союз на юг, и Румыния всегда была одним из наших ближайших друзей."
 POL_invite_hungary: "Приглашать Венгрию"
 POL_invite_hungary_desc: "Мы должны расширить наш союз на юг, и Венгрия всегда была одним из наших ближайших друзей."
 POL_invite_centroslavia: "Пригласите Западославию"
 POL_invite_centroslavia_desc: "Мы должны расширить наш союз на юг, а Западославия - хороший стратегический союзник, который мы можем считать ценным."
 POL_invite_belarus: "Приглашать Беларусь"
 POL_invite_belarus_desc: "Мы должны расширить наш союз на восток, Беларусь будет ценным союзником в случае украинского экспансионизма."
 POL_belarus_railway: "Построить Варшавско-Минскую железную дорогу"
 POL_belarus_railway_desc: "Расширение наших железных дорог должно помочь нашему дальнейшему сотрудничеству."
 POL_pol_no_bully_slo: "Безопасность на юге"
 POL_pol_no_bully_slo_desc: "Гарантированный мир на южной границе должен позволить нам сосредоточить внимание на установлении более важных защитных сооружений."
 POL_gain_territory: "Мечты о великой Польше"
 POL_gain_territory_desc: "Мы вернем земли, которые когда-то принадлежали нам!"
 POL_latvian_ultimatum: "Ультиматум Латвии"
 POL_latvian_ultimatum_desc: "Латвия достаточно долго находилась в нашей сфере влияния."neutrality" we agreed for on the Riga peace deal."
 POL_baltic_soviet_republic_ultimatum: "Эстонский ультиматум"
 POL_baltic_soviet_republic_ultimatum_desc: "После включения Латвии в состав Польши настало время еще больше расширить наше влияние на балтийские государства, и последним препятствием остается только Эстония."
 POL_fight_the_beast: "Сражайтесь с Зверем"
 POL_fight_the_beast_desc: "Немцы - наши величайшие враги, и мы раз и навсегда разберемся с этой угрозой."
 POL_threaten_zapadoslavia: "Угроза Западославия"
 POL_threaten_zapadoslavia_desc: "Пришло время угрожать тем, кто слаб на юге, и требовать от них стратегически важных территорий!"
 POL_buy_land_landowners: "Покупайте землю у богатых землевладельцев"
 POL_buy_land_landowners_desc: "Даже после эпохи феодализма землевладельцы по-прежнему владеют большей частью земли, вынуждая мелких фермеров работать там, как это было в эпоху феодализма."
 POL_better_conditions: "Улучшение условий работы"
 POL_better_conditions_desc: "Настало время выполнить нашу социалистическую программу и предоставить трудящимся права, которые им необходимы."
 POL_land_redistribution: "Перераспределение земли"
 POL_land_redistribution_desc: "Теперь, с землей, купленной у крупных землевладельцев, мы должны перераспределить ее мелким фермерам, и сделать равенство обычным делом в сельской местности Польши."
 #natpop
 POL_crush_resistance: "Уничтожить сопротивление"
 POL_crush_resistance_desc: "Мы разрушим любое сопротивление среди населения, они стремятся уничтожить наше польское государство, и мы остановим их, не смотря ни на что!"
 POL_behead_opposition: "Обезглавить оппозицию"
 POL_behead_opposition_desc: "Оппозиция ставит под сомнение легитимность нашего правительства, или, как они его называют, нашего"dictatorship". They will see our way sooner or later, with their leaders gone!"
 POL_nationalist_convention: "Националистическая конференция"
 POL_nationalist_convention_desc: "Мы устранили внутренние угрозы. Теперь различные националистические группы в польском обществе соберутся на одну конференцию и обсудят будущее польского государства и его народа."
