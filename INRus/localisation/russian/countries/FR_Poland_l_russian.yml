 POL_total_equality: "Равенство прежде всего"
 POL_total_equality_desc: "Мы будем обеспечивать равенство для каждого гражданина нашей страны, и это должно быть нашей первоочередной задачей."
 POL_valkist_resistance: "Стойкость к валькизму"
 POL_valkist_resistance_desc: "Радикалисты, отбившиеся от партии &quot; Национальная демократия &quot; , протестуют против"undemocratic move" of the government. "
