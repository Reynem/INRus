 POL_ready_desc: "Мы всегда должны быть готовы к худшему."
 POL_rogue_elements: "Жестокие элементы в армии"
 POL_rogue_elements_desc: "После публичного объявления трех польских заявлений небольшая часть наших военных заявила о своем несогласии с новым правительством, одним из их главных руководителей является генерал Владислав Сикорский, известный тем, что поддерживает демократические структуры по всей стране, и мы должны положить конец его детской игре."

