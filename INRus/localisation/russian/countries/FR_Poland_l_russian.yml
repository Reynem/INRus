 #description
 POL_FUHRERREICH_DESC: "Польша была возрождена благодаря Версалям, после более чем века репрессий, польский народ мог вновь почувствовать свободу, но безопасна ли эта свобода? Враг находится на всех сторонах страны, даже внутри страны. С реванчистскими украинцами на востоке, экспансионистскими немцами на западе и растущими внутренними проблемами, страна либо выполнит роль реваншистских украинцев на западе, либо воспользуется внутренними проблемами."abomination of Versailles", or find its way through the new, yet not unfamiliar, surroundings. Will the Kingdom of Poland thrive and lead its people to glory? Or will it get destroyed once again, with its legacy perished in the ashes of modern warfare?"
