 polpeace.28.t: "Беларусь отказывается от мира"
 polpeace.28.d: "Несмотря на наши щедрые уступки, Беларусь отказалась от нашего предложения о мире, эта война идет сейчас ради самого выживания нашей нации и народа, мы должны пожертвовать всем, что потребуется, чтобы победить Словакию."
 polpeace.29.t: "Скажи румынам, чтобы они помирились?"
 polpeace.29.d: "Очевидно, что мы проиграли войну с Румынией, они оккупировали спорные районы и довели наши силы до нашего государства, и во имя нашего постоянного суверенитета мы должны подать в суд за мир и демилитаризировать нашу границу с Румынией, прежде чем они потребуют от нас большего."
