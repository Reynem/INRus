 POL_border_defence: "Отряды по охране границы"
 POL_border_defence_desc: "Без Украинской полиции у нас не осталось никакого инструмента для сдерживания беспорядков и границы на востоке. Вот почему мы создали отряды пограничной обороны."
 POL_poland_ab_idea: "Неразвитая Рутения"
 POL_poland_ab_idea_desc: "Есть разница между экономическим положением Ред Рутения и остальной частью нашей страны."
