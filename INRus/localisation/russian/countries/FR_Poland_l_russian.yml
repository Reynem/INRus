 POL_MOW_tax: "Налоговый план МДМ"
 POL_MOW_tax_desc: "Прогрессивная и справедливая налоговая система, которая гарантирует, что каждый полюс оплачивает свою долю расходов нашей страны."
 POL_PSCD_tax: "Налоговый план PSCD"
 POL_PSCD_tax_desc: "Единый налог, который легко администировать и быть равным для всех поляков."
 POL_increased_free_speech: "Свобода слова для всей Польши"
 POL_increased_free_speech_desc: ":: предоставить каждому человеку в Польше право на свободу слова, в том числе в Литве."
 POL_less_free_speech: "Свобода слова только для поляков"
 POL_less_free_speech_desc: "Только дайте право на свободу слова полякам."
 POL_equality_for_all: "Равенство для всех"
 POL_equality_for_all_desc: "Все жители Королевства Польша пользуются равными правами."
 POL_equality_for_poles: "Равенство только для поляков"
 POL_equality_for_poles_desc: "Только поляки в королевстве Польши равны, граждане Батлича имеют меньше прав."
 POL_MOW_army: "Армейский план МДМ"
 POL_MOW_army_desc: "Основное внимание в этом плане уделяется увеличению числа призывников в обмен на меньшее число исследователей."
 POL_PSCD_army: "Армейский план PSCD"
 POL_PSCD_army_desc: "В этом плане основное внимание уделяется привлечению большего числа военных исследователей для более оперативного изучения более совершенного оборудования."
 POL_MOW_airforce: "План военно-воздушных сил МДМ"
 POL_MOW_airforce_desc: "Этот план повышает способность наших бойцов бороться."
 POL_PSCD_airforce: "План военно-воздушных сил PSCD"
 POL_PSCD_airforce_desc: "Этот план повышает способность нашего бомбардировщика бороться."
 POL_constitutional_monarchy: "Конституционная монархия"
 POL_constitutional_monarchy_desc: "Королевство Польши постепенно переходит в конституционную монархию."
 POL_absolute_monarchy: "Абсолютная монархия"
 POL_absolute_monarchy_desc: "Королевство Польши постепенно превращается в абсолютную монархию."
 POL_king_men: "Все люди короля"
 POL_king_men_desc: ""
 POL_ojczyzna_guard_idea: "Ойцзынская гвардия"
 POL_ojczyzna_guard_idea_desc: ""

 POL_lithuanian_unrest: "Неспокойные литовские"
 POL_lithuanian_unrest_desc: "После Великой войны все балтии боролись за восстановление своей независимости, а Литва во время польско-литовской войны 1921 года оказалась в польском наступлении. Литва, не имеющая собственного морского доступа, является единственным способом для Польши получить доступ к мировой торговле и безопасно импортировать и экспортировать товары, однако литовцы знают об этом и пытаются воспользоваться этой ситуацией."

 POL_lithuanian_unrest_stagnant: "Неустанный литовский стагнант"
 POL_lithuanian_unrest_stagnant_desc: "Беспорядки в Литве по-прежнему являются проблемой в нашей сфере влияния."

 POL_lithuanian_unrest_less_bad: "Литовская поддержка"
 POL_lithuanian_unrest_less_bad_desc: "Беспорядки в Литве были в основном приняты во внимание, и наше правительство завоевало доверие среди литовского населения!"

 POL_ukrainian_unrest: "Беспорядки в приграничных районах"
 POL_ukrainian_unrest_desc: "Люди на наших русинских территориях наносят ущерб нашей нации."

 POL_ukrainians_happy: "Права меньшинств"
 POL_ukrainians_happy_desc: "Люди наших пограничников пользуются большей свободой, с тех пор как они стали более продуктивными."

 POL_direct_rule: "Прямое правило из Варшавы"
 POL_direct_rule_desc: "Прямое правило от воеводства."
 POL_local_leadership: "Местные руководители"
 POL_local_leadership_desc: "Местное руководство обеспечивает, чтобы польский народ был более сплоченным и более готовым умереть за свою страну."
 POL_protect_consumer: "Защита потребителя"
 POL_protect_consumer_desc: "Потребитель должен быть нашей самой большой заботой в этом кризисе."
