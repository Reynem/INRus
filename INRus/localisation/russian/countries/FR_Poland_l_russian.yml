 POL_cemented_state: "Стабильное правительство"
 POL_cemented_state_desc: "Состояние правительства стабильное, и маловероятно, что оно резко изменится."
 POL_instable_democracy: "Нестабильная демократия"
 POL_instable_democracy_desc: "Польша никогда не была республикой во всем ее существовании. После Версальской конференции мы провели с системой монархии, которая уже была понята населением. Теперь, когда короля нет, и есть больше возможностей выбора, некоторые люди просто запутались и не знакомы с новой ситуацией. Все это вместе, с появлением новых радикальных партий, может поставить под угрозу нашу молодую Польскую Республику."
 POL_just_ok_conditions_idea: "Достойные условия труда"
 POL_just_ok_conditions_idea_desc: "Просто немного лучше условия труда для рабочих."
 POL_better_working_conditions_idea: "Улучшение условий труда"
 POL_better_working_conditions_idea_desc: "Улучшение условий труда работников."
 POL_happy_farmers: "Счастливые фермеры"
 POL_happy_farmers_desc: "Бедным и мелким фермерам наконец-то была предоставлена справедливая доля земли."
 POL_dispersed_farming: "Разрозненное земледелие"
 POL_dispersed_farming_desc: "Но наша экономика будет страдать в течение некоторого времени из-за отсутствия крупных фермерских комплексов."
 POL_powerless_minorities: "Бесправные меньшинства"
 POL_powerless_minorities_desc: "Мы лишили меньшинства всех прав, и теперь, когда они совершенно бессильны, мы можем продолжить наши планы."
 POL_ukrainian_police_revolt: "Украинская полиция восстала!"
 POL_ukrainian_police_revolt_desc: "Украинская полиция на востоке восстала и захватила многочисленные правительственные здания."
