 polpeace.7.d: "Наши армии одержали победу после победы над Белорусскими войсками, после того как они сокрушили правительство в [BLR. Capital.GetName.] согласились сдать спорные районы нам, чтобы положить конец конфликту. Мы потеряли много хороших людей, которые вновь захватили эту землю, и у нас нет причин раздувать наши силы в результате дальнейшего конфликта. Мы уже достаточно выиграли."
