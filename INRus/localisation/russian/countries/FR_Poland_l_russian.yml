 polpeace.20.d: "Очевидно, что мы проиграли войну против Западославии, они оккупировали спорные районы и толкают наши войска в нашу нацию, ради нашего постоянного суверенитета мы должны подать в суд за мир и передать спорную территорию Словакии, прежде чем они потребуют от нас большего."
