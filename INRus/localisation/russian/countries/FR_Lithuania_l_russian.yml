###Ideas
LIT_Polonization: "Полонизация"
LIT_Polonization_desc: "Поскольку литовский язык и литовская культура вновь находятся под угрозой исчезновения, начиная со дней Содружества в XV веке, равноправное партнерство между двумя нациями всегда носило односторонний характер, и Польша стремится включить свое братское государство в качестве еще одной провинции. Интеллигенция и литовские голубые крови приняли польский язык и обычаи для получения особых привилегий, предоставляемых правительством. Фундаментальный язык на протяжении многих лет начал утрачивать свою популярность в крупных городах, заменяемых постоянно растущими полинизированными литовцами и польскими иммигрантами, стремящимися получить новые возможности на земле дождя. Только сельские общины привязались к своему родному языку и традициям, сохраняя то, что осталось в их древней истории. Однако с появлением новых государств, ослабляющих национальную самобытность, Литва, как представляется, в одно время более обречена исчезнуть в тенистые страницы истории."
LIT_Failures_of_Independence_Wars: "Неудачи войны за независимость"
LIT_Failures_of_Independence_Wars_desc: "Литва, как и многие молодые государства в то время, была основана на раздутых трупах умирающих империй, освободившись от российского и немецкого влияния после заключения Брест-Литовского договора и последующего восстановления независимости в 1918 году. Молодое государство было брошено в огонь с вторжением большевиков и бермонтинцев, сражаясь зубами и когтями за каждый дюйм своей новой земли. Однако в конечном итоге все это оказалось тщетным, когда польские силы по приказу Лючана Элиговского вошли в Вильнюсский регион и успешно вернули столицу Вильнюса."
LIT_Polish_Economic_Hegemony: "Польская экономическая гегемония"
LIT_Polish_Economic_Hegemony_desc: "Сельское хозяйство является частью Литвы с момента ее создания в средневековье. Лишь совсем недавно в XX веке оккупирующие страны вложили средства в индустриализацию земли. С оккупацией страны польские компании установили свое доминирующее положение на небольшом рынке страны, которое еще больше подпитывалось новыми иммигрантами, стремящимися начать новую жизнь в привязанной стране. В результате этого произошло невидимый рост занятости и промышленного роста в государстве, поскольку польские компании обеспечивают рабочие места и возможности для простого человека. В связи с ростом иностранных компаний в Литве практически не осталось места для того, чтобы местные предприятия могли заселиться на смоделированном рынке, что позволило иностранным компаниям направить свои доходы обратно в польское правительство." 

