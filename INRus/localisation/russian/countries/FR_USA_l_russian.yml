 usamonroe.7.d: "Третья мексиканская американская война доказала свою катастрофу для власти США. Гугернаут оказался ослабленным годами экономической нестабильности, политической нестабильности, партизанской войны на Филиппинах и пренебрежения вооруженными силами. Мексиканские войска, когда-то подумали о шутке, смогли попасть в Америку на юго-запад в подавляющем количестве. ~ ~ Пока США начали мобилизовываться, а Мексика сейчас сталкивается с тикающими часами, когда американская промышленность вступает в строй, за пределами этой войны многие начали ставить под сомнение доктрину Монро. За пределами США, особенно англичане, увидят возможность расширить свое влияние в Америке при отсутствии защиты США. Время покажет, что станет с сферой влияния США."
 usamonroe.8.d: "В хаосе третьей мексиканско-американской войны США, казалось, де-факто отказались от своей доктрины Монро в свете своей экзистенциальной борьбы против своего южного соседа. Несмотря на американскую победу и восстановление их сил, [США. Гет лидер] объявил, что доктрина Монро будет жестко применена и что внешние державы должны быть осторожны, чтобы вмешаться в Америку."

