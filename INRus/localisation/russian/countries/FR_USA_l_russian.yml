 USA_1936_election_desc: "Шарль Кертис решил не баллотироваться из-за сердечных проблем."
 USA_national_recovery_act: "Закон о национальном восстановлении"
 USA_national_recovery_act_desc: "Последняя попытка Кёртиса, направленная на политическое восстановление Великой депрессии, Закон о национальном восстановлении, может, по крайней мере, остановить волну пока."
 USA_expand_long: "Хьюи Лонг"
 USA_expand_long_desc: "Хьюи Лонг завоевал пост президента Соединенных Штатов Америки."
 USA_bridge_the_class_gap: "Преодоление разрыва в классе"
 USA_bridge_the_class_gap_desc: "Лонг пытается посвятить нынешние политические усилия решению надвигающейся монополии в Соединенных Штатах."
 USA_i_am_for_the_poor_man: ""I Am For the Poor Man""
 USA_i_am_for_the_poor_man_desc: ""
 USA_wheelchair_man: "Квентин Рузвельт"
 USA_wheelchair_man_desc: "Квентин Рузвельт стал президентом Соединенных Штатов Америки."
 USA_bridge_the_race_gap: "Преодоление межрасового разрыва"
 USA_bridge_the_race_gap_desc: "Рузвельт пытался посвятить нынешнюю политическую деятельность решению надвигающейся расовой проблемы в Соединенных Штатах."
 USA_we_are_still_in_the_making: ""We Are Still In the Making""
 USA_we_are_still_in_the_making_desc: ""
 USA_balf_bandon: "Alf Landon"
 USA_balf_bandon_desc: "Альф Лэндон завоевал пост президента Соединенных Штатов Америки."
 USA_bridge_the_corporate_gap: "Устранить корпоративный разрыв"
 USA_bridge_the_corporate_gap_desc: "Alf Landon попытался посвятить нынешний политический курс решению надвигающейся корпоративной проблемы в Соединенных Штатах."
 USA_i_will_not_promise_the_moon: ""I Will Not Promise the Moon""
 USA_i_will_not_promise_the_moon_desc: ""
 USA_cactus_jack: "Нэнс Гарнер"
 USA_cactus_jack_desc: "Джон Нэнс Гарнер завоевал пост президента Соединенных Штатов Америки."
 USA_bridge_the_administrative_gap: "Устранить административный пробел"
 USA_bridge_the_administrative_gap_desc: "Гарнер пытался посвятить нынешнюю политическую деятельность решению надвигающейся административной и бюрократической проблемы в Соединенных Штатах."
