 TEX_frank_maxwell_andrews: "Фрэнк Максвелл Эндрюс"
 TEX_curtis_emerson_lemay: "Кёртис Эмерсон Лемэй"
 TEX_otto_paul_weyland: "Отто Пол Вейланд"
 TEX_dewitt_clinton_ramsey: "ДеВитт Клинтон Рамси"
 TEX_dewitt_clinton_ramsey: "ДеВитт Клинтон Рамси"

 ### Characters ###
 PSA_henry_wallace: "Генри Агард Уоллес"
 # PSA_henry_wallace_leader_desc: "Ужасное начало, как фермер Айовы, не удержал молодого Генри Уоллеса от взгляда на мир и приобретения мироздания. Его состояние было результатом изобретения гибридных кукурузных пород, крупного новаторства, которое позволило Уоллесу путешествовать по миру. Генри посетил Индию и познакомился с Теософией, индуистской школой мысли в России, которая черпает элементы христианского анархизма и социализма. Эти учения в конечном счете вывели его из основного социализма и подтолкнули в Партию Фармера-Лабора, когда он вернулся. Уоллес изображает себя прежде всего прагматического экономиста и сельскохозяйственного эксперта, способного провести аграрную реформу в Америке."

 PSA_philip_la_follette: "Филип Фокс Ла Фолетт"
 # PSA_philip_la_follette_leader_desc: "Профессиональный прогрессивный Висконсин, Филип является самым успешным из политически активных семейства Ла Фоллетт, друг и бывший наставник Флойда Олсона, который был убеждён присоединиться к Партии Фармера-Лабора, чтобы продолжать помогать нуждающемуся государству."

 PSA_glen_taylor: "Глен Хёрст Тейлор"
 # PSA_glen_taylor_leader_desc: "Быть президентом было для Глена Тейлора таким же сюрпризом, как и для избирателей."

 PSA_hiram_johnson: "Хирам Уоррен Джонсон"
 # PSA_hiram_johnson_leader_desc: "Родившийся в середине века в Сакраменто, Калифорния, Хирам Джонсон был из политической семьи. Отец Хирама, Гроув Джонсон, был позорным представителем государства, его мать была активно вовлечена в Дочь Американской революции. Ранняя политическая карьера Хирама была усилена этим наследием, и он стал компетентным прокурором для Сан-Франциско в 1902 году. Губернаторская гонка Хирама в 1910 году финансировалась либеральной республиканской группой «либеральная кампания Линкольн-Роузвельтской лиги Джонсона» в оппозиции корпорации «Южная тихоокеанская железная дорога», которая пыталась лоббировать в рамках республиканцев против Хирама. Губернатор поддержал антииммиграционные законопроекты и проложил путь к более поздней карьере Конгресса. Республиканское учреждение в Калифорнии было раскачено в 1932 году, когда Хирам выступил в поддержку Герберта Гувера. Личное возмущение Хирама в поддержку восточного предприятия означало, что он оставался в стороне от политического хаоса 1936 года."

 PSA_culbert_olson: "Калберт Леви Олсон"
 # PSA_culbert_olson_leader_desc: "Кульберт Олсон столкнулся с клеймом, как баллотироваться в качестве мормонского политика, так и быть атеистом в своей жизни. В Калифорнии в качестве губернатора Кульберту пришлось иметь дело с давними слухами о том, что Мормонс имеет кровную вражду с правительством США. Супергерой Олсона в принятии законодательства в области здравоохранения и предоставлении возможности социалистам, не входящим в СПА, организоваться. К моменту национальной расы Кульберт вышел в качестве атеиста и столкнулся со второй серьёзной битвой. Партия стояла за ним, и в конечном итоге его портфолио позволило ему добраться до Белого дома."

 PSA_clarence_martin: "Кларенс Дэниел Мартин"
 # PSA_clarence_martin_leader_desc: "Кларенс Мартин занял видное место во время последующих выборов в Вашингтонский штат 1932 года, которые освободили многих республиканцев от государственной должности. Кларенс, возможно, пришел во время крупной смены, но его полномочия в Вашингтоне включали в себя поощрение малого бизнеса и его необычайно уважительный разговор. Кларенс в принципе отказался преувеличивать или апеллировать к популистским тенденциям в своей избирательной кампании, и выставил себя в Сенате Вашингтона, спонсируя необходимые проекты гражданских работ. Поскольку Демократическая партия смогла отталкивать инициативу в области гражданских работ от республиканцев по всему Западу, Кларенс получил политические выгоды и получил больше голосов в 36-м году, чем Гарнер в Вашингтоне. Дезертирство некоторых демократов в Макартуре только заставило Кларенса остаться верным, и его назначение на пост исполнительного председателя более вероятно."

 PSA_warren_magnuson: "Уоррен Грант Магнусон"
 # PSA_warren_magnuson_leader_desc: "И хотя известно, что Уоррен Грант Магнусон родился в Мурхеде, Миннесота, точная информация о его рождении является загадкой - он никогда не знал своих биологических родителей, и ему дали свое имя парой скандинавских иммигрантов второго поколения. Магнусон провел два года, обучившись в Северной Дакоте, прежде чем потратил короткое время на работу в Канаде, работая в командах штурмовиков. По приказу одной школьной девушки он переехал в Сиэтл, Вашингтон, где он получил бы свою юридическую степень в 1929 году, и провел бы следующие несколько лет, работая на различных специальных правительственных должностях. Он впервые вошел в мир политики, поддержав заявку Аль-Смита 1928 года на президентство и оставался активным демократом с тех пор, отстаивая оппозицию запрету и в конце концов вход в Вашингтонскую палату представителей в 1933 году в качестве делегата Сиэтла. Магнусон был избран для заполнения вакансии в национальном доме, он занял свое место в январе 1937 года - всего за несколько месяцев до того, как страна была разрушена гражданской войной, Магнусон дефил разногласия и с Вашингтоном, с помощью президента по борьбе против войны, и с династингом ВМСа, он, и с династителем в ответным в династим в своем военном, он был бы в драконстанке, он был бы в агентом, и в драке, и в драке, он был бы в агентом в дина в драке, он, он, он был бы в своем, и в дрался в х, он был бы в х, он был бы в х, он, и в х в х, он, он, он в х в х, он, он был бы в х, и в х, он, он был бы в х, он, он был бы в х, он был бы в х в х, он, он был бы в х, он был бы в х, он был бы в х, он х, он х, он, он х, он х, он х, он х, он х, он, он х, он х, он х, он"

 PSA_frank_merriam: "Фрэнк Финли Мерриам"
 # PSA_frank_merriam_leader_desc: "Сын ветеранов Гражданской войны, Фрэнк Мерриам родился в Айове и планировал легальную карьеру на Среднем Западе. Увидев повышение авторитета Калифорнийской республиканской партии, Фрэнк сместил свою карьеру на запад. Это Мерриам больше, чем кто-либо другой победил СПА в Калифорнии, победив забастовку Лонгшорменов, и даже оттолкнув Аптона Синклера, когда он стал кандидатом на пост губернатора. Несмотря на это, традиционно республиканские газеты сопротивлялись налоговой реформе Мерриама. После вознесения Макартура большинство из этих документов были отданы Хёрсту, чтобы порицать всех республиканцев. Мериам смог использовать публичные протесты против Хёрста и МакАртура, чтобы занять исполнительное место."

 PSA_charles_mcnary: "Чарльз Линза МакНэри"
 # PSA_charles_mcnary_leader_desc: "Чарльз МакНэри стоял за основами Республиканской партии, когда она подвергалась атаке со всех сторон в 1936 году, выступая в качестве руководителя Alf Landon."

 PSA_joseph_bracken_lee: "Джозеф Брекен Ли"
 # PSA_joseph_bracken_lee_leader_desc: "Джозеф Брекен Ли был одним из первых правых утаханских республиканцев, который был избран лишь коротышкой после того, как Мормоны были допущены в Конгресс. В то время как другие противились проекту по религиозным мотивам, Ли вступил в армию и в конечном итоге упал в тяжелые времена после того, как ветераны прекратили получать пенсии. Выступал в губернаторы как республиканец и обещал продвигать Ветеранскую Pay, Ли также познакомился со старыми мальчиками в политической сети. Эта старая сеть парней почти привела к его увольнению после того, как его поймали в нелегальном игорном логове шерифом В. Скусеном. Ли продолжал выступать за финансовый консерватизм и за прием всех религиозных правых групп в республиканские круги, которые в конечном итоге получили его кандидатуру на высшую должность."

 PSA_earl_warren: "Эрл Уоррен"
 #PSA_earl_warren_leader_desc: "Молодой Эрл Уоррен считал, что его карьера была обречена на провал, когда его отец Матиас был занесен в черный список за участие в забастовке, но вместо этого она побудила молодого человека превзойти эту клейменность. &quot; Этот предшественник &quot; побудил Эрла присоединиться к многочисленным братствам и поселиться с людьми, которые позорили его отца, а также служить в армии. &quot; Эти связи &quot; окупились и отправили Эрла на государственную службу и, в конечном итоге, достигли поста губернатора Калифорнии в 1930 году, где он руководил слабеющим прогрессивным движением в сторону политического центра от еще более слабеющей Социалистической партии Западного побережья. &quot; Эрл &quot; стал прогрессивным въехателем в республиканскую партию, подталкиваясь к национальной десегрегации."

 PSA_harry_cain: "Гарри Пуллиам Каин"
 # PSA_harry_cain_leader_desc: "Гарри Пуллиам Каин родился со своим братом-близнецом 10 января 1906 года в Нэшвилле, Теннесси и двоих с сильным Южным наследием, что они убедились, что Каин хорошо вспомнил и гордился даже после того, как семья переехала в Тэкому, Вашингтон, в 1911 году. Несмотря на то, что его мать умерла в 11 лет и развивала пальсию Белла, которая временно ограничивала его способность говорить, он преодолел оба и зачислился в Хиллскую военную академию и позднее в Университет Южного университета в Севани, Теннесси, развивая свою связь с англо-ирландским консервативным ассистентом и государственным детективом, Эдмундом Бурке. Его исследования также привели его к тому, что он взял на работу в Нью-Йорк Таймс, а затем он закончил свою прежнюю дистанцию, завоевав свою прежнюю полицейскую армию, когда он, как и все остальные американские, занялся новостями о переворота Макартура и последовал за восстанием кали Макартура."subversive activities", Cain has shocked everyone by coming out against many of the procedures as violations of civil liberties and due process of law. President Cain is quickly earning a reputation as a man at odds with his past - and a man prepared to make a stand for any opinion, no matter how controversial."

 PSA_richard_nixon: "Ричард Милхус Никсон"
 # PSA_richard_nixon_leader_desc: "После колледжа Никсон попытался вступить в ФБР. Никсон стал адвокатом крупнейших нефтяных компаний Калифорнии. Никсон начал вражду с соотечественниками республиканцев Эрлом Уорреном, которые продолжали работать на национальной политической сцене. Никсон взялся за дело преследования политиков в тихоокеанских государствах, подозреваемых в радикализме, и имел хорошие успехи в борьбе с социалистическими. И наконец, Никсон победил Уоррена в республиканцев, обещая ему губернаторство Калифорнии в обмен на национальную кандидатуру."

 PSA_sheridan_downey: "Шеридан Дауни"
 # PSA_sheridan_downey_leader_desc: "Шеридан Дауни, родившийся 11 марта 1884 года в Ларами, Вайоминг, поступил в юридическую школу Мичиганского университета и вскоре был избран окружным адвокатом в дружественной компании Олбанского округа в 1908 году как республиканец. В 1912 году, когда он сделал смелый шаг в поддержку Теодора Рузвельта и его восстания третьей партии Булла Мусе, он возглавил усилия движения в Вайоминге, опосредованно помогая демократам, победившим в штате. В следующем году он переехал в Калифорнию со своим братом Стивеном, и посвятил следующие несколько лет своей жизни своей юридической фирме и своим собственным предприятиям по недвижимости. В 1924 году он вновь вошёл в политику таким же образом, как он оставил ее, поддержав другую прогрессивную кандидатуру на пост президента, в этот раз вместе с Робертом Ла Фоллеттом, Sr. в 1932 году он принял решение изменить свою партийную регистрацию в Демократической, и до конца 1933 года заявил о своем намерении баллотироваться в губернаторы Калифорнии. После своего заявления к нему обратился известный писатель Уптон Синкл, который имел свои собственные планы баллотироваться в пользу губернатора, и в прошлом, он был попущен в Дан."

 # PSA_united_states_congress: "Конгресс Соединенных Штатов"

 PSA_ng_poon_chew: "Нг Пун Чу"
 # PSA_ng_poon_chew_desc: "Нг Пун Чью родился в Гуандуне, Китай, и в молодости эмигрировал в Америку. Чью училась служить в качестве министра первой пребвитерианской церкви, только для того, чтобы после 1892 года его церковь была сожжена. Чью основала китайскую газету Чхун сай Ят Пао , став опорой китайской общины на Западном побережье. Чью выступает за прекращение действия китайского Закона об изоляции и вестернизации китайских иммигрантов в американскую культуру."
 PSA_leland_merritt_ford: "Лиланд Мерритт Форд"
 #PSA_leland_merritt_ford_desc: "Лиланд Форд был нанят различными железными дорогами в качестве топографа, помогающего расширить инфраструтуру на Западе. Калифорнийцы избрали Форда в Конгресс, где он начал предлагать радикальные действия против японско-американского сообщества. Изоляционисты в Калифорнии считают его более умеренным лидером антисемитских изоляционистов на востоке."
 PSA_george_orson_welles: "Орсон Уэллс"
 # PSA_george_orson_welles_desc: "Орсон Уэллс является широко известным актёром и профсоюзным защитником, начиная с его обучения в немецком театре и заканчивая бродвеем в Голливуде, Уэллсу хвалят за его распутные и широкие культурные знания. Уэллс даже выступал в качестве посла доброй воли в Латинской Америке, придавая хорошее лицо американской дипломатии."
 PSA_harvey_arthur_van_norman: "Харви Артур Ван Норман"
 # PSA_harvey_arthur_van_norman_desc: "Харви Норман родился в Техасе и приехал в Калифорнию, чтобы изучать архитектуру."
 PSA_hugh_samuel_johnson: "Хью Сэмюэл Джонсон"
 # PSA_hugh_samuel_johnson_desc: "С самого раннего возраста Хью С. Джонсон стремился к достижению своих целей, невзирая на последствия, чтобы заставить своего отца отправить его в Вест-Пойнт, Джонсон был одноклассником Дугласа Макартура. Джонсон поднялся на корпоративную управленческую лестницу до тех пор, пока не стал советником кампании Джона Нэнса Гарнера. Тихоокеанские штаты завербовали его после кризиса 1936 года, умоляя его помочь создать устойчивую индустрию, независимую от восточных штатов."
 PSA_harold_leclair_ickes: "Гарольд Леклер Айкс"
 # PSA_harold_leclair_ickes_desc: "Начав свою юридическую карьеру в Чикаго, Иккес пытался занять должность в Иллинойсе, но без успеха."
 PSA_william_frederick_friedman: "Уильям Фредерик Фридман"
 # PSA_william_frederick_friedman_desc: "Фридман является полиглоттом, известным на русском, румынском, идишском и английском языках. Фридман стал офицером сигналов при генерале Першинге, первопроходцем в ряде методов криптографии. Фридман намерен внедрить серию шифровальных машин, которые зашифруют американские сообщения, с тем чтобы демократия не была подвергнута цензуре со стороны восточных правительств."
 PSA_herbert_osborn_yardley: "Герберт Осборн Ярдли"
 # PSA_herbert_osborn_yardley_desc: "Герберт Ярдли имеет многолетний опыт в области электронной связи, работая в Корпусе Сигналов Госдепартамента США с 1916 года. Ярдли был неотъемлемой частью основания первого американского управления военной разведки, Ми-8. Ярдли несколько лет пытался сообщить об угрозе наращивания японского флота Вашингтону, но его можно проигнорировать."

 PSA_edwin_mattison_mcmillan: "Эдвин Мэттисон Макмиллан"
 PSA_holland_mctyeire_smith: "Голландия МакТейер Смит"
 PSA_john_whiteside_parsons: "Джон Уайтсайд Парсонс"
 PSA_william_henry_rupertus: "Уильям Генри Рупертус"

 PSA_george_catlett_marshall: "Джордж Кэтлетт Маршалл"
 #PSA_george_catlett_marshall_PSA_leader_desc: "В 1900 году начал свою военную карьеру в Вирджинском военном институте, окончил в 1902 году должность второго лейтенанта армии Соединенных Штатов. Маршалл был размещен на Филиппинах во время филиппинско-американской войны, а также помог сдержать партизанские операции в районе после войны. Во время Велкрига Маршалл был направлен во Францию вместе со многими другими американскими офицерами в качестве наблюдателя, где он был назначен капитаном для наблюдения. После работы в качестве помощника декана генерала Перша в 1919 году он начал работать на нескольких позициях в армии, главным образом для передачи своего опыта в районе после войны. Во время велькригийского движения, Маршалл был направлен во Францию, вместе со многими другими американскими офицерами в качестве наблюдателя, где он был назначен капитаном для наблюдения. После работы в качестве ассистента генерала Першинга в 1919 году он начал работать на нескольких постах в армии, главным образом для передачи своего опыта в районе Велкрига. В течение этого времени он был назначен в качестве главного планиста и писателя в военном департаменте, который возглавлял 15-й полка в городах и преподавался в Военномом военном колледже до 1927 года, где он был назначен на должность члена гера."
 # PSA_george_catlett_marshall_leader_desc: "В 1900 году начал свою частную военную карьеру в Вирджинском военном институте, окончил в 1902 году должность второго лейтенанта армии Соединенных Штатов. В 1919 году Маршалл был размещен на Филиппинах во время филиппинско-американской войны, а также помог сдержать партизанские операции в этом районе после войны. Во время Велткриг был направлен во Францию вместе со многими другими американскими офицерами в качестве наблюдателей, где его повысили до уровня капитана для наблюдения. После работы в качестве помощника Генерального штаба Першина в 1919 году он начал работать на нескольких позициях в армии, главным образом для передачи своего опыта в районе после войны. Во время Велькриг стал более неопытным офицером, а также помогал армии модернизировать свою доктрину. В это время он стал главным планировщиком и писателем в Военном департаменте, командовал 15-м полком в городах и преподавал в Военном колледже до 1927 года, где он был призван на должность реквизита, а также был назначен офицером герцогства."

 PSA_henry_harley_arnold: "Генри Харли Арнольд"
 # PSA_henry_harley_arnold_PSA_leader_desc: "Общее описание: §L 25 июня 1886 года в Гладвине, Пенсильвания, Соединенные Штаты Америки §Y Военная карьера: §L Генри Харли"Hap" Arnold, a member of the distinguished American Arnold dynasty from which several politicians and military officers were part of, signed up for West Point when he had just turned 17. While he wanted to join the Cavalry corps, his grades and overall performance in the academy caused him to be assigned to the 29th Infantry Regiment, stationed at the Philippines. In April 1911, he requested a transfer to the Signal Corps, where he completed his instruction as an aviator on May. He'd continue his pioneering work in the air force throughout the late 1910s, and became fascinated by the aircraft developments in the Weltkrieg. During the Twenties, he joined up his colleague William Lendrum Mitchell to fight for an independent air force, which lead to Mitchell being court-martialled. Arnold stood, along with other renowned airmen, in defence of Mitchell but failed to win the trial. Arnold would continue to fight for an independent air force, trying to sway congressmen and recruit pilots to his cause, until he was sent to Fort Riley for 'attempting to influence legislation in an improper manner', where he spent the next few years writing books trying to interest young people in the air force. He'd return in 1928 to enter the Army's Command and General Staff School, from where he graduated in 1929. He'd continue changing posts in the American army until 1935, where he was assigned with the General Headquarters Air Force, the closest thing to an independent Air Force he had been in all his career, being promoted to Brigadier General in March 2, 1935. With the outbreak of the Civil War, 'Hap' found himself in the West Coast of America, where due to his constant disagreements with the national Chief of Air Corps of the Federal Government, he decided to join the Pacific Governors in their struggle, and provide any technical expertise he is able to in exchange for the promise of an independent air force."
 # PSA_henry_harley_arnold_leader_desc: "Общее описание: §L 25 июня 1886 года в Гладвине, Пенсильвания, Соединенные Штаты Америки §Y Военная карьера: §L Генри Харли"Hap" Arnold, a member of the distinguished American Arnold dynasty from which several politicians and military officers were part of, signed up for West Point when he had just turned 17. While he wanted to join the Cavalry corps, his grades and overall performance in the academy caused him to be assigned to the 29th Infantry Regiment, stationed at the Philippines. In April 1911, he requested a transfer to the Signal Corps, where he completed his instruction as an aviator on May. He'd continue his pioneering work in the air force throughout the late 1910s, and became fascinated by the aircraft developments in the Weltkrieg. During the Twenties, he joined up his colleague William Lendrum Mitchell to fight for an independent air force, which lead to Mitchell being court-martialled. Arnold stood, along with other renowned airmen, in defence of Mitchell but failed to win the trial. Arnold would continue to fight for an independent air force, trying to sway congressmen and recruit pilots to his cause, until he was sent to Fort Riley for 'attempting to influence legislation in an improper manner', where he spent the next few years writing books trying to interest young people in the air force. He'd return in 1928 to enter the Army's Command and General Staff School, from where he graduated in 1929. He'd continue changing posts in the American army until 1935, where he was assigned with the General Headquarters Air Force, the closest thing to an independent Air Force he had been in all his career, being promoted to Brigadier General in March 2, 1935. With his requests of an independent air force largely refused, Arnold may harbour some resentment against the general staff..."

 PSA_john_lesesne_dewitt: "Джон Лессен ДеВитт"
 # PSA_john_lesesne_dewitt_commander_desc: "2 января 1880 года в Форт-Сидни, Небраска́н-н-Военная карьера: §L Рожденный в военную семью и воспитанный на различных армейских постах, Джон Лессен ДеВитт-младший начал свою военную карьеру в 1898 году, когда он вступил в бой во время испано-американской войны. За этим последовала служебная поездка на Филиппины, где он стал офицером по снабжению, быстро поднявшимся в ряды и поднявшимся на служебную должность в генеральном офисе квартирмейстерского генерального управления в Вашингтоне, округ Колумбия... В начале 20-х годов он получил повышение в должности помощника начальника штаба Военно-плановых отделов, где он помог разработать Совместный план обороны, резервный план защиты Гавайских островов в случае японского вторжения. За свою работу в Отделе военных планов он смог достичь звания генерал-майора и был назначен генеральным квартер-мастером армии. В то время как в начале своего опыта военный колледж недавно связался с ним, чтобы он занял должность коменданта Колледжа, но он до сих пор не проявил особого интереса к тому, чтобы оставить свой пост в качестве квармщика."

 PSA_alexander_mccarrell_patch: "Александр МакКаррелл Патч"
 # PSA_alexander_mccarrell_patch_commander_desc: "§L 23 ноября 1889 года в Форт-Хуачуке, Аризона, Соединенные Штаты Америки §Y Военная карьера: §L Александр МакКаррелл"Sandy" Patch, the son of the Cavalry Captain Alexander M. Patch, started his military career when he joined West Point in 1909. While a fan of the cavalry corp, he was quick to realise that cavalry would soon enough become obsolete in combat, so he chose to join the infantry, and graduated from West Point as a second lieutenant in 1913. His first assignment was the 18th Infantry Regiment based in Texas, from where he was assigned to Pershing's 'Punitive Expedition' to Mexico, where he earned his promotion to first lieutenant. Without any major engagements for the US, Patch reached the rank of Captain in 1919 and was posted at Fort Benning as an instructor for four years. He'd apply for the Staunton Military Academy in Virginia as a professor of military science and tactics, a role which he'll keep until very recently. In the meantime, he attended the Field Officer's Course in 1922 and the U.S. Army Command and General Staff School, where he graduated with distinction in 1925, and finally graduated from the U.S. Army War College in 1932 as a lieutenant colonel. Patch's remarkable service record impressed General George Marshall, who tried to keep close contact with Patch in the following years of his graduation. When the civil war break out, Marshall implored Patch to join his staff in the Pacific Army, a request that Patch accepted and for which he was promoted to Brigadier General."

 PSA_lewis_hyde_brereton: "Льюис Хайд Бреретон"
 # PSA_lewis_hyde_brereton_commander_desc: "§Lis Hyde Brereton начал свою военную карьеру в 1907 году, когда он вступил в военно-морскую академию со своим братом и закончил ее в июне 1911 года. Однако, прежде чем он закончил школу, он представил письмо об отставке со ссылкой на морскую болезнь, в результате которой он не смог быть офицером военно-морского флота. Его должная отставка была принята, и он подал заявление о том, чтобы стать агентом в армии США, и был назначен вторым лейтенантом в Корпусе береговой артиллерии 17 августа 1911 года. В сентябре 1912 года он совершил полет в Роквелл-Филд, и работал на авиакорпусе, пока он не пережил вторую катастрофу, после которой он просил освободиться от службы. Он вернулся в службу береговой артиллерии, и в июле 1916 года он был назначен первым лейтенантом в Корпусе береговой артиллерии, в то время как он был отправлен на Филиппины и прослужил год перед возвращением в США в марте 1917 года, где он был назначен на службу в штаб-квартире авиаком в Вашингтоне Д. . . . . ~ ~ ~ . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . ."

 PSA_isaac_davis_white: "Исаак Дэвис Уайт"
 # PSA_isaac_davis_white_commander_desc: "В 1922 году он был назначен вторым лейтенантом в округе Хиллсборо, Нью-Гэмпшир, Соединенные Штаты Америки. В 1927 году он был повышен до уровня первого лейтенанта после прохождения курса подготовки офицеров кавалерийской школы, где он был очень заинтересован в возможности механизированных боевых действий и использования танка для прорыва вражеских линиях. В 1931 году он вступил в Школу командования и генерального штаба, где в 1932 году получил звание майора и стал одним из самых сильных защитников армии за использование танков вместе с Джорджем С. Паттоном. В то время как страна вспыхнула в гражданской войне, Айзек вместе с Маршаллом против Макартура покинул Форт Райли, где он работал в качестве инструктора, и получил награду за свою преданность Маршалу в ранге бригадного генерала."

 PSA_albert_coady_wedemeyer: "Альберт Коди Ведемейер"
 # PSA_albert_coady_wedemeyer_commander_desc: "9 июля в Омахе, Небраске, Соединенные Штаты Америки. §L Альберт Коади Ведемейер окончил Вест-Пойнт в 1919 году в качестве второго лейтенанта, после чего он был направлен в 29-й пехотный полк в Форт-Беннинге и был переведен в 57-ю пехотную пехоту на Филиппинах в 1923 году. Позднее он был назначен в 15-й пехотный полк в Легате Тяньцзина, где он научился говорить почти идеально на языке мандарин, и вернулся в США для прохождения курса в Школу командования и генерального штаба, где его отличные оценки дали ему право на программу обмена с немецкой кригсакадеми, выезжавшей в начале 1936 года."

 PSA_alexander_archer_vandegrift: "Александр Арчер Вандегрифт"
 # PSA_alexander_archer_vandegrift_commander_desc: "§L Archer Vandegrift начал свою военную карьеру в годы своего пребывания в Университете Вирджинии, где он получил свою комиссию в Морском корпусе США, став вторым лейтенантом в начале 1909 года. Его первая поездка была во время так называемой «Бананской войны», во время небольшого пребывания на Кубе, а затем в Никарагуа, когда он принял участие в захвате «Койотепе», он принял участие в оккупации Веракруса и будет бороться против «Какос Бандитс» в Ле Тру и Форт Капуа в Гаити. Он был назначен капитаном в 1916 году, и был одним из главнокомандующих членов Гаитянского констебля, где он был назначен главным инспектором Константепа в 1919 году. В 1920 году он был переведен на большую службу в штаб и был переведен в морской отдел США в 1923 году, где он был направлен в Капитан в 1916 году, и был одним из главных членов Гаитянского констебля, где он был назначен инспектором Констебля в 1939 году."

 PSA_george_windle_read_jr: "Джордж Виндл Рид младший."
 #PSA_george_windle_read_jr_commander_desc: "§L 29 июля 1900 года в Форте Гранте, Аризона §Y Военная карьера: §L Джордж Виндл Рид младший провел большую часть своей молодежи в военных лагерях, следуя за своим отцом, который был важным сотрудником армии США, он вызвался служить в армии в 1917 году, и, хотя сначала он записался в пехоту, окончил военную академию в качестве второго лейтенанта, его любовь к Поло заставила его перебраться в кавалерийский корпус до 1920 года, где он в конце 1921 года прошел базовый курс по кавалерийской школе и закончил его в 1921 году. Он занял несколько постов в США и за рубежом, главным образом после шагов своего отца до своей смерти в 1934 году, после смерти его отца он был назначен в Сиэтл, где ему пришлось провести несколько забастовок от имени центрального правительства в связи с ухудшением национальной ситуации."

 PSA_james_harold_doolittle: "Джеймс Гарольд Дулитл"
 #PSA_james_harold_doolittle_commander_desc: "14 декабря 1896 года в Аламеде, штат Калифорния, Соединенные Штаты Америки. §L James Harold 'Jimmy' Dooultle учился в Лос-Анджелесском городском колледже после окончания школы искусств-руководителей в Лос-Анджелесе, а затем поступил в Калифорнийский университет, Беркли, где он учился в Минной школе. В 1922 году он поступил в резерв сигналового корпуса в качестве пилота в 1917 году и был назначен в качестве первого лейтенанта в 1918 году, после чего он совершил несколько поездок в качестве инструктора по полетам. Он посещал школу авиатехники и аэронавигационный курс, а затем, наконец, вернулся в Беркли, где в 1922 году получил степень бакалавра искусств. В 1922 году в 1917 году в 1917 году Дулиттл стал национальным лейтенантом и первопроходцем в авиапереговоре. В 1918 году он совершил несколько поездок как в США и за рубежом и даже получил степень магистра в области аэронавтики, и в 1924 году. Докстинд помогал в разработке инструмента, для которого он работал в качестве агента, ассиентиста в 1930 году."

 PSA_herbert_butler_powell: "Герберт Батлер Пауэлл"
 # PSA_herbert_butler_powell_commander_desc: "13 июля 1903 года в Монмуте, штат Орегон, Соединенные Штаты Америки. §L Герберт Батлер Пауэлл начал свою военную карьеру, когда в 1919 году вступил в Национальную гвардию Орегона в качестве частного лица, где он достиг звания сержанта, и начал изучать журналистику в университете Орегона, откуда он закончил в 1927 году. В 1931 году он провел курс подготовки офицеров роты в пехотной школе армии Соединенных Штатов в Форт Беннинге, где он закончил второй лейтенант. Он записался в командный и генеральный штабный колледж и получил звание майора в 1935 году."

 PSA_william_daniel_leahy: "Уильям Дэниел Лихи"
 # PSA_william_daniel_leahy_admiral_desc: "В 1893 году, когда он закончил маленькую школу в Ашленде, штат Виск, в 1893 году, он смог получить назначение в Военно-морскую академию, из которой он был зачислен в 1897 году. Леай был назначен в USS Oregon, где он был ее знаменитым тиром через Магелланский пролив, и в Южной Америке весной 1898 года, чтобы принять участие в битве в Сантьяго, штат Виск. В 1893 году он завоевал назначение в матч-академика-департамент в 1897 году. Леай был назначен в звание главного офицера Вашингтонского бюро в 1897 году. В 1899 году он был назначен в американско-фантажерный период, где он служил на верховном дворце Кастина и Глейцера и командовал катером в 1902 году, а в последующие пять лет он прибыл в Соединенные Штаты в американский дивизион."

 PSA_ernest_joseph_king: "Эрнест Джозеф Кинг"
 # PSA_ernest_joseph_king_admiral_desc: "23 ноября 1878 года в Лорайне, Огайо, Соединенные Штаты Америки. Военная карьера: §L Эрнест Джозеф «Рей» Кинг посещал военно-морскую академию Соединенных Штатов с 1897 по 1901 год, окончил четвёртый год в своем классе. В 1914 году он получил первое командование, лейтенант лейтенант США Терри, участвовавший в оккупации Веракруса Соединенными Штатами Америки. С напряженностью в Европе во время испано-американской войны он был назначен на должность капитана атлантического флота, а после окончания Велкриг стал главой военно-морской аспирантской школы, где он подготовил доклад о военно-морской подготовке, в котором рекомендовались изменения в военно-морской подготовке и карьерных путях."

 PSA_chester_william_nimitz: "Честер Уильям Нимиц"
 # PSA_chester_william_nimitz_admiral_desc: "§Admiral Profinition\n§YBorn: §L 24 февраля 1885 в Фредериксбурге, Техас, Соединенные Штаты Америки#n§Y Военная карьера: §L Chester William Nimitz, сын отставного капитана моря Чарлза Нимица, занялся военной карьерой, а студент, которого он пытался назначить в Уэст-Пойнт. Когда его не было, он сдал конкурсный экзамен в Аннаполисе и покинул среднюю школу в 1905 году, чтобы войти в класс Военно-морской академии. В 1907 году, после того, как он вступил в четвёртую дивизию Огайо в Сан-Франциско, он поехал в хижину на дальний Восток. В 1907 году он был назначен главным исследователем американской подводной лодки, а затем командовал штабом US Decatur и был судмедэкспертом для ее подземного дела. В 19-м в 19-м году в хординном колледже, а в 19-м году он был отправлен в Германскую разведку, когда он прибыл на матческую разведку, и был на х на площадку в Германскую разведку."

 PSA_harry_wilbur_hill: "Гарри Уилбур Хилл"
 # PSA_harry_wilbur_hill_admiral_desc: "После выпуска из Военно-морской академии он последовательно служил в бронированном крейсере Мэриленд, в торпедном катере Айрис и в эсминце Перри из Тихоокеанской флотилии; и в качестве инженерного офицера охраняемого круизного крейсера Олбани до 1917 года он служил на военно-морском катере в Техасе и был переведен в сентябре 1918 года на боевой корабль Вайоминг. 23 ноября 1918 года он служил в качестве навигатора крейсера Арканзас и служил в этом качестве до января 1919 года, когда он был назначен в качестве дежурного офицера Флотилии, и в качестве лейтенанта охраняемого круизера Олбани."

 PSA_felix_budwell_stump: "Феликс Бадвелл Стамп"
 #PSA_felix_budwell_stump_admiral_desc: "15 декабря 1894 года в Паркерсбурге, Вест-Вирджиния, Соединенные Штаты Америки. §L Феликс Будвелл Стамп был назначен в Военно-морскую академию Соединенных Штатов в 1913 году. Он служил в Йорктауне на борту крейсера Цинциннати во время войны в Атлантике. После войны он служил на преддушном корабле Алабама. Вскоре после этого Стамп участвовал в подготовке к полету на военно-морской станции Пенсакола в 1920-1921 годах, после чего в Массачусетском технологическом институте преподавал в аспирантуре аэронавигационной инженерии. С 1923 по 1925 год он был офицером военно-морского флота в Торпедо Сквадро 2 (VT-2)."Doer Birds" of the experimental carrier Langley. He commanded the Cruiser Scouting Wing in 1928-1929 and served on the Staff of Commander Cruisers, Scouting Fleet in 1930–1931. Stump was Commanding Officer of Langley's Torpedo Bombing Squadron 2 before 1937. Promoted to Commander in 1937, he served as Executive Officer of Langley on moment of the start of the Civil War when he was promoted to the rank of rear admiral by Pacific Command."

 PSA_harvey_edward_overesch: "Харви Эдвард Оверш"
 # PSA_harvey_edward_overesch_admiral_desc: "§L 20 января 1893 года в Лафайетте, Индиана, Соединенные Штаты Америки §Y Военная карьера: §L Харви Эдвард «Шведе» Овереш учился в Purdue University в течение двух лет, прежде чем поступить в военно-морскую академию Соединенных Штатов. Он играл в конце футбольной команды ВМС. В декабре 1913 года он был избран капитаном футбольной команды ВМС 1914 года."greatest personal excellence in athletics" in the Academy's Class of 1915. After graduation and during Weltkrieg, he first had duty on the USS South Carolina, serving until December 1918. He then had consecutive duty as Aide on the staff of Commanders of Atlantic. In 1920, he reported to the US Naval Academy for postgraduate instruction in ordnance after completing which in June 1923, he was ordered to the Newport News Shipbuilding and Dry Dock Company plant, where the USS West Virginia was building. He served in her from her commissioning until March, 1926, and was Executive Officer of the USS Osborne until 1927. His Next assignment was shore duty at the Naval Torpedo Station in Newportand later at the Naval Proving Ground in Dhalgren until 1929 when he returning to sea an d serving in Asiatic Fleet. In 1935 he was appointed as Naval Attaché and Naval Attaché for Air at the American Legion, where he served until the start of the Civil War. With the start of the Civil War he was recalled to U.S and temporarily promoted to the rank of rear admiral by Pacific Command."

 PSA_james_henry_doyle: "Джеймс Генри Дойл"
 # PSA_james_henry_doyle_admiral_desc: "С момента своего выпуска в 1919 году до августа 1926 года он с отличием закончил юридический факультет Университета Джорджа Вашингтона, получив степень бакалавра права. 1 августа 1926 года он вступил в должность исполнительного сотрудника USS Лоуренса, а в августе 1930 года был переведен в аналогичную должность в USS Buchanan."

