 USA_douglas_macarthur: "Дуглас МакАртур"
 # USA_douglas_macarthur_leader_desc: "Дуглас Макартур утверждает, что он научился ездить и стрелять, прежде чем читать или писать, и эти навыки были тем, что он увязал оставшуюся карьеру. Самый успешный сын генерал-лейтенанта Артура Макартура, который шел по стопам своего отца и поступил в военную академию Соединенных Штатов в Вест-Пойнт, затем сразу же, чтобы бороться с мятежами на Филиппинах и с оккупацией Веракруса во время мексиканской революции. К 1920-м годам он уже был самым молодым генерал-майором в армии Соединенных Штатов и суперинтендантом Вест-Пойнт, который он реформировал для того, чтобы рассмотреть изменения в современной войне со времен Велкрига. После службы в его старой академии, он вернулся в свой второй дом, Филиппины - но его время было кратким, так как в 1930-х годах он был самым сильным генерал-майором в армии Соединенных Штатов, чтобы он смог вернуться в хитрый хитрый хитрый хитрый хаджорнорн в 1930-х годах."
 USA_douglas_macarthur_civilian_leader_desc: "Когда Америка была в кризисе, имя \"Douglas MacArthur\" was often spoken of in the halls of Congress with worried tones, men fearful of the prospect that he may simply march on the White House and prove to be the slayer of American democracy. But though the later war would scar the United States forever, democracy, however damaged, survived. MacArthur's career, on the other hand, prospered. His talented command, strong leadership, and affinity for the national spotlight transformed him into a war hero. With the conflict's end, it came as little surprise that he would seek the nation's highest office through more legal means.\n\nWinning the Republican nomination and finally the elections, America's citizens hope that their new President can show the same resolve he did in war, at peace."
 # USA_douglas_macarthur_commander_desc: "Общее описание: §L 26 января 1880 года, в Литтл-Рок, Арканзас, Соединенные Штаты Америки §Y Военная карьера: §L Douglas \"Big Chief\" MacArthur, born from a long family line of military men, graduated from West Point as an Engineer Corps second lieutenant in 1903 with the highest grade in the academy's history. In 1904, he was promoted to first lieutenant and travelled to the Philippines in order to help his father with the construction of their headquarters. Through his father's influence, MacArthur quickly became a military advisor to President Theodore Roosevelt until 1908, where he took command of an engineer company in Fort Leavenworth, reaching the rank of Captain in 1911. All these high profile postings allowed him to join the American General Staff in 1912, at the young age of 32. MacArthur took part in the occupation of Veracruz, learning Spanish in a matter of weeks and taking part in several small skirmishes with the rebels. He returned to America in 1919, when he was assigned as the Director of the United States' Military Academy at West Point. In 1922, he returned to the Philippines, this time to inspect the island's defence status, and having to intervene personally to end mutiny of Philippino scouts. With his promotion to Major General in 1925, his notoriety only grew and grew, being sent to the 1928 Olympic games in the Netherlands to head the American Olympic Committee. However, MacArthur was also forced to comply with orders he didn't agree with, like the court martial of Brigadier General Billy Mitchell, which MacArthur has called \"one of the most distasteful orders I ever received\". During the \"Bonus March\", MacArthur was forced, under President Hoover's orders, to put down the \"Bonus Army\" despite MacArthur's agreeing with the protestors' demands. He has since then become the highest ranking American Officer, although he has had a troubled relation with the government's executive branch.\n§YImportant Notes:§L- Born from a family that fought in the Civil War, MacArthur is willing to do whatever is necessary to keep America as a united, great and free country."

 USA_john_edgar_hoover: "Джон Эдгар Гувер"
 #USA_john_edgar_hoover_desc: "Родной сын Вашингтона, Дж. Эдгар Гувер, является директором и публичным лицом Федерального бюро расследований. Его союзники приписывают ему сдерживание организованной преступности и защиту невинных. Критики Гувера говорят, что он приобрел политическую власть благодаря козлу отпущения иммигрантов в качестве причины организованной преступности. Распространяются злобные слухи о том, что Гувер имеет отношения с его секретарем-мужчиной и является афроамериканцем, проходящим как белый."
 USA_john_pierpont_morgan_jr: "Джон Пирпонт Морган младший."
 # USA_john_pierpont_morgan_jr_desc: "Ж.П. Морган-младший является наследником большого состояния, накопленного его отцом и сосредоточенного на их контроле над банком Дж.П. Моргана. Их инвестиции в тяжёлую промышленность способствовали консолидации нескольких отраслей, хотя Морган также в значительной степени сосредоточился на благотворительности и лоббировании более активной внешней политики. Побуждая к более тесным связям с компанией Энтенте (по крайней мере отчасти из-за его предыдущих инвестиций во время Вельткрига) его презрение к гегемонии Кайзеррейха углубилось в результате попытки германского монархиста в 1915 году нанести ущерб его жизни."
 USA_william_randolph_hearst: "Уильям Рэндольф Хёрст"
 # USA_william_randolph_hearst_desc: "Хёрст является владельцем газеты Hearst Communications, которая владеет несколькими газетами с высоким тиражом по всей стране. Хёрст играет определенную роль в политике с момента своей поддержки испано-американской войны 1898 года. Несмотря на свои неоднократные попытки, Хёрст не смог когда-либо получить выборную должность в правительстве, а его газеты нападали на синдикализм и монархизм с первого Вельткрига."
 USA_james_strom_thurmond: "Джеймс Стром Турмонд"
 USA_cordell_hull: "Корделль Халл"
 # USA_cordell_hull_desc: "Корделль Халл долгое время служит конгрессменом с многочисленными талантами, законодателем, имеющим опыт написания Федерального бюджета, дипломатом, занимающимся распространением влияния США на Мексику и поддержанием отношений США с Германией. Его влияние на Демократический национальный комитет также дает ему право влиять на то, какие кандидаты могут баллотироваться на выборах."
 USA_martin_dies_jr: "Мартин умер младший."
 #USA_martin_dies_jr_desc: "Техасский представитель, имеющий опыт судебного преследования, Диз-младший, заслужил доверие миллионов американцев как рационального опекуна американского народа, он повлиял на общественное восприятие синдикализма, Голливуда, немецких монархистов и иммигрантов в целом как внешних сил с плохими намерениями для Америки."
 USA_charles_andrew_willoughby: "Чарльз Эндрю Уиллоби"
 #USA_charles_andrew_willoughby_desc: "Уиллоуби, родившийся в Гейдельберге, Германия, имеет выдающуюся карьеру в армии и на дипломатической службе. Уиллоби, выполняющий функции атташе, наблюдающего за боевыми действиями в Италии, Германии и Испании."
 USA_hjalmar_petersen: "Хьяльмар Петерсен"
 # USA_hjalmar_petersen_desc: "Петерсен работал в палате представителей Миннесоты на тот момент в Конгрессе при Партии фермерства и Лабора. &quot; За расширение прав профсоюзов &quot; Петерсен является единственным союзником Флойда Б. Олсона в Конгрессе."
 USA_walter_francis_white: "Уолтер Фрэнсис Уайт"
 #USA_walter_francis_white_desc: "Уолтер Уайт родился от родителей смешанной расы, по закону черным в своем родном штате Джорджия, несмотря на светлое коже и голубые глаза. Уолтер Уайт учился под руководством В.Э.Б. Дюбуа и, в конечном итоге, поднялся до секретаря Национальной ассоциации содействия прогрессу цветных людей, Белый продвинулся вперед для НААКП и партий-учреждений, укрепляя доверие афроамериканского сообщества к правительству."
 USA_robert_ferdinand_wagner: "Роберт Фердинанд Вагнер"
 # USA_robert_ferdinand_wagner_desc: "Родившийся в Гессен-Нассау, Пруссия, Вагнер эмигрировал в США и завоевал место в правительстве штата Нью-Йорк. Вагнер провел десятилетия в качестве защитника профсоюзов и безопасности трудящихся. Демократический политик Аль Смит полагается на Вагнера, чтобы укрепить свою собственную популярность среди городского Севера. Вагнер выступает за прямое вмешательство в экономику, с тем чтобы обратить вспять последствия Великой депрессии."
 USA_felix_frankfurter: "Феликс Франкфуртер"
 # USA_felix_frankfurter_desc: "Франкфуртер, родившийся в Вене, Австрия, эмигрировал в США и стал помощником окружного прокурора США."

 USA_julius_robert_oppenheimer: "Юлий Роберт Оппенгеймер"
 USA_theodore_edson_chandler: "Теодор Эдсон Чендлер"

 USA_malin_craig: "Малин Крейг"
 # USA_malin_craig_commander_desc: "В 1910 году он поступил в военный колледж Армии Рига и закончил его в следующем году, став членом генерального штаба и начальником штаба Маневерского отдела. После нескольких назначений и переездов он был назначен в качестве директора Военного колледжа."

 USA_dwight_david_eisenhower: "Дуайт Дэвид Эйзенхауэр"
 # USA_dwight_david_eisenhower_leader_desc: "Ученик войны в известном классе 1915 года, первый энтузиазм Эйзенхауэра к испытанию новых военных доктрин исчез в Центральной Америке, поскольку генералы там не смогли победить плохо обученных мятежников. В то время как другие в этом классе либо поддались жажде диктатуры, либо радикализма. Эйзенхауэр был твердо настроен на федеральное правительство и пытался не участвовать в гражданской политике."dogcatcher to Grand High Supreme King of the Universe\". Four years after he made that statement, though, Eisenhower was being sworn in as President. This came from a national acceptance for the desegregation of the military Eisenhower oversaw."
 # USA_dwight_david_eisenhower_commander_desc: "Общее описание: §L 14 октября 1890 года, Денизон, штат Техас, Соединенные Штаты Америки §Y Военная карьера: §L Дуайт Дэвид \"Ike\" Eisenhower, a fan of military history since a young age, applied for both West Point and Annapolis in 1910, being accepted in the former after the highest ranking candidate failed the physical requirement in 1911. He graduated in 1915 along with Omar Bradley and was almost discharged due to a leg injury, but West Point's chief medical officer interceded with the War Department and obtained a commission for him. Eisenhower would be posted with the 19th Infantry Regiment in the Mexican Border and reached the rank of Captain in 1917. He was transferred to Fort Benning in late 1918, where he remained training with the Camp Polk Tank school until the 1919 Motor Transport Corps convoy. \"Ike\" was promoted to Major in 1920. His interest in armoured warfare only grew and grew, and quickly joined Patton's and Van Voorhis in their requests of increased funding for a mechanisation program. In 1924, he was sent to Panama, where he served under General Fox Conner, who decided to tutor \"Ike\" into philosophy, military history and military theory and was selected in 1925 for the Command and General Staff College, graduating first in a class of 245 officers. Conner would help \"Ike\" to get into the War College, becoming one of the youngest students of the academy and receiving the praise of General Pershing himself. After his graduation, he was assigned to the Army War College, and then served as executive officer to Major General George Van Horn Moseley, Assistant Secretary of War, from 1929 to 1933. Since then he has served as chief military aide of General Douglas MacArthur, accompanying him to the Philippines, where he served as assistant military advisor to the Philippine government. Since then, he has become MacArthur's undisputed second in command, and while their personalities tend to clash often, many claim that their skills complement each other."

 USA_clarence_ralph_huebner: "Кларенс Ральф Хёбнер"
 # USA_clarence_ralph_huebner_commander_desc: "§L 24 ноября 1888 года в Буштоне, Канзас, Соединенные Штаты Америки#n §Y Военная карьера: §L Кларенс Ральф Хёбнер родился в плохой фермерской семье, и поэтому он не мог позволить себе сразу же поступить в военную академию. Вместо этого он был рядовым в армии, служил в 18-м пехотном полке почти семь лет и достиг ранга сержанта к 1916 году. Он принял участие в экспедиции Панчо Вилья, отлично выполняя обязанности второго лейтенанта, после чего он был направлен в Школу командования и генерального штаба Форт-Летнворта. Он достиг звания майора до того, как стал преподавателем в академии с 1929 по 1933 год, был повышен до лейтенанта полковника в 1934 году и с тех пор служил в канцелярии начальника пехотной службы, став следующим в очередь за продвижение по службе бригадного генерала. § §Ymportant : § §L стал лично привязателем первого пездника \"The Big Red One\" due to his years of service within it."

 USA_edward_hale_brooks: "Эдвард Хейл Брукс"
 #USA_edward_hale_brooks_commander_desc: "§L Как и многие из его коллег-офицеров, Эдвард Хейл Брукс не начал свою военную карьеру после окончания средней школы, вместо этого он впервые поступил в Норвичский университет, где он вступил в состав резервного учебного корпуса офицеров в 1915 году и окончил его в 1916 году со степенью бакалавра наук в области гражданского строительства. Он был назначен капитаном 1-го кавалерийского полка Вермонтской национальной гвардии до 1916 года, когда он бросил военную жизнь, чтобы сосредоточить свою энергию на своей работе инженера. Это продолжалось до тех пор, пока Национальная гвардия не была отозвана вскоре после экспедиции Панчо Виллы, однако он не увидел там никаких действий."D\" in the 24th Field Artillery Regiment at Fort Stotsenburg in the Philippines. He remained there until 1928 where he was assigned to the 18th Field Artillery Regiment in Fort Riley. He later attended the Army Command and General Staff School in 1932, graduating two years later and went to Harvard University as an instructor of the ROTC, reaching the rank of Major in 1935.\n§YImportant Notes:§L- Currently undergoing training at the Army War College and is expected to graduate in early 1937."

 USA_geoffrey_keyes: "Джеффри Кейс"
 # USA_geoffrey_keyes_commander_desc: "§L 30 октября 1888 года в Форт-Бейарде, Нью-Мексико, Соединенные Штаты Америки#n §Y Военная карьера: §L Jeffrey T. Kees начал свою военную карьеру, когда в 1908 году он поступил в качестве кадета в Вест-Пойнт, окончил его в 1913 году в качестве второго лейтенанта кавалерии. Он был впервые назначен в шестой кавалерийский полк до 1916 года, где он принял участие в экспедиции Панчо-Вилья. После возвращения экспедиции он стал инструктором в Вест-Пойнте. Позднее он был назначен в Отдел Панамского канала в качестве помощника начальника штаба Фокс Коннера. Он вернулся в 1923 году, чтобы записаться в армейскую командную и штабную школу в 1926 году, а затем стал начальником отдела снабжения в военном департаменте."

 USA_jonathan_mayhew_wainwright: "Джонатан Мэйхью Уэйнрайт IV"
 # USA_jonathan_mayhew_wainwright_commander_desc: "Общее описание: §L 23 августа 1883 года в Уолле, Вашингтон, Соединенные Штаты Америки §Y Военная карьера: §L Джонатан Мэйхью \"Skinny\" Wainwright IV began his military career being commissioned as a Cavalry Second Lieutenant after graduating West Point in 1906. He was assigned to the 1st Cavalry Regiment in Texas from 1906 to 1908 and later took part in fighting the Moro Rebellion in the Philippines between 1908 and 1910. He later graduated from the Mounted Service School in Fort Riley, before being promoted to Captain in 1916 and becoming an instructor there. He was assigned in 1921 to the 3rd Cavalry Regiment between 1923 and 1925. He then took up several staff positions until being promoted to Lieutenant Colonel in 1929, before signing up to the Command and General Staff School and Army War College, where he graduated in 1931 and 1934 respectively. Wainwright was promoted to colonel in 1935, and with rumours of dissent within the cavalry corps, Wainwright was given an early promotion to Brigadier General in late 1935 for his loyalty to MacArthur."

 USA_joseph_warren_stilwell: "Джозеф Уоррен Стилвелл"
 # USA_joseph_warren_stilwell_commander_desc: "Общее описание §YBorn: §L 19 марта 1883 года, Палатка, Флорида, Соединенные Штаты Америки §Y Военная карьера: §L Джозеф Уоррен \"Uncle Joe\" Stilwell joined West Point in 1900 thanks to his family connections with the US President at the time, William McKinley. He graduated in 1904, with a special note made of his sporting prowess and his ability to learn new languages. He then became a teacher at West Point and underwent the Infantry Advanced Course and the Command and General Staff College, reaching the rank of Captain in 1916. He served as an instructor in Fort Benning during the '20s, reaching the rank of Lieutenant Colonel in 1929, and then served 3 tours in the American Legations in China, with his last posting being in Tianjin before being called back to the US. For this, he was promoted to brigadier general, and since then has been working as assistant commander of the 2nd Infantry Division.\n§YImportant Notes:§L- A member and loyal supporter of the Republican Party.\n- Stilwell has developed a controversial reputation amongst his own troops, being known as \"Uncle Joe\" for his emphasis on minimising army etiquette but also being known as \"Vinegar Joe\" for his harsh critiques of field performances."

 USA_leonard_townsend_gerow: "Леонард Таунсенд Героу"
 #USA_leonard_townsend_gerow_commander_desc: "Общее описание: §L 13 июля 1888 года, Санкт-Петербург, Вирджиния, Соединенные Штаты Америки §Y Военная карьера: §L Леонард Таунсенд \"Gee\" Gerow began his military career attending the Virginia Military Institute, from where he graduated as a recipient of an \"Honor Appointment\", which allowed him to completely skip West Point and become an Infantry second lieutenant in September 1911. In 1915 he received a commendation for his work in the hurricane relief efforts around Galveston, Texas, and served at and near the city of Veracruz during the Pancho Villa Expedition, reaching the rank of Captain in 1917. He then took up an interest in the signal corps, serving without much distinction until signing up in the Advanced Course at the Infantry School in Fort Benning, graduating top of his class in 1925, with Omar Bradley being second. He then entered the Army Command and General Staff School, becoming a friend of Dwight Eisenhower and graduating in 1926. He then immediately signed up to the Officer's course in Chemical Warfare and Tanks and took a course in the Army War College, where he was promoted to colonel in 1932 and then assigned to the American Legation Garrison in Shanghai. He returned to the US in late 1935 and was promoted to Brigadier General thanks to his stellar performance in China.\n§YImportant Notes:§L- Gerow has been particularly interested in expanding the Army's Tank Corps since he finished his 1931 course."

 USA_lesley_james_mcnair: "Лесли Джеймс Макнейр"
 # USA_lesley_james_mcnair_commander_desc: "§L 25 мая 1883 года в Верндейле, штат Миннесота, Соединенные Штаты Америки"Whitey\" McNair started his military career by signing up for the Naval Academy, where he was put on a waiting list and began studying at the Minnesota School of Business while he waited. In 1900, he changed his mind and decided to sign up to the Military Academy, where he graduated from West Point in 1904 as a second lieutenant. He was assigned as platoon leader of the 12th Battery of Mountain Artillery in Fort Douglas, but he would request a transfer to the Ordnance Department shortly after. Thanks to his studies in Minnesota, he managed to be appointed to the overseeing boards which developed new weapons for firearm companies, managing to reach the rank of First Lieutenant in 1909. He continued gaining relevance in the army thanks to his great leadership skills and technical expertise, reaching the rank of Captain in 1914 and taking part both in the Veracruz Expedition and the Pancho Villa Expedition with the 4th Field Artillery Regiment. He reached the rank of Major in 1917 and continued to take part in overseeing boards, experimenting with different types of artillery pieces as the Army began to prepare for possible involvement in the Weltkrieg that never came.\nHe was later assigned to the Army's Hawaiian department where he helped test new methods in coastal defence as well as spearheading the review of War Plan Orange, in the case of a Japanese attack of Hawaii. However, his involvement in what came to be known as the \"McNair Board\" ended up drawing controversy from the Air Service Branch of the Army, which would later result in McNair presenting testimony against Billy Mitchell during a 1925 trial. He reached the rank of Lieutenant Colonel in 1928 and entered the War College, graduating two years later and serving as a teacher in the U.S. Army Field Artillery School and as commander of the Civilian Conservation Corps in 1934. He reached the rank of Colonel in 1935 and became Executive Officer for the Army's Chief of Field Artillery. He finally reached the rank of Brigadier General in late 1935 by Major General Upton Birnie Jr.'s own recommendation to MacArthur."

 USA_lloyd_ralston_fredendall: "Ллойд Рэлстон Фредендалл"
 #USA_lloyd_ralston_fredendall_commander_desc: "§Lloyd Ralston Fredendall вошли в военную академию Соединенных Штатов в 1905 году благодаря связям его отца с армией и выдвижению сенатора Вайоминга Фрэнсиса Уоррена. Однако он плохо поступил и был уволен из академии в конце одного семестра. Его мать уговорила сенатора назначить его на следующий год, но он бросил его, и, когда генерал-инженер пытался назначить его на третий раз в следующем году, он был отвергнут самой академией. Вместо этого Фредендалл посетил Массачусетский технологический институт и, не почувствовав своего опыта в Вест-Пойнте, он сдал экзамен офицеру в 1906 году. В 1906 году он поступил в высший класс всех заявителей. 13 февраля 1907 года он был назначен вторым лейтенантом пехотной школы. Ллойд провел остаток десятилетия работы в нескольких зарубежных школах армии, где он завоевал репутацию отличного учителя, тренера и администратора."

 USA_lucian_king_truscott_jr: "Лючийский король Трускотт-младший."
 #USA_lucian_king_truscott_jr_commander_desc: "§L 9 января 1895 года в Чатфилде, штат Техас, Соединенные Штаты Америки. §Lucian King Trussott-младший начал свою военную карьеру, заявив, что он был выпускником средней школы, который закончил первый год колледжа. После того, как он был принят, он закончил Форт Логан Х. Кортс и был назначен вторым лейтенантом кавалерия. Он оставался на мексиканской границе до конца десятилетия, работая в 17-м кавалерийном полке в Аризоне, став первым лейтенантом в конце 1918 года, и капитаном в 1920 году."

 USA_walter_krueger: "Уолтер Крюгер"
 # USA_walter_krueger_commander_desc: "§L Walter Kruger эмигрировал в Соединенные Штаты, когда его мать и двое братьев и сестер после смерти его отца в 1890 году. В 1898 году он поступил в армию Соединенных Штатов для борьбы с испано-американской войной со вторым волонтерским пехотным департаментом Соединенных Штатов, достигая звания сержанта во время кампании. В 1903 году он вновь записался в прежнее место в военном колледже и вступил в 12-й пехотный полк, где он воевал под командованием генерала Артура Макартура против мятежников. В 1901 году он был назначен вторым лейтенантом и направлен в 30-й пехотный полк в Мариндуке. В 1903 году он забрался в мексиканскую школу в качестве наблюдателя, а в 1903 году его подразделение в основном выполняло обязанности гарнизора, Крюгер посетил Пехотно-Кавалерскую школу и Вашингтонский колледж, окончил соответственно в 1904 и 1907 годах. После второй поездки на Филиппины, где он был принят в Келли, он был приглашен в экстрию, а также был назначен в мексиканскую службу в мексиканскую армию в 1914 в 1903."

 USA_adna_romanza_chaffee_jr: "Адна Романза Чаффи-младший."
 #USA_adna_romanza_chaffee_jr_commander_desc: "23 сентября 1884 года в Джанкшн-Сити, Канзас, Соединенные Штаты Америки. Его первая военная карьера: §Adna Romanza Chaffee-младший, сын генерал-майора Адны Романзы Чаффе-старший, окончил Вест-Пойнт в 1906 году в качестве лейтенанта кавалерии. Его первая командировка была в 15-й кавалерии в составе армии кубинского мира, где он оказался чрезвычайно компетентным всадником (который вскоре заработал ему прозвище)."The Army's Finest Horseman\"). He was next assigned to the Mounted Services School at Fort Riley, Kansas between 1907 and 1911, where he commanded the mounted detachment serving the students and staff of the Army War College. He was then sent to France to attend the French Cavalry School at Saumur in 1913, as tensions began rising in Europe. In 1914 he returned to America to teach in Fort Riley for a short time, but was redeployed to the 7th Cavalry Regiment in the Philippines. He was reassigned in 1915 to the Staff and Faculty at West Point as the Senior Cavalry Instructor in the Tactical Department, where he remained until 1919, when he became an instructor at the Command and General Staff School at Fort Leavenworth. The next year, he achieved the rank of Major and was reassigned first to the 3rd Cavalry Regiment and then to the 1st Cavalry Division in 1921. After attending the Army War College, he assumed command of a squadron of the 3rd Cavalry from 1925 to 1927, when he moved to the War Department's General Staff and was promoted to Lieutenant Colonel. In that post, he began working extensively on compiling the usage of Tanks in the Weltkrieg and developing America's first mechanised and armoured tactics, despite having very few assets available to put his theory to the test. Chaffee left the General Staff in 1931 to serve as the Executive Officer of the newly formed 1st Cavalry Division at Fort Knox, which was planned to be reformed into a mechanised unit. Returning to Washington, D.C. and the War Department in 1934, Chaffee has served as the Chief of the Budget and Legislative Planning Branch and has reached the rank of Brigadier General in late 1935.\n§YImportant Notes:§L- While held in very high regard by the Cavalry, the General Army staff disagrees with his unproven battle doctrines."

 USA_omar_nelson_bradley: "Омар Нельсон Брэдли"
 #USA_omar_nelson_bradley_commander_desc: "Общее описание: §L 12 февраля 1893 года, Кларк, Миссури, Соединенные Штаты Америки §Y Военная карьера: §L Омар Нельсон"Brad\" Bradley signed up to join the United States Military Academy in 1911, where he finished second in the placements for the appointments. However, the winner couldn't accept the congressional appointment for the academy, so it was granted to Bradley. He graduated in 1915 and was commissioned as an infantry second lieutenant, and becoming a close friend of another graduate of the same class, Dwight D. Eisenhower. He was assigned to the 14th Infantry Regiment stationed in the Mexican border, reaching the rank of Captain in 1917 and being transferred to guard the copper mines in Butte, Montana, remaining in garrison duties for the rest of the decade. From 1920 to 1924, he worked as a math teacher in West Point, reaching the rank of Major in 1924 and undergoing the advanced infantry course at Fort Benning. Bradley later studied at the U.S. Army Command and General Staff School, graduating in 1929 and serving as an instructor in tactics at the U.S. Army Infantry School, where he met and established good relations with Lt.Col. George Marshall. He taught in West Point from 1929 to 1934, where he took a break to study at the U.S. Army War College, reaching the rank of lieutenant colonel. With the fears that the War Plan White might be executed in the near future, Bradley was promoted to Brigadier General along with Eisenhower by MacArthur's own request.\n§YImportant Notes:§L- Largely considered one of the most dependable generals of the US Army, Marshall once described him as \"A quiet, unassuming and capable man, with sound common sense. He has an absolute dependability. Give him a job and forget it\" and that reputation may have helped to speed up his promotion."

 USA_daniel_van_voorhis: "Дэниел Ван Вориш"
 #USA_daniel_van_voorhis_commander_desc: "§Y General Описание: §L 24 октября 1878 в Зансвилле, штат Огайо, Соединенные Штаты Америки. §L Daniel Van Vorhis начал свою военную карьеру, когда он покинул Вашингтонский и Джефферсонский колледж, чтобы принять участие в испано-американской войне в качестве капрала. Он служил в 10-м пехотном полке Пенсильвании и достиг звания капитана к концу войны. В 1924 году после испано-американской войны ван Ворис принял в качестве второго лейтенанта в регулярной армии и служил на Филиппинах с 1900 по 1914 год. В 1930 году он был переведен в Техас во время экспедиции Першинга во время первой экспериментальной механизированной операции и оставался в Техасе в качестве командира 16-го кавалерийского полка. В 1924 году он был назначен в качестве исполнительного офицера во главе с Кавалером Кавалером, а в 1929 году он закончил военную службу в Военном колледже в качестве подполковника. в 1930 году в ВанВорисе был назначен для командования вооруженных сил армии первой экспериментальной меха, получивого генерал-ба. В 1924 году он получил опыт от своего американского отделения, который был создан для осуществления нового военного задания, он был созданного военного трибунала, а также был создан для государственного государственного государственного государственного гера."

 USA_john_clifford_hodges_lee: "Джон Клиффорд Ходжес Ли"
 #USA_john_clifford_hodges_lee_commander_desc: "Общее описание §YBorn: §L 1 августа 1887 года в Джанкшн-Сити, Канзас, Соединенные Штаты Америки §Y Военная карьера: §L Джон Клиффорд Ходжес \"Jesus Christ Himself\" Lee began his military career when he received an appointment to the United States Military Academy without having to take entrance examinations for his excellent high school performance and graduated in 1909 with the 12th highest grade of his class, surpassing Devers who was 39th and Patton who was 46th. For his outstanding performance, he was commissioned as a second lieutenant for the corps of engineers. After serving in several garrison posts, Lee was promoted to first lieutenant in 1912 and became an instructor for the Ohio National Guard. He'd choose to be sent to the Mexican border in late 1912 due to concerns that the Mexican Revolution might spill into American Borders. He conducted a series of topographical surveys in the American Pacific possessions, specifically Guam and Luzon in the Philippines, for which he was promoted to Captain in 1916. He was promoted to Major in 1920 and became Assistant Chief of Staff of the new Chicago-based VI Corps Area. He was posted as the District Engineer of Vicksburg, Mississippi when the Great Mississippi Flood of 1927 happened, with Lee directing relief work and evacuations of towns and districts. After the passing of the Flood Control Act of 1928, Lee supervised works on the Red River, Ouachita River and Yazoo River and personally directed the construction of a new HQ and of the Waterways Experiment Station. After that, Lee attended the Army War College from September 1931 to June 1932 and became Assistant Commandant of the Army Industrial College, reaching the rank of lieutenant colonel in 1934. Since then he has been the District Engineer of the Washington District and with the recent promotions, Lee earned his rank of Brigadier General, where his engineering skills may become vital for the staff."

 USA_james_garesche_ord: "Джеймс Гареше Орд"
 # USA_james_garesche_ord_commander_desc: "§L 18 октября 1886 года, в Дуранго, Колорадо, Соединенные Штаты Америки §Y Военная карьера: §L James Garesche \"Sunny\" Ord began his military career when he graduated from West Point as an Infantry second lieutenant in 1909. He'd be assigned to the 30th Infantry regiment and would be active in the Mexican border during Pershing's Punitive Expedition, earning the rank of first lieutenant. After the Expedition was over, he was assigned as Professor of Military Science at the Culver Military Academy. He remained in this post until 1921, where he entered the Command and General Staff College, graduating in 1924 as a Major and remaining in the school as an instructor for a year before joining the Army War College in 1926, of which he graduated in 1929 as a lieutenant colonel. James served on the Supply and Logistics staff of the War Department from 1930 to 1934, and has been since then the Director of the Infantry Board, being very recently promoted to Brigadier General amongst fears of desertions within the staff."

 USA_edwin_forrest_harding: "Эдвин Форрест Хардинг"
 #USA_edwin_forrest_harding_commander_desc: "18 сентября 1886 года во Франклине, Огайо, Соединенные Штаты Америки. §L Эдвин Форрест Хардинг начал свою военную карьеру, когда в 1906 году он был зачислен в Уэст-Пойнт, а в 1909 году окончил школу вместе с Джорджем С. Паттоном, Джейкобом Л. Деверсом, Джоном К.Х. Ли и Уильямом Симпсоном. Он был главным образом назначен на гарнизонные должности до тех пор, пока он не был назначен в Вест-Пойнт в качестве учителя, сначала в 1919-1921 годах в качестве преподавателя современного языка, затем в качестве преподавателя экономики с 1921 года по июнь 1923 года, а затем в качестве помощника профессора истории с июня 1923 года по август того же года, когда он был назначен на должность руководителя 15-го пехотного режима в Тяньджине."Infantry in Battle\", which has been the first breakthrough of Infantry tactics of the United States Army since the studies of German Armies in the Weltkrieg. He was promoted to Colonel afterwards and has reached the rank of Brigadier General in late 1935, amidst fears of desertion amongst the general staff."

 USA_william_frederick_halsey_jr: "Уильям Фредерик Хэлси младший."
 #USA_william_frederick_halsey_jr_admiral_desc: "§L 30 октября 1882 года в Элизабет, Нью-Джерси, Соединенные Штаты Америки"Bull\" Halsey Jr., the son of a naval captain, attended the United States Naval Academy at Annapolis and graduated in 1904. Following graduation he spent his early service years in battleships, and sailed with the main battle fleet aboard the battleship USS Kansas as Roosevelt's Great White Fleet circumnavigated the globe from 1907 to 1909. During the Weltkrieg he was commanding destroyer patrol forces in the Atlantic with the goal to protect the U.S. from a possible sudden attack of the German fleet. After the war he served as a naval attaché in Germany, Norway, Denmark and Sweden. In 1934 the chief of the Bureau of Aeronautics offered Halsey command of the aircraft carrier USS Constellation, subject to completion of the course of an air observer. Halsey elected to enrol as a cadet for the full 12-week Naval Aviator course rather than the simpler Naval Aviation Observer program and earned his Naval Aviator's Wings on May 15, 1935. With rising tensions in the United States and the resignation of some of the oldest admirals, he was promoted to rear admiral in early 1936. Despite the old naval tactics of the U.S Navy, Halsey wants to explore the possibility of using an aircraft carrier as the main offensive force of the fleet.\n§YImportant Notes:§L- After a short period of working with General MacArthur in the early 1930s he claims to \"have a respect for him\"."

 USA_raymond_ames_spruance: "Реймонд Эймс Струэнс"
 #USA_raymond_ames_spruance_admiral_desc: "§L 3 июля 1886 года в Балтиморе, Мэриленд, Соединенные Штаты Америки §Y Военная карьера: §L Raymond Ames \"Electric Brain\" Spruance went on to graduate from the U.S. Naval Academy in 1906, and received further, hands-on education in electrical engineering a few years later. Spruance's first duty assignment was aboard the battleship USS Iowa, an 11,400 ton veteran of the Spanish–American War. In July 1907 he transferred to the battleship Minnesota and was aboard her during the historic around the world cruise of the Great White Fleet from 1907 to 1909. In 1916 he aided in the fitting out of the battleship Pennsylvania and he served aboard her from her commissioning in June 1916 until November 1917. In 1918 he was assigned as Assistant Engineer Officer of the New York Naval Shipyard, before he was ordered to Bath Iron Works for duty in connection with fitting out of destroyer USS Aaron Ward in March 1920. He commanded that vessel during the patrols with the Atlantic Fleet until May 1922, when he was ordered for duty in the Bureau of Engineering. While in that capacity he assumed additional duty as a member of the board on doctrine of aircraft in connection with fleet fire control. He began attendance at the Naval War College in 1926, and graduated in 1927. Spruance served as executive officer of the USS Mississippi from October 1929 to June 1931. He also held several engineering, intelligence, staff and Naval War College positions up to the 1934. He commanded the battleship USS Mississippi from April 1934 to recent times, when he was promoted to rear admiral.\n§YImportant Notes:§L- His division of ships was connected with USS Constellation and he had good relations with her commander William Halsey Jr."

 USA_frank_jack_fletcher: "Фрэнк Джек Флетчер"
 #USA_frank_jack_fletcher_admiral_desc: "§L 29 апреля 1885 года в Маршаллтауне, Айова, Соединенные Штаты Америки"Black Jack\" Fletcher, the nephew of Admiral Frank Friday Fletcher, appointed to the US Naval Academy from his native state of Iowa in 1902 and graduated from Annapolis in 1906, served two years at sea, then required by law, and commissioned as an Ensign in 1908. In 1909, he was assigned to the destroyer Chauncey, operating as part of the Asiatic Torpedo Flotilla. Fletcher assumed command of the destroyer Dale in 1910, and in 1912, he returned to Chauncey as her commanding officer. Later this year, he was transferred to the battleship Florida, the flagship of his uncle Frank Friday Fletcher. In April 1914, he was aboard that battleship during the occupation of Veracruz. He was awarded the Medal of Honor for the rescue of refugees on the transport Esperanza. Detached from Florida in July 1914, he served briefly in Tennessee before reporting as an Aide and Flag Lieutenant on the staff of the Commander in Chief, Atlantic Fleet in July 1914. After a year at this post, he returned to the Naval Academy for duty in the Executive Department. Upon the outbreak of the Weltkrieg he served as gunnery officer of Kearsarge until September 1917, after which he commanded of destroyers to 1919 when he returned to Washington. He was head of the Detail Section, Enlisted Personnel Division in the Bureau of Navigation until September 1922. From 1923 to 1925 Fletcher commanded various ships in the Asiatic Squadron. Returning to the United States, he served at the Washington Navy Yards from 1925 to 1927; became executive officer of the battleship Colorado; and completed the Senior Course at the Naval War College, followed immediately by the Army War College, in preparation for strategic leadership responsibilities. Fletcher became Chief of Staff to the Commander in Chief of the Asiatic Fleet in 1931. In the summer of 1933, he was transferred to the Office of the Chief of Naval Operations. Following this assignment he served, from November 1933 to 1935, as aide to the Secretary of the Navy. He assumed command of the battleship USS Colorado, flagship of Battle Division Six, in June 1935 and was promoted to Flag Rank in the mid 1936."

 USA_thomas_cassin_kinkaid: "Томас Кассин Кинкейд"
 #USA_thomas_cassin_kinkaid_admiral_desc: "В июне 1908 года §L 3 апреля 1888 в Ганновере, Нью-Гэмпшире, Соединенные Штаты Америки#n §Y Военная карьера: §L Tomas Cassin Kinkaid, второй ребенок военно-морского офицера Томаса Райта Кинкаидайда, окончил Военно-морскую академию США, в июне 1908 года. Его ранняя заказная служба была проведена на боевых кораблях Небраска и Миннесота. В 1913 году он начал обучение по снарядам и служил в этой области в течение следующих нескольких лет. В 1917-18 годах лейтенант Кинкайд был офицером военно-морского корабля Пенсильвания, а позднее в 1918 году стал офицером Ганнери из Аризоны США. Он оставался на этом судне до середины 1919 года, когда он был направлен в Бюро Ордена в Вашингтоне, округ Колумбия. Затем лейтенант Кинкайд был назначен начальником военно-морского комитета в 1929 году, а в 1929 году был назначен начальником Военно-морского комитета."

 USA_charles_maynard_cooke_jr: "Чарльз Мэйнард Кук младший."
 #USA_charles_maynard_cooke_jr_admiral_desc: "§L 19 декабря 1886 года в Форт-Смите, Арканзас, Соединенные Штаты Америки"Savvy\" Cooke Jr. after receiving a degree from the University of Arkansas in 1906 entered the United States Naval Academy, graduating second in the Class of 1910. Between then and 1913 Cooke served in the battleships USS Connecticut, USS Maine, and USS Alabama. He then received submarine instruction and took command of the submarine USS E-2. From 1916 to 1918, he was assigned to shipyard inspection duty at Quincy, Massachusetts. Promoted to lieutenant in 1917 he supervised the outfitting of the submarine USS R-2 and became her commanding officer when she was commissioned. In 1919 and 1920, Lieutenant Commander Cooke repeated the process for the larger submarine USS S-5, distinguishing himself when she accidentally sank on 1 September 1920 by saving the lives of 37 men trapped in her wreck. During the remainder of the 1920s, he was executive officer of the submarine tender USS Rainbow, had shore duty at the Cavite and Mare Island Navy Yards, was gunnery officer of the battleship USS Idaho and served at the United States Department of the Navy in Washington, D.C. From 1931 to 1933, Cooke commanded a submarine division, attended the Naval War College Senior Course, was Commandant of the Guantanamo Bay Naval Base, had further Navy Department duty and was war plans and logistics officer with the United States Fleet staff. With outbreak of the Civil War and defection of admirals he was promoted to the rank of rear admiral."

 USA_alfred_melville_pride: "Альфред Мелвилл Прайд"
 #USA_alfred_melville_pride_admiral_desc: "10 сентября 1897 года в Сомервиле, Массачусетс, Соединенные Штаты Америки. §L Альфред Мелвилл Прайд изучал инженерное дело в Университете Тафтса в Медфорде, штат Массачусетс, в течение нескольких лет, прежде чем уволиться на службу в военно-морские силы во время Велткрига. Он был первым помощником механиста в военно-морском заповеднике, но вскоре получил возможность получить полетную подготовку и получить комиссию. В начале 1930-х годов, присоединившись к Регулярному военно-морскому флоту, Прайд принял участие в экспериментах по разработке авианосцев в США. В 1931 году он был первым человеком, совершившим посадку на авианосце. 1934—1936 годах он возглавлял Секцией воздушных испытаний в военно-морской станции Anacostellation в качестве члена оригинальных экипажей. В начале 1930-х годов он начал изучать аэронавигационную инженерию в Массачусетском технологическом институте."

 USA_daniel_edward_barbey: "Дэниел Эдвард Барби"
 #USA_daniel_edward_barbey_admiral_desc: "§L 23 декабря 1889 года в Портленде, штат Орегон, Соединенные Штаты Америки"Uncle Dan\" Barbey graduated from the Naval Academy and was commissioned an ensign in June 1912. His first assignment was aboard the armoured cruiser USS California, which participated in the 1912 United States occupation of Nicaragua. In May 1914 he was transferred to the destroyer USS Lawrence as engineering officer, participating in the United States occupation of Veracruz and received a Letter of Commendation from the Secretary of the Navy for the ship's service during the Mexican Revolution. Until 1922 Barbey served on different destroyers of U.S Navy before becoming assistant engineering officer of the battleship USS Oklahoma in the Pacific. Continuing the pattern of alternating duty afloat and ashore, he then spent two years as Officer in Charge of the Portland Navy Recruiting Station, before returning to the Atlantic as engineering officer of the light cruiser USS Cincinnati in June 1925. From February 1927 to June 1928, he was executive officer of the oil tanker USS Ramapo. He then spent the next three years as aide to the Superintendent of the U.S. Naval Academy. From June 1931 to June 1933 he commanded the destroyer USS Lea. He then spent two years as an inspector of ordnance at the Mare Island Naval Ammunition Depot in California, where he was promoted to the rank of commander in September 1933. In February 1935, he was posted to the battleship USS New York as damage control officer. With outbreak of the Civil War he was temporarily promoted to the rank of rear admiral."

 USA_kenneth_george_althaus: "Кеннет Джордж Альтаус"
 USA_carl_andrew_spaatz: "Карл Эндрю Спаатц"
 USA_ira_clarence_eaker: "Ира Кларенс Икер"
 USA_hoyt_sanford_vandenberg: "Хойт Сэнфорд Ванденберг"
 USA_elwood_richard_quesada: "Элвуд Ричард Кесада"

 # USA_oscar_griswold_commander_desc: "§L 22 октября 1886 года в Руби-Вэлли, Невада, Соединенные Штаты Америки#n §Y Военная карьера: §L Оскар Вулвертон Грисвольд учился в Невадском университете в Рено, когда получил назначение в Военную академию Соединенных Штатов, где в 1910 году окончил пехотный второй лейтенант, до перевода в Китай в 1914 году, где он оставался до 1921 года. В этом году он был переведен в майорскую военную академию Соединенных Штатов и был направлен в Военно-штабной колледж Командования и Генерального штаба и Военный колледж США, окончил соответственно в 1925 и 1929 годах."

 TEX_charles_lindbergh: "Чарльз Аугустус Линдберг"
 # TEX_charles_lindbergh_leader_desc: "Чарлз Линдберг, или Линди, когда-то был самым известным пилотом в Америке. Знаменитость Линдберга росла в 1920-е годы, работая в Службе авиаперевозок США. Это в сочетании с талантом к совершенствованию самолетов, которые в конечном итоге превратились в бизнес, который сделал Линдберг еще более известным. Связь Линдберга с АФП началась в 1932 году и усилилась до тех пор, пока он не вступил в контакт с Комитетом по военному управлению. В конечном итоге, выбранный из состава Комитета, Линдберг намерен сохранить расистские позиции Мосли и поощрять промышленные инновации с помощью примера."

 TEX_william_dudley_pelley: "Уильям Дадли Пелли"
 #TEX_william_dudley_pelley_leader_desc: "В возрасте 39 лет Уильям Пеллей был довольно неимагентным голливудским сценаристом и журналистом. Его прошлые приключения в основном состояли из посещения России и поглощения антисемитских брошюр. К моменту своего основания Серебряного Легиона в 1933 году Пеллей превратился в вокального англо-саксонского суперремациста и воинствующего спиритиста. Спиритизм Пеллея был предназначен только для доверенных союзников. После того как его организация была спонсирована Хьюем Лонгом, он встретился и разработал линию Пеллей-Армстронг с Гербертом У. Армстронгом, коллегой Англо-Саксонским супремакистом. Конвинг, антисоциализм и вера в христианскую идентичность составляют основу его режима."

 TEX_gerald_lyman_kenneth_smith: "Джеральд Лайман Кеннет Смит"
 #TEX_gerald_lyman_kenneth_smith_leader_desc: "В 1937 году Джеральд Смит присоединился к «Серебряному Легиону» (Silver Legion). В 1937 году, когда он был в евангелическом округе, Смит, будучи назначен министром в начале своей жизни, впервые оказался под влиянием общества Share Houy Long Share Our Government. Смит был доставлен под крыло Уильяма Пеллея, когда Pelley продемонстрировал свою поддержку. Важным поворотным моментом в карьере стал тот момент, когда общество Share Our Goverty назначило его заменить Хьюи Лонга после разгрома. Смит затем служил под руководством Pelley в качестве куратора, чтобы остановить частые общественные волнения вождя."

 TEX_united_states_congress: "Союзный конгресс"

 TEX_charles_edward_coughlin: "Чарльз Эдвард Кофлин"
 #TEX_charles_edward_coughlin_desc: "Шарль Кофлин родился в Онтарио в покорной католической семье. После многих лет подготовки к тому, чтобы служить священником для собрания Святого Базиля, изменения в Святом Ордене побудили его эмигрировать в Америку. Кафлин был назначен в храм церкви Маленьких Цветков в Мичигане. Там Кафлин стал политически активным, нападая на Ку Клукс Клан, профсоюзы, социалистов, религиозные меньшинства и запретителей. Хьюи Лонг, видя потенциального стимулятора для католических избирателей, нанял Кафлина для оказания помощи в проведении президентской кампании."
 TEX_herbert_walter_armstrong: "Герберт Уолтер Армстронг"
 #TEX_herbert_walter_armstrong_desc: "Герберт У. Армстронг начал свое служение в церкви Бога (Седьмой день), служа собранию на северо-западе. Армстронг был популярен на радио, собирая достаточно новообращенных, чтобы начать свою собственную церковь, Всемирную радио Церковь Бога. Политика Армстронга включает в себя тектолизм, приближающийся христианский апокалипсис, британский израильской подход, антигерманскую риторику и сегрегацию."
 TEX_henry_ford: "Генри Форд"
 #TEX_henry_ford_desc: "Генри Форд является известным основателем компании Ford Motor Company. Форд успешно ввел научное управление на своих многочисленных фабриках по всей Америке. Противодействие движению рабочей силы, антисемитизму и возможности борьбы с Германией побудил Генри Форда заключить союз с Huy Long. Однако их разногласия остаются, и Форд не намерен ничего платить."Share Our Wealth\"."
 TEX_archibald_bulloch_roosevelt: "Арчибальд Буллок Рузвельт"
 #TEX_archibald_bulloch_roosevelt_desc: "Репутация Рузвельта позволила ему стать исполнительным руководителем компании Sinclair Oil и подружиться с политическими консервантами. Рузвельт основал Лигу национальной экономики, лоббистскую группу, сотрудничающую с Хьюи Лонгом в 1936 году."
 TEX_fred_chase_koch: "Фред Чейз Кох"
 # TEX_fred_chase_koch_desc: "Фред Кох имеет глубокие связи с нефтяной промышленностью Техаса как главный инженер нескольких многонациональных нефтяных корпораций. Коху заплатили за строительство нефтяных буров для Союза Британии, где он стал гальванизирован против синдикализма. Антисиндикализм Коха привел его к союзничеству с Хьюи Лонгом, под предлогом, что он не будет платить за благополучие."
 TEX_hugo_lafayette_black: "Хьюго Лафайетт Блэк"
 # TEX_hugo_lafayette_black_desc: "Карьера Хьюго Блэка в области права была чревата разногласиями, он получил пожизненное членство в Ку Клукс Клане во время службы в Алабаме. Его последующий успех в избирательной политике был сглажен этим членством, несмотря на его собственные возражения против сегрегации. Чёрный публично осудил Клана, когда его спросили, означает ли его одобрение Хьюи Лонг, что ККей тоже поддерживал его."
 TEX_francis_everett_townsend: "Фрэнсис Эверетт Таунсенд"
 # TEX_francis_everett_townsend_desc: "Фрэнсис Таунсенд - неутомимый крестоносец системы социального обеспечения. В Калифорнии сотни тысяч людей присоединились к его плану пенсионного обеспечения по старости, который он не смог обеспечить государством."Share Our Wealth\" plan, whose provisions are similar."
 TEX_elizabeth_eloise_kirkpatrick_dilling: "Элизабет Элоиз Киркпатрик Диллинг"
 # TEX_elizabeth_eloise_kirkpatrick_dilling_desc: "Элизабет Диллинг начала свою политическую карьеру, посетив Великобританию и Францию. Диллинг была глубоко встревожена странами и посвятила свою карьеру поощрению войны между США и третьей международной организацией."
 TEX_george_samuel_schuyler: "Джордж Самуэль Шуйлер"
 # TEX_george_samuel_schuyler_desc: "После того, как Джордж Шуайлер был изгнан из революционного военного героя Филипа Шуйлера, он ненадолго присоединился к военным, чтобы подражать его предкам. После того, как он стал афроамериканцем, Шуйлер стал автором, его романы известны своими укусными критикой политики, особенно южных демократов и черных националистов. Эти книги сделали Шуйлера врагом коллективистов и федералистов."
 TEX_george_william_christians: "Джордж Уильям Кристиан"
 #TEX_george_william_christians_desc: "Джордж Уильям Кристиан - инженер-механик и лидер ополчения в Теннесси. В 1936 году его ополчение проголосовало за вступление в ряды Минимен."
 TEX_guy_warren_ballard: "Парень Уоррен Баллард"
 #TEX_guy_warren_ballard_desc: "Гай Уоррен Баллард начал заниматься добычей полезных ископаемых, продавая фьючерсы на пустых золотых рудниках."I AM\" Activity. The I AM Activity believes Guy is a reincarnation of George Washington, and that he has access to unlimited wealth to save the country."
 TEX_wilbur_glenn_voliva: "Уилбур Гленн Волива"
 #TEX_wilbur_glenn_voliva_desc: "Уилбур Гленн Волива был акклитом чикагского проповедника Джона Александра Доуи, который основал утопический город Сион, штат Иллинойс."
 TEX_george_sylvester_viereck: "Джордж Сильвестр Вирек"
 # TEX_george_sylvester_viereck_desc: "Джордж Вирек родился в Мюнхене, Германия, и является незаконным внуком принца Августа Пруссии. Вирек эмигрировал в Америку и стал спорным поэтом. Его работа в качестве альтернативы изучала темы гомосексуализма и немецкого национализма. Беседы с немецкими королями Европы после Вельткрига сделали его влиятельным в немецкой лоялистской общине в Америке."

 TEX_george_smith_patton: "Джордж Смит Паттон младший."
 # TEX_george_smith_patton_TEX_commander_desc: "В 1903 году он был номинирован на Вест-Пойнт, и, хотя он отлично справлялся с тренировками в Вест-Пентлоне, его академическая деятельность была настолько плоха, что он был вынужден повторить свой первый год. Несмотря на все неудачи, он остался вторым лейтенантом своей армии в 1909 году и был назначен в 15-й Кавалерийской армии. В 1912 году его спортивные навыки сделали его выбор в качестве представителя Соединенных Штатов для первого современного Pentathlon на Олимпийских играх в Стокгольме. Его академическая деятельность была настолько плоха, что он был вынужден повторить свой первый год. Несмотря на все его неудачи, он оставил его в качестве второго лейтенанта в 1909 году и был назначен в 15-й Кавалерской армии. В 1912 году его спортивные способности стали почти постоянным членом его штаба и он был повышен до капитана. В 1923 году он был назначен в мишеньском колледже. В 1923 году, после того, как он начал экспедиторскую экспедицию, он начал свою деятельность в 1919-1990 году, и начал свою деятельность по поддержанию мира."
 # TEX_george_smith_patton_commander_desc: "11 ноября 1885 года в Сан-Гаврииле, штат Калифорния, Соединенные Штаты Америки. §L George Smith Patton Jr., фанат книг военной истории с раннего возраста, вступил в Военный институт Вирджинии в 1903 году. В 1903 году его второй год он был номинирован на Вест-Пойнт, и, несмотря на то, что он отлично справлялся с процедурами учений в Вест-Пентафлоне, его академическая деятельность была настолько плоха, что он был вынужден повторить свой первый год. Несмотря на все неудачи, он закончил кавалерский второй лейтенант в 1909 году и был направлен в 15-й Кавалерийский полк. В 1912 году его спортивные навыки сделали его выбор в пользу армии Соединенных Штатов для первого современного Pentathlon на Олимпийских играх Стокгольма, который занял пятое место из сорока двух участников. С началом хитральной экспедиции, в 1909 году Паттон был назначен дивизионт Перш-де-Камп, однако эти связи между ним и Паттоном стали почти постоянным членом его штаба и он был повышен капитаном. В 1923 году был назначен майором падским колледжем в 19 сентября 2013 года, в ."

 TEX_fox_conner: "Fox Conner"
 # TEX_fox_conner_commander_desc: "В 1899 году он был отправлен на Кубу, где служил с оккупационными силами после испано-американской войны и встретился со своей будущей женой, Вирджинией Брандрет. Он достиг ранга капитана в 1901 году, после чего он был переведен в 123-ю разведывательную компанию в Форт-Гамильтоне, Нью-Йорк. Он был на своем посту до 1905 года и Военного колледжа в 1907 году. Он был отправлен за границу в качестве военного атташе, где он был назначен на 22-ю разведку, после чего он был переведен на 22-ю разведывательную станцию."

 TEX_jacob_loucks_devers: "Джейкоб Локс Дезерс"
 # TEX_jacob_loucks_devers_leader_desc: "В мае 1919 года Деверс был отправлен на трехмесячное временное задание для изучения Велкилла в Европу. 1 апреля 1916 года его повысили до первого лейтенанта и перевели в новый активированный 9-й полевый артиллерийский лейтенант на Гавайских барах и повысили до капитана в начале 1917 года."

 TEX_joseph_lawton_collins: "Джозеф Лоутон Коллинз"
 # TEX_joseph_lawton_collins_commander_desc: "1 мая 1896 года в Новом Орлеане, Луизиана, Соединенные Штаты Америки. §L Джозеф Лотон 'Лайтинг Джо' Коллинс начал свою военную карьеру в 1913 году, когда он вступил в Вест-Пойнт благодаря альтернативному назначению его дяди Мартина Бермана, мэра Нового Орлеана, в то время, смог забрать его в возрасте 17 лет и окончил пехотный второй лейтенант в 1917 году. Он прошёл и успешно завершил продвинутый курс в Вест-Пойнте и женился на Глэдис Истербрук в своё время в академии. В 1921 году он начал преподавать химию в Вест-Пойнт, а в 1926 году он закончил курс подготовки офицера компании в Пехотной школе Форт-Силл. Год спустя он прошел и успешно закончил курс повышения в пехотной пехотной пехотиной пехотиной в 1937-1934 годах."

 TEX_courtney_hicks_hodges: "Кортни Хикс Ходжес"
 # TEX_courtney_hicks_hodges_commander_desc: "В 1904 году он вступил в военную карьеру в Уэст-Пойнте, но был вынужден бросить ее из-за крайне низкого академического уровня. В 1906 году он вступил в ряды вооруженных сил в качестве частного лица, где в 1907 году он быстро поднялся до звания сержанта и получил должность второго лейтенанта в 1909 году. В 1909 году он вступил в Першинг во время карантинной экспедиции, где он встретился с Джорджем С. Паттоном и Джорджом Маршаллом и оставался на мексиканской границе в конце 1910-х годов, в то время как несколько небольших скирмишерских групп с 6-м пехотным полком быстро поднялись до звания старшего лейтенанта. После того, как он был назначен генералом-майором на службу на границе, он посетил командный и генеральный штабный колледж в 1925 году и стал членом Пехотного совета в Форт-Беннинге. В 1934 году окончил военный колледж, заручив его продвижение по службе в качестве одного из своих бывших друзей, который был вынужден отбираться на должность в полковника."

 TEX_william_hood_simpson: "Уильям Худ Симпсон"
 # TEX_william_hood_simpson_commander_desc: "В июне 1905 года, через месяц после достижения 17-летнего возраста, он поступил в Военную академию Соединенных Штатов в Вест-Пойнте и закончил ее через четыре года в июне 1909 года, был назначен в качестве второго лейтенанта в Пехотный отдел. Первое назначение Симпсона было в 6-м пехотном полке в Форт-Линкольне, Северная Дакота. Вскоре после этого полк был отправлен за границу в Минданао, Филиппины, в январе 1910 года и оставался там еще на протяжении двух с половиной лет, где Симпсон участвовал в подавлении Моро Ребеллиона. Он вернулся в Соединенные Штаты со своим полком в 1912 году и, будучи в Форт-Блиссе, стал командиром своей компании до тех пор, пока он не стал первым лейтенантом, сражался в штабе Першинга в 1916 году. В феврале 1917 года он стал помощником Генерального майора Белла и до тех пор, пока в 1919-ом округе не был назначен генерал-контрой."

 TEX_claire_lee_chennault: "Клэр Ли Ченно"
 # TEX_claire_lee_chennault_commander_desc: "В 1931 году он стал начальником отдела по подготовке кадров в Тактической школе авиакомпании «Армия Армия» и взял на себя ответственность за работу в 1й пуритской группе Алабамы в Аэробатике, став региональным славным звёздным крылом своих воздушных подвигов. В 1931 году он стал начальником отдела по подготовке кадров в Тактической школе авиакомпании «Аэробака» и взял на себя ответственность за работу в 1й пуритской группе Алабамы, которая вскоре после этого была переведена в Авиационную дивизию Армейского корпуса. В 1919 году он получил свои крылья и оставался на службе после того, как авиакомпания была переведена в Воздушный корпус. В 1931 году он стал начальником отдела по подготовке кадров в Тактической школе авиакомпании авиакомпании «Армияс»."

 TEX_walton_harris_walker: "Уолтон Харрис Уолкер"
 # TEX_walton_harris_walker_commander_desc: "§L Walton Harris Walker начал свою военную карьеру, когда он вступил в Вирджинский военный институт в 1907 году и поступил в Военную академию Соединенных Штатов Америки в 1908 году, окончил в 1912 году в качестве второго лейтенанта пехоты. После 1912 года Уокер работал инструктором в Форт-Беннинге, Грузия, и прошел дополнительную тактическую подготовку со стороны армии, посещая школу командования и генерального штаба в 1925 году и заканчивая в 1926 году в качестве вице-полковника."

 TEX_matthew_bunker_ridgway: "Мэтью Банкер Риджвей"
 # TEX_matthew_bunker_ridgway_commander_desc: "3 марта 1895 года в Форт-Монро, штат Вирджиния, Соединенные Штаты Америки. В 1913 году, когда он успешно сдал вступительный экзамен в Вест-Пойнт, он закончил академию в 1917 году в качестве второго лейтенанта пехоты. Риджвей был впервые назначен для патрулирования на мексиканской границе с 3-м пехотным полком, где он когда-либо достиг звания капитана и возвратился в Вест-Пойнт в 1920 году в качестве преподавателя испанского языка. В 1925 году Ридгвей закончил Пехотную школу армии Соединенных Штатов, после чего был отправлен в Американскую легатину в Тяньцзине и позднее отправлен в Никарагуа, где он был одним из лучших американских военнослужащих, пытавшихся контролировать выборы 1927 года. В 1930 году он был переведен на Филиппины, где он стал советником генерального губернатора островов и вернулся в Америку в 1933 году. Он закончил американскую школу в Тяньцзине, где он был одним из лучших американских спецнамистоков, где он был избран в 1932 году, и был избран в Вой армии."

 TEX_bruce_cooper_clarke: "Брюс Купер Кларк"
 # TEX_bruce_cooper_clarke_commander_desc: "§L 29 апреля 1901 года в Адамсе, Нью-Йорке, Соединенных Штатах Америки. §L Брюс Купер Кларк вступил в Национальную гвардию в 1918 году, где получил назначение в Военную академию Соединенных Штатов в 1920 году. Он окончил Вест-Пойнт в 1925 году как второй лейтенант инженерного корпуса, и в том же году он получил степень бакалавра права и гражданского инженера, работая главным образом на должностях полковника до 1935 года. Он стал одним из доверенных офицеров Паттона после крупных расколов в Американской армии, и когда Паттон вступил в штат Американского Союза, Кларк решил последовать за ним, и за свою верность он получил звание бригадного генерала Паттона."

 TEX_henry_irving_hodes: "Генри Ирвинг Ходс"
 # TEX_henry_irving_hodes_commander_desc: "§L 19 марта 1899 года в Вашингтоне, округ Колумбия, Соединенные Штаты Америки. §L Генри Ирвинг Ходс начал свою военную карьеру, когда поступил в военную академию Соединенных Штатов, где в 1920 году закончил кавалерией второго лейтенанта. После выполнения ряда служебных обязанностей, главным образом в Вайоминге и Техасе, он стал решительно выступать за механизацию американской армии вместе с Паттоном, который из-за сокращения бюджета армии стал для них не более чем мечтой. Ас Паттон начал медленно уходить от штаба армии США, Ходс укрепил свои связи с «Старой Кровью и Гутсом», и когда Паттон, наконец, объявил, что он вступает в Союзное государство, Ходс сопровождал его и был повышен до бригадного генерала."

 TEX_clifton_bledsoe_cates: "Клифтон &quot; Бледсо &quot;"
 # TEX_clifton_bledsoe_cates_commander_desc: "В 1932 году, когда Кейтс, который в настоящее время является капитаном, был назначен командующим морским подразделением в Аризоне. В 1928 году он был переведен в 4-й морской режим в Сан-Диего, который был переведен для охраны Американской легии в Шанхае. Он вернулся в Америку до 1932 года, где он подписался на Промышленный колледж армии и курс для старшего офицера морского корпуса, выпускавшийся в 1935 году и достигший ранга подполковника. В 1936 году он вернулся в Шанхай, однако в 1936 году он был переведен в 4-й морской режим в Сан-Диего, который был переведен для охраны Американской легии в Шанхае."

 TEX_lewis_burwell_puller: "Льюис Бёрвелл Пуллер"
 # TEX_lewis_burwell_puller_commander_desc: "Общее описание §YBorn: §L 26 июня 1898 года, Вест-Пойнт, Вирджиния, Соединенные Штаты Америки §Y Военная карьера: §L Lis Burwell"Chesty" Puller decided to sign up in the army at an early age but was refused because he couldn't get parental consent to join. Until he became 21, he decided to study in the Virginia Military Institute, and after graduating in 1919, he attended the non-commissioned officer school and Officer Candidates School of the Marine Corps, earning the rank of second lieutenant. In 1921, he was assigned to the Gendarmerie d'Haiti and would see over forty skirmishes fighting the Caco rebels and becoming adjutant to Alexander Vandegrift. After four years of serving in garrison duty in the United States, he'd be assigned to the Marine detachment in the Nicaraguan National Guard in December 1928. In Nicaragua, he led several engagements against the Sandinista forces, where he was able to prevail despite being outnumbered significantly by the Nicaraguan rebels, and earning the Navy Cross medal. He returned to the United States in 1931, and completed the Company Officers Course at Fort Benning which he had left pending in 1928, graduating in June 1932 as a Captain and returning to Nicaragua in September. There, he took part in the Battle of El Sauce, where he earned his promotion to Major. He'd be then transferred to command the 'China Marines' in Shanghai in 1933 and would return to America in June 1936 to serve as an instructor at The Basic School. With the nation spiralling into Civil War, Puller was persuaded by Cates to join the American Civil War as Puller was indecisive as to who to support. With his arrival in Louisiana, Puller's actions in Nicaragua and Haiti had earned the respect of many members of the staff and Huey Long's cabinet, who pushed for his promotion to Brigadier General."

 TEX_pedro_del_valle: "Педро дель Валье"
 # TEX_pedro_del_valle_commander_desc: "В мае 1916 года он приземлился из штата Прайри и принял участие в захвате Санто-Доминго и последующей кампании в Республике Санто-Доминго. После завершения курса обучения в Школе офицеров морской пехоты, Норфолк, Вирджиния, он отправился на военную службу в морскую службу в первую морскую бригаду в Республике Гаити. В мае 1916 года он приземлился из штата Юрс-Прейри и участвовал в захвате Санто-Доминго-Сити и последующей кампании в Республике Санто-Доминго. После завершения курса обучения в Школе морской пехоты, Норфолк, штат Вирджиния, он отправился на военную службу в морскую разведку в Соединенный Техас, где служил в британском военно-морском корпусе под командованием Генерального секретаря. После второго боя Ютленда он был отделен от морской казны, Квантико, штат Вирджиния. После другой поездки в морскую хижину в этот район был направлен в гербскую штаб."

 TEX_samuel_murray_robinson: "Самуэль Мюррей Робинсон"
 # TEX_samuel_murray_robinson_admiral_desc: "13 июня 1882 года в Евангелии, Техас, Соединенные Штаты Америки. §L Samuel Murby 'Hobby' Roinbon вошел в Военно-морскую академию США в 1899 году. В 1903 году ВМС установили официальную программу для выпускников в Академии, и Робинсон был одним из 10 студентов, отобранных для первого класса Школы морской инженерии. Робинсон был зачислен в качестве первопроходца с электродвигателем в США. В 1907-1909 годах он объехал весь мир с Великим Белым Флотом на борту нового конструктора Вермонта. В 1909 году ВМС учредил официальную программу для выпускников в Академии, а Робинсон был одним из 10 студентов, отобранных для первого класса школы морской инженерии. Робинсон был зачислен в качестве первопроходца с электродвигателем в США. ВМС, начиная с своей поездки в качестве исполнительного офицера и главного инженера нового конструктора Вашингтона Юпитера, был назначен в Бюро инженеров в 1914-1919191919 годах, когда он работал в качестве офицера морского флота в 1927 году."

 TEX_david_worth_bagley: "Дэвид Ворт Бэгли"
 #TEX_david_worth_bagley_admiral_desc: "§Admiral Document ( Описание ): 8 января 1883 года в Рали, Северная Каролина, Соединенные Штаты Америки# Военная карьера : §L David Worth Bagley ушёл на прежний курс в Северную Каролину в 1898 и 1899 годах перед поступлением в Военно-морскую академию Соединенных Штатов в 1900 году. После окончания в 1904 году он отправился в море в Миссури, примыкающую к Североатлантическому флоту. в декабре 1905 года Пасс-Анджел-Агман Багли был переведен в Азиатский атэг , а затем отбыл в Конкорде , . . . . . . . . . . . . . , в 19 апреля . , , . . . . , в 19 апреля ."

 TEX_john_sidney_mccain_sr: "Джон Сидни МакКейн старший."
 #TEX_john_sidney_mccain_sr_admiral_desc: "§Admiral Protocloption\n §L 9 августа 1884 в округе Кэрролл, Миссисипи, Соединенные Штаты Америки#n §Y Военная карьера: §L John Sidney 'Slew' McCain, сын владельца плантаций, посещал Миссисипи в течение двух лет, где он присоединился к «Фи Дельта Тета Фратернти», а затем решил посетить военную академию Соединенных Штатов в Вест-Пойнте, где его брат Уильям Александр МакКейн был назначен в качестве первого агента в дальней дальней дальней дальней дальней дальней дальней дальней дальней площадке, он принял решение взять его в военно-морской академии Соединенных Штатов; когда он сдал эти экзамены и получил назначение, он решил присутствовать там. Вскоре после того, как он заработал свой комиссионер, МакКейн уплыл на борту Великого белого флота в 1907—1909 годах, а затем был направлен в американский диверсионный американский авиарейс."

 TEX_willis_augustus_lee_jr: "Виллис Августус Ли младший."
 # TEX_willis_augustus_lee_jr_admiral_desc: "§L 11 мая 1888 года в Натле, Кентукки, Соединенные Штаты Америки# §Y Военная карьера: §L Willis Augustus 'Ching' Le Jr. поступил в Военно-морской академии США в 1904 году. В 1904 году в Военно-морской академии его китайская фамилия, усугубляемая его любовью к Дальнему Востоку, получила ему прозвище "Ching" . После выпуска Ли присоединился к команде по винтовке в академии дважды. Он был назначен в USS Idaho до мая 1909 года, когда он вернулся в военно-морскую академию и вновь вернулся к ружью. С ноября 1909 года по май 1910 года Ли служил на борту US New Orleans, а затем переведен в US Sherena. После возвращения в Соединенные Штаты дивизионский дивизион, Ли вновь отправился в команду по стрельбе. В июле 1913 года Ли вновь вошёл в команду по винтовке и в апреле 1914 года был переведен в американскую армию для участия в оккупации Веракруса."

 TEX_jerauld_wright: "Джераулд Райт"
 # TEX_jerauld_wright_admiral_desc: "После выпуска лейтенанта Райта в 1917 году он присоединился к оружейному катеру USS Castine, который патрулировал Атлантику и конвоировал корабли во время Велкриага, после чего он служил инструктором на борту различных разрушителей ВМС США. В 1926 году Лт. Райт присоединился к US Maryland, классному крейсеру класса Колорадо, в качестве главного ассистента в отделе Gunnery. Он также продвинулся на ручной путь к обучению оружейной деятельности и снарядам во время работы инструктором в школе Ганнери на военно-морском флоте США. В 1926 году командир Райт присоединился к USS Norfolk, Augusta-cler, присоединенному к Scouting Fleat."

 TEX_arthur_leroy_bristol_jr: "Артур Лерой Бристоль-младший."
 #TEX_arthur_leroy_bristol_jr_admiral_desc: "После двух лет службы в Чарльтоне, Южная Каролина, Соединенные Штаты Америки. В 1908 году он получил от дивизии в 19. В 19.08 году, в 19.г., в 19.г., в 19.г., в 19.г., в 19.г., в 19.г., в 19.г. был назначен офицером военно-морского флота в Берлине, а в январе 1912 г. - полугодним морским атташе. В июне 1913 г. он вернулся домой, чтобы командовать новым уничтожителем Куммингсом. Год спустя, в 19.00 г., в 19.07 г., в 19.г. в 19.г., в 19.г. в 19.г., в 19.г., в 19.г., в 19.г., в 19.г., в 19.г."

 TEX_robert_elkington_wood: "Роберт Элкинтон Вуд"
