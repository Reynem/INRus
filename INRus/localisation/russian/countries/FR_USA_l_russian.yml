 #### Events ####

 US.1.d: "С момента своего создания отношения между Америкой и иностранной интервенцией были по меньшей мере обеспокоены и запутаны. Но за последние пару десятилетий мир настолько изменился, а отношения США с крупными державами мира были очень напряжены. С недавним распадом Партии Буллл-Муза в Республиканскую партию, было поставлено под сомнение наследие покойного Теодора Теддича Рузвельта. После того, как его основные политические оппоненты, Вудро Уилсон, были вынуждены покинуть президентский мир в 1912 году, после сердечного нападения президент США едва смог бы убеждать себя в том, что его новые силы должны были убеждать в том, что Рузвельт в своих силах, открывая новую и экспансионистскую философию американскому зейтгеисту. Не меньше всего на его радаре было назревание войны в Европе, которую он намеревался оставить в стране, выбрав из нее место, чтобы сосредоточить внимание на соседях. Это было невозможно до тех пор, пока мексиканские националистические силы Виктор Карранза не взяли власть в Мексике, он стал бы грозной силой. Недавняя оккупация Веракуса в Тамко-Афере, он собирал свою армию не для того, чтобы сража, и не была спала, и не была настила, и не была напустую войну, и не была напу, и не была напустую страну."
 US.2.d: "Наша армия крайне нуждается в реформе. Отсутствие четкого руководства и, как правило, слабое поддержание во время войны привели к тому, что наша нация получила несколько опрометчивую армию. Недавнее принятие винтовки «Педерсен» еще больше затруднило бюджет армии, чтобы еще больше ухудшить ситуацию. Сегодня мы должны сделать выбор относительно будущего армии США. Горстка генералов выдвинула предложения, но только три из них вышли на первый план. Во-первых, у нас есть план Эйзенхауэра. В нем намечена большая очистка руководства и строгая подготовка, чтобы привести армию в соответствие со стандартами. Во-вторых, план Паттона, в котором намечен пересмотр состава нашей армии, переход к сильно мобильной боевой силе. План МакАртура предусматривает укрепление армии, даже пропагандируя различные формы мобилизации."
 US.3.d: "ВМС США тоже не в хорошем состоянии. Если мы хотим подтвердить нашу военно-морскую мощь, нам нужно будет расширить или реформировать наш флот. Мы могли бы попытаться сделать наш военно-морской перевозчик, в противном случае мы могли бы сосредоточиться на том, на чем мы всегда были способны. Сила в количестве."
 US.4.d: "США отстают от других военно-воздушных сил, особенно в Европе. Британцы и французские военно-воздушные силы, которые поднимают ряд красных флагов."
 US.5.d: "Сегодня утром в Хьюстоне, штат Техас, произошел взрыв, в результате которого несколько человек погибли и в настоящее время было ранено неописуемое число человек. В число главных подозреваемых в этом инциденте входят мексиканские националисты, хотя местная полиция еще и не исключила какую-либо национальную политическую группу. На месте происшествия офицеры идентифицируют себя как флаг мексиканского государства, хотя необходимо провести дополнительные судебно-медицинские исследования. Считается, что объектом нападения является железнодорожный и трассационный центр в городе, но точно не известно. Однако известно, что политическая обстановка в стране резко ухудшилась, и отсюда она скатится вниз."
 US.6.d: "Южный Змей может быть более грозным врагом, чем этот взгляд."
 US.7.d: "Сегодня мы получили сообщение от американцев! Они требуют, чтобы "[Руко. Гетнам] стал Защитником Соединенных Штатов Америки, фалирия, чтобы подчиниться будет встречена с силой". Народ [Рут. Гигатив] заслуживает жить в свободной и независимой стране, хотя американцы, угрожающие вторгнуться, очень реальная угроза..."
 US.8.d: "Они отказываются принимать наши требования, ссылаясь на то, что вряд ли разумно требовать от них от них отрекаться от своей независимости в ближней жизни."
 US.9.d: "Мы начинаем создавать дружественное правительство прямо сейчас, это, как мы надеемся, обеспечит, чтобы мы окружали мексиканскую угрозу."
 US.10.d: "Южный Змей может быть более грозным врагом, чем они выглядят."
 US.11.d: "Американцы сделали нам предложение, они предложили присоединиться к «Ассоциации Свободных наций» . nn [Root.GetName] была одной из стран, которые отозвали приглашение в связи с их попытками улучшить отношения с Центральной Америкой."
 US.12.d: "Они решили, что скорее откажутся от нашего приглашения в Лигу Свободных наций."
 US.13.d: "[From.GetName] принял наше приглашение и объявил, что они присоединяются к Лиге Свободных наций!"
 US.14.d: "Северные ублюдки потребовали, чтобы националистическое правительство ушел в отставку и восстановило американское кукольное правительство!"
 US.15.d: "В тихий, тёплый день в Калифорнии грузовик подъехал к контрольно-пропускному пункту на мексиканско-американской границе. Взгляд запустился на находящихся в поле боя людей, которые шли через деревянную ограду, ведущую от одного участка дороги к другому. Заборы, которые тянулись в милях от любой стороны контрольно-пропускного пункта в качестве дополнительной меры безопасности, застряли в машине. Частные, слишком застигнутые в том, чтобы увидеть другой грузовик в металлическом душе, превратились в восходящее солнце, чтобы увидеть несколько других грузовиков, выходящих через мираж. Однако они были на другом курсе, прямо к Сан-Диего. Слово о нападении дошло до Вашингтона вскоре после этого."
 US.16.d: "Мы оправились от Великой депрессии примерно год назад, и с тех пор мы улучшаемся. Экономика работает намного лучше, и наши граждане могут позволить себе здоровое питание. С повышением уровня жизни и общим улучшением экономики мы можем с уверенностью сказать, что мы больше не больные люди Америки."
 US.30.d: "Рано утром Юджин В. Дебс умер от многочисленных нарушений органов после длительного периода болезни здоровья. Дебс имел обширную историю в американской политике, будучи лидером профсоюза, оспаривавшим избирательные кампании Теодора Рузвельта в 1912 и 1916 годах, в меньшей степени, чем результаты звезд. После того, как он был практически невиновен в своем осуждении действий Америки против Мексики, и, в более широком плане, в отношении центральных держав, Верховным судом, он продолжал быть контроверной фигурой. Дебс также опротестовал президентские выборы 1920 года по билету Социалистической партии, но опять же был очень безуспешен. Хотя де-факто он был лидером Социалистической партии, он прекратил свои выборы в президенты, и социалистическая партия, вероятно, с тех пор, как в значительной степени закончилась американская политика, он назначил журналиста и профсоюза Джека Рида своим преемником, хотя с кончиной Дебса переходный процесс стал официальным. Многие зрители не могут точно сказать, какой будет судьба партии, но, вероятно, она будет страдать от раскола в силе после смерти лидера суза."
 usanews.1.d: "Сегодня утром в Хьюстоне, штат Техас, произошел взрыв, в результате которого несколько человек погибли и в настоящее время было ранено неописуемое число. В число главных подозреваемых в этом инциденте входят мексиканские националисты, хотя местная полиция еще не исключила какую-либо национальную политическую группу. На месте происшествия офицеры идентифицировали себя как флаг мексиканского государства, хотя необходимо провести дополнительные судебно-медицинские исследования. Считается, что целью нападения является железная дорога и пересадка в городе, но точно этого еще не известно. Вместе с тем известно, что политическая обстановка в стране резко изменилась к худшему, и она скатится вниз только отсюда."

 ###IDEAS###
 LIB_us_influence_idea: "Экономическое влияние США"
 LIB_us_influence_idea_desc: "Американская внешняя политика приняла жесткий антиимпериалистический поворот в 1920-х годах, и в качестве прикрытия этой политики они предложили официальный союз, защиту и инвестиции."
 LIB_speartip_of_anti_imperialism: "Сцена антиимпериализма"
 LIB_speartip_of_anti_imperialism_desc: "Мы ведем американскую политику по борьбе с империализмом, агенты ПСОК из США наводнились, чтобы подорвать соседние колониальные режимы, и инструкторы армии США просвещают наши войска. Мы должны поддерживать этот маяк свободы любой ценой!"

 USA_MEX_third_mexican_american_war: "Третья мексикано-американская война"
 USA_MEX_third_mexican_american_war_desc: "Опять же, в Северной Америке вспыхнула война, которая на этот раз должна быть гораздо более жестокой и продолжительной, чем последний конфликт подобного рода. Вспыхнула квазирасовая война, разжигаемая ненавистью, и по мере того, как боевые действия нарастают в американской торговле между Югом и Западом через Мексиканский залив стали калеками, поскольку ресурсы, порты и моря региона превратились в зону войны."

 USA_desperate_defence: "Отчаянная оборона"

 USA_phillipine_resistance: "Филиппинское сопротивление"
 USA_phillipine_resistance_desc: "Почти четыре десятилетия оккупации Филипинцев продолжаются, и в связи с крахом голландской Ист-Индии и увеличением иностранного финансирования групп сопротивления стоимость оккупации лишь продолжает расти, что имеет серьезные последствия для наших военных, поскольку она оказывается связанной в переплетенном конфликте с другой стороны Тихого океана, когда военные с огромными ресурсами из-за их небольшого размера по сравнению с государством, которому они служат."

 USA_northernwar: "Великая Североамериканская война"
 USA_northernwar_desc: "Американское вторжение Канады быстро вышло из-под контроля, и то, что считалось лишь вопросом марша американцев на север, превратилось в тройную борьбу за выживание." 

 USA_treaty_of_detroit: "Детройтский договор"
 USA_treaty_of_detroit_desc: "В отношении США был установлен карфагинальный мир, большая часть его оружия была направлена в Мексику и Канаду, численность вооруженных сил была ограничена, часть американской промышленности была передана обеим державам, производство транспортных средств было строго ограничено, и этот договор будет сохраняться в заблуждении, если мы не будем бороться за выход из этого договора."

 USA_surprise: "Сюрприз, атака!"

 USA_revenge_time: "Американский реванхизм"

 USA_sick_man_america: "Больной американский человек"
 USA_sick_man_america_desc: "Америка стала раздутым бюрократическим обманщиком. Многие граждане думают, что само правительство может быть более серьезной угрозой для страны, чем любая иностранная угроза."

 USA_malnourished_populace: "Популас, страдающий от недоедания"
 USA_malnourished_populace_desc: "Великая депрессия продолжается уже 7 лет, и она имеет катастрофические последствия для граждан Соединенных Штатов, до такой степени, что многие из них не могут получить достаточно еды для правильного питания."

 USA_failed_offensive: "Провал контрнаступления Чато-Тирри"
 USA_failed_offensive_desc: "Контрафактный план Чато-Тирри был разработан французскими генералами для того, чтобы пробиться через немецкие линии во Франции во время Великой войны, и с тех пор его огромный провал породил глубокое недоверие среди частных лиц и их надзирателей."

 USA_rifles_and_trucks: "Винтовки и грузовики"
 USA_rifles_and_trucks_desc: "Главной частью любой механизированной армии является само стрелковое оружие пехоты и моторизованное оборудование, и мы должны сосредоточиться на производстве этих предметов первой необходимости."
