 usamonroe.1.d: "Сегодня США выдвинули требование прекратить нашу агрессивную войну на Американском континенте или столкнуться с американской военной мощью. Они ссылаются на доктрину Монро, заявив, что никакая внешняя держава не может вести войну, чтобы колонизировать или подчинить власть на Американском континенте."
 #
 usamonroe.2.d: "После того, как США вмешались с нашей стороны против внешней державы, требуя мирного урегулирования, они вышли на путь мира."
 #
