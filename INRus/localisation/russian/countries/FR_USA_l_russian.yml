 USA_FUHRERREICH_DESC: "Участвуя в Великой войне как на мексиканских, так и на европейских фронтах, Теодор Рузвельт оставил столики в Версале, разгневавшись на жесткий и требовательный договор. Нация, которая сейчас находится в политической изоляции, погрузилась в глубокие экономические проблемы. В разгаре, некоторые из достояний страны заявили о своей собственной независимости, в том числе о своем мексиканском клиентском государстве. Теперь, с небольшим числом друзей и парой могущественных врагов, Америка разделена, как еще один большой конфликт на горизонте."

