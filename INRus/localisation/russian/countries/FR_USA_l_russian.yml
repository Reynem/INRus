 USA_united_states_army: "Проверьте армию США"
 USA_united_states_army_desc: "Америка не воевала со времен Великого Вмешательства 1919 года, с гибелью людей, от которой она пострадала и во время второй мексиканско-американской войны, не говоря уже о тяжелом ударе, нанесенном ее кофферу Великой Депрессией, которая могла винить ее. Это вызвало атрофию, которую наш генеральный персонал намерен исправить, вопрос в том, как."
 #EISENHOWER PLAN
 USA_eisenhower_plan: "Большая фотография Эйзенхауэра"
 USA_eisenhower_plan_desc: "Эйзенхауэр был первым, кто попытался исправить американскую армию. Он утверждает, что мы сосредоточились на том, чтобы выиграть битву. Но если мы посмотрим на более широкую картину, многие битвы, с которыми мы сражались и победили во время великой войны, ничего не стоили нам жизней, нам нужно думать о большем и более длительном."
 USA_defensive_warfare: "Оборонительная война"
 USA_defensive_warfare_desc: "Тренировки, минные поля, задние точки, вот как мы победим в наших войнах, в конце концов; что хорошего в том, чтобы захватить землю, если мы потеряем ее сразу же после этого?"
 USA_grand_strategy: "Великая стратегия"
 USA_grand_strategy_desc: "Если мы хотим добиться победы, мы должны думать в более широких масштабах, планы должны быть склеены так гладко, что говорить друг о друге практически невозможно таким образом, что каждое предпринятое действие будет сделано для нашей неизбежной победы."
 USA_sack_unskilled_officers: "Неквалифицированные сотрудники"
 USA_sack_unskilled_officers_desc: "В армии много офицеров как в верхнем, так и нижнем эшелонах, которые не понимают первую вещь о командовании, не как вдохновлять и как думать, эти люди также могут быть врагами за все, что они помогают, они должны быть либо уволены, либо понижены в должности, независимо от того, сколько это будет стоить."
 USA_diverse_climate_training: "Учебная подготовка по вопросам различных климатических условий"
 USA_diverse_climate_training_desc: "Наша великая нация покрывает почти все биом, что наши солдаты когда-либо видели, но большая часть наших тренировок проходит на умеренном восточном побережье? Пора положить этому конец, каждый солдат увидит лучшее и худшее из Дикой Америки, таким образом, ничто не удивляет их на поле."
 USA_inter_division_cooperation: "Сотрудничество между отделами"
 USA_inter_division_cooperation_desc: "В то время как каждая дивизия должна быть в состоянии функционировать самостоятельно, что не означает необходимости, армия не является группой отдельных лиц, мы боремся не за нашу личную славу, а за защиту нашей великой нации, и если мы хотим защитить ее, то это означает, что все должны работать сообща, чтобы содействовать достижению общей цели."
 USA_new_artillery_designs: "Новые артиллерийские конструкции"
 USA_new_artillery_designs_desc: "Со времени Великого Вмешательства было много технологических достижений, чаще всего в области промышленности и техники, хотя на поверхности они, кажется, не имеют военного потенциала, но, возможно, с американской изобретательностью мы можем использовать эти новые гидравлические достижения в нашем тяжелом оборудовании."
 USA_firepower_supremacy: "Тактическая величие"
 USA_firepower_supremacy_desc: "Подумайте, план, последний, это арендаторы наших новых военных, мы не будем безрассудными бродягами, бегущими к врагам, надеясь на лучшее, мы будем знать наши противники защиты прежде, чем они сделают это и противостоят им, война - это шахматный матч, и чтобы выиграть, нам нужно думать о милях вперед."
 #PATTON PLAN
 USA_patton_plan: "Реформы мобильности Паттона"
 USA_patton_plan_desc: "Паттон утверждал, что так много людей было потеряно, потому что мы просто стояли там и стучали, стоя в траншеях и бегая прямо к нашим врагам, ничего не сделает, кроме ненужной бойни. Путь вперед - это мобильность, удар сильно и быстро , как это делали Сиу."
 USA_speed_cult: "Скорость"
 USA_speed_cult_desc: "Америка нуждается в скорости, молодые деньги идут на покупку новых Chryslers и Fords, которые двигаются быстро и хорошо, возможно, нам следует интегрировать эти быстрые и быстрые машины в нашу армию, надеяться, что наши враги любят черный цвет."
 USA_new_tank_designs: "Современные конструкции цистерн"
 USA_new_tank_designs_desc: "Наши союзники использовали танки во время Великой войны, но огромные медленные корабли просто не могут идти в ногу с нашим новым стилем войны. Если мы сократим эти бронированные чудовища и добавим некоторые высокоэффективные американские двигатели, возможно, они будут функционировать для нас новыми способами."
 USA_endless_offensives: "Бесконечные наступательные действия"
 USA_endless_offensives_desc: "оборона стоит жизни, чем дольше мы стоим в одном месте, тем дольше врагу приходится бомбить нас артиллерией, самолетами и чем-то другим, о чем он может думать."
 USA_the_xylophone: "Ксилофон"
 USA_the_xylophone_desc: "Моторизованные дивизии были очень полезны нашей армии, единственная проблема, которая у нас есть, это то, что они постоянно опережают любую пожарную поддержку, которую мы им оказываем, но некоторые люди из Крайслера имеют ответ, T27 Xylophon, в его самой основной форме, это просто грузовики, которые мы используем в наших моторных дивизиях, за исключением взрывного удара сверху."
 USA_field_aid: "Интеграция помощи на местах"
 USA_field_aid_desc: "Еще одна проблема с нашей скоростью заключается в том, насколько далеки наши мальчики от медицинского лечения, если это необходимо, и это снова и снова критикуется, потому что если мы будем держаться ближе к нашим линиям, возможно, мы сможем спасти некоторых раненых."
 USA_rifles_and_trucks: "Винтовки и грузовики"
 USA_rifles_and_trucks_desc: "Для того чтобы этот стиль войны был эффективным, нам нужно будет иметь постоянную мощность двух вещей: винтовки для стрельбы и грузовики для загрузки."
 USA_the_art_of_war: "Искусство войны"
 USA_the_art_of_war_desc: "Оригинальное искусство войны было написано китайским генералом Сунь Цзу давным-давно, и хотя некоторые из его идей до сих пор применимы и сегодня, Паттон решил, что, возможно, пришло время современному генералу объяснить современное искусство войны, кто лучше, чем он?"
 #MACARTHUR PLAN
 USA_macarthur_plan: "Массовая мобилизация Макартура"
 USA_macarthur_plan_desc: "Его аргумент состоял в том, что, хотя тактика хороша и скорость эффективна, Америка имеет большое преимущество по сравнению с большинством других государств, что, будучи невероятным населением, в котором находится огромная нация, если мы мобилизуем достаточно людей, это не имеет значения, с кем мы сражаемся, достаточно пуль заглушит их."
 USA_re_equip_men: "Переоснащение наших людей"
 USA_re_equip_men_desc: "Мы столкнемся с серьезной проблемой, если попробуем мобилизоваться в масштабах, в которых планы МакАртура будут оснащать наших людей."
 USA_army_marches_on_its_stomach: "Армия марширует на своем желудке"
 USA_army_marches_on_its_stomach_desc: "По крайней мере, такова старая поговорка, и если мы собираемся иметь такую огромную силу, мы должны быть в состоянии прокормить ее, Великая Депрессия потратила большой толчок на наших фермеров, но, возможно, если мы перенаправим часть военного бюджета на обеспечение стабильного снабжения продовольствием, мы сможем обеспечить наших солдат, и если нам повезет, наши граждане больше не будут голодать."
 USA_reorganized_logistics: "Реорганизованное материально-техническое обеспечение"
 USA_reorganized_logistics_desc: "Мы не можем полагаться на то, что каждый человек всегда имеет доступ к складам боеприпасов или другим предметам снабжения, и мы научим его сохранять запасы, а также обеспечивать, чтобы на всякий случай сами дивизии имели адекватный избыток."
 USA_federal_draft: "Уничтожить военных"
 USA_federal_draft_desc: "Американская материковая часть дает нам огромное количество солдат, но сейчас мы используем лишь часть из них, хотя мы позволяем как чернокожим, так и белым солдатам добровольцем, большинство цветных солдат отводят на роль, не связанную с боевыми действиями."
 USA_communication_primacy: "Примат общения"
 USA_communication_primacy_desc: "Мы обычно используем курьеров, чтобы получать приказы от одного фланга к другому, но это будет тормозить и не доходит до наших линий, возможно, радио и в наших командных зданиях и наших дивизиях решит это."
 USA_guns_over_butter: "Оружие над маслом"
 USA_guns_over_butter_desc: "У нас есть люди, которые нам нужны, но у нас просто нет способности производить оборудование для них достаточно быстро."
 USA_new_york_project: "Нью-Йоркский проект"
 USA_new_york_project_desc: "Тела просто не могут сшить, чтобы их было достаточно, мы можем проталкивать через оборону и захватить землю, это намного дороже, особенно если регион сильно защищен, нам нужно какое-то преимущество, если мы хотим избежать потери масштаба Великого вмешательства, есть новости о новом научном проекте, над которым работают в Нью-Йорке... возможно, мы могли бы использовать его."

 USA_healing_past_wounds: "Исцеление прошлых ран"
 USA_healing_past_wounds_desc: "Если мы хотим стать эффективной боевой силой, мы должны простить и забыть, что не наши командиры или генералы потребовали, чтобы наши солдаты бежали далеко в гнезда пулеметов, то не наши командиры подготовили план, который стоил тысячам молодых американцев их жизней, если мы хотим стоять плечом к плечу должным образом, нам нужно будет восстановить доверие наших солдат во всех званиях."

