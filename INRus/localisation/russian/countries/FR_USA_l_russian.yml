 #FOREIGN
 USA_foriegn_policy: "Внешняя политика"
 USA_foriegn_policy_desc: "Настало время США вернуться на мировую сцену, и мы держим себя подальше от нее, и это было бы неплохо, но в эти тяжелые времена нам понадобится вся помощь, от нас самих или от других, мы можем получить..."
 USA_defend_the_border: "Защищать границу"
 USA_defend_the_border_desc: "Когда противник приближается к нам, есть только одно место, куда мы можем пойти..."
 USA_defend_the_interior: "Защита внутренних дел"
 USA_defend_the_interior_desc: "...на нашу собственную помощь, чтобы победить вечный враг, на нашу собственную помощь, чтобы сохранить свободу."
 USA_we_will_be_waiting: "Мы будем ждать."
 USA_we_will_be_waiting_desc: "Затишье в напряжении рухнуло, но скоро враг будет у ворот, народ может успокоиться, пока мы будем ждать."
 USA_tighten_extradition_law: "Закон о более жесткой выдаче"
 USA_tighten_extradition_law_desc: "Для некоторых может быть спорным следить и следить за мексиканскими товарами и контрабандой, и, возможно, за людьми, но только те, кто отделен от американского идеала, действительно будут скептиком."
 USA_democratic_traditions: "Демократические традиции"
 USA_democratic_traditions_desc: "Америка всегда была бастионом свободы, по крайней мере на Американском континенте, но сейчас она находится под угрозой и в еще большей степени, чем когда-либо прежде."
 USA_deal_with_panama: "Соглашение с Панамой"
 USA_deal_with_panama_desc: "Панама слишком долго пыталась подорвать наше влияние, мы всегда уважали их суверенитет, по крайней мере, так, как это важно, если они не хотят играть по правилам, мы тоже не должны."
 USA_centroamerican_incursion: "Центральноамериканская инфекция"
 USA_centroamerican_incursion_desc: "Соавторы, змеи, валькисты, по крайней мере, некоторые из них, такие же, как Панама, но в более крупных масштабах, мы должны снова прийти на помощь в установлении демократии на Американском континенте."
 USA_befriend_central_countries: "Подружиться с центральноамериканскими странами"
 USA_befriend_central_countries_desc: "Коллеги, змеи, валькисты, по крайней мере, некоторые из них, мы должны и можем спасти их от самих себя и от их прошлого, возможно, они смогут войти в американский мир."
 USA_it_will_never_happen_here: "Этого никогда не случится здесь!"
 USA_it_will_never_happen_here_desc: "Как мы отреагируем на постоянные пограничные атаки?"
 USA_put_southern_valkists_in_their_place: "Положите южную угрозу на покой"
 USA_put_southern_valkists_in_their_place_desc: "Мексика уже давно выступает в качестве региональной угрозы нашей гегемонии на Американском континенте, она большая, а теперь и реваншистская популяция стремится нанести нам удар и вернуть утраченные территории, и мы нанесем первый и прочный удар по нашему полному контролю над регионом."
 USA_it_isnt_too_late: "Ещё не поздно."
 USA_it_isnt_too_late_desc: "Последняя попытка канавы - если они не отвернутся от своей судьбы, мы их сделаем."
 #DOMESTIC
 USA_treading_water: "Вода для прокачивания"
 USA_treading_water_desc: "Так много разговоров в Вашингтоне, так мало дел, с новым президентом, возможно, эту катастрофу можно изменить."
 USA_review_the_union: "Обзор деятельности Союза"
 USA_review_the_union_desc: "Америка имеет много запасов, которые она не укрепила (большинство из которых она потеряла), возможно, это должно измениться."
 USA_49th_state: "49-е государство"
 USA_49th_state_desc: "Толчок к государственности на Аляске был гораздо более живым, чем любой другой."
 USA_50th_state: "Пятидесятое государство"
 USA_50th_state_desc: "С тех пор, как Хавай был аннексирован, он был втянут в конфликт, каким бы незначительным он ни был, возможно, если мы введем его в Союз, они поймут, что они тоже действительно американские граждане."
 USA_51st_state: "51-е государство"
 USA_51st_state_desc: "Баха-Калифорния не является нашим первым выбором для американского государства, но он находится в невероятно стратегическом положении, и в любом случае, Союзная лихорадка в полной мере надвигается. Возможно, она даже попадет под кожу южного валькиста."
 USA_integrate_puerto_rico: "Интеграция Пуэрто-Рико"
 USA_integrate_puerto_rico_desc: "Полуавтономный, но под американской юрисдикцией укрепление этого нового Пуэрто-Рико представляет собой большой шаг в защиту американских ценностей."
 USA_question_of_foriegn_holdings: "Сопротивление Филиппине"
 USA_question_of_foriegn_holdings_desc: "Мы должны, наконец, нанести быстрый удар по руководству Филиппии и раз и навсегда положить конец этому конфликту."
 USA_public_sector: "Государственный сектор"
 USA_public_sector_desc: "Сосредоточившись на общественном благе, Америка может быть восстановлена."
 USA_education_reform: "Реформа системы образования"
 USA_education_reform_desc: "Бедные в этой стране уже долгое время остаются без внимания, и при простом нажатии они могут сильно повлиять на то, чтобы стать лучшими американскими гражданами."
 USA_private_sector: "Частный сектор"
 USA_private_sector_desc: "Сосредоточив внимание на малых и свободных предприятиях, Америка может быть восстановлена."
 USA_support_the_entrepeneurs: "Поддержка соискателей"
 USA_support_the_entrepeneurs_desc: "Малые предприятия в Америке уже давно находятся под контролем монополий и их собственного правительства."
 USA_the_american_pheonix: "Американская Феоника"
 USA_the_american_pheonix_desc: "Одна Феникс, одна Америка, одна традиция, снова встань, чтобы получить мантию демократии, даже несмотря на непреодолимые шансы."
 USA_the_perfect_american: "Идеальный американец"
 USA_the_perfect_american_desc: "Глядя на самих себя и поощряя оживленные дебаты о том, что значит быть американцем - сейчас и в будущем - видение "Америки" будет усовершенствовано."
 USA_looking_outwards: "Смотреть наружу"
 USA_looking_outwards_desc: "Оглядываясь на другие страны, которые пытались освоить демократию и свободу, мы, возможно, сможем лучше понять, что значит поддерживать эти и другие бесчисленные традиции."
 USA_renewed: "Вновь!"
 USA_renewed_desc: ""Моя мечта - это место и время, когда Америка снова будет рассматриваться как последняя лучшая надежда Земли." -Абрахам Линкольн"
 USA_restored: "Возвращение!"
 USA_restored_desc: "Давайте использовать силы добровольцев в связи с частью регулярной армии, чтобы как можно скорее, без нескольких месяцев, установить флаг на линии огня, мы должны это человечеству."
 USA_new_democratic_bastion: "Новый демократический бастион"
 USA_new_democratic_bastion_desc: "Сейчас Америка, Америка навсегда. По мере того, как мы смотрим через моря и океаны, равнины и горы, мы будем знать, что мы победили, что мир привел в движение наше возрождение - наши призывы к вызову защитника."
