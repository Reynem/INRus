 #Events
 isr.1.d: ""
 #
 isr.2.d: "Сегодня, около Акре, группа британских солдат попала в засаду группой еврейских радикалов под эгидой организации &lt; &lt; Лехи &gt; &gt; . &lt; &lt; Британские войска &gt; &gt; были в небольшом количестве и столкнулись с гораздо большей силой с элементом неожиданности. &lt; &lt; В конце концов они отбросили нападавших &gt; &gt; , в результате этого семь британских солдат погибли на месте преступления, что создало новый прецедент в сионистских радикальных нападениях. &lt; &lt; Многие опасаются, что это лишь начало более крупной кампании &gt; &gt; ."
 #
 isr.3.d: "После палестинского арабского восстания в 1934 году британская администрация ввела ограничения на еврейскую миграцию в Палестину, надеясь угодить обеим сторонам путем ограничения миграции и сохранения квоты еврейской миграции, однако эта мера привела к тому, что бóльшая часть еврейского населения, и без того разочарованная британским правлением, стала против нас."
 #
 isr.4.d: "Сегодня конфликт в Палестине достиг новой крайности, поскольку возмущение стало результатом того, что называют сержантами Афера. Тела двух британских сержантов были найдены повешенными британскими войсками в эвкалиптовом роще вблизи Нетаньи. После осмотра тел и затем попытки вырубить тела третий британский солдат был ранен из-за того, что тела были заминированы. Игрун взял на себя ответственность, что привело к массовому возмущению в Великобритании и Палестине, а в Лондоне и Манчестере вспыхнули антиеврейские беспорядки и репрессии со стороны британской полиции в Иерусалиме."
 #
 isr.5.d: "С ростом повстанческого движения в Палестине и массовым возмущением в Великобритании по поводу его результатов британское правительство приступило к работе над &lt; &lt; Белой книгой &gt; &gt; , в которой будет изложена будущая политика в отношении Палестины. &lt; &lt; Только время &gt; &gt; покажет, насколько успешными являются наши усилия."
 #
 isr.6.d: "Джон Багот Глубб, бывший британский солдат, писатель и арабист, ставший лидером палестинского мятежа против еврейских властей, обратился к британскому правительству с призывом обратиться к нему в свете ослабления проционалистских голосов в британской политике и начала разработки Белой книги, надеясь, что его слова больше не упадут в глаза. &lt; &lt; Глубб &gt; &gt; обратилась к британскому правительству с призывом изменить политику в Палестине, с тем чтобы она отдавала предпочтение арабским интересам, а не сионистским интересам, утверждая, что любая политика, проводимая правительством еврейского повстанческого движения, будет продолжаться до тех пор, пока не будет достигнута полная независимость от Великобритании. &lt; &lt; Глубб &gt; &gt; утверждает, что этот союз с местными арабами и совместное сокрушение еврейских мятежников приведут к установлению правила, аналогичного правилу других британских арабских территорий, где в настоящее время конфликта не существует."
 #
 isr.7.d: "После нескольких месяцев подготовки «Белой книги» по Палестине была выпущена британская политика в отношении Палестины, которая безусловно будет благоприятствовать одной из сторон, и будет решено, что будущее Палестины будет..."
 #
 isr.8.d: ""
 #
 isr.9.d: "В ответ на нашу проионистскую политику арабы вновь восстали против нашего правления, хотя многие призывают к быстрому сокрушению этого восстания, многие утверждают, что этот регион больше не стоит контролировать."
 #
 isr.10.d: "Мы наконец раздавили сионистское восстание и теперь свободны в осуществлении наших планов в отношении Палестины."
 #
 isr.11.d: "В ответ на нашу проарабскую политику [ISR.GetName] провозгласил независимость."
 #
 isr.12.d: "Джон Багот Глубб, которого многие рассматривают как предателя, теперь попал в наши руки сокрушительным арабским восстанием."
 #
 isr.13.d: "Джон Багот Глубб, которого многие рассматривают как предателя, теперь попал в наши руки, когда он пришел к нам, чтобы вернуться к британским военным после того, как мы изменили нашу политику и завершил свой мятеж. Многие утверждают, что ему должны быть предъявлены обвинения из-за его дезертирства и конфликта с еврейским правительством. Другие утверждают, что он должен быть просто освобожден и не должен возвращаться на службу. Некоторые утверждают, что ему следует разрешить вернуться на военную службу, поскольку его опыт ведения войны в пустыне был бы ценным для британской армии."

