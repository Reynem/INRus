 #guatemala

 guatemala.1.t: "Гондурас присоединяется к Великой Республике"
 guatemala.1.d: "Не так давно социалистический переворот захватил всю власть в Гондурасе после того, как они получили контроль большинства в законодательном органе, главным образом никарагуанцы, которые бежали после провала восстания против американской военной оккупации, существуют четкие параллели между нами и ними, учитывая большое число мексиканских иммигрантов, которые стали оказывать влияние на нашу страну."
 guatemala.1.a: ""Трэбаджадоры дель Мундо, Юниос!""

