SWE_FUHRERREICH_DESC: "Королевство Швеция когда-то было одной из величайших держав Европы. Сегодня они являются лишь региональной державой в Скандинавии. Следуя по пути нейтралитета, даже когда Европа сгорела во время Великой войны. После войны, шведская политика, характеризующаяся борьбой между правыми и левыми, и ростом крайне правого движения в Новой Швеции. С приходом к власти валькистов в Германии, Швеция увидела все более страдающую экономику. Это привело к непопулярному кабинету Хаммаршельда, отчаянно пытающемуся восстановить стабильность. Ещё предстоит увидеть, куда пойдёт Швеция."
POLITICS_GUSTAF_V_DESC: "Король Швеции Густаф V был королем Швеции с 1907 года. Он старший сын покойного царя Оскара II и Софии Нассау. Густаф вырос в XIX веке автократического королевства Швеции, но когда он поднялся на трон, Швеция уже превратилась в парламентскую демократию. В 1881 году Густаф женился на Виктории Баден, немецкой благородной женщине и потомке бывшего королевского дома Швеции. Под великой войной король, и особенно его жена, опирался на прогерманскую сторону, но Швеция сохранила свой нейтралитет. Сегодня король Густаф является стариком. Он является королем другого века, и он посмотрит, как будущее принесет шведский королевский дом."
