#SWE_1936_election: "Выборы 1936 года"
#SWE_1936_election_desc: "С учетом того, что экономический кризис все еще свежий в сознании людей, они стали голосовать за того, кто будет заседать в нашем парламенте, и оттуда сформировать новое правительство. Швеция задается вопросом, ознаменует ли это рождение Фолькеммета, рождение Новой Швеции или возвращение консерваторов."

#SWE_socialistiska_blocket_victory: "Победа со стороны социалистов"
#SWE_socialistiska_blocket_victory_desc: "Люди хотят перемен, и теперь они голосуют за них; не будет больше несправедливости голодной революции снова действовать консерваторами в этом кризисе; Швеция больше не будет просто страной, с которой могут играть богатые и могущественные; она будет в руках каждого; это наш дом!"

#SWE_establish_folkhemmet: "Создать фолькеммет"
#SWE_establish_folkhemmet_desc: "В это трудное время мы должны поддерживать друг друга, как отец, который поддерживает своего сына, или старший брат, который поддерживает своих младших братьев и сестер."

#SWE_recover_our_home: "Возвращение к нашему дому"
#SWE_recover_our_home_desc: "Сейчас Швеция похожа на дом, дом, который был поражен несчастьем, но с помощью всех, кто живет в доме, он выздоровеет и станет сильнее."

#SWE_balanced_democracy: "Сбалансированная дипломатия"
#SWE_balanced_democracy_desc: "Швеция находится между двумя гигантами, немцами на юге и советскими войсками на востоке, и мы должны сбалансировать наш подход к этим державам, чтобы не поставить под угрозу нашу независимость."

#SWE_borgerliga_blocket_victory: "Боргерлига Блокет Победа"
#SWE_borgerliga_blocket_victory_desc: "Хотя многие считали, что консерваторы вряд ли будут удерживать власть после краха рынка, мы сделали это, но нам нужно действовать быстро, если мы не получим мнение народа против нас. Это, возможно, последний шанс спасти шведский консерватизм."

#SWE_swedish_democracy: "Шведская демократия"
#SWE_swedish_democracy_desc: "Швеция, наша Швеция, она пережила волны революций и радикализации, начиная с неспокойных времен 1920-х и 1930-х годов, станет новой Швецией, от экономической борьбы до периода экономического роста и величия, новой Швеции, которая дает демократию и мир!"

#SWE_far_right_coalition: "Коалиция &lt; &lt; Правое &gt; &gt;"
#SWE_far_right_coalition_desc: "Социал-демократы не смогли получить поддержку для формирования своего правительства, а консерваторы сейчас поддерживают нашу коалицию."
#SWE_ban_communist_party: "&lt; &lt; Пан Сверигес Коммунисковская партия &gt; &gt;"
#SWE_ban_communist_party_desc: "Сверигес Коммунисковская Партии - это партия революционеров, они хотят уничтожить Швецию и поселить страну под тоталитарным правлением с централизованной властью в Москве, они предатели, и с ними будут обращаться как с предателями, коммунизм - это измена, а измена наказана смертью!"

#SWE_attract_rightwing_valkists: "Притягивать правых валькистов"
#SWE_attract_rightwing_valkists_desc: "Линдхолмарна очень похожа на нас, но они больше против монархии и, как правило, более леволюбивы в своей социалистической политике, но есть некоторые из этих валькистов, которых можно легко привлечь к нам."

