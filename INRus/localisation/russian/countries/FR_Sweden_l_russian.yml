sweden.0.t: "Статус Швеции"
sweden.0.d: "С момента окончания наполеоновских войн Швеция сохранила за собой право участвовать в иностранных конфликтах. Даже после того, как Норвегия покинула союз между двумя странами в 1905 году и в результате войны, обрушившейся на Европу, Швеция смогла сохранить нейтралитет. Несмотря на этот нейтралитет, Швеция стала одной из самых тревожных стран в недавней шведской истории. В то время как Швеция никогда не участвовала в боевых действиях, у нее не возникало проблем с поставкой Германии шведской стали и других материалов. В то время как у нее не возникало проблем с использованием этого факта для того, чтобы распространить на североморскую дистанцию и распространить ее на Швецию. Несмотря на то, что шведская революция 1917 года стала одной из самых проблемных лет в истории Швеции. В связи с блокадой, которая привела к кризису, жесткой экономии и осуществлению политики в отношении правых и левых сторон, вскоре в воздухе произошли революции. По мере того, как Россия пошла на революцию, Швеция вскоре увидела бы близость к одному из них. В то же время, как шведская революция 1917 года потерпела бы неудачное развитие этой страны в результате политической поляризации и недовства между правыми и левыми. Конец Великой войны означал конец Северо-морской войны был бы концистской революции в Швеции, в то время, когда она была бы вела вела в тяжелая тяжелая тяжелая драдень на шведская дра, и в этой эпохи, в этой эпохи, в качестве тяжелая держалась в этой эпохи, а в этой эпохи, в этой эпохи, в качестве тяжелая тяжелая держалась в этой эпохи, а в этой эпохи, в стране, а в стране, в стране, в стране, в стране, в стране, в то в стране, в стране, в стране, в стране, в стране, в стране в стране, в стране, в стране, в стране, в стране, в стране, в стране, в стране, в стране, в стране, в стране, в стране, в стране, в стране, в стране, где в стране, в стране, в стране, в стране, в стране, в стране, в стране, в стране, в стране, в стране, в стране, в стране, в стране, в стране, в стране, в стране, в стране,"
sweden.0.a: "Фёр Сверидж - прилив!"
sweden.1.t: "6 июня"
sweden.1.d: "Несмотря на то, что у Швеции нет официального национального праздника, 6 июня часто считается неофициальным днем, который можно отметить. Этот день знаменует день, когда Швеция под правлением короля Густава Васа стала независимой от Союза Калмаров в 1523 году, а также день, когда в 1809 году новая шведская конституция предоставила более широкие полномочия Стандриксдагену, когда Карл XIII стал королем Швеции."
sweden.1.a: "Может, нам нужен национальный праздник?"
sweden.2.t: "6 июня"
sweden.2.d: "Несмотря на то, что у Швеции нет официального национального праздника, 6 июня часто считается неофициальным днем, который можно отметить. Этот день знаменует день, когда Швеция под правлением короля Густава Васа стала независимой от Союза Калмаров в 1523 году, а также день, когда в 1809 году новая шведская конституция предоставила более широкие полномочия Стандриксдагену, когда Карл XIII стал королем Швеции."
sweden.2.a: "Может, нам нужен национальный праздник?"
sweden.3.t: "Курт Хайджби утверждает, что он - королевский любовник."
sweden.3.d: "Родитель столицы Стокгольма, по имени Курт Хайджби, вышел и заявил, что он является любовником короля Густафа V, и что король соблазнил его в 1933 году. Слухи уже начали распространяться с теми, кто ближе всего к Хайджби. Мы должны действовать быстро, прежде чем это превратится в скандал и смущение для нашего короля."
sweden.3.a: "У него есть свобода выражения мнений."
sweden.3.b: "Мы должны попытаться подкупить его."
sweden.3.c: "Найди способ убить его."
sweden.4.t: "Открытие Стокгольмского аэропорта Броммы"
sweden.4.d: "В 1930-х гг. Стокгольму было необходимо создать надлежащий аэропорт, который стал неотложным, но сегодня он был открыт самим королем, и, надеюсь, это станет началом стокгольмского воздушного движения."
sweden.4.a: "Первая в Европе, попавшая в пещеру с самого начала."
sweden.5.t: "Салалиган совершил еще одно убийство."
sweden.5.d: "Преступная банда, Салалиган или банда Сала, которая подозревалась в совершении нескольких убийств с 1930 года до сегодняшнего дня, проводит расследование и всегда была бы счастлива, если бы кто-то дал им наводку о том, где могут быть преступники."
sweden.5.a: "Мы позаботимся о том, чтобы забрать их!"
sweden.6.t: "Члены &quot; Салалигана &quot; , арестованные"
sweden.6.d: "После того, как полиция получила наводку, она заставила их арестовать членов банды Сала."
sweden.6.a: "Отлично!"

sweden.7.t: "Лондонский Крэш нападает на Швецию"
sweden.7.d: "Мы получили новости о Лондонском фондовом рынке и о самой катастрофе, так как мы были одним из торговых партнеров Великобритании, мы сейчас почувствуем кризис, который последует за этим, мы просто должны принять наших людей и надеяться, что Швеция выздоровеет."
sweden.7.a: "Нет, нет."
sweden.8.t: "По мнению Энгдала, создание Крушения"
sweden.8.d: "Далеко правый политик Пер Энгдал приехал сегодня утром в Рикутен и выступил с речью, чтобы все услышали. &quot; Создание &quot; привело к экономическому кризису в Швеции. &quot; Он утверждал, что для того, чтобы преодолеть это, народ Швеции должен был проголосовать за кого-то, кто сначала поставит народ, нацию и военную и промышленную мощь. &quot; Движение &quot; Энгдал &quot; , &quot; Нисвенска Рёрельсен &quot; , сотрудничает с коалицией СНФ/КФН, и эта партия сформировала тройную партию в парламенте, сделав их могущественной оппозицией."
sweden.8.a: "Так он верит, что может это исправить?"
sweden.9.t: "Свен Линдерот требует от избирателей"
sweden.9.d: "На следующий день после выступления Пера Энгдала левый политик Свен Линдерот выступил с речью в промышленном центре Стокгольма."The far-right is in cahoots with the oppressive corporations. We shall give the power back to the people.". The establishment has been worried of far-left activities, with many conservatives choosing to align for a more nationalist and authoritarian path. What Linderot said could make moderate conservatives more willing to enter coalition with more right-winged radical parties."
sweden.9.a: "Не заставляй избирателей голосовать за Маркса!"

sweden.10.t: "Всеобщие выборы в Швеции 1936 года"
sweden.10.d: "Многие эксперты говорят, что это, возможно, самые важные в истории Швеции выборы, в которых отдельные лица и группы как слева, так и справа практически борются за власть. Есть три возможных результата: левый уголь между социалистическими и социальными демократами, с социальной демократической партией Сверигес Социалдемократиска Парти как лидеры коалиции. Они также могут получить поддержку со стороны левых и центральных, и они могут получить дополнительную поддержку со стороны людей, которые оставили консерваторов. nin na-right cooperation между либералами и консервантами, с консервативной партией Алмана Валмансфёрбундет, как лидеров коалиции. Есть шанс для них получить поддержку со стороны аграриев и националистов, и может получить дополнительную поддержку со стороны отдельных лиц, которые оставили консерваторов. nn-right-правый коалицию между либералами и консервантами, а последним вариантом, который находится на столе, является ультраправая коалиция, обретающая власть."
sweden.10.a: "Socialdemokraterna - Виктор"
sweden.10.b: "Алльманна Вальмансфёрбундет Менедж, чтобы держаться"
sweden.10.c: "Nisvenska Rörelsen Genes Support"

sweden.11.t: "Социально-демократерна формирует правительство"
sweden.11.d: "Социал-демократы теперь готовы от следующего правительства, с благословения короля, это, как мы надеемся, начнётся время мира и стабильности."
sweden.11.a: "Новое правительство готово!"
sweden.12.t: "Консервативы формируют правительство"
sweden.12.d: "В то время как Валмансфёрбунде удалось сохранить свою популярность на недавних выборах, они далеки от реального большинства, чтобы управлять страной. Однако эта проблема имеет решение. На самом деле, два решения. Либо мы можем выбрать путь к либеральному фольклору и аграрному Бондефёрбундету, чтобы получить необходимую поддержку, шаг, который мог бы оттолкнуть более авторитарную часть нашей партии. Или мы можем попытаться подойти к Нисвенске Рёрельсену, надеясь держать их под контролем, цепляясь за наше радикальное крыло."
sweden.12.a: "Мы не можем работать с новым шведским движением"
sweden.12.b: "Давайте попробуем работать с новым шведским движением"

sweden.13.t: "Новое шведское движение протестует против результатов выборов"
sweden.13.d: "Нисвенска Рёрельсен поехала на улицу, чтобы протестовать против результата, хотя выборы представляются справедливыми, на этом конце политического спектра есть много шведов, которые либо поверят другим, либо начнут восстание."
sweden.13.a: "Мы должны укрепить нас против них!"
sweden.14.t: "Дальние политические партии протестуют против результатов выборов"
sweden.14.d: "Дальние левые политические партии вышли на улицу, чтобы протестовать против результата, хотя выборы представляются справедливыми, на этом конце политического спектра есть много шведов, которые либо поверят, что они отдают предпочтение правящей элите и угнетают рабочих."
sweden.14.a: "Мы не хотим революции в Швеции!"

sweden.15.t: "Далеко-левые протесты исчезают!"
sweden.15.d: "В 1890 году в Швеции состоялась первая майская демонстрация, хотя это и не признанный праздник, большинство политических левых хотят, чтобы она стала таковой. Несмотря на то, что эта демонстрация была приручена в Швеции, в этом году она была полной атакой на вновь избранное правительство. В то время как коллективисты, социалисты и даже социальные демократы, такие, как Нильс Флиг, Пер-Альбин Хансон и Свен Линдерот, использовали этот день для того, чтобы зажечь бунтарский рабочий класс, который, как представляется, не находит наше правительство привлекательным. Несмотря на то, что полиция была направлена во многие места, чтобы разрушить эти демонстрации, она, возможно, укрепила социалистическую революцию."
sweden.15.a: "Почему бы нам не взять их вниз?!"
sweden.16.t: "Шведские революционеры просят поддержки"
sweden.16.d: "Шведский революционер Хьюго Сильен прибыл в Ленинград с просьбой. Он был направлен руководителями СКП в Швецию с посланием о помощи в снабжении их оборудованием и добровольцами, чтобы начать революцию коллективистов в Швеции. Несмотря на то, что это может быть шансом за один раз позволить марксистской революции посадить в Скандинавии, некоторые из наших лидеров не хотят использовать в ней ценные ресурсы, если она обречена на провал."
sweden.16.a: "Давайте поддержим это!"
sweden.16.b: "Нет, давай не будем этого делать."
sweden.17.t: "Далеко-покинутые протесты деэскалируют!"
sweden.17.d: "Пришли хорошие новости о майских протестах, хотя некоторые и беспокоились о том, что это приведет к социалистической революции, похоже, пожар социалистической революции сгорел."
sweden.17.a: "Боялся за социалистический кубок там."
sweden.18.t: "Стокгольмские беспорядки"
sweden.18.d: "Столица Стокгольма вспыхнула в волнениях, социалисты, коллективисты, даже социальные демократы. Все они сейчас выходят на свободу, захватывая контроль. Интересно то, что бунтари, похоже, оснащены иностранным оружием, что делает беспорядки более похожими на советскую операцию. Мы должны показать, что Швеция не хочет быть советской марионеткой, но как мы должны действовать против этих террористов?!"
sweden.18.a: "Возможно, нам нужно отойти."
sweden.18.b: "Не давай им дюйма!"
sweden.19.t: "Стокгольмские водопады в социалистических руках"
sweden.19.d: "ВИП"
sweden.19.a: "Мы будем бороться!"
sweden.20.t: "Король уезжает в Данию"
sweden.20.d: "Даже тогда, в разгар этого деморализующего гражданского конфликта, король Густаф V решил запрыгнуть на корабль и отплыть в Данию."
sweden.44.d: "Даже тогда, в разгар этого деморализующего гражданского конфликта, король Густаф V решил запрыгнуть на корабль и отплыть в Данию."
sweden.20.a: "Какой дурак!"
sweden.21.t: "Социалистические ополчения Сейиз Гётеборг"
sweden.21.d: "Социалистические ополчения, числящиеся в тысячах, схватили Гётеборг и требуют, чтобы мы сдали им правительство!"
sweden.21.a: "Мы должны сдаться!"

sweden.22.t: "Премьер-министр Арвид Линдман погиб в аварии"
sweden.22.d: "Наш премьер-министр Арвид Линдман недавно посетил Соединенное Королевство, и, возвращаясь домой, самолет, в котором он находился, разбился возле воздушного порта, убив многих пассажиров, включая самого премьер-министра."QBI" conditions. His body is transporting home right now. \n\nLindman was truly a great man. One that has lead the conservatives both in the Riksdag and the parliament. An effective peace-broker and a conservative who did not lose his principles."
sweden.22.a: "Покойся с миром, премьер-министр."
sweden.23.t: "Бывший премьер-министр Арвид Линдман погиб в аварии"
sweden.23.d: "Бывший премьер-министр Арвид Линдман недавно посетил Соединенное Королевство, и, возвращаясь домой, самолет, в котором он находился, разбился возле воздушного порта, убив многих пассажиров, включая самого Линдмана."QBI" conditions. His body is transporting home right now. \n\nLindman was truly a great man. One that has lead the conservatives both in the Riksdag and the parliament. An effective peace-broker and a conservative who did not lose his principles."
sweden.23.a: "Покойся с миром, мистер Линдман."

sweden.24.t: "Шведские коммунисты сражаются и умирают в Испании"
sweden.24.d: "Сообщения о шведских гражданах, сражающихся и умирающих в Испании, пришли за стол шведского правительства, главным образом, это шведские коммунисты, сражающиеся за испанских социалистов во время гражданской войны в стране."
sweden.24.a: "Хорошо."

sweden.25.t: "Салалиган приговорен к службе принудительного труда"
sweden.25.d: "Салалиган за свою преступную деятельность был приговорен к принудительному труду."
sweden.25.a: "Это покажет им"

sweden.26.t: "риксдаген в связи с отпуском по беременности и родам"
sweden.26.d: "В парламент поступило предложение Комиссии по вопросам народонаселения о том, чтобы помочь семьям, пострадавшим от экономического кризиса, и облегчить экономические условия между семьями, не имеющими детей, и семьями, воспитывающими детей, ввести отпуск по уходу за детьми, помощь по беременности и родам и открыть центры по уходу за детьми, в то время как социал-демократы, которые поддерживают это, не могут получить достаточной поддержки слева, чтобы добиться этого, они надеются получить поддержку правых, которые будут способствовать улучшению положения шведских матерей и их детей."
sweden.26.a: "Социал-демократы и националисты для этого!"
sweden.26.b: "Консерваторы и националисты против!"

sweden.27.t: "Огромное серебряное сокровище находится в Стокгольме."
sweden.27.d: "ВИП"
sweden.27.a: "Может, мы сможем использовать его для улучшения Швеции?"
sweden.27.b: "Сокровище должно быть продемонстрировано общественности"

sweden.28.t: "Призывы к выводу Хаммаршельда"
sweden.28.d: "Прошлый год не был приятным для правительства Карла Густафа Хаммаршельда. Его политика перед лицом экономического кризиса, возникшего после захвата Валькиста в Германии, в числе его жестокой реакции на протесты в мае, полностью разрушила его репутацию. Многие другие, сохраняя поддержку со стороны многих консерваторов, выступают против продолжения премьер-министра им."
sweden.28.a: "Хаммаршельд остаётся!"
sweden.28.b: "Хаммаршельд должен уйти!"
sweden.29.t: "Протесты против правительства"
sweden.29.d: "Отказ Короля и консерваторов удалить Хаммаршельда вызвал немедленные протесты со стороны социалистов и даже некоторых либералов и националистов, хотя ясно, почему наш выбор непопулярен, он необходим для обеспечения стабильности Швеции."
sweden.29.a: "Не обращайте внимания на них, мистер премьер-министр."

sweden.30.t: "Правительство за цивилизованность"
sweden.30.d: "Сейчас, когда премьер-министр Карла Густафа Хаммаршельда приближается к концу, настало время выбрать новое правительство, которое сможет должным образом вернуться в Швецию, не прибегая к жестокой реакции."
sweden.30.a: "Арвид Линдман, консерватор"
sweden.30.b: "Бертил Олин, Либеральный"
sweden.30.c: "Аксель Перссон-Брамсторп, аграрный сектор"

sweden.31.t: "Элмо Линдхольм критикует новое правительство"
sweden.31.d: "Формирование нового правительства по вопросам цивилизованности было встречено как с поддержкой, так и с оппозицией. Теперь лидер Национальной молодежной лиги Швеции, молодежной организации при Валмансфёрбунде, Элмо Линдхольм, заявил о своем несогласии с этим шагом, заявив, что правительство Хаммаршельда, хотя и не идеально, было более эффективным в стабилизации Швеции, чем нынешняя. Он также зол на консервативные уступки либералам и аграрным."
sweden.31.a: "Пусть он кричит..."
sweden.32.t: "Основание Национальной лиги"
sweden.32.d: "Сегодня Элмо Линдхолм, лидер Национальной молодежной лиги Швеции, объявил, что молодежная организация разорвет все связи с консерваторами и Алмена Валмансфёрбунде. Вместо этого вспышки стремятся создать новую правую партию, Сверигес Нэйелла Фёрбунд. Хотя это и не было неожиданным, следует задаться вопросом, можно ли этого избежать."
sweden.32.a: "Политика для взрослых"

sweden.33.t: "[Начало] шведские всеобщие выборы"
sweden.33.d: "Многие эксперты говорят, что это, возможно, самые важные выборы в истории Швеции, когда отдельные лица и группы как слева, так и справа практически борются за власть. Есть три возможных результата: левый уголь между социалистическими и общественными демократами, с социальной демократической партией Сверигес Социалдемократиска Парти как лидеры коалиции. Они также могут получить поддержку со стороны левых и центральных, и они могут получить дополнительную поддержку со стороны людей, которые оставили консерваторов. nin na-right cooperation между либералами и консервантами, с консервативной партией, Алмана Валмансфёрбундет, как лидеров коалиции. Есть шанс для них получить поддержку со стороны аграристов и националистов, и может получить дополнительную поддержку со стороны отдельных лиц, которые оставили консерваторов. nn-right droits между либералами и консервантами, с консервативными партиями, а последним вариантом, который находится на столе, является дальнейшая коалиция, приобретающая власть. Сегодня идеология шведских патриотиков и новостных организаций, возможно, и многие из тех, кто стремятся к х, чтобы победиться в сторону."
sweden.33.a: "Socialdemokraterna - Виктор"
sweden.33.b: "Алльманна Вальмансфёрбундет Менедж, чтобы держаться"
sweden.33.c: "Nisvenska Rörelsen Genes Support"
sweden.33.e: "Остановите выборы!"

sweden.34.t: "Премьер-министр Пехр Энгдал"
sweden.34.d: "Сегодня Пер Энгдал, лидер нового шведского движения, был назначен главой нового правительства. Этот день является историческим, поскольку Энгдал является самым молодым премьер-министром в истории Швеции. Также впервые кто-то за пределами политического образования достиг этой позиции. Пожав руки с более мелкими партиями справа, а также с радикальными консерваторами, новое правительство собрало достаточно поддержки."
sweden.34.a: "Для Новой Швеции!"

sweden.35.t: "Беспокойство против закрытых выборов"
sweden.35.d: "После прекращения выборов многие шведы протестуют против этого решения. Для многих это предвидимый конец правительства Хаммаршельда; более авторитарный и тиранический режим в Швеции. Тем не менее Карлу Густафу Хаммаршельду удалось заручиться поддержкой, чтобы остановить выборы и предоставить ему чрезвычайную власть."
sweden.35.a: "Это был единственный вариант."

sweden.36.t: "Торговые сделки с британами"
sweden.36.d: "Швеция на протяжении долгого времени была страной, экономически зависимой от немецкой торговли, однако это привело к кризису, когда эти связи были нарушены, однако за последние пару лет торговые маршруты между Швецией и Соединенным Королевством стали более прочными."
sweden.36.a: "Приятно вести бизнес"

sweden.37.t: "Смерть премьер-министра"
sweden.37.d: "Недавно из офиса премьер-министра появились ужасные новости, премьер-министр Карл Густаф Хаммаршельд мертв, хотя там есть признаки того, что стареющий генерал не будет с нами вечно, тот факт, что он умер в середине своего премьер-министра, еще больше дестабилизирует страну."
sweden.37.a: "Этого не должно было случиться!"
sweden.38.t: "Чрезвычайное положение"
sweden.38.d: "Новый премьер-министр Аксель Раппе объявил чрезвычайное положение в Швеции после смерти бывшего премьер-министра. Поскольку государство становится все более и более антагонистичным к оппозиционным деятелям, многие рассматривают это как смерть шведской демократии. Когда армия берет все больше и больше власти, появляются слухи о планируемых мятежах против государства."
sweden.38.a: "Пожалуйста, не сопротивляйтесь!"
sweden.39.t: "Красная гвардия организуется"
sweden.39.d: "Внезапная смерть главы правительства была потрясена для нации, когда военные взяли на себя большую роль, усилилась оппозиция, сейчас, сообщения о формировании Красной Гвардии по всей стране, вливаются в нее, в то же время многие считают захват власти армией переворотом, готовым противостоять ему."
sweden.39.a: "Тогда это Измена!"
sweden.40.t: "&lt; &lt; Новая Швеция &gt; &gt;"
sweden.40.d: "Многие консерваторы, националисты и другие правоэкстремисты уже перешли в это движение."
sweden.40.a: "Измена, я говорю!"

sweden.41.t: "Битва за Швецию"
sweden.41.d: "Власть и влияние правительства упали, с ростом противостоящих социалистическим красным гвардиям и националистической белой гвардии, страна попала в анархию. В этот момент на улицах Стокгольма, Гётеборга и других городов ведутся бои. Цена контролируется Швецией."
sweden.41.a: "...Новое шведское движение"
sweden.41.b: "...социалисты"

sweden.42.t: "Окончание беспорядков"
sweden.42.d: "Стратегия не отступать от социалистических волнений, будучи спорной, также была успешной, хотя и мы, и бунтовщики понесли огромные потери, покрасив ворота Стокгольма красным, оппозиция нашему правлению сейчас побеждена."
sweden.42.a: "Наконец-то эта кровопролитная баня закончилась"

sweden.43.t: "Стокгольм, захваченный Новой Швецией"
sweden.43.d: "Движение «Новый шведский» вдруг взяло под свой контроль город Стокгольм, но, несмотря на то, что мы не смогли отвергнуть их захват, мы надеемся на продолжение боевых действий и, надеюсь, победу в остальной части страны, есть слухи, что они смогли это сделать из-за иностранных сторонников и лояльности в местной полиции и вооруженных силах."
sweden.43.a: "Значит, наши собственные люди покидают нас так же хорошо?"
sweden.45.t: "Новое шведское движение &lt; &lt; Защищенный гётеборг &gt; &gt;"
sweden.45.d: "Город Гётеборг пал, символизируя конец борьбы старого правительства против Нового Шведского движения. Теперь, когда движение контролируется в однопартийном государстве, пришло время вырезать новое государство из старого. Сегодня предательский старый охранник отошел в сторону. Новое поколение шведов берет на себя ведущую роль."
sweden.45.a: "Да здравствует Новая Швеция!"

sweden.46.t: "Новые шведские протесты"
sweden.46.d: "Поскольку правительство, казалось бы, проводит более консервативные реформы и отвергает многие предложения нового шведского движения, протесты начали вестись против правительства. &quot; Нью-шведское движение &quot; встретило эти протесты с пониманием, многие националисты присоединились к правительству, даже от новых шведских членов правительства. &quot; Это будет означать конец коалиции между консервантами и националистами &quot; ."
sweden.46.a: "Но как мы можем допустить их политику?"
sweden.47.t: "Консервативные протесты"
sweden.47.d: "С учетом того, что правительство, казалось бы, проводит более националистические реформы и отвергает многие консервативные советы, многие консерваторы начали действовать против правительства."
sweden.47.a: "Предполагалось, что вы поддержите нас"

sweden.50.t: "Швеция хочет присоединиться к нашему обязательству"
sweden.50.d: "ВИП"
sweden.50.a: "Мы приветствуем их!"
sweden.50.b: "Нет, спасибо!"
sweden.51.t: "Франция приветствует нас!"
sweden.51.d: "ВИП"
sweden.51.a: "Это начало великой дружбы!"
sweden.52.t: "Франция отвергает нас!"
sweden.52.d: "ВИП"
sweden.52.a: "Мы покажем им!"

sweden.53.t: "Вопрос о монархии"
sweden.53.d: "Монархия была институтом, созданным в Швеции с викингового века, хотя она была полезной для обеспечения стабильности и сохранения нашей национальной самобытности, многие социал-демократы считают, что монархия — это устаревшая система, которая поддерживает автократические структуры. Это решение может разозлить либо социалистов, либо центристов, которые выступают против монархии и за нее, соответственно."
sweden.53.a: "Конституционная монархия, как в Италии или Соединенном Королевстве"
sweden.53.b: "Как во Франции или в Соединенных Штатах Америки"
sweden.54.t: "Либералы и консерваторы выступают против Республиканизма"
sweden.54.d: "Услышав о том, что наши лидеры будут выступать за республику, консерваторы, либералы и аграрные круги заявили о своем несогласии, что это решение, как представляется, оттолкнет нас на дальнейшее сотрудничество с несоциалистскими партиями. С другой стороны, социалистические и коммунистические лидеры официально поддержали нашу позицию."
sweden.54.a: "Мы будем настаивать на референдуме!"
sweden.55.t: "Референдум: &lt; &lt; За или против монархии &gt; &gt;"
sweden.55.d: "Сегодня мы наконец-то услышим, чего хотят люди, действительно ли они хотят конституционной монархии сегодняшнего дня, или они больше заинтересованы в либеральных идеях республики."
sweden.55.a: "...большинство хочет республику!"
sweden.55.b: "...большинство все еще хочет монархии!"
sweden.56.t: "Социалисты противостоят нашей расе"
sweden.56.d: "Услышав, что наши лидеры собирались позволить монархии жить без возражений, социалисты, вместе с некоторыми членами социальной демократии, заявили о своем несогласии. Это решение, похоже, оттолкнет нас на дальнейшее сотрудничество с социалистическими партиями. С другой стороны, у нас больше шансов работать с центристами."
sweden.56.a: "Это привело бы к слишком большой неустойчивости"

sweden.57.t: "Хаммаршельд отвергает иностранное влияние"
sweden.57.d: "Премьер-министр Карл Густаф Хаммаршельд сегодня выступил с осуждением иностранного влияния, призвав советское и валькистское влияние к дестабилизирующему воздействию на шведскую политику, обвинив британское влияние в том, что оно вызвало экономический кризис в нашей стране."
sweden.57.a: "Мы их разорвем!"
sweden.58.t: "Хаммаршельд встречается с политиками"
sweden.58.d: "Сегодня премьер-министр Карл Густаф Хаммаршельд встретился со многими политиками, большинство из которых были консервантами, а также с либералами и аграрными деятелями."
sweden.58.a: "Ты со мной или против Меня"

sweden.59.t: "Спорное решение"
sweden.59.d: "Решение пригласить членов шведского националистического Нисвенска Рёрельсена в теплое время вызвало антагонизм многих умеренных и даже нескольких консерваторов жесткой линии, которые считают это опасным сдвигом в направлении правой стороны, ставящим под угрозу наши отношения с политиками-основателями, и тем временем Хаммаршельд получил подтверждение в своем решении, надеясь умиротворить ультраправую сторону таким образом."
sweden.59.a: "Спорные, но необходимые"

sweden.60.t: "Увольнение премьер-министра"
sweden.60.d: "Когда Швеция оправится от политических, а также экономических кризисов, премьер-министру Карлу Густафу Хаммаршельду пора уйти в отставку."
sweden.60.a: "Умеренный консерватор, как профессор Багге"
sweden.60.b: "Националистский консерватор, как мистер Линдхолм"

sweden.61.t: "Манифест умеренного консерватизма"
sweden.61.d: "Консервативно руководимое правительство выдвинуло свою позицию, которая представляется гораздо более умеренной, чем предыдущие. Наряду с принятой политикой можно добиться снижения налогов, поощрения свободной торговли, сохранения сельского хозяйства, независимой и укрепленной армии, а также общей приверженности конституционной монархии, демократии и свободе. n\nAllmänna Valmansförbundet, Всеобщая избирательная лига, главная правящая партия, также была реформирована в Högerns Riksorganization, Национальную организацию правых, чтобы продемонстрировать новую тенденцию партии. Хотя этот шаг разозлил многих националистов и жестких структур внутри консерваторов, его приветствовало умеренное крыло."
sweden.61.a: "Начало новой эры!"
sweden.62.t: "Свобода и процветание"
sweden.62.d: "В то же время важно, чтобы традиции не ущемляли права и достоинство каждого гражданина Швеции, и поэтому важно, чтобы шведский народ отверг авторитаризм, как социализм, так и национализм, который стремится укрепить власть в руках политического класса."
sweden.62.a: "Ты не заслуживаешь свободы, если обмениваешь ее на безопасность."
sweden.63.t: "Демократический консенсус"
sweden.63.d: "Хотя эти встречи показали, в чем мы расходимся во мнениях, мы также смогли показать друг другу, что у всех нас есть консенсус в отношении ряда ключевых позиций, в том числе принципов демократии, свободы и конституционализма, а также что социал-демократы будут уважать конституционную монархию, если мы обещаем не предоставлять королю никакой дополнительной власти."
sweden.63.a: "Некоторый консенсус имеет важное значение"
sweden.64.t: "Работник знакомится с боссом."
sweden.64.d: "Мысль о том, что"Huvudavtalet", is that it is an agreement between the unions of the employee and the unions of the employer to set the rules on the working space. While many socialists are worried that this is an attempt to secure capitalist exploitation, we assure them that these agreements will be favorable to both sides. Beside, if the labor unions are angry of the agreement, they can issue the threat of a strike."
sweden.64.a: "Для лучшей работы"

sweden.65.t: "Полномочия короля"
sweden.65.d: "Для нас важно обеспечить конституционные права короля Густафа V как короля Швеции."
sweden.65.a: "Да здравствует король!"
sweden.66.t: "Коалиция на ножном кромке"
sweden.66.d: "Не все в безопасности в нашем коалиционном правительстве с Новым Шведским Движением. Если движение по-прежнему оказывает влияние на шведское общество, и политические разногласия между нами и ними, то это может быть опасно отдавать предпочтение либо нам, либо нам."
sweden.66.a: "Вперед!"

sweden.67.t: "Программа семейных субсидий"
sweden.67.d: "Одна из политических мер, которую проводит новое шведское движение, довольно похожа на то, что обычно можно увидеть на левом месте, это Программа семейных субсидий. Эта программа направлена на укрепление системы защиты шведских семей, поощряя их к созданию большего числа детей. Консервативные члены правительства немного подозревают в этом, поскольку она будет означать расширение расходов Швеции. Что мы будем делать?"
sweden.67.a: "Не воплощайте в жизнь схему"
sweden.67.b: "Осуществить часть этого года"
sweden.67.c: "Выполни это полностью!"

sweden.68.t: "Закон о реформе карпоратизма"
sweden.68.d: "Новое шведское движение настаивало на проведении экономической реформы в Швеции, получившее название «Закон о корпоративной реформе», который, как представляется, еще больше подталкивает нашу страну к корпоратизму в ущерб традиционному капитализму. В свою очередь, новый законопроект вызвал сопротивление как консерваторов, так и либералов. Что мы будем делать?"
sweden.68.a: "Не сдавайся."
sweden.68.b: "Есть вещи, через которые мы можем пройти."
sweden.68.c: "Выполняйте!"

sweden.69.t: "Новый шведский вопрос"
sweden.69.d: "Несмотря на то, что консервативные правительства оставляют научную область в основном ученым, Новое Шведское движение теперь оказывает давление на правительство, с тем чтобы оно осуществило список реформ, основанных на евгенике."
sweden.69.a: "Мы политисты, а не евгеники."
sweden.69.b: "Тогда нам нужно увидеть, как общество улучшится"
sweden.69.c: "Внедрение нового шведского варианта"

sweden.70.t: "Судьба монархии"
sweden.70.d: "Хотя монархия является старым и подлинным институтом шведского общества, в нашем движении есть голоса, которые хотят заменить короля могущественным лидером, похожим на немецкий фюрер. Однако это было бы очень спорным шагом, и признаки показывают, что многие внутри этого движения все еще сильные монархисты."
sweden.70.a: "Король и Отечество Едины!"
sweden.70.b: "Нам нужен только Ледар!"

sweden.81.t: "Принятие новых законов об голосовании"
sweden.81.d: "Введены в действие новые законы о выборах, в соответствии с которыми минимальный возраст для голосования снижается до 21 года."
sweden.81.a: "Каждый голос имеет значение!"

sweden.86.t: "Швеция хочет присоединиться к нашему Пакту"
sweden.86.d: "Посланник из Швеции прибыл сегодня в Берлин с интересным запросом: мир, казалось бы, движется к новой Великой войне, Швеция решила оставить свой нейтралитет. Они попросили нас войти в Штальпакт. Это может дать нам союзника против Советского Союза и лучше контролировать шведскую сталь, но некоторые беспокоятся, что шведы больше бремени, чем помощь."
sweden.86.a: "Мы приветствуем их!"
sweden.86.b: "Нет, спасибо!"
sweden.87.t: "Германия приветствует нас!"
sweden.87.d: "Наш посланник вернулся с хорошими новостями. Немцы приняли нашу просьбу присоединиться к Столпакту."
sweden.87.a: "Это начало великой дружбы!"
sweden.88.t: "Германия отвергает нас!"
sweden.88.d: "Наш посланник вернулся, к сожалению, с плохими новостями. Немцы не приняли нашу просьбу присоединиться к Столпакту, оставив нас вне своего союза. Хотя это и обидно, это также может стать поворотом к другим иностранным вариантам."
sweden.88.a: "Мы покажем им!"
sweden.89.t: "Швеция хочет присоединиться к нашему Альянсу"
sweden.89.d: "ВИП"
sweden.89.a: "Мы приветствуем их!"
sweden.89.b: "Нет, спасибо!"
sweden.90.t: "Британия приветствует нас!"
sweden.90.d: "ВИП"
sweden.90.a: "Это начало великой дружбы!"
sweden.91.t: "Британия отвергает нас!"
sweden.91.d: "ВИП"
sweden.91.a: "Мы покажем им!"

sweden.92.t: "Король укрепляет нашу связь с британской монархией"
sweden.92.d: "ВИП"
sweden.92.a: "Ура!"
sweden.93.t: "Королевский визит в Германию"
sweden.93.d: "ВИП"
sweden.93.a: "Это была честь!"

sweden.94.t: "Скандинавский паспортный союз"
sweden.94.d: "Легче въехать между странами?"
sweden.94.a: "Давайте предложим это"
sweden.94.b: "Не, неважно."

sweden.100.t: "Швеция хочет торговых соглашений"
sweden.100.d: "ВИП"
sweden.100.a: "Хорошо."
sweden.100.b: "Нет."
sweden.101.t: "Советы приняли наши торговые соглашения"
sweden.101.d: "ВИП"
sweden.101.a: "Это отличный старт для шведско-советских отношений!"
sweden.102.t: "Советы отвергают наши торговые соглашения"
sweden.102.d: "ВИП"
sweden.102.a: "Тогда мы должны справиться с кризисом в одиночку."

sweden.105.t: "Шведские выборы пролетариата"
sweden.105.d: "ВИП"
sweden.105.a: "Социалистическая партия захватывает контроль"
sweden.105.b: "Сверигес Коммунисцкая Партия остается под контролем"
sweden.105.c: "Революционеры СКП берут под контроль"

sweden.106.t: "Швеция хочет присоединиться к нашей международной организации"
sweden.106.d: "ВИП"
sweden.106.a: "Мы приветствуем их!"
sweden.106.b: "Нет, спасибо!"
sweden.107.t: "Советы приветствуют нас!"
sweden.107.d: "ВИП"
sweden.107.a: "Это начало великой дружбы!"
sweden.108.t: "Советы отвергают нас!"
sweden.108.d: "ВИП"
sweden.108.a: "Мы покажем им!"

sweden.109.t: "Швеция хочет социалистического союза"
sweden.109.d: "ВИП"
sweden.109.a: "Да, давай сделаем это!"
sweden.109.b: "Нет, мы независимы!"
sweden.110.t: "Норвегия согласна с объединением"
sweden.110.d: "ВИП"
sweden.110.a: "Отлично!"
sweden.111.t: "Норвегия отвергает унификацию"
sweden.111.d: "ВИП"
sweden.111.a: "Тогда нам нужно использовать силу"
sweden.111.b: "Прими их выбор"

sweden.115.t: "Швеция хочет социалистического союза"
sweden.115.d: "ВИП"
sweden.115.a: "Да, давай сделаем это!"
sweden.115.b: "Нет, мы независимы!"
sweden.116.t: "Дания принимает унификацию"
sweden.116.d: "ВИП"
sweden.116.a: "Отлично!"
sweden.117.t: "Дания отвергает унификацию"
sweden.117.d: "ВИП"
sweden.117.a: "Тогда нам нужно использовать силу"
sweden.117.b: "Прими их выбор"

sweden.120.t: "Союз Скандинавских Советов?"
sweden.120.d: "ВИП"
sweden.120.a: "Да здравствует Скандинавский Совет!"
sweden.120.b: "Швеция обеспечит скандинавским социалистам пребывание!"

sweden.420.d: "В 1814 году, непосредственно после Наполеоновских войн, Швеция взяла под свой контроль королевство Норвегии, и они вступили в личный союз, который продлится до 1905 года. Швеция-Норвегия оставалась нейтральной почти во всех конфликтах конца XIX века, но в это время она стала одной из самых богатых стран Европы с одним из самых высоких уровней жизни на одном из континентов. Эта блаженная изоляция разговаривалась несколько раз. Швеция-Норвегия отказалась поддерживать Данию в своей войне против Пруссии в 1864 году, которая навсегда повредила бы поддержке единой скандинавской страны. После почти века, когда Швеция и Норвегия расторгли союз в 1905 году на хороших условиях."Arbeiderpartiet" took power in Norway and ousted the Royal Family in a controversial referendum. Coming out of the ashes of the failed revolution in Sweden, Swedish conservatives rallied together against this new ideological enemy. For the last decade tensions in northern Europe have been high and in the wake of the London Stock Crash have finally reached a boiling point. The war between out nations was brutal but the Swedes have come out victorious over the revolutionaries and for the first time since 1905 our nations are one. In this ever changing world we must be strong to survive. A united Scadinavia will be too powerful for any nation to overcome! Shall we reform the union between our glorious states?"

#### NEWS EVENTS ####
swenews.1.d: "Во время Великой войны Норвегия оказалась в крайне сложном положении. В результате войны между классами Норвегии, в частности высшего и низшего классов, открылся разрыв. Многие из них прибегли к учениям Карла Маркса, и после крупного удара, произошедшего в Ольсо, Арбейдерпартиет (Партия Лабора) на следующих выборах получил значительное большинство голосов. Вскоре был проведен референдум по вопросу об отмене монархии, и 52,1% увидели это... многое к недовольству своих соседей. Не совсем недавно после победы коалиции националистов/лоялистов в Швеции стало очевидно, что Швеция стремится нарушить свою политику нейтралитета. Кампания против социализма в Скандинавии, Густаф V стремится продемонстрировать, что Швеция готова встретиться с социалистами силой."

