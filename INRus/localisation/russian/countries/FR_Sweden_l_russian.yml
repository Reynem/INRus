#### IDEAS ####

SWE_unbroken_neutrality_idea: "Непрерывная нейтральность"
SWE_unbroken_neutrality_idea_desc: "С 1814 года Швеция является страной, находящейся в состоянии мира, и с тех пор ни одна война не коснулась Королевства, и она продолжает оставаться нейтральной даже тогда, когда вокруг него сгорел мир."

SWE_sluggish_economy_idea: "Слизняковая экономика"
SWE_sluggish_economy_idea_desc: "Валькистское свержение Германской Республики, нашего крупнейшего экономического партнера после Великой войны, оказало кислое воздействие на шведскую экономику."
SWE_sluggish_economy1_idea: "Слизняковая экономика"
SWE_sluggish_economy1_idea_desc: "Валькистское свержение Германской Республики, нашего крупнейшего экономического партнера после Великой войны, оказало кислое воздействие на шведскую экономику."

SWE_revolution_and_reaction_idea: "Революция и реакция"
SWE_revolution_and_reaction_idea_desc: "Шведская политика характеризуется усилением политической поляризации. На протяжении многих лет страна, как представляется, расколота между теми, кто стремится к революционным действиям слева, и теми, кто стремится к реакционным или националистическим действиям справа, с некоторыми позициями в разумном центре. Премьер-министр Карла Густафа Хаммаршельда, который должен стабилизировать нацию, совершенно не справляется с этой задачей, что лишь ухудшает ситуацию."
SWE_revolution_and_reaction1_idea: "Революция и реакция"
SWE_revolution_and_reaction1_idea_desc: "Шведская политика характеризуется усилением политической поляризации. На протяжении многих лет страна, как представляется, расколота между теми, кто стремится к революционным действиям слева, и теми, кто стремится к реакционным или националистическим действиям справа, с некоторыми позициями в разумном центре. Премьер-министр Карла Густафа Хаммаршельда, который должен стабилизировать нацию, совершенно не справляется с этой задачей, что лишь ухудшает ситуацию."

SWE_conservative_military_idea: "Военнослужащие"
SWE_conservative_military_idea_desc: "В то время как военное влияние на политику является одной из вещей, о которой мы должны знать, существует также проблема того, как мало изменений произошло в армии. Это является результатом того, как мало ей приходится сталкиваться с боевыми действиями, но также и консервативными доктринами. Мы больше не можем быть готовы к войне XIX века, когда мы вскоре на полпути в XX веке."
SWE_armen_idea: "Военнослужащие"
SWE_armen_idea_desc: "В то время как военное влияние на политику является одной из вещей, о которой мы должны знать, существует также проблема того, как мало изменений произошло в армии. Это является результатом того, как мало ей приходится сталкиваться с боевыми действиями, но также и консервативными доктринами. Мы больше не можем быть готовы к войне XIX века, когда мы вскоре на полпути в XX веке."

