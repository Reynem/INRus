 ### Ideas
 HEJ_urban_disputes1_idea: "Неустойчивость города"
 HEJ_urban_disputes1_idea_desc: "В отличие от менее развитых внутренних районов, великие города Хеджаз являются домом сильной и прочно устоявшейся городской элиты, которая участвует в мировой экономике. Эти люди активно взаимодействуют с внешним миром, включая наших союзников, британцев, что привело к появлению в этом классе огромного количества подрывных либеральных идей, которые растут в их невыполнении перед своим королем."
 HEJ_home_islam_idea: "Охранники хаджа"
 HEJ_home_islam_idea_desc: "Дом Святых городов Мекки и Медины является присяжным долгом нашего Шарифа защищать верующих и направлять их во время их паломничества, или хаджа, в Хеджаз. Однако наряду с этим есть и значительные выгоды, поскольку наша экономика процветает благодаря ее связи с хаджем. Судоходы, караваны и моторные компании создали магазины в портовом городе Джидда, в то время как налог на пилигрим взимается с каждого мусульманина, прибывшего в наши священные места."
