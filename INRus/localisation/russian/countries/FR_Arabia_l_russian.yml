 #####Ideas - All Arabia#####
 ARA_arabic_kingdom: "Арабское Королевство"
 ARA_arabic_kingdom_desc: "Официально Арабское Королевство является единством племен и народов, восстановлением арабского достоинства после Османской эпохи. В действительности оно является хрупким. Враждебные отношения и местная преданность сохраняются, и Хашимитские государства обязаны свое существование больше британскому оружию, чем общению. Хеджаз относительно стабильен при Фейсале I, но секретные общества Сирии и зловещие иракские офицерские войска делают федерацию нестабильной. Королевство выживает благодаря британской поддержке, отзывает ее и хрупкий мир может сломаться."
 ARA_tihamah_anarchy: "Анархия Тихамы"
 ARA_surprise_attack: "Сюрприз"
 ARA_british_investments: "Британские инвестиции"
 ARA_british_investments_desc: "Арабское Королевство в значительной степени является британским творением. Британцы видят это в своих интересах для того, чтобы обеспечить переход на восток стабильной и дружелюбной Аравией. Чтобы сохранить это положение, они вкладывают огромные суммы в поддержание процветания наших королевств и верности их лидерам."
 ARA_arabic_kingdom_member: "Субкорректность Арабского Королевства"

 #####Events#####
 arabia.1.d: "В пропагандистской деятельности Арабское Королевство представлено как объединение племен и народов Аравии - союз, который может привести к новому периоду мира и независимости, который арабы не пережили с момента падения Аббасидского Калифата. Однако это предает собой реальность того, что Королевство является домом с картами, построенным на свободных основах. Реальность арабских народов заключается в том, что они не видят взора арабам так, как думают невежественные авантюры. Народы региона не имеют ничего общего с каким-либо политическим темпераментом; племенная лояльность, местные обычаи и конкурирующие личности остаются более сильными, чем любая внезапнорожденная империалистическая единение. В великом арабском Королевстве эти разногласия усугубились, а не погасли. В самой Аравии Рашид и Сауд смотрят на их предполагаемую &quot; открытую и политическую &quot; . Народы региона не имеют ничего общего с каким-либо политическим хитростью, но испытывают себя. Не только пламя старого соперства &quot; Раши-Сауэйда &quot; , который держит над головой &quot; &quot; . &quot; , &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot"

 #Collapse Events
 arabia_kingdom_end.1.d: "Последствия кризиса на Лондонском фондовом рынке были катастрофическими для британской экономики, и теперь британское правительство поспешно поворачивается своими глазами за рубеж, чтобы увидеть, где можно сократить расходы. Мы не были исключением из этого. Сегодня британская политика больше заинтересована в обеспечении безопасности дома, тогда как любая грандиозная стратегия, разработанная 20 лет назад, и в результате этого британские деньги и войска покидают Аравию в стремительном массовом исходе. ~ Несмотря на то, что многие националисты в нашем правительстве отмечают, что королевство действительно хрупко на протяжении предстоящих месяцев. Без британской поддержки Королевство может с трудом держаться вместе, а некоторые даже шепотом разрушаются всей гнилой структуры."
 #
 arabia_kingdom_end.2.d: "Последствия кризиса на Лондонском фондовом рынке были катастрофическими для британской экономики, и теперь британское правительство поспешно поворачивается своими глазами за рубеж, чтобы увидеть, где можно сократить расходы. Мы не были исключением из этого. Сегодня британская политика больше заинтересована в обеспечении безопасности дома, тогда как любая грандиозная стратегия, разработанная 20 лет назад, и в результате этого британские деньги и войска покидают Аравию в условиях быстрого массового исхода. ~Нет, наше правительство сейчас празднует, поскольку защитники хашимитского порядка в Аравии уже ушли. Теперь мы свободны вновь установить порядок на полуострове, как мы считаем нужным. В то время как многие силы готовы к борьбе, которая, безусловно, должна состояться, мы можем по крайней мере быть уверены, что нам больше не понадобится сиять обувью хашимитов."
 #
 arabia_kingdom_end.3.d: "Последствия кризиса на Лондонском фондовом рынке были катастрофическими для британской экономики, и теперь британское правительство поспешно поворачивается своими глазами за рубеж, чтобы увидеть, где можно сократить расходы. Мы не были исключением. Сегодня британская политика больше заинтересована в обеспечении безопасности дома, тогда как любая грандиозная стратегия, разработанная 20 лет назад, и в результате этого британские деньги и войска покидают Аравию в условиях быстрого массового исхода. ~Нет, реакция в Мекке была безысходной, когда Фейсал I был недоступен в течение нескольких часов после появления новостей. Однако многие в нашей стране приняли участие в праздновании. Субверсивные и республиканские элементы поддерживают то, что может свидетельствовать о разрушении хашимитского порядка в Аравии. Тем временем наше правительство реагирует с осторожностью, в то время как мы можем быть менее внимательными к Лондону и Мекке сейчас, темные силы скручивают в нашей стране, которые стремятся к нашему краху."
 #
 arabia_kingdom_end.4.d: "С испарением хашимитской гегемонии мы можем теперь обратить свои глаза на Рашидов. С тех пор, как они уничтожили второе саудовское государство в битве при Мулайде в 1891 году, они стали мешком на нашей стороне, мешающим нам реализовать судьбу - полное объединение Аравии под саудовской гегемонией."
 #
 arabia_kingdom_end.5.d: "Крошечный эмират Тихамы стал следующим домино, который упал в продолжающемся развале Арабского Королевства. Вспыхнули столкновения по поводу таможенных поступлений, при этом эмир остался бессильным, а доходы прекратились. Местные силы в настоящее время находятся в состоянии восстания, при этом многие отходят от своих постов, поскольку власть эмира рушится у него на глазах."
 #
 arabia_kingdom_end.6.d: "Крошечный эмират Тихамы стал следующим домино, который упал в продолжающемся развале Арабского Королевства. Бои вспыхнули из-за таможенных поступлений, при этом эмир остался бессильным, а доходы были прекращены. Местные силы сейчас находятся в состоянии восстания, и многие из них покинули свои посты, когда власть эмира рушится на его глазах. Несмотря на то, что для хашимитов это катастрофа, для нас, по предотвращению и возможности. Наша береговая линия между Хеджазом и Мохой была украдена у нас хашимитами с британской поддержкой почти 20 лет назад, а теперь с испарением власти Хашимиты, а британцы больше не защищают их, мы можем просто пойти в Эмират и вернуть то, что принадлежит нам."
 #
 arabia_kingdom_end.7.d: "Глупые йеменцы воспользовались хаосом в Тихаме, выдвинув свою армию в регион. Местные силы оказались бесполезными, и большинство из них покинули свои посты до надвигающихся йеменцев. Если мы хотим держать Тихаму в своих руках, мы должны быстро развернуть армию Хеджази, чтобы сохранить этот пост нашего разрушающегося Царства вместе с нами."
 #
 arabia_kingdom_end.8.d: "Война вспыхнула по всей Аравии, и хаос правит песками по всему региону. Саудовско-рашидская вражда оставила кровь на песках Центральной Аравии, в то время как в прибрежных равнинах Тихама армия Хеджази борется с отчаянной защитой от надвигающейся Королевской йеменской армии. ~Нет, это оставляет много наших людей и многих членов нашего правительства с вопросом о том, почему мы все еще привязываемся к этому неспокойному королевству. Есть страх, что мы будем захвачены насилием и анархией, и позиция нашего короля станет к этому дню еще более неуверенной. Поэтому политика обращения внутрь должна стать будущим, чтобы защитить независимое Хашимитское правление в [РООТ.Гетнаме]. ~ Нам не нужно активно отделиться и разрушать наши отношения во благо нашей семьи - просто не присутствовать на следующем заседании Арабского совета Королевства будет достаточно, чтобы Фейсал наконец понял, что его Королевство мертво."
 #
 arabia_kingdom_end.9.d: "Вспышка войны между саудовцами и Рашидами и наша борьба против йеменцев в Тихаме предвещали полный крах власти Хеджази во всем так называемом Арабском Королевстве. Несмотря на то, что на сессии Совета арабского Королевства, которая должна была быть посвящена урегулированию продолжающегося кризиса и восстановлению единства между тем, что осталось от арабского Королевства, наши братья из Ирака и Сирии не присутствовали, оставив делегацию Хеджази и Фейсала I униженными."
 #

 #####Tooltips#####


 ### National Focus
 hejaz_focus: "Дерево фокуса Hejaz"

 HEJ_dannam_no_7: "Даммам No 7" 
 HEJ_dannam_no_7_desc: "Наши американские партнеры в Восточной провинции годами бурили мало, чтобы доказать это, но их геологи по-прежнему настаивали. Они считают, что огромный нефтяной резервуар лежит глубоко под куполом Дхарана, и они погружаются в один последний, глубокий колодец - 'Даммам No 7', - чтобы доказать это. Затраты огромны, но если их азартные игры окупятся, то черное золото, обнаруженное там, не будет просто заполнять наше казначейство, оно коренным образом изменит баланс сил на Ближнем Востоке навсегда. Будущее нашего королевства может зависеть от этого единственного дреля."

 HEJ_oil_time: "Расширение добычи нефти" 
 HEJ_oil_time_desc: "Обнаружение в Даммаме было лишь началом. Мы знаем, что пески Аль-Хасы скрывают один из крупнейших запасов нефти на планете, но это богатство бесполезно, пока оно остается на земле. Мы должны полностью взять на себя обязательство по его добыче, предоставляя Аравийской компании по стандартному нефти новые концессии, безопасность их трубопроводов и государственные инвестиции для строительства глубоководного порта в Рас-Тануре. Каждая бочка, поставляемая за границу, является винтовкой для нашей армии и кирпичом для наших новых городов. Мы должны превратить эту чёрную жидкость в реальную силу."

 HEJ_grand_arab_army: "Великая арабская армия" 
 HEJ_grand_arab_army_desc: "Обещание Великого Револьта было единой арабской нацией. Теперь, когда мы объединили полуостров, мы должны создать армию, достойную этого видения. «Аль-Ииш аль-Араби» должен возродиться не как коллекция постоянных и племенных сборов Хеджази, а как «Великая арабская армия», взятая из всех уголков нашего нового королевства. Мы объединим ожесточенных воинов Неджда, горных бойцов Асира и гордых солдат Хаила в единую, современную, панарабскую армию, готовую защитить нашу родину и освободить наших братьев, все еще находящихся под колониальным ярмо."

 HEJ_build_up_najd: "Расширить Эр-Рияд" 
 HEJ_build_up_najd_desc: "Эр-Рияд, бывший побежденный в грязи крепость наших саудовских соперников, теперь является ключевой провинциальной столицей. Чтобы укрепить наше правление над Нейдом, мы должны изменить его. Мы будем инвестировать в его инфраструктуру, прокладывать дороги, копать современные колодцы и строить новые рынки и административные центры. Принося процветание и порядок в саудовскую сердечную землю, мы продемонстрируем превосходство хашимита, превратив бывший бастион фанатизма в верный и продуктивный центр нашего нового королевства."

 HEJ_build_up_hail: "Расширить Хаил" 
 HEJ_build_up_hail_desc: "Хаил, родовой дом династии Рашиди, долгое время был центром власти в северной пустыне, когда наши соперники были побеждены, мы должны обеспечить, чтобы этот город служил нашим интересам, его стратегическое положение на дороге в Ирак и Сирию жизненно важно, мы будем инвестировать в инфраструктуру города и укреплять его гарнизон, сделав его главным военным центром нашего северного командования, сильный, верный хаил будет охранять наш фланг и служить основой для любых будущих кампаний на севере."

 HEJ_najd_urban_planning: "Хашимит Эр-Рияд" 
 HEJ_najd_urban_planning_desc: "Для того чтобы действительно стереть наследие саудовцев, мы должны восстановить их столицу по нашему имиджу, Эр-Рияд будет не просто провинциальным городом, это будет ярким примером хашимитской модернизма в самом сердце пустыни, мы заложим широкие, современные пути, построим великие мечети, которые проповедуют наше терпимое видение ислама, и построим новый королевский дворец для наших губернаторов. Этот проект обновления городов будет четким, физическим заявлением: темная, пуританическая эра Саудов закончилась, и начнется новая, просвещенная эра."

 HEJ_modernisation_program: "Программа модернизации" 
 HEJ_modernisation_program_desc: "Мы объединили королевство пустыней, древних городов и различных племен. Теперь мы должны сплотить его по своей цели. Мы приступим к осуществлению всеобъемлющей программы модернизации для создания основ государства XX века. Это означает новые дороги, новые школы, новые больницы и новую бюрократию. Это грандиозная задача, требующая огромных сумм денег и иностранных знаний, но она имеет важное значение. Мы не можем вести арабский мир в будущее, если наша страна останется в ловушке в прошлом."

 SAU_import_lorries: "Импортировать грузовые автомобили" 
 SAU_import_lorries_desc: "Величайший тиран нашего королевства - это дистанция. Огромные, пустыни Руба аль-Хали и пустыни Нафуда превращают материально-техническое обеспечение в кошмар, ограничивая охват наших армий и торговые потоки. Мы должны преодолеть это расстояние машиной. Мы используем наши новые доходы от нефти, чтобы заказать огромные заказы на грузовики иностранного производства. Эти грузовики станут основой нового материально-технического корпуса, что позволит нашим войскам двигаться со скоростью и свободой, наши соперники, все еще зависящие от верблюда, не могут совпадать."

 HEJ_restoring_hashemite_dominance: "Восстановление хашимитского доминанта" 
 HEJ_restoring_hashemite_dominance_desc: "Теперь, когда сердце Аравии защищено, настало время оглянуться на север и восстановить наше право рождения."

 HEJ_subjugate_yemen: "Помоги Йемену войти в Царство" 
 HEJ_subjugate_yemen_desc: "Имамы Йемена правят разрушенной, горной землей, но они упорно противостоят нашим призывам к арабскому объединению, они цепляются за свою маленькую династию и изоляцию, создавая опасный вакуум власти на нашей южной границе. Это не может продолжаться. Если Имам не присоединится к нашему королевству дипломатически, он будет вынужден вступить в него силой. Мы пойдем на юг и заставим Сану сдаться, поставив всю Южную Аравию под наше законное правление."

 HEJ_cast_out_the_french: "Избавься от французов" 
 HEJ_cast_out_the_french_desc: "Французский мандат на ливантинском побережье является незаконной оккупацией и оскорблением для всех арабов, они разделили народ и подавленные националистические движения, с единой Аравией за спиной у нас есть силы для действий, мы вооружим сирийских националистов, профинансируем сопротивление и подготовим нашу армию к тому, чтобы идти на север и бросать французских колониалистов в море."

 HEJ_end_british_dominance: "Конец британской ближневосточной гегемонии" 
 HEJ_end_british_dominance_desc: "Британцы были и нашими покровителями, и нашими заключенными. Они вооружили наше восстание, но они также протянули границы, разделяющие наш народ в Палестине, Трансджордане и Ираке. Их «геммония» — это вежливое слово для господства. Если арабская нация действительно свободна, она не может жить под тенью иностранной империи, хотя бы «дружелюбной». Мы отменим неравные договоры, национализируем их активы и дадим понять, что эра британского господства закончилась. Ближний Восток принадлежит своему народу, а не лондонскому бюрократу."

 HEJ_cooperation_with_britain: "Соглашение с Великобританией" 
 HEJ_cooperation_with_britain_desc: "Хотя нашей конечной целью является независимость, мы должны быть прагматичными. Британцы являются доминирующей властью на Ближнем Востоке, и их дружба может предоставить нам оружие, инвестиции и безопасность, которые нам необходимы для модернизации. антагонизация их преждевременного самоубийства. Мы будем стремиться к новому, официальному соглашению с Лондоном, которое признает нас в качестве высшей державы в Аравии и уважает наш суверенитет в обмен на стабильные нефтяные уступки и сотрудничество в области региональной безопасности."

 HEJ_trucial_states_for_oil: "Морские агенты по нефти" 
 HEJ_trucial_states_for_oil_desc: "Наша дружба с англичанами дает нам уникальную возможность. Мелкие шейхомы Трусиального побережья находятся под защитой Великобритании и не имеют для них ничего общего. Однако для нас они являются арабскими землями, а для наших нефтяных компаний они обещают новые уступки. Мы ведем переговоры с британцами о том, чтобы они официально передали свои протекторы нашему королевству. В обмен мы гарантируем их нефтяным компаниям благоприятный доступ, обеспечивая новые земли для нашей короны и новые богатства для наших партнеров."

 HEJ_british_investment: "Британские инвестиции" 
 HEJ_british_investment_desc: "Наши доходы от продажи нефти огромны, но наши потребности гораздо больше. Для строительства современной нации из песка требуется инъекция капитала и опыта, которые даже мы не можем собрать в одиночку. В рамках нашего нового соглашения мы призовем волну британских инвестиций. Мы предоставим им контракты на строительство наших железных дорог, наших портов и наших телекоммуникационных сетей. Их капитал будет строить наше королевство, и наша нефть будет подпитывать их империю — партнерство в новую эру."

 HEJ_british_training2: "Принимающие британские должностные лица" 
 HEJ_british_training2_desc: "Великая арабская армия велика, но ей не хватает профессиональной работы и теоретических знаний современных европейских сил. Чтобы быть действительно равными, наши офицеры должны учиться у лучших. Мы приглашаем постоянную британскую военную миссию в наше королевство. Эти опытные офицеры, ветераны колониальных кампаний и Великой войны, создадут штабный колледж в Эр-Рияде и будут служить советниками в наших дивизиях, превращая наших отважных солдат в по-настоящему смертоносные, современные боевые силы."

 HEJ_annex_tihamah: "Конец Thihama Automony"
 HEJ_annex_tihamah_desc: "Прибрежная равнина Тихама, в том числе земли Асира, была вовлечена в наше королевство, но пока еще не является его истинной частью. Местные эмиры и племенные шейхи до сих пор правят так же, как и на протяжении веков, оказывая на словах нашу корону, скупая налоговые поступления и игнорируя наши законы. Эта автономия является реликтом прошлого. Мы официально аннексируем этот регион, делим его на новые провинции, находящиеся под непосредственным управлением губернаторов. Побережье должно быть поставлено под строгий централизованный контроль."

 HEJ_declare_hashemite_arabia: "Объявить Хашимитскую Аравию" 
 HEJ_declare_hashemite_arabia_desc: "Хашимитская семья, как Шарифы Мекки и прямые потомки Пророка, являются законными хранителями арабского народа. Наш отец Хуссейн поднял знамя Великого Арабского Револьта с обещанием единого, единого государства для всех арабов, от Алеппо до Адена. Эта мечта была предана колониальными державами и разрушена внутренними соперниками, но она никогда не погасла. Из Хеджаза, колыбели ислама, мы воздвигнем этот знаменатель еще раз. Это не завоевание, это воссоединение. Мы объявим образование Хашимитской Аравии, единого, праведного царства, с тем чтобы объединить всех арабов под нашим руководством и восстановить достоинство нашего народа."

 HEJ_into_the_world: "Обеспечение безопасности в Арабской Республике" 
 HEJ_into_the_world_desc: "Наше королевство, хотя и святое, находится в неустойчивом положении. Мы окружены амбициозными соперниками на полуострове, и великие державы Великобритании и Франции прокладывают линии в песках, как им угодно. Мы не можем в одиночку противостоять «рашидско-саудовскому приливу», одновременно сдерживая колониальные амбиции. Чтобы обеспечить наше будущее, мы должны смотреть за пределы пустыни и взаимодействовать с более широким миром. Мы отправим дипломатов в Лондон, стремясь получить гарантии нашей независимости, благоприятную торговлю и, самое главное, доступ к современному оружию, в котором мы отчаянно нуждаемся для выживания."

 HEJ_restoring_our_birthright: "Восстановление нашего права рождения"
 HEJ_restoring_our_birthright_desc: "В то время как Арабское Королевство, возможно, мертво и исчезло, арабские земли к югу от Сирии и Ирака все еще могут быть нашими."

 HEJ_pursue_arab_reunification: "Объединить Аравию"
 HEJ_pursue_arab_reunification_desc: "Время дипломатии прошло, полуостров - это раздробленная мозаика мелких шейхдомов, соперничающих династий и религиозных фанатиков. Это разделение является слабостью, которую используют наши враги. Наше право при рождении не будет дано нам; оно должно быть взято; будет мобилизована полная мощь племен Хеджази и нашей маленькой, профессиональной армии. Мы пойдем на восток в Нейд и на юг в горы Асир и Йемен. Один за другим притворцы сокрушат колено. Аравия не может быть действительно свободной или сильной, пока она не будет объединена под единым хашимитским знаменем. Мы объединим ее."

 HEJ_British_rifles: "Импортировать британские винтовки" 
 HEJ_British_rifles_desc: "Наши солдаты храбры, но храбрость - это плохой щит от современной огневой мощи. Наши арсеналы - это хаотичное сочетание устаревших оттоманцев, захваченных немецких винтовок и даже древних замков, покрытых нашими племенными сборами. Этот логистический кошмар делает невозможным снабжение и делает нашу пехоту неэффективной. Британцы, наши союзники в Великом Револьте, производят одно из лучших служебных винтовок в мире: короткий журнал Ли-Энфилд. Мы установим существенный порядок, гарантируя, что наши солдаты оснащены стандартизированным, надежным и смертоносным современным оружием."

 HEJ_european_vehicle_studies: "Европейские исследования в области артиллерийских исследований"
 HEJ_european_vehicle_studies_desc: "Огромные, открытые пустыни в Аравии — это естественный дом для мобильных боевых действий. На протяжении веков это означало верблюд и лошадь, но новая эра принадлежит двигателям внутреннего сгорания. Мы видели сообщения о бронированных машинах и легких танках, которые перерезали племенные войска в Палестине и Ливии. Наша традиционная кавалерия, гордая собой, не может противостоять пулеметам. Мы должны отправить наших лучших офицеров в Европу - в Бовингтон в Англии или в Самур во Франции - для изучения этих новых военных машин. Мы можем создать современную «потертую кавалерию», которая сочетает в себе удары по бою со стратегической скоростью наших земель."

 HEJ_traversing_our_land: "Противодействие Хиджасу"
 HEJ_traversing_our_land_desc: ""Хеджаз" - это обширная и непростительная земля. Наше небольшое население скопилось вокруг святых городов и прибрежных портов, соединенных немногим более чем столетиями верблюжьими путями. "Хеджазская железная дорога", построенная оттоманами и разгромленная полковником Лоренсом, теперь находится в наших руках. Армия не может идти без воды, а торговля не может процветать без дорог. Мы начнем национальный проект по расширению железных дорог, соединяющих Мекку, Медину и Джидду. Это не только ускорит движение паломников и товаров, но и станет жизненно важной артерией для наших армий, готовящихся к передвижению за наши границы."

 HEJ_end_of_the_kingdom_focus: "Восстановить порядок в Хеджазе"
 HEJ_end_of_the_kingdom_focus_desc: "Наше королевство построено на ненадежном фундаменте. Лояльность племен гибнет, и разрушение Арабского Королевства интерпретируется как слабость. Амбициозные шейхи, чувствуя возможность, начали облавы на наши линии снабжения и отказываются платить налоги. Дороги в Мекку небезопасны, власть короны открыто ставится под сомнение. Прежде чем мы сможем воссоединить Аравию, мы должны сначала обезопасить свой дом. Мы разверзнем армию, разрушим эти мелкие восстания, разоружим неверные племена и создадифицированные полицейские силы. Орден должен быть восстановлен, и закон короля должен быть абсолютным."

 HEJ_british_training: "Арабские офицеры в Сандхёрсте"
 HEJ_british_training_desc: "Наши племенные сборы - это бесчестные бойцы из пустыни, но они не современная армия, им не хватает дисциплины, материально-технического понимания и доктрины совместного оружия, необходимой для поражения профессиональных сил, чтобы победить наших соперников, нам нужны офицеры, которые понимают больше, чем просто племенные рейды, мы укрепим наши военные связи с Великобританией, защитим желанные места для наших самых многообещающих молодых людей в Королевской военной академии Сандхёрста, они вернутся в качестве профессионального, дисциплинированного офицерского корпуса, готовых связать наши сборы с современной армией и привести нас к победе."

 HEJ_found_council: "Нашел Мажилис аль-Вукала" 
 HEJ_found_council_desc: "Чтобы править современным государством, король не может полагаться только на неформальную аудиторию и племенные советы. Мы требуем официального, централизованного органа управления. Мы создадим «Маджилис аль-Вукала» (Совет агентов), кабинет назначенных министров, отвечающих за ведение таких специальных дел, как финансы, война и иностранные дела. Этот совет будет формировать профессиональное бюрократическое ядро Хашимитского государства, преобразуя волю короля в эффективную политику."

 HEJ_incorporate_family: "Включить семейные сети" 
 HEJ_incorporate_family_desc: "Семья Хашимитов обширна, ее филиалы и связи распространяются по всему арабскому миру. Эти семейные узы являются источником огромной мягкой силы, легитимности и доверия, с которыми не может справиться ни один назначенный бюрократ. Вместо того, чтобы отстранять наших родственников, мы официально интегрируем эти мощные семейные сети в государственный аппарат. Назначая доверенных хашимитов на ключевые посты губернаторов, послов и командиров, мы обеспечиваем лояльность администрации и осуществляем нашу власть во всех уголках королевства."

 HEJ_arabicise_civil_service: "Строительство новой гражданской службы" 
 HEJ_arabicise_civil_service_desc: "На протяжении четырехсот лет административный язык в Хеджазе был оттоманским. Законы, записи и сами бюрократы были остатками иностранной империи. Это должно прекратиться. Мы запустим всеобъемлющую программу "арабизации" гражданской службы, заменив старых османских чиновников образованными, говорящими на арабском языке геджази. Это не просто бюрократическая смена; это культурная и национальная декларация независимости, обеспечивающая, чтобы государство говорило на языке своего народа."

 HEJ_police_directorate: "Нашел Главное управление полиции" 
 HEJ_police_directorate_desc: "В настоящее время наша внутренняя безопасность обеспечивается за счет сочетания межплеменных сборов и армии, которая является неэффективной и зачастую жестокой; мы создадим современное централизованное Главное управление полиции, базирующееся в Джидде; эти офицеры пройдут подготовку по вопросам гражданского права и расследования, на которых будет возложена задача защиты городов, автомагистралей и, что самое главное, маршрутов паломничества, обеспечивающих безопасность и охрану всех граждан и посетителей."

 HEJ_ban_secret_societies: "Запрет тайных обществ" 
 HEJ_ban_secret_societies_desc: "Тени наших городов скрывают группы, которые не клянутся в верности королю или вере, политические радикалы, поддерживаемые иностранцами клетки и подрывные тайные общества встречаются за закрытыми дверями, шепчут инакомыслие и замышляют заговоры против стабильности короны."

 HEJ_establish_state_education: "Разработка государственной учебной программы" 
 HEJ_establish_state_education_desc: "На протяжении многих поколений образование в Хеджазе является исключительной сферой деятельности традиционных религиозных школ (куттаб) и частных репетиторов, хотя эта система не производит инженеров, врачей, офицеров и администраторов современного государства, мы создадим общенациональную программу обучения, которая будет сочетать религиозное и нравственное воспитание с современными науками, математикой, историей и литературой, и эта новая система создаст новое поколение преданных, образованных предметов, которые являются как верными в своей вере, так и способными строить будущее нации."

 HEJ_ministry_of_religious_affairs: "Нашел министерство по делам религии" 
 HEJ_ministry_of_religious_affairs_desc: "Как хранители Мекки и Медины, наш самый священный долг — это управление верой, это грандиозная задача, которую нельзя оставить на усмотрение специальных комитетов, мы найдем официальное министерство по делам религии, государственное учреждение, отвечающее за управление Святыми Мечетями, надзор за Улемой (солнечниками), распределение религиозных стипендий и координацию действий с управлением хаджем, которое обеспечит надлежащее, упорядоченное и справедливое управление Исламом, проецируя наше благочестие и власть на весь мусульманский мир."

 HEJ_appoint_shayk: "Назначь Шайка аль-Ислама" 
 HEJ_appoint_shayk_desc: "Улема является мощной силой в нашем королевстве, но их стипендия и влияние должны руководствоваться единым авторитетным голосом. Оттоманский Калифат исчез, его религиозная иерархия разрушена. Мы восстановим уважаемый офис Шайка аль-Ислама для Хеджаза, назначив выдающегося и верного учёного на эту должность. Этот человек будет служить высшей религиозной властью королевства, выпускать фетвы, консультировать короля и обеспечивать, чтобы религиозное учреждение говорило в согласии с государством."

 HEJ_establish_mudiriya: "Учредить Мудирию" 
 HEJ_establish_mudiriya_desc: "Наше королевство разделено на исторические области, каждая из которых имеет свои собственные ведущие семьи и традиции. Чтобы эффективно управлять, мы должны установить четкую административную иерархию. Мы будем внедрять систему "Мудирия", разделяя "Хеджаз" на официальные управления, или провинции, каждый из которых возглавляется "Мудиром" (губернатором), назначаемым непосредственно королем. Это заменит туманные, переплетающиеся лояльности старой племенной системы четкой, рациональной структурой государственной власти, обеспечивающей сбор налогов и соблюдение законов от побережья Красного моря до пустыни."

 HEJ_instate_hajj_tax: "Введение налога на хадж" 
 HEJ_instate_hajj_tax_desc: "Пастырь хадж приносит сотни тысяч верующих на наши земли каждый год. Это не только священный долг, но и наш самый большой источник дохода. В настоящее время этот доход хаотичен, который взимается через сеть неофициальных сборов, племенных сборов и «пожертвований». Мы отменим эту старую систему и введем единый официальный налог на хадж. Этот налог, который справедливо взимается с паломников за услуги, безопасность и санитарию, обеспечит государству стабильный, предсказуемый и огромный поток доходов для финансирования нашей армии, бюрократии и модернизации."

 HEJ_mecca_urban_planning: "Нашел Комиссию городского планирования в Мекке" 
 HEJ_mecca_urban_planning_desc: "Мекка - это сердце мусульманского мира, но ее древние, узкие улицы подавлены паломниками, что создает опасность и угнетает, и, чтобы быть достойными нашей роли Хранителей, мы должны привести порядок в этот священный город, мы найдем новую Комиссию по городскому планированию, укомплектованную нашими лучшими архитекторами и инженерами, которая будет заниматься модернизацией инфраструктуры Мекки: расширением дорог, созданием санитарных систем, строительством новых общежитий и обеспечением безопасности и комфорта для миллионов людей, откликнувшихся на призыв хаджа."

 HEJ_pacify_hejazi_bedouin: "Умиротворить бедуина Хеджази" 
 HEJ_pacify_hejazi_bedouin_desc: "Бедуинские племена Хеджаз, будучи храбрыми, являются законом для самих себя: они уважают только своих шейхов, нападают на соперничающие племена и караваны пилигримов по своему желанию и платят налоги только при принуждении силой; современное государство не может быть построено на основе этой анархии; мы начнем всеобъемлющую кампанию по умиротворению бедуинов: разоружение враждебных племен, раскапывание новых колодцев и предоставление земли для содействия обустройству; их верность должна быть доставлена, оплачена или обеспечена; возраст кочевого царя уже истек; возраст государства начинается."

 HEJ_directorate_for_motor_transport: "Управление автомобильного транспорта" 
 HEJ_directorate_for_motor_transport_desc: "Верблюд, корабль пустыни, служил нашему народу в течение тысячелетий, но его время проходит. Автомобиль - грузовик и автомобиль - могут пересечь пустыню за некоторое время, перевозив больше товаров и товаров, чем сто верблюдов. Для использования этой новой технологии мы создадим специальное управление по автомобильному транспорту. Этот орган будет отвечать за импорт транспортных средств, содержание государственного парка, подготовку водителей и механиков. Грузовик станет новой основой материально-технического обеспечения нашей армии и торговли нашей нации."

 HEJ_cooperate_with_airlines: "Сотрудничество с иностранными авиалиниями" 
 HEJ_cooperate_with_airlines_desc: "Наша позиция на побережье Красного моря делает нас естественной станцией для новых «летающих лодок» и дальних авиалайнеров, соединяющих Европу с Востоком. Авиакомпании, такие как британские «Имперские авиалинии», отчаянно стремятся к заправке прав на заправку и аэродромов в регионе. Мы будем приветствовать их. Сотрудничая с этими иностранными компаниями, мы получаем не только новый источник доходов, но и доступ к современным авиационным технологиям, метеорологическим данным и началу нашей современной инфраструктуры аэропорта."

 HEJ_reopen_foreign_consulates: "Возобновить работу иностранных консульств" 
 HEJ_reopen_foreign_consulates_desc: "Во время хаоса восстания и последующих войн большинство иностранных держав закрыли свои консульства в Джидде, оставив наше королевство изолированным, и это должно быть отменено. Нам нужны официальные дипломатические связи с великими державами для обеспечения нашего суверенитета, поощрения торговли и управления сложными делами своих граждан, которые приезжают на хадж. Мы отправим официальные приглашения в Лондон, Париж, Рим и другие ключевые столицы, пригласив их воссоздать свои консульства и признать наше королевство постоянным и стабильным членом мирового сообщества."

 HEJ_gifts_and_donations: "Нашел Директорат по дарам и пожертвованиям" 
 HEJ_gifts_and_donations_desc: "В качестве хашимитского короля и Шарифа Мекки, богобоязненные мусульмане со всего мира посылают нам огромные суммы в виде подарков, пожертвований и религиозных пожертвований (вакуф). Это богатство в настоящее время поступает по десяткам неофициальных каналов. Мы создадим государственное управление для управления этим потоком «мягкой силы». Это управление будет активно привлекать пожертвования от богатых мусульман за рубежом, управлять благотворительными трестами и обеспечивать, чтобы эти деньги использовались на благо государства, финансирование мечетей, школ и содержание Святых городов."

 HEJ_state_visits: "Посещение государством верных" 
 HEJ_state_visits_desc: "Мы приступим к серии громких государственных визитов в основные столицы исламского мира - Каир, Багдад, Дамаск и, возможно, даже Дели и Карачи; встречаясь с соотечественниками-королями, президентами и религиозными лидерами, мы проецируем нашу власть, напомним им о нашей священной роли Хранителей и наладим личные отношения, необходимые для создания будущего панарабского союза под нашим руководством."

 HEJ_pursue_arab_unification: "За единство арабских государств" 
 HEJ_pursue_arab_unification_desc: "Наш отец, Шариф Хуссейн, не зажег пламя Великого арабского револьта, чтобы только править Хеджазом, он сделал это, чтобы освободить всех арабов от иностранного правления. Его мечта о едином, едином государстве остается нашим самым священным наследием. Хеджаз, будучи колыбелью нашей веры и языка, является естественным ядром для этой новой, возрожденной арабской нации. Мы официально объявим о нашей политике, направленной на объединение всех арабских земель, отправив наших агентов и дипломатов сплотить народ полуострова, Леванта и Месопотамию на наш хашимитский знаменатель."

 HEJ_incorporate_gulf_states: "Восстановление Ордена в бывших государствах Британского залива"
 HEJ_incorporate_gulf_states_desc: "Из-за ухода Великобритании из Персидского залива прибрежные шейхдомы и эмираты оказались в состоянии хаоса. Эти мелкие государства, которые давно привыкли к «защите» Великобритании, вступают в в вражду между собой и уязвимы для иностранных хищников. Как высшая держава в Аравии, мы должны восстановить порядок. Мы распространим нашу защиту на Залив, включив их в нашу хашимитскую сферу. Их жемчужное рыболовство и потенциальные нефтяные богатства будут желанным дополнением к нашему королевству."

 HEJ_incorporate_central_arabia: "Восстановить Орден в песках Аравийских" 
 HEJ_incorporate_central_arabia_desc: "Нейд, огромное, засушливое сердце нашего полуострова, это земля анархии и фанатизма, в которой доминируют наши соперники. Дом Сауда и Рашиды Хаил проповедуют учение о нетерпимости и охоте на наших караванов. Рашид-Саудовский прилив - это смертельная угроза нашему королевству и истинному, терпимому исламу, который мы представляем. Мы пойдем на восток, в пески Центральной Аравии, чтобы уничтожить эту угрозу, восстановить порядок и поставить Нед и его племена под законное правление хашимитов."

 HEJ_intcorporate_asir_state: "Мир в Асире" 
 HEJ_intcorporate_asir_state_desc: "Горный район Асир, расположенный на юге страны, давно является беззаконной границей, его племена, пойманные между нами, йеменцами и саудовцами, не знают мира, мы положим конец этой нестабильности, мы вмешаемся в Асир, либо с помощью дипломатии, либо с помощью силы, чтобы создать там стабильное правительство, твердо соответствующее нашим интересам, обеспечение нашей южной границы является критически важным шагом, прежде чем мы сможем сосредоточиться на более серьезных угрозах на севере и востоке."

 HEJ_nationalise_hejaz_railway: "Национализация англо-хеджазской железнодорожной магистрали" 
 HEJ_nationalise_hejaz_railway_desc: "Железная дорога Хеджаза, главная артерия нашей страны, была перестроена со значительным иностранным капиталом, в частности со стороны Великобритании, и, хотя мы признательны за эти инвестиции, мы не можем позволить нашему главному стратегическому активу оставаться в руках иностранных властей, железная дорога имеет решающее значение для перемещения войск, снабжения наших городов и перевозки паломников хаджа, мы издадим указ о национализации, захватим полный контроль над англо-хеджазийской железной дорогой и всеми ее активами, ее прибыли и будущее будут направляться народом Хеджази и будут направлены ему."

 HEJ_arabian_transport_company: "Нашел Аравийскую транспортную компанию" 
 HEJ_arabian_transport_company_desc: "В то время как управление железных дорог и моторных перевозок занимается основными артериями, нам нужна специальная организация для управления повседневным передвижением людей и товаров. Мы создадим "Арабскую транспортную компанию", субсидируемую государством компанию, получив монополию на автобусные маршруты между городами и грузовые автомобили. Эта компания соединит наши малые города, устроит стандартизацию тарифов и обеспечит надежный транспорт как для паломников, так и для торговцев и солдат, превратив различные части нашего королевства в единую, мобильную экономику."

 HEJ_rolls_royce_contract: "Контракты с Rolls Royce" 
 HEJ_rolls_royce_contract_desc: "Великая война в пустыне доказала высшую ценность бронированного автомобиля. Бритиш Роллс-Ройс , в частности, доказала, что она является долговечной и смертоносной машиной, пригодной для быстрого, широкомасштабного патрулирования нашей местности. Британское правительство и рота Роллс-Ройс придут к нам за контрактом на несколько таких бронированных автомобилей, которые станут ядром новой современной кавалерии, дающей нашей армии скорость и огневую мощь, необходимые для умиротворения племен и охраны наших протяженных границ."

 HEJ_encourage_domestic_factories: "Поощрять бытовое производство" 
 HEJ_encourage_domestic_factories_desc: "Наше королевство почти полностью зависит от импорта иностранных товаров за все современные товары, от винтовок и форменной одежды до медикаментов и консервированных продуктов питания, что является смертельной стратегической слабостью. Мы должны начать длительный процесс создания отечественной промышленной базы. Это будет предусматривать государственные субсидии, субсидии на землю и налоговые льготы для любого предпринимателя, иностранного или отечественного происхождения, готового построить первые фабрики в Хеджазе. Мы начнем маленькую текстильную фабрику, консервную фабрику, цементные заводы, но это семена, из которых наша будущая сила будет расти."

 HEJ_mines_and_ships: "Управление горнорудной промышленности и судоходства" 
 HEJ_mines_and_ships_desc: "Наша экономика опирается на два столпа: паломничество и Красное море. Наша земля, по слухам, хранит древние, забытые минеральные богатства, в то время как наш порт в Джидде является нашим воротами в мир. Мы создадим новое Управление горнорудной промышленности и судоходства для развития обоих видов. Этот орган закажет геологические исследования для поиска золота, фосфатов и меди при одновременном модернизации нашей торговой морской и портовой инфраструктуры, с тем чтобы мы могли с пользой переправлять эти ресурсы на иностранные рынки."

 HEJ_reopen_gold_mines: "Возобновить открытие Махда ахда Дхахаба" 
 HEJ_reopen_gold_mines_desc: "Древние легенды и римские записи говорят о сказочно богатом золотом руднике в самом сердце нашей земли, известном как «Краде золотых» — Махд ахд Дхахаб. На протяжении веков этот рудник сломан. Наши геологические исследования подтвердили, что эти легенды правдивы. Мы приведем иностранных инженеров и современное оборудование, чтобы вновь открыть эту древнюю рудник. Богатство, исходящее от него, наполнит государственную казну, давая нам средства, чтобы заплатить нашим солдатам, построить нашу инфраструктуру и обеспечить нашу независимость."

 HEJ_expand_jeddah_shipping: "Расширение грузоперевозок в Джидде" 
 HEJ_expand_jeddah_shipping_desc: "Джидда - это лёгкое наше королевство, порт, через который должны протекать все паломники, торговля и все современное оружие. Но он мал, его гавань неглубокая и его причалы недостаточны для современных пароходов. Этот узкий порт удушает наш рост. Мы начнем крупный проект по расширению порта, дноуглублению глубоководного канала, строительству новых волноводов и строительству современных пристаней и складов. Большой, более эффективный порт в Джидде является ключом к раскрытию экономического потенциала нашей страны."

 HEJ_military_affairs_directorate: "Управление по военным вопросам" 
 HEJ_military_affairs_directorate_desc: "Наши вооруженные силы - это коллекция племенных сборов, городские гарнизоны и маленькая «Шарифская армия». Командование раздроблено, и поставки отсутствуют. Для ведения современной войны против наших соперников нам нужна профессиональная, единая военная структура. Мы создадим Директорат по военным вопросам, центральный персонал, отвечающий за организацию армии в рамках официальных дивизий, управление вербовкой, стандартизацию подготовки и надзор за всей сетью поставок. Это будет мозг нашей новой современной армии."

 HEJ_jeddah_coast_guard: "Ввести в действие береговую охрану Джидды" 
 HEJ_jeddah_coast_guard_desc: "Красное море — это наша кровь, но его длинная малонаселенная береговая линия — это убежище для контрабандистов, пиратов и торговцев оружием. Эти преступники угрожают нашей торговле и бросают вызов нашему суверенитету. Мы создадим береговую охрану Джидды, новую службу быстрого, вооруженного патрулирования. Их задача будет состоять в том, чтобы охранять наши территориальные воды, пресекать контрабандистов, защищать рыболовные районы и обеспечить безопасность нашей морской границы, как и нашей сухопутной границы."

 HEJ_sharifian_naval_school: "Школа военно-морских наук Шарифа" 
 HEJ_sharifian_naval_school_desc: "Патрульные катера бесполезены без обученных экипажей и компетентных офицеров. Наш народ - жители пустыни, с небольшими традициями современного мореплавания. Для создания профессиональных морских сил мы должны сначала создать школу для их подготовки. Мы создадим Шарифскую школу военно-морских наук в Джидде, которая будет заниматься преподаванием навигации, морской техники и оружия. Эта академия создаст первое поколение военно-морских офицеров Хеджази."

 HEJ_dockyards_of_jeddah: "Докьярды Джидды" 
 HEJ_dockyards_of_jeddah_desc: "Корабль в море - это обесценивающий актив, без внутреннего порта для ремонта, ремонта и перезарядки наших судов, наша новая береговая охрана быстро упадет в тупик, полагаясь на дорогие иностранные верфи, мы должны быть самодостаточными, мы сконструируем первые современные верфь в Джидде, полную стюардесса, машино-машин и сухогрузов, способных обслуживать наши патрульные лодки и, возможно, в один прекрасный день построить собственные корабли."

 HEJ_weapons_commission: "Комиссия по приобретению оружия" 
 HEJ_weapons_commission_desc: "Наша армия вооружена мотли-коллекцией оружия, оставшегося у дюжины разных стран. Это логистический кошмар. Нам нужен профессиональный орган для управления нашими военными закупками. Мы создадим новую Комиссию по приобретению оружия, укомплектованную самыми острыми офицерами и дипломатами. Их задачей является обследование глобального рынка оружия, выявление лучших винтовок, артиллерийских орудий и пулеметов, которые мы можем купить, и заключение контрактов на обеспечение того, чтобы наша армия была оснащена современным, стандартизированным и эффективным оружием."

 HEJ_jeddah_munitions: "Создание завода по производству боеприпасов в Джидде" 
 HEJ_jeddah_munitions_desc: "Винтовка - это всего лишь кусок стали без пули, мы полностью зависим от иностранного импорта для каждого гильзы, используемой нашей армией. Во время войны эту линию снабжения можно было бы перерезать, оставляя наших солдат беззащитными. Эта стратегическая уязвимость неприемлема. Мы построим наш первый завод по производству боеприпасов в Джидде, который сначала будет простой сборочный завод, но который сможет производить боеприпасы для стрелкового оружия, с которыми наша армия должна бороться. Самодостаточность боеприпасов является первым шагом на пути к подлинной военной независимости."



 HEJ_disband_tribal_militia: "Наследие арабского револьта" 
 HEJ_disband_tribal_militia_desc: "Великий арабский револьт был побежден слабой коалицией племен Хеджази, мощной силой, связанной личной преданностью нашему отцу, но эта эра закончилась. Эти ополчения - это двойной меч: их верность шейхам, а не государству, и методы их неподходящие для современной войны, они истощают казначейство и представляют угрозу для центральной власти. Мы официально благодарим их за их службу, за то, что они заплатили должное и распустили эти нерегулярные силы. Будущее нашего королевства должно быть защищено национальной армией, а не разрозненной межплеменной верностью."

 HEJ_al_jeish_al_arabi: "Фонды современной армии" 
 HEJ_al_jeish_al_arabi_desc: "После роспуска племенных военизированных формирований мы должны создать подлинное, профессиональное военное подразделение, заложить основы для «Аль-Иш аль-Араби» — Арабской армии, которая будет в централизованном порядке оплачиваться, иметь единообразное оснащение и готовиться по современной доктрине лучшими офицерами, которые мы можем найти, будь то из наших рядов или из наших союзников за рубежом, и эта армия будет обязана своей верностью лишь короне Хашимитского моря и станет инструментом нашей национальной воли, готовым защитить наши границы и объединить полуостров."

 HEJ_decentralized_command: "Децентрализованное армейское командование" 
 HEJ_decentralized_command_desc: "Пустыни в Аравии обширны, и связь затруднена. Жесткая, централизованная командная структура, как и те, кому отдается предпочтение в Европе, является помехой. Единственная банда рейдеров может проникнуть в нашу границу и проникнуть вглубь нашей территории, прежде чем наша центральная штаб-квартира в Мекке даже не сможет отреагировать. Мы примем гибкую, децентрализованную командную доктрину, наделяя наших местных командиров гарнизонов и полевых офицеров тактической автономией, с тем чтобы они могли незамедлительно реагировать на угрозы по своему усмотрению. Скорость и инициатива станут нашими величайшими преимуществами."

 HEJ_regulate_conscription: "Регулировать обязанность" 
 HEJ_regulate_conscription_desc: "Наш резерв рабочей силы в настоящее время основан на древней традиции племенных сборов, шейх обещает определенное число бойцов. Эта система ненадежна, непредсказуема и плохо подходит для современного государства. Мы заменим ее национальным, регулируемым законом о призыве. В каждом регионе и городе будет установлена квота, и все трудоспособные мужчины будут зарегистрированы на службу. Это обеспечит нашу новую армию стабильным, предсказуемым и справедливым снабжением рабочей силой, преобразуя нашу армию из племенного хостинга в настоящую армию нации."

 HEJ_arabian_horsemanship: "Арабский всадник" 
 HEJ_arabian_horsemanship_desc: "В то время как европейские армии торгуют своими лошадьми за грузовики, мы знаем, что на нашей местности лошадь все еще король, мы будем инвестировать в нашу кавалерию, сохраняя гордые традиции арабского всадника и оснащая эти подразделения быстродействующей пехотой, они будут нашими глазами и ушами в пустыне, нашими силами быстрого реагирования и террором наших врагов."

 HEJ_camel_corps: "Расширить корпус верблюдов Хеджази" 
 HEJ_camel_corps_desc: "Лошадь может быть быстрой, но верблюд — это настоящий корабль пустыни. Верблюд может путешествовать несколько дней без воды, нести огромные грузы и пески, которые остановят грузовик или даже лошадь. Наш существующий верблюжья корпус является жизненно важным достоянием для дальнего патрулирования и глубоководной материально-технической базы пустыни. Мы расширим его, оснащаем эти подразделения современными пулеметами и средствами связи, создадируя уникальное арабское боевое подразделение, способное проецировать нашу мощь в самые отдаленные и неспокойные уголки полуострова."

 HEJ_royal_guard: "Расширить Королевскую гвардию" 
 HEJ_royal_guard_desc: "В королевстве изменяющейся межплеменной верности личная безопасность короля является основой национальной стабильности, у нас должна быть сила, чья лояльность является абсолютной и неоспоримой, мы будем расширять Королевскую гвардию, выбирая лучших, высочайших и преданных своему делу солдат из племен и семей, наиболее преданных хашимитской династии, они получат лучшую подготовку, лучшее снаряжение и привилегированный статус, которые будут служить личными защитниками короля и элитным пражским резервом для армии."

 HEJ_standardised_weapons: "Стандартизированное огнестрельное оружие" 
 HEJ_standardised_weapons_desc: "Армия, которая не может делиться боеприпасами, это армия, которая обречена на провал. Наши силы в настоящее время являются хаотичным арсеналом оттоманских маузеров, британских энтфилдов из Револьта, французских винтовок и племенных мушкетов. Это материально-техническая невозможность. Мы должны выбрать одно, современное и надежное огнестрельное оружие, подобно британскому SMLE, в качестве нашего стандартного служебного винтовки. Мы установим основной порядок и переоснащаем всех солдат в нашей новой армии, обеспечивая эффективное и действенное снабжение наших сил на местах."

 HEJ_hejazi_flying_corps: "Нашел летающий корпус Хеджази" 
 HEJ_hejazi_flying_corps_desc: "Следующая война не будет выиграна только на земле. Самолет — это новая «высокая земля», революционное оружие, которое предлагает беспрецедентную разведку и силу нанести глубокий удар за вражеские линии. Маленькие, энергичные военно-воздушные силы могут засечь вражеские племенные собрания, прежде чем они станут угрозой и терроризируют линии снабжения в открытой пустыне. Мы официально найдем флот Хеджази, приобретем наши первые несколько самолетов и начнем поиски смелых молодых людей, готовых стать первыми соколами Хеджаза."

 HEJ_hawker_fury_deal: "Сделка с Хокером Фьюри" 
 HEJ_hawker_fury_desc: "Наш новый Летающий корпус нуждается в действительно современном перехватчике. Бритиш Хокер Фьюри, вероятно, самый лучший в мире борец с бипланами — быстрый, невероятно энергичный и удивительный инженер. Мы будем использовать наши дипломатические связи с Лондоном, чтобы заключить сделку с эскадрильей этого великолепного самолета. Хранение боевика, который может превзойти все, что могут сделать наши региональные соперники, даст нам немедленное и неоспоримое воздушное превосходство и станет мощным символом современной жизни нашего королевства."

 HEJ_taif_airbase: "Создание авиабазы Ta'if" 
 HEJ_taif_airbase_desc: "Военно-воздушные силы бесполезены без дома. Прибрежный город Джидда влажный и уязвим к военно-морской атаке. Вместо этого мы построим нашу главную авиабазу в высотном городе Таиф. Его холоднее, сухий климат идеально подходит для технического обслуживания самолетов и функционирования двигателей, и его стратегическое центральное местоположение позволит нашим самолетам с такой же легкостью напасть на восток в Неджд или на юг в направлении Йемена. Таиф станет гнездом, из которого будут летать наши новые соколи."

 HEJ_medina_academy: "Нашел Медианскую авиационную академию" 
 HEJ_medina_academy_desc: "Иностранные пилоты и механики - дорогие наемники, их лояльность неуверена, действительно независимые военно-воздушные силы должны быть в состоянии обучить свою собственную, мы создадим Мединскую авиационную академию, специальную военную школу для отбора и подготовки пилотов, мореплавателей и наземных экипажей, которая станет сердцевиной нашей новой службы, обеспечивающей постоянный запас хорошо подготовленных патриотических летчиков, готовых защищать небеса королевства."
















