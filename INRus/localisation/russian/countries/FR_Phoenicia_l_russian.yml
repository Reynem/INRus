 LEB_emile_edde: "Эмиль Эдде"
 LEB_emile_edde_leader_desc: "Эмиль родился 5 мая 1886 года в Дамаске, его семья была маронитами, которые работали переводчиками в местном французском консульстве на протяжении двух поколений. В раннем возрасте он переехал в Бейрут и стал студентом в иезуитской миссионерской школе, прежде чем поехать во Францию и получить степень доктора права. В отличие от его семьи Эмиль был гораздо более политически активным, становился страстным ливанским националистом и очень сочувствовал сионизму. После возвращения Эмиля из Франции он присоединился к Либераторам и модернистскому обществу реформ им. После окончания Великой войны Османской империи Эмиль был вынужден вернуться в Ливан, где он вместе со своими новыми товарищами был вынужден убежать в Александрию, где он поддерживал Энтенте, рассматривая их как потенциальных освободителей угнетенного ливанского народа. Несмотря на то, что после окончания войны Эмильс Александрия Клике, надеясь на то, что этот народ будет продолжать строить новую нацию, несмотря на то, что Эмильс Александри Клик, как Фенский штат во французской гели, вновь взялся в Бейрут, с охважаясь с новыми мечтами, и с новымии, и надеждами, несмотря на то на то, что Эми на то, что Эмилес, Эли Эмилесан крепает на с его с его с его с его сего сего сего сего сего сего сего сего сего, как сего сего, как сего, как на мона, как на слава, как на страну, как на страну, на страну, как на страну, на страну, как на страну, на страну, как на страну, на страну, на страну, на страну, на страну, на страну, на страну, на страну, на страну, на страну, на страну, на которую он, набирается и на страну, на нее, на нее, на страну, на нее, на нее, на нее, где он, набирается и на нее, на нее, на нее, на нее, на нее, на нее, на нее, на нее, на нее, на нее, на нее, на нее, на нее, на нее, на нее, на нее, на нее, на нее, на нее, на нее, на нее, на"
 
