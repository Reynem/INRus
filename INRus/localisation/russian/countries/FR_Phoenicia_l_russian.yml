#Start Screen
PHN_FUHRERREICH_DESC: "Из всех различных победителей и проигравших Великой войны никто не видел таких крайних изменений состояния, как ливанское маронитское христианское население. Не только Большому Ливану, но и обширным землям Западной Сирии и турецким землям вокруг Айнтаба (теперь Хантаба). Это произошло за счет вассалажа французам, цена Эмиля Эдде "Александрия Клик" была более чем готова заплатить. Иностранные угрозы растут, с крепнущей Турцией на севере и панарабским королевством на востоке, в то время как негодование правящего меньшинства продолжает расти в сельской местности. Время покажет, становятся ли марониты хозяевами Леванта или обречены стать просто еще одной группой меньшинства."

#Tree
#Demographics
PHN_the_demographic_issue: "Демографический кризис"
PHN_the_demographic_issue_desc: "Годы напряженности между этническими меньшинствами в нашей стране вышли из-под контроля после крушения Лондонского фондового рынка."

PHN_bipartite_state: "Двустороннее государство"
PHN_bipartite_state_desc: "Бедствие поразило нашу страну, и только радикальные решения помогут предотвратить полный крах. Настало время для нас принять ветры перемен и принять нашу суровую реальность. Наша нация состоит из различных этнических групп, которые ненавидят наше правление, стремятся к свободе и равному представительству в правительстве. Мы согласимся с их требованиями и будем настаивать на самоуправлении посредством автономии и умиротворения их нынешних обстоятельств. Только тогда мы можем надеяться на сдерживание огня, который может поглотить нашу страну."
PHN_syrian_autonomy: "Истинная сирийская автономия"
PHN_syrian_autonomy_desc: "Первым шагом в обеспечении соответствующего продвижения этого процесса является предоставление нашим сирийским братьям региональной автономии, что позволит им сформировать региональные советы со своими избранными руководящими должностными лицами, которые будут управлять своей провинцией и сотрудничать с нашим правительством в вопросах правления страны, что позволит нам облегчить наше административное бремя и обеспечить, чтобы сирийцы чувствовали себя в равной степени представленными в государстве."
PHN_recognise_arab_identity: "Признать арабскую самобытность"
PHN_recognise_arab_identity_desc: "Пока наша нация существовала, идея панарабизма существовала у наших граждан, которые хотели бы присоединиться к своим братьям на востоке. Слишком долго мы угнетали эти идеи нашими мечтами о новой финикийской самобытности. Хотя мы не откажемся от таких надежд, мы признаем как финикское, так и арабское наследие нашего народа. Хотя это может оттолкнуть радикальных финикианистов, мы должны признать, что все наши народы имеют общее наследие и что, как мы надеемся, мы сможем продвигаться вперед как единая нация."
PHN_and_unite_against_turks: "Организация &lt; &lt; Объединение против турок &gt; &gt;"
PHN_and_unite_against_turks_desc: "В то время как наша страна сгорает, когда наш народ ссорится друг с другом за превосходство, турки смотрят на наше ослабленное государство, как голодные стервятники, готовясь в любой момент нанести удар и установить контроль над своей ранее потерянной землей."
PHN_druze_autonomy: "Автономия друзов"
PHN_druze_autonomy_desc: "Народ Друза выделяется как одна из уникальных общин в нашем регионе, которая не придерживается учений христианства и ислама, предпочитая прилепляться к себе и к своим собственным эзотерическим путям."
PHN_appease_orthodox: "Одобрять православные общины"
PHN_appease_orthodox_desc: "Поддерживая огромные позиции в нашей стране, православные христианские общины соперничают с мусульманскими сторонниками за финансовую поддержку своей религии и влияния в регионе, и мы возьмем их на свою сторону, финансируя строительство новых православных церквей в регионе."
PHN_protections_in_sayda_and_trablus: "Защита в Сайде и Траблусе"
PHN_protections_in_sayda_and_trablus_desc: "Мы должны обеспечить, чтобы суннитские мусульманские общины в Большом Ливане были довольны нашим правлением и поэтому должны обеспечить автономию."
PHN_reorganising_phoenicia: "Реорганизовать [PHN. GetName]"
PHN_reorganising_phoenicia_desc: "Наше правительство и его административные ветви будут переработаны в попытке построить новую политическую машину, которая будет служить нации и обеспечивать ее национальную целостность в будущем."
PHN_switzerland_of_the_middle_east: "Швейцария Ближнего Востока"
PHN_switzerland_of_the_middle_east_desc: "Тем не менее Швейцария, разделенная на немцев, французов, итальянцев и римлян, является мирной и не страдает от этнической розни, многие из которых привязывают это к своей организации в качестве федеральной системы многочисленных кантонов, и, применяя эту систему к нашей стране, мы можем лишь надеяться найти подобие мира в другом хаотичном регионе."
PHN_austria_hungary_of_the_middle_east: "Ближневосточное агентство Организации Объединенных Наций для помощи палестинским беженцам и организации работ"
PHN_austria_hungary_of_the_middle_east_desc: "Хотя это видно только на страницах истории, в 1867 году австрийская элита успешно превратила мятежную венгерскую часть Империи в лояльную, приведя венгерскую элиту в элитные слои и реорганизовав государство, чтобы признать это."
PHN_lebanese_independence: "Независимый Ливан"
PHN_lebanese_independence_desc: "Достаточно того, что ливанская идентичность не может быть успешно сохранена ни в двухпартийном, ни в финикском государстве."
#
PHN_maronite_dominance: "Маронитное доминирование"
PHN_maronite_dominance_desc: "Закрепив наше правление в течение 16 лет, мы не откажемся от своей позиции перед теми, кто враждебно относится к нашему народу и мечтает об объединенной Феникии."
PHN_occupy_syria: "Военное право в Сирии"
PHN_occupy_syria_desc: "В связи с беспорядками, происходящими по всей Сирии, военные гарнизоны будут развернуты в крупных городах и сельской местности, с тем чтобы стабилизировать нашу ситуацию и обеспечить нашим гражданам подобие мира и порядка."
PHN_close_arabist_organisations: "&lt; &lt; Закрыть арабские организации &gt; &gt;"
PHN_close_arabist_organisations_desc: "Слишком долго панарабские националисты нарушали мир на наших землях, пропагандируя волнения с их чуждыми им идеями о едином арабском супергосударстве, и это больше не будет продолжаться, диссидентские организации, которые присоединяются к панарабскому движению, будут вынуждены закрыться, а любые остатки будут ликвидированы, с тем чтобы устранить любые сохраняющиеся беспорядки."
PHN_enforce_relgious_laws: "Принудительное применение религиозных законов"
PHN_enforce_relgious_laws_desc: "Чтобы закрепить наше господство в правительстве, будут соблюдаться законы, защищающие наше христианское население, и при этом будут еще больше укрепляться во франкоязычном секуляризме в правительстве, при этом будут ограничены некоторые виды религиозной одежды и внезаконное исполнение религиозных законов."
PHN_clamp_down_on_turks: "Зажим на турецких националистов"
PHN_clamp_down_on_turks_desc: "Северная граница Хантаба всегда оставалась нетронутой, при этом большинство турецкого населения презирало наше правление и демонстрировало это посредством гражданского протеста и даже случайного насилия. С течением времени это переросло в полное повстанческое движение, которое желает освободиться от нашего суверенного правления. Этот акт насилия против нашего государства будет встречен с равной реакцией, и мы развернем военные силы, чтобы полностью обеспечить наше правление в регионе. Очистить земли любого турецкого сопротивления и обеспечить, чтобы наша власть над регионом была обеспечена раз и навсегда. Независимо от издержек, цели оправдывают средства. В регионе, столь опасном, как Левант, выживают только сильные, а слабые погибают."
PHN_enforce_segregation: "Сегрегация по юридическим основаниям"
PHN_enforce_segregation_desc: "Для решения этой проблемы на постоянной основе мы издадим законы, утвержденные государством, с тем чтобы отделить многочисленные этнические и религиозные группы от их отдельных территорий, а физическое разделение обеспечит пространство для дыхания, которое предотвратит межгрупповое насилие в нашем родном регионе, с тем чтобы раз и навсегда сократить масштабы насилия на наших землях."
PHN_crush_orthodox_political_organisations: "Сочувствующие SSNP"
PHN_crush_orthodox_political_organisations_desc: "С учетом нынешней угрозы захвата власти другими политическими партиями с помощью других, более незаконных методов, ССНП, будучи светской сирийской националистической организацией, находит свою поддержку более сектантским образом, при этом наше православное христианское население оказывает им большую поддержку, будут предприниматься усилия по борьбе с вокалистыми православными священниками и приверженцами, связанными с ССНП, и их ликвидации с политической сцены, взяточничество, подделка их незаконной деятельности в антигосударственной деятельности и другие недостойные тактики будут использоваться для ослабления контроля ССНП над нашим правительством, обеспечения того, чтобы секуляризация была полностью введена в действие без какого-либо внутреннего вмешательства."
PHN_maronite_conscription: "Маронитная награда"
PHN_maronite_conscription_desc: "Чтобы компенсировать нехватку преданных людей в наших рядах, мы найдем наш храбрый маронитский народ для того, чтобы вступить в армию, принуждая к обязательному увеличению призыва на военную службу, чтобы заполнить ряды способных людей, которые готовы служить нашему народу и его интересам."
PHN_population_exchange_with_hashemites: "Обмен населением с нашими соседями"
PHN_population_exchange_with_hashemites_desc: "Мы избавимся от любой экстремистской бродяги, которая в противном случае только вызовет больше неприятностей и обеспечит жизнь управляемого населения."

#Army
PHN_vanguard_of_levant: "Авангард Леванта"
PHN_vanguard_of_levant_desc: "Гордость наших военных и защитников наших наций состоит из гарнизонных французских солдат и местных отрядов милиции, некоторые из которых до сих пор остаются спортивным снаряжением от Великой войны и не имеют никакой организации между ними, с ростом напряженности во всем мире и нашими соседями, готовящимися к новому конфликту, настало время для того, чтобы мы поспешили и сдвинулись вперед в будущее. Наша военная теория будет преобразована в хорошо отработанную машину, и наши люди будут обеспечены лучшим оборудованием, которое они смогут получить. Левант никогда не поколебится до тех пор, пока наши солдаты будут высокими."
PHN_vanguard_of_levant_syr: "Эль-Джейс в качестве Сури"
PHN_vanguard_of_levant_syr_desc: "Наши военные отчаялись от чрезмерной опоры французских вельмож, потому что наши люди стали мягкими, а наше снаряжение застыло, у нас не будет никаких шансов против стервятников, которые ежедневно вторгаются в нас, пришло время удалить чрезмерный жир из наших военных, реформировать нашу военную доктрину и ввести новое снаряжение для наших солдат, показать нашим сирийским мужчинам, за что они борются, и предоставить им инструменты, необходимые для того, чтобы обеспечить наше место на Ближнем Востоке как нового гегемона."
PHN_artillery_innovation: "Новые артиллерийские кусочки"
PHN_artillery_innovation_desc: "С каждой битвой, с которой мы сражались в XX веке, артиллерийские снаряды переполнялись по полям, подобно грому во время бурного шторма. Пока наши люди работают на полях, мы не можем забывать о важности артиллерии и ее практическом использовании для оказания помощи нашим наземным силам в борьбе с различными угрозами, будут предприниматься усилия по приобретению новых артиллерийских орудий у членов нации Энтент, их инженеризации, с тем чтобы они соответствовали нашему климату и применимости к нашим войскам."
PHN_new_rifles: "Современная винтовка"
PHN_new_rifles_desc: "Солдат на поле боя молится за многое, и один из них заключается в том, что его оружие не заклинило в самый худший момент. Наш нынешний арсенал устарел по сравнению с тем, что есть у наших иностранных конкурентов, пора выровнять край. Наши французские властелины получат химикаты, чтобы разработать вариант их винтовок, внести необходимые изменения, чтобы обеспечить его надежность и качество в трудной местности Леванта, дать нам возможность предоставить наши оружейные средства, которые будут служить нам в предстоящие годы."
PHN_support_companies: "Поддержка наших людей"
PHN_support_companies_desc: "В то время как любая группа людей с оружием способна сражаться, чтобы действительно выиграть войну, нужно подготовить свои полки, чтобы следить за оборудованием и не допустить, чтобы наша армия шла в путь к голоду, инженеры, которые выкапывают траншеи, чтобы мы могли использовать их в качестве прикрытия, и сигналить разведывательным командам, чтобы они передавали вражескую позицию, прежде чем они этого ожидают. Будут приложены активные усилия для финансирования наших вспомогательных компаний, заполнения наших рядов специальными званиями, которые могут оказать столь необходимую помощь нашей неорганизованной банде."
PHN_follow_french_doctrine: "Следуйте французской доктрине"
PHN_follow_french_doctrine_desc: "Именно французы выиграли Великую Войну, используя свою доктрину, хитроумных генералов, которые твердо держатся за свои линии обороны, и настойчивость французов бороться за свою нацию, лишь разумно использовать ту же тактику, что и наш повелитель, чтобы обеспечить надежную победу против тех, кто может выступить против нас. Французские военные советники будут привезены на наши земли, чтобы научить офицеров их тактике, солдаты будут тренироваться так же, как и наши французские коллеги, и мы можем надеяться достичь такого же уровня военной компетентности и эффективности, что превратит наши военные силы в дееспособную боевую силу."
PHN_our_own_doctrine: "Наша собственная доктрина"
PHN_our_own_doctrine_desc: "Поля Вердуна и Сомма - ничто по сравнению с горными хребтами в Хантабе или огромными пустынями в Сирии. Чтобы выжить в этот новый век, мы должны адаптировать и усовершенствовать новые методы войны, которые позволят нам сохранить преимущество над нашим противником. Местные офицеры и генералы будут диктовать курс действий и обучение наших людей, чтобы быть готовыми к предстоящим конфликтам. Ибо если мы действительно хотим построить непревзойденную армию в Леванте, мы должны избавиться от нашей зависимости от французов и нанять простого Феонецию для того, чтобы править военными делами."
PHN_tackling_the_levant: "Борьба с левантом"
PHN_tackling_the_levant_desc: "Большинство наших земель заполнено засушливыми пустынями, неопощадным созданием природы, которая сжигает тех, кто не знает, как выжить, но для армии это часто смертный приговор, если он не подготовлен к нему, отсутствие инфраструктуры и суровый климат, создающий проблемы как для наших людей, так и для материально-технического обеспечения армии; настало время для того, чтобы мы могли адаптироваться к той обстановке, которую нам дали; обучение пустыням является обычной практикой для наших реформированных сил, которым придется выдержать суровую погоду; больше внимания будет уделяться материально-техническому обеспечению наших генералов, с тем чтобы помочь им справиться с проблемами снабжения, которые станут очевидными перед лицом войны."
PHN_reduce_reliance_on_french: "Уменьшить зависимость французских войск"
PHN_reduce_reliance_on_french_desc: "Мы стали толстыми и мягкими с питанием французских гарнизонов, которые на протяжении последних 16 лет защищали нас от любой внешней и внутренней угрозы, чтобы превратить наши военные в дееспособную силу, необходимо пойти на жертвы, чтобы достичь профессиональной силы, которую никто не будет соперничать, мы начнем распускать французские полки, присутствующие в нашей стране, отправляя их домой вместе с французскими офицерами и заменяя их нашими собственными людьми."
PHN_new_tanks: "Разработка цистерн"
PHN_new_tanks_desc: "Великая война привела к изобретению танков, стальных колесниц, которые были практически неуязвимыми и окутанными прямо через траншеи Западной Европы. Хотя их использование на фронте было ограниченным и их эффективность была сомнительной из-за технических ограничений в то время. Новые ссылки подтолкнули войну к новым высотам, так что настало время для нас подтолкнуть к этим аспектам, чтобы обеспечить технологический предел над нашими врагами."  
PHN_combined_arms_warfare: "Война с комбинированным оружием"
PHN_combined_arms_warfare_desc: "Современная война заключается не только в наличии большого числа сил, но и в объединении различных элементов и типов сил для содействия обрезанию противника."
PHN_fortify_north: "Укрепить Север"
PHN_fortify_north_desc: "Несмотря на то, что Север не заражён, он горный и высокооправдан, если он падает, то и остальная часть нашей страны, и мы должны быть уверены, что этого никогда не произойдет."
PHN_study_turkish_military: "Изучайте военный [TUR.Adquestive Cap]"
PHN_study_turkish_military_desc: "Не секрет, какую угрозу для нас представляют турки, ибо они сами произносят это!"
PHN_intensify_rifle_production: "Активизировать производство винтовок"
PHN_intensify_rifle_production_desc: "Изучение иностранных методов производства позволит нам вооружать наших людей все более быстрыми темпами, что позволит большему числу людей на местах защитить нашу молодую нацию."
PHN_mountains_of_lebanon: "Противостояние горе Ливан"
PHN_mountains_of_lebanon_desc: "Ядром нашей нации является Большой Ливан, страна гор и вершин, и наличие специальных подразделений, пригодных для ведения боевых действий на этой местности, позволит нам с легкостью защищаться от любого врага, используя обычные силы."
PHN_enlarge_army: "Идеал между гражданами и солдатами"
PHN_enlarge_army_desc: "Если наш народ не будет с готовностью браться за оружие против какого-либо захватчика или тирана, то мы не заслуживаем выживания."
PHN_modern_army: "Армия XX века"
PHN_modern_army_desc: "Мы уже не устаревшая армия XIX века, мы армия современного века, равная любой европейской силе!"
PHN_fortify_east: "Укрепить Восток"
PHN_fortify_east_desc: "Наша восточная граница с Сирией является длинной и открытой. Растущая волна арабского национализма угрожает в любой момент. Мы должны построить современную линию крепостей, бункеров и противотанковых позиций в долине Бекаа, чтобы обезопасить нашу границу."
PHN_fortify_south: "Укрепить Юг"
PHN_fortify_south_desc: "Мы создадим ряд укрепленных армейских постов и наблюдательных высот вдоль южных холмов для сдерживания любых вторжений и контрольных движений."
PHN_fortify_coast: "Укрепить побережье"
PHN_fortify_coast_desc: "Наши предки были хозяевами моря, но это море делает нас уязвимыми к военно-морскому вторжению. Мы модернизируем старые прибрежные батареи, защищающие Бейрут, Триполи и Тира, чтобы ни один вражеский флот не мог угрожать нашим сердечным землям."
PHN_fortify_northwest: "Укрепить Северо-Запад"
PHN_fortify_northwest_desc: "Граница с итальянской территорией горная, но пористая."
PHN_fortify_northeast: "Укрепить Северо-Восток"
PHN_fortify_northeast_desc: "Хантаб и прилегающие к нему территории на северо-востоке находятся в опасном положении, особенно для наших амбициозных турецких соседей, нападение с этой стороны может разорвать наши жизненно важные прибрежные территории, и для обеспечения безопасности этого фланга мы приступим к осуществлению крупного крепостного проекта, предусматривающего строительство бетонных бункеров, артиллерийских позиций и противотанковых позиций для защиты региона и обеспечения того, чтобы любой захватчик дорого заплатил за каждый дюйм финикийской земли."
#Air
PHN_Air_Force: "Военно-воздушные силы"
PHN_Air_Force_desc: "Современное государство нуждается в современных военно-воздушных силах, хотя мы маленькая нация, небо над нашей родиной должно быть нашим."
PHN_Air_Force_syr: "Небо Сирии"
PHN_Air_Force_syr_desc: "Мы будем расширять наши военно-воздушные силы, подготавливая их к наступательным операциям против наших соседей."
PHN_french_aircraft: "Французские воздушные суда"
PHN_french_aircraft_desc: "Наши французские покровители производят один из лучших самолетов в мире, мы попросим Парижа создать первую эскадрилью истребителей Моран-Саулнье и бомбардировщиков Потеза."
PHN_modern_fighters: "Современные бои"
PHN_modern_fighters_desc: "Бипланы Великой Войны устарели, мы должны приобрести современные, монопланированные истребители, такие как Dewoitine D.500 или даже Morane-Salnier M.S.406."
PHN_copy_french_doctrine: "Принять французскую доктрину"
PHN_copy_french_doctrine_desc: "Французская армия воздушной обороны имеет хорошо разработанную доктрину воздушной войны, и мы отправим наших лучших офицеров в их академии, чтобы они изучили свою тактику, уделяя особое внимание методическим операциям и воздушному превосходству."
PHN_french_cas: "Наземная поддержка Франции"
PHN_french_cas_desc: "В любом будущем конфликте наша армия будет нуждаться в поддержке с воздуха, мы будем следовать французской модели, приобретая многофункциональные самолеты, подобные Потезу 25, чтобы действовать в качестве «летающей артиллерии» для наших сухопутных войск."
PHN_air_acedemy: "Воздушный академий"
PHN_air_acedemy_desc: "Мы создадим нашу собственную Национальную авиационную академию на авиабазе Раяк, подготовив новое поколение финикских пилотов, преданных только нашему штату."
PHN_RADAR_Stations: "Осматриваю наши небеса"
PHN_RADAR_Stations_desc: "Эта новая технология "Радио Обнаружения и Рангинга" может дать нам жизненно важное преимущество. Мы вложим средства в создание сети экспериментальных радиолокационных станций вдоль побережья и горы Ливан, что даст нам раннее предупреждение о любой воздушной атаке."
PHN_airbases_lebanon: "Аэропорты в Ливане"
PHN_airbases_lebanon_desc: "Наши несколько аэродромов являются наследием французов, и мы должны построить новые современные воздушные базы вблизи наших крупных городов и стратегических пунктов в Ливане для размещения наших растущих военно-воздушных сил."
PHN_airbases_north: "Аэропорты на севере"
PHN_airbases_north_desc: "Мы будем строить новые военные аэродромы на севере, давая нашим бомбардировщикам и боевикам возможность нанести удар по Сирии и Турции."
PHN_local_aircraft: "Наши собственные самолеты"
PHN_local_aircraft_desc: "Нация, которая не может вооружиться, не является действительно независимой. Мы создадим маленький государственный авиационный мастерский, чтобы собрать и в конечном итоге проектировать наши собственные самолеты."
PHN_modernise_aircraft: "Модернизация воздушных судов"
PHN_modernise_aircraft_desc: "Мы будем вкладывать значительные средства в научные исследования, сосредотачивая внимание на создании лицензий на современные иностранные проекты и разработке наших собственных усовершенствованных вариантов."
PHN_our_doctrine: "Доктрина"
PHN_our_doctrine_desc: "В то время как французская доктрина является хорошей отправной точкой, наша ситуация уникальна, мы будем разрабатывать нашу собственную доктрину, сосредоточившись на оперативном реагировании, патрулировании прибрежных районов и решающих миссиях по наземным нападениям в соответствии с нашими небольшими профессиональными силами."
PHN_increase_production: "Фонд воздушной промышленности"
PHN_increase_production_desc: "Наши новые авиационные мастерские нуждаются в массовой инъекции государственных средств. Мы обеспечим их расширение, предоставляя капитал, необходимый для перехода от сборки к полномасштабному производству."
#Navy Tree
PHN_phoenecian_navy: "ВМС"
PHN_phoenecian_navy_desc: "Кровь величайших моряков в истории течет в наших венах, что у нас нет военно-морского флота, и мы восстановим нашу морскую мощь, начиная с небольших прибрежных сил обороны."
PHN_phoenecian_navy_syr: "ВМС"
PHN_phoenecian_navy_syr_desc: "Наши предки правили Средиземным морем, как и мы. Наши военно-морские амбиции не просто оборонительны. Мы построим флот, способный доминировать на Левантском побережье и проецировать нашу мощь через море."
PHN_beirut_shipping: "Бейрутское судоходство"
PHN_beirut_shipping_desc: "Порт Бейрута является нашим воротами в мир, и мы будем вкладывать значительные средства в расширение его гражданских доков и судовых верфей, создание крупного торгового морского флота для того, чтобы подпитывать нашу экономику и обеспечивать резерв обученных моряков."
PHN_ship_designs: "Проектирование французских судов"
PHN_ship_designs_desc: "У наших кораблей нет опыта работы с современными военными кораблями, и мы обратимся к нашим французским союзникам, покупая чертежи для их эсминцев и подводных лодок, чтобы начать нашу военно-морскую программу."
PHN_modernise_designs: "Дизайны судов"
PHN_modernise_designs_desc: "Мы не можем вечно полагаться на иностранные дизайны. Мы создадим военно-морское проектное бюро, передав нашим инженерам задачу адаптации французских планов к нашим конкретным потребностям, приоритезации скорости и огневой мощи для прибрежных операций."
PHN_memories_of_carthage: "Воспоминания о карфагене"
PHN_memories_of_carthage_desc: "Дух Ханно и Хамилькара зовет нас, мы дети Карфагена, наследников могущественной морской традиции, и это национальное возрождение вдохновит наших моряков и судостроителей, подкрепляя нашу решимость вернуть свою морскую судьбу."
PHN_navy_of_the_future: "ВМС будущего"
PHN_navy_of_the_future_desc: "Боевые корабли — это прошлое; будущее — это скорость и неожиданность. Мы будем инвестировать в новые технологии военно-морской авиации и передовых подводных лодок, стремясь построить небольшой, но технологически более высокий флот."
PHN_defending_the_levant: "Защита леванта"
PHN_defending_the_levant_desc: "Наша главная обязанность — защищать нашу родину. Мы сосредоточимся на доктрине береговой обороны, используя быстрые торпедные лодки, шахтёры и подводные лодки, чтобы сделать наши берега непроницаемой крепостью."
PHN_new_dockyards: "Расширение судостроения"
PHN_new_dockyards_desc: "Для того чтобы построить настоящий флот, нам нужны настоящие верфи, мы будем финансировать масштабное расширение военно-морских объектов в Бейруте и Триполи, сооружение новых скользящих путей и сухожилий, способных построить современные эсминцы."
PHN_land_and_strike: "Земля и забастовка"
PHN_land_and_strike_desc: "Наши предки колонизировали Средиземное море, нападая с моря, мы будем обучать корпус элитных военно-морских пехотинцев, руководя амфибийными операциями, чтобы посадить наши войска на любой враждебный берег."
PHN_doctrine_finalisation: "Дальнейшее изучение доктрины"
PHN_doctrine_finalisation_desc: "Наши военно-морские офицеры изучили французскую и британскую тактику, но теперь они должны объединить их в уникальную финикскую доктрину."
#Industry
PHN_industrial_expansion: "Экономика [PHN. Getname]"
PHN_industrial_expansion_desc: "Экономический кризис, в котором оказалась наша страна, находится в предыдущем состоянии. Французское влияние можно увидеть во всех аспектах нашего гражданского и военного секторов. Наш повелитель ввел чрезмерное налогообложение, чтобы сохранить свои земли на пропитании, а военный гарнизон, финансируемый здесь, поддерживается Францией, установил монополию в нашем регионе, не имея возможности процветать местным компаниям. В результате у нас остались остатки того, что нам обычно приходилось инвестировать в нашу страну. Однако это не помешает нам использовать остающиеся средства для продвижения вперед в направлении экономически независимой Феонеции."
PHN_lebanese_development: "Развивающиеся страны Большого Ливана"
PHN_lebanese_development_desc: "Для обеспечения нашего экономического развития будут предприняты активные усилия по созданию основ нашей промышленности, благодаря некоторым стратегическим инвестициям в нашу инфраструктуру, мы можем приступить к расширению наших гражданских служб в регионе, и благодаря таким улучшениям в нашем руководящем регионе необходимые шаги по обеспечению промышленного роста позволят нам добиться успеха в развитии Ливана."
PHN_modernize_the_countryside: "Модернизация сельских районов"
PHN_modernize_the_countryside_desc: "Активная торговля в Бейруте резко контрастирует с нищетой в сельских районах гор и долины Бекаа. Слишком долго наши внутренние районы остаются без внимания, полагаясь на устаревшие методы ведения сельского хозяйства и не имея базовой инфраструктуры. Для того чтобы наше новое финикийское государство было действительно современным, его процветание не может быть прекращено на побережье. Эти национальные усилия обеспечат финансирование строительства дорог, школ и линий электропередачи, преобразование сельских районов и объединение нашей нации."

PHN_decouple_the_lebanese_pound_from_franc: "Отсечь [PHN. Get Adquestive Cap] фунт от франка"
PHN_decouple_the_lebanese_pound_from_franc_desc: "Несмотря на то, что наша дружба с Францией является основой нашего государства, наша экономическая судьба не может вечно приковываться к их. [PHN.Getadentive Cap] Pund, привязанный непосредственно к французскому франку, делает нашу экономику уязвимой перед любым политическим кризисом и рыночным крахом в Европе. Чтобы быть поистине суверенной нацией и подражать коммерческому мастерству наших предков, мы должны расчленить нашу валюту. Это позволит нам установить нашу собственную денежно-кредитную политику и управлять мировыми рынками на наших собственных условиях."

PHN_expand_la_lainaire: "Расширить национальную сеть &lt; &lt; Лайниер &gt; &gt;"
PHN_expand_la_lainaire_desc: "Тканевая мельница "Ла Лайниере" является краеугольным камнем нарождающейся промышленности, наследием французских инвестиций, которые в настоящее время обеспечивают сотни жизненно важных рабочих мест, однако в настоящее время она работает не в полную силу, обеспечивая государственные контракты и финансирование крупного расширения, мы можем превратить эту единственную фабрику в сердцевину новой национальной текстильной промышленности, что уменьшит нашу зависимость от иностранного импорта и предоставит одежду для растущего населения."

PHN_introduce_cash_crops: "Уделение особого внимания доходному сельскому хозяйству"
PHN_introduce_cash_crops_desc: "В прошлом наш сельскохозяйственный сектор был заперт в ловушке, а не в торговле. Это не финикийский путь. Наша земля, в частности плодородная долина Бекаа и прибрежные равнины, способна производить гораздо более ценные товары. Мы предпримем национальную инициативу, направленную на поощрение выращивания товарных культур: цитрусовых, табачных и мульбериевых рощах для нашей шелковой промышленности. Мы будем выращивать не только для того, чтобы есть, но и для торговли."

PHN_riches_of_the_cedar: "Богатство кедара"
PHN_riches_of_the_cedar_desc: "Мощный кедр — это эмблема нашей нации, древний ресурс, на котором наши предки строили свою морскую империю. Великие леса срубились, но они не исчезли. Мы введем в действие программу национального лесоводства, защищая древние рощи при выращивании новых. Это станет устойчивым источником ценной древесины для наших верфей и строительной промышленности, превратив наш национальный символ в столп нашей национальной экономики."

PHN_international_investments: "Европейские инвестиции"
PHN_international_investments_desc: "Крупнейшим достоянием нашей страны, как и в древности, является наше положение как перекрестка торговли. Мы являемся естественным каналом, через который европейский капитал может попасть на Ближний Восток. Эта инициатива позволит создать новые «зоны свободной торговли» в Бейруте и Тире, предлагая налоговые льготы и правовую защиту любой иностранной корпорации, желающей инвестировать в нашу страну. Мы превратим Феникию в финансовый и торговый центр Леванта, финансируемый европейским капиталом."

PHN_a_defence_industry: "Расширение ливанского производства оружия"
PHN_a_defence_industry_desc: "Нация, которая не может вооружаться, это не нация, а протекторат. Наша безопасность в настоящее время полностью зависит от французских поставок оружия. Это уязвимость, которую мы не можем себе позволить. Этот план обеспечит государственное финансирование для создания национального арсенала, расширения существующих военных мастерских, чтобы начать лицензированное производство винтовок, минометов и боеприпасов."

PHN_a_defence_industry2: "Дальнейшее расширение производства оружия"
PHN_a_defence_industry2_desc: "Наш первый арсенал предоставляет винтовки и пули, но современная армия нуждается в зубах. Следующий этап индустриализации будет посвящен тяжелым вооружениям. Мы будем искать иностранных специалистов и вкладывать значительные средства в новые литейные и сборочные линии, способные производить полевую артиллерию, противотанковые орудия и бронетранспортеры. Наша безопасность должна быть гарантирована нашими собственными руками."
PHN_lebanese_wineries: "Ливанские ванные"
PHN_lebanese_wineries_desc: "Благодаря французскому присутствию в нашей стране бейрутская культура стала одной из форм выпивки вина, рассматриваемой как признак изощренности. &lt; &lt; Буастинг &gt; &gt; такие компании, как &lt; &lt; Домейн де Турель &gt; &gt; и &lt; &lt; Шато Мусар &gt; &gt; , открывая ливанскую винную индустрию на международный рынок, безусловно, поставят нас на карту и будут весьма прибыльными."
PHN_expand_beirut_uni: "Поддержка Американского университета Бейрута"
PHN_expand_beirut_uni_desc: "Американский университет Бейрута является интеллектуальной короной нашей страны. В то время как наши политические связи связаны с Францией, АУБ обеспечивает жизненно важную связь с более широким миром и англоязычной сферой науки и букв. Это символ нашей космополитической самобытности и магнит для самых ярких умов Леванта. Мы предоставим Университету новую национальную хартию и предоставим щедрое государственное финансирование для расширения его инженерных и медицинских факультетов, обеспечивая наше место в качестве центра инноваций в регионе."
PHN_eastern_med_harbour: "Расширить Бейрутский порт"
PHN_eastern_med_harbour_desc: "С 1887 года порт Бейрута является нашим воротами в мир, и мы должны обеспечить его сохранение."
#
PHN_developing_hantab: "Развитие [344. Найти имя]"
PHN_developing_hantab_desc: "[344. GetName] был перекрестком империй, но он остается слаборазвитым, омраченным Бейрутом. Мы вложим государственные средства в улучшение инфраструктуры окружающего города, что создаст новый торговый центр и обеспечит вторую артерию для нашей торговли."
PHN_hantab_supplies: "Центры снабжения в Хантабе"
PHN_hantab_supplies_desc: "С развитием хантаба и строительством новых укреплений &lt; &lt; Хантаб &gt; &gt; становится критическим военным узлом, однако армия не может бороться без пуль и хлеба, мы сконструируем сеть современных, крупномасштабных складов снабжения и логистических центров в регионе, обеспечивая полную поставку, восстановление и поддержание наших гарнизонов на границе в течение длительного конфликта."

#
PHN_developing_syria: "&lt; &lt; Развитие Сирии &gt; &gt;"
PHN_developing_syria_desc: "Сирийские внутренние районы представляют собой обширные внутренние районы нашего финичского государства, его Алеппо является древним центром торговли, а его равнины плодородны. Мы должны полностью интегрировать этот регион в наше новое государство, развивая его сельскохозяйственный потенциал и промышленный потенциал. Процветание побережья должно сопровождаться процветанием внутренних районов."
PHN_beirut_to_aleppo_railway: "Модернизация Бейрута до железнодорожной магистрали Алеппо"
PHN_beirut_to_aleppo_railway_desc: "Текущая железная дорога, соединяющая Бейрут с Алеппо, является реликвией эпохи Оттомана, медленной, неэффективной и подверженной разрушению. Эта жизненно важная экономическая артерия должна быть модернизирована. Мы будем финансировать замену старого пути, выпрямление ветряных участков и покупку новых, более мощных локомотивов. Быстрое и надежное взаимодействие между нашими двумя крупнейшими коммерческими центрами имеет важное значение."
PHN_eastern_mountain_rail: "Железнодорожные пути через Джебель эш-Шарайех"
PHN_eastern_mountain_rail_desc: "Антиливанские горы, «Джбель эш-Шар'ийех», представляют собой огромный барьер между нашим прибрежным сердцем и сирийским внутренним пространством. Чтобы действительно объединить наше государство и обеспечить быстрое перемещение товаров и войск, мы должны преодолеть эту местность. Этот амбициозный проект позволит прорваться через горы новые железнодорожные линии, соединяющие Дамаск непосредственно с прибрежной сетью."
PHN_sell_off_land: "Продажа неприбыльных компаний и земли"
PHN_sell_off_land_desc: "Государство унаследовало обширный портфель оттоманских мастерских, заводов и сельскохозяйственных объектов, многие из которых являются неэффективными и неприбыльными. Они представляют собой утечку для государственного казначейства. В подлинном финикическом духе торговли мы ликвидируем эти активы, продадим их частным инвесторам. Это введет капитал в экономику, сократит государственный бюджет и поставит эти ресурсы на более продуктивное использование."
PHN_ghab_project: "Проект &quot; Габ &quot;"
PHN_ghab_project_desc: "Габская равнина, покрытая оронтами, представляет собой обширную болотистую болотистую заболоченную местность, изобилующую болезнями и непригодную для сельского хозяйства. Однако, с точки зрения зрения зрения, она может быть преобразована. Этот монументальный инженерный проект позволит осушить и восстановить всю равнину. Замкнув реку, мы сможем искоренить малярию и создать тысячи акров новых плодородных сельскохозяйственных угодий, превратив пустыню в хлебную корзину нации."
PHN_prepare_for_autarky: "Приготовиться к Автарки"
PHN_prepare_for_autarky_desc: "Будучи небольшим государством в опасном мире, чрезмерная опора на внешнюю торговлю является важнейшей слабостью, хотя мы и участвуем в торговле, мы также должны быть готовы стоять в одиночестве, в рамках этой программы будут определены ключевые стратегические ресурсы, которых нам не хватает, и будут выделены средства на создание отечественной промышленности, начиная от стали и кончая химическими веществами, для их производства, мы построим самодостаточную экономику, способную выдержать любой шторм или блокаду."
PHN_arab_science: "Нашел инженерный факультет в Алеппо."
PHN_arab_science_desc: "В то время как в Бейруте есть АУБ, великому городу Алеппо не хватает современного центра технического обучения, чтобы подпитывать индустриализацию сирийского интерьера, мы должны развивать местные таланты, мы найдем новый инженерный факультет в университете Алеппо, посвященный подготовке следующего поколения инженеров, топографов и архитекторов, которые будут строить наше новое государство."
PHN_military_production: "Сирийская военная промышленность"
PHN_military_production_desc: "Наш национальный арсенал в Бейруте является небольшим и уязвимым. Сирийский внутренний центр с его промышленным центром в Алеппо является идеальным местом для нового безопасного военно-промышленного комплекса. Мы создадим новые оружейные заводы, расположенные далеко от побережья и предназначенные для производства артиллерии, боеприпасов и транспортных средств для [PHN.GetAdquesty] Армии [PHN.GetAdestive]."
PHN_allepo_cotton: "Хлопок Алеппо"
PHN_allepo_cotton_desc: "Эти равнины, расположенные вокруг Алеппо, были известны своим высококачественным хлопком на протяжении веков. Это ресурс, который мы не смогли в полной мере использовать. Мы предоставим государственные субсидии, современное орошение и сельскохозяйственные знания, чтобы резко увеличить выращивание хлопка. Это «белое золото» станет основным экспортом и накормит наши собственные выращивающие текстильные мельницы."
PHN_support_syrian_textile_industry: "Поддержка сирийской текстильной промышленности"
PHN_support_syrian_textile_industry_desc: "С бумом в хлопке Алеппина, безумно экспортировать все это в качестве сырья, мы должны построить отечественную текстильную промышленность, чтобы совместить их, которая обеспечит капитал и стимулы для строительства новых вращающихся заводов и ткацких заводов в Алеппо, превратив сырой хлопок в готовую ткань и создав тысячи промышленных рабочих мест."
#Political
PHN_the_future_of_lebanon: "Будущее [PHN. Getname]"
PHN_the_future_of_lebanon_desc: "Наше государство было создано под присмотром Франции, возрождение древней самобытности, но кем мы станем? Станем ли мы космополитической торговой республикой, лояльным протекторатом, сирийским народом или семя новой финикийской империи? Мы стоим на перепутье, и путь, который мы выберем сейчас, определит саму душу нашей нации и судьбу нашего народа."
#
PHN_french_takeover: "Военный мандат Франции"
PHN_french_takeover_desc: "Бедствие произошло дважды: сначала свергнутое ССНП наше правительство, теперь оккупировано французами, лучше всего принять новую реальность и ждать, пока мы снова не освободимся."
PHN_french_investments: "Инвестиции Франции"
PHN_french_investments_desc: "Сотрудничество имеет свои преимущества, в первую очередь финансовые, так как у французов теперь больше "кровавых" в игре, они гораздо более щедры с их инвестициями в наши земли."
PHN_french_military_support: "Военная поддержка Франции"
PHN_french_military_support_desc: "В настоящее время, как не более чем французский военный гарнизон на Ближнем Востоке, мы видим, как французские люди и оружие погружаются в нашу страну любой ценой."
PHN_exports_to_france: "Экспорт во Францию"
PHN_exports_to_france_desc: "В то время как наша промышленность скромна, мы производим много товаров, желаемых во Франции."
PHN_crush_ssnp_remenants: "Разрушить SSNP"
PHN_crush_ssnp_remenants_desc: "Французские военные пришли сюда не просто так, они пришли, чтобы обезопасить свою колонию от ССНП."
PHN_a_loyal_subject: "Верный Вассал"
PHN_a_loyal_subject_desc: "Наша цель - защитить французскую территорию в этом опасном регионе, и мы сделаем это до падения Парижа."
#
PHN_soclib_elected: "Реформисты Салама берут на себя ответственность"
PHN_soclib_elected_desc: "Арабисты, протофеминисты и эгалитарные, Салам держится как больный палец среди многих более традиционных мусульманских суннитов, но в Ливане есть идеи, которые нашли приветственную аудиторию."
PHN_opposition_to_frenchrule: "Противостояние французскому правилу"
PHN_opposition_to_frenchrule_desc: "Во-первых, мы должны иметь дело с нашим повелителем, французское влияние на нашей земле — это чума, и мы должны быть освобождены от нее, чтобы встать на ноги, и мы открыто отвергнем их правление и будем искать избавления от него!"
PHN_pan_arab_outlook: "Панарабская перспектива"
PHN_pan_arab_outlook_desc: "В то время как недавние правительства подчеркнули «финикийскую» самобытность в глубине души, мы все признаем, что мы прежде всего арабы, и в первую очередь, что общение с нашими арабскими братьями и сестрами по всему Ближнему Востоку и Северной Африке было бы мудрым и праведным."
PHN_the_status_of_women: "Положение женщин"
PHN_the_status_of_women_desc: "Ливанская женщина быстро становится действительно независимой личностью, принимая на вооружение особенности новой французской женщины, женщины наших земель явно готовы к равному с мужчинами статусу, и мы будем претворять это в жизнь в законодательном порядке."
PHN_appease_the_maronites: "Одобрять маронитов"
PHN_appease_the_maronites_desc: "Многие марониты выразили враждебность нашему правительству, возглавляемому суннитом и стремящемуся к арабизму, мы должны заставить их понять, что мы не их враги, а их братья."
PHN_progressive_lebnan: "Новое имя"
PHN_progressive_lebnan_desc: "Новая современная нация вступила в XX век, пока мы сидим на землях Билада аш-Шама, мы больше похожи на современную нацию северо-западной Европы, но прогресс никогда не заканчивается, и мы должны продолжать прогресс в будущем!"
#
PHN_edde_elected: "Эдд продолжает свою мечту"
PHN_edde_elected_desc: "Почти два десятилетия у власти с небольшой угрозой для своего правления, Эдде и его Национальный Блок были переизбраны и готовы привести Феникию в середине XX века."
PHN_reenforce_phoenecianism: "Восстановить финикизм"
PHN_reenforce_phoenecianism_desc: "Наше государство построено на великолепной идее: что мы дети древних финикийцев, народа моря, торговли и космополитической культуры. Это отличает нас от панарабских движений внутри страны. Мы должны активно возродить этот идеал. Эта программа будет предусматривать финансирование исторических обществ, археологических экспедиций и образовательных реформ для обеспечения того, чтобы каждый гражданин воспринимал себя не как простой житель Леванта, а как финикийский репатриант, вновь родившийся в Средиземном море, как и наши предки."
PHN_support_from_france: "Прагматизм с Парижем"
PHN_support_from_france_desc: "Хотя Эдд не является своего рода лакеем французов, он также реалист, с угрозами вокруг нас, условия еще не созрели для полной независимости, пока мы должны получить все, что можем из Парижа, и больше."
PHN_confessionalism_in_greater_lebanon: "Признание в Большом Ливане"
PHN_confessionalism_in_greater_lebanon_desc: "Для того чтобы уменьшить конфликт, мы должны поддерживать конфессионализм, юридически вводя квоты для различных религиозных политических групп. 55 - 45 христиан, соответственно, должны быть разделены на мусульман, причем в них также представлены другие группы и подгруппы."
PHN_crack_down_on_ssnp_edde: "Уничтожить сирийских националистов"
PHN_crack_down_on_ssnp_edde_desc: "ССНП годами была чумой в нашей стране, и нельзя допустить, чтобы она продолжала причинять вред нашему народу, и они должны быть раздавлены раз и навсегда."
PHN_the_father_of_phoenecia: "Отец нации"
PHN_the_father_of_phoenecia_desc: "Эмиль Эдд вел нашу страну с момента ее основания и перенесет ее в новую эру."
#
PHN_nationalist_soccons_elected: "Националисты Хури вступают"
PHN_nationalist_soccons_elected_desc: "Бечара Эль Хури и его Национальный Блок были постоянным противником французского правления и прежде всего пытались сбежать из Парижа. Маронит, Исповедник, и прежде всего патриот, Хури теперь готов привести Фенийю в новую эру."
PHN_support_tripoli: "Поддержка Trablus"
PHN_support_tripoli_desc: "Многие суннитские лидеры поддерживают создание Ливана, отличающегося от Сирии, и согласны с нашими взглядами на будущее Феникии."
PHN_an_indepedent_legal_code: "Наш собственный правовой кодекс"
PHN_an_indepedent_legal_code_desc: "Несмотря на то, что этот кодекс, безусловно, является шагом вперед по сравнению с правовой системой Мутасарифа, мы все еще должны стремиться к созданию своей собственной независимой правовой базы, мы должны приступить к его формулированию, с тем чтобы мы действительно могли функционировать отдельно от Парижа."
PHN_crack_down_on_SSNP: "Сломайся на ССНП."
PHN_crack_down_on_SSNP_desc: "Бейрутский переодевающийся Сааде и его СНП представляют угрозу существованию для нашего народа и государства. Недопустимо, чтобы им разрешали действовать и разрушать наши границы. Они должны быть изгнаны из наших земель навсегда!"
PHN_a_truly_lebanese_economy: "Поистине [ФН."
PHN_a_truly_lebanese_economy_desc: "Французские инвестиции и промышленные методы служат своей цели, но теперь мы должны убедиться в том, что наша экономика отделена от Парижа."
PHN_for_a_free_lebanon: "За свободное имя"
PHN_for_a_free_lebanon_desc: "Свободная нация, гордая, стоящая в одиночестве, защищаемая лояльными людьми против любого потенциального иностранного оккупанта. Мечта Хури и Национального Блока, и действительно из всех финикийцев, сбывается."
#
PHN_chebab_military_govt: "Шебаб заходит внутрь"
PHN_chebab_military_govt_desc: "Глупые политики привели Феникию лишь к беспорядкам, хотя Шебаб поддерживает демократический процесс, он признает, что те, кто правит Фенцией, являются слишком сектантскими и незрелыми, чтобы позволить этой стране разрушиться."
PHN_against_feudal_politics: "Против феодальной политики"
PHN_against_feudal_politics_desc: "Наше правительство переполнено династиями сектантской семьи, ищущими немного кусочка финикийского пирога для себя."
PHN_modern_state_institutions: "Современные государственные институты"
PHN_modern_state_institutions_desc: "Наши институты являются синтезом старого и нового, старого порядка Мутасариката и нового французского порядка."
PHN_expand_security_services: "Расширение служб охраны"
PHN_expand_security_services_desc: "Бейрут стал центром интриги и подрывной деятельности."
PHN_spirit_of_charbel: "Дух Шарбеля"
PHN_spirit_of_charbel_desc: "Шарбель Махлуф, чудный ливанский монах, был действительно святым человеком, который в своей жизни был известен тем, что объединял в мире как христиан, так и мусульман; он почитается в большем Ливане, и мы должны сохранять его дух и объединить христиан и мусульман в наших землях как единое целое."
PHN_secular_lebanon: "A Секулярный Ливан."
PHN_secular_lebanon_desc: "Наше правительство больше не полон сектантских династий, стремящихся лишь к большему богатству и власти для своей собственной группы. Это правительство, не охваченное такой политикой. Мы должны скоро решить будущее этого правительства, но пока мы можем быть удовлетворены нашими добрыми делами и реформами."
#
PHN_kaateb_maronites: "Триумф фалангистов"
PHN_kaateb_maronites_desc: "Пьер Жмайел и его партия Катаеб сейчас правят Феникией, в первую очередь, он и его партия стремятся к надежному и надежному Феникию, в хаотичном регионе этой стране нужен порядок, иерархия и дисциплина, только тогда мы будем достойны стоять на двух ногах."
PHN_unite_the_maronites: "Маронитный авангардизм"
PHN_unite_the_maronites_desc: "Хотя слово "авангард" было запятнано авангардом Ленина и его рабочих, оно также применимо и к нам. Мы стоим не просто как элитный авангард для определенного экономического класса, но как авангард для нашего народа, нашей расы и нашей религии, мы будем защищать марониты всеми силами!"
PHN_reject_secularism_rvturn_to_church: "Христианская нация"
PHN_reject_secularism_rvturn_to_church_desc: "Хотя мы будем работать, сотрудничать и даже терпеть другие религиозные группы, они должны понимать, что они живут в христианской нации и что их религиозные обычаи не могут быть привнесены в государство."
PHN_status_of_phonecian_nationalism: "Будущее финикизма"
PHN_status_of_phonecian_nationalism_desc: "Феникализм стал свидетелем возрождения нашей новой нации, однако, раскол в партии растет - как далеко мы зайдем?"
PHN_falange_spain_inspiration: "Вдохновение из Испании"
PHN_falange_spain_inspiration_desc: "Фалангизм в Испании под руководством Хосе Антонио Примо де Ривера был большим вдохновением для нашего руководства. Как еще один средиземноморский народ, они являются нашими двоюродными братьями и имеют аналогичный биодух, и в результате их форма правления идеальна для нашего народа."
PHN_defender_of_the_phoenecians: "Защитник финикийцев"
PHN_defender_of_the_phoenecians_desc: "Многие думали, что Феникия была потеряна, брошена в море римлянами и мусульманами, только в учебниках истории как потерянная цивилизация. Сегодня мы с гордостью говорим: Феница жива и марширует!"
#
PHN_ssnp_takeover: "Компьютер SSNP"
PHN_ssnp_takeover_desc: "Некомпетентный Чебаб схватил власть у политиков, и теперь он борется с ним в руках ССНП. Шутка, которая была Феникией, теперь для книг истории. Сирия поднялась и будет расти до тех пор, пока империализм тоже не появится на страницах книг истории!"
PHN_crush_maronite_resistance: "Сопротивление маронитам"
PHN_crush_maronite_resistance_desc: "Вооруженные нападения маронитов на правительственные здания и солдат продолжаются до сих пор."
PHN_support_syrnats_in_greaterlebnan: "Поддержка сирийских националистов в Ливане"
PHN_support_syrnats_in_greaterlebnan_desc: "Это многие меньшинства в районе Большого Ливана, которые всегда симпатизировали нашему сирийскому делу, и мы должны защитить их от насилия на религиозной почве и поднять их на руководящие посты."
PHN_romantic_syrian_nationalism: "Романтическая национализм"
PHN_romantic_syrian_nationalism_desc: "Идеи рациональности и моральных абсолютов должны быть отброшены в сторону. Нация - это не неорганическое творение сверху вниз. Это организм, состоящий из семьи, которая перешла от человека к племени, к клану, к нации. Мы должны донести эти идеи до нашего народа, так что не ислам или христианство пробуждают его сердца, а вместо этого их сознание будет направлено на любовь к нации за все, что ее характеризует."
PHN_crush_landowners_and_feudalism: "Экспроприировать феудальное богатство"
PHN_crush_landowners_and_feudalism_desc: "Это XX век, но многие семьи растягиваются в продолжающемся функционировании средневековой системы организации. Это неприемлемо, они будут вынуждены передать свое богатство государству, которое передаст богатство сирийскому народу."
PHN_claim_greater_syria: "Фертильный полумесяц"
PHN_claim_greater_syria_desc: "Границы Феникии были начертаны британцами и французами в умирающие дни Великой войны, но они продолжают проклинать нас, ограничивая Сирию искусственной ручкой, как, например, скот."


#Events
phnflavour.1.d: "В течение многих лет ливанские христиане ушли в отставку с горы Ливан с горной местностью, могущественными местными правителями и относительной автономией от Великого Порта. Его относительная изоляция от Османского достояния оказалась ужасной, поскольку во время Великой войны, когда на горе Ливан обрушился ужасный голод, вызванный оппортунистической блокадой &lt; &lt; Оттоман &gt; &gt; со стороны Джамала Паши. С более чем 200 000 погибших, главным образом христиан и друзов, следующие смерти не были вместе с населением Автономной горы Ливан, его представительство в этом районе, а также слабый государственный порядок, в то время как после краха Османской империи французы, которые на протяжении многих лет оказывали большое влияние в Ливане со времени основания &lt; &lt; Мутасарифата &gt; &gt; 1867 года, пытались установить власть над этой территорией. Это произошло при огромной поддержке маронитского населения Ливана, в то время как друзовое население, вместо того, чтобы обеспечить британский мандат, чтобы большая часть населения суннитов и шийцев, вместо того, чтобы поддерживать пананцев в ближневосточной военной кампании, он оказывал поддержку британской организации &lt; &lt; &lt; &gt; &lt; &lt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &lt; &gt; &gt; &gt; &gt; &gt; &lt; &lt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &lt; &gt; &gt; &gt; &gt; &gt; &gt; &lt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &"
#
phn.1.d: "[Root.GetName] теперь является независимой нацией, и в то время как многие марониты празднуют самоуправление, многие люди в маронитском правящем классе трезво смотрят на мысль о том, что с выводом французских войск может произойти что-то ужасное. Многие немарониты также отмечают это, считая это первым шагом к тому, чтобы свергнуть маронитское правление и создать арабское государство в Леванте. Хотя чувства все смешаны мыслью о том, что следующие несколько лет принесут радикальные перемены нашей нации."
#
phn.2.d: "Наша независимость от Франции оставила суннитское арабское большинство в нашей стране без каких-либо ограничений, кроме Армии [Root.Getaductive Cap]. Не удивительно, что это привело к росту волнений и небольшим столкновениям между сектантскими группами внутри самой горы Ливан, а также в целом [Root.GetName]."
#
phn.3.d: "Независимость нашей нации от Франции и вывод французских войск были встречены с криками торжества от сирийских и арабских националистов. Кроме того, с учетом финикийской самобытности наше государство пытается сохранить власть меньшинства, несмотря на массовое перемещение в немаронитских районах нашей страны. Эти волнения привели к полному восстанию. Сирийское государство было объявлено с Антуном Саадхом, рожденным православным христианином Берити, не менее того, у руля. Хотя в самом Ливане произошли лишь небольшие столкновения, а сирийское ополчение, как представляется, не входит в район горы Ливан, тем не менее, вполне очевидно, что ССНП Саада не признает законность нашей нации. Некоторые в нашем правительстве предложили путь мира, надеясь сосуществовать, в то время как другие заявили, что это является возможностью полностью принять ливанскую самобытность. Однако большинство в нашем правительстве по-прежнему решительно выступает против сирийской государственности, считая это угрозой нашему существованию и нарушению территориальной целостности наших наций и требуя восстановления нашего контроля над регионом."
#
phn.4.d: "С уходом Франции [PHN.GetName] попал в состояние хаоса, и теперь сирийская часть нации сорвалась с власти Бейрута, отрезана от своих северных населенных территорий Турции, они беззащитны от любого нападения со стороны нас, мы можем потребовать этих территорий, требование о том, что, по всей вероятности, будет принято в свете сирийской угрозы."
#
phn.5.d: "Отрезанные от наших северных районов, все более оппортунистические турки потребовали наших северных территорий, угрожая войной, если мы не сдадим их."
#
phn.6.d: "По мере того, как последние остатки сопротивления очищаются на севере, результат очевиден - сирийское восстание проиграно." #Syrian Uprising Crushed
#
phn.7.d: "Утреннее солнце поднялось над портом Бейрута, и на улицах города случались спорадические выстрелы. В течение нескольких часов царили путаница и спекуляция. Некоторые ожидали, что Катаеб, с их критикой так называемой слабости Шебабаба, которая росла в предыдущие недели. Некоторые думали, что народные лояльники Блока, разгневанные на то, что десятилетия шел по пути к власти. Некоторые думали, что сионисты с юга. ~ Все они были шокированы, когда флаг партии ССНП гордо поднялся над городом, так как революционеры Саада наконец-то подняли порядок в западной части Леванта. По мере того, как день шел к ночи, выстрелы становились мягкими, но результат не изменился. Когда солнце поднялось над молчаливым городом на следующий день, стало ясно, что Бейрут, и вместе с ним Фенийисия, теперь находится в руках ССНП."
#
phn.8.d: "" #IRQ - Syrian Generals Leave Our Staff
#
phn.9.d: "В Бейруте произошла жестокая революция! ССНП свергнула правительство, а теперь правит как сирийское государство. Однако мы сохраняем достаточное влияние на нацию, чтобы осуществить быстрый переворот, но это будет дорого..." #FRA - Syrian Nationalists Overthrow the Maronite Government
#
phn.10.d: "В Бейруте произошла жестокая революция! ССНП свергла правительство, а теперь правит как сирийское государство!"
#
phn.11.d: "После свержения ССНП маронитского правительства, казалось, финикийский эксперимент завершился, однако, несмотря на то, что маронитское влияние не только оставалось сильным, но и государственный аппарат был сильно влиятелен и опирался на французов, с незначительными политическими и военными силами для защиты своего короткоживущего сирийского государства, французская высадка в Бейруте быстро увидела развал этого государства."
#
phn.12.d: "В то время как финикизм всегда был частью партии Катаеб, есть некоторые элементы, которые идут дальше, чем другие, на грани валькизма и полного неприятия арабизма. В рамках партии сейчас растет раскол между умеренными и немецкими вдохновляющими валькистами." #Valkist Influence in the Party
#
phn.13.d: "Несмотря на взаимную вражду между Лондоном и Парижем, эти два человека также были торговыми партнерами, и наш вассалаж и тяжёлая торговля с ними привели к тому, что Лондонский фондовый рынок тоже нанес удар по нашей стране."
#
phn.14.d: "При естественной реакции на потерю всех своих денег из-за банкротства банков, большая часть нашего населения стала штурмовать и протестовать за пределами банков, требуя, чтобы они смогли отобрать свой капитал. Результаты были неоднозначными, но всеобщий результат - это состояние хаоса и разгневанное население. По мере того, как кризис выходит из-под контроля, возможно, настало время для того, чтобы все стало хуже, так или иначе."
#
phn.15.d: "Хотя сначала закрытие дверей казалось хорошей идеей и способом избежать дальнейшего финансового краха, оно привело к еще большему популярному гневу, который нуждается в катаразисе. Этот катарсис появился в форме насилия, и группы гражданских лиц взяли в руки оружие и начали грабить банки, чтобы забрать свои собственные деньги! Очевидно, это неприемлемо для нашего правительства и еще больше усугубляет беспорядки. Большинство министров наших правительств высказались в поддержку военного вмешательства, чтобы положить этому конец. Однако, если все это сойдет на нет, то это может быть позитивным для нас."
#
phn.16.d: "Когда армия была развернута на наших улицах, они не нашли грабителей банков для поимки, но большие толпы протестующих все еще в ярости на банки - и еще хуже, нас! Ситуация превратилась в противостояние, когда безоружные протестующие, вооруженные против вооруженных подразделений нашей армии, лишь немногие из которых были вооружены. Мы можем издать приказ открыть огонь, еще больше обостряя кризис, но положив конец этим протестам, или же мы можем просто попытаться обойтись с беспокойными элементами."
#
phn.17.d: "После того, как мы отдали приказ Командующему финикскими вооруженными силами Фуаду Чехабу, мы были потрясены тем, что получили ответ непосредственно против приказов своего главнокомандующего! Не только это, но и он потребовал от нас проведения выборов! Было бы вполне естественно выговорить или судить его за неповиновение, однако во многих отношениях под его требованиями есть завуалированная угроза: «или же» — человек, обладающий степенью лояльности со стороны своих людей и офицеров. Возможно, было бы разумно отступить от этого кризиса, поскольку произошло достаточно эскалация."
#
phn.18.d: "Хотя многие рассматривали этот результат как предсказуемый, или правительство и его министры были, конечно, шокированы, когда он появился. &quot; Шебаб &quot; , во время своего заседания, шел на финикийский парламент и поместил наше правительство под арест, не подвергнув даже выстрелам. &quot; Военное правительство &quot; было объявлено вместо него, и &quot; Шебаб &quot; заявил, что его рука была навязана &quot; правительством некомпетентных и некомпетентных людей &quot; . Многие задаются вопросом, последуют ли сейчас выборы, или же Шебаб сохранит власть после того, как отвратится от провалов уходящего правительства."
#
phn.19.d: "Наступил час принятия решения, и сейчас у Шебаба есть выбор. С одной стороны, выборы стали его первым требованием к правительству и требованием, которое он должен выполнить. С другой стороны, финикийское правительство доказало свою сектантскую и упрямую природу и может быть готово только после периода реформ, периода, который может быть наилучшим руководством самого Шебабаба."
#
phn.20.d: "" #hidden event
#
phn.21.d: "После периода реформ, годы спустя Шебаб столкнулся с тем же выбором, что и в 1936 году. Готов ли Феникия? Или другое избранное правительство просто приведет к провалу?"
#
phn.22.d: "После периода предвыборной кампании и мобилизации избирателей в [Root.GetName] день выборов наконец-то наступил и прошёл." #acadia reference?!
#
phn.23.d: "Очевидно, что простого объединения нескольких человек было недостаточно для того, чтобы остановить протесты. Они продолжили, и теперь песнопения изменились - от "мы хотим наших денег" до "Эдде Перейти!" Ясно, что они жаждут, чтобы наше правительство объявило новые выборы, чтобы другой мог заменить нас. Сейчас мы сталкиваемся с выбором, принимаем требования и молимся о том, чтобы мы выиграли выборы, пошли в армию, чтобы сохранить порядок, или потребовать, чтобы армия немедленно вошла и жестоко посадила протестующих. Мы должны тщательно выбрать, эта ситуация оказывается крайне нестабильной."
#
phn.24.d: "Мы надеялись, что народный гнев будет и впредь направлен на банки, но это уже не так. Протестующие призывают наше правительство упасть, обвиняя нас в полном экономическом провале, некомпетентности и слабости защиты Фений от кризиса. Похоже, умиротворение не было решением."
#
phn.25.d: "Изображение нашего правительства, которое когда-то было идеальным правительством, оставшимся безнаказанным с момента создания Феникии, теперь ничего не стоит. Протестующие призывают к нашей отставке, и мы должны каким-то образом восстановить законность. Обеспечение другого избирательного мандата было бы естественным методом, хотя шакалы в других партиях могут захватить наш трон... возможно, было бы разумно игнорировать "законность" и пытаться наглую силу."
#
phn.26.d: "После короткого периода времени наша экономика начала стабилизироваться. &lt; &lt; Интуитивные &gt; &gt; последствия угасли, и мы можем вновь продвигаться к процветанию."
#
phn.27.d: "Наша экономика сейчас все больше возвращается в нормальное русло, и, хотя мы все еще страдаем от укуса катастрофы, мы больше не должны бояться ее последствий, которые полностью погубят нас."
#
phn.28.d: "В то время как последствия аварии по - прежнему видны в повседневной жизни, в основном все возвращается в нормальное русло."
#
phn.29.d: "После периода восстановления положение наконец-то нормализовалось, и мы больше не страдаем от последствий глобального экономического кризиса."
#
phn.30.d: "Хаос на улицах Алеппо сегодня, когда сирийское население поднялось в ряд организованных беспорядков, правительственные здания, полиция и христиане подверглись нападениям со стороны этих банд. После расчистки пыли 23 человека погибли по всему городу, начиная от бунтарей, застреленных полицией, христианских бизнесменов, убитых толпой, и полицейских, линчеванных толпой."
#
phn.31.d: "Еще один кусок территории упал под турецкую угрозу, поскольку итальянцы ушли со своих земель на северо-запад, что оставляет более крупный фронт открытым для нападения со стороны турок, и уже военные планировщики борются за это."
#
phn.32.d: "По мере развития нашей нации и государства она стала включать Дамаск, исторический центр арабских народов и величайший сирийский город, и как официально ливанско-сирийское государство, возможно, стоит переместить нашу столицу туда в силу ее более важного значения, чем Бейрут, и ее символической силы для нашего сирийского арабского населения."
#
phn.33.d: "Непрерывное разочарование, образ хебаба в глазах общественности был порочным. Отвержение демократии за его личное правление, неспособность защитить государство от ССНП, наблюдение за тем, как французы пришли на смену им, а затем сотрудничество с французской оккупацией. Сегодня он, возможно, достиг уровня искупления, так как Шебаб и группа офицеров удалили французских офицеров, правящих нашей нацией, отрезав последний остаток французского господства на наших землях. Мы снова свободны."
#
phn.34.d: "Он объявил об открытых выборах, позволив нашей стране перейти в новую эру с новым правительством."
#
#French Events
#
phnfraevents.1.d: "Наша давняя и преданная тема в Леванте пришла к нам с просьбой - автономия. На практике их предложения были бы в основном эстетическими - изменение флага и имени. Однако в будущем это может привести к более значительным уступкам с нашей стороны."
#
phnfraevents.2.d: "К счастью, французы приняли наши предложения. Старый флаг, содержащий французский триколор, теперь опущен, и поднимается настоящий флаг, флаг, вдохновленный нашим древним финикским наследием. Это день, которым можно гордиться."
#
phnfraevents.3.d: "Французы отказались, вызывая народный гнев на французов сверху донизу."
#
phnfraevents.4.d: "По мере роста опоры на французов мы столкнулись с сокращением нашей автономии, и теперь многие видят, что мы не просто протекторат или вассал, а просто колония Парижа."
#
phnfraevents.5.d: "Хотя наша опора на Францию может быть негативной с политической точки зрения, сейчас мы пожинаем плоды увеличения инвестиций в нашу страну."
#
phnfraevents.6.d: "Хотя наша опора на Францию может быть негативной с политической точки зрения, сейчас мы пожинаем плоды увеличения инвестиций в нашу страну."
#
phnfraevents.7.d: "Европа находится в хаосе, так как французы и немцы снова вступили в войну друг с другом. Однако в Бейруте появилась возможность. В то время как Париж занят немцами, скорее всего, они не будут иметь никакого интереса к нашему куску Франции на Ближнем Востоке. Однако, возможно, было бы также разумно ограничить наши амбиции, как в эти опасные времена мы могли бы также стать жертвой войны."
#
phnfraevents.8.d: "Мы ведем войну с турками, и как защитники французского Востока мы можем просить военную поддержку у нашего повелителя."
#
phnfraevents.9.d: "Хотя наша опора на Францию может быть негативной с политической точки зрения, сейчас мы пожинаем плоды военной поддержки в нашей стране. &lt; &lt; Следует ли нам принимать такую военную поддержку &gt; &gt; -- это еще один вопрос."
#
phnfraevents.10.d: "Поскольку французское влияние в [PHN.GetName] практически не существует, [PHN.GetAdegective Cap] объявил о своем выходе из союза Энтент. Правительство в Париже в ярости, но у нас мало возможностей оправдать вторжение."
#
phnfraevents.11.d: "С сокращением французского влияния в [PHN.GetName] они сегодня подтвердили, что де-факто является реальностью, свою независимость. Это не дает нам на самом деле касус-балли, поскольку у нас действительно мало причин вторгаться в них в течение какого-то времени. Вместо этого мы должны приветствовать их как равных, и надеяться, что они останутся."
#
phnfraevents.12.d: "С нейтральной угрозой Турции мы теперь в безопасности от иностранной угрозы, и надежда на мирный Ближний Восток может стать реальностью!"
#
phnfraevents.13.d: "Панарабская угроза нашему востоку полностью разрушена, и теперь нам не нужно бояться хашимитских тиранов."
#
phnfraevents.14.d: "Наша мечта на протяжении более 20 лет является реальностью. Мы являемся хозяевами своей судьбы и свободны делать с ней то, что мы хотим. Некоторые призывают к миру, некоторые призывают к готовности к иностранным угрозам, некоторые предлагают территориальную экспансию. Все же празднуют то, что, как мы надеемся, будет светлым будущим в качестве независимой державы на мировой арене."
#
#War Events
#
phnwarevents.1.d: "Неизбежное произошло, турецкая мансарда подняла свою уродливую голову к нам, и сейчас мы воюем с ними."
#
phnwarevents.2.d: "На протяжении многих лет мы стояли и наблюдали, как наши кузены-этники экспроприировали свою землю, лишили своего местного правления и разрушили их свободы." #war with isr
#
phnwarevents.3.d: "В то время как турки были нашей главной иностранной угрозой на протяжении многих лет, мы всегда следили за Востоком, будь то британцы или панарабцы." #war with iraq
#
#News Events
#
phnnews.1.d: "В последнее время мир был потрясен подъемом сирийского националистического государства в Леванте на месте французской Фенийи, и теперь он вновь шокирован, когда маятник вернулся в другую сторону. Французская морская группа и моряки атаковали Бейрут и взяли под стражу руководство ССНП. ~ ~ На своем месте Феникия возложила на него унизительный французский мандат, который рассматривается как публичное заявление миру об их неспособности управлять собой. Военный человек, Максим Вейганд, был помещен в его голову, который объявил, что Феникия будет стабилизирована любой ценой."
#
phnnews.2.d: "Сегодня, когда в Бейруте вспыхнуло насилие, в результате которого было полностью свергнуто военное правительство Фуада Чехаба. Это произошло после свержения хебабабам национального правительства Эдде-Блока после насилия в результате экономических бед. ~Нет, лидер этой революции, один Антун Сааде, объявил о прекращении Феникии и создании нового сирийского государства вместо нее. Это означает не только окончание правления маронита над регионом, но и конец французского правления, и взгляд на Париж за то, будет ли какое-либо вмешательство."
#
