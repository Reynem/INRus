#Foreign
#
phnforeign.1.d: "Правительство Бейрута пришло к нам с просьбой присоединиться к нашему альянсу."
#
phnforeign.2.d: "Мы были приняты в их союз и теперь находятся под их защитой, и теперь наша внешняя политика запутана."
#
phnforeign.3.d: "[Возьмите капюшона] были глупы, и из-за того, что мы отвергли нашу просьбу, мы отклонили ее."
#
phn_syria.1.d: "Однако многие сомневаются в мудрости этого, поскольку они могут поставить под угрозу безопасность нашего государства, разделяя верность."
#2GW
phn_second_great_war.1.d: "Прилив второй Великой войны повернулся решительно против нас, когда наши войска перегружены и наши сердца падают сейчас под тенью врага, мечта о суверенной Феникии находится на грани краха, французы, хоть и наши союзники, не в состоянии остановить продвижение британцев и турок, если мы хотим сохранить какое-либо подобие нашей нации, мы должны найти выход из этой бойни, прежде чем сам Бейрут будет поставлен на факел, возможно, британцы прислушаются к разуму, при условии, что мы готовы заплатить цену за мир."

phn_second_great_war.2.d: "Посланник из Бейрута прибыл под флагом перемирия, с настоятельным призывом к перемирию. &lt; &lt; Финикийцы &gt; &gt; , ощущая надвигающийся крах своего поддерживаемого Францией проекта, отчаянно стремятся избежать полной оккупации. &lt; &lt; Отдельный мир &gt; &gt; с &lt; &lt; Феникией &gt; &gt; мог бы позволить нам закрепить наши достижения и перераспределить наши разногласия на более важные фронты. &lt; &lt; Однако мы не можем просто обойти &gt; &gt; наших турецких союзников; у них есть свои собственные результаты, чтобы уладить ситуацию с правительством Бейрута."

phn_second_great_war.3.d: "Наши британские союзники сообщили нам, что правительство Бейрута подает иск о мире. После многих лет напряженности и конфликта из-за судьбы Леванта и Анатолии финикийцы наконец-то признают реальность нашего военного превосходства. Лондон, похоже, склонен принять перемирие, чтобы ускорить окончание более широкой войны, но окончательное решение остается за нами. Согласимся ли мы на их уход и возвращение наших потерянных территорий, или же мы будем настаивать на том, чтобы это искусственное состояние было полностью стерто с карты?"

phn_second_great_war.4.d: "Слово пришло с фронта: как Лондон, так и Анкара согласились с условиями перемирия. Это горькая таблетка, которую нужно проглотить, требуя немедленного отказа от наших французских союзников и передачи наших территорий в Анатолии, но она обеспечивает выживание нашего государства. По мере того, как оружие утихнет вдоль наших границ, наши солдаты смогут наконец вернуться домой. Мы не в состоянии покинуть вторую Великую войну, хотя цена для нашей международной репутации и наших отношений с Парижем будет огромной."

phn_second_great_war.5.d: "Игра провалилась. Наши предложения мира были встречены холодным безразличием со стороны Лондонско-Берлинской оси. Британцы и турки не видят причин для того, чтобы дать нам условия, когда они считают, что полная победа в их руках, они не хотят компромисса, они хотят нашего безусловного подчинения. При отсутствии дипломатического выхода у нас нет иного выбора, кроме как стоять на своей земле. Если мы хотим пойти на попятную, мы заставим врага заплатить за каждый дюйм нашей земли."

phn_second_great_war.6.d: "Предательство! пока наши храбрые солдаты продолжают истекать кровью на фронте в Леванте, правительство в Бейруте заключило трусливую, заднюю сделку с британцами и турками. Подписав отдельный мир и покинув нашу фракцию, плюнуло в лицо нации, которая гарантировала их существование. Этот бейрутский таблетка не будет забыт. Будь то дипломатия или штык, они должны быть привлечены к ответственности за эту предательство."

#Ideas
PHN_lebanese_minority_angry: "Волны ливанцев"
PHN_lebanese_minority_angry_desc: "После того как ливанский народ, в частности марониты, полностью потерпел упадок из-за захвата ССНП, он взбесился из-за недавних событий."

PHN_minority_rule: "Правило о меньшинствах"
PHN_minority_rule_desc: "Государство "Феник" управляется маронским меньшинством, в центре которого находится гора Ливан. Друз, православные христиане, шииты и сунниты, как правило, не участвуют в управлении и часто относятся к нему с презрением со стороны маронитского правящего класса. Кроме того, концепция феники является лишь концепцией, которая покупает главным образом среди ряда маронитов в регионе, практически не влияя на большинство, считающих себя левантийским или суннитским государством, в то время как жители Дальнего Севера в основном являются турками. Это положение дел, при котором маленькое маронитское население вокруг горы Ливан правит огромным государством, охватывающим Тира до Хантаба, является непопулярным. Даже многие марониты враждебно относятся к статусу-кво, при этом многие предпочитают безопасное мажоритарное государство, расположенное вокруг горы Ливан. В настоящее время правительство выступает за сохранение своей территориальной целостности, хотя нападение со стороны соседнего государства или революция внутри может еще раз обратить ливанских христиан от правителей."

PHN_angery_syrians: "Сирийское недовольство"
PHN_angery_syrians_desc: "Пристрастность к ливанским христианам-маронитам и формирование среди них финикийской самобытности привели к тому, что мусульманское и сирийское население решительно выступает против колониального правительства."
PHN_angery_syrians3: "Униженные сирийцы"
PHN_angery_syrians3_desc: "Пристрастность к ливанским христианам-маронитам и формирование среди них финикийской самобытности привели к тому, что мусульманское и сирийское население решительно выступает против колониального правительства."

PHN_angery_torks: "Турецкий сеператизм"
PHN_angery_torks_desc: "В районе Хантаба большинство турецкого населения желает полного воссоединения со своими северными братьями, считая, что правление финикийского маронита является всего лишь несправедливым результатом Севреса. Среди враждебного северного населения есть сирийское меньшинство, которое также враждебно относится к Бейруту, хотя и по своим собственным сирийским националистическим соображениям. Единственная подлинная поддержка, которую наше правительство получает на севере, - это поддержка маленького и чрезвычайно благодарного армянского меньшинства, поскольку те, кто был оставлен после турецких зверств, смогли вернуться в свои дома после Великой войны из-за нашего правления."

PHN_lebanese_angry: "Волны ливанцев"
PHN_lebanese_angry_desc: "Ливанское население возмущено недавними событиями, связанными с изменениями в столице, и считает, что эти изменения являются одним из факторов, обусловливающих доминирование Сирии в стране."

