### Characters ###
 LEB_farajallah_el_helou: "Фараджалла эль-Хелу"
 LEB_farajallah_el_helou_leader_desc: "Фараджалла Эстефан эль-Хелу родился 6 июня 1906 года в семье маронитов на горе Ливанский Мутасарифат, он двинулся в различные ливанские государственные школы и выходил из них, в конечном итоге обеспечив ему образование, которое дало ему учительскую работу в Американском национальном колледже в Сирии. Фараджалла с кликой радикальных учителей и студентов в колледже, которая познакомила его с марксистской и синдикалистской идеологией. Он присоединился к ливанским радикалам Фуад Шамали и Юсуфу Язбеку, а также армянскому Артину Мадояну и сирийскому Халиду Бакдашу в организации Сирийской Социалистической партии в рамках панарабских усилий по поощрению социализма в Леванте. Фараджаллах, как и многие другие члены партии, столкнулся с тяжелыми репрессиями со стороны французских и финикских властей и провел несколько лет в тюрьме. В 1930-х годах он прожил некоторое время за границей в Советском Союзе, где он продолжил дальнейшие исследования по вопросам социализма и написал книгу «Нове человечество» о будущем арабского социализма, которую он принял на себя, после своего возвращения к ливанской народной партии."

