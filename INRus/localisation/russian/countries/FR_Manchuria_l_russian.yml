#desc
MAN_FUHRERREICH_DESC: "Превосходство Чжана Зуолина над Пекином не ставится под сомнение, но как долго его союз военных баронов будет стоять вместе против быстрого укрепления Куоминтанга и их Национальной революционной армии? Многие ставят под сомнение способность Чжана воссоединить Китай под старым знаменем Бейянга, но его хитрость и дух вторые, и это, возможно, то, что нужно, чтобы претендовать на победу."
