#events
fng.1.t: "Юннан продлевает предложение"
fng.1.d: "Юньнаньская клика страдает от нападения Цили-Сычуанской клики, и она предложила вмешаться в войну, чтобы мы могли застать Жили врасплох и, наконец, стереть с карты последнего крупного военного барона."
fng.1.a: "Конечно!"
###
fng.2.t: "Юннан стоит беззащитной!"
fng.2.d: "Сычуаньская клика и правительство Куоминтанга окружили нашего союзника в Юньнане и начали атаку! Мы должны защищать их любой ценой!"
fng.2.a: "На войну!"
