 ALG_pacification_of_algeria: "Входящий восстание ФНО"

 algeria.1.t: "Богатые, сельские и революционные"
 algeria.1.d: "Алжир, говоря на арабском языке, означает острова, которые находятся перед столицей Алгерис и которые каким-то образом стали названием для всего побережья между городами Туниса и Танжер, эта земля заполнена сокровищами, наиболее важными из которых являются нефть. n an Aligal пришел к французскому правлению под руководством Наполеона III, который увлекся тем, что основал королевство над арабами и объявил себя своим королем, а затем запретил французскому народу передвигаться на юг или даже за пределы прибрежных городов на побережье, и мусульманам были предоставлены беспощадная автономия и права, и, к сожалению, этот медовый месяц закончился с Наполеоном, поскольку его промусульманская политика не нравилась на самом деле в Париже, и когда он был свергнут в 1871 году, алжирцы утратили все свои права, а Pied Noirs получили то, что они хотели, официально став частью Франции. . / ~ Алжиры с момента создания Третьей Республики никогда не признавали этого, и с момента окончания Великой войны они шли к свободе, ведущей к тому, чтобы правительство стало более деспотом, и последняя солом в июле 1935 года, когда французская освободительная освободительная партия Ф."
 algeria.1.a: "О, Франция, время обличения закончилось"

 alg.3.t: "Бомба ФНО &lt; &lt; Алгерис &gt; &gt;"
 alg.3.d: "То, что случилось с бомбой и картой, мертво."
 alg.3.a: "Мы преисполнены решимости, что Алжир должен жить!!!!"

 alg.2.d: "Сегодня, 5 июля, мы, алжирский народ, заявляем, что Франция больше не является нашим хозяином и больше не воцаряется над нами, пусть Франция Файл и Длинная жизнь Свободный и Независимый Алжир от всех Шеклов и Кулаков, Да здравствует народ Алжира, который выдержал и пусть французы останутся во Франции навсегда и навсегда. Несмотря на то, что после смерти Жюля Карда во время кровавых бомбардировок алжирцы взяли на себя эту смелость, чтобы подготовиться к освобождению своей нации и себя от французского правления, многие погибли и многие пострадали, но сегодня Алжир остается свободным и великим без французской блюда и алкоголя, пусть Алжир всегда будет такой же свободной, богатой и красивой землей для всех арабов и амазигов, городов и фермеров, мусульман и христиан."
