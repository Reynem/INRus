 ### AFGHANISTAN DEMANDS ###
 raj_foreign.1.d: "Жесткий ультиматум прибыл из офиса вице-короля в Дели. Правительство, ссылаясь на «развращение» предыдущих лет, требует немедленного и безоговорочного возвращения наших западных провинций, которые, как они утверждают, являются «внутренними территориями Британского Раджа». Это наглое требование, подкрепленное явной угрозой индийской армии. Они проверяют нашу решимость, считая нас простыми оппортунистами. Мы должны либо подчиниться этому империалическому давлению, либо подготовиться к защите гор, которые раньше разрушили империи."
 
 raj_foreign.2.d: "Прекрасные новости из Кабула. Правительство [от капитала], увидев мудрость нашей позиции, официально согласилось уступить западные территории власти Раджа. Правительство Его Величества удовлетворено тем, что этот вопрос может быть урегулирован без кровопролития. Граница восстановлена, и порядок вернулся на границу."
 
 raj_foreign.3.d: "У правительства Кабула хватило смелости отказаться от наших самых разумных требований! Их ответ был полон разговоров о «суверенности» и «неуверенности», игнорируя наши законные притязания полностью. Похоже, афганцы забыли уроки прошлого."

 ### NEPAL DEMANDS ###
 raj_foreign.4.d: "Отправка прибыла из места пребывания, которое недавно укрепило власть, британский Радж требует возвращения наших южных территорий, которые, как они утверждают, были «незаконно захвачены» в период недавней нестабильности. Несмотря на то, что мы уже давно поддерживаем уникальные отношения с британией, это вопиющее оскорбление нашего суверенитета. Они путают нашу дружбу со слабостью. Королевство Непал должно сейчас выбрать: капитулировать требования Дели или стоять и бороться за каждый дюйм нашей горной родины."
 
 raj_foreign.5.d: "Правительство [от Гетнама] мудро решило принять наши условия. Северные территории будут мирно реинтегрированы в Радж, и наша давняя дружба с горным королевством может продолжаться. Это разумное решение позволит избежать ненужного и дорогостоящего конфликта, и правительство Его Величества удовлетворено тем, что гуркхи вновь доказали свой прагматизм. Граница безопасна."
 
 raj_foreign.6.d: "Несмотря на наши исторически дружественные отношения, Непал выбрал неповиновение. Они верят, что их горы защитят их от могущества Британской империи. Несмотря на то, что гуркхи, будучи хорошими солдатами, являются подданными глупого правительства. Индийская армия пойдёт на север и напомнит им о том, где именно находится подлинная власть."
