 BUL_powerstruggle: "Противостояние сил"
 BUL_powerstruggle_desc: "Для неподготовленного наблюдателя, кажется, что Болгария перешла в Национальную республиканскую партию, и в ближайшие несколько лет неизбежно, что политическая машина Дочевца будет перестраивать болгарскую нацию в предстоящие годы. Однако при инспекции это явно не так. Остатки Союза за демократию, Второй Либеральная Концентрация, все еще имеют большую власть среди парламентских и элитных кругов и могут использовать эти связи для спасения болгарской демократии. Монархистские элементы имеют большую власть в армии и элите. Они угрожают свергнуть Республику и вернуть Царский контроль. В то время как Национальная республиканская партия управляет своей базой в парламенте, с сильными военными связями и небольшими элитными связями. ~n ni ni difference, respectary main, a libertaires directargs: [BUL_Democrag_unitargerg]?"

