 BUL_manol_vasev: "Манол Васев"
 #BUL_manol_vasev_leader_desc: "Из своих товарищей Манол Васев выделяется не только из-за его приверженности анархисти и синдикализму, но и из-за его относительной тайны."Manol Vasev" is not his real name, it is Iordan Sotirov, and was born either in Kyustendil, or in the unidentified village of "Tahandzhik", in 1898. As a young man, Sotirov was involved in the tobacco worker trade union movement in Kyustendil and rose to lead the trade union movement in the region. After Konstantin Georgiev's rise to power, he organised strikes of tobacco workers and fled Kyustendil after crackdowns began. He was sheltered by fellow anarchist leader Delcho Vasilev in Haskovo - here, Sotirov erased his old identity and became Manol Vasev, once again involving himself in the revolutionary struggle.\n\nAfter the Georgiev era and the subsequent years of growing royal control, Bulgarian anarchists and syndicalists changed their strategy. The Bulgarian labour movement was too small and weak to build a revolution on - however, the impoverished peasantry was in constant threat of rebellion, and could be channelled to their needs. Mass peasant strikes in 1932 led to the establishment of the Agricultural Professional Confederation "Vlasovden", a congress modelled after trade union congresses in Western countries which was intended to prepare the Bulgarian peasantry for revolution. This Confederation also experimented with communal practice, establishing agricultural cooperatives under Syndicalist principles in the Haskovo region and drawing the ire of local authorities.\n\nArmed peasant militias, aligned with Vlasovden, played a key role in the revolution which overthrew the Tsar after the Fourth Balkan War - and for once, the Bulgarian syndicalists could finally put their theory in practice, showing the world that Syndicalism can be adapted far and wide, not just in the industrialised West."

 BUL_georgi_dimitrov: "Джорджи Димитров"
 #BUL_georgi_dimitrov_leader_desc: "В 1900 году он стал секретарем Софийского союза принтеров и присоединился к недавно созданной социалистической фракции Нэрроу БРСДП в 1903 году. В предвоенный период он организовал профсоюзы в Болгарии и в 1915 году был избран в социалистическую платформу."Western socialism". The Narrow Socialists adopted his theses.\n\nPersonality wise, Dimitrov is hardly a flattering picture, described as having "the coarse and calculating realism of the Bulgarian peasant" and changing his mind on who to flatter and who to criticise depending on who is in power. Still, however, he is a determined revolutionary, and the fall of the Tsardom allows him to pursue his vision for Bulgaria at last."

 BUL_fatherland_front: "Отечественный фронт"

 BUL_ferdinand_sakskoburggotski: "Фердинанд Сакскобурггоцкий"
 BUL_ferdinand_sakskoburggotski_regnal: "Фердинанд I"
 #BUL_ferdinand_sakskoburggotski_leader_desc: "Когда Фердинанд фон Саксен-Кобург-Гота был избран принцем Болгарии в 1887 году, новости были необыкновенными. Немногие думали, что элитный, эксцентричный офицер Австро-Венгерского университета может править нацией, особенно когда его предшественник Александр фон Баттенберг потерпел неудачу. Следующие пять десятилетий видели их взлеты и падения, но в конечном итоге Фердинанд стал одним из самых выдающихся и самых славных правителей Болгарии."Prussia of the Balkans". In the midst of it all, in 1908, he was granted the title of Tsar, first of the Third Bulgarian State, and wielded it as a claim to the throne of the Eastern Roman Empire itself. The Second Balkan War would temper these ambitions, but the Great War, as brutal as it was, allowed the Tsar to restore Greater Bulgaria for good.\n\nAgeing and in increasingly poor health, Ferdinand has delegated most of his power to his eldest son, Crown Prince Boris. However, he remains an important symbol for the Bulgarian people. The Great Restorer, the flagbearer of the Third Bulgarian State in all of its glory, and as long as he remains at the helm, Bulgaria shall prosper."
 BUL_great_restorer: "Великий реставратор"
 BUL_great_restorer_2: "Великий реставратор"

 BUL_boris_sakskoburggotski: "Борис Сакскобурггоцкий"
 BUL_boris_sakskoburggotski_regnal: "Борис III"
 #BUL_boris_sakskoburggotski_leader_desc: "30 января 1894 года было объявлено о рождении Бориса фон Саксена-Кобурга-Готы, старшего сына Фердинанда I, с 101 пушкой 30 января 1894 года. С момента его рождения наследный принц Борис был поставлен в центр национального внимания для того, чтобы утешить подавляющую православную нацию, которая сделала его своим принцем. С прославлением Российской империи Фердинанд приказал своему сыну креститься на православной креселе и дал ему болгарское имя. Наследный принц получил тщательное и многодисциплинарное образование в течение своего детства, в том числе более полную болгарскую школьную программу, несколько языков, обучение офицера и даже курс работы паровоза. Несмотря на то, что балканские войны и Великая война лично затронули принца, как он велел режиму, а позднее служил офицером по связям с начальником штаба болгарской армии. Он лично посетил свои окопы, чтобы наблюдать за тем, как почти все больше и плохо поддерживаются болгарские армии. Его отец был все больше и более пацифистским в течение многих лет. Его отец поместил его под домашний арест из-заветного непризнания в связи с несколькими людьми, и неприятным решением о томной войне."

