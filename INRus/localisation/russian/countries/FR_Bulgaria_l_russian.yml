 ### Characters ###
 BUL_vladimir_vazov: "Владимир Вазов"

 BUL_alexander_stamboliyski: "Александр Стамболийский"
 # BUL_alexander_stamboliyski_leader_desc: "Будучи крестьянином по рождению и агрономом за счет образования, Александр Стамболийский на протяжении десятилетий был радикальным в болгарской политической системе. Его партия, Болгарский аграрный национальный союз, была первой, которая основывалась не на расколах Тарновского конституционного собрания или диктатуры Стефана Стамболова, а на реальной идеологической основе, принадлежащей сельскому крестьянству. Марксистская аргументация , Стамболийский заявил, что, поскольку общая болгарская крестьянская община вносит наибольший вклад в развитие нации, она также должна иметь власть над страной. Таким образом, государство должно быть перестроено в их интересах . Стемболийский был первым крупным политическим лидером Болгарии, осуждавшим монархию, и поэтому его карьера была отмечена постоянным преследованием."South Slav". A year later, his ferocious anti-war rhetoric landed him in prison. \n\nAmbitious and thirsty for an opportunity to finally shape Bulgaria in his image, Stamboliyski speaks of"peasant democracy", but true democratic practice rarely figures in his vision. If Bulgaria needs to be shaped according to the desires of the peasantry, and he is their tribune, then is it not natural for him to hold complete power?"

