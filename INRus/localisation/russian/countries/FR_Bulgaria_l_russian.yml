 BUL_kyril_sakskoburggotski_regnal: "Кирил I"

 BUL_kimon_georgiev: "Кимон Георгиев"
 #BUL_kimon_georgiev_leader_desc: "Полковник Кимон Георгиев родился из семьи среднего класса в коротком княжестве Восточная Румелия до его объединения с Болгарией. Он, как и его коллеги, лишился богатства, поступил в Военную школу и закончил ее в качестве пехотного лейтенанта. Его карьера в болгарской армии видела, как он сражался как в балканских войнах, так и во Великих войнах, в ходе которых он потерял один из глаз. Он больше не мог командовать своим подразделением с фронта и преподавать в короткой военной школе. Сербская революция и последующие политические события в Болгарии позволили ему создать Военный союз - организацию активных и резервных болгарских офицеров, стремящихся представлять свой голос в политике. Помимо Военной лиги, Георгиев полностью поддержал авторитарный режим Константина Георгиева и был назначен министром железных дорог и телеграфов в его кабинете. Когда премьер-министр, Георгие, отстаивая его, отстаивал его."

 BUL_ivan_dochev: "Иван Дочев"
 BUL_ivan_dochev_leader_desc: "В 1931 году Дочеву было всего лишь 13 лет, когда Болгария попала в полный военный крах, и только 14 лет, когда Болгария была вынуждена встать против унизительного мира в Нойлли-сюр-Сеине. После войны, в отличие от его отца и многих его сверстников в Национальной республиканской партии, Дочев не занимался военной карьерой и не учился изучению права в Софийском университете. Несмотря на то, что нищета и проблемы с законом заставили его несколько раз прерывать свое обучение. В течение остальной части своей юности и своего времени в Университете, его горечь и ярость на мир только усилились вместе со слабыми политиками, которые не смогли по-настоящему возглавить бедную и политически парализованную республику, просто используя политическую систему для поддержания своей собственной власти и статуса. ni nathing party that natural, Docher эффективно мобилизовал многие из своих единомышленных лидеров в университете, боролся с либеральными студентами на улицах Софии и сплотил этих коллег к воинственной националистической республиканской партии, присоединившейся в 1931 году."
 
