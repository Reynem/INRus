 #Peace Events
 bulpeace.1.d: "Болгарские силы прошли через нашу территорию и, несмотря на храбрость наших сил, Булгары успешно схватили свои притязания вместе с огромными массивами нашей земли. Перед лицом полного краха многие члены нашего правительства сочли нужным вступить в мирные переговоры с болгарами, чтобы мы не были уничтожены и могли жить, чтобы сражаться с болгарами в другой день."
 bulpeace.2.d: "Сербы были успешно поставлены под болгарскую обувь, и теперь мы возвращаем Македонию, Видин и Нис. По мере того как сербы все дальше уходят на свою родину, они становятся все более отчаянными и теперь призывают нас к миру. Они просят, чтобы мы ушли со своей территории в обмен на отказ от всей спорной территории и выплату незначительного военного возмещения в течение года. Многие члены нашего правительства рекомендуют принять такое соглашение, поскольку отказ от него может оставить нам трудное будущее и потенциальное вмешательство со стороны других государств, видя, что мы полностью отвергаем мир."
 bulpeace.2.b: "Вся Сербия будет нашей!"
 bulpeace.3.d: "Болгарцы отвергли наши мирные инициативы, и сейчас мы сталкиваемся с новой болгарской атакой."
 bulpeace.4.d: "Болгарские силы прошли через нашу территорию и, несмотря на храбрость наших сил, Булгары успешно схватили свои притязания вместе с огромными массивами нашей земли. Перед лицом полного краха многие члены нашего правительства сочли нужным вступить в мирные переговоры с болгарами, чтобы мы не были уничтожены и могли жить, чтобы сражаться с болгарами в другой день."
 bulpeace.5.d: "Греческие силы на своих северных территориях полностью рухнули, и сейчас болгарская армия угрожает остальной части их нации, и, когда они сталкиваются с полным крахом, они призывают нас к миру, среди прочего, мы потребовали от них спорных территорий, а также большого числа их флота, в обмен на то, что мы уйдем с их оставшейся территории и не нарушим суверенитета того, что осталось."
 bulpeace.5.b: "Мы заберем всю Грецию!"
 bulpeace.6.d: "Болгарцы отвергли наши мирные инициативы, и сейчас мы сталкиваемся с новой болгарской атакой."
 bulpeace.7.d: "Болгарские силы прошли через нашу территорию и, несмотря на храбрость наших сил, Булгары успешно схватили свои притязания вместе с огромными массивами нашей земли. Перед лицом полного краха многие члены нашего правительства сочли нужным вступить в мирные переговоры с болгарами, чтобы мы не были уничтожены и могли жить, чтобы сражаться с болгарами в другой день."
 bulpeace.8.d: "Несмотря на трудности, связанные с пересечением Дуная, болгарская армия в настоящее время все больше и больше распространяется на румынские земли, и румынское правительство сталкивается с крахом того, что осталось от ее территории."
 bulpeace.9.d: "Болгарцы отвергли наши мирные инициативы, и сейчас мы сталкиваемся с новой болгарской атакой."
