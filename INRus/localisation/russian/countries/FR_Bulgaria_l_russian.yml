 #### Description ####
 BUL_FUHRERREICH_DESC: "Болгария вышла из Великой войны в тяжёлом состоянии, со своими мечтами о великой Болгарии. В хаосе умирающих дней Великой войны Цар Фердинанд отрекся и нерешительность его наследника привели к провозглашению республики, за которым последовал жестокий Договор Нойлли-сюр-Сейна. После многих лет либерального правления НРП Ивана Дочева захватила власть в правительстве меньшинства и пытается ужесточить свою власть над болгарским государством. Перед лицом этой твердой либеральной и монархистской силы, которая делает все возможное, чтобы Болгария не была захвачена НРП. Однако болгарский народ жаждет мести своим соседям, и НРП более чем счастлива быть теми, кто дает ему то, что он хочет."

 ### Focus ###
 #NRP TREE
 BUL_rule_of_NRP: "Правило НПР"
 BUL_rule_of_NRP_desc: "Национальная республиканская партия правит с 1934 года, но только сейчас она впервые имеет в своих руках абсолютную власть над болгарским государством Дочев и его люди намерены использовать эту власть, чтобы изменить болгарскую нацию и подготовить ее к мести победителям последней войны."
 BUL_eliminate_remaining_monarchists: "Уничтожить оставшихся монархистов"
 BUL_eliminate_remaining_monarchists_desc: "В то время как многие члены нашего движения симпатизируют монархистам, сейчас не время для слабости."
 BUL_eliminate_remaining_democrats: "Уничтожить оставшихся демократов"
 BUL_eliminate_remaining_democrats_desc: "С 1919 по 1934 год эти демократы занимались разграблением останков болгарского народа, намеревающегося принести личные выгоды им и их друзьям за счет болгарского народа и нации, и эти воры и лжецы больше не должны ходить по улицам без прикосновений, они будут удалены, и о них будет мало памяти."
 BUL_abolition_of_parliament: "Упразднение парламента"
 BUL_abolition_of_parliament_desc: "Нет необходимости поддерживать мёртвый институт парламента, в котором доминируют мы, и он не имеет никакого смысла, кроме как принимать наш диктат и допускать подрывные действия от того, что осталось от оппозиции, ради официального оформления нашего абсолютного правления, этот институт будет уничтожен."
 BUL_nationalisation_of_war_industries: "Национализация военной промышленности"
 BUL_nationalisation_of_war_industries_desc: "Предшествующий Союз за демократию, а затем и Вторая Концентрация полностью поддержали идеи рыночного либерализма. Эти идеи являются открытой дверью для умиротворения и слабости. Мы не можем оставить национальную оборону на усмотрение идеи "рынок". Мы должны поставить эти отрасли в свои руки, чтобы работать так, как мы считаем нужным, ради создания Большой Болгарии."
 BUL_mass_mobilisation: "Массовая мобилизация"
 BUL_mass_mobilisation_desc: "В то время как Дочев молод и еще не служил, одно, что он и его соотечественники понимают из своих военизированных формирований и деятельности, это как мобилизовать огромное число людей на действия, и это должно быть сделано в национальном масштабе, и болгарский народ должен быть готов к войне."
 BUL_bulgarian_nationalism: "Болгарский национализм"
 BUL_bulgarian_nationalism_desc: "Болгарский национализм должен занимать центральное место в самобытности нашего народа, мы должны бороться с понятиями югославского, местного и интернационализма, каждый человек и материя должны подняться на национальный уровень, и это не должно идти выше или ниже, а средний болгар должен рассматривать себя как часть более широкой массы, являющейся болгарской нацией."
 BUL_winning_the_economic_war: "Победа в экономической войне"
 BUL_winning_the_economic_war_desc: "Военные ограничения прошлого по-прежнему демонстрируют свое наследие в наших тщетных отраслях промышленности, хотя мы избегали худшего из Лондонского фондового рынка, наша промышленность по-прежнему не готова к войне, мы должны провести серьезную реформу, если мы хотим заявить о том, что наша страна является Большой Болгарией."
 BUL_raise_paramilitaries: "Воспитание военизированных формирований"
 BUL_raise_paramilitaries_desc: "В то время как Дочев только недавно взял под свой контроль партию, это не значит, что НРП долгое время не занималась важной работой. С середины 20-х годов партия готовилась к тому дню, когда она могла бы править, и одним из способов было создание хорошо подготовленных военизированных формирований наравне с профессиональными силами, с тем чтобы мы могли быстро расширить нашу армию. С ограничениями мы будем использовать их для подкрепления наших сил."
 BUL_the_state_perfected: "Государство совершенствовалось"
 BUL_the_state_perfected_desc: "Болгарское государство теперь является хорошо отлитой машиной, использующей все имеющиеся средства, которые приблизит его к достижению Большой Болгарии. Болгарское государство действительно воплощает болгарский национальный девиз в новом виде "Единство делает силу!""

 #NRP Foreign Tree
 BUL_rebuking_the_catastrophe: "Отмена национальной катастрофы"
 BUL_rebuking_the_catastrophe_desc: "Договор Нойлли-сюр-Сейн не был мирным урегулированием; это было национальное унижение, катастрофа, которая разрушила болгарские земли и покорила наших родственников. Мы отказываемся принять этот несправедливый вердикт. Национальная программа реконструкции посвящена одной священной цели; Преодоление диктата Нойлли и восстановление законных границ Болгарии. Каждое болгарское сердце бьётся за утраченные территории, и мы не успокоимся до тех пор, пока они не будут освобождены. Этот акцент будет посвящен провозглашен нашим национальным амбициям и началу подготовки к неизбежной борьбе."
 BUL_serbian_forts: "Подготовьтесь против Сербии"
 BUL_serbian_forts_desc: "Сербы являются врагом, которого мы действительно не можем уничтожить. Под ними страдает огромное число болгар, и в начале 1930-х годов у них на боку был шип, и мы должны сделать все возможное, чтобы подготовиться к этому врагу, поскольку, хотя они, безусловно, не самые сильные из наших соседей, они, несомненно, являются грозным противником."
 BUL_weapos_to_imro: "Оружие для ИМРО"
 BUL_weapos_to_imro_desc: "Мы должны активизировать деятельность ММРО, с тем чтобы добиться большего успеха на наших законных землях, в то время как сербы становятся неспособными защитить себя на нашей земле."

 BUL_war_with_ser: "Удар по Сербии"
 BUL_war_with_ser_desc: "Время для подготовки окончено, наши братья в Македонии призывают освободиться от сербской тирании, ИМРО смягчило обстановку, и наша армия готова к этому, мы начнем быструю и решительную кампанию, с тем чтобы сломить сербскую хватку на наших законных землях и отомстить за унижение прошлого, за единую Болгарию!"

 BUL_prepare_for_mountain_warfare: "Приготовиться к горной войне"
 BUL_prepare_for_mountain_warfare_desc: "Наши кампании против Сербии и Греции будут включать боевые действия в горных районах, где ведется борьба с обычной пехотой."

 BUL_prepare_against_greece: "Приготовьтесь против Греции"
 BUL_prepare_against_greece_desc: "Греция украла у нас Южную Фракию и доступ к Эгейскому морю. Болгарское население там страдает под греческим правлением. Мы не можем мириться с этой несправедливостью. Эта программа будет сосредоточена на нашем военном планировании на юге, разработке стратегий по преодолению греческой обороны и восстановлению утраченной береговой линии."

 BUL_war_with_gre: "Удар по Греции"
 BUL_war_with_gre_desc: "Эгейцы ждут! Наши приготовления завершены. Мы начнем наступление против Греции, чтобы освободить Западную Фракию и восстановить законный доступ Болгарии в Средиземное море. Греческая армия рухнет до того, как праведная ярость наших солдат сразится, чтобы вернуть то, что принадлежит нам."

 BUL_prepare_against_rom: "Приготовиться к борьбе с Румынией"
 BUL_prepare_against_rom_desc: "Южная Добруджа, плодородная земля, обитаемая болгарами, остается несправедливой под румынской оккупацией, хотя Сербия и Греция являются непосредственными приоритетами, мы не должны забывать об этом северном притязании, и мы начнем стратегическую подготовку к потенциальному конфликту с Румынией, изучая их оборону вдоль Дуная и готовя наши силы к операциям на севере."

 BUL_prepare_to_cross_danube: "Приготовиться к пересечению Дуная"
 BUL_prepare_to_cross_danube_desc: "Река Дунай представляет собой огромный естественный барьер между нами и Румынией, для того чтобы вернуть южную Добруджу, наша армия должна быть в состоянии быстро и решительно пересечь ее, мы будем инвестировать в инженерное оборудование, готовить специализированные подразделения по пересечению рек и разрабатывать детальные планы на случай амфибийных нападений через великую реку."

 BUL_dobrouzha_strategy: "Стратегия Доброджа"
 BUL_dobrouzha_strategy_desc: "Освобождение Южной Добруджи требует тщательного планирования. Этот регион сталкивается с уникальными проблемами, отличными от гор на юге и западе. Наш генеральный штаб разработает конкретные оперативные планы, адаптированные к этому театру, с уделением особого внимания быстрому прогрессу в захвате ключевых городов и в предотвращении консолидации румынских сил."

 BUL_war_with_rom: "Ударь Румынию"
 BUL_war_with_rom_desc: "Добруджа зовет, пришло время договориться с Румынией, наши силы, готовые к пересечению Дуная и оснащенные четкой стратегией, начнут наступление, с тем чтобы освободить Южную Добруджу и восстановить эту жизненно важную провинцию на родине."

 BUL_taking_tsargrad: "Прием Царграда"
 BUL_taking_tsargrad_desc: "Константинополь, древний Царград, сердце Восточной Православии и исторический драгоценный камень Балкан, находится под турецким правлением в заманчивой близости, хотя прямой конфликт может быть пока неразумным, мечта о том, чтобы освободить этот великий город для православной цивилизации, сияет ярко, мы начнем тихую, долгосрочную подготовку, разработку планов действий на случай, если турецкое государство поколебается, позиционируя себя, чтобы получить эту высшую премию, когда появится возможность."

 BUL_peace_with_turks: "Пакт о ненападении с турками"
 BUL_peace_with_turks_desc: "В то время как мечты Царграда остаются, прагматизм диктует наш нынешний курс, Турция является значительной региональной державой, и конфликт с ними, пока мы сглаживаем счеты с нашими балканскими соседями, был бы глупым. Мы будем стремиться к заключению договора о ненападении с Анкарой, гарантируя нашу юго-восточную границу и позволяя нам сосредоточить свои силы там, где это необходимо больше всего."

 #Monarchist Tree
 BUL_return_of_the_king: "Возвращение царя"
 BUL_return_of_the_king_desc: "Нестабильность и экстремизм последних лет доказали глупость отхода от традиций. Цар является законным воплощением болгарской нации, гарантом порядка и стабильности. Мы распустим нынешнее правительство и пригласим царя Бориса III взять на себя полную власть, восстановив монархию на ее надлежащее место в центре национальной жизни."

 BUL_eliminate_remaining_nationalists: "Уничтожить оставшихся националистов"
 BUL_eliminate_remaining_nationalists_desc: "Радикальные националисты НРП и другие экстремистские группировки представляют угрозу стабильности восстановленной монархии, их безрассудные амбиции могут втянуть Болгарию в несчастные войны, мы используем власть государства для подавления этих организаций, ареста их лидеров и ликвидации их сетей."

 BUL_eliminate_remaining_democrats_monarchist: "Уничтожить оставшихся демократов"
 BUL_eliminate_remaining_democrats_monarchist_desc: "Парламентская демократия оказалась слабой и расколотой. Остатки старых демократических партий, с их бесконечными дебатами и компромиссами, препятствуют решительному руководству, требуемому королевством, и мы отменим запрет на деятельность этих группировок и закрепим твердую политическую власть за короной и назначенными ею министрами."

 BUL_royal_dictatorship: "Королевский диктатор"
 BUL_royal_dictatorship_desc: "Царь не может быть ограничен мелкой политикой, чтобы обеспечить единство, порядок и реализацию его видения Болгарии, царь Борис III возьмет на себя полную диктаторскую власть. Парламент будет приостановлен на неопределенный срок, политические партии будут запрещены, и вся государственная власть выйдет непосредственно из дворца. Воля царя - это власть нации."

 BUL_royal_armoury: "Королевская артиллерия"
 BUL_royal_armoury_desc: "Король нуждается в преданных солдатах, а преданные солдаты нуждаются в современном оружии. Мы создадим новую Королевскую арму, предназначенную для производства оружия и снаряжения исключительно для подразделений, лично преданных Цару, что обеспечит монархию средствами для защиты от любых внутренних угроз."

 BUL_royal_brigades: "Королевские бригады"
 BUL_royal_brigades_desc: "Лояльность армии не всегда может быть гарантирована. Мы создадим новые «Королевские бригады», элитные подразделения, набранные за их непоколебимую преданность Цару. Эти формирования, оснащенные Королевской Армиями, будут служить в качестве праторианского стража монархии, готовый раздавить любое инакомыслие."

 BUL_bulgarian_royalism: "Болгарский роялизм"
 BUL_bulgarian_royalism_desc: "Монархия - это не просто политическая система, это душа Болгарии, мы предпримем национальную кампанию по поощрению болгарского царского роялизма, подчеркивая историческую роль царских властей, их связь с православной церковью и воплощение в них национального единства."

 BUL_economic_affairs: "Экономические вопросы"
 BUL_economic_affairs_desc: "Под руководством царя управление национальной экономикой должно осуществляться осмотрительно и эффективно, и мы будем проводить политику, ориентированную на стабильность, надежное финансирование и постепенное развитие промышленности и сельского хозяйства, обеспечивая процветание всех преданных подданных."

 BUL_wealth_of_aristocrats: "Богатство аристократов"
 BUL_wealth_of_aristocrats_desc: "Традиционная аристократия, хотя она и мала в Болгарии, остается столпом монархической системы."

 BUL_the_bulgarian_kingdom: "Болгарский царь"
 BUL_the_bulgarian_kingdom_desc: "Владыка царя правит, радикалы подавляются, народ объединяется под знаменем монархии, болгарское королевство остается стабильным и гордым, маяком традиций в неспокойном мире, готовым к осуществлению своей судьбы под твердой рукой своего суверена."

 #Democracy Tree
 BUL_democratic_victory: "Демократическая победа"
 BUL_democratic_victory_desc: "Силы экстремизма, как националистические, так и монархисты, потерпели поражение, народ Болгарии избрал путь демократии, свободы и парламентского правления, мы создадим стабильное конституционное правительство, приверженное защите прав всех граждан и направляющее Болгарию к мирному и процветающему будущему."

 BUL_eliminate_remaining_nationalists_democrat: "Уничтожить националистов"
 BUL_eliminate_remaining_nationalists_democrat_desc: "Жестокая антидемократическая идеология НРП и ее народа не имеет места в свободной Болгарии. Мы будем использовать всю силу закона для преследования их лидеров за измену и мятеж, демонтаж их военизированных организаций и обеспечение того, чтобы они никогда больше не угрожали нашей демократии."

 BUL_eliminate_remaining_monarchists_democrat: "Уничтожить монархистов"
 BUL_eliminate_remaining_monarchists_democrat_desc: "Несмотря на то, что сам царь не представляет прямой угрозы, монархистские фракции по-прежнему ведут заговор против демократического порядка, мы должны твердо установить принцип народного суверенитета, очистить государственный аппарат и армию монархистских симпатий и обеспечить лояльность конституции, а не короны."

 BUL_arsenal_of_democracy: "Арсенал демократии"
 BUL_arsenal_of_democracy_desc: "Мы будем инвестировать в нашу национальную оружейную промышленность, обеспечивая, чтобы болгарская армия была хорошо оснащена для защиты наших границ и сдерживания любых авторитарных соседей, которые могут попытаться уничтожить нашу свободу."

 BUL_friendship_with_the_west: "Дружба с Западом"
 BUL_friendship_with_the_west_desc: "Будущее Болгарии зависит от устоявшихся демократий Запада. Мы будем стремиться к установлению более тесных дипломатических, экономических и культурных связей с Францией, Великобританией и Соединенными Штатами, стремясь найти союзников, которые разделяют наши ценности и могут поддержать нашу зарождающуюся демократию."

 BUL_in_defence_of_democracy: "В защиту демократии"
 BUL_in_defence_of_democracy_desc: "По всей Европе усиливается авторитаризм, Болгария должна твердо выступить в качестве бастиона свободы на Балканах, и мы предпримем наши военные и дипломатические усилия для защиты демократии как внутри страны, так и за рубежом, объединяя альянсы и пакты, направленные на противодействие тирании."

 BUL_economic_affairs_democrat: "Экономические вопросы"
 BUL_economic_affairs_democrat_desc: "Для успешного развития демократии необходима процветающая экономика, которая отвечает интересам всех граждан, и мы будем проводить политику поощрения свободного предпринимательства, поддержки сельскохозяйственного развития и инвестирования в инфраструктуру, создавая при этом системы социальной защиты для защиты уязвимых слоев населения."

 BUL_international_investment: "Международные инвестиции"
 BUL_international_investment_desc: "Наша демократическая стабильность и западная ориентация делают Болгарию привлекательным местом для иностранного капитала. Мы будем активно стремиться к международным инвестициям, особенно из западных демократий, с тем чтобы помочь модернизировать нашу промышленность, создать рабочие места и интегрировать Болгарию в мировую экономику."

 BUL_the_bulgarian_democracy: "Истинная болгарская демократия"
 BUL_the_bulgarian_democracy_desc: "Переход завершен. Болгария представляет собой стабильную парламентскую демократию, ее институты защищены, ее экономика растет, а ее место среди свободных наций мира гарантировано. Мы доказали, что свобода может процветать даже в самом сердце Балкан."

 #Demo Foreign
 BUL_yugoslavist_foreign_policy: "Югославская внешняя политика"
 BUL_yugoslavist_foreign_policy_desc: "Разногласия между народами Южного славян не принесли ничего, кроме конфликта и слабости, позволив более крупным державам доминировать над нами. Настало время принять новое видение: югославизм. Мы будем проводить внешнюю политику, направленную на примирение и в конечном итоге воссоединение с нашими сербскими, хорватскими и словенскими братьями, создавая мощную федерацию, которая может обеспечить мир и процветание для всех южнославов."

 BUL_reconcilation_with_serbia: "Примирение с Сербией"
 BUL_reconcilation_with_serbia_desc: "Наиболее серьезным препятствием на пути единства Южного славянства является историческая вражда между болгарами и сербами, в частности над Македонией, мы должны быть более широкой нацией и протянуть руку дружбы, которая будет способствовать дипломатическим усилиям, направленным на примирение, взаимное признание и мирное урегулирование наших споров."

 BUL_settling_disputes: "Урегулирование споров"
 BUL_settling_disputes_desc: "Мы вступим в официальные переговоры с Белградом в целях урегулирования наших сохраняющихся территориальных споров, в частности в отношении администрации и культурных прав в Македонии."

 BUL_crush_the_IMRO: "Разрушить IMRO"
 BUL_crush_the_IMRO_desc: "Внутренняя македонская революционная организация, когда-то рассматривавшаяся как патриоты, сейчас является препятствием на пути к миру и объединению, их непрекращающийся терроризм отравляет отношения с Сербией и дестабилизирует регион. В качестве жеста доброй воли и необходимости порядка мы будем использовать всю мощь государства, чтобы раз и навсегда раздавить ММРО."

 BUL_treaty_of_union: "Союзный договор"
 BUL_treaty_of_union_desc: "Наши усилия по примирению принесли свои плоды. Настало время предложить официальный союзный договор, объединяющий Болгарию и Югославию в единое федеральное государство. Этот исторический договор очертит структуру новой федерации, гарантируя права и автономию каждой из входящих в нее государств."

 BUL_settling_internal_boundaries: "Установление внутренних границ"
 BUL_settling_internal_boundaries_desc: "С подписанием договора о профсоюзах мы должны сейчас рассмотреть сложный вопрос о внутренних границах в рамках новой федерации, и потребуются тщательные переговоры для того, чтобы установить линии, которые учитывали бы исторические, этнические и экономические реалии, обеспечивая стабильность и справедливость нового югославского государства."

 BUL_goal_choosing_a_capital: "Выбор столицы"
 BUL_goal_choosing_a_capital_desc: "Новая федерация нуждается в столице, Белграде, Софии или, возможно, в нейтральном месте? Это решение имеет огромный символический вес и должно выполняться деликатно, чтобы избежать фаворитизма по отношению к какой-либо отдельной стране."

 BUL_language_issue: "Языковой вопрос"
 BUL_language_issue_desc: "Болгарские и сербо-хорватские языки тесно связаны между собой, но не отличаются друг от друга. Мы должны разработать четкую языковую политику для федерации. Будут ли мы иметь несколько официальных языков или стремиться к созданию единого сербо-хорватского стандарта? Этот деликатный вопрос требует тщательного рассмотрения."

 BUL_fate_of_great_war_treaties: "Судьба договоров о Великой войне"
 BUL_fate_of_great_war_treaties_desc: "Объединение создает новое геополитическое образование: каков статус договоров, подписанных Болгарией и Югославией после Великой войны?"

 BUL_claims_of_yugoslavia: "Претензии Югославии"
 BUL_claims_of_yugoslavia_desc: "Теперь мы можем добиваться притязаний и амбиций, которые были бы невозможными только для Болгарии или Сербии, ища территорию из Италии, Албании, Греции или Румынии, чтобы объединить всех славян под одним знаменем."

 BUL_peaceful_unification: "Мирное объединение"
 BUL_peaceful_unification_desc: "На пути дипломатии и переговоров удалось добиться успеха. Югославия и Болгария мирно объединились, создав мощную новую федерацию на основе взаимного согласия, что является свидетельством мудрости сотрудничества в урегулировании конфликта."

 BUL_unification_by_force: "Унификация с помощью силы"
 BUL_unification_by_force_desc: "Наши соседи отказались от дружбы и примирения, и если Югославии не удастся достичь мирно, то она должна быть достигнута силой, мы подготовим наши армии к кампании по объединению южных славян под нашим руководством, независимо от того, желают они этого или нет."

 BUL_full_unification: "Полное объединение"
 BUL_full_unification_desc: "Новая Югославия является сильной и неделимой, крупной державой на Балканах, готовой занять свое место в Европе."

 BUL_fate_of_king: "Судьба сербского короля"
 BUL_fate_of_king_desc: "В связи с объединением возникает деликатный вопрос: какую роль, если таковая будет иметь место, будет играть сербская династия Караджордевич?"

 #Military Government
 BUL_military_takeover: "Военный захват"
 BUL_military_takeover_desc: "Политики потерпели неудачу, их бесконечные ссоры, неудачные войны и слабость поставили Болгарию на грань. Только армия, подлинник нации, может восстановить порядок и дисциплину. Генералы захватят контроль, приостановят действие конституции и создадут военное правительство, приверженное национальной силе и безопасности."

 BUL_restore_the_monarchy_mil: "Восстановить монархию"
 BUL_restore_the_monarchy_mil_desc: "В то время как военные в настоящее время имеют власть, многие офицеры остаются верными Короне."

 BUL_purge_the_democrats_mil: "Уничтожить либералов"
 BUL_purge_the_democrats_mil_desc: "Беспорядок либеральной демократии окончен, мы очистим администрацию и гражданское общество от политиков, интеллигенции и активистов, которые цепляются за провалившиеся идеалы парламентаризма, порядок и дисциплина требуют подавления несогласных голосов."

 BUL_purge_commie_filth: "Хирургическая социалистическая грязь"
 BUL_purge_commie_filth_desc: "Коммунизм и социализм - это рак, который проповедует разделение классов и подрывает национальное единство. Военное правительство не проявит милосердия. Мы охотимся и ликвидируем все социалистические клетки, профсоюзы и агитаторы. Их ядовитая идеология будет ликвидирована из Болгарии."

 BUL_recovering_from_the_civilwar: "Восстановление после гражданской войны"
 BUL_recovering_from_the_civilwar_desc: "Хотя захват власти и был необходимым, он, возможно, привел к серьезным сбоям и внутренним конфликтам, и наша первоочередная задача должна состоять в восстановлении порядка по всей стране, восстановлении поврежденной инфраструктуры и устранении разногласий, вызванных переходным процессом."

 BUL_fixing_the_economy: "Борьба с экономическими страданиями"
 BUL_fixing_the_economy_desc: "Политическая нестабильность нанесла ущерб экономике. Военное правительство должно взять на себя жесткий контроль над экономической политикой, стабилизировать валюту, контролировать инфляцию и направлять ресурсы на основные отрасли. Сильная экономика является основой национальной власти."

 BUL_economic_mobilisation: "Ремобилизовать Болгарию"
 BUL_economic_mobilisation_desc: "С восстановлением порядка мы должны сейчас подготовить страну к будущим вызовам, и эта программа экономической мобилизации поставит ключевые отрасли под государственный контроль, направляя производство на военные нужды и обеспечивая, чтобы Болгария имела промышленный потенциал для самозащиты и отстаивания своих интересов."

 BUL_in_defence_of_bulgaria_focus: "В защиту Болгарии"
 BUL_in_defence_of_bulgaria_focus_desc: "Главной обязанностью военного правительства является защита королевства, мы значительно увеличим военный бюджет, расширим призыв на военную службу, модернизируем наше оборудование и укрепим наши пограничные крепости, безопасность Болгарии будет гарантирована силой ее армии."

 BUL_new_opportunism: "Новые возможности"
 BUL_new_opportunism_desc: "Старые альянсы и ограничения исчезли. В условиях военного правления Болгария может проводить прагматичную, оппортунистичную внешнюю политику. Мы будем оценивать меняющийся баланс сил в Европе и присоединяться к той из группировок, с которой у нас есть наилучший шанс восстановить наши утраченные территории и защитить наши национальные интересы, не связанные идеологией."

 #Socialist Tree
 BUL_socialist_revolution: "Победный фронт Отечества"
 BUL_socialist_revolution_desc: "Коррумпированная монархия, слабые демократы и националисты были уничтожены! Фронт Отечества захватил власть во имя рабочих и крестьян. Наступила новая эра: эра народной демократии и социализма в Болгарии!"

 BUL_purge_the_monarchists: "Оставшиеся монархисты"
 BUL_purge_the_monarchists_desc: "Царь и его лакеи представляют собой старый, репрессивный порядок. В новой Болгарии не может быть места для них. Органы государственной безопасности охотятся и ликвидируют всех оставшихся монархистов, обеспечивая необратимость революции."

 BUL_purge_the_democrats: "Хищные либералы"
 BUL_purge_the_democrats_desc: "Буржуазская демократия - это обман, инструмент, используемый капиталистами для обмана рабочего класса. Так называемые "демократы" и либералы, которые цепляются за эту неудавшуюся систему, являются врагами революции. Они будут очищены от общественной жизни, их партии запрещены, их голоса замолчат."

 BUL_purge_the_nrp: "Хирурги НПФ"
 BUL_purge_the_nrp_desc: "Националистические фанатики НРП представляют собой наиболее опасные элементы старого режима - шовинистские, милитаристские и принципиально противоречащие социалистическому интернационализму."

 BUL_recovering_from_the_revolution: "Выход из революции"
 BUL_recovering_from_the_revolution_desc: "Революционная борьба, хотя и победившая, привела к серьезным сбоям. Фабрики бездействуют, поля не установлены, и контрреволюционные элементы все еще могут быть активными. Мы должны укрепить нашу власть, восстановить порядок и приступить к решению неотложной задачи восстановления нации на основе социалистических принципов."

 BUL_economic_affairs_commie: "Социалистическая экономика"
 BUL_economic_affairs_commie_desc: "Капитализм подвел болгарский народ. Мы построим новую социалистическую экономику, основанную на государственной собственности, центральном планировании и производстве для нужд масс, а не на прибыли немногих. Это заложит основу для подлинно эгалитарного общества."

 BUL_nationalise_industries: "Массовая национализация"
 BUL_nationalise_industries_desc: "Командные высоты экономики - банки, заводы, шахты и транспорт - должны принадлежать народу, и мы будем осуществлять программу массовой национализации, изъятия активов капиталистов и передачи их под контроль государства трудящихся."

 BUL_preserving_socialism: "Защита социализма"
 BUL_preserving_socialism_desc: "Капиталистические державы, окружающие нас, смотрят на нашу революцию враждебно, стремятся подорвать и уничтожить ее, мы должны укрепить нашу народную армию, создать сильные силы государственной безопасности и сохранять постоянную бдительность против внутренних и внешних врагов."

 BUL_to_a_socialist_future: "Социалистический свет Балкан"
 BUL_to_a_socialist_future_desc: "Сегодня Болгария является социалистическим светом Балкан, маяком надежды для рабочих масс соседних стран, мы построим процветающее, равноправное будущее, руководствуясь марксистско-ленинскими принципами, и сыграем свою роль в глобальной борьбе против империализма."

 #Military Tree
 BUL_appoint_rusev: "Продолжайте осуществление плана реформ Русева"
 BUL_appoint_rusev_desc: "План реформы болгарской армии, сосредоточенный на артиллерии и подавляющей огневой мощи, был принят Русевом в 1934 году с созданием правительства НРП и их желанием создать современную силу для борьбы с нашими врагами. Два года спустя работа над этим планом замедлилась, и мы должны возобновить эти реформы, если мы хотим защитить наши земли."
 BUL_rifle_modernisation: "Модернизация винтовок"
 BUL_rifle_modernisation_desc: "Хотя винтовки Великой войны хорошо служили нам на всех фронтах, они не подходят для современной войны после тех технических достижений, которые произошли за последние 20 лет в области стрелкового оружия."
 BUL_modern_artillery: "Современные артиллерийские кусочки"
 BUL_modern_artillery_desc: "Реформирование артиллерийской артиллерии не приносит пользы, если артиллерия еще не готова, а современная, мощная и надежная артиллерия должна быть как можно скорее готова к производству и применению на местах."
 BUL_foreign_military_contracts: "Программы кредитования армейских контрактов"
 BUL_foreign_military_contracts_desc: "Наша индустрия в настоящее время не готова к войне с нашими соседями, едва извлечена из договоров, навязанных нам Великой Войной, она по-прежнему омрачена нашими врагами. Договоренность с местными и международными фирмами , в то время как дорогая, позволит нам подготовиться к войне, хотя такая мера была бы лишь временной и прекратилась бы в военное время."
 BUL_quality_artillery: "Качество артиллерии"
 BUL_quality_artillery_desc: "Мы отличим себя не только от наших врагов с нашей высшей огневой мощью, но и от высшего качества оружия, которое в этом может быть."
 BUL_standardised_artillery: "Стандартизированная артиллерия"
 BUL_standardised_artillery_desc: "Стандартизация частей и конструкций нашей артиллерии позволит нам увеличить их количество на местах, сократив нагрузку на нашу промышленность, что позволит нам распределять наши очень скудные ресурсы в другом месте."
 BUL_larger_shells: "Мощные скорлупы"
 BUL_larger_shells_desc: "Наши снаряды могут быть высоковзрывчатыми, но они недостаточно высоковзрывчатыми."
 BUL_quality_rifles: "Оружие для кустарного промысла"
 BUL_quality_rifles_desc: "Это худший кошмар солдата на поле, мы проследим, чтобы наши люди могли успокоиться, чтобы их винтовки функционировали адекватно и надежно, когда придет время обратить их на наших врагов."
 BUL_perfected_rifling: "Прекрасная винтовка"
 BUL_perfected_rifling_desc: "Мы не верим в "если он не сломан, не исправляйте его"."
 BUL_standardised_rifles: "Стандартизованные винтовки"
 BUL_standardised_rifles_desc: "Наши реформы позволят нам завербовать огромное количество людей, как насчет того, чтобы дать им оружие?"
 BUL_war_time_mobilisation: "Мобилизация в военное время"
 BUL_war_time_mobilisation_desc: "У нас нет времени в мире для ведения этой войны, мы должны привлечь как можно больше людей на местах, чтобы убедиться в том, что эта война как можно скорее завершится, и это вывод, который видит в нас победителя."
 BUL_deploy_reservists: "Развертывать резервистов"
 BUL_deploy_reservists_desc: "У нас в резерве много преданных людей, жаждущих быть на поле боя, и мы отпустим их на наших врагов!"
 BUL_war_time_conscription: "Военный призыв"
 BUL_war_time_conscription_desc: "В то время как тысячи патриотических болгарских мужчин спешат к цветам, некоторые из слабосердечных недовольны тем, что они выходят на поле боя, они должны быть приведены вперед, нравится им это или нет!"
 BUL_emergency_forts_sofia: "Чрезвычайная оборона в Софии"
 BUL_emergency_forts_sofia_desc: "София - это дом нашего правительства и нашего народа, его потеря будет катастрофой."
 BUL_desperate_defence: "Отчаянная оборона"
 BUL_desperate_defence_desc: "Пока надежда на победу падает, мы должны быть уверены, что будем бороться всем, что в наших силах, чтобы выселить захватчика из нашей благословенной земли!"
 BUL_collect_rifles_from_civilians: "Изымать гражданские винтовки"
 BUL_collect_rifles_from_civilians_desc: "Как вражеские ботинки грязные для нашей земли, мы должны забрать у людей все, что в наших силах, чтобы наши люди были оснащены для того, чтобы отправить наших врагов туда, откуда они пришли!"
 BUL_restoring_military_pride: "Восстановление военного высокомерия"
 BUL_restoring_military_pride_desc: "Первая и вторая национальная катастрофа ликвидировала гордость нашего народа в своих вооруженных силах и искоренила веру в то, что он может защитить нашу родину и интересы."
 BUL_increase_conscription: "Увеличить воинскую службу"
 BUL_increase_conscription_desc: "На более простой стороне наших интенсивных реформ будет общее увеличение призыва на военную службу. и, возможно, однажды мы присоединимся к великим державам Европы."
 BUL_rapid_mobilisation: "Оперативная мобилизация"
 BUL_rapid_mobilisation_desc: "Новые системы вербовки и призыва на военную службу позволят нам добиться таких же результатов."
 BUL_martial_spirit: "Военный дух"
 BUL_martial_spirit_desc: "То, что отличало прусского от врагов, было не обязательно размером с его армию, а его дисциплиной и воинственным духом, и мы восстановим этот дух среди наших людей и их офицеров."
 BUL_decisive_attacks: "Решительные нападения"
 BUL_decisive_attacks_desc: "Согласованные удары по нашим врагам с подавляющей силой и силой, несомненно, вытеснят наших врагов даже с самого безопасного положения."
 BUL_prussia_of_the_balkans_focus: "Пруссия Балкан"
 BUL_prussia_of_the_balkans_focus_desc: "От Адриатики до Черного моря никто не будет соперничать с болгарской армией, как прусцы века, наш могущественный карлик, и наши враги были бы мудры, чтобы не недооценивать нас. Мы пройдем балканские горы так, как прусские маршировали с легкостью над Североевропейской равниной."
 BUL_tank_experimentation: "Экспериментальные испытания цистерн"
 BUL_tank_experimentation_desc: "В то время как наши предыдущие реформы были сосредоточены на артиллерии, мы должны взглянуть на современный мир и признать, что эта сила должна сочетаться с той силой, которую дает скорость."
 BUL_modern_tank_designs: "Современные конструкции цистерн"
 BUL_modern_tank_designs_desc: "У нас должно быть лучшее инженерное оборудование для наших танковых корпусов."
 BUL_new_tank_factories: "Новые заводы-цистерны"
 BUL_new_tank_factories_desc: "Чтобы поддержать наш новый корпус танков, у нас должна быть индустрия, чтобы подделать зверей, в которые они попадут на поле боя."
 BUL_balkan_bewegungskrieg: "Балканский Бевегунгскриг"
 BUL_balkan_bewegungskrieg_desc: "Мы должны скорректировать нашу доктрину с учетом нашего нового акцента на доспехах, убедившись, что не только наши доспехи, но и наша кавалерия, люди и машины понимают наш новый акцент на скорости."
 BUL_new_infantry_divisions: "Новые подразделения пехоты"
 BUL_new_infantry_divisions_desc: "Мы должны продолжить работу над нашими установленными реформами посредством организации и развертывания новых пехотных дивизий, готовых к новому виду войны, в которую мы войдем."
 BUL_revolution_in_artillery: "Революция в артиллерии"
 BUL_revolution_in_artillery_desc: "Есть только больше возможностей для совершенствования наших артиллерийских орудий, и выделение большего объема ресурсов на разработку новых артиллерийских орудий может быть лишь положительным."
 BUL_new_artillery_factories: "Новые артиллерийские фабрики"
 BUL_new_artillery_factories_desc: "Мы должны обеспечить, чтобы огромное количество артиллерийских орудий, которые нам нужны, действительно доходило до фронта."
 BUL_reign_of_power: "Регулирование власти"
 BUL_reign_of_power_desc: "Наши враги разрываются при контакте, не в состоянии справиться с огромным количеством снарядов, которые разрывают их и их товарищей на части, в то время как наша эффективная пехота отнимает то, что осталось."
 BUL_finalise_reforms: "Завершение реформ"
 BUL_finalise_reforms_desc: "Мы выделили огромные ресурсы, которые могли бы пойти на реформу наших вооруженных сил, хотя даже те, кто не верит, с гордостью смотрят на болгарскую армию, и нам следует завершить эти реформы, обеспечив, чтобы наша доктрина была готова к лидерству болгарских мужчин на фронте."

 #Air Tree
 BUL_bulgarian_air_force: "Болгарские военно-воздушные силы"
 BUL_bulgarian_air_force_desc: "Самолёт революционизирует войну, но Болгария отстаёт. Наша нынешняя «воздушная сила» — это не что иное, как коллекция устаревших иностранных отбросов. Если мы хотим стать современной военной силой, способной защищать наше небо и поддерживать наши наземные войска, мы должны вложить значительные средства в создание настоящих болгарских военно-воздушных сил."

 BUL_bulgarian_air_industry: "Болгарская авиакомпания"
 BUL_bulgarian_air_industry_desc: "Военно-воздушные силы, зависящие от иностранных самолетов, всегда находятся в уязвимом положении. Мы должны создать свою собственную национальную авиационную промышленность, которая будет финансировать создание завода и научно-исследовательского центра ДАР (Darzavna Aeropanna Rabotilnitsa), первоначально специализируясь на лицензировании производства и в конечном итоге переходя к оригинальным болгарским разработкам."

 BUL_eastern_air_bases: "Восточные военно-воздушные базы"
 BUL_eastern_air_bases_desc: "Наши нынешние аэродромы сосредоточены вокруг Софии, оставляя наш восточный фланг незащищенным, особенно в отношении Румынии и Турции, мы построим сеть новых современных авиабаз в восточной части Болгарии, что позволит обеспечить быстрое развертывание авиации для защиты нашего Черноморского побережья и поддержки операций в Добудже или Фракии."

 BUL_improved_doctrine: "Современные доктрины воздушного пространства"
 BUL_improved_doctrine_desc: "Самолётов недостаточно; наши пилоты должны знать, как эффективно бороться. Мы отправим наших лучших офицеров за границу для изучения последних военно-воздушных доктрин, разрабатываемых крупными державами, с уделением особого внимания тактике истребителей, координации наземных нападений и стратегическим бомбардировкам. Это обеспечивает использование нашими военно-воздушными силами самых современных тактических концепций."

 BUL_modernised_planes: "Новые конструкции самолета"
 BUL_modernised_planes_desc: "Наши инженеры в ДАР должны приступить к разработке оригинальных болгарских летательных аппаратов, адаптированных к нашим конкретным потребностям и местности."

 BUL_air_exercises: "Воздушные учения"
 BUL_air_exercises_desc: "Мы будем проводить крупномасштабные воздушные учения, моделировать реалистичные сценарии боевых действий в целях повышения квалификации пилотов, проверки наших доктрин и улучшения координации между воздушными и наземными подразделениями."

 BUL_renewed_airforce: "Возобновленные военно-воздушные силы"
 BUL_renewed_airforce_desc: "Наши усилия принесли свои плоды. Болгария располагает современными военно-воздушными силами, оснащенными отечественными или лицензированными самолетами, основанными на здравой доктрине и стратегически базирующимися по всей стране. Наши небеса в безопасности, и наша армия имеет воздушную поддержку, необходимую для достижения победы."

 #Navy Tree
 BUL_bulgarian_navy_tree: "Болгарские военно-морские силы"
 BUL_bulgarian_navy_tree_desc: "Будучи граничащей с разрушительным Договором Нойлли, Болгария была лишена эгейской береговой линии, а ее флот был сокращен до нескольких патрульных лодок на Черном море. Страна с амбициями не может быть без надлежащего флота . Мы должны вновь восстановить болгарские военно-морские силы для защиты нашего оставшегося побережья и проектировать власть ."

 BUL_restore_thracian_port: "Восстановить фракийский порт"
 BUL_restore_thracian_port_desc: "Если нам удастся освободить Западную Фракию, то порт Дедеагач станет нашим входом в Эгейское море, и мы должны незамедлительно вложить средства в восстановление и расширение его гаваней, дноуглубительные каналы и строительство военно-морской инфраструктуры, с тем чтобы он стал главной базой для нашего перерожденного средиземноморского флота."

 BUL_improve_dobruja_port: "Улучшить порт Добруджа"
 BUL_improve_dobruja_port_desc: "Если Южный Добруджа будет возвращен в родную страну, порт Балчик предлагает ценную стратегическую позицию на побережье Черного моря, к северу от Варны, и мы вложим средства в улучшение его гавани и сооружений, превратив его в вторичную военно-морскую базу для поддержки операций в северной части Черного моря."

 BUL_reviving_the_fleet: "Возрождение болгарского флота"
 BUL_reviving_the_fleet_desc: "Мы должны приобрести настоящие военные корабли, которые будут выделять средства на приобретение или строительство основных военно-морских подразделений, торпедных лодок, минных полей и, возможно, даже небольших разрушителей или подводных лодок: ядро восстановленного флота."

 BUL_modern_designs: "Современные конструкции судов"
 BUL_modern_designs_desc: "Мы должны приобрести знания для создания нашего современного флота. мы будем искать архитекторов и техническую помощь у дружественных держав, создавая проектное бюро, способное разрабатывать планы для современных эсминцев, подводных лодок и крейсеров."

 BUL_dockyard_expansion: "Расширение докьярда"
 BUL_dockyard_expansion_desc: "Наши существующие верфи в Варне недостаточны для строительства современных военных кораблей."

 BUL_expand_varna_port: "Расширить порт Варна"
 BUL_expand_varna_port_desc: "Варна является историческим центром болгарского военно-морского флота и нашим главным портом Черного моря."

 BUL_naval_air_arm: "Морской воздушный транспорт"
 BUL_naval_air_arm_desc: "Современные военно-морские силы не могут эффективно функционировать без воздушного прикрытия. Мы создадим военно-морское воздушное подразделение, приобретем поплавковые самолеты и, возможно, наземные морские патрульные самолеты. Эти самолеты будут осуществлять разведку, патрулирование с целью борьбы с подводными лодками и предоставлять информацию о целях нашего флота."

 BUL_reorganised_fleet: "Реорганизованный флот"
 BUL_reorganised_fleet_desc: "Наше военно-морское возрождение завершено, хотя, возможно, и не самое большое, болгарские военно-морские силы в настоящее время являются современной, хорошо оснащенной силой, способной защитить наши побережья на Черном море и, возможно, на Эгейском море. Наши верфи активны, наши моряки обучены, и наш флаг снова с гордостью летит на волнах."

 #Industrial Tree
 BUL_bulgarian_industrial_revival: "Промышленное возрождение Болгарии"
 BUL_bulgarian_industrial_revival_desc: "Болгария по-прежнему является преимущественно аграрным государством, отстающим от промышленно развитых держав Европы, и для достижения национального величия, обеспечения нашей обороны и улучшения жизни нашего народа мы должны приступить к осуществлению всеобъемлющей программы индустриализации, которая станет движущей силой нашего национального возрождения."

 BUL_muesmann_plan: "План Муесманн"
 BUL_muesmann_plan_desc: "Немецкий архитектор профессор Адольф Муесманн представил смелый городской план для Софии, предусматривающий современный монументальный капитал, достойный великой нации."

 BUL_muesmann_plan_south: "План развития стран Юга"
 BUL_muesmann_plan_south_desc: "Вдохновленные планом Муесманна для Софии, мы будем разрабатывать аналогичную всеобъемлющую стратегию развития для южной части Болгарии, уделяя особое внимание модернизации таких городов, как Пловдив, и совершенствованию инфраструктуры в плодородной фракианской равнине, что позволит более полно интегрировать юг в национальную экономику."

 BUL_muesmann_plan_east: "Восточный туризм"
 BUL_muesmann_plan_east_desc: "Применяя современные принципы планирования, мы будем развивать такие курорты, как Варна и Бургас, инвестируя в гостиничное дело, транспорт и удобства, чтобы привлечь иностранных посетителей и генерировать ценную валюту."

 BUL_black_sea_shipping: "Черное море"
 BUL_black_sea_shipping_desc: "Наши черноморские порты являются жизненно важными каналами торговли, однако наш торговый морской флот является небольшим и устаревшим."

 BUL_southern_militarisation: "Южная милитаризация"
 BUL_southern_militarisation_desc: "Наша южная граница с Грецией и Турцией имеет стратегическое значение и потенциально уязвима."

 BUL_bulgarian_remilitarisation: "Болгарская ремилитаризация"
 BUL_bulgarian_remilitarisation_desc: "Ограничения, введенные Договором Нойлли в отношении наших вооруженных сил, неприемлемы, и мы будем открыто игнорировать их, инициируя полномасштабную программу милитаризации, что требует массового расширения нашей оружейной промышленности, строительства новых заводов для винтовок, пулеметов, артиллерийских орудий и боеприпасов для оснащения большой современной армии."

 BUL_steel_and_armaments: "Сталь и стрелковое оружие"
 BUL_steel_and_armaments_desc: "Основой любой военной промышленности является производство стали и способность производить основное пехотное оружие; мы будем вкладывать значительные средства в расширение сталелитейных заводов Перника и арсенала Казанлака, обеспечивая внутреннее снабжение высококачественной стали и массовое производство современного стрелкового оружия."

 BUL_central_industy: "Центр промышленного развития"
 BUL_central_industy_desc: "Мы будем содействовать промышленному развитию таких городов, как Перник и Стара Загора, уделяя особое внимание добыче угля, машинному оборудованию и производству для создания диверсифицированной промышленной зоны."

 BUL_southern_industrialisation: "южная индустриализация"
 BUL_southern_industrialisation_desc: "Мы будем поощрять индустриализацию здесь, уделяя особое внимание пищевой промышленности, текстильной промышленности и легкой промышленности, используя сельскохозяйственные богатства Фракской равнины для создания прочной региональной экономики."

 BUL_establish_industrial_state_cooperation: "Сотрудничество между государственным и промышленным секторами"
 BUL_establish_industrial_state_cooperation_desc: "Мы создадим промышленные советы и предоставим государственные субсидии и контракты ключевым отраслям, направляя национальное развитие на основе тесного сотрудничества между министерствами и крупными компаниями."

 BUL_serbmacedonian_factories: "Северная македонская промышленность"
 BUL_serbmacedonian_factories_desc: "Если мы освободим Северную Македонию от сербского правления, мы должны интегрировать ее экономику."

 BUL_greekmacedonian_factories: "Центральная и Восточная македонская промышленность"
 BUL_greekmacedonian_factories_desc: "Если Центральная и Восточная Македония окажется под нашим контролем, промышленный потенциал вокруг Салоники (Солун) огромен. Мы вложим значительные средства в эти фабрики, используя их мощности для производства текстильных изделий, химикатов и обрабатывающей промышленности, чтобы значительно увеличить промышленную мощь Большой Болгарии."

 BUL_dobrouja_factories: "Добрруджайская промышленность"
 BUL_dobrouja_factories_desc: "После возвращения Южной Добруджи мы должны развивать ее экономику, выйдя за рамки сельского хозяйства, мы создадим новые предприятия легкой промышленности и пищевой промышленности в таких городах, как Добрих и Силистра, создавая рабочие места и полностью интегрируя провинцию в национальную экономику."

 BUL_thracian_factories: "Фабрики во Фракии"
 BUL_thracian_factories_desc: "Освобождение Западной Фракии предоставляет нам доступ к Эгейскому морю и потенциалу его портов. Мы будем инвестировать в развитие отраслей, связанных с судоходством, рыболовством и переработкой табака в таких городах, как Ксанти и Комотини, что сделает регион ценным вкладом в национальную экономику."

 BUL_greatbulgaria_industrial_power: "Балканская промышленная сверхдержава"
 BUL_greatbulgaria_industrial_power_desc: "Наше национальное возрождение завершено. Благодаря государственному планированию, инвестициям и интеграции освобожденных территорий Болгария превратилась из аграрной подводной воды в промышленную электростанцию Балкан. Наши фабрики рычат, наши рабочие процветают, и наша нация является сильной и самодостаточной."

 BUL_expand_national_lines: "Расширение национальных линий"
 BUL_expand_national_lines_desc: "Современная промышленная экономика требует эффективного транспорта. Наша существующая железнодорожная сеть неадекватна. Мы профинансироваем значительное расширение национальных железнодорожных линий, двупутные маршруты, строительство новых соединений и улучшение сигнала для увеличения пропускной способности и скорости."

 BUL_western_macedonia_lines: "Западные македонские линии"
 BUL_western_macedonia_lines_desc: "Мы построим новые железнодорожные линии, соединяющие Скопье и Битолу на восток, облегчая перемещение товаров, войск и людей, которые будут прочно связывать Македонию с страной."

 BUL_lines_in_dobrouja: "Линии в Добрудже"
 BUL_lines_in_dobrouja_desc: "Мы построим новые железнодорожные шпоры, соединяющие ее сельскохозяйственные центры и порт Балчик с основной болгарской сетью, с тем чтобы ее продукция могла эффективно доставляться на национальные и международные рынки."

 BUL_lines_in_westthraceandeastmac: "Линии в Македонии и Фракии"
 BUL_lines_in_westthraceandeastmac_desc: "Для использования экономического потенциала освобожденных Македонии и Фракии, в частности порта Салоники (Солун) и побережья Эгейского моря, мы должны построить современные железнодорожные соединения, проходящие к югу и западу от болгарской основной сети."

 BUL_lines_in_eastern_thrace: "София - Царграду"
 BUL_lines_in_eastern_thrace_desc: "В случае реализации мечты Царграда важное значение будет иметь прямое высокоскоростное железнодорожное сообщение между Софией и Константинополем, которое позволит быстро установить связь между старой столицей и новым, укрепив наш контроль над этим жизненно важным регионом."

 BUL_modern_industries: "Инновации в промышленности"
 BUL_modern_industries_desc: "Мы создадим технические университеты и научно-исследовательские институты, поощряя инновации в области химических веществ, инженерных и производственных процессов, с тем чтобы обеспечить сохранение конкурентоспособности болгарской промышленности."

 BUL_advanced_electronics: "Усовершенствованная электроника"
 BUL_advanced_electronics_desc: "В будущем мы создадим национальный центр исследований в области электроники, финансируем ученых и инженеров для развития внутреннего опыта в этой важнейшей области."

 BUL_airwave_development: "Исследования в области аэроволновой энергии"
 BUL_airwave_development_desc: "Радиодиагностика и дистанция (RADAR) - это революционная технология с огромным военным потенциалом, мы будем вкладывать значительные средства в исследования «воздушной волны», направленные на разработку наших собственных систем RADAR для раннего предупреждения и противовоздушной обороны."

 BUL_new_research_centres: "Новые исследовательские центры"
 BUL_new_research_centres_desc: "Мы создадим новые научно-исследовательские центры по всей стране, уделяя особое внимание прикладным наукам, материалотехнологиям и промышленной эффективности, поощряя культуру инноваций."

 #Tooltip
 BUL_serbian_reperations_bul: "Возмещение ущерба в ходе войны в Сербии"
 BUL_serbian_reperations_ser: "Выплаты компенсации в связи с войной"

 ### Events ###
 bulgaria.1.d: "Двадцатое столетие началось с, казалось бы, восходящей Болгарии, новой независимой и на пути к реализации мечты о «Великой Болгарии», которая была главной целью внешней политики болгарского народа и государства со времени заключения Сан-Стефанского договора в 1878 году. Однако эта мечта разорвалась перед болгарским народом, и в течение следующих нескольких лет ее глаза были очень большими. Победившая в Первой балканской войне Болгария, несмотря на самый большой вклад в победу, была предана Лондонскому договору своими давнишними союзниками, когда львиная доля Македонии направлялась к сербам и грекам. В результате этого предательства Болгария объявила войну Сербии и Греции, начав вторую Балканскую войну, прежде чем ее оттолкнули и атаковали со всех сторон, а румынские и оттоманы напали на Болгарию, прежде чем четыре державы разделили их."
 ###
 bulgaria.2.d: "Мы подписали союз с Венгрией против Румынии под предлогом того, что нам вернут земли Добруджи в победу. Теперь Венгрия находится в состоянии войны с Румынией, и они призывают нас присоединиться к ним. Соблюдаем ли мы наш договор?"
 ###
 bulgaria.3.d: "В период 1920-х годов в Болгарской Республике царили волнения, хотя и при полной преемственности в правительстве. Послевоенный подъем радикальных социалистических и националистических партий ознаменовался формированием демократической коалиции Демократической партией, Радикальной демократической партией, Национальной либеральной партией и народными прогрессивными. Этот блок был назван Союзом за демократию, но просто функционировал как способ поддержания власти, статуса и продвижения интересов правящей элиты. В 1930 году в результате действий этого блока в Национальную республиканскую партию воспламенились внутренние расколы блока, что привело к быстрому краху и формированию второй либеральной концентрации национальных либералов и народных прогрессивных сил, названной в честь Либеральной коалиции Васила Радославова. Н. Этого недостаточно для того, чтобы спасти либеральное правление в Болгарии, поскольку в 1934 году на выборах в Болгарию Национальная республиканская партия, недавно возглавляемая молодым Иваном Дочевым, победила в правительстве меньшинства, причем либералы не смогли сформировать коалиции, которая бы воспрепятствовать этому. Сегодня партия Дочевава быстро наращивала свою власть, а также посредством убийств, платных и дружеских назначений государства, как представляется, так и так, что ве по отношению к боланская партия, является постоянной, по отношению к логией, в своих манистской, по отношению к лояльной, в пользу."
 ###
 bulgaria.4.d: "В 1919 году Болгария была брошена волкам Сербии и Румынии в качестве утешающего приза за их разочарования в Далматии и Трансильвании, соответственно. Эти две державы, наряду с извращенными греками, разорвали Болгарию за столами Нойлли-сюр-Сейна, в 1920 году Сербия переместила всю свою болгарскую границу на восток, даже захватив город Видин в этом незаконном и непристойном продвижении. Румыния похитила южную Добруджу и в большей степени попала в город Варна. Греки похитили Болгарию на побережье Эгейского моря вместе с различными другими изменениями границы, даже пытаясь пойти дальше и аннексировать то, что в настоящее время является демилитаризованной зоной. Хотя они не справились из-за румынских и сербских разногласий, а также из-за отсутствия поддержки со стороны Великобритании, они до сих пор не справляются с этой проблемой."
 ###
 bulgaria.5.d: "В 1934 году, когда юный Дочев захватил власть на выборах из застоя второй либеральной концентрации, это не увидело конца демократической оппозиции, и не видело конца более широкой оппозиции, поскольку монархисты из более незначительных групп борются за власть, в то время как болгарская республика, кажется, имеет полный контроль над Дочевом, может случиться, что другая группа воспользуется возможностью доминировать, мы должны действовать осторожно в этом климате и помнить, кто наши друзья и враги..."
 ###
 bulgaria.6.d: "Сегодня Дочев объявил об официальном прекращении Болгарской Республики и ее замене новым болгарским государством, что совпало с объявлением о том, что различные формы оппозиции государству в настоящее время являются незаконными. Различные идеологии и убеждения в них были криминализированы, такие как социалистические и демократические убеждения. Филиал НРП патрулирует улицы Болгарии, обеспечивая соблюдение этого нового диктата; отсутствие реального сопротивления этим актам воспринимается как имплицитное согласие болгарского народа; НРП в настоящее время полностью контролируется, а нация выступает за конфронтацию со своими соседями."
 ###
 bulgaria.7.d: "Чаос вспыхнул сегодня в болгарском парламенте, когда члены НРП были насильственно отстранены от работы в парламенте, а Дочев был помещен под домашний арест военными, а затем Атанас Буров объявил о том, что будет сформировано новое либеральное правительство большинства, при этом в настоящее время нелегальные члены НРП занимают свои места во Второй Концентрации во имя плавной передачи власти."
 ###
 bulgaria.8.d: "К удивлению и радости многих, сегодня развернулся царский заговор, который привел к отмене ссылки Бориса III и к провозглашению Цардома Болгарии с Борисом в его голове. Это является неожиданностью из-за огромного влияния НРП, однако такое влияние уменьшилось в последние моменты, когда их правительство меньшинства было слабым перед лицом его оппозиции на всех фронтах. Такая слабость привела к восстановлению, к огорчению как сторонников НРП, так и либеральных республиканцев, и обе группы должны иметь дело с продвижением вперед. Тем временем Борис III возвращается домой из долгой ссылки, готовой привести Болгарию в славное будущее."
 ###
 bulgaria.9.d: "Несмотря на трудности, с которыми сталкивается болгарская нация в результате второй национальной катастрофы, несмотря на дипломатическую изоляцию, несмотря на наличие врагов со всех сторон, несмотря на все это, болгарский народ одержал победу над своими врагами."
 ###
 bulgaria.10.d: "Очевидно, что нынешняя война превратилась в войну за выживание Болгарии, борясь с нашими агрессивными соседями без внешней поддержки. Для решения этой проблемы видные представители последнего поколения лидеров болгарской армии собрались в Софии для обсуждения нынешней военной ситуации. Несмотря на некоторые рекомендации нынешнему правительству, только Владимир Вазов встал и выразил желание вернуться к активной службе. Его помнят как прекрасного генерала из Великой войны, но особенно вспоминают о битве при Дойране, где он спровоцировал поражение своих британских оппонентов, несмотря на то, что их было больше. В 1918 году он также оттолкнул обширное англо-греческое нападение на болгарские позиции. Его возвращение, несомненно, укрепило бы моральный дух и дало бы способному лидеру наших людей, хотя, возможно, было бы предпочтительнее для него подготовить молодых офицеров."
 ###
 bulgaria.11.d: "Генерал Владимир Вазов, находящийся в настоящее время в состоянии мира, вновь отошел от активной службы. Говорят, что состояние его здоровья ухудшается, и он планирует вернуться в свою родную деревню Рибарица, где он планирует провести остаток своих дней."
 ###

 #Foreign Events#
 bulforeign.1.d: "Болгария вновь показывает миру, почему она называется «Пруссия Балкан» — жестокий милитаризм. Хотя мы могли легко отойти в сторону и позволить двум врагам сражаться до смерти, окончание этой войны может привести к укреплению Болгарии, что может оказаться большим вызовом для нашей нации, поскольку, вероятно, они будут смотреть на наши земли в будущем. Чтобы предотвратить это, мы были представлены предложениями членов нашего правительства и военных с целью предотвратить болгарскую агрессию и вмешаться в продолжающуюся войну. Хотя это, возможно, и не является популярным вариантом, это, безусловно, безопаснее, чем бить по батареее по дороге."
 bulforeign.2.d: "Лондонский фондовый рынок не только испытал на себе глобальное воздействие в области экономики, но и оставил мировой свидетель дипломатической революции по мере быстрого разрастания британской гегемонии. Это упало прямо на наш пороге, так как британская поддержка греков в военном и дипломатическом отношении рассеялась, когда Великобритания объявила о прекращении своей гарантии греческой независимости из-за попыток уменьшить финансовое бремя британских военных и уменьшить нагрузку глобальной дипломатии на финансы Великобритании. Из-за интересов Греции в регионе они, как правило, рассматривались с британской поддержкой в качестве принудительного выполнения требований договора Болгарии в южной части Болгарии, а именно в отношении демилитаризованной зоны."
 bulforeign.3.d: "Сейчас победившее правительство Болгарии, одержавшее победу над своими соседями, теперь ищет большую защиту от Германии в обмен на распространение немецкого порядка на Балканы."
 bulforeign.4.d: "Правительство Германии приняло наше предложение, и теперь мы являемся полноправными членами Пакта Стали, и мы извлекли пользу из защиты Германии от наших региональных врагов, в то время как немцы получат нашу поддержку в изменении европейского порядка."
 bulforeign.5.d: "Немцы отвергли наше предложение, и мы снова оказались изолированными в мире."
 bulforeign.6.d: "С формированием югославского государства по инициативе Болгарии и завершением объединения этого государства югославское правительство обратилось к нам с предложением присоединиться к Согласию."
 bulforeign.7.d: "Франция согласилась с нашей просьбой присоединиться к их альянсу, и сейчас мы стоим вместе с нашими европейскими братьями."
 bulforeign.8.d: "Похоже, мы должны искать друзей в другом месте."
 bulforeign.9.d: ""
 bulforeign.10.d: ""
 bulforeign.11.d: ""
 bulforeign.12.d: ""
 bulforeign.13.d: ""
 bulforeign.100.d: "Глупая греческая нация совершила упреждающее нападение на нашу нацию, мы можем только предположить, что их цели заключаются в полном уничтожении болгарского народа и захвате нашей южной границы, и тем самым мы можем положить конец фасаду позитивных отношений с ними и объявить о наших требованиях на их территории."
 bulforeign.101.d: "Глупые румыны начали упреждающее нападение на нашу страну, мы можем только предположить, что их цели заключаются в полном уничтожении болгарского народа, устранении угрозы, которую наша великая армия представляет для их земель, и тем самым мы можем положить конец фасаду позитивных отношений с ними и объявить о своих требованиях на их территории."
 bulforeign.102.d: "Жестокие сербы начали упреждающее нападение на нашу страну, и мы можем лишь предположить, что их цели заключаются в полном уничтожении болгарского народа, сохранении основного элемента болгаро-сербских отношений, существовавших на протяжении последних 30 лет, и тем самым мы можем положить конец фасаду позитивных отношений с ними и объявить о своих притязаниях на их территорию."

 #Flavour Events#
 bulgariaflavour.1.d: "С момента окончания балканских войн Болгария постоянно боролась с дипломатической изоляцией, лишенной защиты Великой державы после дипломатической перестройки Сербии и России. В окружении врагов Великая война видела, как Болгария обрела безопасность под крылом Прусского орла. Это не должно было продолжаться, поскольку поражение Германии в 1919 году вновь оставило Болгарию без защитника, что имело тяжелые последствия после того, как на балканском побережье спустились соседи Болгарии. Несмотря на успех Валькистского движения и вышеупомянутые исторические связи с Германией привели Дочева к поиску новых связей с нацией. Встреча Адама Дресслера, а также ряда ведущих валькских деятелей в Берлине, Дочев заявил о важности установления связей и их способности защищать интересы Германии. Однако после того, как два главы государств завершили свои обсуждения, Дочев получил экскурсию по столице страны, демонстрирующую некоторые великие работы, предпринятые государством Валькисты."
