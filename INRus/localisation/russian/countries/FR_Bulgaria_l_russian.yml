 BUL_national_catastrophe: "Наследие второй национальной катастрофы"
 BUL_national_catastrophe_desc: "В 1919 году Болгария была брошена волкам Сербии и Румынии в качестве утешающего приза за их разочарования в Далматии и Трансильвании, соответственно. Эти две державы, наряду с извращенными греками, разорвали Болгарию за столами Нойлли-сюр-Сейна, в 1920 году Сербия переместила всю свою болгарскую границу на восток, даже захватив город Видин в этом незаконном и непристойном продвижении. Румыния похитила южную Добруджу и в большей степени попала в город Варна. Греки похитили Болгарию на побережье Эгейского моря вместе с различными другими изменениями границы, даже пытаясь пойти дальше и аннексировать то, что в настоящее время является демилитаризованной зоной. Хотя они не справились из-за румынских и сербских разногласий, а также из-за отсутствия поддержки со стороны Великобритании, они до сих пор не справляются с этой проблемой."
 BUL_political_struggle: "Политический хаос"
 BUL_political_struggle_desc: "На первый взгляд, Национальная республиканская партия правит железным кулаком и находится на грани обеспечения полного контроля над государством. В действительности, болгарская политическая ситуация определяется тройной борьбой за власть между правящей Национальной республиканской партией, демократическими силами, сосредоточенными вокруг второй либеральной концентрации, и теми, кто лоялен к изгнанному монарху, бывшему Цару Борису III. Все трое борются за контроль над тремя ключами к власти Болгарии: армией, парламентом и элитой. Пока это будет продолжаться, будет существовать состояние политического хаоса, поскольку институты и улицы Болгарии являются политическими и буквальными полемками для политических сил каждой группы интересов."
 BUL_political_struggle_2: "Политический хаос"
 BUL_political_struggle_2_desc: "На первый взгляд, Национальная республиканская партия правит железным кулаком и находится на грани обеспечения полного контроля над государством. В действительности, болгарская политическая ситуация определяется тройной борьбой за власть между правящей Национальной республиканской партией, демократическими силами, сосредоточенными вокруг второй либеральной концентрации, и теми, кто лоялен к изгнанному монарху, бывшему Цару Борису III. Все трое борются за контроль над тремя ключами к власти Болгарии: армией, парламентом и элитой. Пока это будет продолжаться, будет существовать состояние политического хаоса, поскольку институты и улицы Болгарии являются политическими и буквальными полемками для политических сил каждой группы интересов."
