 bulpeace.20.d: "В этот раз Константинополь вновь пал не мусульманским захватчиком, а православной христианской державой."
 bulpeace.21.d: "Болгарцы отвергли наши мирные инициативы, и сейчас мы сталкиваемся с новой болгарской атакой."
 bulpeace.22.d: "Югославская армия прошла через нашу территорию, и, несмотря на смелость наших сил, югославы успешно схватили свои притязания вместе с огромными участками нашей земли. Перед лицом полного краха многие в нашем правительстве сочли нужным вступить в мирные переговоры с югославами, чтобы мы не были уничтожены и могли жить в битве с Югославией в другой день."
 bulpeace.23.d: "Несмотря на твердую защиту от венгров, мы захватили большую часть спорных территорий и больше, и теперь они подают в суд на мир. Славские земли Венгрии будут возвращены, а их суверенитет будет сохранен, что предотвратит потенциально дорогостоящее дальнейшее продвижение в Венгрию."
 bulpeace.24.d: "Югославцы отвергли наши мирные инициативы, и сейчас мы сталкиваемся с новой югославской атакой."
 bulpeace.25.d: "Югославская армия прошла через нашу территорию, и, несмотря на смелость наших сил, югославы успешно схватили свои притязания вместе с огромными участками нашей земли. Перед лицом полного краха многие в нашем правительстве сочли нужным вступить в мирные переговоры с югославами, чтобы мы не были уничтожены и могли жить в битве с Югославией в другой день."
 bulpeace.26.d: "Несмотря на огромные трудности, итальянцы пострадали от военного краха перед лицом югославского оружия. По мере нашего дальнейшего продвижения на Итальянский полуостров наши успехи становятся все более дорогостоящими, и у нас есть потенциал для завершения этой войны сейчас, когда итальянцы выступили с мирным соглашением, в котором мы полностью удалим их с Балкан и выполним свои требования."
 bulpeace.27.d: "Югославцы отвергли наши мирные инициативы, и сейчас мы сталкиваемся с новой югославской атакой."
 bulpeace.28.d: "Военное положение ухудшилось, большинство Болгарии оккупировано иностранными державами, и неизбежный результат капитуляции быстро приближается, чтобы предотвратить наше полное уничтожение нашими врагами, мы должны рассмотреть вопрос о том, чтобы просить о прекращении огня и мире на условиях, благоприятствующих нашим врагам, хотя это, безусловно, не является желательным результатом, это единственный реалистичный вариант, который у нас есть, если не придет чудо спасти нашу бедную родину."
 bulpeace.29.d: "Болгария пережила полный военный крах в последние месяцы и пришла к нам с призывом к миру, они предлагают нам любые претензии, которые у них могут быть, и готовы предложить огромные военные репарации. В то время как некоторые в нашем правительстве выступают за полную безоговорочную сдачу Болгарии, возможно, было бы разумно согласиться на такие условия, с тем чтобы остановить дальнейшую гибель наших людей, воспользоваться финансовыми выгодами и предотвратить потенциально дорогостоящую оккупацию Болгарии."
 bulpeace.30.d: "Сегодня для Болгарии трагический день, но наш дух не должен быть разрушен."

 #Third Catastrophe
 bulthirdloss.1.d: "Третий катастрофический поражение в третий раз за последние 40 лет было слишком большим для нашей нации, дух народа разрушен и правительство полностью разваливается, наши враги смеются над нашей судьбой, и наш народ не имеет сил даже проклинать наших врагов, многие предсказывают, что в Болгарии будет много проблем, и даже шепчут о потенциальной гражданской войне."
 bulthirdloss.2.d: "Сегодня утром по Софии прозвучали выстрелы, с малой осторожностью встреченные широкой общественностью из-за недавнего хаоса в столице, только чтобы быть заметным в связи с возросшей интенсивностью этого обстрела. Когда выстрелы замолчали и пыль осела, стало ясно, что правительство было свергнуто военными, которые объявили новое военное правительство для восстановления порядка в Болгарии."
 bulthirdloss.3.d: "Более радикальная сторона социалистического движения в Болгарии, как правило, разделена и мала в Болгарии с середины 20-х годов, особенно в связи с антисоциалистической политикой НРП после ее избрания в 1934 году, которая изменилась сегодня, когда различные социалистические движения, партии, интеллигенции и организаторы объединились в рамках Отечественного фронта с заявленной целью свержения военного правительства."
 bulthirdloss.4.d: "С созданием Фронта Отечества и дезертирством в рядах и рядах военных многие рассматривали гражданскую войну как отказ от завершения. Теперь эти лица оказались правы в ужасной манере, поскольку оперативники Фронта Отечества напали на военные и правительственные учреждения, быстро видя, как военные вытесняются из Софии и прилегающих районов из-за подавляющих оппонентов и массовых дезертиров. Фронт объявил Болгарскую Социалистическую Республику и стремится объединить Болгарию под ее правлением, в то время как то, что осталось от военного правительства, пытается реорганизовать и восстановить контроль на северо-востоке Болгарии."
 bulthirdloss.5.d: "В то время было сказано, что подъем на Фронте Отечества был преждевременным, и после продолжительных боев это оказалось правдой. &quot; Пенчо Златов &quot; объявила, что Фронт Отечества больше не существует, а остающиеся будут быстро раздавлены. &quot; Похоже, военные должны остаться &quot; ."
 bulthirdloss.6.d: ""

 #Commie Events
 bsr.1.d: "Оружие затихло, и пыль утихла, и мы одержали победу в болгарской гражданской войне. Прошло то, что считалось невозможным всего лишь несколько месяцев назад. Возникла социалистическая Болгария, готовая свернуть цепи и сражаться с подлыми реакционерами до конца земли. Фронт Отечества освободил Болгарию от репрессивного военного правительства, и теперь революция стоит триумфально в Болгарии, несмотря ни на что. После поражения в войне и недавнего времени бед, потребуются огромные усилия для восстановления нашей нации. Да будем охранять пламя социализма на Балканах своими жизнями!"

 #Yugoslav Events
 bulyugo.1.d: "До недавнего времени у Булгаров было невероятно враждебное правительство, которое заставляло многих предположить, что война с нашим юго-восточным соседом неизбежна."
 bulyugo.2.d: "За последние 40 лет Болгария и Сербия не остановились ни на секунду, желая или сражаясь за территорию Македонии. С поражением Болгарии во время Великой войны Видин был добавлен в смесь с ее аннексией Сербией. Теперь, когда обе страны пытаются стать едиными, мы должны понять, что эти регионы будут вписываться в нашу будущую администрацию."
 bulyugo.3.d: "Сербские делегаты выдвинули Белград, назвав его духовным центром Южного славдома, болгарские делегаты выдвинули Софию с ее безопасным положением в горах по сравнению с неоднократно уволенным Белградом, а также с тем фактом, что Болгария взяла на себя инициативу объединения."
 bulyugo.4.d: "Вопрос о языке, по всей видимости, является в настоящее время наиболее острой спорной проблемой. &quot; Сербы &quot; предлагают, чтобы язык правления был сербским, поскольку он широко используется. &quot; Болгарцы &quot; предлагают, чтобы языком был болгарский язык, поскольку он широко используется на юге Балкан и Болгария выступает с инициативой формирования Югославии. &quot; Двуязычие &quot; , по мнению многих, было бы наилучшим компромиссом, хотя это, по всей видимости, не понравится обеим сторонам."
 bulyugo.5.d: "В связи с тем, что в течение 1920-х годов болгарская делегация вносила значительные взносы на осуществление договоров о Великой войне, она предложила Сербии вернуть эту сумму, с тем чтобы не сформировать неравноправный союз с экономически слабой Болгарией."
 bulyugo.6.d: "Другие державы, такие, как Италия, Греция и Венгрия, имеют земли, на которых проживают южнославские народы, мы должны выбрать, как мы сосредоточимся на этих притязаниях на Югославию, поскольку многие делегации Болгарии и Сербии предложили сосредоточить внимание на своих соответствующих регионах, в то время как многие полагают, что мы должны полностью объединить Южных славян."
 bulyugo.7.d: "Благодаря соответствующим соглашениям и подписанным документам переговоры о союзе между нашими двумя странами завершились, и теперь мы должны молиться и надеяться, что сербы согласятся с нашими условиями."
 bulyugo.8.d: ""
 bulyugo.9.d: "Сербия согласилась с нашими щедрыми условиями, и теперь мы можем предпринять необходимые шаги для того, чтобы сделать наши страны одной – новой югославской нацией. Прорицатели и недальновидные сегодня оказались неверными, и дипломатия одержала победу над враждебностью между нашими двумя странами, и теперь мы обрели одну. Сегодня день славы для всех славян ."
 bulyugo.10.d: "Сербия отвергла наши щедрые условия: теперь мы должны подготовиться к тому, чтобы с помощью силы сформировать Югославию, с Болгарией, ее истинным вождем, у них был шанс, и они не воспользовались им, и теперь Югославия никогда не станет союзом равных, а будет союзом полного болгарского господства."
 bulyugo.11.d: "Один вопрос стал очевидным для большинства наблюдателей, как только был подписан союзный договор, и начались переговоры – тот факт, что Болгария является республикой, а Сербия — монархией. Этот вопрос вспыхнул над главами обеих делегаций и теперь должен быть решен. Сербы предложили конституционную монархию вдоль британской линии, позволив нам сохранить наши либеральные институты, в то время как сербский король остается в основном фигурантом, сохраняя при этом важные прерогативные полномочия. В болгарском правительстве мало кто хочет пойти на компромисс в отношении наших республиканских ценностей после борьбы с НРП и царскими ценностями, чтобы сохранить республику. Однако компромисс может быть в состоянии преодолеть разрыв – официально республиканское югославское государство, в котором сербский регион будет править сербским королем в этом регионе, хотя многие предполагают, что это слишком сильно ослабит центральную власть."

 bulgaria_demand.1.d: "Раны нашего недавнего поражения болгарских рук едва начали шрамиться, но София вернулась, чтобы выбрать останки. Не довольствуясь существующим коридором в Эгейское море, болгарское правительство выдвинуло новое требование о [731.GetName]. Их дипломаты говорят о «стратегической консолидации» и «необходимых буферах безопасности», но реальность ясна: они используют нашу нынешнюю слабость для того, чтобы отобрать еще больше нашей суверенной территории. Наши военные все еще находятся в состоянии хаоса и дух нации, опустошаемый предыдущим конфликтом, мы должны решить, можем ли мы позволить себе противостоять этому последнему вторжению, или же мы должны пережить еще одно унижение, чтобы избежать полного уничтожения."

 bulgaria_demand.2.d: "Греки, которые до сих пор отталкиваются от своего недавнего поражения, показали, что они понимают новую реальность Балкан. Сдавшись [731. GetName] без выстрела, они признали, что наше доминирование в регионе является абсолютным. Это приобретение еще больше обезопасило наши существующие эгейские владения и укрепило территории, которые мы освободили во время последней войны. Карта Балкан перерисовывается по нашему образу, и наша победа завершена: наша южная граница наконец защищена от любого будущего греческого ревизионизма."

