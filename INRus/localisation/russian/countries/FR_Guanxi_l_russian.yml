 GXC_li_qingwen: "Ли Цинвен"
 # GXC_li_qingwen_admiral_desc: "В 1935 году он стал заместителем командующего флотом в 1932 году, а затем командиром понижающейся Академии в 1935 году."

 GXC_chen_ce: "Чэнь Се"
 #GXC_chen_ce_admiral_desc: "В июне 1922 года Чен Се был в стороне от Сун Ятсена, его моряки, которые противостояли нападению Чэнь Цзюньминга, спасали Солнце и вынуждали мятежников из Гуанчжоу. Чэнь Чен Чен стал командиром Гуандонгского флота в результате этого. В Северном экспедиции он храбрым образом защищал старую крепость на острове Хумен, который охранял морской вход в Гуанчжоу против немецкого экспедиции."

