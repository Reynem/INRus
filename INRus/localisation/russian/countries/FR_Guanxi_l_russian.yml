 GXC_ma_ji: "Ма Цзи"
 # GXC_ma_ji_leader_desc: "Ма Цзи является главой клики Гуанси после смерти Лу Ронгтинга. Когда Лу Ронгтинг стал губернатором Гуанси во время Синьхайской революции, Ма был его заместителем, и двое из них были вовлечены в движение национальной защиты, которое свергнуло режим Юана Шикаи. После короткой войны с Юньнаном Лу Гуанси Клик был изгнан из провинции в результате неудавшейся северной экспедиции КМТ, он возглавлял пятнадцатую армию против КМТ. Он завоевал победу против отступающихся от Седьмой армии Гуи."Guangxi people do not fight Guangxi people\".\nSince the Northern Expedition, Ma Ji rejoined Lu Rongting after his restoration to the Guangxi provincial government. From there, he led the provincial army's modernisation plan, giving him ample influence and experience in managing the Clique's affair. He remains devoted to the province and its people, strongly promoting regionalism and Lu Rongting's pluralist legacy."
 # GXC_ma_ji_commander_desc: "Гуанси, Цин Империя, Военная Карьера: §L\nMa Ji является главой Гуанкси-Клик после сенсации Лу Ронгтинга. Поскольку младший приемный сын Лу, его взгляды и взгляды сильно повлияли на его приемный отец, он ценил сохранение имиджа Клики как плюралистической военной организации, которая была зациклена на поддержании независимости Гуанси. ~ Когда Лу Ронгтинг стал губернатором Гуанси во время Синьхайской революции, Ма был его заместителем, и двое из них были вовлечены в движение национальной защиты, а не перевербовали режим Юана Шикаи. ~ После короткой войны с Юннаном, Лус Гуанси Клик был изгнан из провинции КМТ Новой Гуанси. ~ В то время Лу отошел в Гонконг и был союз с Чэнь Цзюнгмингом, который находился в Хунане в то время, пошел на север и присоединился к силам Вайфанананан."Guangxi people do not fight Guangxi people\".\nSince the Northern Expedition, Ma Ji rejoined Lu Rongting after his restoration to the Guangxi provincial government. From there, he led the provincial army's modernisation plan, giving him ample influence and experience in managing the Clique's affair. He remains devoted to the province and its people, strongly promoting regionalism and Lu Rongting's pluralist legacy."

 GXC_chen_jitang: "Чэнь Цзитан"
 # GXC_chen_jitang_commander_desc: "Гуандун, Цинг Империя ну §Y Военная карьера: §L\nChen Jitang присоединился к движению Сунь Ят-сена в 1908 году, когда он был в армии Цинга, он был офицером во время антимонархической войны, войны за конституционную защиту и войны Гуандун-Гуанси под командованием Чэнь Цзюньминга. Во время инцидента 16 июня он был на стороне Сун Ят-сена. Он оставался в Гуандоне во время северной экспедиции, боролся с остатками армии Чэнь Цзюньминга и отчаянно пытался остановить германскую экспедицию. В качестве офицера Железной армии он нашел убежище под реорганизованным националистическим движением Чэнь Миньшу, защищая его от возмездия Цинга, как и многие офицеры Гуандонга НРА."

 GXC_jiang_guangnai: "Цзян Гуаннай"
 #GXC_jiang_guangnai_commander_desc: "После окончания Баодинга Цзян Гуаннай стал офицером Гуандунской армии в 1923 году, он сражался в северной экспедиции, после Чэнь Миньшу в битве при Ухане и обратно в Гуандун, наблюдая за крахом Национальной революционной армии. Он остается верным Чэнь Мингу, помогая ему реорганизовать остаток КМТ в Гуандуне под эгидой Продуктивной народной партии."

 GXC_lin_hu: "Лин Ху"
 # GXC_lin_hu_commander_desc: "В 1903 году, во время Синьхайской революции, он вел батальон в Наньцзин, бригаду во время войны за национальную защиту, и вторую дивизию гуандунской армии во время войны за конституционную защиту. 16 июня, после инцидента, он остался с Чэнь Цзюньмингом и сражался с НРА в Гуандуне. Однако в 1925 году он был побежден Чианг Кай-Шеком, когда армия Гуандуна была уничтожена, и он бежал из севера. Он вернулся в Гуандун с Чэнь Цзюньмингом после северной экспедиции, оставшись одним из высших командиров Гуандунской армии, хотя его победа со стороны французской армии Чианг Кай-Шека остается очевидно низкой точкой в своей военной карьере."

 GXC_lu_yuguang: "Лу Югуан"
 #GXC_lu_yuguang_commander_desc: "§L\n1894\n §Y Военная карьера: §L\nnn Enthnic Whillenguang, Lu Yuguang является старшим сыном Lu Rongting. Молодой человек был выдающимся во время Синьхайской революции, национальной и конституционной защиты. 21 год он уже был генералом и стал известным как Гильин Маршалл. Во время северной экспедиции, после того как Lu's Clique был изгнан Ли Зонгреном, он сражался с НРА в Нижнем Янцзе, возглавляя войска Гуаньси под руководством Чжана Чжунчана. Он вернулся со своим приемным отцом после войны, главным образом управляя провинцией в Лунтинге к концу 1920-х годов."

 GXC_cai_tingkai: "Кай Тингкай"
 # GXC_cai_tingkai_commander_desc: "В 1910 году он был офицером полиции, когда местный шериф Дапенгского района Шэньчжэнь представил его в Альянс Сунь Ят-сена. На следующий год он вступил в армию Гуандун во время Синьхайской революции, став командиром компании в 19 лет. Он стал учеником Чэнь Миньшу и отличился во время северной экспедиции, несмотря на его поражение, оставшись после этого в армии Гуандуна в качестве квалифицированного командира, несмотря на свой юный возраст."

 GXC_li_pinxian: "Ли Пинсян"
 # GXC_li_pinxian_commander_desc: "В 1916 году он перешёл в армию Хунань под командованием Тан Шэнджи и вернулся в Гуанси только после поражения Национальной революционной армии в северной экспедиции."

 GXC_zhang_gan: "Чжан Ган"
 # GXC_zhang_gan_commander_desc: "§L\nZhang Gan был офицером в армии Лу Ронгтинга, когда последний был свергнут новой кликой Ли Зонгрена, он служил командиром батальона в Седьмой армии Ли, так называемой Стальевой армии Национальной революционной армии во время Северного экспедиции. В ходе экспедиции НРА был побежден и Чжан вернулся в Гуанси, где он оставался в армии Гуангси после возвращения Лу Ронгтинга. Суеверен, он известен как генерал Компас (относительно Луопана, типа компаса, используемого в Фэн Шуи)."

 GXC_hong_zhaolin: "Хон Чжаолин"
 #GXC_hong_zhaolin_commander_desc: "§L\n\nNingsyang, Hunan, Qing Empream\n §Y Военная карьера: §L\nhong Zhaolin происходит из бедной семьи и был направлен в армию Гуандуна, постепенно повышаясь в ряды. Когда вспыхнула Синьхайская революция, он был вдохновлен Чэнь Цзюньмингом и провинциальным собранием и дезертировал к ним, став известным офицером. В 1914 году он боролся против сил Юана Шикаи, только чтобы быть побежден Лонг Цзигуаном и вынужден в изгнании. Он вернулся в 1916 году и помог победить Лонгу. В 1921 году Хон был повышен до командующего второй дивизией Гуандонгской армии, а в 1925 году он стал сообщником Чэнь Чондонга, который в бегстве в Шанхай и продолжал сражаться с национальной армией Ят-сен из Гуанчжоу."

 GXC_huang_qixiang: "Хуан Циксянг" #To FUJ
 #GXC_huang_qixiang_commander_desc: "В 1922 году он вернулся в Гуандун и вступил в армию Сунь Ятсена, где он отличился бы в борьбе против мятежной армии Гуандун. В 1924 году Хуанг присоединился к Куоминтангу, но Северная экспедиция потерпела неудачу и оказался под защитой Чэнь Мингу в качестве остатка Иронской армии. В 1928 году он вновь отправился в Германию, глубоко вовлечен в деятельность Промышленной народной партии. В следующем году он тайно встретился с Сонг Кингом и ее партизанскими остатками в рамках миссии по поддержанию контактов между ней и самим Чэнь Мингу, главным образом политическими, остатками."

 GXC_liu_fei: "Лю Фей"
 #GXC_liu_fei_commander_desc: "25 октября 1898 года он стал штабным офицером в 1924 году и с отличием служил во время северной экспедиции. Вернувшись в Гуанси после неудачи, он остался в армии Гуанси в 1927 году, собирался учиться в Имперской японской армии, только вернулся в Китай в 1934 году."

 GXC_ye_jianying: "Йе Цзянинь"
 #GXC_ye_jianying_commander_desc: "В 1919 году он закончил военную академию Юньнань, присоединившись к Куоминтангу в том же году. В ходе инцидента 16 июня он встал на сторону Сана, открыто сражался с силами Чена в Гуанчжоу и помогал Суну бежать из города. Он был одним из основных участников в создании временной военной академии Вампоа, преподавал там. Он участвовал в подавлении торгового корпуса Гуанчжоу и Северного экспедиции в качестве командира дивизии. После неудачи Национальной революционной армии Йе вернулся в Гуандун и присоединился к Китайской синдикистской партии."

 GXC_ye_ju: "Йу"

 GXC_chen_mingshu: "Чэнь Мингшу"
 # GXC_chen_mingshu_leader_desc: "Гуандун, родившийся в 1889 году, Чэнь Мингшу принял участие в Синьхайской революции 1911 года, в 1921 году он был командиром Первой дивизии Гуандунской армии, сражаясь на севере к тому времени, когда Чэнь Цзюнминг восстал против Сунь Ят-сен. В 1925 году Чэнь стал командиром десятой дивизии четвертой армии Национальной революционной армии, также известной как Железная Армия. В 1926 году его дивизия участвовала в неудачной Северной экспедиции, а четвертая армия была уничтожена силами немецкого вмешательства. После короткого изгнания в Гонконге Чэнь вернулся в Гуандонг, где он должен был реорганизовать остатки КМТ в провинции под ауспиком губернатора Чэнь Цзюньминга. С этими остатками он основал свою собственную партию, Продуктивную народную партию (пожалуйста, чуть больше, чем на фронт КМТ), участвуя в растущей провинциальной демократии в провинции, поддерживая союз с губернатором, несмотря на то, что последний широко рассматривается как предатель КМТнчжённым Мингом."
 #GXC_chen_mingshu_commander_desc: "Он был командиром четвертой армии Национальной революционной армии, Железной Армии, во время северной экспедиции. Тем не менее, эта армия застряла бы в круизе битвы при Вухане, поворотной точке северной экспедиции. Он доказал свою компетентность во время отъезда в Гумандун, но это было не для чего, так как НРА оказалась застрявшей между северными войсками воинов и немецкими экспедициями. После этого он организовал остатки НРА в Гуандоне под эгидой Чэнь Цзюньминга, который хотел сохранить единый республиканский фронт, защищенный от восстановления Цинга. Чэнь Мингху остается командиром подземной НРА, даже если он по-прежнему занят поддержанием политической власти Партии, обеспечивая, чтобы они оставались готовыми к тому, чтобы Чен Чен Ингминга не смог начать революцию."

 GXC_chen_jiongming: "Чэнь Цзюньминг"
 #GXC_chen_jiongming_leader_desc: "В 1909 году Чэнь Чэнь Цзюнминг был избран адвокатом и членом короткой провинциальной ассамблеи Гуандун, сформированной в 1909 году, Чэнь быстро назвал себя успешным и с энтузиазмом, хотя и радикальным реформатором, при этом его республиканские и антикоренные власти были открыты для местных властей. ~ Когда Синьхайская революция началась в 1911 году, Чэнь, будучи членом Революционного альянса, стал командующим Гуандунской армией и сыграл важную роль в оказании помощи Сун Ятсену из КМТ в создании Движения за конституционную защиту. ~ Однако два человека развили ожесточенное соперничество, которое имело весьма разные мнения о будущем Китая, которые свершились в 1922 году, когда Чен восстал против Солнца. Чэнь был вынужден сдаться и бежать после того, как корабли Сунь подвергли неизбирательному бомбардированию Гуанчжоу."betrayal\", ensuring severe tension between the two most prominent republican movements in China.\nChen Jiongming returned to Guangdong after the failure of the Northern Expedition, which he had predicted, and he was quickly asked to become governor of the province once more. Through unprecedented cuts in military spending, Chen was not only able to rebuilt the province, devastated by a decade and a half of conflict, but make it one of the most prosperous despite the German's dubious concessions in the provincial capital.\nAs governor of Guangdong, Chen has been able to put his ideals into practice. He is one of the very few genuine believers of democracy and federalism and that successfully implementing them in his \"Model Province\" will lead to the rest of China following suit, seeing the clear benefits of self-rule and genuine democracy."
 #GXC_chen_jiongming_commander_desc: "Когда Гуандун объявил о своей независимости в октябре 1911 года, Чэнь был избран главнокомандующим его силами, Сунцзюном, армией дезертированных армейских офицеров, крестьян, революционеров. Он был лидером этой революционной армии и свободной Гуандонга, вынудив генерал-губернатора бежать из Гуанчжоу, прежде чем присоединиться к Синьхайской революции. Когда Гуандун объявил о своей независимости в октябре 1911 года, он всегда был избран главнокомандующим его войсками, Сунцзюном, армией дезертированных армейских офицеров, крестьян и революционеров. Чен был бы одним из тех, кто выгнал силы Гуанхи в течение нескольких месяцев, когда Сунь разлучил с Лунгтингом. Чен неоднократно извещал своих побежденных хитриков, а затем хитрых хитрых хуанов хитрил."

 GXC_chen_qiyou: "Чэнь Цюйю"
 # GXC_chen_qiyou_leader_desc: "После изучения современной медицины в Гуанчжоу Чэнь Цыю присоединился к Тонгменгуи в 1911 году, учился в Японии, прежде чем стать секретарём Чэнь Цзонминга в 1917 году. После этого он работал на нескольких гражданских должностях: от главы графств Дуншан и Юнсяо в Фуцзяне до сотрудника таможни в Шанту. После ухода Чэнь Цзиньминга на пенсию он стал председателем КГЦ и первым демократически избранным главой государства единого Китая в качестве рыцарского (Главного исполнительной власти) Соединенных провинций Китая."

 GXC_chen_lianbo: "Чэнь Лианбо"
 #GXC_chen_lianbo_leader_desc: "Лианбо родился из богатой торговой семьи и получил образование в Гонконге. Будучи британским гражданином, он работал в качестве компрадора для ХСБК, управляя своей собственной шелковой фермой. После успешного спекуляции во время и после Шанхайского финансового кризиса 1910 года он стал одним из самых влиятельных бизнесменов на Юге. Ничжняя революция и хаотичные первые годы привели к плохой социальной и финансовой безопасности, а Организация по вопросам общественной безопасности торговцев Гуанчжоу, или Торговый корпус, была создана для того, чтобы исправить ситуацию, и Чен будет ее возглавлять. Торговый корпус будет обеспечивать стабильность в городе на протяжении республиканской эпохи, а позднее, усиливая экспроприацию и некомпетентное управление со стороны мятежников КМТ. Ничьен Ляньбо в 1924 году поднялся против КМТ в попытке их свержения, но не смог бы, и останки, обеспечивающие их вместе с федералистами Чен Цзонгминга, чтобы сохранить стабильность и автономию Гуандона."
