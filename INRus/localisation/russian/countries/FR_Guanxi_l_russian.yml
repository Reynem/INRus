 GXC_li_zongren: "Ли Зонгрен"
 #GXC_li_zongren_leader_desc: "Ли Зонгрен был одним из самых компетентных и квалифицированных военных лидеров Национальной революционной армии, он был членом Тонгменхуи в молодом возрасте, несмотря на малое понимание видения Сон Ят-сена для Китая первоначально. Он был образован Кай-Э, он быстро поднялся на ряды под кликом Гуанси и лично поднялся на высоту благодаря вторжению Юннанана в Гуанси в 1923 году. Собрав значительную силу, когда Юннан отступил, он присоединился к силам КМТ и основал Нью-Гуанкси Клик после выселения Старой Клики из провинции."Army of Steel", being one of the few NRA commanders to have defeated Wu Peifu on the field. However, the Expedition failed, and Li was forced to retreat to Guangxi, where he would be dislodged by a combined Old Guangxi-Guangdong force aligned with the Zhili Clique. The New Guangxi Clique then fled to Yunnan, protected by Tang Jiyao in order to safeguard his province's autonomy.\nAfter his defeat, Li Zongren focused on rebuilding his forces and consolidating, rapidly becoming the informal leader of the KMT's right-wing. From there, he plotted to invade Guangxi when the opportunity would present itself and re-establish a Nationalist presence in Southern China. That is, one not tainted by Wang Jingwei's French-dependent Central Committee and would truly reunite China first instead of \"playing revolutionary\" from a comfortable exile."
 # GXC_li_zongren_commander_desc: "13 августа 1891 года он был одним из самых компетентных и квалифицированных военных лидеров Национальной революционной армии. Он был членом Тонгменхуи в молодом возрасте, несмотря на малое понимание видения Сан Ят-сена для Китая первоначально. Учёный Кай-Э, он быстро поднялся на ряды под кликой Гуанкси и лично поднялся на видное место благодаря вторжению Юннанана в Гуанси в 1923 году. Собрав значительную силу, когда Иуннан отступил, он присоединился к силам КМТ и создал новую клику Гуанси после выселения Старой Клики из провинции."Army of Steel", being one of the few NRA commanders to have defeated Wu Peifu on the field. However, the Expedition failed, and Li was forced to retreat to Guangxi, where he would be dislodged by a combined Old Guangxi-Guangdong force aligned with the Zhili Clique. The New Guangxi Clique then fled to Yunnan, protected by Tang Jiyao in order to safeguard his province's autonomy.\nAfter his defeat, Li Zongren focused on rebuilding his forces and consolidating, rapidly becoming the informal leader of the KMT's right-wing. From there, he plotted to invade Guangxi when the opportunity would present itself and re-establish a Nationalist presence in Southern China. That is, one not tainted by Wang Jingwei's French-dependent Central Committee and would truly reunite China first instead of \"playing revolutionary\" from a comfortable exile."

 GXC_bai_chongxi: "Бай Чонгси"
 # GXC_bai_chongxi_leader_desc: "Мусульманин из народа хуай Бай Чонгси утверждает, что он родом из семьи персидских торговцев, поселившихся в Сычуане. Он посещал военную школу кадре Гуанси в соответствии с новаторской современной учебной программой в рамках более широких реформ в китайских вооруженных силах. Это передовой опыт хорошо служило бы ему, когда он сделал себе имя в студенческой милиции Гуанси, потом поднялся на ряды, чтобы стать одним из самых влиятельных генералов во времена войны. Верный сторонник видения Сунь Ятсена демократического Китая, он был частью триумвирата, известного как Нью-Гуангси Клик, который пытался свергнуть региональное военное правительство Лу Ронгтинга. К сожалению, крах Северной экспедиции и вмешательство Германии в Китае привели бы к поражению Нью-Гуанси из челюсти победы, сбежавшего в изгнании вместе со многими другими членами Куоминтангананан. С тех пор он работал над подготовкой нового поколения офицеров, передав ему книгу, которую он выучил в Гуангси, и горькие уроки Северной экспедиции."
 #GXC_bai_chongxi_commander_desc: "Гуанси, Цин Империя §Y Военная карьера: §L\n/n Мусульманский человек из народа хуай, Бай Чонгси утверждает, что он родом из семьи персидских торговцев, поселившихся в Сычуане. Он учился в Гуансиской военной школе кадре в соответствии с новаторской современной учебной программой в рамках более широких реформ в китайских вооруженных силах. Это передовой опыт хорошо служило бы ему, когда он сделал имя для себя в студенческом ополчении Гуанси, позднее поднявшись в ряды одного из самых влиятельных генералов во время войны, который стал бы одним из самых влиятельных генералов в истории войны. Верный сторонник сун Ят-сенского позора для демократического Китая, он был частью триумвирата, известного как Нью-Гуанси Клик, который пытался свергнуть районное правительство Лунгтинга. К сожалению, крах северного экспедиции и немецкого вмешательства в Китае привел бы его к победе в Нью-Гуансике, он был частью нового поколения победа, и тогда он учился вместе с другими гуманскими офицерами, он работал в гуанских и с другими гуанских работавших в с другими гуанских работавших в гуанских работах."

