 ### Focuses ###

 ### Ideas ###
 BLR_western_polish_autonomy: "Западная польская автономия"
 BLR_western_polish_autonomy_desc: "В то время как западные регионы нашей нации слишком доминируют для того, чтобы быть разумным для суверенного правительства, чтобы реализовать автономию для небольшого меньшинства, это цена, которую мы должны заплатить за то, что Польша спасает нас от красных. Во время короткой польско-советской войны поляки продвигались с нами в советские земли, и когда Ленин безумно подписал мир с Западом, мы были оставлены перед поляками, многие из которых были оглянуты на Креси. Вместо этого они поселились с нами, став крупным буферным государством против Востока, и с этим появились определенные оговорки. Польша должна была быть в состоянии разместить войска на нашей земле, и автономные регионы были бы созданы на Западе с уровнем связи с Варшавой. Для достижения подлинной суверенности мы должны стремиться ликвидировать эти автономии, но это может нанести гнев поляков."
 #
 BLR_white_russian_emigres: "Белые российские эмигры"
 BLR_white_russian_emigres_desc: "После окончания Гражданской войны в России, в результате краха южных армий Вранжеля, многие бежали в Беларусь, хотя это было выгодно с точки зрения квалифицированной и образованной части населения, которая укрепила наше государство и армию, их преданность Беларуси является более чем сомнительной. Многие из русских империй, правящих и военных каст, сформировали элитную секцию, параллельную белорусской элите и интеллигенции. Их влияние среди населения и военных может оказаться угрозой белорусской нации. Мы должны держать этот раздел под контролем, если мы не хотим, чтобы они превращались в врагов внутри Беларуси."
 #
 BLR_weak_national_identity: "Слабая белорусская национальная самобытность"
 BLR_weak_national_identity_desc: "Несмотря на то, что мы являемся нацией для белорусского народа, большинство людей в нашей стране сомневаются в законности такой самобытности, причем большинство из них либо равнодушно, либо враждебно относятся к такой идее, в то время как наши элиты и интеллектуалы пытаются изменить культуру, которая находится вниз по течению от них, это - тяжелая битва, что еще более затрудняется присутствием белых русских, которые сформировали контрэлит, представляющий русскоязычные слои нашего населения, мы должны стремиться изменить это положение, если хотим оставаться суверенными."

 #Events
 belarus_poland.1.d: "Ситуация на нашей восточной границе сильно изменилась. Белорусская Республика борется за сдерживание продвижения Красной Армии, и, как представляется, это лишь вопрос времени, прежде чем они будут перегружены советской военной машиной. Несмотря на то, что это создает для нас серьезную дилемму. Западные территории Беларуси, где проживает значительное польское население, находятся непосредственно на пути советского движения. Если Минск падёт, эти земли и их народ, несомненно, будут поглощены Советским Союзом, судьба, которую мы не можем принять. ~Нет, у нас есть маленькая возможность. Мы могли бы вмешаться, обеспечив безопасность этих "автономных" районов под нашей собственной защитой, прежде чем Москва сможет захватить их. Для этого было бы ударить соседа по спине, но ничего не сделать, чтобы погубить наших родственников тирании большевиков."
 belarus_poland.2.d: "Вероломство! Пока наши храбрые солдаты отдают свои жизни, чтобы удержать безбожные большевиковые орды, предположительно нейтральная Польша ударила нас ножом в спину! Несмотря на то, что польские войска пересекли нашу западную границу, ссылаясь на «нужную защиту польских меньшинств» в качестве неубедительного предлога для голого захвата земли. Они оккупировали наши земли и объявили их частью Польши, пока наш взгляд был установлен на восток."

