 BEA_fullers_playground: "Игровое поле Фуллера"
 BEA_fullers_playground_desc: "Многие из причин, по которым Фуллер в настоящее время находится на полпути по всему миру, управляющему Ист-Индией, были вызваны враждебностью по отношению к его идеям дома и боялись, что они станут все более влиятельными. Фуллер стал недовольствовать низким уровнем восприимчивости к его идеям о правительстве, и большая часть военных устала от его новых идей. Теперь, будучи губернатором Ист-Индии, Фуллер имеет игровую площадку на острове, чтобы проверить свои идеи бронебойной войны, хотя и без идеальной местности для дорожных маневров."

 #Decisions
 BEA_claim_jap_ins: "Японская Ист-Индия"

 #### Events ####
 bei.0.t: "Голландская Ист-Индская"
 bei.0.d: "До переворота в Нидерландах, когда королевская семья бежала в Суринам и Бернхард взялась за контроль, Ист-Индия находилась под правлением голландского и генерал-губернатора Бонифасиуса Корнелиса де Йонге. После переворота британцы взяли под свой контроль эти острова, якобы для того, чтобы защитить торговлю через Малаккский пролив, но в действительности для того, чтобы не допустить того, чтобы острова стали либо независимыми, либо под контролем или влиянием других государств."
 bei.0.a: "Да здравствует король и Ист-Индская!"

 bei.1.t: "Деятельность по обеспечению независимости"
 bei.1.d: "Поступили новые сообщения о беспорядках активистов движения за независимость в колонии, а также о незначительных столкновениях между инсулиндскими националистами и военными."
 bei.1.a: "Проклятье этих националистов!"

 bei.2.t: "Индейское восстание победило!"
 bei.2.d: "Повстанцы, похоже, одержали победу над британскими войсками."
 bei.2.a: "Это будет вдохновлять иссулиндов"

 bei.3.t: "Индейское восстание раздавлено!"
 bei.3.d: "Повстанцы, похоже, были раздавлены британскими войсками."
 bei.3.a: "Возможно, наши собственные националисты пересмотрят вопрос о восстании."

 bei.4.t: "Лондонский Крэш нападает на Ист-Индию"
 bei.4.d: "С тех пор, как Лондонский фондовый рынок обрушился на сердце Британской империи, он распространился на остальной части империи и по всему миру. Экономический кризис поразил Ист-Индию. Он сильнее всего пострадал в городах, хотя некоторые коренные общины на суше могут быть относительно не затронуты им. С этим кризисом, скорее всего, последует нестабильность и демонстрации."
 bei.4.a: "Всё выглядит нехорошо."

 bei.5.t: "Ревность националистов"
 bei.5.d: "Инсулиндские националисты, подстерегаемые нестабильностью и экономическим кризисом, продолжают бунтовать против британского правления над своей страной, требуют прекращения британского правления в Ист-Индии и создания независимого инсулиндского государства."
 bei.5.a: "Проклятые националисты!"

 bei.6.t: "Ревнующие социалисты"
 bei.6.d: "Инсулиндские социалисты, подпитываемые нестабильностью и экономическим кризисом, начали бунты против нашего правления над Ист-Индией, как и многие националисты, требуют независимости и отмены британского правления, открыто враждебно относятся к тем, кого они считают «капиталистическими торговцами и промышленниками, эксплуатирующими коренное население»."
 bei.6.a: "Чертовы социалисты!"

 bei.7.t: "Голландская критика Британской империи"
 bei.7.d: "Голландцы в нашей колонии, даже те из них, кто связан с нашим управлением, начали открыто критиковать Империю на многих общественных платформах. Они утверждают, что Британская империя умирает, их доказательства? Успешный мятеж в Индии и экономический кризис, который сейчас серьезно затронул нашу страну. В результате усилилась напряженность между голландцами и британскими колонистами в Ист-Индии."
 bei.7.a: "Они сильно ошибаются."

 bei.8.t: "Голландская критика Британской империи"
 bei.8.d: "Голландцы в нашей колонии - даже те, кто связан с нашим управлением, - начали открыто критиковать Империю на многих общественных платформах. Они утверждают, что Британская империя нуждается в реформах, или экономический кризис и восстание будут продолжаться по всей империи. Эти британские колонисты, выступающие против реформы, были возмущены этой риторикой, и напряженность между ними и бывшими голландскими правителями остается высокой."
 bei.8.a: "Они верят, что знают, как сделать Империю лучше."

 bei.9.t: "Голландские колонисты требуют большего влияния"
 bei.9.d: "Те, кто рассматривается как лидеры голландского населения в Ист-Индии, требуют, чтобы колониальная администрация уступила дополнительное влияние их контролю, чтобы «помочь» управлению Ист-Индией. Они утверждают, что, если бы колониальная администрация сделала это, это обеспечило бы лояльность голландского народа в Ист-Индии."
 bei.9.a: "Это только ослабит наш контроль, я так не думаю."
 bei.9.b: "Только вместе мы можем надеяться противостоять грядущему шторму."

 bei.10.t: "Майор Националистический Ритт!"
 bei.10.d: "Инсулиндские националисты начали серьезные беспорядки в стране. Десятки тысяч людей маршируют по улицам Батавии, грабят магазины, принадлежащие Европе, и стыкуются с полицией. Стычки, как утверждается, носили насильственный характер, когда полиция была отброшена назад. &quot; Колониальная администрация &quot; начала открыто рассматривать вопрос о военном вмешательстве, с тем чтобы положить конец беспорядкам и защитить европейцев от нападений. &quot; Это, возможно, является необходимым актом &quot; ."
 bei.10.a: "Пошлите военных."

 bei.11.t: "Голландцы отказываются принимать приказы!"
 bei.11.d: "Многие голландские солдаты и несовершеннолетние офицеры отказываются выполнять приказы, которые они отдали, чтобы помочь полиции и военным справиться с беспорядками."
 bei.11.a: "Нам не нужна их помощь, чтобы убрать туземное восстание."

 bei.12.t: "Рейтеры раздавлены."
 bei.12.d: "В то время как британцы сделали столько же, сколько голландцы, именно последние получили высокую оценку за помощь в подавлении беспорядков."
 bei.12.a: "Вот что случается, когда ты делаешь недостаточно."

 bei.32.t: "Украсть голландские активы?"
 bei.32.d: "Голландское население не всегда было полностью лояльным к нашему правлению. хотя это может вызвать некоторые протесты со стороны голландской общины, надеюсь, мы сможем быть готовыми к такой ситуации."
 bei.32.a: "Схватить их!"
 bei.32.b: "Это плохая идея, избавиться от того, кто придумал это."

 bei.13.t: "Инсулинды провозглашают независимость!"
 bei.13.d: "Сегодня утром в Суматре и Яве вспыхнули ожесточенные бои, во многих поселениях и городах местные гарнизоны были поражены большим числом активистов, боровшихся за независимость, и в этих районах было захвачено оружие. Из джунглей вышли люди, вооруженные винтовками, пулеметами и подсобными предметами, чтобы встретить силы Ист-Индии, что-то гораздо большее, чем бунт, это восстание, лидер восстания - человек по имени Сукарно, с его базой на Суматре, он готов вести инсулиндскую войну за независимость!"
 bei.13.a: "Да здравствует инсулиндия!"
 bei.13.b: "Смерть предателям!"

 bei.14.t: "Стабильность, наконец, возвращается в Британскую Ист-Индию"
 bei.14.d: "Почти два года прошли с нестабильностью и беспорядками, но сейчас кажется, что наступает лучшее время. Похоже, что волнения происходят все реже и реже, и растет стабильность. Многие считают, что долговременные последствия экономического кризиса уже прошли. Справедливо сказать, что Британская Ист-Индия выжила. Наш авторитет в Ист-Индии, как представляется, на протяжении каждого месяца становится сильнее."
 bei.14.a: "Да здравствует король и Империя!"

 bei.15.t: "Нидерландские оппозиционные объединения"
 bei.15.d: "Голландцы в нашей колонии в прошлом были в основном неорганизованы, но недавно они слились в небольшую группу, чтобы противостоять нашему правлению в колонии, в которую входят как голландцы, лояльные короне Нидерландов, так и голландцы, лояльные нынешнему режиму в Нидерландах."
 bei.15.a: "Еще проблемы."

 bei.16.t: "Марш по Батавии"
 bei.16.d: "Голландские лидеры в Ист-Индии объединили своих сторонников, в том числе голландцев, туземцев-инсулиндов и «неверных» британских колонистов, чтобы противостоять нашему «авторитарному» правлению."
 bei.16.a: "Что впереди?"

 bei.17.t: "Голландская Секьюрити!"
 bei.17.d: "Голландцы из Ист-Индии смогли победить британцев, которые управляли колонией в последние годы, когда британский колониальный флаг был снят, голландский колониальный флаг сейчас машет в воздухе над Батавией, пока еще не ясно, сможет ли голландцы сохранить контроль или же они снова потеряют его Британской империи."
 bei.17.a: "Да здравствует Голландская Корона!"

 bei.18.t: "Ист-Индии хочет стать Доминионом Нидерландов."
 bei.18.d: "Голландское население в Ист-Индии захватило власть над островами, и теперь они требуют восстановления контроля над колонией, чтобы она была восстановлена в соответствии с голландским правлением. Если мы примем это решение, то Британская империя может объявить нам войну, но если мы откажемся, то это может быть воспринято как слабое и иметь законный эффект для режима, который в настоящее время оккупирует материковую часть Нидерландов."
 bei.18.a: "Прими это, у нас нет выбора."
 bei.18.b: "Гнев Лондона принесёт только молоток."

 bei.19.t: "Голландские восточно-индийские револьцы"
 bei.19.d: "Голландское население взяло под свой контроль Ист-Индию, свергнув британское колониальное правительство и установив свое собственное правление в колонии."
 bei.19.a: "Мы заберем их вниз!"
 bei.19.b: "Пусть они получат свою независимость"

 bei.20.t: "Ист-Индия снова под голландским контролем!"
 bei.20.d: "Ист-Индия снова находится под голландским контролем, когда Британская империя покинет эти земли, мы наконец-то повысим цвет нидерландской короны в мире, да здравствует Голландская Ист-Индия и Да здравствует королева!"
 bei.20.a: "Да здравствует Голландская Ист-Индия!"

 bei.21.t: "Британская империя объявила войну."
 bei.21.d: "Старая Британская Империя приняла решение сражаться с нами, надеясь вновь забрать то, что они украли у нидерландской колониальной империи, у нас нет больших шансов на победу, а поражение - это возможность, но с короной на нашей стороне, у нас может быть шанс на победу."
 bei.21.a: "Мы будем бороться за свободу!"

 bei.22.t: "Британцы атаковали Ист-Индию."
 bei.22.d: "Похоже, что Британская Империя напала на Ист-Индию как на реакцию колонии, которая решила присоединиться к нашей нации, мы можем присоединиться к нашим голландским братьям в их борьбе, но это, скорее всего, вызовет гнев Великобритании."
 bei.22.a: "Извини, Ист-Индская, ты сама по себе."
 bei.22.b: "Мы будем стоять с лоялистами Короны"

 bei.23.t: "Королевство Нидерландов отказывается поддержать нас."
 bei.23.d: "Удивительно, что голландская корона решила не втягивать себя в нашу войну, и это не только оставит нас в стороне от войны, но и укрепит популярность голландского народа, верного режиму, который в настоящее время оккупирует материк Нидерландов."
 bei.23.a: "Возможно, Бернхард поддержит нас."

 bei.24.t: "Кубок Про-Бернхарда"
 bei.24.d: "Голландцы, лояльные режиму принца Бернхарда в Нидерландах, недавно переворотили правительство."
 bei.24.a: "Да здравствует истинный голландец!"

 bei.25.t: "Ист-Индии хочет покорить нас."
 bei.25.d: "Нестабильность в Ист-Индии оставила голландцев верными нашему правительству, они обратились к нам с желанием стать субъектом нашего правительства."
 bei.25.a: "Мы принимаем это от наших коллег-голландцев."
 bei.25.b: "Война с Британией делает это неприемлемым."

 bei.26.t: "Голландское государство приняло нас."
 bei.26.d: "Голландское государство приняло нас в качестве подданных и готово защитить Ист-Индию от Британской империи, проявив солидарность со своими голландскими братьями."
 bei.26.a: "Да здравствует голландский народ!"

 bei.27.t: "Мы стоим в одиночестве"
 bei.27.d: "Предательское голландское государство отклонило нашу просьбу стать субъектом их правления, оставив нас умирать от рук Британской империи."
 bei.27.a: "Мы сражаемся до конца!"

 bei.28.t: "Ист-Индия снова под британским контролем"
 bei.28.d: "Голландский мятеж в Ист-Индии взят под контроль, земли находятся под контролем наших военных, из этого, надеюсь, будет построена новая и лучшая колония."
 bei.28.a: "Возможно, эти мятежники извлекли урок."

 bei.29.t: "Королевство Нидерландов сражается с нами"
 bei.29.d: "Правительство нашей королевы приняло решение сражаться с нами в этой войне, вместе мы возглавим британских захватчиков и восстановим голландцев в Ист-Индии."
 bei.29.a: "Да здравствует Царство!"

 bei.30.t: "Голландские восточно-индийские револьцы"
 bei.30.d: "Голландское население взяло под свой контроль Ист-Индию, фактически украло одну из колоний короны, нам нужно либо уничтожить их, либо, наоборот, проявить милосердие и предоставить им независимость."
 bei.30.a: "Мы заберем их вниз!"
 bei.30.b: "Дайте им независимость"

 bei.31.t: "Британская империя объявила войну"
 bei.31.d: "Без поддержки со стороны Королевства Нидерландов мы сталкиваемся с Британской империей, и вряд ли мы сможем бороться с этим в одиночку."
 bei.31.a: "Это нехорошо."

 bei.100.t: "Европейские генералы присоединяются к нашим силам"
 bei.100.d: "Новые европейские генералы прибыли в Ист-Индию, чтобы помочь в руководстве нашей армией."
 bei.100.a: "Добро пожаловать в Ист-Индию"

 bei.101.t: "Местные генералы присоединяются к нашим силам"
 bei.101.d: "Местные генералы добровольно оказывают помощь в руководстве армией Ист-Индии."
 bei.101.a: "За силу европейцев и коренных народов"

 bei.300.d: ""
 bei.303.d: "Во многом Фуллер был на полпути по всему миру, управляя Ист-Индией, из-за враждебности к его идеям дома и боязни того, что они станут все более влиятельными. Фуллер стал недовольствовать низким уровнем восприимчивости к его идеям о правительстве, и большая часть военных устала от его новых идей. Как губернатор Ист-Индии, Фуллер имел игровую площадку на острове, чтобы проверить свои идеи о бронебойной войне, хотя и без идеальной местности для дорожных маневров. Падение Ист-Индии теперь видит возвращение Фуллера домой, готового служить в наших вооруженных силах. Он не только привносит свои навыки в руководство, но и свои идеи, не тратя времени на попытки побудить наше руководство принять меры по их принятию. Многие отвергают эти идеи как брони неудачного губернатора, в то время как другие считают, что бои многих его войск в Индии являются признаком ценности этих идей. В любом случае Фуллер здесь, чтобы остаться."

