 BEA_disputes_between_british_and_dutch_idea: "Англо-гутчские колониальные споры"
 BEA_disputes_between_british_and_dutch_idea_desc: "Поскольку Британская империя взяла под свой контроль бывшую Голландскую Ист-Индию, есть большая озабоченность по поводу того, как следует управлять Ист-Индией и кем. Пока эта ситуация остается относительно мирной, но что принесет будущее, никто точно не знает."
 BEA_colonial_nation_idea: "Корейская Народно-Демократическая Республика"
 BEA_colonial_nation_idea_desc: "Ист-Индия является колониальной нацией, находящейся сейчас под контролем Британской империи."
