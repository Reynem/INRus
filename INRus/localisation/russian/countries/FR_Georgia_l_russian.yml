 ####IDEAS
 GEO_junker_school: "Школа Junker"
 GEO_junker_school_desc: "Грузинская школа Дзюнкера — это военная академия, основанная в 1919 году под руководством генерала Джорджа Квинитадзе, которая преподавала много офицеров, которые в настоящее время служат в нашей армии и доказали свою эффективность."
 GEO_menshevik_schism: "Цикл партии Меншевик"
 GEO_menshevik_schism_desc: "Несмотря на то, что партия Меншевик властвовала в нашей стране с момента провозглашения независимости и продолжает править сейчас, в последние годы она все больше разделяется между теми, кто смотрит на либертарианский социализм Советского Союза и хочет присоединиться к ним, и теми, кто желает, чтобы Грузия оставалась независимой, что сказывается на способности партии править."
 GEO_separatism: "Разделение"
 GEO_separatism_desc: "В последнее время в провинциях нашей страны наблюдается активизация сепаратистской деятельности, и если мы не решим эту проблему быстро, мы столкнемся с нестабильностью и восстаниями."
 GEO_good_trade_relations: "Хорошие торговые отношения"
 GEO_good_trade_relations_desc: "Мы укрепили наши отношения с зарубежными странами, с тем чтобы облегчить торговлю."
 GEO_lemons_tea_wheat_idea: "Лемонс и чай для торговли пшеницей"
 GEO_lemons_tea_wheat_idea_desc: "Наши земли не подходят для производства пшеницы и других жизненно важных продуктов питания, но они великолепны для производства готовых к экспорту продуктов питания."
 GEO_tourism: "Туризм"
 GEO_tourism_desc: "Мы переоформили нашу страну как мирную туристку, и каждый год все больше и больше иностранцев посещают страну, и из-за этого мы получаем много иностранной валюты."
 GEO_voluntary_farm_collectivisation: "Добровольное объединение"
 GEO_voluntary_farm_collectivisation_desc: "Те, кто желает, могут собраться на своих фермах, чтобы повысить эффективность и получить от нас помощь, но мы не будем навязывать это никому."
 GEO_forced_farm_collectivisation: "Принудительная коллективизация"
 GEO_forced_farm_collectivisation_desc: "Некоторые реакционные фермеры достаточно долго использовали свой бретерен, и мы заставим их собраться на своих фермах, чтобы все были равны, нравится им это или нет!"
 GEO_wheat_farming: "Ферма пшеницы"
 GEO_wheat_farming_desc: "Поощряя выращивание пшеницы, мы можем быть более самодостаточными и посвятить столицу другим вещам."
 GEO_expanded_junker_school: "Расширенная школа для джункеров"
 GEO_expanded_junker_school_desc: "Грузинская школа Дзюнкера является военной академией, которая была основана в 1919 году и впервые во главе с генералом Джорджем Квинитадзе."
