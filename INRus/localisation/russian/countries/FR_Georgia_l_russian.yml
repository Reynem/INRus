 ####NATIONAL FOCUS
    ### NON STALIN
 GEO_1936_elections: "Выборы!"
 GEO_1936_elections_desc: "Грузия, которая была стабильной страной на протяжении всех последних лет своей независимости, проведет свои первые выборы, в ходе которых не будет гарантирована победа в рамках ДПСБ, хотя два крыла ДПСС остаются двумя крупнейшими партиями, которые они не могут править в одиночку, что означает, что им придется пойти на определенный компромисс с другой стороной, который может подорвать их."
 GEO_radical_victory: "Радикальная победа"
 GEO_radical_victory_desc: "Люди устали ждать, когда социализм в конце концов произойдёт, они дали радикальному крылу возможность проголосовать за плюрализм, чтобы они могли ускорить появление социализма в стране."
 GEO_become_SSR: "Вступление в Советский Союз"
 GEO_become_SSR_desc: "Заставить страну, которая привыкла к свободе и демократии, стоять на коленях перед авторитарными иностранными властелинами - это трудно. Для этого коммунисты должны делать это постепенно, тщательно отменяя оппозиционные партии и избирательно угнетая неверных граждан. Только после того, как страна будет прочно подчинена советскому правлению, общество может быть преобразовано в советскую систему."
 GEO_collie_takeover: "Коллекционисты берут на себя ответственность"
 GEO_collie_takeover_desc: "В ответ на их проступки коллективисты полностью захватили Коммунистичную партию."
 GEO_find_new_partners: "Найти партнеров для руководства"
 GEO_find_new_partners_desc: "Без поддержки национальных коллективистов ограниченная поддержка Коммунистической партии среди населения сократилась еще больше. Если коллективисты хотят править, им придется искать новых партнеров для управления, включая этнические меньшинства и раскаявшихся бывших профсоюзных лидеров."
 GEO_realpolitik: "Реальная политика выживания"
 GEO_realpolitik_desc: "Иногда нужно дать дюйм, чтобы набрать милю."
 GEO_sudden_betrayal: "Внезапное предательство"
 GEO_sudden_betrayal_desc: "Несмотря на то, что это ожидалось, коллективисты были удивлены тем, как быстро национальные коллективисты предали свое совместное правление и теперь переходят к захвату власти на всех уровнях."
 GEO_vang_takeover: "Национальные коллективисты поглощают власть"
 GEO_vang_takeover_desc: "Быстрым шагом народные коллективисты захватили власть на собрании Коммунистической партии, и потребуется время, чтобы укрепить свое правление, но это крайнее изменение, которое дестабилизирует и без того нестабильный и непопулярный режим."
 GEO_crush_unloyalty: "Разрушить непокорность"
 GEO_crush_unloyalty_desc: "Мы непопулярная фракция, и если мы не справимся быстро с оппозицией, они могут так или иначе свергнуть нас. Если мы не докажем, что можем поддерживать стабильность в стране, Советский Союз может вмешаться против нас!"
 GEO_vang_constitution: "Конституция национальных коллективистов"
 GEO_vang_constitution_desc: "Для того чтобы облегчить те многочисленные перемены, которые мы вносим в страну, нам необходимо разработать новую конституцию, которая, по крайней мере, даст нам возможность обрести легитимность."
 GEO_their_worst_nightmare: "Их худший кошмар"
 GEO_their_worst_nightmare_desc: "Когда Меншевики объявили независимость от Русской Империи, они никогда не думали, что к этому штату придет Джорджия, это живой кошмар для всех, кто разделяет свои ценности "буржуазной свободы", "буржуазной демократии" и "буржуазного" равенства."
 GEO_still_alive: "Все еще живы"
 GEO_still_alive_desc: "Мы успешно преодолели штормы, которые пришли с установлением нашего режима, и перейдем к более твердому становлению себя единственными лидерами Грузии."
 GEO_crush_revolts: "Уничтожить ревации"
 GEO_crush_revolts_desc: "Многие сельские районы по-прежнему не умиротворены, и они управляются различными националистическими движениями и крестьянскими советами."
 GEO_handle_instability: "Преодоление неустойчивости"
 GEO_handle_instability_desc: "Похоже, каждую неделю появляется новый заговор, который мы должны искоренить все повстанческие движения и найти тех, кто несет ответственность за эти революционные тенденции населения."
 GEO_another_SSR: "Регулярная ССР"
 GEO_another_SSR_desc: "Наконец-то мы установили наш режим, и теперь мы можем идеально вписаться в Советский Союз с остальными SR."
 GEO_delay_inevitable: "Задержка неубедимого"
 GEO_delay_inevitable_desc: "В конце концов, капитализм упадет, и социализм заменит его. Мы не можем опередить себя и рискнуть проиграть реформы, которые мы уже получили, поэтому мы отложим преобразование общества в менее опасное время."
 GEO_reunite_skhivi: "Слияние с фракцией Схиви"
 GEO_reunite_skhivi_desc: "Партия Схиви из СДПС разорвалась много лет назад, потому что она хотела более демократичную партию. Теперь, когда мы являемся основной фракцией, мы можем пригласить их обратно в партию и принять их требования."
 GEO_democratized_party: "Демократизация партии"
 GEO_democratized_party_desc: "Для того чтобы добиться более широкой общественной поддержки, мы должны привлечь общественность к более активному участию в делах партии, и мы сделаем это путем укрепления демократии в партии, что позволит повысить уровень подотчетности перед общественностью."
 GEO_workplace_social: "Закон о социальной интеграции на рабочем месте"
 GEO_workplace_social_desc: "Первым радикальным законом, который мы должны принять, является закон о социальной интеграции на рабочем месте, который позволяет простым большинством голосов трудящихся на рабочем месте отлучать его от владельца фабрики и лишь частично возмещать ему расходы."
 GEO_reform_society: "Общество реформ"
 GEO_reform_society_desc: "Закон о социализации на рабочем месте является лишь первым шагом."
 GEO_convince_trade_unions: "Убедить профессиональные союзы"
 GEO_convince_trade_unions_desc: "В то время как некоторые профсоюзы поддерживают нас, большинство из них по-прежнему поддерживают умеренную фракцию ПСРС, поскольку она более укоренилась."
 GEO_dashnak_alliance: "Коалиция с партией Дашнак"
 GEO_dashnak_alliance_desc: "Поскольку социалистические партнеры голодают, мы должны пригласить в коалицию партию Дашнакцутьун, как и армянские националисты, они также являются социалистами, как и мы."
 GEO_local_power: "Делегирование полномочий местным органам власти"
 GEO_local_power_desc: "Мы должны децентрализовать государство, с тем чтобы оно могло чувствовать себя свободным, не отступая от нас."
 GEO_demsoc_role_model: "Модель демократической социалистической роли"
 GEO_demsoc_role_model_desc: "Теперь, когда наше общество преобразуется в демократический социализм, мы действительно можем увидеть, какой прогресс мы добились и насколько регрессивным является остальной мир. Мы должны пригласить лидеров лейбористов и Социалистического интернационала увидеть нашу страну."
 GEO_moderate_victory: "Умеренная победа"
 GEO_moderate_victory_desc: "Люди показали, что они предпочитают стабильность радикальной демагогии, и мы постараемся не разочаровать их."
 GEO_moderate_reform: "Умеренная реформа"
 GEO_moderate_reform_desc: "Радикальная фракция не настолько радикальна, настоящие радикалы - это внешние партии, мы ведем переговоры с радикальной фракцией, чтобы достичь счастливой промежуточной точки, которая сохранит стабильность."
 GEO_mend_schism: "Преодоление хитрости"
 GEO_mend_schism_desc: "Мы не можем оставаться разделенными, мы воссоединим нашу партию с согласованными принципами и попытаемся ограничить разногласия внутри партии."
 GEO_keeping_what_worked: "Сохранение того, что сработало"
 GEO_keeping_what_worked_desc: "Мы были стабильной страной на протяжении 18 лет, и ничто не мешает нам сохранять стабильность, продолжая свою политику."
 GEO_focus_on_ourselves: "Сосредоточься на себе"
 GEO_focus_on_ourselves_desc: "Больше всего мы возвращаемся к политике нейтралитета, которую мы проводили, когда была основана эта республика, и сохраняем ее так долго, как только сможем."
 GEO_local_menshevik_leadership: "Местные руководители &lt; &lt; Меншевик &gt; &gt;"
 GEO_local_menshevik_leadership_desc: "Причина острого сепаратизма, широко распространенного в нашей стране, заключается в том, что партия Меншевик отделилась от местных общин и их интересов."
 GEO_stable_once_more: "Стабильность еще раз"
 GEO_stable_once_more_desc: "Мы наконец-то решили этот кризис, и теперь мы можем вернуться к мирной и процветающей жизни... или, как мы надеемся."
 GEO_wide_coalition: "&lt; &lt; Широкая коалиция &gt; &gt;"
 GEO_wide_coalition_desc: "Мы больше не можем поддерживать правительство, основанное только на нашей воле, поэтому мы создадим коалицию с Национальной демократической партией и Социалистическо-федералистской партией."
 GEO_painful_compromises: "Сделай больную компромисс"
 GEO_painful_compromises_desc: "К сожалению, эта новая ситуация, в которой мы оказались, заставляет нас идти на компромисс с другими сторонами по ключевым политическим вопросам, и мы не можем избежать этого, если хотим сохранить эту коалицию."
 GEO_free_market: "Свободный рынок"
 GEO_free_market_desc: "Наш рынок имеет много правил и несколько коллективизирован с профсоюзами, представляющими значительную часть трудящихся. Наша коалиция поставила перед собой задачу освободить рынок, чтобы, как мы надеемся, стимулировать нашу экономику. В то время как партия Меншевик выступает против этого в принципе, умеренная фракция может терпеть его, пока права трудящихся сохраняются."
 GEO_talk_with_church: "Поговори с Церковью"
 GEO_talk_with_church_desc: "Чтобы получить больше свободы в отношениях с Национальной демократической партией, нам нужно поговорить с грузинской православной церковью и достичь с ними согласия по ключевым вопросам."
 GEO_monarchy_referendum: "Референдум монархии"
 GEO_monarchy_referendum_desc: "Одна из фракций в церкви потребовала от нас провести референдум по вопросу о восстановлении монархии, хотя они и не были большинством в церкви, проводившей этот референдум, могли бы увеличить власть Меншевика в коалиции, если бы народ отверг монархию, однако многие люди уже присоединились к кампании по восстановлению монархии и у нее есть шанс на успех."
 GEO_keep_social_reforms: "Сохранять социальные реформы"
 GEO_keep_social_reforms_desc: "Эта коалиция может быть сохранена только в том случае, если социалисты-федералисты и национальные демократы согласятся пойти на компромисс по вопросу о том, что Меншевики ближе всего к сердцу: социальные реформы и права трудящихся."
 GEO_historic_compromise: "Историческая компромисса"
 GEO_historic_compromise_desc: "На протяжении многих лет партия Меншевик практически управлялась в одиночку, а другие партии не соглашались с ней почти по всем вопросам."
 GEO_moderate_alliance: "Умеренный альянс"
 GEO_moderate_alliance_desc: "Главное, что у нас общего, это наше противодействие радикалам, которые становятся все более и более распространенными в наши дни, и мы должны бороться с экстремизмом, где бы он ни существовал, внутри и без него."
 GEO_wide_consensus: "Широкий консенсус"
 GEO_wide_consensus_desc: "Сейчас, когда мы приняли решение в отношении наших руководящих принципов, подавляющее большинство общественности признает нас в качестве стабилизирующей силы и соглашается с нашей политикой."
 GEO_socially_united: "Организация &lt; &lt; Социальная совместная деятельность &gt; &gt;"
 GEO_socially_united_desc: "В последние несколько месяцев политика, казалось, уже не имела большого значения, поскольку большинство людей поддерживают умеренный Альянс, они больше не рассматривают себя в качестве политических соперников, вместо этого концентрируясь на том, что объединяет грузин как нацию."
 GEO_dead_coalition: "Коалиция мертва!"
 GEO_dead_coalition_desc: "Нам не удалось преодолеть наши разногласия, и наша коалиция вновь является нестабильной."
 GEO_snap_elections: "Выборы в &lt; &lt; Снэп &gt; &gt;"
 GEO_snap_elections_desc: "Поскольку на обоих крыльях партии Меншевик обрушились нынешние события, либо Социалистическо-федералистская партия, либо Национальная демократическая партия добьются плюрализма на выборах, и партия, которая сделает это, станет первой, не связанной с Меншевиком партией, которая достигла плюрализма со времени обретения независимости."
 GEO_socfed_plurality: "социалистическо-федералистское многообразие"
 GEO_socfed_plurality_desc: "Люди говорили, и они выбрали социалистов-федералистов, чтобы возглавить Грузию."
 GEO_federal_system: "Федеральная система"
 GEO_federal_system_desc: "Правильным способом решения проблемы сепаратизма является предоставление абхазцам и осетинам равных прав, не только равных прав граждан, но и национальных прав."
 GEO_social_market: "Социальный рынок"
 GEO_social_market_desc: "Нет смысла отбрасывать весь прогресс, достигнутый нами в области социальных прав, только потому, что старая экономическая система работала не очень хорошо."
 GEO_fair_georgia: "Справедливая Грузия"
 GEO_fair_georgia_desc: "Грузия будет справедлива по отношению ко всем своим гражданам, независимо от их экономического происхождения или этнической принадлежности."
 GEO_natdem_plurality: "Национально-демократическое многообразие"
 GEO_natdem_plurality_desc: "Люди выступили, и они выбрали Национальных демократов, чтобы возглавить Грузию, они являются националистической партией, также в пользу свободных рынков и сильного руководства."
 GEO_forced_centralization: "Принудительная централизация"
 GEO_forced_centralization_desc: "Автономия, которую мы предоставляем нашим национальным меньшинствам, это то, что позволяет им, и мы должны ликвидировать эту автономию, сделав все районы страны непосредственно контролируемыми центральным государством."
 GEO_minimal_welfare: "Минимальное благосостояние"
 GEO_minimal_welfare_desc: "Хотя мы не можем полностью ликвидировать систему социального обеспечения, мы будем сводить ее к минимуму, с тем чтобы заставить людей работать и укрепить нашу экономику."
 GEO_all_are_georgians: "Мы все грузины"
 GEO_all_are_georgians_desc: "Так называемые национальные меньшинства должны осознать, что они являются грузинами, как и все мы, и мы их узаконим, изучая наш язык и историю в своих школах и запрещая любую их сепаратистскую деятельность."
 GEO_foreign_policy: "Внешняя политика"
 GEO_foreign_policy_desc: "Теперь, когда наш политический путь решен, мы должны выбрать нашу внешнюю политику."
 GEO_SSR_policy: "Политика в области ССР"
 GEO_SSR_policy_desc: "Даже сейчас, когда мы являемся ССР, мы должны определить нашу политику в отношении других ССР и центральной власти."
 GEO_friendliness: "Совпадение с нашими друзьями по ССР"
 GEO_friendliness_desc: "Теперь, когда мы находимся в СССР, нет никаких оснований для новых конфликтов, и мы должны быть дружелюбны к нашим социалистическим братьям."
 GEO_soviet_industrial_help: "Советская промышленная помощь"
 GEO_soviet_industrial_help_desc: "Советы могут помочь нам расширить и обновить его, и, в свою очередь, мы поможем им, предоставляя им товары."
 GEO_expeditionary_forces: "Грузинские экспедиционные силы"
 GEO_expeditionary_forces_desc: "Советский Союз является социалистической державой в конфликте с буржуазией, которая пытается уничтожить его. Мы должны помочь нашему Союзу выжить и процветать, так что мы пошлем ему экспедиционные силы, чтобы помочь ему в его благородной битве."
 GEO_expansion: "Расширение"
 GEO_expansion_desc: "То, что у нас в настоящее время есть, недостаточно."
 GEO_ties_to_soviet_leadership: "Укрепляйте нашу связь с советским руководством"
 GEO_ties_to_soviet_leadership_desc: "Чтобы идти по такому авантюрному пути, нам нужно укрепить наши связи с руководством профсоюза, с тем чтобы они позволили нам сделать это."
 GEO_invade_azerbaijan: "Инвад Азербайджан"
 GEO_invade_azerbaijan_desc: "Азербайджан является легкой мишенью, поскольку его военные не настолько сильны, он также полон нефти, очень важного ресурса для Советского Союза и для всего мира."
 GEO_invade_armenia: "Инвад Армения"
 GEO_invade_armenia_desc: "Армения будет трудной мишенью для «либерации», поскольку ее военные жестоки и ожесточены, но у нее есть много коммунистических сторонников, которые помогут нам в будущем, и это неотъемлемая часть Транскавказии, поэтому мы должны победить ее."
 GEO_form_socialist_transcaucasia: "Формирование социалистической транскавказии"
 GEO_form_socialist_transcaucasia_desc: "Теперь, когда Транскавказский народ объединился, пора еще больше интегрировать их, объединив их в одну ССР."
 GEO_revive_transcaucasia: "Возрождение Транскавказии"
 GEO_revive_transcaucasia_desc: "Транскавказия была недолговечным государством, рожденным, когда рухнула русская империя, но она распалась, поскольку национальные разногласия были слишком велики, чтобы поддерживать общую внешнюю политику в WW1. Теперь, когда у всех нас есть общий враг, должна быть возможность держать Транскавказию вместе, но сначала нам нужно убедить другие страны реформировать ее."
 GEO_armenia_talks: "Сочетание с Арменией"
 GEO_armenia_talks_desc: "Армения будет самой трудной страной, которую мы убедим: у них есть территориальные притязания как на нас, так и на Азербайджан, и у них были войны как с нами, так и с Азербайджаном, возможно, что отказ от Лори, за которую мы воевали, убедит их в том, что мы серьезно настроены на мир, но это не будет популярным среди нашего народа."
 GEO_azerbaijan_talks: "Сочетание с Азербайджаном"
 GEO_azerbaijan_talks_desc: "Мы поддерживаем дружественные отношения с Азербайджаном с момента обретения им независимости, но убедить их в том, что они являются частью нашего союза, по-прежнему будет нелегко, и мы должны убедить их смириться с Арменией, несмотря на их продолжительный территориальный конфликт, мы также имеем большую азербайджанскую провинцию, которую мы могли бы предоставить им для того, чтобы успокоить их националистов."
 GEO_transcaucasia_campaign: "Кампания за транскавказию"
 GEO_transcaucasia_campaign_desc: "Мы должны убедить людей в том, что реформа Транскавказии является правильным ответом на проблемы региона и что у нас больше общего, чем мы думали."
 GEO_transcaucasia_referendum: "Транскавказский референдум"
 GEO_transcaucasia_referendum_desc: "Вопрос о том, следует ли реформировать Транскавказию или нет, должен быть в конечном счете решен народом."
 GEO_form_transcaucasia: "Форма Транскавказия"
 GEO_form_transcaucasia_desc: "Транскавказские народы проголосовали за создание Транскавказской федерации."
 GEO_caucasia_referendum: "Союз с Горной Республикой"
 GEO_caucasia_referendum_desc: "Горная Республика уже давно пользуется нашей поддержкой, и они сталкиваются с теми же угрозами, что и мы, и включение их в федерацию принесет пользу обеим сторонам, поэтому мы спросим их, хотят ли они присоединиться."
 GEO_our_ancient_claims: "Наши древние притязания"
 GEO_our_ancient_claims_desc: "В эти нестабильные времена у нас снова появилась возможность вновь захватить наши старые территории и вступить в новую золотую эпоху!"
 GEO_trapizoni_plebiscite: "Плебисцит в Трапизони"
 GEO_trapizoni_plebiscite_desc: "Армения - жестокий враг, и нет причин воевать с ними, если мы сможем избежать этого."
 GEO_claim_armenia: "Война над Арменией"
 GEO_claim_armenia_desc: "Вся Армения была нашей, нет смысла идти на компромисс, только быстрая победа приведет нас к славе!"
 GEO_claim_old_trapizoni: "Война над старым трапсизони"
 GEO_claim_old_trapizoni_desc: "Турки держат территорию, которая принадлежала нашим вассалам."
 GEO_claim_azerbaijan: "Война над Азербайджаном"
 GEO_claim_azerbaijan_desc: "Азербайджанцы, возможно, были нашими союзниками, но они держат нашу территорию и даже утверждают, что мы держим их территорию!"
 GEO_alliance_with_germany: "Альянс с Германией"
 GEO_alliance_with_germany_desc: "Мы не можем уничтожить Советский Союз в одиночку (или можем?). Мы должны объединиться с другой силой, которая выступает против Советов, и потому что Франция и Великобритания выступают против наших завоеваний, это оставляет нам только один выбор: Германия."
 GEO_conflict_over_north_caucasia: "Конфликт по поводу Северной Кавказии"
 GEO_conflict_over_north_caucasia_desc: "Северная Кавказия является не только нашей законной территорией, но и районом стратегического значения."
 GEO_claim_krasnodar: "Конфликт по поводу Краснодара"
 GEO_claim_krasnodar_desc: "Настало время встретиться с великим советским зверем, хотя наши шансы невелики, наша законная территория впереди, и если мы не освободим ее, то кто?"
 GEO_claim_crimea: "Война из-за Крыма"
 GEO_claim_crimea_desc: "Мы получили много нашей законной территории, но одна часть все еще существует недалеко. На протяжении многих веков Крым оставил грузин, но не больше. Нам нужно получить это последнее требование, прежде чем мы сможем успокоиться."
 GEO_greater_georgia: "Провозглашайте Большую Грузию"
 GEO_greater_georgia_desc: "Мы сделали это. Грузия восстановила всю свою территорию, и теперь мы можем сказать, что вступили в новую золотую эпоху."
 GEO_defense_pact: "Наш собственный альянс"
 GEO_defense_pact_desc: "Если мы хотим быть в безопасности от советской угрозы, нам нужно собрать все страны региона в коалицию против них."
 GEO_request_british_protection: "Запрос British Protection"
 GEO_request_british_protection_desc: "У нас долгая история с британами, с взлетами и падениями, они против Советов, и там есть политики, которые сочувствуют нашему бедственному положению, возможно, они будут готовы гарантировать нашу независимость?"
 GEO_georgian_soviet_rapprochement: "Грузино-советский арест?"
 GEO_georgian_soviet_rapprochement_desc: "Мы должны попытаться заключить с ними сделку и согреть наши отношения."
 GEO_dem_joining_the_internationale: "Попроси Советов присоединиться к Международной организации"
 GEO_dem_joining_the_internationale_desc: "С тех пор, как мы сблизились, Советы и мы стали намного ближе, некоторые в нашей стране предлагают нам вступить в советский союз."

    ### SHARED
 GEO_industry: "Переориентация промышленности"
 GEO_industry_desc: "Очевидно, что наша старая индустрия уже не жизнеспособна в эту современную эпоху."
 GEO_export_focus: "Экспортный фокус"
 GEO_export_focus_desc: "Мы не располагаем достаточными ресурсами для того, чтобы в полной мере поддерживать себя без внешней торговли."
 GEO_borjomi_mineral_water: "Горнорудная вода Боржоми"
 GEO_borjomi_mineral_water_desc: "Наши источники воды, как известно, имеют исцеляющие качества, и мы экспортируем их воды в остальной мир."
 GEO_georgian_wine: "Грузинское вино"
 GEO_georgian_wine_desc: "Наше вино знаменито своим уникальным вкусом и высоким качеством. Мы можем обеспечить его многим регионам по более низкой цене, чем европейское вино, и, надеюсь, получить значительную долю рынка."
 GEO_lemons_tea_wheat: "Обмен лимонов и чая на пшеницу"
 GEO_lemons_tea_wheat_desc: "Мы делаем много чая и лимонов, но люди не могут выдержать только этого, мы должны заключить соглашения с другими странами о поставках чая и лимонов в обмен на пшеницу, чтобы прокормить наш народ."
 GEO_increase_tourism: "Расширение туризма"
 GEO_increase_tourism_desc: "По мере того, как остальная часть мира охвачена хаосом, Грузия все больше и больше похожа на остров здравого смысла, поскольку многие традиционные места отдыха закрыты из-за мировой напряженности, возможно, Грузия может стать главным туристическим местом?"
 GEO_autarky: "Автарки"
 GEO_autarky_desc: "Мы не можем надеяться на то, что в такое нестабильное время мы сможем сохранить себя от импортируемых товаров, и мы должны максимально увеличить объем нашего собственного производства товаров, с тем чтобы они были настолько самодостаточными, насколько это возможно."
 GEO_farm_collectivisation: "Объединение фермерских хозяйств"
 GEO_farm_collectivisation_desc: "Если каждый фермер работает на своей маленькой ферме, он может поддерживать себя, но не других."
 GEO_forced_collectivisation: "Принудительная коллективизация"
 GEO_forced_collectivisation_desc: "Богатые фермеры притесняют всех, не давая им еды."
 GEO_voluntary_collectivisation: "Добровольное объединение"
 GEO_voluntary_collectivisation_desc: "Коллективные фермы являются более эффективными, чем обычные фермы, однако правильный способ достижения коллективизации заключается в стимулировании, а не в силе."
 GEO_farm_privatisation: "Приватизация фермерских хозяйств"
 GEO_farm_privatisation_desc: "Каждый человек имеет право на свое собственное имущество, которое не может быть присвоено государством, мы должны найти решение проблемы нашего низкого сельскохозяйственного производства в рамках индивидуалистической системы."
 GEO_distribute_land: "Новая земельная реформа"
 GEO_distribute_land_desc: "Одной из первых вещей, которые мы сделали, когда получили независимость, является земельная реформа, и это был огромный успех."
 GEO_sell_land: "Продавать землю самому высокому кандидату"
 GEO_sell_land_desc: "Продавая правительственную землю тому, кто больше всего платит за нее, мы не только гарантируем себе дополнительный источник дохода, но и то, что тот, кто купил землю, захочет увидеть ее развитие."
 GEO_encourage_wheat_farming: "Поощрять выращивание пшеницы"
 GEO_encourage_wheat_farming_desc: "Но вместо того, чтобы импортировать пшеницу, мы можем поощрять наших фермеров выращивать пшеницу."
 GEO_advanced_agriculture: "Импортировать сельскохозяйственные технологии"
 GEO_advanced_agriculture_desc: "Благодаря импорту новых сельскохозяйственных технологий мы могли бы выращивать больше растений и растений, которые приносили бы нам больше пользы."
 GEO_expand_local_infrastracture: "Расширить местную вытяжку"
 GEO_expand_local_infrastracture_desc: "Инфраструктура Грузии устарела, иногда даже идет в царскую эпоху."
 GEO_georgian_railways: "Грузинские железные дороги"
 GEO_georgian_railways_desc: "Если мы свяжем всю страну железнодорожным транспортом, это приведет к увеличению производства и развитию сельских районов."
 GEO_transcaucasian_railways: "Транскавказские железные дороги"
 GEO_transcaucasian_railways_desc: "Мы должны сотрудничать с нашими соседями в координации строительства новых железных дорог, которые соединит наши страны, что позволит облегчить перевозку товаров, людей и, если потребуется, армии."
 GEO_regional_universities: "Находящиеся региональные университеты"
 GEO_regional_universities_desc: "Тбилиси становится все более и более развитой страной, в то время как сельские районы отстают, и мы должны найти новые университеты в наших различных регионах для их развития."
 GEO_army: "Грузинская армия"
 GEO_army_desc: "Грузинская армия уже многие годы игнорируется, и, хотя мы могли бы позволить себе не обращать на нее внимания на протяжении всех этих лет, настало время перестроить ее перед лицом усиливающейся напряженности в регионе."
 GEO_british_arms: "Импортировать британское оружие"
 GEO_british_arms_desc: "У нас длинная история с британами, но они согласились защитить нас от Советов, возможно, они согласятся вооружить нас и сейчас."
 GEO_soviet_arms: "Импорт советских вооружений"
 GEO_soviet_arms_desc: "Теперь, когда мы стали советскими, они наверняка помогут нам с поставками оружия, верно?"
 GEO_local_arms: "Ищите местное оружие"
 GEO_local_arms_desc: "Мы не можем надеяться на получение оружия извне, поэтому мы должны искать оружие внутри наших границ."
 GEO_enforce_conscription: "Принудительное исполнение законов о призыве"
 GEO_enforce_conscription_desc: "У нас уже есть строгие законы о призыве, но они не были использованы из-за периода долгого мира."
 GEO_french_training: "Подготовка французских офицеров"
 GEO_french_training_desc: "Французы стали экспертами в области обороны во время Великой войны, мы должны попросить их обучить наших офицеров, чтобы у нас был шанс сражаться против высшей армии."
 GEO_ukrainian_training: "Подготовка украинских офицеров"
 GEO_ukrainian_training_desc: "Украинская армия провела много исследований в советской армии, в преддверии будущего конфликта, и мы должны попросить их подготовить наших офицеров, как потому, что они являются нашими историческими друзьями, так и потому, что у нас аналогичная ситуация в отношении советской угрозы."
 GEO_expand_junker_school: "Расширить школу Junker"
 GEO_expand_junker_school_desc: "Школа Джункера подготовила некоторых из наших лучших офицеров, и нет причин доверять иностранцам, чтобы обучать наших офицеров лучше, чем мы, вместо этого мы должны расширить Школу Джункера, чтобы обучать гораздо больше офицеров."
 GEO_equipment_manufacturing: "Производство оборудования"
 GEO_equipment_manufacturing_desc: "У нас больше людей, чем оружия, и нам нужно исправить ситуацию, если мы хотим иметь шанс против наших врагов, мы должны производить все необходимое оборудование внутри Грузии, чтобы не полагаться ни на кого."
 GEO_heavy_weapons_industry: "Промышленность по производству тяжелого оружия"
 GEO_heavy_weapons_industry_desc: "Если мы будем сражаться только с помощью легких вооружений, мы проиграем против более механизированных сил, нам нужно больше тяжелых вооружений, если мы хотим иметь шанс сражаться против более крупных армий."
 GEO_provinicial_manufacturing: "Провинциальная обрабатывающая промышленность"
 GEO_provinicial_manufacturing_desc: "Сохранение всего нашего производства в городах неэффективно, когда мы можем построить новые фабрики вблизи ресурсов, которые нам все равно нужны для производства оружия."
 GEO_stand_our_ground: "Доктрина, стоящая на нашей земле"
 GEO_stand_our_ground_desc: "В действительности, мы не добьемся больших успехов с нашей армией, если вспыхнет война, самое главное, что мы продержимся как можно дольше, пока враг не поймет, что мы не стоим их усилий."
 GEO_field_artillery_doctrine: "Доктрина полевого артиллерия"
 GEO_field_artillery_doctrine_desc: "Использование тактики Великой войны не принесет нам пользы в эту эпоху современной войны. Мы будем активно использовать артиллерию, когда будем в состоянии обороны, и когда мы будем в нападении, чтобы сохранить жизни и быть более эффективными в бою."
 GEO_advanced_theory: "Продвинутая военная теория"
 GEO_advanced_theory_desc: "Наши офицеры должны обладать глубокими знаниями военной теории, мы должны учиться у других стран, а также поощрять наших более опытных офицеров к написанию своих собственных военных текстов."
 GEO_expanded_mountaineer: "Расширенные горные силы"
 GEO_expanded_mountaineer_desc: "Джорджия полна гор, мы можем использовать их в своих интересах, поражая врага из тех мест, до которых он не может легко добраться, с этой целью мы расширим наши горные силы."
 GEO_army_motorization: "Армия Моторизация"
 GEO_army_motorization_desc: "Каждая современная армия полагается на грузовики для поставок и транспортировки; мы не должны отличаться от них."
 GEO_tank_research: "Исследования по цистернам"
 GEO_tank_research_desc: "Танки очень успешно использовались во время Великой войны, и они могли бы помочь и нам."
 GEO_army_mechanization: "Механизация армии"
 GEO_army_mechanization_desc: "Грузовики не обеспечивают достаточной защиты на поле боя."
 GEO_navy: "Грузинские военно-морские силы"
 GEO_navy_desc: "Наш флот едва ли существует как нечто большее, чем силы береговой обороны."
 GEO_merchant_navy: "Расширить наш торговый флот"
 GEO_merchant_navy_desc: "У нас недостаточно торговых судов для расширения нашей торговли с миром, поэтому мы должны покупать и строить больше торговых судов."
 GEO_destroyer_focus: "Уничтожить фокус"
 GEO_destroyer_focus_desc: "Разрушители относительно дешевы, и они могут защитить нас от торговых перебоев."
 GEO_light_cruiser_research: "Исследование легкого круизера"
 GEO_light_cruiser_research_desc: "Иногда у разрушителей не хватает огневой мощи, у нас мало возможностей строить большие корабли, как эсминцы, но мы можем хотя бы изучить возможность строительства нескольких легких крейсеров для лучшей защиты наших берегов."
 GEO_import_new_designs: "Импортировать новые дизайны"
 GEO_import_new_designs_desc: "Нам нужно импортировать новые эсминцы, которые могут бороться с современными подводными лодками и другими эсминцами."
 GEO_submarine_focus: "Фокус подводные лодки"
 GEO_submarine_focus_desc: "У нас нет больших надежд на победу в битве против большого флота, но если мы построим подводные лодки, мы сможем сорвать торговлю нашими врагами."
 GEO_kickstart_submarine_manufacturing: "Производство подводных лодок Kickstart"
 GEO_kickstart_submarine_manufacturing_desc: "У нас нет опыта в производстве подводных лодок, поэтому, если мы хотим начать их строительство, нам нужно купить запчасти из-за границы, чтобы быстро построить наши первые подводных лодки."
 GEO_upgrade_torpedo_boats: "Модернизация наших лодок Торпедо"
 GEO_upgrade_torpedo_boats_desc: "Легкие крейсеры - самые большие корабли, которые мы можем реально использовать. Мы должны одеть их торпедами, взятыми из наших торпедных лодок."
 GEO_expand_batumi_dockyard: "Расширить докьярд Батуми"
 GEO_expand_batumi_dockyard_desc: "Батуми уже является нашим самым крупным портом, расширяя наши возможности по строительству кораблей в этом районе, имеет больше смысла из-за наличия квалифицированных рабочих в этом районе."
 GEO_provincial_dockyards: "Сделать новые провинциальные причалы"
 GEO_provincial_dockyards_desc: "Хотя мы можем быть более эффективными, расширяя Батуми-Докьярд, это лишь усугубит проблему безработицы в провинции, и мы должны открыть новые пристани вдали от больших городов, чтобы дать работу молодежи провинции."
 #GEO_the_naval_crown_jewel: "Жемчужина морской короны"
 #GEO_the_naval_crown_jewel_desc: "Наш флот уже является значительной силой в Черном море, но у нас нет более грозных кораблей."
 GEO_airforce: "Грузинские военно-воздушные силы"
 GEO_airforce_desc: "Мы больше не можем использовать наши маленькие военно-воздушные силы в эпоху Великой войны, мы должны расширить их и вложить средства в противовоздушную оборону, чтобы защитить нас от других стран."
 GEO_new_fighters: "Найти новых боев"
 GEO_new_fighters_desc: "Наши военно-воздушные силы очень малы, мы должны найти новых бойцов, чтобы дать нам шанс на борьбу с более крупными военно-воздушными силами."
 GEO_expand_airbases: "Расширение военно-воздушных баз"
 GEO_expand_airbases_desc: "Теперь, когда у нас больше самолётов, нам нужно расширить наши авиабазы, чтобы все самолеты могли работать и быть готовы к полетам повсюду."
 GEO_cas_focus: "Фокус CAS"
 GEO_cas_focus_desc: "Мы будем вкладывать средства в исследования и производство КАС, с тем чтобы повысить эффективность наших боевых действий."
 GEO_tac_bomber_focus: "Тактический бомбардировщик"
 GEO_tac_bomber_focus_desc: "Мы будем вкладывать средства в исследования и производство тактических бомбардировщиков, чтобы наши враги пострадали."
 GEO_doctrinal_research: "Доктринальные исследования"
 GEO_doctrinal_research_desc: "Военно-воздушные силы должны иметь прочную доктрину, которая будет направлять их действия."
 GEO_towed_aa: "Сосредоточьтесь на буксировке AA"
 GEO_towed_aa_desc: "Наша противовоздушная оборона должна быть сосредоточена на защите наших подразделений на поле боя от вражеских самолетов."
 GEO_static_aa: "Статический фокус AA"
 GEO_static_aa_desc: "Наша противовоздушная оборона должна быть сосредоточена на защите наших фабрик и наших гражданских лиц."
 
    ### STALIN
 GEO_STA_return: "Он возвращается."
 GEO_STA_return_desc: "Жугашвили не имели легкой жизни ни в коем случае, от избиений дома, до изучения со священниками, и, наконец, до того, что они стали ключевой фигурой в подполье большевиков, но они предали его, и вскоре они почувствуют, каково это, когда Джугашвили злятся на тебя."
 GEO_STA_repress: "Политические репрессии"
 GEO_STA_repress_desc: "Эпоха свободы в Грузии закончилась, люди больше не будут ходить и свободно выражать свое мнение, вместо этого будет одно допустимое мнение и лишь несколько отдельных утвержденных образов жизни, все старые партии будут закрыты и очищены, и марксистская партия будет высокой."
 GEO_STA_nationalize: "Национализация всей промышленности"
 GEO_STA_nationalize_desc: "Мы не можем не учитывать тот факт, что есть некоторые области, которые мы не контролируем в полной мере, мы должны решительно расширить свое понимание этой отрасли, и мы не можем позволить капиталисту иметь какую-либо собственность, которая должна принадлежать работникам, или, другими словами, нам."
 GEO_STA_militarism: "Милитаризм &quot; Фервент &quot;"
 GEO_STA_militarism_desc: "Поскольку наше население не поддерживает нас, нам нужно лечить детей с раннего возраста, чего можно достичь за счет призыва на военную службу и связанных с ней молодежных организаций, кроме того, это привлечет националистическую поддержку и заставит людей ненавидеть наших внешних врагов вместо нас."
 GEO_STA_labor_camps: "Трудовые лагеря"
 GEO_STA_labor_camps_desc: "Мы посадили в тюрьму многих людей, которые выступают против нашего режима, но просто тратить деньги на то, чтобы держать их в тюрьмах, бессмысленно."
 GEO_STA_secret_police: "Копировать секретную полицию Ленина"
 GEO_STA_secret_police_desc: "Ленин, возможно, был ублюдком, но никто не может утверждать, что он не знал, как угнетать свой народ."
 GEO_STA_collectivisation: "Объединение Джугашвили"
 GEO_STA_collectivisation_desc: "В то время как Джугашвили изначально выступал против быстрой коллективизации, в то время, когда его очищали, он действительно разбудил его до выгод от коллективизации. Некоторые крестьяне могут умереть, но это жертва, которую он готов принести."
 GEO_STA_vanguardism: "Национальный коллективизм с грузинскими характеристиками"
 GEO_STA_vanguardism_desc: "Хотя мы точно не следуем Марксу в слове, наши изменения необходимы для того, чтобы лучше соответствовать реальности жизни на Кавказе."
 GEO_STA_worship_stalin: "Поклонение вождю"
 GEO_STA_worship_stalin_desc: "Чтобы отвлечь людей от их жалкой жизни, мы должны сфокусировать их внимание на нашем Спасителе Иозебе Джугашвили, без него они были бы ничем, с ним у руля Джорджия будет велика, и все работники мира будут свободны поклоняться ему."
 GEO_STA_5_year_plans: "Планы на пять лет"
 GEO_STA_5_year_plans_desc: "Наша индустрия в плохой форме, может, нам не стоило изгонять всех наших талантливых промышленников и инженеров?"
 GEO_STA_rogue_state: "Государство-нарушитель"
 GEO_STA_rogue_state_desc: "С безумием нашего лидера и угнетением наших граждан, все думают, что мы сошлись с ума, и с нашим государством нельзя торговаться."

    ## FOREIGN POLICY (STALIN)
 GEO_STA_foreign_policy: "Внешняя политика"
 GEO_STA_foreign_policy_desc: "После того, как контроль Джугашвили укрепился, пришло время для нас попытаться расширить наши границы и распространить истинный социализм!"
 GEO_STA_invade_azerbaijan: "Инвад Азербайджан"
 GEO_STA_invade_azerbaijan_desc: "Азербайджан является легкой мишенью для вторжения, поскольку его армия наименее сильна на Кавказе и в ней много социалистов, которые могут нам помочь. Азербайджанцы могут даже рассматривать нас как меньшее зло по сравнению с армянами, что может помочь нам разделить и покорить."
 GEO_STA_invade_armenia: "Инвад Армения"
 GEO_STA_invade_armenia_desc: "Армения имеет большую армию, и против нее будет трудно бороться. Они крайне важны, если мы хотим расшириться или ошибаться, распространяя социализм еще дальше. Мы не можем просто быть довольны Кавказом, когда так много земель нуждаются в освобождении!"
 GEO_STA_invade_mountain: "Проникнуть в горную Республику"
 GEO_STA_invade_mountain_desc: "Северный Кавказ уже давно является южным воротами в Россию."
 GEO_STA_invade_iranian_azerbaijan: "Вопрос об иранском Азербайджане"
 GEO_STA_invade_iranian_azerbaijan_desc: "Иранский Азербайджан является неотъемлемой частью Азербайджана, потому что мы законные правители Азербайджана Иран должен предоставить нам этот регион, и если они этого не сделают, мы будем вынуждены вторгнуться в него."
 GEO_STA_invade_soviet: "Проникнуть в Советский Союз"
 GEO_STA_invade_soviet_desc: "И наконец, пришло время решить реальную проблему. Советский Союз, который очистил Джугашвили все эти годы назад, будет чувствовать, каков вкус мести. Их фальшивый социализм будет стерт с земли, и будет установлен новый и более просвещенный режим."

    ### SSR

 GEO_SOV_foreign_policy: "Внешняя политика"
 GEO_SOV_foreign_policy_desc: "Настало время принять решение о нашей внешней политике, мы могли бы быть просто ССР, как и все остальные, поддерживать хорошие отношения и в целом быть мирными, или мы могли бы расширить и распространить наш социализм и на другие страны."

 ### Characters ###
 GEO_giorgi_bagration_mukhraneli: "Джордж Баграт-Мухранели"
 GEO_giorgi_bagration_mukhraneli_regnal: "Георгий IX"
 GEO_giorgi_bagration_mukhraneli_leader_desc: "Сказка о доме Баграт-Мухрани начинается с прихода к власти в начале XVI века принца Баграта, которому брат, король Грузии, даровал титул Мухрани, но в конце концов он поднялся, чтобы взять на себя большую долю автономной власти и получить де-факто суверенитет над своей фифемой. После русского завоевания Грузии, лордов дома баграции и дома Баграти-Мухрани были признаны в равной степени могущественными, но вскоре отделение Мухрани начало завоевывать все большую и большую поддержку в российской политике, особенно среди грузинских националистов. Старейшая ветвь баграции в конце концов умерла, оставив мужчину Мухрани следующим в очереди на грузинский трон. Баграция-Мухрани была официально признана, когда трон был завоеван Джорджом Багрантом на недавнем политическом референдуме, восстанавливая его грузинский монархию. Король Георг IX считался довольно самовластным человеком, имеющим свои собственные политические взгляды. Он был сильно под влиянием своего покойного Александра, который умер от борьбы с большевиками, а его потомский принц Иракли, который, как обычно видит, был бы более достойным корольным, ассидентом, гером, гером, гером, и гером, и германом."

