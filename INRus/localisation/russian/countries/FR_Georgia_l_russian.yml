 ####BRIEF HISTORY
 GEO_FUHRERREICH_DESC: "Прошло 100 лет, и Грузия наконец восстановила свою независимость, когда рухнула Русская империя. Ведущая грузинская Меншевская партия, страна быстро приняла социальные демократические реформы и быстро развивалась. Однако после выборов 1934 года партия стала все более расколотой между фракцией, которая хочет быстро ликвидировать капитализм, и фракцией, которая в большей степени выступает за постепенное развитие общества. Разрыв подтолкнул небольшие партии Грузии, и, похоже, политическая ситуация не стабилизируется быстро, радикальные новые игроки могут войти в политическую сферу."

 ####EVENTS
 ge.100000.t: "Положение в Грузии в 1936 году"
 ge.100000.d: "После октябрьской революции русская Транскавказская провинция разорвалась и сформировала Транскавказскую Федерацию. Однако это государство не было долгим для всего мира, так как оно вскоре ворвалось в Армению, Азербайджан и Грузию. Поскольку война не скоро закончится, грузины, возглавляемые Меншевской партией, пригласили немцев оккупировать Грузию (и защитить их от Османов). Грузинские не стали принимать участия в российской гражданской войне, и в то время как большевики первоначально были враждебными, в 1920 году Грузия подписала мирное соглашение с Советским Союзом, в соответствии с которым большевикская партия стала законной политической партией. Несмотря на годы существования новой фракции, сформированной в Партии Меншвик. Радикальные силы получили новый интерес по мере того, как прогресс в направлении социализма, казалось, прекратился. Они не представляли большой угрозы до недавнего времени, когда они начали выступать за быстрый переход Грузии к либертарианскому социализму. Нынешнее правительство Грузии относится к умеренной фракции, которые выступают против быстрого изменения общества. Председатель Грузии, Акаки Чхенкелли, который был избран с более решительными по отношению, который был избран после срока, был избран, и более продолжительным."
 ge.100000.a: "Мретсвелоба Гадаархенс Сакартвелос!"

 ge.1000.t: "Иосеб Джугашвили Возрождение"
 ge.1000.d: "Казалось, что после долгой позорной изгнания Джагашвили из Советского Союза из-за его"comrades" in the Soviet leadership, he would never return to what he used to be. But it seems that we have misjudged him, since we have received reports of him inciting people against our government and forming a new party. He even tried to adopt his old nickname, 'Stalin', though without much success."
 ge.1000.a: "Оставь его в покое."
 ge.1000.b: "Заключите его в тюрьму за подстрекательство"
 ge.1000.c: "Приведите кого-нибудь, кто убедит его, что он ошибается."

 ge.1001.t: "Мать Джугашвили убеждает его изменить свои пути"
 ge.1001.d: "Мы привезли мать Джугашвили, Кеке Геладзе, в Джугашвили, чтобы убедить его прекратить свою мятежную деятельность и заботиться о ней в старости."
 ge.1001.a: "Он ненавидел своего отца, но любил свою мать."

 ge.1002.t: "Встреча Джагашвили со своей матерью провалилась"
 ge.1002.d: "Мы привели мать Джугашвили, Кеке Геладзе, в Джугашвили, чтобы убедить его прекратить свою мятежную деятельность и заботиться о ней в старости."
 ge.1002.a: "Является ли национальный коллективизм сильнее, чем связь мальчика с матерью?"

 ge.1003.t: "Жордания убеждает Джугашвили в том, что Меншевики имеют правильный путь"
 ge.1003.d: "Похоже, что Жордания сделала невозможное. После долгой встречи с Иозебом Джугашвили, в которой обе обсуждались революционные вопросы и старые времена, Зордания, похоже, убедила Джугашвили в том, что большевим потерпел неудачу и что Меншевики возглавят социалистическую революцию. Джугашвили даже обещали присоединиться к Меншевской партии и поддержать ее!"
 ge.1003.a: "Разве это не здорово, когда два старых Амханагэбо воссоединились?"

 ge.1004.t: "Джугашвили Стормс вышел из встречи с Жорданией"
 ge.1004.d: "Мы действительно ожидали чего-то иного? даже если никто и не мог поставить под сомнение обоснованность аргументов Жордании, Джугашвили все равно смог сделать это. Нет никаких убедительных доказательств такого рода психа. Похоже, эта встреча только еще больше убедила его в необходимости свержения правительства."
 ge.1004.a: "Джугашвили действительно оскорбляет социализм."

 ge.1100.t: "Кубок в Грузии"
 ge.1100.d: "В начале сегодняшнего утра многие независимые ячейки революционеров Национального объединения захватили правительственные и общественные здания по всей Тбилиси, а другие группы захватили другие города, такие, как Батуми, Кутаиси, Поти и Сухуми, несмотря на всю эту путаницу, была предпринята попытка заключить в тюрьму ключевых людей в грузинской политике, но, к счастью, почти все эти попытки не увенчались успехом, и политики в настоящее время готовятся к бегству из страны."
 ge.1100.a: "Сейчас темное время для нашей страны."

 ge.1101.t: "Джугасвили переименует Тбилиси!"
 ge.1101.d: "Иозеб Джугашвили вдруг объявил на встрече Марксистской партии, что он переименует Тбилиси в Кобайси, имя, более подходящее для столицы социалистической нации, так как это имя бандит-протестиста в грузинской книге "Патрицид", те, кто достаточно взрослый, чтобы знать, что это всего лишь уловка, чтобы переименовать столицу Грузии в Иосеб, так как Коба был его подземным прозвищем в эпоху Цариста, но они не смеют говорить..."
 ge.1101.a: "Разве нет предела безумию этого человека?!"

 ge.1500.t: "Берия обвиняется в совершении непристойных действий с военными женщинами"
 ge.1500.d: "С тех пор, как мы разрешили призыв женщин на военную службу, мы стали получать все больше и больше жалоб от женщин, которые были назначены работать с Берией, на то, что он совершает непристойные поступки рядом с ними."
 ge.1500.a: "Дай ему сползти."
 ge.1500.b: "Передай его в суд."
 ge.1500.c: "Отправьте его к психиатру."

 ge.1501.t: "Берия хорошо реагирует на лечение"
 ge.1501.d: "Мы отправили Берию к психиатру после нескольких встреч психиатр сказал нам, что Берия хорошо реагирует на лечение и что через несколько месяцев он должен снова стать психически здоровым."
 ge.1501.a: "Мы должны социализировать охрану психического здоровья, с тем чтобы предотвратить такие случаи в первую очередь."

 ge.1502.t: "Берия закончила лечение"
 ge.1502.d: "На первый взгляд, это тот же человек, которого мы отправили много месяцев назад, но все, кто знал его, больше его не знают."
 ge.1502.a: "Мы отправим его в офицерскую школу, чтобы он стал лучшим полевым маршалом."
 ge.1502.b: "Этот человек был бы великим руководителем разведки."

 ge.1503.t: "Берия плохо отреагировала на лечение"
 ge.1503.d: "Это было очевидно с самого начала, что это не сработает Берия слишком настроена на его садистские манеры, чтобы измениться к сожалению, мы ничего не можем сделать"
 ge.1503.a: "Какая жалость."

 ge.1.t: "Манганские шахтеры идите на битву!"
 ge.1.d: "В связи с недавним крушением Лондонского фондового рынка цены на манганский рынок упали, и владельцы шахт были вынуждены снизить заработную плату горняков-манганцев, однако они не предвидели сильной реакции, которую их действия вызвали среди горняков. Горняки провели забастовку, и другие профсоюзы тоже находятся на грани нанесения ударов, из-за солидарности и страха за свою работу. Хотя мы ожидаем, что Крэш больше не повлияет на нас, радикальные Меншевики воспользовались возможностью покинуть коалицию, набрав много новых последователей и требуя новых выборов, поскольку у правительства больше нет большинства, чтобы поддержать ее."
 ge.1.a: "К сожалению, выборы должны состояться раньше, чем ожидалось."
 ge.1.b: "Маграм Мегона Ром Мретсвелоба Гадархенда Сакартвелос!"

 ge.2.t: "Выборы!"
 ge.2.d: "Хотя выборы были запланированы лишь на следующий год, они прошли гладко, независимо от того, кто из всех жителей страны проголосовал, и это также первые выборы после конституционной поправки 1934 года, которая отменила ограничения на срок полномочий председателей и продлила их срок до трех лет."
 ge.2.a: "Скромная фракция!"
 ge.2.b: "Радикальная фракция!"

 ge.3.t: "Выборы в лотерею!"
 ge.3.d: "После краха коалиции старая партия Меншевик потеряла много своей популярности, так что теперь есть шанс для бывших небольших партий сиять. Победитель выборов:"
 ge.3.a: "Социалистическо-федералистская партия!"
 ge.3.b: "Национальная демократическая партия!"

 ge.10.t: "Референдум монархии!"
 ge.10.d: "Коалиционное правительство приняло спорное решение провести референдум по вопросу о преобразовании страны в конституционную монархию и восстановлении династии Баграти-Мухрани на грузинском троне."
 ge.10.a: "Монархия восстановлена!"
 ge.10.b: "Республика сохранена!"

 ge.100.t: "Грузия предлагает строительство Транскавказской железнодорожной магистрали"
 ge.100.d: "В то время как некоторые из наших министров выступают против этого в качестве грузинской схемы контроля над нашей инфраструктурой, другие указывают на очевидные выгоды."
 ge.100.a: "Мы принимаем их предложение."
 ge.100.b: "Мы никогда не будем иметь дело с извращенной Иберией!"

 ge.110.t: "Грузины просят об арбитраже между ними и сепаратистами"
 ge.110.d: "Грузия уже давно сталкивается с проблемой сепаратизма в своей стране, с тех пор как дни феодализма были разделены на различные части, и даже сегодня они не все разделяют одну и ту же культуру, нас просили служить нейтральным арбитром между ними и их сепаратистами для восстановления мира."
 ge.110.a: "Сепаратистские регионы заслуживают большей автономии."
 ge.110.b: "Грузия права, они уже обладают достаточной автономией."

 ge.115.t: "Грузия предлагает сближение"
 ge.115.d: "Грузины стремятся к сближению с нами, возможно, из-за недавних изменений в правительстве, которые сделали нас ближе друг к другу в идеологическом плане, хотя у нас были планы по завоеванию региона, мы могли бы отказаться от них в пользу добрых отношений и взаимовыгодного сотрудничества."
 ge.115.a: "Наши грузинские товарищи заслуживают того, чтобы жить в мире, мы согласны."
 ge.115.b: "Социализм Джорджии поддельный, они эксплуатируют рабочих, пока мы говорим."

 ge.116.t: "Советы принимают сближение"
 ge.116.d: "Советы приняли наше предложение о сближении, и наши отношения и торговля медленно, но верно улучшаются."
 ge.116.a: "Отличные новости!"

 ge.117.t: "Советы отвергают сближение"
 ge.117.d: "К сожалению, Советы отвергли наше предложение о сближении, они утверждают, что наш социализм поддельный и что Грузия является репрессивной буржуазной диктатурой, и мы должны ожидать от них вторжения в ближайшее время."
 ge.117.a: "Этим извращенным советцам нельзя доверять."

 ge.120.t: "Советы требуют проведения референдума в Сочи"
 ge.120.d: "Русские уже давно считают, что Сочи является частью их основной территории, и теперь, когда мы вступили в Советский Союз, они требуют проведения референдума, чтобы раз и навсегда решить этот вопрос."
 ge.120.a: "Мы не думали об этом, когда вступили в Советский Союз."

 ge.121.t: "Должны ли мы похвастаться на референдуме в Сочи?"
 ge.121.d: "После того, как грузинское правительство объявило, что в Сочи будет проведен референдум для определения того, в какой ССР это будет, некоторые люди предположили, что сочийское население будет промыть мозги грузинами, чтобы не принять наше законное владение их землями."
 ge.121.a: "Народ Сочи не знает, что для них полезно!"
 ge.121.b: "Мы все равно выиграем, зачем жульничать?"

 ge.122.t: "Сочи остаётся грузинским"
 ge.122.d: "Референдум закончился, и голоса были подсчитаны."
 ge.122.a: "Три привета за Сакартвело!"

 ge.123.t: "Сочи выбрала поехать с Россией."
 ge.123.d: "Референдум закончился, голоса были подсчитаны, народ Сочи проголосовал за то, чтобы его аннексировали российские СФСР, хотя некоторые министры предложили, что русские изменили на референдуме, мы ничего не можем сделать."
 ge.123.a: "Люди Сочи сделали свой выбор."

 ge.130.t: "Грузия просит присоединиться к третьей Международной конференции"
 ge.130.d: "В связи с нашим недавним потеплением отношений с Грузией грузинское правительство обратилось к ним с просьбой разрешить им присоединиться к нашей фракции, третьей международной организации."
 ge.130.a: "Мы принимаем их в наш союз."
 ge.130.b: "Мы лишь гарантируем их независимость."
 ge.130.c: "Мы не можем так углублять наши отношения."

 ge.131.t: "Советы приняли нашу просьбу о создании союза!"
 ge.131.d: "К счастью, Советы согласились с нашей просьбой присоединиться к их альянсу, и теперь мы являемся частью третьего Международного союза."
 ge.131.a: "Работники мира, объединяйтесь!"

 ge.132.t: "Советы отклонили нашу просьбу о создании союза!"
 ge.132.d: "К сожалению, Советы отклонили нашу просьбу о создании союза, но, похоже, они до сих пор не считают нас своими товарищами."
 ge.132.a: "Наследие Ленина все еще ощущается в Москве."

 ge.133.t: "Советы гарантировали нашу независимость!"
 ge.133.d: "Хотя Советы не приняли нас в члены Третьей международной организации, они гарантировали нашу независимость."
 ge.133.a: "Что-то лучше, чем ничего, верно?"

 ge.140.t: "Грузия предлагает начать Транскавказские переговоры."
 ge.140.d: "Грузия пришла к нам с предложением начать переговоры между нами и ними по вопросу об объединении наших стран, с тем чтобы вместе противостоять внешним угрозам, однако есть одно условие: если мы примем это предложение, мы обещаем провести референдум по вопросу о формировании Транскавказии в конце переговоров, а также мы должны отказаться от своих территориальных притязаний на другие стороны переговоров."
 ge.140.a: "Мы должны объединиться в эти трудные времена."
 ge.140.b: "Мы никогда не согласимся на эти условия!"

 ge.141.t: "Отказывается в Транскавказских беседах!"
 ge.141.d: "К сожалению, дипломаты [от Гетнама] не были достаточно смелыми, чтобы забыть о наших разногласиях, чтобы объединиться против наших общих врагов."
 ge.141.a: "Они совершили ужасную ошибку, и теперь мы все будем страдать от последствий."

 ge.150.t: "Грузино-армянские переговоры"
 ge.150.d: "Мы встречались с представителями Армении, чтобы обсудить их присоединение к гипотетической Транскавказской федерации."
 ge.150.a: "Отдай им Тао-Кларти."
 ge.150.b: "Отдай им Лори."
 ge.150.c: "Ничего им не давай."

 ge.151.t: "Грузино-азербайджанские переговоры"
 ge.151.d: "Мы встретились с представителями Азербайджана, чтобы обсудить их присоединение к гипотетической Транскавказской федерации, и эта встреча прошла очень гладко, и большинство представителей Азербайджана, казалось, понравилась идея, однако некоторые из наиболее националистических представителей упомянули о том, что у нас есть законные азербайджанские территории."
 ge.151.a: "Отдай им Закаталу."
 ge.151.b: "Ничего им не давай."

 ge.152.t: "Транскавказский референдум!"
 ge.152.d: "Миллионы людей, по всей Транскавказии, проголосуют сегодня на референдуме о реформе Транскавказской федерации."
 ge.152.a: "Мы ждем результатов, терпеливо, но взволнованно."

 ge.153.t: "Транскавказский референдум!"
 ge.153.d: "Миллионы людей, по всей Транскавказии, проголосуют сегодня на референдуме о реформе Транскавказской федерации."
 ge.153.a: "Приняли ли мы правильное решение, когда сотрудничали с этой инициативой?"

 ge.154.t: "Результаты референдума здесь!"
 ge.154.d: "Мы закончили подсчет всех голосов, как и другие республики, независимо от того, каковы результаты, наши нации приблизились в этот период, и, вероятно, даже если референдум провалится, мы все равно создадим экономический и военный союз."
 ge.154.a: "Люди проголосовали за формирование Транскавказии!"
 ge.154.b: "Народ выступает против создания Транскавказии, однако мы все еще будем создавать экономический и военный союз."

 ge.155.t: "Люди поддерживают Транскавказию!"
 ge.155.d: "Результаты референдума были ясными: Транскавский народ хочет реформировать Транскавказскую федерацию, мы уже ведем переговоры с Азербайджаном и Арменией о технических деталях этой встречи."
 ge.155.a: "С этого момента у нас одни и те же враги и друзья."

 ge.156.t: "Народ проголосовал против Транскавказии"
 ge.156.d: "Результаты референдума были ясными: Транскавский народ не хочет реформировать Транскавказскую федерацию, однако, поскольку мы уже установили дружественные отношения с Транскавказскими правительствами, мы договорились создать экономический и военный союз, несмотря на то, что политический союз не вписывается в круг ведения."
 ge.156.a: "Это все еще что-то, да?"

 ge.159.t: "Грузия требует плебисцита в Трапизоне"
 ge.159.d: "Безумные грузины выдвинули новое требование, они хотят, чтобы район Трапизона проголосовал за то, останется ли он армянским или присоединится к Грузии, это нелепое требование, но они угрожали объявить войну нам, если мы откажемся."
 ge.159.a: "Мы позволим."
 ge.159.b: "Они получат плебисцит в своих мечтах."

 ge.160.t: "Трапизони проголосовали за вступление в Грузию"
 ge.160.d: "В то время как армянское правительство все еще переживает этот вопрос, народ Трапасизони выступил, и армяне ничего не могут с этим поделать."
 ge.160.a: "Они ненавидят грузин меньше, чем армян."

 ge.161.t: "Трапизони проголосовали за то, чтобы остаться в Армении"
 ge.161.d: "Люди по всему Траппизони проголосовали сегодня за то, чтобы их территория осталась в Армении, и мы все еще не уверены, почему они это сделали, но армяне должны быть за этим."
 ge.161.a: "Они жульничали, это значит войну!"

 ge.162.t: "Армения отказывается от проведения плебисцита!"
 ge.162.d: "Армения не прислушивалась к нашим требованиям, игнорируя наш ультиматум, они, вероятно, думали, что не смогут выиграть плебисцит, но неважно, мы так или иначе получим этот регион."
 ge.162.a: "Тогда им придется столкнуться с последствиями."

 ge.163.t: "Трапизони проголосовали за вступление в Грузию"
 ge.163.d: "Мы не уверены, как они это сделали, но возможно, им удалось подкупить население или каким-то образом проникнуть в комитет по подсчету голосов."
 ge.163.a: "Мы были неправы, доверив им честно играть."

 ge.164.t: "Трапизони проголосовали за то, чтобы остаться в Армении"
 ge.164.d: "Люди по всему Трапизони проголосовали сегодня за то, чтобы их территория осталась в Армении."
 ge.164.a: "Они просто неудачники!"

 ge.170.t: "Грузины хотят присоединиться к Штальпакту"
 ge.170.d: "Мы были удивлены, когда получили от грузинского правительства послание о том, что они хотят присоединиться к Штальпакту."
 ge.170.a: "Чем больше, тем веселее."
 ge.170.b: "Грузия - это не что иное, как бремя."

 ge.171.t: "Германия отвергла предложение о нашем союзе."
 ge.171.d: "Германия отвергла наше предложение о союзе, мы подозреваем, что они сделали это из-за боязни советских атак на нас, и они вынуждены вмешаться. Несмотря на это, наши шансы на выживание в отношении Советов намного ниже."
 ge.171.a: "Это их потеря!"

 ge.180.t: "Грузины требуют Северной Кавказии"
 ge.180.d: "Эти маленькие ребята из Грузии думают, что у них достаточно сил, чтобы потребовать, чтобы мы передали их Северной Кавказии, хотя мы можем только смеяться над ними, угрожающими нам, возможно, передача их этой малой территории - это хороший способ избавиться от нее и ее нестабильности."
 ge.180.a: "Конечно, они могут забрать его."
 ge.180.b: "Ты что, шутишь?"

 ge.185.t: "Джорджия требует Азарбайян!"
 ge.185.d: "С тех пор, как Джагашвили пришли к власти в Грузии, они вели себя все более и более безумно, и их последний шаг состоял в том, чтобы потребовать от нас Азарбайяна, угрожая силой, если мы откажемся."
 ge.185.a: "Мы должны отдать их им, они слишком сумасшедшие!"
 ge.185.b: "Мы никогда не слышали такой смешной шутки."

 ge.186.t: "Персия отказалась отдать нам Азарбайян!"
 ge.186.d: "Они смеялись над нашими дипломатами, и когда они поняли, что мы серьёзно, они изгнали наших дипломатов и предупредили нас не угрожать им снова."
 ge.186.a: "Мы должны наказать их за их наглость!"

 ge.187.t: "Персия согласилась отдать нам Азарбайян!"
 ge.187.d: "Они знали, насколько мы серьёзны в тот момент, когда наши дипломаты пришли с требованием, они быстро согласились на наши условия, и Азарбайян теперь контролируется нами."
 ge.187.a: "Пока что они спасены."

 ge.190.t: "Грузины просят гарантировать их независимость."
 ge.190.d: "У нас были дружественные отношения с грузинским правительством с тех пор, как мы поддержали их независимость после Великой войны, несмотря на некоторые икоты на этом пути."
 ge.190.a: "Хорошо, мы можем их гарантировать."
 ge.190.b: "Они могут справиться с этим сами."

 ge.191.t: "Англичане отрицают нашу просьбу о гарантировании"
 ge.191.d: "Британцы объяснили, что мы не можем рассчитывать на какую-либо гарантию их независимости, которая потребовала бы от них войны за нашу помощь."
 ge.191.a: "Снова враждебный Альбион!"
 ge.191.b: "Мы обращаемся к Франции в этот трудный час."

 ge.192.t: "Грузины просят гарантировать их независимость."
 ge.192.d: "Мы мало чем занимались с грузинами, но они по-прежнему требуют гарантии их независимости, главным образом, чтобы предотвратить нападение Советского Союза на них. Они уточняют, что они просили у британцев гарантии, но они отказали им. Согласие на это могло бы укрепить нас дипломатическим путем, но война в далеком месте может быть опасной для вмешательства."
 ge.192.a: "Мы гарантируем их независимость."
 ge.192.b: "Они могут искать своих друзей в другом месте."

 ge.195.t: "Транскавказия предлагает нам присоединиться к их федерации."
 ge.195.d: "У нас уже давно были хорошие отношения с грузинами и азербайджанцами, и из-за международной ситуации им было бы разумно предложить присоединиться к их федерации, чтобы защититься от иностранных угроз, но это означает отказаться от нашей независимости, от того же, чего мы пытались избежать..."
 ge.195.a: "Мы присоединимся к их федерации."
 ge.195.b: "Мы не можем отказаться от своей независимости!"

 ge.199.t: "Транскавказские выборы"
 ge.199.desc: "В то время как в прошлом партии были разделены политической идеологией, мы стали свидетелями того, как традиционные партии Транскавских стран превратились в партии, представляющие всю свою нацию."
 ge.199.a: "Грузинские кандидаты выигрывают"
 ge.199.b: "Армянские кандидаты выигрывают"
 ge.199.c: "Азербайджанский кандидат выигрывает"
 ge.199.d: "Пери-Хан Софиева станет нашим лидером."

 ge.200.t: "Грузины просят их вооружить."
 ge.200.d: "Джорджия всегда была страной, в центре наших белых интересов. Теперь, когда они расширяют свою армию, они решили, что было бы лучше попросить нас предоставить им их очень желанное оружие. Хотя им действительно нечего платить, они обещали, что будут вечно благодарны."
 ge.200.a: "Почему?"
 ge.200.b: "Зачем нам это делать?"

 ge.201.t: "Он отказался дать нам оружие!"
 ge.201.d: "К сожалению, мы отказались предоставить нам оружие, хотя и пытались убедить их в том, что оно принесет им пользу, после чего мы научились снижать наши ожидания в отношении международной помощи нашей стране."
 ge.201.a: "Какая жалость."

 ge.250.t: "Боевой корабль закончил строительство"
 ge.250.d: "Наш корабль, королевский драгоценный камень в нашем новом военно-морском флоте, наконец-то завершен, и теперь он присоединится к остальной части нашего флота."
 ge.250.a: "Ура!"

 ge.260.t: "Предложить миру туркам?"
 ge.260.d: "Сейчас мы можем предложить мир, который обеспечит наш контроль над этим регионом."
 ge.260.a: "Очень хорошо, нет необходимости в большем кровопролитии, чем необходимо."
 ge.260.b: "Мы не перестанем сражаться, пока они не сдадутся безоговорочно!"

 ge.261.t: "Предложить миру Советы?"
 ge.261.d: "Мы получаем сообщения с поля боя о том, что мы победим в Северной Кавказии и что в настоящее время мы контролируем все наши заявленные земли, и теперь мы можем предложить мир, который обеспечит наш контроль над этими районами."
 ge.261.a: "Очень хорошо, нет необходимости в большем кровопролитии, чем необходимо."
 ge.261.b: "Мы также должны потребовать другие требования, пока мы здесь, и ждать, пока они тоже примут эти требования."

 ge.262.t: "Предложить миру Советы?"
 ge.262.d: "Мы получаем сообщения с поля боя о том, что мы побеждаем в войне против Советского Союза, и в настоящее время мы контролируем все наши земли, включая Краснодар и Крыму, и можем предложить мир, который обеспечит наш контроль над этими регионами."
 ge.262.a: "Очень хорошо, нет необходимости в большем кровопролитии, чем необходимо."
 ge.262.b: "Мы не перестанем сражаться, пока они не сдадутся безоговорочно!"

 ge.263.t: "Грузины предлагают мир!"
 ge.263.d: "Мы смеялись над грузинами, когда они нажимали на нас свои нелепые притязания, но кажется, что они смеялись в последний раз."
 ge.263.a: "У нас нет выбора..."
 ge.263.b: "Неужели мы действительно думаем сдаться этим Чвенебури?"
 ge.263.c: "Грузины не знают своего места!"

 ge.264.t: "Наше мирное предложение не было принято!"
 ge.264.d: "Мы надеялись, что враг поймет, что мы выиграли эту войну, но так не повезло."
 ge.264.a: "Их потеря!"

 ge.900.t: "Прибыли грузинские добровольцы"
 ge.900.d: "Мы были очень рады услышать, что прибыло первое отделение грузинских добровольцев нашей армии, которые будут интегрированы в советскую армию и будут служить на одном из фронтов."
 ge.900.a: "Это показывает силу нашего "дружества""

 ge.910.t: "Грузия хочет присоединиться к нашему альянсу"
 ge.910.d: "Джорджия хочет присоединиться к нашему альянсу, они чувствуют, что не могут сидеть, пока мир покоряется врагами человечества, и после того, как мы дали им гарантию, они думают, что мы их ближайшие союзники."
 ge.910.a: "Пусть присоединятся!"
 ge.910.b: "Они будут только бременем."

 ge.911.t: "Франция не хочет, чтобы мы были в их альянсе!"
 ge.911.d: "Мы надеялись, что французы поймут, что мы хотим им помочь, к сожалению, они не хотели, чтобы мы были в их союзе."
 ge.911.a: "Их потеря!"

 ge.920.t: "Грузия хочет присоединиться к нашему альянсу"
 ge.920.d: "Джорджия хочет присоединиться к нашему альянсу, они думают, что не могут сидеть, пока мир может быть завоеван врагами человечества, и после того, как мы дали им гарантию, они думают, что мы их ближайшие союзники."
 ge.920.a: "Пусть присоединятся!"
 ge.920.b: "Они будут только бременем."

 ge.921.t: "Британия не хочет, чтобы мы были в их альянсе!"
 ge.921.d: "Мы надеялись, что британцы поймут, что мы хотим им помочь, к сожалению, они не хотели, чтобы мы были в их союзе."
 ge.921.a: "Их потеря!"

 ge.950.t: "Грузия просит, чтобы мы присоединились к их альянсу"
 ge.950.d: "Грузия хочет, чтобы мы присоединились к их альянсу, ради нашей взаимной защиты."
 ge.950.a: "Это будет взаимно выгодно."
 ge.950.b: "Мы предпочитаем контролировать свою судьбу."

 ge.951.t: "Не присоединился к нашему Союзу."
 ge.951.d: "Мы предложили присоединиться к нашему альянсу, и мы были настолько дружелюбны, насколько это возможно, но они до сих пор не приняли его."
 ge.951.a: "Какая жалость."

 ge.10000.t: "Ekvtime открывает выставку нового музея"
 ge.10000.d: "Эквтим Такаишвили, наш самый известный профессор истории в Тбилисском государственном университете, был польщен открытием новой выставки в грузинском музее в Тбилиси. Выставка была посвящена документам, которые были в Транскавказском архиве царской эпохи, среди которых были некоторые интересные выводы о масштабах проникновения Охраны в грузинские большевики, что, как представляется, ставит много нынешних грузинских большевиков в плохое положение."
 ge.10000.a: "Мы обязательно проверим это!"

 ge.10001.t: "Строительство Центрального стадиона Тбилиси завершено"
 ge.10001.d: "Тысячи футбольных фанатов радуются тому, что Тбилисский центральный стадион открыт для публики. Хотя за последние десять лет было создано много футбольных команд, часто связанных с различными профсоюзами и кооперативами, у них не было места, где можно было бы конкурировать. Но не больше! Новый стадион, несомненно, устраивает любой футбольный матч!"
 ge.10001.a: "Надеюсь, футбольные команды смогут заставить нас гордиться!"

 ge.10002.t: "Chiaureli Release Arsen"
 ge.10002.d: "Сегодня в грузинских кинотеатрах появилась новая картина: известный кинорежиссёр Михейл Чиаурели — новый фильм Арсена о грузинском солдате, который возвращается из царской армии и замечает угнетение грузинских крепостей российскими дворянами, он организует восстание против русских и вместе с грузинами из всех классов, которые идут добровольцем восстания, расширяется и становится большим восстанием. К сожалению, русские проникают в восстание агентами, которые поощряют грузин сдаться русским, и голосуют за согласие на мирное соглашение с русскими. Арсен оставляет группу со своей любовью Нено. / / // В последней сцене показываются результаты капитуляции. Арсен возвращается в ранее угнетенные деревни и находит только сгоревшие руины."
 ge.10002.a: "Этот фильм показывает, что русским нельзя доверять."
 ge.10002.b: "Это лишь показывает, что националистическая пропаганда ниже социалистической."

 ge.10003.t: "Чиаурели выпускает Великий рассвет"
 ge.10003.d: "Шиаурели поражает нас другой фотографией. На этот раз фильм является сатирическим шагом на октябрьскую революцию. Он показывает, как Меншевик, который был заперт до февральской революции, видит отчаяние людей во Великой войне и слушает речь Владимира Ленина о том, как Социал-демократическая партия принесет спасение, когда она придет к власти. Взволнованный речью, он вступает в большевиковскую фракцию, а затем зачисляется в Красную Армию. Нннэн фильм показывает, как он путешествовал на разные фронты, и как он входит в состав делегации в Иосеб Джугашвили, тогда известной как Джозеф Сталин, чтобы остановить серьезные нарушения прав человека, которые они вынуждены делать. / / no Unnntwantly для них, он запирает всю делегацию в той же тюрьме, в которой он был заперт до и после суда, на котором присутствовал Сталин, ему приказано бежать из тюрьмы, только чтобы встретиться с одним из людей, которых он видел в отчь, когда он был выпущен из той тюрьмы. Человек говорит ему о том, что он сейчас о том, что он забыл о том, что его едеть из деревни, и что он видел, что он был о том, что он видел, что он о том, что он о том, что он о том, и о том, что о том, что он о том, что он о том, что он о том, что он вещает, что он творился, что он творился, он о том, что он творился из тюрьмы, и что он о том, что он о том, что он ."
 ge.10003.a: "Это отрезвляющее напоминание о вероломной природе Советов."
 ge.10003.b: "Почему националистическая пропаганда всегда такая плохая?"
 ge.10003.c: "Мы поговорим с этим директором."

 ge.10004.t: "Грузия присоединилась к Советскому Союзу"
 ge.10004.d: "После советского вторжения в Грузию это казалось неизбежным. Временное народное правительство Грузии решило преобразовать Грузию в Советскую Советскую Социалистическую Республику Грузии и подписало все соответствующие договоры, которые официально примыкают к Грузинской ССР и Советскому Союзу."
 ge.10004.a: "Разве Джорджия не часть Америки?"
 ge.10004.b: "Наконец-то мы воссоединились!"
 ge.10004.c: "Мы приветствуем наших грузинских братьев в Союзе!"

 ge.10005.t: "Герцель Баазов публикует вторую часть своей трилогии "Петхайни"!"
 ge.10005.d: "Герзель Баазов, известный грузинский еврейский поэт, писатель и драматург, опубликовал вторую книгу своей планируемой трилогии книг, описывающих жизнь грузинских евреев. Первая книга в трилогии была встречена с большим одобрением и получила высокую оценку за то, что в некоторых случаях она аккуратно описывает повседневную жизнь обычных грузинских евреев в покойной Российской империи. Вторая часть посвящена жизни в демократической Грузии, идеологическому конфликту между сионистскими, несовпадающими сионистами и радикальными революционерами. Хотя Герцель не связана ни с одной из партий (он является сионистом), некоторые обнаружили в ней критику правительства за ограничение сионистской деятельности, в то время как другие говорят, что эта книга действительно является критикой еврейских радикалов за предательство традиции. Герцель заявил, что ни одна из них не является правдой, поскольку книга лишь пытается описать еврейскую жизнь, а не критиковать ее."
 ge.10005.a: "Мы гордимся тем, что у нас есть такой талантливый писатель!"
