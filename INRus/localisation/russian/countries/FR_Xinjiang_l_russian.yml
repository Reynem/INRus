 SIK_panicked_isolationism: "Запаникованный изоляционизм n §gEver со времен Северной экспедиции и продолжения немецкого вмешательства, Ян Цзенгсин был сильно запаникован и болен со старостью. В течение большей части своего времени, скрывавшегося в своем доме, он едва ли уйдет из-за боязни убийства или пойма своей последней роковой болезни. Помимо того, что он остается полностью изолированным по политическим причинам в Китае, люди не знают, как долго он продержится в своем нынешнем состоянии, но он определенно не в стабильном состоянии.§!"
