### DESCRIPTION ###
SIK_FUHRERREICH_DESC: "В последнее время Синьцзянская клика находится в особенно тяжелом положении, Восточная Туркестанская Республика триумфально на Западе и Кумул-ханате на востоке, оставшаяся часть Клики Синьцзян сильно ослаблена этими неудачами и сплотилась вокруг героя войны Ма Шаову. Клика Синьцзян сидит в опасном положении и нуждается в большой удаче, чтобы выжить в ее нынешнем виде."

### EVENTS ###
sik.0.t: "Жили бросили нас."
sik.0.d: "После смерти президента Яна Гуйцинга беспорядки, которые вспыхнули в Шанхае, превратились в полный бунт в провинции против коррумпированных и ленивых Жили, которые контролировали правительство Бейянга с момента его создания. Поскольку их власть рухнула и Китай вступает в период враждующего государства, столь далеко идущего региона, как наш собственный, больше нет, и защита, которую мы предоставляем, исчезла. Мы уже потеряли значительную территорию для Восточного Туркестана, который успешно восстал против нас после трусливого полета Джина Шурена из Клики, и все более скверный Кумула Ханате заявил о своей содружественности от нас военными средствами, оставив нас в исключительно неблагоприятном положении. Если мы хотим сохранить стабильность, мы должны действовать легко в будущих событиях и конфликтах, возможно, даже сдаться больше территории, чтобы обеспечить нам выживание, чтобы сражаться в другой день."
sik.0.a: "Мы выживем."
