 ####Equipment Bullshit####
 RHI_infantry_equipment_3: "Штурмгеур-44R"
 RHI_infantry_equipment_3_short: "Штурмгеур-44R"
 RHI_infantry_equipment_3_desc: "Винтовка Sturmgeweear 44R () — рулонная винтовка, разработанная на основе новшеств, найденных в MP-40. Винтовка заперта для патрона калибра 7,92×33 мм. Эта короткая версия Rhenish Standard (7,92×57 мм) винтовки в сочетании с селективным огневым дизайном оружия обеспечивает компромисс между контролируемой огневой мощью автомата в ближних помещениях с точностью и мощностью автомата Karabiner 98k."
 RHI_infantry_equipment_2: "Машиненпистоле-40R"
 RHI_infantry_equipment_2_short: "MP-40R"
 RHI_infantry_equipment_2_desc: "Macchinenpistole 40 был автоматом с патроном 9×19мм, изначально разработанным в Германии, революционный новый пистолет был скопирован на ручной фабрике Rhenish, производившей Macchinenpistole 40R, модифицированную бытовую винтовку аналогичной марки и модели."
 RHI_infantry_equipment_1: "Карбанье 98k Курц"
 RHI_infantry_equipment_1_short: "Карбанье 98k"
 RHI_infantry_equipment_1_desc: "Karabiner 98 kurz — винтовка, выпущенная в 1935 году как стандартная служебная винтовка немецкой армии, винтовки Karabiner 98k были незаконно ввезены в Рейн камерами Valkist, в то время как ограниченные местные фабрики Mauser с радостью производят винтовку для любого местного правительства." 
 RHI_infantry_equipment_0: "Гевер 98"
 RHI_infantry_equipment_0_short: "Гевер 98"
 RHI_infantry_equipment_0_desc: "Gewehr 98 — немецкий винтовка, выпущенная из пятикамерного внутреннего клипового журнала, с помощью стриптизёрши, погруженной с мощной патроном 7,92×57-мм кисти Маузера, которая успешно объединила и усовершенствовала различные инженерные концепции болтов и заменила ранее Gewehr 1888 винтовку как германскую служебную винтовку, впервые увидела боевые действия в боксере, и была главной немецкой пехотной винтовкой первой мировой войны. Гевер 98, как правило, является старым излишним оружием среди населения Рениша."
 RHI_infantry_at: "Панцерфауст 30"
 RHI_infantry_at_desc: "Панцерфауст (немецкий:"armor fist" or "tank fist") is an inexpensive, single shot, recoilless anti-tank weapon. It consists of a small, disposable pre-loaded launch tube firing a high-explosive anti-tank warhead, and was intended to be operated by a single soldier. The Panzerfaust's direct ancestor was the similar, smaller-warhead Faustpatrone ordnance device."
 RHI_infantry_at2: "Ракетенпанцербюче"
 RHI_infantry_at2_short: "Панцершрек"
 RHI_infantry_at2_desc: "Панцершрек (немецкий язык)"tank fright", "tank's fright" or "tank's bane") was the popular name for the Raketenpanzerbüchse (abbreviated to RPzB), an 88 mm calibre reusable anti-tank rocket launcher.The Panzerschreck was designed as a lightweight infantry anti-tank weapon, and is based largely on the American Bazooka design."
 RHI_support_weapons: "MG 08 & 7,58 см Миненверфер"
 RHI_support_weapons_desc: "Maschinengewehr 08 был стандартным пулеметом германской армии во время Первой мировой войны и представляет собой приспособление оригинального пистолета Giram S. Maxim 1884 Maxim. Пистолет использовал 250 круговых поясов калибра 7,92×57 мм и мог стрелять от 500 до 600 патронов в минуту."
 RHI_support_weapons2: "MG 34 и 5 см Гранатверфер 36"
 RHI_support_weapons2_desc: "Универсальный Машиненгевер 34 был помещен в камеру для винтовки Маузера с полной мощностью 7,92×57 мм. Его комбинация исключительной мобильности – достаточно легкой для того, чтобы перевозить один человек – и высокая скорость огня (до 900 выстрелов в минуту) не сравнится. nn 5 см лейхтер Гранатверфер 36 (5 см leGrW 36) был легким минометом, созданным для поражения карманов сопротивления за пределами ручной гранаты."
 RHI_support_weapons3: "MG 42 и 8 см Гранатверфер 34"
 RHI_support_weapons3_desc: "MG 42 представляет собой пулемет общего назначения 7,92×57 мм Mauser, предназначенный для малозатратного и легкого изготовления, MG 42 оказался высоконадежным и простым для функционирования. Наиболее примечательным является его очень высокая циклическая скорость для оружия с использованием кассет общего питания, в среднем около 1200 патронов в минуту. ~ 8 см Granatwerfer 34 (8 см GrW 34) был стандартным пехотным минометом, отмеченным с точки зрения его точности и скорости стрельбы."
 RHI_support_weapons4: "MG 45 и 12 см Гранатверфер 42"
 RHI_support_weapons4_desc: "MG 45 — модернизированная версия MG42, но отличающаяся от ее предшественника в том, что она не полностью закрыла замок перед выстрелом, увеличивая скорость огня и упрощая его строительство."
 RHI_motorized_rocket_equipment_1: "Sd.Kfz. 251 mit Wurfrahmen 40"
 RHI_motorized_rocket_equipment_1_short: "Вурфрахман 40"
 RHI_motorized_equipment_1: "Мерседес L3000"
 RHI_motorized_equipment_1_desc: "Mercedes-Benz L3000 — полноприводной трехтонный привод задней оси, работающий при помощи дизельного двигателя Daimler-Benz OM 65/4 74 Hp 4-цилиндрового типа."
 RHI_mechanized_equipment_1: "Sonderkraftfahrzeug 11"
 RHI_mechanized_equipment_1_short: "Sd.Kfz. 11"
 RHI_mechanized_equipment_1_desc: "Sd.Kfz. 11 (Sonderkraftfahrzeug — специальная моторная машина) — немецкий полупутешественник, широко применявшийся во время Второй мировой войны."
 RHI_mechanized_equipment_2: "Sonderkraftfahrzeug 251"
 RHI_mechanized_equipment_2_short: "Sd.Kfz. 251"
 RHI_mechanized_equipment_2_desc: "Sd.Kfz 251 — бронебойный боевой автомобиль, разработанный и построенный компанией «Ханамаг» во время Второй мировой войны на основе своего старого автомобиля Sd.Kfz 11."
 RHI_mechanized_equipment_3: "Sonderkraftfahrzeug 251/20"
 RHI_mechanized_equipment_3_short: "251/20 Sd.Kfz."
 RHI_mechanized_equipment_3_desc: "Обновленная версия Sd.Kfz 251 с инфракрасным прожектором."
 RHI_anti_tank_equipment_1: "3,7 см ПаК 36"
 RHI_anti_tank_equipment_1_short: "3,7 см ПаК 36"
 RHI_anti_tank_equipment_1_desc: "Pak 36 (Panzerabwehrkanone 36) — немецкий противотанковый пистолет калибр в 3,7 см, разработанный в 1933 году компанией Rheinmetall, который впервые был выдан германской армии в 1936 году, где модели стали доступны как на Рейне, так и за рубежом благодаря немецкому влиянию и компании Rheinmetall."
 RHI_anti_tank_equipment_2: "7,5 см ПаК 40"
 RHI_anti_tank_equipment_2_desc: "Pak 40 (75 см Панзерабвехранон 40) — немецкий 75-миллиметровый противотанковый пистолет, разработанный в 1939-1941 годах компанией Rheinmetall. Пак 40 был гораздо тяжелее, чем Пак 38 ; его снижение мобильности означало, что без артиллерийского трактора на болотистой земле было трудно или даже невозможно передвигаться без артиллерийского трактора, однако его бóльшая огневая мощь означает, что он способен прожигать почти все современные модели танков."
 RHI_anti_tank_equipment_3: "12,8 см ПаК 44"
 RHI_anti_tank_equipment_3_desc: "В качестве тяжёлого противотанкового пистолета использовались 12,8 см Pak 44 L/55 (Pak, (Ger.) Panzerabwehrkanone). Первоначально разработка была сосредоточена на полевом пистолете, известном как Kanone K 44, однако после того, как стали появляться более тяжелые бронежилеты, требования к конструкции были изменены, с тем чтобы включить в них противотанковую функцию. Pak 44 имел короткие и средние характеристики, аналогичные 8,8 см Pak 43, однако 12,8 см Pak 44 лучше сохранили свои противотанковые характеристики на протяжении длительного периода времени до крайних дальностей (1800—2700+ метров), одновременно удваивая их в качестве эффективного полевого оружия при выстреле HE."
 RHI_anti_air_equipment_1: "2 см Флаг 30"
 RHI_anti_air_equipment_1_short: "2 см Флаг 30"
 RHI_anti_air_equipment_1_desc: "Flak 30 (Flugabwehrkanone 30) является основным противовоздушным оружием Германии. Оригинальный проект Flak 30 был разработан из Solothurn ST-5 в качестве проекта для Kriegsmarine, который произвел 20-миллиметровый C/30. Rheinmetall затем приступил к адаптации C/30 для использования в армии, производя 2 см Flak 30. В целом, как и C/30, основными областями развития была гора, которая была достаточно компактной. Настройку можно было выполнить, сбросив пистолет на землю с двухколесных вагонов и выровнив его ручными штанами. В результате этого была треугольная база, позволившая стрелять во всех направлениях."
 RHI_anti_air_equipment_2: "2 см Площадь 38"
 RHI_anti_air_equipment_2_desc: "Flackvierling 38 объединила четыре Flak 38 автоканнона в одну карету и действует как усовершенствованная и модернизированная модель Flak 30."
 RHI_anti_air_equipment_3: "8,8 см Площадь 41"
 RHI_anti_air_equipment_3_desc: "8,8 см Flak 41 — немецкий зенитный и противотанковый артиллерийский пистолет калибра 88 мм."aircraft-defense cannon", the original purpose of the weapon. The versatile carriage allowed the 8.8 cm FlaK to be fired in a limited anti-tank mode when still on its wheels; it could be completely emplaced in only two and a half minutes. Based on Krupp designs, Rheinmetall created a more powerful anti-aircraft gun, the 8.8 cm Flak 41."
 RHI_artillery_equipment_1: "10,5 см Лейхте Фельдаубице 18"
 RHI_artillery_equipment_1_short: "10,5 см LeFH 18"
 RHI_artillery_equipment_1_desc: "10,5 см leFH 18 (немецкий: лейхте Фельдаубице)"light field howitzer") was a German light howitzer. Designed in the late 1920s, it represented a major advance on its predecessor the 10.5 cm leFH 16. It was superior in caliber to its early opponents in the war, with adequate range and firepower, but the modern split trail gun carriage that provided it with more stability and traverse also rendered it too heavy for a mobile role in the largely horse-drawn artillery battalions of the German army, particularly in the mud and snow."
 RHI_artillery_equipment_2: "15 см SFH 18"
 RHI_artillery_equipment_2_desc: "15 см schre Feldhaubitze 18 или SFH 18 (немецкий:"heavy field howitzer, model 18"), nicknamed Immergrün ("Evergreen"), was the basic German division-level heavy howitzer. Its mobility and firing range and the effectiveness of its 44 kilogram shell made it the most important weapon of all German infantry divisions. The sFH 18 was twice as heavy as its predecessor, had a muzzle velocity increase of forty percent, a maximum firing range 4.5 kilometers greater, and a new split-trail gun carriage that increased the firing traverse twelvefold. It was the first artillery weapon equipped with rocket-assisted ammunition to increase range. "
 RHI_artillery_equipment_3: "Фельдаубице 43"
 RHI_artillery_equipment_3_desc: "Конструкции leFH 43 являются результатом военного опыта вермахта вплоть до этого момента с точки зрения тактических и технических требований. Таким образом, помимо большого диапазона стрельба в группах с верхним углом, т.е. с перебоями более чем на 45 градусов, стала возможной. Кроме того, для противотанковой обороны и адаптации к все более мобильному характеру войны потребовалась возможность проведения пожаротушения в целом. С учетом этих жестких требований, конечно, имелась масса оружия, его сокращение по-прежнему происходило в 10,5-дюймовом легком поле гаубица 42 градуса первого места пришлось сократить."
 RHI_rocket_artillery_equipment_1: "28/32 см Небелверфер 41"
 RHI_rocket_artillery_equipment_1_desc: "28/32 см Nebelwerfer 41 (28/32 см НбВ 41) — шестиствольная ракета, установленная на двухколесной тележке, с двумя различными ракетами. Ворфкёрпер спренг (взрывчатая ракета) весила 82 килограмма и имела 50 килограммов боеголовки с высоким взрывом. Вурфкёрпер фламм (зажигательная ракета) была заполнена зажигательным маслом ( Фламмёль ), однако она могла перевозить ядовитые газы или обеззаражающие жидкости. Нефть могла покрыть 200 кв. метров. Обе ракеты были повернуты и сработали. Ракеты были выпущены в одно время, но ракета не имела возможности выпускать ни одной ракеты."
 RHI_rocket_artillery_equipment_2: "21 см Nebelwerfer 42"
 RHI_rocket_artillery_equipment_2_desc: "21 см Nebelwerfer 42 (21 см NbW 42) — пятиствольная многоствольная ракетная пусковая установка, установленная на буксируемой тележке, построенная из противотанкового пистолета калибра 3,7 см PaK 36."
 RHI_modern_tank_destroyer_equipment_1: "E-25 Стандартный патрубок"
 RHI_modern_tank_destroyer_equipment_1_short: "E-25"
 RHI_modern_tank_destroyer_equipment_1_desc: "Обновленная версия JadgPanzer IV, E-25 быстрее и лучше бронируется"
 RHI_modern_tank_equipment_1: "NS-1 "Blutrache""
 RHI_modern_tank_equipment_1_short: "Блутраш"
 RHI_modern_tank_equipment_1_desc: "Она была разработана в 1945 году как часть Neue Serie, или NS, в результате попыток Германии создать современный Танк, который в то же время был дешевым и легко производить с акцентом на многие части, взаимозаменяемые с другими вариантами NS Tanks. Она должна была быть вооружена новым 90-миллиметровым пистолетом и иметь все технические новшества, которые немецкие инженеры могли вложить в нее, такие как инфракрасные прожекторы и полностью электрическая траверса."
 RHI_medium_tank_aa_equipment_1: "Флакпанцер III Мёбельваген"
 RHI_medium_tank_aa_equipment_1_short: "Мёбельваген"
 RHI_medium_tank_aa_equipment_1_desc: "Ник по имени Мёбельваген (Furniture Van) из-за своей коробочной турниры, когда она была закрыта, это был самоходный зенитный пистолет, построенный из шасси танка Panzer III и вооруженный 20-миллиметровым квадровым ружьем."
 RHI_medium_tank_aa_equipment_2: "Флакпанзер IV Острый ветром"
 RHI_medium_tank_aa_equipment_2_short: "Острый ветер"
 RHI_medium_tank_aa_equipment_2_desc: "Flackpanzer IV "Ostwind" (немецкий: "East Wind") был самоходным зенитным пистолетом, основанным на танке Panzer IV. Он был разработан в 1944 году в качестве преемника ранее Flackpanzer IV. Турнир Panzer IV был снят и заменен открытой шестиугольной турнирной трубой, в которой находилось 3,7 см FlaK 43. Конструкция закрытого верха была бы более предпочтительной, но это было невозможно из-за сильного дыма, возникшего из этого оружия."
 RHI_medium_tank_aa_equipment_3: "Флакпанцер Коэлян"
 RHI_medium_tank_aa_equipment_3_short: "Куэльцы"
 RHI_medium_tank_aa_equipment_3_desc: "Флакпанзер Коелиан был самоходным зенитным проектировщиком Рейнметалла во время Второй мировой войны для вооруженных сил Германии. Он должен был быть вооружен 2 3,7 см пистолетом FlaK 43 в полностью закрытой вращающейся башне на корпусе средней танки Зигфрида, но не был построен до окончания войны в Европе."
 RHI_medium_tank_destroyer_equipment_1: "Штурмгешц III"
 RHI_medium_tank_destroyer_equipment_1_short: "Стюг III"
 RHI_medium_tank_destroyer_equipment_1_desc: "Штурмгешютц III был самым бронебойным боевым автомобилем Германии во время Второй мировой войны. Он был построен на шасси испытанного танка Panzer III. Первоначально задуманного как мобильный, бронированный лёгкий пистолет для пехоты, StuG постоянно модифицировался и широко использовался в качестве уничтожителя танков."
 RHI_medium_tank_destroyer_equipment_2: "Ягдпанцер IV"
 RHI_medium_tank_destroyer_equipment_2_short: "JagdPz IV"
 RHI_medium_tank_destroyer_equipment_2_desc: "Ягдпанзер IV служил в противотанковых секциях Панцера и СС Панзера. Они сражались в Нормандии, в битве при Бульге и на восточном фронте. Они были очень успешными уничтожителями танков, но плохо сработали, когда они использовались в качестве заменителей танков или штурмовых пушек, как это было в большинстве случаев. Однако на более поздних этапах войны они все чаще использовались в качестве заменителей танков, поскольку зачастую не было никаких других средств."
 RHI_medium_tank_destroyer_equipment_3: "Грампанцер"
 RHI_medium_tank_destroyer_equipment_3_short: "Грампанцер"
 RHI_medium_tank_destroyer_equipment_3_desc: "Грэмпанзер (названный в честь легендарного меча Сигфрида из Норсской мифологии) был эсминецом-танкером, построенным Валькистской Германией во время Второй Великой войны на шасси танка «Зигфрид». Он вошёл в эксплуатацию в конце войны (1944 год) и посмотрел на восточном и западном фронтах. «Грэмпанцер» объединил очень мощную 8,8 см пушка «ПаК 43» нотунга и характерно отличные бронежилеты и подвеску шасси «Зигфрид», хотя он пострадал от общего плохого состояния Германии в конце войны, что привело к небольшому количеству производства, нехватке запасных частей и плохой подготовке экипажей."
 RHI_medium_tank_artillery_equipment_1: "Гриль"
 RHI_medium_tank_artillery_equipment_1_short: "Гриль"
 RHI_medium_tank_artillery_equipment_1_desc: "Sd.Kfz. 138/1 Grille (немецкий: "Cricket") — самопровозглашенная артиллерийская кухня, которая использовалась Германией во время Второй мировой войны. Было произведено около 490-500 гриль. Они использовались панзерными дивизиями в Советском Союзе вместе с подразделениями в Польше и Франции. Они использовались до 1945 года, а также служили в Тунисе, где они сражались с вражескими артиллериями и танками."
 RHI_medium_tank_artillery_equipment_2: "Список"
 RHI_medium_tank_artillery_equipment_2_short: "Список"
 RHI_medium_tank_artillery_equipment_2_desc: "Список (немецкий: "Cunning") был самоходным артиллерийским оружием, основанным на шасси Geschützwagen III/IV, вооружённым 15 см гаубицей. Он использовался немецкой Вермахтой во время Второй мировой войны с начала 1943 года до окончания войны."
 RHI_medium_tank_artillery_equipment_3: "Тюкке"
 RHI_medium_tank_artillery_equipment_3_short: "Тюкке"
 RHI_medium_tank_artillery_equipment_3_desc: "Самоходные артиллерийские пушки, предложенные Круппом в 1944 году на основе компонентов Зигфрида с 12,8 см гаубицы."
 RHI_medium_tank_equipment_3: "Панзеркампфваген V "Сигфрид""
 RHI_medium_tank_equipment_3_short: "Зигфрид"
 RHI_medium_tank_equipment_3_desc: "Зигфрид является прозвищем Панзеркампфвагена V, который широко использовался в германской армии после разработки в 1942 году. Он был основан на опыте немецкой армии в России с T-34 и был построен в нарушение этого, а также в качестве замены устаревшего Панзера III и Панзера IV. Его прекрасное сочетание огневой мощи, защиты и мобильности сделало его контрольным показателем для других национальных танков. Зигфрид стал известен как один из лучших танков второй Великой Войны."
 RHI_medium_tank_equipment_2: "Панзеркампфваген IV"
 RHI_medium_tank_equipment_2_short: "Панцер IV"
 RHI_medium_tank_equipment_2_desc: "Созданный как танк пехоты, Panzer IV изначально не предназначался для использования вражеских доспехов - эта функция выполнялась более легким Панзером III. Однако, поскольку стали очевидными недостатки довоенной доктрины и перед лицом советских танков T-34, Panzer IV вскоре взял на себя роль по борьбе с танками своего все более устаревшего двоюродного брата. Самый широко изготовленный и развернутый немецкий танк второй мировой войны, Panzer IV использовался в качестве базы для многих других боевых машин."
 RHI_medium_tank_equipment_1: "Панзеркампфваген III"
 RHI_medium_tank_equipment_1_short: "Панцер III"
 RHI_medium_tank_equipment_1_desc: "Еще в 1934/35 году генерал Хайнц Гудериан предусмотрел два основных вида оборудования для будущих немецких Панзерных дивизий. Первый автомобиль должен был быть вооружен противотанковым и двумя пулеметами, а второй — вспомогательным автомобилем с более крупным калибром. Первый в конечном итоге стал известен как Панзеркампфваген III, который должен был стать стандартным танком для трех легких рот танкового батальона. Второй был известен как Панзеркампфваген IV."
 RHI_light_tank_aa_equipment_1: "Флакпанцер I"
 RHI_light_tank_aa_equipment_1_short: "Флакпц I"
 RHI_light_tank_aa_equipment_1_desc: "Противовоздушная пушка, установленная на шасси танка &quot; Панцер I &quot; ."
 RHI_light_tank_aa_equipment_2: "Флакпанзер Лучс"
 RHI_light_tank_aa_equipment_2_short: "Флакпц Лукс"
 RHI_light_tank_aa_equipment_2_desc: "Противовоздушная пушка, установленная на шасси танка &quot; Панцер II &quot; ."
 RHI_light_tank_aa_equipment_3: "Флакпанцер 1602"
 RHI_light_tank_aa_equipment_3_short: "FlackPz 1602"
 RHI_light_tank_aa_equipment_3_desc: "Противовоздушная пушка, установленная на шасси цистерны VK1602."
 RHI_light_tank_destroyer_equipment_1: "Пэнзер I"
 RHI_light_tank_destroyer_equipment_1_short: "Pzjager I"
 RHI_light_tank_destroyer_equipment_1_desc: "Panzerjäger I (немецкий охотник на танки 1) был первым немецким уничтожителем танков во время Второй мировой войны, который установил чешский противотанковый пистолет Skoda 47-мм ПАК на переоборудованном шасси Panzer I Ausf."
 RHI_light_tank_destroyer_equipment_2: "7,5 см PaK 40 auf Fahrgestell Marder II"
 RHI_light_tank_destroyer_equipment_2_short: "Мардер II"
 RHI_light_tank_destroyer_equipment_2_desc: "Мардер II — немецкий уничтожитель танков, основанный на шасси Panzer II."
 RHI_light_tank_destroyer_equipment_3: "Штурмгешчуец ауф Леопард"
 RHI_light_tank_destroyer_equipment_3_short: "ЯгдЛеопард"
 RHI_light_tank_destroyer_equipment_3_desc: "JagdLeopard стала возможной модификацией планируемого легкого танка VK1602 Leopard."
 RHI_light_tank_artillery_equipment_1: "Стурмпанцер I Бисон"
 RHI_light_tank_artillery_equipment_1_short: "Бизон"
 RHI_light_tank_artillery_equipment_1_desc: "Самое простое решение состоит в том, чтобы модифицировать запасной танк для его доставки в бою."
 RHI_light_tank_artillery_equipment_2: "Sd. Kfz. 124 Wesspe"
 RHI_light_tank_artillery_equipment_2_short: "Уэсп"
 RHI_light_tank_artillery_equipment_2_desc: "Sd.Kfz 124 Wespe () — немецкий самоходный артиллерийский автомобиль, основанный на модифицированном шасси Panzer II."
 RHI_light_tank_artillery_equipment_3: "Ваффентрагер Леопард"
 RHI_light_tank_artillery_equipment_3_short: "WT Leopard"
 RHI_light_tank_artillery_equipment_3_desc: "Vaffentrager Leopard — самоходная артиллерийская машина, основанная на запланированном шасси VK1602 Leopard."
 RHI_light_tank_equipment_3: "Panzeraufklärer Zecke"
 RHI_light_tank_equipment_3_short: "Зекке"
 RHI_light_tank_equipment_3_desc: "VK 1337 Zecke — легкий танк, разработанный в 1942 году после более широкого использования панцергренадиеров в немецкой армии, когда ОКВ обнаружила необходимость введения быстрого и легкого разведывательных машин для поддержки панцергренадиеров, в результате чего Zecke была вооружена 50-ммм пушкой и достигла скорости до 70 КМ/ч."
 RHI_light_tank_equipment_2: "Панзеркампфваген II"
 RHI_light_tank_equipment_2_short: "Панцер II"
 RHI_light_tank_equipment_2_desc: ""Panzer II" изначально была задумана как остановка, в то время как были разработаны более крупные, более совершенные танки, но она стала широко использоваться в бою из-за отсутствия более способных танков."
 RHI_light_tank_equipment_1: "Панзеркампфваген I"
 RHI_light_tank_equipment_1_short: "Панцер I"
 RHI_light_tank_equipment_1_desc: "Panzer I — легкий танк, производимый в Германии в 1930-х годах. Проект Panzer I начался в 1932 году, а массовое производство началось в 1934 году, и только в качестве тренировочного танка, предназначенного для внедрения концепции бронебойной войны в немецкой армии, PzKpfw I широко использовался в бою из-за отсутствия более современных танков."
 RHI_gw_tank_equipment: "Панцерваген A7V"
 RHI_gw_tank_equipment_short: "A7V"
 RHI_gw_tank_equipment_desc: "В 1918 году, во время Великой войны, Германия ввела танк A7V. В начале 1917 года было заказано 100 шасси, 10 из которых должны были быть закончены в качестве боевых машин с бронированными телами, а остальные - в качестве грузовых перевозчиков Уберландвагена. Позднее их число было увеличено до 20, они использовались в бою с марта по октябрь 1918 года и были единственными танками, когда-либо произведенными немецкими кайсереихами."
 RHI_heavy_tank_artillery_equipment_1: "Canon de 194 mle GPF"
 RHI_heavy_tank_artillery_equipment_1_short: "Канон де 194"
 RHI_heavy_tank_equipment_1: "Шар В1"
 RHI_heavy_tank_equipment_1_short: "Шар В1"
 RHI_heavy_tank_equipment_1_desc: "Shar B1 — французский тяжелый танк, спроектированный в межвоенный период и впервые изготовленный в 1935 году. Шар B1 был специализированным автомобилем, первоначально задуманным как самоходный пистолет с 75-миллиметровым гаубицей в корпусе корпуса; позднее в батарею был добавлен 47-миллиметровый пистолет, с тем чтобы он мог также функционировать как Шар де Батай , Шар де Батайль , Шар де Батайль , Шар де Батай ."battle tank"fighting enemy armour, equipping the armoured divisions of the Infantry Arm. Its development and production were repeatedly delayed, resulting in a vehicle that was both technologically complex and expensive, however its formidable armaments made it quite powerful in combat."
 RHI_heavy_tank_equipment_2: "АРЛ 44"
 RHI_heavy_tank_equipment_2_short: "АРЛ 44"
 RHI_heavy_tank_equipment_2_desc: "ARL 44 была попыткой создать новый тяжелый танк, чтобы конкурировать с немецкими моделями."
 RHI_heavy_tank_equipment_3: "AMX-M4"
 RHI_heavy_tank_equipment_3_short: "AMX-M4"
 RHI_heavy_tank_equipment_3_desc: "На основе данных о тяжелой цистерне в Парцивале и достижениях в производстве цистерн во Франции, тяжелая цистерна является французским ответом на немецкую сталь."
 RHI_super_heavy_tank_equipment_1: "FCM-F1"
 RHI_super_heavy_tank_equipment_1_short: "FCM-F1"
 RHI_super_heavy_tank_equipment_1_desc: "FCM F1 был французским супер-бакером, созданным во время последнего "Интербеллума" компанией "Forges et Chantiers de la Méditerranée" и модернизированным на протяжении всей войны. FCM F1 был большим и удлиненным и имел две турниры: одну спереди и одну сзади с одним быстродействующим пистолетом в каждой башне. Задняя башня была выше, так что она могла стрелять над первой. Несмотря на два двигателя, ее скорость была бы низкой, весила 140 тонн. Основная цель этого танка заключалась в том, чтобы пробить немецкие фортификационные линии, не для того чтобы бороться с вражескими танками, а для того, чтобы ее массивные бронежилеты и вооружения могли функционировать в той или иной роли."




