 ###Mil Ideas###
 RHI_S_disarmed: "Ренишное разоружение"
 RHI_S_disarmed_desc: "Рейн не имеет военного командования."
 RHI_S_army_doctrine_dispute: "Доктрина земли в спорах"
 RHI_S_army_doctrine_dispute: "Формирование рейнской армии оставило вопрос о спорной доктрине."
 RHI_S_forced_conscription: "Принудительная воинская обязанность"
 RHI_S_forced_conscription_desc:"Ренишных людей принуждают в армию, что вызывает массовое дезертирство, низкий моральный дух и сабатож."
 RHI_S_french_enlistment: "Французский список"
 RHI_S_french_enlistment_desc: "В армию допускаются только французские солдаты, большинство из которых родом из самой Франции."
 RHI_S_french_rhenish_union_army: "Объединенная франко-язычная армия"
 RHI_S_french_rhenish_union_army_desc: "В армию допускаются как французские, так и рейнские солдаты."
 RHI_S_french_officers: "Французские офицеры"
 RHI_S_french_officers_desc: "Армию командуют французские офицеры - рейнские люди не могут служить в верхних эшелонах."
 RHI_S_rhenish_officers: "Ренишные офицеры"
 RHI_S_rhenish_officers_desc: "Армия Рениша возглавляется офицерами Рениша, большинство из которых являются ветеранами Великой Войны."
 RHI_S_military_reorganization: "Военная реорганизация"
 RHI_S_military_reorganization_desc: "Создание вооруженных сил с нуля вызвало беспорядки в ряде рядов, и, хотя ветераны WW1 создали основу армии, потребуется некоторое время для создания надежного офицерского ядра."
 RHI_S_rhenish_patriotic_army: "Армия рейнского патриота"
 RHI_S_rhenish_patriotic_army_desc: "Ренишская армия обрела особую национальную гордость и будет бороться за защиту свободы Рейна."
 RHI_S_superior_firepower_1: "Гром Рейна"
 RHI_S_superior_firepower_1_desc: "Ренишские офицеры решили, что лучший способ защитить Рейн - это переполнять огневую мощь."
 RHI_S_superior_firepower_2: "Железные крепости"
 RHI_S_superior_firepower_2_desc: "Рейн защищает лучшая из имеющихся артиллерийских артиллерийских артиллерийских артиллерийских артиллерийских артиллерийских орудий, нападающих на врагов силой тысячи богов."
 RHI_S_defensive_doctrine_1: "Защита Рейна"
 RHI_S_defensive_doctrine_1_desc: "Рейн долго стоял как барьер между французским и немецким народом, и теперь он должен стоять перед их мощью."
 RHI_S_defensive_doctrine_2: "Щит Рейна"
 RHI_S_defensive_doctrine_2_desc: "Ренистская армия не должна ослабевать, равно как и не должна позволить захватчику забрать один метр рейнской земли."
 RHI_S_trench_war_1: "Тренч Война"
 RHI_S_trench_war_1_desc: "Транши Великой войны не должны быть забыты."
 RHI_S_trench_war_2: "Современная статическая война"
 RHI_S_trench_war_2_desc: "Современная война будет определяться большой защитой и большими нападениями - мы должны превзойти и то, и другое."
 RHI_S_blitz_1: "Рейнгард"
 RHI_S_blitz_1_desc: "Ограниченность рабочей силы, но безграничные ресурсы Рейна означают, что мы должны сформировать маленькую элиту Рейнгарда, чтобы защитить французский контроль над Рейном."
 RHI_S_blitz_2: "Массовая механизация"
 RHI_S_blitz_2_desc: "Вся гвардия Рейна должна быть вооружена механизированным оборудованием для обеспечения того, чтобы Рейн мог служить копьем Франции."
 RHI_S_fort_production: "Строительство рейнволла"
 RHI_S_fort_production_desc: "Строительство защитных сооружений по Рейну имеет важное значение для ее защиты."

 ###Air Ideas###
 RHI_S_air_doctrine_dispute: "Доктрина воздушного пространства в спорах"
 RHI_S_air_doctrine_dispute: "Вопрос о том, как создать и использовать военно-воздушные силы, по иронии судьбы, все еще находится в воздухе."
 RHI_S_light_production: "Производство легких воздушных судов"
 RHI_S_light_production_desc: "Авиационная промышленность сосредоточила свои усилия на производстве легковых самолетов."
 RHI_S_heavy_production: "Производство тяжелых воздушных судов"
 RHI_S_heavy_production_desc: "Авиационная промышленность сосредоточила свои усилия на производстве &quot; эффицентных &quot; тяжелых воздушных судов."

 ###Event Ideas###
 RHI_S_rhine_crisis: "Кризис на Рейне"
 RHI_S_rhine_crisis_desc: "Экономическая катастрофа привела Рейн в беспорядок!"
 RHI_S_crisis_recovery: "Реабилитация в кризисных ситуациях на Рейне"
 RHI_S_crisis_recovery_desc: "Рейн начал восстанавливаться, но предстоит пройти долгий путь."
 RHI_S_french_aid: "Французская помощь"
 RHI_S_french_aid_desc: "Французы оказывают экономическую помощь в целях обеспечения безопасности на Рейне."

 #### Focuses ####
 #FT
 RHI_expand_africa: "Расширить La Force Noir"
 RHI_expand_africa_desc: ""
 RHI_FT_gov_oob: "Это маленькая военная сила для Рейн §!"
 RHI_FT_unlocked_mil_tree: "§Возвращает ремилитаризацию и стабилизацию Рейна.§!"
 RHI_FT_crisis: "Рейн останется статичным, если кризис не заставит его действовать."
 RHI_FT_stability_spirit: "Рейн получит полицию на основе предыдущего выбора."

 #Political Focuses
 RHI_watch_on_the_rhine: "Наблюдатели на Рейне"
 RHI_watch_on_the_rhine_desc: "Межсоюзная оккупация Рейна уже давно находится в состоянии мирного застоя, в то время как некоторые радикальные элементы действительно существуют и требуют независимости или автономии, все общество удовлетворено существующим положением."
 RHI_independence_1: "Ренистская конфедерация"
 RHI_independence_1_desc: "Теперь, когда рейнская нация официально независима, мы должны создать свою собственную достаточную администрацию и конституцию."
 RHI_independence_2: "Формализировать фрейкорпы"
 RHI_independence_2_desc: "Так как у нас нет армии, нам нужно использовать то, что у нас есть, мы должны официально использовать Фрейкорпы и весь их персонал в качестве основы для нашей будущей армии, с помощью этих ветеранов мы можем обеспечить безопасность нашей родины."
 RHI_independence_3: "Национальная экономика"
 RHI_independence_3_desc: "Наш министр экономики предложил план RH, который обещает быстрое восстановление экономики."
 RHI_independence_4: "Ренистский национализм"
 RHI_independence_4_desc: "Теперь, когда наш народ существовал достаточно долго, чтобы его считали по-настоящему независимым, нам пора гордиться тем, чего мы достигли за такое малое время."
 RHI_autonomy_1: "Ренистское свободное государство"
 RHI_autonomy_1_desc: "После недавних политических событий французы дали нам большую автономию."
 RHI_autonomy_2: "Легализация Шутцтриппена"
 RHI_autonomy_2_desc: "Рейнича Шутцтруппе в основном была лишь ополчением, которое стояло в тени французских гарнизонов и фрейкорпов, и мы должны использовать этих храбрых и преданных людей в качестве основы для нашей армии."
 RHI_autonomy_3: "Переговоры со Страйкерами"
 RHI_autonomy_3_desc: "Ручка сильнее меча, поговорку, которой мы будем придерживаться в предстоящих переговорах с поражающими рабочими."
 RHI_autonomy_4: "Вместе вперёд!"
 RHI_autonomy_4_desc: "Вместе с нашими французскими друзьями мы достигнем того, чего валькисты в Новом Рейхе не могут."
 RHI_mandate_1: "Военный мандат"
 RHI_mandate_1_desc: "Французы решили назначить военного комиссара, который будет руководить нашей родиной. Будем надеяться, что французы знают, что они делают."
 RHI_mandate_2: "Укрепить Рейн"
 RHI_mandate_2_desc: "Высшее командование Франции приняло решение решительно укрепить Рейнский регион после недавних нападений со стороны Дресслеров Германии."
 RHI_mandate_3: "Военное свертывание"
 RHI_mandate_3_desc: "После того как забастовщики потребовали больше прав и лучшего обращения, французские силы безопасности решили жестоко сломать забастовщиков."
 RHI_mandate_4: "Вернемся к контролю"
 RHI_mandate_4_desc: "Теперь, когда французы полностью восстановили контроль над Рейном, они больше никогда не откажутся от него."
 RHI_valkist_1: "Немецкий рейн"
 RHI_valkist_1_desc: "Лутце взял под свой контроль нашу нацию и обещал обезопасить ее от французских агрессоров и ненавидимых коллективистов."Rheinische Abwehr"."
 RHI_valkist_2: "Valkist Vanguard"
 RHI_valkist_2_desc: "Некоторые части Дресслерского ТСТ прибыли и начали укреплять стратегические позиции вместе с местными вооруженными валькистами, они также начали собирать нежелательные элементы, как они их называют."
 RHI_valkist_3: "Немецкая экономическая помощь"
 RHI_valkist_3_desc: "Дресслер обещал нам экономическое сотрудничество, и он сдержал свое обещание, что-то, чего французы никогда не делали, по крайней мере, теперь мы можем снова процветать, как мощная область Рейха."
 RHI_valkist_4: "Зов Отечества"
 RHI_valkist_4_desc: "Остальная часть славного Рейха нуждается в нашей помощи, чтобы вернуть то, что должно было быть нашим! Мы не обеспокоимся и не потерпим неудач, как во время Великой войны. На этот раз мы станем победителями, а французы лижут наши ботинки."

 #Economic Focuses
 RHI_economic_question: "Экономический вопрос"
 RHI_economic_question_desc: "Несмотря на наше порабощение французов, Рейнленд является одним из наиболее индустриализованных районов во всей Европе, мы можем продолжать политику быстрой индустриализации и обеспечить, чтобы мы оставались одной из ведущих промышленных держав Европы, или мы могли стабилизировать нашу экономику и обеспечить более высокий уровень жизни для нашего народа."
 RHI_economic_stabilization: "Экономическая стабилизация"
 RHI_economic_stabilization_desc: "Если мы хотим быть не только слугой французов, мы должны заявить о себе как о суверенном государстве, способном заботиться о нашем народе без чрезмерной иностранной помощи, мы начнем предоставлять больше рабочих мест для трудящихся нашей страны и начнем расширять рабочую силу."
 RHI_rapid_industrialization: "Быстрая индустриализация"
 RHI_rapid_industrialization_desc: "Мы решили продолжить индустриализацию Рейнской земли и сохранить свою позицию как одной из самых сильных промышленных держав в Европе."
 RHI_develop_west_rhineland: "Развивать Западный Рейнленд"
 RHI_develop_west_rhineland_desc: "Сосредоточение усилий на развитии и без того сильно промышленно развитого района Западного Рейна позволит нам построить больше заводов, чем где-либо еще на Рейне."
 RHI_secret_military_buildup: "Секретное военное строительство"
 RHI_secret_military_buildup_desc: "Разоруженность, навязанная нам французами, обесценила нашу оружейную индустрию."
 RHI_improve_infrastructure: "Дальнейшее совершенствование инфраструктуры"
 RHI_improve_infrastructure_desc: "Инфраструктура вдоль Рейна когда-то была одной из самых впечатляющих во всей Европе. Теперь, когда мы были практически привязаны к Франции, мы потеряли этот статус. Мы должны продолжить старые планы расширения инфраструктуры во всей Рейнленде."
 RHI_develop_east_rhineland: "Развитие Восточного Рейна"
 RHI_develop_east_rhineland_desc: "Хотя мы не должны оставлять нашу индустрию на обочине, сосредоточение внимания на создании новых рабочих мест и деловых возможностей для рабочих в Рейнленде стабилизирует нашу страну и обеспечит нам гораздо больший доход в целом, по сравнению с тем, что мы сосредоточимся исключительно на нашей промышленности."
 RHI_develop_moselland: "Разработать Мозельленд"
 RHI_develop_moselland_desc: "Мы создадим новые заводы и расширим существующие, чтобы привести Мосельленд к нашим стандартам индустриализации."
 RHI_create_refineries: "Построить нефтеперерабатывающие заводы"
 RHI_create_refineries_desc: "Некоторые из наших экономических аналитиков предложили финансировать создание нефтеперерабатывающих заводов для увеличения числа рабочих мест и оказания помощи в других аспектах нашей экономики, таких, как наша автомобильная промышленность."
 RHI_rich_rhine: "Богатый Рейнленд"
 RHI_rich_rhine_desc: "Наше пристальное внимание к улучшению положения на Рейне привлекло некоторое подобие стабильности к нашей стране и увеличило богатство как народа, так и государства. Можно с уверенностью сказать, что Рейнленд экономически стабилен и останется таким на некоторое время."
 RHI_rhenish_economy: "Ренишное экономическое восстановление"
 RHI_rhenish_economy_desc: "Кризис сильно ударил нас, и мы должны начать принимать меры для того, чтобы выйти из этого положения."
 RHI_nationalist_economy: "Националистическая экономика"
 RHI_nationalist_economy_desc: "Мы должны сначала производить для Рейна, наши люди нуждаются в наших товарах больше, чем кто-либо другой."
 RHI_autonomist_economy: "Автономная экономика"
 RHI_autonomist_economy_desc: "Вместе с другими странами мы должны стремиться к широкому европейскому экономическому сотрудничеству."
 RHI_mandate_economy: "Мандат Экономика"
 RHI_mandate_economy_desc: "Французы начали добывать все больше товаров для своего народа."
 RHI_dorten_economy: "Аутарки Дортена"
 RHI_dorten_economy_desc: "Рейн должен быть полностью достаточным, даже в худшие времена."
 RHI_matthes_economy: "Сталь и розы Маттеза"
 RHI_matthes_economy_desc: "Мы должны в полной мере использовать наши природные ресурсы и использовать их для того, чтобы сделать жизнь для всех в нашей стране лучше."
 RHI_konrad_economy: "Сотрудничество Конрада"
 RHI_konrad_economy_desc: "Вместе с крупными французскими корпорациями мы сможем построить свою собственную мощную индустрию с помощью Франции. &quot; Экономическое сотрудничество &quot; станет будущим Рейна."
 RHI_strict_economy: "Добыча Мангина"
 RHI_strict_economy_desc: "Эксплуатация ресурсов Рейнса для использования Францией - это то, от чего мы не можем защититься."
 RHI_total_nationalization: "Общая национализация"
 RHI_total_nationalization_desc: "Единственный выбор, который у нас есть, — это полный контроль над всей экономикой Рейна. Только сделав это, мы сможем обеспечить, чтобы Рейн был сильным."
 RHI_gentle_nationalization: "Частичная национализация"
 RHI_gentle_nationalization_desc: "Национализация крупнейших и наиболее полезных компаний - это наш лучший выбор. Пусть нормальные люди будут иметь свой бизнес, пока мы будем контролировать истинную мощь Рейна."
 RHI_fund_rhenish_industry: "Внутренние инвестиции"
 RHI_fund_rhenish_industry_desc: "Мы должны сначала вложить средства в нашу собственную страну и сделать ее моделью для других стран."
 RHI_corporate_economy: "Корпоративный национализм"
 RHI_corporate_economy_desc: "Страна должна быть на первом месте, никто не может и не сможет изменить это."
 RHI_populist_economy: "Популистское распределение"
 RHI_populist_economy_desc: "Важно сохранять добрую волю населения, после того как мы все станем братьями здесь, на Рейне, мы не позволим наживающимся толстым кошкам удерживать угнетаемых обычных граждан."
 RHI_employment_projects: "Проекты в области занятости"
 RHI_employment_projects_desc: "С помощью программы так называемого Курзарбейта и огромных инвестиций в экономику мы снова сделаем языческую экономику великолепной!"
 RHI_welfare_state: "Программы социального обеспечения"
 RHI_welfare_state_desc: "Часть всего, что наши люди делают на работе, должна пойти на программы социального обеспечения, чтобы даже в плохие времена наши люди не голодали."
 RHI_limited_benefits: "Ограниченные выгоды"
 RHI_limited_benefits_desc: "Даже не в такой степени, как это предлагает министерство экономики, мы будем осуществлять программы по содействию обеспечению социальной безопасности нашего народа."
 RHI_social_economy: "Государство благосостояния"
 RHI_social_economy_desc: "Основываясь на старых программах Рейхсгрендер Отто фон Бисмарк, мы сделаем Рейна лучшим местом для жизни на земле."
 RHI_french_investors: "Приглашать французские инвестиции"
 RHI_french_investors_desc: "Мы сделаем рейнов более привлекательными для владельцев французских компаний, предлагая им выгоды, если они начнут инвестировать в наш регион."
 RHI_increased_economy_independence: "Экономическая независимость"
 RHI_increased_economy_independence_desc: "С помощью наших гениев в "Wirtschafts Managerium" мы начнем делать так, чтобы наша экономика достигла уровня старших дней."
 RHI_french_economy_guidance: "Французское экономическое руководство"
 RHI_french_economy_guidance_desc: "Под руководством французов и их мастерством мы сможем восстановить нашу экономику в ее бывшей Славе."
 RHI_cooperative_econopmy: "Редкое экономическое чудо"
 RHI_cooperative_econopmy_desc: "Мы сделали это! И снова известно, что Рейн и его экономика являются одними из самых сильных на Земле."
 RHI_french_workers: "Приглашать французских рабочих"
 RHI_french_workers_desc: "Мы пригласим французских рабочих работать на фабриках здесь, на Рейне, предлагая им дешёвое жилое пространство и другие блага, которые окажутся в невыгодном положении для рейнского населения, мы сделаем Рейн новой и подлинной французской границей."
 RHI_cooperate_with_rhenish_companies: "Сотрудничество с компаниями Рениш"
 RHI_cooperate_with_rhenish_companies_desc: "Вместе с владельцами ренийской компании мы должны быть в состоянии достичь высокого уровня производительности и эффективности, что также даст нам некоторую популярность среди гражданского населения."
 RHI_sieze_rhenish_companies: "Компания &quot; Sieze Renish Industries &quot;"
 RHI_sieze_rhenish_companies_desc: "Немцы не могут контролировать свою экономику эффективно. Вы видите ее в Дресслере Рейхе, и вы видите ее на Рейне. Мы будем контролировать всю индустрию Рейна и полностью интегрировать ее во французскую экономику."
 RHI_extractive_economy: "Добывающая экономика"
 RHI_extractive_economy_desc: "Используя каждый кусочек рейнских ресурсов, мы позаботимся о том, чтобы все это пошло на пользу славному французскому народу."
 RHI_wide_research: "Диверсификация исследований"
 RHI_wide_research_desc: "Диверсифицируя наши исследования по многим областям, мы можем эффективно оставаться в курсе событий в остальном мире."
 RHI_tall_research: "Фокусные исследования"
 RHI_tall_research_desc: "Сосредоточившись на том, что важно для Рейна, мы сможем сделать так, чтобы мы никогда не отступали и не теряли лица с другими странами."

 # Stability Focuses
 RHI_stability: "Стабилизировать Рейн"
 RHI_stability_desc: "Рейн называется Дикий Запад Европы. Мы должны начать менять это. Если есть что-то, что не нужно нашему населению, то это еще больше нестабильности."
 RHI_intellectuals: "Судьба интеллигенции"
 RHI_intellectuals_desc: "Начиная с различных интеллектуалов и их различных политических взглядов, мы сделаем Рейн более безопасным для всех."
 RHI_spartacists: "Судьба спартацистов"
 RHI_spartacists_desc: "С тех пор, как Маркс выпустил свои знаменитые книги, коллективисты были частью нашего региона, нам нужно решить, терпеть это или нет."
 RHI_freikorps: "Судьба Фрейкорпов"
 RHI_freikorps_desc: "Решить вопрос о том, что с ними делать, очень важно."
 RHI_intellectuals_diverse: "Защита интеллектуального разнообразия"
 RHI_intellectuals_diverse_desc: "Наши интеллигенции должны свободно работать без вмешательства правительства, только таким образом, чтобы они приносили пользу всему нашему обществу."
 RHI_intellectuals_unity: "Обеспечение интеллектуального единства"
 RHI_intellectuals_unity_desc: "Мы не можем мириться с тем, что наши интеллектуалы распространяют опасные идеи."
 RHI_spartacists_allow: "Легализация FARU"
 RHI_spartacists_allow_desc: "ФАУР принесла нам больше пользы, чем помешала, и мы должны позволить ей продолжать работать."
 RHI_spartacists_ban: "Запретить ФАУР"
 RHI_spartacists_ban_desc: "САУР слишком опасна, чтобы его держать поблизости, и мы будем решительно распускать его, чтобы он не мог угрожать нам в ближайшем будущем."
 RHI_freikorps_allow: "Легализация фрейкорпов"
 RHI_freikorps_allow_desc: "Даже несмотря на то, что это может нанести ущерб социальной стабильности и создать «Бешенство», все же лучше держать этих популярных солдат вокруг себя."
 RHI_freikorps_ban: "Запрещение фейкорпов"
 RHI_freikorps_ban_desc: "Мы не терпим воинственное и неуправляемое поведение фрейкорпов, их нужно как можно скорее удалить."
 RHI_stability_spirit: "Смотри на Рейн"
 RHI_stability_spirit_desc: "После того как мы решили самые насущные проблемы, настало время обеспечить, чтобы у нас больше никогда не было проблем такого масштаба."

 # Military Focuses 
 RHI_militarize_rhineland: "Ремилитаризовать Рейнленд" 
 RHI_militarize_rhineland_desc: "Пришло время ремилитаризировать Рейн."
 RHI_rhenish_armed_forces: "Ренские вооруженные силы"
 RHI_rhenish_armed_forces_desc: "Нам не нужны какие-либо французские или британцы, которые бы защищали нас."
 RHI_military_reorganization: "Военная реорганизация"
 RHI_military_reorganization_desc: "На Рейне до сих пор живут бывшие офицеры старой немецкой армии, мы должны поручить им построить новую Рейниску Вермахт, их гений сделает нас лучше, чем французы."
 RHI_rhenish_french_cooperation: "Армия франко-язычного союза"
 RHI_rhenish_french_cooperation_desc: "Как и во Франции, и у рейнского народа есть долгая история, как в старые времена Наполеона, мы будем сражаться и умирать вместе, чтобы достичь лучшего."
 RHI_rhenish_officers: "Ренишные офицеры"
 RHI_rhenish_officers_desc: "Офицерский корпус находится в руках людей рейнского происхождения, как и должно быть."
 RHI_french_officers: "Французские офицеры"
 RHI_french_officers_desc: "Все высшие командные посты занимают французы."
 RHI_french_military_mandate: "Военный мандат Франции"
 RHI_french_military_mandate_desc: "Французы будут контролировать, как организована наша армия и как она будет сражаться."
 RHI_rhenish_conscription: "Принудительный ренийский призыв"
 RHI_rhenish_conscription_desc: "Если они не хотят защищать свою территорию, мы заставим их защищать ее, каждый человек старше 18 лет должен служить в вооруженных силах не менее одного года, что может привести к дезертирству, но это будет легко уладить."
 RHI_french_enlistment: "Французский список"
 RHI_french_enlistment_desc: "Вербовать солей французов для армии мандата."
 RHI_rhenish_doctrine_dispute: "Учредить языческую доктрину"
 RHI_rhenish_doctrine_dispute_desc: "Мы воспользуемся знаниями нашей страны, чтобы решить, какую военную доктрину мы придерживаемся, после того, как все наши офицеры будут лучше знать."
 RHI_french_doctrine_dispute: "Принять французскую доктрину"
 RHI_french_doctrine_dispute_desc: "Французская доктрина развивалась для них в прошлом и сработает для нас, в конце концов, они были победителями Великой войны."
 RHI_rhenish_firepower: "Гром Рейна"
 RHI_rhenish_firepower_desc: "Как и в старые времена, мы сделаем рейнские пушки лучшими в Европе."
 RHI_fortress_rhine: "Доктрина защиты"
 RHI_fortress_rhine_desc: "Поскольку наш ландшафт облегчает защиту нашей страны, мы должны сосредоточиться на защите нашей страны, а не на том, чтобы быть агрессором."
 RHI_trench_warefare: "Тренч Война"
 RHI_trench_warefare_desc: "Французы были хозяевами войны Тренча во время Великой войны, и мы должны учиться у них и принять их доктрину, чтобы дать врагу истечь кровью перед нашими линиями."
 RHI_mechanized_guard: "Создание механизированного Рейнгарда"
 RHI_mechanized_guard_desc: "Некоторые из генералов начали принимать идеи моторизации и механизации войск и фокусироваться на скорости вместо огневой мощи."
 RHI_rhenish_firepower_2: "Железные крепости"
 RHI_rhenish_firepower_2_desc: "Железные замки Рейна сейчас произведут самые мощные пушки на всей планете."
 RHI_fortress_rhine_2: "Щит Рейна"
 RHI_fortress_rhine_2_desc: "С помощью больших сетей быстрых информационных путей и естественного ландшафта Рейна мы станем щитом, который враг никогда не сломает."
 RHI_forts_1: "Начать строительство Рейнволл"
 RHI_forts_1_desc: "Мы должны начать строительство оборонительных линий в жизненно важных стратегических точках по всей нашей стране с большой сетью бункеров, пулеметных гнезд и радиоподсоединений."
 RHI_forts_west_1: "Западный Рейнволл"
 RHI_forts_west_1_desc: "Наши самые большие враги - это те, кто к западу от нас, и мы позволим им истечь кровью, прежде чем они смогут пойти дальше на нашу землю."
 RHI_forts_east_1: "Восточный Рейнволл"
 RHI_forts_east_1_desc: "Использование Рейна в качестве естественной оборонительной линии создаст непроницаемую линию обороны."
 RHI_trench_warefare_2: "Нападение"
 RHI_trench_warefare_2_desc: "С помощью массовых концентрированных нападений мы создадим большие нарушения в вражеских линиях, которые могут быть использованы для дальнейших операций."
 RHI_mechanized_guard_2: "Массовая механизация"
 RHI_mechanized_guard_2_desc: "С нашей индустрией мы можем полностью механизировать нашу армию, с мобильностью и скоростью, которые являются нашим кредо, враг никогда не сможет противостоять вовремя."
 RHI_military_research: "Военные исследования"
 RHI_military_research_desc: "С учетом того, что все больше внимания уделяется военным, мы должны также начать финансирование военных исследований, с тем чтобы будущие поколения Рейна также могли защитить его от любой угрозы."
 RHI_develop_military_factories: "Разработать военные фабрики"
 RHI_develop_military_factories_desc: "Если мы хотим защитить Рейн от восточной угрозы, мы должны увеличить военное производство."

