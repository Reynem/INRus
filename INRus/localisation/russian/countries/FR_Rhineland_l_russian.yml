 RHI_Oper_Air_desc: "С помощью тяжелых тактических бомбардировщиков мы можем сделать небо черным и вложить страх и смерть в сердца врагов."
 RHI_Air_Production_Debate: "Дискуссия по вопросам производства воздуха"
