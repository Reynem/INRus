 ##### Events #####
 ###Pre Crisis Stuff###
 rhi.0.d: "В 1938 году, как и в конце 1938 года, выиграйте на вашем собственном риске. История рейнского государства начинается не с его образования, а с Великой войны. Рейн был оплотом немецкой экономики, волшебным народом, углем, железом и 1919 годом, кровью. В 1919 году организация Энтент подтолкнула германскую армию к восточному берегу Рейна. В 1919 году Наступление , а индустриальная база Германии могла стать союзной оккупацией. Десант , когда германцы сдались вскоре после этого, союзники остались на Рейне, обеспечивая, чтобы германская репарация была выплачена через прямой контроль над Германией. уголь и железо . Соединенные Штаты, Италия, Франция и Соединенное Королевство создали русскую высшую комиссию по Рейну, чтобы , . , ... . , . , . . ."
 rhi.1.d: "Рейн полон разнообразных политических партий и фигур, шесть из которых властвуют над населением. Nn FreePeiter Union Rheinlands (FAUR) nLEDATADATAGATAGAADAHALATODAGADATODADADYADYADYADAVEDADADADADADEADEADEADEADEDEDEDADEADEADEADEADEADEADEADEADEDADEADEDEDEDEDERADEDEDEDEREDEDEDEDEDEFEDEDEDEDEDELEDEDEDHEDEDHEREADHEDEDHADHADHADADYADYADEADЕСТРЕСТРЕСЬI."
 rhi.2.d: "Начало нового года начинается с подготовки нового бюджета. Интерсоюзная высшая комиссия получает большую часть своих средств непосредственно от французского правительства, а остальная часть - от неэффективного налогообложения в самом Рейне. Е.Ф. Шумахер, экономический советник Пола Тирарара, весьма активно выступает за пакеты расходов на инфраструктуру. Хотя это, безусловно, позволит рехенской экономике, укрепив железнодорожные линии и автодорожные сети, наш бюджет уже довольно плотный, так что другие члены правительства, в том числе популярный немецкий советник Карл фон Старк, предложили сэкономить средства на непредвиденные расходы, которые могут возникнуть в течение года."
 rhi.3.d: ""День Май", как и ожидалось, привел к протестам левых и профсоюзных деятелей по Рейну, организованным ФАУР и молчаливо поддержанным Sozialdemokratische partei, в эти годы протесты привели к массовым беспорядкам. Фрейкорпы остаются в нашем распоряжении и, безусловно, были бы самым простым способом контролировать левый бред. Многие в правительстве начали беспокоиться о том, что фрейкорпы становятся слишком сильными, однако, и мы могли бы просто позволить полиции справиться с беспорядками, даже если бы они были недоукомплектованы. И наконец, мы могли бы признать протесты законными как проявление доброй воли, только арестовывая агрессивных протестующих, но это может еще больше подтолкнуть левых радиков."
 rhi.4.d: "Недавно [RHI.GetName] начал разгоняться над интеллектуальным происхождением, что привело к тому, что различные видные интеллектуалы покинули Рейн, в частности, когда Эйнштейн уехал в Еврейское Содружество."
 rhi.5.d: "Ханс Адам Дортен, националистический лидер Rheinische Volkspartei, опубликовал свои два политических манифеста на французском и немецком языках."La Tragédie Rhénane\" in French, and \"Die Rheinische Tragödie\" in German. The book details the history of the struggle for Rhenish independence from Dorten’s story, beginning with his valiant service in the German army, to his disobedience to the tyrannical Kaiser, to the chaotic foundation of the Rhenish independence movement during the Ruhr Occupation. The reformation of the Rhenish Freikorps under Dorten and Otto Lichtschlag has been romanticised, displaying them as the last hope for a Rhine free from both communist, French, and valkist influence.\n\nThe second part of Dorten’s manifesto is titled, \"Génie du Rhin\" in French, or \"Genie des Rheins\" in German, and outlines Dorton’s goal for a free Rhine. According to Dorton, the Swiss were the first \"Germanic Free State\", achieving their independence from the Holy Roman Empire through the 30 years war, and expanding to incorporate both Germanic and Francophone populations. Dorton then outlines the Rhine as the \"Second Free State\". Just as the Swiss broke free from the Holy Roman Empire, the Rhine broke free from the German yoke, and now must free expand into the Francophone lands of Luxemburg and Bastogne. This give the Rhine natural borders and defences, just as the Swiss have the Alps, the Rhenish Republic must have the Meuse and Rhine rivers to defend itself. Dorten finally calls for an autarkist economy, insulated from foreign affairs, and a strong military service to protect Rhenish neutrality.\n\nDorten’s manifesto has been well received by many in the Rhine, hoping for independence at long last, but has been criticised by historians and opponents as historically simplistic and self serving. Regardless of critique, membership in the Freikorps is at an all time high, and the novel has marked the transition of Dorten’s Rheinische Volkspartei from a generally cooperative party to one of open resistance to French rule."
 ###Rhine Crisis###
 rhi.10.d: "Рыночная катастрофа привела к возникновению политической пороховой сети Рейна! Британцы вышли из Рейна, оставив Межсоюзную высшую комиссию под единственным видом Франции. Прекращение британского финансирования привело к массовому бюджетному обесцениванию, в то время как экономические потрясения, вызванные отзывом британских инвестиций, привели к катастрофической цепи событий. ~В сочетании чрезвычайного налога, создания беспорядков по поводу неравноправных торговых соглашений, экономических потрясений, угнетающих экономику, и внезапного всплеска безработицы привели к широкомасштабным ударам по Рейну, которые привели к остановке экономики. Организованное ФАУР, ССР и РПВ, сопротивление приняло форму пикетных линий и военизированных маршей как социалисты, так и националисты протестуют за Рейн."
 rhi.11.d: "Французы продемонстрировали свои истинные цвета и отказались от Рейна до своей судьбы. Без экономической помощи ситуация продолжает ухудшаться и требует независимости. Валькист Ватерландспартей стал больше по мере того, как росли призывы к объединению и к членству в восхождениях TST-Vorhut. Ханс Адам Дортен объявил правительство незаконным, требуя соблюдения Лейпцигской декларации, а Рейн позволил независимость. Конрад Аденауэр, мэр Кёльна, боролся с волной революции и вместо этого призвал к миру и автономии от Франции, а не к полной изоляции от французского правления. Йозеф Фридрих Маттес, лидер Созиалдемократиши Партеи, просто призвал к свободе Рэниш, не уточняя, кого он поддерживает. Рейн возгорается."
 rhi.12.d: "Он успешно убедил Ханса Адама Дортена и Конрада Аденауэра встретиться с местными лидерами для того, чтобы раз и навсегда решить судьбу Рейна в городе Эссен, представил нам требование о проведении конференции с целью запечатлеть судьбу Рейна."
 rhi.13.d: "Как Рим перед нами будущие историки будут спорить о том, что привело к краху Рейнленда, независимо от того, не желают ли центральные правительства идти на компромисс с противостоящими фракциями или нет, чтобы ликвидировать политических диссидентов, Рейн стоит сейчас на краю неудавшегося государства. Многие из наших цитенов, которые когда-то называли их Средь умеренных, теперь сходятся в Ватерландспартеи, которые обещают им стабильность под руководством Германии."
 rhi.14.d: "Французы разрешили провести конференцию, заявив, что они будут уважать результаты конференции. Политические лидеры, мэры и делегаты со всего Рейна встретились в Эссене для обсуждения и принятия решения о судьбе Рейна. Три ключевых лагеря стали очевидными в первые дни - Фолькспартеи Ханса Адама Дортена - небольшими, но получили поддержку как простых людей, так и военных генералов, в то время как Зентрумспартеи Конрада Аденауэра призывает многих, кто стремится к миру на Рейне. Дортен требует независимости, которая не подлежит обсуждению, в то время как Аденауэр стремится к автономии. Третья сторона, Созиалдемократиши Хосефа Фридриха Маттеса, остается в настоящее время нерешенной, что, возможно, делает их поворотным пунктом в дискуссии."
 rhi.15.d: "Первая неделя конференции была полна жарких дискуссий и формирования фракций. Маттес долгое время избегал принятия обязательств в отношении какой-либо конкретной стороны, но он понял, что ему понадобится союзник для достижения своих целей. Маттес мог бы обратиться к праву, и он мог бы соперничать с Дортеном, споря вместе за строго независимый Рейн, или Маттес мог бы обратиться к Аденауэру и работать на независимый Рейн под французским руководством. И наконец, Маттес мог бы оставаться абсолютно нейтральной партией, чтобы быть частью любой формы правительства."
 rhi.16.d: "Вторая неделя прений продолжалась в тупике, но среди них Конрад Аденауэр поднялся на трибуну, чтобы произнес самую мощную речь ночи, сказав:"We are the rare case where the conquered is very satisfied with the conqueror." Already famous throughout the Rhine, his defence of the French occupation has made him known. He continued to speak of how the French, with all their flaws, are the only force which has allowed the Rhine to remain free of Valkist tyranny, and are the best protection an autonomous Rhine may find. The reception of this great speech however, is yet to be decided."
 rhi.17.d: "Третья неделя Ренишской конференции оказалась закрытой по вопросу об экономическом контроле Франции, два лагеря вновь материализовались, сосредоточившись на конфликте между Дортеном и Корадом. Дортен предложил бескомпромиссную национализацию экономики Ренгенского региона, требуя, чтобы французская сторона смирилась со всем его влиянием. Конрад, вместо этого, хочет постепенно обрести экономическую автономию и пригласить французских инвесторов."
 rhi.18.d: "Гансу Адаму Дортену удалось собрать делегацию, чтобы поддержать его предложение."It is the lost treasure of the Rhine, who commits the god of the Occident, the Latin god, to a murderous fight against the destructive forces of Asgard threatening from the darkness of the East ... The Rhenish people, the people of Siegfried, borne by Latin tradition and Christian mission, seeks to save the peace of God threatened by the East." The speech, a reference to the old norse saga of Siegfried the Burgundian slayer of dragons, states in no uncertain terms Dorten's disdain for Valkism."
 rhi.19.d: "Ренишская конференция решила поддержать план Конрада Аденауэра в отношении сотрудничества и автономии под французской защитой Дортена, явно разгневанный этим, сказал в простом заявлении, что я не проклинаю этого человека, но к черту его идеи!"
 rhi.20.d: "Неудача! Ренистская ассамблея застопорилась в голосовании, без предложения о достижении большинства, так как конференция прошла без конца, Валькисты воспользовались возможностью мобилизовать поддержку вокруг них, а вера в более умеренные партии разорвалась, ТСТ-Ворхут запустила Эссен-Путше, захватив Рунешскую ассамблею и ключевые места по Рейну! Жестокие столкновения между французским гарнизоном, ТСТ и Фрейкорпом привели к анархии на Рейне!"
 rhi.21.d: "Чтобы помочь преодолеть кризис, который в настоящее время вызывает Рейн, Франция направила денежную помощь нашему правительству, чтобы помочь нашей стране снова встать на ноги."
 rhi.22.d: "Конрад Аденауэр предложил рейнскую автономию, чтобы помочь обеспечить безопасность Рейна в этом кризисе."
 rhi.23.d: "Французы согласны с планом и поддержкой Аденауэра, предоставляя нашему государству больше автономии в наших внутренних делах."
 rhi.24.d: "Удовлетворение поиска решения рейнского политического кризиса подтолкнуло валькистов взяться за оружие и противодействовать нашему слабому государству. Аденауэр обошёл нас и обратился к французам напрямую с его предложением! Судьба Рейна полностью ушла из наших рук."
 rhi.31.d: "Неудачная позиция рейнского правительства по поддержанию мира в пределах его границ вынудила Францию установить мандат над нашей нацией, ибо предопределённое будущее Франция будет иметь прямой контроль над политикой и управлением Рейном."
 rhi.32.d: "Для многих французский Рейн всегда был обречен на неудачу. Рейн - немец и всегда был немцем. Мы больше не станем меньшим партнером иностранной державы. Германия - наше будущее."
 rhi.33.d: "Переговоры с Францией привели к заключению соглашения - под руководством Конрада Аденауэра будет сформирована Автономная Республика Рениш. &quot; Тирард &quot; и &quot; Аденауэр &quot; подписали документы символически, и после создания Ренишской Республики первым делом президента Аденауэра стало назначение Йозефа Фридриха Маттеса в качестве канцлера. &quot; Коалиционное правительство &quot; дало возможность Рейну пользоваться широкой поддержкой населения. &quot; Рхенская национальная ассамблея &quot; в первую очередь должна была подписать соглашение о постоянном союзе с Францией. &quot; Хотя это было встречено с общей позитивностью &quot; , многие в недавно сформированном собрании сразу же указали, что Франция нуждается в продолжении поставок угля и в неравном торговом соглашении. &quot; Рейн &quot; , тем не менее, далек от того, что было раньше."
 rhi.34.d: "После обсуждения на Рейнской конференции были приняты решения о структуре Рейнской Конфедерации (Рейниш Бунд), в значительной степени опирающейся на Веймарскую Республику, правительство в целом ее отражает. Правительство, будучи федеративной республикой, возглавляет сильный президент (Бундесспрядант) и ограниченный канцлер (Бундесканцлер). Наконец, Ренишское национальное собрание (Рейниш Нэшнлверсаммлнг) образует законодательный орган. Самые большие различия между рейнским правительством и Веймаром заключаются в создании сильной независимой судебной системы; Ренский национальный суд (Рейнишиш Ландешгредж). Несмотря на то, что в Национальной конвенции было принято решение о том, что первые выборы состоятся в январе 1938 года и повторяются каждые четыре года после этого, с тем чтобы содействовать обеспечению президентской подотчетности. До тех пор временное правительство было сформировано вместе с Йозефом Фридрихом Маттесом в качестве исполняющего обязанности президента, а также со стороны националиста Ханса Дортена в качестве кандидата с членами конституционной делегации, сформированной в Национальное."
 rhi.35.d: "В то время как коалиционное правительство Маттеса Дортена изначально было создано для стабильного Рейна, идеологические различия между Дортеном и Маттесом стали слишком большими, чтобы их игнорировать. Маттес содействует созданию пацифистского социального демократического государства в сотрудничестве с Францией, в то время как Дортэн активно добивается национализации ресурсов и расширения Рейна."
 rhi.36.d: "Рейн уже давно имеет Кобиланс в качестве условного центра управления, но с новым режимом [RHI.GetName] появляется возможность сдвинуть центр власти."
 rhi.50.d: "Рейнленд втянул Францию и Германию в бесчисленные конфликты на протяжении веков. Промышленная революция сделала Рейн одним из самых продуктивных и ценных регионов в мире. Те, кто контролирует Рейн, контролируют Европу, поэтому, когда французы захватили долину после Великой войны, неудивительно, что это вызовет реваншизм у немецкого народа. Немецкий фюрер Адам Дресслер требует, чтобы в нашей стране был проведен референдум для определения статуса Рейнленда. Хотя наша нация, как правило, разделена по центру между профранцузскими и прогерманскими позициями, экономическая и политическая нестабильность подталкивает все больше и больше наших цитенов к поддержке немецкого правления. Мы должны быть осторожными в том, как мы действуем."
 rhi.51.d: "Рейнленд втянул Францию и Германию в бесчисленные конфликты на протяжении веков. Промышленная революция сделала Рейн одним из самых продуктивных и ценных регионов в мире. Те, кто контролирует Рейн, контролируют Европу, поэтому, когда французы захватили долину после Великой войны, неудивительно, что это вызовет реваншизм у немецкого народа. Немецкий фюрер Адам Дресслер требует, чтобы в нашей стране был проведен референдум для определения статуса Рейнленда. Хотя наша нация, как правило, разделена по центру между профранцузскими и прогерманскими позициями, экономическая и политическая нестабильность подталкивает все больше и больше наших цитенов к поддержке немецкого правления. Мы должны быть осторожными в том, как мы действуем."
 rhi.52.d: "Рейнленд втянул Францию и Германию в бесчисленные конфликты на протяжении веков. Промышленная революция сделала Рейн одним из самых продуктивных и ценных регионов в мире. Те, кто контролирует Рейн, контролируют Европу, поэтому, когда французы захватили долину после Великой войны, неудивительно, что это вызовет реваншизм у немецкого народа. Немецкий фюрер Адам Дресслер требует, чтобы в нашей стране был проведен референдум для определения статуса Рейнленда. Хотя наша нация, как правило, разделена по центру между профранцузскими и прогерманскими позициями, экономическая и политическая нестабильность подталкивает все больше и больше наших цитенов к поддержке немецкого правления. Мы должны быть осторожными в том, как мы действуем."
 rhi.53.d: "Для того чтобы утешить Германию, мы решили провести референдум. Голосование будет простым выбором между двумя вариантами: либо сохранить статус-кво, либо объединиться с Германией. Несмотря на некоторые опасения по поводу победы в объединении, большинство экспертов согласны с таким сценарием."
 rhi.101.d: "Лондонский фондовый рынок обрушил шоковую волну по всему миру, в Рейнленде, нашем буфере между нами и Германией, экономическая катастрофа подорвала способность страны эффективно управлять своими внутренними делами, нам, возможно, придется вмешаться и помочь Рейну восстановить себя, но многие министры утверждают, что Франция не в состоянии обеспечить себе экономическую поддержку, не говоря уже о другой нации."
 rhi.102.d: "Несмотря на то, что некоторые министры хотели бы пойти на компромисс с Рейном и найти дипломатическое решение, возможно, настало время направить французские войска для восстановления порядка."
 rhi.103.d: "Все подобие контроля в Рейнленде рухнуло. Нация находится на грани полной гражданской войны и без немедленной поддержки национальное правительство в Комбенсе обречено на крах. В то время как наша армия готова вмешаться, если мы дадим слово многим министрам в парижской дискуссии о ценности постоянной поддержки такого и непристойного правительства."
 rhi.104.d: "Конрад Аденауэр обратился к нашему правительству с планом, чтобы помочь смягчить кризис на Рейнленде. Хотя его план не совершенен, он не очень популярен среди рейнских людей."
 rhi.105.d: "Политическая ситуация на Рейне рухнула, люди требуют проведения крупных реформ в этой стране, хотя это может помочь в краткосрочной перспективе, это также ослабит наше влияние на Рейнленд."
 rhi.106.d: "Французская оккупация Рейна разрушила отношения между Германией и Францией с конца Великой войны и возможное расширение Франции на Рур в 20-е годы помогло привести некогда экстернальную Валькистишскую Дойче Фолькспартей в высочайшее положение. Реванхизм достиг точки кипения в Германии."
 rhi.200.d: "Несмотря на шок со стороны международного сообщества, неудивительно, что референдум по Рейнленду завершился большинством голосов за объединение Германии."
 rhi.201.d: "В шокирующий поворот событий промытые мозгами рейнские люди проголосовали за сохранение статус-кво там, и большинство из них знают, что этот референдум был обманутым и не может быть воспринят как какой-либо законный путь. Если воссоединение не может быть достигнуто мирным путем, нам, возможно, придется взять его силой."
 rhi.202.d: "Несмотря на то, что политики Парижа и Коблинса являются камнем французского государства, они отказываются слушать голос его народа, миллионы немцев остаются в ловушке под гнетущим иностранным государством, не имея надежды на воссоединение с семьями, пересекающими реку, мы должны пойти в Рейнленд и освободить наших соотечественников."
 rhi.400.t: "Дефект рейнских валькистов"
 rhi.400.d: "Несмотря на усилия правительства по ограничению влияния Валькизма, он нашел широкую поддержку на Рейне. Сегодня, согласно сообщениям, многие из валькистов дезертировали, чтобы поддержать Германию в своем крестовом походе против нашего суверенитета. Хотя отсутствие способных людей может нанести ущерб нашей призывной деятельности, отсутствие этих дисседентов, несомненно, поможет обеспечить стабильность нашей нации."
 rhi.400.a: "Валькистам нет места в Рейнленде."
 rhi.401.t: "Рениш Валькисты присоединяются к нашему делу."
 rhi.401.d: "Когда была объявлена война против Франции и государства-клиента Рейнленда, многие в Рейне увидели законность нашего дела и побежали в наши вооруженные силы, и эти люди заставят своих соотечественников окружить их, когда они вернутся в свои дома в качестве освободителей против французской оппозиции."
 rhi.401.a: "Свет Валькизма не знает границ"
 rhi.402.t: "Воскресенье на Рейне"
 rhi.402.d: "Несмотря на все усилия своей страны, направленные на то, чтобы избавиться от своей немецкой самобытности, рейнские мужчины и женщины приветствуют нас как братьев в своем доме."
 rhi.402.a: "Скоро будет закончена оккупация Рейна."

