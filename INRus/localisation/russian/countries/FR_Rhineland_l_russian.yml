 #####Generals Descriptions#####
 RHI_Gen_Busch_DESC: "§W6 июля 1885 года Эссен, Германия §G Военная карьера:n §WHe вступил в Имперскую армию в 1904 году, после окончания Академии Гросс Лихтерфельд Кадет. Во время Великой войны Бунч служил на Западном фронте командиром батальона в 56-м пехотном полке. nn-Night's Cross of the Royal House of the Order of Hohenzollern n-Pour leMerite n-Iron Cross I и IIn-Silver Wound Badge\n GNotes: §Wn-Poor Strategic Manages un-Dull_n-n-coldings to a control a control"
 RHI_Gen_Cruwell_DESC: "§G Военная Доссир §GBorn: §W20 March 1892 Dortmund, Германия §G Военная карьера:n §WCrüwell вступил в Имперскую армию в 1911 году в качестве офицера. Во время Великой войны он сражался на западном фронте, заканчивая командованием роты. \n-Iron Cross I и IIn-Hanseatic Cross §W\n §GNotes: §W\n-Oud\n-N-N-Neffective"
 RHI_Gen_Dorten_DESC: "§W10 февраля 1880 года Бонн, Германия §G Военная карьера: n §WHe ненадолго служил во втором полевом полке Артиллерии No 23 в 1912 году между его образовательными костюмами. Во время Великой войны он служил в 54-м командном корпусе в качестве младшего офицера. В 1918 году он был арестован по обвинению в резкой критике Кайзера."
 RHI_Gen_Hollidt_DESC: "В 1909 году во время Великой войны он воевал на западном фронте и закончил в качестве капитана."
 RHI_Gen_Gallenkamp_DESC: "В 1909 году во время Великой войны он сражался на западном фронте и получил ранения в битве при Марне, 1914 год."
 RHI_Gen_Lichtschalg_DESC: "§W17 июля 1885 года Уэсель, Германия §G Военная карьера:n §WLichtschlag присоединился к 1-му Вестфальскому полевому артиллерийскому полку в качестве офицера и сражался во время Великой войны на западном фронте. После войны он возглавил Фрейкорп Личчаг и снова сражался со спарацистами в Руре. Его оппоненты назвали свои войска."Freikrops Manslaughter" due to their brutality.\n§GNotes:§W\n-Despises Socialism\n-Daredevil\n-Quick Witted"
 RHI_Gen_Luttwitz_DESC: "§W23 декабря 1895 года Страсбург, Германия §G Военная карьера:n §WLütwitz вступил в Имперскую армию во время мафии в 1914 году в качестве офицера-кадета."
 RHI_Gen_Mangin_DESC: "§G Военный Доссир §GBorn: §W6 июля 1866 года Сарребург, Франция §G Военная карьера:n §WMangin присоединился к 77-му пехотному полку Франции в 1885 году, позже присоединился к 1-му военно-морскому пехотному полку. Он сражался в Судане и Мали. Во время Великой войны он командовал десятой армией Франции и стал известным как первый пехотный полк."the Butcher" for his fearless bloody attacks. His forces occupied the Rhine in 1933.\n§GNotes:§W \n-Speaks Bambara (Language of Mali)\n-Brave\n-Loyal to France\n-Entering his 70s; Unable to Adapt"
 RHI_Gen_Salmuth_DESC: "§W11 ноября 1888 Metz, Германия §G Военная карьера: n §WSalmuth присоединился к Имперской армии в 1907 году и сражался как на западном, так и на восточном фронте в качестве капитана в Генеральном штабе. \n-Iron Cross I и II n-Bavarian Minit Order IV Class n-Friedrich Cross nn-Austrian Warit Cross III n §GNotes: §W\n-Quick Wlod\n-Daring"
 RHI_Gen_Viet_DESC: "§W6 декабря 1887 года Mainz, Германия#n §G Военная карьера:n §WWWWinginghoff присоединился к Имперской армии в 1907 году и воевал во время Великой войны в качестве капитана. . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . ."

