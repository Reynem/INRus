 #Decisions
 RHI_internal_politics: "Кризис на Рейне"
 RHI_internal_politics_desc: "Нынешняя политическая ситуация в Рейнленде совершенно неустойчива, хотя Париж, возможно, захочет закопать голову в песок, это лишь вопрос времени, когда рейнский порошок взорвется."
 RHI_crisis_countdown: "Начинается кризис"
 RHI_crisis_countdown_desc: ""

 #### Ideas ####
 RHI_S_rhineland_coal: "Экспорт угля во Франции"
 RHI_S_rhineland_coal_desc: "Франция требует ресурсов Рейна, грабя свою страну ради блага завоевателя."
 RHI_S_political_powderkeg: "Политический порошок"
 RHI_S_political_powderkeg_desc: "Рейн пока тихий, но одна искра может вновь привести к взрыву насилия."
 RHI_S_rhenish_freikorps: "Рениша Фрейкорпс"
 RHI_S_rhenish_freikorps_desc: "Фрейкорпы помогли предотвратить коммунистические восстания, но начали расширяться далеко за пределы правительственного контроля."
 RHI_S_melting_pot: "Интеллектуальные беженцы"
 RHI_S_melting_pot_desc: "Рейн стал убежищем для германских интеллектуалов и диссидентов, помогая нашим научным персонам, но оскверняя регион."
 RHI_S_spectre_of_spartacists: "Спектр спартаков"
 RHI_S_spectre_of_spartacists_desc: "Наследие Рурского восстания и Спартацистов до сих пор преследует Рейн, ожидая, что он вновь появится."
 RHI_S_einstein: "Альберт Эйнштейн"
 RHI_S_einstein_desc: "Великий исследователь Альберт Эйнштейн сделал Рейн своим убежищем, подталкивая наши страны к научной деятельности."

 ###Political Ideas###
 RHI_S_ind_gov: "Ренистский патриотизм"
 RHI_S_ind_gov_desc: "Рейн наконец-то обрел свою независимость, и все могут сплотиться к ее призыву!"
 RHI_S_aut_gov: "Дух сотрудничества"
 RHI_S_aut_gov_desc: "Аденауэр привёл с собой дух сотрудничества и примирения."
 RHI_S_man_gov: "Железная грип"
 RHI_S_man_gov_desc: "Рейн находится в безопасности во Франции."
 RHI_S_val_gov: "Валькистский Фервор"
 RHI_S_val_gov_desc: "Валькисты принесли с собой дух страсти, который течет по Рейну."

 # Stability Ideas
 RHI_horror_on_rhine: "La Force Noire"
 RHI_horror_on_rhine_desc: "Для того чтобы компенсировать нехватку французских призывников, Чарльз Мангин возглавил усилия по созданию французской африканской армии для оказания помощи в оккупации Рейнленда, что породило огромные проблемы, в первую очередь из-за отсутствия дисциплины среди африканских войск, что привело к печально известному «черному ужасу на Рейне», что усугубило недовольство местных жителей французскими оккупантами, причем французское высшее командование не желает признавать или наказывать за преступления, совершенные их войсками."
 RHI_horror_on_rhine_2: "Расширенный La Force Noire"
 RHI_horror_on_rhine_2_desc: "Для того чтобы компенсировать нехватку французских призывников, Чарльз Мангин возглавил усилия по созданию французской африканской армии для оказания помощи в оккупации Рейнленда, что породило огромные проблемы, в первую очередь из-за отсутствия дисциплины среди африканских войск, что привело к печально известному «черному ужасу на Рейне», что усугубило недовольство местных жителей французскими оккупантами, причем французское высшее командование не желает признавать или наказывать за преступления, совершенные их войсками."
 RHI_S_free_society: "Свободное общество"
 RHI_S_free_society_desc: "Рейн открыт для всех идей и обладает полной политической свободой, хотя это позволяет процветать интеллектуализму, но и вызывает нестабильность в регионе."
 RHI_S_limited_society: "Общество с ограниченной ответственностью"
 RHI_S_limited_society_desc: "В то время как правительство Рениша предоставляет большую свободу большинству интеллектуалов, те, кого государство считает радикалами, ограничены, что, по мнению правительства, позволяет и интеллектуализму, и стабильности."
 RHI_S_secret_police: "Секретная полиция"
 RHI_S_secret_police_desc: "В то время как правительство предоставляет преференциальный режим благоприятным группам, большинство организаций, которые осмеливаются выступать против правительства, сталкиваются с необоснованными обвинениями и необоснованными арестами."
 RHI_S_police_state: "Полиция"
 RHI_S_police_state_desc: "Правительство терпимо относится только к своей собственной власти, будь то слева или справа."
 RHI_S_integrated_freikorps: "Легализованные фрейкорпы"
 RHI_S_integrated_freikorps_desc: "Легализация Фрейкорпов усилила призыв на военную службу, в то время как их неправильность и воинственность нанесли ущерб внутренней стабильности."
 RHI_S_legal_FAUR: "Сотрудничество ФАУР"
 RHI_S_legal_FAUR_desc: "Сотрудничество с Союзом свободных рабочих на Рейне помогло нашему производству, в то время как их радикальные связи оказались проблематичными."
 RHI_S_melted_pot: "Интеллектуальная пристань"
 RHI_S_melted_pot_desc: "Рейн продолжает существовать как прибежище для интеллигенции, в то время как идеи и иммигранты вызывают некоторую нестабильность."
 RHI_S_economic_stabilization: "Экономическая стабилизация"
 RHI_S_economic_stabilization_desc: ""

