 SAU_fulfil_destiny: "Направляйся к нашему будущему"
 SAU_fulfil_destiny_desc: "Все арабы должны объединиться под Аравией!"
 SAU_asir: "Требования по компании &quot; Асир &quot;"
 SAU_asir_desc: "Без большей силы для поддержки их жалкого захвата земли, мы наконец-то сможем нанести полный удар по Йемену."

 SAU_saudi_hegemony: "Саудовская Гегемония"
 SAU_saudi_hegemony_desc: "Наши союзники служат своей цели, когда Рашиды и их союзники исчезли, ни одно племя не имеет средств встать на нашем пути, для Аравии начинается новая эра, и саудовцы называют все выстрелы сейчас."
 SAU_expand_oil_hold: "Расширение Нефтяного трюма"
 SAU_expand_oil_hold_desc: "Долгое время мы разрешали местным лордам и вождям свободно обращаться с нефтью на их земле, как она им нравилась; больше нет! Каждый человек должен выполнять свой долг по укреплению нашего положения..."
 SAU_consolidating_fringe_arabia: "Укрепление мира в Аравии"
 SAU_consolidating_fringe_arabia_desc: ""
 SAU_develop_fringe_arabia: "Развивать Йемен"
 SAU_develop_fringe_arabia_desc: "Города Сана и Аден являются одними из крупнейших в нашем мире, и их торговые классы с нетерпением примут нашу помощь в развитии и улучшении их земель и обеспечат, чтобы они наконец достигли этой новой эры чудес, в которой мы живем."
 SAU_tighten_control_arabia: "Усилить контроль над Аравией"
 SAU_tighten_control_arabia_desc: "Прошло много лет с тех пор, как мы держали Ха'ила и окружающие его районы, и многие наши старые союзники забыли о своей верности."
 SAU_purge_rashidi: "Охраняйте Рашидов"
 SAU_purge_rashidi_desc: "Последний из Рашидов прячется как на землях, находящихся под нашим контролем, так и за рубежом."
 SAU_purge_ikhwan: "Уничтожить Икхвана"
 SAU_purge_ikhwan_desc: "Икхван выполнил свою миссию освободить Аравию от ярмо неуважительных лордов, и все же осмелился восстать против руки, которая кормила их; как жестокий отец, мы должны наказать тех, кто не признает новый порядок клеветы в Аравии, где саудовцы стоят абсолютно."
 SAU_dealing_with_kuwait: "Работа с государствами, участвующими в боевых действиях"
 SAU_dealing_with_kuwait_desc: "Эмиры трусских государств давно стоят за британией, и теперь эта так называемая защита близка к концу и они будут служить своей новой нации."
 SAU_consolidating_realm: "Укрепление царства"
 SAU_consolidating_realm_desc: "Наши племенные союзники вновь соберутся и будут убеждены в наших мудрых доводах о том, что наш эмир является единственным верховным правителем Аравии."
 SAU_saudi_legal_code: "Правовой кодекс Саудовской Аравии"
 SAU_saudi_legal_code_desc: "Хотя мы все еще будем сохранять местные законы и законы, нам необходимо разработать соответствующий правовой кодекс, который должен быть принят на всей территории нашего Королевства."
 SAU_minority: "Защита меньшинств"
 SAU_minority_desc: "На протяжении веков, несмотря на наши разногласия, мы уважали права христиан, евреев и других народов под нашим правлением, как это было предписано самим пророком, и мы должны обеспечить, чтобы все наши подданные, независимо от их веры, были защищены."
 SAU_absolute_rulership: "Абсолютное руководство"
 SAU_absolute_rulership_desc: "Лидер не должен тратить свое время на то, чтобы слушать тех, кто меньше, чем он, а должен сосредоточиться на своих собственных мнениях и на своих самых доверенных советниках."
 SAU_realm_of_the_arabs: "Королевство арабов"
 SAU_realm_of_the_arabs_desc: "Вся Аравия находится под нами, и ничто не может встать между нами и судьбой нашего народа, быть единым, под единым монархом — Саудом."
 SAU_houses_of_wisdom: "Дома мудрости"
 SAU_houses_of_wisdom_desc: "Как и наши праотцы во время Аббасидского Калифата, мы создали в нашем царстве несколько домов знаний и возродим новую золотую эру арабской мудрости!"

 SAU_land_of_faith: "Страна веры"
 SAU_land_of_faith_desc: "При поддержке нашего духовенства и мудрых экспертов по вере мы построим Аравию в рай для верующих, и Бог будет нашим свидетелем."
 SAU_cleanse_fringe_arabia: "Очистить Аравию"
 SAU_cleanse_fringe_arabia_desc: "Слишком много турецких и немецких двойных агентов, даже атеистические либералы бродят по улицам в Йемене и Омане, их грешная жизнь вращается вокруг распространения беспорядков, и мы гарантируем, что они не смогут этого сделать."
 SAU_cleansing_of_heresy: "Очистка ереси"
 SAU_cleansing_of_heresy_desc: "Слишком много турецких двойных агентов, Рашид и Хасмид преданные и даже атеисты-синдикалисты бродят по улицам в странах Аравии, их грешная жизнь вращается вокруг распространения волнений, и мы позаботимся, чтобы они не смогли этого сделать."
 SAU_law_of_faith: "Право веры"
 SAU_law_of_faith_desc: "На смену Аравии пришел новый закон, канонский закон, установленный пророком, благословенное имя ему. Аравия не место отступникам!"
 SAU_Jizya: "Джизя"
 SAU_Jizya_desc: "Те, кто не верует, будут наслаждаться нашим пристанищем, и за номинальный налог будут обеспечены справедливая и справедливая защита."
 SAU_gather_the_amirs: "Соберите эмиров"
 SAU_gather_the_amirs_desc: "Все властелины, имеющие важное значение в Аравии, должны быть собраны и убеждены присоединиться к нашему новому, светлому порядку."
 SAU_trading_regulations: "Торговые правила"
 SAU_trading_regulations_desc: "Если Каффар так заинтересован в нефти, пусть они заплатят за нее, деньги доберутся до нужных рук, и взамен им будет позволено копать глубже."
 SAU_funds_for_faith: "Фонды веры"
 SAU_funds_for_faith_desc: "Военная и экономическая значимость нефти взорвалась с начала века, хотя порт Абу-Даби, уже опустошённый трофеями торговли чёрным золотом, будет вознаграждены служители Бога."
 SAU_ghazis: "Газис"
 SAU_ghazis_desc: "Соберите верующих, настанет время для больших усердий; сила ваша и решимость отделяет вас от бесславных, которые служат идолам."
 SAU_extreme_jihad: "Воины веры"
 SAU_extreme_jihad_desc: "Каждый истинный мусульманский воин знает, что, борясь за Аравию, они сражаются за Бога, страну и свои семьи."
 SAU_hunt_apostates: "Охотники"
 SAU_hunt_apostates_desc: "Мы начнем подавление так называемых "синдикалистов", запрыгнем в гильдии, которые считают, что их труд - бог. Из всех глупых западных представлений, этот, возможно, самый ядовитый, и мы должны уничтожить это зло."
 SAU_destroy_dissent: "Уничтожить дискомфорт"
 SAU_destroy_dissent_desc: "Нет ничего хуже предателя, не только веры, но и наших домов, семей и всего, за что мы боремся."
 SAU_madrasah_funding: "Финансирование Мадрасы"
 SAU_madrasah_funding_desc: "Наши величайшие ученые теперь получат необходимое им финансирование и, надеюсь, профинансировают новые школы здесь и за рубежом для всех верующих, которые хотят учиться."
 SAU_kuffar_weaponry: "Оружие Куффар"
 SAU_kuffar_weaponry_desc: "Одно мы знаем: наше старое оружие не сделает, нам нужно научиться и копировать христианские империи в их технологии для битвы, потому что не делать этого было бы угрожать самой вере!"
 SAU_the_caliphate: "Калифат Саудовской Аравии"
 SAU_the_caliphate_desc: "На протяжении веков титул Калифа был пустым, за исключением пустых притязаний малых государств, таких, как Сокото и какая-то турецкая империя, но теперь, имея контроль над самыми священными местами ислама и всей Аравией, мы уже являются лидером верующих, это только вопрос официального утверждения."
 SAU_haia: "Создание моральной полиции"
 SAU_haia_desc: "Мы будем работать над созданием Комитета по поощрению добродетели и предупреждению нравов, который будет активно стремиться искоренить культурную и психическую дегенерацию на наших землях."
 SAU_succession_regulation: "Законное наследование"
 SAU_succession_regulation_desc: "Мы создадим четкую систему наследования, основанную на принципах выслуги лет, мудрости и веры, ибо каждый царь после первого из этих новых держав будет вести ее самым мудрым образом."

 SAU_trading_expertise: "Специализация в области торговли"
 SAU_trading_expertise_desc: "На протяжении тысячелетий арабский народ разбогател не благодаря благодати земли, а благодаря своему опыту в торговле."
 SAU_arms_imports: "Импорт товаров военного назначения"
 SAU_arms_imports_desc: "Нам нужно оружие, чтобы победить хашимитов и всех, кто будет стоять на пути Аравии."
 SAU_weapons_aqusitions: "Приобретение оружия"
 SAU_weapons_aqusitions_desc: "Это просто недоразумение, это просто охотничьи винтовки для личной коллекции Эмира, уверяю вас, все в порядке."
 SAU_reverse_engineering: "Обратная инженерия"
 SAU_reverse_engineering_desc: ""Это не гехр, это Абу-Даби сделал винтовку Бундукия Сабах, полностью оригинальный дизайн, уверяю вас.""
 SAU_armament_plans: "Планы вооружения"
 SAU_armament_plans_desc: "У нас много способных и храбрых воинов, но гораздо меньше оружия, которое может быть использовано на современном поле боя."
 SAU_arsenal_of_arabia: "Аравийский арсенал"
 SAU_arsenal_of_arabia_desc: "Нам нужно не только иметь минимальное количество оружия, но и иметь излишки боеприпасов, кораблей, шин, повязок, продуктов питания, скота; в арсенале Аравийского арсенала есть много потребностей, которые должны быть удовлетворены, чтобы мы не упали перед нашими врагами."
 SAU_caravans_of_tomorrow: "Завтрашние караваны"
 SAU_caravans_of_tomorrow_desc: "Железнодорожные дороги постепенно заменят старые методы транспорта, и скоро каждый город, уголок и кран нашей великой земли будет в течение дня в пути к вокзалу и всему миру."
 SAU_foreign_advisors: "Советники по иностранным делам"
 SAU_foreign_advisors_desc: "По мере того как мы продвигаем наши промышленные и военные программы, нехватка знаний начинает становиться проблемой, и мы отчаянно нуждаемся в том, чтобы иностранные люди помогли Аравии вернуться на ноги после столь разрушительных столетий."
 SAU_oil_market: "Расширение операций по добыче нефти"
 SAU_oil_market_desc: "Наши нефтяные скважины работают в неоптимальных условиях; даже если нам понадобится внешняя помощь и много времени, обеспечение того, чтобы мы могли эксплуатировать этот ресурс, должно быть нашей первоочередной задачей."
 SAU_food_imports: "Активизировать импорт продовольствия"
 SAU_food_imports_desc: "Это не простая задача - накормить страну во время войны, особенно учитывая, что наши враги, скорее всего, будут иметь военно-морское превосходство."
 SAU_national_logistics: "Совершенствование национального материально-технического обеспечения"
 SAU_national_logistics_desc: "Строительство железной дороги — это нечто большее, чем просто прокладка путей, поскольку многое из этого связано с планированием до того, как будет создана даже первая часть, хотя мы еще не готовы к строительству железной дороги, инфраструктуру страны можно улучшить, с тем чтобы она могла произойти в ближайшем будущем."
 SAU_industrial_raw_materials: "Промышленные сырьевые материалы"
 SAU_industrial_raw_materials_desc: "Наши земли практически не содержат металлов, пригодных для промышленности, и поэтому мы должны искать далеко и широко жизнеспособные залежи полезных ископаемых, от которых наши отрасли скоро будут голодать, начиная с горных районов нашей земли."
 SAU_literacy_campaign: "Кампания по ликвидации неграмотности"
 SAU_literacy_campaign_desc: "Наши прекрасные слова и глубокие знания должны распространяться далеко; чтобы позволить людям жить в неведении о мире, нужно быть самым жестоким из тиранов, ибо все люди должны знать его слова."
 SAU_education_reform: "Реформа системы образования"
 SAU_education_reform_desc: "Для того чтобы стать учёным, нужно нечто большее, чем просто читать и писать, как будто способность говорить не делает человека умным. Надлежащее образование для нашей юности, а не только для тех, кто может позволить себе наставников, займет десятилетия, чтобы действительно построить, но мы должны начать этот самый важный шаг сегодня."
 SAU_dig_deeper: "Черное золото под нашими песками"
 SAU_dig_deeper_desc: "Богатство течет по этой земле, и если у нашего народа есть один неудачник, то это любовь к богатству. Оно слаще воды, сильнее меча, потому что любой меч может быть отвернутся с пустым чеком. Нефть купит нам тысячу пушек, и почему, тысяча стволов - это начало империи!"
 SAU_safety_net: "Борьба с нищетой"
 SAU_safety_net_desc: "Мы должны обеспечить, чтобы не только самые бедные, но и вдовы людей, которые отдали свою жизнь за Аравию, имели какую-то систему безопасности, на которую можно было бы положиться, при поддержке нашего мудрого государства."
 SAU_industrialization_effort: "Интегрировать экономику Хеджази"
 SAU_industrialization_effort_desc: "По словам некоторых, в центре ислама, священный город Мекка является жемчужиной в короне любого будущего арабского военного барона, а это не только влечет за собой определенную степень престижа, которую в противном случае невозможно приобрести, но и является конечной точкой хаджа, который даже сегодня является нашей главной экономической тягой."
 SAU_arms_industry: "Промышленность вооружений"
 SAU_arms_industry_desc: "Теперь наша индустрия должна сосредоточиться на защите королевства, поскольку мы работаем над тем, чтобы отвлечь средства и ресурсы на военные расходы."
 SAU_refurbish_towns: "Ремонтные города и деревни"
 SAU_refurbish_towns_desc: "По мере того, как будущее медленно прибывает в Аравию, настало время для того, чтобы улучшить наши деревни и города, чтобы подготовиться к приходу промышленности и обустройству блуждающих племен."
 SAU_arabian_airports: "Аэропорты для Аравии"
 SAU_arabian_airports_desc: "Соединение наших городов не только по суше, но и по воздуху должно быть приоритетом для нашего нового правительства."
 SAU_building_better_future: "Построение лучшего будущего"
 SAU_building_better_future_desc: "Лучшее будущее - это больше, чем новые здания, или новые книги, или новые товары; оно меняет то, как мы видим мир, и тем самым изменяет сам мир. Свет Божий снова светит над нами, и мы сделаем эту землю лучше, даже если цена высока."
 SAU_techslot_machine: "Создание университетов"
 SAU_techslot_machine_desc: "Последний шаг в наших планах в области образования - это, естественно, высшее образование, и возрождение науки и прогресса, чем когда-то было синонимом арабского языка."

 ### Military Focuses ###
 SAU_recruiting_effort: "Набор персонала"
 SAU_recruiting_effort_desc: "Многие молодые люди рискуют бездействовать из-за великой истории, и даже не услышат призыва к оружию!"
 SAU_contest_the_gulf: "Соревнование по Заливу"
 SAU_contest_the_gulf_desc: "Многие бы назвали это Персианским заливом, но мы знаем это лучше, и мы сделаем так, чтобы мир тоже знал!"
 SAU_protect_oil_shipping: "Защита морского судоходства"
 SAU_protect_oil_shipping_desc: "Наш экспорт нефти является жизненно важной частью нашей экономики, и наши враги знают это."
 SAU_kuwait_naval_base: "Морская база Аль-Хаса"
 SAU_kuwait_naval_base_desc: "После того, как Аль-Хаса станет частью Британской империи, он станет нашим главным портом в обозримом будущем."
 SAU_naval_exercises: "Морские учения"
 SAU_naval_exercises_desc: "Готовясь к конфронтации с [PER.GetNameDef] и другими враждебными державами в Арабском заливе, мы будем проводить военно-морские учения для обеспечения того, чтобы наш флот имел реальный опыт в море, когда вспыхнет конфликт."
 SAU_liberation_war_of_holy_cities: "Освободите святые города"
 SAU_liberation_war_of_holy_cities_desc: "Святые города Мекки и Медины находятся в плену хашимиты Хеджази, и наш священный долг — освободить эти святые города под знаменем нашим."
 SAU_mobilize_the_tribes: "Мобилизовать племена"
 SAU_mobilize_the_tribes_desc: "Каждое племя в этих странах поклялось нам помочь, и теперь мы воюем с врагами, которые хотят уничтожить все, что мы сражались так долго, и скрепляйте свои клятвы, идите к нам, к вашему эмиру!"
 SAU_army_command_modernization: "Модернизация армейского командования"
 SAU_army_command_modernization_desc: "Настало время модернизировать нашу армию, подальше от лордов и в армию, которая будет должным образом организована по иностранной военной доктрине с различными ветвями для различных типов подразделений и театров."
 SAU_establish_arabian_airforce: "Создание Аравийских военно-воздушных сил"
 SAU_establish_arabian_airforce_desc: "Мы должны рассмотреть вопрос о создании первых в истории арабских военно-воздушных сил и править небесами над пустынными дюнами."
 SAU_establish_arabian_mechanized_brigades: "Создание механизированных бригад"
 SAU_establish_arabian_mechanized_brigades_desc: "В эту новую эпоху мы должны обеспечить, чтобы наша способность адаптироваться была столь же реальной, как наша храбрость и честность."
 SAU_establish_new_arabian_army: "Новая арабская армия"
 SAU_establish_new_arabian_army_desc: "Сейчас, когда продолжается реформа нашей армии, необходимо приложить дополнительные политические усилия для обеспечения того, чтобы она функционировала на уровне, аналогичном потенциалу крупных держав, чтобы нас не отправили обратно в прах истории, и настало время не жалеть усилий для того, чтобы положить конец племенному и фракционному подходу в наших вооруженных силах и подготовиться к предстоящему столетию."
 SAU_arabian_horsemanship: "Арабский всадник"
 SAU_arabian_horsemanship_desc: "Еще до халифата мы, арабы, были хорошо известны как отличные всадники, и доверчивые воины - это то, что нам наверняка понадобится."
 SAU_desert_warfare: "Война в пустыне"
 SAU_desert_warfare_desc: "Мы знаем, как сражаться на этих землях лучше, чем кто-либо другой. Наши люди уже десятилетиями отбиваются от наших соперников, и еще больше врагов приходят к нашим пескам, но они будут побеждены и научятся ненавидеть песок."
 SAU_desert_logstics: "Материально-техническое обеспечение в пустыне"
 SAU_desert_logstics_desc: "Передвигать войска через пустыню часто невозможно, если вы не знаете дорогу; неправильный поворот может привести к тому, что ваши войска окажутся в пустыне без следа, или прямо в ловушку врага!"
 SAU_war_of_resistance: "Война сопротивления"
 SAU_war_of_resistance_desc: "Мы живем в эпоху полной войны, где даже ограниченные конфликты ставят на карту все. Ваша молодая нация может падать так же быстро, как она возникла, и быть раздавленной под железными каблуками истории. Мы должны сопротивляться! Аравия будет свободной!"

