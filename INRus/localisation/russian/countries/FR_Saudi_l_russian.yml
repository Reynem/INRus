 ### Ideas ###
 SAU_turn_inwards_idea: "Поворачиваемся вперёд"
 SAU_oil_boomer: "Нефтяной бум"
 SAU_warriors_of_faith: "Воины веры"
 SAU_warriors_of_faith_desc: "Мы освободим наших соотечественников-арабов, победим Великого Турка и тех, кто стоит на нашем пути!"
 SAU_madrasahs: "Салафи Мадрасахс"
 SAU_madrasahs_desc: "Наши самые мудрые люди сейчас не только получают надлежащее финансирование, но и имеют возможность расширять и расширять свои великие школы права и веры."
 SAU_trading_expertise_idea: "Специализация в области торговли"
 SAU_trading_expertise_idea_desc: "Наш опыт в области торговли приносит нам огромную пользу благодаря нашим контактам."
 SAU_food_imports_idea: "Импорт продовольствия"
 SAU_food_imports_idea_desc: "Мы покупаем продукты питания массово и строим фундамент для будущего."
 SAU_illiterate_populace_gen: "Неграмотный популас"
 SAU_illiterate_populace_gen_desc: "Хотя наш народ обладает большой мудростью и интеллектом, он не хорошо разбирается в современных науках и в таких базовых способностях, как чтение и писать."
 SAU_islamic_welfare: "Исламское благосостояние"
 SAU_islamic_welfare_desc: "Благотворительность по отношению к нуждающимся является одним из пяти столпов нашей веры; многие бедные, обездоленные, сироты и вдовы войны не попадут под наше правление."
 SAU_backwards_economy: "Архаичная экономика"
 SAU_backwards_economy_desc: "Наша экономика по-прежнему основана на мелком сельском хозяйстве, скотоводстве и торговле нефтью."
 SAU_religious_fervor_idea: "Высоконравственные войска"
 SAU_religious_fervor_idea_desc: "Хорошо оснащенные и мотивированные люди, наши силы сражаются не только за свою нацию, но и за Святые города, за веру и за своего Владыку."
 SAU_new_arabian_army: "Новая арабская армия"
 SAU_new_arabian_army_desc: "Наши реформированные вооруженные силы теперь действуют с новой энергией и независимостью от политики, и Бог с готовностью принесет нам победу на поле боя."
 SAU_arabian_horsemanship_idea: "Арабский всадник"
 SAU_arabian_horsemanship_idea_desc: "Наши всадники, оснащённые лучшими конями и покрытые многолетними рейдами, ответили на призыв и будут сражаться за нас в грядущей войне за мир."
 SAU_desert_logstics_idea: "Материально-техническое обеспечение в пустыне"
 SAU_desert_logstics_idea_desc: "Наши силы обучены делать все, что в наших силах, и знают, что чужестранцы не знают."
 SAU_uniting_the_peninsula: "Недопущения со стороны Саудовской Аравии"
 SAU_uniting_the_peninsula_desc: "Собаки Рашиди мертвы, и дорога в единую Аравию широко открыта."
 SAU_moral_police: "Полиция нравов"
 SAU_moral_police_desc: "Религиозное соблюдение и общественная мораль должны соблюдаться, чтобы сохранить нашу землю чистой."
 SAU_muslim_universities: "Исламское образование"
 SAU_muslim_universities_desc: "Используя государственные средства, мы расширили наши высшие учебные заведения."
 SAU_arabian_war_of_unification: "Война за единство"
 SAU_allah_triumphant: "Триумф Аллаха"

 ### Events ###
 saudi_arabia.1.d: "С пылью войны против шаммарских, наконец, оседающей через дюны, дом Сауда стоит на окончательном перепутье. На севере и западе находятся остатки старых империй и изменяющиеся границы колониальных мандатов; на юге, гористые высоты Йемена и священная ответственность Хеджаза. Некоторые внутри королевского круга утверждают, что пришло время взглянуть за пределы наших горизонтов, объединить расколотые племена и создать современный Калифат, который пользуется уважением к миру. Другие, однако, советуют более измеримый путь: обеспечить безопасность наших законных границ, защитить Святые города, а затем перевернуть наши взоры, чтобы модернизировать и укрепить наше правление без бремени бесконечных инородных запутаний. Выбор, который мы сделаем сегодня, будет следовать через пустыню для поколений."

