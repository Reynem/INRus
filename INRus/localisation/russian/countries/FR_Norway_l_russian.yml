#### Others ####

NOR_FUHRERREICH_DESC: "Со времени обретения независимости в 1905 году Норвегия оставалась нейтральной во время Великой войны, но с ростом классовых различий во время войны и все более непопулярной монархией, марксизм считался решением для народа. Республика была создана в 1926 году, а в 1930 году социалистическое коалиционное правительство взяло на себя ведущую роль."
POLITICS_MARTIN_TRANMAEL_DESC: "Мартин Транмель пришел из среднеразмерной фермы в Мелхусе и стал лидером не только рабочего движения, но и Республики. Немногие могут сказать, что они сняли монархию страны, но и Трэнмель может. Он один из величайших ораторов рабочего движения, некоторые даже говорят, что его речи свели вместе его партию и помешали ей разделиться. Но он возглавляет республику, которая годами боролась с монархистами и антисоциалистскими беспорядками, и он не может представить Норвежскую республику без него."
POLITICS_JOHAN_LUDWIG_MOWINCKEL_DESC: "Йохан Людвиг Мовинкель является судоходным магнатом, государственным и филантропом, бывшим премьер-министром Норвегии и правящим президентом Норвегии. Родившимся в Бергене от старой торговой семьи, естественно, что он стал министром иностранных дел и защитником свободной торговли. Либеральный, Мовинкель выступает как против валькизма Германии, так и против социализма как Советов, так и труда."
POLITICS_INGOLF_ELSTER_CHRISTENSEN_DESC: "Ингольф Элстер Кристенсен был юристом, военным офицером и губернатором графства, прибывшим из сельской области Согн ог Фьордане, достиг самого высокого положения в стране. 1872 года рождения капитану, Кристенсен учился в Бергенской соборной школе и поступил в Военную академию, прежде чем стать губернатором округа, сначала Согн ог Фьордан, а не Осло и Акершус, до тех пор, пока он не ушел на пост президента. Консерватив, обладающий опытом в области правосудия и обороны, его президент мог бы также быть правителем и порядка."
POLITICS_EINAR_GERHARDSEN_DESC: "Эйнар Генри Герхардсен, родившийся в качестве Эйнара Генри Олсена, изначально является дорожным работником и активным членом рабочего движения, но имеет статус президента. Родился в Аскере в скромной семье рабочего класса, Герхардсен считал бы естественным стать членом рабочего движения. Это также привело его к тому, что он стал членом круга Мартина Транмеля в начале 1920-х годов, почти преданным мистеру Транмелю. В то время как Герхардсен стал радикальнее, он стал более умеренным внутри Лейбористской партии."
POLITICS_HAAVARD_LANGSETH_DESC: "Хаавар Лэнгсет является гражданским инженером, организатором, редактором и одним из радикальных социалистов, у которых лейбористская партия является домом. Коммунистический человек, Лэнгсет является сторонником советского социализма и одним из основных основателей движения друзей Советского Союза. Это также сделало его оппонентов и даже умеренных в партии, боясь, что он не более чем советская марионетка. Лэнгсет должен доказать, что он больше, чем советский щенок, и теперь он стоит на посту президента страны."
POLITICS_JOHAN_NYGAARDSVOLD_DESC: "Йохан Найгардсволд был членом Лейбористской партии, затем социал-демократами, прежде чем обе партии воссоединились. Нигардсволд не хотел занимать государственные должности, но принял кандидатуру на пост президента партии. С его умеренными взглядами, граничащими с социальной демократией, он может даже видеть сопротивление радикалов, но его также можно рассматривать как приветственное лицо оппозиции."
POLITICS_ARTHUR_NORDLIE_DESC: "Артур Нордли является подрядчиком и спортивным менеджером, который много лет работал представителем в Стортинге Консервативной партии. Он родился в столице Осло, затем Кристиания, Нордли занялся политикой, работая в ремесленных организациях. Нордли также активно участвовал в местной политике и был важной фигурой в создании футбольных и спортивных федераций как на национальном, так и на местном уровнях. С старением Ингольфа Элстера Кристенсена Нордли стал очевидным следующим кандидатом в Консервативную партию."
POLITICS_NILS_TRAEDAL_DESC: "Нильс Трёдал является священником и одним из основателей Партии фермеров. Он родился в Сундале в Мёре-ог-Ромсдале, штат Трэдал, сыном фермеров, который стал первым священником, а затем приходским священником. В политическом плане Трёдал начал быть членом Либеральной партии, прежде чем стать членом Партии фермеров при ее создании в 1920 году. Трёдал был представителем, членом правительства и парламентским лидером, до того как его избрали в президенты Норвегии. Популярность рассматривается как кандидат на компромисию, он должен увидеть, может ли он быть объединяющей фигурой."
POLITICS_KING_HAAKON_VII_DESC: "Король Хаакон VII - это история короля, избранного народом, который был также свергнут народом. Король Датский Карл, сын Датского короля, получил трон новой независимой Норвегии в 1905 году, только потеряв его 20 лет спустя, был вынужден взбунтоваться. Будучи первой объединяющей фигурой, уважающей конституционную монархию, когда народ предал ее, король Хакон начал терять уважение к принципам современной конституционной монархии. В последние годы король Хакон принял идею королевского патернализма, рассматривая опроверженную республиканскую Норвегию как проект, который может быть спасен только патерналом Хемпардом.n §WRoyal Paternalist§!"
POLITICS_KING_OLAV_V_DESC: "Король Олав V был всего лишь ребенком, когда его отец, король Хаакон VII, стал королем Норвегии. В 1926 году, когда он вырос в Норвегии, король Олав был почти разбит сердцем, когда ему пришлось покинуть недавно созданную республику. В 1929 году, когда ему разрешили увидеть Норвегию для вступления в брак, с тех пор он не был приглашен социалистическими силами. В то время как республика дала Олаву отвращение к принципам монархии, поначалу после нескольких лет извиливания, король Олав начал восстанавливаться после потери своей родины в Норвегии, прожив много лет в Англии, с визитами в Америку между ними. Возвращаясь в Норвегию, Олав надеется, что он сможет стать королем народа и предотвратить еще один 1926 год."
POLITICS_RAGNVALD_HVOSLEF_DESC: "Рагнвальд Хвослеф является военным офицером и политиком, и среди тех, кто имеет важное значение в будущем Норвегии, в то время как он правит лишь на несколько дней. Он родился в Кристиании, то есть сегодня в Осло, Хвослеф служил главным, военным атташе и даже начальником Королевской гвардии. Это до того, как он покинул вооруженные силы в 1926 году. Лидером военизированного белого гвардия Самфондсвернета он играл важную роль в новом году против республиканского правительства социалистической лейбористской партии."
POLITICS_VIDKUN_QUISLING_DESC: "Видкун Квислинг является военным офицером, бывшим сотрудником по оказанию гуманитарной помощи и сильным противником социализма. Родившимся в Телемарке, Квислинг был сыном норвежской церкви пастора. В молодом возрасте Квислинг был талантливым в гуманитарных науках и специализировался на математике. В молодости он не был уверен, куда его приведет его жизнь. За всю свою жизнь Квислинг дважды женился, как на российских женщинах, принимал участие в гуманитарной работе с национальным героем Фриджофом Нансеном, и был одним из самых завидных противников Республики и социализма. Жизнь поставила его в ранг главы нового норвежского государства, будущее которого еще предстоит увидеть."
POLITICS_STEIN_BARTH_HEYERDAHL_DESC: "Штейн Барт-Хейердаль имеет опыт работы художником и редактором. Он родился в Нордленде, молодой Барт-Хейердаль стал местным лидером-скаутом и в конечном итоге присоединился к "Отечественному Лиге". В то время как Барт-Хейердаль проводит больше времени в политике, и в течение своих лет в Осло он покинул Церковь Норвегии и стал нео-паганом. Барт-Хейердаль был приглашен на создание Насьональ Самлинг и стал фигурой радикального крыла партии. С неопаганскими и пан-германскими взглядами, а также расистскими взглядами, также не было удивлено, что Барт-Хейердаль является сторонником немецкого вальксизма."

