#### Events ####

nor.0.t: "Республика Норвегия"
nor.0.d: "Норвегия стала независимой от Швеции в 1905 году, выйдя из союза, который был установлен между этими нациями. Один из первых вопросов, который был задан народу Норвегии, заключался в том, чтобы мы стали конституционной монархией или республикой. Тогда люди, все мужчины в возрасте 25 лет и старше, проголосовали за монархию. Принц Дании Карл пришел в Норвегию как король Хаакон VII. Несмотря на то, что не все были согласны с монархией. Когда началась Великая война, классные изменения помогли движению рабочих в нашей стране, и после войны рабочий класс стал все беднее, а верхний класс стал богаче. С идеями Карла Маркса все было заложено революцией. Многие могут сказать, что это началось с превращения Дании в диктатуру под их королем. Тот факт, что этот король был герцогством Хакона, не был причиной того, что все рабочие в этой стране стали расти в нашей стране, а затем, после войны, рабочие стали более бедными и монархистами. Большинство политиков в Арбейдерпаритетахе, и полиция были за ними."
nor.0.a: "Евиг ог Тро до Довра Фаллера!"
nor.1.t: "17 мая - День Конституции"
nor.1.d: "Это день 17 мая, день конституции. Этот день ежегодно отмечается как детьми, так и взрослыми, которые ходят по городам, размахивая своими флагами. Все это для празднования дня, когда наша конституция была подписана 17 мая 1814 года. С тех пор Конституция претерпела изменения. Но основной материал в основном выжил, что сделало ее одной из старейших конституций в мире."
nor.1.a: "Ура!"
nor.2.t: "17 мая - День Конституции"
nor.2.d: "Это день 17 мая, день конституции. Этот день ежегодно отмечается как детьми, так и взрослыми, которые ходят по городам, размахивая своими флагами. Все это для празднования дня, когда наша конституция была подписана 17 мая 1814 года. С тех пор Конституция претерпела изменения. Но основной материал в основном выжил, что сделало ее одной из старейших конституций в мире."
nor.2.a: "Ура!"
nor.3.t: ""Лондон Крэш" тоже заражает нас!"
nor.3.d: "Несколько дней назад фондовый рынок в Лондоне рухнул. Некоторые члены правительства и многие члены общества сказали, что мы не пострадаем. Но мы это сделали. После того, как члены Континентального Континенте остановили сегодня все инвестиции и торговлю с нами, мы не полностью готовы к решению этой проблемы. Безработица уже возросла, и государственные компании требуют больше денег и ресурсов. Враги правительства уже начали винить нас. Мы просто должны подождать, что будет завтра в новостях."
nor.3.a: "Транмель произносит речь, обещающую рост, и никаких связей с капиталистами!"
nor.3.b: "Кристенсен выступает с предупреждением против вмешательства правительства!"
nor.3.c: "Кислинг держит речь, обрекшую социалистов на разрушение Норвегии!"
nor.4.t: "Кризис в экономике"
nor.4.d: "Похоже, уровень безработицы перестал расти, и нам повезло в отличие от ситуации в Британии, но здесь тоже не идеально. Хуже всего то, что выборы через несколько дней, и многие говорят, что этот инцидент отвлечёт избирателей от Мартина Транмеля и Арбейдерпарти."
nor.4.a: "Хуже быть не может!"
nor.5.t: "Landslaget для Норске Джордбруксклуббер"
nor.5.d: "С 1920-х годов всегда была идея привлечь молодежь к сельскому хозяйству. Сама идея исходит от американской организации 4-H. Сельские клубы, которые выросли, теперь объединились для организации. В то время как некоторые радикалы рассматривают это как аграрную пропаганду, президент Транмель продемонстрировал свою поддержку этому."
nor.5.a: "Чистая голова, теплое Сердце, хорошие руки и хорошее здоровье!"
nor.6.t: "Рокфолл в Ловенатнете"
nor.6.d: "Не так много часов назад огромная часть горы Рамнефжелла упала в озеро, создав 70-метровую волну наводнения, которая уничтожила многие близлежащие фермы и убила 74 человека."
nor.6.a: "Покойся с миром!"
nor.7.t: "&lt; &lt; Альт за народ Конго &gt; &gt;"
nor.7.d: "Когда из Англии появились новости о рождении принца Харальда, сына наследного принца Олава, монархисты не опоздали организовать протест против Республики."
nor.7.a: "Скоро они устанут."
nor.7.b: "Арестуйте столько, сколько сможете!"

nor.10.t: "Начинается избирательная кампания"
nor.10.d: "Когда Норвегия стала республикой, президент получил работу объявить, когда избирательная кампания должна начаться до выборов. Сегодня президент Танмель объявил, что предвыборные кампании для выборов 1936 года могут начаться. Будут проведены речи и повешены плакаты. В этом году внимание будет сосредоточено на исцелении разногласий слева, но крылья партии имеют другую программу, которая может привести к распаду партии. Венстр будет проводить кампанию за реприватизацию «похищенных» предприятий и их собственного плана социального обеспечения. Они надеются, что как либералы, так и социал-демократы окажут им поддержку. Гёйр будет проводить кампанию за приватизацию важных предприятий и монархии. Они хотят, чтобы консервативные либералы и националисты поддержали их. Есть небольшие партии, но они самые важные."
nor.10.a: "Любопытно каждый раз."
nor.11.t: "Насгородный Самлинг участвовал в выборах"
nor.11.d: "Политическая партия Насьональ Самлинг сыграла незначительную роль на последних выборах, иногда вообще не вмешиваясь в них, но сегодня лидер партии Видкун Кислинг выступил с речью перед Стортингетом, нашим национальным собранием, к нему присоединились некоторые из его партийных товарищей и он привлек около 200 прохожих. Кислинг заявил, что он будет больше участвовать в выборах, и если он и его партия не будут допущены к участию в выборах, это покажет недемократический характер правительства. Полиция готова арестовать Кислинга после его речи."
nor.11.a: "Арестуйте его!"
nor.11.b: "Давайте не будем доказывать ему свою недемократическую природу!"
nor.12.t: "Радикальные социалисты протестуют"
nor.12.d: "Из-за нашего признания речи Кислинга, которая состоялась несколько дней назад, многие радикальные социалисты, профсоюзные активисты и коммунисты протестуют против этого перед Стортингетом. Многие из них хотят, чтобы правые партии были запрещены, а их плакаты говорят: "Нет Квислинг, нет Радер, нет Могенов!""
nor.12.a: "Может, бан сработает."
nor.13.t: "Сэмфондсвернет Протестую "Кислинг""
nor.13.d: "В связи с недавним арестом лидера организации &lt; &lt; Нашунал Самлинг &gt; &gt; Видкун Кислин многие из тех, кто подозревается в принадлежности к правой группировке боевиков под названием &lt; &lt; Самфондсвернет &gt; &gt; , протестуют на улицах нашего столицы и окружающих городов. Они также распространяют &lt; &lt; ложь &gt; &gt; о нашем правительстве, что мы арестовываем националистов и пытаемся арестовать или убить консервативные голоса в парламенте."
nor.13.a: "Может, нам стоит усилить этот бой!"
nor.14.t: "День выборов"
nor.14.d: "Время для предвыборной кампании окончено. Дата выборов наконец-то здесь. Сегодня мы увидим, что воля людей будет реализована. Некоторые говорят, что это может стать еще одной победой для Арбейдерпартиет. Мартин Транмель по-прежнему вдохновляет норвежскую политику. Он уверен, что выиграет третий срок в качестве президента или даст свою позицию новому, надеюсь, в виде объединения. Другие верят в то, что будет сформировано новое правительство. Венстр и Хёйр имеют хорошие шансы в этом году, и многие обвиняют правительство Мадсена в экономической нестабильности. Некоторые хотели бы видеть Мовинкела или Кристенсена новым президентом в Норвегии."
nor.14.a: "Потеряв поддержку, Арбейдерпартиет все еще побеждает."
nor.14.b: "Воровство голосов от AP и Хёйр сделало Венстра победившим."
nor.14.c: "Хёйре удалось выиграть как центр, так и правый."
nor.14.e: "Остановите выборы, это ослабит национальную безопасность!"
nor.15.t: "Новое правительство Арбейдерпартиет"
nor.15.d: "Арбейдерпартиет выиграл выборы и настало время выбрать, кто будет руководить правительством. Есть два варианта: Педер Фуруботн, который хочет установить более тесные связи с Интернационалистами и распространить социализм в Скандинавии, или Аксель Захариассен, который хочет исцелить связи между партией и социальными демократами и хочет защитить демократические ценности."
nor.15.a: "Радикальный Фуруботн!"
nor.15.b: "Умеренный Захариясен!"

nor.16.t: "Массовые протесты против отмененных выборов!"
nor.16.d: "Отмена выборов, похоже, была довольно плохой идеей. Люди по всей стране протестуют, и места в консервативной Западной Норвегии находятся в открытых восстаниях. В других регионах также начинают расти восстания. Многие теперь обращаются к радикальному праву на то, чтобы сделать их &quot; спасшими &quot; норвежскую демократию. Почти все готово для переворота или гражданской войны."
nor.16.a: "Да поможет нам Бог!"

nor.17.t: "Военные дезертиры"
nor.17.d: "Многие наши солдаты заявили, что они не хотят защищать правительство и свои действия."
nor.17.a: "Мы можем даже наказать их?"
nor.18.t: "Морские дезертиры"
nor.18.d: "Военнослужащие из армии не только начали дезертировать, но и военно-морские пехотинцы и офицеры низшего ранга дезертировали, есть даже прибрежный патруль, который отплыл в Данию и присягнул на верность бывшему королю."
nor.18.a: "Что дальше?"
nor.19.t: "Вечеринка разделяется!"
nor.19.d: "Педер Фуруботн недавно заявил, что он будет вести коллективистскую и радикальную часть нашей партии и сформировать новую партию."
nor.19.a: "Ублюдки!"
nor.20.t: "Воскресенье Рождества"
nor.20.d: "Казалось, что Рождество станет мирным событием, но мы ошиблись, города на Западе и Юге начали восстание, тысячи людей вышли на улицу против правительства и президента Транмеля."
nor.20.a: "Я рад, что у нас нет опросов мнений."
nor.21.t: "Восстание в Осло"
nor.21.d: "Протесты продолжаются последние месяцы, но теперь весь город Осло был поглощён огнем восстаний. Самфандсвернет был мобилизован, и при поддержке многих разгневанных мужчин и женщин они начали большой бунт. Многие из наших армейских подразделений либо дезертировали к этим врагам, либо вообще не откликнулись на приказы. Несмотря на замок, охранники либо присоединились к протесту, либо были убиты мятежниками. Камни уже брошены в окна и в резиденцию президента."
nor.21.a: "...Самфондсвернет взломает входную дверь и арестует Транмеля!"
nor.22.t: "Новое правительство Норвегии"
nor.22.d: "Норск Самфандсверн переворотил Норвегию и ее время узнать, какое правительство мы собираемся принять. Некоторые из наших членов хотят дать власть консерваторам, но есть и многие, кто хочет, чтобы мы снова пригласили короля и позволили ему править. И наконец, есть фракция, которая хочет позволить Нашуналу Самлингу захватить власть и контролировать страну. Мы должны посмотреть, за что будет голосовать."
nor.22.a: "Демократия!"
nor.22.b: "Монархия!"
nor.22.c: "Национализм!"

nor.23.t: "Понимание на пути к отмене"
nor.23.d: "В то время как многие злятся на то, что мы отменили выборы, понимание в отношении этих действий начало расти среди населения. Люди начинают понимать, что Норск Самфондсверн не лучше правительства."
nor.23.a: "Мы обещаем выборы в 1940 году"
nor.24.t: "Мирное Рождество"
nor.24.d: "Мы боялись протестов и восстаний в Рождество, но это было относительно мирно, люди не хотят бунтовать в праздничный сезон, и большинство из них решили остаться дома и быть со своими семьями."
nor.24.a: "Хороший выбор!"
nor.25.t: "Недопущенная комбинация"
nor.25.d: "В этот новый день группировка Норска Самфондсверна мобилизовала и пошла по столице, в то время как многие воинские подразделения дезертировали, те, что в Осло, остались лояльными и смогли помешать военизированным группировкам добраться до парламента или замка, они также теряют поддержку населения, и народ Осло дал информацию о том, где прячутся эти предатели."
nor.25.a: "...приказали вытащить боевиков в Осло!"
nor.26.t: "Соглашения с дезертирами"
nor.26.d: "Многие из тех, кто дезертировал из наших вооруженных сил, хотят поговорить с нами о соглашении."
nor.26.a: "Нам нужно вылечить нашу страну и народ!"

nor.30.t: "Активизировать кампании по борьбе с внутренними врагами"
nor.30.d: "Президент приказал усилить кампанию против действий внутренних врагов, таких как монархисты и Норск Самфандсверн."
nor.30.a: "Начали!"
nor.31.t: "Новый референдум монархии"
nor.31.d: "Более десяти лет назад мы отменили монархию, хотя некоторые считают это хорошим вариантом, некоторые из нас больше не уверены в том, что это был правильный выбор, наше правительство проведет новый референдум по этой теме."
nor.31.a: "Большинство для монархии"
nor.31.b: "Большинство населения Республики"
nor.32.t: "Создание независимых радиостанций"
nor.32.d: "В настоящее время монополия на радио официально отменена. С этого момента вы можете отправлять радиосигналы из страны, не будучи арестованными за это. Еще одна вещь заключается в том, что людям разрешается слушать по иностранному радио, в то время как это считается изменой при президенте Транмеле."
nor.32.a: "Пусть люди говорят!"
nor.33.t: "Долгоживущий король Олав V"
nor.33.d: "Нам повезло, когда бывший наследный принц согласился вернуться в страну, и это было похоже на то, когда король Хаакон впервые пришел в нашу страну, члены Норска Самфондсверна и Альта из Конгена встретились с ним на доковом дворе, поприветствовав его, как премьер-министр Мишельсен приветствовал короля Хаакона в 1905 году."
nor.33.a: "Боже благословленный король Олав V!"
nor.34.t: "Долгоживущий король Хаакон VII"
nor.34.d: "Наш славный король, наш монарх, согласился вернуться в Норвегию из Дании. Когда он пришел, его встретили члены Норска Самфондсверна, Альта для Конгена и Нашунал Самлинг. Даже Видкун Кислинг и Рагнвальд Хвослеф были там, чтобы почтить прибытие короля Хаакона, последним из которых был безопасный перевод короля Хаакона во дворец. Вскоре состоится новая коронация."
nor.34.a: "Бог благословленный король Хаакон VII"
nor.35.t: "Король встречается с Кислингом"
nor.35.d: "Наш король недавно договорился о встрече с Видкуном Кислингом, целью которой было заключить соглашение между королем и Нашуналом Самлингом о создании политической партии, чтобы помочь королю править страной. Это поистине опасное и вдохновляющее соглашение."
nor.35.a: "Ради короля и нации"
nor.36.t: "Отдел Нашоналя Самлинга"
nor.36.d: "В то время как политическая партия &quot; Насьональ Самлинг &quot; правит Норвегией, в партии есть разногласия по поводу того, с каким курсом мы пойдем. Одно крыло нашей партии хочет сильного, авторитарного правления с консервативной позицией в отношении религии. Они хотят, чтобы христианство стало единой силой в нашей стране. Другое крыло партии больше заинтересовано в чистом обществе. Многие из них верят в Одина и старых богов и хотят, чтобы ненорвежцы в Норвегии превратились в &quot; Треллов &quot; , или рабов. Нам нужно выяснить, куда мы хотим пойти вместе с партией. Если мы за одну из них, другая тоже разделится."
nor.36.a: "Слава авторам и христианам"
nor.36.b: "Благодать паганам и викинг-фанатикам"
nor.37.t: "Выборы в Королевский совет"
nor.37.d: "Наш новый король, Олав V, установил систему, новую демократию в нашей сфере. Он будет продолжать нести большую часть власти в Норвегии, но его совет больше не будет выбран им, а народом. Он и его лояльные сторонники, в конце концов, сражаются за народ Норвегии. Теперь мы посмотрим, кто будет рукой короля. nnJoakim Lehmkuhl является одним из кандидатов, которые были приняты для участия в выборах короля. Некоторые считаются президентом-монархиста после того, как он позволил, затем брак наследного принца Олава состоится в Осло после того, как была объявлена Республика. Быть членом крупной партии также будет работать на него. n no Joakim Lehmkuhl является еще одним кандидатом, который был принят к баллотировке. Ведущий правый Федрендслагет, поддерживается многими союзниками монархии и королем, а также большой частью норвежских националистов. nnunrudolf Réder, нынешняя рука, является любимым кандидатом от создания Alt for Kongen."
nor.37.a: "Си Джей Хамбро избранная Рука!"
nor.37.b: "Иоахим Лехмкул избранный Рука!"
nor.37.c: "Рудольф Радер продолжит как Рука!"

nor.40.t: "Наши братья в Северной Атлантике"
nor.40.d: "Мы, наконец, отправим ультиматум тем, кто оккупирует наши земли в Северной Атлантике, и покажем им, что мы не согласимся с тем, что у нас есть братья, живущие в условиях иностранной оккупации!"
nor.40.a: "Отправить ультиматум"
nor.40.b: "Давай подождем..."
nor.41.t: "Норвегия требует Северной Атлантики"
nor.41.d: "Норвежцы пришли с требованием передать территории Гренландии, Исландии и Фарерских островов или столкнуться с войной."
nor.41.a: "Ни одной земли до того, как прольется кровь!"
nor.41.b: "Ладно, мы принимаем их требования!"
nor.42.t: "Даты принимают требование"
nor.42.d: "Они согласились с требованием, которое мы им дали, и, возможно, мы сможем быть друзьями, в конце концов, это была большая дипломатическая победа для нашей нации и наших братьев в Северной Атлантике."
nor.42.a: "Хороший выбор!"
nor.43.t: "Даты отвергли спрос"
nor.43.d: "Они отвергли наше благородное требование, и Мы покажем им, что произойдет в случае неверия, или объявим войну, или опустим ее."
nor.43.a: "Мы начали! Мы закончили войну!"
nor.43.b: "Мы не готовы к войне."
nor.44.t: "Норвегия назад"
nor.44.d: "Норвегия отказалась от своих притязаний в Северной Атлантике, но мы думаем, что это не конец."
nor.44.a: "Победа хотя бы для нас!"
nor.45.t: "Норвегия требует Северной Атлантики"
nor.45.d: "Норвежцы пришли с требованием покинуть территории Гренландии, Исландии и Фарерских островов или столкнуться с войной."
nor.45.a: "Ни одной земли до того, как прольется кровь!"
nor.45.b: "Ладно, мы принимаем их требования!"
nor.46.t: "Британцы принимают требования"
nor.46.d: "Они согласились с требованием, которое мы им дали, и, возможно, мы сможем быть друзьями, в конце концов, это была большая дипломатическая победа для нашей нации и наших братьев в Северной Атлантике."
nor.46.a: "Хороший выбор!"
nor.47.t: "Британцы отвергли требование"
nor.47.d: "Они отвергли наше благородное требование, и Мы покажем им, что произойдет в случае неверия, или объявим войну, или опустим ее."
nor.47.a: "Мы начали! Мы закончили войну!"
nor.47.b: "Мы не готовы к войне."
nor.48.t: "Норвегия назад"
nor.48.d: "Норвегия отказалась от их притязаний в Северной Атлантике, но мы думаем, что это не конец."
nor.48.a: "Победа хотя бы для нас!"
nor.49.t: "Мир в Северной Атлантике?"
nor.49.d: "Сейчас мы побеждаем, и мы и наш враг готовы подать в суд за мир."
nor.49.a: "Давай помиримся."
nor.49.b: "Никогда!"
nor.50.t: "Норвегия хочет мира!"
nor.50.d: "Мирные переговоры"
nor.50.a: "Хорошо."
nor.50.b: "Нит"
nor.51.t: "Британия принимает мир"
nor.51.d: "Британцы приняли наше требование о передаче нам североатлантических территорий."
nor.51.a: "Победа!"

nor.52.t: "Наши братья на Востоке"
nor.52.d: "Наконец-то мы отправим ультиматум тем, кто оккупирует Джемтланд и Альфгейм, и покажем им, что мы не согласимся с тем, что у нас есть братья, живущие в условиях иностранной оккупации!"
nor.52.a: "Отправить ультиматум"
nor.52.b: "Давай подождем..."
nor.53.t: "Норвегия требует Бохуслена и Джамтланда"
nor.53.d: "Норвежцы пришли с требованием передать территории Бохуслена и Джамтланда или столкнуться с войной."
nor.53.a: "Ни одной земли до того, как прольется кровь!"
nor.53.b: "Ладно, мы принимаем их требования!"
nor.54.t: "Шведы принимают спрос"
nor.54.d: "Они согласились с требованием, которое мы им дали, и, может быть, мы сможем быть друзьями, в конце концов, это была большая дипломатическая победа для нашей нации и наших братьев в Бохуслене и Джамтланде."
nor.54.a: "Хороший выбор!"
nor.55.t: "Шведы отвергли спрос"
nor.55.d: "Они отвергли наше благородное требование, и Мы покажем им, что произойдет в случае неверия, или объявим войну, или опустим ее."
nor.55.a: "Мы начали! Мы закончили войну!"
nor.55.b: "Мы не готовы к войне."
nor.56.t: "Норвегия отступает"
nor.56.d: "Норвегия отказалась от своих притязаний на Бохуслена и Джамтланда, но мы думаем, что это не конец."
nor.56.a: "Победа хотя бы для нас!"

nor.61.t: "Для королей Скандинавских"
nor.61.d: "Поскольку наши семьи имеют такие прочные связи друг с другом, наш король хочет подписать договор о ненападении и защите с Данией и ее королем Кристианом Х, а также со Швецией и ее королем Густафом В. Надеюсь, что датские и шведские правительства согласятся на это, чтобы сохранить мир и процветание!"
nor.61.a: "Отправляйте письма!"
nor.61.b: "Неважно..."
nor.62.t: "Норвегия хочет Пакта о ненападении и защите"
nor.62.d: "Норвежский король недавно послал нам письмо, содержащее просьбу о заключении договора о ненападении и защите между нами, ними и Данией."
nor.62.a: "Мы бы процветали от этого!"
nor.62.b: "Мы не можем им доверять!"
nor.63.t: "Швеция принимает"
nor.63.d: "Шведские власти приняли наше предложение и договорились о ненападении и защите."
nor.63.a: "Отлично!"
nor.64.t: "Швеция отвергает"
nor.64.d: "Шведы отвергли наше предложение о мире и гармонии."
nor.64.a: "Они могут быть Вармонгером!"
nor.65.t: "Норвегия хочет Пакта о ненападении и защите"
nor.65.d: "Норвежский король недавно направил нам письмо, содержащее просьбу о заключении договора о ненападении и защите между нами, ними и Швецией."
nor.65.a: "Мы бы процветали от этого!"
nor.65.b: "Мы не можем им доверять!"
nor.66.t: "Дания принимает"
nor.66.d: "Датцы приняли наше предложение и договорились о ненападении и защите."
nor.66.a: "Отлично!"
nor.67.t: "Дания отвергает"
nor.67.d: "Датцы отвергли наше предложение о мире и гармонии."
nor.67.a: "Они могут быть Вармонгером!"
nor.68.t: "И Швеция, и Дания согласились!"
nor.68.d: "Оба Королевства Швеции и Дании согласились подписать пакт о ненападении и защите."
nor.68.a: "Долгая жизнь, короли Скандинавских!"

nor.70.t: "Норвегия хочет присоединиться к Штальпакту!"
nor.70.d: "Дипломатический конвой из Норвегии только что прибыл в нашу столицу, норвежцы пришли спросить, могут ли они присоединиться к Штальпакту, что могло бы помочь нам защитить Скагеррак от французских или британских кораблей."
nor.70.a: "Добро пожаловать в Пакт!"
nor.70.b: "Ты нам не нужен!"
nor.71.t: "Германия приветствует нас!"
nor.71.d: "Немцы были готовы впустить нас в свой союз, это, несомненно, станет началом долгой дружбы."
nor.71.a: "Да здравствует Норвегия и Германия!"
nor.72.t: "Немцы отвергают"
nor.72.d: "Немцы имели наглость отклонить нашу скромную просьбу, и это не будет забыто нашим руководством в будущем."
nor.72.a: "Норвегию не нужна Германия!"
nor.73.t: "Норвегия хочет присоединиться к Международному Трайти!"
nor.73.d: "Дипломатический конвой из Норвегии только что прибыл в нашу столицу, норвежцы пришли спросить, могут ли они присоединиться к Международному трейни, что могло бы помочь нам защитить норвежское море от британских кораблей."
nor.73.a: "Добро пожаловать в Интернационал!"
nor.73.b: "Ты нам не нужен!"
nor.74.t: "Советская Россия приветствует нас!"
nor.74.d: "Советы были готовы впустить нас в свой союз, это, несомненно, станет началом долгой дружбы."
nor.74.a: "Да здравствует Норвегия и Советский Союз!"
nor.75.t: "Советы отвергают"
nor.75.d: "Советы были наглы отклонить нашу скромную просьбу, и это не забудется нашим руководством в будущем."
nor.75.a: "Норвегия не нуждается в Советском Союзе!"

nor.76.t: "Норвежцы хотят заключить с нами военно-морское соглашение"
nor.76.d: "Норвегия обратилась к нам с предложением заключить военно-морское соглашение между нашими двумя странами, и они считают, что это сотрудничество принесет пользу нам обоим в долгосрочной перспективе."
nor.76.a: "Хорошо!"
nor.76.b: "Мы не хотим быть вовлеченными"
nor.77.t: "Британцы принимают Соглашение"
nor.77.d: "Британцы приняли военно-морское соглашение между нами и ними."
nor.77.a: "За Норвегию и Британскую Империю!"
nor.78.t: "Британцы отвергают Соглашение"
nor.78.d: "Британцы отвергли военно-морское соглашение между нами и ними, мы немного разочарованы, но то, что может дать нам будущее, до сих пор неизвестно."
nor.78.a: "Какая жалость..."

nor.90.t: "Более длительные избирательные периоды"
nor.90.d: "Недавно наш парламент принял решение продлить избирательный период с трех до четырех лет, и некоторые из них могут рассматривать это как попытку захватить власть у народа и отдать ее политикам, но многие видят, что это помогло бы предоставить этим же политикам больше времени для выполнения своих предвыборных обещаний."
nor.90.a: "Мы должны слушать наш парламент!"
nor.91.t: "Подъём христианской демократии"
nor.91.d: "Многие из наших граждан считают, что основные политические партии настроены на секуляризм. &quot; Даже Хёйр &quot; , предлагая реорганизовать профсоюзы в христианские, считается слишком светским для многих христианских избирателей, поэтому небольшая политическая партия Кристелига Фолкепарти получила все большую популярность, приобретая как социалистических, так и либеральных избирателей, хотя большинство их позиций являются весьма консервативными, они утверждают, что они не находятся на одной стороне политического спектра, однако нет никаких признаков того, что партия будет доминировать, но она будет одним из факторов на предстоящих выборах."
nor.91.a: "Христианская демократия звучит интересно."
nor.92.t: "Ингольф Элстер Кристенсен уволился из политической жизни"
nor.92.d: "Лидер Хёйре, Ингольф Элстер Кристенсен, решил полностью уйти в отставку с политики, он считает, что начинает слишком слаб и стар, чтобы нести ответственность за лидерство своей партии, и хочет вернуться на ферму своей семьи во Фёрде, Карл Иоахим Хамбро теперь станет новым лидером Хёйре."
nor.92.a: "Кристенсен хорошо служил своей вечеринке."

nor.94.t: "Конференция &quot; Арбейдерпартиет &quot; 1940 года"
nor.94.d: "Последние выборы показали миру, что будущее Норвегии принадлежит рабочим и активистам."
nor.94.a: "Мы должны поддержать революцию рабочих в Скандинавии!"
nor.94.b: "Мы не будем связывать себя с капиталистическими странами!"
nor.94.c: "Мы должны сохранить наш нейтралитет!"
nor.95.t: "Вопрос о военной службе"
nor.95.d: "Мы должны выяснить, где мы находимся на военных расходах, в то время как авангарды хотят использовать военных для доставки Революции в другие страны, наше правое крыло хочет сделать нашу страну более мирной."
nor.95.a: "Мы должны защитить и распространить Революцию!"
nor.95.b: "Мы потратим, чтобы защитить то, что у нас уже есть!"
nor.95.c: "Милитаризм - это не путь социализма!"
nor.96.t: "Вопрос экономики"
nor.96.d: "Мы должны выяснить, где наша экономическая позиция. Многие в нашей партии хотят национализировать все, в то время как некоторые хотят, чтобы мы больше принимали частные старты. Нам нужно выяснить, где партия стоит на этом?"
nor.96.a: "Национализируйте все отрасли и фермы ради равноправного общества!"
nor.96.b: "Фермеры - не промышленные магнаты, они имеют право на свою землю!"
nor.96.c: "Частные операторы должны быть допущены, если они следуют нашим правилам!"

nor.99.t: "День выборов"
nor.99.d: "Победа Арбейдерпартии смогла сделать их доминирующей силой на политической сцене в Норвегии. Руководство партии доказало, что социализм может работать хорошо в демократической стране. Но с тем, что Норвегия является демократической страной, будет присутствовать оппозиция. В этих выборах эта оппозиция, представленная Венестром и Хёйром, объединилась в свою собственную коалицию, пытаясь свергнуть правящего Арбейдерпартита. Теперь мы посмотрим, кто победит!"
nor.99.a: "Арбейдерпартиет снова побеждает!"
nor.99.b: "Коалиция "Боргерлиг" побеждает!"

nor.100.t: "Выборы в Верховный совет Норвегии"
nor.100.d: "Сейчас, когда Норвегия превращается в Социалистическую Республику, настало время провести первые свободные выборы в этой социалистической системе. С господством Арбейдерпартиета, гарантируя права рабочих и народа Норвегии, народ может сделать действительно свободный выбор. Хотя радикалы могут выиграть новую победу, есть также возможность для умеренных или даже социальных демократов одержать победу. Теперь мы увидим, кто победит!"
nor.100.a: "Радикальные победы!"
nor.100.b: "Умеренные победители!"
nor.100.c: "Победа правого крыла!"
nor.101.t: "День выборов"
nor.101.d: "Победа Венстра на последних выборах дала хорошую основу как либералам, так и консервантам для предвыборной кампании. Арбейдерпартиет вернулся к политике и надеется спасти страну от капитализма. Теперь мы посмотрим, кто победит!"
nor.101.a: "Умеренные из Арбейдерпартита формируют правительство!"
nor.101.b: "Ещё одна победа для Венстра!"
nor.101.c: "Хёйре удалось победить!"
nor.102.t: "День выборов"
nor.102.d: "Победа Хёйра на последних выборах породила консерватизм, в то время как социализм становится все слабее и слабее. Арбейдерпартиет с 1936 года был вменен в вину экономическим проблемам и не может победить в этот раз. Но новая победа Хёйра, возможно, не будет реальностью. Венстр будет иметь шанс на победу при поддержке как социалистов, так и либералов. Теперь мы посмотрим, кто победит!"
nor.102.a: "Венстр выиграл!"
nor.102.b: "Ещё одна победа для Хёйра!"

nor.104.t: "День выборов"
nor.104.d: "Настало время вновь избрать того, кто будет заседать в нашем парламенте, а оттуда сформировать правительство. Проиграв в 1936 году, Арбейдерпартиет смог восстановить власть и поверить в то, что они смогут возглавить социалистическую коалицию после выборов. Венстр и Хёйр объединились на этот раз, чтобы противостоять социалистической коалиции в своей коалиции Боргерлиг. Почти все социалистические партии согласились на демократию в проведении реформ, и право нашли соглашения в других программах. Теперь мы посмотрим, кто победит!"
nor.104.a: "Социалистическая коалиция побеждает!"
nor.104.b: "Коалиция "Боргерлиг" побеждает!"
nor.105.t: "День выборов"
nor.105.d: "Настало время вновь избрать того, кто будет заседать в нашем парламенте, а затем сформировать правительство. Хотя политические партии Венстр и Хёйре укрепили свою позицию в норвежской политике, все еще будут те, кто проголосует за Арбейдерпартиет и другие социалистические движения. В ответ на это обе партии договорились о коалиционном правительстве, если у них будет большинство. Арбейдерпартиет, в свою очередь, сформировал коалицию между собой и другими социалистическими партиями. Теперь мы посмотрим, кто победит!"

nor.109.t: "Заявление Социалистической Республики!"
nor.109.d: "Сегодня премьер-министр Педер Фуруботн объявил о новом направлении для Норвегии, что народ Норвегии больше не будет затаскиваться буржуазными структурами парламентской демократии. Сегодня народ увидит себя свободным в Социалистической Республике!"
nor.109.a: "Да здравствует революция!"

nor.110.t: "Президентские выборы 1936 года"
nor.110.d: "В связи с парламентскими выборами, приведшими к новой победе для Арбейдерпартиет, у партии также есть большая возможность получить пост президента. Собрав новый парламент, настало время для того, чтобы эти представители народа проголосовали за то, кто станет следующим президентом Норвегии. С завершением первого тура голосования в ходе второго тура появляются два кандидата. ~ nn/Incombent президент Мартин Транмель ищет новый срок в качестве президента. Даже если экономический кризис повлиял на последние недели его первого срока полномочий, он заверяет, что президент и правительство смогут вывести Норвегию из последнего состояния капитализма. ~ nnTranmäl противник Ингольфа Эльстера Кристенсена из Хёйре. Кристенсен надеется объединить политических правых в антисоциалистском блоке, надеясь, что либералы и социальные демократы смогут проголосовать за него. Даже если он выиграет, однако, его власть и влияние будут ограничены социалистическим правительством."
nor.110.a: "Транмель легко выигрывает второй срок"
nor.110.b: "Кристенсен руководит победой в президентстве"

nor.111.d: "С парламентскими выборами, приведшими к победе в Венстре, у партии также есть возможность выиграть президентство. Однако это не гарантировано при участии действующего президента Мартина Транмеля. С новым парламентом настало время для того, чтобы эти представители народа проголосовали за то, кто станет следующим президентом Норвегии. С завершением первого тура голосования два кандидата появляются во втором туре. В ответ на это Йохан Людвиг Мовинкель, возможно, сможет выиграть второй срок, даже если его партия проиграет парламентские выборы. Если ему удастся заручиться поддержкой социал-демократов, у него будет небольшое большинство голосов. nnwith Venstre обгон Хёйре на парламентских выборах, это, в свою очередь, сделало Йохана Людвига Мовинкела кандидатом, который встретится с Транмелем во втором раунде. Мовинкель, возможно, сможет объединить широкую коалицию против Транмеля, завоевав победу своей партии."
nor.111.a: "Небольшое левое большинство дает тротуару второй срок"
nor.111.b: "Широкая коалиция делает Мовинкеля президентом"

nor.112.d: "С парламентскими выборами, принесшими победу и Хёйре, у партии также есть возможность выиграть президентство. В то время как у Транмеля все еще есть шанс, у правого крыла есть надежда на «демонтаж» социалистического президента. Собрав новый парламент, настало время для того, чтобы эти воспоминатели народа проголосовали за то, кто станет следующим президентом Норвегии. С первым туром голосования два кандидата появляются во втором туре. Нн Ннхольф Эльстеренсен из Гёйре. Кристенсен надеется объединить политические правые партии в антисоциалистском блоке, надеясь получить поддержку либералов и, возможно, даже несколько либералов, чтобы голосовать за него. Его победа также обеспечит сохранение его партии."
nor.112.b: "Кристенсен выигрывает с Объединенной коалицией"

nor.113.t: "Президентские выборы 1940 года"
nor.113.d: "Сейчас, после парламентских выборов, пришло время проголосовать за то, кто станет следующим президентом Норвегии. Поскольку Арбейдерпартиет фактически играет доминирующую роль в норвежской политике, выборы будут охватывать только один раунд. Вопрос состоит в том, кто из нашей партии станет президентом, поскольку Мартин Транмель на этот раз не ищет срока. nnEinar Gerhardsen рассматривается как близкий родственник Мартина Транмеля, который является членом его круга в 1920-х и 30-х годах. Герхардсен представляет умеренную фракцию в Арбейдерпарти, желая продолжить линию Мартина Транмеля. nnhaavard Langset represents радикальное крыло Арбейдерите, и является одним из ближайших к Советскому Союзу среди кандидатов на пост президента. Его президентство будет отчуждать некоторых из наших самых умеренных членов, так что это может быть не лучшим выбором. nnJohan Nigavardsvold действительно представляет Нордемакратеда Арбейда, партию, которая также может отколоться от партии, которая может отколоться от Арбейда."
nor.113.a: "Эйнар Герхардсен"
nor.113.b: "Хаавар Лэнгсет"
nor.113.c: "Йохан Найгардсволд"

nor.114.t: "Наш кандидат на пост президента"
nor.114.d: "После парламентских выборов выборы в президенты в настоящее время проходят в эфире. Мартин Транмель не желает быть избранным на новый срок, пара кандидатов выдвинулись в Арбейдерпартиет. Нн Эйнар Герхардсен является кандидатом, поддерживаемым Транмелем, и представляет умеренных в партии. Герхардсен имеет предысторию вокруг Транмеля и разделяет многие его социалистические идеи. Нн Хаавард Лангсоль представляет радикальное крыло Арбейдерпартиет и поддерживает Советский Союз, скептически относясь к парламентской демократии. Его кандидатура может привести к отчуждению некоторых умеренных, с незначительными шансами на получение социальных демократов для его поддержки. Нн Йохан Нигардсволд также выдвигается в качестве кандидата. Хотя он является членом Норджеса Социдекортике Арбейдерпарти, его кандидатура может получить поддержку либеров и политиков в центре. Но это может быть и отчуждать радикальных членов Арбейдерпарта, даже если бы он выиграл."
nor.114.a: "Герхардсен, наследник Транмеля"
nor.114.b: "Лэнгсет, истинный социалист"
nor.114.c: "Найгардсволд, чужак"

nor.115.t: "Президентские выборы 1940 года"
nor.115.d: "Сейчас, после парламентских выборов, пришло время проголосовать за то, кто станет следующим президентом Норвегии. Собрав парламент, настало время для того, чтобы эти представители народа проголосовали за то, кто станет следующим президентом Норвегии. С завершением первого тура голосования, кажется, что два кандидата будут баллотироваться во втором раунде. ~ nn-NEinar Gerhardsen является кандидатом, поддерживаемым Арбейдерпартиетом и другими социалистическими деятелями в парламенте. Он рассматривается как близкий родственник Мартина Транмеля, ведущего члена Арбейдерпарти, и, как представляется, продолжится по стопам президента Транмеля. В целом, безопасный кандидат, если Арбейдерпартет тоже хочет выиграть президентские выборы. ~ n/NArtur Nordlie является кандидатом, поддерживаемым политическим правом, будучи членом Хёйре. Он надеется заручиться поддержкой всех антисоциалистских сил в Норвегии, чтобы выиграть эти выборы. Но с победой Арбейдерпартиетта на парламентских выборах, он будет немного непобедим."
nor.115.a: "Эйнар Герхардсен победил!"
nor.115.b: "Артур Нордли получает сюрприз!"

nor.116.d: "Сейчас, после парламентских выборов, пришло время проголосовать за то, кто станет следующим президентом Норвегии. Собранным парламентом настало время для того, чтобы эти воспоминатели народа проголосовали за то, кто станет следующим президентом Норвегии. С приближением первого тура голосования, похоже, два кандидата будут баллотироваться во втором раунде. ~nnahaaver Langsete является кандидатом при поддержке Арбейдерпартита и других социалистов в парламенте. Несмотря на поддержку правящей партии, его победа все еще не обеспечена. Будучи радикалом, он может сделать несколько умеренных в Арбейдерпартиете воздержания от голосования или голосования против него, вместо этого. ~ nnranthur Nordlie является кандидатом, поддерживаемым политическим правом, будучи членом Хёйре. Он надеется заручиться поддержкой всех антисоциалистских сил в Норвегии, чтобы выиграть эти выборы. Но с победой Арбейдерпарти на парламентских выборах он вряд ли победит."
nor.116.a: "Хаавар Лэнгсет - победитель!"

nor.117.d: "Сейчас, после парламентских выборов, настало время проголосовать за то, кто станет следующим президентом Норвегии. Собрав парламент, настало время для того, чтобы эти воспитатели народа проголосовали за то, кто станет следующим президентом Норвегии. С завершением первого тура голосования, похоже, что два кандидата будут баллотироваться во втором раунде. ~n Johan Nigardsvold является кандидатом при поддержке как правящего Арбейдеррита, так и его собственной партии, Норджеса Социалдемократке Арбейдерпарти. Несмотря на то, что в Арбейдерпарте нет большого призыва к радикалам, он рискует заставить многих из них воздержаться от голосования, он мог бы обратиться ко многим в политическом центре. ~ Не Артур Нордли является кандидатом, поддерживаемым политическим правом, будучи членом Хёйре. Он надеется заручиться поддержкой всех антисоциалистских сил в Норвегии, чтобы выиграть эти выборы. Но с победой Арбейдерпартиета на парламентских выборах, он немного победит."
nor.117.a: "Йохан Найгардсволд Каррис победитель!"

nor.118.t: "Наш кандидат на пост президента"
nor.118.d: "После парламентских выборов новая правительственная партия Хёйр имеет право выбрать, кто станет их кандидатом в президенты Норвегии. Хотя есть некоторые аргументы, что кандидат на предыдущих выборах стоит в этом раунде, есть голоса, которые хотят новой крови. nn nranthur Nordlie является новым любимым кандидатом в партии. Его кандидатура может не значить много в случае Хёйре, вне того, как он получил новую кровь в президенте. Ингольф Эльстер Кристенсен также является кандидатом, будучи кандидатом на Хёйре в 1936 году. Оба кандидата означают, что Хёйре будет контролировать Президиум, если они выиграют. ~n /Последний ценный кандидат - это Нильс Трёдал из Бондепартиет. Trédal мог бы работать в качестве более привлекательного кандидата как для политиков из Венстре, так и АНБ. Но эта стратегия может оттолкнуть некоторых членов в Хёйре, которые считают, что мы должны поддержать кандидата от нашей партии."
nor.118.a: "Нордли, новый кандидат"
nor.118.b: "Кристенсен, старый кандидат"
nor.118.c: "Тредал, чужак"

nor.119.d: "Сейчас, когда парламентские выборы закончились, пришло время проголосовать за то, кто станет следующим президентом Норвегии. Похоже, что два кандидата будут баллотироваться во втором раунде."
nor.119.a: "Артур Нордли победитель!"
nor.119.b: "Эйнар Герхардсен получает сюрприз!"

nor.120.d: "Сейчас, когда парламентские выборы закончились, пришло время проголосовать за то, кто станет следующим президентом Норвегии."
nor.120.a: "Ингольф Элстер Кристенсен побеждает!"

nor.121.d: "Сейчас, после парламентских выборов, пришло время проголосовать за то, кто станет следующим президентом Норвегии. Похоже, что два кандидата будут баллотироваться во втором раунде."
nor.121.a: "Нильс Тредал Каррис победитель!"

nor.122.t: "Наш кандидат на пост президента"
nor.122.d: "После парламентских выборов правящая партия Венстре имеет право выбрать, кто станет их кандидатом на пост президента Норвегии. Хотя есть некоторые голоса за предыдущего кандидата на выборах, некоторые также выставляют голос за нового кандидата. Ннн Арн Сунде является потенциальным кандидатом, отмечая себя в качестве адвоката и политика, близкого к Йохану Людвигу Мовинкелю. Его образование и работа хорошо подходят для кого-то, кто станет президентом Норвегии. Нн Йохан Людвиг Мовинкель также является надежным кандидатом, с его историей в качестве иностранного, торгового и премьер-министра на протяжении многих лет, и его вкладом в дело Лекса Мовинкела. Даже если он и сбежал раньше, он может быть хорошим кандидатом."
nor.122.a: "Санде, адвокат"
nor.122.b: "Мовинкель, ветеран-политик"
nor.122.c: "Тредал, чужак"

nor.123.d: "Сейчас, после парламентских выборов, пришло время проголосовать за то, кто станет следующим президентом Норвегии. Похоже, что два кандидата будут баллотироваться во втором раунде."
nor.123.a: "Арне Санде - новый президент!"

nor.124.d: "Сейчас, после парламентских выборов, пришло время проголосовать за то, кто станет следующим президентом Норвегии."
nor.124.a: "Йохан Людвиг Мовинкель победил!"

nor.130.t: "Выборы в Королевский совет"
nor.130.d: "Новые выборы в совет короля Олава V были проведены. Похоже, что те же самые кандидаты попытаются получить титул короля в этом избирательном сезоне, но есть и некоторые изменения. nnC. J. Hambro возвращается на эти выборы для того, чтобы стать рукой короля Олава. Придя из Хёйре, одной из крупнейших партий Норвегии, он сможет заслужить поддержку многих политических деятелей. Наряду с некоторыми в отношении него как монархиста он может получить поддержку и от монархистов. nnyls Lavik является новым кандидатом, принятым для участия в выборах в качестве руки короля. Лидером правого движения &lt; &lt; Христианская иннерская миссия &gt; &gt; ему удалось завоевать популярность среди более консервативных и христианских частей Норвегии, на юге и на Западе. nnJoakim Lehmkul также был принят для участия в выборах в качестве кандидата на должность короля."
nor.130.a: "С.Дж. Хамбро"
nor.130.b: "Нильс Лавик"
nor.130.c: "Йоаким Лехмкул"
nor.130.d: "Рудольф Райдер"

nor.200.t: "Начинается перераспределение"
nor.200.d: "Начат процесс перераспределения земли от богатых землевладельцев в руки промышленных рабочих и низших классов."
nor.200.a: "Давайте начнём!"

