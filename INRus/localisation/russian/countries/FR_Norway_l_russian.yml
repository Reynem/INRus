NOR_hoyre_victory: "Хёйр Победа"
NOR_hoyre_victory_desc: "В большинстве случаев левые ненавидят Хёйре, но у них есть веские причины для победы, они смогли привлечь как либералов, так и консерваторов, и многие из них с самого начала неохотно поддерживали их."
NOR_right_wing_cooperation: "Сотрудничество с правым крылом"
NOR_right_wing_cooperation_desc: "Несоциалистские партии имеют общего политического оппонента в социалистической лейбористской партии, поэтому вполне естественно, что мы собираемся вместе в коалиции против них, хотя и будут компромиссы, по крайней мере, это лучше, чем рисковать социалистическим правительством."
