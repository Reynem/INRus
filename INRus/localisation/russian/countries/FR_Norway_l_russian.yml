#### Ideas ####

NOR_socialism_surrounded_idea: "Социализм окружён"
NOR_socialism_surrounded_idea_desc: "Мы, Республика Норвегия, управляем социалистическим правительством, окруженным консервативными и националистическими режимами, на западе Бритийская империя правит нашими морями, на юге датчане ждут, чтобы атаковать и отдать трон бывшему королю, на востоке, шведы видят возможность вновь собрать союз, но с их руководством, а на севере белые финны восстают против Советского Союза, мы должны проповедовать единство и оборону в то время, когда мы действительно окружены странами, которые хотят нашей смерти."
NOR_monarchist_right_idea: "Правый монархист"
NOR_monarchist_right_idea_desc: "С момента отмены монархии в 1926 году либералы и консерваторы стали главными сторонниками промонархистского выбора, что было продемонстрировано, когда президент Хамбро разрешил брак между наследным принцем Олавом и шведской принцессой Мартхой в столице Осло, хотя буржуазные партии сыграли свою роль в конституционной реформе 1926 года, они не боятся показать свои позиции монархистов."
NOR_monarchist_right_idea1: "Правый монархист"
NOR_war_on_samfundsvernet_idea: "Война против Samfundsvernet"
NOR_war_on_samfundsvernet_idea_desc: "Сэмфондсвернет был создан буржуазией в качестве оружия против рабочего класса в 1923 году. С тех пор это не изменилось. Они были запрещены к началу Нового года в 1931 году, но они ушли в подполье. Во главе с офицерами НС они представляют большую опасность для страны и много раз пытались начать гражданскую войну в стране за последние пять лет. Они все еще представляют угрозу для народа и государства, и с ними нужно бороться, чтобы предотвратить гражданскую войну или переворот!"
NOR_war_on_samfundsvernet_idea1: "Война против Samfundsvernet"
NOR_samfundsvernets_rule_idea: "Samfundsvernet — Рулинг Норвегия."
NOR_military_deserters_idea: "Военные дезертиры"
NOR_military_deserters_idea_desc: "Многие солдаты дезертировали из армии против недемократического выбора, сделанного правительством."
