NOR_venstre_victory: "Вентральная победа"
NOR_venstre_victory_desc: "Несмотря на то, что многие удивляются тому, что Венстр выиграл, эксперты видят, почему они получали поддержку от большего числа людей, чем от Хёйра, и подружились как с социальными демократами, так и с либеральными консервантами с их поддержкой социального обеспечения и частных инициатив."
