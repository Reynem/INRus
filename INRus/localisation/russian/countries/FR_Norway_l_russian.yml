#### Focus Tree ####

NOR_economical_projects: "Экономические проекты"
NOR_economical_projects_desc: "Несмотря на то, что положение дел может быть большим, большинство людей согласны с тем, что нам нужно двигаться вперед."
NOR_lower_corporate_tax: "Низкий корпоративный налог"
NOR_lower_corporate_tax_desc: "Нам нужно снизить корпоративный налог, чтобы у этих промышленников был шанс помочь нам продвинуть нашу страну."
NOR_encourage_private_growth: "Поощрение роста частного сектора"
NOR_encourage_private_growth_desc: "Многие частные корпорации были основой нашей экономики и ее времени для того, чтобы вернуть ее."
NOR_privatize_more_industries: "Дальнейшая промышленная приватизация"
NOR_privatize_more_industries_desc: "Мы должны приватизировать больше нашей промышленности. Слишком многое контролируется государством. Хотя некоторые меры контроля хороши, частные люди могут быть гораздо лучше, чем мы."
NOR_expand_outskirt_industry: "Расширить индустрию швейной промышленности"
NOR_expand_outskirt_industry_desc: "Нам необходимо совершенствовать и расширять индустрию нашей внешкольной индустрии в наших округах, а также содействовать урбанизации и модернизации городов и районов Норвегии."
NOR_western_dockyards: "Западные докьярды"
NOR_western_dockyards_desc: "Для создания нового сильного флота Норвегии нам нужны новые верфи, мы должны начать расширять морские порты и доки прибрежных городов на нашем западном побережье."
NOR_western_railways: "Западные железные дороги"
NOR_western_railways_desc: "Железнодорожная система на западе Норвегии является плохой, и многие места не видят чудес современного транспорта, мы строим туннели и мосты и свяжем этот регион ближе к стране."
NOR_northern_railway_project: "Проект строительства северных железных дорог"
NOR_northern_railway_project_desc: "Наша северная железная дорога, "Nordlandsbanen", далеко не закончена. Хотя люди и товары в их нынешнем виде могут быть перевезены в коммуну Гронг, мы должны работать над тем, чтобы железная дорога шла из Трондхейма в Бодё."
NOR_exploit_northern_industries: "&lt; &lt; Эксплуатация в северном секторе промышленности &gt; &gt;"
NOR_exploit_northern_industries_desc: "Промышленность наших северных графств невелика и крайне ограничена, и мы должны использовать ее и укреплять нашу экономику."
NOR_expand_aluminium_industry: "Расширение гидроалюминия"
NOR_expand_aluminium_industry_desc: "Норвегия располагает многими природными ресурсами, одним из которых является алюминий, и мы получили информацию о потенциальных запасах алюминия в горных районах нашей страны, и мы будем использовать этот потенциал."
NOR_expand_university_oslo: "Расширить Университет Осло"
NOR_expand_university_oslo_desc: "Университет Осло является старейшим и самым высоким университетом Норвегии, и мы должны содействовать развитию новых инноваций и исследований, и как лучше сделать это, чем расширить наш самый дорогой университет."
NOR_expand_steel_industry: "Расширить Норск Йернверк"
NOR_expand_steel_industry_desc: "Железо и сталь также являются ресурсом, который мы можем найти в нашей стране. В наших северных графствах мы также обнаружили потенциал для новых железных рудников. Это может помочь нашей стране в меньшей степени зависеть от импорта стали."
NOR_strenghten_nationalized_sector: "Укрепление национального сектора"
NOR_strenghten_nationalized_sector_desc: "Мы должны укрепить национализированный сектор, чтобы защитить рабочих от жадности частных промышленников!"
NOR_expand_state_arms_industries: "Расширить Kongsberg Vopenfabrikk"
NOR_expand_state_arms_industries_desc: "Мы должны расширить наши возможности по производству оружия. С новым расширением Конгсберга Вопенфабрика у нас будет гораздо более сильная военная индустрия."
NOR_introduce_industrial_quotas: "Введение промышленных квот"
NOR_introduce_industrial_quotas_desc: "Мы должны ввести новые квоты для наших заводов, что поможет нам еще больше укрепить нашу экономику, поскольку Норвегия имеет ограниченный промышленный потенциал."

NOR_london_crash_reactions: "Реакция на Лондонскую катастрофу"
NOR_london_crash_reactions_desc: "Хотя нам удалось устранить британское влияние из Норвегии, глобальные экономические последствия катастрофы негативно скажутся на нас, поскольку у нас и у нас в Лондоне имеется много общих торговых партнеров."
NOR_stimulus_tactic: "Стимулическая тактика"
NOR_stimulus_tactic_desc: "Норвежский народ не заслуживает, чтобы его наказывали мерами жесткой экономии, когда мы не виноваты в том, что боремся с этим."
NOR_inplement_government_control: "Осуществление контроля со стороны правительства"
NOR_inplement_government_control_desc: "Для решения экономической проблемы мы должны взять на себя больший контроль над экономикой и промышленностью, и мы надеемся, что это поможет нам в конечном итоге."
NOR_new_farmer_quotas: "Новые квоты для фермеров"
NOR_new_farmer_quotas_desc: "С введением новых квот для наших фермеров, на которых они будут полагаться, что сделает их главной опорой нашего общества, мы сможем стимулировать экономику."
NOR_establish_labour_welfare_administration: "Создание Управления по вопросам труда и социального обеспечения"
NOR_establish_labour_welfare_administration_desc: "Чтобы помочь безработным вернуться в рабочую силу и должным образом обеспечить благосостояние, мы создадим администрацию, которая будет заниматься этим вопросом и помогать стране лучше."
NOR_sieze_highclass_wealth: "Захват высококлассного богатства"
NOR_sieze_highclass_wealth_desc: "В то время как мы проделали хорошую работу, забрав богатство у богатых и отдав его народу, на этот раз мы должны принять более прямые меры."
NOR_corn_import_tariffs: "Импортные тарифы на кукурузу"
NOR_corn_import_tariffs_desc: "Мы должны установить тарифы на импорт иностранной кукурузы и других продуктов питания, которые мы можем сами производить."
NOR_stabalized_economy: "Стабилизированная экономика"
NOR_stabalized_economy_desc: "В настоящее время наша экономика наконец стабилизировалась, и мы продемонстрировали, что меры жесткой экономии не всегда являются наилучшим вариантом."
NOR_austerity_tactics: "Осторожность тактика"
NOR_austerity_tactics_desc: "Стимулирование экономики не будет работать в долгосрочной перспективе, а вместо этого мы сосредоточим внимание на сокращении помощи в целях развития и благосостояния, а также на укреплении налогов до тех пор, пока мы не восстановим свои экономические проблемы."
NOR_cut_development_aid: "Сокращение помощи в целях развития"
NOR_cut_development_aid_desc: "Мы не очень-то помогаем третьему миру, но мы видим, что эта помощь ухудшает ситуацию для нас. Мы должны сокращать помощь в целях развития. Народы мира должны зависеть от самих себя."
NOR_close_unprofitable_businesses: "Закрыть неприбыльные предприятия"
NOR_close_unprofitable_businesses_desc: "Некоторые предприятия в нашей стране сжигают больше, чем они делают. Пора закрыть их и показать, что мы не можем тратить деньги и ресурсы впустую."
NOR_increase_taxes: "Увеличение налогов"
NOR_increase_taxes_desc: "Несмотря на то, что никто не любит платить налоги, мы должны преодолеть экономические трудности, которые затронули нашу страну."
NOR_temporary_rations: "Временные пайки"
NOR_temporary_rations_desc: "Нам не нужно, чтобы ситуация ухудшилась, сейчас, когда она улучшается, эти пайки могут также научить людей не слишком сильно жаждать."
NOR_end_austerity: "Осторожность конца"
NOR_end_austerity_desc: "Наконец-то мы можем положить конец мерам жесткой экономии. И наконец, наша страна преодолена из-за этих трудностей. Скоро Норвегия вырастет, и наша экономика станет самой великой!"
NOR_reformalize_commonwealth_trade: "Реформализация торговли стран Содружества"
NOR_reformalize_commonwealth_trade_desc: "В то время как торговые отношения, связанные с Великобританией, привели к катастрофе, сейчас, когда наступили лучшие времена, британцы, кажется, сильнее, чем когда-либо."
NOR_british_naval_agreements: "Британские военно-морские соглашения"
NOR_british_naval_agreements_desc: "Мы должны подойти к англичанам, чтобы подписать соглашение о том, как сбалансировать нашу власть в Северном море, с тем чтобы сотрудничать как в войне, так и в мире и уважать воды и океаны каждой нации."
NOR_break_with_british_trade: "Перерыв с британской торговлей"
NOR_break_with_british_trade_desc: "Британцы и их влияние в Европе и мире чуть не разрушили нас! Почему мы должны лежать во рту одного льва? Мы найдем друзей получше, с которыми мы будем торговать, чем эти британцы."
NOR_strenghten_soviet_trade_routs: "Укрепить советские торговые маршруты"
NOR_strenghten_soviet_trade_routs_desc: "Советский Союз отошел от капитализма. Некоторые из нас считают, что на нас повлияла темная сторона капитализма. Поэтому мы должны попытаться прекратить торговлю со странами капитализма и сосредоточиться на торговле с Советскими государствами."
NOR_strenghten_german_trade_routs: "Укрепить немецкие торговые маршруты"
NOR_strenghten_german_trade_routs_desc: "Немцы сами развились."

NOR_new_army_plan: "Новый армейский план"
NOR_new_army_plan_desc: "Мы должны найти новый план в отношении нашей армии и ее стратегий."
NOR_specialized_army: "Специализированная армия"
NOR_specialized_army_desc: "Нам не нужна армия, сосредоточенная на больших количествах, нам нужна армия огня и стали с профессиональными солдатами и хорошим снаряжением."
NOR_anti_milita_act: "Закон о борьбе с милитией"
NOR_anti_milita_act_desc: "Мы не можем позволить ополчению продолжать свою деятельность в стране, нам удалось запретить многие крайне правые группировки, но они не уйдут, если все остальные смогут иметь военизированные силы."
NOR_improve_ski_divisions: "Совершенствование лыжных отделов"
NOR_improve_ski_divisions_desc: "Нам нужно улучшить и улучшить наши элитные лыжные дивизии, они одни из лучших лыжников в мире и хорошо тренируются."
NOR_artillary_prefrences: "Артиллерийские преференции"
NOR_artillary_prefrences_desc: "Нам нужна артиллерия, которая может продемонстрировать силу и представлять огромную опасность для наших врагов."
NOR_defence_against_land_skies: "Защита от земли и неба"
NOR_defence_against_land_skies_desc: ""
NOR_establish_motorized_units: "Создание моторизованных единиц"
NOR_establish_motorized_units_desc: "Ночные солдаты борются за то, чтобы в разумные сроки пересечь огромные расстояния по сравнению с нашими промышленно развитыми соседями."
NOR_strong_in_numbers: "Прочность в цифрах"
NOR_strong_in_numbers_desc: "Норвежское население может быть относительно небольшим, но ее земля обширна и разнообразна. Если мы сможем защитить ее, нам нужно больше мужчин и женщин, служащих в армии. Нам нужно много эффективного оружия и хорошего планирования."
NOR_provide_new_equipment_manuals: "Новые руководства по оборудованию"
NOR_provide_new_equipment_manuals_desc: "Люди, работающие на фабриках, получат пособия по производству стрелкового оружия, что облегчит производство оружия."
NOR_new_production_quotas: "Новые квоты производства"
NOR_new_production_quotas_desc: "Наши военные фабрики даже не производят оружие в полном объеме, нам нужна минимальная квота, мы покажем им, чего мы от них ожидаем."
NOR_start_state_milita: "Обнаружена Госдепартаментская армия"
NOR_start_state_milita_desc: "Мы будем бороться с огнем, раздавить буржуазные ополчения своими собственными, это проще, чем вообще запретить деятельность боевиков."
NOR_milita_doctrines: "Доктрины милиции"
NOR_milita_doctrines_desc: "Лояльные ополчения, с которыми мы контактируем, предложили научить армию своей тактике и доктринам."
NOR_experienced_general_staff: "Опытный генеральный штаб"
NOR_experienced_general_staff_desc: "Нам нужен настоящий генеральный персонал, а не то, что у нас сейчас есть с этими непроверенными офицерами."
NOR_general_doctrines: "Общие доктрины"
NOR_general_doctrines_desc: "Какими бы военными ни были наши планы, мы должны научить солдат основным общим доктринам и тактике."

NOR_norwegian_navy: "Норвежский флот"
NOR_norwegian_navy_desc: "Наш флот не в лучшей форме, мы должны начать планировать направление, которое мы будем делать с нашим флотом, мы можем сосредоточиться на малых, прибрежных кораблях и подводных лодках, или на больших кораблях и на контроле над нашим морем."
