NOR_1936_election: "Выборы 1936 года"
NOR_1936_election_desc: "Настало время для выборов 1936 года. Многие догадывались в нашей стране и за рубежом, что эти выборы станут поворотным пунктом в Норвегии, ее политике и истории. Националистическая воинственная группа, называющая себя «Самфондсвернет», пыталась захватить власть. Но наша демократия все еще стоит!"

