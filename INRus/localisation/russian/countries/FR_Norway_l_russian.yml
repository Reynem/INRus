NOR_limit_political_extremism_desc: ""
NOR_remove_economic_regulations: "Удалить экономические правила"
NOR_remove_economic_regulations_desc: ""
NOR_uphold_liberal_democracy: "Поддерживать либеральную демократию"
NOR_uphold_liberal_democracy_desc: "Наша страна и наша страна никогда не должны оказаться втянутыми в крайности политики, и мы, которые формируют демократический блок норвежской политики, социалистов, либералов или консерваторов, должны оказаться в состоянии согласиться с тем, что демократия важна для всех нас."

NOR_samfundsvernets_coup: "Кубок Samfundsvernet"
NOR_samfundsvernets_coup_desc: "Теперь наши люди маршируют по улицам норвежских городов, мы наконец спасли страну от социалистической дистопии, мы выясним, что делать с социалистическими предателями, но пока Норвегия может отпраздновать эту победу!"

NOR_monarchist_victory: "Победа монархиста"
NOR_monarchist_victory_desc: "В то время как командир Рагнвальд Хвослеф хочет, чтобы Видкун Кислинг стал президентом-посланником, большинство членов Норска Самфондсверна проголосовали за восстановление монархии."
NOR_crown_prince: "Наследный принц"
NOR_crown_prince_desc: "Мы боимся, что король Хаакон может быть слишком заинтригован аболутистской идеологией, что он не будет слушать народ, а вместо этого будет править жесткой рукой, но его сын, наследный принц Олав, может быть мудрым выбором, поскольку он больше верит в то, что он король народа."
NOR_lissen_to_people: "Слушайте людей"
NOR_lissen_to_people_desc: "Новый царь понимает, что власть его исходит не от богатства и влияния, а от воли народа; царь ослабит правила, которые направлены на свободу слова, и хочет, чтобы противник его говорил с ним, чтобы он мог слушать и править более мудро; это также укрепит одобрение царя общественностью."
NOR_gain_bipartisan_support: "Заслужить двухпартийную поддержку"
NOR_gain_bipartisan_support_desc: "Король нуждается в поддержке большинства политических партий, эти организации и те, кто голосовал за них, должны уважаться, пока они преданы королю, они смогут прийти с просьбами к королю."
NOR_reestablish_parliament: "Восстановление парламента"
NOR_reestablish_parliament_desc: "Когда страна была спасена от когтей социализма, парламент был, к счастью, распущен. Теперь, когда все стабилизировалось, пришло время восстановить парламент Норвегии, Стортингет."
NOR_kings_party_for_all: "Королевская партия для всех"
NOR_kings_party_for_all_desc: "Нам нужна королевская партия, которая могла бы заставить народ услышать голос королю, сохраняя верность нашему монарху, всегда важно, чтобы мы не превращались в автократов и деспотов, чтобы народ имел свой голос и свое представительство через Королевскую партию!"
NOR_purge_republicans: "Уничтожить республиканцев"
NOR_purge_republicans_desc: ""
NOR_force_for_moderation: "Сила умеренности"
NOR_force_for_moderation_desc: ""
NOR_loyalist_propaganda: "Пропаганда лоялистов"
NOR_loyalist_propaganda_desc: ""
NOR_cut_economic_regulations: "Отруб, экономические правила"
NOR_cut_economic_regulations_desc: ""
NOR_gain_support_lower_christianity: "Заслужить поддержку в низшей церкви"
NOR_gain_support_lower_christianity_desc: ""
NOR_strengthen_royal_patriotism: "Укреплять королевский патриотизм"
NOR_strengthen_royal_patriotism_desc: ""
NOR_the_king: "Король"
NOR_the_king_desc: "Это измена сказать, что мы должны выбрать бывшего наследного принца в качестве короля, когда настоящий король еще жив."
NOR_assure_loyalty_police: "Доверие к полиции"
NOR_assure_loyalty_police_desc: ""
NOR_royal_privleges: "Королевские привилегии"
NOR_royal_privleges_desc: "В некоторых обществах сегодня к королевским царям относятся как к неважным людям, но реальность такова, что такая вера сама по себе является изменой."
NOR_royal_enterprices: "Королевские предприятия"
NOR_royal_enterprices_desc: "Нельзя исключать монарха из владения индустрией в нашей стране."
NOR_punish_socialist_symphantizers: "Наказание сочувствующих социалистов"
NOR_punish_socialist_symphantizers_desc: ""
NOR_ally_ns_politicans: "Элли НЕТ Политики"
NOR_ally_ns_politicans_desc: "Многие из членов совета считают этот шаг опасным. но король верит, что это поможет стабилизировать королевство."
NOR_no_king_communists: "Нет короля коммунистов"
NOR_no_king_communists_desc: ""
NOR_absolute_rule: "Абсолютное правило"
NOR_absolute_rule_desc: ""
NOR_prime_minister_quisling: "Премьер-министр Кислинг"
NOR_prime_minister_quisling_desc: ""
NOR_long_live_king: "Да здравствует король"
NOR_long_live_king_desc: ""

NOR_ns_victory: "Победа в НС"
NOR_ns_victory_desc: "Несмотря на то, что многие члены хотят либо демократии, либо монархии, большинство, с командиром Рагнвальдом Хвослефом на фронте, проголосовало за то, чтобы Нашунал Самлинг захватил власть в Норвегии. Видкун Кислинг станет новым министром-президентом Норвегии."
NOR_police_loyalty: "Лояльность полиции"
NOR_police_loyalty_desc: "Мы должны превратить полицию в лояльную силу, и все признаки социалистической лояльности не будут допущены в полиции, и такая недобросовестная практика будет наказана тюремным заключением или даже смертью!"
NOR_one_legal_labour_union: "Единый юридический профсоюз трудящихся"
NOR_one_legal_labour_union_desc: ""
NOR_arbeidstjeneste: "Arbeidstjenenten"
NOR_arbeidstjeneste_desc: "Идея организации какого-то вида общественных работ в нашей стране получила большую поддержку со стороны многих националистических групп и отдельных лиц."
NOR_ns_agrarian_support: "НП Аграрная поддержка"
NOR_ns_agrarian_support_desc: ""
NOR_militarize_society: "Милитаризировать общество"
NOR_militarize_society_desc: "Мы смогли выгнать предателей, но у нас нет сил продолжать эту войну против социализма, мы должны милитаризировать страну, призвать к борьбе пожилых людей, чтобы служить, сражаться и умирать, ради своей нации."
NOR_festning_norge: "Фестиваль &lt; &lt; Нордж &gt; &gt;"
NOR_festning_norge_desc: "Наша страна не окружена друзьями, мы должны защищать побережье и моря, мы должны сделать нашу страну укрепленной!"
NOR_work_camp_for_socialists: "Рабочие лагеря для социалистов"
NOR_work_camp_for_socialists_desc: "Слишком дорого позволять социалистическим и марксистским предателям гнить в тюрьме, а вместо этого мы должны заставить их выполнять тяжелую работу в общинах и на фабриках, конечно, под наблюдением преданных членов НС."
NOR_approach_party_strifes: "Приближающаяся Сторона"
NOR_approach_party_strifes_desc: "Насланный Самлинг разделен между двумя крыльями, христианским и авторитарным крылом, и теми, кто проповедует норвежское превосходство и язычество."
NOR_st_olavs_spirit: "Дух Святого Олава"
NOR_st_olavs_spirit_desc: "Мы будем сохранять единство под крестом и духом Святого Олава, который через свою собственную смерть, христианизованную Норвегию."
NOR_loyal_priestes: "Верные священники"
NOR_loyal_priestes_desc: "Слишком много священников в нашей стране проповедуют против нашего правительства, дружат с социалистическим рабочим движением и проповедуют идеологическое признание предателям."
NOR_promote_our_christianity: "Поощрять наше христианство"
NOR_promote_our_christianity_desc: "Многие в нашей стране верят, что христианство не может работать с языческими представлениями о валькизме, но Бог приведет нас лучше, чем одноглазый старик, Бог приведет нас к победе против наших врагов, как в средневековые века."
NOR_northern_crusaders: "Северные крестоносцы"
NOR_northern_crusaders_desc: ""
NOR_odins_spirit: "Дух Одина"
NOR_odins_spirit_desc: "Мы объединимся под руководством Алфадера Одина, он приведет народ к победе против тех, кто не заслуживает жить в нашей стране, мы будем бороться за Алфадера, и мы умрём и присоединимся к нему в Валхалле!"
NOR_rading_sea: "Противодействие морям"
NOR_rading_sea_desc: "Много лет назад наши отцы переплыли море и напали на Британские острова и побережье материковой Европы. Сегодня эти же британцы правят морем, которое когда-то было нашим достоянием. Мы должны научить их тому, что мы хищники и они добыча!"
NOR_pagan_reformation: "Пагская реформа"
NOR_pagan_reformation_desc: ""
NOR_new_norwegian_nation: "Новый норвежский народ"
NOR_new_norwegian_nation_desc: "В нашей стране есть такие люди, как интернационалисты и сепаратисты, которые не только не идентифицируют себя как норвежцы, но и выступают против самой идеи норвежской нации, и мы ничего не сделали против этого."
NOR_long_live_nation: "Долгая жизнь нации"
NOR_long_live_nation_desc: ""

NOR_expand_nation_state: "Расширение норвежского суверенитета"
NOR_expand_nation_state_desc: "Норвегию уже давно злоупотребляют, порабощают и грабят иностранные державы, и, наконец, когда ответственное и разумное правительство будет контролироваться, мы положим конец многовековому угнетению!"
NOR_greenland_case: "Дело Гренландии"
NOR_greenland_case_desc: "В 1814 году великие державы разделили нашу нацию на две части: "Данский" и "Шведский", хотя наши братья в Северной Атлантике не боролись за независимость, как мы, они все еще братья, когда мы обрели независимость в 1905 году, датчане не отдали свои территории, пришло время вернуть эти территории и объединить норвежцев!"
NOR_northatlantic_islands_or_war: "Североатлантические острова или война"
NOR_northatlantic_islands_or_war_desc: "Настало время настаивать на нашем требовании о том, чтобы мы захватили острова в Северной Атлантике, включая Гренландию, Исландию и Фарерские острова."
NOR_improve_islandic_industry: "Совершенствование исландской промышленности"
NOR_improve_islandic_industry_desc: "Индустрия Исландии мала, там почти ничего нет, просто несколько морских портов и старых домов, нам нужно улучшить эту территорию и заставить людей иммигрировать здесь."
NOR_integrate_iceland: "Интегрировать Исландию"
NOR_integrate_iceland_desc: "Некоторым из наших освобожденных братьев в Исландии трудно принять наше правление, они верят, что у нас нет общего языка и истории, насколько они эксклюзивны, мы накажем их за это."
NOR_exploration_greenland: "Разведка Гренландии"
NOR_exploration_greenland_desc: "Хотя в Гренландии в основном только белый лед и снег, у нас есть потенциал для того, чтобы начать промышленность вдоль южного побережья."
NOR_integrate_greenland: "Инкорпорировать Гренландию"
NOR_integrate_greenland_desc: "Было бы трудно интегрировать Гренландию, когда часть ее населения не норвежка, но у нас также есть коренные жители."
NOR_claims_on_sweden: "Претензии в Швеции"
NOR_claims_on_sweden_desc: "В течение многих лет шведы оккупировали Альфгейм и Йойстре Рикину, Джемтланд, которые были незаконно захвачены, и датчане верили, что они могут представлять нас. Мы притязаем на эти земли как на части Норвегии."
NOR_retake_lost_eastern_land: "Возвращение потерянной восточной земли"
NOR_retake_lost_eastern_land_desc: "Настало время настоять на наших требованиях, теперь мы заберем нашу по праву землю на востоке, освободим братьев, живущих под шведским подавлением, и объединим наш народ еще раз."
NOR_stomstad_dockyards: "Штрёмстадские докьярды"
NOR_stomstad_dockyards_desc: ""
NOR_integrate_bohuslen: "Интегрировать Бохуслена"
