 #ECONOMY
 MEX_review_the_economy: "Обзор экономики"

 MEX_review_the_economy_desc: "В предстоящие годы, и если мы надеемся выиграть грядущую войну, это должно измениться."
 MEX_continued_industrialization: "Продолжение индустриализации"
 MEX_continued_industrialization_desc: "Мы сосредоточимся на наращивании нашей промышленности, а не на местных потребностях или событиях."
 MEX_lower_monetary_rates: "Более низкие валютные ставки"
 MEX_lower_monetary_rates_desc: "Устранение ограничений на деятельность государственных компаний и стимулирование местного экономического мастерства позволят нашим компаниям строить себя при минимальном государственном руководстве."
 MEX_proyecto_unidad: "Пройекто-одиночка"
 MEX_proyecto_unidad_desc: "Мы объединим сельские и городские районы Мексики, с тем чтобы можно было быстро собрать ресурсы и перебросить войска."
 MEX_proyecto_esperanza: "Пройекто эсперанса"
 MEX_proyecto_esperanza_desc: "Устанавливая государственную политику финансирования больших работ и системы развития с учетом заслуг, наши фабрики получат временный стимул."
 MEX_new_research_institutes: "Новые исследовательские интуиции"
 MEX_new_research_institutes_desc: "С новыми колледжами наша страна сможет добыть технологию, которая будет подпитывать самую разрушительную военную машину."
 MEX_urban_industrial_development: "Городское промышленное развитие"
 MEX_urban_industrial_development_desc: "Города Мексики велики по своим масштабам, но слабы в промышленном производстве."
 MEX_industrialize_rural_mexico: "Промышленное развитие сельских районов Мексики"
 MEX_industrialize_rural_mexico_desc: "Сельская Мексика — неиспользованный камень, который, очевидно, не столь плотен, как городские районы, но население все еще не имеет работы, и, создавая фабрики в этих районах, мы можем диверсифицировать местоположение наших заводов, избежать будущих бомбардировок и довести часть нашей страны, которая испытывает острую нехватку производственных мощностей, до уровня, на котором она нам понадобится."
 MEX_militarization_of_industries: "Милитаризация промышленности"
 MEX_militarization_of_industries_desc: "Новые фабрики для новых пушек!"
 MEX_local_arms_manufacturies: "Местные оружейные мастерские"
 MEX_local_arms_manufacturies_desc: "В сельской местности в Мексике есть небольшие города, которые традиционно предоставляют услуги нашего освобождения, они проделали отличную работу, имея мало инструментов, и настало время для того, чтобы это посвящение было вознаграждено и использовано."
 MEX_a_rising_economic_power: "Растущая экономическая держава"
 MEX_a_rising_economic_power_desc: "Мексика связывается с теми частями мира, которые она хочет, и если у них есть хоть какой-то смысл, они отвечают..."

 MEX_domestic_development: "Внутреннее развитие"
 MEX_domestic_development_desc: "Хотя наше промышленное планирование может пострадать, мы можем стимулировать наши военные усилия посредством целенаправленного развития местных регионов."
 MEX_develop_the_north: "Развивать Север"
 MEX_develop_the_north_desc: "Северный регион нашей страны будет первым лицом к лицу с Северным Защитником, и важно, чтобы наши войска могли быстро и безопасно передвигаться по региону."
 MEX_develop_the_south: "Развивать Юг"
 MEX_develop_the_south_desc: "Юг нашей страны может стать последним бастионом нашего государства от вторгнувшихся американцев."
 MEX_invest_in_agriculture: "Инвестиции в сельское хозяйство"
 MEX_invest_in_agriculture_desc: "Сельское хозяйство является основой всех могущественных государств, однако здесь оно испытывает острую нехватку средств, и это не помогло оккупационным американским силам лишить наши страны важных продовольственных культур, таких, как пшеница и кукуруза."
 MEX_build_new_steel_refineries: "Строительство новых стальных заводов"
 MEX_build_new_steel_refineries_desc: "Сталь производит оружие, танки и самолёты, без них наши военные будут недоукомплектованы."
 MEX_prospects_for_resources: "Поиск ресурсов"
 MEX_prospects_for_resources_desc: "Новые ресурсы на новое оборудование."
 MEX_create_jobs_for_the_people: "Создать рабочие места для людей"
 MEX_create_jobs_for_the_people_desc: "Городские районы заполнены жителями, живущими в нищете, и вынужденными прибегать к менее чем теплым средствам для того, чтобы содержать себя и свои семьи."
 MEX_search_for_new_oil_deposits: "Поиск новых месторождений нефти"
 MEX_search_for_new_oil_deposits_desc: "Наши танки перевернут грязную Колумбию!"
 MEX_bringing_it_all_together: "Соберем все вместе"
 MEX_bringing_it_all_together_desc: "Наши инфраструктурные программы уже принесли большой успех мексиканскому народу."
 MEX_a_promising_future: "Обнадеживающее будущее"
 MEX_a_promising_future_desc: "Будущее самодостаточной Мексики не только возможно, но и за углом."

