l_russian:

 # Description
 MEX_FUHRERREICH_DESC: "Пережив огромные политические потрясения на рубеже века, Мексика стала централизованной при Венерусиано Каррансе. На волне антиамериканских настроений (особенно в связи с делом Тампико) страна в конечном итоге объявила войну США. После своего поражения страна стала американским клиентом. Теперь, после краха американской экономики, страна разделилась тремя националистическими фракциями, каждая из которых с собственным видением Великой Мексики."

