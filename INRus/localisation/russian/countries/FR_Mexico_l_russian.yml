 MEX_LOYALIST_CABINET: "Мы выбрали лоялистский кабинет."


 #### Ideas ####
 MEX_attaaaaaaack: "Гуэрра Релампаго"
 MEX_attaaaaaaack_desc: "В то время как американские войска, к сожалению, не готовы к нашей огромной первой волне нападавших, мы с легкостью пролетаем по юго-западу!"

 MEX_research_primacy: "Первостепенное значение исследований"
 MEX_research_primacy_desc: "Благодаря нашим новым институтам, наши исследования доказали, что мы несравненные противники на стадии инноваций."
 MEX_supporting_the_agricultural_sector: "Поддержка сельскохозяйственного сектора"
 MEX_supporting_the_agricultural_sector_desc: "Мексика сейчас производит достаточно продовольствия для поддержки как своих войск, так и гражданского населения."
 MEX_curbed_unemployment: "Уменьшенная безработица"
 MEX_curbed_unemployment_desc: "В нашей стране обезвреживание меньше, чем когда-либо."
 MEX_lower_monetary_rates: "Более низкие валютные ставки"
 MEX_lower_monetary_rates_desc: "С снижением денежной ставки наши фабрики будут свободны для расширения, по крайней мере, в ближайшем будущем."
 MEX_rampant_industrialization: "Индустриализация бурного производства"
 MEX_rampant_industrialization_desc: "Правительство Мексики, стремясь отомстить американцам, приняло безжалостные программы индустриализации, с тем чтобы подготовить свою страну к войне."
 MEX_not_so_rampant_industrialization: "Индустриализация, не являющаяся столь динамичной"
 MEX_not_so_rampant_industrialization_desc: "Улучшение условий жизни населения и повышение его внимания привели к тому, что наши программы индустриализации стали более гуманными и эффективными."
 MEX_authority_of_the_people: "Народные власти"
 MEX_authority_of_the_people_desc: "Король правит над Мексикой честной рукой, посвящённой поддержанию равного государства."
 MEX_the_new_authority: "Новый орган"
 MEX_the_new_authority_desc: "Король правит над Мексикой честной рукой, посвящённой поддержанию равного государства."
 MEX_meritocratic_army: "Армия меритократии"
 MEX_meritocratic_army_desc: "С выходом из Золотой рубашки власть над нашими военными, только те, кто самый лучший, могут подняться на вершину политики человека не превзойдет его способности."
 MEX_army_of_reclamation: "Готовы к возобновлению"
 MEX_army_of_reclamation_desc: "Скоро американцы будут вынуждены отказаться от наших законных земель, будь то на кончиках наших штыков или через договор."
 MEX_the_quetzacoatl_rises: "Кетцакоатльный ритм"
 MEX_the_quetzacoatl_rises_desc: "Американцы никогда больше не будут."
 MEX_for_the_king_and_country: "Король и страна"
 MEX_for_the_king_and_country_desc: "-- Мы вместе заберем то, что было по праву нашим, и никогда больше американцы не разрушат наш престиж. -- Плутарко Элиас Каллес"
 MEX_army_of_the_greenshirts: "Армия зеленых футболок"
 MEX_army_of_the_greenshirts_desc: "Зеленые футболки будут должным образом вознаграждены за то, что они посвятили себя власти настоящих мексиканских губернаторов."
 MEX_la_gran_revancha: "Ла Гран Реванча!"
 MEX_la_gran_revancha_desc: "Люди бегут по улицам, вы видите в их глазах, наступает день, когда американцы усвоит урок, который Карранса никогда не сможет преподать. Наступает война. Мы готовы."
 MEX_las_viboras: "Лас-Виборас"
 MEX_las_viboras_desc: "Некоторые называют его культовой фракцией в военно-воздушных силах, однако Лас Виборас - это невероятно квалифицированный круг, состоящий из лучших пилотов мексиканских ВВС."
 MEX_militarism: "Мексиканский милитаризм"
 MEX_military_restructuring: "Перестройка военного компонента"
 MEX_military_restructuring_desc: "Мы понимаем, что структура нашей армии неэффективна и устарела."
 MEX_colegio_militar: "Коллегио Милитар"
 MEX_military_corruption: "Военная коррупция"
 MEX_military_corruption_desc: "Хотя они и не являются некомпетентными, значительная часть наших офицеров постоянно присвоит целевые средства для личной выгоды."
 MEX_militias: "Вооруженные формирования"
 MEX_militias_desc: "Наша армия состоит из необычной группы боевиков и профессиональных сил, которые борются за сотрудничество из-за игнорирования ополчением более совершенных концепций войны. Кроме того, оглушительные крики милиции «Абахо лос Грингос!» привели к различным случаям психических расстройств для профессиональных солдат."
 MEX_nationalist_strife: "Националистическая борьба"
 MEX_nationalist_strife_desc: "Три националистические фракции борются с помощью риторики."
 MEX_legacy_of_los_fanaticos: "Наследие Лос Фанатикоса"
 MEX_legacy_of_los_fanaticos_desc: "Лос Фанатикос был группой крайне преданных солдат во время Великой войны, которые сражались в мексиканской армии, и они были одной из главных причин того, что война заняла почти два года фанатичной, хорошо подготовленной и хорошо оснащенной, Лос Фанатикос представляет собой точку большой гордости для мексиканской нации, хотя сегодня они приостановлены."
 MEX_war_now_and_always: "Война сейчас и всегда"
 MEX_war_now_and_always_desc: "Мексика теперь является военным автоматом, посвященным освобождению нашей нации от внешнего мира."
 MEX_basta: "Баста!"
 MEX_basta_desc: "Этот дух отражает готовность мексиканского народа преследовать войну против своего величайшего врага."
 MEX_basta2: "Баста!"
 MEX_basta2_desc: "Этот дух отражает готовность мексиканского народа преследовать войну против своего величайшего врага."
 MEX_basta3: "Баста!"
 MEX_basta3_desc: "Этот дух отражает готовность мексиканского народа преследовать войну против своего величайшего врага."
 MEX_basta4: "Баста!"
 MEX_basta4_desc: "Этот дух отражает готовность мексиканского народа преследовать войну против своего величайшего врага."
 MEX_basta5: "Баста!"
 MEX_basta5_desc: "Этот дух отражает готовность мексиканского народа преследовать войну против своего величайшего врага."
 MEX_basta6: "Баста!"
 MEX_basta6_desc: "Этот дух отражает готовность мексиканского народа преследовать войну против своего величайшего врага."
 MEX_basta7: "Баста!"
 MEX_basta7_desc: "Этот дух отражает готовность мексиканского народа преследовать войну против своего величайшего врага."

 #### FOCUS TREE ####

 #POLITICAL
 MEX_final_election: "Последние выборы"
 MEX_final_election_desc: "После интенсивных политических столкновений между тремя националистическими группировками Мексики СООН назвали то, что многие зрители называют «последними выборами»."
 MEX_royalists: "Реалисты"
 MEX_royalists_desc: "фракция, представляющая так называемый «народный король», Плутарко Элиас Каллес, смогла обуздать другие группировки на выборах."
 MEX_the_peoples_king: "Народный король"
 MEX_the_peoples_king_desc: "Плутарко Элиас Каллес объявил новую Мексику не под присягой церкви или мятежных сикофантов, а под флагом - и, что более уместно, под самим собой."
 MEX_some_things_cannot_be_reversed: "Некоторые вещи нельзя изменить"
 MEX_some_things_cannot_be_reversed_desc: "Мексика всегда должна была править диктатором, была Уэрта, потом Карранса, затем северная угроза, и тогда было бы справедливо, что диктатор, который понимает потребности народов, примирил себя с властью земли."
 MEX_the_kings_cabinent: "Королевский дворец"
 MEX_the_kings_cabinent_desc: "Каллес созвал собрание высших умов в Мексике, чтобы сформировать свой кабинет."
 MEX_constitutional_monarchy: "Конституционная монархия"
 MEX_constitutional_monarchy_desc: "Кабинет взял власть у Каллеса и отослал его на некую неимперативную позицию."
 MEX_the_brief_reign: "Краткое руководство"
 MEX_the_brief_reign_desc: "Пришло время поставить новое правительство у власти, более поддающееся концепции мира, вне зависимости от издержек."
 MEX_compromise_with_the_north: "Сочетание с Севером"
 MEX_compromise_with_the_north_desc: "Мы не сдадимся, но война - это концепция для жажды власти, а Америка - зверь, но не злодей."
 MEX_settling_anti_american_sentiments: "Устранение антиамериканских чувств"
 MEX_settling_anti_american_sentiments_desc: "С теми, кто на нашей стороне, мы наконец-то можем разобраться с Америкой и, говоря прямо, убрать их с наших чертовых спин."
 MEX_finalizing_the_regency: "Завершение работы над регламентом"
 MEX_finalizing_the_regency_desc: "Знаменитость на улицах!"
 MEX_never_compromise: "Никогда не пререкайся!"
 MEX_never_compromise_desc: "Мы всегда будем едины в нашей вражде к нашему величайшему врагу!"
 MEX_ban_the_goldshirts: "Запретить золотые футболки"
 MEX_ban_the_goldshirts_desc: "Голд футболки представляют собой старую эру в истории Мексики, когда-то они были полезны, но теперь их догматический характер мешает руководству нашей армии. Конец золотых футболок наступил."
 MEX_for_the_king_and_lord: "Король и страна"
 MEX_for_the_king_and_lord_desc: "Война скоро начнётся, но она не закончится так быстро, что в такие времена мы все ищем источник преданности."
 MEX_national_synarchist_union: "Национальный союз Синаркиста"
 MEX_national_synarchist_union_desc: "Национальный союз синархистов подтвердил контроль над правительством, с твердой платформой, они обещают три вещи: единство, преданность и кровь."
 MEX_crackdown_on_socialist_elements: "Разрыв на социалистических элементах"
 MEX_crackdown_on_socialist_elements_desc: "-- Наши отцы боролись за свободу мексиканского самоопределения, и теперь эти дураки хотят передать нашу страну кому? Советы? Бразильские толпы? Выгнали их с нашей земли, я говорю, и мы будем прокляты за это! -- Мануэль Торрес Буэно"
 MEX_crackdown_on_democratic_elements: "Срыв демократических элементов"
 MEX_crackdown_on_democratic_elements_desc: "Демократия всегда была глупой и унылой мечтой."
 MEX_the_union_question: "Вопрос о Союзе"
 MEX_the_union_question_desc: "Лишь пару лет назад маленький округ Крусуб заявил о своей независимости вскоре после того, как он стал нашим, конечно, они были и являются прирожденными мексиканскими народами."
 MEX_radicals_to_centrists: "Радикалы для центристов"
 MEX_radicals_to_centrists_desc: "Те, кого пресса и пропагандисты назвали бы жестокими и несчастными "радиологами", были правы все это время. Политическая обстановка меняется с момента нашей новой независимости. Пришло время официально инкорпорировать эту философию."
 MEX_empower_the_goldshirts: "Помогайте золотым футболкам"
 MEX_empower_the_goldshirts_desc: "Голдшеты были там для Ефея, когда он возглавлял небольшой контингент борцов за свободу в начале 20-х, они должны наконец получить признание и уважение, которые те самые члены всегда по праву заслужили в нашей армии, лучше их, чем скандальные и безумные зеленые футболки."
 MEX_valkists: "Кетсалкоатры"
 MEX_valkists_desc: "Кецалькоатлы заняли должность премьер-губернатора и с согласия мексиканского народа поставили друг друга на достаточно мощные посты в правительстве."
 MEX_un_enemigo_comun: "Невспыльчивая комун"
 MEX_un_enemigo_comun_desc: "В деревнях, где мы выросли, ничего не кажется таким же, но вы никогда не видите изменений изо дня в день, и никто не замечает, что таможня ускользает."
 MEX_pequena_venganza: "Пекенья Венганза"
 MEX_pequena_venganza_desc: "В отличие от военных, несколько правительственных чиновников начнут кампанию по вербовке, но это вряд ли "кампайн", это, похоже, то, чего люди хотели на протяжении многих лет!"
 MEX_voluntad_de_las_personas: "Voluntad de las Personas"
 MEX_voluntad_de_las_personas_desc: "Только поставив больше людей в бой, мы сможем сломить врага."
 MEX_review_of_synarchism: "Обзор синархизма"
 MEX_review_of_synarchism_desc: "Синархизм - это старая позиция, у людей разные мнения."
 MEX_crackdown_on_the_regency: "Разрушение регентства"
 MEX_crackdown_on_the_regency_desc: ""Максимато" - это шутка, так же как и те, кто разделяет его убеждения. Отношение к стране? Нет преданности идеалам! Идеалии наших предков и нашей эмперической области! Как только их вера покинет страну, мы сможем собрать народ для настоящей реванше."
 MEX_the_quetzacoatl: "Кетсалкоатль"
 MEX_the_quetzacoatl_desc: "Кецалькоатль охраняет запад, заходящее солнце и утренняя звезда. Он охраняет циклы нашей планеты, включая воскресение. Таким образом, он будет направлять наше собственное возрождение - возрождение Мексики. - Альфонсо Джунко."
 MEX_empower_the_greenshirts: "Надеть зеленые футболки"
 MEX_empower_the_greenshirts_desc: "Золотые футболки - предатели и лжецы, преданные ненавистным ЮНС. Только зеленые футболки действительно клянутся в верности истинным лидерам Мексики и ее владычеству."
 MEX_la_gran_revancha: "Ла Гран Реванча"
 MEX_la_gran_revancha_desc: "Сейчас время! Скоро мы будем оправданы! никто не придет на помощь Америки, никто не поддерживает их усилия, и они слабы. Если мы не отправимся на войну в ближайшее время, мы потеряем преимущество. Мы потеряем землю. Мы потеряем Мексику!"
 MEX_la_issurection_temprana: "Темпрена"
 MEX_la_issurection_temprana_desc: "Снова и снова мексиканский народ восстанет, вернувшись к жизни и братству Кетскоатль."
 MEX_the_san_diego_incident: "Инцидент в Сан-Диего"
 MEX_the_san_diego_incident_desc: "Однажды тихим утром в Калифорнии..."
 MEX_california_arizona_new_mexico: "Калифорния, Аризона, Нью-Мексико, Техас"
 MEX_california_arizona_new_mexico_desc: "Мы будем рады забрать только то, что нам причиталось от войны менее века назад."
 MEX_the_bronze_sun: "Бронзовое Солнце"
 MEX_the_bronze_sun_desc: "Мы будем довольны тем, что раздавили мерзкую Колумбию!"

 #ARMY
 MEX_ejercito_mexicano: "Эхерсито Мексикано"
 MEX_ejercito_mexicano_desc: "Мексиканские военные, будучи заполнены самыми преданными воинами во всем мире, находятся в плачевном состоянии и находятся в состоянии недовольства в течение последних нескольких лет."
 MEX_mission_for_professionalism: "Миссия в поддержку профессионализма"
 MEX_mission_for_professionalism_desc: "У нас есть люди на поле, но не у руля, но призывая опытных людей со всей страны, особенно отставных офицеров из революционных дней, повредит нашей репутации, в конце концов, это будет стоить того."
 MEX_restructure_the_army: "Перестройка армии"
 MEX_restructure_the_army_desc: "У нашего высшего персонала есть план, как спланировать нашу военную структуру к большему преимуществу."
 MEX_purging_corruption: "Очистка коррупции"
 MEX_purging_corruption_desc: "Предатели и коррумпированные тираны, жадные и наглые, глупые и наивные, взяточники и взятки - все будет брошено на стену."
 MEX_reopen_the_colegio_militar: "Вернуть Коледжио Милитар"
 MEX_reopen_the_colegio_militar_desc: "Вайл Колумбия закрыла один из наших старейших и самых гордых военных институтов, и старое здание выстраивалось прямо за пределами Мехико."
 MEX_arms_modernization: "Модернизация вооружений"
 MEX_arms_modernization_desc: "Новый пистолет в руках нового мексиканского солдата!"
 MEX_the_question_of_doctrine: "Вопрос доктрины"
 MEX_the_question_of_doctrine_desc: "Несколько наших стартовых офицеров из Коледжио Милитара привезли нам три дизайна для наших военных..."
 MEX_mobility_priority: "Приоритизация мобильности"
 MEX_mobility_priority_desc: "Самая быстрая армия доберется до врага раньше любого другого."
 MEX_firepower_priority: "Приоритизация огневой мощности"
 MEX_firepower_priority_desc: "Устойчивая армия превзойдет любого возможного врага."
 MEX_planning_priority: "Приоритизация планирования"
 MEX_planning_priority_desc: "Готовая армия превзойдет любого из наших врагов."
 MEX_wargames: "Военные игры"
 MEX_wargames_desc: "С помощью циркулярной системы интенсивной подготовки к боевым учениям мы можем развить наши военные идеи, прежде чем нам придется сражаться с ними на местах."
 MEX_mobilization: "Предупредительная мобилизация"
 MEX_mobilization_desc: "Если мы воздействуем на наши фабрики, мы можем довести население до большего объема подготовки, они уже готовы, теперь мы просто должны заставить их работать."
 MEX_neo_mexican_militarism: "Новый мексиканский милитаризм"
 MEX_neo_mexican_militarism_desc: "И наконец, великие планы наших предков сходятся. Сдаться - это не вариант, и только благодаря нашему совместному товариществу и преданности восстановлению нашего престижа и восславлению как народа мы можем надеяться на то, что мы превзойдем Северную Менасию."
 MEX_siempre_leales: "Симпр Лиалс."
 MEX_siempre_leales_desc: "Отношение к народу, отношение к государству, отвращение к цели, отвращение к войне, преданность делу."
 MEX_revanchism: "Возобновленный реванхизм"
 MEX_revanchism_desc: "На войну!"
