 ### Factions ###
 ################

 mex_pan_america: "Пакт о взаимной американской обороне"

 ##################
 ####  EVENTS  ####
 ##################

 mex.1.d: "С рассвета старой Мексики это было поле битвы. Пришли колонисты из Европы и воспользовались нашим разделением. Остальная часть - история. Столетия прошли, с нашим народом в репрессиях, наши старые души были оторваны. Потом Революция, битва за самоопределение. Мы победили его, и еще десятилетия спустя мы потеряли этот путь снова. Новая революция привела к новому диктатуру. Американцы прибыли в нашу страну и оккупировали нашу землю в Веракрусе. Как мы можем настоять на войне, когда немцы пришли с посланием? Карранса, победитель войны и блокировщик страны, несмотря ни на что, не были некомпетентны. Не удивительно, что американцы победили нас, когда он был так решительно настроен идти на компромисс с самого первого дня. Теперь у нас была еще одна революция, на этот раз против американцев. Они слабее, чем когда-либо, они сломали себя. Наше единство было восстановлено. Последние выборы, но как бы то ни было, война придет так скоро. Мы можем вернуть нашу страну, мы можем вернуть нашу страну снова. Немцы через море будут страдать от того же, они могут уничтожить тех же, которые просто уничтожить."

 mex.2.d: "Теперь, когда наши военные продвинулись вперед, возможно даже за пределы самых диких мечтаний [королевы, лидера], пришло время положить конец одному из самых важных и самых трудных вопросов, с которыми могут столкнуться военные - вопросу доктрины."

 mex.3.d: "Наши пилоты на протяжении последних полудесятилетия в основном застопорились. В настоящее время большая часть нашей армии не укомплектована авиабазами, которые, как правило, переоснащают их. Если мы избавимся от такой идеи и отложим их реконструкцию, мы сможем восстановить ценный резерв персонала. Однако такая мера неизбежно нанесет ущерб нашим военно-воздушным силам и их перспективам, по крайней мере, в ближайшем будущем."

 mex.4.d: "Наши военно-воздушные силы продвинулись вперед! Наши лидеры неба вышли из утомительной конференции и дебатов последних нескольких недель и представили несколько поразительных идей. Однако сейчас настало время для того, чтобы [королевский лидер] решил раз и навсегда, какой путь мы пойдем."

 mex.5.d: "В последние два года наша страна была потрясена рядом незначительных политически мотивированных актов насилия. Напряжение приближается к переломной точке, и люди становятся все более и более беспокойными. В то время как синархистское правительство сохраняет контроль, это давление наносит серьезный ущерб их политическим перспективам. Сейчас синархисты стали называть так называемыми «последние выборы», чтобы решить раз и навсегда, кто придет к власти в Мексике. Однако законный характер этих результатов, несомненно, будет подозреваться."

 mex.6.d: ""Король народа", Плутарко Элиас Каллес, созвал чрезвычайно важное собрание в Федеральном законодательном дворце, чтобы назначить новый кабинет министров."

 mex.10.d: "Многие центральноамериканские страны помогли империалистической второй мексиканско-американской войне, хотя они не страдали от тех же позоров, что и мы во время войны, ясно, что они не имели к нам никакого отношения."

 mex.11.d: "Мексика обратилась к нам с предложением присоединиться к ним в союзе против Соединенных Штатов Америки, безусловно, это зануда, но мы никогда не должны забывать, что случилось со многими из наших центральноамериканских соотечественников во время предыдущей войны..."

 mex.12.d: "Глупые ублюдки отрицали членство в нашей фракции. -- Фрэнк, -- сказал сегодня, -- они также могут быть нашими врагами! -- неизвестно, что произойдет рядом с отношениями с нашими двумя странами, но одно наверняка -- они не будут нас поддерживать в предстоящем конфликте."

 mex.13.d: "Лидер знаменитого [от Гетнама] согласился присоединиться к нашему альянсу против американской свиньи. Они, возможно, в отличие от других, видят опасность того, что в Северной Америке снова доминируют Соединенные Штаты. "США" может быть сильнее, чем все мы в отдельности, но теперь мы немного сильнее. В грядущей войне, это может быть все, что имеет значение."

 mex.14.d: "Еще не выполнено."

 mex.15.d: "и еще не выполнено."

 mex.16.d: "Наша экономика застопорилась под американским гнетом, когда мы взяли плоды мексиканской родины, и теперь, когда мы были освобождены, мы вышли на путь индустриализации, нанесшей ущерб нашему населению, но приведшей к невообразимым успехам, но в этот критический момент мы должны решить, продолжать ли проводить эту политику в ответ на эскалацию боевых действий между нашей страной и Соединенными Штатами или же вернуться к политике."

 mex.17.d: "Старый синархистский режим года проводил политику национального синархизма, которую мы быстро оперировали в последние месяцы, но пришло время пересмотреть полезность и необходимость синархизма и его популистских корней..."

 mex.18.d: "Война надвигается! Теперь мы должны прийти к выводу: как далеко мы пойдем, чтобы восстановить себя и победить Северную Менасию? Может быть сильнее нас даже сейчас, и любое расстояние должно быть жестко затрачено, с участием всех способных людей Мексики. Мы просто восстановим наши старые границы, которые мы потеряли больше века назад, или покорим всю Америку? Мы, вероятно, сможем нарушить мир только для Бахи-Калифорнии, наше потерянное владение Первой Великой Войной, как только мы завоевываем ближний юг Соединенных Штатов Америки."

 mex.19.d: "Мы контролируем необходимые части Соединенных Штатов, чтобы сдаться этой войне и потребовать нашего потерянного владения Бахи-Калифорнии. Северная Менас, скорее всего, согласится. Или, конечно, их население будет глубоко разделено против них. В любом случае, мы, конечно же, найдем прибыль."

 mex.20.d: "В последние две недели мы обезопасили сожженные пустынные штаты Соединенных Штатов Америки. Наша доктрина "Бронзового Солнца" была официально выполнена, и мы можем потребовать от Колумбии вернуть нам нашу землю. Местное население, скорее всего, будет возмущено этим предложением, но когда их мнение когда-нибудь имело значение?"

 mex.21.d: "Американская делегация из Вашингтона подробно рассказала об отказе Колумбии подчиниться нашей военной власти, несмотря на наши желания и ожидания."

 mex.22.d: "В то время как Синко де Майо является нашим главным праздником в праздновании нашей свободы, в него заложены воспоминания о нашей свободе, достигнутой несколько лет назад."

 mex.23.d: "В то время как Синко де Майо является нашим главным праздником в праздновании нашей свободы, в него заложены воспоминания о нашей свободе, достигнутой несколько лет назад."
