 ### Decisions ###
 JBS_Ottoman_Favours: "Дипломатия с Великим Портом"
 JBS_Ottoman_Favours_desc: "Оттоманская империя, которую обычно называют Великим Портом, является нашим крупнейшим союзником в регионе, а также его самым сильным военным, хотя мы не должны ожидать от них прямого вмешательства, если саудовцы нападут, мы все же можем рассчитывать на благосклонность Султана во времена нужды."

 JBS_Ottoman_Training: "Приглашать экспертов из Харканьи Мектеби"
 JBS_Ottoman_Training_desc: "Оттоманы вели с нами кровавую войну два десятилетия назад, но даже тогда было ясно, кто имел теоретическое преимущество."
 JBS_Ottoman_Weapons_Assistance: "Военный контракт с АТФ"
 JBS_Ottoman_Weapons_Assistance_desc: "Объекты Анкары Тюфек Фабрикаси производят лучшее оружие на Ближнем Востоке, которое нам будет очень нужно, если мы будем надеяться, что у нас будет шанс против сил Ибн Сауда."


 JBS_SAU_Power_Struggle: "Подготовка к войне за единство"
 JBS_SAU_Power_Struggle_desc: "Дом Рашида был не очень добр к дому Рашида. Большинство членов их семей, находящихся в руках Ибн Сауда и страдающих от непрекращающихся налетов на их территорию им. Ихвана, власть и престиж, исходящие от Хаила, сильно понизились под весом ваххабистов. Поддержка Османской империи сохраняет наше господство на ногах. Однако, поскольку их постоянное партнерство и союз с нашим эмиром гарантируют безопасность его земель от любой непосредственной угрозы. Некоторые утверждают, что это партнерство является единственной вещью, которая поддерживает нашу власть и должна обрушиться на оттоманов, Ибн Сауд, возможно, считает своей судьбой объединить полуостров под его правлением."

 JBS_War_of_Unification: "Арабская война за единство"
 JBS_War_of_Unification_desc: "Окончательная борьба за контроль над арабским внутренним пространством быстро приближается, поскольку оттоманский бехаф раскалывается под тяжестью мировой экономической депрессии, временно не имея возможности поддерживать мир на полуострове. Все эмиры должны будут выбрать сторону, ибо будущее арабского мира будет написано кровью. Победившие получат возможность определить судьбу арабов. Проигравшие окажутся опозоренными, брошенными в сторону или убитыми на поле битвы."
 JBS_War_of_Unification_Peace: "Неизгладимая коллапсация"
 JBS_War_of_Unification_Peace_desc: "Хотя пустыни Аравии не чужды войне, ее экономика и аграрная база не могут поддерживать затяжные конфликты без периодических перемирий и решительных побед."
 JBS_Sway_Harb: "Отпустите §YHarb§!"
 JBS_Sway_Harb_desc: "Тем не менее Харб тесно связан с племенами Хеджаз, и тем не менее образует огромный блок сил в Центральной Аравии. В конфликте между Ибн Рашидом и Ибн Саудом они, тем не менее, оставались нейтральными, так как у них мало колеек в буксире войны и они защищены Шарифом в Мекке."
 JBS_Sway_Hutaim: "Отпустите §YHutaim§!"
 JBS_Sway_Hutaim_desc: "Утаим, живущий главным образом на побережье, с большим подзаголовком вблизи Хеджаза, является одним из «племенов Лессера» в Аравии. Они главным образом охотники/собиратели с небольшими интересами в арабском конфликте, в значительной степени обусловленными тем фактом, что ни одна из сторон не признает их в качестве истинных арабов. ~ noOften служит в качестве рабов или занимает более низкие позиции в арабском обществе, возможно, их можно убедить поддержать нашу сторону, если мы хотим пойти на уступки."
 JBS_Sway_Muntafiq: "Отпустите CNYMuntafiq§!"
 JBS_Sway_Muntafiq_desc: "Мутафик является одной из крупнейших групп в Ираке и играет важную роль в его политике. Кроме того, они также служат пограничниками, предотвращающими дальнейшее расширение ибн Сауда и рейды на Икхвана. nonLed § §YAjami al-Sa'adun, § § compasi Camel §! является выдающейся частью Оттоманской армии в Ираке и, если потребуется, может оказаться решающим в победе над войсками Ибн Сауда при надлежащей поддержке турок."
 JBS_Sway_Anizzah: "Отпустите CNYAnizzah!"
 JBS_Sway_Anizzah_desc: "Крупнейшее и самое могущественное племя Центральной Аравии, верность Анизии, имеет жизненно важное значение для любой группы, стремящейся объединить Аравию. Несмотря на это, Анизца считается одним из наших традиционных врагов, и будет чрезвычайно трудно убедить их прийти на нашу сторону. Ибн Сауд также с гордостью называет себя потомком Аннизы, которую он назвал племя с "Синейшей кровью". ~ Несмотря на эти факторы, Анизца особенно плохо справляется с Икхваном и призывает Ибн Сауда показать, где его верность. Именно эту разницу мы можем использовать и, надеюсь, использовать для нашего блага."
 JBS_Sway_Mutair_Dawish: "Отпустите §YMutair§! (Фейсал аль-Дувайш)"
 JBS_Sway_Mutair_Dawish_desc: "Один из самых грозных племен, Мутайр можно рассматривать как своего рода дикую карту межплеменных лояльностей, стекающуюся к знаменателю власти, наиболее благоприятной для их положения. Хотя Икхван считает значительное количество мутаира среди своих людей и неоднократно помогал Ибн Сауду, их лидер хорошо известен тем, что переключил стороны на свою собственную выгоду. //Великий §Faisal al Duwaish§!, их лидер и командир рассматриваются как величайший военный ум на полуострове и вполне может оказаться решающим фактором надвигающихся войн, если его преданность может быть гарантирована."
 JBS_Sway_Mutair_Busayis: "Отпустите §YMutair§!"
 JBS_Sway_Mutair_Busayis_desc: "Хотя для большинства Мутайр Фейсал аль-Дувайш можно считать их героем, святым и отцом, возможно, можно посеять инакомыслие среди их рядов и вбить клин между теми, кто разочарован бесконечным насилием и религиозной риторикой Икхвана. nn commanding сущность западной части Мутаира, §YMishari ibn Busayis§!, потенциально может быть перевернута на нашу сторону, если мы пообещаем вознаградить его в обмен на власть над западными племенами Касима."
 JBS_Sway_Ajman: "Отпустите монастырь!"
 JBS_Sway_Ajman_desc: "Аджман был одним из самых неуправляемых племен на протяжении почти века и подчинялся центральному правительству только неохотно. Попытка Эр-Рияда связать их с короной превратилась в катастрофу в 1915 году, когда Аджман поднял свой флаг в восстании и после первоначальной победы над Ибн Саудом почти справилась с его убийством. Однако они не смогли доказать совпадение для его объединенных сил и после короткой неудачи он вернулся, чтобы отомстить."
 JBS_Sway_Utaibah: "Отпустите §YUtaybah§!"
 JBS_Sway_Utaibah_desc: "Второе по величине племя Центральной Аравии, Утаиба, всегда были твердыми союзниками саудовцев и боролись на фронте против угроз как внутри страны, так и за рубежом. Тем не менее, в их рядах развилась вражда между султаном Ибн Хумайдом ибн Биджадом и §YAbd al-Rahman ibn Rubayin§!"
 JBS_Sway_Awazim: "Отпустите CNYAWazim§!"
 JBS_Sway_Awazim_desc: "Как и утаим, авазим рассматривается как"inferior" tribe by the tribes of "blue blood" and are used to perform menial tasks or as slaves for their superiors. The Awazim in particular have a tough time as they are stuck between their "masters", the Ajman, and the Ottoman controlled city of Kuwait where their former benefactors have been removed by the Caliph.\n\nThey nonetheless form a potent military force of their own and could potentially be persuaded to join our coalition if we were to rid them of the Ajman threat."

