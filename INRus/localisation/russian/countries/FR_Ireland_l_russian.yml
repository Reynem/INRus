 IRE_sean_lemass_alt: "Сеан Леймеас"
 IRE_sean_lemass_surname: "Лемасса"
 IRE_sean_lemass_desc_body: "У Сена Лемасса, безусловно, есть предыстория для лидерства в Ирландии; ему было всего 16 лет, когда он принимал участие в Пасхальном восстании 1916 года, и он не намного старше, когда воевал в войне за независимость. Веруя в демократию и гражданский национализм, он разочаровался в растущем авторитаризме Коллинза и оставил Синна Фейна с несколькими его последователями."Home Ruler\" National Centre Party and National League Party. For Lemass, his one-time adversaries shared many of his political and economic views, and for the NCP and NLP, their new leader's service in the Easter Rising and War of Independence would help to legitimise their views in a generally Anglophobic and pro-German nation.\n\nLemass' political philosophy is a simple one: \"A rising tide lifts all boats\", meaning that economic prosperity rises all aspects of society. He believes that if he can deliver strong economic growth that all other issues can be solved using the profits."
 IRE_sean_lemass_leader_desc: "§ §YBorn: §! § 15 июля 1899 года в Баллибраке, Ко. Дублин, Ирландия §!! § §YYY также известен как: §! §L$IRE_ sean_lemass_alt$§! § § §YBackground: §! §L$IRE_ sean_lemass_desc_bode$ Теперь, ведущий партнер в его успешной правящей коалиции, Лемасса определился, что из пепла векового неправильного правления появится процветающая, экономически сильная Ирландия, открытая для бизнеса с миром.§!"
 IRE_sean_lemass_parlrep_sic_desc: "§ §YBorn: §! § 15 июля 1899 года в Баллибраке, Ко. Дублин, Ирландия §!! § §YYY также известна как: §! §L$IRE_ sean_lemass_alt$§! § § §YBackground: §! §L$IRE_ sean_lemass_desc_bode$ Теперь возглавляет страну как тауайсич, и глава успешной правящей коалиции, Лемасс решил, что из пепла веков неправильного правления появится процветающая, экономически сильная Ирландия, открытая для бизнеса с миром.§!"
 IRE_sean_lemass_ger_aligned_leader_desc: "§YBorn: § 15 июля 1899 года в Баллибраке, Ко. Дублин, Ирландия §! § §YYY также известно как: §! §L$IRE_sean_lemass_alt$§! § §YBackground: §! § §L$IRE_ sean_lemass_desc_bod$ Теперь, возглавляя страну из места, близкого к сердцу Рейхспакта, Лемасса полна решимости сделать лучшее из нынешнего немецкого порядка.§!"
 # IRE_sean_lemass_sic_desc: "[ИАС_loc_lemass_desc]"    ### IRE TEMP - wait for scripted loc fix
 IRE_sean_lemass_sic_desc: "§YBorn: §! § 15 июля 1899 года в Баллибраке, Ко. Дублин, Ирландия §!n §YY также известно как: §! §L$IRE_ san_lemass_alt$§! § § §YBackground: §! §! §Lean Lemass' так же сильный националистический авторитет, как и любой другой, будучи одним из самых молодых участников Пасхального Восстания 1916 года. / Несмотря на то, что большинство его коллег считали, что Ирландия должна быть отделена от Британии, чтобы процветать ирландская культура, Лемасс пришел к выводу, что самой приоритетной задачей должно быть экономическое развитие ирландского народа, и культура будет следовать после этого, поскольку голодные люди не становятся поэтами. ~"A rising tide lifts all boats\", Lemass believes that free trade is to everyone's benefit, and therefore Ireland should seek out as many economic allies as possible, even if that includes those in the old British sphere.§!"

