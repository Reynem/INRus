 ###
 fra.5003.t: "Успешное мореплавание Циркум!"
 fra.5003.d: "После многих напряженных месяцев ожидания наш опытный пилот вернулся во Францию после успешного завершения рекордного плавания вокруг Земли; пилоту нужно было сделать лишь ограниченное количество остановок для топлива и технического обслуживания. Ннн, мы обрели большой престиж благодаря этому подвигу, и мы многое узнали о воздушном транспорте в этом процессе."
 fra.5003.a: "Замечательные новости"
 ###
 fra.5004.t: "Неудачное мореплавание!"
 fra.5004.d: "Плохие новости, кажется, что наш пилот, который мы отправили, чтобы обойти земной шар в обычае D.520, не прибыл на свою запланированную остановку в Сайгоне и сейчас на несколько дней отстает от графика."
 fra.5004.a: "Как трагично!"
 ###
 fra.5005.t: "Иностранец с воздуха"
 fra.5005.d: "Похоже, что что-то странное произошло в одном из наших аэропортов Цзянси. Вчера утром неопознанный самолет неизвестной марки и модели появился на горизонте перед тем, как несколько раз ехать на аэродроме и приземлиться. Когда самолет выезжал с взлетно-посадочной полосы, пилот был встречен несколькими гарнизонными полками, которые наставили на него свои винтовки. Этот человек говорил на языке, отличном от языка, находившегося на авиабазе, и вскоре был опознан как французский. Человек объяснил, что его отправили на миссию, чтобы окружить земной шар своим самолетом как можно меньше времени, но он сделал неправильную поправку и приземлился здесь, а не в Сайгоне, где он собирался. Инспекция его самолета показала, что он больше не подходит к воздуху и двигатель был сильно поврежден из-за стресса, но самолет и пилот не пострадали. . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . ."
 fra.5005.a: "Верни ему и его самолет."
 fra.5005.b: "Разрушить его самолет, мы должны узнать его секреты."
 ###
 diplopeace.20.d: "Германия сдалась."

 ### exile events

 fra.6000.d: "Немцы выгнали нас из Европы, и теперь мы боремся за выживание в Северной Африке."
 fra.6001.d: "Побежденный француз в Алжире просит нас о перемирии, охраняемом морем, вторжение будет для нас очень трудным и дорогостоящим, если мы сможем сфокусироваться на других врагах, как бы это ни позволило французам восстановить любую силу, которую они могут собрать, чтобы напасть на нас."
 fra.6002.d: "К счастью, германцы уже раз осознали смысл, и теперь мы свободны укреплять свою позицию в Алжире."

 fra_return.1.t: "Триумфальное возвращение"
 fra_return.1.d: "День, когда многие опасались, наконец-то не наступил. На протяжении многих лет флиртующее пламя Французской Республики хранилось в песках Северной Африки, правительство в изгнании наблюдало и ждало подходящего момента, чтобы нанести ответный удар. Теперь, с освобождением Парижа и обеспечением безопасности материковой части, трицветы летят еще раз над столицей. ~ n/, когда администрация собирает свои ящики в Алжире и готовится к путешествию по Средиземному морю, происходит мрачное признание реальности в будущем. Чтобы восстановить метрополию, мы должны сосредоточить наши ограниченные ресурсы на европейской сердечной земле. В то время как наши связи с Магрибом остаются прочными, эпоха обращения с Северной Африкой как с неотъемлемой частью материковой области должна закончиться по мере того, как мы реорганизуем Республику на новую эру."
 fra_return.1.a: "Виви-ля-Франс, Вив-ля-Република!"

 #### IDEAS ####

 FRA_great_war_legacy: "Наследие Великой войны"
 FRA_great_war_legacy_desc: "Великая война длилась шесть лет и привела к гибели более двух миллионов солдат и гражданских лиц."
 ###
 FRA_somme: "Воспоминания Вердуна"
 FRA_somme_desc: "Битва при Вердуне была одной из самых долгих и кровопролитных битв Великой Войны, охватившей невероятные девять месяцев вокруг французского города Вердун, эта битва заставила наше общество в ужасе отвернуться от мысли о том, что такое помолвка когда-либо будет происходить снова, и немногие из них еще раз готовы взяться за оружие в защиту нации."
 ###
 FRA_divided_military_staff: "Разбивка по военному персоналу"
 FRA_divided_military_staff_desc: "После окончания Великой войны французские военнослужащие разделились по вопросу о том, какую политику должна проводить страна при ведении будущих войн, большинство из них хотели бы, чтобы наши крепостные проекты и окончание немецкой агрессии глубоко вглубь французской земли, однако многие призывают к радикальным изменениям и адаптации в армии, осознавая эффективность немецкого Стоутроппена в последние годы войны, и они выступают за доктрину комбинированной мобильной войны наряду с поддержкой с воздуха."
 ###
 FRA_colonial_profits: "Колониальные прибыли"
 FRA_colonial_profits_desc: "Французская колониальная империя занимает площадь примерно 11,5 млн. кв. км по всему миру, что делает нас второй по величине империей на Земле, прямо за трусливым британским. Расширенность нашей империи позволила осуществить несколько экономических инициатив, и мы уже много лет пожинаем благодетели. Единственная проблема в этом состоит в том, что французская индустрия стала в некоторой степени зависеть от этих колониальных прибылей, и если их надо отрезать, то мы можем столкнуться с промышленным кризисом."
 ###
 FRA_missing_funds: "Средства, отсутствующие в национальном бюджете"
 FRA_missing_funds_desc: "Правительство приняло решение о создании специального следственного совета, чтобы отследить эти недостающие средства и вернуть их правительству, мы должны подождать и посмотреть, что они обнаружат..."
 ###
 FRA_colonial_coop: "Сотрудничество в колониальной области"
 FRA_colonial_coop_desc: "Администраторы колоний пытались поощрять межколониальную торговлю и разделение труда, что привело к тому, что в результате этого мы оказались в прямом подчинении."
