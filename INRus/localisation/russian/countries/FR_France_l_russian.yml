 FRA_desperate_defence: "Отчаянная оборона"
 ORL_desperate_defence: "Отчаянная оборона"
 fra_second_gw.1.d: "Немыслимые события произошли. Немецкие бронированные командиры разрушили наши линии фронта и сейчас льются в сердце Франции. Первоначальная оборона границы, несмотря на всю их мощь, была обойдена или разрушена, и враг движется тревожными темпами. Несмотря на то, что сообщения с фронта хаотичны, мрачная реальность очевидна: битва вышла за пределы границы и в настоящее время ведется на полях и в деревнях самой Франции. Наши армии находятся в смятении и путь к Парижу опасно открыт. Высшее командование призывает к национальной мобилизации. Война за выживание действительно началась."

 FRA_phn_support: "Поддержка Франции"

 phn_france.1.d: "Делегация промышленных экспертов и мастеров-инженеров из «Квай д'Орсай» прибыла для наблюдения за осуществлением всеобъемлющей программы военной модернизации, предоставляя нам передовые чертежи, высокоточные инструменты и крупные кредитные линии, французы помогают нам заложить основы подлинно отечественной оружейной промышленности, благодаря чему наши солдаты вскоре будут оснащены современным оружием, производимым прямо здесь, на нашей собственной земле, что существенно укрепит наше положение как ключевого французского партнера в регионе."

 phn_france.2.d: "В настоящее время доки в Бейруте являются ульями деятельности, поскольку из Марселя прибывает груз кренированных самолетов с маркировкой французской аэронавигационной промышленности. Эти машины значительно модернизированы для наших существующих воздушных корпусов. Наряду с самим авиакомпанией Париж направил группу опытных инструкторов для обучения наших пилотов новейшим тактическим доктринам. С этими новыми крыльями в нашем распоряжении наша способность патрулировать Левантийские небеса и сдерживать любых потенциальных агрессоров значительно улучшилась."
