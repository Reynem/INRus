 ###
 FRA_siphon_colonial_funds: "Колониальные ресурсы Сифон"
 FRA_siphon_colonial_funds_desc: "Наши колонии были разрушены экономическим коллапсом, как и мы, но они не больше, чем колонии."
 ###
 FRA_occupy_canary: "Займитесь канарейками"
 FRA_occupy_canary_desc: "Канарские острова являются весьма стратегическим комплексом островов у побережья Марокко, находящихся в настоящее время под контролем испанских фалангистов."
 ###
 FRA_occupy_border: "Обезопасить нашу южную границу"
 FRA_occupy_border_desc: "Испанская гражданская война не показывает признаков замедления, и социалисты пережили последний год с силой в Барселоне. Пиренейские горы содержат несколько пропусков, которые в настоящее время находятся на испанской территории, что означает, что они могут обеспечить легкую возможность вторжения в случае победы социалистов в войне. Мы должны провести операцию по обеспечению безопасности этих пропусков и предотвращению испанского вторжения ."
 ###
 FRA_eng_menace: "Британская угроза"
 FRA_eng_menace_desc: "Агрессивные британцы продемонстрировали свое истинное лицо и проводят решительную антифранцузскую внешнюю политику как в Европе, так и за рубежом. Поскольку английские дипломаты борются за создание альянсов и договоров, направленных на ослабление нашей власти, континентальная связь внимательно наблюдает вдоль побережья за королевским монархом на горизонте. ~Нет, лучшая защита - это хорошее преступление, и британцы будут иметь трудности с планированием атак против врага, который динамично меняется и развивается. В результате нам нужно проводить свою антибританскую политику и обеспечить, чтобы мы не видели повторения войны в сотых годах."
 ###
 FRA_penetrate_channel: "Проникнуть канал"
 FRA_penetrate_channel_desc: "Английский канал находится под британской гегемонией на протяжении веков, и любые военно-морские эксцизии, которые мы пытаемся осуществить на этом канале, часто встречаются под пристальным наблюдением со стороны англичан."
 ###
 FRA_demand_wallonia: "Спрос на Валлонию"
 FRA_demand_wallonia_desc: "Подавляющее большинство населения бельгийского региона Валлония говорит по-французски, и некоторые из них считают себя этническими французами. Небольшая политическая идеология существует как в Бельгии, так и во Франции, известной как раташизм, который стремится объединить Валлонию с Францией и интегрировать ее в качестве департамента. Рост нашего милитаристского, националистического и экспансионистского правительства, наконец, позволил нам оправдать наши требования к бельгийскому правительству."
 ###
 FRA_claim_wallonia: "Утверждение Валлонии"
 FRA_claim_luxembourg: "Заявление Люксембурга"
 ###
 FRA_internal_decisions: "Внутренние решения"
 ###
 FRA_parisian_autonomy: "Грант Парижская автономия"
 FRA_parisian_autonomy_desc: "Граждане и работники Парижа уже давно призывают к большей автономии и самоуправлению, подобным тем, которыми пользуются наши малые городские города. Они желают, чтобы их собственный выборный совет и менее прямое управление со стороны французского правительства. Предоставление этих прав, безусловно, принесет нам некоторую поддержку со стороны населения, но другие города могут быть недовольны нашей явной поддержкой столичного региона."
 ###
 FRA_curb_unions: "Сверхуниверситетская деятельность"
 FRA_curb_unions_desc: "В то время как мы не можем прямо запретить профсоюзную деятельность, поскольку это, несомненно, приведет к массовым ударам по всей стране и приведет к полной приостановке нашей промышленности, мы можем принять определенные меры, чтобы снизить рост уровня профсоюзизации и сделать членов профсоюза непривлекательными к символическим правительственным благоприятелям. ~Нет, это, безусловно, подорвет социалистические движения во Франции и потенциально отлучит нас от промышленных рабочих, но может быть непристойным шагом в том, чтобы избежать полного социалистического поглощения нашей нации."
 ###
 FRA_expand_marseille: "Расширить порт Марселя"
 FRA_expand_marseille_desc: "Город и порт Марселя имеют жизненно важное значение, когда речь идет о контроле над Медитерранским морем, и без него мы были бы стратегически изолированы от наших колоний в Северной Африке."
 ###
 FRA_secure_bosphorus: "Защищать босфор"
 FRA_secure_bosphorus_desc: "Недавние политические события в Анатолии серьезно угрожают нашему доступу к Черному морю и международной торговле через Босфорский пролив, и радикальное турецкое правительство четко заявило, что оно намерено национализировать пролив и не допустить того, чтобы парящие суда проникли в то, что, по его мнению, являются содружественными водами. Дипломатические усилия не увенчались успехом, и пришло время заставить турок открыть нам Босфор."
 ###
 FRA_secure_siam: "Защищать Сиам"
 FRA_secure_siam_desc: "Сиамская нация существует главным образом в качестве буферного государства между французской индохиной и британскими позывными в Малайе и Индии, однако у международного сообщества нет иного выбора, кроме как вторгнуться в примитивное королевство для защиты наших интересов в регионе. Земля джунглей и обширные реки позволят нам занять оборонительную позицию против англичан, если они решат надавить на атаку в этот регион, что даст нам достаточно времени для того, чтобы направить подкрепление и подготовиться к контратаке."
 ###
 FRA_royal_decrees: "Обеспечение функционирования Королевской администрации"
 FRA_royal_decrees_desc: "Когда французская монархия наконец-то восстановилась, и король снова стал главой как государства, так и правительства, наша нация вскоре достигнет своего политического зенита. Но для того, чтобы это зенитное событие произошло, мы требуем, чтобы все государство полностью поддерживало нашу политику и приказы. Несколько регионов во Франции осудили возвращение королей, и в настоящее время мы находимся в состоянии большой гражданской войны. Для того чтобы восстановить порядок в стране, нам нужно либо достичь компромисса с каждым из мятежных регионов, либо вмешаться в военные действия. Мы должны быть осторожны, поскольку военные действия с сопротивлением могут ослабить нашу легитимность и повернуть нашу поддержку против нас. Мы должны стремиться сохранить нашу легитимность выше §G20%.!!"
