 #Description
 FRA_FUHRERREICH_DESC: "Победоносно, но зачем? Многие французы стали спрашивать об этом после Великой войны. Франция вернула свою законную землю и создала протекторат над Рейнландом, чтобы не дать немцам когда-либо вновь угрожать Ла-Патрие. Однако, когда 1930-е годы заканчиваются, позиция Франции в Европе и мире становится все более угрожающей, когда враждебная Британская империя угрожает французским колониям и все более агрессивному Советскому Союзу, но, возможно, самая большая озабоченность — это возрождение Германии. Франции потребуются хитрость, храбрость и отличная дипломатия, чтобы выйти из надвигающегося шторма невредимой."
 #Focus Tree
 france_focus_junta: "Дерево военного правительства"
 #Research Groups
 continental_entente_research_name: "Научно-исследовательский институт"
 continental_entente_research_desc: "Научно-исследовательский институт &quot; Энтенти &quot; , или просто &quot; EIR &quot; , является академической организацией, возглавляемой Францией."

 #### Political Parties ####

 FRA_vanguardist_party: "ПФНС"
 FRA_vanguardist_party_long: "Торговая политика: §B protectionis §! htm Economic Policy: §Hplaned Economy §! n War Policy: §RJingoism §!! n Parti Français National коммунистические партии во Франции, поддерживая расистскую доктрину отказа от сотрудничества с правительством каким-либо образом. Партия поддерживает как раттахизм, так и панъевропейский национализм, стремясь объединить Европу при едином централизованном правительстве с французским на самом верху. nDepspite является крайней партией, PFNC является крайне враждебным по отношению к партии Populaire Français и другим радикам как слева, так и справа. Первоначальный лидер PFNC, Marcel Death, продемонстрировал, что имеет очень радикальные мнения даже со стороны партии."
 ###
 FRA_collectivist_party: "PCF"
 FRA_collectivist_party_long: "Торговая политика: §WFree Trade §! htm Экономическая политика: §Y Interventionis §! n War Policy: §GPro-Military §! n Parti Communical Français international Party communical Party frrançais является основной коммунистической партией, которая в настоящее время действует во Франции. Первоначально, в конце 1920 года, PCF стал более радикальным отрядом SFIO, одним из его основателей. Партия постоянно приобрела популярность в начале XIX века, и опросы показывают, что поддержка PCF была выше, чем когда-либо, из-за возрождения немецкой власти на Востоке и расширения советского влияния в Европе. Морис Торес, лидер партии, является коммунистическим, имеющим связи с правительством и большой политический опыт."
 ###
 FRA_libertarian_socialist_party: "Анархисты"
 FRA_libertarian_socialist_party_long: "Торговая политика: §WFree Trade§! ~ Экономическая политика: §YLassz Fare§!! ~ Военная политика: §MA Anti-Military §! ~ nnM Anarchiste Français ~n §gA коллекция анархистов и либеральных социалистических движений, возглавляемых Себастьеном Форе под общим знаменем, анархисты хотят, чтобы во Францию пришла большая степень децентрализации и мирный, демократический переход к революции. ~ Хотя движение анархистов может быть небольшим по количеству и низкой популярностью, они могут оказаться бесценными в случае прихода левого правительства к власти во Франции, демократическим или иным образом.§!"
 ###
 FRA_social_democrat_party: "СФИО"
 FRA_social_democrat_party_long: "Торговая политика: §WFree Trade §! ~ Экономическая политика: §g State Capitalism §! n War Policy: §M Anti-Military §! no District Francraise de l'International Ovrière à §g from conclusion of the System of France and France Straval Party в 1905 году, и быстро оказались в спячке между радикальными синдикалистами и либералами среднего класса под знаменем Радикальной партии."
 ###
 FRA_social_liberal_party: "ПР"
 FRA_social_liberal_party_long: "Торговая политика: §WFree Trade §! ~ Экономическая политика: §Y Interventionism §! n War Policy: §M Anti-Military §! n Parti Républicain, Radical et Radical-Socialiste \n §gBorn вскоре после начала века в 1901 году, PR является главным из радикальных демократических партий, действующих в настоящее время во Франции. Первоначально, практически левая политика постепенно переместилась в центр с растущей популярностью SFIO, захватывая сердца и умы рабочих и рабочих Франции. ~ После Великой войны PR принял участие в небольших ролях правительства, в то время как постоянно затмечено коалиционным правительством FR-AD, которое доминировало во французской политике в 20-е и 30-е годы. noPopular поддержка PR никогда не была большой, и они должны работать вместе с другими более крупными партиями, чтобы продвигать свою повестку дня, но коалиционное правительство с участием PR, несомненно, будет радикальным изменением статус-кво."
 ###
 FRA_market_liberal_party: "АД"
 FRA_market_liberal_party_long: "Торговая политика: §WFree Trade §! ~ Экономическая политика: §g State Capitalism §! ~ n War Policy: §GPro-Military §! nn Alliance Democracy un §gCreated в 1901 году как отколовшийся от Партии республиканцев, AD был большим сторонником Bloc des gauches в период с 1899 по 1906 год. AD отличался от этого права, поддерживая Закон 1905 года о сеперации государства и церкви, против которого выступили многие правые стороны из-за их прокатолической политики."Parti Démocratique Républicain". \nThe AD made a transition to the right in the years leading up to and including the Great War, and in 1919 they formed the Bloc National in cooperation with the Fédération Républicaine. This coalition proved to be highly successful, and the postwar economic boom that the French economy experienced further solidified their popularity with the French people. This "blue wave" was more beneficial to the FR than the AD, but both parties remained dominant in French politics up to 1936.§!"
 ###
 FRA_social_conservative_party: "ФР"
 FRA_social_conservative_party_long: "Торговая политика: §B protectionis §! no Economic Policy: §g State Capitalism §! n War Policy: §GPro-Vition §! n ne Fédération Republicaine n §gFR был создан в 1903 году в попытке объединить консерваторов во Франции, которые выступали против Bloc des gauches, а также частично в защиту еврейского офицера Альфреда Дрейфуса, партии, которая в это время состояла из консервативной буржуазии Франции, которая в целом выступала против социальных реформ и поддерживала незначительную децентрализацию по всей стране."
 ###
 FRA_authoritarian_democrat_party: "PSF"
 FRA_authoritarian_democrat_party_long: "Торговая политика: §B protectionis §! ni Economic Policy: §Hplaned Economy §! n War Policy: §GPro-Military §! n Parti Social Français n §gA националистическая французская партия в начале 1936 года и может отследить свое происхождение от крайне правой политической лиги, известной как «Крус-де-Фе», которая была основана только в 1927 году. «Крус-де-Фе» поддержала идеи Франсуа де ла Рокке, который служил в качестве церемониального лидера лиги. Действующее правительство попыталось запретить все лиги после беспорядков в феврале 1934 года, но из-за влияния лиги на и без того правое правительство, этот акт провалился, и лигамам было позволено продолжать свою деятельность беспрепятственно."
 ###
 FRA_paternal_autocrat_party: "Военная хунта"
 FRA_paternal_autocrat_party_long: "Торговая политика: §B protectionism §! ~ Экономическая политика: §Hпланированная экономика §! ~ Военная политика: §GPro-Военная §! ~ n un junta n §g поддержка военной хунты ограничивается радикалами в армии, и единственная возможность захвата власти военной хунтой будет в случае полного краха правительства и необходимости мощной силы для заполнения вакуума власти. §!"
 ###
 FRA_national_populist_party: "PPF"
 FRA_national_populist_party_long: "Торговая политика: §B protectionis §! ~ Экономическая политика: §HPlaned Economy §! ~ n War Policy: §RJingoism §! n Parti Populaire Français n §gasely наиболее радикальные из правых партий Франции, PPF поддерживает экстремальный национализм, расистскую риторику и приватизацию промышленности. PPF был создан главным образом членами ФПК, которые заслужили презрение к политике ПФНК и в целом были недовольны неудачей левых сторон в последние десятилетия. ~ ПФП открыто выступает против коммунизма и использует иконографию и символизм для того, чтобы заручиться поддержкой, большая часть которой основана только на севере Парижа. PFFF имеет незначительную поддержку во французском политическом пространстве, и даже не столь же радиальный ПФНК готов сотрудничать с партией."
 ###
 FRA_valkist_party: "SF"
 FRA_valkist_party_long: "Торговая политика: §B protectionism§! ~ Экономическая политика: §YLassez Fare§!! ~ Войная политика: §GPro-Violité §!! nn no Solidarité Française un §g France, единственное валькистское движение солидаризма во Франции, France Solidarité Française не имеет практически никакой внутренней поддержки за пределами некоторых немцев, проживающих в Альсасе-Лоррейне и Сарре. Многие во французской политике считают, что SF открыто работает против французского государства, чтобы создать коллаборационистский режим, подчиняющийся Германии. SF не имеет реального централизованного руководства и только объединяется в своей уникальной идеологии, которая сильно отличается от всех остальных в спектре.§!"

