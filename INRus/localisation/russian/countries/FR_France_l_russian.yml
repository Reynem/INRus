 FRA_francois_darlan: "Франсуа Дарлан"
 #FRA_francois_darlan_admiral_desc: "§L\n7 August 1881, в Нераке, Лот-Гаронне, Третьей Французской Республике, §YNaval Карьера: §L\nJean Louis Kavier Франсуа Дарлан родился от семьи, давно связанной с флотом. В 1902 году он выпускался из Военно-морского флота, а во время Вельткрига, в частности, служил в артиллерийской батарее во время битвы при Вердуне. В хаосе революции, который был отвергнут его патриотизмом и умеренными левыми убеждениями, Дарлан воссоединился с военно-морским флотом Коммунарда и в течение следующих нескольких лет быстро восстал в ряды. В настоящее время он является одним из самых уважаемых людей во французском флоте, гордился институтом, который он помог восстановить."

