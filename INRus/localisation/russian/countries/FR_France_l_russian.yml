 #### FOCUS ####
 fra_support_levant: "Промышленная поддержка [PHN.GetName]"
 fra_support_levant_desc: ""
 fra_give_phn_planes: "Предоставить [PHN.GetName] воздушным судам"
 fra_give_phn_planes_desc: ""

 fra_invest_budget: "Проверка национального бюджета"
 fra_invest_budget_desc: "Национальные бюджеты на период 1933-1935 годов были сокращены на несколько миллионов франков в том объеме, в каком они предполагалось, и, как хотелось бы надеяться, всестороннее изучение бюджета позволит выявить источник этих недостающих средств и соответственно скорректировать расходы."
 ###
 fra_invest_army: "Расследование деятельности армии"
 fra_invest_army_desc: "Первоначальный доклад о национальном бюджете оказался неэффективным, и мы должны глубже копнуть, чтобы найти источник этой утечки и заглушить ее."
 ###
 fra_promote_defense: "Лучшая защита..."
 fra_promote_defense_desc: "Если Великая война нас чему-то научила, то ничто не может победить безупречную оборонительную доктрину."
 ###
 fra_fort_research: "Экспериментальные исследования в области укрепления"
 fra_fort_research_desc: "Французская сельская местность - это прекрасное место для проверки новых стилей крепостей и определения того, какие из них предвосхищаются при определенных условиях. Когда эти тесты будут проведены, мы сможем найти наиболее эффективную и эффективную систему, которая остановит врага на их следах."
 ###
 fra_allocate_fort_funds: "Выделение средств на линию Кале-Метц"
 fra_allocate_fort_funds_desc: "Нашей слабостью во время Великой войны была бельгийская граница и ужасная естественная оборона в Пас-де-Кале. 20 лет тому назад германцы не смогут вторгнуться по тому же маршруту, который они использовали."
 ###
 fra_good_defense: "...идеальная защита."
 fra_good_defense_desc: "С завершением наших оборонительных проектов мы превратили всю Францию в один огромный бункер."
 ###
 fra_promote_offense: "Наружу со Старым..."
 fra_promote_offense_desc: "Наступательные действия 1918-1919 годов показали, что простое сохранение оборонительной позиции никогда не выиграет войну сама по себе."
 ###
 fra_fund_military_uni: "Фонд военных колледжей"
 fra_fund_military_uni_desc: "Для того чтобы выиграть войну, стране нужен полный список конкурентоспособных генералов, обученных искусству современной войны."
 ###
 fra_modern_doctrine: "Современная доктрина"
 fra_modern_doctrine_desc: "Мы решили, что оборонительная доктрина, которая служила нам во время последней войны, уже недостаточно хороша для современной армии."
 ###
 fra_in_new: "...с новым"
 fra_in_new_desc: "Наша доктрина была возрождена, наша армия модернизирована, и наши генералы свежи, наши военные способны противостоять угрозам нового мира, где бы они ни находились."
 ###
 fra_invest_ic: "Расследование дел капиталистов"
 fra_invest_ic_desc: "Капиталисты уже давно царствуют во Франции без ограничений или надзора, как раз пора нам их навестить и спросить, знают ли они что-нибудь о нехватке средств."
 ###
 fra_give_land: "Перераспределить Зизед-Землю"
 fra_give_land_desc: "В ходе расследования, проведенного капиталистами, сотни акров пустынных и незаконно принадлежащих земель были переданы под временный правительственный контроль с целью их возвращения, когда это возможно, и, как представляется, настало время, и несколько богатых людей захватили нас в Нормандии и Аквитане с намерением выкупить эту землю у нас."
 ###
 fra_invest_government: "Расследование, проводимое правительством"
 fra_invest_government_desc: "Расследование как капиталистов, так и армии оказалось безрезультатным, и единственное место, где осталось посмотреть, это само правительство, хотя некоторые члены выступают против таких наглых действий, большинство согласны с тем, что это должно быть сделано, чтобы доказать нашу невиновность в скандале."
 ###
 fra_the_trial: "Судебный процесс над одиннадцатью"
 fra_the_trial_desc: "Финансовый скандал перерос в полный кризис, и мы были вынуждены поставить одиннадцать членов нашего собственного правительства перед специальным судом, чтобы определить суровость их наказания."
 ###
 fra_nuc_dead: "Национальный Блок распустился"
 fra_nuc_dead_desc: "С завершением процесса над одиннадцатью оставшимися лидерами «Блок нэшнл» оказалось невозможным сплотить коалицию и обеспечить эффективное правительство при народной поддержке."
 ###
 fra_prov_govt: "Военный захват"
 fra_prov_govt_desc: "Нынешнее правительство явно не в состоянии справиться с горами проблем, с которыми наша страна сталкивалась в последние месяцы. Финансовый скандал и растущая германская агрессия оказали слишком большое давление на французское правительство."Government of National Salvation" in order to stabalize the situation."
 ###
 fra_nuc_alive: ""Bloc National" выживает"
 fra_nuc_alive_desc: "Судебный процесс по делу одиннадцати человек вынудил французское правительство взбеситься, и «Блок нэшнл» вышел из него сильнее, чем когда бы то ни было."
 ###
 fra_1936_election: "Выборы 1936 года"
 fra_1936_election_desc: "После финансового скандала правительство готово начать выборы 1936 года, которые первоначально планировалось провести в начале марта."
 ###
 fra_socdem_win: "СФИО"
 fra_socdem_win_desc: "После стремительного падения Национального банка Французская секция международного права выиграла выборы 1936 года, цель которых состоит в универсальном повышении прав и уровня жизни не только для мужского населения, но и для женщин и подданных Республики в колониях."
 ###
 fra_soclib_win: "Радикальная партия"
 fra_soclib_win_desc: "Поощрение светскости, умеренной социальной реформы и развития частного сектора, PR рассматривается многими французскими избирателями в качестве партии среднего уровня, способной удовлетворить потребности как консерваторов, так и социалистов."
 ###
 fra_soccon_win: "Республиканская федерация"
 fra_soccon_win_desc: "Великая война потрясла французскую политику и общество до глубины души, и волна консервативной поддержки после распада привела к росту Блока, а также к доминированию Федерации республиканцев над коалицией."
 ###
 fra_nuc_win: "Национальный Блок"
 fra_nuc_win_desc: "Нэшнл Блок, несмотря ни на что, сумела продвинуться вперед в финансовом скандале, который разразился в рамках их собственной партии, и выиграла выборы на волоске."
 ###
 fra_algeria_rights: "Права коренных алжирских народов"
 fra_algeria_rights_desc: "Африканское население в Алжире живет в столичной Франции с момента завоевания алжирской береговой линии в 1870-х годах, и, тем не менее, оно не пользуется теми же личными правами, что и проживающие там французы."
 ###
 fra_africa_missionary: "Миссионеры в Африке"
 fra_africa_missionary_desc: "Для того чтобы укрепить метрополию Франции, мы должны обратить уроженцев Алжира в католицизм, и этот процесс будет непростым, и мы можем столкнуться с вооруженным сопротивлением, если мы осуществим этот план; однако это необходимо сделать, чтобы укрепить нашу позицию."
 ###
 fra_more_jobs: "Пропаганда промышленной продукции"
 fra_more_jobs_desc: "Наша индустрия начинает отставать от британской и немецкой нациями, инъекционные фонды и расчистка земель дадут нашей промышленности возможность выращивать, в чем она так отчаянно нуждается."
 ###
 fra_extend_healthcare: "Расширенное медицинское обслуживание"
 fra_extend_healthcare_desc: "Несмотря на то, что наша система здравоохранения является цивилизованной и западной колониальной державой, она крайне устарела и раздута."
 ###
 fra_revise_finance: "Пересмотр финансовых планов"
 fra_revise_finance_desc: "Финансовый скандал 1936 года разбил Францию на самое сердце, и мы отчаянно нуждаемся в радикальной реорганизации, если мы хотим продолжать эффективно управлять страной."
 ###
 fra_business_subsidy: "Бизнес-субсидии"
 fra_business_subsidy_desc: "Капиталисты с трудом реорганизовали и восполнили свои потери после расследования и запросили субсидии, чтобы построить новые фабрики по всей Франции и вернуть индустрию наций на ноги."
 ###
 fra_unified_govt: "Единое правительство"
 fra_unified_govt_desc: "Споры и политическая нестабильность, наконец, позади, и теперь мы можем продвигаться вперед с единым и единым правительством, которое способно безнаказанно управлять нашей империей."
 ###
 fra_colony_coop: "Поощрение колониального сотрудничества"
 fra_colony_coop_desc: "Наши колонии в целом зависят друг от друга, запрашивая материалы у самой Франции, а не у земель, которые пересекают границу, поощряя связь и сотрудничество между колонами, они могут более уверенно управляться, и мы можем пожинать благодеяния."
 ###
 fra_taming_tunisia: "Тяжелый Тунис"
 fra_taming_tunisia_desc: "Тунисский протекторат всегда был недостаточно развит по отношению к остальной Франции и ее колониям, если мы хотим изменить это, мы можем создать колонию, чтобы точно соответствовать нашим потребностям."
 ###
 fra_algeria_adventure: "Приключения в Алжире"
 fra_algeria_adventure_desc: "Возможно, алжирская пустыня неприкосновенна, но есть участок земли к югу от береговой линии, который является плодородным и практически умоляет к развитию."
 ###
 fra_prov_election: "Смерть Республики"
 fra_prov_election_desc: "Французская третья Республика оказалась крайне неспособной справиться с напряженной политической обстановкой, которая возникла в XX веке, и многие считают, что настало время радикальных перемен, и полная перестройка конституции приведет к новой эре французской политики и процветания."
 ###
 fra_af_control: "AF в контрольном режиме"
 fra_af_control_desc: "После завершения предварительных выборов Французская организация действий была избрана демократическим путем, а баланс сил во французской политической сфере радикально изменился."
 ###
 fra_papal_love: "Папское примирение"
 fra_papal_love_desc: "Республика уже давно пытается дистанцироваться от Папы, и с момента революции разделение церкви и государства является одним из определяющих аспектов нашей нации, и этот период враждебности придет к концу с новым режимом, и наши отношения с Римом будут восстановлены в его прежней гордости."
 ###
 fra_army_loyalty: "Обеспечение лояльности армии"
 fra_army_loyalty_desc: "Для того чтобы не допустить военного переворота, мы должны предоставить определенные гарантии военнослужащим и повысить их в должности, с тем чтобы завоевать их доверие и уважение."
 ###
 fra_party_news: "Французская газета Действия"
 fra_party_news_desc: "С момента создания нашей партии в начале века газета «Действия Франсис» стала нашим главным средством доведения до людей и распространения нашего послания по всей Франции."
 ###
 fra_restore_chin: "Восстановление монархии"
 fra_restore_chin_desc: "При поддержке Папы, народа и военных пришло время пригласить изгнанного Орлеанского принца взять французский трон. Республиканский эксперимент будет прекращен раз и навсегда, и божественная монархия будет царствовать!"
 ###
 fra_illegal_strikes: "Отмена законности забастовок"
 fra_illegal_strikes_desc: "Франция имеет историю забастовки промышленных рабочих, когда они чувствуют, что все их требования не удовлетворяются в полном объеме, и наше правительство всегда сдалось в них."
 ###
 fra_german_menace: "Немецкая угроза"
 fra_german_menace_desc: "Немецкая агрессия на протяжении многих лет неуклонно растет, и мы не можем больше сидеть безучастно, пока военная машина по Рейну продолжает вращаться."
 ###
 fra_royal_nation: "Поощрять национализм роялистов"
 fra_royal_nation_desc: "Несмотря на то, что наше правительство находится на нашей стороне, многие люди по-прежнему сопротивляются монархии и хотят вернуться в коррумпированную республику, которую мы так упорно трудились, чтобы вывести из нашего славного государства."
 ###
 fra_destroy_ppf: "Уничтожить левых"
 fra_destroy_ppf_desc: "Французские левые уже давно хотят, чтобы в 1871 году произошла жестокая революция, аналогичная той, которая произошла в Париже."Commune of France". This group of parties is perhaps the greatest internal threat to our stability that we face, and they must be put down if we are to truly feel secure at home."
 ###
 fra_royal_glory_focus: "Восстановите царскую славу"
 fra_royal_glory_focus_desc: "Многие в нашей стране до сих пор считают нашего короля не более чем символом, а не божественным монархом, каким он на самом деле."
 ###
 fra_fight_socialism: "Запрещение Социалистических партий"
 fra_fight_socialism_desc: "Левые всегда были местом для волнений и недовольства в нашей стране, их партии должны быть запрещены, чтобы они не могли вмешиваться в наше управление страной."
 ###
 fra_recruit_posters: "Прием на работу"
 fra_recruit_posters_desc: "После окончания Великой войны наша армия резко сократилась по мере того, как солдаты вернулись в свои дома после ужасов войны, и мало кто вызвался защищать Республику, но с растущей немецкой угрозой на горизонте мы должны предпринять шаги для обеспечения того, чтобы у нас было достаточно людей для того, чтобы пережить следующую войну и направить армию, аналогичную армии Наполеона."
 ###
 fra_juan_party: "Одна сторона, одно государство, одна Франция."
 fra_juan_party_desc: "Все Франция поклоняется нашей воле, и нам еще раз была предоставлена возможность взять на себя полную гегеомию континента и наполнить нашу судьбу."
 ###
 fra_royal_education: "Роялистское образование"
 fra_royal_education_desc: "Похоже, что история французской монархии была потеряна для граждан нашего королевства."
 ###
 fra_german_war: "Опусти немецкую собаку."
 fra_german_war_desc: "Стало ясно, что новый Немецкий Рейх не намерен соблюдать Версалийский договор и угрожает самой стабильности всего континента."
 ###
 fra_distribute_titles: "Распространять королевские титулы"
 fra_distribute_titles_desc: "Различные изгнанные благородные дома Франции уже в течение некоторого времени требуют официального восстановления их королевских титулов, хотя это не означает, что мы увидим возвращение в фуэдалское общество, это шаг, который, безусловно, повысит легитимность наших правительств."
 ###
 fra_empire: "Провозгласить Империю"
 fra_empire_desc: "Немцы были поставлены на свое место, и мы вновь не противостояли континентальной Европе."
 ###
 fra_christ_spread: "Распространение христианских убеждений"
 fra_christ_spread_desc: "Франция и ее монархия всегда были непоколебимыми христианами, и радикальная светская секуляризация за последние полвека — это не что иное, как богохульство."
 ###
 fra_demolish_republic: "Демобилизационные республиканские институты"
 fra_demolish_republic_desc: "Спектры Республики по-прежнему висят над повседневным управлением страной и удерживают нас от достижения максимальной эффективности. Мы должны систематически перерабатывать правительство, если мы хотим избавиться от этой шкуры."
 ###
 fra_colonial_rights: "Представительство коренного населения в колониях"
 fra_colonial_rights_desc: "Французская колониальная администрация управляется почти исключительно теми, кто родился и вырос в метрополии, что позволит коренному населению принимать участие в колониальной администрации, повысит стабильность и безопасность наших заморских авуаров."
 ###
 fra_social_patriotism: "Социалистический патриотизм"
 fra_social_patriotism_desc: "После многих лет коррумпированного и слабого правительства партия народа наконец-то была избрана к власти во Франции, люди поддерживают наше правление и с нетерпением ждут реформ и законопроектов, которые мы намерены принять."
 ###
 fra_peoples_govt: "Правительство для народа"
 fra_peoples_govt_desc: "Согласно намерению первоначальной французской революции, правительство будет служить людям для их нужд и желаний, мы создадим убежище для угнетенных народов Европы и введем в новую эру гражданской стабильности и потребления."
 ###
 fra_regulate_franc: "Регулирование франка"
 fra_regulate_franc_desc: "Финансовый скандал в нашей стране доказал, насколько неустойчивой может быть валюта, и необходимо принять решительные меры для того, чтобы стабилизировать франк и обеспечить экономическое процветание."
 ###
 fra_safe_rhine: "Защищать наши интересы на Рейне"
 fra_safe_rhine_desc: "Французский контроль над Рейнлендом оказался весьма выгодным с экономической точки зрения, но он также сопряжен с большим риском; вооруженное восстание и инверсия из Германии окутываются над нами как постоянная и неустанная угроза."
 ###
 fra_fight_religion: "Война против религии"
 fra_fight_religion_desc: "Церковь и государство отделяются уже более трех десятилетий, но религия по-прежнему дорога сердцам многих граждан."
 ###
 fra_communes: "Пропаганда социальных общин"
 fra_communes_desc: "Социальные коммуны представляют собой группы граждан, которые заботятся друг о друге и помогают друг другу в трудные времена, содействуя расширению и формализации этих групп, поможет нам искоренить безработицу и нищету, а также заметно увеличит нашу популярность."
 ###
 fra_equality: "Равноправие"
 fra_equality_desc: "Каждый француз должен иметь одинаковую возможность достичь желаемого без ограничения социального класса или экономического положения."
 ###
 fra_land_grants: "Гранты на землю"
 fra_land_grants_desc: "Франция является огромной страной с множеством участков неиспользуемых девственных земель, просто попрошайничая о развитии."
 ###
 fra_women_working: "Женщины в составе рабочей силы"
 fra_women_working_desc: "Слишком долго женщины были заперты в этих странах в промышленности и развитии, вместо этого были вынуждены содержать дом, и предоставление женщинам таких же возможностей, как и мужчинам в рабочей силе, не только сделает нас лучше, но и повысит нашу популярность."
 ###
 fra_womens_vote: "Женщины, страдающие от страданий"
 fra_womens_vote_desc: "Радикальная мечта женщин, страдающих от страданий, стала в последние несколько лет все более актуальной проблемой во французской политике, и она достигла такой точки, когда эту проблему уже нельзя просто игнорировать."
 ###
 fra_liberal_success: "Либеральный успех"
 fra_liberal_success_desc: "Наше либеральное правительство доказало, что сомневающиеся ошибаются, и нам удалось эффективно управлять страной, одновременно сдерживая как экономические, так и социальные реформы."
 ###
 fra_reverse_cash_drain: "Обратная утечка наличности"
 fra_reverse_cash_drain_desc: "Франция уже давно импортирует больше товаров, чем она экспортирует, и это привело к тому, что наше правительство уже несколько лет испытывает дефицит."
 ###
 fra_gold_flow: "Золото должно течь!"
 fra_gold_flow_desc: "Распределение богатства среди людей позволит им делать крупные покупки и продолжать экономический цикл, который удерживал нашу страну на плаву в период глобального экономического спада 1920-х годов."
 ###
 fra_intervention_economics: "Экономика Лайссез-фейер"
 fra_intervention_economics_desc: "Любая самодостаточная экономика не нуждается ни в каком правительственном вмешательстве, чтобы выжить, как многие люди могут не согласиться."
 ###
 fra_decentralize_economy: "Децентрализация экономики"
 fra_decentralize_economy_desc: "Дальнейший правительственный контроль над экономикой вновь и вновь доказал, что он не приносит ничего, кроме негативных результатов, поэтому единственным логическим выводом является полная децентрализация и отказ от контроля над экономикой, что позволяет экономическим тенденциям идти своим чередом."
 ###
 fra_unshakable_economics: "Неудержимая экономика"
 fra_unshakable_economics_desc: "Нам удалось вернуть французскую экономику с грани краха и создать новую экономическую систему, которая, несомненно, выдержит испытание временем на войну, голод, болезни и все остальное, что мир должен бросить на нас."
 ###
 fra_watch_rhine: "Смотри на Рейн"
 fra_watch_rhine_desc: "Река Рейн находится под французским контролем с конца Великой войны в 1919 году, и мы покинули этот район крайне слабо из-за дружелюбного республиканского режима в Германии. С повышением националистического и милитаристского режима Дресслера нам нужно усилить нашу оборону на реке Рейн в случае упреждающего немецкого нападения и обеспечить, чтобы ни один немецкий ботинок не шел на французскую землю."
 ###
 fra_rhine_martial_law: "Объявить ринский военно-воздушный закон"
 fra_rhine_martial_law_desc: "Ринишское государство находится в хаосе, когда боевые действия происходят как на передовой линии, так и вокруг сельской местности, когда немецкие националисты, которые лояльны к валькистскому режиму, пытаются нарушить линии снабжения и усложнить жизнь нашим войскам. Мы должны взять под военный контроль страну, с тем чтобы лучше организовать нашу армию и бороться с тем, что вскоре может стать повторением первой Великой войны."
 ###
 fra_no_german: "Не одинокий штальм на французской земле!"
 fra_no_german_desc: "Французский народ, переживший невероятное количество страданий во время первой Великой войны, северо-восточная Франция постоянно была измучена от сражений, и мы должны обеспечить, чтобы варварские немцы не лежали ни на одном шагу на нашей земле, чтобы они не запятнали ту неуязвимую территорию, которую мы оставили."
 ###
 fra_on_the_attack: "О наступлении"
 fra_on_the_attack_desc: "Мы должны обеспечить, чтобы наше военное командование было ориентировано на самый смертоносный и самый трудный этап этой войны."
 ###
 fra_march_to_berlin: "Марш в Берлин"
 fra_march_to_berlin_desc: "Рейх стоит на заднем плане, и наши победы на фронте многочисленны. Война в Европе быстро приближается к концу, и чем быстрее мы доберемся до Берлина, тем быстрее наши мальчики смогут вернуться домой."
 ###
 fra_triumph: "Триумф в Берлине"
 fra_triumph_desc: "Мы победили во второй Великой войне, и Немецкий Рейх вновь побежден под нашим железным ботинком, город Берлин является местом празднования для оккупационных держав, и, согласно сообщениям, в городе происходят грабежи, мы должны организовать официальный военный парад через Бранденбургские ворота, чтобы показать миру наше превосходство."
 ###
 fra_loosen_conscription: "Требования, предъявляемые к набору персонала"
 fra_loosen_conscription_desc: "Немецкая угроза вновь посягает на нашу территорию, и нам нужно, чтобы каждый способный орган сражался на фронте, чтобы оттолкнуть их обратно через Рейн."
 ###
 fra_even_lower_soldiers: "Дополнительный призыв Loosen"
 fra_even_lower_soldiers_desc: "Днем немцы приближаются к Парижу, и ситуация с каждым днем становится все более отчаянной. Мы должны дать оружие каждому, кто может стрелять из него, чтобы спасти нашу страну от повторения франко-прусской войны."
 ###
 fra_desperate_defense: "Старый и отчаявшийся"
 fra_desperate_defense_desc: "Приближаются последние дни Франции, и в настоящее время даже пожилые люди, и немощные свободны от призыва в армию, и если она дышит и говорит по-французски, мы должны положить ей в руки оружие."
 ###
 fra_ground_eyes: "Глаза на землю..."
 fra_ground_eyes_desc: "Бороться со слепой войной - значит навязать себя определенному поражению, мы должны знать, где находятся наши враги, если мы хотим добиться победы в эту новую эру быстрой и мобильной войны, где каждая секунда имеет значение."
 ###
 fra_sky_eyes: "...И глаза в небе."
 fra_sky_eyes_desc: "Воздушный разведчик быстро оказывается одним из определяющих факторов в том, кто победит в битве, как показали наши войска в Риф-Войне в 20-е годы, дальнейшее развитие этой доктрины повысит наши шансы на победу на Балфилде и позволит нам увидеть вражеские движения и отреагировать соответствующим образом."
 ###
 fra_general_staff: "Генеральный штаб Франции"
 fra_general_staff_desc: "Генеральный штаб Германии доказал, что он является смертоносным инструментом в войне, и воспроизведение их успеха может быть именно тем, что нам нужно, наконец, вернуть немцев на свое место."
 ###
 fra_integrate_colony_army: "Интегрировать колониальные дивизии"
 fra_integrate_colony_army_desc: "Французские колонии обучают свои разногласия тактике, не знакомой с европейскими державами, и поэтому они могут быть эффективной боевой силой на передовой линии в следующей войне."
 ###
 fra_mas_40: "MAS 40"
 fra_mas_40_desc: "Разработка новых видов оружия является важнейшим элементом победных войн, и новые технологические достижения дали нам возможность создать подлинно современное оружие, MAS-40."
 ###
 fra_mil_institute: "Французский институт военной технологии"
 fra_mil_institute_desc: "Нам нужно разработать новые способы борьбы на суше, в воздухе и на море, если мы хотим быть впереди наших врагов и добиться победы по всем аспектам борьбы."
 ###
 fra_entente_tech: "Совместная исследовательская инициатива"
 fra_entente_tech_desc: "В «Увлечении» находятся самые яркие умы на планете, организуя и объединяя свои работы для подобия нашей фракции, значительно увеличит исследовательский потенциал для всех нас."
 ###
 fra_doctrine_school: "Доктрина"
 fra_doctrine_school_desc: "Военная доктрина имеет гораздо более важное значение, чем нынешние военные руководители, и жизненно важно, чтобы мы не забывали об этом при создании нашей армии."
 ###
 fra_african_officers: "Сотрудники по африканским вопросам"
 fra_african_officers_desc: "Несколько военных школ в наших африканских колониях выпустили несколько исключительных офицеров, которые продемонстрировали большой потенциал в военной области."
 ###
 fra_drumroll_arty: "Артиллерия для барабанного барабана"
 fra_drumroll_arty_desc: "На более поздних этапах Великой войны канадская армия применяла форму скачивания артиллерийских бомб, с тем чтобы скрыть передвижение своих солдат по вражеским позициям. Наши офицеры гипотезуют, что модифицированная форма этой скатываемой артиллерии могла бы быть использована для более эффективного обстрела позиций противника и одновременного приведения их голов вниз."
 ###
 fra_anti_tank: "Противотанковые установки"
 fra_anti_tank_desc: "Наши шпионы показали, что как Вермахт, так и Королевская армия начинают использовать танки новаторским и смертоносным способом, мы должны разработать новые орудия, способные уничтожить эти машины, если мы хотим пережить вторжение из любой страны."
 ###
 fra_rockets: "Экспериментальные разработки ракетных комплексов"
 fra_rockets_desc: "Ранние исследования по сжиганию твердого топлива и топливу, способному с еще большей точностью запускать боеголовки, принесли удивительные результаты. По нашим расчетам, дальнейшие разработки должны позволить нам добраться до отдаленных городов по всему континенту, и вскоре не будет безопасного места, где могли бы спрятаться наши враги."
 ###
 fra_curie_institute: "Институт Кюри"
 fra_curie_institute_desc: "Мари Кюри была знаменитой французской химикой, которая добилась не поддающихся учету достижений в научной области, и была большой ценностью для научного сообщества во всем мире. Мы создадим институт, посвященный ее наследию и сохранению науки до конца времени."
 ###
 fra_mobile_age: "Эпоха боевых действий"
 fra_mobile_age_desc: "Писание на стене, неподвижные боевые действия и медленно движущиеся формирования не выиграют нам битвы в современную эпоху."
 ###
 fra_mobile_army: "Мобилизация армии"
 fra_mobile_army_desc: "Для того чтобы победить на поле боя, мы должны быть в состоянии доставить наши войска туда, где они должны быть, прежде чем враг сможет нас опередить."
 ###
 fra_mobile_recon: "Улучшенная разведка"
 fra_mobile_recon_desc: "Чем быстрее наши разведчики смогут добраться до точек обзора, тем быстрее они смогут вернуть позицию врага в высококомандование, поэтому мы должны попытаться мобилизовать наши разведывательные подразделения."
 ###
 fra_scw_lessons: "Уроки испанской гражданской войны"
 fra_scw_lessons_desc: "Война на нашей южной границе преподала нам много ценных уроков о современной войне, и применение этих уроков к нашим армиям имеет решающее значение, если мы хотим получить преимущество над нашими более невежественными врагами."
 ###
 fra_armor_breakthrough: "Доктрина бронетехники"
 fra_armor_breakthrough_desc: "Какова цель наступательной битвы, если мы не можем нарушить линию врага?"
 ###
 fra_motorized_defense: "Моторизованная оборона"
 fra_motorized_defense_desc: "Посадить наших солдат в консервную банку на колеса и отправить их на фронт - это хорошо и хорошо, но если они не доберутся до поля боя в целости и сохранности, то наши усилия будут потеряны."
 ###
 fra_reinforcements: "Повышение коэффициента усиления"
 fra_reinforcements_desc: "Более быстрая армия означает, что мы сможем укрепить наши истощенные разногласия гораздо более быстрыми темпами, что позволит им продолжать борьбу и оставаться сильнее в течение гораздо большего периода времени."
 ###
 fra_mechanize_army: "Механизация армии"
 fra_mechanize_army_desc: "Наш моторизованный проект завершен, и мы стали свидетелями большого успеха во всем мире. Новые события с экспериментальными полутреками продемонстрировали еще больший потенциал, и очевидно, что путь к военному успеху -- это полная механизация армии."
 ###
 fra_hold_line: "Держать линию"
 fra_hold_line_desc: "Если бы Великая Война чему-то научила нас, так это тому, что не дать немцам достичь нашего промышленного сердца - это единственный способ предотвратить полную аннихаляцию нашего государства, удерживая врага на линии фронта, позволит нам собрать силы и оттолкнуть их туда, откуда они пришли!"
 ###
 fra_trench_bunker: "Трещины для бункеров"
 fra_trench_bunker_desc: "Многие из укрепленных траншей, которые были построены во время Великой войны, были помещены в исключительно достойные и тактически ценные районы, превращая эти районы в крепости и бункеры, будут сдерживать и вторгаться силы, которые пытаются напасть на нас через Кале."
 ###
 fra_fort_alsace: "Укрепить альзас"
 fra_fort_alsace_desc: "В то время как река Рейн обеспечивает какую-то естественную оборону, не было бы лучше, если бы мы смогли срубить врага, пытающегося очистить реку пулеметами и артиллерийскими снарядами?"
 ###
 fra_fort_savoy: "Укрепить Савойя"
 fra_fort_savoy_desc: "В то время как итальянцы номинально дружат с нами, их репутация немцев и австрийцев во время Великой войны показала, как беззаботно итальянцы держатся за альянсы, которые они создают. Укрепление Альпийской границы между нами и Италией в Савойе даст нам много времени, если итальянцы решат ударить нас ножом в спину."
 ###
 fra_fort_spain: "Укрепить пирене"
 fra_fort_spain_desc: "Гражданская война в Испании потрясла политическую ситуацию в регионе до глубины души, и весь Иберийский полуостров, кажется, готов взорваться в мгновение ока."
 ###
 fra_heavy_tanks: "Передвигающиеся бункеры"
 fra_heavy_tanks_desc: "Идея о больших и больших танках находится в глубине ума мировых теоретиков-танков с момента их появления во время Великой войны, и наше собственное развитие этих тяжелых танков окажется бесценным на поле боя."
 ###
 fra_defense_doctrine: "Принимать доктрины защиты"
 fra_defense_doctrine_desc: "Какая польза от участия в войне, если мы не в состоянии защитить нашу основную территорию от нападений?"
 ###
 fra_imperial_industry: "Промышленность для империи"
 fra_imperial_industry_desc: "Французская индустрия практически не поддается оценке на планете, не считая спящего американского гиганта, который не показывает признаков просыпания в ближайшее время."
 ###
 fra_move_industry: "Охрана нашей промышленности"
 fra_move_industry_desc: "Значительная часть нашей промышленной базы расположена в районе Кале вблизи бельгийской границы, и если немцы когда-либо решат вновь вторгнуться в нас, мы должны обеспечить, чтобы наша ценная промышленность не попадала в их руки и не использовалась против нас."
 ###
 fra_industry_loire: "В Луар"
 fra_industry_loire_desc: ""
 ###
 fra_industry_aquitaine: "В Аквитани"
 fra_industry_aquitaine_desc: ""
 ###
 fra_industry_rhone: "К Роуну"
 fra_industry_rhone_desc: ""
 ###
 fra_hydro_electric: "Гидроэлектрические исследования"
 fra_hydro_electric_desc: "Франция — это страна с множеством рек, и последние технологические достижения в деле использования удивительной мощности этих рек открыли нам много дверей."
 ###
 fra_disperse_industry: "Разъединить промышленность"
 fra_disperse_industry_desc: "Крупные промышленные предприятия создают легкую цель, и вражеские подрывные формирования смогут сломать нашу промышленную базу, если мы вступим в войну без воздушного превосходства."
 ###
 fra_industry_buildup: "Крупномасштабное промышленное строительство"
 fra_industry_buildup_desc: "Немецкая промышленная машина, по прогнозам, обгонит нас в течение не более чем нескольких лет, огромное наращивание нашей промышленности будет держать нас впереди кривизны и на вершине наших врагов."
 ###
 fra_expand_loire: "Расширение промышленности вдоль Луиры"
 fra_expand_loire_desc: "Предприятия, которые мы передислоцировали из северо-восточной части нашей страны в район Луара, оказались более эффективными и ближе к сырым ресурсам, необходимым для их производства."
 ###
 fra_expand_aquitaine: "Расширение промышленности в аквитане"
 fra_expand_aquitaine_desc: "Предприятия, которые мы передислоцировали из северо-восточной части нашей страны в Аквитанский регион, оказались более эффективными и ближе к сырым ресурсам, необходимым для их производства."
 ###
 fra_expand_rhone: "Расширить индустрию вдоль Рона"
 fra_expand_rhone_desc: "Предприятия, которые мы передислоцировали из северо-восточной части нашей страны в район Рона, оказались более эффективными и ближе к сырым ресурсам, необходимым для их производства."
 ###
 fra_rheinish_industry: "Рейнишская промышленная инициатива"
 fra_rheinish_industry_desc: "Рейнский протекторат полон великих умов, как французских, так и немецких, и мы должны активно искать этих людей и возвращать их во Францию, с тем чтобы улучшить наши промышленные методы и потенциал."
 ###
 fra_french_industry: "Французская промышленность"
 fra_french_industry_desc: "Нам не нужно искать за пределами наших собственных границ великие промышленные умы, нам нужно только смотреть больше."
 ###
 fra_industrial_unification: "Промышленное объединение"
 fra_industrial_unification_desc: "Со всеми нашими недавними промышленными и технологическими интригами настало время провести реорганизацию и объединить наши страны в промышленном секторе, с тем чтобы обеспечить его максимально плавное функционирование."
 ###
 fra_good_guns: "Оружие для кустарного промысла"
 fra_good_guns_desc: "Какая польза от винтовки, если она сломается после нескольких часов применения?"
 ###
 fra_quality_control: "Широкий контроль качества"
 fra_quality_control_desc: "Как только винтовка покинет фабрику, ее нужно тщательно проверить за линиями фронта, прежде чем она будет доставлена людям на поле."
 ###
 fra_lower_costs: "Рационализация производства оружия"
 fra_lower_costs_desc: "Наши нынешние методы производства оружия являются сложными, медленными и неэффективными; упорядочение этого позволит нам резко увеличить производство винтовок и артиллерийских орудий."
 ###
 fra_mas_contracts: "Контракты с МАПС"
 fra_mas_contracts_desc: "Подписывая контракты на поставки оружия, мы сможем разработать более совершенные и современные винтовки."
 ###
 fra_women_army: "Женщины в армии"
 fra_women_army_desc: "У нас огромный незадействованный источник рабочей силы среди женского населения, женщины по всей стране продемонстрировали отличный интеллект, став медиками, инженерами и даже солдатами в нашей армии."
 ###
 fra_many_guns: "Производство масс-винтовок"
 fra_many_guns_desc: "На протяжении многих лет наша армия страдала от острой нехватки винтовок, и что хорошего в солдате, если у него нет оружия в руках?"
 ###
 fra_many_soldiers: "Инициативная мобилизация населения"
 fra_many_soldiers_desc: "Войну нельзя вести без людей, чтобы бороться с ней, мы должны обеспечить, чтобы наши полки всегда были на полную силу, если мы хотим соревноваться с прусской военной доктриной, которая разрушила нашу армию во время последней войны."
 ###
 fra_native_regiments: "Коренные жители"
 fra_native_regiments_desc: "Огромное местное население в наших колониях дает нам источник дешевой рабочей силы, который может быть использован без каких-либо последствий для нас в ближайшем будущем. Возможно, разрешение туземцам сражаться в нашей армии даже ослабит их националистические идеи и заставит их просто хотеть быть как мы, хорошие французы?"
 ###
 fra_colonial_regiments: "Колониальная воинская обязанность"
 fra_colonial_regiments_desc: "Французы поселились в Африке вот уже более ста лет, и набор некоторых из них в нашу армию даст нам столь необходимый прирост наших истощенных запасов рабочей силы."
 ###
 fra_foreign_contracts: "Контракты на иностранное оружие"
 fra_foreign_contracts_desc: "Мы были бы глупы игнорировать великие умы, которые находятся за пределами наших собственных границ. Многие страны Европы делают новые разработки в области технологии оружия, которые радикально изменяют лицо поля боя. Мы должны иметь возможность вести переговоры по контрактам, а также по некоторым устаревшим экспериментальным винтовкам для того, чтобы сделать свои собственные выводы."
 ###
 fra_cadet_corps: "Поддержка Корпуса кадетов"
 fra_cadet_corps_desc: "Ключом к хорошо подготовленной армии является то, что солдаты завтра тренируются. Корпус кадетов познакомит нашу молодежь с армией нашей страны и даст им возможность специализироваться в конкретных областях. Не только это, но и корпус кадетов преподает им ценные уроки о том, как быть гражданином и продвигать наше общество в целом."
 ###
 fra_legacy_begone: "Новое наследие"
 fra_legacy_begone_desc: "Ужасы Великой войны позади, и для наших военных и промышленных кругов наступила новая эра, и мы вступим в следующее десятилетие со стоицизмом, уверенностью и непоколебимым отношением."
 ###
 fra_somme_begone: "Помните Вердуна"
 fra_somme_begone_desc: "Мы должны помнить тех, кто пал во время битвы при Вердуне, и всех тех, кто служил нашему великому народу во время всех наших войн, но мы не должны допустить, чтобы их жертвы были верны, мы должны бороться за то, чтобы почтить их наследие."
 ###
 fra_defensive_mastery: "Защитное мастерство"
 fra_defensive_mastery_desc: "Наши разработки оборонительных доктрин и тактики превратили нашу армию в недвижимый объект, который ни один враг никогда не мог бы оттолкнуть, мы создали крепость для того, чтобы навсегда сохранить безопасность нашего народа."
 ###
 fra_african_expeditions: "Африканские экспедиции"
 fra_african_expeditions_desc: "Как европейская держава, мы обязаны принести свет и цивилизацию на темный континент."
 ###
 fra_trans_africa_railway: "Трансафриканская железнодорожная сеть"
 fra_trans_africa_railway_desc: "Африка — это обширный континент, и двигаться по нему без использования лодок и путешествий по побережью практически невозможно."
 ###
 fra_algeria_prospecting: "Поиск нефти в Алжире"
 fra_algeria_prospecting_desc: "Ранние перспективы показали, что в алжирском регионе имеются крупные запасы нефти, которые мы могли бы легко эксплуатировать."
 ###
 fra_southern_refineries: "Марселйские нефтеперерабатывающие заводы"
 fra_southern_refineries_desc: "Сырьевая нефть бесполезена для нас, нам нужно пропустить ее через нефтеперерабатывающие заводы, чтобы превратить ее в топливо, пригодное для использования нашей армией."
 ###
 fra_tunisia_oil: "Перспективы в Тунисе"
 fra_tunisia_oil_desc: "Как представляется, сообщения наших изыскателей в Тунисе показали, что регион созрел с нефтью, и было бы глупо не эксплуатировать этот ценный регион как можно скорее."
 ###
 fra_north_africa_airbases: "Расширение североафриканских военно-воздушных баз"
 fra_north_africa_airbases_desc: "Защита наших североафриканских колоний имеет первостепенное значение для выживания нашей нации, и в эту новую эпоху военного контроля над небом имеет первостепенное значение для победы на поле боя."
 ###
 fra_operation_puddle_test: "Приготовиться"Opération Flaque""
 fra_operation_puddle_test_desc: "В случае падения материковой части мы должны быть готовы эвакуировать нашу армию и правительство в Северную Африку, где мы можем продолжать борьбу с нашими врагами."
 ###
 fra_med_screens: "Улучшенное скрининговое обследование в Средиземноморье"
 fra_med_screens_desc: "Наши конвои бесполезны, если только они не будут защищены с помощью кораблей для досмотра, и мы должны обеспечить, чтобы наша возможная эвакуация в Алжир была безопасной и беспрепятственной для наших врагов флотом."
 ###
 fra_desert_conquest: "Заголовок пустыни"
 fra_desert_conquest_desc: "Хотя пустыни в значительной степени необитаемы, они по-прежнему составляют значительную часть наших африканских особей."
 ###
 fra_planned_factories: "Запланированные африканские фабрики"
 fra_planned_factories_desc: "Африка — это огромное место, где имеется тонна помещений для запланированных производственных комплексов, и планирование того, где будут размещаться заводы, приведет в долгосрочной перспективе к повышению общей эффективности производства."
 ###
 fra_colonial_migration: "Поощрение колониальной миграции"
 fra_colonial_migration_desc: "Мы никогда не можем действительно утверждать, что наши африканские колонии являются неотъемлемой частью нашей страны до тех пор, пока французы не составят большинство населения."
 ###
 fra_gold_coast_ports: "Золотые прибрежные порты"
 fra_gold_coast_ports_desc: "Поездка по Африке без использования Суэцкого канала в лучшем случае опасна, и без сухогрузных портов наши суда рискуют перестать поставляться и никогда не добраться до места назначения."
 ###
 fra_algerian_forts: "Укрепить Алжир"
 fra_algerian_forts_desc: "Если наши враги когда-либо доберутся до Северной Африки, нам понадобятся жесткие установки для того, чтобы не допустить их полного захвата и прекращения французского государства."
 ###
 fra_pan_african_prospecting: "Панафриканская добыча ресурсов"
 fra_pan_african_prospecting_desc: "Наши африканские колонии продемонстрировали большой потенциал в своих месторождениях ресурсов, и мы должны направить огромные ресурсы на извлечение этих ресурсов и возвращение их на материк, где мы сможем эффективно их использовать."
 ###
 fra_provisional_africa: "Учредить GFPA"
 fra_provisional_africa_desc: "Французская оговорка Гувернемента en Algérie, или GFPA, является административным управляющим, который будет создан в Алжире и будет служить второй столицей для нашей страны, если мы потеряем материковую часть для наших врагов."
 ###
 fra_maintain_air_army: "Сохранять Аэронавтик-Милитарь"
 fra_maintain_air_army_desc: "Во время Великой войны Аэронаутика-Милитария была создана в качестве подразделения армии, и она была использована для того, чтобы оказать большое воздействие на немцев на Западном фронте. &quot; Аэронаутика-Милитер &quot; выросла на протяжении многих лет, и некоторые дивизии стали зависеть от их поддержки, так почему мы должны их разделять?"
 ###
 fra_create_air_army: "Создание Вооруженных сил Африки"
 fra_create_air_army_desc: "Наши военно-воздушные силы расширились и стали более зависимыми от армии в течение десятилетий после Великой войны."
 ###
 fra_paratroopers: "Продвижение вперед в исследовании парашютов"
 fra_paratroopers_desc: "Дезертиры - это новый прогресс в военной технологии, и обучение их эффективному использованию может позволить нам сесть за вражеские линии и дать нам возможность добраться до районов, которые наши военно-морские силы сочтут невозможными."
 ###
 fra_helicopters: "Экспериментальные вертолеты"
 fra_helicopters_desc: "Идея вертолёта находится в сознании великих инвертеров с эпохи Да Винчи. Только сейчас технологии развиваются до такой степени, что идея функциональных вертолётов становится реальностью. Разработка экспериментальных моделей позволит нам извлечь ценные уроки в области аэронавтики."
 ###
 fra_air_ground_radio: "Радиостанция воздух-земля"
 fra_air_ground_radio_desc: "Передача синхронизированных радиопередач нашим пилотам и офицерам позволит им быстро и эффективно общаться друг с другом во время боевых действий, что значительно расширит боевые возможности как для нашей армии, так и для самолетов."
 ###
 fra_colored_smoke: "Цветнокодированные дымовые гренады"
 fra_colored_smoke_desc: "Предоставление нашим солдатам различных разноцветных дымовых гранат позволит им определить различные зоны для наших самолетов, что даст им тактическое преимущество на поле боя."
 ###
 fra_coordinated_air_support: "Скоординированная авиационная поддержка"
 fra_coordinated_air_support_desc: "Гражданская война в Испании показала, что для достижения успеха на поле боя требуется более высокий уровень координации между наземными и военно-воздушными силами."
 ###
 fra_radar_tech: "РАДАР Улучшение положения"
 fra_radar_tech_desc: "РАДАР оказался чрезвычайно полезным для определения исхода собачьей борьбы еще до того, как она началась."
 ###
 fra_independant_air_command: "Зависящая команда истребителей"
 fra_independant_air_command_desc: "Обеспечение того, чтобы командование нашими истребителями было полностью неуступчивым, позволит им действовать на более гибкой основе, что, разумеется, повысит их эффективность и потенциал в бою."
 ###
 fra_flexible_tactics: "Поощрять гибкую тактику"
 fra_flexible_tactics_desc: "Неправдоподобный в бою - это ключ к тому, чтобы выгнать вашего оппонента, и мы должны обеспечить, чтобы все наши пилоты-истребители знали об этом и широко использовали его."
 ###
 fra_bomber_formations: "Формирование бомбардировщиков"
 fra_bomber_formations_desc: "Развертывание наших самолетов-бомбардировщиков на определенные группы позволит им уничтожать больше целей за меньшее время и использовать меньше взрывчатых веществ, мы должны идти по этому пути дальше, чтобы удержать нашу вражескую индустрию в плоском состоянии и их самолеты заземлены."
 ###
 fra_better_fighter_range: "Улучшить диапазон боя"
 fra_better_fighter_range_desc: "Наши бойцы выполняют важную роль по сопровождению наших бомбардировщиков, но до сих пор они могут путешествовать только на одном топливном баке, прежде чем им потребуется вернуться назад."
 ###
 fra_air_school: "Нашел Школу мира."
 fra_air_school_desc: "Это создаст новое поколение опытных пилотов, которое будет беспрецедентным в небе."
 ###
 fra_integrate_cadets: "Объединить воздушные кадеты"
 fra_integrate_cadets_desc: "Объединение Корпуса воздушных кадетов в полном объеме в наши военно-воздушные силы позволит им приобрести более непосредственный опыт и увидеть, как на самом деле действуют самодостаточные военно-воздушные силы."
 ###
 fra_integrated_air: "Полностью интегрированные военно-воздушные силы"
 fra_integrated_air_desc: "Наши реформы позволили нам полностью интегрировать военно-воздушные силы в армию, что значительно повысило эффективность наших сухопутных сил."
 ###
 fra_independant_air: "Полностью зависимые военно-воздушные силы"
 fra_independant_air_desc: "Наши реформы привели к тому, что наши военно-воздушные силы стали полностью зависимыми от армии, и теперь они подчиняются только нам и самим себе."
 ###
 fra_navy_start: "Реформирование национальной морской пехоты"
 fra_navy_start_desc: "Наш флот сильно устарел и устарел, и мы не можем управлять глобальной империей без сильного военно-морского флота в каждом море."
 ###
 fra_shadow_king: "В тени короля"
 fra_shadow_king_desc: "Королевский ВМС карликует морских национальных в каждой категории, и их положение как высшего военно-морского государства на планете кажется неоспоримым, и мы должны попытаться утвердить наше доминирование над морем, если мы хотим оставаться полностью зависимыми от британской сферы и поддерживать нашу европейскую гегемонию."
 ###
 fra_unified_fleet: "Единый флот"
 fra_unified_fleet_desc: "Объединение руководства в рамках группы офицеров военно-морского флота позволит повысить уровень координации и оперативной добросовестности."
 ###
 fra_expand_ports: "Расширить домашнюю верфь"
 fra_expand_ports_desc: "Докьярды нужны для строительства дополнительных кораблей, и мы никогда не сможем соперничать с британским военно-морским господством, если будем стеснять себя неуклюжими производственными возможностями доков."
 ###
 fra_revive_battleships: "Возобновить боевые корабли"
 fra_revive_battleships_desc: "После подписания Вашингтонского военно-морского договора многие из наших боевых кораблей были отменены, а также то бремя, которое они наложили на нашу экономику, и наконец пришло время возродить этих океанских чудовищ и утвердить наше военно-морское господство."
 ###
 fra_super_heavy: "Практически крупные суда"
 fra_super_heavy_desc: "Некоторые говорят, что есть логика в том, насколько большим может быть корабль до того, как он станет бесполезным."
 ###
 fra_mobile_airports: "Мобильные воздушные траектории"
 fra_mobile_airports_desc: "Перевозчики позволяют нам перевозить наши военно-воздушные силы по всему миру в районы, которые они, как правило, не могут охватить, что в значительной степени увеличит наше глобальное влияние."
 ###
 fra_carrier_experiments: "Экспериментальные конструкции перевозчиков"
 fra_carrier_experiments_desc: "Японцы, американцы и британцы используют совершенно разные дизайны для своих авианосцев; мы должны учиться на всех трех из этих дизайнов, чтобы создать идеальный носитель."
 ###
 fra_alone_weak: "Один мы слабы..."
 fra_alone_weak_desc: "Наш флот должен состоять из большого числа более мелких судов, с тем чтобы иметь возможность быстро добраться до всех районов мира и реагировать на кризисы, где бы они ни появились."
 ###
 fra_wolfpacks: "Волки"
 fra_wolfpacks_desc: "Небольшие, зависимые группы подводных лодок могут протягивать большие водоемы в поисках враждебных конвоев и уничтожать их еще до того, как они будут обнаружены."
 ###
 fra_undersea_armada: "Подводная армада"
 fra_undersea_armada_desc: "Армада, которая лежит под поверхностью океана, не может быть прикоснута к нашему врагу и сможет совершить удары по наземному флоту врагов."
 ###
 fra_destroyers: "Уничтожение инноваций"
 fra_destroyers_desc: "Уничтожители — это чрезвычайно зловещий корабль, который может выполнять множество задач, начиная от защиты конвоей и кончая заминированием и даже торговым запретом. Повышение качества и количества наших эсминцев даст нам преимущество перед нашими врагами."
 ###
 fra_quick_response: "Целевые группы быстрого реагирования"
 fra_quick_response_desc: "Повышение скорости наших небольших целевых групп позволит нам справиться с еще большим ущербом и самим уменьшить ущерб."
 ###
 fra_cruisers: "Инициатива Крузер"
 fra_cruisers_desc: "Крузеры составляют основу любого сильного флота, и мы были бы глупы игнорировать этот факт."
 ###
 fra_merchant_marine: "Расширить морской пехотинец"
 fra_merchant_marine_desc: "Конвои являются жизненной кровью нашей империи и позволяют нам перевозить товары по всему миру и поддерживать международную экономику."
 ###
 fra_our_shadow: "Избивать нашу собственную тень"
 fra_our_shadow_desc: "В то время как Морская нация, возможно, никогда не будет соответствовать престижу и глобальному охвату Королевского ВМС, мы увеличили его до такого размера, что теперь мы можем поставить свою собственную тень на остальной мир, и наш флот сейчас почти не оспаривается во всем мире."
 ###
 fra_global_navy: "Мировой ВМФ"
 fra_global_navy_desc: "Наш флот вырос быстротой и силой, и теперь он может достичь любого уголка земного шара в течение нескольких недель, в результате чего наше влияние во всем мире возросло, и наша империя никогда не была более безопасной."
 ###
 fra_air_navy_coop: "Сотрудничество военно-воздушных сил и военно-воздушных сил"
 fra_air_navy_coop_desc: "Поощрение сотрудничества между нашими военно-морскими и военно-воздушными силами позволит им действовать в тандеме и уничтожить любого врага, который осмеливается противостоять нашим объединенным военным силам."
 ###
 fra_coastal_air_def: "Прибрежная зенитно-воздушная оборона"
 fra_coastal_air_def_desc: "Если произойдут немыслимые события и враги возьмут под свой контроль нашу береговую линию, мы должны обеспечить, чтобы наши военно-воздушные силы знали, как их замедлить и помешать им получить больше земли, прежде чем наши сухопутные силы смогут занять позицию."
 ###
 fra_naval_bombers: "Бомбардировщики военно-морского флота"
 fra_naval_bombers_desc: "Закрытая авиация может нанести столько ущерба вражескому флоту, что нам нужно разработать новые самолеты, которые имеют единственной целью уничтожить корабли, если мы действительно хотим уничтожить врага, прежде чем они смогут отступить."
 ###
 fra_navy_air_cadets: "Экстренные эксцизии кадетов авиакомпании Воздушная авиация"
 fra_navy_air_cadets_desc: "Кадеты военно-воздушных сил и военно-морского флота практически полностью зависят друг от друга, и мы должны поощрять сотрудничество между этими двумя группами в целях развития сотрудничества и братства между ними."
 ###
 fra_continental_supremacy: "Создайте континентальную супремацию"
 fra_continental_supremacy_desc: "Наша победа во второй Великой войне доказала, что Франция по-прежнему более чем способна установить континентальную гегемонию над Европой."
 ###
 fra_italy_coop: "Сотрудничество с Италией"
 fra_italy_coop_desc: "Италия была твердым союзником Франции после победы Энтенти во время Великой войны, и мы должны попытаться вновь объединиться с ними и создать общую экономическую зону для дальнейшего укрепления обеих наших стран."
 ###
 fra_ally_poland: "Элли Польша"
 fra_ally_poland_desc: "Современная польская нация родилась во время краха Российской империи во время Великой войны."
 ###
 fra_work_with_zapadoslavia: "Работа с Западославией"
 fra_work_with_zapadoslavia_desc: "Западославия является очень сильной нацией в Центральной Европе, и мы должны стремиться к альянсу с ними, чтобы получить больший контроль над европейским континентом."
 ###
 fra_ally_blr_ukr: "Элли Беларусь и Украина"
 fra_ally_blr_ukr_desc: "Восточноевропейские нации Беларуси и Украины когда-то были частью российской империи, и Советский Союз хотел бы, чтобы они переинтегрировались в себя."
 ###
 fra_pressure_blr_ukr: "Давление в Беларуси и Украине"
 fra_pressure_blr_ukr_desc: "Восточноевропейские государства Беларуси и Украины когда-то были частью Российской империи, Советский Союз хотел бы, чтобы они были реинтегрированы в себя, мы должны поставить их под наше крыло и создать в обоих штатах протекторы, чтобы защитить их и остальную Европу от социализма."
 ###
 fra_global_hegemony: "Создать глобальную гегемонию"
 fra_global_hegemony_desc: "Британцы являются нашими давними соперниками и в настоящее время единственной нацией, способной помешать нам стать глобальным гегемоном."
 ###
 fra_ally_britain: "Ищите союз с британией"
 fra_ally_britain_desc: "Британцы являются нашими давними соперниками и были нашим краткосрочным союзником во время Великой войны."
 ###
 fra_end_socialism: "Покончим с социалистическим страхом"
 fra_end_socialism_desc: "Советский Союз является нашей последней большой угрозой и последним препятствием в установлении полного европейского господства."
 ###
 FRA_increased_british_trade: "Увеличение объема британской торговли"
 FRA_increased_british_trade_desc: ""
 ###
 FRA_french_advisors: "Французские военные советники"
 FRA_french_advisors_desc: "Эта страна была направлена военными советниками из Франции, чтобы лучше подготовить свои армии."
 ###
 fra_work_with_czechs: "Работа с чехами"
 fra_work_with_czechs_desc: "Чехия появилась после краха Западославии и продолжает оставаться сильной центральноевропейской державой."
 ###
 fra_work_with_slovakia: "Работа с Словакией"
 fra_work_with_slovakia_desc: "Словакия появилась после краха Западославии и, хотя чехи и не были менее полезными в создании сильного центральноевропейского государства, они все же были бы желанным союзником."
 ###
 fra_czech_submission: "Просьба о представлении Чехией"
 fra_czech_submission_desc: "Создание чешского кукольного государства значительно укрепило бы нашу власть в Центральной Европе."
 ###
 fra_slovakian_submission: "Спрос на представление Словакии"
 fra_slovakian_submission_desc: "Словакия появилась после краха Западославии и, хотя чехи и менее помогли в создании сильного центральноевропейского государства, было бы по-прежнему разумно создать словацкое кукловодское государство."
 ###
 fra_dominate_poland: "Доминирование в Польше"
 fra_dominate_poland_desc: "Современная польская нация родилась во время краха Российской империи во время Великой войны."
 ###
 fra_subjugate_italy: "Покорить Италию"
 fra_subjugate_italy_desc: "Несмотря на это, мы знаем, что полностью подчиненная Италия будет служить нашим амбициям континентальной гегемонии гораздо лучше, чем простой союз."
 ###
 fra_strong_petain: "Укрепление правительства Петена"
 fra_strong_petain_desc: "Кабинет Петена нестабилен и полон радикальных элементов, если военные хотят перевести государство из старой коррумпированной Республики, тогда мы должны обеспечить мощную силовую базу, с которой мы можем помешать нашим реформам."
 ###
 fra_triple_win: "Тройной победный альянс"
 fra_triple_win_desc: "Трехсторонний альянс либеральных и левых партий бурно пронзил французские выборы и радикально изменил политический ландшафт за очень короткое время. Идет радикальная реформа правительства, и только время покажет, что станет с нашей третьей республикой."
 ###
 fra_petain_constitution: "Конституция Петена"
 fra_petain_constitution_desc: "Старая конституция 1871 года является слишком археичной и запутанной для того, чтобы служить нашим потребностям в современном мире."
 ###
 fra_martial_law: "Военно-воздушное право"
 fra_martial_law_desc: "Военное право было нарушено по всей столичной Франции вскоре после того, как Петейн и его лояльные сторонники захватили правительство."
 ###
 fra_upheave_government: "Поднимите правительство."
 fra_upheave_government_desc: "Коррупция, удушающая третью республику, должна быть жестоко потрясена, чтобы мы не попали в олигархию."
 ###
 fra_qp_control: "Великое предательство"
 fra_qp_control_desc: "Кватрием Партии взял под свой контроль тройной альянс, который можно назвать лишь внутренним партийным переворотом, и они быстро подтвердили свою гегемонию перед французским правительством."
 ###
 fra_attack_commies: "Уничтожить марксистов"
 fra_attack_commies_desc: "Левые во Франции на протяжении последних нескольких лет были восходящими, но с военной и правительственной силой на нашей стороне мы теперь можем раздавить социалистическое влияние и обеспечить, чтобы наша нация никогда не была потрясена призраком коммунизма."
 ###
 fra_mil_propaganda: "Милитарист Пропаганда"
 fra_mil_propaganda_desc: "Армия является центральным звеном нашей страны, и мы должны быть уверены, что люди также знают об этом."
 ###
 fra_valkist_saar: "Разберись с валькистами Сарре"
 fra_valkist_saar_desc: "Департамент Сарре почти полностью однороден с германской культурой, и влияние режима Дресслера по Рейну привлекло идеи валькизма к региону."
 ###
 fra_education_reform: "Реформа системы образования"
 fra_education_reform_desc: "Преподавание следующему поколению французских солдат и офицеров важности сильного военного и сильного государства не позволяет обеспечить, чтобы наш режим выдержал испытание временем."
 ###
 fra_national_revolution: ":: Всё, что я знаю."Révolution nationale""
 fra_national_revolution_desc: "Культура Франции должна коренным образом измениться, если мы хотим противостоять военной мощи других государств, которые хотят покорить нас."Travail, Famille, Patrie"."
 ###
 fra_german_revolution: "Распространить революцию на Германию"
 fra_german_revolution_desc: "Немецкий народ слишком долго был подавлен режимом Дресслера, мы должны освободить его, если мы хотим сохранить свои традиционные ценности."
 ###
 fra_christ_dem: "Христианская демократия"
 fra_christ_dem_desc: "Третья республика упала, а новая временная республика заняла свое место. С упором ФСБ на французский национализм и христианскую демократию мы введем в новую эру политики не только во Франции, но и в Европе в целом."
 ###
 fra_corporatism: "Начать корпоратизм"
 fra_corporatism_desc: "Корпоратизм объединяет множество параллелей с синдикалистическим подходом и выступает за то, чтобы общество было организовано в конкретные корпорации, которые отделены от их рабочих мест. Конечная цель корпоративизма заключается в том, чтобы различные корпорации действовали гармонично как единое целое при максимальной эффективности, и хотя для достижения этой цели может потребоваться время, нет лучшего времени, чтобы начать, чем сейчас."
 ###
 fra_bridge_gap: "Преодоление идеологического разрыва"
 fra_bridge_gap_desc: "Французское право - это разрозненная и дезорганизованная группа, мы должны поместить тех, кто сидит слегка лево или справа от нас, и исключить тех, кто не желает сотрудничать с нами."
 ###
 fra_anti_german_propaganda: "Антинемецкая пропаганда"
 fra_anti_german_propaganda_desc: "Вторая Великая война выглядит все более вероятной как раз за пределами горизонта, мы должны обеспечить, чтобы народ Франции был готов всякий раз, когда придет этот день, чтобы взяться за оружие и защитить свою страну перед последним человеком."
 ###
 fra_ban_radicals: "Запрещение радикальных групп"
 fra_ban_radicals_desc: "Предыдущее консервативное правительство Франции очень боялось запретить группы под страхом того, что они могут просто передвигаться под землей и прибегать к насилию для распространения своего послания. Однако при новом режиме мы не боимся такой деятельности. Если эти группы продолжат радикализацию подземного пространства, как крысы, мы затопим канализацию и заставим их наверх, где мы можем их застрелить!"
 ###
 fra_milice: "Формировать французскую милицию"
 fra_milice_desc: "Как мы и ожидали, радикальные группы, которые мы запретили, ушли в подполье, чтобы продолжать свои операции в тайне, и у нас нет другого выбора, кроме как сформировать французскую милицу, полувоенную организацию, возглавляемую Джозефом Дарнандом, одним из самых откровенных членов правительства против этих групп."
 ###
 fra_compromise: "Соглашайтесь с радикалами"
 fra_compromise_desc: "Радикальные группы, которых мы подтолкнули под землю, не продемонстрировали никаких признаков того, что мы должны расплатиться за так называемую несправедливость по отношению к ним, и, возможно, предоставление им небольших дипломатических уступок позволит нам возобновить обычные повседневные операции, не беспокоясь о бомбардировках автомобилей или стрельбах на улицах."
 ##
 ORL_illegitimate_government: "Несоблюдение Францией"

 #### EVENTS ####

 fra.1.t: "Третья Республика"
 fra.1.d: "Вторая Французская империя закончилась в 1871 году с поражением во франко-прусской войне, и третья Республика быстро заняла свое место. Французское поражение во франко-прусской войне оставило их горькими и зловещими по отношению к немцам, и это чувство продлится еще 40 лет, прежде чем им позволили отомстить на полях Великой войны. С окончанием самого разрушительного в мире конфликта в 1919 году французы быстро навязали немецкому народу жесткие требования. Полная ответственность за ущерб, причиненный войной и кажущейся непреодолимой серией платежей в долг разрушила экономику Германии и помогла Франции вернуть себе гегемонистический статус в Европе. Это экономическое бремя, которое легло на Германию, а также на Союзную оккупацию Рухрской и Рейнленда, вынудило Германию дефолтовать по своим долгам, и нация стала банкротом. Когда немецкий реперация прекратила приходить в страну, французская страна была вынуждена вторгнуться в Рейнленд и создала совместную комиссию по управлению регионом. Наряду с этим вторжением в Рейнленд, Саарленд был непосредственно оккупирован во время французской оккупации, а народный народный народный сектор продолжал свою деятельность по отношению к англополистскую политику, по отношению к англополистской нации, по отношению к экономике, по-нанк 19 декабря 1993 года."
 fra.1.a: "Виви-ля-Франс!"
 ###
 fra.2.t: "Национальный бюджет - первоначальный доклад"
 fra.2.d: "Специальный совет по расследованию представил премьер-министру [Root.Get Header] свой первоначальный доклад о пропавших средствах. К сожалению, они не смогли найти источник этого дефицита и пришли к выводу, что именно министерство внутренних дел и министерство по колониальным вопросам больше всего страдают от нехватки средств. nn SIC запросила разрешение на проведение расследования как вооруженных сил, так и промышленных кругов, с тем чтобы выяснить, существует ли, возможно, крупномасштабная операция по растрате средств, которая остается незамеченной на протяжении нескольких лет."
 fra.2.a: "Это требует дальнейшего расследования!"
 ###
 fra.3.t: "Национальный бюджет 1936 года"
 fra.3.d: "В годовой бюджетный доклад были включены данные о том, какие средства правительство может выделить различным министерствам и государственным службам. Третий год подряд мы получили несколько миллионов франков, что не соответствует нашим прогнозируемым расходам, и никто не смог определить, куда идут эти потерянные средства. Этот вопрос вызвал обеспокоенность в связи с распространением и распространением коррупции в правительстве, которое осталось незамеченным на протяжении большей части 1930-х годов, и многие настоятельно призывают создать специальный совет по расследованию, с тем чтобы найти источник этих недостающих средств."
 fra.3.a: "Мы должны докопаться до сути этого дерьма!"
 ###
 fra.4.t: "Национальный бюджет - расследование деятельности армии"
 fra.4.d: "После длительного расследования и обсуждения ЦУР вернулся к нам и пришел к выводу о том, что несколько высокопоставленных офицеров армии и военно-морского флота занимаются хищением средств, полученных в результате мирового экономического бума, и хранением их на офшорных счетах по всей Европе и Америке."
 fra.4.a: "И ответ приближается..."
 ###
 fra.5.t: "Национальный бюджет - расследование деятельности капиталистов"
 fra.5.d: "Многие расстроены тем, что это расследование вообще было проведено, и многие капиталисты были обижены на тщательное расследование; в наших интересах, возможно, предоставить им гарантии, чтобы успокоить их."
 fra.5.a: "Должно быть, мы уже близко..."
 ###
 fra.6.t: "Национальный бюджет - расследование деятельности правительства"
 fra.6.d: "После длительного периода отсутствия КЦБ вернулась в правительство с горой папок и файлов. Похоже, что средства, недостающие из национального бюджета, скачивались на личные счета северальных членов правительства, использующих офшорные счета в Швейцарии. Это открытие потрясло «Блок нэшнл» до самого ядра, и все больше и больше членов партии обвинялись в безудержной коррупции с каждым днем. Правительство находится в хаосе, и национальная жандармерия была призвана восстановить порядок в парламенте и не допустить того, чтобы здание стало бунтом. Эти сообщения вскоре выльются в общественность, и нас, несомненно, поразит волна критики со стороны народа."
 fra.6.a: "Есть только одна вещь, которую мы можем сделать... организовать суд!"
 ###
 fra.7.t: "Испытание 11 - го результата"
 fra.7.d: "После нескольких дней обсуждений присяжные вновь предстали перед Большим жюри с их завершением, присяжные признали всех 11 членов правительства виновными, среди прочего, в растрате. Все мужчины были немедленно отстранены от своих правительственных постов, но пятно их наследия все еще остается у коалиции. Предстоящие выборы в марте будут теми, кто решит судьбу Франции на следующее десятилетие, единственное, что осталось решить, будет ли Блок Нэшнл участвовать или разделится на свои конституционные партии..."
 fra.7.a: ""Блок нэшнл" выживет."
 fra.7.b: "Этот скандал доказал слишком много, распустил "Блок Нэшнл"."
 ###
 fra.8.t: "Выборы окончены."
 fra.8.d: "После напряженных пару дней все бюллетени были сведены воедино, и победитель выборов вскоре будет объявлен."
 fra.8.a: ""Блок Нэшнл" выигрывает!"
 fra.8.b: "СФИО побеждает!"
 fra.8.c: "Радикально-социалисты побеждают!"
 fra.8.e: "Демократический республиканский альянс побеждает!"
 fra.8.f: "Тройный Альянс побеждает!"
 fra.8.g: "Сюрприз, военный переворот, Париж!"
 ###
 fra.9.t: "Принадлежности и материалы из Туниса"
 fra.9.d: "Прошло несколько месяцев с тех пор, как наши проекты в Тунисе попытались модернизировать регион и сделать его прибыльным."
 fra.9.a: "И наконец, наши инвестиции окупаются."
 ###
 fra.10.t: "Выбор современной доктрины"
 fra.10.d: "После того как мы отказались от оборонительной доктрины, мы были вынуждены выбрать новое направление для наших военных, и у нас есть три столь же жизнеспособных варианта, но выбор правильной доктрины мог бы означать разницу между успехом и поражением в предстоящих войнах."
 fra.10.a: "Мобильная война позволит нам проникнуть через вражеские линии"
 fra.10.b: "Великая огневая мощь позволит нам сломать врага."
 fra.10.c: "Большой план битвы позволит нам проводить международные операции"
 ###
 fra.11.t: "Реструктуризация на национальном уровне"
 fra.11.d: "Военное правительство Франции подготовило ряд документов, которые позволят реорганизовать и реорганизовать правительство из гнилой и коррумпированной демократии в унитарное однопартийное государство, возглавляемое центральной фигурой. Эти документы будут представлены как парламенту, так и общественности через несколько дней, и они будут официально ратифицированы вскоре после этого. ~Эти радикальные изменения во французской политике, несомненно, приведут к нестабильности в течение короткого периода времени, но многие оптимистичны к быстрому восстановлению и возвращению к политическому господству в Европе. ~nnnnworld glows to the me, и международная реакция будет девственна в обеспечении легитимности нового государства."
 fra.11.a: "Так и есть."
 ###
 fra.12.t: "Смерть третьей Республики"
 fra.12.d: "Новая французская конституция была, наконец, ратифицирована сегодня, и третья Республика, которая руководила французским народом в ходе Первой Великой войны, наконец, достигла своей конечной судьбы. В период с 1870 года по [Гетг] третья Республика была одной из самых продолжительных французских правительств, но, как представляется, она просто не выдержала политических волнений XX века, став на колени в 1919 году и не смогла восстановиться до того, как политический и экономический скандал вместе с разрушительными последствиями черной среды наконец разрушили республиканские институты. Новая Франция практически неизвестна предыдущей администрацией как унитарное однопартийное государство с недемократически избранным лидером. Надежда состоит в том, что новое правительство национального единства сможет выдержать напряжение нового современного мира и защитить Францию от возрождающейся немецкой собаки на Восток."
 fra.12.a: "Это к лучшему."
 ###
 fra.13.t: "Лидер французского народа"
 fra.13.d: "Филипп Петен уже несколько месяцев является лидером временного французского правительства, и такие радикальные группы, как Французская организация действий, Французская социальная партия и Французская партия, медленно проникают на правительственные позиции по рекомендации членов правящего военного правительства. Многие генералы открыто требуют от себя отставки Петайна и избрания нового кандидата на пост главы французского правительства."
 fra.13.a: "Филипп Петен сохраняет свою позицию."
 fra.13.b: "Жорж Валуа берет на себя контроль над правительством"
 fra.13.c: "Франсуа де Ла Рокке избран лидером"
 ###
 fra.14.t: "Коронатура Жана III"
 fra.14.d: "С учетом всей страны на нашей стороне, а наши враги не могут двигаться против нас, принц Жан из дома Орлеанцев принял наше приглашение забрать французский тон, который был свободен на протяжении последних 56 лет. Мы ожидаем огромной толпы в Париже, и безопасность должна быть самой высокой, чтобы наш король не был убит при его собственной коронации."
 fra.14.a: "Виви-ля-ля-ля-ля!"
 ###
 fra.15.t: "Работники в забастовке в Пуату!"
 fra.15.d: "Несмотря на нашу отмену законности забастовок во Франции, группа работников в Ла-Рошель перестала появляться на работе и потребовала ужесточения правил безопасности и повышения заработной платы."
 fra.15.a: "Мы должны удовлетворить их требования."
 fra.15.b: "Прикажи армии въехать и разогнать забастовщиков."
 ###
 fra.16.t: "Марсель Пагнол выпускает"César""
 fra.16.d: "Замаскированный драматург и кинорежиссёр Марсель Пагнол выпустил третий фильм в своём фильме."Marseille" trilogy, entitled "César". The first movie in the trilogy to not be adapted from a screenplay and instead based solely on a film script, though many believe that in the future the movie will be re-adaped to fit in with the other two plays on-stage. \n\nThe film is hailed as being a staple of cosmopolitan French culture, and has quickly peaked the charts for the year of 1936. The main points of criticism towards the film are its long run-time, and less-than-exciting storyline for the climax of a trilogy of films and plays. \n\nStill, Pagnol continues to be regarded as a genius not only of film, but other mediums such as poetry and drama. He is seen as one of the embodiments of French contemporary French culture, and his fans wait endlessly for his mind to produce yet another great story."
 fra.16.a: "Надеюсь, он сделает это обо мне!"
 ###
 fra.17.t: "Мануверс вдоль Пас-де-Кале"
 fra.17.d: "С тех пор, как Великая война закончилась в 1919 году, французские военные изучали все решения, принятые в ходе войны, и играли в военные игры, чтобы увидеть, что они могли бы сделать лучше. Несколько диффентных школ, предвещающих мысли, взяли верх, и аргументы почти стали жестокими до того, как начальник армии вмешался для посредничества в ситуации. ~Нет, за чем последовала серия боевых игр в районе Пас-де-Кале во Франции, с одной стороной, представляющей Германию, а с другой, представляющей Францию. Офицеры обнаружили, что с использованием обычной тактики обе армии были вынуждены воевать в состоянии тренировки в течение недель после начала смоделированной войны."Guerre éclair" tactic showed many signs of success, involving a lightly armoured spearhead which would punch through the enemy lines before spreading out like a funnel, allowing allied soldiers to capture huge swaths of enemy troops and hostile land. Combined with an air offensive, it was believed that this new "Lightning War" could potentially turn the tide in France's favour during the next major continential war. \n\nIt was not soon after, however, that several officers found major faults with the plan. Fuel and supply shortages were rampant with this doctrine, and the risk of being cutoff from the main army was extremely high if the enemy force were able to break through the spearhead. It was for these reasons that the plan was essentially scrapped by the end of the wargames. \n\nWe may not have found our magical new doctrine, but the army has certainly learned a thing or two about fighting a modern, defensive war."
 fra.17.a: "Герр Эклер, это что-то на немецком?"
 ###
 fra.18.t: "Тур де Франс 1936 года"
 fra.18.d: "Тридцатое издание Тур де Франс завершилось сегодня, когда гонщики пересекли финишную черту и закончили ежегодную традицию. В верховное время было взволновано 142 часа и было достигнуто бельгийским гонщиком Сильвером Маесом. Этот Тур де Франс отличался от прошлых рас, поскольку он был разбит на три сеператевые части, и три верхних на каждой стадии были готовы увеличить свое время в зависимости от того, какое положение они занимали в конце каждой отдельной секции. ~nnnHenri Desgrange утверждал, что он сам ведет гонку, несмотря на то, что он перенес операцию по по почкам всего за несколько недель до начала гонки. ~ Несмотря на то, что он был преисполнен решимости следовать за гонкой в автомобиле с полными подушками, в результате чего он получил место, где он проезжал по городу полный зрителей. После второй стадии, Дегнанг остановился и передал контроль за гонкой Жаку Годде на последнюю треть расы. ~ ~ Нем он был очень радушен своему Антону Магне во время гонки, и ему удалось достичь достойного второго места, почти второго места, почти за полчаса, почти полчаса после Сайл Масера Мэза."
 fra.18.a: "Как захватывающе, я не могу дождаться следующего года!"
 ###
 fra.19.t: "Минералы ударили по Нормандии!"
 fra.19.d: "Группа шахтеров, работающая по всему городу Руэн, заказала ограниченную забастовку, отказываясь от работы и закрывая промышленность по всему региону. Местная полиция была направлена для восстановления порядка и возвращения шахтеров к работе, но эта забастовка рассматривается многими как пример ослабления власти нашего правительства. К сожалению, мы не многое можем сделать для исправления ситуации, поскольку местное правительство, как представляется, не имеет намерения оттолкнуть забастовку, и правительство поручило нам действовать осторожно, чтобы забастовка не распространилась на другие провинции."
 fra.19.a: "Что значит, мы не можем просто пристрелить их, пока они снова не начнут работать?"
 ###
 fra.20.t: "Смерть Луиса Блериота"
 fra.20.d: "Известный французский авиаагент, инженер и изобретатель Луи Блериот скончался вчера в своем доме, после того как, согласно сообщениям, он перенес сердечный приступ. Луи был изобретателем первых практических фар для автомобилей и создал прибыльный бизнес-манулятор и продавал их в массовом порядке. Луи использовал большую часть денег, которые он зарабатывал из своей промышленности фар, чтобы возглавить создание новых самолетов и систем для них, и он получил награду за создание первой комбинации педалей с джойстиком и педалями, управляемыми ногами, в начале 1908 года. Ннн многие в авиационной и автомобильной промышленности глубоко опечалены кончиной Луи Блериота, и его похороны, по оценкам, посещаются более тысячи богатых бизнесменов и его ближайших сообщников."
 fra.20.a: "Ужасная потеря для всех нас."
 ###
 fra.21.t: "Смерть Джульетты Адам"
 fra.21.d: "Французская писательница и феминистка Джульетта Адам скончались вчера в Южном Париже, когда она умерла, она, как сообщается, была как с друзьями, так и с семьей. Но Джульетта Адам была знаменита несколькими комплиментами, не в последнюю очередь своими подробными рассказами о своем детстве и раздорах между родителями, о которых она очень хорошо помнила. Её также запомнили за несколько рассказов об иностранной политике в течение своей жизни, и она сделала несколько развратных работ, критикующих Бисмарка и его политику немецкого реваншизма и объединения."
 fra.21.a: "Действительно образцовый гражданин до конца."
 ###
 fra.22.t: "Военный переворот!"
 fra.22.d: "Вчера рано утром большое подразделение французских солдат, защищающих окраины Парижа, внезапно обернулось и штурмовало здание парламента, а также несколько других важных правительственных офисов! Военные объявили хунту вместо демократического правительства в отчаянной попытке спасти военную ситуацию и остановить германское вторжение. Неизвестно, каковы истинные намерения этого военного правительства, и многие считают, что на самом деле это было спланировано крайне правой французской организацией. Несмотря на то, что новое военное правительство направило все страны на фронт, и пока ситуация, похоже, стабильна."
 fra.22.a: "Когда этот хаос закончится?"
 ###
 fra.23.t: "И кончай с хунтой."
 fra.23.d: "Война закончилась, и мы чудом вышли на вершину нашего немецкого противника. С окончанием войны вопрос о правящей военной хунте был одним из в мыслях многих французов, которые пережили войну под своим военным руководством. Это общее недовольство, вместе с армейскими элементами, лояльными Республике, вернувшейся домой массово, убедило военную хунту уйти и позволить демократическому правительству взять контроль. Несмотря на войну, многие граждане Франции обратились к социалистическим идеалам в надежде на более светлое будущее после войны, и поскольку многие из них призывают к созданию СФИО для восстановления нашей разрушенной нации правительства. Тем не менее как либеральные, так и консервативные люди остаются популярными в сознании граждан, и восстановление традиционного правительства может быть тем, что нам нужно для того, чтобы привести к новой эре процветания."
 fra.23.a: "СФИО формирует правительство"
 fra.23.b: "Радикально-социалисты создадут правительство."
 fra.23.c: "Демократический республиканский альянс формирует правительство"
 ###
 fra.24.t: ""The Future of our Republic""
 fra.24.d: "В последние дни мы стали свидетелями полного краха наших линий фронта, когда немецкие силы бьют по нашим оборонам со скоростью молнии и с жестокой эффективностью. Многие объявили, что это последние дни Третьей Республики, и надежда мимолетна. Несмотря на то, что Чарлз де Голл, недавно получивший назначение бригадного генерала за его галантные действия на ранних этапах немецкого вторжения, приблизился к неустойчивому правительству с самым радикальным планом. На протяжении последней недели он отчаянно разрабатывал планы полной эвакуации наших военных и политических сил по Средиземному морю в наши владения в Алжире, чтобы мы могли продолжать борьбу там. Мало что нужно говорить о амбициозности этого плана и просто идея о нем вызвала большие разногласия в нашем и без того ослабленном правительстве. [РООТ. Гейтер] был вынужден решить, принять или не принять планы Де Голля, и не важно, что многие французы погибнут и что поддержка его партии будет потеряна. Генерал Де Голле неоднократно подчеркивал, что это решение о том, что мы, вероятно, победуем над германскими планами, является единственным решением о том, чтобы победить нас."
 fra.24.a: "Мы должны продолжать борьбу, независимо от того, как далеко мы должны бежать..."
 fra.24.b: "Чепуха, они у нас на задней ноге!"
 ###
 fra.25.t: "Коррупция в армии"
 fra.25.d: "КБР выявила слоё коррупции и виллианства в нашем командном корпусе, и многие наши высокопоставленные офицеры, похоже, поддерживают связи с лигой действий Франсиса. Мы не можем допустить такой гнили в нашей армии, и поэтому мы должны начать серию публичных судебных процессов и запретить им участие в военной и политической жизни. Это будет долгий и трудный процесс, и в результате этого наша армия пострадает. Однако после того, как эти процессы закончатся нашей армией, мы будем гораздо более организованны и включим в себя более современных генералов с новыми и амбициозными идеями."
 fra.25.a: "Будем надеяться, что немцы будут отвлекаться."
 ###
 fra.26.t: "Судебный процесс над генералами - первый этап"
 fra.26.d: "По мере завершения армейского расследования и судебных процессов несколько генералов были признаны виновными в различных уровнях коррупции и индивидуального скандала."
 fra.26.a: "Это нанесет серьезный ущерб нашим военным..."
 ###
 fra.27.t: "Судебный процесс над генералами - второй этап"
 fra.27.d: "Началась вторая стадия военного процесса, и уже несколько высокопоставленных военнослужащих были признаны виновными в коррупции, взяточничестве и совершении других преступлений против государства. Число ни в чем не повинных генералов в нашей армии быстро сокращается, и наши военные начинают разваливаться по швам."
 fra.27.a: "Будем надеяться, что это не продлится долго."
 ###
 fra.28.t: "Судебный процесс над генералами - заключительный этап"
 fra.28.d: "Гнилая вонь коррупции и ограбления смогла проникнуть в самую верхушку нашей армии, как кажется, когда военно-морские, армейские и воздушные офицеры были вынуждены уйти в отставку с ошеломляющей скоростью, наши военные были полностью сбиты с толку этим расследованием, и мы можем только надеяться на быстрое выздоровление."
 fra.28.a: "Наверняка хуже не бывает..."
 ###
 fra.29.t: "Талантливые военные мысли"
 fra.29.d: "Военные колледжи по всей Франции с большим эффектом изгоняют молодых и шпионских офицеров. Ущерб, нанесенный нашим военным в результате неоднократных судебных процессов, начинает ослабевать, и через пару месяцев наша армия станет более способной, чем когда-либо."
 fra.29.a: "Замечательные новости, чтобы быть уверенным!"
 ###
 fra.30.t: "Талантливые военные мысли"
 fra.30.d: "Военные колледжи по всей Франции с большим эффектом изгоняют молодых и шпионских офицеров. Ущерб, нанесенный нашим военным в результате неоднократных судебных процессов, начинает ослабевать, и через пару месяцев наша армия станет более способной, чем когда-либо."
 fra.30.a: "Замечательные новости, чтобы быть уверенным!"
 ###
 fra.31.t: "Талантливые военные мысли"
 fra.31.d: "Военные колледжи по всей Франции изгоняют молодых и спецназовских офицеров с большим эффектом. Ущерб, нанесенный нашим военным в результате неоднократных судебных процессов, исчезает, и через пару месяцев наша армия станет более способной, чем когда-либо."
 fra.31.a: "Замечательные новости, чтобы быть уверенным!"
 ###
 fra.32.t: "Талантливые военные мысли"
 fra.32.d: "Военные колледжи по всей Франции изгоняют молодых и спецназовских офицеров с большим эффектом. Ущерб, нанесенный нашим военным в результате неоднократных судебных процессов, почти полностью измотан, и через пару недель наша армия будет более способной, чем когда-либо."
 fra.32.a: "Замечательные новости, чтобы быть уверенным!"
 ###
 fra.33.t: "Семена революции"
 fra.33.d: "Похоже, что ситуация развивается в южной части Франции, большая группа промышленных работников была замечена в том, что в течение большей части утреннего спортзала в Тулузе шел красный флаг, прежде чем идти по сельской местности, их число растет вместе с каждым городом, через который они проходят. Местная полиция пыталась остановить толпу и заставить ее распуститься, но все усилия оказались неэффективными. Правительство не желает направлять войска из-за кризиса, развивающегося на военной и политической сцене в целом, и любое прямое военное вмешательство может поднять как левые, так и правые политические крайности в нашей стране."Workers March" is gathering steam at an ever-growing rate, and while they are keeping to themselves in the South of France for now, there's no telling if or when they will change course and head straight for Paris."
 fra.33.a: "Возможно, это то, за чем мы должны присматривать."
 fra.33.b: "Нам не нужно беспокоиться о нескольких недовольных шахтерах."
 ###
 fra.34.t: "Марш трудящихся достигает Бордо"
 fra.34.d: "Вчера мы получили телеграмму от местной полиции города Бордо, в которой излагались масштабы марша трудящихся и их присутствие в городе. Произошли аппетитные массовые демонстрации, призывающие к упразднению правительства и началу новых выборов. Несмотря на то, что большинство, как представляется, имеет относительно демократические требования, некоторые группы требуют полной отмены нашего республиканского правительства и установления коммунистического режима, аналогичного режиму Советского Союза. Эти люди, хотя и небольшие по численности, быстро набирают обороты в рамках и без того разгневанной толпы граждан."
 fra.34.a: "Для нас всё не очень хорошо."
 ###
 fra.35.t: "&quot; Марш трудящихся &quot; достигает Пуату"
 fra.35.d: "Согласно сообщениям из города Пуату, в Пуату въехала группа рабочих, а местная полиция оказалась не в состоянии контролировать гигантскую толпу, которая влилась в этот город. Движение в очередной раз возросло в связи с притоком недовольных граждан внутри города, вступивших в свои ряды. Несколько французских генералов разработали планы по решительному роспуску этого марша, используя несколько наших опытных подразделений, находящихся в настоящее время в Африке, однако эта идея была полностью заблокирована из-за нежелания правительства стрелять в своих собственных граждан и, возможно, провоцировать еще одну революцию в стране. Несмотря на то, что &quot; Марш рабочих &quot; , двигаясь в основном по северному направлению, многие политические наблюдатели считают, что они разрушатся при встрече с рекой Луар и мостами с низкой пропускной способностью."
 fra.35.a: "Когда они остановятся?"
 ###
 fra.36.t: "Марш трудящихся пересекает Луар."
 fra.36.d: "Вопреки нашим надеждам и убеждениям многих из наших советников, Марш трудящихся не столкнулся с проблемой пересечения реки Луар и теперь он идет еще дальше по многим малым городам и сельским районам. По оценкам, количество толпы там где-то от 600 до 900 человек постоянно растет. Несколько разведочных участков с тех пор, как они прошли через реку Ла-Рошель, и четко определенная группа, похоже, возглавляет весь марш, большинство из которых носят красную одежду и носят красные флаги. По всей видимости, с течением времени марш становится все более и более социалистическим по своему характеру, и многие его участники присоединяются к пению песни."La Internationale" on a daily basis. \n\nThe leadership of our government has become quite frightened, and several divisions have been placed both in and around Paris as a preventitive measure in case the March does reach the city, but many citizens are doubtful that they will be able to stop this march if it continues for much longer."
 fra.36.a: "Всё становится опасным!"
 ###
 fra.37.t: "Марш трудящихся доходит до Нормандии"
 fra.37.d: "В удивительном случае, Марш рабочих продолжил движение на север после того, как он достиг Ле-Манса, а не повернулся на восток в сторону Парижа. Похоже, что они направляются в Кейн, чтобы еще больше увеличить число своих людей, и их действия поставили весь Париж на край. Надвигается чувство страха, висящее над городом, и многие с нетерпением ждут того дня, когда облако пыли появится на горизонте и наконец достигнет окраины города. Грубые баррикады, которые армия возвела на улицах, принесут воспоминания о Парижском коммуне."
 fra.37.a: "Они будут в Париже в любой день!"
 ###
 fra.38.t: "Марш трудящихся доходит до Парижа"
 fra.38.d: "Похоже, наши худшие опасения наконец-то оправдались, "Марш рабочих" добрался до Парижа в полную силу и начал свое движение в центр города. Вспышки, находящиеся в сельской местности за пределами города, были быстро захвачены населением, вооружённым как огнестрельным оружием, так и стрелковым оружием, с несколькими постами, даже сменяющими стороны и присоединяющимися к марше. Восточная часть Парижа относительно нетронута маршем из-за того, что река Сена разделила город в два раза, но "Арка де Триомфе" уже была захвачена, а над монументом пришёл красный знаменатель. "Плать Бурбон" находится в пределах дистанции от ныне разрушительной армии, и многие боятся, что второй Парижский коммун может вскоре стать реальностью, и французские военные находят, что труднее и труднее держать мятежников в стороне, не прибегая к насилию.""
 fra.38.a: "У нас не было выбора..."
 ###
 fra.39.t: "Последствия кровавого понедельника"
 fra.39.d: "Вонь пороха застряла в воздухе, дым по-прежнему пахнет руинами за пределами города, а кровь все еще пятнает дороги, ведущие к Эйфелевой башне."Bloody Monday" the people of Paris are calling it, and rarely has there ever been a more apt name for an event in history. A heavy silence has lingered over the city this past week, and many are waiting to see what the now murderous government will do in response to this tragedy. The fallen citizens of Paris have become Martyrs for both the extreme left and right, claiming that our government is no longer fit to rule the people nor the state over which it presides. There are talks of a second, organized Workers March in Marseille, and several high-ranking generals"
 fra.39.a: "Что это значит для нашей Республики?"
 ###
 fra.40.t: "Подъём PSOP"
 fra.40.d: "Марсо Пиверт, изгнанный левый член СФИО, основал новую партию вдоль Либертарианских и Марксистских линий, известных как"Workers and Peasants' Socialist Party". This party has little support outside of its already fringe movement, and they have found little support from either the SFIO or the PCF, and some believe the party itself may soon splinter and see its members scatter. Still, the PSOP has become a member of the International Revolutionary Marxist Centre, and have been appealing to disenfranchized and disillisioned members of both the SFIO and PCF, and the possibility remains that they may soon gain traction as a popular midddle-ground party for the socialist movement in France."
 fra.40.a: "Это нас не касается."
 ###
 fra.41.t: "Франция предлагает гарантировать независимость Австрии."
 fra.41.d: "Наши французские союзники внимательно следят за Германией и ее экспансионистским отношением, они обратились к нам с просьбой официально и в одностороннем порядке заявить о нашей поддержке в пользу Австрии, если немцы придут в Вену. Эта дипломатическая гарантия может быть тем, что нам нужно для того, чтобы обуздать агрессивное новое правительство Германии, хотя мы можем оказаться в неудачной войне с немецкой военной машиной второй раз за 40 лет."
 fra.41.a: "Мы будем рядом с австрийцами."
 fra.41.b: "Австрийцы сами по себе."
 ###
 fra.42.t: ""Удерживайся от нашей независимости"!"
 fra.42.d: "Как Франция, так и Италия заявили о своей полной поддержке нашей независимости от немецкого правления."
 fra.42.a: "Габсбургы могут исчезнуть, но наш дипломатический талант - нет!"
 ###
 fra.43.t: "Италия отказывается от нашего предложения!"
 fra.43.d: "Итальянское правительство решило, что оно не присоединится к нам, чтобы гарантировать независимость Австрии, а затем нанесло нам удары в спину дипломатическим путем. Отношения между нами и итальянцами стали напряженными, и некоторые беспокоятся о том, что это может еще раз расколоть Энтези на две части. Австрийцы стали нервничать от этой дипломатической ссоры и просят, чтобы мы были единственными защитниками их независимости."
 fra.43.a: "Хорошо, я сделаю это сам."
 fra.43.b: "Австрийцы все равно малолюдны."
 ###
 fra.44.t: "Швейцарский вопрос"
 fra.44.d: "Французы официально обратились к нам с интересным предложением: они предлагают урегулировать поистине критический территориальный спор между Швейцарией и нашими двумя нациями; значительное итальянское и французское население живет на юге и западе Швейцарии, соответственно, и спасение этих итальянцев от жестокого и диктаторского швейцарского правительства должно быть нашим главным приоритетом."
 fra.44.a: "Мы согласны с французскими терминами"
 fra.44.b: "Война со швейцарцами в настоящее время не очень хороша."
 ###
 fra.45.t: "Итальянцы согласны."
 fra.45.d: "Итальянское правительство выразило свою заинтересованность в аннексии части населения Италии после того, как мы аннексируем регион Романди."
 fra.45.a: "Замечательные новости"
 ###
 fra.46.t: "Итальянцы упадут"
 fra.46.d: "Итальянское правительство заявило о своем желании не вступать в конфликт со швейцарцами во имя спасения своего обособленного населения, очевидно, что итальянцы не заботятся о своем собственном народе и как таковые оставили нас в качестве защитников швейцарских итальянцев."
 fra.46.a: "Хорошо, больше земли для нас."
 ###
 fra.47.t: "Франция и Италия требуют нашей территории!"
 fra.47.d: "Сегодня в нашу столицу прибыла совместная телеграмма из Парижа и Рима, и, как представляется, она содержит самые печальные новости: радикальные французские и итальянские правительства, захватившие власть не так давно, решили, что в их интересах охотиться на своих маленьких соседей. Французы потребовали, чтобы регион Романди, часть Швейцарии, населенная главным образом франкоговорящими швейцарскими гражданами. Итальянцы, с другой стороны, потребовали, чтобы район Тессин, большая пограничная полоса, в которой большая часть населения говорит на итальянском диалекте."
 fra.47.a: "Увы, мы бессильны."
 fra.47.b: "Мы - нация гор, мы так легко не отступим!"
 ###
 fra.48.t: "Франция требует нашей территории!"
 fra.48.d: "Телеграмма из Парижа прибыла сегодня в нашу столицу, и, как представляется, она содержит самые печальные новости. Радикальное французское правительство, взявшее власть не так давно, решило, что в их интересах охотиться на своих маленьких соседей. Французы потребовали, чтобы регион Романди, часть Швейцарии, в которой в основном проживают франкоговорящие швейцарские граждане. Эти требования явно нарушают нашу территориальную целостность, и наше население готово бороться любой ценой. Однако наилучшим вариантом может быть смягчение последствий этих действий."
 fra.48.a: "Увы, мы бессильны."
 fra.48.b: "Мы - нация гор, мы так легко не отступим!"
 ###
 fra.49.t: "Швейцарцы сдались"
 fra.49.d: "Хорошие новости из Берна, швейцарское правительство решило сдать район Романди нам мирно и без боя, швейцарские военные эвакуированы из этого района, и наши дивизии пересекают границу, чтобы быстро восстановить порядок для запутавшихся граждан."
 fra.49.a: "С каждым днем мы становимся все более могущественными."
 ###
 fra.50.t: "Швейцарский стойкий дефаент"
 fra.50.d: "К сожалению, швейцарское правительство, как представляется, не смогло осознать всю серьезность этой ситуации, они не повиновались нашим требованиям и вместо этого решили противостоять нашей военной и политической мощи. Наши офицеры готовы к войне, и наши люди хотят вновь обрести славу на поле боя. Есть опасения, что изнурённая швейцарская местность может свалиться на наши войска и ввергнуть нас в еще один затяжной конфликт, который немногие готовы рассмотреть."
 fra.50.a: "На войну!"
 fra.50.b: "На войну!"
 fra.50.c: "Мы не можем позволить себе такую дорогостоящую войну."
 ###
 fra.51.t: "Швейцарцы сдались"
 fra.51.d: "Хорошие новости из Берна, швейцарское правительство решило сдать район Романди нам мирно и без боя. Швейцарские военные эвакуированы из этого района, и наши дивизии пересекают границу, чтобы быстро восстановить порядок для запутавшихся граждан."
 fra.51.a: "С каждым днем мы становимся все более могущественными."
 ###
 fra.52.t: "Аннексия Тессина"
 fra.52.d: "Французское правительство аннексировало регион Романди и показало миру, насколько слабы на самом деле швейцарцы."
 fra.52.a: "Пошлите войска!"
 ###
 fra.53.t: "Конфликт между романами"
 fra.53.d: "В последние несколько дней на франко-швейцарской границе усилилась напряженность, и многие во всем мире затаили дыхание, чтобы увидеть, что мы будем делать дальше, будем ли мы атаковать или вернемся к нации, которая украла наш народ и отвергла наши требования."
 fra.53.a: "Соберите войска!"
 ###
 fra.54.t: "Черная среда поражает Францию!"
 fra.54.d: "Экономический спад по всему английскому каналу, наконец, поразил нас, и наша сломанная экономическая оборона не совпадала для крупнейшей мировой экономики, которая рухнула сама по себе. Цена франка упала до невиданного уровня, и она не показывает никаких признаков замедления в ближайшее время. Наши экономисты делают все возможное, чтобы разработать планы по борьбе с этой депрессией, но французская экономика, несомненно, будет страдать в течение нескольких месяцев, если не больше. Наши колониальные офисы, глубоко связанные с экономикой столичного региона, стали свидетелями почти полного краха своей новой экономики. Наши индокитайские колонии потребовали полного освобождения от своих долгов, и наши компании во Французской Африке почти все подали на банкротство."
 fra.54.a: "Это трагедия!"
 fra.54.b: "Что мы будем делать?"
 fra.54.c: "Это не сулит ничего хорошего..."
 fra.54.e: "Что-то должно быть сделано!"
 fra.54.f: "Разве мы не можем просто отдохнуть?"
 ###
 fra.55.t: "Положение улучшается"
 fra.55.d: "Экономическая политика и инициативы правительства привели к резкому улучшению нашей экономической ситуации."
 fra.55.a: "Замечательные новости!"
 ### Event fra.56 uses the same text as 55.
 fra.57.t: "Экономическое процветание"
 fra.57.d: "Последствия черной среды, наконец, снизились, и цены во Франции вернулись к стабильному уровню."
 fra.57.a: "Хлеб наконец-то стал доступным?"
 ###
 fra.58.t: "Занятие канарей"
 fra.58.d: "Вчера рано утром из Касабланки в Канарские острова ушли небольшие ударные силы французских морских пехотинцев, которые в настоящее время удерживаются испанскими фалангистами. Операция продолжалась в общей сложности 16 часов и началась с захвата острова Фуэртевентура и Гран-Канария. на острове Тенерифе поступили сообщения о ожесточенных боевых действиях, а город Санта-Крус-де-Тенерифе, несмотря на то, что он был полностью окружен в течение нескольких часов. К полудню город пал, а морские пехоти переместились на последние три западных острова в цепи. Малые карманы сопротивления , задерживавшиеся в лесных горах в течение более чем одного дня, наконец-то были голоданы и вынуждены сдаться."
 fra.58.a: "Необходимость обеспечения мира."
 ###
 fra.59.t: "Занятие пиренеев"
 fra.59.d: "Французские горожане установили оборонительные позиции вдоль Пиренеев и захватили несколько ключевых городов в регионе."
 fra.59.a: "Необходимость обеспечения мира."
 ###
 fra.60.t: "Дипломатическая напряженность во Франции"
 fra.60.d: "Новости из Парижа дошли до нас ранее сегодня, подробно излагая французские планы по проведению решительной антибританской внешней и внутренней политики. Как представляется, итоги Лондонской военно-морской конференции наконец-то сдвинули масштаб и оттолкнули французов с нашей стороны. Хотя это, безусловно, придает Германии главенство в дипломатическом плане, мы сами, возможно, сможем быть готовыми к этому событию, поскольку французы теперь дипломатически изолировали себя от самой могущественной империи, которую когда-либо видел мир."
 fra.60.a: "Мы будем внимательно следить за этими событиями..."
 ###
 fra.61.t: "Подъём АФ"
 fra.61.d: "После назначения Жоржа Валуа главой французского правительства Французская организация по борьбе с терроризмом поднялась на передний план и заняла видное место во французской политике. Монархисты занимают посты в правительстве с ошеломляющими темпами, и говорят о восстановлении французской монархии под домом Орлеана. До сих пор не видно, будут ли эти слухи правдивы, но происходит значительный политический сдвиг внутри страны, и вскоре мы можем увидеть еще одно радикальное изменение во французской политике."
 fra.61.a: "Черепаха может быть на горизонте."
 ###
 fra.62.t: "Французы требуют Валлонию!"
 fra.62.d: "Несмотря на наши самые большие надежды, авторитарный режим во Франции начал смотреть наружу с экспансионистской политикой. Мы отправили из Парижа официальную дипломатическую телеграмму с перечнем требований, в частности о передаче франкоговорящего региона Валлонии. Нн Валлония является неотъемлемой частью бельгийской нации, и передача ее французам будет означать практически передачу нашего суверенитета французам. Однако победа маловероятно, если мы не сможем обеспечить поддержку другой крупной европейской державы, и британцы, как представляется, являются нашим единственным выбором в этом вопросе."
 fra.62.a: "Увы, мы бессильны."
 fra.62.b: "Бельгийский лев стоит на ее земле!"
 ###
 fra.63.t: "Бельгийцы просят о нашей поддержке!"
 fra.63.d: "Мы получили срочную телеграмму из Брюсселя, французы, похоже, потребовали, чтобы бельгийцы отказались от нескольких суверенных прав, а также от региона Валлонии. Бельгийцы, которые когда-либо были противны и полны решимости оставаться независимыми, просили, чтобы мы поддержали их как в политическом, так и в военном отношении в случае французского вторжения на их территорию. Согласие может предотвратить начало еще одной крупной войны в Европе, но у нас есть равные шансы начать войну с французами, которая вскоре может поглотить мир в огне, мы должны выбрать осторожно."
 fra.63.a: "Бельгийцы пользуются нашей безоговорочной поддержкой!"
 fra.63.b: "Мы должны пока отказаться от наших европейских союзников."
 ###
 fra.64.t: "Бельгийцы тянут время!"
 fra.64.d: "Бельгийцы прислали нам ответ, в котором они, как представляется, не согласились с нашими требованиями и не отрицали их, и они явно задерживаются на время. Мы не можем просто вторгнуться в бельгийские власти, поскольку у нас еще нет справедливого дела, и мы можем рискнуть тем, что международная коалиция наций вспомнит о том, что погубило Наполеона I на земле в XIX веке. Британцы являются, скорее всего, союзниками Бельгии, и у нас нет иного выбора, кроме как подождать и увидеть, как они реагируют на сложившуюся ситуацию."
 fra.64.a: "Будем надеяться, Альбион откажется вмешиваться в наши дела."
 ###
 fra.65.t: "Британия поддерживает нас!"
 fra.65.d: "Радостные новости прибыли из Лондона, британское правительство оказало нам полную политическую и военную поддержку в борьбе с французскими требованиями, хотя многие обеспокоены тем, что на горизонте может вспыхнуть еще одна крупная европейская война, французы, скорее всего, просто откажутся, когда у нас будет поддержка международной империи на нашей стороне."
 fra.65.a: "Мы должны подготовиться к войне в любом случае..."
 ###
 fra.66.t: "Британия поддерживает бельгийцев"
 fra.66.d: "Похоже, что усилия Бельгии, направленные на то, чтобы задержать нас, сработали, так как они каким-то образом сумели заручиться полной поддержкой Британской империи."
 fra.66.a: "Мы столкнемся с британским львом, если мы должны"
 fra.66.b: "Они играли с нами, как чертова скрипка!"
 ###
 fra.67.t: "Франция настаивает на их требованиях к Валлонии"
 fra.67.d: "Похоже, что нашего нового союза с Великобританией было недостаточно для того, чтобы убедить подопытных во Франции отказаться, и они потребовали немедленной передачи Валлонии французской власти или перед лицом военных действий. Судьба двух великих империй попала в наши руки, и это наш выбор, будут ли эти бемофы враждовать или нет."
 fra.67.a: "У нас британская поддержка, мы не можем проиграть!"
 fra.67.b: "Валлония не стоит глобального конфликта."
 ###
 fra.68.t: "Бельгия не повинуется!"
 fra.68.d: "Похоже, что британцы дали бельгийцам достаточно уверенности, чтобы отрицать наши требования, и они не оставили нам иного выбора, кроме как навязать наши претензии военной силой."
 fra.68.a: "Королевская армия не будет побеждена!"
 ###
 fra.69.t: "Британия бросила нас!"
 fra.69.d: "Ужасные новости, британцы отказались отказаться от своей изоляционистской политики и вместо этого решили оставить нас в час нужды."
 fra.69.a: "В наши дни никому нельзя доверять, не так ли?"
 ###
 fra.70.t: "Британия бросила бельгийцев!"
 fra.70.d: "Похоже, что британский лев хочет поспать немного дольше, поскольку он отказывается поддержать бельгийцев в их стремлении задержать неизбежное и создать потенциально глобальный конфликт."
 fra.70.a: "Давайте наконец решим этот вопрос."
 ###
 fra.71.t: "Французский ультиматум"
 fra.71.d: "Мы были брошены нашими союзниками, и французы сочли нужным выполнить свои требования к нам. Французские солдаты ждут прямо через границу сигнала нападения, и мы безнадежно бессильны победить их дипломатически. Наша единственная надежда сейчас - либо успокоить Валлонию и надеяться на мир, либо использовать реки и бункеры для того, чтобы задержать французское вторжение достаточно долго, чтобы совершить чудо. Это следующее решение может диктовать курс нашей нации на многие десятилетия, чтобы подумать внимательно."
 fra.71.a: "Мы победим французов на поле!"
 fra.71.b: "Однажды мы отомстим..."
 ###
 fra.72.t: "Бельгийцы продолжают нас бросать!"
 fra.72.d: "Бельгийцы решили, что в их интересах отказаться от наших требований и подготовиться к бою, и мы полностью надеемся раздавить бельгийскую армию, и многие верят, что мы будем в Брюсселе к концу недели."
 fra.72.a: "На войну, Джинго!"
 ###
 fra.73.t: "Полный экономический крах"
 fra.73.d: "Наихудшее, наконец, пришло, средства, которые мы выделили специально для того, чтобы справиться с экономическим крахом, были израсходованы, и мы официально обанкротились. Просьбы о дополнительном финансировании были полностью отвергнуты мини-финансами, которые больше не доверяют нам расходовать деньги разумно. Наша экономика была полностью разрушена, и отдельные сектора правительства начали объединять свои ресурсы для того, чтобы преодолеть кризис как можно лучше. Хотя мы верим, что это пройдет, это еще долгое время."
 fra.73.a: "Упс?"
 ###
 fra.74.t: "Формы временного правительства!"
 fra.74.d: "Благодаря нашим усилиям по созданию ГФА нам удалось создать небольшую армию, которая ждала нас в Африке, и теперь у нас есть силы, чтобы защитить наши побережья от немцев и, с божьей помощью, помочь нам вернуться на материк в будущем."
 fra.74.a: "Радостные новости!"
 ###
 fra.75.t: "Автономия Парижа"
 fra.75.d: "В период, предшествовавший франко-прусской войне и короткоживущему Парижскому коммуне, население Парижа стало все больше и больше недовольствоваться правлением императора Наполеона III и стало требовать более автономных прав, которыми уже пользовались небольшие города по всей Франции. Эти пожелания были отвергнуты императором, и лишь через три месяца после того, как Париж сдался прусской армии в 1871 году, город объявил независимый коммуну, возглавляемый радикализованной национальной гвардией, которая первоначально была уполномочена защищать город. nnwhilst the Commune был побежден всего лишь через десять дней после того, как его основали французские вооруженные силы, его наследие оставалось сильным в сердцах и умах парижских граждан. Дух коммуны по-прежнему силен в некоторых городах, и многие по-прежнему призывают к усилению непристойности и автономии; теперь, когда эти желания наконец-то были впечатлены, граждане Парижа, болеют за правительство и выступают за дальнейшую децентрализацию на всей территории страны, и пока мы не готовы принять такие экстремные меры по восстановлению старого парижского коммуна, которые, возможно, когда-то и могут оказаться полезными."
 fra.75.a: "Победа для народа!"
 ###
 fra.76.t: "Бордо протестует против парижской автономии!"
 fra.76.d: "Как и ожидалось, мы отреагировали на местную реакцию из-за предоставления парижской автономии в городе Бордо на западном побережье Франции. Граждане участвуют в мелких беспорядках и требуют таких же приватий, как Париж. Мы не можем уступить этим требованиям, поскольку это почти наверняка приведет к эффекту домино, который приведет к полной децентрализации и общему ослаблению нашего государства."
 fra.76.a: "Черт!"
 ###
 fra.77.t: "Марсель протестует против парижской автономии!"
 fra.77.d: "Как и ожидалось, мы отреагировали на местную реакцию из-за предоставления парижской автономии в Марселе на средиземноморском побережье Франции. Граждане участвуют в мелких беспорядках и требуют таких же приватий, как Париж. Мы не можем уступить этим требованиям, поскольку это почти наверняка приведет к эффекту домино, который приведет к полной децентрализации и общему ослаблению нашего государства."
 fra.77.a: "Черт!"
 ###
 fra.78.t: "Орлеан протестует против парижской автономии!"
 fra.78.d: "Как и ожидалось, мы отреагировали на местную реакцию в связи с тем, что мы предоставили парижскую автономию в городе Орлеан, недалеко от самого Парижа. Граждане занимаются мелкими беспорядками и требуют таких же приватий, как и Париж. Мы не можем уступить этим требованиям, поскольку это почти наверняка приведет к эффекту домино, который приведет к полной децентрализации и общему ослаблению нашего государства. Все, что мы можем сделать сейчас, это опуститься и ждать волну беспорядков."
 fra.78.a: "Черт!"
 ###
 fra.79.t: "Нант протестует против парижской автономии!"
 fra.79.d: "Как и ожидалось, мы восстановили местную реакцию из-за предоставления парижской автономии в городе Нанте, городе с сильными узами Бретона. Граждане занимаются мелкими беспорядками и требуют того же, что и Париж. Мы не можем уступить этим требованиям, поскольку это почти наверняка приведет к эффекту домино, который приведет к полной децентрализации и общему ослаблению нашего государства."
 fra.79.a: "Черт!"
 ###
 fra.80.t: "Виши протестует против парижской автономии!"
 fra.80.d: "Как и ожидалось, мы восстановили местную реакцию из-за того, что мы предоставили парижскую автономию в городе Виши, относительно необычайно богатом городке с незначительным историческим значением. Граждане занимаются мелкими беспорядками и требуют таких же привилегий, как Париж. Мы не можем уступить этим требованиям, поскольку это почти наверняка приведет к полному децентрализации и общему ослаблению нашего государства. Все, что мы можем сделать сейчас, это упасть и ждать, пока пройдет волна волне волнений."quell the unrest", but this requst was promptly denied when it became clear he simply wished to sightsee and take a quick vacation."
 fra.80.a: "Черт!"
 ###
 fra.81.t: "Битва против объединения"
 fra.81.d: "Благодаря осмотрительному планированию и тайным действиям нам удалось слегка снизить популярность и членство профсоюзов в промышленно развитых секторах страны, хотя это прямо подстроило промышленность, большая часть трудящихся в промышленности усилила недовольство правительством и присоединилась к более радикальным социалистическим партиям взамен более популярным умеренным партиям. Эти радикальные партии не настолько велики, чтобы напрямую угрожать национальной стабильности, но многие члены правительства называют эту политику общей неудачей и пятном в истории партии."
 fra.81.a: "По крайней мере, мы что-то сделали!"
 ###
 fra.82.t: "Это событие дает очки монарху страны каждую неделю."
 fra.82.d: "Вы не должны видеть это событие, пожалуйста, свяжитесь с Тёмной ночи 1342, если вы сейчас читаете это событие в игре. Если никто не может прочитать это событие, я могу сказать все, что я хочу правильно? Я хочу поблагодарить мою маму и моего отца за то, что помогли мне добраться до места, где я сейчас. Я бы хотел дать большой сигнал моему главному мужчине Элмо, сохраняя это на самом деле с 2002 года, но что ты, блядь, только что сказал обо мне, маленький сукин сын? Я хочу, чтобы ты знала, что я закончила мой класс в военно-морском флоте, и я была вовлечена в многочисленные тайные рейды на Аль-Куаде, и у меня было более 300 подтвержденных убийств. Я тренировалась в бою с гориллой, и я могу трахнуться с моим главным снайпером во всех вооруженных силах США. Ты не можешь быть ни для кого секретной целью. Я буду вытирать тебя трахать трах, как никогда раньше на этой Земле, помничать твои слова. Я думаю, что ты можешь нахнуть меня, чтобы ты можешь нахать с кем-то, я могу нахнуться с кем-то, что ты можешь быть"
 fra.82.a: "Нижний текст"
 ###
 fra.83.t: "Смена легитимности!"
 fra.83.d: "Из-за изменения общественного мнения и недавней правительственной политики наша оправдываемая легитимность коренным образом изменилась."
 fra.83.a: "Мы живем в интересные времена..."
 ###
 fra.88.t: "Король Жан критиковал за подчинение воле регионального сопротивления."
 fra.88.d: "Франция, возможно, сейчас полностью находится под королевским правлением, но многие в новом правительстве уже критикуют короля за его выбор в пользу волнений, которые обрушились на страну не так давно. Хотя местные органы власти первоначально выступали против королевского правления, король, казалось, был абсолютно настроен умиротворять свои требования всеми возможными способами, предоставляя городам экстремальную автономию и освобождение от налогов, когда бы они не проявляли недовольства. ~ ~В то время как этот, казалось бы, благожелательный и легкий исход будет воспринят как внешним миром, так и другими политиками, как слабость или трусость еще предстоит увидеть, но это, безусловно, ослабит правление королей в предстоящие годы."
 fra.88.a: "Все это является необходимым шагом на пути к обеспечению мира."
 ###
 fra.89.t: "Король Жан критиковал за жестокое подавление гражданского неповиновения."
 fra.89.d: ""
 fra.89.a: "Необходимо принять энергичные меры."
 ###
 fra.90.t: "Король Жан высоко оценил сбалансированный подход к региональным беспорядкам."
 fra.90.d: ""
 fra.90.a: "Хорошее начало для наших королей."
 ###
 fra.91.t: "Обнаружены отпечатки Царского Танка!"
 fra.91.d: "Французские военные теоретики и чемпионы мобильных боевых действий сегодня радуются, поскольку давно потерянные чертежи русского Царского танка были чудом извлечены французскими шпионами, действующими в Восточной Европе. Эти чертежи были быстро и тайно защищены и доставлены во Францию с судов, где после прибытия на материк были приложены огромные усилия для сохранения документов и создания копий в случае, если оригинал был уничтожен или поврежден без признания. ~ ~ ~ После многих недель анализа и разливания деталей этой монстровой машины был сделан вывод о том, что этот танк был полным и полным провалом в планировании и практической работе, и просто был отмечен, как неподходящее русское высококомандование было во время Великой войны. ~ Это величественная эхика оказалась полной тратой времени и усилий, и была хороша не более чем для быстрых смеха, когда наши исследователи и ористы поняли, как смеялся этот автомобиль. ~nneditatad, мы узнали кое-что из этого маленького дебакла, как бы ни было маловероятно, что мы сможем использовать его."
 fra.91.a: "Вау, это бесполезно!"
 ###
 fra.92.t: "Жилье для короля, Парижа или Версалли?"
 fra.92.d: ""
 fra.92.a: "Париж будет его домом!"
 fra.92.b: "Версалли будут его домом!"
 fra.92.c: "Королю не нужно сообщать о своей резиденции общественности, он живет там, где хочет!"
 ###
 fra.93.t: "Сходство с испанцами?"
 fra.93.d: "Монархистские группировки доказали, что они являются самыми сильными из враждующих держав в регионе, и установили полный контроль над всеми ранее едиными испанскими землями. С недавними событиями в нашей стране мы, наконец, идеологически едины с монархистским правительством Испании, и вопрос о дипломатическом сближении горяч в умах граждан обеих стран. На ранней стадии Гражданской войны в Испании возникли значительные трения, но многие считают, что примирение возможно между нашими двумя правительствами, и, возможно, союз в будущем."
 fra.93.a: "Ценное вложение."
 fra.93.b: "У них вообще есть постоянная армия?"
 fra.93.c: "Первым шагом на пути к примирению является возвращение их оккупированных земель."
 ###
 fra.94.t: "Судьба Испанской Республики"
 fra.94.d: "Вторая Испанская Республика была создана в Аль-Рифе после того, как республиканские силы были выведены с материка во время гражданской войны, но с ростом новой французской монархии мы оказались в идеологическом противоречии с Республикой в изгнании. Многие в правительстве считают, что мы должны решительно аннексировать Республику и управлять ею как частью Защитника или Марокко, в то время как другие считают, что братская республика все еще полезна и может быть более полезной в восстановлении порядка на испанском полуострове."
 fra.94.a: "Республика умирает во второй раз!"
 fra.94.b: "Республика по-прежнему полезна для нас."
 fra.94.c: "Преобразовать Республику в нашу марионеточную монархию!"
 ###
 fra.95.t: "Выборы 1940 года"
 fra.95.d: "Наконец-то наступили выборы."
 fra.95.a: "СФИО побеждает!"
 fra.95.b: "РС побеждает!"
 fra.95.c: "АД побеждает!"
 fra.95.e: "ФБР побеждает!"
 ###
 fra.96.t: "Пренебрежение Французской солидарностью"
 fra.96.d: "Единственное валькистское движение Франции, «Французская солидарность», по слухам, работает в сотрудничестве с правительством Германии уже довольно долго. Если это движение свободно использует хитрость для подрыва французского государства, что это говорит о других радикальных партиях, которые могут хотеть свергнуть нынешнее правительство? [РООТ.Гет лидер] неоднократно выражал свое презрение к движению, и теперь многие в партии призывают к полному запрету и роспуску партии."
 fra.96.a: "Они являются врагами государства и должны рассматриваться как таковые."
 fra.96.b: "Это движение умрет само по себе, нет необходимости в правительственном вмешательстве."
 ###
 fra.97.t: "Последние толчки скандала"
 fra.97.d: "Несмотря на то, что Национальному Блоку удалось выжить после скандала с правительством, шрамы, остающиеся на его публичном имидже, отказались залечить. Призывы к роспуску коалиции становятся все более громкими с приближением выборов 1940 года, и многие в правительстве считают, что коалиция выполнила свою цель и больше не нуждается в существовании. даже те, кто находится в правительстве, начали соглашаться с тем, что выживание французского государства важнее, чем их коалиция."
 fra.97.a: "Времена, конечно, меняются."
 ###
 fra.98.t: "Конституция Петена"
 fra.98.d: "С учетом того, что власть Петена больше не ставится под сомнение со стороны противостоящих сил, настало время разработать новую конституцию с целью укрепления его правления и реорганизации правительства в более эффективную систему. Многие сторонники Петена считают, что авторитарная конституция, которая лишает власть законодательной власти и укрепляет ее под руководством самого Петэна, является наилучшим вариантом обеспечения мирного правления."
 fra.98.a: "Посвящение единства с Петеном на вершине"
 fra.98.b: "Передача конституции с сильным правительством"
 ###
 fra.99.t: "Саарский вопрос"
 fra.99.d: ""
 fra.99.a: "Уничтожить валькистов Саарленда!"
 fra.99.b: "Возможно, мы сможем прийти к соглашению."
 ###
 fra.100.t: "Петен берет под свой контроль Свободную французскую армию"
 fra.100.d: "Петен прибыл в Алжир и принял непосредственное командование французской армией в Африке, став фактически главой государства."
 fra.100.a: "Он приведет нас к победе."
 ###
 fra.101.t: "Габон провозглашает независимость!"
 fra.101.d: "Блядь, туземцы, чёрт побери!"
 fra.101.a: "Потрясающе!"
 ###
 fra.102.t: "Габон восстает против французских предателей!"
 fra.102.d: "Эй Имао"
 fra.102.a: "Отправьте им оборудование!"
 fra.102.b: "Это уловка, не отвечать..."
 ###
 fra.103.t: "Дагомея объявляет независимость!"
 fra.103.d: "Да, да, да"
 fra.103.a: "Потрясающе!"
 ###
 fra.104.t: "Повстанческое восстание в Пуатье!"
 fra.104.d: "Xd"
 fra.104.a: "Они будут сокрушены."
 ###
 fra.105.t: "Повстанческое восстание в Пас-де-Кале!"
 fra.105.d: "Xd"
 fra.105.a: "Они будут сокрушены."
 ###
 fra.106.t: "Повстанческое восстание в Бургундии!"
 fra.106.d: "Xd"
 fra.106.a: "Они будут сокрушены."
 ###
 fra.107.t: "Возвращение Марселя!"
 fra.107.d: "После ожесточенной морской битвы у побережья Прованса рано утром наши силы приземлились к югу от Марселя и захватили весь город в течение дня."Our ultimate victory is finally upon us, my fellow Frenchmen. Today was our first victory, but it is far from our last. Soon we will arrive in Paris to the cheer and applause of our countrymen and women, and our wives will greet us with open arms. The German's days are numbered, and we are the harbingers of their death!". \n\nWith this swift victory, morale of the collaberationist French army has dropped significantly. We should take advantage of this break and press our advance, for a stalemate in metropolitan France will end with our inevitable defeat."
 fra.107.a: "Победа близка!"
