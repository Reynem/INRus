 ### Characters ###
 FRA_marcel_deat: "Марсель Деат"
 #FRA_marcel_deat_leader_desc: "Марсель Деат возродил политическую систему коммуны, Ленинист, который часто публично объявлял о своем пренебрежении к синдикативизму, Деат выступает против большей части политического устройства Франции, его многочисленные враги как во Франции, так и за ее пределами могут привести к его, а возможно и к падению коммуны."

 FRA_georges_valois: "Жорж Валуа"
 # FRA_georges_valois_leader_desc: "Жорж Валуа, приверженный национальным синдикативистским учениям Жоржа Сорела, стал председателем Генерального совета по борьбе с тиранией."

 FRA_marcel_cachin: "Марсель Качин"
 # FRA_marcel_cachin_leader_desc: "Марсель Качин, бывший дипломат и начальник бюро государственной газеты Человечество , стал председателем французского коммуны. Ленинист , его дипломатический подход и общая харизма позволяют ему сохранять определенную степень сердечности к синдикалистам и анархистам."

 FRA_leon_jouhaux: "Леон Жухо"
 # FRA_leon_jouhaux_leader_desc: "Леон Жухо был избран председателем Администрации Треваля. Жухо, как революционный профсоюзный деятель, участвовал во всеобщей забастовке 1919 года, которая привела к созданию коммуны. Он является приверженцем ортодоксального французского синдикализма, подлинного центриста в фракциях коммуны."

 FRA_vincent_auriol: "Винсент Ауриол"
 # FRA_vincent_auriol_leader_desc: "Винсент Ауриол, которого долго обвиняли синдикалисты жесткой линии в сочувствии буржуазии, стал председателем Администрации Травайля, он выступает за постепенный переход к более демократической системе правления в коммуне."

 FRA_jacques_doriot: "Жак Дориот"
 #FRA_jacques_doriot_leader_desc: "Жак Дориот, ветеран Велткрига, вернулся из плена в Германию, чтобы найти французов, которые навсегда изменились."

 FRA_benoit_frachon: "Бенуа Фракон"
 #FRA_benoit_frachon_leader_desc: "Бенуа Фрахон, ветеран французской гражданской войны, стал председателем Государственной палаты Треваля. В то время как он синдикалист, он симпатизирует противостоящей анархистской фракции; с этой целью он объявил о том, что главной целью его председательства является преодоление фракции коммуны."

 FRA_sebastien_faure: "Себастьян Форе"
 #FRA_sebastien_faure_leader_desc: "Себастьян Фауре является первым анархистом, который стал председателем Администрации Треваля."

 FRA_conseil_de_defense_federal: "Федеральный совет"

 FRA_pierre_jules_cot: "Пьер Джулс Кот"

 FRA_maurice_gamelin: "Морис Гамелин"
 #FRA_maurice_gamelin_leader_desc: "Генерал Морис Гамелин сверг якобинский режим Марселя Деата, хотя его переворот является явным оскорблением и без того сомнительного демократического процесса в коммуне, многие теперь считают Гамелин спасителем коммуны и даже синдикативизмом."
