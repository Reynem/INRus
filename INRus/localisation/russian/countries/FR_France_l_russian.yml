 ###
 FRA_italy_industry_coop: "Франко-итальянское промышленное сотрудничество"
 FRA_italy_industry_coop_desc: "Итальянцы - наш последний настоящий союзник на европейском континенте, как таковой, мы должны укреплять связи между нашими нациями, создавая новые фабрики из рабочей силы обеих стран."
 ###
 FRA_tripoli_tunisia_industry: "Промышленное сотрудничество между Триполи и Тунисом"
 FRA_tripoli_tunisia_industry_desc: "Триполи и Тунис граничат друг с другом на северном побережье Африан, развитие обеих этих колоний значительно увеличит мощь наших двух империй."
 ###
 FRA_democratic_unity: "Демократическое единство"
 ###
 FRA_anatolia_council: "Совет анатолийских оккупированных территорий"
 FRA_anatolia_council_desc: "Значительная часть Анатолии была оккупирована Италией и Францией в конце Великой войны, и с тех пор управление в обоих регионах было неэффективным и неуправляемым."
 ###
 FRA_italy_rhine: "Грант Права ресурсов Италии"
 FRA_italy_rhine_desc: "Италия испытывает нехватку ресурсов с тех пор, как они объединились, поскольку полуостров не является особенно богатым регионом."
 ###
 FRA_libyan_oil: "Добыча ливийского масла"
 FRA_libyan_oil_desc: "Извлечение этих ресурсов будет иметь жизненно важное значение для обеспечения нашей империи в предстоящие годы."
 ###
 FRA_italy_navy: "Франко-итальянские военно-морские силы"
 ###
 FRA_austria_safety: "Обеспечение независимости Австрии"
 ###
 FRA_swiss_attack: "Швейцарский вопрос"
 FRA_swiss_attack_desc: "Нация Швейцарии состоит не менее чем из четырех этнических групп, две из которых являются французами и итальянцами."Swiss Question" has come up once more. Several promient members of the government are calling for the integration of Romandie into France, and even the PPF and PFNC support the idea. We will approach the Italians in order to decide the fate of Switzerland, and hopefully find a satisfying solution. \n\nThe Swiss government of course will not be invited to these talks, but why would they be?"
 ###
 FRA_gabon_cameroon_rails: "Железнодорожные дороги Габон-Камерун"
 FRA_gabon_cameroon_rails_desc: "Инфраструктура в Центральной Африке очаровательна, но совместные усилия между нами и итальянцами могли бы значительно улучшить эту ситуацию."
 ###
 FRA_black_monday: "Ответ на «Чёрный понедельник»"
 FRA_black_monday_desc: "Банки закрыли, и многие компании подают заявления о банкротстве. Многие граждане требуют денег наличными, и наше правительство осуждается на улицах. Было выдвинуто несколько планов по урегулированию этого кризиса, но у нас есть очень ограниченный бюджет для работы из-за недавнего экономического скандала, который потрясла французскую экономическую и политическую сцену. Если мы не быстро примем эти решения и не вернем нашу экономику на ноги, то мы можем столкнуться с чем-то гораздо хуже, чем падение цен на акции. ~ nn Свободный бюджет: §G[? Root. French BuittAwnum] млн. §!! Франсс.\Inflacion: §Y [?fra_var_unflooperation]%!"
