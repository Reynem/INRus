 ###
 FRA_move_industry_loire: "Перенести промышленность в Луар"
 FRA_move_industry_loire_desc: "Луар - это крупная река, разделяющая Францию на две части, поставив нашу уязвимую промышленность на дальнюю сторону этой реки, что позволит нам более быстро установить оборонительные линии и сократить наши линии снабжения, если немцы когда-либо достигнут самой реки."
 ###
 FRA_move_industry_aquitaine: "Переместить промышленность в аквитане"
 FRA_move_industey_aquitaine_desc: "Аквитане далеко от границы с Германией и отделены от гор, лесов и рек. Переезд наших фабрик туда займет много времени, но защитит их от немецкой угрозы."
 ###
 FRA_move_industry_rhone: "Перенести промышленность в Рону"
 FRA_move_industry_rhone: "Река Роун протекает на юго-востоке Франции и является одним из наиболее защищенных районов всей нашей страны."
 ###
 FRA_arms_contracts: "Европейские контракты на поставки оружия"
 ###
 FRA_arms_contracts_missions: "Европейские контракты на поставки оружия"
 ###
 FRA_sign_poland1: "Подписать контракты на поставки оружия с Польшей"
 FRA_sign_poland1_desc: "В результате польское государство стало в высшей степени милитаризированным и ведёт путь в военной технологии и развитии."
 ###
 FRA_sign_italy1: "Подписать контракты на поставки оружия с Италией"
 FRA_sign_italy1_desc: "Итальянское государство является относительно новым игроком на мировой сцене, но их военные экспедиции в Африку и их суровый альпийский фронт во время Великой войны научили их многим великим урокам о том, как вести войну в самых разных заграждениях."
 ###
 FRA_sign_belgium1: "Подписать контракты на поставки оружия с Бельгией"
 FRA_sign_belgium1_desc: "Бельгийское провозглашение нейтралитета оказалось мало чем полезным, когда немцы вторглись в свою нацию во время Великой войны, и поэтому они начали милитаризовывать свое государство, готовясь к новому вторжению в любое время, и их оборонительные возможности в регионе не были оценены."
 ###
 FRA_sign_poland2: "Подписать контракты на поставки оружия с Польшей"
 FRA_sign_poland2_desc: "В результате польское государство стало в высшей степени милитаризированным и ведёт путь в военной технологии и развитии."
 ###
 FRA_sign_italy2: "Подписать контракты на поставки оружия с Италией"
 FRA_sign_italy2_desc: "Итальянское государство является относительно новым игроком на мировой сцене, но их военные экспедиции в Африку и их суровый альпийский фронт во время Великой войны научили их многим великим урокам о том, как вести войну в самых разных заграждениях."
 ###
 FRA_sign_belgium2: "Подписать контракты на поставки оружия с Бельгией"
 FRA_sign_belgium2_desc: "Бельгийское провозглашение нейтралитета оказалось мало чем полезным, когда немцы вторглись в свою нацию во время Великой войны, и поэтому они начали милитаризовывать свое государство, готовясь к новому вторжению в любое время, и их оборонительные возможности в регионе не были оценены."
