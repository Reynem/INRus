 FRA_nestor_makhno: "Нестор Махно"
 #FRA_nestor_makhno_commander_desc: "§L\n8 ноября 1888 года в Хулиайполе, провинция Екатеринослав, русская империя §Y Военная карьера: §L Рожденный в крайней нищете в сельской восточной Украине, Нестор Махно пережил худший из покойной Русской империи - он потерял отца, когда ему было десять месяцев, и любой шанс получить образование в десять лет, так как ему пришлось бросить школу для работы на странных работах, чтобы прокормить свою семью. Он развил первобытную ярость для владельца и владельца фабрики, вел дикий забастовку против своего владельца, когда ему было 12 лет, и полностью посвятил себя надвигающейся революции с тех пор, как ему было семнадцать лет, после революции 1905 года. Он возглавлял анархистские группы, скирмируясь с полицией, и в конечном итоге был осужден к пожизненному заключению тяжкого труда. \n\Sickly, но при этом энергичный, Макно был освобожден после февральской революции и сразу же отправился в Украину для продолжения своей работы. Теперь он уже не был промоганистом, но революционистом лидером. После того, что он был некоторое время изгнан из Германии, когда он стал свидетелем немецкой оккупации"paper revolution" and returned home in July 1918. There, he set up the Revolutionary Insurgent Army and began a year long war of resistance against the Germans and Ukrainian nationalists. Though brutal and not at all educated in army affairs, Makhno earned the favor of the countryside and gave the Hetman a much tougher fight than expected before being forced to flee. Ultimately, he arrived in the Commune of France, which he immediately denounced as yet another paper revolution. Uninterested in its intellectual foundations, Makhno merely saw disunity, inaction and oligarchy which threatened to overturn the accomplishments of the Revolution by creating yet another aristocracy. Much like Bolshevik exiles, he was integrated into the Federal Army, and earned a following with tales of his exploits - however, he was a maverick in the officer corps, clashing with his superiors and ignoring his duties. Neither him nor the Army were satisfied, so, Makhno left for the wider world - serving in revolutionary volunteer corps throughout the post-war to further the world revolution instead. This path has brought him to Patagonia - where he can serve the cause while being out of mind for the Communards."

