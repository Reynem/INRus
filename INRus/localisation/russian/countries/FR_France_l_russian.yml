 ###
 FRA_oil: "Уязвимые нефтяные месторождения"
 FRA_oil_desc: "Несмотря на все наши усилия, враг начал посягать на наши ценные нефтяные месторождения, если этот ценный ресурс попадет в их руки, это будет трагической потерей, и как таковой у нас есть возможность поджечь поля и сжечь все нефтяные месторождения, что приведет к разрушению месторождений в штате, и будет означать, что нефтяные ресурсы будут утрачены для нас, если мы восстановим состояние, в котором произошло сжигание, но это может быть наилучшим вариантом, если мы откажемся от наших сообщников в стратегическом преимуществе и воспользуемся их инициативой."
 ###
 FRA_tech_decisions: "Технологические достижения"
 ###
 FRA_circumnavigation: "Попытка Воздушных циркумных судов"
 FRA_circumnavigation_desc: "Первое воздушное плавание было скомпоновано в 1924 году командой американских пилотов, но с тех пор прошло много лет, и технологии военного времени создали гораздо более мощные самолеты, способные обходить земной шар за гораздо меньшее время."
 ###
 FRA_foreign_policy: "Внешняя политика"
