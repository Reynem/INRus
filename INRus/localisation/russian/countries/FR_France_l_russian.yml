 ###
 fra.111.t: "Дания в смятении!"
 fra.111.d: "Зона Киэла недавно была ввергнута в беспорядок с ростом крайне левого экстремистского правительства, и это новое правительство."Hamburg Commune" has quickly assembled an army and encroached on Danish territory with the intention of controlling the entire region. As the Danes are a part of the Entente Council, we have an obligation to send them help in their struggle."
 fra.111.a: "Отправьте им незаметную помощь!"
 fra.111.b: "Пошлите им немного больше, чем символическая помощь."
 fra.111.c: "Дэйны еще не заслужили нашей помощи."
 ###
 fra.112.t: "Провинциальные револьты!"
 fra.112.d: "Он почти сработал без стычка... ни один из региональных управляющих по всей стране не признал наш королевский режим незаконным и вместо этого объявил о своей верности республиканскому режиму, базирующемуся в городе Бордо. Новости о новом временном режиме появились вскоре после официального объявления о восстановлении французской монархии при Доме Орлеанов и шокировали многих членов правительства, которые не ожидали, что будет предпринят такой наглый и дерзкий шаг."
 fra.112.a: ""
 ###
 fra.113.t: "Конец эпохи"
 fra.113.d: ""
 fra.113.a: "Будем надеяться, что мир научился на своих ошибках..."
 ###
 fra.114.t: "Беспокойство в Индокитае"
 fra.114.d: ""
 fra.114.a: "Мы должны внимательно следить за регионом"
 ###
 fra.115.t: "Война в Индокитае!"
 fra.115.d: "После нескольких месяцев нарастающих волнений и усматриваемых несправедливости в отношении местного населения со стороны колониального правительства, а также истощения Франции из-за ее участия в единственной недавно завершившейся второй Великой войне, в регионе Тонкина и Луанг-Прабанга произошло несколько восстаний с явной целью выбить колониальную администрацию и восстановить в регионе коренное правление. Несмотря на небольшое число восстаний, они, как представляется, были хорошо организованы и уже осуществили несколько скоординированных ударов по оружию и складам, оставшимся после Второй Великой войны в регионе, давая им доступ к современному оружию и большому количеству поставок. Индокитское правительство заверило нас в том, что сообщения о беспорядках и восстаниях переполняются и что в ближайшие дни они не утихнут. Даже руководство восстания, как представляется, было спровоцировано членами советского правительства, и даже радикальные элементы левой-КМТ поддерживают движение через районы Наннинга и Юннанана."
 fra.115.a: "Неужели мир никогда не познает мира?"
 ###
 fra.116.t: "Женевская конференция"
 fra.116.d: "Война в Индокита продолжается вот уже несколько лет, и число погибших достигло небывалых высот. ИПН вырыла в северные районы Индокитая и не свидетельствует о том, что в ближайшее время произойдет разрыв. Повсюду происходят беспорядки в Аннаме и Камбодже, и повседневная гражданская жизнь практически прекратилась, поскольку французские граждане живут в ежедневном страхе перед местным восстанием или бомбардировкой автомобилей, уничтожающей то, что у них есть. Размещение в регионе привлекло внимание всего мира и даже при поддержке нескольких мировых держав мы не можем восстановить нашу гегемонию над регионом. В связи с этими фактами в городе Женеве была созвана конференция, призванная содействовать установлению мира между двумя сторонами и восстановить определенное подобие мира и стабильности в регионе."imperialist" powers which are currently engaged in hostile acts against the Vietnamese and Lao people. \n\nWhilst our diplomats were initially shocked by their outrageous demands, further negotiations seem to have swayed their minds. The Indochina war shows no signs of stopping, and calls for peace all across France are becoming impossible to ignore, if we do not accept the IPL's demands we may be faced with strife and unrest further abroad in our colonies as well as at home in metropolitan France."
 fra.116.a: "Это лучшая сделка, на которую мы можем надеяться."
 fra.116.b: "Чепуха, они у нас на задней ноге!"
 ###
 fra.117.t: "Индокитейнские социалисты предлагают безоговорочную капитуляцию"
 fra.117.d: ""
 fra.117.a: "Пусть это будет посланием для других колониальных агитаторов"
 ###
 fra.118.t: "Последняя стойка в Сайгоне"
 fra.118.d: ""
 fra.118.a: "Это может быть признаком предстоящих событий..."
 fra.118.b: "Все еще есть надежда."
 ###
 fra.119.t: "Организация конкордатизма - 1-й день - профсоюзы"
 fra.119.d: ""
 fra.119.a: "Профсоюзы должны быть основой французского государства"
 fra.119.b: "Разве мы не должны апеллировать влево слишком много, не так ли?"
 ###
 fra.120.t: "Организация конкордатизма — второй день — Наука"
 fra.120.d: ""
 fra.120.a: "Приоритетное внимание следует уделить промышленности Франции"
 fra.120.b: "Военная армия Франции имеет первостепенное значение!"
 ###
 fra.121.t: "Организация третьего дня конкорратизма — сельскохозяйственные синдикаты?"
 fra.121.d: ""
 fra.121.a: "Неортодоксальная, но неплохая идея."
 fra.121.b: "Традиционные корпорации являются более контролируемыми, чем синдикаты"
 ###
 fra.122.t: "Конкордатизация завершена"
 fra.122.d: "Мы заложили основу для построения корпоратистского общества во Франции, и с течением времени мы станем более эффективными и преданными тому, чтобы политическое колесо поворачивалось в нашу пользу."
 fra.122.a: "Всё за несколько дней работы."
 ###
 fra.123.t: "Франко-советский договор о территориальном статусе Кореи"
 fra.123.d: "С учетом того, что японская сила с каждым часом ослабевает, корейский вопрос вышел на передний план наших военных и политических лидеров. Старое королевство Чосон давно исчезло, и Советы быстро ополчились на корейской территории, несмотря на сопротивление Японии. Корейский полуостров мог бы служить прекрасной отправной точкой для усиления нашего влияния как в Китае, так и в Японии, и полное советское господство в регионе могло бы привести к эффекту домино, в котором мы потеряли бы нашу власть над регионом в отношении социализма. ~n n that that that that that condument to the Советы были разработаны предложение о разделении Кореи примерно вдоль 38-й Параллели, и все это должно быть нашей печатью одобрения, которая должна быть отправлена в Москву. Если советы примут это, это гарантировало бы нам контроль над почти половиной Корейского полуострова, гарантируя тем, что Советы будут в другой половине. Мы также включили специальное положение о том, что совместная оккупация должна быть временной, ясно выраженная цель объединения Кореи, когда они будут преисполнены решимости быть способны к самоопредению."
 fra.123.a: "Отправьте письмо в Москву!"
 fra.123.b: "Если мы будем действовать быстро, то, возможно, мы сможем защитить всю Корею для себя."
 ###
 fra.124.t: "Французы предлагают нам половину Кореи."
 fra.124.d: "Наша борьба с японцами с каждым днем становится все более кровопролитной, и сами французы добиваются прогресса на тихоокеанских островах. Недавно мы получили официальный документ из Парижа, в котором излагаются планы совместной франко-советской оккупации Корейского полуострова после вывода японских оккупационных сил. Эта сделка приведет к горизонтальному расколу полуострова примерно на 38-й параллели, что даст нам мощную опору в регионе, из которого мы могли бы проецировать нашу власть на Тихоокеанский и дальневосточный регионы с незначительным сопротивлением."
 fra.124.a: "Согласиться с предложением Франции"
 fra.124.b: "Ничего страшного, мы сожжем всю Корею!"
 ###
 fra.125.t: "Советы согласились с нашим предложением!"
 fra.125.d: "Французская делегация в Москве вернулась с хорошими новостями, советское правительство согласилось на предлагаемый раскол Кореи после того, как Япония успокоилась."
 fra.125.a: "На шаг ближе к международному миру."
 ###
 fra.126.t: "Советы отклонили наше предложение."
 fra.126.d: "К сожалению, советское правительство отклонило наше предложение разделить Корею после капитуляции Японии, возможно, из-за своих собственных амбиций в регионе."
 fra.126.a: "Мы должны действовать быстро, чтобы защитить Корею!"
 ###
 fra.127.t: "Северокорейские официальные лица просят советское правительство о самоопределении."
 fra.127.d: "Наша оккупация верхней половины Корейского полуострова достигла второго дня, и в этот день несколько социалистических политических членов направили официальную петицию, подписанную несколькими тысячами корейских граждан, с просьбой о самоопределении. Они заявили, что если им будет предоставлено относительное самоопределение, то они воздвигнут социалистическое правительство, которое соответствует нашей собственной политике, а также примет нашу сторону на мировой арене."
 fra.127.a: "Весь этот корейский роман - пустая трата времени."
 fra.127.b: "Освободите Корею, но держите их под присмотром."
 fra.127.c: "Корейцы еще не готовы к самоопределению."
 ###
 fra.128.t: "AI - единственное событие"
 fra.128.d: "Если вы можете прочитать это событие, пожалуйста, сообщите разработчикам на Discord."
 fra.128.a: "Пипи какашки"
 ###
 fra.129.t: "Вишиское соглашение"
 fra.129.d: "В последнее время кватриеме Партии не было видно; несмотря на их быстрое увеличение размера и угрожающее положение в связи с СФИО, они продолжают идти вперед и затмеваются более крупной партией, и нынешние прогнозы вряд ли показывают, что они получают 5% голосов населения. ~ Несмотря на то, что без каких-либо отношений с другими партиями, Кватриеме Парти не сможет получить опору, необходимую для того, чтобы получить место в правительстве. ~ Именно по этой причине три лидера трех левых партий встретились в маленьком городке Вичи, имея в виду самосохранение. Ведущие члены Партии Реюра, Демократического альянса и Кватрием Парти встретились в темной, дымовой комнате с намерением заключить сделку, которая приведет к политической коалиции между тремя партиями."triple alliance". Obviously the Quatrième Parti are the natural leaders of the group as they were the ones that called the secret meeting, however they are still the smallest of the three parties and their connections to the SFIO make the liberal parties less willing to openly cooperate with them, perhaps the Alliance Démocratique would be better suited as the leader."
 fra.129.a: "Кватрием Партии запишет царства"
 fra.129.b: "Демократический альянс будет лидером"
 ###
 fra.130.t: "Виктор Барфелеми публикует"Notre lutte""
 fra.130.d: "Радикальный политик и опытный писатель Виктор Барфелеми только что опубликовал свою последнюю книгу, которая на английском языке гласит:"Our Struggle". The book details Barthélemy's views on the Great War and outlines a grand conspiracy he believes was carried out by German spies in order to execute a coup in the Third Republic during the devicive years of 1917-18. The book then focuses on criticizing the successive governments of the Third Republic starting with the 1870 siege of Paris, the Empire's failure to stop the Paris Commune before its ideas spread to the rest of Europe, and the Republic's failure to truly achieve hegemony over Europe and shattering the idea of a unified Germany forever. \n\nBarthélemy was a renound member of the PCF since the 1920s, but during the 1936 election he became tired of the PCF's willingness to cooperate with the Republican government, and as such he joined the far more radical PPF, a far-right organization which promotes a rhetoric of hate and French ultranationalism. Few will ever read his book, and even fewer will be swayed to his side after having read it, yet it is still a sign of the times to come; with more and more citizens moving to radical movements, what happens when the majority no longer believes we have the right to govern?"
 fra.130.a: "Распространять эти идеи - опасная перспектива..."
 ###
 fra.131.t: "Дуэль на небесах"
 fra.131.d: "Во всем западном мире боевые действия всегда рассматривались как достойная профессия, при этом пилоты-пехотинцы изображались современными рыцарями, которые боролись с рыцарями и уважали своих противников. В 1938 году он был принят в Армию Воздуха и быстро отличился от своих коллег. Продемонстрируя превосходное мастерство в насмехающихся боях, он был назначен на авиарейс в Картресе, только запад Парижа. ~ Когда Вторая Великая война достигла границы Франции, эскадрилья Марсела была среди первых, кто стал контактировать с немецкими войсками Луфтваффе над небом Люксембурга. Он и его эскадрилья были на высоте почти 3-1 и были вынуждены быстро отойти, когда верхний немецкий самолет начал перегонять французских пилотов. ~ Когда вторая Великая война достигла границы Франции, ни один из них не был в числе первых, кто стал контактировать с немецкими войсками на небе. Он и его эскадрилью были на высоте около 3-1, и были вынуждены быстро отправиться в сторону немецких пилотов."
 fra.131.a: "Возможно, мы могли бы научиться кое-чему из быстрого интервью."
 ###
 fra.132.t: "Виё фидель"
 fra.132.d: "Битва - это мрачное место, и что угодно может произойти, когда три континентальных задницы титана в драке до смерти. ~nn Vieux fidèle, или"Old Faithful" in English, was originally a Soviet BT tank developed in the interwar years, most likely the late 20s. Many tanks like Vieux fidèle were produced in the Soviet Union in the years leading up to their war with the new German Reich, and when war finally came these tanks were quickly sent to the frontline to act mainly as anti-infantry weapons due to their ineffectiveness against contemporary German armour. Due to their aformentioned ineffectiveness, these tanks were often abandoned by their crews once ammo ran dry or their position became tenuous, leading to many of them falling into German hands. \n\nOnce in German posession, these tanks were dissected and scrapped for parts or spare metal, but a select few were recommissioned under the Wehrmacht and sent back to the frontline. Of course, these tanks weren't sent back East due to the risk that German soldiers may become confused seeing Soviet tanks fighting on their side; instead these tanks were sent West to fight the French Army. \n\nDue to the poor preformance of these tanks, the German crews found themselves abandoning them at the slightest hint of danger, and the French anti-tank guns were able to make swiss cheese out of the outdated Soviet tanks. Despite their low number on the Western Front, a single tank was able to be commandeered by the French Army without being destroyed, this tank was affectionately named Vieux fidèle when it was discovered to have originally been of Soviet origin. The German markings were painted over and replaced with the French roundel, and the tank was prompty driven back to Paris where it was put on display for the citizenry to see. \n\nRarely does something like this occur, we should charish this moment of brevity as the days ahead of us loom darker and darker."
 fra.132.a: "Какая интересная история!"
 ###
 fra.133.t: "Пол Рамадиер"Le Quatrième Parti""
 fra.133.d: "Поль Рамадиер, относительно неясный политик в Третьей Республике, представляющий коммуну Деказвиль, в последние несколько дней вышел на передний план французской политики. &quot; Рамадиер &quot; объявил 4 февраля, что он расстается с СФИО и образует свою собственную партию, известную как &quot; Quatrième Parti &quot; . &quot; Партийная идеология &quot; официально очень похожа на &quot; СФИО &quot; , что объясняется тем фактом, что почти все ее члены являются членами бывшей партии, однако главной целью партии является полная и радикальная реформа французского правительства в парламентскую систему, которая, как мы надеемся, свободна от очевидной разгуловой коррупции третьей партии. &quot; Партия &quot; была основана после нескольких членов СФИО, возглавляемых Рамадиером, оставлена из-за активного участия СФИО в экономическом скандале, который в настоящее время подавляет и парализирует все правительство. &quot; Хотя в настоящее время не существует официальной позиции, многие из которых считают, что если они придут власть, то скоро, что она придет к власти, то вскоре будет заменена четвертой &quot; ."
 fra.133.a: "Интересное событие"
 ###
 fra.134.t: "Дефект членов СФИО"
 fra.134.d: "После вдохновляющего выхода Пола Рамадиера из СФИО вместе с большим меньшинством его членов партия подверглась широкомасштабной внутренней реорганизации и реструктуризации, причем партия все ближе к ПКФ и ФПНК, отказавшись от большей части своей народной поддержки. &quot; Прямыми благодетелями &quot; этого развития стали КВП, многие из которых становятся законным перевоплощением СФИО. &quot; СФИО &quot; , конечно, все еще контролирует большинство народной базы и по-прежнему является крупнейшей левой партией во Франции по очень большому диапазону, и она переживает крупные внутренние структурные изменения. &quot; СФРИО &quot; , для того чтобы убить &quot; СФИО &quot; , потребуется больше, чем это, но трещины начинают проявляться."
 fra.134.a: "СФИО снова станет сильным."
 fra.134.b: "Это может стать началом чего-то большого"
 ###
 fra.135.t: "Кватриемская партия распускается"
 fra.135.d: "Вчера Пол Рамадиер объявил перед толпой в коммуне Деказвилль, что он официально распустит Quatrième Parti и вернётся к SFIO. Эта новость быстро последовала радикальной реструктуризации, которая была проведена SFIO, и как она была успешной в упорядочении партии и склонении большой популярности справа. Несмотря на то, что не было дано никакого официального объяснения, считается вероятным, что притча о ветре была выбита из паруса QP, когда SFIO отказался застопориться и рухнуть под уроном этих многих членов партии. Вместо этого и без того немногие члены QP потеряли веру и воссоединились с SFIO в автомобилях. Вскоре партия появилась только на бумаге и была незамедлительно распущена."
 fra.135.a: "Ещё одна сноска истории потеряна..."
 ###
 fra.136.t: "Пол Рамадиер объявляет свою кандидатуру"
 fra.136.d: "В 1936 году лидер партии Пол Рамадиер объявил о своей кандидатуре. Несмотря на то, что партия остается относительно небольшой, они быстро догоняют СФИО, и некоторые эксперты считают, что они могут одолеть их до начала выборов. Но политический скандал отказывается успокоиться, все больше правительственных чиновников оказываются вовлеченными, и шоковые волны, как представляется, будут иметь последствия, которые будут тянуться годами. Если ПВП сможет нанести удар по СФИО, они могут превзойти партию и встать в один из лучших претендентов на предстоящие выборы."
 fra.136.a: "Похоже, перемены на горизонте..."
 ###
 fra.137.t: "Русские в восторге"
 fra.137.d: "Во время Первой Великой войны русская империя оказала неоценимую помощь в свержении центральных держав и восстановлении мира в Европе, хотя в конечном счете они и были потеряны революционерами, они были оставлены на плаву на Дальнем Востоке под защитой международной коалиции. Теперь русские снова контролируют свою родину и снова бьют в германской двери рядом с нами. Однако формально они не являются частью какого-либо альянса, и это несколько препятствует нашему прогрессу. Приглашение русских к нашей фракции, несомненно, укрепит нас обоих и позволит расширить военное и экономическое сотрудничество между нашими двумя сферами. Конечно, это также означает, что мы будем обязаны дать русским часть пирога, когда война будет победа, и хотим ли мы, чтобы Россия полностью контролировала Восточную Европу, воздвигая завесу железа вокруг их марионеточных государств?"
 fra.137.a: "Русские - бесценное достояние, мы должны умолять их!"
 fra.137.b: "Мы не будем следовать за ошибками Наполеона!"
 ###
 fra.138.t: "Французы предлагают нам союз."
 fra.138.d: "Поскольку мы оба ведем войну против Германии, они предлагают официально оформить наш союз и возобновить дружбу, которую мы провели в 1914-1919 годах."
 fra.138.a: "Друзья до конца!"
 fra.138.b: "Никогда не доверяй французу с рукой за спиной..."
 ###
 fra.139.t: "Россия принимает!"
 fra.139.d: "Русские приняли наше предложение и теперь являются официальным членом Континентального Континентума."
 fra.139.a: "Замечательно!"
 ###
 fra.140.t: "Снижение России"
 fra.140.d: "Русские сочли нужным отклонить наше самое щедрое предложение, они предпочли бы сражаться с немцами в одиночку."
 fra.140.a: "Эй, а нам можно поставлять немецкие войска на Восточный фронт из злобы?"
 ###
 fra.5000.t: "Франция предлагает контракты на поставки оружия!"
 fra.5000.d: "Французы обратились к нашему правительству с предложением, они готовы передать несколько фабрик на 90 дней в обмен на некоторые из наших новейших военных технологий или большое количество оружия."
 fra.5000.a: "Мы примем их великодушное предложение."
 fra.5000.b: "Это не очень-то полезно для того, чтобы [Рот.Гет Наме Деф]"
