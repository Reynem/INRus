#ideas

BOL_socialistic_reforms: "Социальные реформы"
BOL_socialistic_reforms_desc: "Наше новое авангардистское правительство начало осуществлять реформы, которые сделали наше общество более равноправным."
BOL_collectivist_administration: "Коллегиационистская администрация"
BOL_collectivist_administration_desc: "Государство не может быть управляемо для нескольких, но оно должно управлять мышлением всего народа, государство реформировало свою административную структуру, чтобы и дальше приносить пользу простым людям и рабочим классам."
BOL_the_new_suyu: "Новый Сюй"
BOL_the_new_suyu_desc: "Мы, истинные наследники этой земли, наконец-то заняли наше законное место в качестве правителей Вуливы, новая Сюй поднимается в Южной Америке, колониалисты, берегитесь!"
BOL_integrated_population: "Комплексное население"
BOL_integrated_population_desc: "Слишком долго наше население было разделено под правлением европейских захватчиков, только объединив метисов с их истинными корнями и языками, наша нация может двигаться вперед."
BOL_autochthonous_centralization: "Автохтонная централизация"
BOL_autochthonous_centralization_desc: "Власть нации была разделена и управлялась издалека колониальной элитой, с ее уходом, мы наконец-то можем создать центральное правительство коренного происхождения, достаточно мощное для того, чтобы донести до нас наше право рождения."
BOL_united_in_diversity: "Организация &lt; &lt; Единство в разнообразии &gt; &gt;"
BOL_united_in_diversity_desc: "Многие языки и традиции принадлежат этой земле, давайте объединимся и отпразднуем их все! Наше культурное разнообразие лишь еще больше показывает наше величие по сравнению с колониями!"
BOL_ancestral_revanchist_spirit: "Реванхизм анчестров"
BOL_ancestral_revanchist_spirit_desc: "Мы были здесь первыми, прожили с нашими предками, правящими своей судьбой, пока европейцы не пришли и не порезали нас по своей воле, как игрушки, весь континент принадлежит своему родному народу! Мы не можем допустить, чтобы эта трагедия длилась дольше, наши духи не успокоятся, пока Авия Яла не будет предана своим законным правителям."
BOL_popular_militias: "Народные ополчения"
BOL_popular_militias_desc: "Это была не армия штата, которая боролась за Боливию, это были смелые революционеры, рожденные от рабочего человека, сражающиеся за рабочих мира и от имени Боливии."
BOL_communal_councils: "Общинные советы"
BOL_communal_councils_desc: "Под старым бургуазным правлением у людей не было места разделять свой голос, давайте создадим общинные советы, где люди разделят свой голос, которые будут направлять направление нашей страны и революцию."
BOL_perpetual_revolution: "Постоянная революция"
BOL_perpetual_revolution_desc: "Война за рабочих мира еще не окончена, Боливия была просто битвой, мы не можем отказаться от революции, поскольку это единственный путь вперед, мы должны принять ее навсегда."
BOL_peoples_high_command: "Высшее народное командование"
BOL_peoples_high_command_desc: "Несмотря на то, что ни один человек не выше другого, верно, что у каждого человека есть свои особенности и что-то, что он может дать обществу, некоторым из нас придется нести тяжелое бремя руководства высшим командованием революцией, но не бояться, как мы все это делаем, революции."
BOL_shameful_defeat: "Стыдное поражение"
BOL_shameful_defeat_desc: "Много жизней погибло, и наше государство вновь было унижено перед Южной Америкой, раны войны Чако все еще открыты для нашего общества."
BOL_inteligencia_revolucionaria_boliviana: "I.R.B."
BOL_inteligencia_revolucionaria_boliviana_desc: "Боливийская революционная разведывательная служба является учреждением, предназначенным для защиты интересов трудящихся как внутри страны, так и за ее пределами от манипуляции информацией диссидентами и реакционерами, планирующими против революции."
BOL_provincial_autonomy: "Автономия провинции"
BOL_provincial_autonomy_desc: "Предоставляя трудящимся свободу в организации и непосредственное управление развитием и правление в их провинциях, с тем чтобы они могли лучше отвечать своим собственным интересам, мы можем позволить им функционировать без прямой зависимости от централизованного государства."
BOL_community_socialism: "Общинный социализм"
BOL_community_socialism_desc: "Устанавливая в самых маленьких общинах чувство социалистической культуры, мы можем обеспечить благополучие и силу нашей страны и союз трудящихся на всей территории Боливии."
BOL_states_economic_plan_desc: "Приняв подробный государственный план развития нашей экономики, мы можем обеспечить, чтобы производство и развитие нашей страны удовлетворяли потребности, которые мы прогнозировали для нашего государства."
BOL_states_economic_plan: "Государственный экономический план"
BOL_planned_demographics: "Запланированные демографические показатели"
BOL_planned_demographics_desc: "Наша социалистическая структура работает на людей только в том случае, если есть люди, которые поддерживают ее и получают от нее выгоду."
BOL_military_autonomy: "Военная автономия"
BOL_military_autonomy_desc: "Давая воинам, которые управляют провинциями Суйю, бóльшую военную автономию, мы можем улучшить создание спонтанной тактики между нашими разногласиями."
BOL_corporatism_native: "Корпоратизм коренного населения"
BOL_corporatism_native_desc: "Разделяя наше общество на производительные части всех различных этнических групп, которые соответствуют нашей нации, и устанавливая связи между ними и центральным государством Сюй, мы можем лучше управлять удовлетворением наших экономических потребностей."
BOL_great_suyu: "Великая Сью"
BOL_great_suyu_desc: "Вуливия поднялся, как великий Суйю, возвысившись над тенью, которой было предыдущее колониальное государство, мы стоим на восторжествии, как истинное правительство этого континента."




#focus

BOL_status_of_bolivia: "Статус Боливии"
BOL_status_of_bolivia_desc: "Выживший от многих поражений и неудач, статус Боливии в 1936 году труден, кто может знать, как мы будем двигаться вперед?"
BOL_peoples_revolution: "Народная революция"
BOL_peoples_revolution_desc: "Прошел еще один год после революции в Оруро, и боливийский народ наконец-то проснулся и восстал против бургузы, которая держала его в троллях! Новый порядок начинается в Южной Америке, когда международный социализм распространяется через рабочие классы. Теперь народ, а не элита переходит к правлению в Боливии."
BOL_industry_plan: "Боливийский промышленный план"
BOL_industry_plan_desc: "Наша аграрная и слаборазвитая страна не может так продолжаться! Давайте осуществим новые промышленные реформы, которые, наконец, приведут нашу страну к престижу и успеху."
BOL_retaking_the_birthright: "Возвращение к праву рождения"
BOL_retaking_the_birthright_desc: "Это было слишком много, настоящие боливианцы слишком долго страдали от жестокого обращения и отсутствия представительства со стороны колонистов."
BOL_expel_the_colonials: "Изгнать колонистов"
BOL_expel_the_colonials_desc: "Наша земля богата и прекрасна, не удивительно, что сюда приехали завернутые захватчики, но мы не позволим им остаться! Многие из них занимали позиции власти и обширные земли, которые по праву принадлежали истинным жителям этой земли, давайте заберем наши земли и изгоним колонистов из нашей страны, так что они никогда сюда не вернутся."
BOL_control_the_opposition: "Контролировать оппозицию"
BOL_control_the_opposition_desc: "В то время как колониалы были изгнаны, не все счастливы, каким-то образом."international socialism" and that the lower classes, no matter their origin, united against the rich elite. Bah! This is nonsense, the european ideas they carry have been spread to divide our kind! The true bolivians never had any class struggle to begin with! Let's ban their ideas so they don't control us."
BOL_implement_communal_councils: "Создание общинных советов"
BOL_implement_communal_councils_desc: "Под старым бургуазным правлением у людей не было места делиться своим голосом и своими идеями; давайте создадим общинные советы, где наши рабочие, наконец, разделят свой голос, голос революции, которые будут направлять направление нашей страны, трудящихся в их борьбе против элитного капитализма."
BOL_call_for_popular_militias: "Призыв к народным ополчениям"
BOL_call_for_popular_militias_desc: "Это была не армия государства, которая боролась за Боливию, но это были смелые революционеры, рожденные простыми рабочими, сражающимися за трудящихся мира и от имени Боливии."
BOL_socialist_infrastructural_revamp: "социалистическая инфраструктурная революция"
BOL_socialist_infrastructural_revamp_desc: "Старое правительство тратит слишком много на ненужные дела и не заботится о жизни рабочего человека."
BOL_dispose_of_the_traitors: "Уничтожить предателей"
BOL_dispose_of_the_traitors_desc: "Несмотря на то, что сейчас именно народ Боливии действительно главный, объединенный под социалистическим знаменем, все еще есть члены нашего общества, которые не могут меньше заботиться о благосостоянии Боливии и рабочих повсюду, мы не можем позволить им остаться, планировать революцию, охранять наше государство, избавляясь от этих предателей."
BOL_workers_industry: "Рабочая промышленность"
BOL_workers_industry_desc: "Промышленность нашей страны слабо развита и находится в плохих условиях, что является результатом плана расходов жадной элиты, и лишь обнищание честных рабочих, которые стараются изо всех сил."
BOL_revolutionary_intelligence: "Революционная разведка"
BOL_revolutionary_intelligence_desc: "Давайте найдем ИРАБ, также известного как Боливийская революционная разведка, проект для агентства, предназначенного для защиты интересов трудящихся как внутри страны, так и за ее пределами от манипуляции информацией диссидентами и реакционерами, планирующими против революции."
BOL_centralize_the_collective: "Централизация коллективов"
BOL_centralize_the_collective_desc: "В то время как вскоре после революции рабочие сформировали коллективные органы, чтобы представлять себя, такие неэффективные административные системы не нужны, вместо этого мы централизуем коллективы в государстве, чтобы создать наилучшую администрацию для рабочих."
BOL_perpetual_revolt: "Постоянная революция"
BOL_perpetual_revolt_desc: "Революционная война за трудящихся мира еще не окончена, Боливия была просто битвой, мы не можем отказаться от революции, поскольку это единственный путь вперед, мы должны принять ее навсегда и установить наше государство как маяк для нее."
BOL_marxist_education: "Марксистское образование"
BOL_marxist_education_desc: "Образовательная система нашей страны бедна и мала, что является частью плана бургуазы по сохранению неосведомленности, манипулируемости и изоляции рабочих."
BOL_defending_the_revolution: "Защита революции"
BOL_defending_the_revolution_desc: "Многие из них - наши враги, и государства, все еще находящиеся под жадным контролем элиты, чтобы защитить рабочих и принести социализм в мир, мы должны сделать все возможное и дать все, что необходимо для защиты революции."
BOL_workers_high_command: "Высшее командование рабочих"
BOL_workers_high_command_desc: "Хотя ни один человек не сильнее другого, верно, что у каждого человека есть разные черты и что-то, что он может дать обществу, некоторым из нас придется выдержать тяжелое бремя руководства высшим командованием революции, но не бояться, товарищи, как мы все это выдержим, за революцию."
BOL_from_bolivia_to_the_world: "От Боливии к миру"
BOL_from_bolivia_to_the_world_desc: "В Боливии родилось новое сердце революции, далеко от Европы и взгляда всего мира. Это шанс народа, наконец, подняться и установить новую эру, где люди побеждают в равенстве и имеют лучшую жизнь. Давайте сделаем миру одолжение и поставим себя на первый план."
BOL_bolivian_manufacturing: "Боливийское производство"
BOL_bolivian_manufacturing_desc: "Боливия никогда не была индустриальной страной, однако времена изменились, и нам необходимо переориентировать наши приоритеты, и создание новых заводов-производителей стало бы хорошим началом для нас."
BOL_bolivian_arms: "Боливийское оружие"
BOL_bolivian_arms_desc: "Времена тяжёлые, и мы должны подготовить нашу страну к любому случаю, давайте сосредоточимся на производстве оружия, кто знает, может быть, это будет полезно."
BOL_construction_investment: "Инвестирование в строительство"
BOL_construction_investment_desc: "Новые, более совершенные методы строительства являются частью того, что необходимо для наших усилий по модернизации, давайте привлечем самые свежие новости к строительству нашей нации."
BOL_roads_up_the_mountains: "Дороги вверх по горам"
BOL_roads_up_the_mountains_desc: "Каждое место, куда мы должны ехать в нашей стране, построено на горах, сердце нашей нации высоко над нами, давайте сосредоточим наши промышленные усилия на обновлении этой зоны нашей страны."
BOL_dominating_our_jungle: "Доминирование в нашем джунгле"
BOL_dominating_our_jungle_Desc: "В то время как большинство нашего населения расположено на западной стороне нашей страны, многие обещания и сокровища можно найти глубоко в наших отсоединенных джунглях, давайте сосредоточим наши усилия на открытии этой новой промышленной зоны для нашей страны."
BOL_developing_our_core: "Развитие нашего ядра"
BOL_developing_our_core_desc: "Наше горное ядро все еще имеет большой потенциал для эксплуатации и инвестиций, которые ему нужны, давайте вкладывать в его развитие, чтобы улучшить нашу будущую индустриализацию."
BOL_santa_cruz_investing: "Инвестирование в Санта-Крус"
BOL_santa_cruz_investing_desc: "Наш восточный департамент, управляемый из Санта-Круза, это золотой рудник, когда речь заходит о потенциальных инвестициях. Давайте сосредоточимся на Санта-Крузе, чтобы создать в будущем индустриальную опору."
BOL_la_paz_factories: "Фабрики &lt; &lt; Ла-Пас &gt; &gt;"
BOL_la_paz_factories_desc: "Как наша столица, Ла-Пас должно быть правильным промышленным сердцем, давайте построим как старые, так и новые фабрики в зоне Ла-Пас."
BOL_la_paz_military_complex: "Военный комплекс &lt; &lt; Ла-Пас &gt; &gt;"
BOL_la_paz_military_complex_desc: "Это трудно, к чему мы пришли, но инвестиции в новые оружейные фабрики в нашей столице могут быть именно тем, что нам нужно для сохранения нашего будущего."
BOL_santa_cruz_expansion: "Расширение Санта-Крус"
BOL_santa_cruz_expansion_desc: "Маленький свет в нашей восточной зоне, Санта-Круз, заслуживает того, чтобы его превратили в промышленную электростанцию, давайте осветим зону, построив новые фабрики в Санта-Крузе."
BOL_santa_cruz_military_complex: "Военный комплекс &lt; &lt; Санта-Крус &gt; &gt;"
BOL_santa_cruz_military_complex_desc: "Мы должны всегда быть готовы и искать новые пути защиты нашего будущего, а также развития нашей страны, что лучше, чем инвестировать в военный комплекс вблизи Санта-Круса, чтобы еще больше укрепить как промышленную зону, так и нас самих."
BOL_gathering_techniques: "Методы сбора"
BOL_gathering_techniques_desc: "Богатые многими ресурсами, они имеют основополагающее значение для нашего экономического процветания, но новые методы сбора говорят о том, что мы должны использовать наши природные дары."
BOL_artificial_processing: "Искусственная обработка"
BOL_artificial_processing_desc: "Не все наши земельные предложения удовлетворяют потребности нашей страны, к счастью, новейшие технологии позволяют нам покрыть эти пробелы в наших сильных сторонах, давайте использовать их для улучшения нашей экономики."
BOL_electronics_research: "Исследования в области электроники"
BOL_electronics_research_desc: "Более новые технологии могут быть полезны для нашей страны, не только внутри страны, но и в отношениях с другими, давайте быстро адаптировать их для нашего использования."
BOL_scientific_revamp: "Научная реампа"
BOL_scientific_revamp_desc: "Наши научные круги невелики и устарели, чтобы продвинуть нашу страну вперед, перестроить научное и интеллектуальное сердце нашей страны, привлекая новых рациональных мыслителей в Боливию."
BOL_nationalized_mining: "Национализованная добыча полезных ископаемых"
BOL_nationalized_mining_desc: "Чтобы лучше использовать имеющиеся у нас минеральные богатства, давайте национализировать горнодобывающую промышленность на скалистом сердце нашей страны, эти ресурсы были бы очень полезны."
BOL_our_eastern_reserves: "Наши восточные запасы"
BOL_our_eastern_reserves_desc: "Многие запасы природного газа находятся на восточной части нашей страны, и теперь, когда мы сосредоточили внимание на его развитии, мы находимся на первом месте в плане извлечения и использования этих новых ресурсов для себя."
BOL_lessons_of_the_chaco_war: "Уроки войны в Чако"
BOL_lessons_of_the_chaco_war_desc: "Наши вооруженные силы сильно сражались, и победа была возможной, но мы все равно сделали довольно плохо, даже до этого проклятого аргентинского вмешательства."
BOL_army_of_bolivia: "Боливийская армия"
BOL_army_of_bolivia_desc: "Способы нашей армии устарели и бесполезны, чтобы подготовиться к нашему следующему конфликту, давайте искать новый способ мышления войны."
BOL_armored_squadrons: "Бронированные отряды"
BOL_armored_squadrons_desc: "Война за Чако была первым бронированным эскадрильем, сражавшимся в Южной Америке под боливийским флагом."
BOL_rebuilding_our_infantry: "Восстановление пехоты"
BOL_rebuilding_our_infantry_desc: "Наши люди боролись, и мы многому научились, но наше пехотное снаряжение зашло в тупик, давайте обновим наше оружие, чтобы восстановить нашу пехоту."
BOL_motorized_divisions: "Моторизованные дивизии"
BOL_motorized_divisions_desc: "Зачем заставлять людей идти медленно, когда мы можем вести битву за колеса?"
BOL_mountainous_madmen: "Горные мадемуазель"
BOL_mountainous_madmen_desc: "Многие наши солдаты прожили свою жизнь над нашими горами и между их трещинами, не удивительно, что когда дело доходит до войны, наши горожане храбры и умны, когда берутся за драку."
BOL_mechanized_might: "Механизированная механизированная"
BOL_mechanized_might_desc: "Простые моторизованные линии пехоты не всегда перерезают, новые механизированные модели будут штурмовать поле боя, если мы выберем это, это может быть хорошей идеей привести эти дизайны сюда."
BOL_artillery_prowess: "Артиллерийские прелести"
BOL_artillery_prowess_desc: "Артиллерия, чтобы контролировать поле боя и сформировать наше наступление, крайне необходима, давайте направим наши усилия на обновление наших артиллерийских моделей."
BOL_support_supplies: "Вспомогательные предметы снабжения"
BOL_support_supplies_desc: "Мужчин и пистолета недостаточно для того, чтобы изготовить солдата, для превращения наших людей в храбрых воинов, давайте вкладывать средства в их запасы, чтобы лучше поддерживать их в битве."
BOL_elite_forces: "Боливийские элитные силы"
BOL_elite_forces_desc: "Некоторые говорят, что войны будущего не будут вестись на земле между простыми людьми."
BOL_integrating_the_mestizos: "Интеграция метисов"
BOL_integrating_the_mestizos_desc: "Слишком долго наше население было разделено под правлением европейских захватчиков, которые играли с нами как игрушки и исключали нас из нашего общества."
BOL_tiwanaku_plan: "План &lt; &lt; Тиванаку &gt; &gt;"
BOL_tiwanaku_plan_desc: "Сто лет до того, как появились европейские захватчики, великая империя управляла Южной Америкой непосредственно из стран вокруг озера Титикака, недалеко от ядра нашей нации."
BOL_diverse_yet_united: "Разнообразные, но единые"
BOL_diverse_yet_united_desc: "Наша земля является одной из многих культур, языков и традиций, мы не можем забыть ни одного из них, и как мы можем, на самом деле? Они настолько лучше колониальных традиций, что заслуживают сохранения. При коренной власти, они не будут забыты, наша нация разнообразна, но мы едины под одним знаменем."
BOL_anti_colonial_preparation: "Антиколоническая подготовка"
BOL_anti_colonial_preparation_desc: "Каждый день колонисты остаются на нашем континенте, оскорбляя наших предков и наш народ, и только один из нас может остаться, и мы будем готовиться к тому, что нам суждено будет быть теми, кто будет править этой землей."
BOL_from_the_past_to_the_present: "От прошлого до настоящего времени"
BOL_from_the_past_to_the_present_desc: "Защита наших истоков и традиций требует обновления новейших технологий, сейчас не время колонии, мы должны противостоять нашим врагам, по крайней мере, на равных."
BOL_ancestral_revanchism: "Реванхизм анчестров"
BOL_ancestral_revanchism_desc: "Мы были здесь первыми, Миллениа прошла мимо с нашими предками, правящими своей судьбой, пока европейцы не пришли и не порезали нас по их воле, как игрушки, весь континент принадлежит их коренному народу! Мы не можем позволить этой трагедии продолжаться дольше, наши духи не успокоятся, пока южная Америка не будет доставлена к своим законным правителям."
BOL_authocthonous_economy: "Автохтонная экономика"
BOL_authocthonous_economy_desc: "Власть нации была разделена и управлялась издалека колониальной элитой, с ее уходом, мы наконец-то можем создать центральное правительство коренного происхождения, достаточно мощное для того, чтобы принести нам наше право рождения, и новую экономическую модель, которая вместо того, чтобы помогать колониальным интересам, фактически вознаграждает наш благородный народ."
BOL_recovering_our_continent: "Восстановление нашего континента"
BOL_recovering_our_continent_desc: "Мы слишком много страдали и больше не можем это терпеть, пришло время объявить континенту, что его истинный владелец возвращается, и колониям больше не место ни в Авя-Яле, ни в Америке."
BOL_the_endemic_coast: "Эндемическое побережье"
BOL_the_endemic_coast_desc: "Ах, милый Тихий океан, наш народ жил в мире и думал о вас долгое время, то есть, пока европейцы не прибыли из моря и не забрали у нас все."
BOL_recover_the_coast: "Восстановить побережье"
BOL_recover_the_coast_desc: "Время окончено, давайте объединим Квлов с морем, время для войны!"
BOL_second_war_for_chaco: "Вторая война за Чако"
BOL_second_war_for_chaco_desc: "Если бы не колониальная некомпенсация в войне, то еще одна часть нашего права при рождении могла бы быть в наших руках сейчас."
BOL_the_imperial_territories: "Имперские территории"
BOL_the_imperial_territories_desc: "Когда они объединились под имперским знаменем, анды всегда были ядром в Южной Америке, они были для Тиванаку, они были для инканцев. Давайте распространим наши претензии на эти имперские территории, чтобы лучше уладить наши позиции как правителей континента."
BOL_unite_the_quechua: "Объедините кечуа"
BOL_unite_the_quechua_desc: "Благородная кечуа, важная часть Южной Америки, живет как на нашей земле, так и на перуанской земле, но там они все еще страдают от колониального правления."
BOL_support_the_workers_of_chile: "Поддержка трудящихся Чили"
BOL_support_the_workers_of_chile_desc: "В Чили можно найти много честных рабочих, которые знают о своем положении, однако бургуазы и многочисленные популисты взяли под контроль свое общество, давайте поддержим рабочих в их борьбе."
BOL_support_the_workers_of_peru: "Поддержка работников Перу"
BOL_support_the_workers_of_peru_desc: "Народ Перу по-прежнему контролируется очень сильным заведением, которое не позволяет им уйти, благородные работники АПРА непрестанны, и не сдадутся, пока не отдадут Перу народу. Давайте поддержим эту амбициозную и многообещающую авангардистскую группу, так как они лучше для Перу."
BOL_compromise_with_argentina: "Сочетание с Аргентиной"
BOL_compromise_with_argentina_desc: "Война Чако по-прежнему является открытой раной в нашем народе, но пока Тариджа находится в аргентинских руках, эта рана, которая держит наши штаты порознь, не может зажить. Но компромисс с Аргентиной, для рабочих может быть полезен, давайте посмотрим, готовы ли они к переговорам."
BOL_recover_tarija_for_the_workers: "Возвращение Тариджи для рабочих"
BOL_recover_tarija_for_the_workers_desc: "Наш народ по-прежнему страдает от раны войны Чако, даже если мы ничего не выиграли, неотъемлемая часть нашей основной территории покинула наше владение, и благородные боливийские рабочие все еще живут там."
BOL_spread_the_revolution_to_chile_desc: "В то время как многие рабочие проснулись и борются за равенство, правительство Чили до сих пор не поддалось международной истине."
BOL_spread_the_revolution_to_chile: "Распространить революцию на Чили"
BOL_spread_the_revolution_to_peru: "Распространить революцию на Перу"
BOL_spread_the_revolution_to_peru_desc: "Перуанская республика подвела свой народ слишком долго, мы не можем позволить им и дальше уходить от того места, где их сердце действительно находится, давайте вмешаемся и доставим Перу революцию, которую так отчаянно хотят ее люди!"
BOL_bring_chaco_back_to_the_workers: "Возвращай Чако к рабочим"
BOL_bring_chaco_back_to_the_workers_desc: "В то время как боливийские рабочие Чако были немногочисленны, они страдали от ужасной хунты правителя Парагвая. Давайте освободим их и исправим то, что когда-то пошло правильно, когда-то было неправильно."
BOL_andean_airways: "Воздушные пути Андского региона"
BOL_andean_airways_desc: "С высоты и выше мы контролируем всю Южную Америку, сейчас пришло время взять контроль над воздухом только до которого мы можем добраться, из нашего ядра в Андах."
BOL_shielding_from_above: "Щиты сверху"
BOL_shielding_from_above_desc: "Как бы мы ни чувствовали себя в безопасности и удаленными, далеко от того места, где живут наши враги, новые воздушные технологии сделали нас более уязвимыми, чем когда-либо, мы должны подготовиться к защите нашей страны от любой угрозы."
BOL_preparing_our_wings: "Подготовка крыльев"
BOL_preparing_our_wings_desc: "Мы должны сосредоточиться не только на своей воле, но и на подготовке нашей страны к тому, чтобы удерживать и контролировать военно-воздушные силы."
BOL_flying_tactics_desc: "Различные самолеты выполняют различные роли на поле боя, давайте займёмся этими специализированными самолетами, чтобы разработать новую авиационную тактику."
BOL_flying_tactics: "Летающие тактики"
BOL_uniting_our_nation: "Объединение нашей нации"
BOL_uniting_our_nation_desc: "Наша богатая и великая география слишком долго разделяла настоящих боливийцев, давайте построим новые дороги и дороги, которые, наконец, свяжут наших людей и позволят нам еще больше централизовать наше правление."
BOL_bolivian_fighters: "Боливийские бойцы"
BOL_bolivian_fighters_desc: "Скоро все услышат и узнают о страшных боях Боливии, правящих воздухом."
BOL_raid_their_coasts: "Стрелять по их берегам"
BOL_raid_their_coasts_desc: "В то время как наша естественная сила позволила нам выжить без них, наши враги не такие, как мы, если мы нападем и бомбардируем их побережья, это сильно ранит их."
BOL_aerial_expertise: "Воздушный опыт"
BOL_aerial_expertise_desc: "Мы больше не новички в полетах, наши воздушные силы накопили определенный опыт, который, несомненно, поможет нашим усилиям и заставит нас появиться над нашими врагами, когда они меньше этого ожидают."
BOL_further_winds: "Дальнейшие ветры"
BOL_further_winds_desc: "Горизонт широко открыт и далек, еще многое предстоит узнать, открыть и усовершенствовать, и Боливия будет находиться на переднем крае воздушных инноваций."
BOL_retake_tarija: "Возвращение Тариджи"
BOL_retake_tarija_desc: "Как бы много ни было наших потерь и неудач при старом режиме, никто не чувствует себя более болезненным и более обидным, чем последний раз, когда несколько лет назад воровство Тариджи было совершено, истинные боливийцы жестоко подавляются, а наш народ разъединяется, как это делают колониальные правители Аргентины, и пришло время раз и навсегда освободить Тариху."
BOL_pact_with_argentina: "Пакт с Аргентиной"
BOL_pact_with_argentina_desc: "Работая вместе и будучи окруженными врагами, наши социалистические государства логичны объединить силы, чтобы защитить и распространить революцию, давайте предложим этому международному альянсу рабочих в Аргентину, конечно, они одобрят эту идею."
BOL_workers_congress_of_bolivia: "Конгресс трудящихся Боливии"
BOL_workers_congress_of_bolivia_desc: "Прошло четыре года с тех пор, как революция пришла в Боливию, когда мы поселились и защищали революцию, появились новые идеи и обсуждается направление нашего союза, как такой конгресс, где рабочие смогут обсудить путь Боливии."
BOL_maintaining_the_revolution: "Продолжать революцию"
BOL_maintaining_the_revolution_desc: "По мере того, как революция оседает, многие призывают расслабиться у наших лидеров и начать шаг вперед, оставив революционный процесс позади. Это ошибка, поскольку единственный путь достижения социалистических идеалов - это огонь революции, и хотя многие удовлетворены и довольны, мы не можем отпустить этот дух, все должно быть сделано для поддержания революции, так как мы будем ее авангардом!"
BOL_vanguard_directed_economy: "Промышленность с повышенным риском"
BOL_vanguard_directed_economy_desc: "По мере оценки промышленного развития нашей страны, ведущий авангард обнаружил, что этого не хватает в определенных отношениях, для дальнейшего развития положения трудящихся, мы должны сделать больший акцент на промышленности, и будут построены новые фабрики."
BOL_state_economic_plan: "Государственный экономический план"
BOL_state_economic_plan_desc: "Когда мы вступаем в новую стадию нашей революции, экономика нашей страны претерпела много изменений, хотя мы не можем знать, чего от нее ожидать, наш главный авангард разработал план, контролируемый государством, который, по их мнению, поставит будущее под контроль рабочих."
BOL_revolutionary_industries_desc: "В соответствии с диктуемым курсом, часть идеологии принадлежит работникам, а другая - работникам, и она должна служить революции, солидаризироваться с работниками во всем мире, и они нуждаются в нас, чтобы помочь их делу."
BOL_revolutionary_industries: "Революционная промышленность"
BOL_further_centralization: "Дальнейшая централизация"
BOL_further_centralization_desc: "В нашем штате по-прежнему существует большая автономия, которая может лучше служить народу, если она управляется государством, давайте проводить дальнейшие реформы централизации с этой целью."
BOL_peoples_state: "Народное государство"
BOL_peoples_state_desc: "Долгое время распад государства и создание социалистической утопии были мечтой в наших мыслях, которая направляла нас. Однако практика научила нас тому, что эта мечта почти полностью вне нашей досягаемости. Это не значит, что мы перестанем стремиться к утопии рабочих."
BOL_collectivist_revolutionaries_desc: "Теперь умеренные социалистические принципы, под знаменем коллективизма, показали, что они пользуются поддержкой трудящихся, и в то же время, когда мы стремимся к совершенствованию нашего солидарного, коллективного общества, создавая прочную политическую систему, ортодоксальные социалистические идеи будут направлять нашу страну."
BOL_collectivist_revolutionaries: "Коллективисты-революционеры"
BOL_collectivized_farms: "Коллективные фермерские хозяйства"
BOL_collectivized_farms_desc: "Давайте придадим импульс развитию сельского хозяйства Боливии за счет коллективизации владения фермами, распределения их через наше фермерское население, что позволит им лучше управлять ими и увеличить заготовленную площадь."
BOL_collectivist_economy: "Коллективистская экономика"
BOL_collectivist_economy_desc: "Распространяя реформы в области коллективизации всей нашей экономики, мы сможем расширить продуктивные и административные блага для всех слоев нашего общества, обеспечивая экономическое благополучие Боливии."
BOL_political_checks: "Политические проверки"
BOL_political_checks_desc: "Общество должно быть создано трудящимися и для них, даже если некоторые люди будут уделять больше внимания производительным усилиям, а некоторые - более политическим, административным усилиям, мы должны установить контроль за тем, чтобы политический аспект нашего общества не укреплялся каким бы то ни было образом, давая им больше власти, в которой они нуждаются, скорее, они пройдут через проверки, которые обеспечат, чтобы политическая власть служила работникам повсюду."
BOL_proletariat_democracy: "&lt; &lt; Пролетариат Демократия &gt; &gt;"
BOL_proletariat_democracy_desc: "Наше общество является широким, и есть много мнений о том, как осуществлять социалистические принципы, которыми мы будем руководствоваться."
BOL_workers_republic: "Рабочая Республика"
BOL_workers_republic_desc: "Много лет назад умерла старая, коррумпированная, олигархическая республика."
BOL_social_autonomism: "Социальная автономия"
BOL_social_autonomism_desc: "Идея о прочном обществе в соответствии с социалистическими принципами, но в то же время автономный подход рабочих к нашим идеалам доказал свою популярность на конгрессе, так как новые автономисты поднимаются, чтобы привести нашу страну к более прямому социалистическому пути, рожденному от рабочих, находящихся в низовьях шкалы."
BOL_devolve_to_the_provinces: "Подавить власть в провинции"
BOL_devolve_to_the_provinces_desc: "Центральное государство - это не лучший способ управления нашей страной, а, скорее, путем передачи политической власти и принятия решений небольшим общинам, как и наши провинции, мы можем обеспечить, чтобы работники в этой стране лучше управляли в соответствии с их потребностями."
BOL_local_defense_preparation: "Подготовка местных защитников"
BOL_local_defense_preparation_desc: "Осознавая, что этот мир опасен и враждебн по отношению к нашим социалистическим идеалам, мы должны подготовиться к тому, чтобы защитить себя и рабочих от реакционеров."
BOL_popular_syndicates: "Популярные синдикаты"
BOL_popular_syndicates_desc: "Вводя идею организации в синдикатах, которые представляют пожелания трудящихся в высшем совете, мы можем реализовать систему, которая более правильно отражает пожелания людей, не блокируя их собственную политическую свободу."
BOL_social_commune: "Социальная община"
BOL_social_commune_desc: "Больше, чем центральное государство, мы объединились в коммуну, сформированную социализмом, союз трудящихся в их собственной автономии, правящей над собой на равной и солидарной основе, действительно близкой к социалистическим идеалам, насколько это возможно."
BOL_workers_unity: "Единство трудящихся"
BOL_workers_unity_desc: "На протяжении длительного времени, даже когда работники Боливии вели одну и ту же борьбу, они встали на этот путь и объединились против тирании старой, наша страна никогда не была такой единой."
BOL_striving_forward_desc: "По мере того как мы смотрим в будущее с надеждой, мы знаем, что наши мечты будут реализованы только при условии достижения прогресса и сосредоточения внимания на новаторстве."
BOL_striving_forward: "Вперёд"
BOL_workers_pride: "Гордость трудящихся"
BOL_workers_pride_desc: "Каждый год наши рабочие не могут забыть о нашей победе против тиранической олигархии, которая правила Боливией."
BOL_death_of_the_general: "Смерть генерала"
BOL_death_of_the_general_desc: "День скорби в Сюй, как наш великий и мудрый лидер Сантос"The General of the Natives" Marka T'ula has passed away. Living for seventy years, fighting against the colonial oppression, he was able to finally free Wuliwya a few years ago."
BOL_piqichiri_nina: "Пикичири Нина"
BOL_piqichiri_nina_desc: "Храбрый и молодой местный повстанец Эдуардо Нина Киспе, обладающий большой популярностью среди простых людей и большой харизмой, взял власть в пустоте, оставшейся после смерти Марка."P'iqichiri", or leader, in Aymara, and has promised to further centralize and industrialize the nation to further the indigenist cause in the continent."
BOL_military_autonomies: "Военный автономизм"
BOL_military_autonomies_desc: "У нашего Пикичири есть идея, давайте дадим воинам, которые управляют провинциями Суйю, большую военную автономию, мы можем улучшить создание спонтанной тактики внутри различных подразделений наших вооруженных сил."
BOL_industrialize_the_suyu: "Индустриализация &quot; Сюй &quot;"
BOL_industrialize_the_suyu_desc: "В то время как большинство нашего населения чувствует себя как дома с аграрным акцентом, только сельское хозяйство не удовлетворяет постоянно растущие потребности нашего постоянно растущего Сью, вместо этого государство осуществит новые планы индустриализации, которые увеличат автоархат нашей нации."
BOL_native_corporatism_desc: "Необходимо создать надлежащую экономическую систему для Сюй, разделив наше общество на производительные части всех различных этнических групп, которые соответствуют нашей нации, и установив связи между ними и центральным государством Сюйю, мы сможем лучше управлять удовлетворением наших экономических потребностей."
BOL_native_corporatism: "Корпоратизм коренного населения"
BOL_loyalty_to_the_piqichiri: "Лояльность P'ikirichi"
BOL_loyalty_to_the_piqichiri_desc: "И хотя мы понимаем, что перемены сложны, а традиции имеют огромное значение, единственный способ защитить свое наследие - это социальные, экономические и политические перемены, только тогда наше наследие сможет восторжествовать."
BOL_declare_true_national_rebirth_desc: "С тех пор, как колонисты прибыли столетия назад, наш истинный народ был угнетен и в цепи, даже когда они ушли, их влияние все еще проклинало наше общество, начиная с его политической системы."
BOL_declare_true_national_rebirth: "Объявить истинное национальное возрождение"
BOL_the_great_suyu: "Великая Сью"
BOL_the_great_suyu_desc: "Вуливия поднялся, как великий Суйю, возвысившись над тенью, которой было предыдущее колониальное государство, мы стоим на восторжествии, как истинное правительство этого континента."
BOL_future_of_awya_yala: "Будущее Авы Ялы"
BOL_future_of_awya_yala_desc: "Этот великий континент, Авия Яла, является нашим родным домом и нашим наследием. Мы не можем не признать тот факт, что этот прекрасный континент был слишком долго отброшен назад, что делает его слабее к иностранным флуктуациям. В том же смысле мы найдем Академию науки Авия Яла, так же, как мы собираемся привнести нашу родину в будущее."
BOL_integrate_the_quechua: "Интегрировать кечуа"
BOL_integrate_the_quechua_desc: "Теперь, под защитой нашего государства, наши кечуа-братья больше не будут подчиняться колониальному ярмо."
BOL_resettle_the_coast: "Переселить побережье"
BOL_resettle_the_coast_desc: "Давно напуганные колониями, распространяющие свое влияние и народ и толкающие амара, пришло время переселить нашу любимую береговую линию."
BOL_paratrooper_strategy: "Стратегии действий парашютистов"
BOL_paratrooper_strategy_desc: "По мере развития технологий поле боя на суше и в небе сливаются, сейчас, как никогда, благодаря десантникам, мы можем напрямую связать их."
BOL_rocketry_technology: "Рокетные технологии"
BOL_rocketry_technology_desc: "Ракеты, снаряды, движущиеся, это технология, которая поможет нам контролировать небо, или даже больше, если мы используем его правильно."
BOL_war_medicine: "Военно-временная медицина"
BOL_war_medicine_desc: "Однако в боевых действиях, раны или что еще хуже - это стандарт жизни наших людей и, что более важно, их способности продолжать боевые действия."
BOL_battle_engineering: "Боевая инженерия"
BOL_battle_engineering_desc: "Во время битвы не только стратегии, но и движущие силы наших солдат принимают решение о исходе, поэтому крайне важно адаптировать наши силы к планам наших оппонентов и к условиям боя, и поэтому нужны инженерные войска."
BOL_mastering_warfare: "Популяризация войны"
BOL_mastering_warfare_desc: "Возможно, у нас не было лучшей траектории в истории, когда дело доходит до боя, но мы заслужили так много опыта, так много уроков, что наконец-то освоили войну."
BOL_sea_redeemed: "Море спасено"
BOL_sea_redeemed_desc: "Мы наконец-то вернули море, драгоценный источник жизни, наследие нашего народа, украденное у нас нашими врагами, как стервятники."
BOL_birth_of_the_fleet: "Рождение флота"
BOL_birth_of_the_fleet_desc: "Каждой стране нужен флот, чтобы управлять своим морем."
BOL_antofagasta_ports: "Порты Антофагаста"
BOL_antofagasta_ports_desc: "Антофагаста, сладкая жемчужина нашего побережья, будет местом больших портов, из которых Боливия покажет миру свою любовь к морям."
BOL_the_way_of_the_sea: "Морской путь"
BOL_the_way_of_the_sea_desc: "Море - это не только место мира, это место, где ведётся война, где мы должны защищаться и защищаться от наших врагов, поэтому мы должны управлять путями морской войны, чтобы спасти наше море."
BOL_the_men_of_the_sea: "Люди моря"
BOL_the_men_of_the_sea_desc: "Морские пехотинцы, люди, владеющие искусством ведения боевых действий, но любящие море, являются сутью того, за чем должна стремиться Боливия, когда речь идет о войне."
BOL_destroyers_galore: "Разрушители Галоре"
BOL_destroyers_galore_desc: "Быстрые и могущественные эсминцы, сопровождающие корабли, которые упаковывают удар, это то, что нам нужно, чтобы заполнить наш флот."
BOL_cruisers_to_protect: "Круизные круизы для защиты"
BOL_cruisers_to_protect_desc: "Крузеры - чудо морской инженерии, давайте сосредоточимся на совершенствовании технологии крейсеров."
BOL_battleships_inbound: "Боевые корабли"
BOL_battleships_inbound_desc: "Сосредоточение наших усилий на боевых кораблях покажет миру величество нашей великой морской традиции."
BOL_carrier_coming: "Прибытие перевозчика"
BOL_carrier_coming_desc: "Когда дело доходит до кораблей, мощные базы, известные как Карьеры, являются последними, когда речь заходит о проекции энергии, и действительно современным чудом. Давайте сосредоточим наши усилия на них."
BOL_amphibious_warfare: "Беспощадная война"
BOL_amphibious_warfare_desc: "Амфибийные корабли, разносторонние и способные пересечь флот и армию, являются хорошим дополнением к нашему флоту."
BOL_submarine_emphasis: "Упор на подводные лодки"
BOL_submarine_emphasis_desc: "Тайный и разрушительный, большой флот подводных лодок может уничтожить наших врагов и обеспечить защиту нашей береговой линии."
BOL_destined_to_rule_the_seas: "Предназначено для управления морями"
BOL_destined_to_rule_the_seas_desc: "Мы пришли, чтобы показать им свою любовь к морям и заботу о них, а также то, что мы гордая морская страна, которой суждено править морями."


#events

bol.3.t: "Положение Боливии"
bol.3.d: "Это было более ста лет назад, когда колонисты и метисы, служащие под испанской империей, устали от жестокого правления элиты над ними и инициировали восстание Оруро. Еще раз, этот мятежный дух слышен в сердцах всех боливийцев. Менее года назад успех и искупление были так близки к нашей власти во время войны в Чако, пока внешние силы не лишили нас нашего шанса на победу, а также наших южных провинций, и наш народ продолжает подвергаться пыткам из-за несчастья, постигшего всю Южную Америку. Наш народ дал все, что он мог, и все же мы их подвели. Есть ли еще надежда на мир и доверие, чтобы родиться снова в Боливии? Или мы наконец-то на последней ноге?"
bol.3.a: "Ничего хорошего из этого не выйдет..."

bol.1.t: "Революция в Боливии"
bol.1.d: "Не было для кого-либо загадкой провалов нашего правительства перед нашим народом. Мы потеряли из-за границы и внутри страны, Аргентина лишила нас нашей победы в войне Чако, в то время как рабочие не получают заработной платы или безработные, и все видят, что мы находимся на нашей нижней точке. Сегодня боливийский народ сказал, что больше нет. Несмотря на то, что улицы Ла-Паса красны, международное движение рабочих, известное как социализм, взяло курс на лучший путь, нет места элите и ее собственным интересам! Сегодня Боливия для простого человека! Новая Боливия, все люди, независимо от их происхождения, наконец, могут быть равны! Похоже, что революция наконец-то пришла."
bol.1.a: "Работники Боливии и скоро мир объединятся!"
bol.1.b: "Это не может так закончиться, мы должны остановить их!"

bol.2.t: "Революция приносит плоды"
bol.2.d: "Борьба была трудной, но она стоила каждой минуты, каждый век страданий под буржуазной диктатурой. Но этой несправедливости больше нет. Революция восторжествовала сегодня. Как бы элита не хотела относиться к нам как к игрушкам, как к объектам прибыли, а не как к человеческим существам, они пали сегодня, старый порядок исчез!. Проснись, Боливия, подъем, рабочие! Боливия - это сердце Южной Америки, и это не удивительно, что это и сердце революции. Не будет больше неравноправия и страданий, так как народ, объединенный, будет победителем! / / Новый режим, коалиция различных идеологических социалистов под руководством харизматического активиста Карлоса Салазара Мостахо, создана, обещая новую эру для работников в Боливии."
bol.2.a: "Сегодня, Боливия, завтра, мир, революцию не остановить!"

bol.4.a: "Перед нами, Южной Америкой, твои настоящие правители вернулись!"
bol.4.t: "Революция... провалилась?"
bol.4.d: "Давно мы боролись, многие были революционерами, с которыми мы сражались, а теперь красные — улицы, но Боливия не является и не будет красной, так как старый порядок преуспевает! Или так и будет. Битва оставила нас неподготовленными, и быстро они пришли, большие по количеству, скандировали на своем незнакомом языке, и они разорвали нас. Сегодня красные, возможно, упали, но и колониалы, старая элита. Коренные народы Боливии, объединенные под общим знаменем, наконец, восстали, они стояли и выдержали, когда пришел испанец, и они относились к ним как к меньшему, и они стояли и переносили, когда Боливия получила независимость, и они получили такое же обращение, никаких прав, ничего. Ну теперь столы поворачиваются, и захватчики должны уйти сейчас! Цикки Боливии, восстали, под головой Санто Марка Тулы, и ни один колониальный дьявол не был допущен в наших странах, мы были здесь первыми, и мы будем последними здесь!"

bol.9.t: "Социалисты, поддерживаемые Боливией!"
bol.9.d: "Радикальные социалисты и другие левые партии, такие как Партия Комуниста, недавно стали очень активными в политическом порядке Чили, создавая помехи в том порядке, в котором было наше общество. Все доказательства указывают на то, что Боливия финансирует эти экстремистские группы, мы не можем просто позволить им сделать это."
bol.9.a: "Почему мы до сих пор позволяем Боливии встать?"
  
bol.10.t: "АРА поддерживается Боливией!"
bol.10.d: "Экстремисты АПРА, которые оказывали влияние на нашу страну или пытались сделать это в течение последних лет, вновь поднялись на пик своей деятельности, люди, спускающиеся по улицам в своей поддержке, расширились."
bol.10.a: "Мы не можем мириться с внешними агентами, влияющими на нашу внутреннюю политику."

bol.11.d: "С тех пор, как несколько лет назад произошла война в Чако, отношения между нашими странами оказались напряженными, однако сейчас, как никогда ранее, мы вынуждены требовать сотрудничества друг с другом, учитывая наши новые социалистические взгляды."Us the proletariat must unite against the bourgouise" they say. While we can't help but to agree, there is something they insist on. Their southern province of Tarija has been on our hands for a while, and we can't cooperate as long as it clouds our diplomatic outlook with Bolivia. Should we give it back?"
bol.11.t: "Компромисс с Боливией?"
bol.11.a: "Конфликты, создаваемые буржуазой, не могут разлучить рабочих, давайте вернем Тариджу."
bol.11.b: "Благородные работники и люди из Аргентины боролись за это, увы, жаль, что мы не можем работать вместе."

bol.12.t: "Аргентина отказывается сотрудничать"
bol.12.d: "Аргентина безрассудно отказалась от возврата нашей ключевой провинции, очевидно, что националистические устремления в их правительстве должны затуманивать то, что могло бы стать столпом для работников Южной Америки."
bol.12.a: "Если Аргентина не стоит за рабочих, то и мы, и нам нужно вернуть Тариджу."
bol.12.b: "Думаю, мы должны постоять в одиночестве за пролетариата, по крайней мере, пока."

bol.15.t: "Альянс с Боливией?"
bol.15.d: "Наши товарищи-боливисты предложили нам объединить силы, чтобы защитить рабочих от реакционеров, которые пытаются затопить революцию и которые до сих пор злоупотребляют рабочими в своих странах."
bol.15.a: "Сегодня новая стадия революции начинается в Южной Америке."
bol.15.b: "Возможно, это не самое мудрое решение."

bol.16.t: "Смерть Марка Т'улы"
bol.16.d: "Горе поразило нас как нашего возлюбленного и мудрого наставника, вождь и генерал Сантос Марка Т'ула скончался во сне и сегодня утром найден мертвым. Он прожил долгую жизнь, борясь за права тех, кого они забрали. Коренные жители этого континента, Уливии. Несмотря на то, что мы скорбим об этой потере, политическая структура нашей нации не отдыхает, так как молодой и популярный Эдуардо Нина Киспе восстала, чтобы взять на себя руководство нации, обещая перемены и укрепление нашей нации."
bol.16.a: "Мы должны продолжать."

bol.17.t: "Эдуардо Нина Киспе объявила Пикичири"
bol.17.d: "Как Сюй ощущает потребность в сильном лидере, как была только мудрая Марка, харизматичный Эдуардо Нина оказался в окунии, вознося себя,"P'iqichiri", or leader, as we call him. As part of his leadership, he proposes further centralizing the power of the suyu, to be better at directing our nation into a path of success at glory, as well as bringing progress while still keeping traditions in mind."
bol.17.a: "Чамачанья!"

bol.19.t: "Конгресс трудящихся 1940 года"
bol.19.d: "Прошло четыре года с тех пор, как революция дошла до Боливии, когда мы обосновались и отстаивали революцию, в это время появились новые идеи, и сейчас обсуждается направление нашего союза, как такой конгресс, на котором рабочие смогут обсудить путь Боливии, будущее социализма в Боливии должно быть определено сейчас."
bol.19.a: "Для рабочих и для них!"

bol.20.t: "Фионы в Конгрессе"
bol.20.d: "По мере прибытия рабочих со всей страны были сформированы три основные фракции, которые будут активно направлять Боливию в соответствии с социалистическими принципами для трудящихся и с их участием. / nnFirst, видный революционер Тристан Мароф накопил заметный след, поскольку он защищает принципы постоянной революции и использование центрального государства в качестве инструмента для поддержания и распространения этой революции, который будет активно направлять Боливию в выполнении социалистических принципов для трудящихся. Политика, подобная дальнейшей индустриализации и милитаризации, вытекает из идеологии этой фракции. //, с другой стороны, более умеренные рабочие воссоединились вокруг д-ра Хосе Антонио Арзе, который предлагает коллективистскую систему, в которой государство возглавляет осуществление социализма, при этом рабочие советы по-прежнему играют важную роль демократической политической структуры для укрепления воли трудящихся. ~ наконец, нынешний председатель республики Карлос Мостахо сформировал новую политическую фракцию, отделенную от правящей коалиции, поскольку он желает сохранить власть и осуществить радикальные новые реформы, предоставляя местную автономию и более прямую демократическую политику, которая, по его словам, ближе к истинным принципам социализма."
bol.20.a: "Конгресс избирает Марофа в качестве нового председателя."
bol.20.b: "Конгресс выбирает Арзе в качестве нового председателя."
bol.20.c: "Конгресс выбирает Мостахо для сохранения своей позиции."

bol.30.t: "Празднование нового года в Тиванаку"
bol.30.d: "По мере того, как наш народ начинает переосмысливать наши старые традиции, теперь освободившись от досягаемости колониалов, старые праздники, которые должны были быть скрыты так долго, теперь открыты и для всех, чтобы увидеть. ~ Несмотря на то, что самый выдающийся новый год празднуется в зимнее солнцестояние, в конце июня, как в соответствии с нашими традициями, мы воссоединились в старых руинах Тиванаку. В то время как мы все стояли в круге, амутасы – аймара шаманы – соорудили костер и сделали приношения, такие как сушеный плод ламы, для хорошего здоровья и состояния. Они призывают Пахамаму и Пачакаму благословить нас, и мы благодарим солнце, когда наступает восход солнца."
bol.30.a: "Солнце снова благословляет Сью!"

bol.40.t: "Новый цикл революции"
bol.40.d: "Уважаемый и уважаемый председатель Мароф только что сделал новое объявление, в рамках своих реформ, наша страна, рабочие, мы достигли нового пика в нашем пути к марксистскому раю. Однако, по прошествии многих лет, революция осела, и многие рабочие потеряли революционный дух, который свел нас к началу. Так что должна начаться новая эра революции. По мере того, как народная армия проходит по улицам под руководством Председателя, мы вновь доставим революцию к каждому гражданину и всему миру!"
bol.40.a: "К лучшему или к худшему."
bol.40.b: "Да здравствует революция!"

bol.41.t: "Политическая оппозиция арестована"
bol.41.d: "По мере того, как государственные полицейские органы увеличивают свои размеры и активность, внезапно происходит арест видных деятелей оппозиции правительству Марофа. Обвинения? Измена. Похоже, оппозиция и их планы покончить с реформами Марофа были восприняты нелегко, вместо того чтобы быть предательством революции и рабочих."
bol.41.a: "Предатели здесь не допускаются."
bol.41.b: "Это неправильно."

bol.42.t: "Празднование революции"
bol.42.d: ""We have come very far. The workers struggled for too long, the people suffered the abuse of the elite, yet we have come to this. Today, we can look at each other with equality, with solidarity, recognizing our brothers, the bonds we share. Together, we made this happen, we founded this new republic, this socialist union of workers that is leading us towards the Marxism paradise, and we won't ever stop!"\n\nThe crowds cheered on after Chairman Arze's speech. We truly have achieved great things."
bol.42.a: "Приятно делать добро."

bol.43.t: "Рождение коммуны"
bol.43.d: "Социализм распространяется во всех слоях нашего общества, но он не был навязан, он был распространен и принят с миром и солидарностью. Так заявил председатель Мостахо в своей речи. Мы не создали эту республику как средство достижения цели. Социализму и общему благу. Мы добились хороших успехов в этом деле, но этого недостаточно, нужно изменить. Сегодня мы провозглашаем рождение коммуны Боливии, где трудящиеся могут править в условиях автономии и равенства, не посягая на социализм, и социализм будет сдвинут с низу!"
bol.43.a: "Для рабочих!"
bol.50.t: "Боливия захватывает Акре!"
bol.50.d: "Используя ситуацию, в которой мы оказались, экстремистский индигенистский режим, правящий Боливией, решил, демонстрируя агрессию, захватить Акре с военной точки зрения, отправив свои войска для аннексии незащищенной зоны и эксплуатируя гражданскую войну."
bol.50.a: "Отдай им его, пока что."
bol.50.b: "Мы не можем этого допустить."
bol.51.t: "Помощь боливийского Пролетариата"
bol.51.d: "Проявление солидарности, рабочие Боливии объединились и решили послать помощь своим товарищам, нам. Несмотря на то, что они прислали, это по-настоящему показ связей, которые удерживают пролетариата вместе, за пределами границ."
bol.51.a: "Очень мило!"

bol.100.t: "Судьба Чили"
bol.100.d: "Сейчас, когда победа поступила в наши законные руки, нам еще предстоит принять решения. Теперь, когда Чили находится под нашим контролем, мы должны принять решение о нашей политике оккупации. Большинство советов утверждают, что мы непосредственно управляем законными берегами Атакамы, предоставляя южную часть страны мапуче, которая имеет историю восстания против колониальных держав, может стать достойными союзниками и иметь права на владение этой землей. Однако другие считают, что Южная Америка должна быть непосредственно управлена нашим государством и не должна разделяться, поскольку европейцы нас разделяют. Меньшинство все еще, похоже, готово сохранить чилийское правительство в качестве своего собственного, но твердое под нашим контролем."
bol.100.a: "Возьмем нашу законную землю и освободим мапуче в качестве союзников."
bol.100.b: "Возьмем нашу законную землю и возьмем под свой контроль хилианское правительство."
bol.100.c: "Мы должны управлять землей напрямую."

bol.101.t: "Судьба Чили"
bol.101.d: "Красные флаги махали, когда наша армия вошла в Сантьяго, у чилийского пролетариата есть все основания для того, чтобы отпраздновать, так как о бургуазе позаботились, и они наконец могут принять Революцию."
bol.101.a: "Освобождайте социалистическое государство в Чили."
bol.101.b: "Прямое правило принесет большую пользу международной революции."

bol.102.t: "Судьба Парагвая"
bol.102.d: "Как и ожидалось, парагвайцы не могли терпеть силу наших воинов, и они чувствовали себя в наших руках. Теперь пришло время решить, что с ними делать. Как бы ни было, гуарани уже давно стоят под колониальным ботинком, сохраняя свои традиции и воспоминания. Справедливо дать им шанс искупить себя в качестве наших союзников, свободных от колониального контроля. Однако возможность дальнейшего расширения наших непосредственно управляемых земель, безусловно, привлекательна."
bol.102.a: "Учредить штат Гуарани в качестве дружественного правительства."
bol.102.b: "Нынешняя ситуация в Парагвае не так плоха, сохранить свое правительство."
bol.102.c: "Прямое правление от Чуки Япу до Парагвая."

bol.103.t: "Судьба Парагвая"
bol.103.d: "Красные толпы маршировали, когда наша армия въехала в Асунсьон, у рабочих Парагвая есть все основания для того, чтобы отпраздновать, поскольку о бургуазе позаботились, и они наконец могут принять Революцию."
bol.103.a: "Освобождайте социалистическое государство в Парагвае."
bol.103.b: "Прямое правило принесет большую пользу международной революции."
