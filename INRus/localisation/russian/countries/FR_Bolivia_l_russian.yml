BOL_BCW_gambits: "Влияние на гражданскую войну в Бразилии"
BOL_BCW_gambits_desc: "Бразилия, южноамериканский гигант, разорвана на куски, поскольку ее внутренняя борьба разделила свою страну на воюющие стороны."
BOL_seize_acre: "Схватить акр"
BOL_seize_acre_desc: "Давным-давно проигранная продажа, навязанная бразильским давлением, земля Акре является фундаментальным куском Амазонок, красивых южноамериканских джунглей, и должна управляться ее истинными владельцами. Теперь Бразилия разделена, и они не смогут реагировать, если мы захватим Акре. Кто бы там ни жил, он был бы благодарен за освобождение от марксистского ярма, в любом случае."
BOL_help_brunion: "Поддержка Союза Бразилии"
BOL_help_brunion_desc: "Отважные товарищи в Бразилии восстали против олигархии, но на них нападают реакционные силы."



