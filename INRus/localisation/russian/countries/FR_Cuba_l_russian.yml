 ### Characters ###
 CUB_lazaro_pena_gonzalez: "Лазаро Пенья Гонсалес"
 #CUB_lazaro_pena_gonzalez_country_leader: "Молодой Лазаро Пенья стал наследником Сандалио Джунко в качестве начальника НКЦ совершенно неопытным, метеоритный рост Пеньи за короткое время с тех пор, как многие из тех, кто даже не был осторожен с Кубой, борец за полную коллективизацию и промышленное развитие, Пенья с гордостью носит мрачный ярлык «коммунистического» и, несмотря на это, НЦНК и ее руководство как в прошлом, так и в настоящее время приняли во внимание многие аспекты европейского синдикализма и, как это ни парадоксально, призыв к развитию более сильной кубинской национальной самобытности в условиях интернационализма."

 CUB_sandalio_junco_camellon: "Сандалио Джунко Камелон"
 # CUB_sandalio_junco_camellon_country_leader: "Будучи близким партнером Хулио Меллы и изгнанным вместе с ним в Мексику в 1925 году, Дзюнко умудрился тайно вернуться на Кубу после кубинской студенческой революции и, в конечном итоге, стать лидером НСОК, которая все еще сохранила идеологический характер, которым она обладала в 1925 году. Несмотря на необходимость работать с другими социалистическими группами, Джунко глубоко не согласился с идеологией и личным характером других социалистических лидеров, таких, как Антонио Гитерас и Хуан Блас. В конечном итоге, будучи вынужденным уйти с поста председателя НКЦ недовольными молодыми членами, Дзюнко сохранил значительную степень влияния в рамках организации и фракции «Комуниста» кубинского социалистического движения. В качестве президента Дзюнко стремится к полной компиляции земли и быстрому принудительному промышленному развитию страны."

 CUB_julio_mella_mcpartland: "Хулио Мелла Макпартленд"
 # CUB_julio_mella_mcpartland_leader_desc: "Внук доминиканского героя, Матиас Мелла, Хулио Мелла впервые вступил в матч с законом в качестве студента первого года обучения в университете во время пребывания на посту президента Зайаса. В качестве президента Федерации студентов идеологического социалистического университета Мэлла пытался противостоять авторитарному режиму Герадо Мачадо. За это он был изгнан в Мексику в течение следующих одиннадцати лет. По возвращении Мелла быстро восстановила свое положение на кубинской левой стороне и принесла с собой новую идеологию, известную как «трансформационизм», под влиянием мексиканского аграрного социалистического штамма мысли. Как президент, Мелла стремится превратить Кубу в модель «трансформационизма» для всего мира, независимо от стоимости или того, кто может попытаться встать на его пути."

 CUB_tina_modotti: "Тина Модотти"
 #CUB_tina_modotti_leader_desc: "В 1922 году Тина Модотти приехала в Мексику, чтобы следовать за мексиканским любовником. Годы спустя она встретилась и, не вдаваясь в историю переезда от одного дела к другому, в конечном итоге вышла замуж за кубинского эмигранта Хулио Меллу. После кубинской социалистической революции Модоти вернулась на остров вместе со своим новым мужем, помогая восстановить свою политическую карьеру с того момента, как ее ноги впервые коснулись кубинской земли. После того, как Модотти завоевал его после его смерти, став первой женщиной, возглавляющей кубинское государство, она по-прежнему привержена идеологии преобразований и авторитарному стилю правления своего мужа."

 CUB_antonio_guiteras_holmes: "Антонио Гитерас Холмс"
 # CUB_antonio_guiteras_holmes_country_leader: "Будучи лидером Кубинской социалистической партии после кубинской революции 1928 года, Гитерас был занудой на стороне кубинских военных королей и сыграл важную роль в выживании партии и социализма в целом на Кубе после событий 1935 года."

 CUB_raul_roa_garcia: "Рауль Роа Гарсия"
 # CUB_raul_roa_garcia_country_leader: "Внук Мамби, Рауль Роа, впервые развил свои революционные социалистические идеалы как студенческий активист против режима Герадо Мачадо. После освобождения из тюрьмы он работал в тесном контакте с внезаконными социалистическими оппозиционными группами и идеологически смешанным «Университетским студенческим справочником» Гаванского университета. Не будучи непосредственным участником протестов, которые привели к свержению Мачадо, он нашел платформу для различных левых публикаций, получил высокую степень знаменитости среди кубинских социалистов. Хотя Роа был назначен на пост президента только в рамках компромисса между враждебными социалистическими группировками Кубы, он владеет княжеством для руководства и публичного выступления после своих лет."

 CUB_juan_blas_hernandez: "Хуан Блас Эрнандес"
 # CUB_juan_blas_hernandez_country_leader: "По сравнению с Сандино в Никарагуа Хуан Блас Эрнандес в течение многих лет вел партизанскую войну на южных холмах Кубы, который прежде всего является человеком народа и более чем готов сражаться и истекать кровью ради наименее удачливого народа."

 CUB_alberto_bayo_giroud: "Альберто Байо и Жируд"
 # CUB_alberto_bayo_giroud_country_leader: "Альберто Байо присоединился к испанскому Легиону и воевал в колониальной войне этой страны на севере Марокко; возвратившись на Кубу в 1932 году после распада короткоживущей Испанской Республики, Байо присоединился к повстанцу Хуану Бласу, обучая партизан тому, чтобы они летали на любом маленьком самолете, который им удалось поймать. В конце концов, отношения Байо с Бласом выросли настолько, что каждый стал самым уверенным в себе."

 CUB_rafael_trejo_gonzalez: "Рафаэль Трехо Гонсалес"
 # CUB_rafael_trejo_gonzalez_country_leader: "Будучи молодым студентом юридического факультета Гаванского университета, Рафаэль Трехо Гонсалес все больше разочаровался в авторитарном режиме Херардо Мачадо Моралеса. Он присоединился к недавно созданному «Университетскому справочнику» по борьбе с Мачадо, созданному по аналогии с существовавшей «Федерацией студентов университета», а также к не менее недовольным «Ассоциацией студентов-юристов». К концу 1927 года он стал влиятельным в первом и последнем."

 CUB_manuel_bisbe_alberni: "Мануэль Бисбе Альберни"
 # CUB_manuel_bisbe_alberni_country_leader: "Среди основателей Кубинской аутентической партии Мануэль Бисбе Альберни и другие более умеренные члены покинули организацию незадолго до кровопролития 1935 года и, как и многие другие бывшие аутентики, присоединились к Союзистам."

 CUB_carlos_cespedes_quesada: "Карлос Сеспедес Кесада"
 # CUB_carlos_cespedes_quesada_country_leader: "Карлос де Сеспедес, сын кубинского героя независимости того же имени, провел десятилетия в политике и на кубинской дипломатической службе, будучи якобы преданным Мачадо во время пребывания на этом важнейшем посту тирана, Сеспедес тайно работал над подрывом своего режима, тесно координируя свою деятельность с другими недовольными членами Либеральной партии. Вскоре после студенческой революции Сеспедес вернулся на выборную должность со статом в Сенате, где он основал Новую Либеральную партию, чтобы объединить единомышленников, бывших либералов, которые с роспуском Либеральной партии не имели какой-либо официальной ассоциации."

 CUB_miguel_mariano_gomez: "Мигель Мариано Гомес"
 # CUB_miguel_mariano_gomez_country_leader: "Сын второго президента Кубы Хосе Гомеса Мигеля Гомеса был впервые избран на национальный государственный пост в эпоху Мачадо, хотя он стремился следовать линии Либеральной партии и оказал Мачадо свою поддержку, он был одним из самых активных сторонников студенческих демонстраций, которые разрушили режим Мачадо. После успеха студенческой революции и краха Либеральной партии Гомес основал Республиканскую партию вместе с другими умеренными членами правой партии."

 CUB_jose_agripino_barnet_y_vinajeras: "Хосе Агрипино Барнет и Винаерас"
 # CUB_jose_agripino_barnet_y_vinajeras_country_leader: "После долгой и прославленной карьеры дипломата Хосе Аграпино Барнет был назначен президентом выбывающим Карлосом Мендиетой, хотя многие полагали, что его президентство будет мимолетной уткой, Барнет подходит к своей должности с определенной степенью профессионализма, которую редко можно увидеть в политической атмосфере Кубы."

 CUB_mario_garcia_menocal: "Марио Гарсия Менокал"
 # CUB_mario_garcia_menocal_country_leader: "Президент с 1913 по 1921 год, многие кубинцы с большой любовью оглядываются на время пребывания Менокала на посту президента, до скандалов в Зайе и тирании Мачадо, этот человек остается одним из самых уважаемых глав кубинского государства, после революции 1928 года и беспокоясь о политическом направлении страны, Менокаль вновь вошёл в политику и был избран в кубинскую сенат, там он и его новая Национальная демократическая ассоциация, связанная с остатками старой Либеральной партии, чтобы противостоять, по крайней мере якобы, как военным, так и союзникам."

 CUB_carlos_prio_socarras: "Карлос Прио Сокаррас"
 # CUB_carlos_prio_socarras_country_leader: "В 1927 году Карлос Прио Сокаррас, родившийся в небольшом прибрежном городе Баия-Хонда, получил образование в Гаванском университете и окончил его в 1927 году. Его время в качестве студента было отмечено значительным политическим волнением, поскольку университет стал эпицентром растущей оппозиции правлению Герардо Мачадосс. Сокаррас и многие из его сокурсников, собравшихся в знак протеста против усиливающегося авторитаризма бывшего героя Движения за независимость. Сокаррас , будучи одним из лидеров Студенческого управления, возглавлявшего демонстрации, был арестован вскоре после его окончания правительственными войсками и провел около года в тюрьме до того, как студенческая революция 1928 года обеспечила его освобождение. n As Cuban новое правительство обнаружило свою позицию. Карлос Перио Сокаррас помог найти новую партию Аутентико и стал ключевым помощником Рамон Грау Сан Мартина . Однако недавно он сделал выборной партии , которая не смогла Национальной Депресс , стабилизации , и Депресс Депресс , ста Депресс , ста , ста и , ста , ста и Депресс , стату и Депресс , стати и и , стату и и , , , , стастр , Гракар , &qu"

 CUB_clemente_vazquez_bello: "Клементе Васкес Белло"
 # CUB_clemente_vazquez_bello_country_leader: "Клементе Васкес был одним из ближайших друзей президента Мачадо и председателем Сената на протяжении большей части срока полномочий Мачадо, и, несмотря на многочисленные звонки, пережил многочисленные попытки своей жизни после падения Мачадо. Васкес, в отличие от многих старой Либеральной партии, твердо придерживался авторитарной модели президента, созданной Мачадо. Благодаря американской посреднической деятельности в нескольких неофициальных сделках с генералом Диасом Васкесом вернулся к кубинской политике после короткого затишья в американском посольстве и быстро нашел свои ноги. Васкес продолжает подражать своему старшему наставнику, и многие кубинцы считают, что его правление почти неотличимо от правления Мачадо."

 CUB_carlos_mendieta_montefur: "Карлос Мендиета Монтефур"
 # CUB_carlos_mendieta_montefur_country_leader: "Президент Сената Мендиета заменил Клементе Васкес президентом Кубы после убийства последнего, и обувь Васкеса оказалась трудной для заполнения. Несмотря на то, что Мендиета призывает к реформе, даже внутри своей собственной партии, пытается сохранить характер исполнительной власти, созданной при его авторитарном предшественнике."

 CUB_ramon_grau_san_martin: "Рамон Грау Сан Мартин"
 #CUB_ramon_grau_san_martin_leader_desc: "Будучи профессором медицинской школы Гаванского университета, Грау с другими диссидентами в преподавательском и студенческом коллективе, чтобы противостоять власти Герардо Мачадо. В то время как Грау не принимал непосредственного участия в организации массовых студенческих протестов, которые стимулировали революцию 1928 года, он и его сторонники быстро стали мощной политической силой в хаотичное время сразу после этого. Грау стал лидером известной военизированной группы "Гринширс", и, хотя он первоначально поддерживал союзистов в их борьбе за власть против военных, его все возрастающее презрение к социалистическо-бланчу и желание ограничить влияние Соединенных Штатов, привело к тому, что он использовал внезаконные средства для достижения своих целей. Грау пришел к тому, чтобы возглавить выдающиеся военизированные группы, "Гринширы", и в то время, как он по-прежнему поддерживает демократические идеалы, его риторика, как и его позиция, стала решительной испорченной."

 CUB_martin_diaz_tamayo: "Мартин Диас Тамайо"
 #CUB_martin_diaz_tamayo_country_leader: "Будучи младшим офицером, дислоцированным недалеко от президентского дворца Кубы, Мартин Диаз впервые стал главой контингента солдат, присоединившихся к студенческой революции 1928 года, который оказался на переднем крае быстродействующей фракции в составе вооруженных сил и получил звание генерала, только тридцатилетний Диас вскоре стал самым могущественным человеком на Кубе, еще более влиятельным в политике страны, чем сам президент."

 CUB_alberto_lamar_schweyer: "Альберто Ламар Швайер"
 # CUB_alberto_lamar_schweyer_leader_desc: "Альберто Ламар Швейер, родившийся в Матансасе, начал писать в молодом возрасте, став редактором газеты Эральдо де Куба в возрасте 16 лет; будучи молодым человеком, он участвовал в нескольких революционных, националистических интеллектуальных кругах в постиспанскую эпоху Кубы. Альберто Ламар Швайер встретился со многими ведущими деятелями в Марти Кафе и был убежден в необходимости того, чтобы Куба заявила о своей независимости от своих новых американских повелителей; однако он отвернулся от Групо Минеристы , левой антиимпериалистической группы, и был изгнан в качестве предателя за свою молчаливую поддержку диктатуры Мачадо. Нн Эмбиттерз , вскоре он оказался связанным с зелеными , радикальными , радикальными , радикальными , , , ,"

