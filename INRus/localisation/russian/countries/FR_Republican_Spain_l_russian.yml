SPR_secure_andalucia_desc: ""
SPR_fight_northern_dissent: "Бороться с северным дисконтированием"
SPR_fight_northern_dissent_desc: ""
SPR_pacify_eastern_coast: "Уплотнить восточное побережье"
SPR_pacify_eastern_coast_desc: ""
SPR_spain_reunited_reorganized: "Испания, воссоединение и реорганизация"
SPR_spain_reunited_reorganized_desc: "Мы победили националистов, монархистов и социалистов, и мы можем начать реконструировать Испанию под вновь воссоединенным и реорганизованным правительством."

SPR_republican_navy: "Республиканский флот"
SPR_republican_navy_desc: "Если мы хотим соревноваться с другими западными державами на мировой арене, одним из первых шагов, которые мы должны предпринять, является восстановление его прежней мощи."
SPR_expand_dockyards: "Расширить докьярды"
SPR_expand_dockyards_desc: "Расширение наших верфей крайне важно для строительства и причала большего числа кораблей."
SPR_assure_naval_merchant_ties: "Морские торговцы"
SPR_assure_naval_merchant_ties_desc: "Наши морские торговцы являются жизненно важным активом нашего флота."
SPR_modernize_destroyers: "Модернизация разрушителей"
SPR_modernize_destroyers_desc: "Модернизация наших эсминцев уже давно устарела и является важным аспектом совершенствования нашего флота."
SPR_rule_seas: "Повелевать морями"
SPR_rule_seas_desc: "У нашего флота должны быть средства и способность управлять морями с абсолютным превосходством."
SPR_hit_and_run: "Удар и беги"
SPR_hit_and_run_desc: "Наш флот не может править морями с превосходством, он должен полагаться на ударные нападения вместо того, чтобы нарушать вражеские линии."
SPR_new_spanish_flagships: "Новые испанские флаги"
SPR_new_spanish_flagships_desc: "Новые испанские флаги станут украшением нашего нового флота."
SPR_fund_submarine_research: "Фонд по исследованию подводных лодок"
SPR_fund_submarine_research_desc: "Подводные лодки будут одним из ключевых элементов нашего военно-морского фонда."
SPR_light_ship_models: "Модели легких судов"
SPR_light_ship_models_desc: "Для того чтобы усовершенствовать наш флот, мы должны сосредоточиться на совершенствовании наших легких судов."
SPR_heavier_cruiser_models: "Тяжелые крестовые модели"
SPR_heavier_cruiser_models_desc: "Для того чтобы улучшить наш флот, мы должны сосредоточиться на совершенствовании наших тяжелых крейсеров."
SPR_invest_coast_guard: "Инвестировать в береговую охрану"
SPR_invest_coast_guard_desc: "Наша береговая охрана уже располагает инфраструктурой, необходимой для нашего великого флота."
SPR_spanish_naval_doctrines: "Испанские военно-морские доктрины"
SPR_spanish_naval_doctrines_desc: "Мы должны сосредоточиться на разработке доктрины, которой должны следовать наши военно-морские силы, с тем чтобы отделиться от остального мира и гарантировать победу."

SPR_republican_air_force: "Республиканские военно-воздушные силы"
SPR_republican_air_force_desc: "Испания должна иметь новые военно-воздушные силы, чтобы соответствовать своему новому правительству, мы должны немедленно начать инвестировать в воздушное превосходство над нашими соседями."
SPR_expand_madrid_air_fields: "Расширить Мадридские воздушные поля"
SPR_expand_madrid_air_fields_desc: "Воздушные поля служат фундаментом для любых военно-воздушных сил."
SPR_interservice_cooperation: "Интерсервисное сотрудничество"
SPR_interservice_cooperation_desc: "Сотрудничество между ветвями нашей армии имеет важнейшее значение для создания действующих военно-воздушных сил."
SPR_invest_naval_fighters: "Инвестирование в военно-морских истребителей"
SPR_invest_naval_fighters_desc: "Военно-морские бойцы могут быть разницей между победой и поражением в открытом море."
SPR_invest_close_land_fighters: "Инвестируйте в скрытых борцов с землей"
SPR_invest_close_land_fighters_desc: "Близкие сухопутные борцы могут быть разницей между победой и поражением в крупных сражениях с землей."
SPR_modernize_old_planes: "Модернизация старых самолётов"
SPR_modernize_old_planes_desc: "Не все в наших новых военно-воздушных силах должно быть построено с нуля."
SPR_aggresive_air_force: "Агрессивные военно-воздушные силы"
SPR_aggresive_air_force_desc: "Наши военно-воздушные силы должны быть агрессивными в бою, особенно когда речь идет о разрушении инфраструктуры противника."
SPR_strategic_bomber_efforts: "Стратегические бомбардировщики"
SPR_strategic_bomber_efforts_desc: "Наши военно-воздушные силы должны содержать стратегических бомбардировщиков, предназначенных для уничтожения инфраструктуры противника и посевов хаоса среди своих рядов."
SPR_defensive_air_force: "Оборонительные военно-воздушные силы"
SPR_defensive_air_force_desc: "Наши военно-воздушные силы должны защищаться в бою, особенно когда речь идет о защите наших войск на местах."
SPR_interception_tactic_efforts: "Технологические усилия перехвата"
SPR_interception_tactic_efforts_desc: "Наши военно-воздушные силы должны уделять приоритетное внимание тактике перехвата, разработанной для уничтожения вражеских самолетов, прежде чем они смогут уничтожить наши наземные силы."
SPR_spanish_airial_doctrines: "Испанские авиационные доктрины"
SPR_spanish_airial_doctrines_desc: "Мы должны сосредоточиться на разработке доктрины, которой должны следовать наши военно-воздушные силы, с тем чтобы отделить себя от остального мира и гарантировать победу."

SPR_republican_army: "Республиканская армия"
SPR_republican_army_desc: "Наша новая страна нуждается в армии, чтобы сравняться с ней и сохранить ее в безопасности."
SPR_remove_outside_influences_army: "Удалить внешнее влияние из армии"
SPR_remove_outside_influences_army_desc: "Для того чтобы наша армия могла функционировать хорошо, она должна быть в первую очередь лояльной Испании, и мы должны работать над тем, чтобы исключить иностранное влияние из ее рядов, чтобы гарантировать ее верность."
SPR_basic_equipment_research: "Исследования в области основного оборудования"
SPR_basic_equipment_research_desc: "Несмотря на гражданскую войну, мы не можем допустить, чтобы наши военные технологии отставали от технологий наших соперников."
SPR_mobilize_spanish_army: "Мобилизовать испанскую армию"
SPR_mobilize_spanish_army_desc: "Испанская армия по-прежнему очень плохо организована, и важно, чтобы мы вели ее на полную мощность и набирали как можно больше людей, чтобы заполнить ее ряды."
SPR_invest_armour_research: "Инвестирование в исследования армора"
SPR_invest_armour_research_desc: "Хотя когда-то кавалерия могла быть ключом к победе в битвах, теперь победа заключается в танках и бронированных автомобилях."
SPR_let_fire_rain: "Пусть дождь будет огнём."
SPR_let_fire_rain_desc: "Артиллерия всегда была важным аспектом любой западной армии."
SPR_counter_air: "Противодействие воздуху"
SPR_counter_air_desc: "В других странах есть военно-воздушные силы, которые намного превосходят наши собственные."
SPR_planning_and_numbers: "Планирование и число"
SPR_planning_and_numbers_desc: "Для победы в битвах и войнах необходимо планирование, и выделение части нашего общего персонала на разработку планов боевых действий поможет нам в будущем."
SPR_new_general_staff: "Новый генеральный штаб"
SPR_new_general_staff_desc: "Старый генеральный штаб испанской армии был слабым, нескоординированным и неэффективным."
SPR_special_unit_efforts: "Специальные подразделения"
SPR_special_unit_efforts_desc: "Концентрация на специальных подразделениях — это хороший способ диверсифицировать нашу армию и обеспечить, чтобы мы могли справиться с любой ситуацией, которая нам не под силу."
SPR_support_brigades: "Вспомогательные бригады"
SPR_support_brigades_desc: "Бригады поддержки так же важны для нашей армии, как и боевые люди."
SPR_armada_of_tanks: "Арма танка"
SPR_armada_of_tanks_desc: "С учетом того, что сейчас западные армии имеют броню будущего, крайне важно, чтобы мы создали нашу собственную армаду танков, с тем чтобы мы не отставали от наших соседей."
SPR_mobile_artillary_efforts: "Мобильная артиллерия"
SPR_mobile_artillary_efforts_desc: "Артиллерия всегда была эффективной в борьбе с противостоящими армиями, но сделать ее мобильной является важным следующим шагом в достижении и превосхождении превосходства других европейских армий."
SPR_rifle_for_soldiers: "Винтовки для солдат"
SPR_rifle_for_soldiers_desc: "Мы должны производить винтовки массово, если хотим создать новую и развитую испанскую армию."
SPR_spanish_army_doctrines: "Доктрины испанской армии"
SPR_spanish_army_doctrines_desc: "Мы должны сосредоточиться на разработке доктрины, которой должна следовать наша армия, с тем чтобы отделить себя от остального мира и гарантировать победу."

SPR_economic_recovery: "Экономическое восстановление"
SPR_economic_recovery_desc: "Испанская экономика была разрушена, и в том же году нас поразила катастрофа на фондовом рынке и гражданская война."
SPR_sieze_unloyal_industries_assets: "Активы компании &quot; Seze Unloyal Industries &quot;"
SPR_sieze_unloyal_industries_assets_desc: "Как бы это ни было невероятно, многие отрасли в Испании по-прежнему преданы нашим врагам."
SPR_rebuilding_road_network: "Восстановление дорожной сети"
SPR_rebuilding_road_network_desc: "Возрождение этой инфраструктуры является первым шагом в восстановлении экономики нашей страны."
SPR_gradually_ending_austerity: "Постепенное прекращение жесткости"
SPR_gradually_ending_austerity_desc: "Мы не можем больше позволить себе сидеть и смотреть, как умирает наша экономика."
SPR_reopen_banks: "Вскрыть банки"
SPR_reopen_banks_desc: "Настало время вновь открыть многие банки, которые были закрыты в начале гражданской войны, сейчас, как никогда ранее."
SPR_higher_rations: "Увеличение объема продовольственных пайков"
SPR_higher_rations_desc: "Хотя продовольственные пайки были жизненно важной мерой, принятой в начале гражданской войны, мы должны увеличить объем выделяемых каждому человеку средств, с тем чтобы учесть, что наша экономика пострадала."
SPR_end_austerity_messures: "Меры экономии"
SPR_end_austerity_messures_desc: "Мы должны вернуться к вопросам нашей экономики, чтобы спасти ее."
SPR_invest_mineral_industry: "Инвестиции в горнодобывающую промышленность"
SPR_invest_mineral_industry_desc: "Добыча полезных ископаемых уже давно является достоянием Испании."
SPR_reopen_mineral_export: "Возобновить экспорт полезных ископаемых"
SPR_reopen_mineral_export_desc: "Экспорт наших полезных ископаемых в остальной мир гарантирует нам большую прибыль, и мы должны сделать это сейчас, пока не поздно спасти нашу экономику."

SPR_focus_state_controlled_industry: "Уделение особого внимания контролируемой государством промышленности"
SPR_focus_state_controlled_industry_desc: "Чтобы наша страна оправилась от гражданской войны, государство должно контролировать свою индустрию."
SPR_focus_private_industries: "Уделение особого внимания частным отраслям"
SPR_focus_private_industries_desc: "Гарантирование контроля за рынком спасет нас от головной боли в будущем."
SPR_employment_programs: "Программы в области занятости"
SPR_employment_programs_desc: "Мы должны обеспечить, чтобы все испанские граждане имели доступ к занятости, с тем чтобы улучшить нашу экономику и снизить уровень безработицы."
SPR_nationalized_railways: "Национализированные железные дороги"
SPR_nationalized_railways_desc: "Национализация железных дорог даст нам доступ к огромным инфраструктурным изменениям, которые в противном случае мы бы не смогли осуществить."
SPR_agricultural_reforms: "Сельскохозяйственные реформы"
SPR_agricultural_reforms_desc: "Мы должны реформировать нашу сельскохозяйственную промышленность, с тем чтобы как запустить этот сектор экономики, так и обеспечить, чтобы все наши граждане имели достаточно продовольствия."
SPR_rural_employment_programs: "Программы занятости в сельской местности"
SPR_rural_employment_programs_desc: "Хотя программы трудоустройства имеют важное значение для возвращения Испании к трудовой деятельности, мы должны также сосредоточить внимание на наших сельских граждан и обеспечить им такие же возможности, как и тем, кто живет в городах."
SPR_build_new_arms_factories: "Построить новые оружейные фабрики"
SPR_build_new_arms_factories_desc: "Один из способов стимулировать экономику, а также укреплять нашу оборону - это строительство оружейных фабрик, что позволит обеспечить как прибыль, так и безопасность."
SPR_new_searches_for_recourses: "Новые поиски ресурсов"
SPR_new_searches_for_recourses_desc: "Для того чтобы добиться успеха, мы должны возобновить поиск ресурсов."
SPR_attract_french_investors: "Привлечение французских инвесторов"
SPR_attract_french_investors_desc: "Французы были нашими союзниками на протяжении всей гражданской войны, и привлечение французских инвесторов поможет восстановить нашу экономику и установить более тесные связи между нашими двумя странами."
SPR_liberalize_agriculture: "Либерализация сельского хозяйства"
SPR_liberalize_agriculture_desc: "Мы должны либерализовать нашу политику в отношении сельского хозяйства, с тем чтобы улучшить положение в этом секторе нашей экономики."
SPR_encourage_spanish_buisnesses: "Поощрять испанское предпринимательство"
SPR_encourage_spanish_buisnesses_desc: "Мы должны поощрять бизнес здесь, в Испании, чтобы стимулировать нашу экономику, что поможет росту рынка."
SPR_encourage_rural_investments: "Поощрение инвестиций в сельские районы"
SPR_encourage_rural_investments_desc: "Мы должны поощрять инвестиции в более бедные сельские районы Испании."
SPR_spanish_republican_economic_boom: "Испанский республиканский экономический бум"
SPR_spanish_republican_economic_boom_desc: "Мы добились успеха не только в восстановлении нашей экономики, но и в обеспечении ее процветания."

SPR_republic_triumphant: "Республика Триумфант"
SPR_republic_triumphant_desc: "Испанская Республика стоит сильной!"
SPR_ban_socialist_militas: "&lt; &lt; Пан социалистический милитас &gt; &gt;"
SPR_ban_socialist_militas_desc: "Социалисты предали нас в наш самый важный час."
SPR_ban_communist_party: "Запрет Коммунистической партии"
SPR_ban_communist_party_desc: "Мы должны преодолеть разногласия, возникшие в результате гражданской войны, и создать страну для всех."
SPR_curtail_monarchism: "Кудрявый монархизм"
SPR_curtail_monarchism_desc: "Мы должны ограничить чувства монархистов, которые испытывают некоторые слои нашего населения, и если мы этого не сделаем, то это может разжечь разногласия, с которыми мы только что боролись, чтобы преодолеть их."
SPR_ban_royalty_from_spain: "Избавься от царской власти из Испании"
SPR_ban_royalty_from_spain_desc: "Единственный способ положить конец монархистскому движению - это изгнать испанскую монархию."
SPR_ban_monarchist_militas: "Националист &lt; &lt; Милитас &gt; &gt;"
SPR_ban_monarchist_militas_desc: "Националисты нанесли гораздо больший ущерб нашей стране, чем добро, и мы не можем допустить, чтобы их милита продолжала оставаться нерегулируемой."
SPR_ban_carlists: "Запретительные националистические партии"
SPR_ban_carlists_desc: "Чтобы избежать раскола, созданного националистами, мы должны запретить все националистические партии от нашей политической системы и поощрять создание единой, единой Испании."

SPR_first_republican_election: "Новые республиканские выборы"
SPR_first_republican_election_desc: "Пришло время провести новые выборы, чтобы определить состав республиканского правительства."
SPR_integrate_socialists: "Интегрировать социалистов"
SPR_integrate_socialists_desc: "В то время как социалисты предали нас в наш самый трудный час, мы не можем позволить старым разногласиям встать и мы должны вернуть их обратно в испанское общество, чтобы залечить старые раны."
SPR_remove_caballero: "Удалить Кабальеро"
SPR_remove_caballero_desc: "Франциско Ларго Кабальеро, лидер социалистического движения, долгое время был на нашей стороне."
SPR_gain_socialist_support: "Приобретать социалистическую поддержку"
SPR_gain_socialist_support_desc: "Социалисты сражались вместе с нами в начале гражданской войны."
SPR_negotiate_with_anarchist_politicans: "Переговоры с анархистами-политиками"
SPR_negotiate_with_anarchist_politicans_desc: "Анархисты никогда не были особенно дружелюбны к нашему правительству, но это не поможет полностью исключить их."
SPR_uniting_left: "Объединение левых"
SPR_uniting_left_desc: "Левые будут гораздо более управляемыми, если они будут объединены под общим знаменем, работа по достижению этой цели поможет стабилизировать и укрепить наше правительство."
SPR_secularize_state: "Секуляризация государства"
SPR_secularize_state_desc: "Церковь не имеет никакого дела с испанскими средствами к существованию."
SPR_establish_proper_autonomies: "Создать правильные автономии"
SPR_establish_proper_autonomies_desc: "После гражданской войны важно создать надлежащие автономии по всей Испании для ведения повседневного бизнеса в их регионах и поддержания мира."
SPR_assure_loyalty: "Верность"
SPR_assure_loyalty_desc: "Важно, чтобы все аспекты нашего правительства оставались верными нам и идее республиканизма."
SPR_limit_catholic_influence: "Ограничение влияния католиков"
SPR_limit_catholic_influence_desc: "Такому государству, как Испания, не может быть сказано, что делать церковь в Риме, важно ограничить влияние церкви здесь, пока она не обретет слишком сильное влияние на наше население."
SPR_deal_with_religious_education: "Религиозное воспитание"
SPR_deal_with_religious_education_desc: "Мы должны примирить состояние религиозного образования в Испании с тем фактом, что мы решили ограничить влияние церкви на нашу страну."
SPR_modern_spanish_state: "Современное испанское государство"
SPR_modern_spanish_state_desc: "Только тогда, когда мы модернизируемся и оправимся от гражданской войны, мы сможем действительно вернуться на путь к величию."
SPR_integrate_conservatives: "Объединить консерваторов"
SPR_integrate_conservatives_desc: "В то время как консерваторы предали нас в наш самый тяжелый час, мы не можем позволить старым разногласиям встать, мы должны перегруппировать их в испанское общество, чтобы залечить старые раны."
SPR_remove_valiente_soriano: "Удалить Valiente Soriano"
SPR_remove_valiente_soriano_desc: "Хосе Мария Валиенте Сориано, лидер консервативного движения, долгое время был на нашей стороне."
SPR_negotiate_with_accion_espanola: "Переговоры с организацией &lt; &lt; Реконструкция Испании &gt; &gt;"
SPR_negotiate_with_accion_espanola_desc: "Консервативы никогда не были особенно дружелюбны к нашему правительству, но это не значит, что они будут полностью исключены."
SPR_gain_conservative_support: "Получение консервативной поддержки"
SPR_gain_conservative_support_desc: "Консерваторы, возможно, сражались против нас в начале гражданской войны, но заручиться их поддержкой необходимо для создания прочного правительства."
SPR_uniting_right: "Объединение правых"
SPR_uniting_right_desc: "Работа по достижению этой цели поможет стабилизировать и укрепить наше правительство."
SPR_legacy_of_manuel_azana: "Наследие Мануэля Азанья"
SPR_legacy_of_manuel_azana_desc: "Мануэль Азанья сделал многое, как лидер левых республиканцев."
SPR_legacy_of_niceto_alcala_zamora: "Наследие Ницето Алькала-Заморы"
SPR_legacy_of_niceto_alcala_zamora_desc: "Ниццето Алькала-Замора много сделал как лидер республиканского права, его наследие повлияет на нашу политику, и было бы мудро признать это."
SPR_plus_ultra: "Плюс Ультра"
SPR_plus_ultra_desc: "Наконец, Республика остается сильной, она отбросила назад всех претендентов, и Испания вновь подтвердит свою позицию на мировой арене, находящейся под ее контролем."

