SPR_recruitment_propaganda: "Пропаганда вербовки"
SPR_recruitment_propaganda_desc: "Важную роль в этом деле будет играть активизация усилий по набору персонала."
SPR_civil_war_offensive_planning: "Планирование наступательных действий в ходе гражданской войны"
SPR_civil_war_offensive_planning_desc: "Республиканцы плохо подготовлены к наступательной войне в гражданской войне, нам нужны новые планы, если мы не хотим, чтобы наши наступательные силы истощали наши силы."
SPR_provide_proper_army_transport: "Обеспечение надлежащего военного транспорта"
SPR_provide_proper_army_transport_desc: "Поскольку страна разделена, трудно обеспечить доставку товаров и оружия на фронт, и это необходимо сделать, если мы хотим, чтобы армия была на продвинутом этапе."
SPR_military_armament: "Военное оружие"
SPR_military_armament_desc: "Мы должны вооружить наших военных до зубов, если хотим выжить против наших врагов."
SPR_rebuild_zaragoza_defences: "Реконструкция обороны в Сарагосе"
SPR_rebuild_zaragoza_defences_desc: ""
