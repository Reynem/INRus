### Events ###
repspain.0.t: "Республика Испания"
repspain.0.d: "Республиканизм в Испании не является чем-то новым на нашем полуострове. Первая попытка испанской Республики была предпринята в 1873 году после отторжения короля Амадео I. В то время как первая республика просуществовала всего лишь более года, когда против нее выступали как монархисты, так и националисты, тот факт, что она вообще существовала, говорит о чем-то. Во-первых, республика сталкивалась с многочисленными попытками переворота, и не все были готовы принять свое правление. Это закончится в рождественский сезон 1935 года, когда переворот станет последней искрой для разжигания гражданской войны. Монархисты и националисты взяли оружие против нашего правительства, выдвинув свое время в тени."
repspain.0.a: "Плюс Ультра!"

repspain.1.t: "Протесты в Рифе"
repspain.1.d: "Спустя 10 лет после окончания войны в Рифе, опять-таки, в этом районе, похоже, нарастают проблемы. &lt; &lt; Рифский народ &gt; &gt; убедился в том, что наша власть и влияние на Испанское Марокко ослабевают, и он увидел свой шанс выступить против нашего правления. &lt; &lt; Несмотря на то, что до сих пор не произошло никакого полномасштабного восстания &gt; &gt; , дело обстоит именно так."
repspain.1.a: "Похоже, там всегда есть какие-то проблемы."

repspain.2.t: "Добровольцы прибывают в Мадрид"
repspain.2.d: "Продемократические добровольцы смогли проникнуть на нашу территорию через границы с Португалией и социалистами."
repspain.2.a: "Мы благодарим их за поддержку!"

repspain.3.t: "Севилье под нашим контролем"
repspain.3.d: "Нам удалось оттолкнуться на юг и захватить город Севилья, который служил базой для монархистских сил на юге Испании, где они получили британскую поддержку через Гибралтар."
repspain.3.a: "Да здравствует Республика!"

repspain.4.t: "Галиция под нашим контролем"
repspain.4.d: "Нам удалось оттолкнуть северо-западную часть страны и захватить Галицию, где в результате гражданской войны была создана база для националистического восстания, и мы можем сказать, что благодаря этому региону нам удалось обеспечить безопасность северных территорий Испании."
repspain.4.a: "Да здравствует Республика!"

repspain.5.t: "Падение монархистов!"
repspain.5.d: "Монархисты и националисты потерпели поражение, и вместе с ними нам удалось победить силы, которые пытались восстановить старые и автократические режимы над Испанией."
repspain.5.a: "По крайней мере, есть два менее фейерверка."

repspain.6.t: "Конфликт с социалистами"
repspain.6.d: "Соглашение о ненападении между нами и социалистами завершилось. Новости о столкновениях на границе вновь привели к конфликту. Пора посмотреть, будет ли Испания демократической республикой или социалистическим режимом."
repspain.6.a: "Да здравствует демократия!"

repspain.7.t: "Валенсия под нашим контролем"
repspain.7.d: "Нам удалось оттолкнуться на восток и захватить Валенсия. Это прекрасный город на побережье, который находится под социалистической оккупацией с начала войны. С возвращением этого города социалисты вскоре будут побеждены."
repspain.7.a: "Да здравствует Республика!"

repspain.8.t: "Барселона под нашим контролем"
repspain.8.d: "Нам удалось подтолкнуть северо-восток и захватить Барселону, это один из самых важных городов в Испании, центр социалистической революции."
repspain.8.a: "Да здравствует Республика!"

repspain.9.t: "Гражданская война окончена!"
repspain.9.d: "Гражданская война в Испании окончена, после вечных сражений республиканцы вышли на вершину, хотя наш успех велик, после этой победы будут трудности."
repspain.9.a: "Испания снова Юнайтед!"

repspain.10.t: "Лондонский фондовый рынок поражает Мадрид"
repspain.10.d: "Недавняя катастрофа на фондовом рынке в Лондоне пришла в Испанию, страна уже является плохой формой, когда речь идет о нашей экономике."
repspain.10.a: "Мы молимся, чтобы это не сокрушило Республику."

repspain.11.t: "Антиправительственные протесты"
repspain.11.d: "Многие начали винить республиканское правительство в их страданиях после Лондонского Крэша."
repspain.11.a: "Когда наступит мир, будет лучше."

repspain.12.t: "Лондонский фондовый рынок поражает Испанию"
repspain.12.d: "Недавняя катастрофа на фондовом рынке в Лондоне пришла в Испанию, страна уже является плохой формой, когда речь идет о нашей экономике."
repspain.12.a: "Мы молимся, чтобы это не разорвало Испанию"

repspain.13.t: "Учрежденные социалистические преступные группировки"
repspain.13.d: "В последнее время поступают сообщения о том, что социалисты и каталонские националисты в Каталонии формируют свои собственные преступные банды, чтобы подорвать наш авторитет."
repspain.13.a: "Пусть полиция поймает их!"

repspain.14.t: "Предложение генерала Рохо Ллюха"
repspain.14.d: "Генерал Висенте Рохо Ллуч обратился к президенту и правительству с идеей создания временного военного правительства до проведения новых выборов."
repspain.14.a: "Простите, генерал."
repspain.14.b: "Это только до выборов."

repspain.15.t: "Стабильность возврата"
repspain.15.d: "В то время как многие были недовольны нашим выбором создать временное военное правительство, до сих пор были многообещающие результаты, при большем контроле, чем гражданское правительство, нам удалось надавить на многих монархистов и социалистов в Испании."
repspain.15.a: "Это действительно выглядит многообещающе."

repspain.16.t: "Президент Алькала-Замора сообщает о планах по спуску вниз"
repspain.16.d: "После того как демократия и республика вернутся к испанской нации, президент Ницето Алькала-Замора объявил, что вскоре уйдет в отставку и позволит Кортесам проголосовать за то, кто станет президентом после недавних выборов. Премьер-министр и большинство Кортесов, похоже, согласны с этой идеей. Официальная отставка президента произойдет через несколько дней или недель, и уже есть те, кто хотел бы стать следующим президентом Испании."
repspain.16.a: "Спасибо за вашу службу, мистер Президент."

repspain.17.t: "Президент Алькала-Замора Шаг вниз"
repspain.17.d: "Сегодня президент Ницето Алькала-Замора ушел в отставку в качестве президента Испанской Республики, и теперь ему предстоит решить, кто станет его преемником. Несмотря на отсутствие достаточного числа кандидатов, многие из них не имеют шансов на успех. Но есть два возможных кандидата, которые могут взять на себя роль президента Испании. Первым является Мануэль Азанья, лидер республиканских левых, который служил в качестве премьер-министра в ходе гражданской войны. Он был бы популярен среди социалистов и оставил центральные республиканцы, но не столь популярен ни у кого другого. Вторым является Алехандро Лерру, лидер радикальных республиканцев и бывший премьер-министр Испании. Он был бы популярен в республиканском центре и с теми, кто выступает против Азаньи в качестве президента, но не с левым крылом. Тем не менее, решение о том, кто будет следующим президентом Испании, будет решать Кортесы."
repspain.17.a: "Поддержка большинства Мануэля Азанья"
repspain.17.b: "Поддержка большинства Алехандро Леру"

# New Events #

repspain.18.t: "Армия &lt; &lt; Сизес &gt; &gt;"
repspain.18.d: "Чтобы стабильизировать Испанскую Республику во время гражданской войны, правительство решило передать власть в руки военных, возглавляемых Висенте Рохо Ллухом."
repspain.18.a: "За Республику"

repspain.19.t: "Расширение президентской власти"
repspain.19.d: ""
repspain.19.a: "За Республику"

# Focus Tree Events #

repspain.100.t: "Пропаганда вербовки в республиканской Испании"
repspain.100.d: "Пропаганда вербовки на территориях, находящихся под нашим контролем, кажется, работает, и новые мужчины предлагают свои услуги силам Испанской Республики."
repspain.100.a: "Спасибо за ваше участие."

repspain.101.t: "Армия вновь сохранила верность"
repspain.101.d: "Полковники в армии, которые были даже немного антиреспубликанцами, были либо арестованы, либо убиты, либо депортированы."
repspain.101.a: "Да здравствует Республика!"

repspain.102.t: "Готовы к выборам"
repspain.102.d: "И наконец, подготовка к новым выборам может начаться, и наша страна оправится от гражданской войны, а враги Республики будут полностью разрушены, и, наконец, можно будет провести голосование."
repspain.102.a: "Демократия так восхитительна."

repspain.103.t: "Новые республиканские выборы"
repspain.103.d: "И наконец, Испания готова к новым выборам. Несмотря на опасения по поводу того, что мы попытаемся оказать прямое влияние на голосование, чтобы провести голосование в стране определенным образом, правительство неоднократно убеждало общественность в том, что это будут свободные выборы. Есть два возможных результата этих выборов. Либо левые республиканцы обеспечат большинство, либо Республиканский центр и право обезопасят свои права. Несмотря на то, что Республиканское левое крыло состоит главным образом из Республиканского левого Мануэля Азаньи и Республиканского союза Диего Мартинеса Баррио, в этом союзе также существуют небольшие партии, в том числе некоторые региональные партии. Республиканское левое крыло хочет превратить Испанию в светское и современное государство, свободное от католичного влияния. Республиканский центр и право также хотят реинтегрировать социалистов обратно в левое общество. Республиканский центр и правое крыло, напротив, состоят главным образом из радикальной республиканской партии Алехандро-Лерру и Либерально-республиканское право президента Ницто Алкала-Замора, а более мелкие партии заполняют пробелы. Республиканский центр и право также ставят аналогичные цели перед левым республиканцем, но менее радикальными и готовыми реинтегрироваться к большей части правительства."
repspain.103.a: "Республиканский левый формирует правительство"
repspain.103.b: "Республиканский центр и правые формы правительства"

repspain.104.t: "Премьер-министр Азанья встречается с социалистами"
repspain.104.d: "Несмотря на то, что многие из лидеров Социалистической рабочей партии находятся в плену или покинули страну, премьер-министр Мануэль Азанья Диас начал встречаться с ведущими деятелями партии, которые по-прежнему живут на свободе в Испании."
repspain.104.a: "Демократия должна допускаться и для социалистов."

repspain.105.t: "Франциско Ларго Кабальеро найден мертвым"
repspain.105.d: "Новости из Осло недавно дошли до нас о том, что социалистический политик Франсиско Ларго Кабальеро был найден мертвым в его квартире. Очевидно, что кто-то смог взломать его квартиру и заколоть его в грудь. Хотя некоторые в норвежском правительстве подозревают, что мы как-то связаны с его смертью, у них нет конкретных доказательств. Независимо от того, кто это сделал, это не хорошая новость, когда испанские граждане найдены мертвыми."
repspain.105.a: "Мы надеемся, что он покоится с миром."

repspain.106.t: "Соглашение с социалистами"
repspain.106.d: "После нескольких часов встреч и обсуждений между правительством и социалистическими политиками было достигнуто соглашение, которое позволило правительству получить их поддержку, согласовать перечень требований, в том числе требование о создании испанского государства социального обеспечения, но после заключения этого соглашения правительство получит больше поддержки как в Кортесе, так и в обществе."
repspain.106.a: "Мы будем выполнять это соглашение"

repspain.107.t: "Переговоры с анархистами"
repspain.107.d: "В последние дни правительство вело переговоры с анархистскими политиками и, что важнее всего, с лидерами анархистских профсоюзов, существующих здесь, в Испании. Правительство начало эти переговоры и согласилось укрепить права трудящихся по всей стране. Это действительно счастливый день для рабочих."
repspain.107.a: "Счастлив прийти к соглашению"

repspain.108.t: "Что делать с религиозным образованием?"
repspain.108.d: "В нашем правительстве некоторые выступают за закрытие школ, которые имеют религиозную направленность или принадлежат религиозным организациям. Они говорят, что так же, как государство и церковь должны быть разделены, как и школа и церковь. Некоторые выступают против этого предложения, утверждая, что в этих школах нет ничего плохого, пока они следуют закону. В Кортесе был принят законопроект, запрещающий религиозное образование, и он готов подписать его, если он решит это сделать."
repspain.108.a: "Президент подпишет его"
repspain.108.b: "Президент Уилл Вето"

repspain.109.t: "Премьер-министр Мора встречается с консерваторами"
repspain.109.d: "Несмотря на то, что многие из лидеров Конфедерации автономных прав в настоящее время находятся в плену или покинули страну, премьер-министр Мигель Мора Гамазо начал встречаться с ведущими деятелями партии, которые по-прежнему живут в Испании свободно."
repspain.109.a: "Демократия должна быть гарантирована и консервантам."

repspain.110.t: "Хосе Мария Валиенте Сориано найден мертвым"
repspain.110.d: "Недавно появились новости из Амстердама о том, что консервалист-монархист Хосе Мария Валиенте Сориано был найден мертвым в своей квартире, что кто-то смог взломать его квартиру и выстрелить ему в голову."
repspain.110.a: "Мы надеемся, что он покоится с миром."

repspain.111.t: "Соглашение, достигнутое с консервантами"
repspain.111.d: "После нескольких часов встреч и обсуждений между правительством и консервативными политическими деятелями было достигнуто соглашение, которое позволило правительству получить их поддержку, и оно согласилось с перечнем требований, в том числе с требованием принять некоторые католические моральные нормы, которые могут вписаться в наше современное общество, но с этим соглашением правительство получит больше поддержки как в Кортесе, так и среди общественности."
repspain.111.a: "Мы будем выполнять это соглашение"

repspain.112.t: "Переговоры с организацией &lt; &lt; Реновасьон эспаньола &gt; &gt;"
repspain.112.d: "В последние дни правительство вело переговоры с политиками монархиста и консервативной реновации Испании, и хотя мы уничтожили их во время гражданской войны, они по-прежнему оказывают определенное влияние на консервативные права, и переговоры могут стать способом реинтеграции правого крыла испанской политики."
repspain.112.a: "Приятно вести с вами переговоры"

repspain.150.t: "Испанская Республика хочет присоединиться к «Согласию»"
repspain.150.d: "Наша южная соседка, Испанская Республика, обратилась к нам с просьбой войти в Согласие с ними, наш союз защитил бы еще одного союзника против Германии или Советского Союза."
repspain.150.a: "Их приветствуют!"
repspain.150.b: "Простите, но нет"

repspain.151.t: "Французы принимают наше вступление в Согласие"
repspain.151.d: "Французская Республика откликнулась на нашу просьбу присоединиться к «Согласию». К счастью, они согласились с нашим призывом присоединиться к своему альянсу. С Францией в качестве нашего союзника наша позиция в мире будет укреплена. Вместе мы будем выступать против режимов Германии и Советского Союза."
repspain.151.a: "Испания и Франция будут сражаться вместе!"

repspain.152.t: "Французы отвергают наше вступление в Согласие."
repspain.152.d: "Французская Республика ответила на нашу просьбу присоединиться к Консенсусу, но, к сожалению, они нас отвергли, хотя этот отказ вызывает разочарование, тот факт, что они все еще считают нас законным правительством Испании, может быть проблеском надежды, наше правительство будет считать это потерей для Франции."
repspain.152.a: "Это будет их убыток."

repspain.153.t: "Испанская Республика направляет поддержку"
repspain.153.d: "Испанская Республика признала нашу борьбу за свободу и республикализм и направила нам свою поддержку, и мы, конечно же, ответим нашей благодарностью, что в конечном итоге наша победа приведет к новой эпохе дружбы и братства между Испанией и Португалией."
repspain.153.a: "Благодаря нашим испанским друзьям!"

repspain.154.t: "Латиноамериканская дружба"
repspain.154.d: "Связи между испанской и французской республиками с каждым днем становятся все более прочными. Мы, как латинские страны, имеем больше, чем просто одинаковые политические системы. Мы оба говорим на романских языках, и оба они начались под правлением Римской империи две тысячи лет назад. Давайте найдем дружбу в сходстве с латиноамериканскими сестрами."
repspain.154.a: "Будущее выглядит блестяще для Мадрида и Парижа"

repspain.155.t: "Испанское посольство &lt; &lt; Возрождение &gt; &gt; в Мексике"
repspain.155.d: "Когда началась гражданская война в Испании, испанское посольство в Мексике было закрыто, и его сотрудники отправились домой в Испанию или смешались с мексиканским населением, но теперь, когда республиканцы являются единственными правителями Испании, нам был направлен новый посол, желающий вернуть здание, используемое в качестве посольства, и мы, конечно же, будем обязаны удовлетворить их просьбу, но есть различные мнения относительно того, как приветствовать их посла."
repspain.155.a: "Нужно добро пожаловать."
repspain.155.b: "Добро пожаловать, не нужно быть теплым."

repspain.156.t: "Мексика добро пожалует нашему послу"
repspain.156.d: "Мы всегда были уверены в том, что наше посольство в Мексике будет возвращено нам, но радушный прием нашего посла был больше, чем мы могли себе представить, и наш посол был встречен хорошей едой и выпивкой, празднуя с министерством иностранных дел Мексики, что действительно способствовало укреплению отношений с нашими испаноязычными братьями в Мехико."
repspain.156.a: "Это - доброе знамение."

repspain.157.t: "Добро пожаловать из Мексики"
repspain.157.d: "Мы всегда были уверены, что наше посольство в Мексике будет возвращено нам, хотя у нас нет оснований критиковать мексиканское правительство на этом фронте, они все же приветствовали нашего посла относительно холодно, после того как его допрашивала мексиканская полиция, его наконец приветствовал незначительный государственный чиновник, который дал ему ключи от посольства, к которому ему пришлось идти."
repspain.157.a: "По крайней мере, добро пожаловать..."

repspain.158.t: "Новый испанский посол в Аргентине"
repspain.158.d: "Когда началась гражданская война в Испании, испанское посольство в Аргентине было закрыто, и его сотрудники отправились домой в Испанию или слились с аргентинским населением."
repspain.158.a: "Буэнос-Айрес приветствует нового парня"
repspain.158.b: "Так долго они не будут волноваться."

repspain.159.t: "Теплое приветствие в Буэнос-Айресе"
repspain.159.d: "Мы всегда были уверены в том, что наше посольство в Аргентине будет возвращено нам, но приветствие, которое наш посол принял, было намного больше, чем мы могли себе представить."
repspain.159.a: "Возможно, аргентинский друг"

repspain.160.t: "Добро пожаловать в Аргентину"
repspain.160.d: "И хотя у нас нет оснований для критики аргентинского правительства на этом фронте, они, тем не менее, приветствовали нашего посла, хотя небольшой правительственный служащий просто передал ему письмо и ключи, а в письме они приветствовали нас, но также просили нас оставить их в стороне от нашей политики."
repspain.160.a: "Тогда мы не будем их беспокоить..."

repspain.161.t: "Растет международное признание"
repspain.161.d: "В мире растет признание нашего режима, и хотя он все еще довольно низок, приятно знать, что есть те, кто знает, что мы истинное правительство Испании."
repspain.161.a: "Да здравствует Испания!"

repspain.162.d: "В мире растет признание нашего режима, и все больше людей, стран и организаций признают нашу легитимность, и это несколько облегчает ситуацию, и все же многие не признают подлинное правительство Испании."

repspain.163.d: "В мире растет признание нашего режима, хотя большинство иностранных государств признают нас, некоторые из них все еще нас не признают, по крайней мере, мы можем сказать, что большинство стран действительно видят в нас подлинное правительство Испании."

repspain.164.d: "Сейчас только те, кто решительно поддерживает другие группировки и решительно выступает против нас, не признают нас."

repspain.165.t: "Признание международной торговли"
repspain.165.d: "Есть страны, которые не признают нас в качестве подлинного и законного правительства Испании, но с ростом торговой торговли и экспорта мы видим, что страны, которые ранее держались подальше от нас, обращаются к нам как к новому торговому партнеру, что, по сути, укрепляет международное признание нас."
repspain.165.a: "С торговлей приходит рост"

repspain.200.t: "Объявление Единой Иберии!"
repspain.200.d: "Сегодня лидеры Испании заявили, что вновь приобретенные португальские территории вместе с территориями Испании должны были объединиться в новое государство - Иберия."
repspain.200.a: "Да здравствует Иберия!"

### Focuses ###
SPR_loyal_parliament: "Лояльный парламент"
SPR_loyal_parliament_desc: "Генералы Кортесов не могут быть заполнены оппозицией в ходе этой гражданской войны, мы должны убрать тех, кто выступает против нас, и предоставить места верным парламентариям."
SPR_organize_republican_forces: "Организация Республиканских сил"
SPR_organize_republican_forces_desc: "Наши силы должны быть хорошо организованы для того, чтобы у них был шанс противостоять нашим врагам."
