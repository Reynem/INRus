SPR_unstable_republican_spirit_idea: "Нестабильный республиканский дух"
SPR_unstable_republican_spirit_idea_desc: "Несмотря на нестабильность духа испанской Республики, в условиях гражданской войны многие видят в нашей мечте именно это, но мы по-прежнему будем держаться за него, даже если это всего лишь мечта."
