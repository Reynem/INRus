SPR_woe_christmas_coup_idea_desc: "Кубка Рождества настигла нас в качестве сюрприза, и, хотя нам удалось удержаться в наших частях Испании, военные неорганизованы и в основном дезертировали к монархистам, националистам и социалистам."

