### Other Stuff ###
SPR_FUHRERREICH_DESC: "Республиканцы уже были судимы в Испании, но именно в 1931 году, после многих лет диктатуры Мигеля Примо де Риверы, была создана вторая Испанская Республика. Эта Республика была неосторожна под угрозой попыток переворота и антиреспубликанских сил. Эта напряженность привела бы к неудачному перевороту в декабре 1935 года, который быстро перерос в гражданскую войну."

SPR_election_happened_flag: "Выборы состоялись в Испании"
SPR_strengthen_french_ties_flag: "Твердые связи с Францией"

SPR_foreign_policy: "Внешняя политика испанской Республики"
SPR_foreign_policy_desc: "Не все страны и правительства признают нас в качестве законного правительства Испании, и это, среди прочего, то, что нам нужно преодолеть."

SPR_join_entente: "Присоединяйтесь к Согласию"
SPR_join_entente_desc: "Даже до начала конфликта наши отношения с "Согласием" были достаточно прочными."
SPR_support_republican_portugal: "Поддержка португальских республиканцев"
SPR_support_republican_portugal_desc: "Монархисты в Португалии пытаются держать власть в руках старой аристократии и португальского монарха."
SPR_connect_with_spanish_countries_america: "Связь с испаноязычными американскими странами"
SPR_connect_with_spanish_countries_america_desc: "Испанский язык является сильным на Американском континенте, многие страны используют его в качестве своего официального языка, и даже если колониализм накладывает напряженность на наши отношения с этими странами, мы должны попытаться укрепить новые связи."
SPR_strengthen_french_ties: "Укрепить французские тиши"
SPR_strengthen_french_ties_desc: "Франция является одной из латиноамериканских стран, европейской соседкой Испании и маяком Республиканизма на континенте, и с этим сходством вполне естественно, что наши страны будут стремиться к установлению более прочных связей."

SPR_internal_policy: "Внутренняя политика Испании"
SPR_internal_policy_desc: "С новыми правительствами, новыми расширениями и новыми декларациями, происходит изменение внутренней политики. §YИспания§! будет смотреть в себя так же, как мы смотрим на мир."

SPR_declare_iberian_unification: "Объявить об объединении иберийцев"
SPR_declare_iberian_unification_desc: "Испания и Португалия вновь объединились под единым знаменем, объединившись, новая иберианская нация наций, мы войдем в процветающее будущее."
SPR_integrate_portugal: "Объединить Португалию"
SPR_integrate_portugal_desc: "Португалия находится под нашим контролем, настало время интегрировать их в состав нашей территории."

IBERIA_unified_flag: "Иберия объединёна."
