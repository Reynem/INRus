 AUS_the_negotiations: "Переговоры"
 AUS_the_negotiations_desc: "Что касается прекращения огня, то мы, наконец, получаем временную передышку. &lt; &lt; Переговорный стол &gt; &gt; установлен и готов, и мы ждем, когда венгры покажут нам свои условия, прими мы их или нет."
 AUS_negotiations_successful: "Успешные переговоры"
 AUS_negotiations_successful_desc: "Нам удалось найти условия, приемлемые для Венгрии, и это положит конец непрекращающейся войне, которая на протяжении многих лет омрачала нашу страну."
 AUS_reform_the_empire: "Реформировать Империю"
 AUS_reform_the_empire_desc: "Мы реформируем нашу империю, с тем чтобы добиться большего равенства, и меньше ненависти, культурной автономии и прав теперь полностью признаны."
 AUS_negotiations_failed: "Неудавшиеся переговоры"
 AUS_negotiations_failed_desc: "Мы не смогли принять условия, которые поставили на стол венгры, это привело к еще большей войне."
 AUS_the_empire_strikes_back: "Империя возвращается"
 AUS_a_new_republic: "Новая Республика"
 AUS_a_new_republic_desc: "Мы избавились от Кайзера, Австрия теперь официально является республикой, для народа, народом, после потери империи, огромное количество перемен немного неожиданно, но мы должны работать с тем, что у нас есть."
 AUS_something_strange_is_happening: "Время выборов"
 AUS_something_strange_is_happening_desc: "Мы наконец-то готовимся к нашим первым выборам!"
 AUS_the_national_republic: "Победа Ватерландишского фронта"
 AUS_the_national_republic_desc: "Как переворот, так и выборы, Ватерландишский фронт теперь является правящей партией Австрии, которая выступает за радикальный католицизм, бешеный национализм и полную преданность государству. &lt; &lt; Тёмные дни &gt; &gt; впереди для Австрии."
 AUS_establish_clericalism: "Учредить клеркализм"
 AUS_establish_clericalism_desc: "Католичество является теперь обязательным. Религия, осуществляемая государством, является единственным способом спасти это умирающее государство. Мы оживим Австрию силой, если понадобится."
 AUS_reduce_parliament_power: "Снижение власти парламента"
 AUS_reduce_parliament_power_desc: "Отвратительное пятно демократии должно быть очищено от нашего государства, но пока мы сохраним образ демократии, но приложим все усилия к своим любимым кандидатам и не допустим, чтобы какие-либо иные мнения передавались."
 AUS_stenghten_heimwehr: "Укрепить Heimwehr"
 AUS_stenghten_heimwehr_desc: "Военизированная организация под названием &lt; &lt; Хеймвехр &gt; &gt; должна быть повышена до уровня законной военной силы, которая очистит Австрию от всех и любых иных мнений."
 AUS_bundesstaat_osterreich: "Бундесстаат Ёстеррейх"
 AUS_bundesstaat_osterreich_desc: "Теперь мы можем отбросить цепи монархизма, демократии и социализма."
 AUS_the_standestaat: "Стендестаат"
 AUS_the_standestaat_desc: "Это означает, что у нас будет несколько корпораций, каждая из которых будет соответствовать разделу труда."
 AUS_clerical_education: "Канцелярское образование"
 AUS_clerical_education_desc: "Наши дети будут обучаться только правильным образом, полное католическое образование, где все дети будут узнавать о любви и милосердии Бога... кроме того, мы научим их ненавидеть все, за что мы не стоим."
 AUS_reintroduction_death_penalty: "Восстановление смертной казни"
 AUS_reintroduction_death_penalty_desc: "Люди, которые противостоят нам, будут удалены, они перестанут существовать, в том доме никогда не было ни протестующих, ни геев, там, где нет семей мусульман в Вене, нет инакомыслящих."
 AUS_the_old_and_gold_baroque: "Старый и золотой барокко"
 AUS_the_old_and_gold_baroque_desc: "Мы возродим старый стиль аустрианского здания, красивый барокко будет стиль многих зданий."
 AUS_red_is_the_new_ottoman: "Красный - это Новый Оттоман."
 AUS_red_is_the_new_ottoman_desc: "Единственное, что хуже мусульманина, это социалистка. Мы объявим государственный крестовый поход на социалистов. Они будут лишены прав человека, их жизнь будет удалена из книг истории. Карл Маркс не существует, Фредерих Энгельс не существует. Ни один немец никогда не подумает о том, чтобы попасть в ублюдок."
 AUS_our_volksgemeinschaft: "Volksgemeinschaft" 
 AUS_our_volksgemeinschaft_desc: "Наша национальная община будет единственным истинным способом управления государством. Трудящиеся работают 12 часов, зная, что они вносят вклад в более широкое государство. Наши лидеры Корпорации новируют в технологии, чтобы угодить Либенсканцлеру. Клерики проповедуют слово. Социалисты очищены. Мы единственные истинные государства, ибо Австрия свята."
 AUS_the_rose_of_social_democracy: "Роза социально-демократии"
 AUS_the_rose_of_social_democracy_desc: "Каждый мужчина в Австрии сказал:"If only the roads where better, if only the skies where clearer, if only my life was better." We intend to fuffil that goal. We will save the worker, we will roform our society. In the name of our creed: Democracy, Rights and Humanity"
 AUS_start_welfare_reform: "Государство всеобщего благосостояния"
 AUS_start_welfare_reform_desc: "Благосостояние станет нефтью, которая смазывает когти нашего общества. &lt; &lt; Реговинальные советы &gt; &gt; будут голосовать по вопросу о том, где вводить благосостояние в экономику, и более долгосрочные проекты будут определяться главным правительством."
 AUS_progressive_taxation: "Прогрессивное налогообложение"
 AUS_progressive_taxation_desc: "Мы облагаем налогом бедняков и богатых, не потому, что мы их ненавидим, а потому, что это единственный способ для общества правильно функционировать. Это означает, что мы вырываем меньше денег у бедных, удаляя некоторые необходимые деньги у богатых. Это, очевидно, будет очень популярным для людей с низким уровнем дохода."
 AUS_money_for_the_poor: "Основные поступления"
 AUS_money_for_the_poor_desc: "Всё это объясняется тем, что на одного человека меньше ученых, или клерка, или даже образованного человека, все потому, что он не мог заплатить. Мы изменим это, люди будут иметь определенный доход."
 AUS_build_gemeindebau: "Построить Gemeindebau"
 AUS_build_gemeindebau_desc: "Человек должен где-то спать, и мы не имеем права лишать наших граждан по крайней мере пригодного жилья." 
 AUS_new_healtcare_system: "Новая, современная система лечения"
 AUS_new_healtcare_system_desc: "Болезнь, это отвратительное нападение на человечество, которое должно быть покончено, но, к сожалению, мы вряд ли сможем сделать это в ближайшее время, поэтому вместо этого мы облегчим боль больных, поначалу снизим плату за их лечение, но мы будем стремиться к полному бесплатному медицинскому обслуживанию."
 AUS_new_education_system: "Будущее образования"
 AUS_new_education_system_desc: "Человек делает открытие, ребёнок учится делать открытие. Мы должны обязательно прививать образование в раннем возрасте, иначе у нас будет меньше новаторов в будущем. Мы должны спасти птицу, а не задушить ее."
 AUS_destroy_the_concept_of_nation: "Уничтожить и воссоздать концепцию нации"
 AUS_destroy_the_concept_of_nation_desc: "Мы должны реформировать страну."Great Reforms", that will change the way our nation functions."
 AUS_national_personal_autonomy: "Национальная автономия"
 AUS_national_personal_autonomy_desc: "Мы позволим человеку владеть собой; он есть нация для самого себя и знает, что лучше для него самого; государство имеет право заставить человека сделать что-то, кроме того, что он антигуманист, и у нас не будет ненависти к какой-либо группе, потому что они имеют право на существование."
 AUS_religious_freedom: "Религиозная свобода"
 AUS_religious_freedom_desc: "Мы любим мусульман, христиан и евреев, а также всех других людей в равной степени, и это будет трудно осуществить, поскольку в нашей стране существует много ненависти, но мы изменим ненависть и превратим ее в признание."
 AUS_a_beacon_of_social_democracy: "Бикон социально-демократии"
 AUS_a_beacon_of_social_democracy_desc: "Ненависть раздавлена, повертка кватеризирована, и жизнь нашего народа улучшилась."
 AUS_form_the_arbeiterkammer: "Формировать Arbeiterkammer"
 AUS_form_the_arbeiterkammer_desc: "У нас есть люди, которые не всегда будут работать в интересах простого человека, поэтому у нас будет Палата труда, они будут обеспечивать, чтобы права трудящихся всегда соблюдались, и любой, кто их поймает, будет нести ответственность за судебное преследование."
 AUS_40_hour_week: "40-часовая неделя"
 AUS_40_hour_week_desc: "Работай умнее, а не дольше. Если у нас есть работники, которые чувствуют себя счастливыми, они будут счастливы, и у них будет время делать что-то, кроме работы. Хотя это не будет полезно во время войны, это будет очень полезно во времена мира."
 AUS_the_new_kaiser: "Новый Кайзер"
 AUS_the_new_kaiser_desc: "Радуйтесь, Австрийцы, ибо мы вернулись к нашим корням, правый наследник престола Отто фон Хадсбурга, и теперь у него есть власть спасать святую Австрию. Человек, обладающий амбициями, поклялся вернуть Австрию в дни славы Австрийской Империи."
 AUS_absolutism_is_what_we_need: "Корона и Меч"
 AUS_absolutism_is_what_we_need_desc: "Кайзер и военные будут одними."
 AUS_restore_the_name_of_the_kaiser: "Восстановите имя Кайзера"
 AUS_restore_the_name_of_the_kaiser_desc: "Мы докажем народу, что Кайзер - единственное правительство, Кайзер - это государство, люди узнают свое место, поскольку они не имеют права допрашивать Кайзера."
 AUS_the_kaiser_cult: "Культ Кайзера"
 AUS_the_kaiser_cult_desc: "Люди научятся любить Кайзера, будут клубы Кайзера, в которых мужчины и, возможно, женщины смогут обсуждать славу Кайзера и читать Библию, мы создадим культ личности над Кайзером, Отто любит свой народ."
 AUS_a_portrait_in_every_house: "Портрет в каждом доме"
 AUS_a_portrait_in_every_house_desc: "Отто фон Хадсбург постановил:"Now, every house shall have a portrait of the one true Kaiser in it." Obviously, this shall be totally enacted."
 AUS_make_a_deal_with_the_church: "Заключите сделку с церковью"
 AUS_make_a_deal_with_the_church_desc: "Мы заключим сделку с Церковью, возродим христианские традиции Австрии, и они признают Отто единственным истинным сувереном Австрии."
 AUS_castigate_the_nobility: "Кастигетировать целомудрие"
 AUS_castigate_the_nobility_desc: "Знатные люди не справились со своими обязанностями перед народом Австрии, и мы должны запланировать публичное порицание дворян, чтобы научить их своему месту и дать им понять, что они должны изменить свой путь."
 AUS_noblemen_you_are_the_generals: "Ноблемены, вы генералы!"
 AUS_noblemen_you_are_the_generals_desc: "Они должны принимать решения о том, кто должен жить и кто должен умереть, потому что простолюдин не мог сделать этот трудный выбор, запомните свои обязанности, дворяне Австрии!"
 AUS_nobility_war_games: "Войны соперничества"
 AUS_nobility_war_games_desc: "Мы откроем программы для генералов, чтобы они учили благородных сыновей путям войны, и это значительно улучшит наших стратегов."
 AUS_a_royal_army: "Королевская армия"
 AUS_a_royal_army_desc: "Ты будешь служить Кайзеру Отто фон Хадсбургу, посвятишь свою жизнь Богу, Кайзеру и Австрии, ибо все это благословенно, и мы будем слушаться только их повеления, и мы будем преуспевать."
 AUS_an_army_of_loyal_puppet: "Армия преданных кукол"
 AUS_an_army_of_loyal_puppet_desc: "Конечно, у Отто в этом есть некоторые гибридные мотивы, как если бы он справился с этим, он будет самым могущественным человеком в Центральной Европе, возможно даже в Европе в целом."
 AUS_i_dont_like_democracy: "Демократические активисты &lt; &lt; Круш &gt; &gt;"
 AUS_i_dont_like_democracy_desc: "Демократия была несбыточной мечтой Карла фон Хадсбурга, он пытался позволить людям с общим рождением править нацией Святой Австрии. Это в высшей степени сумасшествие. У простых людей никогда не будет способности управлять собой, они попадут в социализм или анархию. Мы знаем истинный путь к жизни."
 AUS_the_kaiser_government: "Правительство Кайзера"
 AUS_the_kaiser_government_desc: "Кайзер - это правительство. Но большинство из них живет в Отто, и никогда не оспаривает его суждения, как и совритяне Европы."
 AUS_destroy_democratic_movement: "Уничтожить Демократическое движение"
 AUS_destroy_democratic_movement_desc: "Единственный яд, который мы должны точно раздавить, который рождается изнутри, это Демократия. Ни один мужчина общего рождения (не говоря уже о женщине) никогда не сможет править им самим. Мы уничтожим этих революционеров без предубеждений."
 AUS_the_kaiser_the_court_and_the_nobility: "Задача, поставленная передо мной Господом"
 AUS_the_kaiser_the_court_and_the_nobility_desc: "Отто фон Хадсбург - это суеверный, избранный Господом, Богом Самым, во время Европы. Любой фасад демократии будет снят, Авто - это божественный Автократ Австрии."
 AUS_be_prepared: "Готовьтесь"
 AUS_be_prepared_desc: ""Men, we are marchiing to war, within these next few months. We understand fear, for fear is good, but we expect your trust, for I have worked these many years to gain it. We will regain our rightfull lands, in the name of God, Kaiser and Austria!""
 AUS_support_bohemian_monarchist: "Поддержка чешского монархиста"
 AUS_support_bohemian_monarchist_desc: "Мы пошлем помощь скромным габсбургским сторонникам на наших богемских землях, большинство из них - сутенеры, жаждущие вернуться в Габсбургскую корону."
 AUS_crown_or_war: "Воспроизвести Богемию"
 AUS_crown_or_war_desc: "Это гейм для Anchlus Böhmische Ergänzung. Мы вернем все наши законные земли на севере, наиболее важные из которых, Чехия. Если они откажутся, мы будем править на них Святой яростью."
 AUS_it_s_time_to_disassemble_hungary: "Пора разобрать Венгрию."
 AUS_it_s_time_to_disassemble_hungary_desc: "Пришло время отомстить за их предательство в конце Великой войны, и сейчас мы готовим планы нашего вторжения в Венгрию."
 AUS_demand_trasylvania: "Спрос на Трансильванию"
 AUS_demand_trasylvania_desc: ""
 AUS_this_time_your_crown_will_be_mine: "Разрушить Венгрию"
 AUS_this_time_your_crown_will_be_mine_desc: "На этот раз не будет Австрии-Венгрия, есть только Австрия."
 AUS_restore_older_border: "Реклиам Галисия"
 AUS_restore_older_border_desc: "Теперь мы должны взять на себя обязательства в отношении последнего удара: Галиция и любые земли Галицы, находящиеся в Польше, будут захвачены, а Польша будет покорена."
 AUS_italy_you_cant_run_away_you_are_mine: "Покорить Италию"
 AUS_italy_you_cant_run_away_you_are_mine_desc: "Мы наконец-то восстановим все наши итальянские земли, а не только венис, или венето, мы маршируем в Рим."
 AUS_i_have_always_hated_prussia: "Повторить Силезию из Германии"
 AUS_i_have_always_hated_prussia_desc: "Австрия всегда была затмена Берлином, и сейчас мы это исправим."
 AUS_we_are_holy_we_are_an_empire_we_are_the_heir_of_rome: "Мы - святые, мы - Империя, мы - наследники Рима."
 AUS_we_are_holy_we_are_an_empire_we_are_the_heir_of_rome_desc: "Мы - ЗПЧ, мы - Святая Римская Империя, многие годы завоеваний привели к этому дню, мы вновь объявим Святую Римскую Империю."
 AUS_this_time_the_balkans_will_be_our: "Покорить Балканы"
 AUS_this_time_the_balkans_will_be_our_desc: "Балканы покорятся священной мощи Кайзера Отто Великого, воссоединителя Австрии. Албания станет христианкой, сербы будут наказаны, и все остальные узнают австрийскую мощь."
 AUS_they_are_weak_they_are_stupid_they_are_ottomans: "Они слабые, тупые, оттоманцы."
 AUS_they_are_weak_they_are_stupid_they_are_ottomans_desc: "Последний кусочек головоломки. Мы выгоним мусульман из Европы в последний раз. Они будут покорены, и мы начнем процесс конверсии."
 AUS_reform_the_army: "Реформа армии"
 AUS_reform_the_army_desc: "Учитывая возможность возникновения конфликта в будущем, основные генералы выдвинули планы по реформированию армии, что принесет нам пользу, если позволит нам развернуть более специализированные подразделения." 
 AUS_the_austrian_army: "Австрийская армия"
 AUS_the_austrian_army_desc: "Австрийская армия должна будет внести существенные изменения в доктрину наших армий, и пока наши командиры разделятся между тактикой молнии с мобильной пехотой и танками, или тактикой осады и бомбардировок с тяжелой артиллерией, и наше обезвреживание может решить исход будущих войн."
 AUS_blietzkrieg: "Быстрая война"
 AUS_blietzkrieg_desc: "Война молнии - это предложение одного из наших генералов, Антона Кирбауэра, старого героя войны, который устал от старой тактики."
 AUS_sfp_doctrine: "Артиллерия есть будущее"
 AUS_sfp_doctrine_desc: "Эрхард Раус, полевой маршал Австрийской армии, предлагает стиль боя довольно статус-кво. юберлеген Феуеркрафт-Доктрин воспользуется могущественными горами Австрии, и опустошит адский огонь о тех, кто выступает против австрийской мощи!"
 AUS_land_doctrine: "Разработать новый план ведения войны"
 AUS_land_doctrine_desc: "Командир, которого мы выбрали, уже начал серию лекций, которые будут использованы для улучшения понимания генералами военной тактики, которую они выбрали."
 AUS_land_doctrine_2: "Новые пехотные тактики"
 AUS_land_doctrine_2_desc: "Генералы начали применять тактику, предложенную верховным командиром."
 AUS_land_doctrine_3: "Секрет проникновения"
 AUS_land_doctrine_3_desc: "Военнослужащие австрийской армии сейчас проходят подготовку по тактике, которая оказалась особенно полезной, будь то Великая огневая мощь или мобильная война, тактика инфильтрации используется для засады небольших групп солдат."
 AUS_panzer: "Австрийская цистерна-прототип"
 AUS_panzer_desc: "Некоторые дизайнеры предложили бронетранспортер, который не будет использоваться для защиты солдат, но будет использоваться для борьбы с наступательными боями."
 AUS_panzer_2: "Истинный танк"
 AUS_panzer_2_desc: "Мы работали много месяцев, но глава дизайнера дал нам рабочий, практический пример"panzer". These will be used in the army to fight highly offensive battles. This particular example shall also be used as a baseline for further improvement."
 AUS_motorized: "Пора заменить коня."
 AUS_motorized_desc: "Хотя, возможно, было бы заманчиво придерживаться традиции конных карет, мы начнем заменять эти кареты автомобилями моторными двигателями, что позволит нашим солдатам быстрее двигаться вокруг поля боя."
 AUS_mechanized: "Мощное транспортное средство"
 AUS_mechanized_desc: "В то время как панцер хорош для боевых действий, а грузовики - для перевозки войск, нам еще предстоит разработать специальный защитный транспорт для войск."
 AUS_motorized_army: "Моторизованная армия"
 AUS_motorized_army_desc: "Мы модернизировали инфраструктуру нашей армии, производственные и снабженческие линии. У нас есть не только армия, у нас самая быстрая в мире армия. Наша армия может передислоцироваться быстрее, чем большинство армий, чтобы подготовить марш. Наша армия - это определение мобильной армии."
 AUS_artillery: "Новые пушки"
 AUS_artillery_desc: "Полевой командир Раус разработал план модернизации нашей полевой артиллерии, у нас есть контакты с ведущими проектировщиками пушек, которые хотят предоставить нам инженеров, которые помогут нам в их разработке."
 AUS_artillery2: "Новый высоковзрывоопасный боеприпас!"
 AUS_artillery2_desc: "Теперь, когда само оружие было усовершенствовано, мы можем начать проектировать более совершенные боевые артиллерийские боеприпасы, что обеспечит бомбардировку наших целей в стиле."
 AUS_austrian_superior_artillery: "Лучшая артиллерия в мире"
 AUS_austrian_superior_artillery_desc: "В этом мире нет никаких сомнений. Австрийская армия не только имеет лучшую подготовку и лучшую дирижабль. У нас лучшая артиллерия в мире."
 AUS_new_radio: "Новые методы коммуникации"
 AUS_new_radio_desc: "Ученые пытаются использовать радио как военную технологию. Теперь мы можем отправлять сообщения быстрее, чем когда-либо раньше. Но улучшения будут сделаны. Они позволят нам иметь при себе портативные радиоприемники." 
 AUS_new_support_equipment: "Новое вспомогательное оборудование"
 AUS_new_support_equipment_desc: "Мы переработаем комплект материалов для полевых операций, который имеется у многих наших вспомогательных подразделений, с тем чтобы обеспечить дальнейшую специализацию в будущем."
 AUS_jagdkommando: "Ягдкомандо"
 AUS_jagdkommando_desc: "У Австрии всегда были хорошие солдаты, но у нас есть идея сделать их §Bbetter§!"
 AUS_austrian_military_tradition: "Австрийские военные традиции"
 AUS_austrian_military_tradition_desc: "Австрийская армия является одной из старейших в мире, и многие из наших более высокопоставленных генералов выступают за возрождение старых военных традиций, что будет способствовать укреплению морального духа наших подразделений и продемонстрирует наш патриотизм."
 AUS_austrian_airforce: "Австрийские военно-воздушные силы"
 AUS_austrian_airforce_desc: "В то время как австрийские военно-воздушные силы существуют, они не отвечают... стандартам армии, нам нужно провести некоторые крупные реформы военно-воздушных сил, которые помогут их дальнейшему развитию."
 AUS_air_doctrine: "План полета"
 AUS_air_doctrine_desc: "Начальник военно-воздушных сил заложит наши окончательные основы доктрины Воздуха, которую мы будем использовать в будущем."
 AUS_air_doctrine2: "Координация деятельности подразделений"
 AUS_air_doctrine2_desc: "В настоящее время мы проводим теоретические реформы, которые оказались в основном успешными."
 AUS_bomber: "Новый тип самолета"
 AUS_bomber_desc: "Мы будем реформировать доктрину стратегического уничтожения противника, бомбить их фабрики, аванпосты, даже линии снабжения и дороги."
 AUS_bomber2: "§YFire§! и §Obrimstone§!"
 AUS_bomber2_desc: "Наши враги будут бояться австрийского бомбардировщика, ударяющего ночью, бомбардирующего города к земле, но наши пилоты имеют честь не атаковать гражданские здания... намеренно, мы не можем объяснить, что бомбы сброшены в темноту."
 AUS_fighter: "Улучшить нашего боя"
 AUS_fighter_desc: "Мы должны убедиться, что враг не сможет удержать свечу в наших ВВС, мы взорвем их бомбардировщики с неба, и все враги будут знать страх австрийских ВВС."
 AUS_fighter2: "Воздушная огневая мощь"
 AUS_fighter2_desc: "Больше оружия, быстрее двигателей и лучшей навигации. Это все, что нам нужно, чтобы обеспечить победу в воздушной войне."
 AUS_cas: "Самолет пехоты"
 AUS_cas_desc: "Мы позаботимся о том, чтобы появились новые планы по оказанию помощи нашим войскам в борьбе с войсками другой стороны."
 AUS_aa: "Мы должны защищать небо."
 AUS_aa_desc: "В то время как наши бомбардировщики боятся, наши обычные военно-воздушные силы были найдены немного недостающими, чтобы дополнить это, мы создадим АА в большинстве крупных населенных пунктов, а также улучшим наши проекты АА."
 AUS_radar: "Мы можем их обнаружить."
 AUS_radar_desc: "У нас есть могучие истребители, но они часто летают на самолете вдали от дома, поэтому мы собираемся установить ряд радаров и усовершенствовать их дизайн, чтобы наши бойцы знали, когда на родине будет огонь."
 AUS_navy: "Восстановление ВМС"
 AUS_navy_desc: "С тех пор, как мы потеряли береговую линию Италии, они взяли с собой любой флот, который у нас был, поэтому мы будем работать с нуля, чтобы построить новое австрийское военно-морское традицию."
 AUS_sub: "План тишины смерти"
 AUS_sub_desc: "Мы будем строить наш флот, используя в основном подводные лодки."
 AUS_sub2: "Уничтожитель заговоров"
 AUS_sub2_desc: "Другое преимущество этих кораблей в том, что мы сможем потопить гражданские торговые корабли, которые заваливают Средиземное море."
 AUS_carrier: "План перевозчика"
 AUS_carrier_desc: "Мы можем использовать эти корабли в качестве больших авиабаз, а затем бомбить их корабли."
 AUS_carrier2: "Плавающая авиабаза"
 AUS_carrier2_desc: "Наши корабли будут патрулировать моря, в то время как наши самолеты спустятся, как осы, удавляя врага в подчинение."
 AUS_bb: "План плавательной крепости"
 AUS_bb_desc: "Вместо карьеров или подводных лодок мы будем придерживаться более обычного подхода: флот будет состоять из кораблей &lt; &lt; Голубой воды &gt; &gt; . Это будет трудно построить, но в конце концов оно будет стоить того."
 AUS_bb2: "Улучшить боевой корабль"
 AUS_bb2_desc: "Мы наймем ученых, чтобы улучшить корпус наших кораблей."
 AUS_grand_navy: "Великий ВМС"
 AUS_grand_navy_desc: "Наш военно-морской флот, который в настоящее время обладает самым полным потенциалом, вскоре начнет боевые действия, и мир узнает о мощи австрийского флота."
 AUS_naval_doctrine: "Улучшить нашу морскую доктрину"
 AUS_naval_doctrine_desc: "Мы прочитаем нашим адмиралам лекцию об использовании выбранного нами морского пути, его преимуществах и недостатках, что позволит нам более эффективно осуществлять их."
 AUS_naval_doctrine2: "Новые методы координации"
 AUS_naval_doctrine2_desc: "Теперь мы научим наши флоты и экипажи, как реализовать эти идеи, как координировать удары и как использовать нашу доктрину в максимально возможной степени."
 AUS_dockyard: "Улучшить наши докьярды"
 AUS_dockyard_desc: "Наш лидер лично смирился (не менее дорого для себя) с рядом фабрик и сухогрузов, которые будут использоваться при строительстве нашего Величественного флота."
 AUS_revive_the_industrial_sector: "Возрождение промышленного сектора"
 AUS_revive_the_industrial_sector_desc: "Доверенный промышленник предложил нам активизировать нашу промышленность, субсидируя исследовательские проекты, что позволит нам поставить нашу промышленность выше других, менее развитых в технологическом отношении стран."
 AUS_improve_civilian_sector: "Совершенствование гражданской промышленности"
 AUS_improve_civilian_sector_desc: "Гражданская экономика будет улучшена за счет строительства заводов в некоторых менее развитых частях страны."
 AUS_new_infrastructures: "Новые инфраструктуры"
 AUS_new_infrastructures_desc: "Для обеспечения быстрого и безопасного передвижения нашего населения и наших военных будет построен ряд дорог, железных дорог и мостов, что также будет способствовать расчистке промышленных земель."
 AUS_new_industrial_complex: "Новый промышленный комплекс"
 AUS_new_industrial_complex_desc: "Усилия по индустриализации были столь эффективными, что целые регионы стали промышленно развитыми, что это не только создает новые рабочие места и фабрики, но и означает, что инфраструктура в различных регионах улучшается."
 AUS_contract_with_steyr: "Контракт со Стейром"
 AUS_contract_with_steyr_desc: "Мы предложили Штейр-Маннлихтеру купить несколько их заводов, и взамен они будут включены в список приоритетных для субсидий на управление."
 AUS_new_arms_factory: "Новые оружейные фабрики"
 AUS_new_arms_factory_desc: "Правительство предложило построить ряд военно-промышленных заводов, что поможет нам в возможности конфликта, связанного с получением доходов, и в то же время обеспечит ряд рабочих мест для населения."
 AUS_a_belligerant_industry: "Индустрия по производству беллигантов"
 AUS_a_belligerant_industry_desc: "Экономика военно-промышленного комплекса Австрии является зоной интенсивной конкуренции. &quot; Корпараты &quot; борются за субсидии, совершенствуя свои производственные линии, в то время как группа бешеных инспекторов следит за тем, чтобы ограниченные права трудящихся были сохранены. &quot; Эта капиталистическая экономика &quot; демонстрирует большие перспективы."
 AUS_improve_the_wien_university: "Улучшить Университет Вин"
 AUS_improve_the_wien_university_desc: "Венский университет стеснился и недофинансировался, наш лидер выделил значительную сумму государственного финансирования на ремонт этого прекрасного места, что даст нам самые яркие умы на этой стороне Дуная!"
 AUS_mine_new_recources: "Новые ресурсы"
 AUS_mine_new_recources_desc: "Мы обнаружили, что нам особенно недостает добывающей промышленности, и, таким образом, значительно увеличили финансирование наших сталелитейных рудников в стране. Почти наверняка, что в конечном итоге они сами заплатят за себя."
 AUS_develop_wien: "Разработать Wien"
 AUS_develop_wien_desc: "Столица Австрии однажды станет столицей Европы, и мы позаботимся о том, чтобы она выглядела именно так: дороги, фабрики, железные дороги, все это будет построено как крупнейший и величайший город в мире!"
 AUS_we_need_oil: "Нам нужно масло"
 AUS_we_need_oil_desc: "В то время как Австрия и даже сама Европа не являются богатым нефтью регионом, инновации в Искусственной нефти оказались в интересах нашего правительства, они решили, что инвестиции в исследования и разработки увлекательной промышленности будут весьма щедрыми."
 AUS_a_great_reseach_center: "Великий исследовательский центр"
 AUS_a_great_reseach_center_desc: "Венский университет не только был отремонтирован, он быстро становится крупнейшим в Европе. Мы собираемся увеличить финансирование Университета более чем на 200%. Это будет место, где люди посылают лучшие умы в мире. Все дороги ведут в Вену!"
