 AUS_clericalism_desc: "Наших людей учат тому, что ненавидеть, бояться и любить во имя Бога. (Пожалуйста, обратите внимание, что это очень дерзкая IRL. Принуждение к религии плохо, но сама религия в порядке.)"
 AUS_heimwehr: "Heimwehr"
 AUS_heimwehr_desc: "Хеймвер - это наша военизированная группировка."stability" and "peace". In all honesty they are blood-thirsty thugs, that want to kill anyone they disagree with. We can work with that."
 AUS_clerical_education_idea: "Канцелярское образование"
 AUS_clerical_education_idea_desc: "Сегодня вы не можете узнать о чем-то другом, Ханс, пришло время узнать о четвертом крестовом походе."
