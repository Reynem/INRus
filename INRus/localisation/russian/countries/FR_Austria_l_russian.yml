 #EVENTS
 austria.1.t:"Статус Австрии"
 austria.1.d: "В 1914 году Австрийская коммунистическая держава вступила в Великую войну с большими надеждами на победу, чтобы утвердить свое господство над Сербией и отомстить за жизнь эрцгерцгерцога. Однако, не все были хороши для них, так как они оказались брошены назад все больше и больше на всех фронтах. В конце концов, когда граждане Империи поняли, что война закончилась для австро-венгерской монархии, права этнических меньшинств были расширены, так как все более либеральные политические деятели взяли под свой контроль в Вене и Будапеште. В прошлом, в прошлом, в прошлом, в прошлом, в прошлом, в прошлом, в прошлом, в прошлом, в ординарном ординарном поколении, в котором были заядлы в пользу левых, профидентов. В конце концов, он признал право австрийского народа на определение формы государства. Он также отказался от права участвовать в австрийских делах. Он также уволил Ламаш и его правительство из офиса и освободили должностных лиц в австрийской половине империи от их клятвы."
 austria.1.a: "Мы должны делать свой выбор осторожно."
 austria.2.t: "Выборы 1937 года"
 austria.2.d:"После окончания Великой войны, когда Австрия стала самостоятельной, независимой страной, социал-демократическая коалиция помогает модернизировать и вдохновить народ этой страны, после такого ужасного события, однако, коалиция быстро развалилась, и раскол стал все более и более интенсивным, и многие партии сформировали свои собственные военизированные формирования, в конечном итоге это привело к серии политических протестов, которые закончились гибелью 89 протестующих."
 austria.2.a: "Коалиция СДАПЁ-КПЕ"
 austria.2.b: "КСП"
 austria.2.c: "Коалиция &lt; &lt; КСП-Хеймвехр &gt; &gt;"
 austria.3.t: "SDAPO ищет коалицию с KPO"
 austria.3.d: "В свете недавних выборов СДАПО стремится создать коалицию с социалистической партией КПО, чтобы помочь как повысить популярность, так и поддержать социалистические идеалы в Австрии, и, надеюсь, победить других реакторов и консерваторов."
 austria.3.a: "Соглашение не достигнуто, коалиция не сформирована."
 austria.3.b: "СДАПО и КПО соглашаются сформировать коалицию."
 austria.4.t: "Статус Коалиции"
 austria.4.d: "На недавних выборах СДАПО и КПО противостоят друг другу, основываясь на своих различных социалистических платформах."
 austria.4.a: "СПППО уважает Коалицию и соглашается с некоторыми реформами."
 austria.4.b: "СПАПЮ правит в одиночку!"
 austria.4.c: "КПЁ получает большинство!"
 austria.5.t: "Разрыв на валькистах и немецких агитаторах"
 austria.5.d: "С тех пор, как [ГЕР.Главный лидер] пришел к власти в Германии, его фанатические крики объединить всех немцев давно угрожают суверенности и существованию нашей нации. К сожалению, эти идеалы, крики Адама Дрезслера, поразили многие валькисты и немцы в нашем районе, и они продолжают угрожать нашей стабильности и процветанию. Мы должны наказать этих людей, чтобы устранить любые угрозы нашей нации, и поэтому мы можем продолжать существовать как единое целое."
 austria.5.a: "Положите их за решетку!"
 austria.6.t: "Возведение инакомыслия с радикально-левого фронта"
 austria.6.d: "После последних выборов радикальные левые члены решительно выступили против них и нас, что привело к многочисленным протестам, беспорядкам и другим формам политической агрессии в сельской местности."
 austria.6.a: "По крайней мере, волнуюсь."
 austria.7.t: "Критические беспорядки в Вьене!"
 austria.7.d: "Сегодня мы видим первый пример этого: в Вьене, в нашей славной столице, местные члены ППО окружили здание нашего парламента и в настоящее время проводят массовые беспорядки, и, как представляется, в таких серьезных ситуациях мы можем использовать лишь самые крайние меры."
 austria.7.a: "Разверните армию!"
 austria.8.t: "Кубок социалистов"
 austria.8.d: "После развертывания армии в знак протеста австрийский народ становится все более и более параноичным и опасается, что он может привести страну к гражданской войне, в результате чего националисты взяли власть, чтобы обеспечить стабильность внутри страны и раз и навсегда раздавить радикалы."
 austria.8.a: "Наш народ должен быть защищен от безбожных левых!"
 austria.9.t: "Австрийская гражданская война"
 austria.9.d: "Похоже, что все наши попытки остановить восстание между социалистами, к сожалению, провалились. После того, как национальные популисты захватили власть в нашей стране, это только еще больше разозлило левых радикалов, и теперь различные ополчения и профсоюзы взяли под свой контроль различные районы по всей стране. Наихудшее уже наступило для нашей нации. Теперь мы должны решить, как действовать дальше."
 austria.9.a: "Мы не можем справиться с этим в одиночку; объединиться с Германией!"
 austria.9.b: "Мы сами опустим этих социалистов!"
 austria.10.t: "Австрийцы обращаются с просьбой об объединении"
 austria.10.d: "Среди многих наших граждан они, кажется, довольно апатичны к сражениям и участию в гражданской войне сами по себе. Многие из них считают, что нас слишком много, и что лучше всего было бы объединиться с Валькистским Рейхом, так что в конечном итоге мы сможем обеспечить мир и стабильность для австрийского народа, несмотря ни на что."
 austria.10.a: "Примите, и мы покажем пример этих восставших коллективистов."
 austria.10.b: "Увольняйся, социалисты пугают, Австрия сама по себе."
 austria.11.t: "Возведение несогласия с умеренным левым"
 austria.11.d: "По мере того, как проходят дни, кажется, что не только радикалы не удовлетворены нынешним состоянием нашего правительства."
 austria.11.a: "Относительно."
 austria.12.t: "Индустриализация Австрии"
 austria.12.d: "В последнее время мы наблюдаем рост угроз со стороны окружающих нас стран, таких, как Германия и Венгрия, многие граждане и политики считают, что в настоящее время нам следует инвестировать в эту индустрию большое количество наших ресурсов, с тем чтобы как увеличить процветание наших стран, так и повысить безопасность, однако есть и другие политики, которые считают, что эти деньги лучше было бы потратить где-то еще, как наши военные, или различные другие проекты."
 austria.12.a: "Пропустите закон."
 austria.12.b: "Это беспочвенно и спорно."
 austria.13.t: "Беспорядки в сельской местности"
 austria.13.d: "По мере того, как проходят дни, ситуация не становится намного лучше для Австрии, количество политических волнений уходит не только из городов, но и из сельской местности и в различные сельские районы, и, как представляется, в это время ни один австрийец, независимо от его богатства, статуса или места, не может быть в безопасности от конфликта."
 austria.13.a: "К сожалению, с этим мало что можно сделать."
 austria.14.t: "Heimwehr получает тягу"
 austria.14.d: "Среди нового политического кризиса, который происходит в нашей стране, появился старый враг, старая консервативная полувоенная организация, Хеймвехр, вернулась, более сильная и популярная тогда, когда-либо."
 austria.14.a: "Мы не можем позволить реакционным собакам бросить нам вызов!"
 austria.15.t: "Геймвер штурмует Федеральный Совет!"
 austria.15.d: "Террор ударил сегодня! Хеймвер уже долгое время является самой большой угрозой для нас, и наши попытки выгнать их были очень безуспешны. Однако худшее уже произошло, так как сегодня они штурмовали и захватили контроль над нашим Федеральным советом. Мы не уверены в том, что произойдет дальше, но мы уверены, что это не будет красиво..."
 austria.15.a: "Я - Федеральный Совет!"
 austria.16.t: "Австрийская гражданская война"
 austria.16.d: "После того, как Хеймвер захватил власть в Австрии, у левых партий появилась короткая, но достаточно большая возможность встать против того, что станет новым, реакционным правительством."
 austria.16.a: "Хеймвер пытается объединиться с Германией!"
 austria.16.b: "Хеймвер решает сражаться в одиночку!"
 austria.17.t: "Скирмиши с Хеймвером"
 austria.17.d: "Пытаясь положить конец этой полувоенной организации, мы развернули наши вооруженные силы в районе, где мы заметили большое количество активности Хеймвехра."
 austria.17.a: "Черт!"
 austria.18.t: "Сломать Геймвехр и Валькиста"
 austria.18.t: "После того, как мы наконец обеспечим наше правительство, мы должны наконец положить конец тем немногим, кто остается от реакционных сил."
 austria.18.a: "Это, безусловно, не приведет к каким-либо последствиям."
 austria.19.t: "Очистка социально-националистов"
 austria.19.d: "Однако реакционные силы являются не единственной угрозой для нашего правительства, радикальные элементы и националисты Австрии могут стать еще более опасными, если их не остановить, и могут создать для нас в будущем растущую нестабильность. Мы должны избавить их от своего кабинета, так что этого никогда не случится с нами."
 austria.19.a: "Радикалов надо убрать!"
 austria.20.t: "Очистка австро-марксистов"
 austria.20.d: "Даже в нашей собственной фракции мы видим постоянную вражду. Мы все социалисты, но, к сожалению, мы не едины в солидарности. Многие из них придерживаются разных убеждений в том, как проводить экономику, которая лучше всего подходит для пролетариата, и австро-марксисты, несомненно, являются примерами этого. Чтобы создать идеальное общество по нашему образу, они должны быть удалены."
 austria.20.a: "Радикалов надо убрать!"
 austria.21.t: "Геймвер бунтует по всей стране!"
 austria.21.d: "Похоже, что даже после наших чисток были некоторые умные остатки, которым удалось ускользнуть от нас."
 austria.21.a: "О боже, как я мог ожидать инакомыслия от людей, которых я очистил, это безумие."
 austria.22.t: "Австрия в Беспокойстве"
 austria.22.d: "Это был бы благоприятный момент для вмешательства и объединения наших наций, какими они всегда должны были быть."
 austria.22.a: "Вмешайтесь и попытайтесь захватить Австрию."
 austria.22.b: "Мы не можем рисковать гневом Консенс."
 austria.23.t: "Немецкие силы движутся в Австрию!"
 austria.23.d: "Мы только что получили сообщения о том, что немецкие войска передвигались через Дунай, при нормальных обстоятельствах это означало бы войну, но мы находимся в крайне тяжелом положении."
 austria.23.a: "Мы не можем сопротивляться... мы сломлены..."
 austria.23.b: "Если они хотят нашу землю, им придется сражаться с нами!"
 austria.24.t: "Успешное занятие"
 austria.24.d: "По всей стране люди славят Дресслера как своего"Führer" and sing praises to the Fatherland."
 austria.24.a: "Мы на шаг ближе к объединению немецкого народа!"
 austria.25.t: "Австрийское сопротивление!"
 austria.25.d: "Австрийцы решили, что они скорее столкнутся с немецкой сталью, чем сдадутся. Они занимают сильную оборонительную позицию в Альпах, но, конечно, этого было бы недостаточно, чтобы остановить нападение немецкой армии."
 austria.25.a: "Разрушь Австрийцев, это значит "Война"!"
 austria.25.b: "Отзовите наши войска!"
 austria.26.t: "Переговоры с валькистами"
 austria.27.d: "Мы решили начать переговоры с валькистами."
 austria.26.a: "Разногласия могут быть урегулированы только на основе понимания."
 austria.27.t: "Уничтожение австромарксистов"
 austria.27.d: "Мы недавно развернули Хеймвер в различных известных местах для австромарксистов, мы больше не будем мириться с этими пиявками, питающимися нашей великой нацией!"
 austria.27.a: "Я лгала о том, что я понимаю оппозицию."
 austria.28.t: "Статус Геймвехра"
 austria.28.d: "Геймвер был создан для поддержания порядка и выполнения функций постоянной армии в чрезвычайных ситуациях, однако настало время решить, служить ли ему более важной цели, чем эта."
 austria.28.a: "Хеймвер был назначен Национальной полицией."
 austria.28.b: "Гейматблок получает большинство в Коалиции."
 austria.28.c: "Они руководят вместе с криминалом."
 austria.29.t: "Неудавшийся валькистский кубок"
 austria.29.d: "Сегодня утром был остановлен конвой, провозивший оружие через границу, машина и команда были немцами из Валькистского Рейха на севере, которые привели нас к тайному месту встречи, где различные валькистские заговорщики планировали захватить контроль над нашей нацией и объединиться с немцами."
 austria.29.a: "Мы пытались понять тебя..."
 austria.30.t: "Левые восстания по всей стране!"
 austria.30.d: "Рано утром, когда началась простая забастовка за улучшение условий труда, вскоре она переросла в массовое национальное восстание левых."
 austria.30.a: "Черт!"
 austria.31.t: "Австрийская гражданская война"
 austria.31.d: "С учетом того, что наша страна находится на грани полного краха, возможно, было бы разумно рассмотреть вариант объединения с Германией."
 austria.31.a: "Мы не можем справиться с этим в одиночку; объединиться с Германией!"
 austria.31.b: "Нет нужды."

 #Military Foci

 AUS_army_effort: "Уничтожить бундешера"
 AUS_army_effort_desc: "С ростом напряженности вокруг Глобуса мы должны обеспечить, чтобы наши военные оставались достаточно сильными, чтобы защитить себя в случае возникновения необходимости."
 AUS_soldier_effort: "Сосредоточься на наших солдатах"
 AUS_soldier_effort_desc: "Солдат и его винтовка - это те, кто в настоящее время побеждает во всех вооруженных конфликтах."
 AUS_equipment_effort: "Найдите замену Манлихеру M1895"
 AUS_equipment_effort_desc: "М1895 хорошо служили нам во время Первой мировой войны, мы должны найти что-то более современное, чтобы сохранить его наследие."
 AUS_equipment_effort_2: "Отправьте MG08 в отставку"
 AUS_equipment_effort_2_desc: "Глядя на Германию, которая успешно протестировала новые формы пулемётов, мы должны попытаться изобрести новую машинную пушку самостоятельно."
 AUS_equipment_effort_3: "Инвестирование в ГСМ"
 AUS_equipment_effort_3_desc: "Технические инженеры Манличерской компании привезли протуайпу полностью автоматического так называемого Submachinegun, мы должны вложить в это и оснастить нашу Sturmtruppen этим оружием, чтобы дать нам преимущество на поле боя."
 AUS_special_forces: "Расширить Alpinjäger"
 AUS_special_forces_desc: "Альпеньягер - элита нашей армии, расширяя и модернизируя их, мы можем защитить горы от любого врага."
 AUS_arms_imports: "Импорт иностранного оружия"
 AUS_arms_imports_desc: "Наша индустрия не в состоянии успешно содержать нашу военную технику, оснащенную самым современным оборудованием."
 AUS_recruitment: "Более благоприятные условия для наших солдат"
 AUS_recruitment_desc: "Увеличивая зарплату наших солдат и улучшив казармы и условия их жизни, мы сможем обеспечить, чтобы в армию пополнилось число людей."
 AUS_motorization_effort: "Инвестирование в Австро-Деймлер"
 AUS_motorization_effort_desc: "Австро-Деймлер предложил построить грузовой автомобиль, специально предназначенный для использования в военных целях."
 AUS_mechanization_effort: "Расширение научно-исследовательских центров &lt; &lt; Австро-Деймлерс &gt; &gt;"
 AUS_mechanization_effort_desc: "Расширяя научно-исследовательские объекты Австро-Деймлера, мы сможем расширить наши исследования на поле Моторизации."
 AUS_armor_effort: "Пэнзеры"
 AUS_armor_effort_desc: "Глядя на основные державы Европы, мы должны сражаться, чтобы построить наши собственные танки и расширить отдел Шнелле, наши Панзеры будут защищать Австрию от любых угроз внутри и без."
 AUS_officer_effort: "Подготовка нового поколения сотрудников"
 AUS_officer_effort_desc: "Несмотря на то, что наша старая гвардия очень умеет решать проблемы, связанные с тем, что они являются ОНЗ, а не Гвардией ЮНГ, которая все еще продолжает существовать."
 AUS_doctrine_effort: "Создание специальных военных курсов"
 AUS_doctrine_effort_desc: "Благодаря тому, что большинство наших старших офицеров обучают новых офицеров способам ведения войны, мы можем обеспечить, чтобы наше новое поколение офицеров было хорошо обучено."
 AUS_doctrine_effort_2: "Исследования иностранных военных теорий"
 AUS_doctrine_effort_2_desc: "Создавая специализированную команду для изучения и понимания иностранных военных теорий, мы можем эффективно интегрировать их в наш собственный способ ведения войны."
 AUS_doctrine_effort_3: "Совместные военные исследования"
 AUS_doctrine_effort_3_desc: "Поскольку мы теперь можем создать современную армию, мы также должны быть в состоянии должным образом координировать их."
 AUS_mil_industrial_complex: "Расширить нашу военную промышленность"
 AUS_mil_industrial_complex_desc: "Создавая новые фабрики, мы можем должным образом модернизировать наши вооруженные силы."
 AUS_reform_officer_corps: "Отпуск в связи с учебой для сотрудников"
 AUS_reform_officer_corps_desc: "Благодаря тому, что наши молодые офицеры посещают зарубежные страны и учатся своим военным методам, мы можем обеспечить, чтобы они более гибко мыслили и могли лучше реагировать на неизвестные ситуации."
 AUS_reform_supply_lines: "Создание военной железнодорожной системы"
 AUS_reform_supply_lines_desc: "Во время первой мировой войны наша военная инфраструктура была настолько плоха, что нам пришлось использовать гражданские поезда, чтобы добраться до фронта."
 AUS_national_training_school: "Создание Венского оффизьера"
 AUS_national_training_school_desc: "Создав совершенно новую Академию с лучшими из наших офицеров и учителей, мы можем дать нашим офицерам знания, которые они нуждаются и заслуживают."

 AUS_aviation_effort: "Нашел Луфтстрейткрэфте"
 AUS_aviation_effort_desc: "Сделав наши военно-воздушные силы отдельным подразделением, мы сможем расширить их в гораздо большей степени."
 AUS_CAS_effort: "Увеличение финансирования в Стурмкрэхе"
 AUS_CAS_effort_desc: "Sturmkrähe — прототип самолёта, который, согласно его изобретателю, должен обеспечивать ближайшую воздушную поддержку, падая при полете и сбрасывая бомбы на наших врагов с низкой высоты."
 AUS_aviation_effort_2: "Расширить наши аэродромы"
 AUS_aviation_effort_2_desc: "Чем больше аэродромов у нас есть, тем больше самолётов мы можем хранить и использовать."
 AUS_fighter_focus: "Инвестировать в современных борцов"
 AUS_fighter_focus_desc: "Нам нужно модернизировать наш авиафлот, чтобы включить новые Моноплейны, которые лучше, чем наши старые Бипланы."
 AUS_bomber_focus: "Создать бомбардировку"
 AUS_bomber_focus_desc: "Изучая и производя так называемых тактических и стратегических бомбардировщиков, мы можем привести борьбу в дома наших врагов."
 AUS_NAV_effort: "Возрождение Küstengruppen"
 AUS_NAV_effort_desc: "Новые исследования в области военно-морской авиации позволяют нам оживить Кюстенгруппен и предоставить им оборудование и знания о том, как правильно бороться с врагами Конвойс и Корабли"
 AUS_rocket_effort: "Расширить Ракетентестгеланде Арлберг"
 AUS_rocket_effort_desc: "По словам наших ученых, мы должны значительно расширить наши исследования в ракетной технологии. Они даже говорят, что однажды самолёты могут быть запущены ими. Давайте посмотрим, к чему это приведет."

 AUS_naval_effort: "Нашел бундесмарину."
 AUS_naval_effort_desc: "У нас, наконец, снова есть прибрежный регион. Инвестирование в этот регион дает нам возможность наконец-то построить флот. Ворвартс Остеррейх!"
 AUS_flexible_navy: "Держите флот гибким."
 AUS_flexible_navy_desc: "Имея флот эсминцев, малых крейсеров и подводных лодок, мы можем использовать Средиземное море в своих интересах и прерывать поставки противника без больших проблем."
 AUS_large_navy: "Восстановить бывшую славу"
 AUS_large_navy_desc: "Наращивая наш ВМС до величия старого кайсерлихского моря, мы заменим Италию и Соединенное Королевство единоличными правителями Средиземного моря."
 AUS_cruiser_effort: "Панцерреузер 38"
 AUS_cruiser_effort_desc: "Мы подготовили проекты для нового круизера для нашего флота."
 AUS_submarine_effort: "Новые подводные лодки"
 AUS_submarine_effort_desc: "Инвестирование в новые подводные лодки является первым шагом к тому, чтобы уберечь Средиземное море от вражеских кораблей и конвойов."
 AUS_capital_ships_effort: "Новый капиталистический корабль"
 AUS_capital_ships_effort_desc: "Давайте построим новый флаг для нашего флота, который настолько велик и могуществен, что запугает сердца наших врагов."
 AUS_destroyer_effort: "Современные разрушители"
 AUS_destroyer_effort_desc: "Наличие современных разрушителей позволит нам надлежащим образом сопровождать наши военно-морские конвои и эффективно бороться с вражескими подводными лодками и малыми кораблями."

 #Industry

 AUS_industrial_effort: "Уничтожить нашу индустрию"
 AUS_industrial_effort_desc: "Субсидируя нашу промышленность, мы сможем конкурировать на мировом рынке с остальной Европой."
 AUS_construction_effort: "Расширение гражданской промышленности"
 AUS_construction_effort_desc: "Мы должны инвестировать в нашу гражданскую промышленность для борьбы с экономическим кризисом последних месяцев."
 AUS_construction_effort_2: "Инвестировать в нишевые поля"
 AUS_construction_effort_2_desc: "Субсидируя нишевые поля, мы можем сохранить преимущество современной технологии."
 AUS_construction_effort_3: "Австрийский дух предпринимательства"
 AUS_construction_effort_3_desc: "Устранив некоторые ограничения на создание компании, мы можем еще больше укрепить нашу гражданскую индустрию."
 AUS_infrastructure_effort: "Улучшить железнодорожный транспорт"
 AUS_infrastructure_effort_desc: "Благодаря модернизации наших железных дорог мы можем обеспечить более эффективное управление как военным, так и гражданским транспортом."
 AUS_infrastructure_effort_2: "Построить австрийские автомагистрали"
 AUS_infrastructure_effort_2_desc: "Поскольку все больше и больше людей покупают автомобили, мы должны соединять наши города с так называемыми автомагистралями, чтобы гарантировать быструю поездку между нашими городами."
 AUS_production_effort: "Расширить Steyer"
 AUS_production_effort_desc: "Расширяя некоторые компании, мы можем использовать наши капабилитации еще лучше."
 AUS_production_effort_2: "Расширить Маннлихер"
 AUS_production_effort_2_desc: "Расширяя некоторые компании, мы можем использовать наши капабилитации еще лучше."
 AUS_production_effort_3: "Расширить Puch"
 AUS_production_effort_3_desc: "Расширяя некоторые компании, мы можем использовать наши капабилитации еще лучше."
 AUS_secret_weapons: "Экспериментальные исследования на местах"
 AUS_secret_weapons_desc: "Финансирование исследований в экспериментальных полях позволяет нам еще лучше понять современные боевые действия."
 AUS_extra_tech_slot: "Нашел новый университет в Инсбруке"
 AUS_extra_tech_slot_desc: "Новый Инсбрукерский университет обучит следующее поколение нашей научной элиты."
 AUS_extra_tech_slot_2: "Создать научные круги"
 AUS_extra_tech_slot_2_desc: "Создавая научные круги, которые работают в конкретных областях, мы можем еще больше расширить наши возможности."

 #Political

 AUS_political_effort: "Починить крыльев"
 AUS_political_effort_desc: "Наша славная Ёстеррейх теперь разделенная нация, разделенная между социалистами, консервантами и автократическими геймверами, их различные образы мышления делают их пути в каждом домашнем хозяйстве. Мы должны исправить эти разломы как можно лучше."
 AUS_collectivist_ethos_kr: "Вернемся к старой Славе."
 AUS_collectivist_ethos_kr_desc: "Объединяя наши народы против угроз, которые представляет современный мир, мы сможем вернуться к Славе прошлых дней."
 AUS_liberty_ethos_kr: "Поощрение демократии"
 AUS_liberty_ethos_kr_desc: "Таким образом, Австрия останется маяком либерализма в этом темном мире."
 AUS_militarism: "Используйте Heimwehr в качестве полиции"
 AUS_militarism_desc: "Используя людей Хеймвера для поддержки наших полицейских сил, мы можем обеспечить эффективную борьбу с преступными элементами нашей нации."
 AUS_military_youth: "Создание молодежной организации"
 AUS_military_youth_desc: "Мы должны создать молодежную организацию, с тем чтобы должным образом подготовить нашу молодежь к работе в Австрии."
 AUS_ideological_fanaticism: "Присяга верности"
 AUS_ideological_fanaticism_desc: "Каждый военнослужащий наших вооруженных сил теперь должен поклясться в верности нашему лидеру, что это обеспечит абсолютную дисциплину и выкорчевывает слабоумных."
 AUS_national_identity: "Создать Австрийское наследие"
 AUS_national_identity_desc: "Мы должны гордиться тем, что наша молодая нация смогла пережить в годы после окончания первой мировой войны."
 AUS_technology_sharing: "Покупка иностранных лицензий"
 AUS_technology_sharing_desc: "Мы импортируем иностранные технологии и товары, чтобы их проанализировать."
 AUS_rights_of_man: "Расширять личные свободы"
 AUS_rights_of_man_desc: "Свободный человек не будет легко становиться жертвой экстремистских тенденций, обеспечивая свободу нашего населения, мы сможем бороться с экстремистами без каких-либо уступок со стороны либо социалистов, либо автократов."
 AUS_liberty_research: "Либеральная школа мысли"
 AUS_liberty_research_desc: "Представив нашим университетам и ученым более либеральный образ мышления, мы можем гарантировать, что они не будут работать на наших врагов, а будут работать на благо богатства австрийской нации и ее народа."
 AUS_welfare: "Внедрение систем обеспечения жизни и быта"
 AUS_welfare_desc: "Благодаря внедрению национальных систем социального обеспечения мы можем обеспечить, чтобы нормальный работник не эксплуатировался алчными мужчинами."


