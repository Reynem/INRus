 ### Characters ###

 AUS_alfred_klahr: "Альфред Клахр"
 AUS_pierre_ramus: "Пьер Рамус"
 AUS_friedrich_adler: "Фридрих Адлер"
 AUS_karl_renner: "Карл Реннер"
 AUS_wilhelm_miklas: "Вильгельм Миклас"
 AUS_franz_dinghofer: "Франц Дингофер"

 AUS_karl_von_habsburg: "Карл фон Габсбург-Лотеринген"
 AUS_karl_von_habsburg_regnal: "Карл I"
 AUS_karl_von_habsburg_leaderA_desc: "После того, как в 1914 году был убит дядя Франц Фердинанд, Карл фон Габсбург-Лотеринген стал назначенным преемником Кайзера Франца Йозефа, после смерти которого Карл унаследовал многие престолы Габсбургской империи в конце 1916 года. Побежден во время Великой войны и развал Австро-Венгерской империи увидел Карла в изгнании первоначально в Швейцарии. Он попытался восстановить свой трон в 1921 году против хаотичного либерального правительства, хотя в конечном итоге он был побежден в попытке переворота, и многие из тех, кто сочувствовал ему, были казнены в короткое время в баскском городе Лекейтио, после чего Карл бежал в Португалию, где монархия была недавно восстановлена и поселилась в Мадейре. Карл был осторожен с португальским королевским правительством, которое симпатизировало его делу, и Карл провёл следующие 15 лет в стране, и только короткое время в баскском городе Лекейто, прежде чем вернулся в Португал в связи с испанским нестабильностью."
 AUS_karl_von_habsburg_leaderB_desc: "После того как в 1914 году был убит дядя Франц Фердинанд, Карл фон Габсбург-Лотеринген стал назначенным преемником Кайзера Франца Йозефа, после смерти которого Карл унаследовал многие троны Габсбургской империи в конце 1916 года. &lt; &lt; Побежден во время Великой войны и развал Австро-Венгерской империи &gt; &gt; увидел, как Карл был первоначально изгнан в Швейцарию. &lt; &lt; Карл &gt; &gt; попытался восстановить свой трон в 1921 году против хаотичного либерального правительства, хотя в конечном итоге он потерпел поражение в попытке переворота, и многие из тех, кто сочувствовал ему, были казнены в короткое время в баскском городе Лекейто, прежде чем вернуться в Португалию из-за испанской нестабильности. &lt; &lt; После подъема Хорти &gt; &gt; за Карла, а также за его воссоединение с Австрией, Карлом, а также за то, что Карл провел следующие 15 лет в стране, то время, что он был вынужден прерваться в баскскую славную славную славную славную мечту, чтобы вернутьть его прежнюю славную пасность, чтобы вернутью трапеть его пасть, чтобы вернутью трапеть, чтобы вернутьть его царскую пасть на царскую царскую царскую мечту."


 AUS_otto_von_habsburg: "Отто фон Габсбург-Лотеринген"
 AUS_otto_von_habsburg_regnal: "Отто"
 AUS_otto_von_habsburg_leader_desc: "Император Отто фон Габсбург-Лотеринген стал преемником своего отца Карла в качестве монарха Австрии. &quot; Отто &quot; , несмотря на свой юный возраст, имеет грандиозные амбиции в отношении империи, у которой разные народы разделяют лишь одну национальную самобытность. &quot; Отто &quot; , его лаконичная речь и молодое обаяние, привели к частому привлечению внимания средств массовой информации."

 AUS_eugen_von_habsburg: "Евген фон Габсбург-Лотринген"

 AUS_karl_albrecht_von_habsburg: "Кароль Альбрехт фон Габсбург-Лотеринген"
