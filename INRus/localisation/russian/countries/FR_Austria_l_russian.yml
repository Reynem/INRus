 austria_politics.1.t: "Время выбора"
 austria_politics.1.d: "К настоящему времени наша слава закончилась, наша империя рухнула, конец неизбежен. Люди льются на площади, недовольство достигло критической точки. бунтари начали бороться против местных органов власти, против дворян, против нашего королевства. Они объединились волей, единой надеждой, единым огнем, одним большим желанием, концом королевства и рождением республики. Ноблеи ничего не могут сделать против них, различные отделы нашей армии выстраиваются вместе с бунтарями, полиция не может остановить их. Все, что мы можем сделать, это сдаться им."
 austria_politics.1.a: "Пусть тогда у них будет республика!"
 austria_politics.1.b: "Новый Кайзер спасёт нас!"
 austria_politics.2.t: "Пропаганда выборов начинается!"
 austria_politics.2.d: "Теперь, когда республика родилась, настало время начать первые выборы в ее истории. Помимо различных партий, уже существовавших во время Габсбургской монархии, в последний период родились новые партии. Две партии, которые, как представляется, имеют наибольшее влияние - это Ватерландишский фронт и Социалдемократиче Арбейтерпартейхс. Ватерландишский фронт, сокращенный как ВП, является новой партией, которая становится все более популярной среди молодежи, бывших знати и военной элиты. Он предлагает австрийское возрождение под знаменем национализма, корпоратизма и федерализма. Социалдемонатире Арбейтереи Ёстеррейхс, сокращенный как СБАПЕ, является древней партией, датируемой 1874 годом. Он основывается на принципах социальной демократии, пытаясь объединить марксизм с классической демократией, пытаясь внедрить социальные реформы через политику, а не революцию."
 austria_politics.2.a: "У СПАПО есть хорошие шансы."
 austria_politics.2.b: "Вице-президент оживит нашу великую нацию."
 austria_politics.3.t: "Прекрасная речь по радио"
 austria_politics.3.d: "В наши дни радиополитика стала очагом для распространения пропартийных настроений. Нация застопорилась, политика так же жива, как и прежде. Вот выдержка из речей последних дней."The people should ..................."
 austria_politics.3.a: "объединяемся под символом равенства, чтобы принести солидарность и мир нации""
 austria_politics.3.b: "объединяйтесь, чтобы вернуть нацию к ее прежней славе, маршируя в угоду великому благу""
 austria_politics.4.t: "Возрождение нашей экономики"
 austria_politics.4.d: "В настоящее время велась дискуссия по радио о национальной экономике. Как обычно, представители ВФ и СПАПЕ высвечивали себя в ходе прений. &quot; Демонстраторы ВФ &quot; разослали горячие дебаты о необходимости объединения всех сил нашей промышленности, с тем чтобы довести их до сведения общества с целью достижения национального блага. &quot; СПАПЕ &quot; ответила на эти заявления, заявив, что реальной проблемой являются права трудящихся и их эксплуатация, заявив, что с более широкими правами и более высокой заработной платой трудящиеся будут обладать большей покупательной способностью, что принесет пользу экономике."
 austria_politics.4.a: "Трудящиеся нуждаются в большем количестве прав"
 austria_politics.4.b: "Экономика должна приносить пользу государству."
 austria_politics.5.t: "Личные свободы"
 austria_politics.5.d: "В настоящее время ведутся дебаты по вопросу о личных свободах, в ходе которых члены ВП и СПАПЕ вновь рассматривают их в качестве основных участников, и члены ВФ заявили, что было бы правильно отказаться от некоторых личных свобод во имя национального блага, однако против них выступили члены СПАПЮ, которые в ярости утверждали, что прежде всего речь идет о личной свободе."
 austria_politics.5.a: "Демократия подразумевает свободу"
 austria_politics.5.b: "Лишь при наличии свободы гражданская жизнь невозможна"
 austria_politics.6.t: "Завершение выборов"
 austria_politics.6.d: "Наконец-то выборы закончились!"
 austria_politics.6.a: "с победой Ватерландишского фронта"
 austria_politics.6.b: "с победой Sozialdemokratische Arbeiterpartei osterreichs"
 austria_politics.8.t: "Рождение Бундесстаата Остеррейха"
 austria_politics.8.d: "Наконец, теперь, когда наша власть укреплена, настало время для великой реформы, введения федерализма, рождения Федерального Государства Австрия. И наконец, каждая территория будет расширена, она сможет управлять собой, не следуя стилю и воле Вены. Словенцы смогут иметь автономию, которую они хотели так долго, доказывая, что они искренне верят в это дело."
 austria_politics.8.a: "Слава федеральному штату Австрия!"
 austria_politics.9.t: "Рынки реагируют на аустрианскую национализацию"
 austria_politics.9.d: "Наша новая корпоративная политика привела к тому, что налогоплательщики и инвесторы больше не инвестируют в нашу страну."
 austria_politics.9.a: "В случае необходимости, мы сделаем это."
 austria_politics.10.t: "Пришло время реорганизовать"
 austria_politics.10.d: "Великая работа по восстановлению барокко должна начаться, что потребует затрат, времени и преданности, но она также принесет пользу, например, эстетическое улучшение городов, построенное в соответствии с этими грубыми, грубыми, несовершенными, вульгарными стилями, которые я осмелился бы сказать. Очевидно, что общая перестройка нации также создаст рабочие места."
 austria_politics.10.a: "Работа будет сдерживать граждан и приукрашивать города."
 austria_politics.11.t: "Работы закончены."
 austria_politics.11.d: "После года тяжелой работы, восстановление наконец закончилось, оно было утомительным, утомительным, даже болезненным для рабочих, но великое дело закончилось."
 austria_politics.11.a: "Я всегда любил барокко."
 austria_politics.12.t: "Реструктуризация создала новые рабочие места"
 austria_politics.12.d: "Большие ремонтные работы привели к созданию большого количества рабочих мест."
 austria_politics.12.a: "Я люблю, когда экономика приносит нам пользу."
 austria_politics.13.t: "Грохдейше Volkspartei"
 austria_politics.13.d: "С момента рождения Австро-Венгерской империи германское население империи имело идею объединить Австрию с Германией, образовав так называемую Гронедучландию. С рождением Республики эти люди присоединились к одной партии, Грондеуче Volkspartei, которая получила множество последователей, и, несмотря на вынужденный отъезд вышеупомянутой партии за подрывную и вредную деятельность в государстве, она продолжает действовать незаконно. Мы должны положить конец этой мерзости, которая может уничтожить нашу страну."
 austria_politics.13.a: "Мы должны положить конец этой мерзости."
 austria_politics.14.t: "Время реформ"
 austria_politics.14.d: "Сейчас мы на шаг от того славного изменения, которое мы все ожидаем, мало чего не хватает. Мы должны сделать только эти последние шаги, полные бюрократических изменений и новых администраций, прежде чем мы сможем завершить нашу великую реформу."
 austria_politics.14.a: "Великие реформы требуют больших жертв"
 austria_politics.18.t: "Священный альянс"
 austria_politics.18.d: "Настало время воспользоваться одним из самых мощных видов оружия, когда-либо имевшихся в распоряжении Империи, католической верой. Заключив соглашение с Папой, эмиссары Святейшего Престола станут настоящими шпионами, которые будут работать на нас, помогая нам поддерживать стабильность в стране и устранять любую внутреннюю угрозу. Очевидно, это будет иметь небольшие издержки."
 austria_politics.18.a: "Инквизиция возродится из пепла"
 austria_politics.19.t: "Немцы наконец-то воссоединились."
 austria_politics.19.d: "Австрийцы, наконец, решили воссоединиться со своими северными братьями. С сегодняшнего дня не будет австрийцев и немцев, а только немцев. И наконец, почти все германоязычные народы собрались вместе в одном большом штате."
 austria_politics.19.a: "Это отличный день для нас."
 austria_politics.19.b: "Мы должны создать своего рода спутниковую нацию"
 austria_politics.20.t: "Наша легитимность упала."
 austria_politics.20.d: "Наш народ решил, что для нашего штата все кончено. ГДВП удалось добиться полного общественного согласия от всех социальных классов в нашем штате, от капиталистов до простых работников, от солдат до крестьян, все вместе громко крича:"We are Germans!" \n We can't do anything anymore, even our own army refuses to be on our side. All we can do is surrender and hand over our state to the German Empire."
 austria_politics.20.a: "Всё кончено."
  #
 austria_politics.42.t: "Габсбургская монархия"
 austria_politics.42.d: "На протяжении длительного времени наши земли разделены между национальностями, религиями, культурами, это время больших перемен. Сегодня Его Величество Отто фон Габсбург-Лотеринген был коронован императором Габсбургской монархии. Габсбургская монархия решит все проблемы старой Империи, создавая общие ценности и традиции для всех китизинцев Империи. На этот раз национальности, культуры и религии не будет больше побудительным мотивом разделения на дискриминацию, а будет первым камнем создания общей культуры для всей империи, которая не уничтожит существовавшие ранее культуры, но объединится с ними, сохранит разнообразие и создаст единство."Viribus Unitis" will be truly applicated, creating a paradise of tollerance and cultural vivicity, under the control of the house of Habsburg-Lothringen"
 austria_politics.42.a: "А.Е.И.О.У."
 austria_politics.43.t: "Карл хороший монарх?"
 austria_politics.43.d: "Многие люди в Империи думают, что война Федерации началась из-за императора Карла, обвиняющего его в некомпетентности."
 austria_politics.43.a: "Некомпетентность Карла - это факт."
 austria_politics.43.b: "Эти люди сумасшедшие, он никогда не откажется."
 austria_politics.44.t: "Разгневанные элиты"
 austria_politics.44.d: "Наша недавняя реформа разозлила дворянство Империи, особенно Имперский суд, большинство дворян против наших реформ, но пока они лишь жалуются."
 austria_politics.44.a: "Нет проблем, если они только жалуются"
 austria_politics.45.t: "Ненависть к императору"
 austria_politics.45.d: "Имперский суд и Ноблей открыто проявили ненависть к императору Карлу и его реформам, они блокируют гражданскую и военную бюрократию, создавая много проблем в Империи, но не только это, их фабрики прекратили работать, парализуя нашу экономику."
 austria_politics.45.a: "Ладно, теперь у нас небольшая проблема."
 austria_politics.46.t: "Неожиданное восстание"
 austria_politics.46.d: "В наше время восстания всегда вызваны рабочими, но на этот раз история другая. Наша новая реформа в отношении власти императорского суда привела к разрыву с дворянством, они в настоящее время находятся в открытом восстании против нас, они парализуют нацию, блокируют нашу реконструкцию."
 austria_politics.46.a: "Мы должны найти решение"
 austria_politics.47.t: "Мы должны раздавить восстание."
 austria_politics.47.d: "Настало время уничтожить дворянство, лишить их титулов и имущества, в истории они всегда создавали проблемы, противостояли решениям короля, мы не можем больше терпеть это."
 austria_politics.47.a: "Покончено с феодализмом"
 austria_politics.48.t: "Мы должны разобраться с дворянами."
 austria_politics.48.d: "Нация устала от снова сражения, наш народ не имеет сил после всех этих лет сражения, дворяне - единственные люди в Империи, которые не голодают или у которых есть много денег, война просто не коснулась их богатства, ради нашего народа, мы должны иметь с ними дело."
 austria_politics.48.a: "Это наш единственный вариант."
 austria_politics.49.t: "Покончено с восстанием."
 austria_politics.49.d: "Мы каким-то образом смогли положить конец восстанию дворян, восстановить мир в Империи."
 austria_politics.49.a: "Наконец"
 austria_politics.50.t: "Время выборов"
 austria_politics.50.d: "Как и до войны, двумя основными коалициями являются социальные демократы, возглавляемые Карлом Реннером, и социальные консерваторы, возглавляемые Игназом Сейпелем."
 austria_politics.50.a: "Мы вернулись в старые времена."
 austria_politics.51.t: "Что думает император об этих уроках?"
 austria_politics.51.d: "Недавно его величество Карл был опрошен о его мнении по поводу выборов."
 austria_politics.51.a: "Кристлихсозиале Партии"
 austria_politics.51.b: "Социалдемократиши Арбейтерпартей Ёстеррейхс"
 austria_politics.52.t: "Время для результатов выборов"
 austria_politics.52.d: "Наступил долгожданный момент подсчета голосов избирателей. Безумное сияние в воздухе, люди взволнованы, имя победителя наконец будет известно."
 austria_politics.52.a: "Кристлихсозиале Партии"
 austria_politics.52.b: "Социалдемократиши Арбейтерпартей Ёстеррейхс"
 austria_politics.53.t: "Мы должны выбрать язык для армии."
 austria_politics.53.d: "Одной из самых больших проблем Империи всегда было присутствие слишком большого числа языков в армии. Пришло время положить конец этой проблеме, и для этого у нас есть только два варианта."
 austria_politics.53.a: "Все солдаты должны изучать основы немецкого языка."
 austria_politics.53.b: "Необходимо создать региональные отделы"
 ###########

 ###########
 austria_politics.54.t: "Вопрос жизни или смерти"
 austria_politics.54.d: "Данубийские делегаторы пришли сегодня, чтобы поговорить с Его Величеством королем Зогом о будущем нашей нации, просьба проста, они хотят, чтобы мы были в их сфере влияния, они хотят нашего подчинения. Это может быть позитивным для Албании, поскольку мы могли бы пользоваться многими привилегиями от разлуки с Данубийским народом, но мы также потеряем нашу желанную неприязнь."
 austria_politics.54.a: "Мы только выиграем от этого предложения."
 austria_politics.54.b: "Возможно, мы могли бы попытаться договориться о нашей независимости."
 austria_politics.54.c: "Мы не боимся."
 austria_politics.55.t: "Представление Зога"
 austria_politics.55.d: "Ответом албанских делегатов стало то, что Королевство Албания теперь является данубианским протекторатом."
 austria_politics.55.a: "Это небольшая победа дипломата для нас."
 austria_politics.56.t: "Делегация хочет провести переговоры"
 austria_politics.56.d: "Албанские делегаты хотят договориться об их подчинении, они склонны присоединиться к нам, но они не хотят потерять свою независимость. Каков наш ответ?"
 austria_politics.56.a: "Если они находятся в нашей сфере влияния, мы можем контролировать их."
 austria_politics.56.b: "Если бы они могли действовать так свободно, они могли бы дестабилизировать Балканы."
 austria_politics.57.t: "Кто-то не знает его положения."
 austria_politics.57.d: "Наши послы в Албании были практически изгнаны из страны."
 austria_politics.57.a: "Албания умрёт."
 austria_politics.58.t: "Неожиданное предложение"
 austria_politics.58.d: "Сегодня из данубийского амбассада поступило странное предложение: три посла, прибывшие в Королевский дворец, предложили объединить нас с Данубийской Федерацией. Это просьба от Высочества Кайзера Карла I, который хочет объединить своих румын с остальным румынским народом. Это объединение можно рассматривать как воплощение мечты Великой Румынии, но это также означает, что мы потеряем титул неотчуждаемой нации. Что мы можем сделать?"
 austria_politics.58.a: "Если это на благо нашего народа, я уверен, что Карл будет хорошим монархом, и я вознагражу нас."
 austria_politics.58.b: "Мы можем подписать договор о свободном транзите между нашими странами."
 austria_politics.58.c: "Румыния не может умереть."
 austria_politics.59.t: "Все румыны под единой нацией"
 austria_politics.59.t: "Ответ на нашу просьбу об объединении уже наступил. Романское правительство решило подписать договор, объединив наши нации, это поистине славный момент для нас."
 austria_politics.59.a: "Мы должны вознаградить семью Царя."
 austria_politics.60.t: "Великий договор"
 austria_politics.60.d: "Румынское правительство отказалось от нашей просьбы, но оно хотело бы заключить с нами договор, в соответствии с которым его простой договор, наш народ, наши товары и наша армия могли бы свободно передвигаться между нашими странами, а также взять на себя обязательство заключить с нами военный союз."
 austria_politics.60.a: "Хорошее соглашение."
 austria_politics.60.b: "Наши народы никогда не будут действительно едины, как это"
 austria_politics.61.t: "Они не думают о своих людях."
 austria_politics.61.d: "Румынское правительство эгоистично отклонило нашу просьбу, помешав нашему народу воссоединиться со своими товарищами."
 austria_politics.61.a: "Это необходимый шаг, невезучий, но необходимый шаг."
 austria_politics.63.t: "Союз стабильности"
 austria_politics.63.d: "Данубийское правительство направило нам предложение о союзе. Его Величество Карл I привержен делу стабилизации Балкан, урегулирования всех территориальных споров, в том числе за счет войны с некоторыми странами. Если мы воспользуемся этим предложением, мы сможем объявить войну Греции в течение примерно 180 дней, вернув все наши утраченные земли."
 austria_politics.63.a: "180 дней достаточно."
 austria_politics.63.b: "Нам не нужна их помощь, чтобы решить наши проблемы."
 austria_politics.64.t: "Мы должны подготовить войну."
 austria_politics.64.d: "Правительство Болгарии согласилось с нашей просьбой, но при одном условии объявить войну Греции в течение 180 дней."
 austria_politics.64.a: "Позвоните генералам."
 austria_politics.65.t: "Наша просьба была отклонена"
 austria_politics.65.d: "Болгарское правительство отклонило нашу просьбу, заявив, что оно может самостоятельно решить свои проблемы."
 austria_politics.65.a: "Им повезло."
 austria_politics.66.t: "Война наступила."
 austria_politics.66.d: "180 дней закончились, пришло время объявить войну Греции."
 austria_politics.66.a: "Кайзер пришел."
 austria_politics.67.t: "Союз стабильности"
 austria_politics.67.d: "Данубийское правительство направило нам предложение о вступлении в союз. Его Величество Карл I привержен стабилизации Балкан, урегулированию всех территориальных споров, в том числе за счет войны с некоторыми странами. Если мы воспользуемся этим предложением, мы сможем объявить войну Болгарии в течение примерно 180 дней, вернув все наши утраченные земли."
 austria_politics.67.a: "180 дней достаточно."
 austria_politics.67.b: "Нам не нужна их помощь, чтобы решить наши проблемы."
 austria_politics.68.t: "Мы должны подготовить войну."
 austria_politics.68.d: "Греческое правительство согласилось с нашей просьбой, но при одном условии объявить войну Болгарии в течение 180 дней."
 austria_politics.68.a: "Позвоните генералам."
 austria_politics.69.t: "Наша просьба была отклонена"
 austria_politics.69.d: "Греческое правительство отклонило нашу просьбу, заявив, что оно может решить свои проблемы самостоятельно, но мы не должны идти против них, поскольку у них очень хорошие отношения с Великобританией."
 austria_politics.69.a: "Им повезло."
 austria_politics.70.t: "Война наступила."
 austria_politics.70.d: "180 дней закончились, пришло время объявить войну Болгарии."
 austria_politics.70.a: "Кайзер пришел."
 austria_politics.71.t: "Возрождение старого союза"
 austria_politics.71.d: "Сегодня аустрианская делегация пришла поговорить с нами о наших отношениях. Новый Кайзер, Отто фон Хабсбург, хочет подойти к нам и сформировать военный союз с нами. Это должно быть возрождением Святого Альянса, нашим старым альянсом разрушится нашим соперничеством с аустрианами над балканами. Если нам удастся разделить Европу с ними, мы можем просто стать правителем мира."
 austria_politics.71.a: "Нам нужен надежный союзник."
 austria_politics.71.b: "Они предали нас однажды, они могут сделать это в другой раз."
 austria_politics.72.t: "Цар и Кайзер"
 austria_politics.72.d: "Цар принял нашу просьбу, теперь у нас прочный союз с очень великой силой, но мы должны контролировать наших союзников, потому что он слишком неустойчив."
 austria_politics.72.a: "Мы приведем мир в Европе"
 austria_politics.73.t: "Очень плохая реакция."
 austria_politics.73.d: "К сожалению, наша делегация не смогла привести к нам царя, но это не конец."
 austria_politics.73.a: "Мы - бастион монархизма."
 austria_politics.74.t: "Сообщение Кайзера"
 austria_politics.74.d: "Австрийский Кайзер, Отто фон Хабсбург, послал нам послание, ясное, нет другого толкования, они хотят нашу нацию, наше золото и наш народ. Наша маленькая нейтральная нация является своего рода щитом, который блокирует австрианское расширение к западу, так что к Франции и Испании. С предвестником объединения Альп под одной нацией, они хотят нашего подчинения."
 austria_politics.74.a: "Однажды мы победили Габсбурга, мы можем сделать это еще раз."
 austria_politics.74.b: "Теперь, когда их Империя объединена, мы ничего не можем сделать."
 austria_politics.75.t: "Бастион Альп находится под нашим контролем."
 austria_politics.75.d: "Швейцарцы решили принять нашу просьбу, отдав нам свой народ."
 austria_politics.75.a: "Швейцарские наемники сейчас не так уж и сильны."
 austria_politics.76.t: "Твердая реакция"
 austria_politics.76.d: "Наше письмо было получено от швейцарцев."We shall never surrender". The Swiss have developed a strong national identity, they are united and they don't want to lose their indipendence. They are a model for the World"
 austria_politics.76.a: "Они могут быть моделью, но мы покоряем их земли."
 
