 AUS_austrian_fleet_desc: "Австрийский флот сильно трианирован, рассеян и очень, очень хорошо."
 AUS_military_tradition: "Австрийские военные традиции"
 AUS_military_tradition_desc: "Традиции Австрийской армии поддерживаются, весь мир увидит прелесть нашей армии, парады держат на улице, чтобы показать, насколько мы сильны."
 AUS_jagdkommando_idea: "Ягдкомандо"
 AUS_jagdkommando_idea_desc: "Наши командиры - одни из лучших в Европе, они торопятся и уходят без звука, боятся как внешних угроз, так и внутренних террористов."
 AUS_austrian_howitzers: "Австрийские гаубицы"
 AUS_austrian_howitzers_desc: "Австрийская пушка стреляет далеко, быстро и точно стреляет. Сила этих пушек доказала, что они необходимы для нашего государства. Слава Богу за австрийские пушки."
 AUS_motorized_army: "Моторизованная армия"
 AUS_motorized_army_desc: "Наша армия основана на скорости и скорости, которая у нас есть. У нас самая быстрая скорость, мы не можем отрицать этого. Наш менкан может пересечь аустрию за меньшее время. Это делает нас самым могущественным военным в мире."
 AUS_wien_university: "Винский университет"
 AUS_wien_university_desc: "Венский университет реконструируется в комекс, пригодный для европейского центра."
 AUS_wien_university2: "Винский университет"
 AUS_wien_university2_desc: "В настоящее время в Университете есть пустой чек и он хорошо используется. Люди со всей Европы обучаются в Университете. Это действительно комплекс, достойный Австрийского Прайда."
 AUS_belligerant_industry: "Индустрия по производству беллигантов"
 AUS_belligerant_industry_desc: "Корпоративный адский пейзаж, который является нашим военно-промышленным комплексом, стал безжалостно эффективным."
