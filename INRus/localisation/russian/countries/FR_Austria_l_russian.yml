 AUS_road_lead_to_vienna_focus_tt: "Этот акцент позволит начать новую реформу инфраструктуры"
 AUS_the_imperial_infrastructures: "Имперские инфраструктуры"
 AUS_the_imperial_infrastructures_desc: "Пришло время связать Империю с Веной, централизовав управление ресурсами, произведенными страной в ее славной и древней столице. § Все дороги ведут не в Рим, а в Вену§"
 AUS_vienna_praha: "Автомагистраль Вена-Праха"
 AUS_vienna_praha_desc: "Настало время пересечь очень хорошую шоссе между двумя мэрами промышленных городов Империи, Вены и Праха."
 AUS_vienna_lemberg: "Автомагистраль Вена-Лембер"
 AUS_vienna_lemberg_desc: "Создавая очень хорошую шоссе между Веной и Лембергом, мы сможем доставить больше нефти в нашу промышленность."
 AUS_vienna_pressburg: "Венская-Прессбургская автомагистраль"
 AUS_vienna_pressburg_desc: "Pressburg is an important mineral center, in fact most of the precius metal ores go to Pressburg before being employed in our industri
 AUS_vienna_budapest: "Автомагистраль Вена-Будапешт"
 AUS_vienna_budapest_desc: "Будапешт - красивый город, но самая важная Венгрия - это сарай Империи."
 AUS_vienna_zagreb: "Автомагистраль Вена-Загребеб"
 AUS_vienna_zagreb_desc: "Этот новый шоссе должен позволить нам направить больше ресурсов в Хорватию, увеличив нашу военно-морскую индустрию."
 AUS_vienna_kolozsvar: "Автомагистраль Вена-Колосвар"
 AUS_vienna_kolozsvar_desc: "Колосвар является самым важным городом Трансильвании. Трансильвания - это район Империи, который не был хорошо эксплуатируется. Пора связать этот важный город с Веной, что позволит нам быстрее доставлять трансильванские минеральные ресурсы в наши промышленные комплексы."
