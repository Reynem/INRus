 #Anschluss time 
 AUS_anschluss_movement: "Движение &lt; &lt; Гроёчланд &gt; &gt;"
 AUS_anschluss_movement_desc: "С XIX века появилась идея Грондёшленда, великой единой Германии под одним руководством, в котором участвовали все германоязычные народы. Эта идея отличалась от идеи Кляйндойтше, маленькой Германии, сделанной гогензолернами. Несмотря на то, что габсбургы стояли во главе идеи Гронедёшленда, она так и не увенчалась успехом из-за множества народов Габсбургской империи. Теперь, когда Империя мертва, эта идея возвращается все больше и больше в гуге, так что так родилась партия, посвящённая этому, Гродеутше Волькспартеи (ГГРВП). Мы должны во всех отношениях уменьшить влияние этого идеала на население, мы должны показать, что мы не просто немцы, мы отличаемся друг от друга, мы лучше!"
