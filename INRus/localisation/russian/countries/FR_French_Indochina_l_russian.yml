 #### Ideas ####
 FIC_colonial_exploitation: "Колониальная эксплуатация"
 FIC_colonial_exploitation_desc: "Несмотря на некоторое улучшение состояния промышленности и общества в городских районах Индокита, французская индочина сама является колониальным достоянием, главным образом направленным на экономическую эксплуатацию, хотя метрополия Франция может утверждать обратное, налицо явный недостаток развития в сферах Индокита, которые не касаются французов, оставляя части страны очень отсталыми с технологической точки зрения и не имея инфраструктуры, а также отсутствие стимулов к местному образованию лишь негативно сказывается на уровне грамотности в регионе, оставляя безграмотное и обнищающее сельское население, что, разумеется, во многих отношениях является полезным для французской администрации, поскольку это означает меньшую политическую активность и более высокую степень эксплуатации рабочей силы."
 FIC_vietnamese_unrest: "Вьетнамские волнения"
 FIC_vietnamese_unrest_desc: "С тех пор, как метрополитен Франция захватила Аннам, Кочинкина и Тонкина, французская Индокина не знала мира. Вьетнамцы - это неправдоподобный народ с горячим национализмом и неприязнью к иностранным режимам, которые говорят им, что делать. Это сделало правление Индокита канатом, где мы всегда должны сражаться за восстание или восстание, когда дела идут наперекосяк. Даже сейчас известно, что индокитайцы организуют и строят тайное мятежное движение. По крайней мере, Лаос и Камбоджа находятся в таком хаосе."
 FIC_the_indochinese_apparatus: "Индокитейнское оборудование"
 FIC_the_indochinese_apparatus_desc: "В отличие от других колониальных держав, которые использовали связь с коренными жителями для управления своими регионами, французы создали централизованную администрацию над Индокитая. Таким образом, бюрократия, построенная на сети высокооплачиваемых французских администраторов, распространяется по всему региону, сотрудничая с подконтрольным мандариной, чтобы править над всеми индочинами. До сих пор эта администрация оказалась очень дорогостоящей и крупной проблемой, в которой индокитайцы практически не имеют права голоса, независимо от их социального или политического положения. Хотя это означает, что индокитайские власти находятся в гораздо менее мощном положении для ведения переговоров о своей автономии, это также означает, что индокитайцы чувствуют себя крайне отчужденными от этой иностранной администрации, создавая большую враждебность по отношению к этому правящему аппарату. Эта враждебность лишь усугубляется тем фактом, что многие из наших администраторов обладают незначительными знаниями на местных языках и не обращают внимания на местную культуру и обычаи, и больше заботятся о том, как сделать наибольшую прибыль возможной для столичной Франции, чем развивать индошину."
 FIC_salt_opium_alcohol: "Соль, опиум и алкоголь"
 FIC_salt_opium_alcohol_desc: "Несмотря на то, что мы получаем большие доходы от индокитайского сельского хозяйства (особенно риса), сериалов и горнодобывающей промышленности, значительная часть нашего бюджета приходится на монополию и высокие налоги на соль, опиум и алкоголь - три очень потребленных и необходимых товара в Индокитае, которые приносят нам большие доходы, особенно опиум, который мы несем прямую ответственность за распространение и популяризацию в этих городах."


