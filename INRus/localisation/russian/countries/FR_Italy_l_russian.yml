 ITA_panfilla_profits_desc: ""
 ITA_government_in_exile: "Правительство в изгнании"
 ITA_government_in_exile_desc: "С падением Рима наше правительство было вынуждено убежать от колониального владения Ливией, отсюда мы можем организовать и собрать силы, далеко от немецкой угрозы, к сожалению, не многие итальянские солдаты смогли добраться до Северной Африки, а местные жители не симпатизируют нашему делу, что привело к острой нехватке рабочей силы."
 ITA_lba_trade: "Итало-Ливийское торговое соглашение"
 ITA_lba_trade_desc: ""
 #New
 ITA_political_radicalization: "Политическая радикализация"
 ITA_political_radicalization_desc: "Несмотря на то, что когда-то Итальянская народная партия была источником стабильности для Италии, ведущая коалиция итальянской народной партии, которая находится у власти с начала 1920-х годов, начала терять поддержку народа. &lt; &lt; Валькизм &gt; &gt; в Германии является признаком того, что левое правительство не в состоянии решать современные проблемы, угрожающие Италии. &lt; &lt; Наши политические оппоненты &gt; &gt; использовали эту видимую слабость нашего народа для усиления поддержки своих собственных партий."
 #
 ITA_ppi_stagnation: "Стагнация ИЦП"
 ITA_ppi_stagnation_desc: "Во время социальных потрясений &quot; Бьеннио Россо &quot; , которые последовали за Великой войной, казалось, что Италии суждено было столкнуться с гражданской войной, как это видно в России, но политический компромисс между левой в центре итальянской народной партией и итальянской Социалистической партией (которая в то время рассталась с самыми радикальными фракциями итальянской левой) принес в Италию столь необходимые реформы, обеспечив мирное урегулирование &quot; Бьеннио Россоу &quot; . Почти 15 лет спустя, хотя эта эра разумного компромисса больше не удовлетворяет итальянский народ или внутренний круг Партии народностей, обе из которых хотят, чтобы партия приняла более конкретную повестку дня."
 #
 ITA_atheist_state: "Государственный атеизм"
 ITA_atheist_state_des: "Чтобы действительно освободить рабочий класс Италии, мы должны освободить их от оков христианства и церкви."
 #
 ITA_police_idea: "ОВРА"
 ITA_police_idea_desc: "~Кто? ~"Organizzazione per la vigilanza e la repressione dell'azione controrivoluzionaria\" or \"Organization for Vigilance and Repression of Counter-Revolutionary action\" is tasked with combating Anti-communist activities in the country while also protecting the workers from reactionary foreign influence."
 #
 ITA_permanent_revolution_idea: "Постоянная революция"
 ITA_permanent_revolution_idea_desc: "Амадео Бордига, следуя по ступеням Леона Троцкого, выступает за политику постоянной революции, в рамках которой Италия будет использовать свое стратегическое влияние для распространения социализма по Средиземноморью."
 #
 ITA_worker_council_idea: "Советы работников"
 ITA_worker_council_idea_desc: "Для того чтобы содействовать нашей политике общинной демократии, мы должны поощрять создание местных советов трудящихся для повседневного управления экономикой."
 #
 ITA_worker_women: "Женщины революции"
 ITA_worker_women_desc: "Наша революция не может увенчаться успехом без поддержки и усилий женщин Италии, мы должны разрушить патриархальные структуры нашего общества и побудить женщин полностью реализовать свой потенциал."
 #
 ITA_poor_protection_idea: "Защита бедных"
 ITA_poor_protection_idea_desc: "Современное капиталистическое государство должно создать систему защиты для наиболее уязвимых членов общества, такая политика, как программы социального обеспечения, поможет защитить наших граждан от финансового краха."
 #
 ITA_industrial_regulations_idea: "Промышленное регулирование"
 ITA_industrial_regulations_idea_desc: "Несмотря на то, что предыдущие правительства запретили такую несправедливость, как детский труд, многие из них по-прежнему существуют."
 #
 ITA_women_rights_idea: "Расширение прав женщин"
 ITA_women_rights_idea_desc: "Хотя в 1920-х годах женщины получили право голоса, они по-прежнему сталкиваются с неравенством в обществе."
 #
 ITA_industrial_subsidies_idea: "Субсидии для промышленности"
 ITA_industrial_subsidies_idea_desc: "Для содействия развитию итальянской промышленности мы должны предложить субсидии потенциальным разработчикам."
 #
 ITA_tax_breaks: "Налоговые льготы для богатых"
 ITA_tax_breaks_desc: "Несмотря на то, что он является ядром экономики Италии, капиталистический класс сдерживается экстремальными налогами на их богатство, если мы хотим, чтобы капиталисты и предприниматели потратили свое богатство таким образом, чтобы это наилучшим образом приносило пользу экономике, мы должны сократить правительственные бюрократии."
 #
 ITA_tax_breaks_idea: "Налоговые льготы"
 ITA_tax_breaks_idea_desc: "Теперь налоговые льготы для капиталистов позволят им инвестировать больше своего богатства в развитие экономики."
 #
 ITA_free_trade_idea: "&quot; Тужься за свободную торговлю &quot;"
 ITA_free_trade_idea_desc: "В условиях все более нестабильной Европы торговля, как представляется, является единственным аспектом поддержания мира в странах."
 #
 ITA_economic_protectionism_idea: "Экономическая защита"
 ITA_economic_protectionism_idea_desc: "Такая политика, как тарифы и субсидии, защитит наших граждан от иностранного давления, которое направлено на подрыв нашей собственной экономики ради их благ."
 #
 ITA_roman_senate_idea: "Хартия карнаро"
 ITA_roman_senate_idea_desc: "Хартия Карнаро имеет большое значение как для политической мысли правого, так и для левого крыла. 20 лет назад она была написана Альцесте Де Амбрисом и Габриэлем д'Аннунцио, и в ней было определено корпоратистское общество, в котором как трудовые, так и капиталистические классы будут работать вместе во имя благополучия государства и ее народа. Хотя Хартия является очень политическим невлиянием, ее практическое осуществление никогда не происходило в широких масштабах."
 #
 ITA_roman_senate_idea_2: "Хартия карнаро"
 ITA_roman_senate_idea_2_desc: "Рассматривая дефиниционный документ национального синдикализма, Хартия Карнаро оказала большое влияние на политическую мысль как правого, так и левого крыла. 20 лет назад Альцест де Амбрис и Габриэль д'Аннунцио написали Хартию о корпорационном обществе, в котором как классы труда, так и капиталисты будут работать вместе во имя благополучия государства и ее народа."
 #
