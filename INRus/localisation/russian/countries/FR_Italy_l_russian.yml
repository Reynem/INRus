  SIC_ferdinando_borbone: "Фердинандо III"
 SIC_ferdinando_borbone_leader_desc: "Фердинанд из Бурбон-Дву Сицилии в последние двадцать лет был обеспокоен тем, что относительное спокойствие в изгнании, в котором он жил с момента своего рождения в 1869 году, было заменено обязанностями быть монархом члена итальянской федерации и теперь суверенного государства. После окончания гражданской войны в Италии его положение всегда было хрупким, и он сам знает, что он не более чем марионетка в великой игре сицилийской, итальянской и мировой политики в целом, поскольку его присутствие узаконивает королевство на международном уровне и позволяет ему оставаться в соответствии с властными силами, находящимися в Европе, эффективно сохранив в стороне широкомасштабные синдиалистические наступательные действия. Его правление, хотя и не без политических проблем, пришло после шести лет войны и ссоры, и он старается сделать все возможное, чтобы он взял на себя личную заслугу за этот мир и относительное процветание. Хотя он традиционно удержал себя от политических дел, поскольку он осознает хрупкость мира, который он и многие другие работают над поддержанием, вопросы постоянной синдикалистской угрозы и отсутствия наследника его тела сильно взвешивают его."

