 ITA_expand_latin_category: "Мастерство мары Нострум"
 ITA_expand_latin_category_desc: "[ITA.GetName], единственный законный преемник Римской империи, окружен военно-морскими силами, которые стремятся сохранить ее слабость и лишить ее места как величайшей державы Европы. Средиземное море - это наше море, Итальянская Маре Нострум. Мы унаследовали его из Рима, и наша судьба - стать его хозяином. История в создании, старый порядок рушится, Италия должна забыть ее сейчас или навсегда."

 ITA_expand_latin_france: "&quot; Завоевать галл &quot;"
