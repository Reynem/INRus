 ### Ideas ###
 ALB_liberation_movement: "Национально-освободительное движение"
 ALB_liberation_movement_desc: "С момента итальянской оккупации Албании после окончания Великой войны народное партизанское движение, возглавляемое в настоящее время революционным коллективистом Энваром Хокса, кампанией с целью освободить Албанию от итальянского правления и установить социалистическое правительство в стране, в настоящее время они прячутся в горах Кораб, вербуя больше солдат и очень редко вступая в контакт с нашей армией или полицией."
 SER_liberation_movement: "Национально-освободительное движение"
 SER_liberation_movement_desc: "Во время Великой войны Королевство Сербия оккупировало Северную Албанию и Косово, оставив тысячи албанцев под иностранным господством."


 ### Events ###
 alb.1.t: "Национально-освободительное движение находит более широкую поддержку в сельских районах"
 alb.1.d: "Несмотря на все усилия нашей полиции по поддержанию порядка, многие из наших жителей в сельских районах симпатизируют делу НЖС, и есть опасения, что многие деревни в горах Кораб могут даже укрыться от НЖМ, предоставляя им продовольствие и оборудование, необходимые для преследования нашей армии. Очень мало было вложено в правильное урегулирование этого кризиса, который только усугубит проблему по мере продвижения времени."
 alb.1.a: "Мы должны увеличить полицейскую презентацию в горах Кораб."
 alb.4.t: "Празднование Дня освобождения"
 alb.4.d: "Хотя первоначально Албания была нейтральной во время Великой войны, она была втянута в конфликт, когда Австрия вторглась в так называемую «дружелюбную оккупацию». Вскоре за этим последовало совместное французско-итальянское вмешательство в южную Албанию. Война в Албании продолжалась до весны 1919 года, когда власти «Согласия» смогли заставить Австрию-Венгрия отступить от Албании. &lt; &lt; Освобождение Албании &gt; &gt; праздновалось как национальный праздник с конца Великой войны как способ воздать дань уважения албанским и итальянским силам, которые жертвы и храбрость сделали возможным. &lt; &lt; Ежегодный военный парад &gt; &gt; , который проходит через Тирану в последнее время, стал целью албанских диссидентов. &lt; &lt; Риоты &gt; &gt; , грабежи и другие акты насилия стали обычным явлением среди парада и местной полиции, что в этом году будет наблюдаться значительное социалистическое присутствие в этом районе. &lt; &lt; &lt; &lt; Фердинанд &gt; &gt; сделал традией традион &gt; традиционную традиционную традицию, но рост насилия беспокоит за его святость."
 alb.4.a: "Присутствие Фердинанда укрепит его популярность."
 alb.4.b: "Это слишком рискованно."
 alb.5.t: "Взрыв в День освобождения, Принц мертв."
 alb.5.d: "Несмотря на предупреждения его советников по вопросам безопасности, принц Фердинанд все еще решил принять участие в параде Дня освобождения, несмотря на все их усилия, безопасность на этом мероприятии не смогла остановить теракт, в результате которого был убит принц. Взрыв причинил значительный ущерб и вызвал массовую панику на улицах Тираны. Потребовалось несколько часов для того, чтобы найти и опознать труп принца, и еще больше для того, чтобы поймать террориста, члена Национального освободительного движения. Произошедший кончину принца стал огромным потрясением для народа Албании и Италии и служит напоминанием о том, насколько расколота до сих пор наша нация."
 alb.5.a: "Это зашло слишком далеко."
 alb.6.t: "Взрыв в День освобождения"
 alb.6.d: "Несмотря на все их усилия, безопасность на этом мероприятии не смогла остановить террористический взрыв, обрушившийся сегодня на Тирану, который причинил значительный ущерб и вызвал массовую панику на улицах города."
 alb.6.a: "Это зашло слишком далеко."
 alb.7.t: "Албания просит о поддержке"
 alb.7.d: "Недавний террористический акт в Тиране продемонстрировал, что албанские силы безопасности слишком слабы и неупорядочены, защищая свою нацию. Сегодня албанский амбассадер в Риме просит нас направить больше сил для содействия стабилизации положения в стране. Кризис в Албании лишь ослабляет нашу позицию в Адриатике, однако многие министры предупреждают, что стоимость футхерского вмешательства в Албании может взвесить любые возможные выгоды. Они настаивают на том, что до тех пор, пока портовый город Влоре будет защищен, наша позиция в Третьем Шоре будет такой же."
 alb.7.a: "Мы должны направить войска, чтобы помочь стабилизировать ситуацию."
 alb.7.b: "Мы не можем ничего послать."
 alb.8.t: "Италия согласна послать больше людей."
 alb.8.d: "Рим услышал наши крики и согласился послать больше людей, чтобы помочь стабилизировать нашу нацию."
 alb.8.a: "Мы всегда можем рассчитывать на Рим."
 alb.9.t: "Италия отказывается направлять дополнительную поддержку"
 alb.9.d: "Несмотря на наше отчаяние, Рим отказался послать войска в нашу страну, и теперь наши силы безопасности сталкиваются с растущей оппозицией."
 alb.9.a: "Мы должны создать свои собственные силы."
 alb.10.t: "Мидхат Фрашери требует от правительства поддержки Балли Комбетара"
 alb.10.d: "Лидер националистического движения &lt; &lt; Балли Комбетар &gt; &gt; Мидхат Фрашери пришел к нам, чтобы подписать соглашение. &lt; &lt; Балли Комбетар &gt; &gt; годами боролся с итальянским влиянием в Албании, нападая на итальянские поселения и буйны в нашей стране, но теперь они приходят к нам на мирных условиях, чтобы сделать предложение. &lt; &lt; Фрашери &gt; &gt; презирает больше, чем Италия. Он предложил услуги ополчения &lt; &lt; Балли Комбетар &gt; &gt; , чтобы помочь Албании защититься от дальнейшего социалистического вторжения. Хотя это поможет не только укрепить наши вооруженные силы, но и придать большую легитимность среднему албанцу. Несмотря на оптимизм многих в нашем правительстве, некоторые предупреждают о возможной угрозе того, что такая агрессивная фракция сможет получить власть в нашем правительстве."
 alb.10.a: "Мы должны стать единым фронтом для борьбы с социалистическими повстанцами."
 alb.10.b: "Балли просто другая сторона той же изменной монеты."
 alb.11.t: "Наступление Итало-албанского Кораба"
 alb.11.d: "Албанские силы, о чем свидетельствует недавняя итальянская поддержка, готовятся вытащить Национально-освободительное движение из наших границ. Итальянская разведка помогла нам найти базу операций НОД. Отрубить голову этому зверю быстро убьет социалистических диссидентов."
 alb.11.a: "Марш храбро, чтобы победить наших героев!"
 alb.12.t: "Итало-албанские силы отправили НОД"
 alb.12.d: "После изнурительной битвы в горах Кораб Национально-освободительное движение было вывезено из наших границ. &lt; &lt; Энвер Хоха &gt; &gt; , лидер НОД, поклялся продолжать борьбу за освобождение Албании из-за границы в Сербии, но всем ясно, что НОД уже закончилось."
 alb.12.a: "Победа для всех албанцев!"
 alb.13.t: "Итало-албанские силы были отброшены назад"
 alb.13.d: "Несмотря на наши предчувствия, мы, кажется, переоценили оборону Национального освободительного движения, наши силы были подталкиваны, многие из наших албанских солдат даже покинули поле боя, это поражение только вдохновит НОДС на более прямые действия против нашего правительства."
 alb.13.a: "Это тёмный день для Албании."
 alb.14.t: "Остатки побежденного албанского НОУ переселяются через нашу южную границу"
 alb.14.d: "На протяжении многих лет Национально-освободительное движение социалистических албанцев борется с партизанской кампанией, направленной на освобождение Албании от итальянского правления."
 alb.14.a: "Мы должны следить за их деятельностью."
 alb.15.t: "Битва при Тиране"
 alb.15.d: "Национально-освободительное движение, вдохновляемое нашими правительствами на то, чтобы раздавить их, совершило полномасштабное нападение на наш столицу Тирану. Годы планирования и вербовки помогли коллективистским силам перехитрить полицию, размещенную в окрестностях вульгарных домов, и по мере приближения к Тиране боевые действия стали еще более жестокими. По мере того как отчаянные правозащитники работают в ту ночь, когда укрепляя наше положение, ситуация продолжает оставаться мрачной. Только храбрость прокаженных может спасти Албанию сейчас."
 alb.15.a: "Ни шагу назад!"
 alb.16.t: "Национально-освободительное движение оккупирует Тирану!"
 alb.16.d: "Несмотря на поддержку итальянской албанской армии, наши силы НОД оккупировали Тирану после того, как ополченцы НОД закончили расчистку отчаянных защитников из города, наш лидер Энвер Хоха отправился в столицу, чтобы поприветствовать своих сторонников."
 alb.16.a: "Власть для рабочих Албании!"
 alb.17.t: "Национально-освободительное движение было отброшено из Тираны"
 alb.17.d: "Несмотря на их оптимизм, НОД были выброшены из Тираны, их осада города закончилась катастрофой, а теперь то, что осталось от более сильных сил, отступает в соседнюю Сербию. Наши силы стоят высоко, когда мы начинаем восстанавливать не только нашу столицу, но и нашу нацию в целом. Ни один экстермист никогда не разорвет Албанию."
 alb.17.a: "У коллективистов трусов нет другого выбора, кроме как бежать."
 alb.18.t: "Албания потерпела крах в коллективизме!"
 alb.18.d: "Албания на протяжении многих лет страдает от нестабильности. социалистическое национальное освободительное движение ведет партизанскую войну с нашим союзником в Тиране и, несмотря на нашу поддержку своего режима, они пали на НЛМ. Поскольку большинство Албании находится под контролем НОД, это лишь вопрос времени, прежде чем наш ключевой порт во Влоре будет атакован и вместе с ним наш доступ к Адриатике."
 alb.18.a: "Мы должны сделать все возможное, чтобы гарантировать свободный доступ через Аддриатик."
 alb.18.b: "Укрепить нашу базу во Влоре."
 alb.19.t: "Балли Комбатар Марш в Тиране"
 alb.19.d: "Балли был ключевым компонентом недавней победы над Фронтом национального освобождения и, используя свое новое находящееся влияние, Мидхат Фрашери вел своих последователей в путче на нашу столицу. Его требования ясны, Фрашери не примет итальянского влияния в Албании и будет сражаться, если мы откажемся от него. Многие из наших военных уже сложили оружие и присоединяются к путчу. Прямое итальянское вмешательство в наше правительство - это последний вариант, который мы должны сделать, чтобы спасти нашу страну от раздутого."
 alb.19.a: "Согласитесь с требованиями Фрашери."
 alb.19.b: "Итальянская сторона должна пойти на поправку, чтобы спасти нашу нацию."
 alb.20.t: "Албания в Беспорядке"
 alb.20.d: "В Албании надвигается гражданская война. Правительство Албании и Балли Комбетар недавно согласились создать единый фронт против социалистического национального освободительного движения, но теперь, когда НОД победил Балли Комбетар, теперь они используют новое влияние в Албании для начала переворота в Тиране. Наш албанский союзник требует, чтобы мы взяли под непосредственный контроль их национальную безопасность в качестве последней попытки обеспечить стабильность в регионе."
 alb.20.a: "Настало время вмешаться и непосредственно управлять внутренними делами Албании."
 alb.20.b: "Укрепить нашу базу во Влоре."
 alb.21.t: "Италия абадонс Албания"
 alb.21.d: "Рим объявил о своем намерении проводить политику разрядки по отношению к Албании, и уже многие итальянские поселенцы покидают Албанию по мере возвращения итальянских сил безопасности во Влоре, без поддержки Италии наш режим обречен."
 alb.21.a: "Теперь ничто не может остановить Балли Комбатара"
 alb.22.t: "Италия принимает прямой контроль над нашим правительством."
 alb.22.d: "В последней отчаянной попытке канавы гарантировать стабильность в Албании мы попросили Италию взять под свой контроль нашу страну."
 alb.22.a: "Охраняйте Балли Комбетар"

 ### Characters ###
 SRD_amedeo_aosta: "Амедео I"
 #SRD_amedeo_aosta_leader_desc: "На протяжении долгого времени Амедео Савой-Аоста не интересовался национальной политикой. Бывший король не интересовался государственными делами или повседневным управлением страной; вместо этого, как и все другие герцоги Аосты, он провел свои первые годы в строгом военном образовании, сначала в Великобритании, а затем в Неаполе. В 1915 году 16-летний король вступил в армию на Альпийском фронте в качестве капрала и боролся за то, чтобы стать капитаном. С окончанием войны он первоначально был вынужден следовать за своим отцом в Кальяри. nn no no, вместо изучения конкретных особенностей Сардинии, Амедео был очарован древними землями и культурами Африки. Глубоко не интересуясь политическими делами острова, он провел большую часть 1920-х годов в джунглях Конго со своим дядей знаменитым королем Дюком Абрузи, оставив Сардинию в руках Маршала Бадоглио, и только однажды его здоровье начало ослабляться."
 #SRD_amedeo_aosta_war_leader_desc: "На протяжении долгого времени Амедео Савой-Аоста не интересовался делами государства или повседневным управлением страной; вместо этого, как и все другие герцоги Аосты, он провел свои первые годы в строгом военном образовании, сначала в Великобритании, а затем в Неаполе. В 1915 году 16-летний король присоединился к армии на Альпийском фронте в качестве капрала и боролся за то, чтобы стать капитаном. С окончанием войны он сначала был вынужден следовать за своим отцом в Кальяри. nn no, вместо изучения особенностей Сардинии, Амедео был очарован древними землями и культурами Африки. Глубоко незаинтересованный в политических делах острова, может быть, он потратил большую часть своих сил в джунглях Конго с его знаменитым дядей Дюком Абрузи, оставив Сардинию в руках Маршала Бадуглио и только однажды, когда его отец начал думать о здоровье."

