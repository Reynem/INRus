 SRI_benito_mussolini: "Бенито Муссолини"
 # SRI_benito_mussolini_leader_desc: "Идти в историю - это причудливые вещи, и невидимая рука судьбы часто ведёт в скручивании, внезапных поворотах. Возрождение печально известного патриота Бенито Муссолини было одним из многих таких поворотов, и его дикого хитрого хитроумного хитроумного дикта, и его дикого хитроумного хитроумного хитрого хитриста, и его хитроумного хитрого хитрояка, хитроумного хитроумного хитроумца, хитрого хитроумного хитрого хулиганца, хитроумного хулиганства, хулиганского хулиганца, хулиганского хулиганства, херустального хулиганства, хулиганского хулиганства, и его хитрогонгерпевиста, и героя хулигана, и героста, хваста х хуя х хуев хуя хуевого хуя хулиган, х, хулиган, хулиган, хулип, хулип, хулипогон, х, х, х, х, хуя, хуя, хуя, х, хуя, хулип, х, х, х, хуя, хуя, х, х, х, ху, х, х, х, ху, х, х, х, х, ху, х, ху, х, ху, х, ху, х, х, х, х, х, х, х, х, х, х, х, х, х, ху, х"

 SRI_palmiro_togliatti: "Палмиро Тольятти"
 #SRI_palmiro_togliatti_leader_desc: "Несмотря на то, что Палмиро Тольятти имеет много проблем, руководство Тольяттийс держит корабль на плаву в надежде на конечное воссоединение. Однако, несмотря на то, что в 1893 году в Генеге был зарегистрирован его патриотический патриотизм, его относительной нищетой, которая ухудшилась после смерти его отца, он смог изучить право в Туринском университете, где он встретился и был другом своего давнего политического помощника Антонио Грамши. Вскоре после этого он присоединился к итальянской Социалистической партии, и не жалея времени: Велкриаг навсегда изменил итальянскую историю. Несмотря на то, что итальянское вмешательство и позднее он работал в Красном Кресте, а затем в военном госпитале. Однако Итальянский институт победил его в том, что все остальные члены итальянской партии остались без поддержки."

 SRI_alceste_de_ambris: "Alceste de Ambris"
 #SRI_alceste_de_ambris_leader_desc: "Его успех в победе над стариком Палмиро Тольятти за руководство группировкой синдикалистов отражает сильное желание перемен в темпах. Но будет ли это лучше, чем увидеться в 1903 году. Он начал быстрый рост в начале 1900-х годов, став секретарем Федерации стеклянных работников и организовав крупные демонстрации в Парме."

 SRI_angelo_tasca: "Анжело Таска"
 #SRI_angelo_tasca_leader_desc: "Не каждый член Итальянского союза синдикалистов является сторонником Палмиро Тольятти, как это выяснил долгое время лидер. Несмотря на все его усилия, его давние агенты, ратовавшие за то, что он никогда не ратовал за то, чтобы антагоистка в защиту синдикалистского союза от Тольятти и других соперников. Новый лидер обещал новое направление для Социалистической Республики, крупнейшей партии. Сотрудничая с Антонио Грамши, Умберто Терацини и Палмиро Тольятти, были студентом в Турине, а он стал социалистическим и вступил в итальянскую демократическую партию. Стремительно противостоял итальянскому вмешательству в Вельттиг, его позиция была доказана катастрофическим поражением войны на его родине. Сотрудничая с Антуанкой, Умберто Террацини и Палмиро Тольятти, он помог им найти новое движение синдикалистов в Италии в его беспокойстве коллапсов. Революция была доказана во многом в Северной Италии, но кампания в тупике и прекращении огня в 1921."

 SRI_giuseppe_di_vittorio: "Джузеппе ди Витторио"
 #SRI_giuseppe_di_vittorio_leader_desc: "Джузеппе ди Витторио гордится тем, что он видел весь спектр итальянской нищеты. Родившись у бедных фермеров в Апулийской деревне, ди Витторио рос вокруг фермеров и провел взрослую жизнь с городскими рабочими в качестве профсоюзного работника. И это было естественно, что человек, который пришел и знал, что бедственное положение рабочих станет лидером Италии, привнося в национальный свет лицо рабочего класса. Нн Гиусеппейс, если жизнь на земле не была похожа на большую беду, то его отец умер, когда ему было 10 лет, вынуждая его работать на ферме, но он был уверен, и прекрасный ребёнок усердно работал, чтобы научиться читать и писать незнакомые слова, сэкономив деньги на словаре. К 12 годам он уже был политически активным и к 15 годам он был опозорен социалистическими и архистами. В отличие от многих своих социалистических коллег, он был не в состоянии посещать университет и вместо этого получил политическое образование в профессиональных союзах. nnHe and многие другие революционные синдикалисты находили в пользу Велки, он уже был уже активно настроенным человеком, и не был в своём в будущем."

 SRI_giacomo_matteotti: "Джакомо Маттеотти"
 #SRI_giacomo_matteotti_leader_desc: "Назвав &quot; Темпест &quot; своими коллегами, Джакомо Маттеотти является неуступчивым, мужественным лидером Социалистической партии, который не боится выступать против врагов как внутри, так и за пределами Социалистической Республики. Это сделало его идеальным лидером ОЗС для того, чтобы бросить вызов давнему доминированию Синдикалистского союза в итальянской политике. Ннн Борн богатой семье Венето в 1885 году Маттеотти изучал в Университете права контроль над ним. Там он был открыт для социалистической мысли и вскоре стал известным в своих социалистических кругах. Как и многие из его соотечественников - членов Социалистической партии, и в противоположность многим синдикалистам, Маттеотти был сторонником пацифизма во время Велкриги. Ему повезло, что его не поймали из-за своего статуса единственного выжившего сына своей семьи, и он был заключен в тюрьму за свои нетерпимые попытки положить конец итальянской репутации, как это было сделано в 1919 году, с австрийской оккупацией и началом гражданской войны."

 SRI_giuseppe_romita: "Джузеппе Ромита"
 #SRI_giuseppe_romita_leader_desc: "Не каждый день дети из бедных фермеров получают образование, а тем более становятся главами государств. И тем не менее, семья Джузеппе Ромита сделала именно это, победив шансы и взяв на себя руководство не только Социалистической партии Италии, но и Социалистической Республики Италия. В 1903 году он вступил в движение &quot; Социалистическая автономия &quot; , его воззрение оживило новую жизнь в PSI. non nothe Romita Family в Пьемонте, но Джузеппе усердно работал на получение диплома и смог оплатить обучение в Туринском университете, обучая других математике. В 1903 году он присоединился к PSI, поднявшись в 16-летнем возрасте, когда его республиканские писания и активная организация левых групп в Турине стали занимать видное место. Несмотря на то, что он был терпеливым и продолжал развивать свое влияние в регионе, он оказывал помощь итальянской революции в падении 1919 года на основе перемирия. Он был избран на высокие должности, но часто оказался в оппозиции, когда Синдикалистский союз начал сменовать и уклонять Социалистическую партию. Однако он был терпелен в своих отношениях и продолжал развивать свой автоном проект, до того, что он, до конца своей деятельности, добивший свои военные силы, до того, до того, до того, что он, чтобы он, добьет свои собственные силы, добьет свои собственные интересы, и антам антам антам антам, и антам, до его, он, он, чтобы антам антам антам, он, он, он, он, который он, и объединил в своей становил свои позиции в своей становил свои позиции в своей династи в своей антам, династит в своей династит на династи в своей династим, он, он, он, он, он, он, он, и часто выступает в своей династит в династит в своей династим, он династим, он, в своей антант, он, он, и часто выступает в оппозиции, в оппозиции, в оппозиции, и часто выступает в оппозиции, в оппозиции, в оппозиции, в оппозиции, в оппозиции, в оппозиции, он"

 SRI_olindo_vernocchi: "Олиндо Верночи"
 #SRI_olindo_vernocchi_leader_desc: "Когда вспыхивают суровые ветры, а погода становится непристойной, это часто соблазняет разделиться, чтобы ускорить и расстаться с друзьями. И с социалистической партией, имеющей постоянный статус как оппозиции синдикалистскому Союзу, геркулезные усилия должны были удержать дело от размежевания. Олиндо Верноцки посвятил большую часть своей карьеры сохранению своей любимой партии, подчеркивая свою обязанность перед пролетариатом защищать свои интересы, сохраняя единство."

 SRI_gaetano_salvemini: "Гаэтано Салвемини"
 #SRI_gaetano_salvemini_leader_desc: "&quot; Мы не можем быть беспристрастными. Мы можем быть только интеллектуально честными: то есть, зная о наших страстях, охраняя их и предупреждая наших читателей об опасности нашей пристрастности. Беспристрастность - это мечта, честность - долг. Это мудрые слова, отражающие вдумчивые, независимые духовные убеждения профессора Гаэтано Салвемини. Родившись возле Бари, Салвемини изучит средневековую историю во Флоренции. У учителя и профессора в торговле, его хитроумные способности заслужили бы себе пост президента современной истории в Университете Мессины. Трагически, землетрясение 1908 года убьет его жену и 5 детей - разрушит молодого ученого ученого. После этого инцидента он начал развивать свою собственную синтатичную политическую мысль, называемую &quot; конкретизмом &quot; , смесью либерализма, просветительной мысли и социализма."

