 #### Ideas ####
 ITA_desperate_defence: "Отчаянная оборона"
 ita_second_gw.1.d: "Немыслимое произошло. Немецкие бронированные командиры разрушили наши линии фронта и сейчас льются в Венето, как Австрийские достижения Великой войны. Первоначальная защита границы, несмотря на всю ее мощь, была обойдена или разрушена, и противник продвигается тревожными темпами. ~ ~ n-n reports спереди хаотичны, но мрачная реальность очевидна: битва вышла за пределы границы и в настоящее время сражается на полях и в деревнях на севере Италии. Как и мы с австрийскими захватчиками, мы должны соскребать все ресурсы, которые мы можем оттолкнуть их!"

 ITA_italian_civil_war_idea: "Итальянская гражданская война"

 ITA_umberto_ii: "Виктор Эммануэль III"
 ITA_umberto_ii_desc: ":: Всё, что я знаю."Soldier King" reminds the Italians of their recent victories in the Great War. His presence and their loyalty to him is a great source of unity for many people in Italy but a growing republican movement, coming from both the Far Right and the Left, may undermine this core figure of Italian nationhood."
 ITA_umberto_ii_2: "Виктор Эммануэль III"
 ITA_umberto_ii_2_desc: ":: Всё, что я знаю."Soldier King" reminds the Italians of their recent victories in the Great War. His presence and their loyalty to him is a great source of unity for many people in Italy but a growing republican movement, coming from both the Far Right and the Left, may undermine this core figure of Italian nationhood."

 ITA_isonzo_legacy: "Наследие Исонзо"
 ITA_isonzo_legacy_desc: "В то время как итальянские мужчины мужественно сражались, их сотни тысяч пали на австрийское оружие, поскольку некомпетентное высшее командование не отреагировало на меняющуюся ситуацию на местах, в то время как в ходе поствоенного расследования бывший начальник штаба Луиджи Кадорна был признан виновным в грубой некомпетентности и в проведении многих реформ в армии, культура некомпетентности и отказа адаптироваться в верхних эшелонах итальянских вооруженных сил осталась, что, к сожалению, привело к тому, что она плохо подготовлена к следующей войне, если не будут проведены незамедлительные реформы."
 ITA_isonzo_legacy2: "Осуществление окончательных реформ"
 ITA_isonzo_legacy2_desc: "С учетом многих наших реформ нам необходимо обеспечить, чтобы эти реформы были должным образом осуществлены во всех наших вооруженных силах и чтобы были осуществлены некоторые более окончательные реформы."


 ITA_communist_threat_light: "Коммунистическая угроза"
 ITA_communist_threat_light_desc: "Победа Партии социал-демократических итальянцев на недавних выборах успокоила более экстремальные элементы левого крыла, и теперь мы можем легко дышать, зная, что красные футболки больше не у нашего порога, ожидая момента слабости, чтобы нанести удар."
 ITA_colonial_administration: "Перерасширение колониальных границ"
 ITA_colonial_administration_desc: "После Великой войны Италия получила множество новых колониальных авуаров, но они очень дорого стоят. Ливия, наша крупнейшая колония, с начала 1920-х годов была втянута в разрушительный партизанский конфликт. Пока не будет найдено какое-то решение, чтобы положить конец этой войне, понадобится огромный гарнизон, чтобы не дать Ливии ускользнуть из Италии."
 ITA_colonial_administration2: "Перерасширение колониальных границ"
 ITA_colonial_administration2_desc: "После Великой войны Италия получила множество новых колониальных авуаров, но они очень дорого стоят. Ливия, наша крупнейшая колония, с начала 1920-х годов была втянута в разрушительный партизанский конфликт. Пока не будет найдено какое-то решение, чтобы положить конец этой войне, понадобится огромный гарнизон, чтобы не дать Ливии ускользнуть из Италии."
 ITA_libyan_soldiers: "Ливийские рекруты"
 ITA_libyan_soldiers_desc: "Предоставление законных прав народу Ливии заставило многих искать более видное место в итальянском обществе"
 ITA_war_libya: "Миротворчество Ливии"
 ITA_war_libya_desc: "Оппозиция ливийских мятежников была сильнее, чем ожидалось."
 ITA_libyan_prisoners: "Ливийские тюремные лагеря"
 ITA_libyan_prisoners_desc: "Война в Ливии привела к перенаселенности местных тюрем."
