l_russian:

 ITA_FUHRERREICH_DESC: "Великая война подтолкнула Италию к переломному моменту. Несмотря на то, что она была одной из победивших держав после конфликта, страна находилась на грани гражданской войны. Радикальные группы с обеих сторон политического спектра настаивали на противоречащих друг другу общественных переменах, которые грозили расколоть страну. Компромисс между социалистами и недавно созданным ИЦП принес в Италию столь необходимые реформы, но многие из основных конфликтов этой эпохи все еще сохраняются."

