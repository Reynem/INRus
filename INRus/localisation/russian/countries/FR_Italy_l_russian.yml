 ITA_expand_latin_germany: "&quot; Завоевать германию &quot;"
 ITA_expand_latin_germany_desc: "Ясно, что война с Германией неизбежна. После падения Франции и Великобритании мы будем следующими. Мы не должны допустить, чтобы грязные немцы захватили нашу страну, как это случилось с Римской империей. Мы должны отомстить за 476 рано или поздно."

 ITA_expand_latin_ussr: "Завоевать СССР"
 ITA_expand_latin_ussr_desc: "На протяжении десятилетий социализм лишь ослаблял великие нации и порабощал их народ, растущая сила СССР представляет собой большую угрозу Италии, мы должны уничтожить их и их наивную революцию, когда в Европе будет установлен новый порядок, он будет иметь место только для нас или для них."

