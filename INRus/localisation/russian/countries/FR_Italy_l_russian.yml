 ITA_socialist_turkey: "Создать турецкое социалистическое правительство"
 ITA_socialist_turkey_desc: "С социалистическим, антиколониальным правительством, руководимым Италией, велись дискуссии о том, что делать с нашей территорией Панфилии. Мы, очевидно, не можем передать ее турецкому правительству в Константинополе, поскольку они являются реакционными врагами. Мы не можем оставить ее в силе, поскольку это противоречит нашим антиколониальным принципам."

