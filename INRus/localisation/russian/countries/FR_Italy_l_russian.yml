 ITA_malta_bought_desc: "Правительство Великобритании согласилось продать нам территорию Мальты."\
 ITA_decentralization_conservative: "Автономия Сицилии"
 ITA_decentralization_conservative_desc: "Остров Сицилии на протяжении длительного времени находился под испанским контролем и со многими различиями с материка. Когда мы провозгласили единое итальянское государство, криминальные организации и бандитские отряды начали формироваться в Сицилии. Затем эти бандиты и мафии начали распространяться и увеличивать власть. Большинство бандитов в конечном итоге были побеждены центральным правительством, но преступные организации стали умнее и начали работать в тайне. До сих пор мафиозная проблема остается проблемой, и языковые различия являются барьером, по меньшей мере. С принятием конгрессом новой резолюции Сицилии будет предоставлено больше автономии, чтобы дать их народу более широкое представительство и, надеюсь, разбудить сицилийцев и заставить их бороться с мафией."
 ITA_decentralization: "Региональная децентрализация"
 ITA_decentralization_desc: "С момента падения Рима земли нашей нации всегда были разделены. Сначала нация разделялась между длиннабордами и Византинами, затем Фрэнки пришли и взяли кусочек. Испанцы также хотели кусочек, и в конце концов австрицы не могли сопротивляться. Столетия иностранной оккупации заставили наш народ говорить, действовать или иногда даже выглядеть иначе. Теперь, когда Италия является одной из них, мы должны признать эти различия и сделать их сильными. После различных переговоров в парламенте и одобрения Короля будут сформированы регионы. Каждый регион будет наделен особыми полномочиями, которые они должны будут уважать. Новыми образованными районами являются Абруззи-Молиза, Басиликата, Калабрия, Кампания, Далмазия, Эмилиа-Романия, Фрилия-Романия, Венеция, Лазио, Лигурия, Ломбардия, Марш, Пьемонте, Пуглия, Сардегна, Сицилиа, Тоскана, Трентино Алто Адиге, Умбрия, Д'Аоста и Венето." 
 ITA_colonial_fervor: "Колониальный Фервор"
 ITA_colonial_fervor_desc: ""
 ITA_highway_payment: "Ливийские дорожные платежи"
 ITA_highway_payment_desc: ""
 ITA_panfilla_purchased: "Платежи за панфилию"
 ITA_panfilla_purchased_desc: ""
