 ITA_socialist_rome_desc: "Вам нужна 30 социалистическая поддержка, чтобы принять это решение!"

 ITA_syndie_march_rome: "Март в парламенте" 
 ITA_syndie_march_rome_desc: "Для укрепления нашего движения мы должны взять на себя эффективный контроль над итальянским правительством. Но для того, чтобы наши требования были услышаны, мы должны получить поддержку народа. Поддержка региональных синдикатов и Сквадре д'Азионе должна дать нам необходимую политическую власть. §Ye Three Syndicalist: §! §R[?ITA.syndie_control]§!"

