 ITA_help_pope_idea: "Латеральный договор"
 ITA_help_pope_idea_desc: "В конце концов, решение ~"Roman Question\" has helped to end hostilities between the hardline Catholics and the state."
 #
 ITA_catholic_nation_idea: "Католическая нация"
 ITA_catholic_nation_idea_desc: "Большинство итальянцев являются католиками."
 #
 ITA_corporate_allies_idea: "Корпоратизм"
 ITA_corporate_allies_idea_desc: "Союз столицы и государства будет служить укреплению Италии, капиталистам будут предоставлены большинство свобод и обязанностей, которых они должны ожидать, но они будут связаны директивами правительства и короля."
 #
 ITA_dio_patria_famiglia_idea: "Дио, Патриция и Фамилья"
 ITA_dio_patria_famiglia_idea_desc: "\"God, Fatherland And Family\" are the core of the Italian's morals. With these values taken to heart we shall unify the people with the authority of the State."
 #
 ITA_revolution_above_idea: "Революция сверху"
 ITA_revolution_above_idea_desc: "Чтобы вывести Италию на путь превращения в промышленную власть, совет, находящийся под централизованным контролем, должен непосредственно управлять рабочим классом."
 #
 ITA_modern_farms_idea: "Государственные фермерские хозяйства"
 ITA_modern_farms_idea_desc: "Позволение приватизированным и другим автономным фермам работать подрывает способность Италии удовлетворять постоянно растущие потребности в зернах."
 #
 ITA_collectivised_industry_idea: "Командная экономика"
 ITA_collectivised_industry_idea_desc: "Централизованная экономика, контролируемая непосредственно Римом, будет приспособлена именно к потребностям нашей страны."
 #
 ITA_nationalization_decree_idea: "Национализация декретом"
 ITA_nationalization_decree_idea_desc: "Хотя многие социалисты выступали за медлительную передачу частной собственности в государственную собственность, ясно, что для выживания нашей революции мы должны иметь право немедленно национализировать промышленность по мере необходимости."
 #
 ITA_rapid_industry_idea: "Стремительная индустриализация"
 ITA_rapid_industry_idea_desc: "Мы должны использовать все возможности государственного аппарата для скорейшей индустриализации Италии."
 #
 ITA_secure_revolution_idea: "Обеспечение революции"
 ITA_secure_revolution_idea_desc: "Многие силы внутри Италии и за рубежом стремятся подорвать рабочих и Революцию, и мы должны убедиться, что рабочие готовы защищать Революцию, когда придет время."
 #
 ITA_support_communes_idea: "Поддержка общин"
 ITA_support_communes_idea_desc: "Местные коммуны и кооперативы являются основой итальянского социалистического движения."
 #
 ITA_collective_farms_idea: "Коллективные фермы"
 ITA_collective_farms_idea_desc: "Коллективные фермы, которыми руководят сами фермеры, будут избегать неэффективности рыночной экономики."
 #
 ITA_agrarian_economy_idea: "Аграрная экономика"
 ITA_agrarian_economy_idea_desc: "Экономика Южной Италии затормозилась в результате десятилетий протекционистской политики, направленной исключительно на поддержку промышленной экономики Севера, мы должны принять сельскохозяйственное ядро Италии и положить конец этой пагубной экономической политике."
 #
 ITA_expand_universities_idea: "Расширение университетов"
 ITA_expand_universities_idea_desc: "В отличие от сельских районов на юге, экономика Северной Италии основана на квалифицированной рабочей силе, но многие квалифицированные рабочие не имеют средств для приобретения навыков, необходимых для этой экономики."
 #
 ITA_democratic_industry_idea: "Демократизация промышленности"
 ITA_democratic_industry_idea_desc: "Нация построена снизу вверх рабочими, но, несмотря на это, капиталистический класс на протяжении десятилетий пытается ограничить их права и свободы."
 #
