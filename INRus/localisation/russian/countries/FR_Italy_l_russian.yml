 ITA_italo_balbo: "Итало Бальбо"
 # ITA_italo_balbo_leader_desc: "Немногие могли предсказать, что Итальянская Республика, давно раздираемая между аристократической федерацией, поддерживаемой Австрией, и демократией, поддерживаемой идеалистами, стала бы дураком, который презирал их обоих. Атога Бальбо объявил себя Иль Дуче до его легионеров и не был бы остановлен: ни приличиями, ни угрозой восстания, вторжения Австрийцев, ни красной угрозой Западу. ~nnBalbo вырос от своей смерти, когда его правительница была бы лучшей, и быстро упала под очарованием романтики. Он восхищался героями Рисорджименто, в частности Джузеппе Мацзини, и в 14 лет пытался сбежать, чтобы присоединиться к Ричотти Гарибальди, или же красной угрозой для него. ~ ~nBalbolbody that the Arganistian travant that the Otomman Yolk. ~ В то время, когда Велкрие вырвался в свои исследования и вступился в Алпи. Он быстро отметил свою смелость и фанатизм в отношении Австрых, наградивных наградивных и капитанов."

 ITA_pietro_ferdinando: "Пьетро Фердинандо д'Асбурго-Лорена"
 # ITA_pietro_ferdinando_leader_desc: "В то время как многие в Италии мечтают о больших переменах, другие оглядываются назад в прошлое, когда все было по-другому. Для многих из таких ностальгий, они смотрят на Гарибальди или Мацзини, в то время, когда Италия была сильной и объединенной. Но есть меньшинство, которое оглядывается еще дальше. По всей видимости, их мечта сбылась: Великий герцог Пьетро Фердинандо д'Асбурго-Лорена взял на себя звание президента восстановленной Итальянской федерации. В то время, как прежний Итальянский хитрый хитроум никогда не оставлял свою хитрость перед итальянскими войсками. Его хитрость, несомненно, была в качестве награды для Австрийских аристократов и консерваторов. nnPietro Ferdinando родилась в Зальцбурге у бывшего герцогства Австрийского герцогства."

 ITA_adriano_visconti: "Адриано Висконти"
 # ITA_adriano_visconti_leader_desc: "Давным-давно семья Висконти властвовала над Герцогством Милана. Похоже, что огромное состояние позволило им вернуться к власти, а затем некоторые: Адриано Висконти, австрийский граф Ломбарди, стал президентом Итальянской Федерации. Ирония, возможно, преднамеренный выбор: Миланцы были одними из самых враждебных против императорского правления над Северной Италией и поражение Австрии, победившего кандидата в Пьетро Фердинандо в Тоскане, могли бы свидетельствовать о большей степени независимости этой федерации от австрийского правления. Возможно, под этим молодым подсчетом и воздухом итальянская Федерация будет больше, чем просто еще одно государство Гапсбургского купета. Сын Галеаззо Висконти, Адриано родился во время Велкрига в тогдашней итальянской Ливии, но он все еще был немного больше, чем ребенок, когда он вернулся в Италию. В 1936 году, несмотря на растущую напряженность на полуострове, он проявил выдающийся талант как пилот, и всегда видел себя. Трустиндо родился во время дипломатического положения, не имеет ничего общего с целью обеспечения стабильности, но он все еще не видит своего юного человека, он не видит, не имеет драго во время драного во время дра дра дра, и не имеет дра дра, и не может быть драного дра, и не имеет дра, не имеет дра, чтобы он не имеет х х, х, х, х, х, х, х, хн, х, х, хн, он не имеет х, хн, хн, х, чтобы х, х, хн, но он не имеет хн, х, х, х, х, х, х, х, х, х, х, х, х, х, хот х, х, х, хот х, хот хот хва, х, х, хот, хот, хот, хот, хотец, х, хот, х, хот, х,"

 ITA_emilio_de_bono: "&lt; &lt; Эмилио де Боно &gt; &gt;"
 # ITA_emilio_de_bono_leader_desc: "Вечеринка была не очень дружной для Италии, и, как представляется, жизнь демократии в Итальянской Республике была мимолетной. Подавленные иностранными державами и наследием Италии. Гражданская война была еще свежей на оккупантах, Эмилио де Боно было поручено создать временное военное правительство для Италии. Учитывая обстоятельства, генерал де Боно останется у власти некоторое время. Несмотря на то, что в Ломбарди была создана иностранная вещь, Итальянский де хитроум стал одним из своих прародителей, в то время как в Ломбардии он стал хитроумным потомком итальянской армии. Он последовал в своем отце по стопам и зачислился в военную школу, учился в Милане и в то же время Модоне. Офицер в Берсильере, де Боно воевал в Эритрее и Ливии в период высокого положения нового итальянского королевства. ну, которое, к сожалению, не могло быть последним. В то время, когда Италия хватила свою долю у хитригий армии в 1915 году, тогда полковник де Бононо был направлен на борьбу с авантами против а затем генерала и лидером &lt; &lt; &lt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &lt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &lt; &gt; &gt; &gt; &gt; &gt; &lt; &lt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &"

 ITA_giovanni_gronchi: "Джованни Грончи"
 #ITA_giovanni_gronchi_leader_desc: "В стране, где доминируют католики, неудивительно, что Джованни Грончи и Итальянская народная партия (ИТП) взяли на себя ответственность за молодую Итальянскую Республику. Эта коалиция, доминировавшая над христианскими демократами, обещает направлять итальянскую нацию, используя христианские социальные учения, в отличие от антиклеарных группировок слева, продолжая при этом заниматься вопросами благосостояния и труда, противостоящими правому. Человеком, руководившим ИПИ, является Джованни Грончи, не являвшийся представителем Итальянского парламента, который стал одним из тех, кого они назвали лучшим лидером в области правой политики. Изначально одним из первых основателей христианской демократии в Италии стал учитель в школе, который получил степень в литературе из Писа, когда Велкронг сражался в качестве пехотного офицера. Когда война завершилась, Гованни Грончи также доказал, что они являются декоративным десантным десантистом в семье."

 ITA_luigi_einaudi: "Луиджи Эйнауди"
 #ITA_luigi_einaudi_leader_desc: "Иногда, несмотря на весь хаос и все быстрые изменения, охватившие всю нацию, легче вернуться к тому, что было раньше. Триумф Итальянской Либеральной партии является доказательством этого факта, и с возрождением доминирующей партии начала 1900-х годов, казалось бы, что статус-кво старого вернулся. Но не все одно и то же: Луиджи Эйнауди - новый человек, обещающий новый день в Италии. Под его пристальным вниманием, либерализм процветает в Италии и будет больше, чем просто капиталистическим средством для политического контроля. Скорее, это будет экспансионистская идеология, отражающая комплексный подход к моральному, экономическому и социальному рассуждению. В 1874 году его время в качестве вкладчика журнала в маленький городок в Пьемонте, он был осиротевшим в возрасте 14 лет. Он отправился в школу в Турине, где либеральское государство, и он стал более, чем просто десантным десантным защитником в Сальваторе Когнетти де Марти. Он сохранил свою собственную идеологию. Он провел значительную часть своей жизни в одном из своих крупнейших научных кругов, в 14 лет. Он пошел в школу в Туринскую, а также в Италию пошили в другую страну, и в другую страну, где он попался свою страну, и свою экономику в другую страну, и свою страну, и свою страну."

 ITA_marcello_soleri: "Марчелло Солери"
 # ITA_marcello_soleri_leader_desc: "Даже когда времена меняются, а политики приходят и уходят, для многих может быть обнадеживающим то, что знакомое лицо у руля. Марчелло Солери - это одно из этих лиц, прежнее политическое лицо в итальянской Либеральной партии, которое уже долгое время избегал дикого дикого дикого дикого дикого дикого дикого дикого дикого дикого форсировало дикого дикого итальянского агента, который изобиловал дикого итальянского герцога, из еще до Велкрии. До хаоса, который охватил Италию. Его видение Италии означает возвращение к старому, либеральному порядку - вызов католикам направо и социалистам налево. Несмотря на то, что хитрый диктующий дядядядядька становился в Кунео, а его прежняя карьера была отмечена левым, увлекалась социалистами и присоединилась к масонскому хитянскому хистанту. Однако он был связан с Голитти - с национальной партией - и помогал ему с умеренной оппозией социализмом."

 ITA_ivanoe_bonomi: "Ивано Бономи"
 # ITA_ivanoe_bonomi_leader_desc: "Когда в 1930 году сицилианцы и сардины вышли из состава Итальянской федерации, то премьер-министр Федерации Бономи все еще упорно боролся за Италию и Республику. Будучи премьер-министром, он стал легкой работой для большинства стран, и, конечно, не в разделенной Италии. Когда в 1930 году сицилианцы и сардинцы вышли из состава Итальянской федерации, то премьер-министр Федерации Бономи распустил Федерацию, смелый шаг, который создал новую республику и отдал в сторону иностранного монастыря, чтобы номинально править Италией. Впоследствии он был избран премьер-министром новой Итальянской Республики и его желание работать с многострадальной Австрией, хотя и экономически выгодно, продолжает проводить большую внутреннюю проверку. Бономи боролся за то, чтобы выдержать эту все более вирующую критику. В то же время, в то же время, в то время, в то время, в то время, в то время, как он стал одним из своих патриотов, занимавших пост президента страны, он начал заниматься разработкой политики, а в то же стал одним из своей страны, как отец новой австрийской войны или политической партии в Мантуа."

 ITA_ferruccio_parri: "Ferrucio Parri"
 #ITA_ferruccio_parri_leader_desc: "После десятилетий лидерства под руководством Ивано Бономи Либеральные демократы возродились под руководством Ферруксио Парри. При поддержке более широкой коалиции Парри надеется на новую эру единства в бурной Италии. Несмотря на то, что он был офицером генерального штаба Италии и редактором компании &lt; &lt; Коррье делла Сера &gt; &gt; , &lt; &lt; Велькриг &gt; &gt; навсегда изменила жизнь Парри. &lt; &lt; В качестве офицера &gt; &gt; он был украшен храбростью и был ранен в трех отдельных случаях на протяжении войны. &lt; &lt; В последние дни войны &gt; &gt; он был офицером генерального штаба Италии и был встревожен тем, что итальянские военные потерпели поражение от рук совместной австро-германской наступательной партии &lt; &lt; Парри &gt; &gt; . &lt; . &lt; &lt; nnParrigt; , &gt; th; , &gt; , &lt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; D &lt; &gt; &gt; , он &gt; &gt; &gt; &lt; , он &lt; ... &gt; , он &gt; &lt; , &lt; &lt; , в ходе &lt; , он &lt; , в ходе &gt; &gt; &gt; &lt; , он &lt; , он &lt; &gt; &gt; &gt; &gt; &gt; и &lt; &gt; &lt; &lt; , он &lt; , он &lt; , он &lt; &lt; &l"

 ITA_carlo_rosselli: "Карло Росселли"
 #ITA_carlo_rosselli_leader_desc: "Не все социалисты чувствовали себя комфортно в SRI. Карло Росселли является самоописанным «Либеральным социалистом», который сорвался с первоначальной социалистической революции в 1920-х годах, чтобы присоединиться к Республике. Несмотря на то, что вслед за этим не было массы, быстрые изменения в порядковом порядке после чёрного понедельника привели Росселли к власти. nnBorn в Риме к богатой семье Тускана, на него повлияла его мать, выдающийся итальянский деколонист. Он провел время в Вене, а затем Флоренции, борясь в своих научных кругах. Несмотря на то, что в начале своего рода итальянская республика, Карло присоединился к своим братьям в поддержку вмешательства. Он помог опубликовать пропагандистские материалы с «Ильстро программирования» в Риме, в том числе экскаваторские идеалы и гуманитарную любовь. Росселли пошел на войну в качестве офицера в Альпини в 1918 году и был вынужден сражаться во время отступления от Австро-Германского военного движения."

