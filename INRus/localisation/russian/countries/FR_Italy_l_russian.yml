 ITA_italian_labor: "Итальянское соглашение о труде"
 ITA_italian_labor_desc: "Итальянская комиссия Тулио Сианетти принесла в Германию экономический договор, который позволяет итальянским рабочим легко жить и работать в нашей стране без получения более стандартного разрешения на работу. Это соглашение привлекло столь необходимую рабочую силу для поддержки перевооружения Германии и, по сути, может стать началом сердечных отношений с итальянцами."
 #
 ITA_destroy_exiles: "Покончить с британскими изгнаниями"
 ITA_destroy_exiles_desc: "На протяжении всей нашей истории у нас были замыслы на какой-то или на всей территории британского правительства в изгнании, и теперь без сил Британской империи или даже материка регион теперь остается один."

 # Old stuff
 ITA_army_reforms: "Армейские реформы"
 ITA_army_reforms_desc: "Пока Италия победила в Великой войне, ясно, что характер войны изменился с 1919 года."
 ITA_mobile_warfare: "Бронированные головки"
 ITA_mobile_warfare_desc: "Хорошо бронированные мобильные подразделения будут лидером, который приведет нашу армию к битве."
 ITA_tank_research: "Модернизация цистерн"
 ITA_tank_research_desc: "Инновации в бронетехнике, исходящие из Германии и Франции, начинают выводить из класса наш собственный арсенал танков практически во всех отношениях. Нам нужны более крупные танки, которые двигаются быстрее, стреляют дальше и могут выдержать любую окружающую среду."
 ITA_tank_production: "Субсидирование производства итальянских цистерн"
 ITA_tank_production_desc: "Производство танков в Италии никогда не воспринималось так серьезно, как во Франции или Германии, у которых имеются огромные арсеналы танков."
 ITA_tank_speed: "Сосредоточься на мобильных цистернах"
 ITA_tank_speed_desc: "Впечатляющая скорость даст нашим танкам преимущество в битве."
 ITA_tank_damage: "Сосредоточься на большем оружии"
 ITA_tank_damage_desc: "Высшие вооружения дадут нашим танкам преимущество в битве."
 ITA_superior_firepower: "Высший огневой мощью"
 ITA_superior_firepower_desc: "Мы должны убедиться, что у нашей пехоты достаточно покрытого огня."
 ITA_artillery_damage: "Совершенствование артиллерийских корпусов"
 ITA_artillery_damage_desc: "Во время Великой войны многие наступательные силы были подорваны тем фактом, что значительная часть артиллерийских снарядов не взорвалась при ударе."
 ITA_art_research: "Модернизация артиллерии"
 ITA_art_research_desc: "Чтобы эффективно уничтожить позиции противника, мы должны иметь современные артиллерийские орудия, которые могут стрелять дальше и стрелять более крупными снарядами."
 ITA_artillery_bonus: "Фокус борьбы с педофилией"
 ITA_artillery_bonus_desc: "Мы должны направить наши средства на производство большого количества артиллерийских орудий, которые могут одолеть пехоту противника."
 ITA_antitank_bonus: "Антитанковый фокус"
 ITA_antitank_bonus_desc: "Мы должны направить наши средства на производство большого количества артиллерийских орудий, которые могут одолеть вражеские бронетанковые подразделения."
 ITA_officer_initiative: "Автономия офицера"
 ITA_officer_initiative_desc: "Талантливые офицеры должны быть наделены полномочиями принимать важные решения для армии, и никто не знает, что нашим солдатам нужно больше, чем офицеры на местах."
 ITA_support_companies: "Расширение компаний поддержки"
 ITA_support_companies_desc: "Наиболее легко забытой частью любой операции является материально-техническое обеспечение, но это может быть смертельной ошибкой."
 ITA_mountain_troops: "Инвестирование в Альпийские войска"
 ITA_mountain_troops_desc: "Наши сухопутные границы с нашими соседями охраняются Альпами, но это не остановило вражеских армий от вторжения в прошлом."
 ITA_planning_bonus: "Упрощение командной структуры"
 ITA_planning_bonus_desc: "Сложные бюрократические иерархии лишь замедляют способность нашей армии реагировать на меняющиеся ситуации на поле боя."
 ITA_defense_focus: "Доктрина защиты"
 ITA_defense_focus_desc: "Великая война показала нам, что преступления слишком дорого обходятся нашим солдатам."
 ITA_fort_construction: "Строительные сооружения"
 ITA_fort_construction_desc: "Хорошо построенные крепости помогут защитить наших солдат от различных атак."
 ITA_offensive_bonus: "Доктрина наступательных действий"
 ITA_offensive_bonus_desc: "Великая война показала нам, что хорошо спланированное наступление может оказать решающее воздействие на силы врага."
 ITA_mass_mobilization: "Массовая мобилизация"
 ITA_mass_mobilization_desc: "Великая война наложила большой стресс на способность Италии мобилизовать армию, до 1919 года наша нация одолела Австрийцев, несмотря на то, что они вели войну на двух фронтах, а мы нет. Мы должны быть уверены, что наша нация сможет быстро мобилизовать всю свою гражданскую мощь на защиту от любой угрозы."
 ITA_infantry_research: "Современные винтовки"
 ITA_infantry_research_desc: "Многие солдаты были оснащены многолетними винтовками во время Великой войны, что серьезно ослабило их способность эффективно бороться, и мы должны убедиться в том, что наши армии хорошо оснащены, если им когда-либо понадобится защита нашего народа."
 ITA_black_shirts: "Интегрировать ополчения в армию"
 ITA_black_shirts_desc: "Италия является домом для многих крупных военизированных групп, которые сомнительно преданы Риму, но очень преданы борьбе за свои дома, и мы должны воспользоваться этой самоотверженностью и дисциплиной этих подразделений, чтобы привести их в соответствие с военными стандартами."
 ITA_black_shirts_tt: "5 отрядов милиции по всей Италии!"
 ITA_infantry_production: "Субсидии Стрелковая промышленность"
 ITA_infantry_production_desc: "Во время Великой войны Италия страдала от острой нехватки винтовок, многие солдаты получили устаревшие винтовки в середине XIX века, которые были ужасно неадекватны для современной войны, и мы должны убедиться, что наша пехота хорошо вооружена и поставляется."
 ITA_infantry_quality: "Введение стандартов на огнестрельное оружие"
 ITA_infantry_quality_desc: "Солдат может быть только таким же эффективным, как винтовка в руке."
 ITA_army_training: "Рационализация системы профессиональной подготовки"
 ITA_army_training_desc: "Офицеры жаловались, что стандартные армейские тренировки слишком раздуты и содержат ненужные упражнения."
 ITA_doctrine_finalization: "Возвращение к военному величию"
 ITA_doctrine_finalization_desc: "Благодаря нашим многочисленным реформам мы теперь можем приступить к их осуществлению и завершить работу над доктриной, которую мы избрали для наших вооруженных сил."
 ITA_north_bases: "Укрепить Альпы"
 ITA_north_bases_desc: "Как наша единственная сухопутная связь с Европой, Альпы, несомненно, станут объектом военной агрессии наших врагов."
 ITA_south_bases: "Укрепить Средиземноморье"
 ITA_south_bases_desc: "Наша нация окружена Средиземным морем, военно-морские силы Европы, несомненно, воспользуются этим, чтобы нанести удар по любой из наших баз через это мощное море."
 ITA_air_bases: "Расширение военно-воздушных баз"
 ITA_air_bases_desc: "Воздушные силы будут разграничивать все предстоящие войны, и мы должны иметь авиабазы, необходимые для эффективного планирования наших военно-воздушных сил по мере необходимости."
 ITA_air_innovations: "Воздушная инновация"
 ITA_air_innovations_desc: "Италия была первой страной, которая в 1911 году использовала самолет для ведения боевых действий против турок в Ливии."
 ITA_regia_aeronautica: "Реджиа Аэронаутика"
 ITA_regia_aeronautica_dsc: "Сотрудничество авиакомпаний будет ключом к победе в будущих битвах, и Реджиа Аэронаутика должна будет быть уверена, что это возможно."
 ITA_regia_aeromarina: "Реджиа Аэромарина"
 ITA_regia_aeromarina_desc: "Сотрудничество военно-воздушных и морских подразделений будет ключом к выдвижению итальянского влияния по всему миру."
 ITA_bomber_development: "Разработка бомбардировщиков"
 ITA_bomber_development_desc: "Италия была первой страной, которая взорвала вражескую позицию с самолета во время Итало-турецкой войны."Bomber\" was born. Obviously the days of dropping explosives by hand from the pilot's cockpit are far behind us but we must always keep up latest in Tactical Bomber technology."
 ITA_air_innovations2: "Завершение разработки доктрины воздушных перевозок"
 ITA_air_innovations2_desc: "По мере приближения войны между Великими державами к реальности мы должны убедиться, что наши военно-воздушные силы способны бороться с любой угрозой, которую они бросили."
 ITA_mare_nostrum: "Мара Нострум"
 ITA_mare_nostrum_desc: ""
 ITA_carrier_focus: "Сосредоточьтесь на перевозчике"
 ITA_carrier_focus_desc: "В то время как боевой корабль был доказанным военным кораблем на протяжении десятилетий, авиаперевозчик имеет много военных теоретиков, хваливающих его гипотетическое применение в бою, хотя никто не может отрицать гибкость, которую мобильная авиабаза могла бы предоставить стране."
 ITA_battleship_focus: "Боевой корабль Focus"
 ITA_battleship_focus_desc: "Боевой корабль является пробным и подлинным компонентом любого военно-морского флота Великой державы, огневой мощи не сравнится в море, и мало кораблей могут надеяться на то, что они сразят одного из них в бою."
 ITA_supporting_ships: "Разработка вспомогательных судов"
 ITA_supporting_ships_desc: "По мере того как воздушные силы становятся все более мощными в море, потребность в поддержке кораблей для сдерживания их нападений продолжает расти."
 ITA_marines: "Морские отделы"
 ITA_marines_desc: "Несмотря на то, что Италия является военно-морской державой, у нее нет специальных морских сил."
 ITA_sub_stuff: "Подводные бои"
 ITA_sub_stuff_desc: "Немцы во время Великой войны показали миру силу подводной лодки. Значительная часть грузов "Энтенте" из Америки была уничтожена немецкими подводными лодками. В то время как военно-морские силы Италии впечатляют, возможно, не повредят более непрямому подходу к нашим врагам."
 ITA_finalize_navy: "Завершение разработки морской доктрины"
 ITA_finalize_navy_desc: "По мере того, как война между Великими державами приближается к реальности, мы должны убедиться, что наши военно-морские силы способны бороться с любой угрозой, которую они бросили."
 ITA_balbo_returns: "Итало Бальбо возвращается из Ливии"
 ITA_balbo_returns_desc: "С его недавней победой над командиром Сенусси Итало Балобом вернулся в Италию героем, с этой новой известной славой и поддержкой он приведет свою партию, АНИ, к победе на предстоящих выборах?"
 ITA_fate_al_mukhtar: "Судьба Омара Мухтара"
 ITA_fate_al_mukhtar_desc: "Обстоятельства вокруг его поимки, возможно, были спорными, но Омар Мухтар под стражей может предстать перед судом за свои преступления против Италии и ее народа."
 ITA_graziani_plan: "План Грациани"
 ITA_graziani_plan_desc: "Будучи преемником Бальбо в Ливии, коммандер Грациани имеет смелые планы в отношении региона."
 ITA_guerilla_amnesty: "&lt; &lt; Амнистия за гериллы &gt; &gt;"
 ITA_guerilla_amnesty_desc: "Война в Ливии закончилась, с захватом Омара Мухтара, организованного сопротивления в колонии, бывшие партизаны медленно возвращаются к нормальной жизни."
 ITA_install_local_leader: "Окончить военное правительство в Ливии"
 ITA_install_local_leader_desc: "Мы должны создать переходное правительство на его месте, пока не будет принято решение о постоянном правительстве."
 ITA_libya_church: "Правовой статус ислама в Ливии"
 ITA_libya_church_desc: "Отношения между Италией, главным образом католической нацией, и исламом были, по меньшей мере, менее чем звёздными. В прошлом итальянские правительства допускали антагонизм против исламских организаций в Ливии. Если мы хотим обеспечить стабильность в Ливии, мы должны принять решение о статусе ислама в регионе."
 ITA_more_autonomy: "Автономия для Ливии"
 ITA_more_autonomy_desc: "Настало время дать ливийцам возможность самим управлять Ливией."
 ITA_train_askaris: "Поездные отделения &lt; &lt; Аскари &gt; &gt;"
 ITA_train_askaris_desc: "\"Askari\" is a word that has been used to describe elite African soldiers by Europeans for decades now. To protect our colonies we will want to incorporate such highly sought after troops into our own armed forces"
 ITA_local_prince: "Укрепить лидера коренного населения в Ливии"
 ITA_local_prince_desc: "Эпоха итальянского правления в Ливии подходит к концу, был найден новый лидер и постоянное правительство колонии, и мы можем только надеяться, что это станет началом сближения между нашими двумя сторонами после десятилетий конфликта."
 ITA_invest_libya: "Инвестирование в Ливию"
 ITA_invest_libya_desc: "Для выживания новой независимой Ливии мы должны финансировать новое правительство и помочь им заплатить за ущерб, причиненный нашей страной."
 ITA_libya_highways: "Ливийские шоссейные дороги"
 ITA_libya_highways_desc: "Пустыня в Ливии похожа на море с небольшим количеством таких городов, как острова в бесконечном песчаном океане. Лишь немногие дороги соединяют эти поселения. Усилия по изменению этого положения в прошлом были остановлены ливийскими повстанцами, но с ограждением страны мы можем сейчас должным образом построить эту столь необходимую инфраструктуру."
 ITA_abyssinia_issue: "Восстановление порядка в Эфиопии"
 ITA_abyssinia_issue_desc: "Крушение Восточной Африки в анархию привело к тому, что Эфиопия впала в заблуждение, и, возможно, необходима четвертая Итало-эфиопская война, чтобы, наконец, преподать им урок итальянской военной эффективности."
 ITA_tripoli_car_club: "Гран-при Триполи"
 ITA_tripoli_car_club_desc: "В целях содействия развитию туризма и инвестиций в Ливию было предложено финансировать создание Гран-при Триполи, привлекательного для тысяч людей во всем мире."
 ITA_sponsor_settlements: "Спонсор итальянских населенных пунктов"
 ITA_sponsor_settlements_desc: "Темпы итальянских поселений в Ливии никогда не соответствовали ожиданиям правительства, если мы хотим ассимилировать этот регион, мы должны поддержать и субсидировать создание новых итальянских поселений в регионе."
 ITA_deport_cyrenaicans: "Депортированные циренейцы"
 ITA_deport_cyrenaicans_desc: "Народ Чиренаики был крупнейшим сторонником партизанской кампании Сенуссийского ордена в Ливии, многие из которых все еще тайно поддерживают независимость, и мы должны депортировать и разделить эту общину, чтобы они больше никогда не могли организоваться против итальянского правления."
 ITA_panfilla_issue: "Продажа Панфилии"
 ITA_panfilla_issue_desc: "Панфилию дали нам в конце Великой войны, но население не заинтересовано в интеграции в итальянское общество, мы, возможно, захотим сократить наши потери и продать регион туркам или грекам."
 ITA_panfilla_forts: "Укрепить Панфилию"
 ITA_panfilla_forts_desc: "Панфилия - это регион, полный ценных ресурсов, ясно, что турки отчаянно стремятся вернуть ее, мы должны защитить наши интересы в регионе и укрепить это колониальное положение."
 ITA_west_africa: "Разработать западноафриканские колонии"
 ITA_west_africa_desc: "Являясь нашим единственным прямым доступом к Атлантике, Камерун представляет жизненно важные интересы для нашего государства."
 ITA_east_africa: "Разработать Восточноафриканские колонии"
 ITA_east_africa_desc: "Несмотря на то, что наша страна является старейшей колониальной страной, Эритрея и Сомали начали сокращаться."Little Rome\", a city with more street lamps than even it's namesake but lack of funding has slowed down this once rampant development. Being at the crossroads of much of the world's trade we can not let these regions fall from our grasp."
 ITA_middle_east: "Проникнуть на Ближний Восток"
 ITA_middle_east_desc: "Богатство под песками в Аравии слишком долго хранилось французами и британцами, их влияние в регионе начало ослабевать, и мы должны заверить, что именно мы должны занять их место в регионе."


 #### Events ####
 ita.0.t: "Королевство Италия"
 ita.0.d: "В 1914 году, когда в первую крупную войну 20-го века Италия все еще оставалась нейтральной, по крайней мере первоначально, в Лондонском пакте была обещана итальянская партия в обмен на военную поддержку против центральных держав Германии и Австрии-Венгрии. С этим соглашением Италия присоединилась к хитрости Кордиаля, которая втянула свой народ в войну, которую многие были уверены в том, что она закончится к Рождеству. Несмотря на то, что она находилась на грани краха после нескольких недавних поражений в Австрии и Венгрии, она завоевала огромную защиту против итальянцев. Итальянский фронт никогда не впал в такой же тупик, как во Франции. В 1919 году Итальянский союз победил центральные державы, но даже как победитель Италии не был в неприкосновенном состоянии. Несмотря на то, что социальные беспорядки, которые велись в Италии в течение многих лет, когда солдаты возвращались с фронта, были рады вернуться в дом, где они не могли обеспечить себе защиту. В то время, когда экономика Италии разделяла Социалистические силы, движущаяся на российской революции, заняла фабрики и боровалась в полицию, в эпоху, которая теперь известна под названием &quot; &quot; &quot; &quot; &quot; &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot; ... &quot"
 ita.0.a: "Да здравствует Италия!"
 #
 ita.1.t: "Католический рейс"
 ita.1.d: "Слева от Луиджи Стурцо политика была расценена как свежий воздух сразу же после Великой войны, но, поскольку потребность в реформах упала в Италии, консервативная католическая фракция ИЦП сделала все более ясными требования. Наши компромиссы с умеренными социалистами очень непопулярны с ними, поскольку они видят, что теория Марксизма противоречит католическим учениям. Рост дальнеправого движения в Италии также рассматривается многими как знак того, что стране нужен сильный и разумный консервативный голос, который депутат ИЦП Альсид де Гаспери хотел бы использовать. Струзо и его сторонники, хотя они считают, что компромисс с националистами приведет лишь к внутреннему конфликту Италии, как видно из "Red Biennium" в начале 20-х годов."
 ita.1.a: "ИЦП должен обновлять политику, а не отказываться от принципов."
 ita.1.b: "Гаспери делает несколько хороших очков."
 #
 ita.2.t: "Давление со стороны социалистов слева"
 ita.2.d: "Социал-демократы и христианские социалисты, которые являются ядром ИЦП с момента начала Красного Бьенния, стали оказывать давление на партию, с тем чтобы она заняла более жесткую позицию в отношении прогрессивной политики. Италия добилась значительного прогресса за последнее десятилетие, но она по-прежнему является самой бедной из великих держав. В южной Италии нищета процветает, в то время как Север начинает сталкиваться с растущей безработицей. ИЦП должен быть привержен реальным политическим изменениям, если они хотят решить эти проблемы."
 ita.2.a: "Должно быть, мы устали от сдвига в сторону коммунизма."
 ita.2.b: "Мы должны обещать реформы"
 #
 ita.3.t: "Аграрные синдикаты Южной Италии"
 ita.3.d: "С тех пор, как Италия начала свою деятельность в области сельского хозяйства, она никогда не была самодостаточной, что требует массового импорта зерна из Франции. Усилия ИЦП, направленные на модернизацию итальянского сельского хозяйства, помогли облегчить эту проблему, но за счет мелких фермеров, которые едва платят за свои земли, не говоря уже об инструментах и механизмах, необходимых для модернизации. Поскольку более развитые фермерские конгломераты продолжают покупать сельскохозяйственные земли, многие фермеры нашли другое решение. На юге многие фермеры присоединились к ФИНС, основавшей фермерский синдикат, своего рода союз, который помогает его членам финансировать земельные платежи и механизмы в попытке замедлить монополизацию сельскохозяйственного сектора Италии. Хотя этот национальный синдикат очень популярен среди его членов, он стал питательной почвой для крайне правой национальной мысли и политического насилия, и несколько членов синдикатов были связаны с преступлениями против соперничающих социалистических союзов в регионе, а также с крупными частными учреждениями."
 ita.3.a: "Профсоюзы всех видов должны пользоваться равной защитой"
 ita.3.b: "Необходимо положить конец насилию"
 #
 ita.4.t: "Судьба ИЦП"
 ita.4.d: "Недавняя встреча делегатов от Партии Пополяре итальяно пришла в голову, поскольку растущие консервантские и прогрессивные группировки не смогли договориться о едином направлении кампании для предстоящих выборов. &quot; Альсид де Гаспери &quot; даже обвинил нынешних председателей ИПИ Луиджи Сттузо в преднамеренном подрыве и разделении партии. &quot; ИЦП &quot; - умеренная коалиция, которая возглавила Италию с тех пор, как 20-е годы могут развалиться и позволить стране попасть в руки экстремистов."
 ita.4.a: "Гаспери берет на себя руководство ИЦП и начинает свои реформы"
 ita.4.b: "Стурцо остается секретарем, Гаспери отказывается от ИЦП."
 #
 ita.5.t: "Социальные демократы отказываются от ИЦП"
 ita.5.d: "Попытка ИЦП выгнать умеренных социалистов из их коалиции откатилась назад, так как Джузеппе Сарагат и ОЧПСИ в акте солидарности решили вывести всю свою партию из коалиции, а затем подчиниться требованиям Гаспери. В рамках официальной оппозиции сейчас не ясно, как будут действовать социальные демократы на предстоящих выборах, но в любом случае это разделение не предвещает ничего хорошего для реформ Гаспери."
 ita.5.a: "Нам не нужна их поддержка."
 #
 ita.6.t: "Социальные демократы соглашаются дистанцироваться от социалистов"
 ita.6.d: "В попытке укрепить правящую коалицию ИЦП председатели Альсид де Гаспери потребовали, чтобы Джузеппе Сарагат отдалил политику своей партии от социалистов."
 ita.6.a: "Мы никогда не сможем пойти на компромисс с социалистами."
 #
 ita.8.t: "Социалисты атакуют нашу кампанию на севере"
 ita.8.d: "В то же время социалисты использовали кампанию ИЦП для поддержки капиталистов в качестве аргумента в пользу укрепления профсоюзов и укрепления солидарности трудящихся."
 ita.8.a: "Пропаганда вроде этого не выдержит."
 #
 ita.9.t: "Национальные синдики атакуют нашу кампанию на юге"
 ita.9.d: "Наша миссия найти политическую поддержку среди растущих фермерских конгломератов Южной Италии разговаривала против сильной синдикалистской оппозиции. Несколько союзников по ИПИ в регионе стали жертвами нападений и поджогов со стороны милиции ФНСН, известной как «Камичи Нер». До сих пор не было произведено арестов, но есть слухи, что командир МВНС Аттилио Теруцци приказал эти нападения. Пока, по крайней мере, похоже, мы не сможем рассчитывать на большую голосовую поддержку в регионе."
 ita.9.a: "Проклятье фашистов"
 #
 ita.11.t: "ПЛИ покидает нашу коалицию"
 ita.11.d: "Сегодня председатели итальянской Либеральной партии Луиджи Эйнауди объявили о намерении его партии покинуть коалицию ИЦП и официально присоединиться к консервативной оппозиции."
 ita.11.a: "Всего 20 лет и либерал станет консерватором, не изменяя ни одной идеи."
 #
 ita.12.t: "ИБОР присоединяется к нашей коалиции"
 ita.12.d: "С тех пор, как Красный Бьенний Итальянские социалисты были разделены между Итальянской коммунистической партией и Итальянской Социалистической партией, хотя с тех пор они были политическими союзниками, сильные идеологические дрифтеры начали их раздвигать. Социалисты обвиняли коммунистов в том, что они являются советскими марионетками, а коммунисты обвиняли социалистов в предательстве Революции."
 ita.12.a: "Мы обнимем их распростертыми объятиями."
 #
 ita.13.t: "Умеренные социалисты присоединяются к ИЦП"
 ita.13.d: "По мере того, как ИЦП проводит более социально осознанную политику, многие умеренные социалисты, особенно христианские социалисты, начали присоединяться к нашей партии. По мере того, как политическая ситуация в Москве, сердце левой мысли, становится все более хаотичной, многие социалисты начинают чувствовать себя отчужденными от своей партии, которая под давлением Советского Союза продолжает переворачивать свою собственную политику."
 ita.13.a: "Мы обнимем их распростертыми объятиями."
 #
 ita.14.t: "Вопрос внешней политики"
 ita.14.d: "Первый вопрос, поднятый в парламенте, - это направление нашей внешней политики. Консервативный делегат Альсид де Гаспери заявил, что Италия должна поддерживать более тесные отношения с членами Франции. Палмиро Тольятти из Коммунистической партии в качестве альтернативы заявил, что итальянская нация должна покинуть реакционную связь и вместо этого присоединиться к Советскому Союзу, однако его заявление не было поддержано более умеренными социалистами. Либералисты настояли на том, чтобы Италия перестраивалась с Великобританией, экономика которой зависит от Италии. И наконец, националисты утверждали, что Италия слишком зависит от иностранных союзов и должна укрепить себя в качестве правителя Средиземноморья."
 ita.14.a: "СССР является ядром революции, мы должны поддержать их."
 ita.14.b: "Тольятти дурак, но он не совсем ошибается..."
 ita.14.c: "Либералы правы, Британия - более разумный союзник."
 ita.14.e: "Де Гаспери прав, мы должны поддержать Энтект."
 ita.14.f: "Италия должна сама определить свою судьбу."
 #
 ita.15.t: "Вопрос о суфрагетке"
 ita.15.d: "Сегодня первая итальянская женщина-депутат Лина Мерлин, член социалистической партии, выступала за полное равенство, социалисты приветствовали ее выступление, в то время как более консервативные элементы итальянского парламента были потрясены ее бесстыдным превосходством."
 ita.15.a: "Женщины - краеугольный камень революции."
 ita.15.b: "Мы должны всегда учитывать точку зрения женщин."
 ita.15.c: "Любопытно, но она слишком радикальна."
 ita.15.e: "Политика - это не место для женщины."
 ita.15.f: "Женщины должны служить государству, а не наоборот."
 #
 ita.16.t: "Рост организованной преступности"
 ita.16.d: "В последние несколько лет на юге Италии и в Сицилии наблюдается резкий рост организованной преступности. Сейчас парламент вынужден рассмотреть вопрос о существенных реформах для борьбы с этим явлением. Министр Луиджи Штурцо, сам сицилиец, в одной из своих немногих консервативных позиций заявил в прошлом, что предоставление Сицилии большей автономии над своей собственной безопасностью поможет островному региону бороться с преступными семьями. Большинство демократических социалистов хотят добиться более широкой цели децентрализации для регионов Италии. Коммунисты предложили создать отряд боевиков против мафии, чтобы защитить народ. Либералиаты предпочли сохранить статус-кво, но обещали бороться с организованной преступностью. И наконец, националисты обвиняют организованное преступление в иностранном влиянии, особенно в том, что население Соединенных Штатов, которое принадлежит итальянскому народу, имеет глубокие семейные связи с итальянской толпой."
 ita.16.a: "Оружие уничтожило бы всех этих мафиозных ублюдков!"
 ita.16.b: "Децентрализация необходима для такого государства, как Италия."
 ita.16.c: "Нынешняя политика работает прекрасно"
 ita.16.e: "У Луиджи Стурцо было несколько хороших идей."
 ita.16.f: "Италия должна преодолеть эти иностранные силы"
 #
 ita.17.t: "Экономические реформы"
 ita.17.d: "После Великой войны Италия столкнулась с экономической депрессией и глубоко погрязла в долгах. ИЦП добился медленного восстановления, но итальянцы требуют более радикальных изменений. Левая коалиция пытается добиться создания государства всеобщего благосостояния или"Stato Sociale". The Communist of course are pushing for collectivization and the redistribution of the means of production. Liberals and Conservatives both support mild state intervention only if needed. Finally the nationalists wish for Italy to become self sufficient, independent from the volatile market economies of the West."
 ita.17.a: "Мы должны захватить средства производства!"
 ita.17.b: "Благотворительное государство было бы благоприятным вариантом."
 ita.17.c: "Экономика восстанавливается."
 ita.17.e: "Экономическая реформа - это скользкий путь к коммунизму."
 ita.17.f: "Целью для Италии должно быть стремление к Аутарки."
 #
 ita.18.t: "Роль монархии"
 ita.18.d: "Итальянцы обвиняют Виктора Эммануэля III в том, что его страна вступила в Великую Войну, конфликт, который чуть не разорвал страну. До сих пор спорят о роли короля в итальянской политике. На этот раз социалисты и национальные синдикалисты согласились, что современное государство не может быть сковано этой реликвией Тёмного века и давили на ИЦП на годы для проведения референдума по вопросу о создании Республики, которую ИЦП и их центристские союзники постоянно блокировали."
 ita.18.a: "Ни богов, ни королей, ни мастеров."
 ita.18.b: "Король должен сохранять церемониальную роль."
 ita.18.c: "В Конституции этот вопрос четко прописан."
 ita.18.e: "Влияние короля гарантирует стабильность."
 ita.18.f: "Итальянцы нуждаются в мощном современном лидере."
 #
 ita.19.t: "Наша колониальная политика"
 ita.19.d: "За последние 30 лет имперские границы Италии почти удвоились с включением Ливии, Панфилии и Камеруна, что привело к значительному увеличению военной и экономической активности без каких-либо возвратов. Социалисты придерживаются сильных антиимпериалистических взглядов и хотят, чтобы Италия эмансипировала колониями. Большинство центристских партий хотят продолжать вкладывать средства в итальянские колонии, настаивать на том, что экономическая прибыль, безусловно, находится за углом. Итальянские националисты утверждают, что Италия, как одна из великих держав, обречена на сохранение и расширение колониальных сфер."
 ita.19.a: "Империализм должен быть ликвидирован."
 ita.19.b: "Мы будем и впредь защищать наших колониальных подданных."
 ita.19.c: "Империализм улучшает экономику мастера и его предмета."
 ita.19.e: "Италия лишь помогает цивилизовать эти менее крупные государства."
 ita.19.f: "Италия имеет право на империю, как и любая великая власть."
 #
 ita.20.t: "Социалисты победили"
 ita.20.d: "В неожиданной победе социалистическая коалиция одержала победу на выборах. Хотя результаты являются противоречивыми, мало что может быть найдено. Это не остановило многих справа от протеста против партии. Многие обеспокоены тем, что это конец итальянской демократии, как мы ее знаем, и некоторые даже утверждают, что одно партийное коммунистическое государство находится за углом, но социалисты и их сторонники отрицают это и лишь стремятся реформировать итальянскую экономику и освободить рабочий класс."
 ita.20.a: "Поздравляю, товарищи."
 #
 ita.21.t: "Прогрессивные победили"
 ita.21.d: "Прогрессивная коалиция получила большинство голосов на выборах. По мере того, как все больше итальянцев приближаются к крайностям политического спектра, становится ясно, что для решения проблем Италии необходимы реальные реформы. Прогресс как в ППЧИ, так и в ИЦП сокращает разрыв между богатыми и бедными и принимает разумные меры по защите рабочего класса Италии."
 ita.21.a: "В такие времена, как эти значимые реформы, необходимы."
 #
 ita.22.t: "Либералы победили"
 ita.22.d: "Последние 20 лет либералы в Италии занимали лишь небольшое место в политической сцене Италии, несмотря на то, что она когда-то была доминирующей партией. Сейчас, когда политика Италии становится более радикальной, наши граждане хотят вернуться к разумному статус-кво, который был до Великой войны. И ПЛИ, и ДПЛ стремятся поддержать итальянских промышленников за счет субсидий и иностранных инвестиций, которые доведут прибыль до низших слоев общества."
 ita.22.a: "Мы не должны допустить, чтобы экстремистская сторона разделила Италию на части."
 #
 ita.23.t: "Консервативы победили"
 ita.23.d: "По мере того, как экстремисты продолжают разрушать Италию, становится ясно, что итальянцы стремятся к сильному разумному руководству, которое может объединить нацию."
 ita.23.a: "Да здравствует Италия!"
 #
 ita.24.t: "Националисты победили."
 ita.24.d: "На протяжении десятилетий итальянская либеральная демократия приносила страдания народу Италии, не имея ничего для этого. Несмотря на то, что почти все жертвы во время Великой войны не были лучше, чем до конфликта. Италия является ядром западной цивилизации на протяжении более двух тысячелетий, но недавно упала с этой позиции, омраченной властью Северной Европы. Националистическая коалиция теперь стремится к тому, чтобы Италия вновь заняла свое доминирующее положение в Европе, независимо от паразитического влияния ее соседей."
 ita.24.a: "Кредер, обувь, боец"
 #
 ita.25.t: "Ни одна коалиция не выигрывает большинство"
 ita.25.d: "Итальянские выборы 1936 года готовились к тому, чтобы стать одним из самых важных в истории нашей страны, но, как представляется, политические разногласия разделили избирательную базу. Ни одна партия не может требовать решающего выигрыша, и многие уже спорят о результатах. Виктору Эммануилу III пришлось лично вмешаться и оказать поддержку существующей ведущей коалиции ИЦП, которая будет продолжать возглавлять правительство."
 ita.25.a: "Дио Сальви Иль Ре!"
 #
 ita.26.t: "Социалисты берутся за оружие"
 ita.26.d: "Политический кризис, последовавший за недавними спорными результатами выборов, вызвал у итальянского народа большую тревогу. &lt; &lt; Общее забастовка &gt; &gt; переросла в революцию, поскольку страх перед крайне правым захватом, распространяющимся по всей Северной Италии. &lt; &lt; Пальмиро Тольятти &gt; &gt; взял на себя руководство этим восстанием и воспользовался возможностью объявить об учреждении Социалистической Республики Италии, преемника Итальянского Королевства. &lt; &lt; Ред милиция &gt; &gt; продолжает террор над итальянскими патриотами Северной Италии, готовыми служить своей стране, чтобы разрушить это восстание."
 ita.26.a: "К оружию!"
 #
 ita.27.t: "Националисты берутся за оружие"
 ita.27.d: "Политический кризис, последовавший за недавними спорными результатами выборов, подтолкнул несколько офицеров, возглавляемых Итало Бальбо, к тому, чтобы начать переворот против правительства в Риме. Они утверждают, что эти радикальные действия необходимы для «обеспечения стабильности» Италии и защиты ее народа от «надвигающейся социалистической угрозы», но большинство депутатов Рима рассматривают этот переворот как попытку установить у власти национальный синдикалист Бальбо и демонтировать конституционную монархию Италии. Большая часть нашей армии сохранила верность парламенту и королю и готова свергнуть это восстание."
 ita.27.a: "К оружию!"
 #
 ita.28.t: "Гражданская война в Италии"
 ita.28.d: "Политическая нестабильность в Италии переросла во все гражданские конфликты, социалисты по всей Северной Италии взялися за оружие, чтобы свергнуть демократическое правительство и установить диктатуру пролетариата. В нашей стране есть опасения, что это насилие может распространиться на Францию, что побудило многих министров оказать поддержку прямому военному вмешательству со стороны нашего итальянского союзника. Вокальное меньшинство, хотя и противостояло этому провоенному настроению, утверждает, что открытый конфликт только нанесет вред нашей стране и нанесет ущерб нашей экономике, которой Германия, безусловно, воспользуется."
 ita.28.a: "Мы будем поддерживать Италию"
 ita.28.b: "Мы будем оставаться нейтральными"
 #
 ita.29.t: "Гражданская война в Италии"
 ita.29.d: "Политическая нестабильность в Италии вспыхнула во всем гражданском конфликте. Страх социалистического поглощения подтолкнуло ФИСН к свержению правительства в Риме, с тем чтобы «безопасить национальную стабильность». В Париже многие министры обеспокоены тем, что этот конфликт может угрожать нашим владениям в Средиземноморье и Северной Африке, и они утверждают, что мы должны поддержать нашего союзника. Несколько министров, хотя и считают, что поддержка ФИСН против Рима может обеспечить нам более стабильный союзник, который был бы более управляемым. Вокальное меньшинство, хотя и противодействовало этому провоенному настроению, утверждая, что открытый конфликт только нанесет вред нашей стране и нанесет ущерб нашей экономике, которой Германия, несомненно, воспользуется."
 ita.29.a: "Мы будем поддерживать Италию"
 ita.29.b: "Мы будем оставаться нейтральными"
 ita.29.c: "Может, нам стоит поддержать этот переворот?"
 #
 ita.30.t: "Франция отказывается поддержать нас."
 ita.30.d: "Так как союзник Франции, правительство Италии предположило, что они получат полную поддержку, но Париж объявил, что Франция останется нейтральной в итальянском конфликте, ссылаясь на свою собственную озабоченность по поводу национальной безопасности по причине этого."
 ita.30.a: "Черт побери!"
 #
 ita.31.t: "Французские добровольцы"
 ita.31.d: "Политическая нестабильность в Италии лишь ослабила альянс &lt; &lt; Энтенти &gt; &gt; , и Франция считает, что наш Куп принесет столь необходимую стабильность в Средиземноморье, и поэтому они послали 2 добровольческих дивизии для поддержки нас."
 ita.31.a: "Надеюсь, начало долгой дружбы."
 #
 ita.32.t: "Судьба колоний Италии"
 ita.32.d: "Гражданская война в Италии поставила ее колонии в неустойчивое положение, при уменьшении помощи со стороны римских местных властей не в силах остановить растущие движения за независимость, возможный крах Итальянской империи может пролиться в наши собственные колонии с катастрофическими последствиями, и наши собственные колониальные власти предложили Франции оккупировать эти колонии по крайней мере на некоторое время для того, чтобы помочь в обеспечении местного порядка."
 ita.32.a: "Мы должны обезопасить их колонии."
 ita.32.b: "Это не наше место, чтобы вмешиваться."
 #
 ita.33.t: "Вернуть итальянские колонии?"
 ita.33.d: "Теперь, когда гражданская война в Италии закончилась, мы должны вернуть колонии победителей, как мы обещали?"
 ita.33.a: "Мы должны уважать Италию."
 ita.33.b: "Эти территории лучше, чем наши собственные."
 #
 ita.34.t: "Нажим на новое итальянское правительство"
 ita.34.d: "Не секрет, что внутренний круг нового итальянского правительства содержит много экстремистских элементов, таких, как национальный синдикалист Итало Бальбо. Если мы хотим сохранить Италию в качестве подвластного союзника, мы должны оказать давление на новое правительство, чтобы оно отдалилось от этих людей и установило более популярного лидера. Принц Амедео, герцог Аоста, пользуется поддержкой многих националистических и центристских фракций и является любимой королевской знаменитостью среди итальянского народа."
 ita.34.a: "Давление в Риме"
 ita.34.b: "Давайте не будем слишком давить на новый режим"
 #
 ita.35.t: "Пригласить Италию обратно в "Согласие"?"
 ita.35.d: "Теперь, когда мир восстановлен в Италии, мы пригласим новое правительство обратно в Согласие."
 ita.35.a: "Давайте не будем тратить наши усилия впустую."
 #
 ita.36.t: "Франция приглашает нас в «Согласие»"
 ita.36.d: "Франция пригласила Италию присоединиться к «Согласию», хотя поддержка Франции сыграла ключевую роль в том, чтобы помочь нам обезопасить Италию, есть опасения, что Париж может использовать нестабильность наших стран для своей личной выгоды."
 ita.36.a: "Франция показала нам свою добрую волю."
 ita.36.d: "Франции нельзя доверять"
 #
 ita.37.t: "Италия вернулась"
 ita.37.d: "Новое правительство Рима продемонстрировало свою готовность сотрудничать с нами и вернуло Италию в Согласие."
 ita.37.a: "Выпьем за Италию"
 #
 ita.38.t: "Италия отказывается вернуться"
 ita.38.d: "Несмотря на нашу поддержку их переворота, новое правительство в Риме отказывается присоединиться к Консенсусу или сотрудничать с нами в любом случае."
 ita.38.a: "Черт побери!"
 #
 ita.39.t: "Франция требует реформ правительства"
 ita.39.d: "Франция прислала нашему правительству то, что можно назвать лишь ультиматумом, в котором они требуют, чтобы итальянское правительство выгнало так называемые «экстремистские элементы», такие, как командир Итало Бальбо. В требованиях также говорится, что мы должны установить популярный герцог Амадео Аоста в качестве главы государства. Франция заявляет, что эти крупные реформы необходимы для стабилизации нашего режима, но подозревается, что эти требования направлены только на ослабление нашего правительства и полную зависимость нашей нации от Франции."
 ita.39.a: "Франция, несомненно, имеет в виду наши наилучшие интересы."
 ita.39.b: "Черт побери, французы"
 #
 ita.40.t: "Италия принимает наши требования"
 ita.40.d: "Новое правительство Рима приняло наши требования и назначило Амадео Аосту главой своего государства."
 ita.40.a: "Наконец-то надёжный союзник"
 #
 ita.41.t: "Италия отвергает наши требования"
 ita.41.d: "Новое правительство Рима отказалось выдвигать наши требования."
 ita.41.a: "Черт побери!"
 #
 ita.42.t: "Франция оккупирует итальянские колонии"
 ita.42.d: "Франция объявила сегодня о своей оккупации колоний Италии, заявив, что эта акция была направлена на обеспечение порядка в колониях и защиту местного населения от последствий войны в Италии и не является постоянной аннексией."
 ita.42.a: "Черт побери!"
 #
 ita.43.t: "Судьба Италии"
 ita.43.d: "Очевидно, что Франция отстаёт от своего соперника Германии, тянет нас вниз с ними. Настало время пересмотреть наши отношения с Францией и, возможно, даже присоединиться к растущему немецкому титану. Франция вновь и вновь показывает, что они лишь пытаются подорвать Италию."
 ita.43.a: "Нам не нужна Франция."
 ita.43.b: "Франция не так уж и плоха."
 #
 ita.44.t: "Италия покидает Консенсус"
 ita.44.d: "Несмотря на нашу неизменную поддержку их режима, Италия объявила о своем намерении покинуть Консенсус и проводить более нейтральную внешнюю политику."
 ita.44.a: "Черт побери!"
 #
 ita.45.t: "Присоединиться к Штальпакту?"
 ita.45.d: "В то время как вторая Великая война бушует на полях сражений Франции, ясно, что вскоре победителем станет Германия, и это было бы постоянным пятном в нашей истории, если бы мы были исключены из этой знаменательной победы и позволили немцам полностью контролировать наши притязания на Францию."
 ita.45.a: "Мы должны присоединиться к немцам."
 ita.45.b: "Наша нация не готова к войне."
 #
 ita.46.t: "Национальная Итальянская Республика желает присоединиться к Штальпакту"
 ita.46.d: "В то время как наши армии движутся во Францию Италия хочет открыть второй фронт на южной границе Франции, хотя это, несомненно, ускорило бы крах Франции, многие из наших генералов считают, что только немецкая армия сможет победить Францию."
 ita.46.a: "У нас должен быть второй фронт."
 ita.46.b: "Нашим генералам не нужна помощь."
 #
 ita.47.t: "Германия принимает нас в Штальпакт"
 ita.47.d: "Германия официально приняла нас в Штальпакт, сейчас наши армии готовятся открыть фронт против Франции на своей южной границе, с помощью Германии война во Франции скоро закончится, и мы заслужим наше место на мирной конференции."
 ita.47.a: "Тост за нашего немецкого союзника"
 #
 ita.48.t: "Германия отказывается от нашего членства в Штальпакте"
 ita.48.d: "Похоже, что Германия не заинтересована в открытии второго фронта против Франции и отказалась от нашего членства в Штальпакте, несмотря на то, что многие итальянские генералы по-прежнему считают, что мы должны вторгнуться во Францию и оккупировать наши спорные территории, прежде чем Германия получит их."
 ita.48.a: "Мы должны оставаться нейтральными."
 ita.48.b: "Мы должны оккупировать нашу законную территорию"
 #
 ita.49.t: "Христианские демократы присоединяются к националистам"
 ita.49.d: "С недавним дрейфом ИЦП в левое большинство правого крыла Италии нервничаешь из-за возможного социалистического захвата страны. &quot; Красный биенний &quot; - это недавняя память многих итальянцев, и большинство из них не стремятся к ее восстановлению. В эту быстро меняющуюся эру итальянской политики недавно сформированная Христианская демократическая партия, возглавляемая бывшим членом ИЦП &quot; Альсидом де Гаспери &quot; , начала строить дороги с националистами. Подозревается, что они могут даже сформировать свою собственную коалицию, чтобы противостоять нашей партии. &quot; Гаспери &quot; , которая выступает в качестве умеренной партии, считает, что действия его партии были необходимы для сохранения традиционной итальянской культуры."
 ita.49.a: "Всего 20 лет и либерал станет консерватором, не изменяя ни одной идеи."
 #
 ita.50.t: "Выбор министра иностранных дел"
 ita.50.d: "Если мы хотим создать сильное и стабильное правительство, мы, возможно, захотим пригласить членов других партий в наше правительство."
 ita.50.a: "Пригласите коммунистического министра."
 ita.50.b: "Приглашать социалистического министра"
 ita.50.c: "Приглашать министра по делам социал-демократов"
 ita.50.e: "Пригласите либерального министра"
 ita.50.f: "Пригласите консервативного министра"
 ita.50.g: "Приглашать национального популистского министра"
 ita.50.h: "Пригласите валькистского священника."
 ita.50.i: "С самим министром нашей партии все в порядке."
 #
 ita.51.t: "Выбор министра экономики"
 ita.51.d: "Если мы хотим создать сильное и стабильное правительство, мы, возможно, захотим пригласить членов других партий в наше правительство."
 ita.51.a: "Пригласите коммунистического министра."
 ita.51.b: "Приглашать социалистического министра"
 ita.51.c: "Приглашать министра по делам социал-демократов"
 ita.51.e: "Пригласите либерального министра"
 ita.51.f: "Пригласите консервативного министра"
 ita.51.g: "Приглашать национального популистского министра"
 ita.51.h: "Пригласите валькистского священника."
 ita.51.i: "С самим министром нашей партии все в порядке."
 #
 ita.52.t: "Выбор министра безопасности"
 ita.52.d: "Если мы хотим создать сильное и стабильное правительство, мы, возможно, захотим пригласить членов других партий в наше правительство."
 ita.52.a: "Пригласите коммунистического министра."
 ita.52.b: "Приглашать социалистического министра"
 ita.52.c: "Приглашать министра по делам социал-демократов"
 ita.52.e: "Пригласите либерального министра"
 ita.52.f: "Пригласите консервативного министра"
 ita.52.g: "Приглашать национального популистского министра"
 ita.52.h: "Пригласите валькистского священника."
 ita.52.i: "С самим министром нашей партии все в порядке."
 #
 ita.53.t: "Италия покидает Консенсус"
 ita.53.d: "Премьер-министр Италии Итало Бальбо объявил сегодня, что Италия аннулирует свой союз с Францией и будет стремиться к независимой внешней политике."
 ita.53.a: "Чёрт."
 #
 ita.54.t: "Наши споры с Францией"
 ita.54.d: "Италия и Франция были союзниками всего лишь на протяжении двух десятилетий. В то время как в 1915 году "Согласие" казалось очевидным выбором для Италии, сегодня территориальные споры угрожают разрушить этот союз. Поскольку националистические настроения растут внутри Италии, ясно, что мы больше не можем игнорировать эти вопросы. Почти миллион итальянцев живут под французским правлением, не имея автономии для защиты своей культуры. В Африке французы делают все возможное, чтобы не допустить роста итальянского влияния, например, вынуждая итальянских поселенцев в Тунисе, которые даже до сих пор не вышли из числа французских поселенцев в регионе. Кроме того, многие в Италии сомневаются в способности Франции защитить Европу от немецкой агрессии, говоря о том, что союз с Францией похож на пакт о самоубийстве. Если мы хотим продолжать наши нынешние отношения с Францией, мы должны решить эти вопросы."
 ita.54.a: "Мы должны достичь компромисса."
 ita.54.b: "Время для компромисса закончилось, и мы должны определить свою судьбу."
 #
 ita.55.t: "Франко-итальянская территориальная конференция"
 ita.55.d: "Не было секретом, что десятилетиями группировки в Италии добивались большего итальянского влияния на французскую территорию. Сегодня Рим пригласил нас обсудить эти и несколько других споров, и хотя они уверяют нас, что эти дискуссии не будут обязательными, ясно, что они могут иметь серьезные последствия для альянса Энтенти в целом. Очень немногие во Франции осмелились бы уступить что-либо Италии, но, как их союзник, это может быть в наших интересах, по крайней мере, выслушать их."
 ita.55.a: "Мы должны послушать нашего союзника."
 ita.55.b: "Сейчас не время для большего территориального ревизионизма."
 #
 ita.56.t: "Итальянское меньшинство во Франции"
 ita.56.d: "На протяжении веков итальянцы жили в районах, отличающихся сейчас от столичной Франции. Во-первых, в 1769 году Франция аннексировала остров Корсика, но еще в 1860 году Герцог Савой и округ Ницца, исторически итальянский, были удостоены поддержки со стороны Пейдмонт-Сардиния Франции в связи с целью объединения Итальянского полуострова. Хотя в настоящее время это, возможно, было выгодно, многие рассматривают это как явно неравноправный договор, официальная позиция Италии в отношении судьбы этих территорий и итальянцев внутри них была по меньшей мере расплывчатой, хотя некоторые хотели бы, чтобы возвращение Савойя и Ниццы скорее всего убедилось во Франции в том, что она гарантирует им и их итальянскую культуру правовую защиту и автономию или, возможно, даже обмен населением."
 ita.56.a: "Мы должны решить этот вопрос."
 ita.56.b: "Это не очень важно."
 #
 ita.57.t: "Судьба итальянская диаспора"
 ita.57.d: "В 1860 году Туринский договор мирно уступил территории Савойя и Ниццы Франции из Пейдмонта-Сардини, хотя это было сочтено справедливым для обеих сторон в то время в ретроспективе, некоторые в Италии считают этот договор крайне несправедливым. В то время как большинство в этих регионах являются французскими, значительное итальянское меньшинство живет в этом районе. Рим желает, чтобы мы гарантировали этому населению, а также итальянцам в Корсике особые юридические права и автономию. Некоторые в Италии хотели бы видеть более решительные действия, такие как перемещение населения между двумя нашими странами."
 ita.57.a: "Мы дадим этим итальянцам специальную защиту."
 ita.57.b: "Мы будем поддерживать процесс перемещения населения"
 ita.57.c: "Это французские общины."
 #
 ita.58.t: "Франция обеспечит особую защиту для местных итальянцев"
 ita.58.d: "Как надежный союзник французы услышали наши мольбы и предоставят итальянским общинам, живущим во Франции, специальную правовую защиту, прекратив при этом все попытки ассимилировать их с французской культурой."
 ita.58.a: "Разумный выбор для Франции"
 #
 ita.59.t: "Франция отказывается признать, что это итальянское население."
 ita.59.d: "Бык, возглавляющий французский, оскорбил нас, отрицает присутствие итальянцев в Савойе, Ницце или даже Корсике, утверждая, что эти люди французы, несмотря на местные диалекты, на которых они говорят."
 ita.59.a: "Как варварски."
 #
 ita.60.t: "Суэцкий канал"
 ita.60.d: "Наши колонии в Восточной Африке полностью зависят от поставок, которые проходят через Суэцкий канал. В то время как британское правительство владеет 44% акций компании, частные французские инвесторы владеют оставшимися акциями. Эта ситуация ставит наши восточноафриканские колонии в уязвимое положение. Любые товары из Италии должны проходить через канал и платить пошлину, что мы не можем контролировать или влиять на него. Этот вопрос может быть решен путем обращения к французам с просьбой предоставить итальянскому представителю место в совете директоров компании, что даст нашей стране право высказаться по поводу политики Суэцкого канала."
 ita.60.a: "У нас должен быть надежный доступ к востоку."
 ita.60.b: "Это не очень важно."
 #
 ita.61.t: "Италия хочет влияния на компанию Суэцкого канала"
 ita.61.d: "В то время как крупнейшим единоличным владельцем Суэцкого канала является британское правительство с 44-процентной долей акций в компании, частные французские инвесторы владеют оставшимися акциями. Это ставит Италию и ее восточноафриканские колонии в уязвимое положение. Любые товары, поступающие из Италии, должны проходить через канал и платить пошлину, что не имеет никакого контроля или влияния. Рим предполагает, что этот вопрос может быть урегулирован путем предоставления итальянскому представителю места в совете директоров компании. Хотя это решение, несомненно, удовлетворит Италию, оно уменьшит влияние французских должностных лиц в компании и, возможно, уменьшит будущий доход от итальянских морских перевозок."
 ita.61.a: "Мы позволим итальянскому представителю"
 ita.61.b: "В компании не будет никаких реформ."
 #
 ita.62.t: "Франция предоставит нам место в компании Суэцкого канала"
 ita.62.d: "Французы выполнили нашу разумную просьбу и позволят итальянскому представителю заседать в совете директоров компании Суэцкого канала."
 ita.62.a: "Разумное действие"
 #
 ita.63.t: "Франция отклоняет наши просьбы о расширении влияния на компанию Суэцкого канала"
 ita.63.d: "Упрямые французы отклонили наши просьбы, заявив, что они не хотят реформировать компанию в настоящее время."
 ita.63.a: "Черт побери!"
 #
 ita.64.t: "Безопасность Австрии"
 ita.64.d: "В то время как Версальский договор гарантирует их суверенитет, германские националистические настроения растут внутри страны и угрожают создать союз с Германией, который вновь откроет нашу северную границу для вторжения."
 ita.64.a: "Мы должны получить поддержку для нашей северной границы."
 ita.64.b: "Это не очень важно."
 #
 ita.65.t: "Италия добивается гарантии для Австрии"
 ita.65.d: "В Версальском договоре говорится, что Австрийская нация навсегда останется независимой от Германии, однако националистические настроения в обеих этих странах угрожают немецкой аннексии Австрии. Многие в Италии обеспокоены тем, что их Северная граница была разрушена австро-германскими войсками во время Великой войны. Рим желает, чтобы мы оба вновь публично подтвердили нашу гарантию суверенитета Австрии."
 ita.65.a: "Мы будем защищать Австрию"
 ita.65.b: "Мы не можем ничего обещать."
 #
 ita.66.t: "Франция обещает защитить Австрию"
 ita.66.d: "Франция вновь взяла на себя твердое обязательство придерживаться Версальского договора и всех его положений и будет защищать независимость Австрии по мере необходимости."
 ita.66.a: "Мы можем успокоиться, зная, что наша северная граница будет в безопасности."
 #
 ita.67.t: "Франция не дает обещаний в отношении Австрии"
 ita.67.d: "Похоже, что Франция изменила свою когда-то твердую позицию по Версальскому договору и не даст никаких обещаний в отношении \"Austria Issue\". Apparently the see appeasement as the better way to deal with Germany."
 ita.67.a: "Угроза Германии может заставить нас пересмотреть наши отношения с Францией."
 #
 ita.68.t: "Контроль над железной дорогой Аддис-Джибути"
 ita.68.d: "Сооруженная французскими инженерами железная дорога Аддис-Абеба-Джибути является главной связью Эфиопии с внешним миром."
 ita.68.a: "Рост Итальянской Восточной Африки обусловлен этой железной дорогой"
 ita.68.b: "Это не очень важно."
 #
 ita.69.t: "Италия требует контроля над железной дорогой Аддис-Джибути"
 ita.69.d: "Построенная французскими инженерами железная дорога Абеба-Джибути является главной связью Эфиопии с внешним миром."
 ita.69.a: "Мы передадим контроль"
 ita.69.b: "Она останется французской собственностью."
 #
 ita.70.t: "Франция соглашается передать контроль над железной дорогой Аддис-Джибути"
 ita.70.d: "Увидев ужасное состояние, в котором Эфиопия оказалась во Франции, она согласилась передать контроль над этой железной дорогой итальянским колониальным властям."
 ita.70.a: "Это, безусловно, поможет нам в ситуации в Восточной Африке"
 #
 ita.71.t: "Франция отказывается передать контроль над железной дорогой Аддис-Джибути"
 ita.71.d: "Несмотря на то, что их сограждане, обладающие империалистической властью, нуждаются в поддержке, французы отказались передать право собственности на железную дорогу между Аддис-Абебой и Джибути."
 ita.71.a: "Проклятье!"
 #
 ita.72.t: "Свободный порт в Джибути"
 ita.72.d: "Джибути является крупнейшим и наиболее развитым регионом во всей Восточной Африке. Наши колонии в этом регионе в значительной степени зависят от поставок, проходящих через эту колонию, что является тем фактом, что французы в полной мере пользуются преимуществами, и если мы хотим, чтобы наши колонии стали достаточными, то у нас будет доступ к свободному порту в этом регионе."
 ita.72.a: "Рост Италии в Восточной Африке обусловлен этим единым регионом"
 ita.72.b: "Это не очень важно."
 #
 ita.73.t: "Итальянский запрос о контроле за свободным портом в Джибути"
 ita.73.d: "Джибути является экономическим центром Восточной Африки, что хорошо известно итальянцам, поскольку их влияние в регионе возрастает, потребность в более непосредственной связи с Италией становится острой, Рим обращается с просьбой о создании свободного порта в регионе, с тем чтобы помочь стимулировать экономический рост в своих собственных колониях."
 ita.73.a: "Мы предоставим им свободный порт"
 ita.73.b: "Джибути слишком важна"
 #
 ita.74.t: "Франция предоставляет нам свободный порт в Джибути"
 ita.74.d: "Французы с радостью услышали о наших потребностях и предоставили нам права на свободный порт в своей колонии Джибути."
 ita.74.a: "Мудрый выбор"
 #
 ita.75.t: "Франция отказывается предоставить нам свободный порт в Джибути."
 ita.75.d: "Несмотря на то, что наши восточноафриканские колонии нуждаются в помощи, эгоистичные французы все равно отказываются нам помогать."
 ita.75.a: "Проклятье!"
 #
 ita.76.t: "Кондоминиум над Тунисом"
 ita.76.d: "Что касается нашего последнего вопроса, то мы должны обсудить будущее Туниса с Францией."Schiaffo di Tunisi\" as it has become known created heavy tensions between France and Italy. In 1881 when the French invaded Italian settlers made up the largest European community in the region, a fact that still stands true to this day despite French efforts to assimilate them. It's clear that Tunisia can never be separated from it's Italian influence. It has been suggested that to compromise with the French over this issue the creation of a Condominium over Tunisia in which both our nations would have equal influence could be set up."
 ita.76.a: "У нас должен быть контроль над 4-м Шором."
 ita.76.b: "Это не очень важно."
 #
 ita.77.t: "Италия запрашивает презерватив над Тунисом"
 ita.77.d: "Тунис является имперской амбицией Италии уже на протяжении нескольких десятилетий. Наши две нации спорят о законном суверенитете этой земли с тех пор, как мы ее аннексировали в 1881 году. Несмотря на то, что с тех пор итальянские националисты постоянно контролируют Тунис, они по-прежнему считают его законной итальянской территорией, видя большое число итальянских поселенцев, а также стратегическое местоположение Италии. Сегодня Италия обратилась с просьбой о создании кондоминиума над Тунисом, в котором обе наши нации будут обладать равным суверенитетом над регионом."
 ita.77.a: "Мы можем принять кондоминиум"
 ita.77.b: "Мы не будем ставить под угрозу нашу Империю."
 #
 ita.78.t: "Франция согласна создать кондоминиум над Тунисом"
 ita.78.d: "Увидев законность наших притязаний в Тунисе, французы согласились сформировать кондоминиум над регионом, в котором обе наши страны будут обладать равным суверенитетом."
 ita.78.a: "Разумное решение"
 #
 ita.79.t: "Франция отказывается создать кондоминиум над Тунисом"
 ita.79.d: "Несмотря на наши твердые притязания, упрямые французы отказались пойти на компромисс по поводу их имперской власти."
 ita.79.a: "Проклятье!"
 #
 ita.80.t: "Франция отказывается присутствовать на любой конференции"
 ita.80.d: "Несмотря на наши попытки найти компромисс с французами, кажется, что их высокомерие сбивает их с толку по любым разумным просьбам, так как сегодня многие в Италии возмущены действиями французов, ясно, что они рассматривают наши нации как меньшего партнера в этом союзе."
 ita.80.a: "Франция не является достойным союзником Италии."
 ita.80.b: "Сейчас не время переоценивать наш союз."
 #
 ita.81.t: "Франция поддерживает процесс перемещения населения"
 ita.81.d: "Неожиданно правительство Франции желает решить этот вопрос."Italian Issue/" once and for all and has agreed to a population transfer. They will transfer Italians in Savoy, Nice and Corsica back to Italy and in return will transfer our local French minority in Aosta Valley and Northern Sardinia back to France. While some may see this as a drastic action it's a positive sign that France takes our grievances seriously."
 ita.81.a: "Неожиданное решение, но приветственное."
 #
 ita.82.t: ""Согласие" будет защищать Австрию"
 ita.82.d: "По просьбе Италии "Согласие" сделало совместное заявление, гарантирующее независимость Австрии. [ГЕР.Гедер] продолжает пересматривать Версальский договор и настаивать на проведении общегерманской внешней политики."
 ita.82.a: "Мы признательны за любую поддержку"
 #
 ita.83.t: "Коллапс Австрии"
 ita.83.d: "Несмотря на наши гарантии и гарантии Франции Австрии, кажется, что Вена до сих пор остается в руках иностранных сил. Крушение независимой Австрии сделало нашу северную границу уязвимой и может оставить нас открытыми для прямого вторжения Германии в нашу страну. Ясно, что Франции либо не хватает способности или воли защитить Европу, и в таких обстоятельствах мы должны рассмотреть наши отношения с ними. Возможно, в наших интересах принять нейтральную внешнюю политику, чтобы избежать еще одного кровопролитного тупика на итальянской земле, но Германия, похоже, готова игнорировать нейтралитет, если она неудобный дипломатический подход. Судьба Италии и Европы висит на балансе, мы должны принять мудрое решение."
 ita.83.a: "Уход из Франции сделает нас обоих уязвимыми."
 ita.83.b: "Нейтральность спасет нашу страну от кровопролития"
 #
 ita.84.t: "Италия отказывается от Согласия"
 ita.84.d: "После краха Австрии в Риме разразился кризис. Большинство итальянских министров больше не верят во Францию и не могут защитить Европу. Италия решила принять нейтральную внешнюю политику в ошибочной надежде на то, что такая акция успокоит ястребов войны в Берлине. Внезапный крах "Согласия" серьезно повредил авторитету организации в международном сообществе и, несомненно, успокоит Германию. По крайней мере, пока Франция должна в одиночку противостоять тирании Германии."
 ita.84.a: "Сейчас это была Австрия, но наши нации будут следующими."
 #
 ita.85.t: "Националистические настроения растут в Корсике"
 ita.85.d: "~Кто? ~"Partitu Corsu d'Azione\" has been a minor, almost forgettable, separatist force in Corsica for a few years now but recently a huge bump in party membership and Corsican nationalist sympathies in general are starting to cause concern for local French officials. Seemingly out of nowhere local Corsicans lead by nationalist Pietro Rocca have begun protesting French rule over the island. It will be some time before French authorities can crack down on this growing movement but in the mean time we must keep an eye on this situation."
 ita.85.a: "Что может быть за этим?"
 #
 ita.86.t: "Италия возбуждает националистические настроения в Корсике"
 ita.86.d: "~Кто? ~"Partitu Corsu d'Azione\" has been a minor, almost forgettable, separatist force in Corsica for a few years now but recently a huge bump in party membership and Corsican nationalist sympathies in general are starting to cause concern for local French officials. While this development initially appeared seemingly out of nowhere, a recently arrested Italian national with ties to Rome has confessed to being employed by Italy to spark and support this unrest. Despite the obviously fraudulent nature of the propaganda him and his fellow conspirators had been spreading local Corsicans lead by nationalist Pietro Rocca have begun protesting French rule over the island. It will be some time before French authorities can crack down on this growing movement but in the mean time we must keep an eye on the back stabbing Italians."
 ita.86.a: "Проклятье этих итальянцев!"
 #
 ita.87.t: "\"Partitu Corsu d'Azione\" leaders have been arrested"
 ita.87.d: "Растущее националистическое движение Корсика сегодня зашло в тупик, поскольку французские власти арестовали Пьетро Рокку и его сообщников за заговор против государства."
 ita.87.a: "Самое время положить конец этой глупой идее."
 ita.87.b: "Возможно, нам придется быть более прямыми в наших усилиях по захвату Корсики."
 #
 ita.89.t: "Корсиканские добровольцы присоединяются к Италии"
 ita.89.d: "Война между Францией и Италией убедила многих корсиканских националистов присоединиться к итальянскому делу в надежде освободить свою родину от французского правления, в настоящее время они ведут борьбу с французскими властями на острове, и представляется почти уверенным, что Италия воспользуется этим и оккупирует островный регион, если только французские силы не смогут быстро сломить этих мятежников."
 ita.89.a: "Корсика скоро освободится."
 ita.89.b: "Проклятье!"
 #
 ita.90.t: "Корсика объявляет независимость"
 ita.90.d: "Война между Францией и Италией вызвала народное движение в Корсике, требуя независимости региона. В настоящее время недавно сформированное корсиканское правительство борется с французскими властями и лояльными сторонниками на острове."
 ita.90.a: "Корсика скоро освободится."
 ita.90.b: "Проклятье!"
 #
 ita.91.t: "Судьба Корсики"
 ita.91.d: "Действия временного правительства Корсики сыграли ключевую роль в обеспечении безопасности островного региона от французских сил, но сейчас настало время поставить эту ключевую территорию Италии под прямое управление."
 ita.91.a: "Независимая Корсика выполнила свою задачу."
 ita.91.a: "Корсика заслужила независимость."
 #
 ita.92.t: "Италия претендует на нашу территорию"
 ita.92.d: "Сегодня в удивительно враждебном поступке правительство Рима официально заявило о своих притязаниях на несколько французских территорий и колоний, хотя эти притязания удерживались экстремальными националистическими элементами в Италии на протяжении десятилетий, они, наконец, были подкреплены официальной политикой правительства, пока не ясно, что его воля означает для наших двух стран, но мы можем предположить, что пока что Италия не намерена стремиться к сближению с нами."
 ita.92.a: "Мы должны следить за этой ситуацией."
 #
 ita.93.t: "Италия осуждает британское влияние в Средиземноморье"
 ita.93.d: "Британское влияние в Средиземном море является спорным вопросом между нами и Италией с момента основания страны в 1871 году. &lt; &lt; Доступ в Средиземное море &gt; &gt; , либо через Гибралтар, либо через Суэц, находится под нашим контролем, что ставит Италию в трудное положение. &gt; &gt; ."The British Monopoly/" over the Mediterranean. As a great power Rome says that Italians deserve uncontested access through /"Mare Nostrum/" and have hinted that they may seek territorial revisionism in the region if needed."
 ita.93.a: "Необоснованный враждебный поступок"
 #
 ita.94.t: "Куда послать наш флот?"
 ita.94.d: "Итальянский ВМС является одним из лучших в мире и в значительной степени совпадает с местными британскими силами, базирующимися в Средиземном море. Военно-морское шоу приведёт к большому престижу нашей нации, принуждая британцев к обороне. Британцы, хотя и разбросаны по Средиземному морю, и для того, чтобы в полной мере использовать нашу военно-морскую мощь, мы хотим сосредоточиться на ключевом стратегическом регионе. Нн-Гибралтар открывает Атлантику и является одним из наших крупнейших морских путей. Если мы хотим получить доступ к мировым океанам, мы хотим продемонстрировать наше доминирование над этим удушающим пунктом. Несмотря на то, что Мальта давно является националистическим притязанием Италии, мальтийская культура тесно связана с итальянской культурой. В дополнение к этому стратегическое расположение в центре Средиземноморья означает, что она представляет собой угрозу для многих наших морских путей и может быть использована в качестве базы для блокады нас из Ливии."
 ita.94.a: "Отправьте "Реджиа Марину" в Гибралтар"
 ita.94.b: "Отправь Марину Реджиа на Мальту"
 ita.94.c: "Отправьте "Реджиа Марину" на Кипр"
 #
 ita.95.t: "Недалеко от Гибралтара были замечены итальянские военные корабли"
 ita.95.d: "Недавно вблизи побережья Гибралтара была замечена большая итальянская армада, которая ясно дала понять местному британскому войску, но как только они прибыли, они отплыли обратно в Италию, как представляется, они пытались запугать местный гарнизон, а также Королевский флот в целом, хотя итальянский ВМС, возможно, очень давно устарел по сравнению с Королевским ВМС, мы не должны недооценивать эту угрозу."   
 ita.95.a: "Они не представляют угрозы для Королевского флота."
 ita.95.b: "Может, нам стоит подумать о создании местной обороны?"
 #
 ita.96.t: "Недалеко от Мальты были замечены итальянские военные корабли"
 ita.96.d: "Недавно у побережья Мальты была замечена большая итальянская армада, которая ясно дала понять местному британскому войску, но как только они прибыли, они отплыли обратно в Италию. Похоже, они пытались запугать местный гарнизон, а также Королевский ВМС в целом. Хотя итальянский ВМС, возможно, очень устарел по сравнению с Королевским ВМС, мы не должны недооценивать эту угрозу."
 ita.96.a: "Они не представляют угрозы для Королевского флота."
 ita.96.b: "Может, нам стоит подумать о создании местной обороны?"
 #
 ita.97.t: "Недалеко от Кипра были замечены итальянские военные корабли"
 ita.97.d: "Недавно у побережья Кипра была замечена большая итальянская армада, которая ясно дала понять местному британскому войску, но как только они прибыли, они отплыли обратно в Италию. Похоже, они пытались запугать местный гарнизон, а также Королевский флот в целом. Хотя Итальянский ВМС, возможно, очень устарел по сравнению с Королевским ВМС, мы не должны недооценивать эту угрозу."
 ita.97.a: "Они не представляют угрозы для Королевского флота."
 ita.97.b: "Может, нам стоит подумать о создании местной обороны?"
 #
 ita.99.t: "Италия предлагает купить Мальту"
 ita.99.d: "Со времени окончания Наполеоновских войн остров Мальта был британским владельцем. Стратегическое положение в центре Средиземноморья является ключевым фактором контроля Соединенного Королевства над регионом, что хорошо понятно итальянцам, предложившим купить остров. В прошлом это предложение было бы быстро проигнорировано, но с недавним экономическим спадом, возможно, в наших интересах рассмотреть его. В то время как в эпоху плавания Мальты в качестве военно-морской базы было разумное решение, изобретение таких самолетов, как военно-морские бомбардировщики, ставит любое судно, размещенное на острове, в уязвимое положение. Итальянцы и французы оба имеют большие воздушные баскиты в пределах Мальты. В Британии мало кто видит ценность в защите Мальты, когда может быть использована более широкая и более надежная база в Александрии. Если у нас есть хоть какой-то интерес к сближению с Энтезией, мы, возможно, захотим договориться о продаже Мальты вместе с ее давними военно-морскими базами."
 ita.99.a: "Мы примем предложение."
 ita.99.b: "Мальта слишком важна, чтобы сдаться."
 #
 ita.100.t: "Британия согласна продать Мальту"
 ita.100.d: "В удивительно разумной ответной реакции известного «Перфидного альбиона» Великобритания согласилась продать нам остров Мальта, хотя некоторые говорят, что мальтийцы — это уникальная этногруппа, большинство итальянцев с нетерпением ожидают аннексии этой территории, глупых местных диалектов и всего остального."
 ita.100.a: "Наконец, разумный ответ Великобритании"
 #
 ita.101.t: "Британия отказывается продавать Мальту"
 ita.101.d: "Несмотря на силу наших притязаний на остров Мальта, Великобритания отказалась продать нам этот регион."
 ita.101.a: "тирания Перфейского Альбиона не знает границ"
 #
 ita.102.t: "Италия требует гарантированного доступа в Средиземное море"
 ita.102.d: "На протяжении десятилетий морской доступ в Средиземное море находится под строгим контролем Великобритании, как Суэцкий канал, так и Гибралтар являются нашим достоянием, стратегический контроль над которым имеет жизненно важное значение для нашей Империи."guarantees\". In the event that The United Kingdom is no longer able to protect the security of it's empire, the Italians want our blessing to secure Gibraltar and Suez for the purpose of guarantying naval access to Mediterranean. In Britain the vague wording of the Italian document has some ministers concerned about it's hypothetical enforcement but advocates for it see this agreement with Italy as a solid first step towards rapprochement. The value that these waterways have for our empire can not go unstated. If we truly do seek rapprochement with Italy we may want to consider sending a counter offer, granting them some lesser Mediterranean bases."
 ita.102.a: "Если это стабилизирует наши отношения с Италией, мы должны согласиться"
 ita.102.b: "Мы никогда не можем принять такое возмутительное требование"
 ita.102.c: "Может, мы можем предложить им другие уступки?"
 #
 ita.103.t: "Великобритания согласна гарантировать свободный доступ через Средиземное море"
 ita.103.d: "Осознавая ценность Суэцкого канала и Гибралтара для значительной части потребностей Европы в судоходстве, Великобритания дала нам свое благословение на обеспечение безопасности этих регионов, если они больше не смогут защитить их сами."
 ita.103.a: "Разумный выбор."
 #
 ita.104.t: "Британия отказывается предоставить какие-либо гарантии"
 ita.104.d: "Несмотря на то, что Суэцкий канал и Гибралтар имеют большую часть морских потребностей Европы, Великобритания отказалась дать нам свое благословение на обеспечение безопасности этих регионов в случае, если они не смогут защитить их сами."
 ita.104.a: "Британия не должна давить на нас."
 #
 ita.105.t: "Британия делает встречное предложение"
 ita.105.d: "Для большинства в Риме было очевидно, что Лондон никогда не примет наше предложение, как есть. Гибралтар и Суэцкий канал слишком важны для выживания их империи. Но не ожидалось, что вместо этого они предложили нам немедленный контроль над несколькими базами в самом Средиземноморье. Хотя некоторые могут утверждать, что эта концессия не решает проблему, итальянский морской доступ в Средиземное море и из него, британское предложение значительно расширило бы наше влияние в важном регионе."
 ita.105.a: "Сделка удовлетворительно."
 ita.105.b: "Это предложение далеко не достаточно хорошее."
 #
 ita.106.t: "Италия принимает наш компромисс"
 ita.106.d: "Как представляется, отчаявшиеся итальянцы согласились на наше встречное предложение о предоставлении им военно-морских баз в Средиземноморье."
 ita.106.a: "Приятно иметь с ними дело."
 #
 ita.107.t: "Италия отказывается от нашего компромисса"
 ita.107.d: "Не удивительно, что Италия отказалась от нашего встречного предложения, которое предоставило бы им наши басы в Средиземном море. По сравнению с первоначальным итальянским предложением он был почти скромным в его содержании. В обозримом будущем англо-итальянские отношения останутся холодными, чтобы сказать меньше всего."
 ita.107.a: "Компромисс, кажется, незнакомый термин для итальянцев."
 #
 ita.108.t: "Британия упала, пришло время обезопасить Средиземное море."
 ita.108.d: "Мировой порядок, который существовал на протяжении веков, был сорван в мгновение ока."Pax Britannia\" has been shattered beyond repair leaving the future of Europe and possibly the entire world in doubt. With what's left of the British Empire clinging on to life it seems that it's time for us to enforce our agreement with the British and secure Gibraltar and the Suez Canal. The seemingly inevitable collapse of the British Empire will force the still standing powers of Europe to pick up the scraps and take her place as the protectors of Civilization."
 ita.108.a: "Настало время гарантировать стабильность в Средиземном море."
 #
 ita.109.t: "Италия стремится к созданию союза с нами."
 ita.109.d: "Срыв между Францией и Италией заставил обе стороны отчаяться в новых союзниках, чтобы противостоять растущему перевооружению Германии. В то время как еще одна военно-морская держава Италия пришла к нам в надежде на создание альянса. Италия была нашим союзником ранее во время Великой войны, где они храбро боролись против австро-венгерских сил, но после конфликта некогда объединившаяся связь разорвалась на части с Великобританией, выбравшей изоляцию из Франции и Италии для поддержания мира только на континенте. В то время как многие великие империи пытались сделать это в прошлом, эта задача, казалось бы, была слишком большой для франко-итальянского альянса. Рим теперь ищет союз с нами. Англо-итальянский союз был бы крупным тряском к балансу сил. Наши объединенные навигации легко одолеют Францию или Германию плюс расположение нашей двух наций в Европе могли бы заставить одну из этих держав вступить в две фронтальные войны, если бы это было необходимо. Хотя все это звучит хорошо на бумаге, если мы узнали что-то из Великой войны, что итальянские амбиции сильно весят их компетенцию. Многие в Великобритании опасаются, что союз с Италией будет только для того, что мы неизбежно спасем нас от военного краха."
 ita.109.a: "Союзник по борьбе с влиянием Франции и Германии на континенте был бы полезен."
 ita.109.b: "Италия будет скорее пассивом, чем активом"
 #
 ita.110.t: "Британия соглашается на союз"
 ita.110.d: "Осознавая наши военно-морские способности и стратегическое положение в Европе, британцы согласились на союз. Вместе наши две империи обладают самыми крупными совместными военно-морскими силами, которые когда-либо были в мире, а наши сухопутные армии совпадают лишь с отдельными странами."
 ita.110.a: "Вместе мы окружим как Францию, так и Германию"
 #
 ita.111.t: "Британия отказывается вступать с нами в союз."
 ita.111.d: "Несмотря на наши военно-морские способности и стратегическое положение в Европе, британцы отказались от союза, и мы должны действовать в ближайшее время, если хотим защитить себя от гнетущей агрессии Франции и Германии."
 ita.111.a: "Италия должна четко определить свою судьбу."
 #
 ita.112.t: "Италия осуждает нашу нацию"
 ita.112.d: "Напряженность между [Гетнам.ЗЕР] и Италией была высокой с момента окончания Великой войны. &lt; &lt; Пограничные споры &gt; &gt; между нашими двумя нациями были серьезным болезненным местом в сербо-итальянских отношениях. &lt; &lt; Когда государство словенцы, хорваты и сербы присоединились к Королевству Сербия и сформировали Панславское государство &gt; &gt; ."Yugoslavia\" Italy pressured the victorious Entente powers to prohibit this union, fearing that it's pan-ethnic values would weaken Italian claims in Croatia. In a compromise between the two sides Serbia was granted these former Austrian lands but could not form a de jure Pan-Slavic state. This decision though did little to appease either side as it did not do much to address conflicting land claims. Today though Rome has denounced [GetName.SER] as a authoritarian back water that cares little of it's ethnic minorities. While no territorial claims were pushed forward by Rome it's clear this action was intended to hurt the legitimacy of Belgrade and to provoke conflict. If Italy is dead set on creating more tension between our two states we may want to ask France for support."
 ita.112.a: "Италия — это жестокая нация."
 ita.112.b: "Может, нам стоит обратиться за поддержкой к Франции?"
 #
 ita.113.t: "Сербия просит оказать поддержку в борьбе с итальянской агрессией"
 ita.113.d: "Недавно Италия выступила с осуждением законности [GetName.SER], которая угрожает стабильности на всех Балканах и может привести к развязыванию конфликта. &lt; &lt; Очевидно, заинтересованные сербы &gt; &gt; пришли к нам с просьбой оказать военную поддержку в целях сдерживания любой дальнейшей агрессии со стороны Италии. &lt; &lt; Несмотря на то, что мы обязаны защищать суверенитет членов Совета &gt; &gt; , провоцируя боевые действия с соседом Италии, они могут причинить больше вреда, чем пользы."
 ita.113.a: "Итальянская агрессия не может оставаться незатронутой."
 ita.113.b: "У нас больше приоритетов, чем у этих двоих."
 #
 ita.114.t: "Франция посылает предметы снабжения"
 ita.114.d: "Услышав наши призывы, французы согласились послать нам поставки, кажется, Франция серьезно настроена на поддержание стабильности в Европе."
 ita.114.a: "Это научит итальянцев"
 #
 ita.115.t: "Франция отказывается от отправки поставок"
 ita.115.d: "Несмотря на наши отчаянные призывы, французы отказались послать нам поставки, кажется, что французы не всерьез настроены на поддержание стабильности в Европе."
 ita.115.a: "Проклятье!"
 #
 ita.116.t: "Какую организацию следует поддерживать?"
 ita.116.d: "С падением Австро-Венгерской империи многие этнические меньшинства на Балканах были вынуждены создать союз с Сербией и жить под большим влиянием Белграда. В то время как мир может игнорировать их призывы к независимости, ясно, что пришло время поддержать эти сепаратистские движения. Хорватский Усташе, возглавляемый Анте Павеличем, стремится к независимости Хорватии и Боснии любыми необходимыми средствами. Они совершили несколько террористических нападений на протяжении всего [Гетнаме.Сер] и высокоорганизованы, но не имеют достаточного снабжения и надлежащей подготовки. Хотя они кажутся хорошим выбором, чтобы тайно помочь нам подорвать стабильность [Гет Наме.Сер.] Усташе претендует на нашу территорию на Адриатике в прошлом. Последнее, чего мы хотели бы, это организованная террористическая группа внутри Италии."Internal Macedonian Revolutionary Organization\" or IMRO. This organization has existed since 1893 and has over the course of it's life supported both the independence of Macedonia and union with Bulgaria. In the past they have killed several high ranking politicians in Bulgaria and Yugoslavia but do to their decentralized nature have neen very quiet for the last few years. Unlike the Ustashe, we have no border disputes with the IMRO and could fairly easily train their agents for future terrorist action."
 ita.116.a: "Поддержка хорватского усташа"
 ita.116.b: "Поддержка македонского ИМРО"
 ita.116.c: "Поддержка и то, и другое"
 #
 ita.117.t: "Террористические группы на подъеме"
 ita.117.d: "Несколько сепаратистских групп активно действовали на протяжении всей истории, но до недавнего времени они были весьма незначительными силами, что, судя по всему, произошло из ниоткуда, несмотря на то, что по всей стране было совершено несколько нападений, которые были шокированы полицией, точная информация о том, кто стоит за ними, в настоящее время неизвестна, но местные власти уже начали расследование."
 ita.117.a: "Мы должны сломать их."
 #
 ita.118.t: "Италия поймала тех, кто поддерживал местных террористов"
 ita.118.d: "Быстрый рост террористической деятельности в нашей стране, безусловно, не был естественным, но до недавнего времени не было очевидной причины."
 ita.118.a: "Италия заплатит за это."
 #
 ita.119.t: "Сербия уничтожает террористические группы"
 ita.119.d: "В ходе нескольких антитеррористических полицейских операций [GetName.SER] удалось сломать национальные террористические группы, и все, что осталось от этих групп, находится в разрозненных и неорганизованных местах и не может причинить реального ущерба государству."
 ita.119.a: "Наконец-то наша нация вернется к нормальной жизни."
 ita.119.b: "Надо было раньше нанести удар."
 #
 ita.120.t: "Хорватские националисты присоединяются к нашему крестовому походу"
 ita.120.d: "Усташе, возглавляемый Анте Павеличем, воспользовался нашей войной против [Гетнама.SER] и устроил в Хорватии открытое восстание."
 ita.120.a: "Вместе мы покончим с тиранией Сербии."
 #
 ita.121.t: "Македонские националисты присоединяются к нашему крестовому походу"
 ita.121.d: "Внутренняя македонская революционная организация воспользовалась нашей войной против [Гетнам.ЗЕР] и устроила в Македонии открытое восстание."
 ita.121.a: "Вместе мы покончим с тиранией Сербии."
 #
 ita.122.t: "Хорватские националисты дезертируют в Италию"
 ita.122.d: "Усташе, возглавляемый Анте Павеличем, воспользовался жестокой победой Италии против нашего народа и устроил открытое восстание в Хорватии, что заставит некоторые подразделения с итальянского фронта подавить это восстание."
 ita.122.a: "Смерть всем предателям!"
 #
 ita.123.t: "Македонские националисты дезертируют в Италию"
 ita.123.d: "Внутренняя македонская революционная организация воспользовалась жестоким завоеванием Италии против нашей нации и устроила открытое восстание в Македонии, что заставит некоторые подразделения с итальянского фронта подавить это восстание."
 ita.123.a: "Смерть всем предателям!"
 #
 ita.124.t: "Италия просит союз с нами."
 ita.124.d: "Договор Нойлли-сюр-Сейн был разрушительным для Болгарии, которая потеряла почти всю землю, которую они получили в ходе предыдущих балканских войн, своим соседям. Италия, которая также стала недовольна результатами Великой войны, пришла к нам, чтобы обсудить возможность альянса. Ясно, что мы разделяем многие из тех же амбиций против Сербии и Греции. Если Италии суждено вступить в войну с этими двумя странами, мы были бы глупы, чтобы не участвовать в этих мирных конференциях. Наша нация изолирована от Италии. Если какой-либо конфликт с нашими соседями не будет урегулирован быстро, то, возможно, невозможно получить прямую военную поддержку из Рима. Мы должны принять мудрое решение, поскольку последствия этого союза будут огромными для нашего маленького государства."
 ita.124.a: "Старый балканский порядок должен быть отменен."
 ita.124.b: "Мы не должны подчиняться Риму."
 #
 ita.125.t: "Болгария присоединяется к Пакту"
 ita.125.d: "Видя наши общие амбиции в отношении сербов и греков, Болгария согласилась заключить с нами союз, вместе с тем мерзость Версальского договора будет исправлена."
 ita.125.a: "Тост за наших новых болгарских друзей"
 #
 ita.126.t: "Болгария отвергает наше предложение о создании альянса"
 ita.126.d: "Несмотря на наши общие амбиции в отношении сербов и греков, Болгария отказалась от создания альянса с нами, предпочитая занять нейтральную внешнеполитическую позицию."
 ita.126.a: "Если они не хотят быть частью нашего Нового Ордена, это их ошибка."
 #
 ita.127.t: "Италия стремится пересмотреть Балканские договоры"
 ita.127.d: "Сегодня Рим объявил о своих намерениях пересмотреть Версальский договор и ряд других договоров, которые, по их утверждению, имеют..."absolutely devastated\" the Balkan Peninsula. While no specific goals or plans were made by Italy it's clear that this announcement was targeted at nations like Serbia and Romania who both gained the most territory from their neighbors following the Great War. In any case this action from Italy only serves to destabilize the region and provoke conflict."
 ita.127.a: "Как они смеют угрожать нам вот так?"
 ita.127.b: "Очень интересно."
 #
 ita.128.t: "Италия просит союз с нами."
 ita.128.d: "Трианонский договор был абсолютно разрушительным для Венгрии, которая потеряла 70% земли, состоящей из бывшего Венгерского королевства тысячелетия. Италия, которая также стала недовольна результатами Великой войны, пришла к нам для того, чтобы обсудить возможность создания союза. Ясно, что мы разделяем многие из тех же амбиций в отношении Сербии и Румынии. Если Италии суждено вступить в войну с этими двумя странами, мы были бы глупы, если бы не были включены в эти мирные конференции. Наша нация изолирована от Италии. Если конфликт с нашими соседями не будет урегулирован быстро, то, возможно, невозможно получить прямую военную поддержку из Рима. Мы должны принять мудрое решение, поскольку последствия этого союза будут огромными для нашего крошечного государства."
 ita.128.a: "Старый балканский порядок должен быть отменен."
 ita.128.b: "Мы не должны подчиняться Риму."
 #
 ita.129.t: "Венгрия присоединяется к Пакту"
 ita.129.d: "Принимая во внимание наши общие амбиции в отношении сербов и румын, Венгрия согласилась заключить с нами союз, вместе с тем мерзость, которую представляет собой Версальский договор, будет исправлена."
 ita.129.a: "Тост за наших новых венгерских друзей"
 #
 ita.130.t: "Венгрия отвергает наше предложение о создании альянса."
 ita.130.d: "Несмотря на наши общие амбиции в отношении сербов и румын, Венгрия отказалась от создания союза с нами, предпочитая занять нейтральную внешнеполитическую позицию."
 ita.130.a: "Если они не хотят быть частью нашего Нового Ордена, это их ошибка."
 #
 ita.131.t: "[ITA. GetFaction Name] ультиматум"
 ita.131.d: "[ITA.GetFactionName] выдвинул несколько требований к нашей стране, включая передачу спорных территорий Болгарии и предоставление Италии 10-летней аренды на наши нефтяные месторождения. [ITA.Get Header] ясно дал понять, что Италия и [ITA.GetFactionName]\"Shall respond with swift and decisive action\" if the ultimatum is not agreed to in a timely manner. It's obvious that their demands are not made in good faith and are only meant as a pretext to dismantle our nation. While our military mobilizes to counter the possibility of an invasion some officers doubt our nation's ability to withstand an offensive from Bulgaria."
 ita.131.a: "Мы не в том положении, чтобы сопротивляться"
 ita.131.b: "Если они хотят нашу землю, они должны сражаться за нее."
 ita.131.c: "Конечно, французы поддержат нас."
 #
 ita.132.t: "[ITA. GetFaction Name] ультиматум"
 ita.132.d: "[ITA.GetFactionName] выдвинул несколько требований к нашей стране, включая передачу спорных территорий Венгрии и предоставление Италии 10-летней аренды на наши нефтяные месторождения. [ITA.Get Header] ясно дал понять, что Италия и [ITA.GetFactionName]\"Shall respond with swift and decisive action\" if the ultimatum is not agreed to in a timely manner. It's obvious that their demands are not made in good faith and are only meant as a pretext to dismantle our nation. While our military mobilizes to counter the possibility of an invasion some officers doubt our nation's ability to withstand an offensive from Hungary."
 ita.132.a: "Мы не в том положении, чтобы сопротивляться"
 ita.132.b: "Если они хотят нашу землю, они должны сражаться за нее."
 #
 ita.133.t: "[ITA. GetFaction Name] ультиматум"
 ita.133.d: "[ITA.GetFactionName] выдвинул несколько требований к нашей стране, включая передачу оспариваемых территорий как Венгрии, так и Болгарии и предоставление Италии 10-летней аренды наших нефтяных месторождений. [ITA.Get Header] ясно дал понять, что Италия и [ITA.GetFactionName]\"Shall respond with swift and decisive action\" if the ultimatum is not agreed to in a timely manner. It's obvious that their demands are not made in good faith and are only meant as a pretext to dismantle our nation. While our military mobilizes to counter the possibility of an invasion some officers doubt our nation's ability to withstand a two front offensive from both Hungary and Bulgaria."
 ita.133.a: "Мы не в том положении, чтобы сопротивляться"
 ita.133.b: "Если они хотят нашу землю, они должны сражаться за нее."
 #
 ita.134.t: "Румыния отвергает наши требования"
 ita.134.d: "Несмотря на нашу подавляющую мощь, Румыния решила проигнорировать наш ультиматум, ясно, что этот спор должен быть урегулирован на поле боя."
 ita.134.a: "Румынцы заплатят за это кровью."
 #
 ita.135.t: "Румыния просит оказать поддержку [ITA.GetFactionName]"
 ita.135.d: "После окончания Великой войны Румыния получила огромное количество земли от своих соседей, что до сих пор вызывает международную напряженность. Италия, как представляется, предприняла инициативу по обращению вспять этих территориальных аннексий, требуя, чтобы Румыния вернула эту землю или столкнулась с возможным вторжением. Как одна из крупнейших стран Балкан, демонтаж Румынии может необратимо дестабилизировать полуостров и предоставить Италии и ее союзникам гарантированный доступ к огромным нефтяным запасам Румынии, что может изменить европейский баланс власти."
 ita.135.a: "Мы не должны допустить, чтобы Италия могла таким образом передвигаться над Европой."
 ita.135.b: "Мы не в состоянии предложить поддержку"
 #
 ita.136.t: "Франция предлагает свою поддержку"
 ita.136.d: "Услышав наши отчаянные призывы, Франция согласилась официально гарантировать наш национальный суверенитет против итальянской агрессии."
 ita.136.a: "Наконец-то хорошие новости"
 #
 ita.137.t: "Франция требует, чтобы мы отказались"
 ita.137.d: "Несмотря на наши усилия изолировать и окружить их, Румыния каким-то образом получила поддержку французов, которые сейчас требуют от нас прекращения всех агрессивных действий в отношении румын. Поскольку наши союзники и международное сообщество в целом смотрят на нас в этот определяющий час, мало кто в Риме может подумать о простом отступлении, но реальность ситуации не может быть проигнорирована. Большинство командиров Италии не считают, что наша нация готова к еще одной крупной войне, но если бы мы быстро обезопасили румынские нефтяные месторождения, Италия оказалась бы в гораздо лучшем положении для ведения боевых действий."
 ita.137.a: "Судьба Италии не может быть остановлена"
 ita.137.b: "Мы не в том положении, чтобы вести крупную войну."
 #
 ita.138.t: "Италия согласна отказаться от участия"
 ita.138.d: "После чрезвычайной встречи французских и итальянских дипломатов Рим склонился к французскому давлению и согласился отказаться от дальнейших военных действий в отношении Румынии. Несмотря на явный тупик, обе стороны заявляют о победе."Italy has now truly become a Great Power able to apply decisive pressure to the nations of Europe as she wishes\" while in France this is seen as another example of the Entente Council's ability to reach peaceful conclusions to European disputes."
 ita.138.a: "Иногда ручка сильнее меча."
 #
 ita.139.t: "Франция отказывается от прямого вмешательства"
 ita.139.d: "Несмотря на то, что французы являются самозваным защитником европейской стабильности, они отказываются принимать сторону против вопиющей агрессии Италии."
 ita.139.a: "Проклятье этих предателей"
 #
 ita.140.t: "На Румынию напали!"
 ita.140.d: "Несмотря на наши попытки оказать давление на итальянцев, Рим, похоже, продолжает идти по пути самоубийства и вторгается в Румынию. В соответствии с нашим соглашением с румынскими государствами, мы теперь обязаны оказывать им полную военную поддержку против итальянской агрессии. В течение почти двух десятилетий великие державы вновь находятся на грани войны. Решение, которое мы сейчас принимаем, будет иметь серьезные последствия на предстоящие десятилетия."
 ita.140.a: "Мы поддержим их дело."
 ita.140.b: "Мы не в состоянии вмешаться."
 #
 ita.141.t: "Франция отказывается защищать нас."
 ita.141.d: "Несмотря на соглашение, которое они подписали с нами, заявив о своей прямой поддержке в случае вторжения итальянского лидера, Франция отказалась выполнить свои обязательства."
 ita.141.a: "Черт побери!"
 #
 ita.143.t: "Насилие в Усташе в Заре"
 ita.143.d: "Члены этой группы, которые стремятся интегрировать Зару в независимую Хорватию, пересекли итальянскую границу и используют обучение, которое мы им дали, чтобы терроризировать регион."
 ita.143.a: "Кто мог такое предвидеть?"
 #
 ita.144.t: "Наши отношения с Грецией?"
 ita.144.d: "Как соотечественники южноевропейских государств с сильной морской традицией как Греция, так и Италия разделяют многие из одних и тех же стратегических и политических целей. Греция была нашим союзником во время Великой войны и помогала нам в подавлении восстания турецкого национального движения, которое чуть не вынудило нас покинуть Анатолию. С тех пор, хотя наши две расширяющиеся страны вступили в конфликт, спорные территории в Албании и Анатолии начали кидать отношения между двумя странами, и для исправления этого мало что сделано, хотя мы могли бы добиваться более открытых боевых действий с греками, которые могут побудить турок вторгаться в Панфилию, вместо этого в наших наилучших интересах сформировать единый фронт с греками, чтобы подавить турецкий экспансионизм."
 ita.144.a: "Отрекайся от них и их маленький раздутый \"Empire\"."
 ita.144.b: "Восхвалим их великую нацию и предоставим им самолёты."
 #
 ita.145.t: "Италия осуждает нашу нацию"
 ita.145.d: "Сегодня Рим официально осудил нашу великую нацию. С момента окончания территориальных споров между нами и Италией Великой Войны наши отношения пошатнулись. Пока мы пытались улучшить эту ситуацию, у итальянцев не было желания к сближению."barbaric/" treatment of our Turkish minority and our \"baseless\" claims to southern Albania. These claims are of course entirely false but in any case our relations with Italy will remain poor for the foreseeable future."
 ita.145.a: "Проклятье!"
 #
 ita.146.t: "Италия предлагает нам самолеты"
 ita.146.d: "С тех пор, как прекратились территориальные споры между нами и Италией в Великой войне, наши отношения пошатнулись, но сегодня, похоже, Италия желает сближения и предложила нам 25 своих собственных истребителей в знак греко-итальянской дружбы. По мере роста напряженности в Европе, приятно видеть, как некоторые страны откладывают свои разногласия ради мира."
 ita.146.a: "Как мило с их стороны"
 #
 ita.147.t: "Столкновения греко-итальянских сил на албанской границе"
 ita.147.d: "На греко-албанской границе вооруженные силы Италии и Греции начали столкновение, пока не ясно, какая сторона произвела первый выстрел, но теперь оба местных гарнизона используют все местные запасы для защиты своей границы."
 ita.147.a: "К оружию!"
 #
 ita.148.t: "Италия выпускает ультиматум"
 ita.148.d: "Хотя не совсем ясно, кто стрелял первым, Италия возложила вину за недавнее столкновение на Грецию, утверждая, что Афины приказали атаковать, пытаясь спровоцировать войну между нашими нациями. Рим послал нам ультиматум, требующий ну.) Демилитаризация Греко-албанской границы ~n2.) Сдача Крита и Эгейских островов итальянской оккупации ~n3. Свободный доступ к нашей стране для итальянских военных ~n ~n ~Но ясно, что эти требования являются лишь предлогом для того, чтобы позволить Италии вторгнуться в нашу страну и оккупировать ее. В то время как наша нация может быть не такой большой, как Итальянцы-Греки будут бороться за нее до смерти. Как мы ответим?"
 ita.148.a: "\"Ohi!\""
 ita.148.b: "Мы должны избегать войны."
 ita.148.c: "Запросить поддержку у Франции"
 #
 ita.149.t: "Греция проигнорировала наш ультиматум"
 ita.149.d: "Несмотря на наши усилия по ослаблению напряженности после пограничного налета на южную Албанию, греки не намерены следовать нашему ультиматуму."
 ita.149.a: "Мы пойдем в Афины."
 #
 ita.150.t: "Греция приняла наш ультиматум"
 ita.150.d: "Удивительно, что наши усилия по ослаблению напряженности после налета на границу в южной части Албании оказались успешными, и Греция согласилась уступить нам несколько баз в Эгейском море и демилитаризировать их сторону албанской границы."
 ita.150.a: "Иногда ручка сильнее меча."
 #
 ita.151.t: "Греция просит оказать поддержку Италии"
 ita.151.d: "Греция недавно оказалась под прикрытием Италии и просила нас оказать ей поддержку в обеспечении ее суверенитета. после окончания Великой войны Греция получила огромное количество земли от своих соседей, что до сих пор вызывает международную напряженность. И Италия, и Греция спорили об общих границах друг друга в прошлом, которые, как представляется, привели к столкновению на границе между армиями друг друга в южной части Албании. Греки утверждают, что это было начато итальянцами в качестве предлога для начала войны и порабощения своей нации, утверждения, что итальянцы спорят."
 ita.151.a: "Мы не должны допустить, чтобы Италия могла таким образом передвигаться над Европой."
 ita.151.b: "Мы не в состоянии предложить поддержку"
 ita.151.c: "Может быть, мы сможем достичь компромисса"
 #
 ita.152.t: "Франция предлагает свою поддержку"
 ita.152.d: "Услышав наши отчаянные призывы, Франция согласилась официально гарантировать наш национальный суверенитет против итальянской агрессии."
 ita.152.a: "Хорошо."
 #
 ita.153.t: "Франция требует, чтобы мы отказались"
 ita.153.d: "Несмотря на наши усилия изолировать и окружить их, Греция каким-то образом получила поддержку французов, которые сейчас требуют от нас прекратить все агрессивные действия в отношении греков."
 ita.153.a: "Судьба Италии не может быть остановлена"
 ita.153.b: "Мы не в том положении, чтобы вести крупную войну."
 #
 ita.154.t: "Италия согласна отказаться от участия"
 ita.154.d: "После чрезвычайной встречи французских и итальянских дипломатов Рим склонился к французскому давлению и согласился отступить и избежать дальнейших военных действий в отношении Греции."Italy has now truly become a Great Power able to apply decisive pressure the nations of Europe as she wishes\" while in France this is seen as another example of the Entente Council's ability to reach peaceful conclusions to European disputes."
 ita.154.a: "Иногда ручка сильнее меча."
 #
 ita.155.t: "Франция отказывается от прямого участия"
 ita.155.d: "Несмотря на то, что французы являются самозваным защитником европейской стабильности, они отказываются принимать сторону против вопиющей агрессии Италии."
 ita.155.a: "Проклятье этих предателей"
 #
 ita.156.t: "На Грецию напали!"
 ita.156.d: "Несмотря на наши попытки оказать давление на итальянцев, Рим, похоже, продолжает идти по пути самоубийства и вторгается в Грецию. В соответствии с нашим соглашением с государствами-греками, мы теперь обязаны оказывать им полную военную поддержку против итальянской агрессии. В течение почти двух десятилетий великие державы вновь находятся на грани войны. Решение, которое мы сейчас принимаем, будет иметь серьезные последствия на предстоящие десятилетия."
 ita.156.a: "Мы поддержим их дело."
 ita.156.b: "Мы не в состоянии вмешаться."
 #
 ita.157.t: "Франция отказывается защищать нас."
 ita.157.d: "Несмотря на соглашение, которое они подписали с нами, заявив о своей прямой поддержке в случае вторжения итальянского лидера, Франция отказалась выполнить свои обязательства."
 ita.157.a: "Черт побери!"
 #
 ita.160.t: "Италия предлагает нам союз."
 ita.160.d: "Несмотря на то, что на протяжении последних нескольких десятилетий отношения между Италией и Грецией были неудовлетворительными, Италия, как представляется, хотела бы посеять в прошлом какую-либо вражду и предложить нам союз, хотя некоторые министры готовы принять это предложение, поскольку оно обеспечило бы нам защиту от враждебных турок и сербов, которые выступают против любого альянса, до тех пор, пока наши территориальные споры не будут урегулированы, это может стать хорошей возможностью для окончательного прекращения этих споров."
 ita.160.a: "Мы должны согласиться"
 ita.160.b: "Никогда"
 ita.160.c: "Только в том случае, если они согласятся урегулировать территориальные споры"
 #
 ita.161.t: "Греция соглашается на союз"
 ita.161.d: "Как ближайшая военно-морская держава в Средиземном море, очевидно, что мы разделяем многие из одних и тех же международных целей, и как таковые греки согласились на союз."
 ita.161.a: "Тост за наших греческих друзей"
 #
 ita.162.t: "Греция отказывается от нашего предложения альянса."
 ita.162.d: "Несмотря на то, что греки являются частью средиземноморской военно-морской державы со многими из тех же международных целей, они отказались от нашего предложения о создании альянса."
 ita.162.a: "Чёрт."
 #
 ita.163.t: "Греция просит вернуть основную территорию для создания альянса"
 ita.163.d: "Крупным препятствием в отношениях между Греко-Итальянскими странами являются наши противоречивые территориальные притязания: полный хаос Великой войны ведет к тому, что обе стороны оккупируют земли, которые исторически были частью друг друга. Афины информировали нас о том, что они будут заинтересованы в союзе с нами только в том случае, если мы согласимся вернуть основную греческую территорию под их единственный контроль."
 ita.163.a: "Мы можем принять эти условия."
 ita.163.b: "Греки - пустая трата времени."
 #
 ita.164.t: "Италия согласна вернуть нашу территорию"
 ita.164.d: "Похоже, итальянцы действительно заинтересованы в том, чтобы похоронить топор между нашими двумя нациями."
 ita.164.a: "Отлично с ними справляется."
 #
 ita.165.t: "Италия отказывается вернуть нашу территорию"
 ita.165.d: "Итальянское предложение о союзе с нами не было сделано в духе доброй воли. Как только мы ищем компромисс с Римом, они отказываются даже рассматривать его. Несмотря на то, что Италия может сказать, очевидно, что они не считают нашу нацию равной."
 ita.165.a: "Проклятье!"
 #
 ita.166.t: "Италия доставляет ультиматум"
 ita.166.d: "Недавняя ремилитаризация нашей страны не осталась незамеченной Великими державами Европы. Италия, которая расширяет свое влияние на Балканы, послала нам ультиматум, требующий ну."
 ita.166.a: "Не обращайте внимания на итальянский \"Threat\""
 ita.166.b: "Мы не готовы спровоцировать войну."
 #
 ita.167.t: "Турция проигнорировала наш ультиматум"
 ita.167.d: "Несмотря на то, что мы окружаем их незначительное положение, турки отказываются прекратить свои усилия по ремилитаризации, если мы хотим сохранить наши запасы в Анатолии, мы должны сделать это силой."
 ita.167.a: "Мы не можем оставить это в силе."
 #
 ita.168.t: "Турция согласилась с нашими требованиями"
 ita.168.d: "Для большинства было очевидно, что турки не осмеливаются противостоять нашим требованиям, мы окружаем их маленький народ и можем легко уничтожить его при необходимости, но иногда перо сильнее меча. Турки согласились на наш ультиматум без необходимости кровопролития."
 ita.168.a: "Мудрое решение"
 #
 ita.170.t: "Италия провозглашает аннексию Албании"
 ita.170.d: "С момента окончания Великой войны Албания фактически стала марионеткой Италии. Итальянские должностные лица в стране проводят политику итальянизации, навязывая итальянский язык и культуру нашим гражданам, одновременно подавляя местные усилия по развитию албанской национальной самобытности. Сегодня это стало логичным завершением, поскольку Рим объявил об аннексии нашей страны в качестве нового региона Италии. В то время как некоторые внутри страны с нетерпением ожидают выгод от того, чтобы стать полноправными итальянскими гражданами, большинство албанцев возмущены тем, что наша нация вновь порабощается нашими большими соседями. Албанцы мужественно боролись за нашу независимость от отоманцев, сербов и австрийцев. Чтобы вновь стать еще одной нотой в книгах истории, это было бы оскорблением их жертв."
 ita.170.a: "Мы не в том положении, чтобы выступать против"
 ita.170.b: "Албанцы никогда этого не заслужили!"
 #
 ita.171.t: "Албания отвергает аннексию"
 ita.171.d: "Итальянское влияние в Албании никогда не было популярным среди местного населения. &quot; Выбор аннексии региона &quot; воспринимался многими, кто подозревал, что албанцы откажутся от такого смелого указа. &quot; Албанское правительство &quot; , возможно под влиянием растущего антиитальянского движения, отвергло аннексию. &quot; Если мы хотим интегрировать этот регион в Италию &quot; , нам придется сделать это силой."
 ita.171.a: "Албанцы скоро поймут величие Италии."
 #
 ita.172.t: "Италия стремится к установлению связей с местными социалистическими группами"
 ita.172.d: "Недавняя революция в Италии, по всей видимости, придала импульс правительству в Риме, которое сейчас стремится установить связи с социалистическими движениями в нашей стране."
 ita.172.a: "Мы должны следить за этим."
 #
 ita.173.t: "Италия стремится к улучшению отношений"
 ita.173.d: "Недавняя революция в Италии привела к власти в Риме социалистическое правительство."
 ita.173.a: "Выпьем за наших итальянских товарищей"
 ita.173.b: "Мы бы предпочли не связываться с Римом."
 #
 ita.174.t: "Италия предлагает нам союз."
 ita.174.d: "Похоже, что Революция распространилась по Средиземному морю. Италия недавно перешла под контроль социалистического правительства, подобного нашему, и поэтому наши две страны разделяют многие из одних и тех же стратегических и политических целей. Итальянцы предложили нам союз. По мере того, как реакционные силы Германии и Франции растут у власти, это может быть в наших интересах обеспечить нашего союзника."
 ita.174.a: "Приветствие нашим итальянским товарищам"
 ita.174.b: "Мы не можем зависеть от Италии."
 #
 ita.175.t: "Согласен с альянсом."
 ita.175.d: "Осознавая, что обе наши страны разделяют многие из одних и тех же стратегических и политических целей, [от Гетнама] согласились создать союз с нами, и вместе мы защитим наш народ от реакционных сил Европы."
 ita.175.a: "Привет нашим испанским товарищам"
 #
 ita.176.t: "Отказывает в альянсе."
 ita.176.d: "Несмотря на то, что обе наши страны разделяют многие из одних и тех же стратегических и политических целей, [от имени Гетнама] отказались заключить с нами союз, и они наивно верят, что нейтралитет обеспечит безопасность своей нации."
 ita.176.a: "Пусть реакционные силы мира разрушат свою Революцию"
 #
 ita.177.t: "Италия просит принять ее в [SOV.GetFactionName]"
 ita.177.d: "На протяжении десятилетий Италия была домом многих революционных движений. Когда Великая война закончилась для Италии, казалось, что раненое государство, несомненно, последует за ступенями России и станет следующей страной, которая будет втянута в народное социалистическое восстание, но политическая борьба между социалистическими группировками этой страны убила любой шанс на это или столько мыслей. Недавние выборы в Италии дали [ITA.getRulningParty] достаточно законодательного влияния, чтобы поддержать народное социалистическое движение, которое помогло сегрегировать левый контроль над страной. Это касается реакционных соседей Италии, которые будут искать какое-либо оправдание для отмены освобождения рабочего класса, так как такая Италия ищет могущественных союзников, подобных нам, для защиты своей революции. СССР был изолирован от Западной Европы с момента ее создания и упустил интеллектуальный и валютный капитал, который запад практически обладает монополией. Союз с Италией предоставил бы нам доступ к своим научным и морским экспертам, помогая при этом узаконить оба наших революционных правительства. Оппоненты итальянскому альянсу, хотя и беспокоятся о том, что наши две страны слишком изолированы от одной страны, чтобы эффективно сотрудничать как союзники каким-то образом."
 ita.177.a: "Мы примем наших итальянских товарищей."
 ita.177.b: "У нас есть внутренние проблемы, которые мы должны решить в первую очередь."
 #
 ita.178.t: "принимает нас в [SOV.GetFactionName]"
 ita.178.d: "Осознавая, что обе наши страны разделяют многие из одних и тех же стратегических и политических целей, [С.Гетнам] согласился создать союз с нами. Италия теперь делает вторую Великую державу частью [СОВ.Гетфакшн Найм], вместе мы защитим наш народ от реакционных сил Европы."
 ita.178.a: "Приветствую наших советских товарищей."
 #
 ita.179.t: "Отказывает во въезде в [SOV.GetFactionName]"
 ita.179.d: "Несмотря на тот факт, что обе наши страны разделяют многие из одних и тех же стратегических и политических целей, они отказываются вступать с нами в союз, утверждая, что внутренние конфликты слишком ужасны, чтобы тратить ресурсы за рубежом."
 ita.179.a: "Пусть реакционные силы мира разрушат свою Революцию"
 #
 ita.180.t: "Италия предлагает нам союз."
 ita.180.d: "Похоже, что это смелое руководство распространилось по Средиземному морю. Италия недавно перешла под контроль правительства [ITA.getRulingIdeology] так же, как и наша, и поэтому наши две страны разделяют многие из одних и тех же стратегических и политических целей. Итальянцы предложили нам союз. Как враги южноевропейских стран, Германии и Франции, они могут расти в наших интересах обеспечить себе союзника."
 ita.180.a: "Приветствие нашим итальянским союзникам"
 ita.180.b: "Мы не можем зависеть от Италии."
 #
 ita.181.t: "Согласен с альянсом."
 ita.181.d: "Осознавая, что обе наши страны разделяют многие из одних и тех же стратегических и политических целей, [от Гетнама] согласились создать союз с нами, и вместе мы принесем величие и власть народам Средиземноморья."
 ita.181.a: "Привет нашим испанским союзникам"
 #
 ita.182.t: "Отказывает в альянсе."
 ita.182.d: "Несмотря на то, что обе наши страны разделяют многие из одних и тех же стратегических и политических целей, [от имени Гетнама] отказались заключить с нами союз, и они наивно верят, что нейтралитет обеспечит безопасность своей нации."
 ita.182.a: "Пусть великие державы мира потопят свою бесполезную нацию"
 #
 ita.183.t: "[От GetName] требует контроля над [177.GetName]"
 ita.183.d: "Италия, как военно-морская держава, требует определенных стратегических баз для того, чтобы в полной мере использовать свое морское влияние. С уничтожением испанского флота после нашей гражданской войны британцы теперь являются бесспорной державой в Западном Средиземноморье и их база в Гибралтаре остается в безопасности. Итальянцы хотят противодействовать этому, но у них нет базы в пределах досягаемости для нападения на Гибралтар, если это необходимо, и поэтому они требуют контроля над [177.Гетнамом] в качестве площадки для сбора своих военно-морских и военно-воздушных сил. Если мы хотим когда-либо получить необходимую поддержку для возвращения Гибралтара, нам, возможно, придется принять требование Италии."
 ita.183.a: "Мы можем позволить это пока."
 ita.183.b: "Мы не соблюдаем все требования Италии."
 #
 ita.184.t: "[От имени "Гетнам"] соглашается передать [177. Назвать]"
 ita.184.d: "С учетом стратегической ценности Итальянского военно-морского флота [от GetName] согласился передать контроль над [177.GetName] нашей стране."
 ita.184.a: "Мудрый выбор"
 #
 ita.185.t: "Отказывается передать [177. Найти]"
 ita.185.d: "Несмотря на тот факт, что оба наших государства стремятся выдворить иностранное влияние Великобритании из Средиземноморья, [из Гетнама] отказался передать контроль над [177.Гетнамом], теперь мы будем вынуждены бороться с нашими врагами с баз, расположенных далеко от самой Италии."
 ita.185.a: "Проклятье!"
 #
 ita.186.t: "Кому мы предложим арендовать [768.GetName]?"
 ita.186.d: "Италия занимает весьма завидную стратегическую позицию в Центральном Средиземноморье. С итальянских баз наш флот может нанести удар почти в любом районе Средиземноморья, о чем хорошо знают многие наши соседи. Чтобы помочь в мобилизации средств для государства, некоторые либеральные итальянские министры предложили, чтобы мы могли сдать в аренду некоторые из наших военно-морских баз иностранную державу. [768.Гетнам] является хорошим кандидатом на это, поскольку он находится в непосредственной близости от Западного Средиземноморья, плотного судоходного региона. Хотя аренда этого порта помогла бы генерировать столь необходимые средства, он еще не решен, кому мы предложим эту аренду. Многие великие державы, несомненно, были бы более чем счастливы принять наше предложение."
 ita.186.a: "Давайте предложим аренду [ЭнГ."
 ita.186.b: "Давайте предложим аренду [SOV.GetName]"
 ita.186.c: "Давайте предложим аренду [ГЕР. Найти]"
 ita.186.e: "Давайте предложим аренду [США. Найти имя]"
 ita.186.f: "Возможно, нам стоит пересмотреть этот план."
 #
 ita.187.t: "Италия предлагает нам сдать в аренду [768. GetName]"
 ita.187.d: "Италия, казалось бы, отчаянно нуждалась в средствах, предложила нам арендовать [768.GetName]. Хотя стратегическое местоположение в Западном Средиземноморье делает его ценной базой, многие в нашей стране подозревают в работе с итальянцами и сомневаются, что стоимость аренды стоит того стратегического значения, которое она может дать нашей стране."
 ita.187.a: "Это могло бы стать хорошей базой."
 ita.187.b: "Нас это не интересует."
 #
 ita.188.t: "[От имени Гейтна] соглашается сдать в аренду [768. Название]"
 ita.188.d: "Осознавая, что это огромная стратегическая ценность, [от GetName] согласилась арендовать [768.GetName] у нас."
 ita.188.a: "Приятно иметь с вами дело."
 #
 ita.189.t: "[От GetName] отказывает в аренде [768.GetName]"
 ita.189.d: "Несмотря на огромную стратегическую ценность, [от GetName] отказался от аренды [768.GetName] у нас."
 ita.189.a: "Возможно, нам стоит найти другого покупателя."
 ita.189.b: "Это было прибыльно, пока оно продолжалось."
 #
 ita.190.t: "Продлим ли мы аренду [768. GetName]?"
 ita.190.d: "Соглашение об аренде [768.GetName] почти закончилось."
 ita.190.a: "Давайте продлим срок аренды."
 ita.190.b: "Пришло время вернуть собственность."
 #
 ita.191.t: "Италия предлагает продлить срок аренды [768.GetName]"
 ita.191.d: "Похоже, что итальянцы были очень удовлетворены нашей договоренностью в отношении [768.GetName] и хотели бы продлить срок аренды."
 ita.191.a: "Мы продолжим нашу аренду."
 ita.191.b: "Мы больше не заинтересованы в этом соглашении."
 #
 ita.192.t: "Италия больше не желает арендовать [768. GetName]"
 ita.192.d: "По мере улучшения экономической ситуации в Италии Рим больше не видит необходимости в аренде [768.GetName] для получения средств, и поэтому они решили не продлевать нашу аренду. [768.GetName] теперь вернется к прямому итальянскому контролю."
 ita.192.a: "Было весело, пока это продолжалось."
 #
 ita.193.t: "Италия покидает Консенсус"
 ita.193.d: "Отношения между Францией и Италией постепенно ухудшались с момента окончания Великой войны. Территориальные споры с ее соседями привели Италию в «Согласие» 20 лет назад, и теперь, похоже, это империалистическое отношение разорвало на части то, что осталось от этого когда-то могущественного союза. Поскольку одна из самых молодых Великих держав Италии никогда не удерживалась в том же отношении, что и Франция или Британия, большинство международного сообщества. Отчаяние Италии в том, что она стала доминирующей державой в Средиземном море, поставило ее в противоречие с Францией в прошлом, но многие надеялись, что их союз положит конец этим ссорам, но кажется, что амбиции растущей империи никогда не исчезнут. Италия теперь решила искать свою судьбу отдельно от Франции. Это событие поставило под вопрос судьбу застояния. Выживет ли панъевропейская организация Франции без одного из ее самых могущественных членов? Германия будет освещена этим и ускорит процесс их вооружения? Будущее Европы, как мы знаем, может быть, медленно приближается к концу."
 ita.193.a: "Проклятье этих итальянцев!"
 #
 ita.194.t: "Какой регион будет принимать у себя наши военные учения с Францией"
 ita.194.d: "С растущей угрозой немецкого перевооружения крайне важно, чтобы мы убедились, что Франция и наши армии все еще способны защититься от любых возможных германских наступательных действий. Германия вновь позаботилась о том, чтобы приобрести союзников, и как таковые нам нужно будет обеспечить, чтобы наши армии были гибкими и способными противостоять многим возможным сценариям. Наиболее очевидным регионом, на который могут напасть немцы, является Рейн. Французская оккупация этого региона была болезненным местом во франко-германских отношениях и [ГЕР.Генератор] не сделала секрета о своем желании вернуть его. Рейнская река обеспечивает большую защиту, но она ни в коем случае не является неповоротимой. Австрия также является регионом немецких амбиций. Если бы они аннексировали этот регион, то это был бы серьезный удар по безопасности Италии. Мы не должны позволить немцам поддерживать наши армии через Альпы. Хотя немецкий флот маленький он быстро растет. Немецкие подводные лодки совершают много рейсов в Северном море. Мы должны быть уверены, что мы сможем противостоять этому в случае войны. Хотя Германия также не имеет большого влияния в Средиземном море мы должны также сохранять бдительность здесь."
 ita.194.a: "Мы устроим упражнение на Рейне."
 ita.194.b: "Мы устроим упражнение в Альпах"
 ita.194.c: "Мы устроим упражнение в Северном море."
 ita.194.e: "Мы устроим упражнение в Средиземноморье"
 #
 ita.195.t: "Италия предлагает провести военные учения на Рейне"
 ita.195.d: "По мере увеличения численности немецких войск на границе с Ренишем Италия предложила начать военные учения в регионе, с тем чтобы сохранить нашу армию в высшей форме в случае немецкого вторжения."
 ita.195.a: "Умный выбор"
 #
 ita.196.t: "Италия предлагает провести военные учения в Альпах"
 ita.196.d: "По мере увеличения влияния Германии на Австрию Италия предложила начать военные учения в регионе, чтобы сохранить нашу армию в высшей форме в случае немецкого вторжения."
 ita.196.a: "Умный выбор"
 #
 ita.197.t: "Италия предлагает провести военные учения в Северном море"
 ita.197.d: "По мере того, как Германия увеличит размер ВМС, Италия предложила начать военные учения в Северном море, чтобы сохранить наш ВМС в высшей форме в случае войны с Германией."
 ita.197.a: "Умный выбор"
 #
 ita.198.t: "Италия предлагает провести военные учения в Средиземноморье"
 ita.198.d: "По мере того, как Германия усиливает свое влияние в Средиземноморье, Италия предложила начать военные учения в регионе, чтобы сохранить наш ВМС в высшей форме в случае войны с Германией."
 ita.198.a: "Умный выбор"
 #
 ita.199.t: "Извлечение уроков из учения по Рейну"
 ita.199.d: "Рейн составляет крупнейшую границу Энтента с Германией. Очевидно, что бóльшая часть Берлина будет сосредоточена на этом регионе, если вспыхнет война. Река Рейна действительно обеспечивает защиту. Река Рейна показывает, что Рейнская долина уязвима для быстрого прогресса, если немцу удастся пересечь ее. Мы должны подготовиться к этому."
 ita.199.a: "Любопытно."
 #
 ita.200.t: "Извлечение уроков из альпийских упражнений"
 ita.200.d: "Альпы дают Италии естественную защиту от возможного немецкого вторжения, но прошло всего пару десятилетий с тех пор, как Австро-германским силам когда-то удалось захватить Венецию. Мы не должны снова недооценивать немецкую армию вот так. Наши недавние учения показали, что мы должны обновить инфраструктуру и крепости в регионе, если мы хотим защитить ее от немецкой угрозы."
 ita.200.a: "Любопытно."
 #
 ita.201.t: "Учиться на учениях в Северном море"
 ita.201.d: "Растущий немецкий кригсмарин начинает становиться угрозой для французских ВМС в Северном море. Наши учения показали, что смешанный голландский и немецкий флот может одолеть местный флот Франции. Чтобы победить Германию в будущем, мы должны поддерживать наши корабли в регионе и удерживать Германию в блокаде."
 ita.201.a: "Любопытно."
 #
 ita.202.t: "Извлечение уроков из средиземноморских учений"
 ita.202.d: "Хотя Германия имеет очень мало прямого влияния в Средиземном море, они активизировали усилия по поиску союзников в регионе, хотя итальянский флот является крупнейшим в Средиземном море, наши учения намекают на то, что открытие другого фронта может слишком размыть итальянский флот, и Германия, несомненно, воспользуется им в случае войны."
 ita.202.a: "Любопытно."
 #
 ita.203.t: "Итальянцы присылают нам ультиматум."
 ita.203.d: "Вот уже несколько месяцев Италия поддерживает террористические элементы в нашей стране, которые стремятся разорвать нашу великую нацию."Liberators\" Rome has sent us an ultimatum demanding that we release these rebellious regions. It's clear that Italy does not care about about the right to self determination as they state to the public but are only interested in dismantling Serbia and expanding their own influence into the Balkans. Our army is prepared to defend our territory at all cost but it's clear to most the the Italian army is better equipped and trained. We may want to seek the support of France in mediating this conflict."
 ita.203.a: "Мы должны избегать кровопролития."
 ita.203.b: "Если они хотят нашу землю, они должны прийти и забрать ее."
 ita.203.c: "Давай попросим поддержки у Франции."
 #
 ita.204.t: "Сербия отвергает наши требования"
 ita.204.d: "Несмотря на продолжающееся давление со стороны наших партизанских союзников в Сербии, Белград, как представляется, не заинтересован в предоставлении им независимости, которую они заслуживают."
 ita.204.a: "Неправильность Версаля будет исправлена"
 ita.204.b: "Мы не можем рисковать войной с Францией."
 #
 ita.205.t: "Сербия обращается с просьбой об оказании поддержки Италии"
 ita.205.d: "Сербия недавно оказалась под пристальным влиянием Италии и обратилась к нам с просьбой оказать поддержку в обеспечении ее суверенитета. Еще до того, как Великая война Сербия расширилась на Балканах за счет оттоманцев и болгаров, ситуация, которая до сих пор вызывает такую же международную напряженность, лишь усугубила эти территориальные споры, когда Сербия получила большинство славянских земель, принадлежащих Австрии и Венгрии. Италия, как представляется, выступила с инициативой по обращению вспять этих территориальных аннексий, требуя, чтобы Сербия возвратила большую часть этой земли или столкнулась с возможным вторжением. Как одна из крупнейших стран на Балканах, демонтаж Сербии мог бы дестабилизировать полуостров и закрепить Италию как неоспоримую власть над регионом."
 ita.205.a: "Мы защитим Сербию от тирании"
 ita.205.b: "Мы не можем рисковать войной с Италией."
 #
 ita.206.t: "Франция согласна поддержать нас против Италии."
 ita.206.d: "Услышав наши отчаянные призывы, Франция согласилась официально гарантировать наш национальный суверенитет против итальянской агрессии."
 ita.206.a: "Тост за нашего французского союзника"
 #
 ita.207.t: "Франция требует, чтобы мы выступили против Сербии."
 ita.207.d: "Несмотря на наши усилия изолировать и окружить их, Сербия каким-то образом получила поддержку французов, которые сейчас требуют от нас прекратить всякую агрессию в отношении сербов."
 ita.207.a: "Мы никогда не откажемся от французов."
 ita.207.b: "Мы не готовы к крупной войне."
 #
 ita.208.t: "Италия согласна отказаться от Сербии"
 ita.208.d: "После чрезвычайной встречи французских и итальянских дипломатов Рим склонился к французскому давлению и согласился отступить и избежать дальнейших военных действий в отношении Греции."Italy has now truly become a Great Power able to apply decisive pressure the nations of Europe as she wishes\" while in France this is seen as another example of the Entente Council's ability to reach peaceful conclusions to European disputes."
 ita.208.a: "Наконец, некоторое мирное урегулирование в Европе"
 #
 ita.209.t: "Франция отказывается поддержать нас против Италии."
 ita.209.d: "Несмотря на то, что французы являются самозваным защитником европейской стабильности, они отказываются принимать сторону против вопиющей агрессии Италии."
 ita.209.a: "Проклятье!"
 #
 ita.210.t: "На Сербию напали!"
 ita.210.d: "Несмотря на наши усилия, направленные на то, чтобы оказать давление на итальянцев, Рим, как представляется, продолжает идти по пути самоубийства и вторгается в Сербию. В соответствии с нашим соглашением с сербскими государствами, мы теперь обязаны оказывать им полную военную поддержку против итальянской агрессии, поскольку почти за два десятилетия великие державы вновь находятся на грани войны, решение, которое мы сейчас принимаем, будет иметь серьезные последствия на предстоящие десятилетия."
 ita.210.a: "Мы должны сдержать обещание."
 ita.210.b: "Мы уже слишком замешаны в этом внешнем кризисе."
 #
 ita.211.t: "Франция отказывается оказывать обещанную поддержку"
 ita.211.d: "Несмотря на соглашение, которое они подписали с нами, заявив о своей прямой поддержке в случае вторжения итальянского лидера, Франция отказалась выполнить свои обязательства."
 ita.211.a: "Проклятье!"
 #
 ita.212.t: "Италия требует вернуть албанскую землю."
 ita.212.d: "Албания, которая находится на перепутье многих могущественных государств, имеет бурную историю, они обрели независимость от Османской империи после первой балканской войны только для того, чтобы вновь порабощаться своими соседями по завершении Великой войны. Италия, несмотря на свое участие в порабощении Албании, по всей видимости, очень обеспокоена их территориальной целостностью. Рим требует, чтобы мы вернули ей нашу албанскую землю. Это очевидная уловка из Италии, с тем чтобы демонтировать нашу собственную нацию и позволить ей распространить свое влияние на Балканы. Мы должны сделать все возможное для того, чтобы защитить нашу страну от этих внешних угроз."
 ita.212.a: "Мы должны избегать кровопролития."
 ita.212.b: "Если они хотят нашу землю, они должны прийти и забрать ее."
 ita.212.c: "Давай попросим поддержки у Франции."
 #
 ita.213.t: "Италия требует вернуть венгерскую землю."
 ita.213.d: "Великая война привела к роспуску Австро-Венгерской империи, в том числе к разрушению самого Королевства Венгрия, за наше участие в военных усилиях "Согласие" предоставило нам землю, которая ранее была частью венгерского королевства, Италия явно использует этот небольшой пограничный спор, чтобы получить больше влияния на нашу нацию, мы никогда не должны отступать от подобных угроз, несомненно, Совет Согласия поддержит нас в этом кризисе."
 ita.213.a: "Мы должны избегать кровопролития."
 ita.213.b: "Если они хотят нашу землю, они должны прийти и забрать ее."
 ita.213.c: "Давай попросим поддержки у Франции."
 #
 ita.214.t: "Италия требует вернуть болгарскую землю."
 ita.214.d: "Болгария является врагом Сербии с второй балканской войны, после этого конфликта и Великой войны нам была присуждена болгарская земля за участие в победе над центральными державами, Италия явно использует этот небольшой пограничный спор для того, чтобы получить больше влияния на нашу страну, мы никогда не должны отступать от подобных угроз, несомненно, Совет Согласия поддержит нас в этом кризисе."
 ita.214.a: "Мы должны избегать кровопролития."
 ita.214.b: "Если они хотят нашу землю, они должны прийти и забрать ее."
 ita.214.c: "Давай попросим поддержки у Франции."
 #
 ita.215.t: "Италия требует вернуть венгерскую и болгарскую землю."
 ita.215.d: "Великая война привела к роспуску большинства центральных держав, включая и Венгрию, и Болгарию. За участие в военных усилиях «Согласие» предоставило нам землю, которая ранее была частью их соответствующих сфер. Италия явно использует этот небольшой пограничный спор для того, чтобы получить больше влияния на нашу страну. Мы никогда не должны отступать от подобных угроз. Конечно, Совет Согласия поддержит нас в этом кризисе."
 ita.215.a: "Мы должны избегать кровопролития."
 ita.215.b: "Если они хотят нашу землю, они должны прийти и забрать ее."
 ita.215.c: "Давай попросим поддержки у Франции."
 #
 ita.216.t: "Растущая напряженность в отношениях с Францией"
 ita.216.d: "За последние несколько лет Италия и Франция разошлись, и отношения стали очень враждебными. Франция отказывается сдать основную итальянскую территорию, не оставляя нам иного выбора, кроме как отказаться от нашего союза с ними. Растущая угроза Германии вынудила Францию сосредоточить свои усилия на защите Рейна, оставляя французские Альпы, которые лишь легко защищаются. Сейчас это большая возможность сдвинуть нашу военную мощь против Франции и позволить местным итальянским подразделениям вступать в конфликт с их французскими противостоящими частями. Для того чтобы наши территориальные требования когда-либо воспринимались серьезно, мы должны иметь армию, которая могла бы поддержать их."
 ita.216.a: "Наша сила должна быть доказана в битве"
 ita.216.b: "Мы не готовы к войне."
 #
 ita.217.t: "Итальянские силы оттолкнули французских защитников."
 ita.217.d: "С нашей стороны, с удивлением и инициативой мы смогли легко преодолеть слабых французских защитников, и Италия может гордиться тем, что она является страной, которая может подчинить любую великую державу."
 ita.217.a: "Слава Италии!"
 #
 ita.218.t: "Французские защитники преодолели итальянские силы"
 ita.218.d: "Несмотря на то, что у итальянцев есть элемент неожиданности, они не смогли преодолеть нашу продвинутую оборону. Мы не совсем уверены, чего итальянцы надеялись добиться с помощью этого небольшого пограничного рейда, но все, что это показало, это то, что их армия до сих пор ничего не узнала о Великой войне."
 ita.218.a: "Слава Франции!"
 #
 ita.219.t: "Французские защитники преодолели итальянские силы"
 ita.219.d: "Несмотря на то, что у нас есть элемент неожиданности, наши силы не были достаточно организованы для того, чтобы победить французскую оборону, мы недооценили французов, и мы не должны повторять эту ошибку."
 ita.219.a: "Проклятье!"
 #
 ita.220.t: "Итальянские силы оттолкнули французских защитников."
 ita.220.d: "Мы должны сделать все, что в наших силах, чтобы улучшить нашу пограничную оборону до того, как между нами вспыхнет крупная война."
 ita.220.a: "Проклятье!"
 #
 ita.221.t: "Выборы в Италию [Грейд]"
 ita.221.d: "В соответствии с нынешней конституцией Италии наша страна должна проводить национальные выборы для принятия решения о составе парламента по крайней мере один раз в пять лет. После исторических выборов 1936 года эксперты не ожидают каких-либо серьезных нарушений, но из-за нестабильной ситуации в Европе нынешнее правящее большинство может увидеть определенные потери для оппозиции."
 ita.221.a: "Мы должны сосредоточить все наше внимание на военных усилиях."
 ita.221.b: "Наиболее новые места в парламенте занимают социалисты."
 ita.221.c: "Прогрессивные получают самые новые места в парламенте"
 ita.221.e: "Либералы получают самые новые места в парламенте"
 ita.221.f: "Консервативы получают самые новые места в парламенте"
 ita.221.g: "Националисты получают самые новые места в парламенте"
 #
 ita.222.d: "Коммандер Итало Бальбо недавно закончил длившуюся десятилетия партизанскую кампанию в Ливии, захватив лидера Омара Мухтара, и Мухтара можно отправить в тюрьму за весь ущерб, причиненный ему и его последователям, хотя присяжные, несомненно, признают его виновным, не знают, каким будет его наказание."
 #
 ita.223.d: "Италия является большинством католиков, в то время как Ливия твердо исламских государств."
 #
 ita.224.d: "История повторяется, когда Италия требует, чтобы мы подчинялись ей, под итальянским ультиматумом мы станем протекторатом в Италинской империи, хотя некоторые утверждают, что Италия могла бы помочь модернизировать нашу нацию, это чувство не является популярным у большинства наших граждан, несмотря на кажущуюся подавляющей мощь Италии, мы откажемся от любых попыток подорвать наш суверенитет."
 #
 ita.225.d: "Мы хотели, чтобы Абиссиния просто сдалась через ультиматум, Аддис-Абеба проигнорировала наши слова и теперь должна быть убеждена на поле боя, мы отомстим за нашу предыдущую неудачу и обеспечим нашу позицию в Восточной Африке."
 #
 ita.226.d: "Удивительно, что наши делегаты в Аддис-Абебе сообщили о том, что правительство Хайле Селасси согласилось стать нашим протекторатом, что позволит расширить наше влияние в Восточной Африке и одновременно обеспечить экономическое развитие Эфиопии."
 #
 ita.227.d: "Панфилия является частью итальянской империи с конца Великой войны, но перед лицом этой глобальной экономической депрессии мы должны ужесточить наши пояса. Было принято решение, что наша территория в Анатолии может не стоить дальнейших инвестиций и должна быть продана, чтобы сэкономить на дальнейших потерях. Теперь мы должны решить, кто продать эту землю. С одной стороны, Греция была нашим союзником во время Великой войны, но теперь нация переросла и может даже вскоре стать угрозой для нас. С другой стороны, Остоманская империя, несмотря на то, что она является нашим врагом во время войны, несомненно, захочет вернуть эту землю обратно, потому что она в основном населена этническими турками и обеспечит доступ в Средиземное море."
 #
 ita.228.d: "Итальянская нация предложила продать нам территорию Панфилии. Эта территория стала предметом ожесточенных споров между турками, греками и итальянцами с момента окончания Великой войны. Доступ к Средиземному морю и огромные запасы хрома делают его очень ценным регионом."
 #
 ita.229.t: "[От. Наимена] соглашается купить [345. Наименование]."
 ita.229.d: "Мы приняли наше предложение о покупке Панфилии, и надеемся, что это не только облегчит отношения с нашими налогоплательщиками, но и облегчит их экономическое бремя."
 #
 ita.230.t: "Как нам реформировать армию?"
 ita.230.d: "Во время Великой войны 5 миллионов солдат были частью армии, но их число сократилось, и новая тактика, которую мы узнали во время войны, могла помочь модернизировать нашу армию. Дух герцога Виктори Армандо Диаза, который скончался в 1928 году, по-прежнему сильна в армии, и благодаря ему итальянские солдаты уже не находятся в неподготовленном состоянии, но это также привело к самоуспокоению среди командиров, которые могут ослабить свою способность защищать себя. Ранее, когда Италия начала закупать танки из Великобритании в 1928 году, что помогло итальянской военной индустрии значительно продвинуться вперед. ФИАТА добивается осуществления нового, построенного дома, танков в армии, чтобы мы могли избавить наших солдат от незащищенных убийств, которые они были подвергнуты в ходе Великой войны, но некоторые офицеры парламента считают, что одна из главных причин низкой эффективности итальянской армии в этой войне была обусловлена отсутствием достаточной артиллерии. Вместо того, чтобы сосредоточить внимание на дорогостоящих и уязвимых танках, они считают, что наши солдаты должны быть уверены в том, что наши командиры-мощные офицеры-мощные агенты, которые занимаются профилированием своей армии, хотят, чтобы более активно и мощная объединяться в свою армию."
 ita.230.a: "Мы должны выбрать путь аккуратно."
 #
 ita.231.t: "Италия требует освобождения наших этнических меньшинств."
 ita.231.d: ""
 ita.231.a: "Мы должны выбрать путь аккуратно."
 #
 ita.842.t: "Венгрия требует Любляну!"
 ita.842.d: "Венгерская нация пошла по пути экспансионизма, и они решили послать нам список требований, в частности о передаче Любляны им. Хотя мы почти наверняка могли бы победить венгров в войне, это привело бы к гибели многих людей и могло бы нанести ущерб нашей репутации в европейском сообществе. Как мы ответим?"
 ita.842.a: "Это небольшая уступка для достижения прочного мира."
 ita.842.a: "Нет шансов."

 # Flavor Events
 itafla.1.t: "Смерть Джузеппе Серги"
 itafla.1.d: "Сегодня в возрасте 95 лет скончался итальянский антрополог Джузеппе Серги. На протяжении десятилетий он преподавал как в Болонском университете, так и в Университете Рим-Ла-Сапиензы, где его приверженность своему делу способствовала популяризации и развитию антропологии в современной науке, которую мы знаем сегодня. В последние годы наблюдается рост интереса к его работам, особенно в "средиземноморской расе". Поскольку немецкий рейх продолжает пропагандировать превосходство скандинавского народа, многие итальянские националисты противостояли своим собственным теориям единой средиземноморской расы, которая может отследить ее происхождение в Риме, первой великой европейской цивилизации. Дальнеправный итальянский фасци дель Синдакалисмо Нацонале (ФИСН) видит в писаниях Серги как краеугольный камень их движения. Поскольку северные страны Великобритании и Германии будут продолжать распространять свое влияние в Средиземном море, ФИСН будут продолжать пропагандировать свои идеалы единого государства в Южной Европе, построенного на на наследие Рима, которое может бороться с иностранными захватчиками. Гиппе Серги будет продолжать распространяться как один из наиболее важных интеллектуа."
 itafla.1.a: "Его будет не хватать."

 # Socialist Events
 itasoc.1.t: "Местное сопротивление в [ITA_state_fail.GetName]"
 itasoc.1.d: "Несмотря на нашу политическую поддержку, наши региональные союзники в [ITA_state_fail.GetName] не смогли мобилизовать местную поддержку. Их попытки укрепить местные союзы были сорваны коалицией владельцев предприятий и их союзниками в черной рубашке, и любые попытки создать местные ополчения для защиты этих союзов были расстроены местными властями. Если мы хотим укрепить наше влияние в регионе, нам придется предложить больше политической поддержки местным социалистам."
 itasoc.1.a: "Только временный возврат"
 #
 itasoc.2.t: "Судьба революции"
 itasoc.2.d: "В левой коалиции существуют две фракции: промосковские коммунисты, возглавляемые Амадео Бордига, Антонио Грамши и Пальмиро Тольятти, и реформистские социалисты, возглавляемые Пьетро Ненни и Джакомо Маттеотти. Коммунисты, особенно Тольятти, выступают за радикальные и немедленные общественные перемены в Италии в роде СССР, призывая к изгнанию Роялти и быстрой коллективизации промышленности. Социалистические силы, опасаясь возможного насильственного сопротивления и краха жизненно важного союза Италии с Францией, вместо этого поддерживают постепенные реформы и компромиссы с существующими в Италии структурами власти. Для многих в дальней левой части Пьетро Ненни и его социалисты считаются предателями революции, Ненни даже сам поддерживает империалистическое вступление Италии во Великую войну и даже зачисляется в армию. умеренные социалисты считают, что коммунисты слишком идеалистичны и не являются достаточно прагматичными, чтобы превратить свои теории в пассисию и скорее избегают ненужного кровопролития."
 itasoc.2.a: "Тольятти"Leninist\" faction takes power."
 itasoc.2.b: "Бордига"Trotskyist\" faction takes power."
 itasoc.2.c: "Грэмши."Neo-Marxist\" faction takes power."
 itasoc.2.e: "Маттеотти"Reformist Socialist\" faction takes power."
 itasoc.2.f: "Ненни."Democratic Socialist\" faction takes power."
 #
 itasoc.3001: "С революцией в Италии многие сейчас ставят под сомнение наше место в Континентальном соприкосновении, где мы находим себя связанными с реакционными державами, более идеологически пуританическим вопросом о нашем членстве в эксплицитно либеральной организации, но тем более прагматично отмечают, что реакция британцев и немцев представляет собой экзистенциальную угрозу для наших народов. Мы должны мудро выбрать свой путь, поскольку на карту поставлено существование революции."

 itasoc.3.t: "Революция в Италии"
 itasoc.3.d: "Наши отношения с Италией ухудшились с тех пор, как к власти пришла коалиция левого крыла социалистов и коммунистов."Socialist Republic of Italy\" and have expelled much of Italy's former upper class including King Victor Emmanuel.\n\nHowever, despite our ideological differences, pragmatism has prevailed among the Italian left who have recognised the greater threat of the British and Germans. The question is, do we take a pragmatic path with ensures a great power ally and risk alienating our other allies, or remove them from our ranks as an ideological enemy?"
 itasoc.3.a: "Еще одна нация, к сожалению, падает на социализм"
 #For the time being Victor Emmanuel and his family are safe in France but we can not let this disregard of the democratic process go unpunished. We must expel Italy from the Entente and secure our border to hopefully stifle any threat of a Revolution from infecting our own Republic.
 #
 itasoc.4.t: "Папа ищет место жительства"
 itasoc.4.d: "Радикальное коммунистическое правительство Италии недавно приняло политику государственного атеизма и антиклерикализма. Самой известной жертвой этой политики является Папа Пий XI и его товарищи кардиналы, которые были изгнаны из Ватикана. Теперь они смиренно просят прожить в Авиньоне, где в прошлом проживало несколько пап. Разрешить Папе сложиться во французском городе - это, по меньшей мере, спор. Многие левые люди в Авиньоне даже вышли на улицы в знак протеста против папства."
 itasoc.4.a: "Как добрые католики, мы должны поддерживать Папу Папу."
 itasoc.4.b: "Светское общество не может играть в фаворитизм, даже с Папой."
 #
 itasoc.5.t: "Товарищи из Италии просят поддержки."
 itasoc.5.d: "В последнее время социалисты пришли к власти в Италии, и, пока их движение еще молодо, они просят об экономической поддержке для того, чтобы подтолкнуть Италию к быстрой индустриализации, а в свою очередь предлагают свой опыт в области военно-морских технологий и судостроения."
 itasoc.5.a: "Мы должны поддержать наших международных товарищей."
 itasoc.5.b: "У СССР есть свои проблемы, которые нужно решить сначала."
 #
 itasoc.6.t: "СССР соглашается помочь"
 itasoc.6.d: "СССР согласился помочь нам в достижении нашей цели быстрой индустриализации, и взамен мы будем поддерживать их развитие современного военно-морского флота."
 itasoc.6.a: "Тост за наших советских товарищей"
 #
 itasoc.7.t: "СССР отказывается помогать"
 itasoc.7.d: "СССР отказался поддержать нашу цель быстрой индустриализации, утверждая, что они слишком заняты внутренними проблемами, чтобы тратить ресурсы в других странах."
 itasoc.7.a: "Теперь мы должны определить свою судьбу."
 #
 itasoc.8.t: "Итало Бальбо возвращается в Ливию"
 itasoc.8.d: "Несмотря на его попытки привести свою партию к победе в ходе недавних выборов, народ Италии отверг реакционную политику АНИ, и с этой неудачей командир Бальбо решил вернуться на свой первоначальный пост в Ливии, вдали от политических событий в Италии."
 itasoc.8.a: "Лучше для всех нас, чтобы он держался подальше от Рима."
 #
 itasoc.9.t: "Итало Бальбо возвращается в Ливию"
 itasoc.9.d: "Несмотря на его попытки привести свою партию к победе в ходе недавних выборов, народ Италии отверг реакционную политику АНИ, и с этой неудачей командир Бальбо решил вернуться на свой первоначальный пост в Ливии, вдали от политических событий в Италии."
 itasoc.9.a: "Добро пожаловать обратно"
 #
 itasoc.10.t: "Заручиться поддержкой Франции"
 itasoc.10.d: "Итальянские выборы были катастрофой для нашего народа. Пока мы говорим [ITA.Get Header] домогаются всего, что сделало Италию великой нацией. националистические интеллигенции покинули Италию после социалистического красного террора и пытаются начать новую жизнь в Ливии, но очевидно, что это не продлится долго. После того, как Италия будет уничтожена [ITA.Get Leader], мы обязательно посмотрим на нас. Мы должны защищать традиционную итальянскую культуру любой ценой. Франция, похоже, разделяет многие из тех же проблем в Риме и может быть готова гарантировать нас."
 itasoc.10.a: "Мы должны направить делегацию в Париж."
 itasoc.10.b: "Единственное, что хуже социалистического, это французы."
 #
 itasoc.11.t: "Ливия обращается за нашей поддержкой"
 itasoc.11.d: "Социалистическое правительство Италии разрушило традиционные институты своей некогда великой нации. Консервативные интеллектуалы бежали в Ливию после этих катастроф, но очевидно, что Рим не оставит эту позицию слишком долго. Командующий Ливией Итало Бальбо предположил, что Франция могла бы начать \"Friendly Invasion\" of Libya to help protect the last vestiges of free Italy. While this proposal is interesting it would surely provoke conflict with Rome."
 itasoc.11.a: "Демократия не подлежит обсуждению"
 #
 itasoc.12.t: "Франция предлагает свою поддержку"
 itasoc.12.d: "Услышав наши истории о Красном терроре в Италии, Франция согласилась защитить Ливию и ее итальянских беженцев."
 itasoc.12.a: "Выпьем за нашего французского союзника"
 #
 itasoc.13.t: "Франция отказывается поддержать нас."
 itasoc.13.d: "Несмотря на наши истории о Красном Терроре, произошедшем в Италии, Франция отказывается защищать Ливию или ее итальянских беженцев."
 itasoc.13.a: "Проклятье!"
 #
 itasoc.14.t: "Французы оккупируют Ливию"
 itasoc.14.d: "По просьбе местного командира Итало Бальбо Франция оккупировала Ливию."Red Terror\" caused by Rome. This is an obvious lie. It's clear this is only the first step by France, our former ally, to quell our Revolution. We must not let this stand."
 itasoc.14.a: "Пришло время распространить огонь революции на Францию."
 itasoc.14.b: "Мы должны укусить наши языки... пока."
 #
 itasoc.15.t: "Мы должны объявить о нашей независимости."
 itasoc.15.d: "Несмотря на неприятие Францией, враждебность по отношению к социалистическому правлению не ослабла, очевидно, что местные итальянцы требуют права на сохранение традиционных итальянских ценностей и мертвы, чтобы бороться с социализмом до самого конца. Возможно, настало время объявить независимость Ливии от Италии."
 itasoc.15.a: "У нас есть право на самоопределение."
 itasoc.15.b: "Мы должны избегать кровопролития."
 #
 itasoc.16.t: "Ливия объявляет независимость"
 itasoc.16.d: "При поддержке местного командира Итало Бальбо итальянцы в Ливии провозгласили независимость колонии, хотя такие антиимпериалистические устремления почти очаровательны, ясно, что это решение было принято без поддержки местных ливийцев и что Бальбо не намерен разрушать вредную структуру власти, которая приносит пользу итальянцам за счет местных жителей."
 itasoc.16.a: "Мы должны раздавить эту ублюдочную революцию."
 itasoc.16.b: "Похоже на империализм."

 # Nationalist Events
 itasyn.1.t: "Судьба националистической коалиции"
 itasyn.1.d: "Хотя альянс националистов и синдикалистов был политически удобен, он больше не служит интересам ни одной из партий. &quot; Национальные популисты &quot; хотят объединиться с существующими в Италии институтами, капиталистами и монархией, в то время как национальные синдикалисты стремятся установить новый порядок для Италии, избавляя ее от такого устаревшего влияния."
 itasyn.1.a: "Националисты правы."
 itasyn.1.b: "Синдикалисты правы."
 #
 itasyn.2.t: "Виктор Эмануал ищет поддержки"
 itasyn.2.d: "Итальянский парламент, находящийся под почти полным контролем ФНСН, проголосовал за отмену монархии. Сегодня, в течение более 2000 лет, Италия является республикой, в результате чего наш бывший союзник, Виктор Эмануал, является апатридом. В знак доброй воли для короля, который привел свой народ на нашу сторону во время Великой войны, мы, возможно, захотим предложить Емануальный вид на жительство в нашей стране, но это, несомненно, расстроит новое итальянское правительство."
 itasyn.2.a: "Мы не можем бросить нашего старого союзника."
 itasyn.2.b: "Мы не должны обижать Рим."
 #
 itasyn.3.t: "Габриэль Д'Аннунцио найден мертвой на своей частной вилле"
 itasyn.3.d: "Гэбриел Д'Аннунцио, поэт, журналист и политик, был найден мёртвым на его вилле во время его рабочего стола. Как лидер правящей партии ФИСН и Национального синдикалистского движения в целом его смерть послала шоковую волну по всей Италии и всему европейскому сообществу. Его лидерство и мощные оральные способности имели важнейшее значение для того, чтобы заставить ФИСН к власти и революционизировать итальянское общество. Обе палаты парламента собрались для его похорон, на которых его гроб будет завернут в флаг Тимаво и похоронен в впечатляющем мавзоле Италии, до того как он сможет наполнить память о том, что какое-то место для такого национального героя может стать подходящим местом для такого национального героя. ~ nn Despenzio для национального трауля мы должны продолжать смотреть в будущее партии. Обе палаты парламента соберутся для чрезвычайного заседания Аренго дель Италья, чтобы решить, на чьем месте будет жить Д'Аннунцио в качестве компаньона Италии, и что Д'Анциан был далеко от идеального лидера. Он никогда не был заинтересован в том, чтобы управлять партии, не был в одиночку, кроме целого государство, которое выбрало для того, чтобы в его с целью, чтобы он, чтобы сделать свою новую прежнюю прежнюю прежнюю прежнюю прежнюю прежнюю прежнюю прежнюю прежнюю квартиру."
 itasyn.3.a: "Д'Аннунцио, единственный революционер в Италии, Прощай."
 #
 itasyn.4.t: "Следующая команда Италии"
 itasyn.4.d: "После недавней смерти Габриеля Д'Аннунцио Аренго дель Италиа был сформирован для избрания его преемника. Три возможных кандидата, которые, как считается, имеют достаточную квалификацию для заполнения ботинок Д'Аннунцио. Несмотря на то, что многие его противники критикуют его социалистическое прошлое и его подозрительные отношения с СССР. nnEdmondo Rossoni, секретарь Конфедерации фашистских синдикатов, является еще одним возможным кандидатом. Жесткий союз труда, которого любит большинство рабочих, а также итальянские профсоюзы. Он могущественный и амбициозный человек со многими грандиозными планами для Италии, но его враждебность по отношению к промышленникам и другим членам высших классов Италии привела к тому, что его назвали ."Radical\" by some of the FISN more conservative elements who wish to see class cooperation.\n\nTullio Cianetti, radical trade unionist, has been selected as the final candidate. Despite his young age compared to most of the FISN leadership his reformist minded politics may bring new life to the party. He is already seen as a trusted ally of Italian labor but unlike Rossoni he shows no hostilities towards Italy's upper classes. His opponents though are concerned about his connections to Germany, specifically his friendship with Otto Strasser who's economic theories are seen with much skepticism back in Italy." 
 itasyn.4.a: "Эмбрис является отцом-основателем движения и четким выбором."
 itasyn.4.b: "Влияние Россони на итальянский рабочий класс делает его убедительным выбором."
 itasyn.4.c: "Реформированная политика Цианетти принесет в партию новую жизнь."
 #
 itasyn.5.t: "Договор о дружбе с СССР?"
 itasyn.5.d: "Когда Габриэль Д'Аннунцио создал Итальянский Регент Карнаро, Советский Союз был единственной страной, которая официально признала наш суверенитет."The only revolutionary in Italy.\". While relations with the USSR were positive in the small city of Fiume the rest of the Kingdom of Italy has been hostile to the Soviet Unions ever since their foundation. Ambris believe it's time to end this animosity between our two states and push for more cooperation. While some Italian Valkists dislike the USSR's anti-nationalist stance, many see the Revolutionary spirit both our movements possess despite our minor ideological differences."
 itasyn.5.a: "Мы не должны забывать о том, что СССР поддерживал наше движение после Карнаро."
 itasyn.5.b: "Наши две идеологии больше не совместимы."
 #
 itasyn.6.t: "Подписать пакт о дружбе с Италией?"
 itasyn.6.d: "Итальянское Королевство проявляет враждебность к СССР с момента нашего основания, но в последнее время революция в некотором роде под руководством Национального синдикалиста Габриэля Д'Аннунцио привела к тому, что к власти в Италии пришла более аналогичная партия. &lt; &lt; Нынешняя итальянская команданте Альцесте де Амбрис &gt; &gt; , бывшая социалистка, желает улучшить отношения между нашими двумя государствами, подписав пакт о дружбе. &lt; &lt; Хотя некоторые советы устали от нынешней националистической политической позиции Рима &gt; &gt; , многие видят, что революционный дух обоих наших движений, несмотря на наши незначительные идеологические разногласия, также поможет нам получить доступ к их передовой пул промышленных инженеров, которые могли бы научить наших инженеров и улучшить нашу экономику."
 itasyn.6.a: "Д'Аннунцио и его движение - единственные настоящие революционеры в Италии."
 itasyn.6.b: "Мы не можем поддержать этих националистов."
 #
 itasyn.7.t: "Советы подписывают пакт о дружбе"
 itasyn.7.d: "Увидев сходство наших двух движений, СССР согласился подписать с нами пакт о дружбе."
 itasyn.7.a: "Тост за наших русских товарищей."
 #
 itasyn.8.t: "Советы отказываются подписывать пакт о дружбе"
 itasyn.8.d: "Несмотря на сходство наших двух движений, СССР отказался подписать с нами пакт о дружбе."
 itasyn.8.a: "Проклятье этих предателей."
 #
 itasyn.9.t: "Альянс с СССР?"
 itasyn.9.d: "По мере того, как грязные силы Франции и Германии становятся все более сильными, ясно, что наше движение, нет, само выживание итальянского народа поставлено на карту. Если мы хотим выжить в предстоящее десятилетие, мы должны заручиться сильными союзниками для сдерживания любых вторжений в нашу страну. Наши отношения с Советским Союзом в последнее время улучшаются. Пакт дружбы, подписанный нашими странами, не обязал ни одну из сторон поддерживать друг друга в военном отношении, но по мере роста напряженности в Европе, возможно, настало время изменить это."
 itasyn.9.a: "Капиталистический Запад и варварские немцы представляют угрозу для нас обоих."
 itasyn.9.b: "У нас есть свои интересы, о которых стоит беспокоиться."
 #
 itasyn.10.t: "Италия желает альянса."
 itasyn.10.d: "По мере того, как варварские немцы становятся все более сильными, становится ясно, что наша национальная безопасность находится под угрозой. [ГЕР.Главный] не сделал секретом свое недовольство СССР и социализмом в целом. Если мы хотим пережить войну с немцами, нам понадобятся могущественные союзники. Италия разделяет многие из тех же озабоченностей по поводу Германии, и поэтому они предложили нам военный союз, чтобы защитить наши нации от вторжения. Хотя мы, возможно, и не увидим, что делают итальянцы, ясно, что они полны решимости быть нашим преданным союзником."
 itasyn.10.a: "Похоже, у нас аналогичная озабоченность по поводу безопасности."
 itasyn.10.b: "У нас есть свои интересы, о которых стоит беспокоиться."
 #
 itasyn.11.t: "СССР согласен с нашим альянсом."
 itasyn.11.d: "Учитывая растущую угрозу Германии и либерального капитализма в целом, СССР согласился на союз с нами."
 itasyn.11.a: "Вместе мы обеспечим нашу соответствующую революцию."
 #
 itasyn.12.t: "СССР отказывается от нашего союза."
 itasyn.12.d: "Несмотря на растущую угрозу Германии и либерального капитализма в целом, СССР отказался заключить союз с нами."
 itasyn.12.a: "Мы должны обеспечить нашу Революцию самостоятельно."
 #
 itasyn.13.t: "Трудовое соглашение с Германией"
 itasyn.13.d: ""
 itasyn.13.a: "Это поможет нормализовать наши отношения и укрепить нашу экономику."
 itasyn.13.b: "Мы не должны помогать варварским немцам."
 #
 itasyn.14.t: "Итало-германское трудовое соглашение"
 itasyn.14.d: "Наша переоснащение требует огромного количества рабочей силы, чтобы заправить его, но скорость, с которой мы восстанавливаем нашу армию, тянет скорость, с которой мы можем обучать квалифицированных рабочих. Рим, кажется, знает об этом и по воле итальянской Команданте Туллио Сианетти послал нам трудовой договор, который позволил бы итальянским рабочим легко переехать в Германию и работать в ней. Сианетти был в хороших отношениях со многими должностными лицами в Германии, включая Отто Страссера, с которым он разделяет многие из тех же экономических теорий. В то время как Италия была нашим противником в прошлом, кажется, что Сианетти хочет улучшить отношения между нашей страной, улучшая экономику друг друга."
 itasyn.14.a: "Это позитивное соглашение для наших государств."
 itasyn.14.b: "Мы не должны связываться с итальянцами."
 #
 itasyn.15.t: "Германия принимает наше трудовое соглашение"
 itasyn.15.d: "Отчаянные для квалифицированных рабочих, немцы согласились с нашим трудовым соглашением. Итальянцы, ищущие работу, смогут легко найти работу в Германии. Надеюсь, это значит, что они вернут в нашу страну столь необходимый доход и промышленный опыт."
 itasyn.15.a: "Тост за наших немецких товарищей."
 #
 itasyn.16.t: "Германия отказывается от нашего трудового соглашения."
 itasyn.16.d: "Несмотря на то, что немцы отчаянно нуждаются в квалифицированной рабочей силе, они отказались от нашего трудового соглашения, и теперь итальянцам, ищущим работу за границей, придется искать работу в другом месте."
 itasyn.16.a: "Немцы не стоят нашего времени."
 #
 itasyn.17.t: "Итало-германский альянс"
 itasyn.17.d: "По мере улучшения отношений между нашими нациями ясно, что наше правительство разделяет многие из одних и тех же политических целей. Мы разделяем Францию как смертельный враг. Каждый день немцы приближаются к войне с ними. Если такое событие произойдет, то нам было бы глупо не участвовать в мирном соглашении. Если мы хотим занять свое место в качестве хозяев Средиземноморья, мы, возможно, захотим рассмотреть вопрос о том, чтобы сделать Германию могущественным союзником."
 itasyn.17.a: "Мы должны подать заявление в Штальпакт."
 itasyn.17.b: "Наши судьбы слишком противны."
 #
 itasyn.18.t: "Италия стремится присоединиться к Штальпакту"
 itasyn.18.d: "По мере улучшения отношений между нашими нациями, очевидно, что наше правительство разделяет многие из одних и тех же политических целей. Мы разделяем Францию как смертельный враг. Когда мы приближаемся к войне с французами, возможно, в наших интересах иметь союзника, который может непосредственно помочь нам против них. Последняя война в Австрии была не чем иным, как ответственностью, которая не давала нам реальных стратегических преимуществ. Итальянцы, несомненно, более способны, чем это."
 itasyn.18.a: "Вместе мы раздавим Францию"
 itasyn.18.b: "Нам не нужен еще один уязвимый союзник, который нас тянет вниз."
 #
 itasyn.19.t: "Германия принимает нас в Штальпакт"
 itasyn.19.d: "Осознавая наши общие амбиции в отношении Франции, Германия согласилась заключить с нами союз, и вместе мы раз и навсегда разберемся с французами."
 itasyn.19.a: "Тост за нашего немецкого союзника."
 #
 itasyn.20.t: "Германия отказывается от союза с нами."
 itasyn.20.d: "Несмотря на наши общие амбиции в отношении Франции, Германия отказалась от создания альянса с нами."
 itasyn.20.a: "Проклятье этих варваров!"
 #
 itasyn.21.t: "Местное сопротивление в [ITA_state_fail.GetName]"
 itasyn.21.d: "Несмотря на нашу политическую поддержку наших региональных союзников в [ITA_state_faild.GetName] не смогли мобилизовать местную поддержку. Их попытки укрепить местные синдикаты были сорваны коалицией владельцев предприятий и их антифашистскими союзниками, и любые попытки создать местную Сквадред д'Азионе для защиты этих союзов были расстроены местными властями. Если мы хотим усилить наше влияние в регионе, мы должны будем предложить более широкую политическую поддержку местным синдикатам."
 itasyn.21.a: "Только временный возврат"
 #
 italib.1.t: "Местное сопротивление в [ITA_state_fail.GetName]"
 italib.1.d: "Несмотря на усилия местной полиции в [ITA_state_fail.GetName], антиправительственные организации по-прежнему контролируют регион. Попытки разрушить их были сорваны с нашей стороны и решимость противостоять федеральной власти с их стороны."
 italib.1.a: "Только временный возврат"

 itaslv.1.d: "С объявлением республики возникает вопрос о будущем Словении, которая 20 лет была привязана к итальянской короне и государству через кровные и административные связи, и эти кровные связи разорваны, мы должны определить будущее их администрации, некоторые призывают к снятию этого мелкого государства и их прямой аннексии, в то время как более умеренные голоса предлагают правительство в большей степени, чем правительство в Риме."

 itablackwednesday.1.d: "К счастью, из-за сокращения торговли с Великобританией на протяжении 1920-х и 30-х годов мы были более изолированы от кризиса, чем в противном случае."

 ### Focuses ###

 ITA_future_ppi: "Будущее Народной партии"
 ITA_future_ppi_desc: "Изменяющийся политический ландшафт Италии вынудил все основные партии адаптироваться. ИЦП, будучи краеугольным камнем итальянской политической сцены, в настоящее время теряет поддержку, поскольку оппоненты обещают радикальные реформы для нашей страны. ИЦП внутри страны также разделен между ведущими прогрессивными движениями Стурцо и ведущими католиками Гаспери, которые спорят о направлении партии. Для преодоления этой дилеммы необходимо провести внутренние реформы."
 #
 ITA_conservative_ppi: "Гаспери контролирует ИЦП"
 ITA_conservative_ppi_desc: "Десятилетие прогрессивного правления над Италией закончилось по мере того, как бывшие председатели ИПИ Луиджи Штурцо скатились вниз после растущей критики его руководства. &lt; &lt; Альсид де Гаспери &gt; &gt; занял свою позицию и намерен вести партию к твердой консервативной позиции."
 #
 ITA_expel_socialists: "Дать давление на социал-демократов"
 ITA_expel_socialists_desc: "Чтобы обеспечить ИЦП и это место коалиции как разумной консервативной фракции для предстоящих выборов Гаспери планирует заставить своих союзников из социал-демократов официально дистанцироваться от умеренных социалистов."
 #
 ITA_capitalists_support: "Ищите поддержки у капиталистов"
 ITA_capitalists_support_desc: "По мере приближения предстоящих выборов становится ясно, что ИЦП потребует решительной поддержки со стороны высших классов Италии."
 #
 ITA_progressive_ppi: "Стюрцо поддерживает свое лидерство"
 ITA_progressive_ppi_desc: "Теперь, когда Гаспери и его консерваторы покинули партию, ИЦП может принять единую прогрессивную повестку дня предстоящих выборов."
 #
 ITA_promise_reforms: "Обещайте реформы"
 ITA_promise_reforms_desc: "По мере того, как итальянское общество возвращается в расширяющийся разрыв между бедными и богатыми, ясно, что народ стремится к политическим и экономическим реформам — факт, который мы должны использовать."
 #
 ITA_modern_socialism: "Современный социализм"
 ITA_modern_socialism_desc: "Для многих термин &quot; социализм &quot; является лишь напоминанием о насилии и социальных волнениях российской революции и Красного Бьенния, которые привели к гибели тысяч людей, чтобы помочь среднему итальянскому социальному прогрессу мирно, при помощи демократических средств, мы должны отказаться от насилия в отношении наших соотечественников."
 #
 ITA_italian_election: "[Начинающие] всеобщие выборы"
 ITA_italian_election_desc: ""
 #
 ITA_socialist_revolution: "Социалистическая коалиция"
 ITA_socialist_revolution_desc: "По мере того, как все большее богатство Италии по-прежнему контролируется постоянно сокращающейся группой буржуазии, кажется, что итальянцы вновь испытывают острую потребность в общественных переменах."
 #
 ITA_occupy_factories: "Поощрение местной коллективизации"
 ITA_occupy_factories_desc: "Наша победа на выборах ничего не значит, если наши региональные союзники будут ликвидированы силами капитализма."
 #
 ITA_oust_nobility: "Судьба революции"
 ITA_oust_nobility_desc: "По мере того, как профсоюзы и социалистические ополчения продолжают расширять свое влияние в Италии, кажется, что это идеальный момент для нашей коалиции левого крыла, чтобы превратить теории в реальную праксис. Несмотря на общий оптимизм, в социалистической коалиции появляются трещины. &quot; Хардлайн коммунисты &quot; и более умеренные социалисты продолжают спорить о будущем направлении Италии. &quot; Похоже, что если в ближайшее время не удастся согласовать политику, то мы увидим очередной крах левых, как это произошло во время Бьеннио Россо &quot; ."
 #
 ITA_political_correctness: "Политическая корректность"
 ITA_political_correctness_desc: "Если мы хотим действительно создать коммунистическое общество, мы должны отбросить наши мелкие разногласия и следовать испытанной и подлинной модели, установленной Ленином в СССР."
 #
 ITA_state_atheism: "Государственный атеизм"
 ITA_state_atheism_desc: "\"Religion... is the opiate of the masses.\" - Karl Marx\n\nFor too long the working classes of Italy have been blinded by the conservative voice of the Church, robbing them of any chance of achieving class consciousness. To liberate the workers we must expel this reactionary cornerstone from Italian society."
 #
 ITA_secret_police: "Секретная полиция"
 ITA_secret_police_desc: "Многие реакционные голоса из Италии и из-за рубежа по-прежнему угрожают самому выживанию нашей революции."
 #
 ITA_compromise_with_fascists: "Соглашайтесь с синдикалистами"
 ITA_compromise_with_fascists_desc: "На протяжении многих лет коммунисты и социалисты вступают в противоречие с национальными синдикалистами и их задирой версией классовой борьбы. В последнее время, несмотря на то, что крепкая линия коммунистов, подкрепляемая недавними политическими победами, считает нужным пойти на компромисс с руководством ФНСН в попытке найти общую почву."
 #
 ITA_permanent_revolution: "Постоянная революция"
 ITA_permanent_revolution_desc: "Пока капитализм существует, подлинное коммунистическое общество не может быть сформировано."Permanent Revolution\" and actively attempt to spread socialism across the Mediterranean."
 #
 ITA_moscow_support: "Ищите поддержки Москвы"
 ITA_moscow_support_desc: "Как первое установившееся социалистическое государство, СССР является ядром современной левой теории и праксиса."
 #
 ITA_communal_democracy: "Общинная демократия"
 ITA_communal_democracy_desc: "Освобождение происходит снизу вверх, мы не можем позволить коммунистам централизовать государство и подорвать все усилия, предпринятые самими рабочими, мы должны укрепить политическую власть местных общин и отказаться от подхода к управлению Римом."
 #
 ITA_workers_councils: "Советы работников"
 ITA_workers_councils_desc: "Для более эффективной организации региональных общин мы должны создать советы трудящихся, которые будут создаваться из числа местных граждан, голосующих за самих трудящихся, и будут отвечать за решение местных вопросов."
 #
 ITA_women_revolution: "Женщины революции"
 ITA_women_revolution_desc: "Несмотря на ряд достижений, таких, как право голоса, после окончания Великой войны, женщины по-прежнему являются жертвами многих патриархальных институтов Италии."
 #
 ITA_christian_socialism: "Христианский социализм"
 ITA_christian_socialism_desc: "Для многих марксизм и христианство являются полярными противоположностями."Christian Socialists\" seek to bridge the gap between socialist theory and Christian doctrine. Christianity is clearly an important facet of Italian culture and if we seek to establish a long standing socialist movement we will need to bridge these two world views."
 #
 ITA_nationalist_coalition: "Националистическая коалиция"
 ITA_nationalist_coalition_desc: "Итальянский спрос на мощное руководство привел к тому, что националистическая коалиция ФНСН и АНИ получила большинство на итальянских выборах."
 #
 ITA_purge_socialists: "Охраняйте социалистов"
 ITA_purge_socialists_desc: "На протяжении десятилетий итальянские социалисты ничего не делали, кроме как подрывали единство Италии, чтобы обезопасить нашу нацию, мы должны очистить этих диссидентов."
 #
 ITA_abandon_france: "Покинуть Францию"
 ITA_abandon_france_desc: "Италия больше не должна быть меньшим партнером Франции или любой из Великих держав."
 #
 ITA_empower_syndicates: "Конкордатистский синдикализм"
 ITA_empower_syndicates_desc: "социалисты стремятся ослабить Италию, поощряя враждебность между социальными классами. &lt; &lt; Национальный синдикализм &gt; &gt; призывает к сотрудничеству этих классов на основе идеологии корпоратизма, в рамках которой все члены отдельного экономического сектора имеют равные полномочия в отношении деятельности своей корпоративной группы. &lt; &lt; В корпоративном обществе &gt; &gt; будет обеспечено равное представительство как трудовых, так и капиталистических классов. &lt; &lt; Для достижения этой цели &gt; &gt; мы должны поощрять региональные синдикаты к формированию корпоративных групп."
 #
 ITA_proclaim_republic: "Провозглашайте Итальянскую Республику"
 ITA_proclaim_republic_desc: "По мере того как ход истории постепенно подталкивает Италию к модернизации, ясно, что наша нация переросла потребность в короле."
 #
 ITA_roman_senate: "Возобновление Хартии Карнаро"
 ITA_roman_senate_desc: "Влияние Габриэль д'Аннунцио \"Fiume Endeavour\" has been constantly debated by historians and sociologists since it's collapse in 1921. While d'Annunzio's rule over Carnaro was short lived it did lead to the creation of the \"Charter of Carnaro\", the first National Syndicalist constitution ever made and a corner stone of the movement. The Corporatist society it established should become the new legal framework for Italy."
 #
 ITA_progressive_coalition: "Прогрессивная коалиция"
 ITA_progressive_coalition_desc: "Италия имеет много общественных проблем, которые необходимо решать, и для этого, кажется, люди хотят разумных реформ и регулирования."
 #
 ITA_poor_protection: "Защита бедных"
 ITA_poor_protection_desc: "В настоящее время Италия является одной из беднейших из Великих держав, многие итальянцы едва получают достаточно средств для того, чтобы содержать себя, не говоря уже о своих семьях."
 #
 ITA_colonial_autonomy: "Колониальная автономия"
 ITA_colonial_autonomy_desc: "Очевидно, что ливийцы, турки, сомалийцы, эритрейцы и все другие люди, входящие в состав Итальянской империи, хотели бы взять на себя больший контроль над своими местными делами."
 #
 ITA_industrial_regulations: "Промышленное регулирование"
 ITA_industrial_regulations_desc: "Несмотря на многочисленные шаги, предпринятые в целях улучшения прав итальянских рабочих, капиталистический класс по-прежнему осуществляет значительный контроль за их жизнью и безопасностью, и мы должны стремиться улучшить условия труда в Италии и ликвидировать тех капиталистов, которые стремятся играть в эту систему."
 #
 ITA_women_rights: "Расширение прав женщин"
 ITA_women_rights_desc: "Хотя женщины получили несколько прав после окончания Красного двухгодичного периода, таких, как право голоса, во многих сферах итальянского общества они по-прежнему рассматриваются как граждане второго класса, и мы должны принять законы, обеспечивающие женщинам защиту от такой дискриминации в государственном секторе."
 #
 ITA_minority_rights: "Гарантии прав меньшинств"
 ITA_minority_rights_desc: "Великая война присудила Италии значительную территорию через Адриатику и Балканы, многие немцы, словенцы, хорваты, сербы и албанцы в настоящее время живут в «The» [Королеве.Гетнаме], но, несмотря на то, что они являются гражданами, многие из них сталкиваются с дискриминацией и давлением со стороны своих итальянских соседей, если мы действительно хотим интегрировать эти общины, мы должны уважать их местные традиции и культуру."
 #
 ITA_liberal_reforms: "Либеральные реформы"
 ITA_liberal_reforms_desc: "В течение десятилетия протекционистская и государственная интервенционистская политика ИЦП затормозила экономический рост Италии."
 #
 ITA_industrial_subsidies: "Субсидии для промышленности"
 ITA_industrial_subsidies_desc: "Для содействия развитию итальянской промышленности, возможно, в наших наилучших интересах предложить субсидии потенциальным разработчикам."
 #
 ITA_free_trade_focus: "&quot; Тужься за свободную торговлю &quot;"
 ITA_free_trade_focus_desc: "В условиях все более нестабильной Европы торговля, как представляется, является единственным аспектом поддержания мира в странах."
 #
 ITA_conservative_coalition: "Консервативная коалиция"
 ITA_conservative_coalition_desc: "Подъём социализма и стагнация прогрессивных партий показали итальянцам, что они должны вернуться к политике, которая укрепляет традиционные ценности нашей нации."
 #
 ITA_regional_autonomy: "Региональная автономия"
 ITA_regional_autonomy_desc: "Такая разнообразная нация, как Италия, должна предоставить автономию исторически независимым регионам. Итальянец в Риме понятия не имеет о потребностях итальянца в Сицилии или Венеции."
 #
 ITA_dalmatia_migration: "Поощрять миграцию в Далматию"
 ITA_dalmatia_migration_desc: "Миллионы итальянцев погибли, чтобы вернуть нашу по праву территорию от Австрии и Венгрии, и весь потенциал этих территорий будет распространяться на нас до тех пор, пока местное население будет сопротивляться интеграции в итальянское общество, и давайте по-настоящему воспользуемся нашими победами и расширим итальянские поселения и культуру в регионе."
 #
 ITA_economic_protectionism: "Экономическая защита"
 ITA_economic_protectionism_desc: "Многие державы пытаются подорвать Италию, используя ее слабую экономику, мы должны защитить наш народ от этих враждебных держав, проводя протекционистскую политику, которая отвечает интересам итальянцев, а не англичан, французов и американцев."
 #
 ITA_help_pope: "Латеральные пакты о [появлении]"
 ITA_help_pope_desc: "С 1870 года римский вопрос находится в трудном положении в Италии и, возможно, в ее крупнейшей дипломатической подделке. В 1920 году попытки решить римский вопрос не увенчались успехом, поскольку левая опорная коалиция не смогла найти общий язык с Ватиканом. Если мы хотим обеспечить стабильность в Италии, мы должны прекратить наши боевые действия с Папой и, наконец, подписать Латеранские соглашения."
 #
 ITA_catholic_nation: "Католическая нация"
 ITA_catholic_nation_desc: "После падения Римской империи Итальянский полуостров был католиком, попытки светскости нашей нации лишь привели к разделению нашего народа и подрыву нашей культуры, пришло время пропагандировать католицизм как де-факто религию Италии."
 #
 ITA_cement_the_movement: "Поощрять движение"
 ITA_cement_the_movement_desc: "Союз между реакционными националистами и синдикалистами никогда не должен был длиться."
 #
 ITA_corporate_allies: "Корпоратизм"
 ITA_corporate_allies_desc: "Сильная нация требует явного сотрудничества между столицей и государством. &lt; &lt; капиталисты &gt; &gt; должны служить интересам нации и партии или быть заменены теми, кто захочет."
 #
 ITA_stregthen_king: "Укрепить короля"
 ITA_stregthen_king_desc: "На протяжении десятилетий социалистические и прогрессивные силы делают все, что в их силах, чтобы подорвать влияние [ITA.Get Header]. [ITA.Get Header] является символом величия Италии и должно получить больше влияния на правительство нашей нации. При его поддержке мы можем укрепить позицию Италии как одной из Великих держав."
 #
 ITA_dio_patria_famiglia: "Дио, Патриция и Фамилья"
 ITA_dio_patria_famiglia_desc: "\"God, Fatherland And Family\" are the core of the Italian's morals. With these values taken to heart we shall unify the people with the authority of the State."
 #
 ITA_planned_economy: "Социалистическая экономика"
 ITA_planned_economy_desc: "Итальянская социалистическая партия хочет расширить местные демократические коммуны, промышляя снизу вверх, в то время как итальянская Коммунистическая партия желает непосредственно управлять экономикой в целях быстрой индустриализации."
 #
 ITA_revolution_above: "Революция сверху"
 ITA_revolution_above_desc: "Революция должна возглавиться опытом партийных авангардов."democracy\" means nothing if the reactionary powers of world snuff our movement and force Italians back into the bondage of capitalism. What will help strengthen the state will ultimately be what's best for the workers."
 #
 ITA_disloyal_unions: "Разрушить разрозненные союзы"
 ITA_disloyal_unions_desc: "Несмотря на то, что большинство профсоюзов начали соответствовать партийной политике, некоторые по-прежнему сопротивляются централизации, мы должны ликвидировать эти мятежные союзы и заменить их руководителей теми, кто будет следовать политике Рима."
 #
 ITA_seize_privates: "Изъятие частной собственности"
 ITA_seize_privates_desc: "В то время как профсоюзы укрепляют свой контроль над местной экономикой, капиталисты по-прежнему владеют огромной частью итальянской промышленности."
 #
 ITA_modern_farms: "Государственные фермы"
 ITA_modern_farms_desc: "Для того, чтобы увеличить итальянское сельскохозяйственное производство, мы должны создать государственные фермы, находящиеся под непосредственным управлением Рима."
 #
 ITA_collectivised_industry: "Командная экономика"
 ITA_collectivised_industry_desc: "Теперь, когда большинство итальянской промышленности находится под контролем государства, у нас есть средства для реализации истинно командной экономики. Наконец, потребности всех итальянских рабочих могут быть надежно удовлетворены государством."
 #
 ITA_nationalization_decree: "Национализация на основании декрета"
 ITA_nationalization_decree_desc: "В такие хаотические времена крайне важно, чтобы государство полностью контролировало национальные ресурсы и промышленность."
 #
 ITA_rapid_industry: "Стремительная индустриализация"
 ITA_rapid_industry_desc: "Не секрет, что экономика Италии отстает от экономики Франции и Германии. Мы должны как можно скорее исправить этот дисбаланс, используя все необходимые средства. Следующая Великая война станет войной промышленности и ресурсов, и если мы не догоним соседей, мы не выживем."
 #
 ITA_secure_revolution: "Обеспечение революции"
 ITA_secure_revolution_desc: "Многие силы внутри Италии и за рубежом стремятся подорвать рабочих и Революцию, и мы должны убедиться, что рабочие готовы защищать Революцию, когда придет время."
 #
 ITA_military_expansion: "Военное расширение"
 ITA_military_expansion_desc: "Италия должна иметь промышленность, чтобы поддержать своих преданных солдат и ополченцев, когда придет время защитить нашу Революцию."
 #
 ITA_support_communes: "Поддержка общин"
 ITA_support_communes_desc: "Местные коммуны и кооперативы являются основой итальянского социалистического движения."
 #
 ITA_rural_south: "Социализм в мезоджиорно"
 ITA_rural_south_desc: "Южная Италия на протяжении многих лет находится под контролем корпоративистов, но сейчас, как никогда ранее, регион открыт для принятия общинной политики."
 #
 ITA_collective_farms: "Кооперативное земледелие"
 ITA_collective_farms_desc: "Крупные частные сельскохозяйственные конгломераты доминируют на юге Италии, мы должны демонтировать эти несправедливые институты и предоставить землю рабочим, которые фактически занимаются их фермерством."
 #
 ITA_agrarian_economy: "Аграрная экономика"
 ITA_agrarian_economy_desc: "Экономика Южной Италии затормозилась в результате десятилетий протекционистской политики, направленной исключительно на поддержку промышленной экономики Севера, мы должны принять сельскохозяйственное ядро Италии и положить конец этой пагубной экономической политике."
 #
 ITA_democratic_industry: "Демократизация промышленности"
 ITA_democratic_industry_desc: "Нация построена снизу вверх рабочими, но, несмотря на это, капиталистический класс на протяжении десятилетий пытается ограничить их права и свободы."
 #
 ITA_industrial_north: "Социализм в Севере"
 ITA_industrial_north_desc: "Итальянское социалистическое движение состоит из промышленных рабочих из северных регионов нашей страны, мы не можем позволить себе игнорировать этих работников, мы должны укреплять местные союзы и предоставлять работникам инструменты, профессиональную подготовку и поддержку, необходимые для того, чтобы взять на себя полный контроль над предприятиями и инфраструктурой регионов."
 #
 ITA_expand_universities: "Расширение университетов"
 ITA_expand_universities_desc: "В отличие от сельских районов на юге, экономика Северной Италии основана на квалифицированной рабочей силе, но многие квалифицированные рабочие не имеют средств для приобретения навыков, необходимых для этой экономики."
 #
 ITA_improve_railways: "Совершенствование железнодорожных линий"
 ITA_improve_railways_desc: "Экономика северной Италии зависит от хрупкой системы взаимосвязанной инфраструктуры. &quot; Принадлежности &quot; и &quot; Товары &quot; должны поступать именно тогда, когда это необходимо, и любое несоответствие может остановить функционирование этой системы. &quot; Совершенствование железнодорожных линий &quot; значительно уменьшит возможность того, что поставки не будут соответствовать графику промышленных перевозок."
 #
 ITA_economic_development: "Экономические реформы"
 ITA_economic_development_desc: "Из всех великих держав Италии известно, что среди них самая слабая и наименее развитая экономика, хотя 20-е годы были десятилетием устойчивого роста для нашей страны, Лондонский фондовый рынок показал, что наша страна нуждается в экономических реформах. Многие теории и аргументы были разработаны о том, как лучше всего улучшить экономику Италии, но до тех пор, пока одна партия не получит требуемую общественную и политическую поддержку, необходимую для их внедрения, на самом деле мало что будет сделано."
 #
 ITA_regulated_economy: "Регулируемая экономика"
 ITA_regulated_economy_desc: "Капитализм не совершенен, хотя он вознаграждает самых инновационных членов общества, он, как правило, мало помогает беднейшим и наиболее уязвимым. Государство должно делать все возможное для содействия экономическому росту, а также оказывать помощь и поддержку тем, кто может в этом нуждаться."
 #
 ITA_unemployed_benefits: "Пособия по безработице"
 ITA_unemployed_benefits_desc: "Так же, как и красный двухгодичный период роста безработицы в начале 20-х годов, вновь вызывает волнения по всей стране. Трудящиеся хотят обеспечить свои семьи, но если капиталистическая система не может обеспечить возможности самостоятельно, они будут искать более экстремальные решения. Мы должны обеспечить, чтобы даже в таких рецессиях, как этот, ни один итальянец не стал беден."
 #
 ITA_public_housing: "Фонд &lt; &lt; Государственное жилье &gt; &gt;"
 ITA_public_housing_desc: "С ростом численности населения Италии спрос на жилье никогда не был выше, но предложение не может поддерживаться. &lt; &lt; Жилье &gt; &gt; является основной необходимостью достойной жизни, и поэтому мы должны финансировать проекты строительства государственного жилья для тех, кто не в состоянии самостоятельно удовлетворить эту потребность."
 #
 ITA_compulsory_education: "Расширение обязательного образования"
 ITA_compulsory_education_desc: "В 1859 году"Legge Casati\" established the first education system for Italy. This law still stands today, only mandating education from ages 6 to 9. While many families do send their children to Secondary Schools after age 9 many poorer families choose instead to have their children work in the family trade to help make ends meet. Italy lags behind the other Great Power's when it comes to literacy rates. We must counter this by expanding Compulsory Education from age 9 to age 14."
 #
 ITA_iri_formula: "Возрождение ИРИ"
 ITA_iri_formula_desc: "Концепция, лежащая в основе"Istituto per la Ricostruzione Industriale\" has been floating around in some Socialist circles for years now as a way for the state to control Italian corporations. While we don't share the leftist desire to seize the means of production the IRI may still be useful in creating a mixed economy in which the state is given oversight to organize the economy in an efficient and conscientious manner while big business retains enough autonomy to innovate."
 #
 ITA_aid_faliures: "Недостающие корпорации"
 ITA_aid_faliures_desc: "Недавний экономический застой негативно сказался на итальянских корпорациях, многие из которых находятся на грани банкротства. Быстрый конец нескольких конгломератов одновременно угрожает свести экономику нашей страны в спираль смерти. Мы должны поддерживать эти неудачные компании посредством субсидий или помощи до тех пор, пока наша экономика не оправится."
 #
 ITA_nationalize_rails: "Расширить FFSS"
 ITA_nationalize_rails_desc: "Ferrovie dello Stato — государственная компания, созданная в 1905 году, чтобы помочь расширить железнодорожные сети Италии в то время, когда частные железнодорожные компании не в состоянии удовлетворить потребности нашей страны. В то время как FFSS изначально была успешной при выполнении своих обязанностей, Великая война нанесла большой ущерб его финансированию и разрушила большую часть инфраструктуры в Северной Италии. Если нация является организмом, то железные дороги являются венами, которые поддерживают его жизнь. Мы должны снова финансировать эту жизненно важную инфраструктуру."
 #
 ITA_subsidies_farms: "Субсидирование итальянских фермеров"
 ITA_subsidies_farms_desc: "Известно, что сельскохозяйственный рынок очень неустойчив: люди легко могут обанкротиться без какой-либо вины, мы должны защитить фермеров, которые являются основой общества, от такой жестокой судьбы."
 #
 ITA_support_arms: "Поддержка оружейной промышленности"
 ITA_support_arms_desc: "Для того чтобы Италия стала современной военной державой, мы должны поддерживать нашу оружейную промышленность."
 #
 ITA_nationalize_docks: "Национализация докьярдов"
 ITA_nationalize_docks_desc: "Итальянская верфь как военно-морская держава имеет ключевое значение для защиты ее интересов по всему Средиземному морю и всему миру, и с такой жизненно важной ролью в нашей национальной безопасности мы должны взять под непосредственный контроль эти объекты."
 #
 ITA_nationalize_steel: "Национализация сталелитейных заводов"
 ITA_nationalize_steel_desc: "Хотя в прошлом предпринимались усилия по расширению частных сталелитейных заводов, ясно, что государственные заводы являются более эффективными и лучше подходят для растущих потребностей такой страны, как Италия."
 #
 ITA_welfare_state: "Государство всеобщего благосостояния"
 ITA_welfare_state_desc: "Несмотря на то, что социалистические критики капитализма иногда не нужны, они не являются абсолютно бесполезными. Многие бедные итальянцы оказались в неблагоприятном положении в результате наихудших аспектов капитализма. Мы должны защитить наш народ от нищеты и лишений, независимо от того, какая идеология доминирует в Италии."
 #
 ITA_free_market: "Экономика свободных рынков"
 ITA_free_market_desc: "Десятилетия государственной собственности на многие ключевые отрасли Италии затормозили экономический рост."
 #
 ITA_capitalist_north: "Капитализм в северном регионе"
 ITA_capitalist_north_desc: "Несмотря на сильные социалистические и профсоюзные группировки в этом районе, существует потенциал для промышленного роста, в котором ведущую роль играет частная собственность, если мы будем добиваться этого."
 #
 ITA_create_austrada: "Приватизация Австрады"
 ITA_create_austrada_desc: ""Австрада" является государственной серией автомагистралей, соединяющих Северную и Южную Италию. "Расширение этой инфраструктуры в последние годы застопорилось из-за нехватки федеральных средств."
 #
 ITA_auto_industry: "Содействие развитию автомобильной промышленности Италии"
 ITA_auto_industry_desc: "Итальянские автомобили являются одними из самых уважаемых и востребованных во всем мире. Эта индустрия приносит огромный капитал в Италию и является ключом к нашему экономическому росту. Мы должны сделать все возможное для расширения этой отрасли."
 #
 ITA_expand_markets: "Расширение на новые рынки"
 ITA_expand_markets_desc: "По мере роста спроса на новые товары и услуги в Италии мы должны продолжать искать новые рынки для торговли."
 #
 ITA_expand_docks: "Расширить докьярды"
 ITA_expand_docks_desc: "Итальянское судоходство связывает ее с большей частью мировой торговли."
 #
 ITA_merchant_marines: "Итальянская торговая морская пехота"
 ITA_merchant_marines_desc: "Для защиты этой жизненно важной услуги мы должны создать итальянские торговые пехотинцы, чтобы защитить наши грузовые и пассажирские суда от любой угрозы."
 #
 ITA_lease_torres: "Аренда [768. Найти имя]"
 ITA_lease_torres_desc: "По мере того как мы ищем новые пути финансирования нашего экономического роста, мы должны быть открыты для любой идеи."
 #
 ITA_capitalist_south: "Капитализм в "Меззоджиорно""
 ITA_capitalist_south_desc: "В отличие от Севера, южная Италия не добилась значительного прогресса в деле индустриализации, несмотря на то, что в этом регионе имеется большой резерв рабочей силы, лишь немногие капиталисты хотят инвестировать, и мы должны сделать все возможное для того, чтобы принести в этот регион плоды индустриализации."
 #
 ITA_modern_agriculture: "Модернизация сельского хозяйства"
 ITA_modern_agriculture_desc: "Меззоджиорно является сельскохозяйственной зоной Италии с момента основания нашей страны, но в последние годы она упала в упадок. Сельскохозяйственные инновации во Франции и России, к сожалению, сделали итальянское зерно неконкурентоспособным на мировом рынке. Если мы не поможем нашим фермерам реализовать эти инновации, они никогда не будут соответствовать современным стандартам."
 #
 ITA_farming_grants: "Субсидии для фермеров"
 ITA_farming_grants_desc: "С учетом того, насколько неустойчивым является сельскохозяйственный рынок, немногие итальянцы осмеливаются войти в этот экономический сектор, а те, кто это делает, часто впадают в долги, пытаясь заработать себе на жизнь."
 #
 ITA_farming_auctions: "Пропаганда сельскохозяйственных благ"
 ITA_farming_auctions_desc: "Крупные фермерские конгломераты начали покупать семейные фермы в надежде на их модернизацию, принимая при этом на себя часть прибыли."
 #
 ITA_end_tariffs: "Конец тарифов"
 ITA_end_tariffs_desc: "В прошлом итальянские правительства пытались стимулировать местную промышленность путем создания тарифов, которые сделали бы более дорогостоящими покупку иностранных товаров. Это просто неэффективность рынка, которая только наносит вред трудолюбивым итальянцам. Мы должны положить конец этим институтам, если мы хотим добиться экономического роста."
 #
 ITA_resource_expansion: "Расширение ресурсов"
 ITA_resource_expansion_desc: "Италия является страной, богатой ресурсами, однако лишь немногие капиталисты потратили усилия, необходимые для ее использования. Мы должны содействовать расширению местных шахт и нефтеперерабатывающих заводов."
 #
 ITA_protectionism: "Экономическая защита"
 ITA_protectionism_desc: "Более сильная экономика Франции и Великобритании сделала все возможное, чтобы выйти из конкуренции с местной итальянской промышленностью."
 #
 ITA_gaurantee_grain: "Гарантийные цены на зерно"
 ITA_gaurantee_grain_desc: "Мы должны гарантировать цены на зерно, чтобы наши фермеры могли зарабатывать на жизнь, несмотря на международную конкуренцию."
 #
 ITA_sell_land: "Продавать колониальную землю итальянцам"
 ITA_sell_land_desc: "За последние 20 лет колониальная империя Италии быстро расширилась, но лишь немногие поселенцы воспользовались этим, и мы должны быстро продать колониальные земли итальянским поселенцам, с тем чтобы содействовать интеграции этих регионов и сбору средств для нашей нации."
 #
 ITA_increase_tariffs: "Повышение тарифов"
 ITA_increase_tariffs_desc: "Если мы хотим, чтобы капиталисты продолжали инвестировать в местную промышленность, мы должны субсидировать издержки путем повышения тарифов на иностранные товары."
 #
 ITA_buy_italian: "\"Buy Italian!\""
 ITA_buy_italian_desc: "Хотя тарифы являются хорошим способом стимулирования итальянского бизнеса, многие все еще будут искать французские или британские товары, несмотря на их более высокие цены."Buying Italian\" should be seen as almost a civic duty and bring pride to the hearts of all our citizens."
 #
 ITA_government_austerity: "Государственные расходы &lt; &lt; Куртайт &gt; &gt;"
 ITA_government_austerity_desc: "Чрезмерные правительственные расходы привели к тому, что итальянский долг разорвётся, и мы должны сократить расходы, пока наши долги не стали слишком большими, чтобы справиться с ними."
 #
 ITA_docking_fees: "Сборы за допинг"
 ITA_docking_fees_desc: "Чтобы помочь привлечь иностранный капитал в Италию, было предложено ввести стыковочные сборы для любого иностранного судна, которое причаливает в нашей стране."
 #
 ITA_war_for_italy: "Итальянская экономическая война"
 ITA_war_for_italy_desc: "Экономика Италии значительно отстает от всех других Великих держав, но мало что сделано для исправления этого положения. Мы должны относиться к этой ситуации как к великой кампании, в которой мы в настоящее время проигрываем нашим врагам. Многие экономические битвы все еще предстоит вести, и вопрос о том, победим ли мы в этой войне, будет зависеть от решимости наших итальянских граждан."
 #
 ITA_battle_grain: "Битва за зерно"
 ITA_battle_grain_desc: "Италия полностью зависит от своих соседей в том, что касается удовлетворения ее сельскохозяйственных потребностей, что неприемлемо для такой великой державы, как мы, мы должны неустанно работать над тем, чтобы увеличить объем отечественного сельскохозяйственного производства и положить конец нашей зависимости от иностранных пожертвований."
 #
 ITA_battle_lira: "Битва за Лиру"
 ITA_battle_lira_desc: "В последние годы стоимость лиры снизилась, а инфляция продолжает расти беспрепятственно."
 #
 ITA_battle_land: "Битва за землю"
 ITA_battle_land_desc: "Италия является густонаселенной страной, которая почти переполнена людьми, несмотря на это и тот факт, что в нашей стране имеется огромное количество нетронутых земель, мало что сделано для их использования, мы должны очистить понтинские болота и принести тысячи гектаров плодородных земель в надлежащее сельское хозяйство."
 #
 ITA_battle_births: "Битва за рождения"
 ITA_battle_births_desc: "Темпы роста населения Италии по сравнению с большей частью Европы стабилизировались, и если мы хотим занять свое положение как Великая держава, мы должны иметь резерв рабочей силы, чтобы поддержать его, мы должны предложить налоговые льготы парам, которые воспитывают многодетные семьи и наказывают холостяков и других людей, которые предпочитают быть менее продуктивными."
 #
 ITA_national_autarky: "Национальный автарки"
 ITA_national_autarky_desc: "В войне было много тяжелых сражений, чтобы установить экономическое господство Италии, но когда пыль оседает на пресловутых полях сражений, кажется, что Италия идет к победе в конфликте. Наша экономика стала свидетелем быстрого роста, подобного которому никогда не было. Скоро наша нация будет полностью самодостаточена."
 #
 ITA_reforming_the_charter: "Реформа Хартии Карнаро"
 ITA_reforming_the_charter_desc: "Пришло время реформировать Хартию Карнаро."
 #
 ITA_elitest_council: "Элитист Провизори"
 ITA_elitest_council_desc: "В то время как сенаторы избираются самими людьми, 60 Проввизори избираются членами 10 корпораций, хотя, на первый взгляд, это представляется вполне удовлетворительным, распределение этих делегатов является весьма спорным; очевидно, что наиболее успешные члены общества, работодатели, технические работники и государственные служащие должны получить большинство делегатов."
 #
 ITA_peasent_council: "Провизори более общего профиля"
 ITA_peasent_council_desc: "В то время как сенаторы избираются самими людьми, 60 Проввизори избираются членами 10 корпораций, хотя, на первый взгляд, распределение этих делегатов является весьма спорным, очевидно, сердце итальянского общества, рабочие, фермеры и преподаватели должны получить большинство делегатов."
 #
 ITA_centralized_army: "Централизованные вооруженные силы"
 ITA_centralized_army_desc: "Чтобы Республика выжила, мы должны централизовать наши силы."
 #
 ITA_communal_army: "Коммунальные вооруженные силы"
 ITA_communal_army_desc: "Лучшим способом для достижения успеха миллиардом было бы децентрализация общинных вооруженных сил."
 #
 ITA_promote_industry: "Пропаганда промышленников"
 ITA_promote_industry_desc: "Мы должны поддерживать промышленность, и наилучшим способом для этого должно быть поощрение промышленников."
 #
 ITA_promote_artists: "Поощрять художников"
 ITA_promote_artists_desc: "Искусство делает нашу нацию великой, государство должно поддерживать людей такими высокими."
 #
 ITA_strong_commandant: "Укрепить коменданта"
 ITA_strong_commandant_desc: "Без сильного лидера мы разделены и слабы."
 #
 ITA_weak_commandant: "Укрепление парламента"
 ITA_weak_commandant_desc: "Если мы позволим Командующему захватить слишком много власти, мы потеряем наши ценности."
 #
 ITA_solidifying_canaro: "Укрепление Устава"
 ITA_solidifying_canaro_desc: "Пришло время укрепить устав."
 #
 ITA_forein_policy: "Итальянская внешняя политика"
 ITA_forein_policy_desc: "Мир меняется, и Италия должна измениться вместе с ним."
 #
 ITA_france_conference: "Территориальная конференция с участием Франции"
 ITA_france_conference_desc: "Настало время наконец обсудить наши территориальные разногласия с французами."
 #
 ITA_france_exercise: "Военные учения с Францией"
 ITA_france_exercise_desc: "Поскольку наши переговоры с французами увенчались успехом, настало время провести миллиарные учения с французами."
 #
 ITA_france_revisionism: "Территориальный ревизионизм"
 ITA_france_revisionism_desc: "Французы дураки, у нас нет на них времени, Италия будет стоять без них."
 #
 ITA_italians_in_france: "Поддержка итальянского меньшинства во Франции"
 ITA_italians_in_france_desc: "Итальянские меньшинства во Франции должны иметь большую автономию."
 #
 ITA_take_french_colonies: "Антифранцузская оборона в Африке"
 ITA_take_french_colonies_desc: "Настало время подготовиться к худшему, мы должны обеспечить наше присутствие в Африке."
 #
 ITA_challenge_britain: "Вызов Лев"
 ITA_challenge_britain_desc: "Британцы думают, что они правят морями, наше время пришло, чтобы занять наше место на солнце."
 #
 ITA_anti_british_navy: "Антибританские военно-морские учения"
 ITA_anti_british_navy_desc: "Мы должны послать наш флот, чтобы начать подготовку к возможному конфликту с англичанами, а также немного итальянских мышц."
 #
 ITA_demand_malta: "Претензии по Мальте"
 ITA_demand_malta_desc: ""
 #
 ITA_indepdence_for_east_africa: "Независимость для Восточной Африки"
 ITA_indepdence_for_east_africa_desc: ""
 #
 ITA_mediterranean_concessions: "&lt; &lt; Притязать на Британское Средиземное море &gt; &gt;"
 ITA_mediterranean_concessions_desc: "Мы должны гарантировать средиземноморским государствам неуязвимость и скрытность от британцев."
 #
 ITA_british_africa: "Антибританская оборона в Африке"
 ITA_british_africa_desc: "Настало время подготовиться к худшему, мы должны обеспечить наше присутствие в Африке от британцев."
 #
 ITA_ally_britain: "Дружба с Великобританией"
 ITA_ally_britain_desc: "Британцы могут быть полезными союзниками, особенно в будущем конфликте с французами..."
 #
 ITA_britain_exercise: "Военные учения с Великобританией"
 ITA_britain_exercise_desc: "Давайте оживим наши отношения с англичанами, проводя с ними военные учения."
 #
 ITA_balkan_focus: "Итальянское доминирование на Балканах"
 ITA_balkan_focus_desc: "Место Италии на Балканах не может быть оспорено."
 #
 ITA_undermine_serbia: "Подминирование Сербии"
 ITA_undermine_serbia_desc: "Мы должны начать подрывать сербское государство, использовать этническую и религиозную напряженность в Хорватии в качестве нашего Касуса Белли против Белграда, международное сообщество будет рассматривать Италию в качестве освободителей оппозиционного хорватского народа, даже самые пацифистские католики в Риме будут закрывать глаза на то, как мы быстро смиримся с растущим сербским и ортодоксальным влиянием на Балканах."
 #
 ITA_albanian_claims: "Выдвинуть албанские претензии"
 ITA_albanian_claims_desc: "Этнические албанские земли Шкодера и Косово были предоставлены Сербии после Великой войны, хотя Италия однажды согласилась на эту демаркацию границы в прошлом под давлением Франции, ясно, что французы больше не будут препятствием, когда они переключятся на Германию, без французской помощи у сербов будет мало вариантов противодействовать нашему территориальному ультиматуму."
 #
 ITA_croation_terrorists: "Поддержка антисербских мятежников"
 ITA_croation_terrorists_desc: "Кротатианские повстанцы демонстрируют некоторые обещания, мы должны рассмотреть возможность их поддержки."
 #
 ITA_dissolve_serbia: "Разрушить Сербию"
