 ITA_socialist_march_rome: "Март в парламенте" 
 ITA_socialist_march_rome_desc: "Чтобы укрепить наше движение, мы должны взять на себя эффективный контроль над итальянским правительством. Но для того, чтобы наши требования были услышаны, мы должны получить поддержку народа. Поддержка региональных союзов и военизированных формирований должна предоставить нам необходимую политическую власть. § §Yeeture социалистическая поддержка: §! §R[?ITA.socialist_control]§!"

