 SRI_michele_bianchi: "Мишель Бьянчи"
 #SRI_michele_bianchi_leader_desc: "И все же, как представляется, этот день сияет на долгом следующем и подчиненном Микеле Бьянчи, который стал Италией, новым председателем после несчастливой кончины Бенито Муссолини, погибшей во время авиакатастрофы. Целостный лев, возможно, слишком громко рыкнул: Италия все еще рычит от Муссолини, якобы завершившейся культурной революцией. Но в один день его изгоняют другие, и теперь новая глава итальянской истории проходит под эгидой Мишеля Бьянчи. Несмотря на то, что новый председатель имел скромное происхождение из Калабрии, и ему повезло, что он может учиться в Риме. Итальянская социалистическая партия издательство и лидер в столице, его разногласия с руководством PSI сделали его изгой. Велкриг еще больше отделил его от основной части: его поддержка войны и его служба в качестве пехотника сделали его одним из тех, кто живет в левом месте, но в районе растущего Союза, не является синдианцем, ассистинистом."

