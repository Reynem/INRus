 ### Generals ###
 ITA_Rodolfo_Graziani_desc: "В 1903 году он присоединился к &quot; Реджио эсерсио &quot; (Королевской армии) и вскоре был размещен в итальянской Эритрее. Его первый вкус успеха появился во время Итало-турецкой войны, где он был повышен до капитана. Он продолжал командовать войсками во время Великой войны, где его усилия привели к тому, что он стал самым молодым полковником в итальянской армии. После победы Италии против центральных держав в 1919 году Грациани стал оказывать большое влияние на дела вновь приобретенных итальянскими войсками. Он стал знаменитым своим желанием использовать любые средства, необходимые для утверждения итальянского господства над местным населением. С помощью местных греков и в Панфилии Грациани руководил жестоким подавлением турок в регионе, обвиненных в поддержке турецкого национального движения. В итальянском Камеруне он победил короткоживое партизанское движение, вынудив большое число гражданского населения в концентрационные лагеря и сжегая тысячи квадратных миль джунглей в этом процессе. В Италии его видели как великого греков и в Панфилииа, но те, кто был хитренантом, считают, что он является хи-нацманцем."

