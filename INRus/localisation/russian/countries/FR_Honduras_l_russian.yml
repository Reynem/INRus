 #### Events ####

 #Honduras

 honduras.1.t: "Кубок Макиды"
 honduras.1.d: "Рано утром, еще до того, как солнце полностью сломилось над горизонтом, в дом президента Висенте Мехии Колиндрес вошло несколько человек. Оружие в боевой готовности. Президент вел хорошо, но с недавними выборами народ хотел большего изменения. Чтобы осуществить это изменение и ответить на призыв вокса-попули, Социалистический альянс, в состав которого входят многие никарагуанские экспатрианты, захватит власть. n Колиндрес согласился официально уйти до его ареста, чтобы держать его под замком вместе с остальными руководителями Либеральной партии до тех пор, пока не укрепится контроль над социалистами. Сегодня наступил новый рассвет для нации Гондураса, более чем один раз."
 honduras.1.a: "Народ выразил свою волю."
 honduras.2.t: "Вступление в Великую Республику"
 honduras.2.d: "С момента переворота против президента Колиндра прошло больше месяца. В большинстве случаев безкровный хаос был незначительным среди населения. Сторонники Либеральной партии либо молчали, либо оставляли свое дело, либо были арестованы в ходе первых протестов. Эти протестующие либо предстали перед судом, если они были агрессивными, либо вышли на свободу. . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . ."
 honduras.2.a: "Эль Пуэбло Унидо, Джамас Сера Венсидо!"
 honduras.2.b: "Мы присоединимся... как только они пойдут по правильному пути."
