 #### Events ####

 #SecularDebate

 seculardebate.1.t: "Правительство решает вопросы, связанные с секулярной дискуссией"
 seculardebate.1.d: "В связи с предстоящими выборами в Сальвадоре возникли серьезные споры по вопросу о секуляризации, в то время как некоторые, особенно те, кто имеет корпоративные интересы, хотят ослабить власть Церкви, другие считают, что это противоречило бы основополагающим ценностям страны; кроме того, существует уверенность в том, что светские организации, такие, как Объединенная компания по производству фруктов, будут становиться еще более сильными, слишком сильными, поскольку они заполняют вакуум власти; мы должны стремиться урегулировать дебаты, насколько это возможно, в предстоящие месяцы, иначе этот вопрос потребует радикальных решений."
 seculardebate.1.a: "Дебаты начинаются..."
 seculardebate.2.t: "Секулярные дебаты: Церковь слишком могущественна?"
 seculardebate.2.d: "В сельской местности нашей страны католическая церковь обладает огромной властью: те, кто противостоит убеждениям своих местных священников, редко достигают даже небольшой власти, и на национальном уровне богатство и влияние церкви является определяющим фактором для многих законопроектов и политики. Хотя в последние годы это влияние ослабевает, мало кто будет принимать какие-либо меры, которые священник запретил бы, даже если бы это было на благо нации. Некоторые спрашивают, слишком ли это много власти? Может ли Сальвадор быть правильной, равноправной республикой с духовенством, обладающим таким влиянием? Но, конечно, есть только одна группа, которая могла бы успешно оттолкнуть влияние Церкви: Объединенная Фруктовая компания."
 seculardebate.2.a: "Должна быть четкая грань между церковью и государством любым способом!"
 seculardebate.2.b: "Мы всегда будем набожной страной, а не корпоративной марионеткой!"
 seculardebate.3.t: ""Секулярные дебаты": "Компания слишком могущественна"?"
 seculardebate.3.d: "С тех пор, как американцы восстановили себя на всем континенте, компания «Юнайтед фруктов» стала все более мощной призраком во всех странах Центральной Америки. Затем, когда США возобновили политику так называемого «угроза доверия», компания сосредоточила свои силы в Центральной Америке. Но в нескольких странах и в Гватемале революция привела к тому, что компания сосредоточилась здесь, в Сальвадоре. Они сделали крепость, чтобы скрыться от доверия правительства США через свои детские компании. Тропическая радио- и телеграфная компания контролирует нашу коммуникационную инфраструктуру, Тропическая строительная служба поддерживает наши дороги, White Fleet Booards поставляет наши военные средства, и UF-Socony Объединённое предприятие подпитывает наши корабли и электричество. Все последние президенты должны были платить им липовые услуги и заключать залы для обеспечения своих собственных выборов. Нет необходимости говорить, что некоторые хотят нарушить этот корпоративный контроль. Поскольку у нас нет от них автономии правительства, кажется, что Католическая церковь должна работать над ослаблением ухвата UFCO."
 seculardebate.3.a: "Их закрепление означает, что когда они приносят пользу, мы получаем выгоду."
 seculardebate.3.b: "Что бы сделал Иисус?"
 seculardebate.4.t: "Секулярные дебаты: пустой участок"
 seculardebate.4.d: "Недавний спор вызвал протест в Сан-Сальвадоре. Пустой участок находится у источника. Много лет назад этот участок был когда-то местным магазином, который был куплен и разрушен УФКО. Строительство нового магазина одежды так и не было полностью одобрено, и партия была потеряна в море бумажной работы, нетронутой. Местные жители района начали использовать его в качестве места для встреч, и это стало местом, где местные священники проводили открытые проповеди, поскольку у ближайшей церкви не было необходимых возможностей. УФКО вновь обнаружила эту партию, и пришла найти прихожан, которые поместили ручные куски и целлюлозу. После того, как корпоративные головорезы очистили этих верующих, ситуация только ухудшилась. Некоторые считают, что эту кучу следует использовать как желание общины, учитывая ее отказ, но другие утверждают, что она была частной собственностью, и что единственная причина, по которой этот вопрос обсуждается, заключается в том, что Церковь сейчас вовлечена в это дело."
 seculardebate.4.a: "Нравится тебе это или нет, но это была земля, которую Церковь не может просто занять."
 seculardebate.4.b: "После стольких лет все принадлежит обществу, а не компании."
 seculardebate.5.t: "Секулярные дебаты: выходной"
 seculardebate.5.d: "Еще один скандал - это раскачивает нашу маленькую страну. Служба тропического строительства всегда привлекала как местных, так и иностранных рабочих для осуществления своих проектов. Недавно в крупном петиции и угроза забастовки со стороны христианских рабочих разрешили предоставить выходные дни. В стремлении возместить убытки компания поощряла еврейских работников к тому, чтобы они заполнили этот день более высокими оплачиваемыми часами. Однако у этих рабочих были свои собственные требования о том, чтобы им разрешили отправиться в субботу. В связи с этим мусульманские работники, недавний приток после того, как УФКО создал аванпост в Феникии, попросили отправиться в пятницу после полудня на молитву юмуа, в обмен на то, что они могут работать как по субботам, так и по воскресеньям с нормальной оплатой. Компания согласилась потребовать оба требования, как только стало ясно, что они не увидят значительных потерь в средствах, но и значительного выигрыша в моральном духе работников. Однако Католическая церковь возмущается тем, что она называет молитвой юмуа."empowering of heathens" by the company, and has called a strike in protest. The company now seeks government intervention."
 seculardebate.5.a: "Компания была честной."
 seculardebate.5.b: "Церковь права, это опасный плюралистический прецедент."
 seculardebate.6.t: "Секулярные дебаты: United Fruit v. Acosta"
 seculardebate.6.d: "Бывший предприниматель и продавец Эмилио Джастиниано Акоста Вергара был привлечен к ответственности по ряду долгов компании Юнайтед фруктовая текстильная и швейная компания , а также компании Тропическая радио- и телеграфная компания и даже компании Белый флот . Несколько лет назад, в ходе длинной, сложной серии событий, Акоста создал множество предприятий, взяв деньги из различных источников, причем наиболее известными были эти детские компании UFCO. Доверительный человек обманул их и пытался использовать обещания о большой прибыли от первоначальных инвестиций в различные мошеннические идеи и предприятия. Использование денег других инвесторов в качестве доказательства возврата, он накопил и потратил значительную часть денег, прежде чем был обнаружен несколько месяцев назад. Ако , и , он , он собрал , он собрал"
 seculardebate.6.a: "Деньги были украдены, независимо от того, куда они пошли."
 seculardebate.6.b: "Он изменился, и теперь деньги принадлежат монастырю."
 seculardebate.7.t: "Секулярные дебаты: имплантация"
 seculardebate.7.d: "Несмотря на наши усилия, секулярные дебаты продолжаются, возможно, даже хуже, чем раньше, когда внимание было уделено нескольким крупным событиям. Обе стороны имеют свои точки зрения, и никто не уверен, что кто-то действительно доминирует, особенно потому, что многие члены Национально-демократической партии заявляют о нейтралитете в этом вопросе."
 seculardebate.7.a: "За опросы!"

 #1937 Elections

 ELS_election.1.t: "Выборы 1937 года: Ситуация"
 ELS_election.1.d: "После прихода к власти президента Карлоса Мелендеса Рамиреса, как Соединенные Штаты, так и позднее Объединённая Фруктовая компания, управляла политической династией, переходя от одного утвержденного наследника к другому, и с течением времени богатая элита, владеющая землей, потеряла власть либо Церкви, либо Компании, причем каждый президент в цепи поклонился одному или другому."
 ELS_election.1.a: "Пусть победит шафер?"
 ELS_election.2.t: "Выборы 1937 года: Кандидаты"
 ELS_election.2.d: "Без ясного наследника Национальная демократическая партия установила партнерские отношения с Партией процветания, почти открытой политической группой, поддерживаемой UFCO. Заменяя мертвого Руиса, они сейчас назвали загадочного Родольфо Дюка своим кандидатом. Богатый банкир когда-то был неизвестен, и мало кто до сих пор знает, как он выглядит, но партийная машина тяжело работает над тем, чтобы поставить свое имя в головы всех, и корпорации обеспечивают своим рабочим право голоса. ~ no not not not organization is agained by against annivities by радикально христианский и авторитарный фронт спасения, который открыто моделирует себя после валькистов в Германии. Их лидер, бывший генеральный и экстернатный оккультист Максималиано Эрнандес Мартинес, использовал хаос до назначения Дюка, чтобы активно продвигать себя, угонять радиоволны UFCO, чтобы дать длинные раны и скадрировать правительство. Его популярность растет каждый день, и его собственные люди, так называемые "добслуживатели" начали запугать всех других противников Дюка, чтобы поддержать его."
 ELS_election.2.a: "Теневые банкиры и религиозные фанатики."
 ELS_election.3.t: "Выборы 1937 года: речи"
 ELS_election.3.d: "Только через три месяца после выборов герцог и Эрнандес начали выступать с речами, а в случае герцога - с речами других. Все герцогиня начали с заявления о том, что, поскольку он занят разработкой политики и законодательства для улучшения положения нации, он потратил время на то, чтобы написать речь, но, к сожалению, не может дать ее самому себе, когда он работает. риторика герцога о процветании роста в значительной степени напоминает о большинстве лоббистов корпораций, но его идеи начали зажигать мысль: может ли Сальвадор использовать корпорации в своих интересах? В отличие от этого, Эрнандес взялся за саму волну, используя горячую риторику, которая восходит к большей части сельской местности и укрепляет религию. Он призывает Сальвадор занять свое место на солнце как сильная нация, чтобы быть духовным лидером Америки на пути Бога и правды."
 ELS_election.3.a: "У обоих есть сильные стороны..."
 ELS_election.4.t: "Выборы 1937 года: результаты"
 ELS_election.4.d: "Это была тяжелая гонка крайностей, без каких-либо ударов, когда плакаты и зрители Дюка встретили марши и радиостанции Эрнандеса. Есть небольшая середина, так как парфюмер захватил нацию, разделив семьи и общины, когда они выбрали свою сторону. Компания или церковь. Партия, или Фронт. Богатство, или Вера. События секулярных дебатов, несомненно, влияли на выборы, и теперь мы видим, какую судьбу выбрала нация. И цифры пришли. Победитель, и президент..."
 ELS_election.4.a: "Родольфо Дюк, мы все разбогатеем!"
 ELS_election.5.t: "Выборы 1937 года: результаты"
 ELS_election.5.d: "Это была тяжелая гонка крайностей, без каких-либо ударов, когда плакаты и зрители Дюка встретили марши и радиостанции Эрнандеса. Есть небольшая середина, так как парфюмер захватил нацию, разделив семьи и общины, когда они выбрали свою сторону. Компания или церковь. Партия, или Фронт. Богатство, или Вера. События секулярных дебатов, несомненно, влияли на выборы, и теперь мы видим, какую судьбу выбрала нация. И цифры пришли. Победитель, и президент..."
 ELS_election.5.a: "Максимилиано Эрнандес Мартинес!"
 ELS_election.6.t: "Запретная особняк"
 ELS_election.6.d: "По всей видимости, Родольфо Дюк, страдающий от довольно отвратительного кашельного кашля, написал свою речь о принятии, а другой прочитал ее вместо него. Для того чтобы подавить слухи о том, что его не существует, новый президент, тем не менее, поднял волну перед толпой за пределами президентского Великого особняка, роскошного дома, построенного вторым президентом Мелендесом. С тех пор было представлено новое законодательство, все написанное герцогом, и все это, очевидно, было направлено на увеличение симбиоза Объединенной Фруктовой компании и правительства Сальвадора."Presidential Notifications" being posted in town squares every so often, but the man is rarely seen, even by his own staff and cabinet, who deal through intermediaries. Only UFCO representatives are regularly allowed to see him, the doors of the President's office closed and locked once they enter, but the nation can at least be assured that he is at work fulfilling his promises."
 ELS_election.6.a: "Если он там, мы хотя бы знаем, что он что-то делает!"
 ELS_election.7.t: "Господь будет править"
 ELS_election.7.d: "Президент Эрнандес сделал шокирующее заявление: он не будет президентом; вместо этого он возьмет на себя новый пост государственного мандашера, который будет иметь почти все те же полномочия; но официальный глава государства и правитель народа не будет простым человеком; вместо этого будет Иисус Христос, наш Господь и Спаситель, Царь Царов, а теперь президент президент."
 ELS_election.7.a: "Абсолютно символический акт, конечно."
 ELS_election.7.b: "...и он будет царствовать вечно."
 ELS_election.8.t: "Корпоративный захват"
 ELS_election.8.d: "Месяц до президентства Родольфо Дюка, и многие из его"advisors" have begun to question of the illusion of a republic is truly needed. The people sided with Duke, believe in his policies, and it is no secret he is creating a corporatist state. Some argue that the farce should be ended, the company outright declare control of the country. These people are usually given hard glares until the stop talking."
 ELS_election.8.a: "Голосование доказывает, что они согласны с нами."
 ELS_election.8.b: "Но они правы!"

 #Crusaders & Mercenaris

 ELS_crusaders.1.t: "Инициатива в отношении крестоносцев"
 ELS_crusaders.1.d: "Наши добровольцы сыграли важную роль в обеспечении победы партии и силы нашего нового, славного государства. Теперь, когда мы укрепили власть более надежно, лидеры добровольческих подразделений попросили нас расширить их роль и использовать их для поддержки наших военных. С демонтажом большей части UFCO в нашей стране многие молодые, христианские мужчины не работают. Они могли бы служить нам как солдатам в нашем славном деле!"
 ELS_crusaders.1.a: "Мы должны подготовиться к нашему расширению."
 ELS_crusaders.2.t: "Крестоносцы готовы!"
 ELS_crusaders.2.d: "Потребовалось много месяцев для рекламы, вербовки, обучения и идеологии, но, наконец, мы превратили Крузадер-Доброволец в нужную военную силу. Мандат, который был определен ранее, наконец-то был выполнен, и пока требуется больше времени для подготовки планов боя и тренировочных учений, в Сальвадоре теперь есть армия, которая защищает ее."
 ELS_crusaders.2.a: "Увеличьте свои лезвия и приготовьте метафорические требуше!"
 ELS_crusaders.3.t: "Наш великий крестовый поход"
 ELS_crusaders.3.d: "Мы подготовили обширный боевой план, чтобы нанести удар по сердцевине коррупции, которая окружает нас. Гватемалы и Гондураса, пополняемые социалистическими еретиками и американскими бутликерами. Мы должны нанести удар, освободить богобоязненные народы на этой территории и приветствовать их в нашу славную и благословенную нацию. Мы готовы."
 ELS_crusaders.3.a: "Деус Вульт!"

 ELS_PMC.1.t: "Private Security Proposal
 ELS_PMC.1.d: "Теперь, когда контроль над Сальвадором как полностью корпоративным государством признан и укреплен, мы можем начать рассматривать вопрос о расширении влияния компании как в геополитическом, так и в экономическом плане."
 ELS_PMC.1.a: "Надеюсь, они не будут слишком дорогими..."
 ELS_PMC.2.t: "Контракты, подписанные ПМК"
 ELS_PMC.2.d: "После длительного процесса интервью, испытаний и демонстраций против местных мятежников мы наконец подписали контракты на создание армии частных охранных компаний."
 ELS_PMC.2.a: "Добро пожаловать в семью UFCO, господа!"
 ELS_PMC.3.t: "Национальные изъятия активов"
 ELS_PMC.3.d: "Деньги были переведены, наши войска знают стратегию наизусть, и мы установили контакт с кооперативами как в Гватемале, так и в Гондурасе, наши огромные плантации и фабрики, захваченные социалистическим правительством, снова станут нашими."
 ELS_PMC.3.a: "Это просто хороший бизнес."
