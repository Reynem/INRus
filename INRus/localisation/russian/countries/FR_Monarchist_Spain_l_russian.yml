### Events ###
monspain.0.t: "Королевство Испания"
monspain.0.d: "С тех пор, как земли Испании объединились, Испания всегда управлялась королем или королевой, сначала под австрийским домом Габсбурга, затем под домом Бурбона, но за последнее столетие власть Королевства и его институтов была поставлена под сомнение как республиканцами, так и националистами, а теперь и социалистами."
monspain.0.a: "Плюс Ультра!"

monspain.1.t: "Влияние и поддержка Великобритании"
monspain.1.d: "Мы надеемся, что мы сможем справиться с другими сторонами в этом конфликте в одиночку."
monspain.1.a: "Какая крошка."

monspain.2.t: "Добровольцы прибывают в Севилью"
monspain.2.d: "Добровольцы-промонархисты прибыли в нашу штаб-квартиру в Севилье, главным образом через Португалию и море."
monspain.2.a: "Мы благодарим их за поддержку."

monspain.3.t: "Мадрид под нашим контролем"
monspain.3.d: "Мадрид, столица Испании, попал под наш контроль."
monspain.3.a: "Да здравствует Царство!"

monspain.4.t: "Валенсия под нашим контролем"
monspain.4.d: "Нам удалось оттолкнуться на восток и захватить Валенсия. Это прекрасный город на побережье, который находится под социалистической оккупацией с начала войны. С возвращением этого города социалисты вскоре будут побеждены."
monspain.4.a: "Да здравствует Царство!"

monspain.5.t: "Барселона под нашим контролем"
monspain.5.d: "Нам удалось подтолкнуть северо-восток и захватить Барселону, это один из самых важных городов в Испании, центр социалистической революции."
monspain.5.a: "Да здравствует Царство!"

monspain.6.t: "Падение республиканцев!"
monspain.6.d: "Республиканцы и социалисты, наконец, побеждены, вместе с ними нам удалось победить силы, которые пытались создать антимонархические режимы, но пока это победа Испании, наша страна по-прежнему разделена, теперь между альфонсистами и националистами, вскоре вспыхнет конфликт."
monspain.6.a: "По крайней мере, есть два менее фейерверка."

monspain.7.t: "Конфликт с националистами"
monspain.7.d: "Соглашение о ненападении между нами и националистами было нарушено, новости о столкновениях на границе вновь начали конфликт, пришло время показать этим притворцам, которые являются истинным королем Испании."
monspain.7.a: "Да здравствует король!"

monspain.8.t: "Галиция под нашим контролем"
monspain.8.d: "Нам удалось оттолкнуть северо-западную часть страны и захватить Галицию, и этот регион стал местом национального восстания в ходе гражданской войны, и с учетом того, что этот район находится под контролем, мы можем сказать, что он добился успеха в обеспечении безопасности северных территорий Испании."
monspain.8.a: "Да здравствует Царство!"

monspain.9.t: "Гражданская война окончена!"
monspain.9.d: "Гражданская война в Испании закончилась, после вечных сражений монархисты вышли на вершину, хотя наш успех велик, после этой победы будут трудности."
monspain.9.a: "Испания снова Юнайтед!"

monspain.10.t: "Лондонский фондовый рынок поражает Севилью"
monspain.10.d: "Недавняя катастрофа на фондовом рынке в Лондоне пришла в Испанию, страна уже является плохой формой, когда речь идет о нашей экономике."
monspain.10.a: "Мы молимся, чтобы это не сокрушило Царство."

monspain.11.t: "Антиправительственные протесты"
monspain.11.d: "Многие люди начали обвинять короля и его правительство в их страданиях после Лондонского Крэша."
monspain.11.a: "Когда наступит мир, будет лучше."

monspain.12.t: "Лондонский фондовый рынок поражает Испанию"
monspain.12.d: "Недавняя катастрофа на фондовом рынке в Лондоне пришла в Испанию, страна уже является плохой формой, когда речь идет о нашей экономике."
monspain.12.a: "Мы молимся, чтобы это не разорвало Испанию"

monspain.13.t: "Борьба с остающейся оппозицией"
monspain.13.d: "В Испании по-прежнему сохраняется определенное противодействие, эти элементы неприемлемы в нашем Королевстве и должны быть приняты во внимание, но есть вопрос о том, как сильно мы будем действовать в отношении них, умеренные монархисты утверждают важность правосудия в таких случаях, в то время как более радикальные монархисты видят это как оправдание измене."
monspain.13.a: "Справедливость по-прежнему важна"
monspain.13.b: "По крайней мере, будьте жестоки к ним."
monspain.13.c: "Нет нужды в оправданиях, чтобы наказать их."

monspain.14.t: "Разрывы на оставшейся оппозиции"
monspain.14.d: "По мере того как продолжается подавление сохраняющейся оппозиции, наше правление наконец-то обеспечено."
monspain.14.a: "Справедливость служит"

monspain.15.t: "Наследие короля Альфонсо"
monspain.15.d: "Пока мы доверяем нашему монарху, королю Альфонсо XIIIу, мы должны по-прежнему критически относиться к тому, что пережила Испания, когда он был королем Испании."
monspain.15.a: "Мы не можем изменить плохие времена с новым монархом!"
monspain.15.b: "Новая эра заслуживает нового монарха!"

monspain.16.t: "Официальная отмена Альфонсо XIII"
monspain.16.d: "Теперь король Альфонсо XIII официально отрекся от престола Испании и намерен дать королевству возможность начать новую жизнь с нового короля, поскольку Альфонсо не был самым серьёзным в истории."
monspain.16.a: "Долгая жизнь Хайме III"

monspain.17.t: "Инфант Хайме отказывается от своего права на престол"
monspain.17.d: "Инфанте Хайме, наследный принц, только что отказался от своего права на испанский трон, хотя причины этого отказа неясны, некоторые люди догадываются, что он, возможно, сделал это, чтобы стать Карлистом-кандидатом на трон, чтобы прославить Карлистов."
monspain.17.a: "Хорошая вещь у короля есть еще один сын"

monspain.18.t: "Принц Альфонсо погиб в автокатастрофе"
monspain.18.d: "Старший сын короля Альфонсо XIII, Альфонсо, недавно погиб в автокатастрофе."
monspain.18.a: "Покойся с миром, принц Альфонсо"

monspain.19.t: "Смерть короля"
monspain.19.d: "28 февраля король Альфонсо XIII умер в королевском дворце Мадрида."
monspain.19.a: "Король мёртв! Да здравствует король!"

# Focus Tree Events #

monspain.100.t: "Кампания по набору кадров в монархистской Испании"
monspain.100.d: "Пропаганда вербовки на территориях, находящихся под нашим контролем, кажется, работает, и новые мужчины предлагают свои услуги силам Королевства Испания."
monspain.100.a: "Спасибо за ваше участие."

monspain.101.t: "Армия вновь сохранила верность"
monspain.101.d: "Полковники в армии, которые были даже немного антимонархистами, были либо арестованы, либо убиты, либо депортированы."
monspain.101.a: "Да здравствует Царство!"

monspain.102.t: "Первое постгражданское правительство"
monspain.102.d: "С завершением гражданской войны и почти полным восстановлением пришло время, чтобы король выбрал свое первое постгражданское военное правительство. За столом короля есть три возможных варианта. Несмотря на то, что Каталонская лига - это маловероятное решение, поскольку они являются националистами и продемократическими. Король боится, что они создадут новую республику. Но они также остаются верными королю и могут помочь освободить королевскую семью от авторитарного наследия. Есть также Испанская конфедерация автономных прав, или ЦЕДА. Это группа с сильным влиянием в нынешнем правительстве. Они консервативно и католично, и они проводят шествия, подобные валкистам в Германии. Хотя они являются авторитарными, среди них есть те, кто хочет сохранить какую-то форму демократии. Они, скорее всего, будут выбраны."
monspain.102.a: "Может быть, это и близко к самоубийству, но у каталанцев будет свой шанс."
monspain.102.b: "CEDA — союз правых, и нам нравится право."
monspain.102.c: "Мы хотим, чтобы те, кто самый преданный королевству,"

monspain.103.t: "Сделки с карликами-политиками"
monspain.103.d: "Были заключены новые соглашения с политиками Карлиста, и мы надеемся, что сможем добиться процветания Испании вместе."
monspain.103.a: "Мы все все еще монархики."

monspain.104.t: "Католическая поддержка"
monspain.104.d: "Нам удалось заручиться поддержкой великой и святой католической церкви."
monspain.104.a: "Спасибо, Верховный Понтиф."

monspain.105.t: "Король дистанцируется от авторитаризма"
monspain.105.d: "Теперь король официально отдалился от авторитаризма. В речи он сказал, что будущее Испании - это будущее демократического королевства."
monspain.105.a: "Это сработает!"

monspain.106.t: "Демократическое Королевство!"
monspain.106.d: "Демократия вернулась в королевство Испании. С этого момента Испания станет конституционной монархией в стиле Британской империи, Белигии или Швеции."
monspain.106.a: "Да здравствует король!"

monspain.107.t: "Всеобщие выборы в Испании"
monspain.107.d: "После восстановления парламентской монархии в Испании настало время для первых подлинных и демократических выборов после прихода к власти в 1920-х годах Примо де Ривера, с сокращением числа авторитарных партий и ростом либеральных партий, Реновасьон Эспаньола не имеет возможности получить достаточно мест для формирования правительства. С другой стороны, есть четыре партии, которые могут выиграть достаточно голосов, чтобы сформировать правительство."
monspain.107.a: "Либералы формируют правительство"
monspain.107.b: "Либеральные консерваторы формируют правительство"
monspain.107.c: "Региональная лига держит власть"
monspain.107.e: "КЕДА формирует правительство"

monspain.108.t: "Всеобщие выборы в Испании"
monspain.108.d: "Настало время вновь провести новые выборы в Испании, чтобы определить, кто возглавит Испанию в предстоящие годы."
monspain.108.a: "Либералы"
monspain.108.b: "Либеральные консерваторы"
monspain.108.c: "Регионисты"
monspain.108.e: "КЕДА"

monspain.150.t: "Королевство Испания хочет присоединиться к АПИ"
monspain.150.d: "Наши друзья-монархисты в Королевстве Испания сегодня окружили нас, чтобы просить о вступлении в Имперский альянс защиты, и с ними на нашей стороне наш союз защитит дополнительного союзника против Германии, Советского Союза и даже Франции."
monspain.150.a: "Их приветствуют!"
monspain.150.b: "Простите, но нет"

monspain.151.t: "Британцы принимают нас в АПИ"
monspain.151.d: "Британская империя ответила на нашу просьбу присоединиться к Альянсу Империи Защиты. К счастью, они приняли наше послание о присоединении к своему альянсу. С Империей как нашим союзником наше положение в мире будет укреплено. Вместе мы будем противостоять хаосу в мире, создаваемому такими державами, как Германия и Советский Союз."
monspain.151.a: "Испания и Великобритания будут сражаться вместе!"

monspain.152.t: "Британцы отвергают наше вступление в АПИ"
monspain.152.d: "Британская империя ответила на нашу просьбу присоединиться к Аллайенсу Императорской Защиты, но, к сожалению, они отклонили нашу просьбу о вступлении в союз, хотя этот отказ вызывает разочарование, тот факт, что они все еще считают нас законным правительством Испании, дает нам надежду, наше правительство будет считать это потерей для англичан."
monspain.152.a: "Это будет их убыток."

monspain.153.t: "Королевство Испания направляет поддержку"
monspain.153.d: "Королевство Испания признало нашу борьбу за традицию и монархию и направило нам свою поддержку, и мы, конечно же, ответим нашей благодарностью, с нашей окончательной победой над предателями мы увидим эру дружбы и братства между Испанией и Португалией."
monspain.153.a: "Благодаря нашим испанским друзьям!"

monspain.154.t: "Поездка в Лондон"
monspain.154.d: "Связи между двумя королевствами, Испанией и Великобританией, становятся все более прочными, поскольку обе страны имеют традицию монархии и морских империй, мы нашли много общего друг с другом."
monspain.154.a: "Выпьем за наших британских друзей"

monspain.155.t: "Испанские агенты и дипломаты"
monspain.155.d: "С приходом испанской монархии в качестве законного правительства Испании Испания стремится расширить сферу своего влияния здесь, на острове Куба, вернувшись после того, как американцы выгнали их почти полвека назад, хотя в наше руководство входят многие, кто скептически относится к этим испанским агентам и дипломатам, некоторые в нашем правительстве признают их как более дружелюбные и, возможно, более полезные лица, чем лица в Вашингтоне."
monspain.155.a: "Лучше их, чем Вашингтон"
monspain.155.b: "Куба не пожалеет их влияния"

monspain.156.t: "Наше влияние признается на Кубе"
monspain.156.d: "Но сейчас кубинцы, по всей видимости, согласились с нашей деятельностью на острове, и с нашим новым послом связались министры правительства Кубы, которые выразили сильное желание отказаться от влияния англоязычных американцев в Вашингтоне, и Куба станет началом чего-то нового."
monspain.156.a: "Со временем мы вернем Кубу"

monspain.157.t: "Кубинцы отвергают влияние Испании"
monspain.157.d: "Сегодня это было подтверждено отказом Кубы от действий наших агентов, а также довольно холодным приемом нашего нового посла, и, похоже, лидеры этого острова предпочли бы, чтобы их страна оставалась под англо-американским влиянием вместо того, чтобы позволить создать испаноязычную дружбу."
monspain.157.a: "Какая жалость..."

monspain.158.t: "Испанцы вернулись в Каракас?"
monspain.158.d: "С приходом испанской монархии в качестве законного правительства Испании в Каракасе появились агенты короля. На этот раз они явно пытаются распространить влияние Испании в Венесуэле. Некоторые в нашем правительстве утверждают, что это может означать, что Испания может стать потенциальным союзником против агрессии со стороны Бразилии, Колумбии или Соединенных Штатов. Другие считают это предательством против Эль-Либератадора и свободной Венесуэлы."
monspain.158.a: "До тех пор, пока мы сохраняем свою независимость"
monspain.158.b: "Боливар свернётся на своей могиле."

monspain.159.t: "Наше влияние принято в Каракасе"
monspain.159.d: "К счастью для нас, они допустили наше влияние в Каракасе, хотя наш посол был рад приветствовать нас там, венесуэльцы также ясно заявили, что они не заинтересованы в том, чтобы вновь стать испанской колонией, и заверили их в том, что мы вместе лишь в испанской дружбе."
monspain.159.a: "Вместе мы сильны!"

monspain.160.t: "Венесуэльцы отвергают влияние Испании"
monspain.160.d: "К сожалению, они отвергли наши попытки расширить наше влияние в Венесуэле, наш посол получил четкий сигнал о том, что венесуэльское правительство не заинтересовано в том, чтобы сблизиться с нами, очевидно, они больше заинтересованы в том, чтобы попасть под англо-американское влияние."
monspain.160.a: "Какая жалость..."

monspain.161.t: "Растет международное признание"
monspain.161.d: "В мире растет признание нашего режима, и хотя он все еще довольно низок, приятно знать, что есть те, кто знает, что мы истинное правительство Испании."
monspain.161.a: "Да здравствует Испания!"

monspain.162.d: "В мире растет признание нашего режима, и все больше людей, стран и организаций признают нашу легитимность, и это несколько облегчает ситуацию, и все же многие не признают подлинное правительство Испании."

monspain.163.d: "В мире растет признание нашего режима, хотя большинство иностранных государств признают нас, некоторые из них все еще нас не признают, по крайней мере, мы можем сказать, что большинство стран действительно видят в нас подлинное правительство Испании."

monspain.164.d: "Сейчас только те, кто решительно поддерживает другие группировки и решительно выступает против нас, не признают нас."

monspain.165.t: "Признание международной торговли"
monspain.165.d: "Есть страны, которые не признают нас в качестве подлинного и законного правительства Испании, но с ростом торговой торговли и экспорта мы видим, что страны, которые ранее держались подальше от нас, обращаются к нам как к новому торговому партнеру, что, по сути, укрепляет международное признание нас."
monspain.165.a: "С торговлей приходит рост"

### Focuses ###
SPM_loyalty_king_alfonso: "Верность королю Альфонсо"
SPM_loyalty_king_alfonso_desc: "Король Альфонсо XIII является истинным и законным королем Испании, и важно, чтобы наши люди были преданы своему королю и Испании."
SPM_organize_monarchist_forces: "Организовать монархистские силы"
SPM_organize_monarchist_forces_desc: "Наши силы должны быть хорошо организованы для того, чтобы у них был шанс противостоять нашим врагам."
SPM_fortify_seville: "Укрепить Севилью"
SPM_fortify_seville_desc: "Нам нужно обезопасить нашу штаб-квартиру в Андалузии и укрепить штаб-квартиру в Севилле."
SPM_all_kings_men: "Все люди короля"
SPM_all_kings_men_desc: ""
SPM_government_generals: "Правительство генералов"
SPM_government_generals_desc: ""
SPM_favour_conservative_allies: "Благодарные консервантские союзники"
SPM_favour_conservative_allies_desc: ""
SPM_seek_papal_recognition: "Ищите папского признания"
SPM_seek_papal_recognition_desc: ""
SPM_friends_in_london: "Друзья в Лондоне"
SPM_friends_in_london_desc: ""
SPM_appeal_to_democracies: "Призыв к демократии"
SPM_appeal_to_democracies_desc: ""
SPM_defence_of_andalusia: "Защита Андалусии"
SPM_defence_of_andalusia_desc: "Андалусия служит нашей родной базой против наших врагов, мы должны сделать все возможное, чтобы защитить ее, если мы хотим победить их."
SPM_recruitment_campaign: "Кампания по набору персонала"
SPM_recruitment_campaign_desc: "Важную роль в этом деле будет играть активизация усилий по набору персонала."
SPM_civil_war_offensive_planning: "Планирование наступательных действий в ходе гражданской войны"
SPM_civil_war_offensive_planning_desc: "Мы должны разработать новые планы, если мы не хотим, чтобы наши наступательные действия сильно истощили нашу рабочую силу."
SPM_provide_proper_army_transport: "Обеспечение надлежащего военного транспорта"
SPM_provide_proper_army_transport_desc: "Поскольку страна разделена, трудно обеспечить доставку товаров и оружия на фронт, и об этом необходимо позаботиться, если мы хотим, чтобы наши армии развивались должным образом."
SPM_military_armament: "Военное оружие"
SPM_military_armament_desc: "Мы должны вооружить наших военных до зубов, если хотим выжить против наших врагов."
SPM_fortify_eastern_andalucia: "Укрепить Восточную Андалуцию"
SPM_fortify_eastern_andalucia_desc: ""
SPM_bring_order_madrid: "Принести Орден в Мадрид"
SPM_bring_order_madrid_desc: ""
SPM_collaborate_with_conservative_catalans: "Сотрудничество с консервантами Каталонии"
SPM_collaborate_with_conservative_catalans_desc: ""
SPM_peace_upon_north: "Мир на севере"
SPM_peace_upon_north_desc: ""
SPR_spain_kingdom_again: "Испания, снова Царство"
SPR_spain_kingdom_again_desc: "Король и его последователи триумфальны! Мы изгнали республиканцев, социалистов и националистов с помощью нашей высшей тактики и руководства короля Альфонсо XIII. Под его правлением мы начнем восстановление Испании после катастрофической гражданской войны и вернем ее к власти в Европе."

SPM_royal_spanish_navy: "Королевский испанский флот"
SPM_royal_spanish_navy_desc: "Если мы хотим соревноваться с другими западными державами на мировой арене, одним из первых шагов, которые мы должны предпринять, является восстановление его прежней мощи."
SPM_expand_dockyards: "Расширить докьярды"
SPM_expand_dockyards_desc: "Расширение наших верфей крайне важно для строительства и причала большего числа кораблей."
SPM_assure_naval_merchant_ties: "Морские торговцы"
SPM_assure_naval_merchant_ties_desc: "Наши морские торговцы являются жизненно важным активом нашего флота."
SPM_modernize_destroyers: "Модернизация разрушителей"
SPM_modernize_destroyers_desc: "Модернизация наших эсминцев уже давно устарела и является важным аспектом совершенствования нашего флота."
SPM_rule_seas: "Повелевать морями"
SPM_rule_seas_desc: "У нашего флота должны быть средства и способность управлять морями с абсолютным превосходством."
SPM_hit_and_run: "Удар и беги"
SPM_hit_and_run_desc: "Наш флот не может править морями с превосходством, он должен полагаться на ударные нападения вместо того, чтобы нарушать вражеские линии."
SPM_new_spanish_flagships: "Новые испанские флаги"
SPM_new_spanish_flagships_desc: "Новые испанские флаги станут украшением нашего нового флота."
SPM_fund_submarine_research: "Фонд по исследованию подводных лодок"
SPM_fund_submarine_research_desc: "Подводные лодки будут одним из ключевых элементов нашего военно-морского фонда."
SPM_light_ship_models: "Модели легких судов"
SPM_light_ship_models_desc: "Для того чтобы усовершенствовать наш флот, мы должны сосредоточиться на совершенствовании наших легких судов."
SPM_heavier_cruiser_models: "Тяжелые круизные модели"
SPM_heavier_cruiser_models_desc: "Для того чтобы улучшить наш флот, мы должны сосредоточиться на совершенствовании наших тяжелых крейсеров."
SPM_invest_coast_guard: "Инвестировать в береговую охрану"
SPM_invest_coast_guard_desc: "Наша береговая охрана уже располагает инфраструктурой, необходимой для нашего великого флота."
SPM_spanish_naval_doctrines: "Испанские военно-морские доктрины"
SPM_spanish_naval_doctrines_desc: "Мы должны сосредоточиться на разработке доктрины, которой должны следовать наши военно-морские силы, с тем чтобы отделиться от остального мира и гарантировать победу."

SPM_royal_spanish_air_force: "Королевские испанские военно-воздушные силы"
SPM_royal_spanish_air_force_desc: "Испания должна иметь новые военно-воздушные силы, чтобы соответствовать своему новому правительству, мы должны немедленно начать инвестировать в воздушное превосходство над нашими соседями."
SPM_expand_sevilla_air_fields: "Расширить воздушное поле Севильи"
SPM_expand_sevilla_air_fields_desc: "Воздушные поля служат фундаментом для любых военно-воздушных сил."
SPM_interservice_cooperation: "Интерсервисное сотрудничество"
SPM_interservice_cooperation_desc: "Сотрудничество между ветвями нашей армии имеет важнейшее значение для создания действующих военно-воздушных сил."
SPM_invest_naval_fighters: "Инвестирование в военно-морских истребителей"
SPM_invest_naval_fighters_desc: "Военно-морские бойцы могут быть разницей между победой и поражением в открытом море."
SPM_invest_close_land_fighters: "Инвестируйте в скрытых борцов с землей"
SPM_invest_close_land_fighters_desc: "Близкие сухопутные борцы могут быть разницей между победой и поражением в крупных сражениях с землей."
SPM_modernize_old_planes: "Модернизация старых самолётов"
SPM_modernize_old_planes_desc: "Не все в наших новых военно-воздушных силах должно быть построено с нуля."
SPM_aggresive_air_force: "Агрессивные военно-воздушные силы"
SPM_aggresive_air_force_desc: "Наши военно-воздушные силы должны быть агрессивными в бою, особенно когда речь идет о разрушении инфраструктуры противника."
SPM_strategic_bomber_efforts: "Стратегические бомбардировщики"
SPM_strategic_bomber_efforts_desc: "Наши военно-воздушные силы должны содержать стратегических бомбардировщиков, предназначенных для уничтожения инфраструктуры противника и посевов хаоса среди своих рядов."
SPM_defensive_air_force: "Оборонительные военно-воздушные силы"
SPM_defensive_air_force_desc: "Наши военно-воздушные силы должны защищаться в бою, особенно когда речь идет о защите наших войск на местах."
SPM_interception_tactic_efforts: "Технологические усилия перехвата"
SPM_interception_tactic_efforts_desc: "Наши военно-воздушные силы должны уделять приоритетное внимание тактике перехвата, разработанной для уничтожения вражеских самолетов, прежде чем они смогут уничтожить наши наземные силы."
SPM_spanish_airial_doctrines: "Испанские авиационные доктрины"
SPM_spanish_airial_doctrines_desc: "Мы должны сосредоточиться на разработке доктрины, которой должны следовать наши военно-воздушные силы, с тем чтобы отделить себя от остального мира и гарантировать победу."

SPM_royal_spanish_army: "Королевская испанская армия"
SPM_royal_spanish_army_desc: "Наша новая страна нуждается в армии, чтобы сравняться с ней и сохранить ее в безопасности."
SPM_remove_outside_influences_army: "Удалить внешнее влияние из армии"
SPM_remove_outside_influences_army_desc: "Для того чтобы наша армия могла функционировать хорошо, она должна быть в первую очередь лояльной Испании, и мы должны работать над тем, чтобы исключить иностранное влияние из ее рядов, чтобы гарантировать ее верность."
SPM_basic_equipment_research: "Исследования в области основного оборудования"
SPM_basic_equipment_research_desc: "Несмотря на гражданскую войну, мы не можем допустить, чтобы наши военные технологии отставали от технологий наших соперников."
SPM_mobilize_spanish_army: "Мобилизовать испанскую армию"
SPM_mobilize_spanish_army_desc: "Испанская армия по-прежнему очень плохо организована, и важно, чтобы мы вели ее на полную мощность и набирали как можно больше людей, чтобы заполнить ее ряды."
SPM_invest_armour_research: "Инвестирование в исследования армора"
SPM_invest_armour_research_desc: "Хотя когда-то кавалерия могла быть ключом к победе в битвах, теперь победа заключается в танках и бронированных автомобилях."
SPM_let_fire_rain: "Пусть дождь будет огнём."
SPM_let_fire_rain_desc: "Артиллерия всегда была важным аспектом любой западной армии."
SPM_counter_air: "Противодействие воздуху"
SPM_counter_air_desc: "В других странах есть военно-воздушные силы, которые намного превосходят наши собственные."
SPM_planning_and_numbers: "Планирование и число"
SPM_planning_and_numbers_desc: "Для победы в битвах и войнах необходимо планирование, и выделение части нашего общего персонала на разработку планов боевых действий поможет нам в будущем."
SPM_new_general_staff: "Новый генеральный штаб"
SPM_new_general_staff_desc: "Старый генеральный штаб испанской армии был слабым, нескоординированным и неэффективным."
SPM_special_unit_efforts: "Специальные подразделения"
SPM_special_unit_efforts_desc: "Концентрация на специальных подразделениях — это хороший способ диверсифицировать нашу армию и обеспечить, чтобы мы могли справиться с любой ситуацией, которая нам не под силу."
SPM_support_brigades: "Вспомогательные бригады"
SPM_support_brigades_desc: "Бригады поддержки так же важны для нашей армии, как и боевые люди."
SPM_armada_of_tanks: "Арма танка"
SPM_armada_of_tanks_desc: "С учетом того, что сейчас западные армии имеют броню будущего, крайне важно, чтобы мы создали нашу собственную армаду танков, с тем чтобы мы не отставали от наших соседей."
SPM_mobile_artillary_efforts: "Мобильная артиллерия"
SPM_mobile_artillary_efforts_desc: "Артиллерия всегда была эффективной в борьбе с противостоящими армиями, но сделать ее мобильной является важным следующим шагом в достижении и превосхождении превосходства других европейских армий."
SPM_rifle_for_soldiers: "Винтовки для солдат"
SPM_rifle_for_soldiers_desc: "Мы должны производить винтовки массово, если хотим создать новую и развитую испанскую армию."
SPM_spanish_army_doctrines: "Доктрины испанской армии"
SPM_spanish_army_doctrines_desc: "Мы должны сосредоточиться на разработке доктрины, которой должна следовать наша армия, с тем чтобы отделить себя от остального мира и гарантировать победу."

SPM_economic_recovery: "Экономическое восстановление"
SPM_economic_recovery_desc: "Испанская экономика была разрушена, и в том же году нас поразила катастрофа на фондовом рынке и гражданская война."
SPM_sieze_unloyal_industries_assets: "Активы компании &quot; Seze Unloyal Industries &quot;"
SPM_sieze_unloyal_industries_assets_desc: "Как бы это ни было невероятно, многие отрасли в Испании по-прежнему преданы нашим врагам."
SPM_rebuilding_road_network: "Восстановление дорожной сети"
SPM_rebuilding_road_network_desc: "Возрождение этой инфраструктуры является первым шагом в восстановлении экономики нашей страны."
SPM_gradually_ending_austerity: "Постепенное прекращение жесткости"
SPM_gradually_ending_austerity_desc: "Мы не можем больше позволить себе сидеть и смотреть, как умирает наша экономика."
SPM_reopen_banks: "Вскрыть банки"
SPM_reopen_banks_desc: "Настало время вновь открыть многие банки, которые были закрыты в начале гражданской войны, сейчас, как никогда ранее."
SPM_higher_rations: "Увеличение объема продовольственных пайков"
SPM_higher_rations_desc: "Хотя продовольственные пайки были жизненно важной мерой, принятой в начале гражданской войны, мы должны увеличить объем выделяемых каждому человеку средств, с тем чтобы учесть, что наша экономика пострадала."
SPM_end_austerity_messures: "Меры экономии"
SPM_end_austerity_messures_desc: "Мы должны вернуться к вопросам нашей экономики, чтобы спасти ее."
SPM_invest_mineral_industry: "Инвестиции в горнодобывающую промышленность"
SPM_invest_mineral_industry_desc: "Добыча полезных ископаемых уже давно является достоянием Испании."
SPM_reopen_mineral_export: "Возобновить экспорт полезных ископаемых"
SPM_reopen_mineral_export_desc: "Экспорт наших полезных ископаемых в остальной мир гарантирует нам большую прибыль, и мы должны сделать это сейчас, пока не поздно спасти нашу экономику."

SPM_corporatist_reforms: "Корпоратистские реформы"
SPM_corporatist_reforms_desc: "Реформа корпоративного движения является важным первым шагом в реформировании нашей экономики в целом."
SPM_liberalized_economy: "Либерализованная экономика"
SPM_liberalized_economy_desc: "Либерализация нашей экономики необходима для ее улучшения, и это спасет нас от головной боли в будущем."
SPM_implement_state_corporatism: "Осуществлять государственную корпоративную деятельность"
SPM_implement_state_corporatism_desc: "Наилучший способ обеспечить реализацию нашего видения - это сделать это самостоятельно."
SPM_national_work_programs: "Национальные программы работы"
SPM_national_work_programs_desc: "Нет более быстрого способа вернуть наше население к работе, чем ввести национальные программы работы, чтобы ни один испанец не остался без работы."
SPM_royalist_weapon_industry: "&lt; &lt; Индастрис де Армас реалистас &gt; &gt;"
SPM_royalist_weapon_industry_desc: "Мы должны инвестировать в нашу оружейную промышленность по двум причинам: во-первых, чтобы улучшить экономику, и, во-вторых, чтобы обеспечить нашу будущую оборону."
SPM_strengthen_resource_industry: "Укрепление ресурсной промышленности"
SPM_strengthen_resource_industry_desc: "Экспорт ресурсов всегда был важной частью нашей экономики."
SPM_connect_country: "Соединить страну"
SPM_connect_country_desc: "Железнодорожные дороги и другие виды национальной инфраструктуры уже давно недостаточно развиты в Испании."
SPM_invite_british_investors: "Приглашать британских инвесторов"
SPM_invite_british_investors_desc: "Британцы были нашими союзниками на протяжении всей гражданской войны."
SPM_encourage_private_investors: "Поощрение частных инвесторов"
SPM_encourage_private_investors_desc: "Было бы лучше, если бы мы поощряли частные инвестиции в наши усилия по восстановлению нашей экономики, особенно для того, чтобы мы не оказались в долгах с другими странами."
SPM_rural_industrialization: "Индустриализация сельских районов"
SPM_rural_industrialization_desc: "Мы должны индустриализировать сельскую Испанию, а также городскую Испанию, если мы хотим иметь хоть какие-то надежды на улучшение положения в стране в целом."
SPM_subsidize_agriculture: "Субсидирование сельского хозяйства"
SPM_subsidize_agriculture_desc: "Мы должны субсидировать сельское хозяйство для обеспечения того, чтобы наши хлебные корзины никогда не были пустыми и чтобы этот сектор экономики не рухнул."
SPM_spanish_monarchist_economic_boom: "Испанский монархист, экономический бум"
SPM_spanish_monarchist_economic_boom_desc: "Мы добились успеха не только в восстановлении нашей экономики, но и в обеспечении ее процветания."

SPM_long_live_king: "Да здравствует король"
SPM_long_live_king_desc: "Мы одержали триумф после гражданской войны, королевство Испании твердо стоит!"
SPM_ban_socialist_militas: "&lt; &lt; Пан социалистический милитас &gt; &gt;"
SPM_ban_socialist_militas_desc: "Социалисты причинили больше вреда этой стране, чем пользы."
SPM_ban_communist_party: "Запрет Коммунистической партии"
SPM_ban_communist_party_desc: "Мы должны преодолеть разногласия, возникшие в результате гражданской войны, и создать страну для всех."
SPM_curtail_republicanism: "Кудрявый республиканец"
SPM_curtail_republicanism_desc: "Испанская Республика была ошибочным и неудачным экспериментом."
SPM_ban_republican_parties: "Запрет Республиканских партий"
SPM_ban_republican_parties_desc: "Запрещение прямого участия республиканских партий в политическом процессе в Испании является важным аспектом восстановления его величия."
SPM_ban_monarchist_militas: "Националист &lt; &lt; Милитас &gt; &gt;"
SPM_ban_monarchist_militas_desc: "Националисты предали нас в наш самый важный час."
SPM_ban_carlists: "Запретительные националистические партии"
SPM_ban_carlists_desc: "Чтобы избежать раскола, созданного националистами, мы должны запретить все националистические партии от нашей политической системы и поощрять создание единой, единой Испании."

SPM_pick_government: "Выбрать правительство"
SPM_pick_government_desc: "Пришло время выбрать, какое правительство возглавит «конституционные» аспекты конституционной монархии."

SPM_re_government: "Правительство ВЭ"
SPM_re_government_desc: "Король избрал Реновационную Эспаньолу для руководства новым правительством с его авторитарной и монархистской политикой."
SPM_deal_with_carlists: "Разберись с Карлистами"
SPM_deal_with_carlists_desc: "Карлистские притворцы слишком долго были на нашей стороне, мы должны иметь дело с ними и их симфатиками раз и навсегда."
SPM_attract_nationalist_voters: "Привлекательная националистическая поддержка"
SPM_attract_nationalist_voters_desc: "Националисты, предав нас, помогли нам в начале гражданской войны."
SPM_weaken_autonomist_power: "Ужасная автономистская сила"
SPM_weaken_autonomist_power_desc: "У таких регионов, как Каталония, нет собственного бизнеса, мы - одна Испания, и мы должны ослабить автономную силу, чтобы сделать это."
SPM_empower_king: "Дать власть королю"
SPM_empower_king_desc: "Король - глава, от которой исходит все правительство, и мы должны предоставить ему больше власти, чтобы он мог действовать так, как сочтет нужным, чтобы восстановить народ к его прежней славе."
SPM_alfonsist_youth: "Альфонсистская молодежь"
SPM_alfonsist_youth_desc: "Важно просвещать испанцев о величии короля с раннего возраста."
SPM_end_laicism: "Конец лайкизму"
SPM_end_laicism_desc: "Мы больше не можем допустить, чтобы наша политика определялась исключением католической церкви."
SPM_give_back_royal_properties: "Верните королевские владения"
SPM_give_back_royal_properties_desc: "Один из способов помочь народу Испании - восстановить имущество, которое мы конфисковали во время войны, это маленький жест, но может пройти долгий путь."
SPM_eradicate_republican_threat: "Ликвидация республиканской угрозы"
SPM_eradicate_republican_threat_desc: "Республиканцы были нашими величайшими врагами в гражданской войне. чтобы обеспечить безопасность нашей новой нации."
SPM_catholic_royal_education: "Католическое и королевское образование"
SPM_catholic_royal_education_desc: "Образование испанцев должно определяться двумя понятиями: религией и королем, чтобы создать правильную нацию."
SPM_para_rey_y_pais: "Пара Рей и Паис"
SPM_para_rey_y_pais_desc: "С этого момента испанский дух будет сильным и мужественным, и каждый поверит в царя и страну."

SPM_ceda_government: "Правительство КЕДА"
SPM_ceda_government_desc: "Испанская конфедерация автономных прав была избрана для формирования нового правительства страны наряду с политикой правого крыла."
SPM_unite_right: "Объедините правые"
SPM_unite_right_desc: "CEDA всегда был лидером правых, но некоторые внутренние фракции все еще существуют."
SPM_relegalize_nationalists: "Релегализация националистов"
SPM_relegalize_nationalists_desc: "Несмотря на то, что националисты были нашими врагами, они разделяют многие из наших идеологических целей, и мы не можем криминализировать их, когда они могут помочь нам достичь цели великого испанского Королевства."
SPM_jap_youth: "JAP Молодежь"
SPM_jap_youth_desc: "Важно просвещать испанцев о величии нации с раннего возраста."
SPM_illegalize_laicism: "Незаконное использование лайцизма"
SPM_illegalize_laicism_desc: "Мы больше не можем допустить, чтобы наша политика определялась исключением католической церкви."
SPM_reintroduce_catholic_education: "Восстановление католического образования"
SPM_reintroduce_catholic_education_desc: "Католическое образование всегда было неотъемлемой частью испанского наследия."
SPM_establish_personality_cult: "Создать культ личности"
SPM_establish_personality_cult_desc: "Важно, чтобы мы создали культ личности вокруг нашего движения и его лидеров, чтобы привлечь к себе все население и заручиться его поддержкой."
SPM_ceda_propaganda: "Пропаганда КЕДА"
SPM_ceda_propaganda_desc: "Пропаганда всегда была важной частью любого нового режима."
SPM_strengthen_local_churches: "Укрепление местных церквей"
SPM_strengthen_local_churches_desc: "Местные церкви всегда были одним из способов охвата населения в целом. Важно, чтобы мы укрепили их способности создавать связи с малыми городами, чтобы мы могли достичь их в дальнейшем."
SPM_guided_democracy: "Демократия"
SPM_guided_democracy_desc: "Демократия в какой-то степени восхитительна. Когда мы позволяем ей действовать, она создает такие вещи, как республиканцы, которые мы не можем иметь. Мы можем позволить демократии существовать в Испании, пока она управляется нашей рукой."
SPM_por_espana_y_la_civilizacion_cristiana: "Пор Эспанья и цивилизованный кристиан"
SPM_por_espana_y_la_civilizacion_cristiana_desc: "Чтобы восстановить душу испанской нации, мы должны также восстановить душу христианской цивилизации, только тогда наша миссия будет завершена, и наша страна велика."

SPM_catalan_league_government: "Правительство Каталонской лиги"
SPM_catalan_league_government_desc: "Каталонская лига была избрана для формирования нового правительства страны, а также их прорегионалистской и более либеральной политики."
SPM_league_for_all_spain: "Лига для всех Испании"
SPM_league_for_all_spain_desc: "Хотя региональные националистические усилия храбры, как главы нового правительства, мы должны стремиться к созданию Лиги для объединения всей Испании, а не только Каталонии."
SPM_christian_democratic_values: "Христианские демократические ценности"
SPM_christian_democratic_values_desc: "Когда мы переходим к восстановлению нашей нации и ее ценностей, важно уважать христианство, мы можем многому научиться из его учений, особенно когда речь идет о создании ограниченной демократии."
SPM_christian_education_reform: "Реформа христианского образования"
SPM_christian_education_reform_desc: "Христианское образование всегда было жизненно важной частью испанской культуры, но оно не должно быть единственным видом образования, которое мы предоставляем."
SPM_reassure_regional_autonomies: "Устойчивые региональные автономии"
SPM_reassure_regional_autonomies_desc: "Мы должны работать над тем, чтобы убедить региональные автономии в том, что они не будут уничтожены нашим правительством, они составляют основу этой нации, и мы не можем позволить себе потерять их поддержку."
SPM_repair_kings_image: "Починить образ короля"
SPM_repair_kings_image_desc: "Враждебный образ короля был запятнан нашими врагами во время гражданской войны. Важно восстановить его в умах испанского народа, чтобы они могли принять его снова."
SPM_constitutional_monarchy: "Конституционная монархия"
SPM_constitutional_monarchy_desc: "В то время как мы боролись за монархию, нет ничего плохого в том, чтобы ограничить власть монарха."
SPM_establish_regional_parliaments: "Создание региональных парламентов"
SPM_establish_regional_parliaments_desc: "Создание региональных парламентов является хорошим способом решения этих проблем без ущерба для национального правительства."
SPM_liberal_freedoms: "Либеральные свободы"
SPM_liberal_freedoms_desc: "Важно, чтобы мы гарантировали нашим гражданам свободу, чтобы создать подлинно либеральное и справедливое общество."
SPM_democratic_kingdom: "Демократическое Королевство"
SPM_democratic_kingdom_desc: "Королевство Испания было законным победителем гражданской войны, но это не значит, что оно не может аплодировать некоторым идеям республиканцев."
SPM_democracia_y_monarquia: "Демократия и Монаркия"
SPM_democracia_y_monarquia_desc: "Новая испанская нация будет определяться двумя факторами: демократией и монархией. Наша нация будет справедливой и сбалансированной, как и все должно быть, и это сделает ее великой."

