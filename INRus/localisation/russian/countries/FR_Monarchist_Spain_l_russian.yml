### National Spirits ###
SPM_internal_strifes_monarchist_movement_idea: "Внутренняя борьба в монархистском движении"
SPM_internal_strifes_monarchist_movement_idea_desc: "Наше движение монархистов является более разнообразным, чем можно подумать. С одной стороны, есть авторитарные люди, которые стремятся создать автократическую монархию, а с другой стороны, есть либералы и консерваторы, которые стремятся создать конституционную монархию, во многом по линии того, что управляло Испанией до прихода к власти Примо де Ривера."
SPM_organize_monarchist_forces_idea: "Внутренняя борьба в монархистском движении"
SPM_remove_outside_influences_army_idea: "Верность армии"
SPM_remove_outside_influences_army_idea_desc: "Армия предана королю и стране, а не какой-либо другой группе или человеку."

SPM_implement_state_corporatism_idea: "Государственная корпорация"
SPM_national_work_programs_idea: "Национальная программа работы"

SPM_deal_with_carlists_idea: "Националистическое влияние"
SPM_weaken_autonomist_power_idea: "Централизация власти"
SPM_empower_king_idea: "Королевские державы"
SPM_alfonsist_youth_idea: "Альфонсистская молодежь"
SPM_catholic_royal_education_idea: "Католическая и королевская нация"

SPM_jap_youth_idea: "JAP Молодежь &lt; &lt; Милитас &gt; &gt;"
