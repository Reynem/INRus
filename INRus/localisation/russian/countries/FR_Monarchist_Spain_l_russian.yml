### Others ###
SPM_FUHRERREICH_DESC: "С момента рождения испанской нации король или королева, королевство было институтом, обеспечившим Испании стабильность и порядок, до 1931 года, когда была создана нестабильная Вторая Испанская Республика. С тех пор было предпринято множество попыток отменить ее, но только в декабре 1935 года началась полномасштабная гражданская война. ~nnnmonarchists сейчас сплотились к нашему знаменателю, с тем чтобы восстановить старый институт монархии и сохранить Испанию великой."

SPM_government_picked_flag: "Монарх выбрал новое правительство после гражданской войны."
SPM_strengthen_british_ties_flag: "Твердые связи с Великобританией"

SPM_foreign_policy: "Внешняя политика Королевства Испания"
SPM_foreign_policy_desc: "С падением республиканского правительства в гражданской войне и подъемом §YKingdom Испании §!, страна, наконец, сможет вновь найти свое место в мире. Не все страны и правительства признают нас в качестве законного правительства Испании."

SPM_join_ipa: "Присоединиться к АПИ"
SPM_join_ipa_desc: "В ходе гражданской войны поддержка из Лондона была одной из причин, которые сдержали нашу волю и силу. Из брака между королём Альфонсо и королевой Викторией наши связи с Британской короной вполне ясны. Нам нужно отплатить за их помощь с этим предложением альянса."
SPM_support_monarchist_portugal: "Поддержка португальской монархии"
SPM_support_monarchist_portugal_desc: "Республиканцы в Португалии пытались свергнуть старую и уважаемую монархию и своего короля, хотя две монархии в Португалии и Испании не всегда видели друг друга, в эти времена кризиса короли должны стоять вместе."
SPM_strengthen_british_ties: "Укреплять британские тиши"
SPM_strengthen_british_ties_desc: ""
SPM_influence_latin_american_politics: "Влияние на латиноамериканскую политику"
SPM_influence_latin_american_politics_desc: ""
SPM_strike_home_republicanism: "Уничтожить дом республиканизма"
SPM_strike_home_republicanism_desc: ""

