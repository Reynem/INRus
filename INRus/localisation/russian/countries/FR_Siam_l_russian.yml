 SIA_karj_karjsongkhram_royal: "Луанг Карджсонхрам"
 #SIA_karj_karjsongkhram_commander_desc: "12 апреля 1890 года в принцессе Нахона Ламфунчаи, Месяц Файяпа, Королевство Сиам §Y Военная карьера: §L\nBorn как Тянь Кенградоминг, Кардж поступил в Королевскую школу кадетов Сиамской армии перед тем, как служить в армии Фаяпа со средними показателями."

