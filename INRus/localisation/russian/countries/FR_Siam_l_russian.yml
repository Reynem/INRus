 ### Traits ###
 SIA_iron_marshal_trait: "Маршал Железного поля"
 SIA_pho_khun_trait: "Сарит считал, что такой стиль правления лучше всего подходит его политическому вкусу."Patiwat\" (revolutionary) phase against the rising leftist tides.§!"
 SIA_under_pho_khun_trait: "Если король лично связан с приходом Сарита Танарата к власти, мы никогда не узнаем наверняка."
 SIA_prancing_knight_trait: "Прекрасный рыцарь просто не поднимается на верхнюю позицию без обмана и обмана - Фао не испытывает ни одного из них и готов подавить любую оппозицию, используя как обман, так и свои собственные сильно милитаризованные полицейские силы в буксировке.§!"

 SIA_four_musketeers: "Мушкетеры"
 SIA_four_musketeers_desc: "Этот офицер считается одним из современных сиамских генеральных штабов."backbone\". These \"Four Musketeer (+Plus One)\" commanders hold a considerable sway with the new generation of officers, and have studied the recent conflicts in great detail.§!"

