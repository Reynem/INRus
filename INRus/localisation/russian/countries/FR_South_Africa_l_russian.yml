 #### Tooltips ####
 SAF_ANCWin_tooltip: "§G Коалиция АНК выиграла выборы, что во многом соответствует гневу националистов. §!"
 SAF_UnitedWin_tooltip: "§G Объединенная партия сохранила свое большинство в Палате собрания."
 SAF_PNPWin_tooltip: "Коалиция ПНП выиграла выборы с радикальными изменениями в мышлении."
 SAF_Independence_tooltip: "Южная Африка объявит независимость от Британской империи!"
 SAF_NRhodesia_tooltip: "§RBritain может объявить войну нам, если мы предпримем это действие!"
 SAF_Boerdeter_tooltip: "§G Это удержит буров от вставания раз и навсегда. §!n"
 SAF_BoerAngry1_tooltip: "Буры и националисты становятся все более злобными..."

 #### Focus ####
 SAF_Union_Army: "Союзная армия"
 SAF_Union_Army_desc: "Хотя мы всегда полагались на Британскую Империю, чтобы обеспечить нашу защиту, многие в нашей стране предпочли бы, чтобы мы создали нашу собственную армию Союза, не веря ни в какие интересы, ни в свои интересы."
 SAF_Through_the_Savannah: "Через Саванну"
 SAF_Through_the_Savannah_desc: "Механизированная война - это будущее, и мы должны научиться управлять ею перед нашими врагами."
 SAF_Legacy_Great_War: "Наследие Великой войны"
 SAF_Legacy_Great_War_desc: "Великая война была трагедией, и многие южноафриканские солдаты погибли на полях Европы, но мы должны учиться на ее ошибках и избегать их в будущем."
 SAF_Mobile_Army: "Мобильная армия"
 SAF_Mobile_Army_desc: "Чтобы избежать войны, которая характеризовала и застопорила Великую Войну, мы должны сосредоточиться на создании армии, которая всегда может быть мобильной и всегда нажимать на атаку."
 SAF_Versatile_Supply: "Вещество"
 SAF_Versatile_Supply_desc: "Для того чтобы иметь многофункциональную армию, мы должны иметь многофункциональную линию снабжения, которая бы соответствовала скорости и мобильности."
 SAF_Planning_Initiatives: "Инициативы в области планирования"
 SAF_Planning_Initiatives_desc: "Мы должны обеспечить, чтобы наши планировщики проявляли инициативу в отношении любых конфликтов, которые могут возникнуть."
 SAF_Offensive_Tactics: "Нападающие тактики"
 SAF_Offensive_Tactics_desc: "Наступательная тактика имеет жизненно важное значение для мобильных боевых действий, и мы должны научиться, как вести борьбу противника, а не сидеть и позволять им приходить к нам."
 SAF_Through_the_Hills: "Через холмы"
 SAF_Through_the_Hills_desc: "Мы должны понимать, что война заключается не только в нападениях, но и в защите, и самое простое место для защиты нашего дома находится на холмах."
 SAF_Legacy_Boer_War: "Наследие буровых войн"
 SAF_Legacy_Boer_War_desc: "Бурские войны научили нас многому о партизанских войнах и боях в горах и горах. Мы должны учиться у них, чтобы избежать их повторения или, если необходимо, выиграть их быстрее."
 SAF_Shock_Initiatives: "Инициативы, связанные с шоком"
 SAF_Shock_Initiatives_desc: "Шок и благоговение очень эффективны в том, что касается срыва вражеских движений и их рассеивания."
 SAF_Defensive_Tactics: "Защитная тактика"
 SAF_Defensive_Tactics_desc: "Наш дом - это то, за что мы боремся."
 SAF_Scorched_Earth: "Пожарная Земля"
 SAF_Scorched_Earth_desc: "Наши солдаты должны быть оснащены для того, чтобы стереть все, что они найдут в случае необходимости, буры прятались в фермерских домах и полях во время своих войн, мы должны быть уверены, что наши враги не смогут сделать то же самое."
 SAF_Living_off_Land: "Жить за пределами земли"
 SAF_Living_off_Land_desc: "Вместо того чтобы беспокоиться о обременительных линиях снабжения, мы должны обеспечить, чтобы наши солдаты обладали навыками и инструментами, необходимыми для того, чтобы при необходимости жить на земле, которую они занимают."
 SAF_Lessons_from_British: "Уроки, извлеченные из опыта Великобритании"
 SAF_Lessons_from_British_desc: "Империя - за все свои недостатки - научила нас многому."
 SAF_Our_Own_Strategies: "Наши собственные стратегии"
 SAF_Our_Own_Strategies_desc: "Хотя мы можем многому научиться у других, мы должны обеспечить, чтобы мы могли быть самодостаточными в разработке наших собственных стратегий и планов боевых действий."
 SAF_Army_for_Nation: "Армия для нации"
 SAF_Army_for_Nation_desc: "Наконец, мы можем сказать, что у нас есть собственная армия, которая не была скована или диктована Империей, а была создана и управляется нашим собственным Союзом."

 SAF_Union_Navy: "Союзные военно-морские силы"
 SAF_Union_Navy_desc: "В то время как мы по-прежнему полагаемся на Британию в обеспечении защиты на море, мы являемся прибрежным государством, и поэтому, возможно, мы захотим увидеть, сколько мы можем себе позволить."
 SAF_Imperial_Reliance: "Полагайся на Имперский флот"
 SAF_Imperial_Reliance_desc: "В то время как создание нашего флота является привлекательной идеей, это как непрактично, так и пустая трата средств."
 SAF_Buy_Old_Ships: "Покупайте старые корабли"
 SAF_Buy_Old_Ships_desc: "Британия будет рада продать нам более устаревшие боевые корабли, это лучше, чем строить наши собственные, и хранить деньги в имперской экономике."
 SAF_New_Upgrades: "Новые усовершенствования"
 SAF_New_Upgrades_desc: "Даже старые корабли могут быть модернизированы новыми конструкциями."
 SAF_Offensive_Fleet: "Наступательный флот"
 SAF_Offensive_Fleet_desc: "Полагаясь на Имперский флот, мы полагаемся на флот, который может привести борьбу к нашим врагам, далеко от наших берегов."
 SAF_Dockyard_Construction: "Докьярд Строительные работы"
 SAF_Dockyard_Construction_desc: "Наши существующие военно-морские базы испытывают острую нехватку современного оборудования, мы должны модернизировать наши существующие доки и построить новые, с тем чтобы иметь флот, которым мы могли бы гордиться."
 SAF_Grand_Battlefleet: "Большой боевой флот"
 SAF_Grand_Battlefleet_desc: "Мы находимся в уникальном положении, поскольку мы близки к тому, чтобы иметь самый большой флот на африканском континенте."
 SAF_Submarine_Warfare: "Подводные бои"
 SAF_Submarine_Warfare_desc: "Времена изменились, как и военные действия в открытом море, подводные лодки — это суда разрушения, способные уничтожить целые конвои, это будущее морской войны и будущее, которое мы должны преследовать."
 SAF_Reliance_on_Ourselves: "Полагайтесь на себя"
 SAF_Reliance_on_Ourselves_desc: "Имперский флот выполнил свою задачу, но что будет, если Империя станет нашим врагом?"
 SAF_Protect_Our_Shores: "Защищайте наши бои"
 SAF_Protect_Our_Shores_desc: "В то время как наша армия более чем способна защищать нашу страну на суше, мы по-прежнему рискуем вторжением на море, и наш флот должен быть хорошо оснащен для защиты наших берегов и обеспечения безопасности нашего народа."
 SAF_Escort_Ships: "Сопровождающие суда"
 SAF_Escort_Ships_desc: "Наши торговые конвои необходимы для нашего экономического роста и дальнейшего развития."
 SAF_Defensive_Fleet: "Оборонительный флот"
 SAF_Defensive_Fleet_desc: "Наш собственный флот будет оборонительным, сосредоточенным гораздо больше на защите наших берегов, чем на борьбе с врагом."
 SAF_Fleet_Command: "Командование флота"
 SAF_Fleet_Command_desc: "Мы должны обеспечить, чтобы наши адмиралы и капитаны были лучшими из лучших, способными выполнять свои задачи и обязанности в связи с письмом."
 SAF_Africa_Naval_Superpower: "Суперсилы Африки в военно-морском флоте"
 SAF_Africa_Naval_Superpower_desc: "Благодаря напряженной работе, которую мы вложили в наш военно-морской флот в последние месяцы и годы, мы стали главной военно-морской супердержавой Африки."

 SAF_Union_Air_Force: "Военно-воздушные силы Союза"
 SAF_Union_Air_Force_desc: "Нашим военно-воздушным силам не хватает сил и сил, но пришло время изменить это."
 SAF_Air_Ground_Support: "Поддержка воздух-перелет"
 SAF_Air_Ground_Support_desc: "Мы должны обучить наших пилотов методам наземной поддержки, с тем чтобы они могли разрушать наших врагов."
 SAF_War_Exercises: "Военные учения"
 SAF_War_Exercises_desc: "Любой хороший генерал-планировщик знает, что лучший способ для военно-воздушных сил - проводить военные учения, наши враги могут появиться откуда угодно в любое время, поэтому мы должны всегда быть готовыми и бдительными."
 SAF_Radar_Expansion: "Расширение радиолокационной сети"
 SAF_Radar_Expansion_desc: "Радиолокатор оказывает нам огромную помощь в перехвате прибывающих самолетов и отслеживании наших собственных операций."
 SAF_Rocketry: "Ракета"
 SAF_Rocketry_desc: "Экспериментальная по природе, но вдохновляющая по потенциалу, ракета - это то, что некоторые называют будущим войны."
 SAF_Total_War: "Итого, война"
 SAF_Total_War_desc: "Великая война доказала, что в войне больше нет ничего необычного. Давайте тренируем наши самолеты и бомбардировщиков, чтобы они нацеливались на стратегические цели наряду с военными, чтобы деморализовать врага."
 SAF_Strategic_Bombing: "Стратегическая бомбардировка"
 SAF_Strategic_Bombing_desc: "Наши бомбардировщики должны быть уверены в точности всех операций, независимо от того, где могут находиться цели."
 SAF_The_RAF: "РВС"
 SAF_The_RAF_desc: "Мы должны взять страницу из книги Империи и посмотреть, есть ли что-то, что мы можем скопировать в отношении наших собственных ВВС."
 SAF_Fighter_Improvements: "Улучшения для истребителей"
 SAF_Fighter_Improvements_desc: "Сила воздушного флота лежит в его боевиках. если придти сюда будет настолько глупо."
 SAF_The_SAAF: "СААФ"
 SAF_The_SAAF_desc: "Мы не можем продолжать полагаться на вещи, которые империя уже создала. Королевские военно-воздушные силы известны своей мощью и мастерством. Однако Южноафриканские военно-воздушные силы будут гораздо лучше."
 SAF_Bomber_Improvements: "Усовершенствование бомбардировщиков"
 SAF_Bomber_Improvements_desc: "Наши бомбардировщики должны быть готовы к всевозможным условиям и миссиям."
 SAF_African_Skies: "Африканские небеса"
 SAF_African_Skies_desc: "Как и в случае с сушей и морем, наш народ вновь покорил небеса этого континента, пусть наши враги дрожат и умирают, если они настолько глупы, что приходят к нам."
 SAF_Our_Own_Air_Force: "Наши собственные военно-воздушные силы"
 SAF_Our_Own_Air_Force_desc: "Благодаря реформам, которые мы привнесли в структуру наших военно-воздушных сил, мы обеспечили, чтобы у нас были самолеты, которыми можно гордиться, и небеса, находящиеся под нашим собственным контролем."

 SAF_Black_Wednesday: "Прибытие в черную среду"
 SAF_Black_Wednesday_desc: "Глобальная экономическая катастрофа, вызванная маневрами Лондона и сохраняющейся нестабильностью в его Империи, наконец, дошла до нас. Наша индустрия была разрушена, и если мы хотим когда-либо встать на ноги, мы должны решить эту проблему немедленно, прежде чем она усугубится."
 SAF_Govt_Intervention: "Вмешательство правительства"
 SAF_Govt_Intervention_desc: "Для того чтобы как можно скорее урегулировать этот экономический кризис, мы должны инвестировать в местную экономику всей страны и не допустить дальнейшего утопления наших предприятий."
 SAF_Imperial_Investment: "Имперские инвестиции"
 SAF_Imperial_Investment_desc: "Как бы то ни было, экономический кризис, с которым мы сталкиваемся сегодня, заставляет нас искать помощи у наших повелителей в Лондоне."
 SAF_Imperial_Contracts: "Имперские контракты"
 SAF_Imperial_Contracts_desc: "Подписывая ряд контрактов, позволяющих имперским компаниям действовать более инвазивно на наших рынках, мы можем продолжать стимулировать развитие местной экономики во всей нашей стране."
 SAF_Subsidize_Industry: "Субсидирование промышленности"
 SAF_Subsidize_Industry_desc: "В то время как британская помощь заставит нас начать, мы должны инвестировать наши собственные финансы в обеспечение роста нашей экономики за счет субсидий и субсидий, а не полностью полагаться на Лондон."
 SAF_Unity_with_Colonies: "Единство с колониями"
 SAF_Unity_with_Colonies_desc: "Наши братские колонии в Африке сталкиваются с теми же трудностями, что и мы."
 SAF_Trade_with_Dominions: "Торговля с Доминионами"
 SAF_Trade_with_Dominions_desc: "Расширяя нашу торговлю с братскими Доминионами по всему миру, мы можем укрепить наш общий призыв к автономии из Лондона, обеспечивая при этом более тесные связи и помогая совершенствовать экономику друг друга."

 SAF_Infrastructure_Invesment: "Инвестирование в инфраструктуру"
 SAF_Infrastructure_Invesment_desc: "Одним из четких шагов, которые мы должны предпринять для улучшения нашей экономики, является вложение значительных средств в нашу инфраструктуру, которой до сих пор не хватает в большинстве областей."
 SAF_Prioritize_Cape: "Приоритизировать мыс"
 SAF_Prioritize_Cape_desc: "Мы должны сосредоточить внимание на провинции Кейп и расширить промышленность, с тем чтобы начать наше долгое восстановление после Черной среды."
 SAF_Railway_Expansions: "Расширение железнодорожного сообщения"
 SAF_Railway_Expansions_desc: "Наша железнодорожная инфраструктура на мысе может использовать несколько усовершенствований. Мы можем убить несколько птиц одним камнем, создавая рабочие места, обеспечивая транспортировку ресурсов и подготавливая оборону нашей страны."
 SAF_Prioritize_Transvaal: "Приоритизировать Трансвааль"
 SAF_Prioritize_Transvaal_desc: "Наши ресурсы для обращения вспять кризисов, вызванных Лондонским фондовым рынком, должны быть направлены на извлечение наших ресурсов и смягчение волнений в Трансваале."
 SAF_Mining_Expansions: "Расширение масштабов горнодобывающей деятельности"
 SAF_Mining_Expansions_desc: "Наши мины в Трансваале не используются в полной мере с учетом их потенциала."
 SAF_Scientific_Subsidies: "Научные субсидии"
 SAF_Scientific_Subsidies_desc: "Наука имеет неоценимое значение для защиты и развития нашей страны."
 SAF_Additional_Dockyards: "Дополнительные докьяры"
 SAF_Additional_Dockyards_desc: "Постройка большего числа судов будет в десять раз возмещена."
 SAF_Industrial_Unity: "Промышленное единство"
 SAF_Industrial_Unity_desc: "Наши субсидии, строительство и экспансия привели к экономическому и промышленному единству, которого никогда не было в нашей стране."

 SAF_Austerity: "Жесткость"
 SAF_Austerity_desc: "Хотя мы можем оказать определенную помощь здесь и там, наша главная задача должна заключаться в том, чтобы позволить рынку позаботиться о себе."
 SAF_Go_Alone: "Вперёд, в одиночестве."
 SAF_Go_Alone_desc: "Наша страна может проложить свой собственный путь только в том случае, если мы полагаемся на свою изобретательность и мастерство, мы не можем просить Империю о помощи, мы должны продолжать наши усилия по восстановлению в одиночку."
 SAF_Less_Taxes: "Минус налоги"
 SAF_Less_Taxes_desc: "Снижая налоги на самых богатых в нашей стране, наша последующая экономическая удача может течь сверху вниз и рецивилизировать экономику! Это также поможет нашим донорам быть счастливыми."
 SAF_Expand_Arsenal: "Расширить арсенал"
 SAF_Expand_Arsenal_desc: "Одна из наиболее эффективных - это инвестиции в производство оружия и боеприпасов, которые создают рабочие места и обеспечивают нашу будущую общую оборону - или преступление."
 SAF_Strip_Reservation_Protections: "Защита от оговорок"
 SAF_Strip_Reservation_Protections_desc: "Слишком долго мы предоставляли особый статус резервациям коренных народов в нашей стране."
 SAF_Hand_Markets: "&quot; Рука рынков &quot;"
 SAF_Hand_Markets_desc: "Наши рынки сами о себе позаботились, когда самые богатые сохраняют свои деньги, бизнес остается открытым, а деньги продолжают течь, еще одно успешное восстановление."
 SAF_Crisis_Resolved: "Урегулирование кризиса"
 SAF_Crisis_Resolved_desc: "После окончательного урегулирования экономического кризиса мы можем обратить наше внимание на гораздо более важные вопросы."


 SAF_1937_Election: "Выборы 1937 года"
 SAF_1937_Election_desc: "На выборах 1937 года новая Объединенная партия выступила против коалиции АНК и очищенной национальной партии, чтобы определить, кто приведет Южную Африку в будущее."
 SAF_ANC_Victory: "АНК Победа"
 SAF_ANC_Victory_desc: "Коалиция АНК и Лейбористских партий одержала победу и получила достаточно мест, чтобы сформировать правительство в Палате собрания."
 SAF_Special_Legislative_Session: "Специальная законодательная сессия"
 SAF_Special_Legislative_Session_desc: "Мы должны немедленно созвать специальную сессию Палаты собрания для рассмотрения многочисленных проблем, стоящих перед нашей страной."
 SAF_Administrative_Concerns: "Административные проблемы"
 SAF_Administrative_Concerns_desc: "Внутри страны некоторые из наших самых серьезных проблем связаны с некомпетентной администрацией."
 SAF_Sixth_Province: "Шестая провинция"
 SAF_Sixth_Province_desc: "Территорию Калахари слишком долго игнорировали, поскольку она не имеет статуса провинции."
 SAF_Rhodesia_Referendum: "Референдум Родезии"
 SAF_Rhodesia_Referendum_desc: "Мы обещали народу Родезии, что позволим ему провести референдум по вопросу о независимости от Союза, и мы не забыли, и мы не нарушим своего слова."
 SAF_Legislate_Integration: "Законодательная интеграция"
 SAF_Legislate_Integration_desc: "Покончить с сегрегацией и с началом интеграции не удастся, и мы должны использовать нашу власть в Палате для ее принятия."
 SAF_Restore_Native_Rights: "Восстановление прав коренного населения"
 SAF_Restore_Native_Rights_desc: "Несмотря на то, что националисты нашего правительства уже давно пытаются подавить и отделить коренных жителей, уже давно мы обращаемся с ними как с равными гражданами и предоставляем им те же права, что и любому другому человеку."
 SAF_Amend_the_Constitution: "Внести поправки в Конституцию"
 SAF_Amend_the_Constitution_desc: "Несмотря на то, что у нас мало возможностей в плане разработки своего собственного правового документа, конституция, которую мы написали после принятия Статута автономии, в принципе по-прежнему является для нас руководством, и мы должны внести в него изменения, с тем чтобы отразить наш новый путь."
 SAF_Solidify_the_Coalition: "Укрепить Коалицию"
 SAF_Solidify_the_Coalition_desc: "АНК пришел к власти только с помощью Либеральной и Доминионской партий."
 SAF_Compromise_Where_Possible: "Пообещай там, где это возможно"
 SAF_Compromise_Where_Possible_desc: "Наша коалиция хрупка, и не все ее стороны согласны по каждому вопросу, но для того, чтобы сохранить нашу видимую силу, мы должны пойти на компромисс там, где это необходимо, и сохранить свою поддержку."
 SAF_Work_Without_Nationalists: "Работа без националистов"
 SAF_Work_Without_Nationalists_desc: "Националистические элементы, все еще находящиеся в Палате, не желают работать с нами и скорее будут препятствовать нашим реформам."
 SAF_Legislated_Equality: "Законное равенство"
 SAF_Legislated_Equality_desc: "Равенство не возникает естественным образом: оно должно быть закреплено в законодательном порядке, с тем чтобы оно никогда больше не было отменено."
 SAF_Outlaw_Segregation: "Сегрегация вне закона"
 SAF_Outlaw_Segregation_desc: "Институты неравенства, присутствующие в Южной Африке, являются архаичными и варварскими, и только путем их полного запрещения мы сможем продвигаться вперед."
 SAF_Bill_Of_Rights: "Билль о правах"
 SAF_Bill_Of_Rights_desc: "Для того чтобы закрепить весь достигнутый нами прогресс и реформы, которые мы провели, необходимо принять билль о правах, с тем чтобы навсегда обеспечить, чтобы Южная Африка стала бастионом надежды и равенства."
 SAF_Way_To_Greatness: "Путь к величию"
 SAF_Way_To_Greatness_desc: "Похоже, усилия нового правительства наконец-то окупились. Реформы вернули стабильность в большую часть Южной Африки, и кажется, что мы вступаем в новую эру мира, сотрудничества и подлинного единства."

 SAF_United_Victory: "Победа Объединенной партии"
 SAF_United_Victory_desc: "Объединенной партии удалось сохранить власть в Палате собрания, несмотря на внутренние переломы и внешнее давление."
 SAF_Welcome_British_Interests: "Приветствуем британские интересы"
 SAF_Welcome_British_Interests_desc: "Империя остается нашей системой защиты в это время, и мы должны поощрять и приветствовать инвестиции из других частей земного шара, если мы хотим построить себя, чтобы стать величайшей нацией на Земле."
 SAF_Push_Pro_British_Sentiment: "Подтолкнуть пробританские чувства"
 SAF_Push_Pro_British_Sentiment_desc: "У нашего народа давнее недоверие к Империи, но если мы хотим получить помощь из Лондона в урегулировании нашего экономического кризиса и продвижении вперед нашего развития, мы не можем позволить себе антибританские настроения, мы должны занять твердую позицию рядом с Лондоном."
 SAF_Cultural_Issues: "Культурные вопросы"
 SAF_Cultural_Issues_desc: "Слишком долго наши культурные проблемы диктовали нашу историю, мы должны работать над тем, чтобы преодолеть разрыв между теми, кто находится на мысе, и теми, кто находится в Трансваале, и попытаться создать сбалансированное общество для всех."
 SAF_Integration_Issues: "Вопросы интеграции"
 SAF_Integration_Issues_desc: "Как бы то ни было, Южная Африка известна многим в мире своими проблемами с ее коренными жителями, хотя некоторые справа призывают к дальнейшему разделению на основе расы, те, кто слева, давно призывают к интеграции."
 SAF_Liberal_Cabinet_Members: "Члены либерального кабинета"
 SAF_Liberal_Cabinet_Members_desc: "Для того чтобы создать подлинно заслуживающее доверия правительство, способное решать вопросы интеграции, мы должны привлечь либеральных министров в наш кабинет и приветствовать их идеи, даже если они могут оказаться слишком далекими."
 SAF_Autonomy_for_Transvaal: "Автономия для трансвааль"
 SAF_Autonomy_for_Transvaal_desc: "Трансвааль, место трех бурских войн, должен быть защищен, чтобы правые волнения не разрушили всю нашу работу. Предоставление ему большей автономии могло бы стать хорошим началом. Позволить им принять свои собственные законы об интеграции или раздельном проживании, несомненно, поможет успокоить нынешние волнения."
 SAF_No_More_Separation: "Больше нет разлуки"
 SAF_No_More_Separation_desc: "Хотя попытки полностью интегрировать коренные народы в наше общество представляются невыполнимой задачей, одно из возможных решений состоит в том, чтобы не допустить их дальнейшего разделения."
 SAF_Rights_in_Kalahari: "Права в Калахари"
 SAF_Rights_in_Kalahari_desc: "Для того чтобы компенсировать то разделение, которое мы уже наложили на коренных жителей, наш кабинет предложил предоставить больше прав коренных жителей на территории Калахари, которая в настоящее время содержит бóльшую часть национальных резерваций коренных народов."
 SAF_Concessions_to_Rhodesia: "Концессии Родезии"
 SAF_Concessions_to_Rhodesia_desc: "Родезия долгое время была занудой на стороне нашего правительства, но это главным образом потому, что наше правительство было слишком упрямым, чтобы делать основные уступки. Давайте дадим им ту же автономию, что и Трансваал. По крайней мере, это поможет облегчить ситуацию на данный момент."
 SAF_Future_Guarantees: "Будущие гарантии"
 SAF_Future_Guarantees_desc: "Давайте оставим этот Родезийский бизнес позади, хотя наши уступки несколько успокоили массы, гарантии будущих уступок также могут работать довольно хорошо. Эти гарантии не обязательно должны сбываться, но нет ничего плохого в том, чтобы сделать их на данный момент."
 SAF_Guarantee_Elections: "Гарантировать выборы"
 SAF_Guarantee_Elections_desc: "Мы должны и впредь поддерживать демократический процесс, даже если это означает, что в конечном счете мы можем быть лишены права голоса, мы должны сделать гарантированные выборы законом страны и работать над тем, чтобы предоставить всем людям равный доступ к франшизе."
 SAF_Promise_Future_Change: "Обещай изменения в будущем"
 SAF_Promise_Future_Change_desc: "Люди любят свои гарантии, даже если они не справятся, и один из способов обеспечить, чтобы мы оставались у власти в течение следующих нескольких выборов, это гарантировать еще больше перемен в будущем, даже если это не все возможно."
 SAF_Status_Quo_Steady: "Статус QuoStencils"
 SAF_Status_Quo_Steady_Desc: "Мы всегда говорили, что избиратели ненавидят статус-кво. Сегодня мы можем утверждать, что это просто неправда. Правительство сильнее, чем когда-либо, и все наши проблемы, похоже, приближаются к своим неизбежным целям."
 SAF_Greater_Union: "Большой союз"
 SAF_Greater_Union_desc: "Ян Смутс всегда мечтал о создании Большого Южноафриканского союза, и сегодня эта мечта была реализована."

 SAF_PNP_Victory: "Очищенная национальная партия"
 SAF_PNP_Victory_desc: "Очищенная национальная партия, созданная в качестве экстремистской альтернативы Объединенной партии, получила достаточное количество мест в сочетании с партией Рус, чтобы сформировать новую коалицию."
 SAF_Kalahari_Reservation: "Резервация Калахари"
 SAF_Kalahari_Reservation_desc: "Сделав большую территорию Калахари единственной оговоркой, мы теоретически могли бы начать процесс выдворения коренных жителей из остальной части страны."
 SAF_Policy_of_Removal: "Политика удаления"
 SAF_Policy_of_Removal_desc: "Несмотря на то, что, возможно, говорили коалиция АНК и Объединенная партия, невозможно сохранить мир в условиях совместного проживания с коренными жителями."
 SAF_Take_Back_Our_Nation: "Возвращайся к нашему народу"
 SAF_Take_Back_Our_Nation_desc: "С нашей вновь обретенной победой и контролем над правительством мы должны быстро принять законодательство, которое укрепит нашу власть и укрепит наш контроль над ее институтами."
 SAF_Judicial_Seizure: "Судебный арест"
 SAF_Judicial_Seizure_desc: "Нынешние суды неизмеримо коррумпированы и контролируются интересами Лондона."
 SAF_New_Courts: "Новые суды"
 SAF_New_Courts_desc: "Укрепляя суды, которые у нас в настоящее время имеются, и заменяя любого судью, который не будет клясться в верности нам, мы создадим нацию, которую мы можем легко сформировать в любой форме, не беспокоясь о бессмысленных правовых ссорах."
 SAF_Legislative_Independence: "Законодательная независимость"
 SAF_Legislative_Independence_desc: "Лондонские протесты для нас ничего не значат, они слишком долго держали контроль над нашей нацией, и пришло время взять свою свободу, мы должны освободиться от законодательного контроля Лондона и начать писать свои законы."
 SAF_Unlimited_Power: "Неограниченная мощность"
 SAF_Unlimited_Power_desc: "С новой силой и вдохновением Палата собрания может начать принимать множество новых законов, необходимых для создания новой нации."
 SAF_Military_Crackdown: "Военное свертывание"
 SAF_Military_Crackdown_desc: "Есть только один способ справиться с непрекращающимися беспорядками и открытым восстанием в Родезии и Беучаналенде, послать в танки, полная военная оккупация должна помочь им узнать свое место."
 SAF_Lock_Down_Rhodesia: "Заблокировать Родезию"
 SAF_Lock_Down_Rhodesia_desc: "Бывшее правительство нашей страны довольствовалось тем, что ситуация в Родезии вышла из-под контроля. Мы не должны быть. Пошлите танки и заблокируйте провинцию, пока она не узнает свое место в Союзе."
 SAF_Encourage_Violence: "Поощрять насилие"
 SAF_Encourage_Violence_desc: "Побуждая наших националистических последователей совершать акты насилия по всей стране, мы, возможно, сможем оправдать деятельность полицейских сил, находящихся под контролем ПНП, которые смогут осуществлять нашу волю и законы на всей территории страны."
 SAF_Government_Police: "Правительственная полиция"
 SAF_Government_Police_desc: "Недавняя вспышка насилия по всей стране вызвала призывы к созданию правительственных полицейских сил для поддержания порядка."
 SAF_New_Constitution: "Новая конституция"
 SAF_New_Constitution_desc: "Для того чтобы укрепить нашу приверженность нации и обеспечить сохранение наших новых законов и институтов, мы должны написать новый документ отдельно от тех, которые были навязаны нам Империей для определения нашей собственной судьбы."
 SAF_Enshrine_Boer_Law: "Закон об аншринном буре"
 SAF_Enshrine_Boer_Law_desc: "Настало время закрепить политику и идеалы Бура в законе. Пусть международное право будет проклято; страна принадлежит нам."
 SAF_Own_Path: "Наш собственный путь"
 SAF_Own_Path_desc: "После нашего отделения от Империи и обеспечения нашей независимости мы смогли вырасти и процветать как нация. Старая либеральная политика больше не удержит нас. Южная Африка принадлежит нам, и только нам. Пусть мир дрожит."

 SAF_Imperial_Concerns: "Имперские опасения"
 SAF_Imperial_Concerns_desc: "Когда речь заходит о внешней политике, наша главная цель состоит в том, чтобы раз и навсегда решить, как подойти к нашей позиции в ее рядах."

 SAF_Imperial_Cooperation: "Имперское сотрудничество"
 SAF_Imperial_Cooperation_desc: "Мы должны сотрудничать с ними, а не отталкивать их, чтобы получить то, что мы хотим."
 SAF_Improve_Dominions: "Улучшить отношения с Доминионами"
 SAF_Improve_Dominions_desc: "Не секрет, что наш имидж с другими Доминионами Империи был запятнан нашими текущими проблемами."
 SAF_Our_Image: "Пересмотреть наш образ"
 SAF_Our_Image_desc: "Для того чтобы вновь занять свое место в остальной части мира, мы не можем позволить, чтобы наши проблемы определяли нас."
 SAF_Our_Place_Empire: "Наше место в Империи"
 SAF_Our_Place_Empire_desc: "Если Лондон ожидает, что мы останемся в их глобальной империи, они должны вести переговоры с нами о нашем месте в их сфере и о том, что это значит для нашего будущего."
 SAF_Seek_Guarantees_Autonomy: "Ищите гарантии автономности"
 SAF_Seek_Guarantees_Autonomy_desc: "Устав Вестминстера был слишком широким для парламента, а Статут автономии слишком узок для нас."
 SAF_Imperial_Commitment: "Имперские обязательства"
 SAF_Imperial_Commitment_desc: "Наше примирение с Империей привело нас к этому: мы должны взять на себя обязательства перед Империей во всей нашей полноте, чтобы не было никаких сомнений в нашей верности. Возможно, это не лучший выбор, но это наш единственный выбор, если мы хотим продолжать расти и развиваться с помощью Империи."
 SAF_Question_Expansion: "Вопрос о расширении членского состава"
 SAF_Question_Expansion_desc: "Одно из многих решений, с которыми сталкивается сегодня наша страна, заключается в том, следует ли нам продолжать расширять или укреплять то, что у нас есть."
 SAF_Relinquish_Claims: "Отклоните наши утверждения"
 SAF_Relinquish_Claims_desc: "В то время как некоторые политики в Южной Африке уже давно держались за землю, обещанную нам Великобританией более десяти лет назад, пришло время сосредоточиться на том, чтобы сделать Южную Африку лучше, а не пытаться сделать ее слишком большой, чтобы справиться с ней."
 SAF_Reassure_Portuguese: "Укрепить португальцев"
 SAF_Reassure_Portuguese_desc: "Понятно, что некоторые в Мозамбике обеспокоены риторикой некоторых из наших более националистических политиков о захвате колонии, и мы должны заверить их в том, что у нас нет на это никаких намерений и что им не о чем беспокоиться."
 SAF_Leave_HCT: "Оставьте HCT."
 SAF_Leave_HCT_desc: "В то время как Великобритания уже давно обещала нам интегрировать территории Верховного комиссара, нам больше не нужно выдвигать свои претензии в этих территориях, и мы должны начать выезжать с территорий и оставить их Британии, чтобы разобраться с ними."
 SAF_New_Treaties: "Новые договоры"
 SAF_New_Treaties_desc: "До тех пор пока старые договоры, обещавшие нам землю, остаются в силе, националисты никогда не будут молчать."
 SAF_New_Beginning: "Новое начало"
 SAF_New_Beginning_desc: "Мы создали для себя новое начало на мировой арене, мы должны сохранить нашу внутреннюю силу и показать миру, что мы можем быть такими же великими как и любая другая страна."
 SAF_Pursue_Claims: "Продолжайте в том же духе"
 SAF_Pursue_Claims_desc: "Хотя некоторые политики в Южной Африке считают, что нам следует отказаться от своих притязаний, настало время сосредоточиться на выполнении Великобританией своих обещаний, а именно на приобретении территорий Верховного комиссара и Родсии, что было обещано нам более десяти лет назад."
 SAF_Show_London_Worth: "Показать Лондону нашу ценность"
 SAF_Show_London_Worth_desc: "Десять лет назад Лондон решил отступить от своих обещаний о территориальном переходе на основе нашего отношения к коренным народам. Теперь, когда мы сделали все возможное для улучшения положения коренных народов здесь, в Южной Африке, мы должны доказать Лондону, что мы вновь достойны тех земель, которые они обещали."
 SAF_Request_HCT: "Просьба о передаче ТХТ"
 SAF_Request_HCT_desc: "Теперь, когда мы оказались в Лондоне, настало время для нас, наконец, аннексировать и интегрировать территории Верховного комиссара."
 SAF_Request_NRhodesia: "Запрос Родезии"
 SAF_Request_NRhodesia_desc: "Пришло время, чтобы Британия выполнила свои обещания, это означает, что земли Родезии и Ньясаленда скоро станут нашими."
 SAF_Mozambique_Offer: "Покупайте Южный Мозамбик"
 SAF_Mozambique_Offer_desc: "Учитывая детали, пришло время предложить Португалии сделку для южного Мозамбика и его ключевых портов."
 SAF_Greater_South_Africa: "Большая Южная Африка"
 SAF_Greater_South_Africa_desc: "Видение Яна Смутса о великой Южной Африке было реализовано, и потребовалось много усилий и решимости, и, хотя мы, возможно, не получили всего, чего хотели, сегодня наша нация действительно является величайшей на Земле."

 SAF_Challenge_London: "Вызов Лондона"
 SAF_Challenge_London_desc: "Слишком долго мы жили из-за прихотей людей в тысячах миль от проблем Южной Африки. Наша мечта о величии должна быть реализована независимо от них. Давайте расстанемся с Лондоном. Они слишком заняты, чтобы попытаться остановить нас."
 SAF_Summon_House: "Вызовите палату собрания"
 SAF_Summon_House_desc: "Мы должны созвать специальную сессию Палаты собрания, чтобы обсудить вопрос о нашем выходе из Империи."
 SAF_Arrest_Dissenters: "Арестовать диссентеров"
 SAF_Arrest_Dissenters_desc: "Мы должны немедленно использовать полицию столицы для ареста всех членов Палаты, которые не будут клясться принять декларацию независимости."
 SAF_Prepare_Declaration: "Подготовить декларацию"
 SAF_Prepare_Declaration_desc: "Настало время объявить нашу независимость, написать официальное заявление о нашей независимости от Империи."
 SAF_Leave_IPA: "Оставить АПИ"
 SAF_Leave_IPA_desc: "Имперский альянс защиты - это порочный и коррумпированный союз подчиненных государств."
 SAF_Leave_Empire: "Оставь Империю."
 SAF_Leave_Empire_desc: "Настало время объявить миру, что мы больше не подданные Лондона."
 SAF_Dismantle_Imperial_Africa: "Разрушить Императорскую Африку"
 SAF_Dismantle_Imperial_Africa_desc: "Слишком долго парламенты и монархи в Европе диктуют каждый наш шаг, теперь мы можем быть свободными, но миллионы других, таких как мы, все еще страдают от ограничительных колониальных правительств и законов, пришло время создать нашу собственную империю."
 SAF_End_European_Rule: "Конец европейского правила"
 SAF_End_European_Rule_desc: "Остальная часть колониальной Африки продолжает страдать под влиянием своих европейских повелителей, хотя, возможно, целых шестьдесят лет тому назад и была прекрасной идеей, настало время для широкомасштабного и мощного сдвига континентальной власти, в то время как Европа идет к войне, мы будем стремиться воспользоваться этой возможностью, чтобы раз и навсегда положить конец колониальному правлению из-за рубежа."
 SAF_Sponsor_Rebels: "Спонсоры мятежников"
 SAF_Sponsor_Rebels_desc: "Есть много других людей на континенте, которые хотят положить конец колониальному правлению, которым мы можем воспользоваться."
 SAF_On_Our_Own: "Сама по себе"
 SAF_On_Our_Own_desc: "Освобождение европейских колоний поселенцев должно быть независимым предприятием, в котором мы не будем прислушиваться к европейским интересам, когда придет время для переговоров за столом мира."
 SAF_Join_Stahlpakt: "Присоединяйся к Штальпакту"
 SAF_Join_Stahlpakt_desc: "Наш величайший шанс найти сильных союзников пришёл к Германскому пакту о стали, который положил бы конец любым отношениям, которые у нас есть с французским правительством, и, скорее всего, был бы осужден Великобританией, но это очень помогло бы создать мощную группу союзников."
 SAF_Our_Old_Claims: "Наши старые притязания"
 SAF_Our_Old_Claims_desc: "Давным-давно британцы дали нам ложное обещание, предоставить свои колонии в южной части Африки, хотя мы больше не являемся частью Империи, это не значит, что мы не можем смотреть на эти обещанные земли..."
 SAF_Occupy_HCT: "Закупить HCT"
 SAF_Occupy_HCT_desc: "Лондон по-прежнему требует защиты от местных жителей территорий Верховного комиссара, но мы не можем допустить, чтобы они имели опору на нашу территорию."
 SAF_Seize_NRhodesia: "Схватить Родезию"
 SAF_Seize_NRhodesia_desc: "Мы давно мечтали о Большой Южной Африке, и сейчас пришло время действовать Оккупи Родезия, Лондон не будет сопротивляться."
 SAF_Demand_Mozambique: "Спрос на Мозамбик"
 SAF_Demand_Mozambique_desc: "Мозамбик находится под плохим управлением, Португалия не может использовать свои ресурсы, ресурсы, которые мы могли бы использовать очень хорошо."
 SAF_Independence_At_Last: "Наконец-то независимость"
 SAF_Independence_At_Last_desc: "И наконец, наши амбиции реализованы. Южная Африка будет править над континентом, и никакая другая держава в мире не сможет противостоять нашему величию. Наконец, у нас есть собственная империя."

 #### Events ####

 southafrica.1.t: "Южноафриканский союз"
 southafrica.1.d: "В то время как третья бурская война, вечная борьба за окончание Великой войны, успешно покончила с любыми дальнейшими мыслями о борском сопротивлении, ситуация в Южной Африке за последние 20 лет ухудшилась, и вскоре может наблюдаться возрождение насилия, которое не было замечено после этого конфликта. Богатые Родезийские поселенцы отвергли союз с Южной Африкой в ходе референдума 1922 года, однако после приобретения Бечуаналенда в 1926 году эта страна была поражена протестами, беспорядками и насилием. Коренные жители Бечуаналенда, ранее довольно автономные и разгневанные в связи с утратой этого, а остальная часть Южной Африки стала беспощадной в связи с продолжающимся угнетением и сегрегацией. Сегодня эти агрессивные элементы приближаются к переломному моменту. Дом собрания в настоящее время также управляется Национальной партией, которая сама все больше выступает против британского сепаратизма, а некоторые члены парламента вообще требуют полной независимости от Империи. В противостоящей партии Южной Африки возникает противоположная проблема; в связи с ее более умеренными позициями и желанием продолжать заниматься вопросами, связанными с существующим правительством, в то время как и в других странах, так и в других странах, где существует в целом, а также в странах, в странах, в странах, в которых наблюдаетсяое население, и в Африке, имеет все больше внимания, и в странах, в странах, и в странах, в странах, в которых наблюдаетсяом и в Африке, в Африке, в частности, в Африке, в странах, в странах, в странах, в странах, в частности, в странах, в странах, в Африке, в Африке, в странах, в Африке, в частности, в странах, в странах, в странах, в странах, в странах, в странах, в странах, в странах, в странах, в странах, в которых наблюдается, в странах, в странах, в странах, в странах, в странах, в странах, в странах, в странах, в странах, в странах, в странах, в странах, в странах, в странах, в странах, в странах, в странах, в странах, в странах, в странах, в странах, в странах, в странах, в странах, в странах Африки, в Африке, в Африке, в странах с более чем в Африке, в Африке, в Африке, в Африке, в Африке, в Африке, в Африке, в Африке, в Африке, в странах"
 southafrica.1.a: "Бывший Единый Вирес!"

 southafrica.2.t: "Заявление Всеафриканского конгресса"
 southafrica.2.d: "Всеафриканский конгресс, в состав которого вошли различные представители со всей страны, собрался в декабре прошлого года и опубликовал официальные заявления, в которых он осудил попытки национального правительства еще больше сегрегировать белых и коренных чернокожих африканцев, возглавляемые экстремистскими элементами Национальной партии."
 southafrica.2.a: "Какое нелепое предложение."

 southafrica.3.t: "Политическое землетрясение"
 southafrica.3.d: "Дж.Б.М. Герцог, премьер-мистер Южной Африки, вместе с Яном Смутсом, лидером оппозиционной Южноафриканской партии, объявил сегодня о том, что члены парламента Смутса объединятся с членами правящей Национальной партии, чтобы сформировать новую «Единую партию»."
 southafrica.3.a: "И они ожидают, что это исправит наши проблемы?"

 southafrica.4.t: "Законодательство, касающееся голосования коренных народов"
 southafrica.4.d: "В рамках соглашения между бывшими партиями, которые в настоящее время входят в состав Объединенного правительства, Палата собрания согласилась провести слушания и прения по ряду законопроектов, направленных на рассмотрение нынешних списков избирателей. Националисты африканеры в Трансваале оказывают поддержку в чистке списков избирателей всех избирателей из числа коренного населения Африки и переводе их в отдельный список. Поступая так , британский парламент, который все еще жалуется на нашу историю дискриминации. Но если мы откажемся , мы рискуем еще больше разрушить нашу хрупкую коалицию."
 southafrica.4.a: "Мы не можем рисковать гневом националистов."
 southafrica.4.b: "Мы должны стремиться к тому, чтобы решить наши проблемы с помощью единства, а не разделения."

 southafrica.5.t: "Законодательство о представительстве коренных народов"
 southafrica.5.d: "После составления отдельного списка избирателей для всех избирателей из числа коренных народов Африки Палата собрания обязана определить, для чего будет использоваться этот новый список; в настоящее время он служит только отдельному списку избирателей из африканских стран; вместе с тем экстремисты и националисты настаивают на том, чтобы не допустить, чтобы коренные жители полностью голосовали за членов парламента, что позволит им голосовать только за четырех представителей в целом, которые будут представлять свои интересы в Палате; либеральные группы и даже некоторые члены Объединенной партии борются за эту вопиющую сегрегацию, однако национальные экстремисты с удовлетворением отмечают, что для них необходимо сохранить свою лояльность перед Объединенным правительством."
 southafrica.5.a: "Нам нужна поддержка как можно больше."
 southafrica.5.b: "Нам не нужно идти дальше, чем уже есть. Отклонить законопроекты."

 southafrica.6.t: "Законодательство о праве на владение исконными землями"
 southafrica.6.d: "В других законопроектах, которые Палата собрания примет по вопросу о сегрегации коренных народов Африки, рассматривается вопрос о землевладении. &quot; Националистические элементы Объединенной партии &quot; и новой Очищенной Национальной партии приняли законодательство, которое наделяло бы правительство полномочиями по насильственному выдворению коренных жителей, проживающих в районах, окруженных белыми поселенцами, и расширению резерваций в других провинциях. &quot; Критики &quot; в этих законопроектах предполагают, что это может позволить правительству полностью переселить коренных жителей из большей части страны. &quot; Мы вновь сталкиваемся с выбором между тем, что правильно, и тем, что нам нужно для сохранения нашего положения в Палате представителей. &quot; ."
 southafrica.6.a: "Нам нужны голоса, но это так далеко, как мы пойдем."
 southafrica.6.b: "Они заходят слишком далеко."

 southafrica.7.t: "Глобальная катастрофа достигает Южной Африки"
 southafrica.7.d: "Последствия крушения Лондонского фондового рынка достигли Южной Африки. Местная экономика по всей стране уже взвинчена как безработица. Националисты и лидеры Очищенной Национальной партии утверждают, что экономика Южной Африки останется сегодня сильной, если она отвергнет власть парламента и полностью оставит империю. Хотя многие понимают, что это явно ложно, все еще существует общее чувство враждебности по отношению к британскому росту среди населения. Это лишь усугубляет уже существующие проблемы."
 southafrica.7.a: "Черт побери, британцы и их войны!"

 southafrica.8.t: "Антииндийское законодательство"
 southafrica.8.d: "В последние годы в Южной Африке наблюдается большое число миграционных потоков, при этом многие иммигранты приезжают из Британского Раджа, и, хотя мы были готовы сначала стать аккомодированными, недавний револьт Индии и сохраняющаяся нестабильность в регионе превратили поток иммигрантов в наводнение. Для того чтобы больше националистов не покидали Объединенную партию, она согласилась выслушать ряд антииндийских и антииммиграционных законопроектов в Палате собрания. Хотя технически нам не разрешено устанавливать иммиграционные квоты в соответствии со Статутом автономии, мы сомневаемся, что Империя будет достаточно заботиться о том, чтобы остановить нас."
 southafrica.8.a: "Давай установим свои границы и остановим прилив."
 southafrica.8.b: "Всем здесь добро пожаловать. Отклоните законопроекты."

 southafrica.9.t: "Король назначает нового генерал-губернатора"
 southafrica.9.d: "Сегодня из Лондона нам сообщили, что король выбрал Патрика Дункана новым генерал-губернатором Южной Африки. Дункан открыто поддерживает правление из Лондона и часто критикует шаги нашего правительства, направленные на то, чтобы успокоить более национальные африканерские элементы нашего общества. Это назначение разозлило экстремистов в нашем правительстве, которые считают, что Лондон означает держать нашу страну под железным кулаком."
 southafrica.9.a: "Лондон пойдёт своим путём."

 southafrica.10.t: "Король назначает нового генерал-губернатора"
 southafrica.10.d: "Сегодня из Лондона нам сообщили, что король избрал премьер-министра Дж.Б.М. Герцог новым генерал-губернатором Южной Африки."
 southafrica.10.a: "Лондон выбрал мудро."

 southafrica.11.t: "Массовые протесты в Родезии"
 southafrica.11.d: "Сегодня массовые протесты парализовали провинцию Родезию, мотивируясь продолжающимся экономическим кризисом и отсутствием автономии, протестующие успешно закрыли большую часть промышленности в этом районе. Хотя правительство Соединенных Штатов приняло символические обещания, АНК обещало провинции провести референдум по вопросу о независимости, если они будут избраны в следующем году. Сейчас они могут убедить некоторых избирателей остаться дома в июне следующего года, но если мы ничего не сделаем, мы рискуем потерять всю провинцию из-за насилия."
 southafrica.11.a: "Дайте им как можно больше финансовой помощи."
 southafrica.11.b: "Пошлите танки."

 southafrica.12.t: "Поездки руководителей АНК по стране"
 southafrica.12.d: "Различные лидеры Африканского национального конгресса начали гастролировать по стране в попытке возродить бездействующие ветви партии и получить лучшую опору среди избирателей на предстоящие выборы. Несмотря на то, что АНК традиционно рассматривается как партия с очень незначительными шансами на победу, руководство партии также объявило сегодня, что оно присоединится к Партии труда и Доминион в либеральной коалиции."
 southafrica.12.a: "Похоже, их рекламный трюк работает."
 southafrica.12.b: "Возможно, нам стоит сделать их путь немного сложнее..."

 southafrica.13.t: "Южноафриканские коллективисты сообщают о своих планах проведения выборов"
 southafrica.13.d: "Сегодня Южноафриканская коллективная партия объявила о своих планах в отношении предстоящих выборов, и вот уже в течение нескольких месяцев она подпитывает спекуляции среди относительно низкой избирательной базы о том, что она намерена поддержать коалицию АНК-Лабур-Доминион."
 southafrica.13.a: "КПЮ приняла решение поддержать коалицию АНК во всех ее гонках за Палату представителей."
 southafrica.13.b: "SACP решила бороться за свои места в Палате."

 southafrica.14.t: "Индийская партия Трансвааль устраивает массовый протест"
 southafrica.14.d: "Начнем с относительно небольшой организации, Индейская партия &quot; Трансвааль &quot; выступила с массовым протестом в сильном африканерском штате Трансвааль по поводу недавнего законодательства, которое в значительной степени ограничило индийскую иммиграцию в свете недавнего хаоса в регионе. &quot; Протесты &quot; были на удивление эффективными, несмотря на то, что они были встречены с насилием. &quot; Если мы откажемся от них сейчас &quot; , то мы проявим слабость непосредственно перед выборами. &quot; Но если мы их игнорируем, то &quot; африканцы &quot; в регионе могут взять дело в свои руки &quot; ."
 southafrica.14.a: "Мы можем позволить себе потерять поддержку, верно?"
 southafrica.14.b: "Игнорируй их."

 southafrica.15.t: "Выборы 1937 года"
 southafrica.15.d: "Давно назревшие выборы наконец-то здесь. Лондон с тревогой наблюдает за тем, как южноафриканские избиратели идут на избирательные участки, чтобы выбрать свое правительство на следующие пять лет. За последние два года слияние партий, противоречивое законодательство, экономический крах, забастовки и беспорядки привели к этому..."
 southafrica.15.a: "И победитель..."

 southafrica.16.t: "Коалиция АНК выигрывает"
 southafrica.16.d: "Либеральная коалиция между Африканским национальным конгрессом, Лейбористской партией и Партией Доминиона получила достаточно мест в Палате собрания, чтобы сформировать правительство."
 southafrica.16.a: "Новое правительство."

 southafrica.17.t: "Объединенная партия осуществляет контроль"
 southafrica.17.d: "Несмотря на признаки последних двух лет о том, что хрупкая Объединенная партия рухнет под давлением многих проблем Южной Африки, партии удалось сохранить достаточно своих мест в Палате собрания, чтобы сохранить свое правительство большинства."
 southafrica.17.a: "Похоже, избиратели любят статус-кво."

 southafrica.18.t: "Националисты побеждают на выборах"
 southafrica.18.d: "Национальная партия Очищенные , работающая вместе с спорной партией Рус , смогла получить большинство мест в Палате собрания. Новая волна политической неопределенности охватила Южную Африку."
 southafrica.18.a: "Что это значит для нашего будущего?"

 southafrica.19.t: "Новый генерал-губернатор Южной Африки"
 southafrica.19.d: "Сегодня нынешний генерал-губернатор Южной Африки лорд Хайд объявил о своем намерении уйти в отставку. В последние годы Южная Африка столкнулась со многими растущими проблемами, поэтому вполне уместно назначить нового генерал-губернатора, который сможет справиться с ними. Однако этот вопрос становится следующим: кто-то в нашем кабинете предложил назначить Патрика Дункана, давнего сторонника Империи, которая помогала в борьбе с африканцами во время войны в Буре. Другие же говорят, что назначение Дункана натолкнется на националистов в Южной Африке и усугубит ситуацию, предлагая вместо этого назначить нынешнего премьер-министра Южной Африки Дж.Б.М. Герцога, чтобы успокоить их. Наше решение может оказать непосредственное воздействие на предстоящие выборы в Южной Африке, поэтому мы должны быть осторожными."
 southafrica.19.a: "Нам нужен кто-то вроде Дункана."
 southafrica.19.b: "Герцог - правильный выбор, предложи ему работу."

 southafrica.20.t: "Тройная завязка!"
 southafrica.20.d: "По мере того, как число избирателей по всей стране подсчитывается, мы обнаруживаем, что в палате собрания появился тройной галстук, при этом Объединенная партия, коалиция АНК и коалиция НПП получили равное число мест! Только одно место в провинции Кейп еще не опубликовали свои точные ответы. Все глаза в стране зациклены на этом месте, и все партии с унылым вдохом ждут окончательного результата и заявления следующего правительства Южной Африки."
 southafrica.20.a: "Кандидат от ANC сбивает с толку узкую победу!"
 southafrica.20.b: "Объединённый кандидат выжидает победу!"
 southafrica.20.c: "Кандидат от ННП побеждает одним голосованием!"

 southafrica.21.t: "АНК-НПФ!"
 southafrica.21.d: "Объединённая партия уже признала, что она не получает достаточного количества мест, чтобы получить шанс на большинство. Только одно место в провинции Наталь еще не опубликовано. Все глаза в стране зациклены на этом месте, и обе стороны ждут с унылым дыханием окончательного результата и заявления следующего правительства Южной Африки."
 southafrica.21.a: "Кандидат от ANC сбивает с толку узкую победу!"
 southafrica.21.b: "Кандидат от ННП побеждает одним голосованием!"

 southafrica.22.t: "ANC-Un Tie!"
 southafrica.22.d: "По мере того, как в палате собрания появились выборы по всей стране, мы обнаруживаем, что между ними установилась связь, при этом коалиция АНК и Объединенная партия получили равное число мест! Коалиция НПП еще не признала, но они больше не могут получить достаточно мест для того, чтобы получить шанс на большинство. Лишь одно место в провинции Кейп еще не опубликовано. Все глаза нации зациклены на этом месте, и обе партии ждут с унылым дыханием окончательного результата и заявления следующего правительства Южной Африки."
 southafrica.22.a: "Кандидат от ANC сбивает с толку узкую победу!"
 southafrica.22.b: "Объединённый кандидат выжидает победу!"

 southafrica.23.t: "Юнайтед-НПФ Тье!"
 southafrica.23.d: "По мере того, как в Палату собрания вошло число избирателей со всей страны, мы обнаруживаем, что встала связь между Объединенной партией и коалицией НПП, которая получила равное число мест! Коалиция АНК согласилась, но не получила достаточного количества мест для того, чтобы получить шанс на большинство. Только одно место в провинции Трансвааль еще не опубликовало свои точные ответы. Все глаза в стране застряли на этом месте, и обе стороны с унылым дыханием ждут окончательного результата и заявления следующего правительства Южной Африки."
 southafrica.23.a: "Объединённый кандидат выжидает победу!"
 southafrica.23.b: "Кандидат от ННП побеждает одним голосованием!"

 southafrica.24.t: "Недееспособность"
 southafrica.24.d: "Сегрегация на протяжении длительного времени является пятном для нашей нации как дома, так и за рубежом. Она остается наследием расистского прошлого, и мы преисполнены решимости сделать все, что в наших силах, чтобы не допустить того, чтобы она стала расистским будущим. Сегодня законодателям в Палате собрания удалось принять законопроект, запрещающий все виды сегрегации, которые наше правительство осуществило за последние несколько десятилетий, что, наконец, привело к достижению нашей цели обеспечения национального равенства. Два десятилетия назад каждая южноафриканская политическая партия поддерживала сегрегацию в той или иной форме, но после третьей буровой войны и широкомасштабной политической перестройки, охватившей страну, Южная Африка начала переворачиваться с нового листа / n/nOf курс, есть ли ряд протестующих в Трансваале, Оранжевом свободном государстве и Натале, которые угрожали насилием в ответ. Эти люди, назвав себя Бурс Реборн, будут не чем иным, как проблемой. Уже ряд националистических политиков вышли из намерения присоединиться к ним."
 southafrica.24.a: "Пусть они разгневаются, и мы поступаем правильно."

 southafrica.25.t: "Сегрегация"
 southafrica.25.d: "Южная Африка приняла расистский свод законов и институтов, которые слишком долго дискриминировали ее коренное население. С недавним принятием ряда законопроектов Палата собрания фактически запретила сегрегацию и начала длительный процесс роспуска институтов, которые удерживали Южную Африку от подлинного прогресса на протяжении более полувека. Хотя большинство политических партий в Южной Африке поддержали сегрегацию не более двух десятилетий назад, третья бурская война и последовавшая за этим политическая перестройка привели к созданию новой школы мысли, которая, как мы надеемся, приведет к умеренным реформам. Буры в Трансваале, разумеется, встали на путь, обвинив правительство в коррупции и злоупотреблении властью. Однако для многих в остальной части страны это начало совершенно новой эры, которая, как мы надеемся, принесет мир и стабильность для всех."
 southafrica.25.a: "Мы решили этот вопрос."

 southafrica.26.t: "Морское право закреплено"
 southafrica.26.d: "После третьей бурской войны политические партии закрыли голос Бура от правительства и приняли закон, как они сочли нужным. Но теперь, когда буры контролируют наше правительство, мы видим, что они имеют возможность закрепить политику Бура в законе. Это, несомненно, помешает коренным жителям и жителям Капской провинции, которые продолжают требовать проведения общественного референдума по этому вопросу и угрожают массовым протестам в случае отказа."
 southafrica.26.a: "Они не могут выбирать."

 southafrica.27.t: "Специальная законодательная сессия"
 southafrica.27.d: "Поскольку новое коалиционное правительство АНК находится в палате собрания, премьер-министр призвал к проведению специальной законодательной сессии, призванной решить растущие проблемы в нашей стране. Несмотря на то, что рассматриваемые законопроекты предусматривают широкие права для коренных южноафриканцев, десегрегацию национальных институтов и предоставление ряда концессий протестующим по всей стране. В их списке также содержатся законопроекты, которые закрепят эти права в конституции страны и будут стремиться к дальнейшему сотрудничеству и дружбе с британским правительством. Несмотря на то, что националисты в Палате угрожали бойкотировать сессию, в результате чего многие члены АНК призвали к их исключению из законодательного органа, если они не будут представлены. Такой шаг несомненно вызовет гнев буров в Трансваале, но премьер-министр счел необходимым продолжить историческую сессию. Южная Африка начинает новый путь, и это все, что мы можем сделать, чтобы направить ее в правильном направлении."
 southafrica.27.a: "Давайте начнем обсуждение."

 southafrica.28.t: "Призывы к проведению выборов в Снэп"
 southafrica.28.d: "С каждым днем экономика падает еще дальше и без признаков быстрого восстановления, многие в правительстве, в том числе в нашей собственной партии, оказывают давление на нас, чтобы мы объявили о резких выборах в следующем году. Хотя это, безусловно, входит в наши полномочия, вполне возможно, что такие выборы могут привести к тому, что наша партия потеряет большинство в Палате собрания в недавно сформированной коалиции между АНК, Партией Доминиона и Лейбористской партией или давнишней националистической коалицией между Партией Сентраля, Очищенной Национальной партией и О.Б. . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . ."
 southafrica.28.a: "Пусть начнется предвыборный сезон!"

 southafrica.29.t: "Родится новая нация"
 southafrica.29.d: "Делегаты от всего Южноафриканского союза - от холмов Трансвааль до пустошей Калахари, собрались сегодня в Претории, чтобы подписать декларацию о полной независимости от Соединенного Королевства и Британской империи в целом. Д.Ф. Малан, премьер-министр и лидер Очищенной Национальной партии, заявил, что Союз был сильным, как любая европейская держава, и самым сильным государством на африканском континенте. Слишком долго Южная Африка была омрачена Доминионами Великобритании. Но начиная с сегодняшнего дня мы будем бросать тени. Мы являемся хозяевами нашей собственной судьбы, и Африка является нашей опорой."
 southafrica.29.a: "За свободу!"

 southafrica.30.t: "Передача территорий Верховного комиссара"
 southafrica.30.d: "Южноафриканский союз обратился к нам с просьбой предоставить ему территории Верховного комиссара в Басутоленде и Свазиленде, которыми в настоящее время управляет наше правительство в южной части Африки."
 southafrica.30.a: "Империя всегда будет выплачивать свои долги."

 southafrica.31.t: "Передача территорий Верховного комиссара"
 southafrica.31.d: "Лондон согласился передать нам территории Верховного комиссара, удовлетворенный нашей работой по решению проблем, с которыми наша страна сталкивается на протяжении последнего десятилетия, и мы рады тому, что парламент выполнил свои обещания, однако предстоит еще многое сделать для интеграции этих новых территорий в наш великий Союз."
 southafrica.31.a: "Союз становится все сильнее."

 southafrica.32.t: "Передача Родезии"
 southafrica.32.d: "Союз Южной Африки вновь обратился к нам с просьбой предоставить ему еще одну из наших колоний после передачи территорий Верховного комиссара; эту в Родезии. Родезия , в отличие от территорий, предоставляет нам попрежнему редкие и чрезвычайно ценные ресурсы. Несмотря на то, что эти ресурсы останутся в Империи и АПИ , было бы рискованно отдать их. Родезия -- это последний участок земли, который мы обещали Южной Африке в 1926 году, и, возможно, настало время для рассмотрения их претензий и споров."
 southafrica.32.a: "Родезия - их."

 southafrica.33.t: "Передача Родезии"
 southafrica.33.d: "Родезия была передана под контроль Южной Африки! Празднование длилось долгое время в столице, и Ян Смутс произнес страстную и эмоциональную речь, провозглашающую свою мечту о Большой Южной Африке. Хотя есть и другие территориальные притязания, которые наша нация может продолжать, ни один внешний наблюдатель не может теперь сомневаться в том, что мы величайшая нация на континенте, и легкое величайшее свидетельство автономии и независимости владычества. Радуйся! Радуйся! Радуйся!"
 southafrica.33.a: "Бывший Единый Вирес!"

 southafrica.34.t: "Предложения Южной Африки в отношении закупок в Мозамбике"
 southafrica.34.d: "Сегодня наше правительство получило от Южноафриканского союза предложение об обмене нашей колонией в Мозамбике на крупную сумму денег, мы могли бы, конечно, согласиться продать юго-восточную африканскую колонию, хотя она по-прежнему является ценным местом для торговли, военно-морских баз и ресурсов, главным образом нефти. Продажа колонии может еще больше ослабить наше положение в мире, поскольку она является второй по величине территорией, которой мы сейчас обладаем, и еще больше укрепить соперничающее британское господство..."
 southafrica.34.a: "Нам всегда нужны деньги, продай им колонию."
 southafrica.34.b: "Мозамбик является португальцем."

 southafrica.35.t: "Португалия согласна с нашим предложением"
 southafrica.35.d: "Португалия приняла наше предложение купить свою колонию в Мозамбике! И теперь, после того, как государство незамедлительно осуществило передачу, у нас есть ценный порт на Индийском океане и столь необходимые запасы нефти. Хотя формально Лондону еще предстоит утвердить эту сделку, мы действительно боремся за то, чтобы сплотить наш собственный великий союз. Давайте посмотрим, как был вознагражден наш успех."
 southafrica.35.a: "Теперь мы действительно замечательны."

 southafrica.36.t: "Португалия сокращает наше предложение"
 southafrica.36.d: "Португальское правительство ответило на наше предложение купить Мозамбик сегодня, заявив, что колония не продается."
 southafrica.36.a: "Настоящий позор."

 southafrica.37.t: "Южная Африка оккупирует территории Верховного комиссара"
 southafrica.37.d: "Сегодня поступили сообщения из южной части Африки, где сегодня утром были захвачены и внезапно оккупированы южноафриканскими войсками, а Южная Африка недавно объявила независимость от нашей империи и правления, что технически является нарушением мира и международного права. В то же время эти колонии не принесли нам никакой пользы, и мы еще не признали независимости Южной Африки."
 southafrica.37.a: "Они пытаются проверить наше терпение?"

 southafrica.38.t: "Наша оккупация территорий Верховного комиссара является успешной!"
 southafrica.38.d: "Сегодня министр иностранных дел Великобритании даже опубликовал заявление о том, что Империя решила «передать» нам территории, очевидно, они боятся и не хотят вести войну против нас. Пусть это станет уроком для мира о том, что Британская Империя слаба, и если ее правильно эксплуатируют, может упасть!"
 southafrica.38.a: "Империя нас боится!"

 southafrica.39.t: "Южноафриканские силы маршируют в Родезию"
 southafrica.39.d: "Сегодня наше министерство иностранных дел в панике, когда южноафриканские войска вышли в наши колонии в Родезии и Ньясаленде, начались небольшие стычки между южноафриканскими и имперскими силами, и правительство Южной Африки опубликовало заявление о том, что они намерены оккупировать землю, которую мы обещали в 1926 году."
 southafrica.39.a: "Пусть они заберут его."
 southafrica.39.b: "Давайте научим их, как вести войну."

 southafrica.40.t: "Империя отступает!"
 southafrica.40.d: "Британская империя отступила, отодвинув свои войска из Родезии и Ньясаленда и позволив нашим силам оккупировать их! хотя некоторые партизаны и лояльные сторонники все еще держались и боролись за наш подход, они были скудными и слабыми. Наша победа привлекла нас к себе внимание на мировой арене, и с добавлением этих богатых ресурсами территорий мы сможем выдержать что угодно и бросить вызов кому угодно!"
 southafrica.40.a: "Да здравствует Южная Африка!"

 southafrica.41.t: "Империя возвращается"
 southafrica.41.d: "Лондон решил сражаться за Родезию и Ньясаланд вместо того, чтобы позволить нам забрать его."
 southafrica.41.a: "Черт."

 southafrica.42.t: "Южная Африка требует Мозамбика!"
 southafrica.42.d: "Новое независимое правительство Южной Африки выступило с заявлением, в котором потребовало, чтобы мы передали южную часть нашей колонии в Мозамбике, угрожали военным действиям, если мы откажемся."
 southafrica.42.a: "Отдай колонию, она не стоит войны."
 southafrica.42.b: "Откажись, пусть делают худшее."

 southafrica.43.t: "Португалия Сдает Мозамбик"
 southafrica.43.d: "Португальское правительство согласилось сдать южную часть своей колонии в Мозамбике."
 southafrica.43.a: "Наш Союз растет."

 southafrica.44.t: "Мозамбик требует отказа!"
 southafrica.44.d: "Совершенно очевидно, что за это они готовы умереть."
 southafrica.44.a: "Давайте покажем им нашу решимость."

 southafrica.45.t: "Новые старты"
 southafrica.45.d: "На протяжении десятилетий мир рассматривал Южную Африку как международную шутку, как пример того, как не управлять страной. В частности, речь шла о наших бесконечных притязаниях на земли вокруг нас, которые мы никогда не пытались реализовать. Теперь, отказавшись от этих бессмысленных притязаний и открывая путь дружбы с окружающими государствами, мы вступили в новое начало в нашей репутации за рубежом. Мы продемонстрируем миру нашу силу посредством нашего единства, а не слабости посредством наших бессмысленных притязаний."
 southafrica.45.a: "В новую эру!"


 southafrica.49.t: "АНК объявляет новую коалицию"
 southafrica.49.d: "В связи с предстоящими в июне неожиданными выборами Африканский национальный конгресс объявил о том, что он создаст коалицию вместе с Партией труда и Доминиона в попытке получить большинство мест в Палате собрания. Несмотря на то, что парламент еще больше оскорбил националистов, он прибег к Статуту автономии, чтобы конкретно отменить наш закон, запрещающий небелым баллотироваться на выборах. Новая коалиция воспользовалась этим, и все три партии решительно высказались за расширение связей с Соединенным Королевством наряду с либеральной политикой десегрегации и культурного примирения. Они даже выдвигают небелых кандидатов в ряде избирательных округов. Бур и националистические политики ампутировали эти планы как «радикальные», так и «разрушительные» и «разрушили для нации» и перевернули свое законодательство в Соединенном Королевстве. Сейчас мы можем только надеяться, что это не приведет к еще большему хаосу на и без того хаотичных выборах."
 southafrica.49.a: "Они просто пытаются поджечь Буров?"

 southafrica.50.t: "Отклонение от наших притязаний"
 southafrica.50.d: "В Законе о Южной Африке 1909 года британский парламент наметил шаги для будущего расширения Южной Африки, начиная с аннексии Родезии, Бечуаналенда и территорий Верховного комиссара. Позднее были расширены обещания, с тем чтобы включить Северную Родезию и Ньясаленд. На протяжении многих лет южноафриканские политики одержимы захватом этих земель, утверждая, что они обязаны нам договором. Это продолжается так долго, что отвлекает правительство от вопросов, вызывающих реальную озабоченность, в том числе от проблем сегрегации и несправедливости, существующих в нашем обществе. От своих притязаний на эти колонии мы показываем миру, что мы готовы двигаться дальше, и готовы к созданию лучшего государства, а не большего."
 southafrica.50.a: "У нас нет необходимости в дальнейшем расширении."

 southafrica.51.t: "Выполнять наши требования"
 southafrica.51.d: "В Законе о Южной Африке 1909 года британский парламент наметил шаги для будущего расширения Южной Африки, начиная с аннексии Родезии, Бечуаналенда и территорий Верховного комиссара. Позднее были расширены обещания, с тем чтобы включить Северную Родезию и Ньясаленд. На протяжении многих лет мы пытались выполнить положения договора, а парламент в Лондоне нет. Теперь, когда наша нация в гораздо более стабильной форме, некоторые члены правительства начали вновь призывать к возобновлению переговоров с Великобританией и обеспечению безопасности обещанных земель раз и навсегда."
 southafrica.51.a: "Давайте убедимся, что Британия выполнит свои обещания."


 southafrica.55.t: "Наша собственная империя"
 southafrica.55.d: "Южная Африка была основана с целью стать бастионом европейской власти в Африке. Со временем эта цель была в значительной степени забыта. Южная Африка сегодня является страной власти и силы, но она уже не находится под большим влиянием Европы. Свободный от своих желаний, Южноафриканский союз имеет одну конечную и неизбежную судьбу; перестроить Африку в своем видении. На протяжении слишком долгого времени европейские державы поселили колонии в Африке и наживаются на этих поселенцах, не заботясь о них. Сегодня конец этой позиции близок. Сильнейшие всегда будут править тем, что они принимают, и нашей судьбой будет захватывать земли, которые они слишком долго слепы. Некоторые во всем мире зовут нас утонченными, или обманчивыми. Но это всего лишь попытка скрыть свои истинные эмоции; страх. Пусть они верят в свою безопасность, когда они бьют друг друга до смерти в Европе; наша судьба в Африке ждет."
 southafrica.55.a: "Пусть мир трепетает!"


 southafrica.60.t: "Спонсоры мятежников"
 southafrica.60.d: "В Восточной Африке поселенцы, проживающие в Танганьике, давно хотели создать собственное независимое государство. В Западной Африке коренные жители и оппортунистические поселенцы на протяжении долгого времени вызывали антифранцузское возмущение в надежде на то, что когда-нибудь произойдет успешная серия восстаний. Некоторые члены кабинета предложили, чтобы финансирование мятежников в этих и других районах давало нам преимущество, когда неизбежно вспыхнет война между нами и Европой. Другие в правительстве говорят, что мы должны только поддерживать мятежников-поселенцев, и в то же время другие говорят, что мы не должны вообще спонсировать их, и что революционеры часто кусают руку, которая их питает."
 southafrica.60.a: "Только спонсирует британских мятежников."
 southafrica.60.b: "Спонсировать британских и французских мятежников!"
 southafrica.60.c: "Может быть, спонсирование мятежников не такая уж хорошая идея..."

 southafrica.61.t: "Южная Африка хочет присоединиться к Штальпакту"
 southafrica.61.d: "Сегодня наше правительство получило петицию от националистического правительства Южной Африки с просьбой о месте в нашем Стальмическом пакте. Южная Африка, если мы их впустим, предоставит нам место стратегического значения против британских колоний в Африке. Многие в нашем правительстве поддерживают принятие нации, в то время как некоторые более нерешительны, предпочитают сохранить союз на европейском уровне. Следует также отметить, что нынешняя южноафриканская правящая коалиция включает в себя «Валькистов», хотя они и являются валькистами только по имени. Они стремятся отделить и сегрегировать, и разрешение им войти в нашу коалицию может запятнать наш имидж среди остального неприсоединившегося мира."
 southafrica.61.a: "Они станут полезным союзником против британцев!"
 southafrica.61.b: "Они нам не нужны."

 southafrica.62.t: "Германия принимает петицию Штальпакта"
 southafrica.62.d: "Немецкое правительство приняло нашу петицию о присоединении к Столпакту, о большом праздновании среди членов нашего правительства, они полностью поддерживают наши планы по освобождению Африки и станут чрезвычайно полезным союзником, отвлекающим британцев и французов, когда мы в конечном итоге войдем на войну."
 southafrica.62.a: "Единство во власти!"

 southafrica.63.t: "Германия отвергает петицию Штальпакта"
 southafrica.63.d: "Немецкое правительство отклонило нашу петицию присоединиться к Штальпакту, что вызывает большую озабоченность среди членов нашего правительства. Многие обеспокоены тем, что мы не можем взять в свои руки европейские колониальные державы и что Германия была важным союзником в борьбе с ними. Любые планы, которые мы будем делать отсюда, мы делаем это, подвергая крайнюю угрозу безопасности нашей нации."
 southafrica.63.a: "Они нам все равно не нужны!"


 southafrica.70.t: "Большая Южная Африка"
 southafrica.70.d: "Наше правительство на протяжении последних нескольких месяцев неустанно трудилось над разработкой внешней политики, которая сделала бы нас действительно более великой нацией. На протяжении многих лет южноафриканские лидеры призывали к расширению Южной Африки, как если бы только приобретение земли сделало бы нацию великой. Хотя мы рассматривали эти выдающиеся претензии на территориальную экспансию, мы также рассматривали бы мнение международного сообщества о нас. Сегодня наше положение в остальной части мира лучше, чем когда-либо. Сегодня мы создали для себя новое начало; новое начало для того, что по сути является новой нацией. Сегодня Южная Африка действительно больше, не только из-за ее территории, но и из-за ее народа и ее силы на основе единства. Мы велики, потому что мы едины."
 southafrica.70.a: "Бывший Единый Вирес!"

 southafrica.71.t: "Наконец-то независимость!"
 southafrica.71.d: "Наша страна боролась с испытаниями и страданиями, соперничающими лишь несколькими. На протяжении десятилетий наш народ подвергался угнетению и эксплуатации со стороны британцев, но сегодня этот кошмар — это не больше. Мы стоим сильны не через единство, а через силу. Мы продемонстрировали, что мы более чем способны стоять на мировой сцене, не как Доминион власти в тысячах миль от нас, а как независимая нация - нет, независимая империя, способная захватить земли, которые она желает. Мы более чем просто едины, как любили говорить либералы и консерваторы. Мы могущественны. И в этом мире сила исходит от силы."
 southafrica.71.a: "Бывший Империум Вирес!"


 southafrica.81.t: "Новый премьер-министр"
 southafrica.81.d: "Теперь, когда либеральная коалиция между Партией АНК, лейбористов и Доминиона пришла к власти в Претории, пришло время избрать нового премьер-министра страны. Трое мужчин выдвинули свои имена; А.Б. Кума, Уильям Эндрюс и Чарльз Сталлард. nnStallard очень далеко и далеко от него, как лидер сбежавшей партии Доминиона, он всегда сохранял спокойную голову и выступал за более тесные связи с Империей. Он является ненаступательным выбором, который, конечно, эффективен. А.Б. Ксума, напротив, является подлинным либералом. Лидер Партии АНК, он был бы первым лидером нации, который, несомненно, приблизил бы Боэрса к оружию, если бы он был выбран. Но это не должно быть посланием, которое мы отправили бы остальному миру. И наконец, есть Уильям Эндрюс, лидер Партии труда. Эндрюс - сильный защитник профсоюзов и либеральной реформы работы, но неопасен расистский, и мог бы вызвать дальнейшее разделение в наших рядах."
 southafrica.81.a: "А.Б. Ксума будет представлять новое поколение лидеров!"
 southafrica.81.b: "Уильям Эндрюс свяжет нас с коммандером!"
 southafrica.81.c: "Чарльз Сталлард - это здравый выбор."

 southafrica.82.t: "Следующий премьер-министр"
 southafrica.82.d: "Поскольку Союзная партия была переизбрана большинством голосов в палате собрания, она пытается определить, кто будет выполнять функции премьер-министра страны на следующий срок."
 southafrica.82.a: "Герцог останется премьер-министром."
 southafrica.82.b: "Пора передать позицию Смутсу."

 southafrica.83.t: "Новый премьер-министр"
 southafrica.83.d: "Теперь, когда националистическая коалиция между ПНП, Сентралем и Партией СБ пришла к власти в Претории, пришло время избрать нового премьер-министра страны. Двое мужчин выдвинули свои имена; Тиэльман Рус и Д.Ф. Малан. nnRoos уже несколько лет ведут сбежавшую партию и продемонстрировали необыкновенную способность вести вокруг культа личности. Если бы он был выбран, он был бы эффективным, хотя он и мог бы отнять у нас наше великое видение. Малан, с другой стороны, был архитектором нашей победы и долгое время планировал на будущее, которое мы будем теперь стремиться создать. Он был бы очевидным, даже оскорбительным, выбором. Любой человек, который мы выберем, будет руководить нашей страной в предстоящие трудные времена, так что мы должны сделать свой выбор тщательно и мудро."
 southafrica.83.a: "Д.Ф. Малан приведет нас в новое будущее."
 southafrica.83.b: "Тильман Рус должен занять эту должность."


 southafrica.85.t: "Буря растёт"
 southafrica.85.d: "Сегодня националистические политики оставляют столицу в массовом порядке. Обычно буерские ополчения в сельской местности замолчали. Мы все еще ходим изо дня в день, проходя реформы после реформы, но теперь нет больше ни протеста, ни жалоб. Только молчание. Некоторые утверждают, что напряженность, которая на протяжении многих лет нарастала между Империей и Бурами - между правой и плохой, хорошей и злой - вот-вот разорвется, и гражданская война снова поглотит Южную Африку. Другие говорят, что Буры просто отступают, и что мы, наконец, победили их в их собственной игре. Несмотря на то, что мы будем продолжать проводить реформы и делать Южную Африку лучше... не важно, что будет стоить."
 southafrica.85.a: "Что-то не так..."


 southafrica.90.t: "Интеграция в законодательном порядке"
 southafrica.90.d: "Новое правительство не застопорилось в принятии ряда новых законов и реформ, затрагивающих все аспекты жизни и экономики Южной Африки. Сегодня Палата собрания приняла - в основном партийное голосование - обширный пакет законопроектов, направленных на законодательное закрепление интеграции коренных африканцев в общество. До настоящего времени под правлением различных националистических политиков коренные жители были козлом отпущены на все нужды страны и впоследствии подверглись дискриминации с помощью различных правовых и аморальных методов. В течение следующих пяти лет эта новая серия законов будет постепенно распускать аппарат сегрегации и апартеида и предоставлять социальное равенство и свободу всем коренным африканцам. В то время как националисты, как они и в старые времена, кричали и кричали в залах Дома, простая истина в том, что их дни расизма и неравенства закончились, и только начинается новая золотая эра для Южной Африки."
 southafrica.90.a: "Южная Африка начнет новую жизнь."
 southafrica.90.b: "Южная Африка должна начать новую работу."

 southafrica.91.t: "Автономия для трансваалов"
 southafrica.91.d: "Сегодня Объединенное правительство Южной Африки приняло пакет законопроектов, направленных на расширение автономии провинции Трансвааль. В то время как некоторые политики из коалиции АНК протестовали против этих законопроектов, большинство проголосовали за них, когда они были наконец поставлены на голосование в Палате собрания. Среди прочего, эти законопроекты позволят Трансваалу организовать свой собственный парламент, принять собственные местные законы и придерживаться несколько иных стандартов, чем остальная часть страны. Хотя этот шаг не идеален для тех, кто надеялся создать более жесткий и централизованный союз, даже премьер-министр признал, что необходимо предпринять шаги для того, чтобы подавить волнения буров в сельской местности и приступить к возвращению страны к нормальной жизни."
 southafrica.91.a: "Давайте успокоимся."

 southafrica.92.t: "Наша новая конституция"
 southafrica.92.d: "Сегодня националистическое правительство Южной Африки приняло новую конституцию для управления страной, которая была принята Палатой собрания без единого голосования, и, хотя Соединенное Королевство откажется признать ее легитимность, она станет фактическим законом страны для Союза. Однако, написав эту новую конституцию, некоторые внутренние дебаты в рамках коалиции поставили под угрозу ее надлежащее осуществление и признание. Некоторые члены коалиции - главным образом валькисты - выступают за включение положений, которые укрепили бы нашу стабильность и стремились бы создать стабильную и прочную систему. Другие же члены Очищенной национальной партии, напротив, выступают за положения, которые обеспечивали бы сохранение националистического правления в обозримом будущем."
 southafrica.92.a: "Мы сосредоточимся на создании собственной силы."
 southafrica.92.b: "Мы сосредоточимся на построении прочного общества."


 southafrica.94.t: "Вспышки в Кейптауне"
 southafrica.94.d: "Прошлой ночью, в ответ на закрепление политики Бура в качестве закона, в Кейптауне произошли беспорядки, мужчины и женщины коренного происхождения, наряду с белыми поселенцами, вандализмом в магазинах, штурмом правительственных зданий и обстрелом полицейских сил. Некоторые сообщения даже указывают на волнения и неуверенность в полиции города. Некоторые члены правительства призывают к немедленной оккупации города с контингентом вооруженных сил, что вызовет напряжение у наших военных в самое трудное время. Однако, если мы позволим бунтам продолжиться, они, несомненно, подорвут нашу легитимность как правительства и ослабят наше домашнее положение в самый худший возможный момент."
 southafrica.94.a: "Пошлите армию и оккупируем город."
 southafrica.94.b: "Пусть бунты идут своим чередом."

 southafrica.95.t: "Восстановление после революции - восстановление нашей промышленности"
 southafrica.95.d: "С завершением нашей долгой войны против националистов Бура мы должны начать восстановление нашей нации после нанесенного ей ущерба. Мы должны прежде всего определить приоритеты в нашей промышленности; без нее мы не сможем восполнить запасы наших армий или сохранить народ в мире. Национализировав промышленность Южной Африки, мы сможем быстро и эффективно восстановить ее, не дожидаясь свободного рынка для того, чтобы восстановить нашу страну. Многие в правительстве уже поддерживают такой шаг и просто ждут, когда законопроект будет вынесен на голосование."
 southafrica.95.a: "Медленно, но верно, мы восстановимся."

 southafrica.96.t: "Восстановление после Револьта - восстановление нашей армии"
 southafrica.96.d: "Шрамы от нашей недавней войны против буров по-прежнему наиболее заметны в нашей армии, мы потеряли много людей в конфликте, и мы должны пополнить запасы и реорганизовать наших солдат, если мы хотим сохранить мир в ближайшем будущем."
 southafrica.96.a: "Восстановление - это длительный процесс."

 southafrica.97.t: "Восстановление после Револьта - восстановление нашего правительства"
 southafrica.97.d: "Институт, который понес наибольший ущерб от восстания буров, был нашим правительством. Граждане открыто ставят под сомнение его легитимность и способность защищать нацию, и в предстоящие дни большая часть членов Палаты собрания могут уйти в отставку после того, как наша промышленность и армия в основном оправятся до предконфликтного уровня. Чтобы восстановить доверие общественности к системе и обеспечить создание структуры, которая будет поддерживать мир в обозримом будущем, необходимо провести полномасштабную реформу нашего правительства."
 southafrica.97.a: "Давайте излечим наши старые раны и начнем сначала."

 southafrica.98.t: "Референдум в Родезии"
 southafrica.98.d: "Сегодня избиратели отправились на избирательные участки в Родезии, чтобы проголосовать за то, стать ли колонией, независимой от Южной Африки, под правлением Британской империи."
 southafrica.98.a: "Союз стоит сильней!"

 southafrica.99.t: "Референдум в Родезии"
 southafrica.99.d: "Сегодня избиратели отправились на избирательные участки в Родезии, чтобы проголосовать за то, оставаться ли колонией, независимой от Южной Африки, под правлением Британской империи."
 southafrica.99.a: "Хорошо."

 southafrica.100.t: "Четвертая буровая война"
 southafrica.100.d: "С тех пор, как коалиция АНК пришла к власти и начала проводить столь необходимые реформы, Южная Африка, как никогда ранее, выглядела более нестабильной. В то время как некоторые политики и избиратели высказывались в поддержку обеспечения равенства и интеграции всей страны, некоторые группы продолжают сопротивляться. Большинство из них — это буры. С момента окончания третьей буровой войны во время Великой войны Южная Африка, как никогда ранее, жила в относительном мире и гармонии. В то время как в стране, по мнению многих, в стране происходит определенное примирение. Тем не менее, сегодня один из них будет встречен лишь с насмешкой."
 southafrica.100.a: "Мы восстановим порядок в Южной Африке!"
 southafrica.100.b: "Мы восстановим Южную Африку для Африканеров!"

 southafrica.101.t: "Четвертая буровая война"
 southafrica.101.d: "С тех пор, как Соединенное Королевство объявило о своем намерении объединить все свои колонии и Доминионы в единую имперскую федерацию, Южная Африка, казалось, стала еще более нестабильной, чем когда-либо прежде. В то время как политики в Объединенной партии пытались урегулировать некоторые беспорядки, некоторые группы продолжают сопротивляться. Наиболее разгневанные на всех — Буры. С момента окончания третьей Бурской войны во время Великой войны Южная Африка жила в относительном мире и гармонии. В то время как боевые действия были жестокими, многие верили в определенную степень примирения в стране. Однако, предположим, что сегодня один из них будет встречен только с осмеянием. nn The Boers — в четвертый раз менее чем за 60 лет — подняли уровень восстания против Империи. Нежелание позволить им получить свою автономию в ходе широкомасштабных реформ АНК, кажется, что эта Боэрская война уже добилась успеха в проведении рейда многих оружейных складов по всей Южной Африке и захватила большую часть территории вслед за ними. Более страшно, некоторые воинские подразделения Южной Африки вышли на сторону Бура. Кажется, что эта война может быть более кровной, чем любая до нее."
 southafrica.101.a: "Мы восстановим порядок в Южной Африке!"
 southafrica.101.b: "Мы восстановим Южную Африку для Африканеров!"

 southafrica.102.t: "Судьба Восточной Африки"
 southafrica.102.d: "Сейчас, когда бывшая германская колония Танганьика находится под нашим контролем, у нас появилась возможность создать свое собственное государство в восточной части Африки, включая несколько других британских колоний, которые мы захватили или планировали захватить вокруг нее. Такое восточноафриканское государство давно мечтает о нескольких дальновидных политических деятелях, которые, несомненно, спрыгнут за эту возможность, другие говорят, что мы должны управлять землей напрямую и поставить всю Африку под наше правление. Что нам делать с завоеванной территорией?"
 southafrica.102.b: "Учредить режим сотрудничества."
 southafrica.102.c: "Восточная Африка принадлежит только Южной Африке!"

 southafrica.103.t: "Создание Восточноафриканского государства"
 southafrica.103.d: "С учетом того, что в Восточной Африке в настоящее время создано кооперационистское государство, мы оказались в положении, когда нам приходится занимать посты в его правительстве, хотя эти усилия могут быть дорогостоящими, мы считаем, что они окупятся в будущем, особенно в продолжающейся борьбе против европейских империалистов."
 southafrica.103.a: "Укрепить правительство, достойное нашей поддержки."

 southafrica.104.t: "Создание египетского государства"
 southafrica.104.d: "Теперь, когда Египет находится под нашим контролем, у нас есть возможность создать собственное государство, включающее колонии в Судане и Сахаре, которые мы захватили или планировали захватить. Мы сами будем управлять Суэцким каналом, независимо от того, создадим мы это государство или нет, но освобождение Египта может быть полезным для дальнейшей поддержки в нашем стремлении к независимости от империализма. В то же время, некоторые считают, что мы должны сохранить прямой контроль над землей для улучшения доступа к ее ресурсам."
 southafrica.104.b: "Учредить режим сотрудничества."
 southafrica.104.c: "Египет принадлежит только Южной Африке!"

 southafrica.105.t: "Создание Абиссинского государства"
 southafrica.105.d: "Сейчас, когда Абиссиния находится под нашим контролем, у нас есть возможность создать свой собственный штат, включающий колонии в Сомали и Эритрее, которые мы захватили или планировали захватить. Государство и его народ будут покорны нам, независимо от того, создадим мы его или нет, но освобождение Абисинии под руководством администрации поселенцев может быть полезным для дальнейшей поддержки нашего видения африканских колоний, которые могут управлять сами собой. В то же время некоторые считают, что мы должны сохранить прямой контроль над землей для улучшения доступа к ее ресурсам. Что мы будем делать с завоеванной территорией?"
 southafrica.105.b: "Учредить режим сотрудничества."
 southafrica.105.c: "Абиссиния принадлежит только Южной Африке!"

 southafrica.109.t: "Ревны в Калахари!"
 southafrica.109.d: "Сейчас, когда наша война против буров все еще продолжается, до нас доходят сообщения о вооруженных ополчениях немецких симфатизеров на территории Калахари! Мы не знаем, что обещало им бурское «правительство», но теперь они нападают на наши арсеналы и запасы оружия на западе и заявляют о поддержке остальных мятежников в стране. И без того еще усугубилась ситуация."
 southafrica.109.a: "Ещё бунтовщики?"

 southafrica.110.t: "Мы победим!"
 southafrica.110.d: "С падением правительства Южной Африки и значительной частью ее территории, находящейся под нашим контролем, британское правительство согласилось прекратить все боевые действия и сдаться нам всем бывшей территории его Доминион. Несмотря на то, что мы находимся сейчас в условиях величайшего достижения буров, многие лидеры мятежников начали призывать к восстановлению южноафриканского государства под националистическим контролем, конечно, хотя это может быть соблазном держать земли за пределами Трансвааля в полной анархии, мы никуда не доберемся с нашими достижениями без реформирования независимой Южной Африки."
 southafrica.110.a: "Реформировать правительство - под нашим контролем."

 southafrica_britain.1.d: "Из Претории прибыла шокирующая передача. Правительство Южно-Африканского Союза в одностороннем порядке объявило о своей независимости от Короны и Британской империи. Эта базовая предательство разорвала все узы верности и долга. Нельзя допустить, чтобы этот мятежный акт выстоял. Мышь остается жизненно важным стратегическим звеном в нашей имперской цепи, и позволить одному Доминиону просто &quot; уйти &quot; создает катастрофический прецедент. Вопрос, стоящий перед правительством Его Величества, заключается не в том, должны ли мы отвечать, а в том, как. Положить ли мы на этих подопечных всю мощь наших вооруженных сил, или же мы позволим им укрыться в их предполагаемой независимости, отрезанной от любой имперской торговли и изолированной на мировой сцене? Нужна твердая рука."

 southafrica_britain.2.d: "Наше заявление о суверенитете было встречено с ботинком тирана! Британия ответила на наше мирное стремление к самоопределению объявлением войны. Лондон вновь считает, что оно может покорить свободный народ этой земли огнем и сталью. Британцы думают, что они могут просто уничтожить нас, как они пытались сделать с Бурскими республиками. Они найдут нас теперь другой нация: объединённая по своей цели и железной воле. От мыса до Лимпопо мы будем сражаться за каждый дюйм нашей родины. Это борьба за наше выживание!"

 southafrica_britain.3.d: "Остановившись от полномасштабной войны, Великобритания прибегла к своим старым трюкам. Горячий Альбион , не имея возможности проглотить нашу свободу, ввел полное экономическое эмбарго в отношении нашей нации. Этот карательный акт направлен на то, чтобы задушить нашу новую республику в колыбели, отрезать нас от рынков и ресурсов империи, которые они так ревнивно ордируют. Они не верят, что они могут уморить нас голодом, что мы вернемся к ним, в капюшоне. Они недооценивают нашу решимость. Экономическая блокада будет трудной, конечно, но она лишь подтвердит нашу решимость установить нашу собственную судьбу и найти новых партнеров, уважающих наш суверенитет."

 southafrica_total_hct_death.1.d: "Поскольку власть Соединенного Королевства полностью рухнула, давний статус территорий Высоких комиссий достиг критического этапа. На протяжении десятилетий управление Басутолендом и Свазилендом остается точкой трений, при этом Лондон упорно сохраняет контроль над этими анклавами в самом центре нашего субконтинента. ~Нет, теперь, когда британцы не в состоянии обеспечить их оборону или административное содержание, эти территории находятся в состоянии неустойчивой изоляции. Будучи главной силой в южной части Африки, мы должны предотвратить полный срыв порядка. Передвигая наши силы через границы и формально интегрируя эти земли, мы наконец можем исправить эти исторические аномалии и обеспечить, чтобы Союз был завершен. Эпоха вмешательства Уайтхолла на нашем заднем дворе окончена."

 #### Decisions ####
 SAF_Fate_of_Africa: "Судьба Африки"
 SAF_Fate_of_Africa_desc: "С тем чтобы наше завоевание Африки прошло гладко, мы должны приступить к планированию того, как наилучшим образом разделить континент."
 puppet_east_africa: "Создание Восточноафриканского государства"
 puppet_east_africa_desc: "Наш бывший премьер-министр Ян Смутс всегда любил Восточную Африку, полагая, что система европейских государств может наилучшим образом использовать ресурсы региона."
 puppet_egypt: "Создание египетского государства"
 puppet_egypt_desc: "Египет уже давно находится под гнетом Британской империи, как и наша собственная нация, но в отличие от Южной Африки они до сих пор не могут освободиться."
 puppet_abyssinia: "Создание абиссинского государства"
 puppet_abyssinia_desc: "Абиссиния была свободна от европейского влияния на протяжении тысяч лет, одного из единственных мест в Африке, где удалось избежать безумного сумасшествия в конце XIX века, однако теперь, когда она сдалась нам, пришло время прочно установить страну под нашим контролем."

