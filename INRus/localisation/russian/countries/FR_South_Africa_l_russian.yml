 ZAF_Disorganized_Rebels: "Неорганизованное восстание"
 ZAF_Disorganized_Rebels_desc: "Наше восстание против южноафриканских предателей, хотя оно и является эффективным, в значительной степени дезорганизовано, и мы должны преодолеть это препятствие, если мы хотим получить реальный шанс против армий Империи и ее лакеев."

