 #### Description ####
 SAF_FUHRERREICH_DESC: "Третья бурская война, восстание националистов африкаанеров во время Великой войны, привела к изгнанию Буров из южноафриканской политики и подъему новой нации, основанной, по крайней мере частично, на целостности и равенстве. Сегодня буры снова на подъеме, и южноафриканцы должны спорить о том, хотят ли они оставаться частью империи, которая принимает их как должное или разделяет и выстраивает свой собственный, опасный новый путь."


