 #### Ideas ####
 SAF_Black_Wednesday: "Экономическая катастрофа"
 SAF_Black_Wednesday_desc: "Крушение Лондонского фондового рынка сильно ударило по Южной Африке."
 SAF_Black_Wednesday2: "Экономический кризис"
 SAF_Black_Wednesday2_desc: "Глобальное экономическое крушение сбивает с толку нашу внутреннюю экономику, но мы начали усилия правительства по вмешательству в попытке смягчить и в конечном итоге обратить вспять его последствия."
 SAF_Black_Wednesday3: "Экономический кризис"
 SAF_Black_Wednesday3_desc: "Глобальная экономическая катастрофа сбивает с толку нашу внутреннюю экономику, и мы не можем рисковать потерять политическую власть в результате вмешательства правительства. Осторожность -- это лучший способ исправить свою ошибку."
 SAF_Black_Wednesday4: "Экономический кризис"
 SAF_Black_Wednesday4_desc: "Наши усилия по вмешательству в экономический кризис нашей страны были в значительной степени успешными, хотя нам еще предстоит пройти долгий путь."
 SAF_Black_Wednesday5: "Экономический кризис"
 SAF_Black_Wednesday5_desc: "Наше решение держаться подальше от экономического кризиса начинает приносить плоды."
 SAF_Black_Wednesday6: "Экономическое восстановление"
 SAF_Black_Wednesday6_desc: "Мы очень близки к завершению выздоровления из Лондонского фондового рынка."
 SAF_Black_Wednesday7: "Экономическое восстановление"
 SAF_Black_Wednesday7_desc: "Скоро рынки исправят свои ошибки."
 SAF_Rhodesia_Unrest: "Беспокойство в Родезии"
 SAF_Rhodesia_Unrest_desc: "Несмотря на то, что более десяти лет назад народ Родезии стал частью нашей страны, он продолжает сопротивляться полной интеграции в наш Союз, что на протяжении многих лет является серьезным бременем для нашей экономики, и многие члены Палаты собрания потратили свою карьеру, пытаясь решить все более неразрешимую проблему."
 SAF_Integration_Resist: "Сопротивление интеграции"
 SAF_Integration_Resist_desc: "Конфликт между бурами и остальной частью южноафриканского общества - это конфликт, который, насколько это возможно, тянется назад, и его последствия продолжают сохраняться и сегодня. Бурс , проживающие в Трансваале или Оранжевом свободном государстве , будут противодействовать любым усилиям нашего правительства, направленным на дальнейшую интеграцию коренных жителей Южной Африки в наше общество в качестве полуравных. Продолжающиеся проблемы культуры и управления нашей нации в этой области, как представляется, разрывают нашу нацию на две части -- то, что, по мнению некоторых членов Палаты, вполне возможно, если ничего не будет сделано."
 SAF_Boer_Legacy: "Наследие буровых войн"
 SAF_Boer_Legacy_desc: "В то время как бурские войны стоили нашему обществу и нашему народу много за последние полвека, они также преподали нам ценные уроки в том, как вести войну, особенно в сфере партизанской войны."
 SAF_Boer_Legacy1: "Наследие буровых войн"
 SAF_Boer_Legacy1_desc: "В то время как бурские войны стоили нашему обществу и нашему народу много за последние полвека, они также преподали нам ценные уроки в том, как вести войну, особенно в сфере партизанской войны."
 SAF_Boer_Legacy2: "Наследие буровых войн"
 SAF_Boer_Legacy2_desc: "В то время как бурские войны стоили нашему обществу и нашему народу много за последние полвека, они также преподали нам ценные уроки в том, как вести войну, особенно в сфере партизанской войны."
 SAF_Anti_British_Sentiment: "Антибританские настроения"
 SAF_Anti_British_Sentiment_desc: "В течение последнего десятилетия Британская империя постоянно наступала на спины южноафриканского народа, чтобы достичь процветания. С момента отмены своих территориальных обещаний нашему Союзу до их прямого отказа принять Вестминстерский статут парламент в Лондоне продемонстрировал, как мало они относятся к нашему народу, и поэтому чувство антибританского настроения в настоящее время пронизывает нашу нацию и продолжает оказывать влияние на нашу внутреннюю и внешнюю политику."
 SAF_Boers_Enraged: "Боэрс в ярости."
 SAF_Boers_Enraged_desc: "В то время как мы работаем над реформой Южной Африки, с тем чтобы она стала лучшей нацией, буры становятся все более и более неуправляемыми, угрожая открытым восстанием, когда их расистская мечта рушится на глазах."
 SAF_Integrated_Society: "Комплексное общество"
 SAF_Integrated_Society_desc: "Южная Африка на протяжении десятилетий борется с проблемами расы и сегрегации, хотя страна далека от совершенства и пока еще не завершена работа, Южная Африка официально представляет собой интегрированное, а не сегрегированное общество, которое является первым из многих шагов к новому расе в нашей истории и началу новой, более широкой нации."
 SAF_Integrated_Society1: "Восстановление прав коренных народов"
 SAF_Integrated_Society1_desc: "Коренные южноафриканцы, которые были здесь задолго до европейских поселенцев, заслуживают таких же прав, как и остальные народы."
 SAF_Integrated_Society2: "Законное равенство"
 SAF_Integrated_Society2_desc: "Некоторые южноафриканцы, в частности буры, решительно выступают против предоставления равных прав и юридического равенства всей стране."
 SAF_Integrated_Society3: "Билль о правах"
 SAF_Integrated_Society3_desc: "Закрепив Билль о правах в законе, Палата собрания успешно продемонстрировала миру, что Южная Африка готова, наконец, вступить в XX век и избавиться от расистского мышления своих старых сегрегационных правительств."
 SAF_Stabilized_Society: "Стабилизированное общество"
 SAF_Stabilized_Society_desc: "Всего несколько лет назад Южная Африка была далека от стабильности, и некоторые даже опасались краха всего общества, но сегодня наше общество стабилизировалось благодаря многочисленным законам и актам, принятым палатой собрания, которая работала над избавлением нации от сегрегационных институтов и созданием новой, равноправной страны для всех."
 SAF_Stabilized_Society1: "Будущие гарантии"
 SAF_Stabilized_Society1_desc: "Предупредив протестующих о том, что мы будем следовать гарантиям в будущем, мы фактически продвинулись вперед по многим вопросам, дав нам сегодня время улучшить наше правительство, с тем чтобы справиться с ними, когда придет время."
 SAF_Stabilized_Society2: "Пророческие перемены"
 SAF_Stabilized_Society2_desc: "Перемены никогда не бывают лёгкими для нации, но обещая, что это так же просто, как и безвредно, и идет долгий путь в подавлении волнений."
 SAF_Stabilized_Society3: "Статус QuoStencils"
 SAF_Stabilized_Society3_desc: "Хотя лишь несколько лет назад южноафриканское общество находилось на грани краха, сегодня оно стало более стабильным, чем когда-либо ранее."
 SAF_Independent_Society: "Независимое общество"
 SAF_Independent_Society_desc: "Наконец, свободное от тирании британского угнетения и законов, южноафриканское общество возродилось в условиях свободы и братства."
 SAF_Independent_Society1: "Политика удаления"
 SAF_Independent_Society1_desc: "В то время как либералы в Южной Африке всегда хотели обеспечить равенство масс, правительство, находящееся у власти, чертовски заинтересовано в навязывания стабильности железным кулаком."
 SAF_Independent_Society2: "Новые суды"
 SAF_Independent_Society2_desc: "Старые суды Южной Африки, основанные на британском законодательстве и превосходстве, были коррумпированными и слабыми."
 SAF_Independent_Society3: "Новая конституция"
 SAF_Independent_Society3_desc: "Новая конституция, разработанная националистическим правительством Южной Африки, требует создания независимого государства и ряда радикальных и систематических изменений, которые осуждаются большинством остальных стран мира, но не видят никакого сопротивления в полуавторитарном государстве, в котором Южная Африка стала."
 SAF_British_Friendship: "Британская дружба"
 SAF_British_Friendship_desc: "Дружба между южноафриканцами и их британским бретереном вдохнула новую жизнь в южноафриканское общество, поощряя сотрудничество и сдерживая националистическую риторику, которая на протяжении десятилетий терзала его правительство."
 SAF_Independence_at_Last: "Наконец-то независимость"
 SAF_Independence_at_Last_desc: "Южная Африка полностью свободна и независима от своих когда-то британских повелителей."
 SAF_Ver_Supply: "Вещество"
 SAF_Ver_Supply_desc: "Железнодорожные линии снабжения позволяют проводить более масштабные операции на глубине территории противника и могут, при необходимости, помочь солдатам выбраться из задницы."
 SAF_Scorched_Earth: "Политика в отношении Земли"
 SAF_Scorched_Earth_desc: "Разрушая землю, за которую ведется война, армии могут обеспечить друг другу голод и ослабление партизанской деятельности, которая может произойти за линиями фронта."
 SAF_Land_Supply: "Жить за пределами земли"
 SAF_Land_Supply_desc: "Обучение солдат жить не только за счет поставок, но и за счет земли, которую они занимают, имеет решающее значение для создания идеальной армии, способной совершать длительные наступательные действия."
 SAF_British_Shipbuilding: "British Shipbuilding"
 SAF_British_Shipbuilding_desc: "Если мы хотим иметь флот, способный соперничать с другими Доминионами, мы должны поглотить нашу гордость и продолжать полагаться на британцев в строительстве наших кораблей."
 SAF_South_African_Shipbuilding: "Южноафриканское судостроение"
 SAF_South_African_Shipbuilding_desc: "Союз более чем способен построить флот, способный соперничать с остальным миром в одиночку, нам не нужно полагаться на британцев, чтобы строить наши корабли."
 SAF_Boer_Revolt: "Бур револьт"
 SAF_Boer_Revolt_desc: "Противодействие южноафриканскому правительству со стороны националистов Бура разрушило нашу индустрию и оставило на нашем обществе долговременные шрамы, которые мы будем бороться за исцеление."
 SAF_Boer_Revolt2: "Бур револьт"
 SAF_Boer_Revolt2_desc: "Ущерб, нанесенный нашей промышленности националистами Бура, в настоящее время восстанавливается, но наша армия и правительство по-прежнему находятся в близком положении внутри страны, пока мы все еще боремся за исцеление."
 SAF_Boer_Revolt3: "Бур револьт"
 SAF_Boer_Revolt3_desc: "Ущерб, нанесенный нашей промышленности и армии националистами Бура, в настоящее время восстанавливается, но наше правительство по-прежнему находится на грани внутренних проблем, пока мы все еще боремся за исцеление."


