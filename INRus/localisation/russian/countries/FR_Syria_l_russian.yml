 SYR_antun_saadeh: "Антун Саадэх"
 SYR_antun_saadeh_leader_desc: "Родившийся в Бейруте в православной христианской семье, Антун Саадх является человеком, обладающим многими талантами и незначительным терпением, после того как он прожил половину своей жизни за границей на западе, Антун вернулся на родину в 1930 году, в результате чего во время Великой войны и французской оккупации его родины Сааде основал Сирийскую социал-националистическую партию, политическую партию, приверженную продвижению социал-национализма, усовершенствованию синкретизма социалистических и националистических идей, которые Сааде развил в свое время за границей, был арестован французскими властями в 1933 году, когда он публично сообщил о существовании партии, но его вера в Сирию, освобожденную от оков западного империализма и объединенную принципами социализма, нерушима."
 
