 #Foreign
 frahun.1.d: "Венгерское правительство подошло к Парижу с срочной просьбой укрепить свой военный потенциал, несмотря на региональную нестабильность и угрозу ревизионистов-соседей, Будапешт стремится приобрести несколько сотен батарей наших современных артиллерийских орудий, в то время как наши собственные запасы находятся в приоритетном порядке для внутренней перевооруженности, выполнение этой просьбы не только обеспечит чистую сумму для наших промышленных секторов, но и обеспечит, чтобы потенциальный союзник на Востоке был надлежащим образом оснащен для поддержания своей линии, должны ли мы послать ящики или оставить оружие для наших собственных дивизий?"
 frahun.2.d: "В качестве шага, который мог бы коренным образом изменить баланс сил в Центральной Европе, венгерское правительство официально ходатайствовало о вступлении в Континентальный союз."


