 ### General ###
 hungary.1.t: "Статус Венгрии"
 hungary.1.d: "На рассвете Великой войны Венгрия вела транслейтанскую половину Австро-Венгерской империи и пользовалась значительной автономией в рамках империи. В то время как австрийская армия постоянно сражалась в Галисии и Италии на фронтах, венгерская армия была отведена на пограничную оборону и гарнизоны. Когда австро-венгерская империя была близка к кончине, венгерское собрание подавляющим большинством проголосовало за отделение от Австрии и присоединение к Защите, пообещав, что ее территориальная непристойность не будет нарушена. Через три дня австрийская венгерская империя развалилась, а будущее Венгрии казалось безопасным. Несмотря на то, что венгерская армия была в состоянии позора, и в какой-то момент слабости поддерживаемая Советским Союзом коллекционистка Бела Кун вел Будапешт с его красным ополчением и провозгласила их венгерскую Советскую Республику. Франко-сербийские солдаты, вместе с румы и чехословаками, быстро вторгаясь и изгнанная Бела Кун в Россию. Когда премьер-министр Венгрии, Миха Кароли, просила, чтобы она напознала, не вснялась напозналась в свои войска, и не оставлялалась в будущем, и не оставлялалась в свои руки, и не о том, чтобы врагом, он, а врагом, он, он, он, был, был, он, был, а врагом, был назван, а врагом, и в 19 лет, чтобы, был, и врагом, был, был, был, и врагом, чтобы он, был, был, был, был, был, был, был, был, был, был, и влюбен, был, и в 19 х, чтобы х, чтобы х, чтобы х, чтобы х, был х, чтобы х, был, был, был, был х, был х, х, х, х, х, х, х, х, х, х, х, х, х, х, х, х, х, х,"
 hungary.1.a: "Захватывающе!"

 ### Black Wednesday ###

 hungary.2.t: "Лондонский Крэш попадает в Венгрию!"
 hungary.2.d: "Мы все знали, что этот роковый день настанет. Ужасающие последствия Лондонского Крэша наконец-то захлестнули Венгрию. Цены во всей стране растут тревожными темпами, и даже стоимость хлеба превышает 6000 форинтов. Похоже, все станет намного хуже, пока не станет лучше, и Венгрия, которая попадает на другую сторону этой катастрофы, будет, безусловно, сильно отличаться от той, которая существует сегодня. К счастью, несколько экономических путей были заранее запланированы для краха рынка, но не этого масштаба. Мы должны направить все имеющиеся ресурсы на урегулирование этого экономического кризиса, чтобы наши соседи не воспользовались нашим ослабленным государством."
 hungary.2.a: "Мы должны немедленно приступить к работе!"

 ### Demanding a Truce ###

 hungary.3.t: "Оппозиция отрицает перемирие!"
 hungary.3.d: "Как мы и ожидали, и Бела Кун, и Хорти отклонили нашу просьбу о мирном урегулировании кризиса в нашей стране, и у нас нет иного выбора, кроме как принять решительные меры для обеспечения стабильности в будущем."
 hungary.3.a: "Оружие..."

 ### purging kun 1 ###

 hungary.4.t: "Красная Милия атакует гражданские фабрики!"
 hungary.4.d: "Мы столкнулись с решительным сопротивлением в наших усилиях по очищению Белы Кун и его Красной милиции."
 hungary.4.a: "Удвойте наши усилия!"

 ### purging kun 2 ###

 hungary.5.t: "Красная Милия ударяет по военным фабрикам!"
 hungary.5.d: "По мере того, как наши усилия увеличиваются, растет жестокость нападений Белы Кун, он использует все имеющиеся в его распоряжении ресурсы в надежде удержать нас от дальнейших действий, у нас нет другого выбора, кроме как продолжать атаку, и загнать крысу в угол."
 hungary.5.a: "У нас почти есть этот ублюдок."

 ### purging kun 3 ###

 hungary.6.t: "Красная милиция разрушает инфраструктуру"
 hungary.6.d: "В последний раз, пытаясь спасти себя от полного уничтожения, Красная Милия разогнала огромные массивы инфраструктуры по всей нашей стране, возможно, это был акт злобы, или акт ненависти. В любом случае, мы сомневаемся, что у Красной милиции есть еще какие-то трюки в рукавах, и скоро Бела Кун будет у нас под стражей."
 hungary.6.a: "Как загнанные в угол крысы..."

 ### Budapest conference 1 ###

 hungary.7.t: "Будапештская конференция"
 hungary.7.d: "С уступками, которые мы передали нашим врагам, они согласились встретиться в Будапеште, чтобы обсудить, как положить конец этому национальному кризису."
 hungary.7.a: "Начнем?"

 ### Budapest conference 2 ###

 hungary.8.t: "Начинается Конференция"
 hungary.8.d: "По всему городу большая напряженность. Граждане дышат тихо, зная, что тысячи террористов, сидящих за городскими границами, чёрные рубашки и красные милитамены пялятся друг на друга, ожидая первого шага. Но все это, все это, есть странно спокойная атмосфера в конференц-зале. Кароли, Кун и Хорти все сидят за круглым столом, делая маленькие разговоры, шутки и пьют прекрасное вино. Пока ночь тянется, маленький прогресс достигается, пока Кароли не заговорит. -- Джентльмены, как все мы наслаждаемся этой встречей, мы должны спуститься вниз. -- Как Кун, так и Хорти согласны, этот кризис не может больше ждать. Как Кун, так и Хорти выдвигают свои требования, каждый из которых желает контроля над страной. -- Несмотря на последующие часы дискуссий и переговоров, Кароли наконец пришел к выводу..."
 hungary.8.a: "Будет сформировано левое коалиционное правительство (это не понравится Хорти)"
 hungary.8.b: "Будет сформировано правое коалиционное правительство (это не понравится Куну)"
 hungary.8.c: "Стража, арестуйте этих предателей!"

 ### General election 1 ###

 hungary.9.t: "Всеобщие выборы"
 hungary.9.d: "Первоначально намеченный на 1932 год, но приостановленный из-за действий Красной милиции и Черных футболок, угрожающих разорвать нацию, настало время восстановить выборы и продолжить демократический процесс."
 hungary.9.a: "Социальные консерваторы побеждают!"
 hungary.9.b: "Социал-демократы победили!"
 hungary.9.c: "Социальные либералы побеждают!"
 hungary.9.e: "Рыночные либералы побеждают!"

 ### Transylvania accepts truce ###

 hungary.10.t: "Трансильвания принимает наше предложение!"
 hungary.10.d: "Сегодня мы получили письмо от Брасова, Трансильванское правительство решило принять наше предложение о заключении договора о ненападении."
 hungary.10.a: "Теперь на следующий этап нашего плана..."

 ### Crisis prelude 1 ###

 hungary.11.t: "Собрание Красной милиции в Косице!"
 hungary.11.d: "Красная Милита была рассеяна по Венгрии с момента их создания, но наши разведчики сообщают, что вокруг города Косице в Южной Словакии находится большая концентрация сил Красной Армии. Люди устроили лагерь всего в нескольких милях от города, и гарнизон боится нападения на город в любой момент. Похоже, что Бела Кун укрепляет свою власть, и если он не остановится в ближайшее время, он может попытаться захватить власть над страной."
 hungary.11.a: "Возможно, бездействие - это не решение..."

 ### Crisis prelude 2 ###

 hungary.12.t: "Черные футболки похищают правительственного чиновника!"
 hungary.12.d: "В первые часы дня группа людей, преданных делу Хортии, смогла проникнуть в дом правительственного чиновника и взять его в заложники. Эта ужасная новость оставляет нам очень ужасный выбор. Мы можем принять требования о выкупе и признаться этим террористам, или изменить их решительность и стоичность перед лицом давления. Ни один из этих вариантов не является особенно хорошим, но какой у нас есть другой выбор?"
 hungary.12.a: "Мы не ведем переговоры с террористами..."
 hungary.12.b: "Мы примем разумные требования..."

 ### Crisis prelude 3 ###

 hungary.13.t: "Праздники Красной милиции в Косице"
 hungary.13.d: "Красная милиция засела за пределами Косице ровно целый год, и вчера они решили, наконец, войти в город в так называемой «мирной демонстрации»."
 hungary.13.a: "Это толпа злобных социалистов, как мы можем потерять их след?"

 ### Crisis prelude 4 ###

 hungary.14.t: "Черные футболки и столкновения между красными ополчениями в Пече"
 hungary.14.d: "Сегодня жители города Печ вспыхнули из-за грозных потрясений, исходящих из-за пределов города. Местный гарнизон сообщил о двух больших группах людей, которые стреляли друг в друга на поле непосредственно за городом. По ходу дня боевые действия росли в магнитиде и в размерах, пока чернокожие не взяли на себя инициативу и не штурмовали западные окраины города. В то время как боевые действия продолжались долгое время до вечера, они зашли в тупик, когда обе стороны заявили о победе над другим. Многие гражданские лица были ранены и убиты, а в ходе боевых действий было повреждено несколько дорог и зданий. Эти действия не могут продолжаться, и эти два сумасшедших должны предстать перед судом."
 hungary.14.a: "Мы застопорились достаточно долго..."

 ### Buying French Artillery ###

 hungary.15.t: "Предложение купить французское оружие"
 hungary.15.d: "Договор Энниси, возможно, запретил нам держать в руках более 5000 артиллерийских орудий, но, возможно, мы сможем придумать предложение купить французское оружие за единовременную сумму."
 hungary.15.a: "Отправь предложение!"

 ### France accepts artillery offer ###

 hungary.16.t: "Франция принимает наше предложение!"
 hungary.16.d: "Французы согласились продать нам свою артиллерию, что является прямым нарушением Договора Энниси, который они сами нам продиктовали, и, возможно, это свидетельствует о том, что Договор можно игнорировать или, по крайней мере, принимать с меньшим авторитетом."
 hungary.16.a: "Будем надеяться, что нам никогда не придется использовать против них их собственное оружие..."

 ### France declines artillery offer ###

 hungary.17.t: "Франция отклоняет наше предложение."
 hungary.17.d: "К сожалению, французы отклонили наше предложение купить свое старое оружие, и последовали за ним с суровым предупреждением о том, что продолжающаяся политика перевооружения будет встречена жесткими угонщиками, и мы должны действовать осторожно, если мы хотим избежать повторения Великой войны."
 hungary.17.a: "Может, вместо денег мы сможем купить автоматы для монгола..."

 ### France let's us into the Continential Entente ###

 hungary.18.t: "Мы были допущены в континентальный союз"
 hungary.18.d: "Французская делегация прибыла и информировала нас о том, что французы приняли нашу просьбу о допуске в континентальный союз, что является знаменательным событием для всей Венгрии, и мы, несомненно, обеспечили наше будущее."
 hungary.18.a: "Теперь мы можем импортировать багетти?"

 ### France declines CE request ###

 hungary.19.t: "Франция не позволила нам войти в Континентальный Континент."
 hungary.19.d: "В удивительном повороте событий французы официально отклонили нашу просьбу о присоединении к Континентальному сосуществованию. Несмотря на растущую напряженность в Европе, французы нашли, что в их интересах отделить нас и отстранить от своего союза. Это мрачный день для нашей нации, и мы остались в весьма непристойной позиции."
 hungary.19.a: "Возможно, британцы будут добрее..."

 ### Hungary proposes joint research ###

 enghun.1.t: "Венгрия предлагает совместный исследовательский проект"
 enghun.1.d: "Дипломаты из Венгрии обратились к нам с предложением объединить усилия Оксфордского университета с усилиями своего собственного университета в Будапеште. Хотя Оксфорд является лигами над Будапештом с точки зрения ацедамии, это может послужить главным примером для того, чтобы вовлечь Венгрию в сферу нашего влияния. Иметь союзника на континенте было бы полезно, если бы немцы или французы когда-либо решили действовать, но это также может лишь помешать нам и стать бременем. Как мы ответим?"
 enghun.1.a: "Напряжённое предложение!"
 enghun.1.b: "Мы не будем заключать сделки с Магиярами."

 ### England acceps ###

 hungary.19.t: "Оксфорд принимает наше предложение!"
 hungary.19.d: "Мы отправим студентов в Англию сразу же, чтобы начать этот проект, и в течение нескольких недель мы пожнем находки."
 hungary.19.a: "Это приблизит нас к Британии."

 ### England declines ###

 hungary.20.t: "Оксфорд отклоняет наше предложение."
 hungary.20.d: "Сегодня Оксфордский университет направил нам письмо, в котором говорилось, что они не хотят, чтобы мы принимали участие в их исследованиях, что нанесло ущерб нашим отношениям с Великобританией, и наши шансы на вступление в Имперский альянс защиты значительно уменьшились из-за этого."
 hungary.20.a: "Это очень прискорбно."

 ### England gives CAS/fighter/tac bomber ###

 hungary.21.t: "Соединенное Королевство выдает нам лицензию на КАС!"
 hungary.21.d: "Соединенное Королевство разрешило нам создать наши собственные варианты одной из их моделей Scoint Air Support! Хотя это не так много, как мы просили, мы должны быть благодарны и широко использовать лицензию."
 hungary.21.a: "Наконец-то, небо будет нашим..."
 ###
 hungary.22.t: "Соединенное Королевство выдает нам лицензию на участие в боевых действиях!"
 hungary.22.d: "Великобритания разрешила нам создать наши собственные бриенты одной из их моделей истребителей! Хотя это не так много, как мы просили, мы должны быть благодарны и использовать лицензию."
 hungary.22.a: "Наконец-то, небо будет нашим..."
 ###
 hungary.23.t: "Соединенное Королевство выдает нам лицензию на тактических бомбардировщиков!"
 hungary.23.d: "Соединенное Королевство дало нам разрешение создать наши собственные варианты одной из их тактических моделей бомбардировщиков! Хотя это не так много, как мы просили, мы должны быть благодарны и использовать лицензию."
 hungary.23.a: "Наконец-то, небо будет нашим..."

 ### England declines license request ###

 hungary.24.t: "Соединенное Королевство отклонило нашу просьбу."
 hungary.24.d: "К сожалению, Великобритания решила не выдавать нам лицензии на производство своих самолетов, нам придется использовать свои собственные модели, если мы хотим укротить небо."
 hungary.24.a: "В любом случае, Spitfire - это низкосортный самолёт..."

 ### England accepts IPA request ###

 hungary.25.t: "Соединенное Королевство позволяет нам войти в АПИ!"
 hungary.25.d: "Чудесные знания из Лондона. Правительство Соединенного Королевства разрешило нам войти в Имперский альянс защиты! Это резко увеличило наши шансы на выживание, и наша власть над Балканами также значительно возросла. Это очень важный момент в нашей истории, и мы должны хорошо использовать наших новых союзников."
 hungary.25.a: "Боже, спаси короля!"

 ### England declines IPA request ###

 hungary.26.t: "Соединенное Королевство запретило нам работать в АПИ."
 hungary.26.d: "В заявлении, сделанном непосредственно из Букингемского дворца, Соединенное Королевство отклонило нашу просьбу присоединиться к АПИ."
 hungary.26.a: "Они совершили серьезную ошибку."

 ### Horthy seizes power ###

 hungary.27.t: "Хорти штурмует столицу!"
 hungary.27.d: "После периода молчания многие думали, что черные футболки вернулись в тень, но сегодня это оказалось неверным. Рано утром несколько кварталов Будапешта загорелись огнем, когда черные футболки вылились на улицу и столкнули местный гарнизон обратно в центр города. Сражения были дикими, когда мужчины боролись за отдельные здания и комнаты, но в конце концов Черные футболки смогли захватить гарнизон и захватить полный контроль над городом. Михали Кароли лично вытащили на улицу, где он столкнулся с самой Хорти. После долгой и расширительной речи Кароли был казнен и его тело повешено для всех Будапешта. Хорти сейчас контролирует Венгрию, и многие внимательно следят за тем, что делает сумасшедший."
 hungary.27.a: "Магьяршаг Ёркке Сзабад!" #Hungarian is a very strange language indeed.

 ### Serbia doesn't cede Bosnia ###

 hungary.28.t: "Сербия отказывается от наших требований!"
 hungary.28.d: "Замечая события 1914 года, упрямые сербы отказались от наших требований в отношении боснийских земель и удвоили свои позиции."
 hungary.28.a: "Мы захватим Боснию силой!"
 hungary.28.b: "Босния не стоит этих усилий."

 ### Serbia surrenders Bosnia during war ###

 hungary.29.t: "Сербия предлагает Боснии мир."
 hungary.29.d: "Наши сербские враги полностью побеждены, и они не в состоянии защититься от нашей высшей армии."
 hungary.29.a: "На шаг ближе к воссоединению..."

 ### Croatian Revolt begins ###

 hungary.30.t: "Хорватия объявляет себя зависимой!"
 hungary.30.d: "Смертоносные новости, несколько регионов на юге нашей страны объявили одностороннее подчинение Венгрии и сформировали «хорватское временное правительство», сосредоточенное в Загребе. Местный гарнизон был перегружен, и хорватское правительство заявило, что между нашими двумя нациями существует состояние войны. Хорваты будут сражаться до горького конца за свою зависимость, и мы должны раздавить это восстание, прежде чем оно распространится."
 hungary.30.a: "Эти славяне никогда не уходят, не так ли?"

 ### Croatia wins their independance ###

 hungary.31.t: "Хорватия побеждает в их независимости."
 hungary.31.d: "Мы не можем победить хорватов вместе, не говоря уже о себе. Хорватия будет иметь свое государство до тех пор, пока следующая крупная война не позволит нам вернуть наши законные территории."
 hungary.31.a: "Это день, который будет жить в беспорядке..."

 ### Germany let's Hungary into Stahlpakt ###

 hungary.32.t: "Германия, давайте войдем в Пакт Стали!"
 hungary.32.d: "Немецкий эммиссар сообщил нам сегодня, что мы теперь официальные члены альянса Пакт Стали . С немцами у нас за спиной мы сможем обеспечить наше правление над Балканами с гораздо большей властью, чем прежде, и наше будущее будет защищено немцами."
 hungary.32.a: "Началась новая эра для нашей нации."

 ### Germany declines Stahlpakt application ###

 hungary.33.t: "Германия не позволит нам присоединиться к Пакту Стали."
 hungary.33.d: "К сожалению, как представляется, немцы решили не пускать нас в Пакт Стали."

 ### Transylvania declines anchluss ###

 hungary.34.t: "Трансильвания опозорила нас!"
 hungary.34.d: "Похоже, что Трансильванское правительство не воспринимало наши требования всерьез. Они отвергли нас и практически осмелились приехать за ними. Мы можем отпустить эти заявления и отступить от наших низших врагов, или мы можем отказаться от претензий."
 hungary.34.a: "Трансильвания того не стоит."
 hungary.34.b: "Мы никогда не откажемся от своих притязаний!"

 ### Serbia doesn't cede West Banat ###

 hungary.35.t: "Сербия отказывается от наших требований!"
 hungary.35.d: "В самом глупом шаге сербское правительство отказалось от наших требований о передаче Западного Баната и сильно вооружило регион."
 hungary.35.a: "Мы отступаем."
 hungary.35.b: "Мы не боимся сербов."

 ### Zap keeps Slovakia ###

 hungary.36.t: "Западославия отказывается от наших требований!"
 hungary.36.d: "Как представляется, наши усилия по спасению Словакии были тщетными, поскольку Западославия решительно отвергла наши требования."
 hungary.36.a: "Словакия в любом случае бесполезна."
 hungary.36.b: "Мы не можем бросить словаков!"

 ### Italy doesn't cede Ljubljana ###

 hungary.37.t: "Италия отказывается уступить Любляне!"
 hungary.37.d: "В шаге, который, как мы не можем сказать, был совершенно неожиданным, итальянское правительство отказалось передать нам состояние Любляны. Итальянская армия достаточно велика, и их индустрия гораздо более развита, чем наша. Война против них была бы очень неразумной, но есть шанс, что мы сможем сбить их с толку, если нам повезет."
 hungary.37.a: "Любляна не стоит того."
 hungary.37.b: "Любляна по праву наша!"

 ### Bela Kun siezes power ###

 hungary.38.t: "Бела Кун бурь в Будапеште!"
 hungary.38.d: ""
 hungary.38.a: "Новая эра социализма захватила нашу нацию."

 ### Kun vs Horthy showdown battle ###

 hungary.39.t: "Битва за Будапешт!"
 hungary.39.d: "Граждане Будапешта сегодня были взволнованы звуком взрывов и кандаловых обстрелов. Красная милиция и черные футболки собрали все силы, которые у них есть, и решили воевать прямо за городскими границами. Несколько небольших городов уже были выровнены и был причинен огромный ущерб полям вокруг города. Гарнизон находится в состоянии повышенной боевой готовности, и несколько бродячих снарядов уже приземлились в городе, причинив ущерб нескольким зданиям и убивая гражданских лиц. Тем не менее президент дал четкий приказ не воевать с врагом и позволить им уничтожить друг друга, а не враждовать с ними. Немногие считают, что это будет решающей битвой, и проигравший, вероятно, пострадает и потерпит непоправимое поражение."
 hungary.39.a: "Черные футболки победили."
 hungary.39.b: "Красная Милиция победила."

 ### Socialist Elections ###

 hungary.40.t: "Первые венгерские социалистические выборы"
 hungary.40.d: "Правительство решило разрешить проведение свободных выборов до тех пор, пока партии отвечают определенным критериям."
 hungary.40.a: "Нынешнее правительство побеждает!"
 hungary.40.b: "Коллективисты победили!"

 ### fighters or heavy fighters? ###

 hungary.41.t: "Выбор бойцов"
 hungary.41.d: "Мы решили сосредоточиться на малых истребителях, но мы должны выбрать, на каких из них мы хотели бы сосредоточить наши усилия."
 hungary.41.a: "Обычные бойцы лучше всего служат нашим интересам."
 hungary.41.b: "Тяжелые бойцы лучше всего служат нашим интересам."

 ### tac or strat bombers? ###

 hungary.42.t: "Выбор бомбардировщиков"
 hungary.42.d: "Мы должны выбрать, на каком типе бомбардировщиков мы хотели бы сосредоточить наши усилия. Оба типа бомбардировщиков имеют свои наряды и минусы, и этот выбор может повлиять на нашу победу или поражение на поле боя."
 hungary.42.a: "Тактические бомбардировщики больше всего подходят для наших нужд."
 hungary.42.b: "Стратегические бомбардировщики больше всего отвечают нашим потребностям."

 ### CAS or naval bombers? ###

 hungary.43.t: "Выбор поддержки"
 hungary.43.d: "Пехотные подразделения не могут выиграть войну в одиночку, а поддержка с воздуха является жизненно важным аспектом победы на местах."
 hungary.43.a: "КАС проложит путь к победе"
 hungary.43.b: "Мы будем править морями с военно-морскими бомбардировщиками."

 ### Hungary asks for Slovakia ###

 hungary.44.t: "Венгрия просит о передаче словацкого опекунства"
 hungary.44.d: "Венгерская нация находится на крайне неуступчивом пути, пытаясь вернуть земли, которые она потеряла 20 лет тому назад, и мы стали повелителем Словакии после краха Западославии, и земли быстро оказываются больше бременем, чем преимуществом. Земля очень отличается от немецкой, и в Карпатских горах мало отраслей промышленности. Передача земель Венгрии увеличит наши отношения и повысит силу нашего союзника на юге."
 hungary.44.a: "Это соглашение подходит нам обоим."
 hungary.44.b: "Мы не будем кормить наших будущих врагов!"

 ### Zap surrenders South Nitra ###

 hungary.45.t: "Западославия седлает Южную Нитра."
 hungary.45.d: "Венгерское население успешно провело референдум в Южной Нитре, проголосовав за вступление в Венгрию! Граждане всей страны радуются сегодня, когда семьи, разделенные на протяжении более двух десятилетий, наконец-то воссоединились друг с другом. Десятки тысяч венгерцев были возвращены в свою законную нацию, и мы на шаг ближе к объединению всех венгерских народов под единым знаменем."
 hungary.45.a: "Теперь мы должны смотреть на Истварда..."

 ### Zap doesn't surrender South Nitra ###

 hungary.46.t: "Западославия накладывает вето на референдум в Южном Нитране!"
 hungary.46.d: "Правительство Западослава приняло решение наложить вето на референдум в Южной Нитре по вопросу об объединении с Венгрией, что является возмутительным актом, с которым нельзя мириться, и мы должны принять меры по освобождению нашего народа."
 hungary.46.a: "К оружию!"
 hungary.46.b: "Мы не можем позволить себе войну в это время."

 ### Zap offers peace ###

 hungary.47.t: "Правительство Западослава предлагает уступки в пользу мира."
 hungary.47.d: "Наши армии очень быстро продвигаются через Западославию, но нас медленно останавливают в высоких горах и глубоких укреплений."
 hungary.47.a: "Условия разумны, мы согласны."
 hungary.47.b: "Неприемлемые условия, Западославия истечет кровью!"

 ### offer peace to Zap ###

 hungary.48.t: "Предложить мир Западославии?"
 hungary.48.d: "Мы совершили серьезный просчет, сравнивая многоэтническую армию нашего северного врага с нашей собственной, и мы теряем позиции на всех фронтах."
 hungary.48.a: "Предложи им мирные условия."
 hungary.48.b: "Смерть является предпочтительной альтернативой капитуляции."

 ### Zap declines ###

 hungary.49.t: "Западославия отклоняет нашу просьбу о мире"
 hungary.49.d: "Похоже, что Северные славяне готовы отомстить, и они отбросили все идеи мира, происходящие между нашими двумя нациями."
 hungary.49.a: "Тёмные дни впереди."

 ### Hungary asks soviets to join 3rd int. ###

 hungary.50.t: "Венгрия подает заявление о присоединении к третьему Международному"
 hungary.50.d: "Революция рабочих в Венгрии увенчалась полным успехом, и теперь наши социалистические братья официально просят, чтобы они присоединились к Третьему Интернационалу, что даст нам стратегический рубеж в Европе и позволит нам проникнуть в гнилое ядро Германии и принести революцию во всю Европу."
 hungary.50.a: "Добро пожаловать, наши социалистические братья!"
 hungary.50.b: "Нам не нужны магии, чтобы взвесить нас."

 ### Soviets accept offer ###

 hungary.51.t: "Советы впустили нас в Третий Интернационал!"
 hungary.51.d: "Мы получили официальный ответ от Москвы, они решили удовлетворить нашу просьбу присоединиться к своей всемогущей фракции."
 hungary.51.a: "Работники Европы, ваш день освобождения близок!"

 ### Soviets decline offer ###

 hungary.52.t: "Советы не позволили нам войти в третью Международную организацию."
 hungary.52.d: "В официальном заявлении из Москвы советское правительство решительно отклонило нашу просьбу присоединиться к ним в процессе освобождения Европы."
 hungary.52.a: "Русские пожалеют об этой ошибке."

 ### Bulgarian coup win ###

 hungary.53.t: "Болгарская Кубок успешна!"
 hungary.53.d: "Сегодня болгарские ополченцы атаковали Софию и быстро захватили столицы. Болгарская Народная Республика была провозглашена в Софии, и они согласились подписать с нами пакт о ненападении. Вскоре мы сможем превратить ее в официальный союз ."
 hungary.53.a: "Революция становится сильнее."

 ### Demand the return of Dobrudja from Romania ###

 hungary.54.t: "Болгария требует Добруджа"
 hungary.54.d: "Новое коллективистское правительство Болгарии, поддержанное Венгрией, потребовало незапланированного возвращения Добруджи, мы сражались и потеряли много солдат за земли Добруджи, но венгерское инквизиция Трансильвании означает, что мы можем столкнуться с вторжением со всех сторон, если мы хотим упасть."
 hungary.54.a: "Добруджа не стоит крови."
 hungary.54.b: "Мы не дадим ни дюйма земли!"

 ### Horthy Revokes the Treaty of Annecy ###

 hungary.55.t: "Хорти отменяет Договор Энниси"
 hungary.55.d: "Хорти взял под свой контроль правительство и начал реконструировать политическую систему нашей нации. Одной из самых насущных проблем является Договор Энниси, который с момента его подписания в 1921 году нанес ущерб нашей стране. Горти заявил сегодня в Будапеште, что Договор Энниси недействителен, и его положения уже не действуют. Мы надеемся столкнуться с жестким политическим сопротивлением, но шансы любой нации на военные действия практически нулевы."
 hungary.55.a: "Начинается новая эра для Венгрии."

 ### Kun Revokes the Treaty of Annecy ###

 hungary.56.t: "Кун меняет Договор Энниси"
 hungary.56.d: "Кун взял под свой контроль правительство и начал реконструировать политическую систему нашей нации. Одной из самых насущных проблем является Договор Энниси, который с момента его подписания в 1921 году нанес ущерб нашей стране. Кун заявил сегодня в Будапеште, что Договор Энниси недействителен и его положения уже не действуют. Мы надеемся столкнуться с жестким политическим сопротивлением, но шансы любой нации на военные действия практически нулевы."
 hungary.56.a: "Начинается новая эра для Венгрии."

 ### Flavour event 1 ###

 hungary.57.t: "Угольный шахтер ударил по Зобаку!"
 hungary.57.d: "Большая группа шахтеров на шахте Зобак сегодня официально пошла на забастовку и отказывается вернуться в шахту, не удовлетворяя своих требований. Местный владелец шахт заверил нас, что этот вопрос будет решен на местном уровне и что нам не нужно беспокоиться о ситуации. ~ nnStell, очевидно, что люди, находящиеся под нашим правлением, все больше недовольны, и люди могут вскоре съехаться в Красную Милию или Черные футболки, если мы не сможем улучшить их условия."
 hungary.57.a: "Драт!"

 ### Flavour event 2 ###

 hungary.58.t: "Смерть Десса Костолани"
 hungary.58.d: "Легендарный венгерский поэт Дессю Костоланьи трагически умер сегодня в своем доме. Он был известен своей бесценной ролью в активизации венгерской литературы, а также своими переводами таких великих произведений, как "Ромео и Джульетта" Шекспира и "Алиса в Чудесной стране" Льюиса Костоляни несколько лет боролся с раком, и многие знали, что оставшееся у него время было коротким. В последние годы он рассказывал истории о своем детстве и писал много рассказов, как выдуманных, так и реальных."
 hungary.58.a: "Его будет не хватать."

 ### Horthy crowns himself king, selfish bastard ###

 hungary.500.t: "Хорти сам коронется королем Венгрии."
 hungary.500.d: "Шокирующим шагом Венгерский регент решил, что вместо того, чтобы позволить иностранцу снова сесть на венгерском троне, он сам возродит венгерскую корону и «восстановит венгерскую корону до своей прежней славы»."
 hungary.500.a: "Да здравствует король Хорти!"

 ### Horthy crowns Karl I king ###

 hungary.600.t: "Хорти возвращает Карла I на венгерский трон."
 hungary.600.d: "Миклош Хорти объявил сегодня в Будапеште, что Карл И фон Габсбург-Лоррейн должен был взять венгерский трон и немедленно покончить с недолговечной репутацией. Это повысит стабильность венгерского правительства, но многие опасаются, что Хорти просто использует Карла как марионетку, чтобы править Венгрией из теней. Несмотря на то, что Габсбургы были возвращены в Венгрию после того, как они были изгнаны почти ровно 20 лет назад. Карл, как сообщается, направляется в Будапешт из своей ссылки в Швейцарию и в ближайшие несколько дней заберет трон."
 hungary.600.a: "Да здравствует король Карл!"

 ### Horthy invites Transylvanian noble ###

 hungary.700.t: "Хорти приглашает Дженни Баркса занять венгерский трон."
 hungary.700.d: "Удивительно, что Миклош Хорти решил пригласить Трансильванского дворянского, Дженчан Барксай, взять венгерский трон и принять власть. Хотя многие скептически относятся к легитимности нового короля, многие рады, что на трон наконец-то сесть кто-то, кто не является габсбургом. Многие верят, что это приблизит нас к Трансильвании и позволит обеспечить мирное воссоединение двух исторических регионов."
 hungary.700.a: ""Любовь, живой король Барксай!""

 #### CENTROSLAV-HUNGARIAN EVENTS ####

 cenhun.1.t: "Словацкие восстания!"
 cenhun.1.d: "Братислава сообщила нам сегодня, что союз Чехии и Словакии недействителен и что словаки создали свое собственное зависимое государство. Это ужасная новость, и мы не можем позволить им просто уйти. Однако многие верят, что они пользуются поддержкой венгров, и маловероятно, что мы сможем одновременно и венгерцев, и словаков."
 cenhun.1.a: "Словаки присоединятся к нам, нравится им это или нет."
 cenhun.1.b: "Словакия не стоит тех людей, которых она будет стоить."

 #### Slovak-Hungarian Events ####

 slohun.1.t: "Кукольная Словакия"
 slohun.1.d: "Словацкие войска на словацкой границе должны быть достаточны для того, чтобы заставить их подчиниться."
 slohun.1.a: "Пришлите требования."
 slohun.1.b: "Карпата Рутения тоже будет захвачена."

 #### anglo-Hungarian events ###

 enghun.2.t: "Венгрия хочет получить лицензии на воздушные перевозки"
 enghun.2.d: "Венгрия обратилась к нам с большой суммой денег и просьбой купить некоторые модели самолетов для собственного производства. Венгры явно приближаются к нашей фракции, и принятие этой сделки еще больше приблизит их к нам."
 enghun.2.a: "Мы выдадим им лицензии."
 enghun.2.b: "Мы не можем так безрассудно отдать наши самолеты!"

