 HUN_restore_austria_hungary: "Восстановить Австрию-Венгрия"
 HUN_restore_austria_hungary_desc: "Венгерские земли Короны Святого Стефана в сочетании с австрийской Сислейтании увидели наше абсолютное доминирование Центральной Европы и Балкан как части двухпартийной империи. Великая война видела, как наши лидеры предали Вену, только для того, чтобы их предали те же люди, что и венгерские земли, разорвались, согласно французскому диктату. Восстановление этой империи позволит нам восстановить наши законные венгерские земли и восстановить Империю, которая доминировала в регионе."

 HUN_austria_hungary_integration: "Реинтеграция австро-венгерских земель"
 HUN_austria_hungary_integration_desc: "Современные идеи, такие, как национальное самоопределение , либеральная демократия и реpublicanism , появились как чума на бывших землях Австро-Венгерской империи. Эти болезни одурачили жителей этих земель, что реакционная империя не имеет права управлять этими землями."

