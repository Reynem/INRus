 HUN_FUHRERREICH_DESC: "В 1936 году Венгрия находится в неустойчивом положении, несмотря на стагнацию экономики и открытое восстание со стороны как коммунистических, так и гортийских сторонников, будущее для этой центральноевропейской страны кажется мрачным, но если национальный кризис будет урегулирован, а экономика оживится, у Венгрии будет шанс стать доминирующей властью в Восточной Европе, соперничая с Грецией и Польшей."

