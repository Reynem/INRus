 hun_london_pact: "Если британцы согласятся с этим, все территории, захваченные у нас в соответствии с Договором Энниси, будут возвращены нам по праву, разумеется, при условии, что и мы, и британцы победим."
 hun_cen_revolt: "Национализм будет раздуваться в Южной Нитре до тех пор, пока регион не потребует права вернуться в Венгрию."
