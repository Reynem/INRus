 hun_secret_rearm: "Секретное перевооружение"
 hun_secret_rearm_desc: "Колеса венгерской военной машины должны вновь начать вращаться, но мы должны быть осторожны, чтобы не выходить за границы и не привлекать нежелательного внимания."
 ###
 hun_secret_rearm_2: "Секретное перевооружение"
 hun_secret_rearm_2_desc: "Колеса венгерской военной машины должны вновь начать вращаться, но мы должны быть осторожны, чтобы не выходить за границы и не привлекать нежелательного внимания."
 ###
 hun_trianon: "Договор Трианона"
 hun_trianon_desc: "Подписываемый в 1921 году Договор Трианона о кумилитировании уничтожил венгерское государство и оставил его в состоянии постоянных гражданских беспорядков и волнений."
 ###
 hun_secret_police: "Бизтонсаг"
 hun_secret_police_desc: "Biztonsag выполняет грязную работу по всей Венгрии, позволяя нам держать свои руки в чистоте, организуя «случаи» для наших политических оппонентов."
 ###
 hun_vengeful: "Мстительный дух"
 hun_vengeful_desc: "Великие державы уничтожили венгерскую нацию во время Великой войны, мы заставим каждого из них заплатить за свои варварские и империалистические действия против венгерского народа."
 ###
 hun_economic_ruin: "Экономическая травма"
 hun_economic_ruin_desc: "Венгерская экономика практически не является сексистской, деньги ничего не стоят, и мы не в состоянии вернуть постоянно растущую гору кредитов, которые мы должны взять, чтобы остаться на плаву."
 ###
 hun_economic_ruin_1: "Экономическая травма"
 hun_economic_ruin_1_desc: "В то время как правительство пыталось стимулировать определенную активность в экономике, нам еще предстоит пройти долгий путь, прежде чем мы сможем стабиализировать наше финансовое положение."
 ###
 hun_economic_ruin_2: "Восстановление экономики"
 hun_economic_ruin_2_desc: "Экономические реформы и программы, разработанные центральным правительством, наконец-то начали приносить свои плоды, и венгерская экономика впервые за более чем 20 лет находится на подъеме."
 ###
 hun_recovered_economy: "Восстановление экономики"
 hun_recovered_economy_desc: "Правительство сумело оказать помощь в проведении реформ и стимулировании экономики, с тем чтобы вывести нас из экономического кризиса, в котором мы находимся в течение последних двух десятилетий."
