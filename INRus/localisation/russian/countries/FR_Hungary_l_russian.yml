 ### SPIRITS ###
 ###############

 hun_annecy_treaty: "Договор Энниси"
 hun_annecy_treaty_desc: "Несмотря на наши попытки избежать гнева со стороны «Согласия», они по-прежнему диктовали, что для нашей нации будет навязан суровый договор, который был подписан в городе Энниси на франко-итальянской границе, и все попытки пересмотреть или отменить его были заблокированы демократическим венгерским правительством, которое по-прежнему желает проводить политику, направленную на поощрение сотрудничества, несмотря на протесты общественности."
 ###
 hun_bw_1: "Последствия аварии на Лондонском рынке"
 hun_bw_1_desc: "Экономика находится в руинах от глобального экономического кризиса, мы должны принять меры, чтобы обратить вспять процесс обезвреживания, или же столкнуться с конкуренциями."
 ###
 hun_bw_2: "Последствия аварии на Лондонском рынке"
 hun_bw_2_desc: "Первоначальный шок от аварии прошел и оставил после себя следы девственников. Безработица растет, стоимость валюты снижается, люди падают. Пришло время принять решительные меры."
 ###
 hun_bw_3: "Последствия аварии на Лондонском рынке"
 hun_bw_3_desc: "Первоначальный шок от аварии прошел и оставил после себя следы девственников. Безработица растет, стоимость валюты снижается, люди падают. Пришло время принять решительные меры."
 ###
 hun_bw_4: "Последствия аварии на Лондонском рынке"
 hun_bw_4_desc: "Первоначальный шок от аварии прошел и оставил после себя следы девственников. Безработица растет, стоимость валюты снижается, люди падают. Пришло время принять решительные меры."
 ###
 hun_bw_5: "Последствия аварии на Лондонском рынке"
 hun_bw_5_desc: "Первоначальный шок от аварии прошел и оставил после себя следы девственников. Безработица растет, стоимость валюты снижается, люди падают. Пришло время принять решительные меры."
 ###
 hun_nep: "Новая экономическая политика"
 hun_nep_desc: "Принятая новая экономическая политика оживит экономику стран и вернет нас на мировую сцену."
 ###
 hun_tax_reform: "Реформированный налог"
 hun_tax_reform_desc: "Наша устаревшая налоговая система оказалась не в состоянии выдержать давление экономических критиков, и эта реформа позволит как притоку большего объема денег в государство, так и увеличению покупательной способности народа."
 ###
 hun_attack_inflation: "Программа Инфлацёккент"
 hun_attack_inflation_desc: "Имплимент программы Инфлацёккент, работает своей магией, чтобы снизить национальную инфляцию."
 ###
 hun_mandatory_school: "Поощрять школы"
 hun_mandatory_school_desc: "Уделение повышенного внимания системе образования наших стран привело к усилению чувства национального единства."
 ###
 hun_closed_markets: "Закрытые рынки"
 hun_closed_markets_desc: "Экономический крах не только разрушил нашу экономику, но и наш потенциал экспортировать товары на глобальный рынок, хотя это и означает, что мы сможем сохранить все наши ресурсы у себя дома, экономическая и политическая реакция намного перевешивает это небольшое утешение."
 ###
 hun_war_bonds_ready: "Готовься к военным облигациям"
 hun_war_bonds_ready_desc: "Мы готовы предоставить нашим жителям связи с войной, если эта страна столкнется с войной."
 ###
 hun_reformed_mil_spending: "Реформированные военные расходы"
 hun_reformed_mil_spending_desc: "Реформы в том, как мы распределяем средства для наших военных, не только позволили увеличить количество эффективных поставок, но и позволили добиться технического прогресса в областях, которые, как мы ожидали, нам не понравятся."
 ###
 hun_social_credit: "Социальный кредит"
 hun_social_credit_desc: "Осуществление наших программ социального кредитования повышает качество жизни всех наших граждан."
 ###
 hun_horthy_resistance: "Сопротивление Миклош Хорти"
 hun_horthy_resistance_desc: "В 1929 году Миклош Хорти основал террористическую организацию, известную как «черные рубашки», эти люди хотят видеть, как Энтези выбрасывается из Венгрии, и народы вернули свои границы к своей прежней славе до заключения Договора Энниси."
 ###
 hun_kun_resistance: "Красное ополчение Белы Кун"
 hun_kun_resistance_desc: "С момента падения Венгерской Советской Республики в 1921 году социалистический Бела Кун поражает сельскую местность, пытаясь собрать поддержку, чтобы вернуть себя к власти."
 ###
 hun_unified_people: "Единые люди"
 hun_unified_people_desc: "Когда Бела Кун и Миклош Хорти очищены, мы наконец-то можем назвать нашу нацию единой, и сбросить оковы Великой войны."
 ###
 hun_unified_nation: "Единая нация"
 hun_unified_nation_desc: "Люди и государство едины и защищены от опасности."
 ###
 hun_arrow_cross: "Стрела Кросс Военный"
 hun_arrow_cross_desc: "Мы сформировали военизированную группу Стрелного креста, которые станут полицией нового режима и обеспечат, чтобы наше правление не было поставлено под угрозу изнутри."
 ###
 hun_arrow_cross_but_better: "Стрела Кросс Военный"
 hun_arrow_cross_but_better_desc: "Мы сформировали военизированную группу Стрелного креста, которые станут полицией нового режима и обеспечат, чтобы наше правление не было поставлено под угрозу изнутри."
 ###
 hun_democratic_bastion: "Демократический бастион"
 hun_democratic_bastion_desc: "Мы должны поддерживать эти ценности, чтобы не упасть перед нашими врагами."
 ###
 hun_danube_research: "Дунайский научно-исследовательский блок"
 hun_danube_research_desc: "Члены нашей фракции были приглашены присоединиться к исследовательскому блоку, где мы все будем обмениваться информацией друг с другом и, как мы надеемся, получим преимущество над нашими соседями."
 ###
 hun_integrated_officers: "Объединенный корпус сотрудников"
 hun_integrated_officers_desc: "Попытки сближения наших наций с военной точки зрения привели к формированию транснационального офицерского корпуса, в состав которого вошли генералы из всех членов группировки, хотя культурный и языковой разрыв и является трудным, со временем он станет одним из величайших наших достижений."
 ###
 hun_interlaced_economy: "Связанная экономика"
 hun_interlaced_economy_desc: "Мы приложили активные усилия к тому, чтобы связать нашу экономику с другими членами наших группировок, что позволило нам лучше выделять ресурсы на строительство и военное производство."
 ###
 hun_gun_buy: "Закупка французских артиллерийских изделий"
 hun_gun_buy_desc: "Мы покупаем у французов большое количество артиллерийских орудий, и поэтому мы должны отплатить им за то, что они нам дали."
 ###
 hun_fra_officers: "Французские офицеры в Венгрии"
 hun_fra_officers_desc: "Французы, в соответствии с нашей просьбой, направили офицеров, чтобы проинспектировать и обновить нашу армию."
 ###
 hun_trianon: "Договор Трианона"
 hun_trianon_desc: "Благодаря обширным дипломатическим отговоркам нам удалось пересмотреть Договор Энниси, и новый договор был подписан во дворце Трианон, и, хотя он по-прежнему налагает ограничения на нашу армию, он является гораздо более мягким, чем прежде, и знаменует собой поворотный пункт во франко-венгерских отношениях."
 ###
 hun_french_industry: "Французские промышленные методы"
 hun_french_industry_desc: "Мы направили во Францию промышленных наблюдателей для изучения их промышленных методов и возвращения их результатов в Венгрию, чтобы мы могли использовать их сами."
 ###
 hun_tea_time: "Британский импорт"
 hun_tea_time_desc: "Британская империя известна во всем мире своим производством многих высококачественных товаров, которые продаются по всему миру."
 ###
 hun_oxford_budapest: "Совместные исследования в Оксфорде и Будапеште"
 hun_oxford_budapest_desc: "Группы Оксфордского университета объединились с Будапештским университетом в попытке повысить темпы научных исследований в обеих наших странах, что приблизит нас к Великобритании и позволит нам в какой-то момент присоединиться к их фракциям."
 hun_annecy_revise: "Пересмотренный Договор об Аннси"
 hun_annecy_revise_desc: "Дипломатия с Великобританией позволила нам пересмотреть Договор Энниси до такой степени, что он больше не будет наносить ущерба нашим военным."
 ###
 hun_british_resources: "Импорт британских ресурсов"
 hun_british_resources_desc: "Британская империя огромна и полна ресурсов, которые не используются на благо."
 ###
 hun_dead_regency: "Мертвая репутация"
 hun_dead_regency_desc: "Хорти объявил о прекращении лояльности, но никто не сел на наш трон, и мы должны быстро выбрать короля, чтобы избежать политической нестабильности."
 ###
 hun_german_officers_idea: "Немецкие офицеры в Венгрии"
 hun_german_officers_idea_desc: "Немецкие офицеры были приглашены наблюдать за венгерскими военными и обучать их, давая нам преимущество перед нашими оппонентами."
 ###
 hun_german_rights: "Права немецкого меньшинства"
 hun_german_rights_desc: "Немецкая иммиграция на протяжении последних веков создала в Венгрии сильнейшее немецкое меньшинство."
 ###
 hun_croat_unrest: "Хорватские волнения"
 hun_croat_unrest_desc: "Хорватский народ был разделен между Венгрией, Сербией и Италией, что вызвало значительную степень национализма и волнений на хорватских землях, и если мы не покончим с этим национализмом, то у нас может возникнуть восстание."
 ###
 hun_stoked_nationalism: "Удушенный национализм"
 hun_stoked_nationalism_desc: "Наш народ и наша армия стоят за нашим королем, мы являемся единой нацией."
 ###
 hun_war_machine: "Готовы к борьбе"
 hun_war_machine_desc: "Новая политика позволит нам производить оборудование быстрее и с большей надежностью на местах, в то время как милитаризм будет поощряться среди масс."
 ###
 hun_romania_bad: "Антирумынская риторика"
 hun_romania_bad_desc: "Мы сосредоточили наши усилия на распространении антирумынской пропаганды по всей нашей стране, и наш народ уже открыто призывает к войне на улицах."
 ###
 hun_infinite_regency: "Неослабевающая репутация"
 hun_infinite_regency_desc: "Венгерская власть не видит конца, что обеспечивает людям стабильное будущее."
 ###
 hun_tariff_increase_idea: "Повышение тарифов"
 hun_tariff_increase_idea_desc: "Свободное предоставление наших ресурсов мировому рынку глупо, должна быть цена за покупку венгерских ресурсов."
 ###
 hun_peoples_rights: "Права расширенных народов"
 hun_peoples_rights_desc: "Люди заслуживают свободы, и именно это мы и намерены им дать."
 ###
 hun_free_market: "Свободный рынок"
 hun_free_market_desc: "Глобальная экономика держит мир в рабочем состоянии, было бы глупо закрываться от нее и отказываться пожинать ее наряды."
 ###
 hun_social_plan_1: "Первая фаза Szocialis Terv"
 hun_social_plan_1_desc: "Правительство приступило к реализации социального плана "Szocialis Terv", который, возможно, не является новаторским, но проложит путь к следующим этапам плана."
 ###
 hun_authoritarian_traditions: "Авторитарные традиции"
 hun_authoritarian_traditions_desc: "Наша страна имеет традицию авторитарных режимов, и демократия никогда не была особенно популярной, и мы должны защищать наш народ от коррумпированных демократических режимов Запада."
 ###
 hun_socialist_diplomacy: "Социалистическая дипломатия"
 hun_socialist_diplomacy_desc: "Социализм — это единственный способ спасти нашу страну от полного краха, и мы должны сотрудничать с другими социалистическими нациями, если мы хотим реализовать мечту о полном освобождении Европы."
 ###
 hun_peoples_council: "Народный совет"
 hun_peoples_council_desc: "Матьяс Ракоси не может управлять страной в одиночку, и мы решили создать «Высокий совет Венгерской народной комиссии» или «Народный совет» на короткое время."
 ###
 hun_peoples_council2: "Народный совет"
