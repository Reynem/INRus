 hun_for.1.t: "[From.GetName] требует возвращения Галисии"
 hun_for.1.d: "[From.GetName], страдающие от иллюзий величия, теперь утверждают, что Бог им дарован прямо над территорией Галисии. Согласно нашей последней переписи, в Галисии нет даже немцев или венгров, но, несмотря на это, кажется, что [From.GetName] готовы сражаться за этот регион. Нам нужно подготовить оборону для этого региона, если они предпочтут нанести удар."
 hun_for.1.a: "Мы никогда не сдадимся."
 hun_for.1.b: "Мы должны избегать кровопролития."
 ###
 hun_for.2.t: "Отказывается сдать Галицию."
 hun_for.2.d: "И отвергли наши требования сдаться Галисии, и, кажется, [сделали так, что] наши угрозы пусты, и мы покажем им, когда наши войска пройдут мимо Карпат."
 hun_for.2.a: "Он будет гореть за это."
 ###
 hun_for.3.t: "Сдался Галисия."
 hun_for.3.d: "[From.GetName] мудро согласился сдать Галицию, кажется, [от Геенны] очень серьезно восприняли наши угрозы, и теперь мы контролируем нашу законную северную территорию."
 hun_for.3.a: "Иногда телеграмма сильнее винтовки."
 ###
 hun_for.4.t: "[From.GetName] требует возвращения Трансильвании"
 hun_for.4.d: "Несмотря на международный консенсус, подтверждающий наш суверенитет над этим регионом, кажется, что [From.GetName] готовы бороться за него. Нам нужно подготовить защиту для этого региона, если они предпочтут нанести удар."
 hun_for.4.a: "Мы никогда не сдадимся."
 hun_for.4.b: "Мы должны избегать кровопролития."
 ###
 hun_for.5.t: "Отказывается сдать Трансильванию."
 hun_for.5.d: "И отвергли наши требования сдаться Трансильвании, и, похоже, наши угрозы пусты, и мы покажем им, когда наши войска пройдут мимо Карпат."
