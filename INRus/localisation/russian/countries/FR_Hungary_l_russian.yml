 ###
 hun_mil_start: "Тихое перевооружение"
 hun_mil_start_desc: "Трианонский договор отказал венгерскому государству в какой бы то ни было армии, полностью помешав нам защитить себя в случае нападения."
 ###
 hun_poli_stab: "Победа Egyseges Part"
 hun_poli_stab_desc: "Партия еще не обладает неоспоримой властью в стране, и нам понадобятся все граждане на нашей стороне, если мы хотим следовать нашим планам на будущее."
 ###
 hun_foreign_dip: "Прогерманская дипломатия"
 hun_foreign_dip_desc: "Венгрия не может оставаться в одиночестве, и нам понадобятся друзья в высших эшелонах, если мы хотим добиться успеха в предстоящих войнах."
 ###
 hun_cropdusters: "Перепрофилирование гражданской сельскохозяйственной продукции"
 hun_cropdusters_desc: "В Трианонском договоре конкретно указывалось, что нам не разрешается строить или покупать военные самолеты, но в нем ничего не говорится о привязке пулеметов и газовых баллонов к урожаю и отправке их на переднюю линию..."
 ###
 hun_buy_guns: "Приобретение иностранного оружия"
 hun_buy_guns_desc: "Производство собственного оружия в массовом порядке сильно потревожило бы наших соседей, поэтому мы должны заключить секретные соглашения о покупке винтовок и оборудования у иностранных держав, чтобы вооружить нашу будущую армию."
 ###
 hun_est_bizt: "Создать Biztonsag"
 hun_est_bizt_desc: ""Бизтонсаг" или "Секьюрити" станет основой нашей секретной полиции и поможет нам управлять внутренними делами в нашей стране."
 ###
 hun_venge: "Венгерский реванхизм"
 hun_venge_desc: "Мы должны обеспечить, чтобы каждый гражданин сплотился за наше дело и подготовился к великому крестовому походу, к которому мы вскоре приступим."
 ###
 hun_demand_alfold: "Требовать возвращения Альфёльда"
 hun_demand_alfold_desc: "Земля Альфёльда полон этнических венгров, и земли являются не более чем бременем для румынской политической и экономической структуры."
 ###
 hun_demand_transylvania: "Трансильвания или война"
 hun_demand_transylvania_desc: "Трансильванские земли являются неотъемлемой частью венгерского государства, и румынская оккупация земли причинила огромные страдания большому магьярскому меньшинству. Мы будем требовать возвращения Трансильвании его законному владельцу, или мы сожжем Бухарест дотла."
 ###
 hun_renounce_trianon: "Отмена Договора Трианона"
 hun_renounce_trianon_desc: "Наконец-то настало время для того, чтобы на международном уровне мы раздражали наш отказ от унизительного Договора Трианона и начали долгий и трудный процесс восстановления Венгрии ее прежней славы."
 ###
 hun_demand_austria: "Антиавстрийская политика"
 hun_demand_austria_desc: "На протяжении веков Австрия подчиняла нас под их правлением."
 ###
 hun_entrench_party: "Уничтожить партию"
 hun_entrench_party_desc: "Только контролировав Венгрию на протяжении последних 4 лет, мы все еще рассматриваемся лишь как этап в венгерской политике."
 ###
 hun_economic_boost: "Экономический подъем"
 hun_economic_boost_desc: "С момента окончания Великой войны венгерская экономика рухнула между полным крахом и относительной стагнацией. Мы сконструируем дополнительные фабрики в попытке придать импульс экономике и выкапывать ее из этой кажущейся бесконечной дыры задолженности и инфляции."
 ###
 hun_focus_civ: "Промышленный потенциал"
 hun_focus_civ_desc: "Мы не можем игнорировать промышленный сектор, и военная машина не может продолжать движение вперед без прочной опоры в сердцах наций."
 ###
 hun_focus_mil: "Разорви Энниси"
 hun_focus_mil_desc: ""
 ###
 hun_end_republic: "Конец Республике"
 hun_end_republic_desc: "Мы наконец-то собрали достаточно народной поддержки, чтобы объявить Республику мертвой и положить конец любым оставшимся в стране следам демократии, новое венгерское государство восстанет из пепла Республики, и мы выйдем в мир с большой яростью."
 ###
 hun_state_as_one: "Государство Единство"
 hun_state_as_one_desc: ""
 ###
 hun_join_stahlpakt_alt: "Присоединяйся к Пакту Стали"
 hun_join_stahlpakt_alt_desc: "Наша внешняя политика прекрасно сочетается с Германией. Союз между нашей нацией поможет нам обезопасить наше место как одной из великих держав в Европе после войны."
 ###
 hun_collab_with_iron_guard: "Сотрудничество с Железной гвардией"
 hun_collab_with_iron_guard_desc: "Похоже, что группировка Железной гвардии Румынии готова сотрудничать с нами, если мы продлим первую оливковую ветвь."
 ###
 hun_carpathian_agreement: "Карпатское соглашение"
 hun_carpathian_agreement_desc: "Чтобы обеспечить долгосрочный союз с румынами, необходимо урегулировать давние споры."
 ###
 hun_autarky: "Автарки"
 hun_autarky_desc: "Полагаясь на внешнюю торговлю, чтобы сохранить нашу экономику на плаву, мы должны полностью подчиниться крупнейшим европейским державам, мы должны показать миру, что мы можем быть полностью самодостаточными, даже когда мы подвергаемся экономическим санкциям или когда враг находится на пороге."
 ###
 hun_trianon_begone: "Отмена Договора Трианона"
 hun_trianon_begone_desc: "С учетом того, что наши военные и экономические структуры вернулись на суффициозный уровень, мы можем, наконец, объявить Трианонский договор недействительным и, наконец, перейти от этого постыдного периода в истории наших государств."
 ###
 hun_secret_training: "Тайные тренировочные лагеря"
 hun_secret_training_desc: "Трианонский договор полностью запретил нам иметь полный военный персонал любого рода, мы должны собрать армию в тайне, чтобы избежать привлечения нежелательного внимания."
 ###
 hun_camo_airbase: "Камуфляжные авиабазы"
 hun_camo_airbase_desc: "Сохранение наших военных самолетов под камуфляжными сетями и внутри подземных бункеров позволит нам наращивать наши военно-воздушные силы, не привлекая нежелательного внимания."
 ###
 hun_tank_focus: "Фокус бронетехники"
 hun_tank_focus_desc: "Танки - единственный способ пробиться через жесткие оборонительные структуры, мы должны обеспечить, чтобы наши бронебойные дивизии были готовы к битве, которая будет сражаться."
 ###
 hun_planned_econ: "Запланированная экономика"
 hun_planned_econ_desc: "Полное доминирование над экономикой наших стран позволит нам обеспечить, чтобы еще один экономический кризис больше не обрушился на нас."
 ###
 hun_devolved_econ: "Разрушенная экономика"
 hun_devolved_econ_desc: "Если венгерская экономика будет восстановлена, мы должны отпустить нашу авторитарную железную хватку над ней."
 ###
 hun_danube_forts_1: "Защита Дуная"
 hun_danube_forts_1_desc: "Дунай является нашей величайшей естественной оборонительной структурой, мы должны укрепить берега реки, с тем чтобы защитить Будапешт от нападений с любой стороны."
 ###
 hun_danube_forts_2: "Продление фортификационных работ на Дунае"
 hun_danube_forts_2_desc: "Проект по укреплению Дуная оказался весьма успешным, и мы должны расширить этот проект, с тем чтобы укрепить оба берега реки, создав неприступные бункеры, которые ни один враг не осмелился бы напасть."
 ###
 hun_revive_airforce: "Возрождение волшебного лейджера"
 hun_revive_airforce_desc: "Трианонский договор запретил венгерской нации иметь какие бы то ни было военно-воздушные силы."
 ###
 hun_offense_airforce: "Наступательные военно-воздушные силы"
 hun_offense_airforce_desc: "Принятие инициативы и удар по врагу на своей родине является наилучшим способом обеспечить, чтобы они не смогли проникнуть в наше воздушное пространство и бомбить наши фабрики."
 ###
 hun_defense_airforce: "Оборонительные военно-воздушные силы"
 hun_defense_airforce_desc: "Мы не будем втягиваться в ловушки и засады противников, мы заставим их придти в радиусе наших пушек и вытащить их с неба во время нашего отдыха."
 ###
 hun_new_airbases: "Строительство новых авиабаз"
 hun_new_airbases_desc: "Самолёты плохи, если им негде приземлиться и починить, мы должны отступить от строительства новых авиабаз по всей стране, так что им всегда будет куда отступить, если они перегружены и перегружены."
 ###
 hun_expand_air_training: "Расширение программ подготовки по вопросам воздушного транспорта"
 hun_expand_air_training_desc: "Что хорошего в пилотах, если они не знают, как летать и адаптироваться к ситуациям? Расширенные учебные программы дадут нам доступ к элитным военно-воздушным силам, которые будут опасаться во всей Карпатии, а не во всей Европе."
 ###
 hun_experimental_air: "Экспериментальные модели истребителей"
 hun_experimental_air_desc: "Предварительные тесты показывают, что летательные аппараты могут вращаться быстрее и достигать более высоких скоростей, чем обычные летательные аппараты, мы должны продумать эту теорию еще больше, чтобы сохранить интимную."
 ###
 hun_expand_experiment: "Расширение Департамента"
 hun_expand_experiment_desc: "Разделить атом — это, как представляется, невыполнимая задача, которую наша нация не может выполнить в одиночку. Однако расширение нашего экспериментального исследовательского отдела позволит нам опередить игру и позволить нам внести больший вклад в разработку этого нового чудо-оружия."
 ###
 hun_revive_navy: "Возрождение ВМС"
 hun_revive_navy_desc: "Венгры были лишены возможности иметь флот как в соответствии с разоруженческой политикой Трианонского договора, так и в связи с тем, что наша береговая линия была передана сербскому правительству."
 ###
 hun_navy_doctrine: "Выбрать морскую доктрину"
 hun_navy_doctrine_desc: "Современный флот не может выжить без надлежащей военно-морской доктрины, которой он будет руководствоваться, мы должны тщательно выбрать, чтобы обеспечить будущий успех нашего растущего флота в предстоящих войнах."
 ###
 hun_undersea_navy: "Морской флот под водой"
 hun_undersea_navy_desc: "Непрямой подход к их кораблям был бы лучшей стратегией для нашей страны, пока мы не сможем привести в порядок нашу ситуацию в военно-морском флоте."
 ###
 hun_cruisar_effort: "Крузер"
 hun_cruisar_effort_desc: "Все современные мореплаватели нуждаются в небольших кораблях для поддержки своих кораблей и носителей."
 ###
 hun_floating_fortress: "Плавающая крепость"
 hun_floating_fortress_desc: "На протяжении почти века этот корабль был гордостью многих мореплавателей, огневая мощь и доспехи несопоставимы с любым классом кораблей."
 ###
 hun_mediterranean_wolves: "Волки Средиземноморья"
 hun_mediterranean_wolves_desc: ""
 ###
 hun_flexible_ships: "Гибкие суда"
 hun_flexible_ships_desc: ""
 ###
 hun_carrier_research: "Исследования перевозчиков"
 hun_carrier_research_desc: "Самолеты — это будущее как военно-морских, так и военно-воздушных сил, и их гибкость и дальность действия их самолетов делают их разрушительным элементом любых военно-морских столкновений."
 ###
 hun_doctrine_evaluate: "Оценка земельной доктрины"
 hun_doctrine_evaluate_desc: "По мере того, как процесс восстановления наших сухопутных сил идет полным ходом, пришло время выбрать доктрину, которая возглавит наших людей."
 ###
 hun_combined_arms: "Комбинированные вооружения"
 hun_combined_arms_desc: "Дни независимых пехотных операций давно прошли, и если мы не будем идти в ногу с историей, мы будем вынуждены повторить ошибки наших отцов во время Великой войны."
 ###
 hun_independant_army: "Зависящие от армии операции"
 hun_independant_army_desc: "Пехотные подразделения составляют основу армии, и им, несомненно, можно доверять, чтобы они остались одни, не проиграв войну в одиночку."
 ###
 hun_youth_army: "Молодежный милитаризм"
 hun_youth_army_desc: "Мы должны просвещать молодежь нашей страны, чтобы она понимала необходимость войны в этом современном веке."
 ###
 hun_more_doctrine: "Расширенные теоретические исследования"
 hun_more_doctrine_desc: "Недавние прорывы в теоретической теории позволили нам разработать новую тактику, которую ранее не представлял себе наш военный персонал."
 ###
 hun_sub_rails: "Субсидирование железнодорожной промышленности"
 hun_sub_rails_desc: "Железные дороги являются наиболее эффективным способом транспортировки солдат, гражданских лиц и материалов по всей стране."
 ###
 hun_state_factory: "Предприятия, находящиеся под контролем государства"
 hun_state_factory_desc: "Разрешить частным компаниям управлять своими собственными предприятиями означает, что у нас меньше прямого контроля над тем, что и сколько производится. Строительство заводов, находящихся в непосредственной собственности государства, приведет к увеличению не только нашей эффективности, но и нашей производительности."
 ###
 hun_south_slovakia: "Вопрос о Южной Словакии"
 hun_south_slovakia_desc: "Южная Словакия полон венгров, которые были вырваны из своей родины Трианонским договором, и поскольку этот договор больше не стоит на нашем пути, мы можем потребовать возвращения этих земель их законным повелителям."
 ###
 hun_slovak_fate: "Судьба Словакии"
 hun_slovak_fate_desc: "С возвращением Южной Словакии под наш контроль мы продемонстрировали миру слабость словацкого народа и его нежелание вести борьбу."
 ###
 hun_nat_col: "Объединение сельского хозяйства"
 hun_nat_col_desc: "Система сельского хозяйства по всей стране по-прежнему похожа на времена венгерского феодализма, и она смешно непродуктивна. Созирование сельскохозяйственного производства и его равномерное распределение приведет к десятикратному увеличению производства продуктов питания и позволит нам прокормить нашу постоянно расширяющуюся империю."
 ###
 hun_german_invest: "Немецкие промышленные инвестиции"
 hun_german_invest_desc: "Одним из способов стимулирования нашей экономики войны является привлечение иностранных инвестиций из других стран."
 ###
 hun_ger_army: "Нашел NMEO"
 hun_ger_army_desc: "НМЕО, или германо-венгерско-венгерский добровольческий отдел, представляет собой предлагаемую группу солдат, состоящую исключительно из этнических немцев, проживающих на территории Венгрии, с целью подкрепления нашей армии высококвалифицированными солдатами, использующими немецких офицеров для их подготовки и оснащения."
 ###
