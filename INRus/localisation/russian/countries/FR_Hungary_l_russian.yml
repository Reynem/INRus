 #### EVENTS ####
 ################

 hun.1.t: "Венгрия, страна, разрушенная"
 hun.1.d: "После падения Австро-Венгерской империи в 1919 году Венгрия была оставлена в состоянии политических беспорядков и волнений. Несколько демократических и радикальных правительств попытались захватить власть в течение следующих двух лет до тех пор, пока объединенная румынская-франко-сербская армия не пошла по Будапешту и не оккупировала более двух третей нации. После подписания Договора Трианона власти венгерского Союза установили слабый демократический режим и оставили страну в стороне от своих собственных устройств. После нескольких тяжелых лет слабой и неуязвимой власти всеобщие выборы 1932 года привели к тому, что к власти в Венгрии пришла партия гипернационалистов и боевиков «Кросс Арроу». В 1936 году венгерский режим не имеет профессиональной армии, практически неэкстремистской экономики и полностью изолированной позиции в Европе."
 hun.1.a: "Вперед, к победе!"
 ###
 hun.2.t: "Венгрия желает приобрести оружие"
 hun.2.d: "Венгерское правительство продвигается к политике тайной перевооружения, и они обратились к нам с просьбой приобрести оружие из наших запасов, чтобы вооружить военные, которые они планируют построить."
 hun.2.a: "Мы отправим им много оружия."
 hun.2.b: "Мы отправим им оружие."
 hun.2.c: "Мы не можем щадить и вооружаться"
 ###
 hun.3.t: "Германия посылает нам оружие!"
 hun.3.d: "Мы получили сообщение от правительства Германии, они согласились тайно посылать оружие в страну, которая будет добавлена в наши национальные запасы."
 hun.3.a: "На шаг ближе к победе."
 ###
 hun.4.t: "Германия отказывает нам в оружии."
 hun.4.d: "Правительство Германии официально отклонило нашу просьбу о приобретении нескольких тысяч единиц оружия из своих запасов для использования в нашей армии."
 hun.4.a: "Какая жалость."
 ###
 hun.5.t: "Венгрия требует возвращения Трансильвании"
 hun.5.d: "После нескольких месяцев, казалось бы, неконтролируемого военного наращивания и расширения, венгерское правительство приняло решение направить официальное требование на территории всей земли к востоку от реки Тиса и к западу от Карпатских гор, что означало бы капитуляцию Трансильвании, Банат и более миллиона этнических румын, живущих в настоящее время в пределах наших границ."
 hun.5.a: "Мы не боимся венгерской угрозы!"
 hun.5.b: "Мы не можем позволить себе войну с венгерцами."
 ###
 hun.6.t: "Румыния отказывается вернуть Трансильванию"
 hun.6.d: "Румынское правительство официально отклонило наши требования в отношении Трансильвании, и дипломатические связи очень быстро разорвались в тишине."
 hun.6.a: "Тогда это война..."
 ###
 hun.7.t: "Румыния"
 hun.7.d: "В шокирующий поворот событий румынское правительство приняло все наши территориальные требования и начало полную военную эвакуацию Трансильвании, предоставив нашим солдатам возможность маршировать и оккупировать города без сопротивления."
 hun.7.a: "Венгры повсюду радуются твоему освобождению!"
 ###
 hun.8.t: "Венгрия требует Альфёльда"
 hun.8.d: "Сегодня венгерское правительство направило нам небольшой список требований, включая возвращение территории Альфёльда, земли Альфольда были оккупированы в 1920 году, а река Тиса была установлена в качестве естественной границы между Венгрией и Румынией. Однако вскоре земли оказались экономически нежизнеспособными, а волнения на этих землях всегда были выше, чем на остальной части Трансильвании и Банате. Хотя мы сдадим ценную оборонительную границу, возможно, возвращение этой земли является наилучшим выбором для сохранения стабильности и процветания Румынии. Возможно, венгерцы будут удовлетворены Альфёльдом и перестанут удовлетворять дальнейшие территориальные требования."
 hun.8.a: "Ни дюйма земли не уступит!"
 hun.8.b: "Отдай Альфёльду в Венгрию."
 ###
 hun.9.t: "Румыния отказывается уступить Алфёльду"
 hun.9.d: "К сожалению, румынское правительство отказало нам в нашем предложении взять контроль над Альфёльдом, и у нас остался только один вариант: вернуть его с силой."
 hun.9.a: "Мы будем в Будапеште к концу месяца"
 ###
 hun.10.t: "Румыния передает Alföld"
 hun.10.d: "Румынское правительство откликнулось на наше предложение и согласилось вернуть землю Альфёльда в Венгрию."
 hun.10.a: "Сначала Альфёльд, потом Трансильвания."
 ###
 hun.11.t: "Трансильванские добровольцы прибывают в Венгрию!"
 hun.11.d: "Похоже, что наш дух джингоизма, направленный на восстановление венгерских земель, вызвал некоторый национализм во всем регионе, стаи солдат-добровольцев, использующих украденное румынское снаряжение, прибывают из Румынии и дают присягу на верность нашему режиму, и они, несомненно, пригодятся в восстановлении Трансильвании, и мы можем ожидать, что больше добровольцев прибудут, чем мы ждем."
 hun.11.a: "Поднимайтесь, магии повсюду!"
 ###
 hun.12.t: "Венгерские добровольцы поднимаются в Трансильвании!"
 hun.12.d: "После нашего вторжения в Румынию несколько групп венгров, проживающих в Трансильвании, взялись за оружие и пообещали свою преданность венгерскому государству."
 hun.12.a: "Замечательно."
 ###
 hun.13.t: "День освобождения"
 hun.13.d: "[Это. Главник газет]"July 7 1932, a date which all Hungarians should remember, for it is the day that our liberation officially begun. We have worked tirelessly and endlessly to restore the Hungarian state to the glory it once held, before the Western Imperialists sought to impose their will upon us, and skewer us upon a pike outside the palace at Versallies. The liberation of all Hungarians around the world is at hand, and we are reaching ever closer to our goal of ethnic hegemony by the day. But we must not diminish our resolve, we must remain steadfast and hardy, and prepare for the wars and battles that are to come. Only when all our foes lie dead before us can we say the day is done, only when all Magyars live under one state can we say that our destiny has been acomplished.""
 hun.13.a: "Вставайте, магии повсюду!"
 ###
 hun.15.t: "Демократические митинги в Пече"
 hun.15.d: "После прихода нашего нового правительства в Венгрии несколько демократических групп сформировали коалиционную партию под знаменем уходящего либерального правительства в оппозиции и протесте. Эта партия остается единственной крупной политической группой, которая может представлять какую-либо угрозу для нас и для нашей страны. Хотя крайне маловероятно, что у этой партии будет хоть какой-то шанс на то, чтобы на самом деле свергнуть наш режим, в наших интересах было бы ограничить их влияние и власть. Мы могли бы приложить большие усилия, чтобы ослабить силу либералов, но, возможно, было бы неразумно вызвать массовую агитацию до того, как мы обеспечим нашу базу власти."
 hun.15.a: "Принимать активные меры по ограничению их власти"
 hun.15.b: "Принимать разумные меры для ограничения их власти"
 hun.15.c: "Они не представляют для нас угрозы."
 ###
 hun.16.t: "Гастон Гаэль убит!"
 hun.16.d: "Партия FKgP была основана недавно в истории Венгрии в 1930 году. Партия поднялась до высочайшего уровня в ответ на падение венгерской экономики и ее воздействие на аграрное население страны. Хотя она никогда не выигрывала и не выступала на выборах, партия смогла оказать давление на правительство, с тем чтобы заставить его немного изменить жизнь фермеров. Однако этого было недостаточно, и производство продовольствия в Венгрии всегда было на грани неадекватности. Гастон Гаэль, вероятно, был самым активным членом партии и участвовал в местных выборах под знаменем ФКГП. В то время как большинство партии сорвалось, чтобы вступить в правящую либеральную коалицию, очень маленькую кустарную группу крутых членов, застрявшую вокруг, чтобы сохранить дух партии живой. Гастон был, как сообщается, в городе Дунауйварос, который пытался собрать поддержку своей партии, когда предположительно выскочил из кого-то толпы, и Гастон упал на землю. Это событие пошатнуло то, что осталось у партии, и поддержка ФКГ осталось до точки, в которой, как считается, неизвестная политическая партия, пытается поддерживать такую партию, как один из гандисткий член политической партии."
 hun.16.a: "Чёртовы красные..."
 ###
 hun.17.t: "Взрыв на фабрике в Будапеште!"
 hun.17.d: "Взрывы были слышны из промышленного района недалеко от столицы наций вчера, когда несколько взрывных устройств были взорваны на заводе. Сегодня около 10 часов утра, когда рабочие фабрики только начинали свою смену, несколько человек были убиты и десятки других получили ранения, поскольку значительная часть фабрики рухнула из-за потери структурной недееспособности. В настоящее время проводится расследование для выявления мотивов этого нападения, но очевидно, что темные силы пытаются подорвать нашу мощь."
 hun.17.a: "Какая жалость."
 ###
 hun.18.t: "Социалисты стали причиной взрыва!"
 hun.18.d: "Расследование взрыва на заводе, произошедшего 6 дней назад, наконец завершилось, когда детективы наконец установили, что это был радикально настроенный член партии Балкезеп по имени Биро Ференч, который установил бомбы, прежде чем ускользнуть в сельскую местность. Детективы нашли копию коммунистического манифеста, одетого ему кем-то по имени Матьяс Ракоси, и началось всестороннее расследование жизни этих двух людей. Усилилась безопасность вокруг города Будапешт, и любой, кто обвиняется в том, что он является социалистом, избегается от своей семьи и общественной жизни."red scare" is vastly diminishing the influence that the reds hold in the fringes of our country. It would appear that some good has come of this tragedy after all."
 hun.18.a: "Чёртовы красные..."
 ###
 hun.19.t: "Венгерская экономика"
 hun.19.d: "После поражения Венгрии во время Великой войны в стране произошла серия революций и контрреволюций, до тех пор, пока объединенная армия французских, сербских, румынских и чехословацких солдат не въехала в Будапешт и не восстановила порядок. Созданное демократическое правительство было не более чем марионеткой для сербов и румын, и с каждым предстоящим выборами венгерские выборы вступали в более резкий и глубокий спад. Эти события завершились 23-го сентябрями, в результате которых тысячи гражданских лиц вышли на улицы, чтобы физически забрать деньги у банков, которые удерживали их. Эти беспорядки разрушили многие банки, и вера в экономику была полностью разрушена, когда венгерское правительство объявило валюту недействительной в попытке бороться с гиперинфляцией, захватившей страну."protecting" the Hungarian people were content to sit and watch as the Hungarian nation collapsed in on itself. It was this complete economic ruin, combined with a feeling of utter betrayal by Hungary's neighbors, that led to the rise of the popular Arrow Cross party, and their landslide victory in the 1932 general election."
 hun.19.a: "Ремонт экономики должен быть нашим главным приоритетом!"
 ###
 hun.20.t: "Легализация профсоюзов"
 hun.20.d: "Профсоюзы были в Венгрии незаконными с 1926 года, когда правительство запретило их из-за боязни роста социализма в стране."
 hun.20.a: "Профсоюзы никогда не будут легализованы!"
 hun.20.b: "Возможно, либерализация - не плохая идея..."
 ###
 hun.21.t: "Венгрия требует возвращения Южной Словакии!"
 hun.21.d: "После отказа от Трианонского договора венгерское государство начало восстанавливать свои военные позиции, чтобы не допустить их появления."return" of those lands to Hungarian rule. accepting this demand will make the government look exceptionally weak, and radical elements within the country may see it as an oppertunity to strike, but can we really afford a war with the Hungarians at this stage?"
 hun.21.a: "Мы не можем позволить себе войну."
 hun.21.b: "Ни дюйма земли не будет дано!"
 ###
 hun.22.t: "Словакия соглашается с нашими требованиями"
 hun.22.d: ""
 hun.22.a: "Замечательно!"
 ###
 hun.23.t: "Словаки непокорны!"
 hun.23.d: ""
 hun.23.a: "Тогда они упадут."
 ###
 hun.24.t: "Венгрия требует полного представления"
 hun.24.d: ""
 hun.24.a: "Мы должны сдаться..."
 hun.24.b: "Ни шагу назад!"
 ###
 hun.25.t: "Словакия уступает нашим требованиям"
 hun.25.d: ""
 hun.25.a: "На один шаг ближе к реализации Большой Венгрии"
 ###
 hun.26.t: "Словакия выступает против!"
 hun.26.d: ""
 hun.26.a: "Мы раздавим их через несколько дней."
 ###
 hun.27.t: "Дополнительные добровольцы прибыли из Румынии!"
 hun.27.d: "Похоже, что наше послание доходит до более широкой аудитории через границу, все больше и больше добровольцев пересекают Венгрию с каждым днем, и мы можем обратиться к своим собственным солдатам с просьбой об относительно небольшом количестве добровольцев, и скоро у нас будет достаточно сил, чтобы противостоять любому врагу, который осмеливается выступить против нас."
 hun.27.a: "Замечательные новости!"
 ###
 hun.28.t: "Операция Кёрёмвираг"
 hun.28.d: "Военно-воздушное командование обратилось к центральному правительству с просьбой о проведении независимого воздушного налета на румынскую столицу Бухареста. Война против Румынии , по сообщениям, начала разрушаться вокруг Карпатских гор, и военно-воздушное командование считает, что целенаправленный налет на столицу Румынии сломит их волю сражаться и вынудит к скорейшей капитуляции ."
 hun.28.a: "Одобрить операцию."
 hun.28.b: "Отклоните операцию."
 ###
 hun.29.t: "Сандор Мараи - ночь в Будапеште"
 hun.29.d: "Изумленный венгерский писатель и журналист Сандор Мараи объявил сегодня, что он закончил свою работу, роман под названием "Страх жизни"."A Night in Budapest" Sándor has already recieved critic acclaim from across Hungary for his excellent portrayal of Hungarian pride and nationalism in the form of an interesting and layered novel with complex characters and locations. \n\nThe novel begins in 1848, in the midst of the Hungarian Revolution and their attempt at leaving the iron grip of the Austrian Habsburgs. Following a string of military victories in Galicia and Bohemia, along with Prussian intervention on the side of the Hungarians, the Austrians are forced to recognize the independance of the Hungarian state as well as ceding authority over Dalmatia to Hungary. What followed shortly afterwards was a complete collapse of Habsburg authority over the remaining Cisleithanian lands, as regional warlords attempted to carve their own states out of the collapsing empire. \n\nIn 1908, a diplomatic crisis occurs in Bosnia when Hungary sends soldiers into the territory under the pretense of quelling the unrest, but ends up annexing the lands into the Hungarian crown, to the objection of Russia, France, and the weakened Ottoman Empire. The following conflict ended up spanning four continents and six years as Europe, Africa, Asia, and Oceania tears itself apart under two alliance blocs. The war ends in a Hungarian-Prussian-British victory, but at a very high cost to all nations. The novel ends with the Hungarian and Prussian kingdoms on the brink of revolution, and the British empire struggling to maintain its overextedned empire in an age of guns, germs, and steel. \n\n[HUN.GetLeader] has praised Sándor for his work, and is considering making the novel a national treasure. This novel will not be soon forgotten."
 hun.29.a: "Что за чтение!"
 ###
 hun.30.t: "Фонд Словацкой народной армии?"
 hun.30.d: "Теперь, когда наше завоевание Словакии завершено, многие генералы предложили создать группу, полностью состоящую из словацких «добровольцев», с тем чтобы объединить их с венгерской армией и спровоцировать процесс ассимиляции словацкого народа в венгерскую культуру. Несмотря на то, что есть очевидные преимущества для принятия этого решения, многие из тех, кто служил в армии Кьюк во время Великой войны, быстро указывают на чехословацкое предательство и на их скромную попытку вырезать государство из венгерских земель. Эти люди считают, что вооружение словаков будет лишь провоцировать беспорядки и приведет к вооруженному восстанию, возглавляемому словацкими патриотами. Однако, вполне возможно, что эти люди будут нужны в войнах против наших врагов, и каждый пистолет будет считаться на поле боя..."
 hun.30.a: "Это феноменальная идея!"
 hun.30.b: "Оружие словаков принесет нам только неприятности."
 ###
 hun.31.t: "Венгерский гражданин убит в Сольноке"
 hun.31.d: "Несколько ночей назад в городе Сольнок был найден мертвым и расчленен в канаве рядом с домом одного из мясников, проживающих в городе. Многие граждане обвиняют мясника в убийстве мальчика, но против него не было получено никаких веских доказательств. Несмотря на то, что несколько антисемитских групп в городе возлагают вину на маленькое еврейское население, живущее в пределах его границ, утверждая, что это было "частичное убийство" и было запланировано заранее. Эти антисемитские группы подстрекают к насилию в отношении еврейского населения, и уже имели место несколько инцидентов, связанных с целенаправленными нападениями на магазины и дома, принадлежащие и обитаемые евреями. Мэр утверждает, что насилие утихнет, и местная полиция может справиться с ситуацией, но мы должны пристально следить за городом в случае его эскалации."
 hun.31.a: "Как трагично!"
 ###
 hun.32.t: "Распространяется антисемитское насилие"
 hun.32.d: "Несмотря на то, что сказал мэр, насилие, направленное против еврейского населения Восточной Венгрии, распространилось по всему городу, а местная синагога неоднократно подвергалась нападениям разъяренных толпы, надеющихся снести ее."
 ###
 hun.40.t: "Венгрия просит германские инвестиции"
 hun.40.d: "Венгерское правительство в последние годы неустанно работает над тем, чтобы вернуть венгерскую экономику с грани полного и полного краха, и, как представляется, их последний гамбит заключается в том, чтобы заручиться инвестициями в германскую промышленность. Венгры хотят, чтобы на их территории были построены немецкие фабрики с двойной целью - повысить производительность, а также изучить наши промышленные методы."
 hun.40.a: "Замечательная идея для нашего будущего союзника!"
 hun.40.b: "Мы не можем тратить время или ресурсы."
 ###
 hun.41.t: "Отдача от инвестиций в промышленность"
 hun.41.d: "Наша промышленная сделка с Германией позволила повысить эффективность нашего промышленного производства."
 hun.41.a: "Замечательные новости!"

 hungary.501.d: "Понятно, что предыдущая венгерская Республика стоит перед смертью. Для многих Республика представляет Венгерскую Венгрию в цепях, цепях, которые она больше не связана. С восхождением Хорти к власти возник вопрос о судьбе Республики и восстановлении монархии. Несмотря на то, что было предложено, чтобы Хорти просто восстановил Хабсбургский дом на трон при Карле фон Габсбурге-Лоррейне. Это, вероятно, привело бы к попытке восстановить союз с Австрией. У Хорти есть свои собственные проблемы с идеей, а именно с тем, чтобы привести к католическому монарху, поскольку он сам является кальвинистом. Кроме того, венгерские националисты выступают против иностранного короля и пресмыкаются над ним [803.Гетнам]. Однако реакционные и консервативные элементы решительно поддерживают такое восстановление, так как именно с Венгрией, провозгласив независимость от Австрии, он мог бы просто дать Эннси и ее предательство, и Венгрия была бы мощной частью двусторонней импери."

 #Demands 
 hundemands.1.d: "После отказа от Договора Энниси государство начало перестраивать свои военные силы в непредвиденные высоты."return" of those lands to [From.GetAdjectiveCap] rule. accepting this demand will make the government look exceptionally weak, and radical elements within the country may see it as an oppertunity to strike, but can we really afford a war with the [From.GetAdjectiveCap]s at this stage?"
 hundemands.2.d: "Они отказались от наших требований сдать Словакию; кажется, что наши угрозы пусты, и мы покажем им, когда наши войска пойдут через Словакию."
 hundemands.3.d: "[From.GetName] мудро согласился сдать Словакию, кажется, [From.GetName] очень серьезно воспринимает наши угрозы, и теперь мы контролируем нашу законную северную территорию."
 hundemands.4.d: "После нескольких месяцев, казалось бы, неконтролируемого наращивания и расширения вооруженных сил, правительство [от Гетэджив Капитана] приняло решение направить официальное требование на территории всей земли к востоку от реки Тиса и к западу от Карпатских гор, что означало бы капитуляцию Трансильвании, Баната и более миллиона этнических румын, проживающих в настоящее время в пределах наших границ, что явилось бы национальной трагедией и полностью разрушило бы любой национальный престиж, который мы сейчас имеем."
 hundemands.5.d: "Правительство официально отклонило наши требования в отношении Трансильвании, и дипломатические связи очень быстро разорвались в тишине."
 hundemands.6.d: "В шокирующий поворот событий правительство [от .getadigitive Cap] приняло все наши территориальные требования и начало полную военную эвакуацию Трансильвании, предоставив нашим солдатам возможность маршировать в города и оккупировать их без сопротивления. Это славный день в истории [Root.GetAdegective Cap] и будет известен на все времена как наш «день возрождения»."
 hundemands.7.d: "Несмотря на международный консенсус, подтверждающий наш суверенитет над этим регионом, кажется, что [From.GetName] готовы сражаться за него. Нам нужно подготовить оборону для этого региона, если они предпочтут нанести удар."
 hundemands.8.d: "[Из Гетнама] отвергли наши требования сдать Южную Воеводину; кажется, [From.GetName], что наши угрозы пусты, и мы покажем им, когда наши войска пройдут мимо Дуная."
 hundemands.9.d: "[From.GetName] мудро согласился сдать Южную Воеводину, кажется, [From.GetName] очень серьезно воспринимает наши угрозы, и теперь мы контролируем нашу законную южную территорию."
 hundemands.10.d: "Несмотря на международный консенсус, подтверждающий наш суверенитет над этим регионом, кажется, что [From.GetName] готовы сражаться за него, нам нужно подготовить оборону для этого региона, если они предпочтут нанести удар."
 hundemands.11.d: "И отвергли наши требования сдаться Боснии, и, кажется, [сделали так, что] наши угрозы пусты, и мы покажем им, когда наши войска пройдут мимо Дуная."
 hundemands.12.d: "[From.GetName] мудро согласился сдать Боснию, кажется, [From.GetName] очень серьезно воспринимает наши угрозы, и теперь мы контролируем нашу законную южную территорию."
 hundemands.13.d: "Несмотря на международный консенсус, подтверждающий наш суверенитет над этим регионом, кажется, что [From.GetName] готовы сражаться за него, нам нужно подготовить оборону для этого региона, если они предпочтут нанести удар."
 hundemands.14.d: "Они отказались от наших требований сдать свою Восточную Адриатическую береговую линию, и кажется, что наши угрозы пусты, и мы покажем им, когда наши войска пойдут к Адриатике."
 hundemands.15.d: "[From.GetName] мудро согласились сдать свою часть восточной Адриатической береговой линии, и, похоже, [From.GetName] очень серьезно отнеслись к нашим угрозам, и теперь мы контролируем нашу законную западную территорию."
 hundemands.16.d: "Несмотря на международный консенсус, подтверждающий наш суверенитет над этим регионом, кажется, что [From.GetName] готовы сражаться за него. Нам нужно подготовить оборону для этого региона, если они предпочтут нанести удар."
 hundemands.17.d: "Мы не должны сидеть сложа руки, пока австрийские немцы страдают под иностранным флагом."
 hundemands.18.d: "Мы на шаг ближе объединяем Австро-Венгерское государство." 
 hundemands.19.d: "Несмотря на международный консенсус, подтверждающий наш суверенитет над этим регионом, кажется, что [From.GetName] готовы сражаться за него. Нам нужно подготовить оборону для этого региона, если они предпочтут нанести удар."
 hundemands.20.d: "Мы не должны сидеть сложа руки, пока австрийские немцы страдают под иностранным флагом."
 hundemands.21.d: "Мы на шаг ближе объединяем Австро-Венгерское государство."
 hundemands.22.d: "[From.GetName], страдающие от иллюзий величия, теперь утверждают, что Бог им дарован прямо над территорией Галисии. Согласно нашей последней переписи, в Галисии нет даже немцев или венгров, но, несмотря на это, кажется, что [From.GetName] готовы сражаться за этот регион. Нам нужно подготовить оборону для этого региона, если они предпочтут нанести удар."
 hundemands.23.d: "И отвергли наши требования сдаться Галисии, и, кажется, [сделали так, что] наши угрозы пусты, и мы покажем им, когда наши войска пройдут мимо Карпат."
 hundemands.24.d: "[From.GetName] мудро согласился сдать Галицию, кажется, [от Геенны] очень серьезно восприняли наши угрозы, и теперь мы контролируем нашу законную северную территорию."
 hundemands.25.d: "Несмотря на международный консенсус, подтверждающий наш суверенитет над этим регионом, кажется, что [From.GetName] готовы сражаться за него. Нам нужно подготовить оборону для этого региона, если они предпочтут нанести удар."
 hundemands.26.d: "Мы не должны сидеть сложа руки, пока австрийские немцы страдают под иностранным флагом."
 hundemands.27.d: "[From.GetName] мудро сдался [103.Гетнам] без проблем. Теперь мы на шаг ближе объединяем Австро-Венгерское государство."

