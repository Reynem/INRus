 ###
 hun_for.11.t: "Отказывается сдать богемию и Моравию."
 hun_for.11.d: "[Из Гетнама] отвергли наши требования сдаться богемию и Моравию; кажется, [From.GetName], что наши угрозы пусты, и мы покажем им, когда наши войска пройдут мимо Карпат."
 hun_for.11.a: "Он будет гореть за это."
 ###
 hun_for.12.t: "Сдались богемия и Моравия."
 hun_for.12.d: "[From.GetName] мудро согласились сдаться богемию и Моравию, кажется, [From.GetName] очень серьезно восприняли наши угрозы, и теперь мы контролируем нашу законную северную территорию."
 hun_for.12.a: "Иногда телеграмма сильнее винтовки."
 ###
 hun_for.13.t: "[From.GetName] требует аннексии Южной Иллирии"
 hun_for.13.d: "Несмотря на международный консенсус, подтверждающий наш суверенитет над этими регионами, кажется, что [From.GetName] готовы сражаться за него. Нам нужно подготовить оборону для этого региона, если они предпочтут нанести удар."
 hun_for.13.a: "Мы никогда не сдадимся."
 hun_for.13.b: "Мы должны избегать кровопролития."
 ###
 hun_for.14.t: "Отказывается сдать Южную Иллирию."
 hun_for.14.d: "Они отказались от наших требований сдать южную Иллирию, и кажется, что наши угрозы пусты, и мы покажем им, когда наши войска пройдут мимо Дуная."
 hun_for.14.a: "Он будет гореть за это."
 ###
 hun_for.15.t: "Сдалась южная Иллирия."
 hun_for.15.d: "[From.GetName] мудро согласился сдать Южную Иллирию, кажется, [From.GetName] очень серьезно воспринимает наши угрозы, и теперь мы контролируем нашу законную южную территорию."
 hun_for.15.a: "Иногда телеграмма сильнее винтовки."
 ###
 hun_for.16.t: "[From.GetName] обеспечивает защиту от поставок нефти"
 hun_for.16.d: "Нефть — это топливо современных империй. [From.GetName] просит увеличить поставки нефти им, и взамен они предоставят защиту нашей нации. В то время как союзники нужны сейчас, как никогда прежде, во все более враждебной Европе, многие в нашем правительстве опасаются влияния, которое это может оказать на [From.GetName] нашу собственную нацию."
 hun_for.16.a: "Это того не стоит."
 hun_for.16.b: "Масло должно течь"
 ###
 hun_for.17.t: "Отказывается расстаться с маслом."
 hun_for.17.d: "В поисках более нейтральной внешней политики мы отказываем в нашем предложении."
 hun_for.17.a: "Проклятье!"
 ###
 hun_for.18.t: "[От имени Гейтнам] соглашается послать больше нефти"
 hun_for.18.d: "Стремясь к более тесному сотрудничеству с нами [из Гетнама], он согласился послать больше нефти для нашей защиты."
 hun_for.18.a: "Выпьем за нашего нового союзника"
 ###
 hun_for.19.t: "[From.GetName] требует контроля Бургенланда"
 hun_for.19.d: "На протяжении веков Бургенланд был частью Венгрии только для того, чтобы его отобрали после Великой войны, и теперь Венгрия требует, чтобы мы вернули эту территорию, если мы хотим сохранить мир между нашими народами."
 hun_for.19.a: "Мы не попадемся на эти угрозы."
 hun_for.19.b: "Мы не можем рисковать войной."
 ###
 hun_for.20.t: "Сдаётся Бургенланду."
 hun_for.20.d: "Мы на шаг ближе объединяем венгерский народ."
 hun_for.20.a: "Иногда телеграмма сильнее винтовки."
 ###
 hun_for.21.t: "Отказывается сдаться Бургенланду."
 hun_for.21.d: "Мы не должны сидеть сложа руки, пока венгры страдают под иностранным флагом."
 hun_for.21.a: "Он будет гореть за это."
 ###
 hun_for.22.t: "Желает присоединиться к Пакту Стали"
 hun_for.22.d: "Венгерцы были нашим союзником во время Великой войны, хотим ли мы принять их снова?"
 hun_for.22.a: "Тост за наших венгерских союзников"
 hun_for.22.b: "Они скорее помеха, чем союзник."
 ###
 hun_for.23.t: "Принимает нас в Пакт Стали."
 hun_for.23.d: "Мы услышали наши желания и очень рады этому."
 hun_for.23.a: "Тост за наших немецких союзников"
 ###
 hun_for.24.t: "Отказывает нам в членстве в Пакте Стали."
 hun_for.24.d: "Они считают нас скорее помехой, чем настоящим союзником."
 hun_for.24.a: "Мы сами сформируем свою судьбу."

 hungary_national_crisis.1.d: "Мечта о стабильной, либеральной Венгрии, связанной с Энтези, находится на грани краха. Наше правительство, хотя и поддерживает Францию и идеалы Республики, находится между конкурирующими радикалами. В казармах и сельских поместьях ультранационалистические военизированные формирования, лояльные Миклосу Хорти, бурят марш по столице к «восстановлению порядка». Тем временем, на фабриках Ксепеля власти государства едва выходят за пределы здания парламента, а агитаторы «Красного» Куна распространяют оружие и призывают к пролетарианскому восстанию, чтобы уничтожить «буржуазных кукол Парижа». .. . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . ."

