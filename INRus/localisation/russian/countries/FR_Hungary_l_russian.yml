 hun_for.9.a: "Иногда телеграмма сильнее винтовки."
 ###
 hun_for.10.t: "[From.GetName] требует аннексии Чехии и Моравии"
 hun_for.10.d: "Несмотря на международный консенсус, подтверждающий наш суверенитет над этими районами, кажется, что [From.GetName] готовы сражаться за него. Нам нужно подготовить оборону для этого региона, если они предпочтут нанести удар."
 hun_for.10.a: "Мы никогда не сдадимся."
