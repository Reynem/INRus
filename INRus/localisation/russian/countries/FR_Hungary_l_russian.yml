 hun_march_onto_brasov2: "Уничтожить Румынию"
 hun_march_onto_brasov2_desc: "Нельзя допустить, чтобы оппортунистические румыны больше грызли на Востоке, ожидая нанесения удара."

 hun_bw_initial: "Крушение Лондонского фондового рынка"
 hun_bw_initial_desc: "Несмотря на то, что мы относимся к экономической изоляции от "Согласия", мы все еще поражаемся крушением рынка в Лондоне, и наша экономика находится в затонувшем состоянии."
 ###
 hun_bw_high_tax: "Повышение налогов"
 hun_bw_high_tax_desc: "Если мы хотим финансировать наши будущие проекты, мы должны извлечь у людей все возможные деньги."
 ###
 hun_bw_austerity: "Жесткость"
 hun_bw_austerity_desc: "Иногда лучшее, что можно сделать, это забить люки и выдержать шторм."
 ###
 hun_bw_intervention: "Экономическое вмешательство"
 hun_bw_intervention_desc: "Если мы хотим контролировать это, мы должны взять на себя поводы и покататься на этой лошади, это может разочаровать людей, но им просто придется принять реальность, с которой они сталкиваются."
 ###
 hun_bw_subsidize: "Промышленные субсидии"
 hun_bw_subsidize_desc: "Несмотря на популярную практику в XIX веке, крупные промышленные субсидии упали в пользу новых либеральных правительств, захвативших власть по всей Европе."
 ###
 hun_bw_nationalizing: "Национализация иностранной промышленности"
 hun_bw_nationalizing_desc: "Хотя это, безусловно, расстроит иностранные державы, мы отчаянно нуждаемся в новых отраслях промышленности и новых рабочих местах, переход к временному контролю над заводами, принадлежащими другим странам, несомненно, придаст значительный импульс нашей экономике, и мы должны быть уверены в том, что мы вернем заводы после того, как наступит худшее, или столкнемся с экономическими санкциями в предстоящие годы."
 ###
 hun_nep: "Новая экономическая политика"
 hun_nep_desc: "Крушение Лондонского рынка закончилось, но память останется навсегда, мы должны подготовить экономику и убедиться, что этого больше не повторится."
 ###
 hun_tax_reform: "Реформированный налог"
 hun_tax_reform_desc: "Наша устаревшая налоговая система оказалась не в состоянии выдержать давление экономических критиков, и эта реформа позволит как притоку большего объема денег в государство, так и увеличению покупательной способности народа."
 ###
 hun_foreign_investment: "Поощрение иностранных инвестиций"
 hun_foreign_investment_desc: "Лондонский Крэш заставил нас просеивать активы внутри нашей страны, пришло время привлечь больше иностранных инвестиций, возвращая также фабрики, которые мы взяли."
 ###
 hun_city_infrastructure: "Инфраструктура городов"
 hun_city_infrastructure_desc: "Способность людей передвигаться по городам и по всей стране является основой цивилизованного общества, и если мы действительно хотим представить себя цивилизованными людьми, мы должны улучшить дороги и поезда по всей нашей стране."
 ###
 hun_attacking_inflation: "Программа снижения инфляции"
 hun_attacking_inflation_desc: "Программа Inflációcsökkentö — это наш новый план по снижению инфляции после эффекта Лондонского рынка. Это будет способствовать дальнейшему росту экономики и вкладывать больше денег в систему."
 ###
 hun_encourage_school: "Поощрять школы"
 hun_encourage_school_desc: "Настало время прекратить преподавать нашей молодежи уроки вчерашнего дня и начать изучать перспективы будущего."
 ###
 hun_reform_military_funding: "Реформа военного финансирования"
 hun_reform_military_funding_desc: "Само собой разумеется, что перекачивание тысяч форинтов в новые кавалерии - это не самое оптимальное использование наших средств. Перераспределяя и пересматривая наши военные расходы, мы можем добиться военного прогресса гораздо более быстрыми темпами."
 ###
 hun_outer_infrastructure: "Расширенная инфраструктура"
 hun_outer_infrastructure_desc: "С учетом того, что инфраструктура на основной территории находится на пределе, мы можем переключить свое внимание на другие районы и улучшить положение на границе и в сельской местности, а также улучшить жизнь людей, это также позволит увеличить ограничения на поставки и ускорить передвижение наших армий."
 ###
 hun_prepare_war_bonds: "Приготовить военные облигации"
 hun_prepare_war_bonds_desc: "Мы не располагаем достаточными средствами для ведения широкомасштабной войны без союзников и должны быть готовы полагаться на народ и его щедрость для достижения победы в предстоящих конфликтах."
 ###
 hun_reopen_markets: "Возобновить национальные рынки"
 hun_reopen_markets_desc: "С возвращением национальной экономики в полную силу мы готовы вернуться в мир и вновь внести свой вклад в развитие глобального рынка."
 ###
 hun_socred: "Программы социального кредитования"
 hun_socred_desc: "В результате осуществления программ социального кредитования будет обеспечена защита населения и будут снижены показатели безработицы по всей стране."
 ###
 hun_rapprochement: "Пена"
 hun_rapprochement_desc: "Французы и наши соседи ударили нас ударом в спину в момент слабости во время окончания Великой войны, это пятно в нашем наследии побудило нас противостоять Франции и всей дипломатии в отношении них, однако мы должны быть готовы оглянуться на старые ошибки и использовать французов в нашу пользу, захватив у нас земли, украденную два десятилетия назад."
 ###
 hun_discuss_trans: "Обсуждение трансильванского вопроса"
 hun_discuss_trans_desc: "Румынцы украли у нас Трансильванию, когда они вторглись вместе с французами в 1920 году, и с тех пор наша первостепенная задача заключается в том, чтобы вернуть Карпатские земли, которые были незаконно вырваны из нашего досягаемости. Возможно, мы сможем решить этот вопрос словами, а не пулями."
 ###
 hun_discuss_slovakia: "Обсуждение судьбы Словакии"
 hun_discuss_slovakia_desc: "Мы должны обеспечить, чтобы французы поддержали наше требование к Словакии, чтобы она не попала в руки немцев."
 ###
 hun_discuss_croatia: "Обсуждение хорватского суверенитета"
 hun_discuss_croatia_desc: "Статус Хорватии оспаривается с момента вмешательства Сербии в Боснию после окончания Великой войны, когда многочисленные государства заявляют, что эти земли являются их собственными."
 ###
 hun_agressive_policy: "Меч"
 hun_agressive_policy_desc: "Мы не можем рассчитывать на то, что крупнейшие европейские державы помогут нам вернуть Транслейтанские земли, которые мы когда-то занимали, мы должны взять дело в свои руки, если мы хотим вернуть нашу страну к ее прежней славе."
 ###
 hun_demand_trans: "Спрос на Трансильванию"
 hun_demand_trans_desc: "Трансильванские земли призывают к воссоединению с Венгрией, мы должны освободить их от румынского подавления любыми средствами."
 ###
 hun_demand_slovakia: "Спрос на Словакию"
 hun_demand_slovakia_desc: "Хотя земли Словакии не являются этническими венгерскими, они находятся под венгерским правлением сотни лет назад, мы должны восстановить порядок в регионе и спасти их от немецких захватчиков."
 ###
 hun_demand_slovakia2: "Спрос на Словакию"
 hun_demand_slovakia2_desc: "Хотя земли Словакии не являются этническими венгерскими, они находятся под венгерским правлением сотни лет назад, мы должны восстановить порядок в регионе и спасти их от немецких захватчиков."
 ###
 hun_demand_croatia: "Спрос на Хорватию-Славонию"
 hun_demand_croatia_desc: "С 1102 года хорватские земли были объединены с Венгрией в личный союз, и только после Великой войны они насильно отделили нас и привезли под сербский багажник."
 ###
 hun_national_crisis: "Национальный кризис"
 hun_national_crisis_desc: "С учетом того, что Лондонский фондовый рынок стоит позади, пришло время раз и навсегда справиться с инакомыслием в нашей стране, мы изгоним Хорти и Куна из нашей страны и обеспечим наше будущее."
 ###
 hun_demand_truce: "Драстичные меры"
 hun_demand_truce_desc: "Переговоры с этими безумцами - это пустая трата времени, мы должны действовать быстро и с большой силой, если мы хотим восстановить мир на наших землях."
 ###
 hun_root_out_commies: "Уничтожить коммунистов"
 hun_root_out_commies_desc: "Бела Кун слишком долго наводит на нас хаос. и это животное должно быть поймано и убито."
 ###
 hun_hunt_blackshirts: "Охота на черные футболки"
 hun_hunt_blackshirts_desc: "Жаль, что такой военный гений, как Миклош Хорти, повернулся бы против своей собственной нации, но мы должны сделать то, что необходимо для обеспечения стабильности в будущем."
 ###
 hun_national_unification: "Единая нация"
 hun_national_unification_desc: "С пятнами позора, покинутыми нашей нацией, мы наконец можем смотреть наружу с гордостью и силой."
 ###
 hun_concessions_for_peace: "Концессии во имя мира"
 hun_concessions_for_peace_desc: "Возможно, насилие и кровопролитие не являются лучшими методами поражения нашего врага."
 ###
 hun_social_autonomy_towns: "Автономные социалистические города"
 hun_social_autonomy_towns_desc: "Некоторые города уже десятилетиями страдают социалистическими тенденциями, и если мы отдадим этим городам их приватность, то сможем связать коммунистов с открытой дипломатией."
 ###
 hun_blackshirt_amnesty: "Амнистия за черные футболки"
 hun_blackshirt_amnesty_desc: "Черные футболки могут быть террористами, но они никогда не согласятся на переговоры до тех пор, пока они будут заклеймены как таковые."
 ###
 hun_budapest_conference: "Будапештская конференция"
 hun_budapest_conference_desc: "Наши враги готовы выступить, и нам пора сесть и провести гражданскую дискуссию о том, в каком направлении движется наша страна."
 ###
 hun_a_nation_reborn: "Возрождение нации"
 hun_a_nation_reborn_desc: "Венгерская нация одержала победу в кризисе, и этот опыт затруднил нас."
 ###
 hun_general_election: "Восстановление всеобщих выборов"
 hun_general_election_desc: "Первоначально намеченный на 1932 год, но приостановленный из-за действий Красной милиции и Черных футболок, угрожающих разорвать нацию, настало время восстановить выборы и продолжить демократический процесс."
 ###
 hun_keep_elections_suspended: "Остановить выборы"
 hun_keep_elections_suspended_desc: "Мы долгое время были у власти, чтобы рискнуть потерять его на выборах, и проклятым социалистам нельзя позволить получить опору в нашей стране."
 ###
 hun_arrow_cross_paramilitary: "Формировать "Кросс Стрелы""
 hun_arrow_cross_paramilitary_desc: "Мы не пойдем тихо в темноту, мы должны сформировать военизированные силы, чтобы сохранить наши позиции на некоторое время."
 ###
 hun_harass_opponents: "Политические оппоненты Харас"
 hun_harass_opponents_desc: "Стрелковый крест на нашем пути и вызову, пришло время начать планы, мы должны спасти эту сломленную нацию от самого себя."
 ###
 hun_formalize_paramilitary: "Формализация Стрелового креста"
 hun_formalize_paramilitary_desc: "Настало время вывести этих людей из тени и выйти на улицы."
 ###
 hun_outlaw_leftist_parties: "Незаконные левые партии"
 hun_outlaw_leftist_parties_desc: "Социалисты наблюдают за нами со всех сторон, мы должны запретить нашему врагу вступать в политическую сферу, если мы хотим когда-либо надеяться на то, что эта нация будет защищена от когтей авангардов."
 ###
 hun_declare_the_junta: "Объяви хунту!"
 hun_declare_the_junta_desc: "Наконец-то настало время, когда в этот славный день будет свернута ложная нить демократии. Это, несомненно, привлечет внимание международного сообщества, но мы не ожидаем, что какие-либо крупные державы будут действовать против нас. Мы сломаем цепи Энтези и отправимся на новый путь истории."
 ###
 hun_martial_law: "Объявление военного права"
 hun_martial_law_desc: "Протесты и беспорядки вспыхивают по всей стране, мы должны объявить военное положение, чтобы наше правление не было свергнуто народным восстанием и чтобы к власти пришло коллективное правительство."
 ###
 hun_state_industry: "Государственно-промышленная индустрия"
 hun_state_industry_desc: "Мы должны полностью контролировать промышленный потенциал нашей страны, если мы хотим работать на полную эффективность."
 ###
 hun_dismantle_unions: "Разрозненные союзы"
 hun_dismantle_unions_desc: "Профсоюзы - это путь к коллективизму, мы должны уничтожить все оставшиеся очаги социализма в нашей стране, чтобы обеспечить вечную стабильность."
 ###
 hun_secret_police: "Расширить секретную полицию"
 hun_secret_police_desc: "Нам нужно искоренить инакомыслие там, где оно появляется, и секретная полиция очень поможет нам в этом."
 ###
 hun_militarized_police: "Милитаризировать полицию"
 hun_militarized_police_desc: "Репрессия - это путь к безопасности. Люди должны быть поставлены на свое место, если мы хотим оставаться у власти на протяжении веков."
 ###
 hun_abolish_parliment: "Отложите работу парламента навеки"
 hun_abolish_parliment_desc: "Венгерский парламент является старой реликвией нашего демократического прошлого, мы должны снять этот мёртвый груз с наших плеч, если мы хотим продвинуться вперед в реализации наших планов."
 ###
 hun_army_purge: "Охраняйте армию"
 hun_army_purge_desc: "Мы слышали слухи о том, что какая-то фракция в вооруженных силах готовится к движению сопротивления против нашей страны, мы должны обеспечить, чтобы этот план никогда не видел света дня."
 ###
 hun_army_loyalty: "Обеспечение лояльности армии"
 hun_army_loyalty_desc: "Очистка завершена, и мы должны обеспечить, чтобы остающиеся элементы армии были полностью преданы нашему правительству и нашему делу."
 ###
 hun_officer_loyalty: "Обеспечение лояльности сотрудника"
 hun_officer_loyalty_desc: "Офицерский корпус сильно пострадал в ходе чистки, мы должны реабилитировать и переподготовить офицеров, находящихся под нашим руководством, чтобы избежать восстаний."
 ###
 hun_burn_books: "Сжигание книги"
 hun_burn_books_desc: "Книги - это способ враждебной пропаганды распространять и сеять в умах наших граждан, мы должны обеспечить, чтобы эти ненавистные книги были уничтожены, чтобы их нельзя было читать и чтобы их идеи не могли копироваться."
 ###
 hun_propaganda: "Министерство по установлению истины"
 hun_propaganda_desc: "Людям нужно говорить правду, полную правду и ничего, кроме правды."
 ###
 hun_restore_order: "Восстановление общественного порядка"
 hun_restore_order_desc: "" #the prev description was so fucking cringe
 ###
 hun_the_presidents_policy: "Политика президентов"
 hun_the_presidents_policy_desc: "С завершением революции мы сможем продолжить демократический процесс."
 ###
 hun_truce_with_transylvania: "Мир с Трансильвинией"
 hun_truce_with_transylvania_desc: "Румынцы препятствуют нам аннексии Трансильвании на каждом шагу вперед, мы должны искать политический союз с нашими Трансильванскими соседями в попытке приблизиться к ним."
 ###
 hun_rapport_with_romania: "Раппорт с Румынией"
 hun_rapport_with_romania_desc: "Отношения с Румынией были практически разрушены, но они все еще могут быть спасены."
 ###
 hun_sooth_the_serbs: "Успокой сербов"
 hun_sooth_the_serbs_desc: "Дикое сербское государство - это пустая пушка, и они могут вылететь в любой момент."
 ###
 hun_trans_danube_alliance: "Альянс транс-Данубе"
 hun_trans_danube_alliance_desc: "Мир становится все более опасным, мы должны собраться вместе, если хотим пережить эти трудные годы, и по мере того, как Европа погрузится в пламя, мы станем маяком света и святости."
 ###
 hun_danube_research_bloc: "Дунайский научно-исследовательский блок"
 hun_danube_research_bloc_desc: "Объединение наших исследовательских усилий позволит нам раскрыть технологические достижения гораздо быстрее, чем мы сможем сделать это в одиночку. Мы предложим эту идею другим членам фракции и посмотрим, кого еще интересует перспектива."
 ###
 hun_integrated_officer_corps: "План создания объединенного корпуса сотрудников"
 hun_integrated_officer_corps_desc: "Мы предложим нашим коллегам-членам фракций идею объединения наших офицеров в центральные команды, что будет способствовать единству между нашими нациями и позволит нашим военным работать в тандеме друг с другом при значительно большей эффективности."
 ###
 hun_transnational_rail_lines: "Транснациональные железнодорожные линии"
 hun_transnational_rail_lines_desc: "Карпатские горы затрудняют поездки по региону, однако сейчас мы можем построить крупную и сложную железнодорожную систему вокруг Баната, где все члены группировок имеют общую границу."
 ###
 hun_joint_banat_military_test: "Совместные военные учения Банат"
 hun_joint_banat_military_test_desc: "Наши офицеры, наконец, сотрудничают друг с другом, и мы можем проверить наших военных вместе с упражнением в районе Банат, что даст нам большой опыт и понимание того, как будет функционировать армия, если фракция когда-либо централизуется в союз."
 ###
 hun_a_formal_union: "Союз, не только по имени."
 hun_a_formal_union_desc: "Настало время полностью объединить нашу фракцию в политический союз, и мир вокруг нас с каждым днем становится все более опасным, и мы должны объединиться, если мы хотим оставаться сильными и выдержать испытание временем."
 ###
 hun_trianon_treaty: "Договор Трианона"
 hun_trianon_treaty_desc: "С улучшением наших отношений мы можем попросить французов пересмотреть договор Трианона и позволить нам расширить наши военные силы в большей степени."
 ###
 hun_purchase_french_arty: "Предложение купить французскую артиллерию"
 hun_purchase_french_arty_desc: "Старые орудия Великой войны, возможно, не самые изощренные технологии на планете, но у французов их слишком много, и мы отчаянно нуждаемся в большем полевом оружии."
 ###
 hun_french_industrial_methods: "Французские промышленные методы"
 hun_french_industrial_methods_desc: "Мы отправим контролеров во Францию с целью изучения и наблюдения за тем, как функционирует французская промышленность, и надеемся, что мы сможем научиться чему-то новому и улучшить свою собственную промышленность."
 ###
 hun_french_officers: "Французские офицеры в Венгрии"
 hun_french_officers_desc: "Мы можем попросить французов послать некоторых офицеров в попытке усовершенствовать нашу армию любым возможным образом, и мы надеемся, что это поставит нас на передний край военной теории и структуры."
 ###
 hun_lease_french_ports: "Аренда французских портов"
 hun_lease_french_ports_desc: "Мы потеряли доступ к морю в соответствии с Договором Энниси, и наши надежды на могущественный флот исчезли вместе с ним, и благодаря нашим недавно улучшенным отношениям с французами мы можем арендовать несколько французских портов в попытке усовершенствовать наши военно-морские технологии."
 ###
 hun_french_air_training: "Обучение французскому авиаперевозчику"
 hun_french_air_training_desc: "Хотя у французов не было величайших достижений в Великой войне, у них все еще есть много конкурентоспособных пилотов и офицеров, которые могут быть готовы научить нас путям неба."
 ###
 hun_join_entente: "Присоединяйтесь к Континентальному Континенту."
 hun_join_entente_desc: "Мы тщательно восстановили отношения с Францией, и теперь мы можем направить официальное приглашение присоединиться к Континентальному Континенту."
 ###
 hun_british_imports: "Британский импорт"
 hun_british_imports_desc: "Мы решили связать себя с Великобританией, и первый порядок бюзисности укрепляет нашу торговлю с Империей."
 ###
 hun_oxford_budapest_uni_joint: "Совместные исследования в Оксфорде и Будапеште"
 hun_oxford_budapest_uni_joint_desc: "Оксфордский университет известен по всему миру своими высокими академическими стандартами, и Будапештский университет становится все более известным по всей Европе."
 ###
 hun_the_london_pact: "Лондонский пакт"
 hun_the_london_pact_desc: "Мы будем просить британцев разработать новый договор, который поможет нам, а не помешает нам."
 ###
 hun_revise_annecy: "Переосмыслить Эннси"
 hun_revise_annecy_desc: "Наши отношения с англичанами улучшились до такой степени, что мы можем спросить британцев, готовы ли они еще раз взглянуть на Договор Энниси и, возможно, если бы они могли снять или по крайней мере изменить договор, чтобы он был менее разрушительным для наших военных."
 ###
 hun_british_aircraft_templates: "Британские авиационные лицензии"
 hun_british_aircraft_templates_desc: "Британцы - это не только парагоны океанов, но и небо, мы должны попросить разрешения на их самолеты, если мы хотим взять под контроль небо над Карпатией."
 ###
 hun_british_resource_imports: "Импорт британских ресурсов"
 hun_british_resource_imports_desc: "Британская империя огромна и полна ресурсов, которые не используются на благо."
 ###
 hun_join_ipa: "Подать заявку на вступление в АПИ"
 hun_join_ipa_desc: "Вступление в Альянс имперской защиты является последним шагом к укреплению отношений с Британской империей и позволит нам свободно расширять наши границы при международной поддержке Британской империи."
 ###
 hun_horthys_plan: "Большой план Хорти"
 hun_horthys_plan_desc: "Хорти был создан как регент Венгрии, держащий пустой трон без наследников, мы должны выбрать путь для нашего народа, чтобы продолжить наше выживание."
 ###
 hun_end_the_regency: "Окончить регентство"
 hun_end_the_regency_desc: "Хорти - это регент трона, без истцов, по сути дела, заставляющий его регентствовать на всю жизнь. Это считается в глазах большинства монархий крайне нелегитимным, и чтобы предотвратить вмешательство, мы должны выбрать кого-то, кто займет трон."
 ###
 hun_crown_horthy_king: "Король лошади"
 hun_crown_horthy_king_desc: "Иностранцы сидит на нашем троне сотни лет, и не после падения Константинополя наш корону держал настоящий венгер, хотя Хорти, возможно, не имеет права на монархию, он венгерский, и этого может быть достаточно, чтобы заставить людей принять его."
 ###
 hun_invite_charles_habsburg: "Пригласи Карла И фон Габсбурга-Лоррейна"
 hun_invite_charles_habsburg_desc: "Карл I является несомненным претендентом на венгерский трон, и многие в Венгрии хотят, чтобы он вернулся из своего изгнания в Швейцарию."
 ###
 hun_memories_of_the_empire: "Воспоминания Империи"
 hun_memories_of_the_empire_desc: "Австро-венгерская империя видела, как Венгрия достигла своей крупнейшей территории с возраста кочевого племени."
 ###
 hun_the_galician_legacy: "Галицкое наследие"
 hun_the_galician_legacy_desc: "Хотя Галисия исторически была частью Сислетанской Австрии, она была намного ближе к Будапешту, чем Вена."
 ###
 hun_save_the_bosnians: "Освободительная Босния"
 hun_save_the_bosnians_desc: "После первой Великой войны сербы взяли под свой контроль Боснию, надеясь объединить всех южнославов под их тираническим правлением, мы должны вернуть сербов на свое место и утвердить гегемонию над славянскими землями."
 ###
 hun_ties_to_germany: "Тейс в Германию"
 hun_ties_to_germany_desc: "Новая Немецкая Империя быстро становится доминирующей силой в Европе, и мы должны обеспечить, чтобы мы были на правой стороне истории, если и когда они решат сразиться за превосходство континента."
 ###
 hun_german_officers: "Немецкие офицеры в Венгрии"
 hun_german_officers_desc: "Вермахт является чрезвычайно профессиональной и опытной армией, и мы могли бы многому научиться у опытных офицеров бывшей Германской империи."
 ###
 hun_suggest_centroslav_partition: "Предложение о разделе Западославия" #I spent a solid 15 minutes trying to decide how to spell Zap.
 hun_suggest_centroslav_partition_desc: "Словакия является неотъемлемой частью венгерского королевства, и маловероятно, что мы сможем восстановить его в одиночку."
 ###
 hun_german_minority_rights: "Права немецкого меньшинства"
 hun_german_minority_rights_desc: "Немецкая иммиграция на протяжении последних веков создала в Венгрии сильнейшее немецкое меньшинство."
 ###
 hun_join_stahlpakt: "Присоединяйся к Пакту Стали"
 hun_join_stahlpakt_desc: "Отношения с Германией значительно улучшились до такой степени, что теперь мы можем рассмотреть вопрос об официальном оформлении альянса и присоединении к Пакту Стали."
 ###
 hun_request_slovakia: "Просьба словацкого владычества"
 hun_request_slovakia_desc: "Словацкая нация упала под германскую обувь, и мы присвоили себе эту территорию, и немцы не проявляют большого интереса к Словакии из-за ее культурных различий и отсутствия индустриализации, что означает, что они должны быть готовы отказаться от нее, если мы попросим об этом."
 ###
 hun_dont_need_nobody: "Наш собственный путь"
 hun_dont_need_nobody_desc: "Слишком долго Венгрия находилась под игом иностранной державы, и ее будущее диктуется каким-то королем в тысяче миль от замка."
 ###
 hun_support_centroslav_partisans: "Поддержка венгерских сеператиков"
 hun_support_centroslav_partisans_desc: "Южная Нитра является этнической венгерской страной, и почти все население желает вернуться к нашей стране."
 ###
 hun_support_transylvanian_hungarians: "Руки Трансильванских венгров."
 hun_support_transylvanian_hungarians_desc: "У нас избыток старых винтовок от Великой войны, и мы должны использовать их на благо, если мы переправим оружие в Трансильванию, этническое венгерское население может помочь нам в завоевании нации."
 ###
 hun_hungary_first: "Венгрия первая!"
 hun_hungary_first_desc: "Когда Хорти выступает в качестве короля Венгрии, мы можем наполнить венгерский народ националистической гордостью и бродяжничеством. 30 лет назад мы можем начать крестовый поход, чтобы вернуть наши территории, утраченные 30 лет назад."
 ###
 hun_full_irredentism: "Приготовьте Венгрию к войне"
 hun_full_irredentism_desc: "Наша военная индустрия была подорвана Договором Энниси и давлением наших соседей, и если мы когда-либо надеемся выиграть на поле боя, наши фабрики должны быть в состоянии продолжать производство оружия и военных машин."
 ###
 hun_pact_with_bulgaria: "Альянс с Болгарией"
 hun_pact_with_bulgaria_desc: "Болгарцы сильно пострадали в конце первой Великой войны, потеряв много земли, которую они получили во время Первой балканской войны."
 ###
 hun_transylvanian_ultimatum: "Ультиматум -- Трансильвания"
 hun_transylvanian_ultimatum_desc: "Трансильванская нация была пятном на мировых картах с самого начала, и пришло время взять дело в свои руки, с достаточно большой армией, мы можем обеспечить, чтобы Трансильванцы приняли наши требования и были возвращены под контроль."
 ###
 hun_attack_serbia: "Спрос на Западный Банат"
 hun_attack_serbia_dec: "Западный Банат - это весьма подобающий район, полный лесов и рек. Для того чтобы обезопасить нашу южную границу, мы должны взять этот регион под контроль сербского правительства. Вероятность того, что они примут его, очень низка, но мы должны попытаться."
 ###
 hun_attack_serbia_butlikereallykillthem: "Месть 1914/19"
 hun_attack_serbia_butlikereallykillthem_desc: "Сербы убили нашего эрцгерцога, а затем сыграли роль жертвы, присоединившись к вырезанию нас в 1919 году, и мы раз и навсегда воспользуемся этой экзистенциальной угрозой."
 ###
 hun_demand_slovakia: "Спрос на Словакию"
 hun_demand_slovakia_desc: "Словакия находится под венгерским правлением сотни лет, и она была незаконно взята у нас после Великой войны, и мы должны потребовать, чтобы регион был возвращен ее законным владельцам, и спасти Словакию от порочной федерации, к которой она прикована."
 ###
 hun_demand_ljubljana: "Спрос на Далматию"
 hun_demand_ljubljana_desc: "Итальянское правительство уже несколько месяцев находится в руинах, возможно, если мы отправим список требований, включая передачу Любляны и Далматии, они будут готовы сдаться."
 ###
 hun_invite_a_transylvanian_noble: "Пригласи Трансильванского благородного"
 hun_invite_a_transylvanian_noble_desc: "Трансильвания является неотъемлемой частью Венгрии, и ее восстановление должно быть самым важным из наших приоритетов."
 ###
 hun_open_transylvanian_diplomacy: "Открытая Трансильванская дипломатия"
 hun_open_transylvanian_diplomacy_desc: "С самого начала с Трансильвании не было чётких дипломатических связей из-за недовольства нашего правительства в связи с их зависимостью. Теперь, когда у нас есть Трансильванец на троне, мы можем попытаться наладить отношения и работать в направлении интеграции."
 ###
 hun_guaruntee_transylvania: "Защищенная Трансильванская зависимость"
 hun_guaruntee_transylvania_desc: "Мы должны защитить Трансильванию от румын, которые хотят аннексировать землю, и разграбить ее, сколько бы она ни стоила, это сблизит нас, на шаг ближе к интеграции."
 ###
 hun_suggest_transylvanian_union: "Предложить защиту от Трансильвании"
 hun_suggest_transylvanian_union_desc: "Румынцы цепляются за аннексию Трансильвании, прежде чем мы сможем."
 ###
 hun_reintegrating_transylvania: "Возвращение к Трансильвании"
 hun_reintegrating_transylvania_desc: "Мы должны начать долгий, скучный процесс управления Трансильванским регионом и вернуть его в строй."
 ###
 hun_deporting_the_romanians: "Депортация румын"
 hun_deporting_the_romanians_desc: "Мы должны удвоить все усилия, чтобы вывести румынский народ из Трансильвании и утвердить себя как неоспоримый гегемон региона."
 ###
 hun_transylvanian_railroads: "Трансильванские железные дороги"
 hun_transylvanian_railroads_desc: "Трансильванское правительство проделало плохую работу по поддержанию своей железнодорожной системы, и теперь мы должны вложить деньги в регион в попытке восстановить инфраструктуру, с тем чтобы она соответствовала условиям остальной части страны."
 ###
 hun_restore_transylvanian_forts: "Восстановление системы Трансильванского Форта"
 hun_restore_trasnylvanian_forts_desc: "Возвращение старых довоенных крепостей к современным стандартам даст нам ценное время, если румыны стучатся."
 ###
 hun_anti_romania: "Антирумынская риторика"
 hun_anti_romania_desc: "Румынцы - наш настоящий враг, и мы должны обеспечить, чтобы все наши граждане были готовы к великой борьбе, когда она настанет."
 ###
 hun_demand_banat: "Спрос на Западный Банат"
 hun_demand_banat_desc: "Западный Банат является чрезвычайно ценным куском земли, и с его помощью мы сможем защитить наш южный фронт в интересах устойчивого будущего, и сербы вряд ли сдадутся, но, возможно, некоторые военные демонстрации будут их принуждать."
 ###
 hun_march_onto_brasov: "Марш в Брашов"
 hun_march_onto_brasov_desc: "Политический кишечник никуда нас не довел, пришло время прекратить играть в игры и дать победителю решить историю, мы насильно возьмем Брасова и заставим Трансильванию преклонить перед нами колени."
 ###
 hun_the_regency_forever: "Редкость навсегда"
 hun_the_regency_forever_desc: "Монархии нестабильны, монархи непредсказуемы. Репутация стабильна и поддающаяся контролю, и поэтому наш политический путь очевиден. Хорти будет регентом на всю жизнь."
 ###
 hun_centralize_the_regency: "Централизация регентства"
 hun_centralize_the_Regency_desc: "Делегирующая власть может быть опасной, а амбициозные люди, обладающие слишком большой властью, могут быстро привести к восстанию или революции."
 ###
 hun_decentralize_the_regency: "Децентрализация регентства"
 hun_decentralize_the_regency_desc: "Слишком большое давление на одного человека может позволить проблемам проскользнуть через трещины."
 ###
 hun_soclib: "Социальная либеральная победа"
 hun_soclib_desc: "Социальная либеральная партия выиграла выборы."
 ###
 hun_civil_rights: "Расширение гражданских прав"
 hun_civil_rights_desc: "Социально либеральное правительство должно соответствовать своему названию, и мы должны расширить права народа для обеспечения гражданской стабильности и счастья среди населения."
 ###
 hun_soccon: "Социальная консервативная победа"
 hun_soccon_desc: "Социально-консервативная партия выиграла выборы."
 ###
 hun_tariff_increase: "Повышение тарифов"
 hun_tariff_increase_desc: "Консерваторы победили на выборах, и мы начнем прижигать их политику, первым из которых является повышение тарифов."
 ###
 hun_marklib: "Либеральная победа на рынке"
 hun_marklib_desc: "Либеральная партия рынка выиграла выборы."
 ###
 hun_open_market: "Вклад в развитие свободного рынка"
 hun_open_market_desc: "Рыночное либеральное правительство решило, что наш первый порядок бюзистивности - это откачать больше ресурсов в мировую экономику, чтобы компенсировать полное закрытие рынков во время Лондонского фондового рынка."
 ###
 hun_socdem: "Социальная демократическая победа"
 hun_socdem_desc: "Партия социал-демократов выиграла выборы."
 ###
 hun_phase_1_plan: "Первая фаза Szocialis Terv"
 hun_phase_1_plan_desc: "Недавно сформированное правительство имеет хитрый план по значительному улучшению положения как трудящихся, так и граждан."
 ###
 hun_bela_kun: "Новый Манифест"
 hun_bela_kun_desc: "Бела Кун захватила власть, и сейчас мы должны начать процесс превращения Венгрии в сильное социалистическое государство, способное выдержать давление тех, кто хотел бы, чтобы мы свергли нас."
 ###
 hun_vang_start: "Ванхардистское крыло Партии"
 hun_vang_start_desc: "Враги являются самыми воинственными и агрессивными из ветвей сокайвистов в нашей стране."
 ###
 hun_vang_purge: "Хирурги Лоялисты Хорти"
 hun_vang_purge_desc: "В то время как сам Хорти, возможно, мертв, многие все еще цепляются за его дело в тщетной надежде на то, что он справится со своей мечтой, мы должны принять активные меры для того, чтобы очистить этих лоялистов от нашего правительства и нашего общества."
 ###
 hun_vang_council: "Учредить Народный совет"
 hun_vang_council_desc: "Матьяс Ракоси не может управлять нацией самостоятельно, мы должны создать консультативный совет, чтобы помочь ему управлять нашим социалистическим государством."
 ###
 hun_vang_council_power: "Расширение полномочий Совета"
 hun_vang_council_power_desc: "Расширение их обязанностей и полномочий только облегчит управление и позволит нашему государству процветать."
 ###
 hun_vang_council_militia: "Учредить народный совет"
 hun_vang_council_militia_desc: "Предоставление Народному совету их собственной армии позволит им напасть на тех, кто остается у нас в стране. Наш абсолютный контроль над государством скоро будет завершен, и скоро социалистическая мечта будет полностью реализована!"
 ###
 hun_vang_council_seize_power: "Специальное заседание Народного совета"
 hun_vang_council_seize_power_desc: "Народный совет обратился с просьбой о нашем срочном присутствии на специальном заседании, которое было поручено им. Совет говорит, что это крайне срочно, и наше присутствие имеет первостепенное значение для охраны и безопасности государства."
 ###
 hun_collie_start: "Умеренное социалистическое крыло партии"
 hun_collie_start_desc: "Традиционное управление делает людей счастливыми и будет вести к стабильному будущему."
 ###
 hun_libsoc_start: "Кун Седес - власть для свободных социалистов"
 hun_libsoc_start_desc: "Годы сопротивления государству оставляют Куна слабыми в глазах многих, и под давлением он уступит власть либертарианским социалистам. Либертарианский социализм -- это крайне автономный сектор социализма, и некоторые члены призывают к полному отвращению государства. Это правительство сосредоточится на улучшении прав трудящихся и создании безопасного убежища для опрессированного пролетариата во всем мире."
 ###
 hun_vang_indoctrination: "Социальная индоктринация"
 hun_vang_indoctrination_desc: "Мы должны представить наше новое правительство как правительство мира, безопасности и прозорливости, иначе народ не примет нас и вместо этого восстанет против нашего правления."
 ###
 hun_vang_destroy_croatian_unrest: "Уничтожить хорватские волнения"
 hun_vang_destroy_croatian_unrest_desc: "Слишком долго хорваты сопротивлялись нашему правлению, и настало время принести революцию в регион и обеспечить безопасность нашей южной границы с сербами и итальянцами."
 ###
 hun_vang_army: "Социалистическая армия"
 hun_vang_army_desc: "Мы должны оживить нашу армию, чтобы подготовиться к войнам, которые мы должны вести против наших капиталистов-противников."
 ###
 hun_new_model_rifle: "Новая модель винтовки"
 hun_new_model_rifle_desc: "Мы должны сосредоточить наши исследовательские усилия на новой современной винтовке, которая будет хорошо служить нам в предстоящих войнах."
 ###
 hun_soviet_army_cooperation: "Сотрудничество с Советской Армией"
 hun_soviet_army_cooperation_desc: "Советская армия велика и опытна, мы должны стремиться к сотрудничеству с Красной Армией в попытке приобрести опыт и создать нашу собственную професиональную красную армию."
 ###
 hun_vang_collie_research_cities: "Назначенные научно-исследовательские города"
 hun_vang_collie_research_cities_desc: "Советское движение в России экспериментирует с идеей назначения конкретных городов для сосредоточения исследований на конкретной области, и испытания до сих пор оказались весьма успешными. Мы должны использовать это в своих интересах и создать свои собственные "исследовательные города"."
 ###
 hun_vang_collie_research_soviets: "Советское научно-исследовательское сотрудничество"
 hun_vang_collie_research_soviets_desc: "Советы гораздо более развиты, чем мы технологически, используя современные летательные аппараты и оружие."
 ###
 hun_vang_collie_socialist_breakthroughs: "Социалистические прорывы"
 hun_vang_collie_socialist_breakthroughs_desc: "Наши научно-исследовательские города работают на полную мощность, а награды огромны, новые открытия делаются каждый день, и исследования развиваются быстрее, чем когда-либо прежде."
 ###
 hun_collie_org_society: "Реорганизовать общество"
 hun_collie_org_society_desc: "Старая реликвия неэффективна и слаба, и в предстоящие годы нас только затянет, и мы должны реформировать наше общество в новое, современное, социалистическое общество."
 ###
 hun_collie_combat_homeless: "Борьба с бездомностью"
 hun_collie_combat_homeless_desc: "Старое демократическое правительство закрыло глаза на безудержную безработицу в нашей стране, и если она не будет решена в ближайшее время, она может стать неконтролируемой и необратимой."
 ###
 hun_collie_combat_unemployment: "Борьба с безработицей"
 hun_collie_combat_unemployment_desc: "Гражданин, который не работает, бесполезен."
 ###
 hun_collie_no_class_divide: "Уничтожить разрывы классов"
 hun_collie_no_class_divide_desc: "Сегрегация людей, основанная на их социальном положении, только вызовет возмущение и волнения, мы должны уравнять игровое поле для всех наших граждан и дать каждому шанс."
 ###
 hun_collie_every_man_an_equal: "Каждый человек равен"
 hun_collie_every_man_an_equal_desc: "Теперь, когда мы демонтировали классовую систему, пришло время нацелиться на дискриминацию по признаку пола, мужчины и женщины будут стоять бок о бок за восстание."
 ###
 hun_collie_socialist_education: "Социалистическое образование"
 hun_collie_socialist_education_desc: "Мы должны обеспечить, чтобы следующее поколение обучалось с социалистической точки зрения, с тем чтобы, когда придет время перейти факел, они были готовы распространить революцию."
 ###
 hun_libsoc_decentral: "Децентрализация"
 hun_libsoc_decentral_desc: "Тяжелая рука будет только давить на народ и провоцировать восстание."
 ###
 hun_libsoc_local_rulers: "Местные гувернантки"
 hun_libsoc_local_rulers_desc: "Мы должны назначить местных правителей для наблюдения и управления регионами в одиночку, в то время как мы сосредоточимся на делах всей нации."
 ###
 hun_libsoc_local_reps: "Региональные представительства"
 hun_libsoc_local_reps_desc: "Предоставление представителям каждого региона нашей страны права голоса позволит нам непосредственно решать проблемы народа."
 ###
 hun_libsoc_socialist_elections: "Социалистические выборы"
 hun_libsoc_socialist_elections_desc: "Свободные социалистические выборы приведут к новым беспорядкам и позволят добиться дальнейшего прогресса в нашем обществе."
 ###
 hun_libsoc_life_insurance: "Политика страхования жизни"
 hun_libsoc_life_insurance_desc: "Мы должны заботиться о благополучии наших граждан и помогать нуждающимся."
 ###
 hun_libsoc_healthcare: "Политика в области здравоохранения"
 hun_libsoc_healthcare_desc: "Болезнь свирепствует в сельской местности, унося тысячи жизней каждый год, и мы должны раз и навсегда искоренить эту чуму."
 ###
 hun_libsoc_pension: "Пенсионная политика"
 hun_libsoc_pension_desc: "Безработица, обусловленная возрастом, может быть разрушительной с финансовой точки зрения, и мы должны обеспечить каждому человеку доступ к фонду, который позволит ему прожить последние годы своей жизни в мире и комфорте."
 ###
 hun_libsoc_collie_reform_shift_work: "Реформированная смена работы"
 hun_libsoc_collie_reform_shift_work_desc: "Работа на сварливо горячем заводе в течение 18 часов в день наносит ущерб производительности и здоровью работника, мы должны обеспечить обновление правил."
 ###
 hun_libsoc_collie_employee_rights: "Укрепление прав трудящихся"
 hun_libsoc_collie_employee_rights_desc: "Мы отстаем от графика в том, что касается прав трудящихся, и давно назрела необходимость в обновлении этой политики."
 ###
 hun_libsoc_collie_dismantle_corps: "Разрушительные корпорации"
 hun_libsoc_collie_dismantle_corps_desc: "Разрушение этих крупных корпераций в нашей стране позволит процветать нашей экономике, которая больше не связана с тарифами."
 ###
 hun_libsoc_workers_haven: "Работники Хэйвен"
 hun_libsoc_workers_haven_desc: "Мы создадим убежище для работника, место, где все могут быть свободны при правительстве, где никому не придется бояться опасностей, связанных с работой фабрики."
 ###
 hun_libsoc_socialist_industry: "Социалистическая промышленность"
 hun_libsoc_socialist_industry_desc: "Наше объединённое общество - это как хорошо прожаренная машина, движущаяся на пике эффективности, мы сможем опередить всех наших врагов на поле боя."
 ###
 hun_libsoc_invite_foreign_workers: "Приглашать иностранных рабочих"
 hun_libsoc_invite_foreign_workers_desc: "Румынцы, немцы, французы, испанцы, приезжайте в Венгрию и освободите себя от оков подавления!"
 ###
 hun_socialist_dip: "Социалистическая дипломатия"
 hun_socialist_dip_desc: "Теперь, когда мы стабалилим наше правление, мы должны смотреть на мир и взаимодействовать с другими странами мира."
 ###
 hun_ussr_ties: "Связи с советскими войсками"
 hun_ussr_ties_desc: "Мы не можем выдержать демократического давления, которое окружает нас, и нам нужно связать себя с Советскими государствами, если мы хотим выжить в предстоящие годы."
 ###
 hun_ussr_industry: "Советское промышленное сотрудничество"
 hun_ussr_industry_desc: "Советская военная машина - это чрезвычайно внутреннее и сложное существо, которое позволяет советцам производить огромное количество оборудования и транспортных средств, мы должны изучать их промышленность и использовать энергию для себя."
 ###
 hun_ussr_infra: "Советские методы развития инфраструктуры"
 hun_ussr_infra_desc: "Советский Союз огромен, как и его сеть автомобильных и железных дорог, мы должны изучить советскую инфраструктуру и воспроизвести ее в Венгрии, если мы хотим привести себя в соответствие с их стандартами."
 ###
 hun_expand_red_army: "Расширить Красную Армию"
 hun_expand_red_army_desc: "Венгерская Красная Армия все еще довольно мала, особенно по сравнению с нашими советскими соседями."
 ###
 hun_soviet_doctrine: "Технологические исследования Советской армии"
 hun_soviet_doctrine_desc: "Советы следуют очень неортодоксальной военной доктрине, настолько безумной, что это может быть то, что нам нужно для успеха в наших собственных войнах."
 ###
 hun_join_soviets: "Присоединяйтесь к третьей международной организации"
 hun_join_soviets_desc: "Чтобы завершить революцию, мы должны присоединиться к нашим социалистическим братьям в Москве и уничтожить старые режимы Европы в качестве союзников, а не врагов."
 ###
 hun_homemade_socialism: "Венгерский социализм"
 hun_homemade_socialism_desc: "Мы должны быть осторожны, чтобы не попасть в хватку Советов в России, или мы можем найти просто марионеточное правительство под ботинком Москвы, мы создадим свой собственный бренд венгерского социализма и распространим его по всей Европе."
 ###
 hun_bulgar_commies: "Спрос на Южную Воеводину"
 hun_bulgar_commies_desc: ""
 ###
 hun_strong_bulgar: "Покрасить Адриатический красный"
 hun_strong_bulgar_desc: ""
 ###
 hun_invade_trans: "Привести революцию в Трансильванию"
 hun_invade_trans_desc: "Работники Трансильвании пережили невыразимые ужасы при коррумпированном и неэффективном правительстве."
 ###
 hun_budapest_award: "Спрос на Словакию"
 hun_budapest_award_desc: ""
 ###
 hun_red_bloc: "Красная Центральная Европа"
 hun_red_bloc_desc: "Мы должны создать фракцию не только для того, чтобы пережить волну валькизма и демократии, но и для того, чтобы распространить революцию и на наших соседей."
 ###
 hun_air_innovate: "Воздушный перевооружение"
 hun_air_innovate_desc: "В то время как Ансийский договор повредил нашу армию и лишил нас нашего флота и способности строить его, его положения в отношении создания военно-воздушных сил были невероятно легкими, поскольку наши лидеры в настоящее время не хотят ставить под сомнение диктат Энси, надежды, имеющие силы, способные защитить венгерскую родину, могут остаться в небе."
 ###
 hun_air_fighter_choice: "Выбор борцов"
 hun_air_fighter_choice_desc: "Боевики являются главным компонентом любых военно-воздушных сил, и мы должны быть уверены в том, что будем постоянно держать в курсе новейших технологий и доктрин."
 ###
 hun_air_fighter_1: "Легкий истребитель Focus 1"
 hun_air_fighter_1_desc: "Исследователи по всей стране уделяют основное внимание разработке новых моделей воздушных судов, которые окажутся полезными в предстоящих войнах."
 ###
 hun_air_fighter_2: "Легкий истребитель Fcus 2"
 hun_air_fighter_2_desc: "Экспериментальный самолет летит, чтобы увидеть, что работает, а что нет, что дает нам ценный опыт."
 ###
 hun_air_heavy_1: "Фокус 1 тяжелого боя"
 hun_air_heavy_1_desc: "Без защиты наши бомбардировщики будут выброшены с неба, как пчёлы, мы должны обеспечить их защиту до самого места назначения и обратно."
 ###
 hun_air_heavy_2: "Фокус 2 тяжелого боя"
 hun_air_heavy_2_desc: "Новые модели тяжелых боевиков способны преодолевать большие расстояния и оставаться в воздухе на протяжении более длительного времени, что позволит нашим бомбардировщикам достичь своей цели и благополучно вернуться."
 ###
 hun_air_doctrine_1: "Исследования по вопросам поддержки боевых действий"
 hun_air_doctrine_1_desc: "Поддержка сухопутных войск - это искусство, и мы должны быть уверены, что будем владеть этим искусством, если хотим выиграть сражения, которые мы сражаемся."
 ###
 hun_air_bomber_choice: "Выбор бомбардировщиков"
 hun_air_bomber_choice_desc: "Разрушение нашей вражеской промышленности и инфраструктуры является ключом к быстрой победе, но есть несколько путей для этого. Тактические бомбардировщики быстрее и быстрее, но они не могут добраться до стратегических бомбардировщиков."
 ###
 hun_air_tac_1: "Тактический бомбардировщик Focus 1"
 hun_air_tac_1_desc: "Быстрые и эффективные удары по вражеской территории являются ключом к успеху на поле боя, и мы должны продумать эту теорию еще больше, если мы хотим создать профессиональную армию."
 ###
 hun_air_tac_2: "Тактический бомбардировщик Focus 2"
 hun_air_tac_2_desc: "Новые модели тактических бомбардировщиков выбрасываются из вешалок с мрачной скоростью, и мы находимся на переднем крае технологии бомбардировщиков на Балканах."
 ###
 hun_air_strat_1: "Стратегический бомбардировщик Фокус 1"
 hun_air_strat_1_desc: "Только стратегические бомбардировщики, способные выполнить эту задачу, как таковые мы должны сосредоточить наши усилия."
 ###
 hun_air_strat_2: "Стратегический бомбардировщик Фокус 2"
 hun_air_strat_2_desc: "Наши бомбардировщики заблокируют небо, куда бы мы ни пошли, и наша армия будет сражаться в тени."
 ###
 hun_air_doctrine_2: "Исследования по вопросам стратегического уничтожения"
 hun_air_doctrine_2_desc: "Разрабатываются и открываются новые доктрины, и мы должны воспользоваться этими достижениями, если мы хотим сохранить ариальную гегемонию."
 ###
 hun_air_support_choice: "Выбор поддержки"
 hun_air_support_choice_desc: "Как военные, так и военно-морские бомбардировщики предназначены для того, чтобы с уважением поддерживать наземные и военно-морские силы, и мы должны сосредоточить наши усилия на одном из них, если мы хотим выиграть на суше и на море."
 ###
 hun_air_cas_1: "Закрыть центр поддержки воздушного движения 1"
 hun_air_cas_1_desc: "Способность уничтожить цели на местах, которые угрожают нашим солдатам, является ключевым моментом в победе на поле боя, и мы должны принять эту школу мысли."
 ###
 hun_air_cas_2: "Закрыть центр поддержки воздушного движения 2"
 hun_air_cas_2_desc: "Лететь быстрее, ниже и с большой нагрузкой позволяет нам поддерживать наших солдат более эффективно, чем когда-либо прежде, и наш самолет будет наблюдать за армией, как ангел-хранитель."
 ###
 hun_air_nav_1: "Морской бомбардировщик Фокус 1"
 hun_air_nav_1_desc: "Отказ вражескому флоту выйти в море подорвет их экономику и армию, и мы должны в полной мере воспользоваться этой слабостью."
 ###
 hun_air_nav_2: "Морской бомбардировщик Focus 2"
 hun_air_nav_2_desc: "Голод противника с вражеской блокадой - это гениальная стратегия, которая поймает наших врагов врасплох."
 ###
 hun_air_doctrine_3: "Оперативные интеграционные исследования"
 hun_air_doctrine_3_desc: "Организация и планирование являются краеугольным камнем любой успешной кампании, и возможность придерживаться согласованного плана во время боевых действий может изменить ситуацию между поражением и победой."
