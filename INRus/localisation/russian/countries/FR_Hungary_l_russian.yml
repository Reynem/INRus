 aushun.4.d: "В то время как Кайзер правит как над Сислейтантией, так и над Транслитанией, каждый регион имеет свой собственный блок власти внутри. Транслитания , или венгерская часть Империи, находится под железной хваткой Хорти, который благодаря благодати Кайзера может делать все, что ему угодно, на своей родине. Сислейтания , или австрийская часть Империи, сохранила большую часть институтов старой Австрийской Республики, таких, как избирательный процесс, который пережил крах старой Австро-Венгерской империи. . . .. .. . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . ."
