l_russian:

 ####events
 khu.10.t: "Аль-Мухаммара выходит на свободу!"
 khu.10.d: "С 1920 года Хузестан был под сильным британским влиянием, но после событий на Лондонском фондовом рынке мы нашли возможность избежать британского влияния и восстановить свою независимость."
 khu.10.a: "Мы свободны!"
 khu.10.b: "Мы бы предпочли не делать этого."
 khu.11.t: "Аль-Мухаммара выходит на свободу!"
 khu.11.d: "С 1920 года Хузестан был под нашим влиянием, но после того, как нас поразил Лондонский фондовый рынок, негодяи в парламенте Хузестани проголосовали за прекращение нашего протектора по отношению к ним и выгнали нашего Верховного комиссара без какого-либо уважения."
 khu.11.a: "Они могут это сделать?"
 KHU_embassy: "Учреждено посольство Кузестани"
