 ### Characters ###
 NIC_augusto_cesar_sandino: "Августо Сесар Сандино"
 #NIC_augusto_cesar_sandino_leader_desc: "Появление Сандино в качестве мелкого партизанского лидера, сражавшегося в Либеральной революции 1926 года, было совершенно неожиданным, и его присутствие не было отмечено до подписания пакта о негре Эспино, с которым он не согласился. Начав с небольшой партизанской силой в 300 боевых действий на юге, он активно сражался в джунглях, медленно ослабляя морских пехотинцев Соединенных Штатов. Однако его продолжали толкать все дальше и дальше на юг до тех пор, пока его не заставили покинуть свои силы вместе с Франсиско Секейройрой Морено и отступить в Мексику. Там он встретился с социалистическими лидерами, такими, как Запата, и стал известным в международном сообществе. Он также стал членом ЭМЕКУ, духовной организации, которая верила в создание универсальной общины под богом. Возвращение в Никарагуа в 1931 году с участием Запаты, многие сплотились на его сторону, и его силы стали больше, чем когда он и его люди смогли освободить Манагуа в январе 1932 года, вынудив Соединенные Штаты отступиться по ме."

 NIC_francisco_sequeira_moreno: "Франциско Секейра Морено"
 #NIC_francisco_sequeira_moreno_leader_desc: "Франциско Секейра Морено родился в бедной семье, как и большинство семей Никарагуа, и провел большую часть своей жизни неграмотным. После подписания Пакта Эспино Негро между «Либеральными» революционерами и Соединенными Штатами он стал партизанским лидером, сражающимся на севере Никарагуа. Он и его полк в 400 человек убили многих людей, но были вынуждены отступить на юг и сражаться с Сандино. В то время как Сандино был в Мексике, он храбро боролся на юге против оккупации Соединенных Штатов, пока Сандино не вернулся, и стал одним из лидеров на севере и в конечном итоге освобождения Манагуа. После окончания революции он стал членом своей партии, известной как «Партия Никарагуа», которая сосредоточилась на правах низшего класса и улучшении системы образования."

 NIC_juan_bautista_sacasa: "Хуан Баутиста Сакаса"
 #NIC_juan_bautista_sacasa_leader_desc: "Хуан Баутиста Сакаса был вице-президентом бывшего президента Карлоса Хосе Солорсано до тех пор, пока он не был свергнут во время переворота, совершенного бывшим президентом Эмилиано Чаморро Варгасом. После того как Адольфо Диас восстал, он был приведен к присяге в качестве президента либерально-революционерами на юге, возглавляемыми Хосе Марией Монкадой Тапиа, и оказал помощь в освобождении Манагуа. Однако после подписания Пакта Эспино Негро он ушел в отставку в качестве президента из-за своего нежелания оказывать влияние Соединенных Штатов и вернулся в Мексику. Будучи главным образом наблюдателем за революцией в Сандино, он решил вернуться в Никарагуа примерно в то же время, когда Сэндино присутствовал на освобождении Манагуа, и вместе с ним и Сэндино пришли к согласию в отношении основных принципов, Сакаса смог сформировать свою собственную партию, известную как «Partido de la Revolución Libergion»."

 NIC_emiliano_chamorro_vargas: "Эмилиано Чаморро Варгас"
 #NIC_emiliano_chamorro_vargas_leader_desc: "В 1917—1921 годах Варгас был военным человеком с очень спорной репутацией, который первоначально поддерживался Соединенными Штатами в ходе своего первого председательства и помогал вести переговоры по договору, который позволил Соединенным Штатам построить канал через Никарагуа. Его президентство было в значительной степени изучено, кроме того, что ему удалось выплатить значительную часть никарагуанских долгов. Однако, несмотря на его усилия, он не смог выиграть президентство в 1923 году. После выборов Карлоса Хосе Солорзано он переворотил правительство, заложив цепь событий, которые привели к правительству Сандино. Некоторые считают его началом революции, в то время как другие дискредитируют его как голодного. Все это, однако, теперь имеет значение то, что его мечта о возвращении на пост президента наконец-то сбылась."

 NIC_adolfo_diaz: "Адольфо Диас"
 # NIC_adolfo_diaz_leader_desc: "Адольфо Диас был одной из главных мишеней клеветнической кампании со стороны Сандино, и не по совершенно неправильным причинам. Помог либеральному президенту Хосе Сантосу Селайе в 1910 году он был приведен к присяге как президент с большой помощью со стороны Соединенных Штатов. Сначала с 1911 по 1917 год он возглавлял президентство. Он был назван американской марионеткой, способствующей достижению целей американских компаний, таких, как Тонопа Горнорудная компания. В 1914 году он пережил либеральный бунт, который за многие годы 30-летней военной оккупации США, когда морпехи были вынуждены подавлять восстание. Эти морские пехоти оставались в Никарагуа на протяжении более десяти лет, чтобы сохранить порядок, давая при этом США разрешение на строительство никарагуанского канала. Однако после переворота Чамарро в 1926 году вторая оккупирующая сила моря покляла его в качестве президента. Его попытки подавить беспорядки не увенчались успехом, и он был вынужден согласиться с новым президентом Хосе Марией Монкадой."

 NIC_anastasio_somoza_garcia: "Анастасио Сомоса Гарсия"
 #NIC_anastasio_somoza_garcia_leader_desc: "Сомоза, как и многие другие, начал скромную жизнь в Никарагуа, воспользовавшись редкой возможностью поступить в бизнес-школу в Филадельфии, и там он женился на своей будущей жене Салвадоре Дебайле Сакасе, племяннице Хуана Баутиста Сакасы. С этого момента он смог проработать путь вверх по лестнице до либеральной революции в 1926 году. В целом, неописуемое внимание в бою, он был отличным англичанином из самой Америки, работая посредником мира между либеральными повстанцами и американцами. С этого момента ему удалось установить дальнейшие отношения с американцами, присоединившись к недавно сформированной Национальной гвардии, до тех пор, пока не был изгнан американец, он был назван главой организации. Однако, как только Сандино достиг столицы, он был вынужден отступить в Гондурас, который принял его и оставшуюся часть гвардии с открытым оружием."

