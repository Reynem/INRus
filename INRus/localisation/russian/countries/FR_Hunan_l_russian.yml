 ### Characters ###
 MEN_zhao_hengti: "Чжао Хенгти"
 #MEN_zhao_hengti_leader_desc: "Губернатор Хунана в течение более десяти лет правит Хунаном. 1880 года рождения в Хэнгяне Чжао Хэнгти посещал Академию Имперской японской армии, оканчив его специализацией в области артиллерии. Он присоединился к Тонгменгуи при Сунь Ят-Сен и участвовал в Синьхайской революции и второй революции в качестве военного командира. После провала второй революции Чжао был заключен в тюрьму Юань Шикай. После своего освобождения он был вновь назначен главнокомандующим Армией Хунань и губернатором провинции Хунань. nhao Hengti представил первое провинциальное конституционное движение в Азии, разработал Конституцию провинции Хунань, учредил демократический провинциальный совет и губернатор был заключен в тюрьму."
 #MEN_zhao_hengti_commander_desc: "§L\nZhao Hengti, губернатор Хунань, правивший в течение более десяти лет. После провала второй революции Чжао был заключен в тюрьму Юань Шикай. После его освобождения он был назначен главнокомандующим Японской армии, а губернатор провинции Хунань он вновь присоединился к своей Вооружённой Лиге. . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . ."

 MEN_tang_shengzhi: "Тан Шэнджи"
 #MEN_tang_shengzhi_leader_desc: "12 октября 1889 года Танг Шенджи, родившийся в Хунане, успешно отошел от власти спустя более десяти лет. Окончивший Баодингскую военную академию и буддистскую академию, Тан играл видную роль в вооруженных силах Хунанана до того, как внутренняя напряженность привела к его дезертирству в Национальную революционную армию во время северной экспедиции. Там он был назначен губернатором КМТ, но в конечном итоге был изгнан с крахом НРА. Его доктрина гласит, что буддизм и социализм являются идентичными, что авторитет его брата и его мудрый политический замысел позволили ему вернуться в Хунань и успешно бросить вызов сменяющему его губернатору Чжао Хенгти на выборах."
 #MEN_tang_shengzhi_commander_desc: "После успешного поступления в Баодингскую военную академию Тан Шенджи начал длительную карьеру в Хунане в качестве офицера в Клике Чжао Хенджи. По мере того, как Чжао одержал победу на выборах 1921 года, он решил привлечь Танга к себе, но этот союз вскоре покончит с тем, что Тан стал все более ревнивым, несмотря на то, что он отдавал предпочтение Жао по отношению к другим военным командам. Тан, однако, провёл свое время и увидел свой шанс с Северным экспедицией 1926 года. Вступив в контакт с Национальной революционной армией, Танг оттолкнул своего бывшего хозяина и создал свою собственную администрацию под эгидой КМТ. Однако Тэнг вскоре закончился тем, что он завидовал своим новым боссам. Однако он по-прежнему достаточно быстро начал свою военную кампанию в Будхинге, свою более младшую программу буддистско-лифтистской подготовки. Однако это было недолго, прежде чем германское правительство разрешило выгнать силы Цили из региона, и вернул Чжо в конце концов."

 MEN_cheng_qian: "Чэн Цянь"
 #MEN_cheng_qian_leader_desc: "Чэн Цянь был воспитан в богатой семье домовладельцев и получил классическое образование в Конфуцианском университете, что позволило ему сдать экзамен по гражданской службе и учиться в Академии имперской армии Чангши в Юэлу, прежде чем перейти к военной карьере в военной академии Хунань. Позднее он поехал в Японию для дальнейшего обучения, где он встретился с популяризирующими лидерами Тонгменгуи. Он обратился к их делу после встречи с Сунь Ятсеном и после окончания Академии Имперской японской армии, он присоединился к Синьхайской революции, которая вспыхнула в 1911 году."
 #MEN_cheng_qian_commander_desc: "В 1905 году он впервые сдал имперские экзамены в надежде стать учёным. Однако, понимая политическую ситуацию в конце XIX века, Цин Эмперия. Вместо этого он поступил в военную академию Хунань, а затем поехал в Японию, где изучал и встречал революционеров, таких, как Хуанг Синь, Сон Цзяорен и Лиджун. В 1905 году он встретился с Сунь Ятсеном и присоединился к Суньс Тонгхуи. Он окончил Императорскую академию вместе с Тан Цзяо, специализировавшись в области артиллерии."
 #MEN_cheng_qian_desc: "В 1905 году он впервые сдал имперские экзамены в надежде стать учёным. Однако, понимая политическую ситуацию в конце XIX века, Цин Эмперия. Вместо этого он поступил в военную академию Хунань, а затем поехал в Японию, где изучал и встречал революционеров, таких, как Хуанг Синь, Сон Цзяорен и Лиджун. В 1905 году он встретился с Сунь Ятсеном и присоединился к Суньс Тонгхуи. Он окончил Императорскую академию вместе с Тан Цзяо, специализировавшись в области артиллерии."

 MEN_tang_shengming: "Тан Шенминг"
 #MEN_tang_shengming_commander_desc: "В 1926 году выпускник Военной академии Вампоа, накануне Северной экспедиции, он присоединился к КМТ и его старшему брату в их усилиях по освобождению Китая. Хотя эта экспедиция была первоначально успешной, экспедиция провалилась с вмешательством Германии. Несмотря на изгнание старика Танга из Хунана после провала северной экспедиции и его буддистской социалистической программы, редкая способность Танг Шэнгинга сблизиться практически с кем-либо привела к тому, что он остался в Хунане и даже занял видное положение в армии Хунанана. Он тайно использовал эту позицию, чтобы восстановить образ своего брата среди людей, а также развивать обширные связи в армии. Он надеется сгладить путь к возвращению Танг Шенжи и подъему общества Будизи."

 MEN_he_yaozu: "Хе Яозу"
 #MEN_he_yaozu_commander_desc: "§LY General Profinition\n§YBorn: 8, 1889\nNingsyang, Hunan, Qing Empream\n §Y Военная карьера: §L\nBorn для богатой и известной семьи в Хунане, Хе Яозу получил конфуцианское образование и воспитал джентльмена. Однако его недобросовестный характер в детстве привел к тому, что его отправили в частную школу, где ему было дано строгое образование. Он поступил в военную академию Хунань в 1905 году, перед тем как поехать в Японию. Там он присоединился к Тонгменгуйской революции, приняв участие в Синьхайской революции, прежде чем вернуться в Хунань в 1916 году, чтобы присоединиться к его местной армии. Хотя первоначально он присоединился к Куоминтангу во время их северной экспедиции в Хунан, своевременное побег Хе Яозу и его отдел помогли защитить его от основных политических последствий поражения. Хотя талантливые, его прошлые ассоциации означают, что он вряд ли может подняться над региональным уровнем власти, но он остается видным членом военного штаба Хунанана."

 MEN_peng_dehuai: "Пэн Дехуай"
 # MEN_peng_dehuai_commander_desc: "§Y General Profinition\n§YBorn: §L October 24, 1888\nSiangtan County, Hunan, Qing Empire\n §Y Военная карьера: §L\nPeng Dehua родилась в деревне Шисианг у бедной семьи фермеров. Хотя у его семьи не было много средств, Пэнг выслушивал своего деда, ветерана восстания Тайпинга, описал идеалы социально-экономического равенства. Первоначально он смог пойти в традиционную конфуцианскую школу, снижение экономического благосостояния его семьи вынудило его уйти и просить о деньгах, чтобы помочь своей семье. После потери многих членов его семьи в нищете, включая его мать, он оказался там, где он работал на угольной шахте. Примерно тогда вспыхнула революция в Синьхайе, и Пэнг оказался еще более обездоленным, когда опрокинулась экономика. Затем он вступил в местную армию воинов и поднялся в ряды с армией Танг Шенджи. Там Пэнг боролся за силы Сун Ясена против Ву Пейна. Однако, во время своего первоначального вторжения Пинь Пэнга, в свою страну, однако, когда его дезинга, он стал десантом, и его десантом, он вернулся, он ха, и его десантом, он вернул, он вернул в свою десант, он ху, он вернул в свою десант в свою депресс, он в свою страну."
 #
 MEN_he_jian: "Хе Цзянь"
 # MEN_he_jian_commander_desc: "§L\nBorn для фермерской семьи в Хунане, Хе Цзянь был первоначально назначен на гражданскую службу до поступления в Баодингскую военную академию в эпоху после Синьхая. 2 года спустя после выпуска командир батальона построил бы героев, чтобы противостоять вторжению Чжана Цзиньяо, что привлекло к нему внимание Чэн Цяна, который повысил его на должность командира местных сил героев. Tang Shenzzi затем взял его под свое крыло, а Хэ Цзянь будет сражаться за Куоминтанга во время северной экспедиции. Однако, согласно широко распространенному мнению, падение НРА в 1927 году, первоначально сделало его адрифтом, но общей амнистией в Хунане для тех, кто был готов дезертировать, оказалось неудачной возможностью для многих подчиненных Тангу. Хэ Цзянь теперь находится на службе у хунанской армии, но его лояльность, как и многие другие, остается с Заго, как и многие другие."

 MEN_song_xilian: "Песня Ксилиан"
 #MEN_song_xilian_commander_desc: "После окончания средней школы Сонг Ксилиан получил достаточную удачу, чтобы попасть в лекционную школу армии Чэн Цянь. Затем он был принят в первый класс военной академии Вампоа и стал самым молодым выпускником академии в 1924 году, присоединившись к Куоминтангу вскоре после этого. Друг Чэна Джина начал флиртовать с левой частью партии, но крах Куоминтанга в 1927 году означал, что будущее тогдашнего 20-летнего офицера было радикально изменено. Сет адрифт, он отправился в Японию учиться несколько лет, прежде чем вернуться домой в Хунан, чтобы предложить свои услуги. Там он нашел много старых сообщников Чэн Цянь и КМТ, которые служили в армии Хунанана, и смог использовать свои связи для медленного достижения места славы в региональных войсках."

 MEN_he_long: "Длинный."
 #MEN_he_long_commander_desc: "В 1920 году он начал свою долгую карьеру в качестве лидера-поклонника после того, как он убил социалистического оценщика из мести за убийство дяди, находящегося в долгу. С тех пор его легенда как преступника и фигура робин-соседа выросла только тогда, когда он Лонг и его доверенный нож для подписи построили местную армию для подъема Куминтанга. Учитель и командир во время северой экспедиции он вскоре обретет связь с социалистическими элементами партии во время службы под руководством Чжана Факуи. Поражение КМТ во время северной экспедиции не удовлетворяло его желания изменить Китай, и хотя он бежал домой в Хунан, он по-прежнему требует уважения к своим солдатам. Его способности как революционера не будут недооценены, и он не будет недооценен."

 MEN_teng_daiyuan: "Тэнг Дайюань"
 #MEN_teng_daiyuan_commander_desc: "§LY General Profinition\n§YBorn: §LNovember 2, 1904\nMayang County, Hunan, Qing Empire\n §Y Военная карьера: §L\n учащийся из провинциальной школы Чангде Хунань, Teng Daiyuan присоединился к Куоминтангу весной 1925 года накануне Северного экспедиции. Будучи активным социалистическим и филиалом Китайской синдикалистической партии, он выполнял функции председателя Провинциальной фермерской ассоциации Хунань."

