#### Ideas ####
GRE_revanchism_idea: "Греческий реванхизм"
GRE_legacy_of_alexander_idea: "Наследие Александра"
GRE_legacy_of_alexander_idea_desc: "Греки - народ, привыкший к войне, и ничто не возбуждает их так, как мысль о том, что их с трудом завоеванная независимость вновь отнимается."
GRE_unruly_minorities_idea: "Несоблюдение обязательств меньшинствами"
GRE_unruly_minorities_idea_desc: "Турки, славяне, албанцы."
GRE_Monarchists_idea: "Оперативная поддержка монархии"
GRE_Monarchists_idea_dsec: "Даже если монархию упразднили в парламенте в 1934 году на 55%, она все еще в парламенте, многие греки все еще поддерживают монархию, и наша республика Фрагей может рухнуть, если любая крупная экономическая катастрофа поразит Грецию хуже, чем наша нынешняя ситуация, эта воображаемая катастрофа все еще является посрамлением, которое приведет либо к восстановлению монархии, либо к коммунистической революции."
GRE_Economic_Downturn: "Греческий экономический кризис"
GRE_Economic_Downturn_desc: "После победы над турками Греция попала в долги на войну и экономическую девстанцию, с разрушенной Анатолианской стороной Греции, турецкими революционерами, коммунистами и разъяренными монархистами, Греция должна увидеть трудные времена."

### Events ###
gre_cyp.0.d: "Хотя в настоящее время мы стоим как суверенная республика, многие считают, что наш маленький размер делает нас уязвимыми во все более враждебном мире."

gre_cyp.1.d: "Дипломатическое представительство из Никосии выдвинуло чрезвычайное предложение, указав на наши глубокие исторические связи и общее культурное наследие, правительство Кипра официально потребовало объединения острова с нашим государством. Приветствуя Кипр, мы сможем реализовать давнюю национальную мечту и обеспечить жизненно важный стратегический бастион в Восточном Средиземноморье, однако наши соседи редко относятся к такому расширению, и мы должны взвесить славу национального объединения с возможностью возобновления региональной нестабильности."

gre_crisis.0.d: ""

gre_straits.1.d: "С нашей позицией в Эгейском регионе и прилегающей территории, прочно находящейся под греческой администрацией, нельзя больше игнорировать аномальный статус Комиссии по проливам. &lt; &lt; Международная администрация Константинополя &gt; &gt; и &lt; &lt; Босфора &gt; &gt; остается продолжением послевоенных поселений. &lt; &lt; Если мы хотим сохранить нашу национальную судьбу и гарантировать безопасность нашей морской торговли &gt; &gt; , то эти жизненно важные воды должны вернуться под греческий контроль. &lt; &lt; Настало время официально обратиться к британскому правительству и провести переговоры о мирной передаче зоны, призывая к нашим общим интересам стабилизировать регион &gt; &gt; ."

gre_straits.2.d: "Правительство Афин официально обратилось к нам в отношении будущего управления Комиссией по международным проливам. Поддержание нашего военного и бюрократического присутствия в Боспосе становится все более дорогостоящим и дипломатическим бременем, расширяя наши послевоенные обязательства до пределов. Греки утверждают, что стабильное, дружелюбное греческое государство, контролирующее водные пути, будет служить достаточным оплотом против региональной агрессии, позволяя нам безопасно разгрузить свои обязанности."

gre_straits.3.d: "Великие новости из Лондона! После интенсивных дипломатических дискуссий британское правительство согласилось с тем, что нынешнее управление проливами является неустойчивым. Признавая наши исторические притязания и нашу роль жизненно важного партнера в Восточном Средиземноморье, &lt; &lt; Уайтхолл &gt; &gt; согласилась распустить Комиссию и официально передать контроль над Константинополем и окружающими его проливами греческой нации. Это историческое соглашение знаменует реализацию наших давнишних чаяний на город."

gre_straits.4.d: "Наши дипломатические инициативы в отношении статуса Босфора были решительно отвергнуты Лондоном. Британское правительство совершенно ясно заявило, что оно намерено сохранить статус-кво и поддержать Комиссию, полностью игнорируя наши законные интересы в области безопасности и исторические права. Этот упорный отказ оставляет нас изолированными и глубоко оскорблёнными, бросая тёмную тень на наши будущие отношения с Британской империей."

