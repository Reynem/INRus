 #focus
 COL_granadine_manifesto: "Гранадиновый манифест"
 COL_granadine_manifesto_desc: "Наш народ слишком долго страдал от несправедливости в руках этого мира; они были лишены того, что им действительно принадлежит; их место на солнце; с момента нашего рождения земли Нуэва Гранады были правы; мы потеряли их несправедливо, но теперь у нас есть сила вернуть их."
 COL_remilitarize_meta: "Ремилитаризовать Какету"
 COL_remilitarize_meta_desc: "Как часть постыдного договора с Перу, мы были вынуждены демилитаризировать южную часть нашей страны, или то, что не было украдено из нее."
 COL_doctrine_of_war: "Доктрина войны"
 COL_doctrine_of_war_desc: "Тогда мы не были готовы к жестокой войне, в которой нам было стыдно, на этот раз все по-другому."
 COL_patria_y_revancha: "Патриция и Реванча"
 COL_patria_y_revancha_desc: "Не позволяй внутренним проблемам отвлекать нас в этот момент. Сегодня мы, народ, едины, для родины и для реванша!"
 COL_andean_claims: "Андские претензии"
 COL_andean_claims_desc: "Мы знаем, что эти гордые горы заслуживают лишь того, чтобы их управляла Колумбия."
 COL_quito_ultimatum: "Кито Ультиматум"
 COL_quito_ultimatum_desc: "Позор, который является Эквадором, был свободен слишком долго, в нашем великом царстве они принадлежат, пропавший кусок нашей земли Гранадина. Давайте заставим их подчиниться немедленно."
 COL_greater_colombia_desc: "Гран Колумбия была благородной попыткой сделать все правильно, к сожалению, диссиденты и предатели разрушили ее, но мы знаем, что мечта все еще жива, и мы знаем, какая земля принадлежит этой мечте."
 COL_greater_colombia: "Большая Колумбия"
 COL_bolivars_dream: "Мечта Боливара"
 COL_bolivars_dream_desc: "Великий человек, уроженец Венесуэлы, который искренне верит в Гран-Колумбийскую мечту, Саймон Боливар сделал все, чтобы объединить свою родину."
 COL_preparing_for_liberation: "Подготовка к мести"
 COL_preparing_for_liberation_desc: "После того, как Перу был унижен, осушен и сорван, наша страна попала в хаос, и многие из них пострадали и погибли в результате этого, но когда дверь была закрыта, было открыто окно, и через него пришел свет, который поднял нас обратно в наши ноги. Пора положить этому конец. Мы готовы."
 COL_revancha_en_peru: "&lt; &lt; Реванча контра Перу &gt; &gt;"
 COL_revancha_en_peru_desc: "Справедливость больше не может ждать."
 COL_mobilze_the_people: "Мобилизация населения"
 COL_mobilze_the_people_desc: "Давайте призовем всех колумбийцев помочь нам в наших усилиях."
 COL_the_marxist_enemy: "Марксистский враг"
 COL_the_marxist_enemy_desc: "Коммунистическая угроза заразила этот континент, дальше на юг, она очевидна, революционеры взяли под контроль хаос и слабость, пришло время показать им, что мы сильные и не попадемся на их уловки."
 COL_spirit_of_war: "Дух войны"
 COL_spirit_of_war_desc: "Мы можем использовать желание нашего народа отомстить, чтобы поддержать нашу армию патриотами, стремящимися отомстить."
 COL_brazilian_intervention: "Бразильское вмешательство"
 COL_brazilian_intervention_desc: "Жестокий враг марксистов в Бразилии представляет опасность для всего континента. Теперь, когда они не сильны, настало время нанести удар и очистить землю от их позора."
 COL_seize_panama: "Схватить Панаму"
 COL_seize_panama_desc: "Неотъемлемой частью нашего королевства, Панама была превращена мировыми силами в игрушку, они думали, что мы для них просто шутка."
 COL_greater_than_ever: "Больше, чем когда-либо"
 COL_greater_than_ever_desc: "Благодаря войне и пламени Колумбия достигла высот, которые считались только мечтами."Gran" isn't a good enough adjective to describe our glory anymore."
 COL_avenging_our_nation: "Возмездие за нашу нацию"
 COL_avenging_our_nation_desc: "Издеваясь над миром, мы не были сосредоточены на том, что действительно имеет значение, на страданиях единого колумбийского народа, истинного врага, мира, через национализма, мы восстанем в величии."
 COL_new_national_policy: "Новая национальная политика"
 COL_new_national_policy_desc: "По мере расширения государства в стране действует новый режим, в котором Колумбия прежде всего всегда объединяется."
 COL_ideas_of_nationalism: "Идеи национализма"
 COL_ideas_of_nationalism_desc: "Национализм заставит нас двигаться вперед, вместе и решительно."
 COL_integrate_los_leopardos: "Интегрировать Los Leopardos"
 COL_integrate_los_leopardos_desc: "Разделённый штамм Консервативной партии, Лос-Леопардос, это группа интеллектуальных и очень интересных идей подлинного националистического государства и правления. Интеграция их идей в нашу собственную платформу укрепит колумбийскую нацию."
 COL_purge_the_oligarchs: "Охраняйте Олигахов"
 COL_purge_the_oligarchs_desc: "Колумбия слишком долго должна была терпеть правление олигарха, они не заботились о нашей стране, только о своих собственных интересах, это время для того, чтобы избавиться от своих подлых существ в нашем политическом мире."
 COL_patriotic_laws: "Патриотические законы"
 COL_patriotic_laws_desc: "Международное влияние вновь и вновь поставило колумбийцев в зависимость от новых законов, патриотизма и прежде всего колумбийский народ и промышленность."
 COL_looking_for_greatness: "Искать величие"
 COL_looking_for_greatness_desc: "Мы не ищем большого богатства и не ищем хвалы. Мы ищем истинного величия. Только победа и влияние могут дать нам это. колумбийский народ должен это понять."
 COL_found_the_patriotic_front: "Нашел Патриотический фронт"
 COL_found_the_patriotic_front_desc: "Нам нужна сила отважных людей, чтобы не только сражаться за нас, но и распространять наши идеи внутри нашей страны."
 COL_nationalize_industry: "Национализация промышленности"
 COL_nationalize_industry_desc: "Иностранное влияние никогда никому не приносило пользы."
 COL_corporatism_in_colombia: "Корпоратизм в Колумбии"
 COL_corporatism_in_colombia_desc: "Обнаружив наилучшую экономическую политику, мы решили, что корпоратизм, устранение социальных проблем и постановка нации на первое место, будет движущим фактором колумбийской экономики."
 COL_patriotic_propaganda: "Патриотическая пропаганда"
 COL_patriotic_propaganda_desc: "Пришло время полностью расширить государственную пропаганду до такой степени, что каждый гражданин тоже должен быть патриотом."
 COL_our_birthright: "Наше право на рождение"
 COL_our_birthright_desc: "Некоторые народы были рождены служить, но мы знаем, ради чего мы родились, чтобы победить, править, быть славными."
 COL_out_of_the_chaos: "Из Хаоса"
 COL_out_of_the_chaos_desc: "Политический хаос, в котором оказалась наша нация после падения олигархического режима, закончился."
 COL_down_with_the_establishment: "Покончим с созданием"
 COL_down_with_the_establishment_desc: "Олигархические силы, правившие Колумбией, все еще оказывают большое влияние на наши системы."
 COL_deal_with_marxism: "Разберись с марксизмом"
 COL_deal_with_marxism_desc: "Недовольство народа привело многих к искушению марксизма, и мы должны направить наш народ на правильный путь."
 COL_populism_in_the_andes: "Популизм в Андах"
 COL_populism_in_the_andes_desc: "Народ смело восстал против репрессивного режима, который доминировал над ним в прошлом, и теперь под правлением нашего великого президента Гайтана государство, наконец, сосредоточит свою политику прежде всего на народе."
 COL_plataforma_de_colon: "Платаформа Колона"
 COL_plataforma_de_colon_desc: "В экономической системе, где наша страна находится слишком долго, существуют серьезные проблемы. Неравенство поражает каждый угол, и наша промышленность слаба. Пора наконец положить конец этому и реформам."
 COL_ruling_for_the_people: "Решение для народа"
 COL_ruling_for_the_people_desc: "Под руководством президента Гайтана люди, наконец, впервые слушаются."
 COL_educational_reform: "Реформа системы образования"
 COL_educational_reform_desc: "Состояние образования и доступ к нему всегда были важными вопросами для нашего президента."
 COL_expansive_industries: "Расширенные индоссаменты"
 COL_expansive_industries_desc: "Колумбия не поднимет свой статус до тех пор, пока мы будем оставаться аграрными и недостаточно развитыми."
 COL_share_the_wealth: "Разделять богатство"
 COL_share_the_wealth_desc: "Мы не потерпим несправедливости богатого декана, эксплуатирующего благородных рабочих, которые едва могут поддерживать свои семьи."
 COL_nationalize_services: "Национализация услуг"
 COL_nationalize_services_desc: "Многие основные услуги, которые поддерживают наше общество, находятся в руках нескольких частных лиц, пора национализировать их, обслуживать всю нашу нацию под руководством государства."
 COL_agrarian_reform: "Аграрная реформа"
 COL_agrarian_reform_desc: "Несправедливое распределение земли затрагивает многие из наших более уязвимых секторов. Пора начать аграрную реформу, которая позволит более равномерно распределить землю среди фермеров нашей великой нации."
 COL_plan_gaitan: "План Гайтан"
 COL_plan_gaitan_desc: "План Гайтан делает именно это, предлагает точные меры, чтобы продвинуть нас вперед!"
 COL_expand_the_central_bank: "Расширить Центральный банк"
 COL_expand_the_central_bank_desc: "Необходимо усилить регулирование для ликвидации коррупции и защиты наших национальных интересов, поскольку таким образом расширение центрального банка страны сделает это именно так!"
 COL_create_institute_of_development: "Создание Института развития"
 COL_create_institute_of_development_desc: "Для нашего правительства крайне важно создать агентство, которое будет заниматься вопросами развития, создания новых предприятий и расширения промышленности."
 COL_create_institute_of_credit: "Создать кредитный институт"
 COL_create_institute_of_credit_desc: "Займы и правительственные субсидии придадут нам необходимый импульс, когда речь заходит о частной инициативе."
 COL_create_institute_of_saving: "Создать институт спасения"
 COL_create_institute_of_saving_desc: "Сберегательные и финансовые решения важны в жизни наших граждан, вот почему Институт Спасения пройдёт долгий путь."
 COL_a_greater_project: "Большой проект"
 COL_a_greater_project_desc: "В то время как народ Коломбии наконец видит надежду и их мечты исполнятся под руководством президента Гайтана, речь идет о новом проекте, расширяющем все это."
 COL_stop_the_reparations: "Остановить выплаты"
 COL_stop_the_reparations_desc: "Как часть тройки Летисии и неудач старого режима, колумбийский народ должен потратить свои усилия и усилия на выплату экономического возмещения перуанским захватчикам."
 COL_industrial_beginnings: "Промышленное начало"
 COL_industrial_beginnings_desc: "С колониальных времен наша экономика не изменилась; аграрная, а не экспортная, как у наших соседей. Пора начать промышленную экспансию."
 COL_the_exportation_business: "Экспортный бизнес"
 COL_the_exportation_business_desc: "Мы оказались с товарами, привлекательными для экспортного рынка."
 COL_the_coffee_boom: "Кофейная промышленность"
 COL_the_coffee_boom_desc: "Наша богатая кофеварка стала довольно прибыльной, давайте используем это в наших интересах, должным образом инвестируя и расширяя ее."
 COL_resource_extraction: "Добыча ресурсов"
 COL_resource_extraction_desc: "Наша земля велика и богата."
 COL_petroleum_fields: "Нефтяные поля"
 COL_petroleum_fields_desc: "Нефтяные месторождения на нашем северном побережье приносят большие экономические и стратегические преимущества нашей стране, давайте будем продолжать инвестировать в их расширение."
 COL_tobacco_and_food_trade: "Табак и продовольственная торговля"
 COL_tobacco_and_food_trade_desc: "Табачная промышленность, а также сахар и бананы - это очень хороший экспорт, на котором мы можем должным образом сосредоточиться."
 COL_agrarian_infrastructure: "Аграрная инфраструктура"
 COL_agrarian_infrastructure_desc: "Аграрные секторы нашей страны изолированы от городских центров и друг от друга, расходуя средства на инфраструктуру, мы можем должным образом интегрировать их."
 COL_begin_the_mobilization: "Начать мобилизацию"
 COL_begin_the_mobilization_desc: "Старая гражданская экономика больше не будет работать под руководством нашего государства, Колумбия мобилизует свои силы на войну."
 COL_internal_trade: "ВНУТРЕННЯЯ ТОРГОВЛЯ"
 COL_internal_trade_desc: "Создание сильной внутренней экономики и торговли на основе нашей собственной продукции обеспечит нам возможность поддерживать себя."
 COL_a_colombian_industry: "Колумбийская промышленность"
 COL_a_colombian_industry_desc: "Новая идея: начало промышленного развития в нашем аграрном государстве может дать нам необходимую нам продукцию."
 COL_capital_focus: "Фокус &lt; &lt; Столичной зоны &gt; &gt;"
 COL_capital_focus_desc: "Городские районы Боготы находятся в центре внимания нашего населения и естественного региона, где можно расширить промышленность."
 COL_national_railways: "Национальные железные дороги"
 COL_national_railways_desc: "Для любой национальной отрасли необходимо развитие инфраструктуры, которая является широкой железнодорожной сетью, соединяющей наши городские зоны и производственные центры, и было бы полезно создать колумбийскую железнодорожную компанию под национальным аппаратом."
 COL_arms_industry: "Промышленность вооружений"
 COL_arms_industry_desc: "Особенно учитывая нашу нынешнюю напряженность, инвестиции в военную промышленность могут в долгосрочной перспективе принести пользу Колумбии."
 COL_coastal_development: "План развития прибрежных районов"
 COL_coastal_development_desc: "Возможно, было бы разумно инвестировать средства в промышленное развитие наших прибрежных департаментов."
 COL_rural_investments: "Сельские инвестиции"
 COL_rural_investments_desc: "Сельские районы широки, но недостаточно развиты, поскольку важным элементом нашего населения было бы отличная идея вложить в них наши ресурсы."
 COL_production_advances: "Производственные авансы"
 COL_production_advances_desc: "Новые технологии повысили производительность и производительность промышленности во всем мире."
 COL_electronics_innovation: "Инновации в области электроники"
 COL_electronics_innovation_desc: "Радио и другая электроника являются важными новыми находками и разработками в научной области, и мы должны идти в ногу с ними."
 COL_future_is_now: "Будущее наступило"
 COL_future_is_now_desc: "Мы находимся в эпохе быстрых, постоянно расширяющихся знаний и технологических инноваций."
 COL_construction_improvements: "Строительство"
 COL_construction_improvements_desc: "Новые технологии позволят нам продвинуться вперед в наших процессах строительства для развития нашей страны."



 #ideas
 COL_revanchist: "Дух реванхизма"
 COL_revanchist_desc: "Теперь, объединившись и с одной целью в мыслях и душе, колумбийский народ даст все, что в его силах, для их реванша."
 COL_patria_revancha: "Патриция Авергонзада"
 COL_spirit_of_war_idea: "Дух войны"
 COL_patria_revancha_desc: "Отверженный, постыженный, брошенный, колумбийский народ пострадал, и теперь только месть заживет его раны."
 COL_internal_trade_boom: "Активизация внутренней торговли"
 COL_internal_trade_boom_desc: "По мере развития нашей экономики растет внутренняя торговля и взаимозависимость внутри нашей собственной страны, что позволяет нам еще больше поддерживать себя."
 COL_populist_regime: "Популизм в Андах"
 COL_populist_regime_desc: "Популист, сосредотачивая внимание прежде всего на народе, это то, как наше нынешнее правительство возглавляет Колумбию."
 COL_nationalist_regime: "Националистический режим"
 COL_nationalist_regime_desc: "Объединяя и возглавляя Колумбию как единую нацию, над классовыми границами и внутренними разногласиями, наш национализм делает нас сильными."
 COL_colon_platform: "Платаформа Колона"
 COL_colon_platform_desc: "Пора наконец положить конец социальным различиям."
 COL_colon_platform1: "Платаформа Колона"
 COL_colon_platform1_desc: "Пора наконец положить конец социальным различиям."
 COL_colon_platform2: "Платаформа Колона"
 COL_colon_platform2_desc: "Пора наконец положить конец социальным различиям."
 COL_expanded_central_bank: "Расширенный Центральный банк"
 COL_expanded_central_bank_desc: "Более строгое регулирование в нашем банке сделает нас богаче."
 COL_development_boost: "Ускорение развития"
 COL_development_boost_desc: "Наша новая политика стимулирует наше развитие."
 COL_credit_boost: "Ускорение в кредит"
 COL_credit_boost_desc: "Наша новая политика укрепляет нашу репутацию."
 COL_saving_boost: "Усилить сбережения"
 COL_saving_boost_desc: "Наша новая политика повышает наши сбережения."
 COL_nationalism_incarnate: "Националистический режим"
 COL_nationalism_incarnate_desc: "С комбинацией националистических и популистских идей наш режим должным образом представляет нашу нацию."
 COL_greatness_desired: "Величие"
 COL_greatness_desired_desc: "Мы добьемся больших результатов."
 COL_corporatism: "Корпоратизм в Колумбии"
 COL_corporatism_desc: "Мы проводим корпоративную экономическую политику."
 COL_learning_from_our_mistakes: "Учимся на ошибках"
 COL_learning_from_our_mistakes_desc: "Наши силы не справились, и наша страна была побеждена Перу."
 COL_vasquez_legacy: "Наследие Васкеса"
 COL_vasquez_legacy_desc: "Генерал Альфредо Васкес Кобо был тем, кто руководил нашими войсками во время войны."
 COL_reliable_infantry: "Надежное пехотное подразделение"
 COL_reliable_infantry_desc: "Надежная, хорошо обученная пехота должна быть опорой, на которой мы строим все наши операции, и они должны быть надлежащим образом оснащены для ведения боевых действий."
 COL_proper_support: "Надлежащая поддержка"
 COL_proper_support_desc: "Человека и пистолета недостаточно, мы должны предоставить нашим солдатам все необходимое им снаряжение для того, чтобы они действительно преуспели в своих усилиях."
 COL_berrio_relampago: "Релампаго Беррио"
 COL_berrio_relampago_desc: "Генерал Беррио предлагает динамичное изменение парадигмы, вместо того чтобы сфокусироваться на обычных фронтах и планах, мы можем сосредоточиться на создании быстрой, сильной армии, способной уничтожить неподготовленных, не нападая на нас."
 COL_lightning_landships: "Молнии"
 COL_lightning_landships_desc: "В рамках нашей новой стратегии необходимо модернизировать и построить мощные наземные корабли."
 COL_war_on_wheels_desc: "Наша пехота все еще важна, но люди не могут ходить везде."
 COL_war_on_wheels: "Война на колесах"
 COL_weapons_update: "Обновление оружия"
 COL_weapons_update_desc: "Независимо от того, что мы в конечном итоге делаем, наличие надлежащего оружия новейших технологий для наших пехотинцев имеет существенно важное значение."
 COL_motorized_lessons: "Моторизованные уроки"
 COL_motorized_lessons_desc: "Уделение особого внимания обучению и обеспечению хорошо подготовленных моторизованных подразделений необходимо для хорошо округленной армии."
 COL_engineering_investment: "Инвестирование в инженерное дело"
 COL_engineering_investment_desc: "Подготовка и развертывание инженеров в поддержку наших военных усилий будет отличной идеей."
 COL_artillery_focus: "Фокус артиллерии"
 COL_artillery_focus_desc: "Силовые артиллерийские снаряды могут сдвинуть прилив на поле боя, оказывая мощную поддержку нашим людям."
 COL_mechanizated_improvements: "Совершенствование механизации"
 COL_mechanizated_improvements_desc: "Механизированные машины, ведущие вперед со скоростью, станут будущим нашей военной машины, и мы должны их усовершенствовать сейчас."
 COL_armored_attack: "Бронированная атака"
 COL_armored_attack_desc: "Сохранение наших бронированных подразделений в силе и на сегодняшний день даст нам важное преимущество на поле боя."
 COL_medical_assistance: "Медицинская помощь"
 COL_medical_assistance_desc: "Полевые больницы оказывают нашим людям поддержку, чтобы они могли больше работать на поле боя, и могут действительно помочь нам держать линию."
 COL_andean_troops: "Андские войска"
 COL_andean_troops_desc: "Подготовка наших людей к борьбе, адаптированной к естественной географии нашей страны, сделает нашу землю более выгодной для нас."
 COL_standing_backups_desc: "Если отделы поддержки и люди будут готовы к нашей защите, мы окажем нам помощь в резерве, которая нам может понадобиться."
 COL_standing_backups: "Постоянные резервы"
 COL_special_forces: "Специальные силы"
 COL_special_forces_desc: "Конфликты уже не такие, какими были наши отцы. Теперь наши люди могут оказаться умирающими в море, на суше или в небе."
 COL_cortes_massive_warfare_desc: "Генерал Карлос Урибе довольно молодой, но довольно амбициозный, у него есть план, он хочет, чтобы мы осуществили стратегию и завербовали все, что в наших силах, создав армию, достаточно большую, чтобы одолеть врага."
 COL_cortes_massive_warfare: "Массовая война Урибе"
 COL_sustaining_our_soldiers: "Поддержание наших фронтальных линий"
 COL_sustaining_our_soldiers_desc: "С большим количеством людей приходит большое количество жертв, и жизни не должны быть потрачены впустую, давайте создадим полевые больницы, которые будут поддерживать нашу великую армию."
 COL_fire_support: "Пожарная поддержка"
 COL_fire_support_desc: "Одних мужчин недостаточно, на поле боя мы будем доминировать."
 COL_reparations_to_peru: "Возмещение экономического ущерба Перу"
 COL_reparations_to_peru_desc: "В соответствии с Договором Летисии, помимо утраты нашей власти на наших южных землях, мы также были вынуждены выплатить компенсацию перуанцам, что вызвало напряженность в нашей экономике."
 COL_reparations_from_colombia: "Возмещение ущерба из Колумбии"
 COL_reparations_from_colombia_desc: "В рамках Договора Летисии, помимо расширения нашей территории, мы получили экономические репарации от Колумбии, стимулируя нашу экономику."
 COL_reparations_to_peru1: "Возмещение экономического ущерба Перу"
 COL_reparations_to_peru1_desc: ""
 COL_reparations_from_colombia1: "Возмещение ущерба из Колумбии"
 COL_reparations_from_colombia1_desc: ""

 COL_la_armada_colombiana: "&lt; &lt; Армада Колумбия &gt; &gt;"
 COL_la_armada_colombiana_desc: "С самого начала наш флот никогда не сдавался и не колебался, и, узнав о войне, пришло время обновить ее и дать ей необходимые ресурсы, чтобы сиять."
 COL_create_national_dockyards: "Баранкильские докьярды"
 COL_create_national_dockyards_desc: "Вместо того, чтобы зависеть от покупки наших военно-морских подразделений у иностранных держав, мы можем вложить в это нашу промышленную продукцию, давайте создадим новые национальные докьярды в Барранкилье, наши золотые ворота."
 COL_protect_the_southwest_coast: "Защищать наше юго-западное побережье"
 COL_protect_the_southwest_coast_desc: "Предполагалось, что наши многие враги будут вновь совершать военно-морские вторжения, пытаясь сломить нас, и поэтому мы должны должным образом защищать побережье крепостями."
 COL_reorganize_naval_strategy: "Реорганизовать военно-морскую стратегию"
 COL_reorganize_naval_strategy_desc: "Есть много стратегий, когда речь идет об организации нашей военно-морской доктрины, пора приложить усилия для обновления нашей."
 COL_escort_buildup: "Наращивание эскорта"
 COL_escort_buildup_desc: "В любом военно-морском флоте необходимы мощные эскорт-корабли, Колумбия не является исключением из этого правила."
 COL_submarine_updates: "Обновление подводных лодок"
 COL_submarine_updates_desc: "Подводные лодки, скрытые корабли оказались разрушительной и мощной силой, которую наш флот мог бы использовать для укрепления."
 COL_battleships_innovations: "Боевые инновации"
 COL_battleships_innovations_desc: "Титаны морей, боевые корабли должны быть должным образом обновлены и должны соответствовать самым высоким стандартам нашего качества."
 COL_cruiser_modernizing: "Модернизация круизера"
 COL_cruiser_modernizing_desc: "Современный флот «Крузер» — это чудо, которое можно увидеть на войне."
 COL_flight_deck_ships: "Летные суда Deck"
 COL_flight_deck_ships_desc: "Развитие полетных палуб, позволяющих судам перевозить мощные и деватические воздушные флоты, меняет морской ландшафт повсюду."
 COL_extend_our_bases: "Расширить базы"
 COL_extend_our_bases_desc: "Многие из них являются нашими портами и портами, но создание дальнейшей инфраструктуры военно-морских баз расширит наш охват."
 COL_infantes_de_marina: "Инвалиды Марины"
 COL_infantes_de_marina_desc: "Морские пехотинцы - мощная сила, которая может добираться до суши из океанов и может осуществлять миссии, о которых многие только мечтают."
 COL_from_sea_to_land: "От моря к земле"
 COL_from_sea_to_land_desc: "Соединяя военно-морские и наземные войны, мы можем легко сделать это, подготовив соответствующие амфибийные корабли."
 COL_mastering_the_waves: "Маэстрос де лас Олас"
 COL_mastering_the_waves_desc: "Мы действительно достигли своего потенциала, модернизировав и соорудив мастерский флот, мы наконец-то сможем управлять волнами."
 COL_we_own_our_skies: "Мы владеем своим небом"
 COL_we_own_our_skies_desc: "Колумбия с гордостью суверена в своем голубом небе и сделает все возможное, чтобы защитить их, особенно после того, как несколько лет назад она ослабла."
 COL_the_airpath_to_victory: "Поездка в сторону Победы"
 COL_the_airpath_to_victory_desc: "Для поддержания контроля над небом нужны дисциплинированные, хорошо подготовленные военно-воздушные силы, но нам нужно выбрать стратегию для наших летающих людей."
 COL_fall_never_again: "Никогда больше"
 COL_fall_never_again_desc: "Приготовились, мы отдали всё, что было в войне за Летицию, но это не сработало, когда мы упали перед бомбардировщиками Перу, и мы не можем позволить себе снова поколебаться."
 COL_for_larger_fleets: "Для более крупных флотов"
 COL_for_larger_fleets_desc: "Наши воздушные флоты нуждаются в расширении, причем не только по числу, но и по своей инфраструктуре."
 COL_the_time_to_fight: "Время сражаться"
 COL_the_time_to_fight_desc: "Опасное сражение между боевиками в воздухе является одним из наиболее впечатляющих аспектов войны, и нам нужно дать нашим храбрым людям все, что им нужно."
 COL_giving_it_back: "Отдайте его обратно."
 COL_giving_it_back_desc: "Когда наши враги бомбили нас и сокрушили наши силы, настало время подготовиться и вернуть им одолжение, вернуть боль."
 COL_shore_bombardment: "Бомбардировка боеголовки"
 COL_shore_bombardment_desc: "К счастью, мы можем использовать наши военно-воздушные силы для уничтожения и разрушения наших врагов!"
 COL_air_productive_efforts: "Воздушные производственные усилия"
 COL_air_productive_efforts_desc: "Мы должны сосредоточиться на увеличении производства воздуха, создании флота достаточно быстро!"
 COL_the_new_battlefield: "Новое поле битвы"
 COL_the_new_battlefield_desc: "По мере того, как земля, моря и небо сливаются с гигантским фронтом боя, Земля стала новым, большим поле боя, где люди в небе могут присоединиться к земле."
 COL_the_frontier_bases: "Пограничные базы"
 COL_the_frontier_bases_desc: "В джунглях, далеко от столицы, мы достигаем границ с нашими врагами, и именно там мы должны подготовить свои базы."
 COL_rocket_technology: "Ракетные технологии"
 COL_rocket_technology_desc: "Ракеты, запущенные ракетами, могут упаковать довольно сильный удар."
 COL_dominate_the_skies: "Доминировать над небом"
 COL_dominate_the_skies_desc: "Никто не может взять славу, кроме нас самих."
 #others
 COL_patriotic_front: "Найти элитное подразделение Патриотического фронта в Кундинамарке."
 COL_backups: "Найти два хорошо подготовленных пехотных подразделения в Кундинамарке."
 #events

 col.1.t: "Положение Колумбии"
 col.1.d: "После победы консерваторов на выборах 1930 года Либеральная партия рухнула в результате того, что внутренние споры между более умеренными и радикальными крыльями партии стали слишком обширными. Хотя это потрясло политическую обстановку созданием новых партий, консерваторский контроль по-прежнему возобладал, т.е. до тех пор, пока не сорвалась война Летисии. Вся нация была опозорена поражением Перу, потеряла наши южные территории и была вынуждена платить компенсацию; возмещение ущерба, которое нанесло ущерб маленькому человеку, а не политической олигархии. Несмотря на то, что в 1935 году в Колумбии появилась волна реваншистских и мятежных настроений. Хорхе Гайтан, радикальный популистский политик, известный своими экстремальными предложениями решить социальные проблемы и продвинуть Колумбию вперед, стал все более популярным по мере того, как националистическая риторика прокатилась в его дискурсе. Таким образом, не удивительно, что в 1935 году он объединил своих сторонников, прошел через Боготу и захватил власть после крайне спорного и сомнительного референдума."
 col.1.a: "Колумбия вновь восстанет."
 col.2.t: "Армейский трастовый фонд"
 col.2.d: "После поражения во время войны Летиция, многие из наших людей пожертвовали всем, чтобы поддержать их, и многие вступили в армию, чтобы сражаться за нашу нацию. Армия дала все, что могла. Таким образом, обвинение быстро переключилось на консервативное правительство. ~n n n Когда Гайтан захватил власть, многие не были уверены, вмешатся ли армия или будет ли она реагировать вообще. Но правда в том, что армия потеряла все уважение к предыдущему правительству и приветствовала нового президента с открытыми объятиями."
 col.2.a: "Вместе мы сделаем Колумбию великой."
 col.3.t: "Моря и небо"
 col.3.d: "Когда началась война, мы оказались плохо подготовленными на военно-морском и воздушном фронтах. Военно-морские силы не существовали как военные силы, а военно-воздушные силы были молодыми и маленькими. Мы быстро воспользовались возможностью купить новый флот для борьбы за нас, и с помощью СКАДСТА, Германско-колумбийского общества воздушного транспорта, мы смогли организовать небольшие военно-воздушные силы, которые храбро сражались за нас. Теперь мы находим себя мудрыми и понимаем, что нам нужно лучше подготовиться к будущему."
 col.3.a: "Колумбии нужна полная сила."
 col.4.t: "Члены оппозиции убегают"
 col.4.d: "Несмотря на то, что мы сделали все возможное для того, чтобы успокоить хаос последних нескольких месяцев, многие начали открыто выступать против правительства президента Гайтана. К счастью для нас, в последние дни эта повстанческая деятельность ушла в прошлое. Несмотря на то, что вскрылось объяснение их происхождения. Похоже, что тысячи оппонентов сбегают из наших границ, покидая Эквадор, Бразилию и Венесуэлу, а также за рубежом. Хотя не нужно иметь с ними дело, это, конечно, не идеально, чтобы предатели отказались от нашего национального проекта и распространяли ложь о нашем правительстве."
 col.4.a: "Отпустите их."
 col.4.b: "Заблокируйте их побег."
 col.5.t: "Оппозиция выходит на улицы"
 col.5.d: "С тех пор, как мы сохранили воинственную оппозицию в пределах наших границ, многие вышли на улицы, протестуя против того, что они называют "президентской тиранией"."
 col.5.a: "Примените силу."
 col.5.b: "Терпимых демонстрантов."
 col.6.t: "Демонстрации"
 col.6.d: "Применение силы против протестующих не помогло, их воинственность усилилась, чтобы сравниться с нашей, и они продолжают проявлять протест после протеста против нашего правительства."
 col.6.a: "Гайтан собирает народ, и оппозиция отстраняется."
 col.6.b: "В Гайтана стреляли, ранив его смертельно."
 col.7.t: "Из Хаоса"
 col.7.d: "Последние несколько месяцев были самыми трудными для нашей страны, однако, объединившись и с руководством Гайтана, мы смогли преодолеть препятствия на нашем пути, хотя это будет нелегко, мы верим в большую судьбу колумбийского народа и сделаем все возможное для достижения этой цели!"
 col.7.a: "Слава Колумбии!"
 col.8.t: "Изменение порядка"
 col.8.d: "Толпа была потрясена, начались массовые митинги в поддержку КООНО и против оппозиции, а также насилие на улицах. Несмотря на то, что воинственная оппозиция продемонстрировала свои истинные цвета, кажется, что более экстремальные члены КООНО были правы. Так был провозглашен лидером экстремистской националистической фракции, бывшим консервативным политиком Лауреано Гомезом, воскликнул, что он сделает все возможное, чтобы уничтожить предателей и отомстить за смерть президента Гайтана, и оппозиция пожалеет об их действиях."
 col.8.a: "Патриция о Муэрте!"
 col.10.t: "Сотрудничество в поддержку реформ"
 col.10.d: "По мере осуществления реформ, предложенных Платформой Колонов, наш народ наконец-то чувствует, что его проблемы решаются, что вызвало волну поддержки нашего режима."
 col.10.a: "Отличные новости!"
 col.11.t: "Традиционалисты выступают против режима"
 col.11.d: "По мере того, как мы продвигаемся вперед в осуществлении наших реформ, возникают проблемы, поскольку более традиционист наших сторонников решил, что они не согласны с нашими всеобъемлющими реформами, осуждая их как воспоминание о марксизме. Они, похоже, не понимают, что это единственная защита нашей нации от марксизма."
 col.11.a: "Это не идеально."
 col.12.t: "Инвесторы покидают страну"
 col.12.d: "В рамках наших широких финансовых реформ национализация и протекционистские программы, как представляется, к сожалению, напугали многих потенциальных инвесторов."
 col.12.a: "Нам они все равно не понравились."
 col.13.t: "Более широкий проект"
 col.13.d: "Как народ нашей великой нации, Колумбия, радуясь своему вновь обретенному статусу, заботясь о государстве, за которое действительно бегут люди, мы сталкиваемся с большими устремлениями."
 col.13.a: "Куда мы пойдем отсюда?"
 col.14.t: "Оппозиция реагирует на национальные средства массовой информации"
 col.14.d: "По мере того, как режим стремится сосредоточить все свои усилия на укреплении нации в целом, а не на решении основополагающих социальных проблем, как марксистов, так и марксистов."democratic" groups have shown their displeasement at this situation.\n\nThis has extended to demonstrations against us."
 col.14.a: "Пришлите наши силы."
 col.14.b: "Мы покажем им результаты."
 col.15.t: "Более жесткая религиозная политика"
 col.15.d: "Когда мы объединяемся с Лос-Леопардосом, их реакционная религиозная политика привлекла наше внимание, конечно же, страна, объединенная верой, образует более сильную нацию."
 col.15.a: "Принимайте политику."
 col.15.b: "Давайте вести себя умнее."
 col.16.t: "Работа в области экономической политики"
 col.16.d: "Месяцы спустя после того, как мы приняли экономическую политику корпоратизма, наш промышленный потенциал и производство заметно возросли. По мере распространения этой информации у людей не останется иного выбора, кроме как понять, что мы были правы."
 col.16.a: "Наконец."
 col.17.t: "Наше право на рождение"
 col.17.d: "С момента нашего рождения века назад мы были предназначены для больших вещей, нам суждено было освободиться от наших колониальных оков, нам суждено было принять великих людей и использовать их сильные стороны как наши, превратившись в многообразную, но благородную нацию, мы должны были стать светящим маяком славы на этом континенте, нам суждено больше, так как мир еще не видит, что будет с Колумбией!"
 col.17.a: "Отлично."
 col.18.t: "Колумбия прекращает выплаты"
 col.18.d: "В совершенно очевидном популистском шаге, и с большим пренебрежением к международным договорам Колумбия объявила о том, что она прекратит выплачивать возмещение, которое они обязаны выплатить в соответствии с Летичийским договором. Несмотря на то, что на данном этапе это не должно оказывать влияния на нашу экономику, с которой мы не можем справиться, это несоблюдение нашего ранее установленного мирного договора может означать лишь проблемы в долгосрочной перспективе."
 col.18.a: "Проклятье этих колумбийцев!"
 col.50.t: "&quot; Ультиматум &quot; из Колумбии"
 col.50.d: "Экспансионистское правительство Колумбии взглянуло на нашу суверенную нацию как на способ реализовать свои национальные амбиции и скрыть свои собственные внутренние слабости. Тем не менее, их армия выросла и они готовы к конфликту, как они дали нам ультиматум, подчиниться верховенству своей нации или столкнуться с последствиями на поле боя."
 col.50.a: "Мы никогда не будем присматривать за нашей нацией!"
 col.50.b: "Наши руки связаны."
 col.51.t: "Падение нашей нации"
 col.51.d: "По мере того, как колумбийские захватчики продвигаются вперед на фронте, наши люди храбро сражались, тем не менее, мы не смогли оттолкнуть колумбийцев назад, и теперь контроль над нашей нацией падает под прикрытием колумбийской армии."
 col.51.a: "Мы сдаемся."
 col.51.b: "Мы еще не упали!"
 col.52.t: "Гранная колумбийская победа"
 col.52.d: "Похоже, что мечта Боливара о объединенной нации Гренадина сбылась, так как наступило падение слабых венесуэльцев, и победа нашего народа сделала нас великими. Теперь, когда Гран-Колумбия воссоединилась, мы должны уметь управлять этими новыми интегрированными территориями, так как в них проживает много диссидентов и врагов. -Нет, пока мы можем сосредоточиться на стабильности и косвенно контролировать Венесуэлу, предоставляя им автономию, которая вознаградит нас их преданностью, и сосредоточимся на их интеграции позже. Или мы можем напрямую аннексировать их провинции к нашей стране, хотя это может означать, что нам придется справиться с более чем несколькими недовольными людьми."
 col.52.a: "Оккупировать пограничные территории и создать марионетку."
 col.52.b: "Присоединяйтесь к нашей земле."
 col.52.c: "Подозреваемый из Венесуэлы."
 col.53.t: "Хаос, когда мы падаем"
 col.53.d: "Как бы мы ни были готовы к этому, величие, однако, казалось, что судьба предала нас, и с учетом того, что непристойные венесуэльцы имеют преимущество. - Но теперь наша страна находится в хаосе, и люди движутся к миру. Предатели! Они все предатели!"
 col.53.a: "Мы никогда не сдадимся!"
 col.53.b: "У нас нет выбора."
 col.54.t: "Колумбийская сдававшаяся сторона"
 col.54.d: "Возможно ли, что мир наконец-то вернулся на континент? Но для нас это маловероятно, по крайней мере, мир близок, так как колумбийцы наконец-то сдались. Сейчас наше время выбрать свою судьбу."
 col.54.a: "Прими мир с некоторыми земельными концессиями."
 col.54.b: "Прими мир."
 col.54.c: "Мы не примем капитуляцию."
 col.55.t: "Падение нашей нации"
 col.55.d: "По мере того, как колумбийские войска продолжают расширять свои подконтрольные территории, контроль нашего правительства над страной падает, хаос на улицах продолжается, так как наша нация больше не в состоянии выдержать."
 col.55.a: "У нас нет выбора."
 col.55.b: "Перу сегодня не упадет!"
 col.56.t: "Победа во второй войне Летисии"
 col.56.d: "Когда наши люди шли храбрым путем, побеждая любого, кто стоит на их пути, Перу, наконец, почувствовал силу единого колумбийского народа, что он рушится, и поэтому у них не было другого выбора, кроме как сдаться. Наши люди маршируют в Лиму, когда наши флаги машут в их городах, сигнализируя прибытию победителей, колумбийского народа."
 col.56.a: "Возьмите то, что мы заслужили, и создайте предметное правительство."
 col.56.b: "Мы будем править всем."
 col.57.t: "Хаос, когда мы падаем"
 col.57.d: "Как бы мы ни были готовы к этому, величие, однако, казалось, что судьба предала нас, и с учетом того, что непристойные венесуэльцы имеют преимущество. - Но теперь наша страна находится в хаосе, и люди движутся к миру. Предатели! Они все предатели!"
 col.57.a: "Мы никогда не сдадимся!"
 col.57.b: "У нас нет выбора."
 col.58.t: "Колумбийская сдававшаяся сторона"
 col.58.d: "Возможно ли, что мир наконец-то вернулся на континент? Однако для нас это маловероятно, по крайней мере, мир близок, так как мерзкий колумбийский отброс, который угрожал нашей стабильности, наконец-то сдался. Перуанские солдаты снова гордо маршируют на Боготу, как мы ожидаем на этот раз, колумбийцы наконец-то усвоили урок."
 col.58.a: "Прими окончательные земельные концессии."
 col.58.b: "Новые экономические репарации уже в порядке."
 col.58.c: "Давайте приведем новое правительство, ближе к нашей сфере."

 col.60.t: "Вторжение Амазонки"
 col.60.d: "Поскольку бразильский народ разъединяется, которому угрожают предатели и олигархи, которые ослабили его единство, мы не можем не заметить марксистского врага в нашем районе, коллективистского Союза Бразилии. Время, как мы понимаем, возможно, самое лучшее для нас и Южной Америки, если мы воспользуемся возможностью вторгнуться в коллективистов в Амазонии и ослабить их контроль над зоной, а также восстановить давно потерянную территорию Гренадина, конечно."
 col.60.a: "Для Колумбии!"
 col.61.t: "Экспансионистские колумбийцы вторгаются"
 col.61.d: "Именно то, что нам было нужно, националистические колумбийцы, движимые желанием экспансии, использовали наше рассуждение и решили вторгнуться в нас. Когда мы видим, что они движутся у нас на спине, несколько храбрых мужчин восстали, чтобы бороться за Союз, отказавшись даже от идеологических разногласий, пока бразильские рабочие объединятся против этой иностранной угрозы."
 col.61.a: "Мы их задержим!"
 col.62.t: "Победа в Амазонках?"
 col.62.d: "Наши фронлины и достижения занимают важные территории Амазонии, по крайней мере, важны для нас. Сейчас, когда Союз устал, и когда наши люди празднуют на фронте и дома, кажется, мы сможем аннексировать эти территории к нашим национальным сферам. Тем не менее, есть надежда на то, что мы должным образом разрушим эту войну, но все указывает на то, что война замедлится и приведет к ненужным потерям, если мы продолжим."
 col.62.a: "Пошлите мирное предложение."
 col.62.b: "Покончим с марксистами!"
 col.63.t: "Предложение мира?"
 col.63.d: "По мере того как колумбийцы держатся за наши внешние амазонские земли, кажется, что мы не можем не выполнить их требования, поскольку они посылают мирное предложение, так как существование колумбийского фронта слишком ослабило наши силы в наших внутренних конфликтах."
 col.63.a: "Прими предложение."
 col.63.b: "Потихоньку невежливо."
 col.64.t: "Бразильцы невежливо опускаются."
 col.64.d: "Наш президент, казалось, отошел назад, когда получил новости о марксистских бразильцах, не только отвергших наше великодушное мирное предложение, но и послав довольно вульгарное оскорбление на португало, говоря о матери президента."
 col.64.a: "Малтдитос-Бразильянос!"

 col.1001.t: "Надлежащим образом расползает наш народ"
 col.1001.d: "Война, дипломатия - это все игра. Какими бы ни были средства, мы пришли к власти над большими участками земли, некоторые из которых, не являются неотъемлемой частью нашей нации, не являются таковыми. Мы пришли к естественному выводу, таким образом, передать эти земли ее законному владельцу, чтобы не допустить дальнейшей несправедливости в регионе."
 col.1001.a: "Естественный выбор."
 col.1001.b: "Но это законно."
 col.1002.t: "Починка границы"
 col.1002.d: "Человеческий игрок не может марионеткой называть Бразилию Беписом."
 col.1002.a: "100%"
 col.1002.b: "Но почему."
