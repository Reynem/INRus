chl.1.t: "Нация на коленях"
chl.1.d: "До Великой войны наша нация была сильной и на подъеме, никто не мог говорить о Южной Америке, прежде чем упомянуть Чили в качестве одной из ее держав, и мы были на пути к величию, или так мы думали. Славная система кровопролития, которая нас раздражала, сделала нас восприимчивыми к переменам и медленно к реформам, и заглушила голос народа. Но во время Великой войны Солтпетре, жизненная кровь нашей экономики, перестала быть разыскиваемым ресурсом. Теперь наша экономика находится на полу, а недостатки нашего правительства более заметны, чем когда-либо. Наш народ почти потерял веру в демократию и ищет лидера, который может вернуть перемены к славной судьбе нашей падшей нации, мы должны быть осторожными, потому что экстремальные движения растут, и люди будут искать любой способ, чтобы его голос был услышан, будь то по разуму, или силой. Между тем, фигуры и политические деятели, как достичь власти. Какой путь займет Чили?"
chl.1.a: "Мы должны объединиться в самый низший момент."
chl.2.t: "Критическая точка"
chl.2.d: "Несмотря на то, что правительство сделало все, что в его силах, для того чтобы изменить нашу экономику во время кризиса, чилийский народ все еще сильно пострадал от ее положения, и по мере усиления политической поляризации никто не удивился, когда люди вновь обратились к экстремистским группам, чтобы вернуть свои надежды и мечты на лучшее будущее."El Jefe" González Von Marées, stood together and marched their way into La Moneda, as the government was backed into a corner, with no place left to run."
chl.2.a: "Готовясь к кризису, армия быстро вмешалась и остановила марширующих валькистов."
chl.2.b: "Марш на Сантьяго Сукседс, в то время как Чили ходит под баннером Валькисмо."
chl.2.c: "Нация возьмет под свой контроль свою судьбу, с когтями мира!"
chl.3.t: "Выборы 1940 года"
chl.3.d: "Так что совсем недавно казалось, что демократия рухнула и наша страна была на грани краха, однако сейчас демократия была доказана правильной системой для нашего народа и традицией в нашей стране, и наша страна обрела свою давно потерянную стабильность. Пришло время для того, чтобы демократия выбрала нашего нового лидера, так как срок Монтеро подходит к концу. Кого будет решать народ, какой идеологией будет руководствоваться наш народ в этом опасном мире?"
chl.3.a: "Эдуардо Круз-Кок, кандидат ПК, консерватор, но реформист."
chl.3.b: "Густаво Росс, кандидат от PL, известный экономист и защитник свободного рынка"
chl.3.c: "Мармадуке Гроув, кандидат PS, бывший военный и демократический социалист."
chl.3.e: "Хуан Антонио Риос, кандидат от PR, реформист и фаворит в Монтеро."
chl.4.t: "Военные останавливают Валькиста."
chl.4.d: "По мере того, как армия вступает в Валькиста и оказывает помощь в борьбе с ним, отгоняя экстремистов от власти, различные военные группировки понимают ситуацию, в которой они находятся."
chl.4.a: "Правительство республики должно защищать нас, как и ее демократия."
chl.4.b: "Более сильное руководство может наконец решить наши проблемы."
chl.10.t: "Коммунистические демонстрации"
chl.10.d: "По мере того, как мы крепнем на политической базе нашей нации, экстремисты недовольны нашим успехом, некоторые из крайне левых групп, подобных Коммунистической партии, начали демонстрации на улицах, отрезали дорогу и прервали запланированную речь нашего генерала."
chl.10.a: "Усилить безопасность на улицах и продолжать политические усилия Ибаньеса."
chl.10.b: "Экстремисты слишком опасны, давайте просто распространим пропаганду против них."
chl.13.t: "Карлос Ибаньес убит!"
chl.13.d: "Речь прошла так, как и планировалось, наш народ был доволен, все были довольны, чувствовали себя счастливыми под защитой генерала, или так они думали, но когда это событие закончилось, экстремальные левые группы начали демонстрации на улице за углом, зная, в какой опасности он находится, генерал подготовился к отъезду, однако один из мятежников подошёл близко и смог выстрелить Ибаньесу в голову. Повстанец был застрелен на месте, но произошла трагедия, наш генерал мертв, военное командование взяло власть над нацией в этот час скорби."
chl.13.a: "Граф Бланш обещает вернуть демократию в республику."
chl.13.b: "Грааль Бланш устанавливает военное положение, и военный режим продолжается."
chl.14.t: "Социальный вопрос."
chl.14.d: "В преддверии следующих выборов и восстановления демократии, генерал Бланш сделал все возможное, чтобы защитить нашу нацию от беспорядков, особенно с ростом мятежных сил, недовольных военным режимом. Теперь вопрос в сознании каждого; что будет с Мармадуком Гроувом и социалистической партией?. Гроув, будучи громким критиком диктатуры, высказался и сказал, что он не поддерживает радикальные группы, ответственные за смерть генерала Ибаньеса. Тем не менее, недоверие к его партии усилилось в эти неспокойные времена."
chl.14.a: "Социалисты Гроува именно такие, какие нам нужны, а не экстремисты."
chl.14.b: "Рост только левой части ранил нас, и рана все еще открыта, давайте лучше запретим социалистам участвовать."
chl.15.t: "Возвращение к демократии."
chl.15.d: "Мы прошли через столько времени. Демократия была на грани краха, наша экономика была мертва и похоронена. Но посмотрите на нас сейчас, мы пережили опасные экстремисты, а также невероятные диктатуры, по крайней мере, пока не пришел генерал Бланш. И теперь демократия готова вернуться домой, может быть, все наконец-то обернется к лучшему, но вопрос в том, за кого будет решать народ? Какая идеология будет направлять наш народ в этом опасном мире?"
chl.15.a: "Эдуардо Круз-Кок, кандидат ПК, консерватор, но реформист."
chl.15.b: "Густаво Росс, кандидат от PL, известный экономист и защитник свободного рынка"
chl.15.c: "Мармадуке Гроув, кандидат PS, бывший военный и демократический социалист."
chl.15.e: "Хуан Антонио Риос, кандидат от PR, реформист и фаворит в Монтеро."
chl.16.t: "Возвращение к демократии."
chl.16.d: "Мы прошли через столько времени. Демократия была на грани краха, наша экономика была мертва и похоронена. Но посмотрите на нас сейчас, мы пережили опасные экстремисты, а также невероятные диктатуры, по крайней мере, пока не пришел генерал Бланш. И теперь демократия готова вернуться домой, может быть, все наконец-то обернется к лучшему, но вопрос в том, за кого будет решать народ? Какая идеология будет направлять наш народ в этом опасном мире?"
chl.16.a: "Эдуардо Круз-Кок, кандидат ПК, консерватор, но реформист."
chl.16.b: "Густаво Росс, кандидат от PL, известный экономист и защитник свободного рынка"
chl.16.c: "Хуан Антонио Риос, кандидат от PR, реформист и фаворит в Монтеро."
chl.17.t: "Предложение Чили"
chl.17.d: "Наши нации не имели лучших моментов вместе, и раны медленно залечиваются, однако чилийский режим имеет такой же разум, как и мы, и считает, что может быть заключен взаимовыгодный договор, хотя наши национальные интересы стоят на первом месте, мы не без врагов, и такая дружба может быть лучшим решением для нашей нации."
chl.17.a: "Мы согласны с этим пактом."
chl.17.b: "Перу не нужны друзья."
chl.18.t: "Перу согласна с договором!"
chl.18.d: "Приехали дипломаты с новостями, и Перу согласилась заключить договор с нашей страной, и они тоже видят, что так будет лучше для нас обоих, если мы создадим такие связи."
chl.18.a: "Похоже, они умные."
chl.19.d: "Предложение пришло из Чили, у нас, возможно, не так много связей, дружелюбных или иных, но чилийский режим так же, как и мы, и считает, что может быть заключен взаимовыгодный договор, хотя наши национальные интересы стоят на первом месте, мы не без врагов, и такая дружба действительно может быть лучшим решением для нашей нации."
chl.19.a: "Мы согласны с этим пактом."
chl.19.b: "Венесуэла не нуждается в друзьях."
chl.20.t: "Венесуэла согласна с договором!"
chl.20.d: "Венесуэла согласилась заключить договор с нашей страной, и они тоже видят, что так будет лучше для нас обоих, если мы создадим такие связи."
chl.20.a: "Похоже, они умные."
chl.21.t: "Чили приглашает нас"
chl.21.d: "Наши страны не имели лучших моментов вместе, войн, которые все еще остаются в нашей памяти, но сейчас, как никогда ранее, Южная Америка находится на грани конфликта, и чилийское правительство считает, что оборонительный альянс может помочь нашим странам в эти трудные времена, и предлагает нам выступить вместе."
chl.21.a: "Демократия должна соединиться."
chl.21.b: "Возможно, это не лучший шаг."
chl.22.t: "Перу присоединяется к нашему альянсу!"
chl.22.d: "Сегодня, как никогда ранее, демократия объединяется в это время предстоящего конфликта."
chl.22.a: "Сегодня мы стоим вместе."
chl.23.t: "Чили приглашает нас"
chl.23.d: "По мере эскалации дипломатической напряженности в регионе чилийское правительство считает, что оборонительный альянс мог бы помочь нашим странам в эти трудные времена, и предлагает нам объединить свои усилия."
chl.23.a: "Демократия должна соединиться."
chl.23.b: "Возможно, это не лучший шаг."
chl.24.t: "Эквадор согласен с нашим альянсом!"
chl.24.d: "Дипломаты прибыли с новостями, Эквадор согласился на создание оборонительного альянса с нашей нацией. Сегодня, как никогда ранее, демократия объединяется в это время предстоящего конфликта."
chl.24.a: "Сегодня мы стоим вместе."

chl.1000.t: "Толпа Реунитов в Валькистском собрании"
chl.1000.d: "По мере того, как народ продолжает питать недовольство в нашей стране, масштабы валькистов, собирающихся по всей стране, растут, подкрепляемые сильным презрением к демократии и опасной риторикой, которая смешивает восхваление прошлого Чили с прогрессивным, футуристическим мышлением, эта группа в последние несколько лет набирает обороты, особенно по мере того, как валькизм укрепляет свою позицию в Германии."The elected leaders don't belong here, not one of them can understand nor share the political spirit of our united nation, they belong to a era far begone, as their republican system does. Throwing off their system Chile can let its voice be heard.", as the crowds cheered for "El jefe", as they call González."
chl.1000.a: "Может, республика потерпела неудачу."
chl.1000.b: "Лучше порицай его речь в газетах."
chl.1001.t: "Провоенное просвещение растет"
chl.1001.d: "Напряженность в нашей стране усиливается, когда в небольших газетах публикуются предполагаемые разговоры между армейскими офицерами, обсуждающими переход к власти, если нынешний режим не сможет улучшить ситуацию, быстро распространяясь между различными средствами массовой информации. В то время как военные защищали наше правление во времена неустойчивости, многие подозревают, что высшее командование утратило веру в наше правительство, эта идея, хотя и новая, заставила многих граждан заявить о своей поддержке военных, попросив их освободить нашу страну. Ни один офицер не комментировал этот вопрос."
chl.1001.a: "Может быть, более сильное правление - это то, что нужно этой стране."
chl.1001.b: "Армия ослушалась правительства?"
chl.1002.t: "Мануэль Рохас бросает вызов валькизму"
chl.1002.d: "Известный поэт, писатель и политический деятель Мануэль Рохас недавно опубликовал статью, в которой он критикует валькизм и все, что он защищает."vague, populistic, and tricking the people into not realizing the true social issues", he has caused many differing reactions amongst the population. \nManuel himself has been critical of our government as well, even if not denouncing democracy as the valkists have. That combined with his participation in the more extreme stands of the Socialist Party, makes him a figure to be careful about, many worrying he might be hiding intentions as extreme as the valkists themselves."
chl.1002.a: "Не всех так легко обмануть валькизмом."
chl.1002.b: "Мы предпочитаем революционеров, которые думают прежде всего о Чили."
chl.1003.t: "Принятие законопроекта об экономической и финансовой перестройке"
chl.1003.d: "Новый законопроект президента Монтеро о реорганизации был принят парламентом в редких случаях, когда представители не задерживали его слишком сильно. В законопроекте устанавливаются некоторые льготы для свободного инвестирования и прощаются некоторые долги бедных. Приветственная попытка вернуть нашу экономику была по-прежнему подвергнута широкой критике за то, что она была слишком малой и не делала большего для нашей экономики. - Несмотря на то, что представители выходили из здания конгресса, Хорхе Силва Сомаррива, депутат Либеральной партии, и защитник законопроекта, был сорван группой мужчин на коричневых рубашках, которые обвинили его в том, что он не заботится о социальных проблемах и не отравляет страну. Поскольку охранники здания пришли за помощью, он в основном не пострадал, но люди сбежали. Поляризация и насилие в нашем обществе достигли критической точки."
chl.1003.a: "Мы должны проявлять осторожность при управлении экономикой, и нет оправдания насилию."
chl.1003.b: "Политики, которые прячутся от проблем, будут нести ответственность, люди несчастны."
chl.1004.t: "Происходит обсуждение вопроса о палате депутатов в качестве закона о коллективных трудовых отношениях"
chl.1004.d: "Ранее был принят Закон о солидарной трудовой деятельности исполнительной власти, защищающий работников от злоупотреблений при сверхурочной работе и от отвратительных контрактов, которые можно считать оскорбительными."
chl.1004.a: "Так много споров и конфликтов между политиками, что осталось от народа?"
chl.1005.t: "Трудящиеся проводят забастовки и марш"
chl.1005.d: "Необъявленное событие привело к тому, что работники начали забастовку и начали маршировать сегодня в Нюньоа, поскольку улицы были заполнены недовольными работниками, а воздух этого движения отличался от предыдущих проявлений."
chl.1005.a: "Кажется, Чили знает, чего она хочет."
chl.1005.b: "Изменения не происходят быстро, но республика единственная, кто может их принести."
chl.1006.t: "Президент встречается с главнокомандующим армией"
chl.1006.d: "Сегодня утром президент Монтеро воссоединился с главнокомандующим армии Луисом Альтамирано в Ла-Менеде."
chl.1006.a: "Этой стране нужна стабильность, может, армия поможет."
chl.1006.b: "Я уверен, что это ерунда."
chl.2000.t: "Вторжение Тихоокеанского региона"
chl.2000.d: "Газеты и радио всем говорят, что наша нация на пороге новой эры, духи высоки, даже если есть сомнения, как заявил сегодня утром лидер нашей страны, что мир больше не заразит нас, и Чили заберет то, что по праву принадлежит нам."
chl.2000.a: "По праву или по могуществу!"
chl.1999.t: "Чили заявляет о своих намерениях в Тихоокеанском регионе"
chl.1999.d: "Новости прибыли, и нам сообщили, что Чили собирается начать агрессивное расширение островов в южной части Тихого океана, которые в настоящее время находятся под британским контролем. Хотя мы не ожидаем многого от агрессивного, популистского правительства южноамериканской страны, возможно, это событие будет полезным для нас. Действительно, все посягающее влияние Империи в Тихом океане представляет собой прямую угрозу нашим собственным интересам, и мы не можем подвергать опасности Чили, попавшую под британское влияние, заявляя о нашей поддержке и защите амбиций Чили, может быть лучшим вариантом."
chl.1999.a: "Мы поддерживаем законные притязания Чили и не потерпим британского империализма."
chl.1999.b: "Конфликты между другими странами не важны для Америки."
chl.2001.t: "Чили вторгается в наши владения"
chl.2001.d: "Еще одна угроза стоит перед нашей империей, поскольку Чили провозглашает вторжение в наши южнотихоокеанские островные районы. Хотя сейчас мы не в лучшем положении для того, чтобы приложить усилия в этом направлении, это не должно быть большой проблемой для Королевских военно-морских сил. Однако, несмотря на то, что Соединенные Штаты, стремясь антагонизировать нас, заявили о своей явной поддержке амбиций Чили, и, если мы вмешаемся, они могут использовать этот конфликт как способ создания конфликта между нами для контроля над тихоокеанской сферой влияния. Никакую конфронтацию с государствами не следует избегать любой ценой, наши лояльные подданные нации, тем не менее, могут быть в состоянии справиться с этим конфликтом, не создавая больших политических потрясений, чтобы поставить под угрозу нашу империю, они могут даже заработать что-то из всего этого."
chl.2001.a: "Мы не откажемся от своих владения пустыми угрозами, оружием!"
chl.2001.b: "У Австралии не должно быть проблем с решением этого вопроса самостоятельно."
chl.2006.t: "Империя игнорирует нашу поддержку Чили"
chl.2006.d: "Сюрприз взял на себя правительство, так как Британская Империя неожиданно не отступила и прямо объявила войну Чили, хотя Чили, возможно, и не создает для них больших проблем, империя достигла слабой точки, и сейчас более чем когда-либо может стать нашей возможностью нанести удар по ним и утвердить наше влияние как великую силу миру."
chl.2006.a: "Они искали это!"
chl.2006.b: "Не поймите нас неправильно, мы никогда не бросали вызов Империи."
chl.2005.t: "Чили вторгается в наши владения"
chl.2005.d: "Еще одна угроза стоит перед нашей империей, так как Чили провозглашает вторжение в наши районы южнотихоокеанских островов, хотя сейчас мы не в лучшем положении для того, чтобы приложить усилия в этом направлении, это не должно быть большой проблемой для Королевских военно-морских сил, и все же есть много соображений, которые нужно учитывать при распределении наших ресурсов, и безопасный вариант, который не стоил бы нам столько, чтобы заставить Австралию справиться с конфликтом, учитывая ее близость и влияние в этом районе, это может быть естественным выбором, если мы не чувствуем, что мы вмешаемся напрямую."
chl.2005.a: "Мы не отдадим наши владения слабым джингоистическим штатам, вооружениям!"
chl.2005.b: "У Австралии не должно быть проблем с решением этого вопроса самостоятельно."
chl.2002.t: "Война в южной части Тихого океана"
chl.2002.d: "Грубые новости приходят, когда на империю нападает другая угроза, одна ближе к дому. Чили вот-вот вторгнется и попытается захватить районы юго-восточного мирного острова империи. Они ошиблись в нашей трудной ситуации из-за слабости, и она упала на плечи Австралии. Мы отдадим все наши силы, чтобы защитить океан от этих захватчиков!"
chl.2002.a: "На войну!"
chl.2003.t: "Австралия сдается!"
chl.2003.d: "Австралийское правительство подали в суд на мир, поскольку его нация больше не может сражаться, а острова находятся под нашим контролем, победа наконец-то близится."
chl.2003.a: "Мы восстановили то, что было предназначено для нас."
chl.2003.b: "Сейчас не время останавливаться, вся Австралия должна быть под нашим контролем!"
chl.2004.t: "Чили сдается!"
chl.2004.d: "Чилийское правительство потребовало мира, поскольку их нация больше не может сражаться, и наши области находятся под нашим контролем, победа наконец-то близится."
chl.2004.a: "Австралия побеждает!"
chl.2004.b: "Сейчас не время останавливаться, вся Чили должна быть под нашим контролем!"
chl.2010.t: "Перу подает в суд за мир"
chl.2010.d: "Белые флаги махают на фронте битвы, когда перувианцы сдаются, предлагая нам то, что мы когда-то забрали у них, Такна."
chl.2010.a: "Прими их капитуляцию и возьми обратно Такну."
chl.2010.b: "Приемлема только полная победа."
chl.2011.t: "Чилийцы сдаются"
chl.2011.d: "Белые флаги махают на фронте битвы, когда чилианцы сдаются, и их безрассудный экспанионизм наконец-то их укусил, и Перу принесет им возмездие и исправит ошибки прошлого."
chl.2011.a: "Возвращение в нашу южную провинцию, Арика"
chl.2011.b: "Не останавливайся, пока мы не возьмем под контроль всю Чили."
chl.2012.t: "Боливийское правительство падает"
chl.2012.d: "Радикальное правительство Боливии упало по мере того, как войска пошли дальше в страну, пока еще продолжаются некоторые битвы, очевидно, что мы победители. Мы возьмем на себя руководство более дружелюбным правительством или продолжим наше расширение?"
chl.2012.a: "За безопасную Южную Америку."
chl.2012.b: "Никаких остановок, пока джунгли не будут под контролем хилиан."


###decisions###
CHL_political_decisions: "Политические действия - Чили"
CHL_political_decisions_desc: "Многое еще предстоит сделать и так мало времени, так что новые решения для нашего правительства могут появиться в любое время."
CHL_civic: "Построить гражданский квартал"
CHL_civic_desc: "Поскольку наш народ, кажется, потерял надежду после многих лет упадка, мы оказались нуждающимися в вдохновении. Наш президент (Root.Get Header) также заметил это, но Чили выйдет вперед и прогресс, и, чтобы показать это, мы можем построить новый Гражданский квартал в нашей столице, чтобы действовать как факел надежды во тьме."
CHL_monument_to_labour: "Построить памятник трудящемуся"
CHL_monument_to_labor_desc: "В течение десятилетий непродуктивных правительств под тиранией в салоне Чили оказалась полностью игнорирующей голос простых людей. Чтобы показать, что мы заботимся, мы построим новый памятник аль-Обреро, который, хотя он и не решит ни одной социальной проблемы, он покажет наш компромисс, чтобы улучшить жизнь рабочих классов."
CHL_social_service_program: "Разработать программу социальной работы"
CHL_social_service_program_desc: "Молодежь крайне необходима для того, чтобы такая исцеляющая нация, как Чили, восстановилась материально и духовно."

###ideas###

CHL_readjusted_plan: "Пересмотренный экономический план"
CHL_readjusted_plan_desc: "Были внесены некоторые незначительные изменения в наше экономическое и финансовое законодательство."
CHL_solidary_labour: "Закон о прочном труде"
CHL_solidary_labour_desc: "Наконец, были приняты некоторые законы о труде, защищающие трудящихся, хотя они являются весьма незначительными."
CHL_crumbling_government: "Разрушающее правительство"
CHL_crumbling_government_desc: "Сейчас, когда экономика находится на полу и почти ничего не делается, чтобы ее исправить, как никогда, наше правительство находится на грани краха."
CHL_collapsed_economy: "Разрушенная экономика"
CHL_collapsed_economy_desc: "Несмотря на то, что мы не сражались во время Великой войны, последствия ее развития по-прежнему ощущаются на нашей трудной экономике."
CHL_political_polarization: "Политическая поляризация"
CHL_political_polarization_desc: "Неудачи нашего правительства разделили страну на то, что она должна делать."
CHL_economic_reforming: "Перестройка экономики"
CHL_economic_reforming_desc: "Мы находимся в процессе перестройки нашей экономики."
CHL_economic_reestructuring: "Перестройка экономики"
CHL_economic_reestructuring_desc: "Мы начали процесс перестройки нашей экономики."
CHL_reforming_government: "Реформа правительства"
CHL_reforming_government_desc: "В условиях кризиса, в котором находится наша страна, наше правительство решило реформировать себя, с тем чтобы лучше решать наши проблемы."
CHL_political_instability: "Политическая нестабильность"
CHL_political_instability_desc: "Несмотря на то, что наше демократическое правительство до сих пор сохранилось, нестабильность по-прежнему омрачает нашу страну."
CHL_new_republic: "Новая Республика"
CHL_new_republic_desc: "Большие проблемы стоят перед нашей страной, но под правлением демократии и прислушиваясь к своему народу, республика вновь обрела силу."
CHL_chilean_race: "Чилийская раса"
CHL_chilean_race_desc: "Наш народ - потомки древних традиций воинов, завоевание и битва в нашей крови!"
CHL_classes_united: "Классы"
CHL_classes_united_desc: "Не секрет, что не все рождаются в равных условиях, тем не менее, вместо того, чтобы осуждать простую природу, мы все должны признать нашу роль в обществе и нашу роль в этой стране!"
CHL_paternal_state: "Отцовское государство"
CHL_paternal_state_desc: "Мы идем по правильному пути под руководством государства и нашего генерала Карлоса Ибаньеса."
CHL_paternal_regime: "Отцовское государство"
CHL_paternal_regime_desc: "Мы идем по правильному пути под руководством государства и нашего генерала Карлоса Ибаньеса."
CHL_chilean_valkism_idea: "Чилийский путь к валькизму"
CHL_chilean_valkism_idea_desc: "Все знают, что каждая нация разная, это естественно, что наша версия валькизма - самая лучшая из всех."
CHL_warrior_legacy: "Наследие войны"
CHL_warrior_legacy_desc: "Наш народ - это воины по крови и истории, и мы никогда не забудем наше наследие."
CHL_roto_valkism: "Рото Валькизм"
CHL_roto_valkism_desc: "Наши соседи называли нас вращающимися, когда мы были сломлены трудностями и шансами, но вращающиеся стороны победили их и оказались неумолимыми и всегда будут."
CHL_chilean_nation: "Чилийская нация"
CHL_chilean_nation_desc: "Это страна страстных душ и благородных воинов, и мы ни перед чем не остановимся, чтобы показать миру, что мы лучшие!"
CHL_guided_men: "Мужчины-руководители"
CHL_guided_men_desc: "Под сильным руководством генерала Ибаньеса наши люди наконец осознали важность нашей нации."
CHL_content_elite: "Элит содержания"
CHL_content_elite_desc: "Элитная элита, несмотря на то, что она была в своем заблуждении, все еще может быть полезной для нашей великой страны под руководством генерала Ибаньеса, конечно."
CHL_peoples_economy: "Народная экономика"
CHL_peoples_economy_desc: "Наконец, люди находятся в центре внимания экономики в рамках общего Ибаньеса дель Кампо, который тратит больше средств как на промышленность, так и на социальную помощь."
CHL_popular_economy: "Народная экономика"
CHL_popular_economy_desc: "Экономические реформы нашего генерала сделали нашу экономику величайшей в нашей истории, наконец, бедные и работающие чувствуют себя в выигрыше, и наша промышленность выросла."
CHL_president_ibanez: "Президент Ибаньес"
CHL_president_ibanez_desc: "Карлос Ибаньес дель Кампо взял народ под свое крыло и направил нас к нашей судьбе, больше, чем генерал, он всегда будет известен как президент."
CHL_the_new_model: "Новая модель"
CHL_the_new_model_desc: "Теперь, после восстановления и стабильности, радикалы, наконец, внедряют ту модель, которую они обещали."
CHL_radical_welfare: "Радикальное благосостояние"
CHL_radical_welfare_desc: "В рамках новой модели нашего общества бедные слои населения получают более мягкое лечение с новыми механизмами социального обеспечения, которые должны обеспечивать им определенную безопасность в процессе их жизни."
CHL_moderate_reforms: "Умеренные реформы"
CHL_moderate_reforms_desc: "Как бы нам ни хотелось спешить с реформами и расходами, мы должны быть осторожны в управлении нашей страной, поскольку это то, о чем следует заботиться, и это требует стабильности, поэтому наши реформы могут быть достигнуты только в столь далеком будущем."
CHL_balanced_budget: "Сбалансированный бюджет"
CHL_balanced_budget_desc: "Это не тайна сбалансированного бюджета, снизившегося по долгам и убедившегося в том, что каждое число подходит для управления страной, наша не отличается."
CHL_liberalized_economy: "Либерализованная экономика"
CHL_liberalized_economy_desc: "Слишком долго протекционизм задушил нашу экономику, давайте освободим ее от досягаемости правительства, позволив свободному рынку работать на нашу пользу лучше, чем любое государство."
CHL_foreign_investors: "Предисловие к инвесторам"
CHL_foreign_investors_desc: "Наша страна долгое время была далека от глобального взгляда, отчасти из-за незначительного экономического интереса к ней, если мы ищем иностранных инвесторов, мы можем принести больше доходов и успехов нашей экономике, а также известности нашей нации."
CHL_socialized_society: "Социализированное общество"
CHL_socialized_society_desc: "Жадность и индивидуальная конкуренция ослабили и разъединили нас слишком долго, давайте изменим наш менталитет и подумаем о другом перед собой."
CHL_agrarian_reform: "Новая аграрная реформа"
CHL_agrarian_reform_desc: "Большая часть нашей страны все еще аграрна, даже если она быстро сокращается, давайте реформируем земли, чтобы улучшить наше производство продовольствия и жизнь нашей деревни, как говорит президент Гроув:"Neither land without men nor men without land"."
CHL_standing_up_alone: "Стоять в одиночестве"
CHL_standing_up_alone_desc: "Приверженность международным связям и дипломатическим отношениям может быть не лучшим решением для нас, скорее, сохранение какого-то нейтралитета обеспечит, чтобы мы не привлекали врагов и чтобы мы были гибкими в иностранных делах."
