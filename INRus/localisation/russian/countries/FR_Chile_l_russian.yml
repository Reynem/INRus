l_russian:

CHL_FUHRERREICH_DESC: "Для страны, которая не сражалась во время Великой войны, годы показали, что то, что произошло во время войны, сильно повлияло на Чили, что появление новых процессов, позволяющих синтезировать удобрения, разрушило сердцевину ее экономики, поскольку давно назревшие социальные проблемы остались без ответа, а шансы на проведение реформ были заблокированы недружественной и неэффективной системой патологоанатомии, народ Чили начал терять веру в эту систему, и страна является лишь оттенком того, что было 20 лет назад."


