###focuses###

CHL_path_of_nation: "Путь нашего народа"
CHL_path_of_nation_desc: "Сейчас трудные времена для нашей страны, экономика рухнула, мы упали, и правительство ничего не делает."
CHL_readjust_economic_plan_desc: "Хотя большие изменения представляются маловероятными, мы должны попытаться внести некоторые коррективы в наш нынешний экономический план, с тем чтобы попытаться стабилизироваться из-за нашей ужасной ситуации."
CHL_readjust_economic_plan: "Пересмотренный экономический план"
CHL_connect_with_the_people: "Связь с людьми"
CHL_connect_with_the_people_desc: "Общее чувство размежевания между ворчащими классами и людьми может ощущаться через нашу страну, давайте сделаем шаг вперед к сближению с людьми."
CHL_solidary_labour_law: "Закон о прочном труде"
CHL_solidary_labour_law_desc: "Наши рабочие пострадали как от экономического краха, так и от десятилетий неправильного управления со стороны своих работодателей, в то время как более масштабные реформы представляются маловероятными, давайте осуществим некоторые законы о труде, которые помогут облегчить ситуацию."
CHL_try_to_stabilize: "Постарайтесь стабилизировать"
CHL_try_to_stabilize_desc: "Напряженность и поляризация могут ощущаться в нашей стране, давайте попробуем ослабить напряженность и сфокусируем внимание на поддержании стабильности в стране, чтобы не случилось что-то плохое."
CHL_the_critical_point: "Критически важный момент"
CHL_the_critical_point_desc: "По мере того, как правительство пытается сделать все возможное, чтобы вернуть нас на ноги, наше состояние, похоже, не улучшается, в нынешней политической обстановке в Чили мы приближаемся к критической точке, что-то вот-вот произойдет."
CHL_democracy_survives: "Демократия выживает"
CHL_democracy_survives_desc: "Несмотря на то, что многие по-прежнему возмущены неудачами нашего правления и замыслами свергнуть наше падение, демократия еще не рухнула и, как представляется, выжила в этот климатический момент для нашей страны."
CHL_military_guard: "Под военной охраной"
CHL_military_guard_desc: "Хотя экстремальные силы, стремящиеся расколоть наш народ, почти охотились на слабость нашего правительства, благородный генерал Карлос Ибаньес пришел, чтобы наставить нас на прямой путь и направить нас к нашей судьбе!"
CHL_chilean_valkism: "Чилийский путь к валькизму"
CHL_chilean_valkism_desc: "Устал от игр и лжи"democracy" and the old oligarchy, the people stormed the streets of Santiago under the banner of the Jorge "El jefe" González Von Marées and Valquismo, as the country knew what destiny it decided for itself."
CHL_centralize_peoples_will: "Централизация воли людей"
CHL_centralize_peoples_will_desc: "Слишком долго наши люди закрывали свои голоса властью олигархов, если мы централизуем государство в исполнительной роли, президент сможет ответить на нужды людей без вмешательства конгресса, хотя это может сделать старую элиту несчастной."
CHL_deal_with_oligarchs: "Разберись с олигархами"
CHL_deal_with_oligarchs_desc: "Для того чтобы продвинуться вперед в восстановлении нашей страны, мы сотрудничаем со всеми частями Чили как таковыми, нам необходимо заключить соглашения с элитой, которая будет приносить пользу как им, так и простым людям; только при условии сотрудничества наша республика может добиться успеха."
CHL_gaining_militarys_support: "Завоевание военной поддержки"
CHL_gaining_militarys_support_desc: "Сейчас, как никогда ранее, мы должны получить поддержку наших вооруженных сил для поддержания стабильности, армия служит нации, а не наоборот!"
CHL_ban_the_extremists: "Запрещение экстремистов"
CHL_ban_the_extremists_desc: "Несмотря на то, что мы до сих пор держали ситуацию в стороне, нелегко, когда экстремисты подстрекают народ к мятежу против демократического правопорядка, запрещают этих экстремистов и защищают демократию!"
CHL_the_new_republic: "Новая Республика"
CHL_the_new_republic_desc: "Наши реформы привели к созданию более справедливой, новой республики!"
CHL_invest_in_our_industry: "Инвестировать в нашу промышленность"
CHL_invest_in_our_industry_desc: "Наша экономика находится на нижнем этаже, а безработица на небе, давайте вернем наше внимание в Чили и индустриализации нашей экономики!"
CHL_closing_the_gap: "Устранение разрыва"
CHL_closing_the_gap_desc: "Мы находимся далеко от того места, где нам нужно быть, наша страна осталась в прошлом, пора закрыть разрыв и привести нашу страну в настоящее время."
CHL_reformed_trade_laws: "Реформированное торговое законодательство"
CHL_reformed_trade_laws_desc: "Наше древнее торговое законодательство сохранило то, чего мы не хотим, и то, что нам нужно, давайте реформируем наше законодательство и поддержим инвестиции в капитал и торговлю товарами, в которых нуждается наш народ."
CHL_paving_new_roads: "Прокладывание новых дорог"
CHL_paving_new_roads_desc: "Мы должны построить новые дороги по всей территории нашей страны и еще больше соединить нашу нацию."
CHL_a_firm_hand: "Твердая рука"
CHL_a_firm_hand_desc: "Наша страна слишком долго была неконтролируемой, и для стабилизации нам нужна твердая рука нашего генерала против диссидентов."
CHL_a_gentle_manner: "Нежная манера"
CHL_a_gentle_manner_desc: "Тем не менее, как бы диссиденты ни заслуживали исправления, так и те люди, которые ведут себя, заслуживают того, чтобы с ними обращались с уважением, которого они заслуживают, даже если не все хотят, чтобы мы передали им такую любезность."
CHL_general_of_hope: "Генерал надежды"
CHL_general_of_hope_desc: "В то время как многие не верили, что наша страна может стать лучше, генерал Ибаньес заставил их поверить, люди сейчас, как никогда ранее, чувствуют себя едиными в надежде при нашем генерале."
CHL_presidente_ibanez: "Президент Ибаньес"
CHL_presidente_ibanez_desc: "С любовью, заботой и силой Карлос Ибаньес дель Кампо взял народ под свое крыло и привел нас к успеху и нашей судьбе, больше, чем к генералу, он всегда будет известен как президент и как герой своей нации."
CHL_economy_for_the_people: "Экономика для народа"
CHL_economy_for_the_people_desc: "Чили слишком долго страдала от того, что экономика сосредоточилась только на ресурсах земли, а не на своих граждан, с реформами Ибаньеса это изменится!"
CHL_content_old_oligarchs: "Удовлетворение старых олигархов"
CHL_content_old_oligarchs_desc: "Как бы мы ни хотели от них не зависеть, каждый, под руководством нашего правительства, может быть полезен, может быть даже старая элита, если нам удастся довольствоваться ими, чтобы поддержать нас."
CHL_moderate_land_reform: "Умеренная земельная реформа"
CHL_moderate_land_reform_desc: "Значительная часть нашей страны является аграрной по своему характеру, и экономическая элита контролирует землю, которой лучше управлять государством и его гражданами, давайте сделаем земельную реформу, но не зайдя слишком далеко, чтобы расстроить экономических агентов."
CHL_patriotic_protectionism: "Патриотический протекционизм"
CHL_patriotic_protectionism_desc: "Многие инвесторы приезжают в Чили в поисках ресурсов и уезжают, не давая Чили того, чего она заслуживает, давайте защитим нашу страну более жесткими торговыми законами, чтобы сохранить наше богатство и прибыль."
CHL_unite_the_classes: "Объединить классы"
CHL_unite_the_classes_desc: "Слишком много людей пытались разделить нашу нацию, ставя несчастных против более благополучных, в то время как все они чилианы! Давайте объединим классы, так как мы все создаем одну великую нацию!"
CHL_embrace_the_chilean_race: "Присоединяйтесь к чилийской расе"
CHL_embrace_the_chilean_race_desc: "Как однажды сказал Николас Паласиос, наша нация рождается от множества воинов, и мы должны гордиться этим!"
CHL_glory_to_the_rotos: "Слава Ротосу"
CHL_glory_to_the_rotos_desc: "Завидно и обидно, что наши соседи назвали нас вращающимися, или"Broken Ones", we have embraces this denonym, and they will regret their intentions when the rotos go for them!"
CHL_work_for_the_chilean: "Работа на чилийского мужчину"
CHL_work_for_the_chilean_desc: "Наш народ слишком долго страдал от нищеты и безработицы, государство нуждается в национальной промышленности, которая будет поддерживать и вознаграждать хилианский народ."
CHL_new_national_industry: "Новая национальная промышленность"
CHL_new_national_industry_desc: "По мере того, как экономический бум прошлого ушел, мы должны найти новый подход к экономике, отрасли, в которой хилианские люди могут преуспеть."
CHL_militarized_nation: "Милитаризированная нация"
CHL_militarized_nation_desc: "Только после больших побед наш народ обрел успех, которого он заслуживает, военные традиции равны успеху, и милитаризованная нация - это то, что нам нужно!"
CHL_our_warrior_legacy: "Наследие нашего воина"
CHL_our_warrior_legacy_desc: "Наш народ голодает, наша экономика рухнула, наше правительство потерпело неудачу, но если Чили только победила, то она была на поле боя, мы должны принять, а не отвергнуть эту истину."
CHL_revitalized_nation: "Возрождение нации"
CHL_revitalized_nation_desc: "По мере того, как люди ходят в свои дни, они понимают, насколько велика наша нация, как наш Валькисмо дал им то, что им нужно и нашел движение, которое пропала страна, теперь каждый чилиец может наконец сказать, насколько велика их нация!"
CHL_our_natural_richness: "Наше естественное богатство"
CHL_our_natural_richness_desc: "Огромные ресурсы, которые мы можем найти на этой земле, мы должны усовершенствовать наши методы добычи, чтобы извлечь из них больше пользы."
CHL_compliment_our_economy: "Комплимент нашей экономики"
CHL_compliment_our_economy_desc: "Как богатые ресурсы, какими бы богатыми мы ни были в отделе минеральных ресурсов, мы не обладаем всем, чтобы поддерживать себя, давайте встроим новые методы синтеза в нашу экономику и покроем наши неудачи!"
CHL_from_arica_to_the_end_of_the_world: "От Арики до конца света"
CHL_from_arica_to_the_end_of_the_world_desc: "От далекого севера до глециара на юге, наша страна длинная и обширная, давайте развивать нашу инфраструктуру, чтобы лучше интегрировать ее."
CHL_chilean_industrial_expansion: "Чилийское промышленное развитие"
CHL_chilean_industrial_expansion_desc: "Наша экономика не может жить только на прибыли от ресурсов, мы должны развивать свою промышленность, чтобы поддерживать себя!"
CHL_develop_the_south: "Развивать Юг"
CHL_develop_the_south_desc: "Последняя часть нашей нации, населена, наши южные регионы - это красивые земли, полные надежд и потенциала, но не хватает людей и инвестиций, давайте поднимем эту зону как неотъемлемую часть нашего экономического развития."
CHL_develop_the_north: "Развивать Север"
CHL_develop_the_north_desc: "Хотя они не были в нашем распоряжении так долго, наши северные территории богаты культурой и ресурсами, и живой зоной, о которой мы так сильно не заботились, давайте сосредоточимся на развитии своего автономного потенциала как экономического региона нашей нации."
CHL_central_development_plan: "Центральный план развития"
CHL_central_development_plan_desc: "Наше демографическое, политическое и культурное сердце, центр нашей страны - это настолько чилийский, насколько это возможно, и мы не можем планировать экономическое развитие Чили без планирования фокуса на наших центральных сердец."
CHL_the_new_technologies: "Новые технологии"
CHL_the_new_technologies_desc: "Для модернизации нашей страны настало время разработать новые технологии, которые будут иметь большое значение для нашего общества."
CHL_funding_for_our_future: "Финансирование нашего будущего"
CHL_funding_for_our_future_desc: "Мы должны предоставить нашим интеллигенциям финансовые средства для дальнейшего совершенствования во всех областях нашей страны, будь то качество жизни или более агрессивное развитие."
CHL_preparing_for_the_worst: "Подготовка к худшему"
CHL_preparing_for_the_worst_desc: "В эти конфликтные и нестабильные времена мы должны приложить определенные усилия для подготовки к тому, что нас ждет в будущем."
CHL_chilean_mobilization: "Мобилизовать страну"
CHL_chilean_mobilization_desc: "Похоже, пришло время, давайте мобилизуем наши силы, граждан и индустрию на предстоящий хаос."
CHL_road_to_conflict: "&lt; &lt; Путь к конфликту &gt; &gt;"
CHL_road_to_conflict_desc: "Конфликт в воздухе, рано или поздно нашим армиям придется стоять и бороться за то, во что мы верим, и мы будем готовы."
CHL_funding_the_army: "Финансирование армии"
CHL_funding_the_army_desc: "Годы и годы экономического спада привели к тому, что в армейском бюджете и его оснащении не хватало времени для того, чтобы увеличить объем финансирования и восстановиться."
CHL_revamping_our_weapons: "Возвращение нашего оружия"
CHL_revamping_our_weapons_desc: "Наш старый запас стал бесполезным, мы больше всего модернизируем нашу армию, начиная с ее оружия."
CHL_artillery_effort: "Артиллерийская деятельность"
CHL_artillery_effort_desc: "Далее, давайте модернизируем нашу артиллерию для предстоящей битвы!"
CHL_motorized_push: "Моторизованный толчок"
CHL_motorized_push_desc: "Каварли не сработает, давайте полностью моторизуем нашу армию и отдадим наши жизни на колеса!"
CHL_specialized_brigades: "Специализированные бригады"
CHL_specialized_brigades_desc: "Не все люди будут брать на себя ответственность за борьбу, другие способы сражения тоже верны, давайте приготовимся к любой среде, в которой мы должны сражаться!"
CHL_mastering_our_mountains: "Освоить наши горы"
CHL_mastering_our_mountains_desc: "Мы живем в стране могущественных гор, которая защищает нас от наших врагов, давайте станем хозяевами в борьбе за них, так что мы доминируем в любой борьбе на чилианской земле."
CHL_mechanized_advance: "Механизированный аванс"
CHL_mechanized_advance_desc: "Новая механизация наших сил - это то, что нам нужно для победы в любом пристанище."
CHL_experimental_rocketry: "Экспериментальная скалистость"
CHL_experimental_rocketry_desc: "Оружие нового оружия мощное и впечатляющее, может быть, его раскопки будут полезны в этом конфликтном будущем."
CHL_fortress_the_andes: "Щедрость Анд"
CHL_fortress_the_andes_desc: "Давайте положим крепости вдоль путей и путей вокруг гор, чтобы никто не мог обойти нашу природную крепость"
CHL_kriegs_unt_cazuelas: "Kriegs Unt Cazuelas"
CHL_kriegs_unt_cazuelas_desc: "Поскольку времена Пруссии показали военную мощь нашей нации, давайте никогда не забудем нашу дисциплину и традиции и будем чтить ее имя."
CHL_may_god_forgive_us: "Да простит нас Бог"
CHL_may_god_forgive_us_desc: "Когда битва закончится, и дым будет свободен, единственный, кто нас осудит, будет сам Бог."
CHL_extending_our_coasts: "Протяжение наших берегов"
CHL_extending_our_coasts_desc: "Наше побережье длинное и заполненное пятнами, которые наши враги могут использовать в своих интересах, давайте продлим наше господство на побережье новыми крепостями, чтобы защитить от вторжения."
CHL_expanding_the_shipyards: "Расширение наших верфей"
CHL_expanding_the_shipyards_desc: "Большое море требует много кораблей, давайте построим новые верфи для удовлетворения наших потребностей в военно-морском флоте."
CHL_pacific_strategy: "Тихоокеанская стратегия"
CHL_pacific_strategy_desc: "Есть много способов доминировать в морях, мы должны выбрать стратегию, показывающую мир своим хозяевам!"
CHL_the_battleships: "Боевые корабли"
CHL_the_battleships_desc: "Основная часть нашего флота, не сосредоточившись на кораблях, мы не будем контролировать воды."
CHL_the_carriers: "Перевозчики"
CHL_the_carriers_desc: "Хотя мы молоды в море, нам ясно, что будущее морской войны - это носители!"
CHL_the_cruisers: "Крузеры"
CHL_the_cruisers_desc: "Старые и надежные крейсеры будут нужны, когда приливы станут красными."
CHL_the_destroyers: "Разрушители"
CHL_the_destroyers_desc: "Ни один громоздкий корабль не является проблемой для быстрых разрушителей, давайте сосредоточимся на том, чтобы наполнить наш флот ими!"
CHL_the_submarines: "Подводные лодки"
CHL_the_submarines_desc: "Как бы сильно ни было трудно ожидать, подводные лодки являются необходимым дополнением к нашим военно-морским отрядам."
CHL_pacific_domination: "Доминирование в Тихоокеанском регионе"
CHL_pacific_domination_desc: "Мир - это наш дом и наша территория, никто не сможет противодействовать нашему правлению!"
CHL_high_above_the_andes: "Высоко над Андами"
CHL_high_above_the_andes_desc: "Чили - это не только наши высокие горы или наши прекрасные моря, мы должны контролировать небо и над ним!"
CHL_soaring_over_all: "Вдохновляя всех"
CHL_soaring_over_all_desc: "Чтобы расширить наше владычество в небеса, мы должны строить базы на земле, чтобы взлететь с неба."
CHL_protecting_our_skies: "Защищать наши небеса"
CHL_protecting_our_skies_desc: "Мы ни перед чем не остановимся, чтобы защитить Чили, каждый кусочек, даже если нам придется сбить каждую птицу в небе."
CHL_support_push: "Воздушный транспорт"
CHL_support_push_desc: "То, что выиграно на небе, не решает исход на суше, если только мы не используем его в своих интересах."
CHL_strategic_winds: "Стратегические ветры"
CHL_strategic_winds_desc: "Война - это не случайный хаос, это стратегия и тактика, так же, наши бомбардировщики должны быть готовы взять на себя любую стратегическую цель, которую мы решим."
CHL_bombing_the_bandits: "Бомбардировка бандитов"
CHL_bombing_the_bandits_desc: "Иногда, чтобы защитить море, мы должны вернуться к небу за помощью."
CHL_fighters_for_the_fatherland: "Боевики за Родину"
CHL_fighters_for_the_fatherland_desc: "Так же, как некоторые люди рождаются на суше, некоторые находят также сражения, чтобы сражаться, но в небе."
CHL_masters_of_the_airs: "Повелители Воздуха"
CHL_masters_of_the_airs_desc: "Мы пришли, чтобы контролировать небо над нами, каждую его грань, может, нам тоже стоит показать нашим соседям, что мы умеем управлять воздухом."
CHL_diplomatic_path: "Дипломатический путь"
CHL_diplomatic_path_desc: "В грядущем хаосе наша нация должна будет защитить себя и найти союзников, давайте направим наши усилия на дипломатию, чтобы спасти нашу страну от трагедии конфликта."
CHL_irredentist_path: "Непонятный путь"
CHL_irredentist_path_desc: "Слишком долго наша нация стояла в тени той славы, которую она заслуживает, наконец пришло время показать миру, из чего мы сделаны, и что мы будем бороться за то, что заслуживаем."
CHL_reclaim_tacna: "Повторить Такну"
CHL_reclaim_tacna_desc: "Наша нация выиграла Такну после Тихоокеанской войны, где многие героические хилианские люди отдали за это свои жизни, и для Чили, однако, наш старый режим предал нас и отдал его Перу в Лимском договоре несколько лет назад, давайте исправим то, что старая республика обидела, и вернем наше заслуженное владение."
CHL_retake_tacna: "Возвращение Такны"
CHL_retake_tacna_desc: "Время пришло, давай вернемся в Лиму и возьмем то, что по праву принадлежит нам!"
CHL_reclaim_the_patagonia: "Возобновить Патагонию"
CHL_reclaim_the_patagonia_desc: "С момента рождения нашей нации мы знаем, что Патагония принадлежит нам, поскольку наша судьба состоит в том, чтобы заселить ее обширные равнины, однако, грязные аргентинцы украли нашу заявленную землю, когда мы были заняты войной десятилетия назад, давайте вернем то, что было насильственно украдено."
CHL_retake_the_patagonia: "Возвращение к Патагонии"
CHL_retake_the_patagonia_desc: "Хватит ждать, давайте возьмем это подходящее время хаоса и конфликта, чтобы напасть на Аргентину и забрать то, что было сделано для нас, всю Патагонию!"
CHL_claim_the_empire: "Предъяви империю"
CHL_claim_the_empire_desc: "Наша нация сидела без дела слишком долго, пока европейские державы приходили и оказывали влияние на Чили и Южную Америку, несмотря на то, что мы проснулись, британцы все еще контролируют мирные острова; острова, которые лучше поместились бы под чилией, Британская империя не делает так хорошо, давайте заберем свои мирные владения для себя!"
CHL_strike_the_empire_desc: "Британская империя находится в слабом положении, сейчас пришло время Чили сделать шаг вперед и захватить то, что мы заслуживаем и имеем, контроль над миром, давайте захватим Тихие острова Империи!"
CHL_strike_the_empire: "Ударь Империю"
CHL_elections_forty: "Выборы 1940 года"
CHL_elections_forty_desc: ""
CHL_president_rios: "Президент Риос"
CHL_president_rios_desc: "Хуан Антонио Риос, кандидат от радикальной партии, победил на выборах, обещая провести реформы, которые давно были обещаны нашей стране, и действовать непосредственно в качестве преемника наследия Монтеро, он будет внедрять новую модель."
CHL_radical_industry: "Радикальные промышленные инвестиции"
CHL_radical_industry_desc: "Наша страна может выжить только за счет ресурсов, давайте сосредоточим нашу экономическую модель на государственных расходах как способе создания новой промышленной экспансии."
CHL_sharing_is_caring: "Обмен - это забота."
CHL_sharing_is_caring_desc: "Разделение - Забота, и по сей день бедные и несчастные бродят по улицам, мы не можем позволить этим бедным душам страдать больше, давайте создадим сеть социального обеспечения, которая поможет менее удачливым в нашем обществе."
CHL_president_cruz-coke: "Президент Круз-Кок"
CHL_president_cruz-coke_desc: "Эдуардо Крус-Кок-Лассабе, кандидат Консервадора Партидо, выиграл выборы, его христианские ценности и социальный подход к реформам в области здравоохранения оказали ему поддержку со стороны населения."
CHL_responsible_investments: "Ответственные инвестиции"
CHL_responsible_investments_desc: "Правительство должно играть вспомогательную роль в нашей экономике, подталкивая и защищая ее, но осторожно не вмешивайся слишком сильно, что бы помешать ей и разрушить наш бюджет."
CHL_balanced_budget: "Сбалансированный бюджет"
CHL_balanced_budget_desc: "Кризис привел нашу страну к банкротству несколько раз, давайте сбалансируем национальный бюджет, так что нам не придется проходить через крах из-за будущих трудностей."
CHL_president_ross: "Президент Росс"
CHL_president_ross_desc: "Густаво Росс, кандидат Либеральной партии, известный экономист и защитник свободного рынка, выиграл выборы, его меры жесткой экономии и либеральные экономические идеи, похоже, получили поддержку среди нашего населения."
CHL_seek_foreign_capital: "Поиск иностранного капитала"
CHL_seek_foreign_capital_desc: "Нашему правительству пришлось слишком долго субсидировать нашу индустрию, давайте поставим Чили на передний план, выбирая иностранных инвесторов, заинтересованных в взаимовыгодном соглашении."
CHL_develop_our_resources: "Развивать наши ресурсы"
CHL_develop_our_resources_desc: "Наша нация слишком долго отвлекалась из-за наших неудач, чтобы понять, что сокровище под нашими ногами, давайте эксплуатировать минеральное состояние под нашей землей!"
CHL_president_grove: "Президент Гроув"
CHL_president_grove_desc: "Мармадуке Гроув, кандидат радикальной социалистической партии, бывший военный и печально известный демократический социалистический деятель, был избран, в то время как некоторые считают свои предложения слишком марксистскими по своей природе, он, похоже, искренне хочет править демократическим путем."
CHL_improve_social_situation: "Улучшение социального положения"
CHL_improve_social_situation_desc: "На протяжении десятилетий социальная проблема занимала видное место в нашем обществе, давайте вкладывать средства в улучшение условий жизни и инфраструктуры для тщеславных работников, с тем чтобы каждый мог гордиться нашей нацией."
CHL_new_agrarian_reform: "Новая аграрная реформа"
CHL_new_agrarian_reform_desc: "Большая часть нашей страны все еще аграрна, даже если она быстро сокращается из-за урбанизации, давайте реформируем земли, чтобы улучшить наше производство продовольствия и жизнь нашей сельской местности, которая является большой частью низшего класса нашей страны."
CHL_academics_for_progress: "Академические круги для прогресса"
CHL_academics_for_progress_desc: "Пора продвигать нашу страну вперед, давайте сосредоточимся на инвестициях в научные круги, чтобы разрабатывать и адаптировать новейшие технологии для себя."
CHL_denounce_socialism: "Провозглашение социализма"
CHL_denounce_socialism_desc: "Экстремальные формы социализма угрожают Южной Америке и нашей нации, может быть, было бы хорошей идеей осудить идеологию, чтобы мир знал, где мы находимся."
CHL_intervene_in_bolivia: "Вмешательство в Боливию"
CHL_intervene_in_bolivia: "Революционный социализм в его самой крайней форме имеет место в Боливии, это очень опасно для нашей страны, если мы не предпочтем сейчас вмешаться и освободить Боливию от этой чумы."
CHL_intervene_in_argentina: "Вмешательство в Аргентину"
CHL_intervene_in_argentina_desc: "Аргентина поддалась чуме социализма, и наша нация будет захвачена в своем идеологическом крестовом походе, если мы не воспользуемся случаем и не остановим их прежде, чем они смогут это сделать."
CHL_friends_with_democracy: "Друзья демократии"
CHL_friends_with_democracy_desc: "В этом конфликтном мире мы не можем оставаться в одиночестве, демократии должны поддерживать друг друга, давайте быть дружелюбными с другими демократическими режимами."
CHL_standing_up_for_democracy: "&lt; &lt; За демократию &gt; &gt;"
CHL_standing_up_for_democracy_desc: "Хотя никто еще не решил выступить в защиту демократии, мы должны возглавить демократию Южной Америки, поскольку предстоящий конфликт, несомненно, решит судьбу всех нас."
CHL_unlikely_friends: "В отличие от друзей"
CHL_unlikely_friends_desc: "Две войны и многие соперники, перувианцы редко были дружелюбны к нам, но в эти критические времена, сейчас, как никогда, любой друг приветствуется, давайте пригласим их в наш союз за защиту демократии."
CHL_highlands_allies: "Великие союзники"
CHL_highlands_allies_desc: "Будучи другом Чили, когда нас окружают враги со всех сторон, Эквадор является примером демократии с высоты над Андами, для ее защиты потребуется их помощь. Давайте пригласим их в наш союз."
CHL_friends_with_authority: "Друзья с властью"
CHL_friends_with_authority_desc: "Либеральные демократии ввели многие страны в хаос, чтобы быть сильными, мы должны подавать пример и иметь дело только с другими авторитарными режимами, которые понимают, как правильно управлять собой."
CHL_standing_up_strong: "Стоять на ногах"
CHL_standing_up_strong_desc: "Время кризиса приближается к Южной Америке, и, как и ожидалось, мы будем оставаться сильными и непримиримыми по мере того, как вспыхнет конфликт, и направлять тех, кто желает, в будущее Южной Америки."
CHL_viceroyalty_ties: "Тайс вице-королевства"
CHL_viceroyalty_ties_desc: "Хотя у нас не было лучших отношений за эти годы, мы не можем отрицать, что мы добрые братья, родившиеся от одного и того же вице-короля. Давайте договоримся с Перу, поскольку наши режимы понимают правильный способ управления своими нациями."
CHL_friends_beyond_the_andes: "Друг за Андами"
CHL_friends_beyond_the_andes_desc: "Хотя с другой стороны Южной Америки, мы не можем отрицать, что Венесуэла имеет сходство с нами, особенно в это время идеологических экстремистов, угрожающих нациям, пакт может быть взаимовыгодным для всех вовлеченных сторон."


