 CHL_marmaduke_grove_vallejo: "Мармадуке Гроув Вальехо"
 #CHL_marmaduke_grove_vallejo_leader_desc: "Гроув родился в северном городе Копиапо 6 июля 1878 года, а Хосе Мармадуке Гроув Абалос, адвокат, и Ана Вальехо Бургоа. В 1891 году его отец был изгнан из-за оппозиции президенту Хосе Мануэлю Бальмаседе. Несмотря на то, что он ранее выступал против правящей власти, он вступил в Чилийскую военно-морскую академию в 1892 году. Вскоре после этого Ибаньес был выведен из строя, когда бóльшая часть армии и флота угналась, что позволило Гроуву вернуться в Чили и провозгласить Социалистическую Республику. Его недавнее отстранение от должности Председателя является четким свидетельством того, что как военные, так и гражданские власти Чили рассматривают конфликт с Аргентиной почти неизбежно после многих лет поддержки патагонских мятежников."

