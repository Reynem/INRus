 NEP_tribhuvan: "Трибхуван"
 NEP_tribhuvan_leader_desc: "Король Трибхуван поднялся на трон Непала всего лишь в пять лет. Трибхуван, однако, родился королем только по имени, на самом деле, мальчик-король был не чем иным, как символом могущественной семьи Рана. По мере того, как он вырос в мужчину, непальская политика все больше определяется антагонистическими отношениями между королем и Ранасом. Только время покажет победителя борьбы как в политическом, так и в экономическом плане."

