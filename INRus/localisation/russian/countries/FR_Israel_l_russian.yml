 ISR_sectarian_divide: "Разделение секторов"
 ISR_sectarian_divide_desc: "Еврейский Защитник - это явно еврейское государство, где все, кто руководит делами государства, голосует и занимает административные должности, являются евреями."
 ISR_balfour_declaration: "Заявление Балфура"
 ISR_balfour_declaration_desc: "Декларация Балфура объявила о поддержке Великобританией создания еврейского государства в Палестине, и это стало реальностью. &lt; &lt; Массовая миграция &gt; &gt; из всего мира, из России в Соединенные Штаты окружила Палестину, а арабы вскоре станут меньшинством на своей родине, если нынешние темпы миграции сохранятся &gt; &gt; ."
 ISR_desert_batrol: "Патруль пустыни Глубба"
 ISR_desert_batrol_desc: "Идиоту Глуббу дали командование силой бедуинов, чтобы умиротворять племена, только для того, чтобы стать индейцем и вести войну против еврейских автохирургов с низкой интенсивностью. &lt; &lt; Патруль пустыни &gt; &gt; проводит сейчас свое время, проводя рейды против властей, и по мере того, как его число начинает расти по мере того, как все больше арабов присоединяются к силам и британские офицеры переходят к силам, власти опасаются, что это может привести к полномасштабному восстанию."

 ISR_conflict_in_palestine: "Конфликт в Палестине"
 ISR_conflict_in_palestine_desc: "Меры по контролю за миграцией в Палестину, направленные на сохранение стабильности на территории и предотвращение новых беспорядков среди арабского населения, впечатляют еврейских экстремистских организаций, таких, как Игрун и Лехи, которые взяли на вооружение оружие против британских властей."
