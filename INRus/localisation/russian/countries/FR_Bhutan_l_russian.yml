 ### Parties ###

 BHU_vanguardist_party: "КНС"
 BHU_vanguardist_party_long: "Друкский национальный конгресс (Максимисты)"
 BHU_collectivist_party: "КНС"
 BHU_collectivist_party_long: "Друкский национальный конгресс (международники)"
 BHU_libertarian_socialist_party: "КНС"
 BHU_libertarian_socialist_party_long: "Национальный конгресс друка (революционеры)"
 BHU_social_democrat_party: "БСК"
 BHU_social_democrat_party_long: "Конгресс Бутана (демократы) - это движение, пытающееся создать в южных районах Бутана политическое пробуждение Лхотшампы. Они не добились большого успеха в своих начинаниях, поскольку угнетенное непальское меньшинство остается скептически настроенным на этих политических идеалистов, а правящие власти быстро разрушают инакомыслие."
 BHU_social_liberal_party: "Джай Горка"
 BHU_social_liberal_party_long: "Джай Горкхайнн Фоундан в индийских штатах, граничащих с южной частью Бутана, Джай Горкха — это подпольное политическое движение, направленное на создание нового государства для Непала под названием Горкхаленд. Эта группа нашла многих в непальской общине Бутана Лхотшампа, которые заинтересованы в этом проекте государственного строительства, и она стала ведущим голосом для этого угнетенного меньшинства."
 BHU_market_liberal_party: "Радикалы"
 BHU_market_liberal_party_long: "Друк Гьялпо (радикалы) - это небольшая группа судебных чиновников, которые стремятся к проведению более демократических реформ в Бутане. Хотя они разделяют цели с реформистской фракцией в суде, они считают, что реформы, предлагаемые этой фракцией, слишком ограничены и часто недовольны доминирующим положением Сонама Топги Дорджи в этой фракции."
 BHU_social_conservative_party: "БСК"
 BHU_social_conservative_party_long: "Конгресс Бутана (Пеасан) - это движение, пытающееся создать в южных районах Бутана политическое пробуждение Лхотшампы. Они не добились большого успеха в своих начинаниях, поскольку угнетенное непальское меньшинство по-прежнему скептически относится к этим политическим идеалистам, а правящие власти быстро борются с инакомыслием."
 BHU_authoritarian_democrat_party: "Реформисты"
 BHU_authoritarian_democrat_party_long: "Друк Гьялпо (Реформеры) - это коллекция дворян и судебных чиновников, которые выступают за серию реформ, направленных на модернизацию Королевства Бутан. Хотя они очень преданы королю, они надеются передать некоторые полномочия от аристократии к деревенским старейшинам Гевога, сохраняя при этом власть центральной монархии. Их власть сосредоточена вокруг королевского министра Гонгзима Сонама Топги Дорджи."
 BHU_paternal_autocrat_party: "Традиционалисты"
 BHU_paternal_autocrat_party_long: "Традиционалисты представляют собой обширную коллекцию пенлопов, мелких дворян, должностных лиц и военных лидеров, преданных королю и преданных сохранению статус-кво. Они поддерживают правящую Друк Гьялпо, но стремятся прежде всего расширить власть Пенлопов за счет центральных властей. Традиционисты решительно выступают против реформ, предложенных Сонамом Топгие Дорджи и его кликой лоялистов, считая их прямым оскорблением феодализма в Бутане."
 BHU_national_populist_party: "Чжун Дратшанг"
 BHU_national_populist_party_long: "Чжун Дратшанг - это совет монахов со всей страны, объединенных в целях продвижения монашеских интересов, возглавляемых пятью известными мастерами, Лопенами, каждым из которых является эксперт в различных теологических областях, и их лидером Дже Кенпо, правившим страной в дни до центральной монархии, даже в годы, последовавшие за этим телом, долго служило для советов правителям Бутана, содействуя стабильности и традиционному буддизму."
 BHU_valkist_party: "Чжун Дратшан (А)"
 BHU_valkist_party_long: "Чжун Дратшанг (Esoteric буддисты) — совет монахов со всей страны, объединяющийся в целях продвижения монашеских интересов, возглавляемый пятью учёными мастерами, Lopens, каждый эксперт в различных теологических областях, и их лидером Je Khenpo, правившим страной в дни до центральной монархии, даже в годы, последовавшие за этим телом, долго служило совету правителей Бутана, содействуя стабильности и традиционному буддизму. §!"



 ### Characters ###
 BHU_jigme_wangchuck: "Джигм"
 # BHU_jigme_wangchuck_leader_desc: "В возрасте 21 года Друк Гьялпо Джигме Вангчук быстро оказался способным, хотя и неинтересным лидером на переговорах о месте Бутана в мире после нестабильности как в соседнем Тибете, так и в Радже, Джигме смог сохранить статус-кво в своем горном королевстве, хотя многие приписывали эти успехи его Гонгзиму и союзнику Сонаму Топги Дорджи."

 BHU_jigme_dorji_wangchuck: "Джигме Дорджи"
 #BHU_jigme_dorji_wangchuck_leader_desc: "Старший сын покойного короля Джигме, молодой Джигме Дорджи, не имеет никакой власти, кроме его фамилии, но его образование вывело его за пределы горного королевства и начало давать ему знания о внешнем мире и желание реформ в его собственном царстве. Хотя в настоящее время королевство управляется его регентом Сонамом Топгие Дорджи, нет никаких сомнений в том, что король Джигме Дорджи имеет большие планы для нации после его вознесения."

 BHU_jigme_dorji_wangchuck_old: "Джигме Дорджи"
 #BHU_jigme_dorji_wangchuck_adult_leader_desc: "Полноценно захватив власть над нацией, молодой король Джигме Дорджи продолжает полагаться на совет своего Гонгзима Сонама Топги Дорджи. Однако Джигме Дорджи не марионетка, он стремится полностью реформировать горное королевство по примеру современной западной нации. Пока не видно, добьются ли эти реформы успеха, но никто не ставит под сомнение убежденность Джигме Дорджи в улучшении своего королевства и народа."

 BHU_zhabdrung: "Жабдрунг Ринпош"
 # BHU_zhabdrung_leader_desc: "Жабдрунг Ринпоче Джигме Дорджи — это фигура, запутанная в загадках. Некоторые говорят, что он не лучше бандита, у которого мало нравственных качеств и никаких сомнений относительно применения насилия для достижения своих собственных целей. Другие указывают на его преданность буддизму, хотя несколько его незаконных жен вступают в конфликт с этими утверждениями. Только одно совершенно ясно о молодом религиозном лидере, он действительно рассматривает себя как реинкарнацию великого Нгаванг Намгиала и желает больше всего вернуть древнюю власть и славу Бутана."

 BHU_tshering_penjor: "Пеньор"
 # BHU_tshering_penjor_leader_desc: "Жестокий и жестокий человек, мало кто сомневается в эффективности Тшеринга Пенджора как Друк Гьялпо, он человек противоречий, быстро смеется, но быстрее гневается, носит множество наложниц, но не жен. Никто не знает наверняка, почему Паро Пенлоп захватил трон после смерти своего правителя, ощущал ли он потребность в руководстве Бутаном как твердым и сильным правителем, или просто хотел получить титул, обещанный ему более десяти лет назад."

