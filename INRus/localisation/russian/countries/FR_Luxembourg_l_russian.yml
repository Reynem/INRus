 #####Events#####

 LUX_army_effort: "Люксембургская армия"
 LUX_army_effort_desc: "Великая война, начиная с ее начала и заканчивая ее окончанием, навсегда изменила войну, окончательно прекратив хватку Наполеона за военные мысли и подтвердив крайние сроки применения винтовки, пулемётов и артиллерийских пушек."
 LUX_equipment_effort: "Модернизация оборудования"
 LUX_equipment_effort_desc: "В течение долгого времени военные прорывы были медленными, и было достаточно хорошей болтовни, однако эти винтовки XIX века совершенно не на месте на поле боя после Великой войны, мы должны перестать быть самоуспокоенными и получить новое снаряжение."
 LUX_motorization_effort: "Армия Моторизация"
 LUX_motorization_effort_desc: "Грузовик стал не просто транспортным средством и быстро интегрирован в мобильную военную тактику, мы должны избавиться от устаревшего мышления и использовать моторизацию, чтобы ускорить наши наступательные действия и подкрепление."
 LUX_doctrine_effort: "Изучение великой войны"
 LUX_doctrine_effort_desc: "Мы знаем о Великой войне, но чему мы научились из нее? За пять лет конфликта бесчисленное количество солдат погибло, чтобы научить нас новой динамике войны. Если мы не узнаем о них, то наши солдаты столкнутся с той же судьбой на поле боя."
 LUX_equipment_effort_2: "Исследования оборудования"
 LUX_equipment_effort_2_desc: "Возможно, мы догнали современное оборудование, но новые дизайны уже делают наши устаревшие, несмотря на то, что мы должны быть терпеливыми и быть уверенными, что мы никогда не останемся на один год в оборудовании, это означает, что нам придется начать разработку своих собственных дизайнов."
 LUX_mechanization_effort: "Механизированная военная служба"
 LUX_mechanization_effort_desc: "Грузовики плохо проехали на переднем фронте, но теперь, похоже, мы можем встретиться на полпути между грузовиками и танками, бронетранспортеры могут привести войска непосредственно в бою, защитить их от огня и даже обеспечить мощную огненную поддержку, если потребуется."
 LUX_doctrine_effort_2: "Военные учения"
 LUX_doctrine_effort_2_desc: "Войны - это нечто большее, чем просто мирное развлечение для генералов, они позволяют нам испытывать как истинную, так и испытанную и революционную тактику, не теряя бесчисленное количество жизней. Это позволяет нам завершить наши теоретические открытия."
 LUX_doctrine_effort_3: "Военные игры"
 LUX_doctrine_effort_3_desc: "Принимая «презентативные» битвы, мы можем имитировать военные сценарии, не будучи в состоянии воевать. Это позволит нашим офицерам дышать свежим воздухом с точки зрения военной тактики."
 LUX_equipment_effort_3: "Проскоки оборудования"
 LUX_equipment_effort_3_desc: "Мы пришли к такому опыту в области технических исследований, что мы больше не ограничимся наймом или покупкой иностранного оборудования для получения современного военного снаряжения, даже великие силы могут вскоре быть удивлены тем, что скоро будет в руках наших солдат."
 LUX_armor_effort: "Бронированные боевые действия"
 LUX_armor_effort_desc: "Танки - это вершина современной войны. Мобильные машины, вооруженные пушками, достойными артиллерии и непроницаемыми для средней винтовки. Даже если мы произведем мало, мы продырявим наших врагов разумным использованием этих стальных бемотов."
 LUX_special_forces: "Специальные силы"
 LUX_special_forces_desc: "Специальные силы — это больше, чем элитные отряды старой армии, даже новобранец может держать себя на поле боя, но некоторые ситуации настолько враждебны, что им нужны специально обученные люди, горные хребты, амфибийные посадки, воздушные нападения."
 LUX_soldier_effort: "Приоритизировать солдата"
 LUX_soldier_effort_desc: "Солдат является ядром любой армии, и вполне естественно, что мы сосредоточимся на них, а не на офицерах."
 LUX_officer_effort: "Приоритизировать сотрудника"
 LUX_officer_effort_desc: "Есть люди, которые следуют, и есть люди, которые ведут. Когда человеку некому следовать, что он будет делать? Он сам должен будет поднять мантию, пытаясь возглавить, несмотря на то, что он не знает, как это сделать."
 LUX_arms_imports: "Импорт оружия"
 LUX_arms_imports_desc: "Очевидно, что нам понадобится помощь в оснащении нашей армии, и, возможно, нам следует импортировать партию оружия у одной из крупнейших держав?"
 LUX_recruitment: "Славьте солдата"
 LUX_recruitment_desc: "Одна из главных причин, по которой люди отходят от армии, заключается в том, что они видят слишком много боли ради слишком малой выгоды."
 LUX_reform_officer_corps: "Реформировать наш офицерский корпус"
 LUX_reform_officer_corps_desc: "В эти быстро меняющиеся времена войны мы должны обеспечить, чтобы наш офицерский корпус был полностью обновлен."
 LUX_reform_supply_lines: "Современные линии снабжения"
 LUX_reform_supply_lines_desc: "Эпоха лошадиных линий снабжения - это не больше. Мы должны обеспечить, чтобы мы использовали каждый край, который мы можем получить в снабжении транспортом. Мы будем использовать грузовики и самолеты, что угодно, пока они более эффективны, чем наша нынешняя система."
 LUX_national_training_school: "Национальная школа профессиональной подготовки"
 LUX_national_training_school_desc: "Создавая национальную школу профессиональной подготовки, мы можем обеспечить, чтобы новые офицеры получали высшее образование."
 LUX_mil_industrial_complex: "Военно-промышленный комплекс"
 LUX_mil_industrial_complex_desc: "Согласно всем известным законам авиации, пчела не должна летать, ее крылья слишком малы, чтобы убрать ее жирное маленькое тело с земли. Пчела, конечно же, летает, потому что пчелам плевать, что люди считают невозможным."

 LUX_aviation_effort: "Небо Ближнего Востока"
 LUX_aviation_effort_tt: "Недостаточно площадок для базы §YAir!"
 LUX_aviation_effort_desc: "Поле авиации родилось почти во время Великой войны, даже спустя два десятилетия после этой войны, оно все еще новое, и все страны стремятся быть готовыми к следующему времени, когда их самолеты могут быть призваны к войне. Мы тоже должны найти прочные военно-воздушные силы для их организации."
 LUX_fighter_focus: "Воздушная высота"
 LUX_fighter_focus_desc: "По мере того, как самолеты становятся более быстрыми, более бронированными и вооруженными, мы должны приложить все усилия, чтобы обеспечить контроль над воздухом."
 LUX_bomber_focus: "Стратегическая бомбардировка"
 LUX_bomber_focus_desc: "Даже когда они были совершенно новыми, бомбардировщики вдохновляли их на страх, и многие видели их потенциал. По мере увеличения полезной нагрузки даже артиллерийские снаряды Великой войны не поддаются сопоставлению. Когда-нибудь мы сможем даже превзойти их и уничтожить целые города или регионы за один раз."
 LUX_aviation_effort_2: "Современная атмосферная тактика"
 LUX_aviation_effort_2_desc: "Самолёты уже давно перестали быть лишь инструментом разведки и преследования, полностью включив их в наши военные операции, военно-воздушные силы способны нанести столь же большой ущерб и продвигать наши операции так же, как и средневековое командование армии."
 LUX_CAS_effort: "Поддержка при закрытых воздушных перевозках"
 LUX_CAS_effort_desc: "В то время как истребители и бомбардировщики могут косвенно повлиять на битву, специализированные самолеты КАС имеют как боеспособность, так и вооружение, необходимые для совершения ударов снарядами и бомбардировок по наземным целям, причиняя серьезный ущерб неподготовленным армиям при достойном ведении боевых действий с воздуха."
 LUX_rocket_effort: "Экспериментальная скалистость"
 LUX_rocket_effort_desc: "Ракетное поле, возможно, является одной из самых новых областей военной науки. Если верить нашим ученым, то ракетные двигатели могут достичь скоростей, которые позорят радиальные двигатели. Некоторые говорят, что они могут двигаться даже быстрее звука, конечно, чрезвычайно захватывающе."
 LUX_NAV_effort: "Морская авиация"
 LUX_NAV_effort_desc: "Возможно, один из крупных прорывов в военно-морской войне, военные бомбардировщики могут уничтожать вражеские флоты торпедами и другими специализированными военно-морскими грузами, такими, как мины. Поддерживая наши флоты, они могут бросать вызов капиталистическим кораблям и разрушать военно-морские экраны."

 LUX_naval_effort: "Создание военно-морского флота"
 LUX_naval_effort_tt: "Недостаточно площадок для CNYNAval Dockyrds §!"
 LUX_naval_effort_desc: "Если мы хотим создать сильный флот, нам нужно сначала произвести его. Методы судостроения эволюционировали, и старые сухие доки должны быть модернизированы так же сильно, как новые верфь должны быть построены с нуля. Современный корабль не когт, и мы должны видеть большой, чтобы иметь морской флот."
 LUX_flexible_navy: "Гибкая тактика"
 LUX_flexible_navy_desc: "У нас никогда не будет мореплаваний мировых держав, способных очистить все моря от оппозиции, но это не значит, что наш флот будет прятаться в порту."
 LUX_large_navy: "Проекция мощности"
 LUX_large_navy_desc: "Наш флот, возможно, еще не в состоянии соперничать с большими моряками этого мира, но умело выбирая наши бои и сохраняя сосредоточенность флота, мы можем убедиться, что любая конфронтация в наших интересах, сохраняя при этом мощный флот, который может прорваться слабее мореплавателей."
 LUX_submarine_effort: "Подводные бои"
 LUX_submarine_effort_desc: "Подводные боевые действия - это самое волнующее военно-морское развитие со времени изобретения торпедного судна, и это бросает вызов даже самым классическим доктринам морской войны."
 LUX_cruiser_effort: "Скриншотные суда"
 LUX_cruiser_effort_desc: "Крузеры - это не просто "дешевые боевые корабли", и такие устаревшие мысли подрывают потенциал этих кораблей. Мы должны использовать их как сопровождение наших столиц, поскольку они очень уязвимы для морских бомбардировщиков и небольших кораблей, как торпедные лодки."
 LUX_destroyer_effort: "Антиподводные бои"
 LUX_destroyer_effort_desc: "Изучая проектирование и стратегическое использование подводных лодок, мы также учимся бороться с ними. &lt; &lt; Нашим разрушителям &gt; &gt; потребуется специализированное оборудование, такое, как глубинные заряды и специальные конструкции, как легкие, так и малые, для обеспечения того, чтобы они могли эффективно сопровождать конвои и патрулировать."
 LUX_capital_ships_effort: "Капитальные суда"
 LUX_capital_ships_effort_desc: "Привет Снид, твой друг Чак познакомил меня с тобой, потому что он хочет пожелать тебе очень счастливого дня рождения от него и от меня, и ты работаешь, управляя сельскохозяйственным магазином, и я боюсь, что эта пандемия просто ужасна для людей, делающих свое собственное дело, для малого бизнеса, для мелких предпринимателей. Это было огромное, чудесное время для Амазонки и всех больших парней, и для всех остальных это было очень, очень тяжело и очень тяжело. Я даже не уверен, что это так называемое консервативное правительство понимает это или получает это, так много в карманах большого бизнеса и больших банков - просто посмотри, что Дэвид Кэмерон задумал."

 LUX_industrial_effort: "Промышленное производство в Люксембурге"
 LUX_industrial_effort_desc: "Для создания крупной промышленной базы нам нужно будет создать основы современной промышленности и, возможно, даже сделать первоначальный выбор. Концентрированные или рассредоточенные промышленные центры, инвестируя средства в машинное оборудование и строительные инструменты."
 LUX_construction_effort: "Субсидии для промышленности"
 LUX_construction_effort_tt: "Недостаточно площадок для строительства § § Гражданской фабрики!"
 LUX_construction_effort_desc: "Здоровая и сильная индустрия появляется не просто из ниоткуда, хотя нам, возможно, придется позже начать более амбициозные проекты, мы должны начать с обеспечения того, чтобы те, кто обладает хорошими управленческими навыками, могли начать здоровые, успешные компании, которые впоследствии могут стать гигантами."
 LUX_production_effort: "Армия штата"
 LUX_production_effort_tt: "Недостаточно площадок для строительства военного завода!"
 LUX_production_effort_desc: "До тех пор, пока мы не сможем произвести собственное военное снаряжение, мы должны создать современные арсеналы для нашей армии. Их цель довольно скромная: закупить снаряжение, необходимое нашей армии, используя государственные средства, гражданское производство и простую добычу, но это лучше, чем не получать никаких новых винтовок."
 LUX_construction_effort_2: "Промышленные центры"
 LUX_construction_effort_2_desc: "Предпринимательство — это одно, но для того, чтобы экономика была достойной даже региональной силы, нам нужно будет развивать крупные промышленные регионы, которые произвели промышленную революцию."
 LUX_production_effort_2: "Военная промышленность"
 LUX_production_effort_2_desc: "Мы должны производить нашу военную технику, если хотим, чтобы наша армия была не просто резервными силами."
 LUX_production_effort_3: "Военная промышленность"
 LUX_production_effort_3_desc: "Мы наконец достигли такой точки, когда у нас есть компании, способные построить необходимое оборудование, даже если их производство все еще ограничено, однако наши потребности по-прежнему велики, и, предоставляя им абсолютную поддержку иностранным компаниям, они постепенно сократят наши потребности."
 LUX_infrastructure_effort: "Национальная инфраструктура"
 LUX_infrastructure_effort_desc: "Наша растущая индустрия требует прочной инфраструктуры для обеспечения транзита товаров. Мы должны покончить с хаотичностью, планированием городов и, наконец, проложить дороги нашей страны. Те, кто существует, те, кто будет расширен или связан, и те, кто еще должен быть."
 LUX_infrastructure_effort_tt: "Недостаточно площадок для §YInfrastructure§!"
 LUX_synth_oil_effort_tt: "Недостаточно площадок для §синтетического нефтеперерабатывающего завода!"
 LUX_infrastructure_effort_2: "Железнодорожные сети"
 LUX_infrastructure_effort_2_desc: "Современным странам нужны железнодорожные сети, способные быстро и эффективно доставлять что-либо из одного пункта страны в другой. Это означает, что нам придется расширять наши железные дороги и создавать перекрестки, которые не появились у нас даже несколько лет назад."
 LUX_construction_effort_3: "Промышленные сети"
 LUX_construction_effort_3_desc: ""

 LUX_extra_tech_slot: "Исследовательские советы"
 LUX_extra_tech_slot_desc: "Мы должны финансировать научно-исследовательские советы для обеспечения того, чтобы они находили работу до тех пор, пока наша промышленная база не вырастет достаточно, чтобы привлечь частные научно-исследовательские институты."
 LUX_extra_tech_slot_2: "Научно-исследовательские институты"
 LUX_extra_tech_slot_2_desc: "По мере расширения нашей промышленной базы мы, наконец, переходим от простого производства к разработке и созданию, или, по крайней мере, привлекаем тех, кто это делает."
 LUX_technology_sharing: "Обмен технологиями"
 LUX_technology_sharing_desc: "Делясь с нашими союзниками техническими достижениями, наша фракция сможет более эффективно проводить военные исследования и разработки."
 LUX_secret_weapons: "Секретное оружие"
 LUX_secret_weapons_desc: "Заманчиво тратить все дополнительные ресурсы только на разработку танков и самолетов, но секрет победы в войнах лежит в целых новых областях науки; электронике, ракетах и ядерных исследованиях."
