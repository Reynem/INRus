 lux_france_angery.1.d: "События в Люксембурге приняли драматический оборот, новое радикальное правительство пришло к власти, и теперь оно создает небольшую, но угрожающую идеологическую угрозу на нашей границе, поэтому возникает вопрос о том, как мы справляемся с этой язвой?"


