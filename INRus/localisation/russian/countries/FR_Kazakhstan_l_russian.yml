### EVENTS ###
##############

### INTRO EVENT ###
kazakh.1.t: "Казахская ССР"
kazakh.1.d: "С момента падения Монгольской империи земли Казахстана уже давно оккупированы воюющими государствами, и все они борются за господство в этом районе. Когда русские вторглись в XIX веке, земли были интегрированы в Цардом и оставались границей против Афганистана и Британского Раджа. Несмотря на то, что русская революция перевернула Цардом и заменила его советской республикой, казахские земли использовались для того, чтобы прокормить население, но после революции они были модернизированы и заполнены красными людьми повсюду. Несмотря на успех восстания Кронстадта, казахская ССР получила значительную автономию от Москвы, чтобы справиться с побегами из Центральной Азии, и она стремится расшириться до Туркестана и Транскаспии."
kazakh.1.a: "Казахи навсегда!"

### SOVIETS EXPAND KAZAKH CLAIMS ###
kazakh.2.t: "Советы расширяют наши претензии"
kazakh.2.d: "Российское правительство решило расширить наши претензии на Транскаспию, и мы должны подготовить наши военные к неизлечимой войне против наших южных соседей."
kazakh.2.a: "Приготовьтесь к войне!"

