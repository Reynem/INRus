l_russian:

KAZ_FUHRERREICH_DESC: "С момента падения Монгольской империи земли Казахстана уже давно оккупированы воюющими государствами, все борются за доминирование в этом районе. Когда русские вторглись в 19-е ценказию, земли были интегрированы в Цардом и оставались границей против Афганистана и Британского Раджа. Несмотря на то, что российская революция свергла Цардом и заменила его советской республикой, казахские земли использовались на обширных землях, чтобы прокормить население. С успехом восстания Кронштадта казахская ССР получила значительную автономию от Москвы и собиралась распространиться на Транскаспию."

