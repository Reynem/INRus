 # - Mutual

 anam.11.d: "С созданием Тихоокеанской организации обороны отношения между нашими государствами значительно улучшились. ПДО уполномочена защищать и защищать коммерческие судоходные маршруты в Тихом океане и, при необходимости, применять военную силу для защиты государств -- членов Организации."
 anam.13.d: "Сегодня утром в Нью-Йорке представители британских и американских правительств завершили недельное дипломатическое совещание по вопросу о предлагаемом союзе между двумя странами. Несмотря на то, что отношения между двумя странами в межвоенные годы сокращались из-за технологической военно-морской гонки, представляется, что эти озабоченности относятся к прошлому."

 ##### Tooltips #####

 anamwarning: "Эта Конференция, безусловно, должна определить наше взаимодействие в обозримом будущем. Если мы хотим добиться успеха, то это будет означать, что подозрительные отношения между нашими двумя странами будут продолжаться и, возможно, приведут к войне. Успех приведет к расширению сотрудничества."
 AA_mil_diff_tt: "Негативные последствия расширения военного сотрудничества между нашими двумя странами будут продолжаться не более нескольких месяцев, после чего мы выиграем от расширения сотрудничества между нашими двумя военными."

