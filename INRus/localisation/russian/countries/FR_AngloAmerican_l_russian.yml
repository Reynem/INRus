 ##### Events #####

 # - UK side

 anam.1a.d: "В конце Великой войны мы столкнулись с самым крупным военно-морским флотом, который когда-либо видел, но не все было хорошо. Наши союзники в Соединенных Штатах и в Японии начали свои собственные военно-морские программы расширения, которые могли бы бросить вызов ранее не оспаривавшимся Королевским военно-морским флотом. С экономическим бумом в Империи большая часть средств была передана Королевскому военно-морскому флоту, и началась широкомасштабная программа строительства судов, чтобы соответствовать темпам американского и японского строительства. Наше правительство знало, что это соглашение никогда не будет продолжаться бесконечно и что мы впервые заняли свою позицию с началом гонки вооружений, которая может произойти только в начале этого года. Дипломатические усилия будут предприняты между нами и Соединенными Штатами Америки для предотвращения катастрофической военно-морской гонки между нашими двумя государствами, которая, по мнению многих, будет направлена на проигрышную сторону. Это соглашение никогда не продлится бесконечно, и, возможно, что на сегодняшний день наша конференция по морскому праву не будет проходить, как намечается, намечаемая на сегодняшний день, на американская конференция, на которой, возможно, начнётся дальняя конференция по дальне."
 anam.2a.d: "Сегодня утром Англо-американская конференция 36-го года началась с встречи американских и британских дипломатов в Нью-Йорке для обсуждения общих интересов и озабоченностей каждой из наших стран."
