 RUS_anton_denikin: "Антон Деникин"
 RUS_anton_denikin_commander_desc: "Антон Деникин, родившийся от русского отца и польской матери, решил принять патриотизм первого и связал остаток своей жизни с Имперской Русской Армией. К Великой войне он был главным генералом и начальником штаба в Киевском военном округе, а также прославленным писателем, который проанализировал недостатки российской армии."people's army" via mass mobilisation and modernisation of recruitment. Politics are the last thing on his mind, but should he end up in power one way or another, Denikin's experience in the Russian chief of staff will lead to him commanding the nation like he used to command his regiment."

 RUS_pavel_shatilov: "Павел Шатилов"
 RUS_pavel_shatilov_commander_desc: "§L#nPavel Shatilov родился в российском дворянстве, его отец и дед были генералами, и его дед даже помог захватить грузинские земли, в которых родился Павел. Он следовал семейной традиции, легко поступил в корпус кадетов, служил в казацких полках и закончил Академию Генерального штаба. Он служил в российской гражданской войне и в Великой войне, достиг звания генерал-майора к моменту революции. Шатилов, как и многие из его коллег, последовал генералу Корнилову в области Дон и стал членом Добровольческой армии, где он, в первую очередь, стал близким помощником Пиотра Врангля. Их дружба выжила, и даже сегодня Шатилов всегда был там, когда Врангл нуждался в поддержке. \nShatilov сам считается способным, если особенно холодным коммандером, отличающимся самоконтролем и постоянным халатом на его лице."

 RUS_vladimir_kappel: "Владимир Каппел"
 #RUS_vladimir_kappel_commander_desc: "28 апреля 1883 года н. Царскойе Село, Санкт-Петербургская мухафаза, Российская империя §n §Y Военная карьера: §L\nVladimir Kappel град из благородной семьи офицеров и, таким образом, решил следовать по стопам своего отца, хотя он погиб в бою, когда был еще ребенком. Хотя он получил образование в качестве офицера кавалерии, он закончил с докладом о том, как кавалерия устаревает перед лицом моторизованных сил. Он покорно служил во Великой Войне и участвовал в нападениях Брусилова, но его отношение изменилось, когда началась революция в феврале. Анвоведский монархист, Каппел, который сначала молчал, надеясь восстановить порядок Романова, когда ситуация стабилизировалась, но вскоре начал хитрить с другими будущими белыми генералами. Когда большевики захватили власть, он был в Перме и отправился в Самарию, чтобы присоединиться к Народной армии Комаха, республиканской социалистической силы, которая стремиласьлась к монасти, когда ситуация стабилизовалась, он увиделающую демократку с несколькими более крепкими крепкими демократами."little Napoleon" - the nickname which stuck, however, was "Soldier-General" - a commander who always stayed by his men and fought side by side with a rifle and grenade. After the end of the Bolshevik uprising, Kappel remained in the army and became one of the most important generals in its infantry corps. He is a proponent of army motorisation and officer corps modernisation."

 RUS_mikhail_drozdovsky: "Михаил Дроздовский"
 #RUS_mikhail_drozdovsky_commander_desc: "§L\nMikhail Drozdowski from дальней линии русских дворян на востоке Украины, многие из которых служили офицерами армии, - и он тоже. Он закончил в своем классе престижную Павловскую военную школу и сражался в Руссоянской войне в качестве офицера в Порядке Жизни, где он оставался на фронте, несмотря на травмы и получил несколько украшений за героизм. В последующие годы он попробовал несколько перспективных карьер, включая подводные лодки и самолеты, но в конечном итоге решил присоединиться к силам. Его реальная карьера началась после февральской революции, когда он был первым, чтобы осудить власть республиканского правительства в Москве и не подчинился приказам. Д-р Дешвик, который находился в Румынии, наблюдал за тем, как он захватил современные стандарты и создал свое собственное военное подразделение, Дроздовит, которое бежало к гонщикам Александра, который завоевал храбрую армию Дона."

 RUS_ivan_romanovsky: "Иван Романовский"
 #RUS_ivan_romanovsky_commander_desc: "Общее описание: 28 апреля 1877 года Иван Романовский был ветераном Руссо-Японской войны и уважаемым командиром дивизии во время Великой войны 1917 года."Bad Luck General". Though a talented commander, he was blunt, sharp and never minced his words, shooting down ideas he thought unacceptable and berating those who proposed them in the general staff, which meant that he ended up hated by every single officer in the army corps except for Denikin and Kornilov. Republicans suspected him of being a monarchist and monarchists believed him to be a republican, but once the Civil War came to an end and he had to choose, Romanovsky stood by the Republic. His undiplomatic character means that he's been delayed in promotions, but his talent in warfare cannot be mistaken - he is a capable artillery commander and an expert in firepower concentration."

 RUS_aleksander_kutepov: "Александр Кутепов"

 RUS_anton_turkul: "Антон Туркуль"
 #RUS_anton_turkul_commander_desc: "§L\n §YBorn: §L\n December 11, 1892\nTiraspol, Cherson Government, Russian Empire\n §Y Военная карьера: §L\Born в смешанном российско-молдавском крестьянстве в Приднестровье Антон Турку попытался продолжить военную карьеру до Великой войны, но военные школы Тифлиса и Одессы не признали своего потенциала. Только после того, как его призвали в российскую армию, его начал замечать его храбрость в бою и в конечном итоге получил звание генерала. Один из самых молодых генералов в российском общем штабе и, тем не менее, очень талантливый, Турку многие считают апокадемантом нового поколения российских офицеров. Он постарался привлечь внимание к себе и помочь ему, как бы ни было, малой хитростью."

