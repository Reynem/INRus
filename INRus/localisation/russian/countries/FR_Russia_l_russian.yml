 #### Political Parties ####

 RUS_vanguardist_party: "РКП"
 RUS_vanguardist_party_long: "Российская Коммунистическая партия"
 RUS_collectivist_party: "РКП"
 RUS_collectivist_party_long: "Российская Коммунистическая партия"
 RUS_libertarian_socialist_party: "РКП"
 RUS_libertarian_socialist_party_long: "Российская Коммунистическая партия"
 RUS_social_democrat_party: "Социальные революционеры"
 RUS_social_democrat_party_long: "Партия была основана в 1900 году. В ее основе лежит идеология Народника, а их идеологическими предшественниками являются Александр Герцожен и Пиот Лавров. Партия была опущена в два крыла. Правое крыло предназначено для классовой коллаборации и является патриотичным. Левое крыло является аграрным. Партия использовала политический терроризм до 1909 года и была очень контровсеративной. В то время SR-Maximalist и народный социалист разделились с партией. В российской гражданской войне левое крыло партии, совпадавшее с большевиками, в то время как правое крыло было с белым движением."
 RUS_social_liberal_party: "Народная социалистическая партия"
 RUS_social_liberal_party_long: "Народная социалистическая партия является популистской партией, которая была основана в 1906 году. Истоки партии лежат в Народниках и юридическом популистском движении. Они видят Николая Михайловского и Александра Херзена в качестве идеологических предшественников. В Гражданской войне России было выдвинуто предложение объединиться с Трудовиками, но она не получила поддержки, так что она так и не была реализована. После гражданской войны в России они переехали на землю под контролем Белой России и поддержали демократию. Это поставило их в противоречие с правительством Григория Семёнова, который возглавляет диктаторскую систему."
 RUS_market_liberal_party: "Кадеты"
 RUS_market_liberal_party_long: "В 1905 году в ходе российской революции Павел Милюков создал Konstitutsionno-Democratichesky Partya n §g Кадеты, которые были крайне радикальными в начале поддержки всеобщего избирательного права и намеков на республиканец."
 RUS_social_conservative_party: "Национальный центр"
 RUS_social_conservative_party_long: "Национальный центр состоит из бывших членов Кадетов, которые ненавидели идеи руководства. Они хотят восстановить монархию и уменьшить бюрократию в экономике. Они также хотят улучшить образование. §!"
 RUS_authoritarian_democrat_party: "Российский альянс"
 RUS_authoritarian_democrat_party_long: "Российский союз"
 RUS_paternal_autocrat_party: "Союз 17 октября"
 RUS_paternal_autocrat_party_long: ""Союз 17", "Октября" ..n §g§!"
 RUS_national_populist_party: "NP"
 RUS_national_populist_party_long: "NP состоит из реакционных генералов. Их целью является искоренение Советского Союза и исключение любого влияния Японии. Они выступают против правительства, поскольку рассматривают их как расширение японского влияния.§!"
 RUS_valkist_party: "НУС"
 RUS_valkist_party_long: "Natsional'nyy Soyuz Solidarnosti n §gThe NUS — очень предвзятая партия. Она поддерживает создание государства, в котором высшая палата парламента полностью состоит из ученых, инженеров, писателей... и нижней палаты бизнесменов, они хотят осуществить социально прогрессивные реформы и объединить всех людей российской культуры. Они были частью молодежной организации октобериста, но позднее превзошли партию. Их верность демократии неизвестна, но они жестоко против Григория Семёнова, видя его слабым лидером. §!"
 RUS_american_delegation: "Американская делегация"
 RUS_american_delegation_long: "Американская делегация"
 RUS_imperial_japanese_Delegation: "Японская делегация"
 RUS_imperial_japanese_Delegation_long: "Императорская японская дергация"
 RUS_UDDF: "SZOF" 
 RUS_UDDF_long: "Союз Зашити Отехества и Свободи был основан в марте 1918 года Борисом Савинковым в качестве организации для своих союзников. В его состав входят от военных генералов до бывших социалистов. Он хочет создать государство всеобщего благосостояния, осуществить земельную реформу и поддержать демократию в стране. §!"
 RUS_national_maximalist: "Национальный максималист"
 RUS_national_maximalist_long: "Национально-максималистическая организация - это организация, которая рассматривает революцию как еще одну часть истории, которую возглавляет христианский социалист, а также евразийцы и остатки Союза."Young Russia".§!"
 RUS_oktoberist: "Союз 17 октября"
 RUS_oktoberist_long: ""Союз 17", "Октябрия""

 rus_democracy: "Демократическое дерево фокуса"
 #### events ####
