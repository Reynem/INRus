   ### Characters ###
 RUS_irakli_tsereteli: "Ираклий Церетели"
 #RUS_irakli_tsereteli_leader_desc: "В 1906 году он был избран в Думу, несмотря на то, что ему было всего лишь двадцать пять лет, и стал одним из самых выдающихся лидеров фракции Меншевика. Он был вновь арестован и депортирован после переворота в Столпине, но к тому времени его статус как борца за социальную демократию стал прочным."

 RUS_aleksandr_kerensky: "Александр Керенски"
 #RUS_aleksandr_kerensky_leader_desc: "Говоря о современной российской политике, мы говорим о жизни Александра Керенского, отца-основателя Республики кое-кому, и о символе ее распада для других. Знаменитый юрист и профессор-юрист Керенский, который симпатизировал радикальному социалистическому движению в своей юности и был юрисконсультом нескольких революционеров, заключённых в тюрьму после революции 1905 года, он даже был другом детства Владимира Ленина. Однако в конце концов, он признал, что социализм может быть достигнут только путем реформы, и к тому времени, когда началась Великая война, он был ведущим членом социалистической оппозиции в Государственной Думе. Это побудило его возглавить республиканское временное правительство после февральской революции - ненадолго до того, как он был свергнут большевиками. Керенски вернулся к власти в 1920 году, поскольку первый президент Российской Республики, человек, который изменил своими годами изгнания, и ущерб, нанесенный ему гражданской войной в стране."

 RUS_viktor_chernov: "Виктор Чернов"
 #RUS_viktor_chernov_leader_desc: "В то время как Виктор Чернов родился в старом российском дворянстве Саратов и повернулся к революционной политике после знакомства с трудами российского популистского движения в своем гимнастике. Изучая в Тарту и позднее в Москве, Чернов ввелся в круг революционных друзей, в том числе Владимира Ленина, Василия Маклакова, Павла Милюкова и многих других, которые позднее оформили российскую историю. Он решительно отвергает марксизм и его враждебность по отношению к крестьянству, и видел мощную революционную силу в бедных, облаченных российских деревнях - это в конечном итоге привело его к социалистическо-революционерам. В свою очередь, он был выдающимся членом Тамбова Земстова и многих других, которые позднее стали лидером аграрного социализма. Он решительно отвергал марксизм и его враждебность по отношению к крестьянству. Он убеждал свою партию участвовать в избирательной политике после революции 1905 года, до тех пор, пока 1907 Столлинистский Коуп, который разрушил любые надежды демократического царского режима и убедил Чернова в том, что только революционные методы создадут демократию в России."

 RUS_pavel_milyukov: "Павел Милюков"
 #RUS_pavel_milyukov_leader_desc: "Павел Милюков прибыл из богатого, образованного высшего городского класса и представлял его всю свою жизнь. Ветеран Руссо-турецкой войны и профессор философии Милюков был под влиянием либеральных идей Герберта Спенсера и мысли Позитивиста Огюста Комта. Чтобы соревноваться в конституционно уполномоченной Думе после революции 1905 года, он основал Конституционную демократическую партию (кадеты), которую он возглавлял в течение следующих сорока лет своей жизни. Партия интеллигенции, либеральные люди, чиновники и евреи Земстово, Кадетс, боровшаяся за федеральное конституционное решение для российской нации, если она республиканка или демократическая, не имеет значения. Великая война увидела, как Милюков сильно расхищает право - он стал националистом и сторонником территориального расширения на Балканах, что дало ему прозвище."Milyukov of the Dardanelles".\n\nMilyukov was arguably one of the reasons for the collapse of the Provisional Government - as Kerensky's Minister of Foreign Affairs, he staunchly opposed even the discussion of peace with the Central Powers. Despite this, he and the Kadets were too influential to sideline, and after the Russian Civil War, they became one of the most influential political parties in the country. Milyukov has served in several governments and held the position of Prime Minister numerous times, most notably during the assassination of Aleksandr Kerensky. His age is catching up to him, but his mind is still sharp - and though Milyukov may be a constitutional democrat, he is a more vehement Russian imperialist than even the average NRPR-er."

 RUS_vasily_maklakov: "Василий Маклаков"
 #RUS_vasily_maklakov_leader_desc: "Его политическая карьера началась, когда он изучал право - в рамках своей диссертации о древней греческой демократии, он посетил Париж и произвел впечатление на его политическую систему, которую он пытался воспроизвести в России с тех пор. Он приобрел известность как крепостный законный разум и куратор, главным пунктом его юридической карьеры была защита Менахема Менделя Бейлиса, русского еврея, незаконно обвиненного в совершении ритуального убийства в 1913 году. Он был одним из основателей Кадета и представлял консервативное крыло партии - он резко критиковал Павел Милюкова, но никогда не говорил о разрушении партийного единства. Немецкий утверждал, что Маклаков снабжал Феликса Юсупова ядом убийства Григория Семионова, но сам он отрицал это, однако Маклаков был противником Распутина и объявил царский режим без каких-либо препятствий, пригоняемый сумасшедшим чаффером."

 RUS_nikolay_trubetskoy: "Николай Трубецкий"
 # RUS_nikolay_trubetskoy_leader_desc: "Принц Николай Трубетский представляет новое поколение русских дворян, образованный, идеологически настроенный верхний класс, который выступает против радикализма справа и слева."Russian Union", a conservative monarchist party which declared itself to be a bridge between the increasingly anti-democratic right and the weakening moderate left.\n\nAlongside Pavel Savitsky, Nikolay Trubetskoy developed the ideology of Eurasianism, one which he and his party ascribe to. Trubetskoy's Eurasianism decrees that Russia is intrinsically tied to the peoples of Asia as well as Europe, and that their geopolitical position and history creates an exceptional role for Russia in world history. Russia should lead the fight against what Trubetskoy perceives as "the Europeanisation of the world" - Romano-Germanic culture, which, having developed its set of values and moral beliefs, drilled into its head that they are somehow universal. Russia should be at the forefront of a crusade against this cultural imperialism and create a world where each nation is able to develop independently of others. This ideology places Trubetskoy as a nationalist, Russian exceptionalist, and conservative staunchly opposed to Western ideals."

 RUS_ariadna_tyrkova: "Ариадна Тыркова"
 #RUS_ariadna_tyrkova_leader_desc: "Ариадна Тиркова родилась в Новогородском дворянстве и училась в Сен-Петерсбурге, где она познакомилась с либерально-реформистскими публикациями Pytr Struve и, таким образом, перешла к либеральному делу. Она была одним из основателей Конституционно-демократической партии, выдающимся членом ее правого крыла и сторонником союза с Октобристом. Ее определяющей политической позицией, однако, была ее непреклонная борьба за права женщин, которая привела к тому, что Кадеты добавили право голоса женщин к своей партийной платформе. Однако российская гражданская война радикализовала ее. После короткого изгнания в Великобританию в 1919 году она вернулась в Ростов, где она заявила, что либеральная демократия потерпела неудачу в России и что сильная, уникальная форма российского правительства должна взять на себя ответственность."

 RUS_lavr_kornilov: "Лавр Корнилов"
 #RUS_lavr_kornilov_leader_desc: "Один из самых известных военных командиров в современной российской истории Лавр Корнилов, тем не менее, является человеком удивительной загадки, даже его происхождение является загадкой, однако он определенно является сибирским казаком и воспитан в жестокой милитаристской культуре своего народа. Его военная карьера началась до Великой войны и завершилась его назначением Верховным главнокомандующим Российской армии в 1917 году - ненадолго до поединка Корнилова. В случае, когда после окончания гражданской войны Корнилов передвигал войска на Петрограде, предположительно по приказу Керенского, но был снят со своего поста из-за этой измены и сбежал дона. Там он вызвался в Белую Армию и стал одним из ее самых талантливых командиров. Нен-Корниловский конфликт с правительством вспыхнул после окончания гражданской войны, но в этот момент он был одним из тех, кто имел верх, и он остался на своем посту. Для тех, кто верил, что он может быть предателем, Корнилов доказал, что он держался против попытки Колчайского переворота и спасал их от самого страшного государства."

 RUS_boris_savinkov: "Борис Савинков"
 #RUS_boris_savinkov_leader_desc: "Террорист, агрессивный сумасшедший, убийца, революционер и диктатор — это всего лишь несколько ярлыков, которые были даны Борису Савинкову, лидеру Национальной республиканской партии России. На протяжении всей своей цветной жизни он убивал и бомбил многих в рамках Военной организации Социалистической революционной партии, прежде чем стать прагматическим заговорщиком за спиной Александра Керенского, как помощнику военного министра в 1917 году, он почти взял диктаторскую власть в России из теней, и только крах Корниловского переворота привел к его падению. Однако он восстановил себя, организовав Союз защиты Материны, подземную организацию сопротивления в Москве, которая подготовила почву для падения города в 1919 году. n/Navinkovinkov, возможно, когда-то был социалистическим, но он долгое время отошел от слабых социалистических революционеров в пользу синкретной идеологии многочисленных идей, которые оказывали влияние на него на протяжении многих лет, все из которых объединяются в систему тоталитарного диктаторского правления, экстренского русского национализма и концепцию палонизма: как орелиста, как орелиста на орелиста из оризма, гера гера гера гера гера и герандиста, и орда орда орда, орда орда орда орда орда орда орда орда орда орда орда орда орда орда орда орда , орда , орда орда орда орда орда орда орда орда , , орд , орд орд орда орда орд , орда орд орд орда орда орда орды, орды орды орды , , ордн ордны, ордны, ордны, , орды орды дина ордн ордн ордн орд орд орд орд орд орд орд орд орд орд орд орд"

 RUS_anastasy_vonsyatsky: "Анастаси Вонсяцкий"

 RUS_pyotr_wrangel: "Pytr Wrangel"
 # RUS_pyotr_wrangel_regnal: "Пиот IV"
 #RUS_pyotr_wrangel_leader_desc: "Среди русских генералов балтийского немецкого происхождения, которых много, Пиотр Вранжел, возможно, самый знаменитый, талантливый офицер кавалерии из семьи, которая одарила несколько командиров Императорской российской армии, Врейнгл отличился во время наступательных действий Брусилова, где он показал себя агрессивным, но заслуживающим доверия командиром. В течение короткого времени, после Октябрьской революции, он работал с украинским государством Павло Скоропадски и до сих пор с любовью помнит Хетмана, но сдался с поста, чтобы не служить немецкой оккупации, и вызвался добровольцем в армию добровольцев. Это здесь легенда так называемой ."Black Baron\" began - the air of nobility and respectable loyalty around his persona built up gravitas among his men and his enemies, who started singing songs about the evil baron restoring the Tsar's throne.\n\nAfter the Russian Civil War, Wrangel remained in the army and rapidly climbed up in command thanks to the talent he showed during the war. Though generally apolitical, he vividly remembers the Russian Civil War and is willing to do anything it takes to prevent such a travesty from befalling Russia again - even if it means taking control of the nation and directing it with an iron fist. And no matter what he might do, his officers will follow him regardless - to this day, junior officers in the Army ask themselves: \"If Baron Wrangel was here, what would he do?\""
 #RUS_pyotr_wrangel_regnal_leader_desc: "Среди русских генералов Балтийского немецкого происхождения, которых много, Пиотр IV Вранжел, возможно, самый известный, талантливый офицер кавалерии из семьи, которая одарила несколько командиров Императорской Российской армии, Врейнгл отличился во время наступательных действий Брусилова, где он показал себя агрессивным, но заслуживающим доверия командиром. В течение короткого времени, после Октябрьской революции, он работал с украинским государством Павло Скоропадски и до сих пор с любовью помнит Хетмана, но ушел в отставку, чтобы не служить немецкой оккупации, и вместо этого вызвался добровольцем. Это здесь легенда так называемой так называемой добровольческой армии ."Black Baron"began - the air of nobility and respectable loyalty around his persona built up gravitas among his men and his enemies, who started singing songs about the evil baron restoring the Tsar's throne.\n\nAfter the Russian Civil War, Wrangel remained in the army and rapidly climbed up in command thanks to the talent he showed during the war. Though generally apolitical, he vividly remembers the Russian Civil War and is willing to do anything it takes to prevent such a travesty from befalling Russia again - even if it means taking control of the nation and directing it with an iron fist. And no matter what he might do, his officers will follow him regardless - to this day, junior officers in the Army ask themselves"If Tsar Pyotr was here, what would he do?""

 RUS_dmitry_romanov: "Дмитрий Романов"
 #RUS_dmitry_romanov_regnal: "Дмитрий III"
 #RUS_dmitry_romanov_leader_desc: "Великий герцог Дмитрий Павлович является первым двоюродным братом последнего императора всех русских, Николая II, и одним из самых известных членов дома Романова. С самого детства он считался лидером нового поколения монархов, в отличие, скажем, от стареющего Великого Герцога Кирилла, который является заядлым спортсменом и амбициозным авантюристом, интегрированным в современное западное общество. Благодаря своей дружбе с принцем Феликсом Юсуповом он участвовал в убийстве Григори Распутина и был изгнан в Персию, в результате чего, однако, благодаря этому, он пережил российскую революцию и сбежал в Западную Европу. После романа с Коко Чанелем и Одри Эмери Дмитри вернулся в Россию и принял новый республиканский порядок, по крайней мере в открытом порядке."Modern Romanov" would make for a great constitutional monarch, whereas aristocratic republicans see a strong and charismatic persona which could unite the left and the right. Dmitry has never seen himself as a ruler, nor is he all that competent at governance, but should he be thrust into power, he certainly would not object - if he can extract amusement out of lording over Russia."
 #RUS_dmitry_romanov_regnal_leader_desc: "Дмитрий III Романов является первым двоюродным братом последнего императора всех русских, Николая II, и одним из самых известных членов дома Романова. С самого детства он считался лидером нового поколения монархов, в отличие, скажем, от стареющего Великого Герцога Кирилла, он был заядлым спортсменом и амбициозным авантюристом, интегрированным в современное западное общество. Благодаря своей дружбе с принцем Феликсом Юсуповом он участвовал в убийстве Григори Распутина и был изгнан в Персию, в результате чего, однако, благодаря этому, он пережил русскую революцию и сбежал в Западную Европу. После романа с Коко Чанелем и Одри Эмери Дмитри вернулся в Россию и принял новый республиканский порядок - по крайней мере в открытом порядке."Modern Romanov" would make for a great constitutional monarch, whereas aristocratic republicans see a strong and charismatic persona which could unite the left and the right. Dmitry has never seen himself as a ruler, nor is he all that competent at governance, but should he be thrust into power, he certainly would not object - if he can extract amusement out of lording over Russia."

 RUS_vladimir_romanov: "Владимир Романов"
 #RUS_vladimir_romanov_regnal: "Владимир III"
 #RUS_vladimir_romanov_con_leader_desc: "Владимир III Романов является вторым Царем восстановленной Русской империи, беря трон у своего отца Кирилла в 1938 году, всего лишь в возрасте 21 года. Он отличается от своего отца и многих других членов его династии - молодой человек, который никогда не видел Николая II или бывшую Российскую империю, и, таким образом, знает его только из историй и исторических книг. Обученный в Канаде и получив курс по военным делам в России, Владимир дает ауру эрудита и интеллигенции. Он говорит на нескольких языках - английском, французском, испанском и немецком - помимо своего русского, он демонстрирует компетентность как в дипломатических делах, так и в бытовых вопросах. Предположим, что трон в столь юном возрасте нанес ему вред, и первые несколько лет его правления были обречены на неловкое положение, но русская аристократия и население имеют большие надежды на молодого царя. Возможно, он может предотвратить еще одну революцию."
 #RUS_vladimir_romanov_abs_leader_desc: "Владимир III Романов является вторым Царем восстановленной Русской империи, беря трон у своего отца Кирилла в 1938 году, всего лишь в возрасте 21 года. Он отличается от своего отца и многих других членов его династии - молодой человек, который никогда не видел Николая II или бывшую Российскую империю, и, таким образом, знает его только из историй и исторических книг. Обученный в Канаде и получив курс по военным делам в России, Владимир дает ауру эрудита и интеллигенции. Он говорит на нескольких языках - английском, французском, испанском и немецком - помимо своего русского, он демонстрирует компетентность как в дипломатических делах, так и в бытовых вопросах. Предположим, что трон в столь юном возрасте нанес ему вред, и первые несколько лет его правления были обречены на неловкое положение, но русская аристократия и население имеют большие надежды на молодого царя. Возможно, он может предотвратить еще одну революцию."

 RUS_kirill_romanov: "Кирилл I"
 # RUS_kirill_romanov_regnal: "Кирилл Романов"
 # RUS_kirill_romanov_con_leader_desc: "Великий герцог Кирилл Владимирович, ныне Кирилл I из России, является одним из самых беспокоящих членов дома Романова. Сильная, амбициозная и преисполненная решимости захватить трон, он несколько раз причинил головную боль своему первому двоюродному брату Николаю II. Это открытый секрет, что во время февральской революции Кирилл активно работал против Царя и остальных членов Палаты, даже до того момента, когда он приказал своим людям поднять красный флаг над Петроградом, не из-за какой-либо приверженности революционным идеалам, а из-за надежды на то, что Кирилл не будет иметь права на восстановленный российский трон или, возможно, даже Царь, после того, как его двоюродный брат отрекся от него. Несмотря на то, что после казни Николая и его семьи Кирилл заявил о своей власти над разбросанным домом Романова, утверждение, которое горячо оспаривалось остальной частью семьи, которое утверждало, что Кирилл не имеет права на восстановленный российский трон и, возможно, на самом деле, он был признан в 1929 году безрассудной смертью Великого Дюка Николая, хотя Кируй, попустин является ли неуманным делом, что он является одним из его популярным, что он, является одним из его по-конституальным идеалом, и что он по-конституционистистским, и что он действительно является по-провозом."
 #RUS_kirill_romanov_abs_leader_desc: "Великий герцог Кирилл Владимирович, ныне Кирилл I из России, является одним из самых беспокоящих членов дома Романова. Сильная, амбициозная и преисполненная решимости захватить трон, он несколько раз причинил головную боль своему первому двоюродному брату Николаю II. Это открытый секрет того, что во время февральской революции Кирилл активно работал против Царя и остальных членов Палаты, даже до того момента, когда он приказал своим людям поднять красный флаг над Петроградом, не из-за какой-либо приверженности революционным идеалам, а из-за надежды на то, что Кирилл не будет иметь права на восстановленный российский трон или, возможно, даже Царя, после того, как его двоюродный брат отрекся от него. Но в конце концов он был признан, что его несвоевременная смерть Гран-Дюке Николая, несомненно, помогла ему. Хотя Кирилл принял свою роль в разрозненных домах Романова, утверждение, которое было горячо оспорено остальной частью семьи, которое утверждало, что Кирилл не имеет права на восстановленный русский трон или руководить русской королевской семьей."

