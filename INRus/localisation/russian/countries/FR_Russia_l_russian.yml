 RUS_vladimir_manstein: "Владимир Манштейн"
 RUS_vladimir_manstein_commander_desc: "ГЕНЕРАЛЬНОЕ ОПИСАНИЕ: §L\N 3 января 1894 года в Кременчуге, провинция Польтава, Российская империя §Y Военная карьера: §L\n Сын генерала Владимира фон Манштейна, Манштейн, родившийся от семьи русифицированных немцев, которые приняли православное и оставили большую часть своего наследия; когда началась Великая война, Манштейн был кадетом в Павловской военной школе в Петрограде, его класс был отпущен раньше графика и назначен в армии из-за острой нехватки офицеров на фронте. Даже до того, как война началась, коллеги офицера запомнили его, он, несомненно, был храбрым и бесстрашным, но по-своему, с полным отсутствием сдержанности, сочувствия и полного презрения к своему другу. События 1917 года лишь усугубили эти тенденции - крах Русской империи, в который он искренне верил, и жестокое ранение во время Гражданской войны, после чего его левая рука была ампутирована. ~ Во время Гражданской войны Манштейн приобрел прозм прозрение. ."One-Armed Devil". Claiming to be "possessed by Russia", he commanded units in the White Army with exceptional efficiency, showed no remorse to Bolsheviks, and personally executed numerous political commissars - his contemporaries described him being as cold as a machine, "a terrible invention of death and blood". And for that, the Whites respected him whole-heartedly. After the Civil War and the Russian defeat in it, however, Manstein's life fell to a slump. War is all he had ever known, his injury meant that he was unable to find any other job, and his marriage turned estranged - before they could get divorced, his wife mysteriously disappeared, and rumours say that Manstein shot her himself."

 RUS_sergey_markov: "Сергей Марков"
 #RUS_sergey_markov_commander_desc: "§L\n §YBorn: 19 июля 1878/nKronstadt, Санкт-Петербургская мухафаза, Российская империя §Y Военная карьера: §L\n-n-Sergey Leonidович Марков родился от семьи офицера и с такой же энергией провёл карьеру."Leather General" - named as such for his style to wear black leather from head to toes. Already, his tendency for recklessness and unconventional, yet brilliant tactics began to show. After his service in Manchuria, Markov became a teacher in the prestigious Pavlovsk military academy, but duty called him to war once again when the Great War began. There, he served in the same unit as Anton Denikin, as one of his closest aides, and the two officers developed a mutual feeling of respect.\n\nAfter supporting Lavr Kornilov in his coup attempt, Markov was arrested, but escaped in the chaos after the Bolshevik takeover and escaped to the Don, where he joined the Volunteer Army. There, he distinguished himself as a legend among the White commanders, who would often take matters to his own hands, defeat numerically superior Red forces with the craziest tactics (such as standing on the tracks to stop an armoured train, yelling curses at the Bolsheviks as he bombed it with grenades), and saved the White cause from an early defeat. After the end of the Russian Civil War, Markov, a committed republican, remained in the army, and began crafting a new form of warfare based of his experiences of surprise engagements, armoured vehicles and maneouvre in the war - though his ideas are radical, the potential behind them is incomprehensible."

 RUS_fyodor_abramov: "Фёдор Абрамов"

 RUS_vyacheslav_naumenko: "Вячеслав Науменко"
 #RUS_vyacheslav_naumenko_commander_desc: "25 февраля 1883 года в Кубанском Косзакском Хосте, Русской империи (n §Y) Военная карьера: §L\n коренной кубанский казак и выдающийся кавалерист Вячеслав Науменко был одним из многочисленных офицеров Кубана Косзака, которые решили противостоять захвату России большевиком и быстро поднялись в ряды вооруженных сил Южной России. Стаунчли аполити , он помог поддерживать порядок в Кубане, когда оказалось, что он может разорвать отношения между сторонниками союза с Украиной и союз с Россией. После гражданской войны он вернулся в Кубанский Хозяин, надеясь служить среди своих соотечественников и сохранить их верность новому режиму в Москве. Петр Красов , однако, несмотря на то, что он поднял знамение восстания, и Науменко был одним из немногих лидеров, которые открыто сопротивлялись ему. Однако Науменко, в сражался в сражая на сражая руса, и остатки своего подразделения, чтобы убежать в Царе. &l"

