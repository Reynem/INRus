 rus.0.d: "В 1914 году, после того как взорвался эрцгерцог Австрии, Россия мобилизовала свои сербские союзники против вторгшейся австрийской армии. Так началась Великая война между русскими, британскими и французами против немецких, австрийских и оттоманских целей. Организация Объединенных Наций, Организация Объединенных Наций и Организация Организация по охране природы , Организация Организация Объединенных Наций , Организация Объединенных Наций , Организация Объединенных Наций , Организация Объединенных Наций , Организация Объединенных Наций , Организация Объединенных Наций , Организация Объединенных Наций , , Организация Объединенных Наций Организация Объединенных Наций , , Организация Объединенных Наций Организация Объединенных Наций Организация Объединенных Наций , , Организация Объединенных Наций , Организация Объединенных Наций Организация Объединенных Наций , Организация Объединенных Наций Организация Объединенных Наций Организация Объединенных Наций , Организация Объединенных Наций Организация Объединенных Наций Организация Объединенных Наций Организация Объединенных Наций Организация Объединенных Наций , Организация Объединенных Наций , , , , Организация Объединенных Наций , Организация Объединенных Наций Организация Объединенных Наций , Организация Объединенных Наций Организация Объединенных Наций Организация"
 rus.1.d: "После того, как Колчак был захвачен и ушел в отставку, он был казнен. После потери своего самого большого союзника французские и британцы вскоре полностью эвакуировали из Сибири, но японская поддержка продолжалась, так как сегодня американские силы смогли вести переговоры с нежеланием Соединенных Штатов о дальнейшей поддержке. 6 апреля 1920 года в Чите были объявлены небелые дальневосточные обязанности русской армии. Соединенные Штаты и Япония быстро открыли диалог с этой Дальневосточной Республикой. Япония и Соединенные Штаты настаивали на том, что Семёновские государства, а также Трансбайкальское правительство, взявшее вместе белые выборы в Организацию Объединенных Наций, не стали частью этих переговоров. В то время как дальневосточная Республика отказалась и Соединенные Штаты и Япония быстро прекратили диалог и вернулись к поддержке Семионовского Трансбайкальского правительства. В конечном итоге правительство Фар-Восточной Республики было полностью изгнано из Трансбайкала. 25 октября американско-японские силы, а белые силы, а также белые силы, белые белые, и их концы, бывшие союзники, по-кончались в последней войне."
 rus.2.d: "Анонимный генерал заявил в Комиссии союзников Восточной России, что Григорий Семёнов присвоил средства. Если эта информация станет общедоступной, правительство будет сильно повреждено, а и без того хрупкий образ Белого правительства еще больше ухудшится."
 rus.3.d: "Несмотря на усилия правительства, информация о воровстве Семионова была слита среди общественности! Хотя расследование источников утечек началось в попытке подорвать их распространение, слухи указывают на то, что демократическая симпатия к бюрократам, работающим на Восточнороссийскую комиссию союзников, сыграла свою роль в этом деле. Если это правда и Комиссия имела какую-либо игру в эту утечку, то их автономное и всемогущее состояние означает, что наши руки связаны в предотвращении распространения новостей. Бог спас нас!"
 rus.4.d: "В ответ на слабость нынешней администрации демократические и популистские партии начали переговоры о создании возможного Объединенного фронта для участия в выборах, хотя мы всегда могли бы совершенствовать наши демократические институты и угрожать их членам не участвовать, присутствие западных наблюдателей и нынешняя непопулярность нашего правительства, вызванная проблемой воровства, связали наши руки во что бы то ни стало, чтобы мы не сделали себя еще более непопулярными."
 rus.5.d: "После успешных переговоров демократические силы, наконец, сформировали коалицию, с тем чтобы побороть нынешний статус-кво, назвав себя Национальным союзом спасения, цель состоит в том, чтобы свергнуть режим и создать демократическое государство."
 rus.6.d: "В Владивостоке вспыхнули протесты в поддержку Национального союза спасения и против Семионова."
 rus.7.d: "Попытка подавить протест в Владивостоке только забросила еще больше топлива в лесный огонь, и антиправительственные восстания распространяются по всему Приморскому. Сотни людей вышли на улицы как в жестоких, так и мирных маршах, протестах и восстаниях, когда полицейские силы и гарнизоны быстро переполняются или просто дезертируют на другую сторону! У правительства есть только выбор на данный момент, если оно планирует остаться в живых."
 rus.8.d: "Правительство официально утратило контроль даже над своими военными дивизиями, которые отказались бороться с протестующими."
 rus.9.d: "Протестующие слились в прямое восстание, и Приморский был полностью взят на себя силами, выступающими против администрации Амура-Трансбайкала. Национальный союз спасения сформировал временную соперничающую администрацию со своим местом в Владивостоке и готовится к проведению крупных правительственных реформ и обеспечению построения новой демократической парадигмы. Стремление раздавить , скорее всего, означало бы конец для нас, поскольку распространяются слухи, и указывает, что даже Союзная Восточная российская комиссия начала переговоры с администрацией Владивостока и планирует поддержать их более стабильный и демократический режим над правительством Амура-Трансбайкаля."
 rus.10.d: "Союзная Восточная комиссия официально признала предателей в Владивостоке законным белым российским правительством."
 rus.11.d: "Все источники указывают, что временное правительство Владивостока готовится к нападению на последние провинции, которые остаются верными администрации Трансбайкала."
 rus.12.d: "Предатели начали давить на последние лояльные провинции на западе страны, хотя победа правительства не является точной, все еще есть шанс, что они смогут оттолкнуть их назад и казнить за свои преступления."
 rus.13.d: "Повстанцы пересекли реку Амур и идут туда, чтобы свергнуть старого охранника."
 rus.14.d: "С началом нового дня белые российские генералы становятся осторожнее и встревожены антиправительственной волной, охватившей районы Амура и приближающейся сейчас к Чите."
 rus.15.d: "День в бою с повстанцами и белым российским военным руководством решил торжественно уйти и позволить захвату и захвату Читы с рук. Владивостокская администрация отмечает, и ведущие члены Союза спасения заявили о своей приверженности созданию России, где будет представлен обычный человек, свободный от социализма."
 rus.16.d: "Сегодня был долгий день для новой белой российской администрации, когда начались широкомасштабные административные реформы, с тем чтобы обеспечить надлежащее строительство демократии в этой стране, а также арест и суд Семёнова за коррупцию и антигосударственную деятельность и реорганизацию армии."
 rus.17.d: "В Временном правительстве сложилась политическая тупиковая ситуация в том, что касается позирования к советским симпатиям, хотя все согласны с тем, что СССР должен быть ликвидирован и восстановлена Россия, октоберисты и основные фигуры Союза спасения предлагают запретить организации, которые выступают за пацифизм или какой-то компромисс с социализмом или СССР в Белой России, однако такая позиция не принимается другими партиями, которые выступают за свободную демократию без авторитаризма, хотя обе стороны могли видеть успешную победу в дебатах, она разделила бы нынешнюю администрацию, что привело бы к политической нестабильности, и поэтому компромисс, поддержанный референдумом, стал бы законным вариантом."
 rus.18.d: "Компромисс, заключающийся в проведении референдума, несмотря на то, что он является компромиссом, не получил поддержки ни со стороны основной фракции Союза спасения, ни со стороны октоберистов."
 rus.19.d: "Политический хаос и нестабильность, вызванные этим затором во временном правительстве, вызвали у народа большую неудовольствие, большинство из которых были не настолько заинтересованы в идее демократии, но присоединились к восстанию, чтобы свергнуть правительство после того, как им было обещано «новый» век для Белой России, без ссор и коррупции. Этот политический вакуум рассматривается как возможность для некоторых амбициозных белых российских генералов и антилиберальных деятелей, которые начали предлагать различные и менее демократические взгляды на эту идею нового правительства."
 rus.20.d: "В ходе продолжительной и утомительной дискуссии во временном правительстве было сочтено, что наилучшим способом решения этого политического вопроса является проведение в стране избирательного процесса, временно организованного с некоторыми ограничениями в отношении пацифистов и просоветов, который может быть или не может быть снят в зависимости от результатов выборов, иными словами, рассмотрение этого вопроса было отложено в будущем."
 rus.21.d: "Временное правительство запланировало выборы в ближайшем будущем с участием наблюдателей от Восточнороссийской комиссии союзников, с тем чтобы гарантировать их легитимность."
 rus.22.d: "Наступили выборы! Дебаты за лидерство Белой России - это два основных блока, с которыми поддерживает большинство политиков: популистский Союз спасения Родины и левый Союз возрождения, и, наконец, более умеренный Национальный центр. Каждый из них имеет четкое представление о том, как реформировать нацию, как обеспечить экономический рост и как эффективно стабилизировать правительство."
 rus.23.d: "Необъявленные и невидимые, волнения Лондонского фондового рынка обрушились на Восточную Азию и в настоящее время привели к экономическим проблемам в нашей стране."
 rus.24.d: "В связи с резким сокращением государственного бюджета и серьезными проблемами, связанными с финансовыми проблемами, было предложено приватизировать крупные суммы большинства крупных государственных компаний, которые будут приватизированы для предприятий, в меньшей степени затронутых кризисом, и, скорее всего, принесут определенные выгоды (а также проблемы)."

 rus.25.d: "Последняя кампания завершена. После долгих лет жестоких боев последние бастионы большевистской власти пали, и наши войска стоят победителями в Москве, сердце разбитого Советского Союза. Вид нашего флага, летящего над Кремлем, знаменует собой решающий конец коммунистического эксперимента. Советский Союз больше не существует. Его обширная территория, простирающаяся от границ Европы до Тихого океана, теперь открыта. Красный Террор закончился, а общий враг побежден. Вся нация ждет. Мир задерживает дыхание. Наследие Ленина разрушено, но грандиозная, немедленная задача создания стабильного российского правительства на руинах советской империи теперь падает на нас, освободителей. Мы должны укрепить наш контроль и объявить будущее свободной России."

 rusur.1.d: "После жесткой избирательной гонки Союз Возрождения одержал победу на выборах, обещал создать прогрессивное государство всеобщего благосостояния, помочь экономике и продолжить борьбу против СССР."
 rusur.2.d: "Сегодня один из министров нашего правительства, Борис Савинков, был убит на своем рабочем месте."
 rusnus.1.d: "НУС, весьма специфическая партия, победила на выборах с октоберистами в качестве младшего партнера, кабинет, возглавляемый Врейнглом и Георгиевским, начинает свою работу, уже предоставляет кредиты фермерам, чтобы механизировать сельскохозяйственную промышленность, закладывая основы для национализации основных отраслей и реформирования школьной системы."
 rusnus.2.d: "Политическая дискуссия привела к фракции нашей правящей партии. Справа фракция самомаркирует себя "Нео-Столилипинистов" возглавляет Аркадий Столипин, сын Столипина. Они хотят модернизировать идеи Столипина и применить их в этом новом политическом контексте."Young Russia" has also been established. Modelling themselves after the ideals of Valkist Germany and using some concepts of the USSR to create a stronger Russia, they call for a strong, totalitarian state overseeing a tightly-controlled economy."
 rusnus.3.d: "В рамках программы НУС они предлагают и преследуют цель создания технократического управления, представляющего специалистов и лиц, имеющих соответствующую квалификацию; это предложение предусматривает роспуск парламента и немедленное назначение ученых, писателей и инженеров для создания нового парламентского института; хотя народ голосует в НСУ, зная об этой идее, вся оппозиция выступает против своих взглядов и их претворение в жизнь, скорее всего, будет осуществляться с помощью авторитарных и антидемократических мер."
 rusnus.4.d: ".. . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . ."
 rusnus.5.d: "В рамках программы НУС они предлагают и преследуют цель создания технократического управления, представляющего специалистов и лиц, имеющих соответствующую квалификацию; это предложение предусматривает роспуск парламента и немедленное назначение ученых, писателей и инженеров для создания нового парламентского института; хотя народ голосует в НСУ, зная об этой идее, вся оппозиция выступает против своих взглядов и их претворение в жизнь, скорее всего, будет осуществляться с помощью авторитарных и антидемократических мер."
 rusnus.7.d: "Партийный парламент был отменен силой, и в настоящее время создается новый технократический орган для его замены. Для того чтобы обеспечить правильность этой идеи, НСЗ планирует создать такой законодательный орган как на основе признания заслуг, так и на основе выборного процесса, в рамках которого только другие профессионалы изберут свой собственный профессиональный класс. Этот процесс должен быть завершен в предстоящие дни, с тем чтобы в Белой России возникла новая эра управления."
 rusnp.1.d: "Политическая тупиковая ситуация в нынешнем временном правительстве привела к политической радикализации, а не только к тому, что международные субъекты стремились к стабильности в этой стране."
 rusnp.2.d: "Фактическое падение правительства и заявление НОС и октоберистов об их отказе выполнить требования некоторых просоветских предателей вчера привели к тому, что военные были уверены в том, что единственное решение нынешней проблемы заключается в иностранном перевороте. Таким образом, под руководством Спиридона Дионишовича Меркулова, группы военных должностных лиц, финансируемых и под влиянием Японии, вторглись сегодня утром в правительственные офисы и приостановили действие конституции. Хотя это решение не является идеальным, оно, скорее всего, удержит политический хаос достаточно, чтобы предотвратить прямое военное вмешательство в белую Россию со стороны Японии или, что хуже, Советов в идеальном мире. Однако некоторые подозревают, что эта поддержка со стороны Японии является уловкой, чтобы скрыть свои реальные намерения вторгнуться в белую Россию."
 rusnp.3.d: "Единственное условие, которое они дали, это то, что российское государство не будет национализировать японские компании и активы без компенсации."
 rusnp.4.d: "С нашим успехом против Японии даже захват Кореи заставил их предложить нам мирную сделку, которая позволит нам свободно национализировать японские компании в России без компенсации."   
 rusnp.5.d: "Корнилов скончался прошлой ночью, обязанность править в эти тяжелые времена не оказала хорошего воздействия на его здоровье, что привело к его смерти, и это делает его вторым в командовании Дитерихами естественным преемником, тем, у кого есть радикальные идеи." 
 rusnp.6.d: "Мы начнем операцию "Очарина" - план по ликвидации предателей нашего государства, включая арест социалистических, демократов других групп, которые выступают против нашего правления."                 

 rusinf.1.d: "Это должно означать, что наше правительство может действовать автономно."
 rusinf.2.d: "Медленно, с помощью дипломатических, политических и экономических средств, США расширяют свое влияние на нашу страну."
 rusinf.3.d: "Объем влияния, которое США сейчас оказывают на нашу страну, весьма важен и должен быть урегулирован."
 rusinf.4.d: "Объем влияния, которое США сейчас оказывают на нашу страну, весьма важен и должен быть урегулирован."
 rusinf.5.d: "Медленно воспользовавшись своим влиянием на нашу страну, американцы теперь имеют в своем кармане белую Россию, которая оказывает огромное влияние и контроль на нашу политику, управление и контроль за большинством правительственных и экономических решений."
 rusinf.6.d: "Японское влияние на нашу страну невелико, и мы надеемся, что это означает, что наше правительство может действовать автономно."
 rusinf.7.d: "Медленно, с помощью дипломатических, политических и экономических средств, США расширяют свое влияние на нашу страну."
 rusinf.8.d: "Масштабы влияния, которое Япония оказывает сейчас на нашу страну, весьма важны и должны быть устранены."
 rusinf.9.d: "После того, как японцы постепенно развивают свое влияние на нашу страну, у них теперь в кармане белая Россия, она оказывает огромное влияние и контроль на нашу политику и управление и контролирует большинство правительственных и экономических решений."
 rusinf.10.d: "Белая Россия недавно обратилась с просьбой об увеличении объема гражданских инвестиций в ее стране, и если мы примем на себя соответствующие обязательства, это, скорее всего, принесет некоторые дипломатические выгоды."
 rusinf.11.d: "Соединенные Штаты согласились активизировать инвестиции в нашу гражданскую экономику, и мы надеемся, что это принесет пользу нашей стране."
 rusinf.12.d: "Белая Россия недавно обратилась с просьбой об увеличении объема военных инвестиций в ее стране."
 rusinf.13.d: "Соединенные Штаты согласились активизировать инвестиции в нашу военную экономику, и мы надеемся, что это принесет пользу нашей стране."
 rusinf.14.d: "США отказались инвестировать дополнительные средства в нашу военную экономику."
 rusinf.15.d: "США отказались инвестировать дополнительные средства в нашу гражданскую экономику."
 rusinf.16.d: "Белая Россия недавно обратилась к нам с просьбой помочь им вооружить своих солдат."
 rusinf.17.d: "Соединенные Штаты согласились помочь нам вооружить наших солдат, и мы надеемся, что это принесет пользу нашей стране."
 rusinf.18.d: "США отказались помогать нам с пехотной техникой."

 ruscoup.1.d: "В момент слабости предыдущая националистическая администрация была перевернута продемократическими военными чиновниками, а теперь, с целью устранить ошибки националистов, надеюсь, это новое военное временное правительство вернет Россию к демократии и стабильности и еще раз узаконит ее как врага Советов."      
 ruscoup.2.d: "При поддержке октоберистов предыдущая администрация была перевернута фракциями в НУС, которые были отрезаны от власти. Объявив о необходимости создания надлежащей и реалистичной администрации, которая выполнит свои обещания и возобновит войну с Советским Союзом, они теперь стремятся включить свои собственные идеологии в правительство. Однако, борьба за власть вспыхнула среди как отверженных фракций, и исход этого решения решит, что за новая администрация произойдет. Если Нео-Столипинист преуспеет, они приведут в нацию традиционистский реформизм. Между тем, если Союз "Молодой России" победит в борьбе за власть, они осуществит свои радикальные авторитарные идеи."    
 ruscoup.3.d: "Попытки Деникина построить диктаторскую систему, противоречащую его обещаниям восстановить демократию, привели к тому, что его переворотил Питр Врангл."
 ruscoup.4.d: "И наконец, после всех этих лет мы провели надлежащие выборы."

 rusflav.1.d: "Наша дипломатическая изоляция продолжается слишком долго, и многие советники в стране стремятся к установлению более тесных связей с американцами по всему Тихому океану."

