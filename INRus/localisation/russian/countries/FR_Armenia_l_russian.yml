l_russian:
 ###Ideas
 ARM_greater_armenia: "Большая Армения"
 ARM_greater_armenia_desc: "Несмотря на то, что в Восточной Анатолии было убито более миллиона наших людей, нам удалось вырезать огромное армянское государство и группы благодаря симпатиям американцев. Теперь, когда грузинская и советская агрессия на север, турецкий реваншизм на Запад, курдский национализм на юго-запад, персидское восстановление на юге и постоянная угроза азербайджанцам нашему Востоку, будущее Великой Армении, похоже, будет таким, что нас будут окружать потенциальные враги, но мы никогда не позволим, чтобы наше бастион армянской свободы пал перед внешними захватчиками!"
 #
 ARM_unruly_turks: "Неуправляемые турки"
 ARM_unruly_turks_desc: "В то время как армянское население быстро восстанавливается, турки составляют большинство на большей части этих земель и все более враждебно относятся к власти из Еревана, что в настоящее время проявляется в несоблюдении, однако, если ситуация изменится, то эта ситуация может измениться и перейти от безмолвной враждебности к открытому насилию."
 #
 ARM_recovering_population: "Возрождение населения"
 ARM_recovering_population_desc: "Правительство Армении предпринимает согласованные усилия по увеличению и оживлению населения страны. Огромное государственное финансирование выделяется на программы, направленные на увеличение рождаемости, с финансовыми стимулами для супружеских пар к рождению детей, государственными наградами для матерей с достаточным количеством детей, расширением сервисной и медицинской инфраструктуры. Наряду с этим, армянская диаспора со всего Ближнего Востока поощряется к возвращению, и многие из них возвращаются с лифтовых и оттоманских территорий, что приводит к значительному росту населения, что со временем позволит нам выиграть демографическую битву против наших соседей после того, как мы почти полностью потеряли ее во время Великой войны, однако это создает трудности для государственных финансов."
 #
 ARM_recovering_population2: "Ускоренное оживление населения"
 ARM_recovering_population2_desc: "Правительство Армении предпринимает согласованные усилия по увеличению и оживлению населения страны. Огромное государственное финансирование выделяется на программы, направленные на увеличение рождаемости, с финансовыми стимулами для супружеских пар к рождению детей, государственными наградами для матерей с достаточным количеством детей, расширением сервисной и медицинской инфраструктуры. Наряду с этим, армянская диаспора со всего Ближнего Востока поощряется к возвращению, и многие из них возвращаются с лифтовых и оттоманских территорий, что приводит к значительному росту населения, что со временем позволит нам выиграть демографическую битву против наших соседей после того, как мы почти полностью потеряли ее во время Великой войны, однако это создает трудности для государственных финансов."
 #
