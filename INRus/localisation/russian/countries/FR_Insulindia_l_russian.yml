#### Events ####
insulindia.0.t: "Провозглашение независимости инсулиндов!"
insulindia.0.d: "Сегодня лидер инсулиндов, борющихся за независимость, Сукарно, говорит, что инсулиндия больше не будет править колониальными державами, его последователями и радио в стране. Силы инсулиндии действительно стоят перед Британской империей, может быть, самой крупной в мире, но этот факт, похоже, не сносит морального духа инсулиндианцев."
insulindia.0.a: "Секали Мердека тетап Мердека!"

insulindia.1.t: "Прибытие иностранных добровольцев Инсулиндия!"
insulindia.1.d: "Иностранные добровольцы, обладающие запасами и оружием, прибыли в наше штаб-квартиру и предложили свои услуги в нашей борьбе за деколониализацию Ист-Индии, в основном из Франции, Советского Союза, Соединенных Штатов Америки и Юго-Восточной Азии."
insulindia.1.a: "Вместе мы победим колониалистов!"

insulindia.2.t: "Победа пришла к нам!"
insulindia.2.d: "Британские империалисты пришли к нам и предложили нам мир. Мы завоевали контроль над Явой и Суматрой, и теперь мы также завоевываем контроль над Инсулиндией. Мы просто должны заключить мир. Дальнейшее расширение Британской империи может быть сделано позже."
insulindia.2.a: "Да здравствует инсулиндия!"

insulindia.3.t: "Испугали нас инсулиндианцы!"
insulindia.3.d: "Инсулинды вытеснили нас из Ист-Индии после долгих сражений, мы можем либо принять их победу, либо продолжить эту битву."
insulindia.3.a: "Давай объявим официальный мир"
insulindia.3.b: "Нет мира с мятежниками!"

insulindia.4.t: "Подход к нашей политике"
insulindia.4.d: "В то время как большинство инсулиндианцев хотят, чтобы наша катерия была независимой, существуют различные мнения о том, как будет выглядеть эта независимость. Наиболее популярными движениями в Инсулиндии в настоящее время являются социалисты, в основном состоящие из рабочих и фермеров, националистов, в основном состоящих из военных лидеров и простых людей, и исламистов, в основном входящих в средний класс и общину муслимов. Мы должны наметить путь, по которому мы должны идти на этом фронте."
insulindia.4.a: "Почему мы не можем приехать в ПНП?"

insulindia.5.t: "Социалисты требуют увеличения объема"
insulindia.5.d: "Социалистические требования начали набирать обороты в нашей стране, помогая быть неверными президенту Сукарно, через социалистов в провинциальном правительстве, к числу которых относятся сеяние иностранной промышленности, национализация буйств и распределение богатства."
insulindia.5.a: "Примите их требования"
insulindia.5.b: "Удовлетворить некоторые из их требований"
insulindia.5.c: "Отклонить их требования"

insulindia.6.t: "Мусульманские требования нарастают"
insulindia.6.d: "Мусульманские требования начали нарастать в нашей стране, что помогло убедить президента Сукарно, через иламистов в провинциальном правительстве, к числу которых относится прекращение светской деятельности инсулиндии, запрещение христианских партий и религиозного образования."
insulindia.6.a: "Примите их требования"
insulindia.6.b: "Примите некоторые из их требований"
insulindia.6.c: "Отклонить их требования"

insulindia.7.t: "Националистические требования"
insulindia.7.d: "Националистические требования начали нарастать в нашей стране, что помогло убедить президента Сукарно, через националистов в провинциальном правительстве, в том числе в том, что касается сеяния иностранной промышленности, усиления военного контроля и запрещения радикальных партий, и это зависит от нашего лидера, насколько мы их одарим."
insulindia.7.a: "Примите их требования"
insulindia.7.b: "Примите некоторые из их требований"
insulindia.7.c: "Отклонить их требования"

insulindia.8.t: "АнтиPNI Rally!"
insulindia.8.d: "социалисты и исламисты собрались вместе, чтобы сплотиться против нашего режима, они утверждают, что независимость Инсулиндии означала только независимость для ННИ и их членов и что другие движения не проходят через свои реформы."
insulindia.8.a: "Подойди!"

insulindia.9.t: "Убийство Покушение на президента Сукарно!"
insulindia.9.d: "Сегодня наш президент Сукарно посетил некоторые города в Норхерн-Суматре, когда кто-то из толпы граждан, наблюдавших за ним во время его визита, прыгнул перед Сукарно и застрелил его. Убийца был убит быстро, но ситуация в Сукарно теперь неизвестна."
insulindia.9.a: "Сукарно выживает с незначительными травмами!"
insulindia.9.b: "Сукарно приведёт к серьезным травмам!"

insulindia.10.t: "Исламистские буйства!"
insulindia.10.d: "Исламисты в нашей стране бунтуют против того, что, по их мнению, является несправедливым обращением со стороны временного правительства."
insulindia.10.a: "Подойди!"

insulindia.11.t: "Социалистические беспорядки!"
insulindia.11.d: "Социалисты в нашей стране бунтуют против того, что, по их мнению, является несправедливым обращением со стороны временного правительства."
insulindia.11.a: "Подойди!"

insulindia.12.t: "Националистические бунты!"
insulindia.12.d: "Националисты в нашей стране бунтуют против того, что, по их мнению, является несправедливым обращением со стороны временного правительства."
insulindia.12.a: "Подойди!"

insulindia.13.t: "Мы изгнаны из Борнео!"
insulindia.13.d: "ВИП"
insulindia.13.a: "На этом этапе нам нужно подписать мир!"

insulindia.14.t: "Выживает инсулиндская демократия!"
insulindia.14.d: "Демократия и стабильность пережили этот период политической нестабильности."
insulindia.14.a: "Время выборов!"

insulindia.15.t: "Первые инсулиндские выборы"
insulindia.15.d: "Первые в истории демократические выборы проводятся в Инсулиндии."
insulindia.15.a: "ИПК убеждает в многообразии!"
insulindia.15.b: "ПНИ сохраняет свою многообразность!"
insulindia.15.c: "NU Assurances a Multirality!"

insulindia.16.t: "Дарул Ислам мобилизует на войну!"
insulindia.16.d: "Радикальные исламисты в Дарульском исламе мобилизовали свои силы против того, что они считают слабым и неэффективным временным правительством."
insulindia.16.a: "Мы должны сделать Стабализ! Быстрее!"

insulindia.17.t: "Кубок Ислама Дарула!"
insulindia.17.d: "Сотни членов Ислама из Дарула сейчас вышли в столицу Батавии, начали сражаться с войсками, лояльными нашему правительству, и очень скоро они смогут захватить контроль над городом и остальной частью страны, в то же время королевские власти Индулиндии приняли решение противостоять этому перевороту своими силами, и все еще предстоит выяснить, какая фракция выиграет в конце."
insulindia.17.a: "Дарул Ислам Сукидс!"
insulindia.17.b: "Инсулиндианские королевские монастыри противостоят исламистам!"
insulindia.17.c: "ПНИ перезабирает контроль!"

insulindia.18.t: "Поддержка Двиндлс уезжает"
insulindia.18.d: "Поскольку мы отвергли требования, выдвинутые нашими союзниками в наше время правления, многие националисты, социалисты и исламисты тайно собрались вместе для организации забастовок и беспорядков по всей стране."
insulindia.18.a: "Кровопролитие на архипелаг!"

insulindia.19.t: "Наша неспособность угодить им всем"
insulindia.19.d: "Поскольку мы приняли требования как социалистов, так и националистов и иламистов, мы обнаружили, что нет большой возможности угодить им всем."
insulindia.19.a: "Нам не следует стараться угодить всем людям"

insulindia.20.t: "Возможно сотрудничество"
insulindia.20.d: "Хотя у многих наших граждан есть противоположные точки зрения, нам удалось сделать социалистов, националистов и иламистов в нашей стране счастливыми на данный момент. Похоже, у нас есть потная средняя дорога между национализмом, социализмом и исламом - то, что мы будем называть НАСАГСОС."
insulindia.20.a: "Инсулиндская демократия будет сильной!"

insulindia.100.t: "Инсулиндия желает присоединиться к «Веселому »"
insulindia.100.d: "Инсулиндия подошла к нам в истерике присоединения к Энтанту. чтобы не разозлить британцев?!"
insulindia.100.a: "Они будут приветствоваться!"
insulindia.100.b: "Нам не нужны новые члены!"

insulindia.101.t: "Франция принимает нашу просьбу"
insulindia.101.d: "Французы приняли нашу просьбу о присоединении к «Вместе», и мы, несомненно, докажем, что мы союзники, которым они могут доверять."
insulindia.101.a: "Наш Альянс будет взбунтоваться!"

insulindia.102.t: "Франция отклоняет нашу просьбу"
insulindia.102.d: "Французы отклонили нашу просьбу о присоединении к «Энтанте», хотя это и вызывает беспокойство, но мы заверили себя, что именно они проиграют свое решение."
insulindia.102.a: "Это они пропустили!"

insulindia.103.t: "&lt; &lt; Инсулиндия &gt; &gt; желает вступить в третью Международную организацию"
insulindia.103.d: "Инсулиндия подошла к нам в истерике присоединения к Третьему Интернационалу. Если мы примем их, мы найдем союзника в этом районе, который может помочь распространить влияние совиета в Азии. Некоторые из них решили разрешить бывшей британской колонии вступить в наш союз, но мы должны помнить, что Интернационал предназначен для всех людей."
insulindia.103.a: "Они будут приветствоваться!"
insulindia.103.b: "Нам не нужны новые члены!"

insulindia.104.t: "Советы принимают нашу просьбу"
insulindia.104.d: "Советы приняли нашу просьбу присоединиться к Третьему Интернационалу, и мы, несомненно, докажем, что мы союзники, которым они могут доверять."
insulindia.104.a: "Наш Альянс будет взбунтоваться!"

insulindia.105.t: "Советы отвергают нашу просьбу"
insulindia.105.d: "Советы отклонили нашу просьбу присоединиться к Третьему Интернационалу, но, несмотря на это, мы заверили себя, что именно они проиграют свое решение."
insulindia.105.a: "Это они пропустили!"

insulindia.106.t: "Инсулиндия хочет купить Сулавеси"
insulindia.106.d: "После разделения бывшей Голландской Ист-Индии между нами, Великобританией и другими странами, Сулавеси находится под японским контролем. Теперь, когда британская часть Ист-Индии становится независимой, новое государство Инсулиндии дало нам предложение. Они хотят купить у нас Сулавеси и готовы заплатить справедливую сумму денег и средств правовой защиты. Хотя это предложение интригует, эта продажа также ослабит наш контроль в этом районе."
insulindia.106.a: "Если цена приемлема, то"
insulindia.106.b: "Сулавеси будет японской колонией."

insulindia.107.t: "Япония принимает нашу покупку"
insulindia.107.d: "ВИП"
insulindia.107.a: "Добро пожаловать домой Сулавеси"

insulindia.108.t: "Япония отвергает нашу покупку"
insulindia.108.d: "ВИП"
insulindia.108.a: "Ублюдки!"

insulindia.109.t: "Инсулиндия желает присоединиться к сфере совместной деятельности"
insulindia.109.d: "ВИП"
insulindia.109.a: "Они будут приветствоваться!"
insulindia.109.b: "Нам не нужны новые члены!"

insulindia.110.t: "Япония принимает нашу просьбу"
insulindia.110.d: "ВИП"
insulindia.110.a: "Наш Альянс будет взбунтоваться!"

