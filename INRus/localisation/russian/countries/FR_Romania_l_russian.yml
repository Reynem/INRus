 ### FOCUS ###

 rom_industry_expansion: "Промышленное развитие"
 rom_industry_expansion_desc: "Новые исследования выявили несколько областей, в которых мы могли бы сосредоточить наши усилия на рационализации нашего производства."
 ###
 rom_infrastructure_effort: "Инфраструктура"
 rom_infrastructure_effort_desc: "Дороги в Румынии опустошаются и разваливаются, и мы должны приложить особые усилия для восстановления и совершенствования наших дорожных систем, с тем чтобы люди и армия могли пересекать свою страну."
 ###
 rom_trans_rails: "Расширить Трансильванские железные дороги"
 rom_trans_rails_desc: "Трансильвания недавно попала в наше позирование менее 30 лет назад, и железнодорожная система в регионе все еще липко напоминает старую Австро-венгерскую империю."
 ###
 rom_military_effort: "Военное подкрепление"
 rom_military_effort_desc: "После окончания Великой войны Румыния вступила в период широкого разоружения, и с ростом напряженности в Европе мы должны вновь подготовиться к созданию большой профессиональной армии в защиту нашей нации."
 ###
 rom_armament_effort: "Оружие"
 rom_armament_effort_desc: "Производство пехотного оборудования имеет важнейшее значение для успеха на поле боя, и поэтому мы должны уделять этому вопросу приоритетное внимание в предстоящих войнах."
 ###
 rom_civ_industry: "Гражданская промышленность"
 rom_civ_industry_desc: "Хотя у нас и есть сильный гражданский сектор, значительная его часть принадлежит местному населению и работает с высокой степенью автономии, мы должны построить новые фабрики, которые непосредственно принадлежат правительству, с тем чтобы иметь больший контроль над промышленным сектором."
 ###
 rom_better_building: "Совершенствование методов строительства"
 rom_better_building_desc: "Гражданский сектор стал вялым в последние десятилетия, и мы должны возродить эту область нашей промышленности в преддверии будущего."
 ###
 rom_expand_oil: "Расширить волнахские нефтяные месторождения"
 rom_expand_oil_desc: "Волнахские нефтяные месторождения являются нашим самым прибыльным активом, мы должны увеличить добычу нефти, чтобы дать нам больше международных рычагов."
 ###
 rom_more_urban: "Урбанизация"
 rom_more_urban_desc: "Румыния по-прежнему является в основном сельским обществом, и мы должны привлечь больше людей в города для дальнейшего расширения нашей промышленности и экономики, чем мы можем в настоящее время."
 ###
 rom_bucharest_uni: "Расширение Бухарестского университета"
 rom_bucharest_uni_desc: "Бухарестский университет является гордостью Румынии и центром интеллигенции во всей Восточной Европе."
 ###
 rom_preserve: "Сохранение Большой Румынии"
 rom_preserve_desc: "Наконец-то мы выполнили мечту Великой Румынии, и мы должны быть уверены в том, что любой ценой мы сохраняем это географическое превосходство."
 ###
 rom_begin_forts: "Начинайте крепость."
 rom_begin_forts_desc: "Мы должны приступить к осуществлению широкомасштабного проекта по укреплению нашей страны, с тем чтобы защитить ее от возможного вторжения со всех сторон."
 ###
 rom_bessarabia_forts: "Расширить Бессарабские крепости"
 rom_bessarabia_forts_desc: "Существование независимого украинского государства может дать нам буфер с Россией, но мы знаем об их амбициях в Бессарабии и Бугеаке. Расширение наших восточных фортов защитит нас как от экспансионистской Украины, так и от возрождающейся России."
 ###
 rom_tisza_forts: "Расширить крепости Тисы"
 rom_tisza_forts_desc: "Возрождение партии Стрелы-Кросс в Венгрии вызывает тревогу, они уже обещали восстановить венгерское государство и вернуть свои «праведные земли»."
 ###
 rom_carpathia_forts: "Расширение Карпатских крепостей"
 rom_carpathia_forts_desc: "Мы должны признать тот факт, что мы можем потерять позиции в предстоящих войнах, и хорошо построенная и сильная запасная линия позволит нам восстановиться и организовать контратаки."
 ###
 rom_militarism: "Румынский милитаризм"
 rom_militarism_desc: "Мы должны быть готовы к милитаризации нашего общества в защиту страны, и все должны служить так или иначе."
 ###
 rom_city_defense: "Городская оборона"
 rom_city_defense_desc: "Мы должны быть готовы защищать каждый дюйм наших городов до последнего человека, и мы сделаем городские бои трудными и безвозвратными для наших врагов, разместив крепости в скрытых местах и рассеив взрывчатку по городским улицам."
 ###
 rom_air_1: "Румынские военно-воздушные силы"
 rom_air_1_desc: "Военно-воздушные силы сыграли ключевую роль в нашей победе над австро-венгерцами и болгарами во время Великой войны."
 ###
 rom_air_2: "Расширение Трансильванских военно-воздушных баз"
 rom_air_2_desc: "Трансильвания - это обширный район с опасной местностью, мы должны развивать воздушные базы по всему региону, если мы хотим расширить наше влияние в Карпатском бассейне."
 ###
 rom_air_3: "Инвестирование в IRA"
 rom_air_3_desc: "ИАР является амбициозной и революционной компанией по развитию авиации, которая заинтересована в разработке новых моделей боевых действий для румынских военных."
 ###
 rom_air_4: "Изучение новых моделей бомбардировщиков"
 rom_air_4_desc: "Бомбардировщики проложат путь к победе наших войск на местах, мы должны обеспечить, чтобы у нас были самые современные и современные модели, если мы хотим эффективно использовать их в боевых действиях."
 ###
 rom_air_5: "Исследования КАС"
 rom_air_5_desc: "Мы должны обеспечить, чтобы наши войска на местах были в безопасности от воздуха, и поэтому мы должны уделять больше внимания исследованиям КАС."
 ###
 rom_air_6: "Инициатива Морской бомбардировщик"
 rom_air_6_desc: "Румынский флот не может выжить самостоятельно, и ему потребуется помощь с воздуха, если мы хотим сохранить контроль над Черным морем и за его пределами."
 ###
 rom_the_navy: "Румынский флот"
 rom_the_navy_desc: "Гордость румынского военно-морского флота была потеряна во время Великой войны, мы должны восстановить наш флот и верфи, чтобы обеспечить военно-морское господство."
 ###
 rom_new_ports: "Черноморские докеры"
 rom_new_ports_desc: "Румынские докьярды слаборазвиты и малы, мы должны расширить их, если мы хотим отстранить от наших врагов контроль над Черным морем."
 ###
 rom_rmr_nick: "Комиссия Р.М.Р. Николас"
 rom_rmr_nick_desc: "Принц Николас всегда мечтал вступить в Королевский флот, но ему никогда не даровали опертуанности, и постановка нового боевого корабля, названного в его честь, даст ему идеальный шанс жить в море и за пределами политической сферы."
 ###
 rom_carrier_research: "Исследования перевозчиков"
 rom_carrier_research_desc: "Самолеты являются гордостью любого современного военно-морского флота, строительство которого повысит наш глобальный престиж и позволит нам проецировать гораздо бо́льшую военно-морскую мощь по всей Европе."
 ###
 rom_battleships: "Исследования в области боевых действий"
 rom_battleships_desc: "Боевые корабли являются ключом к победе в открытом море, мы должны обеспечить, чтобы в нашем распоряжении были новейшие технологии и тактика, с тем чтобы мы могли победить наших более крупных оппонентов."
 ###
 rom_admiral_nick: "Пригласи принца Николая стать адмиралом."
 rom_admiral_nick_desc: "Не секрет, что принц Николас давно мечтал присоединиться к адмиралтейству, возможно, сейчас самое время, наконец, удовлетворить его просьбу и позволить ему прожить жизнь, которую он всегда хотел."
 ###
 rom_army_1: "Румынская армия"
 rom_army_1_desc: "Румынская армия проложила путь к победе во время Великой войны и последующих региональных конфликтов."
 ###
 rom_new_guns: "М1941"
 rom_new_guns_desc: "Большая часть нашей армии застряла с устаревшими служебными винтовками из "Великой войны", мы должны исследовать и изготовить новую винтовку, чтобы наши подразделения сохраняли способность эффективно бороться в предстоящих войнах."
 ###
 rom_wargames: "Организация военных игр"
 rom_wargames_desc: "Если наши войска будут сидеть и ничего не делать, это никоим образом не поможет нам, мы должны организовать военные игры, чтобы люди были заняты, пока вокруг нас развивается политическая ситуация."
 ###
 rom_evacuation_practice: "Королевская практика эвакуации"
 rom_evacuation_practice_desc: "Во время Великой войны, когда центральные державы прибыли в Бухарест, монархию поспешно заставили бежать из Румынии."
 ###
 rom_home_guard: "Учредить гвардию"
 rom_home_guard_desc: "Румыния является огромной страной с большим населением, мы должны использовать наших граждан для защиты страны, в которой они проживают."
 ###
 rom_special_forces: "Фонд специальных сил"
 rom_special_forces_desc: "Обычная пехота не подходит для таких конкретных операций, как парадрапы или морские вторжения, мы должны создать специальные подразделения для проведения этих опасных операций."
 ###
 rom_michaels_reign: "Конец регентства"
 rom_michaels_reign_desc: "Принцу Михаилу сейчас 16 лет, и наконец пришло время раздражать его как короля Румынии."
 ###
 rom_build_cabinet: "Построить кабинет"
 rom_build_cabinet_desc: "С уступкой Майкла на трон нам нужно построить кабинет министров, чтобы управлять правительством."
 ###
 rom_prepare_election: "Подготовка к выборам"
 rom_prepare_election_desc: "Румынское обетование требует, чтобы выборы проводились раз в четыре года, а 1937 год знаменует собой начало новых выборов."
 ###
 rom_stall_election: "Продолжить выборы"
 rom_stall_election_dessc: "Демократия - это хитрая вещь, и она может привести к популистским режимам. Мы временно отложим выборы до тех пор, пока не будет устранена угроза Железной гвардии, и тогда мы сможем безопасно возобновить выборы."
 ###
 rom_1937_election: "Результаты выборов"
 rom_1937_election_desc: "С завершением выборов мы увидим смену режима в румынском правительстве, к лучшему или к худшему."
 ###
 rom_iron_guard_win: "Железная гвардия в силе"
 rom_iron_guard_win_desc: "Железная гвардия выиграла выборы и заняла доминирующее положение в правительстве."
 ###
 rom_socdem_win: "Социальная демократия преобразуется"
 rom_socdem_win_desc: "Нынешнее правительство продвинулось вперед на выборах, и демократия остается огромной силой в Румынии."
 ###
 rom_free_education: "Бесплатное образование для всех"
 rom_free_education_desc: "Мы должны обеспечить, чтобы люди имели открытый доступ к образованию и чтобы ни одному ребенку не было отказано из-за финансовых ограничений."
 ###
 rom_increase_sufferage: "Продление голосования"
 rom_increase_sufferage_desc: "При Румынской конфедерации все мужчины в возрасте старше 25 лет имели право голоса."
 ###
 rom_welfare_programs: "Программы социального обеспечения"
 rom_welfare_programs_desc: "Благосостояние никогда не было в авангарде румынской политики, но с новым правительством приходит новая политика, и пришло время присматривать за нашими предметами, как мы должны были делать раньше."
 ###
 rom_soclib_win: "Социальная либерализм превзойдет"
 rom_soclib_win_desc: ""
 ###
 rom_marklib_win: "Рыночный либерализм"
 rom_marklib_win_desc: ""
 ###
 rom_soccon_win: "Социальная консерватория"
 rom_soccon_win_desc: ""
 ###
 rom_puppet_monarchy: "Кукольная монархия"
 rom_puppet_monarchy_desc: "Монархия стала всего лишь колючкой на нашей стороне, но она по-прежнему является маяком стабильности в стране."
 ###
 rom_end_monarchy: "Положить конец монархии"
 rom_end_monarchy_desc: "Монархия неконтролируема, ее необходимо положить конец, чтобы обеспечить долгосрочную стабильность в нашем новом режиме."
 ###
 rom_new_constitution: "Железная конституция"
 rom_new_constitution_desc: "Железная гвардия выбросила конституцию и разработала планы новой конституции, которая даст им почти неограниченный контроль над страной и позволит им более эффективно управлять."
 ###
 rom_bucharest_decree: "Бухарестский указ"
 rom_bucharest_decree_desc: "Железная гвардия издаст указ из Бухареста, объявляющий конец конституции, монархии и старого румынского государства."
 ###
 rom_end_dissent: "Разрушить все внутренние разногласия"
 rom_end_dissent_desc: ""
 ###
 rom_religion_fate: "Религиозный вопрос"
 rom_religion_fate_desc: "Религия - это реликвия старой Румынии, но ее нельзя просто отбросить в сторону."
 ###
 rom_national_industry: "Национальная промышленная индустрия"
 rom_national_industry_desc: "Румыния отчаянно нуждается в большем промышленном потенциале, и милитаризация нашей страны делает большую часть нашей рабочей силы максимальной. Граждане будут подготовлены таким образом, чтобы повысить скорость строительства по всей стране."
 ###
 rom_nick_coup: "Кубок принца Николаса"
 rom_nick_coup_desc: "Собрав преданные элементы как армии, так и военно-морского флота, принц Николас совершил переворот и сверг как демократическое правительство, так и короля Майкла."
 ###
 rom_consolidate_power: "Объединение правительственных властей"
 rom_consolidate_power_desc: "После того, как выборы отойдут от пути, мы можем начать укреплять власть в центральном правительстве."
 ###
 rom_kings_guard: "Учредить королевскую гвардию"
 rom_kings_guard_desc: "Легкость переворота Николая и попытки правительства захватить власть показали, насколько терпима ситуация в Румынии, мы должны создать лояльный полк людей, которые готовы отдать свою жизнь за нового короля."
 ###
 rom_iron_foriegn: "Расширение"
 rom_iron_foriegn_desc: "Румынское государство должно обеспечить безопасность своих границ, чтобы никто никогда не восстал против нашего превосходства над Балканами и Карпатами."
 ###
 rom_claim_transnistria: "Претензия по Приднестровью"
 rom_claim_transnistria_desc: "Приднестровский регион является богатым и экономически процветающим."
 ###
 rom_dismantle_hungary: "Украсить венгров"
 rom_dismantle_hungary_desc: "Партия Стрелевой крест угрожает подорвать стабильность в Карпатском регионе, и мы должны вновь вмешаться, чтобы восстановить порядок в Венгрии и предотвратить возникновение конфликта."
 ###
 rom_dismantle_serbia: "Разрушить Большую Сербию"
 rom_dismantle_serbia_desc: "Сербское государство растет слишком большим и мощным, и вскоре оно может поставить под сомнение нашу гегемонистскую позицию в балканской пененсуле."
 ###
 rom_german_embassy: "Создание посольства Германии"
 rom_german_embassy_desc: "Создание посольства Германии позволит облегчить связь и расширить сотрудничество между нашими двумя странами."
 ###
 rom_german_advisors: "Приглашать немецких военных советников"
 rom_german_advisors_desc: "Пригласив немецких военных советников, мы сможем профессионализировать нашу армию."
 ###
 rom_german_eco: "Экономическое сотрудничество с Германией"
 rom_german_eco_desc: "Немецкая экономика уже давно имеет власть в румынских землях, но с их поражением во время Великой войны многие немецкие фабрики были национализированы или переданы другим предшествующим державам. Пришло время подписать новый договор, который приблизит нас к Германии."
 ###
 rom_stahlpakt: "Присоединяйся к Штальпакту"
 rom_stahlpakt_desc: "Наши связи с Германией сблизили наши две нации как никогда, и следующим логическим шагом является вступление в военный союз с немцами против наших потенциальных врагов."
 ###
 rom_balkan_protect: "Защитник Балкан"
 rom_balkan_protect_desc: "В связи с ростом напряженности в Европе перед нами стояла задача защитить Балканы от внешних вторжений, и мы должны обеспечить, чтобы никакая великая держава не пыталась утвердить свое влияние в регионе и одолеть любого из наших географических братьев."
 ###
 rom_balkan_protect: "Защитник Балкан"
 rom_balkan_protect_desc: "Мы должны быть готовы защищать каждый дюйм Румынии от потенциальных захватчиков, крепости являются ключом к этому оборонительному менталитету."
 ###
 rom_reach_serbia: "Достучаться до Сербии"
 rom_reach_serbia_desc: "Большая сербская мечта была полностью реализована, и союз между нашими двумя нациями навсегда обеспечит безопасность Балкан."
 ###
 rom_restore_hungary: "Восстановление демократии в Венгрии"
 rom_restore_hungary_desc: "Партия Арроу Кросс угрожает разрушить стабильность в Карпатии, мы должны установить демократические силы в Венгрии и создать могущественного союзника на Западе."
 ###
 rom_french_alliance: "Возвращение Французского альянса"
 rom_french_alliance_desc: "Румыния во время Великой войны была неотъемлемой частью «Трипл Энтнет», и напряженность вновь усилилась в Европе, и, возможно, в наших наилучших интересах вновь укрепить связи с Францией в надежде на военную помощь."


 ### EVENTS ###

 rom.1.t: "Королевство Румыния"
 rom.1.d: ""
 rom.1.a: "Унижение будет возвышено!"
 ###
 rom.2.t: "Коронация короля Михаила"
 rom.2.d: " "
 rom.2.a: "Да здравствует король!"
 ###
 rom.3.t: "Результаты выборов"
 rom.3.d: " "
 rom.3.a: "Железная гвардия победила."
 rom.3.b: "Нынешнее правительство победило."
 ###
 rom.4.t: "Судьба религии"
 rom.4.d: " "
 rom.4.a: "Религии нет места в новой Румынии."
 rom.4.b: "Религия является неотъемлемой частью румынского общества."
 ###
 rom.5.t: "Румыния требует самоопределения"
 rom.5.d: "Новое румынское правительство направило нам список самых возмутительных требований, призывающих к независимости и самоопределению для всех несербов в нашей стране, а также к практическому концу сербского народа, который мы потратили на строительство последних трех десятилетий."
 rom.5.a: "Похоже, у нас нет другого выбора."
 rom.5.b: "Мы не зашли так далеко, чтобы быть демонтированными иностранной державой!"
 ###
 rom.6.t: "Сербия склоняется к нашим требованиям"
 rom.6.d: "Слабое сербское правительство, к нашему удивлению, приняло решение признать те требования, которые мы направили им несколько дней назад."
 rom.6.a: "Один враг на нашем пути."
 ###
 rom.7.t: "Сербия стоит противника!"
 rom.7.d: "Сербское правительство, к удивлению ни у кого, не отклонило наш список разумных требований."
 rom.7.a: "К оружию!"
 rom.7.b: "С другой стороны, возможно, это плохая идея."
 ###
 rom.8.t: "Коллапс Сербии"
 rom.8.d: "Сербское государство находится в процессе полного краха, и нам дали золотое преимущество."
 rom.8.a: "Схватить штаты!"
 rom.8.b: "Лучше не антагонизировать румын."
 ###
 rom.9.t: "Болгария пытается захватить Македонию!"
 rom.9.d: "Ранее сегодня из Скопье поступили сообщения о том, что болгарские солдаты маршируют в области Пирот и Македония."
 rom.9.a: "Мы не можем позволить себе войну с болгарами."
 rom.9.b: "У болгар нет шансов против наших сил."
 ###
 rom.10.t: "Сербия признает Македонию"
 rom.10.d: "Сербское правительство опубликовало официальное заявление о переходе районов Македонии и Пирота в Болгарию, их солдаты эвакуируют регион и мы взяли на себя прямой контроль над обоими государствами."
 rom.10.a: "На шаг ближе к великой болгарской мечте"
 ###
 rom.11.t: "Сербия стоит противника!"
 rom.11.d: "Несмотря на их ослабленное государство, сербское правительство отказалось уступить Македонию и Пироту, утверждая, что они будут защищать каждый дюйм Сербии до последнего человека, если потребуется."
 rom.11.a: "На войну!"
 rom.11.b: "Македония не стоит этих усилий."
 ###
 rom.12.t: "Румыния просит присоединиться к нашему альянсу."
 rom.12.d: "После нескольких месяцев экономического и политического сотрудничества Румыния, наконец, направила нам официальную просьбу присоединиться к Штальпакту."
 rom.12.a: "Нам нужна любая помощь, которую мы можем получить."
 rom.12.b: "Сейчас не время."
 ###
 rom.13.t: "Германия принимает нашу просьбу!"
 rom.13.d: "Мы получили официальное сообщение от посольства Германии в Бухаресте, нас официально приняли в Штальпакт, и теперь мы будем получать экономическую и военную помощь от Германии в случае войны на пороге войны, и сейчас мы обладаем гораздо большим политическим влиянием на Балканах и Карпатских горах."
 rom.13.a: "За светлое будущее, вместе!"
 ###
 rom.14.t: "Германия отклоняет нашу просьбу"
 rom.14.d: "К сожалению, на данный момент немцы, как представляется, отклонили нашу просьбу присоединиться к своему военному альянсу, хотя они и не привели конкретной причины, они заверили нас в том, что это лишь временная мера и что в будущем нам будет предоставлено место в их «большей Германии»."
 rom.14.a: "Это оскорбительно!"
 ###
 rom.15.t: "Румыния предлагает альянс"
 rom.15.d: "Сегодня к нам обращается демократическое румынское правительство, предлагающее военный союз с целью защиты обеих стран и, в более широком смысле, всего Балкан от внешнего вмешательства."
 rom.15.a: "Мы объединим руки с нашими румынскими братьями."
 rom.15.b: "Нам не нужна румынская помощь для реализации великой сербской мечты."
 ###
 rom.16.t: "Сербия присоединяется к нашему альянсу!"
 rom.16.d: "Сербское правительство официально приняло наше предложение о союзе, и теперь мы вместе как сила, с которой мы должны считаться на Балканах."
 rom.16.a: "К светлому будущему"
 ###
 rom.17.t: "Сербия отклоняет наше предложение"
 rom.17.d: "Сербское правительство, к сожалению, отклонило наше предложение о создании альянса, и сейчас мы остаемся одни в защите Балкан."
 rom.17.a: "Так нецивилизованно."
 ###
 rom.18.t: "Румыния хотела бы присоединиться к Соглашению"
 rom.18.d: "Сегодня румынское правительство обратилось к нам с официальной просьбой присоединиться к «Согласию», как это было два десятилетия назад во время Великой войны. Они должны увидеть нынешний путь Европы и растущую неизбежность новой мировой войны. Возможно, позволить им присоединиться к нашему альянсу отвечает нашим интересам."
 rom.18.a: "Братья по оружию снова."
 rom.18.b: "Это не что иное, как ответственность."
 ###
 rom.19.t: "Франция позволяет нам войти в континентальный союз!"
 rom.19.d: "Французы официально подписали нас в качестве члена континентальной энтнете, что наводит на мысль о том, что мы будем проявлять больше блеска по отношению к нам и подальше от растущей немецкой власти, и мы надеемся, что нам никогда не придется призывать наш союз к войне, но политическая ситуация в Европе делает эту перспективу весьма маловероятной."
 rom.19.a: "Братья по оружию снова."
 ###
 rom.20.t: "Франция отклоняет нашу просьбу"
 rom.20.d: "Французское правительство направило нам официальное письмо, отрицающее наше вступление в континентальный союз, они считают, что мы больше ответственны, чем ценный союзник, и предпочли бы держаться подальше от французских дел."
 rom.20.a: "Мы покажем им..."
 ###
 rom.21.t: "Монархия выражает свое недовольство"
 rom.21.d: "Наша временная отсрочка выборов, похоже, расстроила несколько членов королевской семьи, особенно принц Николас, который ушел, чтобы осудить наше так называемое "диктаторское" поведение."
 rom.21.a: "Дать Николасу должность в военно-морском флоте, чтобы убрать его с наших спин."
 rom.21.b: "Нам не нужно беспокоиться о идеях скромного принца."
 ###
 rom.22.t: "Принц Николас далее критикует правительство"
 rom.22.d: "Князь Николас еще больше укрепил свою позицию в отношении действий правительств, призвав членов парламента быть «жестокими» и «гриди», очевидно, что он суетится, и есть вероятность того, что он может предпринять действия против правительства, но попытка заставить принца замолчать может сделать нам еще хуже в долгосрочной перспективе."
 rom.22.a: "Надень на принца-изгоя..."
 rom.22.b: "Почему нас должно волновать, что он думает?"
 ###
 rom.23.t: "Принц Николас начинает переворот!"
 rom.23.d: "Похоже, что наше невежество наконец-то догнало нас, принц Николас собрал большую часть армии и штурмовал столицу Будапешта, свергнув действующее правительство. Внезапный поворот событий, затем он обратился в королевский дворец и начал провозглашать себя «Королем румын» на специальной церемонии, окруженной обломками и танками. Неизвестно, выжил ли король Майкл, однако было замечено, что несколько самолетов взлетели из близлежащего аэропорта, направляющегося на юг к Дунаю. Похоже, новый режим взял под свой контроль Румынию."
 rom.23.a: "Потрясающе!"
 ###
 rom.24.t: "Беспорядок в Трансильвании"
 rom.24.d: ""
 rom.24.a: "Пошлите войска, покончим с беспорядками!"
 rom.24.b: "Всё закончится вовремя."
 ###
 rom.25.t: "Волна в Трансильвании утихает."
 rom.25.d: ""
 rom.25.a: "Похоже, они узнали свое место."
 ###
 rom.26.t: "Революция в Трансильвании!"
 rom.26.d: ""
 rom.26.a: "Они будут сокрушены через несколько дней."
 rom.26.b: "Мы не можем позволить себе войну."
 ###
 rom.27.t: "Великая борьба"
 rom.27.d: ""
 rom.27.a: "Слава, Трансильвания!"
 ###
 rom.28.t: "Помощь от наших венгерских братьев"
 rom.28.d: ""
 rom.28.a: "Призовите их к оружию!"
 rom.28.b: "Нам не нужна их помощь, это будет торт."
 ###
 rom.29.t: "Трансильванский Револьт зовет нас к оружию!"
 rom.29.d: ""
 rom.29.a: "Мы должны обеспечить их успех на поле боя"
 rom.29.b: "Мы не будем тратить время солдат на их борьбу."
 ###
 rom.30.t: "Венгрия присоединяется к нашему делу"
 rom.30.d: ""
 rom.30.a: "Замечательно!"
 ###
 rom.31.t: "Венгрия отвергает наш призыв к оружию"
 rom.31.d: ""
 rom.31.a: "Это нехорошо..."


 ### IDEAS ###
 rom_armament: "Оружие"
 rom_armament_desc: "Уделение повышенного внимания производству оружия позволяет нам направить больше солдат и предоставить им всем новые винтовки."
 ###
 rom_fast_building: "Совершенствование методов строительства"
 rom_fast_building_desc: "Новые исследования привели к увеличению темпов гражданского строительства в нашей стране."
 ###
 rom_preserve_rom: "Защищайте большую Румынию"
 rom_preserve_rom_desc: "Наконец-то мы выполнили мечту Великой Румынии, и мы должны быть уверены в том, что любой ценой мы сохраняем это географическое превосходство."
 ###
 rom_militarism_idea: "Румынский милитаризм"
 rom_militarism_idea_desc: "Мы должны быть готовы к милитаризации нашего общества в защиту страны, и все должны служить так или иначе."
 ###
 rom_active_wargames: "Военные игры"
 rom_active_wargames_desc: "Войны по всей стране обучают наших людей реальному конфликту, и мы извлекаем много ценных уроков."
 ###
 rom_regency: "Редкость Майкла"
 rom_regency_desc: "Совет регентства председательствует в румынском правительстве до тех пор, пока Майкл не сможет взять корону в свой шестнадцатый день рождения, намеченный на 25 октября 1936 года."
 ###
 rom_constitution: "Железная конституция"
 rom_constitution_desc: "Железная гвардия разработала новое положение, в котором говорится о том, как будет функционировать нация, что дает им большую степень контроля над каждым аспектом нации."
 ###
 rom_full_control: "Абсолютный контроль"
 rom_full_control_desc: "Железная гвардия взяла под свой абсолютный контроль страну; их солдаты патрулируют улицы Бухареста и терроризируют сердца всех тех, кто хотел бы инакомыслить против правительства."
 ###
 rom_purge_dissent: "Очищенное развлечение"
 rom_purge_dissent_desc: ""
 ###
 rom_seize_god: "Изъятие религиозных ценностей"
 rom_seize_god_desc: "Правительство захватило религиозные ценности по всей стране, грабив церкви и забирая богатство у монументов по всей стране."
 ###
 rom_national_industry_idea: "Национализированная промышленность"
 rom_national_industry_idea_desc: "Румыния должна действовать как единое целое, если мы хотим защитить земли, которыми мы сейчас занимаемся, граждане будут строить новые фабрики для поддержки военных усилий как внутри страны, так и за рубежом."
 ###
 rom_german_advisors_idea: "Немецкие военные советники"
 rom_german_advisors_idea_desc: "Советники из Германии резко повышают качество нашей армии."
 ###
 rom_balkan_defend: "Защитник Балкан"
 rom_balkan_defend_desc: "Мы должны быть готовы защищать каждый дюйм Румынии от потенциальных захватчиков, крепости являются ключом к этому оборонительному менталитету."
 ###
 rom_free_education_idea: "Программы бесплатного образования"
 rom_free_education_idea_desc: "В настоящее время проводится прогрессивная новая политика в области образования, направленная на обеспечение того, чтобы все румынские граждане отстаивали высокий уровень обучения."
 ###
 rom_welfare: "Программы социального обеспечения"
 rom_welfare_desc: "Созданы системы социальной защиты для обеспечения того, чтобы ни один из наших граждан не ускользнул в невозобновимую нищету и не стал оттоком средств для экономики и общества."
 ###
 rom_revenge: "Поездки в Бухарест"
 rom_revenge_desc: "Венгерцы нанесли целенаправленный удар по Бухаресту, нашей славной столице, с целью снести его до земли, и это нападение поразило сердце всех румын, и пока наши солдаты будут сражаться с еще большей жестокостью."



 ### TOOLTIPS ###

 rom_nicks_ship: "В Черное море будет запущен боевой корабль Р.М.Р. Николаса, а сам принц Николас будет у руля."
 ###
 rom_evac: "Королевская семья будет в безопасности в случае переворота или заговора против монархии."
 ###
 rom_militias: "Мы вооружим ополчения через сельскую местность, готовые подняться, если оккупационные силы вторгнутся на нашу территорию."
 ###
 rom_bye_nick: "Принц Николас проживет свою жизнь адмирала в румынском флоте, вдали от политики."
 ###
 rom_kingsguard: "Королевская гвардия будет защищать короля Николаса до смерти."
 ###
 rom_trans_dead: "Это сделает наше правительство крайне слабым и неспособным..."
 ###
 TRA_revolt: "Трансильванские венгры восстанут по всему региону."


