 #Decisions
 SPR_civil_war: "Гражданская война в Испании"
 SPR_civil_war_desc: "Испанская гражданская война, начавшаяся в декабре 1935 года в результате неудачного переворота консерваторов-монархистов против Республики, привела к восстанию четырех сторон: Народного фронта, монархистов, националистов и республиканцев."

 SCW_partisans_monarchy_1: "Южное сопротивление"
 SCW_partisans_monarchy_1_desc: "Люди на юге Испании не вполне удовлетворены тем, что их нынешние оккупанты правят этим районом."

 SCW_partisans_monarchy_2: "Сопротивление экстремадура"
 SCW_partisans_monarchy_2_desc: "Возможно, мы сможем убедить их, что наша сторона будет лучше для них?"

 SCW_partisans_popular_front_1: "Сопротивление Валенсии"
 SCW_partisans_popular_front_1_desc: "Люди в Валенсии не полностью удовлетворены тем, что их нынешние оккупанты правят этим районом, может, мы сможем убедить их, что наша сторона будет лучше для них?"

 SCW_partisans_popular_front_2: "Сопротивление Арагону"
 SCW_partisans_popular_front_2_desc: "Люди в Арагоне не вполне удовлетворены тем, что их нынешние оккупанты правят этим районом."

 SCW_partisans_republic_1: "Сопротивление Ла-Манча"
 SCW_partisans_republic_1_desc: "Люди в Ла Менче не вполне удовлетворены нынешним правлением своих оккупантов над этим районом."

 SCW_partisans_republic_2: "Сопротивление кастиллу"
 SCW_partisans_republic_2_desc: "Возможно, мы сможем убедить их, что наша сторона будет лучше для них?"

 SCW_partisans_falangists_1: "Сопротивление Леона"
