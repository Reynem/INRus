 SPR_london_crash_hits_spain_flag: "Лондонский Крэш убил Испанию"
 SPR_spanish_civil_war_ended_flag: "Гражданская война в Испании закончилась"

 #Ideas
 SPR_SPM_SPF_SPA_spanish_civil_war_idea: "Гражданская война в Испании"
 SPR_SPM_SPF_SPA_spanish_civil_war_idea_desc: "Гражданская война началась в Испании, четыре стороны стремятся обеспечить победу в этой войне, республиканцы, монархисты, националисты и социалисты, у всех есть шанс выиграть этот конфликт, который разделил полуостров."
 SPR_SPM_SPF_SPA_prolonged_recession_idea: "Продолжительная рецессия"
 SPR_SPM_SPF_SPA_prolonged_recession_idea_desc: "С начала диктатуры Мигеля Примо де Ривера Испания переживает спад, хотя реформы Мануэля Азанья имели некоторые положительные последствия, последствия переворота привели к тому, что страна попала в рецессию, от которой ей еще предстоит оправиться."

 SPR_SPM_SPF_SPA_london_crash_idea: "Экономическая депрессия"
 SPR_SPM_SPF_SPA_london_crash_idea_desc: "Крушение Лондонского фондового рынка усугубило последствия нашего экономического спада."

 SPAIN_very_low_recognition_idea: "Очень низкое международное признание"
 SPAIN_very_low_recognition_idea_desc: "Немногие зарубежные страны признают наше правительство настоящим правительством Испании, даже если наша фракция выиграла войну, кажется, что нас признают только те страны, которые поддержали нас."
 SPAIN_low_recognition_idea: "Низкое международное признание"
 SPAIN_low_recognition_idea_desc: "В то время как все больше стран начали признавать наше правительство как подлинное правительство Испании, многие еще не признали нас, но, хотя многие не признают нас, признание притворных правительств близко к нулю."
 SPAIN_medium_recognition_idea: "Умеренное международное признание"
 SPAIN_medium_recognition_idea_desc: "Мы близки к тому, чтобы увидеть половину стран мира, которые признают нас подлинным правительством Испании, даже если сторонники других группировок не признают нас законными, их вера в их предпочтительное правительство почти исчезла."
 SPAIN_high_recognition_idea: "Растущее международное признание"
 SPAIN_high_recognition_idea_desc: "Большинство стран считают нас единственным законным правительством Испании, и даже если они не хотят торговать с нами или поддерживать отношения, они считают нас более легитимными, чем другие группировки."

 #Events
 scw.1.t: "Уничтожение Республики"
 scw.1.d: "Испанская гражданская война пошла против нашей благосклонности, с Испанской Республикой, которая контролировала Мадрид, упала не так давно. Повстанческие движения начали переходить в Танжер, но наша близость к ней может отрезать повстанческие силы и позволить нам создать республиканское правительство в изгнании, что нанесет ущерб отношениям с победителем войны, но позволит нам сохранить претензии в отношении региона."

 scw.2.t: "Гражданская война заканчивается"
 scw.2.d: "Когда пыль утихла, мы вышли на вершину, единственное республиканское правительство, у нас остались сломанная нация, люди и промышленность, и процесс восстановления будет одним из самых трудных, что когда-либо видела нация, но сегодня Испания может вместе сказать, что он был победен."

 scw.3.t: "Гражданская война заканчивается"
 scw.3.d: "Когда пыль утихла, мы вышли на вершину, единственное и единственное национальное правительство, у нас остались сломанная нация, люди и промышленность, и процесс восстановления будет одним из самых трудных, что когда-либо видела нация, но сегодня Испания может вместе сказать, что он был победен."

 scw.4.t: "Гражданская война заканчивается"
 scw.4.d: "Когда пыль утихла, мы вышли на вершину, одно и единственное народное правительство, мы остались с разбитой нацией, людьми и промышленностью, и процесс восстановления будет одним из самых трудных, что когда-либо видела нация, но сегодня Испания может вместе сказать, что она победила."

 scw.5.t: "Гражданская война заканчивается"
 scw.5.d: "Когда пыль осела, мы вышли на вершину, единственное и единственное монархистское правительство, мы остались с разбитой нацией, людьми и промышленностью, и процесс восстановления будет одним из самых трудных, что когда-либо видела нация, но сегодня Испания может вместе сказать, что он был побежден."

 scw.6.t: "Крушение Лондонского фондового рынка"
 scw.6.d: "С учетом того, что главным и единственным источником дохода является Соединенное Королевство, их недавняя экономическая депрессия привела к тому, что их поддержка была отрезана еще хуже, чем их прекращение во время индийского револьта. Наша и без того разрушенная экономика была объявлена многими экономистами мертвой, а поддержка войны в целом внутри страны находится на самом низком уровне. Многие в нашей стране говорят нам сдаться, и «Королевство должно быть похоронено раз и навсегда!»."
 scw.6.a: "Это действительно конец..."
