 undisturbed_isolation: "Прекрасная изоляция"
 undisturbed_isolation_desc: "С победой в Великой войне Великобритания вновь отошла в изоляцию, чтобы управлять своей империей и избегать дальнейших запутаний на европейском континенте. С началом политических событий в Британской Индии и колониальной Африке внимание Британской империи сосредоточено исключительно на внутренних делах."

 ENG_ireland_integrated: "Ирландия успешно интегрирована"
 ENG_irish_strain_relieved: "Ирландский мир"

 ENG_pax_brittania: "&quot; Пакс Британия &quot;"
 ENG_pax_brittania_desc: "Соединенное Королевство Великобритании и Ирландии стоит на вершине мира. От двух державного стандарта до статуса мастерской в мире, до обладателя крупнейшей империи, которую когда-либо видел мир, можно только точно назвать Великобританию глобальным гегемоном. Однако некоторые опасаются, что такое положение дел может закончиться, а Европа угрожает объединиться под французским или немецким ботинком, призраком социализма, призраком которого от российской тайги до Британских островов, ирландский национализм, подъем США, колониальные беспорядки и, конечно же, проблемы на фондовом рынке. Британия может столкнуться с проблемой на несколько лет впереди нее, но ее народ и ее король надеются увидеть сохранение нынешнего величия Британии."

 ENG_col_unrest: "Колониальные волнения"
 ENG_col_unrest_desc: "Плохие условия в наших колониальных арсеналах привели к тому, что несколько движений за независимость привлекли к себе широкое внимание со стороны местных жителей."
 ENG_col_uprising: "Колониальное восстание"
 ENG_col_uprising_desc: "Крупномасштабное восстание против британского правления в Африке, если не подавить его быстро, оно может распространиться на всю имперскую территорию."
 ENG_col_uprising1: "Колониальное восстание"
 ENG_col_uprising1_desc: "Крупномасштабное восстание против британского правления в Африке, если не подавить его быстро, оно может распространиться на всю имперскую территорию."
 ENG_col_uprising2: "Колониальное восстание"
 ENG_col_uprising2_desc: "Крупномасштабное восстание против британского правления в Африке, если не подавить его быстро, оно может распространиться на всю имперскую территорию."

 ENG_col_uprising_france: "Восточная Африка во пламени"
 ENG_col_uprising_france_desc: "Поддержка Францией восстания в Восточной Африке значительно усугубила положение в нашем имуществе Восточной Африки."

 ENG_war_fatigue: "Наследие Великой войны"
 ENG_war_fatigue_desc: "На полях Фландрии поп-пехоты дуют на кресты, круглые ряды, и на небе пятна, все еще храбрые певцы, мухи, мухи, мухи, слышащие среди пушек внизу. ~Нет, мы мертвы. Короткие дни назад. ~Но мы жили, чувствовали рассвет, видели закат, любили и были любимы, и теперь мы лжём, ~ на полях Фландерса. ~ ~ ~ Возьмемся за нашу ссору с врагом: ~Нет, если вы не справитесь с руками, мы выкинем его наверху. ~ ~ Если вы поверите нам, которые умрут, ~ мы не будем спать, хоть поппии растут ~ в полях Фландрии."

 ENG_jarrow: "Коранный поход в Джарроу"
 ENG_jarrow_desc: "В связи с закрытием нескольких фабрик в городе Тинсайд Джэрроу многие мужчины организовали марш в Лондон, где они намереваются подать правительству петицию о восстановлении городской промышленности."
 ENG_jarrow2: "Коранный поход в Джарроу"
 ENG_jarrow2_desc: "В связи с закрытием нескольких фабрик в городе Тинсайд Джэрроу многие мужчины организовали марш в Лондон, где они намереваются подать правительству петицию о восстановлении городской промышленности."
 ENG_jarrow3: "Коранный поход в Джарроу"
 ENG_jarrow3_desc: "В связи с закрытием нескольких фабрик в городе Тинсайд Джэрроу многие мужчины организовали марш в Лондон, где они намереваются подать правительству петицию о восстановлении городской промышленности."

 manchester_strike: "Забастовка рабочих манчестерских заводов"
 manchester_strike_desc: "Недовольные работники, появившиеся в мельничной промышленности по всему Манчестеру, устроили выезд в знак протеста против политики правительства."
 ENG_general_strike: "Общий удар"
 ENG_general_strike_desc: "В ответ на бездействие правительства в ответ на забастовку, произошедшую в Манчестере-Милле, местные профсоюзы начали создавать проблемы по всей стране."
 ENG_civil_unrest: "Гражданские беспорядки"
 ENG_civil_unrest_desc: "Развертывание военных подразделений для подавления беспорядков в крупных городах привело к де-факто гражданским беспорядкам в крупных городах Британских островов."
 ENG_revolution: "Революция"
 ENG_return_to_normalcy: "Политическая капитуляция"

 ENG_bw: "Лондонский рынок"
 ENG_bw_desc: "Экономический кризис в отличие от того, что мы когда-либо видели. После ужасной недели на Лондонской фондовой бирже и последующих недель продолжающейся катастрофии экономика как Великобритании, так и Империи находится в руинах. Спрос на товары стал ровным, предприятия по всей стране закрываются, а уровень безработицы растет. Этот кризис будет ощущаться на протяжении многих лет."
