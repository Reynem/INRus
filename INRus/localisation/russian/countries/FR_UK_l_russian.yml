 #Colony Ideas
 BRICOL_british_colony_loc: "Колония Короны"
 BRICOL_british_colony_loc_desc: "Это лишь аппендицит Британской империи, где ее истинной исполнительной властью является губернатор и весь политический аппарат, имеющий империю. Эта земля получает выгоду от британского финансирования, защиты и институтов, однако местная власть в правительстве практически не существует, как и национальный суверенитет, и эта власть принадлежит Лондону с точки зрения внешней политики. ~ nn-Opinion в этом состоянии дел варьируется от поддержки, апатии, радикальной оппозиции, в зависимости от многих социальных и экономических факторов, хотя и без радикальных изменений на вершине Империи, это состояние дел является постоянным."
 BRICOL_gulf_subject: "Защитник Персидского залива Великобритании"
 BRICOL_gulf_subject_desc: "Привязанная к Британской империи через византийское сочетание договоров и соглашений, эта политика является протекторатом Британской империи с ее внешней политикой, подчиняющейся Лондону. В отличие от многих других британских «защитников», эта политика является подлинным протекторатом, а не просто колонией под другим именем. Поэтому ее статус как части Империи не обязательно означает подлинное участие в делах Великобритании, хотя они быстро прибегнут к просьбе о защите Великобритании в случае нападения."
 #
 BRICOL_british_colony_egypt: "Британское доминирование"
 BRICOL_british_colony_egypt_desc: "Несмотря на то, что формально Египет является независимой страной, в ситуации, которая недавно была официально закреплена в англо-египетском договоре, он находится под британской оккупацией и остается дефакто субъектом Великобритании. &lt; &lt; Националистические чувства &gt; &gt; растут с каждым днем, и время покажет, сохраняется ли такое положение дел."
 #
 BRICOL_zanzibar_minorityrule: "Правило арабского меньшинства"
 BRICOL_zanzibar_minorityrule_desc: "В 1856 году наследники оманской королевской семьи разделили Оман и Занзибар на две сеператные области: с тех пор арабская королевская семья и правящий класс возглавляют большинство африканских островов, расположенных к югу от Сахары."
 #
 BCL_askari: "Коренные жители"
 BCL_settler_forces: "Полагайтесь на поселенцев"
 BCL_settler_forces_desc: "В настоящее время мы в значительной степени зависим от белых поселенцев на наших территориях наряду с мужчинами из самой Британии."
 BCL_settler_forces_2: "Колониальная армия"
 BCL_settler_forces_2_desc: "В настоящее время мы в значительной степени зависим от белых поселенцев на наших территориях наряду с мужчинами из самой Британии."
 BCL_prussian_discipline: "Дисциплинарные силы"
 BCL_colonial_youth_idea: "Колониальная молодежь"
 BCL_special_forces: "Колониальные специальные силы"
 BCL_native_officers_idea: "Местные сотрудники"
 BCL_indigenous_trackers_idea: "Коренные трекеры"
 BCL_native_cavalry_idea: "Коренная кавалерия"

 ##Focuses##
 BCL_colonial_army: "Расширение колониальных вспомогательных сил"
 BCL_colonial_army_desc: "Будучи далеко от материковой Британии, нам трудно полностью полагаться на британскую армию, по этой причине мы сильно полагаемся на местные войска и любые подкрепления из нашей страны, мы должны стремиться к расширению этих местных сил."
 BCL_askari_forces: "Вербовка коренного населения"
 BCL_askari_forces_desc: "Местные жители должны стать основой наших колониальных вооруженных сил, а местные жители должны быть обучены следовать приказам без каких-либо вопросов и иметь наилучшую дисциплину из всех колониальных сил, мы должны расширить нашу колониальную армию путем вербовки не только поселенцев."
 BCL_rely_on_settlers: "Возвращайтесь к поселенцам"
 BCL_rely_on_settlers_desc: "Несмотря на то, что местные жители допустили большую силу, мы сможем создать лояльную и спартанскую силу путем вербовки у поселенцев."
 BCL_mainland_officers: "Пригласить сотрудников по основным районам"
 BCL_mainland_officers_desc: "Мы должны обратиться в колониальный офис с просьбой послать больше офицеров из Великобритании, чтобы помочь улучшить армию нашей страны." 
 BCL_study_german_doctrines: "Изучение британской доктрины"
 BCL_study_german_doctrines_desc: "Британская доктрина выиграла великую войну и выиграет следующую!"
 BCL_prussian_discipline: "Спартанская сила"
 BCL_prussian_discipline_desc: "Мы должны обеспечить, чтобы наша маленькая армия была как можно более эффективной в форме Спарты или Пруссии - каждый солдат должен хвастаться своей винтовкой, как чистить свой набор, как стоять под огнем!"
 BCL_colonial_youth: "Милитаризировать колониальную молодежь"
 BCL_colonial_youth_desc: "Среди многих поселенцев в нашей стране есть сыновья и дочери землевладельцев и колонистов, вместе они образуют молодежные группы, такие как скауты, и вместе храбрые пустыни Темного континента, если они будут милитаризованы, они могут оказать большую помощь нашим военным."
 BCL_small_but_elite: "Тренировать элитов"
 BCL_small_but_elite_desc: "Хотя наш подход к военным действительно означает, что наши силы гораздо меньше, чем они могли бы быть, но это не остановит нас от высокой профессиональной армии."
 BCL_native_officers: "Набор сотрудников из числа коренного населения"
 BCL_native_officers_desc: "Хотя британские офицеры лучше всего, для нас слишком много местных полков, для которых есть офицеры на материке."
 BCL_indigenous_trackers: "Наймите внезапных трекеров"
 BCL_indigenous_trackers_desc: "Земля Темного континента все еще может быть неизвестна нам, англоязычным, но есть множество местных трекеров и путеводителей, которые знают этот район как заднюю часть своей руки."
 BCL_horsemen_focus: "Коренные кавалерии"
 BCL_horsemen_focus_desc: "Лошадь является жизненно важной частью жизни на обширных африканских равнинах, особенно в центральной и южной частях Африки."
 BCL_local_levies: "Местные войска &lt; &lt; Леви &gt; &gt;"
 BCL_local_levies_desc: "Самое большое количество туземцев в наших колониях по сравнению с нашими колонистами, более того, туземцы готовы сражаться за нас, если мы будем уважать их права и уважать их традиции, мы не должны позволять этим драгоценным людям тратить напрасную трату - мы должны вложить этих туземцев в нашу армию."
 BCL_lions_of_africa: "Коренные силы"
 BCL_lions_of_africa_desc: "Вместе с нашими новыми союзниками и колониями мы покорим всю Африку, если понадобится!"
 BCL_an_african_army: "Британская колониальная армия"
 BCL_an_african_army_desc: "Мы не просто армия, мы армия колоний, британские колонии, мы должны создать совершенно новую, модернизированную армию, стоящая армии Африки."
 BCL_pioneer_airdrop_techniques: "Перспективные методы"
 BCL_pioneer_airdrop_techniques_desc: "На современном поле боя солдат является ключом, но простой акт передачи солдату винтовки и ожидания, что он обвинит его, не всегда приведет к победе. Многие в британских колониях, видя огромные пустые равнины в качестве обширных тренировочных площадок, начали испытания новых, более крупных самолетов, с которых люди сбрасывались, используя аварийные парашюты, за вражескими линиями."
 BCL_improve_logistics: "Совершенствование материально-технического обеспечения армии"
 BCL_improve_logistics_desc: "На обширных равнинах Африки имеется мало поставок и материально-технического обеспечения."
 BCL_heavy_artillery: "Совершенствование тяжелой артиллерии"
 BCL_heavy_artillery_desc: "Все знают силу артиллерии в современной войне, ее мощь и девстанция не должны игнорироваться, и мы не должны отставать в ее развитии."
 BCL_motorised_cavalry: "Всадники равнин"
 BCL_motorised_cavalry_desc: "Большие равнины Африки оказались проблемой, когда речь идет о быстром движении из одного места в другое. Хотя железные дороги могут решить эту проблему, нам нужны наши войска, чтобы добраться до любого места. С развитием грузовиков и фургонов, созданных для ведения войны в пустыне, мы должны быть в состоянии решить эту проблему."
 BCL_airforce: "Колониальные военно-воздушные силы"
 BCL_airforce_desc: "В связи с расширением армии возникает только смысл в том, что мы должны также расширить наши крайне слаборазвитые военно-воздушные силы."
 BCL_fighter_focus: "Изучение британских боев"
 BCL_fighter_focus_desc: "С учетом того, что самолеты становятся ключевым элементом во время боевых действий, мы должны обеспечить, чтобы наши собственные бойцы не отставали от времени, мы должны учиться у других, изучая их планы."
 BCL_unified_doctrine: "Единые доктрины воздушного пространства"
 BCL_unified_doctrine_desc: "При очень незначительной согласованности между нашими многочисленными небольшими ветвями военно-воздушных сил мы должны создать единое воздушное командование и стремиться к созданию единой авиационной доктрины."
 BCL_air_radio: "Радиовещательная станция"
 BCL_air_radio_desc: "Мы далеко от Британии, и скоростная связь практически невозможна, но благодаря изобретениям радио, мы можем дозвониться до наших британских товарищей из-за моря, мы должны построить в столице нашу станцию искусственных радиостанций."
 BCL_bomber_command: "Командование колониальным бомбардировщиком"
 BCL_bomber_command_desc: "Бомбардировщики, бомбардировщики, бомбардировщики - будущее воздушной войны, мы должны расширить наш флот бомбардировщиков, чтобы помочь нам подготовиться к предстоящим войнам."
 BCL_german_codes: "Британские циферы"
 BCL_german_codes_desc: "Коды и шифры новички в войне, но они имеют огромное значение. Если мы отправим интеллектуалов обратно в Великобританию для изучения того, как мы можем улучшить наши возможности в области кодирования, это должно значительно улучшить нашу тайну."
 BCL_cas_focus: "Разработать систему поддержки непосредственного воздушного сообщения"
 BCL_cas_focus_desc: "Совместные пехотно-воздушные наступательные операции становятся все более и более важными в наземной войне."
 BCL_bomber_escorts_focus: "Сопровождение бомбардировщиков"
 BCL_bomber_escorts_focus_desc: "Наши бомбардировщики не смогут даже взлететь, если наш враг сможет немедленно их отобрать - мы должны вложить средства в эскорт бомбардировщиков, чтобы мало что потратило впустую."
 BCL_colonial_pilot_schools: "Кадетская школа кадетов"
 BCL_colonial_pilot_schools_desc: "Без согласованности в том, как наших кадетов учат летать, мы не сможем обеспечить согласованность с нашими пилотами." 
 BCL_aeronautic_research: "Институт аэронавтических исследований"
 BCL_aeronautic_research_desc: "Учитывая все предоставленные нам военные расходы, мы могли бы также разумно использовать их - давайте создадим конкретный аэронавтический раздел НИОКР нашего военного исследовательского института."
 BCL_camelry: "Бригада имперских верблюжьих корпусов"
 BCL_camelry_desc: "Мы должны использовать большое количество верблюдов в нашей стране, чтобы направить силы, готовые к местности нашей колонии!"

