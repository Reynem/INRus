 ENG_power_balance: "Баланс сил"
 ENG_lon: "Лига Наций"
 ENG_peace_time: "Мир в наше время"

 #Royal Intelligence

 ENG_royal_intel: "Королевская разведка"
 ENG_five_eyes: "Соглашение о пяти очках"
 ENG_international_ops: "Международные операции"

 #Naval Imperialism

 ENG_london_conf: "Лондонская морская конференция"
 ENG_london_conf_desc: "Изначально подписанный в априле 1930 года между нами, Португалией и Грецией, Лондонский военно-морский договор крайне нуждается в ратификации и расширении."
 ENG_london_exp1: "Приглашать новых членов"
 ENG_london_exp2: "Расширение членского состава"
 ENG_jutland_pact: "Соглашение о военно-морском флоте в Ютланде"
 ENG_dover_pact: "Морское соглашение &lt; &lt; Дувер &gt; &gt;"

 #Imperialism

 ENG_imperialism_focus: "Имперские бремя"
 ENG_imperialism_focus_desc: "Бог призвал британцев привести цивилизацию во все уголки земного шара, избавить варваров мира от тьмы к свету. Мы факел во тьме, свет в пустоте варварства. Ради человечества мы не должны потерпеть неудачу."

 ENG_euro_focus: "Империализм"

 ENG_dip_denmark: "Обезопасить Датские проливы"
 ENG_natlantic_trade: "Торговля в Северной Атлантике"
 ENG_dip_norway: "Норвежские военно-морские гарантии"
 ENG_dip_sweden: "Шведские гарантии"
 ENG_scapa_defences: "Защита от капусты"

 ENG_fortify_gib: "Укрепить гибралтер"
 ENG_dip_portugal: "Англо-португальские отношения"
 ENG_dip_portugal_desc: "Возможно, один из старейших альянсов в истории, наши тесные отношения с Португалией поддерживались на протяжении веков, даже несмотря на наихудший из наших дипломатических кризисов, таких, как &lt; &lt; Добыча розовой карты &gt; &gt; . По мере ослабления нашего влияния на континент мы должны связаться с нашими союзниками и подтвердить наши альянсы."
 ENG_dip_spain: "Испанские возможности"
 ENG_fortify_cyp: "Укрепление Кипра"
 ENG_dip_hellas: "Привязка Hellas"
 ENG_dip_hellas_desc: "После окончания Великой войны греческая нация была одной из немногих областей, где наше влияние остается сильным."

 ENG_dip_dutch: "Англо-голландские отношения"
 ENG_dip_rhine: "Гарантировать ренистскую независимость"
 ENG_dip_panama: "Захват Панамского канала"
 ENG_dip_panama_desc: "Если американцы намерены бросить вызов нашему влиянию на Тихий океан, то мы должны принять меры для реагирования на эту угрозу. Панамский канал является стратегически важной целью в Центральной Америке, и если мы хотим захватить его силой, то это послужит мощным сигналом правительству США."
 ENG_reinforce_canada: "Укрепление канадской границы"
 ENG_reinforce_canada_desc: "С ростом вероятности войны между нами и Соединенными Штатами многие считают, что пришло время еще больше укрепить канадскую границу с США."
 ENG_monroe: "В ад с Монро"
 ENG_monroe_desc: "Доктрина Монро — это нелепое утверждение, которое американцы не могут навязывать другим странам."
 ENG_take_alaska: "Спрос на территории Аляски"
 ENG_take_alaska_desc: "Поскольку многие изыскатели ресурсов сообщают, что на Аляске имеются нефтяные месторождения, разбросанные по всей территории, мы решили, что эта земля должна быть поставлена под наш контроль, если мы хотим распространить наше влияние на всю Америку. Это будет первым подлинным испытанием правительства США, и они, скорее всего, откажутся от наших требований."
 ENG_dip_usa: "Преодоление старых ошибок"
 ENG_dip_usa_desc: "Более 150 лет назад американские повстанцы освободились от нашего правления с помощью французов. Сегодня мы вновь стоим на пороге подтверждения нашего господства над Северной Америкой, французы отвлекаются от немцев и у нас появилась возможность, созданная Великой депрессией, уничтожить американцев и укрепить нашу власть."
 ENG_dip_france: "Старая оплошность"
 ENG_dip_france_desc: "Англо-французская рыцарская риваля оставалась в основном неизменной на протяжении нескольких веков, Великая война ознаменовала собой первый исход этого конфликта, но не его конца. Вскоре после окончания Великой войны Франция вновь вернулась к своим старым трюкам. Англо-французское соперничество еще живо, и мы должны обеспечить нашу победу над Францией."
 ENG_final_struggle: "Последняя борьба"
 ENG_final_struggle_desc: "Наше соперничество с Францией не может - не будет - продолжаться. Франция должна быть побеждена, Франция должна быть оккупирована, Франция должна быть разрушена."
 ENG_dip_germany: "Англо-германские разногласия"
 ENG_dip_germany_desc: "Несмотря на нанесение увечий в ходе Великой войны, нынешнее правительство Германии и немецкий народ обвиняют Великобританию в их сегодняшних проблемах и в мирном договоре, который был им навязан."
 ENG_attack_germany: "Расчленить Германию"
 ENG_attack_germany_desc: "В последние годы стало очевидно, что Договор, навязанный немцам в конце Великой войны, не зашел достаточно далеко. Германия вновь возрождается в Европе и вновь угрожает господству нашей нации. На этот раз Германия должна быть полностью занята и уничтожена во имя мира в Европе."
 ENG_dip_belgium: "Возобновление Лондонского договора"
 ENG_dip_belgium_desc: "Подписанный в 1839 году между Бельгией и Нидерландами, по настоянию самих себя и ряда других Великих держав в Европе, договор обеспечивал не только постоянную безопасность Бельгии, но и наше влияние на их правительство."


 ENG_colonialism: "Колониализм"

 ENG_cape_cairo: "Кейп-Каирская железная дорога"
 ENG_cape_cairo_desc: "Несмотря на то, что Великая война началась в конце 19-го года, она приостановила все планы в отношении планируемой железнодорожной магистрали мыс до Каира, а с нашей новой экономической силой после крушения Лондонского фондового рынка многие считают, что настало время завершить строительство этой железной дороги, тем самым связывая всю британскую Африку."
 ENG_dip_arabia: "Доставить Аравию в Хель"
 ENG_dip_arabia_desc: "В то время как хашимиты контролируют всю Аравию и дополнительную территорию, на самом деле они практически не держатся, пока ЛМСК не будут в значительной степени зависеть от нашего влияния как в экономическом, так и в военном плане, хотя в последнее время они обманывают себя, считая, что не нуждаются в нашей помощи."
 ENG_dip_iraq: "Стабильность мезопотамии"
 ENG_dip_iraq_desc: "Для обеспечения нашего постоянного влияния на Ближний Восток мы должны обеспечить безопасность Ирака силой, если это необходимо."
 ENG_dip_persia: "Обеспечение безопасности персидской нефти"
 ENG_dip_persia_desc: "Несмотря на то, что мы подписали со персидским правительством многие договоры, касающиеся доступа к их нефтяным месторождениям, в последние годы они стали все более враждебными по отношению к нашему участию, которое они считают лишь иностранным влиянием на их внутренние дела, и они должны помнить о важности британского влияния в регионе."
 ENG_cape_calcutta: "Мыс - Калкутта Железнодорожный транспорт"
 ENG_cape_calcutta_desc: "При наличии наземной границы между Каиром и Раджем мы можем создать еще более амбициозную железнодорожную систему, чем в Африке, железную дорогу &lt; &lt; мыс до Каира &gt; &gt; и Калькутта, тем самым увязав наши африканские и индийские владения, а также недавно приобретенные территории вместе, что позволит быстро развертывать британскую армию, когда это необходимо."
 ENG_defend_singapore: "Сингапурская оборона"
 ENG_defend_singapore_desc: "Жизненно важное стратегическое место, часто называемое «Гибралтаром Востока», — значение Сингапура для торговли на Дальнем Востоке невероятно. Если мы хотим еще больше расширить нашу мощь, мы должны укрепить этот важный регион, чтобы обеспечить его постоянную безопасность."
 ENG_dip_eindies: "Контроль над Ист-Индией"
 ENG_dip_siam: "Удаление заключительного дорожного заграждения"
 ENG_dip_siam_desc: "В последние годы Сиам, будучи номинально союзником &quot; Энтези &quot; во время Великой войны, утратил наше влияние. &quot; Сиам &quot; сегодня стоит на пороге создания крупнейшей прилегающей железной дороги, известной человечеству. &quot; Мы не можем допустить, чтобы какая-либо страна встала на пути наших достижений &quot; ."
 ENG_cape_singapore: "Мыс - сингапурская железная дорога"
 ENG_cape_singapore_desc: "Сухопутное соединение с Британской Малайей и Сингапуром позволило нам официально соединить эту территорию с ранее названной мышей и железнодорожной линией Калькутта, что позволило нам развернуть наши силы там и там, где и когда это необходимо."

 ENG_mountain_pass: "Обеспечение проходов в горах"
 ENG_mountain_pass_desc: "Горные проходы, которые защищают Индию от угрозы Китая, в значительной степени охраняются Непалом и Бутаном, и хотя эти страны остаются в нашем влиянии на протяжении более века, многие считают, что настало время официально потребовать, чтобы они стали протекторатами."
 ENG_increase_control: "Усилить контроль"
 ENG_dip_tibet: "Пересечь горы"
 ENG_dip_tibet_desc: "Пересечь горы"
 ENG_fortify_mts: "Укрепление гор"
 ENG_fortify_mts_desc: "Укрепление гор"
 ENG_mil_infra: "Гималайские железные дороги"
 ENG_mil_infra_desc: "Мы покорим Гималаи во второй раз, на этот раз дорогами и железными дорогами."

 ENG_dip_china: "Стратегия в Китае"
 ENG_dip_china_desc: ""
 ENG_dip_japan: "Англо-японские тиши"
 ENG_dip_japan_desc: "В последние годы Япония, союзник нашей страны и союзник во время Великой войны, значительно отошла от нашей страны, и с растущей угрозой войны между нами и другими Великими державами мы должны попытаться заполучить тех немногих союзников, которых мы можем за границей."
 ENG_dip_phillippines: "Похищение Филлиппинов"
 ENG_taiwan_purchase: "Тайваньская покупка"
 ENG_pacify_pacific: "Удаление Тихоокеанского региона"
 ENG_pacify_pacific_desc: ""

 ENG_dip_afghanistan: "Заканчивай великую игру"
 ENG_dip_afghanistan_desc: "Великая игра велась между нами и Российской империей на протяжении 19-го года в попытке распространить наше влияние на Центральную Азию, чтобы защитить наши индийские территории от российской угрозы. Сегодня СССР вновь стремится распространить свою власть на Центральную Азию, и мы должны быть готовы защищать свою территорию, создавая буферные государства."
 ENG_dip_ussr: "Уничтожение коллективистов"
 ENG_dip_ussr_desc: "Марксизм является идеологической и экзистенциальной угрозой для нашей нации, нельзя допустить, чтобы он продолжал расширять свои масштабы по всему миру."


 #Imperial Development

 ENG_imperial_development: "Имперское развитие"
 ENG_imperial_development_desc: "Империя состоит не только из островов Дома, но и из многих дополнительных территориальных районов, находящихся под ее влиянием, в то время как мы имеем прямой контроль над нашими колониальными владениями, наши Доминионы обладают определенной степенью свободы, хотя это не должно восприниматься как должное для блага империи, которую мы должны инвестировать в их развитие."

 ENG_assist_canada: "Вознаграждение за верность"
 ENG_assist_canada_desc: "Канада является самым старшим членом Империи, вторым после самой Британии. Их верность выдержала испытание временем с 1776 по 1812 год до 1914 год, канадцы всегда были готовы отдать все, что в их силах, для улучшения империи. Возможно, сейчас настало время вернуть что-то."
 ENG_saf_diamonds: "Выверка"
 ENG_saf_diamonds_desc: "Южная Африка никогда не была самой легкой из Доминионов в том, чтобы сохранять контроль между Бурами и Зулусом, которые мы пролили изо всех сил через ее холмы и равнины. Возможно, новый более дружественный подход заслужит наше доверие и, что более важно, их ресурсы."
 ENG_india_dev: "Жемчужина Империи"
 ENG_india_dev_desc: "Британский Радж был алмазом Империи с тех пор, как ЕИК объединился в регионе много лет назад, такие роскошные товары, как чай, специи и хлопок, потекли из драгоценностей, обогащающих Империю, возможно, если мы увеличим наши инвестиции в регион, наши кошельки будут процветать еще раз, и, возможно, люди будут смотреть на нас в более дружелюбном свете."
 ENG_australasia_dev: "Друзья в отдаленных местах"
 ENG_australasia_dev_desc: "В последние годы наши отношения с Австралией и Новой Зеландией были напряженными, особенно в связи с их потерями в Галлиполли, и мы должны подтвердить наши прочные связи с их странами и оказать им помощь в их развитии, с тем чтобы обеспечить их промышленное развитие в той же степени, что и наше государство."

 ENG_est_iedc: "Расширение финансирования МСКО"
 ENG_est_iedc_desc: "ИЕДК все еще стоит на ногах, организация, которая финансирует выживание нашей Империи в мире, где денежная власть имеет все большее влияние, ничто не поможет больше, чем хорошие инвестиции британского правительства."
 ENG_fund_ito: "Финансирование ИТО"
 ENG_fund_ito_desc: "Междоминионная торговля была одной из сил, которые поддерживали Империю в прошлом столетии. Британии нужны ресурсы Империи, так же как Доминионам нужны товары, произведенные в Великобритании. Однако в последнее время торговля ослабла, возможно, если мы возместим имперскую торговую организацию, мы могли бы использовать ее для стимулирования имперской торговли."
 ENG_create_isaac: "Создать ISAC"
 ENG_create_isaac_desc: "Члены парламента, а также посланники Доминиона выдвинули идею создания академии для объединения великих умов Империи, мы будем называть ее Имперской Академией наук и аэронавтики, и вместе с ней мы будем организовывать умы Империи и обеспечивать наше непризнательное технологическое господство."

 ENG_imp_council: "Имперский научный совет"
 ENG_imp_council_desc: "С созданием ИСАК и помощью, которую он оказал империи, основатели организации решили организовать новый Имперский научный совет, чтобы лучше организовать исследования по всей империи."


 #Cold War
 ENG_cold_war_begins: "Начинается холодная война"
 ENG_cold_war_begins_desc: "Великая война может быть окончена, но мир кажется далеким. Наши бывшие союзники в Берлине теперь бросают длинную тень на Европу, их влияние растет неконтролируемо. Континент остается разделенным, и Великобритания должна тщательно управлять этой новой «холодной войной». Наши предыдущие отношения с Францией и Италией изменились; теперь Германия является главной заботой."

 ENG_form_westminster_treaty: "Формирование Вестминстерской договорной организации"
 ENG_form_westminster_treaty_desc: "В эту эру неспокойного мира и напряженности Великобритания не может оставаться в одиночестве. Мы должны создать новый оборонительный альянс, поддерживаемый Лондоном, для защиты демократии и противодействия немецкому экспансионизму. Империя и Европа должны быть объединены под единым знаменем."

 ENG_support_resistance: "Поддержка сопротивления в оккупированной Европе"
 ENG_support_resistance_desc: "Европа находится под германским ботинком, и мы должны поддержать тех, кто по-прежнему преисполнен решимости обеспечить свою свободу."

 ENG_seek_new_allies: "Искать новых союзников"
 ENG_seek_new_allies_desc: "С учетом того, что Германия доминирует в Центральной Европе, мы должны искать больше партнеров, чтобы остерегаться немецкой власти, мы все еще можем быть убеждены присоединиться к нашему делу, дипломатия должна стать нашим первым оружием в этой &quot; холодной войне &quot; ."

 ENG_approach_italy: "Совпадение с Римом"
 ENG_approach_italy_desc: "Несмотря на то, что в последнее время противники Италии также оказались в стороне от Германии."

 ENG_scandinavian_defense_pact: "Свободный подход к Скандинавии"
 ENG_scandinavian_defense_pact_desc: "Скандинавские страны находятся в опасном положении, близком к сфере влияния Германии. &lt; &lt; Защитное соглашение &gt; &gt; могло бы обеспечить наши северные подходы и прочные союзники против потенциальной германской агрессии в Балтии."

 ENG_approach_SPAIN: "Подход Испания"
 ENG_approach_SPAIN_desc: ""

 ENG_balkan_influence: "Балканские обязательства"
 ENG_balkan_influence_desc: "Неустойчивость Балкан по-прежнему представляет собой потенциальную &lt; &lt; точку &gt; &gt; . &lt; &lt; Расширяя влияние и предлагая гарантии безопасности &gt; &gt; , мы можем не допустить, чтобы эти страны оказались под влиянием Германии и потенциально открыли новый фронт в случае возникновения конфликта."

 ENG_liberate_france: "Освобождение материковой части"
 ENG_liberate_france_desc: "Франция тонет под социалистическим режимом, постоянным источником революционной нестабильности и потенциальной пешкой для наших соперников. В то время как Германия представляет большую угрозу, уничтожение социалистического правительства в Париже имеет решающее значение для восстановления стабильности в Западной Европе и оказания помощи нашим французским союзникам. Это даст нам жизненно важный западный фланг против Берлина."

 ENG_support_exiles: "Подход к правительствам стран, находящихся в изгнании"
 ENG_support_exiles_desc: "Многие законные правительства были свергнуты во время недавних конфликтов, предлагая убежище и поддержку этим изгнанным лидерам и их оставшимся силам не только поддерживает международное право, но и предоставляет нам преданных союзников, стремящихся вернуть свои родины."

 ENG_dutch_government_in_exile: "Приближайтесь к голландцам в Суринаме"
 ENG_dutch_government_in_exile_desc: "Несмотря на то, что Нидерланды пали, их правительство продолжает борьбу со стороны Суринама, поддерживая королеву Вильгельмину и ее администрацию, она обеспечит, чтобы голландские колониальные ресурсы остались в наших рядах и сохранили надежду на освобождение."

 ENG_belgian_congo_pact: "Приближайтесь к бельгийским изгнаниям"
 ENG_belgian_congo_pact_desc: "Огромные ресурсы Конго в настоящее время находятся в ведении бельгийского правительства, находящегося в изгнании, которое обеспечивает их сотрудничество в целях обеспечения того, чтобы эти жизненно важные материалы не попадали в руки противника и укрепляли легитимность находящихся в изгнании властей."

 ENG_free_french_in_algiers: "Связи с французами"
 ENG_free_french_in_algiers_desc: "В то время как материковая Франция страдает от социализма, законное французское правительство продолжает свою борьбу из Алжира, предоставление военной и экономической помощи алжирским французам крайне важно для окончательного освобождения их родины и укрепления нашей позиции в Северной Африке."

 ENG_cold_war_endgame: "Определение послевоенного порядка"
 ENG_cold_war_endgame_desc: "Наша сеть союзов формируется, и Франция находится на пути к освобождению."

 ENG_confront_germany: "Покончим с валькизмом"
 ENG_confront_germany_desc: "Нельзя допустить, чтобы доминирующее положение в Германии сохранялось. Их экспансионистская политика угрожает равновесию сил и свободе Европы. Умиротворение - это просто умиротворение другим именем. Настало время провести линию в песке и подготовиться к неизбежному конфликту."

 ENG_detente_with_germany: "Искать разрядку с Германией"
 ENG_detente_with_germany_desc: "Еще одна крупная европейская война немыслима. В то время как немецкая власть касается, прямая конфронтация чревата глобальной катастрофой. Возможно, можно найти путь управляемого сосуществования, контроля над вооружениями и деэскалации. Мы должны попытаться ослабить напряженность, пока не стало слишком поздно."

 ENG_internal_readiness: "Приготовьтесь к длинному хоулу"
  ENG_internal_readiness_desc: "Природа конфликта изменилась. Открытая война уступает место устойчивой напряженности. Мы должны обеспечить, чтобы домашняя фронта была готова к длительному периоду бдительности и потенциальной конфронтации с нашими бывшими союзниками в Берлине."

  ENG_espionage_operations: "Великая игра возобновилась"
  ENG_espionage_operations_desc: "Информация имеет первостепенное значение в этой &quot; холодной войне &quot; . МИ-6 должно адаптироваться, переключив свое внимание на сбор разведывательных данных о немецких способностях, намерениях и недостатках на всем континенте."

  ENG_counter_espionage: "Защищать внутренний фронт"
  ENG_counter_espionage_desc: "При высокой напряженности нельзя игнорировать угрозу немецкого шпионажа и внутренней подрывной деятельности."

  ENG_economic_mobilisation: "Экономика &quot; холодной войны &quot;"
  ENG_economic_mobilisation_desc: "Устойчивый конкурс требует мощной экономики, направленной на обеспечение военной готовности, не падая при этом под напряжением."

  ENG_technological_race: "Раса за высочество"
  ENG_technological_race_desc: "Победа в этом новом конфликте вполне может быть решена в лаборатории. Британия должна вкладывать значительные средства в научные исследования и разработки, чтобы сохранить технологическое преимущество над огромной промышленной базой Германии."

  ENG_advance_military_tech: "Сила атома"
  ENG_advance_military_tech_desc: "Проект Porton Down начинает приносить плоды."

  ENG_global_strategy: "Глобальная стратегия"
  ENG_global_strategy_desc: "Англо-германское соперничество сейчас определяет глобальную стадию. Мы должны разработать всеобъемлющую стратегию сдерживания немецкого влияния, защиты наших интересов и проектной мощи во всем мире."

 ENG_befriend_the_turks: "Подружиться с турками"
 ENG_befriend_the_turks_desc: ""

 ENG_turkish_neutrality_pact: "Требовать Пакта о нейтралитете Турции"
 ENG_turkish_neutrality_pact_desc: ""

  ENG_secure_middle_east: "Обезопасить восточную линию жизнеобеспечения"
  ENG_secure_middle_east_desc: ""

  ENG_african_stability: "Поддержание стабильности в Африке"
  ENG_african_stability_desc: "Наши огромные колониальные владения в Африке являются одновременно и источником силы, и потенциальной уязвимостью, и мы должны обеспечить административный контроль, безопасность ресурсов и не допустить превращения континента в игровую площадку для конфликтов, связанных с &lt; &lt; холодной войной &gt; &gt; ."

  ENG_support_resistance: "Нагнетайте пламя сопротивления"
  ENG_support_resistance_desc: "Доминирование Германии в Европе не является абсолютным. Скрывая поддержку движений сопротивления и диссидентских групп в их сфере влияния, мы можем подорвать их контроль и отвлечь их ресурсы."

  ENG_intervention_doctrine: "Доктрина вмешательства"
  ENG_intervention_doctrine_desc: "Мы должны разработать четкие доктрины и потенциал для быстрого вмешательства в региональные конфликты, с тем чтобы поддержать наших союзников и противодействовать силам, поддерживаемым Германией."

  ENG_rebuild_france: "Восстановление Франции"
  ENG_rebuild_france_desc: "С освобождением материковой Франции от социализма начинается задача восстановления, и мы должны поддержать создание стабильного, дружелюбного правительства в соответствии с Вестминстерским договором, чтобы Франция стала оплотом против Германии, а не помехой."

  ENG_integrate_exile_forces: "Объединить союзные силы"
  ENG_integrate_exile_forces_desc: "С обеспечением безопасности наших альянсов настало время официально интегрировать свои военные команды в структуру Вестминстерского договора, укрепляя нашу коллективную оборону."

 #####News Events#####

 #uknews.1.d: "Король Георг V мёртв. Сегодня утром к воротам Букингемского дворца была приложена записка, в которой было объявлено, что король умер мирно во сне прошлой ночью в окружении своей семьи. Его сын, принц Уэльса, должен получить титул короля Эдуарда VIII. Его Величество даже посетил войска недалеко от фронта на Западном фронте. Несмотря на его любовь к семье и стране, тысячи людей вышли на улицы Британской империи, от Виннипега до Веллингтона, чтобы оплакивать потерю одного из самых любимых монархов в британской истории."
 uknews.1.d: "Сегодня утром к воротам Букингемского дворца была приложена записка о том, что король умер мирно во сне прошлой ночью в окружении своей семьи. Его сын принц Уэльский должен принять титул короля Эдуарда VIII, который также был объявлен. ~n ne man, известный своей любовью как к семье, так и к стране, тысячи вышли на улицы по всей Британской империи, от Виннипега до Веллингтона, чтобы оплакивать потерю одного из самых любимых монархов в их истории."
 uknews.2.d: "На прошлой неделе на Лондонском фондовом рынке появились бурные пять дней, под воздействием опасений по поводу нехватки товаров и ресурсов из-за продолжающегося восстания в колониальной Африке и Индии, фондовая биржа продолжала меняться по мере того, как из Вестминстера вырвались новости об усилиях по предотвращению дальнейшего восстания во всей империи."
 uknews.3.d: "В знак демонстрации своей власти и в целях дальнейшего расширения своего контроля над Северным морем, британцы высадили войска на датские атлантические владения, в результате чего они оказались под их контролем. Блокада, введенная Великобританией в отношении датчан, продолжается и не показывает никаких признаков остановки, поскольку датчане не могут совершить прорыв. Кроме того, любые попытки международного вмешательства не увенчались успехом."
 uknews.4.d: "Отчеты из Панамского канала за последние несколько дней свидетельствуют о том, что в ряде ключевых стратегических мест вблизи канала имели место спорадические столкновения, однако только сегодня утром правительство Соединенных Штатов официально подтвердило, что произошло."
 uknews.5.d: "В течение последних недель 1936 года в ряде крупных индийских городов произошли массовые беспорядки после отказа британской администрации изменить условия труда и повысить заработную плату по всей территории Британской Индии. 1924 года были навязаны эти суровые условия, которые с тех пор вызвали у населения большое недовольство."
 uknews.6a.d: "После нескольких месяцев расследования, проведенного Королевской ирландской полицией с целью установить местонахождение руководства Ирландского республиканского братства, была предпринята неудачная попытка симулировать разрушение независимых ячеек СИБ, работающих по всей Ирландии. Несмотря на исключительную тайну, британские источники в Вестминстере указали, что информация была утечка в СИБ до начала операции."
 uknews.6b.d: "На протяжении веков ирландская нация находилась под британским контролем, и на протяжении веков ирландский народ боролся против британского правления. В то время как последний мятеж во время Великой войны провалился, кажется, дух ирландского народа не был легко раздавлен. После неспособности британского правительства справиться с остатками Ирландского республиканского братства, они воспользовались возможностью, которую новая война в Британии представляет Ирландию и вела еще один вооруженный мятеж против англичан. / Несмотря на то, что этот новый подъем, судя по всему, был хорошо организован и хорошо укомплектован персоналом, это лишь падение представляется хронической нехваткой оборудования. Для того чтобы этот новый подъем увенчался успехом, Ирландия, несомненно, потребует иностранной поддержки."
 uknews.7.d: "После нескольких месяцев борьбы с индейскими повстанцами недавно выиграли серию побед над британскими войсками в Индии, успешно вытеснив их с материковой части Индии. Как только бывшая королевская драгоценность империи стала свободной и независимой, хотя будущее Индии будет чьей-либо догадкой. Несмотря на то, что Индия была объединена против своего общего врага, кажется, что без единой силы субконтинент может вскоре оказаться разрушенным и разделенным еще раз."
 uknews.8.d: "Впервые Игры Британской империи начались в 1930 году, как способ объединить Империю для дружественного соревнований. Проведённые каждые четыре года, эти годы были проведены в Сиднейской крикетной земле в Сиднее, Австралия, по графику празднования 150-летней годовщины с момента первого британского поселка в Австралии. Не удивительно, что победителем этих лет была сама Австралия, которой удалось выиграть в общей сложности 66 медалей, из которых 25 были золотом. Австралия добилась особенно хороших результатов в области борьбы и гребения с большим количеством исключительно квалифицированных атлетов. В частности, австралийский атлет Десима Норман выиграл пять золотых медалей на треке и поле."
 uknews.9.d: "Сегодня в Лондоне была созвана конференция между Соединенным Королевством, Соединенными Штатами, Францией, Японией и Италией."
 uknews.10a.d: "По завершении четырнадцатой Имперской конференции, новости о внутренних дискуссиях в Британской империи стали постоянно доходить до прессы в Соединенном Королевстве. С конца Великой войны Британская империя отошла в «Отличную изолацию» — политику, ранее проводившуюся в 19-м году. Из-за усиления глобальной напряженности целый день конференции был посвящен решению вопроса о месте Британской империи в мире. ~ Не похоже, что после напряженного дня переговоров британские лидеры решили, что дни изоляции империи закончились. Сегодня объявленная Великобританией цель заключается в том, чтобы «цивилизировать» самые мрачные уголки планеты."
 uknews.10b.d: "По завершении четырнадцатой Имперской конференции, новости о внутренних дискуссиях в Британской империи стали постоянно вдаваться в прессу в Соединенном Королевстве. Несмотря на то, что многие считали, что эта конференция может возвестить о новой эпохе империализма, многие были шокированы тем, что новая цель Британии заключается не в экспансионизме, а в том, что они называют «защитой свободы и демократии как дома, так и за рубежом»."
 uknews.10c.d: "По завершении четырнадцатой Имперской конференции, новости о внутренних дискуссиях в Британской империи стали постоянно доходить до прессы в Соединенном Королевстве. С момента окончания Великой войны Британская империя отошла в «Отличную изолацию» — политику, ранее проводившуюся в 19-м году. Из-за усиления глобальной напряженности целый день конференции был посвящен решению вопроса о месте Британской империи в мире. ~n/nurprises ни в чем не участвовал, британцы решили, что, в то время как нестабильность во всем мире является причиной для беспокойства, британский отказ от изоляции лишь еще больше усугубит указанную нестабильность, и поэтому в интересах Империи политика изоляции будет продолжаться."
 uknews.11.d: "С закрытием Имперской конференции стало известно, что Британская Империя попытается создать «Имперскую федерацию», где доминионским правительствам будет предоставлено равное представительство в Имперском парламенте в Империи. Хотя некоторые были счастливы или заинтересованы в такой возможности, не было больше такого возмущения, как Буры Южной Африки. ~ Сегодня началась четвертая бурская война, когда мятежники захватили армейские депо по всей Южной Африке и захватили большое количество земель из Союза Южной Африки. Это восстание является большим и опасным, и еще предстоит выяснить, сможет ли Империя восстановить порядок в этом регионе."
 uknews.12.d: "После установления британского правления в Индии было несколько восстаний против Империи в попытке завоевать свободу индийского народа, самая последняя из которых произошла всего несколько лет назад. В то время как каждое восстание было свернуто с течением времени, кажется, что сегодня индийские националисты добились успеха там, где те, кто был до них, потерпели неудачу. Несмотря на то, что Империя имеет дело с четвертой Бурской войной, многие индийские повстанцы захватили важные места по всему субконтиненту и успешно вытеснили британцев из региона, и только Бирма и Цейлон остались под их контролем. Хотя британское правительство угрожало «восстановлением порядка» в регионе, маловероятно, что они в скором времени вернутся."
 uknews.13.d: "Ужасные сообщения из Лондона свидетельствуют о том, что только что завершилась секретная встреча между министрами иностранных дел Франции и Великобритании. На пресс-конференции после этой встречи было зачитано совместное заявление, в котором указывалось, что правительства Великобритании и Франции согласились возродить альянс &lt; &lt; Энтенти Кордиале &gt; &gt; между их двумя странами в попытке противостоять германскому прогрессу на европейском континенте."
 uknews.14.d: "В этот день одиночка произвела заряженный револьвер, как Его Величество король-Эмперор Эдвард VIII, ездил на лошади в конституционном холме возле Букингемского дворца. Несмотря на то, что люди из Скотланд-Ярда заметили пистолет, этот человек смог выпустить оружие дважды перед тем, как его схватили на землю и разоружили. Когда толпа, рассеянная от стрелявшего, была обнаружена мгновения спустя, что король был мертв, с огнестрельным ранением в грудь, которая, как предполагается, проткнула его сердце."
 uknews.15.d: "После нескольких месяцев широкомасштабных беспорядков по всей стране из-за неспособности правительства урегулировать экономическую ситуацию в стране, британское правительство пало перед гражданскими протестующими после того, как военные, защищающие Вестминстера на стороне толпы. ~nn/руководители протестующих - главным образом марксистские революционеры, профсоюзные чиновники и некоторые социалистические политики - сформировали временное правительство в столице."
 uknews.16.d: "Сегодня эта борьба наконец принесла плоды, и Федерация была официально объявлена в новом императорском парламенте Лондона представителями имперской империи. ~nn-Доминионы империи получили полное представительство в этом новом Имперском парламенте, и хотя ожидается, что в будущем будут продолжаться трудности, поскольку члены Имперского парламента будут бороться за то, чтобы найти общую почву, эта новая Имперская федерация, скорее всего, будет представлять еще более мощную Империю, чем когда-либо прежде."
 uknews.17a.d: "Поскольку гражданские беспорядки охватили Британские острова после катастрофических нескольких недель политических волнений, многие верили, что Империя, на которой никогда не закатилось солнце, вскоре распадется и будет ограничена пылью истории. ~ Неожиданно появились сообщения о том, что король Эдуард VIII захватил власть с военной помощью в попытке установить порядок в стране и уничтожить революционные элементы, направленные на уничтожение старого порядка."
 uknews.17b.d: "Поскольку гражданские беспорядки охватили Британские острова после катастрофических нескольких недель политических волнений, многие верили, что Империя, на которой никогда не закатилось солнце, вскоре будет распущена и ограничена пылью истории. ~nn-Rumours из Великобритании указали, что харизматичный офицер британской армии штурмовал дворец Вестминстера с помощью военных подразделений в этом районе после того, как им было приказано открыть огонь по протестующим на улицах Лондона. Уже военные подразделения по всей стране заявили о своей верности новому временному правительству, и порядок был восстановлен, хотя и жестоко, на улицах Великобритании."
 uknews.18.t: "Битва при Мерс-эль-Кебире"
 uknews.18.d: "Вчера в полдень эскалация кризиса между британскими и французскими правительствами в связи с случайным потоплением ХМС Тритон еще более обострилась по мере того, как королевские военно-морские и морские национальные военные корабли обменивались огнем у побережья Алгари, причем обе стороны понесли многочисленные потери и претендуют на победу над другой. ~ ~ Самая значительная точка вспышки между британскими и французскими правительствами после инцидента с Фашодой, и яркий пример растущей напряженности между двумя странами; пока не ясно, каковы будут результаты уже известной битвы Мерс-эль-Кебир."
 uknews.19a.d: "В последние дни между британским и французским правительством продолжается растущая дипломатическая волна в связи с местным восстанием против британского правления в Восточной Африке. Первоначально французское правительство официально осудило правительство Великобритании в его усилиях по пресечению восстания, в ответ на это правительство недавно выступило с официальным дипломатическим протестом в связи с предполагаемым вмешательством Франции в их дела."
 uknews.19b.d: "В последние дни между британским и французским правительством продолжается нарастающая дипломатическая волна в связи с местным восстанием против британского правления в Восточной Африке. Первоначально французское правительство официально осудило правительство Великобритании в его усилиях по пресечению восстания в ответ на требование британского правительства о том, чтобы Франция официально отказалась от своих заявлений, которые до сих пор игнорировались французским правительством."
 uknews.20a.d: "В последние недели между Великобританией и Францией сложилась напряженная дипломатическая ситуация, когда британцы справляются с восстанием в Восточной Африке, инициируемым французским осуждением британского правления в Африке, за которым внимательно следило британское министерство иностранных дел, представляющее, как они называют, доказательство участия Франции в конфликте, оно лишь продолжает выходить из-под контроля, и напряженность в настоящее время нарастает между двумя странами."
 uknews.20b.d: "В последние недели между Великобританией и Францией сложилась напряженная дипломатическая ситуация в связи с британским решением проблемы восстания в Восточной Африке, инициируемая французским осуждением британского правления в Африке, за которым внимательно следило британское министерство иностранных дел, представляющее то, что они называют доказательством причастности Франции к конфликту, — оно лишь продолжает выходить из-под контроля, причем напряженность в настоящее время растет между двумя странами. — Сегодня утром министр иностранных дел Великобритании опубликовал совместное Императорское заявление относительно предполагаемого участия Франции в восточноафриканском возрождении."
 uknews.21a.d: "С начала восстания в декабре 35-го года индийские повстанцы дали обещание, взяв на себя инициативу в борьбе против британского контроля над субконтинентом, и в то время как Великобритания отправила большое количество войск в регион для того, чтобы подавить восстание, на котором повстанцы продолжают жить. ~ ~ ~В попытке положить конец нестабильности в Индии британское правительство вступило в мирные переговоры с лидерами мятежников в Индии, информация, которая стекала из этих переговоров, указывает на то, что британское правительство обещало значительную автономию Индии в будущем в том, что является серьезной уступкой повстанческой стороне."
 uknews.21b.d: "С начала восстания в декабре 35-го года индийские повстанцы дали обещание, взяв на себя интимную роль в борьбе против британского контроля над субконтинентом, хотя для Великобритании не потребуется много времени, чтобы перебросить значительное количество войск и техники в Индию в попытке решительно раздавить восстание. Несмотря на новость о том, что лидеры мятежников пытались начать переговоры с британским правительством, многие полагали, что восстание придет к концу дипломатическим путем, хотя, как представляется, британское правительство предпочло привести пример мятежников в Индии и только сегодня объявило о полной и безоговорочной капитуляции мятежников британским силам."

 #-Fall of X

 uknews.100.d: "Сегодня правительство Великобритании объявило о том, что их силы проникли во французскую столицу Парижа. Спорадная улица продолжается по всему городу, однако большинство французских сил либо сдались, либо сбежали из плена."
 uknews.101.d: "Сегодня британское правительство объявило, что имперские силы вошли в столицу Германии в Берлине. Берлинцы в шоке смотрели на то, как британские войска шли по улицам. Говорят, что Юнион Джекс уже может лететь высоко над рейхстагом и Бранденбургскими воротами. / Н/по мере продолжения боевых действий по всей остальной части Германии маловероятно, что немецкое правительство продержится дольше. Авангард Валькизма, похоже, находится на краю капитуляции."
 uknews.102.d: "Сегодня сообщается, что итальянский столица Рима официально сдалась британским войскам. Однако на протяжении всего города боевые действия все еще продолжаются, поскольку британская армия пытается вытолкнуть любое оставшееся итальянское сопротивление. Итальянское правительство было безопасно эвакуировано, и британцы согласились разрешить Папе остаться в стране."
 uknews.103.d: "Сегодня британское правительство подтвердило, что имперские силы оккупировали американскую столицу Вашингтона, округ Колумбия. Они заявили, что, хотя захват города был большим успехом, неизвестно, как долго он продлится до кажущегося неизбежным американского краха. Слухи продолжают скручиваться о жестокой осадке города, когда Белый Дом снова попадает на факел, повторяющий то, что произошло во время войны 1812 года. ~nnnnritish plans for US Oккупation не известны всему миру. Однако известно, что если Соединенные Штаты сдадутся, то Британская Империя раздавит, возможно, одного из самых могущественных соперников."

 #####Events#####

 #-Black Wednesday Events

 ukbw.1.d: "Поскольку влияние Лондонского рынка продолжает влиять на финансовое положение нашей страны все больше и больше компаний и предприятий становятся банкротами. Сегодня известная компания, которая владеет несколькими фабриками в одном из наших известных промышленных регионов, объявила, что они закроют несколько нерентабельных заводов в этом районе в попытке сократить расходы и остаться на плаву. / nn к сожалению, это приведет к росту безработицы и неспособности правительства продолжать использовать эту фабрику."
 ukbw.2.d: "В попытке сократить расходы несколько важных предприятий нашей страны начали сокращать заработную плату работников, чтобы сэкономить себе средства на производстве товаров в регионе, хотя эти сокращения обычно сопровождаются лишь незначительным ворчанием, местный профсоюз объявил о забастовке на нескольких фабриках, владельцы компаний не хотят вести переговоры с забастовщиками, и в настоящее время это приведет к сокращению производства в этом районе."
 ukbw.3.d: "Поскольку местная забастовка в одном из наших более влиятельных промышленных регионов обрела форму, владельцы предприятий решили провести переговоры с профсоюзом, организовавшим забастовку."
 ukbw.4.d: "Местные ситуации продолжают ухудшаться по мере того, как последствия коллапса на Лондонском рынке ухудшаются в течение месяца. Сегодня король Эдуард VIII посетил район, в наибольшей степени затронутый экономическим кризисом, и, хотя его визит должен был стать источником морального духа для тех, кто в наибольшей степени пострадал, он имел некоторые непредвиденные последствия. Король, по всей видимости, оказался в весьма тяжелом положении и дал несколько политических обещаний, указывающих на его намерение непосредственно участвовать в урегулировании ситуации, независимо от того, делает ли он это, сделав эти замечания, он ослабил наше правительство и расширил свою общественную поддержку."
 ukbw.5.d: "Сегодня было замечено большое число журналистов, сообщающих о марксистском ралли, которая была задержана в одном из наших городов, затронутых недавним закрытием фабрик. Обычно такой митинг, как это, остается незамеченным, но более крупные, чем обычные, толпы привлекли внимание местных журналистов, которые в настоящее время публикуют истории о политической поддержке и сочувствии марксистской политической политике, которые находятся на самом высоком уровне. Несмотря на правдивость этой истории, ему удалось привлечь общественный интерес к тем, кто организовал митинг."
 ukbw.6.d: "Однако последние доклады правительства свидетельствуют о том, что в прошлом квартале темпы роста, как представляется, несколько занижены, что свидетельствует о том, что наша политика работает, хотя и медленно."

 #-Normal Events

 uk.1.d: "Однако ужасные потери повлияли на внутреннюю политику Империи больше, чем можно было бы предвидеть, если бы в прошлом, когда они были запротестованы. В Имперские конференции 1917-18 годов, Великобритания пообещала своим доминантам "полное признание в качестве автономных наций имперского содружества" с целью повышения автономии и предоставления каждому Доминиону в Империи "адекватного голоса" во внешней политике. В конечном счете, права, которые в конечном счете должны были быть распространены на Британскую Индию, были столь же велики. Несмотря на эти обещания, с победой, британские политики предпочли увидеть восстановление статуса-кво в Империи, с Доминионом номинально подчиненным Лондону; они опасались, что любое увеличение автономии может привести к распаду этой империи, и что права, которые в конечном счете, должны были быть распространены на Британскую Индию, а также на то, чтобы защитить ее. Несмотря на то, что этот политический бум в Великобритании распространился по всей Империи. Таким образом, уровень производства в Империи, с помощью ресурсов и экспанической колониальной империи, Великобритания, не имела бы недостающих средств для того, чтобы получить необходимые товар, однако, был выбранный метод, был таким образом, был для того, чтобы получить нужный метод, чтобы получить нужный товар."
 uk.2.d: "На прошлой неделе на Лондонском фондовом рынке появились бурные пять дней, под воздействием боязни нехватки товаров и ресурсов из-за продолжающегося восстания в колониальной Африке и Индии, фондовая биржа продолжала меняться по мере того, как из Вестминстера вырвались новости об усилиях по предотвращению дальнейшего восстания на всем протяжении Империи. ~ ~ Не похоже, что худшее еще впереди. ~ Несмотря на завершение суда над генеральным директором Hatry Group - известным бизнесменом Кларенсом Хари - и его сообщниками в тюрьме всех тех, кто находится под следствием за преступления, связанные с массовым мошенничеством и подделкой, доверие инвесторов на рынке акций упало. Масса продавалась в течение сегодняшнего дня, с торговцами, казалось бы, в панике. ~ Несмотря на то, что правительство пытается найти способ подготовиться к экономическому восстановлению, последствия Лондонского фондового кризиса 1936 года, несомненно, будут ощущаться за пределами Великобритании, большей частью империи и ее доминионов."
 uk.3.d: "Король Георг V мёртв. Сегодня утром к воротам Букингемского дворца была приложена записка, в которой было объявлено, что король умер мирно во сне прошлой ночью в окружении своей семьи. Его сын, принц Уэльса, должен получить титул короля Эдуарда VIII. Его Величество даже посетил войска недалеко от линии фронта на Западном фронте. Несмотря на то, что король-Эмперор умер после смерти своего отца, король Георг V в течение 25 лет правил на улицах нашей Империи, от Виннипега до Веллингтона, чтобы оплакивать потерю одного из самых любимых монархов в нашей истории."
 uk.400.d: "Как и его отец до него, король Эдуард VIII является сильным и во многих отношениях неустанным человеком. Избавившись от многих мер защиты, применяемых Службой охраны семьи, наш новый король решил, что его будут рассматривать как человека народа. Что-то, как он говорит, не может быть достигнуто, если за ним в течение всего дня следует большое число телохранителей. Несмотря на то, что он начал отказываться видеться со значительной группой телохранителей на людях. Советники короля неоднократно напоминали ему, что, хотя люди могут позитивно реагировать на то, как он перемешивается между ними, это ставит его под серьезную угрозу. Несмотря на то, что король обладает властью в этом вопросе и мы не можем заставить его согласиться на наши прихоти, возможно, было бы разумно позволить обычному отряду безопасности остаться «содействующим» рядом. Для его защиты, конечно."
 uk.4.d: "В конце этого дня одинокий стрелок произвел заряженный револьвер, как Его Величество король-Эмперор Эдвард VIII, ехал на лошади на Конституционном холме возле Букингемского дворца. Несмотря на то, что люди из Скотланд-Ярда заметили пистолет, этот человек смог выпустить оружие дважды перед тем, как его схватили на землю и разоружили. Поскольку толпа, рассеянная от стрелка, была обнаружена через несколько мгновений после того, как король был мертв, с огнестрельным ранением в грудь, которая, как считается, пронзила его сердце. Несмотря на то, что народ оказался в шоке. Это не только первое убийство монарха с тех пор, как Чарлз I почти триста лет назад, это первый раз, когда стрелявший скрылся от одного из членов королевской семьи."
 uk.5.d: "После этого, когда король-Эмперор Эдвард VIII ехал на лошади в конституционном холме недалеко от Букингемского дворца, один из вооруженных людей выпустил заряженный револьвер и направился в сторону короля. Из-за храбрых усилий членов толпы потенциальный убийца был схвачен и удерживался на позиции до тех пор, пока члены Скотланд-Ярда не спешат к месту. Несмотря на то, что многие рады тому, что убийство было неудачным. Этот человек, известный как один из джеромов Баннигана, был взят под стражу в ожидании суда над Шотландией Ярдом. Известный мошенник, мотивы покушения на убийство неизвестны в это время, может быть много месяцев до того, как будет установлена причина, если его можно найти."
 uk.6.d: "Сейчас, когда начинается новый год, приближается дата следующей Имперской конференции. Несмотря на то, что еще несколько месяцев до сих пор ведется подготовка к приему имперских делегатов Конференции. Работа до сих пор сосредоточена в Лондоне, традиционном месте проведения Конференции, с нами, тем не менее, недавно связался Доминион Канады в отношении возможного изменения места проведения. ~ ~ n na Kanadians предлагают провести конференцию в Оттаве, где они тайно работали над своим собственным зданием, чтобы провести это мероприятие. ~ Несмотря на то, что этот выбор является относительно доброжелательным, он может способствовать улучшению отношений между нами и нашими Доминионами, показав, что эта Империя действительно является одной из равных. Хотя его проведение в Лондоне будет направлено не только Доминионам, но и всему миру, что у Британской империи есть только один хозяин."
 uk.7a.d: "Сегодня утром премьер-министр Великобритании официально открыл четырнадцатую Имперскую конференцию в Лондоне. Имперские делегаты из всей империи готовы обсуждать многочисленные непримиримые вопросы, касающиеся будущего наших великих наций. Несмотря на то, что каждая делегация начала свою небольшую речь, которая, вероятно, будет отражать их собственные интересы на Конференции. В частности, канадская делегация вновь заявила о своей поддержке Статута Вестминстера и возросшей автономии для всех стран Доминиона, включая Британскую Индию. Делегации Австралии и Новой Зеландии выступили с совместным заявлением, в котором они выразили свою заинтересованность в увеличении инвестиций на их территории, а также в политике, в рамках которой британское правительство будет поощрять иммиграцию в Австралию и Новую Зеландию. Делегация Ирландии и Индии вновь выразила свою озабоченность по поводу роста волнений в их странах, равно как и их заинтересованности в большей автономии в качестве средства противодействия ему."
 uk.7b.d: "Сегодня утром Генерал-губернатор Канады официально открыл четырнадцатую Имперскую конференцию в Оттаве. Имперские делегаты из всей империи готовы обсуждать многочисленные непримиримые вопросы, касающиеся будущего наших великих наций. Каждая делегация открыла свою небольшую речь, которая, вероятно, будет отражать их собственные интересы на Конференции. В частности, канадская делегация вновь заявила о своей поддержке Статута Вестминстера и возросшей автономии для всех доминионных государств, включая Британскую Индию. Делегации Австралии и Новой Зеландии выступили с совместным заявлением, в котором они выразили свою заинтересованность в увеличении инвестиций на их территории, а также в политике, в которой британское правительство будет поощрять иммиграцию как в Австралию, так и в Новую Зеландию. Ирландская делегация индейская делегация подняли свою озабоченность в связи с ростом волнений в их странах, а также в связи с тем, что они заинтересованы в большей автономии в качестве средства противодействия ему."
 uk.8.d: "Повестка дня на первый день Имперской конференции 1937 года должна стать экономической политикой Империи. Многие из наших Доминионов, включая Доминионы, по-прежнему сильно страдают от последствий коллапса Лондонского рынка всего девять месяцев назад. С нашим промышленным и экономическим рычагом над империей мы сможем определить курс, который мы пойдем вместе для урегулирования этого кризиса. Несмотря на то, что у нас есть лишь ограниченные инвестиции, которые можно выделить для Доминионов, мы можем направить их в конкретный район для оказания им помощи в их строительстве. Самая популярная идея, которая была выдвинута на протяжении длительного времени объединенными австраласийскими делегатами, заключается в увеличении объема промышленного строительства, содействии возвращению большего числа безработных на работу, а также в стимулировании совместных экономических систем Империи. В противном случае мы можем также отвлечь наши инвестиции на строительство инфраструктуры во всей империи, с тем чтобы позволить нам с большей легкостью получить доступ к более отдаленным территориям Империи."
 uk.9.d: "Учитывая нашу доминирующую военную позицию в отношении частей Империи, мы пришли к тому, чтобы определить нашу единую внешнюю политику в отношении предстоящих лет. Несмотря на то, что с момента окончания Великой войны мы отступили в изоляцию как средство сохранения целостности нашей Империи, хотя с возрастающими угрозами за рубежом эта политика регулярно оспаривается в Империи. ~ Наш первый выбор состоит в том, чтобы продолжать политику изоляции, которую мы проводим с конца Великой войны, в то время как эта политика, скорее всего, обеспечит стабильность нашей нации и Империи в целом, она ограничит нашу способность вести значимые дела с другими нациями по всему миру. ~ И наконец, последняя альтернатива заключается в том, чтобы, несомненно, вызвать наибольшее сопротивление со стороны Доминионов, предположение о том, что мы вновь пытаемся расширить нашу Империю. В то время как мы уже контролируем четверть мира, более якие члены нашего парламента и другие твердо убеждены, что когда империи перестанут расширяться, в этом случае мы должны преодолеть или погибнуть. Эта политика несет с собой наибольшую опасность, но и величайшие возможности. Любая попытка сделать экспансионизм императорской политики, вероятно, может поколдить основы нашей Империи."
 uk.10.d: "Возможно, наступил самый важный день Имперской конференции этого года, встреча, на которой мы сравниваем общее будущее Империи. Несмотря на то, что с самого начала Вестминстер всегда пытался сохранить контроль над Доминионами, и хотя это было трудно в первые дни нашей Империи, это стало все легче, по мере того, как технологии наконец догнали. В это время государства Доминион привыкли к своей автономии, и многие делегации, в особенности канадцы, требовали только большего, поскольку их нация выбирала бы и богаче, и больше густонаселенности во время экономического подъема 1920-х годов. . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . ."
 uk.11.d: "Хотя на четырнадцатой Имперской конференции не ожидалось, что будет поднят вопрос о большей автономии Ирландии, ирландская делегация потратила время на то, чтобы заручиться поддержкой Доминионов Империи как средство оказания давления на Вестминстера, с тем чтобы вновь вернуться к этому вопросу. Несмотря на то, что вопрос о Ирландском республиканском братстве, продолжающем нападать на нас и подрывать нашу способность управлять Ирландией, был поднят, и многие члены нашего правительства считают, что, возможно, пришло время, наконец, предоставить Ирландии большую степень самоуправления в качестве средства политического голода Братства."
 uk.12.d: "Сегодня вечером четырнадцатая Имперская конференция официально завершилась заявлениями каждой имперской делегации. В ближайшие недели и месяцы мы увидим усиление нестабильности во всей империи по мере того, как Доминионы начнут приспосабливаться к новой реальности."
 uk.20.d: "В то время как Лондонская коллапсовая коллапса продолжает оказывать влияние на мир, нет места больше, чем наша собственная нация. Тайнессидский город Джэрроу был особенно поврежден последствиями экономического кризиса, когда несколько заводов были закрыты, и важная верфь Палмера. Сегодня несколько сотен безработных провели встречу, на которой они объявили о своем намерении поехать в Лондон, чтобы представить правительству петицию о возобновлении индустрии в Джэрроу, которая имеет важнейшее значение для занятости. Несмотря на то, что обычно такое событие останется незамеченным, средства массовой информации стали причиной большого суеты, и оно привлекло внимание и воображение общественности, чтобы заручиться поддержкой некоторых более видных местных лидеров."
 uk.21.d: "По мере того, как марш Джерроу вступает в свою первую неделю, появились многочисленные тревожные признаки общественного одобрения и поддержки маршантов, которые были особенно заметны сегодня. Несмотря на то, что несколько местных жителей приветствовали его, когда они вошли в Феррихилл в графстве Дурхем, где им предложили еду и питье, а также продемонстрировали большую поддержку, это, как ожидается, будет продолжаться по мере продвижения марша в нашей стране так же, как и многие люди в нашей стране страдают от тех же ситуаций, что и маркеры Джерроу."
 uk.22.d: "Сегодня, когда местные клергимены появились в Рипоне, внимание СМИ к маршам Джерроу вновь привлекло внимание, и даже местный епископ, как представляется, предложил поддержку маркерам. Из даже нескольких дней освещения стало ясно, что марш Джерроу, скорее всего, привлечет значительный общественный интерес."
 uk.23.d: "По мере того, как марш Джерроу продолжает привлекать внимание общественности по всей нашей стране, мы получили тревожные новости от местных полицейских в этом районе относительно новых элементов, проникающих в сам марш. Подозреваемые члены как Британской социалистической партии, так и Международной лиги рабочего, очевидно, вели себя в течение марта, пытаясь поощрить тех, кто марширует, к тому, чтобы они стали более громкими и сильными в своих рефлекциях на правительственную политику. ~ Несмотря на то, что они, как представляется, оказались безуспешными, многие в нашем правительстве начали беспокоиться о том, что марш Джарроу может вскоре стать прикрытием для радикальных социалистических элементов нашего общества, которые затем могут попытаться использовать его для того, чтобы вызвать сбои в столице. ~ no Facing that that that is be be that the option that the moulation that whough the that the people that that that that ther that that thing that that that that that ther that that that wit th mo mo that th th th th ther that thing thing moor moor moor th thing th th thing thing thing ther moor that that that thal that the the by by by by by by by by by by by by by by by the the that that the by by that that that the by by by by by by by by by by by by by by by by by by by by by by by by by by by by by by by by by by by by by by by by by by"
 uk.24.d: "Сегодня утром, когда Джерроу Маркеры въехали в Лондон, несколько членов марша напали на ближайших сотрудников полиции, когда они попытались перенаправить их по менее переполненной улице. После этого нападения полиция была вынуждена защитить себя и арестовать нескольких членов толпы. В газетах, как это типично для них, были заклеймены фотографии этого романа на их первых страницах, и это лишь нанесло еще больший ущерб нашему правительству. &lt; &lt; Скотланд Ярд &gt; &gt; идентифицировала нескольких участников марша в качестве членов БСП и КПБ и посоветовала нам положить конец марше сейчас, пока он еще больше не вышел из-под контроля по мере того, как к этому событию привлекаются более радикальные люди."
 uk.25.d: "Похоже, что Коммунистическая партия Великобритании провела митинг в Хайд-Парке прямо перед приездом Марчеров, что лишь увеличило число участников. Хотя полиция считает, что в ближайшие дни она может вырасти менее чем на 3000 человек, по мере того, как маркеры будут официально передавать правительству свою петицию о повторном открытии верфи Палмера и нескольких других ключевых отраслей в Джерроу."
 uk.26.d: "Сегодня утром число полицейских после марша Джарроу возросло по мере того, как была проведена подготовка к тому, чтобы сорвать марш, прежде чем он может попасть в столицу, из-за опасений, что после прибытия в место назначения произойдут более серьезные беспорядки. По нашему приказу Скотланд-Ярд успешно, но несколько жестоко распустил марш, а те, кто формирует ядро марша, были арестованы и отправлены обратно в Джарроу. Более радикальные элементы марша быстро бежали по мере приближения полиции, очевидно, предотвратив то, что должно было произойти. / nnTypysy средства массовой информации устроили большую суету всей ситуации, обвинив правительство и Скотланд-Ярд в в варварстве перед лицом мирного протеста. Популярность правительства была значительно повреждена этим делом, но мы, возможно, избежали чего-то гораздо худшего, если бы мы позволили марш продолжить."
 uk.27.d: "Сегодня утром Джерроу Маркеры передали свою петицию нескольким членам парламента за пределами Вестминстера, которая будет обсуждаться позднее в палате парламента. Хотя правительство не имеет привычки удовлетворять требования города с относительно низким населением, марш Джерроу привлёк внимание нации, и наш ответ, вероятно, будет рассматриваться и критиковать в предстоящие годы. ~Нет никаких уступок с Джарроу, скорее всего, будет только поощрять другие города просить о аналогичном вмешательстве со стороны правительства, но, отклонив петицию, наше правительство позволит более экстремистским политическим силам принять участие в политике Великобритании."
 uk.28.d: "Город Манчестер и его окрестные города зависят от хлопковых мельниц и экспорта хлопка, поэтому резкое сокращение экспорта в наших странах оказало пагубное воздействие на регион, в результате чего многие компании разорились, а закрытие заводов и мельниц привело к тому, что сотни людей стали безработными и бедными. &lt; &lt; Фабрика и мельница &gt; &gt; опасаются за свою работу и семьи, и многие стали свидетелями сокращения их заработной платы, что вызвало серьезные беспорядки в этом районе. &lt; &lt; Эти беспорядки &gt; &gt; стали причиной разрозненных забастовок по всему региону, причем самая большая из этих забастовок имела место в промышленном городе Рошдале. &lt; &lt; В 9 ч. 00 м. этим утром работники одной из крупнейших хлопковых заводов в городе оставили работу и вышли на улицы, блокировав все транспортные потоки. &gt; &gt; , все эти забастовки прошлися и потребовали улучшения заработной платы и условий работы с некоторыми даже красными флагами. &lt; &lt; &lt; &lt; &gt; эти забасты не имеют никакой опасности, но они не должны быть недооочны, что в этом кризисе, возможно, что они и в этом случае, они идут гораздо дольше. &gt; &gt; &gt; &gt; &gt; &gt; &lt; &gt; &gt; &gt;"
 uk.29.d: "Как крупнейший действующий профсоюз в регионе, Союз трудящихся-миллиардов недавно принял представителей от каждого профсоюза манчестеров в незамеченном месте. Несмотря на то, что сотрудничество профсоюзов не является чем-то необычным, весьма необычным является то, что оно происходит в таких масштабах и в явной тайне, в связи с чем это событие привлекло огромное внимание местных средств массовой информации, многие догадывались, каковы будут его последствия."
 uk.30.d: "Сегодня в результате общенациональных забастовок в Манчестере к лорду мэру Манчестеру Джозефу Тулу ‐ бывшему члену парламента по трудовым вопросам, который теперь, как утверждается, имеет неофициальную связь с ИЛП. Их требования включают, в частности, повышение заработной платы работников, а не только: nn\n1-A увеличение заработной платы. n2-N2-A обязательство улучшить условия труда и жизни работников. n3-работодатели должны выслушивать жалобы своих работников и, где это возможно, оказывать помощь в смягчении этих проблем. ~Несмотря на то, что представление этих требований дает правительству два выбора: принять или отказаться. Признать это означало бы подчиниться воле рабочих и потерять лицо перед остальной частью мира и нашим собственным народом. Устранение будет означать насилие и возможность ужасного кровопролития, если эти забастовщики откажутся."
 uk.31.d: "Учитывая настойчивость Вестминстера, который как можно скорее борется с растущим кризисом в Манчестере, мы направили множество участников переговоров, чтобы разобраться с забастовщиками и их профсоюзными связями в Манчестере. Сегодня участники переговоров сообщили своим представителям в Вестминстере о том, что им удалось заключить сделку, которая, по всей видимости, была не такой большой проблемой, как они ожидали, должностные лица профсоюзов, в частности, были готовы взять на себя все, что они могли получить, и воздерживаться от выдвижения каких-либо серьезных требований."
 uk.32.d: "После того как забастовки в Манчестере были разорваны полицией в этом районе после нашего командования, ситуация была относительно спокойной в тех районах, где ранее проводились забастовки, до сегодняшнего дня мы получили больше новостей по этому вопросу. Несмотря на то, что после жестоких действий полиции в связи с разгромом забастовок и многочисленными ранениями, профсоюзные чиновники в Манчестере встречались со своими контрагентами по всей стране в попытке мобилизовать поддержку забастовок, и мы недавно получили сообщение о том, что им удалось убедить другие профсоюзы в необходимости принятия мер. Спекуляция сохраняется в отношении самой встречи, и многие предложения о том, что, возможно, был проведен Национальный конгресс профсоюзов с намерением создать местную политическую инфраструктуру в случае более организованных действий."
 uk.33.d: "На прошлой неделе стало очевидно, что планы должностных лиц профсоюза по всей стране были оперативно и эффективно реализованы. &lt; &lt; Лифлеты &gt; &gt; , как сообщается, были распространены среди членов профсоюзов в ряде крупных городов и городов для подготовки к действиям в течение этой недели и для того, чтобы быть готовыми в одно мгновение. &lt; &lt; Только вчера утром &gt; &gt; должностные лица профсоюза объявили о том, что на предстоящей неделе состоится генеральный забастовка, с тем чтобы заставить правительство сложить воедино многочисленные стратегии, которые не только осуществляются в Манчестере, но и в других местах. &lt; &lt; Наше правительство должно принять меры для того, чтобы в ближайшее время положить конец этой потенциальной катастрофе, мы должны тщательно выбрать ответ. &gt; &gt;"
 uk.34.d: "После недели напряженных переговоров, проведенных с руководителями профсоюзов в Лондоне, между их сторонами и правительством наконец было достигнуто соглашение, в соответствии с которым мы договоримся о сокращении ряда сокращений заработной платы в самых худших районах страны и гарантируем, что некоторые государственные предприятия будут оставаться открытыми для предотвращения дальнейшей безработицы."
 uk.35.d: "После того как из Вестминстера было принято решение о разгроме запланированных общенациональных полицейских сил по проведению всеобщих забастовок, им удалось сорвать несколько запланированных забастовок до того, как они начались вчера утром, однако среди профсоюзов по всей стране быстро распространились слухи. Сегодня они поспешно возвели баррикады в ряде важных промышленных районов Бирмингема, Манчестера, Ливерпуля, Глазго и даже в некоторых районах Лондона."
 uk.36.d: "Несмотря на недавнее объявление правительством военного положения, мятежники добились прогресса во многих районах по всей стране, обеспечив дополнительные улицы и поставив их под свой номинальный контроль. &lt; &lt; Судя по всему, наш тяжелый подход к урегулированию ситуации привел лишь к тому, что общественность разочаровалась с нашим собственным правительством и рядом с протестующими &gt; &gt; . &lt; &lt; Несмотря на эти осложнения &gt; &gt; . &lt; &lt; До сегодняшнего утра &gt; &gt; события стали становиться гораздо хуже. &lt; &lt; Сообщения о том, что военные подразделения отказывались от приказов о прекращении гражданских беспорядков во многих районах начали распространяться, в частности, бригада, предназначенная для защиты лондонской территории, сумела лишь удержать протестующих и не смогла приступить к наступлению &gt; &gt; . &lt; &lt; Если &lt; ситуация в стране не изменится &gt; &gt; , то мы можем столкнуться с такими волнениями, которые мы до сих пор считали немысленными. &gt; пришло время сделать политическое заявление, если мы хотим полностью урегулировать этот кризис."
 uk.37.d: "&lt; &lt; Сознавая рост насилия на улицах Великобритании, правительство сочло целесообразным уйти в отставку со своей позиции, с тем чтобы облегчить новый мандат народа Великобритании, с тем чтобы адекватно противостоять нынешнему кризису &gt; &gt; . &lt; &lt; Это были слова, объявленные радио сегодня, когда продолжающиеся гражданские беспорядки на всей территории страны распространяются еще дальше, а сам Вестминстер находится под угрозой силой. &gt; &gt; . Поскольку заявление правительства мало что произошло и беспорядки прекратились в крупных районах, должностные лица профсоюза решают, что делать. Однако одна часть страны использовала это время для продвижения своей собственной повестки дня. &lt; &lt; Король Эдуард VIII &gt; &gt; , как утверждается, регулярно встречался с военными лидерами с начала гражданских беспорядков и Вестминстер объявил об осуществлении военного законодательства. Эти встречи проводились до сих пор в тайне, но с учетом хорошо известной тенденции короля непосредственно заниматься политическими вопросами, для того чтобы увидеть, что вскоре может произойти в Британии &gt; &gt; ."
 uk.38.d: "«Справедливая справедливость и свобода восторжествовали сегодня, недемократические и злые силы коммунизма и социализма, которые намеревались насильно погубить и уничтожить эту великую нацию, были побеждены. Поскольку Бог назначил монарха этой нации, я возьму на себя роль главы этого Соединенного Королевства и ее правительства вместе с англиканской церковью. Сегодня мы отмечаем новую эру в британской политике и светлое будущее Великобритании и ее империи»."
 uk.42.d: "По мере того, как политический кризис, охвативший нашу страну, продолжается и только усугубился недавними событиями в Манчестере, многие члены нашего правительства считают, что пришло время для того, чтобы правительство оперативно созвало выборы в качестве средства обеспечения нового мандата народа этой страны."
 uk.43.d: "Ночь наступила. Ранние выборы, созванные нашим правительством месяц назад, завершились, и их результаты начинают быть тщетными по всей стране. Немногие члены нашего правительства надеются, что еще одно большинство в консервативном правительстве будет возвращено, чтобы продемонстрировать общественную поддержку нашей жесткой, но необходимой экономической политики. Тем не менее, есть слухи, что выборы не прошли, как мы предполагали, и многие партии стали популярными. Бесспорные разговоры о ночи, независимо от результата, несомненно, будут Независимой Лейбористской партией, поскольку либо победа, либо поражение для них будут определять их будущее в британской политике."
 uk.44.d: "Поздно ночью лондонцы, живущие в Тоттенхем Корт Роуд, были грубо потрясены несколькими крупными крушениями, за которыми последовало то, о чем многие говорили как о звуке очень большой волны, обрушившейся на их район. Когда местные жители выглянули из своих окон, они увидели то, что можно было бы назвать жидким цунами пивного ухода по дороге, перевернули несколько автомобилей и повредили все части имущества на ее пути. К счастью, самым серьезным ущербом, судя по всему, было несколько крупных наводнений внизу, когда Бернами сломала многочисленные двери дома. Нина волна, похоже, возникла из Мё и компании Брюэрри, и после дальнейшей инспекции на месте, как представляется, один из больших ват, хранящий печь, был разрушен ночью, создавая домино, которое выпустило около 323 000 имперских галлонов пива на улицу."
 uk.45.d: "Колония и Протекторат Кении, созданные в 1920 году, на протяжении длительного времени были очагом волнений и напряженности между белым правящим классом и коренными африканскими народами. &quot; Расовая сегрегация &quot; в колонии стала обычным явлением с момента создания Восточноафриканского Протектората в конце XIX века, однако, как представляется, сегодня напряженность достигла критической точки. &quot; Кикуйский народ &quot; доминирует в регионе, и сегодня он восстает против колониального правительства с широкомасштабными беспорядками и стычками, успешно парализуя Найроби и Момбасу и впоследствии лишая нас возможности укрепить местные гарнизоны. &quot; /nnnSporadic cyrmishes &quot; , о чем сообщалось во всей колонии, и если мы не предпримем действий в ближайшее время, то эта националистическая лихорадка, несомненно, распространится на другие колонии."
 #uk.50.d: "Прошло несколько трудных лет с тех пор, как роковые события в Черную среду, в которых, как кажется, почти всю жизнь назад, но с силой воли и характера мы упорно боролись с наихудшим экономическим кризисом и последовавшим за ним политическим кризисом. Сегодня наши усилия наконец-то были вознаграждены. . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . , , , , , , , , , , , ,"
 uk.50.d: "С восхождением к власти короля-Эмперора Эдуарда VIII на нашу справедливую нацию наступил новый политический рассвет. Быстрые изменения происходят во всем Королевстве в отношении экономических и социальных вопросов, однако один из недавних вопросов должен решаться самим королем. ~nn -- Флаг Соединенного Королевства остался неизменным после того, как Закон Союза в 1800 году официально добавил Ирландию в качестве части Соединенного Королевства. Однако недавние политические события позволяют нам решить, следует ли заменить союз Джека королевским стандартом короля-Эмперора, или же мы должны сохранить флаг, который стал синономным с Британской империей и его влиянием по всему миру."
 uk.60.d: "В 1916 году, в разгар Великой войны в Европе, ирландские республиканцы и националисты начали восстание в Ирландии. Сегодня история называет его Пасхальным подъемом, который в конечном счете был подавлен британскими вооруженными силами после почти жестокой недели боевых действий в Дублине и других районах страны. Руководство Ирландского республиканского братства - организации, которая стоит за восстанием - было захвачено британскими войсками и по настоянию Ирландской парламентской партии их суд не был отложен до окончания Великой войны. Этот выбор заключался в том, чтобы доказать, что сегодня наши усилия будут иметь место как ошибка, так и стремление к тому, чтобы вернуться. Несмотря на то, что в течение многих лет Великая война, остающиеся члены СИБ начали сюрпризную операцию, с тем чтобы освободить свое руководство из-под стражи. Силы безопасности в этом районе были легко перегружены, а руководство СИБ было освобождено."
 uk.61.d: "Согласно приказам, принятым сегодня утром британскими солдатами, развернутыми на улицах Ирландии с севера на юг, временно навязать порядок городам и городам, когда началась охота за СИБ. Местные ирландские охотники в ужасе смотрели на то, как, казалось, повторилось Пасхальное Восстание. ~ Несмотря на то, что во многих городах и городах элементы СИБ отказались сдаться и вести боевые сражения, на оживленных улицах вспыхнули многочисленные жертвы с обеих сторон. Конфликт продолжался по ночам, когда в Корке и Дублине вспыхивали бурные бои. Лишь через некоторое время после того, как были сданы остающиеся ячейки СИБ после того, как в Ирландии были вызваны новые британские подкрепления. ~ ENERLAL сообщает, что руководство СИБ было сбито ирландскими местными жителями, работающими на гражданской службе, которые заметили, что новые подкрепленные войска затопили регион в процессе подготовки к тому, что мы называем «Операция Сабре». ~ В то время, когда поселились бои над Ирфили над Ирой."
 uk.62.d: "Несмотря на огромное присутствие наших вооруженных сил на всей территории Ирландии, когда сегодня утром британская армия развернулась на улицах, местные командиры немедленно позвонили в штаб британской армии в Ирландии с довольно тревожными сообщениями."
 uk.63.d: "На рассвете сегодня утром Королевские ирландские полицейские подразделения, развернутые на улицах нескольких важных городов и городов по всему Ирландскому острову, пытались раз и навсегда разобраться с СИБ либо путем ареста, либо, если это необходимо, силой."
 uk.64.d: "Сегодня утром, когда над Ирландией взошло солнце, королевские ирландские полицейские подразделения развернулись по ирландским островам в попытке захватить и задержать руководство СИБ. Вскоре после запланированной операции стало ясно, что что что-то пошло не так. Несмотря на все усилия местных разведывательных служб, важная информация о сегодняшней операции, по всей видимости, попала в руки СИБ. Поскольку подразделения РИК ворвались в несколько мест по всей стране, они ничего не нашли, руководство СИБ не бежало заранее. Несмотря на эту неудачу, было бы гораздо хуже, если бы мы решили использовать наши вооруженные силы для того, чтобы раз и навсегда уничтожить СИБ. Несмотря на то, что СИБ прячется, все еще предстоит увидеть, что произойдет с этой организацией. Многие эксперты по разведке считают, что СИБ сделают выбор в пользу более подходящей возможности вновь вызвать хаос в Ирландии, пытаясь выгнать нас из Ирландии раз и навсегда."
 uk.65.d: "Сегодня утром в штаб-квартире Королевской разведки в Лондоне начали поступать срочные сообщения от лидеров РИК и местных военных командиров, до одного часа назад мы боролись за то, чтобы сделать головой или хвостами эти сообщения, поскольку многие просто указывали на то, что они подверглись нападению, а другие - просто на то, что они «посягают на вражеские силы». Некоторые довольно яркие молодые люди из разведки быстро узнали, что они видели в других местах этих нападений, это было очень похоже на метод, используемый СИБ во время пасхального восстания 1916 года."
 uk.66.d: "С тех пор прошло год с тех пор, как подразделения Королевской ирландской полиции ворвались в несколько ячеек СИБ по всей Ирландии и успешно захватили и посадили в тюрьму руководство СИБ до суда. С тех пор над Ирландскими островами случился нелегкий мир, но за ним последовало чувство стабильности."
 uk.67.d: "С помощью усилий Вестминстера, направленных на предоставление независимости Ирландии и официальное отделение ее от прямого контроля со стороны Лондона, во всех ирландских островах произошло множество изменений. Создано здание парламента, и ирландские граждане начали серьезно обсуждать будущее Ирландии как нации. Однако нам предстоит определить будущие отношения между нашими двумя нациями, поскольку Ирландия готова присоединиться к миру в качестве нации, вновь родившейся."
 uk.68.d: "Поскольку наше ужасное поражение в Ирландии привело к шоковым волнам во всей нашей стране, временное ирландское правительство лишь обрело силу и международное признание, и теперь, когда все Ирландские острова находятся под их контролем, оно использует дипломатические каналы с нашей страной в попытке положить конец войне. Несмотря на то, что их требования просты; Ирландские острова будут признаны независимой республикой, свободной от британского правления, и война между нашими двумя нациями прекратится. Наше правительство смеялось над такими вопиющими требованиями и уже приступило к реализации планов возвращения Ирландии. Хотя некоторые считают, что, возможно, после всех этих веков усилия по контролю над Ирландией просто не стоят этого."
 uk.69a.d: "К удивлению нашей нации британское правительство согласилось с нашими требованиями к миру и официально потребовало проведения переговоров по мирному соглашению между нашими двумя государствами, при этом Вестминстер признал, что отныне Ирландия будет независимой республикой, свободной от британского контроля."
 uk.69b.d: "Глупые британцы отвергли наше великодушное требование о мире между нашими двумя нациями, ссылаясь на то, что Ирландия «будет и навсегда станет частью Соединенного Королевства», они разорвали дипломатические каналы между нашими двумя нациями и сделали тонкие завуалированные угрозы относительно будущих попыток захватить нашу страну, мы должны подготовиться к нападению, которое, несомненно, произойдет."
 uk.70.d: "Сегодня было совершено нападение на один из наших промышленных центров в Ирландии. &lt; &lt; Террористическая организация &gt; &gt; , известная как &lt; &lt; Ирландское республиканское братство &gt; &gt; , заявила о том, что это нападение является одним из своих собственных. &lt; &lt; В результате этого нападения никто не погиб &gt; &gt; , однако некоторые люди получили серьезные ранения."
 uk.71.d: "Эти отвратительные террористы из Ирландского республиканского братства сегодня заявили о том, что бомбардировщики нанесли бомбовый удар по одной из крупных ирландских железных дорог, а еще два человека, как сообщается, были убиты, а еще несколько человек получили серьезные ранения."
 uk.72.d: "Сегодня стало известно о ужасающих новостях, поскольку члены СИБ были замечены в нападениях на членов Королевской ирландской полиции и нанесении им телесных повреждений. &lt; &lt; К счастью &gt; &gt; до сих пор не было убито ни одно из сотрудников полиции, но некоторые из них получили серьезные ранения. &lt; &lt; Эти нападения представляют собой угрозу для нашего контроля над Ирландией &gt; &gt; , поскольку мы в значительной степени полагаемся на РИК, которая борется с действиями мятежников и протестами мирно, чтобы предотвратить эскалацию. &lt; &lt; Ирландцы &gt; &gt; убивают себя &gt; ."
 uk.80.d: "Поскольку восстание в Индии быстро выходит из-под контроля, как нашему правительству, так и начальнику генерального штаба британской армии стало ясно, что это восстание потребует значительного количества времени, оборудования и людских ресурсов, чтобы эффективно ликвидировать его, и даже тогда мы не сможем добиться успеха. С учетом этого несколько членов Палаты общин выдвинули предложение о том, чтобы заставить правительство провести переговоры с лидерами мятежников, с тем чтобы положить конец этому мятежу. В предложениях уточняется, что Вестминстер будет гарантировать, что индийская автономия будет расширена на предстоящей Имперской конференции в 1937 году и что будет разработан долгосрочный план полного вывода британских войск из Индии. Это предложение, разумеется, является совершенно нелепым, но оно может служить умиротворению лидеров мятежников до тех пор, пока мы не будем более готовы к решению проблемы."
 uk.81.d: "Сегодня утром близ линии фронта в Западной Бенгалии был обнаружен британский офицер, который, по всей видимости, подошел к местному посту боевиков, размахивая белым флагом. Хотя сначала несколько наших боевиков были довольны возможностью британской капитуляции, похоже, офицер был просто посыльным, чтобы передать записку лидерам нашего восстания. В записке подробно излагается британское предложение о том, что они предоставят большую автономию Индии на Имперской конференции в 1937 году и предложат планы полного вывода британских войск из Индии в долгосрочной перспективе. Многие в нашем руководстве скептически относятся к тому, что британцы действительно последуют этому соглашению, но наши военные командиры хотят напомнить нам, что, хотя у нас есть преимущество на данный момент, британцы могут вскоре нанести нам полный гнев Империи, и что если они сделают это, то наше восстание, несомненно, будет раздавлено."
 uk.82.d: "Сегодня утром в Хайдарабаде была принята индийская повстанческая делегация для обсуждения предложения, выдвинутого нашим правительством в последние дни."
 uk.84.d: "Наше предложение о мире было принято лидерами мятежников в Индии, которые, по всей видимости, не были так уверены в своих целях, как нам казалось."
 uk.85.d: "С нашей победой над повстанческими силами подобие стабильности вернулось в Индию, хотя еще остается много проблем."
 uk.88.d: "В условиях полного краха новой независимой индийской нации бывшие администраторы Раджа бежали в Цейлон и создали на острове новую администрацию, и хотя они открыто не претендуют на индийский субконтинент, мы можем счесть их полезными позднее, как только мы официально восстановим порядок в Индии."
 uk.90.d: "Несмотря на наши усилия по умиротворению забастовщиков Манчестера в прошлом году, она, как представляется, является еще одной национальной забастовкой, объявленной Федерацией шахтеров. &lt; &lt; Добыча угля &gt; &gt; . &lt; &lt; Угольщики &gt; &gt; по всей стране проводят забастовку, означающую малую добычу угля. &lt; &lt; Хотя у нас и есть огромные запасы &gt; &gt; , они не продержат нас слишком долго. &lt; &lt; К счастью &gt; &gt; , эта забастовка преследует цель: забастовщики требуют от нас социальных выплат безработным. &lt; &lt; Принятие этих требований &gt; &gt; обошлось бы дорогой ценой для нашей и без того разрушенной экономики, но наша страна все еще сильно зависит от угля, и поэтому, если бы эта забастовка была продолжена, то, несомненно, она впоследствии имела бы тяжелые последствия."
 uk.91.d: "Как и опасались, наши запасы угля в настоящее время находятся на опасно низком уровне, поскольку в стране нет угля из-за того, что зима была очень холодной, а это означает, что возникла необычайно высокая потребность в этом угле, через который мы сгорели, что привело к многочисленным волнениям и протестам, требующим прекращения этой забастовки в определенных районах страны."
 uk.92.d: "Его королевское величество король Эдуард VIII посетил сегодня одну из угольных шахт и открыто заявил о своем сочувствии шахтерам и тем, кто пострадал от нехватки. Такой шаг серьезно подорвал легитимность нашего правительства, так как даже наш король сомневается в нашей политике!"
 uk.93.d: "Беспорядки внутри регионов нашей страны, вызванные нехваткой угля, достигли критического уровня, и многие районы страны вновь парализованы беспорядками разгневанных толпы граждан, призывающих правительство принять позитивные меры для решения проблемы нехватки угля."
 uk.94.d: "Ужасным и печальным следствием нехватки угля во время такой холодной зимы является ужасный факт, когда люди замерзают и в конечном итоге умирают от холода. &lt; &lt; Количество смертей &gt; &gt; действительно ошеломляет, и многие вновь сразу же стали винить нас и в том, что мы не смогли решить этот вопрос, как виновники этих смертей. &lt; &lt; Разумеется, такое утверждение нелепо &gt; &gt; , и надо винить в этом забастовщиков!"
 uk.95.d: "После изнурительной и холодной зимы мы стояли сильными и выходили из другой стороны от этих дефицитов и ударов. И вновь забастовщики капитулировали и возвращались к своей работе, и вновь уголь будет добываться, и народ больше не будет страдать от эгоистичных социалистических идей, прервая свой доступ к тепло и тепло, в которых он так отчаянно нуждался в течение прошлой зимы. Ценой этого удара стали жизни многих гражданских лиц, и я надеюсь, что те, кто пошел на забастовку, знают, что они действительно виноваты в их смерти. Мы можем принять некоторые из обвинений, но большинство из эгоистических горняков и их требований!"
 uk.100.d: "По мере того, как кризис трудящихся-манчестеров захватил страну, было ясно одно: без поддержки профсоюзов он, несомненно, не достиг бы тех высот, которые он сделал. Их изменчивая поддержка радикалов, намеревающихся причинить вред британскому народу, не должна быть прощена. Несмотря на то, что король приказал пересмотреть цель профсоюзов в нашей стране. Некоторые из более "крайних" членов Тайного совета начали выступать за полный роспуск профсоюзов, чтобы они никогда больше не пользовались властью, которую они когда-то делали. Король склонен выслушать все стороны по этому вопросу, и, возможно, путем создания возглавляемого государством профсоюза мы можем контролировать эту власть для себя и помочь облегчить бремя простого человека."
 uk.101.d: "Когда король поднялся на свой законный пост главы нашей нации, аристократия предоставила некоторые из его самых важных сторонников. Сегодня они просили, чтобы король изучил роль аристократии в нашей стране, при этом многие из этих людей жаждали власти за себя. В самом верху этих предложений аристократы позволили аристократам управлять регионами островов через местные советы, которые, конечно же, лояльны к королю, но способны на автономию в некоторых делах. Правопричинно посмеялись как попытка возродить феодализм в Британии, мало кто серьезно относится к этим предложениям, но, возможно, той выгоды, которую они могли бы принести, достаточно для того, чтобы рассмотреть эту идею в конце концов."
 uk.102.d: "В последние месяцы одним из самых активных сторонников короля была Церковь Англии, признавая свой большой вклад в сохранение статус-кво в Великобритании и выступая в качестве оплота против радикализма и нежелательных перемен в нашей стране, Церковь бросила на их долю монархию, сам король является религиозным человеком, но, возможно, не столь набожным, как подозреваемый, и в предстоящие дни он обратил внимание на то, что он решит будущее английской церкви и ее отношения с правительством."
 uk.103.d: "Учрежденные в середине 17-го года, домохозяйские кавалерии на протяжении всей британской истории играли важную роль в опеке над монархией. Действуя в качестве неотъемлемой части вмешательства короля и восстановления власти над Королевством, Домашняя гвардия значительно расширила свои обязанности, чтобы обеспечить порядок. Несмотря на то, что некоторые командиры этих престижных сил обратились к королю и попросили его рассмотреть вопрос о расширении функционирования монархической гвардии для обеспечения их эффективности в деле защиты короля и его семьи. За закрытыми дверями некоторые командиры намекнули, что они хотели бы, чтобы им были предоставлены дополнительные полномочия для искоренения изменных элементов британского общества."
 uk.104.d: "С момента восстановления власти королем Тайный совет значительно расширился по своим размерам и влиянию, которое он оказывает."
 uk.105.d: "Стабильность, мир, порядок и справедливость вновь воцарились по всей Британии. С помощью королевской рукой Британия сбежала от смерти революций и стала сильнее, как никогда прежде. Как и крысы, надвигающиеся на тучу, демократические политики страны начали выходить из своих дыр и говорить о королю, возвращающем власть в парламент. Все прощаются, что король просто использовал свою королевскую прерогативу для обеспечения безопасности Британии. Король, тем не менее, открыт для этих наваждений, как он воспринимается как «победитель» Британии и ее народа. Конечно, он должен признать важность своей позиции и что стабильность существует только благодаря его власти, и все, за что мы боролись, несомненно, испарится, если он откажется от контроля над теми, кто привел нас к грани катастрофы."
 uk.106.d: "В связи с тем, что король вновь утвердился в качестве хранителя нации, возник вопрос о том, кто охраняет Короля, так как группа видных патриотов и монархистов создала новый Орден рыцаря, Орден Короны, с благословением самого короля."
 uk.107.d: "Будучи серьезно обеспокоен событиями, произошедшими на родине во время кризиса рабочих-манчестеров, многие доминионы были встревожены тем, что мы попадем на путь радикализма. По мере того, как стабильность вновь вернулась в Великобританию, король отправился на экскурсию в Империю и заверил тех, кто сомневался, что Великобритания никогда не была сильнее, чем она сейчас. . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . ."
 uk.110.d: "-- С большой гордостью и приверженностью моей стране и ее народу я буду вести эту смелую нацию вперед со всей мощью в наших гаванях. Никогда больше не будут такие ужасные события, как те, которые произошли в Манчестере, когда-либо вновь будут чествовать эту страну. Под моим руководством будут услышаны все голоса, будут услышаны все идеи! Мы создадим поистине великую нацию и еще большую империю! -- -- не так ли, слова бывшего полковника, а теперь генерала Джека Черчилля, который после недавних недель хаоса в нашей стране выступил в поддержку вооруженных сил, чтобы восстановить порядок в Британии. Военная интервенция спасла эту страну от обрушения в смертном оружии коллективизма, и поэтому мы должны поблагодарить благородных людей высшего командования и попытаться исправить разногласия, возникшие в результате этой попытки революции. Пора восстановить Британию и защитить ее народ от зловещих идеологий?"
 uk.111.d: "В последние месяцы, после окончания кризиса в Манчестере, стало ясно одно: кризис никогда не смог бы достичь того роста, который он совершил без вмешательства известных провокаторов. Неспособность демократических правительств, преследовавших наше собственное правление, очевидна. Они с готовностью позволили подрывным элементам выйти на улицы Британии и сеть семена разногласий в нашей стране, с тем чтобы защитить себя от возможных новых катастроф. Мы должны создать новую организацию, чтобы искоренить мачиавеллианские элементы нашей великой нации, которые только хотят, чтобы она была разрушена. ENChurchill до сих пор тщательно продвигается вперед с реформами, чтобы предотвратить дальнейшие беспорядки, но он проявляет особый интерес к созданию британской антиреволюционной бригады (BARB) для обеспечения безопасности нашего нового правительства и защиты Британии от дальнейшего вреда."
 uk.112.d: "С момента прихода к власти Черчилль доказал, что он в значительной степени является лидером Великобритании, причем не только с его командованием администрацией и желанием обеспечить быстрое правосудие против врагов Великобритании, но и с его способностью видеть более широкую картину. Прежде всего это его критика нынешней системы образования Великобритании, которая, по его мнению, является серьезным фактором и коренной причиной кризиса в Манчестере. Подтверждая, что школы заполнены до глубины души радикалами, которые изливают ядовитую ложь в умы британской молодежи. В то время как одна из главных задач Джека в последние недели заключалась в разработке нового плана образования для британского народа, начиная с всеобщей реформы нынешних образовательных стандартов. Уделяя особое внимание строгости физической подготовки, патриотизму в государстве и народе, а также важности дисциплины в этих новых реформах, скорее всего, встретит всю систему образования, и некоторые из них сравнивают предложения со спартанскими методами обучения в Древней Греции."
 uk.113.d: "В основе предложений Черчилля лежат планы оживить британскую армию и вывести ее на фронт в качестве защитника Великобритании. В последние годы, запуганные некомпетентными политиками и их вопиющей нерептуту, британская армия должна быть перестроена изнутри, с тем чтобы она могла быть сильнее, чем когда-либо прежде. В консультации с генералами Великой войны Черчилль собрал пакет реформ и финансовых средств, которые значительно сотрясут британскую армию и сделают ее боевой силой, которой она должна была бы быть. / / / В дополнение к этим реформам содержится несколько более мелких положений, главным образом новое руководство, предназначенное для пехотинцев британской армии. &quot; Любой солдат, который вступает в действия без своего меча, был написаны ненадлежащим образом &quot; ."
 uk.114.d: "Поскольку военное руководство взяло под свой законный контроль управление нашей справедливой нацией, многие старые правительственные архивы были расследованы на предмет материалов, считающихся чрезмерно радикальными, и их создатели были включены в список наблюдателей. Из этого материала был отмечен один конкретный план нашей нынешней администрации, названный просто Планом J ее предыдущим владельцем, он выступал за быструю мобилизацию британской промышленности для удовлетворения военных требований после того, как стало ясно, что Империя находится на пути к конфликту с другой нацией. Несмотря на то, что в ответ на тяжелое положение, в котором оказалось правительство нашей страны в первые годы Великой войны, несколько важных промышленных лидеров нашей страны уже были ознакомлены с Планом J и должны были ежегодно информировать правительство о запланированных подготовительных мероприятиях."
 uk.115.d: "С нашим правлением над правительством и порядком, наложенным на ярмарки Великобритании еще раз, когда пришло время определить будущее нашей нации и нашего народа. Военные лидеры регулярно встречались с Черчиллем в течение последней недели, когда они пытались продумать вопрос о том, что должно быть сделано с нынешней правящей системой, при этом многие утверждали, что, хотя нынешнее военное правление приносит Британии стабильность, которая не может продолжаться вечно. Их критики утверждают, что если позволить Великобритании вновь принять демократию, то это лишь отклонит нашу ответственность за защиту Британии от дальнейшего вреда, и что у нас есть моральное обязательство продолжать правление на неопределенный срок. Человек, не отмеченный за терпением, Черчилль, с любопытством ратовал и позволил обеим сторонам спорить об этом в течение нескольких дней, что до сегодняшнего утра, было бы, . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . ."
 uk.116.d: "В рамках реформ Британской армии Черчилля необходимо будет принять новые меры в отношении значимости Королевского ВМС над британской армией в защите Великобритании. Хотя Черчилль и признал, что в течение последних веков Королевский ВМС в защиту британских берегов объединялся с огромными силами, он твердо убежден, что именно Королевский пехотинец в конечном счете решит, жива ли Великобритания или погибнет, находится ли она на полях домов или во время войны за рубежом. Несмотря на то, что такой Джек выдвинул новые законы, которые несколько ослабят Королевский ВМС и передадут некоторые технические ресурсы, имеющиеся в распоряжении Адмиралты, командованию британской армией, а также перевод ученых, отвечающих за исследования в области военно-морского развития, в районы, более полезные для Британской армии."
 uk.120.d: "Последствия коллапса Лондонского рынка являются международной проблемой, наши финансовые активы присутствовали на всех крупных державах и континентах, и поэтому, когда экономика рухнула, то и эти активы тоже. Поэтому было предложено созвать в Лондоне экономическую конференцию с участием крупнейших держав мира, с тем чтобы достичь соглашения о международных усилиях по преодолению последствий коллапса Лондонского рынка."
 uk.121.d: "Первый вопрос, который должен быть поднят на конференции, касался международной торговли, отчасти из-за нашей изоляционистской внешней политики, в нашей стране были установлены значительно высокие тарифы на иностранные товары, другие страны предлагают, чтобы все понижали свои тарифы, с тем чтобы стимулировать глобальную торговлю, тем самым способствуя укреплению мировой экономики и, в свою очередь, содействуя экономическому подъему."
 uk.122.d: "Еще один вопрос, который поднимался в ходе этой конференции, - это вопрос о международных долгах многих стран, включая некоторые из присутствующих сегодня держав. Хотя они и должны нам много денег, чтобы обеспечить более быстрое восстановление, возможно, было бы разумно просто снять любые долги, которые они имеют перед нами, что позволило бы им сосредоточить свою экономику на своем внутреннем восстановлении, а не на погашении своего международного долга. Многие члены нашего правительства настоятельно рекомендуют нам не делать этого, поскольку деньги, полученные в результате выплат по задолженности, могут быть очень полезны для нас в укреплении нашей собственной экономики."
 uk.123.d: "Поэтому для обеспечения стабильности мировой экономики крайне важно, чтобы стоимость фунта стабилизировалась. &lt; &lt; Коллапс Лондонского рынка &gt; &gt; вызвал значительную инфляцию во многих секторах нашей экономики, и поэтому, возможно, было бы разумно начать дефлятировать стоимость фунта, с тем чтобы добиться большей стабильности. &lt; &lt; Некоторые экономисты &gt; &gt; утверждают, что это может привести к дальнейшей нестабильности по мере того, как наша ранее надувавшаяся валюта начнет внезапно дефлировать, вызывая серьезную неопределенность на рынках и, как следствие, еще больше подрывая экономическую уверенность. &lt; &lt; Поэтому &gt; &gt; они утверждают, что мы должны установить стоимость фунта более высокими темпами, чем она сейчас, тем самым предотвращая дальнейшую инфляцию и должным образом стабилизируя стоимость фунта."
 uk.125.d: "В то время как наша страна готовится к полной войне с нашим новым врагом, кажется, что инакомыслие начинает вспыхивать в нашей собственной стране. Ирландское республиканское братство, которое постоянно находится на нашей стороне после Великой войны, устроило широкомасштабное восстание в Ирландии против нашего правления. Местные гарнизоны в Корке и Дублине переполняются нерегулярными войсками и некоторыми высокопрофессиональными солдатами, опасаясь, что это восстание спонсируется из-за рубежа. Независимо от того, действительно ли это имеет значение, важно то, что наши враги теперь имеют прекрасную возможность опосредованно нанести удар по нашей стране. Мы должны использовать всю нашу мощь, чтобы немедленно восстановить порядок в Ирландии, чтобы наши противники не установили опору в Ирландии."
 uk.130.d: "Поскольку Имперская конференция 37-го года закончилась всего лишь два года назад, кажется, что с момента ее завершения прошло время жизни. Были приняты мемориальные решения, и в результате этого по-прежнему ощущаются новые потрясения во всей империи и в большей части мира. Несмотря на то, что конференция этого года, по сравнению с ней, является менее насыщенной событиями. Главными проблемами, которые, вероятно, будут возникать в ходе всей империи, являются территориальные ситуации и номинальный статус нескольких Доминионов на всей территории страны. Прежде всего, канадская делегация, как ожидается, поднимет вопрос о Ньюфаундленде, поскольку ее правительство в последние несколько лет испытывает трудности, и сами канадцы считают, что это созрелая возможность официально интегрировать эту территорию в свою страну. Во-вторых, делегация Южной Африки, вероятно, предложит официально интегрировать территорию Родезии и Бечуаналенда в Южноафриканский союз. Наконец, мы должны обсудить нынешнюю глобальную ситуацию, которая, по мнению многих, быстро ухудшается, и подготовительные мероприятия, которые могут оказаться необходимыми для обеспечения нашей готовности к войне."
 uk.131.d: "Как и ожидалось, канадская делегация не потратила времени на то, чтобы поднять вопрос о Ньюфаундленде на конференции этого года. &lt; &lt; Осознавая, что администрация Ньюфаундленда не оправдала ожиданий своего народа и намеренно сделала ситуацию еще хуже для удовлетворения своей собственной жадности &gt; &gt; , канадцы потребовали, чтобы мы использовали нашу имперскую власть для того, чтобы либо распустить &lt; &lt; Ньюфаундлендский Доминион &gt; &gt; , либо интегрировать его в Канаду. &lt; &lt; Ньюфаундлендцы &gt; &gt; выступили с решительным осуждением того, что они назвали попытками навязать канадскому империализму, угрожая организовать протесты, если Ньюфаундленд будет решительно интегрирован в Канаду. &lt; &lt; Этот вопрос должен решаться деликатно, или мы рискуем еще больше дестабилизироваться в рамках империи &gt; &gt; ."
 uk.132.d: "До того, как представители различных частей Империи собрались сегодня для обсуждения вопроса о потенциальной войне в Европе и за рубежом, делегация Австралии втайне обратилась к нашему правительству с просьбой обсудить вопрос, представляющий интерес, о том, что они хотели бы пока остаться в тайне. После разъяснения своего предложения правительству все заинтересованные стороны смирились с тем, почему они хотят сохранить тайну. Австралийские представители предложили официально объединить австралийский и новозеландский доминион в единый «доминион Океании», сославшись на напряженную ситуацию в Азии и Тихом океане в качестве аргумента, а также на свою убежденность в том, что в случае проведения референдума новозеландцы проголосуют за присоединение к Австралии. ENGiven деликатный характер этого предложения, формальное объединение Новой Зеландии в Австралию, скорее всего, приведет к возникновению большого числа вопросов между двумя Доминионами. Поэтому наше правительство считает, что наилучшим путем действий является обращение к новозеландцам с просьбой провести референдум по этому вопросу, чтобы определить их судьбу."
 uk.133.d: "В связи с двумя важными проблемами мы переходим, пожалуй, к самому серьезному вопросу, присутствующему на этой конференции, а именно к вопросу о нынешней глобальной нестабильности. Многие члены нашего правительства считают, что нынешний период глобальной нестабильности может продолжаться по крайней мере еще несколько лет и что мы должны подготовить Империю в целом к войне с другими. Хотя такое понятие является разумным, оно окажется глубоко непопулярным. Империя все еще в значительной степени восстанавливается от последствий Лондонской коллапсовой коллапс, и люди могут сопротивляться попыткам милитаризации или частичной мобилизации нашей экономики. Мы должны также учитывать, что такой шаг может показаться проактивным по отношению к любой стране, которая рассматривает нас как будущего врага, что ухудшает саму глобальную ситуацию. nnProponents of Isolation полностью отвергли такое предложение, утверждая, что Империя должна сделать все возможное, чтобы избежать запутывания в другой войне, аналогичной Великой войне."
 uk.134.d: "Сейчас, когда пятнадцатая Имперская конференция близится к завершению, остается решить лишь один вопрос: статус Родезии в Империи. Южноафриканский союз официально представил предложение о проведении референдума в Родезии по вопросу о том, следует ли ему присоединиться к южноафриканскому Доминиону. Родезийские представители не отклонили это предложение, вместо этого заявив, что они будут следовать воле своего народа по этому вопросу, по всей видимости, предлагая нам &quot; зеленый свет &quot; по поводу референдума по этому вопросу в Родезии."
 uk.135.d: "В этом году успешно завершилась Имперская конференция. В этом году были рассмотрены некоторые важные вопросы, хотя пока еще не ясно, какое воздействие они окажут в конечном счете как на соответствующие Доминионы, так и на Империю в целом."
 uk.140.d: "Не прошло и месяца с тех пор, как наше новое правительство, сформированное между лейбористами и ИЛП, начало дестабилизироваться. Взволнованное желанием Клемента Аттле пойти на компромисс с нашей партией, несколько жестких сил его партии начали призывать к его исключению. Эта ситуация, как правило, игнорировалась бы как простая ссора со скамейками запасных, но вместо этого была отмечена явным молчанием его сторонников. До сих пор единственным депутатом, который стоял на высоком уровне, чтобы защитить позицию Аттле, был молодой Освальд Мосли, нынешний канцлер Казначея Казначея Казначея. Остается неясным, выдержит ли эта поддержка продолжающееся нападение разгневанных членов парламента в предстоящие недели."
 uk.141.d: "Слухи в зале Вестминстера, когда члены парламента, принадлежащие Независимой лейбористской партии, провели в последние недели серию закрытых заседаний. По всей видимости, премьер-министр, не желающий допустить, чтобы такая грязная игра повлияла на деятельность правительства, обратился к Мосли, чтобы поговорить с инакомыслящими, пытаясь ограничить их дестабилизирующие действия и принести порядок правительству. Хотя премьер-министр не ожидал, что эти вопросы закончатся в одночасье, он был глубоко обеспокоен докладом Мосли после его возвращения. Предположительно, мятежные члены парламента, принадлежащие к его партии, получили достаточную поддержку для того, чтобы добиться вотума недоверия руководству партии Аттле. Результаты, вероятно, станут достоянием общественности в ближайшие две недели."
 uk.142.d: "Как и ожидалось, голосование без доверия было проведено в тайне между членами парламента и привело к свержению Аттле, хотя многие были обеспокоены потенциальной нестабильностью в нашем правительстве до тех пор, пока ИЛП не нашли нового лидера, новые выборы руководства, по всей видимости, были созваны почти сразу же после голосования без доверия, требование, выдвинутое конкретно Мосли. - Несмотря на то, что до этого момента у нас были основания полагать, что Освальд был твердым сторонником Аттле по прагматическим причинам, но, как представляется, они были чисто эгоистичными политическими мотивами. В то время как в обществе Мосли одобрял Аттле в качестве лидера ИЛП, в тайне он был одним из тех, кто настаивал на голосовании без доверия, в то время как он был симуланно настроен стать следующим лидером ИЛП."
 uk.143.d: "С момента прихода Мосли к власти в ИЛП в партии начали происходить стремительные изменения с целью централизации власти на позиции Мозли. Еще более пугающе, что некоторые из наиболее "радиальных" членов нашей партии в последние дни встречались с Мозли наедине, с многочисленными подозрительными попытками заставить их перейти на сторону ИЛП, пытаясь свергнуть наш контроль над коалицией, и вместо этого поставить его в руки Мосли и ИЛП. ~н ~н ны пока эти слухи просто что, русы, но многие из нашей партии все больше беспокоятся об агрессивных действиях Канцлера Эксекера, и чья новая власть заставила его призывать к более смелым и смелым реформам каждую неделю."
 uk.144.d: "Поздно вечером премьер-министр сел в одиночестве в своем кабинете, закончив важную работу правительства, и почти неделю не разговаривал с Мосли, многие считали, что он составляет письмо с целью восстановить плохие отношения между ним и его канцлером Канцлером Казначея."
 uk.145.d: "Из-за прилежных действий его секретаря в последние недели премьер-министр медленно восстанавливался в больнице после того, как врачи диагностировали сердечную недостаточность. Хотя причина этого до сих пор неизвестна, многие подозревали, что последние напряженные недели внутри правительства привели к несчастному случаю."
 uk.146.d: "После смерти премьер-министра в лейбористской партии и правительстве в целом возник вакуум власти. Повстанческие депутаты в рамках нашей партии постоянно срывают усилия по выбору нового лидера партии для замены покойного Артура Гринвуда. Более страшная новость заключается в том, что многие высокопоставленные депутаты в лейбористской партии встречались с Мосли, чтобы обсудить возможность перехода в ИЛП, поскольку они обеспокоены отсутствием ясности в вопросе о правлении нашей партии в отношении нации. Такое изменение, вероятно, имело бы серьезные последствия для нашего правительства, если бы достаточное число членов парламента перешли в ИЛП, оно, вероятно, еще больше поставило бы баланс сил в руки Мосли."
 uk.147.d: "Сегодня утром Мосли заявил, что около трех десятков членов парламента от нашей партии присоединятся к ИЛП в предстоящие недели. Несмотря на то, что наши наихудшие опасения были реализованы, в то время как лейбористы все еще формально находятся в коалиции с ИЛП, наша власть была значительно ослаблена и поэтому наша способность добиваться реформ, которые мы выбираем."
 uk.148.d: "Прошла неделя с тех пор, как новый премьер-министр Мосли захватил власть над нашим новым правительством. Быстро, перемены начинают ощущаться в залах Вестминстера. Политики и гражданские служащие активно бегут через корридоры, когда новые приказы передаются почти каждый час новым премьер-министром. Несмотря на обстоятельства его победы, многие оказались по крайней мере довольны тем, что в прошлом нестабильность закончилась. Хотя многие беспокоились о планах Мосли в отношении правительства в будущем, их опасения были сняты сегодня утром, когда премьер-министры обратились в парламент, чтобы провести прямую радиопередачу для нации. Несмотря на то, что перед британским народом стояла грандиозная задача как в обеспечении его судьбы, так и в преодолении его нынешних проблем после Лондонского фондового рынка, Мосли заверил тех, кто находится в нашем правительстве и в нашей стране, что путь, ведущий к этому правительству, является правильным, чтобы обеспечить процветание и мир в Великобритании и ее империи."
 uk.149.d: "Хотя наше правительство остается относительно стабильным и свободным от типичной критики со стороны оппозиции, наши действия сделали нас оппонентом самого короля, и мы возмущены явными стремительными изменениями нашего правительства и успехами в направлении подлинного социализма, которые мы обещали народу Великобритании, король Эдуард VIII открыто выступил с осуждением действий Мосли и нашего правительства. Этот обмен словами продолжался лишь тогда, когда Мосли обвинил многих из тех, кого он называет «реакциями», в том, что они препятствуют прогрессу в нашей стране."
 uk.150.d: "В последние недели Палата лордов, давний упорный противник в предотвращении проведения необходимых реформ в Мосли, особенно эффективно задержала принятие всех новых законов, премьер-министр в координации со своим кабинетом рассмотрел планы предлагаемой реформы Палаты лордов, в которой новая верхняя палата будет представительной, а не наследственной по своему характеру."
 uk.151.d: "С учетом того, что недавно реформированная верхняя палата стала представительной, мы стали свидетелями того, как на Британских островах проходит новая волна выборов для заполнения этих новых демократических позиций. &lt; &lt; Первый реальный лакмусовый тест &gt; &gt; правительства на то, как общественность воспринимает свои действия в последние месяцы, результаты оказались ненадежными. &lt; &lt; ИЛП &gt; &gt; получила полное большинство в этой новой Верхней палате, что значительно превысило половину общего числа мест, причем ее нынешний партнер по коалиции едва получил дюжину должностей. &gt; &gt; ."
 uk.152.d: "С тех пор, как погиб покойный Артур Гринвуд и десятки членов парламента перешли в ИЛП, лейбористы сбились с пути и боролись с враждой, однако они по-прежнему сохраняют сильную власть над нашим правительством, и, как такой Мосли недавно встретился со своими ближайшими политическими союзниками, чтобы обсудить свой выбор."
 uk.153.d: "С тех пор, как власти стали противиться нашим новым реформам, в нескольких департаментах, не в последнюю очередь в вооруженных силах, где ежедневно растет волнение старших офицеров."
 uk.154.d: "Однако проблема все еще сохраняется, поскольку около полудюжины его самых решительных критиков отказались прислушаться к его требованиям, утверждая, что если они будут продолжать решительно рассматривать возможность сопротивления правительству Мозли, то Мосли встретился со своими ближайшими союзниками и решил, что единственным путем реагирования на эти угрозы демократически избранному правительству Великобритании является борьба с этими предателями."
 uk.155.d: "Политика, имеющая первостепенное значение для Мосли и ИЛП, заключается в национализации многих важных компаний на Британских островах и по всей империи. Эти отрасли имеют огромное значение для Великобритании и ее народа и не могут оставаться в руках нескольких наживающихся толстяков. Мозли согласен, правительство согласно, эти новые компании должны быть государственными, чтобы обеспечить наше дальнейшее процветание в будущем."
 uk.156.d: "Сегодня вечером премьер-министр Мосли в прямом эфире обратился к жителям Британии со своего офиса на 10 Даунинг-стрит. Говоря о проблемах, которые британцы преодолели в последние месяцы, и о проблемах, которые еще предстоит решить, он поздравил британцев с возможностью приспособиться к новой эпохе, в которой мы живем, и продолжать жить так, как это всегда было. ~ Не смотря на свои будущие планы в отношении Британии и Империи, Мосли утверждал, что он не допустит, чтобы Британию втягивали в очередную разрушительную войну за рубежом, если только сама Великобритания не подвергнется угрозе. С возникновением кризиса на континенте многие были рады услышать, что сама Великобритания останется вне зоны конфликта в Европе. По крайней мере сейчас."
 uk.160.d: "С началом войны между нами и Францией различные колонии обеих наших империй по всему миру оказались поглощены борьбой между нашими двумя нациями. Возможно, худшее из них — это наша колония в Бирме, которую мы обычно полагались на правительство Раджа для защиты. ~ nnDue на восстание, с которым в последнее время сталкивались в Индии, мы сочли возможным непосредственно управлять Бирмой для того, чтобы обеспечить временную стабильность в регионе, но теперь, когда Радж вновь стабилизировался, было бы разумно вновь поставить Бирму на их попечение, с тем чтобы помочь защитить регион от угрозы французской индочина."

