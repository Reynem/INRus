 IMP_iedc: "СВУК"
 IMP_iedc_desc: "Имперская корпорация экономического развития была создана в нашей стране и будет оказывать помощь в наших усилиях по строительству."
 IMP_ito: "ИТО"
 IMP_ito_desc: "Созданная вскоре после Великой войны, Имперская торговая организация значительно расширила свои полномочия, и теперь она будет защищать нашу торговлю от опасной внешней конкуренции."
 IMP_isaac: "ИСАК"
 IMP_isaac_desc: "Имперская академия наук и аэронавтики теперь занимает опору в нашей стране, что приносит большую пользу нашим исследованиям."

