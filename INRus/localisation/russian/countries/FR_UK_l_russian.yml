 ### Foreign Intervention ###

 ENG_foreign_intervention: "Вмешательство иностранных государств"
 ENG_foreign_intervention_desc: "Несмотря на нашу позицию по вопросу об изоляции в межвоенные годы, последние события позволили нам заняться несколькими зарубежными делами, масштабы нашего участия будут зависеть от наших решений в ходе четырнадцатой Имперской конференции."

 # - Diplomatic

 ENG_reform_entente: "Реформировать Констант Кордиале"
 ENG_reform_entente_desc: "Поскольку как мы, так и французы воевали с немцами, несколько известных членов нашего правительства начали предлагать официально обратиться к французскому правительству и предложить вновь возродить Кордиалевский союз до тех пор, пока немецкая угроза не будет побеждена."

 ENG_league_germany: "Англо-германский альянс"
 ENG_league_germany_desc: "В то время как обе наши нации были на противостоящих сторонах в Великой войне, и мы, и Германия в состоянии войны с Францией, многие считают, что пришло время предложить немцам официальный союз."

 ENG_kill_yemen: "Уничтожить имамата Йемена"

 ENG_transcaspia_ultimatum: "&lt; &lt; Ультиматум &gt; &gt; -- &lt; &lt; Транскаспия &gt; &gt;"

 ENG_seize_panama: "Начало операции &lt; &lt; Питкэрн &gt; &gt;"
 ENG_seize_panama_desc: "После нескольких недель планирования операция &lt; &lt; Питкэрн &gt; &gt; наконец-то готова к продолжению. &lt; &lt; Наши вооруженные силы ожидают нашего командования &gt; &gt; ."

