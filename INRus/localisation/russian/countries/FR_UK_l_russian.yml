 # - Formable Nations

 ENG_formable_nations: "Сформулируемые страны"
 ENG_angevin: "Ангевинская империя"
 ENG_angevin_desc: "Придя к бесцеремонному концу в середине 13-го года, Ангевинская империя была постепенно распущена, так как французские войска оттолкнули Английский дом Плантагенет от материковой Европы. В то время как нынешний Дом Виндзор никогда не ссылался на королевство Франции или французскую страну, наша новая позиция, форма правления и недавние завоевания позволили нам еще раз заявить о том, что Франция находится под контролем."

 ##### Focus #####

 #Industry 
 ENG_revive_british_industry: "Централизация промышленного контроля"
 ENG_revive_british_industry_desc: "Британская промышленность разделена на огромное количество небольших холлов, часто используя архаичные методы, защищенные монопольными или картельными соглашениями."
 ENG_highlands_mining: "Северное море Нефть"
 ENG_highlands_mining_desc: "Геологическая экспертиза показывает, что огромные запасы нефти находятся под Северным морем у побережья Шотландии."
 ENG_expand_rsaf_enfield: "Расширить RSAF Enfield"
 ENG_expand_rsaf_enfield_desc: "Королевская фабрика по производству стрелкового оружия в Энфилде является историческим центром производства стрелкового оружия нашей армии."
 ENG_expand_bsa_birmingham: "Расширить компанию BSA"
 ENG_expand_bsa_birmingham_desc: "Бирмингемская компания по стрелковому оружию является одним из важнейших промышленных объектов страны, производящих все, от винтовок и пулеметов до военных автомобилей."
 ENG_support_wales: "Промышленное развитие Уэльса"
 ENG_support_wales_desc: "Угольные и сталелитейные заводы Южного Уэльса когда-то были двигателем Империи. Сейчас они страдают от недостаточного инвестирования и высокой безработицы. Мы должны направлять государственные средства на модернизацию этих жизненно важных отраслей промышленности, обеспечивая наше внутреннее снабжение углем и сталью, принося при этом новое процветание уэльским долинам."
 ENG_support_scotland: "Поддержка шотландских низменных земель"
 ENG_support_scotland_desc: "Корабельные верфи Клайда и литейные верфи Глазго - это промышленное сердце Шотландии. Чтобы сохранить господство Королевского ВМС и оснастить наши сухопутные войска, мы должны обеспечить, чтобы эти тяжелые предприятия функционировали с максимальной эффективностью. Эта программа позволит модернизировать верфи Клайдсайда и оказать поддержку инженерным фирмам в Лаулендах."
 ENG_support_ulster: "Поддержка & Harland & Wolff"
 ENG_support_ulster_desc: "Корабельные верфи Харланда и Вулффа в Белфасте являются одними из крупнейших в мире, известными своей способностью строить самые сложные суда. Для обеспечения того, чтобы Королевский ВМС оставался несомненным хозяином морей, мы должны перебросить контракты и ресурсы на эти верфи, расширив их возможности для производства нового поколения капитальных судов."
 ENG_reduce_london_centrality: "Снизить центральность Лондона"
 ENG_reduce_london_centrality_desc: "Слишком долго Лондон был экономической черной дырой, вытаскивая все деньги и промышленность из остальной Англии."
 ENG_ive_got_a_brand_new_combine_harvester: "У меня новый сборщик комбинаций..."
 ENG_ive_got_a_brand_new_combine_harvester_desc: "Несмотря на то, что северяне на юго-западе, в то время как графства Домов как рычащие южане, а жители графства Дома видят, что жители Западной страны - это деревенские козлы, Юго-Запад созрел с потенциалом. Уэссекс - это место рождения Англии, где Альфред сражался с Великой Хефенской армией, и именно Этельстан Уэссекс впервые взял корону короля английского языка в 927 году. Теперь регион обладает потенциалом для сокращения нашей продовольственной зависимости от Америки, которая мучила нас после отмены законов о кукурузе, и расширения и без того значительной морской промышленности Плимута, а также развития естественной гавани Пуле."
 ENG_develop_tyneside: "Разработать Тайнесайд"
 ENG_develop_tyneside_desc: "Промышленные комплексы Тайнесайда, в которых живут такие гиганты, как Викерс-Армстронги, имеют решающее значение для наших военных усилий."
 ENG_gods_country: "Страна Бога"
 ENG_gods_country_desc: "Стальные заводы Шеффилда производят лучшие бронежилеты и артиллерийские компоненты в мире, в то время как текстильные фабрики Лидса и Брэдфорда одевают наши армии."
 ENG_car_industry: "Автомобильная промышленность Мидлендс"
 ENG_car_industry_desc: "Мидленды уже давно находятся в центре британского автомобильного мира, и для того, чтобы Великобритания расширила свое доминирование в европейской автомобильной промышленности перед лицом французской и немецкой компеции, мы должны поддержать эти компании."


 ##### Internal Politics #####

 # - Democratic Paths

 ENG_dem_victory: "Демократическая победа"
 ENG_dem_victory_desc: "Демократия и свобода вновь воцарились в Великобритании."

 # - Tory Maj

 ENG_con_maj: "Консервативное большинство"
 ENG_con_maj_desc: "Тори выиграли свои третьи выборы подряд, но на этот раз все по-другому, теперь у них явное большинство в парламенте."
 ENG_regain_control: "Восстановление контроля"
 ENG_regain_control_desc: "После катастрофы Лондонского фонда многие люди начали терять веру в Консервативную партию, но из-за эффективной политики по преодолению катастрофы, которая ощущалась во всей стране, их лидерство получило широкую поддержку."
 ENG_redraw_constit: "Перекройте границы избирательных округов"
 ENG_redraw_constit_desc: "Недавно министерство внутренних дел выдвинуло идею о том, чтобы решить некоторые из наших проблем с популярностью, изменить границы избирательных округов в ряде районов по всей территории Британских островов, используя реформу в качестве предлога, мы можем создать более благоприятные условия для нашей партии и обеспечить безопасность большего числа депутатов на следующих выборах."
 ENG_deal_opposition: "Борьба с оппозицией"
 ENG_deal_opposition_desc: "Для того чтобы обеспечить наше господство в парламенте, в предстоящие месяцы мы должны бороться с рядом важных дополнительных выборов."
 ENG_tory_nation: "Консервативная нация"
 ENG_tory_nation_desc: "Наши ценности, наши традиции, наш священный образ жизни стали источником вдохновения для британского народа по всей Империи."

 ENG_court_corp: "&lt; &lt; Суд над корпорациями &gt; &gt;"
 ENG_court_corp_desc: "Сейчас, когда наше новое правительство находится на месте, настало время связаться с многочисленными важными бизнесменами по всей нашей стране."
 ENG_restrict_unions: "Ограниченная профсоюзная деятельность"
 ENG_restrict_unions_desc: "Слишком долгое время, когда профсоюзы выступали в поддержку благородного дела отстаивания прав трудящихся, они в последние годы резко радикалировали и теперь выдвигают все возрастающее число неприемлемых требований."

 # - Tory+LibNats Coalition

 ENG_tory_coalition: "Консервативно-либеральная коалиция"
 ENG_tory_coalition_desc: "Ветры политики постоянно меняются, и, похоже, мы видим следующее. В то время как Тори увидели сильный поворот, мы не получили подавляющей поддержки, на которую мы надеялись, и значительное число либералов-националов получили места рядом с ними. Для того чтобы иметь большинство в парламенте, между нашими двумя партиями была сформирована коалиция для обеспечения стабильности."
 ENG_compromises: "Компромиссы"
 ENG_compromises_desc: "В то время как обе партии нуждаются друг в друге, чтобы сохранить власть, обе стороны должны пойти на компромиссы. Либерально-национальным партиям нужны Тори больше, чем они готовы признать, и как многие из более умеренных среди их партии изменили верность и теперь следуют линии Тори."
 ENG_cut_red_tape: "Вырезать красную ленту"
 ENG_cut_red_tape_desc: "Один из ключевых манифестов Либеральной национальной партии в отношении времени выборов обещал уменьшить чрезмерную бюрократию во всей стране, думая, что это удушает эффективность повсюду, никто не должен возражать, если мы уволим пару сотен гражданских служащих."
 ENG_unify_gov: "Объединение правительства"
 ENG_unify_gov_desc: "Оппозиция может говорить все, что захочет, но в конце концов решения, затрагивающие эту нацию, будут приниматься нашей коалицией."

 ENG_party_loyalty: "Обеспечение лояльности сторон"
 ENG_party_loyalty_desc: "С нашей неустойчивой позицией в рамках коалиционного правительства многие члены нашего кабинета начали настаивать на принятии более строгих мер для обеспечения того, чтобы наши мятежные члены парламента были «убедены» чаще сражаться за партийную линию."
 ENG_strengthen_whips: "Укреплять петли"
 ENG_strengthen_whips_desc: "В рамках наших мер по усилению контроля над нашими неуправляемыми членами парламента наше правительство находится на грани принятия новых мер по укреплению партии &lt; &lt; Уип &gt; &gt; ."

 # - Labour+ILP Coalition

 ENG_socialist_coalition: "Социалистическая коалиция"
 ENG_socialist_coalition_desc: "Впервые с момента своего создания в 1900 году Лейбористская партия получила большинство голосов в парламенте, и эти социалистические планы труда и ИЛП могут быть тем, что Британии нужно для обеспечения ее будущего."
 ENG_root_marxism: "Корни марксизма"
 ENG_root_marxism_desc: "Наша коалиция с ИЛП, возможно, необходима нам для управления, но нет никаких причин, по которым мы не можем вырвать более радикальных членов нашего младшего партнера, мы не должны позволить этим экстремистским идеям взять на себя политику правительства и, при необходимости, очистить этих заблудших овец от правительства."
 ENG_expand_fund: "Расширить Фонд по безработице"
 ENG_expand_fund_desc: "Одно из наших основных обещаний состояло в том, чтобы расширить Фонд безработицы, который в настоящее время доступен британскому народу."
 ENG_ilp_integrate: "Включить ILP"
 ENG_ilp_integrate_desc: "Теперь, когда мы удалили более экстремистских членов ИЛП, настало время "убедить" наших друзей официально присоединиться к нашей партии."
 ENG_united_socialist: "Объединенный социалистический фронт"
 ENG_united_socialist_desc: "С включением депутатов ИЛП в состав нашей партии наша власть над правительством сильнее, чем когда-либо прежде, мы добились успеха в том, что многие считали невозможным; мы создали единый социалистический фронт против непрогрессивных элементов политики наших наций."

 # - The King Commands

 ENG_absolutism: "Боже, спаси короля!"
 ENG_absolutism_desc: "После больших гражданских беспорядков по всей стране Его Королевское Высочество Эдуард VIII распустил парламент и взял власть над будущим Империи в свои руки. Впервые после Закона о реформе в 1832 году король правит своей страной."
 ENG_fate_unions: "Судьба профсоюзов"
 ENG_fate_unions_desc: "Профсоюзы, будучи неотъемлемой частью кризиса трудящихся в Манчестере, наконец-то перешли черту предвыборной революции, и пришло время нам раз и навсегда решить, что станет с этими самодостаточными организациями."
 ENG_aristocracy: "Роль Аристократии"
 ENG_aristocracy_desc: "Многие из величайших сторонников короля в его вмешательстве, чтобы спасти наш народ от разрушения, пришли от аристократии нашей нации."
 ENG_faith_nation: "Вера в нашу нацию"
 ENG_faith_nation_desc: "Церковь Англии, будучи номинальным борцом против радикализма, решительно поддерживает нашего короля в его стремлении подавить радикализм во всей стране и навязать порядок и справедливость."
 ENG_household_guard: "Домашняя охрана"
 ENG_household_guard_desc: "Будучи элитным телохранителем монархии, Домашняя гвардия сыграла видную роль в обеспечении власти над неустойчивым демократическим правительством, которое предшествовало нам."
 ENG_expand_privy: "Расширение членского состава Тайного совета"
 ENG_expand_privy_desc: "В последние годы Тайный совет, созданный в качестве консультативного органа монархии, был просто заполнен политиками-сикофантами."
 ENG_destiny: "Наш путь и судьба"
 ENG_destiny_desc: "Провидение повело короля к сегодняшнему дню, его действия в кризисе трудящихся Манчестера оказались правильными. Стабильность и мир, и мы вернулись на наши честные острова, и наше правление в безопасности. Остается последний вопрос: где судьба Британии?"

 # - Jack's Dictatorship

 ENG_junta: "Военная хунта"
 ENG_junta_desc: ""Огонь!" Приказ пошёл вниз, и мятежники пали перед британскими военными. Когда социалисты побежали один человек, они произнесли волнующую речь. Полковник Джек Черчилль поднял антикварное слово в воздухе, осуждая политиков, которые заставили его и его людей убить британские народы на британской земле. Они никогда больше не позволили бы тем, кто выше, навязать действия против британского народа. Есть только один способ обеспечить это."
 ENG_establish_barb: "Создание БАРБ"
 ENG_establish_barb_desc: "Улицы шепчут восстание, радикализм прячется повсюду в тени, чтобы искоренить эти коварные и серьезные угрозы нашей нации, должна быть создана новая организация, чтобы уничтожить угрозы, где бы они ни были найдены."
 ENG_purge_opposition: "Церемония Судьбы"
 ENG_purge_opposition_desc: "Премьер-министр и несколько других видных членов парламента были доставлены в военный трибунал и быстро признаны виновными в государственной измене и соучастии в убийстве нескольких сотен британских граждан."
 ENG_soldier_education: "Образование солдата"
 ENG_soldier_education_desc: "В основе революций, которые пытались свергнуть правительство, лежит система образования Великобритании, возможно, пришло время создать новую патриотичную систему образования."
 ENG_royal_army_reforms: "Реформы Британской армии"
 ENG_royal_army_reforms_desc: "В то время как некоторые считают взгляды Черчилля на британскую армию причудливыми, его желание изменить эти сплетни легко."
 ENG_mil_ind_complex: "Начать план J"
 ENG_mil_ind_complex_desc: "План J, созданный предыдущими правительствами в случае войны, предписывает быструю мобилизацию британской экономики на военное время."
 ENG_future_britain: "Будущее Великобритании"
 ENG_future_britain_desc: "В эти трудные времена наше будущее разошлось, какой путь должна пройти Великобритания, чтобы обеспечить свое превосходство?"
 ENG_dictatorship: "Лорд Защитник"
 ENG_dictatorship_desc: "С очищением парламента от нежелательных элементов и обеспечением безопасности правления Черчилля он взял титул лорда-защитника Королевства с благословения самого короля. Измена политиков больше не будет толстеть на спинах британского народа - Черчилль убедится в этом."

 # - Mosley as Premier

 ENG_england_lives: "Англия жива!"
 ENG_england_lives_desc: "Жизнь снова протекает по Британским островам, исчезает старая и деградированная политика. Сегодня новая эра готова быть захвачена Мосли и его учениками."
 ENG_subjugate_labour: "Порабощение труда"
 ENG_subjugate_labour_desc: "Наших беспутных двоюродных братьев нужно показать истинный путь к социализму и миру на нашей земле."
 ENG_overcome_lords: "Преодоление Лордов"
 ENG_overcome_lords_desc: "Несомненно, устаревший институт, который препятствует осуществлению нашей новой политики по всей Великобритании."
 ENG_meet_mil: "Встреча с представителями вооруженных сил"
 ENG_meet_mil_desc: "С тех пор, как мы заняли законное положение в качестве лидеров этой страны, среди военнослужащих шли слухи о несогласии, и для того, чтобы утешить этих презренных овец, Мосли пригласил их в парламент, чтобы они могли обсудить будущее Британии."
 ENG_national_program: "Программа национализации"
 ENG_national_program_desc: "Одна из ключевых экономических стратегий экономического плана Мосли состоит в том, чтобы национализировать несколько важных отраслей по всей империи, и эти новые отрасли будут поставлены под правительственный контроль, с тем чтобы обеспечить их работу в наилучших интересах британского народа."
 ENG_brit_spirit: "Старый добрый британский дух"
 ENG_brit_spirit_desc: "Британия завтрашнего дня также должна быть одной из прошлых, и у британского народа есть много великих и достойных восхищения качеств, но в последние годы на них повлияло вмешательство и вмешательство иностранных государств, дух Великобритании должен проснуться, и еще раз мир будет дрожать от ее приближения."
 ENG_marches_on: "И марш!"
 ENG_marches_on_desc: "Свет Британии вновь ярко сияет, направляющий свет, ведущий человечество к его судьбе, и мы просветим путь, по которому должны следовать все другие страны, путь завтрашнего дня, путь к социализму."

 # - Navy with a State

 ENG_navy_state: "Военно-морские силы с государством"
 ENG_navy_state_desc: "С тем, что Иден у власти и он согласен с высокопоставленными офицерами Королевского ВМС, Великобритания вновь в безопасности от попыток оставить свою беззащитную против иностранных держав."

 ENG_cement_rule: "Усиление нашего правила"
 ENG_cement_rule_desc: "Несмотря на то, что Иден предписывает правительству действовать в интересах Королевского флота - и, конечно же, Империи, - все еще есть много людей, которые будут противодействовать нашим собственным усилиям, и поскольку мы все еще предполагаем, что необходимо приложить демократические усилия для того, чтобы подавить этих инакомыслящих."
 ENG_naval_lords: "Морские лорды"
 ENG_naval_lords_desc: "Хотя с начала этого века власть Палаты лордов была несколько ослаблена, она по-прежнему оказывает большое влияние на многие кварталы сочувствия."
 ENG_custodians: "Хранители Короны"
 ENG_custodians_desc: "Королевский флот является первой линией обороны Империи и, следовательно, самой монархии."
 ENG_defender_demo: "Организация &lt; &lt; Защитники демократии &gt; &gt;"
 ENG_defender_demo_desc: "В прошлом Королевские военно-морские силы выступали в качестве правительственного инструмента для навязывания политического урегулирования иностранным странам, таким, как те, кто славится в Атлантическом и Южно-Индском океанах."

 ENG_repeal_naval_cuts: "Отрубы в военно-морском флоте"
 ENG_repeal_naval_cuts_desc: "Первым актом нашего правительства должна стать отмена тех катастрофических сокращений в военно-морских силах, которые привели к тому, что Мутини в Инвергордоне, и только таким образом мы сможем довести Королевский флот до высот, которые ранее не были известны и не были услышаны."
 ENG_navy_guns: "Оружие военно-морского флота"
 ENG_navy_guns_desc: "Большие пушки ВМС - это оружие, которое мы используем для того, чтобы судить наших врагов, и поэтому они должны оставаться современными и без соперничества."
 ENG_first_rate_industry: "Промышленность первой ставки"
 ENG_first_rate_industry_desc: "С учетом того, что Соединенные Штаты быстро опережают нашу страну в промышленном отношении, мы должны приложить усилия для того, чтобы заложить основу для дальнейшей промышленности, используемой для поддержки наших ВМС и усилий правительства по ее дальнейшему расширению."
 ENG_navy_engine: "Двигатель военно-морского флота"
 ENG_navy_engine_desc: "Мы должны продолжать развивать суда, которые могут преследовать и одолевать наших врагов через Семи моря."
 ENG_sons_waves: "Сыны Волн"
 ENG_sons_waves_desc: "Идемте, подбодритесь, ребята, к славе мы управляем, чтобы добавить что-то еще в этот замечательный год; для того, чтобы почтить нас честью называть вас, как свободных людей, не рабов, для тех, кто так свободен, как сыны волн?"
 ENG_navy_armour: "Армия военно-морского флота"
 ENG_navy_armour_desc: "С развитием более крупного и мощного оружия как в Империи, так и в домах наших врагов, необходимо поддерживать и модернизировать броню, если мы хотим выдержать удары, нанесенные нам нашими врагами."
 ENG_naval_impressment: "Впечатление в военно-морском флоте"
 ENG_naval_impressment_desc: "Хотя военно-морское впечатление закончилось концом Наполеона в начале 19-го года, войны, которые мы можем встретить в ближайшем будущем, могут потребовать новых чрезвычайных мер, хотя это, несомненно, нанесет ущерб отношениям между нами и иностранными державами."

 ENG_tempest: "Программа &lt; &lt; Напряжение &gt; &gt;"
 ENG_tempest_desc: "Эта военно-морская программа, названная Темпестом, направлена на укрепление нашей позиции на Семи морях путем строительства еще четырех боевых кораблей современного вида."
 ENG_eclipse_rivals: "Проверьте наши градиенты"
 ENG_eclipse_rivals_desc: "Продолжая усилия по доминированию в Мировом океане, Королевский ВМС обратился с просьбой о строительстве двух дополнительных перевозчиков для оказания помощи в проекции энергии по всему миру."
 ENG_steel_shield: "Стальный щит"
 ENG_steel_shield_desc: "Действуя в защиту наших торговых маршрутов, мы должны построить дополнительные суда для охраны обширного пространства Империи."
 ENG_tighten_grip: "Прижмитесь к нам."
 ENG_tighten_grip_desc: "Несмотря на то, что наш ВМС является одним из самых больших в мире, для сохранения своего положения требуются регулярные программы модернизации, в частности, для Королевских ВМС интересуют легкие крейсеры, чтобы убедиться, что у нас никогда не хватит кораблей."

 ENG_sword_shield: "Наш меч и щит"
 ENG_sword_shield_desc: "Королевский флот - это как меч, через который мы бьем наших врагов, так и щит, через который мы охраняем от их ударов. Без него Империя была бы беззащитна, и ее падение было бы неизбежностью."

 #####Colonial Unrest#####

 ENG_colonial_uprising: "Колониальное восстание"
 ENG_colonial_uprising_desc: "Продолжающиеся беспорядки в наших восточноафриканских колониях влились в вооруженный мятеж с целью получения независимости, и для обеспечения стабильности империи восстание должно быть свернуто и быстро."
 ENG_boost_forces: "Увеличение числа местных гарнизонов"
 ENG_boost_forces_desc: "Увеличение числа местных гарнизонов в наиболее затронутых районах не только накладывает порядок на эти нестабильные районы, но и является важным свидетельством того, что Великобритания по-прежнему правит своей империей."
 ENG_work_loyal: "Работа с лоялистскими элементами"
 ENG_work_loyal_desc: "Несмотря на существование некоторых заблуждающихся людей, стремящихся к независимости для своей нации, по всей Восточной Африке остаются те, кто предан Империи."
 ENG_impose_rule: "Импульсировать британское правило"
 ENG_impose_rule_desc: "Поскольку мятежники относительно дезорганизованы, не нужно предпринимать никаких усилий, чтобы убрать их."


 #####Ireland#####

 ENG_ire_homerule: "Ирландское самоуправление"
 ENG_ire_homerule_desc: "После окончания Великой войны самоуправление Ирландии помогло ослабить напряженность, вызванную подъемом Пасхи в 1916 году. С тех пор, когда СИБ действует в тени, некоторые считают, что пришло время предоставить Ирландии дополнительную автономию или обеспечить, чтобы она оставалась неотъемлемой частью Соединенного Королевства."

 ENG_towards_integration: "На пути к интеграции"
 ENG_towards_integration_desc: "Сейчас, когда правительство проводит политику, направленную на то, чтобы Ирландия сохранила статус-кво в рамках Союза, мы должны реформировать и проводить новую политику с ирландским народом."
 ENG_towards_independence: "На пути к независимости"
 ENG_towards_independence_desc: "Только сейчас мы должны развивать институты для того, чтобы они были готовы к независимости для Ирландии."
 ENG_expand_control: "Расширение политического контроля"
 ENG_expand_control_desc: "Многие районы Ирландии по-прежнему управляются плохо и свободно несколькими британскими гражданами, которые больше заботятся о богатстве, чем о помощи местным жителям."
 ENG_ire_invest: "Инвестирование в сельскую Ирландию"
 ENG_ire_invest_desc: "Возможно, одна из беднейших районов Соединенного Королевства, в которую входит сельская Ирландия, нуждается в инвестициях для того, чтобы в полной мере связать ее с остальной частью страны и обеспечить, чтобы верховенство права могло распространяться и на сельскую местность."
 ENG_ire_endreligdiscr: "Положить конец политике религиозной дискриминации"
 ENG_ire_endreligdiscr_desc: "Во многих отношениях реликвия из прошлого, политика религиозной дискриминации в отношении католиков по всему Ирландскому острову, чтобы обеспечить, чтобы вся Ирландия была удовлетворена нашим правлением, мы не можем играть в фаворитизм. К сожалению, это может расстроить наших сторонников на севере страны."
 ENG_ire_reinforce_constab: "Укрепление ирландской полиции"
 ENG_ire_reinforce_constab_desc: "Для обеспечения стабильности Ирландии мы должны обеспечить дополнительное подкрепление для РИК из других частей Соединенного Королевства в рамках подготовки к решению проблемы СИБ."

 ENG_crush_brotherhood: "Уничтожить Братство"
 ENG_crush_brotherhood_desc: "Ирландское республиканское братство должно быть быстро разобрано. Ирландия находится на грани, наш выбор в предстоящие недели определит судьбу Ирландии и Соединенного Королевства в целом."
 ENG_ire_discussion: "Поощрять ирландскую политическую дискуссию"
 ENG_ire_discussion_desc: "После Великой войны в Ирландии растет меньшинство, которое довольствуется существующим положением."
 ENG_ire_create_parliament: "Создать ирландский парламент"
 ENG_ire_create_parliament_desc: "Несмотря на существование парламента в Дублине с 1729 года, для создания официального парламента требуется нечто большее, чем просто здание для размещения ирландских членов парламента."
 ENG_ire_united: "А. Соединенное Королевство"
 ENG_ire_united_desc: "После официальной интеграции Ирландии в Великобританию в 1800 году весь остров Ирландии считался единой политической идентичностью, по крайней мере до тех пор, пока не стала очевидной угроза самоуправления."
 ENG_ire_divided: "Защищать ольстер-шотландцев"
 ENG_ire_divided_desc: "С тех пор, как в конце 19-го года было внесено предложение о самоуправлении, в Северной Ирландии появилась чрезвычайно лояльная, а иногда радикальная сила."
 ENG_ire_pass_homerule: "Принятие законопроекта о самоуправлении"
 ENG_ire_pass_homerule_desc: "В годы вокруг Великой войны были приняты последовательные законы о самоуправлении, а в 1920 году был принят заключительный четвертый закон о самоуправлении, который обеспечил большую автономию Ирландии в Соединенном Королевстве, хотя и без некоторых требований, выдвинутых Ирландской парламентской партией. Сегодня мы стоим на грани принятия пятого и последнего Закона о самоуправлении, выполняя предыдущие обещания о полной независимости Ирландии."

 #####Imperial Future#####

 ENG_statute_westminster: "Устав Вестминстера"
 ENG_statute_westminster_desc: "В 1917 - 18 годах, но так и не был принят, Статут Вестминстера был бы перепродан в качестве Статута Автономии после того, как его разделили в Палате общин. Сегодня Статут Вестминстера еще не полностью реализован, но многие доминионы все еще надеются, что он сможет."

 ENG_imp_fed: "Имперская федерация"
 ENG_imp_fed_desc: "Идея имперской федерации, выдвинутая в начале века, пережила Великую Войну, но едва ли. Предложенная в качестве альтернативы все более децентрализованной империи, Имперская федерация лишь в последние годы стала привлекательной как политическая идея благодаря достижениям в области технологии и коммуникации."
 ENG_ris: "Королевское имперское общество"
 ENG_ris_desc: "Интеллектуальные круги со всей империи регулярно встречаются в Лондоне для проведения конференций о новых технологических достижениях, но в другие дни эяр остается относительно отделенным друг от друга. Для обеспечения продолжения исследований во всей империи мы можем создать новое общество для содействия технологическому развитию."
 ENG_sup_loyal: "Поддержка иностранных лоялистов"
 ENG_sup_loyal_desc: "Решением преследовать Императорскую федерацию многие из тех, кто живет в Доминионе, были возмущены этим новым предложением, и для того, чтобы укрепить позицию имперской федерации, мы должны тесно сотрудничать с ней и поддерживать тех, кто предан империи, живущей за рубежом."
 ENG_rej_imp_conf: "Возродить имперские конференции"
 ENG_rej_imp_conf_desc: "Для того чтобы Имперская федерация добилась успеха, мы должны активизировать усилия по общению с представителями Доминиона, омоложение имперских конференций, которые недавно проводились раз в четыре года, стало бы шагом в правильном направлении для обеспечения сотрудничества между Империей."
 ENG_imp_parl: "Построить Имперский парламент"
 ENG_imp_parl_desc: "Каждый Доминион, созданный для размещения имперских представителей по всей империи, создаст свой собственный Имперский парламент, который будет собираться раз в три месяца для обсуждения имперских дел."
 ENG_dom_integ: "Интеграция Доминионного парламента"
 ENG_dom_integ_desc: "С построенным имперским парламентом пришло время официально преобразовать существующих членов парламента доминионских государств и Британских островов в членов Имперского парламента."
 ENG_common_eco: "Общая экономическая политика"
 ENG_common_eco_desc: "В последние годы имперская экономика была подорвана правительствами Доминиона, которые не желают сотрудничать с остальной империей ради единства."
 ENG_imp_command: "Имперское военное командование"
 ENG_imp_command_desc: "Возможно, одним из наиболее спорных вопросов Великой войны была гибель сотен тысяч солдат Доминиона от рук британских военных лидеров."
 ENG_diss_parl: "Реорганизуйте парламенты Доминиона"
 ENG_diss_parl_desc: "После многих лет кропотливой работы и усилий пришло время, наконец, реорганизовать Доминионские парламенты и официально объединить их в Имперский парламент. Доминионы, возможно, были рады позволить Имперской Федерации сыграть, но если наши отношения с бедными тогда эти последние усилия могут подтолкнуть восстание во всей империи."

 ENG_status_quo: "Статус Quo"
 ENG_status_quo_desc: "Реформа Империи приведет лишь к катастрофе, если мы хотим выжить, мы должны сохранить то, что имеем сегодня, и обеспечить ее стабильность в предстоящие десятилетия."
 ENG_bonds: "Укреплять облигации"
 ENG_bonds_desc: "Ухудшенные из-за ужасных потерь, понесенных во время Великой войны, связи, связывающие Империю, должны быть укреплены, если мы хотим создать единый фронт против наших врагов и оставаться оплотом стабильности в этом зловещем мире."
 ENG_empire_unity: "Империя единства"
 ENG_empire_unity_desc: "С обеспечением стабильности во всей Империи и теми заговорщиками реформ, которые не смогли получить власть, мы создали новый образ Империи, чтобы показать миру."
 ENG_promote_trade: "Поощрение имперской торговли"
 ENG_promote_trade_desc: "Для обеспечения непрерывного экономического развития в рамках Империи и опоры на себя и только на себя мы должны поощрять торговлю между собой и Доминионами."
 ENG_mil_coord: "Имперское военное соруководство"
 ENG_mil_coord_desc: "Хотя прямая интеграция военного руководства не представляется ужасно возможной, ничто не мешает нам активно сотрудничать с Доминионами, которые в последние годы укрепили свои военные силы, с тем чтобы во многих отношениях они были сопоставимы с нашими собственными."
 ENG_imp_science: "Имперские науки"
 ENG_imp_science_desc: "Усилия по продолжению исследований в новых и захватывающих областях будут только в значительной степени зависеть от дальнейшего сотрудничества между научными учреждениями империи, а не от независимых инвестиций в новые области исследований, мы можем работать вместе и завоевывать больше лидерства по сравнению с другими, чем когда-либо ранее."

 ENG_decentralise: "Свобода для Доминионов"
 ENG_decentralise_desc: "Ветер перемен дует по всей Империи, нравится нам это или нет, этот рост национального симпатии по всей империи и ее Доминионам не может быть сложен. Только непрерывные усилия по укреплению автономии и децентрализации власти для Доминионов предотвратит катастрофу."
 ENG_red_gg: "Сокращение власти генерал-губернаторов"
 ENG_red_gg_desc: "Обладая огромной властью над нашими Доминионами, генералы-губернаторы в последние годы редко использовали свою власть, но до сих пор являются источником разногласий в странах Доминиона, поскольку их рассматривают лишь как расширение нашей власти над ними."
 ENG_autono_fp: "Автономная внешняя политика"
 ENG_autono_fp_desc: "В то время как для некоторых это ужасно пугает, Доминионы не могут получить полную свободу, если они не будут иметь право самостоятельно определять свою внешнюю политику в отношении глобальных дел. Хотя это может ослабить или решимость Империи в долгосрочной перспективе, возможно, в краткосрочной перспективе это сделает нас сильнее."
 ENG_estab_con: "Содружество наций"
 ENG_estab_con_desc: "Хотя конец Империи во многих отношениях кажется близким, нам не нужно прекращать сотрудничество между нами и нашими друзьями-доминионом."
 ENG_affirm_sow: "Подтвердить Вестминстерский статут"
 ENG_affirm_sow_desc: "С учетом того, что в последние несколько лет Доминиону была предоставлена гораздо большая автономия, чем многим, хотя и возможно, представляется, что принятие Вестминстерского статута является чисто церемониальным делом, хотя это покажет жителям Доминиона, что, хотя в 1931 году британское правительство совершило ошибку, в последнее время она готова исправить ее."

 #####Military Focuses#####

 ENG_mil_review: "Королевский военный обзор"
 ENG_mil_review_desc: "С момента окончания Великой войны прошло почти два десятилетия, и некоторые в верхних эшелонах правительства беспокоятся о том, что военные страдают от сильной атрофии."

 # - Army

 ENG_recon_army: "Восстановить британскую армию"
 ENG_recon_army_desc: "После окончания Великой войны британская армия, возможно, стала одним из худших районов, где были сокращены наши военные войска."

 ENG_massingberd: "Мобильные дивизии Массингберда"
 ENG_massingberd_desc: "Сэр Арчибальд Массингберд ясно дал понять, что, по его мнению, лучший способ победить в войне - это надавить противнику со всех сторон, быстро и с разных сторон, и поэтому он выступает за создание первых когда-либо мобильных и механизированных дивизий британской армии."
 ENG_moto_efforts: "Моторизация"
 ENG_moto_efforts_desc: "Первым шагом в создании более мобильной армии является проектирование транспортных средств, которые могут перевозить наших людей, куда им нужно, будь то через грязь Фландрии, джунгли Центральной Африки или пустыни Ближнего Востока."
 ENG_lighttanks: "Разработка легковых цистерн"
 ENG_lighttanks_desc: "Во время Великой войны наша армия использовала огромные наземные корабли как средство покрытия пехоты, с несколькими модификациями мы могли бы уменьшить их скорость, чтобы увеличить скорость, это будет стоить огневой мощи и бронежилетов, но это позволит им поддерживать наши мобильные полки или наши манипулирующие вражеские силы."
 ENG_introcruisers: "Представить круизеров"
 ENG_introcruisers_desc: "Наша мобильная дивизия, хотя и быстрая, не имеет остановочной мощности, требуемой даже с помощью легких бронежилетов для прорыва обороны противника. Пора привести в действие самую новую в военной инновации. Крузер - это полпути между светом Матильда и старыми кораблями. Упаковывает достаточно огневой мощи, чтобы двигаться вперед, но двигаться достаточно быстро, чтобы поднять заднюю часть мобильных дивизий."
 ENG_deploy_ra: "Развертывать Королевский бронированный"
 ENG_deploy_ra_desc: "Мечта Массингбердса наконец-то сбылась. С осуществлением Крузеров у нас теперь есть танки, которые могут сражаться и держаться против оппозиции, независимо от того, используют ли они бронежилеты, артиллерию или пехоту. С этими новыми Крузерами наша новая военная философия Массингберд открыла первые полностью бронебойные дивизии британской армии во время парада в Лондоне."

 ENG_ironside: "Артиллерия Железнодорожного завода"
 ENG_ironside_desc: "Сэр Эдмунд Айронсайд, который служил на полях как во время Бурской войны, так и во время Великой войны, решительно утверждает, что жизни каждого британского солдата должны иметь первостепенное значение для нас, и поэтому он призывает уделять больше внимания Королевской Артиллерии, в конце концов, зачем рисковать жизнью храбрых людей, когда мы можем просто запугать нашего врага в забвение."
 ENG_expand_ra: "Расширить королевскую артиллерию"
 ENG_expand_ra_desc: "Первый шаг в перестройке армии, с тем чтобы она соответствовала точке зрения Айронсайдов, это расширение королевской артиллерии, в то время как эта рука британской армии традиционно использовалась для поддержки пехотинцев в их нападениях, траншеи Сомме и Йпреса научили нас, что, если они правильно используются, они также могут стать ядром плана боя."
 ENG_incorp_aa: "Включить противовоздушное оборудование"
 ENG_incorp_aa_desc: "Артиллерия может играть гораздо более разнообразную роль, чем любой другой кусок оборудования на поле боя, с их массивным дальностью и размером с их снаряд они доказывают, что они захватывают даже самые большие самолеты с неба, если мы сделаем больше мобильных версий и добавим их в Королевскую артиллерию, мы также будем иметь воздушную защиту для нашей пехоты."
 ENG_art_produ1: "Стандартизированные методы производства"
 ENG_art_produ1_desc: "Первоначально артиллерия производилась на нескольких заводах по всей нашей стране, и, несмотря на строгие производственные стандарты, иногда артиллерия существенно отличалась по своей производительности."
 ENG_art_produ2: "Специализированные предприятия по производству артиллерийских изделий"
 ENG_art_produ2_desc: "Нам нужно построить больше оружия, если мы хотим продолжать подпитывать потребности Королевской артиллерии, но даже при стандартизованной добыче мы не можем производить их достаточно быстро. Наилучший способ помочь с этим - это выбрать некоторые фабрики по всей стране и обеспечить их специализированным оборудованием и конструкциями для дальнейшего наращивания наших запасов артиллерийской артиллерии."

 ENG_haig: "Наследие Хайга"
 ENG_haig_desc: "У сэра Дугласа Хейга, известного как Мясник Соммея, была страшная репутация как для наших врагов, так и для наших войск, известного за разработку планов, которые закончатся гибелью тысяч людей как наших, так и наших врагов, хотя его победа была дорогой, его безупречное планирование означало, что даже битвы, которые казались поражением, превратились в более крупные победы в большем масштабе."
 ENG_battleplan: "Большие боевые планы"
 ENG_battleplan_desc: "Каждая битва, каждая помолвка, каждый марш во многом служат цели в большем плане победы. Чем дальше мы будем планировать наши битвы, тем больше вероятность того, что мы добьемся больших побед по мере нашего продвижения вперед. Потеря в одном районе, если ее ожидать и планировать, может привести к еще большей победе в другом."
 ENG_supporttanks: "Цистерны поддержки пехотных подразделений"
 ENG_supporttanks_desc: "Пехотные пехотинцы не могут выиграть битвы сами по себе, особенно когда они сталкиваются с тяжелыми бронями или укрепленными позициями."
 ENG_entrenchment: "Опыт сокращения"
 ENG_entrenchment_desc: "Мы извлекли много уроков из Великой войны, главным образом в создании, нападении и защите траншей и других укреплений."
 ENG_landship: "Сухопутное сражение"
 ENG_landship_desc: "Боевые корабли были угловым камнем нашего флота с момента их создания, и их философия массивных металлических и огневых блоков хорошо служила нам в море. Почему мы не можем применить это к нашим доспехам?"

 ENG_rmarines: "Королевские морские пехотинцы"
 ENG_rmarines_desc: "Королевские морские пехотинцы уже почти триста лет являются полком Королевских вооруженных сил, но до сих пор они находятся в ведении Королевских военно-морских сил, однако была высказана просьба о том, чтобы Королевские морские пехотинцы стали независимыми как от армии, так и от военно-морского флота."
 ENG_rparas: "Королевские десантники"
 ENG_rparas_desc: "Самолеты стали частью наших военных все больше и больше в последние годы, они могут проникнуть глубоко за вражескими линиями, что означает, что, если мы сможем безопасно доставить их на землю, у нас будет возможность иметь специализированные элитные войска, далеко от противостоящих сил обороны, для того, чтобы как забрать свои запасы, так и занять ключевые позиции в то время, как регулярные вооруженные силы вступают на фронт."
 ENG_renew_mil: "Возобновить интерес к британской армии"
 ENG_renew_mil_desc: "После Великой войны все меньше и меньше молодых людей добровольно пополняют британскую армию, независимо от того, что было вызвано огромным количеством жертв, воспринимаемый мир или просто меняющаяся идея войны не имеет значения, нам нужно переосмыслить и возродить образ Блэк Уотч, Хайлендеров и Гренадиеров, чтобы привлечь новых людей в наши вооруженные силы."

 # - RAF

 ENG_theraf: "Королевские военно-воздушные силы"
 ENG_theraf_desc: "Все чаще и чаще в ходе Великой войны мы видели, как самолеты поднимаются на небо в боевых ролях, и в конце последней войны мы создали РВС, первые независимые военно-воздушные силы в мире, но по мере перемен и технологического прогресса нам нужно продолжать двигаться вперед, если мы хотим опережать наших конкурентов как с технологической, так и с тактической точек зрения."

 ENG_harris: "Бомбардировщики Харриса"
 ENG_harris_desc: "Сэр Артур Харрис уже несколько лет твердит, что маленькие самолёты из одного или двух человек - это не то, что победит нас в войнах в будущем, и они не могут защитить британские берега."
 ENG_strat_destruct: "Стратегическое уничтожение"
 ENG_strat_destruct_desc: "Контролирование нашего собственного неба служит цели, но оно не выиграет для нас войну. Единственный способ выиграть войну - нанести удар по вашему противнику и уничтожить его. Наши лидеры разработали планы и тактику, которые направлены на использование наших многомоторных бомбардировщиков, чтобы сбросить массированную нагрузку над вражескими промышленными и военными целями."
 ENG_lrange_escorts: "Сопровождение истребителей дальнего радиуса действия"
 ENG_lrange_escorts_desc: "Наши бомбардировщики выполняют эту работу; каждый раз, когда они пересекают канал, они сбрасывают вражеские регионы в пыль. Однако в последнее время наше время реагирования противников возросло, что привело к сбитию большего числа наших бомбардировщиков. Если мы хотим продолжать бомбардировку, мы должны разработать истребители, которые имеют такой же диапазон, как и наши бомбардировщики, если мы хотим уменьшить наши потери и обеспечить, чтобы мы продолжали наносить удары по нашим врагам."
 ENG_future_invest: "Инвестирование в будущее"
 ENG_future_invest_desc: "Будущее авиационной и воздушной войны состоит из многомоторных самолетов, их дальности, их полезной нагрузки, их огневой мощи, все они выше других форм аэронавтических машин. Наше правительство должно инвестировать в такие компании, как Avro и Lancaster, для того, чтобы обеспечить поток этих мощных машин."

 ENG_ccommand: "RAF Командование береговой системой"
 ENG_ccommand_desc: "В то время как Королевский ВМС может защитить нас от военно-морского вторжения, РВС могли бы также сыграть важную роль в этом деле."
 ENG_assist_rn: "Помощь Королевскому военно-морскому флоту"
 ENG_assist_rn_desc: "Королевский ВМС всегда был высшей силой Королевской армии, но против нападений с воздуха он должен полагаться на тяжелые круизеры, оснащенные противовоздушными канонами, чтобы защитить себя."
 ENG_defend_coast: "Защищать нашу береговую линию"
 ENG_defend_coast_desc: "Британские острова хорошо защищены как от военно-морских, так и от амфибийных нападений, единственная явная слабость нашей обороны заключается в том, что нас атакуют с неба."

 ENG_portal: "Самолеты наземной поддержки портала"
 ENG_portal_desc: "Сэр Чарльз Портал всегда считал, что величайшее преимущество, которое РВС могут принести вооруженным силам, заключается в том, что они оказывают поддержку британской армии, защищают наших солдат от воздушных нападений и обеспечивают непосредственную воздушную поддержку нашего пехотинцев на земле."
 ENG_support_army: "Поддержка британской армии"
 ENG_support_army_desc: "В то время как контроль над небом - это все хорошо и хорошо, есть и другие методы, которые мы могли бы использовать, чтобы лучше поддерживать парней на земле."
 ENG_control_skies: "Контролировать небо"
 ENG_control_skies_desc: "Для того чтобы наши военные кампании были успешными, нам нужно контролировать небо над боевыми действиями, а для того, чтобы это стало возможным, нам нужно будет как увеличить темпы производства наших новых бойцов, так и инвестировать в новые и инновационные технологии, которые могли бы повысить скорость, огневую мощь и маневренность."
 ENG_develop_fighters: "Прототипы новых бойцов"
 ENG_develop_fighters_desc: "Наши дизайнеры провели последние месяцы, работая над проектом нового истребителя, который был закодирован как проект Метеор. Этот проект был призван создать совершенно новое поколение истребителей, которые будут использовать новый тип реактивных двигателей, пытаясь получить преимущество в скорости и дальности движения над нашими врагами."

 ENG_radar_concept: "Концепция РФР"
 ENG_radar_concept_desc: "Радиообнаружение или, более того, просто RDF было идеей с 1934 года. Теория, лежащая в основе этого, заключается в том, чтобы использовать радиоволны для обнаружения приближающихся врагов, прежде чем даже шпионские очки смогут их увидеть. Это даст нам возможность сражаться с RAF и другими военными до любого нападения. Если это сработает."
 ENG_controlled_intercept: "Перехват с наземным управлением"
 ENG_controlled_intercept_desc: "RDF оказался потрясающим успехом, позволив RAF подготовиться задолго до вражеских налетов, но мы могли бы пойти дальше, когда операторы на станциях RDF постоянно контактируют с пилотами RAF, мы могли бы реально направить их в самые слабые точки вражеских бомбардировщиков и истребителей, что позволяло бы повысить тактическую эффективность и скоординированность полетов."
 ENG_future_warfare: "Будущее войны"
 ENG_future_warfare_desc: "В отличие от ВМС и армии, она способна сражаться и поддерживать наши войска там, где нам нужно, чтобы послать их. Некоторые из наших ученых обсуждают идею изготовления оружия и двигателей, сформированных после ракетных батарей, которые могут доставлять мощную полезную нагрузку на большие расстояния, не рискуя человеческими жизнями."

 ENG_nott_project: "Проект &lt; &lt; Путь вниз &gt; &gt;"
 ENG_nott_project_desc: "Открытый в 1916 году для испытания химического оружия, применявшегося во время Великой войны, Портон Даун с тех пор охватывает все экспериментальные военные проекты, разрабатываемые в настоящее время в Соединенном Королевстве, включая их самую новую и самую охватывающую задачу."

 # - RN

 ENG_thern: "Владение морями"
 ENG_thern_desc: "Королевский флот был горд Британией с момента нашей славной победы в битве при Трафальгаре в 1805 году, став самой мощной военно-морской силой, которую когда-либо видел мир, когда наша страна использовала ее для расширения и защиты границ нашей Империи. После Великой войны многое изменилось, и даже Королевский флот стал свидетелем снижения популярности и качества. Пришло время исправить это."

 ENG_faa: "Авиакомпания &lt; &lt; Флот &gt; &gt;"
 ENG_faa_desc: "С добавлением Карьеров в Королевский ВМС появились новые стратегические возможности. Если мы будем работать вместе с расширяющимися РВС, мы сможем и впредь быть военно-морским новатором мира и подтолкнуть Империю к новой фазе военно-морских войн, в которой у нас будет большое преимущество."
 ENG_exercises: "Убедить адмиралов"
 ENG_exercises_desc: "Многие руководители Адмиралтейства решительно выступают за строительство все более крупных и мощных боевых кораблей для обеспечения того, чтобы мы по-прежнему имели полное превосходство над нашими врагами."
 ENG_protocv: "Прототипные конструкции перевозчиков"
 ENG_protocv_desc: "Несколько членов исследовательского отдела Королевского ВМС работают над проектами, которые они называют Проектом Бесстрашная, новым поколением военно-морских перевозчиков, которые будут функционировать как мобильные аэродромы через Семи моря, что позволит нам проектировать больше энергии, чем когда-либо прежде."
 ENG_gwlessons: "Уроки Великой войны"
 ENG_gwlessons_desc: "Во время Великой войны как в английском канале, так и в Северном море мы сражались с Хюнсами и их Кейзрамрином. Здесь мы узнали много вещей о современном лице военно-морских войн, которые нам нужно применить к нашему новому флоту, базирующемуся на перевозчике, чтобы мы не столкнулись с катастрофой, как Джутланд снова."
 ENG_escort_vessels: "Сопровождающие суда"
 ENG_escort_vessels_desc: "Хотя перевозчики являются мощным судовым классом, а самолёты, которые они перевозят, являются более чем способными нанести ущерб противостоящим флотам, они не являются неразрушимыми."
 ENG_exp_shipyards1: "Расширение морских верфей"
 ENG_exp_shipyards1_desc: "Для обеспечения успеха проекта &lt; &lt; Бездушный проект &gt; &gt; нам потребуются не только реконструкторы для проектирования этих новых перевозчиков, но и верфи, достаточно крупные для того, чтобы обеспечить их строительство. &lt; &lt; Адмиралтейство &gt; &gt; запросило дополнительное государственное финансирование для расширения ряда ранее существовавших верфей, с которых будут построены и запущены эти новые перевозчики."
 ENG_reorg_admiralty: "Реорганизовать Адмиралтейство"
 ENG_reorg_admiralty_desc: "Теперь, когда проект Бездушный в полном разгаре, мы наконец-то можем справиться с взводом в нашей военно-морской командной структуре. Многие из старой охраны все еще не совсем понимают тактику воздушной войны или как ее применять на море. Если мы вытащим некоторых молодых командиров из ВМС, а также, возможно, некоторых более высоких позиций в РВС, мы сможем сбалансировать этот вопрос."
 ENG_csg: "Ударные группы перевозчиков"
 ENG_csg_desc: "До сих пор мы сосредоточились на использовании перевозчиков и их полезной нагрузки для нападения на вражеские суда на воде, но самолеты не являются исключительно военно-морским оружием."

 ENG_grandfleet: "Большой флот"
 ENG_grandfleet_desc: "Гордость и радость британских военных ах всегда были ее Великим Флотом, она была завистью всего мира и в конце концов победила всех крупных болванов, которые пытались оспорить ее превосходство. Королевский флот будет продолжать выполнять эту задачу, и мы будем следить за тем, чтобы во всем мире было найдено королевское судно ВМС."
 ENG_learn_jutland: "Учись в Ютландии"
 ENG_learn_jutland_desc: "В конечном счете, победа в стратегическом смысле, битва при Ютландии была очень близка к тактическому поражению."
 ENG_mod_bb: "Современные разработки боевых кораблей"
 ENG_mod_bb_desc: "Боевые корабли - это вершина военно-морских войн, с пушками, способными уничтожить наших врагов издалека. Однако, как мы узнали во время Великой войны, наши враги создают корабли, которые могут конкурировать с нашими. Мы не должны опускать наше преимущество. Королевский флот должен использовать новейшие технологии, чтобы создать новое поколение кораблей, соответствующих предписанию Ее Величества."
 ENG_battlefleet: "Доктрина боевого флота"
 ENG_battlefleet_desc: "Благодаря нашему сосредоточению на боевом корабле мы имеем последовательный поток новых судовых проектировок и стратегий, в которых они могут быть использованы."
 ENG_dd_screens: "Уничтожить Скриенс"
 ENG_dd_screens_desc: "На поверхности океанов наши боевые корабли необычны, как по количеству, так и по технологии мы двигаемся впереди наших соперников. Однако существует невидимая опасность для нашего наземного флота. Под волнами немецкие U-плавучие лодки доказали, что они могут поглотить даже самые крупные корабли нашего флота. Чтобы уменьшить будущие потери от подводных лодок, мы должны обеспечить, чтобы наши разрушители были в курсе новых технологий АСО."
 ENG_convoy_escort: "Опыт сопровождения"
 ENG_convoy_escort_desc: "Британия - это остров, который в значительной степени зависит от товаров, ввозимых из остальной части Империи. Эти конвои нуждаются в защите во время войны, но мы не можем рисковать ценными кораблями в этой относительно небольшой миссии. Нам нужно создать более новый крейсер, достаточно легкий, чтобы идти в ногу с кораблями конвоя, но с достаточной огневой мощью, чтобы сдерживать вражеские корабли и лодки."
 ENG_mobile_squad: "Мобильные отряды"
 ENG_mobile_squad_desc: "С такой большой и расширительной империей, как наше, с самым крупным и самым тяжелым боевым кораблем, мы можем победить наших врагов, но только если мы поймаем их первыми."
 ENG_fast_bb: "Быстрые боевые корабли"
 ENG_fast_bb_desc: "Поскольку Адмиралтейство делает новый акцент на скорости, а не на сверхвооружении, необходимо будет разработать новый класс боевых кораблей."
 ENG_bc_refit: "Рейтинг боевого круизера"
 ENG_bc_refit_desc: "Наш нынешний список боевых круизеров относительно устарел, и некоторые из них все еще сосредоточены на теориях Великой войны."
 ENG_escort_killers: "Сопровождающие убийцы"
 ENG_escort_killers_desc: "Если мы намерены умирать от голода нашими врагами, как это было эффективно во время последней войны, нам нужно будет уничтожить наши планы боевого круизера и освободить их в открытом море, с тем чтобы уничтожить торговлю противника, где бы она ни была найдена."
 ENG_inter_tactics: "Технология перехвата"
 ENG_inter_tactics_desc: "Провозглашение новых теорий о перехвате любой торговли через моря позволит нашим боевым кораблям и эскадрильям боевых круизников эффективно охотиться и уничтожать вражеские конвои, успешно задушив врага."
 ENG_nav_course: "Курсы военно-морского строительства"
 ENG_nav_course_desc: "Хотя наши инженеры и ремесленники являются одними из лучших в мире, они могли бы быть лучше."
 ENG_mod_nav_cons: "Современное военно-морское строительство"
 ENG_mod_nav_cons_desc: "Наши стимулы привели к тому, что многие люди со всей империи пришли и помогли построить военно-морские корабли, и благодаря этому притоку новых талантов мы сможем направить наши усилия на разработку новых методов для ускорения строительства наших более крупных военно-морских кораблей."
 ENG_cls: "Уничтожение судов"
 ENG_cls_desc: "В то время как наши эскадрильи разрушителей хорошо работают против вражеских подводных лодок, Адмиралтейство изучило возможность создания новых кораблей Крузеров для защиты наших операций по АСО от более крупных угроз, которые обычно легко отправят наших разрушителей."
 ENG_subs: "Подводные рейдеры"
 ENG_subs_desc: "Благодаря их эффективности, доказанной в ходе Великой войны, Адмиралтейство в течение предыдущего десятилетия добилось большого прогресса в создании новых и более смертоносных подводных лодок."
 ENG_rbritannia: "Правило, Британия!"
 ENG_rbritannia_desc: "Когда Британия впервые, по небесной команде, от азурного главного; это был устав земли, и ангелы-хранители пели этот штамм: Правило, Британия! Британия правит волнами, никогда не будет рабами!"

 #####Black Wednesday & Eco Recovery Tree#####

 ENG_black_wed: "Лондонский рынок"
 ENG_black_wed_desc: "Бедствие поразило Империю. На прошлой неделе было трудно для экономики, поскольку продолжающиеся колониальные восстания в Индии и Африке привели к нехватке товаров, и арест нескольких руководителей и директоров группы Hatry - британский фондовый рынок рухнул. Британия, экономическая власть до этого момента не могла быть проигнорирована. Однако экономисты могут только догадаться, когда мы выздоровеем."

 ENG_austerity: "Стопгап Осторожность"
 ENG_austerity_desc: "Консервативные члены нашего парламента утверждают, что лучший способ спасти Империю от этой экономической катастрофы - это ужесточить пояса по всей стране."
 ENG_redu_budget: "Сокращение военного бюджета"
 ENG_redu_budget_desc: "Первое место, где будет ощущаться ограничение финансирования, это наша военная армия, РВС и Королевские ВМС, все они видят огромные сокращения в финансировании как оборудования, так и вербовки."
 ENG_cut_invest: "Сокращение иностранных инвестиций"
 ENG_cut_invest_desc: "Несмотря на то, что острова инвестируют в наши заморские колонии на протяжении многих лет, пришло время прежде всего взглянуть на наши собственные потребности, сокращая инвестиции нашего правительства в власть, колониальные и неаффилированные корпорации, мы можем вернуться к этой катастрофе."
 ENG_unprofit: "Закрыть неприбыльные фабрики"
 ENG_unprofit_desc: "Канцлер Канцлера Казначейства предложил еще один способ сокращения наших расходов; закрытие нескольких отраслей на Британских островах, субсидируемых по той или иной причине, которые обычно приносят меньше доходов, чем мы тратим на их содержание, они могут потерять некоторые рабочие места в краткосрочной перспективе, но в течение длительного времени это может помочь спасти нашу экономику."
 ENG_new_taxes: "Поднять новые налоги"
 ENG_new_taxes_desc: "Если мы собираемся оправиться от этого бедствия и как бы неприятно это ни было для кого-то, то наиболее целесообразным способом заполнить эти кошельки является взимать новый налог. Новый чрезвычайный налог будет взиматься со всех британских граждан до тех пор, пока кризис не будет предотвращен."
 ENG_sector_cuts: "Гражданская служба"
 ENG_sector_cuts_desc: "Государственные служащие, хотя и помогают, не совсем необходимы для управления нашей нацией, и, хотя мы не можем избавиться от всех из них, мы можем значительно сократить их число, особенно в тех регионах, которые в прошлом были известны как Прон до Ребеллиона, а сельская Ирландия и Шотландия будут страдать от худших из этих сокращений."

 ENG_stimulus: "Экономические показатели"
 ENG_stimulus_desc: "Некоторые из наиболее радикальных членов парламента предложили, что, если мы хотим оправиться от этой катастрофы, нам нужно будет вложить деньги в экономику, хотя это будет встречено с огромной поддержкой народа, потребуется большой политический капитал, чтобы протолкнуть ее, а если она провалится, то это, безусловно, только усугубит ситуацию."
 ENG_produ_quota: "Установление производственных квот"
 ENG_produ_quota_desc: "Первым шагом на пути к реорганизации нашей экономики будет установление производственных квот для жизненно важных отраслей во всей стране. Корпорации могут утверждать, что они будут вынуждены закрыться, поскольку они не смогут получить прибыль, если будут тратить товары, но если мы покупаем излишки, которые они не могут продать, то это сохранит наш народ на работе и наш бизнесмен инвестирует."
 ENG_inflation: "Создать механизмы контроля за инфляцией"
 ENG_inflation_desc: "Чтобы контролировать инфляцию по всей стране, мы должны подойти к Банку Англии и убедить их поднять процентные ставки в попытке сократить предложение денег по всей империи."
 ENG_subsidies: "Субсидии по безработице"
 ENG_subsidies_desc: "В то время как мы постараемся сделать все возможное для того, чтобы каждый человек имел работу, мы всегда будем скучать по тем, кого не хватали, или тем, кто не работал до аварии."
 ENG_target_tax: "Целевые налоги"
 ENG_target_tax_desc: "Мы потратили себя так далеко на красное, что если не найдем способ хотя бы взять на себя часть давления со стороны нас официально обанкротится. Наилучшим способом попытаться и по крайней мере замедлить снижение будет налог, но это подорвет цель попытаться вложить больше денег в руки людей. Наши друзья по труду в парламенте предложили решение: создание целевого налога, ориентированного на высшие слои общества."
 ENG_tariffs: "Импортные тарифы"
 ENG_tariffs_desc: "В то время как стабильная в пределах наших собственных границ потеряла большую часть своей стоимости во всем мире, покупка товаров из регионов, находящихся вне империи, сейчас чрезвычайно дорога. Поэтому для того, чтобы сделать наши товары более конкурентоспособными на местных рынках, мы наложим тариф на все иностранные товары."

 ENG_mosleys_plan: "План Мосли"
 ENG_mosleys_plan_desc: "После победы коалиции лейбористов и ИЛП на наших недавних выборах Освальд Мосли стал Канцлером Канцлера Казначейства, важной позицией в определении наших действий по противодействию растущему финансовому кризису во всей империи."
 ENG_pub_works: "Общественные работы"
 ENG_pub_works_desc: "В то время как консерваторы в парламенте утверждают, что у нас нет денег на строительство фонтанов и лесонасаждений, Мосли заверяет нас, что эти проекты не только создадут рабочие места для безработных, но и дадут бесценный опыт для нашей рабочей силы в предстоящие годы."
 ENG_pensions: "Пенсионный план"
 ENG_pensions_desc: "Каждый нуждается в деньгах, чтобы жить, и не в последнюю очередь в наших пожилых людях, хотя они не могут работать из-за тяжелых последствий своего возраста, они все еще являются жизненно важной частью нашей экономики, создавая пенсионную политику, у них будут деньги, которые они смогут использовать, чтобы выжить, а также потратить их, это не только сохранит их безопасность, но и может даже помочь сохранить бизнес открытым."
 ENG_infra_projects: "Инфраструктурные проекты"
 ENG_infra_projects_desc: "Британия является современной страной, и поэтому она имеет мили на дорогах и железных дорогах, а существующая инфраструктура не только нуждается в хорошем состоянии, но и должна быть обеспечена новая экспансия, с тем чтобы оживить растущее население Великобритании."
 ENG_home_market: "Сконцентрируйся на рынке жилья"
 ENG_home_market_desc: "Британия может сохранить себя, если мы все будем работать вместе."
 ENG_national_effort: "Великий национальный успех"
 ENG_national_effort_desc: "План Мозли действительно сработал. Несмотря на критику прорицателей и других идиотов, Британия преодолела худший из экономических кризисов и рекордно высокими темпами. И мы достигли этого великого триумфа не за счет дорогостоящей политики жесткой экономии, а за счет помощи тем, кто живет в Британии, вновь встать на ноги."

 ENG_continue_austerity: "Полная износостойкость"
 ENG_continue_austerity_desc: "В связи с банкротством все более мрачным призраком было принято решение о том, что мы будем сокращать расходы, где сможем, каждый должен будет ужесточить свои пояса, и эти сокращения будут ощущаться через общество, от шахтера до короля."
 ENG_devalue: "Обесценить стерлинг в фунтах"
 ENG_devalue_desc: "Если мы обесценим эти товары, дешевые товары будут дешевле, это будет означать, что больше людей покупают наши товары."
 ENG_interest: "Повышение процентных ставок в банке"
 ENG_interest_desc: "Повысив процентные ставки по некоторым нашим крупнейшим заемщикам, а именно самим банкам, мы можем заставить их либо быстрее погасить свои долги из-за боязни увеличения задолженности, либо просто получить больше денег, если они продолжат ждать погашения, в любом случае, мы победим."
 ENG_further_cuts: "Дополнительные бюджетные сокращения"
 ENG_further_cuts_desc: "Многие считают, что сокращения, которые мы сделали до сих пор, это все, что возможно, они неправы, и мы покажем им, что мы можем сократить еще больше финансовых средств."
 ENG_mil_cuts: "Срочное военное финансирование"
 ENG_mil_cuts_desc: "Наши солдаты храбро сражались во время великой войны, они были хорошо оплачены и хорошо оснащены, но сейчас нам нужно решить, что более важно, новое оружие и хорошо оплачиваемые солдаты, или национальная экономика."
 ENG_cut_benefits: "Сокращение пособий по безработице"
 ENG_cut_benefits_desc: "Сейчас у нас есть несколько систем, которые платят безработным. Если мы сократим их до тех, кто не в состоянии работать по основным медицинским причинам, или, что лучше, полностью удалим их, мы сможем не только сэкономить деньги, но и стимулировать людей к выходу на рынок труда."
 ENG_cut_invest2: "Сокращение национальных инвестиций"
 ENG_cut_invest2_desc: "Некоторые люди утверждают, что вам нужно тратить деньги, чтобы заработать деньги, но в некоторых случаях это просто невозможно."
 ENG_end_austerity: "Окончание жесткости"
 ENG_end_austerity_desc: "Сотни заводов уже близко и тысячи не работают, но теперь, благодаря нашим грязным сбережениям, мы можем с уверенностью сказать, что не только худшее позади, но и то, что мы сбежали из Лондонского рынка, и не слишком скоро."

 ENG_lfaire: "Прекращение вмешательства"
 ENG_lfaire_desc: "Вмешательство правительства в экономику является смертельной ошибкой и приведет лишь к еще большему разрушению."
 ENG_end_subs: "Ограничение государственных субсидий"
 ENG_end_subs_desc: "В последние годы сменявшие друг друга правительства разрешили направлять субсидии бедным предприятиям и предприятиям в попытке сохранить число занятых по всей стране, что является безрассудным шагом и должно быть отменено."
 ENG_lift_caps: "Капсулы с лифтом"
 ENG_lift_caps_desc: "Снижение процентных ограничений по займам предприятиям во всей Империи может привести к тому, что многие предприятия не будут заниматься бизнесом, но если они не могут позволить себе вернуть эти займы, зачем они вообще их забрали?"
 ENG_liberate_markets: "Освободить рынки"
 ENG_liberate_markets_desc: "Правительство не занимается бизнесом, так говорят, хотя многие считают, что наша политика миновала, сегодня она приносит свои плоды, хотя и при больших страданиях. &lt; &lt; Британская экономика &gt; &gt; адаптировалась к новому финансовому климату и вновь идет полным ходом, доказывая, что наш выбор был правильным."

 #####Imperial Foreign Policy#####

 ENG_impfp: "Имперская внешняя политика"
 ENG_impfp_desc: "Хотя после окончания Великой войны мы отошли в изоляцию, настало время вновь определить будущее Империи, продолжить наше внимание к изоляции, с нашими приоритетами в развитии Империи, или мы вновь призываем к новой волне империализма, с нашей нацией."


 ENG_standsalone: "Империя стоит одна"
 ENG_standsalone_desc: "Стой прямо и радуйся нашему долгу, как мы существуем в глазах бури в мире."

 ENG_med_def: "Защита Средиземноморья"
 ENG_med_def_desc: "Наши средиземноморские приобретения являются частью наших самых последних приобретений, но их стратегическое значение имеет первостепенное значение."
 ENG_gib_fort: "Гибралтарская крепость"
 ENG_gib_fort_desc: "Гибралтар, приобретенный после подписания Утрехтского договора в конце 18-го года, с тех пор функционирует в качестве важной военно-морской базы и стратегического местоположения, обеспечивающего нашу способность осуществлять контроль за морским движением в Средиземном море."
 ENG_sky_control: "Контроль за небом"
 ENG_sky_control_desc: "В то время как мы можем влиять на Медитеррейское море с Королевским флотом после Великой войны и появления летной машины, для защиты и расширения нашего влияния по Средиземному морю требуются новое оружие и оборона."
 ENG_adv_warning: "Дополнительное предупреждение"
 ENG_adv_warning_desc: "Несмотря на то, что наши стратегические базы по всему Средиземному морю достаточно хорошо защищены, угроза того, что против них будут направлены военно-воздушные силы, имеет большое значение, и для обеспечения их дальнейшего успеха нам следует создать несколько станций РСО на этих территориях, с тем чтобы предупредить наши силы о предстоящем воздушном налете."
 ENG_lifeline: "Линия жизни Империи"
 ENG_lifeline_desc: "Официально открытый в ноябре 1869 года, Суэцкий канал с тех пор функционирует как чрезвычайно важное место для обеспечения непрерывной связи и поставок из глубин Британии до самых отдаленных районов Империи."

 ENG_hi_def: "Домашняя оборона островов"
 ENG_hi_def_desc: "Сердце и душа Империи - сама Британия - должны быть защищены любыми и всеми средствами, чтобы не случилось немыслимого: чтобы Великобритания упала и Империя была брошена в хаос."
 ENG_reinf_scapa: "Усилить поток капусты"
 ENG_reinf_scapa_desc: "Возможно, одна из наших самых важных военно-морских баз, Scapa Flow позволяет нам проецировать военно-морскую мощь в Северное море, а в ходе предыдущей войны помогала нам сдерживать угрозу немецкого флота."
 ENG_remember_1066: "Помните 1066"
 ENG_remember_1066_desc: "Битва при Гастингсе приняла решение о судьбе нашей нации на протяжении веков после ее поминания. Мы никогда не позволим врагу идти по британской земле. Мы должны защищать наши берега, какими бы ни были издержки."
 ENG_decen_command: "Децентрализованное командование"
 ENG_decen_command_desc: "Если немыслимые и вражеские солдаты обретут опору на нашем острове, мы должны подготовиться к борьбе с зубами и ногтями, чтобы победить их."
 ENG_renew_territorials: "Реактивировать территории"
 ENG_renew_territorials_desc: "Территории являются полком-добровольцем, который до Великой войны должен был действовать в качестве последней линии обороны, если вражеская земля на нашей земле."
 ENG_home_guard: "Домашняя гвардия"
 ENG_home_guard_desc: "Хотя наши территориальные районы более чем подходят для этой работы, многие военные чиновники предложили расширить их, включив в них лиц, которые вряд ли сдадут обычные экзамены по набору."
 ENG_invictus: "Вдовство"
 ENG_invictus_desc: "Неважно, как сжимают врата, как наказан свиток, я хозяин своей судьбы, и я капитан моей души."
 ENG_air_supr: "Воздушная супремность"
 ENG_air_supr_desc: "Королевские военно-воздушные силы являются мощным инструментом защиты нашей родины, и их нельзя игнорировать или забывать, но для того, чтобы они использовались в полной мере, они должны получить более широкую инфраструктуру и поддержку."

 ENG_east_flank: "Дальний восточный фланк"
 ENG_east_flank_desc: "У нас есть много ценных мест на востоке, которые дают нам как богатство, так и рабочую силу. Если бы они были потеряны, это мог бы стать смертельным ударом для Империи в целом."
 ENG_ceylon_factor: "Цейлонская военно-морская база"
 ENG_ceylon_factor_desc: "В то время как в основном Индия управляется Раджем, мы все еще имеем прямой контроль над островом Цейлон, жизненно важной остановкой для доставки на Дальний Восток и с него. Если мы будем расширять эти коммерческие порты для военных целей, это даст нам преимущество в регионе."
 ENG_singa_strong: "Укрепляющий Сингапур"
 ENG_singa_strong_desc: "Сингапур был разоблачен как «Гибралтар Востока» — важная военная база, особенно для Королевского флота. Если мы хотим удержать наш Восточный Фланк от угроз, мы должны обеспечить, чтобы полуостров был таким же непроницаемым, как и окружающие его джунгли."
 ENG_austral_def: "Защита Австралазии"
 ENG_austral_def_desc: "Несмотря на то, что они находятся под влиянием Великобритании с 1780-х годов, и хотя во время Великой войны они прекрасно исполняли свои обязанности, они еще не готовы защищаться от нападения Великой державы."
 ENG_hk_command: "Гонконгское командование"
 ENG_hk_command_desc: "Гонконг станет базой для операций дальневосточного военного командования, и поэтому он должен быть предан гласности как достойный доверия регион и как достойный империалистический город."

