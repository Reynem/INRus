 ENG_irb2_desc: "С 1916 года, после Пасхального восстания, СИБ прибегала к более малогабаритным нападениям, направленным на подрыв нашего правления в Ирландии. Эти нападения, как правило, принимают форму засад и нападений на полицейские позиции. Пока мы не найдем способ уничтожить СИБ, эти нападения, скорее всего, будут продолжаться."
