 ENG_scw_inter: "Вмешательство в гражданскую войну в Испании"
 ENG_scw_inter_desc: "В связи с гражданской войной в Испании, которая бушует по всей Иберии, у нас есть возможность послать в Королевство Испания товары и добровольцев, чтобы укрепить их контроль над регионом."
