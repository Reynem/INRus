 eco_conf_notif: "Будут предприняты усилия по оказанию помощи Доминионам в этой области строительства, и мы также получим временные льготы."

 pol_conf_notif: "Доминион будет уведомлен о нашем выборе. Прошло много месяцев, прежде чем стали очевидными реальные последствия нашего решения."

