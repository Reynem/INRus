 ENG_imp_upheaval: "Имперский рекорд"
 ENG_imp_upheaval_desc: "Наш выбор в пользу имперской федерации вверг многие части империи в политический хаос, пока процесс федерализации не будет завершен, мы будем продолжать страдать от этих последствий."
 ENG_imp_upheaval1: "Имперский рекорд"
 ENG_imp_upheaval1_desc: "Наш выбор в пользу имперской федерации вверг многие части империи в политический хаос, пока процесс федерализации не будет завершен, мы будем продолжать страдать от этих последствий."
 ENG_imp_upheaval2: "Имперский рекорд"
 ENG_imp_upheaval2_desc: "Наш выбор в пользу имперской федерации вверг многие части империи в политический хаос, пока процесс федерализации не будет завершен, мы будем продолжать страдать от этих последствий."
 IMP_upheaval: "Имперский рекорд"
 IMP_upheaval_desc: "Выбор Британии преследовать Имперскую федерацию вверг многие части империи в политический хаос. Пока процесс федерализации не будет завершен, мы будем продолжать страдать от этих последствий."
 ENG_imp_instability: "Имперская нестабильность"
 ENG_imp_instability_desc: "Несмотря на успех огромных усилий по федерализации нестабильности империи, имперские земли по-прежнему находятся в изобилии."
 IMP_dec_dev: "Имперский фонд развития"
 IMP_dec_dev_desc: "Финансирование со стороны Великобритании позволило нашей экономике значительно увеличить объем производства в предстоящие месяцы."

 ENG_pbritannica: "&quot; Пакс Британия &quot;"

 ENG_mutiny: "Королевские военно-морские силы"
 ENG_navy_with_state: "Военно-морские силы с государством"
 ENG_naval_impress: "Пресс-группы"
 ENG_sword_and_shield: "Наш меч и щит"
 ENG_csg_idea: "Ударные группы перевозчиков"

 ENG_imp_sq1: "Имперский статус Quo"
 ENG_imp_sq1_desc: "С нашим выбором в пользу имперского статуса Quo мы наблюдаем значительные политические последствия как в нашей стране, так и в Доминионах, пока эти вопросы не будут решены, мы будем продолжать страдать от негативных последствий."
 ENG_imp_sq2: "Имперский статус Quo"
 ENG_imp_sq2_desc: "После того как Великобритания выбрала имперский статус Куо, политика в нашей стране пережила значительные потрясения, многие в нашем правительстве начали открыто ставить под сомнение правительство в Вестминстере. § §RDominion нации, контролируемые МА, никогда не помогут Великобритании в войнах, пока не будет устранен этот национальный дух! §!"

 ENG_imp_decent1: "Имперские гарантии децентрализации"
 ENG_imp_decent1_desc: "С нашей неспособностью выполнить обещания автономии перед доминионскими нациями, которые были обещаны на Имперской конференции 37-го года, Доминионы Империи единодушно оттолкнули Великобританию в Империи, пытаясь заставить нас выполнить наши обещания."
 ENG_imp_decent2: "Имперские гарантии децентрализации"
 ENG_imp_decent2_desc: "С нашей неспособностью выполнить обещания автономии перед доминионскими нациями, которые были обещаны на Имперской конференции 37-го года, Доминионы Империи единодушно оттолкнули Великобританию в Империи, пытаясь заставить нас выполнить наши обещания."
 ENG_imp_decent3: "Имперские гарантии децентрализации"
 ENG_imp_decent3_desc: "С нашей неспособностью выполнить обещания автономии перед доминионскими нациями, которые были обещаны на Имперской конференции 37-го года, Доминионы Империи единодушно оттолкнули Великобританию в Империи, пытаясь заставить нас выполнить наши обещания."
 ENG_imp_decent4: "Имперские гарантии децентрализации"
 ENG_imp_decent4_desc: "С неспособностью Великобритании дать обещания автономии странам Доминиона, которые были обещаны на Имперской конференции 37-го года, наша нация сделала последовательный политический отпор Британии в Империи, пытаясь заставить их выполнить свои обещания."

 ENG_statute_autonomy: "Устав автономии"
 ENG_statute_autonomy_desc: "Подписан 11 декабря 1931 года, Статут автономии стал результатом согласованных усилий доминионских наций империи, которые потребовали от Соединенного Королевства большей автономии, хотя первоначальное предложение заключалось в том, что доминионские страны имели равный статус с Соединенным Королевством в Империи, последующие поправки к закону в конечном счете отобрали бы первоначальное предложение, пока не останутся лишь символические реформы."

