 ENG_trafalgar_tt: "HMS Trafalgar будет размещен в Scapa Flown"

 ENG_impfed_warning: "Процесс федерализации Империи займет годы, чтобы завершиться и может не быть успешным, но если он завершится, то Империя станет сильнее, чем когда-либо прежде. Но Доминионы вряд ли согласятся с первоначальным предложением; для того чтобы быть успешными, Британия должна поддерживать высокие отношения с Доминионами и, при необходимости, принести в жертву полный контроль над империей, чтобы убедить Доминионов принять его."

 ENG_sq_warning: "§R. Порождаемая этим политическая реакция на сохранение имперского статуса Quo может значительно поколебать отношения с доминионскими нациями, последствия которых не могут быть устранены до тех пор, пока сам процесс не будет завершен."

 ENG_decent_warning: "Хотя стремление к большей автономии Доминионов, вероятно, приведет к улучшению отношений в краткосрочной перспективе, неспособность осуществить эту новую политику, скорее всего, приведет к еще большим негативным последствиям для нашей страны по мере продвижения времени."

 ENG_no_conf: "Несмотря на наш выбор избежать сохранения статус-кво в Империи, вряд ли стоит продолжать традицию проведения имперских конференций в будущем."

 ENG_revo_warning: "Мы должны быть осторожны с выбором, который мы делаем для решения этой проблемы."

 ENG_impfed_ready: "Мы должны быть осторожны; если Доминионы недовольны ситуацией или недовольны нашей нацией, то они непременно восстанут против воли Империи. Если мы хотим сделать их более восприимчивыми к идее о том, что нам следует уделять приоритетное внимание улучшению отношений с их нацией."

 ENG_hh_guard: "В Лондоне будут развернуты дополнительные подразделения по охране домашнего хозяйства."

