 ENG_return_raj_land: "Возвращение территории в Радж"
 ENG_return_raj_land_desc: "В результате нашей рекогносцировки индийского субконтинента мы вновь стали контролировать большие районы Индии, и благодаря этим новым событиям мы можем передать эту территорию правительству Раджа, которое в настоящее время находится в изгнании в Цейлоне."

 ENG_reconquer_bei: "Возвращение в Ист-Индию"
 ENG_reconquer_bei_desc: "Несмотря на наше поражение от рук инсулиндских мятежников, наша страна с тех пор стабилизировалась, и мы вновь готовы вести войну против повстанческих сил, оккупировавших нашу бывшую территорию."

