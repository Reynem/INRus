 ##### Bookmark Description #####

 ENG_FUHRERREICH_DESC: "Великая война длилась пять долгих лет безжалостных убийств и разрушений. В конце концов Великобритания одержала победу над разбитыми центральными державами, вновь установив себя в качестве глобального гегемона. В 1931 году Статут автономии предоставил странам Доминиона лишь ограниченные полномочия, причем первоначальные предложения были радикально изменены, что привело к большому возмущению по отношению к родине. Британия находится в неустойчивом положении. Имперская конференция 1937 года становится все ближе, и в последующие годы перед Великобританией будут поставлены задачи, которые будут определять не только судьбу Империи, но и будущее самой Британии."
