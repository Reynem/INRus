 ##### Decisions #####
 ENG_lowlands_2gw_cleanup_dec: "Передача земельных территорий германской администрации"

 ### Politics ###

 ENG_politics: "Внутренняя политика"
 ENG_politics_desc: "Хотя последние несколько лет были относительно стабильными в Соединенном Королевстве, многие считают, что эта стабильность носит лишь временный характер."

 ENG_release_funding: "Дополнительные средства, выделяемые полицией"
 ENG_release_funding_desc: "Хотя обычно мы резервируем за собой важные мероприятия, такие, как посещения штатов, мы можем высвободить дополнительные средства для полиции в течение следующих нескольких месяцев, в результате чего на Британских островах будет обеспечена бóльшая стабильность."
 ENG_polit_reforms: "Запуск политических реформ"
 ENG_polit_reforms_desc: "Хотя политическая реформа может оказаться ненужной, она может помочь нам в получении большего политического влияния на страну, что позволит нам сдвинуть свой кабинет или установить связи с большим числом британских компаний."

 ENG_naval_exercises: "Проведение морских учений"
 ENG_naval_exercises_desc: "Сейчас, когда новое правительство в Вестминстере находится под большим влиянием Королевского ВМС, у нас есть возможность проводить военно-морские учения, когда мы считаем это необходимым для улучшения наших экипажей и судов, на которых они служат."

 ### Economic Affairs ###

 ENG_economy: "Экономические вопросы"
 ENG_economy_desc: "В последние годы экономика Британии, которая ранее называлась «рабочим магазином мира», несколько ослабла, и только благодаря твердой руке мы можем обеспечить наше неизменное экономическое господство."

 ENG_construction_contracts: "Контракты на строительство"
 ENG_construction_contracts_desc: "Налаживая контакты с многочисленными частными компаниями, мы можем предоставить им прибыльные контракты, чтобы помочь ускорить строительство по всей стране."
 ENG_monthly_quotas: "Месячные квоты"
 ENG_monthly_quotas_desc: "Хотя некоторые ухмылялись над возможностью установления ежемесячных квот на производство на наших заводах, это было бы полезным стимулом для временного увеличения производства на фабриках."
 ENG_cutting_expenditure: "Сокращение расходов"
 ENG_cutting_expenditure_desc: "Сократив расходы в областях, которые, как правило, игнорируются правительством, мы надеемся, что в течение нескольких месяцев мы несколько улучшим нашу экономику."

 ### The Empire ###

 ENG_the_empire: "Империя"
 ENG_the_empire_desc: "Покрывая более четверти поверхности Земли, Империя, на которой солнце никогда не заходит, невероятно обширна и как таковая требует глубоких уровней управления и коммуникации, чтобы обеспечить ее дальнейшее существование и эффективность."

 ENG_prep_complete: "Имперские приготовления"
 ENG_prep_complete_desc: "Мы достигли порога: Имперская федерация почти готова к официальному объявлению. После многих лет планирования и жертвоприношений время почти пришло."

 ENG_pax_britannica: "Вторая « Пакс Британия »"
 ENG_pax_britannica_desc: "Судьба Британской империи состоит в том, чтобы выступать в качестве арбитра в конфликте в нашем мире, быть гарантом мира и процветания."

 ENG_raj_review: "Королевский обзор Раджа"
 ENG_raj_review_desc: "После индийского восстания 1936 года и нашего недавнего восстановления после Лондонского фондового рынка пришло время начать полный обзор управления нашей крупнейшей колонией."

 ENG_begin_wargames: "Запуск военных игр в масштабах всей империи"
 ENG_begin_wargames_desc: "Чтобы обеспечить готовность Империи противостоять потенциальным угрозам, мы можем ежегодно начинать военные игры, которые продлится три месяца, и как только они завершатся, мы получим значительный опыт нашей армии, военно-морского флота и военно-воздушных сил."
 ENG_participate_wargames: "Участие в военных играх в масштабах всей империи"
 ENG_participate_wargames_desc: "Британия продвинулась вперед с планами начала трехмесячной серии военных игр для вооруженных сил Империи, принимая участие в этих военных играх, мы позаботимся о том, чтобы наши военные оставались современной силой."

 ENG_help_can: "Помощь в развитии Канады"
 ENG_help_can_desc: "Верный сын Британии, Канада, возможно, является самым высокопоставленным членом Империи после нашей нации и как таковой заслуживает дополнительных средств для содействия развитию."
 ENG_help_ast: "Содействие развитию Австралии"
 ENG_help_ast_desc: "В то время как Австралия была создана в качестве исправительной колонии для наших худших преступников, с тех пор она стала гордой и сильной страной, и для обеспечения их дальнейшего роста мы должны направить дополнительные финансовые средства на их развитие."
 ENG_help_nzl: "Помощь в развитии Новой Зеландии"
 ENG_help_nzl_desc: "Хотя некоторые считают, что Новая Зеландия живет в тени Австралии, она иногда сравнивается с самой Британскими островами - островной нацией стойкого народа, который желает лишь мира на своей справедливой земле."
 ENG_help_saf: "Помощь в развитии Южной Африки"
 ENG_help_saf_desc: "В последние десятилетия Южно-Африканский союз во многих местах был неприкосновенным районом, и если мы хотим обеспечить свое положение в самом южном регионе африканского континента, то мы должны приложить усилия для его существенного развития."
 ENG_help_raj: "Помощь в развитии Индии"
 ENG_help_raj_desc: "В то время как индийский субконтинент в последнее время был омрачен восстанием, вероятно, стоит того, чтобы укрепить промышленное положение Раджа и тем самым косвенно расширить возможности британской администрации в этом районе."

 ENG_crush_revolt: "Разрушение в Восточной Африке"
 ENG_crush_revolt_desc: "Если мы хотим предотвратить широкомасштабное разрушение нашего восточноафриканского имущества, мы должны действовать решительно и оперативно, с тем чтобы положить конец продолжающемуся восстанию в регионе."

 ENG_prep_ready: "Подготовка завершена"
 ENG_prep_ready_desc: "Прошло всего четыре года с тех пор, как мы взяли на себя грандиозную задачу по преобразованию Империи в Имперскую федерацию наций."

 ENG_ast_prop: "Австралийское предложение"
 ENG_ast_prop_desc: "На Оушнической конференции 37-го года австралийское правительство обратилось к нашим представителям с предложением переформулировать имперскую карту в Океании, предложив реорганизовать австралийские и новозеландские доминионы в первый Доминион Океании, этот план обеспечит гораздо более прочное имперское положение в Тихом океане в предвидимом будущем."
 ENG_nfl_stat: "Статус Ньюфаундленда"
 ENG_nfl_stat_desc: "С тех пор как ЛМСК правительство Ньюфаундленда стало ощущать себя от кризиса до кризиса, его правительство не смогло остановить каждую последующую катастрофу."
 ENG_global_developments: "Глобальные события"
 ENG_global_developments_desc: "В последние годы наблюдался заметный рост напряженности во всем мире по мере того, как вспыхивают конфликты и войны за горизонтом, и если мы хотим обеспечить, чтобы Империя была готова к любому будущему конфликту, мы должны действовать сейчас и быстро."
 ENG_rhodesia: "Родезия и Южноафриканский союз"
 ENG_rhodesia_desc: "С самого начала в Родезии происходили движения за официальный союз между собой и Южной Африкой."

 ENG_london_dec: "Лондонская декларация"
 ENG_london_dec_desc: "В то же время совершенно ясно, что каждая страна полностью свободна идти своим путем; может быть, они могут пойти, иногда зайти так далеко, чтобы расстаться с Содружеством... Иными словами, помимо того, что разрушать злые части ассоциации, лучше сохранить кооперативное объединение, которое может делать добро в этом мире, а не разрушить его."
 ENG_con_secretariat: "Секретариат Содружества"
 ENG_con_secretariat_desc: "Отвечающий за организацию совещаний, обеспечение сотрудничества и оказание помощи странам в продвижении предложений Содружества, Секретариат станет влиятельным постом и может помочь нам сплотить Содружество в предстоящие годы."
 ENG_charter: "Хартия Содружества"
 ENG_charter_desc: "Подтверждая ценности Содружества наций, Хартия Содружества отражает ценности и убеждения, разделяемые всеми членами Содружества."
 ENG_foundation: "Фонд Содружества"
 ENG_foundation_desc: "Фонд Содружества является платформой, используемой для содействия взаимодействию общественности с Содружеством, а также отвечает за предоставление субсидий и субсидий государственным учреждениям."
 ENG_reform_ipa: "Реформировать Имперский альянс защиты"
 ENG_reform_ipa_desc: "Учрежденный в качестве средства для защиты своих интересов во всем мире с появлением Содружества, АПИ выглядит все более устаревшим, поскольку мы можем преобразовать АПИ в новый союз — Содружество наций."

 IMP_lon_dec: "Лондонская декларация"
 IMP_lon_dec_desc: "В то же время совершенно ясно, что каждая страна полностью свободна идти своим путем; может быть, они могут пойти, иногда зайти так далеко, чтобы расстаться с Содружеством... Иными словами, помимо того, что разрушать злые части ассоциации, лучше сохранить кооперативное объединение, которое может делать добро в этом мире, а не разрушить его."
 IMP_secretariat: "Секретариат Содружества"
 IMP_secretariat_desc: "Отвечающий за организацию совещаний, обеспечение сотрудничества и оказание помощи странам в продвижении предложений Содружества, Секретариат станет влиятельным постом и может помочь нам сплотить Содружество в предстоящие годы."
 IMP_charter: "Хартия Содружества"
 IMP_charter_desc: "Подтверждая ценности Содружества наций, Хартия Содружества отражает ценности и убеждения, разделяемые всеми членами Содружества."
 IMP_foundation: "Фонд Содружества"
 IMP_foundation_desc: "Фонд Содружества является платформой, используемой для содействия взаимодействию общественности с Содружеством, а также отвечает за предоставление субсидий и субсидий государственным учреждениям."

 ENG_impfed_annex: "Великая конференция в Имперском парламенте в Лондоне"
 ENG_impfed_annex_desc: "Прошел год с тех пор, как парламенты Доминиона были официально распущены и их представители заняли свое место в Имперском парламенте в Лондоне. Всего несколько лет назад наша Империя была разделена, разрушена и находится на грани распада. Действия нескольких храбрых людей, которые пытались вернуть империю власть и стабильность, гарантировали, что мы снова станем властью, с которой можно считаться. ~ ~ Несмотря на то, что нестабильность в конечном итоге, народ Империи вновь объединился в интересах достижения общей цели, мы сплотимся, чтобы противостоять любым вызовам истории, которые пойдут нам вперёд. Несмотря на то, что предстоящий путь будет непростым и полным рискам, мы можем принять утешение в том, что мы столкнемся с ним не как с разделенной империей, а как с одной нацией с одной целью. Наш флаг будет поднят по всему миру, мы будем защищать свободу, где сможем, и мы будем обеспечивать мир на этой зеленой Земле. Мы не забудем вековую мудрость: «Мы стоим, разделимся». За веру, Король и Империю!"

 ENG_prop_campaigns: "Пропагандистские кампании"
 ENG_prop_campaigns_desc: "Для обеспечения того, чтобы общественность и впредь в полной мере поддерживала наше правительство в нашей нынешней войне, мы можем начать пропагандистскую кампанию, нацеленную на общественность, с тем чтобы она могла повлиять на наш образ мышления."
 IMP_prop_campaigns: "Кампания по пропаганде, возглавляемая Великобританией"
 IMP_prop_campaigns_desc: "Для обеспечения того, чтобы общественность и впредь в полной мере поддерживала наше правительство в нашей нынешней войне, мы можем начать пропагандистскую кампанию, нацеленную на общественность, с тем чтобы она могла повлиять на наш образ мышления."
 ENG_launch_offensive: "Имперские наступательные действия"
 ENG_launch_offensive_desc: "В следующем месяце вооруженные силы Империи будут использоваться исключительно для наступательных действий."
 IMP_launch_offensive: "Имперские наступательные действия"
 IMP_launch_offensive_desc: "В следующем месяце вооруженные силы Империи будут использоваться исключительно для наступательных действий."
 ENG_bombing_campaign: "Стратегическая кампания по бомбардировке"
 ENG_bombing_campaign_desc: "Под руководством Императорского начальника Генерального штаба объединенные военно-воздушные силы Империи будут использоваться для непрерывной кампании бомбардировок противника промышленной энергетики в следующем месяце."
 IMP_bombing_campaign: "Стратегическая кампания по бомбардировке"
 IMP_bombing_campaign_desc: "Под руководством Императорского начальника Генерального штаба объединенные военно-воздушные силы Империи будут использоваться для непрерывной кампании бомбардировок противника промышленной энергетики в следующем месяце."
 ENG_industrial_priorities: "Промышленные приоритеты"
 ENG_industrial_priorities_desc: "Для нашей победы нам необходима дополнительная поддержка со стороны всей имперской промышленности, чтобы повысить нашу способность снабжать наши войска новым оборудованием."
 IMP_industrial_priorities: "Промышленные приоритеты"
 IMP_industrial_priorities_desc: "Для нашей победы нам необходима дополнительная поддержка со стороны всей имперской промышленности, чтобы повысить нашу способность снабжать наши войска новым оборудованием."
 ENG_defensive_planning: "Планирование действий по защите"
 ENG_defensive_planning_desc: "Наша позиция на линии фронта в лучшем случае неустойчива, и нам нужно подготовить новые оборонительные линии, если они нам понадобятся."
 IMP_defensive_planning: "Планирование действий по защите"
 IMP_defensive_planning_desc: "Наша позиция на линии фронта в лучшем случае неустойчива, и нам нужно подготовить новые оборонительные линии, если они нам понадобятся."

