 ENG_conser_nation: "Консервативная нация"
 ENG_conser_nation_desc: "Наш народ преисполнен решимости и стойкости, мир может впасть в ложную песню «прогрессивизма», но Британия будет стоять как камень через испытание времени, наши ценности и неприкосновенные и вечные."
 ENG_unified_gov: "Единое правительство"
 ENG_unified_gov_desc: "После поглощения Либеральных Националов в Консервативную партию мы видим уровень популярности, который никогда раньше не был виден, и никто не может ставить под сомнение единство нашего правительства или нашей нации."
 ENG_socialist_front: "Объединенный социалистический фронт"
 ENG_socialist_front_desc: "Независимая Лейбористская партия была полезным инструментом для того, чтобы выкорчевать более "радиальных" членов рабочей силы, но это уже не необходимо."
 ENG_loyal_army: "Военная преданность"
 ENG_dr_buckingham: "Прямое правило"
 ENG_dr_buckingham_desc: "Будучи божественным монархом Соединенного Королевства Великобритании и Ирландии и императором Индии, король Эдуард VIII взял на себя обязанности короля над Британской империей и бремя ее руководства."
 ENG_con_mon: "Рука руководства"
 ENG_con_mon_desc: "Монарх Соединенного Королевства обязан добросовестно защищать свой народ от вреда и, в случае необходимости, распустить парламент для обеспечения дальнейшего существования Британской империи."
 ENG_church_junta: "Диктаторство Черчилля"
 ENG_church_junta_desc: "Кризис в Манчестере доказал, вне тени сомнений, что политики наших справедливых островов трусливы и неспособны привести наш народ к нашей судьбе."
 ENG_church_republic: "Гарантии предоставления услуг"
 ENG_church_republic_desc: "Молодые люди со всей империи присоединяются к борьбе за будущее, они выполняют свою роль, а вы? Войдите в Британскую армию и спасите мир. Служебная служба гарантирует гражданство!"
 ENG_neo_feudalism: "Сильная аристократия"
 ENG_neo_feudalism_desc: "Чтобы закрепить наше правление во всей нации, наш король Эдуард VIII дал указание дворянству Британских островов выйти и принести свое правление британскому народу. К сожалению, «его правление» часто интерпретируется по-другому."
 ENG_new_household_guard: "Домашняя охрана"
 ENG_new_household_guard_desc: "С тех пор, работая в качестве элитного телохранителя монархии, обязанности горничной значительно расширились, и сорняки революции больше не будут размножаться на британской земле."
 ENG_the_barb: "БАРБ"
 ENG_the_barb_desc: "Британская антиреволюционная бригада, или БАРБ, была создана советом военных лидеров под руководством самого Черчилля."
 ENG_sparta_education: "Молонский лабиринт"
 ENG_sparta_education_desc: "Древняя греческая фраза, использованная королем спартанцев в Термопиле, широко используется в последние месяцы среди офицеров наших вооруженных сил."
 ENG_milind_comp: "Британский военно-промышленный комплекс"
 ENG_milind_comp_desc: "Она, известная как план J для предыдущих правительств, призвала к быстрой мобилизации британской экономики, с тем чтобы она отвечала требованиям войны, при этом чрезвычайно важные военные отрасли были активированы задолго до начала конфликта, с тем чтобы обеспечить нашу полную готовность к полной войне."
