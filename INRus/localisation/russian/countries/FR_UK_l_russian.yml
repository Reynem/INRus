 #Imperialism

 #AA Oil Company
 ukf.1.d: "Теперь, когда мы смотрим на Аравийский полуостров и парламент, полностью поддерживая попытки восстановить наше влияние на аравийскую нацию, нам приходится принимать решение о том, как это сделать. Многие члены нашего правительства считают, что более простым способом обеспечения нашего контроля над страной является экономическое господство над ней, как это было сделано в период войны. В этой связи несколько наших министров предложили создать англо-арабскую нефтяную компанию, что принесет двойную пользу: во-первых, мы, несомненно, выиграем от каких-либо месторождений ресурсов, обнаруженных в регионе, и, во-вторых, правительство Арабской Республики вряд ли будет сопротивляться нам с таким большим объемом своей экономики, находящейся под нашим контролем. Наше правительство готово немедленно продвигаться вперед в этом направлении."
 ukf.2.d: "Теперь, когда англо-арабская нефтяная компания официально учреждена, наше правительство должно решить, какой уровень контроля мы будем осуществлять над этой компанией."
 ukf.3a.d: "Правительство Великобритании информировало нас о своем решении, касающемся контроля над англо-арабской нефтяной компанией, и с этого момента оно будет сохранять полный контроль над этим предприятием."
 ukf.3b.d: "Правительство Великобритании информировало нас о своем решении, касающемся контроля над англо-арабской нефтяной компанией, и приняло решение разделить контроль над компанией с нашим правительством в целях улучшения отношений между нашими странами."
 ukf.4.d: "Почти неделю прошло с тех пор, как англо-арабская нефтяная компания создала близ многообещающего района, и уже начали проявляться проблемы. Хотя правительство арабских государств, кажется, более чем счастливо разрешить наши дальнейшие инвестиции в их экономику, похоже, они не имеют полного контроля над племенами в этом районе. Вчера днем несколько членов племен напали на нашу буровую площадку и ранили двух британских граждан, прежде чем сбежать с важным оборудованием. Эта потеря лица служит лишь унижению нашей нации, и мы должны убедиться в том, что это не повторится."
 ukf.5.d: "Сегодня утром британская делегация в нашем правительстве обратилась к нашему правительству с рядом требований: ссылаясь на недавнюю стычку в Даммане, в ходе которой один британский гражданин был ранен и оборудование похищено с места проведения буровых учений, они потребовали, чтобы им разрешили разместить в этом районе солдат и уступить британцам власть в регионе."
 ukf.6.d: "Не желая слепо принять наши требования, Аравийский король вместо этого отказался от своего положения, используя наше влияние на их гвеннмент, мы добились успеха в том, чтобы более сочувствующий член королевской семьи занял пост короля, он согласился с нашими требованиями в отношении арабского правительства и теперь мы имеем в регионе преданный протекторат."
 ukf.7.d: "Аравийское правительство отказалось от наших требований о том, чтобы нам разрешили использовать станцию вблизи Даммана для защиты нашего бурового участка, поскольку такая нация, как Аравия, отказывается удовлетворить наше великодушное требование, остается мало выбора, кроме как показать миру, что происходит, когда вы отказываетесь принять требования Империи."
 ukf.8.d: "После инцидента, произошедшего вблизи Даммана, где один британский гражданин был ранен местными племенами и угнанным с места раскопок важным оборудованием, британское правительство потребовало, чтобы наше правительство активизировало наши усилия по защите своих граждан на местах, хотя это, разумеется, возможно, и если мы попытаемся устранить британское влияние на нашу нацию, мы можем вместо этого обратиться к местным племенным лидерам и предложить им оружие в качестве средства активизации нападений на англичан. Однако такой акт, по всей вероятности, лишь вызовет гнев британского правительства."
 ukf.9.d: "По мере того, как правительство арабских государств поклонилось нашему давлению, направленному на укрепление местного гарнизона вблизи нашего бурового участка, была проведена экскурсия, чтобы «ускорить» этот район."
 ukf.10.d: "Несмотря на наши требования о том, чтобы правительство арабских государств активизировало усилия по защите наших буровых установок от нападений местных племен, нам сообщили, что местный гарнизон мало что сделал для оказания помощи в обороне и, по крайней мере, один из наших людей на земле оказал помощь лишь тем, кто напал на место проведения буровых учений."
 ukf.11.d: "Две недели прошло с тех пор, как англо-арабская нефтяная компания начала бурение всерьез, и первые результаты обнадеживают."
 ukf.12.d: "Прошло месяц с тех пор, как англо-арабская нефтяная компания приступила к успешному бурению, и результаты оказались больше, чем мы могли ожидать."
 ukf.13.d: "Сегодня утром делегация арабских государств в Лондоне выдвинула официальное предложение своего правительства о том, чтобы обеспечить дополнительный контроль над прибыльной англо-арабской нефтяной компанией, а также предложила нам контроль над Иорданией и Западным Ираком, находящимися в настоящее время под их управлением."
 ukf.14a.d: "Британское правительство откликнулось на наше предложение и отказалось от дополнительного контроля над англо-арабской нефтяной компанией перед нашей страной в обмен на наши иорданские и западные иракские территории."
 ukf.14b.d: "Британское правительство отказалось от нашего щедрого предложения о дополнительном контроле над англо-арабской нефтяной компанией в обмен на Иорданию и Западный Ирак."

 #East Indies Blockade
 ukf.20.d: "Вопрос о отношениях между Англо и Гутчом недавно вышел на передний план в наших планах правительства на будущее, поскольку ситуация на континенте быстро ухудшается, нам было бы очень полезно обеспечить наше неизменное господство над районом Восточной Азии. В частности, Ист-Индией остается жизненно важная территория, имеющая некоторые из наиболее важных ресурсов для военных усилий, в частности для производства каучука. Местные вице-президенты и колониальные губернаторы в регионе также пришли к нам и выразили обеспокоенность по поводу положения в Восточной Азии, опасаясь, что Ист-Индия станет зоной войны в любом будущем конфликте. Это было бы чрезвычайно выгодно не только для Империи в целом, но и для стабильности и безопасности в наших запасах в Восточной Азии, если бы мы взяли на себя контроль над Голландской Ист-Индой. Однако такое требование вряд ли будет воспринято положительно."
 ukf.21.d: "Сегодня утром представитель Великобритании в Амстердаме вручил нашему правительству официальную ноту. В этом документе - ряд требований британского правительства - подробно изложено весьма возмутительное предложение о том, чтобы мы доставили им наше имущество в Ист-Индию, поскольку, по их словам, «положение в Тихом океане напряженно», они, конечно же, опускают, поскольку какая-либо напряженность вызвана их недавними империалистическими усилиями ~n-n-n-downing of the East India to their control, скорее всего, нанесет серьезный ущерб нашей экономике, поскольку многие важные ресурсы все еще добываются и транспортируются на нашу материк из этого района. Это, конечно же, не говорит о потенциальных политических последствиях предоставления британскому правительству возможности запугать нашу страну. ~ Несмотря на то, что защита Ист-Индии от любого возможного вторжения невозможна, похоже, что у нас остается мало выбора, но мы, по крайней мере, не пытаемся попытаться защитить наши интересы в Ист-Индии."
 ukf.22.d: "К удивлению нашего правительства, голландцы сложили наши требования и отказались от контроля над Ист-Индией."
 ukf.23.d: "Теперь, когда мы имеем контроль над Ист-Индией, мы должны решить, как лучше управлять территорией, хотя прямой контроль является наиболее очевидным выбором, возможно, было бы полезно для нашей и без того напряженной администрации разделить острова между нашими союзниками, сохраняя при этом крупные острова для себя."
 ukf.24.d: "Наш самый благородный союзник в Британии предложил нам часть земли в недавно приобретенной Ист-Индии. Это предложение поистине дает нам прекрасную возможность расширить наше влияние на Тихий океан и является богатой ресурсами землей. Отказ от такого предложения был бы безумием!"
 ukf.25.d: "Голландцы, к сожалению, отреагировали, как и предсказывалось, на наши требования в отношении колоний в Ист-Индии, отказав им в праве. В ответ нам были представлены многочисленные методы "принудительного" голландцев, используя силу Королевского флота как средство их принятия. В этой связи Адмиралтейство выдвинуло план полной блокады голландских морских перевозок в Ист-Индию как средства отсечения их колониальных запасов в Восточной Азии от их материковой части, предотвращения поставок и подкрепления. Любая блокада этого района, вероятно, будет трудной и трудоемкой, и она займет много времени, и Ист-Индии нам нужно будет освободить многие корабли для патрулирования этого района. Несмотря на эти мысли, а также на признание того, что голландцы вряд ли примут это решение, многие из членов нашего правительства настаивают на том, что мы откажемся от этого вопроса в качестве средства успокоения наших отношений, более хакишские члены, тем не менее, выступают за то, что мы готовимся к войне в Восточной Азии как средство показать миру цену, которую вы платите за то, что бросаете Империю."
 ukf.26.d: "Согласно сообщениям из Ист-Индии, королевские военно-морские силы осуществляют крупную блокаду всей цепи островов. Британское правительство явно уступило место безумию, если мы не будем действовать сейчас, наша колония, несомненно, рухнет, и мы будем подвергнуты международному унижению! Мы должны немедленно отправить эскадрилью наших кораблей, чтобы разрушить эту блокаду!"
 ukf.27.d: "После того как против голландцев было оказано огромное давление с нашей продолжающейся морской блокадой Ист-Индии, правительство Амстердама решило сдаться под контроль Империи над территорией."
 ukfa.28.d: "С учетом наших приказов наше военно-морское командование в Амстердаме направило большой эскадрилью кораблей на наши территории Ист-Индии с намерением нарушить блокаду. Путешествие было беспрерывным, и только после того, как мы закрылись в рамках блокады Королевского военно-морского флота, все пошло наперекосяк. Несколько наших кораблей были пойманы вне стражи из-за плохой погоды в этом районе, в первом заливе мы потеряли два судна, один из которых был серьезно поврежден. В последовавшей битве произошла долгая стычка, в ходе которой наши корабли были постепенно перегружены по мере прибытия новых подкреплений Королевского флота. Наши военно-морские силы сражались храбро, но в конце концов они не могли нарушить блокаду. Большинство кораблей понесли тяжелый ущерб и многие были затоплены, что привело к ужасной гибели людей. В этот день мы потерпели тяжкое поражение, и наши потери будут измеряться не только в жизни людей и кораблях, но и в собственности за рубежом."
 ukfb.28.d: "Наш флот, который мы недавно направили для того, чтобы сломить блокаду Ист-Индии, столкнулся сегодня с британским флотом у острова Рождества, когда с ним случились столкновения, и были выпущены снаряды, многие корабли были затоплены и погибли, когда бушевала битва, наш славный флот не терял своих врагов и сумел вырвать их из боя, вынуждая их вернуться в порт. Мы сломали блокаду и превосходство Королевского флота было разрушено!"
 ukfa.29.d: "Наша блокада Ист-Индии недавно подверглась нападению, когда Голландский азиатский флот столкнулся с нашим азиатским флотом у острова Рождества. Несмотря на наше преимущество, наши корабли подверглись тяжелому обстрелу и понесли огромный ущерб. В конечном счете, после дня боевых действий они были вынуждены вернуться в порт, тем самым временно нарушив блокаду. Это было поистине унизительным событием для нашей нации, но мы отомстим за эту битву!"
 ukfb.29.d: "Наша блокада Ист-Индии недавно подверглась нападению, когда Голландский азиатский флот столкнулся с нашим азиатским флотом с острова Рождества, благодаря нашей превосходной тактике и огромному преимуществу, мы успешно разрушили голландский флот, потопили или повредили их всех и сохранили блокаду. Наше господство над Индийским морем было сохранено, и голландцы никогда не научятся оспаривать нашу власть в море!"
 ukf.30.d: "С нашей неудачей в Битве на острове Рождества блокада нашего имущества в Ист-Индии продолжается и продолжается. Припасы падают, и местное население становится все более беспокойным; Соединенное Королевство успешно отрезает нас от нашей территории в Ист-Индии. Если мы не будем действовать в ближайшее время, наши преданные солдаты будут вынуждены сдаться, и британцы смогут оккупировать острова без каких-либо проблем."
 ukf.31.d: "С провалом голландского правительства в битве на острове Рождества наша блокада не ослабевает. &lt; &lt; Королевская разведка &gt; &gt; указала, что поставки стали сокращаться среди голландских гарнизонов и местное население стало беспокоиться. &lt; &lt; Голландцы &gt; &gt; должны знать об этой ситуации, и поэтому, возможно, было бы разумно предложить им сдаться сейчас. &lt; &lt; В противном случае &gt; &gt; мы можем подождать еще несколько недель, пока гарнизон не сдастся без каких-либо условий, и мы сможем занять этот район без сопротивления."
 ukf.32.d: "Британское правительство, которое, очевидно, осознает наши трудности с поставками в Ист-Индии, вновь предоставило нашему правительству возможность сдать острова под их контроль, не унося при этом дальнейшей гибели людей, хотя многие из членов нашего правительства по-прежнему решительно выступают против капитуляции, представляется, что без прямого объявления войны против Империи мы не сможем удерживать эту территорию бесконечно."
 ukf.33.d: "Вчера вечером элементы голландского гарнизона, дислоцированного в Батавии, официально сдались британскому адмиралу, отвечающему за блокаду территории Королевскими ВМС."

 #Operation Pitcairn
 ukf.35.d: "Панамский канал соединяет Атлантический и Тихий океан с 1914 года, делая поток торговли по всему миру гораздо более плавным и эффективным, поэтому канал абсолютно необходим для сохранения нашего контроля над морями. С Соединенными Штатами, которые все еще сильно страдают от депрессии, у нас есть идеальная возможность взять его под свой контроль. В противном случае мы могли бы также обратиться к ним с предложением купить канал таким образом, чтобы держать нас в хорошем положении с остальным миром, но стоит нам огромных денег."
 ukf.36.d: "Сегодня представитель Великобритании в Вашингтоне представил нашему правительству официальное предложение о покупке Панамского канала, которое, как правило, полностью игнорируется, поскольку считается, что этот канал имеет стратегическое значение для нашей страны, однако некоторые члены нашего правительства заявляют о своей заинтересованности в этом соглашении в качестве средства смягчения финансовых трудностей, с которыми мы сталкиваемся в настоящее время из-за Великой депрессии."
 ukf.37.d: "Наше предложение о покупке Панамского канала было согласовано сегодня утром британским представителем в Вашингтоне и государственным секретарем Соединенных Штатов."
 ukf.38.d: "Проявив полную глупость, американское правительство прямо отвергло наше предложение о покупке Панамского канала, заявив, что оно не может произвольно допустить, чтобы канал был предоставлен другой стране, особенно с учетом его важности для торговли в Карибском море."
 ukf.39.d: "С нашими приказами в Уайтхолле собрались элементы Королевской морской пехоты и Королевского флота, чтобы обсудить запланированную конфискацию Панамского канала у американского гарнизона, который находится в настоящее время в этом районе. &quot; Операция Питкэрна &quot; - в честь офицера Королевской морской пехоты, убитого во время битвы при Банкер-Хилле против американских мятежников, - планирование займет несколько недель и, возможно, потребует большего числа людей и ресурсов, прежде чем мы будем полностью готовы. Уже возник первый вопрос, касающийся запланированной операции: Королевские морские командиры решительно выступают за то, чтобы им было предоставлено больше солдат, утверждая, что нынешних цифр едва хватает для захвата территории, столь большой, как Панамский канал."
 ukf.40.d: "Вчера вечером адмирали Королевских ВМС сообщили оперативному штабу в Уайтхолле о том, что в связи с Панамским каналом возник ряд вопросов, связанных с разведкой. &lt; &lt; Предположительно, гарнизон &gt; &gt; этого района гораздо больше, чем предполагалось ранее, и существует ряд географических проблем, которые могут препятствовать любой предполагаемой высадке на берег королевских морских пехотинцев. &lt; &lt; Как таковые &gt; &gt; они обратились к нашему правительству с просьбой предоставить им возможность провести дополнительную разведку в зоне &lt; &lt; Канал &gt; &gt; в Ордере, с тем чтобы сгладить более значимую разведку в этом районе."
 ukf.41.d: "Прошло немногим более месяца с тех пор, как было предписано приступить к планированию операции на Питкэрне, и в течение нескольких долгих дней и ночей сотрудники Королевского военно-морского флота неустанно работали над подготовкой наших вооруженных сил к предстоящему захвату."
 ukf.42.d: "В 5 час. 34 мин. по местному времени отряды Королевских морских пехотинцев спустились в Панамский канал с помощью утреннего тумана для быстрого продвижения на берег. Местные жители были разбиты, когда крики разбудили наполовину спящих американских солдат с кроватей и приказали им сдаться в казармах по всей территории. Несмотря на то, что первоначально успешные перестрелки произошли на суше, когда американский гарнизон получил приказ «изо всех и всех средств противодействовать иностранному вторжению». Вашингтон уже отреагировал с яростью при захвате нашей территории, заявив, что «нападение» представляет собой самый яркий пример возобновления империализма на американском континенте со стороны Британской империи»."
 ukf.43.d: "Рано утром, когда отряды Королевских морских пехотинцев приземлились на пляжах зоны Панамского канала, они сразу же оказались под угрозой более крупного, чем предначертанного американского гарнизона в этом регионе, очевидно, предупредили о нашем вторжении задолго до этого. ~ Несмотря на то, что королевские пехотинцы при содействии Королевского флота приземлились на пляжах этой территории, они сначала переполнили оборону американского гарнизона, не достигнув своих главных целей из-за отсутствия поставок и плохой осведомленности о местной местности. ~ ~ ~ В результате храбрых действий на пляжах этой территории командиры Королевских морских пехотинцев приказали совершить общий отъезд после захвата небольшого портового объекта. ~ ~ Цена провала была высокой: несколько сотен королевских морских пехотинцев были схвачены еще десятками человек. С этой потерей лица наше унижение было увеличено только тогда, когда американские газеты показали на их первых страницах изображения захваченных королевских моряков."
 ukf.44a.d: "Примерно в 6 утра по местному времени начали поступать сообщения из Панамского канала о нападении сильно вооруженных и специально обученных солдат. Хотя подробностей о том, кто был нападавшими, было мало, один из наших разрушителей заметил эскадрилью кораблей Королевского флота у побережья Панамского канала, которая обеспечивала пожарную поддержку того, что мы считаем контингентом королевских морских пехотинцев. Несмотря на храбрые бои, наши солдаты и моряки в конечном итоге поддались более хорошо оснащенным королевским морским пехотинцам. ~nnThe Press были собраны сегодня в Белом доме, и президент сделал заявление об этом нападении, недвусмысленно заявив, что мы не позволим британам вновь принести приз империализма в Америку. Хотя общественное мнение твердо поддерживает наше правительство в этом вопросе, некоторые сомневаются в том, что общественность полностью стоит за войной с Британской империей."
 ukf.44b.d: "На рассвете над Панамским каналом сегодня утром начали появляться сообщения о том, что на пляжах зоны Канал плывут сильно вооруженные силы. Оповещенные местным населением, наш гарнизон в этом районе быстро двигался, чтобы защитить территорию и поймать нападавших, пока они все еще захватывают пляжи. Началась жестокая перестрелка, и в течение какого-то времени казалось, что наши силы находятся на грани поражения до того, как вражеские силы были сбиты из-за отсутствия поставок и плохой осведомленности о местности. Несмотря на то, что командир этого района отдал приказ о проведении общего контрата против нападавших и заставил их вновь вернуться к нарушению с того момента, когда они прибыли. По мере того, как нападавшие силы выкопали и начали свои собственные жестокие контрнападения, которые наши храбрые солдаты отталкивали. По прошествии нескольких часов налетали противника, до тех пор, пока лишь несколько десятков человек не остались на пляжах и не сдались нашим солдатам, раскрыли себя как королевские мораты британских вооруженных сил."

 #Channel Exercises

 ukf.70.d: "В связи с самым серьезным кризисом на Лондонском фондовом рынке в настоящее время наш акцент вновь переключился на напряженность между нами и Францией, а также на сохраняющуюся возможность открытых боевых действий на европейском материке и за рубежом. &lt; &lt; Адмиралтейство &gt; &gt; обратилась к правительству с планами провести широкомасштабные военно-морские учения на английском канале не только в целях обеспечения того, чтобы Королевские военно-морские силы выполняли задачу по защите Британии, но и в попытке послать сигнал французам о том, что наша решимость как никогда сильна."
 ukf.71.d: "Сегодня утром Генеральный директор Бюро Дейме встретился с нашим президентом для обсуждения вопроса о создании британских военно-морских судов в пределах Английского канала. В то время как Королевский флот регулярно меняет свои силы в проливе и за его пределами и за его пределами, наша разведывательная служба сообщила, что в Портсмуте и в других местах вдоль английского побережья было сделано гораздо больше судов. &lt; &lt; Дексем &gt; &gt; считает, что в течение следующих нескольких недель британцы готовятся к широкомасштабным военно-морским учениям. &lt; &lt; Морская нация &gt; &gt; по-прежнему испытывает относительно большую напряженность в отношениях между нашими двумя государствами, и поэтому она запросила разрешение на заказ некоторых французских судов к морю в проливе в качестве средства наблюдения за британскими морскими учениями с моря, с тем чтобы они не нарушали территориальные воды Франции."
 ukf.72.d: "Прошло более двух недель с момента начала учений на канале, и мы многому научились из состояния Королевского ВМС."
 ukf.73.d: "В конце вчерашнего вечера свежие сообщения от командующих Королевскими ВМС, участвовавших в учениях по Каналу, показали, что в настоящее время несколько кораблей Королевского ВМС находятся под прикрытием их контрчастей во Французской морской национальной. В настоящее время неизвестно, почему они так внимательно следят за нашими учениями. Теории варьируются от плохих попыток до шпионажа над нашими ВМС до более вероятной попытки не дать нашим судам подобраться слишком близко к французским водам."
 ukf.74.d: "Примерно в 2:56 утра во время боевой стрельбы HMS Тритон под командованием лейтенанта Стил случайно попал в территориальные воды Франции во время наших военно-морских учений. При входе во французские воды потребовалось час, прежде чем HMS Тритон всплыл и обнаружил, что они вылетели из зоны боевых учений. Окончательная связь между адмиралтом и лейтенантом Стил указала на то, что они пытались вернуться в международные воды, когда они были перехвачены французским судном. Связь была резко сокращена, и несколько кораблей Королевского флота были отправлены в последнее место назначения HMS Тритон. При доходе к месту назначения был обнаружен эскадрон французских судов, а обломки, принадлежащие HMS Тритону, были обнаружены в воде вблизи. До настоящего времени французское правительство отказалось комментировать меры, принятые в отношении нашего судна, и напряженное противостояние между королевскими военно-морскими судами и национальными морскими кораблями продолжалось в это утро. Обстоятельства, связанные с затоплением HMS Тритона, остаются в лучшем."
 ukf.75.d: "Прошлой ночью один из наших Разрушителей - Ле Фантаскский - безошибочно обнаружил подводную лодку в наших территориальных водах. Полагая, что она является судном Королевского ВМС, и с большим подозрением между нашими двумя странами, был направлен приказ в Ле Фантаск, чтобы перехватить подводную лодку и заставить ее выйти на поверхность, чтобы ее можно было высадить. Когда в пределах дальности от подводной лодки Ле Фантаск снял несколько глубинных зарядов, пытаясь заставить наши корабли покинуть эту подлодку. Первые два глубинных заряда не справились с их целью, но третья, казалось, попала непосредственно на подводную лодку, вызывая крупный взрыв. Французские суда были отправлены в этот район для оказания помощи в спасении выживших, если кто-либо может быть найден, но ситуация только ухудшилась в результате прибытия в этот район нескольких кораблей Королевского ВМС, которые немедленно потребовали от наших кораблей покинуть его, с тем чтобы они могли начать свои собственные спасательные операции."
 ukf.76.d: "Правительство Франции отказало в просьбе о том, чтобы французское правительство принесло семьям погибших моряков на борту судна &lt; &lt; ХМС Тритон &gt; &gt; всесторонние извинения, заявив, что Королевский ВМС незаконно нарушил суверенитет Франции, проникнув во французские территориальные воды, и предупредило нас о будущих провокациях. Наше правительство испытывает ярость в связи с этим оскорблением нашей нации и тех, кто связан с погибшим, и придумало несколько планов заставить французов отступить еще дальше. До сих пор Адмиралтийство одобрило лишь один план: оно призывает к немедленному развертыванию Средиземноморского флота, демонстрируя во Франции силу, что мы не отступим от решения этого вопроса."
 ukf.77.d: "Сегодня британские дипломаты в Париже сообщили Вестминстеру о встречах с министром иностранных дел Франции, выразив свои искренние соболезнования в связи с гибелью людей в результате этого трагического инцидента, который сейчас считается трагическим, французское правительство согласилось официально написать каждому из этих родственников покойного письмо с извинениями."
 ukf.78.d: "Сегодня утром британское правительство официально приняло наши извинения за гибель людей в трагическом инциденте между нашими двумя мореплавателями. &lt; &lt; Королевские корабли ВМС &gt; &gt; вновь вернулись в порт, а &lt; &lt; Морская нация &gt; &gt; удалила большинство своих судов из канала. &lt; &lt; Морской национальной морской пехоты &gt; &gt; многие вздохнули с облегчением, что эта авария не привела к очередному обмену ударами между Королевским флотом и &lt; &lt; Морской национальной морской пехотой &gt; &gt; ."
 ukf.79.d: "Сегодня руководители морских национальных сил встретились с президентом при Генеральном директоре Бюро Дюксиема для обсуждения новых военно-морских движений, осуществляемых Королевскими военно-морскими силами. &lt; &lt; Наш отказ принести извинения в связи с гибелью людей на британской подводной лодке &gt; &gt; был встречен молчанием из Вестминстера, но мы получили сообщения о том, что Британский средиземноморский флот покинул порт и направляется к побережью Альгери &gt; &gt; ."
 ukf.80.t: "Битва при Мерс-эль-Кебире"
 ukf.80.d: "В 11 О'Клоке сегодня утром корабли Королевского военно-морского флота вновь приблизились к французским территориальным водам, на этот раз у побережья Алгарии, и почти сразу же встретились со своими контрпартаментами в морской национальной зоне с противостоянием между двумя флотами. Несколько часов спустя французская подводная лодка &lt; &lt; Ле Ариан &gt; &gt; подошла слишком близко к Военно-морской боевой группе, и были сброшены глубинные заряды, причиняющие значительный ущерб судну. Корабли Королевского ВМС, пытающиеся проследовать за подводной лодкой, дрейфующей в пределах французских территориальных вод, и несколько предупредительных выстрелов были произведены между французскими и британскими судами в регионе. &lt; &lt; Ле Ариан &gt; &gt; , по-прежнему потерпевшая ущерб от инцидента, взорвалась вскоре после того, как он достиг национального морского флота, и французские командиры приняли его за прямой огонь со стороны Королевского ВМС, в ходе которого вскоре развивались обе стороны."
 ukf.81.d: "В связи с завершением спасательных операций как Королевским флотом, так и Национальной морской службой, сообщения свидетельствуют о том, что французский флот вновь вернулся в порт в регионе. &lt; &lt; Британские средства массовой информации &gt; &gt; заявили о победе в этом конфликте между нашими странами, причем некоторые фотографии французского боевого корабля были сожжены и потоплены на всех местных средствах массовой информации. &lt; &lt; Неожиданно &gt; &gt; французские средства массовой информации также заявили о победе в этом бою, заявив, что &lt; &lt; Морской национальный флот &gt; &gt; уничтожил больше кораблей в битве, чем она потеряла, хотя, как представляется, французское правительство не желает продолжать эскалацию этого в отношениях между нашими странами. &lt; &lt; Пожалуй, наиболее значимая точка вспышки между нашими двумя странами с тех пор, как завершился инцидент с Фашодой &gt; &gt; , и многие с облегчением того, что открытую войну удалось избежать."

 #Anglo-Portuguese Relations

 ukf.90.d: "Португалия является одним из наших ближайших союзников на протяжении более нескольких веков, и лишь недавно, подписав Лондонский военно-морской договор в 1931 году, она в последние годы погрязла в политической вражде и гражданской войне. Несмотря на наш новый интерес к расширению круга наших союзников в Европе, подтверждение нашего союза с Португалией представляется очевидным выбором, который почти наверняка увенчается успехом."
 ukf.91.d: "Сегодня утром представитель Великобритании в нашей столице обратился к нашему правительству с официальным предложением присоединиться к их альянсу, с тем чтобы укрепить связи между нашими двумя странами и обеспечить взаимную безопасность в эти трудные времена."
 ukf.92.d: "К большому удивлению нашего правительства, португальское правительство безрассудно отвергло наш посольный союз, и сегодня они, несомненно, пожалеют об этом."

 #The Alaskan Territories
 ukf.110.d: "Британское правительство продолжает свою волну возрождения империализма на Американском континенте, требуя передачи наших Аляски под канадский контроль."
 ukf.111.d: "Американское правительство вновь продемонстрировало свое полное незнание военной ситуации вокруг своей страны, на этот раз отказавшись от нашего вполне разумного требования передать свои территории Аляски Доминиону Канады."
 ukf.112.d: "Не удивительно, что американское правительство сошлось с нашими требованиями о передаче своей территории Аляски Доминиону Канады. В течение какого-то времени казалось, что Вашингтон был готов вести борьбу по этому вопросу, но здравый разум возобладал и привёл разум правительству США. Аляска - это наша, и с ней наше господство в Северной Америке гарантировано."

 #Anglo-Japanese Ties
 ukf.120.d: "Японская империя с момента ее восстановления в 1868 году быстро стала новой мировой державой, с которой можно считаться. Их неожиданное поражение Российской империи в начале этого столетия потрясло многие страны, но там, где другие оказались неверными, мы увидели потенциального нового союзника. Во время Великой войны японская империя помогла нашей стране победить немцев в Азии, и с тех пор мы поддерживаем тесные отношения с их нацией."
 ukf.121.d: "Сегодня Британская империя внесла щедрое предложение нашему правительству, предложив официально заключить союз между нашими двумя странами, присоединившись к АПИ, и тем самым мы, несомненно, приведем мир и стабильность в Азии."
 ukf.123.d: "Сегодня японский представитель в Лондоне подписал новый договор между нашими двумя странами, официально сделав их частью Имперского альянса защиты."

 #The Mountain Passes
 ukf.130.d: "Непал и Бутан уже давно находятся под нашим влиянием, начиная с дней Ост-Индской компании вплоть до сегодняшнего дня, однако в это время больших политических перемен она выглядит все более вероятным, что две горные страны отойдут от нашего влияния и перейдут к новым державам Китая и Японии. Мы не можем допустить, чтобы это произошло, их местоположение жизненно важно для защиты Раджа от иностранного вторжения или влияния на всей территории Китая. Оно также обеспечивает идеальную оборонительную границу против китайцев, если они предпочтут поставить свои достопримечательности на наши индийские владения. Поэтому мы должны определить наилучший курс действий в отношении горного прохода, взять ли мы под свой непосредственный контроль или закрепить наше влияние, с тем чтобы его нельзя было оспорить?"
 ukf.131.d: "Британцы доставили нам ультиматум: стать официальным протекторатом своей империи или лицом к лицу с ними на поле боя. Их сила ошеломляет, и их число превышает нас в абсурдных масштабах, но если мы воспользуемся нашей местностью, мы можем просто удержать их достаточно долго, чтобы сохранить наш суверенитет."
 ukf.132.d: "Непальцы приняли наш ультиматум и официально стали протекторатом, радуясь, что наше влияние расширилось!"
 ukf.133.d: "Бутан принял наш ультиматум и официально стал протекторатом, радуясь, что наше влияние расширилось!"
 ukf.134.d: "Непальцы отказались от нашего ультиматума, чтобы стать нашим протекторатом."
 ukf.135.d: "Бутан отказался от нашего ультиматума, чтобы стать нашим протекторатом."
 ukf.136.d: "Британия потребовала, чтобы мы стали официальной частью Раджа, и мы не можем надеяться победить их в войне, но с хорошим использованием нашей местности мы можем надеяться причинить достаточно ущерба, чтобы заставить их сдаться и принять наш суверенитет."
 ukf.137.d: "Непальцы приняли наш ультиматум и официально стали частью Раджа, радуются, что наше влияние расширилось!"
 ukf.138.d: "Бутан принял наш ультиматум и официально стал частью Раджа, радуясь, что наше влияние расширилось!"
 ukf.139.d: "Непальцы отказались от нашего ультиматума, чтобы стать частью Раджа."
 ukf.140.d: "Бутан отказался от нашего ультиматума, чтобы стать частью Раджа."

 #Cape to Cairo
 ukf.150.d: "Сесил Роудс, амбициозный британский бизнесмен, известный империалист и человек, который в 1888 году ввел границы колонизации, создав Британскую компанию Южной Африки. Эта компания продолжала бы создавать колонии Родезии и управлять землями Бечуаналенда до сих пор. Великий человек, триумфальная воля и национальная гордость которого привели его глубоко в сердце Африки с целью расширить британский контроль над районами, которые он изучал. Это благодаря ему мы являемся крупнейшей империей, которую когда-либо видел весь мир. Ни одна из его величайших амбиций не была идеей о мысе до Каирской железной дороги, и хотя эта идея так и не была реализована за всю свою жизнь, она была реализована. Поскольку первые поезда отошли от мыса в своем великом путешествии по Тёмному континенту, величие Сесила Родса было запомнено всеми на его ребюрийской церемонии в Лондоне. Он был очарован большой честью, и многие великие гости, включая самого короля, который лично выступал с речью о важном значении Родеса для британской работы."

 #Mesopotamia
 ukf.160.d: "Регион Месопотамия является следующим ступенем в проекте &lt; &lt; Мыс -- Сингапур &gt; &gt; , их земли имеют жизненно важное значение для соединения Кувейта и Калькутты с линией, они также располагают большими запасами нефти, и благодаря недавней нестабильности в регионе мы можем воспользоваться этими потрясениями и потребовать, чтобы они подчинились нашему правлению. &lt; &lt; Иракская нация &gt; &gt; -- это новое творение, и поэтому можно сомневаться в том, что кто-то пропустит их в случае их исчезновения."
 ukf.161.d: "Из-за недавней нестабильности в нашей стране нам, возможно, было бы разумно принять и ввести более стабильное – если бы британское – правительство."
 ukf.162.d: "Ирак согласился стать нашим протекторатом, и теперь мы можем продвинуться вперед в Персию."
 ukf.163.d: "Ирак отказался от нашего предложения стать протекторатом, нестабильность в регионе будет продолжаться и, как он это сделает, заблокирует наши амбиции и наш путь к Персии."

 #Securing Persian Oil
 ukf.165.d: "Персия является важным воротам между Ближним Востоком и индийским субконтинентом, где также находятся некоторые из самых богатых нефтяных месторождений мира, нефтяных месторождений, которые должны находиться под контролем англо-персианского народа, однако из-за недавних политических махинаций в Персии наш контроль является предметом серьезных споров, поэтому мы должны сами вмешаться и взять под контроль ситуацию, поскольку иранцы явно этого не сделали."
 ukf.166.d: "Британия потребовала, чтобы мы стали протекторатами, и, разумеется, такая нелепая просьба должна быть отклонена."
 ukf.167.d: "Персия согласилась с нашими требованиями и стала протекторатом под нашим контролем."
 ukf.168.d: "Персия отвергла наше великодушное предложение стать протекторатом, мы не позволим им оставаться безнаказанными, мы должны обеспечить справедливость и проложить путь вперед для нашей железной дороги, ничто нас не остановит!"
 ukf.169.d: "Сегодня британский представитель в Тегеране выступил с суровым предупреждением для нашего правительства: они угрожали нашей стране войной, если мы немедленно не уступим нашему южному побережью под свой контроль."
 ukf.170.d: "Угрожая войной, на их плечах лежит серьезная угроза, персидское правительство видит разум и уступает свою южную береговую линию нашей нации."
 ukf.171.d: "Похоже, что есть только один хозяин персидского правительства; безумие, как сегодня персидские официальные лица в Лондоне отвергли наше требование уступить нашему народу свое южное побережье."

 #Finish the Great Game
 ukf.180.d: "С начала 19-го года отношения между нами и русскими в Центральной Азии граничат с враждебными странами. Оба наших государства пытались оказать свое влияние на регион, в том, что стало известно как Великая Игра. Русские стремились завоевать больше земель для своей империи, в то время как мы были заинтересованы лишь в защите нашей индийской территории. Сегодня только одна нация остается независимой между нашими двумя нациями; Афганистан. Хотя мы и были полезны в качестве буфера между собой и безбожными коммунистами, которые сегодня контролируют бывшую Российскую Империю, настало время поставить Афганистан под наш прямой контроль, чтобы создать сильную защиту от советской угрозы со стороны Севера. Сомневаюсь, что правительство Афганистана примет наше щедрое предложение, поэтому мы должны быть готовы к войне с их нацией."
 ukf.181.d: "Сегодня британский представитель в Кабуле потребовал, чтобы наша нация стала протекторатом Британской империи из-за угрозы, создаваемой Союзом Совитов нашему Северу."
 ukf.182.d: "Похоже, что их страх перед Советами сильнее, чем мы думали в первый раз."
 ukf.183.d: "Похоже, что наша подготовка к войне с Афганистаном была благоразумной, поскольку сегодня афганское правительство отвергло наше предложение стать протектором Британской империи, и, похоже, нам придется защищать их не только от Советов, но и от самих себя."
 ukf.185.d: "Существование транскаспийского правительства в Центральной Азии началось только в последние годы гражданской войны в России и с тех пор остается относительно невредимым, несмотря на внутренние политические потрясения."

 #Portuguese Civil War
 ukf.195.d: "Силы португальских монархистов успешно вытеснили своих республиканских оппонентов с материковой территории Португалии почти год назад, вынуждая республиканцев покинуть Португальскую Африку. Несмотря на то, что ни одна из сторон не имела возможности начать вторжение на территорию другой страны, это было до недавнего времени. Несмотря на то, что португальские монархисты укрепили власть на материке, они возобновили кампанию против своих республиканских врагов, обещая освободить всю территорию Португалии."

 #Monroe Disputes

 ukf.210.d: "Как стало известно из Лондона, британское правительство в настоящее время занимается подготовкой нового политического заявления в отношении своих иностранных целей на Американском континенте, которое было подтверждено британским послом в Вашингтоне только сегодня утром, мы узнали, что Лондон намерен осудить доктрину Монро и информировать наше правительство о том, что он "стремится к дипломатическим целям с любой страной на Американском континенте, независимо от чувства Америки к империализму в Северной и Южной Америке"."
 ukf.211.d: "Сегодня утром американский посол в Лондоне направил нашему правительству записку, в которой заявил, что запланированное нами расширение дипломатического влияния на Американском континенте неприемлемо, утверждая, что наше правительство имеет отвратительные интересы и планирует вновь привлечь к себе империализм на Американском континенте, они заявили, что эта новая политика не останется без ответа. Хотя мы и ожидали ответа от американцев в этом вопросе, следует отметить, что это не что иное, как основное предупреждение, а не угроза вооруженного конфликта в отношении нашей политики."
 ukf.212.d: "Вчера вечером министр иностранных дел Соединенных Штатов созвал нашего посла в Вашингтоне для участия в заседании за закрытыми дверями, посвященном нашей недавней внешней политике в отношении доктрины Монро и Америки в целом."
 ukf.213.d: "Несмотря на наше предупреждение, направленное Вестминстеру нашим послом в Лондоне, нам еще предстоит получить от британского правительства какой-либо ответ по этому вопросу, и, как представляется, британское правительство решило игнорировать наши интересы в Америке и открыто превозносить нашу власть в регионе."
 ukf.214.d: "Похоже, что здравомыслие покинуло залы Вестминстера, так как сегодня наш представитель в Лондоне был вызван министром иностранных дел британского правительства на закрытое заседание, недвусмысленно заявив, что британской империи не будет угрожать «ничего более, чем бывший колониальный» она воспримет любые угрозы силой как оскорбление достоинства британской нации и ее народа и, следовательно, ответит на них. Эти завуалированные угрозы со стороны британского правительства ясно указывают на то, что они не воспринимают наши предупреждения всерьез. Если мы хотим спастись в этом кризисе, то, возможно, нам придется последовать этим предупреждениям, хотя готовность Великобритании угрожать нашей нации войной свидетельствует об уровне готовности к прямому конфликту с нашей нацией."

 #Removing the Final Roadblock

 ukf.350.d: "Поскольку железная дорога мыса в Калькутту находится в процессе строительства, а прямая связь между нашими африканскими и индийскими колониями находится в безопасности, нам остается только один последний дорожный заграждение; Королевство Сиам."
 ukf.351.d: "Сегодня утром представитель Великобритании в нашей столице направил письмо нашему правительству, в котором он потребовал, чтобы мы стали протекторатом Британской империи «в интересах региональной безопасности»."
 ukf.354.d: "Вчера вечером представитель Великобритании в Бангкоке направил письмо нашему правительству, в котором потребовал немедленной передачи Кра-Истмуса под британский контроль, заявив, что в последние годы регион превратился в территорию, где повстанцы координировали нападения на британскую администрацию в Малайе, они утверждали, что наше правительство ничего не сделало для предотвращения этих нападений."

 #2GW Intervention

 ukf.4999.d: "Поскольку война вновь разорвала нашу территорию на европейском материке между Германией и Францией, наше правительство стало все больше беспокоиться о том, какие результаты войны могут означать для европейского статус-кво, и все чаще высказываются предложения о том, что для того, чтобы заявить о своей заинтересованности в послевоенном мирном процессе, Великобритания должна сама принять участие во второй Великой войне, хотя остается вопрос: какую сторону мы должны поддержать в этой новой войне?"
 ukf.5000.d: "Теперь, когда мы решили поддержать французское правительство в войне в Европе, мы должны решить, на каком уровне они должны получать поддержку. &lt; &lt; Те &gt; &gt; в нашем правительстве, которые все еще пользуются некоторыми изоляционистскими тенденциями, утверждают, что мы должны ограничить нашу поддержку Франции и послать им лишь партии оружия для оказания помощи в их борьбе, хотя те, кто больше обеспокоен тем, как выглядит Европа, в которой доминирует Германия, утверждают, что пришло время рассмотреть вопрос о оптовой интервенции против немецкой нации путем прямого объявления войны."
 ukf.5002.d: "Чуть больше месяца назад мы направили большую партию товаров французскому народу для оказания помощи в их войне с Германией, и, хотя помощь была высоко оценена французским народом, она до сих пор не увенчалась успехом в том, что касается обращения вспять войны, многие члены нашего правительства считают, что сейчас настало время для того, чтобы наша страна непосредственно вовлечена в войну против Германии."

 ukf.6000.d: "Теперь, когда мы решили поддержать правительство Германии против французов в нынешней войне в Европе, пришло время решить, какую поддержку мы им предоставим. Многие члены нашего правительства, которые боятся непосредственного вмешательства, предложили, чтобы мы отправили большую партию оружия и поставок немцам для оказания помощи в боевых действиях, хотя те более хаукишские члены парламента считают, что только непосредственное участие в этом конфликте может быть в конечном итоге направлено на устранение французской угрозы раз и навсегда."
 ukf.6002.d: "Прошло больше месяца с тех пор, как мы отправили оружие и поставки в Германию, и хотя они были получены грациосульно, они мало повлияли на саму войну."

 #Reform Entente
 ukf.5013.d: "Поскольку и мы, и Британская Империя во второй раз за менее чем сорок лет воевали с германской угрозой, политики по обе стороны Английского канала регулярно общаются как для координации наших военных операций против нашего общего врага, так и для того, чтобы оживить Констант Кордиале, который закончился несколько лет назад."
 ukf.5014.d: "По мере продолжения войны против немцев сотрудничество между нами и французами продолжается ежедневно. Для содействия созданию единого фронта против самой серьезной угрозы, с которой Европа столкнулась со времени Великой войны, французское правительство согласилось с нашим предложением о том, чтобы мы официально восстановили Констант Кордиале между нашими двумя народами. ~ ni new na na new rais from the Europe, в которой начинается окончание немецкой угрозы."

 #League of Nations
 ukf.6010.d: "В то время как наша славная война против Советов продолжается, мы нашли маловероятного союзника в Британской империи. В то время как в период Великой войны британское правительство вместе с Русской империей поддерживало относительно враждебные отношения с коллективистской угрозой, очевидно, рассматривая их как серьезную угрозу не только европейской стабильности, но и их влиянию в Центральной Азии. nn diplomatic cooperation между нашими нациями была ограничена из-за бедных отношений между нашими двумя нациями в первые годы этого десятилетия, хотя по мере того, как война продвигалась, британцы пришли к выводу, что, действуя сообща, мы можем нанести еще больший удар по нашим взаимным врагам. Как такие британские дипломаты в Берлине официально предложили сегодня утром создать союз между нашими двумя странами для противодействия растущей угрозе советской угрозы. Хотя некоторые в нашем правительстве считают, что такой союз абсолютно ненужн и возлагает вину на Британию за наши катастрофические потери во время Великой войны, некоторые начали видеть возможности того, что союз с Британией может позволить себе нашу нацию."

 oukf.1.d: "Самый старый союз на Земле существует между нашей справедливой нацией и Португалией, начиная с XIV века, когда наши две страны были тесно связаны друг с другом. Настало время вновь решить, как нам вести себя с португальцами; тема англо-португальских отношений была открыта для обсуждения в течение некоторого времени из-за характера правительства Португалии. В настоящее время у нас есть четыре варианта проживания Португалии: возобновление англо-португальского союза, давление на правительство с целью преобразования в более демократическую систему. В противном случае мы могли бы потребовать контроля над частью его африканского имущества, или мы могли бы предать 600 лет дружбы и подготовиться к войне с португальцами для продвижения наших собственных интересов."
 oukf.2.d: "Наш старейший союзник, Британия, вновь обратился к нам с предложением о возобновлении англо-португальского союза, существовавшего еще в 1386 году."
 oukf.3.d: "Британия, наш старейший и самый верный друг предал нас! Они выдвинули ряд требований о том, чтобы мы отказались от контроля над большей частью нашей африканской территории и передали его им, как нам пришлось в 1890 году, с тем, что сейчас является Родезией. Принятие их требований было бы унизительным, но у нас, возможно, нет выбора в этом вопросе."
 oukf.4.d: "Португальцы ответили на наши требования, отказались от них и начали пытаться избавиться от нашего влияния в своей стране. Их наглость должна быть наказана, ибо мы не будем так унижены!"
 oukf.5.d: "Португальский ответ на наше предложение о возобновлении союза был встречен шоком, они отказались от нашего предложения и отвернулись от 600 лет дружбы; однако мы должны уважать их решение, это их потеря, а не наша."
 oukf.6.d: "Недавно мы сделали любопытное открытие, что британское посольство и другие видные англичане в нашей стране начали пытаться распространять идеи демократии и разжигать волнения среди нашего населения."
 oukf.7.d: "Наша кампания по установлению демократии в Португалии продвигается вперед в течение последних шести месяцев, и сейчас она достигла такого уровня, когда мы наращиваем значительный уровень влияния внутри страны, давая нам возможность ускорить этот процесс, некоторые из более агрессивных членов нашего кабинета предлагают начать демократический переворот в Португалии, рискуя своей дружбой, чтобы распространить свет демократии, другие же утверждают, что это не может быть спровоцировано и, безусловно, потерпит неудачу, что приведет лишь к ненужным нагрузкам на наши отношения."
 oukf.8.d: "Прошло несколько лет с тех пор, как наше правительство стало бесспорным правителем Португалии, и с тех пор у нас было очень мало возможностей для открытого сопротивления нашему правлению, с тех пор как британское правительство начало оказывать влияние на нашу политику, несмотря на то, что резко усилилась критика нашего правления, и сегодня оно, как представляется, проявилось как открытые протесты на улицах Лиссабона. ~ Несмотря на то, что протесты начали быть маленькими, но с тех пор они раздулись экспоненциально, те, кого это касается, довольно агрессивно и открыто враждебно относятся к нашему правительству, даже сейчас они угрожают нашему правлению над Португалией. В предстоящие дни политика нашей страны может быть радикально изменена."
 oukf.9.d: "Наш демократический переворот в Португалии был потрясающим успехом, их авторитарный режим был свергнут, и воля народа будет услышана!"
 oukf.10.d: "Наша попытка переворота в Португалии была встречена неудачей, толпа продемократических протестующих не смогла выдержать силу португальской полиции, которая жестоко положила конец протесту силой, и такое вопиющее проявление авторитарной жестокости, несомненно, сохранит свет демократии в португальском населении, однако мы больше не можем поддерживать его."
 oukf.11.d: "Попытка демократического переворота в нашем правительстве недавно обнаружила, что она финансировалась британским богатством и влиянием."
 oukf.12.d: "После того, как наш переворот не привел к свободе Португалии, кажется, что наша роль во всем этом была раскрыта, португальцы обвиняют нас в том, что мы попираем их и наносим серьезный ущерб нашей международной репутации."
 oukf.13.d: "Гибралтар является одним из самых важных видов собственности, которыми мы располагаем, открывает путь для торговли в Средиземное море и предоставляет нам прекрасную основу для нанесения ударов по этому региону."
 oukfa.31.d: "Дания контролирует единственные два пункта военно-морского доступа в Балтийское море: Датские проливы и Кильский канал. Доступ в регион имеет жизненно важное значение для нашей торговли, и поэтому мы должны обеспечить влияние на Данию, чтобы защитить ее от растущих немецких и советских угроз. Несмотря на то, что у нас есть два варианта, когда мы имеем дело с датчанами, мы можем либо попросить их присоединиться к нашему Альянсу международной защиты, защищая их от любой внешней угрозы, либо мы можем потребовать, чтобы они подписали Лондонский военно-морской договор, что означает, что наше влияние на страну было бы почти абсолютным."
 oukfb.31.d: "Дания контролирует один из двух морских переходов в Балтийское море: Датский пролив. Доступ в регион жизненно важен для нашей торговли, и поэтому мы должны обеспечить влияние на Данию, чтобы защитить доступ от растущих немецких и советских угроз. Несмотря на то, что у нас есть два варианта, когда мы имеем дело с датчанами, мы можем либо попросить их присоединиться к нашему Альянсу международной защиты, защищая их от любой внешней угрозы, либо мы можем потребовать, чтобы они подписали Лондонский военно-морской договор, что означает, что наше влияние в стране было бы почти абсолютным."
 oukf.32.d: "Сегодня с просьбой нашего правительства прибыл британский эмиссар. Они просят подписать Лондонский военно-морской договор, который был создан Великобританией в 1924 году для укрепления своего влияния во многих странах по всему миру. Этот договор подразумевает заверения Соединенного Королевства в том, что они защитят нас от любой внешней угрозы, в обмен на то, что мы склонимся к их прихоти и резко ограничим масштабы нашего военного флота, что позволит англичанам осуществлять любой уровень контроля и влияния в нашей стране. Несмотря на растущую угрозу, создаваемую валькистами на юге и коммунистами на востоке, подписание этого договора может быть нашим единственным способом выжить в грядущем шторме."
 oukf.33.d: "Наше любезное предложение датчане присоединиться к Лондонскому военно-морскому договору было отвергнуто! Многие в нашем правительстве призывают нас принять меры против такой наглости – особенно с учетом того, насколько жизненно важной является Дания для обеспечения безопасности Северного моря. На самом деле, Королевский флот сообщил нам, что существуют планы полной блокады Дании, а затем и Балтийского моря. Хотя такой шаг является смелым и, безусловно, вызовет серьезную международную реакцию и возможную эскалацию, наш флот по-прежнему остается непримиримым, и поэтому любая попытка сломить блокаду силой может быть легко остановлена. На прошлой неделе в Общинах бушуют ожесточенные дебаты о том, что делать в этой ситуации, и сегодня необходимо принять окончательное решение."
 oukf.34.d: "Невероятно, что британцы действительно отреагировали на наш отказ от своего нелепого предложения. В абсурдной трате времени и ресурсов они послали Королевский ВМС – крупнейший ВМС мира – блокировать нас?!! Даже не только наш народ блокирует, это все Балтийское море! Они выдали нам ультиматум, сдались британским требованиям и присоединились к своему военно-морскому договору или столкнулись с блокадой. Такое абсурдное злоупотребление их властью уже привлекло международное внимание, как французы заверили нас, что они сделают все, что в их силах, чтобы защитить нас в случае необходимости."
 oukf.35.d: "Даты сложили наши силы, наша блокада была потрясающим успехом, и датчане согласились подписать Лондонский военно-морской договор, поставив их там, где мы хотим, под наше абсолютное влияние. Доступ к Балтии защищен, валькизм или коммунизм больше не будут угрожать Северному морю!"
 oukf.36.d: "Английская блокада Балтийского моря зашла слишком далеко, и датчане обратились к нам за поддержкой. Мы не можем допустить, чтобы на европейском континенте безжалостная империализм и проекция власти не оправдались; мы, конечно, будем поддерживать датчан и разработали план нападения, чтобы разрушить блокаду. Очевидно, мы не можем полагаться на наш флот для того, чтобы сломить блокаду, какой бы сильной она ни была; поэтому мы будем использовать наши военно-воздушные силы для того, чтобы выжить сверху, используя датские аэродромы в качестве перспективного пункта. Никакая атака не начнется следующим образом: первая фаза является массовым нападением истребителей для обеспечения безопасности воздушного пространства для остальной части операции. Вторая фаза будет состоять из волн военно-морских бомбардировщиков, которые поражают и, как мы надеемся, разрушают малые корабли Королевских военно-морских сил, с тем чтобы уменьшить их число. Заключительная фаза, третья фаза, будет состоять из волн бомбардировок бомбардировщиков-бомбардировщиков, чтобы нацелить и крушить эти корабли Королевского флота. Этот план, несомненно, является амбициозным и может, но мы надеемся, что это нападение запугнет Королевский флот и утает их в их в их собственную пышную сферу, если мы окажем, что в то самое огромное влияниее, в то, что в то в этом крайнемеееее и в будущем!"
 oukfa.37.d: "Наши военно-воздушные силы сообщили сегодня, что тщательно продуманный рейд «Аальборг» с целью расколоть блокаду Королевского флота провалился. Многие наши самолеты были сбиты, и многие хорошие люди погибли, почти ничего не делая британским силам, и блокада продолжается. ~ nn/Мы будем оказывать помощь Дании, если в этом возникнет необходимость, и мы уже выразили дипломатический протест против англичан в надежде, что за этим последуют другие. Однако этот рейд был слишком долгим в то время, когда нам пришлось подготовиться. Все, на что мы можем надеяться, так это то, что датчане не сдадутся такой дипломатии."
 oukfb.37.d: "Сегодня наши военно-воздушные силы сообщили, что наш блестящий налет на Аальборг прошел так, как и планировалось! Королевский флот был разорван и вернулся к безопасности английских вод, в то время как многие самолеты и люди были потеряны на нашей стороне, Королевский флот потерял гораздо больше, когда многие из их кораблей были повреждены и несколько затонули."
 oukfb.38.d: "Согласно сообщениям Королевского ВМС, сегодня они подверглись тяжелому воздушному нападению у побережья Дании в Аальборге. Некоторые суда были серьезно повреждены, причем некоторые из них даже были затоплены или сбиты, и многие из наших хороших людей были тяжело ранены или убиты в результате нападения. Поврежденным кораблям было приказано вернуться в Скапа-Флор на ремонт, когда по пути они заметили обломки спущенного самолета. Пилот был все еще жив, плавал отчаянно до того, как его захватили. Он был французским, как и его самолет. Поэтому у нас есть один вывод о том, кто стоит за этим нападением, и мы снова оказались в противоречии с нашими старыми соперниками."
 oukfa.38.d: "Согласно сообщениям, сегодня у побережья в Аальборге Королевские военно-морские силы подверглись интенсивным воздушным нападениям, ни один из наших кораблей не пострадал слишком сильно или не был затоплен, но некоторым из них было приказано вернуться в Скапа-Флоу для ремонта и проверки. Несмотря на огромный характер нападения, комбатанта еще не опознали. Дания не имеет достаточно больших воздушных сил для проведения такой операции, поэтому представляется вероятным, что за этим нападением стояла иностранная держава. Учитывая наши развращенные отношения с континентальной Европой, это может быть любой из них или многие из них. Несмотря на нападение, которое нам удалось уничтожить многие вражеские самолеты, и поэтому мы послали небольшие флотилии, чтобы найти любые самолеты или пилоты, которые выжили, чтобы опознать виновное лицо. Тот, кто стоит за этим нападением, является по-настоящему трусливым государством, не имеющим ни кишек, ни силы открыто оспаривать нашу гегемонию."
 oukf.39.d: "По возвращении в Scapa Flow на ремонт один из наших кораблей заметил спущенный самолет после рейда, произошедшего ранее на этой неделе. Скаутская группа была отправлена с корабля, чтобы найти какие-либо следы выжившего, к сожалению, никто не был найден. Однако было обнаружено что-то более интересное, этот вид самолета. Это французский торпедный самолёт и идентичен тому, кто сбил блокирующие корабли, что означает, что за нападением может стоить только одна нация. Мы должны теперь решить, как ответить, поскольку мы поймали французскую красную руку. Королевские ВМС ожидают наших приказов, и некоторые в Высшем командовании предлагают атаковать или запугать французский флот из порта. Однако многие из тех, кто находится в правительстве, предполагают, что мы просто ввели эмбарго на французов, так как они сильно полагаются на наши импортные товары и могут умереть от голода. Оппозиция в Общинах, а также Доув в нашем собственном кабинете, все еще призывает нас призвать к блокаде – но мы слишком далеко зашли назад."
 oukf.40.d: "Несмотря на то, что наш &quot; Аальборг Рэйд &quot; является огромным успехом в борьбе против les Rosbifs, британское правительство в последние дни сделало большое представление о том, что, по их словам, международное сообщество является неоспоримым доказательством того, что французская нация стояла за нападением, их &quot; неприкосновенность &quot; - это обломки нескольких наших самолетов, самолетов, которые были спроектированы и изготовлены только во Франции и только пилоты французских пилотов. - Несмотря на то, что мы ждали некоторое время, чтобы выяснить, что британцы сделают в ответ, сегодня утром они объявили о своих намерениях. &quot; Британская империя &quot; ввела полное эмбарго на нашу страну."
 oukf.41.d: "Сегодня утром, в 5:34, французский флот у побережья Мерса Эль-Кебира был атакован неизвестными войсками, состоящими из множества кораблей, военно-морские бои произошли в течение нескольких часов, оставив множество кораблей уничтоженными и еще более мертвыми. Несмотря на то, что наши патрули осматривали этот район после боя в поисках улик о характере нападавших, мы обнаружили недавно разгромленное судно класса "Уничтожить". Это судно было опознано Центральным бюро разведки и операций как судно HMS Bulldog вскоре после того, как разрушитель, ранее входивший в состав Королевского флота."
 oukf.42.d: "Разведывательные сообщения с берегов Дании сообщили сегодня утром, что Королевский ВМС отступил обратно в порт на материковой части Британии после их короткой и в конечном итоге безуспешной блокады. Ясно, что блокада была прекращена после успеха Аальборгского рэйда, и хотя многие в нашем Гвенрменте предсказывали, что британское правительство либо в военном, экономическом, либо в дипломатическом отношении, британское правительство, очевидно, не имеет сил для серьезной конфронтации между собой и европейскими державами в настоящее время."
 oukf.43.d: "Взрывоопасные французы отказались поддержать нас перед лицом британцев, нам сейчас не хватает реальной международной поддержки и полной силы, не только Великобритании и Королевского флота, но и всей Британской империи."
 oukf.44.d: "Посольство Великобритании в Копенгагене сегодня предложило нам место в Союзе Императорской защиты, и вступление в этот союз официально поставит нас под их защиту от иностранных держав, но сильно разозлит немцев и французов, поскольку это придает Великобритании еще большее влияние на море. Они заверили нас в том, что их интересы состоят в сохранении Дании и демократии; однако решение о том, присоединяться ли к нему или нет, зависит от нас."
 oukf.45.d: "Наше посольство в Копенгагене информировало нас сегодня о том, что датское правительство отвергло наше предложение о создании альянса, хотя это будет означать, что мы не можем расширить наше влияние на Балтийское море, и что Дания по-прежнему находится под угрозой экстремистских держав, мы должны уважать суверенную волю другой нации."
 oukf.46.d: "В то время как Королевский ВМС отошел от вод вблизи Аальборга судна класса &lt; &lt; Разрушитель &gt; &gt; Королевского ВМС &lt; &lt; Амазонка &gt; &gt; обнаружил обломки большого числа французских самолетов, а также одного выжившего французского пилота. Несмотря на железное доказательство того, что Франция стояла за этим трусливым нападением, французское правительство отказалось признать утверждения об их причастности к нападению на Королевский ВМС, вместо того чтобы указывать на предыдущие примеры британского империализма и то, как европейская материковая часть не позволила бы Великобритании использовать свой ВМС для запугивания других стран."
 oukf.47.d: "Во время Великой войны Северная Атлантика была ключевым сражением в немецкой подводных лодочной кампании против нашей нации. Правительство Германии оказало весьма сильное воздействие в попытке задушить нашу страну, и хотя Адмиралтейство медленно узнало, что использование конвоей имеет важное значение для предотвращения потерь, сегодня это не является для них фактом, и не является для них проблемой, а также мощью подводных лодок. Несмотря на то, что Адмиралтейство усердно работает над тем, чтобы представить нашему правительству несколько планов, которые, как мы надеемся, окажут нам большую помощь в ликвидации подводных лодок в Северной Атлантике в любой будущей войне, в которой мы можем участвовать. Эти планы сосредоточены на использовании датского имущества Северной Атлантики для опоры наших собственных судов и предотвращения того, чтобы другие тоже делали это. У нас есть много вариантов в отношении того, как достичь этой цели, но в конечном итоге выбор остается за правительством."
 oukfa.48.d: "С учетом того, что британцы только недавно выдвинули требования к нашей нации, можно считать, что они воздержатся от этого в ближайшем будущем, однако это убеждение было разрушено сегодня утром. &quot; Британец &quot; в Копенгагене представил наше правительство с требованием полной передачи нашей североатлантической власти Британской империи в качестве средства &quot; обеспечения безопасности торговли в регионе и стабильности в Северной Атлантике &quot; . Наше правительство весьма возмущено этим требованием, и наши политики странно согласились с этой угрозой датскому суверенитету."
 oukfb.48.d: "С учетом того, что британцы только недавно выдвинули требования к нашей нации, можно считать, что они воздержатся от этого в ближайшем будущем, это убеждение, однако, было разрушено сегодня утром. &lt; &lt; Британец &gt; &gt; представил наше правительство своим требованием незамедлительно провести референдум в Исландии для определения будущего острова как независимого или как части нашей нации. &lt; &lt; Исландское национальное движение в последние годы набирает силу &gt; &gt; , и широко распространено мнение о том, что любой референдум по вопросу о независимости закончится для нас плохо. &lt; &lt; Следует также отметить, что наша разведывательная служба определила, что британское правительство оказывает влияние на главных исландских лидеров, призывающих к независимости, и что в случае победы на референдуме Исландия будет находиться под непосредственным британским влиянием и защитой. &gt; &gt;"
 oukfc.48.d: "В последние дни британский представитель в Копенгагене выступил перед нашим правительством по поводу соглашения, которое позволит Королевским военно-морским судам размещаться и перезаправляться в наших портах в Северной Атлантике, а также позволит британской армии разместить солдат для защиты этих уязвимых территорий. &lt; &lt; Британия &gt; &gt; утверждает, что обоснование этого предложения объясняется тем, что эти острова могут оказаться под оккупацией иностранных держав, враждебных их интересам. &lt; &lt; Многие в нашем правительстве весьма удивлены этим предложением, поскольку разрешение Великобритании размещать на этих территориях солдат и судов во многих отношениях равнозначно оккупации. &gt; &gt; ."
 oukf.49.d: "Наше недавнее предложение, направленное датчанам, было принято с их стороны, и, как представляется, они считают, что отказ нам в этой просьбе лишь усугубил бы ситуацию для самих себя."
 oukf.50.d: "Наша экономика во многих отношениях была разрушена блокадой, и если она не будет снята, то вскоре на наших улицах могут наблюдаться гражданские беспорядки."
 oukfa.51.d: "Датское правительство весьма мудро откликнулось на наше предложение снять блокаду их страны в обмен на их североатлантические территории."
 oukfb.51.d: "Представляется очевидным, что безумие полностью захватило датское правительство, поскольку оно полностью отказалось передать свои североатлантические территории в обмен на отмену блокады против своей нации."
 oukf.52.d: "Несмотря на то, что наши требования являются вполне разумными в качестве средства обеспечения стабильности и безопасности в Северной Атлантике, датское правительство считает необходимым полностью отказаться от наших требований."


 ukf.140.d: "С тех пор, как началась 20-я сессия Совета Безопасности, мы с немцами шли в логарифмах по поводу их военно-морской политики и их стремления преследовать заграничную империю в прямом соперничестве с нашей собственной. Когда Немецкая империя была расчленена после Великой войны, ее колониальные устремления прекратили существовать, и их флот был отплыт к Скапа-Флоусу, где она была разорвана немцами в акте неповиновения. С тех пор, как Германия постепенно восстанавливает свою промышленность и свой флот, без каких-либо навязок со стороны нашего правительства в отношении размера и состава их флота. По мере того, как Европа, и мир в целом стали ближе к войне, наше правительство решило, что пришло время решить вопрос о нашей конкурентоспособности с немцами раз и навсегда. Великий Адмиралтизм предложил, чтобы мы потребовали, чтобы германцы подписали соглашение с нашей военной силой, которое серьезно ограничит возможности будущей военно-морской гонки с нашей нацией. Это соглашение вряд ли будет подписано германами, если они не убедятся в том, что это соглашение не будет ратифицировано, что мы можем подготовиться к какому-то последнему договору с нашей армией."
 ukf.141.d: "В последние месяцы британская делегация в Берлине выступает против нашего правительства, пытаясь сгладить отношения между нашими двумя соответствующими нациями. Опасаясь еще одной морской гонки, подобной той, которая имела место до Вельткрига, британцы просили подписать с их нацией морской договор, который значительно снизит наши мощности по судостроению и ограничит нашу способность быстро производить новые суда. Это соглашение, на первый взгляд, кажется смешным, но британцы пришли к выводу, что если мы не подпишем соглашение, то они могут быть вынуждены взять дело в свои руки, чтобы не допустить конкуренции нашей нации в морях и океанах. Ничего страшного не может привести людей к безумии, и это, как представляется, имеет те же последствия для государств. Если мы намерены отказаться от британских требований, мы должны подготовиться к возможной войне."
 ukf.142.d: "Сегодня делегация Германии в Лондоне представила нашему правительству официальный ответ на наш предлагаемый военно-морской договор с Берлином, в котором она недвусмысленно заявила, что они не будут препятствовать развитию кригсмарин, с тем чтобы &quot; удовлетворить иллюзии Британской империи &quot; , и что наша нация не имеет права угрожать силой другим суверенным великим державам в Европе и во всем мире."
 ukf.143.d: "Сегодня наш представитель в Берлине завершил новые встречи с министром иностранных дел Германии по поводу предлагаемого Лондонско-Берлинского военно-морского договора, который недавно был предложен нашим правительством в качестве средства обеспечения мира между нашими двумя великими нациями. Министр иностранных дел Германии заявил, что, хотя германская нация и стремится к созданию сложного военно-морского флота с несколькими современными судами, по мнению правительства Германии, его не следует преследовать, если это означает, что война между Великобританией и Германией станет более вероятной."
 ukf.150.d: "С подписанием 8 апреля 1908 года соглашения о военном и экономическом доминировании Германии Французская Республика и Британская империя отбросили века соперничества, чтобы подготовиться к борьбе с более серьезной угрозой немецкого военного и экономического доминирования на континенте. Борьба Великой войны породила связь между нашими двумя нациями, но старые привычки умирали тяжело. В последующие годы мира Британская империя и Французская Республика вновь столкнулись за влияние за рубежом в колониальной Африке и Азии. Теперь без общего врага, чтобы связать их вместе, казалось, что все небольшие различия были значительно увеличены. Экономический бум 1920-х годов ощущался во всем мире, особенно в Империи. Франция, надеясь на то, что разделится в процветании, оказалась запертой Великобританией с высокими тарифами на свою страну в качестве средства обеспечения британского экономического доминирования. Поскольку французские противники в равной степени были возмущены попытками Франции доминировать на этом континенте и занять свое единственное положение в Европе. Британия, надеясь поделиться своими мотивами, увеличила размеры Королевского флота и пыталась остановить французской экспансии за рубежом."
 ukf.151.d: "После нескольких лет холодных обменов между нами и Соединенным Королевством британская делегация в Париже в последние недели пыталась быстро исправить отношения между нашими двумя странами. Опасаясь еще одного крупного конфликта в Европе, британцы дали понять, что они готовы поддержать нас по ряду важных вопросов, но ценой больших затрат. Подозревая наши намерения, поскольку мы продолжаем увеличивать размеры и изощренность Ла-Рояле, британское правительство стремится к определенности в отношении их будущего как единственного хозяина морей и океанов. В ответ они четко дали понять, что любое будущее примирение между нашими двумя странами потребует от нас гарантий того, что мы не расширим размеры наших ВМС и что мы будем устанавливать ограничения на строительство судов. Естественно, наше правительство весьма возмущено этими требованиями, однако британцы дали ясно понять, что если эти гарантии не будут получены, то они сочтут необходимым взять этот вопрос в свои собственные руки."
 ukf.152.d: "В качестве акта, который можно только назвать чистым безумием, французская делегация в Лондоне решительно отвергла наши предложения о переговорах по военно-морскому разоружению между нашими двумя странами в качестве средства разрядки любого потенциального кризиса в будущем."
 ukf.153.d: "После нескольких дней напряженных переговоров между нашим министром иностранных дел и его французским контрагентом сегодня утром между нашими двумя странами была заключена сделка относительно будущего размера и состава французских военно-морских сил. &lt; &lt; Кейнское соглашение &gt; &gt; ограничило возможности Франции производить на военно-морском флоте суда капитального класса и подводные лодки, вынудив их сосредоточить свое внимание на малых судах эскорта и модернизировать их существующие суда капитального класса. &lt; &lt; Хотя многие считали, что первоначально это соглашение будет отвергнуто &gt; &gt; , стало очевидно, что французское правительство серьезно обеспокоено нынешним развитием событий в Европе и что ограничение французских военно-морских сил является необходимой жертвой для обеспечения нашей поддержки в ряде важных вопросов на континенте и за рубежом."

 ukf.2000.d: "Изначально подписанный в 1928 году между Британской империей, Португалией и Греческой Республикой, Лондонский военно-морский договор был призван ограничить дальнейшие военно-морские гонки между странами, подобные разрушительной конкуренции между Королевским флотом и Кайсермариной, которая имела место до Великой войны. Хотя многие иностранные державы критиковали его как средство для навязывания нашей страной морского превосходства над другими странами, ЛНТ был полезен в обеспечении безопасности важнейших торговых путей по всему миру. Несмотря на то, что сегодня у нас есть благоприятное событие, наше правительство готовит к проведению в Лондоне в течение последних нескольких месяцев военно-морской конференции, в которой примут участие наши партнеры из Португалии и Греции. Эта конференция призвана не только дать возможность активизировать деятельность ЛНТ, но и заложить основы для будущего расширения. Важно, что мы начнем тесно сотрудничать с навигаторами этих новых участников, предоставляя некоторые существенные преимущества нашему военно-морскому флоту и нации. Это, безусловно, только увеличит число стран, которые мы можем «убедиться» подписать пакт. В интересах мира, конечно."
 ukf.2001.d: "В то время как Лондонский военно-морской договор был подписан между нашей нацией и Британской империей в 1928 году, он был недавно признан недействительным, поскольку официальное соглашение было рассчитано лишь на восемь лет. &lt; &lt; Британец Говермент &gt; &gt; организовал новую Лондонскую военно-морскую конференцию и пригласил наш народ принять участие в ней. Несмотря на то, что некоторые члены нашего правительства критикуют ЛНТ и его последствия для нашего потенциала в области строительства судов, этот договор поступил с некоторыми заверениями от Британской империи, которые мы можем счесть полезными в эти нестабильные времена."
 ukf.2003.d: "Греческие представители на Лондонской военно-морской конференции согласились на бессрочное продление Договора о военно-морском флоте между нашими двумя странами, и, как представляется, их забота о своей безопасности перед лицом угроз на европейском континенте перевешивает страх, что их военно-морские силы будут серьезно ограничены."
 ukf.2004.d: "Португальские представители на Лондонской военно-морской конференции согласились на бессрочное продление Договора о военно-морском флоте между нашими двумя странами, и, как представляется, их забота о своей безопасности перед лицом угроз на европейском континенте перевешивает страх, что их военно-морские силы будут серьезно ограничены."
 ukf.2010.d: "Сейчас, когда Лондонский военно-морской договор был вновь продлен между нами и другими государствами, настало время пригласить к нему дополнительных членов. Европа, возможно, является в данный момент самым нестабильным континентом в мире, и несколько государств боятся войны между собой и своими соседями, и поэтому они должны подойти к этим странам, пытаясь извлечь выгоду из их страха и заставить их присоединиться к ЛНТ. Конечно, чем лучше наши отношения с этими странами, тем больше вероятность того, что они согласятся с этим."
 ukf.2011.d: "С учетом того, что Лондонская военно-морская конференция состоялась совсем недавно, британское правительство обратилось к нашей стране с предложением официально присоединиться к Лондонскому военно-морскому договору, принятие этого соглашения серьезно подорвет нашу способность разрабатывать новые суда для нашего военно-морского флота, но оно также поставит нашу страну под британскую защиту, обеспечивая ее помощь в любой оборонительной войне, которую нам, возможно, придется вести в будущем."
 ukf.2020.d: "С учетом того, что новые члены регулярно присоединяются к ЛНТ, настало время для того, чтобы мы распространили свой взгляд на Азию, хотя в этом регионе мало стран, которые могли бы присоединиться к ЛНТ, обеспечение их присоединения поставит нас в положение твердой власти в регионе в будущем."
 ukf.2100.d: "Лондонский военно-морской договор расширился и охватил большое число стран мира, и, в свою очередь, наше влияние возросло. Настало время распространить этот договор на одного из наших великих европейских соперников, немцев. Мы признаем, что величайшей угрозой нашей гегемонии является расширение французского влияния по всему миру, и поэтому мы должны работать с немцами, чтобы вернуть французов на свое место. Однако это не означает, что мы и немцы - друзья – только союзники по обстоятельствам. Мы не можем допустить, чтобы немцы потратили это время на попытки бросить вызов нам и нашему военно-морскому флоту, мы должны навязать им военно-морский договор и не допустить расширения их флота и, в свою очередь, мы поможем им против французской угрозы."
 ukf.2101.d: "Сегодня утром британское правительство обратилось к нашей стране с предложением о сглаживании бедных отношений между нашими странами, а также установлении четких границ между нами в отношении будущего наших двух стран. В этой связи британцы предложили заключить военно-морское соглашение со своей страной, получившее название &lt; &lt; Ютландский пакт &gt; &gt; . Это соглашение серьезно затруднит наши усилия по созданию военно-морского флота, однако в ответ на это британцы воздержатся от вмешательства в наши дела в других странах и предоставят гарантии безопасности нашей нации."
 ukf.2201.d: "Сегодня утром представитель Великобритании в нашей столице обратился к нашему правительству с предложением Вестминстера. Несмотря на то, что в последние годы отношения между нашими двумя империями были разрушены из-за напряженности, британцы попытались сгладить это плохое положение дел, хотя их предложение оставило многие в нашем правительстве безмолвными из-за его наглости. ~ Не исключено, что британцы рассматривают наращивание военно-морских сил между нашими двумя странами как главную проблему, но предлагают подписать военно-морское соглашение с их нацией, названной «Пакт Дувра». Такое соглашение серьезно помешало бы нашим усилиям по производству морских кораблей в будущем, но привело бы к гарантиям безопасности со стороны Великобритании. Учитывая нестабильное положение дел как в Европе, так и за рубежом, некоторые члены нашего правительства считают, что соглашение может быть разумным подписать, по крайней мере сейчас."


 ukf.2250.d: "Сегодня утром министерство иностранных дел было уведомлено о недавнем выходе из Лондонского военно-морского договора, хотя причина их отъезда до сих пор неизвестна, многие подозревают, что это объясняется плохими отношениями с их нацией и нежеланием участвовать в дипломатическом соглашении с нацией, которую они плохо считают."

 ukf.2500.d: "Тесное сотрудничество с нашими друзьями только укрепит наши возможности по производству, поддержанию и инновациям на военно-морской арене."

 #Colonialism

 ukf.315.d: "Наше влияние в Тибете было довольно слабым, но в прошлом оно достигло точки, на которой мы нарисовали Макмахонскую линию и официально оформили границы Раджа, однако, поскольку китайцы и японцы продолжают расширять и бросать вызов нашему влиянию в Азии, важно, чтобы мы обезопасили границы Раджа и для того, чтобы надлежащим образом сделать это, мы должны обеспечить наше влияние в Тибете."
 ukf.316.d: "Британцы доставили нам ультиматум, они требуют, чтобы мы стали официальным протекторатом под их управлением."
 ukf.317.d: "Тибетцы согласились с нашими требованиями и стали нашим официальным протекторатом!"
 ukf.318.d: "Тибетцы отвергли наши требования и восстали против нашей воли, мы не можем позволить им остановить наши амбиции, даже если это означает, что они могут сдержаться силой!"


 ukf.350.d: "В то время как сиамцы были союзником нашей страны во время Великой войны, в последние годы они остыли в наших попытках улучшить отношения между нашими двумя странами, вместо этого они пытались вырезать нашу полную независимость от нашего влияния. Это неприемлемо. Несмотря на то, что мы хотим укрепить наше положение как Владыки Азиатского континента, тогда мы должны силой или каким-либо иным образом вывести сиамцев в ряд. Требование о том, чтобы они стали протекторатами, вряд ли будет принято, но мы можем также потребовать Кра-Истмус от их нации, полосу земли, которая может объединить наше бирманское и малазийское имущество."
 ukf.351.d: "Сегодня представитель Великобритании в Бангкоке опубликовал записку для нашего правительства. Они заявили, что ввиду растущей нестабильности как в Азии, так и во всем мире, было бы лучше, если бы наша нация стала протектором Британской империи, чтобы «обеспечить стабильность в Азии»."
 ukf.352.d: "Похоже, что сиамское правительство более умное, чем мы думали ранее, вместо того, чтобы воевать с Империей, они решили согласиться с нашими требованиями, став протекторатом."
 ukf.353.d: "Не удивительно, что сиамское правительство отказалось от нашего великодушного предложения стать протекторатом Империи."
 ukf.354.d: "Британская амбиция в Азии - это то, что наша страна знала много лет, но сегодня они установили новый рекорд в отношении того, как далеко они готовы пойти, чтобы обеспечить свое собственное владение Азией. Сегодня британский представитель потребовал Кра-Истмус от нашей нации, небольшой участок земли, который непосредственно связывал бы британские бирманские и малазийские колонии, хотя многие из наших людей по праву недовольны этим предложением, некоторые из нашего правительства считают, что это всего лишь небольшая цена за то, чтобы удержаться от перекрестных прихожестей Британской империи."
 ukf.355.d: "Сегодня сиамский представитель в Лондоне подписал новый договор между нашими государствами, который позволит им уступить Кра-Истмус под наш контроль."
 ukf.356.d: "Сегодня утром в сиамском посольстве в Лондоне наш министр иностранных дел завершил встречу с сиамским послом, где он получил решительный отказ от нашего требования уступить Кра-Истмус под наш контроль."

 ukf.370.d: "В то время как Китай в настоящее время разбит, его народ возмущает нас за столетие унижения. Если Китай попадет в руки другой великой державы или, что хуже, объединится, то он станет силой, с которой можно будет считаться, готовой напасть на нас с помощью духа мести. Мы не можем допустить этого."

 ukf.380.d: "Японская империя с момента ее восстановления в 1868 году быстро стала новой мировой державой, с которой можно считаться. Их неожиданное поражение Российской империи в начале этого столетия потрясло многие страны, но там, где другие оказались неверными, мы увидели потенциального нового союзника. Во время Великой войны японская империя помогла нашей стране победить немцев в Азии, и с тех пор мы поддерживаем тесные отношения с их нацией."
 ukf.381.d: "Сегодня Британская империя внесла щедрое предложение нашему правительству, предложив официально заключить союз между нашими двумя странами, присоединившись к АПИ, и тем самым мы, несомненно, приведем мир и стабильность в Азии."
 ukf.382.d: "Сегодня японский представитель в Лондоне подписал новый договор между нашими двумя странами, официально сделав их частью Имперского альянса защиты."
 ukf.383.d: "Несмотря на тесные связи между нашими двумя нациями, которые чрезвычайно важны для благополучия как Империи, так и Японии, японское правительство считает нужным отклонить предложение нашего союза."
 ukf.400.d: "Несмотря на наши тесные отношения с Японской империей, мы вновь заявили о нашей заинтересованности в обеспечении стабильности на Востоке, и наше правительство выдвинуло несколько предложений, первым из которых является предложение выкупить остров Тайвань у японского правительства, хотя такое предложение может показаться нежелательным для японцев, мы считаем, что мы можем успешно убедить их отказаться от острова под нашим контролем для обеспечения мира и стабильности в регионе."
 ukf.401.d: "Сегодня британское правительство обращается к нашему правительству с предложением купить остров у нас, с тем чтобы Королевский флот мог обеспечить торговлю в этом районе, несмотря на наши заверения в том, что мы можем справиться с этим делом сами, британское правительство существенно подтолкнуло этот вопрос, и, как представляется, если мы откажемся от него, наши отношения могут резко ухудшиться."
 ukf.402.d: "Японское правительство мудро согласилось на покупку Тайваня, и в ближайшие дни остров будет полностью передан под наш контроль."
 ukf.403.d: "Похоже, японское правительство считает нужным оскорбить нашу страну, отказываясь передать остров Тайвань под наш контроль."

 #####IMPERIAL COMMUNICATION EVENTS######

 emp.1.d: "На Имперской конференции в этом году было поднято много вопросов как властелином, так и в родной стране, одной из которых является вопрос о Имперской экономической политике, и, как представляется, политика империи в будущем была выбрана, и, как и ожидалось, мы получаем выгоды от этой политики и будем продолжать до тех пор, пока мы сохраняем верность Британии."
 emp.2.d: "Самой насущной проблемой на Имперской конференции в этом году является политика Великобритании в отношении империи и статуса Доминионов и колоний. Как и ожидалось, страна-мать решила добиваться статуса Ку и сохранить Империю в своем нынешнем состоянии, несмотря на многочисленные протесты и требования многих представителей Доминиона – особенно канадского представителя – о расширении автономии в соответствии с их жертвами во имя Империи."
 emp.3.d: "Мы знали, что продолжение этой политики не понравится многим владычеством, но мы никогда не ожидали такой вопиющей измены, как эта!"
 emp.4.d: "В ответ на наш отказ от статуса Ку Великобритания обратилась к нам с интересным и неожиданным предложением, предлагающим нам полный контроль над Ньюфаундлендским Доминионом в обмен на то, что мы отменяем наши предыдущие заявления относительно статуса Ку и остаемся в стороне от Империи в целом."
 emp.5.d: "Британцы отреагировали на наше отрицание политики статуса Ку и сообщили нам, что они никогда не вернутся в &quot; ужасную колонию &quot; . Ясно, что британцы заботятся только о своих собственных интересах, а затем о интересах своей Империи, мы можем только надеяться, что наши действия вдохновляют другие владычества надеждой и мужеством противостоять британцу и его угнетению!"
 emp.6.d: "Как мы и надеялись, канадцы не могли отказать в нашей сделке, обменивая Ньюфаундленд на свою верность."
 emp.7.d: "К нашему большому сожалению, канадцы отвергли наше любезное предложение об объединении между ними и Ньюфаундлендом."
 emp.9.d: "Сообщения колониальной администрации Индии указывают на то, что еще раз индийские повстанцы движутся по Дели, пытаясь свергнуть наших администраторов и полностью стереть наше влияние с субконтинента. Несмотря на наш отказ предоставить Индии более широкую автономию, эти повстанцы, вероятно, получат значительную иностранную поддержку со стороны стран, враждебных нашему присутствию в регионе."
 emp.10.d: "Самый важный вопрос, поднятый на Имперской конференции в этом году, - это вопрос о статусе Доминионов и колоний в Империи. Британия шокировала многих людей во всем мире, объявляя о своих планах дальнейшей децентрализации и усиления автономии ее различных владычества во всем мире. Родина наконец-то дает нам признание за наши жертвы во время Великой войны."
 emp.11.d: "По мере того как Индия вновь оказалась в ловушке общенационального восстания против британских сил, нам была предоставлена возможность помочь индейцам в их борьбе с британским угнетением."
 emp.12.d: "Сегодня утром помощь в виде оружия и поставок поступила от иностранного спонсора в поддержку нашего дела."
 emp.15.d: "Самый важный вопрос, поднятый на Имперской конференции в этом году, это вопрос о статусе Доминионов и Империи. На этот раз британцы предложили действительно огромные изменения в политике. Имперская федерация, состоящая из императорского парламента с избранными представителями от каждого Доминиона, в котором каждый Доминион контролирует свои внутренние дела, в то время как Федерация и Имперский парламент принимают решение о внешней политике и внешних делах Империи как единое образование. Это самый грандиозный план, который когда-либо предлагал Британец для Империи, и многие Доминионские парламенты уже выразили возмущение по поводу этого проекта."
 emp.16.d: "Если Доминион откажется от нашего предложения, то в предстоящие годы у нас будут возможности провести переговоры с их парламентом в попытке заставить их прийти к согласию."
 emp.21.d: "Имперская федерация - это поистине обширный проект, и как таковой для каждой участвующей страны требуется масштабная реконструкция. Кроме того, политические изменения в нашей стране будут велики, и поэтому мы должны построить новый Имперский парламент в стране, в котором будут размещаться наши имперские представители."
 emp.22.d: "Имперская федерация, к которой мы намерены стремиться, не будет легкой задачей, мы должны проявлять осторожность, с тем чтобы сохранить Доминионы на нашей стороне при создании фундамента для такой федерации. Поэтому крайне важно, чтобы мы приняли решение о работе Всевышнего Имперского парламента и о том, как лучше представлять Империю должным образом. nnDominion принятие предлагаемой Федерации, вероятно, будет в значительной степени зависеть от нашего выбора в этом вопросе, при этом система "первого поколения" будет рассматриваться как невыгодная выгода Соединенному Королевству за счет остальной части Федерации."
 emp.23.d: "Имперская экономика - это находка на мировой сцене, занимающая первое место в качестве Практикума мира, решение этой проблемы не только для нашей Империи, но и для мира в целом. Поэтому мы должны решить, как лучше завершить Императорскую экономическую политику в Федерации. Мы можем либо диктовать политику непосредственно из Лондона, либо позволить нашим Доминионам высказаться в Императорской экономике."
 emp.24.d: "Хорошо известно, что тот, кто контролирует армию, фактически контролирует нацию, и поэтому вопрос о том, кто будет состоять из высшего командования Империи, является предметом жарких дебатов с тех пор, как мы впервые предложили федерацию."
 emp.25.d: "Наши планы в отношении Императорской Федерации идут великолепно! Основная часть подготовки завершена или идет, все, что остается, это интеграция Доминионов в Федерацию – хотя работа не заканчивается на этом!"
 emp.26.d: "Работа имперской экономики будет обширной и сложной, каждый угол этой обширной Федерации потребует различных уровней финансирования для различных вещей, поэтому к нам обратилась группа экономистов в нашей стране с предложением создать центральный Имперский банк, что позволило бы имперской экономике беспрепятственно работать с каждым Доминионом, запрашивающим необходимые средства для некоторых проектов в этом банке, с любыми предложениями, требующими одобрения Имперского парламента, что позволило бы нам сохранить все огромные расходы наших Доминионов и обеспечить безопасность экономики, с тем чтобы предотвратить очередное событие в стиле Лондонского фондового рынка."
 emp.27.d: "Политическая ситуация в Федерации, вероятно, будет сложной сетью или партиями, идеологиями и политикой. С сегодняшнего дня многие Доминионы нашей империи имеют весьма различные политические ландшафты, и если это продолжится в Федерации, то наверняка вызовет большой конфликт в Имперском парламенте. С этой целью была разработана идея создания единой партийной системы, в рамках которой мы создадим филиалы основных британских политических партий в каждом Доминионе, с тем чтобы обеспечить такую согласованность и стабильность, в которой будет нуждаться эта Федерация."
 emp.28.d: "Наша Империя покрывает огромное количество поверхности Земли и содержит в ней огромный объем ресурсов, однако это не означает, что ресурсы Империи являются самыми дешевыми или предлагают самые привлекательные сделки другим членам Империи, и как таковые мы теряем огромные суммы дохода для иностранных государств в результате этого, мы должны проводить политику имперских предпочтений, когда речь идет о торговле, в которой цены на товары из других владений гораздо более привлекательны для других владений, чем иностранные товары из-за ряда тяжелых тарифов."
 emp.29.d: "Решая разрешить представителям Доминиона войти в наше военное высшее командование, крайне важно, чтобы мы обеспечили сплоченность и надлежащую организацию вооруженных сил, особенно если мы столкнемся с новым глобальным конфликтом, подобным Великой войне."
 emp.30.d: "Подготовка завершена, основа закончена, и мы готовы начать переход в Имперскую федерацию. То, что когда-то было нелепой мечтой о самом амбициозном империалисте, вскоре станет реальностью. Это поистине знаменательное событие для Великобритании и ее империи, но работа еще не закончена. Все, что остается, это уведомление Доминионов о том, что сейчас настало время для их окончательного решения по этому вопросу."
 emp.40.d: "Канада — это огромная площадка с огромными природными ресурсами, за ресурсами Британской империи мы можем превратить Канаду в реальный промышленный дом, и единственный вопрос заключается в том, как? Если мы потратим ресурсы на открытие новых заводов, мы сможем обеспечить, чтобы канадское производство стало завистью мира, и со всей этой пустой землей будет достаточно места для открытия новых заводов, особенно в регионах, где уровень безработицы выше."
 emp.41.d: "Несмотря на то, что Южная Африка никогда не была наиболее мирной или стабильной из имперских владычества, она имеет стратегическую ценность, а также большую нотариальную ценность. В 1838 году алмазы были найдены у реки Оранжевый, и с этим открытием Южная Африка стала гораздо более важным регионом. Но как нам обеспечить, чтобы мы взяли эти драгоценные камни? Некоторые говорят, что наиболее эффективным способом получения этих алмазов для них были бы не сами, а для того, чтобы обеспечить наличие надлежащих объектов для их обработки, как только они будут найдены. Эти новые фабрики также продемонстрировали бы добрую волю людям, которых король заботится об их благополучии. ~Нет другого варианта, который является очевидным, мы просто начинаем копать. Мы знаем примерно, где были найдены алмазы, и если мы расширим британские горнодобывающие корпорации в регионе, мы уверены в том, что мы сможем найти что-то под землей. Даже если не эти гамы, мы хотим, чтобы было много тяжелых металлов, которые можно было бы надлежащим образом обратить внимание на инфраструктуру региона. Хотя, конечно, не так, как непосредственно строительные фабрики или раскопки для гам, возможно, соединят к своему поселенскому обществу, и даже если бы они могли бы объединиться с его население."
 emp.42.d: "В то время как океанические доминоры в течение определенного времени были беднее, чем другие части империи, они в течение последних десятилетий были чрезвычайно богаты, не в значительной степени из-за постоянных инвестиций и иммиграции с островов. Однако еще многое можно сделать, и эксперты определили три способа, в которых мы могли бы сделать это. Несмотря на то, что некоторые члены правительства утверждали, что единственный эффективный способ повышения качества жизни в Океании будет заключаться в инвестировании в их сельскохозяйственный сектор и расширении его. Многие австралийцы и новозеландцы взяли на себя ответственность за то, чтобы зарабатывать себе на жизнь, если мы вложим деньги в эти сектора, они смогут увеличить производство, тем самым используя больше населения. Несмотря на то, что некоторые природные ресурсы должны быть найдены под океанической землей. Хотя нам может потребоваться некоторое время, чтобы найти их, если мы сделаем это, мы откроем совершенно новую форму бизнеса для австралийцев и кто знает, что, возможно, они найдут там что-то действительно полезное."
 emp.43.d: "Радж является и всегда был фантастическим коммерческим инструментом для Британской империи, посылая шелковые, хлопковые, красители, драгоценные камни, чай и специи в дальние районы империи для продажи за границу. Однако при создании роскошных ресурсов, которые мы оставили на пути, парламент предоставил нам средства для исправления этого положения, но к чему мы должны обратиться? Мы не можем попытаться создать больше заводов в преданных регионах Индии, что помогло бы с безработицей и могло бы привести к резкому росту в более практических отраслях, которые они могли бы затем использовать для финансирования своего собственного расширения в будущем."
 emp.50.d: "После многих лет политических беспорядков и межимперской дипломатии Вестминстер сегодня потребовал от нас официального и окончательного ответа на вопрос о Имперской федерации."
 emp.51a.d: "Канада откликнулась на нашу просьбу об окончательном решении относительно участия в Имперской федерации и согласилась стать членом Федерации в обозримом будущем."
 emp.51b.d: "Канада откликнулась на нашу просьбу об окончательном решении относительно участия в Имперской федерации."
 emp.52a.d: "Австралия откликнулась на нашу просьбу об окончательном решении относительно участия в Имперской федерации и согласилась стать членом Федерации в обозримом будущем."
 emp.52b.d: "Австралия откликнулась на нашу просьбу об окончательном решении относительно участия в Имперской федерации."
 emp.53a.d: "Новая Зеландия откликнулась на нашу просьбу об окончательном решении относительно участия в Имперской федерации и согласилась стать членом Федерации в обозримом будущем."
 emp.53b.d: "Новая Зеландия откликнулась на нашу просьбу принять окончательное решение относительно участия в Имперской федерации."
 emp.54a.d: "Южная Африка откликнулась на нашу просьбу об окончательном решении относительно участия в Имперской федерации и согласилась стать частью Федерации в обозримом будущем."
 emp.54b.d: "Южная Африка откликнулась на нашу просьбу принять окончательное решение относительно участия в Имперской федерации."
 emp.55a.d: "Ньюфаундленд откликнулся на нашу просьбу об окончательном решении относительно участия в Имперской федерации и согласился стать членом Федерации в обозримом будущем."
 emp.55b.d: "Ньюфаундленд откликнулся на нашу просьбу об окончательном решении относительно участия в Имперской федерации."
 emp.100.d: "Прошло несколько дней с тех пор, как парламенты Доминиона были официально распущены, и их представители заняли их место в Имперском парламенте в Лондоне. Всего несколько лет назад наша Империя была разделена, разрушена и находится на грани распада. Действия нескольких храбрых людей, которые пытались вернуть власть и стабильность империи, обеспечили нам, что мы снова станем властью, с которой можно считаться. ~ ~ ~ ~ Несмотря на нестабильность в конце, и народ Империи вновь объединится для достижения общей цели, мы будем вместе решать любые проблемы, которые нам предстоит решить в истории. ~ Хотя путь вперед будет непростым и полным рискам, мы можем взять на себя утешение в том, что мы столкнемся с ним не как с разделенной империей, а как с одной нацией с одной целью. Наш флаг будет поднят по всему миру, мы будем защищать свободу, где сможем, и мы будем обеспечивать мир на этой зеленой Земле. Мы не забудем вековую мудрость: «Мы стоим, разделимся»."
 emp.500.d: "С момента нашего объявления о создании имперской федерации Империя, казалось, стала более нестабильной, чем когда-либо прежде. В то время как правительства Доминиона, возможно, проявили интерес к этой Имперской Федерации, некоторые этнические группы в Империи возмущались возможностью. Большинство из них были возмущены тем, что Буры. С момента окончания третьей Бурской войны во время Великой войны Южная Африка жила в относительном мире и гармонии, и в то время, как боевые действия были жестокими, многие считали, что в стране происходит определенная степень примирения. Однако, предположим, сегодня один из них будет встречен только с насмешкой. . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . ."
 emp.501.d: "В то время как в Южной Африке мы связаны с бурами, некоторые видные индийские националистические политики, похоже, воспользовались этой возможностью, чтобы объявить полную независимость от Империи, заявив, что они не могут оставаться внутри империи, которая отказывается предоставить им большую автономию, они были вынуждены принять меры для защиты своей нации. Хотя восстание 35-го года было относительно спонтанным, сегодняшнее восстание, как представляется, является скоординированным делом с политиками и лидерами ополчения, действующими совместно, так как только Бирма и Цейлон остаются под нашим контролем с остальными нашими лояльными силами либо изгнанными из материковой Индии, либо временно арестованными новой индийской администрацией. / Несмотря на то, что этот план возврата назад в Индию для восстановления нашего правления уже давно не продлится, и некоторые из них заявили, что они будут поддерживать возвращение британского правления к субконтинентации в попытке стабилизировать регион. Кроме того, в то время как индийская материковая часть сегодня объединена под единым знаменем, Королевская разведка считает, что это не продлит долгое время, когда несколько небольших группировок уже готовы попытаться совершить побег от новой индийской нации."
 emp.502.d: "С нашей победой в изгнании британцев из Южной Африки и обеспечении контроля над большими участками бывшего Южноафриканского союза у нас сегодня есть возможность потребовать мира с британией."
 emp.503.d: "С учетом того, что наши военные были выброшены с нескольких территорий, которые ранее принадлежали Союзу Южной Африки, мятежные буры сочли нужным подать в суд за мир с нашей страной, они требуют, чтобы мы передали контроль над территориями Южной Африки под их контроль и вывели из региона все имперские войска."
 emp.504.d: "Британское правительство безрассудно отвергло наши требования к миру."
 emp.511.d: "Поскольку Британская империя вновь оккупировала еще одну бурскую войну, многие члены нашего правительства считают, что, посылая оружие и поставки бурам, мы можем увеличить их шансы на то, что они, наконец, вывезут британцев из Южной Африки."
 emp.512.d: "Сегодня утром прибыли французское оружие и принадлежности, чтобы помочь нам в нашей битве против англичан."
 emp.513.d: "Сегодня утром прибыли Немецкие Оружие и Принадлежности, чтобы помочь нам в нашей битве против англичан."
 emp.514.d: "Сегодня утром прибыли голландское оружие и предметы снабжения, чтобы помочь нам в нашей битве против англичан."
 emp.600.d: ""
 #####F L A V O U R EVENTS######

 ukflavour.1.d: "Когда канал Болтон-Манчестер вчера разорвал свои берега на Маленьком Левере, миллионы галлонов воды забросали 300 футов в реку Ирвелл, нанеся сотни тонн земли и камней."Like Niagara" was the description applied by one resident in the vicinity. Bricks and iron reinforcements of the side of the canal were torn away and carried into the river. Canal barges were smashed up as they too swept over the falls. Fortunately, there are no houses in the neighbourhood, and no one was hurt. It is feared that work at a paper mill and a chemical works which depend upon the canal for transport will be affected."
 ukflavour.2.d: "Знаменитая женщина-воздушная авиация, Эми Джонсон, вновь побила рекорд скорости полета из Лондона в Кейптаун и успешно вернулась к рекорду сегодня, когда она прикоснулась в Кейптауне к звуку огромной радости от толпы."
 ukflavour.3.d: "Hobbit, или Three and Back Again — детский роман, написанный автором J. R. R. Tolkien. Он был опубликован сегодня для широкого критического признания. Он продавался очень быстро и уже дико популярен из-за его фантазии и захватывающей истории. Он, несомненно, будет большим хитом в течение долгого времени!"
 ukflavour.4.d: "Сегодня утром мистер Алан Тьюринг опубликовал свою новую книгу «О вычислимых цифрах, с приложением к проблеме Энчейдунгов». Книга, которая быстро становится популярной среди тех, кто интересуется разработкой вычислительных машин, подробно описывает несколько «доказательств» — попытку разработки проекта «Энтчейдунгс вызов», вывод о том, что она не имеет решения. Хотя критики уже начали заливать книгу, многие считают, что это важный шаг вперед в нашем понимании вычислительных машин."
 ukflavour.5.d: "Оригинальный Крайстальный дворец был центром Великой выставки 1851 года в Лондоне, построенный в настоящее время в Кенсингтонских садах, это было удивительное сооружение, созданное на парке и все еще с множеством деревьев внутри. Мастерски спроектированное в стекле, железном и деревянном виде архитектором Джозефом Пакстоном, оно поражало тысячи посетителей выставки из этой страны и по всему миру и вряд ли могло бы быть более эффективной демонстрацией передовой британской технологии. Несмотря на то, что местный пёс прошёл мимо здания, он увидел пламя внутри здания, после того как он поспешно обнаружил двух ночных сторожей, пытавшихся потушить огонь. Несмотря на их смелые попытки, пожарная бригада была вызвана вскоре после этого. Даже тогда они не смогли успешно бороться с огнем, превратив его в инвелло. Несколько часов спустя сотни людей скопились, чтобы посмотреть спектакль, который продолжался до самого утра."
 ukflavour.6.d: "Замечательные результаты в цветном телевидении были продемонстрированы компанией &quot; Бэрд &quot; в театре Доминион, &quot; Тоттенхэм Корт Роуд &quot; в начале этого месяца. Демонстрация была поразительной по севеарламским путям, и она была первой в своем роде, в 1928 году, через мистер Бэрд показал картину нескольких дюймов квадрата в цвете на встрече Британской ассоциации в Глазго. Однако эта картина была передана телеграфом. Ннннн. В ходе этой последней разработки размер картины составляет 12 футов на 9 футов, а передача радио из Южной башни Дворца Кристал была расценена как предварительный эксперимент. Еще одна особая особенность демонстрации заключалась в том, что цвет является чрезвычайно хорошим и в целом более удобен глазу, чем последние цветные фильмы. Никакого утверждения о том, что это определение соответствовало стандарту обычных передач, не выдвигалось, и мистер Байрд ясно заявил, что это было расценено как предварительный эксперимент. И тем самым впечатляющим образом, и результаты являются неожиданными для тех, кто его видел."
 ukflavour.7.d: "Сегодня утром Телевизионная служба Би-би-си официально запустит из Дворца Александры. Она станет первой в мире регулярной государственной телевизионной службой, что позволит нам распространить влияние британских средств массовой информации на страны по всему миру. ~nnTwo системы, 405-линии Маркони-EMI и 240-линейной промежуточной системы Baird были испытаны в течение шести месяцев до сегодняшнего дня, чтобы определить, какая из них лучше всего подходит для продолжения телевизионной службы, и в конечном итоге была выбрана 405-линейная линия Маркони."
 ukflavour.8.d: "На протяжении последних двух лет на верфи Джона Брауна и компании в Клайдбанке, Шотландия, была проделана большая работа по разработке усовершенствованной версии RMS Queen Mary, океанического вагона, который только недавно совершил свое первое путешествие в мае 1936 года. ~nnnThe RMS Queen Elizable была разработана как значительно улучшенная версия своего сестринского судна с дополнительными палубными и грузовыми пространствами, а также увеличенными пассажирскими перевозками. Сегодня в полдень королева сама провела церемонию запуска и корабль был отправлен на установку."
 ukflavour.9.d: "Легендарный британский гонщик, г-н Джон Кобб, вновь установил новый рекорд скорости в Бонневилле сегодня."
 ukflavour.10.d: "Трагедия наступила сегодня в 12 милях от побережья Великого Орма, Лландудно, Уэльс. ХМС Тетис, проводивший морские испытания, безошибочно затонула в том, что, по мнению многих, было несчастным случаем. Предварительные расследования показали, что лук подводной лодки был затоплен морской водой, хотя пока нет никаких признаков того, как наводнилась подводная лодка. Потребовалось несколько часов до того, как телеграмма с сигнализацией прибыла на подводную лодку военно-морского флота в Портсмуте, и еще дольше, когда судно могло добраться до района для начала спасательных операций, поскольку ближайшее судно находилось в нескольких сотнях миль."
 ukflavour.11.d: "В течение последних нескольких лет лучшие доковые рабочие со всей империи сплотились в Скапа-Флоу, чтобы построить крупнейший в истории корабль HMS Trafalgar, который когда-либо был построен. Несмотря на то, что, как правило, скрытная, большая суета была сделана из конструкции этого судна, поскольку HMS Trafalgar предназначена для того, чтобы служить символом британского доминирования в военно-морском флоте. ~nnamed после нашей победы над смешанным французским и испанским флотом в Трафальгаре в 1805 году, эта дата с тех пор используется как историческая записка, ознаменовавшая начало нашего несопоставимого доминирования в военно-морском флоте. nnHMS Trafalgar будет служить не только символом нашей силы, но и напоминанием о том, что наша талассократия не может быть успешно оспорена."
 ukflavour.12.d: "В то время как жанр научной фантастики продолжает воображать население как Британской империи, так и всего мира, бурный автор из Соединенных Штатов сегодня завершил небольшую конференцию в Абердине, Шотландия, где он говорил долгое время о перспективах научной фантастики в будущем."
 ukflavour.30.d: "Сегодня утром, когда элементы британской армии сошлись на немецком укреплении, известном среди местных военных командиров просто как "Hill 415" - возможно, самая странная битва в войне до сих пор должна была начаться. Когда британские солдаты приблизились к крепости через толстый туман, рычащий от немецких линий, за которым следовали звуки бегущих шагов. Быстро стало очевидно, что позиция Германии отказалась от обороны и решила обвинить британских солдат, используя туман для прикрытия. То, что случилось дальше, было неожиданным для обеих сторон. Несмотря на то, что это началось с крушения и крика, как немецкий пехотник - топор в руке - установил оружие прямо между глазами испуганного британского солдата. Несмотря на то, что это произошло, офицер британской армии отдал приказ переключиться на военные сабры и втянуть врага в руки."
 ukflavour.40.d: "Сегодня утром правительство услышало славные новости об успешных военных вариантах захвата Парижа из-под французского контроля. Впервые со времен 100-летней войны британские войска успешно осадили Париж и захватили его во славу Британской империи. Несмотря на продолжение боевых действий на окраинах города, британский командующий быстро организовал военный парад с британскими войсками, марширующими под Арком де Триомфе, в то время как ужасные парижане смотрели на него. В то время как война с Францией, как ожидается, продолжит удар, нанесенный нашему сопернику сегодня, не может быть занижена."
 ukflavour.41.d: "Несмотря на то, что нам было отказано в Великой войне, сегодня мы отмечаем знаменательный день в нашей войне с немцем. Армия успешно захватила Берлин при поддержке Королевских военно-воздушных сил. Несмотря на то, что боевые действия вспыхнули почти сразу после того, как наши солдаты вошли в город, хотя этого недостаточно для того, чтобы задержать наше продвижение и захват важных памятников вокруг города. Немецкий фюрер, как утверждается, покинул город несколько дней назад, и его местонахождение неизвестно. Поисковые группы разошлись из города, пытаясь выяснить, куда он мог бежать. По мере продолжения войны с Германией всем как дома, так и за границей стало ясно, что у нас есть интимные в этой войне. Остается только один вопрос: насколько долго победа ускользнет от нас?"
 ukflavour.42.d: "Рим, когда-то столица, возможно, величайшей империи, которую когда-либо видел мир, попала под наш контроль. В последние дни храбрым солдатам британской армии удалось штурмовать город, хотя на улицах города продолжаются партизанские бои, когда упрямые итальянские защитники пытаются запугать наших солдат."
 ukflavour.43.d: "Константинополь, город Желаний мира, был успешно захвачен и оккупирован британскими солдатами. В течение долгого времени после завоевания империей Оттомании остатков Восточной Римской империи, Константинопольский Константинополь во многих отношениях был сигналом к пробуждению европейских стран и угрозой, которую создавала могущественная Османская империя. Несмотря на то, что он успешно оккупирован союзными силами во время Великой войны, оккупация должна была быть короткой. Сегодня оккупация Константинополя будет продолжаться бесконечно, по крайней мере до тех пор, пока турецкая нация не будет разрушена нашими вооруженными силами."
 ukflavour.44.d: "Сообщения из североамериканских фронтов показывают, что британские войска успешно захватили Вашингтон, округ Колумбия, от американских защитников. Упрямо защищённые десятками тысяч американских солдат, осада Вашингтона потребовала победы над всем оружием в вооруженных силах. Начиная с продолжительных воздушных бомбардировок укрепленных позиций по всему городу, сопровождавшихся аналогичной бомбардировкой со стороны Королевского флота, британские войска медленно передвигались по улицам DC, прежде чем, наконец, выгнать американских защитников. nn Clebrations были ограничены, так как американские партизаны почти сразу же начали атаковать британские конвои в регионе, а солдаты умирали от рук вооруженных гражданских лиц и солдат, прячась. В возмездии и вслед за войной 1812 года британские солдаты разграбили Белый дом и подожгли его в порядке мести. Блейз продолжался в ту же ночь, когда американские граждане смотрели в торжественной тишине. Война с американцами далека от конца, но наша победа в Вашингтоне посылала четкий сигнал правительству Соединенных Штатов; мы не должны быть расхвачены, и наша кампания будет продолжаться до полной победы."
 ukflavour.45.d: "Более 150 лет назад роковые события ныне известной Партии бостонского чая должны были поколебать нашу хватку на американском континенте до самого ее ядра, инициированной политическими протестующими, сегодня она считается важным событием в рамках американской революции и подталкивая других мятежников из 13 колоний к противодействию нашему правлению в регионе. ~ ~ Значение захвата Бостона является одновременно стратегическим, но также символическим. Во многих отношениях Бостон был началом конца нашего правления над 13 колониями, и сегодня он может ознаменовать собой начало возобновленного британского правления над Северной Америкой."
 ukflavour.46.d: "Сердце России и столица страны были захвачены за счет продвижения британских солдат. Ранее, оккупируемое Великой армией Наполеона после того, как российские войска разожгли ее, она с тех пор пришла укрыть коллективистов после русской революции. Несмотря на то, что дорога в Москву была застыла в борьбе и страданиях, многие десятки тысяч людей погибли, и многие из них, несомненно, пострадают до окончания этой войны. В настоящее время некоторые считают, что захват Москвы знаменует собой конец России и победу Великобритании над ними, другие шепчут, что они не ослабнут в войне, а русские в значительной степени не опасаются оккупации одного из их самых важных городов."
 ukflavour.50.d: "День Империи, который ежегодно празднуется со дня смерти Ее Величества королевы Виктории, вновь проходит. Широко признанный во всей империи, этот день представляет собой узы, связывающие Империю и тех, кто делает нас семьей. Наша общая история и наша общая культура, наше уважение к верховенству права и свободе, прежде всего!"
 ukflavour.60.d: "С недавним улучшением отношений между Германией и Великобританией открылись новые условия для взаимной оценки наследия Великой войны. С приходом годовщины перемирия и того, что в Британии является Дрезслером, Дрезслер воспользовался возможностью посетить Великобританию, чтобы отметить этот день, как это не отмечается в Германии. Дресслер встретился с британскими лидерами и ветеранами, и, достигнув Ценосаф, положил венок от имени Германии в память о том, что британская и немецкая война погибла в результате Великой войны. Несмотря на то, что этот визит не был бесспорным, а левые и антигерманские люди решительно выступили против визита, причем кандидат по труду пытался вандализмить немецкий венок, который был заложен Дресслером до того, как с ним разобралась полиция. Однако для многих в Британии этот визит знаменует новую главу англо-германских отношений с общим убеждением в том, что трагедия, которая была Великой войной, когда так много британцев и германцев отняли жизнь друг другу, никогда не должна повториться."
 ukflavour.61.d: "Теперь Черчилль заявил об угрозе, которую представляет для международного мира Германия, заявив, что мы должны достичь согласия между нами и французами, чтобы поставить Германию на место и остановить ее расширение. Черчилль заявил, что Дресслер, наряду с другими высокопоставленными валькистами, является сумасшедшим человеком, приверженным мировому доминированию. Несмотря на то, что его слова были популярны среди многих британцев, особенно среди крайне левых, среди сектантских интересов, и в более хакишских консервативных кругах. На международном уровне многие в нашем правительстве опасаются нанесения ущерба немецким отношениям, что это может привести к изоляции из-за наших враждебных отношений с Францией. Некоторые ставили под сомнение, однако, его причины для призыва к войне против Германии. Хотя он потратил первые 1920-е годы, требуя сокрушения социалистических интересов в России, теперь он заявил, что Германия и Валькизм являются величайшим врагом Европы. Было отмечено, что Черчилль, когда-то глубоко в долгах за азартные игры и в продаже дома семьи, получил большие платежи от членов группы под названием «Освободность»."
 ukflavour.62.d: "Кувейтская нефтяная компания, основанная в 1934 году в партнерстве с англо-персианской нефтяной компанией, получила концессию в Кувейте в 1934 году и начала бурение в 1936 году."

 #####FATE EVENTS######

 ukfate.1.d: "После веков соперничества, войны и разрушений мы наконец достигли того, что многие считали невозможным, полной оккупации французского материка. &lt; &lt; Британская армия &gt; &gt; триумфально передвигалась по равнинам Франции в своем неуклонном завоевании некогда смертоносного противника. &lt; &lt; Теперь нам предстоит решить судьбу Франции &gt; &gt; ."
 ukfate.2.d: "Сегодня мы отмечаем историческую победу над германской нацией во второй раз за менее чем три десятилетия. Сегодня победившие британские солдаты в предыдущей войне маршируют под Бранденбургскими воротами по улицам Берлина. С нашим великим триумфом над немцами остается вопрос: что станет с германской нацией?"
 ukfate.3.d: "Сегодня победоносные британские солдаты провели последний победный парад по улицам Рима, когда итальянское правительство подписало договор о безоговорочной капитуляции нашему правительству в начале этой недели."
 ukfate.4.d: "Прошло почти двести лет с момента нашего поражения в Американском восстании. С тех пор Соединенные Штаты стали чрезвычайно могущественными, но их сила не могла спасти их от нашей праведной мести. Британские войска уже проходят по улицам крупных городов Соединенных Штатов, как испуганные американцы смотрят в ужасе. ~Нет, сегодня мы отмечаем новый рост в истории нашей Империи; мы выиграли войну, теперь мы должны выиграть мир."

 #####OTHER EVENTS###### added by Drowse
 uk.3000.t: "Италия хочет купить Мальту"
 uk.3000.d: "Нация Италия, наш союзник во время Великой войны, предложила купить у нас Мальту. Мальта является британской территорией с 1814 года и служит нам, а также важной военно-морской базой в Медитерране. В любое другое время просьба о покупке Мальты была бы сразу же проигнорирована, но после того, как Лондонский рынок расколется, наша великая нация может пойти на пользу принять предложение Италии и инвестировать доход в другое место."
 uk.3000.a: "Александрия - лучшая военно-морская база."
 uk.3000.b: "Я бы предпочёл отдать Лондон немцам, а не Мальте итальянцам."

 uk.6000.d: "Сейчас мы стоим в одиночестве в Европе, с застоем по английскому каналу, немецкие сапоги захватили Москву, а теперь русские склонились перед немцами. В нашей нынешней ситуации мало надежды взять на себя германского зверя в одиночку, даже с нашей огромной империей. Мы, возможно, захотим подумать о достижении мира, чтобы мы могли эффективно бросить вызов немцам в будущем, если ситуация изменится."
 uk.6001.d: "Слабые британцы пришли к нам с мольбой о мире, поскольку превосходство немецкого оружия было ясно продемонстрировано нашим доминантом континента."
 uk.6002.d: "Немцы хоть раз увидели смысл, и теперь мы можем заняться восстановлением, подготовкой к тому времени, когда немцы будут слабыми..."


 #####0.2 EVENTS#####
 ukadm.1.d: "В течение пяти лет Достопочтенный Болтон Эйрес-Монселл служил первым Владыкой Адмиралтейства в нашем правительстве, хотя в течение последних нескольких месяцев он заявлял правительству, что он хочет уйти со своего поста, ссылаясь на плохое здоровье, только на участие, когда это необходимо, в задворках парламента. Несмотря на то, что нам предстоит определить, кто заменит Виконта в качестве первого лорда Адмиралтейства, и есть несколько вариантов, которые мы можем сделать. Несмотря на то, что сэр Уинстона Черчилля вновь ввели в состав правительства. Несмотря на его неудачу в Дарданелле во время Великой войны, неспособность которой привела к отмене его мозгового ребенка, предлагаемая кампания Галлиполи - Церковь сумела остаться в политическом положении, но едва ли, используя его влияние с несколькими высокопоставленными членами Королевского ВМС, сохранить свою значимость, вместе с его связями с хорошо финансируемой группой Фоксов. Второй мы имеем Лео Амери, предыдущего первого лорда Адмиралти в 1920-х, и видим, что в качестве надежного кандидата на выбор Д."
 ukadm.2.d: "Хотя британское общество с тех пор, как произошло забастовка в Манчестере-Милле, было относительно покорным, в нескольких кварталах Британии имели место беспорядки. Сегодня мы получили сообщения о широкомасштабном инакомыслии в рядах Королевских ВМС относительно запланированного сокращения их заработной платы и общего финансирования. В частности, утверждается, что такое несогласие исходит также от некоторых адмиралов, которые утверждают, что Королевский ВМС больше не сможет надлежащим образом защитить нашу Империю, если эти сокращения будут продолжаться."
 ukadm.3.d: "Удивительно, что многие моряки, дислоцированные в Инвергордоне, сегодня начали забастовку против правительства из-за сокращения их заработной платы, а также из-за более широкой политики жесткой экономии, проводимой нашим правительством в ответ на последствия ЛМСК."
 ukadm.4.d: "Сейчас, когда наше правительство приняло решение проводить агрессивную политику в отношении забастовщиков Королевского флота, с тем чтобы сорвать забастовки и заставить этих людей отступить, однако первый морской повелитель Адмиралтейства, а также несколько адмиралов Королевского флота выразили обеспокоенность по поводу того, каким образом правительство намерено прекратить забастовки, и многие из них предупреждают о том, что это приведет лишь к серьезному разжиганию всей ситуации."
 ukadm.5.d: "С учетом того, что наше правительство пыталось решительно продвинуться вперед, чтобы подавить удар моряков Королевского военно-морского флота, некоторые считали, что это был лишь вопрос времени до того, как вся ситуация разруха. Поэтому, когда события сегодняшнего утреннего дня произошли, это повлекло за собой небольшое число неожиданных попыток правительства проигнорировать проблемы, связанные с сокращением финансирования военно-морских сил, забастовщики, по всей видимости, успешно убедили многих своих товарищей присоединиться к их усилиям, и сегодня утром несколько судов были полностью лишены экипажа в Инвергордоне, поскольку большинство из них присоединились к забастовщикам в знак протеста против политики правительства."
 ukadm.6.d: "Первый лорд Адмиралтейства Альфред Дафф Купер встретился с первым морским лордом, и сегодня утром различные адмирали вызвали в столицу для обсуждения текущих событий в Инвергордоне. Купер был избран первым лордом Адмиралтейства из-за его надежности и значительных связей и влияния в Королевском военно-морском флоте, которые он установил в межвоенные годы, работая под руководством предыдущего Первого Владыки Адмиралты Болтона Эйреса-Монселла. Несмотря на некоторые вопросы, поднятые в отношении того, где находится его лояльность, поскольку в прошлом он проявлял благосклонность к вооруженным силам, выступая против правительства в связи с запланированными сокращениями расходов британской армии и Королевских военно-воздушных сил."
 ukadm.7.d: "На встрече между Купером и адмиралами Королевского ВМС многие вздохнули с облегчением, поскольку, как оказалось, между ними была заключена сделка. Многие не ожидали, что адмиралы будут - вместо того, чтобы уклоняться от своей позиции, - удваивать ее, открыто требуя в подписанном письме национальным газетам полного изменения позиции правительства по вопросу о морских отсечениях. Для того чтобы добавить топливо к пожару, первый морской лорд Адмиралтейства также впервые предпочёл изменить направление, в котором эта ситуация разворачивается."
 ukadm.8.d: "В связи с неспособностью нашего правительства разработать конкретный план урегулирования нынешнего кризиса Вестминстер был парализован бездействием, и мятежные члены парламента начали настаивать на проведении новых выборов руководителей, с тем чтобы добиться «изменения политики» в отношении Королевского военно-морского флота."
 ukadm.9.d: "Несмотря на то, что вчера вечером в палате парламента рухнуло солнце, многие депутаты были вынуждены согласиться на новые выборы лидеров в нашей партии до тех пор, пока мы не закончили несколько часов утра в попытке решить вопрос о лидерстве в нашей партии раз и навсегда. Несмотря на то, что сэр Сэмюэл Хоаре не получил голоса, необходимые для того, чтобы не сомневаться, он был вынужден согласиться на новые выборы руководителей в нашей партии."
 ukadm.10.d: "Прошло несколько недель с тех пор, как нынешний премьер-министр Эдем занял свое место в качестве лидера Консервативной партии и самой британской нации, и, как представляется, достигнутое с ним соглашение было быстро реализовано, с тем чтобы он проводил согласованную политику. Для того чтобы продемонстрировать наше намерение полностью соблюдать наше соглашение, мы встретились с премьер-министром в Вестминстере прошлой ночью, чтобы дополнительно определить, какая политика должна быть в обозримом будущем, решительно согласившись с нашей решимостью укрепить Королевский флот и место Великобритании в Семи морях, премьер-министр изложил свои собственные грандиозные планы создания в ближайшем будущем нескольких чрезвычайно мощных и командных военно-морских кораблей. В связи с последствиями, которые Мутини имел для правительства в Инвергордоне, мы оказались в значительной степени влияющими как на Консервативную партию, так и на гражданскую службу. Это, несомненно, обеспечит сохранение Эдема в его положении в обозримом будущем, что позволит ему продолжать двигаться вперед и поддерживать политику, которая была согласована на эти недели."
 ukadm.11.d: "С учетом того, что наше правительство решило попытаться провести переговоры с членами Королевского военно-морского флота, для преодоления этого кризиса был организован ряд переговоров. Несмотря на то, что до сих пор выдвигались требования о возврате к прежней заработной плате морякам Королевского военно-морского флота на период не менее 12 месяцев, а также о проведении будущих переговоров для решения вопроса о том, следует ли продолжать эту выплату, поскольку она будет зависеть от дальнейшего экономического развития, многие члены нашего правительства считают, что даже эти требования заходят слишком далеко, поскольку необходимо понять историю мятежа Королевского военно-морского флота."
 ukadm.12.d: "Благодаря усилиям нашего правительства, направленным на то, чтобы положить конец забастовке, эти потенциальные мятежники вернулись к своим обязанностям, а общественность потеряла интерес ко всему делу, поскольку другие более важные вопросы начали преуменьшать национальные новости. Несмотря на это, это стало напоминанием всем тем, кто находится в вооруженных силах, о том, что правительство не отступает от решения таких серьезных вопросов, как эти."
 ukadm.15.d: "Теперь, когда наше влияние на правительство в Вестминстере является надежным, мы начали исправлять многие прошлые ошибки сменявших друг друга правительств Империи, хотя это и происходит, высказывались некоторые опасения по поводу защиты нашей власти в долгосрочной перспективе, и поэтому выдвигались предложения о том, чтобы изменить позиции правительственных подразделений и Консервативной партии, когда это возможно, с тем чтобы установить лиц, которые больше симпатизируют нашему делу, в частности тех, которые ранее служили в Королевском военно-морском флоте и, вероятно, будут смотреть в глаза многим из наших стратегий."
 ukadm.16.d: "Поскольку влияние Королевского ВМС растет ежедневно в залах Вестминстера, многие в рамках партнерства начали считать, что пришло время ограничить влияние британской армии и РВС, что, несомненно, еще больше укрепило бы позиции ВМС, хотя на более позднем этапе это может иметь последствия, которые не являются идеальными."
 ukadm.17.d: "Хотя в то время казалось абсурдным, что, отдавая приоритет Королевскому военно-морскому флоту, мы ослабим нашу армию в целом, представляется, что наш предыдущий выбор поддержать РН выше других институтов вооруженных сил имел негативные последствия в конечном итоге."
 ukadm.18.d: "После пяти долгих лет, прошедших после предыдущих выборов, когда, как представляется, весь мир был перевернут на свою голову, наша страна продолжала оставаться относительно невредимой в волнении, которое должно было произойти во всем мире. Наше правительство, естественно, увидело некоторые разрушения после событий инвергордона Мутини, но с железной волей, многие люди, чья преданность только Британии и Империи, спасли день и уничтожили тех, кто уничтожил бы Британскую Империю изнутри, и мы не забываем о наших соглашениях с новым правительством в Вестминстере. ~Нет, сегодня в британской истории мы отмечаем новый период выборов, и с использованием экспансивного влияния на нашу сторону, вряд ли можно сомневаться в его исходе."

 ### fall of france
 uk.500.d: "Недавняя победа Германии в Европе, французы отошли в Алжир. Мало надежды на то, что они вернутся на материк, и их дни, кажется, сочтены, как немцы угрожают пересечь море в Алжир. С такой ситуацией мы, возможно, захотим захватить большое количество французской земли в Африке, чтобы предотвратить ее попадание в руки Германии и позволить им угрожать нашим колониям. Однако это уменьшит способность французов вести войну против немцев и только усилит взаимное недоверие между нашими странами..."
 uk.501.d: "С учетом того, что наша администрация сосредоточилась главным образом на Алжире, многие начали сомневаться в том, как мы можем управлять колониальной империей, простирающейся на треть континента и достигающей территории, вплоть до Габона."

 #### Revolution
 uk.39.d: "Сегодня обрушилась катастрофа, когда наша когда-то лояльная армия разорилась в открытое восстание, присоединившись к восстаниям и протестам в Лондоне. Восстание произошло после того, как офицерам было дано указание открыть огонь по бунтовщикам, после того как они приказали своим войскам просто отказаться действовать. Когда оставшимся британским войскам было приказано снова стрелять в нескольких важных городах по всей стране, многие войска начали дезертировать и вступать в ряды социалистов, а другие стали стрелять по своим офицерам. Нет нужды говорить, что восстание стало более опасным, тогда как мы и никогда не могли представить, и крупные перестрелки между лояльными подразделениями армии и бунтарями никогда не будут происходить по всему Лондону. Хотя остающиеся британские силы имели позиции в ряде важных городов по всей стране, их число значительно превысило и они будут бороться за то, чтобы выдержать гораздо дольше. Премьер-министр, сэр Сэмюэл Хоаре, сегодня выступил с речью в этом парализованном Доме Общинства: когда начались эти удары по всему миру, я не могу себе представить, что нелепная политика уничтожает основы британской демократии, и все мы имеем в нашем ныне неуме, в наших собственных традициях."
 uk.40.d: "Товарищи по оружию! Коррупционное правительство в Вестминстере свергнулось в нашей славной борьбе за освобождение пролетариата нашей дорогой нации. Сейчас, когда мы говорим о членах Коммунистической партии Великобритании и Британской социалистической партии, мы работаем с элементами профсоюзов над созданием временного правительства, которое будет править нашим ныне освобожденным союзом. В ближайшие дни и недели по всей стране произойдут крупные изменения, когда мы будем проводить более радикальную и социалистическую политику экономического, культурного и социального возрождения Великобритании. Стоять твердо перед лицом любых попыток реакционных сил свергнуть наше правление, их попытки будут отчаянными и в конечном итоге бессмысленными; рабочие одержат победу, и их победа будет воцариться верх! ~ Ты будешь авангардом Британии завтрашнего дня, равенства, свободы и социализма. Не забывай о своих достижениях сегодня, потому что они будут написаны в столетиях мира и процветания, которые, несомненно, последуют за ними."
 uk.41.d: "С отставкой предыдущего правительства в Вестминстере в качестве средства обеспечения мандата на урегулирование растущего политического кризиса во всей стране были проведены чрезвычайные всеобщие выборы. &quot; Самы выборы &quot; были созваны при том предположении, что так называемые &quot; умеренные &quot; партии будут возвращены в Палату общин с большинством, необходимым для управления страной, однако, как представляется, последние несколько недель волнений радикально изменили политическую обстановку в Великобритании. &quot; Консервативные и Лейбористские партии &quot; были полностью разрушены в политическом плане, поскольку обе партии не смогли даже обеспечить число членов парламента, необходимых для формирования правительства, если они предпочтут сформировать коалицию. Вместо этого результаты показали явный сдвиг в сторону социалистических партий в Великобритании, как радикальных, так и умеренных. &quot; /, если окончательные результаты в стране самые большие политические расстройства в недавней истории разворачиваются перед нашими глазами, и ее последствия будут ощущаться десятилетиями впереди."
 uk.900.d: "Мы надеемся на Всемогущего Бога, что они будут стоять вместе с королем в эти отчаянные времена и будут следить за тем, чтобы эта гнусная революция была задушена в кроватке."
 uk.899.d: "В то время как наши силы храбро сражались с социалистами на улицах Англии, Уэльса и Шотландии, в Ирландии все казалось спокойным, и остров, казалось бы, ускользнул от сил революции. Сегодня эта иллюзия была разрушена, когда боевики IRB заняли важные стратегические и политические позиции по всей стране и провозгласили независимость от Соединенного Королевства. В то время как многие лоялистские военизированные формирования поднялись в Ольстере, британская армия мало что может сделать так, как она оказывается занята борьбой с силами социализма через море. Шансы на то, что Ирландия останется в руках правительства, выглядят незначительными."
 uk.901.d: "С учетом того, что революционное правительство в настоящее время контролирует огромные территории Англии и Уэльса, по всей территории Соединенного Королевства Великобритании и Ирландии появилось большое число добровольцев."
 uk.902.d: "В последние несколько недель боевых действий в Великобритании произошло крах антиреволюционных сил. Военная ситуация может быть охарактеризована лишь как безнадежная, при этом многочисленные неудавшиеся наступательные действия приводят к катастрофе - с подобающим сравнением с разгромленным нападением на Москву со стороны белых сил во время гражданской войны в России. С этой целью были разработаны планы по эвакуации большого числа людей, материальных средств и гражданских лиц в средиземноморские акватории Великобритании, с надеждой на создание правительственного государства, которое однажды сможет вывести Британию из социалистической среды. Тысячи людей, выстраиваемых на пляжах и в портах, смущенных воздушными налетами республиканских военно-воздушных сил и преследуемых прогрессивной республиканской армией, спешно погрузятся на военные корабли в основном лояльного Королевского флота, с заметным вкладом ряда гражданских кораблей в эвакуацию военного персонала и гражданского населения. Хотя это не может спасти родину, в долгосрочной перспективе это гарантирует выживание и будущий потенциал освобождения родины."
 uk.903.d: "Садись на лодку, сынок, мы едем в Шагалуф в изгнание много испанских птиц, куча Карлинга, может послушать республиканскую лапу на беспроводной чёртовой шлюхе Норф FC выиграл 3-0 счастливых дней"
 uk.891.t: "Англо-ирландский договор"
 uk.891.d: "С падением британских и военизированных сил в Ирландии остров теперь полностью контролируется СИБ. Ирландцы прислали договор с изложением своих условий, которые требуют лишь полного признания суверенитета Ирландского республиканского государства. Примем ли мы этот Договор?"
 uk.891.a: "Мы не можем позволить себе двухстороннюю войну."
 uk.891.b: "Мы раздавим и Эттли, и СИБ тоже!"
 uk.892.t: "Британский отказ!"
 uk.894.t: "Ирландские условия"
 uk.894.d: "С падением британских сил на материке ирландские силы стремятся к миру, споря, что если они не будут предоставлены, социалисты могут получить опору в Ирландии."
 uk.894.a: "Так тому и быть."
 uk.894.b: "Никогда!"
 uk.904.d: "Несмотря на огромные трудности, правительству удалось вновь установить контроль над страной, и Революция была решительно разрушена. После ожесточенных столкновений на всех Британских островах мир наконец-то вернулся. Несколько республиканских боевиков отказались сдаться, хотя, согласно прогнозам, они будут ликвидированы в предстоящие месяцы. Местопребывание Аттле неизвестно, однако революционеры вряд ли сдадут себя смертной казнью на его имя."

 uk.9000.d: "Глобальная экономическая катастрофа разрушила доверие британского народа и запятнала его безупречный образ на мировой арене."

 uk.9002.d: "Во время Второй Великой войны гражданские беспорядки распространились по всей Британии безостановочно, на нежеланную армию было возложено решение этих волнений, хотя это оказалось для них слишком большим. Это привело к тому, что армия присоединилась к разъяренному населению в восстании, и теперь многие боятся полномасштабной гражданской войны. Правительство скатилось лишь дальше в хаос в свете этих новостей, и, похоже, судьба Британии запечатана."

