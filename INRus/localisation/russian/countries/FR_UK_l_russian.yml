 CAN_iedc_decisions: "СВУК"
 CAN_iedc_decisions_desc: "Имперский совет по экономическому развитию позволяет членам объединить экономические ресурсы по указанию [режиссёра. Гетаживного] правительства. Все расходы на политическую власть в связи с решениями МЕДК берутся из пула МЕДК. ~n ENDC: [CAN_iedc1] [CAN_iedc2] [CAN_iedc3] [CAN_iedc4] [CAN_iedc6] [CAN_Iedc7] [CAN_iedc8] [CAN_iedc9] [CAN_iedc11] [CAN_CAN_iedc12] [CAN_iedc13] [CAN_CAN_iedc14] [CAN_Iedc15] ~n interning IEDCC Polical Powerity: §Y [? global.iedc_pp]!"
 CAN_invite_into_iedc: "Пригласите [из "Сделай наименование"] в СВУ"
 CAN_invite_into_iedc_desc: "Мы должны направить правительству приглашение присоединиться к СВУ."
 CAN_iedc_economic_investment: "Инвестирование МЕДК в [от GetNameDef]"
 CAN_iedc_economic_investment_desc: "Объединение наших ресурсов может позволить странам-членам получить доступ к промышленным ресурсам сверх своих обычных возможностей, но только в том случае, если они остаются в рамках АПИ."
 CAN_iedc_economic_investment_home: "Инвестиционная деятельность МЕДК в [Root. GetNameDef]"
 CAN_iedc_economic_investment_home_desc: "Объединение промышленных ресурсов АПИ может помочь расширить промышленную базу [Root.GetNameDef], хотя мы должны быть осторожны — другие члены МКС могут завидовать, если мы слишком сосредоточимся на своей собственной экономике без совместного участия."

 CAN_join_ISAC_decision: "Присоединяйтесь к ISAC"
 CAN_join_ISAC_decision_desc: "Имперский научный и академический совет является одним из ведущих институтов АПИ."


 ### Entente Events ###
 entente_events.2.t: "Приглашение к СВУ"
 entente_events.2.d: "Сегодня прибыла делегация правительства [от имени правительства], которая официально пригласила [Root.GetNameDef] присоединиться к IEDC - Имперскому совету экономического развития. IEDC была создана для содействия расширению экономического сотрудничества в рамках Британской империи с ежегодными (и добровольными) взносами политической власти, которые вкладываются в государства-члены по усмотрению [от GetNameDef]. Некоторые члены правительства выражают озабоченность по поводу того, что [Root. GetNameDef] действительно смогут получить прибыль от своих инвестиций, поскольку [от GetNameDef] просто решит инвестировать все в себя, но, учитывая, что пожертвования являются добровольными, это, похоже, обеспечит короткую жизнь для IEDC."
 entente_events.2.a: "Присоединяйтесь к политической власти 25 фунтов стерлингов и вкладывайте в нее"
 entente_events.2.b: "Присоединяйтесь и вкладывайте фунт фунт 50 политической власти"
 entente_events.2.c: "Присоединяйтесь и вкладывайте фунт 100 политической власти"
 entente_events.2.e: "У нас нет никакого интереса к СВУ."

 entente_events.3.t: "Согласен присоединиться."
 entente_events.3.d: "Правительство увидело мудрость нашего предложения и согласилось присоединиться к IEDC, включая первоначальную инвестицию в фунт pol_power [??Eedc_Business] политическую власть. Первые экономисты и инженеры уже начали прибывать в [Root.GetNameDef]."
 entente_events.3.a: "Отлично!"

 entente_events.4.t: "Отказывается присоединиться."
 entente_events.4.d: "Возможно, видя, что Империя не в состоянии оказать какое-либо существенное влияние на свою экономику, или просто не доверяя британскому правительству в управлении его инвестициями, [от имени "Гет Наме Дефа"] отклонил наше предложение и отказался присоединиться к IEDC."
 entente_events.4.a: "Разочарование"

 entente_events.5.t: "Советники по СВОД"
 entente_events.5.d: "Наш вклад в СВОД позволяет нам воспользоваться их резервом консультантов, выгоды от которого больше, в зависимости от того, в какой степени мы внесли свой вклад в работу группы."
 entente_events.5.a: "Пусть они помогут нам с нашей экономикой."
 entente_events.5.b: "Нам бы действительно понадобились их военно-морские инженеры."
 entente_events.5.c: "Инженеры-строители были бы очень полезны."

 entente_events.6.t: "Инвестиции в СЭДК"
 entente_events.6.d.head: "ИЕДК готова инвестировать в [Root.GetNameDef], хотя она не создает в каком-либо конкретном [Root.GetAdquesty] состоянии беспомощности, что повышает наш общий промышленный потенциал благодаря экономическому сотрудничеству АПИ. Эти фабрики остаются до тех пор, пока наше участие в союзе сохраняется. В каком направлении мы должны поощрять эти новые инвестиции?"
 entente_events.6.d.member: "ИЕДК готова инвестировать в [Root.GetNameDef], хотя она не создает в каком-либо конкретном [Root.GetAdquesty] состоянии беспомощности, что повышает наш общий промышленный потенциал благодаря экономическому сотрудничеству АПИ. Эти фабрики остаются до тех пор, пока наше участие в союзе сохраняется. В каком направлении мы должны поощрять эти новые инвестиции?"
 entente_events.6.a: "Инвестирование в гражданские предприятия"
 entente_events.6.b: "Инвестирование в оружейные фабрики"
 entente_events.6.c: "Инвестирование средств на верфь"

 entente_events.10.t: "Ежегодный обзор СВУО"
 entente_events.10.d: "Настало время пересмотреть наше участие в СВУ и ежегодно вносить свой вклад в организацию."
 entente_events.10.a: "Инвестировать фунт фунт функции 250 политической власти"
 entente_events.10.b: "Инвестировать фунт фунт 100 политической власти"
 entente_events.10.c: "Инвестировать фунт полюса 50 политических сил"
 entente_events.10.e: "Инвестировать в фунт фунт 25 политической власти"
 entente_events.10.f: "Пока ничего не инвестируй."

 entente_events.12.t: "Выход из СВУ"
 entente_events.12.d: "Поскольку мы больше не являемся членом Имперского альянса защиты, из этого следует, что мы больше не можем оставаться частью IEDC. Наши инженеры и советники уже уходят [Iedc_lead. GetNameDef]."
 entente_events.12.a: "Да будет так!"

 entente_events.13.t: "СИДК Закрыть"
 entente_events.13.d: "Без какого-либо членства в этой организации МВУК, наконец, избрало роспуск. &quot; В совете &quot; было несколько протестов, и те, кто заявил, что МВУК все еще может оказаться ценным, даже если она будет координировать усилия в рамках [Root.GetNameDef], а не в рамках всего альянса, но большинство из них было ясно, что МЕДК не выполнила свою миссию."
 entente_events.13.a: "Несчастный"

 entente_events.15.t: "Фонд ИСАК"
 entente_events.15.d: "В то время как имперское содружество и наше членство в нем теоретически носят чисто военный характер, реальность гораздо более сложна, чем это. Одним из наследий Великой войны стало появление массовой мобилизации, т.е. объединение крупных слоев потенциально полезных слоев общества в аппарат, предназначенный для оказания помощи военным усилиям. Область технологии была включена в это - в усилия, направленные на то, чтобы разорвать &quot; траншей &quot; Западного фронта, военные технологии породили смелые новые изобретения, такие, как сухопутные корабли, в надежде, наконец, обратить эту волну вспять. В результате такой мобилизации, как это, линия между гражданскими и военными ресурсами стала несколько размытой, и недавний рост международной напряженности привел к началу глобальной гонки вооружений, что никто не может позволить себе оставить позади. Для достижения этой цели [ЭНГ.ГетНамедеф] создал Имперский научный и академический совет - организацию, призванную объединить и координировать научные усилия империи через границы, что позволило быстро распространить крупные технологические достижения между государствами-членами и ликвидировать некоторые расточительные дублирующие работы. Для этого [ЭНГ.Гамамедеф] создал много преимуществ, которые мы получили в рамках нашего союза, и поэтому нам было предложено принять участие в этой инициативе."
 entente_events.15.a: "Замечательная инициатива!"


 #Cold War Stuff

 #Events
 ukcoldwar.0.d: "Пушки замолчали, но мир хрупкий, холодный. С завершением последнего великого конфликта Германия стала бесспорным хозяином европейского континента. Их влияние, подкрепленное мощью их победоносных армий, теперь тянется к самим берегам канала. Несмотря на то, что германские гарнизоны теперь занимают жизненно важные порты Нидерландов и Бельгии, глядя прямо через узкое море у наших берегов. На протяжении веков наша грандиозная стратегия заключалась в том, чтобы не допустить того, чтобы какая-либо одна власть достигла такой доминирующей и угрожающей позиции. Эта стратегия сейчас провалилась."
 ukcoldwar.1.d: "Британская империя, когда-то присоединившаяся к Берлину, сейчас подходит к нам с предложением, ссылаясь на растущую силу и влияние Германии как на угрозу европейской стабильности, Лондон предлагает нам присоединиться к их недавно созданной «Вестминстерской договорной организации». Это представляет собой значительное изменение их предыдущей внешней политики. Хотя скептицизм оправдан с учетом их прошлых действий, реальность немецкой власти неоспорима. Должны ли мы принять их предложение и присоединиться к этой антигерманской коалиции?"
 ukcoldwar.2.d: "Отличные новости! Правительство [от Гетнама] приняло наше приглашение вступить в Вестминстерскую договорную организацию. Они понимают необходимость создания единого фронта против германского экспансионизма, несмотря на сложности недавней истории. Их членство значительно укрепляет наш союз и демонстрирует растущую решимость по всей Европе противостоять угрозе Берлина."
 ukcoldwar.3.d: "К сожалению, [от Гетнама] отклонило наше предложение вступить в Вестминстерскую договорную организацию, и, как представляется, они либо не в состоянии простить наше прошлое сотрудничество с Германией, либо не осознают нынешней опасности, которую представляют неконтролируемые амбиции Берлина, их отказ ослабляет потенциальную коллективную безопасность Европы и делает их уязвимыми."
 ukcoldwar.4.d: "Международная ситуация резко изменилась. Лондон, ранее присоединившись к Берлину против нас, теперь расширяет оливковую ветвь. Они говорят об общих интересах перед лицом растущей немецкой власти и предлагают нам присоединиться к их новой "Вестминстерской договорной организации". Хотя их предыдущие действия жалят, стратегическую реальность немецкого господства нельзя игнорировать. Должны ли мы принять это неожиданное предложение и присоединиться к англичанам против наших бывших противников?"
 ukcoldwar.5.d: "Несмотря на нашу сложную недавнюю историю, правительство Рима признало меняющийся геополитический ландшафт. Они приняли наше приглашение вступить в Вестминстерскую договорную организацию. Это является важным шагом в деле создания коалиции по противодействию немецкому влиянию в Европе. С учетом того, что Италия потенциально поддерживает наш южный фланг, баланс сил начинает выглядеть более благоприятным."
 ukcoldwar.6.d: "Итальянское правительство отвергло наше предложение о сближении и союзе. Кажется, память о нашем предыдущем сотрудничестве с Германией остается слишком горькой таблеткой, которую они не могут проглотить. Они явно не видят более широкую стратегическую картину. Этот отказ ослабляет потенциальную коалицию против Берлина и заставляет нас пересмотреть наши варианты в Южной Европе."
 ukcoldwar.7.d: "Наши атташе и послы по всей Европе сообщают о тревожной тенденции: Соединенное Королевство находится на дипломатическом наступлении. &lt; &lt; Уайтхолл &gt; &gt; пытается протянуть паутину влияния по всему континенту, без сомнения, с тем чтобы изолировать нас и сдержать наши амбиции. Это вмешательство абсолютно неприемлемо. Если они стремятся создать против нас коалицию, мы должны отреагировать на это. Мы свяжемся с теми странами, которые понимают истинное значение силы и порядка, и создадим блок, который сможет противостоять британскому вмешательству."
 ukcoldwar.8.d: "Из Берлина прибыло секретное дипломатическое сообщение. Правительство предлагает официальный военный пакт, ссылаясь на «растущую угрозу европейской стабильности и суверенитету» — тонкую завуалированную ссылку на недавние британские позы. Они предлагают нашим странам соединиться, объединившись общей идеологией и общим интересом к проверке британского влияния. Это важное предложение. Для союзника [от Гетнама] мы могли бы предложить огромную безопасность, но это, несомненно, также вызовет атмосферу Лондона и его союзников. Мы должны тщательно выбрать наш путь."
 ukcoldwar.9.d: "Победоносное направление! Правительство [от Гетнама] официально приняло наше предложение присоединиться к нашему альянсу. Они признают мудрость нашей позиции и готовы противостоять британскому вмешательству. Это большая победа для нашей внешней политики. Наши новые партнеры [от Генегатива Капитана] будут немедленно приветствоваться. Вместе мы построим новый порядок в Европе!"
 ukcoldwar.10.d: "Непонятно! Мы предложили правительству [от .GetAductive Cap] нашу руку в дружбе, нашу защиту, и они отказались. Их официальный ответ полон слабых предлогов насчет "нейтрализма" и "суверенности". ~ ~ Они либо слепы к угрозе, нависшей над Европой, либо они трусы. Очень хорошо. Если они не будут стоять с нами, то им придется самим заботиться о себе. Они скоро узнают цену своей глупости."

 ukcoldwar.11.d: "Прибыл официальный дипломатический посланник из Лондона, с предложением, которое может коренным образом изменить баланс сил в Западной Европе. &quot; Британское правительство &quot; , остерегаясь теней &quot; холодной войны &quot; , предложило нам присоединиться к ним в официальном союзе. &quot; Такой пакт &quot; обеспечивает щит Королевского флота и значительную экономическую интеграцию, однако он, несомненно, привёл бы нашу внешнюю политику к прихотям &quot; Уайтхолл &quot; . &quot; Наши министры &quot; разделены &quot; . &quot; Наши министры &quot; ; некоторые считают это необходимой гарантией нашего суверенитета, в то время как другие опасаются, что это всего лишь изощренная форма вассалажания &quot; ."

 ukcoldwar.12.d: "Славные новости дошли до Уайтхолла! Испанское правительство официально приняло наше предложение о стратегическом союзе. Приведя Мадрид на нашу орбиту, мы обеспечили жизненно важный бастион в устье Средиземного моря и обеспечили, чтобы Иберийский полуостров оставался дружеским оплотом против наших противников. Министерство иностранных дел сообщает, что договоры подписываются сейчас, когда мы говорим. Это партнерство знаменует собой значительный триумф британской дипломатии во все более неопределенном мире."

 ukcoldwar.13.d: "Ответ из Мадрида был неожиданным: несмотря на наши щедрые инициативы и явные преимущества британской защиты, испанцы сочли нужным отказаться от нашей дружбы, как представляется, они предпочитают неустойчивость изоляции, или, возможно, они оказывают влияние из-за чего-то другого, и хотя мы должны уважать их решение, мы не будем быстро забыть об этом в залах парламента."

 ukcoldwar.14.d: "Лондон требует, чтобы мы подписали официальный пакт о нейтралитете, фактически привязав нашу внешнюю политику к позиции жесткой несогласованности, хотя такое соглашение позволило бы избежать немедленного давления со стороны британского вмешательства, несомненно, привязало бы наши руки, не позволяя нам отстаивать свои собственные интересы или искать альтернативных партнеров, и мы должны решить, стоит ли безопасность навязанного Великобританией мира потери нашей дипломатической автономии."

 ukcoldwar.15.d: "Правительство Турции, наконец, поддалось нашему давлению. Подписав Пакт нейтральности, турки взяли на себя обязательство строго не вмешиваться, эффективно нейтрализовать потенциальную точку вспышки в Восточном Средиземноморье. Наши стратеги в Уайтхолле теперь могут вздохнуть с облегчением; с внешней политикой Турции фактически «положиться на лед», мы можем сфокусировать наши ресурсы на более насущных фронтах. По крайней мере, в течение следующих нескольких лет мы можем быть уверены, что турки не будут введены в заблуждение нашими соперниками."

 ukcoldwar.16.d: "Наши попытки обеспечить официальную гарантию нейтралитета со стороны Турции были отвергнуты неожиданным вызовом. Правительство Турции дало понять, что оно не будет диктовать свою внешнюю политику Лондоном, предпочитая вместо этого поддерживать уровень непредсказуемости, который мы находим крайне неприятным. Этот отказ указывает на то, что они, возможно, пользуются амбициями, противоречащими британским интересам, или, что еще хуже, что они уже ищут поддержки у наших врагов. Теперь мы должны рассматривать Турцию не как потенциальную нейтральную, а как дикую карту, требующую постоянного наблюдения."

 # Event 1: The Incursion (For Britain)
 ukcoldwar_flavour.1: "Наши радиолокационные станции в Восточной Англии отслеживали многочисленные высокоскоростные контакты, исходящие с континента. Они проникли глубоко в наше воздушное пространство, прежде чем наши перехватчики могли быть сорваны. Фотосъемка самолётов подтверждает худшее: они были передовыми немецкими разведывательными самолетами. Немецкий посол молчал, не давая объяснений этой вопиющей провокации. Военные ждут вашего решения о том, как реагировать."

 # Event 2: The Demand (For Germany)
 ukcoldwar_flavour.2: "Британцы направили официальный дипломатический протест в связи с тем, что они называют «грубым и неприемлемым нарушением» их суверенного воздушного пространства."

 # Event 3: The Refusal (For Britain)
 ukcoldwar_flavour.3: "Немецкая реакция на наш протест прибыла. Это... неудовлетворительно. Иными словами, они отказались извиняться, ссылаясь на «ручные навигационные учения» и «неразборчивые морские границы». Пресса уже называет это дипломатическим унижением."

 # Event 4: The Apology (For Britain)
 ukcoldwar_flavour.4: "После напряженных сорока восьми часов посол Германии принес официальные извинения из Берлина, они утверждают, что нарушение воздушного пространства произошло из-за "тяжелого сбоя в навигации" и заверили нас, что команда, ответственная за это, будет дисциплинирована. Несмотря на то, что мы можем обсудить правду об этом, их готовность извиниться успешно деэскалировала ситуацию. Пока кризис был предотвращен."

