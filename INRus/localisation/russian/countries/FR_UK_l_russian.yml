 ENG_war_mobil: "Мобилизованная в результате войны экономика"
 ENG_war_mobil_desc: "Сейчас, когда мы живем в состоянии войны, и еще одна Великая держава мобилизовала нашу экономику, чтобы удовлетворить требования войны, и поэтому последствия катастрофического коллапса Лондонского фондового рынка были значительно компенсированы, и в следующем году мы, вероятно, увидим значительный рост производства в нашей экономике."

 ENG_eco_instab: "Экономическая нестабильность"
 ENG_eco_instab_desc: "Несмотря на устранение худших последствий Лондонского фондового рынка, сохраняется скрытая экономическая нестабильность."

 ENG_ire_integration_efforts: "Ирландские усилия по интеграции"
 ENG_ire_integration_efforts_desc: "Попытка интеграции Ирландии в Соединенное Королевство, вероятно, будет чрезвычайно трудным процессом, и для обеспечения ее успеха потребуется значительный политический капитал."
 ENG_integ2: "Ирландские усилия по интеграции"
 ENG_ire_integ2_desc: "Попытка интеграции Ирландии в Соединенное Королевство, вероятно, будет чрезвычайно трудным процессом, и для обеспечения ее успеха потребуется значительный политический капитал."
 ENG_irb: "Ирландское республиканское братство"
 ENG_irb_desc: "С 1916 года, после Пасхального восстания, СИБ прибегала к более малогабаритным нападениям, направленным на подрыв нашего правления в Ирландии. Эти нападения, как правило, принимают форму засад и нападений на полицейские позиции. Пока мы не найдем способ уничтожить СИБ, эти нападения, скорее всего, будут продолжаться."
 ENG_irb1: "Ирландское республиканское братство"
 ENG_irb1_desc: "С 1916 года, после Пасхального восстания, СИБ прибегала к более малогабаритным нападениям, направленным на подрыв нашего правления в Ирландии. Эти нападения, как правило, принимают форму засад и нападений на полицейские позиции. Пока мы не найдем способ уничтожить СИБ, эти нападения, скорее всего, будут продолжаться."
