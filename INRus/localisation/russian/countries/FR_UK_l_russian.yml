 # - London Naval Treaty

 ENG_london_nt: "Членство в Лондонском военно-морском договоре"
 ENG_london_nt_desc: "Лондонский военно-морской договор, подписанный в апреле 1930 года правительствами Португалии, Греции и Великобритании, представляет собой соглашение об ограничении военно-морского производства его государств-членов, а британское правительство в свою очередь соглашается гарантировать независимость подписавших его государств и охранять их воды с Королевским военно-морским флотом."
