 CZE_alois_podhajsky: "Алоис Подхайский"
 #CZE_alois_podhajsky_commander_desc: "18 февраля 1864 года в Блатне, Чехия, Австрийская империя §n §Y Военная карьера: §L Сын сержанта жандармерии, Алоис Подхайский окончил Пехотную школу Прессбургского кадета в 1884 году, став лейтенантом в 1897 году. С 1890 по 1892 год он посещал Кригшуле в Вене, чтобы стать штабным офицером. К 1910 году он был полковником, который был назначен генерал-майором в самом начале войны в Велкриг. n/По большей части войны Подхайский возглавлял 21-й пехотный отдел Ландвехра, в состав которого входили большинство чешских военнослужащих, первоначально в Сербии, тогда Галисии и Италии, на последнем этапе войны. Он доказал, что он был компетентным командиром, получив приказ Иронского Корона и Военного Меритского креста в 1915 году, и Первый класс Жеронского Креста в следующем году."rakušák\" (Austrian; a derogatory term for Czechs in the Austro-Hungarian Army), he remained steadfast in his shared loyalty to his people and Monarch. After the war, Podhajsky was one of the energetic organisers and leaders of the re-formed Bohemian Landwehr during the first wave of reforms in Cisleithania (the Austrian half of the Empire). Towards the end of the interwar, he was one of the few remaining Czech officers that held a general rank during the Weltkrieg left in active service. While enthusiasm among Czechs for military service remains low, he is still a lasting presence and symbol of the \"rakušák\", he maintains his faith in the Monarchy and that the esteemed Emperor will continue to follow the path of reform and reconciliation for the betterment of the Czech nation."

 CZE_josef_bily: "Йозеф Били"
 #CZE_josef_bily_commander_desc: "30 июня 1872 года в Збонине, Чехии, Австрии и Венгрии. В 1898 году он проходил курс подготовки штабного офицера в Кригсшуле в Вене, закончив обучение через два года после его назначения в 4-й пехотной дивизии. Затем он преподавал тактику в Венской пехотной школе в течение двух лет в 1908-1910 годах. В начале 15-го пехотного полка Билли был командиром батальона, который участвовал в кровавых боях против русских до 24-го июля 1915 года, когда он был тяжело ранен. После того как он был выздоровлен, он работал в Генеральном правительстве Лублина в течение полугода, прежде чем взять командование штурмовым батальоном в Тироле. В 1917 году он стал командиром специальной группы, которая успешно вела боевые действия в Азии."rakušák\" (Austrian; a derogatory term for Czechs in the Austro-Hungarian Army), although his loyalty to both Crown and the Czech nation are only doubted by the most chauvinistic Germans and Czechs respectively."

 CZE_josef_votruba: "Йозеф Вотруба"
 # CZE_josef_votruba_commander_desc: "§Y General Profinition\nBorn: 8 ноября 1879 года в Дебрже, Чехия, Австрия-Венгрия-н §Y Военная карьера: §L Выпуск с верхними метками из престижной Венской кадетской школы, Вотруба начал свою военную карьеру в 1899 году и быстро произвел впечатление на своих начальствах. В 1908 году он закончил Венский кригшул, снова с высокими метками и образцовым поведением, и был назначен штабным офицером, пока еще не стал лейтенантом. ~ Несмотря на то, что в 1918 году он стал членом оперативного департамента 1-й армии, перед тем как был переведен в 12-й пехотной дивизионной дивизии на Галицком фронте. После 1915 года он был членом 58-й пехотной дивизии, в то время, когда он сражался с болгардами, а затем был вынужден бежать в Итальянский Военный фронт, где он находился до 19-го года."rakušák\" (Austrian; a derogatory term for Czechs in the Austro-Hungarian Army), and arguably the most skilled Czech generals in service. However, his health is rapidly deteriorating from severe diabetes, even if his mind is as sharp as ever."

 CZE_bohuslav_kohout: "Бохуслав Кохут"
 #CZE_bohuslav_kohout_commander_desc: "5 декабря 1896 года в Литомышле, Чехии, Австрии и Венгрии: §L Bohuslav Kohout не намеревался заниматься военной карьерой до внезапной смерти своего отца в 1910 году. До того, как он был принят в Пражскую пехотную кадетную школу через два года после этого события, он был вдохновляющим промоутером скаутского движения на чешских землях. До марта 1915 года Кохут окончил Кадетскую школу и стал командиром пехотного взвода в июне в составе 20-й пехотной пехотной пехотной пехотной пехоты в Галисии. В 1916 году он был отправлен на итальянский фронт в качестве командира снаряда, а затем вернулся на русский фронт. В 1918 году он был переведен в драгуны, переведен в Ритмейстер (капитан Кавалея) в июне, когда он доказал свои навыки в ходе скаутовского движения. После войны он находился в армии, принимая участие в переформации своего военного компонента в Вене, в 1918 году он был опубликован в герском военном."Handbook for Soldiers", originally intended for the Bohemian Landwehr, it was quickly translated, at his own request, into German and Hungarian, and would soon supersede older pre-war handbooks. Unlike the old handbooks, Kohout not only intended to improve the more practical aspects of everyday soldiering, but, being deeply influenced by values and his experiences in the scouting movement, also focused on morale and behaviour. This made the handbook distinct from similar pre-war manuals along with Kohout's intent to reach other ethnicities, hoping to ease ethnic tensions within the Bohemian Landwehr and create a more cohesive force. The work also caught the attention of reformists keen to eliminate the old chauvinistic attitudes rampant among the old guard of the Army and breathe new life into the institution as a multiethnic one. While only a colonel and with experience only leading small units during the war, Handbook for Soldiers is proving to be highly influential, promising to propel Kohout's career to new heights.\n\n\"Find a second German or a Hungarian and learn from them! And teach them too!\""

 CZE_eduard_horak: "Эдуард Хорак"
 #CZE_eduard_horak_commander_desc: "§Y General Profinition\nBorn: §L Август, 1887, в Чехии, Австрия-Венгрия, §Y Военная карьера: §L Little известен о его ранней жизни. К 1927 году он был штабным офицером в Чехимском Ландвере. К 1930 году он был повышен до полковника и командовал пехотным полком. С 1936 года он возглавляет Моравийский район Чехимского Ландвера и в ближайшем будущем будет назначен генерал-майором."

 CZE_viktor_hoppe: "Виктор Хоппе"
 #CZE_viktor_hoppe_commander_desc: "14 апреля 1874 года в Брно, Моравии, Австрии и Венгрии: §L Сын адвоката и политика Бедржиха Хоппе, Виктор начал военную службу после окончания школы кадетов Храниса в 1895 году, а затем курс подготовки офицеров в Верхней Австрии. в 1900 году он ушел в отставку с активной службы и стал частью резерва только для того, чтобы вернуться через два года в качестве сотрудника по ремонту. ~ К 1914 году, когда начался велькриг, он был начальником кадрового управления Пражского военного округа до переезда в департамент планирования. К тому времени он уже был информатором группы сопротивления маффи, но эта ассоциация никогда не ушла дальше и едва наносила ущерб его карьере после того, как Карл поднялся на трон. К 1918 году он достиг звания лейтенанта колониля до того, как его наконец перевели из Пражского района в Армей-Оберкомандо (Армское высшее командование). В 1920 году он был членом кавалерийского отдела и был повышен до уровня вое место, когда Карл поднялся на трон."

