 cen.0.d: "Чехословакия была провозглашена на Версальской конференции в 1919 году решением Согласительных держав, получила земли Чехословакии, Словакии, Сорбии и Южной Силезии. В результате различных событий в Польско-Болшевикской войне Лемко и Команча были интегрированы в Чехословакию. В 1934 году страна была реформирована в Западославию. Растущее чувство неполноценности среди меньшинств, враждебно относившихся к различным реформам, проведенным чехословацкой национальной демократической партией."
 cen.nodecsription: ""
 cen.7.d: "Должны ли мы предоставить Судутенским немцам автономию?"
 cen.9.d: "Должны ли мы предоставить полякам автономию Галакии?"
 cen.10.d: "Крэш Лондонского фондового рынка, наконец, ударил Западославию! Тысячи семей потеряли свои сбережения, и многие компании объявляют о банкротстве! Мы должны начать реформировать нашу экономику как можно скорее, или мы рухнем вместе с экономикой!"
 cen.11.d: "Сегодня в столицу прибыл венгерский дипломат с обширным перечнем требований, направленных нашему правительству."
 cen.19.t: "Польша захватывает Галицию и Заользие"
 cen.19.d: "В неразберихе и панике, вызванных словацким восстанием, Польша воспользовалась шансом и захватила землю, которую мы искали у них около 20 лет назад."
 cen.19.a: "Мой штат рушится вокруг меня..."
 cen.20.t: "Хорти требует Словакию!"
 cen.20.d: "Сегодня в столицу прибыл венгерский дипломат с обширным перечнем требований, направленных нашему правительству."
 cen.24.t: "Реформа условий труда"
 cen.24.d: "И наконец, парламент принял решение о пересмотре старых законов об условиях труда. Есть различные предложения, но все они сводятся к двум вариантам. Мы можем сделать условия только немного лучше, не лишая себя большей эффективности производства, или мы можем значительно увеличить их, предоставляя нам больше поддержки рабочих, но нанося ущерб производительности."
 cen.24.a: "Только немного лучше."
 cen.24.b: "Увеличь их как можно больше."
 cen.25.t: "Компромисс & Sudetenland & Silesia"
 cen.25.d: ""
 cen.25.a: "Давайте вернем его законным владельцам."
 cen.26.t: "Компромисс Галисии"
 cen.26.d: ""
 cen.26.a: "Давайте вернем его законным владельцам."
 cen.27.t: "Переговоры с представителями регионов"
 cen.27.d: "Для того чтобы положить конец волнениям, мы решили собрать представителей из всех наших регионов."
 cen.27.a: "Больше привилегий"
 cen.27.b: "Субсидии для промышленности"
 cen.27.c: "Увеличение числа представителей в парламенте"
 cen.28.t: "Западославия хочет подписать сделку с оружием."
 cen.28.d: "Западославское правительство спросило нас, могут ли они купить немного нашего оружия, и мы можем извлечь из этого выгоду, поскольку Западославия ищет новых союзников."
 cen.28.a: "Мы должны подписать это."
 cen.28.b: "Мы не можем себе этого позволить."
 cen.29.t: "Западославия хочет подписать сделку с оружием."
 cen.29.d: "Западославское правительство спросило нас, могут ли они купить немного нашего оружия, и мы можем извлечь из этого выгоду, поскольку Западославия ищет новых союзников."
 cen.29.a: "Мы должны подписать это."
 cen.29.b: "Мы не можем себе этого позволить."
 cen.30.t: "Западославия хочет подписать сделку с оружием."
 cen.30.d: "Западославское правительство спросило нас, могут ли они купить немного нашего оружия, и мы можем извлечь из этого выгоду, поскольку Западославия ищет новых союзников."
 cen.30.a: "Мы должны подписать это."
 cen.30.b: "Мы не можем себе этого позволить."
 cen.31.t: "Они отказались!"
 cen.31.d: "Теперь мы должны искать другую страну, которая готова сотрудничать с нами."
 cen.31.a: "Проклятье..."
 cen.32.t: "Западославия просит о помощи в промышленности."
 cen.32.d: "Из-за своей тяжелой промышленной ситуации западославское правительство попросило у нас средства, чтобы вылечить их неудачную экономику."
 cen.32.a: "Отправляй деньги."
 cen.32.b: "Нам нужны наши деньги здесь."
 cen.33.t: "Западославия просит у нас гарантии."
 cen.33.d: "Из-за опасной ситуации в регионе Западославия решила просить нас о гарантии независимости."
 cen.33.a: "Мы должны защищать их."
 cen.33.b: "Ни в коем случае."
 cen.34.t: "Западославия просит у нас гарантии."
 cen.34.d: "Из-за опасной ситуации в регионе Западославия решила просить нас о гарантии независимости."
 cen.34.a: "Мы должны помочь им."
 cen.34.b: "Не может быть, они все еще предатели."
 cen.35.t: "Западославия хочет присоединиться к Континентальному Континенту"
 cen.35.d: "Из-за опасной ситуации в регионе Западославия решила присоединиться к нашей фракции Континентальный Континент."
 cen.35.a: "Они остро нуждаются в помощи"
 cen.35.b: "Немцы слишком сильные."
 cen.36.t: "Западославия ищет французскую защиту"
 cen.36.d: "Из-за опасной ситуации в регионе Западославия решила просить нас о гарантии независимости."
 cen.36.a: "Конечно."
 cen.36.b: "Мы не можем помочь."
 cen.950.d: "Западославия прислала нам предложение присоединиться к славянскому Блоку."
 cen.37.a: "Мы должны присоединиться к их блоку."
 cen.37.b: "У нас свои проблемы."
 cen.38.t: "Неспокойные поднимаются!"
 cen.38.d: "В связи с подавлением прав меньшинств в городах республик усилились протесты! Они требуют возвращения своих прав и решительно выступают против Гайды, утверждая, что он"Undemocratic takeover of the Federation" will eventually destroy it! What should we do with these traitors?"
 cen.38.a: "Используйте полицию!"
 cen.38.b: "Подожди, они в конце концов умрут."
 cen.39.t: "Мы не смогли сдержать протесты!"
 cen.39.d: "Протесты как никогда велики! Без быстрых действий они могут распространиться еще дальше в другие города и в конечном счете в Прагу и Брно! Если достаточно большая часть населения поддержит их протесты, наше положение в Федерации будет поставлено под угрозу. Мы должны использовать оружие последней инстанции."
 cen.39.a: "Пошлите армию!"
 cen.40.t: "Нам удалось сдержать протесты!""
 cen.40.d: "Протесты были сдержаны!"
 cen.40.a: "Отлично!"
 cen.41.t: "Они наконец-то вымерли."
 cen.41.d: "После нескольких дней, без каких-либо действий со стороны, протесты закончились, и теперь мы можем продолжать наше правление без каких-либо угроз стабильности нашей страны."
 cen.41.a: "Нам даже не нужно было ничего делать!"
 cen.42.t: "Им стало только хуже!"
 cen.42.d: "Плохие новости! что полиция не в состоянии их сдержать! мы должны использовать оружие последней инстанции, иначе наша правящая позиция может оказаться под угрозой!"
 cen.42.a: "Пошлите военных!"
 cen.43.t: "Вооруженное сопротивление!"
 cen.43.d: "Протестующие, услышав новости о том, что армия собирается сдержать их, вооружились и забаррикадировали несколько городов."
 cen.43.a: "Чёртовы повстанцы!"
 cen.44.t: "Республики восстают!"
 cen.44.d: "Ужасные новости! С последними событиями, вызывающими еще больше беспорядков и беспорядков, несколько республик и национальностей объявили независимость от нашей Федерации! Сейчас они формируют ополчения и готовы бороться за свою независимость! Это полная гражданская война!"
 cen.44.a: "Значит, война!"
 cen.45.t: "Южная Нитра требует от нас права отделения!"
 cen.45.d: "Венгерское большинство в Южной Нитре уже давно возмущено тем, что оно является частью нашей федерации, и сегодня они, наконец, потребовали права на отделение и вступление в Венгрию."
 cen.45.a: "Южная Нитра не имеет большого значения."
 cen.45.b: "Мы не будем проявлять страх перед лицом опасности."
 cen.46.t: "Венгрия отступает"
 cen.46.d: "После напряженных нескольких часов венгерское правительство официально отказалось от этого из-за дипломатического давления. Нежелание перерасти в полномасштабную разорванную войну представляется более приоритетной задачей, и это может оказаться полезным в будущем в случае возникновения нового кризиса."
 cen.46.a: "Возможно, Магияр слабее, чем кажется..."
 cen.47.t: "Предложить мирные условия в хижину?"
 cen.47.d: "Мы проигрываем войну против Венгрии, и если мы вскоре не попросим мира, мы можем столкнуться с полным уничтожением, мы должны послать список просьб Венгрии и надеяться, что они примут предложения."
 cen.47.a: "Мы должны стремиться к миру."
 cen.47.b: "Мы никогда не сдадимся!"
 cen.48.t: "Венгрия отвергла наше предложение!"
 cen.48.d: "Ужасные новости, венгерское правительство совершенно отказалось подписать с нами мирный договор."
 cen.48.a: "В бункеры, ребята."
 cen.49.t: "Венгрия просит заключить мирное соглашение."
 cen.49.d: "Венгерская армия в руинах, и война будет победа через несколько недель."
 cen.49.a: "Для сохранения нашей федерации - мир."
 cen.49.b: "Мы должны поставить Магьяра на его место."
 cen.50.t: "Что нам делать с Гайдой?"
 cen.50.d: "На протяжении длительного времени Радола Гайда, один из главных лидеров Чехословацкого легиона, является огромной проблемой для нашей страны. Его националистические взгляды очень опасны для нашей хрупкой федерации, поскольку они приводят к внутренним конфликтам между составными национальностями нашей страны. Когда он становится президентом Чешской Республики, одной из самых важных частей нашей федерации, эта проблема становится не просто настоятельной, чтобы ее решить. Мы должны быстро решить, что нам делать, или следующее, что нас может поразить, это полномасштабная гражданская война."
 cen.50.a: "Арестовать его врасплох."
 cen.50.b: "Убедите Федеральный парламент убрать его."
 cen.51.t: "Беспокойство между Чехословацким Легионом"
 cen.51.d: ""
 cen.51.a: "Разошли эту группу предателей!"
 cen.51.b: "Они должны видеть нашу точку зрения."
 cen.52.t: "Некоторые члены легиона видят нашу точку зрения."
 cen.52.d: ""
 cen.52.a: "Отлично."
 cen.53.t: "Легион устраивает вооруженное восстание!"
 cen.53.d: ""
 cen.53.a: "Пошлите армию!"
 cen.54.t: "Битва при Брно"
 cen.54.d: ""
 cen.54.a: "Мы должны бежать!"
 cen.55.t: "Правительственные силы проиграли битву"
 cen.55.d: ""
 cen.55.a: "Гайда теперь единственный настоящий лидер."
 cen.56.t: "Небольшие протесты вспыхивают по всей стране"
 cen.56.d: ""
 cen.56.a: "Просто подожди, пока они не умрут."
 cen.56.b: "Используйте полицию, чтобы разогнать их."
 cen.57.t: "Протесты закончились."
 cen.57.d: ""
 cen.57.a: "Наконец"
 cen.58.t: "Протесты еще больше разрастаются!"
 cen.58.d: ""
 cen.58.a: "Попытайтесь убедить протестующих"
 cen.58.b: "Пришлите полицию еще раз."
 cen.59.t: "Чешская Республика отказывается сотрудничать!"
 cen.59.d: ""
 cen.59.a: "Они заплатят за это!"
 cen.60.t: "Армия отказывается помочь!"
 cen.60.d: ""
 cen.60.a: "Кто-нибудь на нашей стороне?"
 cen.61.t: "Марш в сторону Брно"
 cen.61.d: ""
 cen.61.a: "Мы должны убежать, пока не стало слишком поздно."
 cen.62.t: "Выступление Гайды в Брно"
 cen.62.d: ""
 cen.62.a: "У Федерации теперь новый лидер."

 l_russian:
 # cen.1 - Slovakians Demonstrate in Bratislava
 cen.1.d: "Напряженность в Братиславе переросла в открытые волнения. Многие словацкие граждане вышли на улицы, требуя более справедливой доли государственного финансирования, более широкого признания культуры и более активного голоса в центральном правительстве. Хотя некоторые военные советники предложили твердое развертывание жандармерии для расчистки площади, это может привести к разрушению хрупкой этнической коалиции, которая держит нашу молодую федерацию вместе. Пока, как представляется, мы должны позволить маршам продолжать и мириться с внутренней нестабильностью как естественным, хотя и разочаровывающим следствием наших демократических институтов."

 # cen.2 - Polish Border Dispute (POL Perspective)
 cen.2.d: "Создание Центральнославского союза полностью изменило традиционный баланс сил вдоль наших южных границ. Ряд исторических территориальных двусмысленностей и переплетающихся этнических анклавов вызвали серьезные трения между нашими пограничниками и их. Наше военное командование сообщает, что стратегическая полоса пограничной территории остается слабо защищенной Федерацией, и мы можем воспользоваться этой возможностью для того, чтобы решительно подтвердить наши исторические требования и перестроить границу в нашу пользу, хотя если мы не будем действовать легко, то это может легко спровоцировать более широкий региональный конфликт."

 # cen.21 - Polish Militia Crosses Disputed Border (CEN Perspective)
 cen.21.d: "Наши наихудшие опасения вдоль северной границы были реализованы. Сообщения о затоплении столицы подтверждают, что вооруженные польские элементы - беззастенчиво поддерживаемые регулярным военным командованием Варшавы - нарушили наши пограничные посты и оккупировали несколько спорных деревень. Это агрессивное вторжение является вопиющим испытанием нашей федеральной решимости. Если мы откажемся сейчас, то целостность всего союза будет подорвана. Однако развертывание армии для того, чтобы жестоко оттолкнуть эти силы, грозит эскалация этой пограничной стычки в полномасштабную войну с Польшей."

 # cen.22 - Poland Wins Border Conflict (POL Perspective)
 cen.22.d: "Яркий триумф на южной границе! Наши тактические операции вдоль границы завершились полным успехом. Федеральные силы Западославии оказались совершенно нескоординированными и неспособными выдержать наши быстрые, решительные маневры. Они официально сняли свои гарнизоны, оставив спорные территории под жесткой властью Польши. Эта победа значительно укрепила национальный моральный дух и доказала миру, что наша армия остается доминирующей силой в Центральной Европе."

 # cen.23 - Poland Loses Border Conflict (POL Perspective)
 cen.23.d: "Бедствия обрушились на наши силы на южной границе, что должно было стать решающим восстановлением границы, переросло в крайне унизительное отвращение, военные Западослава отреагировали с неожиданными темпами и жестокостью, полностью одолев наши отряды и перегонив наших людей через первоначальные границы, а правительство столкнулось с серьезным общественным ударом в связи с этой неудачной игрой, которая серьезно подорвала наше стратегическое положение и повредила нашему международному престижу."

 # cen.3 - Polish Militia Pushes Our Army Back (CEN Perspective)
 cen.3.d: "Наши региональные гарнизоны были полностью пойманы врасплох из-за самого веса и агрессии польского пограничного вторжения. В условиях срывов в области связи и тактических колебаний наши силы были решительно перегружены и вынуждены отступить от спорных секторов. Варшава успешно установила фактическую оккупацию территории. Этот военный провал вызвал шоковые волны через федерацию, серьезно повредив общественной вере в способность центрального правительства защищать свои собственные границы."

 # cen.4 - Our Army Defeated a Polish Militia (CEN Perspective)
 cen.4.d: "Великая победа федеральной армии! когда польская милиция вторглась в наши пограничные посты, наши местные командиры отреагировали с помощью учебников и подавляющей огневой мощи. Враждебные отряды были полностью переброшены через границу в полном беспорядке. Мы успешно обезопасили границу и продемонстрировали, что единое государство обладает как зубами, так и решимостью защищать каждый дюйм своей суверенной территории от иностранной агрессии."

 # cen.5 - German Terrorist (German nationalist detonates bomb in Brno)
 cen.5.d: "Ужасный акт насилия подорвал мир в Брно. Рано утром было взорвано мощное взрывное устройство около известного здания правительственной администрации, что привело к серьезному структурному ущербу и трагическим жертвам среди гражданского населения. Первоначальные расследования, проведенные федеральной разведкой, привели к тому, что заговор был совершен непосредственно в подпольной немецкой националистической ярости, действующей в пределах наших границ. Общественная ярость достигает лихорадки, при этом многие из них указывают пальцы непосредственно в Берлине на поощрение и финансирование этих подрывных пангерманских элементов."


 cen.200.d: "После двух лет приостановленных выборов Стефаник должен выполнить свое обещание восстановить выборы в Западославию после объявления чрезвычайного положения, однако за это время Стефаник стал слабее как перед лицом демократических, националистических и внутренних правительственных движений. В рамках своего собственного правительства многие не желают восстанавливать выборы, в то время как многие строго требуют возвращения к избирательному процессу. В эту динамику входят различные националисты, наиболее воинствующие из которых являются немцы и поляки, однако словаки также в значительной степени оппортунистически. Западославия ходит по краю ножа, и неправильное решение или ни одно вообще не может очертить конец того, что в настоящее время является неудачным проектом."
 #
 cen.201.d: "С восстановлением выборов масс наконец-то получили право голоса в делах наций."
 #
 cen.202.d: "Слабость на высших уровнях власти стала слишком большой для слабой структуры Западославского государства. Правительство в состоянии паралича, местных коммунитов и руководящих органов начали расхищаться и реорганизовываться вокруг новых лидеров. Фантастика Западославского государства была в конечном итоге прекращена на основе словацкой декларации независимости, на смену которой пришел разрыв Западослава Силезии. С Западославом Галисия, отрезанным от ядра, вскоре падет на польское правительство. Стефаника заменили тем, что он не смог сплотить страну, и теперь останки Западославской нации начинают реорганизовываться вокруг чешского государства. Западославия мертв, и теперь мы должны выяснить будущее региона."
 #
 cen.303.d: "Крушение Западославии привело к тому, что доминирующий в Германии район Западослава Силезии был отделен от Чехии, в то время как региональное правительство провозгласило нейтралитет, население призывает к единству, мы должны решить, вмешиваться или нет."

 #
 i_hate_zapadoslavias_shite_code.1.d: "Шокирующее решение Польши о присоединении к Берлину вызвало дрожь по всей Центральной Европе. Наши стратегические расчеты сейчас находятся в неустойчивом состоянии. Баланс сил изменился, и мы оказались в опасном положении. Несмотря на то, что французы, отталкиваясь от этого дипломатического провала, несомненно, ищут новых партнеров. Мы должны решить наш следующий шаг, и быстро."
 #
 i_hate_zapadoslavias_shite_code.2.d: "В свете недавнего предательства Польши [FROM.GetNameDef] мы получили срочное дипломатическое коммюнике."
 #
 i_hate_zapadoslavias_shite_code.3.d: "Наше дипломатическое предложение [FROM.GetNameDef] было успешным! Они официально приняли нашу просьбу присоединиться к их альянсу. Не объединившись с французами, мы можем противостоять любому агрессору, который угрожает нашему суверенитету."
 #
 # --------------------
  # --- NAVY & ECONOMY ---
  # --------------------
  
  CEN_found_navy: "Нашел западославский флот"
  CEN_found_navy_desc: "Мы можем быть страной, не имеющей выхода к морю, но наши амбиции - нет. Великие реки Западославии - Эльбы, Вистулы и Дуная - являются нашими дорогами к морю. Мы начнем с создания "Риврин Флотиллы", "Дунайской гвардии", чтобы патрулировать эти жизненно важные артерии, защищать нашу торговлю и проецировать нашу мощь. Это скромное начало, но каждый великий флот должен начать где-то."
  
  CEN_answer_london_crash: "Ответ на кризис на Лондонском фондовом рынке"
  CEN_answer_london_crash_desc: "Финансовый мир находится в пламени. Крушение Лондонского фондового рынка вызвало шоковые волны по всему миру, и наша экономика, зависимая от экспорта, построенная на промышленной мощи Чехии и Силезии, находится в опасном состоянии. Мы должны действовать решительно, чтобы стабилизировать Коруну, защитить нашу промышленность и не допустить превращения надвигающейся угрозы массовой безработицы в массовые беспорядки."
  
  CEN_decentralisation: "Экономическая децентрализация"
  CEN_decentralisation_desc: "Наша нация представляет собой гобелен различных регионов, от промышленного центра Чехии до обширной земли Галисии. Централизованная «одна модель» экономической политики из Праги неэффективна и порождает недовольство. Мы будем идти по пути децентрализации, расширения возможностей местных органов власти и отраслей для управления своими собственными делами, укрепления региональной специализации и национальной устойчивости."
  
  CEN_foreign_loans: "Иностранные займы"
  CEN_foreign_loans_desc: "Наши амбиции к современному, единому государству велики, но наше казначейство ограничено, чтобы финансировать модернизацию нашей инфраструктуры и развитие нашего сельского восточного региона, мы должны искать за рубежом капитал."
  
  CEN_agricultural_regions: "Развитие сельских районов"
  CEN_agricultural_regions_desc: "В то время как наши западные провинции хвастаются современными фабриками, наши новые восточные территории в Галисии и Словакии оказались в ловушке аграрной нищеты. Этот разрыв является источником нестабильности. Эта программа позволит направить государственные средства в эти «фермерские районы», строительство дорог, школ и мелких предприятий, с тем чтобы вывести наших фермеров из нищеты и создать подлинно единую и сбалансированную экономику."
  
  CEN_industrial_inv: "Промышленные инновации"
  CEN_industrial_inv_desc: "Шкода, Збройовка, ЧКД, Витковица — это имена, пользующиеся уважением во всем мире. Наша промышленная инновация является нашим величайшим достоянием. Этот фокус обеспечит огромные государственные гранты на исследования и разработки, обеспечивая, чтобы "Med in Zapadoslavia" оставалась синонимом качества, точности и технологического превосходства."
  
  CEN_agricultural_output: "Модернизация сельского хозяйства"
  CEN_agricultural_output_desc: "Наши фермеры в Галисии и Словакии по-прежнему используют методы вековой давности, чтобы прокормить наши растущие города, нашу новую армию и нашу промышленную рабочую силу, мы должны "модернизировать фермерство". Мы будем инвестировать в тракторы, химические удобрения и современное сельскохозяйственное образование, чтобы резко увеличить нашу продовольственную продукцию и сделать нашу нацию самодостаточной."
  
  CEN_oil_imports: "Импортировать нефть"
  CEN_oil_imports_desc: "Современная армия и экономика работают на нефти, и у нашей страны почти ничего нет. Мы опасно зависим от наших соседей. Мы должны обеспечить наше будущее, диверсифицировав наш «нефтяной импорт», подписав долгосрочные торговые соглашения с производителями, такими как Румыния и Советский Союз, и создав трубопроводную и хранилищную инфраструктуру для получения этих жизненно важных ресурсов."
  
  CEN_railroads: "Инвестирование в инфраструктуру"
  CEN_railroads_desc: "Наша новая нация представляет собой многообразную структуру старых империй, и ее инфраструктура раздроблена. Старые железнодорожные линии идут в Вену, Берлин или Варшаву, а не друг к другу. Мы начнем масштабный проект по строительству новых, современных железных дорог, связывая наши регионы вместе, перевозя товары с наших восточных ферм на наши западные фабрики и позволяя нашей армии быстро мобилизоваться."
  
  CEN_sudetenland_factories: "Разработать Судетенленд и Слезско"
  CEN_sudetenland_factories_desc: "Судетенленд и наши недавно приобретенные сильезские территории сами по себе являются промышленными державами, но их население отличается друг от друга с культурной точки зрения. Мы должны обеспечить полную интеграцию и развитие этих регионов. Эта программа расширит заводы в Судетенленде и Слезско (Сильезия), задействовав их квалифицированную рабочую силу и промышленный потенциал и доказав, что процветание является наилучшим гарантом лояльности."
  
  CEN_centralisation: "Экономическая централизация"
  CEN_centralisation_desc: "Наше многоэтническое государство хрупкое, оно не может позволить себе неэффективность конкурирующих региональных интересов, мы будем стремиться к "экономической централизации", поставив все ключевые отрасли и экономическое планирование под контроль фирмы, направляющей центральный орган власти в Праге, мы создадим единую, мощную и единую экономику, независимо от того, нравится она регионам или нет."
  
  CEN_autarky: "Автарки"
  CEN_autarky_desc: "Мы окружены потенциальными врагами: Германии, Польшей, Венгрией - никто не может доверять. Нация, опирающаяся на внешнюю торговлю - это нация, которую можно шантажировать. Мы пойдем по пути «Автарки», крепостной экономики. Развив синтетические ресурсы, освоив нашу отечественную индустрию и обеспечив нашу продовольственную безопасность, мы сделаем Западославию самодостаточным бастионом, неуязвимым к блокаде."
  
  CEN_industrial_regions: "Расширение индустриальных гигантов"
  CEN_industrial_regions_desc: "Богемия, Моравия и Силезия - это промышленное сердце нашей страны. Мы удвоим эту силу, увеличив государственные инвестиции в этих "промышленных гигантов". Расширив арсенал Шкоды, оружейные арсеналы Зброевки и металлургические заводы Витковицы, мы создадим арсенал, не сравнимый с Центральной Европой, способный оснащать наши армии и доминировать на экспортном рынке."
  
  CEN_mic: "Военно-промышленный комплекс"
  CEN_mic_desc: "Война — это не просто возможность; это бизнес, и наш бизнес хорош. Мы официально оформим отношения между нашими крупнейшими промышленными фирмами и военными, создав мощный «военный и промышленный комплекс». Шкода и Збройовака будут не просто поставщиками; они станут партнерами, их инновационным и производственным потенциалом, непосредственно связанным со стратегическими целями государства."
  
  CEN_oil_refs: "Словнафт"
  CEN_oil_refs_desc: "Недостаточно импортировать сырую нефть; мы должны сами ее очистить. Мы построим в Словакии крупный новый государственный нефтеперерабатывающий завод «Словнафт», стратегически предназначенный для обработки нефти с юга и востока. Этот завод станет символом нашей промышленной зрелости, давая нам энергетическую независимость и заправляя наши мобильные армии, не полагаясь на иностранные нефтеперерабатывающие предприятия."
  
  CEN_arms_industry_mic: "Экспорт оружия"
  CEN_arms_industry_mic_desc: "Наше оружие является одним из лучших в мире. Почему мы должны держать его для себя? Активно поощряя «экспорт оружия», мы можем финансировать нашу военную модернизацию, получить дипломатические рычаги с другими странами и обеспечить, чтобы наши фабрики всегда работали на пиковой мощности. Пусть мир сражается с винтовками и танками, изготовленными Западославом."
  
  CEN_automobile_industry: "Поддержка автопромышленности"
  CEN_automobile_industry_desc: "Будущее на колесах. Наша нация нуждается не только в танках, но и в грузовиках, автомобилях и тракторах. Мы будем поддерживать автоиндустрию, возглавляемую такими провидцами, как Татра, Прага и Шкода, чтобы стимулировать нашу экономику, улучшить материально-техническое обеспечение и вывести нашу страну на путь процветания."
  
  CEN_civilian_automobile_industry: "Процветание на колесах"
  CEN_civilian_automobile_industry_desc: "Несмотря на то, что потребности армии имеют первостепенное значение, мы не должны забывать о гражданском. &quot; Здоровый &quot; внутренний рынок автомобилей создаст огромный пул квалифицированных механиков и механиков, которые будут поддерживать нашу военную моторизацию в военное время. &quot; Мы обеспечим субсидирование продажи гражданских автомобилей и построим &quot; народную машину &quot; ."
  
  CEN_new_economy: "Новая экономика"
  CEN_new_economy_desc: "Старых способов уже недостаточно. Независимо от того, идет ли речь о центральном планировании, либеральных реформах или о модели корпоратизма, наша страна стоит на грани «новой экономики». Этот последний толчок объединит наши промышленные, сельские и финансовые секторы в единую, современную и мощную экономическую машину."
  
  # --------------------
  # --- POLITICS (General) ---
  # --------------------
  
  CEN_promises_of_democracy: "ОБЯЗАТЕЛЬСТВА ДЕМОКРАТИИ"
  CEN_promises_of_democracy_desc: "Наша нация была основана на идеалах Масарика и Штефаника — «Провидений демократии». Мы являемся многоэтническим бастионом свободы в море растущего авторитаризма. Мы должны подтвердить эти обещания, укрепить наши демократические институты и доказать, что свобода — это не слабость, а наша величайшая сила в объединении наших различных народов."
  
  CEN_free_elections: "Свободные выборы"
  CEN_free_elections_desc: "Голос народа должен быть услышан, ясно и справедливо, мы обязуемся провести «свободные выборы», обеспечивающие гласное и честное голосование, давайте партиям решать свои дела, от аграрных до социал-демократов, от националистов до автономистов, и пусть народ Западославии сам определит свое будущее."
  
  # --------------------
  # --- POLITICS (Autonomist) ---
  # --------------------
  
  CEN_autonomist_win: "Победа коалиции АБ-РСЗМЛ"
  CEN_autonomist_win_desc: "Выборы состоялись, и народ выбрал новый путь. Коалиция аграрных (РСЗМЛ) и автономистских Блоков получила большинство голосов. Их платформа ясна: децентрализация, поддержка фермеров и более широкие права для входящих в их состав регионов - Словаков, Силесов и Галицианцев. Это будет правительство села, а не только пражской элиты."
  
  CEN_agricultural_reforms: "Сельскохозяйственные реформы"
  CEN_agricultural_reforms_desc: "Правительство, руководимое аграрным сектором, выполняет свое основное обещание: мы введем в действие «аграрные реформы», уничтожим старые, неэффективные поместья Габсбургской эпохи и перераспределим землю фермерам."
  
  CEN_rural_education: "Свобода слова"
  CEN_rural_education_desc: "Наша новая коалиция считает, что истинная сила исходит из свободы. Мы гарантируем свободу слова, прекращение политической цензуры прошлого. Кроме того, мы будем вкладывать значительные средства в «Рунское образование», особенно в наших автономных регионах, считая, что образованное, информированное население является единственной подлинной защитой демократии."
  
  CEN_reduce_military_spending: "Сокращение военных расходов"
  CEN_reduce_military_spending_desc: "Наша самая большая угроза — это не иностранная армия, а внутренняя нищета и этнические конфликты. Автономистско-аграрная коалиция считает, что бесконечные военные расходы истощают нашу экономику и пугают наших соседей. Мы сократим военные расходы, перенаправим средства с танков на тракторы и из крепостей в школы. Мы будем стремиться к миру на основе процветания."
  
  CEN_reduce_regulations: "Регулирование сокращения выбросов"
  CEN_reduce_regulations_desc: "Тяжелая рука бюрократии Праги подавляет инновации, особенно в наших нечешских регионах. Чтобы высвободить силу нашей экономики, мы должны «уменьшеть правила». Устранив бюрократию и упрощая налоговый кодекс, мы будем поощрять предпринимателей и малые предприятия к процветанию."
  
  CEN_close_unprofitable_business: "Закрыть неприбыльные предприятия"
  CEN_close_unprofitable_business_desc: "Государство не может позволить себе поддерживать неудачи прошлого. Мы должны "заблокировать неприбыльный бизнес", особенно неэффективные государственные охотники. Эта "шоковая терапия" будет болезненной, но она освободит капитал и рабочую силу для новых, более продуктивных предприятий."
  
  CEN_autonomist_question: "Вопрос автономиста"
  CEN_autonomist_question_desc: "Как мы уравновешиваем требования словаков, немцев, Галицианцев и Силесов с потребностью в сильном государстве? Новое правительство должно найти долговременный ответ, который обеспечит местное самоуправление, не прибегая к анархии или иностранному вмешательству."
  
  CEN_puppet_independence: "Политическая независимость"
  CEN_puppet_independence_desc: "Возможно, единственный способ удовлетворить автономистов — это дать им то, чего они действительно хотят: «Политическая независимость». Мы можем реорганизовать Западославию не как унитарное государство, а как свободную конфедерацию независимых государств — Богемии, Словакии, Галисии — только с помощью общей обороноспособности и экономической политики."
  
  CEN_autonomy_within: "Автономия внутри"
  CEN_autonomy_within_desc: "Полная независимость - это путь к разрушению, приглашая наших врагов разбирать нас по отдельности. Более умеренный путь - это "Автомия внутри". Мы дадим нашим составным регионам - Словакии, Силезии, Галисии - их собственным региональным диетам и губернаторам, давая им контроль над местными делами, такими как образование и полиция, в то время как Прага сохраняет контроль над обороной, внешней политикой и национальным бюджетом."
  
  CEN_sudetenland_question: "Обсуждение в Судене"
  CEN_sudetenland_question_desc: "«Судтенлендские дебаты» становятся все громче с каждым днем, немцы из наших приграничных регионов, взволнованные Берлином, требуют автономии или даже отделения, мы не можем игнорировать их, они жизненно важны для нашего государства, мы должны найти политическое решение, которое предоставит им права, не нанося ущерба нашей безопасности."
  
  CEN_lemkowina_question: "Дискуссия в Галисии"
  CEN_lemkowina_question_desc: "Поляки на наших новых территориях смотрят на Варшаву, в то время как украинцы и Лемкос пойманы между Прагой, Варшавой и Москвой."
  
  CEN_zapadoslav_confederation: "Западославская конфедерация"
  CEN_zapadoslav_confederation_desc: "Заключительный акт автономного правительства: мы официально распустим унитарное государство и объявим Конфедерацию Западослава. Чехия, Моравия, Словакия, Силезия и Галисия станут равными, самоуправляющимися государствами, объединенными под единым флагом. Мы молимся, чтобы эта новая модель федеративной демократии стала нашим спасением."
  
  # --------------------
  # --- POLITICS (German Puppet) ---
  # --------------------
  
  CEN_submission_to_germany: "Представление Германии"
  CEN_submission_to_germany_desc: "Немецкий рейх является новой державой в Европе, и мы стоим на ее пути. Путь "Подарок в Германию" горький, но он единственный, который обеспечивает наше выживание. Мы уступим Судетеленду, приведем нашу политику в соответствие с Берлином и станем верным партнером Рейха. Лучше быть живым слугой, чем мертвым хозяином."
  
  CEN_czech_shield_coup: "Хлебичкова Аффера Послемата"
  CEN_czech_shield_coup_desc: ""Chlebíckova Affera" (Sandwish Affair) было лишь началом. Слабость правительства перед лицом немецкого давления и внутреннего инакомыслия невыносима. Армия, возглавляемая патриотическими офицерами, решила действовать. "Последние" этого переворота - это новое авторитарное правительство, " Чешский щит", посвященный прежде всего национальной обороне и порядку."
  
  CEN_czech_germany_party: "Ведущий СНЮ"
  CEN_czech_germany_party_desc: ""SNSJ" (Strana Národniho Sjednocení a Jistoty - Партия национального единства и безопасности) в настоящее время является главным, родившимся в результате переворота, это не партия политиков, а солдат, промышленников и патриотов, они разрушат неисправимую демократическую систему и заменят ее авторитарным, корпоратистским государством, лазерно ориентированным на национальное выживание и согласующимся с германскими интересами."
  
  # --------------------
  # --- POLITICS (Social Democrat) ---
  # --------------------
  
  CEN_soc_dem_win: "Победа в НСП"
  CEN_soc_dem_win_desc: "Народ проголосовал за «национал-социалистский путь» — не германскую модель, а нашу собственную смесь социальной справедливости и национальной гордости — мы создадим сильное, социально осознанное государство, которое обеспечит свой народ, защищая при этом его независимость от всех угроз, фашистов или коммунистов."
  
  CEN_ban_paramilitaries: "Организация Запрет на военные действия"
  CEN_ban_paramilitaries_desc: "Нашу демократию разрывают на части люди в цветных рубашках. Немецкие* Фрейкорпы* Польские* Стрелси* Словацкие* Хлинка Гвардия*... эти частные армии являются раком на республике. Мы будем "Безнарушать паравоенные организации", разоружать их и восстанавливать монополию государства на насилие. В Западославии будет только одна армия: наша."
  
  CEN_minimum_wage: "Минимальная заработная плата"
  CEN_minimum_wage_desc: "Трудящиеся не могут быть хорошими гражданами, если они голодают. Мы установим национальную "минимальную заработную плату", гарантирующую каждому трудящемуся справедливую заработную плату за дневную работу. Это не только сократит нищету, но и поднимет экономику за счет увеличения потребительских расходов."
  
  CEN_women_workforce: "Женщины на рынке труда"
  CEN_women_workforce_desc: "Наша страна не может позволить себе потерять половину своего таланта, и мы не можем отказать им в их правах. Мы начнем кампанию по привлечению женщин в рабочую силу, открытию новых рабочих мест на фабриках и в администрации, гарантированию равной оплаты труда и обеспечению государственного ухода за детьми. Современная нация нуждается в современных женщинах."
  
  CEN_administrative_reforms: "Административные реформы"
  CEN_administrative_reforms_desc: "Наше государство по-прежнему работает по старой, дерзкой бюрократической модели Габсбургов, которая еще больше осложняется нашими новыми территориями. Мы должны ввести "Административные реформы", упорядочить наше правительство, оцифровать наши записи и создать современную, эффективную и основанную на заслугах гражданскую службу, которая в равной степени обслуживает всех граждан."
  
  CEN_support_public_sector: "Поддержка государственного сектора"
  CEN_support_public_sector_desc: "Свободный рынок не может решить все проблемы, особенно в столь разнообразной стране, как наша. Мы будем «поддерживать государственный сектор», инвестировать в государственные предприятия для таких важнейших отраслей, как энергетика, транспорт и здравоохранение, обеспечивая, чтобы эти жизненно важные услуги служили интересам людей, а не только частной прибыли."
  
  CEN_healthcare_reform: "Реформа системы здравоохранения"
  CEN_healthcare_reform_desc: "Здоровая нация - это сильная нация. Наша нынешняя система здравоохранения представляет собой разрозненную систему частных и религиозных благотворительных организаций, оставляя позади нашу сельскую местность на востоке. Мы введем всеобъемлющую «реформу здравоохранения», построим новые государственные больницы и клиники в Словакии, Силезии и Галисии."
  
  CEN_new_insurance: "Новый закон о страховании"
  CEN_new_insurance_desc: "Болезнь или травма не должны означать финансового краха. Следуя наиболее прогрессивным социальным моделям, мы будем осуществлять "Новый закон о страховании", национальную программу социального страхования, которая обеспечивает всем гражданам пособия по безработице, несчастным случаям и старости. Государство будет заботиться о себе."
  
  CEN_welfare_state: "Государство благосостояния"
  CEN_welfare_state_desc: "Это кульминация нашего социально-демократического видения. Мы построили подлинное "государство безопасности", нацию, которая обеспечивает безопасность своим гражданам от колыбели до могилы. Мы доказали миру, что демократия может обеспечить процветание и справедливость для простого человека, светящийся маяк против тьмы фашизма и коммунизма."
  
  # --------------------
  # --- POLITICS (National Conservative) ---
  # --------------------
  
  CEN_soc_con_win: "Победа в НС"
  CEN_soc_con_win_desc: "Партия Národni Sjednoceni (Национальное единство) выиграла выборы, народ выбрал путь стабильного, консервативного и патриотического руководства, мы положим конец радикальным социальным экспериментам и слабому федерализму, мы сосредоточимся на управлении, финансовой ответственности и укреплении наших национальных институтов под твердой, центральной рукой."
  
  CEN_ensure_parliament_dominance: "Доминирование в парламенте"
  CEN_ensure_parliament_dominance_desc: "Президент накопил слишком много власти, мы парламентская республика, и "парламент" должен быть доминирующей силой, мы проведем реформы, направленные на укрепление поста премьер-министра и обеспечение того, чтобы исполнительная власть была полностью подотчетна народным избранным представителям."
  
  CEN_kramar_decrees: "Крамарские указы"
  CEN_kramar_decrees_desc: "Вдохновленные нашим первым премьер-министром Карелом Крамаршем, мы издадим серию «Крамарских указов». Это общесмысленная, дружелюбная политика, направленная на стабилизацию Коруны, балансирование бюджета и восстановление доверия к нашей экономике. Эпоха безрассудных социальных расходов окончена."
  
  CEN_banking_reform: "Банковская реформа"
  CEN_banking_reform_desc: "Сильная нация нуждается в сильной валюте и стабильной финансовой системе. Мы введем в действие широкомасштабную «Банкингскую реформу», укрепив наш национальный банк, увеличив потребности в резервах и подавив спекуляцию. Это защитит нашу экономику от финансовых потрясений и иностранных манипуляций."
  
  CEN_support_private_sector: "Поддержка частного сектора"
  CEN_support_private_sector_desc: "Это предприниматель, а не бюрократ, который создает богатство. Мы будем «поддерживать частный сектор», предлагая налоговые льготы и субсидии нашим отечественным предприятиям, особенно нашим промышленным гигантам."
  
  CEN_land_reform: "Земельная реформа"
  CEN_land_reform_desc: "Старая система земли Габсбурга - это реликвия. Мы должны ввести умеренную «Ленд-реформу». Это будет не радикальная коллективизация, а юридическое, компенсирующее перераспределение чрезмерно крупных непродуктивных земель мелким фермерам и легионарным ветеранам, создавая новый класс гордых патриотов, владеющих землей."
  
  CEN_business_connections: "Деловые связи"
  CEN_business_connections_desc: "Наше правительство и наша промышленность должны работать в гармонии. Мы будем развивать глубокие деловые связи, помещать лидеров, выступающих за бизнес, на ключевые министерские посты и обеспечивать, чтобы государственная политика всегда соответствовала потребностям наших великих корпораций. Что хорошо для Шкоды, это хорошо для Западославии."
  
  CEN_effective_bureaucracy: "Эффективная бюрократия"
  CEN_effective_bureaucracy_desc: "Наше консервативное правительство будет "Эффективной бюрократией". Мы будем управлять государством, как хорошо управляемая компания, устраняя отходы, увольняя излишних должностных лиц, и обеспечивая, чтобы каждый Коруна денег налогоплательщиков расходовался разумно."
  
  CEN_stable_federation: "Стабильная федерация"
  CEN_stable_federation_desc: "Благодаря разумному управлению, экономическому процветанию и твердой руке мы создали «стабильную федерацию». Автономистская агитация успокоилась, экстремисты молчат. Наше многоэтническое государство доказало свою жизнеспособность, маяк стабильности в хаотичной Европе."
  
  # --------------------
  # --- POLITICS (Authoritarian/Štefánik) ---
  # --------------------
  
  CEN_staged_rajda_coup: "Гайда Афера"
  CEN_staged_rajda_coup_desc: "Генерал Радола Гайда, национальный герой и опасный радикал, сделал свой шаг против республики, мы позволим его перевороту пройти достаточно далеко, чтобы создать кризис, прежде чем сокрушить его и использовать хаос в качестве предлога для захвата чрезвычайных сил. Народ, испуганный фашизмом Гайды, будет приветствовать наш «умеренный» авторитаризм."
  
  CEN_prolong_state_of_emergency: "Длительное чрезвычайное положение"
  CEN_prolong_state_of_emergency_desc: "Кризис, вызванный "Гайдской аферой", не закончился. Угроза экстремизма, как левой, так и правой, сохраняется. Парламент слишком слаб, чтобы справиться с ним. Мы должны "надолго продлить чрезвычайное положение", дав правительству право править декретом, обойти законодательную власть и восстановить порядок любыми необходимыми средствами."
  
  CEN_stefanik_brno_speech: "Речь Брно"
  CEN_stefanik_brno_speech_desc: "Генерал Милан Растислав Штефаник, герой основания нашей нации, принес громкий "Пик в Брно". Он кастрировал коррумпированных политиков, ссоряющихся партий, и внутреннюю слабость, которая угрожает разрушить наше многоэтническое государство. Он призвал к созданию нового правительства, единого национального единства, возглавляемого сильной рукой. Армия и народ услышали его призыв."
  
  CEN_disband_parliament: "Десгородный парламент"
  CEN_disband_parliament_desc: "Это башня Вавилона, где немцы, поляки, словаки и чехи ничего не делают, кроме как спорят, пока наши враги кружат. Мы отправим политиков домой. Сейчас правительство будет управляться кабинетом экспертов и патриотов, подотчетным только нации."
  
  CEN_police_reforms: "Реформа полиции"
  CEN_police_reforms_desc: "Наше новое государство требует нового типа полиции: не только офицеров, чтобы поймать воров, но и «Политической реформы», которая создает сильную, централизованную и преданную государственную службу безопасности."
  
  CEN_ensure_army_loyalty: "Обеспечение лояльности армии"
  CEN_ensure_army_loyalty_desc: "Армия является основой нашего нового государства, и ее преданность должна быть вне всякого сомнения. Мы будем «обеспечивать верность армии» путем очищения офицеров сомнительной политической принадлежности, поощрения патриотов, лояльных новому режиму, и расширения влияния военных на правительство. Армия и государство будут единым целым."
  
  CEN_crackdown_opposition: "Срыв оппозиции"
  CEN_crackdown_opposition_desc: "Время для дебатов закончилось. Мы "Покончим с оппозицией", запретим все социалистические, либеральные и этнические партии. Их лидеры будут арестованы, их газеты будут закрыты. В Западославии есть только одна воля: воля государства."
  
  CEN_political_censorship: "Цензура печати"
  CEN_political_censorship_desc: "Свободная пресса — это оружие, используемое нашими врагами для распространения лжи и раскола. Мы будем осуществлять полную «цензуру прессы». Все газеты, радио и кино будут получать одобрение государства. Средства массовой информации больше не будут сообщать о новостях; они будут создавать национальный консенсус."
  
  CEN_limit_parliament: "Упразднять парламент"
  CEN_limit_parliament_desc: "Парламент - это реликвия, мы будем "издать парламент" в целом, местные советы будут заменены назначенными администраторами. Сложный, неэффективный механизм демократии будет заменен чистой, простой и эффективной системой подчинения. Вся власть будет стекать сверху."
  
  CEN_improve_workers_soldiers: "Трудящиеся и солдаты"
  CEN_improve_workers_soldiers_desc: "Наше новое государство - это соглашение между "работниками и солдатами". Мы докажем свою ценность людям, построив новое жилье для рабочих, финансируя социальные программы и гарантируя занятость на наших новых государственных фабриках. Взамен они отдадут нам свою преданность и свой труд. Справедливую торговлю."
  
  CEN_stefanik_mobilization: "Мобилизовать народ"
  CEN_stefanik_mobilization_desc: "Видение Штефаника - это народ, обладающий оружием. Мы "мобилизуем Нацию", а не только армию. Каждый цицитен будет иметь свою роль, каждая фабрика - квоту. Мы начнем широкомасштабную программу перевооружения, превратив Западославию в неприступную крепость, "Спарта Запада"."
  
  CEN_napoleon_III-ish: "Конституционный референдум"
  CEN_napoleon_III-ish_desc: "Мы проведем «Конституционный референдум», плебисцит в стиле Наполеона III. Людям будет предложено утвердить нашу новую, сильную конституцию. Когда пресса будет контролироваться и оппозиция замолчит, мы уверены, что они сделают «правильный» выбор."
  
  # --------------------
  # --- POLITICS (Communist) ---
  # --------------------
  
  CEN_abandon_panslavic_ambitions: "Сохранять статус Quo"
  CEN_abandon_panslavic_ambitions_desc: "Пан-Славизм - это буржуазное, националистическое отвлечение, единственное истинное братство - это братство трудящегося, мы оставим статус-кво на наших границах и откажемся от этих романтических, империалистических амбиций, мы должны сосредоточиться на классовой борьбе дома, а не на освобождении наших "славянских братьев" пулями."
  
  CEN_mission_to_moscow: "Поездка в Москву"
  CEN_mission_to_moscow_desc: "Настало время официально оформить нашу идеологическую верность, мы отправим "Миссия в Москву", чтобы встретиться с советским руководством, мы представим себя как преданные товарищи в международной борьбе, ищем руководства, поддержки и признания со стороны родины революции."
  
  CEN_soviet_friends: "Советские друзья"
  CEN_soviet_friends_desc: "Наша миссия была успешной. Москва признает нас как "советских друзей". Эти новые отношения откроют дверь советским советникам, торговым и техническим экспертам, которые помогут нам преобразовать нашу республику в подлинно народную демократию, руководствуясь принципами марксизма-ленинизма."
  
  CEN_purge_legion: "Легион Церковь"
  CEN_purge_legion_desc: "Западославская легионарская традиция - это рак. Мужчины, такие как Гайда и Штефаник, реакционные, «белые» герои, а не пролетарианцы. Мы должны «добить влияние Легиона от нашей армии, убрать этих буржуазных офицеров и заменить их верными, политически достоверными товарищами из рабочего класса."
  
  CEN_soviet_military_industrial_cooperation: "Сотрудничество с Советским Союзом"
  CEN_soviet_military_industrial_cooperation_desc: "Мы приведем наше военное производство в соответствие с Советским Союзом. Это сотрудничество с Советскими Союзами позволит нам построить их танки и самолеты по лицензии. Наши фабрики Шкоды произведут Т-26, а наши заводы Авии построят I-16, объединив нашу промышленную мощь для грядущей мировой революции."
  
  CEN_peoples_army: "Народная армия"
  CEN_peoples_army_desc: "Наша новая армия будет не инструментом буржуазии, а «Народной армией». Политические комиссары будут прикреплены к каждому подразделению, обеспечивая идеологическое соответствие и высокий моральный дух. Армия будет продолжением партии, ее солдат, вооруженных винтовками в одной руке, и марксистской теорией в другой."
  
  CEN_planned_economy: "Запланированная экономика"
  CEN_planned_economy_desc: "Беспорядок свободного рынка неэффективен и несправедлив. Мы будем осуществлять «планированную экономику». Новый государственный комитет, «Госплан» для Западославии, установит производственные квоты, выделит ресурсы и направит всю промышленную и сельскохозяйственную деятельность на достижение единственной цели построения социализма."
  
  CEN_join_soviet: "Присоединяйтесь к международной организации"
  CEN_join_soviet_desc: "Мы готовы сделать последний шаг. Мы официально попросим "Join The Internationale", полностью присоединив нашу нацию к Советскому Союзу. Мы будем самым западным бастионом Коминтерна, кинжалом, направленным в сердце капиталистической Европы."
  
  CEN_soviet_expedition: "Советская экспедиционная сила"
  CEN_soviet_expedition_desc: "Будучи верными членами Коминтерна, мы будем приветствовать «советские экспедиционные силы» на нашей земле."
  
  CEN_soviet_research: "Соглашение об исследованиях"
  CEN_soviet_research_desc: "В Советском Союзе есть самые лучшие ученые в мире. Мы подпишем "Соглашение об исследованиях" и создадим совместный научный институт, который будет делиться всеми нашими технологическими достижениями. Их теории и наша индустрия будут непобедимой комбинацией."
  
  CEN_liberate_slovakia: "Освободить Южную Словакию"
  CEN_liberate_slovakia_desc: "Ортийский режим в Венгрии жестоко угнетает наших словацких и славянских братьев в "Южной Словакии". Пришло время "освободить" их. Народная армия будет мобилизована, чтобы вернуть эту землю и привести своих рабочих в наш социалистический рай."
  
  CEN_strike_serbia: "Освобожденные сербские рабочие"
  CEN_strike_serbia_desc: "Режим в Белграде притворяется «Югославом», но это не что иное, как сербская королевская диктатура, «тюрьма наций». Мы должны «освободить сербских рабочих» и всех других угнетенных южных славян от их реакционных хозяев."
  
  CEN_strike_bulgaria: "Освободить Болгарию"
  CEN_strike_bulgaria_desc: "«Царь» в Болгарии — немецкий марионетка, фашистский угнетатель пролетариата. Мы «Освободим Болгарию», поддержим наших товарищей в болгарской коммунистической партии и введем весь Балканский полуостров в революционный строй."
  
  CEN_liberate_italian_slavs: "Славное меньшинство в Италии"
  CEN_liberate_italian_slavs_desc: "«Славное меньшинство в Италии» — словенцы и хорваты под ботинком Муссолини — страдают от фашистского террора. Как ведущее социалистическое государство славянского происхождения, мы обязаны освободить их. Революция должна быть доведена до границ Адриатики."
  
  CEN_liberate_galicia: "Спрос на Галицию"
  CEN_liberate_galicia_desc: "Наш народ уже владеет частью Галисии, но остальные находятся под гнетущим режимом, в котором доминируют владельцы жилья в Польше, и мы воссоединим Галицианский пролетариат и поставим весь стратегический регион под наш контроль."
  
  CEN_liberate_transylvania: "Нападение на румынских капиталистов"
  CEN_liberate_transylvania_desc: "Трудящиеся и фермеры Трансильвании, будь то румынские, венгерские или славянские, эксплуатируются "румынскими капиталистами" и мальчишками в Бухаресте."
  
  # --------------------
  # --- POLITICS (Western Diplomacy) ---
  # --------------------
  
  CEN_sudetenland_compromise: "Компромиссировать над Судененой"
  CEN_sudetenland_compromise_desc: "Голос Берлина с каждым днем становится громче и все более угрожающим. Возможно, прямая конфронтация - это не самый мудрый путь. "Компромисс над Судетенлендом" может быть достигнут. Предлагая значительную автономию и, возможно, даже уступая какую-то пограничную территорию, мы можем купить мир для нашего времени. Горький, но прагматичный выбор."
  
  CEN_seek_industrial_help: "Поиск помощи в промышленности"
  CEN_seek_industrial_help_desc: "Наша экономика нуждается в старте, и западные демократии имеют столицу и необходимый нам опыт. Мы будем "поискивать промышленную помощь" из Парижа, Лондона и Нью-Йорка, предлагая своим корпорациям инвестировать в наши фабрики и помогать нам модернизировать нашу промышленность."
  
  CEN_latin_friends: "Латиноамериканские друзья"
  CEN_latin_friends_desc: "Франция является нашим традиционным защитником, архитектором «Маленькой связи». Мы должны подтвердить эту дружбу. Укрепив наши связи с нашими «латинскими друзьями» в Париже, мы можем построить континентальный блок, чтобы сдержать германскую агрессию."
  
  CEN_latin_factories: "Контракты на оборону Франции"
  CEN_latin_factories_desc: "Французская оружейная индустрия - это мировой класс. Мы подпишем "Французские оборонные контракты", пригласим такие компании, как Рено и Шнайдер, построить новые фабрики в Западославии. Они принесут свои передовые проекты для танков и артиллерии, укрепив нашу армию и наш союз."
  
  CEN_latin_rifles: "латинское оборудование"
  CEN_latin_rifles_desc: "Наша армия нуждается в современном оборудовании, быстро. Мы покупаем «латинское оборудование» непосредственно из Франции, чтобы обойти длительный процесс НИОКР. Новые винтовки, артиллерия и танки будут поступать в наши войска, оплаченные французскими займами."
  
  CEN_french_forts: "Укрепление знаний"
  CEN_french_forts_desc: "Французы - мастера современного "Укрепления". Их волшебная линия является свидетельством военной инженерии. Мы пригласим их инженеров поделиться с нами своим "Знанием", помогая нам в проектировании и строительстве нашей собственной линии укреплений на немецкой границе. Западославская стена продержится."
  
  CEN_join_france: "Присоединяйтесь к Кордиале"
  CEN_join_france_desc: "Наша судьба будет неразрывно связана с Францией; их безопасность будет нашей безопасностью, а их война будет нашей войной."
  
  CEN_british_friends: "Британские друзья"
  CEN_british_friends_desc: "В то время как Франция является нашим другом на континенте, Великобритания управляет волнами и мировыми финансами, мы должны развивать «британские друзья», отправляя в Лондон дипломатическую миссию, чтобы подчеркнуть наши общие демократические ценности и нашу позицию как бастиона против фашизма."
  
  CEN_british_dockyards: "Контракты на оборону Великобритании"
  CEN_british_dockyards_desc: "Королевский флот является самым крупным в мире, хотя у нас нет побережья, британская судостроительная индустрия беспрецедентна, мы подпишем "Британские оборонные контракты", пригласив их экспертов помочь нам построить наши речные флотилии и продать наши промышленные товары для британского военно-морского опыта."
  
  CEN_british_air_cooperation: "British Air Cooperation ( Британское воздушное сотрудничество )"
  CEN_british_air_cooperation_desc: "Королевские военно-воздушные силы - это грозная, современная боевая сила. Через "Британское воздушное сотрудничество" мы обменяемся пилотами и дизайнерами, изучая их программы "Хуррикана" и "Спитфайр", чтобы улучшить наших собственных бойцов Авиа."
  
  CEN_british_paratrooper_and_pilot_schools: "Школа парашютной подготовки"
  CEN_british_paratrooper_and_pilot_schools_desc: "Британцы являются первопроходцами в новых формах войны, включая воздушные войска."
  
  CEN_join_uk: "Присоединиться к Имперскому альянсу защиты"
  CEN_join_uk_desc: "Наши интересы полностью совпадают с интересами Британской империи, мы станем их непоколебимым союзником на континенте, мы будем "приходить в Имперский альянс защиты", стоять с британским львом, защищая свободу и баланс сил в Европе."
  
  CEN_entente_troops_request: "Запрашиваю экспедиционную силу"
  CEN_entente_troops_request_desc: "Мы не можем в одиночку столкнуться с немецкой военной машиной, мы должны «затребовать у наших французских и британских союзников экспедиционную силу», попросив их отправить на нашу землю разногласия до того, как начнется война, чтобы мы стояли вместе с нашей армией в качестве путешественника и сдерживающего фактора."
  
  # --------------------
  # --- POLITICS (Fascist/Gajda) ---
  # --------------------
  
  CEN_rajda_strikes_back: "Марш Гайда"
  CEN_rajda_strikes_back_desc: ""Gajda Affare" - это не неудача, это была репетиция. Правительство слабо, люди разделены, и армия неуравновешена. Радола Гайда, наш "украденный" национальный герой, не будет отвергнута. Его "Gajda March" в Праге начинается, и на этот раз патриотические силы нации маршируют с ним."
  
  CEN_rally_the_nation: "Объединить народ"
  CEN_rally_the_nation_desc: "Гайда захватила власть! Теперь он должен ее обезопасить. Он будет "Нацию" серией громких речей, призывающих положить конец этническому расколу, политической коррупции и "Джудео-Большевизму". Он обещает новое, сильное и чисто славянское государство."
  
  CEN_meet_corporations: "Встретимся с корпорациями"
  CEN_meet_corporations_desc: "Новое государство нуждается в новой экономике. Правительство Гайды будет "Встретиться с корпорациями". Мы предложим нашим великим промышленникам - Шкоде, Бая, Збройовке - сделку: вы будете иметь порядок, стабильность и конец забастовкам. Взамен вы создадите арсенал для нашего нового панславского видения. Это не просьба."
  
  CEN_rajda_mobilization: "Мобилизовать народ"
  CEN_rajda_mobilization_desc: "Время для разговоров закончилось. Нация должна быть встроена в оружие. Мы "мобилизуем нацию" и создадим программу полной, воинственной мобилизации. Каждый гражданин будет работать, тренироваться и жертвовать ради предстоящей борьбы. Наша судьба ждет."
  
  CEN_tomas_bata_proporsal: "Предложение Томас Баша"
  CEN_tomas_bata_proporsal_desc: "Томас Баша, «Шоу-Кинг» Злина, является не просто индустриалистом; он является провидцем социального корпоративизма. Его «предложение» состоит в том, чтобы реорганизовать всю национальную экономику по модели его компании — автономной, эффективной и корпоратистской системы. Мы примем эту модель, сделав Башу архитектором нашей новой экономики."
  
  CEN_purge_stefanik_clique: "Уничтожить клик Штефаника"
  CEN_purge_stefanik_clique_desc: "Армия не полностью лояльна. Призрак Штефаника и его "умеренный" офицер Клик до сих пор преследуют генеральный штаб. Мы должны "похитить Клик Штефаника", убрать этих неуверенных, демократизированных офицеров и заменить их истинными верующими в видении Гайды."
  
  CEN_absolute_media_control: "Абсолютный контроль средств массовой информации"
  CEN_absolute_media_control_desc: "Люди должны услышать только один голос. Мы возьмем "Absolute Media Control", национализируя все газеты, радиостанции и киностудии. Министерство Пропаганды обеспечит, чтобы каждое произносимое и напечатанное слово укрепляло национальную волю."
  
  CEN_purge_socialists_and_liberals: "Хирурги-социалисты и либералы"
  CEN_purge_socialists_and_liberals_desc: "Внутренние враги должны быть уничтожены. Мы будем "Роздить социалистов и либералов", запускать "Броун Террор" против всех остатков старого, декадентского режима. Коммунисты, социальные демократы и слабые либералы будут собраны и отправлены в новые лагеря "работа по перевоспитанию"."
  
  CEN_expand_slovansky_sbor: "Расширить Slovansky Sbor"
  CEN_expand_slovansky_sbor_desc: ""Словански Сбор" (Славский корпус) - это преданное ополчение Гайды, железный кулак партии. Мы будем "разыскивать" эту организацию, превращая ее в новую государственную службу безопасности и военную элиту, "SS" для Западославии, обеспечивая контроль партии над каждой улицей и деревней."
  
  CEN_secret_police: "Создание секретной полиции"
  CEN_secret_police_desc: "Нам нужна организация, чтобы присматривать за стражами. Мы создадим секретную полицию, новую разведывательную службу, преданную только самой Гайде. На нее будут возложены задачи по охоте на шпионов, раскрытию заговоров и устранению всех возможных угроз лидеру."
  
  CEN_merge_party_with_state: "Объединение сторон с государством"
  CEN_merge_party_with_state_desc: "Не может быть различия между правящей партией и правительством. Мы будем "Сержантская партия с государством". Должностные лица партии будут руководить правительственными министерствами, партийные ячейки будут формироваться на каждом заводе и армейском подразделении. Западославия и движение Гайды станут одним и тем же."
  
  # --------------------
  # --- POLITICS (Fascist/Pan-Slav) ---
  # --------------------
  
  CEN_panslavic_ambition: "Панславская амбиция"
  CEN_panslavic_ambition_desc: "Наше "славянское" состояние неполное. Мы окружены миллионами наших братьев, живущих под иностранным гнетом. Мы должны принять наше "панадославское амбиция". Западославия будет "пидмонтом" славян, железным ядром, вокруг которого будет создана новая великая славянская империя, от Эльбы до Днепра, от Балтии до Адриатики."
  
  CEN_slav_research: "Всеславский институт"
  CEN_slav_research_desc: "Если мы хотим стать лидерами славян, мы должны быть их интеллектуальным центром. Мы создадим "Всеславский институт" в Праге, большой университет и исследовательский центр, посвященный истории, языку и технологии славян. Здесь соберутся лучшие умы славянского мира."
  
  CEN_demand_slovakia: "Спрос на южную Словакию"
  CEN_demand_slovakia_desc: "Наши словацкие братья по-прежнему страдают под венгерским ярмо на юге. Мы будем "Демондировать Южную Словакию", выдавая ультиматум Будапешту. Настало время воссоединить всех словаков под одним флагом, дипломатией или силой."
  
  CEN_question_polish: "Польский вопрос"
  CEN_question_polish_desc: ""Польский вопрос" сложный: они славяне, но они и наши соперники, держащие земли в Силезии и Галисии, которые по праву наши. Мы должны решить: братья ли они наши или они наша первая цель?"
  
  CEN_solve_polish_problems: "Разрешите наши конфликты"
  CEN_solve_polish_problems_desc: "Наши пограничные споры с Польшей являются источником слабости для всей славянской расы, проблемы, которой наслаждаются только наши враги. Мы будем «устранять наши конфликты», предлагая постоянный пограничный договор. Возможно, уступка здесь, компромисс там, будет ценой для мощного нового союзника."
  
  CEN_invite_poland_slavic: "Приглашать Польшу"
  CEN_invite_poland_slavic_desc: "С урегулированием пограничных споров, мы "привлечем Польшу" в наш новый Панславский союз вместе, наши две нации могут создать нерушимую стену, "Мидзиморз" западных славян, достаточно сильный, чтобы бросить вызов как Берлину, так и Москве."
  
  CEN_slavic_plane: "Предложение Avia-PZL"
  CEN_slavic_plane_desc: "Польская PZL и наша собственная Авиа являются мастерами в проектировании самолетов. Мы сделаем предложение: совместное предприятие Avia-PZL для разработки следующего поколения славянских самолетов, сочетающих их маневренность с нашими мощными двигателями. Истребитель для всех славян."
  
  CEN_support_polish_claims: "Поддержка польских претензий"
  CEN_support_polish_claims_desc: "В знак нашего нового братства мы будем «поддерживать польские притязания» на их потерянные территории, будь то Данциг, Померания или земли на востоке. Нападение на Польшу — это нападение на всех нас."
  
  CEN_claim_polish_lands: "&quot; Северные земли &quot;"
  CEN_claim_polish_lands_desc: "Польша - это неудачное государство, угнетающее свои украинские и белорусские меньшинства и безрассудно противодействующее своим соседям. Это не достойный партнер. Мы заявим "Северные земли", утверждая наши исторические права на Силезию и Галицию. Если они не присоединятся к нам, они будут поглощены нами."
  
  CEN_demand_polish_submission: "Спрос на представление материалов Польшей"
  CEN_demand_polish_submission_desc: "Время для игр закончилось. Мы отправим ультиматум в Варшаву. Они либо примут руководство Праги, либо станут протектором, либо будут раздавлены всей мощью Западославской армии."
  
  CEN_integrate_polish_economy: "Объединить польскую промышленность"
  CEN_integrate_polish_economy_desc: "С учетом того, что Польша находится под нашим контролем, мы должны "Мергест Польской Индастриз". Их огромные угольные и сельскохозяйственные земли будут интегрированы с нашими заводами, создавая единый, самодостаточный экономический блок. "Центральный промышленный регион" теперь будет работать в Праге."
  
  CEN_forceful_polish_conscription: "Принуждение к силе"
  CEN_forceful_polish_conscription_desc: "Поляки - гордый и бунтарский народ, но они также многочисленны. Мы будем осуществлять «Великую Наказание», поднимая новые разделы польских кадров для службы в Панславской армии. Их кровь будет потрачена на защиту наших интересов."
  
  CEN_final_polish_incorporation: "Завершение интеграции Польши"
  CEN_final_polish_incorporation_desc: "Притворство "Польского Защитника" закончилось. Мы "прикончим Польскую интеграцию", отменим их правительство и поместим их земли в штат Западослав как новые провинции. Польский орел будет заменен нашим собственным."
  
  CEN_slavic_corridor: "Славный коридор"
  CEN_slavic_corridor_desc: "Для объединения северных и южных славян мы должны построить "славянский коридор" через Австрию и Венгрию, примыкающий сухопутный мост, соединяющий наши границы с нашими союзниками в Сербии."
  
  CEN_claim_southern_slavs: "&quot; Южные земли &quot;"
  CEN_claim_southern_slavs_desc: "Эксперимент "Югослава" - это тонкая вещь для сербского господства. Хорваты и словенцы - наши католические, центральноевропейские братья, а не подданные Белграда. Мы заявим "южные земли", провозглашая себя истинными защитниками Южных славян."
  
  CEN_demand_serbian_submission: "Требовать представления Сербии"
  CEN_demand_serbian_submission_desc: "Белград - это гнездо реакционных роялистов, мы будем "Demand Serban Data", настаивая на их присоединении к Панславскому Союзу, если они откажутся, мы освободим хорватов и словенцев от их тирании и установим более... соответствующее... правительство."
  
  CEN_demand_bulgaria: "Болгария"
  CEN_demand_bulgaria_desc: "Болгарцы потеряны славянами, во главе с немецким королем. Мы будем "Свидеть Болгарию", возвращая их в славянский слоган силой. Их армия присоединится к нашей, и наша империя наконец доберется до Черного моря."
  
  CEN_belgrad_railroad: "Брно-Белградская железнодорожная дорога"
  CEN_belgrad_railroad_desc: "Чтобы объединить нашу новую империю, мы должны построить Brno-Belgrad Railroad. Этот грандиозный проект в области инфраструктуры станет стальной позвоночником нашего Панславского союза, что позволит товарам и армиям передвигаться из сердца Чехии в берега Дуная в течение нескольких дней."
  
  CEN_serbia_industrial_coop: "Приглашать Сербию"
  CEN_serbia_industrial_coop_desc: "С Сербией в качестве нашего союзника мы будем "прививать Сербии" присоединиться к нашей промышленной сфере. Их огромные минеральные ресурсы и наши передовые фабрики идеально подходят друг другу. Мы построим новую балканскую промышленную зону."
  
  CEN_slavic_tank: "Предложение Застава-Шкода"
  CEN_slavic_tank_desc: "Сербская Застава и наш Шкода - это великие промышленные названия. Мы сделаем "Застава-Шкода" для совместной разработки нового "славянского танка", среднего танка, предназначенного для строительства в обеих наших странах, простого, легкого и смертоносного."
  
  CEN_support_serbian_claims: "Поддержка сербских претензий"
  CEN_support_serbian_claims_desc: "Будучи лидером славянского мира, мы будем «поддерживать сербские притязания». Независимо от того, против венгров, албанцев или греков, враги Сербии являются врагами всех славян."
  
  CEN_slavic_europe: "Славная Европа"
  CEN_slavic_europe_desc: "Мечта реализована: от Балтии до Черного моря, от Эльбы до Днепра, была создана «славная Европа» со столицей в Праге. Мы новая, третья держава, супердержава славянской расы, готовый бросить вызов как немецкому рейху, так и Советскому Союзу."
  
  CEN_destroy_germany: "Обезопасить Западную границу"
  CEN_destroy_germany_desc: "Историческим врагом славян является немец. Они угнетали нас, толкнули нас на восток и на протяжении тысячи лет обращались с нами как с Ынтерменсхеном. Настало время отомстить. Мы "Закрепим западную границу" маршем по Берлину и навсегда уничтожим Немецкий Рейх."
  
  CEN_destroy_russia: "Освободительные восточные славяне"
  CEN_destroy_russia_desc: "Большевики в Москве проповедуют ложное, материалистическое интернационализм, яд для славянской души, они такие же великие враги, как немцы, мы должны «Освободить восточных славян», украинцев и белорусов от ярма Мусковитов и привнести их в наш истинный, национальный, панславский союз."
  
  # --------------------
  # --- INTERNAL (Minorities) ---
  # --------------------
  
  CEN_minorities_question: "Национальный вопрос"
  CEN_minorities_question_desc: "Мы не одна нация, а многие: чехи, словаки, немцы, поляки, украинцы, Лемкос, венгры... все живут в пределах наших границ. "Национальный вопрос" - это самая большая угроза нашему выживанию. Мы должны найти решение, будь то путем компромисса или силой."
  
  CEN_compromise_autonomist: "Сочетание с местными лидерами"
  CEN_compromise_autonomist_desc: "Государство, построенное на силе - это государство, построенное на песке. Мы будем "компромиссировать с местными лидерами", встречаться с лидерами судетских немцев, словацких автономистов и Галицианских поляков. Мы будем прислушиваться к их жалобам и искать середину."
  
  CEN_federative_reforms: "Самоуправление"
  CEN_federative_reforms_desc: "Это «Федеративная реформа» создаст новые региональные диеты с реальной властью над местной культурой и языком, ослабит напряженность и укрепит союз, уважая его разнообразие."
  
  CEN_minority_language_education: "Образование на языках меньшинств"
  CEN_minority_language_education_desc: "Самый быстрый способ разозлить человека - это запретить его родной язык. Мы профинансироваем "Обучение языкам меньшинств", чтобы немецкий, польский и украинский языки могли посещать школы на своем родном языке. Этот акт доброй воли докажет, что Прага является защитником, а не угнетателем."
  
  CEN_suppress_autonomist: "Автономисты Супресс"
  CEN_suppress_autonomist_desc: "Компромисс - это слабость. Требования "аутономистов" - это скользкий путь к измене и расчленению нашего государства. Мы будем "вынуждать" их. Их партии будут запрещены, их лидеры будут наблюдать и их газеты будут подвергнуты цензуре. Верность будет требоваться."
  
  CEN_force_centralisation: "Централизация сил"
  CEN_force_centralisation_desc: "Наша федеративная модель - это неудача, она только поощряет больше раскола. Мы будем "Force Centralization", отменяя все региональные диеты и автономию. Вся власть будет течь из Праги. Мы - одна нация, и те, кому она не нравится, могут уйти... или молчать."
  
  CEN_zapadoslav_education: "Чехословацкий язык"
  CEN_zapadoslav_education_desc: "Для того чтобы создать одну нацию, у нас должен быть один язык. Мы будем применять "чехословацкий язык" во всех школах и государственных учреждениях. Все граждане, независимо от их родного языка, должны изучать язык государства. В одном поколении мы создадим единую западославскую самобытность."
  
  CEN_minorities_problem_solved: "Проблемы решены"
  CEN_minorities_problem_solved_desc: "Независимо от того, идет ли речь о компромиссе или о силе, «Проблемы разрешены». Внутренние разногласия, которые когда-то были поражены нашей нацией, исцелились, или, по крайней мере, перевернулись. Теперь мы можем смотреть наружу, единую и сильную нацию."
  
  CEN_declare_martial_law: "Объявление военного права"
  CEN_declare_martial_law_desc: "Внутреннее положение неприемлемо. Немецкие *Фрейкорпы* бунтуют, поляки саботируют наши железные дороги. Это не инакомыслие, это восстание. Мы отменим все гражданские права и отправим армию в приграничные районы, чтобы восстановить порядок железным кулаком."
  
  CEN_nationalize_industry: "Национализация промышленности"
  CEN_nationalize_industry_desc: "Судетен немецкий и селезийский промышленники финансируют восстание. Мы сломаем их власть, "национализируя" их индустрию. Их фабрики, шахты, банки - все они будут отделены от государства. Их богатство больше не будет использоваться для заговора нашего падения."
  
  # --------------------
  # --- ARMY ---
  # --------------------
  
  CEN_new_zapadoslav_army: "Новая Западославская армия"
  CEN_new_zapadoslav_army_desc: "Наша армия - это смесь старых подразделений Габсбурга, новых чешских дивизий и наследия Легионов. Мы должны превратить ее в «новую Западославскую армию», современную, единую силу, преданную государству, а не его региону или этнической принадлежности."
  
  CEN_czechoslovak_army_core: "Чехословацкая армия"
  CEN_czechoslovak_army_core_desc: "«Чехословацкая армия» — чешские и словацкие офицеры и НКЦ — наиболее надёжная и опытная часть нашей армии. Мы построим нашу новую армию вокруг этого ядра, обеспечивая, чтобы ее доктрины, традиции и преданность составляли основу всех вооруженных сил."
  
  CEN_new_officers: "Корпус многонациональных офицеров"
  CEN_new_officers_desc: "Мы откроем новые военные академии и активно вербуем многообещающих молодых людей из нашего немецкого, польского и гальского населения. Офицерский корпус, отражающий многообразие нашей нации, будет более преданным и эффективным."
  
  CEN_legion_legacy: "Легиональное наследие"
  CEN_legion_legacy_desc: "Мы должны чтить «Легионское наследие». Западослав Легионы, которые боролись по всей России, являются нашим мифом об основах. Их дух инициативы, жесткости и патриотизма станет руководством нашей новой армии. Мы будем продвигать легионеров на ключевые командные позиции."
  
  CEN_german_coscription: "Немецкая воинская обязанность"
  CEN_german_coscription_desc: "Наше немецкое и силиенское население является огромным, неиспользованным резервом высококвалифицированной и квалифицированной рабочей силы. Мы начнем "немецкую молитву", полностью интегрируя их в вооруженные силы. Относясь к ним как к равноправным гражданам и солдатам, мы завоюем их верность и резко увеличим размеры и навыки нашей армии."
  
  CEN_memories_of_zborov: "Воспоминания о Зборове"
  CEN_memories_of_zborov_desc: "Мы назовем «Мемории Зборова», великую битву, в которой чешские и словацкие легионы сначала сражались и истекали кровью. Это будет мощным символом единства, который используется для формирования чувства общей цели и братства между всеми солдатами нашей республики, независимо от их происхождения."
  
  CEN_protect_the_homeland: "Защищать родину"
  CEN_protect_the_homeland_desc: "Наша доктрина должна быть оборонной, мы будем защищать родину, прежде всего, это означает сосредоточение внимания на подкреплениях, противотанковых ружьях и хорошо подготовленных резервных силах, которые могут оттолкнуть любого захватчика. Наш народ будет ежевиком, горьким призом для любого агрессора."
  
  CEN_officers_initivative: "Инициатива в отношении должностных лиц"
  CEN_officers_initivative_desc: "Великая война доказала, что жесткое командование сверху - это рецепт катастрофы. Мы научим наших "офицеров" брать "Инициативу". Мы будем поощрять молодых лидеров быть гибкими, агрессивными и принимать решения на месте, следуя немецкой модели *Auftragstaktik*."
  
  CEN_planning_schools: "Школы планирования"
  CEN_planning_schools_desc: "Мы создадим новые «Школы планирования» для нашего Генерального штаба, обучая их сложным методам материально-технического обеспечения, мобилизации и крупномасштабного оперативного планирования."
  
  CEN_improved_communications: "Боевые инженеры"
  CEN_improved_communications_desc: "Инициатива офицера бесполезна, если он слеп. Мы вложим средства в «инженеры по борьбе» и радиосвязь, чтобы наши подразделения могли общаться по ходу, ремонтировать мосты под огнем и координировать сложные атаки. Армия, которая может говорить и строить, выиграет."
  
  CEN_increase_reserves: "Увеличение резервов"
  CEN_increase_reserves_desc: "Наша постоянная армия - это щит, но наши резервы - меч. Мы будем "увеличивать запасы", расширять наши резервные учебные программы и обеспечивать, чтобы у нас был огромный резерв подготовленных кадров, готовых к мобилизации в любой момент."
  
  CEN_war_of_attrition: "Промышленная война"
  CEN_war_of_attrition_desc: "Мы - промышленная держава. Мы должны бороться с «промышленной войной». Наша доктрина будет сосредоточена на «Войне притязаний», используя нашу высшую артиллерию и пулеметы, чтобы истечь кровью вражеского белого, сохраняя наши драгоценные силы, уничтожая их."
  
  CEN_equipment_standart: "Стандартное пехотное оборудование"
  CEN_equipment_standart_desc: "В настоящее время наша армия представляет собой музей австрийских, немецких, французских и русских винтовок. Это логистический кошмар. Мы будем "Стандартизировать пехотное оборудование", выбирать лучшие дизайны (возможно, наш собственный ZB-26) и переоснащать всю армию. Одна винтовка, одна пуля, одна армия."
  
  CEN_fortification_effort: "Укрепить северную границу"
  CEN_fortification_effort_desc: "Наша граница с Германией и Польшей длинная и уязвимая. Мы начнем массированную "Fortification Effort", строя линию бетонных и стальных бункеров для "Forthing the Northern Carritory". Эта стена будет щитом нашей республики, волшебной линии в сердце Европы."
  
  CEN_another_line: "Глубокие крепости"
  CEN_another_line_desc: "Одной линии крепостей недостаточно; ее можно прорвать. Мы построим "Глубокие крепости", вторую и третью линии обороны. Эта оборона будет обеспечивать, что даже если наша первая стена падет, враг сломается на следующей."
  
  CEN_air_defence: "Противовоздушный охват"
  CEN_air_defence_desc: "форт - это утка для вражеского бомбардировщика, мы должны обеспечить "Анти-Эйр" для наших новых укреплений, инвестируя большие средства в современные бронежилеты и интегрируя их в наши оборонительные планы, небо над нашей стеной будет смертельной ловушкой."
  
  CEN_new_opportunities: "Новые возможности"
  CEN_new_opportunities_desc: "Изменяющееся лицо войны представляет собой «Новые возможности». Наша армия не связана традициями старых империй. Мы свободны экспериментировать с новыми идеями: мобильная война, специальные силы, воздушная битва. Мы будем первопроходцами следующей войны."
  
  CEN_special_forces: "На холмах Западославии"
  CEN_special_forces_desc: "Мы создадим новые «специальные силы», горные войска и рейнджеры, обученные сражаться на холмах Западославии, нападая за линию врага и защищая наши разветвленные границы."
  
  CEN_fire_control: "Концентрация огня"
  CEN_fire_control_desc: "Наша артиллерия прекрасна, но ее координация не является. Мы разработаем новую тактику «концентрации огня» и Си-Си, что позволит нашим артиллерийским батареям разогревать огонь в одном месте с разрушительной скоростью и точностью. Мы создаем искусство плотины."
  
  CEN_art_modernization: "Модернизация артиллерии"
  CEN_art_modernization_desc: "В рамках этой программы модернизации артиллерии наши фабрики Шкоды произведут новое поколение гаубиц и полевых орудий, давая нашей армии самую смертоносную артиллерийскую артиллерию в мире."
  
  CEN_squad_tactics: "Спасатели тактики"
  CEN_squad_tactics_desc: "Современное поле боя побеждает "Спасатель". Мы реформируем нашу пехотную тактику, наделяя полномочиями NCO и маленькое подразделение. Мы проверим наши отряды в огненном и манёврах, используя их легкие пулеметы и минометы, чтобы создать их местное огневое превосходство."
  
  CEN_maneuver_warfare: "Война в Маневере"
  CEN_maneuver_warfare_desc: "Защитная позиция - это проигрыш. Мы должны принять «Маньюверский военный путь». Мы создадим доктрину, в которой особое внимание будет уделяться скорости, удивлению и сочетанию вооружений. Наша армия не будет статической стеной, она будет катушенной весной, готовой к удару."
  
  CEN_strike_first: "Первый удар"
  CEN_strike_first_desc: "Лучшая защита - это хорошее преступление. В любом будущем конфликте мы должны поймать наших врагов, прежде чем они смогут полностью мобилизовать их. Эта упреждающая доктрина станет краеугольным камнем нашего национального выживания."
  
  CEN_cult_of_speed: "Культ скорости"
  CEN_cult_of_speed_desc: "Мы создадим "Култ скорости" в нашей армии, все должно быть быстрее, наши танки, наши грузовики, наша пехота, наши командные решения, мы вложим средства в моторизацию и новые конструкции легких танков, чтобы создать армию, которая может бегать по кругу своих пиломатериалов."
  
  CEN_finalize_reforms: "Завершение реформ"
  CEN_finalize_reforms_desc: "Наша новая армия готова. Мы будем "Заканчивать реформы", опубликуем наши новые полевые руководства, установим наши новые шаблоны дивизии и официально примем доктрину, которую мы выбрали. Армия Западослава возродится."
  
  CEN_mobile_infantry: "Механизация армии"
  CEN_mobile_infantry_desc: "Танки не могут победить в одиночку. Мы должны продолжать "механизацию армии", создавать дивизии "Мобильная пехота" — не только в грузовиках, но и в полутреках, — которые могут идти в ногу с бронированными головами и сражаться с их машинами."
  
  CEN_new_armored_platform: "Новая бронированная платформа"
  CEN_new_armored_platform_desc: "Дни легкого танка пронумерованы. Нам нужна "Новая бронезарядная платформа", настоящий средний танк, способный сбалансировать скорость, доспехи и огневую мощь. Наши заводы Шкода и ЧКД будут соревноваться за разработку этого нового, победившего в войне оружия."
  
  CEN_tank_destroyers: "Разрушитель танка"
  CEN_tank_destroyers_desc: "Подъём танка означает, что мы также должны быть лучшими в его убийстве. "Tank Destroyer Effort" сосредоточится на разработке специализированных транспортных средств - быстрых, мобильных и вооруженных быстродействующей пушкой - чтобы охотиться и убивать вражеские доспехи."
  
  # --------------------
  # --- AIR FORCE ---
  # --------------------
  
  CEN_zapadoslovanka_letectvo: "Западослованска Летецко"
  CEN_zapadoslovanka_letectvo_desc: "Мы создадим Západoslovanska Letectvo — Западославские военно-воздушные силы. Это будет новая, независимая служба, равная армии, с ее собственным командованием, доктриной и бюджетом. Небо - это наша новая граница."
  
  CEN_pilot_training: "Экспериментальная подготовка"
  CEN_pilot_training_desc: "Мы создадим новую национальную авиационную академию и расширим программы "Пилотной подготовки" по всей стране, найдем лучших и смелых молодых людей и превратим их в тузы."
  
  CEN_expand_airfields: "Расширить аэродромы"
  CEN_expand_airfields_desc: "Военно-воздушные силы нуждаются в базах, с которых мы будем действовать. Мы будем "разбирать воздушные поля" и строить новые, современные, особенно в стратегических регионах Словакии и Галисии. Это позволит нам проецировать нашу авиацию в любом направлении."
  
  CEN_radio_effort: "Радиолокатор"
  CEN_radio_effort_desc: "Будущее воздушной войны - это связь. Радар Эффорт будет инвестировать в новую экспериментальную технологию радиообнаружения и Рангинга. Построив цепочку радиолокационных станций на наших границах, мы увидим врага задолго до их прибытия."
  
  CEN_air_supremacy_doctrine: "Воздушная супремность"
  CEN_air_supremacy_doctrine_desc: "Главной, не подлежащей обсуждению миссией наших военно-воздушных сил является достижение «Супремочности Воздуха». Мы примем доктрину, в которой приоритетное внимание будет уделяться захвату боевиков противника с неба, обеспечению того, чтобы наша армия на земле могла действовать без страха сверху."
  
  CEN_fighter_effort: "Истребитель"
  CEN_fighter_effort_desc: "Чтобы добиться господства, нам нужны высшие бойцы. Этот "Бойцом Эффортом" подтолкнет наши дизайнерские бюро Авии и Летова к своим пределам, создавая новые, передовые перехватчики и тяжелые истребители, которые могут перебросить и перестрелять все, что могут наши соседи."
  
  CEN_air_support_doctrine: "Наземные силы поддержки"
  CEN_air_support_doctrine_desc: "Армия не должна быть забыта, мы разработаем доктрину «поддержи наземные войска», обучая наших пилотов тактике погружения в бомбу и наземной атаки, наши военно-воздушные силы будут летающей артиллерией для нашей пехоты."
  
  CEN_bomber_effort: "Бомбардировщик"
  CEN_bomber_effort_desc: "Настоящие военно-воздушные силы должны быть в состоянии нанести ответный удар. "Бомбер Эффорт" будет финансировать создание стратегических бомбардировщиков, способных нанести удар по вражеским фабрикам, городам и инфраструктуре за их линиями."
  
  CEN_air_industry: "Авиационная промышленность"
  CEN_air_industry_desc: "Мы будем инвестировать в такие компании, как Авиа, Аэро и Летов, расширяя их фабрики и финансируя их исследования, чтобы создать самодостаточную промышленную базу, которая может проектировать и производить наши собственные самолеты мирового класса."
  
  CEN_simpler_designs: "Простые дизайны"
  CEN_simpler_designs_desc: "Мы - нация с большой, полуквалифицированной рабочей силой, особенно на наших новых территориях. Мы сосредоточимся на «простых дизайнах», которые легко построить, легко летать и легко ремонтировать. Мы одолеем наших врагов простым числом."
  
  CEN_air_quality: "D. Концептуальные характеристики качества"
  CEN_air_quality_desc: "Мы не можем конкурировать с такими гигантами, как Германия или СССР. Единственный путь — это «Дизайны качества». Мы построим лучшие, самые передовые и самые смертоносные самолеты в мире. Каждый из наших пилотов и самолетов будет стоить десяти вражеских."
  
  CEN_jet_experimentation: "Экспериментальная реактивация"
  CEN_jet_experimentation_desc: "Винт - это прошлое. Будущее - это самолёт. Мы начнем очень секретный эксперимент "Джет", финансируем наших лучших инженеров, чтобы раскрыть секрет турбинного двигателя. Нация, которая владеет этой технологией, в первую очередь будет править небом следующей войны."

