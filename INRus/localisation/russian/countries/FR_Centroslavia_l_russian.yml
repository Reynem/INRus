 #desc
 CEN_FUHRERREICH_DESC: "После Великой войны Австро-Венгерская империя рухнула, и, таким образом, Чехословакия ожила. Позднее, реформирована в Западославскую федерацию из-за различных событий в Центральной Европе после поражения Германии и венгерской коллапса, их существование всегда было трудным. Непрекращающиеся внутренние проблемы и рост национализма в регионах республики делают ее правительство бессильным, а радикальные элементы более сильными, чем когда-либо. Западославия имеет два варианта: продолжать короткое наследие первого полуславянского состояния или погибнуть под пяткой немцев, которые хватают большинство немецких земель Судетенленда и Силезии."
