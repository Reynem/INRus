 #### Ideas ####
 CEN_german_strife: "Немецкий сеператизм"
 CEN_german_strife_desc: "Германия финансирует сепаратистские группы в Силезии и Судетенленде. У нашего правительства достаточно проблем, чтобы это оказало огромное дестабилизирующее воздействие на нашу страну."
 CEN_failed_state: "С трудом функционирующее правительство"
 CEN_failed_state_desc: "Многие считают, что многонациональный союз западных славян обречен на провал. Этническая напряженность постепенно разрывает нашу страну на части с момента ее создания, и обсуждение вопроса о большей автономии или дальнейшей централизации не получило исчерпывающего ответа. Серьезные реформы должны быть направлены на решение этих проблем."

 CEN_autonomy_slovakia: "Автономия в Словакии"

 CEN_autonomy_sudetanland: "Автономия в Суденеленде"

 CEN_autonomy_poland: "Автономия в Малой Польше"

 CEN_autonomy_galicia: "Автономия в Галисии"
 CEN_multinational_army: "Многонациональная армия"
 CEN_multinational_army_desc: "Западославские военные состоят из чехословаков, словаков и поляков, в которых также служит небольшое число немцев, венгров и русенцев, что приводит к ситуации, в которой не существует единого языка среди наших вооруженных сил, а также к недоверию между различными этническими группами, которые служат в армии."

 CEN_multinational_army_1: "Многонациональная армия"
 CEN_multinational_army_1_desc: "Западославские военные состоят из чехословаков, словаков, немцев, венгров и русенцев, что приводит к ситуации, в которой не существует единого языка среди наших вооруженных сил, а также к недоверию между различными этническими группами, которые служат в армии, что крайне негативно сказывается на деятельности наших вооруженных сил."

 CEN_multinational_army_2: "Многонациональная армия"
 CEN_multinational_army_2_desc: "В состав Западославской армии входят чехи, словаки, немцы, венгры и русины."

 CEN_czech_army_idea: "Чехословацкая армия"

 CEN_czech_army_idea2: "Профессиональная подготовка в Чехословацкой армии"

 CEN_demographic_issue: "Демографический вопрос"
 CEN_demographic_issue_desc: "Главной проблемой, с которой сталкивается наша нация, является демографический вопрос. Несмотря на то, что в стране доминируют чехи и названы в качестве центральных славянских народов, самыми крупными группами населения в стране являются немцы, которые не имеют ничего, кроме враждебности к правительству Брно. Это немецкое население расположено только в Силезии и Сутенленде, но и по всей нашей стране с большим населением в Праге и Братиславе. Наряду с ними являются русины, русины, магияры и поляки, которые в равной степени презирают нашу нацию. Даже среди более преданных этнических групп, таких, как словаки и крошечное население Сорбов, среди них есть сепаратистские движения и неприязнь к Брно. Несмотря на то, что многие считают нашу нацию не более чем выдумкой, которая может продолжаться до тех пор, пока наши соседи стремятся вернуть свое население в свои государства, причем главной угрозой для нас являются немцы и поляки, в то время как венгерская угроза все еще существует."

