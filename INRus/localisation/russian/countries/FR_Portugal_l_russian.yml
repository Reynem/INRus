 POR_maria_adelaide_braganca: "Мария Аделаида де Браганса"
 POR_maria_adelaide_braganca_regnal: "Мария III"
 POR_maria_adelaide_braganca_leader_desc: "Когда Мария III заняла корону после второго Регицида за 30 лет, перед ней стоят непростые задачи. Юная королева всегда была популярной, когда она была принцессой, всегда искала помощь нуждающимся, когда это возможно. Её мягкое и хорошее поведение может сделать ее агрессивную антиинтеграционную позицию удивительной, но с тех пор, как она заняла трон, она осудила эксцессы от этой партии, и ее бесстрашный настрой только помогает ее популярности."
 POR_maria_adelaide_braganca_puppet_leader_desc: "Будучи недавно созданной королевой Португалии и Альгарвей, Мария Ана, кажется, довольна своей ролью, заключающейся в том, чтобы практически не выносить никаких решений. Ее приоритет состоит в том, чтобы обеспечить сохранение монархии и восстановить связи с свергнутой королевской семьей. Германское гражданство ее мужа, как только ответственность по существу заблокирует ее наследство, вполне может помочь в этом начинании."

