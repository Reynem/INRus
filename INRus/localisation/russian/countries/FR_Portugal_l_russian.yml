 POR_colonial_development_cat: "Ультрамаринские провинции"
 POR_colonial_development_cat_desc: "Министерство колоний уполномочено направлять усилия в области развития по всей империи, в этих регионах могут происходить различные изменения, существуют планы упразднения министерства колоний, замены его министерством империи для новых территорий и интеграции существующих заморских провинций, находящихся под управлением МС, в саму Португалию, будущее португальского царства и империи выглядит блестящим."
 POR_cape_verde: "Развитие Кабо-Верде"
 POR_cape_verde_desc: "Мы должны разработать планы и вложить средства в Кабо-Верде, с тем чтобы обеспечить его процветание."
 POR_sao_tome: "Расширение трудовых ресурсов в Сан-Томе"
 POR_sao_tome_desc: "Хотя решение этой проблемы представляется очевидным, необходимо приложить серьезные усилия для обеспечения того, чтобы рабочие не только дошли до места назначения, но и свели к минимуму напряженность между местными жителями и иммигрантами."
 POR_macau: "Защита и развитие Макао"
 POR_macau_desc: "Макао — это сокровище империи, завидуемое китайцами из-за их процветания, однако оно также очень далеко от Португалии, что означает, что в случае нападения провинции придется держаться без поддержки."
 POR_goa: "Защита государства Индия"
 POR_goa_desc: "Государство Индия, когда-то надежно защищавшееся благодаря британскому контролю над индийским субконтинентом, постоянно находится под угрозой нападения либо синдикалистов на востоке, либо вероломных принцев на юге."
 POR_timor: "Компании Открытая хартия в Тиморе"
 POR_timor_desc: "Дальняя провинция Тимор всегда была одним из беднейших регионов в Империи, однако недавние исследования министерства колоний выявили огромные новые запасы ресурсов, чтобы воспользоваться неиспользованным потенциалом провинции, король примет новые королевские хартии, поощряющие волну инвестиций и развития в Тиморе."
 POR_join_Entente: "Присоединяйтесь к Согласию"
 POR_join_Entente_desc: "В наших интересах присоединиться к Британской империи в ее глобальном союзе и сражаться за них в борьбе за восстановление мирового порядка."
 POR_found_faction: "Нашел нашу Имперскую Фракцию"
 POR_found_faction_desc: "Хотя британцы и являются нашими давними союзниками и мы не хотим отменять Договор 1373, мы не хотим оказаться связанными с канадцами или тонущим кораблем в этом вопросе."
 POR_core_angola: "Инкорпорировать Анголу в Португалию"
 POR_core_angola_desc: "Португальские ботинки с гордостью стоят в Анголе с 1575 года."
 POR_core_mos: "Инкорпорировать Мозамбик в Португалию"
 POR_core_mos_desc: "По мере продвижения вперед процесса европеизации в Мозамбике настало время для того, чтобы этот регион присоединился к своим португальским братьям и был интегрирован в королевство, а не просто в дальнюю колонию в Юго-Восточной Африке."
 POR_core_goa: "Инкорпорировать Гоа в Португалию"
 POR_core_goa_desc: "После более чем 400 лет португальского правления, только вмешавшегося британцами во время Наполеоновских войн, настало время для многих лет торговли, миграции и отвращения."
 POR_core_macau: "Инкорпорировать Макао в Португалию"
 POR_core_macau_desc: "С 1557 года мы владеем в Макао, которая является одной из наших старейших территорий и, хотя она и не очень европейская, покорное население Макао будет радо стать португальцем, свободным от войны на севере."
 POR_core_timor: "Инкорпорировать Восточный Тимор в Португалию"
 POR_core_timor_desc: "Мы прибыли в Тимор в 1515 году и с 1702 года являются колонией, которая не рассматривается Республикой в качестве поддающегося эксплуатации торгового поста, однако эта ситуация изменилась под руководством Инклюзивистов . Несмотря на то, что большинство из них остаются неграмотными и неевропейцами с культурной точки зрения , португальская тиморская элита, получившая церковное образование, будет вести свою деятельность, а остальное последует за ней."
 POR_core_guinea: "Инкорпорировать Гвинею в Португалию"
 POR_core_guinea_desc: "В последние годы Гвинея процветает в условиях, когда Португалия находится далеко от нее, и ее близость к Кабо-Верде и родине, которая в настоящее время выступает в качестве региона, отвечающего установленным требованиям, и будет вознаграждена за интеграцию."
