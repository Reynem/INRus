 #DWR Decisions 
 POR_GIBRALTAR: "Возьмите Гибралтар"

 POR_iberia_cat: "Иберийские вопросы" 
 POR_iberia_cat_desc: "На востоке Испании, в постоянной гражданской борьбе, как это было со времен Наполеона, то, что происходит в Испании, имеет жизненно важное значение для нашего суверенитета, вопросы с Испанией должны быть урегулированы, прежде чем они восстановятся и попытаются снова доминировать над нами, на этот раз потенциально под красным знаменем!"
 POR_GAL: "Воссоединиться с нашими северными братьями"
 POR_GAL_desc: "Мы должны установить контроль над этим регионом и освободить португальскую провинцию от испанского ярмо!"
 POR_KSP: "Конец Испании"
 POR_KSP_desc: "С захватом Галисии испанцы, очевидно, все еще слабы и слабы; если им позволят оправиться, то они, несомненно, улетят на запад, стремясь вернуть земли, которые мы отняли у них, и это не должно произойти. Испания должна быть разрушена."
 POR_restore_order_galicia: "Восстановить порядок в Галисии"
 POR_restore_order_galicia_desc: "Многие в Галисии остаются безрассудно преданными Испании, в то время как другие выступают за независимую республику."

 POR_SA_cat: "Возвращение в Южную Америку"
 POR_SA_cat_desc: "Огромное государство Бразилии говорит в основном на португальском языке, и многие из них имеют португальское наследие. Эта земля никогда не должна была ускользнуть от нас, и она должна была оставаться частью Португалии, как и любая европейская территория. Неважно, мы исправим эту ошибку."
 POR_BRA: "Возьмите Бразилию!"
 POR_BRA_desc: "Настало время вернуть наши законные южноамериканские земли."
 POR_URG: "Завершение конфликта над Уругваем"
 POR_URG_desc: "На протяжении всей своей истории Уругвай был сражением между португальским и испанским народами, сначала между испанскими и нами, затем между бразильцами и аргентинцами."

 POR_SEA_cat: "Обеспечение безопасности глобальных морских заливов"
 POR_SEA_cat_desc: "Хотя контроль над обширными участками земли имеет важное значение, он бесполезен, если мы можем быть отрезаны от них в любой момент иностранной державой, мы должны взять жизненно важные проливы для обеспечения того, чтобы наша прекрасная родина никогда не была отрезана от районов Португалии дальше от центра."
 POR_SUEZ: "Схватить Суэц" 
 POR_SUEZ_desc: "Когда Бенджамин Дисраэли купил компанию Суэц канал и продал ее британскому правительству, чтобы не дать французам получить ее, наш доступ к востоку был защищен, однако его нынешние защитники кажутся слабее, чем их предшественники."
 POR_SING: "Сингапурская стратегия"
 POR_SING_desc: "Мы должны взять этот город под свой контроль с кровью португальских патриотов, и если все преуспеют, мы должны рассмотреть вопрос о захвате Восточной Суматры за полное господство Малаккского пролива."
 POR_CON: "Захват босфора"
 POR_CON_desc: "Хотя доступ к Черному морю не важен для нас, он может быть важен для наших врагов."

 POR_empire_cat: "Расширение Португальской империи"
 POR_empire_cat_desc: "Мы не успокоимся до тех пор, пока не возьмем себе титул глобального гегемона и не создадим империю по всему миру, которая не может быть поставлена под сомнение по размеру или может быть! Многие смеются над такой идеей, давайте позаботимся о том, чтобы мы последний раз смеялись."
 POR_MOR: "Конец Морроко"
 POR_MOR_desc: "В то время как "Реконкиста" закончилась тем, что мусульмане вытеснили из Иберии, можно утверждать, что она не зашла достаточно далеко. На протяжении многих лет мохаммадцы стояли на прямом пути Гибралтара, оскорбляя нас. Это оскорбление т. наз. христианства, за которое мы больше не будем стоять!"
 POR_FRAA: "Расширить Португальскую Гвинею"
 POR_FRAA_desc: "В то время как Французская Республика была нашим союзником во время Великой войны, они явно слабее, они не цивилизовали своих туземцев, просто пытаясь вырвать их, они должны были поместить свою территорию под лучшего хозяина."
 POR_LIB: "Расширить португальскую Западную Африку в Либерию"
 POR_LIB_desc: "Говорят, что Либерия является одной из последних"free" African nations. In reality it is ruled by a tiny minority of Americo-Liberians. This minority has formed an aristocracy distinct from the native 98%, differentiating themselves in speech, dress, source and level of income, style of life and culture. Large land purchases were made by the Americo-Liberians from chiefs to whom permanent alienation of land was an unfamiliar concept. They pretend to be a little USA, so let us free the natives as a stepping stone to destroying the real USA."
 POR_WAF: "Расширить португальскую Западную Африку в Сьерра-Леоне"
 POR_WAF_desc: "В португалоязычном проекте для Западной Африки остается лишь один кусок, и давайте выйдем в Сьерра-Леоне и закончим создание образцовой колонии!"
 POR_RHO: "Свободная Родезия от бури"
 POR_RHO_desc: "Теперь англоязычные жители составляют значительное меньшинство населения Родезии и должны быть защищены от своих противников бура, что не удалось выполнить. Родезия хорошо управляется этими поселенцами с сбалансированным бюджетом и повышением заработной платы среди поселенцев и местных жителей. Англо должны защищать от злобных буров до их Юга или от любой потенциальной угрозы, с которой они могут бороться. Район должен быть экономически полезным для нас, и англоязычные админанты могут оказаться полезными в управлении нашими запасами, которые продолжают расти и напрягать государство."
 POR_RHO2: "Возьмите розовую карту"
 POR_RHO2_desc: "Самое важное в нашем расширении — это взять розовую карту и связать две африканские колонии."
 POR_IND: "Буфер для Гоа"
 POR_IND_desc: "Наша гордая провинция Гоа является примером португальской цивилизации среди индийских субконтинентальных конфликтов и раздоров. Однако не все в порядке, так как постоянная угроза сезуре Гоа повисает над провидцем, как меч Дамоклов. Мы еще не пытаемся управлять всей Индией, хотя малонаселенный регион, который нанес бы незначительный административный ущерб нашему народу, лежит на востоке Гоа, подходящем буфере для нашей великой провинции. Он может оказаться слишком полезным в будущем, если мы решим расширить наши амбиции. Мы должны взять этот регион любой ценой."
 POR_CEY: "Вернуть Цейлона!"
 POR_CEY_desc: "Мы потеряли Цейлон после многих лет правления в 1658 году, после падения на голландцев, затем на британцев, а затем на немцев, власть острова распространилась среди многих европейских держав после того, как мы упали из-под нашего контроля. До сих пор существует свидетельство португальской цивилизованной миссии, и нам пора ее возобновить."
 POR_DEI: "Богатство Ист-Индии"
 POR_DEI_desc: "Наша маленькая территория Тимора находится в окружении индонезийских территорий, и мы должны взять японские части бывшей Голландской Ист-Индии для обеспечения безопасности этих стратегически важных и богатых ресурсами островов."
 POR_BEA: "Богатство Британской Ист-Индии"
 POR_BEA_desc: "Наша маленькая территория Тимора находится в окружении индонезийских территорий, и мы должны взять британские части бывшей Голландской Ист-Индии для обеспечения безопасности этих стратегически важных и богатых ресурсами островов."
 POR_china_wars: "Подложите [From.GetName]"


 POR_rivals_cat: "Великий португальский крестовый поход"
 POR_rivals_cat_desc: "В то время как наши имперские амбиции кажутся эгоистичными на поверхности, все они служат большему благу. После французской революции, ускоренной Великой Войной, появилось множество зол. Зло либерализма, сравняющаяся, эгалитарная сила, которая стремится создать общество массового человека, не отличающегося друг от друга, более не объединенного под Богом, но объединенного в потреблении, независимо от того, насколько дегенерирует это потребление. Чтобы уничтожить это, мы должны уничтожить центр этого зла - Соединенные Штаты Америки, прежде чем они станут достаточно сильными, чтобы доминировать в мире и омыть его либерализмом. В то же время существует зло социализма, еще одна сила, которая делает равноправный аспект либерализма логичным концом - равенство исхода, и эта противоестественная сила тоже должна быть удушена в своей кровати." 
 POR_UOB: "Освободить британцев от социалистических цепей"
 POR_UOB_desc: "Союзники с 1373 года, мы не можем допустить, чтобы британцы страдали от социализма."
 POR_GER: "Уничтожить Немецкую угрозу"
 POR_GER_desc: "Немцы во время Великой Войны считали нас не более чем помехой. Давайте поднимем португальский флаг над Рейхстагом, чтобы показать им свою силу и положить конец злу Валькизма!"  
 POR_JAP: "Морская гегемония на востоке"
 POR_JAP_desc: "Японский экспансионизм угрожает нашему присутствию в Китае и Ист-Индии, и кто знает, остановятся ли они там!" 
 POR_USA: "Уничтожить центр либерализма"
 POR_USA_desc: "Либерализм - это болезнь, которая может оказаться еще более разрушительной, чем социалистическая чума. Соединенные Штаты являются носителями этой болезни, распространяющей ее по всему миру. Мы должны избавить их от страданий и восстановить традиции и мораль на американских берегах!"
 POR_FRA: "Поразить либерализм у подлого источника"
 POR_FRA_desc: "Поедание сыра, выпечка багетта, улитка, вторжение Иберии, миме-изображение во французском в поисках новой Континентальной системы. Мы стояли в одиночестве на континенте и раньше противостояли французам, мы сделаем это снова, на этот раз без британской помощи! Мы спасем Европу от этого зверя!"
 POR_ORL: "Ударить французских социалистов"
 POR_ORL_desc: "Поедание сыра, выпечка багетта, улитка, вторжение Иберии, миме-изображение во французском в поисках новой Континентальной системы, на этот раз попытка покрасить континент Красный! Мы стояли одни на континенте, противостоящем французам, мы сделаем это снова! Мы спасем Европу от этого зверя!"
 POR_SOV: "Удар по Советскому Союзу"
 POR_SOV_desc: "Красная Менас на востоке представляет угрозу для всей Европы, они отказались от православной, автократии и гражданства, и теперь русские живут под прикрытием инопланетной силы против как Европы, так и самих русских, мы должны освободить всю Европу от этого проклятия."
 POR_PANAMA: "Захват Панамского канала"
 POR_PANAMA_desc: "После того как мексиканско-американский конфликт вверг в хаос будущее Панамского канала, возник вопрос о пути к миру и о нашем военно-морском контроле над Северной и Южной Америкой."
 POR_BAB: "Контролировать Баб-эль-Мандебский пролив"
 POR_BAB_desc: "Несмотря на то, что Баб-эль-Мандеб не так известен как Суэц, он также представляет угрозу для судоходства на Востоке."
 POR_OIL_cat: "Черное золото для Португалии"
 POR_OIL_cat_desc: "Поскольку поставки нефти становятся все более важными, мы должны обеспечить, чтобы наш флот и наши силы имели топливо для их питания, Венесуэла, арабы Масхрики, Иран."
 POR_TUR: "Иракская война"
 POR_TUR_desc: "В то время как мы заявляем международному сообществу, что в Ираке применяется химическое оружие и мы защищаем народы Месопотамии, в действительности мы стремимся забрать те ресурсы, которые есть в регионе, и для общего блага — позволить нашей честной руке еще больше распространиться по всему миру."
 POR_IRA: "Война в Персидском заливе"
 POR_IRA_desc: "Район Хузестан является арабским и более неограниченно богатым нефтью районом Персии, который станет идеальным дополнением к нашим иракским запасам."
 POR_VEN: "Венесуэльская нефть"
 POR_VEN_desc: "Поскольку американцы отвлечены от Мексики и Монро больше не применяют силу, ничто не мешает нам захватить нефть Венесуэлы."
 POR_KSP: "Конец Испании"
 POR_KSP_desc: "С захватом Галисии испанцы, очевидно, по-прежнему слабы и ненадежны. Если им позволят оправиться, то они, несомненно, улетят на запад, стремясь вернуть земли, которые мы отняли у них, и это не может произойти. Испания должна быть разрушена и разделена."
 POR_china_cat: "Покорение Китая"
 POR_china_cat_desc: "В то время как британский Радж правил субконтинентом, на севере есть цивилизация, которая, несмотря на европейское господство, никогда не подпадала под европейское правление. Китай. Мы переедем из Макао в Гуандун, создадим наше собственное правительство для Китая, затем перейдем на свою северную экспедицию до тех пор, пока весь Китай не окажется под португальским знаменем! Многие в королевском кабинете называют этот план безумием, пустой тратой португальских жизней. Давайте покажем им, нет безумия, когда мы знаем, что Бог на нашей стороне!"
 POR_release_GXC: "Освобождение китайской администрации"
 POR_release_GXC_desc: "Мы не можем надеяться на прямое правление Китаем, так что освободит администрацию, которая сделает это для нас, используя местных жителей для нашей работы по управлению обширной нацией Китая."
 POR_CONGO: "южная часть Конго"
 POR_CONGO_desc: "Бельгийцы не выполнили свой долг по цивилизации Конго."

 POR_restore_order_galicia: "Восстановить порядок в Галисии"
 POR_restore_order_galicia_desc: "Многие в Галисии остаются безрассудно преданными Испании, в то время как другие выступают за независимую республику."


 #WIP
 #POLITICS_GXC_DUARTE_DESC: "С португальским вмешательством в Китай Дуарти получил титул императора Китая, и хотя Дуарти в частном порядке презирает этот титул как какую-то шутку, правительство интегралистского движения настаивает на этом, чтобы повысить свою легитимность в Китае. Время покажет, будет ли правление Дуарти в Китае продолжительным или же быстро будет ограничено пылью истории, вместе со многими бывшими императорами Китая."
 GXC_portugese_puppet: "Колониальное государство Португалии"
 GXC_portugese_puppet_desc: "Это государство не более чем организация для продолжения и расширения португальского правления в Китае. Большая часть его промышленности направляется в Португалию, чтобы стимулировать расширение новой империи, в то время как администрация борется за набор местных жителей в нашу армию и администрацию из-за своего, как представляется, незаконности. nnSet вслед за португальским вторжением администрация лишь стремится к правлению над всем Китаем, с португальским императором в качестве главы государства. В официальной прямой португальской администрации содержится комбинация португальских администраторов и преданных гражданских местных жителей, последние из которых стремятся либо к финансовой награде, либо к миру под эгидой Португальской короны. / / / unimilarly British Raj, администрация передала власть местных регионов благородным семьям, которые в то время были более счастливы вернуть свои титулы. лояльность этих благородных людей гарантирована, поскольку они наделены полномочиями даже за несколько дней до недавнего краха гегемонии Цинга или Республиканской революции 1911 года. Они обязаны всему перед Португалией, и тогда администрация более счастлива получить от них выгоду от уплаты своих долгов."
 PCN: "Административный совет Португеса-да-Китай"
 PCN_ADJ: "Китайско-португальский язык"
 PCN_DEF: "Португальской администрации Китая" 
 PCN_national_populist_party: "Португальская администрация"
 PCN_national_populist_party_long: "После португальского вторжения администрация стремится лишь к правлению над всем Китаем с португальским императором в качестве главы государства. Официальная прямая португальская администрация включает в себя одновременно португальских администраторов и преданных гражданских местных жителей, последние из которых стремятся либо к финансовой награде, либо к миру при Португальской короне. Как и британский Радж, администрация передала власть в местных районах благородным семьям, которые в то время были более счастливы вернуть свои титулы. Верность этих дворян гарантируется, поскольку они наделены полномочиями даже за несколько дней до недавнего краха гегемонии Цинга или Республиканской революции 1911 года."

