 POR_LSMC_idea_5: "Частичное возмещение"
 POR_LSMC_idea_5_desc: "Быстрые действия правительства, а также установление новых торговых отношений привели к тому, что экономика Португалии продвинулась к восстановлению гораздо быстрее, чем ожидалось."
 POR_LSMC_idea_6: "Частичное возмещение"
