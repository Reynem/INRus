 POR_LSMC_idea_10: "Почти полное восстановление"
 POR_LSMC_idea_10_desc: "Быстрые действия правительства, а также установление новых торговых отношений привели к тому, что экономика Португалии продвинулась к восстановлению гораздо быстрее, чем ожидалось."
 POR_LSMC_idea_11: "Глобальная торговая нация"
 POR_LSMC_idea_11_desc: "Восемнадцатый и девятнадцатый веками Португалия утратила свой статус мировой торговой страны перед другими державами, такими как извращенные голландцы и даже наши союзники, британцы."


 ### Decisions ###
 POR_GAL_claim: "Претензии [171. Получить имя]"
 POR_spanish_civil_war: "Гражданская война в Испании"
 POR_spanish_civil_war_desc: "Испанская гражданская война, начавшаяся в декабре 1935 года в результате неудачного переворота со стороны консерваторов монархистов против Республики, привела к росту четырех сторон; Народный фронт, монархисты, националисты и республиканцы. Несмотря на то, что две трети Иберии оказались в хаосе, мы должны пройти тонкую грань между реальным политиком и защитой Испании от республиканского и социализма. Если мы потерпим неудачу, мы найдем враждебную власть на нашей восточной границе, и мы, возможно, обнаружим, что мы победим в хаосе."

 POR_full_intervention: "Полное вмешательство"
 POR_full_intervention_desc: "Этот конфликт продолжается слишком долго, и мы должны покончить с ним для самих испанцев!"
 POR_support_falange_carlists: "Поддержка Карлистской фракции"
 POR_support_falange_carlists_desc: "В то время как сам фаланж является идеологически республиканским, в коалицию на севере входят Карлисты, предпочтительный союзник как Фаланге, так и южных Бурбонов."
 POR_demand_galicia: "Спрос на Галицию"
 POR_demand_galicia_desc: "Галисия является регионом, который всегда был ближе к нам с культурной и языковой точек зрения."

 POR_seize_falangist_fleet: "Схватить националистический флот"
 POR_seize_falangist_fleet_desc: "Испанские националисты рушатся, и мы должны обеспечить, чтобы их флот не попал в руки красных."
 POR_seize_nationalist_fleet: "Схватить монархистский флот"
 POR_seize_nationalist_fleet_desc: "Испанские монархисты рушатся, и мы должны обеспечить, чтобы их флот не попал в руки красных."

 POR_attack_socialist_fleet: "Ударить Социалистический флот"
 POR_attack_socialist_fleet_desc: "Поскольку сила правых испанцев ослабевает, мы должны обеспечить, чтобы в будущем нам не угрожал красный флот, мы нападем на красный флот!"

 POR_send_weapons_monarchist: "Отправьте стрелковое оружие [SPM.GetName]"
 POR_send_weapons_monarchist_desc: "Мы должны защищать традиции, порядок и монархию."
 POR_send_men_monarchist: "Отправьте мужчин в [SPM."
 POR_send_men_monarchist_desc: "Мы должны защищать традиции, порядок и монархию."
 POR_send_weapons_falangist: "Отправьте стрелковое оружие в [ПФП."
 POR_send_weapons_falangist_desc: "Хотя они и не совершенны, мы должны послать оружие националистам, чтобы они могли держать красных под контролем."
 POR_send_men_falangist: "Отправь людей в [ПМС. Найти имя]"
 POR_send_men_falangist_desc: "Хотя они не совершенны, мы должны послать людей к националистам, чтобы они могли держать красных в тайне."

