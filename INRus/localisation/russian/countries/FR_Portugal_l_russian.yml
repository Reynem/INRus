 POR_govern: "Португейская мухафаза"
 POR_govern_desc: "Губернатор, в конечном счете, отвечает Лиссабону, и местное население не может больше танцевать под прихоти того, что он когда-то считал своим маленьким, менее значимым соседом." 

 #THREATS
 POR_renewed_civil_war_threat: "Гражданская война в Португе возобновилась"


 #EVENTS
 portugal.1.d: "В то время как победа и территориальная экспансия укрепили позицию Республики, было недостаточно для того, чтобы сохранить ее в свете нестабильности, которая угрожала ввергнуть страну в хаос. Правительство Сидонио Паиса завершилось его убийством в 1918 году, когда его преемник Жоау Кенто назначил Антонио Гранджо премьер-министром. В этот период правительство еще больше погрузилось в состояние нестабильности, с внутренней фракцией, гиперинфляцией в экономике, и еще одной волной государственного антиклерализма. Для того чтобы сделать еще хуже, республика, которая видела свое создание и основывалась на сохранении колоний, столкнулась с трудностями в установлении власти над своей новой территорией в Африке, что почти привело к вмешательству Великобритании в деятельность по выдвижению правительства Португалии. После нескольких месяцев пребывания у власти, после того как в Лиссабоне был совершен военный переворот, а в Новой Сангренте премьер-министр по поддержке был убит радикальными солдатами. С этой верой военных, людей и элиты в республике был разрушен."
 #
 portugal.2.d: "После многих лет строительства наш флот, Рейнха де Португалия, был дополнен новым великим кораблем. В результате тесного сотрудничества с Великобританией и нашего экономического успеха многие рассматривают этот корабль как большой шаг на пути к восстановлению нашего статуса военно-морской великой державы. Несмотря на то, что он в целом популярен, возникли споры относительно стоимости этого корабля, особенно в свете некоторых предупреждений о стабильности международной экономики. Однако большинство из них отвергли такие предупреждения, указав на то, что португальская экономика идет от силы к силе, и мало что может торпедировать ее подъем. Пока мы празднуем, как этот прекрасный корабль отправляется из Лиссабона."
 #
 portugal.3.d: "Португалия сильно пострадала от кризиса на Лондонском фондовом рынке. Португалия была тесно связана с Великобританией, и крах британской экономики больше всего ударил по ним. Чтобы компенсировать потерю торговли между двумя странами, Португалия теперь стремится к торговым отношениям с партнерами по всему миру и пришла к нам с предложением снизить тарифы между нашими двумя странами. Хотя торговля была бы выгодна нам, она может привести к непопулярной конкуренции из-за рубежа, спорной в это время глобального экономического кризиса между массами."
 #
 portugal.3.a: "Больше торговли всегда хорошо."
 portugal.3.b: "Спросить лучшие термины"
 portugal.3.c: "Последнее, что нам сейчас нужно, это дешевый иностранный импорт."
 portugal.3.t: "Тарифное соглашение с [FROM. GetNameDef]"
 portugal.4.t: "Принимается!"
 portugal.4.d: "[FROM.GetNameDefCap] согласился с нами на торговое соглашение, и мы станем богаче от торговли с их товарами и прибылью от продажи им наших товаров."
 portugal.5.t: "[Фром. Найм Дефкап] Выходит"
 portugal.5.d: "[FROM.GetNameDefCap] оказался совершенно неразумным, отказываясь от нашего предложения о новом торговом соглашении."
 portugal.6.t: "[Отвечайте на требования]"
 portugal.6.d: "Наше предложение не впечатлило правительство, подразумевая, что мы можем предложить больше, ссылаясь на опасность усиления конкуренции на их хрупкую экономику, что поставило бы нас в невыгодное положение против конкуренции, хотя тарифы действительно были бы снижены."
 portugal.6.a: "Нас не будут задирать!"
 portugal.6.b: "Ладно, возможно, мы можем дать им некоторые уступки."
 portugal.7.t: "Португальская делегация приняла наше предложение"
 portugal.7.d: "Не желая играть на своей экономике, португальцы приняли наше встречное предложение, давая нашим товарам преимущество перед конкуренцией в их стране."
 portugal.7.a: "И они думали, что могут изменить нам."
 portugal.8.t: "Португальская прогулка"
 portugal.8.d: "Португальцы отказались от нашего встречного предложения, и сделка полностью провалилась, конечно, это их собственная вина за неуважение к нам, но это разрушит отношения между нами."
 portugal.8.a: "Это их потеря."
 #
 portugal.9.d: "Приобретение Португальской Гвинеей своих амбиций возросло, и она вновь желает приобрести Сьерра-Леоне, чтобы расширить свои западные африканские запасы."
 #
 portugal.10.d: "Британцы отказались от продажи Сьерра-Леоне, заявив, что им не нужны средства и что они считают эту территорию слишком ценной."
 #
 portugal.11.d: "Британия согласилась на продажу этой территории, и теперь наша передача Сьерра-Леоне завершена."
 #
 portugal.12.d: "Несмотря на наш интуитивный отказ удовлетворить просьбу Португалии в отношении Сьерра-Леоне, они вновь обратились к нам, на этот раз с более крупной суммой денег."
 #
 portugal.13.d: "Даже перед лицом большего предложения британцы по-прежнему отказываются."
 #
 portugal.14.d: "Большего предложения было достаточно для того, чтобы Великобритания наконец согласилась на продажу, и теперь наша передача Сьерра-Леоне завершена."
 #
 portugal.15.d: "Португалия пыталась купить боевиков у британских компаний, хотя предлагаемые ими средства прибыльны, многие считают, что мы должны заблокировать такую продажу, чтобы сохранить наши собственные военно-воздушные силы."
 #
 portugal.16.d: "Британское правительство заблокировало продажу боевиков, ссылаясь на угрозу национальной безопасности, с которой сталкивается страна, и на потребность в всех ресурсах, которые она может собрать в это хаотичное время."
 #
 portugal.17.d: "Британское правительство одобрило продажу бойцов нашей стране, и уже партия из 50 бойцов направляется к нам."
 #
 portugal.18.d: "Португальцы обращались к нам, стремясь обеспечить экстерриториальные права и новые торговые договоренности в нашем правительстве в Шанхае. В то время как дополнительные инвестиции в Шанхае были бы полезны для экономики концессии, передача определенных прав нашему маленькому другу может оказаться слишком большой для многих в нашем правительстве."
 #
 portugal.19.d: "Очевидно, что они хотят получить все блага от Шанхая, в то время как мы ничего не получим."
 #
 portugal.20.d: "Британцы согласились, а потоки капитала между Португалией и Шанхаем возросли, в то время как португальские суда готовы войти в Шанхайский порт."
 #
 portugal.21.d: "Наш португальский союзник предложил снять любые торговые барьеры между нашими странами, а также увеличить инвестиции в экономику друг друга."
 #
 portugal.22.d: "Британия в шоке отказывается, и мы не получим награды от какого-либо потенциального торгового соглашения."
 #
 portugal.23.d: "Британцы ощутили смысл и любезно согласились с нашими условиями."
 #
 portugal.24.d: "Португалия, наш союзник с 1373 года, обратилась к нам с просьбой официально присоединиться к [Root.GetFactionName]. Это означало бы еще большую связь для нашей взаимной обороны, и мы имели бы полный доступ к территории друг друга. Большинство в нашем правительстве поддерживают это, поскольку мы уже привержены защите Португалии и официальному альянсу, не навлекая на нас никаких дополнительных ограничений, а только принося пользу от сотрудничества со старым союзником. Однако некоторые выражают мнение, что Португалия является лишь небольшой страной, которая мало чем может помочь в военное время, и статус-кво будет соответствовать нам. Что же это будет?"
 #
 portugal.25.d: "Нас унижает то, что нация, которую мы считали нашим величайшим союзником, отвергла нашу просьбу о создании альянса."
 #
 portugal.26.d: "К удивлению ни одного члена нашего правительства, британцы приняли и официально оформили наше членство в [от. Гетфакшн Наме], теперь мы еще больше привержены нашей взаимной обороне, и португальские силы пользуются полной поддержкой Британской империи. Теперь мы стоим вместе, непобедимы."
 #
 portugal.27.d: "За последние полтора десятилетия наша экономика превратилась из сил в сил благодаря нашим тесным партнерским отношениям с глобальным гегемоном, однако сегодня наша самая большая экономическая сила превратилась в падение, поскольку Лондонский фондовый рынок обрушился на нашу страну шокирующим образом. Насилие вспыхнуло, когда отдельные лица стали взимать с банков плату за свои средства, международная торговля застопорилась, и наше правительство столкнулось с кризисом на своих руках. Воздействие ЛМСК имело катастрофические последствия для нашей страны, и если бы оно не было своевременно урегулировано, оно могло бы вернуть нашу страну в упадок XIX века."
 ###
 portugal.28.d: "В то время как Мануэль II, будучи удивлен таким стремительным изменением положения дел и надеясь на более мирный процесс восстановления, любезно принял трон. С республиканскими настроениями, сосредоточенными главным образом в элите от в целом аполитических масс, в результате того, как патриотический патриотический династик, выйдя из большей части этой элиты во время перехода к королевскому правительству, увидел, как волнения последних нескольких лет исчезли в прошлом. Совет монарха Касе стал наиболее политически значимой частью Конгресса, и при стабильном королевском правительстве Португалия вернулась к спокойствию. После недавнего завершения переходного правительства португальское правительство перестроилось вокруг Королевского конгресса. В настоящее время эта организация состоит из крупнейших монархистов. Совет монархистов является наиболее значимой частью конгресса и является основным католическим органом движения, который развивает католическую партию при Цуейро. Это была главная сила для формирования конгресса, в отличие от установления демократической структуры, в которой антиконституционистская реакция Мануэль. В эпоху монархиста и отсутствия новой крови в движении неоднократно ставили под сомнение будущее движения, особенно в свете двух других крупных партий, представляющей католическую партию в Конгрессе."
 #
 portugal.29.d: "Продолжающееся возвышение Великобритании в 1920-х годах в качестве глобального гегемона и экономического могущества обеспечило процветание экономики Португалии в условиях тесного сотрудничества между торговыми партнерами Португалии. Это тесное экономическое сотрудничество и рост были подкреплены работой Антонио Салазара. Профессор политической экономики, связанный с Католическим центром; Салазар с конца 1920-х годов служил министром финансов. Салазар, наделенный специальными полномочиями Королевского конгресса, смог восстановить многие дыры в экономике Португалии, которые могли превратиться в катастрофу. В течение года Салазар уравнял бюджет, что должно было стать серией бюджетных профицитов. Он также смог освободить Португалию от многих долгов, в которые Португалия попала. Это экономическое возрождение позволило Португалии полностью оправиться от экономического хаоса в республике, и Салазар и монархистский порядок в целом стояли в резком противоречии с тем, что было до этого."
 #
 portugal.30.d: "После Великой войны Мозамбик вырос и стал включать в себя кусок бывшей немецкой Восточной Африки, и эта земля была быстро стабилизирована и умиротворена при монархистском режиме. Португалия обнаружила, что ее ангольские и мозамбиквинские территории окружены дружественными соседями, хотя есть опасения, что это может измениться, если Южная Африка обратится к монархскому радикализму. В Азии португальский Гоа находится в безопасности с дружественным британским Раджом, однако нестабильность в обширной колонии может создать потенциал для угрозы Гоа, в то время как некоторые радикалы считают это возможностью. Восточный Тимор расширился и охватил весь остров Тимор с коллапсом голландской Ист-Индии. Это расширение может стать большой политической победой монарховского правительства; однако оно может превратиться в точку конфликта, если британская Восточная Индия попадет в хаос, или если японцы решат еще больше расширить его южную территорию. В то же время, несмотря на то, что в объединённой в автономной колонии азартные игры, существует опасение, что нестабильность через границу может проникнуть в вековую концессию."
 #
 portugal.31.d: "После глобального экономического кризиса и его катастрофических последствий для экономики Португалии ККБ была сдвинута с левой и правой стороны, когда она пытается выйти из экономического кризиса. Теперь она сталкивается с политическим кризисом, поскольку ее авторитет в Португалии и, в частности, Королевский конгресс рухнул. Используя этого Хосе Хипиото Рапосо, лидера Взаимосмо Луситано , публично заявил о неспособности ККБ защитить Португалию. Он осудил ККБ за то, что она взяла на себя обязательства по международному спекуляции, и заявил, что Португалии лучше сосредоточиться на местном подходе и самообеспеченности в экономических вопросах. Хотя ИЛ остается небольшой частью Конгресса, они становятся все более популярными, и их союзники в ККЮ более чем рады тому, что они наносят ущерб ККБ."
 #
 portugal.32.d: "Королевский конгресс является законодательным органом Португалии, который частично унаследовал от Республиканской «конгреса Республики», состоящей из двух палат. Нижняя палата, палата депутатов, в основном, имеет законодательную инициативу. Этот дом избирается грамотными мужчинами и главами семей в возрасте старше 21 года, при этом места отведены методу пропорционального представительства д'Хондта. Верхняя палата, состоящая из 90 человек, имеет одну треть своих членов, назначаемых королем, а остальные две трети избираемых членов. Этот дом выполняет сравнительно менее законодательные функции, однако он также выполняет судебные функции. В настоящее время в Королевском конгрессе до сих пор доминирует ККС, причем ККЗ является второй по величине партией, причем МЛ является небольшой, но третьей по величине партией."
 #
 portugal.33.d: "Энрики Митчелл де Пайва Кабрал Кусейро умер сегодня в возрасте 82 лет. Фундаментальное восстановление монархии . Он вспоминает всех, будь то политический оппонент или нет, как герой Португалии. Когда-то он был лишь скромным колониальным губернатором, он был лидером сил по восстановлению и начал править Португалией через ЦКВ на протяжении 1920-х и 30-х годов. , в рамках ПКК, его теперь заменят Альберто Монсараз, который перешел между ПСК и ИЛ, и он будет действовать в качестве силы для примирения обеих сторон."
 #
 portugal.34.d: "Теперь, когда наше правление в значительной степени защищено, мы сталкиваемся с вопросом о том, что будет сделано с Королевским конгрессом, мы могли бы отказаться от этого парламентского института, в конце концов избавившись от этого последнего остатка либерализма, или же мы могли бы преобразовать его в институт, который будет служить нашим потребностям до тех пор, пока мы считаем это целесообразным, узаконивая наше правление, действуя лишь как посредник между разработкой законодательства IL и его принятием."
 #
 portugal.35.d: "Сегодня утром, во время поездки в Лиссабон, наш король Мануэль II был застрелен убийцей-изгоем. Однажды в теле Мануэля быстро отправили в больницу и лечатся. Убийца, очевидно под принуждением, заявил, что его действия были мотивированы действиями Португалии в отношении социалистов во время Гражданской войны в Испании, и мы не были бы удивлены, если бы он финансировался их правительством. -Нет у короля не было прямого преемника, хотя во время его изгнания в 1912 году был согласован Пакт Дувра. В этом соглашении Мануэль II был признан законным королем Португалии Мигелистским отделением дома Брагансы. Однако, если бы он умер сейчас с его наследником, то правопреемство перешло бы к Дуарте Нуно де Брагансе. Жизнь короля теперь висела бы в равновесии, и без наследника этот пакт может стать актуальным очень быстро."
 #
 portugal.36.d: "С учетом того, что средства были собраны до глобального экономического кризиса, Португалия приняла свою первую крупную колониальную выставку, демонстрирующую свою империю и цивилизованную миссию в мир. Белый флаг с гордостью демонстрируется на протяжении всей выставки, остающиеся участниками, что большая часть этого сейчас возможна только благодаря стабильности, которую Королевство обеспечило за мрачные годы существования республики. Многое сделано из того, что было продемонстрировано там, с Португалией, которая в состоянии по-настоящему показывать предметы со всех четырех уголков планеты, от Китая, Индии, до Африки и и инсулиндии, несмотря на то, что это дорого стоит, поскольку гордый народ, которого португальцы радуют тому, что их достижения были продемонстрированы миру."

 portugalnavy.2.d: "К счастью, правительство [от . GetAdegive Cap] увидело смысл и наши большие средства и любезно приняло наше предложение. Корабли в настоящее время вылетают из своих портов и прибудут в португальские порты, готовые защитить нашу родину и империю."
 portugalnavy.3.d: "Глупо то, что правительство [от .GetAdegive Cap] отвергло наше предложение. В прошлом их ржавые корабли, вероятно, утонули бы по прибытии, и мы выше их жалких морских способностей."

 #Politics Events
 portugalpolitics.1.d: "С учетом того, что экономика Португалии находится в тяжелом состоянии и популярность ККБ находится на самом низком уровне, Хосе Фернандо де Соуса из ККЗ выступил с требованием о повышении роли в правительстве и увеличении числа мест в Королевском конгрессе ККЗ. Он утверждает, что это является отражением неспособности ККБ надлежащим образом защитить Португалию от кризиса и их непопулярности. ~ Несмотря на то, что де Пайва Кусейро не желает делать этого, ККС все больше зависит от того, сможет ли он фактически управлять Португалией де-факто. Если он отстранит ее от власти, это может лишь подтолкнуть ККЗ к еще большему оружию ИЛ."
 #
 portugalpolitics.2.d: "В короткой речи, в которой он заявил, что, по его мнению, он достиг всех своих целей вместе с партией, де Соуса ушел от руководства PCC. Ссылаясь на свой возраст и потребность в более молодом PCC, многие задаются вопросом о том, в какой степени все более влиятельный Антониу Салазар участвовал в решении. nnSalazar стоит перед PCC на пороге прихода к власти в Португалии, и многие возлагают на него большие надежды. Он уже пользуется большой поддержкой среди молодежи партии и стал фамилией на всей территории Португалии. Пока еще не известно, может ли он стать премьер-министром."
 #
 portugalpolitics.3.d: "Когда Салазар был руководителем активированного PCC, он уже начал создавать проблемы. Он постоянно толкает массы законов, слишком много для того, чтобы верхняя палата Королевского конгресса могла должным образом судить, и слишком много для того, чтобы CCM могла правильно оценить. Это кажется не коалицией, а, наоборот, одной стороной, пытающейся сделать другого младшим партнером. Если оставить на его усмотрение Салазар, то он может просто ввести в действие CCM неактуальность."
 #
 portugalpolitics.4.d: "Вместе с де Соузой, симпатичной интегралисткой, теперь исчез, Салазар представляет собой новую эру PCC и, возможно, тот, где он отбрасывает IL вопреки желаниям своего предшественника, но это рано в руководстве Салазара, и отчуждение IL может оставить его и его партию слабыми перед лицом CCM."
 #
 portugalpolitics.5.d: "После того, как ККБ опустили ногу и начали не принимать участие в голосовании против законодательства ККЗ, Салазар сейчас мало что мог сделать с тем, чтобы ИЛ воздержался при голосовании."
 #
 portugalpolitics.6.d: "После того, как ККБ опустили ноги и начали не принимать участие в голосовании против законодательства ККЗ, они быстро обнаружили, что при активной поддержке ИЦП, а также независимых и незначительных членов партии, они мало что могли сделать для того, чтобы остановить цунами законодательства."
 #
 portugalpolitics.7.d: "Хотя это дает ККБ возможность легко принимать законы без проблем, можно лишь задаться вопросом, что планируют две вторые по величине партии."
 #
 portugalpolitics.8.d: "Небольшая армия приняла решение по Лиссабону, направленному в Королевский конгресс и резиденцию короля. В Конгрессе присутствующие члены ККБ были решительно изгнаны и изгнаны на улицу, за которыми последовали члены ККЗ и ИЛ, сопровождавшиеся для того, чтобы занять свои места. Между тем королю потребовали создать новую коалицию в качестве правительства Португалии. Мануэль II, который решительно выступает против кровопролития, сразу же согласился с этими требованиями и почти сразу же после того, как начался хаос."
 #
 portugalpolitics.9.d: "С де Соузой, симпатичной интегралисткой, которая ушла, Салазар представляет собой новую эру ПКК и, возможно, тот, где он отказывается от ИЛ вопреки желаниям своего предшественника."
 #
 portugalpolitics.10.d: "В течение короткого периода времени казалось, что игра Салазара окупилась. С уменьшением присутствия ИЛ в парламенте и ККС в петтерах, казалось, что была обеспечена гегемония ЦКЗ. Однако гордость пришла до падения, когда второй марш на Лиссабоне состоялся, когда королевский конгресс атаковал армию, преданную ИЛ. ~n ni ni men lident the IL штурмовали здание и физически удалили нынешних членов ККН, преданных Салазару. Тем временем, де Соуса, не так давно покидающий свой пост лидер ЦКЗ, вновь взял под свой контроль ЦКЗ вместе с членами, лояльными ему с помощью ИЛ. Однако теперь он полностью зависит от ИЛ. Сейчас это лишь вопрос времени, прежде чем король подтвердит это положение дел и Рапо будет объявлен премьер-министром."
 #
 portugalpolitics.11.d: "С течением времени IL все больше недоволен доминирующим положением PCC при Салазаре. Сегодня они объявили о прекращении своих связей с PCC и вступили в оппозицию. Однако это не имеет никакого значения в великой схеме вещей, поскольку правило PCC в значительной степени защищено, и IT мало что может сделать, чтобы бросить им вызов. Многие утверждают, что им следовало нанести удар, пока железо было горячим."
 #
 portugalpolitics.12.d: "Сегодня [ROOT.Get Header] подтвердил, что Антониу Салазар является премьер-министром Королевства Португалия. Начиная с бюрократа, мало кто может предсказать свой метеоритный подъем с этой должности, до экономической исполнительной власти с чрезвычайными полномочиями, которую называют экономическим спасителем, премьер-министру всей Португалии. Премьер-министр обещает вести Португалию уверенно, сохраняя ее в безопасности от внутренних и внешних угроз и экономического процветания внутри. Многие задаются вопросом, перейдет ли его почти диктовальная власть над экономикой в свой стиль правления в качестве премьер-министра. В любом случае, есть большие надежды на будущее Португалии."
 #
 portugalpolitics.13.d: "Сегодня [ROOT.Get Header] подтвердил, что Ипиото Рапосо является премьер-министром Королевства Португалия. Один из основателей Французского движения вдохновил в 1914 году Integralismo Lusitano, теперь более 20 лет спустя он взял эту партию на правя настоящим Королевством Португалии. ~n ni this премьер-министр будет искать радикальный традиционистский, антипарламенталистский и органический монархистский путь, делая упор на традиционной форме монархии против как аболитизма, так и либерального конституционализма. В то время как многие празднуют, либералы отчаялись, как это, кажется, последний гвоздь в гробу либерально-республиканского проекта."
 #
 portugalpolitics.14.d: "Поскольку угрозы его руководству исчезли, Энрики де Пайва Кусейро остается премьер-министром Королевства Португалия, и, будучи героем даже его оппонентов в IL и PCC, Кусейро финансировал восстановление монархии и руководство ею в 1920-х и начале 1930-х годов."
 #
 portugalpolitics.15.d: "В короткой речи, в которой он заявил, что, по его мнению, он достиг всех своих целей вместе с партией, де Соуса ушел из руководства ПКК. С учетом своего возраста и необходимости более молодого ПКК, многие сомневаются в том, насколько все более влиятельным был Антониу Салазар в этом решении. Несмотря на то, что он является симпатиком-интегралистом, де Соуса поощряет Салазара к оказанию помощи ИЛ в сохранении своих мест и влияния, удерживая блок против ККБ. Однако Салазар сталкивается с ПКК в момент прихода к власти в Португалии и может использовать возможность для того, чтобы изгнать ИЛ. Многие возлагают на него большие надежды, поскольку он уже пользуется большой поддержкой среди молодежи партии и стал фамилией на всей территории Португалии. Пока еще не известно, может ли он стать премьер-министром и успешно противостоять ЦКМ и ИЛ."

 porlaststand.1.d: "Мы не позволим им добраться до Лисбоа!"

 portugalnavy.1.d: "Португальцы обратились к нам с просьбой о покупке крейсера "Ри Горизия"."
 portugalnavy.4.d: "Португальцы обратились к нам с просьбой о покупке корабля HMS Anson." #singular
 portugalnavy.5.d: "Португальцы обратились к нам с просьбой о покупке эсминцев Ванкишер, Бланш и Уорвик. Эти три корабля важны для нашего флота, и, возможно, было бы неразумно продавать их, хотя средства, которые предлагают португальцы, довольно смазливы." #plural
 portugalnavy.6.d: "Португальцы обратились к нам с просьбой о покупке подводных лодок H28, H31 и H33. Эти три подводных лодки важны для нашего флота, и, возможно, было бы неразумно продавать их, хотя средства, которые предлагает португальец, довольно смазливы." 
 portugalnavy.7.d: "Португальцы обратились к нам с просьбой о покупке подводных лодок U10, U11 и U12. Эти три подводных лодки важны для нашего флота, и, возможно, было бы неразумно продавать их, хотя средства, которые предлагает португальец, довольно смазливы." 

 portugalspain.1.d: "Поражение монархиста Испании привело к тому, что многие из них остались в плену, погибли или были брошены в тюрьму. Двое из них - Франсиско Франко и Эмилио Баррера, которые бежали к нам, надеясь получить убежище и вступить в ряды наших вооруженных сил, в основном благодаря нашей поддержке монархистского движения. Хотя они могли бы быть нам полезны, было бы неразумно заполнять ряды наших генералов иностранцами."
 #
 portugalspain.2.d: "Поражение националистской Испании привело к тому, что многие из них остались в плену, погибли или были брошены в тюрьму, и одним из них является Рикардо Рада Пераль, который бежал к нам, надеясь получить убежище и вступить в ряды наших вооруженных сил, главным образом благодаря нашей поддержке Карлистского движения, хотя он мог бы быть полезен нам, было бы неразумно заполнять ряды наших генералов иностранцами."
 #
 portugalspain.3.d: "С восстановлением испанского Королевства генералы Испании не должны оставаться здесь, и теперь они могут вернуться домой."
 #
 portugalspain.4.d: "После восстановления испанского государства у генералов Испании нет причин оставаться здесь, и теперь они могут вернуться домой."
 #
 portugalspain.5.d: "Поражение националистской Испании привело к тому, что многие из них остались в плену, погибли или были брошены в тюрьму. Один из них — Хуан Ягуэ, который бежал к нам, надеясь на убежище и на вступление в ряды наших вооруженных сил. Ягуэ, в основном благодаря сочувствию правящему правительству ИЛ, надеется, что однажды наше правительство сможет вмешаться и освободить Испанию от левизма. Хотя он мог бы быть нам полезен, было бы неразумно заполнять ряды наших генералов иностранцами."
 #
 portugalspain.6.d: "Португалия направила средства Карлистам, и, хотя это укрепляет нашу коалицию, мы должны остерегаться их влияния."
 #
 portugalspain.7.d: "Оппортунистические португальцы украли Галицию прямо из-под нас, вынуждая наше правительство покинуть Корунья и забрав регион для себя во имя защиты региона от левых сил."
 #
 portugalspain.8.d: "Испанцы-националисты сдались этому региону после того, как наши силы захватили в основном незащищенный регион и вынудили свое правительство выйти из него."
 #
 portugalspain.9.d: "Португальское правительство дало нам ультиматум, требуя, чтобы мы передали наш флот!"
 #
 portugalspain.10.d: "[From.GetName] мудро предпочёл сдать свой флот нам, и теперь наш флот поддерживает большое число испанских кораблей."
 #
 portugalspain.11.d: "[From.GetName] решили отказаться от нашего ультиматума, и, пытаясь захватить их флот силой, мы обнаружили, что он был полностью разрушен!"
 #
 portugalspain.12.d: "Мы решили отказаться от нашего ультиматума, и, пытаясь захватить их флот силой, мы обнаружили, что он был частично разбит. Остальные корабли могут быть отремонтированы и скоро будут приведены в эксплуатацию."
 #
 portugalspain.13.d: "Они решили отказаться от нашего ультиматума, и, пытаясь захватить их флот силой, мы обнаружили, что их люди все еще пытаются уничтожить флот, к счастью, мы прибыли вовремя и смогли захватить весь флот, не потеряв корабль."
 #
 portugalspain.14.d: ""
 #
 portugalspain.15.d: ""
 #
 portugalspain.16.d: ""
 #
 portugalnavy.17.d: ""
 #
 portugalspain.23.d: "Теперь, когда Испания свободна от левомыслия, мы можем отступить от границы, отдавая территорию, которую мы захватили, и оставляя националистов и монархистов для урегулирования своих разногласий."
 #
 portugalspain.24.d: "Теперь, когда испанская гражданская война закончилась, мы видели, как португальцы обращались с нами в самый темный час. Теперь возникает вопрос: дружны ли они или враги?"
 #
 portugalspain.25.d: "После нашей поддержки испанцев на протяжении всей гражданской войны они решили вернуть эту услугу и направить инвестиции и поддержать наш путь."
 #
 portugalspain.26.d: "Наша уловка во время гражданской войны, хотя и приносит пользу, сейчас возвращается, чтобы нас укусить, так как новое правительство Испании осудило нас, ясно, что Иберия не увидит мира."

 #DWR Events
 portugaldwrevents.1.t: "Добровольцы британских администраторов"
 portugaldwrevents.1.d: "Крушение Британской империи привело к тому, что многие из них лишились цели служить империи, среди поселенцев, солдат, инженеров и других, которые поддерживали огромную империю, было множество высококвалифицированных администраторов. Наша хватка на территориях, в которых живут англоязычные поселенцы, позволила нам получить доступ к их богатому опыту. С их помощью мы можем сплотить нашу Империю, как они держали вместе старую Британскую Империю."
 portugaldwrevents.1.a: "Давайте заставим их работать."
 portugaldwrevents.2.t: "Преимущества контроля над Суэзом"
 portugaldwrevents.2.d: "С помощью инженеров, как иностранных, так и имперских, мы очень быстро отремонтировали шрамы войны на Суэцком канале. Мировые торговцы с облегчением вынуждены больше не ездить по мысу, чтобы добраться до места назначения, и очень готовы платить сборы, которые мы платим за канал. В результате в наше казначейство вливается огромная сумма денег, при этом мало признаков остановки. Сегодня хороший день для Португальской империи."
 portugaldwrevents.2.a: "В Голд!"
 portugaldwrevents.3.t: "Африка Э Носса!"
 portugaldwrevents.3.d: "Мы забрали из Африки все, что хотели, французы и британцы, наши главные соперники в Африке, встали на место умумилита."
 portugaldwrevents.3.a: "Полная победа!"

 ### Peace Deals ###

 portugaldwrevents.400.t: "Супремность в Западной Африке"
 portugaldwrevents.400.d: "С португальским контролем над Французской Гвинеей и Кот-д'Ивуаром, а также с любыми попытками захвата Франции, которые могут привести к огромным жертвам, ясно, что французы находятся на заднем плане, и, возможно, было бы разумно сообщить французам, что если они когда-либо намеревались вернуться домой, то они должны признать свое поражение, а не оказаться втянутыми в колониальную войну над некоторыми не очень важными землями."
 portugaldwrevents.400.a: "Пришлите им наши условия."
 portugaldwrevents.400.b: "Мы их раздавим!"

 portugaldwrevents.401.t: "Победа в Западной Африке"
 portugaldwrevents.401.d: "С португальским контролем над Французской Гвинеей и Сьерра-Леоне очевидно, что военная ситуация развивалась не в нашу пользу, а в случае любой попытки захвата, которая может привести к огромным жертвам, и мы не можем позволить себе потерять больше людей в далекой войне."
 portugaldwrevents.401.a: "Прибереги наши пули для лучших врагов"
 portugaldwrevents.401.b: "Уничтожить этих стартов!"

 portugaldwrevents.402.t: "Противоречие!"
 portugaldwrevents.402.d: "Похоже, жар попал к головам [из-за того, что у них был приступ], и они категорически отвергли наши милосердные условия!"
 portugaldwrevents.402.a: "Аванте!"

 portugaldwrevents.405.t: "Контроль за буффером"
 portugaldwrevents.405.d: "Нашим армиям удалось дойти до запланированного буфера, хотя мы могли бы пойти дальше, на наших армиях было бы очень тяжело сражаться с войной, а на государстве - управлять регионом. Если мы пошлем соглашение индейцам, которые требуют буфера в обмен на мир, а португальцы уйдут с земель за пределами буфера, они, скорее всего, примут."
 portugaldwrevents.405.a: "Отправь индейцам наши условия"
 portugaldwrevents.405.b: "Португальская Индия звучит неплохо."

 portugaldwrevents.406.t: "Португальский марш от Гоа!"
 portugaldwrevents.406.d: "Неожиданное вторжение португальцев из Гоа оставило в их руках обширную территорию, которую теперь они требуют в качестве буфера в обмен на мир."
 portugaldwrevents.406.a: "Мы разберемся с ними позже."
 portugaldwrevents.406.b: "Не сдаваться!"

 portugaldwrevents.407.t: "Индийский отказ!"
 portugaldwrevents.407.d: "[[Всевышний сообщил о том, что неверующие отказываются уверовать в Божьих посланников и отреклись от того, что им было ниспослано в Коране. Они отказываются уверовать в то, что ниспослано Аллахом, и отказываются уверовать в Его посланника, да благословит его Аллах и приветствует, и от того, что Он ниспослал Своему посланнику, да благословит его Аллах и приветствует, а также от того, что Он ниспослал ему откровение."
 portugaldwrevents.407.a: "Они заплатят за свои глупости."


 portugaldwrevents.410.t: "Контроль над побережьем в Кот-д &apos; Ивуаре"
 portugaldwrevents.410.d: "Мы вновь унизили Миттелафрика, и мы снова можем требовать уступок, мы могли бы потребовать, которые им, вероятно, придется принять, взять Кот-д'Ивуар в обмен на выход из Золотого побережья и любых других спорных районов, которые мы контролируем, или, поскольку эти унижения, кажется, являются для них обычным явлением, мы могли бы, кроме этого гугуна из его страданий, хотя немцы вряд ли примут нас на это."
 portugaldwrevents.410.a: "Сообщите Миттелафрике о наших терминах"
 portugaldwrevents.410.b: "Убейте немецкого зверя!"

 portugaldwrevents.411.t: "Победа в Западной Африке"
 portugaldwrevents.411.d: "С португальским контролем над Кот-д'Ивуаром ясно, что военная ситуация развивалась не в нашу пользу. Любая попытка захвата, которая может привести к огромным жертвам, и мы не можем позволить себе потерять гордых немцев, которые будут необходимы для сохранения Миттелафрика. Согласимся ли мы с их условиями?"
 portugaldwrevents.411.a: "Прибереги наши пули для индейцев."
 portugaldwrevents.411.b: "Уничтожить этих стартов!"

 portugaldwrevents.412.t: "Немецкий отказ!"
 portugaldwrevents.412.d: "Не удивительно, что среди немцев Миттелафрика появилось безумие, они упорно отказались от наших условий, объявили о полной войне против Португальской империи, обеспечив, чтобы в этом году Берлину не было унижения, и, похоже, мы находимся в Африке в течение долгого времени."
 portugaldwrevents.412.a: "Мы повесим Геринга в Дар-эс-Саламе!"

 portugaldwrevents.415.t: "У нас есть Галисия!"
 portugaldwrevents.415.d: "Мы можем потребовать, чтобы испанцы признали нашу аннексию региона в обмен на мир, потребовали, чтобы они согласились с множеством других проблем, с которыми сталкивается их страна в то время португальское вторжение, или же мы можем рискнуть и нейтрализовать испанскую угрозу во благо, хотя общественная поддержка войны ослабевает без какой-либо четкой цели на оставшуюся часть войны."
 portugaldwrevents.415.a: "Мы вернёмся за еще..."
 portugaldwrevents.415.b: "Вперед!"

 portugaldwrevents.416.t: "Португальские требования"
 portugaldwrevents.416.d: "Португалия оккупировала Галицию и требует ее аннексии в обмен на мир."
 portugaldwrevents.416.a: "Оставьте наши пули другим врагам."
 portugaldwrevents.416.b: "Не сдаваться Западной Испании"

 portugaldwrevents.417.t: "Испания отвергает наши требования!"
 portugaldwrevents.417.d: "Испанцы считают наши условия неприемлемыми."
 portugaldwrevents.417.a: "В Мадрид!"

 portugaldwrevents.420.t: "У нас есть Галисия!"
 portugaldwrevents.420.d: "Мы можем потребовать, чтобы испанские социалисты признали нашу аннексию региона в обмен на мир, потребовали, чтобы они согласились с многочисленными другими проблемами, с которыми сталкивается их страна, а затем с португальским вторжением."
 portugaldwrevents.420.a: "Мы закончим с ними позже."
 portugaldwrevents.420.b: "Аванте!"

 portugaldwrevents.421.t: "Португальские требования"
 portugaldwrevents.421.d: "Португалия оккупировала Галицию и требует ее аннексии в обмен на мир."
 portugaldwrevents.421.a: "Мы должны признаться"
 portugaldwrevents.421.b: "Иберийское единство сейчас!"

 portugaldwrevents.422.t: "Испанцы отвергают наши требования!"
 portugaldwrevents.422.d: "Тогда нам лучше продолжить этот крестовый поход."
 portugaldwrevents.422.a: "В Барселону!"

 portugaldwrevents.430.t: "Панамский канал наш!"
 portugaldwrevents.430.d: "Наш морской пехотинец инсценировал дерзкую посадку в Панамском канале, столкнувшись с сопротивлением, обезопасив район и арестовав оставшуюся часть американского гарнизона и гражданского персонала, мы можем потребовать суверенитета над каналом в обмен на возвращение заключенных в их семьи, условия, которые мы считаем более чем справедливыми, или мы можем продолжать эту войну дальше."
 portugaldwrevents.430.a: "Отправить требования"
 portugaldwrevents.430.b: "Мы не закончили с американцами."

 portugaldwrevents.431.t: "Португальские требования"
 portugaldwrevents.431.d: "Португалия оккупировала Панамский канал и требует его аннексии в обмен на мир и возвращение заключенных."
 portugaldwrevents.431.a: "Мы должны признать..."
 portugaldwrevents.431.b: "- Серьёзно?"

 portugaldwrevents.432.t: "[[Всевышний поведал о том, что люди отказываются уверовать в Него и отказываются уверовать в Его посланников. Они отказываются уверовать в то, что Аллах ниспослал Своему посланнику, да благословит его Аллах и приветствует, и отворачиваются от того, что Он ниспослал Своему посланнику, да благословит его Аллах и приветствует, а также от того, что Он ниспослал Своему посланнику, да благословит его Аллах и приветствует, то, что Он ниспослал Своему посланнику, да благословит его Аллах и приветствует."
 portugaldwrevents.432.d: "В довольно насмешливом письме [From.GetName] отвергли наши требования и заявили, что война закончится только после того, как они свергнут стройный режим и восстановят нашу безоговорочную капитуляцию."
 portugaldwrevents.432.a: "Они вознаградят за свое высокомерие."

 portugaldwrevents.435.t: "Панамский канал наш!"
 portugaldwrevents.435.d: "Наш морской пехотинец инсценировал дерзкую посадку в Панамском канале, столкнувшись с сопротивлением, защитив район и арестовав оставшихся британских гарнизонов и гражданских сотрудников, мы можем потребовать суверенитета над каналом в обмен на возвращение заключенных в их семьи, условия, которые мы считаем более чем справедливыми, или мы можем продолжать эту войну дальше."
 portugaldwrevents.435.a: "Отправить требования"
 portugaldwrevents.435.b: "Мы не закончили с англичанами."

 portugaldwrevents.436.t: "Португальские требования"
 portugaldwrevents.436.d: "Португалия оккупировала Панамский канал и требует его аннексии в обмен на мир и возвращение заключенных."
 portugaldwrevents.436.a: "Мы должны признать..."
 portugaldwrevents.436.b: "Слишком много для 1373."

 portugaldwrevents.437.t: "Британцы отвергают наши требования!"
 portugaldwrevents.437.d: "Британцы с возмущением отреагировали на захват канала, назвали его, среди прочего, грубым предательством, открыто отвергли наши требования."
 portugaldwrevents.437.a: "Слишком много для 1373."

 portugaldwrevents.440.t: "Константинополь наш!"
 portugaldwrevents.440.d: "Наши силы сокрушили боссов и город миров, который теперь в руках верующих, мы можем потребовать города и окружающих его районов или продолжить наш крестовый поход до остальной части Анатолии."
 portugaldwrevents.440.a: "Отправить требования"
 portugaldwrevents.440.b: "Деус Вульт!"

 portugaldwrevents.441.t: "Португальские требования"
 portugaldwrevents.441.d: "Португалия оккупировала Босфор и требует его аннексии в обмен на мир."
 portugaldwrevents.441.a: "У нас нет выбора."
 portugaldwrevents.441.b: "Не сдаваться язычникам!"

 portugaldwrevents.442.t: "[[Всевышний поведал о том, что люди отказываются уверовать в Него и отказываются уверовать в Его посланников. Они отказываются уверовать в то, что Аллах ниспослал Своему посланнику, да благословит его Аллах и приветствует, и отворачиваются от того, что Он ниспослал Своему посланнику, да благословит его Аллах и приветствует, а также от того, что Он ниспослал Своему посланнику, да благословит его Аллах и приветствует, то, что Он ниспослал Своему посланнику, да благословит его Аллах и приветствует."
 portugaldwrevents.442.d: "[Возвращающийся Капитан] отказался от наших требований, заявив, что город и близлежащий район имеют для них важное значение, и поэтому война продолжается."
 portugaldwrevents.442.a: "Вперед."

 portugaldwrevents.450.t: "Мы контролируем Суэц."
 portugaldwrevents.450.d: "Наш морской пехотинец захватил Суэц, и теперь мы можем предъявить требования [813. владельцу."
 portugaldwrevents.450.a: "Требуйте канала мира"
 portugaldwrevents.450.b: "[813. Владелец. Наименование] встанет на колени!"

 portugaldwrevents.451.t: "Португальские требования"
 portugaldwrevents.451.d: "Португалия оккупировала Суэцкий канал и требует его аннексии в обмен на мир."
 portugaldwrevents.451.a: "У нас нет выбора."
 portugaldwrevents.451.b: "Не сдаваться!"

 portugaldwrevents.452.t: "[813. Владелец. GetName] отвергает наши требования!"
 portugaldwrevents.452.d: "Владелец [813.getadition Cap] отказался от наших требований, заявив, что Суэц жизненно важен для их нации."
 portugaldwrevents.452.a: "Вперёд в Каир!"


 portugaldwrevents.470.t: "Мы забрали наши заявления."
 portugaldwrevents.470.d: "Мы забрали регионы, которые хотели бы от англичан, и теперь их государство борется за то, чтобы удержать оставшиеся районы с ростом местных беспорядков. Мы предложим им справедливый мир - они передают наши претензии, мы не стираем Британскую Ист-Индию с карты."
 portugaldwrevents.470.a: "Отправьте предложение."
 portugaldwrevents.470.b: "Убрать его с карты звучит неплохо."

 portugaldwrevents.471.t: "Португальские требования"
 portugaldwrevents.471.d: "Португалия оккупирует стратегические регионы на наших землях, они не передают их, они будут стремиться к полной аннексии."
 portugaldwrevents.471.a: "У нас нет выбора."
 portugaldwrevents.471.b: "Не сдаваться!"

 portugaldwrevents.472.t: "Британцы отвергают наши требования!"
 portugaldwrevents.472.d: "Британцы отвергли наши требования, заявив, что Ист-Индия имеет для них жизненно важное значение, и поэтому война продолжается."
 portugaldwrevents.472.a: "Мы отправим их в море!"

 portugaldwrevents.475.t: "Мы забрали наши заявления."
 portugaldwrevents.475.d: "Мы забрали регионы, которые мы хотим от инсулиндцев, и теперь их нация борется за то, чтобы удержать оставшиеся регионы с ростом общественных волнений. Мы предложим им справедливый мир - они передают наши претензии, мы не отнимем у них вновь завоеванную независимость."
 portugaldwrevents.475.a: "Пришлите наши требования."
 portugaldwrevents.475.b: "Инсулиндия никогда не должна была быть свободной."

 portugaldwrevents.476.t: "Португальские требования"
 portugaldwrevents.476.d: "Португалия оккупирует стратегические регионы на наших землях, они не передают их, они будут стремиться к полной аннексии."
 portugaldwrevents.476.a: "Лучше, чем без земель."
 portugaldwrevents.476.b: "Ни один европейский ботинок!"

 portugaldwrevents.477.t: "Инсулинды отвергают наши требования!"
 portugaldwrevents.477.d: "Инсулиндианцы отвергли наши требования, заявив, что для них жизненно важное значение имеет их добросовестность, и поэтому война продолжается."
 portugaldwrevents.477.a: "Никакого пощады!"

 portugaldwrevents.480.t: "Сингапур - наш!"
 portugaldwrevents.480.d: "Тысячи британских заключенных стоят в португальских лагерях военнопленных после того, как нам удалось захватить британскую крепость на востоке."
 portugaldwrevents.480.a: "Сингапур будет достаточно"
 portugaldwrevents.480.b: "Деленда Эст"

 portugaldwrevents.481.t: "Португальские требования"
 portugaldwrevents.481.d: "По мере того, как на родине вспыхивают беспорядки из-за этого унижения, мы должны решить, сдадим ли мы Сингапур и покончим с этой войной."
 portugaldwrevents.481.a: "Достаточно кровопролития."
 portugaldwrevents.481.b: "Мы не потерпим этого унижения!"

 portugaldwrevents.482.t: "Британцы отвергают наши требования!"
 portugaldwrevents.482.d: "Британцы отвергли наши требования, заявив, что Сингапур не является отверженным."
 portugaldwrevents.482.a: "Покончим с Восточным Зверем!"

 portugaldwrevents.485.t: "Джибути в наших руках!"
 portugaldwrevents.485.d: "Несмотря на то, что Джибути мало внимания уделяется [268. владельцу. Гетнаму], на самом деле они возмущены сейчас, мы захватили его. Однако, с нашим контролем над Суэзом, предотвращающим любое подкрепление [268.владелец."
 portugaldwrevents.485.a: "Джибути э Носса!"
 portugaldwrevents.485.b: "Война продолжается!"

 portugaldwrevents.486.t: "Португальские требования"
 portugaldwrevents.486.d: "С португальским контролем над Суэзом почти нет надежды на возвращение Джибути, и мы должны отдать его, пока это не вышло из-под контроля."
 portugaldwrevents.486.a: "У нас нет выбора."
 portugaldwrevents.486.b: "Мы будем бороться за каждый дюйм!"

 portugaldwrevents.487.t: "[268. Владелец."
 portugaldwrevents.487.d: "[268. Владелец."
 portugaldwrevents.487.a: "Проклятье их!"

 portugaldwrevents.490.t: "Джибути в наших руках!"
 portugaldwrevents.490.d: "С учетом того, что Могадишо сейчас находится под угрозой со стороны наших сил, сомалийцы пытаются защитить свою родину."
 portugaldwrevents.490.a: "Джибути сделает это."
 portugaldwrevents.490.b: "Сомали Э Носса!"

 portugaldwrevents.491.t: "Португальская победа в Джибути"
 portugaldwrevents.491.d: "С учетом того, что Могадишо находится под угрозой португальского оружия, было бы разумно сдать территорию Джибути, с тем чтобы умиротворить их экспансионизм, иначе они решат лишить нас независимости."
 portugaldwrevents.491.a: "Мы должны выжить любой ценой."
 portugaldwrevents.491.b: "Не европейский ботинок на Сомалиленде!"

 portugaldwrevents.492.t: "Сомалийцы отвергают наши требования!"
 portugaldwrevents.492.d: "Сомалийцы отвергли наши требования, заявив, что Джибути будет возвращена."
 portugaldwrevents.492.a: "Как возмутительно."

 portugaldwrevents.495.t: "Победа в Адене!"
 portugaldwrevents.495.d: "После амфибийной посадки солнце в Адене теперь заходит с нашим голубым и белым флагом, плывущим с гордостью над городом. Если йеменцы решат признаться, то один из старейших позей Британской империи станет нашим новым, если мы не решим пойти дальше."
 portugaldwrevents.495.a: "Спрос Адена"
 portugaldwrevents.495.b: "Создать Португальскую Юго-Западную Аравию"

 portugaldwrevents.496.t: "Португальская победа в Адене"
 portugaldwrevents.496.d: "Поскольку Сана находится под угрозой португальского оружия, может быть, было бы мудро сдать Аден, чтобы успокоить их экспансионизм, иначе они решат лишить нас независимости."
 portugaldwrevents.496.a: "Мы должны выжить."
 portugaldwrevents.496.b: "Мы не забирали Адена назад, чтобы отдать его!"

 portugaldwrevents.497.t: "Йеменцы отвергают наши требования!"
 portugaldwrevents.497.d: "Йеменцы отвергли наши требования, заявив, что Аден будет восстановлен."
 portugaldwrevents.497.a: "Глупая ошибка."

 portugaldwrevents.500.t: "Мы забрали Цейлона!"
 portugaldwrevents.500.d: "После амфибийной посадки португальский флаг снова пролетает над Цейлоном!"
 portugaldwrevents.500.a: "Спрос на Цейлон"
 portugaldwrevents.500.b: "Мы еще не закончили с [422. Владелец."

 portugaldwrevents.501.t: "Португальский захват цейлона"
 portugaldwrevents.501.d: "Цейлон в португальских руках, и многие в нашем кабинете требуют его возвращения. Португалия предлагает мир в обмен на признание ее контроля над Цейлоном. Что нам делать?"
 portugaldwrevents.501.a: "В любом случае, это пустая трата денег."
 portugaldwrevents.501.b: "В Португалию нет земли!"

 portugaldwrevents.502.t: "[422. Владелец."
 portugaldwrevents.502.d: "Зверь [422. Владелец. Найдите адаптивный капитан] отказался от наших требований, заявив, что Цейлон будет восстановлен."
 portugaldwrevents.502.a: "Доброе утро ненавидит [422. Владелец."


 portugaldwrevents.510.t: "Захват Родезии"
 portugaldwrevents.510.d: "Выйдя из-под контроля правительства [545. Владелец], мы оккупируем Родезию, и наши силы угрожают Преторию. Мы можем потребовать уступки Родезии от наших врагов или пойти дальше в мыс."
 portugaldwrevents.510.a: "Родезия - наша!"
 portugaldwrevents.510.b: "Нет четвертака для 545. Владелец."

 portugaldwrevents.511.t: "Португальский захват Родезии"
 portugaldwrevents.511.d: "Родезия захвачена, и португальцы требуют ее аннексии в обмен на мир!"
 portugaldwrevents.511.a: "Родезийцы сами по себе."
 portugaldwrevents.511.b: "Не сдаваться!"

 portugaldwrevents.512.t: "[545. Владелец. Найти] отвергает наши требования!"
 portugaldwrevents.512.d: "В отсутствие капитуляции от [545. владельца. Найти] у нас нет другого выбора, кроме как идти на юг."
 portugaldwrevents.512.a: "Вперед!"

 portugaldwrevents.515.t: "Победа в войне в Ираке"
 portugaldwrevents.515.d: "Мы должны потребовать прекращения огня, чтобы мы могли сосредоточиться на интеграции этих богатых нефтью земель в наше королевство."
 portugaldwrevents.515.a: "Вызовите!"
 portugaldwrevents.515.b: "Давайте избавим их от страданий."

 portugaldwrevents.516.t: "Вторжение Ирака"
 portugaldwrevents.516.d: "Мы были беспомощны против португальских сил, продвигающихся в Ирак, теперь земля находится под их правлением, теперь они требуют прекратить боевые действия и мы признаем их оккупацию."
 portugaldwrevents.516.a: "Мы не можем позволить себе больше боевых действий"
 portugaldwrevents.516.b: "Никогда!"

 portugaldwrevents.517.t: "[291. Владелец."
 portugaldwrevents.517.d: "Без капитуляции от [291. Владелец. Возьмите капита], мы должны идти на север."
 portugaldwrevents.517.a: "Мы повесим их всех!"

 portugaldwrevents.520.t: "Победа в Хузестане"
 portugaldwrevents.520.d: "Нефтяные богатые земли Хузестана теперь находятся под нашей честной рукой, и [413. Владелец."
 portugaldwrevents.520.a: "Запрашивайте территорию!"
 portugaldwrevents.520.b: "Марш в Тегеран!"

 portugaldwrevents.521.t: "Вторжение Хузестана"
 portugaldwrevents.521.d: "Мы беспомощны против португальских сил, продвигающихся в Хузестан, теперь земля находится под их правлением, теперь они требуют прекратить боевые действия и мы признаем их оккупацию."
 portugaldwrevents.521.a: "Мы не можем позволить себе больше боевых действий"
 portugaldwrevents.521.b: "Никогда!"

 portugaldwrevents.522.t: "[413. Владелец."
 portugaldwrevents.522.d: "Без капитуляции со стороны [413. Владыки. Возьмите капита], мы должны идти на север."
 portugaldwrevents.522.a: "Мы возьмем Тегеран!"

 portugaldwrevents.535.t: "Падение Марокко"
 portugaldwrevents.535.d: "С нашей полной оккупацией Марокко быстро становится ясно, что регион является морской слепотой для французов из Средиземноморья и Северной Атлантики. Мы можем подать в суд за «мир с честью», где французы могут смыть эту войну под ковер и передать ее как португальское вторжение в номинально независимое Марокко, а вместо этого подать небольшой дипломатический протест в связи с нашим «нарушением марокканского суверенитета»."
 portugaldwrevents.535.a: "Отправь запрос!"
 portugaldwrevents.535.b: "Нет, в Париж!"

 portugaldwrevents.536.t: "Португейские имеют Марокко!"
 portugaldwrevents.536.d: "Португалия настаивала на том, чтобы мы согласились с их аннексией Марокко, объясняя, что мы можем сохранить лицо для этого поражения, отказавшись от Марокко как своего собственного независимого государства и вместо того, чтобы вести полномасштабную войну, мы можем заявить дипломатический протест."
 portugaldwrevents.536.a: "Жестокий дипломатический протест"
 portugaldwrevents.536.b: "На войну!"

 portugaldwrevents.537.t: "Франция отвергает наши требования!"
 portugaldwrevents.537.d: "Плохие французы проигнорировали наши требования."
 portugaldwrevents.537.a: "Мы маршируем по Парижу!"

 portugaldwrevents.540.t: "У нас есть Гибралтар!"
 portugaldwrevents.540.d: "Мы можем потребовать признания нашей аннексии региона в обмен на мир, потребовать, чтобы они согласились с многочисленными другими проблемами, с которыми сталкивается их страна, а затем с португальским вторжением, или же мы можем рискнуть и нейтрализовать угрозу [118. Владелец. Владелец в обмен на аннексию в обмен на мир, хотя общественная поддержка войны не имеет четкой цели на оставшуюся часть войны."
 portugaldwrevents.540.a: "Мы вернёмся за еще..."
 portugaldwrevents.540.b: "Вперед!"

 portugaldwrevents.541.t: "Португальские требования"
 portugaldwrevents.541.d: "Португалия оккупировала Гибралтар и требует его аннексии в обмен на мир."
 portugaldwrevents.541.a: "Оставь наши пули пока."
 portugaldwrevents.541.b: "Не сдаваться Западной Испании"

 portugaldwrevents.542.t: "Отклоняет наши требования!"
 portugaldwrevents.542.d: "Мы считаем наши условия неприемлемыми, и им стыдно."
 portugaldwrevents.542.a: "Вперед!"

 portugaldwrevents.555.t: "Ирак пал."
 portugaldwrevents.555.d: "После успешного приземления в Басре наша армия сражалась за Евфрат и захватила Багдад."
 portugaldwrevents.555.a: "Пришлите наши требования."
 portugaldwrevents.555.b: "Полная война!"

 portugaldwrevents.556.t: "Пуругейская победа в Ираке"
 portugaldwrevents.556.d: "Португалия оккупировала Ирак и требует его аннексии в обмен на мир."
 portugaldwrevents.556.a: "Давайте посмотрим, как долго они там продержатся."
 portugaldwrevents.556.b: "Мы не можем оставить иракцев"

 portugaldwrevents.557.t: "Египет отвергает наши требования!"
 portugaldwrevents.557.d: "Египтяне считают наши условия неприемлемыми."
 portugaldwrevents.557.a: "В Каир!"

 portugalrepublic.0.d: "Сообщения о различных полицейских рейдах в Лиссабоне сообщили нам о постоянно растущем числе республиканских элементов в нашем обществе, и мы не сомневаемся в том, что это объясняется нашей неспособностью контролировать наши территории, что подрывает стабильность нашего режима, хотя мы сможем держать эти группы в заключении до сих пор, ситуация может выйти за рамки нашего контроля в ближайшем будущем."
 portugalrepublic.1.d: "Республиканские движения вышли из-под нашего контроля. но Лиссабон сильна, но окружена республиканскими силами. К счастью, север тоже остается верным нам... но мы увидим гораздо больше кровопролития на наших землях."

