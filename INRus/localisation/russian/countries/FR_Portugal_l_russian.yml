 POR_LSMC_idea_1: "Последствия столкновения на Лондонском фондовом рынке"
 POR_LSMC_idea_1_desc: "Португалия-шоу, крепкая связь с британской торговлей и ее зависимость от нее означают, что она была очень сильно повреждена Лондонским фондовым рынком, и мы должны немедленно противодействовать этим последствиям."
 POR_LSMC_idea_2: "Последствия столкновения на Лондонском фондовом рынке"
