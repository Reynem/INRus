 portugal_focus: "Португальское дерево фокуса"

 ### Parties ###
 POR_vanguardist_party: "ПХФ (рейты)"
 POR_vanguardist_party_long: "После его высылки в 1926 году, после отказа сотрудничать с анархистами, связанными с КГТ, бывший генеральный секретарь Хосе Карлос Стайс создал свою собственную организацию, которая по-прежнему выступает против анархистского сотрудничества."
 POR_collectivist_party: "КУФП (КГТ/ФАП)"
 POR_collectivist_party_long: "Комитет профсоюзов Объединенного фронта в настоящее время представляет собой группу социалистов, которые скрываются, находятся в заключении или находятся в изгнании в Москве после провала всеобщей забастовки 1934 года. &quot; Генеральная конфедерация труда &quot; и Федерация анархистов Португуза являются двумя взаимосвязанными фракциями, образующими социалистическую оплотку Объединенного фронта. &quot; КПТ &quot; номинально возглавляется основателем &quot; Мануэлем Жоакимом де Соуса &quot; из тюрьмы, который представлен Хосе да Силва Сантосом Арранхой в Москве. &quot; КПТ &quot; считается наиболее воинствующей революционной группой в Португалии и впоследствии сталкивается с самыми репрессиями в Лиссабоне. &quot; Анархистская федерация &quot; является крылом &quot; Иберийской анархистской федерации &quot; , образующей еще один политический фронт для КПТ. &quot; Несмотря на то, что &quot; де Суза &quot; является сторонником панивного единства &quot; , многие члены КПТ в лучшеме ске или в худшом против этой позиции &quot; ."
 POR_libertarian_socialist_party: "КУФП (ПХФ/ФАО)"
 POR_libertarian_socialist_party_long: "Комитет профсоюзов Объединенного фронта в настоящее время существует как группа социалистов, скрывающихся, заключенных в тюрьму или изгнанных в Москву после провала всеобщей забастовки 1934 года. Коммунистическая партия Португуза боролась со времени восстановления. Под руководством Бенто Антониу Гонсалвеса они проводили политику сотрудничества с анархистами, либертарианцами и государственными социалистами, что является отходом от принимающей стороны по отношению к ним в соответствии со ставками Хосе Карлоса. После прагматизма в отношении революции коммунисты надеются, что стратегия Объединенного фронта принесет свои плоды в свое время. Федераансианская социалистическая федерация ассоциаций трудящихся (Социальная федерация ассоциаций трудящихся) представляет умеренных социалистических профсоюзных активистов при Объединенном фронте, которые сохраняют презумпцию в Португалии из-за отсутствия радикальных действий со стороны них. Их небольшие размеры привели их к тому, что они стали посредниками между ГТ и ПКП."
 POR_social_democrat_party: "ПРЕВЫШЕНИЕ"
 POR_social_democrat_party_long: "Демократическая левая Республиканская партия является марксистской, демократической и социалистской партией, сформированной в 1924 году, отделившейся от Демократической партии после идеологического спора с Афонсо Коста."
 POR_social_liberal_party: "ПРП"
 POR_social_liberal_party_long: "Демократическая партия, получившая название &quot; Португальская республиканская партия &quot; , является левой в центре, прогрессивной партией, которая является самопровозглашенным преемником первоначальной Республиканской партии, которая возглавила революцию 1910 года. &quot; Афонсо Коста &quot; , сформированная в Фебури 1912 года Афонсо Коста после того, как старая Республиканская партия распалась, демократы были политически доминирующим движением (с несколько авторитарными суперменствами) на протяжении большей части существования Республики до тех пор, пока Сидонио Пайс не укрепил свою власть в 1917 году, после чего они выступали в качестве главного противника консервативной военной диктатуры. &quot; Коста &quot; , после восстановления монархии, привела своих последователей в изгнание, и партия может быть привязана почти ко всем повстанческим попыткам свержения монархии с 1931 года. &quot; После выхода на пенсию Коста &quot; , демократы были запери в борьбе между популистом-колонистантом Либера Пинто Пинто Пинто, который хочет реформировать большую демократическую партию старой партии, и бывшего и бывшего заместителя Коста-кона Марии Марии Марии Марии Марии Марии Марии Марии Марии Марии Давы, де Сильвы, де-ко де-ко, де-бе."
 POR_market_liberal_party: "УРН (Либерай)"
 POR_market_liberal_party_long: "В феврале 1923 года в изгнании была образована либеральная консервативная партия - Республиканская либеральная партия, Реконституционная партия и остатки Национальной республиканской партии. Националисты были созданы для того, чтобы обеспечить более прочную основу для борьбы с восстановленной монархией, объединив правых республиканцев под одним знаменем. Их мнения являются смешанными, представляя широкий круг интересов и идеалов, причем их основной объединяющей идеологией является «антидемонстрация» или сильная оппозиция Демократической партии. Националисты возглавляются не одним человеком, а, скорее, коллективным лидерством с различными правыми центрами и правыми политиками. «Либеральные» — это классическая либеральная фракция, состоящая преимущественно из бывших членов Республиканской либеральной и реконституционной партии, которая в то же время активно возглавляется харизматиком Антонио Гранджо. Либералисты выступают за экономическую либерализацию выше всего остального, поддерживая грандиозное открытие торговли для более широкого мира. Гранджо является доминирующей фракцией."
 POR_social_conservative_party: "УРН (Союз)"
 POR_social_conservative_party_long: "В феврале 1923 года в изгнании была образована либеральная консервативная партия - Республиканская либеральная партия, Реконституционная партия и остатки Национальной республиканской партии. Националисты были созданы для того, чтобы обеспечить более прочную основу для борьбы с восстановленной монархией, объединив правых республиканцев под единым знаменем. Их взгляды являются смешанными и представляют широкий круг интересов и идеалов, причем их главной объединяющей идеологией является «антидемонстрация» или сильная оппозиция Демократической партии. Националисты поддерживают не один человек, а коллективное руководство с разными правыми в центре и правыми политиками. «Союзники» являются социально-консервативной фракцией, возглавляемой Франсиско да Кунха Лиалом и представляющей главным образом бывшие «сидонисты» и католические республиканцы. Союзисты поддерживают культурные консервативные предприятия, будучи самыми доброжелательными в любой республиканской группе. Под влиянием Кунха Леала, они также поддерживают колониалистскую деятельность."
 POR_authoritarian_democrat_party: "PCC"
 POR_authoritarian_democrat_party_long: "Партия Католического центра, сформированная в январе 1915 года с интуитивной целью представлять католические интересы в Антиклерической Республике, не является монархисткой сперва, что антиклерикизм, естественно, втянул католиков в оппозицию. Когда Республика начала разваливаться, католический центр отказался от своей поддержки, при этом некоторые ключевые члены обратились к королевской армии. После восстановления католический центр стал крупнейшей формальной политической партией в Королевском конгрессе. После фракционного спора в 1920 году страстный монархист и симпатичный симпатизист Хосе Фернандо де Соуса возглавил эту партию, хотя его возраст привел к тому, что более молодая группа членов вокруг профессора Антонио Салазара заняла видное место."
 POR_paternal_autocrat_party: "ККБ"
 POR_paternal_autocrat_party_long: "Зонтик многих роялистов, Совет монархистов, представляет собой шаткую причину."Monarchist Cause" coalition-party that has ruled Portugal alongside the Catholic Centre Party since the restoration in 1920, and was initally formed in 1911 to pursue a restoration of the Monarchy. Though the Monarchist Cause's official purpose is the continued protection and strengthening of monarchist institutions, their secretive aim is a 'National Restoration' to empower the Monarch and form a conservative personalist dictatorship around them. With a non-interventionist and constitutionalist liberal King in Manuel II, and strong opposition from other right wing elements in the CCM and IL, this is unlikely to happen with the current state of affairs. Currently, a two horned attack of the IL and PCC is repeatedly challenging CCM primacy, flanking the Council from both the left and right, threatening their hegemony. With Henrique de Paiva Couceiro currently the primary leader, his advancing age and length of rule is calling into question his leaderhip and it may be time for new leadership of the Council. With potential leaders in short supply, it seems that it is likely the Council may be swept away entirely.§!"
 POR_national_populist_party: "Ил"
 POR_national_populist_party_long: "В 1911 году в Университете Коимбры родилось движение Луситанский витражист , хотя эта группа была основана до 1914 года. Эта группа быстро стала известна как антикультурное движение в Республике, которое поддерживает крайне реакционистские, традиционистские и элитарные взгляды на политику. Внезапно , антилибералы и ультрамонархисты боролись против демократов и республиканской системы, хотя политикам-интегралистам и диктатуре Кастро Новая Республика . С началом восстановления Информалисты были одной из наиболее влиятельных группировок контрреволюционеров. Однако после восстановления интегралисты застопорились; ; правительство Цусейро считало, что их влияние продолжает расти с слабостью ЦКМ и стратегическим союзом!"
 POR_valkist_party: "ИЛ (Валькистас)"
 POR_valkist_party_long: "В 1911 году в Университете Коимбры родилось движение Луситанский интегралист , которое было создано до 1914 года. Единообразие быстро стало известно как антикультурное движение в Республике, которое поддерживает крайне реакционный, традиционистский и элитистский взгляд на политику. Абсолютно антилиберальный и ультрамонархистский , интегралисты , боролись против демократов и республиканской системы. Интегралисты были одной из самых влиятельных фракций контрреволюционеров. Однако после восстановления интегралисты , которые рассматривались правительством Кусейро в качестве предлога для дальнейшей борьбы с ."

 POR_PCC_salazar_party: "PCC"
 POR_PCC_salazar_long: "Партия Католического центра, сформированная в январе 1915 года с интуитивной целью представлять католические интересы в Антиклерической Республике. С тех пор как Хосе Фернандо де Соуса ушел в отставку, Антониу Салазар взял на себя ответственность за поддержку со стороны молодежи партии."

 PR_pcc_un: "ООН"
 PR_pcc_un_long: "Национальный союз был создан Салазаром после роспуска Партии Католического центра."

 #### Description ####
 POR_FUHRERREICH_DESC: "Во время Великой войны португальцы сражались с немцами на полях Фландрии и в разгаре Мозамбика. Победы во время Великой войны было недостаточно для того, чтобы спасти республику, раздираемую враждой, насилием и контрреволюционными монархистами. С тех пор Португалия видела лишь рост своего богатства и территории, подкрепленный их британским благодетелем. Однако с раздробленностью на королевском конгрессе, новыми глобальными угрозами на горизонте, падающей глобальной экономикой и жестокой гражданской войной в Испании мир, которым пользуется Португалия, может быть подорван в предстоящие годы."

 POR_manuel_leader_desc: "Мануэль II, король Португалии, несомненно, не имел надежного трона с момента своего рождения. Несмотря на то, что в 1908 году, после убийства его отца, он вступил в положение, окруженное угрозами монархии, с одним антимонархистом, говорящим королю &quot; Ваше Высочество слишком молодо в республиканской революции 1910 года &quot; . Несмотря на его популярность среди населения, население Португалии всегда было в значительной степени аполитичным, и большая часть элиты развилась против монархии, при этом монархия считалась неэффективной в управлении Португалией и ее имперскими интересами, несмотря на то, что в 1890 году после &quot; Pink Map débacle &quot; . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . ."

 ### Focuses ###
 #Il In Charge
 POR_il_in_charge: "Взято слово интегралист"
 POR_il_in_charge_desc: "ИЛ отбросила своих врагов и теперь готова править Португалией во имя традиций, монархии и католической церкви."
 POR_parliamentary_reforms: "Парламентские реформы"
 POR_parliamentary_reforms_desc: "Парламентаризм - это грязное пятно для Португалии, и для того, чтобы положить этому конец, мы должны прежде всего доминировать в ней, необходимы реформы, которые увеличат нашу власть над ней."
 POR_convince_the_king: "Убедить короля"
 POR_convince_the_king_desc: "Мануэль II является для нас бесчинным королем, который позволяет нам править генералом, как мы хотим, и, конечно же, настоящим патриотом. Однако он явно не полностью согласен с нашим правлением."
 POR_control_the_king: "Контролировать короля"
 POR_control_the_king_desc: "Дуарте II - король, который доставил нам неприятности, надеясь, что власть приблизится к абсолютной монархии, он окажется в противоречии с нашим присутствием, мы должны убедиться, что он не превзойдет свои щедроты, и, может быть, однажды он действительно будет работать с нами."
 POR_suspend_parliament_temp: "Перерыв в работе парламента"
 POR_suspend_parliament_temp_desc: "До тех пор, пока мы не решим судьбу парламента, мы приостановим его на неопределенный срок."
 POR_the_fate_of_the_parliament: "Судьба парламента"
 POR_the_fate_of_the_parliament_desc: "Мы должны решить, будем ли мы откладывать парламент или использовать его в своих целях."
 POR_abolish_parlament_foever: "Упразднять парламент"
 POR_abolish_parlament_foever_desc: "Никогда не забывай, что парламент - враг. Все остатки либерализма должны быть удалены."
 POR_rubber_stamp_parliament: "Парламент каучука"
 POR_rubber_stamp_parliament_desc: "Хотя мы выступаем против существования парламента, он может оказаться полезным для нас в легитимизации нашего правления."
 POR_defender_of_the_faithful: "Защитник верности"
 POR_defender_of_the_faithful_desc: "Мы хранители католической церкви!"
 POR_great_chain_of_being: "Великая цепь бытия"
 POR_great_chain_of_being_desc: "От Бога до самого низшего существа, все существа и материя приказываются великой иерахией, хотя в просвещении эта идея была отвергнута в пользу популизма, это подлинно иерахиальное понимание бытия должно быть восстановлено."
 POR_establish_and_empower_local_bodies: "Создание и расширение возможностей местных органов власти"
 POR_establish_and_empower_local_bodies_desc: "Семья, приход, корпорация, община, большие и малые органы обеспечивают, чтобы народ массового человека, как в Валькистской Германии или Соединенных Штатах, не возникал. Разнообразие местной культуры, обычаев и эстетики должно сохраняться."
 POR_enforce_autonomy_and_decentralisation: "Принудительная автономия и децентрализация"
 POR_enforce_autonomy_and_decentralisation_desc: "Сопротивление либеральным или статистически настроенным людям нашему установлению локализма должно быть отменено."
 POR_a_hand_to_the_youth: "Рука молодежи"
 POR_a_hand_to_the_youth_desc: "Молодежь финансирует наше будущее и движение, Геротократия никогда не выживает, мы должны развивать нашу молодость."
 POR_praise_our_heroes: "Восхваляйте наших героев"
 POR_praise_our_heroes_desc: "Великие герои нашего прошлого - Нуно Альварес Перейра, Афонсо Энрики и святые, которые руководили им, - должны быть возвышены как национальные примеры, их истории станут основой, на которой мы будем строить характер нового португальского поколения."
 POR_military_cooperation: "Удовлетворение военных"
 POR_military_cooperation_desc: "Либеральные элементы в армии должны быть сокрушены, военные должны использоваться нами, а не наоборот."
 POR_tear_up_liberal_reforms: "Разорви либеральные реформы"
 POR_tear_up_liberal_reforms_desc: "Либерализм - это моральный сифилис."
 POR_embrace_corpratism: "Соревнование по корпоративности"
 POR_embrace_corpratism_desc: "Либеральный капитализм и материалистический социализм — это две стороны одной и той же ложной монеты. Мы восстановим подлинно органическое общество, организовав нацию в корпорации: гильдии работников и работодателей, муниципалитеты и приходы, которые работают в гармонии на общее благо, а не на классовую войну."
 POR_the_burden_we_wear: "Бремя, которое мы несем"
 POR_the_burden_we_wear_desc: "Мы не должны забывать о важности империи."
 POR_organic_kingdom: "Органическое Царство"
 POR_organic_kingdom_desc: "Органическая революция завершена, и сейчас мы стоим как тихое королевство на Атлантическом побережье, не обязательно богатейшее, но все еще зависть Европы."

 #CCM
 POR_ccm_in_chargeFORREAL: "CCM Сохранить контроль"
 POR_ccm_in_chargeFORREAL_desc: "Политическая ситуация остается напряженной, но силы умеренности и лояльности короне возобладали."
 POR_empower_the_king: "Дать власть королю"
 POR_empower_the_king_desc: "Король должен быть не просто фигуристом, как главный гарант стабильности и души нации, его конституционные полномочия должны быть расширены, он будет умеренной силой, которая будет выше ссоры политиков и фракций."
 POR_purge_gommies: "Левые хирурги"
 POR_purge_gommies_desc: "Красная Менас, будь то в форме социализма, коммунизма или анархизма, это болезнь, которая угрожает нашему королевству. Мы дадим полиции и военным разрешение идентифицировать, арестовать и нейтрализовать все подрывные левые элементы."
 POR_protecting_the_kingdom: "Защищать наше Царство"
 POR_protecting_the_kingdom_desc: "Наше королевство окружено угрозами, как внутренними, так и внешними."
 POR_continue_salazar_reforms: "Продолжайте реформы Салазара"
 POR_continue_salazar_reforms_desc: "Мы должны признать, что Антониу де Оливейра Салазар, независимо от его политических недостатков, был гением финансов. Его принципы сбалансированного бюджета, финансовой ответственности и развития, осуществляемого на государственном уровне, целесообразны. Мы будем продолжать эту экономическую политику для обеспечения процветания Португалии."
 POR_a_stable_economy: "Стабильная экономика"
 POR_a_stable_economy_desc: "Мы должны сфокусироваться на стабильности, прежде всего, без опрометчивых экспериментов, без губительных расходов, рачительно управляя нашими финансами и поддерживая наши основные отрасли, мы создадим стабильную экономическую основу, которую заслуживает наше королевство."
 POR_dont_rock_the_boat: "Не раскачивай лодку."
 POR_dont_rock_the_boat_desc: "Мир разрывается на части. Все идеологии фашизма, коммунизма и либерально-демократии требуют верности. Португальский путь - это ее собственный путь. Мы будем оставаться нейтральными, сохранять свои традиции и не втягиваться в иностранные конфликты. Мы не должны раскачивать лодку."
 POR_a_kingdom_at_peace: "Царство мира"
 POR_a_kingdom_at_peace_desc: "Выбрав умеренность и стабильность, мы построили королевство в мире, тихом и процветающем убежище в безумном мире."
 POR_court_the_council: "Суд над Советом"
 POR_court_the_council_desc: "Королевский совет разделен на жесткой линии и КП . Для эффективного управления мы должны достичь консенсуса. Мы общаемся с умеренными членами совета, заручившись их поддержкой посредством покровительства и компромисса."
 POR_appeasing_the_il: "Успокоить IL"
 POR_appeasing_the_il_desc: "Церковь или символическая награда своих лидеров утешат их традиционные чувства и не позволят им сломать наше правительство."
 POR_appeasing_the_pcc: "Усовершенствование PCC"
 POR_appeasing_the_pcc_desc: "Салазаристы в ПКК являются прагматичными, но амбициозными, предлагая им ключевые экономические министерства и продолжая свои корпоратистские проекты, мы можем заручиться их сотрудничеством и использовать их опыт на благо королевства."
 POR_imperial_pride: "Имперский Прайд"
 POR_imperial_pride_desc: "Португалия находится в зените с точки зрения богатства и богатства; наше Царство никогда до сих пор не растянулось и не управляло столь многими. Немногие империи в истории человечества могут даже сравниться с тем, что было сделано нами с тех пор, как Васко Да Гама покинул наши берега. Нам нечего стыдиться, не говоря уже о том, что мы недостаточно гордимся!"
 POR_the_burden: "Бремя Империи"
 POR_the_burden_desc: "Колонии дорогие и часто неприбыльные, однако наша цель никогда не состояла в том, чтобы разрушать или грабить, а в том, чтобы улучшить положение тех, кто живет в наших Ультрамаринских провинциях."
 POR_purge_gommiestwo: "Tarrafal"
 POR_purge_gommiestwo_desc: "Таррафал, тюремный лагерь в центре Кабо-Верде, держит самых безумных преступников Португалии, держит их подальше от материковой и ультрамарской провинций."
 POR_the_moderating_power: "Умеренная сила"
 POR_the_moderating_power_desc: "Разделение и сбалансированность полномочий между судебной, исполнительной и законодательной ветвями власти хорошо работает в теории, однако в ее нынешнем виде слишком много разногласий между этими ветвями власти для того, чтобы они могли нормально функционировать."
 POR_promote_monsaraz: "Выбрать Монсараза в качестве преемника Кусейро"
 POR_promote_monsaraz_desc: "В то время как Альберто Монсараз перешёл между PCC и IL, он является подлинным монархистом, который может примирить IL и PCC, ведая королевство вперед."


 #PCC/Salazar
 POR_ccm_in_charge: "ЦПК Салазара в силе"
 POR_ccm_in_charge_desc: "Король правит, но именно Антониу де Оливейра Салазар правит, и с PCC в качестве своего инструмента он принесет в Португалию порядок, дисциплину и новое видение, отказавшись от хаоса старых политиков."
 POR_empower_the_executive: "Расширение прав и возможностей премьер-министра"
 POR_empower_the_executive_desc: "Салазар уже продемонстрировал свои достоинства при рассмотрении чрезвычайных полномочий, и его власть должна быть расширена."
 POR_god_fatherland_and_family: "Бог, Родина и семья"
 POR_god_fatherland_and_family_desc: "Это три столпа нашей новой Португалии. Церковь обеспечивает наш моральный компас, Отечество требует нашей полной преданности, а семья является основной ячейкой нашего общества. Каждая политика должна быть посвящена укреплению этих столпов."
 POR_court_the_il: "Суд над ИЛ"
 POR_court_the_il_desc: "Мы не такие уж и разные, ты и я?"
 POR_concordat_with_church: "Конкордат с церковью"
 POR_concordat_with_church_desc: "Церковь - ценное учреждение, но она должна быть вне политики, и мы свяжемся с Ватиканом, чтобы убедиться в этом."
 POR_establish_the_pide: "Учредить ПИДR"
 POR_establish_the_pide_desc: "Мы создадим PIDR, Polícia Internacional e de Defesa do Reino, чтобы бороться с угрозами как на национальном, так и на международном уровнях."
 POR_crack_down_on_socialists: "Уничтожить социалистов"
 POR_crack_down_on_socialists_desc: "Не может быть порядка, пока социалистические и коммунистические агитаторы проповедуют классовую войну. ИПДР будут свободны, чтобы демонтировать свои сети, закрыть прессу и посадить в тюрьму своих лидеров. Португалия будет свободна от этого яда."
 POR_depoliticisation_of_society: "Деполитизация общества"
 POR_depoliticisation_of_society_desc: "Бесконечное ссоры политических партий были разгромом Португалии. Мы будем «деполитизировать» общество, рекомендуя нашим гражданам сосредоточиться на работе, семье и вере, оставляя сложный вопрос управления квалифицированным экспертам."
 POR_salazar_reforms: "Реформы Салазара"
 POR_salazar_reforms_desc: "Салазару удалось спасти экономику Португалии от гибели в 1920-х и начале 30-х годов."
 POR_balancing_the_budget: "Сбалансирование бюджета"
 POR_balancing_the_budget_desc: "Нация, которая не может контролировать свои финансы, не суверенная нация. Мы будем продолжать «Салазарские реформы» с железной волей, сокращая расточительные расходы, увеличивая доходы и уравновешивая бюджет. Бюджетная дисциплина является основой национальной силы."
 POR_expand_special_economic_powers: "Расширение специальных экономических держав"
 POR_expand_special_economic_powers_desc: "Для эффективного управления экономикой премьер-министр должен иметь право действовать решительно."
 POR_corporatist_revolution: "Корпоративная революция"
 POR_corporatist_revolution_desc: "Мы заменим хаос либерального капитализма и угрозу социализма новой упорядоченной "корпоративной революцией". Государство организует всю экономическую жизнь в корпорации, объединяя трудящихся и работодателей под контролем правительства, чтобы работать в интересах национальных интересов."
 POR_robust_economic_management: "Эффективное экономическое управление"
 POR_robust_economic_management_desc: "Благодаря финансовой осмотрительности, государственному руководству и карпоратистской модели мы построили прочную и стабильную экономику."
 POR_dominate_the_CCM: "Доминировать в PCC"
 POR_dominate_the_CCM_desc: "Партия ПКК стала бессмысленным органом, просто средством движения Салазара."
 POR_establish_national_union: "Создание Национального союза"
 POR_establish_national_union_desc: "Национальный союз заменит партии, включая PCC, и будет выступать в качестве антитеза для партии, правящей для Португалии, а не партии."
 POR_estado_novo: "Новое Рейно"
 POR_estado_novo_desc: "С изменениями Салазара в Португалии появилось новое королевство, Ново Рейно, в котором не доминируют партии, не доминируют политики, даже не доминируют король, национальные интересы будут в будущем приоритетом, а не секторальными интересами."


 POR_punish_traitors: "Лусотропикализм"
 POR_punish_traitors_desc: "Ультрамаринские провинции - это не просто аппендициты, или запасы, они являются частью Португалии так же, как и Лисбоа!"

 #########
 #Colonial Tree
 POR_colonial_tree: "Империя"
 POR_colonial_tree_desc: "Наша огромная заграничная собственность, Ультрамар, является источником нашей силы и свидетельством нашей славной истории. Империя должна быть защищена, развита и, по возможности, расширена."
 POR_imperialism: "Возрождение империализма"
 POR_imperialism_desc: "Эпоха империй еще не закончилась. Португалия была первой, и мы будем последними. Настало время утвердить наше господство и восстановить наше место в качестве главной мировой державы."
 POR_twin_empires: "Двойные империи"
 POR_twin_empires_desc: "В то время как некоторые мечты о новых союзах или о восстановлении потерянной славы в Родезии, наша истинная судьба лежит на нашем старейшем союзнике. Англо-португальский альянс является основой нашей безопасности на протяжении веков. Вместо того, чтобы предпринимать неопределенные инициативы, мы должны полностью посвятить наше дружбе с Великобританией, связывая наше будущее со своим. Наши империи, хотя и разные, могут стоять вместе как бастионы стабильности."
 POR_the_pink_map: "Розовая карта"
 POR_the_pink_map_desc: ""Мапа Кор-де-Роса" была нашей мечтой 19-го века: прочная банда португальских территорий от Анголы до Мозамбика. Несмотря на то, что эта мечта была сорвана британским ультиматумом, эта мечта так и не умерла. Пришло время связать наши колонии, побережье и побережье. Чтобы сделать это, необходим определенный разрыв с Великобританией, независимо от того, какой вред она может причинить."
 POR_declare_portuguese_empire: "Объявить Португальскую империю"
 POR_declare_portuguese_empire_desc: "Королевство принесло стабильность. Теперь мы должны провозгласить наш истинный статус миру. Мы не маленькая европейская нация; мы - глобальная империя, и все признают нас таковыми."
 POR_prepare_the_men: "Приготовьте мужчин"
 POR_prepare_the_men_desc: "Мы должны расширить призыв на военную службу и улучшить подготовку наших колониальных и городских армий к предстоящим конфликтам."
 POR_prepare_the_nation: "Подготовить народ"
 POR_prepare_the_nation_desc: "Народ должен быть мобилизован к осуществлению имперского проекта, а национальная пропагандистская кампания объединит население, которое поддерживает наше видение, приготовив его к необходимым жертвам."
 POR_prepare_the_fleet: "Подготовить флот"
 POR_prepare_the_fleet_desc: "Море - это кровь нашей империи, наш флот - маленький и устаревший, мы должны сложить новые киль и переоборудовать старые корабли для защиты морских путей от Луанды до Лиссабона."
 POR_avante: "Аванчар!"
 POR_avante_desc: "Подготовка завершена. Нация готова, армия обучена, флот готов. Время для разговоров окончено. Аванчар! Для Португалии и Империи!"
 POR_maintaining_empire: "Поддержание империи"
 POR_maintaining_empire_desc: "Мы должны инвестировать в нашу колониальную администрацию, улучшать инфраструктуру и подавлять инакомыслие, чтобы Ультрамар остался португальцем навсегда."
 POR_angolan_development: "Развивающаяся Ангола"
 POR_angolan_development_desc: "Ангола богата бриллиантами, кофе и нефтью."
 POR_mozambique_development: "Развивающийся Мозамбик"
 POR_mozambique_development_desc: "Из портов Луренчо Маркес и Бейра в мир может попасть богатство Мозамбика, и мы будем развивать его сельскохозяйственный потенциал и транспортные сети."
 POR_angolan_forts: "Ангольские крепости"
 POR_angolan_forts_desc: "Чтобы защитить наше ценное имущество в Анголе, мы должны построить серию современных укреплений, чтобы удержать любого соседа с амбициями на нашей территории."
 POR_mozambique_forts: "Мозамбикские крепости"
 POR_mozambique_forts_desc: "Новая система береговой обороны и пограничных крепостей обеспечит ее защиту от посягательств на море или на суше."
 POR_colonial_development_focus: "Ультрамаринское развитие"
 POR_colonial_development_focus_desc: "Централизованный план для наших заморских территорий будет координировать развитие промышленности, ресурсов и инфраструктуры, обеспечивая максимальные экономические выгоды для всей империи."
 POR_with_the_british: "Помнишь 1373"
 POR_with_the_british_desc: "Англо-португальский альянс является старейшим в мире. В эту новую опасную эру мы должны подтвердить нашу давнюю дружбу с Великобританией, обретая безопасность и возможности под защитой Королевского ВМС."
 POR_claims_on_french_colonies: "Претензии на французские колонии"
 POR_claims_on_french_colonies_desc: "Если они попадут в хаос, мы должны быть готовы утвердить наше влияние и безопасность территорий, которые выиграли бы от стабильного, португальского управления."
 POR_buy_sierra_leone: "Покупайте Сьерра-Леоне"
 POR_buy_sierra_leone_desc: "Британская колония Сьерра-Леоне имеет ограниченную ценность для Лондона."
 POR_trade_with_britain: "Активизация торговых отношений"
 POR_trade_with_britain_desc: "Наш союз с Великобританией должен быть как экономическим, так и военным."
 POR_buy_british_fighters: "Боевики британских компаний"
 POR_buy_british_fighters_desc: "Наши военно-воздушные силы опасно устарели, британская авиация производит самые лучшие самолеты в мире, мы договариваемся о покупке современных истребителей, таких как Гладиатор или даже новый ураган."
 POR_mozambique_cape_to_cairo: "Дурбан - Дар-эс-Саламская железная дорога"
 POR_mozambique_cape_to_cairo_desc: "Мечта Британии «мыс в Каир» требует прохождения через Восточную Африку. Сотрудничая с ними на новой железной дороге, соединяющей их территории через Мозамбик, мы можем улучшить нашу собственную инфраструктуру и укрепить наши дипломатические связи."
 POR_shanghai_investment: "Шанхай инвестментс"
 POR_shanghai_investment_desc: "Наше древнее владение Макао дает нам опору на Дальнем Востоке."
 POR_a_special_relationship: "Особые отношения"
 POR_a_special_relationship_desc: "Наша связь с Великобританией — это не просто союз, это особые отношения, сложившиеся в течение столетий общей истории, мы будем их самым надежным партнером, статус, который принесет нам великую безопасность и престиж."



 #Army Tree
 POR_army_tree: "Эксессито Португуа"
 POR_army_tree_desc: "Португальская армия имеет гордую историю, но она плохо оснащена для современной войны, мы должны реформировать и перестроить наши силы для защиты нации и империи."
 POR_army_for_empire: "Глобальная армия"
 POR_army_for_empire_desc: "Наша главная обязанность — защищать Ультрамар. Мы сосредоточимся на создании большой, гибкой колониальной армии, экспертов в джунглях и подавлении, чтобы удерживать наши территории от любой угрозы."
 POR_modern_rifles: "Современные винтовки"
 POR_modern_rifles_desc: "Наши войска все еще вооружены оружием XIX века, мы примем новую стандартную винтовку и начнем массовое производство, чтобы каждый солдат обладал современной огневой мощью."
 POR_superior_light_infantry: "Высший пехотный состав"
 POR_superior_light_infantry_desc: "Наши колониальные войны в Африке научили нас ценности легкой, мобильной пехоты."
 POR_modern_logistics: "Современная логистика"
 POR_modern_logistics_desc: "Мы модернизируем нашу колониальную материально-техническую базу, используя моторизованный транспорт, с тем чтобы наши силы могли действовать вдали от прибрежных портов."
 POR_speed_focus: "Война Маноевр"
 POR_speed_focus_desc: "Огромные расстояния Африки не могут контролироваться статическими линиями."
 POR_special_forces: "Корпо де Фузилирос"
 POR_special_forces_desc: "Наши морпехи Фузилийрос являются элитной верхушкой нашего копья, мы расширим их подготовку, чтобы создать многостороннее подразделение спецназа, способное к быстрому развертыванию в любой точке империи морем."
 POR_naval_invasion_improve: "Морские герои"
 POR_naval_invasion_improve_desc: "Как военно-морская империя, наша армия должна быть в состоянии нанести удар с моря."
 POR_reenforce_colonial_armies: "Укрепление колониальных армий"
 POR_reenforce_colonial_armies_desc: "Наши гарнизоны в Африке и Азии тонкие. Мы поднимем новые дивизии преданных Аскари и отправим новое оборудование с родины, чтобы укрепить оборону Ультрамара."
 POR_army_for_europe: "Европейская армия"
 POR_army_for_europe_desc: "Хотя империя важна, мы не должны забывать об угрозе на нашей собственной границе, мы сосредоточимся на создании компактной, хорошо вооруженной европейской армии, способной защитить родину от любого континентального врага."
 POR_modern_artillery: "Современная артиллерия"
 POR_modern_artillery_desc: "Современные войны выигрываются артиллерией, мы будем выдавать лицензии на производство современных полевых пушек и гаубиц, предоставляя нашим дивизиям огневой мощи, которая им нужна для победы на европейском поле боя."
 POR_new_rifles: "Оборудование для отрезания обрезки"
 POR_new_rifles_desc: "Мы будем инвестировать в разработку современного пехотного оружия, включая новые автоматы и противотанковые винтовки."
 POR_motorising_the_army: "Моторизация наших сил"
 POR_motorising_the_army_desc: "Дни маршей армии сочтены, и мы начнем программу, чтобы привести в движение наши дивизии, давая им стратегическую мобильность, чтобы противостоять любому быстрому вражескому продвижению."
 POR_armoured_assault: "Бронированное нападение"
 POR_armoured_assault_desc: "Танк является решающим оружием современной сухопутной войны, но, несмотря на то, что у нас мало опыта, мы покупаем иностранные модели и разработаем собственные доктрины бронетехники."
 POR_equipment_standardisation: "Стандартизация оборудования"
 POR_equipment_standardisation_desc: "Наша армия использует запутанное сочетание немецкого, британского и французского оборудования. Это логистический кошмар. Мы выберем единый стандарт для нашего оружия и оборудования для упрощения поставок и производства."
 POR_support_companies: "Современная поддержка"
 POR_support_companies_desc: "Современная дивизия — это не просто пехота, мы создадим и оснащаем роты комплексной поддержки — инженеры, разведчики и сигнализаторы — для повышения эффективности наших передовых подразделений."
 POR_deploy_modern_divisions: "Развертывать современные дивизии"
 POR_deploy_modern_divisions_desc: "Новые дивизии, полностью оснащенные современным оружием, артиллерией и транспортом, теперь готовы к развертыванию, что дает Португалии армию, которую нужно уважать."
 POR_new_doctrines: "Изучение великой войны"
 POR_new_doctrines_desc: "Наш офицерский корпус изучит тактику огневой мощи и выбытия, которая определяла последний конфликт."
 POR_quicker_training: "Эффективный учебный режим"
 POR_quicker_training_desc: "Чтобы быстро расширить нашу армию, мы должны быстрее готовить новобранцев, мы будем стандартизировать и активизировать наш основной учебный режим, с тем чтобы превратить гражданских лиц в солдат в рекордное время."
 POR_fortify_the_east: "Реактивировать линию Торреса Ведраса"
 POR_fortify_the_east_desc: "Линии Торреса Ведраса знаменито спасли Лиссабон от Наполеона."
 POR_further_doctrine_reform: "Изучение современной тактики"
 POR_further_doctrine_reform_desc: "В настоящее время разрабатывается новая тактика, включающая комбинированное вооружение, воздушную поддержку и быстрое движение, наши генералы изучат эти современные доктрины, чтобы мы не остались позади."

 #Navy Tree
 POR_navy_tree: "Марина Португеза"
 POR_navy_tree_desc: "Для защиты нашей глобальной империи мы должны восстановить Марину Португезу."
 POR_cruiser_research: "Изучайте дизайны круизеров"
 POR_cruiser_research_desc: "Легкие крейсеры - это рабочие лошади колониального флота, идеальные для защиты торговли и разведки."
 POR_destroyer_research: "Изучение дизайнов Разрушителей"
 POR_destroyer_research_desc: "Нам нужны современные эсминцы, чтобы проконтролировать наши столпные корабли и охотиться на подводные лодки."
 POR_building_grand_fleet: "Строительство Большого флота"
 POR_building_grand_fleet_desc: "Чтобы быть истинной державой, у нас должен быть флот, который может бросить вызов другим в открытом море."
 POR_modern_battleships: "Современные боевые корабли"
 POR_modern_battleships_desc: "Корабль остается высшим символом военно-морской мощи."
 POR_carrier_research: "Инвестиции в будущее"
 POR_carrier_research_desc: "Этот новый «воздушно-воздушно-воздушный корабль» является радикальной концепцией, но обладающей огромным потенциалом, и мы будем инвестировать в изучение этих судов и их доктрин, готовя Португалию к будущему морской войны."
 POR_doctrine_FIB: "Изучение британской доктрины"
 POR_doctrine_FIB_desc: "Мы отправим наших офицеров в Дартмут и Скапа Фолс, чтобы они научились у наших британских союзников, принимая их доктрины контроля над морем."
 POR_buy_british_ships: "Покупайте британские корабли"
 POR_buy_british_ships_desc: "Наши верфи не могут построить современный флот за одну ночь. Мы подойдем к нашим британским союзникам, чтобы купить излишки или новые военные корабли, особенно эсминцы и крейсеры."
 POR_buy_italian_ships: "Покупка итальянских судов"
 POR_buy_italian_ships_desc: "Реджиа Марина разработала впечатляющие современные крейсеры и эсминцы. Мы начнем переговоры с Римом о приобретении некоторых из их передовых военно-морских технологий и кораблей."
 POR_new_dockyards: "Расширение докьярда"
 POR_new_dockyards_desc: "Чтобы построить великий флот, нам нужны великие верфи, мы будем финансировать масштабное расширение наших морских верфей, строительство новых скользких путей, способных управлять боевыми кораблями."
 POR_cut_down_on_costs: "Сокращение расходов"
 POR_cut_down_on_costs_desc: "Мы будем проводить реформы в области эффективности на наших верфях, с тем чтобы сократить время, расходуемое на строительство, и позволить нам строить больше кораблей с одним и тем же бюджетом."
 POR_heavier_investment: "Дальнейшие инвестиции"
 POR_heavier_investment_desc: "Современный флот является самым дорогим и наиболее необходимым из всех военных средств."
 POR_screen_ships: "Новые скриншотные суда"
 POR_screen_ships_desc: "Наши ценные казармы уязвимы без надлежащего экрана. Мы приоритизируем строительство новых эсминцев и легких крейсеров, чтобы защитить их."
 POR_improved_gunnery: "Усовершенствованное оружие"
 POR_improved_gunnery_desc: "Корабль, который не может попасть в цель, бесполезен."
 POR_portugal_rules_the_seas: "Honrai a Pátria que a Pátria vos Contempla"
 POR_portugal_rules_the_seas_desc: "'Почитайте Отечественную землю, ибо Отечественная земля смотрит на вас.' Слова наших предков говорят правду. Наш новый флот готов, сила, способная проецировать португальскую власть по всему миру. Моря снова наши."
 POR_insertyearhere_shipbuilding_programme: "Программа [начало] судостроения"
 POR_insertyearhere_shipbuilding_programme_desc: "Современный флот никогда не будет «кончен». Мы осуществим новую многолетнюю программу по судостроению, чтобы наш флот оставался современным и мощным, адаптируясь к новейшим технологиям."
 POR_building_defensive_fleet: "Флот для защиты Империи"
 POR_building_defensive_fleet_desc: "Наша цель состоит не в том, чтобы прямо бросить вызов великим державам, а в том, чтобы обезопасить нашу обширную империю, мы построим оборонительный флот, основанный на дальних крейсерах и патрульных кораблях, предназначенных для защиты нашего судоходства и береговой линии."
 POR_improve_ship_range: "Стритч через открытое море"
 POR_improve_ship_range_desc: "Наши корабли должны быть в состоянии работать в течение нескольких месяцев от дома, от Гоа до Тимора."
 POR_ports_in_the_colonies: "Расширение Ультрамаринских портов"
 POR_ports_in_the_colonies_desc: "Наши колониальные порты в Африке и Азии не имеют средств для обслуживания современного флота. Мы расширим военно-морские базы в Луанде, Бейре и Макао, чтобы обслуживать наши корабли вдали от Лиссабона."
 POR_faster_cruiser_construction: "Эффективное строительство круизера"
 POR_faster_cruiser_construction_desc: "Крузеры - основа нашей имперской обороны. Мы улучшим наши верфи для их строительства, внедряя модульные технологии, чтобы строить их быстрее и дешевле."
 POR_more_docks: "Более крупные докьярды"
 POR_more_docks_desc: "Наш флот растет, и нам нужно больше средств для его строительства и обслуживания, мы сконструируем новые верфи, сосредоточимся на крейсерах и эсминцах."
 POR_coastal_defences: "Защищать наши прибрежные линии"
 POR_coastal_defences_desc: "Длинные береговые линии Португалии и наших колоний уязвимы. Мы сооружим сеть прибрежных артиллерийских батарей и минных полей для защиты наших ключевых портов от военно-морских нападений."
 POR_flexible_doctrine: "Гибкая доктрина"
 POR_flexible_doctrine_desc: "Наши капитаны будут обучены быть гибкими, овладевать тактикой от конвойного сопровождения до коммерческого рейда и защиты прибрежных районов."
 POR_fleet_of_the_empire: "Вода Империи защищена"
 POR_fleet_of_the_empire_desc: "Наш новый флот дальних крейсеров и эсминцев сейчас патрулирует морские пути из Атлантического океана в Тихий океан."
 POR_building_small_fleet: "Маленькая армада"
 POR_building_small_fleet_desc: "Мы не можем соперничать с великими силами в битве на поверхности, вместо этого мы будем инвестировать в «Армада» подводных лодок, экономически эффективную ассиметричную силу, чтобы истечь кровью любого врага, который осмеливается войти в наши воды."
 POR_submarine_docks: "Подводные докьяры"
 POR_submarine_docks_desc: "Подводные лодки нуждаются в специализированных ручках и ремонтных сооружениях."
 POR_submarine_research: "Изучение современных подводных лодок"
 POR_submarine_research_desc: "Подводная лодка является оружием будущего. Мы будем инвестировать в новые конструкции, стремясь построить лодки, которые будут быстрее, тише и имеют более дальность действия."
 POR_contest_the_atlantic: "Охота в Атлантике"
 POR_contest_the_atlantic_desc: "Северная Атлантика является самым оживленным торговым путем в мире, и наши новые подводные лодки будут предназначены для эксплуатации в этих суровых водах, готовых блокировать судоходство любой страны, которая угрожает нам."
 POR_doctrine_for_wolves: "Вольфпакетные доктрины"
 POR_doctrine_for_wolves_desc: "Единственная подводная лодка - это неприятность; скоординированная группа - это смертельная угроза. Мы изучим новую германскую тактику "волчонок", обучая наших капитанов охотиться в скоординированных группах."
 POR_efficient_sub_building: "Массовое строительство подводной лодки"
 POR_efficient_sub_building_desc: "Чтобы построить настоящий флот подводных лодок, мы должны построить их в большом количестве, мы переоборудуем наши верфи для массового производства, построим подводные лодки быстрее, чем враг может их потопить."
 POR_buy_british_subs: "Покупайте британские подводные лодки"
 POR_buy_british_subs_desc: "Королевский флот разработал великолепные подводные лодки для дальнего патрулирования. чтобы быстро расширить наш флот."
 POR_buy_german_subs: "Покупайте немецкие подводные лодки"
 POR_buy_german_subs_desc: "Несмотря на политические риски, мы тихо откроем каналы с германскими верфи, чтобы приобрести их последние дизайны и технологии."
 POR_punching_above_our_weight: "Напрягается над своим весом"
 POR_punching_above_our_weight_desc: "Наш флот подводных лодок завершен, но Португалия обладает сейчас одним из самых опасных и современных ассиметричных военно-морских сил в мире, способных ударить намного больше своего веса."

 #Air Tree
 POR_Air_Force: "Арея Португеса"
 POR_Air_Force_desc: "На нашей территории нет военно-воздушных сил Португалии, коллекции устаревших бипланов, мы должны построить современную Força Aérea с нуля."
 POR_support_navy: "Поддержка флота"
 POR_support_navy_desc: "Наша первоочередная задача в области военно-воздушной энергетики должна состоять в том, чтобы поддержать Marinha, и мы сосредоточимся на создании военно-морских бомбардировщиков и патрульных самолетов для охраны наших берегов и поиска вражеских флотов."
 POR_modern_fighters: "Современные бои"
 POR_modern_fighters_desc: "Воздушные силы без современных боевиков - это цель, мы будем исследовать и производить новые истребители монопланов, чтобы подметать небо вражеских бомбардировщиков и защитить наши самолеты."
 POR_Royal_Air_Academy: "Совместное командование Эйр-Наваль"
 POR_Royal_Air_Academy_desc: "Мы создадим совместный командный центр для координации военно-морских патрулей, противовоздушной обороны флота и военно-морских налетов."
 POR_carrier_aircraft: "Самолеты"
 POR_carrier_aircraft_desc: "Если мы хотим инвестировать в авианосцы, у нас должны быть специализированные самолеты, чтобы летать с них."
 POR_air_acedemy: "Королевская авиационная академия"
 POR_air_acedemy_desc: "Мы найдем новую Королевскую авиационную академию для подготовки нового поколения опытных и смелых пилотов для наших растущих военно-воздушных сил."
 POR_RADAR_Stations: "Станции RADAR"
 POR_RADAR_Stations_desc: "Эта новая технология "Радио Обнаружение и Рангинг" революционна. Мы построим цепочку станций RADAR вдоль нашего побережья, что даст нам раннее предупреждение о любых воздушных или морских атаках."
 POR_airbases_europe: "Европейские воздушные базы"
 POR_airbases_europe_desc: "Нашим самолетам нужны места для посадки, мы построим новые современные авиабазы на материке Португалии, чтобы разместить наши новые эскадрильи и защитить наше промышленное сердце."
 POR_airbases_ultramarine: "Ультрамаринские военно-воздушные базы"
 POR_airbases_ultramarine_desc: "Азоры, Ангола и Мозамбик жизненно важны, но уязвимы."
 POR_support_army: "Поддержка армии"
 POR_support_army_desc: "Эффективность армии может быть увеличена за счет использования военно-воздушных сил. Мы будем разрабатывать самолеты и доктрины, предназначенные для поддержки наших сухопутных войск, от разведки до бомбардировок."
 POR_CAS_Support: "Развитие системы обеспечения охраны и безопасности"
 POR_CAS_Support_desc: "Мы сосредоточимся на разработке сильно вооруженных самолётов, предназначенных для нападения на позиции противника на передовой линии, действуя в качестве летающей артиллерии для нашей передовой пехоты."
 POR_Ground_Support: "Эффективная наземная поддержка"
 POR_Ground_Support_desc: "Наши пилоты будут обучены работать непосредственно с наземными командирами, учась наносить удары по вражеским танкам, артиллериям и сильным точкам, нарушая волю врага к сражению."
 POR_tacbombers: "Гибкие бомбардировщики"
 POR_tacbombers_desc: "Нам нужен бомбардировщик, способный выполнять многие функции, мы будем инвестировать в тактические бомбардировщики, самолеты, которые достаточно гибки для осуществления наземной поддержки, военно-морские удары и стратегические бомбардировки."

 #Industry

 POR_industrialising_portugal: "Промышленное производство в Португалии"
 POR_industrialising_portugal_desc: "Португалия слишком долго пребывала на заднем аграрном дворе Европы, финансовый хаос Первой Республики был заменен порядком и стабильностью Королевства, когда наш национальный бюджет, наконец, уравновешивался, настало время приступить к великому проекту нашего столетия: систематической и направляющей индустриализации родины, мы строим фабрики, используем ресурсы и создаем национальную экономику, которая восстановит Португалию на ее законное место среди великих наций."

 # Civ Industry Branch
 POR_home_industry: "Развитие отечественной промышленности"
 POR_home_industry_desc: "Первостепенная задача состоит в том, чтобы обеспечить самодостаточность: Португалия не может полагаться на прихоти иностранных рынков в отношении своих основных товаров; направляя инвестиции в отечественную легкую промышленность и механизм, мы будем обеспечивать свой собственный народ, создавать достойные условия для португальских семей и закладывать основы новой национальной экономики, свободной от подрывных международных интересов."

 POR_central_industry: "Централизованное промышленное планирование"
 POR_central_industry_desc: "Хаотичный, эгоистичный свободный для всех либеральный капитализм ведет лишь к неэффективности, эксплуатации и социальным волнениям. Теперь государство будет направлять промышленное развитие на благо всей нации. Мы будем централизовывать планирование, направлять капитал и рабочую силу в ключевые стратегические сектора, обеспечивая упорядоченный, стабильный и обслуживающий португальский народ как единое целое."

 POR_industrial_innovation: "Инновации в промышленности"
 POR_industrial_innovation_desc: "Недостаточно просто построить заводы; мы должны построить современные заводы; мы будем поощрять наши самые яркие умы к развитию новых промышленных процессов, повышению производительности и внедрению технологий, которые будут определять грядущую эру. Португалия не просто присоединится к промышленной революции; мы будем осваивать ее на своих собственных условиях."

 POR_new_electronics: "Поощрять развитие электронной промышленности"
 POR_new_electronics_desc: "Будущее будет определяться невидимыми силами: радиоволнами, электрическими токами и новыми методами механического расчета."

 POR_land_purchases: "Приобретение земли государством"
 POR_land_purchases_desc: "Промышленное развитие требует пространства. Многие из наших наиболее перспективных регионов сталкиваются с трудностями в связи с устаревшими, неэффективно используемыми участками земли, находящимися в собственности бесинтересных сторон. Государство должно вмешиваться, приобретать и укреплять эти районы, с тем чтобы освободить новые дороги, железные дороги и производственные комплексы. Частный интерес должен и будет уступать место национальному благу."

 POR_lisbon_uni: "Расширить Текнский университет Лисбоа"
 POR_lisbon_uni_desc: "Современное промышленное государство требует больше, чем просто рабочих; оно требует нового поколения образованных инженеров, химиков и блестящих технических специалистов. Мы предоставим значительное государственное финансирование Текническому университету Лисбоа, преобразуя его в всемирный центр промышленных исследований и разработок. Его выпускники будут архитекторами нашей новой современной Португалии."

 POR_casa_dos_estudantes_do_imperio: "Нашел "Casa dos Estudantes do Império""
 POR_casa_dos_estudantes_do_imperio_desc: "Наша великая имперская миссия состоит из единства и цивилизации на всех континентах, мы создадим в Лиссабоне дом студентов Империи, в котором будут размещаться и обучаться самые яркие молодые люди из наших заморских провинций, а здесь они будут поглощать португальскую культуру и технический опыт, формируя интеллектуальные и социальные связи, которые объединят нашу плюриконтинентальную нацию на протяжении веков."

 POR_vast_industry: "Огромная промышленная база"
 POR_vast_industry_desc: "Наши усилия заложили основу, теперь мы пожнем урожай, и этот последний, большой толчок приведет к созданию обширной, интегрированной промышленной базы, способной производить все, от потребительских товаров для нашего народа до средств ведения войны для наших солдат."

 POR_new_defence_contracts: "Новые контракты на оборону"
 POR_new_defence_contracts_desc: "Теперь, когда наша гражданская промышленная база достигла зрелости, мы можем полностью обратить внимание на священный долг национальной обороны. Государство выдаст серию новых, крупномасштабных оборонных контрактов, санкционируя строительство новых оружейных заводов, заводов по производству оружия и боеприпасов. Португалия должна быть способной и готова защищать себя и свою обширную империю с современным оружием, производимым португальскими руками."

 # Mil Industrial Branch
 POR_arming_our_men: "Оружие наших людей"
 POR_arming_our_men_desc: "Армия без современных винтовок — это не что иное, как толпа, и нация, которая не может вооружаться, вовсе не является нацией."

 POR_efficient_arms_industry: "Эффективная оружейная промышленность"
 POR_efficient_arms_industry_desc: "Недостаточно просто иметь оружейные фабрики; они должны быть моделями национальной эффективности; мы изучим самые современные производственные технологии, улучшим наши процессы и обучим нашу рабочую силу, с тем чтобы максимально увеличить объем производства и свести к минимуму потери; подлинно эффективная оружейная промышленность станет основой нашей военной мощи."

 POR_expanding_navy: "Расширить военно-морское производство"
 POR_expanding_navy_desc: "Судьба Португалии всегда была и всегда будет связана с морем, наше славное прошлое было построено моряками, и наша будущая империя зависит от нашего командования волнами."

 POR_expanding_port_of_lisbon: "Расширить порт Лиссабона"
 POR_expanding_port_of_lisbon_desc: "Лиссабон - это сердце нашей империи, вход в Африку, Бразилию и весь мир, его порт, хотя и исторический, должен быть модернизирован для удовлетворения потребностей современного военно-морского флота и растущего торгового моря."

 # Infrastructure Branch
 POR_national_infrestructure: "Национальный план развития инфраструктуры"
 POR_national_infrestructure_desc: "Промышленность не может функционировать на дорогах с грязью и устаревшими железными дорогами, а государство разработает всеобъемлющий национальный план развития инфраструктуры, в котором будет четко изложено видение современной взаимосвязанной Португалии, которая станет планом создания новой национальной сети автомобильных дорог, железных дорог и центров снабжения, связывающих страну с сталью и брезентом."

 POR_angolan_colonial_infrestructure: "Развитие инфраструктуры Анголы"
 POR_angolan_colonial_infrestructure_desc: "Наша великая провинция Ангола является сокровищем ресурсов, но большая часть ее богатства остается запертой в глубине страны. Мы построим новую железную дорогу, Каминьо де Ферро де Ангола, чтобы связать побережье с богатыми ресурсами горами. Эта стальная артерия принесет цивилизацию и порядок в пустыню и, в свою очередь, доставит жизненно важные сырьевые материалы на наши фабрики дома."

 POR_mozambique_colonial_infrestructure: "Развитие мозамбикской инфраструктуры"
 POR_mozambique_colonial_infrestructure_desc: "Мозамбик является хранителем наших восточных имперских авуаров и нашего окна в Индийском океане, для того чтобы облегчить его развитие и обеспечить безопасность его длинных уязвимых границ, мы должны создать надлежащую железнодорожную сеть, новые линии соединяют северные и южные территории, соединяя ключевые порты, такие как Луренчо Маркес и Бейра, с внутренними районами и укрепляя наш контроль над этой жизненно важной колонией."

 POR_the_missing_link: "Недостающее звено"
 POR_the_missing_link_desc: "Мечта Мапа Кор-де-Роса, твёрдая, нерушимая группа португальской территории от Атлантического побережья Анголы до побережья Индийского океана Мозамбика, была реализована."

 POR_industrialise_lisbon: "Промышленное производство в Лиссабоне"
 POR_industrialise_lisbon_desc: "В то время как наша национальная гордость коренится в почве, наше промышленное будущее должно быть сконцентрировано, чтобы быть эффективным. Лиссабон, будучи местом правления, нашим крупнейшим городом и нашим главным портом, станет центром нашей новой промышленной экономики. Мы будем направлять инвестиции и новые инфраструктурные проекты в столицу, создавая бурный, современный промышленный центр на банках Тагуса."

 POR_algarve_tourism: "Пропаганда альгарвского туризма"
 POR_algarve_tourism_desc: "Хотя тяжелая промышленность имеет жизненно важное значение, мы не должны игнорировать другие, более гентильные источники доходов. Южное побережье Альгарва , с его чистыми пляжами и благоприятным климатом, -- это драгоценность. Мы будем продвигать регион в качестве места назначения для богатых иностранных туристов, особенно от нашего старого союзника -- Великобритании, и их праздничные расходы будут приветствоваться и политически стабильным дополнением к национальному казначейству."

 POR_expand_lisbon_shipping: "Расширить лиссабонское судоходство"
 POR_expand_lisbon_shipping_desc: "Наши промышленные и имперские амбиции требуют большого торгового флота для перевозки товаров и сырья по всему миру."

 POR_expand_porto_shipping: "Расширение портового судоходства"
 POR_expand_porto_shipping_desc: "Лиссабон не должен быть единственным центром нашей морской мощи. Порто со своей долгой и гордой историей торговли и торговли также увидит новые инвестиции в портовую и судоходную промышленность. Верфи , известные веками, вновь будут хвастаться активностью, поскольку они способствуют нашему национальному торговому флоту."

 POR_developing_portuguese_islands: "Развитие Атлантических островов"
 POR_developing_portuguese_islands_desc: "Мы не должны забывать о наших жизненно важных территориях в Атлантике. Острова Мадейра и Азоры — это не просто сноски; они являются важнейшими точками, бастионами суверенитета Португалии и домом для нашего самого трудного народа; мы будем инвестировать в их инфраструктуру, расширять их порты и улучшать их связи, более тесно интегрируя их в национальную экономику."

 POR_economic_unification_with_galicia: "Экономическое объединение с Галисией"
 POR_economic_unification_with_galicia_desc: "Народ Галисии, наши братья по крови и языку, которые в настоящее время трудятся под испанским правлением, хотя политическое решение может быть отдаленным, мы можем начать процесс воссоединения мирными, экономическими средствами, мы будем вкладывать значительные средства в инфраструктуру северной Португалии, создавая новые железнодорожные и дорожные связи с Галицкой границей, мы объединим нашу экономику и напомним гальцам о процветании их подлинного дома."




 ### Ideas ###
 POR_last_stand: "Последняя позиция Португалии"
 POR_salazars_corporate_eco_watereddown: "Легкое осуществление плана Салазара"
 POR_salazars_corporate_eco: "Корпоративная экономика Салазара"
 POR_faith_and_state: "Государство веры"
 POR_global_army_idea: "Глобальная армия"
 POR_global_army_idea_desc: "Наша сила создана для небольших и средних операций по всему миру, мы сосредоточиваем внимание на скорости, материально-технической поддержке, специальных силах и амфибийных способностях, хотя это обходится дорого для размера и мощности, мы будем рады этим реформам, когда наши силы будут бороться с врагами в лесах Тимора и джунглях Африки."
 POR_european_army_idea: "Европейская армия"
 POR_european_army_idea_desc: "Защита Королевства - это самая важная работа для наших вооруженных сил, у нас не должно быть небольших пехотных сил, как это все еще является Скрамблом для Африки, нам нужны современные крупные боевые силы, оснащенные артиллерией, танками и грузовиками, готовые к сражениям на большой высоте на европейской земле."

 POR_shipsale_porside: "Закупки судов"
 POR_shipsale_forside: "Прибыли из Португалии"

 POR_portuguese_army_good: "Реформированная армия"
 POR_portuguese_army_good_desc: "Наконец, Португалия может гордиться своими силами, храбрыми людьми, которые не ломаются перед лицом врага, которые готовы защитить нашу нацию."
 POR_portuguese_army_mediocre: "Частично реформированная армия"
 POR_portuguese_army_mediocre_desc: "Несмотря на проведение широкомасштабных реформ, мы все еще далеки от армии, которой мы можем гордиться."
 POR_portuguese_army_bad: "Бедный штат Португальской армии"
 POR_portuguese_army_bad_desc: "Если мы хотим защитить нашу нацию и империю в предстоящие годы, мы должны незамедлительно провести реформы."
 POR_grandfleet_idea: "Большой флот"
 POR_grandfleet_idea_desc: ""
 POR_defensive_fleet_idea: "Оборонительный флот"
 POR_defensive_fleet_idea_desc: ""
 POR_rule_portannia: "Honrai a Pátria que a Pátria vos Contempla"
 POR_rule_portannia_desc: ""
 POR_navytime_backfoot_idea: "Маленький флот"
 POR_navytime_backfoot_idea_desc: ""
 POR_portuguese_economic_cooperation: "Экономическое сотрудничество с Испанией"
 POR_portuguese_economic_cooperation_desc: "Общие идеологические и экономические идеи между Португалией и Испанией привели к заключению ряда взаимовыгодных торговых соглашений между обеими сторонами."
 POR_kingpath: "Деус Салве О Рей"
 POR_kingpath_desc: "С завершением комплексного эксперимента провалом и позором король может, наконец, избавить себя и нацию от своего влияния."
 POR_ultramarine_empire: "Ультрамаринская империя"
 PORder_moderador: "Посуда Модерадор"
 PORder_moderador_desc: "В тех случаях, когда полномочия Королевства противоречат друг другу, монарх может резервировать за собой право вмешиваться в пользу своей избранной партии."
 POR_royal_edictos: "Королевские указы"
 POR_royal_edictos_desc: "Широкое использование Королевских указов для принятия законов без одобрения нижней палаты позволило повысить гибкость правительства."
 POR_unlimited_powa: "Абсолютная монархия"
 POR_tarrafall: "Tarrafal"
 POR_tarrafall_desc: "Таррафал, тюремный лагерь в центре Кабо-Верде, держит самых безумных преступников Португалии, держит их подальше от материковой и ультрамарской провинций."
 POR_organic_kingdomi: "Органическое Царство"
 POR_organic_kingdomi_desc: "Муниципализм, традиции и вера являются тремя руководящими принципами, которые приведут Португалию вперед."
 POR_jovens: "Португальская молодежная лига"
 POR_jovens_desc: "Тысячи молодых людей обратились в Португальскую молодежную лигу, чтобы использовать свою безграничную энергию."
 POR_patriot_youth: "Молодежь патриотов Его Величества"
 POR_patriot_youth_desc: "В настоящее время Португальская молодежная лига, наделенная бóльшими функциями и большим числом членов, служит правительству Его Величества в официальном качестве и на высоком уровне."
 POR_yournewempire: "Органическая правовая система"
 POR_yournewempire_desc: "Децентрализованный правовой кодекс означает, что мы можем более эффективно бороться с преступностью в пределах королевства."
 POR_parliament_suspended: "Парламент приостановил свою деятельность"
 POR_parliament_suspended_desc: "Португальский парламент был временно и на короткий срок приостановлен."
 POR_non_ironic_anarcho_monarchism_for_fucks_sake: "Комплексное руководство"
 POR_non_ironic_anarcho_monarchism_for_fucks_sake_desc: "Муниципальные органы власти в настоящее время обладают большей автономией во всех аспектах, имеющих к ним отношение, и поэтому они действуют более эффективно."
 POR_parliament_abolished: "Упразднение парламента"
 POR_parliament_abolished_desc: "С упразднением нижней палаты и уязвимостью верхней палаты конституционная монархия Португалии на данный момент фактически мертва."
 POR_organic_eco: "Органическая экономика"
 POR_organic_eco_desc: "В то время как каждый город удовлетворяет свои собственные потребности, государство вмешивается всякий раз и везде, когда от него требуется помощь в предотвращении нехватки средств и обеспечении процветания."
 POR_colonial_act: "Колониально насильно"
 POR_colonial_act_desc: "Законы о реформе колониальных организаций, принятые в 1927 году, в настоящее время применяются."
 POR_colonial_admin: "Реформа колониальной администрации"
 POR_colonial_admin_desc: "Более молодые и новые колониальные офицеры были привезены из Европы для оказания помощи в управлении нашими заморскими провинциями."
 POR_estudantes: "Casa dos Estudantes do Império"
 POR_estudantes_desc: "Дом студентов Империи - это дом, за который платит правительство, что помогает нам собрать самых лучших и ярких в империи для служения."
 POR_encruzilhada: "Развитие Кабо-Верде"
 POR_encruzilhada_desc: "Прилагаются значительные усилия для развития Кабо-Верде, с тем чтобы содействовать повышению производительности и сокращению числа случаев голода."
 POR_contratados: "Увеличение численности населения в Сан-Томе и Принсипе"
 POR_contratados_desc: "Большое число трудящихся-мигрантов было доставлено в Сан-Томе для работы на плантациях и, как мы надеемся, для обеспечения процветания острова."
 POR_macaud: "Прибыль Макао"
 POR_macaud_desc: "Сейчас, когда Макао находится под нашим непосредственным управлением, наши доходы в этом районе значительно возросли."
 POR_state_of_india: "Реорганизованное государство Индия"
 POR_state_of_india_desc: "В настоящее время государство Индия лучше напоминает современную провинциальную организацию, и мы можем начать извлекать пользу из этих изменений."
 POR_timor_charter_companies: "Чартер компани в Тиморе"
 POR_timor_charter_companies_desc: "В настоящее время компании Хартер инвестируют средства в запутанный Тимор, что позволяет нам, наконец, высвободить богатство провинции, увеличив наш экспорт древесины и кофе и одновременно позволив изыскателям изыскивать более ценные ресурсы."
 POR_heavyshipbuildcost: "Имперский Гран-Флот Эффорт"
 POR_heavyshipbuildcost_desc: "По мере роста нашего большого флота растет и наш опыт в том, чтобы сделать его колосисом угрожающего военно-морского боя."
 POR_smallshipbuildcost: "Имперский военно-морский флот"
 POR_smallshipbuildcost_desc: "Высокая приоритизация наряду с опытом означает, что наши верфи могут производить подводные лодки, которые будут следовать планам ВМС, гораздо быстрее."
 POR_african_triumph: "Африканский триумф"
 POR_african_triumph_desc: "Немецкие нарушители были побеждены и унижены, в то время как Португалия стоит высоко в своем неповиновении!"
 POR_loyal_mozambique: "Верный Мозамбик"
 POR_loyal_mozambique_desc: "Повстанческие группы и племена, появившиеся в Мозамбике во время кризиса, подвергались соответствующему и постоянному обращению."
 POR_milprod: "Линии королевских стандартных скупщин"
 POR_milprod_desc: "Каждый из наших рабочих, как хорошо смазанный крючок в машине, всегда готов к работе."
 POR_trainingi: "Эффективный учебный режим"
 POR_trainingi_desc: "В армейские казармы были включены новые и эффективные тренировочные системы, и теперь мы можем ожидать, что войска будут готовы к боевым действиям более быстрыми темпами."
 POR_knights: "Рыцари Портукейла"
 POR_herois_do_mari: "Герой До Мар"
 POR_herois_do_mari_desc: "Предначертанная Португалией судьба - править морями, и это всегда было так!"
 POR_bravery: "Роялист Элан"
 POR_bravery_desc: "Обширная подготовка и подготовка сделали так, что наши обычные полки бесстрашны и готовы действовать по их приказу в любой момент!"
 POR_integralist_ethos: "Португальский империализм"
 POR_integralist_ethos_desc: ""
 POR_integralist_ethos2: "Португальский империализм"
 POR_integralist_ethos2_desc: ""
 POR_anglos: "Британские администраторы"
 POR_anglos_desc: "С согласия на расширение нашего управления среди англоязычного населения на бывших британских территориях мы начали принимать его в нашу растущую бюрократию, с тем чтобы содействовать управлению нашими колониальными территориями."
 POR_sueznossa: "Суэз Приступы"
 POR_sueznossa_desc: "С нашей поспешной реставрацией и контролем Суэцкого канала мы пожинаем экономические выгоды тысяч тонн глобальной торговли, протекающей через канал."
 POR_luso: "Лусотропикализм"
 POR_luso_desc: "Основываясь на работе Жильберто Фрейре, мы приняли идеи люзотропикализма. Опираясь на пять столетий нашей гуманной цивилизованной миссии , мы предоставили нашим заморским территориям дополнительные полномочия, поощряли смешение иберо-португальских субъектов и коренных жителей за рубежом, а также снижение уровня репрессий в отношении коренных жителей. Хотя результаты были неоднозначными, мы в целом ощущаем более высокий уровень согласия на наше управление за рубежом ."
 POR_navytime: "Военно-морская амбиция"
 POR_navytime_desc: "И хотя за последние несколько лет ситуация улучшилась благодаря большим экономическим успехам, достигнутым после победы во время Великой войны и восстановления монархистов, наш флот по-прежнему слабеет из-за наших соперников и наших кораблей, которые устарели."
 POR_govern: "Португейская мухафаза"
 POR_govern_desc: "Губернатор, в конечном счете, отвечает Лиссабону, и местное население не может больше танцевать под прихоти того, что он когда-то считал своим маленьким, менее значимым соседом." 
 POR_economic_success: "Экономический успех"
 POR_economic_success_desc: "Благодаря огромным британским инвестициям и работе профессора Салазара экономика Португалии быстро растет без конца, и благодаря нашим новым экономическим успехам наши отношения с Великобританией расцветают, в то время как Салазар стал очень популярной фигурой."
 POR_defending_the_empire: "Развивать и защищать нашу Империю"
 POR_defending_the_empire_desc: ""
