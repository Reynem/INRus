 ####events
 irq.10.t: "Разорвать англо-иракское соглашение!"
 irq.10.d: "Англо-иракское соглашение на протяжении многих лет рассматривалось как символ унижения нашего народа, лишающего нас суверенитета над черным золотом под нашей землей. После событий на Лондонском фондовом рынке выгоды, полученные от этого соглашения, больше не сохраняются - инвестиции исчезли, и панарабское оборонное соглашение является ничтожным. Как и любой контракт, если он не выполнит свою сторону сделки, мы не будем его выполнять. Мы объявим, что соглашение будет аннулировано в результате того, что они существенно нарушили условия соглашения. Прекращение этого соглашения позволит нам свободно продавать его на открытом рынке на наших условиях."
 irq.10.a: "Впустите деньги!"

 irq.11.t: "Иракцы разрывают англо-иракское соглашение!"
 irq.11.d: "Англо-иракское соглашение обеспечило нам эксклюзивные права на черное золото под песком вокруг Евфрата. После того, как нас поразил Лондонский фондовый рынок, шлюхи в иракском парламенте заявили, что Соглашение отвергается, поскольку мы не сдержали свою сторону из-за отмены инвестиций и военных гарантий после катастрофы."
 irq.11.a: "Они могут это сделать?"
 irq.111.t: "Перекресток истории"
 irq.111.d: "Соединенное Королевство Масхрик, известное в основном как Масхрик, является стеритивной монархией, расположенной в центре Ближнего Востока между Левантийским побережьем с запада, Курдистаном с севера, Аравией с юга и Персией с Востока, это столицы Багдада и Дамаска, даже если Багдад является местом пребывания правительства, королевская семья в летнее время живет в Дамаске. Но теперь все, о чем говорится в географических книгах, позволяет теперь войти в историю, в 1920 году после падения Османской империи в Ираке произошла революция, которая почти переросла в британскую оккупацию, но она закончилась после того, как британцы каким-то образом выслушали народ Ирака и установили конституционную монархию Сирии, арабское Королевство пережило битву Мейселона под руководством Фейсала I и оттолкнуло французские силы на побережье, где они все еще находятся, в Багдад, Файзал теперь был независимым героем и модернизатором иракских национальных лидеров, а народ призвал Файсала стать королем Ирака после того, как этот Файсал объединил два своих королевства, поддерживалл в настоящее время, Н."
 irq.111.a: "Мавтини аль-Джалаль ва аль-Джамаль"
 irq.112.t: "Письмо Гази"
 irq.112.d: "Ваше Величество, с этого момента мы официально избавились от британцев, а также от наших обязательств перед государствами Залива, одним из которых является Кувейт. Несмотря на то, что все, кто читает книгу по истории, знают, что Кувейт был частью Басры-Влият и что нет необходимости в книгах столько людей, сколько жили в XIX веке и начале XX века, и видели, как британцы и Аль-Сабах украли Кувейт у нашего народа."
 irq.112.a: "Нури, подготовь танки."
 irq.112.b: "Правда, но не сегодня."

