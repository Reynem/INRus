 ###Ideas
 IRQ_Kurdish_resistance: "Курдское сопротивление"
 IRQ_Kurdish_resistance_desc: "Курды всегда были на нашей стороне, во время Османской империи турки использовали курдов для подавления иракской свободы, и теперь мы независимы, они в ярости противостоят нашему правлению, теперь столы поворачиваются, и мы должны бороться с этими беспорядками так или иначе."
 IRQ_The_Parliament: "Иракский парламент"
 IRQ_The_Parliament_desc: "Парламент Ирака был создан вскоре после рождения Королевства, и, основываясь на модели Вестминстера, он выполняет роль, заключающуюся в совмещении власти короля с выборным органом. Кабинет министров под руководством премьер-министра утверждает полномочия отдельного руководящего класса короля и его советников и обеспечивает, чтобы интересы Ирака не были включены в круг интересов Палаты Хашима." 


 IRQ_Faisal_I: "Хашимитская династия" #Old lore
 IRQ_Faisal_I_desc: "Хашимитская династия в Масхрике возлюблена и преподносится королем Фейсалом I Масхриком, королем Масхриком также великим арабским героем Возрождения и сыном Шарифа Хуссиена, Фейсал родился в 1883 году в Мекке, он был отправлен в 9 лет жить с бедуинами, а затем в 13 лет попал в Стамбульскую военную академию и стал оттоманским членом парламента в 18 лет, позже во время Великой войны он начал восстание против оттоманов после того, как Деймал Паша убил некоторых сирийских арабов после войны, которую он основал Сирийское Королевство, и был почти побежден французскими во время битвы Мейслон, но он выиграл битву, а французы только оккупировали побережье, и позднее, после восстания 1920 года в Ираке, он был призван иракским парламентом стать их королем с некоторыми конституционными ограничениями, с которыми он согласился и основал королевство Масхрик."

