 #### Ideas ####

 HAI_american_infrastructure_financing: "Финансирование американской инфраструктуры"
 HAI_american_infrastructure_financing_desc: "Одна из первых целей американских оккупантов заключалась в значительном расширении инфраструктуры острова."
 HAI_american_military_occupation: "Американская военная оккупация"
 HAI_american_military_occupation_desc: "Соединенные Штаты Америки оккупировали этот остров, считая, что их долги перед страной слишком велики, чтобы их легко игнорировать."
 HAI_demoralized_peoples: "Деморализованные народы"
 HAI_demoralized_peoples_desc: "Народ Гаити крайне деморализован. но постоянно беспокоится о том, что революционное правительство будет еще хуже, чем нынешнее."

 ### Characters ###
 HAI_joseph_jolibois_fils: "Джозеф Джолибуа Филс"

 HAI_jacques_roumain: "Жак Румейн"
 # HAI_jacques_roumain_leader_desc: "Жак Румейн, восхитительный поэт, когда-то был близким помощником как либеральных, так и нористских писателей, вместе с группой единомышленников, основавших Гаитянскую синдикалистскую партию, и начал формализацию разрозненных гаитянских левых, хотя однажды он оттолкнулся от своих либеральных и ноиристов в этом процессе, движение, которое он создал, подтолкнуло его к авангарде оппозиции авторитарному режиму Луи Борно."

 HAI_max_hudincourt: "Макс Худинкур"

 HAI_demosthenes_calixte: "Дефезены Каликсте"
 # HAI_demosthenes_calixte_leader_desc: "Полковник Дефезен Петр Калиште является чернокожим, обученным Соединенными Штатами, гаитянским командиром и президентом Гаити с 1933 года. Калихте и его клика захватили власть в контексте доминиканских провокаций на границе, что тогдашний президент Луи Борно не смог справиться с этим, разрешив наращивание военного потенциала. Отъезд последней бригады американских морских пехотинцев позволил Демозену Калихте в его роли командующего Гарде д'Гаити не разрушать президента и захватить власть. Однако, несмотря на то, что президент по-прежнему считает, что Каликсе был вынужден выполнить требования Америки, представленные в Гаити Верховным комиссаром Расселом. Калихте обещал уважать навязанные финансовые ограничения и некоторые ограничения в торговле и внешней политике. В то время как некоторые из его запланированных реформ, такие, как желаемый план наращивания армии, или прекращение столь же сильного гражданского призыва, возможно, но большинство его других обещаний были остановлены в парламенте. Масштабные конституционные реформы, направленные на избрание президента народным голосованием или на отмену Государственного совета, были постоянно заблокированы, в основном из-задирёстного государственного положения, а в заброшенного гера и политического давления."

 HAI_paul_magloire: "Пол Маглуар"

 HAI_jean_price_mars: "Жан Прайс-Марс"
 # HAI_jean_price_mars_leader_desc: "Гаитянский врач, учитель, политик, дипломат, писатель и этнограф Жан Прайс работал секретарем гаитянской легации в Вашингтоне, округ Колумбия, и поверенным в делах в Париже во время Вельткрига."black" consciousness among the African diaspora, and a prominent advocate of voodoo as a complete religion.\n\nHis political ideology stems heavily from the resistance of Haitian peasants towards the American occupation, and he heavily despises the Haitian elite for their seeming ineptitude to provide for the masses. Inspired by the novel "Madame Bovary," Price-Mars coined the term "collective bovarysme" to criticize Haitian elites of mixed white ancestry whom Price-Mars blames for holding unfair economic and economic positions in the country. A critic of Haiti's crippling illiteracy, Price-Mars believes that universal education will lead to an advancement of society. Fully embracing Haiti's history of slavery, Price-Mars believes the Haitian slaves were the true source of Haiti's traditions and history. He admired the slaves' culture and religion as a base of resistance towards the European colonizers - the foundation of a Haitian nation that he seeks to emulate. "

 HAI_louis_dejoie: "Луи Деджой"

 HAI_elie_lescot: "Эли Лескот"
 # HAI_elie_lescot_leader_desc: "Президент Эли Лескот изначально был фармацевтом в Порт-де-Пейсе, на севере страны, представителем интересов мулатской элиты, он вошёл в политику до Велткрига, а затем занял несколько постов в правительствах Луи Борно и Демосферы Каликсте. Однако он никогда не отрекся от своей независимости и заключил союзы только из чистого интереса. Утешенный своим благоприятным положением между американцами и немцами, Лескот смог захватить власть после падения президента Калихте. Лескот сейчас планирует провести либеральные и демократические реформы в Гаити, а также демонтировать социалистическую политику Калихте. Вопрос о конституционной реформе все еще остается открытым для нового правительства. Поскольку приверженность Лескота демократии разоблачена, он не уверен, что президент планирует отдать должное демократическим институтам."

 HAI_stenio_vincent: "Стенио Винсент"
 # HAI_stenio_vincent_leader_desc: "В 1907-1909 годах он был мэром Порт-о-Пренса и был членом правительства Дартигуэнава с 1916 по 1917 год. Победа президента Винсента на выборах 1940 года стала неожиданностью для многих элит, но хорошо информированные наблюдатели давно знали о своей популярности среди народных слоев столицы. Его платформа, вращающаяся главным образом вокруг окончания американской оккупации и национальной независимости, призывает гаитянские массы, которые надеются, что однажды их страна будет свободной от иностранного влияния."

 HAI_john_russell: "Джон Рассел"
 HAI_john_russell_leader_desc: "Длительное пребывание генерала Джона Рассела в качестве американского комиссара по морским делам Гаити началось в 1922 году и он с отличием служил до настоящего времени."

 HAI_franck_lavaud: "Франк Лаво"
 # HAI_franck_lavaud_leader_desc: "На западе Гаити Фрэнк Лаво вышел из состава высшего военного училища и быстро поднялся в ряды гаитянской армии, достиг поста начальника штаба Гарда под председательством Эли Лескота, тогда он был назначен главнокомандующим гаитянской армией. Командир всегда оставался вдали от политики, и прежде всего ради блага своей страны. Именно это побудило его двигаться против президента Лескота после его провала в отношениях с Доминиканской Республикой. Слабость президента привела бы к слабости Гаити, с которой Лаво не может согласиться. nnLavaud уже заявил, что он не намерен править долгое время, поскольку он не является политиком. Его главная цель заключается в организации выборов и обеспечении мирной преемственности гаитянского государства. ~ В целом, несмотря на его политическую позицию, Лаво стал презирать интернационализацию гаитянской политики и регулярно вести страну к международному унижению. В целом, поддерживаемый вооруженными силами и значительной частью населения, он намерен приостановить политическую жизнь до тех пор, пока не будет восстановлена стабильность и сила Гаити."

