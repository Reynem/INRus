 FIN_foreign_policy: "Внешняя политика Финляндии"
 FIN_foreign_policy_desc: "Финская нация находится в довольно трудном положении на мировой арене. Вне зависимости от влияния Советского Союза, Соединенного Королевства и Германии, наша внешняя политика вполне может стать одной из целей в соответствии с великой державой или в состоянии нейтралитета. Хотя привязка может сделать нас открытыми для иностранного влияния во внутренней политике, она может также обеспечить нам безопасность в мире, который становится все более враждебным. ~ nn/Alternativ, мы можем попытаться достичь националистической цели создания Великой Финляндии, освобождения Карелианских Финнов и установления власти над окрестными землями, освобождения братьев финской нации от иностранных угнетателей. ~ Неважно, по какому пути мы могли бы пройти, так долго Финляндия будет оставаться независимой, наша внешняя политика будет хорошей целью."

