 ### Focus Tree ###
 FIN_finnish_defence_forces: "Финские силы обороны"
 FIN_finnish_defence_forces_desc: "Несмотря на нашу победу над Красными войсками во время Гражданской войны в Финляндии, Спектр коммунизма по-прежнему угрожает нашей стране. 20 лет назад Финляндия подготовила и оснастила крупнейшую военную силу в Скандинавии, с тем чтобы предотвратить любые советские достижения."Puolustusvoimat\" is prepared to bleed the Soviet Union dry if that dreaded conflict were to ever come to fruition.\n\nWhile Finns are prepared to defend every inch of their nation, our government's meager budget has stalled much needed reforms. As the Soviet Union continues to modernize their forces, we must continue to follow suit."

 FIN_finnish_navy: "Финские военно-морские силы"
 FIN_finnish_navy_desc: "Когда Финляндия обрела независимость от Российской империи, сохраняя этот статус, несмотря на советское давление, наш ВМС состоял из устаревших российских кораблей от правления Александра III. Хотя с 1927 года предпринимаются усилия по модернизации Финского флота, прогресс отстает от графика. Мы должны возобновить эти усилия, если мы хотим защитить береговую линию нашей страны от советского Балтийского флота."
 FIN_gunboat_modernization: "Модернизация катера"
 FIN_gunboat_modernization_desc: "Финские военно-морские силы в настоящее время используют четыре катера в своем арсенале, разделённом между классом Uusimaa и классом Turunmaa, соответственно. Эти сторожевые корабли были спроектированы в эпоху Трариста для использования в Имперском военно-морском флоте России и начинают показывать свой возраст. Если мы хотим идти в ногу с Советскими, мы должны начать модернизацию нашего существующего флота или инвестировать в новые современные корабли, чтобы заменить наши стареющие суда."
 FIN_turku_naval_bases: "Создание прибрежного полка Турку"
 FIN_turku_naval_bases_desc: "По мере роста напряженности с Советским Союзом мы должны подготовить наши крупные прибрежные города к военно-морским нападениям."Turun Rannikkorykmentti\" will provide the city with the defenses needed to ward off an enemy attack."
 FIN_prioritize_coastal_defence: "Приоритезировать береговую оборону"
 FIN_prioritize_coastal_defence_desc: "Жестокая погода в Балтийском море заставляет многих наших кораблей причаливать к нашим портам в зимний сезон. Если бы Советы были достаточно смелыми или, возможно, настолько глупыми, чтобы вторгаться в нашу страну зимой, то только наши малые прибрежные защитные корабли могли бы работать эффективно. Эти корабли могут пробиться через лед и перехватить собственные советские корабли, способные разрушать лед. Если мы хотим сохранить годовое функционирование нашего флота, мы сосредоточим наше финансирование на малых прибрежных кораблях обороны."
 FIN_defend_bay_of_finland: "Защита Финского залива"
 FIN_defend_bay_of_finland_desc: "Если война с Советским Союзом вспыхнет, ясно, что Финский залив станет главным театром военно-морских операций. Наша столица, Хельсинки, которая находится на берегах Финского залива, находится опасно близко к Советскому Союзу, но архаичная береговая оборона восходит к царской эпохе. Мы должны модернизировать береговую оборону вокруг города, если мы хотим защитить его от Советского Балтийского флота."Kuivasaari\" is currently the resting place of an old Russian \"Obukhovskii 52-caliber Pattern 1907\" Naval gun. This is the most powerful naval canon in operation in the Soviet navy. Bringing that weapon back up to operational capacity would surely deter any Soviet naval advances."
 FIN_modernize_submarine_force: "Модернизация подводных сил"
 FIN_modernize_submarine_force_desc: "Финский флот управляет только одним классом подводных лодок, The \"Vetehinen\". This class was designed and built in the 1920's and is falling behind in performance compared to more modern vessels. It is time to invest in the \"Vesikko\" class of Submarines, who's modern design increases hull strength while only weighing half as much as the \"Vetehinen\" class."
 FIN_prioritize_convoy_raiding: "Приоритизация налета на конвоя"
 FIN_prioritize_convoy_raiding_desc: "Ленинград сохраняет статус одного из самых важных экономических центров Советского Союза. Большая часть международной торговли, предназначенной для северной России, проходит через порты Ленинграда. Если мы хотим задержать советское судно в случае войны, мы должны разогнать любой корабль советского конвоя, который проходит через Финский залив."
 FIN_panssarilaiva: "Пансарилайва"
 FIN_panssarilaiva_desc: "\"Panssarilaiva\" or \"Armored Ships\" make up the core of Finnish naval force. Their flexible design allows them to excel in many roles ranging from convoy raiding to anti air defense. The Vainamoinen class armored ship \"Ilmarinen\" even has the honor of being the Finnish Navy's Flagship. It's class should be expanded and modernized to counter the Soviet's own naval developments."
 FIN_protect_merchant_navy: "Защита торгового флота"
 FIN_protect_merchant_navy_desc: "В то время как наш флот может остановить крупные передвижения от советского флота Балтии, Советские военно-воздушные силы и подводные лодки могут все еще преследовать наш торговый флот, мы должны сосредоточить наши военно-морские усилия на защите нашего судоходства от любых советских атак, отказывая коммунистам в какой-либо свободе передвижения в Финском заливе."
 FIN_modern_minelayer_ships: "Современные шахтные слои"
 FIN_modern_minelayer_ships_desc: "Финские ВМС используют только одно специально созданное миноубийца, судно царской эпохи \"Louhi\". A report by the Finnish navy noted that this ship was \"not particularly good at minelaying due to its slow speed, bad seakeeping qualities and inadequate storage space.\". Clearly if we are to maintain naval superiority over the Soviet's we will need to commission modern minelaying vessels. The \"Pukkio\" class of minelayers has been designed as a modern vessel to replace our current mine laying arsenal. We just need to invest the funding needed to build it."

 FIN_civil_guards_prominence: "Величие гражданской гвардии"
 FIN_civil_guards_prominence_desc: "Несмотря на усилия, направленные на то, чтобы отвести гражданскую гвардию в сторону, чтобы централизовать вооруженные силы, очевидно, что это было неверное направление национальной безопасности нашей страны. Огромное географическое положение и небольшое население Финляндии требуют, чтобы наша страна быстро реагировала на любую угрозу местными силами. Несмотря на то, что она является важнейшим краеугольным камнем поражения красной силы во время гражданской войны, в последние годы Гвардия была понижена до резервистской силы, при этом центральные финские силы обороны взяли на себя бóльшую часть прежних обязанностей Гражданской гвардии. Советский Союз мог атаковать с подавляющей силой в любое время. Мы должны укрепить местную гражданскую гвардию, чтобы она стала нашей передовой линией обороны, если Советы предпочтут вторгнуться."
 FIN_reform_jager_training: "Реформирование профессиональной подготовки Ягера"
 FIN_reform_jager_training_desc: "Ягеры появились как группа финских националистов, которые добровольно и тренировались стать элитной легкой пехотой офицерами бывшей Германской империи. Во время Гражданской войны в Финляндии эти войска обеспечивали критический моральный дух и подготовку своих белых союзников. Тяжелое новаторское использование тактической мобильности, которое они привезли из Германии, стало основой финской военной теории, но эра гражданской войны очень отличается от сегодняшнего дня. Мы должны модернизировать наше использование света и мобильной пехоты для современной эпохи войны."
 FIN_separate_army_and_politics: "Отдельная армия и политика"
 FIN_separate_army_and_politics_desc: "Позволение офицерам занимать государственные должности - это опасный путь к автократии, поэтому мы должны разработать законы для ее предотвращения."
 FIN_karjala_line: "Линия Карелии"
 FIN_karjala_line_desc: "По мере роста напряженности с Советским Союзом, очевидно, что наша южная граница находится под угрозой вторжения. Карелия обширна и сильно заросла лесами. Если мы воспользуемся суровой местной географией, мы сможем построить мощную оборонительную линию, которую Советы не смогут преодолеть."
 FIN_study_old_tactics: "Изучайте старую тактику"
 FIN_study_old_tactics_desc: "Мы не должны полностью игнорировать уроки наших предков, некоторые из величайших военных умов, которые когда-либо были рождены тысячи лет назад."
 FIN_red_guard_takes_lead: "Красная гвардия берет на себя руководство"
 FIN_red_guard_takes_lead_desc: "Красная гвардия получила решающее преимущество, мы должны воспользоваться этой возможностью, прежде чем она уйдет."
 FIN_meanmaa_line: "Линия Меанмаа"
 FIN_meanmaa_line_desc: "Хотя с момента обретения независимости отношения со Швецией были в основном дружественными, радикально развивающаяся атмосфера в Европе быстро меняет некогда долгое равновесие сил на континенте. Мы должны быть готовы к угрозам со стороны любой страны. Если бы шведские войска вторглись, то это быстро превратило бы весь район Меенмаа в замороженный адский пейзаж. Мы должны укрепить реку Торн, чтобы лишить шведов какого-либо опоры на нем."Our Land\"."
 FIN_modernize_equipments: "Модернизация оборудования"
 FIN_modernize_equipments_desc: "Устаревшее оружие поставит нас в явно невыгодное положение по отношению к нашим лучше оснащенным врагам, и мы должны удвоить наши усилия по модернизации армии."
 FIN_modern_ski_infantry: "Современная пехота Ски"
 FIN_modern_ski_infantry_desc: "Финляндия — это страна снега, и естественная защита, которую это дает нам, не может быть преувеличена. Тем не менее, мы должны быть в состоянии эффективно пересекать эти условия, если мы хотим в полной мере использовать естественную местность."
 FIN_artillary_efforts: "Артиллерийские работы"
 FIN_artillary_efforts_desc: "Крупные орудия доказали свою ценность во время Великой войны, и в настоящее время в каждой способной армии находятся сотни или даже тысячи артиллерийских орудий."
 FIN_motorization_efforts: "Усилия по моторизации"
 FIN_motorization_efforts_desc: "Моторизованная пехота может приземлиться с невероятной скоростью, чтобы подняться на дно, и они даже были объявлены пехотой будущего многими военными историками."
 FIN_lotta_svard: "Лотта Свард"
 FIN_lotta_svard_desc: "Происходящее во время Гражданской войны в Финляндии, \"Lotta Svärd\" is a voluntary auxiliary paramilitary organisation for women. While men were being conscripted away to fight the Red Forces and their communist allies, members of the \"Lotta Svärd\" would operate field hospitals and even air raid warning positions. As the threat of war rises once again and more men are being called into service, we must call upon the \"Lotta Svärd\" to assist our army in the defense of our country."
 FIN_sisu: "Сису"
 FIN_sisu_desc: "Уникальная финская черта, сису — это идея, что в трудные времена нужно обладать мужеством, выносливостью, упорством и решимостью."
 FIN_encourage_new_thinking: "Поощрять свободное мышление"
 FIN_encourage_new_thinking_desc: "Мы должны быть источником инноваций и изобретений, если мы хотим оставаться на кривой современной науки и техники, как таковые, мы должны поощрять свободное мышление через наши учебные заведения."
 FIN_red_army_training: "Подготовка сотрудников Красной Армии"
 FIN_red_army_training_desc: "Красная армия в последние десятилетия видела много боевых действий, и в результате они превратились в высокоэффективную военную силу."

 FIN_finnish_air_force: "Военно-воздушные силы Финляндии"
 FIN_finnish_air_force_desc: "Контроль над небом имеет жизненно важное значение в современной войне, и для достижения этой цели нам потребуются современные военно-воздушные силы для Финляндии."
 FIN_aircraft_purchases: "Закупки воздушных судов"
 FIN_aircraft_purchases_desc: "Тысячи самолетов по всей Европе находятся на складе в ожидании нового конфликта, и мы должны воспользоваться этой возможностью, чтобы купить некоторые из этих самолетов для дополнения наших собственных сил."
 FIN_reach_out_foreign_suppliers: "Достучаться до иностранных поставщиков"
 FIN_reach_out_foreign_suppliers_desc: "Существует много сторон, заинтересованных в производстве дорогостоящих деталей для нас, поэтому мы должны связаться с ними и начать переговоры."
 FIN_foreign_air_manifactures: "Иностранные предприятия по производству воздуха"
 FIN_foreign_air_manifactures_desc: "Зачем строить собственные самолёты, когда мы можем заставить других сделать это для нас?"
 FIN_upgrade_air_bases: "Модернизация военно-воздушных баз"
 FIN_upgrade_air_bases_desc: "Старые взлетно-посадочные полосы с грязью и снегом уже не подходят для современных самолетов, нам нужно будет инвестировать в создание асфальтовых взлетно-посадочных полос, чтобы предотвратить ненужный ущерб нашим самолетам."
 FIN_develop_finnish_fighters: "Формирование финских боев"
 FIN_develop_finnish_fighters_desc: "Уникальная география Финляндии создала целый ряд проблем, к которым просто не приспособлены современные самолеты из других частей Европы."
 FIN_domestic_aircraft_industry: "Национальная авиационная промышленность"
 FIN_domestic_aircraft_industry_desc: "Производство, а также проектирование самолётов дома даст нам значительные преимущества по сравнению с нашими врагами, если они вторгнутся."
 FIN_study_civil_war_boat_planes: "Изучение кораблей гражданской войны"
 FIN_study_civil_war_boat_planes_desc: "Самолеты лодок гораздо более разносторонние и мобильные, чем те, кто приземлился, мы должны изучить, как улучшить их, чтобы мы могли воспользоваться ими."
