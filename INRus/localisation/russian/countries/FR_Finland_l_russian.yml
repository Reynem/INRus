 ### Bio ###
 POLITICS_PER_EVIND_SVINHUFVUD_DESC: "Пер Эвинд Свинхуфвуд - третий и нынешний президент Финляндии, родившийся в 1861 году, имеет давнюю историю в политике страны, служа с годами российского правления над страной, благодаря своей независимости, гражданской войне и послевоенному восстановлению."swallows" faction of the latter. During independence, Svinhufvud played a major role and served as Chairman of the Senate, State Regent and the First Prime Minister of the Republic during this time.\n\nSince then, Svinhufvud has been a major leader in the National Coalition Party and a strong conservative voice against socialism and the Left. One thing is certain; no Social Democrat or Communist will become a government member with Pehr Evind Svinhufvud as President.\n\n§BSocial Conservative§!"
 POLITICS_RISTO_HEIKKI_RYTI_DESC: "Ристо Хейкки Рити является пятым и нынешним президентом Финляндии, который стал основным кандидатом после отставки Кёсти Каллио. 1889 года рождения Райти начал свою карьеру в качестве политика в экономике и в качестве фоновой фигуры в послевоенный период. Он является молодым политиком, который мало активно участвует в независимости Финляндии и гражданской войне. После гражданской войны Райти был членом парламента и министром финансов, прежде чем стать президентом Республики."
 POLITICS_KYOSTI_KALLIO_DESC: "Кёсти Каллио является четвертым и нынешним президентом Финляндии. Калио, родившийся в 1873 году, похож на бывшего президента Свинхуфвуда, ветерана из Финляндии до и во время обретения ею независимости."Lex Kallio", legalisation that allowed the state to buy land to encourage new settlements.\n\nWhile politically moderate and opposed to monarchy and abuse of Presidential power, Kallio is also an anti-communist and prohobitionist with a deep Christian faith. As an Agrarian, it is to see if his presidency will bring a better future for the Finnish farmer.\n\n§OAgrarian§!"
 POLITICS_VAINO_TANNER_DESC: "Вайнё Таннер является четвертым и нынешним президентом Финляндии, что удивительно, что он является первым социалистическим президентом в истории Республики. В 1881 году Таннер является пионером в кооперативное движение Финляндии, а также ведущим социал-демократом. Во время гражданской войны Таннер оставался нейтральным. После гражданской войны Таннер начал вести социал-демократов к умеренности и парламентаризму. С его избранием на пост президента, похоже, ему удалось восстановить свою партию в политике и обществе Финляндии. Несмотря на эту умеренность, Таннер столкнулся с сильным сопротивлением со стороны бывшего президента Свинхуфвуда и других антикоммунистических групп. С его избранием на пост президента ему придется доказать, что он верен Финляндии, а не социалистической революции."
 POLITICS_CARL_GUSTAV_MANNERHEIM_DESC: "Карл Густаф Манхейм - единственный и единственный маршал Финляндии. Родившийся в 1867 году, Манхейм видел, как Финляндия перешла из России в Республику. В 1887 году начал свою военную карьеру в Имперской российской армии, Манхейм прошел через многое, в том числе воевал на восточном фронте Великой войны. После того как Финляндия стала независимой в 1917 году, Манхейм стал ведущим офицером молодых вооруженных сил страны, что привело белых к победе в гражданской войне. Будучи государственным регентом Финляндии и заручившись признанием независимости Финляндии от Великобритании и Соединенных Штатов, он отступил от политической жизни и не занимал государственных должностей."
 POLITICS_VIHTORI_KOSOLA_DESC: "В 1884 году его семья быстро переехала в Лапуа после того, как семейная ферма сгорела. Взрослея, Косола провел годы в сельском хозяйстве и скотоводстве. В первые годы Великой войны Косола стала вербовщиком движения Ягеров, финских добровольцев в Германию. Это привело к его аресту, но после российской революции он оказался освобожденным. Косола был во время гражданской войны в Белой гвардии и вступил в Аграрную лигу. В 1920-е годы Косола принял участие в организации разгромщиков и был одним из ораторов первых встреч движения Лапуа. Теперь Движение Лапуа наконец-то использовало свой потенциал, чтобы захватить власть в Финляндии, поместив Витори Косолу во главе нации."
 POLITICS_VILHO_ANNALA_DESC: "Вильо Аннала является лидером правого движения Лапуа и главой государства Финляндии. В 1888 году родилась Аннала, которая стала студентом Хельсинкского университета, где он отредактировал студенческую газету Илиоппиласлехти в последние годы Великой войны. Он также стал экономистом и пошел работать в качестве гражданского служащего, став одним из ведущих гражданских служащих Финляндии. В 1931 году Аннала присоединилась к движению Лапуа . Он был одним из наиболее радикальных членов, отстаивая корпоратизм, сделав это движение более дружественным к рабочему классу и возражая против влияния промышленников. С игровой ролью в восстании Мянтыяля Аннала еще больше укрепила свою власть. И наконец, теперь он также способен направлять движение в сторону более радикальной и валькистской идеологии."
 POLITICS_KULLERVO_MANNER_DESC: "Куллерво Мандерс является лидером Коммунистической партии и Председателем Финляндии. 1880 года рождения, он был родом из семьи с множеством священнослужителей, а его отец был священником, а дед его матери — пастором. После окончания средней школы он начал работать журналистом и основал газету под названием Työläinen. До обретения Финляндией независимости он также служил членом парламента при социал-демократах. Во время гражданской войны в Финляндии был назначен председателем Народной делегации Финляндии и командовал Красными гвардиями. После гражданской войны ему пришлось бежать в Советскую Россию."
 POLITICS_OTTO_WILLE_KUUSINEN_DESC: "Отто Вилле Куусайнен является председателем Финляндии. В 1881 году Кусинен начал посещать Хельсинкский университет в первые годы своего существования. В этой связи он стал активным членом студенческого союза и был заинтересован в консерватории и алкиоизме Фэнномана. После этого Кусинен стал более радикальным, присоединился к социал-демократам и был лидером социалистической революции в Финляндии. После гражданской войны в Финляндии Кусьеннену пришлось бежать в Советскую Россию, где он принял участие в создании Финской коммунистической партии и стал ассосиатом Вячеслава Молотова."
 POLITICS_OSKARI_TOKOI_DESC: "Оскари Токои является председателем Финляндии. В 1873 году Токои родился в фермерской семье, а его отец также был торговцем лошадьми. Взрослея, семья Токои столкнулась с тяжелым экономическим положением, в то время как Оскари был зачислен лишь на несколько лет в грамматическое училище. В 17 лет Токои ушел с семейной фермы, чтобы эмигрировать в Америку. В Америке Токои работал на угольных и каменных металлодобывающих шахтах, но потеря работы вынудила его отправиться на работу до возвращения в Финляндию. В Финляндии Токои был избран членом парламента от социальных демократов и встал на сторону Красного во время Гражданской войны в Финляндии."

