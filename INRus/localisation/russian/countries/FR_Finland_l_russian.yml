 ### Description ###
 FIN_FUHRERREICH_DESC: "После Великой войны Финляндия стала независимой страной. Сотни лет под шведским и русским правлением финский народ ощутил себя свободным. Однако после этого страна будет ввергнута в гражданскую войну между антисоциалистами и социалистическими красными. Гражданская война, которая закончилась победой белых, оставила свой след в политике и обществе Финляндии. Даже в этом случае Финляндия является нацией, испытывающей огромное процветание, почти золотой век в истории Финляндии."

 ### National Spirits ###
 FIN_finland_marches_on_idea: "Финляндия продолжает!"
 FIN_finland_marches_on_idea_desc: "После большой борьбы финляндская независимость от русских и шведов была в основном гарантирована. Наша нация не намерена вновь оказаться под прикрытием русских, но мы могли бы также быть в состоянии остерегаться влияния и намерений нашего западного соседа."
 FIN_agrarian_society_idea: "Аграрное общество"
 FIN_agrarian_society_idea_desc: "Свыше 70% населения страны находится в аграрном секторе экономики, и в целом страна слабо развита в промышленном отношении, что серьезно препятствует нашему производству и отстает на мировой арене."
 FIN_legacy_civil_war_idea: "Наследие гражданской войны"
 FIN_legacy_civil_war_idea_desc: "Почти 20 лет прошло с момента гражданской войны в Финляндии, и ее последствия по-прежнему ощущаются сегодня, и это может быть в основном очевидно в политике Республики, в условиях растущего движения Лапуа, а также в беспокойных чувствах правых людей вокруг социал-демократов."
 FIN_silver_decade_idea: "Надежда Вуосикимммены"
 FIN_silver_decade_idea_desc: "Несмотря на наследие гражданской войны, медленные темпы индустриализации и угрозу Советского Союза, эта эра стала стабильной и процветающей в истории независимой Финляндии."

