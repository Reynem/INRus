 FIN_punainen_maapera: "Пунайнен Мааперя"
 FIN_punainen_maapera_desc: "Социал-демократы и аграрные круги смогли сформировать коалиционное правительство после краха правой в центре правительственной коалиции, и есть уверенность в том, что мы сможем спасти Финляндию от экономических трудностей и устранить политический разрыв между левыми и правыми."
