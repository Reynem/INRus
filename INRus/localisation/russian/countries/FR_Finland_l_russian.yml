 ### Events ###
 finland.0.t: "Государство Финляндия"
 finland.0.d: "Финляндия получила независимость после революции 1917 года в России. Первые годы были немного скакалыми, поскольку гражданская война Финляндии между красными и белыми поразила страну, ставя братьев в противоречие друг с другом и оставляя после себя наследие Финляндии. В ходе гражданской войны Финляндия также увидела потерю Аланда в Швеции, что-то, что частично затруднило бы отношения между двумя странами. Несмотря на планы по созданию Королевства Финляндии с немецким королем, этот план не сработал после поражения Немецкой империи во время Великой войны. Монархисты консервативной партии Национальной коалиции должны были отказаться от идеи о Финском королевстве и вскоре погибшей мечты. В то же время Республика Финляндия была создана, в которой доминировали либералы и консерваторы. Несмотря на то, что гражданская война с германским королем, идея Великой Финляндии обрела силу среди правых людей. Вместе с тем, вместе с антисавитетистской партией этой мечты, она стала основой для формирования движения Лапуа. В то же время, когда социалисты стали все более активными, с их эволюцией, с большей династиющей династией династинкой династинской династинской династинской династи в стране."
 finland.0.a: "Ааму на Илтаа Визаампи!"

 finland.1.t: "Год выборов в Финляндии"
 finland.1.d: "Парламентские выборы 1936 года скоро будут проходить за углом, при хорошем положении экономики Финляндии и укреплении сельскохозяйственного сектора, похоже, что правящее коалиционное правительство, состоящее из Аграрной лиги, Национальной коалиции и национальных прогрессивных партий, обладает позитивом, чтобы добиться успехов. ~ Несмотря на то, что социальные демократы, скорее всего, не могут сформировать правительство или принять участие в одном из них, они, скорее всего, будут придерживаться своего плюрализма в парламенте. Президент твердо отказался от своего участия, а Аграрная лига согласилась с его участием в нынешней системе. С другой стороны, нет оснований подозревать, что движение Лапуа добьется успехов в этих выборах, даже если есть консерваторы, которые выступают против нынешнего правительства. ~nAlrede делают обещания и подвешивают плакаты на улицах Финляндии, выражая при этом здоровье финской демократии."
 finland.1.a: "Какой великий год, чтобы стать Финном!"

 finland.2.t: "Парламентские выборы 1936 года"
 finland.2.d: "Результаты парламентских выборов 1936 года теперь подсчитаны, и в связи с ростом благосостояния и роста при нынешнем правительстве возросло мнение Аграрной лиги и Национальной коалиционной партии. Социальные демократы и движение Лапуа не смогли добиться каких-либо результатов, оставив парламент, в котором большинство членов являются представителями одной из правящих партий."
 finland.2.a: "Победа коалиционного правительства!"

 finland.3.t: "Крушение Лондонского фондового рынка"
 finland.3.d: "В Лондоне, в Соединенном Королевстве, произошла экономическая катастрофа: с кровотечением одного из наших основных экспортных и торговых партнеров растет опасение, что этот кризис вскоре поразит Финляндию."
 finland.3.a: "Серебряное десятилетие мучений"

 finland.4.t: "Завершение серебряного Десятилетия"
 finland.4.d: "В условиях кризиса на Лондонском фондовом рынке финляндская экономика переживает спад. Безработица растет, экспорт прекращается, а предприятия начинают сталкиваться с банкротством. Письменность на стене. Серебряное десятилетие в Финляндии закончилось, и сейчас настал кризис. С политической точки зрения, это чуть не разрушило правящее коалиционное правительство, но при руководящей роли Жухо Сунилы и Пехра Эвинда Свинхуфвуда он может пережить этот кризис."
 finland.4.a: "Давайте молиться о быстром восстановлении!"

 finland.5.t: "Смерть премьер-министра"
 finland.5.d: "Премьер-министр Юхо Сунила был найден мёртвым в своей резиденции в Хельсинки. Похоже, что это из естественных причин, от которых он умер, но это не может быть худшим временем для смерти. С уходом Сунилы коалиционное правительство висит на тонком следе. Аграрная лига, возглавляемая Кёсти Каллио, начала смотреть на социал-демократов в качестве новых партнеров правительства. Это начало раздражать президента Пехра Эвинда Свинхуфвуда и его Национальную коалиционную партию. А тем временем Аимо Каджандер из Национальной прогрессивной партии станет новым премьер-министром."
 finland.5.a: "Какое время умереть!"

 finland.6.t: "Аграрная лига оставляет правительство"
 finland.6.d: "В то время как Национальная коалиция и национальные прогрессивные партии выступают в поддержку жесткой экономии и ограниченного вмешательства, Аграрная лига хочет, чтобы правительство помогало фермерам, страдающим от банкротства и банкротства. Хотя правительство сейчас не имеет большинства в парламенте, Аграрная лига выступает против вотума недоверия в этот раз, ссылаясь на продолжающийся кризис. Президент Свинхуфвуд по-прежнему твердо отвергает правительство с социал-демократами."
 finland.6.a: "Мы восстановим Коалицию"

 finland.7.t: "Вейнё Таннер и оппозиция"
 finland.7.d: "Оппозиция, в которой доминируют социал-демократы, решительно критикует правительство. Вайнё Таннер , лидер социал-демократов, увидела растущую поддержку среди новых безработных и фермеров Финляндии. Он обвиняет правительство и президента в том, что они препятствуют парламентскому большинству управлять страной . Социальные демократы выступают за мощный интервенционизм со стороны финского государства с защитой рабочих и фермеров и усилением государственного контроля над предприятиями и отраслями промышленности. Социальная демократы выступает против мер, которые правительство намерено принять."
 finland.7.a: "Они просто хотят разрыдаться подальше от Финляндии."

 finland.8.t: "Деятельность движения Лапуа"
 finland.8.d: "Движение Лапуа — это движение, охватывающее как радикальных консерваторов, так и финских националистов. Они также являются сильными антисоциалистами, и с ростом социал-демократов в эту эпоху они становятся все более агрессивными. С попытками убийств и террора со стороны членов общества в сторону социал-демократов некоторые хотят, чтобы мы запретили организацию. Одна из проблем заключается в том, что у нас нет никаких доводов против движения, а только против его членов."
 finland.8.a: "Опасное движение"

 finland.9.t: "Инцидент с Mäntsäälä"
 finland.9.d: "В городе Мянцяля члены движения Лапуа и Белая гвардия прервали сегодня местную встречу социал-демократов. Жестокие аппетиты членов этих организаций, как представляется, поощряются руководством движения Лапуа , что является основанием для запрещения организации; после этого инцидента, похоже, члены движения Лапуа собираются с большим количеством винтовок и других видов оружия, что может перерасти в нечто большее, чем просто единичный инцидент."
 finland.9.a: "Это может быть опасно"

 finland.10.t: "Марш в Хельсинки"
 finland.10.d: "Многие члены движения Лапуа и Белая гвардия начали марш на столицу Хельсинки, чтобы свергнуть правительство и парламент. Идея о том, что правительство слишком неэффективно для того, чтобы справиться с нынешним кризисом , получила широкое распространение среди членов Белой гвардии и даже в неполитических частях армии; после этих событий Красная гвардия вновь появилась, во многих случаях столь же вооружена и опасна; пока еще предстоит выяснить, что будет развиваться из этой ситуации."
 finland.10.a: "Эти предатели!"

 finland.11.t: "Битва при Хельсинки"
 finland.11.d: "В настоящее время ведется борьба за то, чтобы захватить основные важные структуры в Хельсинки, при этом белые и красные охранники борются от улицы до улицы. В настоящее время не хватает подразделений, преданных нынешнему правительству. В городе все еще много людей, которые лояльны Республике. Несмотря на то, что полевой маршал Карл Густав Манхейм возглавляет защиту парламента и правительства в Хельсинки. Манхейм по-прежнему уважается членами Белой гвардии, и многие считают, что у него есть шанс заставить их предать движение Лапуа в пользу Манхейма. Несмотря на то, что члены Белой гвардии не рискуют пойти против движения Лапуа, их правого антисоциалистского союзника, считая это возможным предательством антисоциалистского дела. С учетом того, что Белая гвардия так важна, обе стороны теперь пытаются заручиться их поддержкой."
 finland.11.a: "Манхейм управляет Белой гвардией"
 finland.11.b: "Белая гвардия отказывается сменить сторону"

 finland.12.t: "Кооперативы Манхейм"
 finland.12.d: "С Белой гвардией под его командованием Филд Маршал Карл Густав Манхайм понял, что необходимо переворотить правительство. Хотя социал-демократы и аграрные круги против этого захвата власти, Манхейм заявил, что это единственный способ обеспечить, чтобы радикалы не сеяли власть. Большинство членов парламента и правительства заявили, что они в порядке, а президент призвал Манхейма сформировать правительство."
 finland.12.a: "В порядке спасения Республики!"

 finland.13.t: "Кубок красной гвардии"
 finland.13.d: "С Белой гвардией под командованием фельдмаршала Манхейма движение Лапуа на данный момент умиротворено, но все еще существует угроза для Республики. Красная гвардия все еще на улицах, и похоже, что они не уйдут без боя. Однако весьма вероятно, что Манхейм сможет победить их."
 finland.13.a: "Манхейм побеждает красных"
 finland.13.b: "Кооперативы Красной гвардии"

 finland.14.t: "Стабильность начинается к возвращению"
 finland.14.d: "Когда как социалисты, так и националисты успокаиваются, ситуация начинает восстанавливаться. Многие считают, что сейчас самое лучшее время вернуть власть в руки парламента, президента и истинного правительства, но есть и другие, которые утверждают, что политики не могут привести Финляндию к кризису, не споря о политике. Поэтому некоторые сторонники Манхейма хотят, чтобы он объявил чрезвычайное положение, захватил исполнительную власть и перевернул парламент. Хотя диктаторские меры могут оказаться необходимыми для дальнейшей стабилизации Финляндии."
 finland.14.a: "Демократия будет продолжаться"
 finland.14.b: "Республика должна быть спасена"

 finland.15.t: "Движение Лапуа поглощает власть"
 finland.15.d: "Поскольку Белая гвардия остается верной движению Лапуа, движение сумело созерцать власть. Манхейм ушел в отставку, другие генералы и офицеры в настоящее время выступают в поддержку этого движения. Социал-демократы уже начали уходить в подполье, причем некоторые члены Национальной коалиции и национальных прогрессивных партий заняли кооперационную позицию в отношении движения Лапуа. Это действительно конец Финской Республики ."
 finland.15.a: "Финляндия свободна от предателей!"

 finland.16.t: "Кубок красной гвардии"
 finland.16.d: "В то время как движение Лапуа в настоящее время правит Финляндией, Красная Гвардия не ушла, как угроза новому финскому правительству, у них есть возможность отвлечь власть от нашего нового националистического правительства, при поддержке консерваторов и белых военных деятелей, мы должны иметь возможность бороться с ними, но рыжие могут получить союзника в Социал-демократах."
 finland.16.a: "Красная Охрана побеждена."
 finland.16.b: "Красная Гвардия победила"

 finland.17.t: "Предстоящие президентские выборы"
 finland.17.d: "Президентские выборы 1937 года находятся за углом. В условиях нынешнего кризиса в стране очень маловероятно, что президент Пер Эвинд Свинхуфвуд сможет обеспечить второй срок в качестве президента Финляндии. Пока еще предстоит выяснить, приведет ли смена охраны к стабильности в формировании стабильного правительства."
 finland.17.a: "Давайте посмотрим, что происходит."

 finland.18.t: "Президентские выборы 1937 года"
 finland.18.d: "Сейчас идут президентские выборы 1937 года, тысячи из которых вышли и проголосовали в поддержку одного из кандидатов, имеющихся в распоряжении Партии Национальной коалиции, или их предпочтительной партии. С учетом того, что избирательная коллегия готова дать свои голоса, ожидается, что кандидат, который станет президентом Финляндии, замедлит свою антисоциалистскую позицию. Это позиция, которую президент не планирует изменить. Одним из самых симпатичных кандидатов, выигравших от Партии Национальной коалиции, является Кёсти Каллио. Каллио является кандидатом, который может получить поддержку как со стороны центристов, так и со стороны социал-демократов. Его считают хорошим кандидатом для тех, кто болен президентом Свинхуфвудом, но не желает принять президента Таннера. Последний кандидат с шансом на победу - это Социал-демократический кандидат."
 finland.18.a: "Кёсти Каллио!"
 finland.18.b: "Вайнё Таннер!"
 finland.18.c: "Пер Эвинд Свинхуфвуд!"

 finland.19.t: "Доверие к правительству"
 finland.19.d: "После избрания Кёсти Каллио Аграрной лиги в президенты Финляндии возник вопрос о том, чтобы выразить вотум недоверия. Новый президент выразил мнение о том, чтобы позволить социал-демократам войти в правительство, и единственное, что мешало этому, это антисоциалистские идеалы бывшего президента Пехра Эвинда Свинхуфвуда. Но некоторые члены Аграрной лиги отвергают сотрудничество с социалистическими социал-демократами и хотят восстановить старую коалицию."
 finland.19.a: "Голосование за неуверенность!"
 finland.19.b: "Давай попробуем переосмыслить правительство!"

 finland.20.t: "Голосование за неуверенность"
 finland.20.d: "После смены президента был объявлен вотум недоверия кабинету Каджандера. Социальные демократы, Аграрная лига и большинство независимых избирателей проголосовали за то, что большинство членов парламента оказались на стороне недоверия. С падением кабинета Каджандера была предложена новая альтернатива. Социальные демократы и аграрные аграрные круги начали обсуждение вопроса о формировании коалиционного правительства. Это новое "аллюанс" получило коллоквиальное название "Красная Земля". С двумя партиями, контролирующими большинство парламента, вероятно, это правительство получит доверие, чтобы править."
 finland.20.a: "Давайте посмотрим, куда пойдет Финляндия с этой "Красной Землей""

 finland.21.t: "Формирование правительства "Красной Земли""
 finland.21.d: "Новое коалиционное правительство, состоящее из Социал-демократической партии и Аграрной лиги, завоевало доверие парламента и сейчас собирается заменить старый кабинет Каджандера. Возникает вопрос о том, от кого партия будет возглавлять это правительство, и, по сути дела, на какие вопросы будет опираться правительство. Еще одним кандидатом от Аграрной лиги является Урхо Калева Кекконен, еще один молодой политик в Финляндии. Он быстро поднялся в Аграрной лиге, но также считается несколько проблематичным для его предыдущего членства в правых националистических группах."
 finland.21.a: "Урхо Кекконен!"
 finland.21.b: "Карл Август Фагерхольм!"

 finland.22.t: "Национальная коалиция - аграрные переговоры"
 finland.22.d: "В целях сохранения статус-кво планируется провести встречу между двумя лидерами Национальной коалиционной партии и Аграрной лиги, Пером Эвиндом Свинхуфвудом и Кёсти Каллио, соответственно."
 finland.22.a: "Давайте посмотрим, что будет согласовано"

 finland.23.t: "Конец переговоров"
 finland.23.d: "После нескольких дней переговоров между президентом Кёсти Каллио и бывшим президентом Пером Эвиндом Свинхуфвудом, наконец, появились признаки продвижения к концу переговоров. Один вопрос все еще стоит на устах народа: "Что произойдет с фермерами и предчувствиями?" В этом случае были согласованы следующие вопросы."
 finland.23.a: "Фермеры пользуются нашей поддержкой!"
 finland.23.b: "Мы не можем оказать дополнительную поддержку"

 finland.24.t: "Формирование нового правительства по правам центра"
 finland.24.d: "Новое коалиционное правительство, состоящее из Национальной коалиционной партии, Национальной прогрессивной партии и Аграрной лиги, завоевало доверие парламента. Это вопрос в воздухе, если премьер-министр Каджандер и впредь будет возглавлять его или если кандидат от Аграрной партии или Национальной коалиции будет премьер-министром. Несмотря на то, что Аграрная лига представляет Урхо Калеву Кекконена своим кандидатом, он молод и не является членом Аграрной лиги в течение длительного времени, он рассматривается как человек, который может объединить центриста и правого крыла, с его предыдущим членством в правых националистических организациях."
 finland.24.a: "Аимо Каджандер - хорошая компромисия."
 finland.24.b: "Урхо Кекконен!"
 finland.24.c: "Юхо Кусти Паасикиви!"

 finland.25.t: "Конец переговоров"
 finland.25.d: "После нескольких дней переговоров между президентом Пером Эвиндом Свинхуфвудом и Кёсти Каллио наконец-то появились признаки продвижения к завершению переговоров."
 finland.25.a: "По крайней мере, это более гибкая позиция."

 finland.26.t: "У президента Кёсти Каллио был взрыв"
 finland.26.d: "Президент Кёсти Каллио уже начал стареть, когда вступил на пост президента, и сейчас, похоже, его время на месте закончилось."
 finland.26.a: "Надеюсь, президент в порядке."

 finland.27.t: "Президент Кёсти Каллио"
 finland.27.d: "Сегодня президент Кёсти Каллио объявил перед финским народом, что он уйдет с поста президента Финляндии."
 finland.27.a: "Нам нужно избрать нового президента"

 finland.28.t: "Президентские выборы"
 finland.28.d: "С отставкой Кёсти Каллио возник вопрос о том, кто будет его преемником. Хотя выборы, похоже, заканчиваются в пользу любимого кандидата Ристо Хейкки Райти, есть небольшая оппозиция левых, а их кандидатом является Социал-демократ Йохан Хело. Хело рассматривается как кто-то на социалистическом левом круизе его партии, и может быть слишком поляризован, чтобы заручиться поддержкой достаточного числа парламентариев или даже со стороны социал-демократов. Хотя предполагается, что Райти выиграет, выборы могут сделать сюрприз."
 finland.28.a: "Ристо Рити Вон, как подозревается"
 finland.28.b: "Йохан Хело получает удивительную победу"

 finland.29.t: "Президент Йохан Хело увольняет правительство"
 finland.29.d: "Новый президент, Йохан Хело, недавно уволил правительство, заявив, что оно не является приемлемым правительством в нынешней обстановке."
 finland.29.a: "Вместо этого мы должны уехать с Райти."

 finland.30.t: "Формирование правительства Пеккалы"
 finland.30.d: "Новое правительство социал-демократов, возглавляемое Мауно Пеккалой, было назначено новым президентом, хотя президент Йохан Хело утверждает, что это будет лучше представлять финский народ, многие консерваторы и центристы считают это социалистическим захватом власти."
 finland.30.a: "Новое правительство для народа!"

 finland.31.t: "Кооперативы Манхейм"
 finland.31.d: "Элементы финской армии, сопровождаемые Белой гвардией, теперь выступают против нового правительства и президента Йохана Хело. Под руководством фельдмаршала Карла Густава Манхейма переворот оправдан тем, что считается опасным событием для финской демократии. До сих пор не определено, кто победит, поскольку подземные Красные силы и левые элементы армии пришли в поддержку президента Хело и премьер-министра Пеккалы."
 finland.31.a: "Манхейм безопасна"
 finland.31.b: "Красные побеждают Манхейм"

 finland.32.d: "В связи с угрозой демократии, которую сейчас сняли президент Хели и премьер-министр Пеккала, настало время вновь провести президентские выборы, хотя выборы открыты для других кандидатов, в основном это гарантированная победа для Ристо Хейкки Райти, который также был предпочтительным выбором на предыдущих выборах. Это также хорошая возможность для Филд Маршала Манхейма вернуть власть парламенту и народу Финляндии в форме правительства, возглавляемого аграрным политиком Урхо Кекконеном."
 finland.32.a: "Наконец-то победитель Ристо Райти"

 finland.33.t: "Финская революция"
 finland.33.d: "В то время как Манхейм и его клика правых бандитов были побеждены, элементы Красной Гвардии, которые помогли ему победить, подняли свое оружие против демократической республики."
 finland.33.a: "Да здравствует социалистическая революция!"

 finland.34.t: "Президентские выборы"
 finland.34.d: "В Финляндии должны быть проведены новые президентские выборы, хотя в настоящее время считается, что Председателем будет избран ряд кандидатов, наиболее вероятным результатом будет переизбрание нынешнего президента, однако это может оказаться неуверенным, особенно если Финляндия сталкивается с какими-либо конфликтами или кризисами."
 finland.34.a: "Вайнё Таннер переизбран!"
 finland.35.a: "Ристо Райти переизбран!"
 finland.36.a: "Пехр Эвинд Свинхуфвуд переизбран!"
 finland.34.b: "Карл Густав Манхейм избран!"

 finland.100.t: "Возвращение к демократии?"
 finland.100.d: "С обеспечением безопасности будущего Финской Республики возник вопрос о том, пора ли Карлу Густаву Манхейму вернуть власть в парламент и восстановить демократию, и, хотя многие поддерживают такое решение, некоторые из кругов Манхейма указывают на опасность того, что политики будут править страной, существует опасность того, что политика станет более важной, чем нация, если будет восстановлена демократия, или если Финляндия будет продолжать действовать под его руководством."
 finland.100.a: "Демократия должна быть восстановлена!"
 finland.100.b: "Люди доверяют власти Манхейма!"

 finland.101.t: "Финская демократия восстановлена!"
 finland.101.d: "Карл Густав Манхайм только что отказался от своих полномочий, вернув их парламенту и народу Финляндии. С восстановлением демократии, это означает возвращение Пера Эвинда Свинхуфвуда в качестве президента и Аимо Каджандера в качестве премьер-министра."
 finland.101.a: "Спасибо, полевой маршал."

 finland.102.t: "Правительство Лапуа"
 finland.102.d: "В то время как движение является большей частью единой силой, между фракциями движения существуют некоторые трещины. Консервативная фракция, возглавляемая Германом Гуммером, больше заинтересована в сохранении финского общества, правопорядка, в то время как националистическая фракция, возглавляемая Вильо Анналой, поддерживает более радикальное движение, в большей степени соответствующее валькизму Германии."
 finland.102.a: "Мы не валькистское движение!"
 finland.102.b: "Мы истинное националистическое движение!"

 finland.103.t: "Создание народной делегации"
 finland.103.d: "Властью Коммунистической партии Финляндии является официальное восстановление Национальной делегации Финляндии под председательством Кулерво Манделе, которая будет выступать в качестве правительственного органа в Финляндии, гарантирующего права народа и трудящихся, а также будет выступать в качестве прикрытия для поощрения социализма в Финляндии."
 finland.103.a: "Для Финляндии! За социализм!"

 finland.104.t: "Противодействие стилю"
 finland.104.d: "С восстановлением Народной делегации существует правительство, которое поощряет права народа Финляндии, но в то время как его председатель, Куллерво Манделе, пользуется достаточной поддержкой со стороны ядра Коммунистической партии, он встречается с оппозицией от фракций партии. Протест не вызывает доверия внутри делегации. Хотя партия и делегация могут сохранить доверие, если кромки партии объединятся против него, он будет легко побежден."
 finland.104.a: "Держись!"
 finland.104.b: "Пути нет!"

 finland.105.t: "Новый председатель делегации"
 finland.105.d: "В то время как у социалистической фракции Ортодокса в коммунистической партии нет сильных кандидатов, два кандидата с каждой стороны партии, как представляется, являются самыми сильными соперниками. Отто Вилле Кусинен, лидер Красной гвардии, считается естественным преемником в качестве председателя делегации, но его радикальные взгляды и политика могут также отлучить его от более умеренных крыльев партии. С другой стороны, Оскари Токои, исходящий из левого крыла социал-демократов, является сильным кандидатом в социалистическую фракцию партии против автохарии. Он кажется более умеренным и может помочь интегрировать остальных социал-демократов в партию. Но его величайшая оппозиция исходит от влиятельных Красной гвардии."
 finland.105.a: "Отто Вилле Кусинен"
 finland.105.b: "Оскари Токои"

 finland.110.t: "[Постепенные] парламентские выборы"
 finland.110.d: "С восстановлением демократии в Финляндии только правильно проводить новые парламентские выборы, и хотя нынешний президент будет отстранен от своего поста, новый парламент должен занять его место, и таким образом наш народ будет должным образом представлен."
 finland.110.a: "Сильная центристская демонстрация"
 finland.110.b: "Социально-демократическая буря"
 finland.110.c: "Консервативный бустер"

 finland.111.d: "Новые парламентские выборы должны состояться в Финляндской Республике, и в течение трех лет, прошедших после последних парламентских выборов, ожидается, что результаты выборов этого года будут достигнуты."

 finland.112.t: "Центистское правительство?"
 finland.112.d: "С сильными демонстрациями центристских партий на недавних парламентских выборах, он поставил вопрос о том, следует ли нам выбрать новое правительство, чтобы отвлечь это. Несмотря на то, что нынешнее правительство в порядке, это сделает некоторых людей немного сердитыми, если мы проигнорируем это."
 finland.112.a: "Давай сохраним нынешнее правительство"
 finland.112.b: "Центрист, аграрное правительство!"
 finland.112.c: "Центрист, либеральное правительство!"

 finland.113.t: "Левое правительство?"
 finland.113.d: "С сильным проявлением политических левых сил на недавних парламентских выборах, он поставил вопрос о том, следует ли нам выбрать новое правительство, чтобы отвлечь его от этого. Хотя нынешнее правительство в порядке, это сделает некоторых людей немного сердитыми, если мы проигнорируем это."
 finland.113.a: "Давай сохраним нынешнее правительство"
 finland.113.b: "Социал-демократическое правительство!"

 finland.114.t: "Консервативное правительство?"
 finland.114.d: "С сильными демонстрациями консервативных партий на недавних парламентских выборах, он поставил вопрос о том, следует ли нам выбрать новое правительство, чтобы отвлечь это. Хотя нынешнее правительство в порядке, это сделает некоторых людей немного сердитыми, если мы проигнорируем это."
 finland.114.a: "Давай сохраним нынешнее правительство"
 finland.114.b: "Это консервативное правительство!"

 finland.120.t: "Антисоветская линия"
 finland.120.d: "Хотя в Финляндии есть те, кто хочет, чтобы мы переосмыслили Советский Союз, мы приняли решение продолжать антисоветскую политику, наряду с опасностью социализма, Советы являются также соединением российской угрозы и угнетения в отношении финской нации."
 finland.120.a: "Финляндия будет сильной"

 finland.121.t: "Новый подход к Советскому Союзу"
 finland.121.d: "Хотя в Финляндии есть те, кто хочет, чтобы мы продолжили враждебную позицию против Советского Союза, мы решили пересмотреть нашу позицию по отношению к ним. Дружелюбный тон по отношению к Советскому Союзу покажет, что мы готовы дать миру шанс, а также оставить старую борьбу позади. Советский Союз сможет принять нас как независимую республику, мы по крайней мере можем перестать быть врагами ."
 finland.121.a: "Давайте начнем строить этот мир"

 finland.122.t: "Мечта о большей Финляндии"
 finland.122.d: "Мечта о великой Финляндии всегда была активной инстинкцией националистических элементов внутри страны, но до сегодняшнего дня никогда не поднималась в правительственных залах. Сегодня правительство Финляндии провозгласило, что в последующие годы нация будет активно осуществлять мечту о великой Финляндии. Хотя эта мечта встреча встречалась с оппозицией пацифистов в нашей стране, а также наших соседей, националисты отмечали это как начало Великого Финского государства."
 finland.122.a: "Финляндия ценит величие!"

 finland.123.t: "Контакты Эстонии"
 finland.123.d: "Эстонская нация рассматривается главным образом как братство Финляндии, оба - народ Балтии, связанный общей историей иностранного угнетения и борьбы за независимость. Даже если эстонцы хотят своей независимости, есть и те, кто выступает за объединение Финляндии с Эстонией. Используя наше влияние, мы можем привлечь эстонцев и расширить их возможности в пользу нашего плана. Надеюсь, мы сможем удовлетворить даже эстонских националистов."
 finland.123.a: "Братья должны держаться вместе"

 finland.124.t: "Влияние Финляндии на Эстонию"
 finland.124.d: "Наша северная соседка, Финляндия, начала оказывать влияние на политику и общество Эстонии по отношению к пан-финнским чувствам. Хотя идея пан-финн Большой Финляндии прозвучит интересно, она все же вызывает определенное сопротивление в Эстонии. Некоторые эстонские националисты также рассматривают ее как способ устранить эстонскую самобытность в пользу финского. Они хотят, чтобы наше правительство лишило финскую возможность повлиять на нас."
 finland.124.a: "Давай не будем спешить."
 finland.124.b: "Отвергайте этот финский экспанионизм!"

 finland.125.t: "Финно-советский договор [Год]"
 finland.125.d: "Сегодня делегаты и дипломаты из Финляндии и Советского Союза встречаются для того, чтобы наконец нормализовать отношения между двумя странами."
 finland.125.a: "За мир и рост"

 finland.126.t: "Финляндия предлагает Финно-советский договор"
 finland.126.d: "На этот раз они предлагают нам договор между Финно и Советским Союзом, который будет способствовать укреплению дружбы и сотрудничества между нашими двумя нациями."
 finland.126.a: "Давай подпишем этот договор!"
 finland.126.b: "Никакого договора с Финном!"

 finland.127.t: "Советский Союз согласен с нашим договором"
 finland.127.d: "Советский Союз согласился с Финно-советским договором, укрепив дружелюбный и основанный на сотрудничестве характер между двумя странами, что является большим шагом для Финляндии в ее новом направлении, когда она противостоит Советскому Союзу."
 finland.127.a: "Ура!"

 finland.128.t: "Советский Союз отвергает наш договор"
 finland.128.d: "Советский Союз отверг Договор Финно-советского Союза, продемонстрировав нам, что они не заинтересованы в поощрении дружбы и сотрудничества."
 finland.128.a: "Тогда..."

 finland.129.t: "Финляндия хочет присоединиться к нашему альянсу"
 finland.129.d: "Финский дипломат в Германии обратился к нам с предложением разрешить Финляндии вступить в наш союз с перспективой помощи в борьбе с иностранной агрессией взамен."
 finland.129.a: "Скажи, что мы приветствуем их"
 finland.129.b: "Нам не нужны финны"

 finland.130.t: "Немцы принимают нас в свой альянс"
 finland.130.d: "Наше дипломатическое представительство в Берлине принесло плоды. Сегодня мы получили телеграмму, в которой подробно рассказывается о том, что Финляндия теперь является официальным членом альянса «Пакт Стали», возглавляемого Немецким Рейхом. Хотя это свидетельствует о выходе из нейтралитета, мы надеемся, что этот новый союз будет в основном позитивным для финской нации."
 finland.130.a: "Какая честь!"

 finland.131.t: "Немцы отвергают нас в свой Альянс"
 finland.131.d: "Наше дипломатическое представительство в Берлине вернулось с пустыми руками. Сегодня мы получили сокрушительную новость о том, что Германия отвергла членство Финляндии в их союзе, Пакте Стали. Хотя это и неудача, мы надеемся, что она будет временной."
 finland.131.a: "Это будет их убыток."

 finland.132.t: "Финляндия хочет присоединиться к нашему альянсу"
 finland.132.d: "Финский дипломат в Соединенном Королевстве обратился к нам с предложением разрешить Финляндии вступить в наш союз с перспективой помощи против иностранной агрессии взамен."
 finland.132.a: "Почему нас должны волновать советы?"
 finland.132.b: "Мы не нуждаемся в финнах"

 finland.133.t: "Британцы принимают нас в свой альянс"
 finland.133.d: "Наше дипломатическое представительство в Лондоне принесло плоды. Сегодня мы получили телеграмму, в которой подробно рассказывается о том, что Финляндия теперь является официальным членом Союза Императорской защиты, альянса, возглавляемого Соединенным Королевством. Хотя это свидетельствует о выходе из нейтралитета, мы надеемся, что этот новый союз будет в основном позитивным для финской нации."
 finland.133.a: "Какая честь!"

 finland.134.t: "Британцы отвергают нас в свой альянс"
 finland.134.d: "Наше дипломатическое представительство в Лондоне вернулось с пустыми руками. Мы надеемся, что сегодня оно станет временным."
 finland.134.a: "Это будет их убыток."

 finland.135.t: "Финляндия хочет присоединиться к нашему альянсу"
 finland.135.d: "Финский дипломат во Франции обратился к нам с предложением о том, чтобы позволить Финляндии вступить в наш союз с перспективой помощи против иностранной агрессии в обмен на это, это звучит как хорошая идея, но может быть и такая, которая помешала бы нашим отношениям с Советским Союзом."
 finland.135.a: "Финляндия может пригодиться"
 finland.135.b: "Для сдерживания Германии нам не нужны снег и деревья."

 finland.136.t: "Французы принимают нас в свой альянс"
 finland.136.d: "Наше дипломатическое представительство в Париже принесло плоды. Сегодня мы получили телеграмму, в которой подробно рассказывается о том, что Финляндия теперь является официальным членом Континентального союза, возглавляемого Францией. Хотя это свидетельствует о том, что она отступила от нейтралитета, мы надеемся, что этот новый союз будет в основном позитивным для финской нации."
 finland.136.a: "Какая честь!"

 finland.137.t: "Французы отвергают нас в свой альянс"
 finland.137.d: "Наше дипломатическое представительство в Париже вернулось с пустыми руками. Сегодня мы получили сокрушительную новость о том, что Франция отвергла вступление Финляндии в их союз, Континентальный союз. Хотя это и неудача, мы надеемся, что она будет временной."
 finland.137.a: "Это будет их убыток."

 finland.138.t: "Финляндия петиция о проведении референдума на Аланде"
 finland.138.d: "Финские дипломаты обратились к нам с просьбой о проведении референдума по Аланду. Делегаты Финляндии утверждают, что мы должны дать людям это решение, поскольку мы забрали его, когда оккупировали Аландию. В Швеции есть смешанные чувства. Некоторые шведские националисты поддерживают его, поскольку он может показать, как поддержка народа Аланда должна быть частью Швеции, в то время как другие отвергают его, считая, что он склонен к давлению со стороны Финляндии."
 finland.138.a: "Референдум, мы легко его выиграем!"
 finland.138.b: "Мы не можем дать им шанс"

 finland.139.t: "Швеция согласна с проведением референдума"
 finland.139.d: "Хорошие новости пришли от наших шведских соседей, они позволили провести референдум на Аландских островах, хотя это шаг в направлении восстановления нашей земли, но еще многое предстоит сделать, хотя есть те, кто поддерживает нас на островах, большинство на островах про-Швеция, и есть шанс использовать наше влияние для руководства референдумом в нашем направлении, но мы лучше его используем."
 finland.139.a: "Начинается работа."

 finland.140.t: "Швеция отвергает проведение референдума"
 finland.140.d: "От наших шведских соседей поступила плохая новость: они отвергли референдум, чтобы занять свое место на Аландских островах, ссылаясь на то, что население не несчастно быть частью Швеции, мы видим, что они боятся потерять эти острова, и мы будем и впредь ставить перед ними свои претензии."
 finland.140.a: "Они боятся потерять его."

 finland.141.t: "Шведская победа на референдуме!"
 finland.141.d: "К сожалению для нас, Швеция выиграла референдум по Аландским островам, и это вызывает у нас небольшое разочарование, хотя для нас это и является большим разочарованием, но мы должны, по крайней мере, признать этот результат и двигаться дальше."
 finland.141.a: "У нас был шанс"

 finland.142.d: "В результате референдума в Аланде мы боялись, что он закончится финской победой. Теперь, с завершением подсчета, ясно, что победа неизбежна. С объявлением о победе Швеции шведские флаги махнули еще немного над нашей страной, включая Аланд. Сегодня празднование продлится до рассвета, потому что Аланд - шведский!"
 finland.142.a: "Аланд яр Свенска!"

 finland.143.t: "Неопределенный результат референдума!"
 finland.143.d: ""
 finland.143.a: "Результат может быть очень близок."

 finland.144.d: ""

 finland.145.t: "Финская победа на референдуме!"
 finland.145.d: "В результате референдума, проведенного в Аланде, мы боялись, что шведы легко выиграют, и, к счастью, кампания, как представляется, оплатила, как результат, победу в Финляндии, несмотря на то, что на островах населены шведские говорящие, финские и финно-шведские флаги прокатились по нашей стране и на Аландских островах. Сегодня это настоящий день, чтобы отпраздновать!"
 finland.145.a: "Ахвенанмаа на Руотсалайнене!"

 finland.146.d: ""
 finland.146.a: "Это нехорошо."

 finland.147.t: "Перечисление заканчивается"
 finland.147.d: ""
 finland.147.a: "Близкая шведская победа"
 finland.147.b: "Близкая финская победа"

 finland.148.d: ""

 finland.149.d: ""

 finland.150.t: "Соглашение по Аландским островам"
 finland.150.d: ""
 finland.150.a: "Добро пожаловать домой, Ахвенанмаа"

