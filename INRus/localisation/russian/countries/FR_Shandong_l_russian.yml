 ##Events
 sha.1.t: "Кризис в Шаньдуне"
 sha.1.d: "Большое население Китая нуждается в сложной и эффективной системе материально-технического обеспечения для предотвращения катастрофы, однако недавняя война в Восточном Китае породила большую неопределенность даже в самых мирных регионах страны."
 sha.1.a: "Волнуюсь."
 ###
 sha.2.t: "Чжан Чжончхан приезжает в Шаньдун!"
 sha.2.d: "Приехав в Янтай с небольшой армией и флотом, воин Фенгтианского Союза Чжан Зонгчан быстро взял под свой контроль горные северо-восточные края полуострова и создал силовую базу, расположенную в этом районе. Зонгчан , не будучи настроенным враждебно по отношению к нам, без сомнения, использует нашу слабость для своей выгоды, вырезая свою личную власть из быстро рушящихся основ правительства Бейянга, и его постоянное присутствие подрывает то малое влияние, которое мы все еще имеем в регионе."
 sha.2.a: "Ему лучше вести себя хорошо."
 ###
 sha.3.t: "Потеря контроля в Шаньдуне"
 sha.3.d: "По мере того, как ампирия Чжили уступает, влияние Чжунчанга в Шаньдуне растет, и его личная армия быстро заняла наши недавно заброшенные посты в провинции. Чжунчан теперь фактически контролирует большинство городских центров Шаньдуна, и мы владеем Шаньдуном только по имени."
 sha.3.a: "Еще одна ценная провинция, потерянная"
 ###
 sha.4.t: "Формирование клика Шандонг"
 sha.4.d: "Чжан Цзунчханг, военный командир и командующий вооруженными силами Фенгты установили контроль над провинцией Шаньдун после ухода организованной военной администрации Чжили, что означает, что мы фактически потеряли эту провинцию, но в провинции остается большой контингент вооруженных и разоруженных солдат Чжили, которые мы можем использовать и манипулировать, чтобы получить влияние в Шаньдуне."
 sha.4.a: "Возможно, мы сможем использовать его..."
 ###
 sha.5.t: ""
 sha.5.d: ""
 sha.5.a: ""
 ###
 sha.6.t: ""
 sha.6.d: ""
 sha.6.a: ""
 ###
 sha.7.t: "Возникают внутренние фракции"
 sha.7.d: "Несмотря на то, что наше прибытие в Шаньдун было относительно непротиворечивым, это не означает, что наше правление над ним будет таким же. Разоруженные и заброшенные солдаты армии Жили, которые были вынуждены остаться в Шаньдуне, по-прежнему имеют влияние на провинцию, и, по сути, многие из них остаются милитаризированными и, несомненно, не согласятся с нашей просьбой взять оружие. С другой стороны, многие солдаты из Фенгтианской клики Чжана Зуолина сопровождали нас в нашем путешествии из Манчжурии в Шаньдун, и Зулин питает большой интерес к нашей неизменной лояльности и контролю над Шандонгом, с тем чтобы продвинуться вперед по его плану."
 sha.7.a: ""
 ###
 sha.8.t: "Фенгтианские и чилийские группировки образуются в клике Шандонг"
 sha.8.d: "Несмотря на то, что Чжан Цзунчханг, возможно, и утверждает, что победил Шаньдун не в одиночку, а вместе с контингентом Фенгтинской армии, который помог ему умиротворить сельскую местность и укрепить свое правление над провинцией, однако эта помощь привела к осложнениям в Шаньдуне. Правительство Фенты проявляет большой интерес к рейгону Шаньдуна, и его контроль дал бы им ценную пляжную голову и прикрытие в войне против любого из их южных соседей, включая нас. И наоборот, в провинции остается большой контингент вооруженных и разоруженных солдат Чжили, и их присутствие дало бы нам рычаги в этой новой военной клике, которую мы можем использовать, чтобы вернуть Шандонга в казну Жили."
 sha.8.a: "Мы заинтересованы в Шаньдуне."
 sha.8.b: "У нас гораздо более важные дела, чем дела военных баронов."
 sha.8.c: "Мы заинтересованы в Шаньдуне."
 sha.8.e: "У нас гораздо более важные дела, чем дела военных баронов."
 ###
 sha.9.t: "Телеграмма Цяньга"
 sha.9.d: "Вскоре после возвращения в Джинан после военной демонстрации в соседнем городе Чжан Цзунчханг был встречен сумасшедшим человеком, который держал клочок бумаги с набросками на нем. Этот человек, имя которого было раскрыто как Су Цян, был телеграфным оператором, работавшим на клику Шаньдун, и он только что отчитал очень важное сообщение из Пекина. ~ После тщательного изучения телеграммы и ее внимательного прочтения он узнал, что он принял предложение, наиболее искушающее. nnWu Peifu предложил узаконить наше требование в провинцию Цзянсу и даже позволил нам приобщить его во время их работы."upcoming military campaign", but we must be wary that accepting such a deal will certainly put us at odds with the Fengtian loyalists in our government which we will have to deal with in the future."
 sha.9.a: "Мы принимаем предложение Жили."
 sha.9.b: "Чжан решил не отвечать."
 ###
 sha.10.t: "Телеграмма перехвачена!"
 sha.10.d: ""
 sha.10.a: "Вызовите оружие!"

