 SHA_qu_yingguang: "Qu Yingguang"
 SHA_qu_yingguang_leader_desc: "Квингуанг родился 14 марта 1883 года в Чжэцзяне, вдохновлённый Цю Цзинь стать революционером, но позднее присоединившись к клике армии Бейянга. В 1919 году Кв был назначен диктором Китая, который стал приёмной провинцией для него. Он выставил себя хорошим лидером, улучшив управление Желтой рекой и приложив усилия к защите провинции. Взяв дядьих дикторов, он обрел связь с Дюком Яншенгом. Годы спустя он вступил в жандармское правительство Бейянга и стал ближе к Дуаньцу. Оба мужчины были последователями буддизма, вера в то, что он научился у матери своей семьи. Он провел время, работая с религиозными обществами и благотворительными организациями, заработав буддистское имя. Фахиан, и прозвищем ганга в герцогском Альянсе. Затем он перебрался в Шанхайан незадолго до свержения в 1926 году, не понимая авторитаризма и коррупции в Пекине. Шанха его опущенная благотворительность, Альянс ."

 SHA_zhang_zongchang: "Чжан Чжончхан"
 SHA_zhang_zongchang_leader_desc: "Зонгчан сам не чувствовал большой национальной гордости за Циндао, когда он был потерян в 1897 году в Германии, но революция 1911 года привела его к действию. Придя в Шанхай, чтобы подтвердить верность Республике, он попал в Фенг Гужанг и присоединился к Клике Жили, когда они появились в 1917 году. Но когда Фэн вернулся в 1919 году, Цунчанг вернулся в Манчжурию и присоединился к Фенгтианской клике как раз вовремя, чтобы принять участие в Первой Жили-Фенгтианской войне в 1922 году. Поражение Фэнтяна в этой войне не удержало его, и он пошёл играть видную роль во второй войне в 1924 году, захватив важнейший Ленгкоуганский перевал. С почти полным коллапсом Северной клики, последовавшей за Пекинским купом, Цунчанг пошел на покорение Шанджана и продвинулся на юг, как Нанджинг и Шанхай. Способность эффективно использовать железные дороги так же, как необы харизм человека, названного ."filthy\", even by his allies, carried him through to victory after victory. Following a period of debauched rule in China's most international city, Zongchang thoroughly entrenched himself in Shandong, and through back-and-forth wars over Jiangsu eventually found himself trapped in the province during the Fourth Zhili-Fengtian War in 1928. In the years since, Shandong has become both a refuge and a prison, where his illegal but tolerated presence remains under the shadow of the Qing government in Beijing. More recently, a bout of seemingly incurable sickness drew him up the 6,600 steps to a Yiguandao doctor. Zongchang eventually met the Yiguandao’s Honoured Teacher, Zhang Tianran himself. Whether it was his sickness or the lack of anything else to do up on Mount Tai, Zongchang promised Tianran that he would follow the esoteric lifestyle espoused by the cult for his health."
 SHA_zhang_zongchang_commander_desc: "§L\nZongchang сам не чувствовал большой национальной гордости за Циндао, когда он был потерян в 1897 году в Германии, но революция 1911 года привела его к действию. Придя в Шанхай, чтобы заявить о своей верности Республике, Фенг Гужанг встал вместе с Кликой Жили, когда они появились в 1917 году. Но когда Фэн умер в 1919 году, Зонгчанг вернулся в Манчжурию и присоединился к Фенгтианской клике как раз вовремя, чтобы принять участие в Первой Зили-Фенгтской войне в 1922 году. Поражение Фэнтяна в этой войне не убеждало его, и он продолжал играть видную роль во второй войне в 1924 году, захватив важнейший Ленгкоуганский перевал. С почти полным коллапсом Северного Цилийского Кликого после Пекинской Купой Зонгчан стал побеждать Шандонга, а также эффективно продвигался в южскую сторону, как на юаньскую, как на ханьскую, а также и на юаньскую ханьскую, на ханьскую ху."filthy\", even by his allies, carried him through to victory after victory. Following a period of debauched rule in China's most international city, Zongchang thoroughly entrenched himself in Shandong, and through back-and-forth wars over Jiangsu eventually found himself trapped in the province during the Fourth Zhili-Fengtian War in 1928. In the years since, Shandong has become both a refuge and a prison, where his illegal but tolerated presence remains under the shadow of the Qing government in Beijing. More recently, a bout of seemingly incurable sickness drew him up the 6,600 steps to a Yiguandao doctor. Zongchang eventually met the Yiguandao’s Honoured Teacher, Zhang Tianran himself. Whether it was his sickness or the lack of anything else to do up on Mount Tai, Zongchang promised Tianran that he would follow the esoteric lifestyle espoused by the cult for his health."

 SHA_zhang_tianran: "Чжан Тяньран"
 SHA_zhang_tianran_leader_desc: "Лу Чжуньи была лидером небольшой группы религиозных синкреционистов под названием Игуандао в 1918 году. Лу Чжунжи всегда планировал, чтобы его сестра Лу Чжунджие сменяла его на сестре Лу Чжунджие, где они остались до этого дня. Тяньран , полностью доверяя своим членам, а также новой божественной жене Сун Сузхен, начал рассказывать о величайших откровениях. Тяньран , в 1922 году, построил мечетку на горе Тханьцзя, которая крепла до тех пор, пока она не охватила другие монастыри на горе. Маунт Тай стала домом для Чжана Тьяна и его внутреннего круга. Духовная сессия , в которой Таньян , Тань , , Тан , была , , , ."

