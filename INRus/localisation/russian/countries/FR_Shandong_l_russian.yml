 SHA_zhili_remnants: "Остатки армии Жили"
 SHA_zhili_remnants_desc: "В то время как большинство вооруженных сил Жили отступили на север, некоторые из них решили сохранить свои посты в Шаньдуне, применяя асимметричный подход к противодействию силе Зонгчана."
 SHA_zhili_remnants2: "Остатки армии Жили"
 SHA_zhili_remnants2_desc: "В то время как большинство вооруженных сил Жили отступили на север, некоторые из них решили сохранить свои посты в Шаньдуне, применяя асимметричный подход к противодействию силе Зонгчана."
