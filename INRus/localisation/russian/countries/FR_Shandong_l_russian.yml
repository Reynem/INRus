 SHA_zhili_officers2: "Объединенная армия Жили"
 SHA_zhili_officers3: "Защита китайского шендуна"

 SHA_zhili_training: "Профессиональная подготовка сотрудников Жили"
 SHA_zhili_training_desc: "Даже старшие члены Шандонг Клик согласны с тем, что наша армия... устарела... что Жили великодушно предложили обучить некоторых наших офицеров в надежде, что она создаст более профессиональную армию, насколько они любезны."

 ##Focuses
 SHA_the_bastard_victorious: "Ублюдок, победивший"
 SHA_the_bastard_victorious_desc: "Несмотря на все усилия Тяньрана, генерал Догмея вернулся в Шаньдун вместе с Фенгтианом Бэкингом. Его возвращение знаменует собой начало эпохи перемен для провинции, будь то к лучшему или к худшему."

 SHA_pacify_the_peninsula: "Очистить полуостров"
 SHA_pacify_the_peninsula_desc: "Проклятые Жили отказались покинуть провинцию, мы должны разобраться с ними, и быстро, чтобы Зонгчан не потерял власть."
 SHA_mobilise_zhennians_army: "Мобилизовать армию Чжэньниана"
 SHA_mobilise_zhennians_army_desc: "Армия Восточного Шаньдуна генерала Лю Шэнниана должна быть мобилизована, если мы хотим иметь дело с Жили."
 SHA_raid_zhili_armouries: "Рейд Жили"
 SHA_raid_zhili_armouries_desc: "К счастью, у армии Жили полно складов в Шаньдуне, чтобы мы могли их захватить, с этими пушками мы охотимся за остатками армии Жили и очистим их с нашей земли!"
 SHA_control_railways: "Провинциальные железные дороги"
 SHA_control_railways_desc: "Если мы хотим противостоять Жили, мы должны укрепить наш контроль над железнодорожными сетями Шаньдуна, чтобы ограничить их способность передвигаться по всей провинции, что позволит нам легко окружить их и стереть с лица земли!"
 SHA_counter_insurgency_campaigns: "Кампания по борьбе с повстанцами"
 SHA_counter_insurgency_campaigns_desc: "Теперь, когда у нас есть снаряжение и армия, мы можем начать кампании по борьбе с повстанцами против Жили, с тем чтобы вывести этих дегенератов с наших земель и восстановить контроль над провинцией."

 SHA_weifang_rail: "Расширить восточные железные дороги"
 SHA_weifang_rail_desc: "Янтай - это регион с незначительным правительственным или военным влиянием, если мы хотим централизовать Шаньдун, мы должны установить рельсы, движущиеся вверх и вниз по региону. Эти рельсы облегчат доступ для наших военных и гражданских лиц, а также быструю доставку товаров из региона в сам Шаньдун."
 SHA_military_industry: "Сильная военная индустриализация"
 SHA_military_industry_desc: "Наша армия нуждается в оружии! пока мы можем полагаться на винтовки армии Жили, мы не можем делать это очень долго, поскольку нас отрезают от остальной части Китая, а японцы не хотят нам помогать, мы должны сделать все возможное для индустриализации программы вооружения. Однако, если мы хотим укомплектовать эти фабрики, мы должны затащить фермеров в города."
 SHA_irrigation: "Строить системы ирригации"
 SHA_irrigation_desc: "Небо бога также зовут Чжан, но почему он усложняет мне жизнь, если через три дня не будет дождя, тогда я разрушу твой храм, и тогда я заставлю пушки бомбить твою маму."

 SHA_a_new_government: "Новое правительство"
 SHA_a_new_government_desc: "Теперь Шаньдун должен поселиться в новом правительстве, которое будет править народом в видении своих хозяев."

 SHA_fuju: "Благотворительное правило Хана Фуджу"
 SHA_fuju_desc: "Правительство Шэньяна решило свергнуть генерала и заменить его Хан Фуджу при поддержке движения Фу Ссуньен четвертого мая."
 SHA_peoples_freedom: "Народная власть"
 SHA_peoples_freedom_desc: "Фу Ссуньен довольно громко изложил свою точку зрения по таким вопросам, как свобода научных кругов и прессы. Именно это привело бы его Движение четвертого мая к распространению, как лесной огонь, по всему Шаньдуну во время правления Тяньрана, и именно это привлекло бы Хан Фуджу к его движению. Нн Хан, тем временем, является строгим дисциплинарием, который стремится обеспечить соблюдение своего закона посредством сурового наказания против тех, кто выступает против него, сделав его идеальным человеком, который продвинет эти реформы. Те, кто отказывается признать эти свободы, будут сурово наказаны, и с теми, кто стоит перед верховенством закона, будут обращаться быстро и без милосердия."
 SHA_reform_local_governance: "Реформирование местного управления"
 SHA_reform_local_governance_desc: "Для этого Фу предложил создать местные выборные должности, которые будут представлять свои соответствующие муниципалитеты в провинциальной ассамблее."
 SHA_remove_zhennian: "Удалить Лю Чжэньняна"
 SHA_remove_zhennian_desc: "Лие Чжэньниан - презренный военный повелитель, который стремится только к своему собственному богатству за счет народа Шаньдуна, он должен быть удален, независимо от стоимости, и мы должны утвердить нашу гегемонию над Востоком раз и навсегда."
 SHA_take_from_the_rich: "Возьмите у богатых"
 SHA_take_from_the_rich_desc: "Хан выше этих деспотичных фигур и сделает все возможное, чтобы отвлечь богатство от этих грязных людей."
 SHA_deal_with_banditry: "Борьба с бандитизмом"
 SHA_deal_with_banditry_desc: "Слишком долго бандитам разрешалось бродить по сельской местности, терроризируя тех, кого они считают нужным, и это должно прекратиться."
 SHA_control_currency: "Распределение валют"
 SHA_control_currency_desc: "Преступность не может быть совершена без какого-либо стимула."
 SHA_give_to_the_poor: "Создание средств к существованию народа"
 SHA_give_to_the_poor_desc: "Мы перераспределим богатство, которое мы захватили, бедным гражданам Шаньдуна путем расширения доступа к образованию в масштабах всей провинции; это не только будет способствовать дальнейшему развитию Шаньдуна, но и будет сдерживать бандитов и подталкивать их к получению образования и к тому, чтобы они делали что-то с их никчемной жизнью."

 SHA_tianrans_restoration: "Милленарское правило Тяньрана"
 SHA_tianrans_restoration_desc: "Чжан Тяньран, любимый губернатор Шаньдуна, вернулся! Его доброжелательность вернет Шаньдуна в сферу Жили и восстановит историческое величие провинции!"
 SHA_restore_the_churches: "Восстановить церкви"
 SHA_restore_the_churches_desc: "Хант Чжан Цзончхан не заботился о религиозных верованиях своего народа, однако, с возвращением Тяньрана мы можем собрать и восстановить, И-Куань Тао будет восстановлен и поведет народ Шаньдуна к спасению."
 SHA_promote_religious_devotion: "Пропаганда религиозного обличения"
 SHA_promote_religious_devotion_desc: "Теперь, когда мы боролись за контроль над бастардом и получили значительную автономию от правительства Бейянга, мы свободны пропагандировать свои религиозные ценности на всей территории Шаньдуна."
 SHA_destroy_opium_merchants: "Уничтожить торговцев опиумом"
 SHA_destroy_opium_merchants_desc: "Наркотики, подобные опиуму, лишь оглушают народ Китая в эгоизм и ленивость. Мы не можем допустить, чтобы это еще больше заразило наш народ, и мы не можем позволить членам правительства сбежать в этом дегенератстве!"
 SHA_stabilise_the_province: "Стабилизировать Шаньдун"
 SHA_stabilise_the_province_desc: "Наконец-то мы достигли точки, где мы можем вытеснить все остатки Зонгчана и его дегенератство и восстановить мир и порядок в провинции раз и навсегда!"

 SHA_zhangs_decadent_rule: "Целостное правило Чжана"
 SHA_zhangs_decadent_rule_desc: "Власть Чжана Цзончана над Шаньдуном была укреплена. Теперь он может устоять перед своей мечтой о субсберегающем Шандонге, который благоволит торговцам опиумом и его собственным гаремом. Однако его политика заставила некоторых задуматься о будущем провинции, и многие считают эту новую эру «эрой деградации и коррупции»."
 SHA_purge_the_shandong_clique: "Очистить клик Шандонга"
 SHA_purge_the_shandong_clique_desc: "Шаньданский клик Тяньрана должен быть очищен, если мы хотим закрепить правление Зонгчана и предотвратить рост диссидентов в Шаньдуне!"
 SHA_save_the_opium_trade: "Сохранить торговлю опиумом"
 SHA_save_the_opium_trade_desc: "Мы должны обеспечить, чтобы все в Шаньдуне имели доступ к этому крестному полю, и убедиться, что торговцы этим золотом в карманах."
 SHA_merchant_economy: "Торговая экономика"
 SHA_merchant_economy_desc: "Мы не должны управлять экономикой, все, что мы должны сделать, это позволить торговцам вести дикую жизнь, пока мы пожинаем награды! Тем самым мы стабилизируем экономику провинции и позволим легко превзойти экономическое влияние Жили в провинции."
 SHA_king_of_east_shandong: "Король Восточного Шаньдуна"
 SHA_king_of_east_shandong_desc: "Мы дадим Лю официальный контроль над Янтай, чтобы успокоить его и его армию, в конце концов, если он предает нас, мы мало что можем сделать в нашем нынешнем состоянии, чтобы сражаться с ним."
 SHA_military_cabinet: "Форма A Военный кабинет"
 SHA_military_cabinet_desc: "Если мы хотим стабилизировать Шаньдун, мы должны обеспечить успокоение и преданность правителям Восточного региона, и для этого Чу Юпу предложил создать военный кабинет, состоящий из многих генералов, с тем чтобы дать им право голоса в управлении провинцией."
 SHA_entrench_zongchang: "Правитель Зонгчана"
 SHA_entrench_zongchang_desc: "Когда армия Чжили в основном исчезла, мы можем окончательно завершить правление Зонгчана и вновь подтвердить его правление раз и навсегда."
 SHA_erase_the_zhili: "Стереть Жили"
 SHA_erase_the_zhili_desc: "Теперь, когда Жили Клика вырвана с лица земли, мы можем положить конец их банде вооруженных предателей."

 SHA_zhili_cooperation: "Сотрудничество Жили"
 SHA_zhili_cooperation_desc: "Жили Клик щедро позволил Чжунчангу сохранить свою должность, однако теперь он должен сотрудничать с кликой Шаньдун, что осталось, однако это оказалось полезным для провинции, поскольку фактическое правительство было бы наделено контролем над большинством провинциальных дел."

 SHA_restore_order: "Восстановить порядок"
 SHA_restore_order_desc: "Жили, после короткого перерыва, вернулись в Шаньдун, теперь наш долг восстановить порядок под носом этого безумного губернатора."
 SHA_invite_zhili_officers: "Приглашать должностных лиц из Жили"
 SHA_invite_zhili_officers_desc: "Жили обещали простить нас за наши предыдущие кампании, мы не должны тратить время на восстановление своей военной поддержки, тогда их офицеры помогут нам править провинцией и снять разногласия в наших рядах."
 SHA_limit_the_trade: "Ограничить торговлю"
 SHA_limit_the_trade_desc: "В то время как Зонгчан твердо придерживается принципов опиумной экономики, мы этого не делаем, поэтому мы должны ограничить торговлю только губернатором и его гаремом, в то время как он безрассудно не в курсе нашего вмешательства."
 SHA_militarise_shandong: "Милитаризация Провинция"
 SHA_militarise_shandong_desc: "Шаньдун должен быть превращен в милитаристское государство, если мы хотим защитить провинцию и защитить ее народ от опасной оппозиции, которая граничит с ней."
 SHA_centralise_the_economy: "Централизация на уровне провинций"
 SHA_centralise_the_economy_desc: "Шаньдун должен быть централизован под контролем Джинана, в настоящее время военные бароны на востоке ведут дикую борьбу со своей собственной политикой и сферами влияния, мы не можем допустить, чтобы это продолжалось, смерть тем, кто стремится подорвать верховенство закона."
 SHA_religious_cooperation: "Поощрение религиозного сотрудничества"
 SHA_religious_cooperation_desc: "Религия является важным аспектом китайской жизни, однако не существует ни одной религиозной конфессии, которая претендует на гегемонию над населением, и поэтому мы должны стремиться к сотрудничеству между религиозными сектами Шаньдуна, чтобы не переложиться на вражду между верованиями."
 SHA_defend_chinese_shandong: "Защищать китайский шаньдун"
 SHA_defend_chinese_shandong_desc: "Слишком много иностранцев заинтересованы в Шаньдуне. Мы, как их правители, должны защищать китайский народ Шаньдуна и выдворять иностранцев любой ценой! Шаньдун будет освобожден, мы позаботимся об этом."

 SHA_connect_jinan: "Восстановить железные дороги Джинана"
 SHA_connect_jinan_desc: "Железнодорожная сеть Джинана была повреждена во время вторжения."

 SHA_shandongs_riches: "Богатство Шаньдуна"
 SHA_shandongs_riches_desc: "Шаньдун богат ресурсами и даже богаче людскими ресурсами. Массивный уголь и железные руды могут, если они будут использоваться в дальнейшем, значительно расширить нашу экономическую продукцию и позволить нам продолжить свою деятельность в качестве независимой и современной провинции в Китае, которая не зависит ни от кого, кроме нас самих."
 SHA_furthered_coal_mining: "Дальнейшая добыча угля"
 SHA_furthered_coal_mining_desc: "Уголь является важной частью предприятий и основных промышленных товаров, и поэтому мы должны стремиться к расширению добычи угля из Янчжоу и Джиннинга, с тем чтобы максимально использовать этот богатый ресурс."

