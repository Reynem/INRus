 SHA_kong_dechong: "Конг Дехонг"

 SHA_li_jinglin: "Ли Цзинлин"
 SHA_li_jinglin_commander_desc: "В 1907 году Ли Цзиньлин был одним из сотен молодых офицеров, застигнутых в разгаре партизанской военной деятельности. В 1924 году его первое крупное украшение было в борьбе с восстанием Вучанга. В 1924 году Гран-Маршал Чжан Зуолин перевел Ли в этот год на сторону кликовой политики в республиканские годы. Ли был впечатлен тем, что был изгнан из Анхуайской клики за коррупцию, а в 1928 году он оказался в Фенгтской клике. В 1924 году он поступил на службу в Гран-Маршал Чжан Зуолин. В том же году он перевел Ли на имя Чжана Цзонгчана, который вел честную борьбу в Жилии. Ли был впечатлен способностью Чжана Цзонгчана, несмотря на его отсутствие у него манеры, но эта оценка была перенесена на 1928 год, когда Сонгчанг не смог должным образом заполучить свой дивизию в Санда."

 SHA_feng_anbang: "Фэн Анбанг"
 SHA_feng_anbang_commander_desc: "Эта служба продолжалась в конце XIX века, когда Фэн Юсян присоединился к Юань Шикай и закончился дезертирством Фэна Анбана в 1917 году. Это предательство привело Фэна Анбанга в 16-ю смешанную бригаду Анхуай Юсяна и служило для них в качестве командира пехоты до 1924 года. Эти отношения прекратились, когда Фэн Анбан был обвинен в взятках, что привело к принудительному отставке в Шандонг. Опыт Фэнга, командовавшего пехотой в 1917 году, не был забыт, и он был нанят приходящим Чжаном Цзонгчангом для подготовки своей армии в 1931 году. В обмен на это, Цзончанг передал помилование за преступления Фэнга из Цзуолина, что позволило Фэнгу переселиться в Шаньонг."

 SHA_zhang_huaizhi: "Чжан Хуайджи"
 SHA_zhang_huaizhi_commander_desc: "В годы унижения Чжан Хуайдзи начал жить в качестве фермера в период между привычками нищеты. Семья Чжана, видя будущее в западном бизнесе на севере, в юном возрасте перевела Уйцхи в Тяньцзин. Будучи студентом в школе военного снаряжения Тяньцзянь, Чжан Уайдзи присоединился к бунтарскому мятежу со своим полком и получил хвалу за бомбардирование квартала Легионации. Вина за то, что проиграл западным жителям, втянул позорного Чжана в армию Юана Шикаи, чей амбициозная цель стать императором была больше похожей на естественную эволюцию для Чжана, чем на республиканское. После смерти Юана Чжан Уайдзи встал вместе с Анхуайским кликом и на короткое время служил под руководством Чжана Шуюана администратором в Шандонге. В конце концов, его главарь вновь потерпел неудачу после падения режима в Унане. Этогон Уайзхи, Ишайдзман, который снова был назначен, и его единственным представителем, который был назначен на западный историк."

 SHA_xu_yuanquan: "Сюй Юанькуань"
 SHA_xu_yuanquan_commander_desc: "В 1910-х годах Сюй был отправлен вместе с 6-м батальоном смешанной бригады в Шандонг для обеспечения безопасности в провинции. Сюй не смог обеспечить безопасность провинции по прибытии Чжана Цзончана в 1928 году. Сюй решил предать КМТ и передать свою бригаду Зонгчангу, оставаясь неуверенным в Цунчханге. Сюй сыграл важную роль в том, чтобы почувствовать себя неуверенным, что он остался в Шончанге во время наступательной агрессии в 1928 году."

 SHA_hakuro_kohinata: "Хакуро Кохината"
 SHA_hakuro_kohinata_commander_desc: "В 1920 году Кохината покидала загадочную ургу в Монголии, захваченную бандитами во время своего путешествия. Кохината начала симпатию к Кохинате и позволила ему присоединиться к своей банде лошадей. Эти воры учили Кохинату Даосизму, боевым искусствам, а также дали ему имя "Асахи-Хигаси" - "Гун Дьявола". Когда Цин был восстановлен, Кохината начал ходить с псевдонимом Шао, скрывающим его японское происхождение. Кохината был захвачен Чжаном Зуолином и первоначально был приговорен к смерти."

 SHA_junnosuke_date: "Дата"
 SHA_junnosuke_date_commander_desc: "§L\nDate — это репутация уважаемого и давно известного клана. Оригинальный клан дат является самураем провинции Муцу и включает в себя высокопоставленных министров. Семейные связи даты спасли ему жизнь, когда в 1909 году он убил одноклассника в соперничающей банде. Дата была спасена от юридической работы первого японского детектива Иваи Сабуро. Находясь в тюрьме, Дейт присоединился к Церкви Омото, которая была популярна среди молодых офицеров в то время. Дата была освобождена из тюрьмы в 1916 году и отправилась в Манчжурию. План убийства Чжана Зуолин принца Ямагаты Аритомо сработал на фуле с Зуолином, вынудив Дейти поклясться ему. Дата назначена в армию Зончанга в 1929 году, первоначально для обучения наемников японской кавалерии."

 SHA_sun_dianying: "Солнце-дианинг"
 SHA_sun_dianying_commander_desc: "Сун ссорился со своими учителями из молодого возраста и подожгал свою школу, когда он вылетел из школы. Солнце стало пристраститься к азартным играм и опиуму и присоединилось к бандиту Яньшань Чжан Пинг в то время, когда он был еще ребенком. Солнце также присоединилось к Обществом Темпл Роуд, народной религии, и в конечном итоге вступило в лидерство в обществе. Солнце убедило общество присоединиться к Силе Сун Пасификации Маунт, группу против бандитов, состоящую из бывших бандитов. После того, как в 1925 году он стал свидетелем самоубийства Хан Юкуна, Сан дезертировал с преданными солдатами. Эти солдаты вошли в Общество Темпл Роуд, которое является народной религией, и в конечном итоге заняли лидирующую позицию в КМТ. Когда Северная экспедиция схвативировала в 1927 году, группа по борьбе с бандитизмом, состоящая из бывших бандитов."

 SHA_zhang_jingyao: "Чжан Цзиньяо"
 SHA_zhang_jingyao_commander_desc: "§L\nZhang продемонстрировали преступную склонность к убийству в возрасте 15 лет в Анхуе. Чжан бежал из Анхуи вскоре после того, как прибыл в Пекин, и попал в сферу Юань-Шикай. Чжан, тренировался в Зале Баодингской армии в 1911 году и был назначен в 22-й полку под Янь-Шикай. Чжан подал апелляцию и был переведен в морской отдел для борьбы с КМТ в 1913 году. В ходе этой кампании он занял Лузу, Сычуань, в 1915 году, Чжан предал Юань Шикай и присоединился к Клике Анхуи в 1917 году. Чжан подал апелляцию и был лишен губернаторства Унанана в 1918 году. Цзиньяо решил вступить в бой между Анхуйской кликой и позднее в Чжунчанг после подъема Лиги восьми провинций. Чжан стал вторым армейским вождём в 1931 году."

 SHA_qu_tongfeng: "Qu Tongfeng"
 SHA_qu_tongfeng_admiral_desc: "В 1910 году он вернулся в Китай и служил в качестве инструктора в Академии военных наук им. В 1910 году он начал сотрудничать с республиканцами в восстании в Вуханге 1911 года, разогнался на различные посты в Республике, в конце концов возвратился в Юань Цзиньенг на короткое время, перед тем как управлять военным ведомством в Шаньонге в 1916 году. В 1917 году он заключил соглашение о продаже минеральных прав на алюминиевую шахту в Сандонге в Японии и доставил груз в Яндане."

 SHA_li_lijiu: "Ли Лицзю"
 SHA_li_lijiu_commander_desc: "В 1925 году Ли Лицзю начал изучать боевые искусства. В 1925 году он служил тренером по боевым искусствам для армии Хэндана. С тех пор Ли Ли Ли Чжиу вступил во вражду с различными воинами. В 1935 году приехал в Наньцзин и остался в доме своего мастера по боевым искусствам Дю Синьву. Вскоре он стал интересоваться Игуандой. Первая доставка катапульта Лицзю во внутреннюю кружку Чжана Тяньрана. Ли Лицзю вернул свою поддержку, поставив себя на службу обществам Красного Спирса в Шаньонге, обещая освободить Наньцзинга и, в конечном счете, своего друга Захоя."

 SHA_lu_yongxiang: "Лу Ёнсян"
 SHA_lu_yongxiang_commander_desc: "В конце XIX века он начал свою военную карьеру как выпускник Тяньцзянской Новой военной академии в Субинхайской революции. Сначала как солдат под именем Цин государственного деятеля Ли Хунцзян, затем в качестве инструктора в военном батальоне Вувей в Шаньдуне. Лу Ёнсян провел первое десятилетие XX века, поднявшись на ряды в Шаньдуне, и в конечном итоге возглавил 20-й дивизион Цин Новой армии против революции в Синьхайе. Опыт Лу и его верность купили ему звание «Барон» в Юань-Шикайс-Бейян в 1912 году. После смерти Юана Шикай, Лу присоединился к Анхуай-Клике и служил под их клюшкой в течение нескольких лет. Луньсян совершил неудачное нападение на Лигу под Сан-Чуаньфанг во время их борьбы с Анхуайской Кликой и совершил поспешный побег в Японию под его поражением."

 SHA_lin_jianzhang: "Лин Цзяньцзян"
 SHA_lin_jianzhang_commander_desc: "§L\nLin Jianzang начал свою карьеру в военно-морском флоте с немедленной признательностью и смелостью в новых технологиях. Лин, будучи уроженцем Фуцзяна, присоединился к военно-морскому флоту Китая и окончил недавно созданную имперскую военно-морскую академию Кянгана. Лин продемонстрировал эту смелость во время Синьхайской революции, начав спасательную миссию по реке Янццзэ против республиканцев. Лин был вознагражден за этот акт наньцзинским временным правительством, когда его повысили до адмирала и оставили на флагманском военно-морском корабле Нань Шун . Линь стал идеальной мишенью для вербовки в китайскую политику и его последующего переворота в Цхилийскую Клику. После восстановления Цин Лин объявил свой флот независимым и отплыл в Шанхай, что почти стоило ему жизни, когда его флот сверг его в Янтай."

 SHA_zhao_hong_wenguo: "Чжао Хон Венгуо"
 SHA_zhao_hong_wenguo_commander_desc: "Хун Венгуо родился в 1881 году в Хунчигу, Сюян, Фэнтянь, в бедной семье. 14 лет Чжао пережила события Первой китайско-японской войны. 1898 года Чжао женился на Чжао Юхуанге, взял свою фамилию, и у него было 5 сыновей и 3 дочери. Один из ее сыновей, Чжао Дон, стал профессором университета в Донгбейском университете. Благодаря своей тяжелой работе мадам Чжао обрела уважение в своей деревенской общине и улучшила финансовое положение своих семей, доведя их до более высокого положения. Когда Чжан Зуолин объявила своих предателей и бандитов в 1930 году, Чжао взяла на себя оружие, чтобы защитить себя. Чжао эвакуировала свой город Сюань перед жандармерией Чжана Зуолина и, как утверждается, застрелила солдат Зуолина двумя скрытыми пистолетами, заработав прозвище «Бабушка Тво Гун»."

 SHA_xue_dian: "Сюэ Диан"
 SHA_xue_dian_commander_desc: "Долгая и устойчивая карьера, изучавшая боевые искусства в Синьджи-Куань в Тяньцзине, определяла ранние годы жизни Сюэ. Сюэ учился с мастерами Ли Куньи, Ли Тайхе и Сюэ Чжэнган. Когда Сюэ был побежден в матче против Фу Цзяньцзю, ему пришлось покинуть город из-за культурных правил, касающихся состязания в боевых искусствах. Сюэ отправился в эту ссылку в 1925 году и поехал в Шандун, где случайная встреча с Чжаном Тяньраном изменила его жизнь. Чжан Тяньран дал Сюэ дианьский образ жизни и уроки молитвы, которые позволили Сюэ Диану вернуться в Тяньцзин и избить Фу Цзяньцзяньцю; благодаря Сюэ Дянь Титхт в свою военную акадею в Тяньцзине и присоединился к благотворительной организации Игуандао. в 1926 году Сю Диан принял участие в тайной встрече между Красскими Спирами и Чжаном Тяньраном, и был назначен в Игуандао в Игуандао в качестве младшего императора, чтобы возглавитьна."

 SHA_boris_annenkov: "Борис Аннанков"
 SHA_boris_annenkov_commander_desc: "В 1918-1920 годах Борис Анненков организовал и возглавил антибалшевские казаки в Семипалатинском и Семирежском районах. С окончанием гражданской войны Аннанков оказался в военном и тюремном заключении, якобы в результате неподконтрольных ему политических махинаций. Согласно его рассказу, Анненков сбежал из тюрьмы в 1924 году и в конечном итоге перешел через китайско-российскую границу в Синьцзян, найдя путь в Шанхай. В то время дефакто-лидер города нанял Бориса в качестве офицера для руководства российскими наемническими силами."

 SHA_liu_zhennian: "Лю Чжэньнянь"

 SHA_robert_short: "Роберт Шорт"
 SHA_vincent_schmidt: "Винсент Шмидт"
 SHA_antonio_riva: "Антонио Рива"

 ### Traits ###
 SQI_dogmeat_general: "Тем не менее, эти же черты привили ему ужасную репутацию, к которой притягиваются определенные группы последователей. Чжан открыто признает, что у него есть три неизвестных жены, неизвестное богатство и, что важнее всего, неизвестное количество солдат. Эти качества делают Зонгчана непредсказуемыми, его истинные цели и потенциал трудно определить."
 SQI_dogmeat_general_desc: "Назвав прозвище своим позором, Чжан Цзонгчан порицается даже среди своих товарищей по командованию из-за его полного пренебрежения к конгрессу и морали. Однако эти же черты привлекли к нему ужасную репутацию, к которой привлекается определенный класс последователей. Чжан открыто признает, что у него есть три неизвестных вида жен, неизвестное богатство и, что важнее всего, неизвестное число солдат. Эти качества делают Зонгчана непредсказуемыми, его истинные цели и потенциал трудно определить."

 SQI_honored_master: "Почетный мастер"
 SQI_honored_master_desc: "Изменив знаменитого Чжана Цзунчана с вершины горы Тай, Чжан Тяньран привлекает внимание мира к себе и к развращению Джинана внизу."

 SQI_qu_bodisattva: "Qu Bodhisattva"
