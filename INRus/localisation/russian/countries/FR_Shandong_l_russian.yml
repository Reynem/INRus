 SHA_warlord_army: "Военнослужащие армии"
 SHA_warlord_army_desc: "Мы пришли, чтобы положиться на армию Военачальника, чтобы сохранить наш контроль над Шаньдуном."
 SHA_warlord_army2: "Укрепленные военные бароны"
 SHA_warlord_army2_desc: "Мы временно успокаивали Военачальников, чьи армии мы полагаемся на власть над Шаньдуном."
 SHA_warlord_army3: "Военный кабинет"
 SHA_warlord_army3_desc: "Чу Юпу создал военный кабинет для оказания помощи в управлении Шаньдуном и умиротворении военных военачальников Востока."

