 SHA_social_liberal_party_long: "Общество Гийидао ( Гийидао )"
 SHA_market_liberal_party: "Higatetsu"
 SHA_market_liberal_party_long: "В 1924 году была создана железная дорога Ист Шаньдун в качестве средства, с помощью которого Япония могла обеспечить свое влияние на Шаньдун ."

 SHA_social_conservative_party: "Движение Четвертый мая"
 SHA_social_conservative_party_long: "Движение, сформировавшееся в конце Великой войны, остается весьма влиятельным группировкой в Шаньдуне под руководством своего лидера Фу Ссу-няна."

 SHA_paternal_autocrat_party: "Клика Чжунчан"
 SHA_paternal_autocrat_party_long: "Клика Цунчхан правит большинством Шаньдуна из внутреннего торгового центра Джинань. Это пролегает по железной дороге Шаньдун до Вайфанга и по главной дороге в Янтай. Клика управляется Цунчангом вместе с его верными ему сообщниками, включая Чжан Цзиньяо и Чжан Цзизхун. Зонгчангс действительно находится в колодцах вооруженных пережитков Революционной армии Шандонга, патрулирующей провинцию. Хотя технически они все еще соблюдают запрет на опиум, на практике Цунчанг использует железную дорогу, чтобы получить его поставки из Циндао."

 SHA_authoritarian_democrat_party: "Клик Шандонга"
 SHA_authoritarian_democrat_party_long: "Эта группа остается весьма влиятельной группой в провинции, даже после ухода Жили из провинции."

 SHA_national_populist_party: " "
