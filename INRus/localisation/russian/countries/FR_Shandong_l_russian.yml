 ##Ideas
 SHA_japanese_influence: "Влияние Японии"
 SHA_japanese_influence_desc: "После заключения Версальского договора японцы оказали большое влияние на провинцию Шаньдун, хотя первоначально она была очень ориентирована на экономику, японские лоббисты медленно вошли в состав местного правительства."
 SHA_bastard: "Ублюдок"
 SHA_bastard_desc: "Чжан Цзунчханг, названный его противниками как «Бастард», является очень спорной фигурой в Шаньдуне, его коррумпированная природа и невежество в управлении сделали многих в правительстве очень осторожными, что позволило многим из его противников, как в «Жилийско-присоединяющемся» «Шандонг Клике», так и в либеральном сознании «Четвёртое движение мая» расширить свое собственное влияние в правительстве."
 SHA_bastard2: "Ублюдок"
 SHA_bastard2_desc: "Чжан Цзунчханг, названный его противниками как «Бастард», является очень спорной фигурой в Шаньдуне, его коррумпированная природа и невежество в управлении сделали многих в правительстве очень осторожными, что позволило многим из его противников, как в «Жилийско-присоединяющемся» «Шандонг Клике», так и в либеральном сознании «Четвёртое движение мая» расширить свое собственное влияние в правительстве."
