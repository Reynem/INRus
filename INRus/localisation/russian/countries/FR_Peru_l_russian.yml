 #Peru decisions
 PRU_political_decisions: "Политические действия - Перу"
 PRU_form_PBC: "Формирование Перуо-Боливиянской конфедерации"
 PRU_form_PBC_desc: "Прошло столетие с тех пор, как Конфедерация первоначально упала от рук наших завидных соседей, которые, боясь нашей гегемонии, решили разорить нас на части."
 forming_PBC: "§H[Root. GetName] §! реформирует §H перуано-боливийскую Конфедерацию!"
 PRU_form_PBC_left: "Формирование Перуо-Боливиянского союза"
 PRU_form_PBC_left_desc: "Перу и Боливия с тех пор, как они стали разделять Испанскую империю, разделенные желаниями иностранных буржуазных политиков, наш народ является единственным, и в соответствии с международным принципом единой революции мы оказались в состоянии реализовать эту мечту. Давайте объединим рабочих Перу и Боливии в единый, социалистический, Перуо-боливийский союз!"
 forming_PBC_left: "§H[Root. GetName] §! реформирует §H перуано-боливийский союз §!"
 PRU_leticia_war_monument: "Построить падающий памятник войны Летисии"
 PRU_leticia_war_monument_desc: "Наша война с Колумбией была большой победой и честью для нашего народа, но также и с многочисленными потерями, и многие храбрые перувианцы дали нам все, чтобы добиться успеха."
 PRU_ask_to_join_argie: "Попроси меня присоединиться к аргентинской международной организации"
 PRU_ask_to_join_argie_desc: "По мере того, как мы начинаем строить новый революционный порядок в Перу, континент по-прежнему полон реакторов и врагов революции. Однако не все темно, поскольку Аргентина, возглавляющая революцию, создала международный союз за социализм в Южной Америке. Давайте попросим присоединиться к их фракциям."
 pru.41.t: "Перу хочет присоединиться к нам."
 pru.41.d: "Ведущий новое революционное социалистическое правительство, рабочие Перу взяли на себя власть над ним. Одно из решений, принятых их правительством, заключается в том, чтобы присоединиться к нашей социалистической фракции. Конечно, это похоже на то, что приветствовать их - это единственный естественный выбор."
 pru.41.a: "Работники Южной Америки, объединяйтесь!"
 pru.41.b: "Спасибо, но нет, спасибо."
 pru.42.t: "Аргентина отвергает нас."
 pru.42.d: "Ну, это отстой."
 pru.42.a: "Куча."
