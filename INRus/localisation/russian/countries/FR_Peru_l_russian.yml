 #events

 pru.1.t: "Перу в 1936 году"
 pru.1.d: "Много лет прошло с тех пор, как Великая война потрясла мир, многие империи и нации поднялись и разорились после этого всемирного события. Перу, однако, само по себе работает довольно хорошо. Внешне наши страны доказали свою ценность в Южной Америке после нашей славной победы против Колумбии всего два года назад, где храбрый генерал Санчес ведет нас. Теперь наша территория и люди в ней расширились, и все могут видеть, что мы начинаем расти. Внутри наше государство неуклонно развивается, наши многочисленные ресурсы и различные народы поддерживают нас. Однако слишком много лет наш народ потерял вкус демократии, когда президент Легия сделал свое государство своим игрушкой и разрушил нашу конституцию. Теперь, когда он оставил слабое состояние здоровья, генерал Санчес был совершенно прав, избран нашим новым лидером, и в то время как многие радикальные левые экстремисты выступают против его правления, так же, как он выступает против них, многие из нас надеются, что он восстановит нашу республику и поведет нашу нацию в пике."
 pru.1.a: "Мы твердо и счастливы за Союз."

 pru.2.t: "Конституционное дело"
 pru.2.d: "Несмотря на то, что диктатура закончилась и будущее вселяет надежду, недостатки в нашей правительственной системе все еще ощущаются и ощущаются. Внесенные Легией изменения сделали конституцию очень либеральной и устранили многие меры контроля за функционированием демократии, несмотря на то, что даже с этими изменениями он не боялся игнорировать ее, как он этого хотел. Теперь наш предшественник Санчес Серро должен сделать выбор в своих руках, будет ли он строить новую конституцию, основанную на сильной демократии и республике, которая действительно представляет народ перуанцев, или же он будет строить конституцию с сильной, централизованной властью, которую никогда не будут игнорировать, и обеспечит нам столь желанную стабильность, даже если потеряет смысл нашей республики?"
 pru.2.a: "Демократия Республики будет восстановлена."
 pru.2.b: "Перу действительно нуждается в сильном, законном правительстве на этот раз."

 pru.3.t: "Параллельные выборы"
 pru.3.d: "В рамках конституционных реформ нашей демократии были проведены новые выборы в салон с новой более представительной избирательной системой, многие партии, которые воспользуются этой возможностью, чтобы получить большинство и стать частью правительства."
 pru.3.a: "Консервативное движение &quot; Демократия Перуано &quot; , обещающее широкие социальные реформы с консервативными ценностями."
 pru.3.b: "Национальный фронт &quot; Демократия &quot; слева от центра, обещая новые гражданские свободы и примирительные усилия."
 pru.3.c: "Правящая партия &lt; &lt; Союз революционных сил &gt; &gt; , популярная в ходе недавних реформ в Санчесе, и успех Перу."
 pru.4.t: "Недовольство работников режимом"
 pru.4.d: "Многие из них являются лояльными перувианцами, которые с радостью поддерживают правление нашего президента над ними."lack of democracy" have been causing trouble. While these aren't news to us, a lot of workers on different areas of our country have risen in their support. Our society is resisting our rule."
 pru.4.a: "Эти проклятые колли..."
 pru.5.t: "Приостановление демократии"
 pru.5.d: "Наш президент пришел к окончательному выводу. Демократия была тем, что так долго возвращала республику, и желание к ней только разъединило наш народ. Решение ясное, началось постоянное приостановление демократии. Теперь наш лидер Луис Мигель Санчес Серро возглавит нашу страну с сильным законным правительством, без вмешательства демократии в наши твердые государственные институты, наконец, будет править страной только лучшим, лично выбранным нашим президентом, чтобы помочь ему в его управлении, чтобы помочь всей нации. И все же, несмотря на то, что многие приветствуют ее, многие, похоже, сомневаются в этом блестящем решении."
 pru.5.a: "Под постоянным правлением президента Санчеса Серро Перу всегда будет здорово."
 pru.6.t: "Демократическая оппозиция выступает против правительства"
 pru.6.d: "Наши действия не только беспокоили социалистические круги, поскольку лидеры различных демократических партий объединились, осудив решение правительства как неконституционное."
 pru.6.a: "И они не понимают, что они нам больше не нужны."
 pru.7.t: "Демократическая оппозиция мобилизует силы"
 pru.7.d: "Похоже, что"democratic opposition" still holds to the hope they can take the reins in our nation. While this is more than unlikely, that hasn't stopped them from trying, and tensions have spread as it seems many of them have been in recent contact with rival powers, likely trying to fund some kind of upstart movement."
 pru.7.a: "Может, нам стоит преподать им урок."
 pru.7.b: "Я уверена, что это ерунда."
 pru.8.t: "Угроза левых"
 pru.8.d: "Годы под Легией не принесли пользы нашей нации, так как воля бывшего президента была реализована во всех отношениях, и он превратил Перу в его личное достояние, но кто-то, кто извлек из этого выгоду, был левым, что в противоречии с так называемым диктатором президента, провозгласил свое желание освободить Перу от его тирании, но теперь, когда его нет, угроза все еще сохраняется, и хотя многие недоверия к нашему президенту, может быть, только он может спасти нас от разочаровывания."
 pru.8.a: "Мы должны объединиться в грядущем хаосе."
 pru.19.t: "Перу-колумбийская напряженность"
 pru.19.d: "Прошло несколько лет с момента окончания нашего конфликта с Колумбией, в то время как наша победа принесла славу и стабильность нашей нации, Колумбии не так повезло."
 pru.19.a: "Мы не сдадимся экстремистам."
 pru.20.d: "Диссиденты нашего националистического режима недавно начали расширять свою незаконную деятельность. Наши люди быстро узнали, что перувианцы поддерживают их. Сначала они захватили нашу землю, теперь это? Они должны заплатить за это преступление в нашей стране."
 pru.20.t: "Увеличение активности"
 pru.20.a: "Перу заплатит."
 pru.21.t: "Споры по поводу пастазы"
 pru.21.d: "На протяжении десятилетий наши притязания на Пастазу и Эквадор вступают в конфликт. Сейчас вновь усилилась напряженность, поскольку агрессивные поселения в зоне вызвали диалог между нашими дипломатами."
 pru.21.a: "Давайте сделаем им предложение, от которого они не могут отказаться, и попытаемся купить его."
 pru.21.b: "Давайте попросим их вежливо вернуть наши законные земли."
 pru.22.t: "Предложение Перу для организации &lt; &lt; Пастаза &gt; &gt;"
 pru.22.d: "В рамках своей политики экспансионистской экспансии Перу вновь начал проявлять амбиции в отношении нашего единого региона Пастаза, на этот раз они пытаются расширить свою территорию дипломатическим путем и представили довольно дешевое предложение купить у нас эту территорию."
 pru.22.a: "Похоже, это мудрая сделка."
 pru.22.b: "Честно говоря, это оскорбительно."
 pru.23.t: "Перу требует, чтобы мы передали Пастазу."
 pru.23.d: "В рамках своей перперспективной экспансионистской политики Перу вновь начал проявлять амбиции в отношении нашего единого региона Пастаза, и на этот раз они требуют, чтобы мы отказались от наших поселений и передали нашу законную территорию."
 pru.23.a: "Полагаю, у нас нет выбора."
 pru.23.b: "Плохая попытка"diplomacy"."
 pru.24.t: "Эквадор выполняет наши амбиции"
 pru.24.d: "Правительство Эквадора дало ответ, они согласились с нашими условиями. Провинция Пастаза, наша законная территория, теперь полностью принадлежит нам."
 pru.24.a: "Я люблю дипломатию."
 pru.25.t: "Эквадор отвергает наши условия"
 pru.25.d: "Поскольку официальный ответ был получен, мы удивлены тем, что Эквадор отверг наши условия."
 pru.25.a: "Как им хочется."
 pru.26.d: "Со времен Тихоокеанской войны десятилетия назад наша страна была опозорена Чили, когда она забрала наши южные провинции, хотя нам удалось вернуть Такну дипломатически, наша территория еще не завершена."
 pru.26.t: "Амбиции в отношении Арики"
 pru.26.a: "Предложить купить его."
 pru.26.b: "Рискни и попытайся использовать их слабость, требуй ее!"
 pru.27.t: "Перу предлагает купить Арику."
 pru.27.d: "Не забывая о старых конфликтах, даже после восстановления Такны, перувианцы теперь проявляют амбиции и над Арицей!"conflict" diplomatically, and knowing the economic difficulties we have been going through, have offered to buy Arica from us."
 pru.27.a: "Это может быть к лучшему."
 pru.27.b: "Честно говоря, это оскорбительно."
 pru.28.t: "Перу деманы мы сдаем Арику"
 pru.28.d: "Не забывая о старых конфликтах, даже после восстановления Такны, перувианцы теперь проявляют амбиции и над Арицей!"conflict" diplomatically, and confusing our chaos for weakness, have demanded we hand over Arica peacefully."
 pru.28.a: "Возможно, у нас нет выбора."
 pru.28.b: "Мы не попадемся на эти оскорбления."
 pru.29.t: "Чили выполняет наши амбиции"
 pru.29.d: "Чилийское правительство дало ответ, они согласились с нашими условиями."
 pru.29.a: "Я люблю дипломатию."
 pru.30.t: "Чили отвергает наши условия"
 pru.30.d: "Поскольку официальный ответ был получен, мы удивлены тем, что Чили отвергла наши условия."
 pru.30.a: "Как им хочется."
 pru.40.t: "Судьба Боливии"
 pru.40.d: "С падением боливийского правительства наши силы захватили свою территорию, и мы распространили наш контроль после войны, но сейчас пришло время решить, что будет Судьбой Боливии. Несмотря на все более тревожное количество недовольства на оккупированной земле, это может быть разумным шагом к созданию дружественного режима, безопасного под нашей защитой и контролем, для управления боливийцами. Некоторые считают, что прямое правление из Лимы может быть лучшей идеей."
 pru.40.a: "Освобождайте Боливию как дружественный режим."
 pru.40.b: "Давайте будем править ими напрямую."
 pru.50.t: "Рынок Крэш прибывает в Перу"
 pru.50.d: "Лондонский фондовый рынок шокировал мир, и вместе с ним, нашу экономику, все, кажется, перевернуто вверх ногами, так как нам нужно найти решение для этого быстро, мы не можем рисковать потерять внутреннюю стабильность."
 pru.50.a: "Черт."
 pru.60.t: "Протесты по мере того, как правительство начинает централизацию"
 pru.60.d: "Перу всегда стремился к стабильному, мощному правлению, поэтому это стало для нас неожиданностью, когда протестующие начали мобилизовываться в наших главных городах."tyrannic" and "stratocratic", these groups seem to be mainly unionist and syndicalist dissidents."
 pru.60.a: "Избавься от них."
 pru.60.b: "Пусть успокоятся."
 pru.61.t: "Союзники достигают согласия"
 pru.61.d: "Было достигнуто соглашение о долгосрочном плане действий с рядом активных профсоюзных лидеров. Это соглашение представляется многообещающим, и напряженность в нашем обществе, как представляется, уменьшается."
 pru.61.a: "Ура!"
 pru.62.t: ":: Недопущение мобилизации АПРА"
 pru.62.d: "По мере того, как экстремальные силы, движущиеся к радикализации низших классов, известных как АПРА, продолжают расширять свою повестку дня, мы с пользой узнали об организации этапов планирования предстоящих забастовок рабочих, которые очень сильно повлияют на нашу экономику."
 pru.62.a: "Разберись с ними с применением силы."
 pru.62.b: "Не двигайся по этому вопросу."

 pru.100.d: "По мере того, как наши войска оккупируют свою страну, кажется, что наши цели наконец-то достигнуты."
 pru.100.t: "Успех в достижении военных целей"
 pru.100.a: "Давайте возьмем то, зачем мы сюда пришли."
 pru.100.b: "Всё, что угодно."
 pru.101.d: "По мере того, как наши войска оккупируют свою страну, кажется, что наши цели наконец-то достигнуты."
