 PRU_gamaliel_churata: "Гамалиэль Чурата"
 #PRU_gamaliel_churata_leader_desc: "Гамалиэль Чурата, которого на самом деле зовут Артуро Пабло Перальта Миранда, родился в 1897 году в Пуно, Перу. &lt; &lt; Чурата &gt; &gt; создал в молодости несколько культурных групп, через которые он встретил Мануэля Гонсалеса Праду, Рауля Хайя де ла Торре, и, что важнее всего, Хосе Карлоса Мариатеги, который стал близким другом Чураты. &lt; &lt; Он был изгнан в Боливию в 1917 году, но вернулся в Перу в 1925 году, присоединившись к Мариатеги в Мокегуа в качестве первой группы индигенистов левого происхождения. &lt; &lt; Мариатеги &gt; &gt; , которая умерла в 1930 году в Чили, Чурата был назначен его другом в его умирающих желаниях лидером &lt; &lt; Френте Тупакамариста &gt; &gt; . &lt; &lt; В 1931 году он собрался вместе с Раулом Хайей де ла Торре и Альфредо Гонсалесом Прада в целях формирования Объединенного фронта, который привел к перу революции. &gt; &lt; &lt; &lt; &lt; &lt; &lt; &gt; &lt; &gt; &lt; &lt; &lt; &gt; &gt; &lt; &gt; &gt; &lt; &lt; &lt; &lt; &lt; &gt; &gt; &gt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; &gt; &lt; &lt; &lt; &lt; &lt; &gt; &lt; &gt; &lt; &gt; &lt; Чурат &gt; Чурат &lt; Чурат &lt; &lt; &lt; Чурат &lt; &lt; &lt;"

 PRU_victor_raul_haya_de_la_torre: "Виктор Рауль Хайя де ла Торре"
 # PRU_victor_raul_haya_de_la_torre_leader_desc: "Виктор Рауль Хайя де ла Торре родился в городе Трухильо, департамент Ла Либертад, Перу. Он подписался на «Факультад де Летрасского университета Трухильо», когда он закончил среднюю школу, но позже решил стать юристом в «Университете Сан-Маркос» в Лиме. Там он встретился с Мануэлем Гонсалесом Прада, чьи анархические мысли повлияли на молодого Рауля. Он присоединился к нескольким протестам против режима Легии, который решил избавиться от него, предоставив ему стипендию Франции. Однако этот шаг восторжествовал бы на Легии, так как революции в Европе повлияли бы на молодого Рауля и его друга Мариатеги на синдалистские идеалы. В 1924 году Нн Хее пошёл бы в Мексику на борьбу с ним, а другие перуанские синдикалистские ссылки сформировали бы «Алианскую народную революцию Америки» или «APRA». АПРА сосредоточилась на панамериканизме (как Раульхи назянском, который он поселил его трангонгонгонгонгонгом и 19."

 PRU_julio_alfredo_gonzalez_de_prada_y_verneuil: "Хулио Альфредо Гонсалес де Прада и Вернейл"
 # PRU_julio_alfredo_gonzalez_de_prada_y_verneuil_leader_desc: "В 1891 году в Париже, Франция, родился сын известного перуанского анархиста Мануэля Гонсалеса Прада, который окончил Университет Сан Маркоса в качестве холостяка в литературе в 1910 году, а позднее окончил его в качестве холостяка по специальности &quot; Юриспруденция &quot; , после чего получил докторскую степень по этой профессии. В 1919 году Прада стал интеллектуальным лидером недавно созданного &quot; Френта Армадо Обреро &quot; , который боролся за улучшение прав на работу в его наиболее умеренной форме и за откровенную революцию в его более радикальных членах. В 1931 году Легия принял решение направить армию для подавления движения, чтобы положить конец первому перуанскому эксперименту синдикалиста. Затем он решил временно уйти из общественной жизни, собрав вместе с другими анархистами в Перу до тех пор, пока неудавшееся восстание Трухильо не вынудило его отправиться в Чили."

 PRU_luis_antonio_eguiguren_escudero: "Луис Антонио Эгигурен Эскудеро"
 # PRU_luis_antonio_eguiguren_escudero_leader_desc: "Луис Антонио Эгигурен родился в 1887 году в маленьком городе Пиура, Перу, получил степень бакалавра в области литературы и юриспруденции в 1913 году и в области политических наук и администрации в 1914 году, в 1930 году стал мэром Лимы, но спустя год ушел в отставку после разногласий в отношении автономии министерства образования города и его разногласий в отношении автономного правления Бенавидеса. Он уехал в Эквадор в изгнании после смерти от радикальных членов УР только для того, чтобы вернуться после того, как Бенавидес показал, что хочет восстановить демократию в Перу, где он получил место в Социал-Демократе Партии. Теперь, когда он является президентом Перу, он сделает все возможное, чтобы принести мирную систему социального обеспечения в Перу, пытаясь, где это возможно, пойти на компромисс с АПРА и другими демократическими партиями."

 PRU_jorge_prado_y_ugarteche: "Хорхе Прадо и Угартехе"
 # PRU_jorge_prado_y_ugarteche_leader_desc: "Хорхе Прадо Угартехе родился в 1887 году в столице Перу Лиме, сын Мариано Игнасио Прадо, который дважды в своей жизни был президентом Перу, Хорхе изучал право в Университете Сан-Маркос с 1904 по 1909 год, а затем поступил в военную академию после окончания школы, став лейтенантом в 1914 году. Он присоединился к своим братьям в Гражданской партии Мариано Игнасио Прадо, где они помогли ему совершить государственный переворот, в результате которого был свергнут президент Биллингхерст. Позднее он стал заместителем президента провинции Дос-де-Майо, но был изгнан вместе со своими братьями за то, что он противостоял режиму Легии. После убийства Санчеса Серро Бенавидеса, который был другом в детстве Хорхе, он напомнил ему об изгнании, с тем чтобы помочь ему в его правлении. Хорхе начал реформу для освобождения политических заключенных и напомнил о политических изгнаниях, которые были наказаны Санчесом Серро и Легиасом. Однако Угартек был вынужден подать в отставку в связи с внутренним давлением, а Хосе дес-Рива Агю в свою новую десантную депрессу депрессию."

 PRU_manuel_vicente_villaran_godoy: "Мануэль Висенте Вильяран Годой"
 # PRU_manuel_vicente_villaran_godoy_leader_desc: "Мануэль Висенте Вильяран Годой родился в 1873 году в столице Перу Лиме, получил степень доктора юридических наук в 1895 году из "Universidad San Markos", стал преподавателем в том же университете и во многих случаях возвращался к своей образовательной роли во время своей политической карьеры. Он был назван "Minster of Justice, Cult and Information" во время первого режима президента Легии и стал активным членом перуанской политики до переворота Легии в 1919 году. Он был избран в качестве директора университета Сан-Маркос, но отказался от своей позиции в знак протеста против захвата Легией, и начал писать три манифеста, все из которых восхваляли юный боевой дух своих студентов и предупреждали об опасности, которая повлекла за собой то, что каудильо возглавил Перу. Он был изгнан в 1925 году, но вернулся в 1927 году, пытаясь отойти от политики. Во время правления Санчеса Серро, он принял участие в последующих конституционных реформах, хотя он и не защищал некоторые моменты, которые были подняты в новой конституции. Теперь он стал президентом Перу, он был изгнан в изгнании, но вернулся к психологическому, он вернулся к решению вопросов, с более рациональным подходом к решению проблем, пытаясь Пера."

 PRU_oscar_raimundo_benavides_larrea: "Оскар Раймундо Бенавидес Ларреа"
 # PRU_oscar_raimundo_benavides_larrea_leader_desc: "Оскар Раймундо Бенавидес Лареа родился в 1876 году в столице Перу Лиме, окончил военную школу в 1906 году и был направлен во Францию, чтобы принять участие в их маневрировании. По возвращении в Перу в 1910 году он был вовлечен в «Кампанью дель Какета», которая позволила ему пройти через ряды до того, как он стал начальником штаба в 1913 году. В 1914 году он присоединился к перевороту против президента Биллингхерста, став временным президентом до 1915 года, где он призвал к выборам после обеспечения стабильности. Затем Бенавидес был отправлен в Европу в качестве наблюдателя во время перевозки в Вельткриг, но ушел в отставку, когда Легия переворотила демократическое правительство. nneguía быстро отреагировала на возвращение Бенавидеса, заключив его в тюрьму и отправив вместе с другими политическими заключенными в изгнание. Однако Бенавидес сумел организовать успешную митию на судне, который перевез их, сбежав в Центральную Америку, где он поддерживал восстание Санчеса Серро и позднее играл важную роль в правительстве Санчеса Серро."

 PRU_jose_de_la_riva_aguero_y_osma: "Хосе де ла Рива Агуэро и Осма"
 # PRU_jose_de_la_riva_aguero_y_osma_leader_desc: "Внук первого перуанского президента Хосе де Рива Агюэро и Осма, который в 1911 году получил степень доктора юриспруденции, был внуком Хосе де Рива Агуэро и Санчес-Бокете. Его первый политический шаг состоял в том, чтобы написать статью, критикующую действительное европейское правительство в том же году, за которую он был арестован, и в связи с тем, что он стал первым студентом в истории Перу, который потребовал освобождения Агюэро. Агуэро был освобожден, где он стал учителем в Сан-Маркосе, но когда Легуа взял на себя управление правительством в 1919 году, Агюэро написал статью, в которой он выступил с критикой в защиту конституционного порядка в том же году, в связи с чем он был арестован, в результате чего его первейший в истории первенец по имени Перу, который был вынужден наблюдать за выздоровлением Европы из Велкриа, а также за синдикалистскими восстаниями. В этих обстоятельствах он встречался с диктором в 1927 году и Итало, как один раз в Европе."

 PRU_consejo_nacional: "Национальный совет"
 # PRU_consejo_nacional_leader_desc: "После смерти Агуэро, Революция Союза была ввергнута в хаос. Фракционализм начал разрушать некогда объединённый УР, многие из которых борются за власть, в первую очередь Луис Альберто Флорес Медина, генерал Урета Монтегермосо и Карлос Миро-Куэсада. До тех пор, пока не будет избран преемник Агуэро, совет будет вести Перу вперед, хотя и с многочисленными внутренними трудностями, пока этот вопрос не будет решен."

 PRU_pachacutec_ii: "Пачакутек II"
 # PRU_pachacutec_ii_leader_desc: "Рейнальдо Чукиванка Айюло Чокеуанка, более известный по его славному имени Пачакутек II, родился в 1914 году в Лампе, провинция Пуно, Перу. Сын Франсиско Чукиванки Аюло, который считался одним из потомков императора Инка, Хуайны Капач, он воспользовался популярностью своего отца, чтобы сплотить индейцев на свое дело. В 1908 году его отец закончил адвокатскую карьеру во Французском университете Арекипы, и он отправился в Пуно, Перу, где он начал бороться за лучшие права для коренных жителей и создал алфавит, в котором коренные жители могли писать аймара, кечуа и испанский язык, помогая местному населению повысить уровень грамотности, поскольку эти языки вступают в конфликт с латинским алфавитом. Рейнальдо был вовлечен во французские круги, и на него повлияли писания Чарльза Маурраса."

