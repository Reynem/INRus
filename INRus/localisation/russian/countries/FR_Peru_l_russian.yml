 PRU_black_wednesday: "Последствия столкновения на рынке"
 PRU_black_wednesday_desc: "Лондонский фондовый рынок разбился, а вместе с ним и нашу ориентированную на экспорт экономику."
 PRU_black_wednesday1: "Выход из кризиса рынка"
 PRU_black_wednesday1_desc: "Мы делаем все, что в наших силах, чтобы восстановиться."
 PRU_rising_revolution: "Возрождение революции"
 PRU_rising_revolution_desc: "Как показало коррумпированное правительство, наступила смерть олигархической республики, и вместе с ней перуанская Социалистическая Республика восстала в революции!"
 PRU_gritty_revolt: "Революционная сетка"
 PRU_gritty_revolt_desc: "Все вместе в деле рабочих, самый низкий из людей присоединился в высоком духе, и вместе они выдержат все, что реакционеры бросают в них."
 PRU_intelligence_council: "Народный разведывательный совет"
 PRU_intelligence_council_desc: "Защита от реакционеров должна быть не только на фронте, но и на внутренней территории."
 PRU_agrarian_reform: "Аграрная реформа"
 PRU_agrarian_reform_desc: "С преимущественно аграрной нацией реформа и перераспределение сельскохозяйственной земли имеет важное значение для улучшения жизни крестьян."
 PRU_revolutionary_spirit: "Революционный дух"
 PRU_revolutionary_spirit_desc: "Как показало коррумпированное правительство, наступила смерть олигархической республики, и вместе с ней перуанская Социалистическая Республика восстала в революции!"
