 pru.1337.t: "Социалистическое восстание"
 pru.1337.d: "Как и ожидалось, реакция на приостановление демократии в Перу была довольно противоречивой, и АПРА использовала ее в своих интересах, объявив о открытом восстании против нашего президента."
 pru.1337.a: "Ужасно трайдорес!"
 pru.1337.b: "Революционеры захватывают Лиму."
 pru.1338.t: "Вут"
 pru.1338.d: "Никто не прочтёт это."
 pru.1338.a: "Не смей повесить это на реддит."
 pru.1339.t: "Возрастают силы реагирования"
 pru.1339.d: "Когда революционеры захватывают Лиму, а председатель Хайя де ла Торре возглавляет рождение социалистической республики, реакционеры все еще хотят избавиться от нас."
 pru.1339.a: "Арриба ла Revolución!"
 #focus
 PRU_peru_in_1936: "Перу в 1936 году"
 PRU_peru_in_1936_desc: "Наша страна видела хорошие и плохие моменты в своей истории, в то время как в настоящее время мы, похоже, делаем добро, будущее все еще остается неопределенным."
 PRU_repairing_the_constitution: "Ремонт Конституции"
 PRU_repairing_the_constitution_desc: "С тех пор, как президент Легия играл с нашим государственным аппаратом, как ему было угодно, наша конституция и состояние закона были нарушены."
 PRU_further_democratization: "Дальнейшая демократизация"
 PRU_further_democratization_desc: "Президент Санчес Серро решил сосредоточиться на исправлении недостатков в нашей конституции, которые нарушают демократическое правление и подрывают представительство нашей нации в народной воле."
 PRU_give_more_power_to_the_people: "Придай больше силы народу"
 PRU_give_more_power_to_the_people_desc: "Наша нынешняя система едва представляет наш народ и поддерживает республику в слабом, разобщенном государстве."
 PRU_defend_democratic_rule: "Защита демократического правления"
 PRU_defend_democratic_rule_desc: "Хотя мы знаем, что общество нуждается в демократии для того, чтобы она приносила пользу нашим цитизиенам, не все считают то же самое."
 PRU_what_peru_wants: "Чего хочет Перу"
 PRU_what_peru_wants_desc: "Коллективная воля Перу долгое время игнорировалась, поскольку власть, которая нас властвовала, молчала о желаниях народа."
 PRU_reform_military_high_command: "Военное высшее командование"
 PRU_reform_military_high_command_desc: "Наши военные принесли славу нашей нации и мужественно защищали народ Перу, однако многие из высокопоставленных членов нашей армии придерживаются реакционных и ретроградных идей, которые только повредят нашему нынешнему пути, давайте реформируем военное командование, чтобы уменьшить их влияние на нашу страну."
 PRU_together_for_progress: "Совместные усилия во имя прогресса"
 PRU_together_for_progress_desc: "Как никогда ранее, когда речь заходит о последних событиях, Перу скатывается назад, однако теперь мы вместе сосредоточимся на усилиях по достижению прогресса."
 PRU_trust_in_the_people: "Доверься людям"
 PRU_trust_in_the_people_desc: "Мы не можем ожидать, что перуанцы доверят нам, если мы не можем доверять им, пусть наша связь становится сильнее, когда начинается новая эра доверия между правительством и народом Перу."
 PRU_the_new_constitution: "Новая конституция"
 PRU_the_new_constitution_desc: "Мы оказали помощь в проведении реформы нашей демократии по мере того, как новая конституция стала прочной как вершина демократического прогресса и единства в Южной Америке, и народ перуанцев больше не будет выступать за коррумпированную тиранию."
 PRU_give_more_power_to_the_army: "Дать больше власти армии"
 PRU_give_more_power_to_the_army_desc: "Именно армия выступает за Перу, принося ему славу и защищая его от своих многочисленных врагов, в то время как коррумпированные политики и иностранные силы хотели бы иметь право голоса, правда в том, что нам нужно влияние военных, направляющих нас."
 PRU_ensure_rule_of_law: "Обеспечение верховенства права"
 PRU_ensure_rule_of_law_desc: "Слабая конституция, которую Легия оставила нам, вызвала большие неудачи в нашей системе правопорядка, зачем людям уважать наше правление, если конституция не уважает волю правительства узнать лучше?"
 PRU_establish_peruvian_security_committee: "Создание перуанского комитета безопасности"
 PRU_establish_peruvian_security_committee_desc: "Слабое правление слишком долго мучило нас и держало нашу страну в небезопасном и хаотичном положении, даже в самые лучшие моменты, сейчас, при поддержке наших преданных вооруженных сил, мы можем создать комитет безопасности, который будет направлять наше общество и поддерживать наше правление."
 PRU_what_peru_needs: "Что нужно Перу"
 PRU_what_peru_needs_desc: "В то время как многие обещания демократии, благополучия и свобод привлекают людей, люди в целом запутаны, и кто может винить их, в самом деле? В конце концов, десятилетия коррумпированного либерального правления никому не приносят пользы. Вот почему мы должны дать Перу то, в чем он действительно нуждается, сильное центральное правительство, которое ведет его к правильному пути."
 PRU_national_investing: "Перуанское национальное инвестирование"
 PRU_national_investing_desc: "Предыдущее правительство мало потратило на то, чтобы принести пользу Перу, и больше на то, чтобы делать то, что ему понравится."
 PRU_trust_in_our_leaders: "Доверься нашим лидерам"
 PRU_trust_in_our_leaders_desc: "Безрассудное правление прошлого оставило людей неспособными доверять своим лидерам, считая их эгоистичными, коррумпированными или просто некомпетентными. Мы не можем позволить этому недоверию причинить нам вред, мы должны быть твердыми, пока мы покажем Перу, что мы можем вести его лучше, чем кто-либо другой."
 PRU_suspend_democracy: "Прервать демократию"
 PRU_suspend_democracy_desc: "Фарс демократического правления в Республике прошёл слишком долго, надежды на демократию и недостатки системы лишь привели Перу в прошлом, теперь, когда мы сильные и умные, выбор ясен, мы должны навсегда приостановить демократию в Перу, ради собственного благополучия."
 PRU_what_we_will_sacrifice: "Что мы пожертвуем?"
 PRU_what_we_will_sacrifice_desc: "У нас впереди мрачные времена, и когда мы боремся за выживание, наша нация должна спросить себя: что мы пожертвуем для Перу?"
 PRU_further_centralization: "Дальнейшая централизация"
 PRU_further_centralization_desc: "Президент Санчес Серро принял решение о том, что нерегулируемые свободы, которые являются ошибочным пожертвованием, сдерживают нашу нацию, и сильная централизация власти действительно приведет Перу к прогрессу."
 PRU_our_economic_policy: "Наша экономическая политика"
 PRU_our_economic_policy_desc: "Перу является великой страной, располагающей обширными ресурсами для работы с разнообразным народом и для того, чтобы построить нашу экономику, недавний успех нашей страны означает, что мы должны обновить нашу старую экономическую политику, с тем чтобы лучше воспользоваться нашим нынешним положением."
 PRU_extraction_emphasis: "Акцент на добыче"
 PRU_extraction_emphasis_desc: "Мы сидим на обширной земле, наполненной ресурсами, которые долгое время служили нуждам нашего народа, и сосредотачивая внимание на их добыче, также могла бы стать частью того, что необходимо нашей экономике для дальнейшего развития."
 PRU_fostering_peruvian_enterprise: "Укрепление перуанского предпринимательства"
 PRU_fostering_peruvian_enterprise_desc: "Частные предприятия, а также национальная капитализация на свободном рынке привели многие страны к экономическому успеху, и поэтому мы должны поощрять и поддерживать перуанское предпринимательство, с тем чтобы оно привело нас к успеху."
 PRU_building_up_infrastructure: "Создание инфраструктуры"
 PRU_building_up_infrastructure_desc: "Мы должны инвестировать плоды нашего труда в улучшение нашей страны, инфраструктура может быть хорошим началом, наша земля велика и полна дорог, которые еще предстоит построить."
 PRU_building_up_civilian_economy: "Укрепление гражданской экономики"
 PRU_building_up_civilian_economy_desc: "Наша страна не может вечно жить за счет сельского хозяйства и добычи полезных ископаемых, индустриализация даст нам большую свободу от зависимости от мирового рынка для многих из наших потребностей, особенно в этот новый технологический век, и повысит наше региональное влияние."
 PRU_costa_investing_desc: ":: Всё, что я знаю."costa", or coast, is one of the three geographic regions of our country, home to big cities and rich in colonial culture, investing in this rich area is essential for our progress."
 PRU_costa_investing: "Коста Инвестирование"
 PRU_cierra_investing: "Инвестирование в Сьерра"
 PRU_cierra_investing_desc: ":: Всё, что я знаю."sierra", or mountain range, is one of the three geographic regions of our country, splitting our country as its heights divide and give shape to our fertile lands, it is home to rich and valuable natural resources as well as the wondrous traditions of andean culture, putting our efforts into developing this zone are required for Perú to succeed."
 PRU_selva_investing: "Инвестирование в Сельву"
 PRU_selva_investing_desc: ":: Всё, что я знаю."Selva", or jungle, is one of the three geographic regions of our country, the most remote and scarcely inhabited one, it is as well one of great beauty and richness, not in resources or economy, but its people are diverse and interesting, as well as its ecology is nowhere else to be found, the Amazonas itself brings life to this region, which we must care for, as part of our future."
 PRU_resource_seeking: "Поиск ресурсов"
 PRU_resource_seeking_desc: "Какими бы плодотворными ни были наши земли, не все из них легко захватить, мы должны использовать новые ресурсы, чтобы найти новые источники богатства для нашей страны."
 PRU_military_build_up: "Военное строительство"
 PRU_military_build_up_desc: "Несмотря на то, что наша ситуация может показаться выгодной и позитивной, многие из нас с тревогой планируют лишить нас успеха, мы должны защищать нашу страну и готовиться к тому, что от нас требует Перу."
 PRU_research_efforts: "Исследовательская деятельность"
 PRU_research_efforts_desc: "Новые технологии и технологии распространяются по всему миру по мере того, как ученые достигают новой эры развития и улучшения для общества."
 PRU_army_direction: "Армейское руководство"
 PRU_army_direction_desc: "В последнее время наши вооруженные силы оказывали помощь Перу и неоднократно приносили ему славу."
 PRU_the_tried_and_tested: "Испытанные и испытанные"
 PRU_the_tried_and_tested_desc: "Использование умных планов сражения и опора на наших благородных солдат ведут нас к славе в нашей предыдущей войне, давайте будем верными тому, что сработало для нас, и новаторством."
 PRU_a_new_structure_desc: "Мы не можем оставаться в прошлом, чтобы продолжить свои победы и оставаться на вершине, мы должны всегда разрабатывать новые стратегии, которые лучше подходят для оксонации."
 PRU_a_new_structure: "Новая структура"
 PRU_arms_modernization: "Модернизация вооружений"
 PRU_arms_modernization_desc: "Хорошо оснащенная армия всегда является более выгодной среди равных оппонентов, давайте сведем к минимуму те ситуации, когда мы не любим переоснащать наше пехотное оружие."
 PRU_artillery_updates: "Обновление артиллерии"
 PRU_artillery_updates_desc: "Битвы не определяются в одиночку людьми с оружием, важным фактором являются люди с большим оружием!"
 PRU_mobile_divisions: "Мобильные отделы"
 PRU_mobile_divisions_desc: "С обширной и обширной землей для защиты, нам нужна мобильность, которая выводит наши разногласия на фронт, и чтобы быть в состоянии держать любого врага. Давайте вкладывать средства в наши моторные подразделения."
 PRU_mechanized_masses_desc: "Моторизованных армий сейчас недостаточно, мы должны поддержать механизированные подразделения, которые возьмут поле боя под контроль, чтобы действительно взять победу на войне."
 PRU_mechanized_masses: "Механизированная масса"
 PRU_bring_in_the_tanks: "Принесите танки"
 PRU_bring_in_the_tanks_desc: "Мы должны заполнить наши ряды людей из стали, неудержимой и недвижимой."
 PRU_reinforce_our_men_desc: "Дополнительные запасы, которые убедятся, что у наших людей нет всего, что им нужно, необходимы, так как крошечный фактор может решить исход боя."
 PRU_reinforce_our_men: "Укрепляйте наших людей"
 PRU_extend_our_reach: "Расширить наши возможности"
 PRU_extend_our_reach_desc: "Битвы будущего не будут сражаться на суше, они будут сражаться на воде, на небе, на самых высоких вершинах и в самых темных джунглях, мы должны подготовить наших людей к любым конфликтам, с которыми они должны столкнуться."
 PRU_keeping_up_to_date: "Оставайтесь в курсе событий"
 PRU_keeping_up_to_date_desc: "Разрабатывая новые технологии и выбирая новые пути для нашей страны, мы чувствуем, что никогда не должны отставать и мы должны полностью следовать по пути, который мы выбрали для себя на поле боя."
 PRU_further_renovations: "Дальнейшие ремонтные работы"
 PRU_further_renovations_desc: "Как бы то ни было, мы всегда должны искать новые пути улучшения, а если нет, то сами изобретайте новые улучшения, чтобы оказаться на вершине пищевой цепи."
 PRU_marine_strategy: "Морская стратегия"
 PRU_building_up_bases: "Строительство больших портов"
 PRU_building_up_bases_desc: "Расширенные порты позволят нашим военно-морским силам расположиться шире, расширяя наш охват через Тихий океан."
 PRU_building_up_docks: "Расширение докьярдов Каллао"
 PRU_building_up_docks_desc: "С тех пор как наш любимый президент Рамон Кастильо основал их почти 100 лет назад, доки Каллао хорошо служили нашей стране, Перу."
 PRU_issues_of_our_own: "Наши собственные проблемы"
 PRU_issues_of_our_own_desc: "Как бы мы ни были сильны, социальные и политические проблемы нашей страны могут быть отложены только надолго."
 PRU_threat_of_insurrection: "Угроза восстания"
 PRU_threat_of_insurrection_desc: "По мере того как наше общество разваливается, создается впечатление, что возникла угроза восстания со стороны самых радикальных членов нашего общества."
 PRU_battleship_effort: "Боевой корабль &lt; &lt; Эффорт &gt; &gt;"
 PRU_carrier_capacity: "Мощность перевозчика"
 PRU_destroy_our_enemies: "Уничтожить наших врагов"
 PRU_cruising_for_bruising: "Крылья для брейзинга"
 PRU_under_the_waves: "Под волнами"
 PRU_sea_control: "Морской контроль"
 PRU_battleship_attempt: "Боевые корабли &lt; &lt; Пролетариата &gt; &gt;"
 PRU_carrier_attempt: "Товарищ перевозчика"
 PRU_destroy_attempt: "Уничтожить реакционеров"
 PRU_cruising_attempt: "Круизеры для трудящихся"
 PRU_under_attempt: "Социалистические подводные лодки"
 PRU_sea_attempt: "Народное море"
 PRU_peoples_airforce: "Народные военно-воздушные силы"
 PRU_peoples_airforce_desc: "С подъемом нашей социалистической республики мы должны подготовить вооруженные силы к защите революции."
 PRU_strategies_of_the_skies: "Стратегии в небе"
 PRU_protecting_the_land: "Защита земли"
 PRU_housing_our_weapons: "Жилье нашего оружия"
 PRU_destruction_strategy: "Стратегия уничтожения"
 PRU_air_support_incoming: "Воздушная поддержка"
 PRU_naval_synergy: "Синергия военно-морских сил"
 PRU_fighting_for_the_workers: "Борьба за трудящихся"
 PRU_modernized_doctrines: "Модернизированные доктрины"
 PRU_the_proletariat_airs: "Воздух пролетариата"
 PRU_lessons_from_our_war_with_colombia: "Уроки нашей войны с Колумбией"
 PRU_lessons_from_our_war_with_colombia_desc: "С большим акцентом на воздушные бои и бомбардировки, формирующие стратегии войны, мы многому научились и должны использовать их."
 PRU_our_airborne_strategy: "Наша авиастратегия"
 PRU_shoot_them_down: "Пристрели их."
 PRU_preparing_our_wings: "Подготовка крыльев"
 PRU_flying_tactics: "Летающие тактики"
 PRU_fighter_squadrons: "Боевые отряды"
 PRU_bombing_units: "Бомбовые подразделения"
 PRU_seashore_strike: "Морской удар"
 PRU_continual_improvement: "Непрерывное улучшение"
 PRU_dominating_the_winds: "Доминирование ветра"
 PRU_south_american_matters: "Южноамериканские вопросы"
 PRU_south_american_matters_desc: "Перу не является островом в этом мире, мы окружены соседями, и поэтому мы должны идти в ногу с тем, что происходит в Южной Америке."
 PRU_colombian_tension: "Напряженность в Колумбии"
 PRU_colombian_tension_desc: "По мере того, как агрессивное колумбийское правительство пытается разогреть ситуацию между нами, мы должны действовать осторожно."
 PRU_colombian_dissidents: "Диссиденты в Колумбии"
 PRU_colombian_dissidents_desc: "Хотя многие являются последователями правительства Леопардо, многие колумбийцы хотят мира вместо этого, давайте спонсируем этих диссидентов своему правительству, в надежде, что это ослабит их."
 PRU_stop_the_extremists: "Остановить экстремистов"
 PRU_stop_the_extremists_desc: "Не только Перу, но и вся южная Америка находится под угрозой со стороны националистов Леопардо и их экспансионистских мечтаний. &lt; &lt; Перу &gt; &gt; должна встать и остановить их, пока не стало слишком поздно."
 PRU_pastaza_dispute_desc: "В последнее время возникло много напряженности, поскольку как Эквадор, так и мы расширяем поселения в Пастазе, в то время как земля, безусловно, является нашей по праву, мы должны стремиться к дипломатическому подходу при этом."
 PRU_pastaza_dispute: "Спор с Пастазой"
 PRU_push_the_claims: "Подтверждаем наши претензии"
 PRU_push_the_claims_desc: "Дипломатия провалилась, и теперь спор Пастазы должен быть урегулирован на поле боя."
 PRU_lower_the_tensions: "Снизить напряжение"
 PRU_lower_the_tensions_desc: "Хотя у нас, возможно, есть претензии в регионе, мы удовлетворены нашим нынешним территориальным положением и не хотим рисковать конфликтом, скорее, дружба с Эквадором может быть полезной для нас."
 PRU_go_for_ecuador: "Пропавшая куска"
 PRU_go_for_ecuador_desc: "Наш режим определил наилучший курс действий для Перу с геополитической точки зрения, это еще больше расширить нашу территориальную позицию, сейчас, когда мы находимся в пиковом состоянии для этого. Давайте ударим Эквадор, поскольку наши претензии в Пастазе слишком долго ждали, чтобы мы смогли принять их."
 PRU_arican_ambitions: "Arican Ambitions ( &lt; &lt; Африканские аномалии &gt; &gt; )"
 PRU_arican_ambitions_desc: "Десятилетия назад мы потеряли южные провинции нашей страны, поскольку Такна и Арика были потеряны враждующим чилианам."
 PRU_push_for_arica: "Тужься к Арике"
 PRU_push_for_arica_desc: "Дипломатические меры оказались безуспешными, теперь наши требования должны быть приняты силой на поле боя."
 PRU_renew_friendship_treaty: "Возобновление договора о дружбе"
 PRU_renew_friendship_treaty_desc: "Хотя наши дипломатические отношения на протяжении многих лет, возможно, и колебались, дипломатически, у нас нет причин выступать против Чили, давайте возобновим наш прошлый договор о дружбе и забудем про прошлую ненависть."
 PRU_strike_for_arica: "&lt; &lt; Удар по Арике &gt; &gt;"
 PRU_strike_for_arica_desc: "Это было решено, мы сейчас стоим сильнее чилиан, наша давно потерянная провинция Арика может быть вновь захвачена, и вместе с этим Перу будет на шаг ближе к завершению."
 PRU_extremism_in_bolivia: "Экстремизм в Боливии"
 PRU_extremism_in_bolivia_desc: "Нам грустно слышать, что экстремальные идеологии захватили наших боливийских братьев, мы не можем это терпеть, мы должны осудить эти нарушения сейчас."
 PRU_save_the_bolivians: "Спасите боливийцев"
 PRU_save_the_bolivians_desc: "Пора Перу выступить против экстремизма и вмешаться в Боливию, и мы должны сделать это, чтобы защитить наших братьев и спасти их от этой ситуации."
 PRU_latest_updates: "Последние обновления"
 PRU_latest_updates_desc: "Новые экспериментальные технологии появились в настоящее время, мы должны обновить их и не отставать от них."
 PRU_propelled_technology: "Запрещенные технологии"
 PRU_propelled_technology_desc: "Среди наших модернизированных усилий могут быть и новые технологии, которые могут быть полезными во всем мире."
 PRU_establishing_our_hold: "Установление нашей позиции"
 PRU_establishing_our_hold_desc: "Закрепляя свою геополитическую позицию, мы должны еще больше расширить наш контроль над нашими пограничными территориями."
 PRU_integrating_the_amazons: "Интеграция Амазонок"
 PRU_integrating_the_amazons_desc: "Северные амазоны являются территориями, которые мы одержали над Колумбией несколько лет назад, хотя их население ограничено, они, тем не менее, еще не вошли в наше национальное ядро."
 PRU_building_the_amazons: "Строительство Амазонских островов"
 PRU_building_the_amazons_desc: "Давайте вкладывать средства в инфраструктуру, которая связывает наше национальное ядро с амазонами."
 PRU_integrating_pastaza: "Интеграция Пастазы"
 PRU_integrating_pastaza_desc: "Поскольку мы недавно обеспечили наш полный контроль над территорией Пастазы, мы должны сделать все возможное для того, чтобы интегрировать ее в наше национальное ядро."
 PRU_building_pastaza: "Созидание Пастазы"
 PRU_building_pastaza_desc: "Давайте вкладывать средства в инфраструктуру, которая связывает наше национальное ядро с Пастазой."
 PRU_integrating_arica: "Интеграция &lt; &lt; Арики &gt; &gt;"
 PRU_integrating_arica_desc: "Поскольку мы недавно обеспечили наш полный контроль над территорией Арики, мы должны сделать все возможное для того, чтобы интегрировать ее в наше национальное ядро."
 PRU_building_arica: "Наращивать Арику"
 PRU_building_arica_desc: "Давайте вкладывать средства в инфраструктуру, которая связывает наше национальное ядро с Арицей."
 PRU_respect_in_diversity: "Уважение разнообразия"
 PRU_respect_in_diversity_desc: "У сильного демократического общества есть разнообразие в мышлении и мнениях, формирующих его путь."
 PRU_together_building_a_future_desc: "Именно благодаря нашим собственным усилиям по повышению благосостояния нашего народа и его жизни мы вместе созидаем будущее."
 PRU_together_building_a_future: "Вместе построим будущее."
 PRU_social_pact: "Социальный пакт"
 PRU_social_pact_desc: "Для того чтобы наше многообразное общество могло работать надлежащим образом, необходим национальный социальный пакт между правительством и нашим народом, который должен быть самым низким из классов."
 PRU_crush_rebellions: "Противоречия"
 PRU_crush_rebellions_desc: "Давай остановим этих диссидентов и покажем, что народ не потерпит восстания."
 PRU_proud_protectionism_desc: "Закрой экономику, перестань открываться."
 PRU_proud_protectionism: "Гордый протекционизм"
 PRU_gain_the_favor_of_the_senate: "Укрепить работу сената"
 PRU_gain_the_favor_of_the_senate_desc: "Реформы, которые мы проводим, не нравятся всем, но мы можем убедить сенат поддержать нас."
 PRU_recovery_efforts: "Усилия по восстановлению"
 PRU_recovery_efforts_desc: "Поскольку кризис привел к борьбе нашей экономики, мы продвинулись вперед в ее восстановлении."
 PRU_full_recovery: "Полное возмещение"
 PRU_full_recovery_desc: "Мы приняли меры по надлежащему восстановлению нашей экономики и возвращению в свои ноги."
 PRU_across_our_lands: "По всей нашей земле"
 PRU_across_our_lands_desc: "Наша география обширна и величественна, но это ограничивает связь с нашим народом. Давайте работать над созданием новых мостов."
 PRU_work_with_the_unions: "Работа с профсоюзами"
 PRU_work_with_the_unions_desc: "Профсоюзы трудящихся очень активны в политическом отношении, и для того, чтобы избежать конфронтации, нам нужно продолжать работать с ними."
 PRU_establish_national_security_corps: "Создание Национального корпуса безопасности"
 PRU_establish_national_security_corps_desc: "Поскольку внутренние диссиденты угрожают нашей стране, Перу должен продемонстрировать свою силу, создав храбрые подразделения для обеспечения стабильности нашего режима."
 PRU_academic_investments: "Академические инвестиции"
 PRU_academic_investments_desc: "Мы должны быть сильной академической силой, дающей нам региональные преимущества."
 PRU_agrarian_reform: "Аграрная реформа"
 PRU_agrarian_reform_desc: "Мы перераспределили земли и разработали общинную сельскохозяйственную программу для нашей экономики и более низких классов."
 PRU_social_reform: "Социальная помощь"
 PRU_social_reform_desc: "Мы осуществляем социалистическую программу по преодолению социально-экономического неравенства в нашей стране."
 PRU_peruvian_revolution: "Перуанская революция"
 PRU_peruvian_revolution_desc: "Мы, работники Перу, поднялись и никогда не сдадимся в нашей борьбе!"
 PRU_the_peoples_council: "Создать Народный разведывательный совет"
 PRU_the_peoples_council_desc: "Защита от реакционеров должна быть не только на фронте, но и на внутренней территории."
 PRU_defense_socialist: "Защита революции"
 PRU_defense_socialist_desc: "Мы сделаем все, чтобы защитить революцию и освободить рабочих от олигархических цепей."
 PRU_all_terrain_revolution: "Всеуровневая революция"
 PRU_all_terrain_revolution_desc: "Чтобы принести Революцию в мир, земля не единственная передняя линия, мы должны расшириться до моря и неба как поле боя для наших революционеров."
 PRU_side_equipment: "Боковое вспомогательное оборудование"
 PRU_side_equipment_desc: "На поле боя нужны не только оружие, но и все виды вспомогательных средств, которые необходимы нашим храбрым войскам для ведения боевых действий."
 PRU_glaciers_of_the_people: "Просвещение народа"
 PRU_glaciers_of_the_people_desc: "Сильные танки, медленные, как ледники, которые все еще невозможно остановить на фронте, это то, что нужно нашему народу для того, чтобы выйти из тупика против реакционеров."
 PRU_mechanized_heroes: "Механизированные герои"
 PRU_mechanized_heroes_desc: "Механизированные машины - это то преимущество, которое нам нужно, чтобы правильно двигаться вперед и раздавить врагов рабочих."
 PRU_vehicles_of_the_proletariat: "Транспортные средства &quot; Пролетариата &quot;"
 PRU_vehicles_of_the_proletariat_desc: "Моторизованные транспортные средства обеспечивают большие стратегические преимущества на фронтальных линиях, и они могут быть той скоростью, которая нам нужна для распространения революции."
 PRU_peoples_fire_support: "Народная пожарная поддержка"
 PRU_peoples_fire_support_desc: "Профессиональные артиллерийские подразделения разрушительны в бою, нам нужно подготовить артиллерию, чтобы обеспечить пожарную поддержку людям и помочь в нашей борьбе."
 PRU_workers_weapons: "Оружие рабочих"
 PRU_workers_weapons_desc: "Старое и устаревшее оружие может оказаться в наших руках в результате революции, однако, если мы хотим добиться победы для народа, необходимо обновить и обновить новейшие разработки."
 PRU_the_pride_of_the_workers: "Военнослужащие рабочих"
 PRU_the_pride_of_the_workers_desc: "Отважные люди, которые борются за все, что мы отстаиваем, это подлинная гордость народа, и солдаты рабочих, которых мы всегда будем чтить."
 PRU_the_loyal_defense: "Защита народа"
 PRU_the_loyal_defense_desc: "Времена могут стать ужасными, но мы никогда не откажемся и не позволим нашим врагам вернуть жестокости капитализма к народу."
 PRU_the_brave_spirit: "Твердое обвинение"
 PRU_the_brave_spirit_desc: "С храбростью люди со всего Перу присоединяются к нашей борьбе, понимая, что они должны помочь нам победить жестоких врагов, которые планируют уничтожить нашу революцию."
 PRU_the_peoples_guard: "Народная гвардия"
 PRU_the_peoples_guard_desc: "Организация наших вооруженных сил, мы понимаем, что для успеха нашей социалистической республике нужна хорошо обученная, профессиональная и умелая Народная гвардия, армия, специально созданная для защиты революции."
 PRU_revolutionary_grit: "Революционная сетка"
 PRU_revolutionary_grit_desc: "Все вместе в деле рабочих, самый низкий из людей присоединился в высоком духе, и вместе они выдержат все, что реакционеры бросают в них."
 PRU_the_militias_might: "Сильные ополчения"
 PRU_the_militias_might_desc: "Бесстрашние люди, восставшие откуда бы то ни было для борьбы за наше дело, храбрые ополченцы, должны стать основой для наших вооруженных сил, поскольку они действительно воплощают революционные идеалы, которых мы придерживаемся."
 PRU_the_workers_army: "Армия трудящихся"
 PRU_the_workers_army_desc: "Когда мы задумали революцию, а не только внутренний, мир, мы поняли, что нам нужно создать и усовершенствовать организованную армию для борьбы за рабочих повсюду."
 PRU_the_will_to_succeed: "Желание исполниться"
 PRU_the_will_to_succeed_desc: "Народ никогда не сдастся и никогда не согласится на угнетение олигархии, ни сейчас, ни никогда!"
 PRU_rallying_revolutionaries: "Революционеры"
 PRU_rallying_revolutionaries_desc: "Мы не можем сражаться в одиночку, мы должны сплотить тех, кто желает революции, как мы это делаем, чтобы присоединиться к нашей революции и подняться!"
 PRU_the_revolutionary_economy: "Революционная экономика"
 PRU_the_revolutionary_economy_desc: "По мере того как мы начинаем нашу борьбу, мы понимаем, что будет необходима сильная, социалистическая экономика, способная приносить пользу нашим рабочим, так же, как и обеспечение в ходе войны."
 PRU_industrial_revolution: "Промышленная революция"
 PRU_industrial_revolution_desc: "По мере того как революция захватывает все аспекты нашей страны, кажется, что наши промышленные разработки и технологии являются ее естественной частью."
 PRU_state_industry: "Государственная промышленность"
 PRU_state_industry_desc: "По мере того, как наша молодая социалистическая республика начинает определять свою переходную экономическую политику, вмешательство в экономику и создание государственной промышленности кажется естественным выбором."
 PRU_communal_agriculture: "Общинное сельское хозяйство"
 PRU_communal_agriculture_desc: "Общинное сельское хозяйство является частью реформ, которые председатель Хайя счел необходимыми для процветания Перу."
 PRU_workers_resources: "Ресурсы трудящихся"
 PRU_workers_resources_desc: "Перу - это обширная и богатая земля, полная ресурсов, предназначенных для нашей промышленности, но слишком долго олигархия использовала их в своих интересах, а не в интересах перуанского народа."
 PRU_peoples_military_complex: "Народные военные-комплексные"
 PRU_peoples_military_complex_desc: "Работники Перу нуждаются в развитии оружейных заводов для того, чтобы подпитывать наши революционные усилия."
 PRU_working_for_the_workers: "Работа для трудящихся"
 PRU_working_for_the_workers_desc: "Неравноправие в обществе, движимом олигархом, слишком долго мучает Перу."
 PRU_expand_the_workers_factories: "Расширить перуанские фабрики"
 PRU_expand_the_workers_factories_desc: "Однако, когда мы переходим к социализму, нам необходимо новое городское и промышленное развитие для того, чтобы наша социалистическая экономика могла работать, в связи с чем потребуется расширение перуанской промышленной базы."
 PRU_workers_infrastructure: "Инфраструктура трудящихся"
 PRU_workers_infrastructure_desc: "Плохие инвестиции беззаботных капиталистов в взаимосвязанную инфраструктуру нашей страны оставляют многие зоны в плохом состоянии и плохо справляются со многими сельскими рабочими. Давайте исправим это."
 PRU_socialist_construction_revamp: "Революция социалистического строительства"
 PRU_socialist_construction_revamp_desc: "Однако сейчас наше социалистическое государство финансирует новую программу строительства вокруг Перу, что позволяет расширить активы нашей страны по всему миру."
 PRU_mining_expansion: "Расширение горнодобывающей промышленности"
 PRU_mining_expansion_desc: "Расширение наших минеральных ресурсов и их переработка крайне необходимы для наращивания нашего промышленного производства, и поэтому нам следует сосредоточиться на этом."
 PRU_electronics_research: "Исследования в области электроники"
 PRU_electronics_research_desc: "Развитие электроники как новейших областей науки означает, что мы должны постоянно обновлять и хорошо изучать полезную технологию."
 PRU_socialist_development: "Социалистический план развития"
 PRU_socialist_development_desc: "Зоны нашей страны крайне слабо развиты, как с точки зрения промышленного потенциала, так и с точки зрения инфракрасности."
 PRU_socialist_research: "Социалистические исследования"
 PRU_socialist_research_desc: "Прогресс и наука имеют основополагающее значение для развития марксизма."
 PRU_aprist_revolution: "Революционный дух"
 PRU_aprist_revolution_desc: "Революция поселилась в Перу под руководством президента Хайи."
 PRU_birth_of_the_socialist_republic: "Рождение Социалистической Республики"
 PRU_birth_of_the_socialist_republic_desc: "Мы провозгласили перуанскую республику мертвой, но ее сердце умерло с момента ее рождения, как ее управляла коррумпированная бургуизия, и теперь народ наконец провозгласил настоящую, живую республику, Социалистическую Республику Перу!"
 PRU_aprist_program: "Программа &lt; &lt; Приз &gt; &gt;"
 PRU_aprist_program_desc: "По мере того, как АПРА возглавила социалистическую революцию и принесла народу идеалы солидарности, социализма и индоамериканства, мы можем, наконец, приступить к осуществлению программы для трудящихся."
 PRU_begin_the_agrarian_reform: "Начало аграрной реформы"
 PRU_begin_the_agrarian_reform_desc: "Однако на протяжении веков земля принадлежала богатым классам, и мы должны изменить ее, начав аграрную реформу."
 PRU_redistribute_lands: "Перераспределение земель"
 PRU_redistribute_lands_desc: "Перераспределив общинные земли среди рабочих, мы можем предоставить им столь необходимую экономическую независимость и устойчивость, поскольку они освобождены от оков элиты."
 PRU_the_chairmans_leadership: "Руководство Председателя"
 PRU_the_chairmans_leadership_desc: "С харизмой и умом, чтобы возглавить революцию, это не стало сюрпризом для популярного и хорошего лидера, которым является наш Председатель Хайя де ла Торр, кажется, что нам может понадобиться его лидерство в течение долгого времени, поскольку только он может вести нас вперед."
 PRU_rights_for_the_unions: "Права профсоюзов"
 PRU_rights_for_the_unions_desc: "Профсоюзы и синдикаты, представляющие трудящихся, имеют огромное значение, и мы дадим им большую роль в нашей республике, разумеется, до тех пор, пока они будут сотрудничать."
 PRU_socialist_councils: "Социалистические советы"
 PRU_socialist_councils_desc: "Создание советов трудящихся, в которых они могли бы обсуждать свои вопросы и принимать решения по различным вопросам, вдохновляемых известными совиетами, стало бы большим средством укрепления социализма в нашем обществе."
 PRU_tackle_the_indigenous_issue: "Решение проблемы коренных народов"
 PRU_tackle_the_indigenous_issue_desc: "Благородные коренные народы, они являются подлинными гражданами и частью нашего великого общества, мы должны относиться к ним одинаково, но с большим уважением, и Председатель обеспечит, чтобы мы чтили их, сердце Индоамерики."
 PRU_help_the_poor: "Помогите бедным"
 PRU_help_the_poor_desc: "Рабочие классы слишком долго страдали, мы должны проводить социальную политику, которая отвечает их интересам и заканчивает их нехватку материальных средств, ставя их на равные позиции со всем нашим обществом."
 PRU_nationalization_program: "Программа национализации"
 PRU_nationalization_program_desc: "Иностранное капиталистическое влияние на нашу экономику было большим. Мы больше не можем терпеть это, поскольку промышленность принадлежит Социалистической Республике, а также рабочим, которые работают в ней."
 PRU_socialist_elite: "Социалистическая элита"
 PRU_socialist_elite_desc: "Капиталистическая элита никогда не может править, поскольку у нее есть только собственные интересы, а не интересы народа. Но кто-то, способный управлять, должен быть ответственным. Таким образом, социалистическая республика будет управляться социалистической интеллектуальной элитой, которая будет точно знать, как решать, что нужно людям и как обеспечить."
 PRU_socialism_in_indoamerica: "Социализм в Индоамерике"
 PRU_socialism_in_indoamerica_desc: "Наша революция не может оставаться внутри Перу, идеалы социализма и солидарности пересекают границы и должны распространяться по прекрасному континенту, который мы называем Индоамерика, сочетание коренных и колониальных влияний создает идеальное место для этой международной революции."
 PRU_peruvian_cooperatives: "Перуанские кооперативы"
 PRU_peruvian_cooperatives_desc: "Местные общины, объединенные чувством товарищества, стремящиеся к лучшему завтрашнему дню, приведут перуанских рабочих к успеху."
 PRU_workers_fleet: "Рабочий флот"
 PRU_workers_fleet_desc: "Моря являются мощным ресурсом, а также мостом между работниками мира, однако контроль над ними со стороны наших врагов, несомненно, погубит нас, и поэтому рабочие должны создать флот, который облагораживает их мечты о мировой революции."
 PRU_the_new_ports: "Новые порты"
 PRU_the_new_ports_desc: "Старые порты, которые служили Перу, - это лишь воспоминание об их использовании в качестве буржуазных центров торговли и жадности."
 PRU_the_peoples_shipyards: "Народные верфи"
 PRU_the_peoples_shipyards_desc: "Покупка кораблей с коммерческих верфи, которые много раз приносили прибыль от войны, это дело прошлого."

