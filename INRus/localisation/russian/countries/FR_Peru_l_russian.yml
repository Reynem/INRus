 PRU_manuel_arturo_odria_amoretti: "Мануэль Артуро Одрия Аморетти"
 #PRU_manuel_arturo_odria_amoretti_leader_desc: "Хосе Мануэль Артуро Одриа Аморетти родился в 1896 году в городе Тарма, департамент Юнин, Перу, окончил Милитару Эскуэлы в качестве второго лейтенанта пехоты, где его оценки были настолько высоки, что ему был предоставлен почетный меч, и он был назначен инструктором школы. Он продолжал совершенствовать свои военные способности на протяжении всей своей карьеры, играя важную роль в войне против Эквадора, но он никогда не был действительно готов стать политиком."

 PRU_eloy_gaspar_ureta_montehermoso: "Элой Гашпар Урета Монтегермосо"
 #PRU_eloy_gaspar_ureta_montehermoso_leader_desc: "Элой Гашпар Урета Монтехермосо родился в 1892 году в Чиклайо, департамент Ламбайека, Перу, окончил в 1913 году в качестве второго лейтенанта артиллерии из Милитара-де-Хоррильос, после того как начал обучение в Высшей школе Герры, его отправили в Италию и Францию, чтобы усовершенствовать свои способности в качестве офицера артиллерии, декоративного офицера, он присоединился к УР из-за своих ультраконсервативных взглядов и восхищения Агуро, даже если у них были разногласия. Теперь, когда Урета возглавляет УР и Перу, он попытается привить перуанскому обществу в целом патриотизм и дисциплину, которых он учил как кадет."

 PRU_carlos_miro_quesada_laos: "Карлос Миро-Куэсада Лаос"
 # PRU_carlos_miro_quesada_laos_leader_desc: "Карлос Миро-Куэсада Лаос родился в 1903 году в столице Перу, Лиме, окончил Лиму в 1932 году в качестве адвоката и вступил в Революционный Союз. Его дипломатические отношения с другими членами партии и профессиональное руководство ею позволили ему быстро подняться в ряды, став одним из возможных преемников Агуэро. Теперь, когда Миро-Куэсада находится у власти, он обязан продолжить создание статуса Куо Агуэро и продолжать работать над видением Агуэро славного испаноязычного перу."

 PRU_luis_alberto_flores_medina: "Луис Альберто Флорес Медина"
 # PRU_luis_alberto_flores_medina_leader_desc: "Луис Альберто Флорес Медина родился в 1899 году в маленьком городе Айабака, Перу, он получил право на получение юридической помощи от «Мэра Сан-Маркоса» в конце 1910-х годов, он решительно выступал против правительства Аугусто Б. Легии, поскольку Флорес был заключен в тюрьму. Он был освобожден после указа Санчеса Серро, быстро завоевавшего верность Флореса, который вскоре после этого присоединился к Союзу Революций флота. Он сопровождал Санчеса Серро во время своего путешествия через Арекипу, Пуно, Куско и Ику, и позднее стал депутатом УР. После ухода Франсиско Ланатты Флорес стал председателем совета министров. Во время своего пребывания на посту председателя совета экипажи перуанских военно-морских кораблей «Альмиранте Грау» и «Коронел Болоньес», который, по его мнению, стал хитрым агентом. Хотя Флорес не верил, что экипажи заслуживают смертной казни, военный суд также определил, что они предатели и должны были умереть, он пришел к острову Сан Лоренцо, чтобы он стал главным агентом, и его агентом."

