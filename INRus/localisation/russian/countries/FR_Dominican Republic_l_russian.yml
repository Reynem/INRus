 ### Characters ###
 DOM_heinrich_goldberg: "Генрих Голдберг"
 #DOM_heinrich_goldberg_leader_desc: "Генрих Голдберг впервые стал лидером небольшой анархистской коммуны на окраине Берлина во время вельткрига и последующего полета из страны в недавно созданную коммуну Франции. В то время как во Франции его взгляды стали все более окрашены французским ортодоксальным синдикативизмом, а после его отъезда в Доминиканскую Республику в 1928 году он стал горячим сторонником Эмиля Пугета, в Доминиканской Республике его ранние усилия по поощрению синдикализма были в основном неэффективными, но ему удалось вырасти маленький и преданный после этого, став лицом синдикалистского движения в его принятой стране."

 DOM_pedro_henriquez_urena: "Педро Хенрикес Уренья"
 #DOM_pedro_henriquez_urena_leader_desc: "Хотя политические оппоненты оклеветали его за брак с сестрой мексиканского синдикалиста Висенте Ломбардо Толедано, Педро Хенрикес Уренья, сын бывшего президента Франсиско Хенрикеса Карвахала, после многих лет фанфары вернулся в Доминиканскую Республику, несмотря на сравнение с его радикальным зятем, однако Хенрикес ни в коей мере не является синдикалистом; тем не менее, принципиальный писатель более чем готов работать в любом политическом спектре, который разделяет мнение о том, что Доминиканская Республика и, по сути, вся Латинская Америка должны быть полностью свободны от империалистического влияния и иметь возможность полностью выбрать свою судьбу."

 DOM_juan_jimenes_grullon: "Хуан Хименес Груллон"
 # DOM_juan_jimenes_grullon_leader_desc: "Хуан Хименес Груллон, сын бывшего президента Хуана Хименеса Перейры, несмотря на снижение прогрессивизма в Доминиканской Республике во время американской оккупации, искренне верит в идеалы джименистов своего отца."

 DOM_rafael_estrella_urena: "Рафаэль Эстрелла Уренья"
 # DOM_rafael_estrella_urena_leader_desc: "Рафаэль Эстрелла Уренья, будучи идеологически социально-экономическим реформистом, обрел много позора еще до американской оккупации за свои кажущиеся бесконечные амбиции и страсть к политической власти. С момента окончания оккупации имя Эстреллы стало еще более запятнанным его готовностью тесно сотрудничать как с военными, так и с членами экономической элиты страны."

 DOM_virgilio_martinez_reyna: "Виргилио Мартинес Рейна"
 # DOM_virgilio_martinez_reyna_leader_desc: "Виргилио Мартинес Рейна был важен для избрания в 1924 году Орасио Васкеса Ладжары первым президентом Доминиканской Республики со времени американской оккупации. В период своего пребывания на посту президента он в равной степени занимал центральное место в непрекращающихся политических волнениях в стране. Несмотря на то, что он был популярным и менее коррумпированным, чем его предшественники, неспособность Мартинеса подавить недовольство среди экономической элиты страны и даже начать принимать меры в отношении политической власти армии ускорила политическое направление страны после этого."

 DOM_manuel_troncoso_concha: "Мануэль Тронкосо Конча"
 # DOM_manuel_troncoso_concha_leader_desc: "Мануэль Тронкосо Конча, который когда-то был мелким корпоративным юристом, привлек внимание общественности благодаря связям с генералом Рафаэлем Трухильо, который часто обвинялся в том, что он является не более чем марионеткой для Трухильо, но судьба Тронкосо, несмотря на его отрицание таких обвинений, неразрывно связана с судьбой генерала."

 DOM_pilindo_bonetti_burgos: "Пилиндо Коститти Бургос"
 # DOM_pilindo_bonetti_burgos_leader_desc: "Будучи вдохновляющим юристом, опытным бейсболистом и самым щедрым покровителем спорта в Доминиканской Республике, несмотря на свой юный возраст, Пилиндо Бонетти пораньше бросил свою работу с Трухильо, заявив о своей поддержке генерала, прежде чем притворяться толпой. Теперь, после победы на президентских выборах, которые сделали мало иллюзий быть справедливым или свободным, Бонетти делает приказ генерала не более чем марионеткой, делая все возможное, чтобы создать иллюзию демократии в Доминиканской Республике."

 DOM_rafael_trujillo_molina: "Рафаэль Трухильо Молина"
 DOM_rafael_trujillo_molina_leader_desc: "Молодой Рафаэль Трухильо так впечатлил оккупационный американский морской корпус, что его поспешно повысили в оккупационной доминиканской армии. Трухильо использовал свое положение для того, чтобы установить военный контроль над большей частью страны. Так велика его сила и амбиции, что различные администрации, которые последовали за независимостью страны в 1924 году, каждая из которых основывала большинство своих решений на том, чтобы помешать ему захватить власть."

 DOM_ramon_vasquez_rivera: "Рамон Васкес Ривера"
 #DOM_ramon_vasquez_rivera_leader_desc: "Генерал Ривера быстро воспользовался возможностью для политического возвышения и теперь правит по образу Трухильо."

