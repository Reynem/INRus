 aiu_fwa.1.t: "Новый генерал-губернатор"
 aiu_fwa.1.d: "Гавриил Ангоулван в плохом состоянии и в ближайшее время прекратит свое пребывание на посту генерал-губернатора нашей прекрасной колонии, и настало время назначить его преемника, тремя основными кандидатами которого являются месье Бревие, известный своей заинтересованностью в африканской культуре и желанием поощрять африканцев к добровольному участию в колониальном проекте, месье Кайла, который рассматривается в качестве безопасного кандидата среднего уровня при поддержке городских чиновников, и месье Буасел, чьи твердый стиль правления и непоколебимая вера в цивилизованную миссию сделали его поляризирующей фигурой."
 aiu_fwa.1.a: "Бреви - наш человек."
 aiu_fwa.1.b: "Кайла кажется безопасным выбором."
 aiu_fwa.1.c: "Буассель - подходящий человек для этой работы."
 aiu_fwa.2.t: "Обзор Индигената"
 aiu_fwa.2.d: "Учрежденный в 1887 году Кодекс коренных народов представляет собой правовую основу, устанавливающую права и привилегии различных групп во французской колониальной империи; на практике он гарантирует правовую неполноценность коренных африканцев и позволяет нам править через городских и сельских вождей; репрессивные полномочия, которые они позволяют нам использовать против населения, противоречат определенным элементам и самим коренным народам, но некоторые говорят, что вместо того, чтобы ослаблять ограничения, мы должны упростить и официально закрепить этот кодекс, пока африканцы не будут готовы присоединиться к мировому сообществу в качестве настоящих французов."
 aiu_fwa.2.a: "Нынешняя система слишком репрессивна - расслабьте ее."
 aiu_fwa.2.b: "Мы не можем сейчас убрать руку с колеса цивилизованной миссии."
 aiu_fwa.10.t: "Отрывается."
 aiu_fwa.10.d: "После смены правительства во Франции наша колония [от GetNameDef] решила разорвать связи и попытаться функционировать независимо."
 aiu_fwa.10.a: "Разве они не понимают, что их оставит история?"
 aiu_fwa.16.t: "[От GetNameDefCap] стремится сражаться в одиночку"
 aiu_fwa.16.d: "После наших крупных потерь на поле против наших врагов наша колония [от Гет Наме Дефа] решила бороться без нас против угроз, с которыми она сталкивается, реорганизовав свое правительство и армию, чтобы продолжать войну в одиночку."
 aiu_fwa.16.a: "Мы можем пожелать им всего хорошего."


