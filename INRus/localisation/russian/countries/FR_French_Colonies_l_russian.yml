 FWA_colonial_government: "Колониальное правительство"
 FWA_colonial_government_desc: "Французская колониальная система несколько отличается от колониальной системы других государств. Метрополитен Франция вносит весьма незначительный вклад в бюджет колонии, которая вынуждена полагаться на высокие налоги и принудительный труд внутри страны для достижения достаточности."
 FWA_colonial_government_2: "Реформированное колониальное правительство"
 FWA_forced_labour_idea: "Принудительный труд"
 FWA_forced_labour_idea_desc: "Чтобы использовать труд колониальных субъектов, французские власти могут использовать принудительный труд "корве" для конкретных проектов или "претензий" как форму налогообложения, которые позволяют крошечному колониальному правительству осуществлять планы строительства и организовывать большую рабочую силу, но дико непопулярны."
 FWA_blood_tax_idea: "Налоговый налог Сана"
 FWA_blood_tax_idea_desc: "Для человека и полиции своей колонии АОФ использует систему принудительного призыва на военную службу и стимулы для вождей, чтобы отправить молодых людей в колониальную армию."
 FWA_head_tax_idea: "Налоги на заголовки"
 FWA_head_tax_idea_desc: "Под общим знаменем «налоговых сборов» колониальные власти имеют возможность требовать и закупать деньги, продукты питания и товары у своих колониальных подданных, и необходимость обеспечения финансовой самодостаточности колонии делает эти требования частыми и тяжелыми."
