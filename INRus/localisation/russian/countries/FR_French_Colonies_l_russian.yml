 #Event
 aiu_fea.1.t: "Выводы финансового доклада"
 aiu_fea.1.d: "Выпуск финансового доклада был шокирован во Франции, поскольку в нем подробно говорится о состоянии концессий во Французской Экваториальной Африке и о тяжелом положении коренных жителей; уже сейчас в газетах ставится под сомнение наше руководство и весь экваториальный колониальный проект; конечно же, мы будем вынуждены осуществить многочисленные изменения и потрясти колонию, с тем чтобы успокоить власти и наших инвесторов или столкнуться с полным крахом."
 aiu_fea.1.a: "Лучше начни..."
 aiu_fea.2.t: "Феликс Эбуэ говорит"
 aiu_fea.2.d: "Заметный администратор Феликс Эбуэ, первый чернокожий человек, которого повысили до старшего колониального поста, выступил в Браззавиле вчера вечером по поводу выводов финансового отчета, состояния коренных жителей и новой радикальной политики, которую он предлагает изучить, чтобы сделать колонию устойчивым и этическим проектом. Он очень популярен, особенно среди эвлуе, но для некоторых в администрации его речь изменчива и требует наказания."
 aiu_fea.2.a: "Похоже, его планы вернём под наше крыло."
 aiu_fea.2.b: "Он должен быть арестован и допрошен немедленно."
 aiu_fea.3.t: "Джендармы возвращаются с пустыми руками."
 aiu_fea.3.d: "Наши жандармы, посланные, чтобы перехватить Эбуэ, вернулись, не схватив его и не обнаружив его местонахождение. Похоже, что его предупредили люди из нашего правительства до ареста, и они полностью покинули город. У нас есть войска, готовые напасть, если он снова поднимет голову, но новости уже вышли, и люди протестуют против него."
 aiu_fea.3.a: "Драт..."
 aiu_fea.4.t: "Новая местная политика"
 aiu_fea.4.d: "Благодаря многолетнему труду Эбуэ наконец смог оформить в законодательном порядке предложения своего циркуляра "la nouvelle politicique indigen", который, поощряя использование французского языка и образования, также направлен на защиту традиционных африканских институтов и получил высокую оценку со стороны других членов движения неграмотности."
 aiu_fea.4.a: "Давай посмотрим, как всё получится."
 aiu_fea.5.t: "Назначение нового генерал-губернатора"
 aiu_fea.5.d: "После того как Феликс Эбуэ добился успехов в реформировании колониальной экономики, в примирении враждебных групп на территориях и в поддержке цивилизующей миссии в Экваториальной Африке, он был назначен генерал-губернатором колонии."
 aiu_fea.5.a: "Ура!"
 aiu_fea.6.t: "Легкое прикосновение"
 aiu_fea.6.d: "Хотя для борьбы с изменниками и воинствующими элементами в колонии, возможно, была необходима жесткая политика, теперь, когда этот период закончился, нам лучше было бы предложить морковь, чем применить палку."
 aiu_fea.6.a: "Так тому и быть."
 aiu_fea.7.t: "Кровь есть деньги"
 aiu_fea.7.d: "Если последние несколько лет что-то и доказали, то это то, что создание прибыльной колонии в Экваториальной Африке возможно только с человеческими издержками, хотя мы и не видим никаких других путей продвижения вперед на территориях, и, хотя мы и сожалеем, заработная плата не будет повышена, а контроль за условиями жизни должен оставаться в руках только компаний, работающих на льготных условиях."
 aiu_fea.7.a: "Когда-нибудь мы построим образцовую колонию."
 aiu_fea.8.t: "Ebué Re-serges"
 aiu_fea.8.d: "После нескольких недель бегства от наших шпионов Феликс Эбуэ, наконец, вновь появился, когда его видели на тайных встречах с лидерами САОАЕФ. Его популярность среди эвлуе, несомненно, ослабит нашу позицию в этой нестабильной ситуации."
 aiu_fea.8.a: "Предатель!"
 aiu_fea.10.t: "Беспорядки в Чаде"
 aiu_fea.10.d: "Наши офицеры и солдаты в Чаде рассеяны, и в основном оставляют племена самим себе."
 aiu_fea.10.a: "Волнуюсь."
 aiu_fea.11.t: "В Чаде растет сила диссидентов."
 aiu_fea.11.d: "Некоторые города и деревни, расположенные вблизи наших крепостей, постепенно опустошаются."
 aiu_fea.11.a: "Куда они едут?"
 aiu_fea.12.t: "Бандитский рейд"
 aiu_fea.12.d: "На караван из Браззавиля напали лошадиные бандиты, направлявшиеся в форт на территории Чада, и они спустили часть наших запасов, и несколько охранников были убиты."
 aiu_fea.12.a: "Придется послать дополнительную охрану."
 aiu_fea.13.t: "Офицер убит!"
 aiu_fea.13.d: "Один из наших колониальных офицеров в Чаде подвергся нападению и был убит в ходе рейда, совершенного силами из внутренних районов Чада."
 aiu_fea.13.a: "Мы будем готовы."
 aiu_fea.15.t: "Ревт в Чаде"
 aiu_fea.15.d: "Сегодня утром были совершены одновременные нападения на ряд наших крепостей, разбросанных по Чаду, хотя они не проникли в район вокруг Форт-Лами, где наш гарнизон является самым крупным, они захватили большую часть страны и явно находятся в полном восстании."
 aiu_fea.15.a: "Мы должны раздавить этих мятежников."
 aiu_fea.15.b: "За независимость!"
 aiu_fea.20.t: "Подъём Карну"
 aiu_fea.20.d: "В плохо известных районах бассейна реки Сангха религиозный пророк и святой человек, которого мы знаем только как «Карну», что означает « тот, кто может изменить мир», уже несколько месяцев возбуждает нас. В ответ на взыскание народа Гбайи за строительные проекты и военную службу он выступает за сопротивление все более агрессивной форме, и его мессианский призыв стал весьма привлекательным для многих, кто возмущается нашим правлением..."
 aiu_fea.20.a: "Какое суеверие."
 aiu_fea.21.t: "Собрание на Сангу"
 aiu_fea.21.d: "Надежные осведомители сообщили нам о собрании, которое состоялось в бассейне Сангха, где последователь Карну выступил против нас в деревне, где ранее были призваны люди на наши корвейские проекты."
 aiu_fea.21.a: "До тех пор, пока он просто слушает."
 aiu_fea.22.t: "Небольшие племени присоединяются к Карну"
 aiu_fea.22.d: "Племя в составе нескольких тысяч человек начало бросать свои деревни и работать над нашими уступками, чтобы перебраться в скрытые поселения в глубине джунглей, до которых мы не можем легко добраться."
 aiu_fea.22.a: "Будем надеяться, что они передумают."
 aiu_fea.23.t: "Гбайа Рейд"
 aiu_fea.23.d: "Группа последователей Карну напала на один из наших складов в районе Ликуала, захватив оружие и запасы, а затем отступив в болота."
 aiu_fea.23.a: "Воры и бриганды."
 aiu_fea.24.t: "Конго-Вара, восстание"
 aiu_fea.24.d: "Карну выбрал время, чтобы нанести удар, после долгого периода подготовки, сбора ресурсов и оружия и обращения племен против нас."
 aiu_fea.24.a: "Пора восстановить порядок."
 aiu_fea.24.b: "Возможно, мы превзошли наш прием..."
 aiu_fea.30.t: "Убийства из САОАЕФ"
 aiu_fea.30.d: "В городах Экваториальной Африки уже давно проводится кампания за широкое предоставление гражданства жителям и за политическое развитие экваториальных французов, в рамках которой создается ощущение того, что колониальное правительство навсегда удержит эти права, что может привести к весьма уродливой ситуации."
 aiu_fea.30.a: "Подожди ещё немного..."
 aiu_fea.31.t: "Майор Ралли"
 aiu_fea.31.d: "Агитаторы САОАЕФ провели сегодня в одном из городских центров крупное собрание, выступая против отсутствия эвлуэ на старших должностях и против политической и экономической политики колониального правительства, которые разошлись, когда появились жандармы, но, возможно, ущерб уже был нанесен."
 aiu_fea.31.a: "Неблагодарный..."
 aiu_fea.32.t: "Военнослужащие дефекты"
 aiu_fea.32.d: "Однако наши офицеры сообщили нам, что группа солдат покинула свои посты во внутренних районах после радикализации агентами САОАЕФ."
 aiu_fea.32.a: "Они вернутся."
 aiu_fea.33.t: "Бунт!"
 aiu_fea.33.d: "Сегодня жандармы должны были быть развернуты после крупного бунта под руководством радикальных эвлуэ, которые закрыли центр города в одном из наших крупнейших городов, скандируя лозунги и размахивая французскими флагами."
 aiu_fea.33.a: "Это угроза."
 aiu_fea.34.t: "Городской револьт"
 aiu_fea.34.d: "Начиная с казарм и колониальных казарм сегодня, то, что мы считали скоординированным ударом, превратилось на наших глазах в попытку захватить контроль над колонией, ссылаясь на различные стратегии, аресты и судебные процессы, которые имели место при нашем правлении, а также на нынешний статус коренных народов в концессиях, лидеры восстаний выпустили манифест, призывающий к полной ликвидации нынешнего колониального правительства и созданию нового правительства под руководством эволуэ."
 aiu_fea.34.a: "Измена и ложь!"
 aiu_fea.34.b: "Свобода и цивилизация - это то, что обещали французы, возможно, у них есть смысл..."
 aiu_fea.40.t: "Эбуэ ведет переговоры с чадскими мятежниками"
 aiu_fea.40.d: "Феликс Эбуэ оказался в центре волнений в Чаде, и благодаря харизма и информаторам удалось непосредственно встретиться с высокопоставленными представителями диссидентских групп, после нескольких дней задних и различных предложений он смог убедить мятежников отступить в обмен на некоторую автономию и уступки, против которых колониальное правительство не будет возражать."
 aiu_fea.40.a: "Его серебряный язык спас день!"
 aiu_fea.41.t: "Эбуе переговоры с лидерами Гбайи"
 aiu_fea.41.d: "Нашему известному администратору Феликсу Эбуэ удалось заключить сделку с лидерами Гбайи и убедить их передать религиозного лидера Карну в обмен на несколько свобод для населения региона в соответствии с его новой местной политикой."
 aiu_fea.41.a: "Еще одна великолепная служба колонии."
 aiu_fea.42.t: "Срыв в Чаде"
 aiu_fea.42.d: "Установление нами военного положения и жесткое регулирование передвижения племен вынудило чадских мятежников, которые сейчас берут оружие гораздо менее организованным образом, чем мы оставляли их на произвол судьбы."
 aiu_fea.42.a: "Наказать их!"
 aiu_fea.43.t: "Обнаружено Карну"
 aiu_fea.43.d: "В то время как наши войска были отстранены, когда они пытались схватить его, подкрепление сейчас закрывается, и это означает, что у Гбайи и их союзников нет другого выбора, кроме как подняться сейчас, пока мы двигаемся по их укрытиям."
 aiu_fea.43.a: "Приведите сумасшедшего."
 aiu_fea.44.t: "Массовые аресты в городах"
 aiu_fea.44.d: "Сегодня утром наши жандармы набросились на известных агитаторов SAOAEF, окружив большую часть их лидеров и ввергнув их в хаос, в то время как некоторые сплотились против нас, теперь они дезориентированы и будут легкой добычей для наших разногласий."
 aiu_fea.44.a: "Научи их цене измены."


