 #### Events
 nfageneral.1.d: "После проведения военных консультаций с Парижем была разрешена скоординированная кампания по установлению мира, направленная на стабилизацию наших устойчивых территорий, признавая, что обеспечение региональной безопасности имеет первостепенное значение, французское правительство согласилось на то, чтобы эта операция осуществлялась за счет крупных партий пехотного снаряжения, которое обеспечивает нашим силам материальное превосходство, необходимое для подавления диссидентских элементов и скорейшего восстановления порядка по всей зоне."
 nfageneral.2.d: "Разрозненные сети начали скоординированную кампанию саботажа и повстанческого движения низшего уровня в Западной Африке, которая угрожает парализовать регион, некоторые подозревают британцев, американцев или даже советов в внезапном возникновении недовольства."
 nfageneral.3.d: "Разрозненные сети начали скоординированную кампанию саботажа и повстанческого движения в Западной Африке, которая привела колонию в состояние паралича. Некоторые подозревают британцев, американцев или даже Советов в внезапном возникновении недовольства. Как бы то ни было, Дакар обратился к нам в отчаянии, запросив поставку стрелкового оружия и милитарную поддержку, чтобы предотвратить общее восстание. Хотя наши ресурсы напряжёны в Европе, возможно, было бы разумно убрать это в зародыше до наступления всеобщей анархии."
 nfageneral.4.d: "Наши срочные просьбы к метрополию были удовлетворены. Признавая серьезные последствия утраты опоры в регионе, Париж санкционировал экстренную передачу десяти тысяч винтовок, хотя эта интервенция создает трудности для французской внутренней экономики, прибытие этих боеприпасов является огромным стимулом для наших сил безопасности, и теперь у нас есть средства для сдерживания кризиса."
 nfageneral.5.d: "Ответ от метрополии является разрушительным ударом: наша просьба об оказании военной помощи была полностью отклонена."

 nfarevolt.1.t: "[Револьтер. GetNameDefcap] заявляет о своей независимости"
 nfarevolt.1.d: "После того, как мы выгнали наши войска, [революционер, GetNameDef] объявил независимость, должны ли мы раздавить их нашими высшими силами, или же мы должны сократить наши потери, чтобы сосредоточиться в другом месте?"
 nfarevolt.1.a: "Они должны оставаться частью Империи!"
 nfarevolt.1.b: "У нас есть более важные вопросы, чем сокрушение местных восстаний."

  nfarevolt.2.t: "Победа против французских колонистов!"
 nfarevolt.2.d: "Когда мы начали наше восстание, никто не знает, к чему оно должно было привести, некоторые были пессимистичными, другие были более оптимистичными, но все были полны решимости бороться за нашу независимость, и теперь эта решимость принесла свои плоды, и после этой долгой войны у французских колонистов не было иного выбора, кроме как предложить нам мир и признать, что их правление над нашей страной закончилось, и этот день навсегда будет отмечен как славный день нашей независимости."
 nfarevolt.2.a: "Давайте радоваться!"


