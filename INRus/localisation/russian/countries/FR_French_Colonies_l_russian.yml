 #### Ideas ####
 NFA_pacification_of_africa: "Миротворчество в Западной Африке"
 NFA_pacification_of_africa_desc: "Для того чтобы сделать Западную Африку более «коммунальной» для французов, эта колония приступила к выполнению задачи «ускорения» местного населения."

 NFA_partisan_1937: "Западноафриканский револьт 1937 года"
 NFA_partisan_1937_costs: "Стрелковое оружие для французской Африки"
 NFA_partisan_1937_support: "Поддержка со стороны Метрополя"

 MOR_harsh_environment: "Жестокая окружающая среда"
 MOR_harsh_environment_desc: "В целом горячие, засушливые и не пригодные для промышленного развития, инвесторы отказываются помогать колониальному развитию французской Северной Африки. Наши ученые пытаются доказать, что эти инвесторы ошибаются. Используя фляжки, букеры и выдумывая дерьмо из ниоткуда, они могут придумать "изучение", которое докажет, что эти инвесторы неверны."

 NFQ_colonial_unrest: "Неприятности коренного населения"
 NFQ_colonial_unrest_desc: "Плохие условия жизни, отсутствие инфраструктуры и экономическая стагнация привели к тому, что "Индейцы Нерест" вспыхнули в нашей колонии, и пока наше правительство активно работает над исправлением этих проблем, это, несомненно, займет некоторое время, пока вопрос не будет решен."

