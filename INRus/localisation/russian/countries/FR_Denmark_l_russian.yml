 DEN_weaken_monarchs_power_idea_desc: "С превращением Дании в демократическую нацию, где решения принимаются правительствами и Фольктингетом, Пасхальный кризис и кризис отторжения показали времена, когда король Кристиан Х порвал с этим. Это привело к тому, что в Дании укрепился республиканец, в основном представлявший левую республику. В то время как республиканские силы в стране слишком слабы, чтобы захватить власть, это может измениться в случае возникновения будущих кризисов."
