 POLITICS_FREDERICK_IX_DESC: "Король Фредерик IX является нынешним королем Дании. Родившийся в 1899 году, в начале нового века, он является относительно молодым монархом на сцене Европы. Жизнь Фредерика не была спокойной. Его королевская миссия обеспечить свое правопреемство была встречена многими соображениями и неудачной помолвкой. Впервые в 1935 году Фредерик женился, успокаивая людей, которые желали будущего для датской монархии. Одним из величайших изменений в жизни Фредерика является его восхождение на трон через кризис, вызванный отменой власти, движение, которое отделило как монархистов жесткой линии, так и радикальных республиканцев, но обеспечило мир и продолжение монархии. / nn/Фредерик сам является одним из подданных, которые спасли Датскую монархию."
 POLITICS_CHRISTIAN_X_DESC: "Король Кристиан Х является нынешним королем Дании. Он родился в 1870 году и является внуком давнего христианина IX."father-in-law of Europe". Growing up in the 19th century, King Christian became king in an era of modern social change in Danish society, with the ideas of constitutionalism and democracy. This became a counter to Christian, who is described as an authoritarian and one who stressed the importance of the monarch's power. His use of power, would however lead to his fall from it during the Abdication Crisis. Since then, Christian X have lived his life as an ex-monarch in Denmark, with his son taking his role.\n\nWhile Christian was officially no longer a monarch, he still had support among conservatives and monarchists in Denmark, many of whom saw the abdication as a coup from the Social Democrats. With an alliance of military figures and conservatives, they finally managed to seize power, bringing the de-throned Christian X into power yet again."
 POLITICS_AKSEL_LARSEN_DESC: "Аксель Ларсен является нынешним президентом Дании. Ларсен, родившийся в 1897 году, был в ранней жизни социал-демократом, прежде чем стать членом Коммунистической партии после русской революции. С 1932 года Ларсен возглавил Коммунистичную партию Дании и теперь наконец стал лидером социалистической республики в Дании. Ларсен, который, поддерживая Советский Союз и социализм, не боится выступать против авторитарных и антирабочих действий."
 POLITICS_MOGENS_FOG_DESC: "Могенс Фог является нынешним президентом Дании. Фог, родившийся в 1904 году, учился в Метрополитенсколоне с другими известными левыми рыцарями. Некоторые из них присоединились к Коммунистической партии, в то время как Фог был вовлечен в социалистическое крыло социал-демократов. В 1929 году Фог был среди тех, кто покинул социал-демократов в оппозиции партии против поддержки короля Фредерика IX и присоединился к Республиканской партии."
 POLITICS_CAY_LEMBCKE_DESC: "Кей Лембке является нынешним лидером Дании, Фёрер. Лембке, родившийся в 1885 году, является сыном военной семьи и служил в Королевской датской армии Ритместером. В 1909-1910 годах Лембке стал одним из основателей Датской организации бойскаутов — организации, членом которой он был в течение 13 лет. После роста валькизма в Германии Лембеке был соучредителем Национальной партии Дании, основанной на датском национализме и полувалентистских тенденциях. ~ Несмотря на политические волнения, последовавшие за крушением Лондонского фондового рынка, Национальная партия сумела приобрести власть в контрреволюции против социалистических и республиканских сил. При поддержке Германии Лембеке надеется привести Данию к большей славе."


