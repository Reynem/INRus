 #### Companies ####
 atlas_maskinfabrik: "Атлас Маскинфабрик AS"
 atlas_maskinfabrik_desc: "Атлас Маскинфабрик АС является датским машиностроительным предприятием, железной литейной и промышленной компанией, которая в числе самых разнообразных промышленных продуктов производит холодильники и холодильники."
 bang_olufsen: "Bang & Olufsen"
 bang_olufsen_desc: "Bang & Oliufsen — это высокопрекрасная датская компания по производству аудиопродуктов, телефонов и других передовых электроник. Она была основана в 1925 году Питером Бангом и Свеном Олуфсеном, которые разработали радиостанцию для работы с переменным током — продукт, имеющий значение в то время, когда большинство радиостанций все еще работали на батареях."
 novo_lab: "Ново Терапеутский лабораторий"
 novo_lab_desc: "Novo Terapeutisk Laboratorium — Датская многонациональная фармацевтическая компания, базирующаяся в Багсверде, Дания, которая занимается производством и сбытом фармацевтических препаратов и услуг, конкретно связанных с лечением диабета"
 disa: "Dansk Industri Sindikat"
 disa_desc: "Dansk Industri Syndikat — оборонный производитель, наиболее примечательный за производство автомата Madsen и Madsen M50."
 forenede_automobilfabriker: "Автомобильный"
 forenede_automobilfabriker_desc: "В 1918 году датские производители транспортных средств Англо-Дейн, Ян и Триг объединились в De Forende Automobilefabriker в Оденсе."
 frichs_maskinfabrik: "Фрихис Маскинфабрик"
 skandinavisk_aero: "Скандинавик Аэро Индустри"
 denmark_sas_company: "Скандинавские авиалинии"
 odense_staalskibsverft: "Странно, Стаальскибсвэрфт"
 burmeister_wain: "Бюстгальтер & Вэйн"
 burmeister_wain_desc: "Burmeister & Wain — крупный датский верфи и ведущий производитель дизельных двигателей, базирующийся в Копенгагене, Дания."
 aalborg_verft: "Аальборг Вирфт"
 aalborg_verft_desc: "Основанный в 1912 году братьями Иммануэлем Стюхром и Питером Филипом Стюром, верфь была основана под названием Stuhr Milger and Ship Construction, что является развитием бизнеса их отца."

 #### FOCUS TREE ####
 DEN_invest_in_shipping: "Инвестирование в морские перевозки"
 DEN_invest_in_shipping_desc: "Моря - это наша кровь и наша связь с более широким миром, мы были бы глупыми, не инвестируя в судоходство и расширяя нашу способность отправлять и получать товары."
 DEN_jylland_highway: "Шоссе Йилланд"
 DEN_jylland_highway_desc: "Гражданская инфраструктура Джиллленда отстает от национальных стандартов, и наши гражданские лица становятся недовольными."
 DEN_support_agricultural_sector: "Поддержка сельскохозяйственного сектора"
 DEN_support_agricultural_sector_desc: "Датская экономика не настолько диверсифицирована, как хотелось бы, и сельскохозяйственный сектор отсутствует уже многие десятилетия."
 DEN_industrial_investments: "Промышленные инвестиции"
 DEN_industrial_investments_desc: "Хотя у нас нет разрастающейся промышленности, она по-прежнему играет жизненно важную роль в национальной экономике и предоставляет столь необходимые материалы для всех частей нашей страны."
 DEN_industrialization_drive: "Промышленный двигатель"
 DEN_industrialization_drive_desc: "Наш промышленный сектор набирает устойчивый импульс, и многие члены нашего правительства стремятся к дальнейшему инвестированию, с тем чтобы извлечь выгоду из наших достижений."
 DEN_oversea_development: "Развитие за рубежом"
 DEN_oversea_development_desc: "Датское королевство включает в себя гораздо больше, чем Дания, и наши обширные территории в Арктике оказались стратегически бесценными в плане контроля над Северным морем."
 DEN_expand_belt_ferries: "Расширить поясовые черепахи"
 DEN_expand_belt_ferries_desc: "Датские фабрики задыхаются сырыми материалами, которые они просто не могут обработать."
 DEN_sjealland_infrastructure: "Инфраструктура Шелланд"
 DEN_sjealland_infrastructure_desc: "Датский промышленный центр находится на острове Шелланд, но нам трудно перевозить и хранить огромные объемы импорта и экспорта через наши порты."
 DEN_bridging_belts: "Преодоление пояса"
 DEN_bridging_belts_desc: "Промышленные инновации открыли новые возможности для предприятий в плане увеличения их пропускной способности за счет совместной работы, для того чтобы начать этот переход, нам необходимо наладить связь с нашими предприятиями посредством расширения инфраструктуры."
 DEN_danish_economic_growth: "Датский экономический рост"
 DEN_danish_economic_growth_desc: "Наши экономические проекты оживили нашу экономику и восстановили веру в наше управление, и мы можем осуществить несколько заключительных проектов, которые мы сможем централизовать и укрепить этот рост для обеспечения дальнейшего процветания."
 DEN_fund_copenhagen_university: "Фонд Копенгагенского университета"
 DEN_fund_copenhagen_university_desc: "Развитие страны может измеряться ее интеллигенцией, с тем чтобы увеличить наши показатели, мы должны предоставить Копенгагенскому университету дополнительное финансирование."
 DEN_support_cbs: "Поддержка КБС"
 DEN_support_cbs_desc: "Для того чтобы стать более цивилизованной и развитой культурой, нам нужно вложить значительные средства в институты, которые создают этих людей."
 DEN_support_nordisk_film: "Поддержка фильма Nordisk"
 DEN_support_nordisk_film_desc: "Скандинавская культура долгое время оставалась в тени более популярных фильмов, но время для этого изменилось."

 DEN_modernize_haeren: "Модернизация Херен"
 DEN_modernize_haeren_desc: "Датский Херен по-прежнему опирается на устаревшую тактику десятилетий назад, если мы хотим выжить в эту новую эпоху войны, нам нужно будет предпринять согласованные усилия по модернизации и реорганизации армии, с тем чтобы противостоять великим странам Европы."
 DEN_defensive_force: "Силы обороны"
 DEN_defensive_force_desc: "Природная география Дании оставляет нас открытыми для нападения со многих сторон, мы должны быть готовы защищать нашу территорию и заставить наших врагов истекать кровью за каждый метр земли."
 DEN_new_danevirke: "Новый Даневирке"
 DEN_new_danevirke_desc: "Военные игры и военные маневры являются примером нашего мягкого подобия. чтобы удержать наших врагов от нападения на нас."
 DEN_artillary_defences: "Артиллерийская оборона"
 DEN_artillary_defences_desc: "Как показывают поля Фландрии, артиллерию можно использовать не только для того, чтобы разрушить способность врагов вести войну, но и для того, чтобы деморализовать их и нарушить их волю к борьбе."
 DEN_fortify_sjaelland: "Укрепить Шелландию"
 DEN_fortify_sjaelland_desc: "Датское королевство расположено вокруг Сьельленда, но у острова ощущается острая нехватка средств обороны."
 DEN_hjemmevaernet: "Hjemmevärnet"
 DEN_hjemmevaernet_desc: "Hjemmevärnet или"Home Guard" are an elite group of soldiers under a special command structure, trained in defensive warfare and highly knowledgeable of the terrain in which they operate, they will serve as our last line of defense should the inevitable ever occur..."
 DEN_defend_our_morale: "Мораль Болстера"
 DEN_defend_our_morale_desc: "Датский народ не знает ужасов современной войны: пулеметы, горчичный газ и несовместимое руководство."
 DEN_experiment_with_offense: "Эксперимент в целях защиты"
 DEN_experiment_with_offense_desc: "Датские военные довольно малы по сравнению с соседями, но это не означает, что мы должны исключить идею нападения вообще."
 DEN_modern_equipment: "Современное оборудование"
 DEN_modern_equipment_desc: "Большая часть датского арсенала устарела, и некоторые дивизии даже частично оснащены оружием еще двадцать лет назад."
 DEN_new_doctrines: "Новые доктрины"
 DEN_new_doctrines_desc: "Более молодые офицеры привносят новые идеи и вместе с ними открывают новые возможности для изучения новых доктрин, которые могут дать нам стратегические преимущества в борьбе."
 DEN_establish_jaegerkorpset: "Создать Jègerkorpset"
 DEN_establish_jaegerkorpset_desc: "Jägerkorpset — лучший из лучших в датской армии, предназначенный для хирургических ударов, чтобы разоблачить слабость и разбить врага. Правильное использование этой новой армии позволит нам уничтожить даже самых могущественных врагов."
 DEN_marine_regiment: "Морской полк"
 DEN_marine_regiment_desc: "Дания окружена морем, однако наши морские пехотинцы крайне недооценены."
 DEN_contra_terror_operations: "Операции по борьбе с повстанцами"
 DEN_contra_terror_operations_desc: "Последнее, что нужно армии во время войны, это предательство сзади, мы должны быть в состоянии эффективно подавлять партизанские операции, чтобы держать нашу армию на пике боевого потенциала."
 DEN_faldskaerm_regiment: "Полк Фальдскёрм"
 DEN_faldskaerm_regiment_desc: "Паратроперы - это новое и новаторское военное подразделение с исключительной дальностью и боевой способностью."
 DEN_well_trained_army: "Хорошо обученная армия"
 DEN_well_trained_army_desc: "Более строгая дисциплина в армии укрепит наши прошлые улучшения и навсегда оживит их, а обучение нашей армии, насколько это возможно, позволит нам максимально использовать имеющиеся у нас ограниченные ресурсы."

 DEN_modernize_sjaellandske_flyverafdeling: "Модернизация Flyverafdeling Själlandske"
 DEN_modernize_sjaellandske_flyverafdeling_desc: "Шелланд является сердцевиной датской авиации, и для того, чтобы облегчить расширение наших военно-воздушных сил, нам нужно будет вложить средства в расширение авиадиспетчерской деятельности на острове."
 DEN_modernize_jyllandske_flyverafdeling: "Модернизация Flyverafdeling Jyllandske"
 DEN_modernize_jyllandske_flyverafdeling_desc: "Военно-воздушные силы состоят из многих самолетов, и многие самолеты нуждаются в большой администрации, чтобы удержать их все в порядке. Расширение Jyllandske Flyverafdeling даст нам больший потенциал управления над военно-воздушными силами."
 DEN_expand_haerens_flyvertropper: "Расширить фливертроп"
 DEN_expand_haerens_flyvertropper_desc: "Более тесное сотрудничество между нашей армией и военно-воздушными силами, а именно расширение Херенс-Флайвертроп, даст нам возможность нанести удар по нашим врагам с большой дистанции и создать новые стратегические возможности."
 DEN_modernize_marinens_flyvevaesen: "Модернизация морских пехотинцев"
 DEN_modernize_marinens_flyvevaesen_desc: "Навист - это сердце любой национальной армии, и преимущество, связанное с тем, что самолет находится в флоте, не может быть занижено."
 DEN_modern_seaplanes: "Современные морские самолеты"
 DEN_modern_seaplanes_desc: "Использование самого океана в качестве посадочной полосы даст нам беспрецедентную мобильность и гибкость, позволив нам нанести удар в любом месте, которое наш флот может достать для пополнения запасов."
 DEN_united_air_force: "Объединенное воздушное командование"
 DEN_united_air_force_desc: "Укрепление руководства военно-воздушными силами позволит нашим различным эскадрильям работать в более тесном взаимодействии."
 DEN_go_on_offensive: "Продолжайте наступление"
 DEN_go_on_offensive_desc: "В то время как наши враги заправляют и ремонтируют, мы наносим удар, когда наши враги путешествуют ночью, мы сияем светом, удерживая наших врагов на оборонительных позициях и отказываясь предоставить им какие-либо возможности для контратаки, мы можем покорить их с минимальными потерями."
 DEN_purely_defensive: "Лишь защитник"
 DEN_purely_defensive_desc: "Принуждение врага к сражению на наших условиях в воздухе даст нам выдающееся преимущество. Мы, возможно, не зайдем далеко, но мы превзойдем и оппоненты."
 DEN_modernize_air_force_docrines: "Модернизация доктрины военно-воздушных сил"
 DEN_modernize_air_force_docrines_desc: "Великая война стала свидетелем появления воздушной доктрины и организованной воздушной войны, но достижения в стратегии и технологии сделали тактику старой устаревшей."

 DEN_modernize_sovaernet: "Модернизация Sövärnet"
 DEN_modernize_sovaernet_desc: "Наш военно-морский флот является гордостью страны и центральным элементом наших военных операций, а обновление и модернизация нашего военно-морского оборудования позволит этому военно-морскому флоту не только вселить надежду, но и действовать в качестве эффективной боевой силы."
 DEN_hangarskib_project: "Проект Хангарскиб"
 DEN_hangarskib_project_desc: "Перевозка мощных летательных аппаратов на большие расстояния всегда была тревожной проблемой для наших военных, однако развитие новых воздушных судов сделает этот вопрос гораздо более простым."
 DEN_naval_bombers_focus: "Морские бомбардировщики"
 DEN_naval_bombers_focus_desc: "Способность безнаказанно ударить с неба вражеских мореплавателей является бесценным преимуществом и тем, на что мы должны сосредоточить наши усилия."
 DEN_destroyer_investments: "Уничтожение инвестиций"
 DEN_destroyer_investments_desc: "Уничтожители - это самые простые суда для наших верфей для производства на основе имеющихся у нас материалов, и поэтому мы должны обеспечить, чтобы мы были в состоянии производить их в короткие сроки."
 DEN_focus_surface_fleet: "Сосредоточьтесь на поверхностном флоте"
 DEN_focus_surface_fleet_desc: "Наш наземный флот является наиболее способной боевой силой в датских вооруженных силах, и мы должны обеспечить, чтобы они были в достаточной степени оснащены и оснащены всем необходимым для проведения своих операций."
 DEN_pride_danish_navy: "Гордость Датского военно-морского флота"
 DEN_pride_danish_navy_desc: "Каждому военно-морскому флоту нужен флагман, чтобы сплотиться и скоординироваться, а наш не отличается."
 DEN_continue_danish_ubaad: "Продолжайте с датским Убодом"
 DEN_continue_danish_ubaad_desc: "Удары из невидимого места могут привести к разрушительным результатам в жаре боя, так как разработка нашей подводной программы должна быть первоочередной задачей."
 DEN_harass_the_tradelines: "Закрыть торговые линии"
 DEN_harass_the_tradelines_desc: "Война - это нечто большее, чем бессмысленное избиение вашего врага, пока они не сдадутся, не отключат свои линии поставок и не запугают торговлю, что деморализует население и подтолкнет его к дальнейшей капитуляции."
 DEN_expand_kobenhagen_dockyards: "Расширить копенгагенские дворы"
 DEN_expand_kobenhagen_dockyards_desc: "Наши столичные верфи, к сожалению, не оснащены для того, чтобы справиться с крупными мореплавателями современной эпохи, нам нужно будет расширить эти верфи, чтобы должным образом обслуживать наш флот."
 DEN_uphold_naval_modernization: "Модернизация военно-морских сил"
 DEN_uphold_naval_modernization_desc: "Наши проекты модернизации были весьма успешными, но мы не должны останавливаться сейчас."

 DEN_military_industry: "Возрождение военной промышленности Шлезвиг"
 DEN_military_industry_desc: "Несмотря на то, что Шлезвиг, безусловно, не является центром прусской промышленности, как Рейн, он занимает свое место в германской войне, и мы должны воспользоваться этой возможностью и вооружиться, возродив военные предприятия, расположенные в регионе."

 DEN_develop_holstein: "Гольштейн инвестментс"
 DEN_develop_holstein_desc: ""
 DEN_develop_hamburg: "Строительство в Гамбурге"
 DEN_develop_hamburg_desc: ""
 DEN_fortify_southern_border: "Укрепить германскую границу"
 DEN_fortify_southern_border_desc: ""

 DEN_shrink_army: "Уменьшить воинскую обязанность"
 DEN_shrink_army_desc: "Достаточно того, что лучшие из наших молодых людей ввергаются в армию и истощаются из-за их обширных обязанностей, которые более не являются необходимыми для выполнения, мы должны в какой-то степени повысить профессиональную квалификацию военных, с тем чтобы обеспечить как их компетентность, так и будущее для нашей молодежи, которая в то время находилась в состоянии ужасов войны."
 DEN_new_recruits: "Позвоните новым рекрутам"
 DEN_new_recruits_desc: "С социализмом на нашем Севере и на востоке, шведскими угрозами нашему Северу, реваучистским немцам на нашем Юге мы действительно окружены потенциальными врагами со всех сторон. Мы должны призвать новых людей, свежих людей, освободить от усталых, не выбрасывая ребенка с водой в ванну, полностью избавив себя от поручительства."
 DEN_the_grand_army: "Огромная сила"
 DEN_the_grand_army_desc: "Немногие считают Данию страной, обладающей потенциалом Великой державы, однако с интенсивной программой вербовки мы можем создать силу не только для того, чтобы противостоять иностранным угрозам, но и для того, чтобы позволить нам вступить в ряды Великих держав Европы."
 DEN_reinstill_morale: "Восстановить мораль"
 DEN_reinstill_morale_desc: "С новыми новобранцами, замещающими действительно истощенные силы, мы должны следить за тем, чтобы те, кого не заменили, обладали здравым нравом, более совершенным снаряжением, менее обширными обязанностями, более компетентным руководством, всем, что завоюет сердца и умы солдат."
 DEN_spartan_force: "Профессионализация военных"
 DEN_spartan_force_desc: "Несмотря на то, что наша обширная программа призыва на военную службу хорошо служила нам в том, что касается поддержания порядка в Кильском районе, она утратила свою полезность, и сейчас нам нужна не огромная сила гражданских лиц в форме, а сила настоящих специалистов, которые будут сражаться с любым врагом на поле боя."
 DEN_rebuild_force: "Восстановление военного компонента"
 DEN_rebuild_force_desc: "Благодаря нашей программе призыва на более низкий уровень мы можем обеспечить более высокий уровень профессионализма тех, кто служит, привлекая при этом новых новобранцев для замены тех, кто устал от выполнения своих обязанностей."

 ## Democracy ##
 DEN_aftermath_kanslergade_meeting: "Последствие встречи в Канслергаде"
 DEN_aftermath_kanslergade_meeting_desc: "Современная датская социальная система возникла на Канслергадской встрече 1933 года, и мы должны сосредоточить наши усилия на совершенствовании этой программы, с тем чтобы мы могли лучше служить народу."
 DEN_snap_elections: "Выборы в Снэп"
 DEN_snap_elections_desc: "Необходимо немедленно созвать новые выборы для восстановления порядка и содействия возвращению к естественному порядку!"

 DEN_stauning_munch_government_continues: "Правительство по-прежнему остается в силе"
 DEN_stauning_munch_government_continues_desc: "Социал-демократы смогли руководить Данией в опасный период в истории, и продолжение их правительства обеспечит это дальнейшее процветание."
 coalition_social_liberal: "Избрана Социал-либерально-социальная демократическая коалиция"
 DEN_stauning_eller_kaos: "Потопляющий Эллер Каос"
 DEN_stauning_eller_kaos_desc: "Дания окружена хаосом как внутри страны, так и за ее пределами, и поэтому важно, чтобы ставшее правительство было стабильным, способным защитить Данию от хаоса."Stauning Eller Kaos"."
 DEN_weaken_monarchs_power: "Сокрушить силу монарха"
 DEN_weaken_monarchs_power_desc: "События 1920-х годов показали нам недостатки сильной монархии, если мы хотим достичь внутренней стабильности, мы должны ослабить власть монарха и передать ее в руки народа."
 DEN_integrate_back_republicans: "Реинтегрировать республиканцев"
 DEN_integrate_back_republicans_desc: "Единое правительство - это сильное правительство, если мы сможем репатриировать республиканскую базу в нашей стране, мы сможем действовать более эффективно."
 DEN_voice_for_peace: "Голос за мир..."
 DEN_voice_for_peace_desc: "Время войны подходит к концу, и спорные вопросы будут решаться с помощью правовых и мирных средств, с тем чтобы не было необходимости проливать кровь."
 DEN_and_against_extremism: "...и против экстремизма"
 DEN_and_against_extremism_desc: "Те, кто желает подорвать нас, не должны разрушать основы демократии, экстремисты будут искоренены там, где их найдут, и будут поощряться демократические принципы."
 DEN_social_justice: "Социальная справедливость"
 DEN_social_justice_desc: "Люди должны чувствовать, что их правительство является одним из принципов справедливости и долга, мы должны обеспечить, чтобы наша правовая основа была создана для удовлетворения потребностей современного общества."

 DEN_temporary_lockout_strike_ban: "Временное блокирование и запрещение забастовки"
 DEN_temporary_lockout_strike_ban_desc: "Хотя свобода выражения мнений имеет важное значение, и власть никогда не должна быть вырвана из рук народа, есть времена, когда правительство должно занять твердую позицию и делать то, что правильно."
 DEN_steinckes_reforms: "Реформы Штейнке"
 DEN_steinckes_reforms_desc: "Штейнке имеет на это право: мы должны обеспечить более широкую систему безопасности, чтобы ни один датчанин не упал сквозь трещины."
 DEN_unemployment_benefits: "Пособия по безработице"
 DEN_unemployment_benefits_desc: "Расширение и расширение пособий по безработице является самым простым способом сокращения масштабов нищеты в середине этого экономического кризиса."
 DEN_new_social_laws: "Новые социальные законы"
 DEN_new_social_laws_desc: "Для того чтобы не утонуть в стране в целом, необходимо создать новые системы социальной защиты, с тем чтобы наш народ был на плаву во время этого кризиса."
 DEN_keynesian_economics: "Кейнсианская экономика"
 DEN_keynesian_economics_desc: "Мы должны оценить и серьезно рассмотреть новые труды лучших мировых экономистов, включая Джона Мейнарда Кейнса."
 DEN_provide_public_works: "Обеспечение общественных работ"
 DEN_provide_public_works_desc: "Создание программ общественных работ должно помочь снизить уровень безработицы в нашей стране."
 DEN_devaluation: "Девальвация"
 DEN_devaluation_desc: "Несмотря на то, что девальвация нашей валюты, возможно, является хорошим способом выдержать этот экономический кризис."
 DEN_gaeldskonvertering: "Гельдсконвертеринг"
 DEN_gaeldskonvertering_desc: "Практика Гельдсконвертеринга, или "пересчет долга", является еще одним способом, который мы должны изучить, чтобы облегчить наш национальный долг и долги нашего народа."
 DEN_denmark_recovered: "Дания восстановлена!"
 DEN_denmark_recovered_desc: "Сегодня датская экономика вновь находится на высоком уровне, мы оправились от самого тяжелого экономического кризиса в истории, и наш народ стал еще сильнее."

 DEN_left_wing_coalition: "Коалиция левого крыла"
 DEN_left_wing_coalition_desc: "С приходом к власти левой коалиции Дания может, наконец, попытаться устранить серьезный ущерб, причиненный ей теми, кто приходил ранее."
 coalition_libertarian_socialist: "Избрана коалиция левого крыла"
 DEN_nationalize_influensial_firms: "Национализация влиятельных фирм"
 DEN_nationalize_influensial_firms_desc: "Национализировав влиятельные фирмы и поставив их под непосредственный контроль нашего правительства, мы можем направлять восстановление страны гораздо быстрее и эффективнее."
 DEN_meet_republican_demands: "Выполнение республиканских требований"
 DEN_meet_republican_demands_desc: "Хотя республиканцы могут быть экстремальными, их сотрудничество крайне важно для нашей рабочей коалиции."
 DEN_limit_capitalist_exploits: "Ограничить капиталистические взрыватели"
 DEN_limit_capitalist_exploits_desc: "Неконтролируемый капитализм создал этот экономический кризис и почти разрушил Данию."
 DEN_empower_unions: "Расширение прав и возможностей профсоюзов"
 DEN_empower_unions_desc: "Профсоюзы трудящихся являются основой рабочего класса в Дании и во всем мире."
 DEN_new_denmark: "A Новая Дания"
 DEN_new_denmark_desc: "Мы успешно реорганизовали Данию в левый рай, и предстоит еще многое сделать для того, чтобы уменьшить ущерб, нанесенный стране за последние несколько десятилетий, но в этот раз мы на верном пути."

 DEN_liberal_return: "Либеральное возвращение"
 DEN_liberal_return_desc: "Несмотря на все трудности, либералы вернулись к власти в Дании, но у нас нет времени праздновать; мы должны приступить к работе по исправлению нашей нынешней ситуации."
 DEN_for_individual_man: "Для отдельного человека"
 DEN_for_individual_man_desc: "Датский человек является самым жизнестойким в мире, и мы должны бороться за них и защищать их нацию."
 DEN_strengthen_agricultural_sector: "Укрепление сельскохозяйственного сектора"
 DEN_strengthen_agricultural_sector_desc: "Датский сельскохозяйственный сектор особенно серьезно пострадал в результате недавнего экономического кризиса, и, поддерживая его, мы не только сэкономим тысячи рабочих мест, но и сохраним столь необходимые источники продовольствия."
 DEN_anti_extremism: "Противоядие к экстремизму"
 DEN_anti_extremism_desc: "Экстремизм процветает во времена хаоса. Мы должны обеспечить, чтобы этого не произошло. Ограничивая деятельность крайне левых и правых крыльев, мы можем обеспечить плавное и, кроме того, стабильное восстановление."
 DEN_protect_our_freedom: "Защищайте нашу свободу"
 DEN_protect_our_freedom_desc: "Датская свобода должна находиться на переднем крае наших усилий."

 DEN_relieving_farmers: "Религия фермеров"
 DEN_relieving_farmers_desc: "Датские фермеры составляют основу нашего сельскохозяйственного сектора."
 DEN_token_reforms: "Токеновые реформы"
 DEN_token_reforms_desc: "Хотя народ может потребовать гигантских реформ датской экономики для смягчения экономической катастрофы, мы не можем позволить себе уступить каждому спросу."
 DEN_strengthen_krone: "Укрепить Krone"
 DEN_strengthen_krone_desc: "Несмотря на то, что левые хотят девальвировать нашу валюту, ее ценность должна быть повышена, если мы хотим сохранить ее на международной арене."
 DEN_enact_austerity_messures: "Применить меры жесткости"
 DEN_enact_austerity_messures_desc: "Хотя, возможно, было бы заманчиво вкладывать все деньги правительства в программы социальной защиты и восстановления, мы должны подходить к этому экономическому кризису с осторожностью и позволить свободному рынку исправиться."
 DEN_cut_subsidies: "Сокращение субсидий"
 DEN_cut_subsidies_desc: "Субсидии, предоставляемые правительством неуправляемым предприятиям, представляют собой пустую трату средств налогоплательщиков."
 DEN_limit_union_activities: "Предельная деятельность Союза"
 DEN_limit_union_activities_desc: "Профсоюзы уже давно подрывают способность рынка к самовосстановлению и обеспечению процветания, и только путем ограничения профсоюзной деятельности мы можем обеспечить беспрепятственное урегулирование этого кризиса."
 DEN_increased_taxes: "Увеличение налогов"
 DEN_increased_taxes_desc: "Хотя он может и не быть популярным среди нашего народа, повышение налогов является необходимым шагом для того, чтобы восполнить наши казны и ускорить выход из этого кризиса."
 DEN_attract_foreign_investors: "Привлечение иностранных инвесторов"
 DEN_attract_foreign_investors_desc: "Для сохранения промышленности на всей территории Дании необходимы иностранные инвестиции."
 DEN_through_the_storm: "Через бурю!"
 DEN_through_the_storm_desc: "Дания будет нести шрамы этого кризиса в течение долгого времени, но рынок сам себя исправил, и мы обречены на новую эру экономического процветания."

 DEN_conservative_wave: "Консервативная волна"
 DEN_conservative_wave_desc: "Рост патриотического и консервативного правительства привел к волне консервативной поддержки со стороны нашего населения, при этом консервативная политика и доверие к правительственным выборам были выше, чем когда-либо."
 DEN_for_nation_and_tradition: "Для нации и традиций"
 DEN_for_nation_and_tradition_desc: "Мы не должны слишком быстро прыгать в этот храбрый новый мир, вместо этого мы должны доверять нашим традиционным институтам и нашей национальной гордости."
 DEN_support_monarch: "Поддержать монарха"
 DEN_support_monarch_desc: "Социал-демократы приблизились к тому, чтобы превратить Данию в республику, только один шаг от коммунизма!"
 DEN_red_scare: "Красный страх"
 DEN_red_scare_desc: "Красные повсюду, в каждом переулке и во всех канализации, планирующих свергнуть нас, мы должны обеспечить, чтобы люди знали об этой экзистенциальной угрозе, если мы хотим защитить их."
 DEN_stronger_defence: "Более сильная защита"
 DEN_stronger_defence_desc: "Старых методов защиты людей уже недостаточно, и нам придется принять новые меры для обеспечения безопасного продолжения нашего общества."

 ## Monarchy ##
 DEN_lyksborg_coup: "Кубок Лайксборга"
 DEN_lyksborg_coup_desc: "Король будет восстановлен в своем законном положении в Датском королевстве, и контроль будет отброшен от тиранов, которые хотят доминировать и контролировать нас ради своих собственных злобных желаний."
 DEN_return_of_king: "Возвращение короля"
 DEN_return_of_king_desc: "Истинному королю Дании пора вернуться на трон. Мы не должны презирать царствование короля Фредерика IX, но он не был законным королем. Наконец, мы можем вернуть Царя Кристиана Х на его трон."
 DEN_target_enemies_monarchy: "Нацелиться на врагов монархии"
 DEN_target_enemies_monarchy_desc: "Многие хотят, чтобы монархия свергла их, чтобы они могли захватить власть для себя, и наш долг как слуги короля - обеспечить, чтобы никто не мог причинить ему вред."
 DEN_alliance_with_church: "Альянс с церковью"
 DEN_alliance_with_church_desc: "Датская церковь имеет долгую и крепкую историю в нашем национальном сознании, и создание альянса с ними даст нам больше власти и контроля над событиями внутри наших границ."
 DEN_establish_civilian_government: "Создание гражданского правительства"
 DEN_establish_civilian_government_desc: "Обеспечение сотрудничества народа имеет первостепенное значение для успеха нашего правительства; поэтому мы должны создать гражданские институты для более эффективного управления."
 DEN_weaken_kobenhagens_power: "Власть Копенгагена"
 DEN_weaken_kobenhagens_power_desc: "Нельзя недооценивать власть столицы над политикой Дании, если мы действительно хотим восстановить национальную стабильность, мы должны отобрать власть у этого централизованного района."
 DEN_promote_traditionalism: "Поощрять традиционализм"
 DEN_promote_traditionalism_desc: "Если мы хотим полностью восстановить монархию, мы должны также восстановить традиционные ценности и культуру, которые сопровождали ее."
 DEN_restore_relationship_with_son: "Восстановите отношения с Сыном"
 DEN_restore_relationship_with_son_desc: "Наследный принц Дании - это будущее нации, мы должны восстановить отношения королевской семьи с ним, а также с общественностью, чтобы обеспечить мир и процветание на предстоящие десятилетия."
 DEN_restore_navy_loyalty: "Возвращение верности ВМФ"
 DEN_restore_navy_loyalty_desc: "Военно-морские силы должны быть преданы монархии, если мы хотим долго оставаться у власти."
 DEN_restore_royal_honour: "Возвращение королевской чести"
 DEN_restore_royal_honour_desc: "На протяжении последних нескольких десятилетий республиканцы втягивали в грязь честь, которую они когда-то испытывали с монархией, и мы должны стремиться к ее восстановлению, если мы хотим оставаться законными правителями Дании."

 DEN_implement_austerity: "Ожесткость"
 DEN_implement_austerity_desc: "Хотя, возможно, было бы заманчиво вкладывать все деньги правительства в программы социальной защиты и восстановления, мы должны подходить к этому экономическому кризису с осторожностью и позволить свободному рынку исправиться."
 DEN_relieve_farmers: "Успокой фермеров"
 DEN_relieve_farmers_desc: "Хотя меры жесткой экономии должны применяться к большинству секторов датской экономики, мы должны субсидировать наших фермеров и оказывать им помощь, с тем чтобы они не потерпели неудачу под давлением этой экономической катастрофы."
 DEN_higher_corn_tariffs: "Высшие тарифы на кукурузу"
 DEN_higher_corn_tariffs_desc: "Понижение тарифов на кукурузу заставит нас полагаться на собственных фермеров и сельскохозяйственный сектор, что крайне необходимо для того, чтобы выйти из кризиса."
 DEN_break_up_dangerous_unions: "Разрушить опасные союзы"
 DEN_break_up_dangerous_unions_desc: "Не все профсоюзы трудящихся опасны, но есть те, кто стремится подорвать наше правительство и еще больше разрушить нашу экономику."
 DEN_emergency_taxes: "Чрезвычайные налоги"
 DEN_emergency_taxes_desc: "Для того, чтобы уменьшить ущерб от экономической депрессии, нужны чрезвычайные налоги, но людям они не понравятся, но, выставляя их в качестве временного повышения, только мы можем выиграть достаточно поддержки, чтобы утихомирить массы."
 DEN_corporatist_transformation: "Корпоративная трансформация"
 DEN_corporatist_transformation_desc: "Преобразование Дании в корпоратистское государство будет медленным, но мы должны сделать возможным принятие законодательства, облегчающего функционирование рынков."
 DEN_conservative_social_laws: "Консервативное социальное законодательство"
 DEN_conservative_social_laws_desc: "Осуществление консервативных социальных законов необходимо для сохранения естественного порядка монархии, и мы должны сделать это быстро и эффективно, если мы хотим контролировать Данию."
 DEN_development_for_common_goal: "Разработка для достижения общей цели"
 DEN_development_for_common_goal_desc: "Все в Дании - монархисты или нет - преследуют одну и ту же цель экономического восстановления."
 DEN_new_danish_economy: "Новая датская экономика"
 DEN_new_danish_economy_desc: "Мы успешно преодолели эту экономическую депрессию, создав новую и процветающую датскую экономику."

 ## Revolution ##
 DEN_danish_revolution: "Датская революция"
 DEN_danish_revolution_desc: "Датский народ сыт по горло, и переворот в Ликсборге стал последней каплей, народ Дании больше не будет жить под гнетом монархии и своих приятелей, поднимай свободный народ Дании!"

 DEN_republican_dominance: "Республиканское доминирование"
 DEN_republican_dominance_desc: "Революция сделала республиканцев подлинными арбитрами народа Дании, только установив абсолютный контроль, мы сможем защитить Данию."
 DEN_trial_against_lyksborg: "Судебный процесс против Лайксборга"
 DEN_trial_against_lyksborg_desc: "Переворот Лаксборга был посягательством на датские ценности, нападением на датского рабочего!"
 DEN_strengthen_republican_sentiments: "Укреплять республиканские чувства"
 DEN_strengthen_republican_sentiments_desc: "Республиканцы никогда не были слишком популярны в Дании. Мы должны работать над тем, чтобы завоевать сердца и умы датского народа, если мы хотим эффективно управлять им."
 DEN_encourage_thermidorianist_groups: "Поощрять термидористские группы"
 DEN_encourage_thermidorianist_groups_desc: ""
 DEN_liberties_for_danish_people: "Свобода для датского народа"
 DEN_liberties_for_danish_people_desc: "Датский народ, и в особенности датский рабочий, на протяжении веков страдал от корпоратизма и монархизма, и мы должны обеспечить их неотъемлемые свободы, прежде чем они будут полностью забыты."
 DEN_danish_laicism: "Датский лайцизм"
 DEN_danish_laicism_desc: "Церковь не имеет места в нашем правительстве! чтобы стать действительно свободной нацией, мы должны снять оковы Церкви и утвердить нашу независимость от них."
 DEN_danish_republic: "Датская Республика"
 DEN_danish_republic_desc: "Новая Датская Республика станет маяком надежды для всего мира и европейской драгоценности кроны."

 DEN_recover_from_capitalism: "Возвращение из капитализма"
 DEN_recover_from_capitalism_desc: "Годы капиталистической эксплуатации превратили нашу страну в голодную шкуру, и мы должны действовать быстро, чтобы обратить вспять эти разрушения, если мы хотим пережить предстоящие войны."
 DEN_sieze_capitalist_wealth: "Избавься от богатства"
 DEN_sieze_capitalist_wealth_desc: "Остается большое количество материалов и товаров, которые были скоплены капиталистами, когда они грабили нашу страну, мы должны перераспределить это богатство тем, кто в нем нуждается."
 DEN_provide_unemployment_benefits: "Выплата пособий по безработице"
 DEN_provide_unemployment_benefits_desc: "Оказание помощи тем, кто не в состоянии найти работу, поможет поднять наше общество выше других, кто вместо этого смотрит свысока на менее удачных."
 DEN_public_housing: "Государственное жилье"
 DEN_public_housing_desc: "Спать на улицах - это не путь к жизни, чтобы обеспечить нашим гражданам безопасное и надежное место, чтобы позвонить домой, будет способствовать повышению производительности и сокращению преступности."
 DEN_control_over_economy: "Контроль над экономикой"
 DEN_control_over_economy_desc: "Свободный рынок вновь и вновь доказал свою нестабильность и ненадежность как средство экономического управления, нам потребуется полный экономический контроль для обеспечения стабильности и процветания для всех."
 DEN_nationalize_industries: "Национализация промышленности"
 DEN_nationalize_industries_desc: ""
 DEN_public_works_programs: "Программы общественных работ"
