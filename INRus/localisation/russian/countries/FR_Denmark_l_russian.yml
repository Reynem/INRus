 ###EVENTS###
 denmark.1.t: "Королевство Дания"
 denmark.1.d: "В начале XX века Дания вступила в эру перемен, становясь современной страной. Власть монархии была поставлена под сомнение, и расширенное избирательное право обеспечило переход к подлинной демократии. Несмотря на то, что после Великой войны сумевший суметь осел, Датскому народу была предоставлена возможность вернуть землю. Но два плебисцита, проведенные в северной части Шлезвига, также стали источником кризиса в датской политике, когда король Дании Кристиан X уволил правительство, когда правительство отказалось объявить новые выборы. При поддержке вооруженных сил и политических правых сил, король не подчинился этому давлению. В конце концов, кризис завершился оккупацией Дании Шлезвиг-Хольштейном и новыми выборами. Несмотря на то, что кризис закончился победой правых, он быстро развился в другом направлении. Десанты-демократы также поднялись в левых социальных демократах и коммунистических кругах, а также популярностью этих партий. После создания Норвежской Республики в 1927 году социал-демократы выдвинули предложение о проведении аналогичного референдума на монархисанском языке. Однако этот кризисный кризис, который произошел с династился с династикой династикой династика в 1929ских . Однако, с династикой династика династика в династика в династика в династике становилась в ."
 denmark.1.a: "Дер и индигт приземлиться!"

 denmark.2.t: "Грундловсдаген"
 denmark.2.d: "В Дании вновь отмечается День Конституции, который имеет большое значение, поскольку в 1849 году была подписана Конституция, в результате чего страна перешла от абсолютной монархии к конституционной монархии, хотя этот день не является официальным национальным днем, его видят многие датчане."
 denmark.2.a: "Датская долгая жизнь!"

 denmark.4.t: "Республиканские протесты в день рождения короля"
 denmark.4.d: "В связи с празднованием дня рождения короля Фредерика IX он был встречен организованным демонизмом сторонниками республиканской партии. В то время как празднование продолжалось, как обычно, республиканское движение получило еще один шанс распространить свою пропаганду в Дании."
 denmark.4.a: "Кучка норвежских куклов!"

 denmark.5.t: "Антидатские протесты в Шлезвиг-Гольштейне"
 denmark.5.d: "После Дня Конституции в Шлезвиг-Гольштейне усилились протесты против Дании."
 denmark.5.a: "Немцы - немцы, полагаю,"

 denmark.6.t: "Крушение Лондонского фондового рынка"
 denmark.6.d: "Новости о Лондонском фондовом рынке прибыли в Данию, и вместе с отрицательными последствиями катастрофы, так как датская экономика связана с Соединенным Королевством и Францией через торговлю и экспорт, это будет плохим предзнаменованием для Дании и для народа."
 denmark.6.a: "Датская ложь, разбитая"

 denmark.7.t: "Выборы в пристанище"
 denmark.7.d: "Выборы в Ландтинг, верхнюю палату датского парламента, уже прошли. Сегодня тысячи датчан голосуют за избирателей, которые примут решение о том, кто будет сидеть в Ландстинге. В то время как выборы проходят в соответствии с планом, недавно появившийся экономический кризис запятнал популярность социал-демократов, оставив правительство с меньшинством в этом доме. Это усложнит задачу нашего правительства справиться с экономическим кризисом, поскольку нам нужно большинство в обоих камбалах."
 denmark.7.a: "Почему это произошло сейчас?"

 denmark.8.t: "Укреплять республиканские чувства"
 denmark.8.d: "Республиканские настроения в Дании стали сильнее, вызывая все больше волнений в нашей стране."
 denmark.8.a: "Эти проклятые республиканцы!"

 denmark.9.t: "Слабые республиканские чувства"
 denmark.9.d: "Республиканские настроения в Дании стали слабее, будучи менее проблематичными для нашего правительства."
 denmark.9.a: "Это покажет им"

 denmark.10.t: "Шлезвиг-Гольштейн в Риоте"
 denmark.10.d: "После экономического кризиса в Дании все регионы нашей страны были разрушены, включая Южный Илланд, а также город Шлезвиг-Гольштейн. С ростом безработицы в городе и усилением повседневной жизни, наряду с сильным немецким национализмом, многие люди приняли решение совершить преступление и присоединиться к валькистским террористическим ячейкам. С ростом числа грабежей, попыток совершения убийств и краж городу становится еще более опасным, чем когда-либо прежде."
 denmark.10.a: "Шлезвиг-Гольштейн горит..."

 denmark.11.t: "Армия принимает власть в Шлезвиг-Гольштейне"
 denmark.11.d: "В то время как Шлезвиг-Гольштейн считается городом, оккупированным многими, он все еще имеет некоторое местное самоуправление, в соответствии с другими местными общинами в Дании. На протяжении большей части своей истории при датском правлении представительный совет города управляется широкой коалицией датских партий и регионалистов, с тем чтобы удержать про-германские партии. Это несколько упростило ситуацию с тем фактом, что многие немцы не голосуют. ~n n Today местное самоуправление Шлезвиг-Гольштейна было введено в историю, поскольку армия взяла под свой контроль город и район вокруг представительного совета."
 denmark.11.a: "Демократия в Шлезвиг-Гольштейне"

 denmark.12.t: "Встреча с оппозицией?"
 denmark.12.d: "С учетом того, что Дания сейчас охвачена экономическим кризисом, наша работа состоит в том, чтобы разработать план восстановления страны, однако, учитывая выборы в Ландстинг, эта цель представляется менее достижимой, не приближаясь к оппозиционным партиям. Несмотря на то, что премьер-министр Торвальд Стаунинг должен решить, собирается ли он обратиться к оппозиционной партии &quot; Венстр &quot; , чтобы прийти к соглашению."
 denmark.12.a: "Пусть начнутся переговоры!"
 denmark.12.b: "Никакого совпадения с правым!"

 denmark.13.t: "Встреча в Канслергаде"
 denmark.13.d: "Делегаты как правительства, так и оппозиционной партии Венстр собрались сейчас в доме премьер-министра Стаунинга в Канслергаде. Мы надеемся, что вместе сможем прийти к соглашению о том, как мы сможем справиться с экономическим кризисом в Дании. Мы надеемся, что политики из Венстра договорятся о том, как кризис нанесет ущерб датскому сельскому хозяйству и как наш план поможет датским фермерам."
 denmark.13.a: "Что нужно, чтобы прийти к соглашению?"
 denmark.13.b: "Не жди, что мы будем в компромисе."

 denmark.14.t: "Успех в Канслергаде"
 denmark.14.d: "Хотя переговоры были непростыми, мы, наконец, пришли к соглашению с Венстром, хотя нам пришлось немного согласовать, суть нашего плана по-прежнему согласована оппозиционной партией, и мы надеемся оказать помощь датскому народу."
 denmark.14.a: "Приятно с вами пообщаться."

 denmark.15.t: "Вентр уезжает из Канслергада"
 denmark.15.d: "Когда делегаты из Венстра поняли, что у нас нет намерений принять какую-либо компромисию, если они быстро перестанут сотрудничать, держась за свою буржуазную гордость, они покинули стол переговоров и Канслергад."
 denmark.15.a: "Что теперь?"

 denmark.16.t: "На пути к выборам в спячку"
 denmark.16.d: "После того как премьер-министр Стаунинг и король Фредерик IX обсуждали эту тему, как представляется, существует согласие о том, что новое доверие лучше, чем нынешнее."
 denmark.16.a: "Давайте посмотрим, что мы получаем"

 denmark.17.t: "Выборы, проводимые в течение [пошагов] года"
 denmark.17.d: "После неудачных переговоров между правительством и оппозиционной партией &quot; Венстр &quot; были проведены новые выборы. Многие из них проводят кампании на местах во Фольктингете, где присутствуют даже новые силы. Несмотря на то, что правящие социал-демократы могут удержаться у власти, а цифры говорят, что они останутся крупнейшей партией. Самый важный вопрос, касающийся их, заключается в том, что они собираются пересмотреть вопрос о том, кто должен сформировать коалицию. В то время как многие социальные демократы, связанные с Радикале Венстром, считают более естественным создание коалиции с республиканцами в левом народном фронте."
 denmark.17.a: "Левое большинство!"
 denmark.17.b: "Правое большинство!"

 denmark.18.t: "Коалиционный вопрос"
 denmark.18.d: "В то время как выборы были проведены в пользу Торвальда Стаунинга и социал-демократов, вопрос о том, с кем сформировать коалицию, все еще находится в эфире, хотя многие хотят, чтобы мы продолжали нашу коалицию с Радикалем Венстром, так же много в партии, которая хочет, чтобы мы сформировали коалицию с республиканцами, зависит от Стаунинга и его министров."
 denmark.18.a: "Радикаль Венстр - наши друзья!"
 denmark.18.b: "Подойдите к республиканскому лидерству!"

 denmark.19.t: "Вторая попытка заключить соглашение"
 denmark.19.d: "Хотя некоторые из наших сторонников не поддерживают эту новую попытку, есть и те, кто надеется на то, что на этот раз мы добьемся успеха."
 denmark.19.a: "Нам нужно попробовать"
 denmark.19.b: "Нет, это бессмысленно."

 denmark.20.t: "Второе Канслергадское совещание"
 denmark.20.d: "С представителями как правительства, так и оппозиционной партии Венстр на встрече, несмотря на то, что среди делегатов присутствует усталость, все они знают о важности этого, хотя мы могли бы пойти на компромисс с нашей целью, вариант еще раз сказать нет , чтобы договориться, открыт."

 denmark.21.t: "Политический тупик"
 denmark.21.d: "Разрушив переговоры, страна зашла в политический тупик, и с этим народ повернется против нас, чтобы увидеть, как долго это продлится, и даже если мы сможем выйти из этого, наша репутация восторжествует."
 denmark.21.a: "Я знаю, что я ужасен..."

 denmark.22.t: "Коалиция левого крыла"
 denmark.22.d: "Премьер-министр Торвальд Стаунинг, сняв Радикале Венстр, сформировал коалицию с республиканцами, и это решение с ужасом воспринимается правыми политическими деятелями, видя это как начало конца Королевства."
 denmark.22.a: "Встань, проклятый Землю!"

 denmark.23.t: "Переговоры с Радикалем Венстром"
 denmark.23.d: "Сегодня именно делегаты из Радикале Венстре занимают места делегатов Венстр в Канслергаде, встречаясь с новым коалиционным правительством, мы собрались для того, чтобы заручиться поддержкой нашего плана восстановления в Ландстингете."
 denmark.23.a: "Это компромис, которую стоит взять."

 denmark.24.t: "Успешные переговоры"
 denmark.24.d: "Переговоры между правительством и Радикале Венстром в Канслергаде оказались успешными, и при наличии большинства, гарантированного в обеих палатах датского парламента, мы наконец-то сможем осуществить наш план восстановления датской экономики, наш коалиционный партнер, республиканцы, характеризуют себя как спасителей социальной демократии, ожидая, что это приведет к Датской Республике."
 denmark.24.a: "Для трудящихся Дании"

 denmark.25.t: "Падение правительства Стаунинга"
 denmark.25.d: "С победой правого крыла на недавних выборах в Фольктинг, правительство Торвальда Стаунинга упало, потеряв доверие обеих палат датского парламента."
 denmark.25.a: "Мэдсен-Мигдал Возвращается к власти"
 denmark.25.b: "Рождество Мёллер возьмет колесо"

 denmark.26.t: "Коалицию с Данским Самлингом?"
 denmark.26.d: "Когда Джон Рождество Мёллер стал премьер-министром Дании, открылся вопрос о том, чтобы позволить всем консервативным движениям в Дании быть представленными в этом правительстве. Хотя наш партнер по коалиции в Венстре может иметь что-то против этого, было бы разумно включить Данска Самлинга в нашу коалицию. Формировавшись до сиюминутных выборов, этой новой партии удалось получить несколько мест в Фольктингете. Хотя это не так уж много, их участие может оказать нам большую поддержку в политическом правом кружке."
 denmark.26.a: "Добро пожаловать в нашу коалицию, Соренсен."
 denmark.26.b: "Мы не можем рисковать нашей коалицией с Венестрой"

 denmark.27.t: "Переговоры с Радикалем Венстром"
 denmark.27.d: "У правого правительства есть возможность договориться о поддержке с Радикале Венстром, хотя это партия, которая стала ближе к социал-демократам, их поддержка помогла бы нам выполнить наш план восстановления без возражений, есть и те, кто думает, что мы можем сделать это без такого соглашения."
 denmark.27.a: "Давайте переговорим"
 denmark.27.b: "Мы сами справляемся с этим."

 denmark.28.t: "Успешные переговоры"
 denmark.28.d: "Переговоры между нашим правительством и Радикалем Венстром оказались плодотворными, хотя и поставили под угрозу некоторые вопросы, наше правое правительство получило поддержку для осуществления нашей политики и плана восстановления."
 denmark.28.a: "Социальная демократия потерпела неудачу"

 denmark.30.t: "Кубок Лайксборга"
 denmark.30.d: "Это было рано утром, когда в городе Кёбенхавн началось движение, когда страна была разрушена экономическим кризисом, республиканскими агитаторами и германскими беспорядками, политический тупик стал последним падением. ~ ~ Н/н с большой частью датской армии произошел военный переворот под руководством Виктора Пюршеля и его группы монархистов и прохристианских фигур X. С неудачным премьер-министром, арестованным, новое руководство взяло на себя власть в Дании."
 denmark.30.a: "Дания свободна от унылых политиков!"

 denmark.31.t: "Пустыни военно-морских сил"
 denmark.31.d: "В то время как Lyksborg Group, состоящая в основном из монархистов, консерваторов и армейских деятелей, в военно-морском флоте остается много военнослужащих. Новости о перевороте привели к тому, что многие моряки и некоторые военно-морские командиры дезертировали из армии. Некоторые из них даже уплыли с кораблями военно-морского флота. Несмотря на то, что эти новости плохи для Дании и нашего правительства, хуже всего то, что бывший король, Фредерик IX, заявил о своей поддержке своих товарищей по военно-морскому флоту, что привело к раздору в отношениях между отцом и сыном. Это вопрос, который необходимо решить быстро."
 denmark.31.a: "Мы восстановим их доверие"

 denmark.32.t: "Антимонархистские протесты"
 denmark.32.d: "В то время как Lyksborg Group удалось переворотить демократические институты Дании, создав новое монархистское правительство, оно не было хорошо восстановлено рабочим классом в Дании, поскольку рабочие под влиянием социалистических и республиканских демагог, они вышли на улицы, протестуя против нашего правления. Если мы не сможем умиротворить социалистическую угрозу, эти протесты могут превратиться в датскую революцию."
 denmark.32.a: "Социалистические паразиты!"

 denmark.33.t: "Датская революция"
 denmark.33.d: "С неделями, даже месяцами протестов на улице, в конце концов, она превратилась в вооруженное страхование против Ликсборгской группы и монархии. С сохраняющимися проблемами, которые преследуют Данию, революционеры считают, что этого достаточно."
 denmark.33.a: "Работники Дании, Объединяйтесь!"

 denmark.34.t: "Реакционная оппозиция формируется"
 denmark.34.d: "Республиканская революция не была встречена всеми слоями датского общества, но все же есть много сторонников Ликсборгской группы и реакционной монархии. Все еще существует такая лояльность через такие структуры буржуазии, как армия и крупные фермеры. Несмотря на то, что наиболее быстро растущая оппозиция встречается с Датской национальной партией и другими националистическими группами в Дании. Есть также подозрительная связь между этими крайне правыми группами и валькистским руководством в Германии. Мы должны стоять на страже."
 denmark.34.a: "Проклятый Реакционный Отброс!"

 denmark.35.t: "Возможности в Дании"
 denmark.35.d: "Республиканская революция в Дании может оказаться опасной для развития валькизма. Эти силы, казалось бы, враждебны или, по крайней мере, не готовы к сотрудничеству с нашим правительством и Германией. Тем не менее, у Дании все еще есть надежда. Революция сама по себе вызвала реакцию датского народа в форме оппозиционных групп. Среди них Датская национальная партия, которая кажется открытой для сотрудничества с немецким народом. Хотя она слишком слаба, чтобы вызвать любую контрреволюцию, мы могли бы помочь им с финансированием и поддержкой."
 denmark.35.a: "Нам нужно помочь им."
 denmark.35.b: "Нет, это приведет к дальнейшим квартиросъемкам."

 denmark.36.t: "Национальная партия организует восстание"
 denmark.36.d: "Ходят слухи о том, что многие правые фигуры начинают формировать организованное сопротивление нашему правительству под руководством Датской национальной партии. Партия, как представляется, стала местом сбора как членов институционных партий, так и ультраправых фигур и реакционных генералов. Все они объединились в оппозиции нам. Но наши источники недавно обнаружили признаки организации националистического и реакционного восстания в сельских городах наряду с террористическими нападениями на республиканские структуры. Что бы это ни было, что-то происходит в Дании."
 denmark.36.a: "Пахнет как восстание"

 denmark.37.t: "Марш по Кобенхагену"
 denmark.37.d: "Во время ранних умиротворений тишина была нарушена стрельбой и марширующими людьми. Когда взошло солнце, стало ясно, что марш на Кобенхагене продолжался. Вооруженные члены Национальной партии вместе с военными формированиями и монархистами выступили против республиканского правительства, вооружившись немецкими винтовками. Поскольку республиканцы не в состоянии принять меры против этих групп, они обречены на провал. Падение Кобенхагена под правлением Датской национальной партии коррелировало с германскими войсками, марширующими в город Шлезвиг-Гольштейн, многие немцы в городе праздновали это освобождение. Мы приветствуем то, что они сняли с себя бремя, связанное с управлением городом, даже если оно может чуждо некоторым из наших сторонников. Сегодня началась новая эра для Дании!"
 denmark.37.a: "Дэнмарк для детектива Дэнске Фолка!"

 denmark.38.t: "Дания присоединяется к Пакту Стали"
 denmark.38.d: "С учетом всего того, что Германия помогла датскому народу избавиться от республиканцев-социалистов, мы можем присоединиться к их альянсу и их борьбе против социалистического Востока и Коррупта на западе. Вместе Дания и Германия станут партнерами и союзниками в новом мировом порядке. Прошлое больше не будет удерживать нас от нашего сотрудничества с Германией."
 denmark.38.a: "Да здравствует Пакт Стали!"

 denmark.39.t: "Дания присоединяется к нашей сфере"
 denmark.39.d: "Наша поддержка Датской национальной партии, наряду с провалом революционеров в Дании, пришла в нашу пользу."
 denmark.39.a: "Отлично!"

 denmark.40.t: "Диархия Республики"
 denmark.40.d: "Датская революция была успешной, еще предстоит работа. В то время как республиканцы и коммунисты были на дружеских условиях до, во время и сразу после революции, эти отношения могут сейчас киснуть. В то время как обе партии расходятся во мнениях о том, как будет работать Дания. Республиканцы хотят Датскую Республику с демократическими выборами, в то время как коммунисты хотят Социалистическую Республику под однопартийным правлением."
 denmark.40.a: "Республика в опасности!"
 denmark.40.b: "Революция под угрозой!"

 denmark.41.t: "Коммунисты захватывают контроль"
 denmark.41.d: "Коммунистическая партия успешно отодвинула республиканцев на второй план, после того как многие республиканские чиновники были отстранены от должности, наряду с продвижением Акселя Ларсена к лидерству в Республике, мы наконец смогли увидеть, как социализм освободил Данию."
 denmark.41.a: "Поднимайтесь, рабочие Дании!"

 denmark.42.t: "Продолжается борьба за власть"
 denmark.42.d: "Ни коммунисты, ни республиканцы не смогли оттолкнуть противостоящую фракцию, поскольку между республиканцами и коммунистами все еще существуют разногласия, а обе группировки не менее могущественны, чем другие, это заставит Данию застрять в политическом отношении, что может нанести ущерб обеим фракциям и их репутации в стране."
 denmark.42.a: "Мы никуда не едем"

 denmark.43.t: "Республиканцы захватывают контроль"
 denmark.43.d: "Республиканская партия успешно справилась с тем, чтобы отвлечь коммунистов, и с тем, что многие коммунистические чиновники были отстранены от власти, а также с тем, что Могенс Туг стал лидером Республики, мы наконец-то смогли увидеть, как наша республиканская мечта становится реальностью."
 denmark.43.a: "За Республику, за Демократию!"

 denmark.44.t: "Выборы в народные органы"
 denmark.44.d: "Настало время для новых выборов в Дании. На протяжении многих месяцев партии и политики выступали за свою политику. ~nn ~В этом случае есть два реалистичных результата. Либо победа Socialdemokraterne, вместе со своими союзниками в Радикале-Венстре, либо победа правого альянса Вентре и Консерватив Фолькепарти."

 denmark.45.t: "Социально-демократическое правительство"
 denmark.45.d: "На недавних выборах левое движение одержало победу, и теперь социал-демократы смогут сформировать правительство вместе со своими союзниками."
 denmark.45.a: "Умеренная коалиция &quot; Центр-Лифт &quot;"

 denmark.46.t: "Правое правительство"
 denmark.46.d: "Правое движение одержало победу на недавних выборах, в связи с чем возникает вопрос, какая партия возглавит это новое правительство, будь то либералы или консерваторы."
 denmark.46.a: "Либерально-либерально-либеральная коалиция"
 denmark.46.b: "Консервативная коалиция"

 denmark.47.t: "Рождение принцессы Маргреты"
 denmark.47.d: "Счастливая новость прибыла из Амалиенборга, где королева Ингрид недавно родила своего первого ребенка и короля Фредерика IX. Это девочка, которой дали имя Маргрета Александрин Орхильдур Ингрид. Хотя принцесса Маргрета не может стать королевой сама по себе, это может измениться, если противится изменению конституции. Однако радостная весть указывает на то, что король и королева действительно способны создать наследника."
 denmark.47.a: "Поздравляю, мой король!"

 denmark.48.d: "Счастливая новость прибыла из Амалиенборга, где принцесса Ингрид недавно родила своего первого ребенка принца Фредерика. Это девочка, которой дали имя Маргрета Александрин Орхильдур Ингрид. Хотя принцесса Маргрета не может стать королевой по праву, это может измениться, если противится изменению конституции. Однако радостная новость указывает на то, что будущий король и королева действительно способны создать наследника."
 denmark.48.a: "Поздравляю, Наследный Принц!"

 denmark.50.t: "Дания просит присоединиться к стальпакту"
 denmark.50.d: "Датские дипломаты обратились к нам с просьбой разрешить Дании присоединиться к Пакту Стали, хотя этот альянс мог бы предоставить нам доступ к Датскому проливу и океану по всей стране, но есть и те, кто считает, что мы могли бы добиться этого и в результате вторжения."
 denmark.50.a: "Впустите их!"
 denmark.50.b: "Мы не нуждаемся в них"

 denmark.51.t: "Германия впустит нас"
 denmark.51.d: "После долгого рассмотрения как Верховным командованием датских, так и немецких военных, а также одобрения иностранных ведомств обеих стран Германия приняла нас в Пакт Стали. При поддержке Германии мы легко сохраним воздушное и военно-морское господство в Балтии, лишая наших врагов свободы передвижения в регионе."
 denmark.51.a: "Наш Альянс процветает"

 denmark.52.t: "Германия отказалась от нашего альянса"
 denmark.52.d: "Несмотря на то, что высшее командование датских и немецких военных и дипломатические усилия иностранных представительств обеих стран не смогли прийти к приемлемым условиям в отношении военного союза и как таковые отказались от вступления в Пакт Стали."
 denmark.52.a: "Это - их убыток."

 denmark.53.t: "Дания просит о присоединении к АПИ"
 denmark.53.d: "Поскольку в Европе назревает конфликт между Францией и Германией, Дания обратилась к Соединенному Королевству с просьбой заключить союз в целях обеспечения их национальной безопасности."
 denmark.53.a: "Хорошо."
 denmark.53.b: "Что насчет "Нет""

 denmark.54.t: "Британцы впускают нас"
 denmark.54.d: "После долгого рассмотрения как Верховным командованием датских, так и британских вооруженных сил и одобрения обоими иностранными ведомствами Великобритания приняла нас в Имперский альянс защиты. При поддержке Великобритании мы легко сохраним воздушное и военно-морское господство в Северном море, лишая наших врагов свободы передвижения в регионе."
 denmark.54.a: "Наш Альянс процветает"

 denmark.55.t: "Британец отказался от нашего альянса"
 denmark.55.d: "Несмотря на то, что высшее командование датских и британских военных и дипломатические усилия иностранных представительств обеих стран не смогли прийти к приемлемым условиям в отношении военного союза, и поэтому они отвергли вступление в Альянс имперской защиты."
 denmark.55.a: "Это - их убыток."

 denmark.56.t: "Дания просит присоединиться к «Согласию»"
 denmark.56.d: "С ростом ежедневной угрозы немецкого вторжения Дания обратилась к Франции с просьбой заключить союз, чтобы обеспечить их национальную безопасность."
 denmark.56.a: "Хорошо."
 denmark.56.b: "Что насчет "Нет""

 denmark.57.t: "Франция впустит нас"
 denmark.57.d: "После долгого рассмотрения как Верховным командованием датских, так и французских военных и одобрения иностранных представительств обеих стран Великобритания приняла нас в «Согласие» при поддержке Франции Германия была бы глупо вторгнуться в нас."
 denmark.57.a: "Наш Альянс процветает"

 denmark.58.t: "Франция отказалась от нашего альянса"
 denmark.58.d: "Несмотря на то, что высшее командование датских и французских военных и дипломатические усилия иностранных представительств обеих стран не смогли прийти к приемлемым условиям в отношении военного союза и как таковые отказались от вступления в Договор."
 denmark.58.a: "Это - их убыток."

 denmark.59.t: "Дания обращается с просьбой о присоединении к Международной конференции по борьбе против расизма, расовой дискриминации, ксенофобии и связанной с ними нетерпимости."
 denmark.59.d: ""
 denmark.59.a: "Хорошо."
 denmark.59.b: "Что насчет "Нет""

 denmark.60.t: "Советы впускают нас"
 denmark.60.d: ""
 denmark.60.a: "Наш Альянс процветает"

 denmark.61.t: "Советы отвергли наш альянс"
 denmark.61.d: ""
 denmark.61.a: "Это - их убыток."

 denmark.62.t: "Армейское правление закончилось в Шлезвиг-Гольштейне"
 denmark.62.d: "Сегодня армия в Шлезвиг-Гольштейне наконец-то закончила свое правление."
 denmark.62.a: "Выпьем за демократию!"

 denmark.63.t: "Плебисцит в Шлезвиг-Гольштейне"
 denmark.63.d: "С возвращением демократии и стабильности в Шлезвиг-Гольштейн настало время создать подлинно демократический Плебистит на территории, чтобы посмотреть, хотят ли они остаться частью Дании или присоединиться к Германии. Хотя это и может стать шансом для увеличения власти валькистам в Германии, он раз и навсегда решит проблемы со Шлезвигом-Гольштейном."
 denmark.63.a: "Пусть этот процесс начнётся!"

 denmark.64.t: "Немецкая победа в Шлезвиг-Гольштейне"
 denmark.64.d: "Шлезвиг-Гольштейн Плебисцит стал одним из самых явных победителей в конце концов. Спустя несколько месяцев после предвыборной кампании прогерманская сторона смогла сохранить свой лидер. Прогерманский лагерь может претендовать на победу. С новостями об этом, достигшими Шлезвиг-Гольштейна, город был раскрашен в цвета немецких флагов, как имперских, так и республиканских, а также валькистских."
 denmark.64.a: "Как это могло произойти!"

 denmark.65.t: "Шлезвиг-Гольштейн голосует за воссоединение с Германией"
 denmark.65.d: "Шлезвиг-Гольштейн-Плебистит привел к победе Германии, которая стала частью законной немецкой земли."
 denmark.65.a: "Добро пожаловать домой, друзья немцы!"

 denmark.66.t: "Немецкая победа в Шлезвиг-Гольштейне"
 denmark.66.d: "Шлезвиг-Гольштейн Плебисцит стал одним из самых близких плебисцитов в истории региона. В то время как прогерманская сторона вела кампанию на раннем этапе, после кампании, свинец сузился. Поскольку этот плебисцит был весьма близок, подсчет занял больше времени, чем ожидалось, но его результат сейчас наступает. ~ nn ~Nm вместе с еще 173 голосами прогерманский лагерь одержал победу. Даже если им было меньше 50% всех поданных голосов, а некоторые поданные голоса были объявлены недействительными, они смогли получить больше, чем оппозиция. Но хотя это выглядит как победа Германии, есть слухи, что там, где мошенничество. Мы все еще можем выиграть этот плебисцит, если мы играем на обмане. Возвращение к признанию результата может, однако, вызвать германскую агрессию."
 denmark.66.a: "Мы должны принять результат!"
 denmark.66.b: "Некоторые из этих голосов должны быть фальшивыми!"

 denmark.67.t: "Дания отказывается принять победу в Германии"
 denmark.67.d: "Шлезвиг-Гольштейн-Плебистит привел к немецкой победе, но, хотя это так, датское правительство отказалось признать результат как действительный, утверждая, что существует обвинение в мошенничестве с избирателями. Это обвинение против нашего соотечественника немецкого народа разозлило нас, и многие советники считают это провокацией к войне."
 denmark.67.a: "Плохой ход, датчане!"
 denmark.67.b: "Мы отомстим позже"

 denmark.68.t: "Датская победа в Шлезвиг-Гольштейне"
 denmark.68.d: "Шлезвиг-Гольштейн Плебистит был в начале плебисцита, где прогерманская сторона имела первые зацепки. Но во время предвыборного сезона продатская сторона смогла зачитать свое послание немецкому населению в Шлезвиг-Гольштейне, переосмыслив свое голосование. В конце концов, лидером была продатская сторона. Победившая сторона была эффективна в том, чтобы нарисовать плебисцит скорее как плебисцит Дано-Герман против Валькиста, чем как датский против немецкого."
 denmark.68.a: "С шампанским!"

 denmark.69.t: "Дания победила Шлезвиг-Гольштейн Плебисцит"
 denmark.69.d: "Шлезвиг-Гольштейн-Плебистит привел к датской победе, хотя мы почти не можем в это поверить, этот факт, как представляется, указывает на это. Хотя мы не можем указать на какую-либо нечестную игру датского правительства, этот результат не означает, что мы так легко сдадимся."
 denmark.69.a: "Мы вернемся к этому позже"

 denmark.100.t: "Слияние республиканско-социальных демократов"
 denmark.100.d: "Республиканцы в Дании недавно начали терять дух, когда король стал все более символическим фигуристом, чем тот, у кого есть власть, большинство людей считают монархию хорошей институцией, последним гвоздом республиканской мечты и окончательной победой демократической конституционной монархии является объединение социал-демократов и республиканских партий."
 denmark.100.a: "Республиканцы сейчас в покое."

 denmark.101.t: "А. Датская Республика"
 denmark.101.d: "Ключевое требование создать правительство с республиканцами было обещанием Датской Республики. Сегодня король Фредерик добровольно отрекся от короны для него и его дома, а премьер-министр объявил о рождении Республики."
 denmark.101.a: "Спасибо за службу, король Фредерик."

 denmark.102.t: "Гражданское правительство"
 denmark.102.d: "Поскольку в Дании власть Ликсборгской группы не оспаривается, настало время перейти к более гражданскому и демократическому правительству, хотя мы и можем сохранить нынешнее правительство, король считает необходимым предоставить больше власти гражданским лоялистам, чем военным деятелям, чтобы было легче удержать власть. По крайней мере, это означало бы менее милитаризмское и автократическое правительство."
 denmark.102.a: "Я люблю демократию"

 denmark.103.t: "Встретить две стороны"
 denmark.103.d: "Прежде чем мы сможем ввести временный запрет на локаут и забастовку, мы должны встретиться с двумя сторонами в трудовых спорах: профсоюзами и организациями работодателей. Без консультаций с ними мы, скорее всего, столкнемся с оппозицией обеих сторон в этой операции."
 denmark.103.a: "Приближение соглашения о выгодном бизнесе"

 denmark.104.t: "Протест коммунистических союзов"
 denmark.104.d: "Хотя большинство профсоюзов в Дании в настоящее время согласны с временным запретом, по-прежнему существует несколько профсоюзов, которые протестуют против этого действия. &quot; Коммунистические &quot; союзы весьма критически относятся к нашему запрету, назвав его авторитарной мерой, приносящей доход капиталистическому классу; кроме того, есть несколько работодателей, которые недовольны этим законом, угрожая порвать с линией, которой следуют организации работодателей."
 denmark.104.a: "Небольшая цена"

 denmark.105.t: "Суд над дезертирами"
 denmark.105.d: "После восстановления отношений между королем Кристианом и его сыном, бывшим королем Фредериком, было легко восстановить верность Датского флота."
 denmark.105.a: "Справедливая справедливость"

 denmark.106.t: "Социалистический исход"
 denmark.106.d: "С нашим шагом против опасных и революционных союзов в Дании имели место некоторые протесты со стороны членов профсоюзов на политическом левом фронте, которые ожидали таких изменений, как исход социалистических, коммунистических и республиканских членов профсоюзов и политиков, покидающих Данию в Советский Союз или другие левые левые страны, хотя это могло бы быть полезным для нашей внутренней борьбы с этими подрывными идеологиями, оно дает довольно плохое представление на международном уровне."
 denmark.106.a: "Мы пережили магию социализма"

 denmark.107.t: "Практически завершенная коллективизация"
 denmark.107.d: "Наши усилия по коллективизации датской промышленности и сельского хозяйства близятся к завершению."
 denmark.107.a: "Социализм действительно высочайший"

 denmark.108.t: "Конец капитализации"
 denmark.108.d: "Сегодня мы видим, как датские рабочие покончили с угнетением со стороны капиталистов."
 denmark.108.a: "Капитализм - это часть прошлого!"

 denmark.109.t: "Республиканская конституция"
 denmark.109.d: "С хорошо устоявшейся Республикой Данией наше общество наконец-то может увидеть поворот к подлинно демократической системе правления, которая будет окончательно завершена с запланированными президентскими и парламентскими выборами, запланированными на следующий месяц."
 denmark.109.a: "Республика сильна"

 denmark.110.t: "Умеренный республиканский альянс форм"
 denmark.110.d: "Умеренные республиканцы, которые часто называются правыми республиканцами или термидорами, сегодня собрались вместе, чтобы сформировать буржуазный альянс, который может противостоять правящим республиканцам."
 denmark.110.a: "Они так долго играют с нашими правилами!"

 denmark.111.t: "Президентские и парламентские выборы"
 denmark.111.d: "Настало время для того, чтобы народ Дании избрал того, кто будет его президентом и кто будет сформирован следующим правительством. Хотя в гонке за пост президента есть много кандидатов, в действительности есть только два; республиканцы Моген Фог и радикальные либералы Карл Теодор Зале. ~n nMogen Fog связаны с широким альянсом левого крыла, в который входят социалисты, республиканцы, коммунисты и социальные демократы. Карл Теодор Зайл связан с широкой коалицией либералов, центристов и консерваторов, альянсом, который популярно называется Термидорским альянсом."
 denmark.111.a: "Mogens Fog и республиканцы"
 denmark.111.b: "Карл Теодор Зайл и Термидоры"

 denmark.202.d: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" #Status of the Kiel Zone
 denmark.206.d: "Опять же, мы одержали победу над колхозником из Гамбургской коммуны, и теперь мы сталкиваемся с решением о том, что с ними делать."

 denmark.300.d: "Хотя Кильский район всегда был несколько нестабильным, похоже, что в последнее время наблюдается возрождение деятельности коллективистов, что еще больше беспокоит то, что они не изящные ленинисты-коллективисты, они подписываются на свой собственный вариант идеологии под названием "Национальный коллективизм". В целом, националистические и жестокие по своему характеру, мы можем столкнуться с новым восстанием от них в ближайшем будущем."
 denmark.301.d: ""Национал-коллективисты" спровоцировали беспорядки в Гамбурге! "Риоты" стали особенно плохими, при этом широко распространены акты вандализма в отношении датской собственности. Датские гарнизоны в городе испытывают трудности с сдерживанием беспорядков, ожидание беспорядков, а затем арест агитаторов было бы самым надежным решением этого беспорядка, однако решение этой проблемы с помощью силы позволило бы нам остановить эти беспорядки, не принимая последующих мер в связи с ущербом... хотя есть вероятность того, что граждане откажутся от применения силы."
 denmark.302.d: "Наши попытки сдержать беспорядки не увенчались успехом, мы были не в состоянии обеспечить соблюдение комендантского часа и просто были натянуты на рабочую силу, когда дело дошло до прекращения беспорядков силой."
 denmark.303.d: "Поскольку волнения в основном успокаиваются из-за того, что мы смягчаем и либерализируемся, мы сталкиваемся с первыми выборами Шлезвига Гольштейна. Мы больше не будем оккупационной зоной, мы станем Либерально-демократической парламентской Республикой. ~Нет, мы столкнулись с первыми выборами Шлезвига-Гольштейна. Только ряду избранных партий было разрешено участвовать в выборах, но наиболее популярными из этих партий, похоже, являются SP, FV & KP."
 denmark.304.d: "Всё, что мы сделали, это накормили пламя. В последние дни нападки стали только хуже, и они достигли не только городских районов нашей страны, и даже распространились до Фленсбурга! Несмотря на то, что наши гарнизоны были в основном переполнены бунтовщиками, некоторые призывники даже присоединились к ним. Небольшое влияние, которое мы оставили здесь, находится в отдаленных сельских районах, и учитывая, что национальные коллективисты захватили различные армуры, вполне вероятно, что это восстание скоро будет вооружено."
 denmark.305.d: "Датское переходное правительство рухнуло! Национально-коллективистские силы и другие социалистические революционеры объединили свои силы и организовали несколько боевых подразделений с использованием захваченного оружия. Вскоре после этого они смогли выгнать датских гарнизонов из страны с незначительным сопротивлением. Несмотря на то, что национальные коллективисты и другие социалисты собирают «Вторую Гамбургскую коммуну», похоже, что переходное правительство полностью исчезло вместо Гамбургской коммуны."
 denmark.306.d: "Проклятые коллекционисты в Кильском районе выгнали наши оккупационные силы и провозгласили второй Гамбургский коммуну!"
 denmark.307.d: "Отто Стассер, популярный политик в Дас-Дойче-Рейхе, прибыл несколько дней назад. Он выразил большую страсть к идеологии национального коллективизма, как бы он ни был бывшим валькистам. ~Нет, он, кажется, очень благоразумный в финансовом отношении и очень опытный в административном отношении. Как нам это сделать?"
 denmark.308.d: "Датские угнетатели побеждены перед нами, наши ополчения ходят по нашим завоеванным территориям с флагом коммуны. ну, монументальный день, теперь, когда мы добились нашей независимости, мы можем обратить свои взоры на другие места. Мы даже, возможно, могли бы заявить о том, что мы являемся законной немецкой нацией, но это, несомненно, разрушило бы отношения с валькистами."
 denmark.309.d: "Немецкая община направила официальное ходатайство о присоединении к Третьему интернационалу, вероятно, из-за отсутствия каких-либо союзников в их регионе. Они, как представляется, являются будущей целью для Германии, которая может привести нас к войне с ними в будущем. Согласимся ли мы?"
 denmark.310.d: "Советы отвергли наше предложение присоединиться к Третьему интернационалу!"
 denmark.311.d: "Отто Страссер, бывший немецкий валькист, прибыл в наш народ, он не потратил времени на то, чтобы подтвердить свою приверженность делу национального коллективизма, и быстро осудил валькизм в поддержку национального коллективизма."
 denmark.312.d: "Датские угнетатели побеждены перед нами, наши ополчения идут по нашим свободным территориям с флагом коммуны."
 denmark.313.d: "Гамбургская община предложила «мир с честью», они требуют, чтобы мы признали их независимость и предоставили нам мир взамен, без каких-либо территориальных уступок со стороны самой Дании."
 denmark.314.d: "Гамбургская община выдвинула требование «мира с местью»."
 denmark.315.d: "Датцы не желают соглашаться на какие-либо из наших условий, и мы не хотим вносить какие-либо изменения в наш список требований."


