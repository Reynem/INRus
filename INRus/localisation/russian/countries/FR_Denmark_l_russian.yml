 #### Description ####
 DEN_FUHRERREICH_DESC: "Датский король пережил Великую Войну, которая была относительно невредима лишь короткой и высокомобильной военной кампанией в умирающие дни Великой Войны. 1920-е годы стали свидетелями Пасхального кризиса и кризиса отторжения, двух событий, кульминацией которых стало нарушение королем Кристианом Х конституционных норм, первого в целях обеспечения аннексии Шлезвига и оккупации Гольштейна. В ходе последующего кризиса, связанного с отменой власти, король попытался раздавить левые крылы после выборов 1929 года, однако этот кризис закончился унижением и отвержением со стороны короля. С новым королем, демократией и укоренившимся республиканизмом остается неизвестным, куда будет идти Дания и как она будет действовать в ходе будущих кризисов."

 #### IDEAS ####
 DEN_danish_republicanism_idea: "Датский республиканец"
 DEN_danish_republicanism_idea_desc: "Пасхальный кризис продемонстрировал слабость монархии и необходимость того, чтобы Дания превратилась в демократическую нацию, где решения принимаются правительством и Фольктингетом."
 DEN_danish_republicanism1_idea: "Датский республиканец"
 DEN_danish_republicanism1_idea_desc: "Пасхальный кризис продемонстрировал слабость монархии и необходимость того, чтобы Дания превратилась в демократическую нацию, где решения принимаются правительством и Фольктингетом."
 DEN_unrest_in_flensburg_idea: "Беспорядок в Шлезвиг-Гольштейне"
 DEN_unrest_in_flensburg_idea_desc: "Рост числа валькистов в Германии стимулировал протесты и демонстрации многих немцев в Шлезвиг-Гольштейне и вокруг него, которые переросли в насилие против полиции и вооруженных сил в некоторых местах. Датские военные столкнулись с трудностями в сдерживании волнений, причем даже поступали сообщения о том, что вооруженные немцы пересекают границу из Германии в регион, что представляет опасность для датского населения, проживающего в этом районе, причем многие из них боялись выразить свои мнения в пользу Дании."
 DEN_unrest_in_flensburg1_idea: "Беспорядок в Шлезвиг-Гольштейне"
 DEN_unrest_in_flensburg1_idea_desc: "Рост числа валькистов в Германии стимулировал протесты и демонстрации многих немцев в Шлезвиг-Гольштейне и вокруг него, которые переросли в насилие против полиции и вооруженных сил в некоторых местах. Датские военные столкнулись с трудностями в сдерживании волнений, причем даже поступали сообщения о том, что вооруженные немцы пересекают границу из Германии в регион, что представляет опасность для датского населения, проживающего в этом районе, причем многие из них боялись выразить свои мнения в пользу Дании."
 DEN_weary_military: "Усталость военных"
 DEN_weary_military_desc: "В течение последних 20 лет датские военные были избиты, опустошены, раздуты и устали от своих обширных обязанностей; они оказались невероятно измученными, и их ряды по-прежнему подкреплены призывниками, чтобы компенсировать острую нехватку новобранцев."
