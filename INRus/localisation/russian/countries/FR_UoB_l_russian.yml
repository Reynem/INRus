 ENG_clement_attlee: "Клемент Эттле"
# ENG_clement_attlee_leader_desc: "Клем Аттле, потрясенный и омерзенный нищетой, которую он видел во время работы в молодежной благотворительной организации, стал выдающейся фигурой в Независимой лейбористской партии и, в конечном счете, в профсоюзном движении. Его активность, однако, была сорвана Велткригом."

