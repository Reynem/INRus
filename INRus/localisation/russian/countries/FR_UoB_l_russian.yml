### Characters ###
 ENG_oswald_mosley: "Освальд Мосли"
 #ENG_oswald_mosley_leader_desc: "Освальд Мосли, оставшийся с постоянной хромотой от летающей аварии во время Велткрига, вступил в британскую политику консерватором. Однако, к началу Британской революции, Мосли, как известно, перешёл в парламент, чтобы встать с революционерами Независимой Лейбористской партии. Несмотря на его физическое расстройство, быстро стал, возможно, самым страстным куратором слева. Его файербродные речи, особенно его знаменитое выступление перед консервативными работниками Бирмингема, привели Мосли на передний план движения профсоюзов, и в конечном итоге лидерство правящей ТУК. nn\nMosley, основателя авторитарной фракции Максимистов ТУК, является красноречивым предвестником усиления централизации и агрессивной внешней политики."

