## - Politics

# - ILP

UOB_moderate_app: "Профсоюзное большинство"
UOB_moderate_app_desc: "Победа союзников в Конгрессе провозглашает новую эру для Великобритании, в которой профсоюзы занимают доминирующее положение в политике."
UOB_eco_revival: "Национальный профессиональный союз"
UOB_eco_revival_desc: "Хотя небольшие профсоюзы не будут поглощены, многие из более крупных профсоюзов будут преобразованы в крупный национальный союз, установив прямую связь между государством, трудящимися и профсоюзами, в качестве переходного периода до тех пор, пока все они не станут едиными."
UOB_eng_lives: "Повторить английскую билль о правах 1689 года"
UOB_eng_lives_desc: "После роспуска парламента Джеймса II и попытки создать абсолютную монархию континентального стиля он был снят в 1688 году в бескровной Великой Революции. Для того, чтобы это никогда не повторилось, был разработан английский Билль о правах от 1689 года, чтобы защитить английские свободы. С тех пор этот документ попал в затмение, и теперь с новым революционным правительством он может быть уже недействителен. Мы ратифицируем его снова, чтобы тирания никогда больше не овладела этими благословенными островами."
UOB_marches_on: "Региональная автономия"
UOB_marches_on_desc: "От наших кельтских братьев поступают серьезные жалобы, которые, как и старая Консервативная и Юнионистская партия, мы являемся англо-центристской партией, и такие обвинения даже достигли уровня обвинений в реакции."
UOB_diss_aristo: "Богатство Аристократии"
UOB_diss_aristo_desc: "Экспроприация огромного богатства ныне разрушенного или изгнанного аристократического класса позволит нам гораздо быстрее залечить шрамы революции и обеспечить сбалансированность наших бюджетов в будущем."
UOB_mob_union: "Нефтяная проблема"
UOB_mob_union_desc: "Отрезанные от "Империи" и от многих стран мира, мы застряли в Северном море с небольшим количеством нефти и флотом, военно-воздушными силами и армией, отчаянно стремящимися добраться до него."
UOB_socialist_freedom: "Социалистическая свобода"
UOB_socialist_freedom_desc: "Социализм сделает людей свободными."
UOB_liberty_britons: "Англо-саксонская свобода"
UOB_liberty_britons_desc: "Древняя концепция англо-саксоновских свобод находится в сердце каждого полнокровного англичанина. Норманский конвек 1066 года лишил нас законных свобод континентальной державы, и с тех пор мы провели почти 1000 лет, пытаясь вернуть эти свободы. Теперь, к счастью, мы вступаем в эпоху, когда мы действительно можем объявить себя достойными гордиться нашей англо-саксонской свободой."

# - BSP

UOB_socialist_nation: "Национальное социалистическое большинство"
UOB_socialist_nation_desc: "Многие кричали и ухмылялись в Конгрессе и национал-социалисты претендуют на победу на своей платформе национальной безопасности и социализма в одной стране, они уплыли к власти, вероятно, из-за послереволюционной тревоги, что все это может сломиться."
UOB_no_gods: "Уничтожить Англию"
UOB_no_gods_desc: "С тех пор, как британский народ провел сотни лет, разделяя католиков, протестантов и неконформистов, многие члены социалистического движения, таким образом, не являются конформистами, в то время как у нас есть официальная политика атеизма, во имя национального единства и партийного единства мы будем преследовать главным образом англиканцев."
UOB_no_masters: "Обеспечение безопасности поставок нефти"
UOB_no_masters_desc: "Отрезанные от "Империи" и от многих стран мира, мы застряли в Северном море с небольшим количеством нефти и флотом, военно-воздушными силами и армией, отчаянно стремящимися добраться до него."
UOB_rebuild_britain: "Благосостояние народов"
UOB_rebuild_britain_desc: "Хотя это будет дорого стоить, огромное государство благосостояния будет любить большую часть населения для нас. Эти услуги также позволят нам усилить контроль, давая нам доступ к медицинским записям, превращая проблемы здоровья в один из общественных объектов, и разделяя семейную структуру, предлагая большой объем пособий матерям, заменяя мужей государством."
UOB_control_eco: "Расширение бюрократии"
UOB_control_eco_desc: "Уайтхолл никогда не был достаточно большим, чтобы управлять нашим штатом. Исторически англичанин привык к тому, что государство в его жизни только через почтальона и Бобби. Он придёт, чтобы признать, что государство сейчас во всей его жизни."
UOB_self_reliance: "Смерть от неприкосновенности частной жизни"
UOB_self_reliance_desc: "Мы не только уничтожим это мышление, но и создадим класс информаторов повсюду, чтобы никто не чувствовал себя в безопасности."
UOB_emergency_measures: "Чрезвычайные меры"
UOB_emergency_measures_desc: "Британия по-прежнему находится в хаосе, и нам необходимо установить более строгий контроль, поскольку ранее принятые меры были недостаточными."
UOB_new_britain: "Безопасная Великобритания"
UOB_new_britain_desc: "В то время как нам еще многое предстоит сделать, сейчас Великобритания является страной, которая намного безопаснее, чем до того, как мы пришли к власти. Улицы тихие и упорядоченные, церковь кастрирована, и иностранные державы отступили. Новая, безопасная Британия наконец заменила старую беспорядок."

# - CPGB

UOB_fires_revo: "Революционистское большинство"
UOB_fires_revo_desc: "Пожар революции ярко горит, так как революционисты победили в дебатах."
UOB_establish_bnu: "Осквернять церкви"
UOB_establish_bnu_desc: "Разбейте алтари, эксгумируя тела, похороните священника, прелюбодеяние в горящей церкви!"
UOB_mob_workers: "Революционная мобилизация"
UOB_mob_workers_desc: "Несмотря на непопулярность, массовые проекты работников и гражданских лиц в революционную рабочую силу и армию являются необходимой временной мерой, если мы хотим достичь наших целей."
UOB_build_britain: "Строить для Британии"
UOB_build_britain_desc: "Для того чтобы иметь экономические средства для проведения мировой революции, необходимо сложить новые заводы."
UOB_defend_revo: "Защищать революцию"
UOB_defend_revo_desc: "В то время как мы пытаемся распространиться из Британии и по всему миру, мы должны сначала обезопасить нашу нынешнюю позицию, наши армии будут пробурены и готовы к войне на Британских островах, если какой-либо иностранный захватчик попытается стереть свет революции в Британии."
UOB_work_policies: "Топливо для революции"
UOB_work_policies_desc: "Отрезанные от "Империи" и от многих стран мира, мы застряли в Северном море с небольшим количеством нефти и флотом, военно-воздушными силами и армией, отчаянно стремящимися добраться до него."
UOB_export_revo: "Экспортировать революцию"
UOB_export_revo_desc: "Мы должны стать арсеналом революции, посылая британские материальные средства туда, где это необходимо для окончательной революционной победы."
UOB_war_prep: "Трудовые лагеря для контрреволюционеров"
UOB_war_prep_desc: "Несмотря на то, что мы смогли победить их во время гражданской войны, контрреволюционная деятельность не прекратилась, и многие продолжают пытаться подорвать революцию, мы должны положить этому конец, мы будем следить за контрреволюцией, а преступники будут направлены в трудовые лагеря, где они будут работать ради революции."
UOB_perpetual_revo: "Постоянная революция"
UOB_perpetual_revo_desc: "Даже мировая революция не будет концом! Революция вечна, и мы - авангард, который введет революционный век в народ!"

## - Foreign

UOB_navalbuild: "Наращивание военно-морского флота"
UOB_navalbuild_desc: "Как островная нация, самой важной частью нашей обороны является контроль над морями. После того как большая часть Королевского флота сбежала во время революции или была сбита с толку, наш контроль над морями является тенью того, чем он был когда-то, и даже Французский ВМС больше, чем Республиканский ВМС. Создание новых верфей и установка новых кораблей исправят эту серьезную проблему."
UOB_notrade: "Черный остров"
UOB_notrade_desc: "Если мы хотим выжить, мы должны отрезать себя от остального мира и жить в аутарковом мире, иначе мы могли бы быть опустошёны блокадой иностранной державы в военное время."
UOB_britain_alone: "Британский изоляционизм"
UOB_britain_alone_desc: "Однако недавние угрозы нашей безопасности и нашей геополитической изоляции заставили нас отрезаться от остального мира до тех пор, пока мы не сможем вновь открыться."
UOB_reclaim_irelandtwo: "Ирландия"
UOB_reclaim_irelandtwo_desc: "Ирландия имеет 700-летнюю историю, связывающую ее с островом Великобритании, и если мы позволим ей улететь, она может попасть в руки иностранного соперника, угрожая нашему выживанию."



UOB_spread_revo: "Распространить революцию"
UOB_spread_revo_desc: "Революция восторжествовала в Британии, и теперь мы успешно смягчили ущерб, причиненный нашей стране."
UOB_join_three: "Присоединяйтесь к третьей международной организации"
UOB_reclaim_ireland: "Возвращение Ирландии"
UOB_reclaim_ireland_desc: "Ирландский остров был неотъемлемой частью Соединенного Королевства Великобритании и Ирландии, и, будучи законным государством-преемником этого Королевства, мы можем по праву аннексировать Ирландию и принести свет социализма к их берегам, предотвратив оттуда любую реакционную угрозу нашему народу."
UOB_bring_france: "Привести революцию во Францию"
UOB_bring_france_desc: "История Франции, от Французской революции до Парижского коммуны, показывает, что они обладают большим революционным потенциалом. К сожалению, трусость помешала многим, и теперь нация является реакционной республикой. Если французский рабочий не освободится, мы сделаем это для него."
UOB_strike_beneleux: "Удар по странам с низким уровнем дохода"
UOB_strike_beneleux_desc: "Нападение на Нижние страны может открыть нам дверь в Европу, через которую мы сможем еще больше распространить революцию."
UOB_socialist_ireland: "Социализм в Ирландии"
UOB_socialist_ireland_desc: "Мы не мерзкие империалисты, которых мы свергли; Ирландия станет братской республикой."
UOB_seize_nat: "Изобретите Северную Атлантику"
UOB_crush_valkism: "Уничтожить валькистов!"
UOB_crush_valkism_desc: "Немцы говорят о большой игре ненавидящих реакционеров, но когда дело доходит до нее, они не лучше. Кровожадные вальки должны быть разрушены и дом Маркса освобожден!"
UOB_secure_nsea: "Обеспечение безопасности в Северном море"
UOB_secure_nsea_desc: "Как остров в Северном море, нам необходимо контролировать Северную Атлантику и Северное море."
UOB_destroy_exiles: "Уничтожить правительство Каира!"
UOB_destroy_exiles_desc: "Контроль Каира над Гибралтарским проливом и Суэцким каналом отрезал нас от Средиземноморья и вынудил нас использовать мыс Доброй Надежды для доступа на Восток."
UOB_european_rev: "Европейская революция"
UOB_european_rev_desc: "Реакторы по всей Европе дрожат, потому что призрак социализма висит по всему континенту."
UOB_intervene_spain: "Испанское выступление"
UOB_intervene_spain_desc: "В последние годы Испания пережила много конфликтов, начиная с 1902 года и заканчивая войной в Рифе и заканчивая настоящим."
UOB_global_revolution: "Всемирная революция"
UOB_global_revolution_desc: "Теперь, когда мы доминируем в Европе и реакционные изгнания были подчинены, у нас теперь есть свободная рука с остальным миром. Давайте выйдем и возвести свет социализма во все уголки земного шара!"
UOB_sov_split: "Исцеление англо-советского разделения"
UOB_sov_split_desc: "Со времени основания Союза Британии мы в значительной степени игнорировали существование Советского Союза, рассматривая его как потенциально реакционную силу из-за отсутствия у них индустриализации. Наш разрыв был укреплен созданием четвертого международного соперника Советского Третьего Международного. Сейчас ему становится все труднее по мере того, как наши сферы влияния становятся все ближе. Теперь мы должны спросить, что мы будем делать в отношении Советского Союза."

### flags

UOB_world_rev: "Революционистская внешняя политика"
UOB_euro_rev: "Союзистская внешняя политика"
UOB_knockoff_stalin: "Национальная социалистическая внешняя политика"
UOB_centralised_mil: "Национальная социалистическая армия"
UOB_doctrine_of_autonomy: "Военнослужащие-революционисты"
UOB_political_military: "Военнослужащие-союзники"
UOB_collectivist_econ: "Национальная социалистическая экономика"
UOB_lolbert_econ: "Революционистская экономика"
UOB_socialist_econ: "Союзистская экономика"
UOB_lobert_victory: "Революционистское большинство"
UOB_compromise_a: "Революционистско-национальная социалистическая коалиция"
UOB_natcol: "Национальное социалистическое большинство"
UOB_compromise_b: "Революционистско-конионистская коалиция"
UOB_socialists_win: "Профсоюзное большинство"

UOB_alliance_done: "Предлагаемый Глобальный альянс"

### decisions
UOB_motorway_decisions: "Строительство автомагистралей"
UOB_motorway_decisions_desc: "Построив новые высокоскоростные проезжие части дальнего следования, называемые "Моторвей", мы сможем связать нашу страну и еще больше подготовиться к возрасту автомобиля массового типа. Однако эти автомагистрали крайне непопулярны из-за их стоимости, ущерба, нанесенного сельской местности, и отсутствия полезной информации."
UOB_south_england: "Автомагистрали для стран Юга"
UOB_central_britain: "Автомагистрали в Центральной Великобритании"
UOB_norf_briton: "Строительство автомагистрали в Северной Великобритании"

## - economy
UOB_economic_policy: "Экономическая реорганизация"
UOB_economic_policy_desc: "С потерей доступа к нашим традиционным торговым партнерам в связи с крахом Империи, даже после того, как экономические шрамы революции зажили, мы все еще боремся с экономической ситуацией."

##natsoc
UOB_economic_nationalism: "Экономический национализм"
UOB_economic_nationalism_desc: "Если мы хотим выжить как политически изолированное островное государство, мы должны реорганизовать нашу экономику, чтобы она больше не зависела от внешних источников, чтобы выжить."
UOB_build_forts: "Промышленность обороны"
UOB_build_forts_desc: "Британия должна стать островом, на котором невозможно пройти милю, не видя какой-либо формы защитной структуры."
UOB_state_economy: "Государственный контроль"
UOB_state_economy_desc: "Ничего в нашей экономике не должно быть за пределами государственной власти, в любой части экономики, независимо от того, насколько незначительной должна быть степень государственного надзора со стороны широкой бюрократии."
UOB_rebuilt_britain: "Новая британская экономика"
UOB_rebuilt_britain_desc: "Мы вступаем в новую экономическую эру, где то, что считалось экономическим здравым смыслом и консенсусом на протяжении последних 100 лет, было отвергнуто в пользу нового экономического режима, обеспечивающего выживание британского социализма."
UOB_new_corn_laws: "Новые законы о корне"
UOB_new_corn_laws_desc: "Отмена Корновых законов Пилом в 1832 году позволила импортировать дешевое зерно из Америки, что привело к значительному снижению цен на зерно и резкому увеличению поставок продовольствия. Это позволило произвести промышленную революцию и демографический бум, а также, конечно, капитализм. Однако это разрушило британское земледелие, вывело крестьян с фермы и поместило его на работу, заставив нас полагаться на иностранные страны в плане поставок продовольствия. Современные сельскохозяйственные технологии и участие гражданского населения, поощряя их к "уменьшению социализма", возврат к Корнским законам не обязательно приведет к чрезмерному сокращению запасов продовольствия. При вступлении в брак с другими протекционистскими законами в отношении стали, угля и других ресурсов наряду с государственным вмешательством будет наблюдаться рост производства этих отечественных отраслей, с тем чтобы компенсировать сокращение предложения к спросу, обусловленное устранением иностранной конкуренции."
UOB_expand_mining: "Новые мины"
UOB_expand_mining_desc: "Скромный британский шахтер хорошо служил нашей стране, но он не был достаточно хорош для того, чтобы подготовить нас к следующей войне, мы должны копать гораздо глубже, в гораздо большем числе, чтобы заверить нашу военную машину будет эффективным. Многие по всей Британии будут возмущены разрывом сельской местности в пользу новых мин, как бы мало они ни могли сделать, чтобы остановить их."

##unionist
UOB_economy_for_unions: "Экономика профсоюзов"
UOB_economy_for_unions_desc: "Профсоюзы были основой революции, и они должны быть и нашей экономикой. Без этих союзов у нас не было бы социализма, и без этих союзов социализм не может функционировать. Они должны быть центральными."
UOB_revival_a: "Политика в отношении доходов"
UOB_revival_a_desc: "Устанавливая политику в области доходов, в рамках которой профсоюзы будут сотрудничать с правительством в вопросах заработной платы в промышленности, мы можем ограничить высокие темпы инфляции, с которыми мы сталкиваемся, не прибегая к карательным мерам."
UOB_revival_b: "Схемы &quot; макет-работ &quot;"
UOB_revival_b_desc: "Огромный объем новых строительных проектов будет зеленым, а безработные будут в них встраиваться, и эти рабочие будут накормлены, одеты и оплачены, с тем чтобы больше денег могло циркулировать по всей экономике."
UOB_mobilised_unions: "Мобилизованные профсоюзы"
UOB_mobilised_unions_desc: "Профсоюзный человек не просто трудящийся, он также может быть солдатом, и он может сделать средства для солдата своими квалифицированными руками."
UOB_infrestructure_a: "Расширение британского железнодорожного сообщения"
UOB_infrestructure_a_desc: "К концу XX века наша железнодорожная сеть достигла своего пика в Британии, где с тех пор почти не прокладываются линии, однако с уделением нашим новым правительством большего внимания армии, чем военно-морскому флоту, а также с увеличением потребностей в перевозке товаров внутри страны, необходимо построить новые линии и расширить существующие линии. С разрушением аристократии будет намного легче получить разрешения на строительство линий по суше."
UOB_infrestructure_b: "Автомагистрали"
UOB_infrestructure_b_desc: "В то время как автомобиль в настоящее время не доступен массам, в отличие от Америки, в будущем он, скорее всего, станет очень важным, и для облегчения быстрого транспорта мы построим огромные дороги, простирающиеся через британскую сельскую местность, превратившись в вены нашей нации, соединяющие жизненно важные органы, которые являются нашими городами."

##revo
UOB_liberated_economy: "Трудящийся рай"
UOB_liberated_economy_desc: "Наша экономическая политика проста: освобождение британского рабочего и подготовка к освобождению международного работника."
UOB_a_mobilised_proletariat: "Экономика для революции"
UOB_a_mobilised_proletariat_desc: "Рабочие свистят, как средство для освобождения мира собираются кожаными руками, они знают, что они являются частью чего-то большего, и даже те, кто не знает своей небольшой части большего тела, довольны своим большим количеством свобод на рабочем месте."
UOB_pro_worker_policy: "Политика в отношении трудящихся"
UOB_pro_worker_policy_desc: "Хотя государство играет лишь небольшую и военную роль в нашей экономике, мы можем использовать эти возможности для того, чтобы добиться значительного прогресса для трудящихся."
UOB_free_communes: "Независимые коммуны трудящихся"
UOB_free_communes_desc: "После ликвидации старой системы графств у нас есть чистая основа для создания любой системы управления, которую мы хотим, и поэтому мы будем использовать ее для создания небольших автономных зон, в которых рабочие полностью контролируют политику в этой области, а товары и услуги циркулируют на местном уровне."
UOB_military_factories_gooo: "Строить революцию"
UOB_military_factories_gooo_desc: "Для достижения необходимой цели мировой революции мы должны обеспечить преобразование многочисленных заводов в промышленность для наших военных."
UOB_dockpilled: "Наш путь в мир"
UOB_dockpilled_desc: "Эвакуация большинства Королевских ВМС к правительству Каира оставила нам нелегкий доступ к более широкому миру, уложив больше кораблей с расширенными верфями, мы можем заверить, что британский рабочий будет править волнами, никогда не быть рабами!"

## - Military

UOB_begin_purge: "Новая модель армии"
UOB_begin_purge_desc: "После окончания Великой войны широкая общественность потеряла интерес к армии, вернувшись к традиционной любви флота после того, как народ был потрясен жестокими сражениями Сомме и Йпреса, что отразилось на общем состоянии армии Великобритании как до, так и после революции. Революция, в конце концов, была вызвана массовым неверием в британской армии. С нашей сменой акцента на армии по сравнению с дореволюционным правительством мы проведем целый ряд масштабных реформ, которые позволят нам противостоять таким войнам, которые мы будем ожидать в предстоящие годы."

###rev

UOB_revolutionary_doctrines: "&lt; &lt; Армия будущего &gt; &gt;"
UOB_revolutionary_doctrines_desc: "В то время как реакционеры во всем мире продолжают использовать испытанные и испытанные методы, умы заблокированы на конгрессах, мы создадим армию будущего, в которой ни один солдат не будет вынужден идти к своим местам, где наши люди будут в безопасности за дюймами стали, и где чистая скорость будет превыше даже самых быстрых реакционных идей. Эти идеи смелы, но мы верим, что это даст нам преимущество перед любыми другими военными в мире."
UOB_doctrine_of_autonomie: "Доктрина автономии"
UOB_doctrine_of_autonomie_desc: "Хотя высшее командование по-прежнему будет играть важную роль в руководстве нашими армиями и их объединении, мы дадим нашим офицерам более широкие полномочия в плане планирования, организации и принятия решений."
UOB_cult_of_offensive: "Культ наступательных потенциалов"
UOB_cult_of_offensive_desc: "Наша доктрина мало что говорит о обороне, в молнии быстрых революционных войн защита не нужна, обучение наших людей как можно быстрее продвигаться вперед, с как можно большей силой и силой, приведет нас к победе. В нашей концепции войны есть только нападение, нападение и атака еще больше."
UOB_doctrine_mw: "Поворот"
UOB_doctrine_mw_desc: "Сила - это одно, но скорость очень важна, и способность правильно использовать обе вышеупомянутые характеристики является самой важной в современной войне. Мы должны подготовиться к созданию обширных окружений вражеских армий, чтобы мы могли уничтожить или восстановить массовую капитуляцию их, прежде чем мы приступим к победе."
UOB_a_armoured_force: "Механизированная сила"
UOB_a_armoured_force_desc: "Хотя мы и добились значительного прогресса, мы, наконец, провели необходимые реформы наших вооруженных сил, которые сделают Республиканскую армию наиболее развитой и прогрессивной силой в мире. &lt; &lt; Реакционные генералы &gt; &gt; могут удивиться, но они поймут свою глупость, когда наши танки и грузовики без усилий прорежут свои силы на поле боя, как масло."
UOB_tank_research: "Исследования в области артиллерийских исследований"
UOB_tank_research_desc: "В то время как мы были первыми, кто развертывал танки, со времен Великой войны технология значительно продвинулась вперед, и мы больше не можем пользоваться самыми современными транспортными средствами в этой области, мы должны заставить наших инженеров взломать создание новых, лучших танков, чтобы сделать эти передовые танки основой нашей армии."
UOB_full_motorisation: "Полная моторизация"
UOB_full_motorisation_desc: "Мы перенаправим большую часть нашей промышленности на производство оружия, чтобы каждый солдат мог быстро добраться до места назначения и использовать неподготовленных врагов."

###union

UOB_political_mil: "Военно-политическая армия"
UOB_political_mil_desc: "Для того, чтобы предотвратить контрреволюцию и узурпацию революционной власти, мы должны обеспечить, чтобы у нас была абсолютно лояльная армия."
UOB_political_commisars: "Политические комиссары"
UOB_political_commisars_desc: "Чтобы изменить культуру наших военных, мы привлечем политических комиссаров, которые будут обучать наши вооруженные силы и обеспечивать устранение тех, кто испытывает реакционные настроения."
UOB_civilian_oversight: "Гражданский надзор"
UOB_civilian_oversight_desc: "Осуществление надзора за гражданским органом обеспечит, чтобы наши военные действовали не только этически, но и в соответствии с волей народа."
UOB_superior_fp: "Симфония разрушения"
UOB_superior_fp_desc: "Мы должны разработать наши доктрины, которые позволят нам правильно использовать эту силу."
UOB_reinvigorated_command: "Возрожденное командование"
UOB_reinvigorated_command_desc: "Массовая некомпетентность высшего командования была очищена, и теперь солдаты преданы, и теперь мы можем вступить в новую эру войны, гарантируя, что одержим победу."
UOB_modern_weapons: "Современное стрелковое оружие"
UOB_modern_weapons_desc: "Создание более мощного и надежного переносного оружейного комплекса обеспечит, чтобы отдельный британский солдат был в два раза дороже, чем тот, с которым он сталкивается на другой стороне поля боя."
UOB_arty_rs: "Красная артиллерия"
UOB_arty_rs_desc: "Что отделило Великую войну от предыдущих войн, так это то, что большинство людей не видели того, что их убило, а хорошо устроенная артиллерийская атака за пределами фронта привела бы их к их гибели."

# - Army

UOB_union_army: "Армия государства"
UOB_union_army_desc: "Наша военная политика может быть просто охарактеризована как военная для государства, государством. Государственная власть дойдет до всех частей армии и обеспечит, чтобы военные функции были должным образом и лояльны. Это будет военная деятельность, основанная на тяжелой сверху организации и построенная в ожидании устранения иностранных угроз, а не наступательных войн."
UOB_shells_soldiers: "Военная бюрократия"
UOB_shells_soldiers_desc: "Создание широкой бюрократии на службе наших военных значительно повысит эффективность наших военных действий и позволит нам установить более жесткий политический контроль над военными."
UOB_modern_army: "Не отступать"
UOB_modern_army_desc: "Применение смертной казни за любое несанкционированное отступление означает, что любой нападавший должен будет бороться, чтобы занять любую позицию, которую мы занимаем."
UOB_strat_plan: "Централизованное планирование"
UOB_strat_plan_desc: "Мы построим мощную культуру, которая будет следовать за военной иерахией в наших службах, от рядового до коммандера, не будет никаких отклонений от приказов или планов."
UOB_revo_guard: "Стража революции"
UOB_revo_guard_desc: "Подготовив наше высшее командование и отправив наши войска в ожидании войны на британской земле, мы сможем убедиться, что, когда любой иностранный захватчик приземлится на наших пляжах, его столкнут обратно в канал!"
UOB_defence_britain: "Оружие в каждой руке"
UOB_defence_britain_desc: "Мужчины нуждаются в винтовках, как например: приобретая гражданское оружие и ушедшее в отставку стрелковое оружие, мы позаботимся о том, чтобы ни один винтовщик не столкнулся с битвой не более чем палками и камнями."
UOB_fist_union: "Буря стали"
UOB_fist_union_desc: "Развитие новых стальных зверей позволит нам гоняться на любую иностранную посадку с большой скоростью и обеспечит, чтобы главным образом пехотные приземления были быстро разрушены."

# - Air Force

UOB_union_air: "Республиканские военно-воздушные силы"
UOB_union_air_desc: "Контроль над небом столь же важен для защиты Британии, как и для морей."
UOB_inter_force: "Сила перехвата"
UOB_inter_force_desc: "Беспокойство по поводу иностранных бомбардировок наших городов и городов опустошает британское население."
UOB_bomb_defence: "Защита бомбардировщиков"
UOB_bomb_defence_desc: "Наряду с бойцами мы можем защитить наше небо с помощью целого ряда зенитных пушек, которые обеспечат безопасность британским мужчинам и женщинам."
UOB_air_strat: "Стратегии в отношении военно-воздушных сил"
UOB_air_strat_desc: "Мы должны быть компетентны в небесах, и поэтому у нас должна быть современная доктрина, подходящая под наше современное оборудование."
UOB_modern_weap: "Обновление Республиканских военно-воздушных сил"
UOB_modern_weap_desc: "Программа модернизации завершена, и теперь у нас есть гораздо более сильная сила, чем когда мы начинали."
UOB_brit_bomb: "Развитие военно-морских бомбардировщиков"
UOB_brit_bomb_desc: "По сравнению со своим предшественником, Республиканский флот чрезвычайно слаб, чтобы изменить ситуацию, мы создадим флот военных бомбардировщиков, которые помогут нам бороться с морями наших врагов."
UOB_indust_target: "Промышленные целевые показатели"
UOB_indust_target_desc: "До революции в Королевских военно-воздушных силах по имени Артур Харрис выступал за политику бомбардировок, в ходе которой огромные бомбардировщики сбросили огромную нагрузку на вражеские города и города, чтобы уменьшить их потенциал и волю к войне."

# - Navy

UOB_union_navy: "Республиканский военно-морской флот"
UOB_union_navy_desc: "Республиканский флот гораздо меньше королевского флота, который был до него, и мы должны провести некоторые крайне необходимые реформы, чтобы модернизировать и расширить его, чтобы подготовиться к будущим отношениям."
UOB_our_shield: "Наш щит"
UOB_our_shield_desc: "С самого начала боевые корабли были центром нашего флота, только потому, что произошла революция, почему все это должно измениться?"
UOB_defend_coast: "Защита нашего побережья"
UOB_defend_coast_desc: "С меньшим флотом, чем прежде, мы должны построить новые корабли с целью защиты прибрежных районов, а не дипломатии катеров."
UOB_mod_doctrines: "Современные доктрины"
UOB_mod_doctrines_desc: "Это уже не дни Джутланда и Желлико, у нас должна быть современная доктрина, чтобы сражаться в войнах Томроу."
UOB_land_force: "Посадочные силы"
UOB_land_force_desc: "Расширение революции из Британии потребует использования Республиканских морских пехотинцев для защиты пляжной головы, чтобы мы могли двигаться дальше, чем края нашего острова."
UOB_nav_trad: "Возвращайся к нашим морским традициям"
UOB_nav_trad_desc: "В то время как революционное правительство по своей сути является антитрадиционистом, некоторые вещи не меняются, и уроки нашей истории и знания наших предков морей ценны и по сей день."
UOB_our_sword: "Меч наш"
UOB_our_sword_desc: "В то время как боевые корабли будут оставаться центральными, авианосцы все чаще становятся важной частью флота, и мы должны обеспечить, чтобы они были неотъемлемой частью нашего флота."
UOB_asw_effort: "Борьба с подводной водой"
UOB_asw_effort_desc: "Подводные лодки представляли серьезную угрозу нашему выживанию во время Великой войны, и нельзя допустить, чтобы они вновь представляли такую угрозу."



##### Events #####
#flavour
#revo tree
uob.500.d: "Местные жители смотрели в ужасной тишине, когда Йоркский собор купался в пламени. Жители окружающего средневекового Шамблса и Бутама были поражены ярким светом от 700-летнего собора, проткнувшего черную ночь. Молчание толпы было разорвано рычанием огня и слабыми звуками смеха и разбитиями, выходящими из глубины. Несмотря на то, что его одежда ползала посмертно, три больших, кровопролитных народа стояли со своей спиной, три молодых человека шевелились о том, чтобы носить вековое тело священника, рычащего смехом, прежде чем разочаться и бросать тело в кучу горящих бильярдов и пухов, только для того, чтобы возобновить пьянство."
uob.502.d: "Он знал, что он далеко от Сомерсета. Он подумал, что Эми, его любовь, и молился, что она не была замечена, смотря на антисоциалистские плакаты вокруг недавно социализованной соборной школы Уэллс. Другие заключенные смотрели на него странно, некоторые зажатые солдаты, некоторые более утонченные, не так молоды, как он. Вы будете собирать артиллерийские снаряды для Республиканской армии. Это опасная работа, но будет опаснее, если вы не будете слушать своих лидеров. Если вы не будете работать, то будете наказаны в течение минуты, пока не будете разрушены несколько человек, и вы будете наказаны, если вы будете наказаны, если вы будете наказаны, и будете наказаны в будущем."
uob.503.d: "&quot; Бристоль! Серьёзно!! Синтия громко протестовала. &quot; Слушай, всего на несколько месяцев, я уверен... -- Оскар тихо пытался ответить, прежде чем Синтия захлопнула на столе оскорбительные проекты газет. -- Мы только семь месяцев были женаты, прожили в Яттоне всю нашу жизнь, теперь вас отправляют в этот чертов город, и за что? Мировая революция? Все вы умерли, пытаясь. -- Оскар смотрел вслух. -- Ничего не было сделано, когда многочисленные протесты против таких проектов быстро свалились толпами прореволюционных фанатиков и проектов были навязаны жестокой болью быть обвиненными в том, что вас обвиняют в реакции. -- В ту ночь в тишине не было ни одного слова, пока на следующее утро не слезоточивое прощание не произошло, и Оскар не вышел на задний план грузовика, который, возможно, больше никогда не будет замечен."
uob.504.d: "Секунды после того, как сержант скрипнул скрипку, группа мужчин начала спотыкаться на пути через пересеченную дорогу, состоящую из вырубленных деревьев, опустевших кирпичных стен, колючей проволоки и висящих баров. Несмотря на их легкий груз оборудования, их некомпетентность была разоблачена. После того, как группа мужчин споткнулась друг о друга и погрузилась в грязь под ногами, сержант свистел второй крик. Все движение остановилось, когда сержант начал кричать комбинацию оскорблений и разочарованных криков, пока его голос не стал хвастаться 150 фунтами. В конце концов, этот свист снова стал свистком, указывавшим на то, что он хотел, чтобы они снова прошли курс. Он сел на близлежащую скамейку и громко выдохнулся, хотя убежденный социалист долгое время до войны, где мужчины были в состоянии, профессионалы, и мог сделать тот же тот же самый курс, который был нарисован более, чем настоеные люди."
uob.505.d: "Потрясающие звуки шутов и джинсов собравшейся толпы вращались вокруг Эдварда, жестокие звуки, исходящие из небольшого 1х1 фута запертого окна. Эдвард только раньше рассматривал Лондонскую башню как место, где живут драгоценности Короны. Он чувствовал себя глупым, когда смотрел на нее с такой степенью незначительности, как он сейчас жил в Башне, но в минусе, ячейке, а не в ювелирной башне. Он начал протестовать, требуя по крайней мере час последней молитвы, прежде чем он достиг своего момента, перед тем, как заткнулся черный черный черный черный дверь уступил дорогу большой фигуре, идущей вместе с несколькими другими, схватил его и забрал его. Как только бывший король подхватил его, и его недружелюбный центр появился наружу, где собралась большая толпа, чтобы поднять этот жестный жест, он поднялся на тяжёлую площадку перед тем, как он на своем последнем месте, он заглушил его хал хал хребятую херную речь."
uob.505.a: "Ещё один тиран в Грязи!"
uob.506.d: "Высылка эмигрантов из материковой части Великобритании привела к беспрецедентному перемещению людей, материальных средств и техники с Британских островов на обширных кораблях Королевского флота. &lt; &lt; Изгои &gt; &gt; смогли эвакуировать большое количество этих машин и капитала в Каир, и теперь мы сталкиваемся с последствиями этой эвакуации."

#natsc
uob.501.d: "В течение многих лет у семьи Ричардс было то же самое, что и в воскресенье. Утром была церковь. Вся семья ходила вместе по ветряным деревянным дорожкам, чтобы приехать на скромный монастырь, где они вместе молились всемогущему, безопасному, зная, что в конце этой жизни они могут провести вечное блаженство вместе. После церкви был воскресный обед, и семья навещала своих бабушек и дедушек в их рамшакле на краю деревни, чтобы поесть как одна. И наконец, в вечернее время были воскрешены дети до того, как вся семья в своем воскресеньем золоте была бы взволнована на жаркой картошке, говядине, говядине и кипящей морковой моркови. после революции, после шрамов войны, еда стала меньше. Дедушка и дедушка пропустили несколько недель после войны, и теперь дом был занят молодой парой из Лондона, и теперь школьные учителя, зная, что это была местная церковь Англии. Церх теперь встали и закрыли после того, как правительство взяло молотку Англинской церкви. То, что они сделали, то, что они пропустили в Санди Рост."

# the revolution
uob.3.d: "По мере того, как ситуация в Британии усиливается, все больше и больше солдат пересекают линии по мере углубления раскола в армии. &lt; &lt; Солидарные &gt; &gt; линии, корабли, плывущие из своих портов в контролируемые Революцией порты и самолеты, взлетающие с реакционных аэродромов, никогда не возвращаются. &lt; &lt; Теперь у нас есть большая профессиональная сила, с которой мы можем встретиться с правительством &gt; &gt; ."
uob.4.d: "Вместе с перебежчиками сейчас находятся массы вооруженных рабочих, готовых сражаться и умереть за революцию."
uob.5.d: "За последние несколько недель между нами и правительством произошло противостояние. Многие начали сомневаться в том, что мы серьезно настроены на революцию или согласны с компромисацией за простое повышение заработной платы. Сегодня их глупость была разоблачена, так как во всех британских революционных войсках размытое нападение на правительственные силы. Революция началась!"
uob.6.d: "Однако будущее социализма в Великобритании остается неопределенным, и необходимо решить многие вопросы, прежде чем мы сможем построить наш Иерусалим."

# The Power Struggle
uob.7.t: "Объединенный конгресс британских трудящихся"
uob.7.d: "Теперь, когда пыль осела, а оружие затихло, настало время приступить к реализации социализма в этой стране! Множество противоречивых мнений о том, как лучше всего пронести эту мускул через массы, с горячими аргументами и даже политическим насилием. Чтобы остановить это расслоение от спирали контроля, революционные авангарды под командованием Клемент Аттле созвали конгресс в старом дворце Вест-Министров. Старые предатели и реакторы Дворца были казнены или запуганы, и теперь вновь открытый Дворец Британских Воккеров собирается работать над исправлением этих разногласий, с тем чтобы ответственное правительство могло привести революцию в будущее. § § 3 основные фракции в Конгрессе, которые выступают за умеренный подход к социализму и революции. Они выступают за сохранение древних англо-саксоновских свобод и считают, что Великобритания находится в лучшем положении для руководства такой революцией. Внутренний дворец Британского Воккерского дворца проводит легкую политику центрального планирования в сочетании с сильной социалистической и профсоюзной силой. §нисты §и составляют вторую фракцию, которая выступает за сохранение социализма, которая выступаета за сохранение древней англо-политики."
uob.7.a: "Да начнётся Конгресс!"
uob.8.t: "Экономические прения"
uob.8.d: "Первый вопрос, который будет рассматриваться Конгрессом, касается будущей экономической политики. В рядах были ожесточенные споры по поводу того, как должен выглядеть социализм, была ли политика Ленина в России правильной, следует ли переосмыслить Маркс и Энгельс, причем эти разъяренные дебаты были прерваны только членами, которые кидали в ходе длительных просмотров Das Kapital. Несмотря на многочисленные споры, три фракции объединились между собой на трех широких позициях. Революционисты заявляют о легком центральном планировании для сохранения революционной машины, обеспечивая в то же время значительную автономию трудящихся с военными квотами, диктуемыми автономным профсоюзам. Между тем, фракция Союза утверждает, что требуется определенный объем централизованного планирования для предотвращения реакционных методов экономической организации, в то время как в то же время большой объем автономии рабочих должен быть обеспечен и свободы этих работников должны быть гарантированы сильными профсоюзами. Они верят в значительное расширение инфраструктуры как в план создания рабочих мест, так и в способ рационализации британской промышленности. Националисты выступают за масштабное централизованное планирование с установлением квот на производство, диктируемое огромной бюрократией стороной, что они также могут обеспечить дальнейшее развитие экономики."
uob.8.a: "Центральные планировщики лучше знают."
uob.8.b: "Рабочие лучше знают."
uob.8.c: "Предпочтительна смешанная экономика."
uob.9.t: "Дискуссия по внешней политике"
uob.9.d: "Следующий вопрос в повестке дня Конгресса - это внешняя политика. Британия очень изолирована, как одинокий маяк социализма в Западной Европе, с чрезвычайно плохими отношениями с единственной другой крупной социалистической державой, Россией, возникшей в результате исторического недоверия и отсутствия политической или материальной поддержки революции. Из этой ужасной ситуации появились три предложения. Революционисты выступают в пользу мировой революции, возглавляемой Великобританией, в которой мы прежде всего добьемся европейской революции, прежде чем перейдем к остальной части мира. Союзисты выступают за сдержанную революционную политику, выступая в пользу вырезания революционной сферы влияния в Западной Европе. Националисты верят в непоколебимую изоляцию внешней политики, закрывающую Великобританию от других социалистических держав и желающую лишь восстановления Ирландии, с тем чтобы Великобритания могла строить социализм в мире."
uob.9.a: "Мы должны укрепить социализм в Великобритании"
uob.9.b: "Революция должна распространиться на весь мир!"
uob.9.c: "Западноевропейская революция будет гарантировать нашу безопасность."
uob.10.t: "Военные дебаты"
uob.10.d: "С учетом того, что во время революции большинство лучших членов Республиканской армии были убиты, Королевские военно-морские силы были в основном эвакуированы в Каир, а Республиканские военно-воздушные силы были в отчаянии, требуется изменение политики или свет революции может быть сорван. Несмотря на то, что эти три предложения доминировали в Конгрессе. Революционисты выступают за доктрину автономии, в соответствии с которой офицеры и генералы в значительной степени отделены от высшего командования и политических институтов. Они выступают за мобильную форму войны, в которой революция может быть успешно осуществлена за короткое время с минимальным количеством жертв с помощью моторизованной и бронебойной армии. Национальная социалистическая фракция твердо верит в политизацию вооруженных сил с целью обеспечить сильную культуру социализма между вооруженными силами посредством создания политических комиссаров и сильного гражданского надзора за вооруженными силами. Наряду с этим они выступают за военную доктрину комбинированного оружия и артиллерии, утверждая, что уроки Великой войны не дают оснований для подобной стратегии. Национальные социалисты выступают в пользу высокоцентрализованной военной связи с центральным правительством. Такие военные силы смогут практически не уклоняться от гражданского надзора и вмешательства, с жесткой структурой военного планирования."
uob.10.a: "Мы должны централизовать армию, чтобы обеспечить нашу безопасность."
uob.10.b: "Механизация и автономия — это будущее."
uob.10.c: "Гражданский надзор и смешанные вооружения будут играть ведущую роль."
uob.11.t: "Дискуссия подходит к концу"
uob.11.d: "После нескольких недель интенсивных дебатов аргументы, наконец, закончились голосованием большинства в пользу каждой политики."
uob.11.a: "Наконец!"
uob.12.t: "Национальная социалистическая победа"
uob.12.d: "Начав дебаты, Национальная социалистическая лига Великобритании приняла большинство голосов в Конгрессе, и новому Председателю Джок Хастону предстоит проделать большую работу, создав новые огромные институты и организовав массовую централизацию."
uob.12.a: "Великолепно."
uob.13.t: "Революционистская победа"
uob.13.d: "Доминируя в дебатах, Международная лига революционистов приняла большинство в Конгрессе. Клемент Аттле сохранил пост Председателя. После успешного руководства Великобританией в результате революции многие надеются, что он будет столь же успешным в том, чтобы вывести страну из нее и в мир."
uob.13.a: "Реакторы по всему миру дрожат."
uob.14.t: "Профсоюзная победа"
uob.14.d: "Доминируя в дебатах, Британская Всесоюзная Социалистическая лига приняла большинство в Конгрессе. Новому президенту Артуру Макманусу предстоит проделать большую работу, поскольку необходимо провести крупные реформы для реализации профсоюзного видения социалистической Британии."
uob.14.a: "Великолепно."
uob.15.t: "Конгресс Хунга"
uob.15.d: "После многочисленных дебатов в Конгрессе не появилось явного большинства. чтобы выжить в британском социализме..."
uob.15.b: "Объединяйтесь с союзниками"
uob.15.a: "Разбирайтесь с национал-социалистами"

uob.16.d: "Британцы потребовали нашего североатлантического имущества, и эти требования, естественно, возмутительны, как бы мы ни были в уязвимом положении, если мы не сдадим эти острова и не подготовимся к конфронтации, другие страны могут почувствовать запах крови в воде и начать выдвигать требования."
uob.17.d: "Это угроза нашей безопасности, на которую нужно реагировать!"
uob.18.d: "Британцы и канадцы, похоже, наслаждаются тем, что вырезают между собой Северную Атлантику."
uob.19.d: "Наши требования были первоначально отвергнуты датчанами, и мы начали готовить флот к войне в Северной Атлантике, однако с тех пор Германия и Канада присоединились к требованиям Дании, и теперь маленькая нация сталкивается с тремя иностранными державами."
uob.20.d: "Британцы и канадцы получили то, что они хотят, теперь наша очередь: мы освободим Шлезвиг-Гольштейна от датчан и поставим дружелюбное правительство на Север."

uob.21.d: "Сегодня правительство в Союзе Британии объявило о том, что «мировая революция» началась, а затем перечислили каждое национальное государство в мире по одному, прежде чем сообщить всем этим государствам, что Союз Британии в настоящее время воевал с ними. Мир теперь объединился против Британии и их революционных союзников, и сейчас только время покажет, сможем ли мы остановить падение мира на социализм."
uob.22.d: "Советский вопрос был одним из величайших вопросов, которые следует проигнорировать в британской политике, однако его уже нельзя игнорировать, поскольку наше европейское влияние распространяется на Советский Союз."
uob.23.d: "Долгое время одной из величайших угроз советскому социализму были британцы. С падением Великобритании на социализм мы думали, что эта угроза могла бы уменьшиться. Сегодня мы оказались безумно неправы, так как Великобритания объявила войну нашей нации."

## alliance events
uob.800.t: "Великобритания приглашает нас на четвертую Международную конференцию"
uob.800.d: "Недавно созданное революционное правительство Великобритании пригласило нас на четвёртый международный форум, хотя письмо на поверхности - это вежливое приглашение, оно читается как ультиматум, и многие в нашем правительстве задаются вопросом, не примут ли британцы отказ в пользу навеса, вероятно, из-за нашей жизненно важной позиции в отношении контролируемого Гибралтаром изгнания. Как мы отреагируем?"
uob.800.a: "Испания стоит с британским работником!"
uob.800.b: "Мы не станем преклоняться перед мерзким альбионом,"
uob.801.t: "Испания принимает наше приглашение!"
uob.801.d: "Испания поддерживает нас, отчасти из-за солидарности и той огромной помощи, которую мы можем им оказать в их бедственном положении, а также, вероятно, из-за жесткой формулировки этого приглашения."
uob.801.a: "Нам повезло, что они поняли!"
uob.802.t: "Гадкие испанцы отказываются!"
uob.802.d: "Наша история с Испанией является прекрасной, и мы должны были ожидать, что они откажутся от нашего союза из-за прошлой враждебности."
uob.802.a: "Мы не спрашивали."
uob.802.b: "У нас было достаточно левых драок."

uob.803.t: "Британцы приглашают нас на четвёртую Международную конференцию."
uob.803.d: "До сих пор мы были осторожны с британскими социалистами, до сих пор мы были изолированной силой социализма в Европе, и теперь одна из крупнейших европейских держав и наш величайший предреволюционный торговый партнер падают на социализм, теперь они протянули руку помощи, требуя альянса."
uob.803.a: "Давайте встанем вместе с нашими британскими товарищами."
uob.803.b: "Изоляция - вот что спасло нас."
uob.804.t: "Норвежцы принимают наше предложение!"
uob.804.d: "Норвегия является полноправным членом четвертой Международной конференции, и нам повезло, что нам не придется бороться с ними за контроль над Северным морем, и теперь наше влияние в регионе и, следовательно, в Скандинавии укреплено."
uob.804.a: "Ура!"
uob.805.t: "Норвежцы отказываются!"
uob.805.d: "Норвегия отказалась, заявив, что они не хотят, чтобы их втягивали в какие-либо войны и что им лучше уйти в одиночку."
uob.805.a: "Черт побери."

uob.806.t: "Великобритания приглашает нас на четвертую Международную конференцию"
uob.806.d: "Долгое время казалось, что британцы были величайшей угрозой советскому социализму. Теперь, после борьбы со многими странами, которые больше всего угрожали нам, они кажутся скорее союзником, чем врагом. Теперь они предлагают нам союз, хотя мы должны оставаться подозрительными к их мотивам. Как мы ответим?"
uob.806.a: "Мы вместе с британским работником!"
uob.806.b: "Британцы не должны восприниматься всерьез."
uob.807.t: "Советы принимают наше приглашение!"
uob.807.d: "После напряженного ожидания, Советы наконец объявили, что они присоединятся к Четвертому Международному. Англо-советский раскол исцелился, и мы можем с нетерпением ожидать новой эры, эры социализма!"
uob.807.a: "Мы стоим рядом с советским работником."
uob.808.t: "Советские Отказы!"
uob.808.d: "После Великой игры в Азии мы были врагом России, и союз во время Великой войны был лишь временной отсрочкой от этой ситуации. Теперь, после того как мы расширили ветвь дружбы, они отказались. Какова будет наша политика сейчас?"
uob.808.a: "Удар в дверь и вся гнилая структура рухнет"
uob.808.b: "У нас было достаточно левых драок."


