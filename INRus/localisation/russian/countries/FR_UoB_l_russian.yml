 ENG_philip_snowden: "Филипп Сноуден"
# ENG_philip_snowden_leader_desc: "Победа Сноудена в значительной степени объясняется его решением избегать фракционной политики в конгрессе профсоюзов и тем, как он показал себя непристрастным и нейтральным кандидатом, свободным от пристрастности. С тех пор, как Сноуден взял на себя должность председателя, он увидел старые лица и новые лица появились в TCC, но он всегда оставался символом британского постреволюционного единства, всегда успокаивая междоусобную напряженность, где бы они ни пришли, и стремясь сохранить равновесие между всеми четырьмя фракциями. Возможно, именно поэтому он отказался от предложения Мосли об эксчевере. Бывший Либерально перевернутый синдикалист, возможно, является самой нормальной фигурой в эти странные времена, всегда останавливаясь над ним и отказываясь занимать свое время мелочными оскорблениями. По мере приближения Конгресса профсоюзов 1936 года, Сноуден дал много намеков на свою возможную возможность выйти на пенсию, хотя бы неудобную реальность."

 ENG_arthur_horner: "Артур Хорнер"
# ENG_arthur_horner_leader_desc: "Будучи старшим выжившим сыном семнадцати детей, из которых только шесть жили в прошлом детстве, его карьера началась в шахтах Уэльса, и идеалистический молодой человек вступил в контакт с союзами горнорудных компаний Южного Уэльса, став членом. Он будет продолжать свою политическую активность на низком уровне в уэльских союзах горнорудных компаний до тех пор, пока британская революция 1925 года, когда монархия была изгнана из страны и Союз Великобритании был объявлен конгрессом профсоюзов. Несмотря на Революцию, Хорнер был ключевым организатором забастовок Минера в Уэльсе и сыграл большую роль в гарантировании поддержки союзов шахтеров Уэльса. После смерти революционного лидера Джона Маклин Хорнер стал участником новой фракции ТУК, став важным лидером федералистской фракции статус-кво, отстаивая профсоюзы и статус, установленный после революции 1925 года."

 ENG_sylvia_pankhurst: "Сильвия Панкхёрст"
# ENG_sylvia_pankhurst_leader_desc: "5 мая 1882 года Сильвия Панкхёрст, дочь доктора Ричарда Панкхёрста и Эммелин Панкхёрст, родилась в Олд Траффорде, Манчестер, 5 мая 1882 года. Ее отец был преданным социалистом и решительным сторонником избирательного права женщин. 1906 года Сильвия Панкхёрст начала работать на полную ставку в женском социальном и политическом союзе (WSPU) вместе со своей сестрой Кристабель и их матерью. Она применила свои художественные таланты от имени ВСПС, сформировав свой логотип и различные листовки, плакаты и плакаты, а также украшая залы для встреч. В 1907 году она поселилась в промышленных городах Англии и Шотландии, рисовала портреты работающих женщин в их рабочих местах. Во время Первой мировой войны Сильвия Панкхёрст была потрясена тем, что ее мать Эммелин и ее сестра Кристабель стали активными сторонниками военного движения и кампании в поддержку призыва на военную службу. Она была против войны и публично атакована в вновь переименованной газете ВСП. &quot; Британния &quot; во время Первой войны &quot; во время Первой войны &quot; во время Первой войны &quot; стала лидером &quot; &quot; &quot; &quot; &quot; &quot; &quot; Эм &quot; &quot; &quot; &quot; Эм &quot; Эм &quot; Эм &quot; Эм &quot; Эм &quot; Эме &quot; , которую &quot; &quot; &quot; &quot; &quot; &quot; &quot; &quot; &quot; &quot; &quot; , которую &quot; , которую &quot; движуют &quot; , &quot; , которую &quot; , которую &quot; движем &quot; ,"

 ENG_tom_mann: "Том Манн"
# ENG_tom_mann_leader_desc: "Том Манн, известный первый генеральный секретарь конгресса профсоюзов, был назначен председателем ТУК после избирательного затора. Ветеранский активист, Манн продемонстрировал большую историческую приверженность движению профсоюзов и самоотверженный дух гражданской службы. Манн, однако, заявил, что в его старости он не намерен баллотироваться на переизбрание."

 ENG_willie_gallacher: "Вилли Галлахер"
# ENG_willie_gallacher_leader_desc: "Уильям Галлахер основал Комитет по уходу за трудовыми ресурсами в противовес Закону о боезарядах эпохи Велткриг, который был заключен в тюрьму в своей родной Глазго за подрыв военных усилий, Галлахер стал все более радикальным. После освобождения из тюрьмы Галлахер присоединился к Совету по торговле Глазго, являющемуся частью Большого Британского профсоюзного движения, и организовал его в качестве эффективной милиции во время революции."

