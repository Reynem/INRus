 ENG_central_committee: "Центральный комитет"
# ENG_central_committee_interim_leader_desc: "После шоковой отставки Филиппа Сноудена был сформирован временный комитет, состоящий из непартийных членов ТУК, который возглавит временное правительство до тех пор, пока не будут поданы все бюллетени ТОК."
# ENG_central_committee_communal_leader_desc: "Поскольку И Гле наконец-то смог осуществить свою мечту о преобразовании Союза, последняя реформа состоит в том, чтобы упразднить пост Председателя и вместо него заменить его общинным председателем, возглавляемым комитетом, избранным региональными ТУК."

 ENG_niclas_y_glais: "Никлас и Глейс"
 #ENG_niclas_y_glais_leader_desc: "Никлас И Глаз и поэзия, как на английском, так и на уэльском языках, написали о борьбе рабочего класса, вдохновив многих, как правило, консервативных сельских рабочих принять Британскую революцию; его уэльский перевод британского гимна"The Red Flag" is sung by Welsh socialists of all stripes.\n\nDespite fierce opposition, Glais advocates both on the floor of the Trade Union Congress, and through his poetry, the devolution of power from the TUC to workers' assemblies in Wales and Scotland. The people of these regions, he argues, are both culturally different from that of England and currently politically underrepresented. With Glais as chairman of the Trade Union Congress, power is likely to be increasingly decentralised."
 #ENG_niclas_y_glais_WLS_leader_desc: "Никлас И Глаз и поэзия, как на английском, так и на уэльском языках, написали о борьбе рабочего класса, вдохновив многих, как правило, консервативных сельских рабочих принять Британскую революцию; его уэльский перевод британского гимна"The Red Flag" is sung by Welsh socialists of all stripes.\n\nAs Wales's newfound political independence is still recent, and few socialists deny the enormous contributions of Niclas for the proletariat of Cymru. Hoping to correct what he saw as overcentralising policies during the time of the Union of Britain, Charmain Glais's main objective is to revitalize the culture and conciousness of the Welsh proletariat, something that is seen is positive abroad as to foster a notion of nationhood in the small country"

 ENG_eric_blair: "Эрик Блэр"
# ENG_eric_blair_leader_desc: "Эрик Блэр, известный писатель, который помог своему давнему союзнику Освальду Мосли занять политическое место, постепенно выступал против Мозли. При каждой возможности Мосли, казалось, шел по принципам Союза Британии и революции, которая его породила. ~ nnBlair, с политическим триумфом над своим старым другом, поклялся вернуть народу Великобритании свободы, столь вопиюще оторванные от него."

