 ### Characters ###
 PAR_jose_felix_estigarribia: "Хосе Феликс Эстигаррибиа"
 PAR_jose_felix_estigarribia_leader_desc: "Хосе Феликс Эстигаррибиа, герой войны в Чако, получил международное образование как в военном, так и в сельском хозяйстве. &quot; Эстигаррибия &quot; свергнула диктатора Рафаэля Франко и положила конец общественному хаосу, знаменовавшему либеральное правление до его восхождения, однако романтический националист, эстигарибия лишь поощряет экстремальные движения, которые стремятся в конечном счете разоблачить его. &quot; Выжить ли он в политическом отношении &quot; - это вопрос, который остается открытым, и на него ответит только время."
 # PAR_jose_felix_estigarribia_elected_leader_desc: "Хосе Феликс Эстигаррибиа, герой войны в Чако, получил международное образование как в военном, так и в сельском хозяйстве. Эстигаррибия сверг диктатора Рафаэля Франко и положил конец общественному хаосу, знаменовавшему либеральное правление до его восхождения. Несмотря на восстановление демократии, политическая карьера Эстигаррибии сначала, казалось, закончилась. Эстигаррибия, однако, попирала ожидания и вновь поднялась через ряды либеральной партии. Демократически избранная, его власть над государством сейчас не столь велика, как раньше, и хотя некоторые опасения, что он снова захватит диктаторскую власть, массы приветствуют постоянно адаптирующемуся Геро Чако Войну."

