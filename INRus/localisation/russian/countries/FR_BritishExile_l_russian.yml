 ## Initial 

 BEX_the_junta: "Военная власть"
 BEX_the_junta_desc: "Падение островов, захват и казнь бывшего действующего правительства в Вестминстере оставили в британском правительстве запас сил, который сейчас заполнен военными. Это новое правительство должно укрепить власть на территориях, находящихся под его контролем, или все надежды на Великобританию будут утрачены."
 BEX_native_situation: "Положение коренного населения"
 BEX_native_situation_desc: "Те, кто живет на территориях, которые мы управляем, наблюдали, как почти вся Британская империя падает за несколько месяцев, а теперь призывают к последнему из ее уголков, под который они попали, чтобы упасть под движение за независимость."
 BEX_order_med: "Восстановление Ордена в Средиземноморье"
 BEX_order_med_desc: "Необходимо восстановить порядок в Гибралтаре, на Мальте и на Кипре, иначе наш морской путь к Атлантике будет отрезан, и мы окажемся застрявшими в Африке."
 BEX_aden_emergency: "Аденская чрезвычайная ситуация"
 BEX_aden_emergency_desc: "Аден - это врата на восток, и мы должны их контролировать."
 BEX_order_egysud: "Восстановление Ордена в Египте-Судане"
 BEX_order_egysud_desc: "Основная часть нашей контролируемой территории и населения находится в Египте и Судане, и необходимо положить конец беспорядкам на этих территориях или же мы можем потерять ядро движения в изгнании."
 BEX_order_ugaken: "Восстановление Ордена в Кении-Уганда"
 BEX_order_ugaken_desc: "Мы должны восстановить порядок в городах и поселках этих регионов."
 BEX_order_restored_questionmark: "Распоряжение о восстановлении?"
 BEX_order_restored_questionmark_desc: "В то время как некоторые радикалы остаются, теперь мы можем перейти от восстановления порядка к работе над управлением."
 BEX_british_situation: "Ситуация в Великобритании"
 BEX_british_situation_desc: "Необходимо решить проблемы с британским населением: от сомнительной лояльности войск, до численности населения в силу проблемы социалистического проникновения в волны мигрантов, мы должны обеспечить, чтобы британцы были в норме."
 BEX_demographic_destiny: "Демографическая жизнь - Судьба."
 BEX_demographic_destiny_desc: ""With mass migration from the home isles, the British population is predicted to reach 2.4 million by the first year of exile. This number, while large, is still drawfed by the number of natives. We must ensure that as many British people as possible will arrive on our shores so we can win the demographic battle here, before returning home."
 BEX_reassure_troops: "Укрепить войска"
 BEX_reassure_troops_desc: "Бегство с родины только для того, чтобы сражаться с антибританским повстанцем, не привносит величайшего морального духа в войска. Хотя моральный дух все еще высок, он должен оставаться высоким. Мы должны дать обещания, которые мы намерены выполнить в отношении правительства и вернуться домой к нашим людям, потому что они являются основой хунты."
 BEX_screen_exiles: "Скриншот новых прибытий"
 BEX_screen_exiles_desc: "Снова прибывшие лица должны быть удалены от второстепенных элементов, иначе наши территории могут оказаться в таком же тяжелом положении, что и дома."
 BEX_settling_exiles: "Успокойся."
 BEX_settling_exiles_desc: "Бездомные, бескорыстные, голодные британские мужчины и женщины никому не приносят пользы, и они, безусловно, не помогут нам забрать островок."
 BEX_junta_cemented_bigquestionmark: "Джунта в безопасности?"
 BEX_junta_cemented_bigquestionmark_desc: "В настоящее время хунта, несомненно, остается без возражений и готова смотреть в будущее с народом и королем, стоящим за ним."

 ### Junta Monarchist

 BEX_industrial_conscription: "Промышленная воинская обязанность"
 BEX_industrial_conscription_desc: "Недостаточно отправить людей в вооруженные силы, они также должны быть отведены на линию производства, с тем чтобы у нас были средства для возвращения домов."
 BEX_promises_of_democracy: "ОБЯЗАТЕЛЬСТВА ДЕМОКРАТИИ"
 BEX_promises_of_democracy_desc: "Хотя в настоящее время мы не намерены восстанавливать выбор правительства путем голосования, мы, безусловно, обещаем это."
 BEX_secret_police: "Секретная полиция"
 BEX_secret_police_desc: "Монтгомери узнал в угрозе своей власти, что угрозы не только слева, но и повсюду, чтобы найти и искоренить эти подрывные угрозы нашему правлению."
 BEX_service_for_natives: "Услуги для коренных жителей"
 BEX_service_for_natives_desc: "Многие туземцы преданы нашей Империи и хотели бы служить ей."
 BEX_finishing_off_the_ual: "Заканчиваю музыку"
 BEX_finishing_off_the_ual_desc: "Угроза реакционного права чуть ли не стоила нам дорогой цены, когда власть в мгновение ока ускользала от наших пальцев. Тюрьмы и казни в массовом порядке должны быть совершены против бывших членов и сторонников ВС."
 BEX_increase_the_power_of_montgomery: "Увеличить силу Монтгомери"
 BEX_increase_the_power_of_montgomery_desc: "Монтгомери должен быть предоставлен рядом с диктаторскими державами, чтобы он мог успешно вытащить нас из кризиса."
 BEX_reassuring_the_king: "Восстановление короля"
 BEX_reassuring_the_king_desc: "Король был на нашей стороне с момента создания хунты, и он не переставал быть таким. Мы должны попытаться посадить короля на нашу сторону, некоторые уступки и обещания должны сделать трюк."
 BEX_execute_the_last_traitors: "Исполните последних предателей"
 BEX_execute_the_last_traitors_desc: "Ботинок падет на тех, кто опротестует наше правило. Они будут расстреляны, или повешены, как обычные преступники, чтобы все видели. Как только это будет сделано, мы сможем, наконец, сделать то, к чему мы готовились: вернуть наш дом."
 BEX_military_industrial_complex: "Военный промышленный комплекс"
 BEX_military_industrial_complex_desc: "Сделать наши вооруженные силы и промышленное ядро неразличимыми позволит обоим работать в тандеме, увеличив нашу силу, с которой мы раздавим наших социалистических врагов."
 BEX_junta_holds_on: "Джунта держится."
 BEX_junta_holds_on_desc: "Несмотря ни на что, хунта выжила, и теперь ее сила должна быть должным образом укреплена, угрожать ей, чтобы она больше не стала правителем."
 BEX_reenforce_chain_of_command: "Цепочка подчинения"
 BEX_reenforce_chain_of_command_desc: "Необходимо перестроить командную структуру, чтобы она была гораздо более жесткой, с тем чтобы мы могли лучше направлять наши армии к победе."

 ### Junta Republic

 BEX_industrial_conscription2: "Промышленная воинская обязанность"
 BEX_industrial_conscription2_desc: "Недостаточно отправить людей в вооруженные силы, они также должны быть отведены на линию производства, с тем чтобы у нас были средства для возвращения домов."
 BEX_promises_of_democracy2: "ОБЯЗАТЕЛЬСТВА ДЕМОКРАТИИ"
 BEX_promises_of_democracy2_desc: "Хотя в настоящее время мы не намерены восстанавливать выбор правительства путем голосования, мы, безусловно, обещаем это."
 BEX_secret_police2: "Секретная полиция"
 BEX_secret_police2_desc: "Монтгомери узнал в угрозе своей власти, что угрозы не только слева, но и повсюду, чтобы найти и искоренить эти подрывные угрозы нашему правлению."
 BEX_service_for_natives2: "Услуги для коренных жителей"
 BEX_service_for_natives2_desc: "Многие туземцы преданы нашей Империи и хотели бы служить ей."
 BEX_dealing_with_the_monarchists: "Работа с монархистами"
 BEX_dealing_with_the_monarchists_desc: "Объявление Республики населению, считающему понятие республики в лучшем случае возмутительным и в худшем случае вероломным, не принесло дивидендов для обеспечения нашей роли, однако в то время это было необходимо и должно быть укреплено."
 BEX_declare_montgomery_lord_protector: "Объявить лорда Монтгомери Защитником"
 BEX_declare_montgomery_lord_protector_desc: "Старый титул, который Кромвель взял ранее, будет возрожден, чтобы служить знаком легитимности и преемственности с последнего времени правления республики Британских островов."
 BEX_courting_the_right: "Встретить правую сторону"
 BEX_courting_the_right_desc: "В то время как такие, как УНИ, были и остаются врагом, они должны быть удовлетворены, чтобы не угрожать нашему правлению."
 BEX_execute_the_last_traitors2: "Исполните последних предателей"
 BEX_execute_the_last_traitors2_desc: "Ботинок падет на тех, кто опротестует наше правило. Они будут расстреляны, или повешены, как обычные преступники, чтобы все видели. Как только это будет сделано, мы сможем, наконец, сделать то, к чему мы готовились: вернуть наш дом."
 BEX_military_industrial_complex2: "Военный промышленный комплекс"
 BEX_military_industrial_complex2_desc: "Сделать наши вооруженные силы и промышленное ядро неразличимыми позволит обоим работать в тандеме, увеличив нашу силу, с которой мы раздавим наших социалистических врагов."
 BEX_declaration_of_the_republic: "Заявление Республики"
 BEX_declaration_of_the_republic_desc: "Король мёртв, а значит и молодая Елизавета последует за ним; это не так; она будет лишена наследства, и будет царствовать новая республика, свободная от ограничений монархической власти."
 BEX_reenforce_chain_of_command2: "Цепочка подчинения"
 BEX_reenforce_chain_of_command2_desc: "Необходимо перестроить командную структуру, чтобы она была гораздо более жесткой, с тем чтобы мы могли лучше направлять наши армии к победе."

 ### Albion 

 BEX_industrialism_out_of_necessity: "Промышленность от нужды"
 BEX_industrialism_out_of_necessity_desc: "Хотя многие в наших рядах считают, что мы должны стремиться к аграрности и локализации Мерри-Англии, в настоящее время это не принесет нам пользы, пока Британские острова находятся в сотнях миль от нас. Индустриализация в колониях, в которых мы находимся, приведет нас к положению дел, в котором мы можем заниматься подобными вещами."
 BEX_the_end_of_parliamentarism: "Конец парламентаризма"
 BEX_the_end_of_parliamentarism_desc: "Ужасное пятно британской политической жизни, которая является парламентом, должно быть закрыто. Вместо этого ВАЛ будет править не из парламента, а как взять слово у Ленина, элитного «бандага», который действует как совет, окружающий короля, обеспечивая взаимную преданность и взаимопонимание между нами и монархом при прямом управлении государством, чтобы мы могли больше служить Богу и стране."
 BEX_towards_reviving_the_old_order: "К возрождению старого порядка"
 BEX_towards_reviving_the_old_order_desc: "Либерализм - это моральный сипхиллис, а современность - это продукт его развития. Современность должна быть свернута на землю, и порядок, начиная с того времени, когда мы стали большей цивилизацией, должен быть восстановлен. Британская революция показала нам результаты резкого падения в цивилизацию, и мы не должны допустить его повторения."
 BEX_enforced_social_hierachy: "Насильственная социальная иерахия"
 BEX_enforced_social_hierachy_desc: "Яд эгалитаризма выпускался в Великобритании годами, и новый продукт, который сейчас правит островом, является лишь логическим завершением. Мы должны обеспечить, чтобы иерахия была введена в действие, прежде чем в конечном итоге процветает органическая иерахия, и люди могут быть комфортны на своем месте. В конце концов, это не хозяин, нуждающийся в минионе, а минион, который нужен хозяину."
 BEX_military_purges: "Военные похороны"
 BEX_military_purges_desc: "Класс воина был для нас серьезным разочарованием, завернутым в свою же страсть к власти, они трианнически управляли британскими народами кулаком железа. Железо встретило сталь с УВ, и теперь мы должны сломать то, что осталось от их влияния в армии."
 BEX_give_ludovici_emergency_powers: "Дайте Лудовицам чрезвычайные силы"
 BEX_give_ludovici_emergency_powers_desc: "Чрезвычайные декреты будут приняты, чтобы объявить то, что Шмитт назвал "исключительным положением"."
 BEX_loyalty_to_the_king: "Верность королю"
 BEX_loyalty_to_the_king_desc: "Несмотря на то, что король был тихим в ответ на наше поглощение и явно симпатизирует демократическому правлению, мы, конечно, можем привести его к нашему образу мышления и дать ему долю власти, чтобы править этим государством."
 BEX_reactionary_dominance: "Реакция Доминант"
 BEX_reactionary_dominance_desc: "Силы реагирования захватили власть, и теперь мы должны обеспечить, чтобы они доминировали в британской политической жизни в заблуждении, с тем чтобы мы могли построить цивилизацию до конца веков."
 BEX_british_militarism: "Британский милитаризм"
 BEX_british_militarism_desc: "С дней Будики, до Викингов, до англо-саксоновских королевств, до Агинкурта, Бленхайма, Трафальгара, Ватерлоо и Сомме британцы всегда были народом воинов. Мы - нация героев, с которой никакая другая нация не может сравниться. Этот дух воина должен быть таким же великим, как и прежде."
 BEX_the_ual_takes_power: "УНИЧТОЖАЕТ ВЛИЯНИЕ"
 BEX_the_ual_takes_power_desc: "Объединенная Альбионская лига захватила власть, и теперь она примет свою радикальную реакцию на британское государство."
 BEX_against_socialism_and_liberalism: "Против социализма и либерализма"
 BEX_against_socialism_and_liberalism_desc: "Одна вещь, которую мы знаем, глядя в Европу и видя конфронтацию между Францией, Советами и Германией, состоит в том, что независимо от того, насколько серьёзна угроза, либералы всегда будут союзничать с социалистами против правой крыловой силы."

 ### King W

 BEX_all_on_the_production_line: "Все на линии производства!"
 BEX_all_on_the_production_line_desc: "Для того чтобы иметь возможность вернуться домой, как можно больше людей должны работать на производственных линиях."
 BEX_restoring_individual_liberty: "Восстановление личной свободы"
 BEX_restoring_individual_liberty_desc: "Свобода является одной из самых важных ценностей для англичан, которая была захвачена хунтой в интересах безопасности, хотя последняя важна, мы должны напомнить себе, за что мы боремся и возвращаем свободу нашим подданным."
 BEX_enact_further_emergency_powers: "Применить дополнительные чрезвычайные полномочия"
 BEX_enact_further_emergency_powers_desc: "Демократия не должна означать слабость."
 BEX_appeasing_the_natives: "Убогие коренные народы"
 BEX_appeasing_the_natives_desc: "Британская империя - это сила просветления, а не грубой тирании, и мы должны убедиться, что местные жители тоже видят это так, что улучшение их условий, свобод и статуса самоуправления значительно облегчит наше правление над ними."
 BEX_conservative_party_victory: "Победа консервативной партии"
 BEX_conservative_party_victory_desc: "Следом преемственности в нашем правительстве, Консервативная партия правит так же, как и до гражданской войны."
 BEX_securing_military_loyalty: "Обеспечение военной лояльности"
 BEX_securing_military_loyalty_desc: "Нас предали военные, которые действовали против воли короля и народа, и поэтому мы должны вывести из рядов хунты тех, кто был верен хунте, чтобы она оставалась верной в будущем."
 BEX_entrench_parliament: "Парламент"
 BEX_entrench_parliament_desc: "Существование и полномочия парламента должны быть как можно более глубокими, с тем чтобы у нас не было тирана, вновь пытающегося обойти его."
 BEX_greater_powers_to_the_king: "Большие державы королю"
 BEX_greater_powers_to_the_king_desc: "Действия короля показывают, что он заслуживает своей роли в британской конституции, Его избавление британского народа от тирании показывает, что он заслуживает еще большей роли, и мы должны сделать это."
 BEX_to_free_britain: "Свободная Великобритания"
 BEX_to_free_britain_desc: "Мы должны помнить, за что мы боремся, чтобы освободить Британские острова от злой тирании социализма."
 BEX_militaristic_industrialism: "Милитаристская индустриализация"
 BEX_militaristic_industrialism_desc: "Великая война продемонстрировала нашу способность мобилизовать всю страну на полную войну, и мы должны сделать это еще раз, создав нашу индустрию исключительно для того, чтобы помочь военным."
 BEX_god_save_the_king: "Боже, спаси короля!"
 BEX_god_save_the_king_desc: "Король, как и любой истинный англичанин, любит свободу и сверг тиранию хунты."
 BEX_suspend_antiwar_mps: "Отстранять от участия в антивоенных выборах"
 BEX_suspend_antiwar_mps_desc: "Многие присутствующие члены парламента заявили о своем предпочтении ждать, когда социализм рухнет дома, вместо того чтобы активно пытаться покорить и уничтожить его. Этот менталитет никуда нас не приведет, действия должны быть предприняты. Мы должны приостановить действия этих членов парламента, с тем чтобы они не могли больше подрывать дискуссию."
 BEX_liberal_party_victory: "Победа Либеральной партии"
 BEX_liberal_party_victory_desc: "Годы спустя после падения из грации Либеральная партия вновь поднялась к власти."
 BEX_kings_party_victory: "Победа Королевской партии"
 BEX_kings_party_victory_desc: "Лоялисты короля, которые хотят представлять свои интересы и повышать свою власть, выиграли выборы, продемонстрировав главенствующую роль монарха в нашем правительстве."


 ### Shared Focuses

 BEX_install_a_friendly_government_in_spain: "Устанавливать в Испании дружественные правительства"
 BEX_install_a_friendly_government_in_spain_desc: "Мы пройдем в Испанию, раздавим наших врагов и позаботимся о том, чтобы в Иберии царила дружелюбная Испания."
 BEX_the_road_to_reclaimation: "Путь к восстановлению"
 BEX_the_road_to_reclaimation_desc: "Многое необходимо сделать, чтобы поставить нас в такое положение, в котором мы могли бы вернуть Британские острова, в настоящее время единственным нашим окном в Атлантику, которое нам придется пересечь, чтобы вернуться домой, является Гибралтар, и мы должны продвигать свою позицию на глобальном уровне, с тем чтобы мы могли продвинуться в британскую землю."
 BEX_spain_in_flames: "Испания во фламе"
 BEX_spain_in_flames_desc: "Гражданская война в Испании привела к насильственному разрыву некогда могущественной нации в скраббл для власти между четырьмя слабыми группами, что, однако, дает нам возможность, и мы можем обеспечить, чтобы Испания присоединилась к нам, вмешавшись в этот регион, теперь, когда эта страна является международным сражением."
 BEX_fortify_gibraltar: "Формирование Гибралтара"
 BEX_fortify_gibraltar_desc: "Мы должны сначала укрепить Гибралтар, с тем чтобы сохранить нашу позицию на Иберийском полуострове."
 BEX_expand_the_volunteer_corps: "Расширить корпус добровольцев"
 BEX_expand_the_volunteer_corps_desc: "Мы должны расширить наши добровольческие силы, с тем чтобы мы могли больше помогать дружелюбной Испании."
 BEX_court_portugal: "Суд Португалии"
 BEX_court_portugal_desc: "На протяжении веков мы были союзниками с португальцами, и с изгнанием это не изменилось. Мы, как законное правительство Великобритании, должны просить активировать этот союз, чтобы вместе мы могли вывести незаконное правительство из нашего благословенного заговора."
 BEX_prepare_for_fighting_in_andalusia: "Приготовиться к бою в Андалусии"
 BEX_prepare_for_fighting_in_andalusia_desc: "Мы должны создать горный корпус, который сможет успешно пересечь этот враждебный регион."
 BEX_expand_gibraltar_port: "Расширить порт Гибралтара"
 BEX_expand_gibraltar_port_desc: "Расширение порта в Гибралтаре позволит обеспечить эффективное снабжение наших войск во время боевых действий в Испании."
 BEX_prepare_the_marines: "Приготовить морской пехотинец"
 BEX_prepare_the_marines_desc: "Гибралтар не является достаточно большим для того, чтобы большая армия могла двигаться вперед, поэтому мы должны подготовиться к военно-морскому вторжению вдоль восточного побережья Испании."
 BEX_alliance_with_spain: "Альянс с Испанией"
 BEX_alliance_with_spain_desc: "Новое правительство Испании, которое взяло власть, очень дружелюбно для нас и наших интересов."
 BEX_arms_of_friendly_spain: "Оружие для дружелюбной Испании"
 BEX_arms_of_friendly_spain_desc: "В то время как наша оружейная индустрия может быть больше, у нас, безусловно, есть оружие, которое может помочь повернуть волну в Испании, мы должны послать его испанским силам, которые мы поддерживаем."
 BEX_increase_involvement: "Увеличить участие"
 BEX_increase_involvement_desc: "Все больше и больше британских войск обеспечат победу дружелюбной Испании."
 BEX_unrestrained_volunteers: "Неподготовленные добровольцы"
 BEX_unrestrained_volunteers_desc: "Необходимо полностью снять ограничения в отношении числа добровольцев и их поведения во время войны, если Испания падет на врага, у нас будет экзистенциальная угроза в том, что наша возможность вернуться в родные острова будет крайне ограничена, мы не должны допустить, чтобы Испания упала перед нашими врагами."
 BEX_offer_spain_alliance: "Предложить Испанскому альянсу"
 BEX_offer_spain_alliance_desc: "Теперь, когда сформировано дружелюбное правительство Испании, мы должны попытаться создать союз с ними, чтобы укрепить наши связи."
 BEX_align_spain: "Объединение Испании"
 BEX_align_spain_desc: "Мы видели, как испанцы, дружелюбные нам, ужасно побеждали в бою, а теперь испанское правительство не соответствует нашим правилам."
 BEX_expanding_our_influence: "Расширение нашего влияния"
 BEX_expanding_our_influence_desc: "Мы должны расширить как дипломатическое, так и территориальное пространство, с тем чтобы как обеспечить нашу позицию, так и продвинуться вперед к тому времени, когда мы готовы вновь забрать родной остров."
 BEX_reclaim_the_home_isles: "Возвращение на "Остров Дома"!"
 BEX_reclaim_the_home_isles_desc: "Мы должны объявить о возобновлении боевых действий между нами и британскими социалистами и вернуть то, что принадлежит нам!"
 BEX_demand_restoration_of_protectorate_on_palestine: "Восстановление Защитника Палестины"
 BEX_demand_restoration_of_protectorate_on_palestine_desc: "Разрушение Британии привело к тому, что Еврейский Защитник объявил независимое еврейское государство, и теперь мы в состоянии наказать их за предательство, и мы позаботимся о том, чтобы этот регион вновь попал под британское правление."
 BEX_restore_the_aden_protectorate: "Возвращение Аденского Защитника"
 BEX_restore_the_aden_protectorate_desc: "Маленькая Аденская колония является нашим окном как на Южно-Аравийский полуостров, так и на Индийский океан."
 BEX_reaching_out_to_the_empire: "Работать с Империей"
 BEX_reaching_out_to_the_empire_desc: "Падение Британской империи не заметило падения всех британских королевств по всему миру."
 BEX_loyal_canada: "Достоверная Канада"
 BEX_loyal_canada_desc: "Канада всегда была преданным субъектом, с которым мы стояли рука об руку, и мы должны связаться с ними, с тем чтобы мы могли противостоять угрозам как нам, так и им, и со временем восстановить нашу взаимную родину."
 BEX_support_in_the_great_northern_war: "Поддержка во время Великой Северной войны"
 BEX_support_in_the_great_northern_war_desc: "Американская агрессия вновь стала свидетелем ужасов Великой войны в Северной Америке, и канадцы, мексиканцы и американцы борются с ней на дуэль до смерти, и мы должны убедиться, что наши канадские братья не попадут под американский ботинок."
 BEX_request_canadian_alliance: "Просьба к Канадскому альянсу"
 BEX_request_canadian_alliance_desc: "Мы должны объединиться с Канадой, чтобы обеспечить безопасность Атлантики в наших руках."
 BEX_ally_a_victorious_canada: "Элли победившая Канада"
 BEX_ally_a_victorious_canada_desc: "Благодаря нашей помощи канадцы одержали победу над американцами и получили от них большие территориальные уступки."
 BEX_demand_greenland_and_iceland_for_canada: "Датская Северная Атлантика"
 BEX_demand_greenland_and_iceland_for_canada_desc: "Теперь, когда Канада присоединяется к нам, мы находимся в идеальном положении, чтобы обезопасить стратегически важную Датскую Северную Атлантику. Эти территории станут идеальным местом для нашего вторжения на Британские острова. Мы будем требовать территории из Дании, и если они не согласятся, то это будет война."
 BEX_consolidate_our_gains: "Укреплять наши достижения"
 BEX_consolidate_our_gains_desc: "Мы должны заверить их в том, что они должным образом интегрированы, с тем чтобы более ценные британские люди не погибли от борьбы с повстанцами."
 BEX_reaching_across_the_indian_ocean: "Прохождение через Индийский океан"
 BEX_reaching_across_the_indian_ocean_desc: "Для того чтобы расширить сферу охвата и увеличить численность наших кадров, мы должны укрепить наши связи с австралийцами и новозеландцами, а также с южноафриканцами, если это возможно, мы должны пригласить их в Имперский альянс защиты, чтобы они могли помочь нам вернуться домой."

 ###army
 BEX_an_army_of_exiles: "Армия изгнания"
 BEX_an_army_of_exiles_desc: "Наша армия больше не служит цели защиты мировой империи, вместо этого пытается защитить то, что осталось от мертвой империи, и пытается вторгнуться на Британские острова."
 BEX_overwhelming_power: "Огромная сила"
 BEX_overwhelming_power_desc: "Один из уроков, извлеченных из Великой войны, заключался в том, что с помощью самой артиллерии мы смогли разрушить моральный дух и уничтожить даже самых сильных врагов, должным образом интегрироваться в наши пехотные полки, упорядочить методы производства и более мощные снаряды, что позволит нам требовать победы над нашими врагами."
 BEX_lightning_battle: "Битва молнии"
 BEX_lightning_battle_desc: "Со времен Великой войны разработка танков продвигалась вперед в скачках и пределах. В течение своего времени в Ист-Индии Дж.Ф. Фуллер использовал большую часть своего свободного времени написание о преимуществах бронированных и механизированных боевых действий, ранее уволенных как бунты человека, восставшего против военного учреждения исключительно из-за неудовлетворенности его постом, наше ужасное положение позволило нашим военным ученым пересмотреть достоинства его работы. Мы должны провести реформы в нашей армии, с тем чтобы иметь армию, основанную на маневрировании."
 BEX_the_royal_marines: "Королевские морпехи"
 BEX_the_royal_marines_desc: "Королевские морские пехотинцы приобрели новое значение, поскольку они будут иметь исключительно важное значение для восстановления островов, и поэтому для этих сил были направлены значительные финансовые средства и планы реформ, надеясь, что они будут направлять наши армии домой."
 BEX_expand_the_marines: "Расширить морской пехотинец"
 BEX_expand_the_marines_desc: "Несмотря на то, что хорошо обученные силы в полном порядке и хорошо, они не обязательно встанут сами по себе против социалистических орд, которые были мобилизованы на местных островах."
 BEX_advanced_assault_training: "Усовершенствованная подготовка к нападениям"
 BEX_advanced_assault_training_desc: "При подготовке морских пехотинцев необходимо применять новые методы нападения и вовлечения противника, которые должны быть готовы полностью уничтожить врагов, с которыми они сталкиваются."
 BEX_per_mare_per_terram: "Пер Мар, Пер Террам"
 BEX_per_mare_per_terram_desc: "Наши усовершенствованные методы подготовки и вербовки оставили Королевскую пехоту в качестве одного из самых передовых подразделений спецназа в мире."
 BEX_modern_artillery_pieces: "Современные артиллерийские кусочки"
 BEX_modern_artillery_pieces_desc: "Мы не можем утверждать, что наши враги обладают высшей огневой мощью, если оборудование, которым пользуются наши войска, является старым и изношенным."
 BEX_deploy_modernised_british_divisions: "Развертывание модернизированных британских дивизий"
 BEX_deploy_modernised_british_divisions_desc: "В настоящее время наши реформы готовы к осуществлению, будут развернуты новые подразделения с большим количеством огневой мощи, и со временем они станут основной частью наших сил."
 BEX_streamline_artillery_production: "Рационализация производства артиллерийских изделий"
 BEX_streamline_artillery_production_desc: "Снижение производственного потенциала, которое у нас имеется в изгнании, может быть изменено за счет рационализации и повышения эффективности производства."
 BEX_tank_development: "Разработка цистерн"
 BEX_tank_development_desc: "Великая война научила нас не только важности артиллерии, но и тому, что было названо Земельным кораблем, а теперь танк был эффективен в разрушении немецких линий и направлении их войск."
 BEX_quality_gunsmiths: "Качество"
 BEX_quality_gunsmiths_desc: "Мы должны обеспечить, чтобы наши винтовки были как можно более современными и высококачественными."
 BEX_new_guns_for_the_infantry: "Новые орудия пехоты"
 BEX_new_guns_for_the_infantry_desc: "Мы позаботимся о том, чтобы дизайнеры, которых мы эвакуировали из дома, были в хорошем состоянии."
 BEX_a_renewed_british_army: "Возобновленная британская армия"
 BEX_a_renewed_british_army_desc: "В настоящее время наши силы ознаменованы высоким моральным духом, качественным снаряжением и подавляющей силой, а не предыдущей ситуацией, связанной с осквернением, неверием и слабостью."
 BEX_quality_over_quantity: "Превышение качества"
 BEX_quality_over_quantity_desc: "Мы должны обеспечить, чтобы даже если количество наших танков будет превышено, наши танки все равно были совпадающими с теми врагами, с которыми они сталкиваются."
 BEX_cruiser_tanks: "Цистерны-крузеры"
 BEX_cruiser_tanks_desc: "Танк для крейсеров является уникальной британской концепцией, основанной на использовании цистерн, как кавалерии, для того, чтобы перебороть и раздавить наших врагов."
 BEX_modern_royal_tank_corps: "Современный Королевский бронированный корпус"
 BEX_modern_royal_tank_corps_desc: "Наши достижения в области технологии и оборудования позволят нам развернуть передовые современные подразделения танков в наших силах, которые смогут раздавить вражду их подавляющей силой."
 BEX_rifles_for_the_men: "Винтовки для мужчин"
 BEX_rifles_for_the_men_desc: "Хотя автомобилизация важна, мы не можем забывать о скромном пехотнике."
 BEX_intermediate_tank_research: "Промежуточные исследования цистерн"
 BEX_intermediate_tank_research_desc: "В то время как небольшие легкие танки являются полезными для маневрирования, иногда требуется как мощность, так и скорость, и для этого мы будем разрабатывать промежуточные цистерны, которые обеспечивают идеальное равновесие между скоростью и мощностью."
 BEX_intense_training: "Интенсивная профессиональная подготовка"
 BEX_intense_training_desc: "Проблемы, связанные с нашими людскими ресурсами, не позволяют обеспечить массовую мобилизацию низкокачественных войск, и мы должны обеспечить, чтобы наши войска были самыми высокими стандартами, с тем чтобы мы могли обеспечить триумф даже в тех случаях, когда их число превышает число."
 BEX_modern_motor_vehicles: "Современные автотранспортные средства"
 BEX_modern_motor_vehicles_desc: "Только танки слабы и должны сопровождаться какой-то пехотой, с тем чтобы не замедлять движение танков пешеходами и лошадьми, мы будем разрабатывать новые транспортные средства для перевозки наших войск."
 BEX_the_petroleum_army: "Война молнии"
 BEX_the_petroleum_army_desc: "Наши новые события привели нас к такой форме войны, которая называется «Лайнинг Война», которая позволит нашим войскам быстро продвинуться вперед и раздавить наших врагов еще до того, как у них будет время на организацию, чтобы обеспечить, чтобы войны были короткими и победителями в нашу пользу."

 ###navy 
 BEX_grandfleet: "Большой флот"
 BEX_grandfleet_desc: "Гордость и радость британских военных ах всегда были ее Великим Флотом, она была завистью всего мира и в конце концов победила всех крупных болванов, которые пытались оспорить ее превосходство. Королевский флот будет продолжать выполнять эту задачу, и мы будем следить за тем, чтобы во всем мире было найдено королевское судно ВМС."
 BEX_learn_jutland: "Учись в Ютландии"
 BEX_learn_jutland_desc: "В конечном счете, победа в стратегическом смысле, битва при Ютландии была очень близка к тактическому поражению."
 BEX_mod_bb: "Современные разработки боевых кораблей"
 BEX_mod_bb_desc: "Боевые корабли - это вершина военно-морских войн, с пушками, способными уничтожить наших врагов издалека. Однако, как мы узнали во время Великой войны, наши враги создают корабли, которые могут конкурировать с нашими. Мы не должны опускать наше преимущество. Королевский флот должен использовать новейшие технологии, чтобы создать новое поколение кораблей, соответствующих предписанию Ее Величества."
 BEX_battlefleet: "Доктрина боевого флота"
 BEX_battlefleet_desc: "Благодаря нашему сосредоточению на боевом корабле мы имеем последовательный поток новых судовых проектировок и стратегий, в которых они могут быть использованы."
 BEX_dd_screens: "Уничтожить Скриенс"
 BEX_dd_screens_desc: "На поверхности океанов наши боевые корабли необычны, как по количеству, так и по технологии мы двигаемся впереди наших соперников. Однако существует невидимая опасность для нашего наземного флота. Под волнами немецкие U-плавучие лодки доказали, что они могут поглотить даже самые крупные корабли нашего флота. Чтобы уменьшить будущие потери от подводных лодок, мы должны обеспечить, чтобы наши разрушители были в курсе новых технологий АСО."
 BEX_convoy_escort: "Опыт сопровождения"
 BEX_convoy_escort_desc: "Британия - это остров, который в значительной степени зависит от товаров, ввозимых из остальной части Империи. Эти конвои нуждаются в защите во время войны, но мы не можем рисковать ценными кораблями в этой относительно небольшой миссии. Нам нужно создать более новый крейсер, достаточно легкий, чтобы идти в ногу с кораблями конвоя, но с достаточной огневой мощью, чтобы сдерживать вражеские корабли и лодки."
 BEX_mobile_squad: "Мобильные отряды"
 BEX_mobile_squad_desc: "С такой большой и расширительной империей, как наше, с самым крупным и самым тяжелым боевым кораблем, мы можем победить наших врагов, но только если мы поймаем их первыми."
 BEX_fast_bb: "Быстрые боевые корабли"
 BEX_fast_bb_desc: "Поскольку Адмиралтейство делает новый акцент на скорости, а не на сверхвооружении, необходимо будет разработать новый класс боевых кораблей."
 BEX_bc_refit: "Рейтинг боевого круизера"
 BEX_bc_refit_desc: "Наш нынешний список боевых круизеров относительно устарел, и некоторые из них все еще сосредоточены на теориях Великой войны."
 BEX_escort_killers: "Сопровождающие убийцы"
 BEX_escort_killers_desc: "Если мы намерены умирать от голода нашими врагами, как это было эффективно во время последней войны, нам нужно будет уничтожить наши планы боевого круизера и освободить их в открытом море, с тем чтобы уничтожить торговлю противника, где бы она ни была найдена."
 BEX_inter_tactics: "Технология перехвата"
 BEX_inter_tactics_desc: "Провозглашение новых теорий о перехвате любой торговли через моря позволит нашим боевым кораблям и эскадрильям боевых круизников эффективно охотиться и уничтожать вражеские конвои, успешно задушив врага."
 BEX_nav_course: "Курсы военно-морского строительства"
 BEX_nav_course_desc: "Хотя наши инженеры и ремесленники являются одними из лучших в мире, они могли бы быть лучше."
 BEX_mod_nav_cons: "Современное военно-морское строительство"
 BEX_mod_nav_cons_desc: "Наши стимулы привели к тому, что многие люди со всей империи пришли и помогли построить военно-морские корабли, и благодаря этому притоку новых талантов мы сможем направить наши усилия на разработку новых методов для ускорения строительства наших более крупных военно-морских кораблей."
 BEX_cls: "Уничтожение судов"
 BEX_cls_desc: "В то время как наши эскадрильи разрушителей хорошо работают против вражеских подводных лодок, Адмиралтейство изучило возможность создания новых кораблей Крузеров для защиты наших операций по АСО от более крупных угроз, которые обычно легко отправят наших разрушителей."
 BEX_subs: "Подводные рейдеры"
 BEX_subs_desc: "Благодаря их эффективности, доказанной в ходе Великой войны, Адмиралтейство в течение предыдущего десятилетия добилось большого прогресса в создании новых и более смертоносных подводных лодок."
 BEX_rbritannia: "Правило, Британия!"
 BEX_rbritannia_desc: "Когда Британия впервые, по небесной команде, от азурного главного; это был устав земли, и ангелы-хранители пели этот штамм: Правило, Британия! Британия правит волнами, никогда не будет рабами!"

 BEX_invade_tanganiyaka: "Восстановить порядок в Танганьике"
 BEX_invade_tanganiyaka_desc: "Для обеспечения связи между землей и потенциальными португальскими и южноафриканскими союзниками мы должны восстановить наше правление в Танганьике."

 ### Ideas ###
 BEX_exiles_arrive: "Прибытие изгнания"
 BEX_exiles_arrive_wave2: "Дополнительные выходы"
 UOB_exiles_leave: "Реакционный исход"
 BEX_minority_rule: "Правило британского меньшинства"
 BEX_minority_rule_desc: "Несмотря на то, что к первому году изгнания из страны ежедневно прибывает около 2,4 млн. британцев, британцы по-прежнему составляют незначительное меньшинство, в отличие от более чем 28 млн. египтян, суданцев, кенийцев, угандийцев, мальтийцев, йеменцев и киприотов, причем единственным большинством нашей англоязычной территории является Гибралтар."
 BEX_natives_rattled: "Коренные револьты"
 BEX_natives_rattled_desc: "Со многими народами, которые были свидетелями падения Британской империи, они тоже ожидали получить независимость, а затем были возмущены, когда это не произошло."
 BEX_natives_rattled_a: "Болезни коренного населения"
 BEX_natives_rattled_a_desc: "Со многими народами, которые были свидетелями падения Британской империи, они тоже ожидали получить независимость, а затем были возмущены, когда это не произошло."
 BEX_natives_rattled_b: "Неприятности коренного населения"
 BEX_natives_rattled_b_desc: "Со многими народами, которые были свидетелями падения Британской империи, они тоже ожидали получить независимость, а затем были возмущены, когда это не произошло."
 BEX_natives_rattled_c: "Неудовлетворенность коренного населения"
 BEX_natives_rattled_c_desc: "Со многими народами, которые были свидетелями падения Британской империи, они тоже ожидали получить независимость, а затем были возмущены, когда это не произошло."
 BEX_natives_rattled_d: "Спокойствие коренного населения"
 BEX_natives_rattled_d_desc: "Со многими народами, которые были свидетелями падения Британской империи, они тоже ожидали получить независимость, а затем были возмущены, когда это не произошло."
 BEX_natives_rattled_e: "Мир коренных народов"
 BEX_natives_rattled_e_desc: "В то время как некоторые экстремисты продолжают открыто выступать против нашего правления, это вовсе не та проблема, с которой мы столкнулись, когда прибыли."
 BEX_volunteers_spa_a: "Малый контингент добровольцев в Испанию"
 BEX_volunteers_spa_b: "Умеренный контингент добровольцев в Испанию"
 BEX_volunteers_spa_c: "Крупный контингент добровольцев в Испанию"
 BEX_volunteers_spa_attack: "Неподготовленные добровольцы"
 BEX_marine_scw_attack: "Королевские морпехи готовы"
 BEX_canadian_volunteers: "Вмешательство в Великую Североамериканскую войну"
 BEX_rmarines_1: "Королевские морпехи"
 BEX_rmarines_2: "Королевские морпехи"
 BEX_rmarines_3: "Королевские морпехи"
 BEX_rmarines_4: "Королевские морпехи"
 BEX_rmarines_5: "Королевские морпехи"
 BEX_arty_production: "Рационализация артиллерийского производства"
 BEX_arty_goboom: "Высоковзрывоопасные скорлупы"
 BEX_nicerifles: "Качество Винтовки"
 BEX_restored_british_army: "Возобновленная британская армия"
 BEX_qualitytanks: "Цистерны высокого качества"
 BEX_good_training: "Профессиональная подготовка с высокой интенсивностью"
 BEX_lightning_warfare: "Война молнии"
 BEX_more_power_to_kang: "Сила королю"
 BEX_military_disloyalty: "Военная невзгода"
 BEX_liberty_of_britons: "За британскую свободу"
 BEX_state_of_emergency: "Чрезвычайное положение"
 BEX_MPs_suspended: "Отклонение от военных действий"
