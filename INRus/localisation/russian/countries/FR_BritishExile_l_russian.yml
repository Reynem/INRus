 ### event


 bex.0.t: "Прибытие изгнания"
 bex.0.d: "С падением социализма над островами Александрия был повержен поток беженцев, солдат, эвакуированных военного снаряжения и кораблей. Мало кто из гражданского правительства сбежал, а Вестминстер был окружен во время кризиса. Сейдж был, наконец, разрушен развалом сил на материке, большая часть гражданского правительства в настоящее время мертва или находится в тюрьме. С небольшим количеством других реальных полномочий военное правительство взяло под свой контроль в Каире, а король - всего лишь фигура обезглавленной Британской империи. Новое правительство стремится сохранить развалившуюся Британскую империю вместе, в то время как другие державы и движения за независимость окружили ее, остающиеся, как стервятники, с большей частью империи, не имея реальной военной власти, способной защитить ее территорию. Правительство и его быстро растущее британское население остаются в хорошем настроении, однако с особым Орденом Хайга от дней Великой Войны, которое теперь постоянно ссылается на: &quot; Нет иного пути, кроме как бороться с ним. Каждая позиция должна быть сохранена последнему человеку: не должно быть выхода на пенсию, и верить в справедливость нашего дела каждого из нас."
 bex.0.a: "Эттли не видела последних из нас!"

 bex.1.t: "Парижская конференция"
 bex.1.d: "С падением уровня социализма на всех дипломатических устах говорят: «Имперский вопрос», о том, что осталось от Британской империи и о потенциале правительства в Лондоне, чтобы установить свою власть на этих землях. Для решения этой проблемы французское правительство называет «Парижскую конференцию», сводящую вместе с собой крупные и мелкие державы во всем мире с целью деления того, что они могут от Британской империи под предлогом прекращения социализма. План был быстро разработан на протяжении нескольких дней, и теперь силы движутся через границы по всему миру, чтобы воплотить эти планы в реальность. Это происходит практически без сопротивления, когда британские гарнизоны либо вернулись на дома до гражданской войны, либо сейчас под руководством правительства Каира. Многое из того, что осталось, происходит в анархии, а правительство в Каире борется за то, чтобы утвердить власть над тем, что осталось."
 bex.1.a: "Какая катастрофа!"

 bex.2.t: "Территории попадают в состав движений за независимость"
 bex.2.d: "То, что осталось от Британской империи, не контролируемой каирским правительством, теперь пало на местных националистов. Танганьика , Оман и Малайя упали до движения за независимость. Британская империя , расположенная за пределами владычества, была сведена в Египет, Англо-эгптийский Судан, Уганду и Кению. Ситуация на этих территориях стабильна , но нам предстоит пройти долгий путь, прежде чем наше правление будет укреплено, и мы сможем начать долгий путь к восстановлению родины."
 bex.2.a: "Солнце заходит..."

 bex.3.d: "Британские острова пали на социализм, и сейчас мы наблюдаем быстрый крах Британской империи, к северу от нас Канада, долгое владение Британией, и теперь британская власть рухнула, и теперь, независимое государство, нет никого, кто защищал бы Канаду, если бы мы объявили о ее аннексии..."

 bex.4.d: "Многие дома не одобряют перемены в правительстве и мужественно боролись за то, чтобы это не произошло. К сожалению, они не одержали победу, но теперь они попадают на суда массово и вывозят себя из страны, чтобы добраться до нас! Теперь мы видим, в какой трудной ситуации оказались Египет, Судан, Кения и Уганда, где все больше и больше английских мужчин и женщин осаждают эти земли!"

 bex.5.d: "Мы боролись за контроль над границами нашей страны с постреволюцией хаоса, и в результате тысячи реакционеров покидают Каирское правительство, чтобы сбежать."

 bex.6.d: "Ужасные новости появились с островов Домов, когда выяснилось, что наш король Эдуард VIII был обезглавлен перед большой толпой в Лондонской башне, теперь он получил гражданские похороны вместо одного в Королевском Хранилище, и теперь мы без короля. Эдвард был осажден во дворце Букингем с первых дней революции и, наконец, вытащил его после резни в королевской гвардии и штурма Дворца в последние дни революции. Теперь титул короля принадлежит его брату Альберту, который был более удачливым, был в лояльной Шотландии во время революции. Хотя он не хотел захватить трон, он будет считать его под регнальным именем &quot; Георге VI &quot; в коронации, которая должна произойти в течение следующих нескольких недель в Александрии."

 bex.7.d: "Задок Священник сегодня вновь зазвонил, как другой британский монарх в длинной череде наследования захватил Трон Соединенного Королевства Великобритании и Ирландии. Несмотря на то, что коронатура не была проведена в Вестминстерском аббатстве, Джордж VI был коронован с другой короной в том же ритуале, который проводился в основном таким же образом в течение тысячи лет. Коронация произошла в гораздо меньшей сент-Маркенс Англиканской церкви в Александрии, которая была счастливой жертвой британской бомбардировки 1882 года. Маленькая церковь, набравшая свой размер с великой базантийской архитектурой, сильно контрастировавшей с готической архитектурой обычного места коронатуры, хотя это разочаровало многих архиепископов Кентерберия с помощью святой нефти, а Альберт был одет в то время в то время в то время в то время, что регалия могла быть доставлена группе эмигрантов и преданных индейцам, до того, как его архитектором был корол."

 bex.8.d: "Во время встречи с Монтгомери король выразил свое недовольство продолжением военного правительства, которое, по его мнению, является лишь временной мерой."

 bex.9.d: "Город его коронации был достаточно легким, чтобы заставить короля собраться и переехать в Александрию, поскольку он мало что может сделать для этого за такой короткий срок." 

 bex.10.d: "Прошло две недели с тех пор, как королю выговорили за то, что он сунул свой нос в политику, и с тех пор Джордж полностью молчал. Он не присутствовал на запланированных встречах с Монтгомери и не отвечал ни на письма, ни на телефонные сообщения. Адис Монтгомери сообщил ему, что из-за заикания и нежелания завладеть королевством, скорее всего, из-за робости, что он молчал из-за сильной реакции на его конфронтацию. Он, несомненно, выйдет из этого тихого периода времени, готового действовать в качестве верного государственного служащего, а не из-за неприятностей."

 bex.11.d: "После нескольких недель молчания короля и неучастия в собраниях члены хунты думали, что вопрос о вмешательстве короля решился сам собой."

 bex.12.d: "В то время как охранники верно ждали приказов, когда они получили их, они в одностороннем порядке решили игнорировать их, вместо того чтобы сложить оружие и присоединиться к королю! Джордж VI и солдат, который собрал с ним много в здании парламента без возражений, и он, конечно же, плохо настроен к членам хунты..."

 bex.13.d: "Когда король вошел, группа отошла от него, они вышли в административные помещения парламентского дворца, где проживают многие лидеры хунты, в том числе Монтгомери. Солдаты объявили этих лидеров арестованными, к которым лидеры неохотно относились, и вывезли их из здания. Король, тем временем, вошел в радиопередачную комнату, где от них требовали прекратить то, что они уже играют. Король с группой вооруженных людей стоял вокруг него, медленно начал говорить на радио. Хотя его заикание все еще присутствовало, это было меньше, чем обычно, и король смог с уверенностью объявить общественности, что он распустил джунту, и теперь он взял власть с гражданским правительством, которое было создано на его имя, вскоре. Как только его выступление завершилось, он пожал руки людям, которые помогли ему совершить этот переворот, и он вышел с ними, как только появился."

 bex.14.d: "В течение нескольких месяцев, прошедших после эвакуации и создания правительства в изгнании, мы стали свидетелями роста нового движения, которое быстро растет среди эмигрантов, разочарованных неудачами высшего командования армии и образования. Это движение, называющееся «Единственной Альбионской лигой», возникло из интеллектуального тайного общества и превратилось в более широкое движение. Это движение является националистическим, антиэгалитарным, антилиберальным, антидемократическим и крайне реакционным, а также утверждает, что оно стремится к поддержке «Англо-Саксонской свободы»."

 bex.15.d: "Боязнь социализма в настоящее время находится на высоте у правительства Каира, и Объединенная лига Альбиона нажила на этом преимущество благодаря недавнему созданию Корпуса добровольцев по борьбе с социализмом. Несмотря на его нейтральное прозвище, он напрямую связан с партийным аппаратом МУУ. Члены этой группы терроризируют подозреваемых социалистов, отличая себя от британской военной формы, с кеффии, которая является обычной для бедуинов в Сане, которая служит для сокрытия их личности. Хотя мы, возможно, хотим немедленно закрыть эту организацию, нарушая нашу монополию на насилие, они оказались чрезвычайно популярны среди вирулентно антисоциалистского эмиграционного населения. Закрывая их, они лишь увеличат и без того быструю политическую динамику, которая уже была налажена в стране. Сейчас мы должны обеспечить, чтобы их деятельность не вышла из-под контроля."

 bex.16.d: "Подъём Лиги Альбионов привел к большому беспокойству среди членов джунты, так как кажется, что крупные части армии и элиты – основные посредники в сфере власти, чтобы поддерживать наше правление – попадают в сцепление УВ. Монтгомери приказал своим людям найти какую-либо форму или форму, которая могла бы уменьшить их динамику. ~nn The Junta_s молитвы были услышаны сегодня, когда досье разведки приземлилось на стол Монтгомерикса сегодня утром, подробно описывающее ФУАЛ и паравоенные связи между высокопоставленными членами джунты, разведки и Королевского флота. С головами руководства ДЖУНТА не щадили ни минуты, чтобы арестовать все цифры, подробно изложенные в докладе. Теперь это просто вопрос разгадки загадки того, кто поместил доклад на столе монтгомерии..."

 bex.17.d: "Вспышка волнений за пределами парламентского дворца сегодня заставила ведущих членов хунты в смятении и поспешном планировании, поскольку они полагали, что коренные жители вдруг вернулись к состоянию недовольства. Это было до тех пор, пока их вежливо не проинформировал помощник, который потрудился выглянуть из окна, что это были белые лица британских мужчин и женщин. Позднее выяснилось, что они протестовали против недавнего ареста ряда физиологических деятелей, многие из которых стали чрезвычайно популярны в последние месяцы. В данный момент хунта видит только, что им приходится ждать этого."

 bex.18.d: "Похоже, что их освободили их похитители, что привело к путанице в вопросе о том, был ли это случайный акт со стороны симпатизаторов или это был их план все это время. если был явно не каждый в тюремной системе был в этом замешан, так как молодой новобранец всего 18 лет застрелил и убил единственного лидера, чтобы не сбежать, Вал основатель и лидер Уильям Сандерсон. Руководство теперь пало на одного из успешных побегов, Энтони Людовичи, который вместе с другими пятью прятался, и хунта может только удивляться, что они собираются сделать дальше..."

 bex.19.d: "В середине дня ведущие члены Объединенной Альбионской лиги, возглавляемой Людовиками, вместе с большим контингентом вооруженных людей в модифицированной военной форме, прошли по различным улицам Каира, прежде чем добраться до парламентского дворца. Жунта , намереваясь мирно проникнуть в здание парламента и арестовать действующее правительство, они, вместо этого, пошли прямо в лицо солдатам, охраняющим здание парламента, и теперь они ожидают приказов хунты о том, как справиться с этой вооруженной угрозой."

 bex.20.d: "На улицах Каира хунты было недостаточно боевых патронов со стороны солдат хунты, и в настоящее время на улицах Каира вспыхнула интенсивная перестрелка. Вожди хунты должны теперь принять решение о том, пытаться ли немедленно и подавлять правозащитников или же проявлять осторожность в борьбе с силами хунты."

 bex.21.d: "С уже разгневанной ситуацией предупредительный выстрел со стороны хунты ничего не сделал, вместо того чтобы разрядить напряженность, вспыхнула паника, которая быстро привела к перестрелке между обеими сторонами. Король и его люди храбро сражались, но через несколько минут король и его заговорщики бросили безжизненные за пределами парламентского дворца. Юнта сейчас впала в панику, в результате которой король потерял свою и без того напряженную популярность."

 bex.22.d: "Смерть короля, устраняя величайшую угрозу хунтайскому правлению, разрушила доверие, которое у них было среди эмигрантов, и с учетом приближающегося возможного полного краха Монтгомери решил спешно объявить Республику, заменив короля на пост лорда-защитника, в надежде на то, что при полной власти хунта сможет с помощью силы бороться за контроль над изгнаниями."

 bex.23.d: "С их стороны силы УВ смогли быстро захватить солдат хунты, при этом многие солдаты хунты дезертировали посреди битвы из-за паники, вызванной жестокостью нападения, после чего силы УАФ вошли в парламентский дворец, захватив жизненно важные позиции в здании и арестовав лидеров хунты. &quot; Монтгомери &quot; была вытащена на улицы Каира и казнена революцией Уэбли Людовицами для всех. &quot; Людовици &quot; заявила собравшейся толпе, что Объединенная лига Альбионов свергла тиранию хунты и теперь будет править вместо нее."

 bex.24.d: "В то время как битва шла все дольше и дольше, стало ясно, что числовое преимущество &quot; UAL &quot; не было постоянным. &quot; После направления приказов &quot; в здание парламента прибыло несколько местных сил хунты, и вскоре эта битва превратилась в массовую расправу. &quot; WAL &quot; была найдена мертвой на улицах Каира, их тела были окружены их соотечественниками, которые помогали им &quot; . &quot; Ни одной четверти &quot; сдавшимся &quot; не было дано, и вскоре улицы Каира бежали реками крови. &quot; Монтгомери &quot; объявила на беспроводной связи о том, что предатели были уничтожены и что правящее правительство было здесь, чтобы остаться &quot; ."

 bex.401.d: "В то время как правительство в Каире пока практически не поддерживало с нами контактов, теперь они наладили с нами всесторонние отношения, выражая желание восстановить братство Британской империи и вернуть родину."

 bex.402.d: "Американские силы побеждают по улицам Оттовы, когда канадское правительство наконец сдалось подавляющим силам США."

 bex.403.d: "Падение Дании стало свидетелем того, как социалистическая Великобритания захватила стратегически важную датскую Северную Атлантику."

 bex.404.d: "Падение Дании стало свидетелем того, как немцы захватили стратегически важную датскую Северную Атлантику."

 bex.405.d: "Ограниченная британская поддержка социалистического испанского превратилась в полное вмешательство, так как теперь альянс был заключен британскими и испанскими социалистами, и британские войска прибывают в Испанию эн-массе."

 bex.500.d: ""

 bex.501.d: "Наша чрезвычайно полезная поддержка испанцев во время гражданской войны была сегодня возмещена, когда испанцы объявили о своем вступлении в Имперский альянс защиты."

 bex.502.d: "Испанцы ударили нас ножом в спину, предпочтя отклонить наше предложение о союзе."

 bex.503.d: ""

 bex.504.d: "Продолжая века дружбы, португальцы приняли наше предложение о союзе, и теперь мы стоим бок о бок в деле восстановления нашей родины."

 bex.505.d: ""

 bex.506.d: ""

 bex.507.d: "Канадцы приняли наше предложение о союзе, и теперь мы вместе с нашими братьями становимся на сторону моей стороны, чтобы вернуть родные острова от социализма."

 bex.508.d: "Канадцы отвергли наше предложение о создании альянса, заявив, что их независимость является полной и что они не будут примирять ее, присоединяясь к нам. Это печальный день для Британии и Империи."

 bex.509.d: ""

 bex.510.d: "Австралийцы приняли наше предложение о союзе, и теперь мы стоим на моей стороне вместе с нашими братьями, чтобы вернуть дом от социализма."

 bex.511.d: "Австралийцы отвергли наше предложение о создании альянса, заявив, что их независимость является полной и что они не будут нарушать ее, присоединяясь к нам. Это печальный день для Британии и Империи."

 bex.512.d: ""

 bex.513.d: "Новозеландцы приняли наше предложение о союзе, и теперь мы вместе с нашими братьями становимся сторонниками для восстановления дома у социализма."

 bex.514.d: "Новозеландцы отвергли наше предложение о создании альянса, заявив, что их независимость является полной и что они не будут примирять ее, присоединяясь к нам. Это печальный день для Британии и Империи."

 bex.515.d: ""

 bex.516.d: "Южные африканцы приняли наше предложение о союзе, и теперь мы вместе с нашими братьями становимся на сторону моей стороны, чтобы вернуть дом от социализма."

 bex.517.d: "Южные африканцы отвергли наше предложение о создании альянса, заявив, что их независимость является полной и что они не будут примирять ее, присоединяясь к нам. Это печальный день для Британии и Империи."

 bex.600.d: "Вход Канады в союз с британскими изгнаниями породил их интерес к стратегически важным Североатлантическим островам, и сегодня они заявили, что мы должны сдать их или столкнуться с силой оружия."

 bex.601.d: "Результаты, которые мы считали наиболее маловероятными, произошли, и Дания мирно передала нам свои североатлантические территории."

 bex.602.d: "Неудивительно, что датчане отказались передать нам эти территории."

 bex.603.d: ""

 bex.604.d: "Еврейское государство согласилось с нашими требованиями и в настоящее время стало свидетелем того, как британское правление над этой территорией захватило всю территорию."

 bex.605.d: "Еврейское государство отвергло наши требования как возмутительные и теперь готовится к нападкам со стороны правительства Каира."

 bex.606.d: ""

 bex.607.d: "Йеменцы согласились с нашими требованиями, и нам был возвращен весь Аденский Защитник, что позволит нам обеспечить большую безопасность для нашего доступа в Индийский океан и вернуть в свои руки еще одну территорию Империи."

 bex.608.d: "Йеменцы отвергли наши требования, которые привели бы их к предреволюционным границам, и мы должны подготовить к вторжению против них из Аденской колонии."

 bex.700.d: "Наши силы успешно захватили Аденскую протекторат, и сейчас мы в состоянии потребовать от йеменцев этого региона в обмен на то, что на их территорию больше не будет прогресса."

 bex.701.d: ""

 bex.702.d: ""

 bex.703.d: "Мы потеряли свою опору в Аравии, когда Аденская колония рухнула под йеменский план, и, возможно, было бы мудро подать в суд за мир, пока эта неудачная война не затянулась."

 bex.704.d: ""

 bex.705.d: ""

 bex.706.d: "Наши силы теперь имеют полный контроль над островом Исландия, и с учетом того, что основная территория Датской Северной Атлантики взята на себя, мы можем потребовать уступок в обмен на мир."

 bex.707.d: ""

 bex.708.d: ""

 bex.709.d: "Датские силы успешно сдержали наши достижения и по-прежнему укоренились в Северной Атлантике."

 bex.710.d: "Британские изгнания не смогли захватить наши острова и теперь просят нас заключить мирное соглашение."

 bex.711.d: ""

 bex.712.d: ""

 bex.713.d: "Итальянские войска не смогли захватить наши земли, и теперь война превратилась в тупик, в котором итальянцы просили мира."

 bex.714.d: ""

 bex.715.d: "Жалкие итальянские войска отошли в сторону от наших достижений, и теперь мы находимся под контролем итальянской Африки, и теперь мы в состоянии потребовать уступок для итальянцев в обмен на мир."

 bex.716.d: ""

 bex.717.d: ""

 bex.1500.d: "Победа короля и его людей над хунтой ознаменовала первую серию выборов среди изгнанных."

 BEX_north_american_war.2.d: "Мир, который мы когда-то знали, исчез. Когда Соединенное Королевство поглощается братоубийственным пламенем гражданской войны, «Имперский щит», который когда-то гарантировал нашу безопасность, рушится. Почувствовав нашу изоляцию, Соединенные Штаты начали хищническое нападение через наши границы, стремясь уладить старые проблемы, пока мы уязвимы. Однако, мы не одни в опасности; на юге мексиканцы уже взяли оружие, чтобы остановить американский экспансионизм. Если мы хотим предотвратить полную аннексию Канады, мы должны отказаться от наших старых колониальных оговорок и координировать грандиозную стратегию с Мехико. Формальный союз — это наша единственная надежда поймать американскую военную машину в смертельном стержне."

 BEX_north_american_war.3.d: "Отчаявшаяся делегация прибыла из Оттавы с предложением, которое было сделано в пожаре американского вторжения. С их британскими защитниками, занятыми своим собственным внутренним крахом, канадцы борются за само существование, предлагают «Северный альянс», полный военный договор между нашими двумя странами, чтобы раздавить американский колосс между нами. Мы уже вступили в бой, чтобы защитить свою собственную землю, но, объединив наши команды с канадцами, мы можем превратить серию пограничных стычек в континентальную борьбу за освобождение. Пора показать Вашингтону, что страны, которых они стремятся доминировать, не пойдут тихо в ночь."

 BEX_north_american_war.4.d: "Великая североамериканская война завершилась, и континент вздохнул с облегчением. «Северный альянс», родившийся от отчаяния Канады и мексиканской решимости в мрачные дни британского краха, выполнил свой исторический мандат. Американская угроза нейтрализована, и границы континента были защищены от будущей агрессии. В то время как связи, сложившиеся в траншеях между Сент-Луренсом и Рио-Гранде, никогда не будут забыты, официальная военная структура нашего пакта больше не требуется. По мере того, как дым проясняется, мы расходимся не как отчаявшиеся остатки, а как суверенные победители. Альянс распадается."

