l_russian:

 #### Events ####

 lba.1.t: "Последний из ордена Сенусси"
 lba.1.d: "После нескольких жестоких репрессий, организованных итальянским командиром Итало Бальбо, некогда могущественный порядок Сенусси находится в состоянии неурядицы. В настоящее время они сбегают на свою базу в Курфе в контролируемом Великобританией Египте. Эта непреднамеренная амнистия египетского правительства на протяжении многих лет была скованной на нашей стороне. Каждый раз, когда мы следуем за партизанами, которые убегают за пределы нашего суверенитета, где они могут перегруппироваться и организоваться в безопасности, наши постоянные требования к англичанам сдержать сенусси падают на уши. Коммандер Бальбо планирует возглавить операцию в Куфра, чтобы раз и навсегда демонтировать сенусси, игнорируя египетский суверенитет."
 lba.1.a: "Британцы не оставили нам выбора."
 #
 lba.2.t: "Итальянские патрули пересекают Египет"
 lba.2.d: "В течение многих лет Италия обвиняла султана в Египте в том, что он укрывал партизанских боевиков от ливийского ордена Сенусси . Сегодня, несмотря на то, что без какого-либо предупреждения подразделение итальянского гарнизона Ливии проникло в Западную пустыню, атаковав оазис Куфры, нападение было кратким, но решающим, итальянские силы даже подозревали, что они захватили Омара Мухтара, лидера Сенусси , независимо от успеха этой операции, является явным нарушением суверенитета Египта."
 lba.2.a: "Попроси Лондона оказать давление на Италию, чтобы она уважала нашу границу."
 lba.2.b: "Может, нам стоит закрыть на это глаза?"
 #
 lba.3.t: "Инцидент с Куфрой"
 lba.3.d: "Недавно до сведения Рима дошло, что наш командир в Ливии Итало Бальбо привел к несанкционированному и незаконному вторжению в контролируемый Великобританией Египет, чтобы раздавить орден Сенусси, который в течение почти десяти лет ведет партизанский конфликт против итальянских сил в Ливии. Хотя это вторжение и привело к захвату лидера Сенусси Омара Мухтара, оно поставило нас в противоречие с Британской империей. Чтобы избежать дальнейшего усиления конфликта в Британии, по просьбе султана Египта, мы требуем от нас официальных извинений в связи с этим инцидентом и уважения границы Египта в будущем. В то время как ИПИ поддерживает утверждение о том, что многие националистические группировки Лондона рассматривают это как оскорбление и любое примирение с Лондоном как главный признак слабости. Расширяющаяся национальная популистская партия Бальбо, АНИ, даже организовала демонстрацию в Риме, чтобы продемонстрировать свою поддержку его решительных действий. В то время как наши внутренние партии спорят о законности действий Балбо, международное сообщество желает сохранить мир в Европе."
 lba.3.a: "Извинись, выговори Бальбо."
 lba.3.b: "Италия стоит за своими командирами"
 #
 lba.4.t: "Омар Мухтар захвачен"
 lba.4.d: "Наша операция в контролируемой Египтом Куфре увенчалась большим успехом. Лидер Сенусси Омар Мухтар был захвачен и доставлен в Бенгази, чтобы подождать суда над ним. После того, как их лидер уйдет из-под стражи Ордена Сенусси, он медленно развалится. Очевидно, что война в Ливии приближается к концу. В то время как многие должностные лица однажды беспокоились о реакции Рима на действия Бальбо, эта великая победа Италии, несомненно, омрачит эти детали."
 lba.4.a: "Цели в конечном счете оправдывают средства"
 #
 lba.5.t: "Рим выговор Итало Бальбо"
 lba.5.d: "Несмотря на успех усилий Бальбо по установлению мира в Ливии, Рим отказывается публично поддерживать его, но в частном порядке ходят слухи, что это действие лишь для того, чтобы сохранить лицо и не будет иметь долгосрочных последствий для военной карьеры Бальбо."
 lba.5.a: "Правительство Рима бесхребетное"
 #
 lba.6.t: "Бальбо хочет вернуться в Рим."
 lba.6.d: "Поражение порядка Сенусси в Ливии послужило сигналом о прекращении роли Бальбо в колонии."
 lba.6.a: "Бальбо объявляет о своем возвращении."
 #
 lba.7.t: "Итало Бальбо возвращается из Ливии"
 lba.7.d: "Генерал Бальбо приземлился в Риме сегодня после своей последней победы в Сиренице, благодаря его военным усилиям, мы можем наконец-то установить контроль над всей ливийской областью. Обычным приветствием для такого случая является благословление короля и встреча, но генерал Бальбо считается опасным для многих. Он и его ассоциациационно-нацоникалистская итальянская партия имеют историю политического насилия. Во время военизированных блюзги АНИ Красного Бьенния напали на социалистов и даже на государственную полицию. Он утверждает, что изменился после этих бурных времен, но его недавняя автократическая позиция, продемонстрированная в Ливии, рассматривается многими противниками как признак его продолжающегося насильственного руководства. Что нам теперь делать?"
 lba.7.a: "Он получит приветствие от героя."
 lba.7.b: "Мы должны преуменьшить его победу в Ливии."
 #
 lba.8.t: "Сенусси-поместья"
 lba.8.d: "С захватом Омара Мухтара многие бывшие воины Сенусси возвращаются к гражданской жизни, пытаясь жить нормальной жизнью, несмотря на свою историю. Война в Ливии была большой для Италии. Сенусси может быть конфискована как форма возмещения ущерба итальянским поселенцам. Итальянцы , проживающие в Ливии, пользуются популярностью среди коренного населения. Сенусси ."
 lba.8.a: "Сенусси должны заплатить за свои преступления."
 lba.8.b: "Мы должны содействовать примирению"
 #
 lba.9.t: "Ливийцы занимают государственное здание в Триполи"
 lba.9.d: "Согласно Акромскому договору 1917 года, Ливия получила автономию под итальянским правлением, однако после Великой войны большинство положений этого договора были отменены, и Ливия продолжала править, как и другие итальянские колонии. Ливийские не были популярны, как это говорят ливийцы. Омар Мухтар был захвачен и заключен в тюрьму. Ливийские интеллигенты решили занять итальянский административный объект в Триполи. Они передали список жалоб местной прессе, который в основном касается обращения с Мухтаром, но включает также возражения против растущего итальянского населения в ливийских городах и очевидных экономических и юридических преимуществ, которые эти иммигранты имеют по отношению к местному населению. Полиция готова удалить протестующих, как только что мы говорим ."
 lba.9.a: "Преступники должны быть наказаны"
 lba.9.b: "Мы должны хотя бы выслушать их жалобы."
 #
 lba.10.t: "Италия покончит с военным правительством Ливии"
 lba.10.d: "С тех пор как в 1912 году Ливия стала владеть итальянской империей, она все больше попала под влияние итальянских военных, хотя многие утверждали, что это было необходимо для поддержания стабильности в колонии, последствия этой оккупации были катастрофическими для региона и ее народа. Большинство коренных ливийцев являются гражданами второго класса и с подозрением обращаются с ними итальянские власти. Война с сенуссийским Орденом стоила Италии миллионов лир, покидая ливийскую инфраструктуру в разоруженном состоянии. Рим теперь считает, что наилучший курс действий - это позволить Ливии существовать в качестве автономной нации в сфере влияния Рима. Пока не будет избран подходящий местный лидер, временное правительство будет отдано под контроль администрации Ливии в течение некоторого времени."
 lba.10.a: "Светлое будущее Ливии прямо за углом."
 #
 lba.11.t: "Италия устанавливает Идриса I королем Ливии"
 lba.11.d: "Идрис я, по меньшей мере, спорная фигура, родившаяся в Ордене Сенусси, он был частью партизанских сил, которые на протяжении десятилетий преследовали Ливию, но он был одним из немногих лидеров, пытавшихся найти компромисс с итальянцами. Как популярная фигура среди ливийского населения, считается, что Идрис я смогу принести стабильность и мир в регионе, сохраняя при этом позитивные отношения с Римом."
 lba.11.a: "Да здравствует король!"


 ### Ideas ###
 ITA_guerrilla_conflict: "Коллизия кровопролития"
 ITA_guerrilla_conflict_desc: "На протяжении более десяти лет Орден Сенусси возглавляет партизанскую кампанию против итальянских сил в Ливии. Сенусси лидер Омар Мухтар призывает к полной независимости Ливии от имперского правления. Чтобы добиться этого , его войска нападают на наши города и инфраструктуру в ходе быстрых и смелых рейдов, как правило, в ночной кончине. Этот хаос препятствует развитию Ливии, поскольку многие итальянские промышленники устали вкладывать средства в такой насильственный регион. Несколько недавних побед итальянского командира Итало Бальбо оттолкнули Сенусси обратно в ливийскую пустыню, но только время покажет, является ли это началом крупного прорыва."
