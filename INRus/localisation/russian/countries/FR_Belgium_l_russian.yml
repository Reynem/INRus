 #####Ideas#####
 BEL_last_stand: "Для Бельгии!"
 BEL_last_stand_desc: "Никогда больше 1914 года!"
 BEL_pillarized_society: "Целостное общество"
 BEL_pillarized_society_desc: "Основы бельгийского общества: народы разделены на различные группы по политическим и религиозным направлениям, социологи из-за отсутствия социальных отношений между католиками и либералами, а также из-за полного отсутствия между католиками и социалистами; политика входит во все сферы общественной деятельности и благотворительности, и, как утверждается, она является скорее исключением, чем правилом, когда те, кто придерживается различных политических взглядов, каким-либо образом сотрудничают; она проявляется повсюду и представляет собой одну из форм неформальной сегрегации в бельгийском обществе; вместе с тем благословением этого является мир, вытекающий из такого разделения, а также тот факт, что эти различия препятствуют возникновению проблемы языкового разрыва между фламандским и валлонским народами."
 BEL_national_unity_government: "Правительство национального единства"
 BEL_national_unity_government_desc: "Правительство национального единства поддерживает стабильность и мир в Бельгии, будучи хранителями бельгийской нации и действуя в качестве оцепления политических экстремистов слева и справа."
 BEL_linguistic_debacle: "Языковые проблемы в армии"
 BEL_linguistic_debacle_desc: "Фламандцы и валлонцы не могут правильно общаться, если они не владеют двумя языками. Великая война увидела огромную некомпетентность и ненужную смерть в результате того, что люди не могут понять своих офицеров. Если мы не хотим, чтобы это повторилось в ходе следующей войны, мы должны решить этот лингвистический вопрос."
 BEL_improved_working_conditions: "Улучшение условий работы"
 BEL_subsidized_boerenbond: "Субсидированный буренбонд"
 BEL_conge_paye: "Выплаченные отпуска"
 BEL_large_state_investments: "Крупные государственные инвестиции"
 BEL_deregulated_industry: "Дерегулированная промышленность"
 BEL_strong_middle_class: "Сильный средний класс"
 BEL_women_suffrage: "Женский костюм"
 BEL_women_suffrage_desc: "Женщины получили право голоса."
 BEL_debased_currency: "Денонсированная валюта"
 BEL_vlaamse_wacht: "Влаамсе Вахт"
 BEL_purging_opposition: "Очистить оппозицию"
 BEL_diamond_trade: "Торговля алмазами"
 BEL_small_arms_factory: "Фабрика стрелкового оружия"
 BEL_bilingualism: "Двуязычие в армии"
 BEL_bilingualism_desc: "Только настоящий злодей может сейчас сказать, что бельгийская армия и ее братство фламандских и валлонских войск не являются гладко управляемой машиной, наши офицеры являются искусными проводниками этой силы, командующими на обоих языках. Бельгийские мужчины стоят бок о бок, готовы к тому, что может угрожать их родине."
 BEL_separate_divisions: "Разрозненные отделы языков"
 BEL_separate_divisions_desc: "Принимаются необходимые меры для того, чтобы иметь фламандских офицеров для Флемса и валлонских офицеров для Валлонии, и в бельгийской армии больше не должно быть путаницы."
 BEL_black_wednesday: "Эффекты черной среды"
 BEL_black_wednesday_desc: "Крушение Лондонского фондового рынка нанесло огромный ущерб нашей стране. Экономика, которая работает, как часы, слюни и задыхается от безделья. Мужчины стоят без работы на улицах, женщины борются за ведение домашнего хозяйства, а те, кто находится у власти, сталкиваются с вопросом, если кризис не урегулирован."
 BEL_better_research: "Совершенствование исследований"
 BEL_armed_neutrality: "Вооруженная нейтральность"
 BEL_armed_neutrality_desc: "Бельгийцы стоят в одиночестве, едины и готовы встретить любого врага, нам не нужно бить себя ни на одну сторону, хотя немцы могут мечтать о другом Шлиффене, голландцах единой диетической земли, и Франции единства с валлонцами, Бельгия стоит как железная стена. Арденны и Мёзе являются нашими крепостями против наших врагов, а бельгийские мужчины стоят плечом к плечу против любого, кто может попытаться и посметь нарушить наш нейтралитет."
 BEL_profits_from_congo: "Прибыль из Конго"
 BEL_economic_secretariats: "Экономические секретариаты"
 BEL_union_of_craftsmen_and_intellectuals: "Союз ремесленников и интеллигенции"
 BEL_bwp_integrated: "Комплексный БПР/ПБ"
 BEL_communist_brigades: "Коммунистические бригады"
 BEL_nationalizing_pillars: "Национализация компонентов"
 BEL_nationalizing_pillars_desc: "Мы являемся одним бельгийским народом и не можем поощрять лояльность и принадлежность к либералам, социалистам и консервантам."
 BEL_dominer_pour_servir: "Доминатор в Сервире"
 BEL_dominer_pour_servir_desc: "Конголезцы и все другие народы, которые мы собираем, должны служить своему владычеству, мы должны награждать тех, кто предан, вербует и борется за Бельгию, с другой стороны, не будут мириться с теми, кто берет на себя оружие против нас, и это должно быть нашей доктриной, твердой, но справедливой."
 BEL_militarism_idea: "Бельгиканская боевая фурия"
 BEL_militarism_idea_desc: "Мы стремимся к созданию нового бельгийского человека, который не только готов, но и стремится к великой борьбе."
 BEL_volunteers_idea: "Крестоносцы за европейскую цивилизацию"
 BEL_volunteers_idea_desc: "Мы боремся за будущее европейской цивилизации и за европейское культурное возрождение. Мы боремся за Европу!"
 BEL_germanmission_idea: "Немецкая военная миссия"
 BEL_germanmission_idea_desc: "Немецкая военная миссия в нашу нацию была весьма полезной для дисциплины наших войск, что стоило большего времени для подготовки наших войск, однако, если бы наши отношения с немцами были кислы, эта миссия ушла бы вместе с дружбой."
 BEL_econ_miracle: "Бельгийское экономическое чудо"
 BEL_econ_miracle_desc: ""
