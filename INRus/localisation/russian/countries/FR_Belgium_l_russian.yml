 #### Description ####
 BEL_FUHRERREICH_DESC: "Бельгия, которая была взорвана и почти полностью оккупирована в 1914 году немцами, пережила войну, несмотря на то, что после нее осталось много смертей и разрушений. Из-за того, что голландцы разрешили германскому отступничеству через их территорию, Бельгия была вознаграждена территориальными уступками на севере и востоке. С тех пор Бельгия перешла в массовую демократию, несмотря на все большее скептицизм в этой системе, и дальнеправый и левый продолжают расти. Международные угрозы продолжают расти, реваншистская Германия и Нидерланды угрожают послевоенным завоеваниям, безопасности и даже существованию Бельгии. Бельгии потребуется квалифицированное руководство для решения проблем предстоящего десятилетия."

