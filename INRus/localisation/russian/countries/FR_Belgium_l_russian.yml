 #####Tooltips#####
 BEL_congo_servir_tooltip: "Добавляет в Конго новые силы, повышающие нашу способность строить промышленность, нанимать мужчин и извлекать ресурсы из этой территории."
 BEL_germanyalliance_tooltip: "Немецкая вероятность принятия зависит от их отношений с голландцами и от тех уступок, которые мы готовы пойти на это."
 BEL_germanyalliance2_tooltip: "Немецкая вероятность принятия зависит от их отношений с северным голландцем и от тех уступок, которые мы готовы пойти на это."
 BEL_germanyalliance3_tooltip: "Немецкая вероятность принятия зависит от того, какие уступки мы хотим сделать."
 BEL_luxulitimatum_tooltip: "При наличии чрезмерной силы и позитивных отношений люксембургцы, скорее всего, согласятся на объединение, однако, если наша армия разрушается или наши отношения с Люксембургом являются бедными, то они вряд ли согласятся с нашими требованиями."
 BEL_belend_hahagetit_tooltip: "Если мы продолжим идти по этому пути, это будет конец Бельгии!"
 BEL_air_not_picked: "Поставят самолеты, исходя из того, какого типа ВВС мы выберем."
 BEL_agreementAtooltip: "Немцы требуют Юпена-Мальмеди и Люксембурга, а также признают, что после поражения Франции им будут вручены Alsace, Нэнси и Саар, в то время как мы все еще получим наши бургундские притязания."
 BEL_agreementBtooltip: "Немцы требуют Юпена-Мальмеди и Люксембурга, а также признают, что после поражения Франции им будут вручены Alsace и Saar, в то время как мы получим наши бургундские претензии"
 BEL_agreementCtooltip: "Немцы требуют Юпен-Мальмеди, признавая, что после поражения Франции им будут вручены Alsace, Нэнси и Саар, в то время как мы получим наши бургундские претензии"
 BEL_agreementDtooltip: "Немцы требуют Юпена-Мальмеди, а также признают, что после поражения Франции им будут вручены Alsace и Saar, в то время как мы получим наши бургундские притязания"
 BEL_agreementEtooltip: "Немцы требуют, чтобы мы признали, что после поражения Франции им будут вручены Alsace и Saar, в то время как мы все еще получим наши бургундские притязания."
 BEL_agreementFtooltip: "Немцы требуют, чтобы мы признали, что после поражения Франции им наградят Саар, в то время как мы все еще получим наши бургундские притязания."
 BEL_agreementGtooltip: "Благородные немцы были достаточно добры, чтобы принять союз без ограничений, где получат все наши притязания."
 BEL_optionA_tooltip: "Мы попросим, чтобы они передали Юпена-Мальмеди и дали нам Люксембург, если он будет занят, и Альзас, Нэнси и Саар в случае французского поражения."
 BEL_optionB_tooltip: "Мы попросим, чтобы они передали Юпена-Мальмеди и дали нам Люксембург, если он будет занят, а Альзас и Саар - в случае французского поражения."
 BEL_optionC_tooltip: "Мы попросим, чтобы они передали Юпена-Мальмеди и Альсаса, Нэнси и Саара в случае французского поражения."
 BEL_optionD_tooltip: "Мы попросим, чтобы они передали Юпена-Мальмеди, Альсаса и Саара в случае французского поражения."
 BEL_optionE_tooltip: "Мы попросим, чтобы они передали Альзаса и Саар в случае французского поражения."
 BEL_optionF_tooltip: "Мы попросим, чтобы они передали Саар в случае французского поражения."
 BEL_optionG_tooltip: "Бельгийцы могут получить все свои притязания. Мы не получим никакой территории от побеждённых французов, кроме Рейнленда."
 BEL_PB_monarchy_byebye: "Монархия будет в конце, если будет избран PB"
 BEL_agreementwithjerry1: "Немцы требуют Юпена-Мальмеди, и мы получим наши претензии, когда Франция падет, и отдадим им их одновременно."
 BEL_agreementwithjerry2: "Немцы требуют Юпен-Мальмеди и Люксембург, и мы получим наши претензии, когда Франция падет, и отдадим им их одновременно."
 BEL_agreementwithjerry3: "Немцы не требовали от нас никакой территории."

 #####Focus#####
 BEL_goal_expand_antwerp_forts: "Расширение фламандского пояса" 
 BEL_goal_expand_antwerp_forts_desc: ""Национальный переворот" Антверпена хорошо служил нам во время Великой войны, но его кольцо крепостей 19-го века опасно устарело. Машинные орудия и артиллерия изменились, и появление воздушной силы представляет собой угрозу, которую наши предки никогда не могли себе представить. Мы должны взять на себя обязательство полностью модернизировать антверпенские крепости. Это означает налив новых бетонов, установку современной артиллерии, подкрепление журналов и строительство новой плотной сети противовоздушных зенитных установок. Если мы попытаемся вновь осуществить план Шлиффена, то укрепленная позиция Антверпена должна быть неприступным бастионом, который может продержаться несколько месяцев, а не недель."

 BEL_goal_new_artillery_pieces: "Артиллерийская реформа" 
 BEL_goal_new_artillery_pieces_desc: "Артиллерийский парк нашей армии является музеем Великой войны. В то время как 75-миллиметровое оружие РСК является достаточным, большая часть наших запасов состоит из тяжелых, стационарных крепостных пушек и устаревших полевых предметов из десятков различных производителей. Современная, мобильная война требует современной мобильной огневой мощи. Эта реформа позволит финансировать разработку и производство новых стандартизованных полевых артиллерийских и противотанковых пехотных орудий, способных идти в ногу с нашей пехотой и противодействовать бронежилетам, с которыми мы, безусловно, столкнемся на следующем поле боя. Мы также будем обновлять наши доктрины, переключив наше внимание с статических подготовительных бомбардировок на гибкую, вспомогательную пожарную миссию."

 BEL_goal_mobilisation: "Новые системы мобилизации" 
 BEL_goal_mobilisation_desc: "Наши нынешние планы мобилизации являются реликвией, предназначенной для статического конфликта и опирающейся на плотную железнодорожную сеть, которая сама по себе является главной целью. В 1914 году это был хаос. Мы не можем позволить себе повторение. Для того чтобы наши резервы можно было быстро и эффективно мобилизовать, оснастить и развертывать в определенных секторах, необходима новая, комплексная система, предусматривающая создание новых региональных складов, установку предварительного оборудования и проведение регулярных учений для обеспечения того, чтобы с момента вынесения приказа вся страна могла перейти к состоянию полной войны в течение 48 часов."

 BEL_goal_ally_germany_hol: "Альянс с Германией" 
 BEL_goal_ally_germany_hol_desc: "Слишком долго наш народ был полемкой для амбиций Парижа и Берлина. Нейтральность подвела нас, и союз с убывающей Французской Республикой, кажется, плохая ставка. Однако немецкий рейх является возрождающейся державой, страной, с которой наш народ имеет глубокие культурные и этнические связи. Приведя наше государство в соответствие с Берлином, мы не только обеспечим безопасность наших границ; мы закрепим нашу позицию в качестве соответствующей державы. Этот пакт защитит нас от французской агрессии, обеспечит наше экономическое процветание и обеспечит нам военную поддержку, необходимую для того, чтобы мы могли решать свою собственную национальную судьбу."

 BEL_goal_claim_insulindia: "Заявить в Нидерландскую Ист-Индию" 
 BEL_goal_claim_insulindia_desc: "Колониальный драгоценный камень Нидерландов, богатой ресурсами Ист-Индии, в настоящее время находится под защитой Великобритании. Это неприемлемое положение дел. С образованием Дитсленда наше новое государство является единственным законным преемником нидерландской короны и всех ее владений. Правительство румянского государства вряд ли может управлять своей собственной территорией, не говоря уже о заморской империи. Мы официально претендуем на Инсулиндию, требуя передачи британской власти ее законным владельцам. Масло, каучук и людские ресурсы Индии имеют важное значение для нашего будущего как мировой державы."

 BEL_goal_ally_france: "Альянс с Францией" 
 BEL_goal_ally_france_desc: "Дважды в живой памяти германская агрессия нарушила наш нейтралитет и пропитала наши поля кровью. Мы не можем оставаться в одиночестве против этой угрозы. Франция, наш брат по оружию от Великой войны, остается нашим самым логичным и надежным партнером. Хотя их политика может быть разрушена, их армия остается мощным сдерживающим фактором. Оформив новый военный союз, мы связываем нашу судьбу с Французской Республикой, распространяя защиту линии Магино на нашу собственную границу и обеспечивая, чтобы любое новое немецкое приключение на западе было встречено не небольшим, нейтральным государством, а совокупной мощью западных союзников."

 BEL_goal_armed_neutrality_hol: "Вооруженная нейтральность" 
 BEL_goal_armed_neutrality_hol_desc: "Великие державы рассматривают нашу землю как не что иное, как удобную дорогу для своих армий. Альянс с Германией вызывает французскую враждебность, в то время как договор с Францией делает нас главной целью для немцев. Единственная рациональная политика — это политика, которая служит нам в течение века: нейтралитет. Но это не может быть пассивным, вселяющим надежду нейтралитетом прошлого. Это должно быть Вооруженная нейтральность, поддерживаемая сильными военными, современными фортами, и национальная воля бороться с любым - французским, немецким или британским, - кто осмеливается ступать на нашу землю. Мы станем диквином, который не будет угрожать, но обещает мучительную смерть любому хищнику."

 BEL_goal_luxembourg_2: "Ультиматум Люксембургу" 
 BEL_goal_luxembourg_2_desc: "Лондонский договор 1839 года был предательством, диктатом, навязанным великими державами, которые лишили Великое Герцогство его законного места в качестве провинции нашей нации. Народ Люксембурга — это наш народ, а его земля — наша земля. На протяжении почти века мы уважали эту искусственную границу. Уже нет. С сосредоточенным вниманием мира на более крупных конфликтах, настало время исправить эту историческую несправедливость. Мы выпустим ультиматум правительству Великого Герцогства: интеграцию или аннексию. Время люксембургской «независимости»."

 BEL_goal_greater_south_diets: "Большой Южный Диетланд" 
 BEL_goal_greater_south_diets_desc: "На протяжении веков народ диетов, говорящие на голландском и фламандском языках, были разделены произвольной границей, подданными различных крон. "Южный диетленд", наш дом, привязан к франкоговорящим валлониям, в то время как "Северная Дитленд" (Нидерланды) дрейфует в одиночку. Этот фокус начнет грандиозный проект объединения. Мы будем развивать культурный обмен, согласовывать нашу экономику и продвигать паннационалистический идеал "Великой Дитленд" - единственное, мощное государство для всех диетоговорящих людей, начиная с областей Фландрии и кончая портами Голландии."

 BEL_goal_reorganise_state: "Сводные диеты" 
 BEL_goal_reorganise_state_desc: "Союз завершен. "Великий Дитсленд" - это реальность, но работа только началась. Теперь мы являемся нацией из двух столиц, двух правовых систем, двух армий и двух глубоко укоренившихся бюрократий. Это дублирование усилий неэффективно и является источником внутренних трений. Мы должны теперь выполнить сложную, но важную задачу консолидации. Необходимо выбрать одну столицу, новую конституцию, объединенную армию под единым командованием и новую общую национальную самобытность, созданную для замены старых лояльностей Брюсселю и Амстердаму."

 BEL_goal_reach_out_to_suriname: "Достучаться до Суринама" 
 BEL_goal_reach_out_to_suriname_desc: "В то время как мы создали новое государство Дита со старой европейской родины, остатки голландского правительства в изгнании остаются в Парамарибо, во главе с Домом Оранжевого. Они являются символом старого, разделенного порядка. Мы должны решить этот раскол. Мы предоставим предложение правительству Суринама, пригласив королеву Вильгельмину и ее администрацию вернуться в Европу. Они могут либо принять свою новую роль конституционных монархов «Великой Дитленда», возложив на наш новый порядок свою легитимность, либо быть заклеймены как не имеющие отношения к делу реликвии, прилипнув к короне, которой больше не существует."

 BEL_goal_liberate_the_north: "Освободить Север" 
 BEL_goal_liberate_the_north_desc: "Мы предложили нашим братьям на севере руку в дружбе и единстве, и они плюнули на нее. Амстердамское правительство, цепляясь за свой маленький суверенитет, отвергло судьбу народа Дита. Они решили оставаться разделенными, слабыми и разделенными. Так тому и быть. Если они не присоединятся к нам дипломатией, то они будут соединены стали. Это не война завоеваний, это война освобождения. Мы пойдем на север, разрушим их правительство и соберем наш народ силой. Эра двух государств Дитей закончилась."

 BEL_goal_independent_south_diets: "Сохранять сеперат Южного Дитленда"
 BEL_goal_independent_south_diets_desc: "Католическая самобытность имеет основополагающее значение для нашей земли, и, хотя наши желания объединиться с Севером могут быть велики, мы не можем оглядываться на их протестантские наклонности, которые могут привести к навязыванию нам, вместо этого мы подтвердим как нашу католическую, так и голландскую самобытность, но в настоящее время будем стоять отдельно от наших северных братьев."
 BEL_goal_kingdom_of_south_dietsland: "Королевство Южный Дитленд" 
 BEL_goal_kingdom_of_south_dietsland_desc: "Строение «Бельгия» 1830 года было компромиссом, буферным государством, созданным Великими державами, а не истинной нацией. Оно противоестественно связывало два отдельных народа — диетоязычные флеминги и франкоговорящие валлонии — под единым, часто нефункциональным правительством. Культурное движение за «Существенную Южную Дитленд» пробудило наш народ в истинном наследии и судьбе. Теперь мы должны сделать эту культурную реальность политической. Мы официально расформируем старое Королевство Бельгия. Будет разработана новая конституция, в которой будет закреплена примат диетского языка и культуры. Мы реорганизуем государство в качестве «Королевства Южной Дитленда», нации по и по отношению к фламандистскому народу. Этот шаг изменит наши отношения с Валлонскими провинциями, превратив их из равных партнеров в автономный или подчиненный регион. Наш монарх больше не будет господствовать над искусственным «Белгским» компромиссом, а будет править как глава истинной, единой и гордой диетской нации."

 BEL_goal_mobile_doctrine: "Мобильная доктрина" 
 BEL_goal_mobile_doctrine_desc: "На протяжении десятилетий в нашем военном планировании доминировало одно слово: оборона. Мы построили крепости, подобные Национальному Редукту в Антверпене, и вложили большие средства в статичную артиллерию, все в надежде на возобновление войны. Но следующая война не будет побеждена людьми, сидящими в бетонных бункерах. Это будет война скорости, стали и неожиданности. Несмотря на то, что наша армия мала, мы не можем позволить себе торговать жизнями в войне выбытия. Наша единственная надежда на победу - или даже на выживание - должна быть быстрее, более гибкой и более смертоносной, чем наши противники. Эта направленность представляет собой полный пересмотр нашего стратегического мышления. Мы переключим исследования и финансирование с статической обороны на создание профессиональных, бронебойных сил. Будут разработаны новые доктрины, в которых особое внимание будет уделено комбинированным вооружениям, глубокому проникновению и моторной пехоте. Наша армия должна быть преобразована из хрупкого щита в клином копе, способном изгновать своих врагов и делать решительный удар там, где они меньше всего этого ожидаюти."
 BEL_goal_belgian_econ_miracle: "Бельгийское экономическое чудо"
 BEL_goal_belgian_econ_miracle_desc: "Из пепла Лондонского фондового рынка, бельгийского экономического феоникса, разгоняется, хорошо масляная машина, фламандский рабочий-фабрикат, а Валлонский шахтер врывается в глубину, их уровень жизни значительно повысился, их производительность выше уровня, о котором мы мечтали ранее, и наши люди на передовой линии, поддерживаемые индустрией, готовой к любой войне, которая может достичь нашего маленького, но богатого государства."
 BEL_german_military_mission: "Немецкая военная миссия"
 BEL_german_military_mission_desc: "Многие могли бы поспорить, что немцы поставляют самую лучшую армию на европейском континенте. Хотя это понятие можно обсуждать, нельзя отрицать их маршалов. Запрашивая немецкие инструкции по их доктринам и режимам профессиональной подготовки, возможно, это то, что нам нужно для развертывания армии, которая может быть столь же возвышенной в своей деятельности."
 BEL_volunteers_for_germany: "Добровольцы в поддержку цивилизации"
 BEL_volunteers_for_germany_desc: "Мы сражаемся не только за Бельгию, Бельгию, Бургундию или Штальпакт, мы сражаемся за будущее европейской цивилизации и европейское культурное возрождение."
 BEL_burgundian_integration_focus: "Бургундская нация"
 BEL_burgundian_integration_focus_desc: "Бельгия никогда не должна была быть просто Фландрией-Валлонией, что родилось в католическом восстании против голландского переворота, действительно было преемником бургундского народа, с фламандской и валлонской стали мы восстановили наше наследие, и пришло время для нас развивать поистине великую нацию."
 BEL_belgian_militarism: "Белгиканский милитаризм"
 BEL_belgian_militarism_desc: "Этиология Бельгая видит свои корни в прото-Кельтском термине &quot; набухает &quot; , в котором говорится об опухоли гнева и боевой ярости, в сочетании с голландским термином &quot; гебельгдд &quot; или &quot; очень злой &quot; или &quot; глагологоген &quot; . Поэтому это этническое имя можно резюмировать как &quot; народ, который разбушевывается от ярости боя &quot; . &quot; Бельгай &quot; является непосредственным предшественником современной прилагательной &quot; Бельгиан &quot; . Поэтому мы знаем, что у бельгийского народа внутри его крови есть дух воина, который все меньше и меньше показывает себя. Мы должны возродить это, поощрять обищение в наших доктринах, учить молодежь военной истории, поощрять конкурентоспособность. &quot; Мы создадим нового бельгийского человека &quot; еще &quot; ."
 BEL_agreement_with_germany: "Поиск немецкого альянса"
 BEL_agreement_with_germany_desc: "География не была добра к Бельгии. Наша единственная естественная оборона - это Арденны и Мёз. Немецкие или французские движения не осмеливаются проходить через сильно укрепленные Альзас-Лоррейн, в то время как Альпы являются естественным барьером на всем пути к Средиземному морю. Поэтому вполне естественно, что эти державы используют Бельгию в качестве своего поля боя. Мы не можем быть нейтральными в этом положении, мы должны быть союзниками с одной из сил, пока мы не будем достаточно сильными, чтобы отталкивать вторжения в обоих направлениях. Немцы были бы идеальными благодаря нашим планам на французской территории и нашим идеологическим связям. Альтернативой, как представляется, являются немцы, которые используют нас в качестве полигона без нашего согласия, и мы не хотим быть запертыми в потопляющем французском корабле. С помощью такого союза мы можем процветать, чтобы мы могли стоять на своих собственных двух футах. Однако, стоимость союза может быть велика в концессиях, которые нам нужно будет сделать для немцев."
 BEL_goal_elections: "Выборы 1936 года"
 BEL_goal_elections_desc: "Выборы в мае 1936 года определят, какие политические партии будут править Бельгией в течение следующих четырех лет."
 BEL_goal_KPB: "Коммунистическая победа"
 BEL_goal_KPB_desc: "После того как коммунисты успешно победили королевскую армию во время недавней гражданской войны, теперь им предстоит восстановить страну и сделать Бельгию снова великой."
 BEL_goal_de_man: "Выбрать De Man"
 BEL_goal_de_man_desc: "Хендрик Де Ман, который недавно взял под свой контроль авангардистскую фракцию в рамках БРГ, является жизнеспособным претендентом на контроль над Бельгией после гражданской войны."
 BEL_goal_economic_secretariats: "Экономические секретариаты"
 BEL_goal_economic_secretariats_desc: "Экономические секретариаты, возглавляемые теминократами, которые не связаны какими-либо сторонами, являются тем путем, который мы хотим вывести нашу страну из экономического кризиса."
 BEL_goal_nationalize_industries: "Национализация промышленности"
 BEL_goal_nationalize_industries_desc: "Национализация промышленности имеет жизненно важное значение для того, чтобы положить конец так называемым рыночным монополиям, которые некоторым компаниям удалось забрать у правительства."
 BEL_goal_union_of_craftsmen_and_intellectuals: "Союз ремесленников и интеллигенции"
 BEL_goal_union_of_craftsmen_and_intellectuals_desc: "Союз ремесленников и интеллектуалов создает прочные связи между рабочими классами нашей страны и представителями интеллигенции, которые руководят страной."
 BEL_goal_head_office_worker_education: "Главное управление по вопросам образования трудящихся"
 BEL_goal_head_office_worker_education_desc: "Главное управление по вопросам образования трудящихся является учреждением, которое будет оказывать помощь в обучении рабочих классов Бельгии."
 BEL_goal_choose_KPB: "Выберите KPB/PCB"
 BEL_goal_choose_KPB_desc: "Коммунистическая партия Бельгии добилась успеха в установлении контроля над страной после недавней гражданской войны."
 BEL_goal_integrate_bwp: "Интегрировать БРГ/ПБ"
 BEL_goal_integrate_bwp_desc: "Объединение авангардных и социально-демократических фракций БРГ/ПСД позволит повысить стабильность в стране."
 BEL_goal_economic_planning: "Экономическое планирование"
 BEL_goal_economic_planning_desc: "Запланированная экономика является одним из главных носителей КПБ/ПКН и имеет жизненно важное значение для возрождения экономики страны."
 BEL_goal_worker_universities: "Университеты трудящихся"
 BEL_goal_worker_universities_desc: "Повышение доступности университетов для более низких классов значительно повысит уровень благосостояния и знаний в стране."
 BEL_goal_communist_brigades: "Коммунистические бригады"
 BEL_goal_communist_brigades_desc: "Создание коммунистических бригад повысит статус нашей армии и лояльность солдат правительству."
 BEL_goal_BWP_KP_coalition: "БПР/ПОБ - Коалиция КП/ПК"
 BEL_goal_BWP_KP_coalition_desc: "После последних выборов коалиция католиков и социал-демократов сформировала новое мажоритарное правительство."
 BEL_goal_improve_working_conditions: "Улучшение условий труда"
 BEL_goal_improve_working_conditions_desc: "Улучшение условий труда должно быть приоритетом для этого правительства, которое поклялось служить бельгийскому народу, включая тысячи работников, которые вынуждены каждый день работать в ужасных условиях."
 BEL_goal_subsidize_the_boerenbond_1: "Субсидировать буренбонд"
 BEL_goal_subsidize_the_boerenbond_1_desc: "Буренбонд, католическая организация, представляющая фермеров страны, должна получать субсидии, с тем чтобы они могли продолжать свою хорошую работу."
 BEL_goal_introduce_conge_paye: "Познакомьтесь с Конго Пэйе."
 BEL_goal_introduce_conge_paye_desc: "Благодаря введению оплачиваемых отпусков для наших рабочих классов производительность может возрасти, а потребление бельгийских товаров также должно возрасти."
 BEL_goal_expand_national_industries: "Расширение национальной промышленности"
 BEL_goal_expand_national_industries_desc: "Расширение национальных отраслей, таких, как железнодорожная инфраструктура и энергетическая сеть, значительно повысило бы наш промышленный потенциал."
 BEL_goal_invest_in_education: "Инвестирование в образование"
 BEL_goal_invest_in_education_desc: "Вложение средств в местные школы и крупные университеты страны значительно улучшило бы образование для населения."
 BEL_goal_large_state_investments: "Крупные государственные инвестиции"
 BEL_goal_large_state_investments_desc: "Государство должно взять меры в свои руки и вложить значительные средства в промышленность нашей страны, и это может быть единственным способом урегулирования нынешнего экономического кризиса."
 BEL_goal_KP_LP_PP_coalition: "КП/ПК - ЛП/ПЛ - Коалиция ДП"
 BEL_goal_KP_LP_PP_coalition_desc: "После последних выборов коалиция католиков и либералов сформировала новое мажоритарное правительство."
 BEL_goal_deregulate_industries: "Дерегулирование промышленности"
 BEL_goal_deregulate_industries_desc: "С учетом нынешней нестабильности мировой экономики это может оказаться рискованным, но в конечном итоге оно может оказаться успешным."
 BEL_goal_subsidize_the_boerenbond_2: "Субсидировать буренбонд"
 BEL_goal_subsidize_the_boerenbond_2_desc: "Буренбонд, католическая организация, представляющая фермеров страны, должна получать субсидии, с тем чтобы они могли продолжать свою хорошую работу."
 BEL_goal_encourage_the_middle_class: "Поощрять средний класс"
 BEL_goal_encourage_the_middle_class_desc: "Средний класс является важной частью нашей страны, и правительство должно всячески поощрять частные предприятия."
 BEL_goal_women_suffrage: "Женский костюм"
 BEL_goal_women_suffrage_desc: "В соответствии с обещанием, они предоставят каждой женщине старше 21 года те же права голоса, что и мужчинам, что является важным шагом в нашей истории и сблизит всех бельгийцев."
 BEL_goal_fund_scientific_research: "Фонд научных исследований"
 BEL_goal_fund_scientific_research_desc: "Финансирование научных исследований может оказаться очень полезным для промышленности нашей страны. Чем больше проектов может поддержать правительство, тем больше шансов добиться крупных прорывов. Эти прорывы можно было бы применить в нашей армии или в нашей промышленности."
 BEL_goal_debase_belgian_frank: "Уничтожить бельгийского Фрэнка"
 BEL_goal_debase_belgian_frank_desc: "Лишение бельгийского Фрэнка, нашей национальной валюты, возможно, единственный способ справиться с нынешним экономическим кризисом."
 BEL_goal_royal_coup: "Королевские суп-корпусы"
 BEL_goal_royal_coup_desc: "Кубок короля Леопольда III преуспел, и его кабинет теперь будет работать над будущим Бельгии."
 BEL_goal_politique_des_mains_libres: "&quot; Policy des Mains Libres &quot; ( Политика в отношении основных либрев )"
 BEL_goal_politique_des_mains_libres_desc: "«Политика в отношении основных либре» или «Политика свободных рук» — это политика, в которой Бельгия не принимает никаких сторон на мировой арене, умиротворяя более сильные нации, надеясь, что они оставят нас в покое."
 BEL_goal_armed_neutrality: "Вооруженная нейтральность"
 BEL_goal_armed_neutrality_desc: "Вооруженный нейтралитет - это идея, согласно которой страна должна быть нейтральной в международных конфликтах, но также должна вкладывать значительные средства в свою армию, чтобы защитить себя в случае войны."
 BEL_goal_develop_royal_domains: "Разработать королевские домы"
 BEL_goal_develop_royal_domains_desc: "Король владеет большим количеством земель в Арденнах, которые в настоящее время не используются в местной промышленности."
 BEL_goal_fund_royal_academy: "Фонд Королевская академия"
 BEL_goal_fund_royal_academy_desc: "В настоящее время Королевской академии не хватает средств для надлежащего функционирования."
 BEL_goal_profits_from_congo: "Прибыль из Конго"
 BEL_goal_profits_from_congo_desc: "Король по-прежнему занимает важное место в Бельгийском Конго. Прибыль единственной колонии страны может быть использована для совершенствования промышленности и экономики Бельгии и может помочь в урегулировании нынешнего кризиса."
 BEL_goal_VNV: "VNV Победа"
 BEL_goal_VNV_desc: "Влаамш Национальский Вербонд, или ВНВ, сумел обеспечить премьер-министра в новом правительстве меньшинства, и они, несомненно, приведут Бельгию к конфедерации или даже к независимой Фландрии."
 BEL_goal_vlaamse_wacht: "Создать Влаамсе Вахт"
 BEL_goal_vlaamse_wacht_desc: "Создание верного военизированного охранника под названием Влаамсе Вахт обеспечит успех будущей политики, проводимой правительством."
 BEL_goal_cultural_communities: "Культурные сообщества"
 BEL_goal_cultural_communities_desc: "Определение культурной политики для разделения фламандских и валлонских органов стало бы первым шагом на пути к конфедерации или независимой Фландрии."
 BEL_goal_flemish_independence: "Фламандская независимость"
 BEL_goal_flemish_independence_desc: "Фламандские националисты так долго трудились за независимость, что наконец-то появилась возможность провозгласить независимость и двигаться вперед без франкоговорящих валлонийцев."
 BEL_goal_PB: "Партия Бургиньон Победа"
 BEL_goal_PB_desc: "Партии Бургиньону, или ПБ, удалось обеспечить премьер-министра в новом правительстве меньшинства. &quot; Валькизм Германии &quot; в последние месяцы быстро повысился, вероятно, благодаря его лидеру Леону Дегрелю, который известен своим очень острым языком."
 BEL_goal_purge_opposition: "Оппозиция Судьба"
 BEL_goal_purge_opposition_desc: "Чтобы укрепить позиции Дегрелла в правительстве, другие партии и оппозиция должны быть очищены."
 BEL_goal_burgundian_inheritence: "Бургундская наследственность"
 BEL_goal_burgundian_inheritence_desc: "Белгика - единственный истинный преемник Бургундии, поэтому мы должны забрать наши давно потерянные территории и нашу бургундскую родину на востоке Франции."
 BEL_goal_ultimatum_luxembourg: "Люксембург"
 BEL_goal_ultimatum_luxembourg_desc: "Люксембург является легкой целью и первым пунктом расширения нашей будущей империи, мы должны действовать быстро и потребовать, чтобы они присоединились к нам."
 BEL_goal_ambiorix_legacy: "Наследие Амбиорики"
 BEL_goal_ambiorix_legacy_desc: "Амбриорикс считается первым в длинном списке сильных и храбрых лидеров, которые в прошлом вели бельгаев, кэролингов и бургундцев к славе. Для многих Леон Дегрель - современная Амбиорикса, храбрый Бельгай когда-то боролся с латинцами Рима, сейчас пришло время сражаться с латинцами Франции и еще раз доказать, что Бельгийцы - самые смелые из всех."
 BEL_goal_Verdinaso: "Вердинасо Победа"
 BEL_goal_Verdinaso_desc: "Вердинасо стремится к воссоединению с голландцами, ему удалось стать премьер-министром в новом правительстве меньшинства."
 BEL_goal_nieuwe_marsrichting: "Уничтожить монархию"
 BEL_goal_nieuwe_marsrichting_desc: "С момента рождения Бельгии и до настоящего времени иностранное навязывание, т.е. бельгийская монархия, представляет собой отделение от наших голландских братьев."
 BEL_goal_proclaim_south_dietsland: "Провозглашение Южного Дитленда"
 BEL_goal_proclaim_south_dietsland_desc: "Если мы хотим объединить диетистов, мы должны начать с преобразования Бельгии в Южную Дитленд, и это изменение будет отражать нашу политическую точку зрения и будущее, которого мы хотим для всех диетистов."
 BEL_goal_pacification_of_ghent: "Умиротворение Гента"
 BEL_goal_pacification_of_ghent_desc: "Если мы пригласим голландское правительство в Генте на новый мир, который призывает к объединению наших двух наций, мы сможем объединить всех членов парламента в странах с низким уровнем дохода под единым знаменем."
 BEL_goal_depillarize: "Общество Победитель"
 BEL_goal_depillarize_desc: "Бельгийское общество в значительной степени определяется либеральными, католическими и социал-демократами, и уничтожение этих основ необходимо для будущего успеха наших маргинальных партий."
 BEL_goal_depillarize_PB: "Общество Победитель"
 BEL_goal_depillarize_PB_desc: "Бельгийское общество в значительной степени определяется либеральными, католическими и социал-демократами, и уничтожение этих основ необходимо для будущего успеха наших маргинальных партий."
 BEL_goal_aftermath_london: "Послечерняя среда"
 BEL_goal_aftermath_london_desc: "Бельгия, к сожалению, пострадала от экономического кризиса, который последовал за крахом фондового рынка в Лондоне, и мы должны действовать сейчас, если хотим решить проблемы."
 BEL_goal_expand_iron_rhine: "Строительные проекты"
 BEL_goal_expand_iron_rhine_desc: "Хотя Бельгия мала, она по-прежнему нуждается в развитии инфраструктуры, с тем чтобы мы могли быстрее пересекать свои земли."
 BEL_goal_expand_antwerp_harbour: "Расширить порт Антверпена"
 BEL_goal_expand_antwerp_harbour_desc: "Теперь, когда мы усовершенствовали железные дороги, соединяющие Антверпен с Рейном, настало время модернизировать порт Антверпен до аккомодата с новым притоком товаров."
 BEL_goal_antwerp_oil_refinery: "Антверпен Нефтеперерабатывающие заводы"
 BEL_goal_antwerp_oil_refinery_desc: "Антверпен является идеальным местом для новой и экспериментальной промышленности, связанной с нефтеперерабатывающими заводами."
 BEL_goal_invest_diamond_trade: "Инвестиции в торговлю алмазами"
 BEL_goal_invest_diamond_trade_desc: "Антверпен является крупнейшим центром торговли алмазами в мире, и, возможно, наша страна сможет извлечь из этого больше пользы, чем сейчас."
 BEL_goal_invest_sillon_industriel: "Инвестировать в Силлон Индастриэль"
 BEL_goal_invest_sillon_industriel_desc: "Инвестирование в этот район может оказаться жизненно важным для урегулирования нынешнего кризиса."
 BEL_goal_expand_fn_herstal: "Расширить FN Herstal"
 BEL_goal_expand_fn_herstal_desc: "Расположенный в Льеже, Валлония, FN Herstal является крупнейшим производителем оружия в стране."
 BEL_goal_expand_brussels_industry: "Расширение Брюссельской промышленности"
 BEL_goal_expand_brussels_industry_desc: "Наш капитал имеет мало отраслей промышленности по сравнению с другими промышленными узлами нашей страны, возможно, пришло время подумать о его расширении, чтобы стимулировать местную экономику."
 BEL_goal_solvay_institute: "Найден институт Солвея"
 BEL_goal_solvay_institute_desc: "Институт Солвея, названный в честь Эрнеста Солвея, будет изучать технологии, которые помогут превратить наши фабрики в современные и эффективные производственные дома."
 BEL_goal_reinforce_colonial_government: "Укрепление колониального правительства"
 BEL_goal_reinforce_colonial_government_desc: "Если мы укрепим колониальное правительство и губернатор Конго, Бельгия сможет контролировать больше ресурсов и прибыли в этом районе."
 BEL_goal_more_autonomy: "Грант с большей автономией"
 BEL_goal_more_autonomy_desc: "Предоставление большей автономии бельгийскому Конго принесет пользу как коренным жителям, так и Бельгии, а это означает, что колония может развиваться без использования бельгийских ресурсов."
 BEL_goal_dominer_pour_servir: "Доминатор в Сервире"
 BEL_goal_dominer_pour_servir_desc: "«Доминер за сержантство» или «доминирование в служении» — это идеология губернатора Пьера Рикмана, его преданность бельгийской колонии не только стране, но и ее народу, и все, что он делает, это цивилизовать конголезский народ."
 BEL_goal_expand_conscription: "Расширить публик"
 BEL_goal_expand_conscription_desc: "Расширение местных конголезских гарнизонов, «Силы Публика», практически не способствует поддержанию порядка в колонии."
 BEL_goal_office_transports_coloniaux: "Управление транспорта Колонияу"
 BEL_goal_office_transports_coloniaux_desc: "Управление колониального транспорта улучшит инфраструктуру нашей колонии, облегчив и сделав более доступной эксплуатацию природных ресурсов."
 BEL_goal_resource_extraction: "Добыча ресурсов"
 BEL_goal_resource_extraction_desc: "Финансируя исследования в области добычи ресурсов, доходы Конго резко увеличатся и пойдут на пользу нашим предприятиям дома."
 BEL_goal_tungsten: "Мины вольфрама в Киву"
 BEL_goal_tungsten_desc: "Провинция Киву богата в Вольфрамите, природном ресурсе, используемом для производства вольфрама. Расширение шахт в Киву даст нам доступ к большему вольфраму для наших заводов."
 BEL_goal_copper: "Медные мины в Катанге"
 BEL_goal_copper_desc: "Провинция Катанга богата медью, расширение шахт там даст нам доступ к ценным ресурсам, которые мы можем использовать для производства большего количества стали в этом районе."
 BEL_goal_rubber: "Каучуковые плантации в Экваториальной провинции"
 BEL_goal_rubber_desc: "Экваториальная провинция полна каучуковых плантаций с зловещим прошлым, если мы сосредоточимся на модернизации этих плантаций и научим местных жителей, как использовать современные инструменты, мы можем получить больше каучука для наших заводов и избавиться от жестоких путей нашего прошлого."
 BEL_goal_uranium: "Копирование для урана"
 BEL_goal_uranium_desc: "Провидцы вернулись из Конго с сообщениями о том, что по всей территории Конго распространяется новая руда под названием уран . Выбирая этот материал , мы могли бы использовать его в экспериментальных исследованиях."
 BEL_goal_boma_harbour: "Расширить гавань Бома"
 BEL_goal_boma_harbour_desc: "Расширение и модернизация гавани Бома улучшит наши усилия в нашей колонии."
 BEL_goal_leopoldville_industry: "Индустриализация Леопольдвилля"
 BEL_goal_leopoldville_industry_desc: "Индустриализация города Леопольдвилл даст Конго центр торговли и промышленности и повысит нашу способность модернизировать нашу колонию."
 BEL_goal_educate_heart_of_darkness: "Обучайте сердце тьмы"
 BEL_goal_educate_heart_of_darkness_desc: "Если мы хотим обеспечить светлое будущее нашей колонии, наше правительство должно сосредоточить свое внимание на просвещении конголезских масс."
 BEL_goal_bcsc: "Межконголезское научное сотрудничество Белго"
 BEL_goal_bcsc_desc: "Создание организации, ведущей нашу нацию и ее колонию к научному сотрудничеству, будет во многом способствовать прогрессу, достигнутому в деле модернизации Конго."
 BEL_goal_lessons_great_war: "Бельгийская земельная армия"
 BEL_goal_lessons_great_war_desc: "Изучая Великую войну, мы можем лучше понять войну в наше время и подготовиться к будущим войнам."
 BEL_goal_mobile_defence: "Фонд Минерва"
 BEL_goal_mobile_defence_desc: "Мобильная оборона является ключом к поддержанию линии в будущих оборонительных войнах, и компания по производству автомобилей Минерва могла бы извлечь пользу из финансируемых исследований этих современных чудес."
 BEL_goal_bicycle_divisions: "Отделы велосипедного движения"
 BEL_goal_bicycle_divisions_desc: "В будущих войнах может оказаться полезным возрождение велосипедного разделения, которое мы использовали во время Великой войны."
 BEL_goal_bilingualism: "Двуязычие в армии"
 BEL_goal_bilingualism_desc: "Языковые дивизии проходят через нашу армию слишком долго, пора решить этот вопрос, или наши силы могут оказаться не готовыми к следующей войне, обучение наших солдат, как голландцев, так и французов, не только улучшит коммуникацию в армии, но и сблизит фламандских и валлонских солдат."
 BEL_goal_separate_divisions: "Отдельные фламандские и валлонские отделения"
 BEL_goal_separate_divisions_desc: "Разделение нашей армии на фламандские и валлонские дивизии может быть единственным способом решить языковую пропасть, которая проходит через нашу армию. Фламандские дивизии получат свои приказы на голландском и валлонском дивизиях на французском языке. Центральное командование возьмет на себя задачу написания приказов на обоих языках."
 BEL_goal_defensive_doctrine: "Доктрина защиты"
 BEL_goal_defensive_doctrine_desc: "Если мы будем следовать оборонительной доктрине, то это будет лучший способ победить в будущих войнах, и если враг высохнет на наших крепостях и укрепится линиях, то они окажутся на коленях, что позволит нашей армии в конце концов одержать победу."
 BEL_goal_offensive_doctrine: "Доктрина наступательных действий"
 BEL_goal_offensive_doctrine_desc: "В то время как наша армия может быть небольшой, специализация в атаке может быть одним из способов удивить наших врагов, а наступательная доктрина - это то, что нам нужно, если мы хотим победить наших врагов."
 BEL_goal_prepare_next_war: "Приготовиться к следующей войне"
 BEL_goal_prepare_next_war_desc: "Многие думали, что Великая война была войной, чтобы положить конец всем войнам, но стало ясно, что в Европе вспыхнет новая война."
 BEL_goal_modernize_liege_forts: "Модернизация Liège Fort Welt"
 BEL_goal_modernize_liege_forts_desc: "Во время Великой войны пояс Льежа продержался дольше, чем ожидали немцы, но в конце концов они были слишком стары для современной технологии и войны. Если мы их модернизируем, они могут снова стать жизнеспособным оборонительным поясом вокруг Льежа."
 BEL_goal_fortify_french_border: "Укрепить французскую границу"
 BEL_goal_fortify_french_border_desc: "Укрепление французской границы является следующим шагом в защите нашей страны."
 BEL_goal_fortify_meuse: "Укрепить реку Мёз"
 BEL_goal_fortify_meuse_desc: "Река Мёз — это естественная оборонительная линия против врагов с востока. Размораживание крепостей вдоль западного берега может оказаться полезным, если Германия решит вновь вторгнуться в нашу страну."
 BEL_goal_modernize_antwerp_forts: "Модернизация форт-пояса Антверпена"
 BEL_goal_modernize_antwerp_forts_desc: "Во время Великой войны крепости вокруг Антверпена имели жизненно важное значение для выживания бельгийской армии и позволили им отступить в западно-Фландрии, где они продержались пять лет до окончания войны. Форты были серьезно повреждены и устарели, и модернизация является единственным способом их повторного использования в будущей войне."
 BEL_goal_small_arms: "Фонд FN Herstal Research ( Герстальные исследования )"
 BEL_goal_small_arms_desc: "Инвестирование в более качественное оборудование и более упорядоченное производство имеет жизненно важное значение для бельгийской военной машины, особенно в тех случаях, когда в ней участвуют FN Herstal и наша промышленность может извлечь выгоду из финансируемых исследований."
 BEL_goal_artillery: "Фокус артиллерии"
 BEL_goal_artillery_desc: "Артиллерия - это основа любой хорошей армии. Артиллерия ломается через вражеские линии и открывает путь пехоте для переезда и завершения работы."


 ###AIR
 BEL_Air_Control_Focus: "Центр авиадиспетчерского контроля"
 BEL_Air_Control_Focus_desc: "Бельгия - это маленькая нация, и, по всей вероятности, ВВС Германии и Франции разрушат наши, и поэтому нам нужно установить наши военно-воздушные силы на основе поддержания контроля над нашим небом, с тем чтобы наши люди на земле были в безопасности для ведения боевых действий."
 BEL_Renard_Fighter_Program: "Модернизация истребителей"
 BEL_Renard_Fighter_Program_desc: "Наш истребительский флот, к сожалению, устарел и недооценивается, и в ходе следующей войны он не сможет добиться успеха, если не будут приняты незамедлительные меры для решения стоящих перед ним проблем."
 BEL_Royal_Air_Academy: "Королевская авиационная академия"
 BEL_Royal_Air_Academy_desc: "Наша способность обезопасить свое небо может быть укреплена за счет затрат времени и усилий на изучение доктрин, которые помогут нам сделать это лучше."
 BEL_SABCA_Bombers: "Бельгийские бомбардировщики"
 BEL_SABCA_Bombers_desc: "Охраняемые небеса позволят нам совершать маневры в их небеса."
 BEL_Foreign_Procurement: "Закупки воздушного транспорта за рубежом"
 BEL_Foreign_Procurement_desc: "Несмотря на то, что наша промышленная деятельность может расти с каждым днем, она просто не достаточно велика для создания большого авиапарка, поэтому иностранные контракты на закупки и строительство позволят нам высадить флот, который намного превышает наши промышленные мощности, и сделать это своевременно."
 BEL_AA_Fortifications: "Противовоздушное строительство"
 BEL_AA_Fortifications_desc: "Самолёты - это не единственное, что убережет наши небеса от врагов. храбрые люди на земле, стреляющие по захватчикам с зенитных установок, защитят наши красивые города и города от вреда."
 BEL_RADAR_Stations: "Технология RADAR"
 BEL_RADAR_Stations_desc: "Инвестиции в новые технологии раннего предупреждения и обнаружения летательных аппаратов позволят нашим пилотам легче работать, увеличить время реагирования и улучшить координацию наших наземных и воздушных сил."
 BEL_Eastern_Air_Bases: "Северо-западные и юго-восточные базы"
 BEL_Eastern_Air_Bases_desc: "Создание и расширение военно-воздушных баз в этих регионах позволит нам более эффективно реагировать на эти возможности и направлять самолеты в миссии на их территорию."
 BEL_Air_Support_Focus: "Фокус авиационной поддержки"
 BEL_Air_Support_Focus_desc: "Полевые самолеты для поддержки наших людей на земле позволят нам проецировать относительно небольшие размеры наших сухопутных сил намного дальше, тогда они бы в противном случае стали."
 BEL_CAS_Support: "Закрытое исследование поддержки воздушного движения"
 BEL_CAS_Support_desc: "Нам не хватает современных конструкций для самолётов с близкой воздушной поддержкой, и мы должны приступить к разработке планов для наших собственных самолётов, с тем чтобы мы могли применять эту доктрину наземной поддержки."
 BEL_Ground_Support: "Воздух-земля"
 BEL_Ground_Support_desc: "Исследования доктрин поддержки наших людей на поле боя позволят нашим самолетам КАС более эффективно наносить удары по нашим врагам, спасая от пуль и крови наших людей."
 BEL_Coast_Patrol: "Северное морское патрулирование"
 BEL_Coast_Patrol_desc: "Легко забыть, что наши единственные угрозы — это не только Германия и Франция. Существует огромное море на нашем Севере, через которое различные державы, в том числе два вышеупомянутых, могут приземлиться и полностью подорвать любые оборонительные усилия, предпринимаемые нашими сухопутными силами."

 ###NAVY
 BEL_goal_belgian_navy: "Бельгийский военно-морский компонент"
 BEL_goal_belgian_navy_desc: "Хотя наши угрозы основаны главным образом на земле, наша военно-морская сила по-прежнему является незаменимой, она защищает огромные ресурсы, поступающие из бельгийского Конго, защищает наши берега от попыток напасть на нашу сухопутную армию и позволяет нам сохранять глобальное присутствие, однако в последние годы она отстаёт, устаревает и недооценивается по сравнению с другими державами, мы должны изменить это положение и превратить его в гордость Бельгии!"
 BEL_goal_belgian_navy: "Бельгийский военно-морский компонент" BEL_goal_belgian_navy_desc: "While our threats are primarily land based, our naval arm remains indispensable. It protects the vast resources coming from the Belgian Congo, defends our shores from attempts to attack behind our land army, and allows us to maintain a global presence. However, in recent years it has fallen behind, becoming outdated and undersized relative to other powers. We must amend this, and turn it into the pride of Belgium!"

 BEL_Cruiser_Effort: "Современные круизеры" 
 BEL_Cruiser_Effort_desc: "Современный флот не может состоять исключительно из прибрежных патрульных катеров, чтобы защитить наши жизненно важные торговые пути в Конго и проецировать мощность за пределами канала, нам нужны корабли с радиусом действия, огневой мощью и выносливостью. Крузеры являются основой такого флота, способные охотиться на вражеских налетчиков, разведать главный флот и показывать флаг в отдаленных водах. Эти усилия поставят наши верфь на исследование и строительство новых современных корпусов крейсеров, придавая нашему флоту поистине глобальный охват."

 BEL_Navy_Doctrine_Modernisation: "Модернизация доктрины" 
 BEL_Navy_Doctrine_Modernisation_desc: "Великая война доказала, что военно-морские войны — это сложная, трехмерная шахматная игра по выявлению, тактике конвоирования и перехвату подводных лодок. Мы должны послать наших лучших офицеров для изучения доктрин великих военно-морских держав, будь то британский Королевский флот или немецкий флот открытого моря."

 BEL_Congo_Ports: "Конголезские порты" 
 BEL_Congo_Ports_desc: "Бельгийское Конго является экономическим центром нашей империи, однако его морская линия жизни опасно хрупка, порты Матади и Бома развиты, не имея средств для обслуживания, ремонта или перезарядки современного военного флота, вражеская блокада или небольшой рейд могут разорвать нашу связь с этим богатством, мы должны незамедлительно приступить к осуществлению широкомасштабной программы развития инфраструктуры для разлива глубоководных каналов, строительства укрепленных причалов и строительства обширных топливных складов."

 BEL_grand_fleet: "Большой флот" 
 BEL_grand_fleet_desc: "Если мы хотим, чтобы Бельгия воспринималась всерьез как суверенная держава, то одних лишь сил береговой обороны недостаточно. Мы должны взять на себя окончательное национальное обязательство и создать «Большой флот», сконцентрированный на столицах судов. Флот, даже малый по британским или японским стандартам, коренным образом изменил бы стратегический баланс в Северном море, вынудил бы любого агрессора наложить значительные военно-морские силы, чтобы сдержать нас, гарантировать наш морской суверенитет и объявить миру, что Бельгия больше не является пешкой в играх более могущественных держав."

 BEL_recognising_our_capability: "Признание нашей способности" 
 BEL_recognising_our_capability_desc: "Наши военно-морские амбиции часто отвергаются мировыми морскими державами, которые рассматривают нас как нацию земледельцев. Они забывают наши гордые морские традиции и промышленную мощь Антверпена и Валлонии. Это национальный проект, направленный на признание и полное использование нашего истинного военно-морского потенциала."

 BEL_Modernise_Destroyers: "Современные разрушители" 
 BEL_Modernise_Destroyers_desc: "Эти корабли необходимы для проверки наших ценных крейсеров, охоты на подводные лодки, которые угрожают нашей торговле в Конго, и патрулирования наших береговых подходов. Наша нынешняя эсминская флотилия стареет, состоящая из устаревших планов Великой войны. Мы немедленно начнем разработку и производство нового стандартного класса современных эсминцев, оснащенных более совершенными двигателями, сонарными устройствами и оружием двойного назначения, способными противостоять как подводным, так и воздушным угрозам."

 BEL_Modernise_Flemish_Naval_Base: "Фламандские военно-морские базы" 
 BEL_Modernise_Flemish_Naval_Base_desc: "Наши основные военно-морские объекты в Антверпене и Зеброгге являются реликвиями новой эпохи, слишком малыми и слишком уязвимыми для современного, расширяющегося флота. Мы должны вкладывать значительные средства в расширение и укрепление этих баз, строительство более крупных сухогрузных ручек, бомбоустойчивых подводных ручек и расширение запасов топлива и боеприпасов. Безопасная военно-морская база на фламандском побережье является первым и самым важным шагом на пути к поддержке военно-морского флота с голубой водой."

 BEL_Battleship_Research: "Исследования в области боевых действий" 

 BEL_Battleship_Research_desc: "Бельгия никогда не создавала, не говоря уже о строительстве современного боевого корабля, нашим архитекторам в военно-морском флоте не хватает опыта, и нашим верфям не хватает средств для выполнения такой грандиозной задачи. Чтобы построить «Большой флот», мы должны сначала приобрести знания. Эта программа либо отправит наших лучших инженеров учиться у дружественных сил, либо профинансироват масштабную инициативу по проведению внутренних исследований, чтобы преодолеть огромные технические трудности, связанные с проектированием капитальных судов — от тяжёлых бронежилетных плит и систем пожаротушения до массивных турбинных двигателей. Прежде чем мы сможем установить киль, мы должны сначала научиться тому, как."

 BEL_Submarine_Support: "Дизайн подводные лодки" 
 BEL_Submarine_Support_desc: "Однако подводные лодки предлагают мощное, ассиметричное преимущество. Современные подводные лодки могут лишить нашего побережья любого противника, независимо от их размера. Это оружие недорогого флота, способное потопить боевые корабли и удушать торговлю за небольшую цену. Мы будем вкладывать значительные средства в новые проекты U-шлюп, сосредотачивая внимание на лодках дальнего радиуса действия для коммерческого рейда в Атлантике и на небольших, скрытых прибрежных подлодках для защиты Английского канала."

 BEL_Naval_Officer_Academy: "Фонд Морской академии Антверпена" 
 BEL_Naval_Officer_Academy_desc: "Корабли - это всего лишь стальные корпуса; именно офицеры, которые командуют ими, обеспечивают свою истинную силу. Наша нынешняя военно-морская академия является небольшим, недофинансируемым компонентом более широкой военной структуры. Для руководства современным, технически развитым флотом нам нужен специализированный институт, способный производить самых образованных капитанов, мореплавателей и инженеров в мире. Мы будем расширять и финансировать Антверпенскую морскую академию, придавая ей новый престиж и мандат для подготовки будущих адмиралов бельгийского ВМС."

 BEL_Shipbuilding_Investments: "Инвестиции в судостроение" 
 BEL_Shipbuilding_Investments_desc: "Наша страна обладает значительными промышленными навыками, но наши верфи ориентированы в первую очередь на гражданские торговые суда и речные баржи, а не на сложные современные военные корабли. Для строительства крейсеров, эсминцев и, возможно, даже боевых кораблей разумными темпами мы должны предоставить крупные государственные инвестиции в судостроительный сектор, что означает расширение промежутков в Антверпене, модернизацию верфей Кокерилла и субсидирование стальных пластин и турбинных предприятий. Морской флот построен не только на море, он выкован на фабриках и верфях родины."

 #####Events#####
 bellaststand.1.d: "Снова случился кошмар, германские ботинки идут по нашей земле, чтобы забрать нашу свободу, но мы не позволим им, они будут истекать кровью за каждый дюйм земли!"

 #Domestic Politics Events
 bel.1.t: "Бельгия после Великой войны"
 bel.1.d: "В 1914 году Германия вторглась в Бельгию, игнорируя ее нейтралитет и отталкивая Соединенное Королевство от войны на стороне Энтекте. Бельгийские войска были быстро захвачены, но смогли закрепиться за рекой Исер. В оккупированной Бельгии немцы проводили политику в отношении фламандских националистов и по существу уступали их требованиям. В свободной Бельгии король Альберт вел свои войска за линию фронта. После окончания войны несколько раз это придавало ему импульс популярности. В 1920 году бельгийские дипломаты, несмотря на поддержку Великобритании, не смогли обеспечить суверенитет над Люксембургом из-за того, что французские противники этого плана, вместо того чтобы получить право на размещение там своих войск, имели право на немцев. В 1919 году король провел встречу с бельгийскими политиками, которые остались позади в оккупированной Бельгии, и обсудил вопрос о том, что в последнее время бельгийские дипломаты, несмотря на их поддержку со стороны Великобритании, не смогли обеспечить суверенитет над Люксембургом из-за того, что они были решительно настроены против этого плана."
 bel.1.a: "Бельгийский лев стоит сильным!"
 bel.2.t: "Король Альберт погиб в несчастном случае."
 bel.2.d: "В 2 часа ночи 18 февраля тело короля Альберта было найдено у подножия скалы в Марше-Лес-Дамсе (Намур)."
 bel.2.a: "Да здравствует король Леопольд III!"
 bel.3.t: "Королева Астрид погибла в подозрительной аварии"
 bel.3.d: "После смерти короля Альберта всего лишь месяц назад Бельгия и королевская семья вновь пострадали от катастрофы. Леопольд III и его жена Астрид были причастны к автокатастрофе в Арденне в начале этого дня. Леопольд пережил аварию, но его жена погибла на его руках. Полицейские прибежали к месту происшествия и обнаружили некоторые элементы, которые могут стать причиной аварии. Леопольд III в ярости и решительно настроен найти виновного, независимо от того, какова будет цена."
 bel.3.a: "Начни расследование по делу."
 bel.4.t: "Позвонить Криджсвету, чтобы помочь расследованию?"
 bel.4.d: "Если бы парламент принял Кригсвет, военные взяли бы на себя расследование смерти королевы Астрид, что повысило бы шансы поймать преступника, но это означало бы, что он, вероятно, не получит справедливого судебного разбирательства."
 bel.4.a: "Кригсвет проходит в парламенте, делает все, чтобы поймать убийцу."
 bel.4.b: "Законопроект провалился, справедливое судебное разбирательство слишком важно."
 bel.5.t: "Убийца пойман."
 bel.5.d: "С принятием Кригсвета военные быстро взяли дело королевы Астрид, используя все свои ресурсы, они смогли найти виновного, после двух дней охоты они поймали мужчину среднего возраста как раз перед тем, как он смог пересечься с Люксембургом, у него были связи с местной коммунистической ячейкой, и теперь он, вероятно, рассеется где-нибудь в темной тюремной камере."
 bel.5.a: "Эти проклятые анархисты!"
 bel.6.t: "Расследование зашло в тупик"
 bel.6.d: "Расследование подозрительной смерти королевы Астрид зашло в тупик. Король Леопольд III разочарован тем, что Криджсвет не прошёл. Если бы это произошло, убийца был бы пойман. Напряженность между Леопольдом III и правительством сейчас растет. По всей стране все больше и больше людей выражают сочувствие королю."
 bel.6.a: "Народ вступает в состояние скорби."
 bel.7.t: "Результаты выборов"
 bel.7.d: "Только что пришли результаты последних выборов. Теперь король Леопольд III должен сформировать правительство большинства на основе нового состава парламента. Следующее правительство определит будущее страны на следующие четыре года, так что выбор короля имеет огромное значение."
 bel.7.a: "Король отказывается сформировать правительство!"
 bel.7.b: "Король начинает переговоры."
 bel.8.t: "Беспокойство в Валлонии!"
 bel.8.d: "Решение короля не сформировать правительство, в основе которого лежит его разочарование случаем смерти его жены, стало главной причиной беспорядков в Валлонии. Люди идут на забастовку, а в некоторых местах они даже нападают на полицейские силы. Это пришло к тому моменту, когда гражданская война является вполне реальной возможностью. Сообщения о том, что коммунистические клетки берут оружие, уже поступают, а армия находится в состоянии повышенной готовности."
 bel.8.a: "Уничтожить их мелкое восстание!"
 bel.8.b: "Вив ла революция ( Плей как коммунисты )"
 bel.8.c: "Парламент снимает с себя Леопольда III и объявляет Республику до начала войны."
 bel.9.t: "Какая коалиция должна возглавлять правительство?"
 bel.9.d: "Результаты последних выборов были двусмысленными, три традиционные партии утратили некоторую популярность, и крайне левые и правые партии набирают силу, в результате чего переговоры о создании коалиции заняли гораздо больше времени, чем ожидалось, но наконец-то закончились. Новый премьер-министр вскоре займет позицию в парламенте и объявит новое правительство."
 bel.9.a: "Коалиция католиков и социал-демократов возглавит правительство"
 bel.9.b: "Коалиция католиков, либералов рынка и социальных либералов возглавит правительство"
 bel.9.c: "Другие коалиции потерпели неудачу, и ультраправые возглавят правительство меньшинства."
 bel.10.t: "Кто станет премьер-министром?"
 bel.10.d: "В новом католическо-социально-демократическом правительстве кто-то должен взять на себя роль премьер-министра."
 bel.10.a: "Социальная демократия должна быть ПМ"
 bel.10.b: "Католический должен быть ПМ"
 bel.11.t: "Кто станет премьер-министром?"
 bel.11.d: "В новом католическо-маркетском либерально-социальном правительстве кто-то должен взять на себя роль премьер-министра. Католики уже поддержали либеральный режим, и единственный вопрос заключается в том, должен ли он быть рыночным либералом от ЛП/ПЛ или социальным либералом от ДП."
 bel.11.a: "Рыночная либеральность должна быть ПМ"
 bel.11.b: "Социальная либералка должна быть ПМ"
 bel.12.t: "Кто станет премьер-министром?"
 bel.12.d: "С принятием крайне правого правительства после недавних выборов, это удивительно, что они даже смогли сформировать коалицию, поскольку сейчас они обсуждают, кто должен быть премьер-министром."
 bel.12.a: "Стаф де Клерк (VNV) должен быть ТЧ"
 bel.12.b: "Джорис ван Резан (Вердинасо) должен быть ТЧ"
 bel.12.c: "Леон Дегрель (PB) должен быть ТЧ"
 bel.13.t: "Король Леопольд просит премьер-министра дать объяснение"
 bel.13.d: "После того, как расследование смерти жены закончилось тупиком, король хотел бы получить от премьер-министра Пола ван Зиланда объяснение, основной жалобой Леопольда является отказ Кригсвета в парламенте, поскольку он уже раскрыл бы тайну, если бы военные взяли дело в свои руки, однако Пол ван Зиланд отказывается дать какие-либо объяснения, поскольку информация о смерти королевы Астрид является конфиденциальной."
 bel.13.a: "Кем он себя возомнил?"
 bel.14.t: "Валькистский манифест"
 bel.14.d: "Недавно опубликованная статья Леона Дегреля вызвала в последнее время некоторые споры. В этой статье Дегрель описывает Бельгию как перекрестную точку между германской и романской культурой в том, что он называет «Пакс Бельгика», в мирном сосуществовании обеих культур. Он утверждает, что «Пакс Бельгика» был тем, что несколько раз в истории делало регион столь успешным. Он использует пример Великой империи Чарлмагне и Герцогства Бургундия, обоих могущественных наций Средней Атгии. ~n no Léon Degrelle затем рассказал о своих планах принять участие в предстоящих выборах вместе со своей новой партией — Партией Бургиньон. Его программа состоит из того, что лучше всего можно назвать «Валькизмом». Он заявляет о своей сильной неприязни к монархисти, поскольку на протяжении веков она была инструментом, используемым иностранными державами и католической церковью для спровоцирования немецкого и романского народа Бельгии. Degrelle далее описывает прогрессивную политику, которую он будет стремиться осуществить, если его партия будет избрана."
 bel.14.a: "Дай ему сказать, давить его будет только еще больше неприятностей."
 bel.14.b: "Запретить распространять статью дальше, позволить ему говорить - это лишь еще больше неприятностей."
 bel.15.t: "&quot; Ультиматум &quot; из Бельгии"
 bel.15.d: "Бельгия направила нам ультиматум с требованием аннексии Люксембурга в Бельгию; Люксембург участвовал в бельгийской революции 1830 года и был частью страны до заключения Лондонского договора в 1839 году, когда он стал независимым Великого Герцогства; в последующие годы Бельгия считала Люксембург потерянной территорией; после Великой войны Бельгия попыталась пересмотреть статус Договора 1839 года, включая статус Люксембурга; однако из-за того, что Бельгия получила голландскую территорию, Люксембург остался в одиночестве; после того, как валькист вступил в должность в Бельгии, усилились новые голоса, в которых говорилось об аннексии Люксембурга."
 bel.15.a: "Присоединяйтесь к нашим бельгийским братьям"
 bel.15.b: "Откажись присоединиться к ним."
 bel.16.t: "Черная среда поражает Бельгию"
 bel.16.d: "После краха фондового рынка, произошедшего несколько дней назад в Лондоне, наша экономика также испытывает на себе последствия Черной среды. Наша экономика в значительной степени зависит от торговли в Северном море и от инвестиций как Великобритании, так и Франции. Это еще один пример того, как крупные державы втягивают малые страны в их беспорядок."
 bel.16.a: "Боже мой!"
 bel.17.t: "Люксембург принимает наши требования"
 bel.17.d: "Люксембург согласился на аннексию Бельгии, правительство этой маленькой страны изучило ее тесные связи с Бельгией и политическую ситуацию в Европе и осознало, что безопасность ее народа может быть гарантирована только более широкой и сильной страной, такой, как Бельгия. С 1839 года бельгийские политики мечтают о возвращении Люксембурга в Бельгию, и теперь эта мечта сбылась."
 bel.17.a: "Эндрахт Маакт - свершившаяся сила - Единство дает силу"
 bel.18.t: "Люксембург отказывается от наших требований"
 bel.18.d: "Люксембург отказался присоединиться к нашей стране, мы готовы к войне с нашим маленьким соседом, что бы ни думали люксембургцы о ультиматуме, они присоединятся к нам либо мирно, либо силой, они были настолько глупы, что думали, что могут отказать нам в наших законных притязаниях."
 bel.18.a: "Значит, это война."
 bel.19.t: "Март в Брюсселе"
 bel.19.d: "Сегодня в Брюсселе собралось большое число людей, протестующих против недавнего введения в действие Кригсвета, большинство из которых идентифицируют себя с новым валькистским движением Леона Дегреля и называют себя бургиньонами, однако здесь присутствуют и некоторые фламандские националистические движения, и вопрос состоит в том, каков их мотив и как должны реагировать городские чиновники."
 bel.19.a: "Разогнать толпу силой!"
 bel.19.b: "Пусть протестуют мирно."
 bel.20.t: "Расследование в отношении ТЧ"
 bel.20.d: "Король публично попросил провести расследование финансов премьер-министра Пола ван Зиланда. но вопрос о том, кто возглавит комиссию, остается открытым."
 bel.20.a: "Хендрик де Мэн возглавит расследование"
 bel.20.b: "Пол Хайманс возглавит расследование"
 bel.21.t: "Каков наш следующий шаг?"
 bel.21.d: "Каков должен быть наш следующий шаг в расследовании дела Пола ван Зиланд? Правительство хочет, чтобы это было сделано быстро и оказало большое давление на судей, участвующих в этом деле. Весьма вероятно, что Комиссия получит только один судебный запрос. Теперь вопрос заключается в том, следует ли проводить обыск дома в доме премьер-министра или если изучение его финансовой документации даст больше результатов."
 bel.21.a: "Запрашиваю ордер на обыск дома"
 bel.21.b: "Взгляните на его финансовые записи."
 bel.22.t: "Расследование зашло в тупик."
 bel.22.d: "Расследование зашло в тупик, и должностные лица по борьбе с беспорядками, а также члены парламента хотели бы, чтобы расследование завершилось как можно скорее, в результате чего Комиссия была распущена, а Пол ван Зиланд остался нетронутым."
 bel.22.a: "Ему повезло!"
 bel.23.t: "ПМ замешан в скандале!"
 bel.23.d: "Недавний опрос по финансовому делу Поверенного в делах премьер-министра Пола ван Зиланда показал, что ван Зиланд регулярно получает деньги от Национального банка."
 bel.23.a: "Бедный Пол, он заслужил это."
 bel.24.t: "Дегрель зовет ван Зиланд."
 bel.24.d: "После недавнего скандала с участием премьер-министра Пола ван Зиленда Леон Дегрель объявил о действиях премьер-министра в своей публичной речи."
 bel.24.a: "У Дегрелла, конечно, есть особый способ убедиться, что он слышал."
 bel.25.t: "Приглашение в Гент"
 bel.25.d: "Бельгийское правительство направило нам приглашение в Гент обсудить объединение наших двух государств в одно большее государство, называемое Дитсленд, конечно же, их идеи безумны и могут привести к многочисленным проблемам, хотя некоторые люди в нашей стране хотели бы объединиться, мы, как правительство, не можем уступить этим абсурдным идеям и требованиям."
 bel.25.a: "Пожалуйста, отклоните приглашение."
 bel.26.t: "Датч отказался!"
 bel.26.d: "Голландцы отклонили наше предложение подписать миротворчество Гента и объединить Дитсленд в одну нацию. Это возмутительно, но мы были готовы к этой демонстрации. Все Нидерланды, преданные сторонники дела Вердинасо, готовятся свергнуть правительство принца Бернхарда. Эти секретные агенты попытаются убить Бернхарда и создать новое правительство, которое будет стремиться объединиться с нами в большую нацию."
 bel.26.a: "Если Бернхард не поддержит нас, мы должны избавиться от него."
 bel.27.t: "Бельгийская полоса открыта!"
 bel.27.d: "Наша секретная служба обнаружила бельгийский заговор с целью свержения нашего правительства и убийства принца Бернхарда в попытке поставить Вердинасо во главе нашей нации. Этот бельгийский заговор является еще одним примером растущей опасности, которую представляют наши южные соседи для нидерландского государства и принца Бернхарда. К счастью для нас, мы обнаружили большинство заговорщиков и наши полицейские силы уже в пути к устранению этой угрозы."
 bel.27.a: "Эти чертовы вафли, давай преподадим им урок!"
 bel.28.t: "Наша попытка переворота провалилась!"
 bel.28.d: "Наша попытка создать лояльное правительство в Нидерландах провалилась. Голландцы готовятся к войне, и мы должны. Мы должны нанести им удар до того, как они нападут на нас. Если они не хотят мирно объединить Дитсленд, то мы должны сделать это путем войны!"
 bel.28.a: "Давай преподадим этим забиякам урок!"
 bel.29.t: "Конец Бельгии!"
 bel.29.d: "ВНВ успешно положил конец Бельгии, дав Бельгии все больше и больше федеративных характеристик, страна практически прекратила свое существование."
 bel.29.a: "Играй как Фландрии"
 bel.29.b: "Играй как Валлония"
 bel.30.t: "Конголезская автономия"
 bel.30.d: "Бельгийское правительство решило предоставить Бельгийскому Конго больше автономии, и благодаря региональной независимости наша колония может внести больший вклад в благосостояние и научные знания Бельгии."
 bel.30.a: "Продолжайте играть как Бельгия"
 bel.30.b: "Сыграем в Бельгийском Конго"
 bel.31.t: "Хендрик Де Ман берет на себя контроль"
 bel.31.d: "Хендрик де Мэн взял под свой контроль Бельгию. в надежде стабилизировать Бельгию."
 bel.31.a: "У Де Мана есть план!"
 bel.32.t: "Коллекционисты остаются под контролем"
 bel.32.d: "Несмотря на победу в революции, они принесут мир и процветание народам Фландрии и Валлонии."
 bel.32.a: "Да здравствует революция!"

 #Foreign Events
 belgiumforeign.1.d: "После шоковой победы на выборах валькистское движение Бельгии, возглавляемое Леоном Дегрелем, управляло Бельгией и стремилось к созданию альянса. Дегрелль заявила, что национальная мечта его страны -- это создание обширного Бургундского государства, вырезанного с востока Франции, бегущего из Руэна в Лион. Бельгийцы заявили о своей готовности принять территориальные уступки германских населенных территорий нашему Рейху, но настаивают на том, что в случае поражения Франции они получат свои бургундские притязания. Ничего соглашение было бы весьма полезным для нас, так как оно отвергло бы необходимость совершения еще одного нападения в стиле Шлиффена через Бельгию и позволило бы нам развернуть наши силы на относительно необузданной части французской границы. Однако уничтожит все надежды на объединение с голландией стороной из-зах , и , , , , , , , , , , , , , ,"
 belgiumforeign.2.d: "Немцы приняли наше предложение о союзе, но наше вступление в Штальпакт до сих пор не ратифицировано. Они прислали нам свои территориальные условия для такого союза, и мы должны пересмотреть их и проверить, приемлемы ли они. Если мы это сделаем, то они станут тайным соглашением между нами и Германией, и после будущего поражения Франции будут осуществлены экстерриториальные изменения. Однако мы, возможно, найдем эти условия слишком жесткими и предпочтем их отклонить, что приведет к краху нашей петиции о присоединении к Штальпакту."
 belgiumforeign.3.d: "Немцы категорически отказались от нашего предложения о союзе, и никакого соглашения не было достигнуто."
 belgiumforeign.4.d: "Это их безрассудство, ибо теперь они уже не будут в безопасности от немецкой военной машины, когда начнется война."
 belgiumforeign.5.d: "Соответствующие документы были подписаны и скрыты с точки зрения мира, наше тайное соглашение с бельгийскими странами подписано и готово к принятию практических мер, в то время как бельгийские и немецкие страны публично отмечают этот шаг в европейском братстве, тем временем французские поспешные попытки разработать планы возможного немецкого вторжения из Бельгии, хорошо зная, что их северный фланг уже не в безопасности, мы на шаг ближе к победе."
 belgiumforeign.6.d: "После шоковой победы на выборах валькистское движение Бельгии, возглавляемое Леоном Дегрелем, управляло Бельгией и стремилось к созданию альянса. Дегрелль заявила, что национальная мечта его страны -- это создание обширного Бургундского государства, вырезанного с востока Франции, бегущего из Руэна в Лион. Бельгийцы заявили о своей готовности принять территориальные уступки германских населенных территорий нашему Рейху, но настаивают на том, что в случае поражения Франции они получат свои бургундские притязания. Ничего соглашение было бы весьма полезным для нас, так как оно отвергло бы необходимость совершения еще одного нападения в стиле Шлиффена через Бельгию и позволило бы нам развернуть наши силы на относительно необузданной части французской границы. Однако уничтожит все надежды на объединение с голландией стороной из-зах , и , , , , , , , , , , , , , ,"
 belgiumforeign.7.d: "Весьма странно, что бельгийцы избрали правительство, которое теперь утверждает, что является южного голландского государства, которое теперь обращается к нам с просьбой о нидерландском единстве между нашими двумя нациями."
 belgiumforeign.8.d: "Несмотря на то, что это большая цена, особенно после нашей недавней отмены бельгийской монархии, это может принести пользу в том, что мы придадим нам легитимность в качестве голландской нации на международном уровне и в то же время дадим нам монарха с очень малой властью, которая нам должна, потенциально расширив наш политический контроль, мы также, очевидно, выиграем все голландские экзилии, которые должны будут предложить свои богатые территории в Индии, свой флот и небольшую армию."
 belgiumforeign.9.d: "Нидерландские выходцы из Суринама согласились, и мы можем продолжить аннексию."
 belgiumforeign.10.d: ""
 belgiumforeign.11.d: "После шоковой победы на выборах прогерманское правительство управляло Бельгией и обратилось к нам за альянсом. Бельгийцы заявили, что они готовы принять территориальные уступки германских населенных территорий нашему Рейху, но настаивают на том, что в случае поражения Франции они получат свои претензии. nn-Such соглашение будет очень полезным для нас, поскольку оно откажется от необходимости совершения еще одного нападения в стиле Шлиффена через Бельгию и позволит нам развернуть наши силы на относительно незащищенной части французской границы. Однако это уничтожит все надежды на союз с голландцами из-за их враждебности к бельгийским гражданам и может нанести ущерб нашим отношениям с будущим правительством по сотрудничеству во Франции. nn-три плана территориальных уступок были разработаны в надежде на то, что будет заключено тайное соглашение о территориальном обмене, которое будет реализовано в случае поражения Франции. Однако мы должны сначала выбрать и спланировать и передать его бельгийским гражданам. Если мы примем их предложение о сотрудничестве, конечно, то есть, если мы примем их предложение о союзе."
 belgiumforeign.12.d: "Немцы приняли наше предложение о союзе, но наше вступление в Штальпакт до сих пор не ратифицировано. Они прислали нам свои территориальные условия для такого союза, и мы должны пересмотреть их и проверить, приемлемы ли они. Если мы это сделаем, то они станут тайным соглашением между нами и Германией, и после будущего поражения Франции будут осуществлены экстерриториальные изменения. Однако мы, возможно, найдем эти условия слишком жесткими и предпочтем их отклонить, что приведет к краху нашей петиции о присоединении к Штальпакту."
 belgiumforeign.13.d: "К сожалению, немцы отклонили нашу просьбу о присоединении к [От имени Гетфайшн Найм], мы можем предположить, что это лишь означает напасть на нас в будущем, мы должны стремиться к альтернативным союзам или объявить нейтралитет и наращивать наши силы, чтобы они не осмелились угрожать нам."
 belgiumforeign.14.d: "Это их безрассудство, ибо теперь они уже не будут в безопасности от немецкой военной машины, когда начнется война."
 belgiumforeign.15.d: "Соответствующие документы были подписаны и скрыты с точки зрения мира, наше тайное соглашение с бельгийскими странами подписано и готово к принятию практических мер, в то время как бельгийские и немецкие страны публично отмечают этот шаг в европейском братстве, тем временем французские поспешные попытки разработать планы возможного немецкого вторжения из Бельгии, хорошо зная, что их северный фланг уже не в безопасности, мы на шаг ближе к победе."
 belgiumforeign.16.d: ""
 belgiumforeign.17.d: "Новое бельгийское правительство, провозгласившее себя представителем народов южного диета в стране, которую они называют Южной Дитленд, пригласило наше правительство принять участие в конференции в Генте."
 belgiumforeign.18.d: ""
 belgiumforeign.19.d: ""
 belgiumforeign.20.d: ""
 belgiumforeign.21.d: ""
 belgiumforeign.22.d: "Голландская делегация приняла приглашение в Гент, и сейчас начинается конференция по унификации диетленда. Две присутствующие стороны предложили два разных видения для новой Диталенда. Голландская делегация заявила, что столица будет, естественно, находиться в Амстердаме, исторически в центре голландской нации, и заявила, что нынешний регент голландского государства Бернхард будет продолжать занимать эту должность в качестве главы государства Единой Дитсленда. Однако наша делегация предложила, чтобы ваншарен оставался главой республики, а столица этой новой диетленда является географическим центром Дитленда и перекрестком между ее французской и голландской речами, Брюссель. Если мы примем предложение Нидерландов, то они будут гораздо более склонны принять союз, однако мы можем считать, что наша рука будет навязчива, используя наши предложения, стоить риска того, чтобы вывести из этого вопроса мирный союз."
 belgiumforeign.23.d: "Делегация Южного Парламента издала условия для объединения, требуя, чтобы их ваншарон продолжал быть главой государства, с Брюссельом как столицей этого нового союза. Многие в нашем правительстве протестуют и называют это возмутительным – чуть больше, чем бельгийское правление над нищими странами. Другие по-прежнему более оптимистичны, заявляя, что ваншарон и его Вердинасо страстные члены парламента и были бы идеально настроены на продвижение вперед профсоюза, в то время как Брюссель как столица обеспечит, чтобы 1830 не произошло дважды. В любом случае, мы должны принять окончательное решение."
 belgiumforeign.24.d: "Делегация Южного Парламента согласилась с нашими условиями объединения, приняв нашего регента Бернхарда в качестве главы государства с Амстердамом в качестве столицы этого нового союза, хотя это, безусловно, победа для наших дипломатов, многие по-прежнему жалуются, что такой союз не полностью соответствует нашим условиям и что мы должны полностью игнорировать правительство Вердинасо и Южного Парламента. В любом случае, мы должны принять окончательное решение."
 belgiumforeign.25.d: "Окончательные соглашения были заключены, а соответствующая документация была подписана, и теперь на сцене Европы появляется новая нация – Дитсленд. Эта новая великая держава будет иметь власть для того, чтобы формировать результат любого предстоящего конфликта, и мы должны быть уверены, что мы используем эту силу для того, чтобы выйти на вершину. Великий голландский флот комбинируется с большими сухопутными силами Белго-Дутч, что делает нас не только великой державой в Европе, но и в мире. Многие в нашем правительстве призывают к принятию многих амбициозных начинаний, таких, как захват Кале из Франции, повторное принятие Ист-Индии, расширение нашей конголезской колонии или удар по Германии, прежде чем они могут нанести нам новый удар. В данный момент эти планы слишком амбициозны, хотя с достаточным временем, эффективной дипломатией и квалифицированным управлением, мы можем сделать эти планы реальностью."
 belgiumforeign.26.d: "[От Гетнама] потребовали присоединиться к [Круг. Гетфакшн Найм]. Принятие их обеспечило бы нам в высшей степени стратегически ценные низкие страны во всей их полноте, с огромной силой, которая лежит на них, борясь с германской угрозой, и с их великим флотом, который может оказаться очень полезным в любом потенциальном конфликте против англичан. Однако это означало бы конец любым территориальным амбициям, которые мы имеем к ним."
 belgiumforeign.27.d: "К счастью, французы согласились, и теперь мы являемся полноправными членами [от.Гетфакшн Найм], что гарантирует нашу безопасность от угроз Югу и гарантирует, что у нас будет защитник от любой угрозы, которая возникает на нашем востоке."
 belgiumforeign.28.d: "К сожалению, французы отклонили нашу просьбу о присоединении к [отряду «Гетфайшн нэйм»), мы можем только предположить, что это означает напасть на нас в будущем, мы должны стремиться к альтернативным союзам или объявить нейтралитет и наращивать наши силы, чтобы они не осмелились угрожать нам."
 belgiumforeign.29.d: "В преддверии предстоящих выборов в Бельгии радикальные правые партии стали все более популярными, причем две основные фигуры на этой волне – Валлониан Леон Дегрель и фламандский Жорис Ван Рарон. Первая из них возглавляет Партию Бургиньон, которая рассматривает Бельгию как отличающуюся от Франции и Голландии, вместо того чтобы рассматривать ее как наследника наследия Бельгии и Бургундии. Они стремятся лишь к созданию огромного Бургундийского государства, высеченного из восточной Франции, с тем, что они называют &quot; культурным возрождением &quot; германской культуры региона. Такая позиция идеологически согласуется с нашим правительством, хотя она может создать враждебные отношения между любыми потенциальными голландскими друзьями, которых мы хотели бы видеть. Дегрелле, тем не менее, представляет собой надежный дипломатический выбор, демонстрируя в значительной степени антифранцузское мнение и будучи очень прогерманским. Между тем Ванхрон является пан-Netландцем, стремящимся к созданию единой диетской территории из как Бельгии, так и Нидерландов. Это могло бы стать вариантом, который мог бы привести бы к тому, что мы могли бы сохранить бы наше обширное государство, хотя бы мы могли бы иметь возможность для нашего хотьееее хотье положение в отношении к тому, что мы могли бы, чтобы мы могли бы сохранитььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььььь"
 belgiumforeign.30.d: "Немцы заменили свои обычные трюки в грудной клетке и палки, размахивая субверсией и хитростью. Недавно они давали огромные суммы денег радикальным правым партиям по их предпочтению, давая публичные заявления от их имени. К сожалению, такие действия не являются незаконными по бельгийскому законодательству, и такие иностранные интересы, как Германия, не могут быть помешаны на финансировании этих партий. Нам придется только надеяться, что они не слишком сильно накажут чашу весов."
 belgiumforeign.31.d: "Паника вспыхнула в Париже, поскольку члены нашего правительства и военные были встречены с серьезными новостями о том, что бельгийцы присоединились к немцам. Наш северный фланг сейчас открыт, и мы должны обеспечить его быстрое и эффективное восстановление. Однако мы можем быстро и эффективно исправить его, поскольку голландцы лгут на севере Бельгии и в последнее время крайне враждебны к ним и находятся в плохом положении из-за земли, захваченной после Великой войны. Хотя наши условия с голландцами не идеальны, отчасти из-за нашей роли в вышеупомянутом территориальном обмене, мы, возможно, сможем вернуть их назад с обещаниями безопасности и возвращения их территорий и, более того, покончить с их статусом нации с врагами со всех сторон."

 #Wartime Events
 belgiumwartime.1.d: "С падением Франции перед нашими силами настало время заключить тайное соглашение, достигнутое с бельгийцами в союзе, мы получим то, что хотим от Бельгии, и они получат свою мечту о Бургундии. Франция будет навсегда калекой, и мы обретем мощное и дружелюбное буферное государство между нами и ними. С Западом мы можем теперь искать другие пути, чтобы сохранить свою власть над Европой навсегда."
 belgiumwartime.1.db: "С падением Франции перед нашими войсками настало время заключить тайное соглашение, достигнутое с бельгийскими странами в союзе, мы получим от Бельгии то, что хотим, и они получат их требования."
 belgiumwartime.2.d: "Немцы сдержали свои обещания, а мы сдержали наши."

 #Flavour Events
 belgiumflavour.1.d: "После пробежки, начавшейся в декабре 1935 года, эта история была завершена и будет опубликована в виде книги в предстоящие недели. В ней рассказывается о молодом бельгийском репортере Тинтине, который ищет украденный южноамериканский фетиш, вдохновляемый статуей Чиму, со статуей, отличающейся от подделки сломанным ухом. Тинтин преследует украденный фетиш, которого преследуют два южноамериканских человека, путешествует в Южную Америку, где он встречается с британским исследовательом, который пропал годами и мало осведомлен о внешнем мире. Фетиш в конечном итоге восстанавливается, с его действительно ценной частью, бриллиантом внутри, случайно выбрасывается в море вместе с Тинтинскими гонщиками, которые изображаются в ад. Эта история получила высокую оценку за его улучшенные исследования по поводу предыдущих приключений Тинтин, с использованием Тинтинского конфликта в качестве аллегории для конфликта между Боливией и Парагваем."
 belgiumflavour.2.d: "Соревнования в Кубке Гордона Беннета впервые вышли из Брюсселя чуть меньше недели назад, и теперь они завершаются, с Эрнестом Демуйтером и Пьером Хоффманом, победившими в Бельгике О-БФМ, путешествующими на 1396 км за менее чем 2 дня! Гонка - это старейшая в мире гонка с газовыми шарами, которая ставит перед конкурентами простую задачу полета на самом удаленном расстоянии от стартовой площадки. Демуйтер и Хоффман возвращаются победителями, после победы чуть меньше года назад с космодрома Варшавы. Демуайтер - это опытный победитель, который выиграл победу в 1920-х годах с победами в 1920-х годах, 22, 23, 24 и 1925 годах. Бельгия вновь будет принимать у себя в следующем году город Лиеге, выбранный в качестве стартовой площадки. Будем надеяться, что в следующем году мы снова одержим победу!"
 belgiumflavour.3.d: "Соревнования в Кубке Гордона Беннета впервые вышли из Брюсселя около недели назад, и сейчас они завершаются, когда Пьер Хоффманс победил на Бургонгне, путешествовал на 1246 км за менее чем 2 дня! Гонка - это старейшая в мире гонка с газовыми шарами, которая ставит перед конкурентами простую задачу полета на самом удаленном расстоянии от стартовой площадки. Хоффман - это возвращающийся победитель, после победы чуть меньше года назад со стартовой площадки Варшавы. Его напарник Эрнест Демуйтер - опытный победитель, который выиграл победу в 1920-х годах, с победами в 1920, 22, 23, 24 и 1925 годах. Однако Демуйтер отказался участвовать в этом году из-за его диспута в пользу Дегрельса ПБ и либеральных наклонностей Демуйтера. Бельгия вновь примет у себя в следующем году, в результате чего город Лиге будет выбран в качестве стартового полигона. Будем надеяться, что в следующем году мы снова победимся!"
 belgiumflavour.4.d: "Соперники Кубка Гордона Беннета впервые вышли из Льежа чуть меньше недели назад, и теперь они закончили с победой Антони Янусса в SP-BCU LOPP, путешествуя на 1692 километра за полтора дня. Демуйтер и Хоффманы вернулись из прошлого года, однако не смогли одержать победу над своим польским противником. Демуйтер теперь отошел от воздушного шара после этого поражения и присоединился к Либеральной партии, надеясь вступить в прифронтовую политику. Польша сейчас будет принимать у себя в следующем году."
 belgiumflavour.5.d: "Соперники Кубка Гордона Беннета впервые вышли из Льежа чуть меньше недели назад, и теперь они закончили, с Антони Янушем, победившим в SP-BCU LOPP, путешествовали 1692 километра всего за полтора дня. Хоффманы вернулись из прошлого года, однако не смогли одержать победу над своим польским противником. Что касается его будущего партнера из 1936 года, Демуйтер бежал в Швейцарию в последние месяцы из-за подозрений правительства Валькиста. Были подозрения, что Хоффманы могут быть арестованы, но они не прошли, и он смог завершить свою бесперебойную работу. Польша сейчас будет принимать у себя следующий год."
 belgiumflavour.6.d: "Ричард Симан скончался от ранений, полученных после переворота его автомобиля во время бельгийской Гран-при 1939 года. Гонка состоялась в Спа-Франсоршамсе в Валлонии во время мокрых гонок, когда моряк врезался в дерево на 22-м круге после того, как он использовал линию через угол, обычно используемый только в день сухой гонки. Машина загорелась, когда Симен был без сознания, умирал от ожогов несколько часов спустя в молодом возрасте 26 лет. Моряк бежал за командой Мерседес-Бенз и лично встретился с Адамом Дрезслером ранее в этом году, в то время как его отношения с семьей стали натянутыми из-за связей с Вальксизмом. Дресслер послал огромный верат на похороны, во многом к неодобрению семьи Симен. Фотографии моряка сейчас выставлены на дилерах Мерседес-Бенз во всем мире, и бельгийское правительство распорядилось пересмотреть расовый курс после этой аварии."

 #####Decisions#####
 BEL_economy: "Бельгийская экономика"
 BEL_economy_desc: "Наша национальная индустрия важна для богатства и силы нашей нации, наше правительство должно сделать все, что в его силах, чтобы усовершенствовать и развить нынешнюю инфраструктуру."
 BEL_end_economic_crisis: "Прекратить экономический кризис"
 BEL_end_economic_crisis_desc: "С черной среды наша экономика находится в состоянии хаоса, но с усилиями правительства, конец уже близок. Теперь нам нужно послать сильный сигнал народу и дать ему понять, что будущее выглядит светло для Бельгии."
 BEL_integrate: "Территориальная интеграция"
 BEL_integrate_desc: "По мере того как концепция Бельгии продолжает расширяться, мы должны обеспечить признание новой реальности и интеграцию этих новых территорий. Восстановление порядка и обеспечение своевременной интеграции имеет первостепенное значение, или же мы можем столкнуться с сопротивлением и трудностями в управлении промышленностью, населением и ресурсами этих районов."
 BEL_burgundian_integrate: "Бургундская интеграция"
 BEL_burgundian_integrate_desc: "Создание новой нации из пепла французского поражения и победы Бельгии будет непростой задачей. Валлония, фламандский, бельгийский и французский языки по-прежнему являются национализмом подавляющего большинства нашего населения, и формирование идеи бургундского народа будет трудной задачей. Однако мы знаем, что наш духовный народ - бургундиец, что его наследие - бургундиец. Наша задача заключается лишь в том, чтобы восстановить это у ложных наций, к которым они привязались, обеспечивая при этом, чтобы культурные разрушения и жестокость не происходили, только культурное и национальное возрождение. После того как эта задача будет выполнена, новая нация будет с гордостью пребывать в сердце Западной Европы, маяке цивилизации в Европе и во всем мире."
 BEL_core_lux: "Включить Люксембург"
 BEL_core_lux_desc: "Люксембург всегда был истинной частью Бельгии, присоединяясь к нам в бельгийском восстании, но был лишен права участвовать в Лондонском договоре, с тех пор рассматривается как потерянная часть Бельгии, и теперь мы должны обеспечить ее быструю и эффективную интеграцию в Бельгию, где она и останется."
