 #####Focuses#####
 #Politics
 #####Focuses#####
 #Politics
 CHIMIN_warlord_politics: "Политика военных баронов"
 CHIMIN_warlord_politics_desc: "Для того чтобы выжить, мы должны играть в политику военных, балансируя амбиции с выживанием, и идеологию с холодной, жесткой реальностью."
 CHIMIN_independent_warlord: "Независимый военный барон"
 CHIMIN_independent_warlord_desc: "Мы ни перед кем не преклоняемся, ни перед Нанкином, ни перед Пекином, и уж точно не перед какой-либо иностранной державой, эта земля - наша земля, и мы будем управлять ею так, как считаем нужным, наша независимость не подлежит обсуждению."
 CHIMIN_embrase_banditry: "Прими бандитизм"
 CHIMIN_embrase_banditry_desc: "Орден - это иллюзия, а закон - это роскошь, которую мы не можем себе позволить. Единственная настоящая сила - это ствол пистолета и страх, который он вдохновляет. Мы станем бандитским государством, берём то, что нам нужно, чтобы выжить."
 CHIMIN_aggressive_raiders: "Агрессивные рейдеры"
 CHIMIN_aggressive_raiders_desc: "У наших соседей есть богатство, еда и оружие, мы превратим нашу армию в агрессивную налетную силу, живя на добыче наших слабых, "цивилизованных" соседей."
 CHIMIN_embrace_self_interest: "Чистая самоинтересность"
 CHIMIN_embrace_self_interest_desc: "Идеология - это ловушка. Национализм - это слоган. Единственный факт, который имеет значение - прагматизм. Каждое решение будет основываться на простых расчетах: укрепляет ли это нашу клику и нашу собственную силу?"
 CHIMIN_begin_the_raids: "Начинайте рейды"
 CHIMIN_begin_the_raids_desc: "Армия наша голодна, а шкафы у нас пусты; мы отпустим наших солдат на окрестные территории; пусть они грабит и грабит, и добыча их будет нашим спасением."
 CHIMIN_status_quo: "Статус Quo"
 CHIMIN_status_quo_desc: "Ситуация в Китае - это хрупкий баланс слабости, любой внезапный шаг может нанести нам ущерб, мы будем сохранять статус-кво, тихо регулировать нашу маленькую фифму и избегать внимания более крупных держав."
 CHIMIN_defend_our_boundaries: "Защищайте наши границы"
 CHIMIN_defend_our_boundaries_desc: "Эта территория принадлежит нам, и мы будем держать ее, мы вложим средства в укрепление границ и в постоянную оборонительную силу, мы не стремимся к войнам, но мы закончим все, что нам доставят."
 CHIMIN_arm_our_men: "Оружие наших людей"
 CHIMIN_arm_our_men_desc: "Безопасное государство нуждается в солдатах, которые могут сражаться. Мы потратим то малое, что у нас есть на винтовки, пулеметы и основное снаряжение. Вооруженное население является лучшим сдерживающим фактором для амбициозных соседей."
 CHIMIN_a_secure_feifdom: "Защищенная подделка"
 CHIMIN_a_secure_feifdom_desc: "Мы сделали это. Наши границы в безопасности, наша армия вооружена, наш народ в безопасности. Мы вырезали стабильную фифдом в эпоху хаоса."
 CHIMIN_regional_nationalism: "Региональный национализм"
 CHIMIN_regional_nationalism_desc: "Кто такие "китайцы"? люди в Нанкине? марионетки в Пекине? Мы не они. Мы люди с нашей собственной культурой, нашим диалектом и нашей судьбой. Наша преданность нашей родной провинции, а не какой-то абстрактной "Китай"."
 CHIMIN_embrace_local_identity: "Обнаружить местную идентичность"
 CHIMIN_embrace_local_identity_desc: "Мы будем продвигать наш местный язык, обычаи и историю."
 CHIMIN_distinguish_from_chinese: "Отличие от китайской идентичности"
 CHIMIN_distinguish_from_chinese_desc: "Концепция «Китай» не принесла нам ничего, кроме войны и страданий. Мы официально объявим наш народ отличным, разорвав культурные узы, которые связывают нас с этим несостоятельным государством. Наше будущее - наше собственное."
 CHIMIN_local_claims: "Региональные претензии"
 CHIMIN_local_claims_desc: "Наша идентичность не ограничивается нашими нынешними границами, рядом с нами находятся земли, населенные нашими родственниками, которыми управляют другие, и мы притязаем на эти территории и объединим наш народ под единым знаменем."
 CHIMIN_support_the_kmt: "Поддержка KMT"
 CHIMIN_support_the_kmt_desc: "Куоминтанг с его обещанием национализма, демократии и средств к существованию народа представляет собой наилучшую надежду на будущее Китая."
 CHIMIN_lkmt_takeover: "Похититель L-KMT"
 CHIMIN_lkmt_takeover_desc: "Истинное видение Сунь Ят-сена заключается в Левом Куоминтанге, их обещание земельной реформы и социальной справедливости восторжествует с нашим народом, мы очистим реакционеров и пойдем на революционный путь Левого КМТ."
 CHIMIN_socialist_doctrine: "Социалистическая доктрина"
 CHIMIN_socialist_doctrine_desc: "Мы официально примем социалистическую доктрину, реорганизовав наше государство и нашу армию по революционным направлениям."
 CHIMIN_rally_local_lkmt: "Местный L-KMT"
 CHIMIN_rally_local_lkmt_desc: "Мы не одиноки, на нашей территории есть много сторонников левых КГТ, мы сплотим эти ячейки и революционные союзы, пригласив их в правительство, чтобы построить новое общество."
 CHIMIN_state_socialism: "Социализм государства"
 CHIMIN_state_socialism_desc: "Государство возьмет под свой контроль промышленность, землю и все средства производства, направляя нашу экономику к социалистическому будущему силой."
 CHIMIN_libsoc: "Децентрализованный социализм"
 CHIMIN_libsoc_desc: "Власть должна принадлежать народу, а не новому классу бюрократов."
 CHIMIN_rkmt_takeover: "Перенос R-KMT"
 CHIMIN_rkmt_takeover_desc: "Социализм - это яд. Истинный путь КМТ - это путь национализма и порядка. Мы очистим левых и соприкоснемся с право-Куоминтангом, сосредоточившись прежде всего на национальном единстве и силе."
 CHIMIN_nationalist_doctrine: "Националистическая доктрина"
 CHIMIN_nationalist_doctrine_desc: "Наше государство будет построено на принципе Минзу, один народ, одна нация, один Китай, мы примем три принципа народа в качестве нашего руководства националистической доктриной."
 CHIMIN_rally_local_kmt: "Местный R-KMT"
 CHIMIN_rally_local_kmt_desc: "Мы сплотим этих патриотов, бизнесменов и военных офицеров, давая им контроль над государством, чтобы создать новое, мощное правительство."
 CHIMIN_support_nanjing: "Поддержка Нанкина"
 CHIMIN_support_nanjing_desc: "Правительство Нанкина, несмотря на все его недостатки, является законным правительством Китая."
 CHIMIN_break_with_nanjing: "Перерыв с Нанкином"
 CHIMIN_break_with_nanjing_desc: "Правительство Нанкина коррумпировано, неэффективно и слишком готово идти на компромисс с империалистами. Мы больше не можем следовать их неудавшемуся руководству. Мы разорвем наши связи и построим свой собственный путь."
 CHIMIN_kmt_in_full_power: "KMT в контроле"
 CHIMIN_kmt_in_full_power_desc: "Партия, государство и армия едины, едины в нашей миссии по приведению трех принципов народа во все Китай."
 CHIMIN_our_own_thought: "Наша собственная мысль"
 CHIMIN_our_own_thought_desc: "Идеология КМТ является хорошей отправной точкой, но уникальные условия в нашей провинции требуют уникальной доктрины. Мы будем развивать свою собственную политическую философию, «мысл», которая смешивает национализм с местными реалиями."
 CHIMIN_chinese_republicanism: "Китайский республиканец"
 CHIMIN_chinese_republicanism_desc: "Мы отвергаем тиранию императоров, военачальников и партийных диктаторских режимов, мы построим настоящую республику, основанную на конституции, верховенстве права и согласии управляемых."
 CHIMIN_legislate_liberties: "Законные свободы"
 CHIMIN_legislate_liberties_desc: "Государство не может быть свободным, если его народ не свободен. Мы будем разрабатывать и принимать билль о правах, гарантирующий свободу слова, собраний и печати. Наша провинция станет маяком свободы в Китае."
 CHIMIN_european_political_thought: "Европейская политическая мысль"
 CHIMIN_european_political_thought_desc: "Старые Конфуцианские пути подвели нас. Мы будем смотреть на Запад, изучая европейских политических мыслителей - от Локка до Монтескье - чтобы найти новую модель современного, либерального китайского государства."
 CHIMIN_federalism_and_nationalism: "Федерализм и национализм"
 CHIMIN_federalism_and_nationalism_desc: "Китай может быть единым, не будучи однородным. Мы будем выступать за федералистскую модель, где провинции сохраняют высокую степень автономии при едином националистическом республиканском правительстве."
 CHIMIN_a_strong_state: "Сильное государство"
 CHIMIN_a_strong_state_desc: "Наша республика должна быть сильной, с сильным центральным правительством, способным разрушать инакомыслие и навязывать свою волю на благо нации."
 CHIMIN_cult_of_the_leader: "Культ лидера"
 CHIMIN_cult_of_the_leader_desc: "Людям не нужны сложные идеи, им нужен символ, лидер, мы построим культ личности вокруг нашего генералиссимо, что сделает его живым воплощением государства и воли народа."
 CHIMIN_suspend_liberties: "Приостановить действие свобод"
 CHIMIN_suspend_liberties_desc: "Либеральные «свободы» — это слабость, которую будут использовать наши враги. Мы отменим все гражданские свободы, назначив военное положение для обеспечения единства и безопасности."
 CHIMIN_a_china_for_the_clique: "Китай для клика"
 CHIMIN_a_china_for_the_clique_desc: "Наша клика доказала свое превосходство. Мы единственные, кто способен править. Наша конечная цель - не только управлять нашей провинцией, но и покорить весь Китай и изменить его по нашему образу."

 ##International Relations/China
 ##International Relations/China
 CHIMIN_our_place_in_world: "Судьба Китая"
 CHIMIN_our_place_in_world_desc: "Мы не можем существовать в вакууме вечно, мы должны определить свое место в разрушенном ландшафте Китая, покоримся ли мы большей силе, играем ли они друг против друга или провозглашаем себя единым истинным правительством?"
 CHIMIN_claim_rival_government: "Правительство Риваль"
 CHIMIN_claim_rival_government_desc: "Мы объявим наше собственное правительство, единственное законное и подлинное правительство над всем Китаем."
 CHIMIN_international_support: "Международная поддержка"
 CHIMIN_international_support_desc: "Для того чтобы быть законным правительством, мы должны быть признаны другими, мы отправим дипломатов за границу в поисках признания и поддержки со стороны великих держав мира."
 CHIMIN_bend_to_europe: "Поиск поддержки со стороны Великобритании"
 CHIMIN_bend_to_europe_desc: "Британская империя со своим могущественным флотом и огромным богатством является сильным потенциальным партнером. Мы обратимся к Лондону, предложив торговые уступки в обмен на оружие, займы и легитимность."
 CHIMIN_appeal_to_moscow: "Ищите советской поддержки"
 CHIMIN_appeal_to_moscow_desc: "Советский Союз является революционной державой, приверженной борьбе с империализмом."
 CHIMIN_appeal_to_tokyo: "Поиск поддержки со стороны Японии"
 CHIMIN_appeal_to_tokyo_desc: "Японская империя - это растущая сила в Азии, и, соприсоединяясь с ними, мы можем получить доступ к современному оружию и промышленности, мы будем стремиться к соглашению с Токио, многообещающему сотрудничеству в их поддержке."
 CHIMIN_increasing_our_legitimacy: "Повысить наш законный статус"
 CHIMIN_increasing_our_legitimacy_desc: "Заручившись иностранной поддержкой, мы повысили свой статус."
 CHIMIN_anti_imperialism: "Антиимпериализм"
 CHIMIN_anti_imperialism_desc: "Слабость Китая - это вина иностранных империалистов, которые вырезают нашу землю и эксплуатируют наш народ."
 CHIMIN_a_manchu_hos: "Реставрация Манчу"
 CHIMIN_a_manchu_hos_desc: "Республика потерпела неудачу, единственный путь к стабильности - восстановить старый порядок, мы пригласим императора Пуйя в нашу столицу, провозглашая восстановление династии Цин под нашей защитой."
 CHIMIN_personal_rule: "Личное правило"
 CHIMIN_personal_rule_desc: "Это правительство, эта армия... все это продление воли одного человека: нашей собственной. Мы избавимся от фикций советов и комитетов. Наше слово - закон. Мы будем править лично и абсолютно."
 CHIMIN_a_government_for_all_of_china: "Правительство Китая"
 CHIMIN_a_government_for_all_of_china_desc: "Наши амбиции расширились. Мы уже не просто провинциальные клики, а ядро нового, единого Китая. Мы начнем закладывать основы для национального правительства, готового взять под свой контроль всю страну."
 CHIMIN_raise_forces: "Поднять силы"
 CHIMIN_raise_forces_desc: "Наши притязания ничего не значат без армии, чтобы поддержать их, мы вступим в массовый призыв, поднимем новые разногласия из каждого города и деревни, наше правительство должно иметь армию, достойное его имени."
 CHIMIN_war_taxes: "Военные налоги"
 CHIMIN_war_taxes_desc: "Армия не прокормит себя, мы наложим новые налоги на сельское хозяйство, торговлю и собственность."
 CHIMIN_unite_china: "Объединим Китай"
 CHIMIN_unite_china_desc: "Время для разговоров закончилось, наша новая армия готова, мы запустим Великое Северное или Южное Экспедицию, уничтожив других военных баронов и объединив весь Китай под нашим знаменем!"
 CHIMIN_take_greater_china: "Введи его в курс дела."
 CHIMIN_pick_a_side: "Выбери сторону"
 CHIMIN_pick_a_side_desc: "Мы слишком слабы, чтобы стоять в одиночестве."
 CHIMIN_the_kmt: "KMT"
 CHIMIN_the_kmt_desc: "Революция Куоминтанга - это будущее. Их видение единого современного Китая - это то, что мы будем поддерживать."
 CHIMIN_model_province: "Образцовая провинция"
 CHIMIN_model_province_desc: "Мы продемонстрируем свою преданность КМТ, превратившись в «Модельную Провинцию». Мы будем осуществлять принципы доктора Суна, уничтожая коррупцию и создавая инфраструктуру, доказывая нашу ценность Нанкину."
 CHIMIN_root_out_corruption: "Искоренить коррупцию"
 CHIMIN_root_out_corruption_desc: "Мы создадим антикоррупционное агентство, которое очистит нашу администрацию от нечестных чиновников и завоюет доверие народа."
 CHIMIN_join_kmt: "Присоединиться к KMT"
 CHIMIN_join_kmt_desc: "Мы официально расторгнем нашу клику и интегрируем нашу провинцию и армию в национальное правительство Куоминтанга."
 CHIMIN_the_fengtian: "Фенгтианская клика"
 CHIMIN_the_fengtian_desc: "Фенгтианская клика на севере с ее японской поддержкой и современной армией является самой сильной силой в Китае."
 CHIMIN_support_the_marshal: "Поддержи маршала."
 CHIMIN_support_the_marshal_desc: "Мы докажем нашу преданность молодому маршалу, наши войска будут координировать свои действия с его, и наши ресурсы будут в его распоряжении, взамен мы ожидаем его защиты и покровительства."
 CHIMIN_crush_kmt: "Разрушить местный KMT"
 CHIMIN_crush_kmt_desc: "Чтобы доказать нашу преданность Фенгтиану, мы должны быть врагами их врагов, мы запустим чистку всех КМТ и националистических элементов в пределах наших границ, их революционные пожары будут потушены."
 CHIMIN_join_feng: "Присоединяйтесь к фенгтианцам."
 CHIMIN_join_feng_desc: "Мы официально покончим с нашей независимостью и присоединимся к правительству Фенгтиа, наша армия и провинция будут интегрированы в их командную структуру, превратившись в лояльную часть их северного блока."
 CHIMIN_the_zhili: "Жили"
 CHIMIN_the_zhili_desc: "Жили Клик, хотя и ослабленный, по-прежнему представляет собой законную традицию Бейянга, которую возглавляют компетентные, антикоммунистические командиры, и они являются достойным сторонником."
 CHIMIN_build_a_strong_state: "Построение сильного государства"
 CHIMIN_build_a_strong_state_desc: "Чтобы быть полезным союзником Жили, мы должны быть сильными, мы сосредоточимся на внутреннем развитии, создании нашей промышленности и армии, чтобы стать мощным активом."
 CHIMIN_crack_down_on_kmt: "Разбивка по KMT"
 CHIMIN_crack_down_on_kmt_desc: "Мы последуем примеру Жили и начнем кампанию по подавлению всей националистической и коммунистической деятельности в нашей провинции."
 CHIMIN_join_zhi: "Присоединяйся к Жили."
 CHIMIN_join_zhi_desc: "Мы официально присоединимся к Клике Жили, поставив наши армии под командование их руководства и присоединимся к их борьбе за контроль над Китаем."
 CHIMIN_neutrality: "Нейтральность"
 CHIMIN_neutrality_desc: "Великие державы мира предлагают лишь порабощение. Великие клики Китая предлагают только уничтожение. Мы выберем третий путь: нейтралитет. Мы будем торговать со всеми, союзником ни с кем и защищать наши границы."
 CHIMIN_a_friend_of_japan: "Друг Японии"
 CHIMIN_a_friend_of_japan_desc: "Япония является доминирующей державой в Азии. Просто прагматизм состоит в том, чтобы развивать дружественные отношения с Токио, обеспечивая, чтобы они рассматривали нас как партнера, а не как препятствие."
 CHIMIN_japanese_economic_aid: "Экономическая помощь Японии"
 CHIMIN_japanese_economic_aid_desc: "Мы приглашаем японские корпорации и консультантов помочь нам в строительстве нашей промышленности, их капитал и опыт позволят модернизировать нашу провинцию, и их инвестиции придадут им интерес к нашему выживанию."
 CHIMIN_japanese_military_support: "Японская военная поддержка"
 CHIMIN_japanese_military_support_desc: "Армия с палками и камнями не выживет, мы попросим японских военных советников и покупаем современное оружие у их фабрик, преобразуя наши войска в профессиональные боевые силы."
 CHIMIN_supress_nationalists: "Националисты супресс"
 CHIMIN_supress_nationalists_desc: "Наши японские партнеры обеспокоены антияпонской агитацией со стороны КМТ, чтобы доказать нашу дружбу, мы будем подавлять эти националистические группы, обеспечивая стабильность и порядок."
 CHIMIN_join_co_prosperity_sphere: "Присоединяйтесь к сфере совместной деятельности"
 CHIMIN_join_co_prosperity_sphere_desc: "Старый порядок умирает. Будущее Азии — это одно из «Азии для Азии», возглавляемое Японией. Мы официально присоединимся к Сфере Сопровождения, заняв наше место в этом новом антизападном блоке."
 CHIMIN_isolation: "Изоляция"
 CHIMIN_isolation_desc: "Мир снаружи - источник хаоса, войны и коррупции, мы повернем внутрь, закроем свои границы и сосредоточимся исключительно на своем собственном народе, станем отшельником."
 CHIMIN_close_trade: "Прекращение торговли"
 CHIMIN_close_trade_desc: "Внешняя торговля влечет за собой внешнее влияние. Мы прекратим импорт и экспорт, разорвем наши связи с мировой экономикой. Чего мы не можем сделать сами, мы научимся жить без них."
 CHIMIN_autarky: "Автарки"
 CHIMIN_autarky_desc: "Эта программа позволит реорганизовать всю нашу экономику, вынудив развитие новых отраслей производить все необходимое, от стали до пуль, прямо здесь, дома."
 CHIMIN_weather_the_storm: "Погода буря"
 CHIMIN_weather_the_storm_desc: "Мы одни, но мы самодостаточны, наши границы запечатаны, наш народ накормлен, и наша армия вооружена, бури в мире могут бушевать, но мы посмотрим на них в нашей крепости."
 CHIMIN_appease_europeans: "Позвонить европейцам"
 CHIMIN_appease_europeans_desc: "Европейские державы - Брайтан, Франция, Германия - до сих пор обладают большим влиянием и богатством, и мы будем в восторге от них, предоставляя им привилегированный доступ на наши рынки в обмен на их защиту."
 CHIMIN_open_to_trade: "Открыто для торговли"
 CHIMIN_open_to_trade_desc: "Наша провинция станет центром международной торговли. Мы откроем наши рынки для всех, пригласив иностранные компании к инвестициям и торговле, и разбогатеем как портал в Китай."
 CHIMIN_suppress_the_kmt: "Опустошить KMT"
 CHIMIN_suppress_the_kmt_desc: "Наши европейские партнеры не любят антиимпериалистическую риторику КМТ."
 CHIMIN_friends_in_shanghai: "Друзья в Шанхае"
 CHIMIN_friends_in_shanghai_desc: "Мы установим тесные связи с Шанхайским международным соглашением, в котором банки и корпорации смогут предоставить нам кредиты и промышленные товары, необходимые для модернизации."
 CHIMIN_friends_in_tonkin: "Друзья в Тонкине"
 CHIMIN_friends_in_tonkin_desc: "Французский Индокита на нашей границе, мы откроем дипломатические и экономические каналы с французскими властями в Тонкине, обеспечив безопасность нашего южного фланга и открыв новый путь для торговли и оружия."
 CHIMIN_an_imperialist_tool: "Перестань награждать"
 CHIMIN_an_imperialist_tool_desc: "Некоторые называют нас инструментом империалистов. Мы называем себя богатыми. Наша политика умиротворения окупилась. Наши кошельки заполнены, наша армия вооружена европейским оружием, и наша индустрия растет."

 #Military
 CHIMIN_military: "Состояние вооруженных сил [ROOT.Getname]"
 CHIMIN_military_desc: "Наша армия - коллекция бандитов, крестьянских сборов и переодевания, вооруженных ржавыми винтовками и копьями."
 CHIMIN_build_an_army: "Создание армии"
 CHIMIN_build_an_army_desc: "Нам нужны люди, мы введем в действие официальную систему призыва на военную службу, создадим базовый тренировочный склад и создадим профессиональный корпус офицеров, это первый шаг к созданию настоящей армии."
 CHIMIN_modern_equipment: "Современное оборудование"
 CHIMIN_modern_equipment_desc: "Мы создадим небольшой арсенал для изготовления основных винтовок и боеприпасов, отлучая нашу армию от захваченного и старинного оружия."
 CHIMIN_rethink_our_command: "Переосмыслить нашу команду"
 CHIMIN_rethink_our_command_desc: "Мы должны переосмыслить всю эту структуру, решая, учиться ли у иностранцев или развивать собственную командную философию."
 CHIMIN_use_british_tactics: "Британские тактики"
 CHIMIN_use_british_tactics_desc: "Британская армия - это профессиональная, дисциплинированная сила, мы нанимаем британских советников для подготовки наших людей, сосредотачивая внимание на огневой мощи, увековечении и профессиональном руководстве НКО."
 CHIMIN_use_japanese_tactics: "Японская тактика"
 CHIMIN_use_japanese_tactics_desc: "Японцы доказали, что азиатская армия может победить европейца. Мы будем придерживаться их тактики, делая упор на пехотных нападениях, строгой дисциплине и «духе» солдата."
 CHCHIMIN_our_own_development: "Наша собственная тактика"
 CHIMIN_our_own_development_desc: "Иностранные доктрины плохо подходят для нашей местности и наших войск. Мы разработаем свою собственную тактику, основанную на нашем опыте во времена войны: мобильность, удивление и использование слабостей врага."
 CHIMIN_new_wave_of_modernisation: "Волна модернизации"
 CHIMIN_new_wave_of_modernisation_desc: "Эта новая волна модернизации будет сосредоточена на приобретении вспомогательного оружия: минометов, тяжелых пулеметов и основной артиллерии."
 CHIMIN_buy_russian_guns: "Купите советское оружие"
 CHIMIN_buy_russian_guns_desc: "Советы стремятся экспортировать революцию и оружие, мы покупаем излишние винтовки Мосинов, пулеметы Максима и полевую артиллерию, давая нашей армии изогнутый, надежный позвоночник."
 CHIMIN_buy_asian_guns: "Покупайте азиатские пистолеты"
 CHIMIN_buy_asian_guns_desc: "Японские и фенгтские арсеналы производят лучшее оружие в Азии, мы покупаем автоматы Арисаки и автоматы Намбу, стандартизуя нашу армию на современной местной модели."
 CHIMIN_buy_european_guns: "Покупайте европейское оружие"
 CHIMIN_buy_european_guns_desc: "Немецкие, чешские и французские вооружения стоят дорого, но они самые лучшие в мире. Мы не пожалеем денег на приобретение автоматов Маузера, автоматов ZB и артиллерии Круппа."
 CHIMIN_recruitment: "Массовый набор персонала"
 CHIMIN_recruitment_desc: "Наша армия профессиональна, но мала, теперь, когда у нас есть средства для их оснащения, мы откроем шлюзы, мы соберем десятки тысяч людей, построим настоящую массовую армию."
 CHIMIN_new_further_reforms: "Интенсивные реформы"
 CHIMIN_new_further_reforms_desc: "Наша армия велика, но она все еще просто пехота, мы должны активизировать наши реформы, создавая специализированные филиалы: инженеры, сигнализаторы и разведывательные подразделения, чтобы поддержать наши основные силы."
 CHIMIN_build_airforce: "Построить военно-воздушные силы"
 CHIMIN_build_airforce_desc: "Война на земле - это только половина битвы, мы получим несколько устаревших бипланов и обучим несколько смелых пилотов, устанавливая «воздушную силу» нашей клики."
 CHIMIN_new_planes: "Новые самолеты"
 CHIMIN_new_planes_desc: "Мы будем стремиться купить современные истребители монопланов и бомбардировщики из-за границы, давая нам маленькую, но заслуживающую доверия авиаподручку."
 CHIMIN_our_doctrine: "Изучение доктрины иностранной авиации"
 CHIMIN_our_doctrine_desc: "Наши пилоты умеют летать, но не сражаться. Мы отправим их за границу для изучения воздушных доктрин великой державы, изучения искусств собачьей борьбы и наземной поддержки."
 CHIMIN_access_to_the_sea: "Доступ к миру"
 CHIMIN_access_to_the_sea_desc: "Клика, не имеющая выхода к морю, является слабой кликой, и мы должны получить доступ к морю, охраняя порт для строительства военно-морского флота и торговли с внешним миром."
 CHIMIN_new_docktrine: "Новая доктрина"
 CHIMIN_new_docktrine_desc: "У нас есть порт, но нет флота. Мы должны решить, какой флот мы будем строить. Сосредоточимся ли мы на береговой обороне, флоте "зеленой воды" или флоте речных катерах?"
 CHIMIN_air_and_navy_command: "Объединенное военно-воздушное командование"
 CHIMIN_air_and_navy_command_desc: "Мы создадим совместное командование для координации патрулирования прибрежных районов, морской разведки и защиты нашего порта."
 CHIMIN_new_artillery: "Новая артиллерия"
 CHIMIN_new_artillery_desc: ""Бог войны" отсутствовал в нашей армии, мы создадим специализированный артиллерийский корпус, покупаем или сооружаем современные полевые орудия и обучаем наших людей их использованию."
 #Research#
 CHIMIN_education_reform: "Реформа системы образования"
 CHIMIN_education_reform_desc: "Наша провинция погрязла в неграмотности, для того чтобы построить современное государство, мы должны сначала иметь людей, которые умеют читать и писать, мы начнем осуществление базовой программы реформы образования."
 CHIMIN_improve_schools: "Улучшить наши школы"
 CHIMIN_improve_schools_desc: "Недостаточно иметь школы, они должны быть хорошими, мы будем финансировать строительство новых школьных домов, печатать стандартизированные учебники и нанимать квалифицированных учителей."
 CHIMIN_army_education_standards: "Стандартизация образования военнослужащих"
 CHIMIN_army_education_standards_desc: "Офицер, который не может прочесть карту, представляет опасность для его людей, мы создадим базовую военную академию, чтобы все наши офицеры отвечали минимальным стандартам грамотности и счета."
 CHIMIN_finish_education_reforms: "Завершение реформы системы образования"
 CHIMIN_finish_education_reforms_desc: "Наши реформы завершены, мы заложили основы современного, образованного общества, от наших начальных школ до наших военных академий, и теперь наш народ готов к вызовам XX века."

