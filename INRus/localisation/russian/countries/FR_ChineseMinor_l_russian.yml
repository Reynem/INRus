 ### Army Stuff ###
 china_northern_school: "Северная школа"
 KR_northern_school: "Боеприпасы и православные сооружения"
 china_northern_school_desc: "Военачальники северных районов Китая, в основном из военных школ Сюаньтон-эры в Баодинге и Тяньцзине, представляют собой сливки все более старой культуры офицеров, которые обучаются в прусском стиле и сражаются главным образом на северной равнине, их стиль командования подчеркивает позиционную войну наряду с важностью хорошо сожженных войск, особенно артиллерии. §!"

 china_southern_school: "Южная школа"
 KR_southern_school: "Масса и мобильность"
 china_southern_school_desc: "Взрыв ресурсов северных военных баронов и боевые действия, главным образом в опустошающих горах и долинах на юге, китайские южные воины делают упор на численном составе и маневровых боях. Агрессия вознаграждается, открытые места всегда должны эксплуатироваться, а тяжёлая артиллерия заменяется быстродействующими горными пушками.§!"

 china_green_forest_school: "Школа Зеленый лес"
 KR_green_forest_school: "Надежность и подача заявок"
 china_green_forest_school_desc: "Однако, несмотря на все свои недостатки, эти бывшие (а иногда и активные) бандиты применяют уникальный подход к войне, способный оставаться гибкими и устойчивыми даже в самых трудных обстоятельствах. Некоторые могут называть свои методы грубыми или даже преступными, но часто получают результаты.§!"

 #####Events#####
 chineseunitedfront_events.1.d: ""Анти Империалистический фронт" выполнил свою задачу, и теперь уже нет. Старое соперничество, задержавшееся ради национального выживания, вновь всплыло. Похоже, что мир был всего лишь паузой в долгой борьбе за контроль над Китаем."

 chineseunitedfront_events.2.d: "Лидер Антиимпериалистического фронта официально объявил союз недействительным, общая угроза, которая нас объединила, исчезла, а вместе с ней и неубедительные узы нашего сотрудничества. Военные бароны и клики теперь смотрят на свои собственные интересы, и трудное перемирие, которое объединило Китай, уже позади. Гражданская война должна возобновиться."

 chineseunitedfront_events.3.d: "Новая внешняя угроза угрожает всему Китаю. Перед лицом этой агрессии был предложен новый альянс: Китайский антиимпериалистический фронт, хотя у нас есть разногласия с другими группировками, призыв объединиться против иностранного захватчика, мы должны отбросить наше соперничество, хотя бы на какое-то время, чтобы защитить нашу родину и наш народ."

 chineseunitedfront_events.4.d: "Международные наблюдатели были потрясены сегодняшними новостями с Дальнего Востока, множеством кликов и соперничающих правительств Китая, которые долгое время вели горькую гражданскую войну, объявили о создании единого военного альянса, назвав себя «китайским антиимпериалистическим фронтом», они обещали прекратить свои внутренние конфликты и сотрудничать в деле защиты своей нации от иностранной агрессии. Это неожиданное единство, несомненно, усложнит ситуацию для любой державы, стремящейся расширить свое влияние в регионе."

 chineseunitedfront_events.5.d: "Наша борьба с войсками была прервана срочным дипломатическим кабельом, с тенью большего врага, надвигающегося над всем Китаем, они предложили немедленное прекращение огня. Они утверждают, что все китайцы должны объединиться, чтобы встретиться с иностранными империалистами. Мы можем им доверять? Продолжение нашей частной войны может ослабить нас всех, но принять перемирие с этими соперниками - это горькая таблетка, которую нужно проглотить."

 chineseunitedfront_events.6.d: "Похоже, что разум возобладал. [От Гетнама] официально согласился на прекращение огня. Наши войска откажутся, и граница будет восстановлена, когда мы оба будем сталкиваться с более серьезной внешней угрозой. Это нелегкий мир, рожденный необходимостью, а не дружбой. Только время покажет, как долго это перемирие продлится, когда иностранные войска будут изгнаны с наших берегов."

 chineseunitedfront_events.7.d: "Наше предложение о создании единого фронта против империалистических захватчиков было встречено с презрением! [От Гетнама] отказался от нашего предложения о прекращении огня, предпочтя продолжать свои мелкие внутренние ссоры, пока нация горит. Это предательство ставит под угрозу весь Китай. Их недальновидные амбиции могут быть гибелью для всех нас!"

 chineseunitedfront_events.8.d: "Война против Японии продолжается, но новое развитие событий открывает возможность. Британская империя также заперта в борьбе с японцами. Хотя у нас есть свои глубокие разногласия с Великобританией и их колониальными амбициями, наша взаимная борьба против Японии не может быть проигнорирована. Протягивание к ним военной координации могло бы сыграть решающую роль. Должны ли мы предложить соглашение?"

 chineseunitedfront_events.9.d: "В свете нашей совместной войны против японской империи китайцы предложили предоставить нашим силам полный военный доступ на свои территории, что позволило бы нашим армиям передвигаться через Китай, пополнить запасы и открыть новый фронт против японцев на азиатском материке."

 chineseunitedfront_events.10.d: "Наши дипломатические усилия по отношению к англичанам увенчались успехом, они приняли наше предложение о военной координации и получат доступ на нашу территорию в течение всей нашей взаимной войны против Японии. Британские войска и поставки, передвигающиеся по нашей земле, откроют новый жизненно важный фронт против японских захватчиков. Вместе мы введем врага в море!"
 #
 chineseunitedfront_events.11.d: "Ситуация критическая. Японские захватчики разрушили наши армии и глубоко загнали в сердце Китая. Наши промышленные центры потеряны, наши линии снабжения сокращены, и наши крупные города пали один за другим. Национальное единство, которое сформировал этот Фронт, проверяется, как никогда прежде. Но отчеты с фронта больше не хаотичны, они мрачно ясны. Мы были избиты в наших последних оставшихся опорных пунктах. Наше государство находится на грани полного краха, высшее командование принимает один окончательный призыв. Мы должны собрать каждого человека, каждую последнюю винтовку и каждый кусок еды для последней, отчаянной защиты. Война за выживание вот-вот закончится, так или иначе."

 chiminevents.1.d: "Правительство приняло наше любезное предложение и предоставило большое количество огнестрельного оружия в обмен на оплату."
 #
 chiminevents.2.d: "Правительство упрямо отвергло наше великодушное предложение, и мы можем бороться перед лицом продолжающейся нехватки оружия."
 #
 chiminevents.3.d: "Маленькое китайское военное командование пришло, чтобы запросить партию оружия, они готовы заплатить большую сумму за партию оружия, однако предоставление этого оружия приведет к сокращению наших поставок стрелкового оружия."
 #
 chiminevents.5.d: "[От Гетнама], государство-военный в Китае, недавно обратившееся к социализму, пришло к нам с просьбой оружия. Просоветованное государство может быть полезным улучшить их состояние, особенно когда мы можем перезарядить их из-за их изоляции."
 #
 chiminevents.6.d: "Дружелюбное военное правительство, маленькое правительство [от Гетнама] пришло к нам с просьбой о согласовании в обмен на автономию, мы могли бы согласиться или отказаться и потребовать полной аннексии."
 #
 chiminevents.7.d: "[Из Геенны] мы приняли нашу просьбу об автономии, и теперь мы едины."
 #
 chiminevents.8.d: "[Гетнам] отказался от нашей просьбы об автономии и ответил вместо этого требованием об аннексии."
 #
 chiminevents.9.d: "Наше сотрудничество с [от Гетнама] было очень тесным, и теперь маленькое правительство военных военачальников связалось с нами, просящими присоединиться к нашему альянсу."
 #
 chiminevents.10.d: "[Из Гетнама] приняли нашу просьбу о союзе, и теперь мы стоим вместе перед лицом любой угрозы!"
 #
 chiminevents.11.d: "Он отказался, считая нас ненадежным партнёром и слишком незначительным, чтобы присоединиться к ним."
 #
 chiminevents.12.d: "Хотя это, вероятно, принесет нам большую пользу и повысит наше влияние в Китае, было бы неразумно беспокоить себя и тратить ресурсы на такое незначительное государство."
 #
 chiminevents.13.d: "[Из Гетама] мы приняли нашу просьбу об экономической помощи, и теперь мы оба стали намного богаче в результате!"
 #
 chiminevents.14.d: "Они отказались от нашей просьбы об экономической помощи, и мы очень разочарованы тем, что является убытком для обоих народов."
 #
 chiminevents.15.d: "Маленькое военное государство в Китае обратилось к нам с просьбой заключить договор о дружбе, и такое соглашение, скорее всего, приведет к дальнейшему взаимовыгодному сотрудничеству, однако мы, возможно, не захотим направить наши ресурсы на столь незначительное государство."
 #
 chiminevents.16.d: "Япония согласилась с нашей просьбой о заключении договора о дружбе, и теперь мы можем выступить с этим партнерством."
 #
 chiminevents.17.d: "Япония отказалась от нашей просьбы о заключении договора о дружбе, и, естественно, мы должны рассматривать их как потенциальную угрозу для продвижения вперед."
 #
 chiminevents.18.d: "Мы подписали с ними договор о дружбе [от Гетнама], который теперь требует военной поддержки."
 #
 chiminevents.19.d: "Япония согласилась с нашей просьбой об оказании военной поддержки, и теперь в нее влились оружие и советники."
 #
 chiminevents.20.d: "Япония отказалась от нашей просьбы о военной поддержке, и сотрудничество, как представляется, пошло на большой откат."
 #
 chiminevents.21.d: "Когда императору Китая было всего 6 лет, а затем всего 12 дней в июле 1917 года, в возрасте 11 лет, Пуйи возвращается в Китай в третий раз, хотя наши средства скромны, наше правительство и Пуйи надеются, что его восстановление даст нашему нынешнему незначительному правительству влияние, необходимое для объединения Китая и подлинного восстановления Манчжу. Пуйи сам является всего лишь марионеткой нашей клики, хотя он, тем не менее, доволен изменением в пользу."
 #
 chiminevents.22.d: "[От Гетнама], когда маленькое военное правительство и теперь истец, чтобы стать подлинным правительством Китая, обратились к нам с просьбой о военной и экономической поддержке, хотя это, скорее всего, принесет нам выгоду с геополитической и экономической точек зрения, это может нарастить наши ресурсы на то, что может быть безрезультатным."
 #
 chiminevents.23.d: "[Отправители] приняли нашу просьбу и отправили партию оружия и несколько советников, чтобы помочь нам в нашей миссии вернуть Китай."
 #
 chiminevents.24.d: "[От Гетнама] отказались от нашей просьбы, заявив, что они считают нас просто военным бароном с галлюцинациями величия, слишком незначительными, чтобы заслужить поддержку. Естественно, это возмутительно, но мы можем сделать мало, пока Китай не станет единым."
 #
 chiminevents.25.d: ""
 #
 chiminevents.26.d: ""
 #

 #Raiding
 raiding.100.d: "Приближается к нам, требуя за нас добычу и оружие в обмен на то, что они не нападут на нас; если мы откажемся и они будут счастливы, то они, скорее всего, заберут даже больше того, о чем они просят в настоящее время."
 raiding.101.d: "Они отказались отдать дань, и теперь они готовы напасть."
 raiding.102.d: "Мы приняли наше требование, и теперь мы можем наслаждаться трофеями, не стреляя пулей."
 #
 raiding.1.d: "Мы раздавили врагов наших на поле боя и закололи их на их территорию; мы возьмем у нас оружие их и имущество их, а они будут смиренными за то, что превозносились над нами."
 raiding.2.d: "После долгих боёв рейд закончился, и нам мало что нужно показать, но, по крайней мере, это не прямое поражение."
 raiding.3.d: "Столкнувшись с жестким сопротивлением, наши силы были выброшены с территории противника, и после их отступления остались следы жертв и трупов."
 raiding.4.d: "Вражеские силы прорвались по нашим линиям и проникли в наши земли, грабили и грабили по мере их поступления, хотя они, по крайней мере, ушли после этого, они забрали с собой ценные ресурсы, которые мы не можем себе позволить, многие теперь сомневаются в своей безопасности под руководством нашего правительства."
 raiding.5.d: "После продолжительных боев нам удалось остановить атакующие силы до тех пор, пока не сложится тупик."
 raiding.6.d: "Наши героические силы сумели сразиться с врагом, отправив их в дезорганизованное отступление, в результате которого у нас осталось ценное оборудование."
 no_more_raiding_tooltip: "§R Вы больше не сможете напасть. §R"

