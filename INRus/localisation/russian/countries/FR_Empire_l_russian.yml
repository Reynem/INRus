 ukempire.4b.d: "Вчера вечером правительство Новой Зеландии выступило с посланием в поддержку проводимой нашим правительством политики возрождения империализма во всем мире."
 ukempire.5a.d: "Недавно правительство Ньюфаундленда опубликовало официальную ноту протеста в связи с нашим выбором возобновить империализм в отношении продолжающейся изоляции."
 ukempire.5b.d: "Вчера вечером правительство Ньюфаундленда выступило с посланием в поддержку проводимой нашим правительством политики возрождения империализма во всем мире."
 ukempire.6.d: "Поздно вечером, когда британские войска продолжали свою полицейскую деятельность в Ирландии, канадское правительство направило нашему правительству послание с настоятельным призывом проявлять осторожность и терпимость при развертывании британских войск в Ирландии."
 ukempire.7.d: "Поздно вечером, когда британские войска продолжали свою полицейскую деятельность в Ирландии, австралийское правительство направило нашему правительству послание с настоятельным призывом проявлять осторожность и терпимость при развертывании британских войск в Ирландии."
 ukempire.8.d: "Поздно вечером, когда британские войска продолжали свою полицейскую деятельность в Ирландии, правительство Южной Африки направило нашему правительству послание с настоятельным призывом проявлять осторожность и терпимость при развертывании британских войск в Ирландии."
 ukempire.9.d: "Поздно вечером, когда британские войска продолжали свою полицейскую деятельность в Ирландии, правительство Новой Зеландии направило нашему правительству послание с настоятельным призывом проявлять осторожность и терпимость при развертывании британских войск в Ирландии."
 ukempire.10.d: "Поздно вечером, когда британские войска продолжали свою полицейскую деятельность в Ирландии, правительство Ньюфаундленда направило нашему правительству послание с настоятельным призывом проявлять осторожность и терпимость при развертывании британских войск в Ирландии."
 ukempire.11a.d: "В ответ на недавние политические события в нашей стране канадское правительство выразило свою озабоченность в связи с нынешней политикой, проводимой нашим новым правительством после кризиса в Манчестере, охватившего нашу страну."
 ukempire.11b.d: "В ответ на недавние политические события в нашей стране канадское правительство заявило о своей поддержке нашего правительства в наших усилиях по противодействию развитию социализма во всем нашем справедливом государстве."
 ukempire.12a.d: "В ответ на недавние политические события в нашей стране правительство Австралии выразило свою озабоченность в связи с нынешней политикой, проводимой нашим новым правительством после кризиса в Манчестере, охватившего нашу страну."
 ukempire.12b.d: "В ответ на недавние политические события в нашей стране правительство Австралии заявило о своей поддержке нашего правительства в наших усилиях по противодействию развитию социализма во всем нашем справедливом государстве."
 ukempire.13a.d: "В ответ на недавние политические события в нашей стране правительство Южной Африки выразило свою озабоченность по поводу нынешней политики, проводимой нашим новым правительством после кризиса в Манчестере, охватившего нашу страну."
 ukempire.13b.d: "В ответ на недавние политические события в нашей стране правительство Южной Африки заявило о своей поддержке нашего правительства в наших усилиях по противодействию развитию социализма во всем нашем справедливом государстве."
 ukempire.14a.d: "В ответ на недавние политические события в нашей стране правительство Новой Зеландии выразило свою озабоченность в связи с нынешней политикой, проводимой нашим новым правительством после кризиса в Манчестере, охватившего нашу страну."
 ukempire.14b.d: "В ответ на недавние политические события в нашей стране правительство Новой Зеландии заявило о своей поддержке нашего правительства в наших усилиях по противодействию развитию социализма во всем нашем справедливом государстве."
 ukempire.15a.d: "В ответ на недавние политические события в нашей стране правительство Ньюфаундленда выразило свою озабоченность в связи с нынешней политикой, проводимой нашим новым правительством после кризиса в Манчестере, охватившего нашу страну."
 ukempire.15b.d: "В ответ на недавние политические события в нашей стране правительство Ньюфаундленда заявило о своей поддержке нашего правительства в наших усилиях по противодействию развитию социализма во всем нашем справедливом государстве."
 ukempire.16a.d: "Сейчас, когда восстание в Восточной Африке продолжается, правительство Южной Африки обратилось в Вестминстер с предложениями о военной помощи в борьбе с опасными повстанцами в наших колониях."
 ukempire.16b.d: "Сейчас, когда восстание в Восточной Африке продолжается, правительство Южной Африки обратилось в Вестминстер с открытой политической поддержкой наших усилий по прекращению беспорядков в наших колониях."
 ukempire.17.d: "Поскольку угроза войны продолжает неуклонно расти по всему миру, наши друзья в Канаде запросили дополнительную помощь в укреплении их военно-морских позиций в Тихом океане и Северной Атлантике в виде дополнительных военно-морских судов."
 ukempire.18.d: "Наша страна в настоящее время осаждается жестокими революционерами и радикалами, и в ней растет беспокойство не только в нашей стране и правительстве, но и в наших Доминионах за рубежом. Несмотря на то, что сегодня утром стали распространяться слухи о том, что королю доставляют записку от канадских премьер-министров, в настоящее время неизвестно, что именно было сказано в письме, тот факт, что было направлено королю, а не нашему собственному правительству, поднял более чем несколько бровей."
 ukempire.19.d: "Последствия ЛМСК по-прежнему ощущаются во всем мире и во всей империи по мере того, как годы сжимаются, и при этом достигается различная степень успеха в урегулировании самого кризиса на всей нашей территории."
 ukempire.20.d: "С нашей неспособностью должным образом взять на себя обязательство предоставить автономию странам Доминиона, как это было обещано на Имперской конференции 37-го года, штаты Доминиона сделали совместный политический отпор нашей нации, пытаясь заставить нас согласиться с их требованиями. Несмотря на откладывание осуществления дальнейшей автономии, со временем эти последствия будут только усугубляться."
 ukempire.21.d: "С тех пор, как Лео Амери вновь занял пост первого лорда Адмиралтейства, он провел в Королевском военно-морском флоте множество реформ, направленных на содействие развитию и модернизации его сил. До сегодняшнего утра в нашем правительстве, несмотря на слухи о том, что Эмери злоупотреблял своим положением в правительстве, чтобы поддержать Движение за «круглый стол», политическое движение, подталкивающее к созданию имперской федерации. Сегодня утром эти доклады были подтверждены как фотографии, на которых он присутствовал на одном из этих совещаний Движения за круглым столом в Лестере вместе с некоторыми влиятельными мыслителями по всей империи. Несмотря на то, что у него уже были оговорки в отношении Амери и его позиции, он, естественно, призвал к его отставке, хотя такой акт представляется ненужным. Вместо этого премьер-министр считает, что у правительства есть два варианта в ответ на этот вопрос, мы можем либо попросить Эмери прекратить эти встречи и угрожать его отставкой, если он будет упорствовать, либо мы можем поддержать его усилия по созданию более широкого политического влияния на Движение «круглый стол»."

 empire.1.d: "Вчера днем, после интенсивной дискуссии в ходе Имперской конференции этого года, британское правительство опубликовало официальное заявление, в котором заявило, что оно намерено добиваться возрождения империализма по всему миру."
 empire.2.d: "Поздно ночью Вестминстер объявил о развертывании британских войск на улицах Ирландии, с тем чтобы раздавить остающиеся сирпичные ячейки на Ирландских островах, что во многом отражает сцены Пасхального Восстания, при виде британских войск на ирландских улицах многие ирландские граждане Империи, в том числе без нашей собственной нации, столкнулись с шоком и гневом. Наше правительство считает необходимым выпустить записку о своей озабоченности для Британии, с тем чтобы ограничить политические последствия в нашей собственной стране и дистанцироваться от своих действий."
 empire.3a.d: "После нескольких недель волнений по Британским островам, завершившихся широкомасштабными беспорядками по всей столице, британское правительство официально ушело, дав королю возможность официально распустить парламент и захватить контроль над Великобританией. Несмотря на то, что король застал врасплох многих врасплох, король быстро подавил остающиеся беспорядки по всему Соединенному Королевству, введя жесткий комендантский час и сохранив военное право в ряде городов на неопределенный срок. Несмотря на то, что многие вздыхают от радости по всей Империи, многие еще больше обеспокоены тем, что сегодня знаменуют собой начало волны авторитаризма, которая, якобы, защитит народ, но на самом деле используется королем Эдуардом VIII в качестве оправдания для навязывания своего взгляда на Империю."
 empire.3b.d: "После нескольких недель волнений по Британским островам, завершившихся широкомасштабными беспорядками по столице Великобритании, британское правительство не смогло положить конец кризису, охватившему Соединенное Королевство, скорее оно будет оставлено британским вооруженным силам для этого, причем британские вооруженные силы будут нести ответственность за это обвинение путем штурма палат парламента. Несмотря на то, что с тех пор король оставался тихим вне своей критики тех политических деятелей, которые поддерживают бунтовщиков, считается, что он оказывает мирную поддержку вооруженным силам в их стремлении восстановить порядок в Британии."
 empire.4.d: "В последние недели в нашей стране набирает силу бывшая политическая экстремистская группа; Движение за круглый стол. no Advocation for the Impire Federation of the Empire, данная группа создала несколько домов в нашей стране, чтобы привлечь влиятельных политиков и мыслителей в свои ряды. До сих пор ее последствия были незначительными и, что удивительно, позитивными. Поскольку многие ее члены являются твердыми сторонниками правительства нашей нации и самой империи."

 safempire.1.d: "По мере того, как Восточная Африка Великобритании превращается в анархию, вызванную жестокими волнениями по указанию движений за независимость, многие в нашем собственном правительстве ставят под сомнение нашу позицию по этому вопросу. Поддержка Британии , будь то в военном или политическом плане, несомненно, будет благосклонна в Лондоне, но не будет втягивать себя в это дело, укрепит нашу политическую позицию в стране."
 safempire.2.d: "С учетом того, что восстание в Восточной Африке наконец положило конец британским и нашим собственным силам, наши консультативные элементы вернулись домой, приведя с собой опыт борьбы на грубой местности против повстанческих элементов, что, несомненно, поможет развитию нашей армии."

 canempire.2a.d: "По просьбе нашего правительства Великобритания поручила Королевскому военно-морскому флоту послать нам несколько кораблей, чтобы помочь укрепить наши военно-морские силы в Северной Атлантике и Тихом океане."
 canempire.2b.d: "Несмотря на нашу просьбу об оказании помощи, Вестминстер решил отказаться от нашего призыва о помощи и вместо этого поручил нам улучшить портовые сооружения для Королевского флота в регионе."
 canempire.3.d: "По мере того, как новости о развитии событий в Британии продолжают выходить в мир, в нашей стране растет чувство тревоги относительно судьбы правительства в Лондоне. Несмотря на то, что радикалы и революционеры напали на правительство, к тому времени, как оно будет свергнуто насильственным протестом, наше государство, будучи старшим членом Империи, возьмет на себя административные обязанности и руководство на своих отдаленных территориях. Некоторые из тех, кто находится в нашем правительстве, надеются, что король сделает шаг к тому, чтобы правительство в Вестминстере пошло на попятную через его королевскую прерогативу. Такой акт, несомненно, будет дестабилизировать, но если выбор между этим или революцией, есть вообще какой-то выбор?"

 ausempire.1.d: "Поскольку последствия кризиса на Лондонском фондовом рынке продолжают оказывать серьезное воздействие на нашу страну, в парламенте было выдвинуто множество возможных вариантов урегулирования кризиса."
 ausempire.2a.d: "Сегодня утром британское правительство информировало нас о том, что оно согласится направить нам экономическую помощь, с тем чтобы помочь сократить последствия кризиса на Лондонском фондовом рынке."
 ausempire.2b.d: "Сегодня утром британское правительство официально ответило на нашу просьбу об экономической помощи, заявив, что оно не может направить нам экономическую помощь, которую они не обязаны предоставлять, сославшись на тяжелое экономическое положение в Великобритании в качестве причины для отказа в какой-либо помощи."
