 ##### Events #####

 ukempire.1a.d: "Недавно канадское правительство опубликовало официальную ноту протеста в связи с нашим выбором возобновить империализм в отношении продолжающейся изоляции."
 ukempire.1b.d: "Вчера вечером правительство Канады выступило с посланием в поддержку проводимой нашим правительством политики возрождения империализма во всем мире."
