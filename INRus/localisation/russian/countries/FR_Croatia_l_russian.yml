 ###Events###

 cro.1.t: "Хорватская война за независимость!"
 cro.1.d: "Венгры не хотят вести переговоры и идти на компромисс, мы должны взять нашу зависимость силой!"
 cro.1.a: "Хорватия навсегда!"
 ###
 cro.2.t: "Сербия объявляет войну!"
 cro.2.d: "Хорваты в Боснии недавно присоединились к нашему делу, и теперь Сербия объявила войну с намерением вновь захватить земли."
 cro.2.a: "Хорватия навсегда!"
 ###
 cro.3.t: "Италия объявляет войну!"
 cro.3.d: "Далматия присоединилась к нашему государству не так давно, и итальянцы решили, что единственным решением является военное вмешательство."
 cro.3.a: "Хорватия навсегда!"
 ###
 cro.4.t: "Наши враги предлагают мир."
 cro.4.d: "Мы выжили, несмотря на все разногласия и с врагами со всех сторон, и наши враги не могут нарушить нашу железную волю. Объединенная делегация сербских, венгерских и итальянских дипломатов направила официальное мирное письмо. Условия вполне разумны; мы оставляем все районы, которые мы оккупировали во время войны, и они тоже. Большое хорватское государство выживает, и наша мечта была реализована."
 cro.4.a: "Хорватия навсегда!"

 ###Ideas###
 CRO_demilitarised_nation: "Демилитаризованная нация"
 CRO_demilitarised_nation_desc: "В связи с разрывом Хорватии между тремя державами после Великой войны, "Согласие" выбрало компромиссное решение - нейтральную Хорватию без военных, и единственными военнослужащими на нашем побережье являются итальянские войска, в результате чего у нас нет армии, хотя слухи о тайной подготовке хорватской армии, готовой защищать маленькую балканскую нацию..."
 cro_united_revolt: "Объединение в восстании"
 cro_united_revolt_desc: "Все хорваты едины в нашем великом восстании против наших хозяев."

