 ### Characters ###
 TIB_nicholas_roerich: "Николас Ройрих"
 TIB_nicholas_roerich_leader_desc: "Николас, воспитанный аристократической семьей Рёриха в Санкт-Петербурге, проявил интерес как к эстетической, так и к духовной стороне социалистической революции. Октябрьская революция положила конец общественному миру, который знал Николас, и приблизила Николаса к консерватории и ориентации против Владимира Ленина. Николас Рорих сбежал в Соединенные Штаты и присоединился к Теософическому обществу. Духовное движение, которое разделяло восхищение Рориха неразвитыми нациями как «более духовно чистыми», чем западными нациями. Рёрик поехал в Theosophic Wachtherian Society that the Back the Walking Communice and British Dominion, в 1930 году. Это был потрясающий разговор с Ганди. Ганди, выраженный Роричу, что Владимир Ленин не был против традиционной культуры, а против коррумпированных лидеров традиционных институтов."

 TIB_thubten_kunphela: "Tubten Kunphela"
 TIB_the_9th_panchen_lama: "Девятая панчен-лама"
 #TIB_the_9th_panchen_lama_leader_desc: "Девятая Панхен-Лама родилась Чоуки Ниима в классе Тубен в Шигатсе, Тибет, воспитанная и образованная престижным монастырем Таши Лунпо, молодая Чоукий Ньима должна была стать «стипендиатом» в Далай-Ламе. Он был на время, которое хорошо уважал Генден-Фодранг. Девятая Панчен-Лама встречалась с радикальной ламой Агваном Доржиевым, учила его молиться Шамбале. Эта молитва предназначалась для того, чтобы собрать союзников буддизма в центр мира, вымышленный город Шамбала. Политические реалии появились в 1924 году, когда 13-й Далай-Лама занимался модернизацией своей армии. Далай Лама потребовала большего налогообложения от Панхен-Ламы в качестве связанного с ним фестиваля. Когда Панчен-лама отказался, Далай Лама отреза отреза и конфисковал имущество Панхена Ламы. В результате конфликта Панхи Ламаха отправился в Монгону в Монгону, в 1924 году."

 TIB_the_14th_dalai_lama: "14-й Далай-лама"
 TIB_the_14th_dalai_lama_leader_desc: "Ребёнок по имени Лхамо Тондуп вырос в маленькой деревне От Такцер в Амдо, весьма спорной области. Ребёнок был младшим из семи, в том числе его брат Тубтен Джигме Норбу, который был признан Такстером Ринпоче в 1925 году. Молодой Далай Лама был избран после представления Регента о том, что новый Далай Лама родился в Амдо. Молодой Далай Лама был доставлен в Лхасу, где в ближайшие годы ему будут даны инструкции по всем аспектам тибетского буддизма, и медленно получил влияние от реакции."

 TIB_tsipon_lungshar: "Ципён Лунгшар"
 #TIB_tsipon_lungshar_leader_desc: "Тсипён Лунгшар из семьи, которая служила Далай-ламе с XVIII века и имеет глубокие связи с Лхазой. Лунгшар был выбран для того, чтобы контролировать элитное образование четырех дворян под названием "Ругби Четвёртый" в Великобритании до вспышки Велткрига. Лунгшар стоял между более радикальными дворянами, такими как Тубен Кунфела и Тримён в первые годы Регенции. Лунгшар обвинял Тубен Кунфелу в организации проникновения иностранцев в Тибет в 1933 году, что привело к его изгнанию. Однако Лунгшар также выступил против власти Реджинса, особенно их могущественного тримён. Тримён организовал судебный процесс, в ходе которого Лунгшар был обвинен в социалистическом статусе, а затем ослеплен до того, как был изгнан в Сикким. Революция спасла жизнь Лунгшара и позволила ему вернуться в Тибет и обнаружила умеренную политическую партию, стремящуюся сбалансировать потребности демократии с традициями Тибета."

 TIB_tsarong_dzasa: "Царонг Дзаса"
 #TIB_tsarong_dzasa_leader_desc: "Когда 13-й Далай-лама решил модернизировать армию в 1923 году, он поставил дворянина Царонга Дзасу во главе с недавно созданным Дмаг-Сгаром. Царонг ранее имел очень успешную карьеру, возглавляющую Доб-Добс в защите Тибета от Цин во время революции в Синьхайе. Против Царонга получил имя «Херо Чаксам», и он использовал свою популярность для увеличения национального бюджета Тибетской армии. Это косвенно вызвало изгнание Панчен-Ламы в 1924 году. Смерть 13-го Далай Ламы покинула страну под контролем Регента, во главе с 5-м Ретингом Ринпоче и Тримёном. Царонг был демотивирован от главнокомандующего до гражданского инженера и казначея, но это не остановило его популярность. Тримён был первоначально счастлив, когда Царон уехал в Утсанг, вместе со своим молодым тиранским движением, но теперь Тримён находится в тюрьме Потала, в то время, когда Царонг фактически занял свою должность. Пятая Рей Рей Ринга в настоящее время не может служить лишь в качестве Регенга."

 TIB_the_5th_reting_rinpoche: "5-й ретинг Rinpoche"
 TIB_the_5th_reting_rinpoche_leader_desc: "Тобтен Ямпель Йеше Гяльтсен: благородный человек, друг 13-го Далай-ламы и регент Тибета. Пятое Ретинг Ринпоше председательствовал в бурный период в тибетской истории, когда было обнаружено множество изгнаний, пыток и сильной зависимости от главнокомандующего Тримёном, чтобы остаться у власти. Тем не менее, Ретинг Ринпоче стоял за продолжением повышения налогов Тримёном и является самым законным лидером Тибета до тех пор, пока не будет найден 14-й Далай-лама. Ретинг Ринпош продолжает удерживать Гендена Фодранга, будучи уверенным, что его друг Далай Лама будет разрушен покорным иностранным табелем, будь то от британских индейцев, китайцев или мусульман Хуи."

 TIB_chao_kung: "Чао Кунг"

 TIB_changra: "Чанра"
 
 #TIB_changra_leader_desc: "§L\n1878\n §Y Political Profile: §L\nBorn с личным именем Вангчук Тархин, Чанра в 1902 году вошёл в правительственную церемонию, в конце концов служил непосредственно под Далай-ламой. Чангра получил звание де-псна и командовал частными телами 13-й Далай-ламы. После кончины Далай-ламы Чанра считался главнокомандующим тибетской армией, но был принят за более ревностную Тримён. Чандра, как утверждается, была жесткой политической личностью, но не имеет политического влияния."

 TIB_trimon: "Тримён"
 #TIB_trimon_leader_desc: "В 1912 году Тримён был назначен помощником главнокомандующего Тибетской армией во время китайского пограничного кризиса. Тримон был одним из немногих тибетских дипломатов, присутствовавших на Симльской конвенции 1914 года, и встретился с лордом Хардинге. Тримён вернулся в Тибет, чтобы стать комиссаром Восточного Тибета, где он раздражал Кашага своей непоколебимой изолирующей позицией. В последний год 13-й Далай-Ламы Тримён напал на махинации Люншара и лично убедил стареющего Далай-Ламуа приказать Лунгшару ослепить за свои либеральные планы. Тримён использовал эту политическую связь для того, чтобы сблизиться с регентом, молодым Жампелем Ешхе Гьяльтсеном. Тримён оказал давление на молодого регента в связи с его обособленным взглядом на Китай и Индию."

 TIB_huang_musong: "Хуан Мусонг"
 #TIB_huang_musong_commander_desc: "В 1927 году Хуанг был назначен членом Национальной инспекционной комиссии по вопросам обороны и отправился в Монголию и Синьцзян. После этого Хуан попытался вступить в политику Бейянга, став директором Комитета по обзору маршрутов министерства транспорта, но в конечном итоге был переведен в Синьцзян, а в 1927 году он вновь был переведен в Синьцзян, и его бездействие в северном экспедиции лишь ослабило репутацию Хуанга. Хуанг провел еще несколько лет на службе подземной КМТ в Синьцзяне, где он вступил в контакт с Шэнь Шицай и Джин Шурен. Доклады Хуанга в левый КМТ, в которых говорилось, что оба администратора являются подходящими патриотами, остались без ответа в партии. Хуанг посетил Тибет после 13-й смерти Далай Ламы в 1934 году и обнаружил, что большинство потенциальных союзников Кхара была выслана в штаб-квартиру."
 #TIB_huang_musong_country_leader_desc: "Выпускник Ят-Сенского военного университета Японии, Хуан Мусонг (родился Хуан Рухай) принял участие в восстании в Вучанге и вскоре достиг высокопоставленных постов в армии Куоминтанга. С 1913 года он был отправлен в дальние районы Республики, Монголии и Синьцзян, чтобы представлять там интересы КМТ. После провала Северного экспедиции он провел свое время в изгнании, скрываясь в Синьцзяне. Его связь с Тибетом началась, когда он посетил район после смерти 13-го Далай Ламы, и он смог встретиться с некоторыми из немногих союзников КМТ в Тибете, большинство из которых находятся в изгнании в Индии. В течение многих лет он стал экспертом в рамках КМТ по этим местным делам, и в результате этого был назначен председателем Комиссии по делам Монголии и Тибета возрожденным правительством КМТ. После падения Тибета на национальную революцию он был направлен лично для осуществления надзора за управлением Тибетом в соответствии с тремя принципами, только номинально возглавляя китайскую легацию в Лхасе, что делает его наиболее влиятельными силами КМТ в районе Тибета."

 TIB_ngapoi_ngawang_jigme: "Нгапой Нгаван Джигме"

 TIB_dingja: "Дингя"
 #TIB_dingja_commander_desc: "§L\n/nBorn с личным именем Dorji Gyaltsen, Dingja был одним из потенциальных кандидатов знаменитого «Rugby Four» для обучения за рубежом. После того, как Дингя не был выбран, в 1917 году стал почтмейстером Тибета. Дингя прикрепился к восходящей звезде Царонг, женившись на своей сестре. Этот статус позволил ему организовать продвинутую подготовку по стрельбе на английском и индуистском языках. Дингя был назначен генералом в 1923 году и был демобилизован в 1925 году из-за его либеральных взглядов. После смерти 13-й Далай Ламы Дингя пытался организовать покупку оружия у британского Раджа, но был отвергнут новым главнокомандующим Тримёном. Чтобы убедиться, что Дингя не расстроил далее Лхаса, Тримён был назначен Дингджей в 1935 году лидером Dobs of Shigatse, якобы для того, чтобы защитить их от возможного возвращения Ламы."

