 sovietscorched.6.t: "Северная Скандинавия начинает восстанавливаться"
 sovietscorched.6.d: "Наша Земная Тактика дорого обошлась народу Северной Скандинавии. Похоже, что сейчас, когда регион начинает восстанавливаться, а местные жители начинают возвращаться к своим обычным повседневным обычаям. В то время как сожжение этого региона по-прежнему вызывает споры, тактика имеет решающее значение для защиты нашей нации и революции. Но, когда память о войне постепенно исчезает в прошлом, мы можем воспользоваться этой возможностью и начать восстанавливать Северную Скандинавию к ее прежней славе."
 sovietscorched.6.a: "Ваши имена могут быть неизвестны, но ваши деяния бессмертны."
 #
 sovietscorched.7.t: "Северный фронт начинает восстанавливаться"
 sovietscorched.7.d: "Наша Земная Тактика дорого обошлась народу Северного фронта, и, похоже, теперь, когда регион начинает восстанавливаться, а местные жители начинают возвращаться к своим обычным повседневным обычаям, в то время как сожжение этого региона по-прежнему вызывает споры, тактика имеет решающее значение для защиты нашей нации и революции. ~ ~по мере того, как память о войне постепенно исчезает в прошлом, мы можем воспользоваться этой возможностью и начать восстанавливать Северный фронт к его прежней славе."
 sovietscorched.7.a: "Ваши имена могут быть неизвестны, но ваши деяния бессмертны."
 #
 sovietscorched.8.t: "Арктическая Россия начинает восстанавливаться"
 sovietscorched.8.d: "Наша Земная Тактика дорого обошлась своему народу в Арктике. Похоже, что сейчас, когда регион начинает восстанавливаться и местные жители начинают возвращаться к своим обычным повседневным рутинам. В то время как сожжение этого региона остается спорным вопросом, тактика имеет решающее значение для защиты нашей нации и революции. По мере того, как память о войне постепенно исчезает в прошлом, мы можем воспользоваться этой возможностью и начать восстановление Арктической России к ее прежней славе."
 sovietscorched.8.a: "Ваши имена могут быть неизвестны, но ваши деяния бессмертны."
 #
