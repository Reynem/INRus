 RUS_mikhail_tukhachevsky: "Михаил Тухачевский"
 #RUS_mikhail_tukhachevsky_FRA_commander_desc: "Общее описание §YBorn: §L\n16 февраля 1893 года, Александровский, провинция Смоленск, Российская империя"
 #RUS_mikhail_tukhachevsky_commander_desc: "В 1912 году Михаил Тухачевский вступил в состав кадетского корпуса Русской имперской армии, мухафаза Смоленск, Русская империя §n §Военная карьера: §L\nBorn, чтобы опустошить русскую вежливость о слухах о фламандском крестоносном происхождении, Михаил Тухачевский стал членом кадетского корпуса Русской Имперской Армии. Даже в юном возрасте он не был амбициозным, как только началась велькрица, он с гордостью заявил, что он либо будет генералом в тридцать или мертвым к тому времени. После того, как он проявил мастерство и храбрость на Восточном фронте, Тухачевский выполнил эту цель, но не так, как он ожидал. Он вступил в Красную Армию в качестве добровольца и быстро поднялся, став близким помощником Леона Троцкого и достиг ранга генерала, выступившего недолго после убийства Ленина. Он был одним из лучших подразделений Красной армии, но в конечном итоге был побежен Владимиром Каппел."

