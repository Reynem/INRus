 SOV_defense_of_the_revolution: "Защита революции"
 SOV_construction_of_the_stavka: "Строительство Ставки"
 SOV_train_new_generals: "Подготовка новых генералов"
 SOV_the_motherland_needs_you: "Ты нужен Родине!"

 SOV_collectivization_decision: "Объединение"
 SOV_collectivization_decision_desc: "Мы начали масштабную кампанию по коллективизации сельского хозяйства, направленную на социализацию земли, скота и оборудования."
 SOV_peasants_emigration_cities: "Железнодорожники, бежавшие на коллективных фермах"
 SOV_peasants_emigration_cities_desc: "Из-за ужасных условий на фермах, а также из-за советской пропопаганды, прославленной городами, крестьяне сбегают из коллективных ферм."
 SOV_create_internal_passport: "Создание внутреннего паспорта"
 SOV_create_internal_passport_desc: "Советский Союз обязал крестьян, которые хотят покинуть коллективную ферму и переехать в города для получения паспорта, предотвратить массовую эмиграцию крестьян с сельскохозяйственных земель в города."
 SOV_retreat_from_collectivization: "Отступление от коллективной работы"
 SOV_retreat_from_collectivization_desc: "Мы прекратим коллективизацию после того, как станем "счастливыми с успехом"."
 SOV_siberian_ural_method: "Уральский и сибирский метод"
 SOV_siberian_ural_method_desc: "Мы постараемся выкачать зерно из сельской местности на основе попыток разжечь классовую войну в деревне."
 SOV_intensifaction_of_repressive_measures: "Активизация мер по репрессиям"
 SOV_intensifaction_of_repressive_measures_desc: "Если мы хотим, чтобы коллективизация продолжалась, нам нужно будет усилить репрессии."
 SOV_creating_the_25_thousand: "Создание двадцати пяти тысяч"
 SOV_creating_the_25_thousand_desc: "Мы научились так думать: без борьбы ты ничего не можешь достичь."
 SOV_Force_middle_peasants_into_collective_farms: "Принуждение среднестатистических фермеров к вступлению в коллективные фермерские хозяйства"
 SOV_Force_middle_peasants_into_collective_farms_desc: "Если мы хотим, чтобы коллективизация увенчалась успехом, тогда нам понадобятся средние крестьяне, чтобы присоединиться к коллективным фермам."
 SOV_creating_secrete_reserves: "Создание секретного заповедника для помощи в сборе"
 SOV_creating_secrete_reserves_desc: "Мы создадим секретные резервы рабочих, комсомолов и коммунистов для помощи в декулакизации и для использования в дополнение к резервным войскам ОГПУ, прибывающим из Москвы и Ленинграда на север и в Уралы."
 SOV_seizing_kulak_savings: "Сбережение семей кулаков"
 SOV_seizing_kulak_savings_desc: "Мы возьмем сбережения семей кулаков свыше 500 рублей, эти сбережения переведут в финансовый комиссариат."
 SOV_exiling_kulaks: "Исчезшие семьи"
 SOV_exiling_kulaks_desc: "Мы изгоним кулаков, которые считаются частью второго класса кулаков."
 SOV_strengthening_border_guards: "Укрепление пограничной охраны"
 SOV_strengthening_border_guards_desc: "Мы укрепим пограничников, с тем чтобы предотвратить незаконную иммиграцию."
 SOV_finding_kulaks: "Поиск Кулакса"
 SOV_finding_kulaks_desc: "Мы усилили наблюдение за ночными приютами, сезонными рабочими, общежитиями, чайными домами, вокзалами, и особенно за закусочными домами."
 SOV_Liquidating_unsuccessful_collective_farms: "Ликвидация неуспешных коллективных фермерских хозяйств"
 SOV_Liquidating_unsuccessful_collective_farms_desc: "Нам нужно ликвидировать "ложные коллективные фермы", так как они не смогли быть достаточно успешными."

 SOV_great_patriotic_war_decision: "Великая патриотическая война"
 SOV_great_patriotic_war_decision_desc: "Империалисты наконец начали атаку на Советский Союз, чтобы потушить пламя революции, но мы будем защищать его любой ценой!"
 SOV_unite_the_left: "Объединенный фронт"
 SOV_unite_the_left_desc: "Нам всем нужно держаться вместе, иначе революция будет разрушена."
 SOV_lessing_production_standards: "Снижение производственных стандартов"
 SOV_lessing_production_standards_desc: "Это не качество важно!"
 SOV_mobilization: "Приготовиться к массовой мобилизации"
 SOV_mobilization_desc: "Мы должны мобилизовать экономику, чтобы иметь шанс против империалистов!"
 SOV_relocate_industry_from_moscow: "Перебазирование промышленности из Москвы"
 SOV_relocate_industry_from_leningrad: "Перебазирование промышленности из Москвы"
 SOV_fortifying_moscow: "Укрепление Москвы"
 SOV_fortifying_moscow_desc: "Мы не позволим им получить Москву!"
 SOV_no_time_for_luxus: "Нет времени для Лаксуса!"
 SOV_no_time_for_luxus_desc: "Мы должны сосредоточиться на военном производстве!"

 SOV_industry_decision: "Экономика"
 SOV_industry_decision_desc: "Если мы хотим затмить империалистов, нам нужно индастриализировать и модернизировать нашу нацию!"
 SOV_breakneck_industrialization: "Индустриализация рассвета"
