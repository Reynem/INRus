 SOV_infrastuctre_desc: "Если мы хотим решить продовольственную ситуацию и, наконец, модернизировать нашу нацию, нам нужно будет резко расширить наш инфракрасный потенциал."
 SOV_modernized_cities: "Современные города"
 SOV_modernized_cities_desc: "Наконец, наиболее важные города сопоставимы с нашими западными партнерами, что резко расширяет нашу промышленную продукцию."
 SOV_helping_people: "Помощь людям"
 SOV_helping_people_desc: "Мы создали народный кредит, чтобы помочь безработным снова встать на ноги, чтобы они могли получить работу, когда индустриализация будет закончена."
 SOV_modernized_equipment: "Модернизированное оборудование"
 SOV_modernized_equipment_desc: "С началом индустриализации мы нашли работу для многих безработных, но нам нужна была современная техника для достижения наших целей, поэтому мы решили инвестировать в новое современное оборудование, которое поможет нам улучшить показатели в этой отрасли."
