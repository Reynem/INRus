 SOV_foreign_decision: "Внешняя политика"
 SOV_foreign_decision_desc: "По мере роста угрозы нашей безопасности стало очевидно, что судьба нашей страны находится под угрозой, и для обеспечения нашей безопасности в эти опасные времена очевидно, что нам необходимо распространить свое влияние на соседние страны с целью получения ресурсов, создания буферных государств и обеспечения единства нашей нации."
 SOV_demand_tannu_tuva: "Спрос [329. Найти имя]"
 SOV_supporting_spain: "Поддержка социалистов в Испании"
 SOV_announce_claims: "Объявите о наших претензиях"
 SOV_announce_claims_desc: "Теперь, когда наша страна индустриализации, у нас есть сила заявить и заявить о своих претензиях нашим соседям и за их пределами."
 SOV_Germany: "Борьба с гуннами"
 SOV_Germany_desc: "Эти проклятые немецкие валькисты увидят, как истинный [ROOT.Adquestive Cap] имеет дело с варварами."
 SOV_Poland: "Открытие врат в Европу"
 SOV_invade_finland: "Спросить приграничные районы Финляндии"
 SOV_invade_finland_desc: "Во время гражданской войны белые финские войска оккупировали район Ладоги Карелии и Карелианского перешейка, которые находятся всего в нескольких милях от нашего Балтийского метрополиса Ленинграда, нашего основного доступа к мировым океанам. Для обеспечения нашего военно-морского доступа к Балтии мы должны создать более прочный буфер между нами и Финляндией."
 SOV_invade_ukraine: "Схватить Украину"
 SOV_invade_ukraine_desc: "Во время Гражданской войны в России Украинская Народная Республика при поддержке Согласия смогла обрести свой суверенитет, и это не может оставаться в силе!"
 SOV_invade_latvia: "Вторжение в Латвию"
 SOV_invade_latvia_desc: "Балтийский регион когда-то был неотъемлемой частью старой российской империи, и как наследники этой империи, мы можем притязать на различные государства, которые были поддержаны западными державами, и переинтегрировать их в наш союз там, где они действительно принадлежат."
 SOV_invade_estonia: "Вторжение в Эстонию"
 SOV_invade_estonia_desc: "Балтийский регион когда-то был неотъемлемой частью старой российской империи, и как наследники этой империи, мы можем притязать на различные государства, которые были поддержаны западными державами, и переинтегрировать их в наш союз там, где они действительно принадлежат."
 SOV_invade_transcaspian: "Революция в Туркестане"
 SOV_invade_transcaspian_desc: "С тех пор как Гражданская война закончилась 20 лет назад, Туркестан управляется авторитарными и отсталыми режимами, люди живут в полной нищете, подчиняясь абсолютному правлению своего диктатора, и пора показать этому сельскому региону плоды социализма."
 SOV_invade_kyrgyzstan: "Революция в Кыргызстане"
 SOV_invade_kyrgyzstan_desc: "С тех пор как Гражданская война закончилась 20 лет назад, Кыргызстан управляется капиталистическими режимами, люди живут почти в полной нищете, будучи в состоянии абсолютного правления капитала, пора показать этому сельскому региону плоды социализма."
 SOV_invade_russia: "Завоевать Российскую Республику"
 SOV_invade_russia_desc: "По завершении Гражданской войны в России многие из побежденных белых бежали в «Русскую» республику в Чите, это государство является лишь свидетельством реакционного обязательства подчинить рабочий класс, чтобы, наконец, укрепить наш суверенитет и обеспечить нам доступ к Тихому океану, мы должны уничтожить остатки белых."
 SOV_invade_mongolia: "Вторжение в Монголию"
 SOV_invade_mongolia_desc: "Монголия изолирована от мира и не будет бороться за то, чтобы дать свет цивилизации в свою страну, а это также распространит наше влияние на Китай."
 SOV_invade_checnya: "Горная Республика"
 SOV_invade_checnya_desc: "Для начала нашей кампании на Кавказе крайне важно обеспечить наше присутствие и влияние в Горной Республике Северного Кавказа."
 SOV_invade_georgia: "Футольд в Грузии"
 SOV_invade_georgia_desc: "Грузия, сердце Кавказа, является ключевым местом для наших амбиций на Ближнем Востоке."
 SOV_invade_azerbaijan: "Обеспечение безопасности азербайджанской нефти"
 SOV_invade_azerbaijan_desc: "Нефть является ключевым источником топлива любого современного государства. Все современные военные машины работают на ней, и по мере роста напряженности в Европе мы будем испытывать еще более острую потребность в этом ресурсе. Чтобы обеспечить наше будущее, мы должны получить контроль над Бакинскими нефтяными месторождениями."
 SOV_invade_armenia: "Подчинение Армении"
 SOV_invade_armenia_desc: "В какой-то момент Армения была самой южной точкой бывшей Российской империи."
 SOV_invade_belarus: "Возвращение Беларуси"
 SOV_invade_belarus_desc: "Благодаря полякам, Белоруссия сбежала от нас, этого больше не повторится."

 SOV_power_struggle: "Советская тройка"
 SOV_power_struggle_desc: "Смерть Ленина привела к возникновению вакуума власти, который угрожает расколом Союза. Трое мужчин стали руководить нашей страной в эти трудные времена, Вячеслав Молотов, Николай Бухарин и Григори Зиновьев. Хотя наше правительство стабильно сейчас, фундаментальные разногласия и амбиции между этими тремя мужчинами начинают подрывать их способность координировать и возглавлять Союз. Усилят ли они нашу Революцию или приведут к четвертой эпохе мощного руководства?"
 SOV_recruit_army: "Вестибюль для военной поддержки"
 SOV_recruit_army_desc: "Для того чтобы стать председателями Советского Союза, мы должны рассчитывать на поддержку советских военных, мы должны выступать в поддержку вооруженных сил, готовых сделать все возможное для защиты Революции от западных империалистов."
 SOV_bribe_politicians: "Политики Брибе"
 SOV_bribe_politicians_desc: "Наши амбиции требуют поддержки конгресса, если мы хотим достичь наших целей. чтобы наши враги сделали то же самое."
 SOV_public_speech: "Публичные выступления в конгрессе"
 SOV_public_speech_desc: "Мы должны продемонстрировать Советскому конгрессу, что мы можем встать и признать потребности как народа, так и правительства. Выступление с речью, иллюстрирующей нашу платформу, поможет нам достичь этой цели. Вам нужна поддержка Конгресса на 20% и менее 40% коррупции, чтобы принять это решение."
 SOV_campaign_union: "Политическая кампания"
 SOV_campaign_union_desc: "Наша победа против наших оппонентов в «тройки» потребует поддержки рабочих и местных политиков Советского Союза, политической кампании, хотя наш великий Союз поможет нам заручиться поддержкой пролетариата."
 SOV_promote_loyal_officers: "Назначить преданных должностных лиц"
 SOV_promote_loyal_officers_desc: "Теперь, когда наше влияние возросло внутри армии, настало время для того, чтобы мы продвигали политических союзников на высшие звания, чтобы еще больше укрепить верность армии."
 SOV_expel_dissedents: "Изъятие диссайдеров из Конгресса"
 SOV_expel_dissedents_desc: "Наш приход к власти в Советском Союзе не остался незамеченным в советском Конгрессе, хотя наши сторонники многочисленны, некоторые все еще видят в нас угрозу для нашей великой нации. Эти люди лишь подрывают наше правительство и должны быть изгнаны из конгресса, прежде чем они введут в заблуждение кого-либо еще."
 SOV_no_corruption: "Кампания по борьбе с коррупцией в правительстве"
 SOV_no_corruption_desc: "Несмотря на все наши усилия, многие стали замечать коррупцию в нашей политической фракции."
 SOV_political_support: "Нажим на Конгресс за политическую поддержку"
 SOV_political_support_desc: "Многие из наших политических целей требуют поддержки со стороны Конгресса Советов, чтобы добиться какого-либо реального прогресса. Мы должны надавить на нашу базу, чтобы она оказала нам поддержку и поддержку, необходимые для достижения наших амбиций. Вам нужна 20-процентная поддержка Конгресса, чтобы принять это решение."
 SOV_molotov_chairmen: "Провозгласи Вячеслав Молотов Председатели"
 SOV_molotov_chairmen_desc: "Теперь, когда Молотов и его фракция получили подавляющую поддержку Советского конгресса, пришло время официально провозгласить его Председателем Советского Союза, высшей власти в нашей стране."
 SOV_bukharin_chairmen: "Провозгласить Николая Бухарина"
 SOV_bukharin_chairmen_desc: "Теперь, когда Букарин и его фракция получили подавляющую поддержку Советского конгресса, пришло время официально провозгласить его Председателем Советского Союза, высшей власти в нашей стране."
 SOV_zinoviev_chairmen: "Провозгласить Леона Троцкого Председателя"
 SOV_zinoviev_chairmen_desc: "Теперь, когда Троцкий и его фракция получили подавляющую поддержку Советского конгресса, настало время официально провозгласить его Председателем Советского Союза, высшей власти в нашей стране."
 SOV_expel_molotov: "Изъятие Вячеслава Молотова из состава Конгресса"
 SOV_expel_molotov_desc: "Наш противник Молотов подрывает не только нас, но и Советский Союз в целом, мы должны использовать наши силы, как это предписано Конгрессом, чтобы изгнать этого диссидента из нашего славного Союза."
 SOV_expel_bukharin: "Избавьтесь от Николая Бухарина в составе Конгресса"
 SOV_expel_bukharin_desc: "Наш противник Бухарин подрывает не только нас, но и Советский Союз в целом, мы должны использовать наши силы, как это предписано Конгрессом, чтобы изгнать этого диссидента из нашего славного Союза."
 SOV_expel_zinoviev: "Выдворить Леона Троцкого в состав Конгресса"
 SOV_expel_zinoviev_desc: "Наш противник Леон Троцкий подрывает не только нас, но и Советский Союз в целом."

 SOV_kirov_vs_libsoc: "Противостояние мощности"
 SOV_kirov_vs_libsoc_desc: "§Hhliapvon §! вспыхнула между большевистами, возглавляемыми §Kirov§! и оппозицией рабочего, возглавляемой §HShliapvon §! Киров является кандидатом на статус-кво, единственная цель которого состоит в достижении целей Ленина, Шлиапников, с другой стороны, хочет дебюрократизировать экономику, укрепить демократию в Советском Союзе и реализовать другие идеи, которые очень близки к синдикативизму. Оппозиция рабочего надеется выиграть 26-й Конгресс, если они будут полезны, не может быть уверена..."
