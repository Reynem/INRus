 RUS_aleksandr_vasilevsky: "Александр Васильевский"
 # RUS_aleksandr_vasilevsky_commander_desc: "§L\n §YBorn: §L\n 30 сентября 1895 года, в Новой Голчихе, мухафаза Кострома, русская империя §Y Военная карьера: §L\nBorn для крайне бедной семьи священника в центральной российской сельской местности Васильевский закончил занятия в семинарии до Вельткрига и считал карьеру агронома, но его планы были изменены войной, которая, по его собственным словам,"overwhelmed him with patriotic feelings". He completed a course in military law and joined the front during the Brusilov Offensive, where he served with distinction and achieved the rank of captain, thanks to high casualties among his fellow officers leaving a vacancy to fill. The war left Vasilevsky sick, however, and he returned to his village after being demobilised in 1917, hoping to return to an agronomist's career.\n\nThat did not come to be, as in 1919, he ended up conscripted into the White Army and fought in the Volunteer Army during the last few months of the Russian Civil War. This time, Vasilevsky stayed, accepting a commission in the new Russian army and rapidly rising through the ranks. Considered to be one of the best organisers in the general staff and a grey eminence, he is seen by many as a vanguard of the new generation of Russian officers. In person, Vasilevsky is kind hearted, polite and extremely modest, to the point where he avoids mentioning his medals and assigns many of his achievements to the perceived brilliance of others."

 RUS_boris_shaposhnikov: "Борис Шапошников"
 # RUS_boris_shaposhnikov_commander_desc: "Задняя история Бориса Шапошникова, одного из самых талантливых генералов российского генерального штаба, до сих пор оставалась в основном загадкой. Самый известный вклад Шахникова в российскую армию является трёхмерной военной теорией под названием «Бравинская революция», в которой он подробно изложил свое мнение о будущем войны от имени Фэнни Каплана, вновь демобилизовав его и воссоединившись с российской армией в 1923 году. Самый известный вклад Шахникова в российскую армию является трёхмерной военной теорией под названием «Мозги армии», в которой он подробно изложил свое мнение о будущем войны."

