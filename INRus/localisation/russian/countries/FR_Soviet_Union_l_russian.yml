 unbalanced_economy_desc: "Наша экономика крайне несбалансированна в пользу сектора вооружений."
 unpopular_conscription: "Непопулярная воинская обязанность"
 unpopular_conscription_desc: "В то время как мы выполнили свои обещания в отношении хлеба и земли, мы не дали им мира, их надежда на прекращение призыва на военную службу и более мирную жизнь была полностью проигнорирована высшими должностными лицами, когда они никогда не отменяли призыв на военную службу, это привело к тому, что политика была очень непопулярной."
