 #
 sovietscorched.14.t: "Уральский район начинает восстанавливаться"
 sovietscorched.14.d: "Наша Земная Тактика дорого обошлась своему народу в Уралсской области. Похоже, теперь, когда регион начинает восстанавливаться, а местные жители начинают возвращаться к своим обычным повседневным обычаям. В то время как сожжение этого региона по-прежнему вызывает споры, тактика имеет решающее значение для защиты нашей нации и революции. Но, когда память о войне постепенно исчезает в прошлом, мы можем воспользоваться этой возможностью и начать восстанавливать Уральский регион к его прежней славе."
 sovietscorched.14.a: "Ваши имена могут быть неизвестны, но ваши деяния бессмертны."
 #
 sovietscorched.15.t: "Великая Степь начинает восстанавливаться"
 sovietscorched.15.d: "Наша Земная Тактика дорого обошлась своему народу в Великом Степпе. Похоже, что сейчас, когда регион начинает восстанавливаться и местные жители начинают возвращаться к своим обычным повседневным обычаям. Хотя сожжение этого региона остается спорным вопросом, тактика имеет решающее значение для защиты нашей нации и революции. Но память о войне постепенно исчезает в прошлом, мы можем воспользоваться этой возможностью и начать восстанавливать Великий Степп в его бывшую славу."
 sovietscorched.15.a: "Ваши имена могут быть неизвестны, но ваши деяния бессмертны."
 #
 sovietscorched.16.t: "Перевозочные системы начинают восстанавливаться"
 sovietscorched.16.d: "Наша Земная Тактика дорого обошлась своему народу. Похоже, теперь, когда регион начинает восстанавливаться, а местные жители начинают возвращаться к своим обычным повседневным рутинам. В то время как сожжение этого региона остается спорным вопросом, тактика имеет решающее значение для защиты нашей нации и революции. ~ ~В то время как память о войне постепенно исчезает в прошлом, мы можем воспользоваться этой возможностью и начать восстанавливать Транс-Уралы в ее бывшую славу."
 sovietscorched.16.a: "Ваши имена могут быть неизвестны, но ваши деяния бессмертны."
 #
 sovietscorched.17.t: "Восточная Сибирь начинает восстанавливаться"
 sovietscorched.17.d: "Наша Земная Тактика дорого обошлась своему народу в Восточной Сибири, и, похоже, теперь, когда регион начинает восстанавливаться, а местные жители начинают возвращаться к своим обычным повседневным обычаям, в то время как сожжение этого региона по-прежнему вызывает споры, тактика имеет решающее значение для защиты нашей нации и революции. Но, когда память о войне постепенно исчезает в прошлом, мы можем воспользоваться этой возможностью и начать восстанавливать Восточную Сибирь в ее бывшую славу."
 sovietscorched.17.a: "Ваши имена могут быть неизвестны, но ваши деяния бессмертны."
 #
 sovietscorched.18.t: "Русский Дальний Восток начинает восстанавливаться"
 sovietscorched.18.d: "Наша Земная Тактика дорого обошлась народу России на Дальнем Востоке. Похоже, теперь, когда регион начинает восстанавливаться, а местные жители начинают возвращаться к своим обычным повседневным обычаям. В то время как сожжение этого региона остается спорным вопросом, тактика имеет решающее значение для защиты нашей нации и революции. Но память о войне постепенно исчезает в прошлом, теперь мы можем воспользоваться этой возможностью и начать восстановление русского Дальнего Востока к его прежней славе."
 sovietscorched.18.a: "Ваши имена могут быть неизвестны, но ваши деяния бессмертны."
 #
 sovietscorched.19.t: "Западная Сибирь начинает восстанавливаться"
 sovietscorched.19.d: "Наша Земная Тактика дорого обошлась народу Западной Сибири, и, похоже, теперь, когда регион начинает восстанавливаться, а местные жители начинают возвращаться к своим обычным повседневным обычаям, в то время как сожжение этого региона по-прежнему вызывает споры, тактика имеет решающее значение для защиты нашей нации и революции. Несмотря на то, что память о войне постепенно исчезает в прошлом, мы можем воспользоваться этой возможностью и начать восстанавливать Западную Сибирь в ее бывшую славу."
 sovietscorched.19.a: "Ваши имена могут быть неизвестны, но ваши деяния бессмертны."
 #
 sovietscorched.21.t: "По мере того, как мы продвигаем политику Скорой Земли , растет нехватка продовольствия"
 sovietscorched.21.d: "По мере того, как наши враги все глубже движутся в СССР, наши попытки лишить их продовольствия и других предметов снабжения оказывают на наших собственных граждан неприятные побочные эффекты, многие гражданские лица сталкиваются с трудностями в плане удовлетворения своих повседневных потребностей в питании, а местные организации, созданные для распределения продовольствия, перегружены количеством убежищ, и Советскому конгрессу, возможно, пора непосредственно руководить этими программами по борьбе с голодом, особенно с началом зимы."
 sovietscorched.21.a: "Мы должны сосредоточиться на том, чтобы выжить в этой войне."
 sovietscorched.21.b: "Мы должны сделать все возможное для того, чтобы уменьшить масштабы этого растущего голода."
 #
 sovietscorched.22.t: "Оборудование теряется по мере того, как мы проводим политику "Скорой Земли""
 sovietscorched.22.d: "По мере того как мы эвакуируем военные материалы и оружие из рук наших врагов, некоторым из них суждено погибнуть в хаосе, но в последнее время ряд плохо проведенных эвакуаций привел к бессмысленной потере значительного количества предметов снабжения, и мы, возможно, захотим рассмотреть вопрос об организации дополнительной подготовки подразделений, которым поручено эвакуировать военные материалы, если мы хотим избежать такой ситуации в будущем."
 sovietscorched.22.a: "Такие потери приемлемы."
 sovietscorched.22.b: "Мы должны следить за тем, чтобы будущая эвакуация проходила по плану."
 #
 sovietscorched.23.t: "Массовые протесты против политики Скорой Земли"
 sovietscorched.23.d: "Политика, столь же радикальная, как и Скорая Земля , должна была столкнуться с оппозицией, но, как представляется, несмотря на тот факт, что наша нация сталкивается с угрозой, с которой мы никогда не сталкивались до того, как многие граждане организовали протесты в нескольких городах против этой политики, даже некоторые солдаты присоединились к этим протестам, чтобы выразить свое несогласие."
 sovietscorched.23.a: "Общественность имеет право высказывать свои претензии."
 sovietscorched.23.b: "Мы должны положить конец этому неповиновению."
 #Foreign Policy
 soviet_fp.1.d: "Советский Союз издал наглый ультиматум! Они требуют, чтобы мы уступили территории Карелии и Саллы, утверждая, что это ради их собственной безопасности. Они ждут нашего ответа."
 soviet_fp.2.d: "Финны мудро выбрали разум, согласились на наши пограничные изменения и уступили запрашиваемые территории, благодаря чему Ленинград не пролил ни одной капли крови."
 soviet_fp.3.d: "Высокомерные финны отвергли наши разумные требования! Они плюнули нам в лицо и бросили вызов Советскому Союзу. Это наглость не может остаться безнаказанным."
 soviet_fp.4.d: "Из Москвы прибыл суровый ультиматум. Правительство, ссылаясь на исторические притязания и "защиту народа Тувана", требует, чтобы мы немедленно уступили им всю сумму [329. GetName]. ~ В дипломатической ноте нет секрета о вооруженных силах, поддерживающих это "прошение". Кремль ожидает нашего ответа, и ясно, что отказ от них - это вызвать гнев российской армии."
 soviet_fp.5.d: "Прекрасные новости! Правительство [от .Getadigitive Cap] мудро решило принять наши условия. ~ ~ Несомненная истина наших исторических притязаний (и, возможно, реальность нашей военной мощи) они согласились на полную передачу [329.GetName]. Регион будет незамедлительно интегрирован."
 soviet_fp.6.d: "Потрясающе! Правительство официально отвергло наш ультиматум в отношении [329.GetName]! Но их ответ был полон разговоров о «национальном суверенитете» и «нарушении», полностью игнорируя наши справедливые и исторические притязания. Это преднамеренная провокация и грубое оскорбление народа. Они выбрали этот путь; теперь армия даст ответ, которого они заслуживают."

 sovietkaz.1.d: "С учетом того, что в настоящее время Центральная Азия полностью защищена под советским контролем, единственным остатком бывшей полуавтономной структуры региона является Казахская Советская Социалистическая Республика. Несмотря на исторически лояльность нынешнего политического климата и отсутствие какой-либо серьезной соседней угрозы, Президиум пришел к выводу о том, что настало время отменить ее официальный статус и полностью интегрировать ее территорию в Российскую ССРФ или другие административные области, что позволит централизовать обширные природные ресурсы региона и упорядочить контроль правительства над территорией, официально завершив советскую консолидацию Центральной Азии."

 sovietblr.1.d: "Сообщения из Ставки показывают, что ситуация на нашей западной границе неустойчива. Агрессия германского рейха в Восточной Европе, направленная на наших украинских братьев или где-либо еще, угрожает самой стабильности наших границ. Несмотря на то, что руководство Белорусской ССР, наблюдающее этот хаос, смотрит в Москву на защиту и решительное лидерство. Их нынешний полуавтономный статус является слабостью, которую, несомненно, будут использовать валькисты."


 ### SOVIET RECONQUEST ###
 sov_reconquest.1.d: "После многих лет жестокой оккупации и невообразимых страданий, Герой Ленинград свободен! Наша славная Красная Армия разбила валькистские линии, мстив миллионам погибших во время блокады. Колыбель Революции снова в руках советских властей! Немецкий паразит был изыскан со своих улиц, и имя "Ленинград" навсегда станет символом нашей нерушимой воли!"
 
 sov_reconquest.2.d: "Нижняя Волга - наша! Наши войска триумфально вошли в Астрахан, выгнав немецких оккупантов с берегов Каспийского моря. Защитив эту жизненно важную артерию, мы отрезали ключевой маршрут для врага и вернули южные богатства."

 sov_reconquest.3.d: "Солдаты Красной Армии сражались в Аркхангельске, освободив жизненно важный северный порт от немецкого контроля. Вражеская хватка над Белым морем сломалась, и этот город вновь стал бастионом советской силы в Арктике. Валькистские захватчики не найдут безопасности в холодных, непрощающих землях, которые они хотели завоевать."

 ### RUSSIAN RECONQUEST ###
 russia_reconquest.1.d: "Имперская столица снова русская! Наши войска боролись за освобождение Великого Санкт-Петербурга от германских варваров. Сегодня российский флаг с гордостью летит над Адмиралтейством, символом возрождения нашей нации и немертвого духа!"
 
 russia_reconquest.2.d: "Врата к Каспии защищены! Наши солдаты победоносно вошли в Астрахан, вернув рты Волги за Матери-Россия. Немецкие захватчики были отброшены с этого древнего перекрестка торговли и культуры, южные земли будут очищены от своего присутствия, и река снова будет свободно течь по российской земле."

 russia_reconquest.3.d: "Древнее сердце Севера свободно! Русские войска изгнали немецких оккупантов из города Аркхангельска, разрушив их позиции на наших арктических берегах. Этот исторический порт, основанный нашими царями, снова в руках русских, Север наш, и враг будет изгнан со всех уголков нашей священной родины!"

