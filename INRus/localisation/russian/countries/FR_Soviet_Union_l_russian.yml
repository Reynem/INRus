 SOV_scorched_earth_decisions: "Осуществление политики Скорой Земли"
 SOV_scorched_earth_decisions_desc: "Столкнувшись с подавляющей силой армии Наполеона в 1812 году, российское правительство в ответ уничтожило все, что могло быть использовано захватчиками. Фармленд был сожжен дотла, а целые города были оставлены. К тому времени, как Наполеон шел по Москве, его армия голодала и замерзала до смерти. По мере того, как наши враги двигались все глубже в СССР, мы должны вновь подумать о применении этой тактики, чтобы замедлить продвижение противника."
 #
 SOV_scorched_ukraine: "Скормить Украину"
 SOV_scorched_ukraine_desc: "Украина - это хлебная корзина Восточной Европы, позволив нашим врагам захватить этот регион в целости и сохранности, позволит им прокормить и предоставить свои войска в качестве переезда в Россию."
 #
