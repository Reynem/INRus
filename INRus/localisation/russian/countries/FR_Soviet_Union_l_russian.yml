 SOV_move_northwards: "Двигайся на север."
 SOV_move_northwards_desc: "Возвращение власти на север в сторону Ленинграда и близость Финляндии"
 SOV_take_rezhev: "Возьмите Резева."
 SOV_take_rezhev_desc: ""
 SOV_move_into_smolensk: "Перейти в Смоленск"
 SOV_move_into_smolensk_desc: ""
 SOV_liberate_kalinin: "Освободительный калинин"
 SOV_liberate_kalinin_desc: ""
 SOV_bordering_dnieper: "Возьмите провинции в Днепре."
 SOV_bordering_dnieper_desc: ""
 SOV_Lava: "К реке Лава!"
 SOV_Lava_desc: ""
 SOV_restoring_order_leningrad: "Восстановление порядка в Ленинграде"
 SOV_restoring_order_leningrad_desc: ""
 SOV_move_southwards: "Двигайся на юг."
 SOV_move_southwards_desc: "Возвращение власти на юг, к Кавказу."
 SOV_pacifying_ryazan: "Убийство Рязана"
 SOV_pacifying_ryazan_desc: ""
 SOV_march_continues: "Марш продолжается"
 SOV_march_continues_desc: ""
 SOV_don_volga: "После Волги и Дона"
 SOV_don_volga_desc: ""
 SOV_partially_order_restored: "Приказ о частичном восстановлении"
 SOV_partially_order_restored_desc: "Тухачевски удалось захватить большую часть страны, однако очаги сопротивления по-прежнему сохраняются."
 SOV_free_karelia: "Конец анархии в Карелии"
 SOV_free_karelia_desc: ""
 SOV_move_eastwards: "Движение на восток"
 SOV_move_eastwards_desc: "Всё, что осталось - это Восток, восстановить власть на восток, к Сибири и близость белых российских реакций."
 SOV_march_to_the_urals: "Марш уралам"
 SOV_march_to_the_urals_desc: ""
 SOV_finish_the_traitors: "Прикончить предателей"
 SOV_finish_the_traitors_desc: "Последние остатки сопротивления и заговор Троцких и антисоветских сил, наконец, очищаются и разбираются."
 SOV_Restore_Order_Ciscaucasia: "Порядок на Дальнем Юге"
 SOV_Restore_Order_Ciscaucasia_desc: ""
 SOV_nation_reunited: "Воссоединение нации"
 SOV_nation_reunited_desc: "Наконец, троцкие, антисоветские и заговорщики были ликвидированы, и расчленение Союза было решено."
 #Army
 SOV_red_army: ""На земле,"
 SOV_red_army_desc: "РККА, известная просто как Красная Армия, является легендарной и неизвестной армией СССР, созданной после революции 1917 года, с тех пор она продолжает эффективно и эффективно служить Союзу и несет ответственность за ограждение реакционеров и капиталистов на востоке и Западе, однако армия остро нуждается в реформе и модернизации, и, несмотря на все усилия Ленина по ее модернизации, ее вооружения и транспортные средства в значительной степени устарели и неисправны по сравнению с современными стандартами."
 SOV_guns: "Модернизация вооружений"
 SOV_guns_desc: "Красная армия отстает от мира в том, что касается качества и надежности ее оружия."
 SOV_artillery_expansions: "М-10"
 SOV_artillery_expansions_desc: "М-10 — это создание Мотовилихской механики под руководством дизайнера Ф.Ф. Петрова. Этот говядинный дизайн является высветом советского военного качества и социалистического прогресса в областях науки и войны."
 SOV_new_tanks: "Адаптация иностранного бронетранспортера"
 SOV_new_tanks_desc: "Технологии в Красной Армии немногочисленны, и даже те, что вокруг, либо устарели, либо ненадежны."
 SOV_anti_tank: "Противотанковая подготовка"
 SOV_anti_tank: "Валькист и британские империалисты на Западе смотрят в упор на наши территории и наше государство. Сооружение и совершенствование наших противотанковых вооружений - это необходимость, чтобы мы могли противостоять любым идеям, которые у них могут быть."
 SOV_expand_military_factories: "Военная машина"
 SOV_expand_military_factories_desc: "От Брайанска до Уралов советские военные комплексы определяют ландшафт и производят самое изощренное военное снаряжение. И действительно, идеи Ленина о милитаризованной экономике в значительной степени способствовали успеху красных пушек и красных транспортных средств. Однако это не означает, что наша военная промышленность не могла использовать больше инвестиций и капитального ремонта, чтобы массово производящая Красная Машина никогда не перестанет снабжать революцию оружием."
 SOV_mobile_warfare: "Мобильная военная авиация"
 SOV_mobile_warfare_desc: "В наших рядах было выдвинуто предложение о проведении новой военной политики, в рамках которой основное внимание уделялось бы инвестициям в бронетранспортеры и механизированные машины и сочетались бы с теми, кто обладает доктринами быстрой молнии, с тем чтобы получить преимущество в конфликтах и добиться военного успеха, и мы могли бы взять на вооружение эти идеи и сосредоточить внимание на быстрых войнах или поиске другого решения."
 SOV_planning: "Советская глубокая битва"
 SOV_planning_desc: "Советская глубокая битва — это теория Михаила Тухачевского, в которой упор делается на дезорганизации и подавлении врагов не во время контакта, а в глубине поля боя. В настоящее время это военная доктрина, наиболее влиятельная и популярная в Ставке, но мы всегда могли бы найти другое решение."
 SOV_cult_offensive: "Культ защиты"
 SOV_cult_offensive_desc: "Нападение, нападение, нападение и ни шаг назад! но просто зная, что их жертва обеспечит, что революция и родина никогда не будут повреждены иностранными врагами."
 SOV_school_movement: "Школа движений"
 SOV_school_movement_desc: "Крупные инвестиции должны направляться Красной армии в развитие идей, касающихся быстрого и мобильного ведения боевых действий."
 SOV_planning_schools: "Доктринальная инновация"
 SOV_planning_schools_desc: "Искусство, наука и многие области обучения могут подвергаться цензуре и ограничениям в ответственной диктатуре пролетариата, но важно, чтобы военные инновации и образование оставались нетронутыми и неограниченными на пути к обеспечению победы Союза."
 SOV_engineers: "Инженерные школы"
 SOV_engineers_desc: "Во многих ситуациях военный инженер играет столь же важную роль, как и генерал или маршал, в обеспечении успеха в распространении революции."
 SOV_military_science: "Военные науки"
 SOV_military_science_desc: "Быстрые и неожиданные технологические достижения, появившиеся в результате Первой мировой войны, со всей ясностью показали, что инвестиции в военные исследования должны вкладываться в общие исследования, и поэтому мы должны постоянно поддерживать твердый военный научный департамент."
 SOV_airforce: "В небе,"
 SOV_airforce_desc: "Наш галантный сокол не знает никаких барьеров, когда вы выполняете задание. Награды страны - Ордена - говорят о смелости нашего дерзкого дерзкого. Готовы выполнить любой приказ, который дает Родина, готовый выполнить любой приказ, который дает Родина. Отдали мою собственную партию, мы крылья и небо, наш флот. Отпустите врагов нашей Родины. Не щадя жизни, мы все летим выше и дальше, бескорыстно служа Родине."
 SOV_strategic_destruction: "Красный дождь"
 SOV_strategic_destruction_desc: "Эффективные военно-воздушные силы должны быть построены в целях стратегического бомбардирования и уничтожения улей промышленников и тех, кто извлекает выгоду из войны в капиталистических государствах, наряду с разгромом и террором буржуазных правительств, которые угнетают и репрессируют рабочих во всем мире."
 SOV_paratroopers: "Создать советские военно-воздушные войска"
 SOV_paratroopers_desc: "В настоящее время в СССР нет департамента по парашютированию войск или авиационных пехотных дивизий, в результате чего мы остаемся позади многих стран, которые уже создали функциональные службы авиакомпании, или стран с сильными мореплавателями, которые не могут попасть в море."
 SOV_expand_air_bases: "Инвестирование в авиабазы"
 SOV_expand_air_bases_desc: "СССР - это обширный союз. Идеально, что мы строим воздушные базы, пересекающие его и его границы, чтобы быть готовыми, независимо от того, откуда мы вторглись."
 SOV_anti_air: "Стена для противовоздушных аппаратов"
 SOV_anti_air_desc: "Противопехотная ракета обеспечит, что бомбардировщики никогда не смогут свободно пересечь нашу территорию и терроризировать наш народ."
 SOV_expand_production_bombers: "Народные бомбардировщики"
 SOV_expand_production_bombers_desc: "В результате бомбардировок гибнут ни в чем не повинные рабочие, однако ради революции необходимо продолжать строительство бомбардировщиков и подготовку их пилотов, и поэтому мы должны приступить к осуществлению широкомасштабной программы строительства бомбардировщиков."
 SOV_protectors_sky: "Защитники Соколи"
 SOV_protectors_sky_desc: "Благодаря своему мужеству и умению наши советские пилоты называются соколи (соколи) и пропагандируют их как великих защитников советской родины."
 SOV_ground_support: "Наземная поддержка"
 SOV_ground_support_desc: "Наземная поддержка имеет жизненно важное значение для успеха Красной армии, и, таким образом, чем больше внимания уделяется ей, тем более успешными будут наши конфликты."
 SOV_doctrine_advances: "Доктринальные достижения"
 SOV_doctrine_advances_desc: "Обучая наших пилотов новым разработкам в наших доктринах, мы должны вести более эффективную и успешную воздушную борьбу."
 SOV_red_fleet: "В океане""
 SOV_red_fleet_desc: "РККФ, известный как просто Красный ВМС, является военно-морской ветвью советских вооруженных сил со времени Октябрьской революции. С тех пор, хотя милитаризованная экономика, предложенная товарищем Ленином, в значительной степени способствовала развитию военно-морского флота, она по-прежнему отстает в размерах и оперативных масштабах, чем многие западные страны. Если мы действительно намерены расширить Союз и социализм, мы должны работать над тем, чтобы ликвидировать этот разрыв."
 SOV_marines: "Силы береговой обороны"
 SOV_marines_desc: "Силы береговой обороны Союза являются нашими морскими и военно-морскими пехотными силами, которые не только хорошо подготовлены, но и готовы и способны бороться, где бы они ни были необходимы, на любой местности."
 SOV_naval_bomers: "Бомбардировщики военно-морского флота"
 SOV_naval_bomers_desc: "Чтобы предотвратить возможные военно-морские вторжения на наши берега или подорвать любые блокады, мы должны построить массу бомбардировщиков, специализирующихся на уничтожении кораблей и верфи."
 SOV_battlecruisers: "Программа по судостроению морских судов"
 SOV_battlecruisers_desc: "В эту новую эпоху полной войны мы должны в первую очередь построить военно-морский флот, который может нарушить линии снабжения и который может защитить социализм, независимо от того, где он возникает в мире."
 SOV_cruisers: "Программа Крузер"
 SOV_cruisers_desc: "Программа крейсеров позволит нам расширить нашу программу по судостроению в военно-морском флоте со строительством крейсеров на этот раз."
 SOV_destroyers: "Советское боевое судно"
 SOV_destroyers_desc: "Советский боевой корабль не похож ни на что другое, он является высочайшим из советских инженерных и механических достижений и несет с собой надежды и мечты миллионов гордых судовых рабочих."
 SOV_carriers: "Перевозочная сила"
 SOV_carriers_desc: "Карьеры должны позволить нам расширить наше влияние и мощь в Балтийском море и на востоке."
 SOV_dockyards: "Докьярд Оверхоул"
 SOV_dockyards_desc: "По мере продолжения нашей программы морского строительства было достигнуто понимание того, что строительство все более и более совершенных верфей также потребуется, поскольку многие из наших судов устарели или невелики по размеру."
 SOV_army_air_cooperation: "Сотрудничество РККА-РКВФ"
 SOV_army_air_cooperation_desc: "РККА и РККВФ не являются незнакомцами в плане сотрудничества и совместных операций, учитывая, что оба они когда-то принадлежали к одному и тому же военному подразделению."
 #Economy
 SOV_kickstart_industrialization: "Великая индустриализация"
 SOV_kickstart_industrialization_desc: "Все члены партии согласны с тем, что страна нуждается в индустриализации."
 SOV_electrification: "План ГОЕЛРО"
 SOV_electrification_desc: "Первый план, который был разработан и начат в рамках товарища Ленина , был направлен на массовую электрификацию Союза путем установки 30 электростанций и многочисленных промышленных предприятий. План , который был разработан в конечном итоге и предусматривает производство 8,8 млрд. кВтч, за счет одного из последних крупных инвестиций, теперь мы можем завершить этот план и обеспечить необходимое производство."
 SOV_peoples_credit: "Народные кредиты"
 SOV_peoples_credit_desc: ""
 SOV_railway_expansion: "Расширение железнодорожного сообщения"
 SOV_railway_expansion_desc: "Многие фермы и города по всей нашей стране по-прежнему не всегда легко и быстро доступны для нашей промышленности, поэтому мы должны приступить к широкомасштабному расширению железнодорожного строительства, в результате чего железные дороги будут соединять все народы Союза друг с другом."
 SOV_mechanization: "Механизация"
 SOV_mechanization_desc: "Наша промышленность по-прежнему во многих отношениях устарела и не имеет определенной автоматизации и механизации, и поэтому мы должны разработать новые и более совершенные механические технологии и стремиться к полной механизации нашей страны."
 SOV_modern_cities: "Урбанизация"
 SOV_modern_cities_desc: "Значительная часть населения Советского Союза остается в сельской местности и слишком долго состоит из крестьян. Для того чтобы обеспечить более значительные темпы развития городов, которые, в свою очередь, в целом приведут к увеличению промышленного производства и научному прогрессу, мы должны создать новую волну урбанизации с помощью социальных и экономических стимулов."
 SOV_new_gear: "Современная передача для промышленности"
 SOV_new_gear_desc: "Увязан с нашей столь необходимой механизацией, потребность в новых снарядах и когтях, а также во всех формах аналогичных составных частей машин."
 SOV_independent_vehicle_industry: "Автомобильная промышленность"
 SOV_independent_vehicle_industry_desc: "Мы должны иметь возможность производить автомобили и другие автомобили без какой-либо иностранной помощи, что докажет успех родины и социализма и позволит нам быть независимыми от империалистов за рубежом."
 SOV_modern_war_engine: "Современная военная машина"
 SOV_modern_war_engine_desc: "Союз уже был очень развитой военной машиной."
 SOV_if_tomorrow_brings_war: "Пробудить русского медведя"
 SOV_if_tomorrow_brings_war_desc: "Российский медведь был когда-то опасался на европейском континенте, и это проявление нашей страны означает, что мы должны вновь сделать его опасной и опасной силой, независимо от стоимости."
 SOV_the_whole_people_as_one_will_rise_up: "Расширить производство оружия"
 SOV_the_whole_people_as_one_will_rise_up_desc: "Наша отечественная индустрия вооружений должна будет производить все больше и больше, если мы хотим оставаться острыми и находиться на переднем крае боевых действий."
 SOV_industrial_autarky: "Промышленная автарка"
 SOV_industrial_autarky_desc: "Родина не может полагаться на внешний мир, такова природа Союза и социализма, которым мы должны противостоять. Таким образом, все промышленное строительство, производство и исследования должны проходить через руки наших советских граждан. Слава родине! Слава революции!"
 SOV_women_workforce: "Включение женщин в состав рабочей силы"
 SOV_women_workforce_desc: "Советские женщины не являются жалкими и угнетенными девушками, которые живут под буржуазными режимами."
 SOV_economic_stimulation: "Экономическое стимулирование"
 SOV_economic_stimulation_desc: "Необходима определенная экономическая стимуляция для поддержания нашей постоянно растущей и все возрастающей промышленности и экономики."
 SOV_full_employment: "Полная занятость"
 SOV_full_employment_desc: "Все мужчины и женщины будут работать! каждый взрослый будет иметь работу! такова природа Союза и природа революции, когда он будет работать, люди останутся счастливыми и будут трудолюбивыми."
