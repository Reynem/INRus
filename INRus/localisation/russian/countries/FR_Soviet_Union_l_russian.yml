 SOV_great_patriotic_war: "Великая патриотическая война"
 SOV_great_patriotic_war_desc: "Империалисты стремятся раз и навсегда уничтожить революцию, мало что знают о том, что родина, являющаяся сердцем революции, сильна, а наши братья и сестры будут сопротивляться и побеждать злодеяний капиталистов независимо от их стоимости."
 SOV_great_patriotic_war_spamming_equipment: "Великая патриотическая война"
 SOV_great_patriotic_war_spamming_equipment_desc: "Империалисты стремятся раз и навсегда уничтожить революцию, мало что знают о том, что родина, являющаяся сердцем революции, сильна, а наши братья и сестры будут сопротивляться и побеждать злодеяний капиталистов независимо от их стоимости."
 SOV_food_problems: "Проблема снабжения продовольствием"
 SOV_food_problems_desc: "Недостаток современного оборудования и инфраструктуры в советской родине делает наше распределение продовольствия и поставки очень нестабильными."
 SOV_food_problems2: "Проблема снабжения продовольствием"
 SOV_food_problems2_desc: "Несмотря на наши успехи в решении проблем, связанных с отсутствием у нас современного оборудования и инфрастуктуры, возможность нехватки продовольствия по-прежнему представляет собой реальную угрозу, если наш Союз окажется в трудной ситуации."
 SOV_food_problems3: "Проблема снабжения продовольствием"
 SOV_food_problems3_desc: "Мы добились значительного прогресса в решении проблем, связанных с отсутствием современного оборудования и инфразстройки, однако наше распределение и поставки продовольствия все еще не полностью стабилизированы."
 SOV_collectivization: "Объединение"
 SOV_collectivization_desc: "Премьер-министр [Root. Get Header] начал кампанию коллективизации с целью коллективизации около 80% всей нашей сельскохозяйственной земли."
 SOV_political_divide: "Политический разрыв"
 SOV_political_divide_desc: "Политический разрыв между многими фракциями коммунистической партии на протяжении многих лет омрачает страну, поскольку он препятствует управлению из-за постоянного политического конфликта между группировками."
 SOV_political_chaos: "Политический хаос"
 SOV_political_chaos_desc: "Смерть премьер-министра Ленина привела Советский Союз к полному и полному хаосу."
 SOV_crippled_industry: "Крохотная промышленность"
 SOV_crippled_industry_desc: "Политический хаос привел к тому, что индустрия оказалась не в состоянии нормально функционировать, при этом большинство работников отказались работать."
 SOV_economic_breakdown: "Разбивка по экономическим показателям"
 SOV_economic_breakdown_desc: "Политический хаос привел к тому, что большинство фабрик оказались пустыми, поскольку рабочие вместо этого протестовали против государства, что в сочетании с ожесточенными столкновениями между различными группами привело к полному экономическому краху."
 SOV_mobilized_economy: "Мобилизованная экономика"
 SOV_mobilized_economy_desc: "Сосредоточив внимание на промышленном расширении, мы наконец-то смогли сбалансировать нашу экономику, однако это не означает, что наша экономика нестабильна, на самом деле она по-прежнему сильно милитаризирована, что помогает нам подготовиться к неизбежной борьбе с империалистами."
 SOV_engine_war: "Мобилизованная экономика"
 SOV_engine_war_desc: "Наша экономика производит все больше и больше техники, чтобы помочь нашей армии защитить народ и экспортировать революцию."
 SOV_engine_war2: "Мобилизованная экономика"
 SOV_engine_war2_desc: "Наша экономика производит все больше и больше техники, чтобы помочь нашей армии защитить народ и экспортировать революцию."
 SOV_lacking_industrialization: "Отсутствие индустриализации"
 SOV_lacking_industrialization_desc: "Сосредоточившись на вооружении, мы почти полностью проигнорировали необходимость индустриализации нашей страны, в результате чего страна на протяжении многих лет отставала от технологических и экономических по сравнению с нашими соперниками."
