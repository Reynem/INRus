 ### Characters ###
 RUS_karl_radek: "Карл Радек"
 RUS_karl_radek_leader_desc: "Карл Радек боролся за то, чтобы пересчитать количество социалистических движений, которыми он занимался в течение многих лет. Родился в Австрии и Венгрии в еврейской семье литвака, он присоединился к социальной демократии Польши и Литвы и принял участие в революции 1905 года в Варшаве - только для того, чтобы быть изгнанным через несколько лет в рамках антисемитской и антиленинской кампании в партии. Недолго, он работал на Немецкую СДП, прежде чем его тоже исключили. Он работал на Бремен Левый, присутствовал на Конференции Зиммервальда в Цюрихе, и в конечном итоге уехал в Петроград в том же опечатанном поезде, что и Ленин, чтобы присоединиться ко всей Октябрьской революции. Он не остался в России, однако в конце 1918 года он пересек границу тайно, чтобы присоединиться к революционным событиям, происходящим в Германии, за мгновения до того, как они были разрушены Кайзером. ~ Это короткое приключение спасло ему жизнь, но вместо того, что белые сделали со всеми большевиками, которые они могли найти, Радек был оставлен в тюрьме немцами и в конце 1930 лет, и был выпущен в то время, когда он вновь перешёл в Россию,"the weakest link in the capitalist system". An ardent revolutionary and a radical even among radicals, Radek stresses the need for Russia to quickly develop itself through use of extensive state planning, in order to prepare for the coming world revolution."

 RUS_aleksandra_kollontai: "Александра Коллонтай"
 RUS_aleksandra_kollontai_leader_desc: "Александра Домонтович, замужество по имени Коллонтай, родилась от либерального кавалерийского генерала, от которого она унаследовала интерес к истории, анализу и политической реформе. Ее левые симпатии начались, когда ее отправили в Западную Европу, чтобы дистанцировать ее от отношений с бедной студенткой, и она начала читать радикальную левую литературу во время изгнания. В это время она стала горячим сторонником прав женщин и профсоюзного движения, ее взгляды были еще более привязаны к синдикативизму ее любовником Александром Шляпниковым. Нн Кольлонтай была Меншевиком до 1915 года, когда она разорвала вопрос о Великой войне и присоединилась к Большому Союзу. Во время несчастной октябрьской революции она была членом Центрального комитета и стремилась использовать свою позицию, чтобы воплотить в жизнь свою феминистскую идеологию, однако российская гражданская война положила конец своим планам. Помимо Шляпникова, она помогла найти Социалистическую партию профсоюзов, движение, близкое к ортодоксистскому французскому синдикалистизма на российской земле - она раскрывает потребности городского рабочего, аграрного и аграрного общества, в толизма, в то время, в котором они считают, что профсоюзы."

 RUS_aleksey_rykov: "Алексей Райков"
 RUS_aleksey_rykov_leader_desc: "Алексей Рыков, родившийся из сельской русской крестьянки, был первым членом большевикской фракции социал-демократов и сторонником Владимира Ленина по отношению к своим политическим соперникам в движении. После возвращения из Сибири в 1917 году он присоединился к Октябрьской революции, хотя и не согласился с радикальными наклонностями большевистского движения, и был назначен ответственным за индустрию молодого советского государства. В этот период он организовал политику военного коммунизма, хотя позднее он выразил сожаление в связи с самыми грубыми мерами и обидой крестьян, которые она вызвала. Нин Рыков выжил после окончания гражданской войны в России и присоединился к Николаю Бухарину в изгнании и сформировал Народную социалистическую партию - два человека нашли много общего в своем призыве к осторожности, преобразовав при этом российскую экономику и умеренности среди радикальных группировок Центрального комитета."

 RUS_nikolay_bukharin: "Николай Бухарин"
 RUS_nikolay_bukharin_leader_desc: "Бухарин, родившийся в семье среднего класса в столице России, является членом левой России на протяжении последних трех десятилетий. Он был первым членом организации Социал-демократический труд и ее большевикской фракции, созвал конференцию, на которой основал свое молодежное движение Комсомоль и поддерживал контакты с остальной частью партии, находившейся в изгнании на Западе. Там на его политическую мысль повлияли европейские левые, австрийские марксисты и немарксистские ученые, такие, как Александр Богданов, и он постоянно вступал в идеологический конфликт с Владимиром Ленином, несмотря на то, что остался преданным большевиком. nnkarin сыграл ключевую роль в несчастной Октябрьской революции и стал членом левого крыла Советской республики - он решительно выступал против договора Брест-Литовского и верил в перспективу мировой революции, особенно когда во Франции начались революционные события. После подавления революции Бухарин был одним из немногих, кому удалось сбежать от в пояса, и в последующие годы он организовал подземного большевиков в народную партию."military-feudal exploitation"of the peasantry, Bukharin endorses a moderate approach of cautious industrialisation and an alliance between the proletariat and peasantry."

 RUS_aleksandr_shlyapnikov: "Александр Шляпников"
 RUS_aleksandr_shlyapnikov_leader_desc: "Александер Шляпников, родившийся из семьи бедных староверных, работал на различных фабриках в Петрограде с тринадцати лет и вырос, чтобы стать страстным революционером. Будучи приверженным профсоюзной деятельности и борьбе российского труда за контроль над средствами производства, он объединился с несколькими радикальными левыми партиями до того, как он наконец вступил в ряды большевиков, хотя он всегда заявлял о своих целях выше любых их идеологических замыслов. В связи с этим, хотя Шляпников и принимал участие в Октябрьской революции, он постоянно вступал в конфликт с Ленином и большевиками и постоянно критиковал их авторитарные тенденции, когда права трудящихся должны быть их главной заботой."

