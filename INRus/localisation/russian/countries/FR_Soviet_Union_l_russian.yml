 RUS_aleksandr_yegorov: "Александр Егоров"
 #RUS_aleksandr_yegorov_commander_desc: "13 октября 1883 года в Бузулуке, Самара, Русская империя §Y Военная карьера: §L\nAleksandr Егоров начал свою карьеру. К 1905 году он был вторым лейтенантом безошибочно в своей карьере. В 1904 году он стал членом Социалистическо-революционной партии, введя его на путь к Красной Армии и, в конечном счете, изгнанию. После начала войны он быстро поднялся в ряды. К 1917 году Егоров, новый лейтенант-полковник, был ранен пять раз при исполнении служебных обязанностей и был украшен за свою храбрость и храбрость перед лицом опасности. ~ После октябрьской революции Егоров радикал в сторону дела Болшевика. Он стал организатором в новорождённой Красной армии, и использовал свой опыт в попытках вытащить силы для ведения боевых действий из неуправляемой армии большевиков. Он был направлен в командование на юге. Игов был вновь ранен, несмотря на то, что его держатый диверсионистский диверсионист, был вынужден, несмотря на то, что его дружили, что он был дершал дружил его, и х."

 RUS_georgy_zhukov: "Джордж Жуков"
 # RUS_georgy_zhukov_commander_desc: "ГЕНЕРАЛЬНОЕ ОПИСАНИЕ: 1 декабря 1896 года в Стрелковке, мухафаза Калуга, Русская империя §n §Военная карьера: §L\nBorn в бедную крестьянскую семью в Центральной России Георгий Жуков никогда не считал себя военным человеком, а вместо этого учился быть механиком в мастерской своего брата в Москве. Затем пришел велькриг, и вместе с ним Жуков был призван в Имперскую русскую армию. В этом случае он обнаружил, что его призвание, демонстрируя мастерство, храбрость и заканчивая сервером в качестве сержантского офицера кавалерии. После октябрьской революции он ненадолго вернулся домой, но в этот раз вернулся в прифронты, в этот раз в качестве младшего командира Красной Армии. \n/Зуков был довольно кратким, но когда советский режим рухнул, он сбежал со своей родины с многочисленными другими командирами Красной армии и приземлился во Франции. Привычка к совершенно иностранной стране, но Жуков в полной мере посвятил себя делу большевики, если он видел свою прежнюю работу с более держащим офицером."

