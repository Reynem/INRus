l_russian:
 SOV_FUHRERREICH_DESC: "После своей потери во время Великой войны российская империя попала в гражданскую войну, и общинистская партия большевиков вскоре стала правителем России. Эта власть была в конечном счете оспорена анархистскими моряками в Кронштадте, которые восстали, чтобы бороться с авторитаризмом в стране. Восстание было успешным, и большинство старых большевиков ушли в отставку как более демократическая форма социализма, где трудящиеся действительно контролируются. Маяк социализма во всем мире ведёт к неведомому будущему, которому угрожают польские амбиции и даже мстительные старые большевики..."

