 soviet.1.d: "В 1914 году, после того как взорванный эрцгерцог Австрии, Россия мобилизовала свои силы на защиту своего сербского союзника от вторжения в Австрийскую армию. Так началась Всеобщая война между русскими, британскими и французами против германских, австрийских и оттоманских государств. В этой же, как и в других странах, была война. В то время, как силы Центрального государства подталкивали на восток, понизили моральный дух и подняли волнения до того момента, когда большинство России было вооружено против монархии в 1917 году, начиная с февральской революции. Цар, в конечном счете, обогатил свою власть над германскими, австрийскими и оттоманскими государствами. В то время как в антагонистической России, в то время как в тяжёлой тяжёлой стране, в то время как в тяжёлой тяжёлой тяжёлой России, в то время как в тяжёлой тяжёлой действительности, в тяжёлой, в тяжёлой, в то время, как в тяжёлой, в тяжёлой, в тяжёлой, в тяжёлой, в тяжёлой, в тяжёлой, в ганской, в ганской, в ганской, в ганской, в ганской, в ганской, в ганской, в ганской, в ганской, в ганской, в ганской, в ганской, в ганской, в ганке, в ганской, в ганской, в гане. или в ."
 soviet.2.d: "Владимир Ленин скончался! это катастрофа, так как без Ленина многие внутренние фракции коммунистической партии теперь будут сражаться за власть. И что еще хуже, многие группы, противостоящие Ленину, демонстрируют свое желание начать протест, а у некоторых, похоже, даже есть желание свергнуть правительство. Хотя все это происходит, многие люди оплакивают Ленина и надеются, что они благополучно переживут бурю, которая последует за его смертью. Люди надеются, что, пока Ленин умрет, его дело будет продолжаться!"
 soviet.3.d: "С момента смерти Ленина у Советского Союза не было реального лидера, и это привело к резкой эскалации ситуации. Из-за этого шли слухи о инакомыслиях и переворотах, встреча между важными генералами заставляла людей беспокоиться о том, что они планируют военный переворот. Сергей Киров также получил шанс стать новым премьером, но рабочие могли бы выступить против него из-за его сильного следа идее Ленина, против которой выступают большинство рабочих."
 soviet.4.d: "Чтобы предотвратить попадание СССР в руки заговорщиков, ревизионистов или военных, Молотова, Бухарина и Зиновьева сформировали чрезвычайную тройку и взяли ее на себя, что, как мы надеемся, должно привнести в этот дестабилизирующий Союз атмосферу стабильности."
 soviet.5.d: "Молотов решил в срочном порядке издать односторонние приказы о немедленном изгнании нескольких «антисовских» реакторов, ревизионистов и радикалов, которые выступили против него."
 soviet.6.d: "Как представляется, с учетом того, что Молотов действует все более независимо, Бухарин отправился в Осло для воссоединения левых коммунистов-единомышленников, и на этой специфической встрече был выпущен манифест о сокращении советской бюрократии и укреплении демократии, направленный, таким образом, на перестройку либертарианцев в стране, хотя само имя Бухарина не фигурирует в манифесте, его присутствие на этой встрече вызвало некоторые сомнения в СССР в отношении единства тройки."
 soviet.7.d: "Во время закрытой встречи тройки Молотов предложил Союзу принять свои идеологические формулировки, так называемые идеалы национального коллективизма, в качестве государственной политики. Марксизм окружает идею социализма в государстве, и многие считают, что она противоречит некоторым собственным убеждениям Ленина. Зиновьев и Бухарин решительно выступили против любых попыток ее реализации и назвали ее незнательной ."
 soviet.8.d: "На митинге за закрытыми дверями Троцкий вновь выдвинул свою идею:"internationalism". This concept, which envisions a Soviet Union that is built and functions around the idea of constant worldwide revolution and advocates for the endless export of socialism abroad, is seen a serious delusion and has already been widely denounced by Lenin, however, considering how Internationalism has proven successful in the Congress of Soviets, some see him as a potential political tool that may be used for furthening their authority."
 soviet.9.d: "После встреч за рубежом и в Союзе Бухарин сформировал свою собственную фракцию либертарианцев. Многие считают, что у группы Бухарина есть идеи, которые вредят Союзу. И Зиновиев и Молотов начали выражать такую озабоченность в сильных проявлениях Бухарина."
 soviet.10.d: "Поскольку Бухарин и Молотов создали основы поддержки и укрепления популярности, в неожиданном и спорном повороте событий Зиновьев и Троцкий объединили руки и сформировали единый фронт. Бухарин и Молотов призвали Зиновьева к этому, и большая часть сторонников Зиновьева, похоже, колеблются продолжать поддерживать его, но то, что сделано, сделано. Этот новый пакт позволил Троцкому выйти из политической изоляции и теперь он входит в авангард властных отношений в Союзе, приведя с собой с собой большую группу партийных членов."
 soviet.15.d: "Похоже, что по мере того, как Зиновьев и Троцкий расширяют свой союз, Зиновиев падает все глубже в руки Троцкого и становится все более зависимым от него."
 soviet.23.d: "После усиления напряженности и споров и формирования различных коалиций в тройке и Молотове, Бухарине и Зиновьеве началась борьба за власть, которая теперь находится в горле друг друга. Хотя официально они все еще остаются союзниками, широкая и горячая дискуссия о будущем Советского Союза и их различных представлениях о социализме, по всей видимости, привела к тому, что любое сотрудничество практически прекратилось. Теперь Молотов и его национальные коллективисты, Бухарин и его либертарианцы и Зиновиевско-Тротский фронт, все время готовились к общеполитическому сражению."
 soviet.24.d: "Наши антикоррупционные программы до сих пор были успешными, мы смогли искоренить коррупцию в Конгрессе Советов и во всех других департаментах правительства."
 soviet.25.d: "Мы не можем остановить рост коррупции, мы должны начать кампанию по борьбе с коррупцией, с тем чтобы искоренить эту проблему."
 soviet.26.d: "Коррупция стала нормальным явлением в правительстве."
 soviet.27.d: "Мы должны действовать быстро, если хотим сохранить образ нашего режима."
 soviet.28.d: "Коррупция уже давно является проблемой, но, как представляется, в последнее время несколько уменьшилась."
 soviet.29.d: "Благодаря нашим новым усилиям коррупция становится все более редкой практикой с каждым днем. Мы даже слышали об отказе от взяток. Возможно, чиновники учатся морали или боятся. В любом случае, коррупция постоянно снижается."
 soviet.30.d: "Коррупция стала проблемой прошлого: не только отказ в взяточничестве, но и даже не предложение взяток, что не только помогает нашей промышленности и бюрократии работать более гладко, но и улучшает нашу репутацию на мировой арене."
 troika.1.d: "Молотов уже давно критиковал наш приход к власти, готовя нашу политическую кампанию через Советский Союз, Молотов координировал со своими политическими союзниками, чтобы блокировать наши визиты в многочисленные советские советы по всему Союзу, затрудняя наши усилия по поиску местной поддержки, он явно заинтересован только в том, чтобы держать не только советское правительство, но и советских граждан."
 troika.2.d: "Выступление Троцкого на советском конгрессе, казалось, прошло хорошо, но еще до того, как делегаты смогли ответить, наши предполагаемые союзники в «тройки», Молотове и Бухарине выступили со своей собственной речью, в которой они оба обвинили Троцкого в коррупции реакционера, который использует свою собственную политическую позицию для личных выгод."
 troika.3.d: "Выступление Бухарина на советском конгрессе, казалось, прошло хорошо, но еще до того, как делегаты смогли даже ответить, наши предполагаемые союзники в «тройки», Молотове и Зиновьеве выступили со своей собственной речью, в которой они оба обвинили Бухарина в коррупции реакционного характера, который использует свою собственную политическую позицию для личных выгод."
 troika.4.d: "Похоже, что речь Молотова на советском конгрессе прошла хорошо, но до того, как делегаты даже смогли ответить, наши предполагаемые союзники из «тройки», Бухарина и Зиновьева выступили со своей собственной речью, в которой они оба обвинили Молотова в коррумпированности реакционера, который использует свою собственную политическую позицию для личных выгод."
 troika.5.d: "Недавно мы назначили нескольких ключевых союзников на должность офицера в советских вооруженных силах, хотя это было полностью в нашем законном праве назначать тех, кого мы считаем подходящими, Зиновьев и Троцкий использовали свои связи для того, чтобы подняться в армии, чтобы отменить наше решение."
 troika.6.d: "Недавно мы обвинили нескольких членов Советского конгресса в том, что они являются реакционными диссидентами, которые лишь стремятся подорвать Революцию."
 troika.7.d: "Недавно мы обвинили нескольких членов Советского конгресса в том, что они являются реакционными диссидентами, которые лишь стремятся подорвать Революцию."
 troika.8.d: "Наше расследование в отношении нескольких делегатов Советского конгресса показало, что они невиновны в каких-либо тайных действиях против нашей нации."
 troika.9.d: "Наше расследование по делу нескольких делегатов Советского конгресса признало их виновными в совершении тайных действий против нашей нации и правительства. Эти люди должны быть немедленно исключены из конгресса и арестованы для вынесения окончательного приговора. Это расследование продемонстрировало нашу приверженность безопасности и справедливости Советского Союза."
 troika.10.d: "Ходят слухи о взяточничестве в советском Конгрессе уже какое-то время, но теперь кажется, что Конгресс достаточно смел, чтобы прямо обвинить нас в таких неэтических действиях. Несмотря на отрицание всех обвинений, Конгресс по-прежнему обвиняет нас. Наши союзники в тройке отказываются отрицать обвинения, но по-другому не комментируют спор."
 troika.11.d: "Коррупция в советском правительстве стала открытой тайной, многие политики используют государственные ресурсы для своей личной выгоды, пытаясь спасти лицо, наши бывшие союзники Молотов и Бухарин возложили основную вину за рост коррупции только на Григория Зиновьева, они сравнивают его с диктатором и осуждают его как предателя рабочего класса."
 troika.12.d: "Коррупция в советском правительстве стала открытой тайной, многие политики используют государственные ресурсы для своей личной выгоды, пытаясь спасти лицо, наши бывшие союзники Молотов и Зиновиев возложили основную вину за рост коррупции только на Николая Бухарина, они сравнивают его с диктатором и осуждают его как предателя рабочего класса."
 troika.13.d: "Коррупция в советском правительстве стала открытой тайной, многие политики используют государственные ресурсы для своей личной выгоды, пытаясь спасти лицо, наши бывшие союзники Бухарин и Зиновьев возложили основную вину за рост коррупции только на Вячеслава Молотова, они сравнивают его с диктатором и осуждают его как предателя рабочего класса."
 troika.15.d: "В то время как мы служили Советскому Союзу, наши союзники тройки Молотов и Бухарин, по слухам, ведут тайные переговоры с высшими войсками советских войск. Они утверждают, что это исключительно официальное дело, касающееся национальной безопасности, но по мере того, как напряженность внутри тройки , амбициозные задницы , боязни возможного военного переворота, растут. Мы должны работать, чтобы усилить наше влияние на армию и подорвать наших оппонентов ."
 troika.16.d: "В то время как мы служили Советскому Союзу, наши союзники Тройки Молотов и Троцкий, по слухам, ведут тайные переговоры с высшими войсками советских войск. Они утверждают, что это исключительно официальное дело, касающееся национальной безопасности, но по мере того, как напряженность внутри тройки , амбициозные задницы, страх перед возможным военным переворотом, растет. Мы должны работать, чтобы усилить наше влияние на армию и подорвать наших оппонентов ."
 troika.17.d: "В то время как мы служили Советскому Союзу, наши союзники из «тройки» Бухарин и Троцкий, по слухам, ведут тайные переговоры с высшими офицерами советских войск. Они утверждают, что это исключительно официальное дело, касающееся национальной безопасности, но по мере того, как растет напряженность внутри «тройки» и честолюбивые задницы, боязнь возможного военного переворота, мы должны работать, чтобы усилить наше влияние на армию и подорвать наших оппонентов."
 troika.19.d: "После долгих дебатов в Конгрессе большинство делегатов проголосовало за то, чтобы инаугурировать Вячеслава Молотова в качестве единоличного председателя Советского Союза и фактически прекратить действие «тройки», которая действует в течение нескольких месяцев."
 troika.20.d: "После долгих дебатов в Конгрессе большинство делегатов проголосовало за то, чтобы инаугурировать Николая Бухарина в качестве единоличного председателя Советского Союза и фактически прекратить действие «тройки», которая действует в течение нескольких месяцев. Молотов и Троцкий были публично восприняты как поздравляющие Бухарина, но, по слухам, проголосовали против его продвижения по службе."
 troika.21.d: "В то время как Григорий Зиновьев пытался справиться с борьбой за власть против Бухарина и Молотова, он слишком сильно положился на Троцкого и на его платформу, и несмотря на успехи Зиновьева, тот, кто больше всего извлёк выгоду от всего этого, был Троцким. Так что это было не удивительно для кого, кроме Зиновьева, когда делегаты проголосовали за то, чтобы инаугурировать Леона Троцкого в качестве единоличного председателя Советского Союза, фактически прекратив «тройку», которая действовала несколько месяцев."
 troika.22.d: "Несмотря на наши аргументы о том, что военные отчаянно нуждаются в большем финансировании, Конгресс все еще наложил вето на любую резолюцию об увеличении финансирования, ссылаясь на бюджетные вопросы."
 troika.23.d: "С учетом наших предупреждений о том, что советские военные не получили достаточных средств для защиты нашей нации, конгресс согласился увеличить военные финансовые средства, что, несомненно, покажет советским офицерам, что мы посвящаем себя поддержке их позиции."
 troika.24.d: "После нашей речи советский конгресс взбесился аплодисментами. На протяжении всего зала делегаты хвалили наши обещания в отношении дальнейшего развития и роста советской экономики, а также нашу приверженность поддержке социалистических движений по всему миру."
 troika.25.d: "Заслушав сегодня многочисленные свидетельские показания, Конгресс Советского Союза проголосовал за исключение Молотова из всех правительственных обязанностей, в то время как некоторые опасались, что Молотова может использовать своих сторонников в армии, чтобы оказать давление на конгресс против этого решения, военные остались верными конгрессу."
 troika.26.d: "Заслушав сегодня многочисленные свидетельские показания, Конгресс Советского Союза проголосовал за исключение Бухарина из всех правительственных обязанностей, в то время как некоторые опасались возможности того, что Букарин будет использовать своих сторонников в армии, чтобы надавить на конгресс против этого решения, военные остались верными конгрессу."
 troika.27.d: "Заслушав сегодня многочисленные свидетельские показания, Конгресс Советского Союза проголосовал за исключение Зиновьева и Троцкого из-за всех обязанностей правительства, хотя некоторые опасались, что Троцкий сможет использовать своих сторонников в армии, чтобы оказать давление на конгресс против этого решения, военные остались верными конгрессу."
 troika.37.d: "Противоречия между членами тройки привели к стагнации Советского Союза. Подозрения коррупции и сговора с военными заставили российский Сенат не доверять тройки . Амбициозный генерал использовал свое влияние для формирования чрезвычайного правительства. Коммандер Михаил Тухачевский , будучи спорной фигурой и враждебным критиком тройки , пообещал обеспечить стабильность и процветание Советскому Союзу и вести рабочий класс к полному и полному экономическому освобождению от капитализма и буржуазного либерализма."
 soviet.31.d: "Советы послали 2000 пушек, чтобы помочь в борьбе за освобождение Иберии!"

 sovietpol.0.d: "Империалисты объявили войну нам, женщинам и мужчинам, хватайте оружие, ваши шлюхи и свои морщины и начинайте работать во имя славы родины и триумфальной победы революции!"
 sovietpol.1.d: "Наши усилия по созданию легкой и тяжелой промышленности до сих пор были успешными. Каждую неделю новое предприятие увеличивает объем своей продукции, хотя мы все еще далеки от наших целей, мы заложили очень важную основу для их окончательного завершения."
 sovietpol.2.d: "По мере того, как наша индустрия растёт без арендной платы, мы отчаянно нуждаемся в каждом работнике, которого мы можем найти, и поэтому было выдвинуто предложение о том, чтобы доставить в города мужиков (пасьянов), с тем чтобы они могли помочь нам расширить нашу индустрию, однако это также еще больше дестабилизирует и без того неустойчивое снабжение продовольствием."
 sovietpol.3.d: "Наше решение использовать рабочих с земли, возможно, дало нам необходимую рабочую силу для достижения наших целей, но это вызвало нехватку продовольствия, которая повредила нашим отношениям с местными крестьянами."
 sovietpol.4.d: "Наше решение не использовать рабочую силу Мужика привело нас к тому, что мы не смогли достичь наших целей, в то же время мы избежали возможной нехватки продовольствия, которая могла быть вызвана тем, что мы полагались на мужик, а не на весь его ужас."
 sovietpol.5.d: "Поскольку Союз стоит за большинством западных стран технологически, поскольку ощущается нехватка квалифицированной рабочей силы, мы начали вкладывать средства в обучение новых инженеров, специалистов и ученых, и это, как мы надеемся, должно в значительной степени способствовать продвижению нашей страны вперед."
 sovietpol.6.d: "Начата новая правительственная политика, в рамках которой образцовым работникам промышленности будет присвоен особый почетный звания под названием"Shock Worker of the Socialist Labour". This gives them a badge, certificate and a financial initiatve, all of which should hopefully lead to greater labour discipline and improvement of morale."
 sovietpol.7.d: "Недавно закончилось строительство Белого моря и Балтийского канала, соединяющего Белое море с Балтийским морем, используя реку Нева и Свир, и мы надеемся, что это позволит улучшить нашу морскую торговлю и поможет Беломорску стать крупным городом в регионе."
 sovietpol.8.d: "Несмотря на то, что большая часть этой отрасли находится главным образом в Уралах, Кузбасе, Ленинграде и Москве, она также начала расширяться в Казахстане и других слаборазвитых регионах нашего Союза, оказывая им большую помощь в их экономическом развитии."
 sovietpol.9.d: "В стране создаются первые современные заводы, которые обладают производительностью, эффективностью и качеством, сопоставимыми с частными западными, хотя их и не так много, но они закладывают основы для создания современной промышленности, что действительно является отличительной чертой успеха социализма!"

 sovietpol.20.d: "Недавно PGOTZ, сельскохозяйственный трактор, производимый на танкерных заводах Перма и Горки, начал использоваться в массовом масштабе в Союзе, несмотря на то, что он основан на американской Интернационале 15/30 и мы так и не получили лицензии на его строительство, кража не является кражей, если она посягает на капиталистов, которых они сами крадут у своих рабочих. Иногда подобные действия необходимы для обеспечения будущего социализма."
 sovietpol.25.d: "Необходимость укрепления государства означает, что мы должны также принимать меры по реформированию преподавания и правил школьного обучения и образования, и поэтому мы приступим к внедрению системы консультирования по трем основным формам среднего образования, а также введению обязательной школьной формы, включающей, разумеется, обязательные для девочек пороховые коктейли."
 sovietpol.26.d: "Наш любимый лидер последовательно начал формировать успешный культ личности вокруг себя, который (правильно) вызывается во всех формах национальной пропаганды за свою смелую и мудрую личность и свою популярность среди народа."

 sovietpol.100.d: "Наше решение вступить в войну, сталкиваясь с серьезными проблемами в области продовольственной логистики и поставок, вызвало серьезный голод, который серьезно подорвал стабильность нашей страны и серьезно подорвал нашу репутацию у советских крестьян."
 sovietpol.101.d: "Наше решение вступить в войну, сталкиваясь с серьезными проблемами в области продовольственной логистики и снабжения, вызвало небольшой голод, который повредил стабильности нашей страны и подорвал нашу репутацию у местных крестьян."
 sovietpol.102.d: "Наше решение вступить в войну, сталкиваясь с серьезными проблемами в области продовольственной логистики и поставок, привело к незначительной нехватке продовольствия по всей стране, что несколько повредило стабильности нашей страны."

 sovietpol.1000.d: "В настоящее время 22 члена КРП из числа трудящихся обратились в письменной форме к Кирову с просьбой помочь исцелить разногласия, которые, по их мнению, возникли между работниками и партийными лидерами в России. В числе их жалоб они отметили, что буржуазные элементы влились в партию, размывая влияние пролетарских инициатив и усиливая недовольство среди социалистов; они протестовали против подавления представительной демократии в профсоюзах и тенденции к одностороннему принятию решений партией и профсоюзной бюрократией; все они были бывшими работниками металлоработников, связанными с Всероссийским союзом работников металлургии, и имели давнюю историю пропаганды активной деятельности трудящихся в партии Большевик , что сделало этот призыв весьма популярным среди других политических и социальных деятелей."
 sovietpol.1001.d: "Поскольку Киров отверг призыв двадцати двух, оппозиция была вынуждена создать свою собственную фракцию, чтобы сразиться с Кировым и его союзниками, теперь они призывают к дебюрократизации экономики и поддержке укрепления демократии и другой синдикалистской политики."
 sovietpol.1003.d: "Всероссийский союз писателей, возглавляемый Евгением Замятином, официально заявил о своей поддержке Шлиапникова, в числе основных причин для чего, как утверждается, было их стремление не допустить выдумки политики, что резко контрастирует с Всероссийской ассоциацией пролетарских писателей, которая пропагандирует гегемонию ценностей рабочего класса в фикции, а также поддерживает Кирова как преемника Ленина."
 sovietpol.1004.d: "Почти все профсоюзы поддержали Шлиапникова в его стремлении стать премьером Советского Союза."
 sovietpol.1005.d: "Оппозиция рабочих решила начать тур по Советскому Союзу с делегатами и рабочими по всей стране, надеясь, что таким образом они смогут увеличить свою поддержку среди населения и убедить некоторых делегатов проголосовать за них."
 sovietpol.1006.d: "Шлиапников начал свой тур с посещения многих заводов, чтобы обеспечить поддержку рабочих в его стремлении стать премьером и оказать давление на делегатов, чтобы они проголосовали за него."
 sovietpol.1007.d: "Шлиапников выступает перед многими делегатами, пытаясь убедить их в том, что то, что он поддерживает, является не синдикативизмом, а альтернативной коммунистической интерпретацией."
 sovietpol.1008.d: "Тур Шлиапникова закончился."
 sovietpol.1049.d: "Сегодня Коллонтай пытался выступить с речью перед местными лидерами, но мы исключили ее из списка кураторов."
 sovietpol.1050.d: "Более 2000 делегатов прибыли на конгресс для голосования по вопросу о том, кто станет премьером Советского Союза и по другим ключевым вопросам."
 sovietpol.1051.d: "После трудного и кажущегося нескончаемого избирательного процесса делегаты проголосовали и результаты были привлечены к ничьему удивлению, Шлиапников стал победителем и таким образом стал новым премьер-министром Советского Союза. В своей первой речи в качестве нового премьера он пообещал новую эру Ленинизма, только одну из которых была связана с контролем за профсоюзами, демократическим управлением и транспарентной бюрократией. Несмотря на его лучшие попытки, некоторые все еще отвергают его премьеру и называют его ревизионистом синдикалистом."
 sovietpol.1052.d: "После трудного и, казалось бы, нескончаемого избирательного процесса, делегаты проголосовали и результаты были привлечены. Никому не удивительно, что Киров стал победителем и таким образом стал новым премьером Советского Союза. Это важный момент в истории Советского Союза. В своей первой речи в качестве нового премьера Киров заявил о своих намерениях продолжать политику Ленина и утверждать, что СССР не попадает в руки фальшивых синдикалистов, таких как Шлиапников."

 sovietpol.1100.d: "По состоянию на сегодняшний день председатель Калинин был подвергнут временному домашнему аресту, и Михаил Фрунце объявил его временным председателем, что вызвало большое возмущение, поскольку многие осудили военный переворот как незаконный, но сам Тухачевский отказывается уйти в отставку и утверждает, что его долг состоит в том, чтобы защитить свою родину от троцкизма."
 sovietpol.1101.d: "Почти все дивиденды дезертировали в пользу оппозиции, однако отсутствие координации и недоверия между большинством из тех, кто еще не принял Тухачевский, означает, что прогресс был незначительным, если не считать официального сопротивления по отношению к нему; только время покажет, сможет ли Тухачевский справиться с этими диссидентами достаточно быстро, чтобы избежать их свержения."
 sovietpol.1102.d: "Председатель Фрунце выступил сегодня со своей первой речью перед толпой сотен человек, он осудил дезертировавших солдат и политиков как предателей родины и призвал к единству против троцкизма и капитализма."
 sovietpol.1103.d: "Против переворота Кирова вспыхнул большой протест! Требуя немедленной отставки Фрунце и Тухачевского, протестующие переполнились Москвой и другими городами России. Если мы ничего не сделаем, это может серьезно дестабилизировать советское правительство и вызвать потерю премьеры Тухачевского."
 sovietpol.1104.d: "Тухачевский направил свои войска для подавления беспорядков, которые распространились по всей Москве и ее окрестностям, и приказы не отступать, несмотря на оппозицию, до сих пор привели к гибели 13 человек и ранению 565 человек, что серьезно подорвало легитимность нашего режима."
 sovietpol.1105.d: "Похоже, что обязанности, возложенные на Председателя Фрунце, вызвали у него стресс, усталость, и человек кажется еще более слабым."
 sovietpol.1106.d: "После нескольких дней усталости и головных болей Фрунце сегодня скончался от инсульта, и его смерть является большим ударом для Тухачевского, который вряд ли найдет такого преданного лениниста и честного человека, который будет выполнять функции председателя этой антитроцкой хунты."
 sovietpol.1107.d: "Тухачевски сейчас стоит перед трудным решением - выбрать председателя. Среди возможных кандидатов Николай Ежов из ОПУ, советская секретная полиция, или Климент Ворошилов, высокопоставленный генерал в Красной Армии. Однако эти два человека очень амбициозны и легко могут обойти Тухачевский, так что более безопасным, хотя и более непопулярным решением было бы то, что Тухачевский просто стал бы президентом и премьером."
 sovietpol.1108.d: "Ворошилов в последнее время направлял жестокие слова против выбора Тухачевского в качестве Ежова. Ворошилов твердо убежден в том, что хитрый секретный агент полиции просто откажется от Тухачевского и установит свое собственное искаженное представление о Ленинизме, построенном на терроре."
 sovietpol.1109.d: "Вознесение Ежова на Председателя Советского Союза также ознаменовало начало значительно расширенной ОГУС с гораздо большим бюджетом и гораздо большими державами, все ради борьбы с антигосударственным терроризмом, что дало Ежову еще больший контроль над государством, чем обычный председатель, и поставило Тухачевский в опасное положение."
 sovietpol.1110.d: "Сегодня вечером премьер-министр Тухачевский был осажден неизвестным ассасином с полной хладнокровной кровью, когда он готов был выступить с речью в Москве, одинокий стрелок застрелил его, а последовавшая за этим паника в большой толпе позволила этому человеку быстро сбежать."
 sovietpol.1111.d: "После непродолжительного периода скорби по Тухачевскому Ежов полностью взял на себя роль премьера, используя ОГПУ для запугивания, подкупа и заключения в тюрьму своих оппонентов и сопротивления."
 sovietpol.1112.d: "Недавно Ежов выступил с жесткими заявлениями против выбора Тухачевского стать Ворошиловым председателем. Он утверждает, что укрепление власти в СССР только вокруг армии подорвет социализм и что Ворошилов не является человеком, которому действительно можно доверять ни одной власти."
 sovietpol.1113.d: "Похоже, что пока Тухачевский не решает правительственные вопросы и проводит время с бюрократами и политиками, Ворошилов занимает свое положение как генерала, так и председателя, с тем чтобы с большим энтузиазмом расширить свое влияние и распространиться на Красную Армию. Если этот подъем власти Ворошилава выйдет из-под контроля, возможно, он сможет перехитрить самого Тухачевского и подняться на пост премьер-министра через кровь и пулю."
 sovietpol.1114.d: "После осуждения и критики чрезмерной опоры Тухачевского на гражданскую администрацию и его соболезнований профсоюзам со своими коллегами по военной службе и некоторыми высокопоставленными членами ПСР Ворошилов встал в неохраняемую резиденцию Тухачевского ночью и арестовал его. На следующее утро Ворошилов незамедлительно объявил о заключении Тухачевского под стражу в связи с участием в антисоветском соглашении с профсоюзами и валькистами, а затем заявил о необходимости немедленного наращивания военного потенциала и реорганизации СССР, с тем чтобы предотвратить дальнейшее подрыв общества внутри страны и за рубежом, и публично сделал себя премьер-министром с единственной целью достижения этой цели."
 sovietpol.1115.d: "Решение Тухачевского было встречено многими критиками по всему СССР, которые называют его авторитарной мерой, и даже Ворошилов и Ежов были обнажены таким решением. Несмотря на то, что они не могут ничего сделать, кроме жалоб, теперь, когда Тухачевский полностью контролирует как правительство, так и Красную Армию."
 sovietpol.1116.d: "Киров организовал большой оппозиционный фронт против захвата [Root.Get Header], и он и его группа начали не только вооружать и укреплять свои собственные полномочия и позиции, но и массово производить пропаганду и распространять ее среди населения, призывая к восстановлению диктатуры пролетариата к власти, а не к сохранению этой завуалированной военной автократии."
 sovietpol.1117.d: "Многие члены РКП начали выражать свою полную поддержку Кирову, после чего большое число совитов заявили о поддержке цели Кирова. Это довольно большой удар, так как большинство экономики организовано автономными свитами. Тухачевски, судя по всему, в значительной степени возмущено этим решением совиетов и теперь отчаянно ищет новых союзников, где бы они ни были найдены."

 sovietpol.1201.d: "Уральский и сибирский метод представляет собой попытку заручиться поддержкой режима Закупки зерна . Специальные комиссии, состоящие из бедных и средних крестьян, затем установили квоты на закупку зерна для деревенских домохозяйств в соответствии с классным подходом. Это означало, по крайней мере в теории, что деревня заставит кулаков сдать свое зернистое зерно, тем самым удовлетворив львиную долю деревенских заданий и, возможно, оставив даже часть зерна, которую можно было бы делить с бедными. В тех случаях, когда домашние хозяйства противостоят их назначениям, наказание может быть оценено в виде штрафа в пять раз выше стоимости задолженного пиатикратка - и в противном случае они могут столкнуться с принудительным трудом до одного года в соответствии с положениями статьи 61 Уголовного кодекса. В тех случаях, когда домашние хозяйства противостоят их назначениям, их имущество может быть конфисковано до двух лет.""
 sovietpol.1202.d: "Мы не приняли никаких мер по ужесточению репрессивных мер в области закупок зерна, предписали ОГПУ активизировать свою кампанию против городских спекулянтов и торговцев зерном, имеющих связи с городом, а также упраздняем руководителей коллективных фермерских хозяйств, виновных в сохранении излишних запасов зерна или в их продаже на стороне, мы также приказали ОГПУ принять оперативные меры против кулаков, организующих террористические акты."
 sovietpol.1203.d: ""Прошлый год был годом больших прорывов на всех фронтах социалистического строительства. В центре этого прорыва было и продолжает оставаться решительное наступление социализма против капиталистических элементов в городе и сельской местности. Характерной чертой этого наступательного события является то, что он уже принес нам ряд решающих успехов в основных сферах социалистического восстановления нашей национальной экономики. Поэтому мы можем заключить, что наша партия не видела, как бы наша партия могла организовать перемены и начать успешное наступление против капиталистических элементов. Наконец, это было третье достижение партии в прошлом году. Я имею в виду радикальные изменения в развитии нашего сельского хозяйства из небольших, отсталых, индивидуальных фермерских хозяйств в крупные, передовые, коллективные сельскохозяйственные работы, совместное культивирование земли, машин и тракторов в артиллериях, то есть коллективное наступление, основанное на современной технике, и, наконец, гигантские государственные хозяйства, оснащенные сотнями тракторами."
 sovietpol.1204.d: "Наконец-то нам удалось создать запас зерна, который даст нам возможность маневрировать в случае иностранной или внутренней войны, и это было воспринято как большой успех, и пропагандистские деятели уже поймали его, чтобы создать романтику гордых советских крестьян и их усердную работу."
 sovietpol.1205.d: "После неудачного введения мер пресечения в отношении хитрых крестьян в Союзе начали разрастаться крупные аграрные восстания, как прыщи, даже те, которые не были поставлены в эти строгие условия, стали беспокоиться из-за боязни того, что вскоре они могут подвергнуться аналогичной политике, что значительно усложнит применение этих мер, поскольку любое усиление интенсивности лишь усугубит сопротивление крестьян к коллективизации и самому режиму."
 sovietpol.1206.d: "Вновь созданные 25 тысяч человек создают хаос по всей сельской местности, официально им разрешено применять силу только против кулаков, но крестьяне среднего и низшего классов вскоре были втянуты в мэлстром конфликта, несмотря на то, что они сообщают, что кулаки все еще были изгнаны из своих запасов и их запасов и орудий, переданных коллективным хозяйствам, что всегда является великим достижением."
 sovietpol.1207.d: "Центральный комитет предсказал коллективизацию 9,6% крестьян после одного года коллективизации, но нам удалось превзойти это и собрать [?"
 sovietpol.1208.d: "В настоящее время было опубликовано исследование Инспекции трудящихся и крестьян по вопросу о перспективах коллективного сельского хозяйства, в котором сообщается о полном отсутствии планирования в области коллективного сельскохозяйственного строительства, в результате чего, по их словам, коллективные хозяйства спонтанно развиваются за счет использования методов проведения кампаний в некоторых регионах, где местные партийные организации взяли на себя ответственность за ведение сельского хозяйства; их лидеры плохо информированы и не имеют достаточной квалификации; они практически не получают помощи от местных земельных и кооперативных учреждений; они получают от государства лишь небольшую экономическую помощь."
 sovietpol.1209.d: "Большинство крестьян возмущаются нашей политикой массовой коллективизации, считают хорошее образование способом покинуть коллективные фермы и переехать в города."
 sovietpol.1210.d: "Если мы не будем действовать быстро, это сорвет нашу программу массовой коллективизации."
 sovietpol.1211.d: "С тех пор, как государство взяло на себя обязательства по обеспечению благосостояния, они также винят премьера [Root.Get Header] во всех своих проблемах после вступления в коллективную ферму."
 sovietpol.1212.d: "Горожане начинают нагнетать свой гнев на правительство за коллективизацию в отношении членов своего селения. Феи и семейные ссоры, возмущение новым неравенством в деревне разрушают любые мечты о солидарности крестьян."
 sovietpol.1214.d: "Представители партийных ведомств, которым поручена коллективизация, начали соперничать друг с другом в целях достижения лучшего и лучшего прогресса в своих соответствующих регионах, стремясь тем самым использовать эти успехи для продвижения своих позиций в партии."
 sovietpol.1215.d: "Беспорядок, спровоцированный коллективизацией во многих сельских районах, облегчил бандитам и преступникам ограбить население, что сильно повредило нашей репутации в крестьянстве, поскольку они не видят, что мы можем защитить их от бандитов и преступников."
 sovietpol.1216.d: "Убийство скота и овец привело к значительному сокращению количества кожей и шерсти для потребительских товаров."
 sovietpol.1230.d: "По рекомендации Бориса Петровича Шеболдаева Политбуро была создана комиссия, председателем которой будет Яков Аркадьевич Яковлев, которая, как предполагается, через две недели разработает указ о коллективизации и будет состоять из восьми подкомитетов, в состав которой будут входить в основном представители соответствующих центральных учреждений и секретарей провинциальных партийных комитетов регионов, производящих зерновые культуры."
 sovietpol.1231.d: "Комиссия завершила работу над проектом указа о коллективизации и представила его Пулитбуро. Хотя проект не имеет точного графика для коллективизации, он предполагает, что он, скорее всего, будет завершен в течение пяти лет и в основных районах производства зерна в течение двух-трех лет, при этом следует отметить, что это может произойти еще раньше в некоторых округах. Несмотря на то, что основной упор в проекте делается на организационные, производственные и управленческие вопросы. В проекте указа говорится о том, что одни лишь цифры не являются основой для оценки успеха движения, и в нем содержится четкая ссылка на предыдущие месяцы в процентных долях собирателей в текущей системе процентных долях среди провинциальных должностных лиц. Из проекта также явствует, что так называемая материально-техническая база для крупномасштабного сбора сельскохозяйственной продукции отсутствует и что сельские районы будут по-прежнему полагаться на проекты законов о защите животных и простые механизмы в обозримом будущем, ожидая массового производства тракторов и других сельскохозяйственных машин. В проекте подчеркивается центральное значение искусства как основной формы коллективной фермы на нынешнем этапе, и отмечается, что каждый растущий коллективный опыт в области социализации, должен также иметь особое значение для развития событий в коммуне."
 sovietpol.1232.d: "Яковлев, однако, посвящается Борису Петровичу Шеболдаву и Андрею Андреевичу Андрееву Андрееву Андрееву, соответственно, первым секретарям партийных организаций Нижнего Волги и Северного Кавказа, регионы которых в настоящее время возглавляют страну в деле коллективизации и которые были наместниками быстрых сторонников того, что Мендель Хатайевич называет «быстрыми темпами», и того, что они, как, например, [Рот. Гетевич], назвали «отсталым движением» ниже."
 sovietpol.1233.d: "Яковлев сел вместе с [Root.Get Header] и пересмотрел постановление, чтобы завершить его. С [Root.Get Header]/s были установлены и расширены темпы оптовой коллективизации, большинство технических вопросов, касающихся организации и производства, были сокращены, и были устранены любые опасения в отношении крестьянского formulatory или prejudice."
 sovietpol.1234.d: "Этот указ был опубликован в прессе на национальном уровне после его утверждения; он является важной вехой в отношениях между режимом и народом, что служит началу кампании по коллективизации в масштабах и в неожиданных темпах, обусловленных заявлениями ноябрьского племянника и даже его самыми радикальными сторонниками. Это постановление положило начало кампании, как на центральном, так и на провинциальном уровнях, с лишь нечеткими руководящими принципами и достаточно открытым мандатом на продвижение вперед. Само постановление основано на ряде опасно ложных предположений, а также на национальном коллективизме, который в данный момент не хотел заранее организовать все, чтобы то, что [Рот Гет Лидер] назвали хитроумным, массовым движением. . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . ."
 sovietpol.1235.d: "В этой игре появилась новая игра, названная «Найди и поищи», в которой одна группа играет роль команды реквизитов, а другая — как «кулакс», скрывая зерно."
 sovietpol.1236.d: "Кулакс состоит из примерно 63 000 "контрреволюционных" семей, которые будут казнены или изгнаны из страны и будут конфискованы их имущество; вторая группа состоит из 150 000 домохозяйств, получивших название "эксплуатация" и "активные противники" коллективизации, которые будут депортированы в отдаленные районы востока и севера, но им будет разрешено сохранить определенное имущество."
 sovietpol.1237.d: "ОГПУ было приказано [Root.Get Header] начать очистку кулаковых элементов из сельской местности с целью уничтожения кулаков в качестве класса. ОВПУ , как это было впервые предписано, чтобы ОВПУ, т.е. до региональных полномочных представителей, на севере, в Уралах, Сибири и на Дальнем Востоке, сообщали о местах переселения и количестве кулаков, которые могли бы быть размещены в этом районе. ОГПУ было поручено отделу секретных операций определить районы, где должны быть произведены аресты и изгнаны в первую очередь, и сообщить о количестве арестов за последние шесть месяцев, количестве контрреволюционных организаций, количестве кулаков, которые должны быть направлены в концентрационные лагеря, где необходимо было бы открыть новые лагеря, и о том, можно ли было бы организовать кулакские деревни без охраны."
 sovietpol.1238.d: "[Root.Get Header] выпустил телеграмму о декулакации для полномочных представителей на Северном Кавказе, в Центральном Черном Земном регионе, mLower Volga, Middle Volga, Urals и Sibri, в которой говорится, что информация из ряда мест, о которых известно о начале ссылки и экспроприации кулаков, означает декулакизацию провинциальными или местными должностными лицами, о чем, по всей вероятности, не идет речь, и что эта телеграмма призывает полномочных представителей обеспечить принятие мер для того, чтобы в партийных организациях этот вопрос поднимался в целях проведения кампании организованным образом в соответствии с директивами ОГПС. Они далее предупредили полномочных представителей обеспечить, чтобы семьи Красной армии не были среди эмигрантов, и ускорить представление планов изгнания со всеми расчетами и картами в ОГПУ."
 sovietpol.1239.d: "1. Прекратить применение законов об аренде земли и использовании наемного труда в сельском хозяйстве (разделы VII и VIII Общего принципа землепользования и земельной реорганизации) к отдельным крестьянским хозяйствам, находящимся в строгой зоне оптовой коллективизации. Исключения из этого правила должны регулироваться исполнительными комитетами рионов под руководством и контролем Исполнительного комитета ОКРУГ."
 sovietpol.1240.d: "Политбуро издал указ, в соответствии с которым Центральному комитету было поручено издать директиву о закрытии церквей, а также издать приказы о чистке промышленных предприятий от отдельных элементов кулака и принять решительные меры в высших учебных заведениях и высших технических учебных заведениях для борьбы с контрреволюционными молодежными группами, связанными с элементами кулака."

 sovietpol.1300.d: "Государственное туристическое агентство Советской России, созданное в 1929 году для размещения внутренних и иностранных путешествий. Будучи государственной компанией, организация имеет практическую монополию на туризм в стране и располагает сотнями ресторанов, отелей, валютных бирж, автобусных компаний и судов. Каждый год сотни тысяч людей путешествуют. Наиболее популярными пунктами являются Москва, Ленинград и Каукаус, Совиет-Ривьера . Кроме того, она предлагает работникам, которые очень хорошо справились со своими квотами в одном из многих санаторий и гостиниц, расположенных рядом с Черным морем. Интурист не только играет важную роль в путешествии, но и выполняет важную роль в изобразении Советского Союза в качестве рабочего рая, демонстрируя иностранным посетителям превосходство социалистической системы, а также предоставляет государству некоторые из столь необходимых крепких (западных) валют."
 sovietpol.1301.d: "Наши действия, направленные на прекращение цензуры прессы, привели к тому, что пресса теперь регулярно критикует нас, если мы провалим кампанию или политику."
 sovietpol.1302.d: "Сегодня премьера фильма состоялась в Василии Журавловцах, в котором тысячи людей будут смотреть фильм в первый день. Фантастический фильм запланирован на 1946 год, в котором у совитской космической программы возникли некоторые проблемы. Профессор Карин осуждает своего одновременного, профессора Седикха, за то, что он был слишком стар и психически неуравновешен. Однако профессор Седик и его помощник Марина игнорируют критику профессора Карина и успешно приземляются на Луну, где, к сожалению, возникают некоторые проблемы, угрожающие жизни первых двух людей Луны. К счастью, им удалось выжить, а космонавты смогли вернуться в Москву. Это один из первых фильмов в истории, который реалистично изображает космический полёт и тем самым относит к себе невесомость, уже получив положительные отзывы нескольких ученых и любителей фильмов."
 sovietpol.1303.d: "Здоровье Владимира Ленина долгое время снижалось и снижалось, но никто не ожидал, что это произойдет в ближайшее время. Это катастрофа, поскольку Владимир Ленин был единственным, кто удерживал различные политические фракции от репрессии и борьбы друг с другом, так как его любили большинство членов коммунистической партии, независимо от того, к какой фракции они принадлежат. Мы можем только надеяться, что он восстановится и предотвратит полный крах Советского Союза и, надеюсь, положит конец политическому разрыву между фракциями."
 sovietpol.1304.d: "Советское правительство всегда пренебрегало жизнями из-за того, что они"petty-bourgeois nature." But the stability of the Soviet government prevented them to protest their treatment by the government. But with Lenin's demise and the following chaos they have finally started to revolt against the government and call for equal treatment of peasants and workers."
 sovietpol.1305.d: "Всеобщий Центральный совет профсоюзов готовится к всеобщей забастовке после восстания крестьян."
 sovietpol.1306.d: "Трудящиеся, объединенные за Всесоюзным Центральным советом профсоюзов, прекратили свою работу, вышли на улицу и начали протестовать против политики правительства в отношении приоритизации военной промышленности над тяжелой и легкой промышленностью, хотя они не достаточно могущественны, чтобы свергнуть наше правительство, они способны резко дестабилизировать советскую экономику, поскольку наша легкая и тяжелая промышленность довольно мала, чтобы любое препятствие в этих секторах могло привести к полному экономическому краху."
 sovietpol.1307.d: "Железнодорожные рабочие присоединились к общей забастовке, что еще более усугубило ситуацию для правительства, поскольку сейчас связь между различными штатами постепенно разрывается, и для того, чтобы сделать эту ситуацию еще хуже, некоторые железнодорожные рабочие даже начали уничтожать части железных дорог, это будет очень дорого и усугубит политический шторм, который мы переживаем в данный момент."
 sovietpol.1308.d: "Глубокий политический кризис, последовавший за смертью Ленина, наконец-то нанес ущерб экономике, вызвав полный экономический спад. Поскольку рабочие и крестьяне возмутительны, большинство фабрик остаются пустыми, не имея никого, кто мог бы работать, и большая часть сельскохозяйственных земель сейчас находится в подвале. Мы можем только надеяться, что мы сможем выдержать шторм и омолодить нашу экономику и, наконец, начать крупную кампанию по индустриализации."
 sovietpol.1309.d: "С Советским Союзом в таком политическом и экономическом кризисе у большинства людей нет денег, чтобы купить нашу государственную газету, Правду, но другие просто не делают этого, но наша государственная газета в знак протеста, в результате чего мы потеряли важные средства, чтобы оживить экономику."
 sovietpol.1310.d: "Студенты растут, большинство студентов выступают против авторитарной политики Ленина, правительство посылает в полицию, чтобы подавить их, что привело к ожесточенным столкновениям между студентами и полицией, в то время как полиция выигрывает большинство из этих драок, это стоило нам большой популярности."
 sovietpol.1311.d: "После начала всеобщей забастовки под руководством Всеобщего центрального совета профсоюзов многие люди выступили против всеобщей забастовки, увидев ненужную причину еще большей нестабильности в эти трудные времена."
 sovietpol.1312.d: "Сегодня Киров выступил с речью, в которой он призывает к единству людей, стоящих за государством, с тем чтобы положить конец анархии и хаосу и восстановить стабильность в государстве. Поскольку Киров очень харизматичен, его речь была очень успешной. Благодаря успеху речи его политический настрой несколько улучшился, сделав его серьезным претендентом на пост премьер-министра."
 sovietpol.1313.d: "Ходят слухи о планируемом поглощении во главе с Леоном Троцким, что вызвало беспокойство у многих политиков, поскольку Леон Троцкий чрезвычайно могуществен, а сопротивление большинства других политиков является его самым большим препятствием для завоевания власти."
 sovietpol.1314.d: "Созвана встреча между важными генералами, такими, как маршал Ворошилов, маршал Фрунце и маршал Тухачевский и Ежов, лидер ОГПУ."
 sovietpol.1315.d: "Сегодня Молотов, Бухарин и Зиновьев объявили о своем намерении сотрудничать в целях предотвращения поглощения Троцкого и восстановления стабильности в Советском Союзе."
 sovietpol.1316.d: "Всесоюзный центральный совет профсоюзов объявил, что он прекратил всеобщую забастовку, потому что они не смогли поддержать забастовку."
 sovietpol.1317.d: "Экономика, наконец, восстановилась после экономического спада, хотя нам все еще нужно стабилизировать страну, конец экономического хаоса дал нам возможность наконец положить конец хаосу."
 sovietpol.1318.d: "Советы одобрили Сергея Кирова в качестве предпочтительного премьера Советского Союза."
 sovietpol.1319.d: "Наш политический кризис наконец-то закончился после прихода к власти нового правительства, но по-прежнему существует огромный политический разрыв между различными группировками, что мешает нашему правительству эффективно функционировать."
 sovietpol.1320.d: "Сергей Киров стал новым временным премьер-министром, после того как жена Ленина раскрыла письмо от Ленина, в котором говорилось, что Сергей Киров является его любимым наследником, хотя он не будет новым премьер-министром до 26-го Конгресса, который состоится в следующем году, но это поможет Советскому Союзу восстановить некоторое чувство стабильности, так как теперь он, наконец, вновь получит лидера."
 sovietpol.1321.d: "Михаил Тухачевский штурмовал Москву, нашу столицу, и объявил чрезвычайное положение, сопровождаемое несколькими его самыми преданными войсками и некоторыми высокопоставленными генералами, среди которых были маршал Ворошилов и маршал Фрунце, а также Ежов - лидер ОГПУ."

 sovietpol.1322.d: "В период с 1919 по 1926 год геолог Урванцев совершил экспедицию на восточные подножия плато Путорана для поиска крупных месторождений угля и полиметаллических руд. В 1921 году Урванцев построил небольшой деревянный дом и продолжил исследование геологического состава и сооружений подземного участка. В связи с большими месторождениями природных ресурсов в регионе правительство приняло решение начать строительство Norilsk Combinate. Этот крупный строительный проект включает строительство нескольких сталелитейных заводов, жилых кварталов, улиц, электростанции и других объектов. Строительство этого нового города обеспечивает перевоспитание людей, которые представляют угрозу для нашей политической системы: тяжелая работа будет исцелять их грязные мысли."
 sovietpol.1323.d: "Недавно был выпущен фильм советских анимационных студий Soyuzmultfilm — новый мультфильм, известный как "Otkrovenieye". Этот мультфильм происходит в 1957 году в мире, управляемом тираническим валькистским режимом. Укрепленный город Москвы остается последним бастионом свободы и социализма во всем мире."Otkroveniye". Dmitry, along with two other Otkroveniye "Kapitans", face off massive monstrosities sieging Moscow known as the the "Schutz". These Schutz monstrosities have been created by the Valkist regime with the eventual goal of capturing the last bastion of free humanity and then finally destroying the world with ancient Germanic artifacts with esoteric powers.The film follows the relationship between the Kapitans and the battles that they fight against the Schutz. The film features a massive battle at the end between the Otkroveniye and the leader of the Valkists and the creators of the Schutz. The Otkroveniye achieve victory as they defeat the Schutz, sparking a worldwide revolution against the Valkist empire and humanity is liberated under global socialism.\n\nSoviet critics have acclaimed this film as the "greatest fairy tale of the 20th century", especially praising its small psychological themes. The film has even made its way to small film circles in the west based around foreign animation, where fans have begun playing Otkroveniye in smaller theaters subtitled in their native language. The release of Otkroveniye has even sparked the creation of some small obscure counterculture circles based around an interest in Soviet and proletarian film, animation, literature, and culture. Members of these circles have begun calling themselves 'Podrazhatels' (Russian for 'mimics'), with many so-called Podrazhatels learning how to speak Russian and applying for visas to visit the Soviet Union. However, these small groups are almost completely unknown to the public and are only found in a few of the larger western cities."
 sovietpol.1324.d: "В большинстве городов наблюдается нехватка жилья с тех пор, как мы начали резко расширять урбанизацию нашей страны, что привело к большому недовольству в городах людей, живущих на улице или в очень небольших зданиях."
 sovietpol.1325.d: "Для того чтобы решить проблему нехватки жилья, мы организовали общинные квартиры, или Коммуналки , в которых, как правило, размещается одна семья с одной общей кухней и туалетом. Привлекая людей к жизни в обществе, мы считаем, что они могут стать более коллективными по своему характеру: исчезнут личное пространство и собственность; семейная жизнь будет заменена коммунистическим братством и организацией; и человек будет подвергаться взаимному наблюдению и контролю со стороны общины. Некоторые дома были спроектированы для этого строительными архитекторами, называемыми общинными домами . В этих домах все имущество, включая даже одежду, будет делиться с жителями, домашние обязанности, такие как приготовление пищи и уход за детьми, будут возложены на команды на основе ротации, и каждый будет спать в одном большом общежитии, разделенном по признаку, с частными комнатами для секса."
 sovietpol.1326.d: "Советский Союз находится в процессе латинизации с 1929 года, и этот процесс поддерживается большинством партий, с тем чтобы облегчить сбор людей в Советском Союзе, которые будут охватывать весь мир. Одним из самых важных лиц, поддержавших этот процесс, является Анатолий Луначарский, комиссар Просвещения. С завершением латинизации Советского Союза было достигнуто большое достижение, которое покажет людям современность советского правительства."
 sovietpol.1327.d: "Советское правительство по приказу [Root.Get Header] прекратило процесс латинизации, который начался в 1929 году."
 sovietpol.1328.d: "Серебряный век русской поэзии был периодом, который начался в 1890-х годах и был периодом исключительно творческих поэзий. Новый репрессивный режим при [Root.Get Header] вынудил многих поэтов либо бежать, либо добровольно покинуть движение, либо быть казненным правительством."
 sovietpol.1329.d: "Большинство ортодоксальных социалистов выступают против использования линий сборки, вместо этого выбирая ремесленные магазины в качестве места для рабочих, поскольку даже Карл Маркс выступал против них, потому что рабочие должны видеть, что вы должны быть «мирами, в которых рабочие видят их отражаемый основной характер»."
 sovietpol.1330.d: "Мы начали расширять и модернизировать ремесленные магазины, поскольку именно так Маркс хотел производить продукцию, а не конвейерные линии, потому что они не являются зеркалами рабочих, в которых они могут видеть отражаемый ими основной характер."
 sovietpol.1331.d: "Самые большие поэты этого движения - Вадим Шершеневич, Рюрик Ивнев, Сергей Есенин и Анатолий Мариенгоф."
 sovietpol.1332.d: "Николай Бухарин, известный своим присутствием на конференции по культурному атеизму в 1925 году, выступил в поддержку газеты Безбожник , или Безбожник , которая является антирелигиозной газетой. Теперь он публично одобрил эту газету, что это значительно повысило популярность газеты. Газета известна своим радикальным антирелигиозным содержанием, самыми крупными целями которой являются иудаизм и христианство. В одном из журналов они обвинили раввинов и священников в сотрудничестве с буржуазией и другими контрреволюционерами, а в другом они заявили, что крестьяне являются паразитами, живущими на работах крестьян."
 sovietpol.1333.d: "В то время как движение под названием «Новый советский человек» существует с момента создания Советского Союза, новое правительство под руководством [Root.Get Header] официально поддержало это движение. Одна из главных причин поддержки движения заключалась в том, чтобы предотвратить рост троцкизма. Движение хочет создать нового человека, который был бы самоотверженным, образованным, здоровым, мускулистым и энтузиазмом в распространении социализма, у него также нет националистических настроений."
 sovietpol.1334.d: "Мы начали ослаблять родственные связи, значительно облегчая разводы, что привело к самому высокому уровню разводов в мире."
 sovietpol.1335.d: "Хор Красной Армии, официально запрещённый «Красная Армия» и «Красная Армия» СССР, является нашим самым известным хором для армии. В 1929 году хор посетил Русский Дальний Восток, развлекая войска, работающие на дальней восточной железной дороге. В 1935 году хор был присвоен Ордену Красного баннера и переименован в «Красную Армию и танцу СССР»." 
 sovietpol.1336.d: "Одной из самых популярных игр с 1920-х годов были "Reds and Whites", советские ковбои и индейцы, в которых дети играли события Гражданской войны в России, часто используя ружья, которые продаются специально для игры."
 sovietpol.1337.d: ""Специалист Байтинг" стал популярным видом спорта под [Root.Get Header] Спорт включает в себя принуждение промышленных экспертов признаться в разрушении и других ужасных преступлениях. из-за этого тысячи "буржуазных" или непартийных инженеров. Если машина сломается под руководством инженера, то инженеру будет предъявлено обвинение в разрушении."
 sovietpol.1338.d: "[Root.Get Header] издал указ, который заставляет каждого еврея в России отказаться от своей религии и принять русское имя, или столкнуться с угрозой депортации и конфискации своей земли. Синагоги по всей стране закрываются, так как они укрывают антисоветских предателей в глазах [Root.Get Header]."

 sovietscorched.1.t: "Украина начинает восстанавливаться"
 sovietscorched.1.d: "Наша Земная Тактика дорого обошлась Украине с ее народом. Кажется, теперь, когда регион начинает восстанавливаться, а местные жители начинают возвращаться к своим обычным повседневным обычаям. В то время как сожжение этого региона остается спорным вопросом, тактика имеет решающее значение для защиты нашей нации и революции. ~ ~В то время как память о войне постепенно исчезает в прошлом, мы можем теперь воспользоваться этой возможностью и начать восстанавливать Украину к ее прежней славе."
 sovietscorched.1.a: "Ваши имена могут быть неизвестны, но ваши деяния бессмертны."
 #
 sovietscorched.2.t: "Беларусь начинает восстанавливаться"
 sovietscorched.2.d: "Наша Земная Тактика дорого обошлась Беларуси с ее народом. Кажется, теперь, когда регион начинает восстанавливаться, а местные жители начинают возвращаться к своим обычным повседневным обычаям. В то время как сожжение этого региона остается спорным вопросом, тактика имеет решающее значение для защиты нашей нации и революции. По мере того, как память о войне постепенно исчезает в прошлом, мы можем воспользоваться этой возможностью и начать восстанавливать Беларусь к ее прежней славе."
 sovietscorched.2.a: "Ваши имена могут быть неизвестны, но ваши деяния бессмертны."
 #
 sovietscorched.3.t: "Восточная Польша начинает восстанавливаться"
 sovietscorched.3.d: "Наша Земная Тактика дорого обошлась народу Восточной Польши. Похоже, что сейчас, когда регион начинает восстанавливаться, а местные жители начинают возвращаться к своим обычным повседневным обычаям. В то время как сожжение этого региона по-прежнему вызывает споры, тактика имеет решающее значение для защиты нашей нации и революции. Но, когда память о войне постепенно исчезает в прошлом, мы можем воспользоваться этой возможностью и начать восстанавливать Восточную Польшу в ее бывшую славу."
 sovietscorched.3.a: "Ваши имена могут быть неизвестны, но ваши деяния бессмертны."
 #
