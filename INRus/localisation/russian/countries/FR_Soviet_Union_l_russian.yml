 SOV_modernise_redarmy: "Модернизация Красной Армии"
 SOV_modernise_redarmy_desc: ""
 SOV_triumph_over_valkism: "Триумф над реакциями"
 SOV_triumph_over_valkism_desc: "Теперь, победив в Великой Отечественной войне, мы можем взять на себя новую роль - глобальную супердержаву!"
 #Lenin
 SOV_Premier_Lenin: "Премьер Ленин"
 SOV_Premier_Lenin_desc: "Ленин сейчас самый могущественный человек в Советском Союзе. Он был лидером Октябрьской революции в 1917 году, которая навсегда изменила Россию. Планы Ленина, сосредоточенные на крупномасштабном развитии гражданской и военной промышленности, были внезапно остановлены после покушения на убийство в конце 1918 года, которое привело его к массовому перенаправлению средств в оружейную индустрию. Эта политика непопулярна для партии и населения. Как Ленин ответит на этот насущный вопрос?"
 SOV_help_agriculture: "Помощь сельскому хозяйству"
 SOV_help_agriculture_desc: "Советский Союз, несмотря на широкомасштабные усилия государства, по-прежнему в значительной степени не индустриализован, сохраняя сельскохозяйственные традиции в сельской России. Очевидно, что этот недостаток индустриализации и урбанизации не соответствует требованиям других стран мира и отстает в вопросе механизации. Премьер-министр Ленин подчеркивает важность улучшения сельского хозяйства не только для обеспечения поставок продовольствия в мирное время, но и для обеспечения того, чтобы Красная Армия была хорошо питалась в случае войны."
 SOV_continue_industrilization: "Продолжение индустриализации"
 SOV_continue_industrilization_desc: "Советское государство уже многое сделало в вопросе улучшения промышленного потенциала страны, но этого все еще недостаточно. Правительство должно будет сделать дальнейшие инвестиции в обрабатывающий сектор, особенно в сектор вооружений, который жизненно важен для выживания нашей страны."
 SOV_workplace_democracy: "Поддержка демократии на рабочем месте"
 SOV_workplace_democracy_desc: "Почти на всех фабриках нашей страны имеется совет трудящихся, известный как совиты. Совиты имеют жизненно важное значение для функционирования политической и экономической системы Советского Союза: они ведут переговоры о повышении заработной платы, совместно обсуждают пути улучшения рабочей ситуации и являются важным фактором вовлечения нормальных трудящихся в социалистическую политику, что побудило Ленина к дальнейшей поддержке, финансированию и расширению их разрешений."
 SOV_new_land_reform: "Новая земельная реформа"
 SOV_new_land_reform_desc: "Сердце России все еще находится в сельском хозяйстве, значительная часть нашего населения все еще работает на многих полях нашей страны, и Октябрьская революция практически не изменила этого, так как старый сельский порядок кулаков, богатых и бедных фермеров все еще стоит во многих местах, мы должны расширить возможности бедных фермеров по расширению своей собственности, тем самым улучшая урожаи и еще больше гарантируя наличие достаточного количества продовольствия на ближайшие годы."
 SOV_supress_reactionaries: "Реакции на прекращение операций"
 SOV_supress_reactionaries_desc: "Для лучшего будущего и стабильности нашей страны мы должны искоренить эти опасные элементы и, наконец, не допустить их экономического прогресса."
 SOV_prepare_congress: "Подготовка XXVI Конгресса"
 SOV_prepare_congress_desc: "Через несколько месяцев будет организован конгресс XXVI CPSU, нам нужно подготовить залы, места для сна и жилые помещения, а также послать тысячи приглашений самым преданным членам нашей партии по всей стране, от степей Дона до бесплодной пустыни Сибири."
 SOV_start_congress: "ОДИННАДЦАТЫЙ СЕКРЕТАРИАТ XXVI!"
 SOV_start_congress_desc: "Наконец, будет открыт конгресс XXVI СКПВ, начиная с вступительной речи премьер-министра Ленина, после чего начнутся недели жарких дискуссий, оценок, заявлений и речей, что станет идеальным моментом для определения экономического и политического курса Советского Союза на следующий год. Тысячи делегатов, как ожидается, прибудут в следующие дни, представляя как самые маленькие сельские деревни, так и крупнейшие метрополии СССР."
 SOV_kulak_question: "Вопрос кулак"
 SOV_kulak_question_desc: "Члены конгресса подняли критический и важный вопрос, связанный с позицией кулаков, многие члены конгресса считают их буржуазными элементами в социалистической стране, угрожающими разумному улучшению сельского хозяйства, другие же считают это пугающим и утверждают, что кулаки слишком важны для производства продуктов питания, тем самым заявляя, что они производят до многого, чтобы быть наказаны."
 SOV_army_doctrine_question: "Армейский вопрос"
 SOV_army_doctrine_question_desc: "В ходе конгресса внимание было привлечено к важному вопросу, касающемуся армии: многие члены конгресса считают, что политическое влияние КПСУ настолько велико, чтобы армия могла функционировать эффективно и независимо, особенно в случае войны. Поэтому некоторые члены считают, что генералам Красной армии должна быть предоставлена бóльшая автономия, в то время как другие считают, что политический надзор за армией имеет жизненно важное значение для сохранения верности армии революции. Каково окончательное решение?"
 SOV_foreign_policy: "Вопрос внешней политики"
 SOV_foreign_policy_desc: "Внешняя политика Советского Союза была сосредоточена с самого начала на экспорте революции за границу, и Ленин надеялся, что красная волна затопит всю Европу. К сожалению, этого не произошло, и многие члены партии считают, что деньги, потраченные на иностранные операции, могут быть более эффективно использованы для улучшения национальной экономики. Это докажет западным народам, что наша модель выше, и они сами начнут революцию, по мнению многих партийных членов."
 SOV_minorities: "Вопрос о меньшинствах"
 SOV_minorities_desc: "Советский Союз является разнородной страной, в которой проживают сотни уникальных этнических групп, каждая из которых имеет свои собственные традиции и культуру. Под руководством премьер-министра Ленина меньшинства, жестоко угнетенные во время царского режима, получили некоторые очень важные права. На благо страны - дальнейшее расширение этих прав или нынешняя система - является удовлетворительной? Большинство делегатов от меньшинств говорят о первом, в то время как многие члены российской партии считают его последним."
 SOV_secret_service: "Вопрос секретной службы"
 SOV_secret_service_desc: "Секретная служба СССР, ОГПУ, должна проделать большую работу: уничтожить реакционные элементы в стране и защитить интересы революции, которая дала им множество авторитетов. Многие члены партии хотят ослабить полномочия ОГПУ, утверждая, что крупнейшие угрозы уже ликвидированы, и что чрезмерные действия секретной службы подрывают доверие к социалистической системе."
 SOV_resignation: "Увольнение?"
 SOV_resignation_desc: "С начала XXVI Конгресса CPSU появились слухи об общем состоянии премьер-министра Ленина, его здоровье явно ухудшилось со времени последнего конгресса, и его проблемы стали очевидными во время вступительной речи, когда он кашлял несколько раз и демонстрировал признаки дыхания."
 SOV_congress_over: "Конгресс окончен."
 SOV_congress_over_desc: "Последние залы конгресса закрыли двери, последние поезда с делегатами конгресса сегодня ушли."
 #Kirov
 SOV_Premier_Kirov: "Премьер-министр Киров"
 SOV_Premier_Kirov_desc: "В результате обнародования завещания Ленина и последующих партийных выборов Сергей Киров стал новым лидером Советского Союза."
 SOV_support_from_the_poor: "Возврат к поддержке со стороны трудящихся"
 SOV_support_from_the_poor_desc: "Из-за иррационального акцента Ленина на оружейной промышленности он в значительной степени забыл о гражданской промышленности, что привело к тому, что большое число работников было рассеяно в ЦЗСО и отдалилось от Ленинизма. Премьер Киров попытается изменить это, переквалифицировав промышленность и сосредоточив больше внимания на потребностях рабочих."
 SOV_gain_support_vanguardist: "Заручиться поддержкой со стороны национальных коллективистов"
 SOV_gain_support_vanguardist_desc: "Премьер Киров смог прийти к власти только благодаря искусству компромисса, чтобы еще больше обеспечить поддержку внутри партии, ему нужно будет убедить Национальную группировку коллективистов поддержать его..."
 SOV_support_from_the_libertarians: "Заслужить поддержку со стороны либертарианцев"
 SOV_support_from_the_libertarians_desc: "Премьеру Кирову нужно пойти на компромисс с либертарианской фракцией партии, чтобы обеспечить поддержку его политики."
 SOV_support_peasents: "Приобретение поддержки со стороны крестьян"
 SOV_support_peasents_desc: "Поддержка крестьянского класса, который составляет значительную часть нашего населения, необходима для обеспечения нашей власти и влияния на сельскую местность."
 SOV_gain_support_soldiers: "Заручиться поддержкой солдат"
 SOV_gain_support_soldiers_desc: "Красная Армия является одной из крупнейших в мире и сыграла важную роль в защите интересов Октябрьской революции. Без них ничего бы не случилось. После беспорядков после смерти Ленина очень важно обеспечить военную поддержку."
 SOV_status_quo_upheld: "Статус Quo"
 SOV_status_quo_upheld_desc: "Премьер-министр Киров является символом стабильности и спокойствия Ленинистского статус-кво, что утешает многих граждан нашей страны в эти очень странные и напряженные времена, и поэтому мы можем использовать этот образ в позитивном образе нашей партии."
 SOV_enlighten_workers: "Просвещение рабочих"
 SOV_enlighten_workers_desc: "Как и Ленин, премьер-министр Киров хочет расширить общие знания трудящихся, рекламируя газеты, дешевые (информационные) книги и возможности для образования взрослых."
 SOV_strengthen_workplace_democracy: "Укрепление демократии на рабочем месте"
 SOV_strengthen_workplace_democracy_desc: "Премьер-министр Киров хочет продолжать политику расширения демократии трудящихся, расширяя права советок, продолжая их поощрять и финансировать, что будет способствовать расширению участия в политической жизни всего населения, что будет только на благо нашей страны."
 SOV_ban_factions: "Запретные действия"
 SOV_ban_factions_desc: "Премьер-министр Киров, будучи великим компромиссщиком, смог убедить национальные коллективисты и либертарианские фракции партии, наконец, поддержать одного человека, самого себя, что в основном означает, что фракционизм больше не нужен, и что каждый может самостоятельно рассуждать, какая политика лучше и хуже."
 SOV_land_reform: "Начало земельной реформы"
 SOV_land_reform_desc: "Большая часть земли все еще почти не обрабатывается в нашей стране после конфискации собственности домовладельцев и общего отсутствия механизации в сельском хозяйстве."
 SOV_voluntary_collectivization: "Поддержка добровольной совместной работы"
 SOV_voluntary_collectivization_desc: "В Советском Союзе собрано около 1% обрабатываемых земель, но это не так уж много, но мы можем улучшить это за счет поощрения большего числа людей - как материальных, так и финансовых - к вступлению в коллективные хозяйства или к поиску новых."
 SOV_strengthen_OGPU: "Укрепление ОГПУ"
 SOV_strengthen_OGPU_desc: "ОГПУ, наша секретная служба, является щитом и мечом революции, ее величайшим защитником. Это имеет огромное значение для обеспечения надлежащего функционирования этой организации и для того, чтобы не нарушать ее права. У них есть много мести и работы, и мы должны поддержать их в этом деле."
 SOV_self_management: "Самоуправление"
 SOV_self_management_desc: "Люди должны иметь возможность работать независимо, а не полностью зависеть от некоторых людей или организаций."
 #Molotov
 SOV_Premier_Molotov: "Премьер-министр Молотов"
 SOV_Premier_Molotov_desc: "Вячеслав Молотов взял под свой контроль Советский Союз, твердо веря в сильное государство, возглавляющее революцию, этот человек клянется продолжить работу Ленина, проводя политику, такую как научное управление, восстановление образования, увековечение культа личности и начало коллективизации."
 SOV_etablish_VSNKh: "Создать VSNKh"
 SOV_etablish_VSNKh_desc: "Премьер-министр Молотов объявил об учреждении ВСНК (Верховный совет национальной экономики, Высший совет народной экономики), который будет служить высшим государственным учреждением по управлению экономикой Советского Союза, наделенным правами конфискации и экспроприации."
 SOV_control_workers: "Контроль за трудом"
 SOV_control_workers_desc: "Политика Ленина в области управления рабочими, безусловно, имела хорошие намерения, но оказалась не очень хорошо. Советы трудящихся едва контролировались, так что многие из них становились очагами реакционного и опасного мышления, и ничего не помогали в повышении производительности фабрик, которые они представляли. Нам нужно больше контролировать совитиков, чтобы мы могли направлять их в правильном политическом направлении."
 SOV_five_year_plan: "Пятилетние планы"
 SOV_five_year_plan_desc: "ВСНК в соответствии с премьер-министром Молотовым приступила к организации в ближайшем будущем "Пятьлетнего плана", в рамках которого в течение следующих пяти лет будут поставлены весьма амбициозные цели в области развития промышленного и сельскохозяйственного производства, а также производства электроэнергии."
 SOV_scientific_management: "Научное управление"
 SOV_scientific_management_desc: "Важно укреплять научный потенциал нашей страны, выделяя больше средств на исследования и разработки с целью создания более эффективного и надежного технологического департамента."
 SOV_collectivization_focus: "Вторая революция"
 SOV_collectivization_focus_desc: "Всесторонняя коллективизация, за которую ратует Молотов, получила название"The Second Revolution" by the Bolsheviks. It aims at the total socialization of land, equipment and livestock."
 SOV_purge_kulaks: "Очистка Кулакса"
 SOV_purge_kulaks_desc: "С учетом своего буржуазного образа жизни и мыслей, кулаки значительно подорвали нашу политическую власть над деревней и саботируют урожай по всей стране после революции. Партия получила достаточно! Пришло время конфисковать свои земли, добавить их в существующие коллективы и отправить кулаков в лагеря перевоспитания, где они могут научиться стать реальным совитым гражданином."
 SOV_purge_opposition: "Убить оппозицию"
 SOV_purge_opposition_desc: "Противодействие нашей политике никуда не ведет, а сопротивление тщетно. Сопротивление лишь замедляет движение поезда, который является продвижением вперед: давайте уничтожим наших политических врагов, внутри и вне партии!"
 SOV_personality_cult: "Вымышленная личная клетка"
 SOV_personality_cult_desc: "История доказала, что русскому народу нужен великий лидер, правящий над ним, как заботливый отец."
 SOV_conservative_family: "Укрепление традиционной семьи"
 SOV_conservative_family_desc: "Революция, к сожалению, оказала негативное влияние на традиционную семью, и ее авторитет подвергается сомнению правительством, различными общественными организациями и молодежными движениями, такими как Комсомоль, и мы должны научить как детей, так и взрослых Советского Союза вновь уважать традиционную семью."
 SOV_restructering_education: "Восстановление системы образования"
 SOV_restructering_education_desc: "Образование - это ключ к светлому будущему, поэтому мы должны адаптировать нашу систему образования к потребностям этого десятилетия с уделением большего внимания науке и теориям Ленина и Молотова."
 SOV_cult_machine: "Культ машины"
 SOV_cult_machine_desc: "Без его машины, рабочий был бы ничем без рабочих, наша страна была бы ничто."
 #Yehzov
 SOV_Premier_Yezhov: "Премьер-министр Ежов"
 SOV_Premier_Yezhov_desc: "Николай Ежов одержал победу в недавней борьбе за власть в Советском Союзе, он будет контролировать образование детей, осуществлять внутренний паспорт, который запрещает людям без него покидать свой город или город, бороться с религией и работать над созданием культа личности."
 SOV_grand_cleanse: "Большая чистка"
 SOV_grand_cleanse_desc: "Недавняя борьба за власть в партии вновь доказала, что сама партия полна болезненного влияния, которое разрушает единство нашей страны."
 SOV_public_executions: "Государственные казни"
 SOV_public_executions_desc: "Предателям нашей страны нужно дать самое суровое наказание: смерть. Принятие этого наказания до того, как массы не только выведут предателей, но и прояснят всем классным предателям и реакционерам, что смерть - это единственная судьба, ожидающая их, если они не примут революцию. Смерть тем, кто противостоит родине и товарищу Ежову!"
 SOV_wither_away_education: "Уничтожение школы"
 SOV_wither_away_education_desc: "Классическая система образования - это извращенное буржуазное учреждение, которое оказывает негативное влияние на наших детей."
 SOV_end_freedom_movement: "Покончить со свободой передвижения"
 SOV_end_freedom_movement_desc: "Позволить нашим гражданам свободу передвижения - это нелепая практика, которая наносит большой вред Союзу. Что если они планируют саботировать промышленное оборудование? Что если они планируют украсть урожай фермы? Что если они иностранные шпионы? Мы не можем допустить этого? Таким образом, мы должны создать внутреннюю систему путешествий, которая контролирует и ограничивает передвижение между городами, облегчая сдерживание врагов государства."
 SOV_control_children: "Контроль за образованием детей"
 SOV_control_children_desc: "Чтобы обеспечить верность следующего поколения студентов идеям нашего великого лидера, мы должны быть уверены, что они научятся ценить нашу политическую систему и премьер-министра Ежова, как таковые, мы будем проводить политику, которая делает это с раннего возраста, детям разрешается читать только книги о Ежове и партии, петь песни о Ежове и партии и писать о Ежове и партии!"
 SOV_state_atheism: "Государственный атеизм"
 SOV_state_atheism_desc: "Бог мертв, не имеет значения, антисоциальная религия - это опиум масс и оказывает ужасное влияние на многих людей по всей стране, мы должны компенсировать тот факт, что правление Ленина было слишком мягким по отношению к нему, принимая решительные меры против религии, мы должны закрыть церкви, мечети и синагоги, преследовать священников и духовенство и прекратить все религиозное образование."
 SOV_hang_up_portraits: "Повесить портреты"
 SOV_hang_up_portraits_desc: "Мы поместим портреты нашего любимого лидера на каждой ферме, каждом доме, каждом классе, каждой лодке и каждом заводском зале."
 SOV_yezhov_constitution: "Ежовская конституция"
 SOV_yezhov_constitution_desc: "Конституция, написанная Ленином, крайне устарела и должна быть заменена как можно скорее."
 SOV_carrot_and_stick_reforms: "Реформы, связанные с морковью и стиком"
 SOV_carrot_and_stick_reforms_desc: "Обещая трудящимся лучшую жизнь и больше потребительских товаров, если они будут работать больше, мы можем и дальше просить их работать усерднее и усерднее."
 #Voroshilov
 SOV_Premier_Voroshilov: "Премьер-министр Ворошилов"
 SOV_Premier_Voroshilov_desc: "Премьер-министр Ворошилов взял на себя обязательство избавиться от плохого влияния на Родину и тем самым расширил свои полномочия премьер-министра. Его премьер-министр ознаменует новую эру социализма с военными характеристиками, где родина наконец-то будет достаточно сильной, чтобы в военном отношении поддержать себя против зла реакционного и измены."
 SOV_militarize_education: "Милитаризация образования"
 SOV_militarize_education_desc: "И, конечно, нет лучшего способа научить детей служить своей стране, кроме как буквально научить их служить своей стране, и поэтому каждая школа будет формироваться в стиле военных академий, чтобы все советские дети были горды, сильными и лояльными!"
 SOV_all_hail_the_army: "Милитаризированное общество"
 SOV_all_hail_the_army_desc: "Истинный авангард революции - это не партия! Истинный авангард революции - это Красная Армия! Если товарищ Ленин был мозгом революции, то вооруженные силы - это его руки и ноги! Без Красной Армии, Красное Государство - ничто! Это неоспоримая истина, которую должен знать каждый истинный большевик. Члены партии, народ и нация должны всегда быть благодарны за своих военных товарищей, которые рискуют своей жизнью, борясь за социализм на фронтах войны."
 SOV_every_man_a_soldier: "Помолвка для всех"
 SOV_every_man_a_soldier_desc: "От Сибири до Кавказа до Москвы каждый взрослый должен быть призван на военную службу, независимо от его этнической принадлежности, профессии, пола или происхождения, если мужчина или женщина являются советским гражданином, то в их обязанности входит служить или подвергаться наказанию, достойному предателей."
 SOV_an_economy_for_the_army: "Расширение финансирования армии"
 SOV_an_economy_for_the_army_desc: "Чтобы ознаменовать новую эру военного социализма, мы должны увеличить финансирование Красной армии."
 SOV_food_for_the_army: "Продовольствие для армии"
 SOV_food_for_the_army_desc: "Армия без продовольствия похожа на армию без оружия, наши солдаты должны быть здоровыми и сильными, если мы хотим, чтобы СССР одержал победу, и поэтому мы должны приступить к осуществлению широкомасштабной политики мобилизации сельского хозяйства, которая позволит нам существенно увеличить нашу сельскохозяйственную продукцию."
 SOV_expand_funding_of_the_army: "Большое материально-техническое расширение"
 SOV_expand_funding_of_the_army_desc: "Для поддержания расширенной и расширенной Красной армии, которую мы планируем построить, потребуется более мощная инфраструктура и система материально-технического обеспечения, и таким образом начнется массовый пересмотр нашей экономики во всех секторах, связанных с сохранением Красной армии, а также ее солдат и групп поддержки."
 SOV_red_army_is_the_strongest: "Красная Армия - самая сильная"
 SOV_red_army_is_the_strongest_desc: "Красная Армия - самая сильная! Красная Армия - самая сильная! Кричите с нами, товарищи, чтобы наши враги, услышав наших гордых солдат через поле боя, обмокли свои штаны и убежали к своим маленьким буржуазным мамочкам, как маленькие трусы!"
 SOV_an_army_with_a_state: "Армия с государством"
 SOV_an_army_with_a_state_desc: "Чтобы обеспечить подлинный успех революции, застой в гражданской бюрократии и управлении СССР должен быть сведен на нет и заменить его военной администрацией, которая вращается вокруг пропаганды военных ценностей и поддержания военных сил, и только таким образом мы можем создать Советский Союз, который сможет противостоять единым силам капитализма."
 #Tukhachevksy
 SOV_Premier_Tukhachevsky: "Премьер Тухачевский"
 SOV_Premier_Tukhachevsky_desc: "Премьер Тухачевский назначил себя премьер-министром и теперь работает над обеспечением безопасности государства от иностранной и внутренней оппозиции."
 SOV_install_pro_tukhachevsky: "Реорганизация бюрократии"
 SOV_install_pro_tukhachevsky_desc: "Первым шагом Тухачевский будет реорганизовать и реорганизовать бюрократию, работая таким образом над тем, чтобы поставить друзей на высокие позиции и лишить все подобие власти тех, кто выступал против него."
 SOV_repression: "Пресечение оппозиции"
 SOV_repression_desc: "Товарищ Тухачевский не тиран, но есть пределы для свободы, что критика может быть направлена на него, чтобы они не наносили ущерба целостности и единству самого Советского Союза."
 SOV_give_economy_to_trade_unions: "Уважайте нашу договоренность с профсоюзами"
 SOV_give_economy_to_trade_unions_desc: "Как обещал Тухачевский, Советский Союз будет подвергнут социальной и политической реформе, которая даст больше полномочий и прав профсоюзам, которые столь мощно поддержали его премьер-министрство. Это должно не только укрепить администрацию премьера Тухачевского, но и укрепить Ленинистские идеалы."
 SOV_Social_Pact: "Социальный пакт"
 SOV_Social_Pact_desc: "Социальный пакт представляет собой крупную инициативу, которую Тухачевский будет осуществлять в настоящее время, направленную на содействие значительному расширению сотрудничества между профсоюзами, совитами и правительством, что должно обеспечить более четкую политическую организацию и более эффективное экономическое и административное управление."
 SOV_price_controls: "Контроль за ценами"
 SOV_price_controls_desc: "До сих пор сивитам приходилось много говорить о контроле над экономикой, и это очень сильно затруднило нашу гражданскую индустрию, пытаясь еще больше укрепить власть премьер-министра над экономическим здоровьем Союза, будет введен контроль за ценами, который позволит лучшей гражданской экономике, отвечающей потребностям советских граждан."
 SOV_agriculture: "Помощь сельскому хозяйству"
 SOV_agriculture_desc: "Инвестиции в сельское хозяйство являются одной из главных задач, которую необходимо решить, с тем чтобы народы СССР могли жить здорово, питаться здоровым питанием и работать здоровым образом, что в свою очередь должно также укрепить наш потенциал по расширению нашей промышленности и армии."
 SOV_four_year_plan: "Четырехлетний план"
 SOV_four_year_plan_desc: "В связи с тем, что совиты теряют власть над экономикой советского правительства, теперь можно надлежащим образом внедрить долгосрочный экономический план. Четырехлетний план представляет собой большую и тщательную волну инвестиций в области добычи ресурсов, производства электроэнергии и промышленного производства в СССР, и через четыре года эти области инвестиций должны были достичь заранее установленных квот."
 SOV_increasing_wages: "Закон о трудовых договорах"
 SOV_increasing_wages_desc: "Закон о трудовых контрактах позволит улучшить работу и образ жизни простого советского гражданина, что позволит ему жить лучше, а также лучше работать. Это стало возможным только благодаря экономической централизации страны под присмотром премьера Тухачевского."
 SOV_trade_union_law: "Закон о профсоюзах"
 SOV_trade_union_law_desc: "Реформа профсоюзов Тухачевского может наконец завершиться принятием Закона о профсоюзах, в котором будут определены четкие роли и права профсоюзов критиковать и требовать изменений в СССР, а также следить за тем, чтобы они не выходили за рамки своих границ и не выполняли свои обязательства."
 #Shliapnikov
 SOV_Premier_Shliapnikov: "Премьер-министр Шляпников"
 SOV_Premier_Shliapnikov_desc: "После борьбы за власть премьер-министр Шлиапников сумел свергнуть врагов оппозиции рабочих и захватил премьер-министра, он будет работать над дебюрократизацией СССР, установлением более жесткого контроля над экономикой и созданием новых прав для профсоюзов."
 SOV_equal_rights_female: "Гендерное равенство"
 SOV_equal_rights_female_desc: "Как женщины, так и мужчины могут быть членами пролетариата, и, таким образом, женщины должны также иметь представительство и политические права в рамках надлежащей диктатуры пролетариата, аналогичной мужской, и поэтому, согласно этой точке зрения, СССР должен стремиться к расширению участия женщин и ликвидации неравенства в статусе и полномочиях между мужчинами и женщинами."
 SOV_empower_workers: "Расширение прав и возможностей трудящихся"
 SOV_empower_workers_desc: "Премьер Шлиапников работает над тем, чтобы гарантировать, что в СССР трудящиеся должны быть реальной основой революции и правительства, предоставляя более широкие возможности для самоуправления и политической представленности всех промышленных работников, отстраняя власть от укоренившейся и отчужденной бюрократической элиты."
 SOV_trade_union_economy: "Экономика для VTSSPS"
 SOV_trade_union_economy_desc: "Всесоюзный центральный совет профсоюзов является коллективной организацией, через которую профсоюзы выражают свое мнение. Видя, как социализм может функционировать только в государстве, возглавляемом трудящимися, не только в случае восстановления независимости VTSSPS, он должен также иметь гораздо больший контроль над экономикой, поскольку только в этом случае экономика может быть сформирована в соответствии с пожеланиями и намерениями рабочих. Диктаты должны прекратиться и начать управление на основе широкого участия."
 SOV_heavy_industry_investments: "Инвестиции в крупную промышленность"
 SOV_heavy_industry_investments_desc: "Новые крупные промышленные инвестиции начнутся в рамках совместных усилий профсоюзов и государства, а не просто усилий совиетов и государства."
 SOV_workerization_party: "Работа Стороны"
 SOV_workerization_party_desc: "Бесспорным является тот факт, что РКП укоренилась в правительстве и стала отдаленной и холодной по отношению к трудящимся, и поэтому мы будем немедленно работать над тем, чтобы сделать партию более транспарентной и начать широкомасштабную чистку тех, кто не способен должным образом представлять желание трудящихся и иметь взгляды, противоречащие интересам трудящихся."
 SOV_freedom_of_speech_in_the_party: "Свобода слова"
 SOV_freedom_of_speech_in_the_party_desc: "Двери партии должны быть открыты для новых членов, и должны быть услышаны новые голоса, которые могут способствовать альтернативному толкованию социализма Ленин, независимо от того, противоречат ли эти идеи заранее установленным идеям. В конце концов, это не такой уровень свободы слова противоречит демократическому централизму или чему-то подобному, и мы, конечно, можем убедиться, что Ленинизм все еще поддерживается каким-то образом с новыми диссидентскими мнениями в ПСР."
 SOV_exclude_peasent_from_power: "Нет энергии для крестьян"
 SOV_exclude_peasent_from_power_desc: "В то же время, как и в других странах мира, в стране не существует ни одного пролетарийского класса, и поэтому в управлении подлинно пролетарианским правительством не должно быть места, и СССР должен управляться городами и промышленностью, а не некоторыми крестьянами, которые не понимают настоящих марксистских идеалов."
 SOV_Syndicalist_State: "Синдикистское государство"
 SOV_Syndicalist_State_desc: "Шлиапников однажды изображал себя ленинистом, хотя и поддерживающим более широкое представительство трудящихся. Теперь, когда его реформы приближаются к завершению и профсоюзы наконец подтвердили контроль над СССР, занавес приближается к его фасаду и становится все более очевидным, что эта администрация его по существу разрушает Ленинизм и создает синдикалистское государство, управляемое синдикатами. Мертв является авторитарной диктатурой пролетариата, долгоживущим синдикатикализмом!"
 #Trotsky
 SOV_Premier_Trotksy: "Премьер Троцкий"
 SOV_Premier_Trotksy_desc: "Лев Троцкий одержал победу после недавних сотрясений власти после смерти Ленина. Троцкий обещает сохранить наследие Ленина, сосредоточившись на внешнем экспорте революции и сокращении бюрократических бюрократических бюро. Удачи, товарищ Троцкий!"
 SOV_control_economy: "Милитаризация труда"
 SOV_control_economy_desc: "Трудящиеся важны не только для оружейной промышленности, но и для военных в целом, мы должны использовать солдат, которые зачислены в армию в мирное время."
 SOV_five_year_plans: "Пятилетние планы"
 SOV_five_year_plans_desc: "Мы не можем полагаться на полукапиталистическую экономическую систему, чтобы подготовиться к войне."
 SOV_further_modernization: "Дальнейшая модернизация"
 SOV_further_modernization_desc: "Несмотря на то, что под мудрым правлением Ленина многое улучшилось, наша промышленность во многих случаях все еще устарела."
 SOV_dekulikasation: "Декулакация"
 SOV_dekulikasation_desc: "Кулакы на протяжении десятилетий оказывают свое буржуазное влияние на сельскую местность, и нам абсолютно необходимо решить эту проблему, перевоспитав кулаков и включив их в обычный рабочий класс, а также перераспределив землю для более бедных фермеров."
 SOV_fight_against_bureaucracy: "Борьба с бюрократией"
 SOV_fight_against_bureaucracy_desc: "Из-за размеров партии и большого числа органов власти, которыми она занимается, бюрократические бюрократические бюрократические препоны в последние десятилетия значительно усилились, что негативно сказывается на авторитете партии и лишает партии нормального работающего гражданина, нам нужно упорядочить нашу бюрократию!"
 SOV_purge_dissent: "Противодействие"
 SOV_purge_dissent_desc: "Дискриминация и реакция все еще повсюду в нашей стране, и они наносят ущерб общей стабильности и репутации партии, необходимо стабилизировать Советский Союз, наказывая инакомыслящих."
 SOV_peasants_alliance: "Альянс с крестьянами"
 SOV_peasants_alliance_desc: "Многие крестьяне в этой стране не наши враги, они наши союзники, наши товарищи."
 SOV_use_mass_media: "Использование средств массовой информации"
 SOV_use_mass_media_desc: "Газеты, радио и книги - все средства массовой информации, которые могут быть использованы для повышения популярности наших политических идей и поощрения поддержки политики премьер-министра Троцкого."
 #Bukharin
 SOV_Premier_Bukharin: "Премьер-министр Бухарин"
 SOV_Premier_Bukharin_desc: "Николай Бухарин взял под свой контроль Советский Союз, его приоритеты - расширение совитой внутренней партийной демократии, расширение художественной свободы и продолжение экономической политики Ленина в области представительства рабочих."
 SOV_inner_party_democracy: "Укрепление внутрипартийной демократии"
 SOV_inner_party_democracy_desc: "Наша внутренняя партийная демократия обеспечивает, чтобы каждая группа, представленная в партии, имела равный голос во время конгрессов, что имеет жизненно важное значение для поощрения и сохранения всеобщего участия населения, зная, что люди, находящиеся в их положении, и их классы являются членами партии и могут определять политику."
 SOV_decrease_bureaucracy: "Уменьшить бюрократию"
 SOV_decrease_bureaucracy_desc: "Бюрократическая бюрократия - это серьезная и неотложная проблема в этой стране, которую нам нужно одеть, мы должны сократить размеры бюрократической системы и упорядочить ее, чтобы обеспечить ее эффективность."
 SOV_agreements_trade_unions: "Соглашения с профсоюзами"
 SOV_agreements_trade_unions_desc: "Наши отношения с профсоюзами очень важны для того, чтобы заручиться поддержкой рабочего класса нашей страны."
 SOV_fight_reactionaries: "Борьба с реакциями"
 SOV_fight_reactionaries_desc: "К сожалению, спустя более двух десятилетий после Октябрьской революции в нашей стране все еще остается много реакционных реакций, негативно влияющих на наше экономическое развитие и популярность."
 SOV_support_marxist_pluralism: "Освободите прессу!"
 SOV_support_marxist_pluralism_desc: "Свобода печати была ограничена при Ленине, когда капиталистическое влияние внутри и за пределами страны угрожало самому существованию молодого свитского государства, однако внутренняя и внешняя ситуация гораздо более стабильна по сравнению с тем временем, поэтому мы можем позволить себе предоставить прессе больше свобод."
 SOV_improve_conditions_of_workers: "Улучшение условий труда"
 SOV_improve_conditions_of_workers_desc: "Улучшение условий труда было одним из самых больших обещаний КПСУ после Октябрьской революции, хотя это было недостаточно реализовано."
 SOV_accilerate_industrialization: "Ускорение индустриализации"
 SOV_accilerate_industrialization_desc: "После революции в развитие промышленности было вложено огромное количество денег, хотя, по мнению премьер-министра Бухарина, их было недостаточно."
 SOV_education: "Улучшение образования"
 SOV_education_desc: "Образование в нашей стране уже значительно улучшилось после революции, но мы все еще не в идеальной ситуации. Многое нужно вложить в качество образования, его масштабы и расширение высшего образования: больше людей должно быть в состоянии начать обучение в университетах."
 #Military Coup
 SOV_military_coup: "Мартовый кубок"
 SOV_military_coup_desc: "Мартовский Кубок обезопасит СССР!"
 SOV_control_police: "Контролировать милицию"
 SOV_control_police_desc: "Милиция - это полиция в Советском Союзе, и контроль над ними является главным условием успеха нашего поглощения."
 SOV_stabilize_government: "Стабилизировать правительство"
 SOV_stabilize_government_desc: "Ни в одной из ветвей власти или департаментов правительства не должно быть никаких возражений против поглощения Тухачевского."
 SOV_purge_local_opposition: "Уничтожить оппозицию"
 SOV_purge_local_opposition_desc: "Внесудебное заключение, шантаж, отстранение от власти."
 SOV_lockdown_congress: "Заблокировать Конгресс Советских Советов"
 SOV_lockdown_congress_desc: "Конгресс начал проявлять высокомерие, и поэтому вполне логично, что они также ощущают на себе авторитет."
 SOV_regain_control_unloyal_divisions: "Возобновить контроль за невменяемыми подразделениями"
 SOV_regain_control_unloyal_divisions_desc: "Военные должны быть едины!"
 SOV_supress_protests: "Пресечение протестов"
 SOV_supress_protests_desc: "Не под присмотром товарища Тухачевского."
 SOV_moscow_secured: "Москва защищена"
 SOV_moscow_secured_desc: "Похоже, что после многократной борьбы и конфликтов Москва, наконец-то, находится в нашей власти, и теперь мы должны переехать в страну, чтобы защитить Союз от троцкитской угрозы."
 SOV_move_westwards: "Двигающиеся на запад"
 SOV_move_westwards_desc: "Возвращение власти на запад, в близость Беларуси и Украины."
 SOV_Kaluka_is_ours: "Свободный Калуга"
 SOV_Kaluka_is_ours_desc: ""
