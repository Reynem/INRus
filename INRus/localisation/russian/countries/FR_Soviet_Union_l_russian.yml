 sovietscorched.5.t: "Финляндия начинает восстанавливаться"
 sovietscorched.5.d: "Наша Земная Тактика дорого обошлась Финляндии с ее народом. Похоже, что сейчас, когда регион начинает восстанавливаться, а местные жители начинают возвращаться к своим обычным повседневным обычаям. Хотя сожжение этого региона по-прежнему вызывает споры, тактика имеет решающее значение для защиты нашей нации и революции. Но память о войне постепенно исчезает в прошлом, мы можем теперь воспользоваться этой возможностью и начать восстанавливать Финляндию к ее прежней славе."
