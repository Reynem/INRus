 SOV_TUKHACHEVSKY_TAKEOVER: "Чтобы защитить Советский Союз от Троцкого поглощения, маршал Тухачевский возглавляет преданную Красную Армию в Конгрессе. Председатель Калинин взят под домашний арест, поскольку Тухачевский объявляет себя экстренным премьером и Михаил Фрунце председателем."
 SOV_KIROV_TAKEOVER: "Жена Надежды Крупской представляет письмо Ленина в Конгресс, в котором Сергей Киров назван своим любимым наследником, чтобы защитить Советский Союз от троцикитского поглощения, конгресс выступает за Сергея Кирова в качестве нового премьер-министра!"

