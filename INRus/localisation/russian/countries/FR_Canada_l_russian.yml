 CAN_continue_iron_extraction: "Продолжать добычу железа"
 CAN_continue_iron_extraction_desc: ""
 CAN_continue_oil_extraction: "Продолжение бурения нефти"
 CAN_continue_oil_extraction_desc: ""
 CAN_maritime_mines: "Морские мины"
