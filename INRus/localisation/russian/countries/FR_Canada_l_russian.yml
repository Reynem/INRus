 ### Air Force ###

 CAN_rcaf_reorganization: "Реорганизация RCAF"
 CAN_rcaf_reorganization_desc: "В мирное время RCAF были резко ослаблены, бóльшая часть военного финансирования была направлена на Канадский корпус, а остальные - на Королевский Канадский ВМС, мы знали, что война в воздухе станет очень важной частью войны, пора возродить RCAF."
 CAN_new_service_fighters: "Новые борцы за служение"
 CAN_new_service_fighters_desc: "Боевики - неотъемлемая часть любых военно-воздушных сил. Мы начинаем разработку модернизированных РКАФ."
 CAN_naval_air_coordination: "Координация между морскими и воздушными судами"
 CAN_naval_air_coordination_desc: "В настоящее время сотрудничество между военно-воздушными силами и Навиес имеет чрезвычайно важное значение, особенно с появлением перевозчиков, и мы должны обеспечить производство бомбардировщиков для использования при оказании помощи военно-морским силам."
 CAN_bomber_designs: "Дизайны бомбардировщиков"
 CAN_bomber_designs_desc: "Бомбардировщики будут играть очень важную роль в следующей Великой войне, поскольку они способны опустить целые города до обломков, при условии поддержки и надлежащего количества. Это даже не вопрос. Нам они нужны."
 CAN_billy_bishop_program: "Программа Билли Бишоп"
 CAN_billy_bishop_program_desc: "Программа Билли Бишопа правильно названа, как она была разработана самим Билли Бишоп. Эта программа призывает более новый, более творческий персонал военно-воздушных сил поощрять новую школу мысли, когда дело доходит до воздушной войны."
 CAN_modern_fighters: "Современные бои"
