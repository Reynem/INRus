 #### Events ####

 canada.1.t: "Статус Доминиона"
 canada.1.d: "Двадцать два года назад Канада присоединилась к войне вместе с Великобританией и Тройной Энтентиментом. Эта война продлится долгие и кровавые шесть лет и станет известно как Великая Война. После того как война закончилась, наши обещания автономии Великобритании явно поставили под сомнение. Канада и ее сестры никогда не заслужили большей автономии, несмотря на свои жертвы во время Великой войны. Лондон утверждает, что «Усиление автономности может в конечном итоге привести к распаду Империи, которую вели и защищали во время Великой Войны». Канада, будучи одним из правителей, которые давно настаивали на большей автономии, была недовольна сохраняющимся статусом-кво, но тем не менее горда тем, что она является членом Британской империи. Это дипломатическая цель Канады — сделать свой путь к номинально независимому государству. . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . ."
 canada.2.d: "Менее пяти дней назад Лондонский фондовый рынок начал подвергаться радикальным оползням и ныряниям из-за колониального восстания в Индии и волнений в Африке. Сегодня генеральный директор компании Hatry Group, Кларенс Хэтри, был подвергнут пыткам вместе со своими сообщниками и обвинен в массовом мошенничестве и подделке. Вскоре после этого фондовый рынок упал, когда доверие инвесторов сразу же испарилось."
 canada.3.t: "Падение Наземных островов"
 canada.3.d: "После катастрофы ЛМСК сама Великобритания пострадала от массовых беспорядков. Профсоюзные протесты были первоначально встречены с Вестминстером. После серии неудачных событий стало очевидно, что волнения в Великобритании были гораздо хуже, чем кто-либо мог себе представить. Все это началось с "Джарроу Марша", ситуация переросла в беспорядки в Манчестере, которые распространились по всей стране. Революция позже охватила Великобританию, когда военным было приказано стрелять по протестующим и вместо этого дезертировать, только чтобы быть в стороне от протестующих. Многие консерваторы и либеральные политики в Великобритании достигли трагических результатов, и еще более ужасающие фотографии вышли за пределы того, чем когда-то было Соединенное Королевство. Стэнли Болдуин и останки преданных королевских армий провели в Доме Общин в течение определенного периода времени, прежде чем они были перегружены и убиты революционерами."
 canada.4.t: "Социалистические протесты"
 canada.4.d: "Крушение рынка ценных бумаг в Лондоне повлияло на жизнь каждого гражданина больше, чем мы могли себе представить. Бедность широко распространена и мало рабочих мест. Одной из районов, в наибольшей степени затронутых ЛМСК, является Ванкувер. Многие работники города были уволены своими работодателями в попытке сократить расходы, а у тех, кто не был уволен, была сокращена заработная плата. Похоже, что в центре Ванкувера многие из этих рабочих начали протестовать против различных буйств... эти демонстрации быстро переросли в разрушение собственности и нападения на различных владельцев буйств. Но если мы не вмешаемся и не покончим с этим, то никто из этих людей не будет отвечать за ущерб, причиненный этим владельцам..."
 canada.5.t: "План выздоровления &lt; &lt; Сокред &gt; &gt;"
 canada.5.d: "Сокреды рассматривали Лондонский фондовый рынок как возможность для окончательного осуществления социального кредита на федеральном уровне. Они, как представляется, разработали тщательно проработанный план действий по борьбе с экономическим спадом, вызванным ЛМСК. Дж.Х. Блэкмор предложил его нам сегодня. Само собой разумеется, что этот план предусматривает введение социального кредита в различных провинциях, хотя и в гораздо более скромных масштабах. Однако вполне возможно, что они будут использовать его в качестве метода, позволяющего повысить активность и популярность на следующих выборах."
 canada.6.d: "С тех пор, как нас поразила LSMC, наше союзное правительство было более разделено, чем когда-либо."
 canada.7.d: "Последние две недели были самыми напряженными, с которыми премьер-министру Р.Б. Беннету приходилось иметь дело за всю свою жизнь. Сплотиться с профсоюзной коалицией было довольно трудно, и теперь ему пришлось иметь дело с Лондонским фондовым рынком. В сочетании с этим бывшие несчастные депутаты-либералы сейчас злятся на него из-за его комментариев о правительственном вмешательстве в экономику. В последнее время ему было не легко. Несмотря на то, что, как оказалось, он поддался стрессу. Сегодня он был обнаружен мертвым в ванной после сердечного приступа."
 canada.700.d: "Сегодня кажется, что союзная коалиция, наконец, потеряла единство. Это было неизбежно после LSMC. Тори и Либералисты имели различные мнения о том, как эффективно реагировать на LSMC и что это вызвало гнев внутри страны. В сочетании с недавней кончиной PM Bennett, союзное правительство стало слишком нестабильным и расколотым. После многих споров между союзниками Тори и Либерально-нионистами, многие Либеральные депутаты уже достаточно и, наконец, расстались; переходили к Либеральному правительству Маккензи Кинга. ~ Не больше доминирование красных тори, и кажется, что канадская политика вернется в состояние либерально-королевской битвы за превосходство... Однако новый оппонент взялся за эту сцену. ~ Несмотря на то, что после окончания Великой войны и продолжения деятельности союзного правительства многие граждане были недовольны господством одной партии и отсутствием реального выбора. С основанием CPF в 1930 году многие граждане были рады иметь новую и, что более важно, другую партию проголосовала за."
 canada.8.d: "После раскола Юнионистской коалиции Тори оказались в печальном положении правительства меньшинства, и поэтому было принято предложение о несогласии, которое прошло успешно; свержение консервативного правительства; с учетом того, что либералы только что отошли от Тори в коалиции и не хотят делать это снова, у Дифенбакера есть только один вариант, как справиться с этим."
 canada.9.d: "С тех пор, как на нас напали LSMC, мы испытали огромный избыток ресурсов. Очень немногие страны могут позволить себе субсидировать импорт из других стран, в результате чего страны, зависящие от экспорта, остаются в сточной канаве. Однако мы выяснили два метода обращения с избытком угля. Мы можем экспортировать уголь в Бритиан по невероятно низким ценам. Это было бы гораздо выгоднее для них, но мы, по крайней мере, могли бы получить от него какую-то выгоду. В качестве альтернативы, мы могли бы продать его внутри страны, понизив местные цены."
 canada.10.d: "Канадцы предложили экспортировать уголь по необычно низким ценам, после того как LSMC не смогли экспортировать многие ресурсы из-за того, что многие страны не в состоянии позволить себе старые цены. Сегодня канадцы пересмотрели этот вопрос и обратились к нам с просьбой заключить сделку о торговле между Повелителями и Колониалами. Мы, безусловно, выиграли бы от этого больше, чем канадцы, как бы эти цены не подорвали местное производство. Возможно, было бы более популярным отклонять это предложение."
 canada.11.d: "Похоже, что британцы приняли наше предложение о торговле углем, это, несомненно, поможет двум нашим странам в предстоящие месяцы!"
 canada.12.d: "Похоже, британцы отклонили наше предложение о торговле углем! Кажется, они чувствуют, что нет необходимости импортировать уголь от нас! К сожалению, теперь мы в том же положении, что и раньше. У нас есть запасы ресурсов, и они не имеют к ним никакого отношения."
 canada.13.d: "В Федеральном плане улучшения жилья подробно говорится о том, что правительство должно субсидировать процентные ставки по кредитам на восстановление почти 75 000 домов, что, безусловно, будет дорогостоящим мероприятием, и, возможно, стоить больше времени, чтобы полностью покончить с этой идеей, но это, безусловно, поможет нашей стране оживить свою страну после катастрофы Лондонского фондового рынка."
 canada.14.d: "Это помогло многим канадским гражданам оправиться в финансовом отношении от Лондонского фондового рынка, и многие предприятия процветают налево и направо! К счастью, это стало огромным облегчением как для правительства, так и для народа."
 canada.15.d: "Департамент по боеприпасам и поставкам позволил нам собрать гораздо более качественные запасы нашего военного оборудования. Мы смогли реорганизовать поставки в гораздо большей степени и передать оборудование военным отделениям, которые, безусловно, могли бы использовать их лучше. Теперь у нас есть запасы избыточного оборудования, и мы не вполне уверены, что с ними делать. Очевидно, мы можем послать их в Британию. у Королевской армии больше людей, и ей нужно еще много винтовок. Или мы можем оставить их здесь, в Канаде. Мы - Спир-голова Империи, мы, конечно, заслуживаем нашего собственного оборудования, не так ли?"
 canada.16.d: "Канадцы выступили с инициативой по экспорту военного оружия для нас! Мы подсчитали груз, подробно излагая его: ни 7500 Ли-Энфилдских винтовок, ни 1000 артиллерийских пушек, ни 500 виккеров II легких танков и 500 тонн медицинского оборудования."
 canada.17.d: "Австралийцы отвергли наше предложение о военном обмене, но это не обязательно причиняет нам боль, но оказалось огромной тратой времени."
 canada.18.d: "После Великой войны канадский корпус был широко признан одним из наиболее компетентных и квалифицированных филиалов вооруженных сил Британской империи, хотя мы сохранили канадский корпус в целости, австралийцы вернулись к использованию «Милиции» во время «Интервара»."
 canada.19.d: "После Великой войны канадский корпус был широко признан одним из наиболее компетентных и квалифицированных подразделений вооруженных сил Британской империи. Хотя они сохранили канадский корпус в целости и сохранности, во время "Интервара" мы возобновили использование "Милиции". Канадцы, сохраняя профессиональную военную структуру, плохо пренебрегали военно-морским развитием. Мы, с другой стороны, преуспели в этом. Сегодня канадцы предложили взаимное благо. Они послали военный персонал, чтобы помочь Королевской австралийской армии привести их в соответствие со стандартами, и мы посылали к ним экспертов по судостроению, чтобы помочь им в модернизации ВМС."
 canada.20.d: "Австралийцы приняли нашу военную биржу, мы отправляем офицеров в Канберру и организуем транспорт для их экспертов по судостроению."
 canada.21.d: "Канадский Восток и Запад спорят время от времени: будь то разногласия в парламенте или ворчание в своих собственных домах; они существовали с Конфедерации в 1867 году; сегодня мы должны отложить эти разногласия перед лицом войны; канадцы от побережья Новой Шотландии до боев Ванкувера должны стоять вместе и быть готовыми противостоять любым препятствиям, которые могут возникнуть в ходе войны."
 canada.22.d: "Наш недавний шаг по призыву не остался незамеченным Нацией. Квебекцы, безусловно, были недовольны этим. Некоторые объявили забастовки и протесты против призыва, другие просто выразили разочарование федеральному правительству в связи с тем, что он принял призыв против их воли. Тем не менее, если мы не отступим, Квебек может вскоре оказаться в замешательстве." #Riots in Quebec
 canada.23.d: "По мере того, как мы предпринимаем усилия по расширению нефтяных месторождений Тернер-Вэлли, в парламенте были подняты некоторые вопросы, в частности в отношении нашей позиции в отношении регулирования нефтяной промышленности." #Gas regulations
 canada.24.d: "В то время как Лондонский фондовый рынок свел канадскую экономику к развалу, многие нефтяные компании стали пытаться сократить расходы на каждом углу. С их нежеланием арендовать места для хранения огромного количества природного газа, который был извлечен из долины Тернера, и без каких-либо правил на нем; они решили просто избавиться от него с помощью газовых осветительных установок. ~ nnWhhich, честно говоря, пошёл ужасно. ~ Не только миллиарды долларов природного газа были уничтожены, потому что не было непосредственного рынка, но и уничтожили газовый привод в поле; который был ответственен за нефть, добываемую в первом месте. Газовые вспышки были видны из Калгари, более чем в 50 милях от него. Большое количество общественных инакомыслия в сочетании с политическими нападениями на федеральное правительство со стороны правительства провинции Альберта сильно повредило нас, чтобы мы могли сказать, что по крайней мере. ~ ~ ~ К сожалению, Тернервная долина больше не является крупнейшим нефтяным месторождениям Британской империи." #Gas flaring
 canada.25.d: "Совет по контролю за индустрией военного времени (ВИКБ) — это организация, которая позволит федеральному правительству иметь менее трудное время для управления различными военными отраслями Канады. Хотя она, безусловно, сокращает объем административных усилий с нашей стороны, мы сталкиваемся с выбором того, сколько именно влияния мы оказываем на эти отрасли. ~ ~ Это было бы популярным шагом к применению жесткого контроля над заработной платой и ценообразованием, однако мы могли бы также сделать еще один шаг вперед. Поставив эти отрасли под непосредственный федеральный контроль, мы можем более эффективно удовлетворять наши военные потребности. Однако, это было бы непопулярным шагом, чтобы сказать меньше всего."
 canada.26.d: "В Великой войне нам обещали голос. Нам обещали свободу делать свой собственный выбор. Нам обещали Содружество, в котором каждый Доминион имел правильное право голоса во внешней политике и не был вынужден подчиняться Лондону. Несмотря на это, по-прежнему очевидно, были ли эти обещания нарушены. /nBronken обещания, отвергнутые идеи, игнорирующие инакомыслие. Они могут описать то, что произошло с Империей в последние годы. Отрицание Вестминстерского статута привело к тому, что многие из этих обещаний стали пустыми. ~ ~ Неважно. Если никто другой Доминион не желает вести дипломатическую битву против Великобритании, мы будем делать это. Вопрос в том, будем ли мы делать это в одиночку? Или мы соберем другие Доминионы на нашу сторону?"
 canada.27.d: "Примерно 18 лет назад, вскоре после возвращения Анри Бурассанса в федеративную политику, во время кризиса 1918 года был спровоцирован &quot; Блок националист &quot; , который был основан на основе панканадского национализма, пацифизма, антикончаризма и, что важнее всего, дистанции от Великобритании. Позднее он будет создан на федеральном уровне, привлекая поддержку со стороны оппонентов &quot; Коннора &quot; и &quot; Антивоенные канадцы &quot; . &quot; Блок националист &quot; на английском языке Канады. &quot; Партия &quot; давно выступает за &quot; Свободный, равный и Объединенный Канада &quot; , наделенный равными правами как для англоязычных, так и французских канадцев на федеральном уровне. &quot; nnOf &quot; , она также получила невероятно большое количество флаков от англистанции &quot; . &quot; . Тем не менее &quot; , &quot; , &quot; и &quot; Blosentalestantistantistalististantistal &quot; , &quot; , &quot; , &quot; , &quot; , &quot; , &quot; , &quot; , &quot; , &quot; , &quot; , &quot; , &quot; , &quot; , &quot; , &quot; , &quot; , &quot; , &quot; , &quot; , &quot; , &quot; , &quot; , &quot; , &quot; , &quot; , &quot; , &quot; , &quot; b &quot;"
 canada.28.d: "Перспективы новой войны не были восприняты с энтузиазмом некоторыми гражданами, и националистский Блок дал им возможность найти других, кто имел аналогичные чувства."
 canada.29.d: "Недавний рост националистической тяги заставил нас в нескольких парламентских районах, но, возможно, наибольшую озабоченность вызывают сами националистические сторонники. Различные производители оружия страдают от серии диверсий. Те, кого мы поймали и арестовали, были замечены в том, что имеют свободные связи с националистами, однако националистический Блок отрицал какие-либо утверждения о том, что они связаны с саботажом, совершаемым этими лицами."
 canada.30.d: "К сожалению, подозреваемые националисты становятся все более смелыми и смелыми. Они решили не прекращать саботировать военные усилия, но, похоже, они начали бомбардировать различные известные коронные корпорации. Это совершенно неприемлемо, хотя мы не можем найти каких-либо веских улик, которые могли бы отследить этих террористов до самого Националистического Блока, у нас есть лишь смутные связи и подозрения. ~ Не говоря уже о том, что мы можем сделать в данный момент с подозрением. Единственное, что мы можем сделать в данный момент, это предоставить этим коронным корпорациям дополнительную защиту, чтобы защитить их от любых будущих угроз бомбардировок."
 canada.31.d: "Федеральные выборы пришли еще раз: от Ванкувера до Галифакса голоса льются, но какая партия получила наибольшее число голосов?"
 canada.32.d: "Федеральные выборы пришли еще раз: от Ванкувера до Галифакса голоса льются, но какая партия получила наибольшее число голосов?"
 canada.33.d: "Федеральные выборы пришли еще раз: от Ванкувера до Галифакса голоса льются, но какая партия получила наибольшее число голосов?"
 canada.34.d: "С начала Великой войны с канадскими военными были проведены широкомасштабные реформы. Создание канадских экспедиционных сил и канадского корпуса во время Великой войны было, по всей видимости, постоянным актом. После Великой войны различные военные сухопутные силы Канады были реорганизованы в соответствии с Законом премьер-министра Бордена о военной реорганизации (вместе с Законом о национальной обороне), одним из последних актов, которые он прошёл до своей смерти."
 canada.35.d: "Последствия Лондонского фондового рынка продолжают ощущаться повсеместно по всей Канаде. С этой целью мы создали лагеря для оказания помощи в трудоустройстве для мужчин. Однако, как представляется, эти лагеря имели непредвиденные последствия. Несмотря на столь же плохие условия работы (и жизни), они подтолкнули людей на улицы Ванкувера протестовать против условий этих лагерей помощи. Возможно, одна из наших самых больших проблем заключается в участии различных крайне левых организаций, которые, несомненно, хотят использовать эту ситуацию для продвижения своей собственной повестки дня. Лига единства трудящихся, наряду с Канадской коалиционной партией, как представляется, имеет некоторых представителей, присутствующих на забастовках."
 canada.36.d: "Поскольку мы договорились начать переговоры по лагерям помощи при трудоустройстве, нам придется выбрать какую политическую организацию, которую мы хотим организовать конференции. Каждая организация имеет разные цели, WUL намерен сделать условия наиболее "жизнеспособными", несмотря на то, что это вынудит нас к дефициту расходов. КОП намеревается полностью реформировать лагеря помощи при трудоустройстве, чтобы они стали промышленными по своему характеру, и уделять приоритетное внимание фабричным работам для производства товаров, а не для общественных работ. В противном случае, мы могли бы работать с самими забастовщиками, чтобы подорвать WUL & CPC в данном случае."
 canada.37.d: "Три месяца назад, мы обещали рабочим в лагерях помощи на работе, что мы будем изучать условия жизни в лагерях. Они с радостью вернулись к работе, исходя из предположения, что условия будут улучшены. Но это было три месяца назад. Не так быстро стало очевидно, что никаких изменений не будет, и мы только дали пустые обещания. Мужчины вновь вышли на улицы Ванкувера, чтобы протестовать против условий в лагерях помощи. Еще более усугубились из-за их разочарования с правящим правительством за игнорирование их претензий, эти люди, как представляется, организовываются, чтобы начать путь в Оттаву. / / Несмотря на самоназываемый «Камп-Крусаад», частично вдохновленный маршем Джэрроу в Великобритании, недавно установили свою цель доведения этого вопроса до сведения федерального правительства в Оттаве, и, как представляется, готовы совершить поездку по всей стране, пытаясь добиться урегулирования. Миссия в составе 1500 человек привлекла большое внимание местных средств массовой информации, чтобы по меньшей мере."
 canada.38.d: "По мере того, как крестоносцы прибыли в Калгари, в средствах массовой информации появилось большое количество шума. Это произошло главным образом от праздников самих крестоносцев за то, что они дошли до своего первого контрольно-пропускного пункта. Однако это далеко от приятной для нас ситуации. Несмотря на некоторые неизвестные причины, крестоносцы решили отпраздновать свой первый контрольно-пропускной пункт горсткой напитков, и, похоже, уже опьянили себя. Мы начали получать сообщения о том, что пьяные крестоносцы ворвались в местные полицейские силы. Хотя констебли остаются связанными в попытке не допустить того, чтобы ситуация переросла в массовое насилие, мы вынуждены укреплять и поддерживать другие департаменты в подготовке к любым новым спорам между крестоносцами и полицейскими силами вдоль их маршрута."
 canada.39.d: "В то время как крестоносцы удалились из своих бокс-каров, чтобы поесть в городе Регина, представители Красейдера получили сообщение о том, что федеральные депутаты прибыли в Регину, чтобы договориться об условиях лагеря. Несмотря на то, что они не знали о том, что не будет никаких переговоров. В действительности, было много грузовиков, которые скрывали отряды КККП. ~ После того, как крестоносцы были вывезены на площадь рынка, констебль Миллар взорвал пирсинг, а отряды КККП, вооруженные Батонами, Револьверсами и Тир-Гасом, предъявили обвинения и напали на неопознанных крестоносцев со всех сторон. &lt; &lt; Крусады &gt; &gt; были в панике и запуганы до тех пор, пока не развращенные вскоре не захватили их. &lt; &lt; Крусадер &gt; &gt; (и кто бы ни был пойден в ходе этих испытаний) начали с использованием рук, включая &lt; &lt; &lt; &lt; &lt; &lt; &lt; Рок, филиалов &lt; &gt; &lt; и &lt; &lt; &lt; Крусов &gt; &lt; &lt; &lt; Бэтов &gt; &gt; &gt; &gt; &gt; &gt; Крусов &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &lt; &gt; &lt; , &lt; &gt; &gt; &gt; &gt; &gt; &gt; , которые &gt; , &gt; , &gt; , &gt; , &gt; , &gt; , &lt; , &lt; , &lt; , &lt; &lt; , &lt;"
 canada.40.d: "Крестоносцы достигли своего второго контрольно-пропускного пункта, Регины, крестоносцы высадились из своих бокскаров и въехали в Регину на вечерний ужин, и их встретили приветствием и широкой поддержкой со стороны граждан Регины, некоторые из которых пожертвовали средства на крестовый поход, чтобы добраться до Оттавы."
 canada.41.d: "Крестоносцы добрались до Виннипега и сорвались, чтобы посетить город. Поскольку крестоносцы остановились на еде, как обычно, кажется, что некоторые люди, в особенности социалисты, имеющие связи с ВУЛ, КОП и КС/СС пытаются взбудоражить крестоносцев против нашего правительства. Кроме того, они пытаются публично подорвать нашу поддержку. ~ никчёмные действия, подобные этим, не могут быть допущены, чтобы мы не позволили ситуации перейти от доброжелательного к красному."
 canada.42.d: "Садбери - последний контрольно-пропускной пункт для крестоносцев до того, как они доберутся до Оттавы. На этот раз их визит в город был намного более оживленным, когда граждане давали им бесплатное питание в ожидании того, что парламент наконец-то улучшит условия в лагерях помощи рабочим."
 canada.43.d: "Крестоносцы наконец-то добрались до Оттавы и поехали в Парламент Хилл. Они хотели бы закончить свое путешествие, чтобы парламент принял их просьбу о внесении изменений в законодательство о лагерях помощи на производстве. ~nnwhilst принять это было бы, скорее всего, лучшим способом закончить это путешествие на хорошей ноте, это также повредило бы нашей платформе и доказало бы нации, что мы не в состоянии стоять на месте. Что нам делать?"
 canada.44.d: "Нынешняя система голосования в Канаде - это система "Первая паста-Пост", которая известна низкой представленностью периферийных политических организаций и неполных политических партий. Однако мы сталкиваемся с вопросом о возможном реформировании избирательной системы в качестве платформы нашей партии."
 canada.45.d: "После падения цен на пшеницу многие мужчины были вынуждены искать альтернативы фермерству, а угольная добыча была карьерой, которая не требовала большого предварительного опыта. Это было единственным реальным выбором для многих мужчин, который привел к массовому расширению угольных шахт в Саскачеване, в результате чего владельцы шахт теперь имеют возможность выбирать, кого они хотят нанять, а не принимать любую имеющуюся рабочую силу. Несмотря на все это, эти выгоды были связаны с попытками сократить расходы. Заработная плата регулярно сокращалась, чтобы остаться в зеленом состоянии, и это привело к прискорбным условиям жизни семей горняков и общего трудового пула в Саскачеване."
 canada.46.d: "Сегодня, примерно в 10:23 утра, шахтеры Эстевана опубликовали свои требования после того, как они привязали план к ВУЛ и КОП. План призывает владельцев шахт признать легитимность профсоюзов и повысить их готовность к переговорам с ними, общее увеличение заработной платы, сокращение рабочего времени шахтеров и улучшение условий на шахтах. ~Нет, мы могли бы попытаться выступить посредником в переговорах между владельцами шахт и шахтерами, хотя это, скорее всего, приведет к укреплению ВУЛ и КОП, поскольку они могут легко утверждать, что единственная причина, по которой для рабочих были внесены какие-либо изменения, была связана с их инициативой в данной ситуации. Однако у нас есть другой вариант. Поскольку мы получили множество сообщений о вандализме от вышеупомянутых разочаровывающих шахтеров, мы могли бы легко развернуть КККП в этом районе, чтобы прекратить забастовку силой, фактически прекратить эту проблему и сообщить, что работа с радикальными левыми организациями не приведет к каким-либо изменениям или прогрессу."
 canada.47.d: "Поскольку мы выступили с инициативой по посредничеству в этих переговорах, нам нужно быть очень осторожными с тем, с какими шагами мы делаем. Но ситуация остается очень деликатной, и прямое согласие с одной из сторон определенно будет иметь последствия, хотя это также может принести некоторые долгосрочные выгоды."
 canada.48.d: "Из-за нашего выбора в пользу шахтеров на переговорах переговоры сломались и привели к тому, что владельцы шахт объявили районный локаут в Саскачеване. Несколько месяцев, вероятно, пройдут до тех пор, пока шахтеры не сойдут с катушек и не откажутся от забастовки."
 canada.49.d: "Из-за того, что мы сделали выбор в пользу горняков, а не шахтеров на переговорах, переговоры сломались и привели к тому, что шахтеры объявили о региональной прогулке в Саскачеване, вероятно, пройдет несколько месяцев, пока шахтеры не уйдут в пещеру и не уступят забастовке."
 canada.50.d: "Разочарование из-за снижения уровня жизни и нежелания правительства улучшить их в более бедных районах Торнто вызвало несколько неорганизованных протестов, которые в конечном итоге переросли в беспорядки. Похоже, что бунты были очень аполитичными по своему характеру, и, похоже, что у ВУЛ & КОП не было успеха в том, чтобы сделать их выгодными, во многом к нашему богатству. Ни в коем случае, ситуация неустойчива. И прекращение этого бунта силой может закончиться хорошо или невероятно плохо для нас. Разрешить бунтовщикам выкинуть себя наружу, возможно, будет очень разумно; в конце концов, у них тоже есть работа, и отказ работать слишком долго, несомненно, приведет к тому, что они станут более вялыми, чем они хотели бы. С учетом этого, очевидно, вполне осуществимый вариант - ждать бунтов до тех пор, пока мы будем готовы понести материальный ущерб, который они понесут."
 canada.51.d: "К сожалению, волнения в Торонто усилились, достигнув точки, в которой неорганизованная толпа сейчас просто разгромляет бизнес по прихоти. Наши попытки сдержать беспорядки оказались относительно безрезультатными, по меньшей мере, поскольку наши офицеры часто перегружены толпой и не в состоянии должным образом остановить дальнейшую эскалацию без применения силы. Для того чтобы положить конец этим беспорядкам, нам придется начать производить аресты и доказать, что мы более чем готовы применить силу в таких случаях, как это."
 canada.52.d: "К счастью, после ряда безжалостных арестов, задержаний и актов насилия, совершенных силами ОПП и КККП, беспорядки в Торонто, похоже, наконец, были прекращены."
 canada.53.d: "К сожалению, наш выбор применить силу против бунтарей лишь усилил их и уступил место политическим силам для захвата беспорядков. Канадская Максимистическая партия под руководством Тима Бака осудила избранное правительство за применение насилия в отношении народа, и Националист Блок также осудил избранное правительство за то, что оно является &quot; органом империалистических псах, которые причинят вред канадцам без какой-либо другой мысли &quot; . Эти политические группы также проделали свой путь к руководящей роли в бунтах, что, к сожалению, означает, что бунты перешли от аполитического к исключительно политическому."
 canada.54.d: "Даже до Лондонского фондового рынка Доминион Ньюфаундленда боролся за существование как сплоченное государство. Их парламент был неэффективным и измучен скандалами, и появление глобального экономического кризиса лишь в сто раз ухудшило их положение. Мы обратились к британскому правительству с просьбой поставить Доминиона под нашу администрацию на протяжении более десяти лет, и многие в нашем правительстве надеялись, что недавний поворот событий может наконец привести к этому. К сожалению, сегодня британское правительство в Лондоне объявило, что оно немедленно распустит правительство неудавшегося Доминиона и управит землей напрямую. Мы не можем сделать много, кроме того, чтобы затаить протест, но британское иностранное посольство дало понять, что однажды регион может быть передан под наш контроль, если мы будем продолжать сотрудничать с Короной."
 canada.55.d: "Даже до Лондонского фондового рынка Доминион Ньюфаундленда боролся за существование в качестве сплоченного государства. Их парламент был неэффективным и измучен скандалами, и появление глобального экономического кризиса лишь в сто раз ухудшило их положение. Мы обратились к британскому правительству с просьбой поставить Доминион под наше управление на протяжении более десяти лет, и многие члены нашего правительства надеялись, что недавний поворот событий может наконец-то привести к этому. Но сегодня, как представляется, их надежды были вполне обоснованными. Британское правительство в Лондоне объявило, что оно немедленно разочарует правительство неудавшегося Доминиона и поставит его под контроль нашего правительства в Оттаве. Ньюфаундленд и Лабрадор уже находятся в процессе интеграции, и теперь наш долг - обеспечить плавный и беспрепятственный перевод."

