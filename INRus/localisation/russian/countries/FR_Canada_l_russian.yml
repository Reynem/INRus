 #### Decisions ####
 CAN_parliamentary_affairs: "Парламентские вопросы"
 CAN_parliamentary_affairs_desc: "Парламент Канады является федеральным законодательным органом нашей страны и отвечает за все законопроекты и законы, принимаемые на федеральном уровне, при этом, имея 245 мест для всех членов парламента, избираемых демократическим путем, обеспечивается форма представительства для наших граждан."

 CAN_NFB_military_films: "NFB Военные фильмы"
 CAN_NFB_military_films_desc: "У Национального совета по кинематографии нет недостатка в военной съемке, с которой можно работать."
 CAN_strengthen_the_RCMP: "Укрепление КККП"
 CAN_strengthen_the_RCMP_desc: "С незапамятных времен КККП смогла обеспечить стабильность нашей нации в самые разрозненные времена."

 CAN_crackdown_on_dissidents: "Разрыв на диссайдентах"
 CAN_crackdown_on_dissidents_desc: "Несмотря на то, что мы демонтировали канадскую демократию, чтобы защитить наш народ от социализма, некоторые угрозы все еще пытаются уничтожить нас!"
 CAN_dismantle_democratic_factions: "Демонтаж демократических сил"
 CAN_dismantle_democratic_factions_desc: "Демократия является идеалом вчерашнего дня, она несет ответственность за необходимость роспуска парламента и роспуск любых остающихся демократических группировок позволит нам укрепить свой контроль над страной."
 CAN_disorganize_trade_unions: "Деорганизовать профсоюзы"
 CAN_disorganize_trade_unions_desc: "Ни один из левых не должен подрывать нас, ни один из оставшихся профсоюзов должен быть заключен под стражу, а любой известный социалист должен быть задержан."

 CAN_hold_if_day: "Подождите день."
 CAN_hold_if_day_desc: ""Если один день" - это проект, который включает в себя имитацию оккупации одного из наших городов врагом, чтобы привлечь внимание канадцев к серьезной угрозе, с которой мы сталкиваемся в настоящее время. Виннипег кажется главной целью."
 CAN_parliamentary_debates: "Поощрять парламентские дебаты"
 CAN_parliamentary_debates_desc: "Хотя дебаты по некоторым из этих тем могут рассматриваться как слишком чувствительные или нелепые, они, по крайней мере, дадут нам свежую перспективу."
 CAN_military_service_act: "Проект закона о военной службе"
 CAN_military_service_act_desc: "Последний закон о военной службе был принят в 1918 году, во время Великой войны."
 CAN_war_measures_act: "Провозглашать Закон о военных мерах"
 CAN_war_measures_act_desc: "Закон о военных мерах предоставит федеральному правительству широкие полномочия и позволит нам принять все необходимые меры для обеспечения полной приверженности военным усилиям. Несмотря на эти меры, мы сможем принять любые необходимые меры, какими бы радикальными или авторитарными они ни были."
 CAN_improved_war_measures_act: "Провозглашать Закон о военных мерах"
 CAN_improved_war_measures_act_desc: "Закон о военных мерах предоставит федеральному правительству широкие полномочия и позволит нам принять все необходимые меры для обеспечения полной приверженности военным усилиям. Несмотря на эти меры, мы сможем принять любые необходимые меры, какими бы радикальными или авторитарными они ни были."
 CAN_defence_of_canada_regulations: "Положения об обороне Канады"
 CAN_defence_of_canada_regulations_desc: "В трудные времена войны гражданские права должны быть ограничены, с тем чтобы предотвратить подрыв военных усилий, что означает жесткие ограничения в отношении прессы, временное приостановление действия &quot; хабеас корпус &quot; в сочетании с арестом и задержанием различных диссидентских групп."
 CAN_wartime_labour_relations_regulations: "Положения о трудовых отношениях в военное время"
 CAN_wartime_labour_relations_regulations_desc: "Для того чтобы обеспечить население и рабочую силу, мы должны юридически признать существование профессиональных союзов и заставить работодателей вести переговоры с организованными работниками, хотя это может помешать нашему производству в краткосрочной перспективе, мы надеемся, что это обеспечит будущую стабильность и приведет к дерадикализации профсоюзов."
 CAN_wartime_prices_and_trade_board: "Совет по военным ценам и торговле"
 CAN_wartime_prices_and_trade_board_desc: "Чтобы предотвратить спекуляцию и накопление средств, необходимо применять жесткие меры контроля за ценами и инфляцией для обеспечения того, чтобы товары были широко доступны для большинства канадцев."
 CAN_official_languages_act: "Проект закона об официальных языках"
 CAN_official_languages_act_desc: "Националисты получили значительное количество мест в парламенте и решительно выступают за закон, официально признающий французский в качестве официального языка Канады, еще до того, как наша Конфедерация, французские канадцы и англоязычные канадцы выступали против друг друга на каждом шагу, вызывая беспочвенные ссоры."



