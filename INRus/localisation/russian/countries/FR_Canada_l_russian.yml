 canelection.1.d: "Сегодня наступает день, когда начнутся внезапные выборы. Бывший союзный срок был сокращен на три года после краха союзного правительства. Некоторые граждане утверждали, что конец союзников был к лучшему, так как он сильно сместил консерваторов вправо и, наконец, дал левую часть сил для работы. Канадская политика, похоже, вернулась в свое естественное состояние, при этом консерваторы и либералы боролись за господство в ходе выборов. Несмотря на это, некоторые новые оппоненты вышли на сцену. КФК и Партия социального кредита быстро выросли в период доминирования союзистов, подкрепленные некоторыми разочарованными бывшими сторонниками Либеральной партии и Консервативной партии. ~ /Потому что мы находимся в интересном положении. Выборы легко могли пройти в любом из четырех способов, хотя перспектива еще одной консервативной победы вряд ли может сказать меньше."
 canelection.2.d: "От гор к прибрежным городам Британской Колумбии, граждане выдают свои голоса за эти выборы. 16 мест в парламенте - это похитители, кто будет принимать большинство?" #BC
 canelection.3.d: "Граждане бассейна Императорской нефти проводят выборы, Альберта является прочной базой Сокредов, ожидается победа в социальном кредите. 17 мест в парламенте - это место для захвата, может ли другая партия вытащить их из рук Сокредов?" #AL
 canelection.4.d: "На фермах и пшеницах прерии явка очень нерешительна. Победа Сокровища является правдоподобной из-за близости Саскачевана к Альберте, хотя КБК также оказывает некоторое влияние на этот район. Консервативы и либералы продолжают бороться друг с другом за контроль, но кто будет занимать 21 место?" #SK
 canelection.5.d: "Граждане Манитобы едут на избирательные участки, имея 17 мест, все партии пытаются занять свое место в парламенте." #MB
 canelection.6.d: "От густых лесов в северной части Онтарио до высокогородского района Торонто жители Онтара сомневаются в том, за кого им следует голосовать на выборах. Онтарио является прочной основой поддержки союзников, и в этом регионе по-прежнему существует пропорциональная атмосфера. Онтарио является весьма ценной провинцией, так как в стране насчитывается в общей сложности 82 места, что, несомненно, является самой влиятельной провинцией в Доминионе."  #ON
 canelection.7.d: "Наиболее печально известная провинция Доминиона, Квебек, где проживает франкоязычное население, исторически они выступали против англоязычного населения на каждом шагу, тем не менее они являются второй по численности населённой провинцией и остаются базой поддержки непрофсоюзных либералов во время Интервара, Квебек имеет 65 мест, которые могут быть захвачены четырьмя партиями. Однако вопрос остается открытым, кто победит?" #QB
 canelection.8.d: "Юкон — это территория, расположенная в Северной Канаде, прямо над Британской Колумбией, быстро поселившаяся Британской империей, чтобы блокировать американское расширение Аляски, в итоге она стала одной из более населенных территорий." #YK
 canelection.9.d: "Многие граждане выходят на избирательные участки, голосование может пройти в любом направлении. 10 мест в Нью-Брансуике забиты." #NB
 canelection.10.d: "В прибрежной провинции Новой Шотландии люди находят время для того, чтобы выйти и проголосовать." #NS
 canelection.11.d: "Маленький островок принца Эдварда Айлса имеет четыре места. но кто будет править победителями?" #PEI
 canelection.13.d: "Палата общин представила нам очень интригующий (и раздражающий) исход этих выборов. Несмотря на то, что ни одна из сторон не имеет явного большинства по отношению к другой, партия должна будет пойти на компромисс, чтобы получить большинство и принять правительство." #Gridlock
 canelection.14.d: "Кооперативы выиграли выборы, получив явное большинство в Палате общин." #CCF
 canelection.15.d: "Либералы выиграли выборы, получив явное большинство в Палате общин." #LIBERAL
 canelection.16.d: "Консервативы выиграли выборы, получив явное большинство в Палате общин." #CONSERVATIVE
 canelection.20.d: "Сокреды выиграли выборы, получив явное большинство в Палате общин." #SOCIAL CREDIT
 canelection.17.d: "В то время как демократические выборы партии в одном из Доминионов, как правило, являются непримечательным событием, канадский СРС является необычайно радикальной организацией, сопоставимой с нашей ИЛП./n/n/позволяя этим радикалам иметь место у власти, может быть весьма опасной ситуацией, что позволит им распространять социализм в Канаде, возможно, будет иметь последствия в будущем." #CRY FROM CANADA
 canelection.18.d: "В то время как демократические выборы партии в одном из Доминионов, как правило, являются непримечательным событием, канадский СРС является необычайно радикальной организацией, сопоставимой с нашей ИЛП./n/n/позволяя этим радикалам иметь место у власти, может быть весьма опасной ситуацией, что позволит им распространять социализм в Канаде, возможно, будет иметь последствия в будущем." #CRY FROM CANADA
 canelection.19.d: "С учетом недавних выборов СРС на федеральных выборах Великобритания твердо убеждена в том, что разрешение СРС распространять социализм в нашей стране является слишком опасным, поэтому они обратились к лорду Твидсмуиру с просьбой временно распустить канадский парламент до обозримого будущего." #LONDON'S INTERVENTION
 canelection.21.d: "Почти два месяца назад парламент был распущен по приказу Британии перед лицом радикальной социалистической победы Федерации кооперативного Содружества, с тех пор мы начали интенсивную реорганизацию. Мы временно управлялись лордом Твидсмуиром и его избранным кабинетом лоялистов, однако роспуск парламента был в значительной степени поддержан военными. Кроме того, военное правительство могло бы быть более эффективным, чем режим аболутистов Твидсмуара, и Лондон не может быть против концепции создания лоялиста Джунты."

