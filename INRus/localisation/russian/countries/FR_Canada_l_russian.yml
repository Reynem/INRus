 ### Army ###

 #CAN_spearhead_of_the_empire: ""Голубая голова Империи""
 #CAN_spearhead_of_the_empire_desc: "Во время Великой войны канадский корпус завоевал большой престиж благодаря эффективности канадских солдат, ни в коей мере не устарел канадский военный, но с престижом приходит ответственность, и в нашем случае ответственность заключается в том, чтобы Королевская канадская армия оставалась элитной и дисциплинированной силой."
 CAN_spearhead_of_the_empire: "Королевская канадская армия"
 CAN_spearhead_of_the_empire_desc: "В 1923 году, незадолго до смерти премьер-министра Бордена, он был вынужден реорганизовать различные сухопутные силы Канады в единые боевые силы. &lt; &lt; Вооруженные силы Канады &gt; &gt; и &lt; &lt; Профессиональные силы Канады &gt; &gt; были преобразованы в Королевскую канадскую армию. &lt; &lt; Некоторые силы &gt; &gt; были полностью распущены, такие, как постоянная активная милиция (PAM), хотя &lt; &lt; Непостоянная активная милиция &gt; &gt; (NPAM) осталась."

 ## McNaughton's Path ##

 CAN_mcnaughtons_lightning_warfare: "Война молнии Макнаутона"
 CAN_mcnaughtons_lightning_warfare_desc: "Эндрю Макнаутон - менее популярный, но, тем не менее, уважаемый генерал канадской армии. Быстро поднявшись на градации во время Великой войны, он был поражен эффективностью, с которой бронебойная война смогла уничтожить позиции противника. Защитник расширения бронепродукции и постепенного отказа от фантрии Ноги, МакНаутон не так ловко намекает на новый тип боевых действий, вращающихся вокруг скорости и бронированных зверей."
 CAN_army_of_mobility: "&lt; &lt; Армия мобильности &gt; &gt;"
 CAN_army_of_mobility_desc: "Многие считают, что пехотная пехота Лега будет ядром любой армии, для себя они могут быть правы, хотя мы и предпримем инициативу в эту новую эпоху войны, наша армия будет одним из первых, кто примет эту военную мысль, и одним из первых, кто действительно последует за ней."
 CAN_local_pattern_light_tanks: "Легкие цистерны местного образца"
 CAN_local_pattern_light_tanks_desc: ""
 CAN_tank_emplacement_stratagy: "Стратегия установки цистерн"
 CAN_tank_emplacement_stratagy_desc: "Пригласив наших боевых инженеров в "Уничтожить" наши танки, чтобы они выступали в качестве временных бункеров, мы можем резко повысить их оборонительность."
 CAN_modernized_supply_lines: "Модернизация линий снабжения"
 CAN_modernized_supply_lines_desc: "Мы сделали это, но у нас также есть высококомпетентные квартермейстеры и специалисты по материально-техническому обеспечению, что позволяет сократить потребление."
 CAN_armor_innovations: "Инновации бронетехники"
 CAN_armor_innovations_desc: "Мы не слепы, когда речь заходит о разнице в эффективности средних и легких танков и тяжелых цистерн."
 CAN_school_of_movement: "Школа движений"
 CAN_school_of_movement_desc: "Наша доктрина, вращающаяся вокруг танков и подвижной пехоты, уже разработана, и теперь, когда у нас есть прочная основа доктрины, мы можем усовершенствовать ее дальнейшее развитие."

 ## Currie's Path ##

 CAN_curries_firepower_primacy: "Огненная мощь Кёрри"
 CAN_curries_firepower_primacy_desc: "Артур Карри - высокооплачиваемый генерал канадской армии, он, несомненно, военный гений и один из лучших военных лидеров нашей страны, его репутация в Великой войне вращалась вокруг его широкого использования артиллерийской поддержки и мурашкивых дамб."
 CAN_reequip_our_soldiers: "Очистить наших солдат"
 CAN_reequip_our_soldiers_desc: ""
 CAN_modernize_the_rrca: "Модернизация RRCA"
 CAN_modernize_the_rrca_desc: "Королевский полк канадской артиллерии по-прежнему оснащен QF-18 Пундерами."
 CAN_adopt_assault_tanks: "Удостоверение нападающих танков"
 CAN_adopt_assault_tanks_desc: ""Опасные танки" были поставлены некоторыми из генералов-арморов в нашей армии, в особенности Эндрю Макнаутоном, он предсказывает разработку умеренных бронетанков, которые могли бы обеспечить как прямую, так и непрямую огневую поддержку для пехотинцев."
 CAN_field_aid_and_field_support: "Полевая помощь и полевая поддержка"
 CAN_field_aid_and_field_support_desc: "Война - это ужасный опыт для обычного солдата. Есть слишком много ситуаций, когда человек умирает, когда его могли спасти, если он был бы осторожен. Канадский корпус согласился, что полевые больницы и другие вспомогательные элементы должны быть прочно интегрированы в нашу армию."
 CAN_air_army_cooperation: "Сотрудничество между военно-воздушными силами"
 CAN_air_army_cooperation_desc: "Система &lt; &lt; Закрытая авиация &gt; &gt; -- это невероятно полезный инструмент, который используется в координации в той мере, в какой мы используем обычные артиллерийские орудия; у нас будет непобедимое количество огневой мощи."
 CAN_school_of_shock: "Шоковая школа"
 CAN_school_of_shock_desc: "Наша репутация как Шок-Трупс сейчас достигает дальше, чем просто эффективность наших людей. Теперь вся наша военная доктрина вращается вокруг Артиллерии, Огненной мощи и Элитной пехоты. С опорой нашей доктрины мы сможем развивать ее дальше."

 ### Navy ###

 CAN_improve_maritime_dockyards: "Возобновить Королевский канадский ВМС"
 CAN_improve_maritime_dockyards_desc: "Западные морские порты по-прежнему бумируют благодаря их рыболовецкой промышленности."
 CAN_pacific_dockyards: "Тихоокеанские пристани"
 CAN_pacific_dockyards_desc: ""

 CAN_anti_submarine_effort: "Борьба с подводной водой"
 CAN_anti_submarine_effort_desc: "Весьма реальной угрозой являются нападения подводные лодки на автоколонны или автоколонны с грузом войск."
 CAN_carrier_focus: "Сосредоточьтесь на перевозчике"
