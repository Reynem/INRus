l_russian:

 #### Description #####
 CAN_FUHRERREICH_DESC: "Канада присоединилась к Великой войне вместе с остальной британской империей в тёмный 1914 год, после Версальского договора Великобритания и ее Доминионы вступили в эру экономического процветания, которая привела к массовым миссиям по добыче ресурсов в Канаде, но почти не все в Доминионе, Юнионистская коалиция, созданная премьер-министром Великой Войны Робертом Борденом, была успешно сохранена, но ссоры между Либерально-Тори возобновились, что вызвало внутренние разногласия внутри партии. Кроме того, многие граждане недовольны подавляющим политическим господством "Красных Тори"..."
 
 #### Focus Tree ####

 ### Internal Affairs ###

 CAN_canadas_fair_domain: "Справедливое достояние Канады"
 CAN_canadas_fair_domain_desc: "Мы сражались в аду, это была Великая Война, мы сражались в окопах, мы сражались на полях, мы сражались из артиллерийских батарей, в небе и в ранних бронированных зверях, которые теперь известны как Танки, мы никогда не заслужили свою автономию и все еще твердо находятся под крылом Британнии."
 CAN_canada_carries_on: "Canada Caries On"
 CAN_canada_carries_on_desc: "Национальный совет по кинематографии Канады запросил дополнительные средства для создания серии короткометражных фильмов пропаганды, которые будут охватывать широкий круг тем, начиная от простого поощрения мужчин к вступлению в армию и кончая углубленными учебными видеозаписями для демонстрации того, как следует обращаться с определенными видами оборудования."
 CAN_nra_program: "Расширение Национального исследовательского совета"
 CAN_nra_program_desc: "Национальный научно-исследовательский совет будет расширен, с тем чтобы держать нас в технологическом состоянии и на шаг впереди наших врагов."
 CAN_radar: "Р.Д.Ф."
 CAN_radar_desc: "С появлением Р.Д.Ф. электронная война претерпела огромные изменения. Короче говоря, это устройство, которое позволит нам обнаружить врагов с большой дистанции с помощью радиоволн."
 CAN_nfb_corp: "Нашел Национальный совет по кинематографии"
 CAN_nfb_corp_desc: ""
 CAN_defence_construction_limited: "&lt; &lt; Оборона констракшн лимитед &gt; &gt;"
 CAN_defence_construction_limited_desc: ""
 CAN_dominion_atomic_energy: "Доминион по атомной энергии"
 CAN_dominion_atomic_energy_desc: ""
 CAN_department_of_munitions_and_supply: "Департамент боеприпасов и снабжения"
 CAN_department_of_munitions_and_supply_desc: ""
 CAN_wartime_industries_control_board: "Совет по контролю за военной промышленностью"
 CAN_wartime_industries_control_board_desc: ""
 CAN_cbc_corp: "Нашел КБК."
 CAN_cbc_corp_desc: ""

 ### Industry ###

 CAN_fund_oil_exploitation: "Расширить нефтяные месторождения долины Тернер"
 CAN_fund_oil_exploitation_desc: "С момента открытия месторождений природного газа и нефти в долине Тернер в 1914 году Канада стала крупнейшим нефтяным месторождениям Британской империи, получив для нас неизмеримо ценную прибыль."
 CAN_black_wednesday_initiatives: "&lt; &lt; Имперские инициативы по борьбе с катастрофами &gt; &gt;"
 CAN_black_wednesday_initiatives_desc: "Период экономического процветания Империи закончился... руины трагедии в Лондоне поразили нас, чего можно было ожидать, но это далеко не конец для Канады, мы будем упорствовать, и мы скажем общественности, что мы будем упорствовать, хотя одни только слова для них этого не прекратят."
 CAN_expand_the_dbs: "Расширить D.B.S."
 CAN_expand_the_dbs_desc: "В соответствии с Законом о статистике в 1918 году было создано Статистическое бюро Доминиона (или Д.Б.С.), которое отвечает за проведение переписей населения в стране, однако не делает ничего, кроме этого."
 CAN_statistics_canada: "Дополнительно расширить D.B.S."
 CAN_statistics_canada_desc: ""
 CAN_expand_the_rcmp: "Расширить КККП"
 CAN_expand_the_rcmp_desc: "Королевская канадская конная полиция имеет в Канаде наследие: мало кто из них был не в состоянии сделать это, и они выполнили множество достойных восхищения задач; они также несут ответственность за проникновение и роспуск политических групп, которые могут считаться опасными для Канады."
 CAN_polycorp: "Поликорп"
 CAN_polycorp_desc: ""Поликорп", или более официально известная как "Полимер Корпорейшн", позволит нам производить каучук на местном уровне вместо того, чтобы полагаться на зарубежную торговлю. Хотя маловероятно, что другие члены Империи импортируют нилон или синтетический каучук, по крайней мере, это позволит нам стать более самодостаточными."
 CAN_mines_in_the_iron_range: "Мины на железной дальности"
 CAN_mines_in_the_iron_range_desc: "Долгое время у американцев были мины на стороне Железного хребта, они были невероятно прибыльны для них, так как они расположены в некоторых из самых богатых железом районов Северной Америки. Однако Железный хребет простирается в Северное Онтарио... кто говорит, что мы не можем использовать то, что по праву принадлежит нам?"
 CAN_inglis_arms: "Инглис-Оружие"
 CAN_inglis_arms_desc: "Джон Инглис и компания, известные как просто Инглис, специализируются на производстве оружия с 1859 года; до того, как остающиеся североамериканские колонии были преобразованы в Доминион Канады, финансирование строительства новых заводов является необходимым шагом в обеспечении непрерывного производства военных материалов и борьбе с безработицей."
 CAN_long_branch_arsenal: "Длинный ствол"
 CAN_long_branch_arsenal_desc: "Некоторые из наших министров выдвинули идею о создании короны под названием "Смол армс лимитед", которая будет эксплуатировать недавно построенный объект, известный как "Долговый филиал Арсенал"."
 CAN_found_new_crown_corporations: "Нашел новые королевские корпорации"
 CAN_found_new_crown_corporations_desc: "Создавая новые государственные корпорации, мы сможем более свободно вмешиваться в этот кризис."
 CAN_canadian_pacific_railway: "Канадская тихоокеанская железная дорога"
 CAN_canadian_pacific_railway_desc: "Потребовалось более четырех лет на строительство Канадской тихоокеанской железнодорожной магистрали, которое завершилось в 1885 году, что является дорогостоящим, но ценным вложением средств, что связывает Восточную и Западную Канаду и уменьшает разрыв между ними."
 CAN_relief_camps: "Лагеря помощи"
 CAN_relief_camps_desc: "Красные Торы выдвинули предложение, государственные "лагери помощи работе". Эти лагеря предназначены для того, чтобы предоставить больше возможностей для трудоустройства Популасу, хотя правда немного глубже, чем это. Средний трудящийся в лагере выполнял бы менструальные, утомительные, трудоемкие работы. Однако, они были бы обеспечены питанием, кровом и теплом по крайней мере."
 CAN_additional_research_teams: "Дополнительные исследовательские группы"
 CAN_additional_research_teams_desc: "Как и любая западная нация, мы должны приложить все усилия для того, чтобы быть в курсе всех промышленных и военных инноваций."
 CAN_the_charlottes_program: "Программа Шарлотт"
 CAN_the_charlottes_program_desc: "Программа Шарлотт - это план стимулирования роста населения по всей Канаде и привлечения иммигрантов из Великобритании и материковой Европы."
 CAN_black_wednesday_recovery: "Поощрение потребительского поведения"
 CAN_black_wednesday_recovery_desc: "После долгих трудов мы пережили и восстанавливаемся после катастрофы, которая потрясла мир. Наша экономика не так быстро процветает, как прежде, но со временем это изменится. Пока наша экономика все еще находится на упадке, мы находимся в гораздо более стабильном положении."
 CAN_final_stride: "Последняя страсть"
 CAN_final_stride_desc: ""
 CAN_invest_in_new_highways: "Инвестировать в новые шоссейные дороги"
 CAN_invest_in_new_highways_desc: ""
 CAN_coal_exports_to_britain: "Экспорт угля в Великобританию"
 CAN_coal_exports_to_britain_desc: ""
 CAN_cut_the_budget: "Жесткость"
 CAN_cut_the_budget_desc: ""
 CAN_mobilize_bc: "&lt; &lt; Мобилизовать Британскую Колумбию &gt; &gt;"
 CAN_mobilize_bc_desc: ""
 CAN_prairie_prioritization: "Приоритизация прерий"
