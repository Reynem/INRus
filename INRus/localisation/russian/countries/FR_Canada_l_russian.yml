 CAN_new_naval_command: "Новое военно-морское командование"
 CAN_new_naval_command_desc: ""
 CAN_floating_forts: "Плавущие крепости"
 CAN_floating_forts_desc: "Боевые корабли были Королями морей столько, сколько кто-либо помнит."
 CAN_heavy_fleet: "Тяжелый флот"
 CAN_heavy_fleet_desc: ""
