 CAN_defend_against_amerika_idea: "Против американской организации &lt; &lt; Онслан &gt; &gt;"
 CAN_defend_against_amerika_idea_desc: "Янки снова идут на север, как в 1812 году, как и в 1812 году, они приходят не для того, чтобы "освободить" нас, а чтобы покорить нас, мы не позволим их ботинкам на нашей земле, мы обратим вспять это вторжение и сожжем Белый дом снова!"
