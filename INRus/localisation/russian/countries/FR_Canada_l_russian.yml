 #General Bandwagon
 CAN_Gen_Currie_DESC: "В 1897 году во время Второй битвы при Ипресе быстро поднялся на различные позиции еще до Великой войны, стал офицером в 1900 году, Капитан в 1901 году, майор в 1906 году, командующий Артиллерийским полком в 1909 году. Назначен командующим 2-й канадской бригадой в связи с началом Великой войны."
 CAN_Gen_McNaughton_DESC: "§W присоединился к канадской военной милиции в 1909 году, служил во время Великой войны. Прибыл во Францию в феврале 1915 года. Получил повышение до подполковника в 1916 году, а затем несколько месяцев спустя был повышен до офицера канадского корпуса по борьбе с батарей. В 1918 году был назначен генеральным офицером, командующим тяжелой артиллерией канадского корпуса, а в 1924 году был повышен до заместителя начальника Генерального штаба."
 CAN_Gen_Foulkes_DESC: "В 1926 году он вступил в Канадский корпус, учился в колледже персонала в Англии в 1934 году. n-No Awards.n §GNotes: §W-N-Ne-Operation в Великой Войне."
 CAN_Gen_Crerar_DESC: "§W 28 апреля 1888 года, Hamilton, Canada\n §Gary Service: §W Service in the Great War in the Artillery."
 CAN_Gen_Simonds_DESC: "§W 23 апреля 1903 года, Suffolk, British\n§G Военная карьера: §W Рожден в семью с сильной военной историей. Иммигрировал в Канаду, когда его отец ушел в отставку с Королевской армии (с званием майора) в 1911 году. Учился в Королевском военном колледже Канады в 1921-1925 годах. Поступил на второй национальный экзамен. Получил лучшее "всестороннее" после окончания школы. Поступил в Канадский корпус в 1926 году. Поступил на должность майора (в конце декабря 1932 года)."
 CAN_Gen_Hoffmeister_DESC: "§W 15 мая 1907 года, Ванкувер, Канада §G Военная карьера: §W присоединилась к резервам в 1926 году, получила повышение до капитана в 1934 году."
