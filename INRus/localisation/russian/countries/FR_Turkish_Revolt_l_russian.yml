 trt.49.a: "Черт побери!"

 trt.50.t: "Преследует Тис."
 trt.50.d: "Интересно то, что новый лидер турецкого государства Хюсейин Нихал Бей, стремясь к дальнейшему продвижению общетуркских идеалов, решил укреплять связи с [Руком.Гетнамом]. Делегация [Трт. Гетнама] упомянула о нашей генетической близости и выгоде укрепления и углубления связей между нашими странами, особенно с учетом постоянно обостряющейся бурной ситуации в мире."
 trt.50.a: "Что может пойти не так?"
 trt.50.b: "Нам не нужен пан-Туркизм."

 trt.51.t: "Принимает!"
 trt.51.d: "К счастью, кажется, что [From.GetNameDef] решили принять наше предложение о углублении связей между нашим новым правительством. Хотя это можно рассматривать как нечто большее, чем символический жест многих международных наблюдателей, на самом деле это очень полезно, поскольку помогло придать легитимность нашему правлению и нашей программе, так как мы смогли доказать народу [Root.GetAductive], что мы можем успешно осуществлять нашу собственную повестку дня."
 trt.51.a: "Тост за наших друзей!"

 trt.52.t: "Расслабься!"
 trt.52.d: "Наша делегация только что сообщила другим туркменским странам тревожные новости: похоже, что [From.GetNameDef] решили отклонить наше предложение об укреплении и углублении связей, указав, что в его нынешнем виде нет необходимости развивать пантуркические идеалы. Это огромный удар по легитимности нового правительства, поскольку мы в настоящее время не в состоянии доказать народу [Root.GetAductive], что мы можем успешно осуществлять свою собственную повестку дня."
 trt.52.a: "Черт побери!"

 trt.53.t: "Кампания по набору персонала: низкий уровень кампании"
 trt.53.d: "Очевидно, что для того, чтобы выполнить нашу повестку дня, нам необходимо начать кампании по вербовке, конечно же, будет трудно убедить население [поехать на помощь] присоединиться к армии, чтобы обойти это, правительство начнет тонкую кампанию по вербовке и будет все более агрессивнее вербовать людей, запугивая эмбрионы национализма."
 trt.53.a: "Ради блага нации."

 trt.54.t: "Кампания по набору персонала: регулярная кампания"
 trt.54.d: "По прошествии нескольких месяцев наши усилия принесли свои плоды. По мере того, как мы начали повышать интенсивность кампании по вербовке, все больше и больше трудоспособных мужчин подписываются на вступление в [Рут. Гетегитивные] Сухопутные силы."
 trt.54.a: "Отлично."

 trt.55.t: "Кампания по набору персонала: активная кампания"
 trt.55.d: "Теперь правительство стало более открыто проводить свою кампанию, и она явно окупилась. То, что было когда-то тонкой кампанией по вербовке новых призывников стало полной кампанией с плакатами на каждом углу улицы. Подписывающиеся получают поддержку и стремятся служить родине. Наши вооруженные силы стали свидетелями рекордного числа людей."
 trt.55.a: "Замечательно!"

 trt.56.t: "Расширение прав и возможностей военизированных групп"
 trt.56.d: "Хюсейин Нихаль Бей сам выступал за сотрудничество с военизированными группами, которые поддерживают его общетурковую политику, и это может обеспечить, чтобы в случае широкого неодобрения и, если инакомыслие будет достаточно высоким, бунтовать против наших предложений, у нас была группа, вооружённая зубами, чтобы поддержать нас."
 trt.56.a: "Это необходимая мера."

 trt.57.t: "Реакция вооруженных сил"
 trt.57.d: "Вооруженные силы, по всей видимости, не проявляют любезности к нашей политике поддержки экстремистских военизированных групп и вооружения их самыми новыми видами оружия, ставя под сомнение наши приоритеты в отношении военных расходов и высказывая замечания относительно абсурдности нашей поддержки пантуркских военизированных группировок."
 trt.57.a: "Кем они себя возомнили?"

 trt.58.t: "Старые охранники говорят"
 trt.58.d: "Старые офицеры охраны стали еще более громкими в своей критике, утверждая, что поддержка военизированными группами самих вооруженных сил Нихал Бейтс бессмысленна, особенно учитывая, что [Root.GetNameDef] окружены врагами со всех сторон и им потребуются профессиональные силы, чтобы помочь защитить нацию в случае нападения, или, если мы пойдем на наступление, напасть на самих наших врагов."
 trt.58.a: "Они не знают, о чем они говорят..."

 trt.59.t: "Уничтожение левых"
 trt.59.d: "Мы использовали находящиеся под нашим контролем военизированные группировки для нашей выгоды, идентифицируя и убивая видных левых, лидеров и другие высшие должностные лица различных социалистических партий были выведены или вынуждены скрываться, хотя это вывело социалистические партии из общественной сферы, это не означает, что у них были подземные движения, с которыми, как представляется, придется иметь дело в будущем."
 trt.59.a: "Это должно было быть сделано."

 trt.60.t: "Реорганизация нации"
 trt.60.d: "Несмотря на то, что мы раз и навсегда избавились от Османской империи, мы по-прежнему сохраняем многое из проблем, которые поразили империю, например, наша бюрократия неэффективна и бесповоротна, в значительной степени неэффективна и не способна выполнять свою работу должным образом. Коррупция процветает, а отсутствие возможности индустриализации наносит ущерб нашей экономике. Мы должны приступить к реформированию самого ядра государства и созданию сильного турецкого государства."
 trt.60.a: "Мы добьемся успеха!"

 trt.61.t: "Работа с бюрократией"
 trt.61.d: "Как уже отмечалось выше, бюрократия, которой мы унаследовали, была неэффективной и способной выполнять даже самые простые задачи, и именно поэтому мы решили создать турецкую государственную администрацию, уволить старых охранников и заменить их умелыми людьми, способными эффективно и действенно выполнять свои задачи."
 trt.61.a: "Будем надеяться, что они..."

 trt.62.t: "Успех бюрократических усилий"
 trt.62.d: "К счастью, наши усилия по модернизации бюрократии, по большей части, принесли свои плоды, хотя нам еще предстоит пройти долгий путь для того, чтобы достичь того уровня успеха, которого мы действительно хотим видеть, это хорошее начало, и уже турецкое правительство, выполняя свои повседневные функции, начало более эффективно выполнять различные задачи и лучше удовлетворять потребности народа."
 trt.62.a: "Потрясающе!"

 trt.63.t: "Судебный контроль"
 trt.63.d: "Мы должны начать брать дело в свои руки; вместо того, чтобы допустить существование независимой судебной системы, мы должны обратиться к таким странам, как Соединенные Штаты, которые позволяют президенту, являющемуся главой исполнительной власти, назначать судей по своему усмотрению, однако мы также должны сделать свое заявление: президенту будет разрешено увольнять судей по своему усмотрению, а сами судебные органы, разумеется, будут контролироваться президентом."
 trt.63.a: "Вперед!"

 trt.64.t: "Закрывание парламента"
 trt.64.d: "До нашего прихода к власти парламент был в значительной степени парализованным институтом и имел кучу вражд, что ничего не значило, что сам парламент принял решение передать турецкое государство в руки империалистических держав, как можно допустить существование института, демонстрирующего такую наглую трусость?"
 trt.64.a: "Это необходимая мера..."

 trt.65.t: "Революция сломалась!"
 trt.65.d: "Похоже, наша политическая оппозиция взяла дело в свои руки, мобилизовав против нас все население! Либералистам и кемалистам удалось преодолеть свои разногласия и создать против нас коалицию, поклявшись вывести нас из себя, объявляя себя истинными наследниками [королевы. Гетэдей] нации. Мы не можем позволить им так запятнать название нашей великой империи, и мы должны принять решительные меры как можно скорее."
 trt.65.a: "Мы раздавим этих надменных узурпаторов!"

 trt.66.t: "Заказ новых морских круизеров"
 trt.66.cruisernoempire: "После трудоемких и интенсивных усилий военно-морских сил, после нескольких месяцев напряженной работы, нам удалось заказать два новых крейсера в составе крейсерского флота: морской крейсер Зафер и Явуз. Несмотря на то, что приобретение запасных частей для строительства этих крейсеров было нелегким подвигом, нам удалось добиться этого и в результате укрепить наш флот."
 trt.66.cruiserempire: "После трудоемких и интенсивных усилий военно-морских сил, после нескольких месяцев напряженной работы, нам удалось заказать два новых крейсера в составе крейсерского флота: морской крейсер Берк-и Сатвет, названный в честь нашего старого торпедного крейсера, который был сломан после Великой войны, и Мекидийе. Несмотря на то, что приобретение деталей для строительства этих крейсеров было нелегким подвигом, нам удалось добиться этого и в результате этого укрепить наш флот."
 trt.66.a: "Великолепно!"

 trt.67.t: "Военная помощь [Trt. GetNameDef]?"
 trt.67.d: "Интересно, что кажется, что [tr. GetNameDef] решил прийти к нам за помощью в военном отношении, конкретно просив нас помочь им в профессионализации и совершенствовании их вооруженных сил. Хотя это может оказаться пустой тратой ресурсов, если мы воспользуемся этим шансом, мы могли бы расширить наши связи с [trt.getaductive] нацией. Что мы скажем?"
 trt.67.a: "Что может пойти не так?"
 trt.67.b: "Скорее нет."

 trt.68.t: "Приняли!"
 trt.68.d: "К счастью, кажется, что [отправители] решили принять нашу просьбу о военной помощи и начали оперативно направлять нам помощь, и это благо не только нашим вооруженным силам, но и будущим связям."
 trt.68.a: "Потрясающе!"

 trt.69.t: "[From.GetNameDef] сорвался!"
 trt.69.d: "К сожалению, кажется, что [отправитель] решил решительно отклонить наш призыв об оказании военной помощи, заявив, что на данный момент у них нет ресурсов, которые можно было бы пощадить, что является откатом не только для наших вооруженных сил, но и для будущих связей."
 trt.69.a: "Неудачник, если быть уверенным..."

 trt.70.t: "Военная помощь [Trt. GetNameDef]?"
 trt.70.d: "Интересно, что кажется, что [tr. GetNameDef] решил прийти к нам за помощью в военном отношении, конкретно просив нас помочь им в профессионализации и совершенствовании их вооруженных сил. Хотя это может оказаться пустой тратой ресурсов, если мы воспользуемся этим шансом, мы могли бы расширить наши связи с [trt.getaductive] нацией. Что мы скажем?"
 trt.70.a: "Что может пойти не так?"
 trt.70.b: "Скорее нет."

 trt.71.t: "Приняли!"
 trt.71.d: "К счастью, кажется, что [отправители] решили принять нашу просьбу о военной помощи и начали оперативно направлять нам помощь. Это благо не только нашим вооруженным силам, но и будущим связям."
 trt.71.a: "Потрясающе!"

 trt.72.t: "[From.GetNameDef] сорвался!"
 trt.72.d: "К сожалению, похоже, что [отправители] решили решительно отклонить наш призыв об оказании военной помощи, заявив, что в данный момент у них нет ресурсов, которые можно было бы пожалеть, что это является откатом не только для наших вооруженных сил, но и для будущих [от. Возбуждения]-[отказа в помощи]."
 trt.72.a: "Неудачник, если быть уверенным..."

 trteco.1.t: "Экономический спад"
 trteco.1.d: "Похоже, несколько дней назад Лондонская фондовая биржа упала, а уровень безработицы и текучесть кадров в Соединенном Королевстве резко возросли. К сожалению, безработица и увольнения не остались незатронутыми, так как шоковая волна коллапса Лондонского рынка негативно повлияла на нашу великую нацию. Даже сейчас магазины начинают быстро закрываться, и иностранные компании оставляют [Root.GetNameDef] в автомобилях. Безработица и увольнения резко возросли, и в настоящее время среди населения наблюдается недовольство. Это не могло произойти в худшее время, и очевидно, что нам придется предпринять шаги по борьбе с этим экономическим спадом, чтобы не разорвать нашу страну."
 trteco.1.a: "Каретсин!"

 trteco.2.t: "Процветание социалистов в популярности"
 trteco.2.d: "Спустя несколько дней после экономического спада уже кажется, что социалисты в нашей стране начали использовать эту ситуацию в своих интересах. Решад Фуад и Шафик Хюсню активно пропагандируют политическую идеологию социализма и расширяют права и возможности простых работников, что, к сожалению, оказало заметное воздействие, поскольку социалистическая партия Трудящиеся и Персианты и Коммунистическая партия набирали последователей у разочарованного населения."
 trteco.2.a: "Бесполезный жест."

 trteco.3.t: "Национализировали свои железные дороги!"
 trteco.3.d: "При Оттоманской государственной задолженности многие из наших иностранных компаний и само правительство были заинтересованы в [трт. GetNameDef] самых известных и ценных промышленных предприятиях, включая их железные дороги. К сожалению для нас, правительство [tr. GetAdquesty] приняло решение национализировать свои железные дороги, лишая тем самым нас и наши компании какой-либо прибыли."
 trteco.3.a: "Ничего не делай."
 trteco.3.b: "Эмбарго им!"
 trteco.3.c: "Объявить войну!"

 trteco.4.t: "Национализировали свои железные дороги!"
 trteco.4.d: "При Оттоманской государственной задолженности многие из наших иностранных компаний и само правительство были заинтересованы в [трт. GetNameDef] самых известных и ценных промышленных предприятиях, включая их железные дороги. К сожалению для нас, правительство [tr. GetAdquesty] приняло решение национализировать свои железные дороги, лишая тем самым нас и наши компании какой-либо прибыли."
 trteco.4.a: "Ничего не делай."
 trteco.4.b: "Эмбарго им!"
 trteco.4.c: "Объявить войну!"

 trteco.5.t: "Национализировали свои железные дороги!"
 trteco.5.d: "При Оттоманской государственной задолженности многие из наших иностранных компаний и само правительство были заинтересованы в [трт. GetNameDef] самых известных и ценных промышленных предприятиях, включая их железные дороги. К сожалению для нас, правительство [tr. GetAdquesty] приняло решение национализировать свои железные дороги, лишая тем самым нас и наши компании какой-либо прибыли."
 trteco.5.a: "Ничего не делай."
 trteco.5.b: "Эмбарго им!"
 trteco.5.c: "Объявить войну!"

 trteco.6.t: "[From.GetName] Эмбарго!"
 trteco.6.d: "Похоже, что наше решение о национализации наших железных дорог не было бесспорным."
 trteco.6.a: "Черт..."

 trteco.7.t: "[From.GetName] Эмбарго!"
 trteco.7.d: "Похоже, что наше решение о национализации наших железных дорог не было бесспорным."
 trteco.7.a: "Черт..."

 trteco.8.t: "[From.GetName] Эмбарго!"
 trteco.8.d: "Похоже, что наше решение о национализации наших железных дорог не было бесспорным."
 trteco.8.a: "Черт..."

 trteco.9.t: "Первоначальная стабилизация"
 trteco.9.d: "Хотя измеряемая нами жесткость была в значительной степени непопулярна для общественности, когда она была впервые введена в действие, кажется, что наша настойчивость в их применении принесла свои плоды из-за повышения налоговых ставок и сокращения государственных расходов, мы смогли смягчить некоторые последствия коллапса Лондонского рынка."
 trteco.9.a: "Замечательно!"

 trteco.10.t: "Торговля с [TrT. GetNameDef]?"
 trteco.10.d: "На этот раз они ясно дали понять, что они хотели бы заключить с нами торговую сделку в попытке обеспечить более свободное перемещение товаров между нашими странами, и заявили, что это принесет взаимную пользу обеим нашим экономикам."
 trteco.10.a: "Конечно!"
 trteco.10.b: "Абсолютно нет."

 trteco.11.t: "Приняли!"
 trteco.11.d: "[From.GetName] решил принять наше предложение о сделке, тем самым позволив нам начать более свободное движение товаров между нашими двумя странами, а также поставить нас в благоприятную дипломатическую ситуацию, что имеет далеко идущие последствия, все из них хороши, для будущих совместных предприятий."
 trteco.11.a: "Тост за наших друзей!"

 trteco.12.t: "[From.GetNameDef] сорвался!"
 trteco.12.d: "Похоже, что [отправители] сочли нужным отказать нам в сделке, тем самым лишив нас всякой секвенности экономического сотрудничества между нашими двумя странами и фактически лишив нас какой-либо экономической выгоды, которой мы могли бы воспользоваться, что имеет далеко идущие последствия для будущих совместных предприятий."
 trteco.12.a: "Черт!"

 trteco.13.t: "Торговля с [TrT. GetNameDef]?"
 trteco.13.d: "На этот раз они ясно дали понять, что они хотели бы заключить с нами торговую сделку в попытке обеспечить более свободное перемещение товаров между нашими странами, и заявили, что это принесет взаимную пользу обеим нашим экономикам."
 trteco.13.a: "Конечно!"
 trteco.13.b: "Абсолютно нет."

 trteco.14.t: "Приняли!"
 trteco.14.d: "[From.GetName] решил принять наше предложение о сделке, тем самым позволив нам начать более свободное движение товаров между нашими двумя странами, а также поставить нас в благоприятную дипломатическую ситуацию, что имеет далеко идущие последствия, все из них хороши, для будущих совместных предприятий."
 trteco.14.a: "Тост за наших друзей!"

 trteco.15.t: "[From.GetNameDef] сорвался!"
 trteco.15.d: "Похоже, что [отправители] сочли нужным отказать нам в сделке, тем самым лишив нас всякой секвенности экономического сотрудничества между нашими двумя странами и фактически лишив нас какой-либо экономической выгоды, которой мы могли бы воспользоваться, что имеет далеко идущие последствия для будущих совместных предприятий."
 trteco.15.a: "Черт!"

 trteco.16.t: "Выплата долгов Осману"
 trteco.16.d: "Поскольку мы являемся страной-кредитором в Оттоманской государственной задолженности и обладаем инвестициями в османской экономике наряду с османской задолженностью, мы также получили постоянные платежи от Османской империи, с тем чтобы выполнить свои финансовые обязательства и вернуть нам долг. Интересно, что оттоманцы считают нужным увеличить ставки, по которым они платят нам в попытке добиться экономической независимости."
 trteco.16.a: "Пока мы получаем наши деньги..."

 trtfor.1.t: "Вызовите Трапизон!"
 trtfor.1.d: "В каком-то удивительном шаге турки потребовали, чтобы мы передали им Трапизон или столкнулись с ужасными последствиями."
 trtfor.1.a: "Мы не можем надеяться противостоять им..."
 trtfor.1.b: "Мы будем сражаться, чтобы защитить нашу землю!"

 trtfor.2.t: "Седес Трабзон"
 trtfor.2.d: "Похоже, что он сложился и решил свалиться под наши требования, и земля скоро будет полностью под нашим контролем, и враги будут эвакуировать и выводить войска в этот район."
 trtfor.2.a: "Отлично."

 trtfor.3.t: "Отказывается от наших требований!"
 trtfor.3.d: "Похоже, что он пошел против наших желаний и не отдал нам по праву нашу территорию."
 trtfor.3.a: "Тогда мы возьмем его силой!"

 trtfor.4.t: "В Карине требуется плебисцит."
 trtfor.4.d: "Похоже, что [трта. Найти адаптив] сочли нужным потребовать плебисцита на нашей спорной территории Карин, хотя мы могли бы просто отказаться от проведения плебисцита, поскольку Карин является законной армянской территорией, он не полюбил бы нас к людям, живущим в этом районе, и особенно к [т."
 trtfor.4.a: "Мы не допустим дальнейших посягательств на нашу территориальную целостность!"
 trtfor.4.b: "Всё, что угодно ради мира..."

 trtfor.5.t: "Отклонение"
 trtfor.5.d: "Похоже, что он пошел против наших желаний и не отдал нам по праву нашу территорию."
 trtfor.5.a: "Уничтожить их!"

 trtfor.6.t: "Результаты плебисцита - [tr."
 trtfor.6.d: "К сожалению, кажется, что предатели Карина продемонстрировали свои истинные цвета и отказались остаться в стране, несомненно, это удар по нашей гордости и международному престижу..."
 trtfor.6.a: "Черт!"

 trtfor.7.t: "Результаты плебисцита - [ARM."
 trtfor.7.d: "К счастью, кажется, что преданный народ Карина понял, где он действительно принадлежит, и сделал выбор вернуться в народ."
 trtfor.7.a: "Наши преданные граждане показали нам свою поддержку!"

 trtfor.8.t: "Результаты плебисцита - [tr."
 trtfor.8.d: "К счастью, кажется, что преданный народ Эрзурума понял, где он действительно принадлежит, и сделал выбор, чтобы вернуться к народу."
 trtfor.8.a: "Добро пожаловать домой!"

 trtfor.9.t: "Результаты плебисцита - [ARM."
 trtfor.9.d: "К сожалению, кажется, что предатели в Эрзуруме продемонстрировали свои истинные цвета и отказались мирно вернуться в [Рут."
 trtfor.9.a: "Мы не признаем этих результатов, на войну!"
 trtfor.9.b: "Мы должны уважать волю тех, кто в Эрзеруме."

 trtfor.10.t: "Трелли требует троллей!"
 trtfor.10.d: "В каком-то удивительном шаге турки потребовали, чтобы мы передали им троллей или столкнулись с ужасными последствиями."
 trtfor.10.a: "Мы не уступим ни дюйма нашей земли!"
 trtfor.10.b: "Мы не можем спровоцировать войну с [Торт. Найти] в это время."

 trtfor.11.t: "Отклонение!"
 trtfor.11.d: "Похоже, что он пошел против наших желаний и не дал нам по праву нашей территории."
 trtfor.11.a: "Тогда мы заберем нашу законную землю силой!"
 trtfor.11.b: "Мы должны подождать..."

 trtfor.12.t: "Принимается."
 trtfor.12.d: "Похоже, что он сложился и решил свалиться под наши требования, и земля скоро будет полностью под нашим контролем, и враги будут эвакуировать и выводить войска в этот район."
 trtfor.12.a: "Снова воссоединились с нашими братьями!"

 trtfor.13.t: "Заткнись, Панфилия!"
 trtfor.13.d: "В каком-то удивительном шаге турки потребовали, чтобы мы передали им Панфилию или столкнулись с ужасными последствиями."
 trtfor.13.a: "Эта земля по праву наша!"
 trtfor.13.b: "Дай им никчемную землю."

 trtfor.14.t: "Отклонение!"
 trtfor.14.d: "Похоже, что он пошел против наших желаний и не дал нам по праву нашей территории."
 trtfor.14.a: "На войну!"
 trtfor.14.b: "Сначала мы должны подготовиться..."

 trtfor.15.t: "Принимается."
 trtfor.15.d: "Похоже, что он сложился и решил свалиться под наши требования, и земля скоро будет полностью под нашим контролем, и враги будут эвакуировать и выводить войска в этот район."
 trtfor.15.a: "Скоро наша нация снова станет целой."

 trtfor.16.t: "петиции для Мелитены"
 trtfor.16.d: "Похоже, что турки сочли нужным просить нас о том, что они называют, о том, что законная земля в [Рут.Гетнаме], в то время как отдача требованиям [трт. GetNameDef], несомненно, была бы ударом по гордости нашего народа и нашему международному престижу, рискуя войной с [трт. GetNameDef], тоже не идеальна. Что же нам делать?"
 trtfor.16.a: "Эта земля по праву наша!"
 trtfor.16.b: "Дай им никчемную землю."

 trtfor.17.t: "Отклонение!"
 trtfor.17.d: "Похоже, что он пошел против наших желаний и не дал нам по праву нашей территории."
 trtfor.17.a: "Тогда мы вернем нашу землю через войну!"
 trtfor.17.b: "Нам пока не нужна эта земля..."

 trtfor.18.t: "Принимается."
 trtfor.18.d: "Похоже, что он сложился и решил свалиться под наши требования, и земля скоро будет полностью под нашим контролем, и враги будут эвакуировать и выводить войска в этот район."
 trtfor.18.a: "Даже Франция не хочет с нами воевать!"

 turnews.1.t: "Вторжение [ARM.GetName]"
 turnews.1.d: "Разрушение Оттоманской империи многими специалистами было раскритиковано как неустойчивая ситуация, не в последнюю очередь из-за реваншизма, который должен был появиться в позорном Султанате."Armenian Highlands" was given to the titular nation-state, despite much of the region being heavily settled by Ottoman Turks.\n\nThe Ottomans have trumpeted that such "rightful territory" should be under their demesne, demanding the region of Eastern Trabzon from Armenia, while calling for a referendum in Erserum. But the Armenian government has refused the cession of this territory. The order was given from Istanbul for the army to begin an invasion."
 turnews.1.a: "Мы победим!"
 turnews.1.b: "Что это означает для стабильности на Кавказе?"

 turnews.2.t: "Столкновения на границе в Эрзинкане"
 turnews.2.d: "Курдское государство обязано своим существованием разделу Османской империи, и неудивительно, что это сделало их мишенью турецкого реваншизма. Военное наращивание обеих сторон привело к стычкам на границе между Курдистаном и имперским остатком. Оттоманцы утверждают, что смерть их пограничной охраны требует возмездия, в то время как курды обвиняют оттоманов в подстрекательстве к войне. ~ Невзирая на то, какая сторона говорит правду, турки используют этот инцидент в качестве предлога для вторжения в Курдистан с заявленным намерением «восстановить порядок»."
 turnews.2.a: "То, что было потеряно, снова будет нашим!"
 turnews.2.b: "Мы изгоним захватчиков с наших земель!"
 turnews.2.c: "Похоже, турки намерены вернуть то, что когда-то было их."

 turnews.3.t: "Ремилитаризация Стамбула"
 turnews.3.d: "Демилитаризован в мирном договоре, который официально прекратил боевые действия между Кордиалем и Османской империей после Великой войны, Босфорский пролив и сам Стамбул были лишены какого-либо военного присутствия на протяжении более десяти лет. ~ Несмотря на новое правительство, находящееся у власти в [от Гетнаме], они ясно заявили о своей готовности восстановить полный контроль над всей своей территорией, включая Босфорский пролив."
 turnews.3.a: "Никто не помешает нам перебросить войска на нашу территорию!"
 turnews.3.b: "Это просто турки маршируют на свой задний двор..."
