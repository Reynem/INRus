 TRT_opda_idea: "Оттоманское государственное управление долгом"
 TRT_opda_idea_desc: "Прежде всего в состав Совета входят европейские кредиторы, в частности Франция, Великобритания и Италия, Османское государственное управление по задолженности было создано в 1881 году, с тем чтобы получить платежи, которые мы должны перед европейскими державами. В своем нынешнем виде Совет сам является по существу независимой бюрократией в нашей собственной стране, и он полностью укомплектован европейскими государственными должностными лицами. Компании и страны, участвующие в ОРДП, обладают огромным влиянием и властью в Османской империи, при этом многие наши железные дороги и промышленные проекты финансируются самим институтом. Если мы хотим добиться экономической независимости, мы должны переключиться на погашение наших долгов."
 TRT_opda_idea2: "Оттоманское государственное управление долгом"
 TRT_opda_idea2_desc: "Прежде всего в состав Совета входят европейские кредиторы, в частности Франция, Великобритания и Италия, Османское государственное управление по задолженности было создано в 1881 году, с тем чтобы получить платежи, которые мы должны перед европейскими державами. В своем нынешнем виде Совет сам является по существу независимой бюрократией в нашей собственной стране, и он полностью укомплектован европейскими государственными должностными лицами. Компании и страны, участвующие в ОРДП, обладают огромным влиянием и властью в Османской империи, при этом многие наши железные дороги и промышленные проекты финансируются самим институтом. Если мы хотим добиться экономической независимости, мы должны переключиться на погашение наших долгов."
 TRT_political_turmoil: "Политические проблемы"
 TRT_political_turmoil_desc: "С недавним убийством султана, наряду с уже существующими турбулентностью и ростом фракционности внутри страны, мы ввергнуты в политические беспорядки, которые угрожают разрушить и без того хрупкое государство."
