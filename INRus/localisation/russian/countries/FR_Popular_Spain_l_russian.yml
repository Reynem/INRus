 ### Events ###
 socspain.0.t: "Революция в Испании"
 socspain.0.d: "В конце XIX века социализм установился в основном в Испанской социалистической рабочей партии. С тех пор в стране всегда было социалистическое присутствие. Со временем на грани испанской политики было создано больше социалистических движений. После диктатуры Мигеля Примо де Риверы социалисты добились достаточного роста популярности в новой Второй республике. Это свидетельствует о том, что народ не хочет ни королевства, ни либеральной республики. Они хотят социализма. Когда монархисты пытались переворотить правительство - переворот, который привел бы к началу гражданской войны, социалисты сплотились к своему собственному флагу."
 socspain.0.a: "Нет, Пасаран!"

 socspain.1.t: "Каталонский националистический протест"
 socspain.1.d: "С нашей оперативной базой в Барселоне в настоящее время нет ничего удивительного в том, что с каталанцами возникнут некоторые проблемы, хотя большинство из них выступают за революцию, есть те, которые не согласны с нашими целями. Каталонский национализм явно опасен и нуждается в ликвидации."
 socspain.1.a: "Мы покажем им!"

 socspain.2.t: "Международные бригады"
 socspain.2.d: "Недавно «Трид интернэшнл» создал международные бригады — полувоенную группу социалистов из многих стран, которые сейчас прибывают в Испанию для защиты революции."
 socspain.2.a: "Работники мира!"

 socspain.3.t: "Мадрид под нашим контролем"
 socspain.3.d: "Мадрид, столица Испании, попал под наш контроль."
 socspain.3.a: "Да здравствует революция!"

 socspain.4.t: "Севилье под нашим контролем"
 socspain.4.d: "Нам удалось оттолкнуться на юг и захватить город Севилья, который служил базой для монархистских сил в Испании, где они часто получали британскую поддержку через Гибралтар."
 socspain.4.a: "Да здравствует революция!"

 socspain.5.t: "Галиция под нашим контролем"
 socspain.5.d: "Нам удалось оттолкнуть северо-западную часть страны и захватить Галицию, и этот регион стал местом национального восстания в ходе гражданской войны, и с учетом того, что этот район находится под контролем, мы можем сказать, что он добился успеха в обеспечении безопасности северных территорий Испании."
 socspain.5.a: "Да здравствует революция!"

 socspain.6.t: "Падение монархистов!"
 socspain.6.d: "Монархисты и националисты потерпели поражение, нам удалось победить силы, которые пытались восстановить старые и автократические режимы, но пока это победа Испании, наша страна по-прежнему разделена, теперь между республиканцами и социалистами, вскоре вспыхнет конфликт."
 socspain.6.a: "По крайней мере, есть два менее фейерверка."

 socspain.7.t: "Каталанистические антисоциалисты на майский день"
 socspain.7.d: "Похоже, что сегодня празднование для трудящихся и рабочих было переворотом и оккупировано националистическими антисоциалистскими силами Каталонии, и мы должны показать этим регрессивным силам, что происходит с теми, кто угрожает работникам Испании."
 socspain.7.a: "Как они осмеливаются!"

 socspain.8.t: "Конфликт с республиканцами!"
 socspain.8.d: "Соглашение о ненападении между нами и республиканцами было нарушено. Новости о столкновениях на границе вновь привели к конфликту. Пора посмотреть, будет ли Испания республиканским режимом или социалистическим раем."
 socspain.8.a: "Война продолжается"

 socspain.9.t: "Гражданская война окончена!"
 socspain.9.d: "Гражданская война в Испании окончена! после вечных сражений социалисты вышли на вершину, хотя наш успех велик, после этой победы будут трудности."
 socspain.9.a: "Испания снова Юнайтед!"

 socspain.10.t: "Лондонский фондовый рынок поражает Барселону"
 socspain.10.d: "Недавняя катастрофа на фондовом рынке в Лондоне пришла в Испанию, страна уже является плохой формой, когда речь идет о нашей экономике."
 socspain.10.a: "Это то, что приносит капитализм"

 socspain.11.t: "Антиправительственные протесты"
 socspain.11.d: "Многие начали винить социалистическое правительство в их страданиях после Лондонского Крэша."
 socspain.11.a: "Когда наступит мир, будет лучше."

 socspain.12.t: "Лондонский фондовый рынок поражает Испанию"
 socspain.12.d: "Недавняя катастрофа на фондовом рынке в Лондоне пришла в Испанию, страна уже является плохой формой, когда речь идет о нашей экономике."
 socspain.12.a: "Мы молимся, чтобы это не разорвало Испанию"

 socspain.13.t: "Растущий конфликт в Движении"
 socspain.13.d: "Поступили сообщения, информирующие нас о росте насилия между анархистами и коммунистами в Испании. Разошлись мнения о том, как следует управлять страной. Анархисты утверждают, что коммунисты хуже, чем монархисты, в то время как многие коммунисты считают анархистов предателями социализма за их сопротивление Советскому Союзу. Как мы будем действовать?"
 socspain.13.a: "На стороне коммунистов против анархистов!"
 socspain.13.b: "Не выбирай ни одну сторону!"
 socspain.13.c: "Разъясни коммунистам!"

 # Focus Tree Events #

 socspain.100.t: "Кампания по набору кадров в Социалистической Испании"
 socspain.100.d: "Пропаганда вербовки на территориях, находящихся под нашим контролем, кажется, работает, и новые мужчины предлагают свои услуги силам социалистической революции."
 socspain.100.a: "Спасибо за ваше участие."

 socspain.101.t: "Армия вновь сохранила верность"
 socspain.101.d: "Полковники в армии, которые в прошлом были даже немного антисоциалистами, были либо арестованы, либо убиты, либо депортированы."
 socspain.101.a: "Да здравствует революция!"

 socspain.102.t: "Конгресс революционеров"
 socspain.102.d: "С возвращением стабильности правящие партии в ходе этой революции, умеренные социалистические ПСОП и радикальные анархо-синдикалисты КНТ-ФАИ, оказывали давление на правительство, с тем чтобы оно создало конгресс, в котором могли бы быть представлены все фракции, хотя это могло бы улучшить отношения между группировками, мы опасаемся, что с этим новым конгрессом другие группировки попытаются отнять у нас власть."
 socspain.102.a: "Мы увидим, что происходит."

 socspain.103.t: "Сообщения о новых конфликтах на улицах"
 socspain.103.d: "В последнее время стало поступать все больше сообщений о столкновениях между анархистами и коммунистами на улицах Мадрида, Барселоны и других городов страны."
 socspain.103.a: "Контактный сотрудник по вопросам сотрудничества"
 socspain.103.b: "Планируйте нападение на КНТ-ФАИ"

 socspain.104.t: "ОЗОС соглашается сотрудничать"
 socspain.104.d: "После нескольких часов тайной встречи лидеры умеренного социалистического PSOE согласились сотрудничать с правительством PCE. Хотя наше сотрудничество не может быть замечено анархо-синдикалистами, со временем мы сможем обеспечить будущее и революцию Испании вместе."
 socspain.104.a: "Счастлив прийти к соглашению"

 socspain.105.t: "Марш анархо-синдикалиста"
 socspain.105.d: "Сегодня многие люди под знаменем анархо-синдикалиста CNT-FAI начали маршировать в столице Мадрида, протестуя против нынешней системы управления и правящей Коммунистической партии. Хотя большинство из них безоружны, многие из них вооружены. Полиция заявила, что это может быть идеальной уловкой для того, чтобы начать наше неожиданное нападение."
 socspain.105.a: "Уничтожить их контрреволюционный марш!"
 socspain.105.b: "Готовьтесь арестовать тех, кто нарушает закон, больше ничего."

 socspain.106.t: "PSOE меняет стороны"
 socspain.106.d: "Социалисты-предатели из ПСОП изменили стороны в этом конфликте, который произошел между правительством ПСВ и анархо-синдикалистами КНТ-ФАИ. После вчерашней уличной расправы мы начали терять многих союзников и сторонников. Ходят даже слухи, что часть военных повернется против нас. Это действительно удар по нашей легитимности."
 socspain.106.a: "Как они осмеливаются!"

 socspain.107.t: "Армия швыряет здания правительства"
 socspain.107.d: "Армия присоединилась к социалистическому ПСОП и анархо-синдикалистам КНТ-ФАИ. Сегодня они вошли в конгресс и арестовали его членов, после чего правительственные здания подверглись штурму, в результате чего многие министры были арестованы."
 socspain.107.a: "-- Джосе Диас Рамос, вы арестованы!"

 socspain.108.t: "Последней магии"
 socspain.108.d: "В то время как правительство ПСЕ находится в неволе, ПСО и КНТ-ФАИ победили, конгресс проводит голосование по вопросу о том, по какому пути пойдет страна. Вероятно, остальные члены конгресса будут разделены на группы, которые будут поддерживать управление страной. Партия Испанского социалистического рабочего является более умеренной, чем КНТ-ФАИ, но также немного более авторитарной. С другой стороны, Национальная конфедерация труда и их союзники в Федерации иберианских анархистов являются более радикальными, чем ПСО, считая как авторитарные права, так и авторитарные левые врагами реальной революции."
 socspain.108.a: "Конгресс в восторге от правительства ПИО!"
 socspain.108.b: "Конгресс в восторге от правительства CNT-FAI!"

 socspain.109.t: "Глава нашего правительства"
 socspain.109.d: "Сейчас, когда социалистический PSOE контролирует страну, настало время выяснить, кто будет главой этого нового правительства, или лидером партии Франсиско Ларго Кабальеро, или умеренным Хуаном Негрином и Лопесом."
 socspain.109.a: "Лидер партии Кабальеро"
 socspain.109.b: "Умеренный негр"

 socspain.110.t: "Глава конгресса КНТ-ФАИ"
 socspain.110.d: "С CNT-FAI, контролирующим страну, пришло время выбрать, кто будет главой нового Конгресса CNT-FAI."
 socspain.110.a: "Анархист Оливер"
 socspain.110.b: "Пестанья - синдикалист"

 socspain.111.t: "Собрать мартовские войска КНТ-ФАИ"
 socspain.111.d: "В то время как наши люди стояли на марше, готовые арестовать тех, кто создает проблемы, все больше и больше вооруженных людей начали появляться, причем некоторые даже несли дополнительное оружие, с тем чтобы дать его другим анархо-синдикалистам, теперь полиция вынуждена реагировать на эту угрозу, чтобы предотвратить ее превращение в массовую расправу, и мы должны показать им, что они зашли слишком далеко."
 socspain.111.a: "Теперь они зашли слишком далеко!"

 socspain.112.t: "Стабильность возвращается после жертв"
 socspain.112.d: "С очищением от анархо-синдикалиста КНТ-ФАИ в основных городах Испании началась стабилизация, и полиция и многие преданные им военизированные группы ПСЕ сообщили, что они раскрыли укрытия многих анархо-синдикалистских военизированных групп и дали им пулю. Революция может быть спасена от радикалов в КНТ-ФАИ в конце концов."
 socspain.112.a: "Это хорошее развитие"

 socspain.113.t: "PCE Контроль за строениями"
 socspain.113.d: "С анархо-синдикалистами CNT-FAI и умеренным социалистическим PSOE, остающимся безмолвным, кажется, что власть правительства над Испанией сильна. Есть даже люди в PSOE, которые убеждаются перейти к нашему движению. Наконец, мы можем обеспечить социалистическую революцию внутри Испании!"
 socspain.113.a: "Да здравствует социализм! Да здравствует революция!"

 socspain.114.t: "Против анархо-синдикалистов"
 socspain.114.d: "После долгих часов встреч между правительством и армией был разработан план с сильным потенциалом для работы, который поможет нам искоренить и казнить лидеров анархо-синдикалистов с военной операцией в домах и на улицах. Хотя это может не совпадать с умеренным социалистическим ПСОП, мы можем сообщить им об этом заранее, если мы пожелаем."
 socspain.114.a: "Включай!"

 socspain.115.t: "Насилие разрушает улицы"
 socspain.115.d: "По мере того, как солдаты проникают в дома и улицы в городах Испании, начинается насилие, после того как анархист-синдикалист напал на полицейского эскадрилью с ножом, полиция стала использовать более жестокие меры воздействия при обыске домов и захвате заключенных, а анархо-синдикалисты в конгрессе были помещены под домашний арест, причем некоторые из них открыто выступают против насильственных мер, принимаемых нашей полицией и военными."
 socspain.115.a: "Мы разрушим анархистский отброс!"

 socspain.116.t: "Оппозиция PSOE"
 socspain.116.d: "С анархо-синдикалистами CNT-FAI в грязи, теперь остается только одна фракция, которая имеет шанс выступить против нас: умеренный социалистический PSOE."
 socspain.116.a: "Нам нужно удалить всех контрреволюционеров"
 socspain.116.b: "Нам нужно возобновить наши отношения"

 socspain.117.t: "Альянс PSOE - CNT-FAI"
 socspain.117.d: "Был заключен союз между PSOE и CNT-FAI, что может означать падение PCE."
 socspain.117.a: "Это может означать наше падение"

 socspain.118.t: "Соглашение о ПВО - ПСЕ"
 socspain.118.d: "Было достигнуто соглашение между ПСО и ПСЕ, которое, как мы надеемся, приведет к прекращению внутреннего конфликта."
 socspain.118.a: "Это предложение приведет к победе"

 socspain.119.t: "Конгресс приступает к избранию нового Председателя"
 socspain.119.d: "В настоящее время Конгресс принимает решение о том, кто будет новым председателем Испании и преемником испанского социализма. Это может занять всего несколько дней или неделю, или может продолжаться до следующего года. Несмотря на то, что нынешний председатель Хосе Диас Рамос стал скорее временным, чем настоящим председателем. Но он является одним из тех, кто выдвинулся за то, чтобы привести Испанию в будущее. Еще одним кандидатом на пост председателя, или председателем в данном случае, является Долорес Ибаррури, известная как Странный цветок. Она и Рамос придерживаются многих аналогичных взглядов, обе из которых относятся к ленинистскому социализму. Но есть те, кто видит потенциального председателя Ибарури как признак равенства мужчин и женщин в стране. Юноша Хосе Цорла Море является еще одним кандидатом, который встал на ринг. Он, вероятно, был безжалостным в сординации или подрывной деятельности, и он в целом не любит троцких и правых."
 socspain.119.a: "Пусть начнётся!"

 socspain.120.t: "Кандидаты представляют самих себя"
 socspain.120.d: "Кандидаты, заявившие о своей заинтересованности в том, чтобы стать следующим Председателем, собрались сегодня перед конгрессом и выразили свое мнение о будущем. Рамос и Ибарури сосредоточили внимание на мечте о социалистическом ленинском государстве. Море выступал за социалистическое движение, которое является национальным и предоставляет стране силу. Маурин изложил видение социализма с новой экономической политикой и марксистским плюрализмом. Перес выступил за постоянную революцию и поддержал пролетариалистский интернационализм."
 socspain.120.a: "Идеи Рамоса нашли дом в Конгрессе..."
 socspain.120.b: "..но Ибаррури назвал их лучшими"
 socspain.120.c: "Вообще-то им нравилась беспощадность Мора."
 socspain.120.e: "Подход Маурина к марксистскому плюрализму сработал"
 socspain.120.f: "Нин Перес напомнил им, что революция является международной"

 socspain.121.t: "Наш международный фокус"
 socspain.121.d: "Один из способов выяснить, кто станет председателем, это то, что Конгресс выслушает предложения кандидатов на будущее, которые сегодня представляют свои взгляды на международную и внешнюю политику."
 socspain.121.a: "Рамос и Ибарури объединились за советское сотрудничество"
 socspain.121.b: "Море хотела сильной нации, чтобы защитить революцию"
 socspain.121.c: "Маурин отверг советское сотрудничество"
 socspain.121.e: "Нин Перес хотел распространить революцию на международном уровне"

 socspain.122.t: "Наше внимание к обществу"
 socspain.122.d: "Испанское общество страдает недостатками и имеет множество взглядов на то, как лучше исправить это положение, и ожидается, что кандидаты будут иметь представление о том, как сделать Испанию лучше, либо с помощью более прогрессивных, либо более консервативных мер. Гендерное и расовое равенство также является важной темой для некоторых членов нашей партии."
 socspain.122.a: "Рамос обещает некоторые прогрессивные реформы"
 socspain.122.b: "Интерес к гендерному равенству"
 socspain.122.c: "Мора подтверждает «новые» традиционные ценности"
 socspain.122.e: "Маурин говорит, что социальный прогресс происходит с плюрализмом."
 socspain.122.f: "Нин Перес обещает социальную революцию"

 socspain.123.t: "Наша экономическая направленность"
 socspain.123.d: "Социализм - это не только социальное движение, но и экономическая система."
 socspain.123.a: "Рамос и Ибарури поддерживают новые земельные реформы"
 socspain.123.b: "Поддержка объединения и централизованного планирования Мори голос"
 socspain.123.c: "Маурин хочет "новую экономическую политику""
 socspain.123.e: "Нин Перес извлекает пользу из экономики, которая продлит революцию"

 socspain.124.t: "Альянс Рамоса и Ибаррури"
 socspain.124.d: "Хосе Диас Рамос и Долорес Ибаррури согласились работать вместе, причем оба они должны стать следующим Председателем/председателем Испании, поскольку они видят, что их цели не столь отличаются друг от друга и готовы поддерживать друг друга."
 socspain.124.a: "Хосе Диас Рамос!"
 socspain.124.b: "Долорес Ибарури!"

 socspain.125.t: "Хосе Диас Рамос объявлен председателем!"
 socspain.125.d: "Хосе Диас Рамос одержал победу в Конгрессе, и сегодня большинство его членов проголосовали за него в качестве Председателя."
 socspain.125.a: "Вива-эль-президент!"

 socspain.126.t: "Долорес Ибарури объявлена председателем!"
 socspain.126.d: "Долорес Ибарури победила в Конгрессе, и сегодня она была избрана председателем большинством его членов."
 socspain.126.a: "Вива-ла-Президента!"

 socspain.127.t: "Подъём Рамоса в популярности"
 socspain.127.d: "Хосе Диас Рамос все больше и больше пользуется популярностью в Конгрессе и даже на улицах Испании, и весьма вероятно, что Конгресс изберет его Председателем."
 socspain.127.a: "Выглядит хорошо для Него"

 socspain.128.t: ""Ла Пайезария" Имейте хороший шанс"
 socspain.128.d: "Долорес Ибарури все больше и больше пользуется популярностью не только среди народа, но и среди многих в Конгрессе."
 socspain.128.a: "Выглядит хорошо для неё."

 socspain.129.t: "Хосе Казорла Море, кажется, становится более популярным"
 socspain.129.d: "Похоже, что Хосе Казорла Море имеет большой шанс стать следующим председателем, так как его популярность возросла в Конгрессе и на улицах, но, хотя он не троцкист, его идеология рассматривается многими революционерами как опасная."
 socspain.129.a: "Если он выиграет, это будет справедливо!"
 socspain.129.b: "Он - потенциальная опасность!"

 socspain.130.t: "Хосе Казорла Море объявлен председателем!"
 socspain.130.d: "Хосе Казорла Море одержал победу в Конгрессе, и сегодня большинство его членов проголосовали за него в качестве Председателя."
 socspain.130.a: "Вива-эль-президент!"

 socspain.131.t: "Военный конгресс"
 socspain.131.d: "Вооруженные силы Испании, возглавляемые генералом Хуаном Модесто, вступили в конгресс, объявив о своей недействительности. Модесто сделал себя лидером страны, и будет принято военное решение о том, кто станет следующим председателем Испании."
 socspain.131.a: "Это ради безопасности революции."

 socspain.132.t: "Молодые социалисты сражаются за Море"
 socspain.132.d: "Многие молодые и вооруженные социалисты восстали в поддержку Хосе Казорлы Море, и значительная часть Мадрида уже находится под их контролем."
 socspain.132.a: "Мы управляемся, чтобы держаться!"
 socspain.132.b: "Их слишком много!"

 socspain.133.t: "Хосе Казорла Море объявлен председателем!"
 socspain.133.d: "В связи с провалом военного переворота из-за смелых молодых солдат революции Хосе Казорла Море наконец может быть объявлен новым президентом Испании, что станет новой зарию для испанской нации, а новый Председатель ясно, что те, кто пытался остановить его приход к власти, не выживут в его новой Испании."
 socspain.133.a: "Вива-эль-президент!"

 socspain.134.t: "Военная власть к Рамусу"
 socspain.134.d: "В то время как военным удалось спасти Испанию от Мора и его сторонников, пришло время вернуть власть Хосе Диасу Рамосу, хотя многие не согласны с тем, чтобы стать президентом Рамоса, это истинный путь, путь к ленинистскому социализму на Иберианском пеннинсуле, и мы надеемся, что нам больше не придется иметь дело с Море."
 socspain.134.a: "Вива-эль-президент!"

 socspain.135.t: "Победа Хоакина Маурина"
 socspain.135.d: "Хоакин Маурин стал более популярным в Конгрессе, его более либертарианские и правые позиции во многом поддержали его, хотя некоторые из них все еще считают, что он опасен для социализма с его правыми взглядами, он не рассматривается как прямая угроза."
 socspain.135.a: "Его послание кажется, чтобы получить трэкшн"

 socspain.136.t: "Хоакин Маурин объявлен председателем!"
 socspain.136.d: "Хоакин Маурин одержал победу в Конгрессе, и сегодня он был избран на пост Председателя большинством его членов."
 socspain.136.a: "Вива-эль-президент!"

 socspain.137.t: "Троцкая популярность"
 socspain.137.d: "Андрес Нин Перес, кажется, все больше и больше шансов победить. Популярность троцкиста возросла, и многие боятся того, что может случиться, если его впустят к власти. Теперь у нас есть возможность принять меры и свергнуть его, чтобы избежать такой возможности."
 socspain.137.a: "Троцкий не так уж и плох."
 socspain.137.b: "Позвони военным!"

 socspain.138.t: "Андрес Нин Перес объявлен председателем!"
 socspain.138.d: "Андрес Нин Перес одержал победу в Конгрессе, и сегодня большинство его членов проголосовали за него в качестве Председателя. Нин Перес обещала продолжить революцию, сделать ее постоянной и сосредоточить внимание на распространении ее среди других стран мира либо мирным путем, либо силой."
 socspain.138.a: "Вива-эль-президент!"

 socspain.139.d: "В то время как военным удалось спасти Испанию от Нин Переса и его сторонников, настало время вернуть власть Хосе Диасу Рамосу, хотя многие не согласны с тем, чтобы стать председателем Рамоса, это истинный путь, путь к ленинистскому социализму на Иберийской пеннинсуле, и мы надеемся, что нам больше не придется иметь дело с Нином Пересом."
 socspain.139.a: "Вернуться в путь"

 socspain.150.t: "Испания хочет присоединиться к третьей международной организации"
 socspain.150.d: "Наши социалистические друзья в Испании направили к нам посланников, желающих присоединиться к Международной организации, которые стали частью глобальной борьбы за социализм и свободу, хотя некоторые министры в нашем правительстве видят возможность принять их, другие министры более осторожны, утверждая, что это может спровоцировать нежелательную агрессию со стороны капиталистических стран Европы."
 socspain.150.a: "Их приветствуют!"
 socspain.150.b: "Простите, но нет"

 socspain.151.t: "Советы принимают нас в Интернационал"
 socspain.151.d: "К счастью, наши советские товарищи приняли нас в Интернационал, вместе мы сможем расширить Революцию как в Испании, так и на всем европейском континенте!"
 socspain.151.a: "Испания и СССР будут сражаться вместе!"

 socspain.152.t: "Советы отвергают наше вступление в международные организации"
 socspain.152.d: "Мы ответили на просьбу, которую мы направили в Советский Союз. К сожалению, они отвергли нас. Хотя мы пытались утверждать, что это шаг назад для глобальной революции, они решительно отвергли их. Однако наше правительство рассматривает это как свою потерю."
 socspain.152.a: "Это - их убыток."

 socspain.153.t: "Приветствие Москве"
 socspain.153.d: "Связи между испанскими социалистами и Советским Союзом очевидны для всех: обе страны, где эксплуатируемые рабочие восстали против капиталистов и победили. Мы стоим перед нашими врагами, капиталистами, валькистами, империалистами. Это связывает нас как с политическими, так и с врагами наших врагов."
 socspain.153.a: "Ради революции"

 socspain.160.t: "Растет международное признание"
 socspain.160.d: "В мире растет признание нашего режима, и хотя он все еще довольно низок, приятно знать, что есть те, кто знает, что мы истинное правительство Испании."
 socspain.160.a: "Да здравствует Испания!"

 socspain.161.d: "В мире растет признание нашего режима, и все больше людей, стран и организаций признают нашу легитимность, и это несколько облегчает ситуацию, и все же многие не признают подлинное правительство Испании."

 socspain.162.d: "В мире растет признание нашего режима, хотя большинство иностранных государств признают нас, некоторые из них все еще нас не признают, по крайней мере, мы можем сказать, что большинство стран действительно видят в нас подлинное правительство Испании."

 socspain.163.d: "Сейчас только те, кто решительно поддерживает другие группировки и решительно выступает против нас, не признают нас."

 socspain.165.t: "Признание международной торговли"
 socspain.165.d: "Есть страны, которые не признают нас в качестве подлинного и законного правительства Испании, но с ростом торговой торговли и экспорта мы видим, что страны, которые ранее держались подальше от нас, обращаются к нам как к новому торговому партнеру, что, по сути, укрепляет международное признание нас."
 socspain.165.a: "С торговлей приходит рост"

