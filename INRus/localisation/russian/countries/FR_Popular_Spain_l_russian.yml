 SPA_strengthen_soviet_ties_flag: "Сильные связи с Советским Союзом"

 SPA_foreign_policy: "Внешняя политика испанской Республики"
 SPA_foreign_policy_desc: "С падением наших буржуазных оппонентов в гражданской войне победившая социалистическая §Y Испанская Республика §! должна найти свое новое место в мире. Не все страны и правительства признают нас законным правительством Испании."

 SPA_join_3rd_international: "Присоединяйтесь к третьей международной организации"
 SPA_join_3rd_international_desc: "На протяжении всей гражданской войны наши революционные друзья приходили из Советского Третьего Интернационала. Советы всегда были друзьями социалистических групп в Испании на протяжении последних 20 лет. Мы должны отплатить им за поддержку международной революции, присоединившись к ним в Интернационале."
