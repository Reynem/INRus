 SPA_ramos_elected_tooltip: "§g избран председателем Испании, теперь будет открыта его деревянная ветвь! §!"
 SPA_ibarruri_elected_tooltip: "§g избрана председателем Испании. Её ветвь сосредоточенного дерева откроется.§!"
