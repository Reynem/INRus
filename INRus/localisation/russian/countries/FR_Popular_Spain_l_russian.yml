 ### National Spirits ###
 SPA_disunity_among_left_idea: "Разногласия между левыми"
 SPA_disunity_among_left_idea_desc: "Испанское левое крыло вовсе не является единой силой. В своем нынешнем состоянии правящая ПСЕ должна враждовать как с ПСО, так и с КНТ-ФАИ, чтобы оставаться в командовании. Хотя наиболее популярным ответом является сохранение единой коалиции, многие предполагают, что только одна фракция может править страной, а другие отстраняются от власти."
 SPA_opposing_militia_groups_idea: "Противостоящие группы боевиков"
 SPA_opposing_militia_groups_idea_desc: "Есть много военизированных группировок, борющихся за социалистическое дело, но многие из них не являются прямо верными нашему правлению, многие анархо-синдикалисты, особенно те из них, которые будут создавать для нас как военную, так и политическую проблему."
 SPA_organize_socialist_forces_idea: "Противостоящие группы боевиков"
 SPA_remove_outside_influences_army_idea: "Верность армии"
 SPA_remove_outside_influences_army_idea_desc: "Несмотря на то, что по-прежнему существуют вооруженные формирования, действующие независимо друг от друга, те, кто лоялен правительству, смогли объединиться в лояльную армию."
