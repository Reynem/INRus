 SPA_recruitment_drive_desc: "Важную роль в этом деле будет играть активизация усилий по набору персонала."
 SPA_civil_war_offensive_planning: "Планирование наступательных действий в ходе гражданской войны"
 SPA_civil_war_offensive_planning_desc: "Социалистические силы не готовы к наступательным действиям, которые требует гражданская война такого размера."
 SPA_provide_proper_army_transport: "Обеспечение надлежащего военного транспорта"
 SPA_provide_proper_army_transport_desc: "Поскольку страна разделена, трудно обеспечить доставку товаров и оружия на фронт, и это необходимо сделать, если мы хотим, чтобы армия была на продвинутом этапе."
 SPA_military_armament: "Военное оружие"
 SPA_military_armament_desc: "Мы должны вооружить наших военных до зубов, если хотим выжить против наших врагов."
 SPA_reeinforce_aragon_lines: "Закрепить арагонские линии"
 SPA_reeinforce_aragon_lines_desc: ""
 SPA_peace_in_south: "Мир на юге"
 SPA_peace_in_south_desc: ""
 SPA_pasify_northern_resistance: "Усилить сопротивление севера"
 SPA_pasify_northern_resistance_desc: ""
 SPA_revolutionaries_of_madrid: "Революционеры Мадрида"
 SPA_revolutionaries_of_madrid_desc: ""
 SPA_spain_socialist_revolutionary: "Испания, социалисты и революционеры"
 SPA_spain_socialist_revolutionary_desc: "С победой революции мы можем начать реконструировать нашу гордую и прекрасную нацию под знаменем социализма!"

 SPA_spanish_peoples_navy: "Испанский народный флот"
 SPA_spanish_peoples_navy_desc: "Если мы хотим соревноваться с другими западными державами на мировой арене, одним из первых шагов, которые мы должны предпринять, является восстановление его прежней мощи."
 SPA_expand_dockyards: "Расширить докьярды"
 SPA_expand_dockyards_desc: "Расширение наших верфей крайне важно для строительства и причала большего числа кораблей."
 SPA_assure_naval_merchant_ties: "Морские торговцы"
 SPA_assure_naval_merchant_ties_desc: "Наши морские торговцы являются жизненно важным активом нашего флота."
 SPA_modernize_destroyers: "Модернизация разрушителей"
 SPA_modernize_destroyers_desc: "Модернизация наших эсминцев уже давно устарела и является важным аспектом совершенствования нашего флота."
 SPA_rule_seas: "Повелевать морями"
 SPA_rule_seas_desc: "У нашего флота должны быть средства и способность управлять морями с абсолютным превосходством."
 SPA_hit_and_run: "Удар и беги"
 SPA_hit_and_run_desc: "Наш флот не может править морями с превосходством, он должен полагаться на ударные нападения вместо того, чтобы нарушать вражеские линии."
 SPA_new_spanish_flagship: "Новые испанские флаги"
 SPA_new_spanish_flagship_desc: "Новые испанские флаги станут украшением нашего нового флота."
 SPA_fund_submarine_research: "Фонд по исследованию подводных лодок"
 SPA_fund_submarine_research_desc: "Подводные лодки будут одним из ключевых элементов нашего военно-морского фонда."
 SPA_light_ship_models: "Модели легких судов"
 SPA_light_ship_models_desc: "Для того чтобы усовершенствовать наш флот, мы должны сосредоточиться на совершенствовании наших легких судов."
 SPA_heavier_cruiser_models: "Тяжелые крестовые модели"
 SPA_heavier_cruiser_models_desc: "Для того чтобы улучшить наш флот, мы должны сосредоточиться на совершенствовании наших тяжелых крейсеров."
 SPA_invest_coast_guard: "Инвестировать в береговую охрану"
 SPA_invest_coast_guard_desc: "Наша береговая охрана уже располагает инфраструктурой, необходимой для нашего великого флота."
 SPA_spanish_naval_doctrines: "Испанские военно-морские доктрины"
 SPA_spanish_naval_doctrines_desc: "Мы должны сосредоточиться на разработке доктрины, которой должны следовать наши военно-морские силы, с тем чтобы отделиться от остального мира и гарантировать победу."

 SPA_spanish_peoples_air_force: "Испанские народные военно-воздушные силы"
 SPA_spanish_peoples_air_force_desc: "Испания должна иметь новые военно-воздушные силы, чтобы соответствовать своему новому правительству, мы должны немедленно начать инвестировать в воздушное превосходство над нашими соседями."
 SPA_expand_barcelona_air_fields: "Расширить военно-воздушные поля Барселоны"
 SPA_expand_barcelona_air_fields_desc: "Воздушные поля служат фундаментом для любых военно-воздушных сил."
 SPA_interservice_cooperation: "Интерсервисное сотрудничество"
 SPA_interservice_cooperation_desc: "Сотрудничество между ветвями нашей армии имеет важнейшее значение для создания действующих военно-воздушных сил."
 SPA_invest_naval_fighters: "Инвестирование в военно-морских истребителей"
 SPA_invest_naval_fighters_desc: "Военно-морские бойцы могут быть разницей между победой и поражением в открытом море."
 SPA_invest_close_land_fighters: "Инвестируйте в скрытых борцов с землей"
 SPA_invest_close_land_fighters_desc: "Близкие сухопутные борцы могут быть разницей между победой и поражением в крупных сражениях с землей."
 SPA_modernize_old_planes: "Модернизация старых самолётов"
 SPA_modernize_old_planes_desc: "Не все в наших новых военно-воздушных силах должно быть построено с нуля."
 SPA_aggresive_air_force: "Агрессивные военно-воздушные силы"
 SPA_aggresive_air_force_desc: "Наши военно-воздушные силы должны быть агрессивными в бою, особенно когда речь идет о разрушении инфраструктуры противника."
 SPA_strategic_bomber_efforts: "Стратегические бомбардировщики"
 SPA_strategic_bomber_efforts_desc: "Наши военно-воздушные силы должны содержать стратегических бомбардировщиков, предназначенных для уничтожения инфраструктуры противника и посевов хаоса среди своих рядов."
 SPA_defensive_air_force: "Оборонительные военно-воздушные силы"
 SPA_defensive_air_force_desc: "Наши военно-воздушные силы должны защищаться в бою, особенно когда речь идет о защите наших войск на местах."
 SPA_interception_tactic_efforts: "Технологические усилия перехвата"
 SPA_interception_tactic_efforts_desc: "Наши военно-воздушные силы должны уделять приоритетное внимание тактике перехвата, разработанной для уничтожения вражеских самолетов, прежде чем они смогут уничтожить наши наземные силы."
 SPA_spanish_airial_doctrines: "Испанские авиационные доктрины"
 SPA_spanish_airial_doctrines_desc: "Мы должны сосредоточиться на разработке доктрины, которой должны следовать наши военно-воздушные силы, с тем чтобы отделить себя от остального мира и гарантировать победу."

 SPA_spanish_peoples_army: "Испанская народная армия"
 SPA_spanish_peoples_army_desc: "Наша новая страна нуждается в армии, чтобы сравняться с ней и сохранить ее в безопасности, и только воссоздать и реформировать то, что у нас есть, мы сможем восстановить свою славу до гражданской войны."
 SPA_remove_outside_influences_army: "Удалить внешнее влияние из армии"
 SPA_remove_outside_influences_army_desc: "Для того чтобы наша армия могла функционировать хорошо, она должна быть в первую очередь лояльной Испании, и мы должны работать над тем, чтобы исключить иностранное влияние из ее рядов, чтобы гарантировать ее верность."
 SPA_basic_equipment_research: "Исследования в области основного оборудования"
 SPA_basic_equipment_research_desc: "Несмотря на гражданскую войну, мы не можем допустить, чтобы наши военные технологии отставали от технологий наших соперников."
 SPA_mobilize_spanish_army: "Мобилизовать испанскую армию"
 SPA_mobilize_spanish_army_desc: "Испанская армия по-прежнему очень плохо организована, и важно, чтобы мы вели ее на полную мощность и набирали как можно больше людей, чтобы заполнить ее ряды."
 SPA_invest_armour_research: "Инвестирование в исследования армора"
 SPA_invest_armour_research_desc: "Хотя когда-то кавалерия могла быть ключом к победе в битвах, теперь победа заключается в танках и бронированных автомобилях."
 SPA_let_fire_rain: "Пусть дождь будет огнём."
 SPA_let_fire_rain_desc: "Артиллерия всегда была важным аспектом любой западной армии."
 SPA_counter_air: "Противодействие воздуху"
 SPA_counter_air_desc: "В других странах есть военно-воздушные силы, которые намного превосходят наши собственные."
 SPA_planning_and_numbers: "Планирование и число"
 SPA_planning_and_numbers_desc: "Для победы в битвах и войнах необходимо планирование, и выделение части нашего общего персонала на разработку планов боевых действий поможет нам в будущем."
 SPA_new_general_staff: "Новый генеральный штаб"
 SPA_new_general_staff_desc: "Старый генеральный штаб испанской армии был слабым, нескоординированным и неэффективным."
 SPA_special_unit_efforts: "Специальные подразделения"
 SPA_special_unit_efforts_desc: "Концентрация на специальных подразделениях — это хороший способ диверсифицировать нашу армию и обеспечить, чтобы мы могли справиться с любой ситуацией, которая нам не под силу."
 SPA_support_brigades: "Вспомогательные бригады"
 SPA_support_brigades_desc: "Бригады поддержки так же важны для нашей армии, как и боевые люди."
 SPA_armada_of_tanks: "Арма танка"
 SPA_armada_of_tanks_desc: "С учетом того, что сейчас западные армии имеют броню будущего, крайне важно, чтобы мы создали нашу собственную армаду танков, с тем чтобы мы не отставали от наших соседей."
 SPA_mobile_artillary_efforts: "Мобильная артиллерия"
 SPA_mobile_artillary_efforts_desc: "Артиллерия всегда была эффективной в борьбе с противостоящими армиями, но сделать ее мобильной является важным следующим шагом в достижении и превосхождении превосходства других европейских армий."
 SPA_rifle_for_soldiers: "Винтовки для солдат"
 SPA_rifle_for_soldiers_desc: "Мы должны производить винтовки массово, если хотим создать новую и развитую испанскую армию."
 SPA_spanish_army_doctrines: "Доктрины испанской армии"
 SPA_spanish_army_doctrines_desc: "Мы должны сосредоточиться на разработке доктрины, которой должна следовать наша армия, с тем чтобы отделить себя от остального мира и гарантировать победу."

 SPA_recover_from_capitalism: "Возвращение из капитализма"
 SPA_recover_from_capitalism_desc: "Капитализм оставил Испании ужасные шрамы, и мы должны работать над тем, чтобы оправиться от его зла и создать общество, которое было бы верным и справедливым для всех людей."
 SPA_agricultural_revival: "Возрождение сельского хозяйства"
 SPA_agricultural_revival_desc: "Наш сельскохозяйственный сектор переживает длительный и трудный спад, и настало время возродить его и восстановить его значимость в новой Испании на благо всех."
 SPA_nationalize_industries: "Национализация промышленности"
 SPA_nationalize_industries_desc: "Национализация промышленности по всей Испании является самым быстрым и оптимальным способом создания подлинно справедливого и социалистического общества."
 SPA_higher_rations: "Увеличение пайки"
 SPA_higher_rations_desc: "Хотя пайки были важны в начале гражданской войны, у нас нет иного выбора, кроме как увеличить ассигнования для каждого гражданина во имя здоровья и безопасности населения."
 SPA_recovery_for_farmers: "Восстановление для фермеров"
 SPA_recovery_for_farmers_desc: "Наш трудящийся сельскохозяйственный сектор нуждается в поддержке со стороны фермеров, которые, в свою очередь, нуждаются в нашей поддержке."
 SPA_recovery_for_workers: "Возвращение трудящихся"
 SPA_recovery_for_workers_desc: "Наш трудящийся промышленный сектор нуждается в поддержке со стороны своих работников, которые, в свою очередь, нуждаются в нашей поддержке."
 SPA_nationalize_mineral_industry: "Национализация горнодобывающей промышленности"
 SPA_nationalize_mineral_industry_desc: "Важно, чтобы мы взяли на себя горнодобывающую промышленность, слишком важно для нашего экспорта и обороны, чтобы оставить ее в руках частных или иностранных подрядчиков."
 SPA_disregard_capitalist_loans: "Непривилегированные капитальные займы"
 SPA_disregard_capitalist_loans_desc: "Займы, которые были взяты в рамках капиталистической системы, не имеют никакого веса в современном новом обществе."
 SPA_end_private_banks: "Конец частным банкам"
 SPA_end_private_banks_desc: "Частные банки уже давно охотятся на слабых и невинных."

 SPA_first_four_year_plan: "Первый четырехлетний план"
 SPA_first_four_year_plan_desc: "Истинной основой народной экономики является четырехлетний план, направленный на обеспечение того, чтобы каждый из ее секторов работал именно так, как это необходимо для обеспечения процветания населения."
 SPA_anarcho_syndicalist_economy: "Анархо-синдикалистская экономика"
 SPA_anarcho_syndicalist_economy_desc: "Наша экономика должна определяться нашей идеологией. Слишком долго Испания подписывалась на капиталистический путь. Теперь уже давно мы переходим к истинной экономике анархо-синдикалистов."
 SPA_industrialization_drive: "Индустриализация"
 SPA_industrialization_drive_desc: "Для того, чтобы сделать Испанию для народа, важно, чтобы у нас было достаточно промышленной энергии, чтобы поддержать ее."
 SPA_industrialize_rural_spain: "Промышленное развитие сельских районов Испании"
 SPA_industrialize_rural_spain_desc: "Сельская Испания давно отстает от остальной части страны в промышленности."
 SPA_armouries_revolution: "Армия революции"
 SPA_armouries_revolution_desc: "У Революции всегда будут враги, которые стремятся уничтожить ее."
 SPA_working_women: "Работающие женщины"
 SPA_working_women_desc: "Нет никаких причин для того, чтобы женщины были исключены из рабочей силы, а предоставление им возможностей и рабочих мест имеет смысл."
 SPA_work_for_workers: "Труд трудящихся"
 SPA_work_for_workers_desc: "Мы должны обеспечить работу для всего народа Испании, снизить уровень безработицы и обеспечить всем людям равные возможности для пропаганды."
 SPA_agrarian_cooperation: "Аграрное сотрудничество"
 SPA_agrarian_cooperation_desc: "Сотрудничество между ними, другими секторами экономики и нашим собственным правительством имеет важное значение для ее восстановления."
 SPA_engine_revolution: "Двигатель революции"
 SPA_engine_revolution_desc: "Промышленность чрезвычайно важна для того, чтобы подпитывать нашу Революцию."
 SPA_bread_basket_revolution: "Хлебная корзина революции"
 SPA_bread_basket_revolution_desc: "Революция когда-нибудь станет глобальной, и пока мы можем довольствоваться созданием лучшего сельскохозяйственного сектора, чтобы стать конечной корзиной хлеба Революции."
 SPA_socialist_spain_economic_boom: "Испанский социалистический экономический бум"
 SPA_socialist_spain_economic_boom_desc: "Мы добились успеха не только в восстановлении нашей экономики, но и в обеспечении ее процветания."

 #Alternate Army Tree
 SPA_ARM_standardize_army: "Стандартизация армии"
 SPA_ARM_standardize_army_desc: "Наша новая страна нуждается в армии, чтобы сравняться с ней и сохранить ее в безопасности."
 SPA_ARM_centralized_army_command: "Командование централизованной армии"
 SPA_ARM_centralized_army_command_desc: "Чтобы создать мощную и сильную армию, мы должны централизовать ее командную структуру."
 SPA_ARM_artillary_support: "Артиллерийская поддержка"
 SPA_ARM_artillary_support_desc: "Артиллерия всегда была важным аспектом любой западной армии."
 SPA_ARM_motorization_efforts: "Усилия по моторизации"
 SPA_ARM_motorization_efforts_desc: "Танки и бронированные машины — это новый метод ведения войны, и мы должны сосредоточиться на обновлении нашей армии этими новыми орудиями уничтожения, чтобы не отставать от наших врагов."
 SPA_ARM_army_of_militias: "Армия ополчения"
 SPA_ARM_army_of_militias_desc: "Воины выиграли Революцию для Испании, они являются мощным средством борьбы простых людей за Революцию, и включение их в нашу большую армию было бы мудрым шагом."
 SPA_ARM_ensure_militia_loyalty: "Обеспечивать лояльность боевиков"
 SPA_ARM_ensure_militia_loyalty_desc: "В то время как ополченцы одержали победу над нашей Революцией, некоторые из них могут попытаться пойти своим путем, мы должны обеспечить их преданность, прежде чем мы создадим всю нашу армию на их фундаменте."
 SPA_ARM_focus_on_equipment: "Уделение особого внимания оборудованию"
 SPA_ARM_focus_on_equipment_desc: "Ни одна армия не может зайти далеко, не предоставив своим солдатам оружие и продовольствие."
 SPA_ARM_specialized_units: "Специализированные подразделения"
 SPA_ARM_specialized_units_desc: "Концентрация на специальных подразделениях — это хороший способ диверсифицировать нашу армию и обеспечить, чтобы мы могли справиться с любой ситуацией, которая нам не под силу."
 SPA_ARM_spanish_army_doctrines: "Доктрины испанской армии"
 SPA_ARM_spanish_army_doctrines_desc: "Мы должны сосредоточиться на разработке доктрины, которой должна следовать наша армия, с тем чтобы отделить себя от остального мира и гарантировать победу."

 #Political Path Tree
 SPA_socialism_triumphant: "Триумфальный социализм"
 SPA_socialism_triumphant_desc: "Мы одержали победу после гражданской войны!"
 SPA_curtail_republicanism: "Кудрявый либерализм"
 SPA_curtail_republicanism_desc: "Испанская Республика предала нас в самый важный для нас час."
 SPA_ban_republican_parties: "Партии Бан буржуазии"
 SPA_ban_republican_parties_desc: "Запрещение прямого участия республиканских партий в политическом процессе в Испании является важным аспектом восстановления его величия."
 SPA_curtail_monarchism: "Кудрявый монархизм"
 SPA_curtail_monarchism_desc: "Мы должны ограничить чувства монархистов, которые испытывают некоторые слои нашего населения, и если мы этого не сделаем, то это может разжечь разногласия, с которыми мы только что боролись, чтобы преодолеть их."
 SPA_ban_royalty_from_spain: "Избавься от царской власти из Испании"
 SPA_ban_royalty_from_spain_desc: "Единственный способ положить конец монархистскому движению - это изгнать испанскую монархию."
 SPA_ban_nationalist_militas: "Националист Милитас"
 SPA_ban_nationalist_militas_desc: "Националисты нанесли гораздо больший ущерб нашей стране, чем добро, и мы не можем допустить, чтобы их милита продолжала оставаться нерегулируемой."
 SPA_ban_carlists: "Запретительные националистические партии"
 SPA_ban_carlists_desc: "Чтобы избежать раскола, созданного националистами, мы должны запретить все националистические партии от нашей политической системы и поощрять создание единой, единой Испании."
 SPA_socialist_divisions: "Социалистические отделы"
 SPA_socialist_divisions_desc: ""

 SPA_cnt_fai_dominates: "Доминирование КНТ-ФАИ"
 SPA_cnt_fai_dominates_desc: "Теперь мы должны разработать все наши планы и реформы, чтобы обеспечить революцию навсегда."
 SPA_anarchist_dominance: "Анархистское доминирование"
 SPA_anarchist_dominance_desc: "Анархисты захватили правительство, и теперь мы должны разработать все наши планы и реформы, чтобы обеспечить революцию навсегда."
 SPA_syndicalist_dominance: "Синдикалистское доминирование"
 SPA_syndicalist_dominance_desc: "Теперь мы должны разработать все наши планы и реформы, чтобы обеспечить революцию навсегда."
 SPA_spanish_revolution: "Испанская революция"
 SPA_spanish_revolution_desc: "Мы победили в гражданской войне, но наша революция еще не закончилась."
 SPA_collectivize_work_place: "Объединиться на рабочем месте"
 SPA_collectivize_work_place_desc: "Мы должны работать над объединением всех аспектов рынка, включая частную работу."
 SPA_crush_oppressive_state_power: "Разрушительная государственная власть"
 SPA_crush_oppressive_state_power_desc: "Государство всегда выходило за рамки своих границ и отрекало людей под ними, и мы должны уничтожить все остатки этой репрессивной силы для революции."
 SPA_end_oppressive_churches: "Окончание подавленных церквей"
 SPA_end_oppressive_churches_desc: "Церкви и религия в правительстве уже давно ведут к коррупции и угнетению, и мы должны положить им конец, чтобы освободить народ."
 SPA_gender_equality: "Гендерное равенство"
 SPA_gender_equality_desc: "Женщины уже давно подвергаются угнетению в рамках монархистской и капиталистической систем."
 SPA_crush_communists: "Уничтожить коммунистов"
 SPA_crush_communists_desc: "Коммунисты заходят слишком далеко в своих целях, они угнетают и являются лжереволюционерами, мы должны уничтожить их, чтобы утвердить истинную власть народа."
 SPA_empower_anarcho_syndicalist_militas: "Власть над анархо-синдикалистами"
 SPA_empower_anarcho_syndicalist_militas_desc: "Расширение прав и возможностей наших собственных боевиков имеет важное значение для поддержания мира и безопасности в рамках нашей революции."
 SPA_libertarian_communes: "Свободные коммуны"
 SPA_libertarian_communes_desc: "Мы должны поощрять небольшие общины в нашей стране."
 SPA_libertad_en_revolucion: "Либертад эн революция"
 SPA_libertad_en_revolucion_desc: "Испанская революция была успешной! Да здравствует Испания! Да здравствует свобода и революция!"

 SPA_psoe_dominates: "Домена PSOE"
 SPA_psoe_dominates_desc: "Теперь мы должны разработать все наши планы и реформы, чтобы обеспечить революцию навсегда."
 SPA_negrin_leads_party: "Негрин возглавляет Сторону"
 SPA_negrin_leads_party_desc: "Хуан Негрин и Лопес возглавит ПВО и будет придерживаться идеалов нашей революции."
 SPA_caballero_leads_party: "Кабальеро возглавляет партию"
 SPA_caballero_leads_party_desc: "Франциско Ларго Кабальеро возглавит ПСО и будет придерживаться идеалов нашей революции."
 SPA_reject_violent_revolutions: "Противодействовать насильственным революциям"
 SPA_reject_violent_revolutions_desc: "Наша революция пришла к власти в результате гражданской войны, но дальнейшее насилие лишь затормозит ее прогресс."
 SPA_ban_socialist_militas: "Запрет социалистической милиции"
 SPA_ban_socialist_militas_desc: "Возможно, социалистические ополчения помогли выиграть гражданскую войну, но они слишком непредсказуемы."
 SPA_progressive_reforms: "Прогрессивные реформы"
 SPA_progressive_reforms_desc: "Мы должны провести прогрессивные реформы в рамках нашего правительства, с тем чтобы реализовать идеалы революции."
 SPA_legalize_republicanism: "Легализация республиканизма"
 SPA_legalize_republicanism_desc: "В то время как республиканцы предали нас в час нужды, важно, чтобы мы воссоединили Испанию, а не продолжили существующие разногласия."
 SPA_crush_communist_influence: "Разрушение влияния коммунистов"
 SPA_crush_communist_influence_desc: "Коммунисты заходят слишком далеко в своих целях, они угнетают и являются лжереволюционерами, мы должны раздавить их влияние, чтобы утвердить истинную власть народа."
 SPA_socialist_welfare_state: "Социалистическое государство благосостояния"
 SPA_socialist_welfare_state_desc: "Новое испанское государство должно быть прежде всего для народа."
 SPA_democratic_socialism: "Демократический социализм"
 SPA_democratic_socialism_desc: "Переход к демократическому социализму - лучший способ сделать это."
 SPA_remove_counter_revolutionaries_party: "Удалить контрреволюционеры из партии"
 SPA_remove_counter_revolutionaries_party_desc: "Контрреволюционерам нет места в партии, и те, кто стремится подорвать Революцию, должны быть отстранены от своих позиций."
 SPA_redistribute_spanish_wealth: "Перераспределить испанские богатства"
 SPA_redistribute_spanish_wealth_desc: "Слишком долго богатство Испании было сконцентрировано в руках немногих, и пришло время перераспределить это богатство между каждым человеком в стране."
 SPA_control_socialist_militas: "Контролировать социалистические ополчения"
 SPA_control_socialist_militas_desc: "Возможно, социалистические ополчения помогли выиграть гражданскую войну, но они слишком непредсказуемы."
 SPA_ugt_dominance: "УГТ Доминантность"
 SPA_ugt_dominance_desc: "В нашем правительстве доминирует UGT, и о чем-то, о чем мы всегда должны знать."
 SPA_marxist_socialism: "Марксистский социализм"
 SPA_marxist_socialism_desc: "Революция должна следовать чистой форме социализма в соответствии с марксистскими ценностями."
 SPA_para_los_trabajadores_socialistas: "Парас Трабаджадоры и социалисты"
 SPA_para_los_trabajadores_socialistas_desc: "Испанская революция была успешной! Да здравствует Испания! Для рабочих и социалистов!"

 SPA_pce_dominates: "Долины ПСЕ"
 SPA_pce_dominates_desc: "Мы должны приступить к осуществлению всех наших планов и реформ, чтобы обеспечить революцию навечно."
 SPA_congress_for_people: "Конгресс народа"
 SPA_congress_for_people_desc: "Наш первый шаг в улучшении революции - это создание конгресса для народа."
 SPA_ban_other_parties: "Запретить другие Стороны"
 SPA_ban_other_parties_desc: "Другие политические партии лишь замедлят наше управление, и мы должны запретить их, с тем чтобы обеспечить плавный переход к процветанию."
 SPA_leninist_revolution: "Ленинистская революция"
 SPA_leninist_revolution_desc: "Революция должна следовать чистой форме социализма в соответствии с Ленинскими ценностями, и это будет единственным способом обеспечить мир и процветание для нашего народа."
 SPA_purge_anarchist_syndicalists: "Уничтожить анархо-синдикалистов"
 SPA_purge_anarchist_syndicalists_desc: "Анархо-синдикалисты слишком долго были на нашей стороне, мы должны очистить их от нашего правительства, прежде чем мы сможем что-то сделать."
 SPA_spain_free_from_valkism: "Испания свободна от валькизма"
 SPA_spain_free_from_valkism_desc: "Валькисты представляли величайшую угрозу Революции и народу Испании, и мы должны быть готовы противостоять им, если они когда-либо вернутся, и навсегда вывести их из Испании."
 SPA_revolutions_sucsessor: "Преемник революции"
 SPA_revolutions_sucsessor_desc: "Испанская революция была успешной! Да здравствует Испания, преемники Революции!"

 #Chairmen Focuses
 SPA_chairman_ramos: "Председатель Рамос"
 SPA_chairman_ramos_desc: "Жозе Диас Рамос был избран новым председателем, и пришло время для того, чтобы ввести в действие его идеалы революции."
 SPA_RAM_workplace_democracy: "Демократия на рабочем месте"
 SPA_RAM_workplace_democracy_desc: "Революция для народа должна позволить людям изменить то, что угнетает их."
 SPA_RAM_enlighten_workers: "Просвещение рабочих"
 SPA_RAM_enlighten_workers_desc: "Важно, чтобы мы имели и поддерживали их в качестве прочной основы нашего движения."
 SPA_RAM_land_reform: "Земельная реформа"
 SPA_RAM_land_reform_desc: "Настало время провести существенную земельную реформу, чтобы обеспечить процветание всех испанцев, а не избранных."
 SPA_RAM_collectivization_question: "Вопрос о коллективизации"
 SPA_RAM_collectivization_question_desc: "Мы должны решить здесь и сейчас, в какой степени коллективизация будет играть свою роль в формировании нашей революции здесь, в Испании."
 SPA_RAM_only_one_true_socialism: "Единственный истинный социализм"
 SPA_RAM_only_one_true_socialism_desc: "Есть только одна истинная модель социализма для мировой революции, и мы должны следовать по стопам Советского Союза, чтобы процветать."
 SPA_RAM_leninist_secret_police: "Ленинистская секретная полиция"
 SPA_RAM_leninist_secret_police_desc: "Важно, чтобы мы всегда были бдительны перед нашими врагами, даже внутри Испании."
 SPA_RAM_communist_united_front: "Объединенный коммунистический фронт"
 SPA_RAM_communist_united_front_desc: "Важно, чтобы все коммунисты выступали единым фронтом против сил против революции в Испании."
 SPA_RAM_communist_status_quo: "Коммунистический статус Quo"
 SPA_RAM_communist_status_quo_desc: "Революция занимает много времени. Некоторые называют нашу политику «статус-кво», но на самом деле мы работаем над тем, чтобы изменить Испанию, чтобы все могли процветать."

 SPA_chairwoman_ibarruri: "Председатель Ибаррури"
 SPA_chairwoman_ibarruri_desc: "В качестве новой председателя была избрана Долорес Ибарури."
 SPA_IBA_workplace_democracy: "Демократия на рабочем месте"
 SPA_IBA_workplace_democracy_desc: "Революция для народа должна позволить людям изменить то, что угнетает их."
 SPA_IBA_worker_enlightenment: "Просвещение работника"
 SPA_IBA_worker_enlightenment_desc: "Важно, чтобы мы имели и поддерживали их в качестве прочной основы нашего движения."
 SPA_IBA_land_reform: "Земельная реформа"
 SPA_IBA_land_reform_desc: "Настало время провести существенную земельную реформу, чтобы обеспечить процветание всех испанцев, а не избранных."
 SPA_IBA_strike_enemy_within: "Ударь врага внутри"
 SPA_IBA_strike_enemy_within_desc: "Важно, чтобы мы всегда были бдительны перед нашими врагами, даже внутри Испании."
 SPA_IBA_outlaw_factions: "Незаконные действия"
 SPA_IBA_outlaw_factions_desc: "Факты в рамках революции лишь замедлят наш прогресс."
 SPA_IBA_question_womens_role: "Вопрос о роли женщины"
 SPA_IBA_question_womens_role_desc: "Женщины уже давно играют важную роль в революции, но по-прежнему связаны традиционными гендерными ролями."
 SPA_IBA_secret_police_authority: "Секретное полицейское управление"
 SPA_IBA_secret_police_authority_desc: "Хотя важно, чтобы мы боролись с врагами в Испании, мы должны решить, должны ли мы ограничивать полномочия нашей секретной полиции."
 SPA_IBA_la_pasionaria: "Пассивия"
 SPA_IBA_la_pasionaria_desc: "Председатель Ибарури приняла новый подход к управлению Революцией, и ее политика и ее сильные стороны приведут Испанию к лучшему и гораздо более светлому будущему."

 SPA_chairman_maure: "Председатель Море"
 SPA_chairman_maure_desc: "В качестве нового председателя был избран Хосе Казорла Море."
 SPA_MAU_tighten_police_control: "Усилить полицейский контроль"
 SPA_MAU_tighten_police_control_desc: "Важно, чтобы мы всегда были бдительными против своих врагов, даже внутри Испании."
 SPA_MAU_control_workers: "Контролировать трудящихся"
 SPA_MAU_control_workers_desc: "Рабочие являются основой революции, но они также могут быть непредсказуемыми."
 SPA_MAU_defend_spanish_socialism: "Защита испанского социализма"
 SPA_MAU_defend_spanish_socialism_desc: "Испанский социализм имеет много врагов. Важно, чтобы мы приложили как можно больше усилий для защиты его от всех угроз - как внутри, так и снаружи."
 SPA_MAU_matanzas_de_paracuellos: "Матанзас де Паракуэльос"
 SPA_MAU_matanzas_de_paracuellos_desc: "Мы должны решить, как бороться с массовыми убийствами, совершенными всеми сторонами во время гражданской войны."
 SPA_MAU_molotovist_ideas: "Идеи Молотовиста"
 SPA_MAU_molotovist_ideas_desc: "Приобретение идеи Молотовизма для нашей революции — это хороший способ улучшить нашу работу и процветать."
 SPA_MAU_grow_personality_cult: "Повысить личностность"
 SPA_MAU_grow_personality_cult_desc: "Культ личности, который уже существует среди лидеров Революции, является важным аспектом нашего правительства."
 SPA_MAU_reforge_education: "Перестройка образования"
 SPA_MAU_reforge_education_desc: "Испанское образование в значительной степени отсутствовало на протяжении десятилетий, и для того, чтобы изменить его по образу нашей национальной революции, необходимы значительные реформы."
 SPA_MAU_collectivization: "Объединение"
 SPA_MAU_collectivization_desc: "Для того чтобы эта политика увенчалась успехом, она должна стать важной частью нашей революции."
 SPA_MAU_economic_planning: "Экономическое планирование"
 SPA_MAU_economic_planning_desc: "Мы должны планировать нашу экономику таким образом, чтобы она учитывала наилучшие интересы работников революции."
 SPA_MAU_empower_united_socialist_youth: "Расширение прав и возможностей социалистической молодежи"
 SPA_MAU_empower_united_socialist_youth_desc: "Молодежь - это будущее революции."

 SPA_chairman_maurin: "Председатель"
 SPA_chairman_maurin_desc: "В качестве нового председателя был избран Хоакин Маурин."
 SPA_MAR_beurocratic_reforms: "Реформы бюрократии"
 SPA_MAR_beurocratic_reforms_desc: "Испанская бюрократия уже давно препятствует нашей революции."
 SPA_MAR_negotiate_with_trade_unions: "Переговоры с профсоюзами"
 SPA_MAR_negotiate_with_trade_unions_desc: "Переговоры с испанскими профсоюзами являются важным шагом к тому, чтобы включить их в нашу Революцию."
 SPA_MAR_support_farmers: "Поддержка фермеров"
 SPA_MAR_support_farmers_desc: "Фермеры уже давно служат основой Испании, и мы должны инвестировать в нее и поддерживать ее сейчас, с тем чтобы сохранить стабильную основу для нашего нового общества."
 SPA_MAR_new_economic_policy: "Новая экономическая политика"
 SPA_MAR_new_economic_policy_desc: "Настало время переосмыслить нашу экономическую политику."
 SPA_MAR_inner_party_democracy: "Межпартийная демократия"
 SPA_MAR_inner_party_democracy_desc: "Для нашей революции важно, чтобы рабочие имели право голоса в нашем правительстве."
 SPA_MAR_marxist_pluralism: "Марксистский плюрализм"
 SPA_MAR_marxist_pluralism_desc: "Хотя мы не должны следовать всем идеям Маркса в слове, использование большинства из них должно помочь осуществить Революцию на благо Испании."
 SPA_MAR_close_out_trotskyist_voices: "Закрыть Троцкие голоса"
 SPA_MAR_close_out_trotskyist_voices_desc: "Троцкисты препятствуют прогрессу нашей революции. Важно, чтобы мы закрыли их от политического процесса на благо всех."
 SPA_MAR_purge_reactionaries: "Очистить реакционеров"
 SPA_MAR_purge_reactionaries_desc: "Реакторы всегда были врагом нашей революции."
 SPA_MAR_peace_with_cnt_fai: "Мир с CNT-FAI"
 SPA_MAR_peace_with_cnt_fai_desc: "Несмотря на то, что CNT-FAI долгое время были на нашей стороне, мир с ними стал необходим для обеспечения безопасности и процветания нашей революции."

 SPA_chairman_perez: "Председатель Перес"
 SPA_chairman_perez_desc: "В качестве нового председателя был избран Андрес Нин Перес."
 SPA_PER_relegalize_cnt_fai: "Релегализация CNT-FAI"
 SPA_PER_relegalize_cnt_fai_desc: "Несмотря на то, что CNT-FAI долгое время были на нашей стороне, их легализация стала необходимой для обеспечения безопасности и процветания нашей революции."
 SPA_PER_assert_control_unions: "Контроль за профсоюзами"
 SPA_PER_assert_control_unions_desc: "Профсоюзы препятствуют прогрессу Революции, и мы должны контролировать или уничтожать их, чтобы продвигать наше конечное дело."
 SPA_PER_social_revolution: "Социальная революция"
 SPA_PER_social_revolution_desc: "Революция — это ничто, если она не может изменить испанское общество."
 SPA_PER_ally_peasantry: "Элли Жемчужина"
 SPA_PER_ally_peasantry_desc: "Деревня, которая все еще существует в Испании, станет важным союзником в Революции."
 SPA_PER_purge_dissident: "Хирурги-диссиденты"
 SPA_PER_purge_dissident_desc: "Диссидентам нет места в Революции, они лишь препятствуют ее прогрессу. Мы должны очистить их сейчас, прежде чем они задержат ее еще больше."
 SPA_PER_internationalist_fervor: "Интернационалист Фервор"
 SPA_PER_internationalist_fervor_desc: "Форвор для третьего международного и социалистического движений по всему миру является ключевым элементом нашей революции."
 SPA_PER_spains_trotsky: "Троцкий испанский"
 SPA_PER_spains_trotsky_desc: "Председатель Перес уже давно борется за те же идеалы, что и Троцкий."
 SPA_PER_fighting_beuocracy: "Борьба с бюрократией"
 SPA_PER_fighting_beuocracy_desc: "Испанская бюрократия уже давно препятствует нашей революции."
 SPA_PER_workers_world_unite: "Работники мира, объединяйтесь!"
 SPA_PER_workers_world_unite_desc: "Революция в Испании — это одна из тех, кто трудится, но она выходит за пределы нашей страны, и мы должны поддержать работников во всем мире, чтобы реализовать нашу мечту о глобальной революции."
 SPA_PER_economic_planning: "Экономическое планирование"
 SPA_PER_economic_planning_desc: "Одним из основных элементов народной экономики является План, направленный на обеспечение того, чтобы каждый из ее секторов работал именно так, как это необходимо для обеспечения процветания населения."

