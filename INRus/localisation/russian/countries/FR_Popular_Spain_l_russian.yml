 ### Others ###
 SPA_FUHRERREICH_DESC: "социалистическое движение, движение по освобождению трудящихся мира, началось в XIX веке в Испании с Испанской социалистической рабочей партией. Со временем появились новые движения, сражающиеся за народ. После падения монархии была создана буржуазная Республика. Сегодня попытка реакционеров захватить власть привела к гражданской войне."

