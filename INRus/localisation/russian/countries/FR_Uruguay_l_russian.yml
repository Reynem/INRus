 ### Characters ###
 URG_fractured_leadership: "Прерванное руководство"

 URG_joaquin_secco_illa: "Хоакин Секко Илла"
 URG_joaquin_secco_illa_leader_desc: "Хоакин Секко Илла родился в Монтевидео в 1879 году, окончил Университет Республики в качестве адвоката и был назначен профессором по гражданским правам этого университета в 1906 году. В 1912 году он сформировал «Союз граждан Уругвая» в качестве христианской демократической партии, но позднее вернулся к «Бланко Партии», известной консервативной и христианской партии, теперь, когда он сидит в Паласио Эстевесе, он будет руководить уругвайскими христианскими ценностями и стабильностью над прогрессом."

 URG_council: "Национальный совет по административным вопросам"
 URG_council_leader_desc: "После конституционного референдума 1917 года и учредительного собрания в 1918 году президент Бальтасар Брум принял новую конституцию, в которой говорится, что исполнительная власть должна разделяться между президентом Республики и Национальным советом по административным вопросам ( Национальный административный совет ), который состоит из девяти членов, избираемых каждые шесть лет, которые, как правило, составляют шесть членов от правящей партии и три члена от оппозиции. Президент принадлежит кандидату в совет с наибольшим числом голосов, но он может отвечать только за иностранные дела, национальную безопасность и сельское хозяйство, в то время как НКА отвечает за выполнение остальных функций исполнительной власти."

 URG_emilio_frugoni: "Эмилио Фругони"
 URG_emilio_frugoni_leader_desc: "Эмилио Фругони Кейроло родился в 1880 году в Монтевидео, он уже был политическим активистом, когда учился в средней школе, и принимал участие в гражданской войне 1904 года, защищая правительство Хосе Баттла и Ордоньеса. Когда война закончилась, он сформировал «Сентро Обреро Социалистическую партию», которая начала процесс создания «Социалистической партии Уругвая» в 1910 году, генеральным секретарем которой был Фругони. Он стал депутатом этой партии в 1916 и 1920 годах, однако, с падением Великобритании и Франции на синдикализм, многие из его партии стали радикализироваться, превращая свою партию в «Синдикалистическую партию Уругвая», чья демонстрация насилия вынудила Фругони покинуть партию, которую он создал, и с тех пор восстанавливает Уругвайскую социалистическую партию."

 URG_paulina_luisi: "Паулина Луизи"
 #URG_paulina_luisi_leader_desc: "Полина Луизи Джаники родилась в 1875 году в Колоне, провинция Энтр-Риос, Аргентина, родилась у итальянского отца и полочной матери, вскоре после этого переехала в Пайсанду, а затем, наконец, поселилась в Монтевидео в 1887 году. Она стала первой уругвайской женщиной, которая изучала медицину, когда в 1900 году начала свою карьеру в Университете Республики, где в 1908 году она закончила врачебную карьеру."

 URG_hugo_fernandes: "Уго Фернандес Артусио"

 URG_gabriel_terra: "Габриэль Терра"
 URG_gabriel_terra_leader_desc: "Хосе Луис Габриэль Терра родился в 1873 году в Монтевидео, окончил должность адвоката в 1895 году, где позднее он стал министром президента Клаудио Уиллмана, где он проявил большой опыт в экономических и дипломатических вопросах. Позднее он стал одним из членов Учредительного собрания в 1917 году и был министром во время правления Бальтасара Брума. Он связан с Партией Колорадо, хотя и доказал, что имеет противоположные взгляды с лидером партии Хосе Баттл Ордоньес. Он известный консервативный и авторитарный, и теперь, когда он правит Уругваем, он попытается централизовать свою власть, сбалансировать бюджет штата и избежать либеральных и прогрессивных реформ."

 URG_luis_alberto_de_herrera: "Луис Альберто де Эррера"
 URG_luis_alberto_de_herrera_leader_desc: "Луис Альберто де Эррера и Кеведо родился в Монтевидео в 1873 году, получил степень доктора юридических и социальных наук от «Университета Республики», принял участие в революции 1897 года, осуществленной Партией Бланко в США, и уехал в США в 1901 году, где он был послом Уругвая. В 1920 году он был избран директором Национальной партии и был президентом КНА с 1925 по 1927 год."

 URG_luiz_conrado: "Луис Конрадо Батль Беррес"
 URG_luiz_conrado_leader_desc: "Луис Конрадо Баттл Беррес родился в Монтевидео в 1897 году, стал сиротой, когда ему было одиннадцать лет, и жил со своим дядей Хосе Батле и Ордоньесом. Пока он жил со своим дядей, Хосе смог стать президентом Уругвая и вдохновил Луиса на вступление в «Факультад де де ля республики», где он окончил университет в качестве адвоката и присоединился к Партии Колорадо, и благодаря связям его дяди остался популярным выбором в партии в качестве заместителя, а теперь даже стал кандидатом в президенты."

 URG_juan_de_amezaga: "Хуан де Амезага"
 URG_juan_de_amezaga_leader_desc: "Хуан Хосе де Амезага Ландарасо родился в 1881 году в Монтевидео, окончил Университет Республики в 1905 году и в течение полутора лет путешествовал между Германией и Францией. Его опыт в Европе приблизил его к идеалам Батллизмо и присоединился к Партии Колорадо, как только он вернулся. Он стал депутатом города Дуразно в 1908 году, получив лишь двадцать семь лет похвалы и поддержку от самого Хосе Батль и Ордоньеса. С тех пор он поднялся на ряды, и теперь, когда он сидит в Паласио Эстевесе, он обязан продолжать старую политику Батллиста."

 URG_martin_echegoyen: "Мартин Эчегойен"
 URG_cesar_battle_pacheco: "Сесар Батль Пачеко"
 URG_alfredo_campos: "Альфредо Кампос"

 URG_alfredo_baldomir_ferrari: "Альфредо Балдомир Феррари"
 URG_alfredo_baldomir_ferrari_leader_desc: "Альфредо Балдомир Феррари родился в 1884 году в маленьком городке Пайсанду, окончил военную академию в 1905 году, а позднее учился быть архитектором, чередуясь между двумя его карьерами, и достиг звания генерала в 1935 году."
 URG_alfredo_baldomir_ferrari_commander_desc: "§W 27 августа 1884 года в Paysandu, Уругвай. § §Y Военная карьера: §W Альфредо Балдомир Феррари окончил второй курс обучения в 1905 году в "Институте Милитары высших учебных заведений" и неуклонно повышался до достижения звания генерала в 1935 году. Из-за низкой численности населения Уругвая и относительной дипломатической изоляции Феррари посвятил большую часть своего времени своей работе в качестве архитектора, карьере, из которой он окончил в 1911 году, и своей работе в качестве начальника полиции Монтевидео. \n §YImportant notes: §W-Ferrari является симпатичным по отношению к Колорадосу, но формально не связан с ними."

 URG_oscar_diego_gestido: "Оскар Диего Гестидо"
 URG_oscar_diego_gestido_commander_desc: "§W 28 ноября 1901 года в столице Уругаян, Монтевидео. § §Y Военная карьера: §W Оскар Диего Гестидо Пос окончил "Escuela Militar" в 1921 году в звании второго лейтенанта Артиллерии. Он присоединился к "Escuela Militar de Aviación", где он стал пилотом и был назначен инструктором полета к 1926 году. В 1932 году Гестидо был направлен в качестве военного атташе во французские эксцизии для продолжения сбора опыта в качестве пилота и недавно стал генеральным директором военной аэронавтики. Несмотря на то, что большая часть опыта Гестидо в области авиации, он по-прежнему является компетентным офицером, который выполняет свои обязанности, если Уругвай находится в опасности."

