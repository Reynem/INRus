 COS_ricardo_jimenez_oreamuno: "Рикардо Хименес Ореамуно"
 COS_ricardo_jimenez_oreamuno_leader_desc: "Сын двухкратного президента Хесуса Хименеса Саморы Рикардо Хименеса Ореамуно стал известен перед Вельткригом. В период с 1910 по 1914 год он наблюдал за погашением разрушительного национального долга страны. В третий раз, когда он был президентом, национальный долг страны вновь резко возрос, и вновь президент Хименес пытался, не так успешно, как прежде, вернуть Коста-Рику с грани дефолта."

 COS_leon_cortes_castro: "Леон Кортес Кастро"

 COS_consejo_de_seguridad_nacional: "Национальный совет по делам женщин"
 COS_consejo_de_seguridad_nacional_leader_desc: "В условиях серьезных политических срывов, главным образом консервативный совет министров был назначен на коллективной основе в качестве главы государства и правительства, в то время как национальные дела решаются."

