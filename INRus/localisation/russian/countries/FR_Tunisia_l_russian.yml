l_russian:

tun.1.t: "Орёл карфагена"
tun.1.d: "Тунис - это страна, известная своими солнечными пляжами, уникальной культурой, оливковыми деревьями и французской оккупацией. Даже в условиях этой оккупации Тунис процветает, с националистическими группами и синдикатами, что их единственной целью является димизм Франции, и они видят свою надежду в Наследии Трона Мухаммада Бина Наусера Бея, который станет Мухаммадом VII и выберет свое славное имя в стиле Аббасида. Пока что давайте вернемся в Тунис в целом, хотя национализм и социализм - это порядок дня в тунисской политике, демократы все еще там и рычат, но французы, будучи французами, всегда пытаются заткнуть их, Тунис имеет Потинтиал в этом мире, чтобы однажды стать развитым демократическим независимым государством."
tun.1.a: "shallah"

tun.2.t: "Ахмад II Убийство"
tun.2.d: "Ахмад II, Бей из Туниса был убит разгневанным гражданином, главным образом коллективистом или националистом, который, вероятно, зол на недавний Лондонский рынок, который разрушил нашу маленькую национальную экономику, и французами, которые забирают наши ресурсы, возможно, способствовали этому неудачному событию, которое потрясло нашу страну, расследования будут проведены и будут объявлены через неделю, Мухаммад VII вознесся на трон как Мухаммад VII Аль Мунсеф Бей, что означает по-английски Muhammad VII The Fair Bey"
tun.2.a: "Народный пейджер в городе."

