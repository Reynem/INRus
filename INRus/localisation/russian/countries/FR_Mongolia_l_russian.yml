 MON_jamsrangiin_tseveen: "Джамсранджин Цевин"
# MON_jamsrangiin_tseveen_leader_desc: "В Трансбайкале во время Русской империи он пошёл в бурьатскую частную школу в Санкт-Петербурге и в конце концов стал посещать хитрые племена бурьят в Иркутске. В 1902 году он стал аудитором Санкт-Петербургского университета. В то время как там он совершил многочисленные исследовательские поездки по Трансбайкалу и внешнему Монголии. Через несколько лет после того, как он начал преподавать там монгольский язык, он также посетил Интернат Монголию и Ордос. Когда Богд Ханат стал независимым в 1911 году, он проследовал за светской русской школой и был редактором двух газет, Шин толи и Нийслел Хюренени Сонин Бичиг. После того как Монголия была оккупирована Сюй Шуженгом в 1919 году, Цевин снова стал профессором в Иркутском университете. После того, как в 1921 году Тсхевин стал агентом, который занимался поиском в Иркутском университете. После многих недовщины, основавшие Монгольскую Арден Нам. На своем учредительном Конгрессе, в 1921 году Цин писал Тенантские агиары, проследовали свою прощскую трангу в 19 декабря, прощалигу."

 MON_dambyn_chagdarjav: "Дамбин Чагдарджав"

 MON_unenbayan: "Уненбаян"
# MON_unenbayan_leader_desc: "Как и многие из дворян, которые доминировали в монгольской политике на протяжении многих лет, Уненбаян родился в Монголии. Также известен своим китайским именем Ву Хелинг, он окончил школу в Ченгде, а затем изучал право в Пекинском университете, работая также в министерстве внутренних дел в правительстве Бейянга. Там он работал с принцем Гунгсаннорбу из Харцинского правого Баннера в Комиссии по делам Монголии и Тибета. Позднее, когда Демчугонгруб окончил университет в 1926 году, он стал более активно участвовать в делах Монголии, вступил в контакт с принцем Демчугдунгрубом и Йондонванчугом в Чахаре. В конце концов он решил поехать туда, чтобы работать в провинции Чахар, чтобы помочь Демчугдонгубу в провинции Чахар. Позднее, когда Демчугдонгруб совершил поездку в Ургу со многими дворянами Чахар, он покинул Уненбаян, чтобы эффективно править автоном, который в конечном итоге покинул Чахар во время Западного Революта, чтобы помочь Дечумгдунгубубубубу в Урге. После успешного демократиста, защищающего демократическую демократию Мангу, который стал свидетелем более монга Мангана Мангана, является более молодым человеком, и более монганом ганом, который является более молодым человеком в Монголии, он доказал, и демократкой демократкой дина демократкой демократкой демократкой демократом."
# MON_unenbayan_commander_desc: "8 февраля 1902 года в Монголию, Цинг Империя, §Y Военная карьера: §L#n Prince Demchugdongrub был высокопоставленным благородным представителем Иннер-Монголии, который всегда был за независимость Монголии. Demchugdongrub вступил в Ungern до 1926 года, после того как провинция Чахар была захвачена у Гоминьцзюна. Несколько лет спустя Демчугдонгруб остался в Чахаре, возглавляя борьбу с китайскими пограничными вторжениями. Он даже командовал войсками против граждан Чахар, так как многие китайцы Хана восстали против сильно промонгол Унгерна и пророссийского правления. Демчугдунгруб отправился в Ургу в 1932 году вместе с Алтанахиром и быстро принял участие в его политике. После нескольких месяцев он был назначен главой Нойодина Зёвёля, и поэтому он был гораздо меньше сосредоточен на военных вопросах, хотя они оставались для него важными."

 MON_demchugdongrub: "Демчугдонгруб"
 #MON_demchugdongrub_leader_desc: "После смерти его отца всего лишь в 6 лет Демчугдунгруб унаследовал титул Дулина Вангчука, Дуолу Дулинга Дюньванга из Сёнидского правого Баннера и начальника Синьгольской лиги. После смерти его отца в 6 лет Демчугдунгруб унаследовал титул Дуолга Дюнванга. В 1912 году Юань Шикай был повышен до звания Джасаха Хешуу Дюлинга. В Чахаре он оставался в течение многих лет, став де-факто лидером провинции во время хаоса после окончания Великой войны. nnDemchugdongrub не присоединился к Унгерн-Стернбергу до 1926 года, после захвата Унгерном провинции Чашар из провинции Гуминьон. Ungherngng state's Ungnging general, Ungngng eng eng energ throughat the Dannergning gener en Decher, throughen Déngngn ther ther ther gender ther ther gender ther ther ther gend gender gender ther gender gend gend gend ther ther gend ther ther ther ther ther ther ther thenganngarganngannarganngannages ther ther ther ther ther ther ther thenganngand thand thand thand thend thend thend thannchunchunchunchunchunchund thand thand thand thand thand thand thand thand thand thend thend thand thand thand thandd thand"
# MON_demchugdongrub_democratic_leader_desc: "Он был единственным сыном Намджила Вангчука, Дуолу Дулинга Дюньвана из Сёнида правого Баннера и вождя Синьгольской лиги. После смерти его отца всего лишь в 6 лет Демчугдунгруб унаследовал титул Дуолуэ Дюлинг Цзюнхуня. В 1912 году Юань Шикаи, после захвата Унгерна из провинции Гуаминхон, он оставался на второй год, став де-факто лидером этой провинции во время хаоса после окончания Великой войны. nnDemchugdongrub не присоединился к Унгерн-Стернбергу до 1926 года, после захвата Унгерном Шахарской области."

 MON_roman_von_ungernsternberg: "Роман фон Унгерн-Стернберг"
 #MON_roman_von_ungernsternberg_leader_desc: "Роман фон Унгерн-Стернберг, «Мэд Барон», имел проблемное воспитание с постоянным движением и отцом, который был предан безумному убежище. Его семейное имущество в Эстонии было сожжено в 1905 году, что подтвердило его антипреступные и, в конечном счете, антикоммунистические убеждения. В конечном счете он присоединился к Военной школе Павловского в Санкт-Петербурге, где он стал интересоваться оккультизмом и буддизмом. После окончания школы он был переведен в Сибирь, где он был известен своим тяжелым пьяным и опасным настроением. В 1913 году он переселился в Ховдд в Эвер-Монголию в качестве офицера в российском консульстве после того, как ему не разрешили бороться за независимость Монголии. Ни в первой Вальткрие, Унгерн первым сражался в Галисии, затем после двухмесячной тюрьмы, где он был известен своим пьяным и опасным настроением. В 19-е годы он нападал на другого офицера в пьяной ярости на Кавказе, а после того, как развязалась русская гражданская гражданская война, он вел Семанов и белых в Семаннов и белых в Си, действуя относительно независимо против коммунистов. В конце концов, он перешел путь через Китай, где он женился на принчх Манчу, а затем, после двухмесячную принскую приндскую ганскую ганскую ханскую хангу, и его охангу."
# MON_roman_von_ungernsternberg_commander_desc: "§L\nGeneral Profinition ( &quot; Общее описание &quot; ) ( &lt; &lt; Безумный барон &gt; &gt; ) ( &lt; &lt; Русский белый лидер &gt; &gt; ) во время гражданской войны в России, который вторгся в оккупируемую Китаем Монголией в начале 1921 года с его Азиатской кавалерией. Он успешно взял на себя власть над Богдом Ханом и восстановил его на трон. У него большой опыт, в основном в кавалерии. Он владел Монголией железным кулаком, разрушая любой мятеж и инакомыслие, с которым он столкнулся в 1921 и 1924 годах. Он ненавидит любую форму синдикалистства и полностью предан монархизму. Известно, что он довольно безумен и известен некоторыми из своих кавалериевских обвинений в сражениях во время Первой Велкриги, где он боролся за Россию. Он был чрезвычайно жестоким человеком и даже ввязался с офицерами с офицерами, с которыми встал."

 MON_jodbajab: "Джодбаджаб"

 MON_7th_changkya_khutukhtu: "7-я Чангкия Хутухту"
 #MON_7th_changkya_khutukhtu_leader_desc: "Седьмой Чангкиа Хутухту является чрезвычайно важной фигурой в Монголии. В период Цинь-Династии и в короткое время существовавшего правительства Бейянга Чангкия Хутухту был главой линии тибетского буддизма Гелуг в Иннер-Монголии. После того как Унгерн-Стернберг захватил провинцию Слинголь из Гуоминьюна, 7-я Чангкия Хутукту заявил о своей верности Унгерн-Стернбергу и отправился в Ургу для работы в Гандантхинхленском монастыре. После регулярных выступлений за пределами монастыря он стал очень популярной и важной фигурой в Урге."

 MON_manlaibaatar_damdinsuren: "Манлайбатар Дамдинсюрен"
 #MON_manlaibaatar_damdinsuren_commander_desc: "§L\n §YBorn: 13 марта 1871/nHelongjang, Qing Empire\n §Y Военная карьера: §L\nA Barga Mongol, он участвовал в монгольской независимости в 1911 году. Он сражался с китайцами в этот период, пока Урга снова не был оккупирован китайскими войсками. Он начал диалог с революционерами-мэнами, и был арестован китайцами. Он чуть не умер в тюрьме, но прожил достаточно долго, чтобы быть сорванным силами Унгерна и был восстановлен в полном здравии. С тех пор он сражался со стороны Унгерна, благодаря своей жизни. Но его верность не с Ангерном, а с Монголией в целом."

 MON_altanochir: "Алтанохир"
 #MON_altanochir_commander_desc: "В 1932 году он отправился в Ургу после того, как командовал небольшими группами войск против китайских войск в Чахаре под командованием Демчугдунгруба, и был только недавно повышен до генерала, по рекомендации Демчугдунгруба в 1934 году, после того как они стали близкими."

 MON_khatanbaatar_magsarjav: "Хатанбатар Магсаржав"

 MON_mikhail_tornovsky: "Михаил Торновский"
 #MON_mikhail_tornovsky_commander_desc: "В 1882 году он стал военным командиром белых российских войск во время гражданской войны, где в конце концов приехал в Монголию, где основал там бизнес для российских иммигрантов. Он был заключен в тюрьму китайцами, еще в Урге, но Унгерн освободил его, когда он захватил город, и Торновский присоединился к нему. Он стал начальником штаба Азиатской кавалерийской дивизии. Он командовал отделом во время революции 1921 года и возглавлял еще одну дивизию во время революции 1924 года. Он стал очень преданным Унгерну и ненавидит синдикативный и социализм почти так же, как сам Унгерн."

 MON_nikolay_kazagrandi: "Николай Казагранди"
 #MON_nikolay_kazagrandi_commander_desc: "28 октября 1886 года он принял участие в многочисленных сражениях против коммунистов в Сибири, где он был повышен до командующего Белой Россией."

 MON_zhamyangiyn_lhagvasuren: "Жамьянгин Лхагвасурен"

 MON_boris_rezukhin: "Борис Резухин"
 #MON_boris_rezukhin_commander_desc: "§L\nRezukhin был русским офицером в Первой Верткриге. Он присоединился к Семеньову во время Гражданской войны в России и командовал полками в азиатской кавалерии Унгерна. Он оставался командующим войсками в Ангернской дивизии, путешествовал очень далеко в Сибирь, чтобы победить коммунистов. Он оставался преданным Унгерну, боролся с социалистическими во время революций 1921 и 1924 годов. Он остался в Урге, растерзав любые признаки инакомыслия или восстания для Ангерна. Он безумно предан ему, и со временем стал почти таким же безумным, как сам Мад барон."

 MON_urzhin_garmaev: "Уржин Гармаев"
 #MON_urzhin_garmaev_commander_desc: "В 1917 году он стремился к тому, чтобы напасть на монастыря Цугола Датсана, а в 1917 году он склонился к тому, чтобы стать герцогом, а в 1917 году его патриотами, тянувшими большую жизнь к монастырю Цугольу Датсану. Там вождь Лама рекомендовал ему присоединиться к борьбе против безбожных Болшевиков для защиты бурьятского и буддистского образа жизни, побуждая его завербовать под местным козлом Атамана, Григори Семёнова. Гармаев, который вел более жесткую жизнь, привлек к себе внимание Семановского монастыря и был призван завербовать их в монастырь Берирата, в чем он преуспел. Он был повышен до ранга офицера и направлен в новый буддистский режим Бурьят (1919), который был направлен для поддержки монастыря Ангонского ганского режима, а Гармангон стал одним из его германгонского режима."

