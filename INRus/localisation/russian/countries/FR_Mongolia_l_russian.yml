MON_civvv_effort: "Разработать Хури"
MON_civvv_effort_desc: "Наша столица, Хури, испытывает острую нехватку заводов, мы должны прокатиться по волнам промышленной революции и помочь росту нашей столицы."
MON_mill_effort: "Увеличение объема производства оборудования"
MON_mill_effort_desc: "Наша армия нуждается в оборудовании, чтобы обеспечить их снабжением, нам нужно расширить нашу военную индустрию."
