mon.alliance.1.t: "Монголия предлагает создать альянс"
mon.alliance.1.d: ""
mon.alliance.1.a: "Мы будем сражаться вместе!"
mon.alliance.1.b: "Мы не их псы!"
mon.alliance.2.t: "Тибет отказывается от нашего предложения."
mon.alliance.2.d: ""
mon.alliance.2.a: "Тогда мы добьемся победы в одиночку!"
#
mongolia.legacy.1.d: "Китай находится в абсолютном хаосе, и они мало что могут сделать, чтобы остановить наше возвращение наших законных земель..."
mongolia.legacy.1.a: "Расширьте наши текущие требования к коридору Хекси!"
mongolia.legacy.1.b: "Будь прокляты китайцы! Объединение для всех монгольцев!"

mongolia.legacy.2.t: "Альянс с Тибетом?"
mongolia.legacy.2.d: "Наши соседи проявляют повышенный интерес, и некоторые люди в правительстве призывают послать политического посланника в Тибет, поскольку они занимают стратегическую позицию в отношении наших врагов на юге."
mongolia.legacy.2.a: "Пошлите посланника!"
mongolia.legacy.2.b: "Что у них есть, кроме яков?"
mongolia.legacy.3.t: "Прибытие монгольского посланника"
mongolia.legacy.3.d: "Наши соотечественники-буддисты из-за мусульманских земель в Монголии послали дипломатического посланника, они стремятся к сотрудничеству и единству между нашими группами... как мы должны реагировать?"
mongolia.legacy.3.a: "Добро пожаловать посланнику!"
mongolia.legacy.3.b: "Мы скромные люди - вежливо отказываемся."
mongolia.legacy.4.t: "Тибет принимает наше предложение"
mongolia.legacy.4.d: "Тибет принимает наш союз и теперь мы будем работать вместе, чтобы распространить слово Будды."
mongolia.legacy.4.a: "Отличные новости!"
mongolia.legacy.11.t: "Победа в Сибэй Лианбан Июань"
mongolia.legacy.11.d: "После больших сражений мы, наконец, покорили западных военных баронов! Есть много чего, чтобы наградить себя и солдат здесь, включая захваченные вражеские запасы. Как справится с новым населением, а также с этими ресурсами?"
mongolia.legacy.11.a: "Уничтожить землю и соли землю!"
mongolia.legacy.11.b: "Они будут включены в общество мирным путем."

mongolia.legacy.32.t: "Новая монгольская империя?"
mongolia.legacy.32.d: "Теперь, когда наши трусливые враги побеждают, никто не может помешать нашему Хану восстановить славу Монголии в прошлом. С большей частью Центральной Азии в его руках, Унгерн Хан правит всеми монголийскими народами и всеми, кто живет в юрте, клянется в верности ему в одиночку. Человек, неподвластный другим смертным, Унгерн считается многими монгольцами аватаром Бога войны или, по крайней мере, – как реинкарнация великого Чингиса Хана и с его новыми победами, которые сомневаются в этих притязаниях, был сведен к горстке. Подкреплён сладкими плодами победы Унгерн Хан созвал в Урге великое собрание, чтобы продемонстрировать триумф недавних завоеваний Монголии. Однако вопрос о том, удовлетворит ли Мадон создание Великой Монголии или же возьмёт на себя его верных племенных сил и его укрепленную дивизию Спасения на пути амбиций, безумия и славы?"
mongolia.legacy.32.a: "Монголия снова восстанет под Унгерн Ханом!"
mongolia.legacy.32.b: "Мы должны сосредоточиться на развитии Панмонийского государства!"

mongolia.legacy.36.d: "Хан доволен нашими победами, которые прославили его правление и сделали нашу любимую Монголию намного сильнее и больше."
mongolia.legacy.36.a: "Уничтожить землю и соли землю!"
mongolia.legacy.36.b: "Они будут включены в общество мирным путем."
mongolia.legacy.37.t: "Присоединение Тибета"
mongolia.legacy.37.d: "Тибет сейчас под копытами наших лошадей... но мы должны помнить о нашей долгой дружбе и сотрудничестве с этим народом... их правительство будет наказано за их предательство, но жители тибетских гор, вероятно, согласятся присоединиться к нашей империи под правлением славного Чингиса Хана II! Тибетцы знают, как сражаться на ледяных холмах, и их солдаты будут полезны для наших могущественных армий... но воины Хана хотят получить вознаграждение за долгие кровавые битвы..."
mongolia.legacy.37.a: "Уничтожить землю и соли землю!"
mongolia.legacy.37.b: "Они будут включены в общество мирным путем."

mon.sternberg.1.d: "Барон Роман фон Унгерн-Стернберг, безумный барон, когда-то власть в Монголии, был изгнан из страны после смерти Богда Хана. Теперь, проработав на нашей территории в течение последних 12 лет, он просил нас поддержать экспедицию его азиатского кавалерии в Монголию, чтобы спасти ее от красных из-за нынешней политической слабости нации. -Нет, если мы поддержим его и он преуспеет, мы получим вознаграждение от дружелюбного соседа на нашем юго-западе. Если он не справится, мы можем подарить Монголию прямо в руки красных."

mon.sternberg.2.d: "Барон Роман фон Унгерн-Стернберг, безумный барон, когда-то власть в Монголии, был изгнан из страны после смерти Богда Хана."

mon.sternberg.3.d: "Стернберг сделал свой шаг, и он и его люди из Азиатской кавалерии уже добрались до Урга! Наши силы, к сожалению, плохо оснащены, чтобы сопротивляться ему, и наше правительство парализовано перед лицом его нападения. Многие предлагают просить Советов защитить нас, так как они, несомненно, спрыгнут, чтобы предотвратить попадание Монголии в белые русские руки."

mon.sternberg.4.d: "Теперь барон утвердил свое правление над Монголией, теперь он сам должен выбрать будущее ханата. Он мог бы назначить популярного панмонольского принца Демчугдунгруба. Он союзник барона, который останется верным и будет держать под контролем китайцев и Советов, не доказывая при этом, что он абразивный народ монголов. ~ nnnnUngern мог бы вместо этого просто сделать себя регентом ханата, управляя светлой рукой для российских интересов, чтобы помочь Белой России однажды раздавить Советы. ~ ~ nnnUngern также стоит перед третьим вариантом, который он однажды пожелал во время своего первого правления нации и на который он может быть более способным: путь завоевания. Многие монголы очень поддержали бы любого лидера, который обеспечил бы безопасность южных районов, которые, по мнению многих, являются частью Большой Монголии."

mon.sternberg.5.d: "Перед лицом нападения барона Романа фон Унгерн-Стернберга монгольцы просили нас поддержать людей барона."

mon.sternberg.6.d: "Как мы и надеялись, Красная Армия въехала и раздавила силы Стернберга и навсегда выгнала их из Монголии. С поражением барона у Красной армии мало причин оставаться на нашей территории, и теперь они могут уйти."

mon.sternberg.7.d: "Несмотря на надежду на то, что вмешательство Красной Армии будет временным делом, этого не произошло, и советские войска сейчас оккупировали Ургу."

mon.sternberg.8.d: "Оккупирующиеся советские силы объявили, наряду с болельщиками монголов, Монгольскую Социалистическую Республику."

mon.sternberg.9.d: "Красная армия отказывается покинуть Монголию, и объявление Социалистической Республики является лишь вопросом времени."

mon.sternberg.10.d: "Красная Армия отказалась поддерживать нас, и теперь у нас нет другого выбора, кроме как поклониться барону."

#Ideas
MON_without_khan: "Ханат без хана"
MON_without_khan_desc: "После смерти Богда Хана наш великий народ оказался без лидера, что заставило наш народ замерзнуть на своих путях, так как реформы Богда Хана так и не были завершены, и тем не менее дух нашего великого лидера может ощущаться по всей земле, придавая силу нашему населению в эти тяжелые времена."
MON_tuva_nationalism: "Национализм Тувана"
MON_tuva_nationalism_desc: "Национализм Тувана"
MON_industrial_combine: "Промышленная комбинация Delkhii"
MON_industrial_combine_desc: "Созданная для оказания помощи в индустриализации Монголии, Промышленная комбинация Делхии сейчас использует свое значительное финансирование не на промышленный рост нашей страны, а на личные предметы роскоши и удовольствия."
MON_nomad: "Общество кочевников"
MON_nomad_desc: "Монголия ни в коем случае не доходит до западных стойк, когда дело доходит до индустриализации. Мы прошли долгий путь со времени создания ДИК, но наше общество все еще в основном кочевое. Хотя это означает, что больше воинов готовы бороться за свою страну, это также означает, что промышленность, которая у нас есть, гораздо менее эффективна, чем она должна быть."
MON_doctrine: "Захильган Довтлольт"
MON_doctrine_desc: "Это будет нашим величайшим оружием в предстоящих войнах против жалких военных баронов на юге, в доктрине основное внимание уделяется использованию мобильных дивизий, чтобы окружить большое количество врагов и уничтожить их, когда их запасы полностью отрезаны."
MON_russian_support: "Российская поддержка"
MON_russian_support_desc: "Чтобы защитить нашу нацию от советской угрозы, Белое российское правительство предоставило нам экономическую поддержку, хотя их средства относительно невелики, они намного больше, чем наши, и это позволяет обеспечить более высокое экономическое процветание и защиту нашей северной границы."
MON_russian_support2: "Российская поддержка"
MON_russian_support2_desc: "Чтобы защитить нашу нацию от советской угрозы, Белое российское правительство предоставило нам экономическую поддержку, хотя их средства относительно невелики, они намного больше, чем наши, и это позволяет обеспечить более высокое экономическое процветание и защиту нашей северной границы."
MON_soviet_support: "Советская поддержка"
MON_soviet_support_desc: "Наша реконфигурация привела к тому, что поддержка перешла от Владивостока к Москве, и мы пожинаем плоды этого партнерства."

