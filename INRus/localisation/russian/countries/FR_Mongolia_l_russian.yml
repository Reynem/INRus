mon.1.t: "Степцы Монголии"
mon.1.d: "Как гордые потомки Чингис Хана, Богд Ханс, армии, как правило, пытались доставить всех монголов, находящихся в пределах их досягаемости, в новое монгольское государство, но, несмотря на многочисленные попытки укротить монгольскую нацию и ее народ, она выдержала. Великим успехом в завоевании большей части внешней Монголии, некоторых из Восточной Монголии, и маленькой нации Тувы они бы никогда не использовали для того, чтобы побороть эту диагональную диагону в период ее революции, он вдруг попытался удержать под своим контролем эти огромные районы. Нисний Шикай позволил Монголии остаться независимой благодаря соглашению, заключенному между ним и Богдом Ханом, другие не видели световых ограничений, которые были наложены на Монголию как на достаточное количество лет (или просто из-за личной жадности). Один такой человек был Анхуи Варлором Сюй Шужен, который решил поехать, недавно переименованный в столицу, Нис Хюри, в поисках своего собственного плана. Сопротивление было мало и не было расстроено, так как нападение со стороны Зонга, и нижниха, ни одного человека, ни одного человека, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного, ни одного"
mon.1.a: "Дискуссия должна быть урегулирована раз и навсегда!"
