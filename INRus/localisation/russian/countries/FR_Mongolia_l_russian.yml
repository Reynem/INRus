MON_Khan_Guard: "Телохранители Демчугдонгруба"
MON_Khan_Guard_desc: "Демчугдонгруб требует личного охранника, чтобы он был в безопасности, попытки переворота уже сделаны, мы не хотим, чтобы он попал в руки врага."
MON_Remove_IM_Claims: "Претензии в отношении внутренней Монголии"
MON_Remove_IM_Claims_desc: "Внутренняя Монголия является законной частью Китая, нет никакой пользы в ее возвращении, мы должны поддерживать хорошие отношения с нашими китайскими братьями."
MON_Ask_For_IM: "Внутренний спрос"
MON_Ask_For_IM: "Внутренняя Монголия принадлежит нам, Богд Ханате, без нее Монголия не цела, там живут многие этнические монголианцы, и мы должны освободить их от китайцев."
MON_Preach_Buddhism: "Защита буддизма"
MON_Preach_Buddhism_desc: ""
MON_Our_Sovereignty: "Наша суверенная нация"
MON_Our_Sovereignty_desc: "Монголия - это суверенная нация, мы не позволим китайцам сказать обратное, наша великая земля должна быть защищена."
MON_Genghis_Khan_II: "Второй Чингис Хан"
MON_Genghis_Khan_II_desc: "Недавно в Монголию прибыл новый многообещающий лидер - Безумный барон, Роман фон Унгерн-Стернберг."
