MON_Growing_Economy: "Развивающаяся экономика"
MON_Growing_Economy_desc: "Будучи слабой экономикой, мы должны найти пути развития, чтобы найти свое место в экономических гигантах мира."
MON_civ_effort: "Поощрение урбанизации"
