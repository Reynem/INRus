### MDRE BY DARKNIGHT1342 ###

### EVENTS ###

slovakia.1.t: "Союз с Венгрией"
slovakia.1.d: "Венгерцы обратились к нам с предложением, они хотят помочь нам в нашей борьбе за независимость. Шансы на то, что мы выиграем эту войну сами, очень малы, и, к сожалению, венгерские солдаты на нашей границе не оставили нам другого выбора. Мы станем подданными Венгрии для нашего собственного выживания."
slovakia.1.a: "Мы привяжем нашу династию к их."
