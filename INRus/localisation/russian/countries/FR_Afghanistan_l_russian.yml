 AFG_navy_begin: "Начало флота"
 AFG_navy_begin_desc: "Мы расходуем огромные средства на морские инвестиции и закупки, чтобы создать почву для того, что, как мы надеемся, станет большим флотом."
 AFG_shipsale_afgside: "Расходы на военно-морские закупки"
 AFG_shipsale_afgside_desc: "Мы должны оплатить расходы за корабли, которые мы только что восстановили."
 AFG_shipsale_forside: "Прибыль от продажи судов"
 AFG_shipsale_forside_desc: "Мы получаем финансовую выгоду от продажи судов в Афганистан."


 #### Events ####

 afghan.0.t: "Королевство Афганистан"
 afghan.0.d: "История Афганистана восходит к тысячам лет назад, как исламская, так и монгольская завоевания, династия Хотака и Дуррани Империи. В начале XX века страна управлялась как эмират под эмиратом под эмиром Хабибулла Ханом, который смог выжить, по крайней мере в какой-то мере, независимо от британской и российской империй. . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . ."
 afghan.0.a: "Меньше разговоров, больше действий"

 afghan.1.t: "Индия в восстании"
 afghan.1.d: "Наши соседи, народ индийского субконтинента, находятся в открытом восстании против Британской империи. Это восстание, с его масштабами, может выявить трещины в британской гегемонии. Возможно, сейчас самое время нанести удар и забрать то, что империя Дуррани потеряла в XIX веке. Но есть и советники, которые предостерегают от такого агрессивного движения. Они утверждают, что британцы могут нанести ответный удар и поразить нас. Наша позиция зависит от короля и его правительства."
 afghan.1.a: "Самое время для вмешательства!"
 afghan.1.b: "Нет, это просто разобьет конфликт."

 afghan.2.t: "Афганистан Сизе идет по северо-западной границе"
 afghan.2.d: "Афганская армия воспользовалась возможностью извлечь выгоду из конфликта, бушующего в настоящее время в Индии, и в настоящее время ее армия идет в Северо-Западную пограничную провинцию вместе с другими территориями в этом районе, хотя с этой агрессией нельзя мириться, сейчас мы не в состоянии бороться с ней."
 afghan.2.a: "В конце концов они будут сожалеть об этом."
 afghan.2.b: "Это значит войну!"

 afghan.3.t: "Афганистан Сизе идет по северо-западной границе"
 afghan.3.d: "Афганская армия воспользовалась возможностью извлечь выгоду из конфликта, который сейчас бушует в Индии, и в настоящее время ее армия въехала в Северо-Западную пограничную провинцию вместе с другими территориями в этом районе; с этой агрессией нельзя мириться; мы можем либо взять на себя инициативу по организации нападения, либо проконсультироваться с Лондоном относительно того, что нам следует сделать."
 afghan.3.a: "Ведите атаку!"
 afghan.3.b: "Лучше услышать из Лондона..."

 afghan.4.t: "Агрессия в Афганистане"
 afghan.4.d: "Новости из нашего достояния в Индии говорят нам о том, что афганская армия перекрыла северо-западную границу, что является волнением, и наши колониальные друзья спрашивают нас, что Империя намерена с этим делать."
 afghan.4.a: "Как индейские мятежники, Афганистан будет разрушен!"
 afghan.4.b: "Мы разберемся с ними позже."

 afghan.5.t: "Афганистан отгоняет нас из кветты"
 afghan.5.d: "Наши советники утверждают, что мы должны заключить мир с афганцами и нанести им удар позднее."
 afghan.5.a: "Да, давай помиримся."
 afghan.5.b: "Нет, война продолжается!"

 afghan.6.t: "Британское стремление к миру"
 afghan.6.d: "Нам удалось доставить британцев за стол переговоров, они позволили нам забрать их северо-западную границу, в то же время запрашивая Кветту, конечно же, это великая победа!"
 afghan.6.a: "Да здравствует Афганистан!"

 afghan.7.t: "Конфликт между Британской Индией и Афганистаном"
 afghan.7.d: "В связи с тем, что индийский мятеж уже опустошил регион, в Индии возник новый конфликт, на этот раз это афганцы, пытающиеся высечь землю у Раджа, наши колониальные друзья в Индии уже развязали войну, которая оставляет нам мало выбора, кроме как присоединиться к ней."
 afghan.7.a: "В следующий раз спросите нас, Индия"

 afghan.8.t: "Афганцы были возвращены"
 afghan.8.d: "Британская империя победила в своей войне с афганцами. Пришло время послать им наш ультиматум."
 afghan.8.a: "Отправь им предложение мира!"
 afghan.8.b: "Нет, мы должны раздавить их!"

 afghan.9.t: "Мирное предложение от британцев"
 afghan.9.d: "Мы получили телеграмму от британского руководства, предлагающую нам мир."
 afghan.9.a: "Мы должны принять это."
 afghan.9.b: "Это победа или смерть!"

 afghan.10.t: "Убийство Мухаммада Надира Хана"
 afghan.10.d: "Мухаммад Надир Хан, король Афганистана, сегодня был застрелен во время посещения новой школы в Газни. Убийца был опознан как ученик школы Хазары. Это событие потрясло всю страну, и лоялисты готовы отомстить за павшего монарха. Некоторые могут рассматривать ситуацию как конец династии. Другие считают, что это время для действий против социалистов, республиканцев, хазарасов и претендентов на престол."
 afghan.10.a: "Король мертв..."

 afghan.11.t: "Weekh Зальмианская мобилизация"
 afghan.11.d: "В связи с нестабильностью, вызванной смертью короля, началась мобилизация прореформистской полусоциалистской группы Вайдх Салмиан , которая выступает против монархии, рассматривая ее как консервативный институт, противостоящий реформам, и как репрессивную силу в отношении трудящихся и народа. Хотя они хотят демократической республики , на эту группу также влияет Советский Союз, эти связи могут сделать ее опасной для афганского Королевства."
 afghan.11.a: "В самом деле, опасный."

 afghan.12.t: "Хабибуллах Калакани Симен на севере"
 afghan.12.d: "Предатель Хабибулла Калакани, по сообщениям, был замечен в северной части Афганистана, ему удалось вернуться из изгнания после убийства короля, только его присутствие повысило его популярность, и он получил значительное число последователей, похоже, им удалось объединиться в прокаканскую группу под названием Саккависты . Консервативное послание Калакани получило поддержку от многих, кто боится того, как Афганистан может развиваться в будущем ."
 afghan.12.a: "Возвращение таджика"

 afghan.13.t: "Аманулла Хан получает поддержку"
 afghan.13.d: "Бывший царь Аманулла Хан по-прежнему пользуется большим уважением в Афганистане, и с убийством, что может быть, единственным препятствием, мешающим возвращению Амануллы, его популярность, естественно, стала еще более популярной, есть даже слухи о некоторых его сторонниках в королевском дворе, слухи о том, что есть люди, которые хотят свергнуть Мусахибанов в пользу Амануллы Хана."
 afghan.13.a: "Лучше осторожнее."

 afghan.14.t: "Казнь хазары"
 afghan.14.d: "Сегодня, после того как эти люди были изгнаны из страны, многие все еще находятся в зале суда с желанием отомстить, видные офицеры, которые, казалось бы, с националистическим взглядом пуштуна, хотели бы обратить свой гнев на население Хазары в Афганистане."
 afghan.14.a: "Смерти уже достаточно!"
 afghan.14.b: "Нам нужно искоренять эту угрозу!"

 afghan.15.t: "Коронация Мохаммеда Захира Хана"
 afghan.15.d: "Когда после убийства царя Мохаммеда Надира Хана будет мир, наконец, настало время наследовать его наследника и преемника Мохаммеда Захира, хотя молодому царю всего лишь 22 года, при поддержке дядей его правление будет обеспечено, надежда на процветающую страну есть, но есть некоторая оппозиция царю, но это легко уладится."
 afghan.15.a: "...Да здравствует король!"

 afghan.16.t: "Новый король ищет путешествие в Афганистан"
 afghan.16.d: "Король Мохаммед Захир Хан проявил интерес к путешествию по стране, чтобы увидеть, что он правит, хотя это и есть возможность для повышения морального духа, некоторые сообщения говорят, что это опасно для сторонников как Амануллы Хана, так и Хабибуллаха Калакани, которые все еще скрываются. Республиканцы могут также представлять угрозу для нового короля."
 afghan.16.a: "Путешествие может быть проведено позднее"
 afghan.16.b: "Афганистан нуждается в том, чтобы увидеть своего короля"

 afghan.17.t: "Смерть нового короля"
 afghan.17.d: "Король Мохаммед Захир Хан и его компания были атакованы во время поездки по стране, говорят, что нападавшие были либо республиканцами, либо приверженцами Калакани, независимо от того, кто несет ответственность за это, в докладе говорится, что король был застрелен, а большая часть его компании была убита или рассеяна, что сделало ситуацию слишком нестабильной, и это может означать конец Царства, как известно."
 afghan.17.a: "Этого не может быть!"

 afghan.18.t: "Люди штурмуют дворец"
 afghan.18.d: "Под воздействием смерти короля Мохаммеда Надира и короля Мохаммеда Захира жители Кабула сейчас штурмуют дворец, а подразделения афганской армии дезертируют на восстание или бегут из столицы, что может стать концом для Королевства, но есть еще один способ выжить."
 afghan.18.a: "Лев побежден овцами!"
 afghan.18.b: "Свяжитесь с лоялистами Амануллы!"

 afghan.19.t: "Революция умирает!"
 afghan.19.d: "Народ Афганистана победил реакционную монархию, освободив рабочих и народ от репрессивного правления старых королей."
 afghan.19.a: "Да здравствует Афганистан!"

 afghan.20.t: "Аманулла лоялисты захватили Кабул"
 afghan.20.d: "С оставшимися преданными покойному королю, объединенными с лояльными сторонниками Амануллы Хана, Революция была свернута, хотя это и является потерей для Мусахибанов, королевство все еще стоит, после чего король Аманулла Хан согласился вернуться в Афганистан из изгнания, чтобы стать королем, и это станет началом новой эры."
 afghan.20.a: "...Да здравствует король!"

 afghan.21.t: "Калакани восстает на севере"
 afghan.21.d: "Таджикский бандит Хабибуллах Калакани взялся за оружие против Республики, рассматривая нас как угрозу исламу и традициям Афганистана, ему удалось заручиться поддержкой таджикского населения и даже некоторых пуштунских племен, которые все еще существуют за пределами Кабула, и вскоре нам предстоит искоренить эту угрозу."
 afghan.21.a: "Революцию нельзя остановить!"

 afghan.22.t: "Прогресс в отношении саккавистов"
 afghan.22.d: "Многие из наших офицеров предлагают быстрый шаг на север, быстро и решительно сокрушив восстание, но есть также много офицеров, которые продолжают скептически относиться к этому, говоря, что контролируемый прогресс лучше, и мы сами решим, какие планы мы осуществим."
 afghan.22.a: "Контролируемый аванс!"
 afghan.22.b: "Зажигание!"

 afghan.23.t: "Победа в Баглане"
 afghan.23.d: "Благодаря контролируемому продвижению к северу мы смогли сохранить наши силы организованными и хорошо оснащенными, в городе Баглан наши силы встретились с силами Хабибуллаха Калакани и другими антиреспубликанскими силами, хотя они были относительно организованными и укоренившимися, их численность была не столь высокой, как наша, с современным российским оружием мы смогли раздавить их и захватить в плен Калакани."
 afghan.23.a: "Истинная победа революции!"

 afghan.24.t: "Амбуш в Талукане"
 afghan.24.d: "Но когда наши войска прибыли в город Талукан, Хабибулла Калакани и другие антиреспубликанские силы были отрезаны от них и попали в засаду, это большая потеря, и лишь немногие солдаты вернулись из этой кампании, что может даже означать конец революции."
 afghan.24.a: "Какой идиот предложил этот план!"

 afghan.25.t: "Антиреспубликанские силы достигают Кабула"
 afghan.25.d: "Хабибулла Калакани и другие антиреспубликанские силы смогли добраться до столицы Кабула, и, имея ограниченные ресурсы, это может стать концом революции, по крайней мере, мы дадим им все, что у нас есть."
 afghan.25.a: "Для революции!"

 afghan.26.t: "Захват Кабула"
 afghan.26.d: "Революция была свернута, это великая победа для Королевства Афганистан, но с падением республиканцев старые союзники стали новыми врагами. Поддержка Хабибуллах Калакани и сторонники старой монархии сейчас в игре, чтобы понять, кто может обеспечить власть и свергнуть другую фракцию."
 afghan.26.a: "Безопасная сила пуштунов для Амануллы"
 afghan.26.b: "Таджикская безопасная держава для Калакани"

 afghan.27.t: "Казнь Калакани"
 afghan.27.d: "Если Калакани станет нашим пленником, то у нас наконец-то появится возможность раз и навсегда застрелить этого врага революции, и это будет также противостоянием отсталому бандитизму старого порядка, как, например, то, что представляет Хабибуллах Калакани, и его смерти будет положен конец его движению и восстанию, которое он вел."
 afghan.27.a: "Огонь!"

 afghan.28.t: "Советский вопрос"
 afghan.28.d: "С учетом внутренних проблем пришло время взглянуть на то, чего должна достичь эта революция. Модернизация, прогрессивные реформы и социальное обеспечение - все это то, чего хочет большинство в Вайдх-Залмиане, но есть и другие вещи, в которых есть противоположные голоса. -Нет, вопрос о нашей позиции, когда дело доходит до Советского Союза, и о социализме имеет много общего в движении. Нур Мухаммад Тараки, один из самых могущественных лидеров движения, выступил с сильным аргументом в пользу советской слаженности и социализма. Гуль Пача Ульфат, инфлексальный автор в движении, выступил против советской ориентации. Ясно, что этот вопрос будет определять будущее революции."
 afghan.28.a: "Советы - наши революционные друзья!"
 afghan.28.b: "Советы так же опасны для демократии, как и монархия!"

 afghan.29.t: "Социалистическая революция"
 afghan.29.d: "Сегодня зальмианцы объявили Революцию социалистической, а также привязали Афганистан к Советскому Союзу, и Нур Мухаммад Тараки был объявлен генеральным секретарем Уайдх Залмиан, что сделало его лидером Афганистана."
 afghan.29.a: "Да здравствует революция!"

 afghan.30.t: "Демократическая революция"
 afghan.30.d: "Сегодня зальмианцы объявили Революцию демократической. Кроме того, движение осудило Советский Союз за постоянное однопартийное правление. Гуль Пача Ульфат был объявлен первым президентом Афганской Республики, став новым лидером залмианского залива."
 afghan.30.a: "Да здравствует Афганская Республика!"

 afghan.31.t: "Восстания в Хазараджате"
 afghan.31.d: "Наша кампания, направленная на то, чтобы положить конец угрозе, которую представляют Хазара, была нелегкой, племена хазары взяли в руки оружие против нас, и то, что они называют «насильственным спокойствием своих общин», даже если мы станем более консервативными в наших операциях, похоже, восстание не утихнет."
 afghan.31.a: "Вот дерьмо..."

 afghan.32.t: "Таджики в Северном Флоке в Калакани"
 afghan.32.d: "В связи с восстанием между племенами хазары в Хазараджате, слухи о том, что правительство будет добиваться насильственного мира таджиков, заставили некоторых таджиков в Северном Афганистане повернуться против нас, они сходятся к бандиту-таджику Хабибуллаху Калакани, считая его лучшим вариантом, чем наше собственное правительство."
 afghan.32.a: "Это нехорошо."

 afghan.33.t: "Вспышки в Кабуле"
 afghan.33.d: "В Кабуле и вокруг него вспыхнули беспорядки, в то время как многие более богатые районы Кабула поддерживают наши кампании против хазара, есть и те, кого наши действия омерзили, и, несмотря на то, что перед Королевским дворцом стоят бунты, некоторые командиры призывают нас отдать приказ стрелять, но среди них есть и те, кто препятствует столь экстремальным действиям."
 afghan.33.a: "Просто обеспечьте мир"
 afghan.33.b: "Огонь!"

 afghan.34.t: "Покончить с беспорядками"
 afghan.34.d: "Похоже, бунты в Кабуле увядают, поскольку правительство уже прекратило попытки уничтожения хазарских общин, многие бунты находят себя довольными. Похоже, что нам удалось сохранить мир на севере, вытащив Калакани из Афганистана. Мы не знаем. Похоже, что пришло время перейти трон."
 afghan.34.a: "По крайней мере, хорошие вести"

 afghan.35.t: "Солдаты поворачиваются к своим начальствам"
 afghan.35.d: "Наш приказ стрелять в бунтарей не был с радостью услышан нашими солдатами, они были довольно неугодны, многие из них отказались от жизни людей, с которыми они даже могли быть связаны, после того как приказ был отдан в третий или четвертый раз, некоторые из них открыли огонь, а большинство из них повернули оружие против своих начальников, и через некоторое время солдаты либо сбежали, либо обратились против нашего правительства."
 afghan.35.a: "Эти предатели!"

 afghan.36.d: "Под воздействием смерти короля Мохаммеда Надира и нашей попытки уничтожить общины Хазары народ Кабула сейчас штурмует дворец. подразделения афганской армии, в свою очередь, дезертировали на восстание или бежали из столицы. Это может быть концом для Королевства, но есть еще один способ выжить. Офицеры призвали остальных правительственных чиновников связаться с лояльными сторонниками Амануллы Хана. Но это также будет означать, что Мохаммед Захир не получит шанс стать королем."
 afghan.36.a: "Лев побежден овцами!"
 afghan.36.b: "Свяжитесь с лоялистами Амануллы!"

 afghan.37.t: "Государство Королевство"
 afghan.37.d: "Мохаммед Захир Хан, новый король Афганистана, сумел обеспечить свое правление, и теперь, когда оппозиция умиротворена, король и его министры смотрят внутрь, чтобы улучшить положение в Афганистане, некоторые министры предложили план модернизации и реформирования Королевства, укрепления его инфраструктуры и промышленного потенциала, однако это оспаривается более консервативными министрами, консерваторы утверждают, что Афганистан должен придерживаться политики предыдущего короля Мохаммеда Надира Хана."
 afghan.37.a: "Афганистан нуждается в модернизации!"
 afghan.37.b: "Давайте придерживаться Традиции!"

 afghan.38.t: "Реформы Амануллы"
 afghan.38.d: "Новый король Афганистана Аманулла Хан в настоящее время контролирует страну, а после того, как оппозиция умиротворилась, Аманулла начал заглядывать внутрь страны, вместе со своими верными последователями и министрами объявил о широкомасштабных реформах в Королевстве Афганистан."
 afghan.38.a: "Вперед к прогрессу!"

 afghan.39.t: "Революция продолжается"
 afghan.39.d: "С врагами республиканской революции наконец-то настало время заглянуть внутрь страны Афганистан на протяжении всей своей истории был отсталым государством, удерживавшимся старыми королями и их министрами, но теперь, как республика, Афганистан должен модернизироваться и стать частью XX века, что станет одним из последних шагов в нашей революции и, наконец, освободит нас от реакционного общества."
 afghan.39.a: "Да здравствует революция!"

 afghan.40.t: "Упражнение для традиции"
 afghan.40.d: "Новое правление короля Хабибулла Калакани, наконец, защищено от врагов государства, и сейчас, когда государство защищено, настало время для Афганистана двигаться вперед не в направлении нечестивой модернизации, а в направлении традиций и сельского хозяйства, что полностью соответствует цели Калакани защищать ислам, защищать Афганистан и, взамен, защищать свою собственную власть."
 afghan.40.a: "Афганистан останется верным!"

 ## Focus Events ##

 afghan.100.t: "Судьба конституционной монархии"
 afghan.100.d: "На бумаге Афганистан является конституционной монархией, даже если король и его правительство обладают большей властью, чем Лойя джирга, они все еще несколько ограничены в том, что они могут сделать, некоторые должностные лица правительства утверждают, что Лойя джирга должна быть возвращена к своей старой роли; собрание, созываемое только тогда, когда король нуждается в ней, но с уже достигнутыми успехами будет трудно сделать это без оппозиции."
 afghan.100.a: "Пока мы их контролируем, они могут существовать"
 afghan.100.b: "Их присутствие больше не требуется"

 afghan.101.t: "Суд над Мусахибанами"
 afghan.101.d: "Братья Мусахибаны, король Мохаммед Надир Хан и его братья, годами держали власть в Афганистане, и теперь, когда они побеждены и истинный царь Афганистана держит власть, настало время привлечь предателей к суду."
 afghan.101.a: "Их наказание будет суровым."

 afghan.102.t: "Лояльность между племенами пуштунов"
 afghan.102.d: "Наше правительство сумело вести переговоры с племенами пуштунов, заверяя их в своей верности Афганистану."
 afghan.102.a: "Вместе мы можем сделать Афганистан великим"

 afghan.103.t: "Племенные влияния"
 afghan.103.d: "Хотя мы сделали многих врагов из племен пуштун и хазара, наши усилия по ограничению их влияния будут необходимы для того, чтобы сделать более низкие слои Афганистана свободными от угнетения."
 afghan.103.a: "Да здравствует социальная справедливость!"

 afghan.104.t: "Слабое влияние племен"
 afghan.104.d: "Благодаря тому, что члены племен приняли идеал о том, что племя является древней идеей, несовместимой с идеей новой афганской нации, племена пуштунов и хазары утратили определенную силу в нашем обществе, вместе мы построим афганское общество под правлением Бога."
 afghan.104.a: "Только Бог над Афганистаном!"

 afghan.105.t: "Дело об агрессивных религиях"
 afghan.105.d: "В последние годы роль ислама в Афганистане была поставлена под сомнение внешними влияниями и религиями: с российскими и британскими империями христианство было введено на нашу родину, а с индийского субконтинента, индуизма, сикхизма и буддизма широко распространилось. С революциями в России светское и атеистическое влияние стало новым агрессором."
 afghan.105.a: ""Сражайтесь с неверующими, пусть они найдут крепость!""
 afghan.105.b: "Они так долго принимают ислам, что могут остаться."

 afghan.106.t: "Рейд в Центральную Азию"
 afghan.106.d: "Мы наконец-то предприняли шаги, чтобы обогатить наших соседей, под руководством короля Хабибуллаха Калакани, вооруженных людей, проехавших через границу в Центральную Азию."
 afghan.106.a: "Ура!"

 afghan.107.d: "С недавним приобретением Афганистаном береговой линии они пытались построить военно-морский флот в основном с нуля. Чтобы ускорить этот процесс, они пришли к нам, чтобы попросить у нас светлого круизера, Эмиля Бертина, в обмен на финансовую компенсацию. Хотя Афганистан кажется неуместным, некоторые в нашем правительстве считают, что было бы разумно пройти через эту продажу, поскольку военно-морская мощь у входа в Персидский залив окажется неприятной для англичан."
 afghan.108.d: "К счастью, французы были достаточно любезны принять наше предложение, в основном из-за того, что предложенная нами компенсация связана с перспективой угрозы Британии в Персидском заливе."
 afghan.109.d: "К сожалению, французы отказались от продажи, ссылаясь на угрозу для их доступа в Персидский залив, если мы будем достаточно вооружены, нам придется искать корабли в другом месте."

 afghan.110.d: "В связи с недавним приобретением афганской береговой линии они пытались построить военно-морский флот, главным образом с нуля, чтобы ускорить этот процесс, они пришли к нам, чтобы попросить у нас в обмен на финансовую компенсацию тяжелого круизера «Ри Сан-Джорджио», а Афганистан предложил большую сумму для продажи, и некоторые предлагают принять решение об облегчении наших финансовых проблем."
 afghan.111.d: "Итальянцы были достаточно добры, чтобы принять наше великодушное предложение, и теперь Р.И. Сан-Джорджио отправляется в Гвардар, и с таким огромным кораблем, приближающимся к нашему берегу, мы сможем окрестить его как флагман нашего эмбрионального большого флота."
 afghan.112.d: "К сожалению, итальянцы отказались от продажи, ссылаясь на угрозу для их доступа в Персидский залив, мы делаем позу, если достаточно вооружены."

 afghan.113.d: "С недавним приобретением афганской береговой линии они пытаются построить военно-морский флот в основном с нуля. Чтобы ускорить этот процесс, они пришли к нам, чтобы попросить эсминцев Эмдена и Тигра в обмен на финансовую компенсацию. В то время как Афганистан кажется неуместным, некоторые члены нашего правительства считают, что было бы разумно пройти через эту продажу, поскольку военно-морская мощь на въезде в Персидский залив окажется неприятной для англичан, и работа с афганцами может дать нам больше влияния на Ближнем Востоке."
 afghan.114.d: "Хотя немецкий флот не большой, они все еще достаточно щедры, чтобы разрешить продажу двух эсминцев, и эти корабли теперь отплывают в афганские порты, чтобы присоединиться к нашему растущему флоту."
 afghan.115.d: "К сожалению, немцы отказались от продажи, ссылаясь на угрозу для их доступа в Персидский залив, мы делаем позу, если достаточно вооружены."

 afghan.116.d: "С недавним приобретением афганской береговой линии они пытаются построить флот в основном с нуля. Чтобы ускорить этот процесс, они пришли к нам просить у нас светлого круизера и двух разрушителей в обмен на финансовую компенсацию. Хотя Афганистан кажется неуместным, некоторые в нашем правительстве считают, что было бы разумно пройти через эту продажу, поскольку дружелюбная военно-морская держава в Западной Азии может оказаться полезной в наших будущих планах."
 afghan.117.d: "Японцы приняли великодушное предложение, говоря о паназиатском братстве, в котором мы можем оказаться внутри себя против империалистических аутсайдеров. Что бы это ни значило, мы рады, что они согласились, и мы начнем переводить средства в Токио, пока они посылают нам три корабля."
 afghan.118.d: "К сожалению, японцы отказались от продажи, ссылаясь на угрозу для их доступа к Индийскому океану, которую мы делаем, если мы достаточно вооружены, нам придется искать корабли в другом месте."

 afghan.141.d: "Мы откликнулись на просьбу, поступившую из полудня по всему миру, от маленького афганского государства, которое недавно закупило у нас корабли и сейчас активизировало наши отношения с целью обращения с просьбой о создании альянса, хотя они, безусловно, были бы полезны в борьбе с британской державой на Востоке, многие ставят под сомнение их полезность для нас и не желают ввязываться в войну на Ближнем Востоке."
 afghan.142.d: "Французы согласились, и теперь мы являемся полноправным членом Континентального союза, со всеми преимуществами, включая французскую защиту, которую принесет такой союз."
 afghan.143.d: "Французы отказались заключить с нами союз, ссылаясь на нашу непригодность."

 afghan.144.d: "Мы откликнулись на просьбу, поступившую из полудня по всему миру, от маленького афганского государства, которое недавно закупило у нас корабли и сейчас активизировало наши отношения с целью просить альянса, хотя они, безусловно, были бы полезны для расширения нашего влияния на Восток, многие ставят под сомнение их полезность для нас и не желают ввязываться в войну на Ближнем Востоке."
 afghan.145.d: "Немцы согласились, и теперь мы являемся полноправным членом Пакта Стали, со всеми преимуществами, включая германскую защиту, которую принесет такой союз."
 afghan.146.d: "Немцы отказались заключить с нами союз, ссылаясь на нашу непригодность."

 afghan.147.d: "Мы откликнулись на просьбу из Западной Азии, маленького афганского государства, которое недавно приобрело у нас корабли и сейчас активизировало наши отношения, с тем чтобы обратиться с просьбой о создании альянса, хотя они, безусловно, были бы полезны в деле расширения нашего влияния в Западной Азии, многие из них ставят вопрос о включении западноазиатской нации в наш союз, в то время как другие проповедуют единство всех азиатов и верят, что Афганистан станет оплотом против англичан."
 afghan.148.d: "Японцы согласились, и теперь мы являемся полноправным членом Сферы, со всеми преимуществами, включая японскую защиту, которую принесет такой союз."
 afghan.149.d: "Японцы отказались заключить с нами союз, ссылаясь на нашу непригодность."

 ###KR

 afg.0.t: "Мусульмане-шииты убегают от войны"
 afg.0.d: "На протяжении десятилетий положение шиитского меньшинства в Афганистане было плохим. Послевоенная ситуация не была золотом, и еще одна война могла только ухудшить ситуацию. Шииты в провинциях Герат и Фарах поощряли шиитское меньшинство к бегству в свою дружественную соседскую Персию. Будем надеяться, что персы вернут их обратно, поскольку нам нужны эти люди."
 afg.0.a: "Предатели!"

 afg.1.t: "Беженцы из Афганистана"
 afg.1.d: "Еще одна война началась между Афганистаном и Британским Раджом. Меньшинство шиитов в Афганистане опасается, что это только ухудшит их положение, и они решили начать здесь новую жизнь. Однако эта ситуация может быть более проблематичной, чем мы думаем. Если мы примем этих людей в нашу страну, правительство Афганистана будет глубоко расстроено нами."
 afg.1.a: "Они будут более чем гостеприимны, устроят их в Машаде!"
 afg.1.b: "Это было бы вмешательством в афганскую внутреннюю политику, отказ от них!"

 afg.2.t: "Персия закрывает свои границы"
 afg.2.d: "Персы сделали правильный выбор и отправили наших людей домой."
 afg.2.a: "Ура!"
 
 afg.3.t: "Саррафы покидают Афганистан"
 afg.3.d: "Саррафы - это группа индийских торговцев, которые путешествуют между Афганистаном и Дели, обмениваясь деньгами и товарами в обоих из них. Наша экономика вряд ли зависит от их визитов. Сейчас война надвигается, и границы не безопасны. Лишь некоторые из этих саррафов достаточно смелы, чтобы продолжать торговлю с нами."
 afg.3.a: "Нам все равно не нужны эти индийские собаки!"

 afg.4.t: "Саррафы возвращаются"
 afg.4.d: "Война окончена и границы теперь в безопасности, и ничто больше не мешает сарафам, и первая волна из них уже возобновила свою торговлю в Афганистане."
 afg.4.a: "Добро пожаловать, джентльмены!"

 #### Others ####

 AFG_FUHRERREICH_DESC: "Афганистан имеет долгую историю, когда и завоевания, и многие династии правят своей землей. После Великой войны Афганистан увидел, как власть их прогрессивного монарха Амануллы Хана разваливается в результате восстания таджика Хабибуллаха Калакани. Однако в 1929 году Мусахибаны захватят власть под правлением Мухаммеда Надира Хана. С тех пор королевство ведётся в относительном мире, но как Аманулла Хан, так и Калакани все еще находятся на свободе, и с ростом таких идей, как национализм, социализм и республиканец в Афганистане, одна искра может зажечь огонь и навсегда изменить страну."

