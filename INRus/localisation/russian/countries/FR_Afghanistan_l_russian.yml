 AFG_integration_A_desc: "Эта территория имеет небольшое население и промышленность, поэтому для интеграции этого региона в наше растущее государство требуются лишь небольшие расходы."
 AFG_integration_B: "Умеренная интеграция"
 AFG_integration_B_desc: "Эта территория имеет средний размер населения и промышленности, поэтому для интеграции этой территории в наше растущее государство требуются справедливые расходы."
 AFG_integration_C: "Тяжелая интеграция"
