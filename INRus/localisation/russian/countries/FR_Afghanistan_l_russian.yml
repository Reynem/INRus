 #### Focus Tree ####

 AFG_king_is_dead_long_live_king: "Король мёртв, живи долго."
 AFG_king_is_dead_long_live_king_desc: "После смерти короля Мухаммеда Надира Хана Афганистан должен теперь обратить свое внимание на обеспечение безопасности престола и продолжение монархии."
 AFG_new_generation: "Новое поколение"
 AFG_new_generation_desc: "Поскольку монархия находится в опасности, мы должны обеспечить, чтобы новое поколение руководителей в Мухаммеде Захире Хане могло успешно взять на себя руководство и направить правительство к стабильности."
 AFG_secure_musahiban_control: "Безопасный контроль над Мусахибаном"
 AFG_secure_musahiban_control_desc: "После смерти короля Мухаммеда Надира Хана мы должны обеспечить, чтобы династия Мусахибана оставалась под контролем страны - ради всех."
 AFG_sons_vengeance: "Месть Сына"
 AFG_sons_vengeance_desc: "Король Мохаммед Захир Хан не помилует, когда дело касается убийц его отца, сын отомстит за отца."
 AFG_secure_tribal_loyalty: "Надежная преданность племенам"
 AFG_secure_tribal_loyalty_desc: "Чтобы защитить монархию, важно, чтобы мы защитили верность от различных племен, которые управляют сельским Афганистаном."
 AFG_upheld_status_quo: "Поддержать статус Quo"
 AFG_upheld_status_quo_desc: "Самый надежный способ поддержания стабильности и безопасности — это ничего не изменить."
 AFG_traditional_style_ruling: "Традиционный стиль правления"
 AFG_traditional_style_ruling_desc: "Важно сохранить наследие династии Мусахибан, сохранив свой стиль правления и никогда не уклоняясь от традиций."
 AFG_appeace_religious_leaders: "Позвонить религиозным лидерам"
 AFG_appeace_religious_leaders_desc: "Чтобы сохранить свою власть над страной, мы должны быть готовы пойти на уступки религиозным лидерам, которые руководят большими собраниями наших сторонников."
 AFG_need_for_modernization: "Необходимость модернизации"
 AFG_need_for_modernization_desc: "Афганистан значительно отстает от многих своих соседей в области технологии, и крайне важно как можно скорее приступить к модернизации нашей инфраструктуры, с тем чтобы догнать их."
 AFG_return_of_the_king: "Возвращение короля"
 AFG_return_of_the_king_desc: "С его запланированным возвращением на афганский трон Аманулла Хан приступил к воссозданию всей нации по образу своих реформ."
 AFG_harsh_on_banditry: "Жестокое обращение с бандитизмом"
 AFG_harsh_on_banditry_desc: "Уничтожение бандитов, которые бродят по афганской сельской местности и уничтожают ее, является важным шагом в деле перестройки афганского общества и обеспечения того, чтобы все новые реформы были завершены."
 AFG_deal_with_musahibans: "Разберись с Мусахибанами"
 AFG_deal_with_musahibans_desc: "С возвращением Амануллы Хан на трон пришло время разобраться с оставшимися в живых заявителями Мусахибана и раз и навсегда обеспечить корону от всех потенциальных врагов."
 AFG_reimplement_amanullahs_reforms: "Повторить реформы Амануллы"
 AFG_reimplement_amanullahs_reforms_desc: "Реформы Амануллы были потеряны или забыты в его отсутствие."
 AFG_civil_rights_for_afghans: "Гражданские права афганцев"
 AFG_civil_rights_for_afghans_desc: "Афганцы слишком долго были лишены гражданских прав и свобод, которых они заслуживают, и пора их кодифицировать в закон, с тем чтобы все афганцы могли процветать."
 AFG_secure_equal_rights: "Обеспечение равных прав"
 AFG_secure_equal_rights_desc: "Для того чтобы создать подлинно справедливое и процветающее общество, мы должны обеспечить, чтобы все граждане имели равный доступ к правам."
 AFG_permanent_parliament: "Постоянный парламент"
 AFG_permanent_parliament_desc: "Мы не будем призывать к восстановлению сбалансированного и реформированного правительства без передачи нашей власти постоянному парламенту, который будет служить во время правления каждого короля с этого момента."
 AFG_sorayas_fight_for_women: "Борьба Сорайя за женщин"
 AFG_sorayas_fight_for_women_desc: "Женщины в значительной степени не представлены в афганском обществе и правительстве, но внимание нового короля было привлечено к их борьбе, и, возможно, настало время для их решения."

 AFG_afghan_revolution: "Афганская революция"
 AFG_afghan_revolution_desc: "Сейчас, когда народ поднимается и свергает монархию, пришло время создать постоянную революцию и подлинное народное правительство в Афганистане."
 AFG_socialism_in_afghanistan: "Социализм в Афганистане"
 AFG_socialism_in_afghanistan_desc: "Мы должны сделать все возможное для того, чтобы социализм в Афганистане процветал против многих врагов, которые стремятся его уничтожить."
 AFG_destroy_enemies_revolution: "Уничтожить врагов революции"
 AFG_destroy_enemies_revolution_desc: "Революция будет действительно безопасной только тогда, когда все ее враги будут полностью и полностью уничтожены."
 AFG_socialist_propaganda: "Пропаганда социализма"
 AFG_socialist_propaganda_desc: "Одним из наилучших способов охвата нашего населения и его ознакомления с идеалами революции являются пропагандистские усилия."
 AFG_tarakis_land_reform: "Земельная реформа Тараки"
 AFG_tarakis_land_reform_desc: "Нур Мухаммад Тараки имеет тесные связи с Советским Союзом и стремится реализовать знания, которые он узнал о земельной реформе здесь, в Афганистане."
 AFG_strengthen_general_secretary: "Укрепление Генерального секретаря"
 AFG_strengthen_general_secretary_desc: "Должность Генерального секретаря сильна по имени, но не у власти."
 AFG_curb_tribal_influence: "Смещение влияния племен"
 AFG_curb_tribal_influence_desc: "Лидеры племен смягчили последствия народной революции в сельских районах Афганистана."
 AFG_secure_social_justice: "Обеспечение социальной справедливости"
 AFG_secure_social_justice_desc: "Важно, чтобы все афганцы имели равные права в соответствии с законом."
 AFG_rapid_literacy_campaign: "Кампания по быстрой ликвидации неграмотности"
 AFG_rapid_literacy_campaign_desc: "Для того чтобы модернизировать нашу страну, крайне важно, чтобы мы обеспечили программы ликвидации неграмотности для сельского населения Афганистана."
 AFG_socialist_modernization: "Социалистическая модернизация"
 AFG_socialist_modernization_desc: "В то время как наша нация должна модернизироваться, важно, чтобы мы помнили народную революцию в наших реформах."
 AFG_renounce_pro_soviet_politics: "Отмена просоветовательной политики"
 AFG_renounce_pro_soviet_politics_desc: "В то время как и мы, и Советский Союз революционны по имени, сходство заканчивается на этом, мы не можем и не должны поддерживать советскую империалистическую политику, мы должны отказаться от нее перед миром."
 AFG_establish_parliament: "Учредить парламент"
 AFG_establish_parliament_desc: "Народный парламент является важным аспектом социализма, как и любой другой."
 AFG_rights_for_men_and_women: "Права мужчин и женщин"
 AFG_rights_for_men_and_women_desc: "Права не могут применяться к одному полу, а не к другому среди наших граждан, и они должны предоставляться в равной степени мужчинам и женщинам."
 AFG_free_elections: "Свободные выборы"
 AFG_free_elections_desc: "Мы должны обеспечить, чтобы каждый гражданин Афганистана имел право и возможность голосовать, с тем чтобы все голоса были услышаны."
 AFG_provide_education: "Обеспечение образования"
 AFG_provide_education_desc: "Просвещение каждого афганского гражданина является огромным шагом вперед на пути к полной модернизации."
 AFG_encourage_progressive_voices: "Поощрять прогрессивные голоса"
 AFG_encourage_progressive_voices_desc: "Мы должны поощрять и поощрять прогрессивные голоса в рамках нашего правительства, с тем чтобы мы могли продолжать вечную революцию народа, которую он осуществляет и ради нее."
 AFG_strengthen_afghan_democracy: "Укрепление афганской демократии"
 AFG_strengthen_afghan_democracy_desc: "Укрепление нашей демократии и обеспечение того, чтобы каждый голос был услышан, имеет важное значение для создания справедливого и прочного правительства."

 AFG_kalakanis_return: "Возвращение Калакани"
 AFG_kalakanis_return_desc: "Хабибулла Калакани спустился из Туркестана и вновь подтвердил свою власть над Афганистаном."
 AFG_remove_barakzai_kings: "Убрать короли Баракзай"
 AFG_remove_barakzai_kings_desc: "Афганистан достаточно страдал под слабым руководством королей без зубов."
 AFG_weaken_tribal_identity: "Слабая племенная идентичность"
 AFG_weaken_tribal_identity_desc: "Слишком долго племена разделяли сельские районы Афганистана, и гораздо лучше, чтобы люди отождествлялись с нацией, а не со своим племенем, и мы должны стремиться к достижению этой цели."
 AFG_purge_revolutionaries: "Уничтожить революционеров"
 AFG_purge_revolutionaries_desc: "социалистические революционеры, угрожающие нации, все еще присутствуют в нашем правительстве, и мы должны очистить их раз и навсегда, чтобы обеспечить безопасность нашего нового режима."
 AFG_defender_of_islam: "Защитник ислама"
 AFG_defender_of_islam_desc: "Хабибулла Калакани должен утвердить свою позицию в качестве Защитника ислама как для того, чтобы сплотить сельское население, так и для того, чтобы утвердить превосходство Афганистана над регионом."
 AFG_traditional_gender_roles: "Традиционные гендерные роли"
 AFG_traditional_gender_roles_desc: "Некоторые вещи не могут измениться. Роль, которую играют женщины в Афганистане, является одной из них. Мы должны придерживаться традиций сохранения стабильности и безопасности."
 AFG_deal_with_aggressive_religions: "Разбирайтесь с агрессивными религиями"
 AFG_deal_with_aggressive_religions_desc: "Агрессивные религии в Афганистане всегда разделяли свой народ и ослабляли его правительство."
 AFG_better_tajik_pashtun_relations: "Улучшение таджикско-пуштунских отношений"
 AFG_better_tajik_pashtun_relations_desc: "Наш новый режим никуда не пойдёт, если мы не улучшим наши отношения с таджикско-пуштунскими племенами, которые управляют большей частью сельской страны."
 AFG_bandit_king_afghanistan: "Бандитский король Афганистана"
 AFG_bandit_king_afghanistan_desc: "Новый режим Хабибуллы Калакани навсегда изменит историю Афганистана."
 AFG_guerilla_raiders: "Рейдеры Герилья"
 AFG_guerilla_raiders_desc: "Лучший способ справиться с нашими слабыми соседями - быстро и постоянно нападать на них, они не будут достаточно сильными или организованными, чтобы остановить нас, и мы сможем получить от этого прибыль."

 AFG_develop_nation: "Развивать нацию"
 AFG_develop_nation_desc: "Инфраструктура в Афганистане всегда отсутствовала, и уже давно пора улучшить ее и улучшить жизнь нашего населения."
 AFG_towards_modernization: "На пути к модернизации"
 AFG_towards_modernization_desc: "Модернизация для Афганистана всегда казалось далекой, но сейчас она ближе, чем когда-либо, и мы готовы подготовить страну к ее прибытию."
 AFG_start_industrialization: "Начать индустриализацию"
 AFG_start_industrialization_desc: "Наиболее важным шагом в процессе модернизации является индустриализация страны, что даст нам ценные ресурсы, которые мы сможем впоследствии потратить на инфраструктуру и военные улучшения."
 AFG_urbanize_kabul: "Урбанизация Кабула"
 AFG_urbanize_kabul_desc: "Для того чтобы быть единым, Кабул должен выглядеть как столица великой нации."
 AFG_modernize_infrastucture: "Модернизация инфраструктуры"
 AFG_modernize_infrastucture_desc: "Давно пора начать совершенствовать нашу инфраструктуру как внутри городов, так и за их пределами, что подтолкнет нас от отсталой нации к реальному игроку на мировой арене."
 AFG_attract_foreign_investors: "Привлечение иностранных инвесторов"
 AFG_attract_foreign_investors_desc: "Инвестиции столь же важны, как и государственные программы создания новой и прочной экономики."
 AFG_iranian_imports: "Иранский импорт"
 AFG_iranian_imports_desc: "Иран уже давно является одним из наших основных торговых партнеров."
 AFG_grow_domestic_buisnesses: "Расти домашнюю буйволку"
 AFG_grow_domestic_buisnesses_desc: "Мы не можем полагаться исключительно на импорт для поддержания нашего населения, мы должны обеспечить, чтобы наш собственный внутренний бизнес мог процветать и обеспечивать все население Афганистана."
 AFG_market_for_foreign_industries: "Рынок иностранных предприятий"
 AFG_market_for_foreign_industries_desc: "Для дальнейшего развития иностранного производства мы должны открыть нашу страну как рынок для иностранной промышленности."
 AFG_search_for_resources: "Поиск ресурсов"
 AFG_search_for_resources_desc: "Обнаружение огромных запасов природных ресурсов могло бы стать прорывом в наших усилиях по модернизации и индустриализации."
 AFG_purchase_tribal_land: "Покупка земли, принадлежащей племенам"
 AFG_purchase_tribal_land_desc: "Покупка земли у этих племен — это единственный способ использовать их ресурсы, не вызывая у них невзгоды."
 AFG_expand_kabul_university: "Расширение Кабульского университета"
 AFG_expand_kabul_university_desc: "Еще одним важным элементом наших усилий по модернизации является высшее образование."
 AFG_focus_agriculture: "Уделение особого внимания сельскому хозяйству"
 AFG_focus_agriculture_desc: "Для того чтобы население было накормлено и здорово, мы должны сосредоточить свое внимание не только на сельском хозяйстве, но и на промышленности."
 AFG_agricultural_infrastructure: "Сельскохозяйственная инфраструктура"
 AFG_agricultural_infrastructure_desc: "Наши методы ведения сельского хозяйства намного отстают от методов, применяемых нашими соседями."
 AFG_import_foreign_tractors: "Импортировать зарубежные тракторы"
 AFG_import_foreign_tractors_desc: "Хотя у нас пока нет средств для массового производства сельскохозяйственного оборудования, мы также можем импортировать его из иностранных государств до тех пор, пока не сможем сами производить его."
 AFG_modernize_irrigation: "Модернизация ирригации"
 AFG_modernize_irrigation_desc: "Модернизация наших ирригационных систем на наших фермах будет во многом способствовать улучшению нашей сельскохозяйственной системы в целом."
 AFG_subsidise_grain_production: "Субсидирование производства зерна"
 AFG_subsidise_grain_production_desc: "Субсидирование нашего производства зерна является важным аспектом дальнейшей модернизации сельского хозяйства и обеспечения продовольствием нашего населения."
 AFG_fruits_and_nuts: "Фрукты и орехи"
 AFG_fruits_and_nuts_desc: "Фрукты и орехи должны стать новым основным продуктом нашего сельского хозяйства и питания, с тем чтобы диверсифицировать нашу сельскохозяйственную промышленность и обеспечить достаточное количество продовольствия для нашего населения с остатками на экспорт."
 AFG_control_opium_production: "Контроль за производством опиума"
 AFG_control_opium_production_desc: "Хотя опий приносит значительную прибыль на черном рынке, мы не можем позволить себе больше рисковать тем, что он вредит нашему населению, мы должны строго контролировать его производство, с тем чтобы наше население было здоровым и продуктивным."
 AFG_new_silk_road: "Новый шелковый путь"
 AFG_new_silk_road_desc: "Новый Шелковый путь торговли и промышленности пройдёт прямо через сердце Афганистана, наши усилия по модернизации в конечном итоге окупятся и сделают нас богатыми, не смотря ни на что."

 AFG_recieve_german_aid: "Немецкая помощь"
 AFG_recieve_german_aid_desc: "Помощь со стороны Немецкого Рейха может в значительной степени помочь нам сохранить свое положение в регионе и подорвать наши модернизационные и индустриализации."
 AFG_recieve_british_aid: "Получите британскую помощь"
 AFG_recieve_british_aid_desc: "Помощь со стороны Британской империи могла бы в значительной степени помочь нам сохранить свое положение в регионе и подорвать наши модернизационные и индустриализации."
 AFG_recieve_soviet_aid: "Получите советскую помощь"
 AFG_recieve_soviet_aid_desc: "Помощь со стороны Советского Союза могла бы в значительной степени способствовать укреплению нашей позиции в регионе и раздуванию наших стимулов к модернизации и индустриализации."
 AFG_learn_from_west: "Учись у Запада"
 AFG_learn_from_west_desc: "Наши цели модернизации и индустриализации оказывают серьезное влияние на Запад, и дальнейшее извлечение из них уроков, даже если они противоречат нашим собственным целям, может быть чрезвычайно ценно для наших усилий."
 AFG_learn_railway_construction: "Учись строить железные дороги"
 AFG_learn_railway_construction_desc: "Железнодорожное строительство — это то, чего не хватало в Афганистане на протяжении десятилетий."
 AFG_collaborate_with_germany: "Сотрудничество с Германией"
 AFG_collaborate_with_germany_desc: "Сотрудничество с валькистами в Германии позволит нам очистить ценные инструменты и идеи, которые мы можем использовать для дальнейшей индустриализации нашей страны и превзойти наших соседей."
 AFG_friend_of_empire: "Друг Империи"
 AFG_friend_of_empire_desc: "Сотрудничество с Британской империей очистит нас от ценных инструментов и идей, которые мы можем использовать для дальнейшей индустриализации нашей страны и превзойдет наших соседей."
 AFG_soviet_collaboration: "Советское сотрудничество"
 AFG_soviet_collaboration_desc: "Сотрудничество с коммунистами в Советском Союзе очистит нас от ценных инструментов и идей, которые мы можем использовать для дальнейшей индустриализации нашей страны и превосходства над нашими соседями."

 AFG_reform_afghan_armed_forces: "Реформирование Афганских вооруженных сил"
 AFG_reform_afghan_armed_forces_desc: "Наши усилия по модернизации не были бы полными без перестройки наших вооруженных сил, которые отчаянно нуждаются в реформе, если они когда-либо будут надеяться быть сильнее наших соседей."

 AFG_afghan_army: "Афганская армия"
 AFG_afghan_army_desc: "Афганская армия уже давно использует устаревшее оборудование и стратегию."
 AFG_foreign_assistance: "Иностранная помощь"
 AFG_foreign_assistance_desc: "Хотя Афганистан традиционно является изолированной страной, возможно, настало время обратиться за иностранной помощью в целях перестройки и индустриализации нашей армии."
 AFG_learn_from_previous_wars: "Учитесь на предыдущих войнах"
 AFG_learn_from_previous_wars_desc: "В Афганистане велись многочисленные войны, в том числе против русских и британских империй."
 AFG_expand_funding_for_army: "Расширить финансирование армии"
 AFG_expand_funding_for_army_desc: "Усилия по модернизации армии будут осуществляться только без надлежащего финансирования со стороны нашего правительства."
 AFG_modernize_military_communication: "Модернизация военной связи"
 AFG_modernize_military_communication_desc: "Мы должны модернизировать наши методы коммуникации в рамках нашей армии, с тем чтобы иметь возможность противостоять нашим врагам."
 AFG_future_of_cavalry: "Будущее кавалерии"
 AFG_future_of_cavalry_desc: "Хотя кавалерия всегда была одним из основных элементов афганской армии, она не будет соответствовать западным танкам и бронированным автомобилям."
 AFG_purchase_foreign_trucks: "Закупка иностранных грузовых автомобилей"
 AFG_purchase_foreign_trucks_desc: "Несмотря на то, что в настоящее время нам не хватает промышленности для производства наших собственных бронированных грузовиков, мы более чем в состоянии импортировать их из других стран за дешевую плату."
 AFG_modernize_equipments: "Модернизация оборудования"
 AFG_modernize_equipments_desc: "Обеспечение того, чтобы все оборудование было модернизировано и соответствовало стандартам, важно для того, чтобы наши военные были готовы противостоять любой угрозе."
 AFG_invest_artillary: "Инвестирование в артиллерийскую промышленность"
 AFG_invest_artillary_desc: "Артиллерия стала важной частью войны за последние несколько десятилетий, и если мы хотим соревноваться с Западом в военном превосходстве в Центральной Азии, инвестирование в артиллерию является важным шагом."
 AFG_doctrine_for_army: "Доктрина армии"
 AFG_doctrine_for_army_desc: "Наша армия должна следовать доктрине, если мы надеемся на ее успех."
 AFG_recruitment_efforts: "Усилия по набору персонала"
 AFG_recruitment_efforts_desc: "Усилия по вербовке населения в целом могут в значительной степени способствовать увеличению численности наших врагов."
 AFG_tribal_recruitment: "Вербовка на племенной основе"
 AFG_tribal_recruitment_desc: "Вербовка из избранных племен может в значительной степени способствовать как умиротворению сельского сопротивления в нашей стране, так и заполнению рядов нашей армии."

 AFG_rebuild_air_force: "Восстановление военно-воздушных сил"
 AFG_rebuild_air_force_desc: "У Афганистана никогда не было большого количества военно-воздушных сил, но создание одного, как бы мало он ни был, является необходимым шагом в наших усилиях по модернизации."
 AFG_soviet_air_planes: "Советские воздушные самолеты"
 AFG_soviet_air_planes_desc: "Закупка самолетов из Советского Союза будет во многом способствовать укреплению наших военно-воздушных сил и обеспечению нашего воздушного доминирования над нашими соседями."
 AFG_british_air_planes: "Британские воздушные самолеты"
 AFG_british_air_planes_desc: "Закупка самолётов у Британской империи будет во многом способствовать укреплению наших военно-воздушных сил и обеспечению нашего воздушного доминирования над нашими соседями."
 AFG_domestic_air_production: "Внутреннее производство воздуха"
 AFG_domestic_air_production_desc: "Строительство наших самолётов будет во многом способствовать укреплению наших военно-воздушных сил и обеспечению нашего воздушного доминирования над нашими соседями, не ставя нас перед западными державами."
 AFG_train_afghan_pilots: "Подготовка афганских пилотов"
 AFG_train_afghan_pilots_desc: "Для того чтобы у нас были военно-воздушные силы, у нас должны быть как самолеты, так и пилоты, и мы должны обучить наших собственных афганских пилотов, чтобы воплотить эту мечту в реальность."

 AFG_coastal_defences: "Прибрежная оборона"
 AFG_coastal_defences_desc: "Пока флот хорош, нам нужна линия обороны, чтобы упасть."
 AFG_afghanistan_on_the_high_seas: "по открытому морю"
 AFG_afghanistan_on_the_high_seas_desc: "С нашими завоеваниями на Юг мы создали присутствие на океанах, чтобы не допустить превращения нашего доступа к морю в слабость, мы должны создать сильный флот, который сможет защитить нашу береговую линию."
 AFG_naval_production_expansion: "Расширение военно-морского производства"
 AFG_naval_production_expansion_desc: "Расширение существующих и строительство новых верфей позволит увеличить мощности для производства судов."
 AFG_small_craft_designs: "Конструкция малых судов"
 AFG_small_craft_designs_desc: "Большой флот начинается с самого маленького шага, и этот шаг будет заключаться в разработке конструкций для малых судов, которые могут защитить наши побережья."
 AFG_expand_gwardar_port: "Расширить порт Гвадар"
 AFG_expand_gwardar_port_desc: "Благодаря тому, что Гвадар был взят у британских оккупантов, мы теперь видим возможность ремонта и расширения находящегося там порта."
 AFG_futher_dockyard_construction: "Сооружение кустарника"
 AFG_futher_dockyard_construction_desc: "Для достижения нашей цели создания обширного флота мы боремся с имеющимися у нас производственными возможностями."
 AFG_cruiser_designs: "Дизайны круизеров"
 AFG_cruiser_designs_desc: "Хотя мы не в состоянии высадить боевые корабли и авианосцы, теперь достаточно будет создать крейсеры как наши крупнейшие суда."
 AFG_naval_bomber_designs: "Дизайны бомбардировщиков военно-морского флота"
 AFG_naval_bomber_designs_desc: "Контролирование неба имеет огромное значение для контроля над морями, находящимися под ними, и новая сила военно-морских бомбардировщиков может позволить нам нанести еще больший удар по тем, кто впадает в наши воды с неба."
 AFG_building_a_fleet: "Огромные морские инвестиции"
 AFG_building_a_fleet_desc: "Чтобы создать стартовый флот, мы будем расходовать огромные средства на морские закупки и на нашу отечественную промышленность, и это, как мы надеемся, вызовет восстание в флоте, который мы сможем развивать в предстоящие годы."
 AFG_purchase_foreign_ships: "Закупка иностранных судов"
 AFG_purchase_foreign_ships_desc: "Закладывание фундамента одного лишь флота требует больших затрат и времени, поэтому, чтобы позволить нам быстро высадить флот, мы должны купить корабли из-за границы."
 AFG_construct_iranian_port: "Строительство иранского порта"
 AFG_construct_iranian_port_desc: "Расширение портов в этом регионе позволит нам более эффективно осуществлять свою деятельность в Персидском заливе."
 AFG_gwardar_dockyards: "Гвадарские докьярды"
 AFG_gwardar_dockyards_desc: "Мы создадим условия для строительства новых судов в порту и вокруг него."
 AFG_coastal_airports: "Прибрежные аэропорты"
 AFG_coastal_airports_desc: "Одно только строительство военно-воздушных баз на нашем побережье позволит нашим военно-воздушным силам помочь нашим военно-морским силам контролировать нашу береговую линию."
 AFG_afghan_landing_craft: "Афганский посадочный корабль"
 AFG_afghan_landing_craft_desc: "Наш флот не должен просто защищаться, мы должны создать посадочные аппараты, чтобы мы могли нанести удары по войскам."
 AFG_doctrine_research: "Изучение зарубежных доктрин"
 AFG_doctrine_research_desc: "Корабли не могут быть полезными без хорошей доктрины, которой они могли бы руководствоваться, и нам нужно, чтобы наши лучшие военно-морские теоретики изучали доктрины великих военно-морских держав, чтобы однажды мы могли быть такими же великими, как они."
 AFG_afghan_marines: "Афганские морские пехотинцы"
 AFG_afghan_marines_desc: "Создание новых сил, интегрированных в наш военно-морский флот, с целью обеспечения безопасности на пляже, позволит нам повысить компетентность в наступательных военно-морских операциях против врагов."

 AFG_into_world: "В мир"
 AFG_into_world_desc: "С нашими покупками иностранных судов мы можем использовать эти новые отношения, установленные с этими покупками, чтобы присоединиться к нашим предпочтениям в отношении международного союза."

 #### Decisions ####

 AFG_expand_afghanistan: "Расширение Афганистана"
 AFG_expand_afghanistan_desc: "Несмотря на кончину Империи Дуррани, афганский народ по-прежнему держит в руках большое количество имперской амбиции с нашей горной крепостью, окруженной Великими державами, чтобы выжить и функционировать как нечто большее, чем просто рабы окружающих нас держав, мы должны стремиться стать самой великой державой. Расширение территории — это самый очевидный способ сделать это, и когда мусульмане нашего Востока призывают к свободе на Восток, народы на Севере требуют безопасности от Советов и меньшинства, мечтающие о свободе от персидской тирании, у нас есть много возможностей для экспансии."
 AFG_integration: "Территориальная интеграция"
 AFG_integration_desc: "Хотя наши завоевания увенчались успехом, задача обеспечения безопасности этих территорий еще не завершена, мы должны стремиться надлежащим образом интегрировать эти территории в наше пространство, с тем чтобы они рассматривались как афганцы как Кабул."
 AFG_durrani_back: "Провозгласить Афганскую Империю"
 AFG_declare_empire: "Афганская империя"
 AFG_declare_empire_desc: "Наследие Дуррани было искуплено, и теперь Афганистан правит обширной территорией, соответствующей большей части того, что имела бывшая Империя Дуррани. Мы больше не можем править как просто Королевство Афганистан, мы объявим конец королевству и объявим Империю Афганистана вместо нее!"

 AFG_attack_raj: "Нападение на Британского Раджа"
 AFG_attack_raj_desc: "Западные мусульмане Индии призывают к освобождению, и мы позаботимся о том, чтобы они не были разочарованы."
 AFG_attack_IND: "Нападение на Индию"
 AFG_attack_IND_desc: "Западные мусульмане Индии призывают к освобождению, и мы позаботимся о том, чтобы они не были разочарованы."
 AFG_attack_sov: "Война за Душанбе"
 AFG_attack_trk: "Война за Душанбе"
 AFG_attack_per: "Проникнуть в Восточную Персию"
 AFG_attack_kas: "Кашмир"
 AFG_attack_bal: "Приложение Белуджистан"
 AFG_attack_pun: "Приложение Пенджаб"

 AFG_integrate_pesh: "Инкорпорировать Пешавара"
 AFG_integrate_quet: "Инкорпорировать Quetta"
 AFG_integrate_balu: "Включить Белуджистан"
 AFG_integrate_sind: "Инкорпорировать погрешность"
 AFG_integrate_jais: "Интегрировать Джайсалмера"
 AFG_integrate_punj: "Интеграция Пенджаба"
 AFG_integrate_kash: "Интеграция Кашмира"
 AFG_integrate_kang: "Инкорпорировать Kangra"
 AFG_integrate_dush: "Инкорпорировать Душанбе"
 AFG_integrate_sist: "Интегрировать Систан"
 AFG_integrate_xora: "Интегрировать Xorasan"

 AFG_light_effort: "Уже проходит легкая интеграция"
 AFG_moderate_effort: "Уже налаживается умеренная интеграция"
 AFG_heavy_effort: "Уже сейчас трудная интеграция"

 AFG_ship_procurment: "Покупка иностранных судов"
 AFG_ship_procurment_desc: "Чтобы ускорить процесс создания нашего флота, мы покупаем корабли у ряда мировых держав."
 AFG_frenchbuy: "Закупка французского легкого круизера"
 AFG_italybuy: "Закупка итальянского тяжелого круизера"
 AFG_germanybuy: "Закупить два немецких истребителя"
 AFG_japanbuy: "Закупить два японских истребителя и лёгкий крузер"

 AFG_japanalliance: "Присоединяйтесь к сфере совместной деятельности"
 AFG_germanyalliance: "Присоединяйся к Пакту Стали"
 AFG_frenchalliance: "Присоединяйтесь к Континентальному соприкосновению"


 #### National Spirits ####

 AFG_tribal_influences_afghanistan_idea: "Влияние племен в Афганистане"
 AFG_tribal_influences_afghanistan_idea_desc: "Народы, большинство из всех племен пуштунов, оказывают большое влияние на управление Афганистаном и на жизнь народа в стране, и это будет трудно ограничить, поскольку это будет означать ограничение деятельности одного из важных компонентов Афганистана."
 AFG_tribal_influences_afghanistan1_idea: "Преданность племенам"
 AFG_tribal_influences_afghanistan2_idea: "Влияние племен"
 AFG_tribal_influences_afghanistan3_idea: "Влияние слабого племени"

 AFG_empire_made: "Империя Афганистан"
 AFG_empire_made_desc: "Декларация Империи была встречена с приветствием среди населения, которое сейчас гордо стоит после того, как годы иностранного господства триумфально успокоились."
 AFG_afghan_nationalism_idea: "Афганский национализм"
 AFG_afghan_nationalism_idea_desc: "Народ Афганистана — гордый народ со своими собственными мечтами и амбициями."
 AFG_mounting_opposition_king_idea: "Сопротивление королю"
 AFG_mounting_opposition_king_idea_desc: "Король Мохаммед Надир Хан сталкивается с растущим сопротивлением своему правлению со стороны сторонников как Амануллы Хана, так и Хабибуллаха Калакани, а также со стороны социалистов и республиканцев, выступающих против монархии."
 AFG_king_is_dead_idea: "Государство Хаос"
 AFG_king_is_dead_idea_desc: "-- Король мёртв! Король мёртв! -- можно услышать по всему Афганистану. -- Эти слова, наряду с внезапным убийством короля Мохаммеда Надира Хана, привели к нестабильности и хаосу в стране. Законность правительства подвергается сомнению."
 AFG_opposition_mohammed_zahir_idea: "Противодействие Мохаммеду Захиру Хану"
 AFG_opposition_mohammed_zahir_idea_desc: "Новый молодой монарх сталкивается с противодействием как преданных Амануллы Хана, так и лояльных хабибулла Калакани, но с его дядями на его стороне его правление выживет."
 AFG_opposition_revolution_idea: "Противодействие революции"
 AFG_opposition_revolution_idea_desc: "Реакторы и монархисты решительно выступают против республиканской революции."
 AFG_opposition_amanullah_idea: "Противодействие Аманулла Хану"
 AFG_opposition_amanullah_idea_desc: "Возвращение короля Амануллы Хана не было принято всем народом Афганистана, но с памятью о его прогрессивных реформах у него есть сторонники наряду с оппозицией."
 AFG_opposition_kalakani_idea: "Противодействие Хабибуллаху Калакани"
 AFG_opposition_kalakani_idea_desc: "Как таджик и Бандит, Хабибулла Калакани сталкивается с большим сопротивлением, хотя некоторым консерваторам он может понравиться, он не так нравится пуштунам, которые стремятся к власти пуштуна или к правительству республиканцев."
