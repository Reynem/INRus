 #### Ideas
 IEA_native_unrest: "Неокончательная война"
 IEA_native_unrest_desc: "Вслед за Великой Войной Италия смотрит на возможность небольшой пограничной стычки для полного вторжения в Эфиопию. 10 лет спустя колония по-прежнему остается без прикосновений, при этом маленькая итальянская империя едва может пощадить людей и материальные средства для своего драгоценного камня в короне, в результате чего колониальные силы ведут нескончаемую войну против сопротивления, которое кажется бездонным в телах, которые она может поставить на поле."
 IEA_pride_of_italy: "Гордость Италии"
 IEA_pride_of_italy_desc: "В то время как колония может быть нестабильной на земле, итальянцы с гордостью смотрят на свою обширную колонию, насчитывающую почти 20 миллионов человек."
 IEA_small_native_revolt: "Револьт коренного населения"
 IEA_recent_revolt: "Недавний револьт коренного населения"
 IEA_east_african_wars: "Восточноафриканские войны"
 IEA_east_african_wars_desc: "Крушение итальянского колониального режима дало нам свободу, но также привело к возникновению этнического конфликта в масштабах, невиданных ранее в этом регионе, и при таком состоянии анархии мы должны защитить наш народ от тех, кто стремится разрушить его свободу."
 IEA_anti_partisan_1939: "Антипартизанская кампания"

