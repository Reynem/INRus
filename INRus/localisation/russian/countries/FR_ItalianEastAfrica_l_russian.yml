 #### Events
 iearevolt.1.t: "[Револьтер. GetNameDefcap] заявляет о своей независимости"
 iearevolt.1.d: "После того, как мы выгнали наши войска, [революционер, GetNameDef] объявил независимость, должны ли мы раздавить их нашими высшими силами, или же мы должны сократить наши потери, чтобы сосредоточиться в другом месте?"
 iearevolt.1.a: "Они должны оставаться частью Империи!"
 iearevolt.1.b: "У нас есть более важные вопросы, чем сокрушение местных восстаний."

  iearevolt.2.t: "Победа против итальянских колонистов!"
 iearevolt.2.d: "Когда мы начали наше восстание, никто не знает, к чему оно должно было привести, некоторые были пессимистичными, другие были более оптимистичными, но все были полны решимости бороться за нашу независимость, и теперь эта решимость принесла свои плоды, и после этой долгой войны у итальянских колонистов не было иного выбора, кроме как предложить нам мир и признать, что их правление над нашей страной закончилось. Этот день навсегда будет отмечен как славный день нашей независимости."
 iearevolt.2.a: "Давайте радоваться!"

