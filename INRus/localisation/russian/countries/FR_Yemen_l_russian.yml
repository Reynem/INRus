 ###Ideas
 YEM_outdated_army: "Устаревшие вооруженные силы"
 YEM_outdated_army_desc: "Наши военные никогда не модернизировались с тех пор, как арабские восстания и наша армия не в состоянии защитить эту землю или сражаться за нее в какой-то гипотетической и нереалистичной второй Великой войне"
 YEM_independent_in_name_only: "Только по имени"
 YEM_independent_in_name_only_desc: "Как и большинство людей в мире, Солнце никогда не сидит на влиянии Британской империи здесь, в Южной Аравии, вообще-то, вся Аравия, также и Масхрик, Палестина, Египет и 25% мирового населения и остального мира, так почему мы, йеменцы, должны быть исключением?"
 YEM_Mashriqi_Military_Support: "Военная поддержка &lt; &lt; Масхрики &gt; &gt;"
 YEM_Mashriqi_Military_Support_desc: "Согласно соглашению, заключенному в Масхрики в Йемене, король масхрикского племени Фейсал направил несколько дивизий с несколькими офицерами Масхрики, чтобы в основном раздражать британцев и бросить вызов им не по доброй воле, эти войска находятся под руководством генерала-багдададского генерала Исмаила Сафвата, который в прошлом году отдал все командование Джамалю Джамилю."

