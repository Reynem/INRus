 ### Advisors ###
 JBS_ulemma_influence: "Улемма"
 JBS_ulemma_influence_advisor_desc: "§YBackground: §! §lliterly переводится как \"the learned ones\", the Ulemma are the guardians and interpreters of religious knowledge within Islam. Within our society, these groups holds tremendous powers as they not only have sway over the pious masses who anxiously await their religious dogmas but they are also the only form of educators within our realm and can as such already from a young age play a key role in the life of our citizens.\n\nWithin the Ulemma there is also a divide between those toeing the Wahhabist line, swearing fealty to the Imam of Riyadh (Ibn Saud) and those educated by the Hejazi religious apparatus in Mecca. Although the latter are in general less strict and more open to religious dialogue, they nonetheless share some fanatic aspects of their Wahhabist colleagues, a result of decades of influence imposed by Riyadh.§!"

 JBS_bedouin_influence: "Бедуины"
 JBS_bedouin_influence_advisor_desc: "Бедуины - это жизнь и кровь арабского общества, известный своим беззаботным и аполитическим образом жизни, они, тем не менее, являются великим врагом тех, кто хочет централизовать государство, поскольку оказалось практически невозможным ввести надежные налоги или квоты для призыва на военную службу крайне нестабильных бедуинских племен."

 JBS_urban_nobility_influence: "Городское достоинство"
 JBS_urban_nobility_influence_advisor_desc: "§YBackground: §! § Хотя это может показаться странным, что городские знатные люди имеют такое большое влияние в такой пустой стране, не обманывайся. Вокруг различных оазисов арабского интерьера появились большие поселённые общины, которые полагаются на мудрость и управление городскими знаменитостями. Нигде это не более заметно, чем в городе Хаил, где торговцы, принцессы и аристократические фигуры на протяжении веков правили верховной властью. Эти группы, часто заботясь об увеличении своей собственной прибыли, оказывают значительное влияние на трон и в прошлом уже играли роль царя."

