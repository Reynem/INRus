 turnews.1.t: "Вторжение [ARM.GetName]"
 turnews.1.d: "Разрушение Оттоманской империи многими специалистами было раскритиковано как неустойчивая ситуация, не в последнюю очередь из-за реваншизма, который должен был появиться в позорном Султанате."Armenian Highlands" was given to the titular nation-state, despite much of the region being heavily settled by Ottoman Turks.\n\nThe Ottomans have trumpeted that such "rightful territory" should be under their demesne, demanding the region of Eastern Trabzon from Armenia, while calling for a referendum in Erserum. But the Armenian government has refused the cession of this territory. The order was given from Ankara for the army to begin an invasion."
 turnews.1.a: "Мы победим!"
 turnews.1.b: "Что это означает для стабильности на Кавказе?"

 turnews.2.t: "Столкновения на границе в Эрзинкане"
 turnews.2.d: "Курдское государство обязано своим существованием разделу Османской империи, и неудивительно, что это сделало их мишенью турецкого реваншизма. Военное наращивание обеих сторон привело к стычкам на границе между Курдистаном и имперским остатком. Оттоманцы утверждают, что смерть их пограничной охраны требует возмездия, в то время как курды обвиняют оттоманов в подстрекательстве к войне. ~ Невзирая на то, какая сторона говорит правду, турки используют этот инцидент в качестве предлога для вторжения в Курдистан с заявленным намерением «восстановить порядок»."
 turnews.2.a: "То, что было потеряно, снова будет нашим!"
 turnews.2.b: "Мы изгоним захватчиков с наших земель!"
 turnews.2.c: "Похоже, турки намерены вернуть то, что когда-то было их."

 turnews.3.t: "Ремилитаризация Гюдавендигара"
 turnews.3.d: "В мирном договоре, официально прекратившем боевые действия между Кордиалом и Османской империей после Великой войны, Хюдавендигер был лишен какого-либо военного присутствия на протяжении более десяти лет. ~ Несмотря на новое правительство, находящееся у власти в [от Гетнаме], они ясно заявили о своей готовности восстановить полный контроль над всей своей территорией. И неудивительно, что сегодня утром турецкое правительство официально положило конец демилитаризации Гюдавендигара, переместив войска в этот регион."
 turnews.3.a: "Это просто турки маршируют на свой задний двор..."


