 #### Focus ####
 TUR_bye_opda: "Упразднение ОРДА"
 TUR_bye_opda_desc: ""
 TUR_emergency_session: "Чрезвычайное заседание"
 TUR_emergency_session_desc: "После убийства покойного султана Абдюльмесида II многие, в том числе и те, кто входит в состав правительства, были удивлены."
 TUR_death_of_an_empire: "Смерть Империи"
 TUR_death_of_an_empire_desc: "Похоже, Османской империи больше нет, а парламент выступает за ликвидацию империи и создание нового турецкого государства."
 TUR_consolidation_of_power: "Укрепление власти"
 TUR_consolidation_of_power_desc: "К счастью, кажется, что Дом Осману удалось удержать власть и разрешить продолжение Османской империи под его контролем."

 TUR_turanist_victorious: "Туранистическая победа"
 TUR_turanist_victorious_desc: "Туранцы, после создания турецкого государства, смогли захватить власть и заручиться доверием большинства делегатов."
 TUR_promote_pan_turkism: "Поощрение пантуркизма"
 TUR_promote_pan_turkism_desc: "Вместо того чтобы присоединяться к европейцам или арабам, ясно, что наша судьба заключается в потеплении отношений с нашими туркменскими братьями."
 TUR_indoctrinate_the_youth: "Индоктринировать молодежь"
 TUR_indoctrinate_the_youth_desc: "Мы должны активизировать молодежь и помочь ей осознать важность не только приверженности нашим целям, но и самому государству."
 TUR_extend_our_power: "Расширить нашу силу"
 TUR_extend_our_power_desc: "Простого достижения большинства в парламенте недостаточно; мы должны обеспечить, чтобы наше правление было широко распространено в жизни всего народа и ощущалось по всей стране."
 TUR_empower_paramilitary_groups: "Расширение прав и возможностей военизированных групп"
 TUR_empower_paramilitary_groups_desc: "Сильный лидер эффективно управляет, удерживая своих подданных в страхе перед своим гневом; расширяя возможности военизированных групп, которые преданы нашему делу, мы можем обеспечить, чтобы народ боялся нас и, следовательно, выполнял любые приказы, которые мы выполняем."
 TUR_increased_weapons_production: "Увеличение производства оружия"
 TUR_increased_weapons_production_desc: "Для этого мы должны заказать все имеющиеся заводы для увеличения объема производства оружия, что позволит нам поставлять больше людей за более короткий срок."
 TUR_begin_recruitment_campaigns: "Готовьте армию к войне"
 TUR_begin_recruitment_campaigns_desc: "Мы должны обеспечить, чтобы все наши люди были в высшей форме в случае войны."
 TUR_crush_internal_enemies: "Разрушить внутренние враги"
 TUR_crush_internal_enemies_desc: "Мы не можем допустить, чтобы внутренние враги бродили и угрожали безопасности и стабильности государства, и поэтому мы должны взять на себя обязательство уничтожить и избавить страну от любой внутренней угрозы, которая может возникнуть."
 TUR_reformation_of_the_state: "Реформа государства"
 TUR_reformation_of_the_state_desc: "Для многих хорошо известно, что Османская империя была устаревшим и деградировавшим государством, держащимся только по счастливой случайности."
 TUR_promote_industrialism: "Пропагандистская деятельность"
 TUR_promote_industrialism_desc: "Для того чтобы обеспечить более высокий уровень жизни в турецкой нации, наряду с ее постепенной индустриализацией, мы должны начать смотреть в сторону создания спонсируемых государством фабрик."
 TUR_work_with_the_masses: "Работать с массами"
 TUR_work_with_the_masses_desc: "Поэтому мы должны работать с массами и обеспечивать их лояльность, таким образом, мы можем свести к минимуму возможность несогласия с нашим правлением."
 TUR_develop_intelligence_organizations: "Создание разведывательных организаций"
 TUR_develop_intelligence_organizations_desc: "Для того чтобы подготовиться к любым внутренним угрозам, мы должны стремиться к созданию современных и эффективных разведывательных организаций, обладающих потенциалом, необходимым для борьбы с любой угрозой."
 TUR_assassination_of_prominent_leftists: "Убийство известных левых людей"
 TUR_assassination_of_prominent_leftists_desc: "Левым не место в турецком государстве, они выплескивают и проповедуют лживые и ложные идеологические обещания, пытаясь завоевать доверие народа с помощью лжи."
 TUR_tear_down_old_institutions: "Слёзы старых учреждений"
 TUR_tear_down_old_institutions_desc: "Оттоманская империя страдала от множества неэффективных и коррумпированных организаций, которые не могли выполнить даже самые простые задачи."
 TUR_rid_ourselves_of_bureaucratic_decadence: "Очистить себя от бюрократического десятилетия"
 TUR_rid_ourselves_of_bureaucratic_decadence_desc: "Нанимая эффективных и преданных бюрократов, а также принимая меры по борьбе с коррупцией и обеспечивая соблюдение более строгих стандартов, мы можем обеспечить, чтобы бюрократическая деградация, которая обрушилась на покойную Османскую империю, не была шипом на нашей стороне."
 TUR_judicial_control: "Судебный контроль"
 TUR_judicial_control_desc: "Устанавливая контроль над судебной системой, мы можем начать процесс консолидации власти и обеспечить более лояльное правительство, кроме того, у нас будет возможность контролировать и выносить решения, которые мы поддерживаем."
 TUR_shut_down_parliament: "Закрыть парламент"
 TUR_shut_down_parliament_desc: "Парламент является банальным институтом и лишь предусматривает паралич и нерешительность в правительстве."

 TUR_kemalist_victorious: "Кемалист Победа"
 TUR_kemalist_victorious_desc: "Кемалисты после создания турецкого государства смогли прийти к власти в разгар политического кризиса в нынешней Турецкой Республике. &quot; Пропагандируя платформу модернизации &quot; , кемалисты уже приступили к работе по формированию новой турецкой нации."
 TUR_a_new_alphabet: "Новый Алфавит"
 TUR_a_new_alphabet_desc: "Вместо того, чтобы использовать арабский сценарий, который сам по себе устарел и не соответствует потребностям турецкого языка, лучше сбрасывать оковы Османской империи и использовать латинский стих для нового турецкого языка."
 TUR_ban_the_fez: "Запретить Фез"
 TUR_ban_the_fez_desc: "Один из важных вопросов, связанных с модернизацией, — это фез, который многие ведущие кемалисты рассматривают как символ восточного и отсталого мира, возможно, нам лучше отказаться от кепки западного стиля."
 TUR_western_legal_code: "Западный правовой кодекс"
 TUR_western_legal_code_desc: "Вместо того, чтобы сохранить Меселлу, возможно, нам лучше основывать наш гражданский кодекс на швейцарском, и таким образом мы можем действительно начать эру модернизации нашей молодой республики и обрести легитимность в глазах западных государств."
 TUR_parliamentary_democracy: "Парламентская демократия"
 TUR_parliamentary_democracy_desc: "Сохранение и даже совершенствование парламентской демократии являются ключом к обеспечению демократического государства и должным образом представленного населения, и мы не позволим подорвать демократические идеалы, несмотря на сложившуюся ситуацию."
 TUR_gregorian_calendar: "Грегорианский календарь"
 TUR_gregorian_calendar_desc: "Наиболее широко используемый в мире гражданский календарь, вполне естественно, что мы начинаем принимать календарь Грегори, а не сохранять календарь Руми."
 TUR_reorganize_our_bureaucracy: "Реорганизовать нашу бюрократию"
 TUR_reorganize_our_bureaucracy_desc: "Коррумпированная и неэффективная бюрократия была одной из самых больших проблем последней Османской империи."
 TUR_bolster_the_armed_forces: "Закреплять вооруженные силы"
 TUR_bolster_the_armed_forces_desc: "Если идеалы лайкизма или демократии в нашей стране когда-либо будут поставлены под угрозу, то долг военных состоит в том, чтобы обеспечить строгое закрепление идеалов и отстранение преступника от власти, мы не можем допустить, чтобы внутренние угрозы свергли нашу великую нацию."
 TUR_institute_laicism: "Институт Лейцизма"
 TUR_institute_laicism_desc: "Одним из ключевых аспектов модернизации является обеспечение четкого определения и соблюдения принципа разделения религии и государства."
 TUR_land_reform: "Земельная реформа"
 TUR_land_reform_desc: "Благодаря созданию современных фермерских хозяйств мы сможем обеспечить развитие наших методов ведения сельского хозяйства."
 TUR_social_equality: "Социальное равенство"
 TUR_social_equality_desc: "Проводя реформу османского идеала общественной сферы, мы можем начать формировать мысли наших граждан и создать условия для более активного в социальном отношении и сознательного населения."
 TUR_womens_rights: "Права женщин"
 TUR_womens_rights_desc: "Мы должны поощрять равноправное участие и права турецких женщин, с тем чтобы действительно модернизировать нашу нацию."
 TUR_the_sciences_and_the_arts: "Наука и искусство"
 TUR_the_sciences_and_the_arts_desc: "Пропагандируя науку и искусство, мы можем позволить более образованному и образованному населению, что, в свою очередь, позволит нам добиться прогресса в различных областях."
 TUR_village_institutes: "Сельские институты"
 TUR_village_institutes_desc: "Создавая сельские институты, мы можем обеспечить, чтобы все турецкие граждане, как городские, так и сельские, могли обеспечить высокий уровень образования."
 TUR_financial_reform: "Финансовая реформа"
 TUR_financial_reform_desc: "Устанавливая новые стандарты для наших финансов, создавая центральный банк и решая наши иностранные долги, мы можем обеспечить финансовую стабильность республики."
 TUR_state_owned_enterprise: "Государственное предприятие"
 TUR_state_owned_enterprise_desc: "Мы должны взяться за создание спонсируемых правительством и контролируемых правительством организаций, которые, как мы надеемся, позволят нам поощрять индустриализм в Турции, а это, в свою очередь, позволит нам индустриализировать нашу страну беспрецедентными темпами."
 TUR_the_turkish_constitution: "Конституция Турции"
 TUR_the_turkish_constitution_desc: "Для того чтобы добиться легитимности в международном сообществе и в глазах нашего народа, наряду с укреплением нашего видения Турции, мы должны приступить к разработке и ратификации подлинно турецкой конституции."
 TUR_guardians_of_the_constitution: "Хранители Конституции"
 TUR_guardians_of_the_constitution_desc: "Мы должны еще больше укрепить наши вооруженные силы, с тем чтобы они могли успешно отстаивать идеалы, изложенные в конституции, и, в свою очередь, содействовать стабильности в Турции и обеспечивать ее."

 TUR_a_moderate_empire: "Умеренная империя"
 TUR_a_moderate_empire_desc: "Мы не можем допустить, чтобы радикальные силы захватили власть в империи и подорвали нашу репутацию во всем мире."
 TUR_assertion_of_royal_prerogatives: "Внимательное отношение к нашим собственным рукам"
 TUR_assertion_of_royal_prerogatives_desc: "Мы не можем больше позволить внешним и даже внутренним силам диктовать нашу политику, мы должны взять дело в свои руки и формировать будущее Османской империи для грядущих поколений!"
 TUR_rewrite_the_constitution: "Переписать Конституцию"
 TUR_rewrite_the_constitution_desc: "Нынешняя конституция является весьма неясной или устаревшей во многих аспектах."
 TUR_dealing_with_the_bureaucracy: "Работа с бюрократией"
 TUR_dealing_with_the_bureaucracy_desc: "Очевидной истиной является деградация и неэффективность османской бюрократии."
 TUR_finish_the_tanzimat_reforms: "Заканчивайте реформы Tanzimat"
 TUR_finish_the_tanzimat_reforms_desc: "Несмотря на то, что реформы в Танзимате привели к либерализации нашей империи в определенной степени, сами реформы не зашли достаточно далеко и пришли в очень поздний срок, и мы должны избежать ошибок наших предшественников, если мы хотим пережить эти трудные времена."
 TUR_decentralized_rule: "Децентрализованное правило"
 TUR_decentralized_rule_desc: "Мы можем обеспечить более широкое представительство нашего народа, отдавая предпочтение губернаторам различных провинций, а не непосредственному руководству из Косово."
 TUR_reform_the_banking_system: "Реформа банковской системы"
 TUR_reform_the_banking_system_desc: "Продолжая реформу и перестройку нашей банковской системы и наделяя Центральный банк полномочиями, мы можем обеспечить стабильность нашей валюты."
 TUR_work_to_pay_off_our_debts: "Работа по погашению наших долгов"
 TUR_work_to_pay_off_our_debts_desc: "ФПДА уже давно истощает нашу экономику и заковывает нас в кандалы, отказывая в экономической независимости."
 TUR_multi_party_system: "Многопартийная система"
 TUR_multi_party_system_desc: "Поощряя многопартийную систему, которая сама по себе будет демократической, мы можем надеяться обеспечить полное представительство мнений нашего народа, укрепляя при этом идею о том, что наша нация является парламентской демократией."
 TUR_transition_to_a_constitutional_monarchy: "Переход к конституционной монархии"
 TUR_transition_to_a_constitutional_monarchy_desc: "Исторически Султан обладал огромной властью и влиянием в Османской империи, делегировав задачи ключевым членам правительства и взяв на себя роль конституционного монарха, мы можем надеяться на либерализацию нашей империи и создание условий для процветания демократии."
 TUR_provide_education_to_the_people: "Просвещение населения"
 TUR_provide_education_to_the_people_desc: "Это, в свою очередь, позволит более сознательному и более сильному населению."
 TUR_ensure_judicial_fairness: "Обеспечение беспристрастности судебных органов"
 TUR_ensure_judicial_fairness_desc: "Одним из ключевых элементов любого демократического общества является наличие независимой судебной системы."
 TUR_ending_corruption: "Прекращение коррупции"
 TUR_ending_corruption_desc: "Коррупция с помощью взяток, услуг или других методов уже давно разрешена в рамках империи."
 TUR_an_inclusive_empire: "Всеохватная империя"
 TUR_an_inclusive_empire_desc: "Мы никогда не должны допустить, чтобы демократические и инклюзивные идеалы империи были скомпрометированы. Орден, установленный Султаном Ахмедом IV, должен оставаться для грядущих поколений. Да здравствует султан и проживет народ Осман!"
 TUR_reform_the_political_system: "Реформа политической системы"
 TUR_reform_the_political_system_desc: "Очевидно, что мы должны положить конец этой системе, поскольку она представляет собой западный контроль над нашей страной."
 TUR_establish_control_over_the_judiciary: "Учредить контроль за судебной системой"
 TUR_establish_control_over_the_judiciary_desc: "Ключевое значение имеет установление контроля над судебной системой, и мы не можем допустить, чтобы изгои в правительстве препятствовали прогрессу, достигнутому султаном."
 TUR_appoint_a_loyal_grand_vizier: "Назначь преданного Великого Визьера"
 TUR_appoint_a_loyal_grand_vizier_desc: "Чтобы укрепить нашу власть над правительством, мы должны назначить опытного, но верного Великого Визьера, таким образом, мы можем свести к минимуму разногласия внутри правительства."
 TUR_solidify_the_power_of_the_sultan: "Укрепить власть султана"
 TUR_solidify_the_power_of_the_sultan_desc: "Мы должны напомнить ветвям правительства, что султан, суверен народа Осман, обладает наибольшей властью и формирует государство."
 TUR_reeducate_the_masses: "Перевоспитание масс"
 TUR_reeducate_the_masses_desc: "Программы перевоспитания имеют ключевое значение, если мы хотим мобилизовать тех, кто моложе, и вдохновить их на борьбу за империю."
 TUR_silence_all_opposition: "Молчать оппозицию"
 TUR_silence_all_opposition_desc: "Давным-давно, будучи на нашей стороне, оппозиция в наше время была чрезвычайно взволнована, и мы должны заставить их замолчать во имя великого блага империи."
 TUR_disband_parliament: "Десгородный парламент"
 TUR_disband_parliament_desc: "Парламенту дано слишком много власти и свободы правления, что препятствует нашей империи и служит лишь для того, чтобы сдержать власть Султана."
 TUR_the_phoenix: "Феникс"
 TUR_the_phoenix_desc: "Как Феникс, мы восстали из пепла и на пути восстановления нашей империи к величию."
 TUR_economic_mobilization: "Экономическая мобилизация"
 TUR_economic_mobilization_desc: "Мы должны незамедлительно приступить к преобразованию нашей экономики из экономики, которая в основном является гражданской, в экономику, которая служит укреплению и предоставлению военным того, в чем они нуждаются."
 TUR_mandatory_conscription: "Обязательная воинская обязанность"
 TUR_mandatory_conscription_desc: "Для того чтобы осуществить наши планы по восстановлению прежнего величия Османской империи, нам нужны здоровые люди, которые служили бы под нашим командованием и командовали нашей армией."

 TUR_foreign_policy: "Реванхизм"
 TUR_foreign_policy_desc: "Крайне важно, чтобы мы начали брать будущее нашей страны в свои руки и независимо заниматься вопросами внешней политики, которые требуют нашего неотложного внимания."
 TUR_remil_istanbul: "Ремилитаризировать Хюдавендигара"
 TUR_remil_istanbul_desc: "После окончания Великой войны мы были вынуждены осуществить демилитаризацию Гюдавендигара в рамках договора, который положил конец войне."
 TUR_join_stahlpakt: "Присоединиться к стальпакту"
 TUR_join_stahlpakt_desc: "Германия, когда-то страстный союзник во время Великой войны, вновь накопила власть и вступает в новую эру господства."
 TUR_demand_trabzon: "Спрос на Трабзон"
 TUR_demand_trabzon_desc: "Регион Трабзона, который в настоящее время контролируется в основном Арменией, по праву принадлежит нашей нации, и поэтому мы должны вернуть его любыми необходимыми средствами."
 TUR_crush_arm: "&lt; &lt; Разрушить Армению &gt; &gt;"
 TUR_crush_arm_desc: "Мы больше не можем допустить, чтобы Армения оставалась угрозой на наших границах."
 TUR_erz_pleb: "Уничтожить Джорджию"
 TUR_erz_pleb_desc: "Поскольку большинство граждан в Артини являются турецкими, вполне естественно, что мы берем его у подлых грузин."
 TUR_destroy_kurds: "Уничтожить курдов"
 TUR_destroy_kurds_desc: "Курды владеют Ваном, что имеет геополитическое значение, когда речь идет о наших отношениях с Ираном."
 TUR_conquer_arabia: "Завоевать арабов"
 TUR_conquer_arabia_desc: "Однако это будет нелегко, и мы должны подготовиться к трудной войне."
 TUR_put_down_the_mashriqis: "Опустите масхрики."
 TUR_put_down_the_mashriqis_desc: "Британцы сочли нужным забрать с собой Леванта и создать в этом районе штат Масхрики."
 TUR_demand_aydin: "Спрос на Смирну из Греции"
 TUR_demand_aydin_desc: "Слишком долго Греции разрешалось владеть Смирной, ядром нашего великого государства, мы должны потребовать возвращения территории или вернуть ее любыми другими необходимыми средствами."
 TUR_reclaim_west: "Возвращение к нашим западным землям!"
 TUR_reclaim_west_desc: "Наши западные земли, особенно Измир и Тракия, имеют ключевое значение для обеспечения нашего присутствия в Европе и Эгейском море, а также для обеспечения нашего контроля над Босфором."
 TUR_petition_italy: "Итальянская петиция"
 TUR_petition_italy_desc: "Весь наш доступ в Средиземное море заблокирован итальянцами, которые владеют нашим южным побережьем."
 TUR_maltaya_status: "Статус Мальты"
 TUR_maltaya_status_desc: "После Великой войны французам были предоставлены части Южной Анатолии, и мы должны немедленно исправить этот вопрос и потребовать права собственности на нашу землю."

 TUR_economic_affairs: "После крушения"
 TUR_economic_affairs_desc: "После коллапса Лондонского рынка кажется, что наша и без того ухудшающаяся экономика пострадала еще больше из-за вызванной этим паники."
 TUR_resource_exploitation: "Эксплуатация ресурсов"
 TUR_resource_exploitation_desc: "Анатолия является богатым ресурсом регионом с большим количеством хрома и стали в самом регионе, и мы должны воспользоваться нашим изобилием этих ресурсов и начать добычу полезных ископаемых."
 TUR_industrial_development: "промышленного развития"
 TUR_industrial_development_desc: "Если мы хотим когда-либо догнать наших европейских коллег, то мы должны начать индустриализацию страны, активно спонсируя строительство государственных фабрик, мы можем начать постепенное индустриализацию нашей страны."
 TUR_agricultural_methods: "Сельскохозяйственные методы"
 TUR_agricultural_methods_desc: "Благодаря совершенствованию наших методов ведения сельского хозяйства и инструментов, используемых нашими фермерами, мы можем обеспечить более эффективное производство сельскохозяйственной продукции."
 TUR_nationalization_of_railways: "Национализация железных дорог"
 TUR_nationalization_of_railways_desc: "Несмотря на то, что это может разгневать несколько стран, крайне важно вновь взять под свой контроль нашу экономику и утвердить свою независимость на мировой арене."
 TUR_austerity_programs: "Программы укрепления сил"
 TUR_austerity_programs_desc: "Чтобы обеспечить восстановление нашей экономики, мы должны сократить расходы в отдельных областях, хотя это будет непопулярной мерой в краткосрочной перспективе, это будет чрезвычайно полезно для того, чтобы вытащить нас из экономической пропасти, в которой мы оказались."
 TUR_subsidization_of_industry: "Субсидирование промышленности"
 TUR_subsidization_of_industry_desc: "Субсидирование вновь созданных государственных предприятий будет иметь большое значение для того, чтобы позволить нам снять бремя с самих заводов, а также повысить производительность."
 TUR_broaden_our_horizons: "Расширить наши горизонты"
 TUR_broaden_our_horizons_desc: "Важно, чтобы мы приступили к рассмотрению вопроса о том, чтобы обратить свой взгляд за рубежом и найти торговых партнеров, которые помогли бы нам преодолеть экономический кризис, в котором мы оказались."
 TUR_foundation_of_the_defence_industry: "Фонд оборонной промышленности"
 TUR_foundation_of_the_defence_industry_desc: "Ключевое значение имеет то, что в целях наращивания производства оружия и других видов оружия мы начинаем создавать фабрики, которые могут помочь нам в создании основы для создания надлежащей оборонной промышленности."
 TUR_establishment_of_radio_networks: "Создание радиосетей"
 TUR_establishment_of_radio_networks_desc: "Создание возможностей для создания радиосетей позволит обеспечить экономическое развитие в области технологии RADAR при одновременном расширении связей между людьми и средствами массовой информации."
 TUR_koc_holding: "Хранение Koc"
 TUR_koc_holding_desc: "Работа с компанией &quot; Коч холдинг &quot; , одной из крупнейших и наиболее известных фирм в нашей стране, была бы выгодной с точки зрения дальнейшей индустриализации нашей страны наряду с оказанием помощи в создании рабочих мест."
 TUR_anatolian_railway: "Анатолийские железные дороги"
 TUR_anatolian_railway_desc: "Стимулируя создание анатолийской железной дороги, мы можем лучше связать наши основные земли и обеспечить эффективную перевозку товаров и войск."
 TUR_the_central_bank: "Центральный банк"
 TUR_the_central_bank_desc: "Обеспечение стабильности центрального банка будет во многом способствовать обеспечению стабильности нашей валюты и удовлетворенности потребителей."
 TUR_kirikkale_steel: "Сталь Kyryklale"
 TUR_kirikkale_steel_desc: "Было бы разумно начать операции по добыче полезных ископаемых в Кырккале, который является щедрым с точки зрения имеющихся у него стальных ресурсов, с тем чтобы еще больше увеличить объем нашей экономической продукции на мировых рынках."
 TUR_robert_college: "Колледж Роберта"
 TUR_robert_college_desc: "Основанный в 1863 году американским филантропом и американским миссионером, Колледж Роберта стал высшим высшим учебным заведением в стране."
 TUR_redistribution_of_land: "Перераспределение земли"
 TUR_redistribution_of_land_desc: "Перераспределение земли фермерам, которые могут лучше ее использовать, вместо того чтобы позволить ей постепенно гнить в руках богатых, имеет ключевое значение для достижения максимальной экономической отдачи."
 TUR_economic_prosperity: "Экономическое процветание"
 TUR_economic_prosperity_desc: "Похоже, что многолетние экономические инвестиции в соответствующие области наряду с постепенной, но устойчивой индустриализацией страны позволили нам, наконец, объявить себя экономически стабильными."

 TUR_inspecting_the_military: "Армия [Крыльцо. Возьмите капельницу]"
 TUR_inspecting_the_military_desc: "Важно, чтобы мы повернули свой взгляд на профессионализацию и дальнейшее развитие наших военных сил, чтобы мы не оказались осажденными с обеих сторон враждебными и иностранными державами, стремящимися к ликвидации нашего великого государства."
 TUR_military_colleges: "Военные колледжи"
 TUR_military_colleges_desc: "Инвестирование в военные колледжи — это большой способ обеспечить развитие надлежащего и квалифицированного офицерского корпуса, способного преодолеть любые проблемы, с которыми он может столкнуться."
 TUR_professionalization_of_the_military: "Начать кампании по набору персонала"
 TUR_professionalization_of_the_military_desc: "Хотя приобретение оружия является шагом в правильном направлении, мы также требуем, чтобы мужчины использовали это оружие, если в этом возникнет необходимость, и поэтому мы должны начать кампании по вербовке и укрепить военный дух турок."
 TUR_conscription_time_init: "Народная мобилизация"
 TUR_conscription_time_init_desc: "Нация кричит о победе, и мы отдадим ее им, и наш народ не должен быть вынужден каким-то бюрократом на фронте, слоганы и обещания искупления будут нашим спасителем."
 TUR_field_exercises: "Упражнения на местах"
 TUR_field_exercises_desc: "Проведение полевых учений является наилучшим способом обеспечить, чтобы мы были в курсе любых доктрин и могли бороться с этими новыми доктринами."
 TUR_equipment_modernization: "Модернизация оборудования"
 TUR_equipment_modernization_desc: "Модернизация нашего старого оборудования и оборудования имеет ключевое значение, если мы хотим получить преимущество над нашими врагами."
 TUR_british_assistance: "Помощь Великобритании"
 TUR_british_assistance_desc: "Жизненно важно обратиться к англичанам, известным своими профессиональными вооруженными силами, и получить военную помощь."
 TUR_german_assistance: "Помощь Германии"
 TUR_german_assistance_desc: "Жизненно важно, чтобы мы обратились к немцам, известным своими хорошо дисциплинированными вооруженными силами, и заручились военной помощью."
 TUR_gendarmerie_general_command: "Главное командование жандармерии"
 TUR_gendarmerie_general_command_desc: "Для того чтобы более эффективно осуществлять полицию в нашей стране, мы должны начать перенаправлять больше финансовых средств на общее командование жандармерией, что позволит нам увеличить число и повысить качество сотрудников правоохранительных органов."
 TUR_field_artillery: "Полевая артиллерия"
 TUR_field_artillery_desc: "Артиллерия является одним из ключевых компонентов войны со времени Наполеоновских войн и сыграла решающую роль во время Великой войны."
 TUR_general_staff: "Генеральный штаб"
 TUR_general_staff_desc: "Обеспечивая, чтобы только старшие офицеры могли выполнять функции Генерального штаба, мы можем обеспечить удовлетворение административных, материально-технических и оперативных потребностей наших военных."
 TUR_contracts_with_royal_arsenal: "Контракты с Королевским Арсеналом"
 TUR_contracts_with_royal_arsenal_desc: "Сознавая, что Британия более чем готова помочь нам в модернизации нашей армии, возможно, было бы лучше связаться с одной из их ведущих компаний "Роял Арсенал" и заключить контракт на новое оборудование."
 TUR_contracts_with_mauser: "Контракты с Маузером"
 TUR_contracts_with_mauser_desc: "Считая, что Германия более чем готова помочь нам в модернизации нашей армии, возможно, было бы лучше связаться с Маузером, одной из их ведущих компаний, и заключить контракт на новое оборудование."
 TUR_support_equipment: "Вспомогательное оборудование"
 TUR_support_equipment_desc: "Материально-техническое обеспечение, полевые больницы и инженеры — все они являются важнейшими элементами поддержки любого отдела."
 TUR_armoured_vehicles: "Бронированные машины"
 TUR_armoured_vehicles_desc: "Моторизованная пехота имеет решающее значение в том плане, что она обеспечивает защиту от огня противника и может помочь перебросить наши войска из одного места в другое с быстрой скоростью."
 TUR_tank_research: "Исследования по цистернам"
 TUR_tank_research_desc: "Изобретенные британцами в 1916 году во время Великой войны, танки способны пробить вражеские линии и обладать огневой мощью, которую никогда не видели прежде."
 TUR_special_forces_command: "Командование специальных сил"
 TUR_special_forces_command_desc: "Инвестирование средств в создание целевой группы специальных групп имеет решающее значение для эффективного и действенного проведения тайных операций."
 TUR_rearmament: "Перевооружение"
 TUR_rearmament_desc: "Мы должны начать медленное, но стабильное перевооружение наших войск, с тем чтобы подготовиться к любым угрозам, как внутренним, так и внешним."
 TUR_maintaining_readiness: "Сохранять готовность"
 TUR_maintaining_readiness_desc: "Сохранение готовности перед лицом противника и подготовка даже к худшему из оппонентов являются ключом к любым современным военным силам."
 TUR_engineering_schools: "Инженерные школы"
 TUR_engineering_schools_desc: "Ключевое значение для совершенствования нашей тактики имеет модернизация нашего вспомогательного оборудования и создание возможностей для специализации в вооруженных силах."

 TUR_naval_considerations: "Морские соображения"
 TUR_naval_considerations_desc: "Крайне важно, чтобы мы обратили внимание на расширение и поддержание нашего военно-морского флота, особенно с учетом быстрых изменений, происходящих в военно-морской войне, и большого значения, которое придается обладанию надлежащим флотом."
 TUR_naval_infantry: "Военно-морские пехотные подразделения"
 TUR_naval_infantry_desc: "Инвестируя в ресурсы, позволяющие основать и развивать морские пехотинцы, мы можем надеяться вести войну незапланированным и эффективным образом."
 TUR_commission_naval_cruisers: "Военно-морские круизеры Комиссии"
 TUR_commission_naval_cruisers_desc: "Ключевое значение имеет то, что мы начинаем ввод в эксплуатацию современных морских крейсеров, чтобы лучше защититься от угрозы со стороны современных вражеских кораблей."
 TUR_sabotaging_enemy_supply_lines: "Саботирование линий снабжения противника"
 TUR_sabotaging_enemy_supply_lines_desc: "Для того чтобы мы могли эффективно уничтожить вражеские судоходные маршруты и нанести удар по неподготовленным вражеским судам, мы должны начать строительство подводных лодок."
 TUR_pendik_naval_shipyard: "Морской верфь Пендик"
 TUR_pendik_naval_shipyard_desc: "Для того чтобы расширить наши возможности по судостроению, мы должны обратиться к созданию военно-морского верфи в Пендике, районе на азиатской стороне Босфора."
 TUR_naval_doctrines: "Морские доктрины"
 TUR_naval_doctrines_desc: "Позволить нашим адмиралам координировать и намечать маршрут, по которому наши военно-морские силы будут идти параллельно с подготовкой наших военно-морских офицеров к адаптации к этим новым методам, будет иметь решающее значение для модернизации и укрепления нашего военно-морского флота."
 TUR_building_destroyers: "Разрушители зданий"
 TUR_building_destroyers_desc: "Уничтожение — это как долговечные, так и маневренные корабли, которые используются для защиты главных кораблей, конвоев и боевых групп."
 TUR_naval_air_coordination: "Координация между морскими и воздушными судами"
 TUR_naval_air_coordination_desc: "Важно, чтобы мы обеспечили координацию между военно-морскими и военно-воздушными силами, с тем чтобы использовать различные виды боевых действий, которые никогда раньше не виделись, и таким образом мы можем одновременно контролировать воздух и море."
 TUR_reliance_on_battleships: "Усердие на боевых кораблях"
 TUR_reliance_on_battleships_desc: "Боевые корабли, которые часто были запечатлены как самые могущественные корабли в истории военно-морских войн, будут иметь решающее значение, если мы хотим обеспечить наш контроль над морями."
 TUR_bartin_naval_base: "Бартынская военно-морская база"
 TUR_bartin_naval_base_desc: "Чтобы разместить больше кораблей, мы должны перейти к созданию современной военно-морской базы, а сильным кандидатом на эту новую военно-морскую базу является Бартын, город в провинции Зонгулдак."
 TUR_directorate_of_naval_affairs: "Управление по военно-морским вопросам"
 TUR_directorate_of_naval_affairs_desc: "Управление по военно-морским вопросам позволит нам лучше организовать наши корабли, повысить эффективность материально-технического транспорта и обеспечить безопасность разведки на вражеских кораблях."

 TUR_examining_the_air_force: "Проверка военно-воздушных сил"
 TUR_examining_the_air_force_desc: "Крайне важно, чтобы мы обратили внимание на расширение и поддержание наших военно-воздушных сил, особенно с учетом быстрых изменений, происходящих в области воздушных войн, и того большого значения, которое придается обладанию надлежащими военно-воздушными силами."
 TUR_invest_in_fighters: "Инвестировать в борцов"
 TUR_invest_in_fighters_desc: "Для того чтобы обеспечить воздушное превосходство и уничтожение вражеских самолетов, мы должны начать инвестировать в истребители."
 TUR_bomber_research: "Исследования бомбардировщиков"
 TUR_bomber_research_desc: "Бомбардировочные самолеты имеют решающее значение для военных усилий в том плане, что они позволяют эффективно разрушать каналы снабжения противника, но из удаленного района, что означает, что в конце концов мы причиним больше ущерба, но потеряем меньше жизней."
 TUR_close_air_support: "Поддержка при закрытых воздушных перевозках"
 TUR_close_air_support_desc: "Защита наших людей со всех сторон, особенно с неба, имеет важнейшее значение для военных усилий."
 TUR_konya_airbase: "авиабаза &lt; &lt; Конья &gt; &gt;"
 TUR_konya_airbase_desc: "Коня, которая занимает центральное место в нашей стране, имеет первостепенное значение для того, чтобы позволить нам установить воздушное превосходство над Малой Азией."
 TUR_naval_bombers: "Бомбардировщики военно-морского флота"
 TUR_naval_bombers_desc: "Заручившись сотрудничеством военно-морских сил и военно-воздушных сил, мы сможем обеспечить воздушное превосходство независимо от того, где мы находимся."
 TUR_aerial_doctrines: "Воздушные доктрины"
 TUR_aerial_doctrines_desc: "Мы должны научить наших пилотов новым методам управления самолетами, таким образом, мы сможем перехитрить врага и значительно расширить наше понимание воздушной войны."
 TUR_light_aircraft_focus: "Фокус легких воздушных судов"
 TUR_light_aircraft_focus_desc: "Нам лучше всего было бы инвестировать в легкие самолеты, такие, как бои и личная авиаподдержка."
 TUR_eskisehir_air_school: "Эскишехирская авиашкола"
 TUR_eskisehir_air_school_desc: "Создав авиационную школу в Эскишехире, мы можем обеспечить обучение нового поколения пилотов, что позволит лучше понять воздушную войну."
 TUR_heavy_aircraft_focus: "Фокус тяжелых воздушных судов"
 TUR_heavy_aircraft_focus_desc: "Наше время лучше всего использовать для инвестирования в тяжелые самолеты, такие, как бомбардировщики и военно-морские самолеты."

