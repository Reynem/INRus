 #### Ideas ####
 TUR_start_military_conscription_idea: "Последняя позиция турок"
 TUR_start_military_conscription_idea_desc: "После Севреса и неудачных войн за восстановление, турецкий народ остался в Анатолии, имея лишь один выход в Черное море. Даже в нашем сокращенном штате многие наши соседи все еще смотрят на остающиеся обломки с голодом, готовые навсегда покончить с турками. Однако среди турок не должно быть страха, ибо наша решимость будет лучше для них снова и снова!"
 TUR_new_military_conscription_idea: "Турецкий реванхизм"
 TUR_new_military_conscription_idea_desc: "После того, как Севрес и провалившиеся войны за восстановление, турецкий народ остался в боксе с Анатолией, имея лишь один выход в Черное море."

 TUR_sick_man_of_europe: "Больной человек Европы"
 TUR_sick_man_of_europe_desc: "Из-за отсутствия общей модернизации, довольно жалкого состояния наших вооруженных сил, отсутствия готовности к индустриализации, коррумпированной и недисциплинированной бюрократии, чрезмерно раздутой и неэффективной администрации, ограниченных возможностей в области образования и общего раскола среди населения Османской империи, мы названы «больным человеком Европы»."
