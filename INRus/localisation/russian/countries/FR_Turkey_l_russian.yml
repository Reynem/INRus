 tur.47.d: "Интересно то, что новый лидер турецкого государства Хюсейин Нихал Бей, стремясь к дальнейшему продвижению общетуркских идеалов, решил укреплять связи с [Руко.Гетнамом]. Делегация [TUR.GetName] упомянула о нашей генетической близости и выгоде укрепления и углубления связей между нашими нациями, особенно с учетом постоянно обостряющейся бурной ситуации в мире."
 tur.47.a: "Что может пойти не так?"
 tur.47.b: "Нам не нужен пан-Туркизм."

