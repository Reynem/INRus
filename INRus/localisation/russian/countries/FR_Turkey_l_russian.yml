l_russian:

 #### Bookmark Description #####
 TUR_FUHRERREICH_DESC: "После Великой войны Остоманская империя возникла в разрушительном состоянии, когда народ был высечен различными иностранными врагами, и его земля разделилась между победителями. После подписания Севрского договора оттоманцы остались в Анатолии с оборванным государством. В ответ Мустафа Кемаль Паша и его революционеры начали атаку, которая была направлена на расчленение султана, но вместе с тем Энтент поддержал восстание. Хотя реформы начались, государство все еще носит название "Бешеный человек Европы". Однако в предстоящие годы, будь то в результате свержения или реформы Империи, турки надеются, что они снова совпадут со своими бывшими горожанами."

