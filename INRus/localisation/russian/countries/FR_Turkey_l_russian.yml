 OTT_Loyalty_desc: "Чем выше местная нестабильность наших виллайетов (представленная функционирующими функционерами §Texticon §YUnrest§!), тем больше наказание для нашей страны. Нижеследующие значения рассчитываются по каждому штату и добавляются к общему показателю по всей империи: \n §garery Low§! : ftstability_texticon §R-0% ! \n §glollow§! : ftustice_texticon §R-1%§ !n §YMedium § : unstability_textisticon §R-2/2 § \n §RHigh§ : unstability_texticon §R-5% § § \n niVilayetesistance_texicon §YUnrestrest§! будет также активировать сопротивление и может привести к открытому восстанию, если он останется без внимания."

 OTT_Centralise_tt: "§ Централизованное управление!"
 OTT_Centralise_tt_desc: "В результате отмены некоторых местных органов власти Вилайета власть будет направлена на парламент Оттомана в Костантинийе. С помощью политики расселения, укрепления местных гарнизонов, разоружения бедуинов и расширения государственной инфраструктуры были разработаны амбициозные планы в столице, которые, как мы надеемся, так же легко выполнить, как и написать... ~n [This.OT_CENTRALISE_flect_проверьте] Все должно быть правдой: ~Yat.OTTTT_ATRAT_[ATRAT] {Atward_Atgreat_Act_Atgreat_Atgreat_Atgreat_Atgreat_Ally_LYAIDT_LYADT_LYDY_DAD_DAD_ADIONT_ADT_ADT_THEAD_AT_ATERD_AT_ADT_AT_ADT_AD_DT_AD_AT_AD_A_A_A_AD_A_A_A_ [AT_AT_ [AT_ [AT_ ] [AT_T_T_ ] [ATAT_ [AT__________ ] ТА]"
 OTT_Decentralise_tt: "Децентрационное управление!"
 OTT_Decentralise_tt_desc: "Для того чтобы лучше удовлетворить местные потребности и сохранить уникальный культурный характер империи, власть должна быть перенесена с центрального органа власти в Косово на местные органы власти. Это затруднит осуществление общенациональной политики или реагирование на местные угрозы со стороны Османского государства, но это политика, которой отдается предпочтение на местах и которая позволит ослабить давление на некоторые из наших более неустойчивых регионов."

 OTT_Centralisation: "Власть, которой владеет Османский центр над своей обширной империей, сильно различается в зависимости от провинции, удерживаемой сильными местными органами власти или удаленности от столицы. Несмотря на то, что этот орган представлен фунт национального_unity_texticon §Y Centralization Bar§!, который разделен на три категории: §CAA автономный район §!, §CVilayet § §! и §COttoman provision §!. . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . ."

 OTT_Low_Authority: "§ Автономный район!"
 OTT_Low_Authority_desc: "Несмотря на то, что формально эти регионы называются Вилайетами на бумаге, они практически не имеют ничего общего с центральными органами власти и в основном оставлены на усмотрение своих собственных органов, занимающихся практически всеми повседневными делами."
 OTT_Medium_Authority: "§YVilayet§!"
 OTT_Medium_Authority_desc: "Система &quot; Вилайет &quot; , которая является единственным административным зданием Османской империи, представляет собой современное толкование старой системы &quot; Эйалет &quot; , которая сокращает площадь территории в одном автономном регионе. &quot; Несмотря на то, что изначально предполагалось, что она будет эквивалентом французского департамента, местная автономия была сохранена гораздо больше, чем задумана, благодаря чему &quot; Вилайетты &quot; стали самоуправляющимися образованиями в рамках нашей государственной структуры. &quot; NMax Factories in State: §R-50%§ &quot; ."
 OTT_High_Authority: "Провинция Оттоман!"
 OTT_High_Authority_desc: "Эти образования, созданные после Великой войны ОХФ во время своего первого законодательства, являются следующим шагом на пути к централизованной государственной структуре. Там, где Вилайеты следовали только на бумаге, Османские провинции являются полностью интегрированными образованиями и самыми близкими в нашей империи, напоминающей западные провинции."

 resistance_ott_70: "Сепаратистское возмущение"
 ott_resistance_syr_tt: "Если мы воюем с §! §Y [SYR.GetNameWithFlag]§! §g и/или §! §Y [EGY. GetNameWithFlag]§ §g, мы получаем следующий эффект: §!"
