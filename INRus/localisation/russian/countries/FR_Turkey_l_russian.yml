 KR_muslim_association_tooltip: "Член Ассоциации мусульманских наций!"
 KR_muslim_association_tooltip_desc: "Международная организация по развитию и укреплению связей между различными нациями, исповедующими исламскую веру, Ассоциация мусульманских наций является османской инициативой и состоит из дипломатических, экономических, социальных и культурных суборганизаций."

 ### State Descriptions ###
 OTT_Population_Istanbul: "Культура большинства: §Yurk§!, греческая, армянская религия: §YSunni мусульманская §!, православная христианка"
 OTT_Population_Istanbul_desc: "Известный на протяжении веков как плавильный котёл народов и цивилизаций из всех стран Европы и Ближнего Востока, сияющий город Костантинийе является столицей нашей гордой империи и центром власти для нашего султана-калифа. Несмотря на то, что в нем в основном проживает турецкий народ, значительное меньшинство греческих и армянских граждан проживает в городе, наживаясь на ценных торговых маршрутах, проходящих через него. ~ Несмотря на то, что политические взгляды разделяются в городских стенах, большинство турецкого населения широко рассматривается как сторонники централизованных реформ, хотя значительная часть его множества этнических меньшинств опасается за растущую степень туркменизации и утрату своего особого статуса, все они все же презирают анатолийских крестьян, которые уходят вглубь, что вызвало значительный разрыв между просвещенной буржуазией столицы и жестокой реальностью на местах."

 OTT_Population_Edirne: "Культура большинства: §YEGric§!, турецкая, болгарская, болгарская религия: §YOrthodox Christian§!, суннитская мусульманская"
 OTT_Population_Edirne_desc: "Место рождения Султана Мехмеда II, завоевателя Константинополя, города Эдирне и сопровождающих его земель, занимает особое место в сердцах народа Оттомана."

 OTT_Population_Bursa: "Культура большинства: §Yurk§!, Греческая религия: §YSunni Мусульманская §!, Православный христианин"
 OTT_Population_Bursa_desc: "В то же время, Шелк является страной, в которой он пользуется самой известной известностью, поскольку город Бурса является сердцем шелка Оттоман, полученного впервые из шелковых червей французских торговцев. Недавние открытия в металлургии дали региону второй импульс, поскольку Хромитная руда, большая часть которой находится на юге Вилайета, пользуется большим спросом на военные машины как Германии, так и Франции. nnMuch, как и другие вилайетки, близкие к Эгейскому морю, тесно сотрудничает между христианами, живущими на побережье моря Мармара, и турецкими мусульманами, оккупирующими его горные земли. Напряженность между двумя группами сохраняется, однако массовые депортации и массовые убийства в результате Великой войны остаются все более яркими в сознании сильно ослабленного и истощенного греческого населения."

 OTT_Population_Sinop: "Культура большинства: §Yurk§!, Греческая религия: §YSunni Мусульманская §!, Православный христианин"
 OTT_Population_Sinop_desc: "Несмотря на то, что Вилайет Кастамону является плодородной почвой для крупных сельскохозяйственных перевозок, он не считается богатой провинцией. В то время как его население почти полностью является турецким, в городе Синопе имеется небольшое меньшинство греков, которые контролируют большую часть морских перевозок в городе. В целом это бедный, но содержательный район, поскольку люди в этом городе, кажется, далеки от гектара в городских центрах Эгейского моря и живут только с голыми жизненными потребностями. Мало что было сделано в этом регионе до открытия угля вблизи Зонгулдака, который до конца эксплуатировался во время Великой войны, до тех пор, пока бомбардировка его гавани не вынудила оттоманов прекратить свой угольный транспорт."

 OTT_Population_Izmir: "Культура большинства: §YEGric§!, турецкая религия: §YOrthodox Christian§!, суннитская мусульманская"
 OTT_Population_Izmir_desc: "При создании города Измир или Смирна, как известно грекам, &quot; Айдин Вилайет &quot; является наиболее расколотым по этническому признаку в турецкой Анатолии. &quot; Айдин Вилайет &quot; , простираясь вглубь материка, уже давно жаловался на произвольные данные переписи населения, согласно которым, по их мнению, это делается таким образом, чтобы утопить греческое меньшинство береговой линии. &quot; Дефайт &quot; во время Великой войны видел, как греческие оценки показали гораздо большее греческое население, особенно с учетом того, что большая часть турецкого населения уезжает после войны."
 
 OTT_Population_Mugla: "Культура большинства: §Yyurk§! n Majority Religion: §YSunni Мусульманская §!"
 OTT_Population_Mugla_desc: "Этот маленький Санджак не хвастается впечатляющей экономической мощью Айдин Вилайета, но, тем не менее, сделал себе имя в сельскохозяйственном и горнодобывающем секторах. В Мармарисе регион известен своим производством меда и обширной культурой пчеловодства, в то время как южные районы в основном получают прибыль от выращивания цитрусовых. Горнорудная промышленность также присутствует в Санджаке, поскольку город Мугла является одним из самых известных центров Марбл, а добыча хромита в Фетии неуклонно растет. Итальянское правление видело богатство, которое приносит в регион, и мы получаем выгоды от нашего восстановленного правления."
 OTT_Population_Afyon: "Культура большинства: §Yyurk§! n Majority Religion: §YSunni Мусульманская §!"
 OTT_Population_Afyon_desc: "В анатолийском горном районе Афьон является одной из самых богатых частей Османской империи, которая извлекает свою экономическую силу и славу из марбл-добычи, которая сирает знаменитые достопримечательности по всему миру от Хагии-Софии до Сен-Петерц-Базилики. Кроме того, он является одним из самых продуктивных сельскохозяйственных районов Империи и известен тем, что он выращивает опиум, откуда происходит имя Афьон."

 OTT_Population_Konya: "Культура большинства: §Yyurk§! n Majority Religion: §YSunni Мусульманская §!"
 OTT_Population_Konya_desc: "Будучи центром сельского хозяйства для турецкого населения, &lt; &lt; Конья вилайет &gt; &gt; не является богатым, поскольку в регионе по-прежнему отсутствуют какие-либо формы реальной промышленности. &lt; &lt; Несмотря на то, что население исповедует религию, оно состоит из самых различных этнических групп, поскольку оно было поселено черкессианцами, албанцами и другими европейскими мусульманами после того, как они были изгнаны из своих земель; это народ, глубоко преданный Османской империи, который взял их на себя, но устал от влияния, которое оказывают немусульмане в рамках империи, особенно греческое меньшинство, которое в основном расположено вокруг города Конья и береговой линии Анталья."

 OTT_Population_Ankara: "Культура большинства: §Yyurk§! n Majority Religion: §YSunni Мусульманская §!"
 OTT_Population_Ankara_desc: "Один из беднейших районов империи, центральный Вилайет Анкары, беден, далек от столицы и недовольен существующим положением. Хотя железная дорога подсоединена к столице, она привела лишь к сокращению местного производства, поскольку торговцы и торговцы сейчас экспортируют свое сырье непосредственно вместо того, чтобы поощрять местных ремесленников. В результате насильственной депортации и массовых убийств армян и греков средний класс региона получил еще одно ранение во время Великой войны, в результате чего его и без того низкий экономический статус, уровень грамотности и плотность населения еще более снизились."
 
 OTT_Population_Adana: "Культура большинства: §YMurkish§!, Арабская (Сирийская), Армянская/международная религия: §YSunni Мусульманская §!, Alawite, православная христианка"
 OTT_Population_Adana_desc: "После того как часть Килицианской Армении была создана вилайетом Аданы после того, как египетские силы под руководством Мухаммеда Али вторглись в Османскую империю и продвинули свои войска по всему ливанскому побережью. &quot; Вилайет &quot; является одним из первых индустриализованных районов империи. &quot; Вилайет &quot; представляет собой значительную часть османской промышленной базы, поскольку ее расположение в центре турецкого и арабского регионов, а ее связь железной дорогой и кораблем доказала, что она является идеальным местом. &quot; Неразработанные минеральные ресурсы &quot; также остаются в горах, ожидающих дальнейшей эксплуатации. &quot; Вилейет &quot; не может отрицать серьезность, с которой этот регион пострадал во время Великой войны, поскольку ее процветающее армянское население, ответственное за большую часть вышеупомянутой отрасли, испарилось в ночи, поскольку депортация и массовые убийства повлекли за собой гибель большинства из них. &quot; Великая победная победа в Вели &quot; Великой Вой войне &quot; Уор &quot; , установление французского правды &quot; увидело, что тысячи людей, которые ранее были вынуждены оставлятьи все свои вещи после возвращения в этом регионе, после конфискации и лишения их имущества, после конфискации их имущества и лишения их собственности, а теперь решительно поддерживают французское население, и лишения, и лишения."
 
 OTT_Population_Samson: "Культура большинства: §Yurks§!, греческая (понтическая), армянская/международная религия: §YSunni Мусульманская §!, православная христианка"
 OTT_Population_Samson_desc: "Как и в других христианских регионах империи, депортация и массовые убийства были глубоко заметны, когда понтичные греки были объектом планов Талаата Паши. Однако, несмотря на армянское население, большинство греческого населения выжило после массовых убийств. Армяне захватили контроль над восточной частью этого Вилайета, армянское население было возрождено после Великой войны."

 OTT_Population_Sivas: "Культура большинства: §Yurk§!, курдская религия: §YAlevi§!, суннитская мусульманская"
 OTT_Population_Sivas_desc: "В условиях нищеты, которая была всего лишь второй до Анкары, «Вилайет Сивас» не является гламурной частью империи и чаще всего не забывается о ней в столице. Ее население, в основном турецкие крестьяне после армянской резиденции уничтожили свой средний класс, часто используется в качестве одного из основных пулов рабочей силы Империи, поскольку ее население остается глубоко преданным Османскому правительству. ~ В политическом плане население, как и другие сельские районы Анатолии, высказалось в пользу Кемаля, чей престиж и статус в последние дни Великой войны по-прежнему сожжены в его сознании. Не только его успех на поле скопляет сиванское население в его флаг, поскольку его планы по борьбе с религией в империи дают надежду алевскому населению на то, что их постоянная борьба с суннитами наконец-то может закончиться."

 OTT_Population_Batumi: "Культура большинства: §Y Gorgan§!, Lazi\n Majority Religion: §YOrthodox Christian§!"
 OTT_Population_Batumi_desc: "Древний портовый город Батуми расположен на побережье Черного моря, между устьем реки Чорух на юг и естественной гаванью на север. Он известен высоким качеством лимонов, которые растут в садах вокруг города, и ботаническим садом, который был основан в 1912 году, выращиваются все виды экзотических растений и флоры с Кавказа. Он находился под правлением Подземного порта в XVI веке, но он был потерян в войне против России в 1878 году. С победой в Великой войне и Договором Поти он был возвращен в Империю. Его гавань является центром торговли на периферии короны и на границе с Кавказом, население Батуми представляет собой разнообразную смесь армян, турок, русских, греков и незначительного большинства грузин. В то время как экономические интересы объединяют жителей, соседнее государство Джорджия смотрит на то, что, по их мнению, по праву является их."

 OTT_Population_Lazistan: "Культура большинства: §YLazi§!, армянская, турецкая/международная религия: §YSunni Мусульманская §!"
 OTT_Population_Lazistan_desc: "Санджак из Лазистана был космополитическим обществом, состоящим из греческого, турецкого, курдского, грузинского, армянского и лазиского населения, которое, по изначальным утверждениям армянского государства, было очень мало осталось от его немусульманского населения, попавшего в этот район, и тысячи армян были убиты во время Великой войны. &quot; Репрессалии &quot; русско-армянских войск до революции 1917 года еще больше ухудшили положение, поскольку и без того истощенное население пострадало от еще одного удара, в настоящее время до его суннитского населения. &quot; Окончание Великой войны &quot; прибыло для народа Лази, его земли были разрушены войной и постоянной миграцией. &quot; Экономика &quot; , основанная на сельском хозяйстве (главным образом на экспорте орехов &quot; ) и эксплуатации мин &quot; Зинч &quot; , не пожила так же, как многие навсегда покинули регион в поисках лучших земель."

 OTT_Population_Kars: "Культура большинства: §Yyurk§!, армянская, Kurdish\n Majority Religion: §YSunni Мусульманская §!"
 OTT_Population_Kars_desc: "Вилайет Карса был захвачен Российской империей после нашего поражения в Руссо-Оттоманской войне и лишь недавно вернулся в Империю. Десятилетия правления русских и их армянских союзников, армяне стали значительным меньшинством в Карской области, хотя и никогда не становятся более чем большинством. Война была не очень добра к этому армянскому населению, поскольку когда-то 30 процентов всего населения было сокращено до единой цифры. После Великой войны армянское население смогло вернуться назад, и оно неуклонно становилось на позиции до войны, хотя она прекратилась после возобновления турецкого правления, при этом многие сбежали в Ереван в ожидании того, что может произойти."

 OTT_Population_Diyarbakir: "Культура большинства: §YKurdish§!, турецкий, арабский (Сирийская)/международная религия: §YSunni Мусульманская §!"
 OTT_Population_Diyarbakir_desc: "Часть курдских основных территорий, район Диярбакир является процветающей, хотя и аграрной, а его столица, город Диярбакир, известна как важный центр обучения и важный город для мусульманской веры. &lt; &lt; Диярбакир Улу Ками &gt; &gt; , пятый священный участок ислама и одна из старейших церквей в мире, город и его регион сильно пострадали в последние годы Великой войны, поскольку болезни, пожары и страдания омрачали население &gt; &gt; ."

 OTT_Population_Van: "Культура большинства: §Y Arban §!, курдская, турецкая/nmajority Религия: §YSunni Мусульманская §!"
 OTT_Population_Van_desc: "Вилейет Вана можно рассматривать как одно из наиболее спорных поле боя в рамках кавказской кампании, в ходе которой несколько раз обменивались руки между русскими и османскими силами. &lt; &lt; Ван &gt; &gt; в той или иной степени пострадал от этнической чистки. &lt; &lt; Ван &gt; &gt; был одним из самых жестоких массовых убийств, так как оттоманские и армянские силы были безнаказанными, что привело к резкому сокращению численности населения в регионе. &lt; &lt; Армянское население &gt; &gt; после Великой войны, будучи центром политики обновления населения армянским правительством. &lt; &lt; Армяне &gt; &gt; стали самым крупным населением в регионе, однако курды следуют за ним, несмотря на обмен населения между двумя нациями, причем турецкое меньшинство также остается, и все мусульманское большинство."
 
 OTT_Population_Kirkuk: "Культура большинства: §YTurkoman §!, курдская, арабская (Ираки)/международная религия: §YSunni Мусульманская §!"
 OTT_Population_Kirkuk_desc: "Этот район, расположенный между курдовами, доминировавшими в Сулеймании, и арабским Мосулом, по-прежнему удерживается небольшим кливером Туркоманцев. &lt; &lt; Встречаясь с великими турецкими завоевателями &gt; &gt; , этот район был заселен солдатами из их армий после окончания войн. &lt; &lt; Формирование своей собственной культуры &gt; &gt; значительно отличается от анатолийских турков к северу и в некоторой степени ближе к степям на восток &gt; &gt; . &lt; &lt; Это неактуальная часть Османской империи &gt; &gt; была поставлена в известность непосредственно перед началом Великой войны, когда начали распространяться слухи о нефти вблизи города Киркук. &lt; &lt; Нефть &gt; &gt; была залита 14 октября 1922 года недалеко от города Киркук, что позволило провести широкомасштабные буровые операции по всему региону."
 OTT_Population_Erzurum: "Культура большинства: §Yurk§!, курдская религия: §YAlevi§!, суннитская мусульманская"
 OTT_Population_Erzurum_desc: "Вилайет Эрзурума почти вся его экономическая деятельность основана на животноводстве, выращивании пшеницы и льняных культур, и он отнюдь не является современным вилайетом, и он отстает от многих соседних с ним регионов в промышленном отношении. ~Нет, он служит важным регионом для Оттоманской армии, поскольку стратегическое расположение города Эрзурум со временем доказало свою ценность, особенно во время Великой войны, когда в 1916 году на город напали российские войска Юдениха."
 
 OTT_Population_Dodecanese: "Культура большинства: §YEGric§!, турецкая религия: §YOrthodox§!, мусульмане-сунниты"
 OTT_Population_Dodecanese_desc: "На островах Роудс, Кос, Патмос и других небольших островах Додеканец уже давно имеет привилегированный статус в Османской империи, начиная с эдикта Сулеймана, запрещающего вмешательство оттоманских генералов в их дела, после того как в 1522 году острова были захвачены у рыцарского госпиталя. Несмотря на то, что островитяне населены сильным греческим большинством, и хотя его особый статус был сохранен в XIX веке, молодые турки, наконец, отменили его в 1908 году в ходе их усилий по централизации государства. После этого быстро поднялись проблемы с костантинийе, и движения, призывающие к объединению с Грецией, получили дальнейшее развитие во всем регионе. Несмотря на то, что его народ был непоколебимыми сторонниками объединения с Грецией, в течение последних лет они процветали, став центром для многих богатых греков в Империи, чтобы расслабиться и вести прибыльную торговлю с Восточным Средиземным морем."
 
 OTT_Population_Suriye: "Культура большинства: §Yarab (Сирийская)§!, Druze\n Majority Religion: §YSunni Мусульманская §!, Druze"
 OTT_Population_Suriye_desc: "Этот сирийский вилайет, представляющий собой арабский метрополис и самый старый город в истории человечества, является центром консервативной оппозиции в Масрике. Его основной экономический вклад, который был найден в богатых плодородных землях на юго-востоке города, состоит в сельском хозяйстве, которое он отправляет из региона через порты Хайфа и Бейрут. nnDeep недоверие между турецкими властями и местным арабским населением все еще сохраняется после предательства города во время падения Империи в 1918 году, когда ворота были открыты для развивающейся армии Содружества. Друзе дальше к югу от Джебель-эль-Друза также продолжает создавать проблему, поскольку неоднократные попытки разоружить население и привести его в строй мало что принесли."
 
 OTT_Population_Mosul: "Культура большинства: §Yarab (Ираки)§!, Turkoman, курдская/nmajority Religion: §YSunni Мусульманская §!"
 OTT_Population_Mosul_desc: "Стоящий на западном берегу Тигри, город Мосул и прилегающие к нему земли образуют важный торговый узел на дороге от Индии к Средиземноморью, который сам по себе является главным образом важным для производства хлопка, однако в последние годы наблюдается появление нового растущего сектора. &lt; &lt; Черное золото &gt; &gt; , протекающее из месторождений вблизи Киркука, также было обнаружено вблизи Мосула, и его эксплуатация началась."
 
 OTT_Population_Sulaymaniyah: "Культура большинства: CNYKurdish §! n Majority Religion: §YSunni§!"
 OTT_Population_Sulaymaniyah_desc: "Проблема османской империи, область Сулеймании почти постоянно страдает от проблем между различными обитающими в ней курдскими племенами. В начале 20-х годов, когда шейх Махмут Барзинджи объявил себя «Королем Курдистана» и боролся с британскими войсками в Ираке, отчаявшись, «Король» бежал через границу в Персию. Он вернулся во второй раз в середине 20-х годов только для того, чтобы быть изгнанным."
 
 OTT_Population_Baghdad: "Культура большинства: §Yarab (Ираки)§! n Majority Religion: §YShia§!, суннитский мусульманин, еврейский"
 OTT_Population_Baghdad_desc: "Багдад, несомненно, является столицей Османского Ирака, но нельзя сказать, что это один и тот же гламурный город старого мира. После центра арабского мира город так и не оправился от вторжений, промывших его на протяжении веков. Кроме того, присутствие Тигриса служит важнейшим инструментом для его прошлых успехов и его роли в качестве торгового города, но оно также вызвало различные негативные последствия. Болезни бушуют в городе, так как наводнения регулярно разрушают его части. Интересным аспектом самого города является присутствие значительной еврейской общины, на долю которой приходится почти 30% населения. Несмотря на то, что в южной части Багдада находятся Святые города шиитской веры. Города Наджафа и Карбалы расположены для многих шиитов, что представляют собой Мекка и Медина для суннитов, что ведет к постоянному обмену идеями между прибывающими персидскими паломниками и местным населением. Кроме того, эти города и, более конкретно, их религиозные центры оказывают значительное влияние как в Ираке, так и в соседней Персии."

 OTT_Population_Basra: "Культура большинства: ассирийская (иракская) §!, Ассирийская религия: §YShia§!, Ассирийская церковь Востока"
 OTT_Population_Basra_desc: "Город Басра является одним из самых влиятельных центров в Ираке, поскольку после завершения строительства железнодорожной магистрали Берлин-Багдад он начинает видеть некоторое снижение значимости, поскольку расширение, соединяющее Кувейт с дорожкой, отвлекло бы морские перевозки к этой новой гавани."
 
 OTT_Population_Beyrut: "Культура большинства: §Yarab (Сирийская) §!, Druze\n Majority Religion: §YMaronite §!!, Druze, Suncient Musian"
 OTT_Population_Beyrut_desc: "Территория вокруг горы Ливан и Нахр-эль-Кабира является густонаселенной культурно-смешанной горой со времен финикийского народа, которая проходит между руками различных королевств и империй, до тех пор, пока в конечном счете не окажется в руках оттоманцев в XVI веке. Ливан на протяжении большей части своей истории под османскими автономными империями, управляемыми друзскими кланами, которые заявили о своей верности султану; фаворитизм друзских династий на позициях власти и предоставление привилегий мусульманским сектам; вскоре отделяет огромное число христиан вокруг горы Ливан, в частности маронитскую секту; серия восстаний за последние два столетия привела к открытой гражданской войне между христианами и друзами, которая привела к кризису, который вызвала политическое вмешательство западных имперских держав в офтальмологию Османской империи. И наконец, оттоманы, присоединяющиеся к европейской и марониту, требовали предоставления христианам сильной автономии в форме Мутасаррифата. nnOwing до ее непокорнности среди господствующего антиконионистского государства. &lt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; &gt; &gt; &gt; &gt; &lt; &lt; &gt; &gt; &gt; &gt; &lt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &gt; &"
 
 OTT_Population_Fezzan: "Культура большинства: §YArab (Ливийская)§!, Berber, Touareg, Tebu\n Majority Religion: §YSunni§!"
 OTT_Population_Fezzan_desc: "В 1551 году оттоманы захватили Триполи, и тогда они определят историю региона на следующие 400 лет. Однако суверенитет Османа не проникал во внутренние районы из-за экологии пустыни, отсутствия доходов для крупной кампании по опустыниванию и существования другого государства, а именно Авлада Мухаммеда, который был основан в 1550 году. Государство Авлад Мухаммад было торговым государством и стало станцией для организации и защиты торговых караванов. Феззан предоставил этому государству крупнейший рынок торговли в Сахаре между Биладом-эль-Суданом, Магрибом и Египтом. Это богатство, естественно, заманило администрацию в Триполи взять на себя ответственность за торговлю. Авлад Мухаммад Султанс оказал сопротивление оттоманам; всякий раз, когда они были побеждены, они уходят в район озера Чад, чтобы набрать солдат, особенно их союзников, правителей Катсины, и вернуться, когда армия Оттоман покинула Феззана, столкнувшись с военной экспедицией из Триполи, государство, однако в 1812 году должно было сложиться."
 
 OTT_Population_Halep: "Культура большинства: §Yarab (Сирийская) §!, турецкая/nmajority Region: §YSunni§!, католическая, алавитская"
 OTT_Population_Halep_desc: "Алеппо был когда-то величайшим городом в Османской Сирии с исключительным доступом к шелковой торговле из Персии и экономическим инвестициям от европейских держав, таких как Венеция. С падением Сафавидов в начале XVIII века, однако, шёлк начал бы протекать вокруг Персии, через Басру в Дамаск и затем в Европу, в основном в обход когда-то великого финансового центра Алеппо. В начале XIX века чума уничтожила четверть населения Алеппо, еще больше ослабив экономику города, особенно в пользу его соперника Дамаска. Введение хлопка дало городу новую аренду на жизнь в качестве экспортного города, но открытие канала Суэз для европейской торговли навсегда положило конец доминирующему положению Алеппо в торговле хлопком с Европой. Французское правление увидело взрыв сирийского национализма в регионе, который до сих пор остается непоколебимым националистом."
 
 OTT_Population_Latakia: "Культура большинства: §Yarab (Сирийская) §! n Majority Religion: §YAlawite§!, Maronite, суннитский мусульманин"
 OTT_Population_Latakia_desc: "Латакия — это древний город на побережье Средиземного моря. Район отделен от внутренней Сирии горным хребтом Ан-Нусайрии и широко используется для сельского хозяйства. Наиболее известным продуктом является табак Латакии, который торгуется по всему миру. Латакия оказалась под правлением Оттомана в XVI веке, но будучи частью процветающей империи, тогда не было благоденствия для города. Она оказалась в новом соперничестве с гаванями Триполи, Бейрута и Искендеруна, и земля обрушилась на город много раз в XVIII веке, оставив его в жалком состоянии. Гавань медленно захлебывается, и от нее должны стоять большие корабли. Большинство населения являются алавитами, они доминируют на холмах вокруг города. В городе многочисленное число людей составляют марониты или последователи мусульманской веры."

 OTT_Population_Palestine: "Культура большинства: §Yarab (Сирийская) §!, Еврейская религия: §YSunni§!, Еврейская, Католическая"
 OTT_Population_Palestine_desc: "В одном из наиболее спорных регионов мира Иерусалим находится в священных местах не одной, а трех основных мировых религий и в этом качестве играет ключевую роль в истории человечества. &lt; &lt; Отоманское &gt; &gt; . &lt; &lt; Под правлением Отомана &gt; &gt; регион процветал, когда система Милета использовалась здесь в полной мере и впоследствии была кодифицирована в &lt; &lt; танзиматских реформах &gt; &gt; , что предоставило мусульманам, евреям, христианам и другим группам широкую автономию в вопросах отправления культа, юрисдикции в отношении личного статуса, налогов и управления своими школами и благотворительными учреждениями. &lt; &lt; История Иерусалима и Палестины в целом была сильно потрясена в начале XX века, когда сионистское движение укрепилось в силе и численном поселилось в Ишуве во всем регионе, устанавливая свои собственные обычаи и даже перевооружая давно умерший еврейский язык. &lt; &lt; &lt; &gt; &gt; &gt; &gt; , &gt; &gt; &gt; &lt; &gt; беле &gt; &gt; &gt; &gt; &gt; и &lt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; &gt; &gt; &lt; &gt; &gt; Талфур &gt; заявление &gt; &gt; &lt; &gt; &lt; &lt; &gt; &lt; &lt; &lt; &lt; &lt; &lt; &gt; &lt; &gt; &lt; &gt; &lt; &lt; &gt; &gt; &gt; &lt; &gt; &gt; &lt; &lt; &lt; &lt; , пош &lt; &lt; &lt; &lt; &lt;"
 
 OTT_Population_Maan: "Культура большинства: §Yarab (Сирийская)§!, Circassian\n Majority Religion: §YSunni§!"
 OTT_Population_Maan_desc: "Южные сирийские земли вокруг города Амман уже давно сбежали от власти Оттомана и были оставлены без внимания нашими предшественниками, главным образом в качестве пункта доступа к гораздо более важному Хеджазу, наш контроль над регионом ограничивается прямым районом вокруг железной дороги Хежаз и некоторых горячих точек пилигрима по пути в Мекку. Это привело к значительному притоку мигрантов из Сирии, Цирасьсы и даже Анатолии, которые бежали от призыва на военную службу и налогообложения в северном районе."

 OTT_Population_Sinai: "Культура большинства: арабы (египтяне) §! n Majority Religion: §YSunni§!"
 OTT_Population_Sinai_desc: "Синай, известный прежде всего присутствием Мт-Синай, священного места для трех основных вероисповеданий Ближнего Востока, находится в особенном месте. Синай, при котором практически невозможно достичь урегулирования, поскольку большинство региона состоит из Синайской пустыни, тем не менее существует целый ряд бедуинских племен, которые построили свой дом на окраине пустыни. ~ nnhilst, как и остальная часть Ближнего Востока, Синай имеет долгую и разнообразную историю, она была потрясена совсем недавно, как Великая война, когда была местом интенсивных боев между Оттоманскими турками и Великобританией. Турки пытались захватить Суэцкий канал и как таковой отрезать британскую империю от своей империи, были отвергнуты двумя отдельными нападениями, после которых британские войска сами сделали опасный контрольно-пропускной пункт для вторжения в Сирию."

 OTT_Population_Medina: "Культура большинства: §Yarab (Hejazi) §! n Majority Religion: §YSunni§!"
 OTT_Population_Medina_desc: "Во-вторых, город Медина является одним из самых святых городов во всем исламе, привлекая тысячи людей во время ежегодного хаджа. Однако в Оттоманской истории город также известен отчаянной защитой генерала Фахреттина Паши, который полностью окружен силами арабского предателя Хусейна, держал город против всех и стал после войны символом силы и стойкости Оттоманской армии. ~ Не сравниваясь с его южными коллегами, город Медина не является разрушительным экономическим центром, Хежаз, но тем не менее он представляет собой ключевую станцию на железной дороге Хеджаз и местопребывание крупного оттоманского гарнизона."

 OTT_Population_Mecca: "Культура большинства: §Yarab (Hejazi) §! n Majority Religion: §YSunni§!"
 OTT_Population_Mecca_desc: "Город Мекка является одной из наиболее важных частей Османской империи, которая предоставляет нашей Падише возможность наследовать Калифа всего ислама. В рамках этого заявления сам город Мекка также пользуется специальным налоговым законодательством, которое освобождает его от всех обычных налогов, а вместо этого предоставляет ему субсидии или &quot; Сурре &quot; для содержания святых мест и приема паломников со всего мира в необходимом сиянии. &quot; Хейдз &quot; претерпела существенные изменения после провала &quot; Хеджази Револта &quot; , и его должны выполнять все богобоязненные мусульмане по крайней мере один раз в своей жизни, каждый год вызывая массовую материально-техническую операцию на всей территории Хеджази. &quot; . &quot; После восстановления нашего правления большая часть власти сконцентрирована в офисе &quot; Отоман Вали &quot; ( &quot; Хеджази Револт &quot; ), администрация Хеджази получила значительные изменения вследия &quot; , однако &quot; Оджази Револт &quot; , &quot; , &quot; Сама &quot; , &quot; Оттоман &quot; , &quot; , &quot; Остман &quot; , &quot; , &quot; Остман &quot; , правительство &quot; , &quot; , &quot; , &quot; , &quot; , &quot; Остман &quot; , &quot; , &quot; Остман &quot; , &quot; , &quot; , &quot; , &quot; Остман &quot; , &quot; , &quot; , &quot; , &quot; , &quot; , &quot; , &quot; , &q"
 
 OTT_Population_Aegean_Isles: "Культура большинства: §YEGRIK§! n Majority Religion: §YOrthodox§!"
 OTT_Population_Aegean_Isles_desc: "Остров Эгейских островов включает в себя самые разнообразные острова: Чиос, Лесбос, Самос и Родос. Каждый из них имеет богатую историю, которая, как правило, охватывает времена древней эгейской цивилизации. Родос был домом для госпиталей-рыцарей, и их крепости по-прежнему доминируют над столицей острова. Эгейские острова дважды в недавней истории меняли руки. В 1912 году, когда на Оттоманскую империю напали как Италия, так и союз Греции, Болгарии, Черногории и Сербии, острова были сданы врагам Порта. Их средства к существованию либо сельскохозяйственные работы, либо рыболовство, причем некоторые специальные виды продукции являются мастикой Чиоса, смолой деревьев, во многих целях, например, в виде спайса в турецком кофе, во флавор раки или даже в качестве финала для рисования и лака для музыкальных инструментов."
 
 OTT_Population_Cyprus: "Культура большинства: §YEGric§!, турецкая религия: §YOrthodox§!, суннит"
 OTT_Population_Cyprus_desc: "Оттоманское правление над островом Кипр в 1573 году восходит почти к пяти столетиям, и в течение многих лет претерпело многочисленные изменения. Наиболее важные из них заключались в том, что благодаря системе &quot; Тимарс &quot; или земельным субсидиям для отставных оттоманцев значительная кипрско-турецкая община сделала остров своим домом. &quot; Греческая община &quot; получила возможность сохранить различные привилегии, однако, поскольку в рамках Милетской системы они несли ответственность за свои религиозные обязанности, образование и развитие греческой культуры. &quot; Оттоманская империя &quot; также поощряла это, назначив архиепископа Кипра в качестве единственного представителя православной общины и постепенно в качестве представителя этнической греческой группы. &quot; Оттоман &quot; в конце XIX века, когда Мутасрифат был временно упразднен и интегрирован в &quot; Вилайет &quot; архипелаг &quot; , попытка в конечном итоге провалилась, поскольку расстояние от своего нового капитала (Чанаккале) привело к общению и административной головной боли. &quot; Оттоманско-российская война &quot; в конце XIX века &quot; в конце XIX века &quot; , когда &quot; , &quot; , &quot; , &quot; , &quot; , &quot; , &quot; , &quot; , &quot; , &quot; Мутай &quot; Мутасар &quot; , &quot; , &quot; , &quot; , &quot; Мутасарат &quot; , &quot; , &quot; , &quot; , &quot; , &quot; , &quot; Мутасарат &quot; , &quot; , &quot; , &quot; , &quot; ,"
 
 OTT_Population_Homs: "Культура большинства: §Yarab (Сирийская) §! n Majority Religion: §YSunni§!, Alawite, Catholic"
 OTT_Population_Homs_desc: "По всей видимости, в начале 2300 года город Хомс и близлежащий район сыграли важную роль в истории Сирии. Как и в остальной части Сирии, Хомс был захвачен арабскими калифатами в VII веке, после чего он быстро стал центром благочестия и сильным экономическим центром. Впоследствии город продолжал играть важную роль в том, что первые захватчики с запада, Аббасиды, тулуниды, хамданиды, караматы и хамданиды. Несмотря на это стремительное слияние династий, город Хомс процветал и быстро стал одним из крупнейших в Сирии. Город продолжал играть важную роль в то время, как первые захватчики с запада в виде крестоносцев и позднее захватчиков с востока в форме монгольских манголов пытались захватить стратегический город. Несмотря на то, что в 1516 году город в конечном итоге оказался в руках Оттомана и оставался важным центром для шелка, оливкового масла и секремента, в то время как его окрестные болота обеспечивали большое производство пшеницы, риса и винограда. Тем не менее город начал сворить свой массный рост в 20-дианском растении, в 20-нах говорном растении, в говорном говорном говоре, в х на х говоре, в говорке, в говорке, в х х х х на х х х х х х х х х х, в го о хват на х х х го оленью х х х го оленого хват х х х х х х го олени х х х х х х х х х х х х х х х х хватило х х го олен, в х хватило х хватило хватило хватило х, в своем х х х х х х х х х, в своем х х олень го олень го олень х"Manchester of Syria". Seeing little activity during the Great War as the main brunt of the British operations bypassed the city, the city has continued to grow in status and is proving a worthy rival to the other major cities of Syria, Damascus, Aleppo and Beirut."

 OTT_Population_Haifa: "Культура большинства: §Yarab (Сирийская) §! n Majority Religion: §YSunni§!, Catholic, Druze"
 OTT_Population_Haifa_desc: "После Великой войны в Палестине был создан санджак из Хайфы, поскольку потеря Иерусалима в результате выполнения международного мандата потребовала реорганизации сирийской администрации. &lt; &lt; Ситуация в Ливане &gt; &gt; после разрушительного голода, обрушившегося на регион, была, таким образом, достигнута договоренность о том, что вместе с ним в Хайфе будет создана новая столица &lt; &lt; Санджак &gt; &gt; , которая будет размещена под вилайетом Сурийе."
 
 OTT_Population_Tripolitania: "Культура большинства: §Yarab (Ливийская) §!, Berber, Turco-vidian\n Majority Religion: §YSunni§!, Ibadi"
 OTT_Population_Tripolitania_desc: "Триполитания является одной из трех частей Ливии, другими из которых являются Сиреника на западе и Феззан на юге. Она получила свое название из трех древних финикийских городов, которые сформировали союз в трех городах, где сейчас находятся земли вокруг города с тем же названием, Триполис. Между зелеными землями на побережье и пустыней на юге находятся горы Нафуза, обитающие в Берберах. После того как она стала частью Османской империи в XVI веке, регион, находящийся на границе Империи и вдали от Константинополя, обрел автономию, граничащую на самоуправлении. Паша Триполиса и его капитаны назвали себя опасными пиратами в Средиземном море до тех пор, пока западные державы Франции и Соединенных Штатов Америки не уничтожили как флот, так и город Триполи в конце XIX века. В период реформы Танзиномата, которая сейчас сто лет назад, Триполитаниа была одним из первых вилейцев, которые должны были образоваться в 1864 году. Септиа-Порте, которая вместе с другими странами, а также истребовала-саном, в 1864 года, она стала одним из Сетрийского ордена."
 
 OTT_Population_Benghazi: "Культура большинства: §Yarab (Ливийская)§!, Turco-vidian, Еврейская/nmajority Религия: §YSunni§!, Еврейская"
 OTT_Population_Benghazi_desc: "Город, основанный греческими поселенцами в 525BC под названием &lt; &lt; Эусперидес &gt; &gt; , был частью Пентаполиса или пяти наиболее важных городов в последней римской провинции Чиренаика. &lt; &lt; Город &gt; &gt; последовательно развивался как важный региональный центр и процветал в течение 600 лет, в результате чего близлежащий Сирен и Барка стали главным центром &lt; &lt; Сиреды &gt; &gt; . &lt; &lt; Барка &gt; &gt; . &lt; &lt; После вторжения Оттомана в Ливию &gt; &gt; город стал еще более известным, поскольку его стратегическое местоположение в Средиземноморье сделало его ключевым портом для контроля. &gt; &gt; . &lt; &lt; После начала итальянского вторжения в Ливию &gt; &gt; Бенгази, тем не менее, был самым бедным районом в Империи, не имеющим мощенных дорог, телеграфных услуг и гавана, в котором было слишком много места для движения. &lt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; &gt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; &gt; &lt; &gt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; &lt;"
 
 OTT_Population_Qatar: "Культура большинства: §YArab (Gulf)§! n Majority Religion: §YSunni§!"
 OTT_Population_Qatar_desc: "Оттоманская империя впервые заявила о своей юрисдикции над катарским полуостровом в 1550 году, когда племена вдоль побережья Аль-Хаса обратились за защитой к Оттоману. После того как они были оспорены местными шейхами и захватчиками с Аравийского полуострова, Остоманское правление было впервые прочно установлено в середине XIX века, хотя оно вновь отошело в Кувейт около конца века. Порт фактически отказался от суверенитета над Катаром в 1913 году в Соединенное Королевство, но теперь возвратил эту территорию от британских оккупантов."
 
 OTT_Population_Bahrain: "Культура большинства: §Yarab (Gulf)§!, персидская религия: §YShia§!, суннит"
 OTT_Population_Bahrain_desc: "Несмотря на то, что Османская империя присвоила себе власть над архипелагом Бахрейном с момента завоевания Басры в XVI веке, она никогда не осуществляла какого-либо централизованного контроля над ним. &lt; &lt; Островом &gt; &gt; на протяжении многих лет без постоянного правителя вторгались местные лидеры из Катара, племени Аль Халифа в начале XIX века, а в 1868 году британцы создали протекторат над островом. &lt; &lt; В 1892 году &gt; &gt; британское централизованное правление своего протектората и связало его с правительством Британского Раджа. &lt; &lt; Радж &gt; &gt; , когда в 1926 году вспыхнула гражданская война, Ганга Сингх бросила британские протектораты в Аравии, с тем чтобы предотвратить персидское вторжение &lt; &lt; Хамад &gt; &gt; ибн Иса Аль Халифа &gt; поклялиф поклялась в верностине &gt; . &lt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; &lt; &gt; &lt; &gt; &lt; &lt; &lt; &lt; &lt; &gt; &lt; &lt; &gt; &gt; Несмотря на рыба &lt; &lt; &lt; и &lt; &lt; &lt; &lt; &lt; и &lt; &lt; &lt; &lt; &lt; &gt; &lt; &gt; &lt; &gt; &lt; &gt; &lt; &gt; &gt; &lt; &lt; и &gt; и &gt; &lt; &lt; и &lt; &lt; и &lt; и &lt; &lt; &lt;"

 OTT_Population_Abu_Dhabi: "Культура большинства: §YArab (Gulf)§! n Majority Religion: §YSunni§!"
 OTT_Population_Abu_Dhabi_desc: "Защитники Великого Порта, Шайхса Трайсиального побережья, находятся под британским правлением в течение многих лет до сих пор. &lt; &lt; Шайхдомы &gt; &gt; имели свои внутренние разногласия, а напряженность между Шарджей, Дубаем, Абу-Даби и Аджманом возросла в последние несколько лет."
 
 OTT_Population_Eastern_Thrace: "Культура большинства: §Yurk§!, болгарская, греческая/nmajority Религия: §YSunni Мусульманская §!, православная христианка"
 OTT_Population_Eastern_Thrace_desc: "Несмотря на то, что Западная Фракия является малонаселенной и бедной, она обязана нашей экономике больше, чем можно было бы подумать, благодаря табачным плантациям региона и их вкладу в казначейство."
 
 OTT_Population_Momchilgrad: "Культура большинства: §Yurk§!, болгарская, греческая/nmajority Религия: §YSunni Мусульманская §!, православная христианка"
 OTT_Population_Momchilgrad_desc: "Когда-то Кардзали был известен как Жерково, важная крепость средневековых болгарских и последних византийских империй, и центр православного христианства, который был покорен Османской империей, он рос все больше и больше из-за иммиграции благодаря своему стратегическому торговому маршруту и получил свое нынешнее название - от Бриганда Кирки Али, который терроризировал дороги в XVIII веке и использовал Кардзали в качестве своего укрытия."
 
 OTT_Population_al_Hasa: "Культура большинства: §Yarab (Gulf)§!, персидская религия: §YShia§!, суннит"
 OTT_Population_al_Hasa_desc: "Оазис Аль-Хаса, или Аль-Ахса, как он называется на диалектах небедуинов в Аравии, является одним из самых новых добавлений в сферу Великий Порт. В то время как регион находился под османом в XVI веке, племя Бану Халидов прячет свою реальную власть в оазисах залива. В 1872 году прямое правление было восстановлено, и Аль-Хаса стало частью вилайета Басры, но это не должно продержаться долго, когда в 1913 году, используя слабость Империи, саудовцы прикрепляли регион к своему эмирату Неджда, так как эти трусы скрывали свои намерения в первом Арабском революции, земля была восстановлена не сразу, но теперь она снова находится под правлением Оттомана, хотя, как представляется, это не слишком много, с первого взгляда, она является воротами в центральную Аравию из залива, и ее многочисленные древние фермы, как говорится, производят только лучшие плоды. Некоторые изобретатели верят, что есть ценные ресурсы под песками Аль-Хаса, но это всего лишь слухи."

 OTT_Population_Urmia: "Культура большинства: CNYKurdish§!, Azeri\n Majority Religion: §YSunni§!, Shia"
 OTT_Population_Urmia_desc: "Азербайджанская провинция Персия, хотя и дом сафавидов Ирана, несколько раз на протяжении всей своей истории была оккупирована Османской империей. В начале XVI века в Дурранийские войны оттоманцы вторглись в этот регион, хотя вскоре их и выгнали из него. Во время Великой войны оттоманцы сражались на западе якобы нейтрального Ирана. Урмия была захвачена в 1915 году, а Туранистический проект Энвер-Паша, как представляется, приближается к реализации. Однако после окончания войны в 1919 году центральные державы были вынуждены покинуть регион до того, что осталось в Каджаре. Сейчас под турецким контролем, Западный Азербайджан, как представляется, будет оставаться противовесом мятежной Армении, трудной для северо-запада. Тем не менее, полная интеграция займет много времени."

 OTT_Population_Kermanshah: "Культура большинства: §YKurdish§!, Lur\n Majority Religion: §YShia§!"
 OTT_Population_Kermanshah_desc: "Горы Южного Курдистана находились под персидским контролем до тех пор, пока Османская империя не захватила эти земли в ходе недавнего конфликта. &lt; &lt; Оттоманская армия &gt; &gt; не впервые въехала в эту часть Курдистана, которая на протяжении многих лет находилась на границе между величественными землями Порта и различными персидскими империями. &lt; &lt; Керманша &gt; &gt; в административном центре бывшей иранской провинции. &lt; &lt; Несмотря на то, что на протяжении большей части истории она была достаточно процветающей, ее экономика подверглась удару, когда традиционные методы транспортировки по шёлковой дороге были заменены в прошлом веке дорогами на море, будучи новым оккупантами земли и продемонстрировав опасные тенденции в 1916 году, когда курды были депортированы в окраины Османской империи, консервативные курды с подозрением взглядом на Костантинийе."

 OTT_Population_Khuzestan: "Культура большинства: §Yarab (Ираки)§!, Lur\n Majority Religion: §YShia§!"
 OTT_Population_Khuzestan_desc: "Хузестан находится вдали от других провинций Персии, поскольку его население, хотя большинство шиитов, как и остальная часть страны, является арабским. На севере Хузестана, однако, живет Лур, иранский народ, который недавно был вынужден отказаться от своего кочевого образа жизни под персидским правлением. Часть Фертильного полумесяца, Хузестан сыграла важную роль в истории региона со времен античности. Древняя персидская империя имела свою столицу в Хузестане, в городе Суза. Суса была разрушена во время вторжения в Монголь, и с тех пор Шуштар и торговый порт Ахваза заняли это место в качестве самых известных городов провинции. Море является важным ресурсом для Хузестана, а Ахваз является входом во внутреннюю Персию, а рыболовство является основным источником продовольствия. Отоманский захват провинции сталкивается с смешанными чувствами. Хотя персидское правление никогда не было популярным, новая экономическая конкуренция в других гаванях на побережье не является причиной для празднования народа Хузестана."

 OTT_Population_Ajdabiya: "Культура большинства: §Yarab (Ливийская)§! n Majority Religion: §YSunni§!"
 OTT_Population_Ajdabiya_desc: "Город Адждабия находится на перекрестке традиционных маршрутов для караванов. Лишь в нескольких километрах от моря, дорог и маршрутов вдоль побережья Ливии, до Бенгази, на севере, встречаются с караванами, которые ведут внутрь Джагбуба и Куфры к югу от Киреницы. В центре города доминируют руины замка, построенного тысячу лет назад Фатимидами, который использовал Аджабию в качестве своего моста в Египет, который они в конечном счете завоевали в 969 году. Сам город, лежащий на плоском, скалистом плато с небольшим сельским хозяйством, является колодцем и резервуарами, которые поддерживают город живым и выращивают урожай. Хотя не крепость Ордена Сениси, как оазисские города на юге, он все еще был частью их достояния, и местные власти Оттомана должны будут найти способ завоевать население, чтобы добиться порядка, который сейчас поддерживается подмысловным портом."

 OTT_Population_Jaghbub: "Культура большинства: §Yarab (Ливийская)§! n Majority Religion: §YSunni§!"
 OTT_Population_Jaghbub_desc: "Оазисный город Джагбуб находится в аутсайдерах ливийской пустыни, ближе к египетской сиве, чем к какому-либо другому городу в Киреаце, он контролирует важный караван по пути в Египет, и многие верблюды, нагруженные товарами, останавливаются в водах Джагбуба. Земля вокруг него доминирует над пустынными песками, разбитыми острыми камнями доломита. До того, как Оттоманские войска заставили Орден Сенусси отступить в Куфру, Джагбуб был центром их передвижения с 1856 года, когда Орден построил свою штаб-квартиру под руководством своего основателя Мухаммада в качестве Сенусси, вокруг маленького города была построена стена, а Завия открыла двери, которые стали исламской школой известного происхождения. Мухаммад в качестве гробницы Сенусси находится в Джагбубе и привлекает паломников со всей Сахары."

 OTT_Population_Kufra: "Культура большинства: §Yarab (Ливийская)§! n Majority Religion: §YSunni§!"
 OTT_Population_Kufra_desc: "В районе Куфра доминируют огромные пески пустыни Сахара."the centre", being the central town at the largest of the oases of the region. The first European to set foot there was a German explorer only in 1873. The remoteness of the southern most frontier of the Cyrenaica is what led the Order of Senussi to set up their headquarters in Kufra. The Ottoman Empire had forced these unruly zealots out of Jaghbub in 1895. Now that it is under Ottoman control, much work awaits the local officials. While it is an important waypoint for caravans crossing the Sahara and was the main centre of Senussi thought, being a region of strategical importance for the whole of Libya, order must be restored, and this part of the desert largely remains not yet even mapped."

 OTT_Population_Yerevan: "Культура большинства: §Y Arman §! n Majority Religion: §YOrthodox§!"
 OTT_Population_Yerevan_desc: "Один из старейших постоянно живущих городов мира Ереван является административным, культурным и промышленным сердцем Армении. История Еревана начинается с основания крепости «Эребуни» в VIII веке до н. э., и Ереван, как древний город, продолжает играть свою роль как сердце армянского народа."


