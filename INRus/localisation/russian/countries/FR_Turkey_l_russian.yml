 tur.52.a: "Черт побери!"

 tur.53.t: "Кампания по набору персонала: низкий уровень кампании"
 tur.53.d: "Очевидно, что для того, чтобы выполнить нашу повестку дня, нам необходимо начать кампании по вербовке, конечно же, будет трудно убедить население [поехать на помощь] присоединиться к армии, чтобы обойти это, правительство начнет тонкую кампанию по вербовке и будет все более агрессивнее вербовать людей, запугивая эмбрионы национализма."
 tur.53.a: "Ради блага нации."

 tur.54.t: "Кампания по набору персонала: регулярная кампания"
 tur.54.d: "По прошествии нескольких месяцев наши усилия принесли свои плоды. По мере того, как мы начали повышать интенсивность кампании по вербовке, все больше и больше трудоспособных мужчин подписываются на вступление в [Рут. Гетегитивные] Сухопутные силы."
 tur.54.a: "Отлично."

 tur.55.t: "Кампания по набору персонала: активная кампания"
 tur.55.d: "Теперь правительство стало более открыто проводить свою кампанию, и она явно окупилась. &lt; &lt; То, что было когда-то тонкой кампанией по вербовке новых призывников &gt; &gt; стало полной кампанией с плакатами на каждом углу улицы. &lt; &lt; Подписывающиеся &gt; &gt; получают поддержку и стремятся служить родине. &lt; &lt; Наши вооруженные силы &gt; &gt; стали свидетелями рекордного числа людей."
 tur.55.a: "Замечательно!"

 tur.56.t: "Расширение прав и возможностей военизированных групп"
 tur.56.d: "Хюсейин Нихаль Бей сам выступал за сотрудничество с военизированными группами, которые поддерживают его общетурковую политику, и это может обеспечить, чтобы в случае широкого неодобрения и, если инакомыслие будет достаточно высоким, бунтовать против наших предложений, у нас была группа, вооружённая зубами, чтобы поддержать нас."
 tur.56.a: "Это необходимая мера."

 tur.57.t: "Реакция вооруженных сил"
 tur.57.d: "Вооруженные силы, по всей видимости, не проявляют любезности к нашей политике поддержки экстремистских военизированных групп и вооружения их самыми новыми видами оружия, ставя под сомнение наши приоритеты в отношении военных расходов и высказывая замечания относительно абсурдности нашей поддержки пантуркских военизированных группировок."
 tur.57.a: "Кем они себя возомнили?"

 tur.58.t: "Старые охранники говорят"
 tur.58.d: "Старые офицеры охраны стали еще более громкими в своей критике, утверждая, что поддержка военизированными группами самих вооруженных сил Нихал Бейтс бессмысленна, особенно учитывая, что [Root.GetNameDef] окружены врагами со всех сторон и им потребуются профессиональные силы, чтобы помочь защитить нацию в случае нападения, или, если мы пойдем на наступление, напасть на самих наших врагов."
 tur.58.a: "Они не знают, о чем они говорят..."

 tur.59.t: "Уничтожение левых"
 tur.59.d: "Мы использовали находящиеся под нашим контролем военизированные группировки для нашей выгоды, идентифицируя и убивая видных левых, лидеров и другие высшие должностные лица различных социалистических партий были выведены или вынуждены скрываться, хотя это вывело социалистические партии из общественной сферы, это не означает, что у них были подземные движения, с которыми, как представляется, придется иметь дело в будущем."
 tur.59.a: "Это должно было быть сделано."

 tur.60.t: "Реорганизация нации"
 tur.60.d: "Несмотря на то, что мы раз и навсегда избавились от Османской империи, мы по-прежнему сохраняем многое из проблем, которые поразили империю, например, наша бюрократия неэффективна и бесповоротна, в значительной степени неэффективна и не способна выполнять свою работу должным образом. Коррупция процветает, а отсутствие возможности индустриализации наносит ущерб нашей экономике. Мы должны приступить к реформированию самого ядра государства и созданию сильного турецкого государства."
 tur.60.a: "Мы добьемся успеха!"

 tur.61.t: "Работа с бюрократией"
 tur.61.d: "Как уже отмечалось выше, бюрократия, которой мы унаследовали, была неэффективной и способной выполнять даже самые простые задачи, и именно поэтому мы решили создать турецкую государственную администрацию, уволить старых охранников и заменить их умелыми людьми, способными эффективно и действенно выполнять свои задачи."
 tur.61.a: "Будем надеяться, что они..."

 tur.62.t: "Успех бюрократических усилий"
 tur.62.d: "К счастью, наши усилия по модернизации бюрократии, по большей части, принесли свои плоды, хотя нам еще предстоит пройти долгий путь для того, чтобы достичь того уровня успеха, которого мы действительно хотим видеть, это хорошее начало, и уже турецкое правительство, выполняя свои повседневные функции, начало более эффективно выполнять различные задачи и лучше удовлетворять потребности народа."
 tur.62.a: "Потрясающе!"

 tur.63.t: "Судебный контроль"
 tur.63.d: "Мы должны начать брать дело в свои руки; вместо того, чтобы допустить существование независимой судебной системы, мы должны обратиться к таким странам, как Соединенные Штаты, которые позволяют президенту, являющемуся главой исполнительной власти, назначать судей по своему усмотрению, однако мы также должны сделать свое заявление: президенту будет разрешено увольнять судей по своему усмотрению, а сами судебные органы, разумеется, будут контролироваться президентом."
 tur.63.a: "Вперед!"

 tur.64.t: "Закрывание парламента"
 tur.64.d: "До нашего прихода к власти парламент был в значительной степени парализованным институтом и имел кучу вражд, что ничего не значило, что сам парламент принял решение передать турецкое государство в руки империалистических держав, как можно допустить существование института, демонстрирующего такую наглую трусость?"
 tur.64.a: "Это необходимая мера..."

 tur.65.t: "Революция сломалась!"
 tur.65.d: "Похоже, наша политическая оппозиция взяла дело в свои руки, мобилизовав против нас все население! Либералистам и кемалистам удалось преодолеть свои разногласия и создать против нас коалицию, поклявшись вывести нас из себя, объявляя себя истинными наследниками [королевы. Гетэдей] нации. Мы не можем позволить им так запятнать название нашей великой империи, и мы должны принять решительные меры как можно скорее."
 tur.65.a: "Мы раздавим этих надменных узурпаторов!"

 tur.66.t: "Заказ новых морских круизеров"
 tur.66.cruisernoempire: "После трудоемких и интенсивных усилий военно-морских сил, после нескольких месяцев напряженной работы, нам удалось заказать два новых крейсера в составе крейсерского флота: морской крейсер Зафер и Явуз. Несмотря на то, что приобретение запасных частей для строительства этих крейсеров было нелегким подвигом, нам удалось добиться этого и в результате укрепить наш флот."
 tur.66.cruiserempire: "После трудоемких и интенсивных усилий военно-морских сил, после нескольких месяцев напряженной работы, нам удалось заказать два новых крейсера в составе крейсерского флота: морской крейсер Берк-и Сатвет, названный в честь нашего старого торпедного крейсера, который был сломан после Великой войны, и Мекидийе. Несмотря на то, что приобретение деталей для строительства этих крейсеров было нелегким подвигом, нам удалось добиться этого и в результате этого укрепить наш флот."
 tur.66.a: "Великолепно!"

 tur.67.t: "Военная помощь [TUR.GetNameDef]?"
 tur.67.d: "Интересно, что [TUR.GetNameDef] решил прийти к нам за помощью в военном отношении, конкретно просив нас помочь им в профессионализации и совершенствовании их вооруженных сил. Хотя это может оказаться пустой тратой ресурсов, если мы воспользуемся этим шансом, мы могли бы расширить наши связи с [TUR.Aductive] нацией. Что мы скажем?"
 tur.67.a: "Что может пойти не так?"
 tur.67.b: "Скорее нет."

 tur.68.t: "Приняли!"
 tur.68.d: "К счастью, кажется, что [отправители] решили принять нашу просьбу о военной помощи и начали оперативно направлять нам помощь, и это благо не только нашим вооруженным силам, но и будущим связям."
 tur.68.a: "Потрясающе!"

 tur.69.t: "[От GetNameDef] сорвался!"
 tur.69.d: "К сожалению, кажется, что [отправитель] решил решительно отклонить наш призыв об оказании военной помощи, заявив, что на данный момент у них нет ресурсов, которые можно было бы пощадить, что является откатом не только для наших вооруженных сил, но и для будущих связей."
 tur.69.a: "Неудачник, если быть уверенным..."

 tur.70.t: "Военная помощь [TUR.GetNameDef]?"
 tur.70.d: "Интересно, что [TUR.GetNameDef] решил прийти к нам за помощью в военном отношении, конкретно просив нас помочь им в профессионализации и совершенствовании их вооруженных сил. Хотя это может оказаться пустой тратой ресурсов, если мы воспользуемся этим шансом, мы могли бы расширить наши связи с [TUR.Aductive] нацией. Что мы скажем?"
 tur.70.a: "Что может пойти не так?"
 tur.70.b: "Скорее нет."

 tur.71.t: "Приняли!"
 tur.71.d: "К счастью, кажется, что [отправители] решили принять нашу просьбу о военной помощи и начали оперативно направлять нам помощь. Это благо не только нашим вооруженным силам, но и будущим связям."
 tur.71.a: "Потрясающе!"

 tur.72.t: "[От GetNameDef] сорвался!"
 tur.72.d: "К сожалению, похоже, что [отправители] решили решительно отклонить наш призыв об оказании военной помощи, заявив, что в данный момент у них нет ресурсов, которые можно было бы пожалеть, что это является откатом не только для наших вооруженных сил, но и для будущих [от. Возбуждения]-[отказа в помощи]."
 tur.72.a: "Неудачник, если быть уверенным..."

 tur.73.t: "Кризис отвержен!"
 tur.73.d: "К счастью, кажется, что нам удалось избежать полной гражданской войны со стороны оппозиционных групп, многие из главных преступников были пойманы и/или вынуждены прекратить свои действия против [Root.GetNameDef], что, безусловно, является благом для нашей страны, поскольку нам удалось протолкнуть ключевые законы, избегая при этом потенциальной дестабилизации государства."
 tur.73.a: "Замечательно!"

 tureco.1.t: "Экономический спад"
 tureco.1.d: "Похоже, несколько дней назад Лондонская фондовая биржа упала, а уровень безработицы и текучесть кадров в Соединенном Королевстве резко возросли. К сожалению, безработица и увольнения не остались незатронутыми, так как шоковая волна коллапса Лондонского рынка негативно повлияла на нашу великую нацию. Даже сейчас магазины начинают быстро закрываться, и иностранные компании оставляют [Root.GetNameDef] в автомобилях. Безработица и увольнения резко возросли, и в настоящее время среди населения наблюдается недовольство. Это не могло произойти в худшее время, и очевидно, что нам придется предпринять шаги по борьбе с этим экономическим спадом, чтобы не разорвать нашу страну."
 tureco.1.a: "Каретсин!"

 tureco.2.t: "Процветание социалистов в популярности"
 tureco.2.d: "Спустя несколько дней после экономического спада уже кажется, что социалисты в нашей стране начали использовать эту ситуацию в своих интересах. &lt; &lt; Решад Фуад &gt; &gt; и &lt; &lt; Шафик Хюсню &gt; &gt; активно пропагандируют политическую идеологию социализма и расширяют права и возможности простых работников, что, к сожалению, оказало заметное воздействие, поскольку социалистическая партия &lt; &lt; Трудящиеся &gt; &gt; и &lt; &lt; Персианты &gt; &gt; и Коммунистическая партия набирали последователей у разочарованного населения."
 tureco.2.a: "Бесполезный жест."

 tureco.3.t: "Национализировали свои железные дороги!"
 tureco.3.d: "При Оттоманской государственной задолженности многие из наших иностранных компаний и само правительство заинтересованы в [TUR.GetNameDef] самых известных и ценных промышленных предприятиях, включая их железные дороги. К сожалению для нас, правительство [TUR.GetAductive] приняло решение национализировать свои железные дороги, лишая тем самым нас и наши компании какой-либо прибыли."
 tureco.3.a: "Ничего не делай."
 tureco.3.b: "Эмбарго им!"
 tureco.3.c: "Объявить войну!"

 tureco.4.t: "Национализировали свои железные дороги!"
 tureco.4.d: "При Оттоманской государственной задолженности многие из наших иностранных компаний и само правительство заинтересованы в [TUR.GetNameDef] самых известных и ценных промышленных предприятиях, включая их железные дороги. К сожалению для нас, правительство [TUR.GetAductive] приняло решение национализировать свои железные дороги, лишая тем самым нас и наши компании какой-либо прибыли."
 tureco.4.a: "Ничего не делай."
 tureco.4.b: "Эмбарго им!"
 tureco.4.c: "Объявить войну!"

 tureco.5.t: "Национализировали свои железные дороги!"
 tureco.5.d: "При Оттоманской государственной задолженности многие из наших иностранных компаний и само правительство заинтересованы в [TUR.GetNameDef] самых известных и ценных промышленных предприятиях, включая их железные дороги. К сожалению для нас, правительство [TUR.GetAductive] приняло решение национализировать свои железные дороги, лишая тем самым нас и наши компании какой-либо прибыли."
 tureco.5.a: "Ничего не делай."
 tureco.5.b: "Эмбарго им!"
 tureco.5.c: "Объявить войну!"

 tureco.6.t: "[От имени] Эмбарго!"
 tureco.6.d: "Похоже, что наше решение о национализации наших железных дорог не было бесспорным."
 tureco.6.a: "Черт..."

 tureco.7.t: "[От имени] Эмбарго!"
 tureco.7.d: "Похоже, что наше решение о национализации наших железных дорог не было бесспорным."
 tureco.7.a: "Черт..."

 tureco.8.t: "[От имени] Эмбарго!"
 tureco.8.d: "Похоже, что наше решение о национализации наших железных дорог не было бесспорным."
 tureco.8.a: "Черт..."

 tureco.9.t: "Первоначальная стабилизация"
 tureco.9.d: "Хотя наши меры жесткой экономии были в значительной степени непопулярны для общественности, когда они были впервые приняты, кажется, что наша настойчивость в их применении принесла свои плоды из-за повышения налоговых ставок и сокращения государственных расходов, мы смогли смягчить некоторые последствия коллапса Лондонского рынка."
 tureco.9.a: "Замечательно!"

 tureco.10.t: "Торговля с [от GetNameDef]?"
 tureco.10.d: "В несколько неожиданном шаге [TUR.GetNameDef] обратился к нам, чтобы укрепить экономические связи между нашими странами. На этот раз они ясно дали понять, что они хотели бы заключить с нами торговую сделку в попытке обеспечить более свободное перемещение товаров между нашими странами и утверждали, что это принесет взаимную пользу обеим нашим экономикам. Какова наша реакция?"
 tureco.10.a: "Конечно!"
 tureco.10.b: "Абсолютно нет."

 tureco.11.t: "Приняли!"
 tureco.11.d: "[От Гетнама] решил принять наше предложение о сделке, тем самым позволив нам начать более свободное движение товаров между нашими двумя странами, а также поставить нас в благоприятную дипломатическую ситуацию, что имеет далеко идущие последствия, все из них хороши, для будущих совместных предприятий."
 tureco.11.a: "Тост за наших друзей!"

 tureco.12.t: "[От GetNameDef] сорвался!"
 tureco.12.d: "Похоже, что [отправители] сочли нужным отказать нам в сделке, тем самым лишив нас всякой секвенности экономического сотрудничества между нашими двумя странами и фактически лишив нас какой-либо экономической выгоды, которой мы могли бы воспользоваться, что имеет далеко идущие последствия для будущих совместных предприятий."
 tureco.12.a: "Черт!"

 tureco.13.t: "Торговля с [от GetNameDef]?"
 tureco.13.d: "В несколько неожиданном шаге [TUR.GetNameDef] обратился к нам, чтобы укрепить экономические связи между нашими странами. На этот раз они ясно дали понять, что они хотели бы заключить с нами торговую сделку в попытке обеспечить более свободное перемещение товаров между нашими странами и утверждали, что это принесет взаимную пользу обеим нашим экономикам. Какова наша реакция?"
 tureco.13.a: "Конечно!"
 tureco.13.b: "Абсолютно нет."

 tureco.14.t: "Приняли!"
 tureco.14.d: "[От Гетнама] решил принять наше предложение о сделке, тем самым позволив нам начать более свободное движение товаров между нашими двумя странами, а также поставить нас в благоприятную дипломатическую ситуацию, что имеет далеко идущие последствия, все из них хороши, для будущих совместных предприятий."
 tureco.14.a: "Тост за наших друзей!"

 tureco.15.t: "[От GetNameDef] сорвался!"
 tureco.15.d: "Похоже, что [отправители] сочли нужным отказать нам в сделке, тем самым лишив нас всякой секвенности экономического сотрудничества между нашими двумя странами и фактически лишив нас какой-либо экономической выгоды, которой мы могли бы воспользоваться, что имеет далеко идущие последствия для будущих совместных предприятий."
 tureco.15.a: "Черт!"

 tureco.16.t: "Выплата долгов Осману"
 tureco.16.d: "Поскольку мы являемся страной-кредитором в Оттоманской государственной задолженности и обладаем инвестициями в османской экономике наряду с османской задолженностью, мы также получили постоянные платежи от Османской империи, с тем чтобы выполнить свои финансовые обязательства и вернуть нам долг. Интересно, что оттоманцы считают нужным увеличить ставки, по которым они платят нам в попытке добиться экономической независимости."
 tureco.16.a: "Пока мы получаем наши деньги..."

 turfor.1.t: "Вызовите Трапизона!"
 turfor.1.d: "В каком-то удивительном шаге турки потребовали, чтобы мы передали им Трапизон или столкнулись с ужасными последствиями, хотя это было бы довольно плохо для нас, если бы мы просто отказались от земли и начали войну с [TUR. GetNameDef] также не идеально."
 turfor.1.a: "Мы не можем надеяться противостоять им..."
 turfor.1.b: "Мы будем сражаться, чтобы защитить нашу землю!"

 turfor.2.t: "Седес Трабзон"
 turfor.2.d: "Похоже, что он сложился и решил свалиться под наши требования, и земля скоро будет полностью под нашим контролем, и враги будут эвакуировать и выводить войска в этот район."
 turfor.2.a: "Отлично."

 turfor.3.t: "Отказывается от наших требований!"
 turfor.3.d: "Похоже, что он пошел против наших желаний и не отдал нам по праву нашу территорию."
 turfor.3.a: "Тогда мы возьмем его силой!"

 turfor.4.t: "[Турус. Найти] требует плебисцита в Карине."
 turfor.4.d: "Похоже, что [TUR.GetAductive] сочли нужным потребовать плебисцита на нашей спорной территории Карин, хотя мы могли бы просто отказаться от проведения плебисцита, поскольку Карин является законной армянской территорией, он не полюбил бы нас к людям, живущим в этом районе, и особенно к [TUR.GetAdestive]. Что нам делать?"
 turfor.4.a: "Мы не допустим дальнейших посягательств на нашу территориальную целостность!"
 turfor.4.b: "Всё, что угодно ради мира..."

 turfor.5.t: "Отклонение"
 turfor.5.d: "Похоже, что он пошел против наших желаний и не отдал нам по праву нашу территорию."
 turfor.5.a: "Уничтожить их!"

 turfor.6.t: "Результаты плебисцита - [TUR."
 turfor.6.d: "К сожалению, кажется, что предатели Карина продемонстрировали свои истинные цвета и отказались остаться в стране, несомненно, это удар по нашей гордости и международному престижу..."
 turfor.6.a: "Черт!"

 turfor.7.t: "Результаты плебисцита - [ARM."
 turfor.7.d: "К счастью, кажется, что преданный народ Карина понял, где он действительно принадлежит, и сделал выбор вернуться в народ."
 turfor.7.a: "Наши преданные граждане показали нам свою поддержку!"

 turfor.8.t: "Результаты плебисцита - [TUR."
 turfor.8.d: "К счастью, кажется, что преданный народ Эрзурума понял, где он действительно принадлежит, и сделал выбор, чтобы вернуться к народу."
 turfor.8.a: "Добро пожаловать домой!"

 turfor.9.t: "Результаты плебисцита - [ARM."
 turfor.9.d: "К сожалению, кажется, что предатели в Эрзуруме продемонстрировали свои истинные цвета и отказались мирно вернуться в [Рут."
 turfor.9.a: "Мы не признаем этих результатов, на войну!"
 turfor.9.b: "Мы должны уважать волю тех, кто в Эрзеруме."

 turfor.10.t: "Трелли требует троллей!"
 turfor.10.d: "В каком-то удивительном шаге турки потребовали, чтобы мы передали им троллей или столкнулись с ужасными последствиями, хотя это было бы довольно плохо для нас, если бы мы просто отказались от земли и начали войну с [TUR. GetNameDef] также не идеально."
 turfor.10.a: "Мы не уступим ни дюйма нашей земли!"
 turfor.10.b: "Мы не можем провоцировать войну с [TUR.GetName] в это время."

 turfor.11.t: "Отклонение!"
 turfor.11.d: "Похоже, что он пошел против наших желаний и не дал нам по праву нашей территории."
 turfor.11.a: "Тогда мы заберем нашу законную землю силой!"
 turfor.11.b: "Мы должны подождать..."

 turfor.12.t: "Принимается."
 turfor.12.d: "Похоже, что он сложился и решил свалиться под наши требования, и земля скоро будет полностью под нашим контролем, и враги будут эвакуировать и выводить войска в этот район."
 turfor.12.a: "Снова воссоединились с нашими братьями!"

 turfor.13.t: "[Тюрьма. Найти имя] требует Панфилии"
 turfor.13.d: "В каком-то удивительном шаге турки потребовали, чтобы мы передали им Панфилию или столкнулись с ужасными последствиями."
 turfor.13.a: "Эта земля по праву наша!"
 turfor.13.b: "Дай им никчемную землю."

 turfor.14.t: "Отклонение!"
 turfor.14.d: "Похоже, что он пошел против наших желаний и не дал нам по праву нашей территории."
 turfor.14.a: "На войну!"
 turfor.14.b: "Сначала мы должны подготовиться..."

 turfor.15.t: "Принимается."
 turfor.15.d: "Похоже, что он сложился и решил свалиться под наши требования, и земля скоро будет полностью под нашим контролем, и враги будут эвакуировать и выводить войска в этот район."
 turfor.15.a: "Скоро наша нация снова станет целой."

 turfor.16.t: "петиции для Мелитены"
 turfor.16.d: "Похоже, что турки сочли нужным просить нас, то, что они называют, на законных землях в [Роут-Гетнаме], в то время как отдача требованиям [TUR.GetNameDef] была бы ударом по гордости нашего народа и нашему международному престижу, рискуя войной с [TUR.GetNameDef] также не идеальна."
 turfor.16.a: "Эта земля по праву наша!"
 turfor.16.b: "Дай им никчемную землю."

 turfor.17.t: "Отклонение!"
 turfor.17.d: "Похоже, что он пошел против наших желаний и не дал нам по праву нашей территории."
 turfor.17.a: "Тогда мы вернем нашу землю через войну!"
 turfor.17.b: "Нам пока не нужна эта земля..."

 turfor.18.t: "Принимается."
 turfor.18.d: "Похоже, что он сложился и решил свалиться под наши требования, и земля скоро будет полностью под нашим контролем, и враги будут эвакуировать и выводить войска в этот район."
 turfor.18.a: "Даже Франция не хочет с нами воевать!"

 turfor.20.d: "Азербайджанское правительство приняло наше предложение, и сейчас мы официально оформили азербайджанско-турецкий союз."

 turfor.25.d: "С нашей победой над греками мы должны теперь обратить внимание на Боспорусские проливы и Константинополь. &lt; &lt; Британская комиссия &gt; &gt; вела их в течение 20 лет, и теперь, когда мы доминируем над Западной Анатолией, греки явно слишком слабы, чтобы считаться равными в отношении проливов. &lt; &lt; Поэтому &gt; &gt; было предложено обратиться к англичанам и подписать новый договор о будущем проливов."

 turfor.26.d: "С турецкой победой над греками турки обратились к нам в отношении будущего Боспорусского пролива и Константинополя, потребовали передачи, и наши экономические права в регионе находятся под защитой, а торговля продолжает проходить через регион, не подвергаясь военной угрозе."

