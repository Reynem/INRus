 OTT_Ottomanist_Focus_desc: "Это состояние согласуется с движением §Y Central §! и будет реагировать §GPositive §! на дальнейшие усилия OHF по централизации власти в Османском штате."
 OTT_Nationalist_Focus: "ACYAutonomist State §!"
 OTT_Nationalist_Focus_desc: "Это государство выступает против движения §Y Central §! и будет реагировать §RNegative§! на дальнейшие усилия ОХФ по централизации власти в Османском штате."

 OTT_Action_Declare_Martial_Law: "Армейский закон §!"
 OTT_Action_Declare_Martial_Law_desc: "Беспорядки между оттоманской жандармерией и местным населением стали слишком большими для наших скудных гарнизонов, чтобы иметь дело с ними. Мы должны четко заявить, что наша власть не может быть сведена на нет, и объявить военное положение над всем Вилайетом до тех пор, пока ситуация не будет снова под нашим контролем. / / / ototT_Action_Declare_Martial_Law_butt_clic_n §YEfect§!! /:n §Y [THIS. GetName] §! [!OTT_Action_Declare_Martial_Law_batt_click]"

 OTT_Action_Calm_Down_Local_Leaders: "§ Установите верных администраторов §!"
 OTT_Action_Calm_Down_Local_Leaders_desc: "Нынешняя администрация Вилайета доказала свою хитрость контролировать со многими из наших местных бюрократов и административных сотрудников, на которых сильно повлияла оппозиция. Для того чтобы обеспечить лояльность Вилайета, мы должны напомнить нашему губернатору и заменить его более подходящим персоналом для ускорения интеграции в будущем."

 OTT_Action_Recruit_Local_Troops: "Набор местных войск!"
 OTT_Action_Recruit_Local_Troops_desc: "Судьба Калифата снова висит на нитке, когда война доходит до наших берегов. Теперь все граждане должны сплотиться на ее знамя, чтобы сохранить как нашу честь, так и территориальную целостность."

 OTT_Loosen_Tax_Burden: "§YLoosen Налоговое бремя §! [THIS. Corporation_Check]"
 OTT_Loosen_Tax_Burden_desc: "Поддержка в Оттоманском парламенте зависит от многих факторов, но что по-прежнему является самым прямым путем к тому, чтобы пройти мимо его сумочки. Прежде всего, депутаты хотят получить дополнительные средства для своего собственного народа, и монеты отбросили свой путь. Хотя это может быть «устроено» за счет освобождения от налогов и возможности избежать страшного проекта для Османской армии, само собой разумеется, что это сильно подорвет общую способность правительства, поскольку коррупция, скорее всего, будет скатываться от [THIS.OT_LOOSEN_TA_BURDEN_Party], присоединится к §Gcoalitation §! [THY[THI.GetName]§R! Местная сила:%-25!"

 OTT_Loosen_Tax_Burden_only_twice: "Нет: уже дважды ослабляла налоги"
 OTT_Loosen_Tax_Burden_pp_cost: "Больше политической власти, чем §Y10§!"

 OTT_Increase_Tax_Burden: ""Увеличение налогового бремени"!"
 OTT_Increase_Tax_Burden_desc: "За каждый карман, наполненный деньгами, другой человек должен отказаться от своего урожая. Поскольку экономика империи в большинстве случаев является закрытой системой, единственный способ экономить средства для взятки или улучшения вилайетов - это взять их из другого. Сосредоточившись на регионах с низким риском или небольших этнических/религиозных группах, мы можем сохранить эту систему в хорошем состоянии и обеспечить лояльность тех, кому посчастливилось, чтобы ее можно было считать важной."

 OTT_Crush_Corruption: "Коррупция!"
 OTT_Crush_Corruption_desc: "Послав специализированную комиссию для регистрации и искоренения коррупционных деяний, мы надеемся укрепить наш контроль над вилайетом."

 OTT_Focus_Relief: "ACYFocus Relief Activities §!"
 OTT_Focus_Relief_desc: "Ужасы войны распространили разрушения и разрушения по всей империи, оставив тысячи несчастий в самых жалких условиях. Используя средства федерального правительства, мы можем исправить их борьбу и показать нашему народу, что правительство делает все, что в его силах."

 OTT_Action_Purge_Disloyal_Elements: "ACYPRUM Disployal Activities§!"
 OTT_Action_Purge_Disloyal_Elements_desc: "Враги государства повсюду, и именно через их уловку и предательство наша великая империя рушится. Военная война в суде, цензура в прессе и резко возросшее присутствие жандармерии на этой территории приведут к быстрому и решительному прекращению этой реакционной скулы. /nn [!OTT_Action_Purg_Disployal_Elements_batt_clat_click]n §YEfect§!! : ::n §Y[THIS. GetName]§!: [!OTT_Action_Purg_Disloyal_Elements_butt_click]"

