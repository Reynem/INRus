 #### Events ####
 tur.1.t: "Оттоманская империя"
 tur.1.d: "Когда [Root.GetNameDef] вступили в Великую войну на стороне центральных держав, они не ожидали суровой битвы и разрушительного поражения, которые последовали за ним. После окончания Великой войны [Root.GetNameDef] почти распалась, а британцы, поджарившие пламя для арабского национализма в империи &lt; &lt; Армия &gt; &gt; . Кроме того, когда [Root.GetNameDef] были вынуждены за столом переговоров, они были оккупированы и вырезаны державами &lt; &lt; Энтенте &gt; &gt; , а именно Великобританией, Грецией, Францией и Италией. Несмотря на то, что оставшаяся часть Османской империи, которая в настоящее время была ограничена Анатолией, была вынуждена принять правительство &lt; &lt; Энтатолии &gt; &gt; , которое вместе с с султаном выбирало империстов, и модернизировалочное общество, в то время, когда это было, возможно, чтобы держащие силы, были сильно, держащие силы, с тянулись на самом с антами, ."
 tur.1.a: "Аман Танрим!"

 tur.2.t: "Убийство султана!"
 tur.2.d: "В удивительном повороте событий, кажется, это событие стало шоком не только для многих в нашей стране, но и для международных наблюдателей, все из которых пытаются примириться с ситуацией. Хотя напряженность внутри [Root.GetNameDef] была высокой после нашего катастрофического поражения во время Великой войны, никто не думал, что оно придет к этому. Несмотря на это, Дом Османа пытается укрепить свою власть, пытаясь избежать краха нации, и Генеральная Ассамблея запланировала чрезвычайную сессию для обсуждения будущего [Root.GetNameDef]. Что бы ни случилось в этой войне, это, однако, еще не видно. Многие обеспокоены тем, что это может привести к окончательному падению империи..."
 tur.2.a: "Это не сулит ничего хорошего..."

 tur.3.t: "Заседания Генеральной Ассамблеи"
 tur.3.d: "Самые влиятельные и влиятельные из различных партий и фракций в [Роут.Гетнамдеф] собрались сегодня вместе в попытке определить судьбу [Рута.Гетнамедефа]. В настоящее время состояние нашей империи очень бурно, с волнением и неуверенностью в воздухе, когда страна ожидает решения Генеральной Ассамблеи. Сами люди, которые чувствуют себя беспомощными и неспособными изменить нынешнюю ситуацию, обратили свое внимание на это чрезвычайное заседание, которое определит стабильность и единство нашей империи – или ее отсутствие. Несмотря на то, что большинство присутствующих, особенно из дома Османа и партии Свободы и Заповеди, поддерживают быстрое укрепление власти при Доме Османа. Однако все возрастающее меньшинство, в основном состоящее из кемалистов и туранцев, ратует за уничтожение и возрождение новой турецкой нации с началом голосования. / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / Голосующие голоса / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / , и голоса / / / / / / / / / / / / / / / , и голоса , и голоса , и голоса"
 tur.3.a: "Империи больше нет!"
 tur.3.b: "Империя стоит сильной!"

 tur.4.t: "Разрушение Империи!"
 tur.4.d: "В том, что многие назвали очень тесным голосованием, кажется, что, несмотря ни на что, кемалисты и туранистические платформы смогли добиться успеха, при этом незначительное большинство делегатов проголосовали за отмену Османской империи. Само государство будет распущено быстро, с созданием нового турецкого государства, выходящего из пепла. Несмотря на то, что кемалисты и туранцы выступают за государство, которое сосредоточивается исключительно на поддержке потребностей и прихотей турецкого народа, а не на более широком мусульманском мире. Это, конечно же, не подорвет нас перед другими исламскими нациями, поскольку в связи с роспуском Османской империи начинается распад Калифата. . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . ."
 tur.4.a: "Туранцы победили!"
 tur.4.b: "Кемалисты победили!"

 tur.5.t: "Империя стоит сильна!"
 tur.5.d: "Как и ожидалось, представляется, что подавляющее большинство присутствующих делегатов проголосовали за то, чтобы сохранить не только государство, но и стабильность внутри государства, и предпочли бы, чтобы оно было реформировано не полностью распущено. Несмотря на то, что это не понравилось нам в политическом плане, главным образом кемалистам и туранистам, следует сказать, что многие внутри и без него вздыхают от облегчения, поскольку их инвестиции и обязательства в рамках империи остаются в безопасности. Несмотря на это, мы должны также обратить наше внимание на выбор нового наследника, чтобы занять место покойного султана Абдюльмесида II и нашей ведущей империи. В настоящее время есть два претендента на престол: Ахмед Нихад Эфенди, внук бывших султана Мехемеда V, который является гораздо более умеренным и призывает к либерализации империи. Или Осман Фуад Эфенди, сын Шалехзаде Мехмеда Селахадда Селахдада, который также пользуется славной репутацией бывшего империмера."
 tur.5.a: "Ахмед Нихад Эфенди!"
 tur.5.b: "Осман Фуад Эфенди!"

 tur.6.t: "Судьба дома Османа"
 tur.6.d: "После недавней победы [Root.Get Header] в качестве президента [Root.GetNameDef] и последующего роспуска Османской империи нам недавно стало известно о том, что с Домом Османа и его членами, которые все еще обладают значительным влиянием в [Root.GetNameDef] и исламском мире, должны иметь дело и их статус в [Root.GetAdъективной] стране, который был определен, ну, пока он существует, у нас есть два варианта: мы можем либо выслать семью, отправить их и оставить их на произвол судьбы, либо мы можем позволить им оставаться в пределах наших границ, но полностью устранить их политическое влияние. Особенно антимонархисты и революционные элементы в [Root.GetNamDef] предположили, что мы просто должны казнить королевскую семью и ее членов, но это может нанести ущерб нашей репутации в более широком международном сообществе."
 tur.6.a: "Позволь им остаться."
 tur.6.b: "Избавься от них."
 tur.6.c: "Исполните их."

 tur.7.t: "Новая эра"
 tur.7.kemalist: "С Османской империей, деградирующей структурой, которая теперь официально распущена, мы можем, наконец, обратить наше внимание на создание и консолидацию новой нации под руководством Республиканской народной партии. Несмотря на это, путь, который мы выбрали, будет нелегким для перехода. В настоящее время общее чувство во всем мире является неуверенным, поскольку люди не уверены в том, было ли решение распустить империю правильным."
 tur.7.turanist: "С Османской империей, деградировавшей в настоящее время, мы можем, наконец, обратить наше внимание на создание и консолидацию новой страны под руководством Туранистической партии. ~Несмотря на то, что наш путь будет нелегким для перехода. Вместе с тем, общее чувство во всем мире было неуверенным, так как люди не уверены в том, что решение о роспуске империи было правильным. ~ Не одна из самых больших проблем, с которыми сталкиваются наши новые режимы, заключается в процветании и обеспечении стабильности в рамках новой [Роут. Гетнэм]."
 tur.7.a: "Огонь в конце туннеля..."

 tur.8.t: "Постоянная фирма"
 tur.8.moderate: "К счастью, нам удалось решительно противостоять любой оппозиции, которая, возможно, попыталась распустить империю и потенциально дестабилизировать нашу великую нацию. Это не значит, что все находится в пределах [Рута. Гетнамедефа], конечно же, еще многое предстоит сделать. Тем не менее, мы надеемся, что будущее будет с восхождением султана Ахмеда IV на трон. . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . ."
 tur.8.revanchist: "К счастью, нам удалось решительно противостоять любой оппозиции, которая, возможно, попыталась распустить империю и потенциально дестабилизировать нашу великую нацию. Это не значит, что все находится в пределах [Рута. Гетнамедефа], конечно же, так много еще предстоит сделать. Однако, надеюсь, будущее будет с восхождением султана Османа IV на трон. . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . ."
 tur.8.a: "Огонь в конце туннеля..."

 tur.9.t: "Новая конституция"
 tur.9.moderateconstitution: "Очевидно, что наша империя, или то, что от нее осталось, является деспотичной нацией, которая по-прежнему несет на себе багаж, который на протяжении веков терзает ее. Если мы хотим положить конец нашим проблемам и действительно начать эру единства, стабильности и процветания для [Роут.Гетнамедефа], мы должны начать писать новую конституцию. Но сама конституция теперь наделяет большую часть власти в парламенте, отнимая ее у султана и Великого Визьера, что позволит создать более справедливую, более представительную нацию. Кроме того, судебная власть теперь является независимой ветвью, которая позволяет проводить более справедливые испытания людей. Надеюсь, это поможет нашей империи процветать."
 tur.9.revanchistconstitution: "Ясно, что наша империя, или то, что от нее осталось, является деспотичной нацией, которая по-прежнему несет с собой багаж, который на протяжении веков терзает ее. Если мы хотим положить конец нашим проблемам и действительно начать эру единства, стабильности и процветания для [Роут.Гетнамедефа], мы должны начать писать новую конституцию. Но сама конституция теперь предоставляет большую часть власти Султану и Великому Визиру, забирая ее из Генеральной Ассамблеи, что позволит стране с благожелательной и направляющей рукой. Султан также предпринял шаги, чтобы обеспечить, чтобы остальная часть правительства находилась под его волей, чтобы он мог лучше помочь диктовать политику империи. Надеюсь, это поможет нашей империи процветать."
 tur.9.a: "Замечательно!"

 tur.10.t: "Работа с бюрократией"
 tur.10.d: "Одна из самых больших и самых неразрешимых проблем в [Root.GetNameDef], бюрократическая система нашей империи была щекотливой на стороне любого компетентного правителя, который стремился модернизировать и осуществить перемены в нашей стране. ~ Несмотря на то, что правление султана уже прочно укоренилось и люди привыкли к новым политическим реальностям, с которыми они сталкиваются, настало время, наконец, приступить к решению грандиозной задачи, заключающейся в том, чтобы справиться с вялой и неэффективной бюрократической системой, которая слишком долго мучала нашу империю. ~ Не путем проведения серии реформ, призванных облегчить бюрократическую систему и сделать ее более эффективной как для бюрократов, так и для простых граждан, наряду с наймом как компетентных, так и преданных бюрократов, мы наконец можем добиться прогресса в создании [Root.GetNameDef] государства, которое находится наравне с ее европейскими братьями."
 tur.10.a: "Будем надеяться, что это сработает..."

 tur.11.t: "Наши усилия увенчались успехом!"
 tur.11.d: "Месяцы прошли, при этом султан и правительство обеспечили, чтобы реформы, направленные на модернизацию нашей бюрократии, прошли до уровня Т. К счастью, кажется, что благодаря сочетанию усилий бюрократов, а также осуществлению эффективных реформ, [Root.GetNameDef] стало более эффективным бюрократическим путем. Это позволило не только более квалифицированным бюрократам занять позиции в правительстве, но и простым гражданам легче вести свои повседневные дела с правительством. Реформы, несомненно, показали и сделали [Root.GetNameDef] лучшей нацией. ~ Кроме того, это вызвало шок у международных наблюдателей, которые сначала скептически отнеслись к нашим реформам."
 tur.11.a: "Это чудесно!"

 tur.12.t: "Реформа банковской системы"
 tur.12.d: "Работая над расширением прав и возможностей Центрального банка и Османской фондовой биржи, которые в последние несколько лет не видели большой экономической активности, мы можем более эффективно регулировать финансы в нашей стране, стимулируя при этом экономическую деятельность и помогая обеспечить стабильность нашей валюты, а также сворачивая свой взгляд на то, чтобы стать более прочной с финансовой точки зрения страной. Таким образом, мы можем обеспечить процветание всех наших граждан наряду с самим государством."
 tur.12.a: "Это необходимая мера."

 tur.13.t: "Состояние монархии"
 tur.13.d: "По мере того, как мы все более и более укоренились в нашей позиции управления империей, а также медленно, но, безусловно, восстановили доверие народа в Султанате, мы можем, наконец, сделать большой скачок веры и действительно начать либерализацию империи. nnSultan Ахмед IV объявил о своем решении ограничить власть Дома Османа, с тем чтобы расширить права и возможности трех ветвей власти и позволить более свободно и лучше управлять Османской империей. Эта новость стала шоком для всех, поскольку Султан ясно дал понять, что он сделает Султана более беспристрастным голосом в политике наряду с расширением возможностей простых людей и обеспечением представительства. Как хорошо эта система, однако, будет работать, пока не будет замечена..."
 tur.13.a: "Это, безусловно, знаменательное событие."

 tur.14.t: "Справедливость судебных органов"
 tur.14.d: "Для многих очевидно, что реформ в конце XIX века было недостаточно для того, чтобы в полной мере обеспечить справедливость судебной системы; мы должны обеспечить, чтобы реформы, которые были начаты ранее, такие, как дальнейшее создание и использование Меселе наряду с справедливыми/публичными судебными разбирательствами для наших граждан, были надлежащим образом осуществлены, с тем чтобы дать каждому гражданину империи возможность высказаться и получить свободу; кроме того, это поможет нам еще больше сократить разрыв между нами и остальными европейскими державами."
 tur.14.a: "Это будет большим бумом для наших усилий."

 tur.15.t: "Прекращение коррупции"
 tur.15.d: "Несмотря на то, что нам удалось провести и обеспечить проведение широкомасштабных реформ, таких, как реорганизация нашей некогда деградировавшей бюрократии, надлежащая многопартийная система и недавняя реформа судебной системы, нам все еще предстоит решить проблему безудержной коррупции в рамках империи, усилия, направленные на то, чтобы положить конец этому вопиющему акту, что некоторые могут подумать, измена империи должны быть совершены, антикоррупционные законы и меры будут приняты, и мы будем сотрудничать с Эмниет-и Умумийе, с тем чтобы обеспечить арест должностных лиц, пойманных в нарушение закона."
 tur.15.a: "Мы должны оставаться твердыми."

 tur.16.t: "Ремилитаризован Хюдавендигар"
 tur.16.d: "Когда радикалы успешно захватят власть в турецком государстве на востоке, кажется, что мы должны начать действовать, как они начали ремилитаризацию Гюдавендигара. Это, безусловно, создаст угрозу для нас, если мы не уладим ситуацию в ближайшее время. Мы могли бы предпринять упреждающее нападение или, в качестве альтернативы, обратиться к Великобритании с призывом помочь нам."
 tur.16.a: "Мы должны уничтожить турецкую угрозу!"
 tur.16.b: "Мы еще не готовы к войне..."
 tur.16.c: "Позвони англичанам."

 tur.17.t: "Ремилитаризация Гюдавендигара" 
 tur.17.d: "Одним из первых пунктов в списке нашего великого лидера стала ремилитаризация Гюдавендигара, который был демилитаризован в результате прекращения Великой войны и нашего унизительного поражения. &lt; &lt; Попытка &gt; &gt; &lt; &lt; исправить ошибки &gt; &gt; Великой войны и вернуть нашему народу прежнюю славу &gt; &gt; ."
 tur.17.a: "В конце концов, это наша законная территория."
 
 tur.18.t: "Просьба Греции"
 tur.18.d: "После недавней ремилитаризации Гюдавендигара Греция беспокоилась о растущей турецкой угрозе за пределами их границ и пришла к нам за помощью."
 tur.18.a: "Помогите им, конечно."
 tur.18.b: "Мы не можем рисковать еще одной войной..."
 
 tur.19.t: "Британия отказывается"
 tur.19.d: "Похоже, мы сами по себе."
 tur.19.a: "Черт!"

 tur.20.t: "Преодоление политической системы"
 tur.20.d: "Ограничивая партии, находящиеся в прямом противоречии, будь то прямо или косвенно, нашим целям, мы можем обеспечить, чтобы избранные парламентские представители были более благоприятными в отношении того, что мы считаем оптимальным, что означает, что многие республиканские и левые партии потеряют представительство, а Султану удастся медленно, но верно, взять бразды правления через манипуляции существующей системой."
 tur.20.a: "Отлично."

 tur.21.t: "Судебный контроль"
 tur.21.d: "Султан решил вмешаться и обратить вспять многие реформы, которые были проведены в судебной системе в конце XIX века; немусульмане больше не будут пользоваться теми свободами, которые у них были, и судебные процессы теперь будут благосклонны к народу, который мы считаем истинными Оттоманами; кроме того, султан получит больше полномочий для свободного применения канунских законов, и его слово будет считаться окончательным для всех; мы не можем надеяться, что судебная система будет оставлена в руках коррумпированных или неэффективных судей, если мы действительно хотим спасти империю."
 tur.21.a: "Власть укреплена."

 tur.22.t: "Новый Великий Визьер"
 tur.22.d: "Мы должны стремиться к назначению верного Великого Визьера в качестве способа содействия обеспечению большей легитимности нашего правления, а также к тому, чтобы масс казалось, что султан не обладает абсолютной властью, когда он на самом деле это делает. В том, что считается умным, но несколько рискованным шагом наблюдателей дома и за рубежом, Султан Осман IV решил назначить Мустафу Февзи Пашу новым Визьером. Как только министр войны [Root.GetNameDef] Мустафа Февзи Пашайц, несомненно, поможет осуществлять надзор за развитием мобилизованного и активного государства Оттоман, готового принять меры против всех, кто нанес ему ущерб."
 tur.22.a: "Надеюсь, мы сделали правильный выбор."

 tur.23.t: "Роспуск парламента"
 tur.23.d: "Очевидно, что парламент — это архаичная реликвия и всего лишь фикция, которая мешает не только желаниям султана, но и желаниям народа. Мы не можем допустить, чтобы такой институт, причиняющий вред не только нашему государству, но и нашему образу жизни, продолжался и должен стремиться к его немедленной ликвидации. Это, конечно же, не поразит нас по отношению к нашей политической оппозиции, которая теперь может стремиться сделать все возможное, чтобы остановить нашу инициативу. Кроме того, оппозиция в самой стране уже испытывает трудности с перевариванием наших текущих реформ, поэтому это может привести их к невыразимым поступкам."
 tur.23.a: "Вперед!"
 tur.23.b: "Уничтожить оппозицию!"

 tur.24.t: "Революция сломалась!"
 tur.24.d: "Похоже, наша политическая оппозиция взяла дело в свои руки, мобилизовав против нас все население! Туранцы, либералы и кемалисты смогли преодолеть свои разногласия и сформировали против нас коалицию, поклявшись вывести нас, объявив себя истинными наследниками империи. Мы не можем позволить им запятнать название нашей великой империи таким образом, и мы должны принять решительные меры как можно скорее."
 tur.24.a: "Боже, помоги нам."

 tur.25.t: "Новый Алфавит"
 tur.25.d: "Одна из предлагаемых реформ кемалистов заключалась в создании нового алфавита. Их план состоит в том, чтобы уничтожить старый оттоманский сценарий, который они считают архаичным и чужеземным, и принять латинский сценарий, тем самым вестернизируя алфавит. Кроме того, &quot; Туркификация &quot; и удаление различных слов из слова &quot; Аравийский и персидский кредит &quot; начнутся как можно скорее. Несмотря на все это, кемалисты приняли Закон об имени, который заставит всех граждан [Root.GetNameDef] принять фамилию и отменить титулы во время Османской империи."
 tur.25.a: "Ура!"

 tur.26.t: "Запретить Фез?"
 tur.26.d: "В то время как все кемалисты выступают за запрещение фез (и других связанных с религией головных уборов), они сталкиваются с большим сопротивлением со стороны традиционных и духовных деятелей в стране, хотя запрет на фез может способствовать модернизации, он рискует разозлить значительную часть населения."
 tur.26.a: "Мы должны модернизироваться, несмотря ни на что."
 tur.26.b: "Если подумать, это не так важно..."

 tur.27.t: "Статус нашего правового кодекса"
 tur.27.d: "Старый Остоманский правовой кодекс был крайне запутанным из-за включения в него светского и религиозного права, а зачастую и в пользу мусульманского большинства в стране. &lt; &lt; Кемалисты &gt; &gt; хотят покончить с тем, что они считают старым и устаревшим правовым кодексом, и создать светскую правовую структуру, основанную на швейцарском Гражданском кодексе, что пользуется поддержкой многих людей, которые хотят создать более справедливую систему, но рискуют разгневать традиционалистов и священнослужителей."
 tur.27.a: "Мы должны создать более справедливую систему."
 tur.27.b: "Нынешняя система в порядке."

 tur.28.t: "Грегорианский календарь?"
 tur.28.d: "Кемалисты хотят покончить с календарем Руми, который начинается с 622 года эмиграции Мухаммадс, и установить более широко используемый и западный календарь Грегорианов. Это не очень популярено среди общественности, поскольку они считают, что сама реформа слишком мала, чтобы изменить ситуацию, в то время как традиционалисты не поддерживают принятие того, что они считают западным календарем. Что нам делать?"
 tur.28.a: "Мы должны идти вперед."
 tur.28.b: "Может, это не очень хорошая идея..."

 tur.29.t: "Вопрос о правах женщин"
 tur.29.d: "Общество в Османской империи, как известно, является очень традицией, и у женщин нет политических прав. Продвигая идею о правах женщин, мы можем обеспечить лучшее представительство в нашей стране (на основе принятия законов о всеобщем избирательном праве и равенстве) и содействовать повышению производительности и равноправному участию в жизни турецкого общества. Конечно, это не понравится многим более традиционным членам нашего общества."
 tur.29.a: "Они заслуживают равных прав."
 tur.29.b: "Хватит говорить о правах женщин, давай поговорим о несправедливости женщин."

 tur.30.t: "Вторая Великая война"
 tur.30.d: "Опять же, пожары войны вспыхнули в Европе, окружив континент в жестоком адском огне, аналогичном тому, который разразился менее 20 лет назад. Немецкий режим не так давно взял на себя ответственность за «правление ошибок» Великой войны и создание новой Германии, которая вновь вспыхнула бы от Мёза к Неману. Удивительно, что немцы хотят быть очень невероятным врагом для «Согласия», так как Франция и Италия сталкиваются с трудностями в их ликвидации. Возможно, мы можем быть тем весом, который подскажет весы этой новой войны, и у нас нет никаких сомнений в том, что Германия примет предложение о союзе с учетом их позиции."
 tur.30.a: "Спроси немцев, можем ли мы присоединиться к Штальпакту!"
 tur.30.b: "Мы не заинтересованы в сближении с немцами."

 tur.31.t: "Элли на Востоке?"
 tur.31.d: "Удивительно, что бывший неизлечимо больной человек Европы обратился с просьбой присоединиться к Штальпакту. После Великой войны Османская империя была разделена гораздо более жестоко, чем Немецкая империя. Италия приняла Панфилию в сочетании с Францией, захватившей части Сирии, Ливана и Хантаба, что привело бы к созданию Фений. ~Нет, Оттоманцы сидят в стратегически ценном районе на Ближнем Востоке, имея их в качестве союзника, несомненно, значительно повредит французам и итальянцам... но опять же, они ни в коем случае не были жизнеспособным союзником во Великой войне."
 tur.31.a: "Впустите их!"
 tur.31.b: "Мы бесполезны для турок."

 tur.32.t: "Согласен."
 tur.32.d: "Немцы мудро согласились с нашей просьбой о приеме в Столпакт. Адам Дресслер поклялся, что после того, как наши страны сформировали Братство во время Великой войны, все жертвы из наоборот вернутся к своему бывшему величию. С появлением новой немецко-турецкой оси, настоящая империя, которой управляют турки, кажется, сейчас ближе, чем в последние годы Великой войны."
 tur.32.a: "Мы вернем нашу законную землю!"

 tur.33.t: "Отклонение!"
 tur.33.d: "Немцы, кажется, отвергли наше великодушное предложение! Не удивительно, что им удалось потерять нас во время Великой войны! Безумный диктатор, известный как «Адам Дресслер», сказал, что мы были минимально полезным союзником во время Великой войны и, вероятно, были еще хуже, учитывая, насколько жестоко мы разделились на конференциях Версаля. Мы сумели удержаться от упоминания о том, что Германия была невероятно унижена в Версальском соглашении, но проблема сохраняется. Мы были заперты в Сталпакте и наши земли все еще находятся в руках французов и итальянцев. Что нам делать?"
 tur.33.a: "Тогда мы заберем нашу землю без их помощи!"
 tur.33.b: "Наша законная территория, в конце концов, будет нашей."

 tur.34.t: "Итальянская капитуляция"
 tur.34.d: "После Великой войны мы по праву потеряли многие турецкие земли перед Собаками Энтенти. Кажется, снова началась война между немцами и Энтенти. К сожалению для итальянцев, они проиграли войну, не умея вовремя переключиться на другую сторону. материковый Итальянский полуостров твердо находится в немецком контроле, и у нас есть большая возможность вновь захватить наши законные земли, сражаясь с итальянским правительством, чтобы собраться в Африке. Это, вероятно, лучшая возможность, которую мы могли бы иметь, захватить Панфилию и вернуть их к власти турков."
 tur.34.a: "Схватить южное побережье!"

 tur.35.t: "Похитил Панфилию!"
 tur.35.d: "Эти оппортунистические ублюдки в Азии-младшей захватили Панфилию, после нашей капитуляции, мы боролись за восстановление и перебазирование в Африке, большая часть нашего флота потеряна, и наша армия не является даже частью своего бывшего размера, мы, к сожалению, мало что можем сделать против этих... стервятников!"
 tur.35.a: "Черт побери!"

 tur.36.t: "Французский капитуляция"
 tur.36.d: "К большому шоку нашего военного персонала, французы проиграли во время второй Великой войны, после прорыва на материке, их враги двигались прямо, пока не смогли добраться до Парижа. Французская материковая часть больше не находится в достаточной коме, французское правительство едва ли сможет эвакуировать нас в свои колонии, предоставляет нам исключительную возможность захватить юго-запад, французские военные не в состоянии противостоять нам на данном этапе."
 tur.36.a: "Схватить юго-восток!"

 tur.37.t: "Похитил Северную Сирию!"
 tur.37.d: "Безбожные турки захватили куски северной Сирии! С учетом нашего статуса изгнанной страны они играли в азартные игры, предполагая, что мы не будем сопротивляться оккупации колониальных территорий. Мало что эти Стервятники знают, что мы могли бы очень хорошо противостоять вторжению в северную Сирию, однако это потребует от нас передачи военных ресурсов на невозбужденный фронт. Возможно, в наших интересах позволить этому слайду и разобраться с турками, как только мы вернемся на родину."
 tur.37.a: "Черт побери!"
 tur.37.b: "Мы будем защищать наши земли!"

 tur.38.t: "Модернизация нашей бюрократии"
 tur.38.d: "Как граждане [Root.GetName], так и международные наблюдатели не скрывают, что Османская империя была деградировавшим и разрушающим государством с бюрократией, чтобы совпадать. Коррупция и бюрократическая неэффективность были широко распространены в бывшей империи и считались обычным явлением или не были должным образом улажены. К сожалению, это переросло в [Root.GetNameDef]. Мы должны предпринять шаги для обеспечения того, чтобы нанятые должностные лица были как эффективными на своей работе, так и готовы работать в интересах не самих себя, а государства. Кроме того, турецкая государственная администрация была создана для замены старой оттоманской бюрократии."
 tur.38.a: "Вперед!"

 tur.39.t: "Удачная модернизация бюрократии!"
 tur.39.d: "К счастью, наши усилия по модернизации бюрократии, по большей части, принесли свои плоды, хотя нам еще предстоит пройти долгий путь для того, чтобы достичь того уровня успеха, которого мы действительно хотим видеть, это хорошее начало, и уже турецкое правительство, выполняя свои повседневные функции, начало более эффективно выполнять различные задачи и лучше удовлетворять потребности народа."
 tur.39.a: "Отличные новости!"

 tur.40.t: "Революция сломалась!"
 tur.40.d: "Похоже, наша политическая оппозиция взяла дело в свои руки, мобилизовав против нас все население! Либералистам и традиционалистам удалось преодолеть свои разногласия и создать против нас коалицию, поклявшись вывести нас из себя, объявив себя наследниками Османской империи. Мы не можем позволить им отменить попытки модернизации, предпринятые нами."
 tur.40.a: "Боже, помоги нам."

 tur.41.t: "Конституция [Возвращайся к ней]"
 tur.41.fullreforms: "Когда мы, кемалисты, впервые вступили в должность после краха декадентской Османской империи, мы не ожидали беспрецедентного успеха, который мы испытали."
 tur.41.slightreforms: "Несмотря на то, что у нас было много амбиций, чтобы захватить власть, после краха Османской империи, нам не удалось осуществить все реформы, которые мы намеревались провести. Хотя это ни в коей мере не хорошо, ясно, что есть надежда для [Рута. Гет Наме Дефа] и ее народа, потому что, в то время как традиционным и священнослужителям удалось победить нас в настоящее время, были определенные группы людей, которые были восприимчивы к нашим реформам и хотели бы видеть Республику светским, современным и западным государством..."
 tur.41.a: "Да здравствует Республика!"

 tur.42.t: "Децентрализованное правило"
 tur.42.d: "Отдавая предпочтение местным органам власти и избавив административную систему от ее централизованного характера, мы можем содействовать обеспечению более широкого представительства населения и, следовательно, обеспечению подлинного демократического государства, что также помогает нам в наших усилиях по повышению эффективности самих административных и бюрократических систем, поскольку местные органы власти больше не должны следовать указаниям национального правительства в [РООТ.капитал.Гетнаме], не должны более игнорироваться требования народа и наша администрация не должна ограничивать сами местные органы власти."
 tur.42.a: "Ура!"

 tur.43.t: "Триумфантная стойка!"
 tur.43.d: "Как и ожидалось, нам удалось свергнуть инакомыслящих и революционеров, которые пытались свергнуть наше правление и погрузиться в анархию [TUR.GetNameDef]."
 tur.43.a: "За мир, стабильность и процветание!"

 tur.44.t: "[Тюрьма. Найти имя Деф] Преследует Тис"
 tur.44.d: "Интересно то, что новый лидер турецкого государства Хюсейин Нихал Бей, стремясь к дальнейшему продвижению общетуркских идеалов, решил укреплять связи с [Руко.Гетнамом]. Делегация [TUR.GetName] упомянула о нашей генетической близости и выгоде укрепления и углубления связей между нашими нациями, особенно с учетом постоянно обостряющейся бурной ситуации в мире."
 tur.44.a: "Что может пойти не так?"
 tur.44.b: "Нам не нужен пан-Туркизм."

 tur.45.t: "Принимает!"
 tur.45.d: "К счастью, кажется, что [от GetNameDef] решили принять наше предложение о углублении связей между нашим новым правительством. Хотя это можно рассматривать как нечто большее, чем символический жест многих международных наблюдателей, на самом деле это очень полезно, поскольку помогло придать легитимность нашему правлению и нашей программе, так как мы смогли доказать народу [Root.GetAductive], что мы можем успешно осуществлять нашу собственную повестку дня."
 tur.45.a: "Тост за наших друзей!"

 tur.46.t: "Расслабься!"
 tur.46.d: "Наша делегация только что сообщила другим туркменским странам тревожные новости: похоже, что [от GetNameDef] решили отклонить наше предложение об укреплении и углублении связей, указав, что в его нынешнем виде нет необходимости развивать пантуркические идеалы. Это огромный удар по легитимности нового правительства, поскольку мы в настоящее время не в состоянии доказать народу [Root.GetAductive], что мы можем успешно осуществлять свою собственную повестку дня."
 tur.46.a: "Черт побери!"

