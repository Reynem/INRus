##Description
CHI_FUHRERREICH_DESC: "После краха династии Цин в 1911 году и раздражительной попытки Юана Шикаи объявить себя императором в 1915 году Китай был разорван на несколько государств-военных, при этом лишь несколько из них провозгласили себя законным правительством Китая. &quot; Чианг Кай-Шек &quot; , возглавляемое Куоминтангом, выступает в качестве истца в Китайскую Республику и одно из самых сильных государств в южной части Китая. &quot; Смогут ли они воссоединить Китай как республику, или их запомнят как еще одно военное государство в эту эпоху хаоса? &quot; ."
