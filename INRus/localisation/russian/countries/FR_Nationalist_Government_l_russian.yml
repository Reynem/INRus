nat_china.37.a: "Отправь их прямо сейчас."
nat_china.37.b: "Мы можем пощадить только некоторых советников."

nat_china.38.t: "[USA.GetName] посылает генералов"
nat_china.38.d: "[USA.Adentive] приняли наши просьбы и послали нескольких генералов, чтобы помочь модернизировать нашу армию."
nat_china.38.a: "Отлично!"

nat_china.39.t: "[USA.GetName] посылает советников"
nat_china.39.d: "[USA.Guidement] решили направить военных советников, а не генералов."
nat_china.39.a: "Достаточно."

nat_china.40.t: "[CHI. GetNameDefCap] Открывает мирные переговоры"
nat_china.40.d: "[CHI.Adquestive] захватили наши владения в Китае и теперь подают в суд за мир при условии, что мы передадим всю территорию, требуемую для их законного правительства."
nat_china.40.a: "Мы должны принять их требования."
nat_china.40.b: "Мы пока не побеждены!"

nat_china.41.t: "[FROM.GetNameDefCap] соглашается уступить территории."
nat_china.41.d: "Правительство [FROM.GetAductive] согласилось передать все заявленные территории нашему законному правительству."
nat_china.41.a: "Отлично!"

nat_china.42.t: "[FROM.GetNameDefCap] уступает территориям."
nat_china.42.d: "Правительство [FROM.GetAductive] отказалось передать все заявленные территории нашему законному правительству."
nat_china.42.a: "Мы будем бороться."
nat_china.42.b: "Это безнадёжно..."

nat_china.43.t: "[CHI. Heave DefCap] Возвращается"
nat_china.43.d: "[FROM.GetAdexive] отклонили и признали наши претензии на территории Китая."
nat_china.43.a: "Как и ожидалось."

nat_china.44.t: "[Фром. Найм Дефкап]"
nat_china.44.d: "[FROM.GetAdexive] отклонили и признали наши претензии на территории Китая."
nat_china.44.a: "Как и ожидалось."

nat_china.45.t: "[CHI. GetNameDefCap] предлагает мир"
nat_china.45.d: "[FROM.GetNameDefCap] предложили мир."
nat_china.45.a: "Прими это."
nat_china.45.d: "Никогда!"





nat_china.28.t: "[CHI. GetName] предлагает интеграцию"
nat_china.28.d: "[CHI.GetName] сделали нам довольно интригующее предложение: они предлагают нам присоединиться к их нации как части большего целого и, в свою очередь, сохранить контроль над Сибэем как региональным администратором."
nat_china.28.a: "Тогда я останусь у власти?"
nat_china.28.b: "Если они так хотят Сибэй, они могут прийти и забрать его!"
nat_china.29.t: "[CHI. GetName] предлагает интеграцию"
nat_china.29.d: "[CHI.GetName] сделали нам довольно интригующее предложение: они предлагают нам присоединиться к их нации как части большего целого и, в свою очередь, сохранить контроль над Синкиангом как региональным администратором."
nat_china.29.a: "Тогда я останусь у власти?"
nat_china.29.b: "Если они так хотят Синкьяна, они могут прийти и забрать его!"
nat_china.30.t: "Ма Буфан согласился"
nat_china.31.t: "Ма Шаоу согласился."
nat_china.30.d: "Ма Буфан решила, что номинальное положение в законном правительстве Китая было бы предпочтительнее войны."
nat_china.31.d: "Ма Шаоуу решила, что номинальное положение в законном правительстве Китая было бы предпочтительнее войны."
nat_china.30.a: "Отлично!"
nat_china.31.a: "Отлично!"
nat_china.32.t: "Ma Bufang Resists"
nat_china.33.t: "Сопротивление ма Шаоу"
nat_china.32.d: "Ма Клик сопротивляется нашим требованиям и готовится к войне."
nat_china.32.a: "Ненадолго."
nat_china.32.b: "Мы нанесём удар, когда будем готовы."
nat_china.33.d: "Клика Синьцзян противостоит нашим требованиям и готовится к войне."
nat_china.33.a: "Ненадолго."
nat_china.33.b: "Мы нанесём удар, когда будем готовы."

nat_china.250.t: "Китайцы требовали, чтобы мы покинули Китай!"
nat_china.250.d: "Новое правительство Китая потребовало, чтобы мы немедленно покинули наши колонии в Китае и, в свою очередь, передали их"rightful" government."
nat_china.250.a: "Если они так хотят их, они могут прийти и забрать их!"
nat_china.250.b: "Китайцы сильнее, чем когда-либо, смотреть им в глаза было бы виртуальным самоубийством."
nat_china.251.t: "Британцы сопротивляются!"
nat_china.251.d: "Британцы решили встать на свою позицию и, кажется, не сдадут свои территории в ближайшее время."lease" end."
nat_china.251.a: "Тогда у нас нет выбора, кроме как захватить колонии силой."
nat_china.251.b: "Мы не готовы к войне с англичанами."
nat_china.252.d: "После долгих дебатов британцы подчинились нашим требованиям."
nat_china.252.a: "Отличные новости"
nat_china.253.d: "Столкнувшись с противодействием британского народа, китайцы решили сбежать вместо того, чтобы сражаться."new China" isn't much different from the old one after all."
nat_china.253.a: "Жалкое зрелище"
nat_china.254.d: "Пекин, столица бывшей Китайской Республики, теперь находится в руках ее мошенников, и наконец, у нас вновь есть столица, достойная нашего великолепия."
nat_china.254.a: "Мастеры Китая вернулись на свое законное место."
nat_china.255.d: "Новое правительство Китая потребовало, чтобы мы немедленно покинули наши колонии в Китае и, в свою очередь, передали их"rightful" government."
nat_china.255.a: "Этот вопрос должен быть решен во Франции!"
nat_china.255.b: "Франции не стоит беспокоиться об этом."
nat_china.256.d: "Были выдвинуты требования о том, чтобы мы передали наше китайское имущество новому правительству Бейянга; если мы не выиграем возможную войну с этой фракцией, то это может означать прекращение французского правления в Восточной Азии."
nat_china.256.a: "Мы будем сражаться с последним человеком за нашу славную империю!"
nat_china.256.b: "Мы не можем рисковать потерять больше нашего восточно-азиатского имущества."
nat_china.257.d: "Французы противостоят нашим требованиям, однако французская колониальная империя - это не что-то легкое, с их вниманием к германской угрозе, которая может стать войной, которую мы можем выиграть."
nat_china.257.a: "Если война - это то, чего они хотят, тогда война будет у них."
nat_china.257.b: "Это может быть больше, чем мы можем выдержать."
nat_china.258.d: "Французы подчинились нашим требованиям и как таковые передают всю территорию Китая нашему праведному правительству."
nat_china.258.a: "Империалисты падают один за другим"
nat_china.259.d: "Китайское правительство отказалось, и мы должны ожидать от них больше никаких хлопот."
nat_china.259.a: "Тужься"
nat_china.260.d: "Новое правительство Китая потребовало, чтобы мы немедленно покинули наши колонии в Китае и, в свою очередь, передали их"rightful" government."
nat_china.260.a: "У нас нет выбора..."
nat_china.260.b: "Мы можем хотя бы подраться с ними!"
nat_china.261.d: "Португальцы подчинились нашим требованиям и передали порту Макао."
nat_china.261.a: "Отличные новости!"
nat_china.262.d: "Португальцы отказались отказаться от колонии в Китае."
nat_china.262.a: "Они просили об этом."
nat_china.262.b: "Может, мы все-таки не готовы..."
nat_china.263.d: "Новое правительство Китая потребовало, чтобы мы немедленно покинули наши колонии в Китае и, в свою очередь, передали их"rightful" government."
nat_china.263.a: "Не сдаваться!"
nat_china.263.b: "Немедленно отправьте в британское посольство!"
nat_china.263.c: "Мы отдадим его..."
nat_china.271.t: "Китайцы требуют Тайвань и наши владения!"
nat_china.271.d: "Новое правительство Китая потребовало, чтобы мы немедленно покинули Тайвань и наши владения в Китае и передали их"rightful" government."
nat_china.271.b: "У нас нет выбора..."
nat_china.271.a: "Мы можем хотя бы подраться с ними!"
nat_china.273.t: "Япония отвечает нашим требованиям."
nat_china.273.d: "Японцы подчинились нашим требованиям и передали остров Тайвань."
nat_china.273.a: "Отличные новости!"
nat_china.272.t: "Японцы сопротивляются!"
nat_china.272.d: "Японцы сопротивляются нашим требованиям."Proper Japanese Territory", and that they wont be relinquishing it to our government."
nat_china.272.a: "Если они думают, что флот может спасти их, они сильно ошибаются."
nat_china.272.b: "К сожалению, нам понадобятся десятилетия, чтобы построить флот, достаточно сильный, чтобы соревноваться..."
nat_china.274.t: "Китайский задний ход"
nat_china.274.d: "Китайцы отказались и не будут добиваться удовлетворения своих требований на Тайване."
nat_china.274.a: "Слава Богу!"

