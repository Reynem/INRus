#### Custom Triggers #####
CHI_can_china_be_unified_tt: "Правительство и экономика стабильны, и мы готовы объединить Китай."
CHI_is_china_unified_tt: "Китай был единым"

##### Events #####
nat_china.1.t: "Он Инкин берет контроль"
nat_china.1.d: "Сегодня мы отмечаем новую эру для Китая, так как генералиссимо ему удалось установить полный контроль над национальным правительством, однако, как представляется, различные группы выступают против этой смены руководства, и некоторые утверждают, что национальное правительство перейдет в ведение военного барона."
nat_china.1.a: "Генералиссимо поведет нас."

nat_china.2.t: "Сотрудничать или умирать"
nat_china.2.d: "Многие из наших советников согласны с тем, что мы должны принять их требования, поскольку мы не в состоянии бороться с более модернизированной частью Китая."
nat_china.2.a: "Прими это."
nat_china.2.b: "Мы можем бороться с ними."

nat_china.3.t: "[FROM.GetNameDefCap] отверг наши требования"
nat_china.3.d: "[FROM.GetNameDefCap] отвергли наши требования и отказались сотрудничать с нами."
nat_china.3.a: "На войну!"

nat_china.333.t: "[FROM. GetNameDefCap] принял наши требования"
nat_china.333.d: "[FROM.GetNameDefCap] согласился сотрудничать с нами, и их регион был впитан в наше новое китайское государство."
nat_china.333.a: "Отлично!"

nat_china.4.t: "Китай требует наших территорий на материке."
nat_china.4.d: "Правительство потребовало, чтобы мы передали ему наши запасы на материковой части Китая, многие войска, прибывшие на нашу границу и готовы к войне, если она вспыхнет."
nat_china.4.a: "Принять требования"
nat_china.4.b: "Нет, если они хотят войны, они могут ее получить."

nat_china.5.t: "Правительство отвергло наши требования!"
nat_china.5.d: "Похоже, что [FROM.GetAditive] не оправдает наших законных притязаний на все территории Китая и не передаст нам их владения на материке."
nat_china.5.a: "Быстрый выход на их территории без объявления войны."
nat_china.5.b: "Весь Китай будет нашим!"
nat_china.5.c: "Мы должны отступить..."
CHI_peace_imperialists: "Если мы оккупируем все серьёзные штаты, то мы откажемся от мира с нашим врагом."

nat_china.613.t: "[FROM.GetNameDefCap] принял наши требования."
nat_china.613.d: "Правительство [FROM.GetAditive] приняло наши требования и уступило нам всю нашу заявленную территорию."
nat_china.613.a: "Отлично!"

nat_china.6.t: "[CHI.Name] марширует на нашу территорию"
nat_china.6.d: "Похоже, что упрямое правительство приказало своим войскам на границе захватить наше удерживание на материке, наши остающиеся войска были убиты, а некоторые наши дипломаты были заключены в тюрьму, многие возмущены действиями Китая и требуют военных действий."
nat_china.6.a: "Это не стоит долгой войны."
nat_china.6.b: "На войну!"

nat_china.34.t: "[FROM. GetNameDefCap] просит генералов"
nat_china.34.d: "[CHI.GetAductive] пытались заручиться нашей поддержкой и просили послать несколько генералов, чтобы помочь им модернизировать свою армию."
nat_china.34.a: "Отправь их прямо сейчас."
nat_china.34.b: "Мы можем пощадить только некоторых советников."

nat_china.35.t: "[ГЕР. Найти имя] посылает генералов"
nat_china.35.d: "[ГЕР.Возвращение] приняли наши просьбы и послали нескольких генералов, чтобы помочь модернизировать нашу армию."
nat_china.35.a: "Отлично!"

nat_china.36.t: "[ГЕР. Найти имя] посылает советников"
nat_china.36.d: "[ГЕР.Возвращайтесь] решили направить военных советников, а не генералов."
nat_china.36.a: "Достаточно."

nat_china.37.t: "[FROM. GetNameDefCap] просит генералов"
