 ### Events ###

 comfrance.1.d: "В Париже и на промышленном севере профсоюзы и социалистические ополчения захватили контроль, объявляя старую республику мертвой и провозглашая рождение нового революционного правительства."

 comfrance.2.d: "Война проиграна. Революционные силы разрушили наши армии и сейчас стоят у ворот каждого крупного города. материк — это их неиссякаемый дом, и оставаться перед лицом захвата и казни. Наша единственная оставшаяся надежда — это бежать. ВМС остаются частично лояльными и могут эвакуировать правительство и все наши останки в наши колонии в Африке. Из Алжира мы сможем восстановить свою силу и, однажды, вернуться на свободу нашей родины. Мы должны уйти сейчас или погибнуть."

 comfrance.3.d: "Победа! Силы реагирования и капитализма были полностью побеждены и изгнаны с материка. Остатки старого правительства, вместе с буржуазными хозяевами, бежали в свои колониальные владения в Северной Африке, как трусы в ночи. Несмотря на то, что они все еще представляют угрозу со всего Средиземноморья, революция в безопасности здесь, дома. Наша первостепенная задача должна состоять в восстановлении нации и обеспечении завоеваний рабочих. Мы можем разобраться с изгнанцами в Алжире позже. Пока мы предложим им перемирие, чтобы положить конец кровопролитию."

 comfrance.4.d: "В то время как наша собственная революция еще молода, появилась возможность. Немецкая военная машина повернулась против Швейцарии, и их армии заняты борьбой за свою жизнь. Швейцарское государство, бастион буржуазного нейтралитета, в настоящее время находится на грани. Это наш шанс действовать. Француженки романских рабочих давно отделены от своей истинной родины. Мы можем «либерировать» эти регионы и объединить их с нашим революционным государством, пока швейцарцы отвлекаются. Мы должны воспользоваться этим моментом!"

 comfrance.5.d: "Швейцарцы рушатся. По мере того, как немцы поднимаются с севера, новое французское революционное правительство также двигается к захвату франкоговорящих кантонов. Презренный швейцарский нейтралитет потерпел неудачу, и страна изображается как праздник. Этот хаос предоставляет нам золотую возможность. Итальяноязычные земли Тичино и Грисонов по праву принадлежат нам, и теперь они полностью не защищены. Мы можем восстановить этот тернальный безотзывный с едва ли выстрелом. Мы должны действовать до момента!"

 comfrance.6.d: "В то время как наши храбрые солдаты отчаянно держат линию против немецкого нападения, шакалы ударили нас в спину, используя нашу борьбу как отвлекающий маневр, их армии пересекли границу и захватили нашу суверенную территорию, без провокаций."

 comfrance.7.d: "Гражданская война окончена, и коммуна победила! Реакторы потерпели поражение или сбежали, оставив нас построить новую Францию из пепла старого. Тяжелая часть закончилась, сейчас начинается тяжелая часть. Революционная коалиция, объединившаяся в своем противостоянии старому режиму, теперь разделилась на том, что будет дальше. Советы трудящихся, партийные идеологи и профсоюзные начальники имеют разные представления о нашем социалистическом будущем. Теперь мы должны решить, какой путь пойдет революция."

 comfrance.159.t: "Париж потерян!"
 comfrance.159.d: "Париж, город света, колыбель революции и столица Франции были захвачены врагом!"
 comfrance.159.a: "Фуле-эсклав, дебаут, дебаут!"

 comfrance.160.t: "Освобождение Альзаса-Лоррена"
 comfrance.160.d: "Мы продвинулись в провинции Альзас-Лоррейн и обезопасили весь регион."
 comfrance.160.a: "...группы "Нужны" и "оскверняем"..."

 comfrance.161.t: "Празднование Дня Бастилии"
 comfrance.161.d: "Сегодня Фетский национальный праздник, празднование бури Бастилии и начало первой французской революции."
 comfrance.161.a: "Вив Ла Коммун!"

 comfrance.163.t: "День труда"
 comfrance.163.d: "Сегодня во всем мире демократические, коммунистические и социалистические правительства отмечают Международный день трудящихся, День труда или День мая."
 comfrance.163.a: "Отпразднуем!"

 CoF_Foreign.1.d: "Длинная борьба против реакционных сил в Германии наконец закончилась. Наши победившие войска, продвигаясь на восток, установили контакт с авангардом Красной Армии, продвигающимся с запада. Разрыв был ликвидирован, и впервые социалистические республики Франции и Советского Союза имеют общую границу! ~ ~ Это историческое связующее звено представляет собой монументальный сдвиг в балансе глобальной власти. Силы международного социализма больше не изолированы. Теперь мы должны решить, как формализовать эту новую реальность. Посланник из Москвы уже предлагает координировать наши планы на будущее."

 CoF_Foreign.2.d: "Товарищи! Мы получили историческое коммюнике от правительства Парижа. После нашей победы против немецких реакторов наши две великие нации наконец объединились общей границей. В свете этого [From.GetName] официально попросили присоединиться к нашей фракции и объединить наши усилия под знаменем Третьего интернационала. ~ Это предложение создало бы нерушимый социалистический блок, простирающийся от Атлантики к Тихому океану. Принятие их укрепило бы нашу революцию, но также привязало бы нашу судьбу к их. Центральный комитет должен немедленно обсудить это предложение."

 CoF_Foreign.3.d: "Наша просьба была принята! Советское правительство откликнулось на это подавляющим товарищем. [From.GetName] официально пригласило нас присоединиться к Третьему Международному Союзу, укрепив наш новый союз. -Нет, рабочие Парижа и Москвы наконец объединились! Этот великий союз социалистических государств станет оплотом против капитализма и национального популизма."

 CoF_Foreign.4.t: "Франция приглашает нас на четвертую Международную конференцию"
 CoF_Foreign.4.d: "Посланники из Парижа прибыли в Мадрид с историческим предложением, французское сообщество официально предложило нам занять наше место в четвертом Международном сообществе, они утверждают, что по мере того, как тени реакционных и империалистических держав растёт по всей Европе, выживание социалистического эксперимента полностью зависит от нашей взаимной обороны и промышленного сотрудничества, а также от того, чтобы присоединиться к нашим границам, но это также будет неразрывно связывать нашу судьбу с судьбой французов."
 CoF_Foreign.4.a: ""Интернационал" станет человеческой расой!"
 CoF_Foreign.4.b: "Испания должна наметить свой собственный курс на данный момент."

 CoF_Foreign.5.t: "Испанский отказ"
 CoF_Foreign.5.d: "Несмотря на наши общие идеологические узы, испанское правительство отклонило наше приглашение присоединиться к четвертой международной организации, похоже, они выступают за политику «социализма в одной стране» или, по крайней мере, хотят сохранить свою дипломатическую независимость, чтобы избежать преждевременного провоцирования капиталистических держав. Мы должны приступить к нашим планам революции без их прямой поддержки."
 CoF_Foreign.5.a: "Достойное сожаления отсутствие видения."

 CoF_Foreign.6.t: "Иберийская связь"
 CoF_Foreign.6.d: "Из Мадрида пришли слова: испанцы приняли наше предложение! С формализацией этого альянса Пиренеи уже являются не барьером, а мостом между революционными товарищами. Комбинированная промышленная и военная мощь Франции и Испании теперь является оплотом против реакции. Сегодня мечта о свободной Европе кажется ближе, чем когда-либо."
 CoF_Foreign.6.a: "Да здравствует мировая революция!"

