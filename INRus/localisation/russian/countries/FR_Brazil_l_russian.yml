#Brazil Events
bra.1.t: "Бразилия в 1936 году"
bra.1.d: "После Великой войны Бразилия смогла проявить себя на мировой сцене в качестве подспорья. С постоянно растущей экономикой, большим населением, полным ресурсов и полным потенциала, все, похоже, идет хорошо для Бразилии. Несмотря на то, что международные наблюдатели видят это. Но внутри Бразилии это чувство совершенно иное. Правящее правительство, которое широко воспринимается как олигархическое и бескорыстное в народе, на протяжении десятилетий продолжает следовать традициям каф-ком-литной политики, где правящая власть, которая широко рассматривается как олигархическая и бескорыстная в народе, продолжает жить на протяжении десятилетий."democratic" government has been controlled by the influential states of São Paulo and Minas Gerais, and their oligarchic coronel patrons, that have not cared for the deep social and economical disparities in our society.\n\nA marxist insurrection in 1931 didn't help either, and the violence of it has spread a sense of anti-red sentiment amongst some of the population, who in disapproval of the decadent republic and in hate of marxism has turned to alternative populist groups spreading a message against the government.\n\nLuckily for the government, the gambit of intervening in the Chaco War to the south, preventing the growth of Argentina's influence in our vicinities has given some legitimacy to the government, that has succesfully shown Brazil as strong. Nonetheless, their support is a fraction of our nation, and it seems the seams of our republic are showing, as political polarization mantains."
bra.1.a: "Мы должны пройти через это."
bra.2.t: "Мелкие забастовки повсюду"
bra.2.d: "Различные агрессии рабочих объявили забастовку в поисках дополнительных прав и законов в их пользу."
bra.2.a: "Нам это не нужно."
bra.3.t: "LEC воссоединит людей в митинге"
bra.3.d: "Основанная пару лет назад католиком Плинио Корреа, Католическая избирательная лига находится в центре внимания большинства из них, стремясь к установлению в бразильском обществе больше религиозной политики и традиций, она резко усилилась в ответ на довольно либеральные реформы, проведенные правительством после восстания 31 года, и обвинила правительство в том, что"decadent" and "unmoral".\n\nHowever, it's strong anti-marxist attitude and being contrarian to the disliked government has found Correa's movement a growing support base recently. Today in a rally for his cause thousands of people showed up in support for the LEC. We have to keep an eye out on this."
bra.3.a: "Я уверена, что это ерунда."
bra.3.b: "Постарайся порицать это событие."
bra.4.t: "Валькисмо на юге"
bra.4.d: "В Бразилии появилась очень недавняя, но быстро растущая группа, возглавляемая Густаво Додтом Баррозо, они импортировали в нашу страну немецкую идеологию валькизма, с националистическими, антисоциалистскими реторическими, популистскими идеями, лежащими в основе простых людей, и прогрессивными предложениями, предназначенными для молодежи, они нашли большую поддержку в наших южных регионах, где им очень понравились германские корни."
bra.4.a: "Остановите митинг."
bra.4.b: "Что плохого может случиться?"
bra.5.t: "Конфедерация трудящихся оказывает поддержку коллективистам"
bra.5.d: "При поддержке крупнейших синдикатов Бразилии, это может немного помочь Коллективистской партии. -Нет ничего хорошего для правящего правительства, безусловно, не выйдет из этого."
bra.5.a: "Мы ничего не можем сделать."
bra.5.b: "Наказание за это политическое движение."
bra.6.t: "Напряженность в правительстве"
bra.6.d: "Несмотря на то, что наши внутренние враги изобилуют, все еще есть место для раскола, поскольку представители PR проявляют недовольство тем, как наше правительство решает внутреннюю ситуацию, обвиняя нас в нынешнем потоке событий."
bra.6.a: "Это очень плохая идея."
bra.7.t: "Разделения внутри армии"
bra.7.d: "Будучи гордым долгое время и помогая нам отговорить диссидентов, бразильская армия очень полезна для нашей внутренней стабильности, однако, слухи о потенциальных диссидентах внутри самой армии, кажется, некоторым из наших генералов не понравится то, как мы справляемся с ситуацией, и нам нужно остерегаться. Было также слышно, что, хотя некоторые поддерживают законное правительство, они не доверяют нам, чтобы выбраться из этого. Нам нужно объединить нашу армию, чтобы пройти через это."
bra.7.a: "Правда."
bra.8.t: "Президентская речь"
bra.8.d: "В безопасно охраняемом событии, которое считается многими опасными, президент Саллес решил, что было бы хорошей идеей выступить с речью, призывающей к единству и поддержке внутри Бразилии."
bra.8.a: "Мы справимся."
bra.10.t: "Крушение Лондонского рынка на Бразилии"
bra.10.d: "Ужасные новости пришли для нашей экономики, так как эффект Лондонского фондового рынка, похоже, остановил наш экономический рост и ударил нас, когда нам это было не нужно."
bra.10.a: "Будем надеяться, что это не ухудшит ситуацию..."
bra.11.t: "Массовые удары начинаются"
bra.11.d: "Когда экспорт аннулируется и промышленность рухнула, начались массовые забастовки. Рабочие, радикализованные, взяли на себя вину за правительство и систему, которую мы построили для Бразилии. Похоже, воспоминания о восстании возвращаются на ум, давай надеяться, что еще одна попытка революции не произойдет."
bra.11.a: "Это плохо."
bra.12.t: "Движение правого крыла объединяется против правительства и марксизма."
bra.12.d: "Удивительно, что в Санта-Катарине, ЛИК и УФБ воссоединились, а также другие движения аналогичных вен, утверждая, что они должны быть сильными против угрозы коллективизма, в свете нынешних ударов, и осуждая республиканское правительство за нашу ситуацию, был создан маловероятной альянс. ~n-n-nTogetheer, они заявили, что сделают все, что потребуется, чтобы привести в Бразилию необходимый порядок, который республика не смогла дать, и что марксисты хотят полностью забрать."
bra.12.a: "Это беспокоит."
bra.20.t: "Западные государства реинтегрируются в нашу страну"
bra.20.d: "После гражданской войны наша нация становится крайне расколотой, даже после окончания боевых действий."
bra.20.a: "Мы приветствуем их."
