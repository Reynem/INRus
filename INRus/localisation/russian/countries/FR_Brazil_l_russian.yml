bra.25.a: "Мы приветствуем их."
bra.26.t: "Неожиданное предательство?"
bra.26.d: "Когда гражданская война нанесла нам ущерб, всем стало ясно, что способность нашего президента контролировать контроль была поставлена под сомнение не только очевидными предателями, но и моими собственными силами. В частности, армия была скрыта в своей верности. ~Нет, это наконец-то катапультировалось к действию, когда сегодня во второй половине дня появился генерал Эвклидес Фигейредо с ультиматумом, чтобы президент отошел, поскольку военные под его руководством взяли бы под непосредственный контроль республиканский государственный аппарат и возглавили бы Бразилию во время гражданской войны. Однако не все, казалось, поддерживали бы его."
bra.26.a: "Армия захватывает власть под руководством Фигейредо."
bra.26.b: "Избавься от этих предателей!"

bra.50.t: "Враждебная позиция штатов"
bra.50.d: "Десятилетия политической гегемонии Сан-Паулу и Минас-Жерайс заставили нас забыть истинную природу нашей республики, союза государств."other" states, and have so expressed their representatives in a message to our president.\n\nWhile no one can deny that this is the case, this has left president Salles in a rather awkward position. By giving the favour to the states, he'd help sustain the stability of our nation, something which is sorely needed. But it would make Sao Paulo and Minas Gerais upset, and their hold into our political system is such that doing so would make them disrupt our government. This is not a very easy decision."
bra.50.a: "Мы должны оставаться верными профсоюзу."
bra.50.b: "Республика работает по плану."
bra.51.t: "Бразильская держава"
bra.51.d: "Хотя сильное проявление влияния нашего правительства во время войны в Чако заставило многих поверить в то, что Бразилия сильна и способна, это было лишь шоу, в то время как наша нация была разделена и нестабильна. По мере того, как удары и политические движения радикализируются внутри наших границ, кажется, что мир медленно замечает наш реальный статус."
bra.51.a: "Мы могли бы быть намного больше."
bra.52.t: "Вопрос коронализма"
bra.52.d: "Коронелизм, огромное социальное и политическое влияние, оказываемое приземленными коронелами, стало большой проблемой, которая разделяет наше общество. Или, по крайней мере, это общепризнано. Сами коронели, а также их союзники на различных правительственных постах хотели бы заявить, что никаких проблем не существует, и наш союз остается сильным, как никогда. Неважно, что, по нашему мнению, должна быть принята официальная политика. Если коронелизм просто будет считаться естественной, полезной структурой власти, которая делает бразильское общество тем, чем оно является, или мы должны рассматривать его как нечто, из чего можно реформировать, в более репрезентативную модель?"
bra.52.a: "Коронелизм - это не проблема."
bra.52.b: "Коронелизм должен измениться."
bra.53.t: "Переговоры с городскими работниками"
bra.53.d: "Рост недовольства в городах, особенно среди городских рабочих, а также среди растущего среднего класса, достиг пикового уровня, и поэтому переговоры с ними, особенно с забастовками на подъеме, могли бы быть хорошей идеей. ~ n/, если, конечно, нам удастся найти выгодное предложение для обеих сторон."
bra.53.a: "Дай им то, что они хотят, пока."
bra.53.b: "Возможно, это не принесет нам пользы."
bra.54.t: "Трудящийся Дилемма"
bra.54.d: "Социальное неравенство присутствует в Бразилии с имперских дней, но слишком долго рабочие были неорганизованными и жестко контролируются высшими классами, теперь это другое. С организацией работников профсоюзов и синдикатов, ростом социалистических и популистских идеологий, и во всей довольно поляризованной политической сцене мы не можем выращивать Бразилию, притворяясь, что их больше нет. Или так было заявлено реформаторами. Однако правительство по-прежнему разделено на эту проблему, независимо от того, следует ли считать это вопросом первостепенной важности для нашей нации или нет."
bra.54.a: "Мы сделаем все, что в наших силах, для рабочих."
bra.54.b: "Это не наш приоритет."
bra.55.t: "Реформа Союза"
bra.55.d: "Идеал преобразования республики в эту мечту стал как никогда великим, так как наша страна разделена и разрушена войной, так что стало ясно, чья это вина. Эта олигархи, очевидно, отвергли эту олигархов, которые винят нынешний хаос предателей, которые не с готовностью последовали за своим правлением. Теперь, с реформализмом нашего правительства на пике среди нашего населения и нашего правительства, кажется, что коронелы будут камнем на нашем пути, с которым нужно будет разобраться. Ну, другой камень, учитывая то, что мы застряли на земле."
bra.55.a: "Мы воссоздадим этот союз."
bra.56.t: "Наша гордость предалась"
bra.56.d: "Коронелы, благородные и селые дворцы, которые привели нашу нацию к зависти многих, были преданы. Слабые реформисты, которые пытались сделать республику такой, какой она не является, и завистные государства, которые не понимали, что лучшим образом правили Бразилией, разделили нас, заставив нынешний хаос утопить нас. ~ nn no this объявлено правительством, что при полной поддержке Коронелов, осудило силы перемен, которые поразили республику. Однако это было крайне непопулярно простым людям, которые не сочувствуют ни одному из этих притязаний."
bra.56.a: "Мы должны вернуть старый порядок."
bra.57.t: "Разделение между правительством"
bra.57.d: "Поскольку гражданская война окружает нас, кажется, этот конфликт вызвал политическую напряженность в структуре нашего законного правительства, как и ожидалось. В то время как военные усилия стабильны, между теми, кто хочет реформировать республику, возник разрыв, виня старый порядок в нашем нынешнем хаосе, полагая, что только реформа Бразилии может быть сложена вместе. С другой стороны, некоторые менее популярные, но очень влиятельные группы проигнорировали идею о том, что именно те мечты о реформе, которые на первом месте ослабили нас и поставили на первое место нашу нынешнюю ситуацию."
bra.57.a: "Мы должны реформировать!"
bra.57.b: "Мы должны вернуться!"
bra.57.c: "Старомодный продолжает."
bra.58.t: "Неожиданное предательство?"
bra.58.d: "Поскольку гражданская война нанесла ущерб нам, и наше правительство по-прежнему не в состоянии объединиться даже в условиях нынешнего кризиса, всем стало ясно, что возможности нашего президента в плане контроля были поставлены под сомнение не только очевидными предателями, но и нашими собственными силами. В частности, армия имела свою собственную верность. ~nnn this, наконец, катапультируется к действию, когда сегодня во второй половине дня появился генерал Эвклидес Фигейредо с ультиматумом, чтобы президент отступил, поскольку военные под его руководством взяли бы под непосредственный контроль государственный аппарат республики и возглавили бы Бразилию во время этой гражданской войны. Однако не все, казалось, поддерживали бы его."
bra.58.a: "Нужен порядок."

#BCW
bcw.1337.t: "Напряженность достигает пика"
bcw.1337.d: "По мере того, как напряженность между политическими группами в нашей стране достигла своего зенита, правительство призвало военных подготовиться и быть готовыми, кажется, что открытое восстание неизбежно, и мы должны сделать все, что нужно, чтобы защитить Республику."
bcw.1337.a: "Мы будем готовы."
bcw.1.t: "Коллегии восстают"
bcw.1.d: "Сегодня, Луис Прест, глава Партии коллективистов, объявил революцию, поскольку работники Бразилии снова будут сражаться и попытаются достичь того, чего не могли многие годы назад, социалистический союз Бразилии поднялся. Мы надеялись, что этого не произойдет, но это только начало."
bcw.1.a: "Мы будем бороться за Республику."
bcw.1.b: "Мы будем бороться за Революцию."
bcw.2.d: "Ожидание закончилось сегодня, мы, рабочие, восстали против эгоистичного и коррумпированного олигархского бургуизия, который слишком долго правил Бразилией."
bcw.2.t: "Подъём Союза"
bcw.2.a: "Пара ос трабальхадоры!"
bcw.3.t: "Народное государство"
bcw.3.d: "Вместе с их ненавистью к социалистам и республике, правая коалиция поднялась на юг, провозгласив смерть республики, и реакционный и популистский"People's State", aiming to truly represent the Brazilian people, as they declare we have failed. Confrontation is imminent. Confrontation is inevitable."
bcw.3.a: "Мы будем защищать Республику."
bcw.3.b: "Мы будем стоять за Нацию."
bcw.4.t: "Возрождение Бразилии"
bcw.4.d: "Как и ожидалось, смерть Бразильской Республики была неминуемой. Теперь мы восстали, чтобы спасти нашу нацию от хаоса и непристойности, на которые она обрушилась. Республика подвела нас, и марксисты разделили нас. Только вместе, те, кто выступает за эту нацию, могут восстановить Бразилию в истинном, совершенном видении того, как она должна быть. nn noSo было объявлено, что она возглавляет коалицию, Плинио Корреа объявил, что мы начинаем новую эру для Бразилии, где мы будем решать ее судьбу."
bcw.4.a: "Вперед, в Бразилию!"
bcw.25.t: "Конец гражданской войны"
bcw.25.d: "Мир, как представляется, вернулся в нашу страну, как коллийские революционеры на западе, так и предатели на юге рухнули перед нашими силами."
bcw.25.a: "Ордем е прогрессо!"
bcw.26.t: "Конец гражданской войны"
bcw.26.d: "Мир, кажется, вернулся в нашу страну, так как наша революция удалась после краха реакционеров, как олигархов в столице, так и экстремистов на юге. В то время как борьба продолжается в карманах реакционеров, борющихся за нашу революцию, о них скоро позаботятся."
bcw.26.a: "Ос Трабальхадоры unidos nunca serano derrotados!"
bcw.27.t: "Конец гражданской войны"
bcw.27.d: "Мир, по всей видимости, вернулся в нашу страну, когда предатели на западе и деградировавшие олигархи на севере пали на нашу силу. В то время как борьба продолжается в карманах предателей, ведущих к хаосу вокруг нашей нации, они вскоре будут позаботятся о них."
bcw.27.a: "Фе-Насан, бразил!"


