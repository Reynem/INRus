#some descriptions
POLITICS_CARLOS_FREILE_LARREA_DESC: "После смерти своего предшественника, Нефтали Бонифаса, Карлос Фрейле Ларреа оказался в трудном положении, когда ему пришлось сбалансировать желания своей партии и интересы, ЮПН, с теми, которые были его главным источником поддержки, — Национальным соглашением трудящихся, — который постепенно превращает Эквадор в ультраконсервативное псевдосиндикальное государство, но не без противодействия традиционным группам власти."
POLITICS_JuanmaFruc_DESC: "Приведя Колорадо к власти, президент Фруктос должен деликатно знать, как сбалансировать верность своей партии, армии и расстроенных рабочих классов."
POLITICS_BASMUNN_DESC: "После того, как амбиции президента Терры поставили под сомнение силу демократии в Уругвае, Басилио Муньос быстро поднялся, чтобы бросить вызов своему правлению, и стал президентом после того, как Терра сместилась с должности."
POLITICS_SANTOS_DOMINICI_DESC: "Возглавляя реституцию демократии Венесуэлы после того, как экспедиция Дельгадо Чалбо-Кардоны свела рыбу, президент Доминичи создал выдающееся наследие."
POLITICS_ARMANDO_SALES_DESC: "Популярный среди элиты и одного из поднимающихся политиков в Сан-Паулу, Армандо Саллес де Оливейра стал президентом Бразильской Республики."
