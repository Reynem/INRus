#not actually for brazil
BOL_FUHRERREICH_DESC: "История не была благосклонна к Боливии. Когда ее соседи забрали те небольшие преимущества, которые она имела, Боливия практически постоянно была в упадке геополитически; опущена неоднократными неудачами, народ Боливии много пострадал и сделал все возможное для продвижения вперед; шанс появился во время войны в Чако, когда они почти победили Парагвай в жестокой войне; однако этот шанс искупления был унесен аргентинским вмешательством, и теперь боливийский народ больше не может это терпеть. Республика Боливия должна умереть, чтобы боливийский народ мог восстать."
COL_FUHRERREICH_DESC: "Политическая нестабильность изменила политический порядок в Колумбии в начале тридцатилетия, а неудача в Перуо-колумбийской войне изменила социальный порядок."democratic" order, and the domination of the old parties, has collapsed. Leading a union of populist and nationalistic movements, the charismatic leader Gaitán has risen and listened to the whims of the Colombian people. While a lot of instability remains after the recent takeover, now as the clouds in Colombian society seem to clear, the Colombian people will set their sights on their target, revenge."
PRU_FUHRERREICH_DESC: "После военной победы над Колумбией, Перу, похоже, имеет все, что есть, что помогает, растет экономика, отчасти благодаря тесным связям с Великобританией, обширную, обширную и богатую землю, которая дает им необходимые ресурсы, место престижа южноамериканского порядка, однако социальное неравенство и политические раны по-прежнему являются глубокими, и в то время как перуанский народ призывает к проведению более широких реформ во всех аспектах, перуанская Республика может оказаться в состоянии сражаться как с внешними, так и с внутренними врагами."

