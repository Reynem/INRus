occupation.40.t: "Судьба Парагвая"
occupation.40.d: "Поскольку мы пришли к власти над их национальным ядром, мы не можем не заметить огромных издержек нашей оккупации. Таким образом, Судьба Парагвая еще не решена, но логичный выбор - воссоздать их государство, возложив на него дружественное правительство."
occupation.40.a: "Поставь под контроль дружелюбное правительство."
occupation.40.b: "Прямое правило - это лучший выбор."
