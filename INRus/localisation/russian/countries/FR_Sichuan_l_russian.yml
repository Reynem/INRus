 SCH_zhang_lan: "Чжан Лан"

 SCH_lu_chao: "Лю Чао"
 #SCH_lu_chao_leader_desc: "В 1910 году он, как и многие другие люди из его провинции, поступил в Баодингскую академию, которую он покинул, когда в 1911 году началась Синьхайская революция, и затем отправился в Шанхай, где он по-прежнему работал со своими союзниками, Ван Цзиньвей, и Ли Шизенг (провинциальные сообщники д-ра Сун), до тех пор, пока он не был вынужден бежать в Сычуань в изгнании после того, как Юан Шикай захватил власть. В 1915 году, в 1915 году, Национальная война за защиту, чтобы убежать от своего режима в Пекине, он поехал в Шанхае, где он по-прежнему работал со своими союзниками Сычуанье Синь Киву, когда он был вынужден бежать в Сичуань, после того, как Юань Шинь Цзиньмин и Федералистское движение пытались выгнать Сун Ятсена из Гуандона, Лю присоединился к его миссии в Пекине."

 SCH_xiong_kewu: "Сён Кеву"
 #SCH_xiong_kewu_leader_desc: "Он родился в семье врачей, с тех пор как Сюн Кеву любил учиться. Он заинтриговался идеями демократии и модернизма, представленными Западом, и жалел, что Китай серьезно упал позади остальной части мира. В 1903 году он посетил Восточную Литературную школу Сычуана и позднее познакомился с революционерами, такими, как Дай Чжито. После спонсорства его дяди, Сун не поехал учиться в Японию, где он познакомился с домом Ят-сенга, и потом вернулся в хижину Сон Тонгхуи. После Синьхайской революции Сён стал командиром военного правительства Дахан Сичуань до 1913 года. Юань Шиай и правительство Бейянга изгнали силы Сунь из Китая, и Сёнг был вынужден бежать в Японию, где он не поехал на хитрость и не стал хитрым китайцем. Однако поражение не помешало Сянгу от мечты о свободном Китае. В Японии и Юго-Восточной Азии он собрал средства для революции и возвратил Китай в Победную Национальную защиту. Вой Вой Вой Защиты Несмотря на то, что Сонг был созданный Союз был созданный Вой Вой Вой Вой Вой Вой Вой Вой Вой Вой Вой Вой Вой Вой Вой Дегане Неге не был Сы Не Без Без Без Без Без Без Без Без Не Без Без Не Без Не Без Не Без Не Без Не Без Не Без Не Без Не Без Не Без Не Без Не Не Не Не Не Не Не Не Не Не Не С С С С С С С С С С Не Не Не Не С С Не С Не С Не С Не С Не С Не С Не С Не С Не С С Не С Не С С Не С Не С Не С С С Не С С С С Не С С С С С С С С С С С С С С С С С С С С С С С С С С С С С С С С С С С С С С С С С С С С С С С С С С С С С С С С С С С С С С С С С С С С С С С С С С С С С С С С С С С С С С С С С"

 SCH_liu_bocheng: "Лю Боченг"

 SCH_deng_xihou: "Дэн Сихоу"
 #SCH_deng_xihou_leader_desc: "Дэн поступил в армию в 1906 году и поступил в Баодингскую академию, хотя позднее он прекратил обучение, чтобы вернуться в Сычуань, когда произошла Синьхайская революция. Дэн продолжал расти в ряды своих рядов в течение многих лет, пока он не был повышен до генерала в 1923 году. Будучи более активным за столом, чем на различных полях боя в Китае, он получил репутацию заслуживающего доверия и компетентного карьериста, хотя ему едва ли удалось заслужить много славы и удачи в этом процессе. Хотя его уважали среди его коллег из Департамента по делам детей, он в конечном итоге был подчинен Яну Сену в качестве Зили Клике, который в конечном итоге оказался в подчинении департамента по вооружениям над Баодингом. nnDespin, хотя он и не пользовался поддержкой Зили, департаменту Баодинга удалось сотрудничать с Департаментом по вопросам вооружений, ставя перед собой задачу по обеспечению большей политической дальности его китайского народа, в том, что он был в состоянии заполнить вакуум в Сичуане в результате возможного краха Ян Сена в гражданской войне 1936 года."
 #SCH_deng_xihou_commander_desc: "После вступления в армию в 1906 году Дэн был принят в Сычуаньскую военную академию. После окончания в 1909 году он поступил в Баодингскую академию. После Синьхайской революции Денг прекратил обучение и вернулся в Сычуань, чтобы продолжить там свою военную службу. После создания Китайской Республики Дэн вступил в Четвёртую дивизию Сычуань под руководством Лю Чуньоу. Дэн последовательно занимал пост адъютанта и стал через ряды, чтобы стать командиром батальона к 1916 году, командиром пятой бригады в 1917 году и командиром независимой бригады к февралю 1918 года. С 1920 по 1923 год Дэн участвовал в различных битвах в Юньнане, Гуйшу и Сычуанье и провёл достаточно хорошо, чтобы стать командиром Третьей дивизии. В декабре того же года Пекинское правительство, созданное Цили Кликой, повысило его до звания генерала. Он будет поддерживать этот звание после того, как он был подчинен Суннану, не имел ни одного прошлого опыта, ни одного из его дранцев, ни одного из которого он сравнился с профессионала."

 SCH_liu_wenhui: "Лю Вэньхуй"
 #SCH_liu_wenhui_leader_desc: "В 1911 году он закончил Сычуаньскую военную академию, в 1914 году поступил в Баодинг-департамент, а в 1916 году вышел из него. Хотя Лю Вэньхуй и обязан своим успехом и влиянием в результате непотизма и удобных связей, он тем не менее смог стать уважаемым и влиятельным человеком в клике. После окончания Северного экспедиции Вэньхуй полностью присоединился к Дэн Сю и стал одним из самых известных членов клики. Несмотря на поражение его племянника Лю Сяна в Сычуанской гражданской войне, баодингский департамент вознесся к власти. Его дружба с Дэн Сиху завоевала ему должность лидера с тем, что стало диархией страны, где он - в явном противоречии со своим племянником - представляет более реформистскую ветвь внутри армии и более урбанистского административного класса, он позволил департаменту расширить свою поддержку далеко за пределами консервативных слоев населения, что он заработал роль лидера с тем, что он запоследовал диарх своей страны, по-дисту, который он по-дил в дьях своей провинции."
 #SCH_liu_wenhui_commander_desc: "§L\nLiu Wenhui был в армии всю свою жизнь благодаря тому, что его брат поступил в Академию Сычуаньской армии в 1911 году, в том смысле, что большинство его последующих достижений в жизни были либо результатом непотизма через его брата Лю Вэньцай или его племянника Лю Сянга, либо результатом его связей с кликой в случае его связей с Баодингской военной академией, где он учился в 1914 году. Хотя он, несомненно, был преданным и преданным военным, с тех пор как он закончил Баодингскую военную академию в 1916 году, его рекорд оставляет желать лучшего."

 SCH_wang_zuanxu: "Ван Цзуаньсу"
 SCH_tian_songyao: "Тянь Сонгяо"

 SCH_yang_sen: "Янг Сен"
 #SCH_yang_sen_leader_desc: "После выхода в армию в 1904 году, Ян Сен впервые познакомился с политикой, когда вступил в Общество Тонгменхуи во время пребывания в Зале Сычуаньского образования в 1906 году. После окончания в 1908 году он начал служить в армии Цин до 1911 года. Его прошлое и связи позволили ему занять видное место, когда произошла Синьхайская революция. В 1921 году он был в конечном итоге повышен до ранга генерала Ценка и был размещен в Чонгкире. Эта модель роста в рядах его силовых сил, в то время как он направлял больше, чем военные достижения, стала союзником Ву Пэфу в 1925 году. Когда Зили стала доминирующей кликой в полностью восстановленной империи Цин, Янг Сен был повышен до уровня губернатора Сычуана, а его правая позиция была бы достаточно хвастливой, и он имел бы право на то, что он имел бы в виду, что он был бы достаточно компетентным лидером Сычуана."
 #SCH_yang_sen_commander_desc: "В течение этого периода Ян служил под командованием генерала Цай Е, который также повысил его статус генерала Сычуаньского генерала в 1921 году. После того, как Янг Сен был направлен командовать силами Чонгкина и Чжили Клик, он вступал в вражду с другими вождями провинции, в первую очередь с Сён Кеву и Лю Сян. Несмотря на свои попытки подорвать свою оппозицию, он никогда не был полностью успешным. Несмотря на то, что его позиция военного губернатора Сычуана была гораздо более эффективной, чем его связи с Вуфуингом и Жилийской кликой, который, по словам одного из военных, выполнял свои обязанности в тяжёлой военной области."

 SCH_liu_cunhou: "Лю Куньоу"
 #SCH_liu_cunhou_leader_desc: "В 1903 году он посещал военную академию Сычуана, чтобы учиться в Японии, в 1907 году, и вернулся в Сычуань после освобождения в 1908 году. Он сделал себе имя во время Синьхайской революции, где он первоначально вел более мелкие антибандитские силы и продолжал возглавлять более крупные силы, так как его преданность завоевала ему доверие своего начальства. В ходе конфликтов, в которых он участвовал, его силы часто были больше озабочены вымогательством богатства у местных жителей, чем функционированием в качестве надлежащей военной силы. Хотя его солдаты часто вели себя как бандиты, он умудрился удержать себя в положении относительной силы в Сычуане, хотя его верность завоевала доверие своего начальства, и он едва ли довёл себя до того, что его дилеры из-задиргомов, объединившихся с людьми. Он сравнил свои силы с сычуанской гражданской войной, Лю Куньху, хотя его силы были достаточно, чтобы использовать тех, что были созданы во время конфликта."
 #SCH_liu_cunhou_commander_desc: ""§YGeneral Description\n§YBorn:§L\n1884\nSichuan, Qing Empire\n§YMilitary Career:§L\nLiu Cunhou was enrolled into the Sichuanese Military Academy in 1903. He went on to study at the Japanese Imperial Army Academy in 1907 and had graduated by 1908, after which he returned to China. His military career began in proper during the Xinhai Revolution when he was first promoted to Lieutenant-General by the Beiyang commanders. He went on to lead a series of anti-bandit raids and would earn the trust of his superiors, enough so that he'd eventually go on to lead provisional armies. It is, however, speculated that this had less to do with his abilities as a commander and was rather a question of him seeming loyal in a time of conflict and chaos.\n\nWhile he was able to successfully pacify bandits and earn the trust of his superiors, he earned nothing but disdain from the locals as his armies would behave no better than the bandits they were supposed to fight. Wherever his forces went, they would effectively run a protection racket against the locals. Greedy and less concern with discipline than military doctrine, he's held in poor regard by most of his peers and was seen as a man largely devoid of military acumen through most of his career. Be that as it may, he was still the epitome of a ruthless warlord and managed to amass wealth and a powerbase to be reckoned with.\n\nHe was eventually subordinated to Yang Sen and tasked with maintaining order in the north of the country. His previous loyalty to the Zhili has earned him a high position within the Armament Department despite his spotty military record."

 SCH_fan_shaozeng: "Фанат Шаозенг"
 SCH_wang_lingji: "Ван Линджи"
 SCH_he_guoguang: "Гугуан"

 SCH_zhou_daogang: "Чжоу Даоган"

 SCH_liu_xiang: "Лю Сян"
 #SCH_liu_xiang_leader_desc: "В 1920 году Лю Сян, когда он помог войскам Сычуана одержать победу над Юннаном, встал в ряды рядов и в конечном итоге возглавит большой контингент сычуанских сил против Куоминтанга во время северной экспедиции. В ходе этого конфликта он смог завоевать репутацию опытного, хотя и безрассудного командира, получившего множество побед над его именем. После того как Северная экспедиция была побеждена, он вернулся в Сычуань и был назначен Чонгцингом в качестве главы городского гарнизона. Несмотря на то, что его выступление во время этого конфликта позволило ему создать свою собственную клику и остаться силой, которой можно было бы считаться в Сычуане, он никогда не был наделен губернатором провинции, которую, по его мнению, он заслуживает. Вместо этого, он был подчинен Яну Сену, своему преданному индейскому агенту Ву Пейфу и Дзили. Лю Сян видел это как оскорбление и мелкий кролик. В результате он начал испытывать глубокое возмущение по отношению как к Цилиюану, так и к их племеням, который, в конечном итоге, был вынужден заниматься динаментом."
 #SCH_liu_xiang_commander_desc: "После окончания Сычуанского военного колледжа в 1909 году Лю Сянг поднялся в ряды армии до тех пор, пока не стал начальником армии Сычуана в 1919 году. Когда в 1920 году началась война между Сычуаном и Юньнаном, он завоевал свои первые военные успехи, оттолкнув против них военачальников. Когда война закончилась в 1921 году, он был назначен лидером гарнизона Чонгкин. В это время он стал силой, которую можно было бы считать и укрепить в промышленном сердечнике Сычуана."

 SCH_pan_wenhua: "Пан Вэньхуа"

 SCH_tang_shizun: "Тан Шизун"

 SCH_guo_xunqi: "Гу Сюньки"
 #SCH_SCH_guo_xunqi_commander_desc: "По слухам, у него есть симпатии левых, включая контакт с такими фигурами, как Лю Боченг, что вызвало трения между ним и Лю Сяном."

