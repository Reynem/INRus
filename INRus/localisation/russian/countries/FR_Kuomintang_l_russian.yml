 KMT_bastion_of_kuo: "Бастион Куоминтанга"
 KMT_bastion_of_kuo_desc: "В то время как большинство Китая попало в мелкое военное командование, мы стоим на юго-востоке со спинами к морю как последний бастион революции Сан-Ят-сена."
