 ### Events ###
 kmt.1.t: "Портовый город Макао"
 kmt.1.d: "С 1500-х годов город Макао находится под империалистическим контролем. Теперь, когда Португалия находится на грани экономической катастрофы, у нас есть уникальный шанс захватить город и все, что в нем находится. Однако это может вызвать гнев у западных держав, которые все еще имеют власть в азии через торговлю и военно-морское господство."
 kmt.1.a: "Схватить порт и избавиться от имперской угрозы!"
 kmt.1.b: "Лучше не связываться с западными державами..."
 kmt.2.t: "Куоминтанг захватил Макао!"
 kmt.2.d: "Наш торговый порт Макао был захвачен Куоминтангом в момент нашей слабости, хотя мы сами ничего не можем с этим поделать, поскольку наша сила и без того растягивается, Великобритания может помочь нам еще раз укротить Дракона."
 kmt.2.a: "Нам нужна помощь Британии."
 kmt.3.t: "Португалия просит о нашей помощи"
 kmt.3.d: "Сегодня утром министерство иностранных дел Великобритании получило письмо от португальцев с просьбой о помощи в захвате их портового города: Макао. Мы можем позволить Португалии решить свои собственные проблемы или угрожать китайцам блокадой. Это, несомненно, подорвет их промышленность."
 kmt.3.a: "Мы будем требовать, чтобы китайцы вернули свои незаконные земли или были введены эмбарго."
 kmt.3.b: "Мы не хотим участвовать в этом!"
 kmt.4.t: "Британия угрожает эмбарго на нас!"
 kmt.4.d: "Британцы под влиянием португальского народа, несомненно, потребовали вернуть нашу законную землю империалистам или столкнуться с блокадой."
 kmt.4.a: "Макао - китаец и останется там!"
 kmt.4.b: "Это может плохо закончиться..."
 kmt.5.t: "Британия отказалась нам помочь!"
 kmt.5.d: "Британцы"after much consideration" decided it would not be "in their best interest" to help us in this situation."
 kmt.5.a: "Черт побери!"
 kmt.6.t: "Макао снова наш!"
 kmt.6.d: "Под британским давлением Куоминтанг невольно уступил нам город Макао!"
 kmt.6.a: "В Синьо Винсе!"
 kmt.7.t: "Гонконг был захвачен Куоминтангом!"
 kmt.7.d: "Внутри нашей великой империи слабый зонд, Куоминтанг захватил Гонконг!"
 kmt.7.a: "Мы ничего не можем сделать."
 kmt.7.t: "Куоминтанг захватил Гуанчжуван!"
 kmt.8.d: "Рано сегодня утром сообщалось, что на нашу территорию в южной части Китая, Гуанчжуван, штурмовали китайские солдаты, сражающиеся за Куоминтанг, хотя этот порт находится в нашем распоряжении лишь несколько десятилетий, это лишь оскорбление нашей и без того ослабленной нации."
 kmt.8.a: "Мы ничего не можем сделать."
 kmt.peace.1.t: "Нам не удалось раздавить Национальную армию религиозно-восстановительных действий."
 kmt.peace.1.d: ""
 kmt.peace.1.a: "Мы должны признать нашу неудачу."
 kmt.peace.1.b: "Мы будем бороться до конца!"
