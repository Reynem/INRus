 KMT_the_absolute_state_of_china: "Абсолютное государство Китай"
 KMT_the_absolute_state_of_china_desc: "В эти отчаянные времена змей и лжецов Чианг Кай-Шек, суверенный и наследник политического наследия Сунь Ят-Сена, счел уместным ввести временное ограничение на такие неприязни, как свобода слова, права на демонстрации и выборы."
