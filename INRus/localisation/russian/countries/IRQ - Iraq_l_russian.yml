 ### Foci ###
 iraq_focus: "Иракское дерево фокуса"

 IRQ_Conscription_Law: "Провозглашайте закон о призыве"
 IRQ_Conscription_Law_desc: "Первые шаги по стабилизации Ирака требуют обеспечения постоянного источника рабочей силы для наших армий и полиции, они будут служить гарантами независимости для Ирака в нашу эпоху."
 IRQ_Al_Ahali_Surpression: "Огнестрельное наказание аль-Ахали"
 IRQ_Al_Ahali_Surpression_desc: "Бедность, разделение и отсталость вызовут недовольство, которое, в свою очередь, породит революцию."
 IRQ_Islamic_Morality_Campaign: "Исламская кампания за мораль"
 IRQ_Islamic_Morality_Campaign_desc: "Обеспечение того, чтобы население следовало исламской этике, обеспечит благополучие, сплоченность и прогресс."
 IRQ_Resadiye_Reorganisation: "Реорганизовать Рюшдийе"
 IRQ_Resadiye_Reorganisation_desc: "Во время правления султана Абдюльмесида I в 1845 году был разработан указ, предусматривающий создание новой системы образования в западном стиле, в результате чего была создана трехуровневая система образования с Рюшдийе, или средними школами, в качестве среднего уровня."
 IRQ_Al_Muthanna_Paramillitaries: "Военнослужащие &lt; &lt; Аль-Мутанна &gt; &gt;"
 IRQ_Al_Muthanna_Paramillitaries_desc: "С частью их молодых членов филиала и их военными связями, клуб Аль-Мутанны более чем готов бороться за Ирак, нам просто нужно официально утвердить его."
 IRQ_Restructure_Department_National_Education: "Реформирование Департамента национального образования"
 IRQ_Restructure_Department_National_Education_desc: "Мы можем дешево и легко адаптировать остатки османских учебных заведений к работе на Ирак в новом департаменте национального образования."
 IRQ_Impose_Al_Muthanna_Curriculum: "Разработка учебной программы &lt; &lt; Аль-Мутанна &gt; &gt;"
 IRQ_Impose_Al_Muthanna_Curriculum_desc: "Нади аль-Мутанна, или Клуб Мутанны, является политической группировкой в Багдаде, которая имеет невероятное политическое влияние в столице."
 IRQ_Society_for_Eradicating_Illiteracy: "Общество по ликвидации неграмотности"
 IRQ_Society_for_Eradicating_Illiteracy_desc: "Этот институт, возглавляемый &lt; &lt; Аль-Ахали груп &gt; &gt; , продемократическим клубом в Багдаде с западным влиянием, будет способствовать распространению грамотности среди крестьян децентрализованным образом."
 IRQ_Baghdadi_Technical_University: "Открыть Багдадский технический институт"
 IRQ_Baghdadi_Technical_University_desc: "Со всей столицей, которую мы собрали, пришло время найти новый центральный институт, который будет иметь первостепенное значение для руководства и приоритезации наших исследовательских усилий."
 IRQ_Reform_Electoral_System: "Реформа избирательной системы"
 IRQ_Reform_Electoral_System_desc: "В то время как избирательная система Османской империи служила ей долгое время, настало время для нового подхода, реформы и адаптации к идиосинкратиям Ирака."
 IRQ_Enact_Iraqi_Labour_Law: "Принять Закон о труде в Ираке"
 IRQ_Enact_Iraqi_Labour_Law_desc: "Нет сомнений в том, что сменявшие друг друга правительства в Ираке были коррумпированными и что многие члены этих правительств были больше заинтересованы в обогащении себя и своих друзей, чем в заботе о интересах иракского населения в целом."
 IRQ_Modern_Family_Laws: "Современные семейные законы"
 IRQ_Modern_Family_Laws_desc: "Крайне важно обеспечить, чтобы структура семьи была юридически кодифицирована для того, чтобы все семьи имели гарантированные права в новой стране Ирак."
 IRQ_Enact_Sliding_Scale_Taxation: "Налогообложение по скользящей шкале"
 IRQ_Enact_Sliding_Scale_Taxation_desc: "Подавляющее большинство иракцев бедны, за исключением крупных землевладельцев и тех, кто пользуется поддержкой старого режима."
 IRQ_Program_Redistribution_Miri_Land: "Перераспределение земли &lt; &lt; Мири &gt; &gt;"
 IRQ_Program_Redistribution_Miri_Land_desc: "Мири - это вид собственности на землю, который мы унаследовали от старой Османской империи, что соответствует сельскохозяйственным землям, арендованным у правительства для использования крестьянами."
 IRQ_Model_Villages_Program: "Проект создания образцовых деревень"
 IRQ_Model_Villages_Program_desc: "В рамках нашей программы повышения уровня жизни населения начнется осушение болот и создание защитных сооружений для деревень от вредного воздействия болот на болота с использованием прототипов образцовых деревень, которые опробуют наши возможные решения."
 IRQ_Parks_And_Hospitals_Program: "Проект &quot; Парки и больницы &quot;"
 IRQ_Parks_And_Hospitals_Program_desc: "Общественное здравоохранение предполагает широкое участие городских планировщиков. &lt; &lt; Обустройство парков &gt; &gt; в наших городах и городах обеспечит людям здоровое пространство для общения, в то время как распространение больниц на нашей территории обеспечит благополучие для всех."
 IRQ_Tribal_Civil_and_Criminal_Disputes_Regulation: "Регулирование гражданских и уголовных споров, связанных с племенами"
 IRQ_Tribal_Civil_and_Criminal_Disputes_Regulation_desc: "Для ограничения влияния местных шейхов эти обычаи должны быть кодифицированы и институционализированы."
 IRQ_Increase_Shiite_Parliamentary_Representation: "Увеличить представительство шиитов"
 IRQ_Increase_Shiite_Parliamentary_Representation_desc: "Меньшинство шиитов в Ираке слишком долго находилось в центре преследований и угнетения, и если мы хотим создать государство для всех иракцев, мы должны обеспечить им справедливое представительство в институтах."
 IRQ_Fight_Sectarian_Propaganda: "Борьба с отраслевой пропагандой"
 IRQ_Fight_Sectarian_Propaganda_desc: "Шии, сунниты, язиди, христиане, арабы, туркмены, курды, ассирий, помимо религиозных и этнических разногласий, которые характеризуют Ирак, мы все должны быть просто иракцами."
 IRQ_Cooperate_with_TPC: "Сотрудничество с ТПК"
 IRQ_Cooperate_with_TPC_desc: "Турецкая нефтяная компания, контролируемая Великобританией, имеет льготные права в провинции Мосул со времен старой Империи, и они являются могущественным субъектом в регионе, что означает, что мы должны найти механизмы, которые были бы полезны для них и для нас как для нового независимого государства."
 IRQ_Amend_Custom_Tariff_Law: "Внести поправки в Закон о таможенных тарифах"
 IRQ_Amend_Custom_Tariff_Law_desc: "Установление тарифов на импорт и экспорт позволит нам контролировать приток товаров в иракскую экономику, с тем чтобы защитить местных производителей и контролировать экспорт наиболее необходимых местных товаров."
 IRQ_Military_Mass_Production: "Военно-массовое производство"
 IRQ_Military_Mass_Production_desc: "По мере того, как современная армия уходит на власть своей национальной промышленности, пришло время увеличить наше военное производство, чтобы быть в состоянии поддерживать любые возможные войны."
 IRQ_Lower_Mesopotamian_Oil_Extraction: "Нижняя мезопотамская добыча нефти"
 IRQ_Lower_Mesopotamian_Oil_Extraction_desc: "Британский ТПК давно знает о существовании крупных нефтяных месторождений на юге Ирака, поэтому мы должны немедленно взять под свой контроль эти месторождения черного золота."
 IRQ_Law_Governing_Rights_and_Duties_of_Cultivators: "Закон, регулирующий права и обязанности воспитателей"
 IRQ_Law_Governing_Rights_and_Duties_of_Cultivators_desc: "Большинство земледельцев жили в ужасающих экстремальных условиях нищеты, поистине «живом патологическом образе» земли с очень низкой продолжительностью жизни, что в то же время вызывает крайне плохое и нестабильное сельскохозяйственное производство."
 IRQ_Expand_Basra_Authority: "Расширить портовое управление Басры"
 IRQ_Expand_Basra_Authority_desc: "Расширяя Портовое управление Басры, является одним из крупнейших работодателей в стране, мы будем следить за тем, чтобы производство наших судов не превышало по крайней мере минимальных стандартов для наших военно-морских сил."
 IRQ_Expand_Iraqi_State_Railways: "Расширить иракские государственные железные дороги"
 IRQ_Expand_Iraqi_State_Railways_desc: "Совершенствование нашей внутренней инфраструктуры приведет к увеличению потоков войск и товаров по всей стране, и это было бы легко сделать, если бы иракские государственные железные дороги получили более значительные финансовые средства."
 IRQ_Land_Reclamation_Program: "Проект восстановления мезопотамских земель"
 IRQ_Land_Reclamation_Program_desc: "В рамках программы по санитации и осушению болот, в которых проживает большинство жителей южной части Ирака, мы можем теперь расширить эту плодородную недавно открытую землю для использования в сельском хозяйстве."
 IRQ_Nationalise_Oil_Sector: "Национализация нефтяного сектора"
 IRQ_Nationalise_Oil_Sector_desc: "Пришло время положить конец иностранным концессиям Османской империи, которые были согласованы с британской турецкой нефтяной компанией."
 IRQ_Iraqi_National_Bank: "Иракский национальный банк развития"
 IRQ_Iraqi_National_Bank_desc: "Наличие капитала для целей развития является одной из первых потребностей экономики в развитии, и создание национального учреждения для этого обеспечит правильное распределение этого капитала."
 IRQ_Central_Directory_Basic_Utilities: "Центральный справочник по основным коммунальным услугам"
 IRQ_Central_Directory_Basic_Utilities_desc: "И в рамках программы развития мы будем обеспечивать каждому иракцу доступ к пригодной для использования воде и санитарии."
 IRQ_Agricultural_Bank_of_Iraq: "Сельскохозяйственный банк Ирака"
 IRQ_Agricultural_Bank_of_Iraq_desc: "Существует внутренний рынок для многих важнейших продуктов, которые могут быть получены местными поставщиками в Ираке."
 IRQ_Industrial_Bank_of_Iraq: "Промышленный банк Ирака"
 IRQ_Industrial_Bank_of_Iraq_desc: "Существует внутренний рынок для многих важнейших продуктов, которые могут быть получены местными поставщиками в Ираке."
 IRQ_Increase_Local_Production: "Поощрение местного производства"
 IRQ_Increase_Local_Production_desc: "Чтобы завершить программу по оздоровлению сельских районов, важно, чтобы те, кто там живет, могли зарабатывать на жизнь тем, что они производят на местах, и с этой целью мы можем выделить часть наших бюджетных субсидий."
 IRQ_Expand_Farm_to_City_Connections: "Расширение связей между сельскими хозяйствами и городами"
 IRQ_Expand_Farm_to_City_Connections_desc: "Используя часть нашего предварительного банка для внутренних инвестиций, необходимо построить ряд железнодорожных и автомобильных дорог между сельскими районами и городами для создания логистической сети, которая могла бы поддерживать доставку сельскохозяйственной продукции в города, а также инструментов и других предметов первой необходимости для ферм."
 IRQ_Reorganise_Ottoman_Sixth_Army: "Реорганизовать Шестую Оттоманскую армию"
 IRQ_Reorganise_Ottoman_Sixth_Army_desc: "Старые батальоны, оборудование и объекты старой Империи могут быть реквизированы и перенаправлены для обслуживания Ирака."
 IRQ_Reopen_Mosul_Military_Academy: "Возобновить военную академию Мосула"
 IRQ_Reopen_Mosul_Military_Academy_desc: "В рамках местных объектов, созданных для Орду Альтынчи, была оставлена военная академия, которую можно легко использовать для наших собственных целей."
 IRQ_Study_Levantine_War: "Изучение левантийской войны"
 IRQ_Study_Levantine_War_desc: "Эта война велась кровью и железом, ценой многих жизней и ресурсов."
 IRQ_Iraqi_Mechanised_Corps: "Расширение иракского механизированного корпуса"
 IRQ_Iraqi_Mechanised_Corps_desc: "Инструменты современной сухопутной войны, танки и другие мобильные и бронированные силы являются первой необходимостью предотвращения ненужных смертей и создания тактических преимуществ перед любым врагом."
 IRQ_Refurbish_Baghdad_Munition_Factory: "Восстановить багдадскую фабрику по производству боеприпасов"
 IRQ_Refurbish_Baghdad_Munition_Factory_desc: "Заброшенный имперский завод по производству боеприпасов в Багдаде нуждается лишь в нескольких ремонтных работах, чтобы снова работать."
 IRQ_Expand_Military_Industrial_Complex: "Расширение военного промышленного комплекса"
 IRQ_Expand_Military_Industrial_Complex_desc: "Со всей нашей столицей мы расширим фабрики, которые нам уже надо предоставить для нашей армии средства ведения войны."
 IRQ_Armoured_Car_Program: "Проект по строительству бронированных автомобилей"
 IRQ_Armoured_Car_Program_desc: "Бронированные машины являются быстродействующими, а легкие бронированные машины чрезвычайно полезны для ведения боевых действий в пустыне."
 IRQ_National_Board_of_Supplies: "Национальный совет по снабжению"
 IRQ_National_Board_of_Supplies_desc: "Учитывая, по сути дела, отсутствие инфраструктуры или автотранспортных средств для снабжения наших вооруженных сил, для поддержания наших войск на фронте потребуется высокая степень координации между различными элементами производственно-сбытовой цепи."
 IRQ_Import_Military_Hardware: "Импортировать военное оборудование"
 IRQ_Import_Military_Hardware_desc: "В настоящее время состояние нашей военной производственной отрасли не очень хорошее, но для того, чтобы свести концы с концами, мы можем выделить довольно небольшую сумму капитала для оснащения наших вооруженных сил старым оборудованием, чтобы сделать их полезными сейчас."
 IRQ_Found_the_IQAF: "Нашел IQAF"
 IRQ_Found_the_IQAF_desc: "Что может предотвратить бомбардировку наших деревень, городов и армий противником?"
 IRQ_Purchase_Foreign_Aircraft: "Закупка иностранных воздушных судов"
 IRQ_Purchase_Foreign_Aircraft_desc: "В то время как мы запустим местную авиацию, было бы разумно предоставить нашим пилотам несколько старых самолетов для подготовки и потенциальных стартовых миссий."
 IRQ_Ottoman_Air_Doctrine: "Изучение османской доктрины воздушного пространства"
 IRQ_Ottoman_Air_Doctrine_desc: "В Оттоманской авиационной доктрине основное внимание уделяется уничтожению вражеских сил и материально-техническому обеспечению сверху до разрушения групп и линий снабжения."
 IRQ_Communard_Air_Doctrine: "Доктрина воздушных исследований"
 IRQ_Communard_Air_Doctrine_desc: "Доктрина коммунардных воздушных перевозок сосредоточена на воздушном превосходстве, с тем чтобы воспрепятствовать вражеским военно-воздушным силам наносить ущерб ключевой инфраструктуре и сухопутным силам."

 IRQ_Home_of_Civilisation: "Дом цивилизации"
 IRQ_Home_of_Civilisation_desc: "Старинное мезопотамское королевство образовало одну из первых цивилизаций истории, и оно все еще является королем нашей страны."
 IRQ_Greater_Iraqi_Nationalism: "Более высокий уровень иракского национализма"
 IRQ_Greater_Iraqi_Nationalism_desc: "Месопотамский бассейн и Персидский залив принадлежат нам, так как они принадлежали нашим вавилонским предкам, мы вновь возьмем под свой контроль эти земли."
 IRQ_Reclaim_Basra_Vilayet: "Вернуть вилайет Басры"
 IRQ_Reclaim_Basra_Vilayet_desc: "С Басрой в наших руках, пришло время развернуть там наши институты, чтобы контролировать регион."
 IRQ_Reclaim_Emirate_Arabistan: "Возродить эмират арабистского народа"
 IRQ_Reclaim_Emirate_Arabistan_desc: "Наконец, после завоевания арабистанского фронта наш восточный фланг был защищен, и теперь он должен быть стабилизирован."
 IRQ_Cooperate_with_Cairo_Pact: "Сотрудничество с Каирским пактом"
 IRQ_Cooperate_with_Cairo_Pact_desc: "Каирский пакт, возглавляемый Египтом, является центральным элементом современного арабского мира, бастионом против империалистических сил Запада и Востока."
 IRQ_Iraqi_Egyptian_Cooperation: "Ирако-египетский договор о военном сотрудничестве"
 IRQ_Iraqi_Egyptian_Cooperation_desc: "С учетом серьезных угроз нашему Северу и нашему Востоку Ирак вновь станет пограничниками впечатляющего альянса, и для выполнения этой роли ему необходимо будет расширить свою армию, развивать свою оружейную промышленность и тесно сотрудничать со своими арабскими союзниками."
 IRQ_Law_on_Foreign_Properties: "Поощрение иностранных инвестиций"
 IRQ_Law_on_Foreign_Properties_desc: "Привлечение инвестиций для того, чтобы компенсировать нехватку местного капитала, подтолкнет нашу промышленность к новым высотам."
 IRQ_Cooperate_with_Reichspakt: "Переговоры с Рейхспактом"
 IRQ_Cooperate_with_Reichspakt_desc: "Чтобы обеспечить наше дальнейшее существование, мы должны объединиться с немцами..."
 IRQ_Berlin_Baghdad_Railway: "Берлинско-багдадская концессия"
 IRQ_Berlin_Baghdad_Railway_desc: "...что обеспечит дальнейшее процветание нашей нации."
 IRQ_Foreign_Military_Mission: "Приглашать иностранных экспертов"
 IRQ_Foreign_Military_Mission_desc: "Опыт наших союзников в вопросах науки окажется полезным в ближайшее время."
 IRQ_Cooperate_with_Turkey: "Сотрудничать с [IRQ_Get_ Cooperation_ with_ Turkey_Name]"
 IRQ_Cooperate_with_Turkey_desc: "Примириться со старым хозяином этого региона - это естественный выбор..."
 IRQ_Tigris_Euphrate_Program: "Продолжение программы Tigris & Eufrates"
 IRQ_Tigris_Euphrate_Program_desc: "...потому что именно с ними мы планировали и развивали Ирак."
 IRQ_Iraqi_Neutrality: "Иракская нейтральность"
 IRQ_Iraqi_Neutrality_desc: "Несмотря на наши международные отношения, сила Ирака проистекает из его независимости и самонаправления."
 IRQ_Join_the_new_World_Order: "Новый мировой порядок"
 IRQ_Join_the_new_World_Order_desc: "Настало время занять наше место на мировой сцене."

 IRQ_Bismarck_of_the_Arabs: "Бисмарк арабов"
 IRQ_Bismarck_of_the_Arabs_desc: "Арабский мир ожидает освобождения."
 IRQ_League_of_Arab_States: "Нашел Лигу арабских государств"
 IRQ_League_of_Arab_States_desc: "Наши братья по всей Аравии утверждают, что их голоса должны быть услышаны, что их стремление к независимости и сотрудничеству в арабском мире должно быть реализовано."
 IRQ_Economic_Social_Council: "Нашел Экономический и Социальный Совет"
 IRQ_Economic_Social_Council_desc: "Сотрудничество и взаимное процветание являются нашими ключевыми принципами."
 IRQ_Arab_Customs_Union: "Арабский таможенный союз"
 IRQ_Arab_Customs_Union_desc: "Свободная торговля товарами между нашими арабскими братьями обеспечит нашу цель взаимного процветания, но мы не должны забывать о полезности тарифов."
 IRQ_Joint_Defence_Council: "Нашел Совместный совет обороны"
 IRQ_Joint_Defence_Council_desc: "В основе эффективных совместных операций армии лежит постоянный персонал для координации усилий по развертыванию и развитию."
 IRQ_Arab_Unified_Command: "Объединить арабские командные структуры"
 IRQ_Arab_Unified_Command_desc: "Но также мы можем пойти дальше и организовать наши армии как единое целое."
 IRQ_Arab_Parliament: "Нашел парламент по арабским делам"
 IRQ_Arab_Parliament_desc: "И, в конце концов, общие институты обеспечат прогресс и рост для всех..."
 IRQ_Council_of_Transportation: "Совет транспорта"
 IRQ_Council_of_Transportation_desc: "...в поставках и производстве товаров."
 IRQ_Council_of_Justice: "Совет юстиции"
 IRQ_Council_of_Justice_desc: "...в применении и создании общих законов."
 IRQ_Council_of_Social_Affairs: "Совет по социальным вопросам"
 IRQ_Council_of_Social_Affairs_desc: "... в решении наших общих социальных проблем."
 IRQ_Arab_Federation: "Провозглашать Аравийскую федерацию"
 IRQ_Arab_Federation_desc: "Потому что в конце концов, мы все арабы, и наша борьба одна и та же."
 IRQ_Challenge_Egyptian_Domination: "Вызов египетскому доминированию"
 IRQ_Challenge_Egyptian_Domination_desc: "Египет был первым арабским государством, освободившимся от Османской империи, и по какой-то причине заставил их поверить в то, что они могут выступать в качестве лидеров арабского мира."
 IRQ_Destabilise_Syria: "Подминирование сирийского государства"
 IRQ_Destabilise_Syria_desc: "Сирийский режим оказался довольно несотрудничающим с нашим панарабским проектом, и их неверие вызывает обеспокоенность."
 IRQ_Destabilise_Hejaz: "Угроза государству Хеджази"
 IRQ_Destabilise_Hejaz_desc: "Несмотря на то, что нынешние контролеры старых святых мест ислама не могут сказать, что у них нет веры, на этот раз им, несомненно, понадобится немного уверенности."
 IRQ_Destabilise_Persian_Gulf: "Дестабилизировать Персидский залив"
 IRQ_Destabilise_Persian_Gulf_desc: "Все эти бои, должно быть, разрушили рассуждения шейхов пустыни."
 IRQ_Challenge_Persia: "Протестовать персидское правило"
 IRQ_Challenge_Persia_desc: "Несмотря на нашу недавнюю независимость от старой Империи, многие наши братья все еще страдают под правлением империй прошлого."
 IRQ_Cooperate_Oman: "Сотрудничество с Маскатом и Оманом"
 IRQ_Cooperate_Oman_desc: "Султан Маскат и Оман наверняка должны быть заинтересованы в нашем общем проекте."


