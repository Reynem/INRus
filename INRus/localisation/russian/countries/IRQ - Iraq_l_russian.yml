 ### Dynamic Modifiers ###
 IRQ_Rampant_Corruption: "Вспыльчивая коррупция"
 IRQ_Rampant_Corruption_desc: "Отсутствие надзора со стороны Костантинийе серьезно усугубило этот вопрос, поскольку многие квалифицированные бюрократы и военные руководители были вынуждены уехать в Турцию, что позволило создать условия для жизни в основном необразованного и менее дисциплинированного следующего поколения."

 IRQ_Crippling_Poverty: "Острая нищета"
 IRQ_Crippling_Poverty_desc: "Хотя Османское правительство предприняло попытки возродить Ирак в конце XIX и начале XX века, общее состояние общества в бывшем доме цивилизации совершенно ужасное. Богатство сконцентрировано в руках верхних 10%, в то время как подавляющее большинство населения либо лишено средств к существованию, либо граничит с ним."

 IRQ_Sectarian_Divide: "Разделение секторов"
 IRQ_Sectarian_Divide_desc: "Несмотря на то, что большинство политических сил принадлежит мусульманам-суннитам, в Ираке проживает большинство шиитов и значительное число меньшинств евреев, христиан и мусульман. &lt; &lt; Нахождение баланса между этими группами &gt; &gt; практически невозможно, и отсутствие желания сотрудничать привело к недееспособности правительства."

