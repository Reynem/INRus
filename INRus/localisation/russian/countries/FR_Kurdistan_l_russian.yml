 #Ideas
 KUR_British_Influence: "Под влиянием Великобритании"
 KUR_British_Influence_desc: "Согласно условиям договора с Османской империей Курдистан находился под влиянием Великобритании."
 KUR_desire_for_unity: "Желание единства"
 KUR_desire_for_unity_desc: "Хотя у нас наконец есть курдское государство, вырезанное из Восточной Анатолии, территория, контролируемая этим государством, представляет собой лишь небольшую часть территории, в которой проживают курды. Курдистанские националисты имеют амбиции в отношении каждого соседа Курдистана, причем правительство поддерживает такие заявления, но не выступает в их поддержку из-за того, что все эти соседи являются в военном, экономическом и дипломатическом отношении более могущественными, чем наше небольшое государство. Однако это не помешает нам мечтать об объединенном и свободном Курдистане, и мы надеемся, что однажды мы сможем достичь этой цели."
 KUR_Assyrians: "Возрождение ассирийского национализма"
