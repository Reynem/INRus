 PAN_juan_demostenes_arosemena: "Хуан Демостены Аросемена"
 PAN_juan_demostenes_arosemena_leader_desc: "Хуан Аросемена, несмотря на политическую либерализацию, является лидером консервативной фракции Либеральной партии; он популярен среди многих панамцев, даже не либеральных. Многие считают его единственным человеком, который может вывести Панаму из этого трудного времени."

 PAN_harmodio_arias_madrid: "Хармодио Ариас Мадрид"
 PAN_harmodio_arias_madrid_leader_desc: "Хармодио Ариас Мадрид является основателем Национальной революционной партии. Вместе со своим братом Арнульфо Ариасом Мадридом он возглавлял новое правительство после переворота в 1931 году. Он популярен среди народа, несмотря на то, что не имеет большого опыта в политических вопросах."

 PAN_manuel_pino: "Мануэль Пино"
 PAN_manuel_pino_leader_desc: "Мануэль Пино, глава национальной полиции и ее подпольный политический фронт "Коалиция Патриотика Националь", ввел в состав национальной полиции множество модернизаций и планирует превратить ее в настоящую армию, теперь, когда он президент, с политической точки зрения, он является хитростью, которую многие люди считают авторитарным грубием, но он может быть готов пойти на компромисс с демократическими группировками, если это означает, что он может остаться у власти..."

