#### Ideas ####
AST_economic_divide: "Экономический разрыв"
AST_economic_divide_desc: "Экономика нашей страны традиционно носила сельскохозяйственный и аграрный характер, однако в условиях более интенсивной эксплуатации ресурсов и индустриализации многие фермеры чувствуют себя брошенными, и в правительстве возник разрыв по этому вопросу, и нам нужно будет решить этот вопрос в какой-то момент."
AST_british_immergration: "Британская иммиграция"
AST_british_immergration_desc: "С момента окончания Великой войны мы пережили постоянный приток иммигрантов с Британских островов, который лишь еще больше возрос после экономического бума в 1920-х годах, однако это вызвало некоторую нагрузку на нашу экономику."
AST_anzac_legacy: "Наследие анзака"
AST_anzac_legacy_desc: "Действия и опыт &lt; &lt; Анзаков &gt; &gt; во время Великой войны оставили прочное наследие в культуре наших наций и нашей братской нации по всему Тасману."
AST_war_with_chile: "В войне с Чили"

