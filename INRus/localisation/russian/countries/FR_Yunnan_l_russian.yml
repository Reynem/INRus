 YUN_zeng_zesheng: "Зенг Зешенг"
 YUN_zeng_zesheng_commander_desc: "§L\nZeng Zesheng был одним из молодого поколения генералов республики Юньнань. После окончания Куньминской академии в 1924 году он решил присоединиться к КМТ в Гуанчжоу и продолжить свое обучение в Вампоаской военной академии. Однако, будучи разочарован скрытной коррупцией внутри националистического правительства, он уехал в Шанхай для работы после окончания школы. В 1929 году его пригласили вернуться в Юньнан для работы в качестве репетитора в Куньмингской академии. С тех пор он стал лидером прогрессивного крыла молодых республиканских офицеров в Куньмингской академии, призывая к борьбе с коррупцией и сокращению бедности."

