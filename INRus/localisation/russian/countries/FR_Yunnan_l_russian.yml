l_russian:
 ### EVENTS ###
 yun.1.d: "Как будто из ниоткуда Китай снова попал в полный хаос! С выборами после успеха Северной экспедиции, Республике удалось сохранить единство под знаменем Сунь Ят-Сена. Однако его смерть 3 месяца назад привела к полному краху Куоминтанга. Теперь, когда он разделился между Национальным и Социальным Куоминтангом, настало время поставить наши требования на остальной Китай! С нашими силами мы готовились к подъему Федеративной Республики Чэнь Цзонминг!"
 ### DECISIONS ###
