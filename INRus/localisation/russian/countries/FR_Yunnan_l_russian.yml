 YUN_tang_huaiyuan: "Тан Хуайюань"
 YUN_tang_huaiyuan_commander_desc: "После потери отца в раннем возрасте Тан Хуайюань был выведен из нищеты, когда комитет провинциальных экспертов из администрации Цинга заметил его умные умы и студийный характер. Тана рекомендовали в Военной академии Юньнань, которая стала известной как ребёнок. Хотя первоначально он участвовал в Северном экспедиции Куоминтанга, он не служил на передовой линии. Вместо этого он работал учителем и военным воспитателем. Как и многие его товарищи, он бежал в Юннань, когда появились новости о смерти Чина Кай Чека. Хотя он более привык к обсуждению стратегии и преподаванию, он недавно был призван вернуться к офицеру воронкой Юннанской Клики Тан Цзяо."

