 YUN_unite_china: "Объединим Китай"

 ### Characters ###
 YUN_zhu_peide: "Чжу Пейд"
 YUN_zhu_peide_leader_desc: "Чжу Пейд мог отследить среди своих предков гордых слуг династии Минь и преданных администраторов Цинг Империи. Несмотря на свой род, он присоединился к делу д-ра Сунь Ят-сена как ревнивый и научный революционер. После короткой встречи в Цзянси в качестве председателя провинции и продолжительной карьеры в Куоминтанге Чжу Пейд сбежал в изгнание после провала Северного экспедиции КМТ. Наряду с большей частью оставшейся третьей армии НРА он вернулся в свой родной район Юньнань, начав новую карьеру в администрации Тан Цзяо. ~ Когда правительство Танга упало, Чжу Пейд воспользовался возможностью сплотить остатки правого Куоминтанга и осудить поглощение Лонг Юн. Вместе со своими товарищами он пошёл на запад в Куньминг и стал лидером успешного поглощения. . Теперь, утешительно сидя в столице Юньнананана, он поклялся восстановить национальное правительство, чествуя наследие Сун Ят-Сена."
 YUN_zhu_peide_commander_desc: "§I General Profinition\n §YBorn: §L\n1888\nLufeng, Yunnan, Qing Empire\n §Y Военная карьера: §L\n niion из известной семьи Луфенга, Чжу Пейд мог отследить среди своих предков гордых слуг Ming Dynasty и преданных администраторов Цинской империи. Несмотря на свою родословную, он присоединился к делу д-ра Сун Ят-сена как революциониста и революциониста. После короткой встречи в Цзянси в качестве председателя провинции и продолжительной карьеры в Куоминтанге Чжу Пейд сбежал в изгнание после провала Северного экспедиции КМТ. Наряду с большей частью оставшейся третьей армии НРА он вернулся в свой родной район Юннан, начав строить новую карьеру в администрации Тан Цзяо."

 YUN_tang_jiyao: "Тан Цзяо"
 YUN_tang_jiyao_leader_desc: "После успеха революции, он стал губернатором Гуйчжоу и позднее вернулся в свою родную провинцию Юньнань в 1913 году, чтобы заменить Кай Э. Когда Юань Шикай объявил о своих амбициях стать императором, Тан сразу же ушел от власти, прикрываясь такими, как Чай И и Ляйцзюнь, которые будут возглавлять войну за национальную защиту вместе с Тангом. С их победой в национальной войне за защиту Юньнан стал одним из главных хегемонов континента. Когда Юань Шикай объявил о своих амбициях стать императором, Танг сразу же ушел от власти. Танг возглавил одну неудачную экспедицию за другой, не победив Сичуань, почти одолев его, как и Гу Пинчэна во время переворота в 1921 году. Таким образом, провал Северного экспедиции стал благословением для контроля над Тангосом за его пределами."
 YUN_tang_jiyao_commander_desc: "14 августа 1883 года Цинхай, Юньнан, Цин Эмпайр §Y Военная карьера: §L\nna верный последователь генерала Кай-Э, Тан начал свою политическую карьеру в 1911 году, когда Кай-Э приказал ему принять участие в восстании Вучана, начавшейся Синьхайской революцией. После успеха революции он стал губернатором Гуйчжоу и затем вернулся в свою родную провинцию Юннань в 1913 году, чтобы заменить Кай-Э. Когда Юань Шикай объявил о своих амбициях стать императором, Тан сразу же отделился при поддержке таких же, как Цай-Э и Ли Чжун, которые возглавили Национальную войну Защиты вместе со своим Тангом. С их победой в Национальной войне за защиту Юннан стал одним из главных герцогств континента."

 YUN_lu_han: "Лу Хан"
 YUN_lu_han_leader_desc: "Слухи уже давно распространяются о том, что Лу Хан был якобы сводный брат Лонг Юн, который, как утверждается, был одной из причин близкого товарища этих двух мужчин. Независимо от того, правда ли это или нет, кажется, что какие-либо кровные узы или дружба между ними не были достаточно густыми, чтобы помешать Лу Хану воспользоваться этой последней возможностью. Молодой генерал И служил вместе с Куоминтангом, боролся с Вьетнамом Куок Дан Даном из Индокии, и теперь ведет смелый переворот против своих бывших товарищей. Лу отчаянно собрал свои силы в столице и отправился на борьбу с надвигающимся штормом. Но люди вокруг него удивляются: можно ли доверять человеку, который предал своего брата?"
 YUN_lu_han_commander_desc: "§L\nRumours давно распространили, что Лу Хан был предполагаемым единокровным братом Лонг Юн, который, как утверждается, был одной из причин близкого товарища двух мужчин."

 YUN_hu_ruoyu: "Ху Руойю"
 YUN_hu_ruoyu_leader_desc: "Новая администрация была ненадолго, так как люди, свернувшие Тан Цзяо, теперь перевернули свои ножи и оружие друг на друга. Ху Руой сделал первый шаг, сделав игру, чтобы контролировать столицу с помощью своей маленькой группы последователей. В отличие от своих коллег, Ху был из привилегированной семьи ученых и домовладельцев, но при этом оказался прикован к революционной политике начала XX века. Под покровительством Тан Цзяо он поднялся на ряды Юннанской армии, в конечном итоге посадив удобную позицию в кунминском военном аппарате. С глубокими карманами и тесными связями с офицерами и гарнизонами столицы Ху сделал рискованную игру, чтобы свергнуть и арестовать своих сообщников, объявив себя новым лидером Юннананана."
 YUN_hu_ruoyu_commander_desc: "В 1894 году в Луопинге, Юннан, Цинг Империя, §Y Военная карьера: §L\nn non that его сверстники, Ху был родом из привилегированной семьи ученых и землевладельцев, но был влечен к революционной политике начала XX века. Под покровительством Тан Цзяо он поднялся на ряды Юннанской армии, в конечном итоге посадив на комфортную позицию в кунминском военном аппарате."

 YUN_long_yun: "Длинный юнь"
 YUN_long_yun_leader_desc: "В молодости Лонг Юн вдохновлялся радикальными антикинговыми студенческими движениями среди своих коллег в военной академии Юньнань. Он присоединился к местной милиции и сражался в Синьхайской революции, взбираясь в ряды до тех пор, пока он не служил под командованием Танг Цзинью в качестве командира пятой армии в Юннаньской клике. Его подъем к власти был достигнут благодаря близкому товариществу, который он провёл со своим начальником, а также его предполагаемым единокровным братом Лу Ханом. Однако со временем эта дружба была бы запятнана политическим соперничеством и горячим соперничеством за власть в падающем революционном движении. Он принял на себя многочисленные жертвы, много предателей и, конечно, сожалений, но Лонг Юн поднялся, чтобы возглавить Юннан Клик в качестве нового воина. . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . ."
 YUN_long_yun_commander_desc: "В своей юности Лонг Юн вдохновлялся радикальными анти-Qing студенческими движениями среди своих сверстников в Юньнанской военной академии. Он вступил в местную милицию и сражался в Синьхайской революции, пробираясь по званиям до тех пор, пока он не служил во главе пятой армии в Юньнаньской Клике. Этому не помогает этническое происхождение Лонга как члена меньшинства И, хотя это способствует укреплению дружбы между его администрацией и его родными. Прагматист, чужак политической элиты Хана, и амбициозный воин: «Дракон Юннананан» может быть силой для Китая."

 YUN_zhu_de: "Чжу Де"
 YUN_zhu_de_leader_desc: "В девять лет его забрал богатый дядя, а затем отправили учиться в Юннаньскую военную академию. Его время в академии видело, как он завербовался в Тонгменхуи, предшественник Куоминтан. Следующие годы жизни Чжу Де были неспокойной серией путешествий по всему Китаю, сражался на различных революционных фронтах с Национальной республиканской армией, служил различным политическим фракциям и создавал большую сеть связей. От Сычуана до Шанхая, Тибета и даже короткое свидание в качестве студента в Берлине, дороги судьбы в конечном итоге привели Чжу Де обратно в Юньнан. В последние годы он попал в арену войны Тан Цзяоу и деспотизм Юннан, который был вынужден отказаться от своей должности в Национальной республиканской армии и пообещал воздерживаться от политики, а не встретится с тяжёлым путешествием вокруг азиатского континента."
 YUN_zhu_de_commander_desc: "§L\nFamed как человек, восставший из скромных начальств, Чжу Де не был ни чем иным, как грязным бедным крестьянином, простым фермером-арендодателем в Сычуанской сельской местности. В девять лет его забрал богатый дядя, а затем отправил на обучение в Юннанскую военную академию. Его время в академии видело, как он завербовался в Тонгменхуи, предшественник в Куоминтанге. Следующие годы в жизни Чжу Де был неспокойной серией путешествий по всему Китаю, сражался на различных революционных фронтах с Национальной республиканской армией, служил различным политическим фракциям и создавал большую сеть связей."

 YUN_li_xin: "Ли Синь"
 YUN_li_xin_leader_desc: "Ли Синь учился в немецкой частной школе в Куньмине, где учился в различных университетах по всей стране. Сначала изучал агрономию в Юго-восточном университете Наньцзин, но был переведен в Пекинский сельскохозяйственный университет. Во время своего пребывания в северной столице он стал все больше интересоваться иностранной политической мыслью, изучая неудачное движение большевиков в России и ныне восходящей синдикалистской идеологией в Европе. На протяжении 20-х годов он стал все ближе относиться к синдикализму, а затем вместе с другими радикальными студентами в университете формировал политическую группу, названную"Renovation Society" in order to promote leftist views. After graduating in 1926, he travelled to Guangzhou and attended a lecture held by the Chinese Communist Party and Leftist Kuomintang on Agricultural Socialism. Although Li was at this point enamoured with Syndicalism, he accepted a request from the political representatives to join the Communist Party and help organise a political movement back in his home province of Yunnan. Dubbed the "Yunnan Special Branch", this group was initially meant to collaborate with its superiors but lost contact with the mother party following the failure of the Northern Expedition.\nLi, as one of the key figures in the group began to apply the same ideological currents which had dominated the Renovation Society, building an underground intellectual society of Syndicalist radicals in the heart of Kunming. This lead to a large schism between those loyal to the Special Branch's original beliefs, and Li's Syndicalist influence, eventually leading to Li's party founding 'Xindianshe' or 'The New Society' as a separate group. Despite his revolutionary convictions, Li has managed to remain below the radar of Tang's government. Initially several warlords in Yunnan were aware of his leftist beliefs, but had little reason to persecute a simple agricultural scholar. That all changed when Li Xin journeyed to various Yunnanese tin mines, hoping to organise the workers into a union. He even disguised himself as a miner, toiling away in hopes of growing closer to the proletariat. After organising a wildcat strike in 1929 Li was almost arrested and executed, which forced him to go into hiding. Since then he has continued to grow his political influence, hoping to once more unite the Yunnanese workers and show the warlords what power truly lies in the hands of the proletariat."

 YUN_wang_fusheng: "Ван Фушэн"
 YUN_wang_fusheng_leader_desc: "Жизнь Вана была неровной, пока он не был принят в программу Либерального искусства Пекинского университета. Рано он начал общаться с радикальными студенческими группами, узнав несколько влиятельных деятелей, таких как Ли Синь и Ли Дачжоу. В то время как многие из его товарищей помешались на изучении нового возрождающегося синдикалистского движения, которое шло по Европе и Америке, Ванг остался приверженным марксистом. Позднее он присоединился к Ли Синь."Renovation Society\", a leftist group which promoted socialist ideology at Beijing University. During this time he witnessed many of his comrades be repressed, arrested and even executed by the Beijing government, driving him down a vengeful and authoritarian path. Much like his colleague Li Xin, he met with members of the Chinese Communist Party and Leftist Kuomintang, being similarly instructed to travel back to Yunnan and organise socialists within the province. The hope was to topple the warlord Tang Jiyao's hold over the south west, by founding a 'Yunnan Special Branch' of the Communist Party that could ferment revolution.\nYet the Special Branch was nearly annihilated when the Northern Expedition failed, and its superiors among the CPC and Leftist Kuomintang ended up scattered to the wind. Worst of all for Wang, his own comrades now began to turn on him. Rejecting the old authorities they had followed and beginning to rally around Li Xin's own collectivist views. Outraged, Wang seized control of the special branch and moved to expel Li. During his tenure as leader of the underground revolutionary society, he worked to regain contact with whatever remnants of the Kuomintang or CPC might still be organised and continuing the fight in China. After years of silence and falls leads, he finally found them. The ZhongTeJu, and through a series of secret meetings, encoded messages and risky plans, the Yunnan Special Branch was restored to its original purpose: To ferment revolution against the Yunnan warlords. Despite his new superiors and the schism with his old comrades, Wang remains diligently committed to one single goal, revolution before all."

 YUN_gong_shou: "Гонг Шоу"
 YUN_gong_shou_leader_desc: "Последним в длинной линии И Туси, регионального вождя старой имперской бюрократии, Гонг Шоу стал, благодаря своей беспринципной политической гибкости и самоотверженной защите автономии южного меньшинства. Хотя первоначально он родился с именем Дао Юэ Чунь, он служил в качестве Туси из нандийской префектуры вплоть до Синьхайской революции. Проверив политические изменения, прокатившиеся через Китай, Шоу изменил свое имя на Гонг и начал распространять подробную историю о том, что его семья на самом деле является потомками солдат Мин династии, которые оккупировали Юньань. Решение принять себя в качестве члена ханской этнической принадлежности заработало Шоу в значительной степени влияния в пост-революционном политическом климате, который он использовал для кампании против попыток земельных реформ, которые ослабили бы народ И и его автономию Туси. Хотя впоследствии он был освобожден и продолжал жить с этой уникальной этнической двойственностью, потратив несколько дней на Хана Политика Гонга Шоу и других в качестве И Вождя Дао Юекуна."

 YUN_jin_handing: "Джин"
 YUN_jin_handing_commander_desc: "В 1922 году он был назначен исполняющим обязанности губернатора Юннана в рамках подготовки к северной экспедиции."

 YUN_luo_binghui: "Лу Бингхуи"
 YUN_luo_binghui_commander_desc: "12 декабря 1897 года он вступил в армию и стал известным и послушным солдатом. В это время он был замечен Тан Цзяо и повысился на более высокий пост, поднявшись через Национальную республиканскую армию до тех пор, пока не получил честь служить телохранителем д-ра Сун Ят-сена. Во время северной экспедиции он был ранен в бою и госпитализирован, что, вероятно, спасло ему жизнь во время разрушительной военной кампании. После выздоровления он присоединился к своим изгнанным товарищам в Юннане, воспользовавшись своей дружбой с Тангом, чтобы легко вступить во внутренний круг доверенных."

 YUN_fan_shisheng: "Фан Шишенг"
 YUN_fan_shisheng_commander_desc: "Он изучал медицину и работал учителем до тех пор, пока его друг Ли Хонсиан не представил его генералу Кай Е. Уже очарован революционным движением, Фан бросил свою академическую карьеру и вступил в армию Кай. Постоянная борьба и неоднократные неудачи Куоминтанга укрепить свою власть над Китаем в конечном счете привели Фана к выходу из армии, взяв на работу врача в Кунмине. Он был доволен тем, чтобы остаться политическим гражданским лицом, пока он не запомнил внимание Тан Цзяо. Он уже был знаком друг с другом со времени революции, Тану удалось убедить своего бывшего товарища вернуться в армию."

 YUN_zhao_xingwu: "Чжао Сингву"
 YUN_zhao_xingwu_leader_desc: "В 1917 году Чжао отправился в Куньминскую школу права, но был слишком молод, чтобы участвовать в Синьхайской революции или в войне за национальную защиту, истории о том, что происходило вокруг Китая, взволновали его. Во время своего пребывания в Куньминге он начал читать политическую литературу, как более основные демократические манифесты, но также копаться в запрещенной коммунистической пропаганде, которая была запрещена во время правления вождя Тан Цзяо. После попытки организовать политическую деятельность среди своих сокурсников он был изгнан из школы. В гневе на эту цензуру Чжао решил покинуть Юньнань и вступить в армию Куоминтанга на востоке. В ходе предстоящих военных кампаний он служил в качестве офицера при Чжу-Пейде, отличив себя благодаря своему аналитическому разуму и способности к стратегическому мышлению. В то же время он впервые присоединился к Коммунистической партии Китая, однако его надежды на работу с социалистами как в партии, так и в Куоминтанге не оправдались. В то время, когда Жао был вынужден сбе бежать из Юннанга, он по-нанго, он по-прежнему поддерживалл всех своих высоких социалистов."

