 RAJ_Incoming_Revolt: "Входящий револьт"
 RAJ_Incoming_Revolt_desc: "Наши сотрудники разведки обнаружили заговор лидеров мятежников с целью начала восстания в июне, и мы должны быть очень осторожны и быть готовы к тому, чтобы противостоять ему с крайней силой."
 RAJ_poor_conditions: "Условия взрыва"
 RAJ_poor_conditions_desc: "Многочисленность плохих условий труда для населения вызвала большое возмущение по поводу нашего правления в Индии, почти на каждом этапе политики мы сталкиваемся с требованиями улучшить ситуацию."
 RAJ_colonial_administration: "Департамент по политическим вопросам"
 RAJ_colonial_administration_desc: "В то время как мы можем утверждать, что правим Индией, нет никаких сомнений в том, кто правит нами, в силу этого соглашения многие считают наше правительство незаконным и как таковое не желают бороться за его выживание, а многие лучшие умы страны предпочитают уезжать, а не оставаться, что мешает нашим исследовательским возможностям."
 RAJ_poor_training: "Неэффективная профессиональная подготовка"
 RAJ_poor_training_desc: "Неправильные процедуры подготовки и общее отсутствие дисциплины в армии привели к тому, что она была невероятно неспособной силой, пригодной только для поддержания правопорядка."
 RAJ_reconquest_campaign: "Начать разведку"
 RAJ_exiled_government: "Наше правительство в изгнании"
 RAJ_anti_british: "Антибританские настроения"
 RAJ_anti_british_desc: "Население Британского Раджа было побеждено непоколебимым антибританским настроением. Многие в индийской политике хотели бы, чтобы Британская империя полностью покинула субконтинент. Пока это преобладает в Индии, мы будем бороться за достижение какого-либо прогресса в завоевании сердец и душ нашего населения."
 RAJ_princely_states: "Княжеские государства"
 RAJ_princely_states_desc: "Княжеские государства уже давно являются полуавтономными королевствами в рамках Раджа."
 RAJ_Indian_Officers: "Индийские офицеры"
 RAJ_Indian_Officers_desc: ""
 RAJ_British_Officers: "Британские офицеры"
 RAJ_British_Officers_desc: ""
 RAJ_improved_conditions: "Улучшение условий"
 RAJ_improved_conditions_desc: ""
 RAJ_new_nation: "Новая нация"
 RAJ_new_nation_desc: ""
 RAJ_limited_intervention: "Индийская гражданская война"
 RAJ_limited_intervention_desc: "Гражданская война охватила индийский субконтинент, и наша администрация в руинах, мы должны дождаться решения нашего повелителя, прежде чем мы сможем получить любую внешнюю поддержку от и без того ослабленной британской сферы."

 #####Focuses#####

 RAJ_Logistics: "Материально-техническое обеспечение Раджа"
 RAJ_Logistics_desc: "Британский Радж массивен, крупнейшая единственная колония Империи, работа над ее материально-техническим обеспечением необходима для того, чтобы должным образом управлять ею и избегать катастроф."
 RAJ_British_Indian_Army: "Британская индийская армия"
 RAJ_British_Indian_Army_desc: "Радж имеет свою собственную армию - британскую индийскую армию - на протяжении десятилетий, однако его эффективность обсуждается, и, возможно, настало время рассмотреть вопрос о возможной реформе."
 RAJ_Maintain_Indian_Control: "Сохранять контроль над Индией"
 RAJ_Maintain_Indian_Control_desc: "Единственный способ держать британскую индийскую армию под нашим контролем - это сохранить индийские позиции в рядах ее офицеров, иначе это только нагнетало бы напряженность и еще больше ослабило бы наш контроль над военными."
 RAJ_Restructure_Command: "Перестроить команду"
 RAJ_Restructure_Command_desc: "Лучший способ уменьшить вражду в нашей армии - это реорганизовать командование и предоставить больше высших командных позиций коренным индейцам."
 RAJ_Promote_Indian_Officers: "Повышение в должности сотрудников из числа индейцев"
 RAJ_Promote_Indian_Officers_desc: "В армии много офицеров индийского происхождения, которые уже десять раз доказали, что они справляются, и продвижение их на руководящие должности - это не только очевидное, но и правильное дело."
 RAJ_Indian_Military_Academy: "Индийская военная академия"
 RAJ_Indian_Military_Academy_desc: "Создание военной академии, специально предназначенной для индийских офицеров и командиров, имеет важное значение для подготовки следующего поколения лидеров британской индийской армии."
 RAJ_Increase_British_Control: "Усиление британского контроля"
 RAJ_Increase_British_Control_desc: "Единственный способ по-настоящему контролировать британскую индийскую армию - полностью поставить командные позиции под контроль британских офицеров и командиров."
 RAJ_Reinforce_Command: "Укрепить существующую командную структуру"
 RAJ_Reinforce_Command_desc: "Существующая командная структура служила армии на протяжении десятилетий."
 RAJ_British_Officers: "Британские офицеры"
 RAJ_British_Officers_desc: "Продолжение продвижения по службе и содержание офицеров британского происхождения в британской индийской армии является наилучшим способом держать организацию под нашим контролем."
 RAJ_English_Superiority: "Английский язык"
 RAJ_English_Superiority_desc: "Выбор английского - и только английского - в качестве официального языка командования является наилучшим способом объединения армии и предотвращения ее разлома."
 RAJ_Training_Reforms: "Реформы в области профессиональной подготовки"
 RAJ_Training_Reforms_desc: "Наилучший способ привести нашу армию в соответствие с современными стандартами — это начать реформы в области подготовки кадров."
 RAJ_Equipment_Upgrades: "Модернизация оборудования"
 RAJ_Equipment_Upgrades_desc: "Мы продолжаем использовать устаревшее оборудование, выданное нам британией, только покупая новые лицензии на оборудование и модернизируя наше современное оружие и снаряжение, мы можем привести нашу армию в современную эпоху."
 RAJ_Cohesive_Strategy: "Согласованная стратегия"
 RAJ_Cohesive_Strategy_desc: "Мы должны стандартизировать нашу стратегию для обеспечения того, чтобы вся армия находилась на одной стороне в любых конфликтах."
 RAJ_Raj_Army: "Армия Раджа"
 RAJ_Raj_Army_desc: "Британская индийская армия, отныне известная нам как Армия Раджа, станет сильным соперником в глобальных энергетических играх. Наконец, мы можем начать занимать свое законное место в мире - силой, если потребуется."
 RAJ_New_Forces: "Новые силы"
 RAJ_New_Forces_desc: "Помимо совершенствования нашей армии, мы должны также создать новые департаменты для модернизации вооруженных сил Раджа, в частности военно-морские и военно-воздушные силы."
 RAJ_Indian_Airforce: "Индийские военно-воздушные силы"
 RAJ_Indian_Airforce_desc: "Создание Индийских военно-воздушных сил необходимо для того, чтобы начать наше завоевание неба."
 RAJ_Adjust_Manufacturies: "Регулировать узлы"
 RAJ_Adjust_Manufacturies_desc: "К сожалению, наши нынешние предприятия не оснащены для производства новых самолетов для наших военно-воздушных сил."
 RAJ_Create_Command_Structure: "Создать командную структуру"
 RAJ_Create_Command_Structure_desc: "Создание командной структуры для наших новых военно-воздушных сил крайне важно для создания военно-воздушных сил, которые будут успешно защищать нашу страну и ее интересы."
 RAJ_Mass_Produce_Planes: "Плоскости массового производства"
 RAJ_Mass_Produce_Planes_desc: "Воздушное превосходство побеждается с помощью самолётов."
 RAJ_Strategy_for_Skies: "Стратегия для неба"
 RAJ_Strategy_for_Skies_desc: "У нас должна быть последовательная стратегия в том, что касается воздушной войны; только тогда мы сможем успешно координировать ее операции с армией и военно-морскими силами."
 RAJ_Infantry_Support: "Поддержка пехотных подразделений"
 RAJ_Infantry_Support_desc: "Использование военно-воздушных сил для поддержки нашей пехоты является самым важным приоритетом."
 RAJ_Prioritize_Fighters: "Приоритизировать борцов"
 RAJ_Prioritize_Fighters_desc: "Нам нужно приоритизировать создание боевиков над бомбардировщиками; если Великая война чему-то научила нас, так это тому, что современные войны выигрываются, осуществляя полный контроль над небом."
 RAJ_Independent_Operations: "Независимые операции"
 RAJ_Independent_Operations_desc: "Назначив наши различные воздушные крылья независимыми операциями, мы сможем успешно обеспечить как можно более широкий охват в небе."
 RAJ_Prioritize_Bombers: "Приоритизировать бомбардировщиков"
 RAJ_Prioritize_Bombers_desc: "Нам нужно приоритизировать создание бомбардировщиков, а не боевиков; если Великая война чему-то и научила нас, так это тому, что современные войны побеждаются абсолютным и полным уничтожением врага."
 RAJ_Wings_Over_India: "Крылья над Индией"
 RAJ_Wings_Over_India_desc: "Небо Индии должно стать нашим достоянием, и, более конкретно, достоянием наших новых военно-воздушных сил."
 RAJ_Comprehensive_Conquest: "Всеобъемлющая последующая деятельность"
 RAJ_Comprehensive_Conquest_desc: "Современные завоевания зависят от сильных военно-морских и военно-воздушных сил, а также от сильной армии."
 RAJ_Raj_Navy: "Раджский флот"
 RAJ_Raj_Navy_desc: "Армия британских индейцев требует, чтобы в дополнение к ней были британские индийские военно-морские силы."
 RAJ_New_Dockyards: "Новые докьярды"
 RAJ_New_Dockyards_desc: "Мы не можем строить новые корабли, не имея верфи для их строительства."
 RAJ_Shipbuilding_Techniques: "Методы судостроения"
 RAJ_Shipbuilding_Techniques_desc: "Мы отстаем от остального мира, когда речь идет о судостроении, но использование их методов не исключено, когда речь идет о производстве наших собственных кораблей."
 RAJ_Foreign_Schematics: "Иностранные схемы"
 RAJ_Foreign_Schematics_desc: "Использование судовых схем из других стран будет самым быстрым и эффективным способом создания нового ВМС."
 RAJ_Strategy_for_Waves: "Стратегия для волн"
 RAJ_Strategy_for_Waves_desc: "Нам нужна согласованная стратегия контроля над морями вокруг Индии, и настало время приступить к планированию такой стратегии."
 RAJ_Ocean_Supremacy: "Соблазненность океана"
 RAJ_Ocean_Supremacy_desc: "Защита Индии от моря означает доминирование волн."
 RAJ_Battleship_Designs: "Дизайны боевых кораблей"
 RAJ_Battleship_Designs_desc: "Боевые корабли будут хлебом и маслом нашей стратегии по контролю над морями."
 RAJ_Control_Deep: "Контролировать глубину"
 RAJ_Control_Deep_desc: "Вместо того, чтобы пытаться доминировать над волнами, гораздо лучше стратегия нашего ВМС - доминировать на глубине и создать сеть безопасности подводных лодок вокруг Раджа."
 RAJ_Submarine_Designs: "Дизайн подводные лодки"
 RAJ_Submarine_Designs_desc: "Подводные лодки будут хлебом и маслом нашей стратегии контролировать глубину."
 RAJ_Carrier_Ambitions: "Амбиции перевозчиков"
 RAJ_Carrier_Ambitions_desc: "Создание авианосцев - это грандиозная перспектива, особенно перед лицом устоявшейся ВМС, но мы не откажемся, мы не должны быть подкованы, мы должны создать ВМС для новой эры."
 RAJ_Ships_Around_India: "Корабли вокруг Индии"
 RAJ_Ships_Around_India_desc: "Создание сети безопасности кораблей вокруг Индии защитит нас от моря и заставит наших врагов атаковать горы и джунгли."

 RAJ_Indian_Industry: "Индийская промышленность"
 RAJ_Indian_Industry_desc: "Слишком долго мы позволили англичанам разрушить нашу индустрию и заставить нас полагаться на Империю."
 RAJ_British_Exploitation: "Эксплуатация в Великобритании"
 RAJ_British_Exploitation_desc: "Британская империя слишком долго калечила и эксплуатировала нашу индустрию."
 RAJ_Diplomatic_Channels: "Дипломатические каналы"
 RAJ_Diplomatic_Channels_desc: "Наилучший подход к созданию нашей собственной промышленности — это использование дипломатических каналов и приобретение британских предприятий на нашей земле на законных основаниях."
 RAJ_Immediate_Nationalization: "Непосредственная национализация"
 RAJ_Immediate_Nationalization_desc: "Лучший подход к созданию нашей собственной промышленности - захват британских предприятий на нашей земле и их немедленное национализацию."
 RAJ_Buy_Crown_Industries: "Покупать компании &quot; Корона индастриз &quot;"
 RAJ_Buy_Crown_Industries_desc: "Хотя это, конечно, дорого, и поставило нас в еще более глубокий долг Лондону, покупка короны в Радже - это лучший шаг, который мы можем сделать, чтобы начать долгий путь к созданию нашей собственной промышленности."
 RAJ_Seize_Crown_Industries: "Захват предприятий &quot; Короны &quot;"
 RAJ_Seize_Crown_Industries_desc: "Предприятия короны не имеют права находиться на нашей земле."
 RAJ_Slow_Reform: "Медленная реформа"
 RAJ_Slow_Reform_desc: "Как всегда, мы должны принимать вещи медленно и законно, если мы хотим держать британцев подальше от наших спин."
 RAJ_Immediate_Reform: "Непосредственная реформа"
 RAJ_Immediate_Reform_desc: "Британцы слишком долго стояли у нас на спине. Пришло время отвлечь их. Наша миссия по индустриализации Индии не может быть успешной ни в коем случае."
 RAJ_Self_Sufficiency: "Самодостаточность"
 RAJ_Self_Sufficiency_desc: "Конечной целью Раджа является то, чтобы оно стало достаточным для себя, и только путем продвижения к этой цели мы можем переосмыслить себя и нашу новую нацию."
 RAJ_EAC_Legacy: "Наследие Ост-Индской компании"
 RAJ_EAC_Legacy_desc: "Без нее мы могли бы стать глобальной супердержавой, но в прошлом нет смысла жить, мы должны определить наследие ЕИК и преодолеть его."
 RAJ_Embrace_British_Industry: "Воспитание британской промышленности"
 RAJ_Embrace_British_Industry_desc: "Как бы нам ни было больно, наиболее эффективным способом достижения нашей конечной цели является охват британской промышленности, уже существующей в нашей стране."
 RAJ_Reject_British_Industry: "Отклонить британскую промышленность"
 RAJ_Reject_British_Industry_desc: "Как бы трудно это ни было, единственный способ достичь нашей конечной цели - это отвергнуть индустрию, которую британцы навязали нам, и создать наши собственные стильы и методы."
 RAJ_Petition_Parliament_Change: "Парламент петиции за перемены"
 RAJ_Petition_Parliament_Change_desc: "Мы должны продолжать делать все, что в наших силах, мы должны просить парламент в Лондоне о внесении изменений в законы, которые удерживают нас в промышленности."
 RAJ_Circumvent_British_Laws: "Циркумулирование британских законов"
 RAJ_Circumvent_British_Laws_desc: "Хотя Лондону, возможно, это не понравится, они не оставили нам выбора, мы должны обойти законы, которые так долго удерживали наши руки, чтобы достичь наших целей."
 RAJ_Move_On: "Двигайтесь дальше"
 RAJ_Move_On_desc: "Единственный способ продвинуться вперед — это преодолеть наше наследие и построить новое будущее."
 RAJ_Request_Reparations: "Просьба о возмещении"
 RAJ_Request_Reparations_desc: "Британская империя на протяжении веков нанесла столь непоправимый ущерб нашей стране, хотя, по всей вероятности, наша просьба будет отклонена сразу же после прибытия, мы должны обратиться в Лондон с просьбой о возмещении ущерба."
 RAJ_Industrial_Cooperation: "Промышленное сотрудничество"
 RAJ_Industrial_Cooperation_desc: "Сотрудничество с Великобританией - это наилучший способ улучшить нашу уже существующую промышленность и построить новые фабрики."

 RAJ_Coming_Revolt: "Надвигающийся шторм"
 RAJ_Coming_Revolt_desc: "Надвигается восстание, у нас мало времени, мы должны действовать быстро."
 RAJ_Prepare_Industry: "Подготовить нашу индустрию"
 RAJ_Prepare_Industry_desc: "Наша индустрия находится под влиянием британского господства почти 200 лет, но мы должны начать полагаться на нее сейчас, чтобы подготовиться к грядущему шторму."
 RAJ_Military_Focus: "Оружие и боеприпасы"
 RAJ_Military_Focus_desc: "Силы обороны Раджа плохо оснащены и плохо подготовлены к грядущему восстанию."
 RAJ_Fortify_Positions: "Укрепление стратегических позиций"
 RAJ_Fortify_Positions_desc: "Если восстание произойдет, оно не сможет победить нас до тех пор, пока мы будем держаться за стратегические города и базы по всей стране, мы должны укрепить эти позиции и подготовиться к их защите."
 RAJ_Fortress_India: "Крепость Индии"
 RAJ_Fortress_India_desc: "Индия станет крепостью, против которой разрушатся силы любого восстания."
 RAJ_Strenghten_Government: "Уничтожить наше правительство"
 RAJ_Strenghten_Government_desc: "Наше правительство никогда не было особенно сильным, особенно перед лицом британского господства."
 RAJ_Shore_Support: "Поддержка"
 RAJ_Shore_Support_desc: "Каждый человек, который поддерживает наше правительство, вместо того чтобы поднимать оружие против него, - это еще один гвоздь в гробу восстания."
 RAJ_Prepare: "Подождите... и приготовьтесь."
 RAJ_Prepare_desc: "Мы сделали все, что могли, мы ничего не можем сделать, кроме как подождать..."
 RAJ_After_Storm: "После бури"
 RAJ_After_Storm_desc: "С учетом того, что восстание уже не представляет угрозы, мы должны сосредоточиться на восстановлении страны и обеспечении того, чтобы подобное никогда больше не угрожало нам."
 RAJ_Rebuild: "Планы реконструкции"
 RAJ_Rebuild_desc: "Было бы ложью сказать, что Индия не была разрушена многовековым британским колониализмом, что в сочетании с недавними беспорядками делает необходимым, чтобы мы разработали планы восстановления страны и ее промышленности."
 RAJ_Root_Out_Remnants: "Корни повстанческих пережитков"
 RAJ_Root_Out_Remnants_desc: "Немногие повстанцы, которые все еще разбросаны по сельской местности, должны быть уничтожены и побеждены."
 RAJ_Offer_Amnesty: "Предложить амнистию"
 RAJ_Offer_Amnesty_desc: "Одним из путей примирения с бывшими повстанцами могло бы стать объявление им амнистии за их действия."
 RAJ_Reconcile_British: "Согласиться с англичанами"
 RAJ_Reconcile_British_desc: "Наши связи с Лондоном были напряжены восстанием и его последствиями."
 RAJ_Defense_Status: "Состояние нашей обороны"
 RAJ_Defense_Status_desc: "Защита Раджа стала первостепенной после восстания, и мы должны пересмотреть наши вооруженные силы и улучшить их, когда это необходимо, чтобы избежать нового кризиса."
 RAJ_Reconcile_Princes: "Согласиться с принцами"
 RAJ_Reconcile_Princes_desc: "Княжеские Штаты, которым мы предоставили автономию, берут все больше и больше своих дел в свои руки после восстания, мы должны примириться с ними сейчас, прежде чем они получат какие-то забавные идеи..."
 RAJ_Avoid_Fracture: "Избегайте разрушения"
 RAJ_Avoid_Fracture_desc: "Хотя автономия и амнистия, которые мы предоставили в целях смягчения последствий восстания, были успешными, сейчас мы сталкиваемся с серьезной угрозой раскола нашей нации между военизированными группировками, и мы должны стремиться к тому, чтобы они были интегрированы и не допускали такой возможности."
 RAJ_Forward: "Вперед"
 RAJ_Forward_desc: "Единственный путь для нашего правительства - это двигаться вперед, в новое будущее."

 RAJ_Troubled_Future: "Наше неспокойное будущее"
 RAJ_Troubled_Future_desc: "Радж и раньше переживал трудные времена, но проблемы, с которыми мы сталкиваемся сегодня, беспрецедентны."
 RAJ_Reform_and_Reconciliation: "Реформа и примирение"
 RAJ_Reform_and_Reconciliation_desc: "Единственный способ обрести нашу собственную автономию и независимость — это провести реформу и примирение с британской системой, которая в настоящее время правит нами."
 RAJ_Top_Down_Reform: "Реформа сверху вниз"
 RAJ_Top_Down_Reform_desc: "Самый эффективный вид реформы, к которой мы должны стремиться, должен осуществляться сверху вниз."
 RAJ_Administrative_Changes: "Административные изменения"
 RAJ_Administrative_Changes_desc: "Для того чтобы мы могли провести надлежащую реформу, необходимо внести существенные изменения в то, как мы управляем нашей страной."
 RAJ_Bottom_Up_Reform: "Реформа снизу вверх"
 RAJ_Bottom_Up_Reform_desc: "Наиболее эффективной реформой, к которой мы стремимся, должно быть проведение реформ снизу вверх."
 RAJ_Listen_to_People: "Слушайте людей"
 RAJ_Listen_to_People_desc: "Народ является нашим последним арбитром, и мы несем перед ним ответственность - и ответственность за будущее Раджа - за то, чтобы прислушиваться к их нуждам и действовать соответствующим образом."
 RAJ_Status_Quo: "Статус Quo"
 RAJ_Status_Quo_desc: "При надлежащей реформе и примирении нынешняя ситуация под британским правлением является наилучшим способом поддержания стабильности и мира в Британском Радже."
 RAJ_Request_British_Assistance: "Просьба об оказании помощи Великобритании"
 RAJ_Request_British_Assistance_desc: "Если мы хотим создать великую нацию, мы должны использовать все имеющиеся в нашем распоряжении инструменты."
 RAJ_Restrict_Communication: "Ограничение связи"
 RAJ_Restrict_Communication_desc: "Укрепление нашего контроля над Раджем является наилучшим способом обеспечения мира и процветания."
 RAJ_Time_Tested_Solution: "Проверенное время решение"
 RAJ_Time_Tested_Solution_desc: "Если британцы и Империя и научили нас чему-то, так это тому, что лучший способ править - это силой."
 RAJ_Gentle_Hand: "Нежная рука..."
 RAJ_Gentle_Hand_desc: "Мы должны быть готовы предлагать уступки и подачки, когда это необходимо..."
 RAJ_Iron_Fist: "...и Железный кулак."
 RAJ_Iron_Fist_desc: "...но также чтобы уничтожить любые признаки восстания с первого взгляда."
 RAJ_Dominion_Status: "Запросить статус Доминиона"
 RAJ_Dominion_Status_desc: "На протяжении многих лет британцы предоставили статус Доминиона нескольким своим бывшим колониям - Канаде, Австралии, Новой Зеландии, Южной Африке."
 RAJ_Simon_Commission: "Саймонская комиссия"
 RAJ_Simon_Commission_desc: "Британцы решили обеспечить нашу свободу Комиссией белых британцев, хотя, очевидно, это не то, с чем мы хотели, это то, с чем мы будем вынуждены работать."
 RAJ_Sitaramayya_Commission: "Комиссия Ситарамайя"
 RAJ_Sitaramayya_Commission_desc: "Британцы дали нам возможность обеспечить нашу собственную свободу на основе разделения Комиссии между британскими и индийскими участниками переговоров. Это наилучший путь вперед и лучший способ обеспечить светлое индийское будущее."
 RAJ_Subdue_Nationalists: "Подчинить националистов"
 RAJ_Subdue_Nationalists_desc: "Националисты угрожают стать агрессивными, если не будут удовлетворены все их требования, и мы должны подчинить их, с тем чтобы обеспечить мирный переход к независимости и государственности."
 RAJ_Boost_Moderates: "Усилить умеренные"
 RAJ_Boost_Moderates_desc: "Умеренные в нашем штате гораздо более ценны для переговорного процесса и независимости, чем экстремальные националисты."
 RAJ_New_State_Apparatus: "A Новое государственное оборудование."
 RAJ_New_State_Apparatus_desc: "Одной из самых насущных проблем, с которой мы сталкиваемся, является создание совершенно нового государства."
 RAJ_Free_Elections: "Свободные выборы"
 RAJ_Free_Elections_desc: "Нам не хватало самого основного строительного блока демократии до тех пор, пока нами правили британцы."
 RAJ_Assume_Control: "Предположим, что контроль над вооруженными силами"
 RAJ_Assume_Control_desc: "Если мы хотим порвать с англичанами, они больше не могут контролировать то, что защищает нашу нацию."
 RAJ_Transition: "Переход к доминированию"
 RAJ_Transition_desc: "Единственный путь вперед, без войны или насилия, — это переход к Доминиону, хотя это и не полная независимость, но это по-прежнему независимость."
 RAJ_Enough: "Хватит, хватит."
 RAJ_Enough_desc: "Мы слишком долго имели дело с британским правлением."
 RAJ_Call_of_People: "Призыв народа"
 RAJ_Call_of_People_desc: "Люди больше не будут молчать. Слушай, ты слышишь, как они поют?"
 RAJ_Untenable: "Нет более длительного пользования"
 RAJ_Untenable_desc: "Статус-кво просто уже не является приемлемым, мы не можем больше притворяться, что британское правление над Индией является приемлемым, нам пора воспользоваться нашей независимостью и определить свою собственную судьбу."
 RAJ_Worth: "Оно того стоит?"
 RAJ_Worth_desc: "Это вопрос, который мы должны задать себе, можем ли мы поддерживать себя без поддержки Империи?"
 RAJ_Withdraw: "Время отступить"
 RAJ_Withdraw_desc: "Пора двигаться дальше."
 RAJ_Independence_Path: "Путь к независимости"
 RAJ_Independence_Path_desc: "Для достижения конечной цели нам необходимо работать с англичанами, чтобы сделать это."
 RAJ_Domestic_Reform: "Внутренняя реформа"
 RAJ_Domestic_Reform_desc: "Хотя уход из Британской империи является нашей главной заботой, внутренняя реформа также необходима для того, чтобы наша страна выдержала испытание временем."
 RAJ_British_System: "Поддерживать британскую систему"
 RAJ_British_System_desc: "Мы уже нажимаем свои ограничения, становясь нашими собственными независимыми нациями. Составление наших собственных правовых кодексов - это слишком много работы, чтобы реально заняться этим; сохранение законов, которые мы получили, - это наилучший путь вперед."
 RAJ_Reinforce_Legal_Codes: "Сохранять нынешние правовые кодексы"
 RAJ_Reinforce_Legal_Codes_desc: "Самый простой путь вперед - это сохранение правовых кодексов, которые нам дали британцы, и их реформирование только там, где это абсолютно необходимо."
 RAJ_Indian_System: "Создать индийскую систему"
 RAJ_Indian_System_desc: "Британцы слишком долго правили нами своими законами. Создание нашей собственной индийской правовой системы - это наилучший путь вперед и лучший способ создать нашу собственную национальную самобытность."
 RAJ_Draft_New_Codes: "Проект новых правовых кодексов"
 RAJ_Draft_New_Codes_desc: "Для того чтобы создать нашу собственную систему законов, мы должны приступить к длительному процессу разработки совершенно новых правовых кодексов."
 RAJ_Foreign_Relations: "Установление внешних отношений"
 RAJ_Foreign_Relations_desc: "Установление внешних отношений является одной из самых важных вещей, которые может сделать родившаяся страна, работая над этим здесь и сейчас, может только помочь нам в долгосрочной перспективе."
 RAJ_Break_with_British: "Разойтись с англичанами"
 RAJ_Break_with_British_desc: "Наилучший путь вперед - это разорвать наши связи с Британской империей."
 RAJ_Leave_IPA: "Оставить АПИ"
 RAJ_Leave_IPA_desc: "Выход из Альянса Императорской защиты - лучший и быстрый способ показать британам, что мы больше не являемся частью их сферы."
 RAJ_Keep_with_British: "Оставайтесь с англичанами"
 RAJ_Keep_with_British_desc: "Оставшиеся друзья с британцами, даже если они держат нас в их сфере, необходимы для выполнения этой задачи."
 RAJ_Reinforce_Foreign_Ties: "Укрепляйте наши чужеземные связи"
 RAJ_Reinforce_Foreign_Ties_desc: "Мы должны укрепить связи, которые связывают нас с нашими потенциальными союзниками, чтобы это стало реальностью."
 RAJ_Gradual_Independence: "Постепенная независимость"
 RAJ_Gradual_Independence_desc: "Путь к независимости долгий, но это путь, который мы пойдем, шаг за шагом, наше будущее будет светлым, и наш народ будет великим."

 #####Exile Raj Focuses#####
 RAJ_ex: "Изгнать в Цейлон"
 RAJ_ex_desc: "Наши самые страшные страхи случились. Наше правительство, или то, что от него осталось, теперь изгнано на остров в Индийском океане, достаточно близко к материку, чтобы увидеть, что мы потеряли. Мы должны перегруппироваться и восстановиться и проложить путь вперед."
 RAJ_Regroup: "Перегруппировать наши силы"
 RAJ_Regroup_desc: "Мы должны собрать их вместе и реорганизовать, с тем чтобы создать такую боевую силу, которая была бы достаточно сильной, чтобы оттолкнуть наших врагов и, возможно, вернуть то, что мы потеряли."
 RAJ_Reconquer: "Реконструкция Индии"
 RAJ_Reconquer_desc: "Нас, возможно, вытеснили с континента, но мы отказываемся верить, что потеряли Раджа навсегда. С британской помощью, разведка субконтинента в наших руках. У нас будет много работы и много планирования, прежде чем мы сможем вернуться. Но мы вернемся."
 RAJ_Ceylon_Industry: "Производство цейлона"
 RAJ_Ceylon_Industry_desc: "У острова Цейлон мало промышленности, если она вообще существует, большая часть из них древняя, но может удовлетворить наши потребности, если перенацелиться."
 RAJ_Ceylon_Garrison: "Цейлонский гарнизон"
 RAJ_Ceylon_Garrison_desc: "Маленький гарнизон, который британцы держали на Цейлоне, состоит главным образом из коренных народов."
 RAJ_Revive_Industry: "Возрождение старой промышленности"
 RAJ_Revive_Industry_desc: "Старая индустрия, которая подбрасывает цейлон, может служить нашим целям, если она будет восстановлена правильно, мы должны сосредоточиться на том, чтобы эти старые фабрики вырезали оружие и боеприпасы для нашей разведки."
 RAJ_Ceylon_Infrastructure: "Инфраструктура Цейлона"
 RAJ_Ceylon_Infrastructure_desc: "Большинство цейлонов по-прежнему забиты джунглями, и очень мало инфраструктуры существует для того, чтобы задействовать наши силы, мы должны наращивать ресурсы острова, чтобы должным образом подготовить реквизит."
 RAJ_Ceylon_Repurposed: "Цейлон"
 RAJ_Ceylon_Repurposed_desc: "Цейлон, маленький островок в Индийском океане, теперь стал нашей оперативной базой и будет служить в качестве стартовой площадки для нашей разведки материковой части Индии."
 RAJ_Stockpile: "Оружие из британских запасов"
 RAJ_Stockpile_desc: "Хотя мы можем использовать цейлонскую промышленность для производства оружия и боеприпасов, мы все же должны оказать давление на британцев, с тем чтобы они оказали материальную помощь для предстоящей разведки."
 RAJ_Training: "Новые методы обучения"
 RAJ_Training_desc: "Ясно, что наша нынешняя армия не может взять под контроль мятежников, которые в настоящее время контролируют материковую Индию, без значительной корректировки."
 RAJ_Conscription: "Военнослужащие цейлонской армии"
 RAJ_Conscription_desc: "С учетом того, что британцы в основном нас бросают, мы должны полагаться на местных новобранцев из цейлонов, чтобы увеличить наши показатели для реквизиции."
 RAJ_New_Army: "Новая армия"
 RAJ_New_Army_desc: "Мы должны переоформить наши силы в новом образе, который позволит нам победить мятежников, которые сейчас оккупируют материковую часть Индии."
 RAJ_Against_India: "Против индийских государств"
 RAJ_Against_India_desc: "Пришло время начать войну против индейцев, которые сейчас занимают субконтинент."
 RAJ_Crossing_the_Straits: "Пересечь проливы"
 RAJ_Crossing_the_Straits_desc: "Нам нужно будет пересечь воду, чтобы покорить Раджа, мы должны подготовить наши силы к военно-морским высадкам и вторжениям, с тем чтобы мы могли как можно скорее сражаться на континенте."
 RAJ_Pressure_British: "Надавить на англичан"
 RAJ_Pressure_British_desc: "Несмотря на все наши приготовления, мы не сможем вторгнуться на материк Индии без британской помощи."

