 IND_appalling_sanitation_desc: "Инфраструктура санитарии в Индии оставляет желать лучшего и вызывает серьезные проблемы с болезнями среди населения."
 IND_agricultural_economy: "Сельскохозяйственная экономика"
 IND_agricultural_economy_desc: "Наши годы, как колониальный субъект, оставляют нашу экономику неразвитой и высоко сельскохозяйственной, в результате чего наша промышленная промышленность является низкой, а значительная часть нашего населения связана с сельскохозяйственной работой, которая означает, что ее нельзя призывать на военную службу."
 IND_mass_illiteracy: "Массовая неграмотность"
 IND_mass_illiteracy_desc: "Англичане никогда не потрудились просвещать большинство индийского населения, и образование было зарезервировано для тех, кто мог позволить себе поездку в Великобританию и финансирование, что было невозможно для подавляющего большинства нашего бедного населения."
 IND_caste_system: "Кастовая система"
 IND_caste_system_desc: "Кастовая система является жизненно важной частью индийской культуры и нашего образа жизни, хотя некоторые могут критиковать ее за устаревшую и несправедливую жизнь, она является основой повседневной жизни в Индии."

