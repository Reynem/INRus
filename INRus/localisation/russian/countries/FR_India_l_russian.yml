 ### Leaders ###
 POLITICS_LORD_LINLITHGOW_DESC: "§W\n 6 сентября 1887 года, Южный Куинсферри, Шотландия# §G Военная карьера:n §Winlithgow служил офицером на Западном фронте во время первой мировой войны. Переведён из Лотиана и Пограничного Коня, он командовал батальоном королевских шотландских шотландцев. Он был упомянут в диспетчерских работах и назначил офицера ордена Британской империи, который положил конец войне в звании полковника. ~n-Nn-Night of the Vestle Order of the Gartern-Night Companion of the Stellen-Grony Ordence of the Thytle-n-Knight Granding Grand Company of the Vestal Order of the Star of the Indian Kn-Knight Grand-Un-Unionist Party (Scotland)"

 RAJ_frank_messervy_desc: "§W\n December 1893, Scoveldsferry, Scottlection\n §Gary Service:n §WMessservy получил образование в Eton College и Королевском военном колледже, Сандхёрст, был зачислен в Индийскую армию в 1913 году, а в 1914 году присоединился к 9-й Конь Ходсона, который позднее стал частью 4-го герцога Кембриджского коня. Он будет наблюдать действия во время Первой мировой войны во Франции, Палестине и Сирии с 1914 по 1918 годы."

 RAJ_noel_beresford_peirse_desc: "В 1907 году он служил во время Первой мировой войны в Египте в 1914 году, а затем в Месопотамии в Египте и, наконец, во Франции и Бельгии. В 1918 году он был упомянут в диспетчерских и награждён орденом "Уважаемая служба". После Первой мировой войны и после посещения Колледжа персонала, Кэмберли в 1924-1925 годах, до 1929 года, он выполнял ряд функций в Королевской Артиллерии во Франции и Великобритании."special duties" and has been assigned as instructor at the Senior Officers' School in Belgaum, India.\n\n-Companion of the Order of the Bath\n§GNotes:§W\n-Chaotic personal life"

 RAJ_douglas_gracey_desc: "В сентябре 1915 года он был назначен из незакрепленного списка индийской армии в состав 1-го Королевского военного колледжа им. Георга Вольта Гурха Рифлеса (Малунский режим) в качестве второго лейтенанта. В начале 1915 года он был присоединен к 5-му экстремальному батальону, Королевскому званием Манстера Фусилиа. С 11 января по 2 мая 1915 года он был знаком во Франции с его династией, когда он был ранен. В сентябре 1915 года он был назначен из незакрепленного списка индийской армии в 1-й королевской армии Джорджа Вул Гурха Рифлеса (Малаунский режим) в звании второго лейтенанта. В 1919 году он получил звание второго лейтенанта. С его индейским полком он был приглашён на службу в Месопотинскую и Палестину и был награждён Военным Крестом в 1917 году и в 1919 году между войнами он стал инструктором в Королевском военном колледже, Сандхерст, в 1929 году, а также был одним из кважного офицера."

