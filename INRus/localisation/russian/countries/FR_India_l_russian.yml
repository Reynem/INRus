 india.1.t: "Влажный вакуум"
 india.1.d: "С учетом того, что британцы были изгнаны из нашей справедливой страны, и с учетом того, что в нашей новой объединенной стране была установлена некоторая стабильность, Временное правительство в Дели созвало выборы руководителей, в ходе которых лидеры милиции, старые принцы Раджа и коммунистические советы востока получили право голоса."
 india.1.a: "Немедленно проведи выборы!"
 india.1.b: "Нам не нужны выборы..."
 india.2.t: "Выборы в парламент Индии"
 india.2.d: "Что такое новая нация без выборов? Британцы разрешили нам провести выборы, но позиции, за которые мы смогли проголосовать, не обладали достаточной властью для того, чтобы остановить Империю от того, что она хочет. Теперь наша нация будет править национальным парламентом и премьер-министром. Хотя мы все едины в демократии, однако, страна все еще разделена по пути, по которому она должна идти. Три основные идеологии поднялись на стезю региональных партий: коммунисты, либералы и националисты. Коммунисты, в основном базирующиеся в восточной Индии, стремятся создать систему благосостояния в советском стиле. Поскольку их поддержка ограничена по географическому признаку, шансы на успех являются низкими. Либералисты, тем временем, формировали в индийском национальном конгрессе и уже имеют большую базу власти по всей стране. Их шансы на успех являются самыми высокими из трех. Наконец, есть националисты. Вдохновленные такими системами, как немецкий валькизм, кандидаты этой идеологии стремятся создать достаточно сильное индийское государство, чтобы отбросить своих врагов и найти место среди верхних империй мира. Их шансы на успех также далеки. Но как индей лидеры будут в будущем, они будут вести о том, что они будут говорить о будущем:"
 india.2.a: "Коммунисты выигрывают большинство."
 india.2.b: "Национальный конгресс Индии имеет преимущественную силу."
 india.2.c: "Националисты подметают парламент."


 india.40.t: "Беспорядки в парламенте"
 india.40.d: "Сегодня несколько членов парламента вели не что иное, как всемерную драку в зале прений. Похоже, что несколько членов партии Индуист Махасабха , которая следует за индуистским валькизмом, спровоцировали драку с несколькими членами Индийского национального конгресса. Хотя травмы были ограничены лишь сломанными запястьями и несколькими синяками, мы, несомненно, станем посмешищем в мире, когда эта новость дойдет до новостных каналов в Европе и Америке. Это происходит в ходе наших попыток укрепить связи, необходимые для построения сильного и прочного государства, и может поставить под угрозу эти попытки. Хотя силы безопасности парламента смогли легко разрушить драку и температурию, которые были заперты в нашем правительстве, некоторые члены нашего правительства призывают нас принять более жесткий подход, а именно арестовать индусов Махасабха и предъявить им обвинение в уголовном суде. Это могло бы послужить мощным сигналом миру о том, что мы не потерпим такого рода базового поведения в нашем правительстве, но и может также привести к подрыву сторонников партии. Тем незначим некоторые беспорядки, которые могут поставить под угрозу нашим иностранным связям?"
 india.40.a: "Они разберутся."
 india.40.b: "Арестуйте преступников."
 india.41.t: "Призыв валькистов к освобождению лидеров"
 india.41.d: "Ряд валькистских ополчений, в основном состоящих из бывших мятежников из сельской местности, собрались за пределами здания парламента в Дели и требуют немедленного освобождения членов партии &quot; Индуист Махасабха &quot; , которые были арестованы после того, как они вели всестороннюю драку на полу парламента."
 india.41.a: "Отпустите преступников."
 india.41.b: "Они в тюрьме не просто так."
 india.42.t: "Валькистская милиция собралась в Нью-Дели"
 india.42.d: "В Нью-Дели начали собираться все более вооруженные валькистские ополчения. Бульвары в целом были закрыты, а члены парламента были вынуждены эвакуировать здание парламента. По всему городу вспыхнуло маломасштабное насилие между валькистскими ополченцами и сторонниками Индийского национального конгресса, но ничего слишком серьезного. Их протесты растут каждый день, но некоторые из наших советников говорят нам, чтобы они продолжали протестовать до тех пор, пока их движение не изменится. Небольшое меньшинство, однако, настаивает на том, чтобы направить в индийскую армию и уничтожить ополчения силой. Этот путь, несомненно, приведет к насилию и, возможно, к смерти. Но это, несомненно, приведет к выводу боевиков из города, если все пойдет по плану. Что нам делать?"
 india.42.a: "Пусть протестуют."
 india.42.b: "Пошлите армию."
 india.43.t: "Кубок!"
 india.43.d: "Когда индийская армия ворвалась на улицы, чтобы убрать валькистские ополчения, собравшиеся в Нью-Дели, весь ад прорвался. Половина бойцов, казалось, симпатизировала валькистам, и вскоре ополченцы заняли позиции по всему городу и ворвались в здание парламента, захватив в заложники тех, кого, к сожалению, до сих пор там не было. После ожесточенных столкновений валькистские ополчения также ворвались в здание Секретариата и захватили в плен кабинет нации. Несколько членов, включая премьер-министра, сбежали и покинули город, но их шансы на побег из страны невелики. Когда в конечном итоге боевые действия закончились, именно валькистские ополчения контролировали всю территорию Новой Дели. Ордены были разорваны по всей Индии, приказав армии встать и поклясться на верность новому правительству, некоторые отделы отказались, а другие полностью распались, но подавляющее большинство из них поклялись и укрепили новое правительство Индии. Валькистская индуистская партия Махабха теперь правит народ и будет диктовать свой путь вперед."
 india.43.a: "Правительство свергнуто."

 india.45.t: "Аханд Бхарат"
 india.45.d: "Концепция "Акханд Бхарат", или "Неразделенная Индия", давно находится на периферии индийской политики. Британские чиновники и законодатели отвергли ее как невозможное, просто выдуманную теорию, которую олицетворяют неверующие, желающие начать войны. Но они были неправы. "Аханд Бхарат" - это нечто, что мы можем сделать очень реальным сегодня. Земля Неразделенной Индии разделена сейчас между многочисленными странами. Но если мы ударим по ним сейчас, и мы сильно ударим по ним, мы можем захватить землю, которая так по праву принадлежит нам. Все бывшие Радж, Афганистан, Непал, Бутан, Тибет, Бирма и Цейлон могут стать нашими. И как только мы осуществим Акханд Бхарат - как только мы продемонстрируем миру нашу истинную мощь - мы сможем занять свое место вместе с другими империями мира... и точно мы отомстим."
 india.45.a: "Пришло время неразделенной Индии."

 india.20.d: "В то время как наши силы были связаны с установлением верховенства права в некогда беззаконных районах, индейские принцы ждали их возможности, в хаосе, который последовал за выводом британцев с континента, принцы создали свои собственные военизированные силы в ряде регионов и перешли к созданию своей собственной администрации в этих регионах. Они настаивают на том, что эта администрация является лишь временной и что она будет распущена после того, как Делийская администрация соберется в первый раз."
 india.30.d: "Сегодня утром в Дели впервые состоялось официальное заседание Временного правительства. Вожди милиции , Коммунисты , Принцы и наши собственные представители провели первое из нескольких предварительных заседаний в недавно построенном здании Секретариата, которое мы выбрали для того, чтобы выступать в качестве нашего временного дома правительства, эти встречи были напряженными, и многие идеологические конфликты легли в основу предложений, выдвинутых различными представителями. Самый большой вопрос, поднятый на совещании, касался региональной автономии, особенно незаконных администраций, созданных недавно принцами ."
 india.49.d: "Сегодня утром на улицах нашей столицы возникла серьезная ситуация, когда наши полицейские, отряд ополченцев и их руководитель отказались сдать оружие после того, как полиция была информирована о том, что они запугивали мирных жителей поблизости, утверждая, что их оружие было необходимо для самообороны, эта ситуация продолжалась в течение нескольких часов, пока наше собственное руководство не вмешалось и не помешало дальнейшей эскалации ситуации."
 india.50.d: "Сегодняшнее заседание должно было продолжаться до вечера, но представители коммунистов устроили выход, за которым вскоре последовали делегации многочисленных принцев из-за разногласий по поводу автономии в нескольких провинциях."
 india.60.d: "Как и ожидалось, коммунистические делегации задерживаются на время, для того чтобы их собственные планы могли продолжаться непрерывно. Было неизвестно, что именно эти планы имели место до сегодняшнего утра. Они были хуже, чем мы ожидали, коммунисты в Калькутте создали свое собственное «Народное собрание» для управления регионом и объявили бойкот будущих встреч между нашим Временным правительством и их соперничающим правительством."
 india.70.d: "С нашей победой над англичанами в нашей борьбе за свободу многие считали, что в нашей истории был достигнут высокий уровень, когда победа над империей в много раз более мощнее, чем наша собственная нация. Эти голоса молчат в этот день, и эти слова звучат только пусто после событий последних месяцев. Несмотря на то, что первые выборы лидеров прошли много недель назад, ситуация только ухудшилась. Неспособность представителей пойти на компромисс по важным вопросам, отказ лидеров военизированных формирований отказаться от своего оружия и передать администрацию нашему правительству, а также создание отдельной Народной ассамблеи в Калькутте лишь подорвали позицию и легитимность нашего правительства в области управления Индией. Для того чтобы добавить больше топлива к пожару, князи использовали раздоры для установления своего собственного правления в ряде районов, используя свои собственные частные армии и ополчения для того, чтобы заставить местную администрацию отвечать за свое правление, слухи также сохраняются, что некоторые из этих князей по-прежнему склонны вести дела с Великобританией, даже после того, как через это прошли все наши люди. За прошедшие несколько дней эта ситуация резко ухудшилась, когда лидеры ополчения взяли под контроль над нашими собственными районами и отказались от наших собственных войск, которые, несмотря на самом деле, несмотря на то, что некоторые из них, что наши держатся на территории, несмотря на территории, что у нас, несмотря на то, что некоторые из-то и на всё, что у нас есть."
 natind.1.d: "Ситуация, с которой мы сталкиваемся, опасна, если мы можем перестать существовать все вместе, поэтому мы должны оставаться сильными и едиными. Если мы хотим объединить индийский народ под одним флагом, то мы должны обеспечить сильное руководство, в результате чего были обещаны официальные выборы в национальное правительство, и дата проведения выборов не была определена, хотя, по всей вероятности, они будут определены после того, как Индия будет в достаточной степени восстановлена, а до тех пор временное правительство будет править в одиночку."
 natind.2.d: "Создание реального правительства позволило нам начать активные усилия по реорганизации наших армий в единую армию."
 natind.3.d: "Временному правительству хорошо и хорошо требовать контроля, но это ничего не значит, если народ не повинуется нашему авторитету, и поэтому мы должны обеспечить соблюдение нашей власти, мы не можем позволить себе еще больше упасть, тогда как мы уже это сделали."
 natind.4.d: "После британского правления мы выдвинули себя в качестве авторитетного органа для всей Индии, огромной нации, наполненной различными культурами и религиями, было бы трудно сохранить единство и силу, но мы были готовы попытаться. Однако наше предложение было сокрушено замыслом принцев и милиции, прежде чем раз и навсегда разорваться на части подлыми коммунистами на Востоке. ~ ~ Это не может продолжаться долго, мы законные правители Индии и ни один предательский принц или коммунистический язычник не отнимет у нас этого!"
 natind.5.d: "Индия — это невероятно разнообразная нация, полная различных культур и религий, и теперь нам поручено решать вопрос о национальном языке. Есть только два варианта, мы можем либо пойти с хинди как напоминание о нашем культурном наследии и древних корнях до британского вторжения. Хотя это, безусловно, заслужило бы нам значительную поддержку в данный момент, по мере того как наши земли расширяются, хотя это может вызвать напряженность в основном мусульманских регионах на западе и востоке."


