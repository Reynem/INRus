 #####Events#####

 indrev.1.t: "Революция победила!"
 indrev.1.d: "По всему Раджу люди поднимаются. Британцы сражаются, чтобы ответить, и в некоторых случаях находятся в полном отступничестве. Их столица Нью-Дели окружена вооруженными бандами, а свобода для Индии кажется вполне реальной возможностью. У нас впереди долгая борьба, и многие храбрые патриоты погибнут до конца. Но пока мы будем держать британцев на заднем плане и всегда будем в отставке, мы сможем выиграть этот день. Слишком долго Британская Империя использует Индию и ее ресурсы. Она уничтожила саму цивилизацию, которую мы построили на протяжении тысячелетий, и сегодня это начало их оккупации. Сегодня навсегда ознаменует начало нашей независимости!"
 indrev.1.a: "Для свободной Индии!"
 indrev.2.t: "Победа принадлежит нам!"
 indrev.2.d: "Последние британские гарнизоны помахали белым флагом. Администрация сжигает документы, слоняясь на лодке в Цейлон. Там они надеются создать теневой орган власти, возможно, когда-нибудь, чтобы попытаться вернуть нас. Но результат сегодня ясен. Британский парламент уже вступает в переговоры, чтобы подать в суд за мир, и скоро наша борьба будет выиграна. После 200 лет жестокой оккупации иностранным угнетателем, мы наконец-то обретем свободу!"
 indrev.2.a: "Индия наконец свободна!"
 indrev.3.t: "Подходы к отключениям"
 indrev.3.d: "Британцы пришли на субконтинент массово. Силы со всех сторон империи теперь бьют и крутят нас кровью на каждом шагу, и наши опоры становятся все меньше и меньше. Наше руководство рассеяно, наши бойцы неорганизованы, и любая иностранная поддержка, которую мы когда-то покидали. Но мы продолжаем сражаться. Не потому, что мы победим, а потому, что это вечная борьба. 200 лет жестокой оккупации иностранным угнетателем привели к этому, и даже если мы проиграем сегодня, мы будем сражаться, чтобы завтра наши сыновья могли сражаться с англичанами. Да здравствует Индия."
 indrev.3.a: "Мы будем сражаться до конца!"
 indrev.11.t: "Индийские мятежники просят помощи"
 indrev.11.d: "Пока мы говорим, наши соперники в Британской империи пытаются подавить сильный бунт в своей индийской колонии, хотя технически это нарушает несколько договоров, которые мы подписали с Великобританией, к нашим дипломатам в Пондичерии обращались руководители нескольких сотрудничающих повстанческих групп, они просят нас о материальной помощи, если мы можем ее пощадить, мы могли бы помочь им нанести серьезный удар по Британской империи."
 indrev.11.a: "Враг моего врага - мой друг..."
 indrev.11.b: "Может, в следующий раз."
 indrev.12.t: "Индийские мятежники просят помощи"
 indrev.12.d: "Пока мы говорим, империалисты Британской империи борются за то, чтобы подавить сильный бунт в своей индийской колонии, среди них индейские коммунисты, которые борются за возможность создать коммунистическое государство в Южной Азии, встречаясь с некоторыми из наших оперативников в горах Центральной Азии, лидеры этих повстанческих групп просят нас о материальной и военной помощи, если мы сможем пощадить его. Если мы дадим им это, мы сможем нанести серьезный удар по Британской империи и создать лояльное коммунистическое государство в Индии."
 indrev.12.a: "Что угодно для наших товарищей."
 indrev.12.b: "Нам нечего терять."
 indrev.13.t: "Индийские мятежники просят помощи"
 indrev.13.d: "Пока мы говорим, империалисты Британской империи борются за то, чтобы подавить сильный бунт в своей индийской колонии, среди них индийские националисты, которые борются за возможность создать националистическое государство в Южной Азии, хотя наши оперативники потратили несколько подвигов на встречу с ними, лидеры этих повстанческих групп просят нас о материальной и военной помощи, если мы сможем пощадить их. Если мы дадим им это, мы могли бы помочь им нанести серьезный удар по Британской империи и создать лояльное националистическое государство в Индии. И снова, Великобритания может быть потенциальным союзником Франции в будущем..."
 indrev.13.a: "Давай ударим Империю."
 indrev.13.b: "Лучше не провоцировать Британию в это время."

 indrev.14.d: "Британская империя в настоящее время заперта в борьбе за независимость Индии, естественно, наша внешняя политика и симпатии совпадают с тем, что Британию выгоняют из Индии, хотя то, как далеко мы займемся нашей поддержкой, является еще одним вопросом, учитывая наши внутренние беды."


