 #Events
 hyd.1.t: "Рассвет старой нации"
 hyd.1.d: "Княжеское государство Хайдерабад впервые появилось в 1724 году, и его история была долгой и, возможно, все еще остается богатейшим князем во всей Индии. У нас есть огромные ресурсы, и только наша экономика может привести нас в будущее. Конечно, вещи не всегда так просты, как те, у кого есть больше денег. Мы окружены угрозами со всех сторон. Коммунисты стремятся завоевать всю Индию, и британцы могут всегда вернуться, чтобы попытаться найти свою собственную реконструкцию. Наше богатство может помочь нам найти новых друзей и союзников, хотя есть и другие предложения в нашем правительстве, которые нам, возможно, следует прислушаться. Новая Индия расколота, да, но если мы сыграем в карты, мы могли бы стать тем государством, что мы можем вернуть ее обратно."
 hyd.1.a: "Да здравствует Хайдерабад!"

 hyd.20.t: "Князские отношения"
 hyd.20.d: "Князь Хайдерабадский послал посланников в отделить нации, в том числе и наши собственные. Хотя мы больше не являемся членами одной и той же нации, они предлагают нам дипломатическую дружбу и примирение. Возможно, именно так они намерены выжить в пострайском мире, наладив дружбу и союзы, чтобы сохранить их на плаву. Некоторые в нашем правительстве утверждают, что у нас нет нужды в дружбе Хайдерабада, но гораздо больше голосовое большинство выступает за принятие посланников и отправку нескольких наших собственных взамен. В конце концов, мы все все еще братья субконтинента, и вражда нигде не добьется нас, кроме как под большим числом другой имперской державы."
 hyd.20.a: "Они наши братья, мы с ними."
 hyd.20.b: "Скажи им, что мы не ищем другого повелителя."

 hyd.21.t: "Создание Пакта о защите"
 hyd.21.d: "Посланники от наших новых друзей в Хайдарабаде вновь пришли к нам на пороге. Однако на этот раз их предложение радикально отличается. Они предлагают создать оборонительный пакт княжеских государств; пакт, который поможет друг другу в войне. Такой пакт, несомненно, будет полезен против сил, подобных индийскому народу, и их попытки провести рекогносцацию, или возможное возвращение британской или другой европейской державы. Но некоторые в нашем правительстве беспокоятся, что это лишь первый шаг на длинном и скользком склоне, который может привести нас к тому, что мы отдадим нашу вновь обретенную автономию как нацию."
 hyd.21.a: "Да, нам нужна помощь."
 hyd.21.b: "Мы можем о себе позаботиться."

 hyd.22.t: "Еще одно приглашение к княжескому пакту"
 hyd.22.d: "Хайдерабад еще раз предложил нам присоединиться к их оборонительному «Пакту Принцессы». Мы уже не говорили им ни разу, и мы были бы в пределах наших прав делать это снова. Но некоторые члены нашего правительства по-прежнему недовольны тем, что мы пересматриваем это предложение, особенно в связи с новыми глобальными событиями."
 hyd.22.a: "Мы передумали, мы присоединимся."
 hyd.22.b: "Мы уже сказали им нет!"

 hyd.122.t: "Принятие общей валюты"
 hyd.122.d: "Посланники Хайдерабада пришли к нам с довольно странным предложением. Они предлагают государствам - членам группы &quot; Принцессный пакт &quot; вместе создать общую индийскую валюту. Это, несомненно, упростит торговлю и обеспечит буфер для нашей экономики, но это фактически уступит значительную часть нашей автономии как государства. Большинство наших советников утверждают, что мы принимаем это предложение, особенно учитывая тот импульс, который оно даст нашей экономике. Но значительное меньшинство выступает против этого предложения, утверждая, что переход на общую валюту фактически ставит наше финансовое будущее в руки ряда иностранных государств, которые столь же новы для мира, как и мы."
 hyd.122.a: "Это спасет нас от многих неприятностей."
 hyd.122.b: "Без этого мы будем в порядке."

 hyd.23.t: "Создание общего рынка"
 hyd.23.d: "Похоже, что общей валюты для правительства Хайдарабада было недостаточно. Они, как и некоторые другие правительства Принцессного пакта, предложили объединиться на общем рынке. Этого не было на самом деле в мире, но означало бы прекращение всех тарифов против импорта и экспорта друг друга и, по существу, выполнение функций единого блока в мировой торговле. Находясь на общей валюте, мы, как и мы, значительно облегчили бы переход к этой системе, но многие в нашем правительстве говорят, что это слишком далеко для Пакта. Они утверждают, что мы присоединились к этому Пакту исключительно для целей национальной обороны и что формирование общего экономического рынка лишь уступит самому национальному суверенитету, с которым мы боролись за Хайдарабад и его союзников. Те, кто выступает в поддержку, утверждают, что мы являемся одним из этих союзников, и что, создав общий рынок, мы делаем лишь еще один шаг на пути к общей цели создания единого и свободного индийского союза."
 hyd.23.a: "Давайте объединим наши экономики."
 hyd.23.b: "Это не обязательно."

 hyd.24.t: "Формирование федерации"
 hyd.24.d: "Смешение эйфории и возмущения приветствовало появление последнего предложения Хайдерабада. Лидер Княжеского пакта предложил, чтобы оборонительный союз сделал шаг в направлении политического объединения. Точная идея состояла бы в том, чтобы все члены Пакта объединились в том, что по сути является индийской федерацией. Законодательный орган, состоящий из представителей каждого государства-члена, принял бы законы, касающиеся общего рынка и обороны, хотя отдельные страны были бы оставлены на свое усмотрение по вопросам внутренней значимости. Ряд наших министров, хотя они и принадлежат к меньшинству, утверждают, что присоединение к этой Федерации является самым мудрым шагом, который мы могли бы предпринять для того, чтобы приблизить на один шаг к конечной цели создания единого и свободного индийского государства. Но большинство других стран склоняется к этому предложению, чтобы наш суверенитет как государство был спорным и чтобы мы передали всю нашу власть ряду бюрократов в Хайдарабаде."
 hyd.24.a: "Пакт будет крепче!"
 hyd.24.b: "Мы не пожертвуем своей независимостью."

 hyd.25.t: "Централизация Пакта"
 hyd.25.d: "Единый законодательный орган Индийской Федерации принял предложение о ратификации всеми ее государствами-членами. Это предложение позволило бы эффективно централизовать полномочия Федерации, передавая вопросы отдельным государствам в руки законодательной власти Хайдарабада. Те, кто поддерживает это предложение в нашем правительстве, немногочисленны, но они открыто утверждают, что согласие с этим предложением является единственным способом создания единого государства, достаточно сильного для того, чтобы противостоять европейским вторжениям в будущем. Значительное большинство советников говорят, что голосование &quot; да &quot; по этой централизации разрушило бы нашу страну и лишило бы нас той автономии, которую мы еще не отдали. Если бы эта мера была ратифицирована, и княжеский пакт стал бы ничем иным, как полноценным &quot; Соединенными Штатами Индии &quot; , все, за что мы боролись бы как молодая новая нация, подверглось бы риску."
 hyd.25.a: "Мы поддерживаем это предложение."
 hyd.25.b: "Мы не сдадим нашу автономию!"

 hyd.26.t: "Воссоединение"
 hyd.26.d: "Законодательная власть Индийской Федерации только что приняла предложение, которое объединило бы все государства - члены княжеского пакта в единую, сплоченную нацию. В нашем правительстве есть много тех, кто жалуется на это решение, и кто проклинает нас за то, что мы отдали столько сил Федерации, чтобы начать с этого, но они понимают, как и все остальные, что, если не будет полного восстания, мы бессильны остановить интеграцию. Но есть и некоторые в нашем правительстве, которые, по их словам, в восторге. Это кульминация многих лет планирования и сопротивления. Единая, единая и свободная индийская федерация, которая будет править Южной Азией на все времена. Пусть империи Европы, коммунистические или националисты сломаются на нашем едином побережье. Это Индия, о которой мечтали миллионы людей, и наконец пришло время воплотить эти мечты в реальность."
 hyd.26.a: "Индия поднимется снова!"
 hyd.26.b: "Мы зашли слишком далеко, чтобы остановить это сейчас."

 hyd.100.t: "Индийская федерация"
 hyd.100.d: "Похоже, что члены нашего правительства не верят в то, что мы действительно сорвали подлинное воссоединение Индии. Но в новой Федерации нас радуют, и у нас есть новая нация. В последние несколько штатов княжеского пакта ратифицировали самый последний шаг парламента Федерации, что означает, что значительная часть Индии воссоединилась еще раз. Но сейчас все изменилось. Мы больше не управляемся прихотями единого монарха или эксплуатируемся далекой империей. Теперь мы ведем себя, как федерация государств. Именно так всегда должны были править Индия. В будущем, без сомнения, будут проблемы. Между штатами этой новой нации будут воевать и ссориться. Но мы всегда будем побеждать. Потому что, когда настоящие проблемы поднимут ее голову, когда коммунисты попытаются прийти за нами, или когда Британцы решат, что время для восстановления власти придет, мы будем готовы. И мы будем едины."
 hyd.100.a: "Да здравствует Индия!"


