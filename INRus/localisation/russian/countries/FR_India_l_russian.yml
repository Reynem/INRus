 #####Events#####

 raj.1.t: "Британский Радж"
 raj.1.d: "С 1765 года индийский субконтинент находился под контролем Британской империи. В том же году английская Ост-Индская компания завоевала землю на индийском субконтиненте и начала осуществлять повышенный контроль над индийской экономикой, начав отношения, которые, казалось бы, обречены на провал с самого начала. В течение следующих полутора веков Ост-Индская компания постепенно обеспечивала британской империи более строгий контроль над политической и правительственной системами Индии, пока она не стала еще одной британской колонией. В 1857 году широко распространенные индийские лидеры Револьта были жестоко подавлены, а прямой контроль над Индией был передан Короне. В следующем году Радж был создан в качестве британского колониального правительства во всей Индии и Бирме. В течение почти двухсот лет индийская политика характеризовалась сопротивлением британскому правлению. В 1885 году индийский национальный конгресс был основан в качестве политического движения за независимость Индии и стал главным лидером движения Индейская независимость . Первоначально лишь небольшая группа, Конгресс стал массовым движением после Великой войны, а впоследствии стал , почти 200 , , , , индийским , , , , , , , , , , индийск &"
 raj.1.a: "Мы будем терпеливы, мы должны."

 raj.2.t: "Запрет коммунистической и националистической пропаганды"
 raj.2.d: "Коммунистические и националистические крылья индийских партий независимости уже давно являются самыми откровенными. Коммунисты уже давно выступают за независимое «народное государство», в то время как националисты борются за независимую, автократическую Индию, которая будет охватывать большую часть южной части Азии. Хотя Национальный конгресс Индии уже давно является засадой на нашей стороне, эти две группы, в частности, вызывают проблемы, от протестов, парализующих нашу экономику, до вопиющих нападений на наши вооруженные силы."
 raj.2.a: "Мы должны сосредоточиться на непосредственной угрозе." #Fragment
 raj.2.b: "Запрещай их слова, запрещай им распространять их идеи." #Revolt

 raj.3.t: "Куда направить дополнительную охрану"
 raj.3.d: "С учетом предполагаемого восстания менее чем через четыре месяца наша администрация начала выделять дополнительные средства на цели безопасности. Британцы обратились к генералу-губернатору с просьбой укрепить британские активы и позиции, в основном сосредоточенные вдоль побережья. Это, безусловно, помогло бы предотвратить их попадание в руки врага в случае начала восстания. Но другие члены нашего правительства, включая руководителей полуавтономных княжеских государств, выступали за то, чтобы подкрепление было направлено на их подкрепление, которое находится главным образом в глубине страны. Это могло бы укрепить наши союзы с ними и обеспечить их преданность, если восстание принесет свои плоды. Но укрепление их позиций могло бы дать им преимущество, если они когда-либо решат пойти против нас в будущем."
 raj.3.a: "Приоритизировать обеспечение безопасности британских активов." #Revolt
 raj.3.b: "Приоритизировать обеспечение местных укреплений." #Fragment

 raj.4.t: "Снисходительное отношение к повстанцам"
 raj.4.d: "За последние два десятилетия наша администрация арестовала бесчисленное число диссидентов и лидеров движений за независимость или сопротивление, хотя эти движения не сравнивали по своим размерам и масштабам с тем, с чем мы подозреваем, что мы столкнемся в течение трех месяцев, большинство их лидеров все еще тонут в тюрьмах по всей стране. Недавнее предложение в рамках нашей системы управления предоставить некоторым из мелких преступников помилование, которое, как утверждают сторонники, помогло бы смягчить ярость, разжигающую предполагаемое восстание. Однако критики отмечают, что их освобождение может также позволить им возобновить подрывную деятельность, как только кризис закончится."
 raj.4.a: "Дайте им помилование." #Fragment
 raj.4.b: "Они в тюрьме не просто так." #Revolt

 raj.5.t: "Власть для местной милиции"
 raj.5.d: "В наше правительство поступило чрезвычайно спорное предложение, которое, как утверждают, позволило бы остановить восстание, прежде чем оно может начаться во многих регионах. Некоторые из наших министров предлагают предоставить власть, поставки и автономию местным ополчениям, главным образом тем, которые будут защищать княжеские государства. Они утверждают, что это остановит восстание, прежде чем оно даже может начаться во многих регионах. Они утверждают, что небританские вооруженные силы будут выглядеть менее угрожающими и более способными удержать население от насилия. Однако весьма очевидный недостаток в этом состоит в том, что, как только мы дадим этим милитам эту власть, мы никогда не сможем убрать ее без борьбы. Давая им эту автономию, они теперь могут разорвать всю нашу страну на куски в будущем."
 raj.5.a: "Дай им власть надавить на мятежников." #Fragment
 raj.5.b: "У нас не будет нерегулируемых вооруженных формирований, которые будут работать по всей стране." #Revolt

 raj.6.t: "Помощь со стороны Великобритании"
 raj.6.d: "Хотя британские адмиралты с самого начала сомневались в наших разведывательных сообщениях о предполагаемом восстании, их министры, как представляется, наконец-то признали опасность, с которой мы сталкиваемся, и предложили нам помощь в виде поставок и солдат. В то время как принятие поставок является определенным, принятие британских солдат является более спорным делом. Многие в нашем правительстве стремятся принять британские войска и отстаивать их за размещение в различных подозрительных точках по всей стране. Другие же призывают к предостережению, предупреждая о том, что привлечение большего числа британских солдат лишь будет способствовать делу восстания. Конечно, дополнительные солдаты могут стать разницей между победой и поражением через несколько недель. Это не решение, которое мы можем принять легко."
 raj.6.a: "Попроси о военной помощи, она нам отчаянно нужна." #Revolt
 raj.6.b: "Люди уже ненавидят нас." #Fragment

 raj.7.t: "День расплаты"
 raj.7.d: "В тот день, когда наши агенты разведки сказали нам об этом шесть месяцев назад, все в правительстве стоят рядом со своими радиостанциями, ожидая с унылым дыханием новостей из сельской местности, восстали ли повстанцы и захватили ли склады оружия?"
 raj.7.a: "Тут тихо..."

 raj.8.t: "Успокойся на улицах"
 raj.8.d: "Улицы спокойны. Люди в мире. Несмотря на то, что наши разведданные показали, что сегодня во всем Радже начнется массовое восстание, кажется, что оно было полностью ошибочным, что или мы смогли успешно смягчить его полностью. Некоторые очень мелкие банды взяли оружие в отдаленных деревнях по всей сельской местности, но они были сброшены даже сейчас без каких-либо вопросов и не будут угрожать нам ни в коем случае. Хотя это и является причиной для большого празднования в Дели, некоторые выражают предостережение. Чтобы подорвать предполагаемое насилие, мы были вынуждены предоставить огромное количество уступок потенциальным повстанцам и их лидерам. Хотя они, возможно, и не восстанут в вооруженном восстании, они могут очень скоро создать для нас очень серьезную проблему."
 raj.8.a: "Мы хорошо справились."

 raj.9.t: "Маленькое восстание"
 raj.9.d: "Похоже, что наши разведданные были верны о восстании, но весьма далеки от оценки его серьезности. Повстанцы, с которыми мы сталкиваемся сегодня, плохо оснащены, недоедают, мало и далеко друг от друга. Однако они не могут восприниматься легкомысленно. Они смогли обезопасить обширную территорию от Калькутты до Афганистана, и хотя они могут быть слабыми, они в состоянии осадить столицу Нью-Дели. Хотя надежды на нашу быструю победу высоки, мы не можем недооценивать нашего врага."
 raj.9.a: "Давайте покончим с этим раз и навсегда."
 raj.9.b: "Свобода для Индии!"

 raj.10.t: "Повсюду в Индии"
 raj.10.d: "Похоже, что наши разведданные были верны в отношении восстания, но, к счастью, они рассчитали его серьезность. Повстанцы, с которыми мы сталкиваемся сегодня, плохо оснащены, и мало, и далеко от него. И все же их нельзя легко воспринимать. Они смогли обезопасить обширную полосу территории от Калькутты до Афганистана, и, хотя они могут быть слабыми, они в состоянии осадить столицу Нью-Дели. Несмотря на хорошие надежды на нашу победу, мы не можем недооценивать нашего врага."
 raj.10.a: "Мы победим."
 raj.10.b: "Свобода для Индии!"

 raj.11.t: "Существенное восстание по всей Индии"
 raj.11.d: "Похоже, что наши разведданные были правы в отношении восстания, как в его времени, так и в его суровости. Повстанцы, с которыми мы сталкиваемся сегодня, плохо оснащены, но их число велико; они не должны восприниматься легко; если у нас есть шанс, они могут свергнуть все, что мы пытались построить здесь. Они смогли обезопасить обширную полосу территории от Калькутты до Афганистана, и они в состоянии осадить столицу Нью-Дели. Мы не можем позволить себе недооценивать нашего врага; эта борьба будет для самого будущего Раджа."
 raj.11.a: "Для Империи!"
 raj.11.b: "Свобода для Индии!"

 raj.12.t: "Крупнейшее восстание по всей Индии"
 raj.12.d: "Восстание хуже, чем мы могли ожидать. Повстанцы хорошо оснащены и многочисленны, иногда напоминают иностранную армию больше, чем целую группу фермеров и уличных урн. Они в состоянии свергнуть все, что мы пытались построить здесь, если у них есть шанс. Они завоевали огромное количество территории от Калькутты до Афганистана и находятся в процессе сегрегации столицы Нью-Дели. Нам понадобится вся помощь, которую мы можем получить от остальной части Империи; эта борьба для самого будущего Раджа... и мы не знаем, сможем ли мы выиграть."
 raj.12.a: "Да поможет нам Бог."
 raj.12.b: "Свобода для Индии!"

 raj.13.t: "Массовое восстание через Радж"
 raj.13.d: "Это восстание гораздо хуже, чем мы могли ожидать. Похоже, что все население Раджа восстало против нас. Повстанцы от Калькутты до Транвакора поднялись и захватили военные базы, городские центры и порты. От пустой деревни до переполненных городских центров, их послание одно и то же. Они намерены полностью и без сомнения победить наши силы и заставить нас и наших британских коллег в море. Мы сейчас боремся за само существование Раджа, и, возможно, это не будет борьбой, которую мы можем выиграть."
 raj.13.a: "Это конец Раджа."
 raj.13.b: "Свобода для Индии!"

 raj.20.t: "Наши активы в Бирме"
 raj.20.d: "Вооруженные повстанцы захватили огромные территории, и, хотя администрация Раджа делает все возможное для того, чтобы с нашей помощью контролировать ущерб, совершенно очевидно, что они не смогут защитить все необходимое, наши силы в состоянии быстро и решительно передвигаться в джунгли Бирмы и обезопасить колонию под нашей оккупацией до того, как индийские повстанцы смогут начать бесконечную партизанскую войну в своей среде."
 raj.20.a: "Немедленно оккупируем Бирму!"

 raj.21.t: "Британия Оккупирует Бирму"
 raj.21.d: "Британские силы, выезжающие из Майальсии и Британской Ист-Индии, оккупировали Бирму, которую Радж получил много лет назад."
 raj.21.a: "Они делают то, что должны."

 raj.22.t: "Индийский револьт"
 raj.22.d: "Беспрецедентные экономические трудности, массовая гибель людей в результате Великой войны, частый голод и плохое управление, которые привели к резкому росту радикализации, в конечном итоге привели к массовому восстанию, подобного которому не было замечено на субконтиненте со времен восстания Сепоя 80 лет назад. Несмотря на то, что массовое восстание в Индии плохо организовано и состоит из десятков отдельных группировок, которые работают в рамках относительного сотрудничества друг с другом, но под землей существуют огромные внутренние разногласия, которые, несомненно, уничтожат Объединенный фронт, когда не останется ни одного иностранца, который должен будет сражаться. В то время как вопрос о вмешательстве оказался спорным в парламенте, причем как либералы, так и яичники по обе стороны этого вопроса спорят об их позициях. Полное оставление Индии не подлежит сомнению, и поэтому мы должны сделать выбор."
 raj.22.a: "Мы должны направить все силы нашего достояния на обеспечение безопасности Индии!"
 raj.22.b: "Индия на протяжении многих лет гибнет прибыль, и мы пошлем ограниченную силу."

 raj.23.t: "Парламент голосует за полное вмешательство"
 raj.23.d: "После долгих обсуждений в Лондоне и дальнейшего хаоса в индийском субконтиненте, мы сказали, что Бритш будет военным"used to the fullest possible extent in order to quell and suppress the rebel forces and capture their leadership". We expect the first British troops to be landing within days, however we cannot expect any help from the other member-states of the Empire, at least not by military means."
 raj.23.a: "Приближается подкрепление!"

 raj.24.t: "Парламент голосует за ограниченное вмешательство"
 raj.24.d: "Не осознавая серьезности ситуации, складывающейся здесь, в Индии, британский парламент в Лондоне проголосовал за разрешение ограниченного военного вмешательства в этот индийский револьт."relief" being sent is a meagre stimulus to our collapsed economy and confused military structure. Still, we must make do with what we have."
 raj.24.a: "Что?"

 raj.30.t: "Планы револьта"
 raj.30.d: "Сегодня наши сотрудники разведки пришли к нашему правительству с чрезвычайно тревожными новостями. Согласно им, внутренние круги индийского коммунистического и националистического движений, а также лидеры нескольких движений за независимость закладывают основу для широкомасштабного восстания, аналогичного индийскому револьту 1857 года. Запланированные акты насилия должны начаться через четыре-восемь месяцев, и, как представляется, прямо сейчас эти лидеры не знают, что наша аммистрация известна. В правительстве есть нерешительность в отношении того, как подходить к этому вопросу. Некоторые министры выступают за немедленное задержание лидеров этих движений, но другие утверждают, что их подавление приведет лишь к дальнейшим волнениям, и вместо этого мы утверждаем, что мы должны немедленно привести их к столу переговоров. Лондон до сих пор молчал по этому вопросу."
 raj.30.a: "У нас есть четыре месяца, чтобы подготовиться."

 raj.31.t: "Револьт побежден!"
 raj.31.d: "Последний из индийских мятежников сдался. Револьт, который разорил Радж и уничтожил бесчисленное количество фунтов инфраструктуры, наконец-то закончился; хотя некоторые повстанцы продолжают тянуться в небольших укреплений в сельской местности, они больше не представляют угрозы для наших городов и будут устранены в надлежащее время; хотя мы были вынуждены пойти на жертвы, ведущие к Револьту, чтобы подготовиться к нему и смягчить его последствия, они, как представляется, в конечном итоге окупились; хотя ответные действия этих решений, возможно, еще не укусили нас, сейчас настало время восстановиться и оправиться от ущерба, причиненного недавними боевыми действиями."
 raj.31.a: "Империя снова восторжествует!"

 raj.32.t: "Рейс в Цейлон"
 raj.32.d: "Револьт намного сильнее, чем мы могли себе представить. В то время как войска со стороны Империи плывут через море даже сейчас, чтобы помочь нам, они могут прийти слишком поздно. Мы потеряли многие наши военные объекты через субконтинент, и повстанцы получают больше последователей с каждым городом, который они взяли из-под нашего контроля. Наши военные лидеры отчаянны сейчас и убеждены, что у нас нет другого выбора, кроме как покинуть Радж и бежать в Цейлон. Хотя парламент в Лондоне не хочет покидать свою крупнейшую колонию, они предложили нам контроль над островом, если мы примем этот план действий. Конечно, ни Лондон, ни наши лидеры не ожидают, что полет в Цейлон будет постоянным; мы вернемся в силу, как только парламент будет готов вновь захватить Индию. Однако есть вероятность, что они никогда не примут решение разрешить нашу реконкурсию, и в этом случае все, над чем мы работали до сих пор, будет напрасно, и, возможно, нам было бы лучше умереть здесь, в нашей последней позиции."
 raj.32.a: "Вытащите нас отсюда!"
 raj.32.b: "Нет, мы будем сражаться до конца!"

 raj.33.t: "Радж просит объявить войну"
 raj.33.d: "Правительство изгнания британского Раджа в Цейлоне обратилось к нашему правительству с просьбой объявить состояние войны между Соединенным Королевством и государствами-побегами, которые захватили индийский субконтинент в нашем отсутствие. Хотя общее заявление обычно означало бы мало или меньше, это могло бы поставить под угрозу наше положение в регионе и забрать у нас то, что осталось от нас, кроме того, многие в нашей администрации считают, что оказание помощи неудавшемуся государству, которое стало Раджом, просто втянуло бы нас в продолжительную войну, которую мы не можем себе позволить."
 raj.33.a: "Жемчужина снова будет нашей."
 raj.33.b: "Они уже однажды потеряли Индию."

 raj.40.t: "Возвращение к миру"
 raj.40.d: "Руины некоторых зданий все еще сгореют. Наземные мины все еще находятся в ожидании взрыва, пока фермеры нападут на них, и бомбы британских военно-воздушных сил по-прежнему остаются неразорванными в отдаленных лесах и деревнях. Но борьба закончилась. Радж все еще остается сильным. Несмотря на то, что угрозы сохраняются на наших границах. Британская империя показала, что нам все равно мало и меньше, что попытка Револьта привела к разрушению и сожжению мировой экономики, и лидеры Револьта все еще уклоняются от нас. Значительное число советников в нашей администрации требуют, чтобы мы нарушили гражданские права и свободы, поскольку они существуют в настоящее время в стране, пока мы не сможем задержать крупных лидеров. Но другие, возможно, более мудрые, предполагают, что наилучший способ восстановления и предотвращения другого Револьта, возможно, будет продолжаться, как никогда раньше. Это может означать, что мы никогда не поймаем этих лидеров, но это также может означать, что мы не будем продолжать разжигать страсти сельской местности. Мы должны выбрать мудро, даже если мы победили, возможно, наша страна более хрупка, чем когда-либо."
 raj.40.a: "Это лучший способ восстановиться."
 raj.40.b: "Всё кончено."

 raj.41.t: "Разрыв"
 raj.41.d: "В интересах сохранения мира, который мы одержали, наше правительство приняло ряд мер, направленных на ограничение прав и свобод народа Раджа до тех пор, пока не будут пойманы великие лидеры неудавшегося восстания. С этого момента речь с критикой правления Раджа каким-либо образом запрещена, что карается лишением свободы без освобождения. Частным гражданам больше не разрешается владеть огнестрельным оружием, и они должны сразу же передать его нашим войскам. Города также сейчас оккупированы британской индийской армией. Протесты любого рода запрещены. Британцы сами в основном молчали по этому вопросу, но их дипломаты в частном порядке сказали нам, что эти действия неприемлемы. Но нам больше не нужно слушать их жалобы. Они не положили конец восстанию - мы это сделали. И мы решим, как это сделать, чтобы это больше не повторилось."
 raj.41.a: "Они могут получить свои свободы, как только преступники будут пойманы."

 raj.42.t: "Охота на людей"
 raj.42.d: "Пока все лидеры неудавшегося Револьта остаются на свободе, мы рискуем вторым восстанием. Британцы уже продемонстрировали нам, что они не хотят помогать подавить еще один мятеж, особенно один из тех масштабов, которые мы только что пережили. К сожалению, наш поиск этих пропавших без вести лидеров остается непродуктивным. Они используют преданных людей в сельской местности, а также чрезвычайно сельскую природу страны за пределами городов, чтобы спрятаться. Если у нас есть надежда найти их, мы должны начать полномасштабную охоту. Развербовать солдат в отдаленные деревни. Сельские жители Брибе для информации."
 raj.42.a: "Мы не отдохнем, пока они не окажутся за решеткой!"

 raj.43.t: "Повстанческие лидеры захвачены"
 raj.43.d: "Сегодня мы получили новости о том, что оставшиеся лидеры покушенных на мятеж лидеров были захвачены в сельской местности. Согласно сообщениям, они были замаскированы как крестьяне в Бенгале, вероятно, надеясь объединиться с индийскими коммунистами, которые, по некоторым сообщениям, скрываются здесь. Независимо от того, является ли угроза индийских коммунистов реальной или нет, лидеры самого недавнего Револьта находятся под нашей стражей. Многие хотят, чтобы их судили перед всей нацией, передавали по радио в качестве спектакля. Однако горстка предлагает, чтобы мы держали любые испытания вне общественного света, с тем чтобы залечить наши недавние раны."
 raj.43.a: "Не нужно делать это публичным делом."
 raj.43.b: "Давайте начнем испытание века."

 raj.44.t: "Судьба века"
 raj.44.d: "Повстанческие лидеры, которых мы захватили, предстали перед судом на этой неделе в Нью-Дели. Огромная толпа людей собралась за пределами здания суда, и армия была доставлена для поддержания мира. Индейцы по всей стране также слушали по радио, когда государство предоставляло огромное количество доказательств против обвиняемых. Результаты, конечно же, предопределены, но лидеры мятежников по-прежнему пользуются защитой. Они использовали большую часть этого времени против нашей судебной системы и руководства Раджа. В один момент судья суда приказал им связывать и заткнуться, чтобы они не помешали судебному разбирательству. Судебный процесс также привлек ряд иностранных корреспондентов и, как представляется, привлек внимание по всему миру. Наши повелители в Лондоне направили нам послания, призывающие не допустить суда в глазах общественности, но мы до сих пор и будем продолжать игнорировать их. Справедливость должна быть отдана."
 raj.44.a: "Какое шоу!"

 raj.45.t: "Повстанческие лидеры осуждены"
 raj.45.d: "В удивлении абсолютно никому, все лидеры мятежников были признаны виновными нашей судебной системой и теперь подлежат наказанию. Некоторые члены нашего правительства говорят, что мы должны буквально закончить суд столетия с взбучкой и казнить лидеров, чтобы послать последнее послание тем, кто будет нас бросать вызов в будущем. Менее вокальная горстка советников говорит, что мы должны предложить помилование - не полное освобождение, а, возможно, более мягкое тюремное заключение с возможностью будущего условно-досрочного освобождения. Это послужило бы сигналом о примирении, но мы должны решить, действительно ли нам это нужно в данный момент."
 raj.45.a: "Они предатели, но помилование должно быть даровано."
 raj.45.b: "Они предатели, а наказание за измену - смерть."

 raj.46.t: "Протесты против вынесения приговора"
 raj.46.d: "С новостями о казни бывших лидеров по всей стране, протесты поднимаются в городах по всему Раджу. Они требуют реформ судебной системы и называют недавний суд над этими лидерами не более чем обманом. Хотя для нас, очевидно, слишком поздно прощать этих лидеров, некоторые члены нашего правительства предлагают нам прислушиваться к их словам и смотреть на реформы. По крайней мере, они утверждают, что протесты должны продолжаться до тех пор, пока они не начнут действовать сами по себе. Однако все наши советники выступают за иной подход. Они говорят, что если оставить эти протесты так, как они будут беспочвенно зашивать больше хаоса в наших городах в то время, когда мы нуждаемся в мире и стабильности. Они спорят о том, что они сломают эти протесты, прежде чем они могут стать слишком большими. Все во имя сохранения мира, конечно."
 raj.46.a: "Это входит в их право на протест."
 raj.46.b: "Мир и протесты не могут сосуществовать."

 raj.47.t: "Возмездие"
 raj.47.d: "Протесты против приговоров, вынесенных лидерам покушенного восстания, были сокрушены, мы арестовали и предъявили обвинения сотням, если не тысячам, заговорщиков, хотя наш первоначальный план заключался в том, чтобы снять ограничения в отношении гражданских прав после того, как лидеры мятежников были захвачены и казнены, это больше не представляется возможным. Если мы хотим, чтобы подобное никогда не повторилось, то эти ограничения станут новой нормой. Наша администрация не может и не будет подвергнута сомнению, и любая попытка сделать это приведет к немедленной и жесткой ответной реакции. Мы проясним, что мы здесь в ответе и что даже сама мысль о восстании против нас будет встречена с самыми жестокими наказаниями."
 raj.47.a: "Да здравствует британский Радж!"

 raj.50.t: "Разговоры о нерешительности"
 raj.50.d: "Крупные политические группы, многие из которых мы предоставили автономию, готовясь к недавнему революционному угоду, собираются в массовом порядке."
 raj.50.a: "Разве мы не прошли через это?"

 raj.51.t: "Коммунисты провозглашают независимость"
 raj.51.d: "Сегодня лидеры Индейской коммунистической партии в Бенгале опубликовали официальное "заявление о независимости" от Британского Раджа, они выдвинули претензии на всю нашу территорию, заявив, что они являются подлинным правительством Индии, хотя они расположены только на северо-востоке страны. В то время как у них много преданных последователей и они могут опираться на затяжные военные усилия, почти все члены нашего правительства уверены в нашей способности уничтожить их."
 raj.51.a: "Мы покажем им, что происходит с предателями!"
 raj.51.b: "Слава Народному Фронту!"

 raj.52.t: "Хайдерабад и Пенджаб провозглашают независимость"
 raj.52.d: "Несмотря на то, что нас отвлекала ситуация в Бенгалии, в настоящее время в Хайдарабаде и Пенджабе в качестве предателя объявили независимость от Британского Раджа, хотя ни один из них не претендовал на независимость всего субконтинента, как это сделал Народный фронт. В то время как Пенджаб является в основном горным, бесплодным районом на северо-западе, Хайдарабад является одним из крупнейших и самых могущественных княжеских государств в стране. Их отделение наносит непоправимый ущерб. Наши планы по свертыванию коммунистического мятежа в Бенгале должны подождать. Нам нужно определить наши действия с этими новыми предателями."
 raj.52.a: "В конце концов, мы дали им слишком много автономии."
 raj.52.b: "Слава Хайдерабаду!"
 raj.52.c: "Слава Пенджабу!"

 raj.53.t: "Бомбей и Раджастан провозглашают независимость"
 raj.53.d: "Сегодня повстанцы как в Бомбее, так и в Раджахстане объявили независимость от Раджа, что еще больше подрывает нашу позицию."
 raj.53.a: "Этого не должно было случиться."
 raj.53.b: "Слава Бомбею!"
 raj.53.c: "Слава Раджастану!"

 raj.54.t: "Орисса провозглашает независимость"
 raj.54.d: "Еще одно повстанческое государство провозгласило независимость от Раджа сегодня, на этот раз в Ориссе. Все больше и больше людей быстро покидают наше правление, и мы внезапно оказались на очень шаткой земле. Наша единственная оставшаяся властная база находится на юге страны, и если там поднимется больше мятежников, мы сможем реально увидеть конец британского Раджа как государства. Лондон отказывается направить больше солдат по нашему пути до тех пор, пока ситуация не станет яснее, что означает, что мы вдруг сами решим, как справиться с этим кризисом."
 raj.54.a: "Остановите их!"
 raj.54.b: "Слава Ориссе!"

 raj.55.t: "Коллапсы Раджа"
 raj.55.d: "Сегодня еще пять притворяющихся государств объявили независимость от Раджа, все при поддержке крупных независимых боевиков и финансирования безопасности, теперь ясно, что мы совершили ужасную ошибку, пытаясь смягчить последствия восстания, пытаясь в конечном счете не больше, чем горстка боевиков, мы отказались от любого контроля над субконтинентом, который мы все еще сохраняли."
 raj.55.a: "Это конец Раджа."
 raj.55.b: "Слава Белуджистану!"
 raj.55.c: "Слава Майзору!"
 raj.55.d: "Слава Мадрасу!"
 raj.55.e: "Слава Транвакору!"
 raj.55.f: "Слава Бихару!"

 raj.56.t: "Конец британского Раджа"
 raj.56.d: "Лидеры нашей администрации покидают столицу любым способом, как они могут. Дым поднимается из правительственных офисов по мере сожжения документов. Любимые остаются позади, и те, кто решает остаться в курсе того, что им грозит преследование, возможно, смерть. Лондон установил то, что по сути представляет собой "радж в изгнании" в Цейлоне, хотя маленький остров практически не стоит на пути народа или не имеет возвратов. Временное индийское правительство, возглавляемое националистическим крылом Индийского национального конгресса, восстало в Нью-Дели и вокруг нее, претендуя на контроль над всей Индией, но крайне маловероятно, что они когда-либо смогут вновь объединить континент. Мы вынуждены покинуть континент, зная, что наша неудача разрушила величайшую колонию в британской истории. Наше будущее неопределено, наше прошлое - трагедия."
 raj.56.a: "Это начало конца Британской империи."
 raj.56.b: "Слава Индии!"
 raj.56.c: "Слава Кашмиру!"

 raj.60.t: "Наше неспокойное будущее"
 raj.60.d: "Штормовые облака индийского револьта уже позади, но это не означает, что наше будущее будет более добрым. Радж сталкивается с беспрецедентными уровнями недовольства, и автономия, которую мы предоставили местным движениям, чтобы избежать Револьта, оказывается неприятной, чтобы отнять. Британцы продолжают питаться от нас, чтобы подпитывать свои имперские усилия за рубежом, и значительная часть населения, включая некоторых членов нашей собственной администрации, полностью поддерживает полную и полную независимость от Лондона. Навигация этих предстоящих испытаний и бедствий будет нелегкой задачей. Наша нация может сломаться до конца десятилетия. Но мы уже пережили одну катастрофу. Мы можем пережить другую."
 raj.60.a: "Мы будем работать с англичанами."
 raj.60.b: "Мы не отдохнем, пока не обретем независимость."

 raj.80.t: "Статус британской индийской армии"
 raj.80.d: "Британская индийская армия уже давно является инструментом, используемым британией для того, чтобы держать свою индийскую колонию в состоянии сатисфакции; формально, став армию под командование индийских офицеров, британцы могут использовать армию для подавления волнений в Радже, не выдавая себя за враждующую силу. Однако, с недавним революцией, мы, возможно, захотим пересмотреть, как именно используется эта армия. Некоторые представители нашей администрации утверждают, что она продолжает использоваться в качестве номинальной индийской армии, некоторые идут настолько далеко, что нам кажется, что мы полностью отдадим ее под контроль индийских офицеров. Другие же полагают, что она была бы гораздо более полезной, если бы она была превращена в полностью британскую оккупационную силу."
 raj.80.a: "Сохранять контроль над Индией"
 raj.80.b: "Увеличить участие Великобритании"

 raj.81.t: "Состояние нашей промышленности"
 raj.81.d: "Индустрия нашей страны была разрушена европейцами на протяжении многих лет. Британцы, с помощью своей Ост-Индской компании, на протяжении более ста лет поработили наши фабрики и производство на своих рынках, и как таковые, то, что мы делаем для того, чтобы покинуть нашу страну, и наш народ остается позади. Если наша конечная цель состоит в том, чтобы оживить нашу промышленность и заставить ее работать на наших людей, а не на тех, кто вернулся в Европу, нам предстоит проделать большую работу, чтобы начать оживление нашей промышленности и вернуть то, что по праву принадлежит нам."
 raj.81.a: "Похоже, у нас много работы."

 raj.82.t: "Наследие Ост-Индской компании"
 raj.82.d: "На протяжении веков мы были всего лишь игрой для чудовищной экономики Британской империи. Мы поставляем хлопок для домовых островов, и богатство, которое вытекает из нашей страны, часто выстраивается из карманов британских людей в Европе. Наследие Ост-Индской компании будет определено тем, что она сделала с нами. Через него британцы по существу выкупили нашу страну и использовали ее, чтобы подавить нас на протяжении почти 200 лет. Теперь, когда мы оправляемся от наших недавних сражений и начинаем намечать новый путь вперед, мы должны вновь эвакуировать наследие ЕИК и решить, что делать с шрамами, которые она оставила на нашей стране."
 raj.82.a: "Мы должны принять решение о том, принять или отвергнуть это наследие."

 raj.83.t: "Наша индустрия улучшается"
 raj.83.d: "Вся наша трудовая работа за последние несколько месяцев наконец-то начинает приносить свои плоды. Наша индустрия вновь находится под нашим контролем, и, хотя нам еще предстоит проделать большую работу, чтобы полностью преодолеть ущерб, который британцы нанесли на протяжении веков, просто производство индийских товаров для индийского народа вызвало у нас новое волнение, когда мы создаём нашу новую нацию."
 raj.83.a: "Да здравствует Индия!"

 raj.84.t: "Радж просит возмещения"
 raj.84.d: "Сегодня наши дипломаты в Британском Радже получили странную просьбу. Правительство Раджа просит у нас возмещения за «полторавековое британское подавление и захват индийской промышленности». Они, конечно же, ссылаются на Ост-Индскую компанию, которая функционально не более, но которая помогла нам укрепить контроль над индийским субконтинентом сто лет назад. Репарации, которые они просят, огромны, но, по всей вероятности, они не ожидают от нас согласия. Тем не менее, может стоит послать немного денег, чтобы успокоить их. Мы никогда не делали ничего плохого, конечно, но это небольшая цена, чтобы удержать их от восстания снова."
 raj.84.a: "Мы разберемся с деталями через несколько лет."

 raj.85.t: "Переход к доминированию"
 raj.85.d: "На улицах царит радостный дух. Всякие парады людей заполняют улицы и бульвары каждого крупного города, от Дакки до Карачи. Индусы и мусульмане празднуют как новый флаг нового Доминиона Индии. Мы поднялись над каждым зданием страны. Конечно, для каждого десятого народа, празднующего индуистскую или мусульманскую националистическую традицию, был один индуист, или один британский оппортунист, который продолжает хвалиться особенностями независимости и новыми нациями - или их отсутствием, - который украсил бы карты Южной Азии. Но прежде всего, есть общая нить: мы выиграли. Мы заставили величайшую империю в мире присоединиться к нам. Сама нация, которая однажды разрушила все, что индийское общество построило на протяжении тысячелетий, теперь была вынуждена поклониться и предоставить ей суверенитет, которого она так отчаянно заслуживает. Репортеры из всех крупных стран Нью-Дели отчаянно хотят получить цитаты от официальных лиц и граждан. Действительно, мир наблюдает и ждет, как мы подходим и преодолеем стоящие перед нами испытания и беды. Но сейчас нам нужно только беспокоиться - и празднть - одно: Доминирование."
 raj.85.a: "Да здравствует Доминион Индии!"

 raj.86.t: "Радж требует независимости"
 raj.86.d: "Сегодня к нашему министерству иностранных дел пришли требования от лидеров различных индийских движений в Британском Радже; все они одинаковы; они требуют независимости и признания суверенного индийского государства; Радж будет распущен, и наше колониальное присутствие в Южной Азии будет ограничено только Цейлоном и Бирмой; они предупреждают нас о том, что продолжающаяся оккупация субконтинента является неустойчивой и что восстание, которое было запланировано на 1936 год, будет лишь вкусом недовольства, если мы останемся. Приложенные записки нашей администрации в колонии подтверждают, что это не пустые угрозы. Управление Раджом стало чрезвычайно трудным, и большинство из тех, кто в нем работает, согласны с тем, что политическая независимость является наилучшим способом избежать дальнейшего смущения. Очень небольшое меньшинство (по сути, один министр) говорит, что мы должны вторгнуться в страну должным образом и понизить эту независимость во благо. Но это губительная политика, и это только еще больше ранит нас. Лучший шаг - это дать парламенту дать им путь к неустойчивости. Да поможет нам Бог всем."
 raj.86.a: "Время пришло, давай отпустим их."
 raj.86.b: "Хватит этой ерунды, они будут раздавлены."

 raj.87.t: "Парламент дает нам путь к независимости"
 raj.87.d: "Фантастические новости дошли до нас из Лондона. Наши дипломаты в восторге, потому что парламент дал нам путь к национальной и политической независимости. Всякое празднование этого решения было недолговечным в Радже. У индийского народа все еще есть ряд обручей, которые Лондон счел подходящими для того, чтобы заставить их прыгнуть, прежде чем они смогут полностью заявить о своей независимости. Британцы очень ясно заявляют, что это их собственное решение, принятое по доброте их имперских сердец, возможно, для спасения лица. Это не имеет значения сейчас. Что сейчас имеет значение - это переговоры по условиям их ухода и начало переговоров между индийским народом, чтобы определить, как будет выглядеть новая нация. Уже ведутся разговоры и разногласия по поводу разделения страны между индуистами и мусульманами. Но одно ясно, что независимость придет. Вопрос сейчас вопрос заключается в том, как долго это займет."
 raj.87.a: "Мы почти на месте."

 raj.90.t: "Лорд Линлитго приезжает в Индию" #April 1936
 raj.90.d: "Лорд Виктор Александер Джон Хоуп, второй арк Линлитгоу, прибыл сегодня на корабле в Бомбей. Линлитго был назначен британским правительством, чтобы занять эту должность после того, как лорд Уиллингдон ушел в отставку в конце прошлого года, но не симулировал покинуть Англию до недавнего времени. Линлитго служил на кабелях, которые в прошлом году разрабатывали неправильный и неудачный закон об индейцах, так что почему он был избран новым вице-королём колонии, это выше понимания нынешней администрации. Однако с его прибытием нынешний руководящий совет становится более ограниченным по своим полномочиям. Если мы хотим избежать надвигающегося Револьта, мы не будем обижать его, так как его корабль причаливает в гавани и он впервые попадает в Индию, лучшее, на что мы можем надеяться от Линлитго, это то, что он серьезно относится к нынешней угрозе."
 raj.90.a: "Тебе нужно работать, Вице-рой."

 raj.91.t: "Партии независимости Индии выигрывают провинциальные выборы" #1937, sometime after end of Revolt
 raj.91.d: "В то время как выборы были отложены из-за Револьта, с которым мы столкнулись, и в конечном итоге потерпели поражение, правительство лорда Линлитгоу смогло объявить и провести выборы в индийский законодательный орган, в основном элитарный орган с незначительной реальной властью. Поэтому это было с полным удивлением, что правительство получило от всей страны результаты, описывающие резкое увеличение поддержки различных партий индийской независимости, которые откололись от старого индийского национального конгресса и которые долгое время настаивали на дальнейшем суверенитете и автономии Индии. Лорд Линлитгоу лично заявил, что он рассматривает этот результат как пощечину в лицо; похоже, что отказ от Револьта не заглушил призывы к более радикальным изменениям со стороны населения. В то время как некоторые представители нашей администрации призывали нас обратиться к Лондону с петицией о лишении законодательной власти, которой он обладает, и это могло бы лишь создать проблемы там, где в настоящее время существует мало. Нам просто придется принять более значительное политическое влияние Индии, как оно есть."
 raj.91.a: "Они просто никогда не уходят, не так ли?"

 raj.100.t: "Радж просит путь к статусу Доминион"
 raj.100.d: "Делегаты из Британского Раджа прибыли сегодня в Лондон с довольно странным запросом, они обратились к нашему правительству с просьбой предоставить Раджу путь к доминиону, как и доминантам Канады, Южной Африки, Австралии и Новой Зеландии. В прошлом это было бы незаметно: Радж всегда существовал исключительно для нашей эксплуатации, хотя мы, конечно, этого не сделали. Однако ситуация в этом направлении вышла из-под контроля в последние годы. Запланированное восстание и распад страны оставили в парламенте и в наших министерствах много интересующихся, остается ли возможным сохранить удушье на субконтиненте. Радж, скорее всего, понадобилось бы годы, чтобы удовлетворить все требования к доминиону, предложенные нашими министерствами, но даже предложение предоставить стране эту большую автономию, если бы у нее было много прав на руках. Индия остается «ювелиром Империи» по причине того, что мы готовы отказаться от столь большой части нашей власти в тот момент, когда это никогда не было сделано в британской истории. Все это было бы гораздо хуже для нашего имиджа - как на национальном, так и на международном уровне, если бы мы могли потерять все это дело."
 raj.100.a: "Мы наставим их на прямой путь."
 raj.100.b: "Это не обсуждается."

 raj.101.t: "Британия удовлетворяет нашу просьбу"
 raj.101.d: "Никто в нашем правительстве не ожидал, что Лондон даст нам путь к Доминиону, поэтому, когда новости дошли до Нью-Дели, все были шокированы."
 raj.101.a: "Тогда давайте начнем!"

 raj.102.t: "Британия отвергает нашу просьбу"
 raj.102.d: "Никто в нашем правительстве не ожидал, что Лондон даст нам путь к Доминиону, поэтому неудивительно, что новости дошли до Нью-Дели."
 raj.102.a: "Типично."

 raj.103.t: "Комиссия по вопросам переходного периода Раджа"
 raj.103.d: "Перевод британского Раджа из колонии в Доминион будет долгим и трудным процессом. Наши министерства должны будут установить целый ряд критериев для того, чтобы страна могла достичь самоуправляемости. Мы должны сохранить определенное спокойствие в плане контроля над торговлей ресурсами страны, и какой-то способ сделать шаг вперед, если они установят антибританского валькиста. Однако даже эти минимальные требования могут быть трудны для выполнения. Делегация Индии пришла к нам и предложила создать комиссию для руководства Раджом на основе критериев Доминионства. Хотя это само по себе было чем-то, что мы собирались сделать, несмотря на их просьбу, они пошли дальше, настаивая на том, что они представлены в комиссии одним из их лидеров - человеком по имени Ситарамайя."
 raj.103.a: "Учредить комиссию для всех британцев."
 raj.103.b: "Пусть индейцы будут представлены в комиссии."

 raj.110.t: "Постепенная независимость"
 raj.110.d: "Наконец-то мы достигли всех критериев, установленных парламентом в Лондоне, чтобы стать независимой страной. Комиссия провела свое заключительное заседание и объявила Британский Радж «готовым к независимости». Последнее слово пришло из Лондона. Пять лет спустя Индия будет официально и безвозвратно свободна. В это время нашему правительству будет поручено обеспечить плавный переход к новому правительству, возглавляемому Индией. Через год британцы уйдут из своей крупнейшей колонии. через год Радж не будет больше. через год..."
 raj.110.a: "...Индия будет свободна."

 raj.111.t: "Независимость индейцев"
 raj.111.d: "Несмотря на наши нынешние, гораздо более масштабные проблемы, мы все еще должны решить, как решать вопрос о независимости Индии. Радж должен покинуть Империю в течение нескольких лет, и мы должны решить, как приблизиться к ее отъезду. Некоторые члены нашего правительства заявили, что мы должны просто позволить индейцам решать свои собственные дела. Другие же, тем не менее, более активно выступают за альтернативное решение. Нынешний разрыв между индусами и мусульманскими индейцами может перерасти в разрушительный конфликт в будущем, и эти члены нашего правительства предлагают провести широкомасштабные исследования и планирование возможного раздела Индии, с тем чтобы избежать такого конфликта. Это потребует от нас ценного времени и ресурсов, но, возможно, будет правильным, если мы надеемся обеспечить будущую стабильность в регионе."
 raj.111.a: "Освобождение Индии как единого государства"
 raj.111.b: "Раздел Индия"
 raj.111.c: "Пусть индейцы занимаются своими делами."

 raj.112.t: "Разделение Индии"
 raj.112.d: "Освобождение Индии как единого образования будет иметь катастрофические последствия не только для нашего доминирования в регионе, но и для самих граждан Раджа. Слишком много этнических и религиозных различий для создания единого, стабильного государства. Две крупнейшие этнические группы, к счастью, в основном объединяются в три области. Как Бенгал, так и Пенджаб - это районы с мусульманским большинством, в то время как остальная часть страны - индуистское большинство. Теперь нам предстоит решить, как разделить Радж. Некоторые выступают за его разделение между Пенджабом, Бенгалом и остальной частью страны. Другие же выступают за освобождение только одного или другого, опасаясь, что война между двумя странами и Индией может привести к катастрофе. Другие говорят, что только освободив обоих, мы сможем избежать гуманитарного кризиса и миллионы на миллионы перемещенных лиц. Что же нам делать?"
 raj.112.a: "Освободить "Справедливую Бенгалию""
 raj.112.b: "Освободить только Пенджаб"
 raj.112.c: "Освобождение как Бенгала, так и Пенджаба"

 raj.113.t: "Разделение страны"
 raj.113.d: "Британцы сделали беспрецедентный шаг, позволив нам определить наше собственное будущее. В то время как многие празднуют это как доброе предзнаменование для будущего нашего нового государства, другие продолжают призывать к осторожности, а некоторые даже заходят так далеко, чтобы выступать за добровольное разделение нации. Эти советники обеспокоены тем, что после того, как пройдет празднование нашей независимости, этнические и религиозные разногласия поднимут головы и разожгут конфликт, который мог бы убить миллионы людей. Они предполагают, что разделение Индии между районами хинду и мусульманами большинства является наилучшим курсом действий. Другие же продолжают настаивать на сохранении единой Индии, с тем чтобы проецировать как можно больше сил, чем самая молодая нация в мире, и предотвратить потенциальные нападения сверхдержав, которые нас по-прежнему окружают. Какой путь мы пойдем?"
 raj.113.a: "Мы можем решать наши проблемы вместе."
 raj.113.b: "Мы должны создать несколько штатов."

 raj.114.t: "Разделение Индии"
 raj.114.d: "Индия уже давно является массовым и многообразным государством, но до сих пор большинство этнических и религиозных проявлений насилия сдерживалось большим британским военным присутствием. Однако, когда британцы вскоре уезжают, мы должны столкнуться с проблемами, с которыми мы столкнемся. Наилучшим способом избежать насилия между нашими индуистскими и мусульманскими братьями является разделение страны, но есть вопросы о том, сколько расколов должно произойти. Мусульманские индейцы сосредоточены главным образом в двух областях: Бенгалии и Пенджабе. Некоторые из них предлагают создать в целом три государства, но другие говорят, что мы должны освободить одно или другое, не оба, в интересах нашего будущего как нации. Освобождение и то, и другое, скорее всего, предотвратит наихудший из гуманитарного кризиса, связанного с беженцами, но для сохранения как можно большего количества ресурсов и защиты от угроз в будущем может потребоваться только одно. Независимо от того, что мы выберем, мы будем определять будущее Южной Азии здесь и сейчас."
 raj.114.a: "Освободить "Справедливую Бенгалию""
 raj.114.b: "Освободить только Пенджаб"
 raj.114.c: "Освобождение как Бенгала, так и Пенджаба"

 raj.115.t: "День независимости"
 raj.115.d: "На улицах царит радостный дух. Все люди заполняют улицы и бульвары в каждом крупном городе, от Дакки до Карачи. Индуисты и мусульмане празднуют как новый флаг индийского государства, который был поднят над каждым зданием страны. Конечно, для каждых десяти человек был один британский офицер, торжественно собирающий свои сумки, или один экстремист, который продолжает цепляться за особенности независимости и новых наций - или их отсутствие, - которые украсили бы карты Южной Азии. Но, прежде всего, есть общая нить: мы победили. Мы заставили величайшую имперскую власть в мире присоединиться к нам. Сама нация, которая однажды разрушила все, что индийское общество построило на протяжении тысячелетий, теперь была вынуждена поклониться и предоставить ей независимость, которую оно так отчаянно заслуживало. Репортеры из каждой крупной нации, скопившейся в Дели, отчаянно хотят получить цитаты от официальных лиц и граждан. Действительно, мир наблюдает и ждет, как мы подходим и преодолеем предстоящие испытания и бедствия. Но сейчас нам нужно только беспокоиться о нашей свободе и праздновать одну вещь: нашу свободу."
 raj.115.a: "Да здравствует Индия!"

 raj.116.d: "Крушение британского правления в Индии привело к полной отмене британской индийской армии, и теперь те, кто однажды приказал ей вернуться домой, чтобы продолжать служить Великобритании, хотя среди них есть надежды, что однажды их командование в Индии может быть восстановлено, в настоящее время они служат в британской армии и будут продолжать служить вечно."

