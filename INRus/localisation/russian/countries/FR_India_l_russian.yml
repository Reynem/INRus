 #Events
 inc.01.t: "Народный фронт"
 inc.01.d: "Мы должны двигаться быстро. В Индии сейчас много сил, и даже когда мы отошли от тех, кто пытался угнетать нас, весь субконтинент был ввергнут в неуверенность. Радж ломается. Люди, которых он так долго подвергал насилию, наконец-то забирают то, что принадлежит ему. Там, где националистическое восстание провалилось, политическая и военная мощь, которую они с готовностью нам дали, не будет. Миллионы миллионов уже сползали к нашему флагу, и мы можем с радостью сказать, что все Бенгалы сейчас под нашим контролем. Хотя это может продолжаться недолго, Радж все еще имеет дело со своим собственным крахом, но если он выживет, то он будет стремиться к мести. И это будет означать войну против нас. Что бы ни было само порождение из тела Раджа, несомненно, опротестует наше требование к стране. Но они забывают о себе. Эта земля принадлежит народу, а не какой-либо иностранной империи или экономическому магнатуту. Люди будут направлять нашу реконконкустацию и приведут Индию в светло новое будущее."
 inc.01.a: "Слава людям!"

 inc.02.t: "Первый народный конгресс"
 inc.02.d: "Величайшие социалистические деятели Индии собрались сегодня в Дакке на первый первый Всенародный конгресс, который, возможно, не будет сопровождаться таким величием, как мы могли бы надеяться, но это срочное время. Стервятники остаются у нас на пороге, готовые напасть, как только мы проявим первый признак слабости. Этот Конгресс будет необходим для сохранения воли народа и планирования нашего окончательного восстановления субконтинента. Его значение невозможно переоценить."
 inc.02.a: "Да начнётся Конгресс!"

 inc.10.t: "Народный реквизит Индии"
 inc.10.d: "С разломом Индии, империи мира выбирают нас, как стервятников. Только их собственная борьба помешала им захватить момент, чтобы снова напасть на нас и покорить нас. В Индии не будет шанса. Но вместе... мы можем стать самой могущественной нацией рабочих, которую когда-либо видел мир. Народ больше не будет скован цепями своих завоевателей. Давайте мобилизуем нашу армию и заряжаем наши винтовки. Принцы, которые заявляют о власти над народами Индии, скоро узнают наш гнев, и скоро... народ сможет вернуть Индию."
 inc.10.a: "Да здравствует Индия!"

