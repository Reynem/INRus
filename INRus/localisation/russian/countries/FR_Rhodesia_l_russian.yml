 #events
 aiu_rhod.1.t: "РНКН отделяется от Родезии"
 aiu_rhod.1.d: "Первоначально отправленные для оценки нынешнего состояния недавно созданных федеративных колоний Родезии и Ньясаленда, Родезии и Ньясалендской королевской комиссии отбыли сегодня в Лондон, чтобы представить свои выводы."
 aiu_rhod.1.a: "В настоящее время ситуация является благоприятной."
 aiu_rhod.1.a: "Федералы должны быть переданы."
 aiu_rhod.2.t: "РНКК рекомендует революцию"
 aiu_rhod.2.d: "Ссылаясь на несправедливое и возмутительное распределение власти в Федерации, представляется, что КНР рекомендовала распустить федерацию и колонии Северной Родезии и Ньясаленда восстановить автономию непосредственно под Великобританией."
 aiu_rhod.2.a: "Очень хорошо, федерация окончена."
 aiu_rhod.2.b: "Мы больше не будем прислушиваться к этой явно предвзятой Комиссии."
 aiu_rhod.3.t: "РНК оценивает нашу политику"
 aiu_rhod.3.d: "Сообщив парламенту о нынешней политической ситуации, КНР предложил три возможных пути изменения нашей политики. Во-первых, мы могли бы сохранить нынешнюю систему и попытаться сбалансировать интересы как белых, так и чернокожих в Родезии. Еще один вариант состоял бы в том, чтобы попытаться примирить туземцев путем расширения франшизы на всех независимо от собственности и доходов, хотя это может раздражать белых и сдерживать иммиграцию. И наконец, мы могли бы попытаться поощрять поселение белых и увеличить силу белых, уже проживающих в стране, повышая финансовую квалификацию и распределяя землю для белых жителей."
 aiu_rhod.3.a: "Сохранить текущую систему."
 aiu_rhod.3.b: "Расширить франшизу для всех."
 aiu_rhod.3.c: "Повышение финансовой квалификации."
 aiu_rhod.10.t: "Родезия ищет статуса Защитника"
 aiu_rhod.10.d: "После недавних внутренних реформ и сельскохозяйственного и промышленного роста в стране представители нашей колонии Родезии обратились к парламенту с просьбой предоставить стране статус Защитника, что сделало бы их более автономными, что могло бы иметь преимущества и недостатки в будущем."
 aiu_rhod.10.a: "Выполните просьбу."
 aiu_rhod.10.b: "Они не готовы."
 aiu_rhod.11.t: "Парламент предоставляет статус Защитника"
 aiu_rhod.11.d: "Наша петиция была обсуждена парламентом и принята."
 aiu_rhod.11.a: "Да здравствует король!"
 aiu_rhod.12.t: "Парламент отклоняет нашу петицию."
 aiu_rhod.12.d: "После нашего ходатайства о предоставлении статуса Защитника прения в парламенте привели к отклонению нашей просьбы, что привело к возможности предоставления нам такого статуса в будущем после дальнейшего развития ситуации."
 aiu_rhod.12.a: "Неудачно."
 
 aiu_rhod.40.t: "Разочарование белого населения"
 aiu_rhod.40.d: "Наши недавние действия вызвали большое потрясение среди белых жителей Родезии, которые являются основой нашего правительства и большинства его ветвей."
 aiu_rhod.40.a: "Беспокойство..."
 aiu_rhod.41.t: "Изменение режима"
 aiu_rhod.41.d: "Наше правительство, которое сейчас дико непопулярно среди белых жителей Родезии, сегодня было распущено вооруженными людьми."
 aiu_rhod.41.a: "Правительство исчезло, да здравствует новое правительство!"
 
 aiu_rhod.50.t: "Антиправительственный митинг!"
 aiu_rhod.50.d: "Мы слышали, что митинг против нашего правительства проходил без нашего ведома в сельской части Южной Родезии, где присутствовала большая толпа, которая осудила нас и призвала к кампании неповиновения и саботажа против правительства."
 aiu_rhod.50.a: "Неприемлемое поведение."
 aiu_rhod.51.t: "Небольшая стычка с мятежниками"
 aiu_rhod.51.d: "Сегодня один из наших патрулей был обстрелян и вынужден отреагировать на неспровоцированное нападение."
 aiu_rhod.51.a: "Эти повстанцы никогда не подорвут нашу страну."
 aiu_rhod.52.t: "Большая стычка в Буше"
 aiu_rhod.52.d: "После наводки местного жителя наши силы смогли обнаружить и удивить оплот мятежников, скрытый в Буше, однако он оказался более защищенным, чем мы ожидали, и мы смогли уничтожить его только ценой больших человеческих затрат."
 aiu_rhod.52.a: "Надеюсь, они не оправятся от этого поражения."
 aiu_rhod.53.t: "Антиправительственный митинг!"
 aiu_rhod.53.d: "Мы слышали, что митинг против нашего правительства проходил без нашего ведома в сельской части Северной Родезии, где присутствовала большая толпа, которая осудила нас и призвала к кампании неповиновения и саботажа против правительства."
 aiu_rhod.53.a: "Неприемлемое поведение."
 aiu_rhod.54.t: "Антиправительственный митинг!"
 aiu_rhod.54.d: "Мы слышали сообщения о том, что митинг против нашего правительства проходил без нашего ведома в сельской части Ньясаленда, где присутствовала большая толпа, которая осудила нас и призвала к кампании неповиновения и саботажа против правительства."
 aiu_rhod.54.a: "Неприемлемое поведение."
 
 aiu_rhod.55.t: "Ньясаленд поднимается!"
 aiu_rhod.55.d: "Организованные повстанческие силы захватили ряд правительственных зданий и военных постов в Ньясаленде, вынудив несколько наших подразделений отступить и передать им территорию."
 aiu_rhod.55.a: "Пошлите войска."
 aiu_rhod.55.b: "Все народы имеют право на самоопределение!"
 aiu_rhod.56.t: "Револьт в Северной Родезии!"
 aiu_rhod.56.d: "Сегодня банды вооруженных мятежников устроили скоординированное нападение на наши позиции в Северной Родезии, а после захвата нескольких правительственных зданий провозгласили независимым государством Замбию, и наши подразделения должны быть направлены для того, чтобы победить это повстанческое движение."
 aiu_rhod.56.a: "Предатели, все!"
 aiu_rhod.56.b: "Мы не будем сидеть под этим колониальным ярмо!"
 aiu_rhod.57.t: "Вторая Чимуренга"
 aiu_rhod.57.d: "Массовое нападение подразделений партизан на позиции по всей стране началось сегодня утром, с целью захвата жизненно важных мест и зданий, наши войска прекрасно выступили против внезапного нападения, но повстанческие силы сильнее, чем мы ожидали, и эта битва может стать намного сложнее..."
 aiu_rhod.57.a: "Затраты на то, чтобы сохранить эту землю свободной, никогда не будут слишком большими."
 aiu_rhod.57.b: "Эра империализма закончилась!"
 
 aiu_rhod.60.t: "Южная Родезия успокоилась"
 aiu_rhod.60.d: "Методическая кампания по борьбе с повстанцами, осуществляемая при содействии местного населения, успешно позволила обнаружить и уничтожить основные элементы повстанческой деятельности в Южной Родезии. &lt; &lt; Сопротивление &gt; &gt; может продолжаться, но пройдет много лет, прежде чем они смогут вновь координировать любую эффективную деятельность против нас."
 aiu_rhod.60.a: "Победа для всех жителей Родезии."
 aiu_rhod.61.t: "Северная Родезия успокоилась"
 aiu_rhod.61.d: "Наши усилия по установлению мира в Северной Родезии принесли свои плоды, открыв и схватив весь руководящий круг повстанческих действий на территории, что является серьезным препятствием для мятежников, которые не смогут в ближайшем будущем осуществить какие-либо дальнейшие действия сопротивления в их замешательстве."
 aiu_rhod.61.a: "Отличная работа."
 aiu_rhod.62.t: "Ньясаленд успокоился"
 aiu_rhod.62.d: "Небольшая, но продуктивная территория Ньясаленда теперь освобождена от тени повстанческой деятельности, поскольку наши силы по установлению мира уничтожили и ликвидировали убежища мятежников в стране."
 aiu_rhod.62.a: "Тень поднимается в Ньясаленде."
 
 
 
 
