 RHO_cape_colony_system_idea_2: "Тимократия"
 RHO_cape_colony_system_idea_2_desc: "Родезия реформировала систему франшизы в Кейп Колонии, повышая финансовую квалификацию, что означает, что, хотя эта система является более безупречной, меньше чернокожих, имеющих политическую власть, что вызывает недовольство."
 RHO_cape_colony_system_idea_3: "Снижение финансовой квалификации"
 RHO_cape_colony_system_idea_3_desc: "Родезия реформировала систему франшизы в Кейп Колонии, понизив финансовую квалификацию, что привело к увеличению числа местных жителей в политической системе."
 RHO_home_discontent: "Разочарование в Южной Родезии"
 RHO_home_discontent_desc: "Белое правление в Южной Родезии, а также отсутствие возможностей и богатства для чернокожих являются источниками серьезного устрашения в стране. §YDiscont§! в настоящее время находится в §Y [?RHO_home_discontent_var]% §!. Если оно вырастет более чем на 40%, начнут происходить негативные события."
 RHO_zambia_discontent: "Разочарование в Северной Родезии"
 RHO_zambia_discontent_desc: "Федерация двух Родезийских островов столкнулась с противодействием на севере, где белое население гораздо меньше и власть Солсбери вызывает возмущение. §YDiscont§! в настоящее время находится в §Y [?RHO_zambia_discont_var]%§!. Если оно вырастет более чем на 40%, начнут происходить негативные события."
 RHO_nyasaland_discontent: "Разочарование в Ньясаленде"
 RHO_nyasaland_discontent_desc: "В Ньясаленде, где очень маленькое белое население и история черного тысячелетия, правление из Солсбери рассматривается как релегация Ньясаленда на территорию второго класса. §YDiscont§! в настоящее время находится в §Y[?RHO_nyasaland_discontent_var]% §! Если оно вырастет более чем на 40%, начнут происходить негативные события."
