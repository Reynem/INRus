 #ideas
 RHO_cape_colony_system_idea: "Мысская колония"
 RHO_cape_colony_system_idea_desc: "Родезия сохранила систему франшизы на мысейском языке, в которой могут голосовать только чернокожие и белые, имеющие более определенный доход или стоимость собственности. Право голоса предоставляется тем, кто владеет имуществом минимальной стоимости в 150 фунтов стерлингов или имеет годовой доход не менее 100 фунтов стерлингов, сопровождаемый базовым тестом на английский язык. Хотя эта система формально равна, на практике эти стандарты оставляют большинство чернокожего населения лишенными права голоса при соблюдении принципа &quot; белого меньшинства &quot; . В настоящее время предложения о реформе отличаются от тех, кто желает снизить или полностью отменить стандарты, от тех, кто желает поддержать статус-кво, и тех, кто желает повысить стандарты или официально закрепить положение белого меньшинства. В то время как Великобритания внимательно следит за тем, как она стремится к стабильности в своей колонии, которая может разрушаться."

RHO_boer_peril: ""Бурская преграда""
RHO_boer_peril_desc: "Хотя внешне это может показаться, что два африканских государства под правлением белого меньшинства были бы естественными союзниками против их общих экзистенциальных угроз, отношения между Родезией, доминирующей в англоязычных странах, и бурой Южной Африкой являются бедными. На протяжении многих лет они претендовали на наши земли, и даже англо-дружеские правительства просили Лондон о нашей аннексии. ~ nnanglo жители боятся аннексии в потенциальное правительство Бура, жаждущее мести за войны в Буре, и мало кто хочет, чтобы наша Федерация упала перед правительством в Претории, англо-дружелюбной или нет. Пока мы все еще вдохнем, мы никогда не станем правителем Буров!"

