 arg.8.b: "У нас нет выбора, стреляйте в протестующих."
 arg.8.a: "Мы должны подождать, пока они уйдут."
 arg.9.t: "Активизация протестов"
 arg.9.d: "Еще одна толпа из них окружила Ла Касу Росаду, и, похоже, они не хотят уезжать."
 arg.9.b: "У нас нет выбора, стреляйте в протестующих."
 arg.9.a: "Мы должны подождать, пока они уйдут."
 arg.40.t: "Лидеры протестующих хотят отвергнуть"
 arg.40.d: "В то время как протесты продолжаются, мы получаем проблеск надежды, как официальное послание от ведущих протестующих, лидера-коллекциониста Родольфо Гиолди, предлагающего отказаться от определенных прав и возможной договоренности. Хотя мы должны быть осторожны с тем, с кем имеем дело. ~ / n no с другой стороны, члены ЛПА в нашем правительстве неоднократно просили нас не принимать никаких требований, поскольку они считают, что переговоры с марксистами могут уничтожить нашу страну."
 arg.40.a: "Мы не будем вести переговоры с агитаторами."
 arg.40.b: "Любое соглашение, которое приведет нас к стабильности, хорошо."
 arg.50.t: "Правительство падает на протесты"
 arg.50.d: "По мере того, как ситуация стала ужасной, насилие усилилось, наше правительство, наконец, рухнуло, протестующие превратились в революционеров и покорили Ла Касу Росаду, Буэнос-Айрес стал красным, как коллективисты, а также другие революционные социалисты захватили власть, и старая республика исчезла. Несмотря на то, что новая Аргентина восстала из пепла, который был создан для рабочих и был создан для них. Революционеры радуются, когда новый председатель Гиолди объявляет об учреждении Коллегии Аргентины, нового государства рабочих, которое принесет социалистическое процветание и выведет нас из кризиса!"
 arg.50.a: "Ла Революционный рекьен Comienza."
 arg.51.t: "Наша республика в кризисе"
 arg.51.d: "Однако мы попробовали сделать все возможное, чтобы исправить ситуацию, и после сегодняшнего дня судьба Аргентины будет решена."
 arg.51.a: "Революция прибывает в Аргентину."
 arg.51.b: "Правительство борется, но республика выживает."
 arg.52.d: "В то время как мы справились с протестами, напряженность все еще слишком велика. Люди несчастны, и наше правительство не может выжить так, как есть. Однако появился шанс. Несмотря на то, что LPA, возглавляющая борьбу с протестами, помогла нам до сих пор. Хотя многие считают это слишком экстремальным, чтобы возглавить правительство, адмирал Домек предложил нам договор. LPA получит большее влияние в правительстве, но кажется, что только таким образом республика выживет. Вместе мы сильны, и мы выйдем из этого."
 arg.52.t: "Выживание по цене"
 arg.52.a: "Наконец-то, патриотическое правительство, чтобы вести нас."
 arg.53.t: "Насилие растет по мере эскалации кризиса"
 arg.53.d: "По мере того, как протестующие превращаются в революционеров, а насилие усиливается, патриотические лиги начинают бороться с революционерами, хотя они, возможно, и не смогут долго удерживать их, если мы, как правительство, решим оказать ЛПА нашу поддержку, вместе мы сможем изменить прилив и спасти республику, иначе улицы Буэнос-Айреса станут красными с революционным приливом."
 arg.53.a: "Вместе пакт ЛПА-СКР спасет республику."
 arg.53.b: "Революция увенчается успехом, когда старое правительство рухнет."
 arg.10.t: "Правительство имеет дело с трудящимися"
 arg.10.d: "Неделя рабочих, протестующих за дополнительные права, подходит к концу, так как наше правительство официально объявляет о завершении переговоров, и рабочие возвращаются к своей обычной работе. Несмотря на ожидание подобных вопросов, правоэкстремистские правительственные чиновники выразили свое недовольство в связи с уклонением от требований протестующих, в то время как правительство явно намерено делать все необходимое для мирного решения любых вопросов."
 arg.10.a: "Трудящимся приятно требовать и удовлетворять свои потребности."
 arg.10.b: "Те, кто выступает против порядка, должны быть отправлены с силой."
 arg.11.t: "Требуется фракционность ЛПА как плюрализм."
 arg.11.d: "Когда правительство призывало к плюрализму в ответ на нынешнюю обстановку, критикующую их демократическое господство избирательной системы, некоторые политики, связанные с ЛПА, пытались сформировать фракцию в нашем законодательстве, хотя это движение и не является официальной политической партией. Они утверждают, что это является их свободным правом, а также несколько видных членов ЛПА заявили о своей поддержке в этом, однако другие продемонстрировали большое недовольство в этом отношении, и это, несомненно, окружило бы палату, если бы мы позволили это."
 arg.11.a: "Они имеют право свободно объединяться."
 arg.11.b: "ЛПА не является официальной политической партией."
 arg.12.t: "Коллегиисты политизируют мемориал"
 arg.12.d: "Поскольку память о тех, кто погиб во время последней войны, показана правительством, коллективные группы взяли ее для демонстрации поблизости, обвиняя правительство в ошибках войны и продвигая свою собственную платформу, хотя большинство считают эту демонстрацию неприятной, трудно утверждать, что вмешательство в войну произошло из ниоткуда для большинства, и, возможно, другое правительство означало бы избежать таких потерь."
 arg.12.a: "Мы не потерпим тех, кто будет неуважительно относиться к нам, когда будем чтить наших павших."
 arg.12.b: "Радикалы слепы к крови на своих руках."
 arg.13.t: "Диалог между правительством и оппозицией"
 arg.13.d: "Поскольку ситуация в нашей стране была тщательно рассмотрена, сегодня правительство установило дружественный диалог с оппозицией и, как представляется, мир с диссидентами в их победной партии, а также с группами, придерживающимися различных идеологий, стремясь к тому, чтобы Аргентина объединила их всех."
 arg.13.a: "Похоже, все идет по нашему пути."
 arg.14.t: "Революция прибывает в Аргентину"
 arg.14.d: "По мере роста протестов рабочих и роста социальной агитации она достигла точки, когда правительство ничего не могло сделать, так как оно было в растерянности. ~Нет, именно из этого хаоса революционные рабочие мобилизовали и свергли правительство, по мере того, как улицы городов по всей Аргентине стали красными под социалистическим флагом. Теперь старый режим исчез, и революция правит Аргентиной. Идеологи коллективистской партии, возглавляемой Родольфо Гиолди, взяли на себя ведущую роль в восстании и в этом новом революционном порядке."
 arg.14.a: "Пролетариат победит."
 arg.15.t: "Агитация как государственная национализация промышленности"
 arg.15.d: "В рамках широкомасштабных реформ, навязанных нашим социалистическим правительством, существенно важное значение имеет национализация промышленности под контролем рабочих, однако этот маневр оказался непопулярным для многих малых и средних предприятий, которые возбуждают и порождают хаос в нашем обществе."
 arg.15.a: "У нас нет на это времени."
 arg.16.t: "Реакторы бегут по мере централизации правительства"
 arg.16.d: "По мере того, как наше революционное правительство начало еще больше централизовать свой контроль над обществом, реакторы, которые все еще любят их"democratic" traditions have decided to cross the border into neighbours countries where they can escape the revolution.\n\n It may be a good idea to limit this population flow, and do as we can to strengthen argentinian society, even if it would ease the tensions of our society to let them go."
 arg.16.a: "Отпустите их."
 arg.16.b: "Остановите их."
 arg.17.t: "Красный восход солнца"
 arg.17.d: "В этот день мы отмечаем все то, через что мы прошли с момента начала революции, поскольку новая система окончательно урегулирована, а вопросы прошлого оставлены позади, мы можем теперь с гордостью смотреть на Аргентину как на бастион для рабочих, революции, в Южной Америке."
 arg.17.a: "Солнце восходит для рабочих."


 arg.20.t: "Конфедерация стоит вместе."
 arg.20.d: "Однако наше правительство в настоящее время крайне ослаблено властью и поддержкой этих событий, и революционеры, а также другие диссиденты сильны здесь. Хотя мы можем попытаться тщательно проработать эти вопросы в одиночку, к нашему вниманию пришло предложение, адмирал Домек Гарсия, наш военный министр и высокий член ЛПА, говорит, что если мы согласимся оказать на ЛПА большее влияние в правительстве и законодательстве, они окажут поддержку нашему правительству и убедятся в том, что наш режим достаточно стабильен, чтобы преодолеть хаос."
 arg.20.a: "УКР останется в одиночестве, решая наши проблемы."
 arg.20.b: "Необходимо заключить договор с ЛПА."
 arg.21.t: "Оппозиционные протесты против мер субсидирования"
 arg.21.d: "Несмотря на то, что наше правительство находит наиболее аппетитным финансировать больные предприятия для поддержания экономики, такое вмешательство не было одобрено более консервативными слоями нашего общества, и оппозиция быстро нам это говорит."
 arg.21.a: "Мы делаем то, что должны для Аргентины."
 arg.21.b: "Может, мы заходим слишком далеко."


 arg.22.t: "Социалисты протестуют против образовательной реформы"
 arg.22.d: "Как правительство мы всегда заботились о молодости аргентинской молодежи, чтобы получить лучшее образование, которое она может получить, но не все согласны с нашими средствами."
 arg.22.a: "Нам не нужны революционеры."
 arg.23.t: "Солнце снова извергается."
 arg.23.d: "Мы прошли через многое: война, потеря, исцеление, раны, аварии, хаос, беспорядок и единство, мы собрались вместе и поднялись вперед, как единая нация, по мере того как демократия в Аргентине восторжествует под знаменем радикализма, в нашей великой стране появляется новый восход солнца."
 arg.23.a: "Мы потрясающие."

 arg.24.t: "Ограничения в отношении труда"
 arg.24.d: "Поскольку правительство приняло решение ограничить свободы профсоюзов трудящихся в рамках нашей политики по улучшению положения Аргентины, мы нашли большое количество протестующих против этой меры, как и ожидалось."
 arg.24.a: "Всего несколько."
 arg.25.t: "Новая Аргентина"
 arg.25.d: "Аргентина слишком долго жила под иностранным ярмо, и это уже не так, когда люди просыпаются в гордости за свою нацию, будь то солнечная или буря, какая бы погода, холод или тепло ни была, наша национальная гордость будет нас направлять, поскольку мы знаем, что аргентинская нация обречена на великие дела, и мы сделаем все возможное для этого."
 arg.25.a: "Боже, спаси Отечественную землю."
 arg.26.t: "Патриотические отряды преследуют работников"
 arg.26.d: "По мере того, как собираются новые лигаса, поступают сообщения о том, что некоторые из них приближаются к промышленным зонам, чтобы преследовать работников в зонах с предшественниками профсоюзов, и хотя мы понимаем их рассуждения, многие считают этот шаг неуместным."
 arg.26.a: "Продолжайте, пожалуйста."
 arg.26.b: "Наказать эти подразделения."
 arg.27.t: "От кого должен быть импорт?"
 arg.27.d: "Как план обновления наших нынешних запасов оборудования, убедившись в том, что наши вооруженные силы находятся в надлежащей форме, нам еще предстоит определить, кто должен импортировать это оружие. Это решение, более чем экономичное, укрепит дипломатические связи между нашими странами. Несмотря на то, что популярным, но спорным вариантом является Германия. Их агрессивное правительство производит хорошее оружие, и их самоподдерживающаяся экономическая модель является хорошим примером для нас."
 arg.27.a: "Немецкое оружие - это то, что нам нужно."
 arg.27.b: "Давайте не будем забывать о том, какой успех принес нам британский бизнес."
 arg.27.c: "Возможно, французы предоставят все, что нам нужно."
 arg.27.e: "Оружие, сделанное в новом мире, лучше."


 arg.80.t: "Приглашение Аргентины"
 arg.80.d: "У аргентинского правительства были проблемы с внутренними экстремистами, поэтому это не было неожиданностью, когда они объявили об учреждении союза с целью защиты демократического порядка в Южной Америке или того, что от него осталось."
 arg.80.a: "Присоединяйтесь к Фракции."
 arg.80.b: "Нам лучше быть одному."
 arg.81.t: "Приглашение Аргентины"
 arg.81.d: "У аргентинского правительства были проблемы с внутренними экстремистами, поэтому это не было неожиданностью, когда они объявили об учреждении союза с целью защиты демократического порядка в Южной Америке или того, что от него осталось."
 arg.81.a: "Присоединяйтесь к Фракции."
 arg.81.b: "Нам лучше быть одному."
 arg.82.t: "Приглашение Аргентины"
 arg.82.d: "У аргентинского правительства были проблемы с внутренними экстремистами, поэтому это не было неожиданностью, когда они объявили об учреждении союза с целью защиты демократического порядка в Южной Америке или того, что от него осталось."
 arg.82.a: "Присоединяйтесь к Фракции."
 arg.82.b: "Нам лучше быть одному."
 arg.83.t: "Приглашение Аргентины"
 arg.83.d: "У аргентинского правительства были проблемы с внутренними экстремистами, поэтому это не было неожиданностью, когда они объявили об учреждении союза с целью защиты демократического порядка в Южной Америке или того, что от него осталось."
 arg.83.a: "Присоединяйтесь к Фракции."
 arg.83.b: "Нам лучше быть одному."
 arg.84.t: "Приглашение Аргентины"
 arg.84.d: "Прибыло приглашение. Аргентина в своей недавней попытке расширить свое влияние в регионе решила, что она считает союз с нами пригодным для реализации своих планов. Несмотря на то, что много сил можно было бы получить от объединения Аргентины, мы должны рассматривать это как удобство, и мы должны рассматривать это только так, как мы должны принять?"
 arg.84.a: "Присоединяйтесь к Фракции."
 arg.84.b: "Нам лучше быть одному."
 arg.85.t: "Приглашение Аргентины"
 arg.85.d: "Прибыло приглашение. Аргентина в своей недавней попытке расширить свое влияние в регионе решила, что она считает союз с нами пригодным для реализации своих планов. Несмотря на то, что много сил можно было бы получить от объединения Аргентины, мы должны рассматривать это как удобство, и мы должны рассматривать это только так, как мы должны принять?"
 arg.85.a: "Присоединяйтесь к Фракции."
 arg.85.b: "Нам лучше быть одному."
 arg.86.t: "Союз с Аргентиной"
 arg.86.d: "Аргентина прислала нам предложение, объединив пролетариата и отказавшись от нашей автономии, став частью более широкой федерации Ла-Плата, в интересах рабочих."
 arg.86.a: "Объединяйтесь (вы будете аннексированы)."
 arg.86.b: "Нет?"
 arg.87.t: "Изъятие Мальвинских островов"
 arg.87.d: "По мере того, как Британская Империя затонула в своих собственных конфликтах на севере, это наш шанс, наши корабли отплыли и захватили Мальвинские острова и острова Южная Георгия, положив наш флаг на землю и установив наш контроль над ними."
 arg.87.a: "Вива Аргентина!"
 arg.88.t: "Вторжение Фолклендских островов"
 arg.88.d: "Аргентинское правительство в экспансионистском движении и с учетом нашего нынешнего агрессивного статуса решило, что вторжение в наше южное атлантическое имущество может быть разумным шагом."
 arg.88.a: "Мы не можем позволить себе бороться с этим конфликтом сейчас."
 arg.88.b: "Давай проучим этих Арджи!"
 arg.89.t: "Рассматривая вопрос о мире"
 arg.89.d: "Прошли месяцы с тех пор, как аргентинские войска захватили Фолкленды, но мы были слишком заняты нашим другим конфликтом, чтобы вернуть их назад."
 arg.89.a: "Сдай острова."
 arg.89.b: "Мы не отдадим ни капли империи."
 arg.100.t: "Ускорение социалистической активности"
 arg.100.d: "Наше правительство недавно отошло назад, так как вдруг коллективисты и социалисты начали расширять свою открытую деятельность, и кажется, что они открыто маршируют по улицам. Несмотря на то, что эти события не являются прецедентами, наши сотрудники разведки сообщают нам о возможном аргентинском влиянии, возможно финансировании этих левых движений."
 arg.100.a: "Ничего нового."
 arg.100.b: "Сделаем все возможное, чтобы остановить их деятельность."
 arg.101.t: "Чилийское правительство рушится по мере того, как наши силы захватывают власть"
 arg.101.d: "В то время как боевые действия продолжаются, мы оказались в благоприятном положении, и судьба Чили в наших руках, мы можем быстро захватить власть и создать одно революционное правительство, которое будет править для рабочих."
 arg.101.a: "Создайте дружелюбное правительство."
 arg.101.b: "Род занятий - это лучший выбор."
 arg.102.t: "Вопрос Тарихи"
 arg.102.d: "В то время как мы стремимся к созданию прочных связей между южноамериканскими социалистами, что позволит нам добиться успеха и триумфа над реакторами, мы нашли в Боливии возможного союзника. Хотя воспоминания о войне еще свежи, и между нашими предыдущими правительствами возникла напряженность, наш народ готов работать вместе в интересах лучшего будущего. . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . ."
 arg.102.a: "Отдай Таджи."
 arg.102.b: "Тариджа принадлежит Аргентине."
 arg.103.t: "Приглашение Аргентины"
 arg.103.d: "Как и ожидалось от наших новых дружественных отношений, Аргентина предложила нам кое-что интересное. Они пригласили нас присоединиться к своему международному социалистическому альянсу. Это укрепит связи рабочих на континенте, а также даст нам силы против реакционной угрозы, как они говорят."
 arg.103.a: "Рабочие должны стоять вместе."
 arg.103.b: "Боливия работает лучше в одиночку."
 arg.104.t: "Ускорение социалистической активности"
 arg.104.d: "Наше правительство недавно отошли назад, так как различные экстремальные левые группы начали расширять свою открытую деятельность, и, похоже, они открыто маршируют по улицам. Несмотря на то, что эти события не являются прецедентами, наши сотрудники разведки сообщают нам о возможном аргентинском влиянии, возможно, финансировании этих левых движений."
 arg.104.a: "Ничего нового."
 arg.104.b: "Сделаем все возможное, чтобы остановить их деятельность."
 arg.105.t: "Боливийское правительство рушится по мере того, как наши силы захватывают власть"
 arg.105.d: "В то время как боевые действия продолжаются, мы оказались в благоприятном положении, и судьба Боливии в наших руках, мы можем быстро захватить власть и создать одно революционное правительство, которое будет править для рабочих. / Альтернатива, менее популярная идея заключается в том, чтобы продолжать двигаться вперед до тех пор, пока мы полностью не оккупируемся, а затем править над Боливией непосредственно из Буэнос-Айреса."
 arg.105.a: "Создайте дружелюбное правительство."
 arg.105.b: "Род занятий - это лучший выбор."
 arg.106.t: "Ускорение социалистической активности"
 arg.106.d: "Наше правительство недавно отошло назад, так как вдруг различные социалистические диссидентские группы начали расширять свою открытую деятельность, и, как представляется, они открыто маршируют по улицам. Несмотря на то, что эти события не без прецедента, наши спецслужбы информируют нас о возможном аргентинском влиянии, возможно, о финансировании этих левых движений."
 arg.106.a: "Ничего нового."
 arg.106.b: "Сделаем все возможное, чтобы остановить их деятельность."
 arg.107.t: "Парагвайское правительство рушится по мере того, как наши силы захватывают власть"
 arg.107.d: "В то время как боевые действия продолжаются, мы оказались в благоприятном положении, и судьба Боливии в наших руках, мы можем быстро захватить власть и создать одно революционное правительство, которое будет править для рабочих. ~ Альтернатива, менее популярная идея заключается в том, чтобы продолжать двигаться вперед до тех пор, пока мы полностью не оккупируемся, а затем править Парагвайом непосредственно из Буэнос-Айреса."
 arg.107.a: "Создайте дружелюбное правительство и отдайте Чако Боливии."
 arg.107.b: "Род занятий - это лучший выбор."
 arg.107.c: "Создайте дружелюбное правительство в пределах его нынешних границ."
 arg.108.t: "Парагвайское правительство рушится по мере того, как наши силы захватывают власть"
 arg.108.d: "В то время как боевые действия продолжаются, мы оказались в благоприятном положении, и судьба Боливии в наших руках, мы можем быстро захватить власть и создать одно революционное правительство, которое будет править для рабочих. ~ Альтернатива, менее популярная идея заключается в том, чтобы продолжать двигаться вперед до тех пор, пока мы полностью не оккупируемся, а затем править Парагвайом непосредственно из Буэнос-Айреса."
 arg.109.t: "Ускорение социалистической активности"
 arg.109.d: "Наше правительство недавно отошли назад, так как различные экстремальные левые группы начали расширять свою открытую деятельность, и, похоже, они открыто маршируют по улицам. Несмотря на то, что эти события не являются прецедентами, наши сотрудники разведки сообщают нам о возможном аргентинском влиянии, возможно, финансировании этих левых движений."
 arg.109.a: "Ничего нового."
 arg.109.b: "Сделаем все возможное, чтобы остановить их деятельность."
 arg.110.t: "Правительство Уругвая рушится по мере того, как наши силы захватывают власть"
 arg.110.d: "В то время как боевые действия продолжаются, мы оказались в благоприятном положении, и судьба Уругвая в наших руках. Мы можем быстро захватить власть и создать одно революционное правительство, которое будет править для рабочих."
 arg.110.a: "Создайте дружелюбное правительство."
 arg.110.b: "Род занятий - это лучший выбор."
 arg.111.t: "Приглашение Аргентины"
 arg.111.d: "По мере того, как революция распространилась по всему континенту, Аргентина оказалась под таким же революционным правительством, как и мы, и они решили проводить открытую международную политику дружбы и сотрудничества между социалистическими странами."
 arg.111.a: "Присоединяйтесь к аргентинской Фракции."
 arg.111.b: "Мы лучше поработаем в одиночестве."
 arg.112.t: "Перу присоединяется к нашему альянсу"
 arg.112.d: "Во имя международного сотрудничества и дружбы, а также революции Перу присоединилась к нашему международному социалистическому альянсу, выступив в качестве сильного партнера для предприятий в Южной Америке."
 arg.112.a: "Отличные новости!"
 arg.113.t: "Перу отвергает наше предложение"
 arg.113.d: "Похоже, что руководство Перу, как оно отвергло наше предложение, имеет свой ум по поводу проблем, выходящих за рамки защиты южноамериканского социализма."
 arg.113.a: "Грустно!"

 arg.200.t: "Аргентина приглашает нас к проведению исследований в соответствии с Пактом"
 arg.200.d: "Будучи социалистической страной, Аргентина заключила пакт, в соответствии с которым технические достижения могут быть разделены между южноамериканскими революционными странами."
 arg.200.a: "Это может быть хорошей идеей."
 arg.200.b: "Лучше не надо."


 arg.250.t: "Разделились в Коллегиационной партии"
 arg.250.d: "Недавний политический раскол произошел. Члены Коллегионистской партии Аргентины, известной как авангардистская фракция , разделились и сформировали свою собственную партию - Партию Вангард , основанную на идеологии социализма. Несмотря на то, что эта идеологическая пропасть основана на крайних идеях, которые предлагает их идеология, некоторые из которых считаются ревизионистами ортодоксальными группами, например создание централизованного, высоко авторитарного и контролирующего социалистического государства, возглавляемого авангардной партией, в качестве конечной цели для их бренда социализма. В то время как коллективисты жалуются на это разделение, анархисты в коллективе проявляют оптимизм в отношении этого нового развития, расколотой коллективистской партии, дающей им больше шансов представить свои собственные идеи на предстоящем Конгрессе в следующем году."
 arg.250.a: "Нам все равно не понравились эти парни."
 arg.251.t: "Реюниты UCR"
 arg.251.d: "После 15 лет раздельного существования радикальная антиличностная партия Союза Чивица объявила вместе с оригинальной ОЦР, что они воссоединится и как таковые приведут в Аргентину более сильный, менее фракционистский радикализм. ~ Всюду рассматривали политический шаг, основанный на недавнем росте нерадикальных групп в нашей политической среде, многие считают, что это может привести к изменениям в партии, которая нуждается в надлежащей конкуренции на следующих выборах, которые нам предстоит провести."
 arg.251.a: "Вместе мы стоим на высоте."
 arg.252.t: "Выборы 1940 года"
 arg.252.d: "Пришла пора продолжить нашу демократическую традицию и избрать следующего президента республики. Несмотря на эти выборы, человек в центре внимания - Карлос Сааведра Ламас. Выдающийся дипломат, он выступает за Национальную партию Демократа, и его широко считают одним из ведущих людей, которые привносят свежий воздух в аргентинскую политику, хотя многие считают, что он не будет столь отличным от наших предыдущих правительств. ~ Несмотря на то, что кандидат UCR, Висенте Галло, был популярным защитником антиличностного движения, и стремится скорее, чем вывести UCR из-под власти, привнести в него изменения внутри страны, в качестве члена другой ветви УКР, с которым мы привыкли видеться. ~ И наконец, самым другим кандидатом, возможно, является Альфредо Паласиос. Популярный с активистами и низшими классами и лидером Социалистической партии, он хочет привнести свои социалистические идеи в Аргентину не через революцию, а с помощью демократических средств."
 arg.252.a: "Избрана Сааведра (социальная консерватория)."
 arg.252.b: "Галло избирается (Market Liberal)."
 arg.252.c: "Избирается Паласиос (социальный демократ)."
 arg.253.t: "Великий день"
 arg.253.d: "Немногие ожидали этого, но в какой-то мере это казалось очевидным выводом. Устойчивый рост ЛПА увидел шанс и был готов воспользоваться им. В то время как ведущие члены ЛПА, за которыми следовали воинствующие группировки, прошли через Буэнос-Айрес, чтобы захватить полный и прямой контроль над правительством, разразился хаос."
 arg.253.a: "Переворот в Лос-Анджелесе увенчался успехом, националисты захватили власть."
 arg.253.b: "Консервативные офицеры противостоят сговору, чтобы защитить республику."
 arg.254.t: "Конгресс трудящихся 41 года""
 arg.254.d: "По мере того, как революция оседает, а идеология нашего общества расходится, настало время для конгресса, в котором работники Аргентины будут определять свое руководство. Несмотря на годы изменения политического ландшафта нашей страны. Тем не менее, основные группировки, которые сформированы, ясны. Несмотря на то, что православные коллективисты, представляющие правительство, которое взяло под свой контроль во время революции и привело нас к срыву наших цепей, они возглавляют нынешний председатель Родольфо Гиолди и хотят сохранить нынешнее направление развития нашего социалистического общества. nn restralict grounds, которая не так давно распалась, характеризуясь своими ревизионистскими, неортодоксальными идеями, представляют собой Федеральную народную партию Вангарда, возглавляемую вангаристом Фанни Якобским, предлагающую государственную, скорее авторитарную и дипломатически экспансионистскую доктрину. Многие считают их опасной фракцией, будь то мы или наши враги."
 arg.254.a: "Преобладают православные сборщики."
 arg.254.b: "Анархисты получают поддержку большинства."
 arg.254.c: "Авангарды преуспели."
 arg.300.d: "Сейчас, когда мы переходим в анархистское и синдикалистское общество, скрытые реакционные группы, скрывающиеся под землей, растут и тревожат советы трудящихся в различных провинциях. ~ Применение насилия не является лучшим вариантом, но ничто не может расстроить больше, чем несколько людей, мы должны решить, как действовать."
 arg.300.t: "Реакционные действия, вызывающие нарушения"
 arg.300.a: "Мы ничего не можем сделать."
 arg.300.b: "Примените силу, чтобы избавиться от них."
 arg.301.t: "Трудящиеся процветают в коммуне"
 arg.301.d: "После осуществления ряда мер, направленных на руководство нашей страной, аргентинский пролетариат наконец достиг процветания, и мы можем надеяться на будущее."
 arg.301.a: "Вива эль-Трабаджадор!"
 arg.302.t: "Критикуется доминирующее положение коллективистов"
 arg.302.d: "Ведя революцию, коллективисты получили большое влияние в нашем обществе во всех аспектах."anti-democratic" and rather authoritarian or oligargic. We have failed to reply to these claims."
 arg.302.a: "Это смешно."
 arg.303.t: "Убийство известного министра по делам коллективистов"
 arg.303.d: "Сегодня утром, после встречи в Революционном конгрессе в Буэнос-Айресе, один из самых известных министров правительства Хосе Фернандо Пенелон был убит, когда он шел домой."
 arg.303.a: "Мы найдем преступника и отправим его в суд."
 arg.304.d: "Потенциальная зацепка в расследовании преступления указывает на анархистские методы убийства, и между нами и их фракцией нарастает напряженность. Несмотря на то, что анархисты очень поддерживают правительство и жалуются на преступление, они до сих пор подозреваются в расследовании."
 arg.304.t: "Доказательства указывают на участие анархистов"
 arg.304.a: "Продолжайте расследование анархистов."
 arg.304.b: "Ищите дальнейшие подсказки."
 arg.305.t: "Доказательства короче."
 arg.305.d: "В поисках дополнительных доказательств причастности анархистов к убийству мы не нашли больше никаких улик или намеков на их причастность. Однако мы не нашли гнев их фракции и заставили общее мнение, что правительство выходит за пределы своих границ."
 arg.305.a: "Черт!"
 arg.306.t: "Доказательства участия авангардистов"
 arg.306.d: "Вокальный оппонент авангардистов, это не удивительно, поскольку мы нашли доказательства авангардистской причастности к убийству Пенелон. Похоже, что фракция попыталась подорвать наш порядок и усилить свое влияние на конгресс, ликвидировав своих соперников. Хотя потенциальное действие по аресту заговорщиков может нанести ущерб авангардам и принести нам новый порядок, но опасно и дорого."
 arg.306.a: "Приведите правосудие."
 arg.306.b: "Держите знания при себе."
 arg.307.t: "Арестованные заговорщики-вангуардисты"
 arg.307.d: "Когда мы переехали, мы помогли арестовать заговорщиков, виновных в убийстве, хотя у многих из высокопоставленных членов партии до сих пор были чистые имена, их популярность снизилась, и мы будем бдительно следить за тем, что происходит."
 arg.307.a: "Я люблю запах справедливости по утрам."
 arg.308.t: "Коллективисты и анархисты формируют фронт"
 arg.308.d: "Пренебрегая нашими реформами, как тоталитарными и личными, нелепо, православные коллективисты и анархисты сформировали коалицию в попытке противостоять нашему демократически избранному режиму."
 arg.308.a: "С большой силой."
 arg.309.t: "Великий шаг"
 arg.309.d: "Как нам приходилось иметь дело со всеми врагами вокруг нас, как реакционерами, так и теми, кто считает, что заслуживает называть себя"socialists", we have come to realize that this won't do if we want to lead this nation to greatness with socialist ideals.\n\nIt is time to implement the next step in our plan."
 arg.309.a: "Больше не ждите."
 arg.310.d: "Улицы Буэнос-Айреса были пусты, это было рано утром. Внезапно пришло объявление. Никто не может выйти на улицы сегодня. Несмотря на то, что преданные граждане соблюдали наш приказ. Те, кто не были быстро удалены. Наши силы атаковали штаб-квартиру коалиции коллективистов-анархистов и захватили их руководство. Официально, теперь все политические партии, кроме Партии Священников Федеральной народной Партии, запрещены. Те, кто инакомыслие - преступники. Наше правление будет уважаться, и только таким образом пролетариат достигнет социализма беспрерывно."
 arg.310.t: "Принимаю командование"
 arg.310.a: "Здесь нет места для оппозиции."
 arg.311.t: "Предатели покидают армию."
 arg.311.d: "В рамках нашей политики по искоренению предателей нашей нации несколько видных армейских групп выразили недовольство нашим расследованием и решили дезертировать, оставив нашу армию, как предателей, которые они есть."
 arg.311.a: "Они нам не нужны!"
 arg.312.t: "Упразднение Конституции и демократии"
 arg.312.d: "Как часть политической политики режима, было ясно, что переворот не был задуман как временное поглощение, и поскольку наш славный лидер Домекк руководит нашими силами и нашими людьми, чтобы сделать Аргентину великой, он не правит как наш президент. ~Нет, сегодня она стала официальной, демократическая структура, президент и сенат были упразднены, только истинные патриоты могут править Аргентиной, а не олигархами, скрывающимися под демократией."
 arg.312.a: "Вива Аргентина!"
 arg.313.t: "Арестованные сочувствующие Лигасу"
 arg.313.d: "По мере того, как мы движемся к ликвидации следов, оставшихся от военизированных формирований патриотических лиг, мы находим, что большое число наших людей симпатизируют делу ЛПА, и как таковые представляют угрозу нашей национальной стабильности. Мы будем скучать по солдатам, но это цена свободы."
 arg.313.a: "Мы сделали то, что должны были."
 arg.314.t: "Военный марш в честь режима"
 arg.314.d: "Толпа воссоединилась в Буэнос-Айресе по мере того, как военные маршировали, чествуя храбрую хунту, которая спасла наш народ."
 arg.314.a: "Все будет хорошо."
 arg.315.t: "Незначительные демонстрации против радикального господства"
 arg.315.d: "По мере того, как новое правительство замышляет это, тот факт, что через все случившееся UCR защитил свое доминирующее положение в нашей политике, не предвещал ничего хорошего для всех. Несмотря на то, что через нашу страну произошло несколько небольших демонстраций, и хотя они были мирными и не радикальными, никакого калама, кажется очевидным, что люди не хотят, чтобы это господство продолжалось."
 arg.315.a: "Но сегодня это не закончится."
 arg.316.t: "Прославленная речь президента"
 arg.316.d: ""Today we are reunited, because we all share something in common. We have been all through highs and lows, some, more lows than others. Nonetheless, we have kept on fighting on and are still here today, and we share so much in common. We all belong to this proud nation, to Argentina. And when extremists planned to bring us down we did not give up!\n\nAnd we you didn't know what to believe in, you still gave us the benefit of the doubt, and together, we pulled through. This isn't about me or you or anyone else. It is about us. United, this country will survive through anything, and I hope you are willing to help us, to be part of this."\n\nThe crowds cheered as president Gallo finished his speech. Not that much people attended, but those who did were happy to have come."
 arg.316.a: "Мы будем делать великие вещи."
 arg.317.t: "Люди празднуют перемены в правительстве"
 arg.317.d: "По мере того, как радикальное правительство закончит свое существование, и новое политическое направление возьмет на себя Аргентину, люди вокруг будут радовать, так как перемены наконец придут в нашу нацию, и мирными, демократическими средствами тоже. Несмотря на все наши усилия, мы будем стремиться к тому, чего мы хотим, и теперь мы должны надеяться на лучшее."
 arg.317.a: "Мы сделали это."
 arg.318.t: "Экономический бум по мере завершения новой экономической политики"
 arg.318.d: "Похоже, руководство, которое привезли нам ПДН, было правильным, потому что мы переживаем новый экономический бум из его политики, хотя мы и не ожидаем, что он продлится долго, это то хорошее, чего мы упустили."
 arg.318.a: "Мы выбрали мудро."
 arg.319.t: "Президент народа"
 arg.319.d: "В результате социалистический политик, а теперь президент Альфредо Паласиос, победил на выборах. Реакции неоднозначны, в то время как некоторые более воинствующие элементы нашего общества, похоже, сомневаются в этом выборе, нижестоящие классы, кажется, счастливы и вселяют надежду, особенно профсоюзы."
 arg.319.a: "Надо надеяться."
 arg.320.t: "Мир в нашем обществе"
 arg.320.d: "По мере того, как на социальные вопросы даются ответы, кажется, что хаос, который затронул нашу страну, перестал преследовать нас, и это далекое воспоминание. Мы надеемся на лучшее будущее для каждого аргентинца, и теперь мы будем работать над тем, чтобы это произошло."
 arg.320.a: "EN Unión y Libertad."

 arg.347.t: "Поддержка со стороны аргентинцев"
 arg.347.d: "По мере продолжения нашей кровопролитной войны с предателями, пытавшимися свергнуть эту страну, мы получаем от аргентинцев кое-какие средства, чтобы помочь нам в борьбе. Похоже, что они тоже заинтересованы в нашем конфликте."
 arg.347.a: "Как раз то, что нам нужно!"
 arg.348.t: "Помощь Аргентинской Республики"
 arg.348.d: "Аргентины решили послать нам оружие, чтобы помочь нам в нашей борьбе."
 arg.348.a: "Как раз то, что нам нужно."
 arg.349.t: "Помощь со стороны южных коллективистов"
 arg.349.d: "Пришел проблеск помощи и единство рабочих, так как аргентинский пролетариат, после своей великой революции, решил помочь нашему делу и принёс нам припасы, чтобы помочь нам в нашей борьбе."
 arg.349.a: "Как раз то, что нам нужно!"
 arg.350.t: "Бразильское вмешательство"
 arg.350.d: "Хаос слишком долго боролся в регионе, и сейчас, кажется, опасные группировки близки к доминированию над Бразилией, и мы просто не можем допустить этого. Пришло время вмешаться, и мы погубим популистское государство, которое угрожает и вредит интересам рабочих не только Бразилии, но и всего мира."
 arg.350.a: "Заставь их попробовать боль!"
 arg.351.t: "Аргентинские агрессоры"
 arg.351.d: "Похоже, что в трусливом акте коллизии в своем Союзе поняли, что не могут справиться с этим в одиночку, и призвали своих международных друзей и наших национальных врагов, аргентинцев, не только предав бразильский народ и его родину, но и шокируя всех. Несмотря на это, остается проблеск надежды, так как многие храбрые люди, которые еще не решили, за что бороться, восстали, чтобы помочь Бразилии против этого вторжения иностранных врагов!"
 arg.351.a: "Для Бразилии!"
 arg.352.t: "Сильное вмешательство"
 arg.352.d: "Похоже, что правые боевики Народного государства больше не могут держаться, так как наши силы захватывают их. Проще говоря, наше вмешательство было полезным. Теперь пришло время освободить эти провинции и передать их нашему другу, Союзу. Хотя была предложена интересная мысль. Что, если бы мы... заняли несколько из них, временно. Только для того, чтобы обеспечить их безопасность, так как у Союза есть свои собственные дела. Это может вызвать больше, чем несколько бразилианцев, включая наших товарищей."
 arg.352.a: "Давайте отпустим их Союзу, в духе доброй воли."
 arg.352.b: "Освободи немного, займись чем-нибудь."
 arg.353.t: "Аргентинские товарищи освобождают государственные территории."
 arg.353.d: "В качестве демонстрации товарищества и социалистического интернационализма социалистические социалисты в Аргентине в своем вмешательстве решили освободить южные земли, оккупированные народным государством, чтобы помочь нам."
 arg.353.a: "Вива О Пролетариадо!"
 arg.354.t: "Аргентинские коллективы занимают южную землю."
 arg.354.d: "Хотя их вмешательство было явно направлено на то, чтобы помочь нам, и они освободили некоторые из наших территорий, аргентинцы решили оккупировать некоторые из южных районов Бразилии."
 arg.355.t: "Вмешательство не срабатывает"
 arg.355.d: "Так как наши люди пытались продвинуться вперед месяцами, кажется, что государство просто не откажется от дюйма. Теперь вмешательство было признано провалом внутри страны и нанесло вред нашему правительству. Таким образом, это может быть к лучшему, если мы просто вспоминаем всю операцию."
 arg.355.a: "Это была ошибка."
 arg.355.b: "Нет, революция здесь не остановится."
 arg.356.t: "Судьба Бразилии"
 arg.356.d: "После долгой и кровопролитной войны наш враг, наконец, пал, с ней наступает новая эра для Южной Америки, в эпоху, когда сила Аргентины будет уважаться, но мы столкнулись с проблемой. Оккупированные бразилийские территории просто слишком большие и населенные для того, чтобы непосредственно держать их в руках. Таким образом, кажется, что нам, возможно, потребуется создать в этой зоне дружественное правительство, показав бразильцам, как любезно мы освободили их от проклятия коллективизма. Однако наши собственные амбиции тоже должны быть приняты во внимание!"
 arg.356.a: "Освободи Бразилию и оккупируй Сал."
 arg.356.b: "Освободите всю Бразилию."
 arg.356.c: "Занятие предпочтительнее."
 arg.357.t: "Вторжение Бразилии"
 arg.357.d: "Теперь, когда Бразилия разделена, наконец, настало время нанести удар и расширить наш контроль над этим континентом. Естественно, что это было вторжением в популистов на юге, которые, хотя и более сенсационны, чем марксисты, находятся в лучшем положении, чтобы победить. Поэтому мы не можем больше ждать. Время Инваду!"
 arg.357.a: "Мы справимся."
 arg.358.t: "Оппортунистские аргентинцы"
 arg.358.d: "Ужасно и оппортунистично, аргентинцы - это неудачники, обманывающие Великий, и традиции неравной войны, и жаждущие быть больше, чем они есть или заслуживают. Не удивительно, что они решили использовать неустойчивое положение нашей нации от рук предателей и олигархов, чтобы эксплуатировать нас и вторгаться в нас. Но мы не ослабели! Поскольку бразильская нация доблестна и безжалостна, многие храбрые люди, которые не хотели сражаться за то, чтобы навредить своим соотечественникам, восстали и присоединились к нам в защите Бразилии от этих ядовитых захватчиков."
 arg.358.a: "Они нас не убьют."
 arg.359.t: "Победа в Бразильском фронте?"
 arg.359.d: "По мере столкновения наших войск и перемещения фронта, кажется, мы загнали народное государство в угол, и поэтому мы можем послать мирное предложение, взяв их южные провинции и расширив наш региональный контроль, ослабив в целом Бразилию. Другой альтернативой могло бы быть продолжение войны, но это может быть дорогостоящим и непопулярным для нашего народа, который жаждал победы, подобной этой."
 arg.359.a: "Пошлите мирное предложение."
 arg.359.b: "Это полная война."
 arg.360.t: "Предложение мира?"
 arg.360.d: "Поскольку вероломные аргентинцы использовали нашу слабость и разорили фронт, у нас, похоже, нет другого выбора, кроме как уступить им наши южные земли, ослабив нас."
 arg.360.a: "Прими предложение."
 arg.360.b: "Отклони это."
 arg.361.t: "Бразильцы отвергают наше предложение."
 arg.361.d: "Удивительно, что народное государство не приняло наше великодушное предложение."
 arg.361.a: "Хорошая яркая сторона."
 arg.362.t: "Судьба Бразилии"
 arg.362.d: "После долгой и кровопролитной войны наш враг, наконец, пал, с ней наступает новая эра для Южной Америки, в эпоху, когда будет уважаться мощь Аргентины, однако мы столкнулись с весьма серьезной проблемой. Оккупированные бразилийские территории просто слишком велики и густонаселены, и поэтому нам, пожалуй, необходимо создать в этой зоне дружественный режим, способный справиться с диссидентами и показать бразильцам, насколько мы милосердны."
 arg.362.a: "Освободи Бразилию и оккупируй Сал."
 arg.362.b: "Освободите всю Бразилию."
 arg.362.c: "Занятие предпочтительнее."
 arg.363.t: "Вторжение потерпело неудачу"
 arg.363.d: "По прошествии нескольких месяцев бразильцы упорно держатся, военные усилия привели лишь к потерям, и воспоминания о прошлых неудачах вновь вторгаются в наш народ. Похоже, нам придется отменить это вторжение, иначе люди решат нас отзвонить."
 arg.363.a: "Отменить вторжение"
 arg.363.b: "Не сдавайся!"
 arg.400.t: "Оборудование [From.GetName]"
 arg.400.d: "С начала гражданской войны на нас смотрят, и, хотя многие осуждают то, за что мы выступаем, некоторые видят, что в фалангизме мы можем найти лучшее будущее для Испании, так же мы видим [From.GetNameDef], что посылает нам оружие для продолжения нашей войны, в знак сочувствия и уважения к нашей великой судьбе."
 arg.400.a: "Мы пригодимся."
 arg.401.t: "Оборудование [From.GetName]"
 arg.401.d: "Это было нелегко, война никогда не бывает, но мы держали свою позицию и боролись за Испанию, хотя большая часть нашей поддержки приходила от наших союзников в Континентальном сосуществовании, кажется, что они не единственные наши друзья, так как [From.GetNameDef] решили послать нам пехотную технику, чтобы содействовать нашему делу, действительно, проявление солидарности между республиками."
 arg.401.a: "Подарок, который мы можем использовать."
 arg.402.t: "Оборудование [From.GetName]"
 arg.402.d: "Революция была проблемой, но мы никогда не теряли ни нашего внимания, ни наших целей, но материальные потребности были постоянной трудностью, хотя некоторые друзья на востоке помогли. Теперь появился другой друг, как [From.GetNameDef] в показе международного товарищества послали нам оборудование для борьбы с нашей революцией. Независимо от трудностей, пролетариат всегда будет поддерживать друг друга."
 arg.402.a: "Давайте используем его немедленно."
 arg.403.t: "Самолёты из [From.GetName]"
 arg.403.d: "Война ведется не только с оружием и танками. Контроль над небом имеет основополагающее значение для контроля над противником, как и мы. К счастью для нас, это также известно, и они решили поделиться некоторыми идеями, которые у нас есть, чтобы поддержать нас материально, отправив истребители, чтобы помочь нашим военным усилиям."
 arg.403.a: "Мы найдем им хорошую пользу."
 arg.404.t: "Самолёты из [From.GetName]"
 arg.404.d: "Для того чтобы победить в любом конфликте в наши дни, нужны хорошо оснащенные военно-воздушные силы. Однако эта война оставила нас в очень малом числе ресурсов, помощь — это то, что вы никогда не убегаете, пока все не потеряете. И [From.GetNameDef] решил дать нам немного, посылая истребители для укрепления наших военно-воздушных сил, в знак солидарности с нашими республиканскими идеалами."
 arg.404.a: "Подарок, который мы можем использовать."
 arg.405.t: "Самолёты из [From.GetName]"
 arg.405.d: "Не достаточно наполнить улицы храбрыми и мятежными людьми, к сожалению, поле боя эволюционировало, чтобы охватить даже небо, но нам трудно найти запасы, и нам нужны находчивые военно-воздушные силы. К счастью, работники [From.GetNameDef] решили помочь нам, отправив нам истребители, которые будут продвигать нашу борьбу."
 arg.405.a: "Давай поставим их на полёт."
 arg.406.t: "Мужчины из [из "Узнай имя"]"
 arg.406.d: "По мере того, как война поглотила наше общество, каждый должен отдать все и присоединиться к хорошей борьбе, для того, чтобы испанская истинная судьба была достигнута, с национальной победой, но даже тогда люди никогда не превосходят друг друга, и нам нужно то, что мы можем получить, чтобы заполнить поле боя. [From.GetNameDef] заполнены храбрыми людьми и отправили кого-то из своих лучших, чтобы сражаться с нами."
 arg.406.a: "Добро пожаловать на борт, ребята."
 arg.407.t: "Мужчины из [из "Узнай имя"]"
 arg.407.d: "Война - это чума, которая распространяется на все уголки. Никто не может спасти себя, так как каждый должен быть готов бороться за будущее Испании. Но жизнь нашего народа - это ценный ресурс, который мы должны постоянно рисковать, и как таковой любая помощь приветствуется. [From.GetNameDef] послал некоторых из своих людей на помощь нашему делу, поскольку они верят в наши ценности и идеалы и знают, что они правы."
 arg.407.a: "Как раз то, что нам нужно."
 arg.408.t: "Мужчины из [из "Узнай имя"]"
 arg.408.d: "По мере того, как народ Испании выступает против угнетения олигархов, виртуозной элиты, которая на протяжении веков держала их в заложниках, мы нашли, что мы отдаем все наши силы, и поэтому любая помощь, которую мы можем получить, крайне важна, и, к счастью, [From.GetNameDef] поняла, что, демонстрируя солидарность со своими коллегами, они послали храбрых людей, готовых сделать что угодно для рабочего народа, сражаться с нами."
 arg.408.a: "Давайте продолжим."
 arg.409.t: "Оборудование [From.GetName]"
 arg.409.d: "С начала гражданской войны на нас смотрят, и, хотя многие осуждают то, что мы отстаиваем, некоторые видят, что главенство национализма и сильного правительства - это то, что нужно Бразилии, и видят это [From.GetNameDef], которое посылает нам оружие для продолжения нашей войны, в знак сочувствия и уважения к нашей великой судьбе."
 arg.409.a: "Мы пригодимся."
 arg.410.t: "Оборудование [From.GetName]"
 arg.410.d: "Это было нелегко, война никогда не бывает, но мы держали свою позицию и боролись за выживание Республики, так как экстремизм окружает нас. Пока враги находятся со всех сторон, кажется, что мы не одни, так как [From.GetNameDef] решили послать нам пехотную технику, чтобы содействовать нашему делу. Поистине проявление солидарности между демократиями."
 arg.410.a: "Подарок, который мы можем использовать."
 arg.411.t: "Оборудование [From.GetName]"
 arg.411.d: "Революция была проблемой, но мы никогда не теряли ни нашего внимания, ни наших целей. Однако материальные потребности были постоянной проблемой, и промышленных мощностей Бразилии пока недостаточно. Теперь появился другой друг, как [From.GetNameDef] в показе международного товарищества послали нам оборудование для борьбы с нашей революцией. Независимо от трудностей, пролетариат всегда будет поддерживать друг друга."
 arg.411.a: "Давайте используем его немедленно."
 arg.412.t: "Самолёты из [From.GetName]"
 arg.412.d: "Война ведется не только с оружием и танками. Контроль над небом имеет основополагающее значение для контроля над противником, как и мы. К счастью для нас, это также известно, и они решили поделиться некоторыми идеями, которые у нас есть, чтобы поддержать нас материально, отправив истребители, чтобы помочь нашим военным усилиям."
 arg.412.a: "Мы найдем им хорошую пользу."
 arg.413.t: "Самолёты из [From.GetName]"
 arg.413.d: "Для того чтобы победить в любом конфликте в наши дни, нужны хорошо оснащенные военно-воздушные силы. Однако эта война оставила нас в очень малом числе ресурсов, помощь — это то, что вы никогда не убегаете, пока все не потеряете. И [From.GetNameDef] решил дать нам немного, посылая истребители для укрепления наших военно-воздушных сил, в знак солидарности с нашими республиканскими идеалами."
 arg.413.a: "Подарок, который мы можем использовать."
 arg.414.t: "Самолёты из [From.GetName]"
 arg.414.d: "Не достаточно наполнить улицы храбрыми и мятежными людьми, к сожалению, поле боя эволюционировало, чтобы охватить даже небо, но нам трудно найти запасы, и нам нужны находчивые военно-воздушные силы. К счастью, работники [From.GetNameDef] решили помочь нам, отправив нам истребители, которые будут продвигать нашу борьбу."
 arg.414.a: "Давай поставим их на полёт."
 arg.415.t: "Мужчины из [из "Узнай имя"]"
 arg.415.d: "По мере того, как война поглотила наше общество, каждый должен отдать все и присоединиться к хорошей борьбе, для того, чтобы испанская истинная судьба была достигнута, с национальной победой, но даже тогда люди никогда не превосходят друг друга, и нам нужно то, что мы можем получить, чтобы заполнить поле боя. [From.GetNameDef] заполнены храбрыми людьми и отправили кого-то из своих лучших, чтобы сражаться с нами."
 arg.415.a: "Добро пожаловать на борт, ребята."
 arg.416.t: "Мужчины из [из "Узнай имя"]"
 arg.416.d: "Война - это чума, которая распространяется на все стороны. Никто не может спасти себя, так как все должны быть готовы бороться за выживание демократии в Бразилии. Но жизнь нашего народа - это ценный ресурс, который мы должны постоянно рисковать, и как таковой любая помощь приветствуется. [From.GetNameDef] послал некоторых из своих людей на помощь нашему делу, поскольку они верят в наши ценности и идеалы и знают, что они правы."
 arg.416.a: "Как раз то, что нам нужно."
 arg.417.t: "Мужчины из [из "Узнай имя"]"
 arg.417.d: "По мере того, как народ Бразилии восстает против угнетения олигархов и угрозы националистов, мы, рабочие, оказались готовыми отдать все наши силы в этой борьбе, и поэтому любая помощь, которую мы можем получить, имеет важное значение, и, к счастью, мы поняли, что, демонстрируя солидарность со своими коллегами, мы послали храбрых людей, готовых сделать что угодно для трудящихся, сражаться с нами."
 arg.417.a: "Давайте продолжим."


 #decisions
 ARG_conquest_of_south_atlantic: "Заголовок в Южной Атлантике"
 ARG_conquest_of_south_atlantic_desc: "Наше естественное владение, море, которое смывает наше побережье и приветствует нас с восходом солнца, Южной Атлантикой, к сожалению, все еще находится под контролем колониальных держав."
 SAM_SCW_matters: "Хаос в Испании - иностранная помощь"
 SAM_SCW_matters_desc: "Не только Испания потеряла великую империю, которую они держали давным-давно, но и теперь они даже не могут контролировать свою родину, многие стороны борются за превосходство на Иберийском полуострове, и, может быть, пришло время оставить прошлое позади и помочь нам, как мы можем."
 SAM_send_weapons_falange: "Отправьте оружие фалангистам"
 SAM_send_weapons_falange_desc: "Многие группировки, которые сражаются в Испании, ближе к нашим идеалам, однако фалангисты, не очень сплоченная группа, основанная на националистах, традиционалистах, популистах и нескольких движениях правого толка, их победа будет способствовать распространению наших идеалов в мире, что, возможно, будет хорошей идеей."
 SAM_send_weapons_repspain: "Отправьте оружие республиканцам"
 SAM_send_weapons_repspain_desc: "Многие группировки, которые сражаются в Испании, а те, кто ближе к нашим идеалам, несомненно, являются республиканцами. Борьба за республику, которая должным образом представляет народ, поддерживая демократические ценности, а также мы оба боролись с оковами испанской монархии, делает нас вероятными друзьями."
 SAM_send_weapons_popfront: "Отправьте оружие на Народный фронт"
 SAM_send_weapons_popfront_desc: "Многие группировки борются в Испании, и чем ближе к нашим идеалам, тем ближе Народный фронт, коалиция различных левых и социалистических групп, борющихся за рабочих Испании, тем более очевидно, что это - выбор, отправить им снаряжение, чтобы помочь их революции, поддержать распространение социализма в мире и продемонстрировать товарищество."
 SAM_send_planes_falange: "Отправьте самолеты фалангистам"
 SAM_send_planes_falange_desc: "Многие группировки, которые борются в Испании, ближе к нашим идеалам, однако фалангисты, не очень сплоченная группа, основанная на националистах, традиционалистах, популистах и нескольких правых движениях, их победа будет способствовать распространению наших идеалов в мире, что, возможно, будет хорошей идеей."
 SAM_send_planes_repspain: "Отправьте самолет республиканцам"
 SAM_send_planes_repspain_desc: "Многие группировки, которые сражаются в Испании, и те, кто ближе к нашим идеалам, несомненно, являются республиканцами. Борьба за республику, которая должным образом представляет народ, поддерживая демократические ценности, а также мы оба боролись с оковами испанской монархии, делают нас вероятными друзьями. Таким образом, это естественное и прочное решение отправить к ним истребители, чтобы поддержать Республиканские военно-воздушные силы."
 SAM_send_planes_popfront: "Отправьте самолет народному фронту"
 SAM_send_planes_popfront_desc: "Многие группировки борются в Испании, и чем ближе к нашим идеалам, тем ближе Народный фронт, коалиция различных левых и социалистических групп, борющихся за рабочих Испании, тем очевиднее, что они отправляют им истребители, чтобы помочь им в бою с их революцией, поддерживая распространение социализма в мире и как проявление товарищества."
 SAM_send_men_falange: "Послать людей сражаться за фаланж"
 SAM_send_men_falange_desc: "Многие группировки, которые сражаются в Испании, ближе к нашим идеалам, однако фалангисты, не очень сплоченная группа, основанная на националистах, традиционалистах, популистах и нескольких правых движениях, их победа будет способствовать распространению наших идеалов в мире, что пошлет наших храбрых людей проверить их мощь и помочь в борьбе, может быть хорошей идеей."
 SAM_send_men_repspain: "Послать мужчин в бой за Республику"
 SAM_send_men_repspain_desc: "Многие группировки, которые сражаются в Испании, и те, кто ближе к нашим идеалам, несомненно, являются республиканцами. Борьба за республику, которая должным образом представляет народ, поддерживая демократические ценности, а также мы оба боролись с оковами испанской монархии, делает нас вероятными друзьями. Послание некоторых из наших лучших, чтобы помочь укрепить их ряды, было бы хорошей идеей, если бы мы намеревались поддержать их."
 SAM_send_men_popfront: "Послать людей сражаться за народный фронт"
 SAM_send_men_popfront_desc: "Многие из них борются в Испании, и чем ближе к нашим идеалам, тем ближе Народный фронт, коалиция различных левых и социалистических группировок, борющихся за рабочих Испании, тем не менее, им нужна помощь, и наш народ, храбрый защитник трудящихся мира, готов бороться за дело."


 SAM_BCW_matters: "Бразильская гражданская война - иностранная помощь"
 SAM_BCW_matters_desc: "Континент впадает в хаос по мере того, как Бразилия впадает в хаос в ходе титанической гражданской войны. В настоящее время в регионе усиливается политическая нестабильность, однако, если мы хотим оказать влияние и помощь фракции в Бразилии и вместе с ней — в судьбе Южной Америки."
 SAM_send_weapons_bepis: "Послать оружие в народное государство"
 SAM_send_weapons_bepis_desc: "Многие группировки, которые борются в Бразилии, близкие к нашим идеалам, или к их общей идее, это популисты, не очень сплоченная группа, основанная на революционных националистах, католических традициях, немецких популистах и нескольких правых движениях, их победа будет способствовать распространению наших идеалов на континенте, и, таким образом, отправка им оборудования может быть хорошей идеей."
 SAM_send_weapons_bra: "Отправить оружие в Республику"
 SAM_send_weapons_bra_desc: "Многие из этих группировок борются в Бразилии, а те, за кого мы отстаиваем, несомненно, являются республиканцами, старая республика, полна демократических традиций и стремления постепенно реформировать свою страну, с тем чтобы помочь народу в мире, приближает его к нам, а также наши исторические связи с его правительством, что является естественным и твердым выбором - направить им снаряжение не для нас, а для бразильского народа и его демократии."
 SAM_send_weapons_ubr: "Отправить оружие в Союз Бразилии"
 SAM_send_weapons_ubr_desc: "Многие из этих группировок борются в Бразилии, и когда-то самыми близкими к нашим идеям являются социалистический союз, коалиция различных левых и социалистических групп, борющихся за революцию в интересах бразильских рабочих, это очевидный выбор - послать им снаряжение, чтобы помочь их революции, поддержать распространение социализма в Южной Америке, создать потенциально огромного союзника и как проявление товарищества."
 SAM_send_planes_bepis: "Отправьте самолеты в народный штат"
 SAM_send_planes_bepis_desc: "Многие группировки, которые борются в Бразилии, близкие к нашим идеалам, или общей идее их, это популисты, не очень сплоченная группа, основанная на революционных националистах, католических традициях, немецких популистах и нескольких правых движениях, их победа будет способствовать распространению наших идеалов на континенте, и, таким образом, их посадка на самолёты может быть хорошей идеей."
 SAM_send_planes_bra: "Отправить самолет в Республику"
 SAM_send_planes_bra_desc: "Многие группировки, которые борются в Бразилии, — это, несомненно, республиканцы, старая республика, полная демократических традиций и стремления постепенно реформировать свою страну, с тем чтобы помочь народу в мире, приближает его к нам, а также наши исторические связи с его правительством, и поэтому это естественное и прочное решение направить к ним истребители, поддержать законные бразильские военно-воздушные силы."
 SAM_send_planes_ubr: "Отправить самолет в Союз Бразилии"
 SAM_send_planes_ubr_desc: "Многие из этих группировок борются в Бразилии, и когда-то самыми близкими к нашим идеям являются социалистический союз, коалиция различных левых и социалистических групп, борющихся за революцию в интересах бразильских рабочих, это очевидный выбор - послать им истребители для содействия военному сражению их революции, поддерживая распространение социализма на континенте и как проявление международного товарищества."
 SAM_send_men_bepis: "Послать мужчин на борьбу за народное государство"
 SAM_send_men_bepis_desc: "Многие фракции, которые сражаются во многих, являются группировками, которые сражаются в Бразилии. Одна из них ближе к нашим идеалам, или общей идее о них, это популисты. Не очень сплоченная группа, основанная революционными националистами, католиками, немецкими популистами и несколькими правыми движениями, их победа увеличила бы распространение наших идеалов на континенте, в результате чего наши храбрые люди могли бы испытать свою мощь и помочь в борьбе, может быть хорошей идеей."
 SAM_send_men_bra: "Послать мужчин в бой за Республику"
 SAM_send_men_bra_desc: "Многие группировки, которые борются в Бразилии, являются, несомненно, республиканцами, старая республика, полна демократических традиций и стремления постепенно реформировать свою страну, чтобы помочь народу, в мире, приближает его к нам, а также наши исторические связи с его правительством."
 SAM_send_men_ubr: "Послать мужчин в бой за Союз Бразилии"
 SAM_send_men_ubr_desc: "Многие группировки, которые борются в Бразилии, когда-то самыми близкими к нашим идеям являются социалистический союз, коалиция различных левых и социалистических групп, борющихся за революцию в интересах бразильских рабочих, действительно, им нужна помощь, которую они могут получить, и наш народ, храбрые защитники трудящихся мира, готовы бороться за дело."



 ARG_BCW_gambits: "Бразильские гражданские военные гамбиты"
 ARG_BCW_gambits_desc: "Сейчас, когда наш самый могущественный соперник, Бразилия, впадает в хаос, под сомнением находится стабильность всего региона."
 ARG_help_the_republic: "Помогите Республике"
 ARG_help_the_republic_desc: "Поскольку идеологические разногласия угрожают выживанию Бразилии и подрывают мир, мы должны сделать все возможное, чтобы поддержать законную республику в ее внутреннем конфликте."
 ARG_break_peoples_state: "Разрушить бразильское народное государство"
 ARG_break_peoples_state_desc: "Ведущийся четкой националистической, правой риторикой и идеалами, бразильское народное государство разделяет с нами несколько идей. Ясно, что ни один из нас не может работать вместе, хотя мы оба стремимся доминировать над Южной Америкой. Таким образом, разумная вещь, которую мы должны сделать, ясна, вторгнуться в нее и ослабить Бразилию в целом."
 ARG_help_peoples_state: "Помощь бразильскому народу"
 ARG_help_peoples_state_desc: "Возможно, тот, кто лучше отреагирует на наши идеи, бразильское народное государство, все еще находится под угрозой со стороны старых республиканских олигархов, а также грязных марксистов в джунглях."
 ARG_help_brunion: "Помощь Союзу Бразилии"
 ARG_help_brunion_desc: "Поднявшись против олигархического угнетения, бразильские рабочие мужественно стоят в своей собственной революции, но им нужна помощь, поскольку их реакционные враги многочисленны."
 ARG_collienvasion: "Вмешательство в гражданскую войну в Бразилии"
 ARG_collienvasion_desc: "Поскольку стабильность в регионе и права трудящихся находятся под угрозой, мы должны встать и вмешаться в гражданскую войну в Бразилии, разрушив любую силу бразильского народа и тем самым позволив Союзу Бразилии добиться успеха."
 ARG_seize_falklands: "Схватить Лас-Мальвинские острова"
 ARG_seize_falklands_desc: "Южноатлантические острова, известные англичанам как Фолкленды и острова Южная Георгия, являются лишь нашим естественным правом при рождении. Мы не можем просто стоять здесь, пока они осуществляют свой империалистический контроль над островами, которые должны принадлежать нам."

