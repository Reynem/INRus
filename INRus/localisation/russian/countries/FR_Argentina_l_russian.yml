 #hello

 ARG_FUHRERREICH_DESC: "Видная республика с сильной экономикой и позитивными перспективами, любой, кто смотрит извне, говорил бы о великих вещах, ожидающих Аргентину. Однако более глубокий взгляд выявил бы глубокие и широкие разногласия, которые были сформированы в аргентинском обществе с годами, и как показывает себя радикализованное общество и политическая напряженность нарастают, если приливы поднимутся, Аргентинская Республика может оказаться просто бумажным тигром."


 ##focuses##
 ARG_recognize_paraguayan_unions: "Признать парагвайские союзы"
 ARG_recognize_paraguayan_unions_desc: "В рамках наших усилий по интеграции парагвайского народа в наш социалистический союз мы нашли националистическую напряженность довольно устойчивой."
 ARG_recognize_uruguayan_unions: "Признать уругвайские союзы"
 ARG_recognize_uruguayan_unions_desc: "В рамках наших усилий по интеграции уругвайского народа в наш социалистический союз мы нашли националистическую напряженность довольно упорной. Если мы дадим их профсоюзам автономию и признаем их местную свободу, они будут чувствовать себя как дома."
 ARG_sunrise_in_argentina: "Восход солнца в Аргентине"
 ARG_sunrise_in_argentina_desc: "В Аргентине начинается новый год, поскольку проблемы прошлого должны быть оставлены позади, и мы смотрим в светлое будущее."
 ARG_defend_labour: "Защита труда"
 ARG_defend_labour_desc: "Как работники, выступающие за расширение прав, мы должны встать и показать, что мы за аргентинского работника."
 ARG_call_for_plurality: "Призыв к многообразию"
 ARG_call_for_plurality_desc: "Учитывая критику нашего режима, мы должны продемонстрировать, что мы поддерживаем сильную демократию, призывая к плюрализму в законодательстве."
 ARG_improving_our_model: "Совершенствование нашей модели"
 ARG_improving_our_model_desc: "Наша радикальная модель, основанная на солидарности, но умеренной, должна постоянно совершенствоваться и видоизменяться с учетом социальных и экономических потребностей Аргентины."
 ARG_those_we_have_lost_desc: "Мы не забудем храбрые жизни, которые были потеряны во время войны Чако, вместо этого, мы будем объединяться, помня их и будем бороться вместе в их честь."
 ARG_those_we_have_lost: "Тех, кого мы потеряли"
 ARG_bringing_all_together: "Соберем все вместе"
 ARG_bringing_all_together_desc: "Поскольку внутренние проблемы хотят разрушить наш благородный народ, мы должны сделать все возможное для того, чтобы призвать к единству в Аргентине, даже в различных мыслях и ситуациях."
 ARG_peace_with_the_opposition: "Мир с оппозицией"
 ARG_peace_with_the_opposition_desc: "Сейчас, как никогда ранее, диалог открыт, и, как представляется, политическая ситуация в нашей стране улучшается."
 ARG_sunrise_crash: "Рассветная катастрофа"
 ARG_sunrise_crash_desc: "Когда солнце поднимается, появляется эффект Лондонского рынка, разрушая нашу экономику."
 ARG_a_red_republic: "Красный союз"
 ARG_a_red_republic_desc: "Как старый"democratic" order falls, a new republic arises, tinted red by the blood of the valiant workers that strive towards a better future for Argentina."
 ARG_collectivist_revolution: "Коллегиалистская революция"
 ARG_collectivist_revolution_desc: "По мере того как революция захватывает Аргентину, именно коллективисты появились, чтобы взять на себя руководство этой новой красной республикой."
 ARG_nationalize_industry: "Национализация промышленности"
 ARG_nationalize_industry_desc: "Хотя и не самый простой процесс, учитывая исторические связи Аргентины с иностранными рынками, национализация наших отраслей промышленности и освобождение их от рыночного ярмо приведут к великим вещам."
 ARG_collectivize_agriculture: "Объединение сельского хозяйства"
 ARG_collectivize_agriculture_desc: "Сельское хозяйство — это значительная часть нашей экономики, и оно необходимо для нашего поддержания, путем захвата частных сельскохозяйственных земель и коллективизации сельскохозяйственного производства, мы можем обеспечить наилучшие условия для развития нашего сельского хозяйства."
 ARG_productive_redistribution: "Перераспределение производственных ресурсов"
 ARG_productive_redistribution_desc: "Слишком долгое неравноправие нанесло ущерб нашей стране, и это уже не так, поскольку средства производства находятся в руках рабочих, и общество, наконец, сможет разделить и предоставить каждому в соответствии с его потребностями."
 ARG_federal_councils: "Федеральные советы"
 ARG_federal_councils_desc: "Наша страна имеет федеральную историю, и хотя мы не восхищаемся жестокостью прошлого, мы считаем, что есть полезные вещи для этой системы, давайте создадим федеральные советы трудящихся, которые предоставят определенную автономию социалистическим штатам, если она будет одобрена партией, конечно."
 ARG_central_union_leadership: "Руководство федерального союза"
 ARG_central_union_leadership_desc: "По мере того, как мы создаем государственный аппарат нашего социалистического общества, мы обнаружили, что сильное центральное руководство в рамках коллективистской партии федерации таким образом, что рабочие координируются в своих усилиях, может быть лучшим способом управления нашим обществом."
 ARG_revolutionary_guards: "Революционные гвардии"
 ARG_revolutionary_guards_desc: "Как реакционеры вокруг и внутри нас, мы не можем позволить им делать то, что им угодно, и подвергать опасности нашу революцию, создавая революционный корпус охраны, мы можем делать то, что нам нужно для защиты диктатуры пролетариата."
 ARG_socialist_education: "Социалистическое образование"
 ARG_socialist_education_desc: "Реакционные и националистические идеи распространяются старой образовательной системой, благодаря расширению возможностей системы образования, ее реформированию в новом свете, а также инвестициям в высшее образование, мы можем обеспечить наше будущее развитие."
 ARG_state_economy: "Государственная экономика"
 ARG_state_economy_desc: "По мере того как мы усилили контроль над многими секторами нашей экономики, мы можем с гордостью посмотреть и сказать, что экономика полностью контролирует рабочих через наше социалистическое государство."
 ARG_red_sunrise: "Красный восход солнца"
 ARG_red_sunrise_desc: "Несмотря на то, что мы прошли через многое, солнце снова восходит на Аргентину, ее свет уже не золотистый, а красный, так как истинное солнце сияет внутри каждого из аргентинских рабочих."
 ARG_stand_for_the_federation: "Защищать Республику"
 ARG_stand_for_the_federation_desc: "Какой бы кризис мы ни пережили, Аргентина преодолеет его до тех пор, пока мы будем вместе."
 ARG_radicalism_alone: "Один радикализм"
 ARG_radicalism_alone_desc: "Внутренние разногласия только вредят нам, а также вмешательство других партий."
 ARG_help_the_unions: "Помощь профсоюзам"
 ARG_help_the_unions_desc: "По мере падения нашей экономики и роста безработицы мы должны делать все возможное, чтобы помочь ослабленным профсоюзам."
 ARG_stop_the_strikes: "Остановить удары"
 ARG_stop_the_strikes_desc: "Хотя мы понимаем, что ситуация ужасна, мы не можем мириться с проявлениями в это время, когда мы должны быть едины, мы будем поддерживать рабочих до тех пор, пока они поддерживают нас, и как таковые мы положим конец забастовкам и запретим экстремистские группы, стоящие за ними."
 ARG_subsidize_industry: "Субсидирование промышленности"
 ARG_subsidize_industry_desc: "Поскольку мы больше не можем зависеть от иностранного рынка, чтобы поддерживать нас, давайте вкладывать наши собственные государственные ресурсы в поддержку аргентинских отраслей промышленности, чтобы поддерживать себя."
 ARG_lend_to_the_employers: "Ссуда работодателям"
 ARG_lend_to_the_employers_desc: "По мере того, как бизнес закрывается повсюду, безработица быстро растет, давайте одолжим неудачному бизнесу, чтобы выжить, так мы сможем бороться с безработицей."
 ARG_el_nuevo_pacto: "Нуэво пакто"
 ARG_el_nuevo_pacto_desc: "Поскольку в нашей стране происходят радикальные новые изменения и меняется наша политика, мы должны заключить новый пакт между нашим правительством и нашим народом, пакт о взаимной поддержке."
 ARG_schooling_investment: "Инвестиции в школьное образование"
 ARG_schooling_investment_desc: "Для диверсификации нашей производственной базы и содействия социальной мобильности необходимо сильное образование, давайте вкладывать в него средства!"
 ARG_jobs_for_the_jobless: "Создание рабочих мест"
 ARG_jobs_for_the_jobless_desc: "В это время люди не нуждаются в благополучии, им нужна работа, чтобы поддерживать свои семьи, и создание рабочих мест должно быть главной политикой нашего правительства."
 ARG_ISI: "МСИ"
 ARG_ISI_desc: "Промышленное развитие - это экономическая модель, в основе которой лежит вмешательство правительства и определение рынка и экономики, с тем чтобы помочь ему развиваться и поддерживать таким образом, чтобы это приносило пользу народу."
 ARG_sunrise_again: "Солнце снова извергается"
 ARG_sunrise_again_desc: "По мере того, как мы решим наши внутренние проблемы, мы можем гордиться тем, что солнце вновь восходит в нашей стране, и, похоже, все снова идет по нашему пути."
 ARG_pact_with_the_lpa: "Соглашение с ЛПА"
 ARG_pact_with_the_lpa_desc: "Несмотря на опасное влияние, поддержка ЛПА необходима нашему правительству, чтобы выжить, и вместе мы будем сотрудничать, чтобы делать великие вещи."
 ARG_deal_with_discontent: "Разрешить проблему недовольства"
 ARG_deal_with_discontent_desc: "Пока мы понимаем, в какой плохой ситуации мы находимся, открытое недовольство многих никак не помогает, давайте порицаем людей, которые помогают этой проблеме в наших попытках стабилизироваться."
 ARG_support_paramilitaries: "Поддержка военизированных формирований"
 ARG_support_paramilitaries_desc: "Хотя военизированные отряды, созданные ЛПА, широко критикуются за незаконную деятельность и насилие, они оказывают большую помощь в поддержании контроля и безопасности в нашей стране, и мы будем поддерживать их."
 ARG_reel_in_the_unions: "Крысы в профсоюзах"
 ARG_reel_in_the_unions_desc: "Многие права, которые мы предоставили профсоюзам, наполнили их новыми чаяниями, чаяниями, которые нам не нужны, ограничивая профсоюзы, мы сможем лучше работать над решением проблем, с которыми может столкнуться аргентинский рабочий."
 ARG_create_industry: "Создать промышленность"
 ARG_create_industry_desc: "Аргентина слишком долго зависела от иностранных инвестиций, единственное промышленное развитие, которому мы можем доверять, это лучшее, аргентинское, и поэтому мы будем финансировать создание новых аргентинских промышленных зон, находящихся под надлежащим патриотическим контролем."
 ARG_expand_the_ligas: "Расширить Ligas"
 ARG_expand_the_ligas_desc: "Огромных преимуществ, которые нам дали патриотические лиги, достаточно для того, чтобы мы осознали, что если мы расширим лиги и превратим их в регулируемый орган, пользующийся поддержкой правительства, мы укрепим нашу власть над обществом."
 ARG_national_radicalism: "Патриотическое образование"
 ARG_national_radicalism_desc: "Нам нужно, чтобы молодежь Аргентины руководствовалась патриотическими националистическими идеалами превращения Аргентины в великую, поэтому мы должны уделять особое внимание образованию, как нижнему, так и высшему."
 ARG_autarquia_nacional: "Национальная автаркия"
 ARG_autarquia_nacional_desc: "Мы достигли автоархии, и Аргентина сейчас должным образом поддерживается сама по себе как сильная независимая страна, которая не нуждается в иностранных инвестициях."
 ARG_the_new_argentina: "Новая Аргентина"
 ARG_the_new_argentina_desc: "Новый порядок восторжествовал как настоящий патриотический режим правит Аргентиной, теперь солнце восходит и кривится перед нами, как даже его свет боится титанов, которыми мы являемся."
 ARG_argentinian_corporatism: "Аргентинский корпоратизм"
 ARG_argentinian_corporatism_desc: "Создавая корпоратистскую структуру, в которой национальное государство полностью контролируется, но заключает соглашения с корпорациями и официальными национальными союзами производственного сектора, мы можем найти подлинное патриотическое экономическое решение."
 ARG_rebuilding_the_army: "Восстановление армии"
 ARG_rebuilding_the_army_desc: "Дорогие и разрушительные последствия войны в Чако ослабили нашу армию, и экономический и политический хаос оставил ее в заблуждении, пришло время, наконец, восстановить наши силы обороны."
 ARG_moving_on: "Двигаемся дальше"
 ARG_moving_on_desc: "Время прошло, раны были нанесены, зажили, угрожали открыться снова, но когда мы смотрим в будущее, мы не должны больше бояться и двигаться дальше."
 ARG_harsh_lessons: "Жестокие уроки"
 ARG_harsh_lessons_desc: "Мы не будем глупыми, мы научимся на своих прошлых ошибках и убедимся, что мы умеем стоять в каждой битве."
 ARG_a_revolutionary_army: "Революционная армия"
 ARG_a_revolutionary_army_desc: "Когда революция пришла в Аргентину, оковы старого режима должны были начаться, и с ним старая олигархическая сила, которую мы называли армией."
 ARG_our_red_militias: "Наши красные ополчения"
 ARG_our_red_militias_desc: "Храбрые боролись за то, чтобы освободить нас от олигархических оков, они будут нашими ополченцами, нашими гордыми и безжалостными людьми, которые сделают что угодно для благополучия народа."
 ARG_recruiting_revolutionaries: "Набор революционеров"
 ARG_recruiting_revolutionaries_desc: "Хотя мы можем доверять лучшим, тем, кто у нас есть, этого недостаточно, если что-то случится, мы должны быть готовы, и как таковые мы будем призывать к новой волне революционеров, которая приведет социализм за пределы наших собственных основ."
 ARG_a_new_leadership: "Новое руководство"
 ARG_a_new_leadership_desc: "Эти старые генералы, многие не согласны с нашими принципами, и их реакционное мышление будет только мешать нам."
 ARG_in_peoples_defense: "В защиту народа"
 ARG_in_peoples_defense_desc: "Жертвы должны быть сделаны не напрасно, не для того, чтобы защитить интересы рынка, а для защиты людей."
 ARG_collective_intelligence: "Коллективная разведка"
 ARG_collective_intelligence_desc: "По мере того, как мы создаем наши великие силы, мы не должны забывать о мелочах."
 ARG_centralized_defense_forces: "Централизованные силы обороны"
 ARG_centralized_defense_forces_desc: "В то время как наши люди встали на свою собственную автономию и так мужественно сражались"
 ARG_bastion_of_the_proletariat: "Бастион Пролетариата"
 ARG_bastion_of_the_proletariat_desc: "Мы больше, чем Аргентина, мы рабочая республика, мы мужественно защищаем тех, кого никто не осмеливается защищать, мы бастион пролетариата, в этой вечной борьбе."
 ARG_republican_shield: "Республиканский щит"
 ARG_republican_shield_desc: "Вооруженные силы должны быть республиканским щитом, защищать нас от иностранных угроз и внутренних врагов, обеспечивая наше выживание и стабильность."
 ARG_call_the_peacekeepers: "Позвоните миротворцам"
 ARG_call_the_peacekeepers_desc: "Величайшие люди сражаются не потому, что хотят причинить боль или насилие другим, а потому, что они знают, за что они борются, величайшее сокровище, которое мы можем дать нашему народу, мир. Давайте призовем этих храбрых людей к воссоединению под нашим флагом."
 ARG_enlistment_benefits: "Выгоды для приема на работу"
 ARG_enlistment_benefits_desc: "Те, кто борются за свою родину, храбры, герои и легенды, мы будем относиться к ним так, как они заслуживают, и они будут знать, что их поддержка будет вознаграждена."
 ARG_reel_in_officers: "Копирование должностных лиц"
 ARG_reel_in_officers_desc: "Сильные и высокопоставленные офицеры наших вооруженных сил, будучи верными родине, также преданы своим собственным интересам, многие из которых не согласны с нашим правительством и нашими идеалами. Давайте дадим им напоминание о том, кто правит этой страной."
 ARG_a_patriotic_weapon: "Патриотическое оружие"
 ARG_a_patriotic_weapon_desc: "Вооруженные силы являются лишь продолжением воли государства, храбрым, патриотическим оружием, которое исполняет наши приказы и следит за тем, чтобы наши интересы уважались, где бы они ни были, внутри или снаружи, это наше оружие, взамен, государство предоставит им необходимые условия для их надлежащего функционирования и уважения, которого они заслуживают."
 ARG_integrated_paramilitaries: "Комплексные военизированные формирования"
 ARG_integrated_paramilitaries_desc: "Испуганные бойцы, которым мы хотим служить, были найдены не в наших казармах, а на улицах, в военизированных группах, которые делают все, что им нужно, чтобы защитить Аргентину, и если мы сделаем их частью наших сил, они будут служить с гордостью и силой."
 ARG_expand_conscription: "Расширить воинскую обязанность"
 ARG_expand_conscription_desc: "По мере укрепления сотрудничества между военными и государством мы осознаем необходимость того, чтобы аргентинские мужчины выполняли свой патриотический долг и служили там, где им и место, в наших рядах."
 ARG_further_spending: "Дополнительные расходы"
 ARG_further_spending_desc: "Хороший бюджет необходим для того, чтобы военные управлялись, и, поскольку нам может потребоваться сократить другие менее важные расходы, мы еще больше увеличим наши вооруженные расходы."
 ARG_weapon_imports: "Импорт оружия"
 ARG_weapon_imports_desc: "Насколько мы знаем, лучшее оружие — это аргентинские, но мы понимаем, что для укрепления наших сил необходимо хорошее снаряжение, и поэтому мы будем оплачивать любые необходимые импортные поставки."
 ARG_all_for_argentina: "Все за Аргентину"
 ARG_all_for_argentina_desc: "Земля, которая дала нам все, то, к чему мы принадлежим, от Рио-де-Платы до самого южного доходит до Аргентины."
 ARG_pride_of_the_republic: "Гордость Республики"
 ARG_pride_of_the_republic_desc: "Вооруженные силы стали национальным достоянием, поистине гордостью Аргентинской Республики."

 ARG_update_infantry: "Обновление пехоты"
 ARG_update_infantry_desc: "По мере того, как пришло время и наше оборудование вышло из строя, настало время обновить наши конструкции оборудования и восстановить наших храбрых солдат."
 ARG_motorize_our_forces: "Моторизировать наши силы"
 ARG_motorize_our_forces_desc: "Давайте не будем тратить время, пройдя через долгие, опасные проходы, когда им нужно попасть куда-то во времени, давайте возьмем наши дивизии, доставим машины на поле боя."
 ARG_artillery_regiments: "Артиллерийские полки"
 ARG_artillery_regiments_desc: "Разработка сильной, хорошо подготовленной артиллерии необходима на современном поле боя, давайте сосредоточим наши ресурсы на новаторстве среди наших полков, чтобы лучше сосредоточиться на артиллерии."
 ARG_engineer_corps: "Инженерный корпус"
 ARG_engineer_corps_desc: "Боевые инженеры очень полезны, когда речь заходит о применении новой тактики и адаптации к постоянно меняющемуся поле боя."
 ARG_medical_troops: "Медицинские войска"
 ARG_medical_troops_desc: "Наши люди важны, и готовый, хорошо подготовленный и поставляемый полевой госпиталь может обеспечить разницу между нашими солдатами, которые сражаются еще раз, если потребуется."
 ARG_mass_forces: "Массовые силы"
 ARG_mass_forces_desc: "Хотя, по общему мнению, мы не несем ответственности и опасны, мы сосредоточимся на том, чтобы собрать наибольшее количество людей, подавить наших врагов, может быть, и лучше всего."
 ARG_men_are_precious: "Мужчины драгоценны."
 ARG_men_are_precious_desc: "Сосредоточив наши усилия на создании лучшего оружия и оборудования, чтобы наши люди сражались лучше, чем враг, тогда нам не придется рисковать большими потерями и делать все возможное для Аргентины."
 ARG_tested_strategies: "Проверенные стратегии"
 ARG_tested_strategies_desc: "Инновации означают риск, и мы не можем допустить риска, мы должны действовать умно и осторожно."
 ARG_relampago_tactics: "Тактика релампаго"
 ARG_relampago_tactics_desc: "Новая и новаторская идея. Сосредоточьтесь на мобильности и быстроте, быстро ударите противника, заберите все, и не дайте им нанести ответный удар. Максимизирует победы и минимизирует потери, мы нападем быстро, как релампаго."
 ARG_armored_renovations: "Реконструкция бронетранспортеров"
 ARG_armored_renovations_desc: "Наши бронированные силы не прошли проверку на свой потенциал, и им уже грозит опасность быть скрытыми."
 ARG_special_troops: "Специальные войска"
 ARG_special_troops_desc: "Мы должны быть готовы к каким бы то ни было сражениям."
 ARG_mechanization_efforts: "Механизация"
 ARG_mechanization_efforts_desc: "По мере развития новых технологий механизированные машины сияли на поле боя, и добавление этих новых обновлений в наши силы было бы фантастической идеей."
 ARG_argentinian_strength: "Аргентинская сила"
 ARG_argentinian_strength_desc: "Истинное сердце нашего народа открыто не в обычный день, а только тогда, когда общий дух нашей нации сосредоточен на одном начинании, мы связаны друг с другом и вскрывается значение Аргентины, мы - Аргентина, и это наша сила."
 ARG_on_the_matter_of_economy: "По вопросу экономики"
 ARG_on_the_matter_of_economy_desc: "Поскольку провода, которые удерживали нашу экономику на плаву, были вырезаны, и мы упали, мы должны приложить все наши усилия и разработать план, чтобы снова встать на ноги."
 ARG_supporting_argentina: "Поддержка Аргентины"
 ARG_supporting_argentina_desc: "По мере того как мы стремимся создать новую нишу для нашей экономики, мы считаем, что поддержка чисто аргентинского промышленного развития может быть наилучшим вариантом."
 ARG_yacimientos_petroliferos_fiscales: "Ясимьентос Петролайверос"
 ARG_yacimientos_petroliferos_fiscales_desc: "Основанный президентом Иригойером, YPF был первым нефтяным государственным предприятием в мире. Поддержка и помощь необходимы для Аргентины."
 ARG_electronics_investments: "Инвестиции в электронику"
 ARG_electronics_investments_desc: "Мы должны подготовить индустрию к тому, чтобы ее можно было использовать на основе надлежащих инвестиций."
 ARG_cordoba_industrial_zone: "Промышленная зона Кордовы"
 ARG_cordoba_industrial_zone_desc: "Кордова оказалась важной производственной зоной для нашей страны."
 ARG_buenos_aires_industrial_zone: "Промышленная зона Буэнос-Айреса"
 ARG_buenos_aires_industrial_zone_desc: "Наша любимая столица, Буэнос-Айрес, является важным центром народонаселения и привлекательным местом для наших отраслей, где они проживают и развиваются должным образом."
 ARG_construction_expansion: "Расширение строительства"
 ARG_construction_expansion_desc: "В то время как мы постоянно стремимся к созданию проектов, которые расширяют нашу экономику и поддерживают наше население, совершенствование наших конструктивных технологий является прекрасной идеей для содействия этому делу."
 ARG_no_need_for_the_british: "Британцы не нужны."
 ARG_no_need_for_the_british_desc: "Хотя наши обширные экономические связи поддерживали нашу страну на протяжении десятилетий, эти отношения оказались не лучшими для Аргентины."
 ARG_nationalize_aslco: "Национализация ASLCO"
 ARG_nationalize_aslco_desc: "Компания Аргентинская Южная земля лимитед -- это обширная земельная компания, владеющая британскими землями. Когда они управляют полями и полями наших земель , мы считаем, что земля может лучше контролироваться государством. Национализация -- это наилучший вариант, позволяющий нам лучше контролировать свою собственную территорию."
 ARG_limit_food_exports: "Ограничение экспорта продовольствия"
 ARG_limit_food_exports_desc: "Хотя экспорт сельскохозяйственной продукции и домашнего скота поддерживает нас на протяжении длительного времени, поскольку мы превращаем свою сторону в самих себя, мы понимаем, что ограничение этого, в рамках процесса самосохранения, может быть к лучшему."
 ARG_control_bunge_and_born: "Контролировать бунге и рождённые"
 ARG_control_bunge_and_born_desc: "Многопрофильная компания, Bunge & Born, является примером правильной аргентинской компании. Предприятия, подобные этой компании, лучше бы управлялись непосредственно Аргентиной, и мы увеличим наше влияние на эту важную компанию."
 ARG_nationalized_railroads: "Национализованные железнодорожные дороги"
 ARG_nationalized_railroads_desc: "Огромная железнодорожная сеть, соединяющая нашу великую страну, в значительной степени контролируется иностранными производственными компаниями."
 ARG_support_ferrum: "Поддержка Ferrum"
 ARG_support_ferrum_desc: "Растущая сталелитейная компания «Феррум» привела к весьма продуктивному результату, и она также является правильной аргентинской компанией."
 ARG_industrial_reform: "Промышленная реформа"
 ARG_industrial_reform_desc: "По мере того как мы инвестируем средства в наше экономическое и промышленное развитие, более крупная реформа нашего промышленного производства является лишь частью более крупного плана."
 ARG_military_industry: "Военная промышленность"
 ARG_military_industry_desc: "В сегодняшнем конфликтном и нестабильном мире развитие национальной военной промышленности для поддержки наших вооруженных сил кажется естественным выбором, о котором мы не пожалеем."
 ARG_extractive_measures: "Добычные меры"
 ARG_extractive_measures_desc: "Инвестирование в усовершенствование наших методов добычи будет только выгодно нам и нашим производственным возможностям."
 ARG_academia_argentina_de_innovacion: "Аргентинская академия новаторства"
 ARG_academia_argentina_de_innovacion_desc: "Мы стремимся к лучшему будущему, и вложение средств в исследования и расширение высшего образования, кажется, имеет ключевое значение для сохранения этой судьбы."
 ARG_automotive_industry: "Автомобильная промышленность"
 ARG_automotive_industry_desc: "Инвестирование в перспективные аргентинские машинные компании, такие как Siam Di Tella, это то, что мы сделаем."
 ARG_deal_with_la_forestal: "Сделка с Ла Форевалом"
 ARG_deal_with_la_forestal_desc: "Будучи компанией, которая оказала такое влияние, она практически соблюдает свои собственные законы, Ла Форевал был для Аргентины нелегким, и мы, наконец, разберемся с ним, национализируя его собственность и показывая, что Аргентина контролирует свою собственную экономику."
 ARG_back_on_our_feet: "Возвращаемся к нашим ногам"
 ARG_back_on_our_feet_desc: "Мы инвестировали разумно и вложили свои усилия в это, теперь экономика стабильна и вновь оздоровилась, и на этот раз мы не позволим никому контролировать ее судьбу."
 ARG_military_expansion: "Военное расширение"
 ARG_military_expansion_desc: "По мере того, как наши военно-промышленные усилия увенчаются успехом, возникает соблазн для дальнейшего расширения оружейной промышленности в Аргентине."
 ARG_expand_the_patagonian_railways: "Расширить патагонские железные дороги"
 ARG_expand_the_patagonian_railways_desc: "Поскольку мы хотим еще больше объединить людей в нашей широкой географии, мы видим, что одной из наиболее распространенных зон является Патагония."
 ARG_subsidize_argentinian_enterprise: "Субсидирование аргентинских предприятий"
 ARG_subsidize_argentinian_enterprise_desc: "Давайте субсидируем и поддерживаем уже существующие, чтобы усилить их влияние на нашу экономику в целом."
 ARG_master_of_the_south_atlantic: "Магистр Южной Атлантики"
 ARG_master_of_the_south_atlantic_desc: "Наши сухопутные территории велики, и должно быть и наше море. южный атлантический мир является нашим законным владением, и мы дадим нашим морским силам стимул для его защиты."
 ARG_expand_the_fleet: "Расширить флот"
 ARG_expand_the_fleet_desc: "Чтобы установить полный контроль над морем, мы должны иметь сильный, большой флот для борьбы за нас."
 ARG_platinean_coast_guard: "Платинская береговая охрана"
 ARG_platinean_coast_guard_desc: "Бассейн Рио-де-Жанейро-Плата является важной географической зоной, где можно найти наш самый большой популяционный центр, защита которого имеет важное значение по мере того, как мы расширяем нашу морскую мощь."
 ARG_patagonian_harbours: "Патагонские гавани"
 ARG_patagonian_harbours_desc: "По мере того, как наши верфи расширяются, и мы охраняем наши берега и за их пределами, мы боремся с открытием новых гаваней, чтобы обеспечить контроль над нами дальше на юге, может быть хорошей идеей."
 ARG_argentinian_marines: "Аргентинские морские пехотинцы"
 ARG_argentinian_marines_desc: "Развитие морских пехотинцев, которые связывают территориальный контроль над сухопутными войсками с досягаемостью заморских флотов, является чудом этой эпохи, и мы будем поддерживать их развитие в наших вооруженных силах."
 ARG_domecq_plan: "Морской план Домекка"
 ARG_domecq_plan_desc: "Старый адмирал Домек, наш военный министр, предлагает расширить старый и испытанный состав флота."
 ARG_scasso_plan: "Морской план Скассо"
 ARG_scasso_plan_desc: "Интересное предложение, адмирал Леон Скассо, изучая некоторые из самых новых европейских военно-морских разработок, верит в радикальную новую направленность нашего флота."
 ARG_storni_plan: "Морской план Сторни"
 ARG_storni_plan_desc: "Адмирал Сронти предлагает более подрывную стратегию, сосредоточившись на небольших судах, мы можем контролировать их линии снабжения и легко помешать вражеским военно-морским силам."
 ARG_battleships: "Ремонт боевых кораблей"
 ARG_battleships_desc: "Гордые титаны, сильный современный боевой корабль — это неотъемлемая часть любого морского боя."
 ARG_southern_ports: "Южные порты"
 ARG_southern_ports_desc: "Новые военно-морские базы на южных территориях Патагонии позволят нам лучше распределять наш флот по мере того, как мы расширим наше правление над морями."
 ARG_cruisers: "Крузеры идут"
 ARG_cruisers_desc: "Уделение особого внимания дизайну крейсеров поможет нашему флоту, независимо от того, какую стратегию мы придумаем."
 ARG_submarines: "Под морем"
 ARG_submarines_desc: "Скрытая в глубинах, расширение подводных лодок дает нам подрывное преимущество, тактически. Было бы разумно не игнорировать перспективу обновления этой технологии."
 ARG_carriers: "Военно-морские военно-воздушные суда"
 ARG_carriers_desc: "Если бы вы сказали мне много лет назад, что мы поставим взлетно-посадочные полосы на море и будем контролировать моря с помощью самолетов, я бы назвал вас сумасшедшим, но это, кажется, работает по какой-то причине, так что лучше сфокусироваться на этом."
 ARG_destroyers: "Уничтожители готовы"
 ARG_destroyers_desc: "Всесторонний, быстрый эскортный корабль, эсминцы сотворят чудеса нашего флота давайте оптимизировам наш флот, обновив наши модели эсминцев и как таковые, улучшив нашу военно-морскую мощь."
 ARG_amphibious_vehicles: "Амфиозные транспортные средства"
 ARG_amphibious_vehicles_desc: "Транспортные корабли, хотя и не похожие на многое, обладают огромной стратегической силой, позволяя нашим храбрым людям добраться до территорий, которые они иначе не могли бы, пока мы контролируем моря. Давайте улучшим их."
 ARG_high_seas_tactics: "Тактика в открытом море"
 ARG_high_seas_tactics_desc: "Какую бы стратегию мы ни разработали, держать нашу тактику в курсе событий и таким образом иметь верх в боевых действиях - это безумие."
 ARG_utter_control: "Морской контроль"
 ARG_utter_control_desc: "Поскольку наши усилия по модернизации были полезными, мы видим, что наш флот является поистине мощной силой, и даже если мы должны умело управлять им, мы можем действительно контролировать наши моря."
 ARG_the_argentinian_skies: "Аргентинские небеса"
 ARG_the_argentinian_skies_desc: "Мы должны направить наши усилия на создание современных, сильных военно-воздушных сил, на то, чтобы доминировать над другими и защищать себя."
 ARG_bases_aereas_argentinas: "База Эреас Аргентинас"
 ARG_bases_aereas_argentinas_desc: "Создание расширенных баз для снабжения наших военно-воздушных сил является важной частью создания надлежащих военно-воздушных сил и управления ими."
 ARG_warriors_of_the_sky: "Воины Неба"
 ARG_warriors_of_the_sky_desc: "Основными боевиками являются могущественные воины, которые определяют контроль над небом, и как таковые мы должны уделять им то внимание, которого они заслуживают."
 ARG_plane_production_plan: "План авиационного производства"
 ARG_plane_production_plan_desc: "Мы должны осуществить новый план, в соответствии с которым мы будем укреплять нашу авиационную инфраструктуру и повышать качество наших самолетов."
 ARG_objective_annihilation: "Цель"
 ARG_objective_annihilation_desc: "По мере того как мы ищем конкретную доктрину для наших военно-воздушных сил, стратегические бомбардировки и уничтожение важных целей представляются прекрасной стратегией."
 ARG_troop_support: "Поддержка воинских контингентов"
 ARG_troop_support_desc: "По мере того как мы ищем конкретную доктрину для наших военно-воздушных сил, оказание поддержки нашим сухопутным войскам в доминировании и контроле над наземной территорией, которая является их поле боя, кажется безумием."
 ARG_widerange_strategy: "Широкая стратегия"
 ARG_widerange_strategy_desc: "По мере того как мы ищем конкретную доктрину для наших военно-воздушных сил, мы понимаем, что есть много способов, которыми мы можем разработать стратегию, и есть много видов применения для наших военно-воздушных сил как таковых, сохранение их универсальности является наилучшим вариантом."
 ARG_overland_bombers: "Наземные бомбардировщики"
 ARG_overland_bombers_desc: "Развитие бомбардировщиков, которые уничтожают объективных и наказывают врагов на суше, кажется идеальным объединением наших вооруженных сил и хорошей идеей."
 ARG_maritime_terror: "Морской террор"
 ARG_maritime_terror_desc: "Сосредоточение внимания на наказании за военно-морскую мощь наших врагов - это способ использовать наших воздушных солдат для нашей выгоды, бомбардируя их флоты и порты."
 ARG_they_came_from_the_skies: "Они пришли с неба!"
 ARG_they_came_from_the_skies_desc: "Сильные солдаты, прилетающие с неба, больше не фантазия, так как мы разрабатываем программы десантников, которые позволяют нашим подразделениям добраться до тех мест, о которых они не могли мечтать раньше."
 ARG_propelled_pain: "Заглушенная боль"
 ARG_propelled_pain_desc: "Новые технологии разнообразны, и реактивные снаряды с взрывчатыми веществами представляются интересной областью, на которой следует сосредоточить внимание."
 ARG_aerial_mastery: "Аэрологическое мастерство"
 ARG_aerial_mastery_desc: "С мощными современными военно-воздушными силами мы можем установить контроль над сражением так, как никогда раньше не было возможно!"
 ARG_socialism_in_south_america: "Южноамериканский социализм"
 ARG_socialism_in_south_america_desc: "По мере того, как революция захватила Аргентину, мы начинаем замечать опасную и реакционную обстановку, в которой мы оказались. Работники Южной Америки, жаждущие революции, но наши враги находятся повсюду. Хорошей идеей может быть установление прочных связей с нашими друзьями и избегание наших оппонентов."
 ARG_spirit_of_cooperation: "Дух сотрудничества"
 ARG_spirit_of_cooperation_desc: "В то время как мы стремимся к установлению более прочных связей между трудящимися, над границами, мы сталкиваемся с тем, что мы разделяем дух сотрудничества, который глубоко укоренился в социалистических идеалах."
 ARG_international_research_pact: "Международный пакт об исследованиях"
 ARG_international_research_pact_desc: "По мере того, как мы расширяем наши связи между социалистами, союз за разработку новых технологий был бы разумным."
 ARG_a_socialist_alliance: "Социалистический альянс"
 ARG_a_socialist_alliance_desc: "Мы, социалисты, должны объединиться, создать союз, договор о международном сотрудничестве и взаимной помощи между южноамериканскими странами, которые нашли революцию, вместе мы будем противостоять реакционерам."
 ARG_socialism_across_the_andes: "Революционеры по Андам"
 ARG_socialism_across_the_andes_desc: "Чили - страна храбрых социалистов, однако их число находится в упадке, и их режим не позволит им процветать. Давайте дадим им необходимую поддержку."
 ARG_liberate_chilean_workers: "Освободительные чилийские рабочие"
 ARG_liberate_chilean_workers_desc: "Хотя очевидно, что чилийские рабочие жаждут революции, обстоятельства для них не повезли, давайте поддержим их напрямую и вторгнемся в Чили с миссией освободить своих рабочих."
 ARG_bolivian_friendship: "Дружба с Боливией"
 ARG_bolivian_friendship_desc: "Хотя в Боливии есть воспоминания о войне и сохраняется напряженность, возможно, мы сможем найти способ обойти их и найти нового друга."
 ARG_invite_bolivia: "Приглашать Боливию"
 ARG_invite_bolivia_desc: "Сейчас, когда мы стоим вместе с новым другом, официальное объявление нашего пакта, когда мы приглашаем их в наш международный союз, является естественным шагом."
 ARG_support_bolivian_socialists: "Поддержка боливийских социалистов"
 ARG_support_bolivian_socialists_desc: "Храбрые и революционные социалисты Боливии оказались почти полезными в своих попытках сломать цепи, к сожалению, они потерпели неудачу, но мы добились успеха, и мы вновь поддержим их попытки."
 ARG_liberate_bolivian_workers: "Освободительные боливийские рабочие"
 ARG_liberate_bolivian_workers_desc: "Ожидание окончено, мы знаем, что должны сделать."revolutionary" ethno-nationalists that imprison Bolivia, and break their chains."
 ARG_bolster_eastern_socialism: "Болстер восточная социализм"
 ARG_bolster_eastern_socialism_desc: "Олигархия по-прежнему сильна среди нашей братской страны, восточной республики, которая является Уругваем, и мы много с ними делимся, и мы будем поддерживать наших пролетариатских братьев в их борьбе."
 ARG_bring_the_revolution_to_uruguay: "Привести революцию в Уругвай"
 ARG_bring_the_revolution_to_uruguay_desc: "Настало время освободить наших братьев, освободить уругвайского работника."
 ARG_dissidents_in_paraguay: "Диссиденты в Парагвае"
 ARG_dissidents_in_paraguay_desc: "У режима в Парагвае много противников, многие из которых находятся прямо в нашем переулке. Давайте поддержим их усилия."
 ARG_liberate_paraguay: "Освобожденный Парагвай"
 ARG_liberate_paraguay_desc: "Пролетариат не может больше ждать, давайте вмешаемся прямо в Парагвай и дадим людям свободу."
 ARG_censure_reactionaries: "Обеспечение реакций"
 ARG_censure_reactionaries_desc: "Опасные реакторы в нашем обществе - это голосовое меньшинство, угрожающее нашей революции."
 ARG_collectivist_arms: "Коллективистское оружие"
 ARG_collectivist_arms_desc: "Национальный рынок вооружений слишком долго контролируется военными и олигархическими силами."
 ARG_ban_collectivism: "Запрещение коллективизма"
 ARG_ban_collectivism_desc: "Поскольку экстремальные левые движения угрожали нашей национальной стабильности, мы поняли, что не можем этого допустить, поэтому в знак защиты демократических и республиканских ценностей мы запрещаем гнусную идеологию коллективизма и другой социалистической лжи."
 ARG_promise_improvements: "Обещай улучшения"
 ARG_promise_improvements_desc: "Времена тяжёлые, но Аргентина должна понять, что мы работаем над ее благополучием, поэтому мы должны обеспечить, чтобы люди чувствовали, что мы что-то делаем, и обещать им результаты."
 ARG_our_atlantic_birthright: "Наше атлантическое право рождения"
 ARG_our_atlantic_birthright_desc: "С тех пор как у нас были колониальные связи, красота южноатлантической войны, наше наследие, призывало наш народ, теперь мы едины, но наше право рождения находится в руках британских империалистов, но ненадолго."
 ARG_seize_las_malvinas: "Схватить Лас-Мальвинские острова"
 ARG_seize_las_malvinas_desc: "Время пришло, империя занята, и когда мы заберем нашу законную землю, у них не будет выбора, кроме как сдаться, наше право рождения не выдержит еще один день под империалистическими когтями."
 ARG_our_place_in_the_continent: "Наше место на континенте"
 ARG_our_place_in_the_continent_desc: "По мере того, как мы решим наши внутренние проблемы, мы изменим свою судьбу, настало время выйти из изоляции и вновь начать искать свое место на континенте."
 ARG_forming_bonds: "Формирование облигаций"
 ARG_forming_bonds_desc: "Индивидуальная сила может только пойти так далеко, именно дипломатия и сотрудничество приведут нас к прогрессу и действительно укрепят мир и стабильность для Аргентины и континента."
 ARG_defending_peace: "Защита мира"
 ARG_defending_peace_desc: "Нет ничего, чего мы хотели бы больше, чем мира и стабильности, и мы знаем, что многие тоже делают это, но хаос распространяется по всему миру, а нестабильность вокруг нас, время встать и показать, что мы будем защищать мир."
 ARG_rally_the_people: "Встретить людей"
 ARG_rally_the_people_desc: "Наши люди могут чувствовать себя уставшими, пострадавшими или не готовыми к сражению, но нам нужна их полная поддержка, если Аргентина планирует добиться успеха, давайте призовем наших братьев встать и поддержать демократический порядок."
 ARG_alianza_del_sur: "Альянс Сур"
 ARG_alianza_del_sur_desc: "Ценой свободы является вечная бдительность, вместе мы будем противостоять всем рискам. Давайте найдем новый союз, который будет отстаивать мир и стабильность континента, который не будет склоняться к экстремистам и будет защищать народ."
 ARG_invite_uruguay: "Приглашать Уругвай"
 ARG_invite_uruguay_desc: "Наши братья на востоке оказываются надежным союзником, пусть даже небольшим по размеру."
 ARG_invite_chile: "Приглашать Чили"
 ARG_invite_chile_desc: "Хотя наши отношения с ними, возможно, и не всегда были лучшими, это времена неприятностей, и мы знаем, что чилийцы хотят защититься от экстремистов, чтобы восстановить мир так же, как и мы, этот союз принес бы пользу нам обоим."
 ARG_invite_paraguay_desc: "Угрожаемый экстремальными силами повсюду, Парагвай понимает жертвы, которые должны быть сделаны ради мира, давайте пригласим их в наш союз, конечно, они примут."
 ARG_invite_paraguay: "Приглашать Парагвай"
 ARG_invite_peru: "Приглашать Перу"
 ARG_invite_peru_desc: "При наличии опасных групп, как крайне левых, так и правых, угрожающих его выживанию, приглашение Перу может быть рискованным, но этот шаг может быть тем, в чем нуждается континент."
 ARG_support_the_republic: "Поддержка Республики"
 ARG_support_the_republic_desc: "Поскольку идеологические разногласия угрожают выживанию Бразилии и подрывают мир, мы должны сделать все возможное, чтобы поддержать законную республику в ее внутреннем конфликте."
 ARG_the_collectivist_menace: "Коллективистская угроза"
 ARG_the_collectivist_menace_desc: "Радикальные левые идеологии, такие как коллективизм, вангардизм, анархизм и другие, распространились по всему континенту."
 ARG_contain_bolivia: "Боливия"
 ARG_contain_bolivia_desc: "Революция прокатилась в Боливии. Теперь все окружающие страны в опасности, когда эти экстремистские группы пытаются распространить свою идеологию на наши нации. Мы не можем допустить этого больше, давайте вмешаемся и освободим Боливию от этой болезни."
 ARG_the_enemy_in_brazil: "Враг в Бразилии"
 ARG_the_enemy_in_brazil_desc: "Истинный враг, Социалистический Союз Бразилии, стал слишком сильным, и это не уравновешивает порядок и мир в Южной Америке. Мы не можем ждать, когда они станут сильнее, давайте уничтожим их сейчас."
 ARG_establishing_hegemony: "Создание гегемонии"
 ARG_establishing_hegemony_desc: "Наши цели ясны: поскольку Аргентина предназначена для больших вещей, настало время выйти из тени и вырезать наш трон как гегемонов Южной Америки."
 ARG_newfound_irredentism: "Вновь обнаружившаяся неуверенность"
 ARG_newfound_irredentism_desc: "Когда мы вступаем в мир, мы понимаем, что так много из этого по праву принадлежит нам."
 ARG_announce_our_ambitions: "Объявите о наших амбициях"
 ARG_announce_our_ambitions_desc: "Мир должен бояться Аргентины, а Южная Америка должна смотреть с благоговением."
 ARG_pact_of_la_plata: "Пакт Ла-Платы"
 ARG_pact_of_la_plata_desc: "В то время как мы естественно сильны и не зависим от других, пакт, в котором мы показываем тем, кто подчиняется нашей воле, как великие правители и защитники будут обеспечивать создание нашей собственной зоны контроля и гегемонии под нашим руководством."
 ARG_break_the_state: "Разрушить государство"
 ARG_break_the_state_desc: "ВИП"
 ARG_support_the_state: "Поддержка государства"
 ARG_support_the_state_desc: "ВИП"
 ARG_make_uruguay_bend: "Уругвайское уклонение"
 ARG_make_uruguay_bend_desc: "Наша мятежная провинция слишком долго избежала нашего правления, хотя национальная гордость хороша и все в ней, чувство гордости за то, что она управляется Аргентиной, еще лучше, и они это сделают."
 ARG_make_paraguay_submit: "Представить Парагвай"
 ARG_make_paraguay_submit_desc: "Парагвай слишком долго знал аргентинское милосердие во время войны с Чако, и теперь они поймут, как дорого мы их спасаем, и как им лучше быть под нашей защитой."
 ARG_invade_bolivia: "Инвадская Боливия"
 ARG_invade_bolivia_desc: "Некомпетентный режим упал, но нынешние буфуны не лучше, но у них большие желания."
 ARG_cross_the_andes: "Пересечь Анды"
 ARG_cross_the_andes_desc: "Доступ к Тихому океану был закрыт слишком долго, и по какой причине? Страх перед горами? Давайте пересечем Анды и поставим Чили под наш контроль."
 ARG_pact_with_colombia: "Пакт с Колумбией"
 ARG_pact_with_colombia_desc: "Национальный режим в Колумбии стремится вырезать свое собственное место в своей части Южной Америки."
 ARG_pact_with_peru: "Пакт с Перу"
 ARG_pact_with_peru_desc: "Сильный перуанский режим стремится к порядку и стабильности, как и мы."
 ARG_form_federation_of_la_plata: "Федерация Ла Плата"
 ARG_form_federation_of_la_plata_desc: "Поскольку пролетариат платинеанского региона объединился в революцию, мы считаем, что колониальные националистические разногласия, которые разделяли наши страны, когда мы так много делим, больше не нужны."
 ARG_support_the_union: "Поддержка Союза"
 ARG_support_the_union_desc: "Бразильские рабочие восстали в социалистическом союзе, чтобы бороться за свою революцию."
 ARG_intervene_in_the_civil_war: "Вмешайтесь в гражданскую войну"
 ARG_intervene_in_the_civil_war_desc: "Бразильская гражданская война была кровавой беспорядком, и пролетариат больше всех потерял, борясь в этом конфликте за жестоких олигархов и реакторов, которые сделали бы все, чтобы остановить революцию."
 ARG_congress_of_41: "Конгресс трудящихся 41"
 ARG_congress_of_41_desc: "По мере того, как революция оседает, наше революционное правительство является временным по мере возникновения в стране различных мыслей, пора призвать к конгрессу, где мы будем принимать решение о нашем правительстве."
 ARG_anarchist_victory: "Анархистская победа"
 ARG_anarchist_victory_desc: "После десятилетий анархистское движение наконец-то одержало победу."
 ARG_rebeldia_proletaria: "Пролетариа"
 ARG_rebeldia_proletaria_desc: "Как основатели революционного порядка, дух революции, восстания в нашей природе, и мы всегда будем отстаивать нашу свободу, за разрыв цепи, которую другие пытаются навязать нам, независимо от того, кто они и во что верят."
 ARG_regional_industry: "Региональный план развития промышленности"
 ARG_regional_industry_desc: "Поскольку мы верим в местную автономию, а не в центральный план, а скорее в местные профсоюзы, в скором времени начнет действовать совместный план, в рамках которого каждый регион будет развивать свою собственную промышленность."
 ARG_council_autonomy: "Автономия Совета"
 ARG_council_autonomy_desc: "Передавая власть провинциям, а сами они -- своим малым общинам, мы достигли состояния, в котором социалисты рождаются от самих рабочих, организованных в автономных советах, где они руководят в соответствии с их потребностями."
 ARG_anarchist_military: "Анархизм в ополчениях"
 ARG_anarchist_military_desc: "Давайте превратим анархистские революционные группы, которые хотят распространить свои идеалы, в дополнительные силы для нашей армии, что, безусловно, послужит нам."
 ARG_union_councils: "Союзные советы"
 ARG_union_councils_desc: "По мере передачи власти местным структурам мы все еще организованы единым советом, который возглавляет более широкие решения в соответствии с провинциальными решениями, что дает нам симпатизирующую и умную администрацию, уважающую волю людей."
 ARG_collectivists_prevail: "Православный коллективизм превзойдет"
 ARG_collectivists_prevail_desc: "Ведущие нас во время нашей революции, они выросли в популярности благодаря своему мудрому руководству, и на этом конгрессе было решено, что они должны продолжать руководить нами и претворять в жизнь свои идеи при широкой поддержке рабочих."
 ARG_socialist_traditions: "Социалистические традиции"
 ARG_socialist_traditions_desc: "Много лет назад социалистические идеалы были под землей или не имели большого значения, но они быстро выросли, и теперь все в нашей стране могут подтвердить рождение социалистической традиции в нашем обществе."
 ARG_collective_society: "Коллективное общество"
 ARG_collective_society_desc: "Индивидуализм рассматривается плохо, поскольку наше общество обращается к коллективной философии, где благополучие большинства является наиболее важным."
 ARG_marxism_in_progress: "Осуществление марксизма"
 ARG_marxism_in_progress_desc: "Наши коллективные меры помогли нам, и с гордостью мы можем сказать, что близки к реализации реальных марксистских идеалов в стране."
 ARG_we_will_overcome: "Мы превзойдем"
 ARG_we_will_overcome_desc: "Поскольку тень империализма и национализма затуманивает мир, мы, социалисты, должны оставаться бесстрашными, мы знаем, что победим."
 ARG_home_of_the_revolution: "Дом революции"
 ARG_home_of_the_revolution_desc: "Ничто не может нас уничтожить, социалисты смотрят на нас в поисках вдохновения и поддержки, как в регионе, где мы являемся настоящим домом для революции."
 ARG_vanguardist_success: "Успех"
 ARG_vanguardist_success_desc: "В результате раскола фракция авангардистов одержала победу над остальными и одержала победу, в результате чего наша страна стала руководствоваться новыми радикальными мерами."
 ARG_honour_the_chairman: "Честь Председателя"
 ARG_honour_the_chairman_desc: "По мере того, как мы перестроим революцию, председатель приумножит свои силы, только под ее прямым правлением и признавая важность председателя, мы сможем добиться успеха и раздавить врагов революции."
 ARG_post_religious_society: "Послерелигиозное общество"
 ARG_post_religious_society_desc: "Поскольку государство ограничивает распространение религиозного дела, в соответствии с принципами Марксизма мы движемся к атеизму, не важно, что не всем это нравится."
 ARG_social_work_program: "Программы социальной работы"
 ARG_social_work_program_desc: "В нашем обществе каждый человек должен производить и вносить свой вклад в общее дело, а иногда он нуждается в некоторых работниках больше, чем в других, посредством разработки программы социальной работы, которая заставляет менее заинтересованных работников делать то, что необходимо, не каждому это понравится, но она принесет большие результаты нашей экономике."
 ARG_committee_against_traitors: "Комитет против предателей"
 ARG_committee_against_traitors_desc: "Угроза скрытых реакционных элементов в нашем обществе всегда присутствует."
 ARG_direct_rule_from_buenos_aires: "Прямое правило из Буэнос-Айреса"
 ARG_direct_rule_from_buenos_aires_desc: "Будучи центром власти Революционного совета социалистов Аргентины и величайшим социалистическим образованием в регионе, Буэнос-Айрес будет находиться в центре внимания нашего сильного центрального режима."
 ARG_lpa_coup_succeeds: "LPA Coup Succeeds"
 ARG_lpa_coup_succeeds_desc: "После многих лет усиления их влияния и власти в стране ЛПА наконец-то сделала это, в результате быстрого переворота они были непротиворечивы и захватили власть в Аргентине."
 ARG_absolute_state_control: "Абсолютный национальный контроль"
 ARG_absolute_state_control_desc: "Наша нация сильна, но ей также нужно сильное национальное правительство, чтобы управлять ею."
 ARG_nationalist_society: "Националистическое общество"
 ARG_nationalist_society_Desc: "Если мы хотим добиться успеха, нам нужны все, чтобы наполнить наше общество националистическим духом."
 ARG_purge_traitors: "Хирурги-предатели"
 ARG_purge_traitors_desc: "Многие из них враги нашей нации, но худшее - предатели, грязные социалисты, которым плевать на Аргентину,"democratic" bootlickers of the global market, and those that while well intended, don't agree to our methods of improving our nation-state. Everyone needs to be loyal to us, or we won't be loyal to them."
 ARG_destroy_democracy: "Уничтожить демократию"
 ARG_destroy_democracy_desc: "Диссиденты говорят о нашем абсолютном национальном режиме так, как будто потеря демократии была плохой вещью."
 ARG_patriotic_state: "Патриотическое государство"
 ARG_patriotic_state_desc: "Мы перевернулись, за пределами простого национального государства, и теперь мы полностью воплощаем в себе дух, который делает аргентинскую нацию величайшей ступней на земле, и наши граждане с гордостью разделяют этот дух, и эту нацию тоже."
 ARG_military_takes_over: "Военные захватывают"
 ARG_military_takes_over_desc: "Аргентине действительно нужно сильное, авторитарное и консервативное правительство, которое защищает ее от внутреннего и внешнего хаоса, направляя ее, а не от подержанных революционеров, говорящих о патриотизме."
 ARG_crush_the_leagues: "Уничтожить лиги"
 ARG_crush_the_leagues_desc: "Организованные патриотические лиги, оказывая существенную поддержку военным, только подстрекали к росту этого"revolutionary nationalism" that threatened to take over Argentina, to protect us, we need to crush the leagues as a political figure."
 ARG_economical_reestructuring: "Экономическое восстановление"
 ARG_economical_reestructuring_desc: "В годы своего влияния на наше правительство, лигиисты оставили отметку в нашей экономической системе, подталкивая ее к модели, известной как корпоратизм. Хотя у них были хорошие идеи, это не то, что нужно Аргентине, наше богатство должно быть использовано другим, более либеральным способом."
 ARG_hunt_down_moles: "Охотиться на моллюсков"
 ARG_hunt_down_moles_desc: "Скрытые предатели, не согласные с нашим правлением, должны быть найдены."
 ARG_firm_rule: "Твердое правило"
 ARG_firm_rule_desc: "Сильная, традиционная и консервативная зацепка - это то, что приведет Аргентину к силе и стабильности."
 ARG_juntas_guidance: "Руководство хунты"
 ARG_juntas_guidance_desc: "Мы стоим вместе, в мире зная, что великое правительство защищает нас и руководит нами, потому что мы в этом нуждаемся."
 ARG_elections_of_1940: "Выборы 40'"
 ARG_elections_of_1940_desc: "После последнего хаоса правительства пришло время аргентинцам принять участие и проголосовать за путь, по которому наша страна вернётся."
 ARG_gallo_victory: "Победа Галло"
 ARG_gallo_victory_desc: "Президент Висенте Галло, возглавляя коалицию в недавно воссоединенном УВП, хочет развивать подвиги предыдущего правительства, представляя новое лицо для Аргентины."
 ARG_invite_prusoc: "Приглашать Перу"
 ARG_invite_prusoc_desc: "Рабочие Перу поднялись и создали социалистическую республику, оставив позади свой старый олигархический порядок."
 ARG_renovated_workers_promises: "Обязательства отремонтированных рабочих"
 ARG_renovated_workers_promises_desc: "Тем не менее, многие более тяжелые нагрузки были ощущены рабочими классами, которые вновь хотят получить дополнительные выгоды в их борьбе за признание и хорошее обращение, в то время как мы не можем дать радикальных обещаний, не хотим калыма, мы обещаем кое-какую работу в этой области."
 ARG_open_up_the_market: "Открыть рынок"
 ARG_open_up_the_market_desc: "Мы построили экономику для того, чтобы Аргентина могла поддерживать себя, сейчас настало время вновь открыться и торговать на международном рынке, но на этот раз условия будут иными."
 ARG_moderate_radicalism: "Умеренный радикализм"
 ARG_moderate_radicalism_desc: "Наше имя может быть радикальным, но мы верим в умеренные и прогрессивные перемены."
 ARG_measures_against_personalism: "Меры по борьбе с персонализмом"
 ARG_measures_against_personalism_desc: "Спорный вопрос радикализма, формирование больших фигур и людей, которые сами по себе пользуются популярностью, опасен для демократического порядка, и поэтому мы должны ввести политические ограничения, чтобы ограничить этот эффект."
 ARG_tradition_of_unity: "Традиция единства"
 ARG_tradition_of_unity_desc: "Объединяясь под радикализмом, мы стали ценить и чувствовать себя как дома с этим мирным, демократическим порядком, и сегодня эта традиция объединяет Аргентину."
 ARG_saavedra_victory: "Сааведра Винс"
 ARG_saavedra_victory_desc: "Побеждая за Национальную партию Демократа, Карлос Сааведра Ламас стал нашим президентом."
 ARG_attract_new_business: "Привлекательность к новому бизнесу"
 ARG_attract_new_business_desc: "Экономическая политика предыдущего правительства укрепляет наш устойчивый, но неуместный бизнес и обескураживает инвесторов."
 ARG_conservative_laicism: "Консервативный лейцизм"
 ARG_conservative_laicism_desc: "Хотя мы верим в твердые, консервативные ценности, лаикизм и отделение церкви от политики очень важны."
 ARG_reduce_budget_deficit: "Сокращение дефицита бюджета"
 ARG_reduce_budget_deficit_desc: "Крупные инвестиции предыдущего правительства вызвали дефицит нашего бюджета, уравновешивая наши расходы на его ликвидацию, укрепят нашу экономику в долгосрочной перспективе."
 ARG_trust_in_politicians: "Доверие к политикам"
 ARG_trust_in_politicians_desc: "Прошлые неудачи избранных представителей породили атмосферу всеобщего недоверия к политикам, нам нужно, чтобы люди верили в нас, только тогда мы все поверим в наше будущее."
 ARG_united_in_democracy: "Организация Единство в демократии"
 ARG_united_in_democracy_desc: "Мы стоим вместе, поскольку у нас есть надежды и мечты на будущее, мы знаем, что в конечном итоге мы их достигнем, если поверим и будем действовать в этом направлении."
 ARG_palacios_victory: "Паласиос принимает его."
 ARG_palacios_victory_desc: "Альфредо Паласиос в ходе неожиданных выборов занимает пост президента Республики, возглавляя его в качестве первого социалистического президента."
 ARG_welfare_measures: "Меры по обеспечению жизни и быта"
 ARG_welfare_measures_desc: "В то время как мы много разговаривали, но не делали этого, предыдущее правительство не слишком много делало для рабочих."
 ARG_agrarian_reform: "Аграрная реформа"
 ARG_agrarian_reform_desc: "Широкие земельные участки в настоящее время контролируются деловыми кругами, и нам необходимо провести земельную реформу, в рамках которой фермеры смогут контролировать более справедливую долю земли, что позволит аграрному населению получить лучшие средства к существованию."
 ARG_listen_to_the_unions: "Слушайте профсоюзы."
 ARG_listen_to_the_unions_desc: "Нам необходимо создать постоянные каналы диалога между правительством и профсоюзами, которые позволили бы нам прислушиваться к потребностям трудящихся и как таковые еще больше улучшить их социальные и трудовые условия, а также Аргентину в целом."
 ARG_solidary_society: "Солидарное общество"
 ARG_solidary_society_desc: "Личные интересы не должны направлять нас, даже если индивидуальная инициатива является чем-то, чем можно гордиться, мы скорее поддержим твердые меры и разделим эти идеалы среди нашего общества."
 ARG_more_investing: "Больше инвестиций"
 ARG_more_investing_desc: "Давай инвестируем в рынок, ага!"
 ARG_the_infamous_day: "Великий день"
 ARG_the_infamous_day_desc: "Что будет с Аргентиной?"
 ARG_develop_paraguay: "Развивать Парагвай"
 ARG_develop_paraguay_desc: "Выделение ресурсов в парагвайских провинциях покажет людям, которых мы заботим, и обеспечит более эффективное использование нашей вновь приобретенной территории."
 ARG_develop_chile: "Развивать Парагвай"
 ARG_develop_chile_desc: "Выделение ресурсов в чилийских провинциях покажет людям, которых мы заботим, и позволит лучше использовать нашу недавно приобретенную территорию."
 ARG_develop_uruguay: "Развивать Уругвай"
 ARG_develop_uruguay_desc: "Выделение ресурсов в наших двоюродных провинциях покажет людям, которых мы заботим, и позволит лучше использовать нашу недавно приобретенную территорию."
 ARG_integrate_paraguay: "Интегрировать Парагвай"
 ARG_integrate_paraguay_desc: "Воспоминания и различия велики, но мы даём парагвайским рабочим права, которых они заслуживают, и мы все можем работать вместе в этой федерации."
 ARG_integrate_uruguay: "Интеграция Уругвая"
 ARG_integrate_uruguay_desc: "Воспоминания и диссиденты там, но мы даём нашим братьям, уругвайским рабочим, права, которых они заслуживают, и мы все можем работать вместе в этой федерации."
 ARG_integrate_chile: "Объединить Чили"
 ARG_integrate_chile_desc: "Воспоминания и диссиденты там, но мы даём нашим братьям, чилийским рабочим права, которых они заслуживают, и мы все можем работать вместе в этой федерации."
 ARG_recognize_chilean_workers: "Признать чилийские союзы"
 ARG_recognize_chilean_workers_desc: "В рамках наших усилий по интеграции чилийского народа в наш социалистический союз мы нашли националистическую напряженность довольно устойчивой. Если мы дадим их профсоюзам автономию и признаем их местную свободу, они будут чувствовать себя как дома."

 ARG_malvinas_industry: "Промышленность Мальвинских островов"
 ARG_malvinas_industry_desc: "Сосредоточься главным образом на животноводстве и рыболовстве, поставив ресурсы на развитие экономики малвинасов, чтобы стать частью нашей национальной промышленности, было бы хорошей идеей."
 ARG_settling_the_islands: "Депортация и урегулирование"
 ARG_settling_the_islands_desc: "Начатые англо-келперсом, но суждениями Аргентины, пришло время послать наших поселенцев, чтобы должным образом интегрировать Лас-Мальвинские острова в наши культурные области."
 ARG_the_brazilian_war: "Бразильская война"
 ARG_the_brazilian_war_desc: "По мере того, как хаос оседает в Бразилии, победоносное популистское государство проводит политику, которая может угрожать нашему собственному месту на континенте."
 ##events###

 arg.1.t: "Аргентина в 1936 году"
 arg.1.d: "В 1934 году, после того как ОКР победила против коалиции оппозиционных партий, Энрике Мартинес взял на себя обязанности президента, поскольку Боливия готовилась к победе в их конфликте с Парагваем, Мануэль Домекк, военный министр, и видный член националистической группы, известной как Лига Патриотика Аргентина , или ЛПА, воспользовался своим влиянием в недавно избранном президенте Мартинесе, который добивался дальнейшего одобрения, объявил войну Боливии по обвинениям,"maintaining order in the region". Domecq and the LPA sought to establish Argentinian hegemony in the region, while the UCR just wanted to increase their approval in a increasingly divided society. Nonetheless, the whole country united in support of the war effort.\n\nIt was a disaster, low in morale due to the poorly justified conflict, and just generally unprepared, the Argentinian military suffered elevated losses. While conscription allowed many of these to not alter the war effort, it altered our society. When Brazil saw the opportunity and demanded the war ended, and to return peace to the region, the government just accepted. Internally, the pressure of the anti-war collectivist and unionist movements was too strong, and threats of revolt remained in the government's mind.\nNow, the country is more divided politically than ever, as the memories of the war shape our politics and general discontent remains, almost nothing was won, yet we lost so much for it.\n\nAt least the economy's been doing good."
 arg.1.a: "По крайней мере, экономика идет хорошо."
 arg.2.t: "Лондонский рынок прибывает в Аргентину"
 arg.2.d: "По мере того, как наша страна, казалось, постепенно улучшает свою внутреннюю ситуацию, появляется другая страна, и с ней происходит большая трагедия. ~В то время как Лондонский фондовый рынок прибыл в Аргентину, и с большим влиянием англичане в нашей экономике наша страна пробудится с хаосом, когда восходит солнце, и наша экономика падает, паника и предстоящий хаос начинают ощущаться нашим населением. черный восход солнца для нашей нации."
 arg.2.a: "Вот дерьмо."
 arg.3.t: "В условиях кризиса начинаются крупные протесты"
 arg.3.d: "Похоже, политическая напряженность вернулась в Аргентину, когда вновь безработные, голодные и злые уносят ее на улицы в знак протеста против нашего правительства. Что бы мы ни делали, мы должны сохранять спокойствие и действовать мудро, чтобы быть в состоянии вернуть Аргентину на ноги, не вызывая ничего, о чем мы будем сожалеть, и, учитывая недавний всплеск активности коллективистов и возвращение патриотических лиг, это может быть трудно."
 arg.3.a: "Мы можем попробовать."
 arg.4.t: "Лигас атакует протестующих"
 arg.4.d: "Члены военизированных патриотических лиг взяли на себя ответственность за обращение с протестующими, обвиняя их в том, что их ввели в заблуждение марксистским влиянием, а также в том, что они погрязли в памяти патагонийского восстания, и как таковые имели место случаи открытого нападок на этих протестующих."
 arg.4.a: "Мы должны остановить лиги."
 arg.4.b: "Они делают то, что считают правильным."
 arg.5.t: "Лидеры протестующих хотят отвергнуть"
 arg.5.d: "В то время как протесты продолжаются, мы получаем проблеск надежды, как официальное послание от ведущих протестующих, лидера-коллекциониста Родольфо Гиолди, предлагающего отказаться от определенных прав и возможной договоренности. Хотя мы должны быть осторожны с тем, с кем имеем дело. ~ / n no с другой стороны, члены ЛПА в нашем правительстве неоднократно просили нас не принимать никаких требований, поскольку они считают, что переговоры с марксистами могут уничтожить нашу страну."
 arg.5.a: "Мы не будем вести переговоры с агитаторами."
 arg.5.b: "Любое соглашение, которое приведет нас к стабильности, хорошо."
 arg.6.t: "Активизация протестов"
 arg.6.d: "Еще одна толпа из них окружила Ла Касу Росаду, и, похоже, они не хотят уезжать."
 arg.6.b: "У нас нет выбора, стреляйте в протестующих."
 arg.6.a: "Мы должны подождать, пока они уйдут."
 arg.7.t: "Активизация протестов"
 arg.7.d: "Еще одна толпа из них окружила Ла Касу Росаду, и, похоже, они не хотят уезжать."
 arg.7.b: "У нас нет выбора, стреляйте в протестующих."
 arg.7.a: "Мы должны подождать, пока они уйдут."
