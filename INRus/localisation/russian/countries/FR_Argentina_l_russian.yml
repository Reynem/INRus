 UBR_bcw_ended: "Союз Бразилии победил."
 ARG_the_social_regime: "Социалистическое правительство"
 ARG_the_social_regime_desc: "Новая эра начинается для Аргентины при социалистическом правительстве Паласиоса."
 ARG_agrarian_model: "Аграрная реформа"
 ARG_agrarian_model_desc: "Наше социалистическое правительство успешно провело аграрную реформу в интересах фермеров."
 ARG_conservative_model: "Притягивание деловых операций"
 ARG_conservative_model_desc: "Инвесторы дрожат от нашей экономики."
 ARG_plane_production: "План авиационного производства"
 ARG_plane_production_desc: "Мы осуществили план по укреплению нашей авиационной инфраструктуры и повышению качества наших самолетов."
 ARG_black_wednesday: "Экономический кризис в Аргентине"
 ARG_black_wednesday_desc: "Что было страшно, последствия Лондонского рынка наконец-то обрушились на Аргентину и нанесли нам ущерб."
 ARG_black_wednesday1: "Выход из кризиса рынка"
 ARG_black_wednesday1_desc: "Мы начали оправляться от катастрофических последствий крушения Лондонского фондового рынка."
 ARG_black_wednesday2: "Выход из кризиса рынка"
 ARG_black_wednesday2_desc: "Мы восстанавливаемся от катастрофических последствий Лондонского фондового рынка."
 ARG_british_companies: "Британские компании"
 ARG_british_companies_desc: "Британское влияние велико в нашей экономике, и не только наша экспортная экономика основана главным образом на торговле с ними, но и британские компании в нашей стране, такие как Аргентинская Южная земельная компания или Ла Форевал, продемонстрировали большое влияние и контроль над нашими производственными секторами, и мы почти зависим от них."
 ARG_british_companies1: "Британские компании"
 ARG_british_companies1_desc: "Британское влияние велико в нашей экономике, и не только наша экспортная экономика основана главным образом на торговле с ними, но и британские компании в нашей стране, такие как Аргентинская Южная земельная компания или Ла Форевал, продемонстрировали большое влияние и контроль над нашими производственными секторами, и мы почти зависим от них."
 ARG_memories_of_the_chaco_war: "Воспоминания войны Чако"
 ARG_memories_of_the_chaco_war_desc: "В то время как наши люди мужественно сражались, последняя война причинила огромные потери нашему боевому населению, а теперь воспоминания о ней глубоко затрагивают наше общество."
 ARG_memories_of_the_chaco_war1: "Воспоминания войны Чако"
 ARG_memories_of_the_chaco_war1_desc: "В то время как наши люди мужественно сражались, последняя война причинила огромные потери нашему боевому населению, а теперь воспоминания о ней глубоко затрагивают наше общество."
 ARG_labour_strikes: "Забастовки на рабочем месте"
 ARG_labour_strikes_desc: "Рабочие протестуют в промышленных зонах нашей страны."
 ARG_radicalist_model: "Твердая модель"
 ARG_radicalist_model_desc: "Сейчас, когда мы стремимся к неуклонному совершенствованию нашей страны, мы делаем небольшие обновления нашей экономической модели, с тем чтобы она лучше отвечала интересам Аргентины."
 ARG_the_collectivist_revolution: "Аргентинская революция"
 ARG_the_collectivist_revolution_desc: "Революция прибыла."
 ARG_collective_agriculture: "Коллективное сельское хозяйство"
 ARG_collective_agriculture_desc: "Сельскохозяйственная система была коллективизирована, что позволило лучше привести ее в соответствие с требованиями нашей страны."
 ARG_redistribution_production: "Перераспределенное производство"
 ARG_redistribution_production_desc: "Мы перераспределяем то, что мы производим для устранения неравенства в нашем обществе."
 ARG_the_collectivist_revolution1: "Аргентинская революция"
 ARG_the_collectivist_revolution1_desc: "Революция осела на Аргентине."
 ARG_the_collectivist_revolution2: "Революционная Республика"
 ARG_the_collectivist_revolution2_desc: "Революция осела на Аргентине."
 ARG_state_controlled_economy: "Государственная экономика"
 ARG_state_controlled_economy_desc: "Социалистическое государство установило контроль над экономикой Аргентины."
 ARG_union_cooperation: "Сотрудничество с профсоюзами"
 ARG_union_cooperation_desc: "Правительство уделяет большое внимание оказанию помощи трудящимся, испытывающим трудности."
 ARG_the_radicalist_regime: "Радиалистический режим"
 ARG_the_radicalist_regime_desc: "Поскольку время неприятностей затрагивает нашу страну, Украинская армия одержала верх над нашим законным демократическим режимом."
 ARG_the_radicalist_regime1: "Радиалистический режим"
 ARG_the_radicalist_regime1_desc: "Поскольку время неприятностей затрагивает нашу страну, Украинская армия одержала верх над нашим законным демократическим режимом."
 ARG_the_radicalist_regime2: "Радиалистический режим"
 ARG_the_radicalist_regime2_desc: "Поскольку время неприятностей затрагивает нашу страну, Украинская армия одержала верх над нашим законным демократическим режимом."
 ARG_red_militia: "Красные ополчения"
 ARG_red_militia_desc: "Революционное ополчение высоко в моральном духе и выступает в защиту революции."
 ARG_centralized_militia: "Централизованные ополчения"
 ARG_centralized_militia_desc: "Революционное ополчение высоко в моральном духе и выступает в защиту революции, под центральным социалистическим командованием они достаточно эффективны."
 ARG_collectivism_banned: "Запрещение коллективизма"
 ARG_collectivism_banned_desc: "Мы запретили опасным коллективистам, а также другим экстремальным социалистическим движениям."
 ARG_censuring_reactionaries: "Обеспеченные реакции"
 ARG_censuring_reactionaries_desc: "Мы осудили распространение реакционных идей, которые угрожают нашей революции."
 ARG_revolutionary_leadership: "Руководство Революционной армии"
 ARG_revolutionary_leadership_desc: "Старые руководители армии были заменены новым революционным, хотя и менее опытным офицерским корпусом."
 ARG_socialist_intelligence: "ЦРУ."
 ARG_socialist_intelligence_desc: "Совет разведки Аргентины является силой, призванной защищать интересы социалистического государства, когда речь идет об информации и деликатных вопросах."
 ARG_in_peoples_defense1: "В защиту народа"
 ARG_in_peoples_defense1_desc: "Поскольку наше социалистическое государство находится в опасности, пришло время храбрым вновь встать на свой долг и дать все, что они должны, в защиту людей."
 ARG_the_nationalist_pact: "Соглашение с ЛПА"
 ARG_the_nationalist_pact_desc: "ЛПА усилила влияние на наше правительство, в предположительно взаимовыгодных отношениях, которые не все одобряют."
 ARG_the_nationalist_pact1: "Национальный режим"
 ARG_the_nationalist_pact1_desc: "Патриотический режим в Аргентине прочно утвердился, и благодаря ему наше будущее обеспечено."
 ARG_the_nationalist_government: "Национальное возрождение"
 ARG_the_nationalist_government_desc: "Под полным контролем LPA Аргентина возрождается."
 ARG_bastion_proletariat: "Бастион Пролетариата"
 ARG_bastion_proletariat_desc: "Мы - бастион пролетариата."
 ARG_fighting_unemployment: "Борьба с безработицей"
 ARG_fighting_unemployment_desc: "Наше правительство делает все возможное для решения проблемы безработицы."
 ARG_fighting_unemployment1: "Модель ISI"
 ARG_fighting_unemployment1_desc: "Наше правительство приняло модель МСИ, чтобы поддержать Аргентину."
 ARG_benefits_enlistment: "Выгоды для приема на работу"
 ARG_benefits_enlistment_desc: "Те, кто борются за свою родину, храбры, герои и легенды, мы будем относиться к ним так, как они заслуживают, и они будут знать, что их поддержка будет вознаграждена."
 ARG_patriotic_conscription: "Патриотическая воинская обязанность"
 ARG_patriotic_conscription_desc: "Каждый аргентинец обязан служить своему народу с гордостью и мужеством, и, как и ожидалось, мы увеличим число прихожан и их возможности служить своей любимой республике."
 ARG_patriotic_conscription1: "Все за Аргентину"
 ARG_patriotic_conscription1_desc: "Каждый аргентинец обязан служить своему народу с гордостью и мужеством, и, как и ожидалось, мы увеличим число прихожан и их возможности служить своей любимой республике."
 ARG_paramilitary_vigilance: "Военизированная бдительность"
 ARG_paramilitary_vigilance_desc: "Военизированные лиги помогают нашему правительству в укреплении и обеспечении стабильности нашего общества в условиях хаоса."
 ARG_controlled_unions: "Контролируемые союзы"
 ARG_controlled_unions_desc: "С появлением профсоюзов наше влияние на социальное положение и нашу способность контролировать экономику с помощью непопулярных мер возрастает."
 ARG_benefits_enlistment1: "Все за Аргентину"
 ARG_benefits_enlistment1_desc: "Те, кто борются за свою родину, храбры, герои и легенды, мы будем относиться к ним так, как они заслуживают, и они будут знать, что их поддержка будет вознаграждена."
 ARG_vanguard_agriculture: "Программа социальных работ"
 ARG_vanguard_agriculture_desc: "Эта социальная программа, которую считают близкой к принудительному труду диссидентами, обеспечит максимальное производство и даст нашему обществу необходимый импульс."
 ARG_corporatist_society: "Конкордатистская экономика"
 ARG_corporatist_society_desc: "Конкордатистская модель прочно укоренилась в нашей экономике."
 ARG_corporatist_society1: "Государственная корпорация"
 ARG_corporatist_society1_desc: "Государство имеет последнее слово и следит за полным функционированием нашего экономического режима."
 ARG_autarchy: "Автаркия"
 ARG_autarchy_desc: "Аргентина достигла автоархии, нам не нужен никто, кроме нас самих."
 ARG_the_orthodox_tradition: "Социалистические традиции"
 ARG_the_orthodox_tradition_desc: "Наше общество считает социализм частью своего внутреннего духа."
 ARG_orthodox_agriculture: "Марксистская аграрная система"
 ARG_orthodox_agriculture_desc: "Наше общество так хорошо восприняло марксизм, что даже наши фермы марксисты."
 ARG_the_anarchist_revolution: "Дух анархиста"
 ARG_the_anarchist_revolution_desc: "Свободные идеалы марксизма захватили наше общество."
 ARG_the_orthodox_revolution: "Коллективное общество"
 ARG_the_orthodox_revolution_desc: "Коллективные идеалы захватили наше общество."
 ARG_the_vanguardist_revolution: "Режим авангарда"
 ARG_the_vanguardist_revolution_desc: "Идеи авангардистов восторжествовали, а теперь правят над нашим обществом."
 ARG_censuring_all: "Сообщник против предателей"
 ARG_censuring_all_desc: "Мы повернули вспять наши усилия по проявлению бдительности в отношении всего и каждого, кто может угрожать нашему социалистическому режиму."
 ARG_the_junta_government: "Военное правительство"
 ARG_the_junta_government_desc: "Защищенные от опасного влияния, военные ведут нас."
 ARG_the_radicalist_regime3: "Ужасный радикализм"
 ARG_the_radicalist_regime3_desc: "Радиалистическая идеология оказалась демократическим маяком, направляющим наше общество."
 ARG_fighting_unemployment2: "Новый открытый рынок"
 ARG_fighting_unemployment2_desc: "Мы открыли себя миру, и как таковые это влияет на нашу экономику, как мы надеемся, к лучшему."
