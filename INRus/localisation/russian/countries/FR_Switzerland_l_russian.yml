l_russian:

 SWI_FUHRERREICH_DESC: "Швейцария никогда не ввязывалась в иностранную войну более века назад, не со времен Наполеона. В прошлом году было испытано то, что было более двух десятилетий либерального доминирования, с генеральным ударом 1935 года. Хотя Швейцария все еще стабильна, память об этой социалистической агитации и возможной будущей германской агрессии оставляет эту Альпийскую нацию со многими друзьями, но немного союзников..."

