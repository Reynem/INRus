 # SWI_henri_guisan_commander_desc: "§L\n §YBorn: §L\n October 21, 1874\nMéziers, Vau, Switzerland\n §Y Военная карьера: §L\nBorn в франкоговорящей части Швейцарии, первоначально Гуизан посещал школу и изучал сельскохозяйственную медицину. Однако после поступления на службу в швейцарские военные в 1894 году он постепенно поднялся на ряды и был повышен до лейтенанта генерал-лейтенанта в 1932 году, самого высокого ранга в мирное время."

