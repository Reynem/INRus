 ### EVENTS ###
 swi.99.d: "Что вы делаете? Вы так много играли в эту игру, что решили играть в Швейцарию? Эта нация ничего не имеет, она нейтральная и скучная. Получите жизнь."
 swi.1.d: "В течение последнего столетия, с эпохи Наполеона, швейцарская нация не ввязалась в иностранную войну. В то время как Великая война почти пару раз привела нашу страну на грань мэлстрома, ни одной угрозы не хватало для обеспечения того, чтобы у нас не было выбора. Наша страна продолжала развиваться вверх и вверх, в то время как швейцарский Закон о банковской деятельности давал небольшую, но постоянную прибыль от одного из наших наиболее влиятельных торговых секторов, некоторая социалистическая агитация в форме СПДС привела к одному из самых разрушительных ударов в недавней памяти, которые закрыли многие фабрики и железнодорожные системы. Переговоры были быстрыми и бескровными, но не менее ощущались разрывы. В ходе трех последовательных выборов Федеральный совет не видел никаких изменений, и совместная коалиция Фрейсинниг-Демократиш Партие/Кристикохдемадрати Волпартеи властила остается прочным, и наши враги не имеют большого значения. Даже в следующем десятилетии мы остаемся сильными в наших славных Альпах."
 swi.2.d: "Французы и немцы ремилитаризируют, но один явно больше, чем другой."
 swi.3.d: "Швейцарское правительство купило несколько единиц оружия отечественного производства и хотело бы продать их нам."
 swi.4.d: "Швейцарское правительство купило несколько единиц оружия отечественного производства и хотело бы продать их нам."
 swi.5.d: "Швейцарское правительство, выходящее на рынок оружия на государственном уровне, предлагало французам оружие вместо нас!"
 swi.6.d: "Швейцарское правительство, выходящее на рынок оружия на государственном уровне, предлагало немцам оружие вместо нас! Каков наш следующий шаг, ибо мы, конечно, не позволим этому проскользнуть незамеченным."
 swi.7.d: "Наша продажа оружия принесла потрясающую прибыль."
 swi.8.d: "Французы, возмущенные нашей продажей оружия "врагу", потребовали, чтобы мы пришли за стол Энниси и подписали соглашение никогда больше не продавать оружие немцам."
 swi.9.d: "Немцы, возмущенные нашей продажей оружия "врагу", потребовали, чтобы мы пришли за столик Мюнхена и подписали соглашение никогда больше не продавать оружие французам."
 swi.10.d: "Мы можем быть более чем согласны с французскими требованиями - мы не думали так, как они сейчас, это переговоры, конечно, а не тираническое принуждение."
 swi.11.d: "Швейцария протестует против нашего договора и считает, что он носит ограничительный характер и представляет собой одну из форм экономической войны с малыми государствами за рубежом."
 swi.12.d: "Французы согласились пересмотреть договор."
 swi.13.d: "Мы можем быть более чем согласны с немецкими требованиями - думали не так, как сейчас, конечно, они не пытаются нас разозлить?"
 swi.14.d: "Швейцария протестует против нашего договора и считает, что он носит ограничительный характер и представляет собой одну из форм экономической войны с малыми государствами за рубежом."
 swi.15.d: "Немцы согласились пересмотреть договор."
 swi.16.d: "На протяжении последних нескольких месяцев политическая обстановка была сосредоточена на подготовке специалистов в области огнестрельного оружия и их месте в швейцарской экономике. &quot; Несмотря на то, что многие секторы труда осуществляют программы профессиональной подготовки &quot; , профессиональная подготовка в области производства оружия ориентирована также на молодых кузнецов, которые, стимулируя оружейную индустрию, имеют поддающееся оценке количество несчастных случаев и ущерба. &quot; Что нам следует делать с этим? &quot; ."
 swi.17.d: "Швейцария предложила сократить наши иностранные поставки, если мы позволим им арендовать наши государственные порты для продажи своей продукции."
 swi.18.d: "Итальянцы позволяют нам наконец использовать свои порты! Теперь наша экономика может сосредоточиться на международном, а не исключительно европейском рынке. Больше никаких посредников!"
 swi.19.d: "Итальянцы не сдадут наши порты в аренду без лучшей оплаты."
 swi.20.d: "Итальянцы отказали нам в доступе к своим портам, ссылаясь на то, что нам следует приставать к отечественным компаниям, чтобы увидеть свою продукцию в соседних странах, а не пытаться воспользоваться государственными портами."
 swi.21.d: "Швейцарцы согласились на наши... переговоры."
 swi.22.d: "Швейцарцы отвергли наше предложение открыть порты за жесткий налог, ведь они понимают, что это наши законные порты?"
 swi.23.d: ""
 swi.24.d: "Этнические французские швейцарцы западной части Швейцарии в течение последних нескольких недель внимательно наблюдают за французскими выборами."
 swi.25.d: ""
 swi.26.d: "За последнюю неделю швейцарцы направили нам несколько дипломатических представительств для посредничества в установлении мира между нашей страной и ее страной."
 swi.27.d: ""
 swi.28.d: ""
 swi.29.d: ""
 swi.30.d: "Наши поставки готовы к отправке за границу."
 swi.31.d: "Швейцарцы пришли к нам со сделкой - гражданские товары для своего оружия, они утверждают, что предлагают нам более выгодную сделку, чем соревнование..."
 swi.32.d: "Наше последнее предложение было принято, теперь у нас есть государство, которое финансирует нашу индустрию."
 swi.33.d: "Швейцария, которая ранее предлагала американцам сделки с оружием, пришла к нам, чтобы узнать, желает ли правительство купить свои товары, включая оружие, для товаров гражданского назначения."
 swi.34.d: "Швейцария, которая ранее предлагала сделки с оружием американцам и англичанам, пришла к нам, чтобы узнать, желает ли правительство купить их товары, включая оружие, для товаров гражданского назначения."
 swi.35.d: "Швейцария, которая ранее предлагала сделки с оружием американцам, англичанам и японцам, пришла к нам, чтобы узнать, желает ли правительство закупить их товары, включая оружие, для товаров гражданского назначения."
 swi.36.d: "Швейцарские власти, которые ранее предлагали сделки с оружием американцам, англичанам, японцам и манчжурцам, пришли к нам, чтобы узнать, желает ли правительство закупить их товары, включая оружие, для товаров гражданского назначения."
 swi.37.d: "В потрясающем повороте ни одна страна в мире, которой мы предложили наши товары, не согласилась."
 swi.38.d: "Поразительно, что последняя копия синдицированного «Иль Матире ди Рома», ныне печально известного сценного производства, основанного на жизни Бенито Муссолини, одного из ведущих социалистов за Красным годом Италии и вечного красного мученика, была захвачена государственной полицией, когда они напали на дом подозреваемых социалистических революционеров, той же неприязни, которая вызвала беспорядки и забастовки 1935 года."
 swi.39.d: "Габсбургские королевские короли из различных кутерий, включая Италию, Венгрию и Соединенное Королевство, собрались на последнюю неделю для празднования исторического брака, который во многом потряс исторический европейский королевский институт в самом его ядре. Брак между Вильгельмом IV, главным вопросом дома Хохензолерна, и архидучей Росой фон Остеррейх, одной из самых выдающихся герцогинь Хабсбургского дома, был брак в Люцерне, Швейцария, в течение выходных. В то время как оба дома запретили, в неофициальном или официальном порядке, маргариджу законного потомства для незаземленных женихов, этот брак имел место в обоих домах. В то время как оба супруга де-юре имеют право наследства, ни один из них не имеет власти на родине их рождения. Что это могло бы представлять, если бы это было отменено, однако, является монументальным..."
 swi.40.d: ""
 swi.100.d: "Федеральные выборы 1939 года идут к нам! в этом году они разделены между действующей коалицией ФДП-CDVP, объединением ССРС и меньшинством СУП. За ними стоит разбрызгивание этнических националистических партий и социалистических коммунистов, хотя ни одна из этих партий, как ожидается, не получит более чем по паре мест каждая. ФДП, которая возглавляла совет на последних трех выборах, может быть оспорена. Нынешний совет, который состоит из четырех членов ФДП, двух членов КРВП и одного члена УРПС, не изменился с 1919 года, но это может легко измениться в предстоящие недели..."
 swi.101.d: "Бюллетени придут, и большинство кантонов уже сообщили о них; эти выборы показывают результат..."
 swi.102.d: "СППС, число мест которой резко изменилось на предыдущих выборах, требует еще одного места в совете, хотя они уже контролируют один, они, кажется, действительно хотят другого... пока не уверен, кого они изберут, но это наверняка кто-то спорный, даже в своей собственной партии..."
 swi.103.d: "СУП, которая, наконец, провела значительную долю голосов и представляла себя в качестве альтернативы некрепкому либерализму ФДП и всеохватывающему социализму ССРС, требует места в совете."
 swi.104.d: "Членство в Совете Куциля, когда-то переживавшее о том, что он вступает в изменчивое положение, не претерпело каких-либо радикальных изменений в ходе недавних выборов, хотя ДПФ и КРВП получили несколько мест, не ожидается, что ни одна партия не будет избрана в совет."
 swi.106.d: "Вчера Рудольф Мингер, лидер &quot; Кристлихдемократиши Volkspartei &quot; , дал интервью в прессе о своем стремлении вернуть Швейцарию к ее &quot; аграрным корням &quot; . &quot; Эта договоренность &quot; идет вразрез с коалиционной линией ФДП-CDVP, которая утверждает, что она обслуживает всех граждан Швейцарии, от ферм до городских центров и других развитых регионов. &quot; Движение &quot; , по меньшей мере, было сочтено крайне неубедительным с политической точки зрения &quot; ."
 swi.107.d: "Голосование ФДП в Совете, который пытался улучшить военные действия с социалистическими фракциями в Швейцарии путем переговоров, состоялось вчера."
 swi.108.d: "Результаты опросов, проведенных в Федеральном совете и Национальном совете, свидетельствуют о том, что стало очевидно смещение в сторону политики CDVP. Несколько членов ПДФ отошли от политических позиций после насильственных действий в ответ на забастовки и более широкое социалистическое движение в Швейцарии. В то время как несколько консервативных членов пытаются остановить возможный путь к тирании, несколько радикальных членов ПДСП пытаются сделать себя известными и услышать себя."
 swi.109.d: "Переговоры с социалистическими байкерскими группами окупились! Хотя нам пришлось пойти на некоторые уступки, мы избежали широкомасштабной катастрофы, подобной 1935 году. Забастовщики, как правило, возвращаются к работе, и рабочие места, которые были однажды закрыты на несколько дней, снова работают."
 swi.110.d: "С этого момента коалиция в ее нынешнем виде может считаться распущенной, и уже ведутся переговоры между СППС и СДП, но после недавних забастовок большинство политических комментаторов утверждают, что это далеко не возможно."
 swi.111.d: "Жан Дебет, политический новичок из кантона Женева, выступил сегодня в Национальном совете с удручающей речью, осуждающей капитуляцию Партии Фрейсиннига-Демократиши социалистическим протестующим."
 swi.112.d: "Альберт Мейер, лидер НДП, сегодня подал заявление об отставке от швейцарской политики."
 swi.113.d: "В заявлении, опубликованном сегодня штаб-квартирой ПДП в Берне, большинство оставшихся членов Национального совета ПДП согласились сформировать коалицию с ЦПЖ, при этом их партия в качестве представителей меньшинств."
 swi.114.d: ""
 swi.115.d: "Несколько социалистических групп, в частности из радикальных сект ССРЗ и Арбейтер-Социалист-Лига, организовали широкомасштабные забастовки и протесты по всей стране! Это, несомненно, негативная реакция на недавние выборы по статус-кво во многих отношениях, они отражают удары 1935 года, а некоторые из членов нашей коалиции не столь склонны к переговорам на этот раз..."
 swi.116.d: "В результате этого был вынесен суровый приговор заклятым забастовщикам - в настоящее время в прессе ПДП, которая всего пару лет назад считалась политически сотрудничающим с НДП, пересматривает такую позицию."
 swi.117.d: "Вчера Роберт Тоблер, один из ведущих деятелей ЦГЖП, был избран в Федеральный совет, и сегодня он был избран президентом Швейцарии. Хотя эта должность сама по себе не имеет большого количества дополнительных привилегий, она была использована Тоблером в качестве предлога для роспуска олигархического характера кабинета. Коалиция ДСФ-ФДП в Национальном совете согласилась на условия огромного разногласия между УРПС, СУП и, как ни удивительно, каждой этнической националистической партией, имеющей места в Национальном совете. Несмотря на то, что Тоблер объявил, что это «нанесет удар социалистическим террористам из Женевы в Брегенз», Федеральный совет теперь действует скорее как кабинет, чем орган государства, и все обязанности были переданы по своему выбору, хотя член УРПС сохранил свою должность, по крайней мере на данный момент."
 swi.118.d: "Сдача больших участков швейцарской территории нашим врагам повлекла за собой хаос в швейцарском правительстве. В свете этих событий произошел националистический переворот, свергнув правительство и создав прогерманское правительство во главе с Эугеном Бирчером. Хотя во многих германоязычных регионах Швейцарии они приветствовали его как спасителя, жители других регионов обеспокоены тем, что нация может стать полностью немецкой."
 swi.420.d: "В свете недавнего неспособности удержать врагов от наших границ, беженцы уходят из [королевы.Гетнам] в автомобилях, их точные опухоли еще предстоит увидеть, не говоря уже о том, что они будут бороться за то, чтобы добраться туда с вражескими блокадами, патрулирующими воды, уже есть информация, что Швейцария более чем рада принять беженцев..."


 ### Characters ###
 SWI_jakob_herzog: "Якоб Герцог"
 # SWI_jakob_herzog_leader_desc: "Якоб Герцог родился в 1892 году в семье рабочего класса в Цюрихе, его отец был работником и фермером, в то время как его мать была поваром. Он попытался стать католиком, но в конце концов нашел свое истинное призвание как часть социалистической молодежи в 1912 году. Он стал редактором Фрейи Югенда ( &quot; Свободная молодежь &quot; ) и начал свою карьеру анархиста, но в конечном итоге сорвался с более основных социалистов, как это было в эти годы. Его новая партия, военизированная Арбейтервях ( &quot; Трудящиеся &quot; ) ( &quot; Охранники &quot; ) вырастла из более авторитарной русской революционной модели по сравнению с более местной французской моделью, за которой последовали его швейцарские современники. Однако в связи с возрастанием в Великобритании Herzog вскоре нашел новых друзей с такими людьми, как Освальд Мосли и Бенито Мусолининининини. Его новая партия, вошла в старый политический кризисный, и внутренний репрессист &quot;"

 SWI_federal_union_council: "Совет федерального союза"
 SWI_federal_union_council_leader_desc: "Федеральный союзный совет является временным правительственным органом швейцарского синдикалистского государства после свержения правительства, приверженным стабилизации и реформированию швейцарской нации."
 SWI_federal_union_council_executive_leader_desc: "После революции Исполнительный справочник является постоянным главой государства, который занимает аналогичную позицию по отношению к Федеральному совету старого периода, но наделен более широкими исполнительными полномочиями в этом Справочнике, с тем чтобы можно было принимать более решительные меры во время кризиса."

 SWI_swiss_federal_council: "Федеральный совет Швейцарии"
 SWI_swiss_federal_council_leader_desc: "Основанный в 1848 году Федеральный совет Швейцарии является исполнительным советом в составе семи членов, который является коллективным главой государства Швейцарии."

 SWI_eugen_bircher: "Евгений Бирчер"
 #SWI_eugen_bircher_leader_desc: "Эуген Бирчер является врачом по профессии и изобрел несколько новаторских процедур, связанных с артроскопией колена, после того как синдикалистизм во Франции в значительной степени отказался от своей медицинской работы и основал SVV, которая быстро охватила швейцарские военные и политические круги в качестве противовеса растущему потоку социализма в стране."
 SWI_eugen_bircher_commander_desc: "Общее описание: §L\n §YBorn: 17 февраля 1882/nAarau, Aargau, Switzerland\n §Y Военная карьера: §L\nAll вместе с Анри Гуизаном Бирчер занимает самое высокое положение швейцарских военных в мирное время, однако, в отличие от его равных, он проводит большую часть своего времени в политике, возглавляя полусекретную крайне правую организацию с большим влиянием в швейцарском правительстве."

