 #### Ideas ####

 SWI_Vorarlberg: "Статус Ворарльберга"
 SWI_Vorarlberg_desc: "В 1919 году народ Форарльберга, официально являющийся регионом Австрии, проголосовал за вступление в Швейцарию, однако этот шаг вызвал религиозную и энтическую напряженность. Большинство протестантских и итальянских кантонов были против вмешательства Ворарлберга. Когда мир, казалось бы, вновь вспыхнул в напряженном положении, этот вопрос вновь привлек внимание общественности. Что следует сделать с Ворарльбергом?"
 SWI_arms_industry: "Швейцарская оружейная промышленность"
 SWI_arms_industry_desc: "Швейцария известна своими отличными кузнецами и мастерами по производству оружия."
 SWI_die_schweizer_armee: "Умереть с оружием Schweizer"
 SWI_die_schweizer_armee_desc: "Бóльшая часть швейцарских сухопутных сил - это вооруженные силы &quot; Швайзер &quot; (швейцарские вооруженные силы). &quot; Добровольцы &quot; принимаются из числа лиц старше 18 лет, а служба является обязательной для лиц старше 20 лет, хотя она вряд ли когда-либо должна быть найдена в положении, требующем агрессивных маневров, она хорошо вооружена и благодаря политике набора на военную службу."
 SWI_the_swiss_banking_act: "Швейцарский закон о банковской деятельности"
 SWI_the_swiss_banking_act_desc: "Подписанный 1 декабря 1933 года швейцарский Закон о банковской деятельности был разработан в целях обеспечения сохранности активов держателей счетов в Швейцарии, что явилось реакционной мерой против вмешательства Франции в Рейнленде, в результате чего многие иностранные активы в регионе были закрыты, а их доходы были конфискованы."
 SWI_swiss_neutrality: "Швейцарская нейтральность"
 SWI_swiss_neutrality_desc: "Швейцарское государство имеет гордую традицию не участвовать в иностранных войнах, которые не были сорваны со времен Наполеона."
 SWI_arms_industry_licenses_revoked: "Швейцарская оружейная промышленность"
 SWI_arms_industry_licenses_revoked_desc: "Лицензии на производство оружия были отозваны у всех, кроме самых важных частных производителей оружия."
 SWI_arms_industry_licenses_revoked_taxing_weapons: "Швейцарская оружейная промышленность"
 SWI_arms_industry_licenses_revoked_taxing_weapons_desc: "Лицензии на производство оружия были аннулированы у всех, за исключением самых важных частных производителей оружия, и мы начали снимать с них налоги, причем эти налоги поступают не в форме денег, а в форме оружия."
 SWI_arms_industry_taxing_weapons: "Швейцарская оружейная промышленность"
 SWI_arms_industry_taxing_weapons_desc: "Швейцария известна своими отличными кузнецами и мастерами по производству оружия."
 SWI_diplomatic_ventures: "Дипломатические предприятия"
 SWI_diplomatic_ventures_desc: "Швейцария ищет торговлю за рубежом."
 SWI_restriction_on_gun_production: "Ограничение производства оружия"
 SWI_restriction_on_gun_production_desc: "В настоящее время в Швейцарии действует официальная политика, предусматривающая ограничение всех программ ученичества, и в настоящее время там могут продолжать работать только те, кто уже работает в частной оружейной промышленности."
 SWI_end_youth_apprenticeships_programs: "Прекращение программ профессиональной подготовки молодежи"
 SWI_end_youth_apprenticeships_programs_desc: "Молодежь в возрасте до 19 лет не имеет права участвовать в программах ученичества, связанных с боевым оружием."
 SWI_mandatory_youth_weapons_education: "Обязательное просвещение молодежи по вопросам, касающимся оружия"
 SWI_mandatory_youth_weapons_education_desc: "Все молодые люди в возрасте от 10 до 19 лет в какой-то момент в течение этих девяти лет будут как минимум бегло смотреть на оружие."
 SWI_small_port_access_boon: "Разрывы в доступе к малым портам"
 SWI_small_port_access_boon_desc: "Хотя швейцарцам предоставляется доступ к нашим портам, по сути, бесплатно, в последнее время мы по-прежнему получаем деньги за благо в исходящих поставках."
 SWI_large_port_access_boon: "Крупные дивиденды доступа к портам"
 SWI_large_port_access_boon_desc: "Швейцарцы платят нам за доступ в наши порты."
 SWI_radical_suppression_german: "Пресечение деятельности немецких радикальных групп"
 SWI_radical_suppression_german_desc: "Правительство Швейцарии в настоящее время продвигает политическую повестку дня, решительно противоречащую целям ВФП."
 SWI_radical_suppression_french: "Пресечение деятельности французских радикальных групп"
 SWI_radical_suppression_french_desc: "Правительство Швейцарии в настоящее время продвигает политическую повестку дня, решительно противоречащую целям ФРП."
 SWI_radical_suppression_german_and_french: "Пресечение деятельности этнических радикальных групп"
 SWI_radical_suppression_german_and_french_desc: "Правительство Швейцарии в настоящее время продвигает политическую программу швейцарского единства."
 SWI_war_refugee_increase: "Беженец-беженец"
 SWI_war_refugee_increase_desc: "Иностранные беженцы уезжают из своих стран с начала второй Великой войны."
 SWI_war_refugees_departing: "Беженцы войны, пустыня"
 SWI_war_refugees_departing_desc: "Беженцы уходят с тех пор, как эта война повернулась против нашей благосклонности."
 SDPS_party_line_on_unionism: "Партия &quot; Союзизм &quot; : SDPS - поощряется"
 SUP_party_line_on_unionism: "Партийная линия по профсоюзности: SUP - необязательная"
 SDPS_banking_reforms: "Партийная линия по банковскому делу: SDPS - Грубые реформы"
 SUP_banking_reforms: "Партия по банковской линии: SUP - Lenient Reforms"
 SUP_christian_education: "Христианское воспитание"
 SDPS_weapons_within_switzerland: "Хранение оружия в Швейцарии"
 SWI_SDPS_socialist_infrastructure_plan: "Путь Блиц"
 SDPS_defense_planning: "Партия на линии обороны: SDPS - Сосредоточьтесь на армии"
 SUP_defense_planning: "Партийная линия обороны: SUP - фокус на фортах"
 SDPS_weapons_manufactories_on_state_budgets: "Манументы, финансируемые государством"
 SUP_health_subsidies: "Субсидии на здравоохранение"
 SUP_school_reform: "Школьные реформы"
 SUP_progressive_infrastructure_hard: "Партийная линия по инфраструктуре: SUP - непосредственный стимул по инфраструктуре"
 SUP_progressive_infrastructure_soft: "Партийная линия по инфраструктуре: SUP - последовательный подход к инфраструктуре"
 SWI_FVP_gains_momentum: "FVP выигрывает момент"
 SWI_FVP_gains_momentum_desc: "Французская Народная партия получила новую жизнь в результате событий за пределами Швейцарии."
 SWI_VWF_gains_momentum: "ВФП выигрывает момент"
 SWI_VWF_gains_momentum_desc: "Отечественный фронт и Фронт воссоединения получили новую жизнь в результате событий за пределами Швейцарии."
 SWI_DNDAP_gains_momentum: "DNDAP выигрывает момент"
 SWI_DNDAP_gains_momentum_desc: "Немецкая национальная демократическая партия рабочих получила новую жизнь в результате событий за пределами Швейцарии."
 SWI_building_air_fields: "Здание воздушных полей"
 SWI_building_air_fields_desc: "Что такое военно-воздушные силы без брезента под ними?"
 SWI_defense_here_and_now: "Защита здесь и сейчас"
 SWI_defense_here_and_now_desc: "Что такое нация без охраны?"
 SWI_military_action: "Срочные военные действия Швейцарии"
 SWI_military_action_desc: "Темные облака вращаются в Европе - мы думаем, что они тоже пройдут мимо нас?"
 SWI_fortress_switzerland_idea: "Крепость: Швейцария"
 SWI_fortress_switzerland_idea_desc: "Если они хотят сломать Хельветику, пусть это их сломает!"
 SWI_SDPS_socialist_infrastructure_plan_idea: "Партия &lt; &lt; Инфраструктура &gt; &gt; : SDPS -- Социалистический план развития инфраструктуры"
 SWI_owl_defense_idea: "Защита от совы"
 SWI_owl_defense_idea_desc: "Ночь в Альпах не похожа на многие другие места, поскольку многие из них не являются густонаселенными."
 SWI_german_swiss_mediation: "Швейцарское посредничество"
 SWI_german_swiss_mediation_desc: "Швейцарский народ, обладающий абсолютно немецкой нацией, которая действует вне нашей сферы, попытался послать дипломатических представителей публично!"
 SWI_swiss_mediation: "Швейцарское посредничество"
 SWI_swiss_mediation_desc: "Швейцарцы, которые продолжают клясться в нейтралитете, обращаются к странам, находящимся за пределами их границ, после роста напряженности."
 SWI_empty_southern_industry_rosters: "Пустые реестры южной промышленности"
 SWI_empty_southern_industry_rosters_desc: "Немцы, отправляющиеся в Швейцарию, недавно покинули промышленную дыру, особенно в юго-восточном Рейне."
 SWI_newfound_political_hegemony: "Новая политическая гегемония"
 SWI_newfound_political_hegemony_desc: "Немцы, которые недавно уехали в Швейцарию, оставили политическую дыру, которую мы можем легко заполнить."
 SWI_integrating_german_malcontents: "Интеграция немецких недовольств"
 SWI_integrating_german_malcontents_desc: "Недовольные немцы недавно прибыли в северные кантоны, чтобы начать новую жизнь в этой стране."
 SWI_railway_strikes: "Забастовки на железных дорогах социалистического типа"
 SWI_railway_strikes_desc: "Анархисты из SDPS и Коммунистической лиги избытка объединились на одном фронте - общее недовольство либеральной партией, правящей этой страной."
 SWI_1935_railway_strikes: "Железнодорожные забастовки 1935 года"
 SWI_1935_railway_strikes_desc: "Железнодорожные забастовки прошлого года затормозили нашу экономику, и их последствия будут ощущаться лишь на короткое время, но, несомненно, наша экономика сильно пошатнулась."
 SWI_unionbusters: "Охотники за профсоюзами"
 SWI_unionbusters_desc: "В города, население которых поражает, в первую очередь в Женеву и Цюрих, были направлены как нанятые, так и военные члены профсоюзов."
 SWI_improved_conditions: "Социал-реабилитация"
 SWI_improved_conditions_desc: "Либералийцы заключили контракт с лидерами железнодорожных забастовок в ответ на недавние выборы, и их последствия будут ощущаться по крайней мере в течение следующих нескольких лет."
 SWI_the_balance_of_power: "Баланс сил"
 SWI_the_balance_of_power_desc: "Власть - это бесполезное дело в руках тех, кто не хочет ее использовать. Мы это сделаем. Недостатки ФДП и социалистов все еще пытаются противостоять необходимости такой власти в эти опасные времена, и они могут попытаться задержать наши законопроекты и наши голоса. Они тоже потерпят неудачу."
 SWI_rebuilding_unity: "Восстановление единства"
 SWI_rebuilding_unity_desc: "Единство этой нации имеет первостепенное значение, насколько оно неравномерно и, как показали последние несколько недель, как быстро оно может разрушаться."
 SWI_national_economy: "Национальная экономика"
 SWI_national_economy_desc: "Экономика снова станет швейцарской, и большинство секторов больше не будут обслуживать страны без этого правительства заняли такую официальную позицию."
 SWI_the_alps_unite_campaign: ""The Alps: Unite!" Campaign"
 SWI_the_alps_unite_campaign_desc: ":: Всё, что я знаю."Die Alpen: Vereinen!" program is a military contingency plan enacted by the liberal government to bring about security to Switzerland for the near future. Its success will be measured not in the days from now, but the years from now. Widespread propaganda campaigns and inflation of conscription rolls are already in effect..."
 SWI_party_line_on_banking_legal_audits: "Партийная линия по банковскому делу: юридические аудиторские проверки"
 SWI_party_line_on_banking_legal_audits_desc: "На протяжении большей части последнего десятилетия Швейцария позволяла иностранным интересам хранить свои деньги здесь, якобы, безопасно. Меры за пределами наших границ заставили нас пересмотреть эту политику. С этого момента правительство законно будет проводить расследования и проверки в наших банках и обеспечивать, чтобы они отвечали требованиям государственной безопасности."
 SWI_swiss_education: "Швейцарское образование, национальное образование"
 SWI_swiss_education_desc: "История Швейцарии, как в прошлом, так и в настоящее время, имеет важнейшее значение для обеспечения того, чтобы население оставалось вместе и не было заманено иностранными угрозами. &lt; &lt; Немцы &gt; &gt; , &lt; &lt; французы &gt; &gt; , &lt; &lt; Итальянцы &gt; &gt; или &lt; &lt; римляне &gt; &gt; , только швейцарцы, и каждый уровень образования -- от самого маленького ребенка до высшей академии -- должен продемонстрировать это всем."
 SWI_market_liberal_hegemony: "Либеральная гегемония"
 SWI_market_liberal_hegemony_desc: "Хотя в этой стране все еще существует спор между различными политическими фракциями, либералы и консерваторы доминируют в дискуссии по воле народа."
 SWI_internal_remediation: ""Internal Remediation""
 SWI_internal_remediation_desc: "Радикалы в нашей стране, отчаянные и жестокие, должны быть быстро и целенаправленно ликвидированы. Это не страна для язычников и анархистов!"
 SWI_paying_for_guns: "Плата за оружие"
 SWI_paying_for_guns_desc: "Мы платим за швейцарское оружие, которое мы продаем более или менее любезно."
 SWI_paid_off_guns: "Оплата оружия"
 SWI_paid_off_guns_desc: "Иностранные штаты привезли наши пистолеты, и мы строим дивиденды."
 SWI_paying_for_our_guns: "Плата за швейцарские пистолеты"
 SWI_paying_for_our_guns_desc: "Социал-демократы начали политику покупки оружия у своих заводов, а не отправку его за границу."

