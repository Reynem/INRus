 CZE_sudeten_concessions_desc: "Мы предоставили концессии &lt; &lt; Судетену немцу &gt; &gt; , который мобилизовал наши усилия по содействию стабильности в регионе, хотя это и означало жертву."
 CZE_red_militia: "Народные ополчения"
 CZE_red_militia_desc: "Именно благодаря чистой воле и храбрости наших людей и социалистических ополчений мы строим наши силы, по мере того, как революция распространяется дальше."
 CZE_czech_legions: "Расширенные легионы"
 CZE_czech_legions_desc: "Мы расширили националистические легионы, отряды людей, готовых сделать все возможное, чтобы принести славу нашей нации и создать Чехословакию."
 CZE_suspended_democracy: "Демократия, приостановленная"
 CZE_suspended_democracy_desc: "С тех пор, как мир вернулся на наши земли после краха Западослава, нестабильность в нашей стране не прекратилась, поскольку диссиденты и революционеры остались в нашем обществе как болезнь, и, таким образом, демократия в чешском государстве по-прежнему приостановлена, поскольку хунта ждала улучшения ситуации."
 CZE_suspended_democracy1: "Демократия, приостановленная"
 CZE_suspended_democracy1_desc: "С тех пор, как мир вернулся на наши земли после краха Западослава, нестабильность в нашей стране не прекратилась, поскольку диссиденты и революционеры остались в нашем обществе как болезнь, и, таким образом, демократия в чешском государстве по-прежнему приостановлена, поскольку хунта ждала улучшения ситуации."
 CZE_suspended_democracyz: "Демократия, приостановленная"
 CZE_suspended_democracyz_desc: "С тех пор, как мир вернулся на наши земли после краха Западослава, нестабильность в нашей стране не прекратилась, поскольку диссиденты и революционеры остались в нашем обществе как болезнь, и, таким образом, демократия в чешском государстве по-прежнему приостановлена, поскольку хунта ждала улучшения ситуации."
 CZE_land_reform: "Новая земельная реформа"
 CZE_land_reform_desc: "Наши предыдущие земельные реформы не зашли достаточно далеко, чтобы принести пользу бедным и были слишком добры к большому бизнесу, пришло время изменить это, и создать более эффективное общество."
 CZE_revolution_collectivist: "Революционный социализм"
 CZE_revolution_collectivist_desc: "Сила нашего революционного духа укрепляет наше некогда разделенное общество, оказывая нашему правительству огромную поддержку во всех вопросах."
 CZE_rev_industry: "Промышленное планирование"
 CZE_rev_industry_desc: "Наша экономика и промышленный сектор растут под руководством социалистической государственной структуры планирования."
 CZE_socialist_intelligence: "Революционная разведывательная организация"
 CZE_socialist_intelligence_desc: "Революционная разведывательная организация была создана с одной целью, чтобы остановить революцию, следить за реакционными угрозами и делать добро Чехии в целом."
 CZE_welfare_reform: "Расширенная программа социального обеспечения"
 CZE_welfare_reform_desc: "Для решения различных социальных неравноправий и более широких социально-экономических проблем мы должны преобразовать наше благосостояние в более прогрессивную программу, похожую на единственную в Западославии."
 CZE_welfare_reform1: "Расширенная программа социального обеспечения"
 CZE_welfare_reform1_desc: "Для решения различных социальных неравноправий и более широких социально-экономических проблем мы должны преобразовать наше благосостояние в более прогрессивную программу, похожую на единственную в Западославии."
 CZE_agrarian_focus: "Аграрный акцент"
 CZE_agrarian_focus_desc: "Сосредоточив нашу страну на аграрной модели, это означает не только сельское хозяйство, но вместо того, чтобы иметь хорошо сбалансированное общество во всех аспектах, мы можем оптимизировать наше производство."
 CZE_agrarian_focus1: "Аграрный акцент"
 CZE_agrarian_focus1_desc: "Сосредоточив нашу страну на аграрной модели, это означает не только сельское хозяйство, но вместо того, чтобы иметь хорошо сбалансированное общество во всех аспектах, мы можем оптимизировать наше производство."
 CZE_dev_program: "Программа развития"
 CZE_dev_program_desc: "Благодаря осторожным и сбалансированным инвестициям мы можем разработать план развития нашей экономики и общества, улучшить чехию для всех."
 CZE_dev_program1: "Программа развития"
 CZE_dev_program1_desc: "Благодаря осторожным и сбалансированным инвестициям мы можем разработать план развития нашей экономики и общества, улучшить чехию для всех."
 CZE_memories_of_the_revolution: "Воспоминания о коллапсе"
 CZE_memories_of_the_revolution_desc: "Разрушение 1936 года разрушило наш народ и оставило нас, как только оболочку того, что мы были."
 CZE_memories_of_the_revolution1: "Воспоминания о коллапсе"
 CZE_memories_of_the_revolution1_desc: "Разрушение 1936 года разрушило наш народ и оставило нас, как только оболочку того, что мы были."
 CZE_soc_justice: "Социальная справедливость"
 CZE_soc_justice_desc: "Справедливое, справедливое общество — это общество, в котором каждый может найти свое место, где каждый может получить то, что заслуживает, или заслужить его, и где никто не останется."
 CZE_soc_justice1: "Социальная справедливость"
 CZE_soc_justice1_desc: "Справедливое, справедливое общество — это общество, в котором каждый может найти свое место, где каждый может получить то, что заслуживает, или заслужить его, и где никто не останется."
 CZE_expanded_police: "Расширенная государственная полиция"
 CZE_expanded_police_desc: "Влиятельная государственная полиция, действующая на службе нашего правительства, необходима для того, чтобы наша нация должным образом управлялась и предотвращала проблемы или диссиденты."
 CZE_corporatism: "Национальное корпоратизм"
 CZE_corporatism_desc: "Организуя различные производственные секторы в корпорации, с которыми мы можем работать и сотрудничать на благо нашей страны, мы действительно оптимизируем наше производство."
 CZE_suspended_democracyb: "Демократия, приостановленная"
 CZE_suspended_democracyb_desc: "С тех пор как мир вернулся на наши земли после гражданской войны, нестабильность в нашей стране не прекратилась, так как диссиденты и революционеры остались в нашем обществе как болезнь, и, таким образом, демократия в чешском государстве по-прежнему приостановлена, поскольку хунта ждала улучшения ситуации."
 CZE_suspended_democracyc: "Новая компромисса"
 CZE_suspended_democracyc_desc: "Прошло много времени с тех пор, как демократия в Чехии прекратилась, и, хотя она остается в наших надеждах на будущее, наша нация нашла стабильность и сотрудничество между всеми национальными движениями, так как хаос, который пытался разлучить нас, заставил нас сблизиться, и мы поверили в военное правительство."
 CZE_honor_service: "Почет на службе"
 CZE_honor_service_desc: "Нет больше чести, чем служить нашему народу, отдавать свою жизнь за него, защищать мир и будущее всего, что ты любишь."
 CZE_new_policies: "Новая экономическая политика"
 CZE_new_policies_desc: "С помощью консультантов по экономическим вопросам мы разработали новый план нашего производства, который позволит нам значительно расширить наши возможности и заводы, содействуя развитию сильной экономики для нашей страны."
 CZE_the_oo_in_force: "Охранни Оддиль"
 CZE_the_oo_in_force_desc: "Охранник Оддиль, или OO, стал главной силой безопасности и информации в нашей стране, и это, безусловно, поможет нашей стране справиться с любыми диссидентами."
 CZE_the_oo_in_power: "УО доминирует в нашем обществе"
 CZE_the_oo_in_force_desc: "Охранник Оддиль, или OO, стал главной силой безопасности и информации в нашей стране, и это, безусловно, поможет нашей стране справиться с любыми диссидентами."
 CZE_purged_the_oo: "Очищение Охранского Оддиля"
 CZE_purged_the_oo_desc: "Мы начали очистку от предателя, обеспечивая выживание нашего режима, однако это несколько ослабило нашу внутреннюю безопасность, расходы, которые мы должны заплатить за наши плохие решения."

