 CZE_defend_czechosloakia: "Защищайте чехословацкую нацию"
 CZE_defend_czechosloakia_desc: ""
 CEN_truly_czechoslovak_army: "Истинно чехословацкая армия"
 CEN_truly_czechoslovak_army_desc: ""
 CZE_the_sudeten_issue: "Вопрос о судимости"
 CZE_the_sudeten_issue_desc: "Чрезвычайно большое меньшинство в стране, где доминирует Чехия, не секрет, что напряженность между судетскими немцами и этническими чехами может перерасти, если мы не справимся с ними должным образом."
 CZE_introduce_autonomies: "Предложить автономию"
 CZE_introduce_autonomies_desc: "По мере того, как мы пытаемся справиться с растущими движениями &lt; &lt; Суденец &gt; &gt; в Судетенленде, кажется, что нам придется отказаться от некоторой централизации и предоставить возможность для независимости &lt; &lt; Судетен &gt; &gt; , и предложение этих изменений может помочь уменьшить напряженность, от которой мы страдаем."
 CZE_negotiate_with_the_leaders: "Оформление переговоров"
 CZE_negotiate_with_the_leaders_desc: "Разговаривая с лидерами забастовок и договариваясь о возможной выгодной сделке для всех, возможно, мы сможем стабилизировать ситуацию."
 CZE_work_with_german_politicians: "Работа с немецкими политиками"
 CZE_work_with_german_politicians_desc: "Нарастающая угроза радикальных групп, находящихся в подъеме по мере того, как ситуация в Судтенленде активизируется, работает и укрепляет наши связи с умеренными немецкими политиками Судетена, может быть наилучшим курсом действий."
 CZE_crush_valkist_groups: "Разрушить Volksfront"
 CZE_crush_valkist_groups_desc: "Радикальная националистическая организация &lt; &lt; Судетендейше Фольксфронт &gt; &gt; представляет собой угрозу для выживания мирного порядка не только в Судетенленде, но и во всей Чехии. Мы не можем больше ждать, при поддержке умеренных немецких групп &lt; &lt; Судетен &gt; &gt; , мы отправим наши силы и разрушим их."
 CZE_the_language_status: "Языковой вопрос"
 CZE_the_language_status_desc: "Вопрос языка имеет большое значение для любой нации. Чехия является штатом для чехословакии, поэтому очевидно, что чешский язык является официальным языком. Но в Судетенленде Чехия не является самым популярным языком, и Суденский немец хочет использовать свой родной язык во всех вопросах, поэтому мы должны разработать конкретную языковую политику."
 CZE_multinational_policies: "Разнородная нация"
 CZE_multinational_policies_desc: "Очевидно, мы не можем жить так, как если бы только чехи были найдены в Чехии. Эта ошибка стоила нам слишком много. Пришло время признать этническое и культурное разнообразие нашей страны и принять его, интегрировать всех, кто живет в наших границах."
 CZE_nationalist_policies: "Принудительная централизация"
 CZE_nationalist_policies_desc: "Чешское государство построено для чехов, и поэтому все их граждане должны знать, как вести себя, говорить на чешском языке и быть хорошими гражданами."
 CZE_prohibit_political_movements: "Приостановить политическую деятельность"
 CZE_prohibit_political_movements_desc: "Политическая деятельность, организованные встречи и любое подобное движение в Судетенленде являются питательной средой для предателей и опасных радикалов."
 CZE_send_our_men_in: "Ближайшая сутенерская земля"
 CZE_send_our_men_in_desc: "Наполняемые опасными экстремистами и националистами, мы должны послать наших людей для обеспечения безопасности в Судетенленде и для обеспечения того, чтобы хаос был сдержан, иначе наша нация сама могла бы упасть."
 CZE_czechification_measures: "Меры по чехизации"
 CZE_czechification_measures_desc: "Как научила нас история, разнообразие — это слабость, разделяющая нацию. Чехия не может быть разделена. Таким образом, проведение более активной политики церехизации, с тем чтобы ассимилировать Судетского Германа в хорошие чешские граждане, необходимо для того, чтобы придать силу нашей нации."
 CZE_appease_dissidents: "ОБЯЗАТЕЛЬСТВА ДЕМОКРАТИИ"
 CZE_appease_dissidents_desc: "В то время как чешская нация вступает в новый год, все еще есть много проблем, которые превращают нашу нацию в нестабильную и требуют присутствия военного правительства, однако, возможно, однажды мы сможем вернуться к демократии и обещать, что этот факт поможет успокоить многих диссидентов, появившихся в нашей стране."
 CZE_defensive_posture: "Защита"
 CZE_defensive_posture_desc: "Окруженные менее, чем дружественными соседями, мы стоим как бастион в Центральной Европе, и защита наших границ является самым высоким уровнем импорта."
 CZE_propaganda_campaigns: "Пропагандистские кампании"
 CZE_propaganda_campaigns_desc: "С все более непопулярным правительством, возможно, было бы хорошей идеей инвестировать немного в пропаганду, чтобы улучшить образ хунты на глазах людей."
 CZE_economic_readjustments: "Экономические корректировки"
 CZE_economic_readjustments_desc: "Гражданская война разрушила нашу страну, и мы все еще восстанавливаемся от ее последствий в нашем обществе."
 CZE_revolution_leftovers: "Возвращение из Коллапса"
 CZE_revolution_leftovers_desc: ""
 CZE_our_national_path: "Укрепление нашей нации"
 CZE_our_national_path_desc: "По мере того как мы решаем проблемы, затрагивающие нашу страну, мы можем наконец сосредоточиться на решении вопроса о будущем Чехии."
 CZE_diplomatic_efforts: "Дипломатические усилия"
 CZE_diplomatic_efforts_desc: "Мы не можем стоять в одиночестве, поскольку нас окружают потенциальные враги, нам нужна лаконичная внешняя политика."
 CZE_ties_with_the_french: "Связи с французами"
 CZE_ties_with_the_french_desc: "Наши друзья и сторонники, с тех пор, как до гражданской войны, раздиравшей нашу страну, французы работали с нами, и они поддерживали нашу сторону в самый ужасный час."
 CZE_join_the_entente: "Присоединяйтесь к Согласию"
 CZE_join_the_entente_desc: "Если мы хотим обеспечить выживание Чехии в грядущем хаосе, приближающемся в Европу, мы должны стоять с верными друзьями и создавать крепкие связи. Союзники во всем, кроме имени, пора официально оформить наши связи с французами и присоединиться к "Согласию"."
 CZE_ties_with_the_soviets: "Связи с Советским Союзом"
 CZE_ties_with_the_soviets_desc: "С десятилетий чешский народ ощущал связь с Россией как величайшей славянской нацией, восхищаясь нашими предшественниками. Теперь мы соблюдаем те же социалистические принципы, которые ведут Россию к революции и к рождению Советского Союза, тем самым создавая между нами необходимые связи, которые, возможно, необходимы для нашего выживания."
 CZE_join_the_internationale: "Присоединяйтесь к Международной организации"
 CZE_join_the_internationale_desc: "Как революционная нация в Центральной Европе, нас окружают потенциальные враги, которые могли бы воспользоваться нашей ослабленной дипломатической позицией, и реакционеры в большом количестве. Давайте попробуем присоединиться к российскому альянсу, для нашей защиты."
 CZE_elections_at_last: "Наконец-то выборы"
 CZE_elections_at_last_desc: "Демократия вернулась в Чехию, так как мы наконец-то можем вернуться к эпохе народного режима, который мы так долго пропустили."
 CZE_czech_revolution: "Чешская революция"
 CZE_czech_revolution_desc: "То, что когда-то началось, должно было быть закончено. Огни революции сгорают ярко, так как социализм и пролетариат сегодня триумф, революционный социализм захватывает нацию."
 CZE_nationalist_coup: "Националистское поглощение"
 CZE_nationalist_coup_desc: "Чехословакия не свободна. Дерево панславизма будет залито кровью социалистов. Йозеф Шнейдарек а.к.а. Йозеф Словарек не мой генерал. Он предатель и, возможно, и революционер. Чехия и Словакия, а не Скиф & Ренч. Восхваляйте чехословацкие легионы."
 CZE_junta_persists: "Джунта Персист"
 CZE_junta_persists_desc: "Стабильность нигде не видно. Будущее неопределённо. Только под руководством военного правительства выживет Чехия. Мы будем хранителями, стражами нашей нации, когда она постепенно поднимается к величию, но это может занять какое-то время."
 CZE_social_democracy_victory: "Социальная демократия Победа"
 CZE_social_democracy_victory_desc: "Чешские социал-демократы были избраны, и теперь, наконец, далеко идущее социальное правительство сможет решить проблему социального неравенства в нашей стране."
 CZE_a_cure_for_collectivism: "Справедливость Чехии"
 CZE_a_cure_for_collectivism_desc: ""
 CZE_greater_agrarian_reform: "Новая земельная реформа"
 CZE_greater_agrarian_reform_desc: "Наши предыдущие земельные реформы не зашли достаточно далеко, чтобы принести пользу бедным и были слишком добры к большому бизнесу, пришло время изменить это, и создать более эффективное общество."
 CZE_extensive_welfare_reform: "Расширенная программа социального обеспечения"
 CZE_extensive_welfare_reform_desc: "Для решения различных социальных проблем и более широких социально-экономических проблем мы должны преобразовать наше благосостояние в более прогрессивную программу."
 CZE_stimulate_czech_industry: "Стимулирование чешской промышленности"
 CZE_stimulate_czech_industry_desc: "Правительство должно играть важную роль в поддержке нашей промышленности и нашего экономического развития, инвестируя и помогая нам."
 CZE_solidarity_with_the_poor: "Солидарность с бедными"
 CZE_solidarity_with_the_poor_desc: "Наши социальные идеалы должны формировать каждую часть нашего общества, только тогда мы сможем превратить наши мечты в реальность для Чехии в целом."
 CZE_women_in_our_society: "Женщины в нашем обществе"
 CZE_women_in_our_society_desc: "Женщины являются жизненно важной частью любой страны, интегрируя их в нашу экономику и наше общество, обеспечивая им более широкое участие, мы сможем стать более целыми."
 CZE_an_inclusive_society: "Всеохватывающее общество"
 CZE_an_inclusive_society_desc: "Мы не можем закрывать наше общество только для тех, кому повезло больше, будь то там, где они родились или в каких условиях, мы должны включить кого-либо и интегрировать всех."
 CZE_agrarian_victory: "Аграрная победа"
 CZE_agrarian_victory_desc: "Чешская партия фермеров и крестьян, более известная как Аграрные, победила на выборах, имея широкую платформу, охватывающую от фермеров до среднего класса, они рассчитывают обеспечить правительство, способное для всей Чехии."
 CZE_supporting_the_farmers: "Поддержка фермеров"
 CZE_supporting_the_farmers_desc: "Основы нашей нации, аграрных классов, фермеров имеют огромное значение, и мы должны поддерживать их предпринимательство и успех."
 CZE_breadwinners_of_the_nation: "Хлебнёры нации"
 CZE_breadwinners_of_the_nation_desc: "Для претворения в жизнь нашей комплексной, всеобъемлющей аграрной модели мы должны признать в качестве ее основы крестьян, настоящих кормильцев нашей нации."
 CZE_redistribution_to_the_peasants: "Перераспределение в пользу крестьян"
 CZE_redistribution_to_the_peasants_desc: "Мы должны поддерживать наш народ, скромных крестьян, и распределять им больше земель, чтобы они могли выполнять свой труд."
 CZE_market_protectionism: "Протекционизм рынка"
 CZE_market_protectionism_desc: "Наше общество должно быть сосредоточено прежде всего на успехе чехов, и, хотя торговля имеет важное значение, защита нашего внутреннего сельского хозяйства и промышленности от внешних угроз и уделение особого внимания их усилению имеет важнейшее значение."
 CZE_stand_for_the_middle_class: "Стать для среднего класса"
 CZE_stand_for_the_middle_class_desc: "Постоянно растущий средний класс, как городской, так и сельской, является неотъемлемой частью нашего общества, и для достижения подлинного прогресса в качестве нации необходима помощь в его финансовом и социальном развитии."
 CZE_recreate_the_petka: "Воспроизвести Петку"
 CZE_recreate_the_petka_desc: "Петка, или Комитет пяти, был политическим форумом, предназначенным для решения политических проблем, с которыми мы сталкиваемся в Чехословакии, после того как он закончился, политические разногласия в нашем обществе разорвали нас на части, для того чтобы Чехия действительно была единой, мы должны воссоздать его, чтобы действительно укрепить нашу демократию."
 CZE_integral_society: "Общество &lt; &lt; Комплекс &gt; &gt;"
 CZE_integral_society_desc: "Многие группы в нашей стране, будь то этнические, социально-экономические или иные, эти различия не могут разлучить нас, вместо этого мы должны править обществом, которое заставляет каждого чувствовать себя на месте, стабильным."
 CZE_standing_for_democracy: "&lt; &lt; За демократию &gt; &gt;"
 CZE_standing_for_democracy_desc: "Теперь, когда мы вернулись к демократическому порядку, мы не можем рисковать потерять его снова."
 CZE_standing_for_progress: "Обеспечение прогресса"
 CZE_standing_for_progess_desc: "Будущее Чехии зависит от инноваций, от стремления к прогрессу и от усилий, направленных на то, чтобы быть в курсе последних событий, или от того, как они будут осуществляться."
 CZE_crush_extremists: "Покончим с экстремизмом"
 CZE_crush_extremists_desc: "Опасные силы угрожают разрушить чешскую демократию, как это было много лет назад, мы не можем допустить этого, мы должны заставить наше правительство блокировать распространение таких грубых идеологий."
 CZE_disloyalties_in_the_army: "Недостатки в армии"
 CZE_disloyalties_in_the_army_desc: "Некоторые высокопоставленные члены армии продемонстрировали определенные радикальные идеологические тенденции, которые могут быть опасными для развития нашей новорожденной демократии, давайте разберёмся с ними."
 CZE_truth_prevails: "Истина превзойдет"
 CZE_truth_prevails_desc: "Наша нация возродилась на идеалах истины, демократии, справедливости и светлого будущего для чехов в Европе."
 CZE_national_social_victory: "Национальная социальная победа"
 CZE_national_social_victory_desc: "Национальная либеральная политика Национальной социальной партии одержала победу, теперь начинается новая социалистическая эра для Чехии, но наш тип социализма."
 CZE_our_own_kind_of_socialism: "Социализма, национального рода"
 CZE_our_own_kind_of_socialism_desc: "Недемократические революции - это не настоящий социализм, они не заботятся о подлинных интересах людей, мы это делаем."
 CZE_a_nation_of_opportunities: "&quot; Народ возможностей &quot;"
 CZE_a_nation_of_opportunities_desc: "Мы не можем надеяться на то, что мы вырастем и превратимся в лучшее общество, если те, кто находится в невезучих условиях, не получат возможности построить для себя жизнь, получить образование, работу и преуспеть."
 CZE_collective_development: "Программа коллективного развития"
 CZE_collective_development_desc: "При осуществлении социальных реформ и экономических программ мы должны думать не о людях, а о нашей стране в целом."
 CZE_national_investments: "Национальные инвестиции"
 CZE_national_investments_desc: "Промышленный рост прост, нам просто нужно инвестировать в нашу собственную национальную экономику, тогда это будет стимулировать рост, и наша экономика будет работать лучше, это так просто!"
 CZE_freedom_and_democracy: "Свобода и демократия"
 CZE_freedom_and_democracy_desc: "Свободная нация - это народ, и именно подчеркнув этот идеал, мы построим в нашей стране устойчивый демократический порядок, который превзойдет наше правительство и продлится долгое время в истории."
 CZE_cooperate_with_opposition: "Сотрудничество с оппозицией"
 CZE_cooperate_with_opposition_desc: "Мы не можем надеяться, что будем править, как если бы только мы существовали, через умеренную программу и способность сотрудничать с другими демократическими партиями, что мы сможем укрепить национальное единство."
 CZE_strength_in_morality: "Сила в морали"
 CZE_strength_in_morality_desc: "Хорошая, социалистическая, нация — это та, которая действует в духе морали, которая хочет величайшего блага для всех, поэтому мы должны проникнуть в мораль во все уголки нашего правительства и общества, чтобы воплощаться в эту мечту."
 CZE_national_democracy_victory: "Победа в национальной демократии"
 CZE_national_democracy_victory_desc: "Сильная, консервативная политика в сочетании с здоровой дозой патриотизма дала национальным демократам ключ к победе на выборах."
 CZE_a_national_government: "Национальное правительство"
 CZE_a_national_government_desc: "Сильный, центральный орган власти, способный править страной, это то, что Чехии нужно для обеспечения долгосрочной стабильности и выживания нашей Республики."
 CZE_strengthen_the_administration: "Укрепить администрацию"
 CZE_strengthen_the_administration_desc: "Уделение большего внимания власти исполнительной власти, безусловно, обеспечит, чтобы наше правительство было достаточно сильным, чтобы принимать решения, которые ему нужны для будущего Чехии."
 CZE_promote_social_justice: "Поощрение социальной справедливости"
 CZE_promote_social_justice_desc: "Именно в поисках справедливого общества, где никто не страдает от того, чего не заслуживает, и где каждый может найти свое место, мы строим наше благосостояние и нашу экономическую политику. Мы думаем о обществе и обо всех."
 CZE_a_society_with_values: "Общество с ценностями"
 CZE_a_society_with_values_desc: "Именно благодаря сильным консервативным ценностям мы руководствуем нашим обществом, строим солидарность и укрепляем нашу нацию, а не посредством бессмысленной политики."
 CZE_expanded_state_police: "Расширенная государственная полиция"
 CZE_expanded_state_police_desc: "Крупная, хорошо финансируемая полицейская служба является важным инструментом для государства по обеспечению стабильности, а правительство не должно беспокоиться о возможных диссидентах, угрожающих миру."
 CZE_make_czechia_great_again: "Сделай чехию снова великой"
 CZE_make_czechia_great_again_desc: "Наше самое большое замечание было много лет назад, когда мы были на пике как Западославия, хотя воссоединение - это очень далекая мечта, мы можем работать над тем, чтобы достичь нового пика сейчас и сделать Чехию великой."
 CZE_conservative_solidarity: "Консервативная солидарность"
 CZE_conservative_solidarity_desc: "Именно на основе обмена и оказания помощи нуждающимся мы строим справедливое общество, и именно на основе солидарности мы улучшаем и укрепляем нашу нацию, это не социализм, а просто сохраняем верность нашим ценностям."
 CZE_push_against_reactionaries: "Противостояние реакциям"
 CZE_push_against_reactionaries_desc: "Реакторы прячутся в каждом углу и, когда поднимается наш революционный режим, они немедленно угрожают выбросить его. Давайте надавим на них и избавимся от реакции."
 CZE_secure_our_territory: "Защищать нашу территорию"
 CZE_secure_our_territory_desc: "По мере урегулирования революционного хаоса мы должны послать наших людей, чтобы захватить каждый угол наших национальных границ, обеспечив, чтобы мы полностью контролировали чехию."
 CZE_revolutionary_spirit: "Дух революции"
 CZE_revolutionary_spirit_desc: "Работники Чехии могут гордиться тем, что они сделали, революция наконец прибыла в Чехию, но она всегда была в наших сердцах, и ничто не может остановить этот огонь внутри нас."
 CZE_collective_councils: "Коллективные советы"
 CZE_collective_councils_desc: "Благодаря созданию советов трудящихся, где люди могут организовывать и обсуждать вопросы и идеи, мы создаем подлинно представительную структуру для нашего общества."
 CZE_peoples_militias: "Народные ополчения"
 CZE_peoples_militias_desc: "Многие мужественные люди боролись за революцию. Теперь, когда чешский народ действительно разбудился от кошмара буржуозного капиталиста."democracy", many are those willing to fight for our noble cause and liberate others."
 CZE_age_of_collectivism: "Эпоха социализма"
 CZE_age_of_collectivism_desc: "Эпоха капитализма, кронизма, растерянности рабочих, все кончено. Теперь началась новая эра, эра коллективизма, где люди действительно свободны и общество действительно справедливо, и равенство приведет нас к материальному раю."
 CZE_the_working_women: "Работающие женщины"
 CZE_the_working_women_desc: "Наши товарищи — это не только мужчины, женщины — неотъемлемая часть нашего общества, как рабочие, они равны с мужчинами, и мы должны помочь им оставить цепи, которые капитализм вложил в них, и занять их место в качестве равноправных работников."
 CZE_beyond_nationalism: "Помимо национализма"
 CZE_beyond_nationalism_desc: "Федерация коммун Чехии - это не национальное государство, даже если правительство, которое мы свергли, было одним из самых разнообразных стран Европы, и оно отражает то, как рабочие объединили страны."
 CZE_political_commisaries: "Политические коммуны"
 CZE_political_commisaries_desc: "Политические коммиссары - это умелые лидеры и надзиратели, которые следят за различными секторами нашего общества и обеспечивают, чтобы народ Чехии не терял из виду истину нашей идеологии, обучая их, и как таковые мы обеспечиваем политическую стабильность нашего правительства."
 CZE_democratic_centralism: "Демократический централизм"
 CZE_democratic_centralism_desc: "Мы не можем допустить, чтобы фракционность разорвала нас на части, демократия в дискуссиях и единство в действии необходимы для того, чтобы революция добилась успеха в достижении наших целей."
 CZE_socialist_research: "Социалистические исследования"
 CZE_socialist_research_desc: "Социализм стремится к оптимальному материальному развитию и равенству. Именно с помощью науки и техники мы добьемся этого, и таким образом, как хотел бы Маркс, мы должны сфокусировать наши усилия на исследованиях."
 CZE_collectivize_agriculture: "Объединение сельского хозяйства"
 CZE_collectivize_agriculture_desc: "Развитие аграрных секторов нашей экономики и осуществление реформ, которые принесут пользу всем, посредством коллективизации, это то, в чем нуждается наша страна."
 CZE_state_economy: "Государственная плановая экономика"
 CZE_state_economy_desc: "Экономика не работает сама по себе, нам нужно поддерживать себя и быть способными обеспечить каждому равные материальные условия."
 CZE_organize_intelligence: "Организация разведывательных подразделений"
 CZE_organize_intelligence_desc: "Мы должны быть хитроумными при рассмотрении разумных внутренних и внешних тем, и именно через управление информацией и разведданными мы достигнем этой цели, чтобы обеспечить успех революции."
 CZE_revolutionary_industry: "Революционная промышленность"
 CZE_revolutionary_industry_desc: "Как промышленное государство, революция должна заполнить каждую часть нашего общества, и мы можем стать подлинным социалистическим обществом, поэтому необходимо подчеркнуть необходимость укрепления этой области."
 CZE_czechia_then_the_world: "Чехия, тогда мир"
 CZE_czechia_then_the_world_desc: "Мировая революция еще не наступила, но Чехия стала великим бастионом революции, и отсюда мы можем ожидать ее дальнейшего расширения."
 CZE_completing_the_revolution: "Завершение революции"
 CZE_completing_the_revolution_desc: ""
 CZE_found_the_uscsr: "Нашёл UCSSR."
 CZE_found_the_uscsr_desc: "Мы завершили Чехословацкую Революцию спустя столько времени. Пришло время должным образом создать новый союз наших территорий, не провалившийся, как буржуазная Западославия, а скорее родившийся в результате взаимного сотрудничества и социализма."
 CZE_peace_with_our_brothers: "Мир с нашими братьями"
 CZE_peace_with_our_brothers_desc: "Наши братья словаки, многие из них мечтали о революции и социализме, как и мы. Теперь, когда мы воссоединились, многие все еще не чувствуют себя вполне комфортно, особенно с провалом Западославии. Мы должны вновь зажечь связи между нами и сделать их комфортными в этом новом, другом Союзе."
 CZE_socialism_for_the_minorities: "Социализм в интересах меньшинств"
 CZE_socialism_for_the_minorities_desc: "Мы должны показать им, как мы строим социализм не для чехов или словаков, а для рабочих, для всех нас."
 CZE_erase_the_opposition: "Уничтожить оппозицию"
 CZE_erase_the_opposition_desc: "Между многими либеральными партиями, которые стремятся вновь привести Чехию в деградацию, слабыми собаками бывшего режима, и коллективистами, которые хотят еще раз нас разлучить, у нас есть большая оппозиция. Будущее нашей нации не может быть обеспечено до тех пор, пока они не будут ликвидированы."
 CZE_claim_our_legacy: "Претензии на наше наследие"
 CZE_claim_our_legacy_desc: "Потерянные земли к востоку от того, что в настоящее время является Словакией, это то, что предатели забрали у нас, но это наша законная земля, наше наследие и наше право рождения, так как чехословацкая нация желает воссоединиться."
 CZE_expand_the_legions: "Расширить легионы"
 CZE_expand_the_legions_desc: "Легионы - это военизированные группы, которые поддерживают наш националистический режим и помогают нам захватить контроль над нашей нацией."
 CZE_eliminate_the_old_structure: "Уничтожить старую структуру"
 CZE_eliminate_the_old_structure_desc: "Чешское государство было кучей старых, устаревших институтов, которые не приносили пользы нашей стране, работая больше как оживленный труп провала, чем как средство возвращения величия, и таким образом мы собираемся разрушить эти институты и создать новые, по мере того, как Чехия будет построена на пути к величию."
 CZE_strengthen_the_national_regime: "Укрепление националистического режима"
 CZE_strengthen_the_national_regime_desc: "Мы не должны проявлять сочувствия к тем, кто не хочет работать с нами. Только чистая сила приведет Чехию к правильному пути национального возрождения. Давайте укрепим нашу администрацию и перестроим Чехию силой стали."
 CZE_total_national_state: "Итого, национальное государство"
 CZE_total_national_state_desc: "И поскольку мы все стремимся служить нации, служение государству в его полном объеме является правильным порядком здесь."
 CZE_loyalty_to_the_vudce: "Лояльность к V ..."
 CZE_loyalty_to_the_vudce_desc: "Мы клянёмся, что неуклонная верность реставратору нашей нации, Радоле Гайде, как мы знаем, приведет нас к величию и возрождению, но только если мы поклянемся в истинной верности ему."
 CZE_fervent_panslavism: "Фервент Панславизм"
 CZE_fervent_panslavism_desc: "Панславская идеология нашего националистического режима привела наш народ к великим выводам. В то время как Западославия провалилась, Чехословакия должна быть создана для того, чтобы нести факел панславизма. Славские народы должны быть едины, при необходимости, силой, и наша нация не достигнет величия до тех пор, пока это не будет достигнуто."
 CZE_nationalizing_measures: "Меры по национализации"
 CZE_nationalizing_measures_desc: "Государство не будет вести переговоры с теми, кто не хочет работать ради величайшей выгоды для нашей нации, мы просто введем их в прямое правление нашей нации."
 CZE_czech_corporatism: "Чешский корпоратизм"
 CZE_czech_corporatism_desc: "Организуя различные производственные секторы в корпорации, с которыми мы можем работать и сотрудничать на благо нашей страны, мы можем реально оптимизировать производственный потенциал нашей страны, помогая улучшить нашу экономику."
 CZE_new_national_research_program: "Слава делу"
 CZE_new_national_research_program_desc: "Разрабатывая и финансируя новую национальную исследовательскую программу, мы можем использовать технологические преимущества, чтобы установить себя на вершине промышленной и военной мощи, принося славу нашей стране."
 CZE_assimilation_policies: "Политика ассимиляции"
 CZE_assimilation_policies_desc: "Учитывая, что меньшинства встречаются во всех частях нашей истории, мы не можем не понять, что, возможно, если мы их ассимилируем, они перестанут быть проблемой для нас."
 CZE_czech_way_to_revanchism: "Чешский путь к реванхизму"
 CZE_czech_way_to_revanchism_desc: "Наша национальная слава была украдена у нас социалистическими предателями, соловьи предателями. Они были полны зависти к нашему успеху, и таким образом мы были разрушены ими. Реванш - единственный способ залечить эти бесконечные раны, отомстить им и всему миру."
 CZE_i_am_for_the_czech_man: "Я для чешского человека"
 CZE_i_am_for_the_czech_man_desc: "В то время как сама наша нация упала и достигла самой низкой точки, возвращение ее к славе не только делает Чехию могущественной на мировой арене, но и помогает чешскому народу и чешскому человеку добиться успеха в нашем обществе и вести хорошую жизнь."
 CZE_our_national_rebirth: "К возрождению"
 CZE_our_national_rebirth_desc: "Размышляя об успехах нашего проекта, о воссоздании нашей нации во всех ее частях, о совершенствовании нашего государства и о наступлении новой эры для нашей нации, мы можем сказать, как мы движемся к возрождению и славе."
 CZE_war_of_unification: "Война за национальное единство"
 CZE_war_of_unification_desc: "Западославская нация была разорвана предателями, и теперь должна родиться новая чехословацкая нация. Наши словацкие братья вернутся под нашу власть, независимо от того, хотят они этого или нет. Именно через войну мы очистим нашу нацию от последних восстановителей ее слабости и очистим ее до совершенства."
 CZE_czechoslovakia_reborn: "Чехи и словаки, воссоединились!"
 CZE_czechoslovakia_reborn_desc: "Чехословацкий народ наконец-то воссоединился и завершился, так как наша нация, когда-то разрушенная нашими врагами, возрождается."
 CZE_welcome_back_the_slovaks: ""Welcome Back" the Slovaks"
 CZE_welcome_back_the_slovaks_desc: "Настало время, наконец, поприветствовать наших чехословацких братьев из Словакии, известных также как словаки, хотя эти годы под их самозванским режимом они могли услышать какую-то ложь об отдельных нациях, и так далее, мы должны сделать шаг вперед и научить их тому, что на самом деле происходит, и что они здесь, навсегда."
 CZE_czechoslovakization: "Чехословакизация и колонизация"
 CZE_czechoslovakization_desc: "Меньшинства по-прежнему доминируют в некоторых районах нашей территории, и хуже всего то, что они даже не славянки! Мы должны проводить политику чехословакизации, с тем чтобы они стали хорошими славянскими гражданами нашей страны для их же блага. И если это не сработает, то направление поселенцев, чтобы уменьшить их преобладание в таких районах, по-прежнему является действительной стратегией."
 CZE_no_room_for_chaos: "Нет комнаты для Хаоса"
 CZE_no_room_for_chaos_desc: "Хаос, беспорядок, неверие, они слишком долго разрывали на части нашу нацию, мы не позволим им, даже если мы сделаем это своей единственной задачей."
 CZE_establish_the_front_for_czechia: "Создать фронт чехии"
 CZE_establish_the_front_for_czechia_desc: "Для того чтобы объединиться и спасти Чехию, мы должны избавиться от разногласий и объединиться в любви к родине. Давайте создадим Фронт Чехии при поддержке различных партий, как способ укрепления нашего режима и создания основы поддержки."
 CZE_honor_in_service: "Почет на службе"
 CZE_honor_in_service_desc: "Нет больше чести, чем служить нашему народу, отдавать свою жизнь за него, защищать мир и будущее всего, что ты любишь."
 CZE_rein_in_the_nationalists: "Воспитан в националистах"
 CZE_rein_in_the_nationalists_desc: "Экстремальные националисты сформировали свои собственные военизированные группы и сформировали свою клику в наших вооруженных силах. С радикальными и противоречивыми идеями они представляют собой явную угрозу для нашего общества. Мы должны избавиться от них."
 CZE_the_new_compromise: "Новая Компромисия"
 CZE_the_new_compromise_desc: "Пустые обещания больше не могут продолжаться. Мы должны работать с политическими партиями и быть в стороне от того, чего они должны ожидать, потому что Чехия нуждается в военном правительстве, и это правда."
 CZE_a_man_for_its_fatherland: "Человек для своей родины"
 CZE_a_man_for_its_fatherland_desc: "Истинный гражданин навечно служит государству. Чешское государство - это государство Чехии. Мы не служим только бюрократам и безымянным. Мы служим своей родине, и это послание мы должны донести до людей, молодых людей и всех."
 CZE_cooperation_with_the_old_establishment: "Сотрудничество со старым учреждением"
 CZE_cooperation_with_the_old_establishment_desc: "Если мы будем сотрудничать со старым учреждением и сможем заручиться его поддержкой нашего правительства, мы не сделаем тех же ошибок, что и они."
 CZE_what_czechia_needs: "Чехия нуждается"
 CZE_what_czechia_needs_desc: "Возможно, потребуется время, чтобы признать это, но слабые демократии уже убили бы нашу страну, учитывая хаос, который так долго пытался уничтожить нас."
 CZE_remake_the_administration: "Перестроить администрацию"
 CZE_remake_the_administration_desc: "Раздутая бюрократия, перенесенная со времен Чехословакии, не работает так, как раньше, мы должны добиваться административной реформы, к счастью, мы можем сделать это, если хотим без проблем."
 CZE_economical_adjustments: "Новая экономическая политика"
 CZE_economical_adjustments_desc: "Пора пересмотреть нашу экономическую программу и привести ее в соответствие с новыми потребностями Чехии, возможно, это было бы полезно."
 CZE_strength_in_arms: "Сила оружия"
 CZE_strength_in_arms_desc: "Именно в развитии вооружений и их производстве мы можем найти силу и защитить Чехию, на самом деле, это может быть единственным способом."
 CZE_industrial_reforms: "Производственные реформы"
 CZE_industrial_reforms_desc: "Благодаря интеграции новых методов и использованию ресурсов в них мы можем быстро модернизировать нашу промышленность."
 CZE_in_defense_of_our_nation: "В защиту нашей нации"
 CZE_in_defense_of_our_nation_desc: "По мере того, как война распространяется по Европе, мы не позволим ни одному конфликту уничтожить Чехию."
 CZE_research_investments: "Инвестиции в научные исследования"
 CZE_research_investments_desc: "Это вопрос высшей национальной важности, инвестировать в развитие технологий и исследований, чтобы нас не оставили позади."
 CZE_the_new_czechoslovakia: "Создание Чехословакии"
 CZE_the_new_czechoslovakia_desc: "Западославия была обречена на крах, по мере централизации и неуважения к профсоюзу, и ослабления связей между чехословаками и словаками. Сегодня мы воссоздали Чехословакию, нацию, которая учится на прошлом и не будет совершать те же ошибки."
 CZE_a_different_union: "Разный союз"
 CZE_a_different_union_desc: "Мы больше не союз, в центре которого находится Чехословакия, мы строим Чехословакию как союз равных, будь то чехословацкая нация и все ее члены, независимо от того, из какого региона они родом, чувствуем себя представленными и как дома, если мы оставим мелкое соперничество и уважаем наших братьев, лучший союз."
 CZE_representation_for_all: "Представительство для всех"
 CZE_representation_for_all_desc: "Чехословакия - это не только этнические чехословаки, мы всеохватный союз, мы должны предоставить автономию и внутреннее представительство группам, которых меньше всего слушали, венгерским и русинским меньшинствам во внешних уголках нашей нации."
 CZE_economic_matters: "Обзор экономики"
 CZE_economic_matters_desc: "Даже сегодня переход от Западославии к строительству экономики только для Чехии имел последствия для социально-экономического развития нашей страны."
 CZE_further_expansion: "Дальнейшее расширение"
 CZE_further_expansion_desc: "Давайте построим еще больше нашей промышленной базы, что позволит нашей экономике достичь своих величайших потенциальных масштабов."
 CZE_rural_incentives: "Сельские стимулы"
 CZE_rural_incentives_desc: "Мы не можем забыть о сельских и сельскохозяйственных социальных группах вдали от наших промышленных городских центров, мы должны дать им стимулы и помочь их экономическому развитию улучшить производство Чехии."
 CZE_civilian_expansion: "Гражданский рост"
 CZE_civilian_expansion_desc: "Гражданская промышленность, способная строить и производить полезные товары, должна инвестироваться и расширяться, с тем чтобы мы могли выращивать все области нашего производства."
 CZE_sudeten_investments: "&lt; &lt; Сувенированные инвестиции &gt; &gt;"
 CZE_sudeten_investments_desc: "Распределяя наши инвестиции в Судетелендский регион, мы показываем, что мы заинтересованы в социально-экономическом развитии этого жизненно важного района нашей страны."
 CZE_bohemian_industrial_zone: "Промышленная зона Чехии"
 CZE_bohemian_industrial_zone_desc: "Чехия всегда была сердцевиной нашей экономики и промышленности, и, возможно, даже нашей нации."
 CZE_moravian_industry: "Моравская промышленность"
 CZE_moravian_industry_desc: "Моравия всегда считалась второй, когда речь шла о региональном акценте в нашей стране, будь то культурный или экономичный."
 CZE_interczech_infrastructural_plan: "Межчешский инфраструктурный план"
 CZE_interczech_infrastructural_plan_desc: "Мы можем и далее содействовать установлению связей между нашими странами, инвестируя средства в строительство автомагистралей, связывающих регионы нашей страны, объединяя их и помогая нашему движению через них."
 CZE_preparatory_mobilization: "Подготовительная мобилизация"
 CZE_preparatory_mobilization_desc: "По мере усиления напряженности в Европе мы считаем, что подготовка нашей экономики к возможной потребности в большей мобилизации могла бы быть разумной идеей."
 CZE_czech_arms_industry: "Чешская оружейная промышленность"
 CZE_czech_arms_industry_desc: "Если мы направим нашу промышленную мощь на развитие вооружений, их производство и, следовательно, укрепление наших вооруженных сил, мы сможем лучше защитить себя."
 CZE_technical_innovation: "Технические новшества"
 CZE_technical_innovation_desc: "Промышленное производство может быть оптимизировано путем применения надлежащих методов и обновления."
 CZE_construction_investments: "Строительные инвестиции"
 CZE_construction_investments_desc: "Инвестируя в новые строительные технологии и машины, мы можем увеличить темпы нашего промышленного роста и экономического роста."
 CZE_science_emphasis: "Научное внимание"
 CZE_science_emphasis_desc: "Для того чтобы должным образом адаптировать наши технологии к постоянно обновляемому миру, нам необходимо уделять пристальное внимание научным исследованиям на государственном уровне, что позволит нам каждый раз быть на вершине."
 CZE_resource_prospecting: "Поиск ресурсов"
 CZE_resource_prospecting_desc: "Экскавация и переработка различных природных ресурсов - это технология, которая является весьма полезной при наличии таких материалов, и, тем не менее, хорошая технологическая база."
 CZE_electronic_updates: "Электронные обновления"
 CZE_electronic_updates_desc: "В новейших технологиях используются новейшие электронные исследования, которые приближают нас к будущему."
 CZE_support_skoda: "Поддержка &lt; &lt; Шкода &gt; &gt;"
 CZE_support_skoda_desc: "Шкода Уоркс является одной из крупнейших чешских производственных сил и специализируется на моторной промышленности."
 CZE_the_czech_army: "Чешская армия"
 CZE_the_czech_army_desc: "После краха основные силы, наши технологии и оборудование были унаследованы армией, которая теперь реформирована как чешская армия."
 CZE_updating_our_arms: "Обновление наших вооружений"
 CZE_updating_our_arms_desc: "Настало время работать с ними над дальнейшим совершенствованием нашего пехотного оружия и достижением следующего уровня."
 CZE_the_new_artillery: "Новая артиллерия"
 CZE_the_new_artillery_desc: "Растущая сила на поле боя, мы должны постоянно совершенствовать наши артиллерийские планы, чтобы убедиться, что нас не превзойдут в ходе конфликта."
 CZE_engineering_corps: "Инженерный корпус"
 CZE_engineering_corps_desc: "Инженеры, входящие в состав наших сухопутных сил, помогли бы нашим подразделениям адаптироваться к различным обстоятельствам и условиям по мере изменения места боевых действий."
 CZE_motorized_technologies: "Моторизованные технологии"
 CZE_motorized_technologies_desc: "Развитие и рост автомобильной промышленности в нашей стране обеспечили нам пиковые дизайны, когда дело доходит до этой области, и выделение дополнительных средств на то, чтобы остаться наверху, имеет важное значение."
 CZE_our_armored_designs: "Наши бронежилеты"
 CZE_our_armored_designs_desc: "Мощные танки сделаны и спроектированы в Чехии, давайте покажем миру нашу истинную силу, когда мы развиваем более могущественных зверей."
 CZE_mechanization_of_vehicles: "Механизированная пехота"
 CZE_mechanization_of_vehicles_desc: "Сочетание пехотных войск с мощными специализированными бронированными боевыми машинами позволяет нам увеличить нашу мощь в бою."
 CZE_medical_support: "Медицинская поддержка"
 CZE_medical_support_desc: "Полевые больницы, медицинские достижения, доведенные до фронта, могут помочь нам сократить наши потери и увеличить продолжительность нашей рабочей силы, это может быть мудрым вложением средств."
 CZE_training_the_elite: "Подготовка элитов"
 CZE_training_the_elite_desc: "Специализированные войска, не только опытные в пехотных боях, но и в различных условиях, являются надлежащими силами, которые нам нужны для того, чтобы помочь нашей армии приблизиться к элите."
 CZE_the_latest_tactics: "Последние тактики"
 CZE_the_latest_tactics_desc: "Новаторство и актуализация стратегического развития, безусловно, могут быть тем, в чем нуждается вся наша сухопутная сила, и мы должны сделать это."
 CZE_the_latest_weapons: "Последнее оружие"
 CZE_the_latest_weapons_desc: "Технологическое превосходство - это строго мощный элемент на поле боя, а пехотное оружие - один из самых известных примеров этого."
 CZE_defending_czechia: "Защита Чехии"
 CZE_defending_czechia_desc: "Пора, парни, приготовьте завтрак и поедим по-сердечному."
 CZE_the_sudeten_line: "Линия &lt; &lt; Судене &gt; &gt;"
 CZE_the_sudeten_line_desc: "Поскольку в Германии есть могущественные потенциальные враги, мы должны защитить нашу территориальную целостность, и линия хорошо подготовленных укреплений в западной Судетеленде может просто сделать эту работу."
 CZE_northern_forts: "Протяните его на север."
 CZE_northern_forts_desc: "Давайте протянем наши крепости дальше на север, чтобы защитить наш фланг от возможных атак."
 CZE_southern_forts_desc: "Австрийская граница также может быть опасной, давайте построим наши крепости дальше на юг, чтобы обезопасить ее."
 CZE_southern_forts: "Фортс на Юг"
 CZE_the_czech_airs: "Чешский воздух"
 CZE_the_czech_airs_desc: "От наших широких границ, окруженных зелёными врагами, до Чехиинской глубины, воздух стоит над нами, готов для нашей пользы."
 CZE_expand_the_bases: "Расширить базы"
 CZE_expand_the_bases_desc: "Аэробазы для размещения нашего все более мощного авиационного флота и для того, чтобы быть там, откуда мы опираемся на нашу силу, могут быть хорошей идеей для расширения районов."
 CZE_improve_the_production: "Совершенствование производства"
 CZE_improve_the_production_desc: "Мы обнаружили, что нам нужно быстро увеличить наши военно-воздушные силы, и поэтому разработка усовершенствованного плана производства для этого могла бы быть оптимальной."
 CZE_working_with_the_land: "Работать с нашими сухопутными силами"
 CZE_working_with_the_land_desc: "Воздух - это еще одно поле боя, но это не требует какой-либо импортности из истинного центра наших военных усилий, земли, чтобы удерживать и контролировать."
 CZE_superiority_in_the_winds: "Комплексная стратегия"
 CZE_superiority_in_the_winds_desc: "Мы не можем поместить наши бомбы в одну корзину, мы должны разработать хорошо очерченный план, способный сделать все возможное из каждой ситуации и подготовить нас к постоянно меняющемуся поле боя."
 CZE_destructive_operations: "Разрушительные операции"
 CZE_destructive_operations_desc: "Лучшая стратегия в области воздушного транспорта — использовать наших бомбардировщиков для того, чтобы уничтожить любые угрозы и цели, имеющие большое значение, эффективно обеспечивая нашу победу."
 CZE_fighter_planes: "Самолеты истребителей"
 CZE_fighter_planes_desc: "Пришло время поработать над дизайном самолётов, к счастью, наша сильная местная авиаиндустрия дала нам отличный выбор."
 CZE_seashore_strikes: "Морские удары"
 CZE_seashore_strikes_desc: "В то время как для многих сила, во время войны контроль над судоходными путями может превратиться в слабость, которую у нас нет, но которую мы с готовностью будем эксплуатировать в наших врагах."
 CZE_defending_our_skies: "Защищать наши небеса"
 CZE_defending_our_skies_desc: "Мы не одни пытаемся контролировать небо и воздух, мы должны защищать наше национальное воздушное пространство и нападать на любого, кто бросает нам вызов."
 CZE_bomber_designs: "Дизайны бомбардировщиков"
 CZE_bomber_designs_desc: "Удовлетворение современных планов воздушных бомбардировщиков действительно является необходимой исследовательской работой для нашей страны."
 CZE_skyward_warriors: "Скайборнские воины"
 CZE_skyward_warriors_desc: "Теперь наши солдаты могут храбрым образом отдать свою жизнь, чтобы сделать мощные стратегические шаги, как десантники."
 CZE_czechia_rule_the_skies: "Чехия правит небом"
 CZE_czechia_rule_the_skies_desc: "Мы полностью освоили воздух и сделали наши воздушные силы действительно сильными и готовыми ко всему."
 CZE_planning_strategy: "Всё в планировании"
 CZE_planning_strategy_desc: "Использование накопленных знаний об обычных войнах является наиболее безопасной ставкой, и использование этого для планирования впереди наших врагов даст нам нужные нам преимущества."
 CZE_mobile_warfare: "Мобильная военная авиация"
 CZE_mobile_warfare_desc: "Мы не можем выиграть, если отстаем, мы должны сосредоточиться на мобильности, поэтому мы будем теми, кто решит, какие сражения будут воевать."
 CZE_bullet_rain: "Пулевой дождь"
 CZE_bullet_rain_desc: "Благодаря силе наших вооружений мы будем доминировать на поле боя, а не бессмысленно тратить жизни наших людей."
 CZE_everyone_on_board: "Все в совете"
 CZE_everyone_on_board_desc: "Мы сражаемся вместе, используя силу наших храбрых людей и отдавая их всем, мы действительно можем создать большую угрозу нашим врагам."


