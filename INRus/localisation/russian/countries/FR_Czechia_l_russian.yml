 CZE_FUHRERREICH_DESC: "Теперь даже демократия была потеряна, как чешская мечта о восстановлении стабильности и внутреннего мира для своего народа. Некоторые, однако, имеют еще больше мечтаний. Независимо от того, являются ли они национальным воссоединением, безотзывным, революцией или освобождением, многие радикальные группы все еще находятся внутри Чехии, и только мудрые решения военного правительства могут обеспечить стабильное будущее для Чехии, так как хаос никогда не заканчивается."


