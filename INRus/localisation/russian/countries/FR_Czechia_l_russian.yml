 #decisions
 CZE_legacy_of_czechoslovakia: "Наследие Западославии"
 CZE_legacy_of_czechoslovakia_desc: "Мы никогда не забудем мечту, которая была Западославией и которая станет Чехословакией."
 CZE_revive_our_claims: "Возвращайся к нашим утверждениям"
 CZE_revive_our_claims_desc: "Нам больше не нужно сдерживать свои претензии, поскольку мы находимся в прямом конфликте с нашими словацкими братьями, в результате этой войны может появиться шанс, что нашей стране нужно будет вновь восстановиться."
 CZE_reform_czechoslovakia: "Форма Чехословакии"
 CZE_reform_czechoslovakia_desc: "Мы добились успеха, словацкие земли пришли в наше владение. Теперь нам не нужно сдерживаться, как ясно, что Чехословакия родится. Воссоединение чехословацкого народа - это то, что всегда будет помниться, так как славяне в мире становятся сильнее вместе, и наша нация, наконец, воссоединилась, как и предполагалось, но на этот раз мы не сделаем тех же ошибок прошлого."
 CZE_inspect_the_sudetenland: "Проверьте Судененцию"
 CZE_inspect_the_sudetenland_desc: "В качестве очага для предателей мы должны послать УО для осмотра Судетенленда и для борьбы с любыми диссидентскими действиями."
 CZE_the_oo: "Охранский оддил в действии"
 CZE_the_oo_desc: "Недавно созданный Охранни Оддиль поможет нам полностью контролировать народ и очистить его от предательской грязи, которая угрожает нам."
 CZE_investigating_prague: "Расследование в Праге"
 CZE_investigating_prague_desc: "Колыбель для диссидентской деятельности, наша национальная столица должна быть жестоко очищена, и все предатели, скрывающиеся на ее улицах, по крайней мере, должны попасть в тюрьму."
 CZE_scrutinizing_moravia: "Распятие на Моравии"
 CZE_scrutinizing_moravia_desc: "Редко в центре внимания нашей нации, пришло время послать наши силы для изучения Моравии и поиска предателей, прячущихся в менее посещаемом регионе."
 CZE_new_diplomatic_front: "Выверка"
 CZE_new_diplomatic_front_desc: "Мы слишком долго держались подальше от наших братьев."
 CZE_propose_restoring_diplomacy: "Восстановить дипломатические связи"
 CZE_propose_restoring_diplomacy_desc: "После распада, любые официальные дипломатические связи со Словацкой Республикой были прерваны, поскольку наши правительства хладнокровно смотрели друг на друга."
 CZE_call_for_congress: "Созыв чешско-словацкого конгресса"
 CZE_call_for_congress_desc: "Теперь, когда мы восстановили дипломатические отношения, есть так много вопросов и столько возможностей. Давайте призовем к совместному чешско-словацкому конгрессу, где наши правительства смогут говорить о будущем наших государств и возможных предложениях о сотрудничестве. Вместе мы можем быть сильнее."
 #events

 cze.1.t: "Статус Чехии"
 cze.1.d: "Живой труп западославской мечты Чехия является выжившим в Европе, но, в конце концов, Западославия мертва по какой-то причине. Чешская нация сочла его централизацию смертельной, поскольку застопорившееся правительство не могло справиться с отделением Словакии и Силезии. Несмотря на то, что правительство рухнуло, храбрые силы высшего командования армии, возглавляемые генералом Жозефом Шнейдареком, переворотили государство, создав военное правительство для защиты того, что осталось от Западославии, и прекращения дальнейшего хаоса. Теперь мы вступаем во вторую половину 1936 года с ясной целью. Чтобы привести Чехию в новый век, оставить прошлое и решить проблемы, которые удерживают нашу страну. Возможно, чехи восстанут снова и найдут новую мечту. Но страна все еще очень разделена и затронута, и военное правительство не может длиться вечно после провала Западославского военного правительства, с многими мечтами о возвращении к демократии. Будущее неопределено, но мы попытаемся сделать все возможное, что угодно, что является определенным и правдой."
 cze.1.a: "Правда витеси."
 cze.40.t: "Карел Чапек - Война с кротами"
 cze.40.d: "Выдающийся писатель научной фантастики Карел Чапек опубликовал свою последнюю работу под названием"War with the Molemen".\n\nThe novel recounts the tale about an alternate world where human society changes when they discover an underground species of intelligent Molemen, whom are promptly put to the service of mankind and forced to work in the mining industry for the enrichment of humanity. As the years pass, the Molemen begin to organize themselves as they learn more and more about human society and quickly advance their own civilization, as humanity keeps looking down on them. The Molemen, tired of the mistreatment and filled with resentment, rebel against humanity, and launch a global war for supremacy, as they want to bring down the surface world and everything it has achieved.\n\nMany critics have praised the novel, considering a masterpiece of our times. The political allusions found inside haven't gone unseen either, as many consider the book clearly inspired by the Sudeten German tensions that have affected our country, and compared the revanchist Molemen with Germany's own ambitions in Europe. Even more apparent given that Germany has almost immediately banned the book inside their borders."
 cze.40.a: "Ещё одна отличная вещь, Карел!"

 cze.49.t: "Дипломаты анти-немецких Comics Angers"
 cze.49.d: "С ростом валькизма в Германии амбиции явно реваншистского и недедентистского немецкого правительства не ушли незаметно. В то время как некоторые беспокоятся, что он может в конечном итоге подтолкнуть свои амбиции в Судетленде, другие считают эту возможность смешной и начали высмеивать Дресслера. ~ Не один из самых известных примеров этого, который разозлил немецких дипломатов, которые просили нас порицать распространение этого изображения, это политический комикс, изображающий Адама Дреслера, который плачет, как потерянный мальчик, когда он спрашивает местонахождение его дома, ссылаясь на Судетенленд. ~ Не говоря уже об одном из самых известных примеров этого, который разозлил немецких дипломатов, возможно, было бы разумно заботиться о дипломатии."
 cze.49.a: "Мы не можем порицать этот шедевр."
 cze.49.b: "Убери этот оскорбительный отрывок из газет и запрети любые другие."
 cze.50.t: "Забастовки в Судетенленде"
 cze.50.d: "Несмотря на то, что мы внесли свой вклад в стабилизацию нашей нации и в работу по созданию новой эры для нашей нации, не все чувствовали себя интегрированными в процесс восстановления после гражданской войны. Несмотря на то, что &quot; Судетнские немцы &quot; , которые соответствуют примерно одной трети нашего населения после того, как словак покинул нас, стали все более несчастными жить под чешским правлением, но они слишком большие меньшинства, чтобы их игнорировать. Сегодня начались забастовки в некоторых частях Судетенленда, поскольку &quot; Судетен германские рабочие &quot; недовольны тем, что у них есть. Это распространилось на политические группы, поскольку различные &quot; Судетен немецкие политики и движения &quot; оказали им поддержку, и вопрос об автономии &quot; Судетена &quot; стал проблемой для нашего правительства."
 cze.50.a: "Посмотрим."
 cze.51.t: "Концессии для немцев?"
 cze.51.d: "По мере продолжения забастовок мы осознали, что предоставление концессий рабочим &lt; &lt; Судета &gt; &gt; и сотрудничество с их лидерами могут стать решением, которое успокоит их, особенно перед лицом растущего немецкого автономистского движения &lt; &lt; Судета &gt; &gt; . С другой стороны, отказ от их требований может привести к еще большему ослаблению нашей восстанавливающейся нации, чего нам явно не нужно."
 cze.51.a: "Дайте им уступки."
 cze.51.b: "Они должны просто работать."
 cze.52.t: "Подъём судебных валькистов"
 cze.52.d: "Не секрет, что лидер валькистского режима в Германии принадлежит к немецкому происхождению Судетен. Таким образом, не удивительно, что валькистские идеи станут самыми радикальными и экстремальными из германских. Ведущим является известный поклонник Адама Дрезслера Конрад Хенлейн (некоторые даже говорят, что Хенлейн пытался подражать Дресслеру), Судетдеутше Фольксфронт установил самое радикальное националистическое движение во всей Судетеленде. Даже некоторые германцы беспокоятся об этом новом развитии, так как группа головорезов Хенлейна, похоже, угрожает как короткому, так и долгосрочному миру в регионе."
 cze.52.a: "Боже, нет."
 cze.53.t: "Германский демократический фронт"
 cze.53.d: "По мере того, как экстремистские группы поднимаются и вызывают хаос в Судетенленде, не все счастливы в этом. Таким образом, появился Судетенский и Чешский демократический фронт, который открыто выступает за автономию, представляет различные немецкие политические партии, которые пришли, чтобы отвергнуть новый нарастающий экстремизм в регионе, безусловно, ту группу, которую мы хотим в нашей стороне."
 cze.53.a: "Будем надеяться, что мы что-нибудь придумаем."
 cze.54.t: "Вандализм в Поляризованной Судетенленде"
 cze.54.d: "Становится все более поляризованным и разделенным, но все более хаотичным однородным образом, Судетенленд затонул в некоторые из своих мрачнейших периодов, угрожая стабильности чешского государства. Разные националистические группы вышли на улицы для вандализма и хаоса, распространяя свои призывы к ненависти и античехским настроениям. Тем временем, вновь возродившиеся рабочие вышли на улицы, и даже демократический фронт распространил свою проавтономию по всему региону. Мы должны что-то сделать."
 cze.54.a: "Пошлите вооруженные силы, чтобы умиротворить улицы."
 cze.54.b: "Давай лучше присядем."
 cze.55.t: "Языковой вопрос"
 cze.55.d: "Хорошо известно, что с тех пор, как в Сападославии, чешское господство в обществе и правительстве было сильным. Теперь, в т.н. чешском государстве, оно остается таковым. Однако, поскольку Судетнский немец хочет чувствовать себя представленным и получить автономию, возникает вопрос языка. Вместо того, чтобы быть вынужденными учить чешский язык в школах, они хотят, чтобы их учили немецкому языку и могли использовать его в официальных правительственных делах. Хотя это, безусловно, может сделать счастливыми многих германцев, некоторые беспокоятся, что это может ослабить единство нашей нации."
 cze.55.a: "Немцы будут официально в Судетенленде."
 cze.55.b: "Чешский язык является языком чешского государства."
 cze.56.t: "Мир в Лютенленде"
 cze.56.d: "В то время как Судетенленд в течение нескольких месяцев погряз в хаосе, он наконец-то возвращается к миру, так как наше правительство сумело справиться с различными &lt; &lt; судетенскими &gt; &gt; политическими деятелями и, предоставляя автономию, очистить движение &lt; &lt; Судетен &gt; &gt; , радикальные движения сузились почти до нуля, и народ &lt; &lt; Судета &gt; &gt; наконец-то может чувствовать себя неотъемлемой частью нашей нации."
 cze.56.a: "Сегодня мы все чехи."
 cze.57.t: "Радикальное предложение"
 cze.57.d: "Чувствуя себя непредставленными в чешском государстве, и в свете растущих проблем и хаоса, которые распространились через Судетенленд, единые движения Судета пришли к нам с предложением. Поскольку Судетенленд в Чехии, похоже, работает не так хорошо, они просят о проведении референдума. Хотя не все хотят покинуть Чехию и присоединиться к радикальному режиму, который является Германией, многие из германских германцев. Таким образом, разрешив провести референдум, мы могли бы, вероятно, получить легитимность &lt; &lt; Судета &gt; &gt; , предполагая, что мы заслужили их поддержку и проголосовали бы за то, чтобы остаться в Чехии. &lt; &lt; Судетенские немцы &gt; &gt; , конечно же, являются шансом на то, что они решат покинуть страну, разделив нашу нацию еще дальше. &lt; &lt; интригующий выбор &gt; &gt; ."
 cze.57.a: "Мы разрешим референдум."
 cze.57.b: "Чехия - одна и неделимая, Судетенленд остается, несмотря ни на что."
 cze.58.t: "Судетенленд голосует за то, чтобы остаться"
 cze.58.d: "Похоже, что наша добрая воля была вознаграждена, так как Суденец немец проголосовал на референдуме за то, чтобы остаться регионом Чехии, конечно же, получил автономию. &lt; &lt; Суденский Чешский демократический фронт &gt; &gt; заявил о своей поддержке этого результата, хотя постоянно спящие радикальные группы осудили его, поскольку, как представляется, Судетенленд решил, что они чувствуют себя как дома в Чехии, в конце концов."
 cze.58.a: "Как и предполагалось."
 cze.59.t: "Судетенленд в Хаосе"
 cze.59.d: "Несмотря на то, что Демократический фронт глубоко сожалеет о нашем решении, мы, похоже, еще больше пожалеем об этом, как это было радикализовано нашим решением, различные немецкие движения &lt; &lt; Судетен &gt; &gt; вышли на улицы, поскольку Судетенленд находится в абсолютном хаосе и радикальные группы захватывают его."
 cze.59.a: "Это нехорошо."
 cze.60.t: "Валькисты в одностороннем порядке"
 cze.60.d: "Возглавляя обвинение против нашего правительства, судетдейше Фольксфронт Хенлейна и их бандитские бандитские бандиты заявили о своем намерении отделиться от Чехии и присоединиться к Германии."
 cze.60.a: "Никто этого не допустит."
 cze.61.t: "Кризис Суденов"
 cze.61.d: "Чехия впала в беспорядок, так как Судетенленд впал в хаос, в вопросе о немецком народе Судетен, который широко радикалирован в валькистских движениях, заявил о своем намерении отделить Чехию от Германии и присоединиться к ней. Уже много лет Чехия является нашим другом, и мы поддерживаем их, как это было в ходе гражданской войны. Теперь Германия впала в радикальный национализм, и этот кризис, кажется, готов укрепить Германию, ослабив нашу позицию в отношении континентальной Европы, стоя с Чехией и поддерживая их и их территориальную целостность, сдерживая возможную германскую агрессию, кажется самым разумным выбором, хотя Германии это не понравится ни капли."
 cze.61.a: "Мы поддерживаем чехов."
 cze.61.b: "Мы не можем поддержать их в этот раз."
 cze.62.t: "Французская поддержка чехов в кризисной ситуации в Судетеленде"
 cze.62.d: "Влажные чехи уже много лет эксплуатируют и изменяют права немецкого народа в Судетенленде. Славные из-за их краха не так давно, Судьба немцы находятся в более мощном положении, чем когда-либо, и чешское правительство, не желая идти на компромисс, как ожидалось от чешского отброса, неправильно справляется с ситуацией. Теперь валькисты в Судетеленде, под прикрытием Судетдеутше Фольксфронта, во главе с Конрадом Хенлейном, известным нашим фюрером, решили в одностороннем порядке отделиться от Чехии и воссоединиться с родиной. Хотя в будущем, скорее всего, Судетенленд является местом рождения Фюрера, так что союз был бы чем-то, чего он очень хотел."
 cze.62.a: "Союз неизбежен, но ему придется подождать."
 cze.62.b: "Судтенленд - немец, и его не оставят. §R(Это приведет к войне с Францией)§!"
 cze.63.t: "Кризис в Лютенленде"
 cze.63.d: ""The Vile Czechs have been exploiting and bending the rights of the German people in Sudetenland for years now. Weakened by their collapse not long ago, the Sudeten Germans are in a stronger position than ever, and the Czech government, unwilling to compromise, as expected of Czech scum, has mishandled the situation. Now the valkists in Sudetenland, under the Sudetendeutsche Volksfront, lead by Konrad Henlein, known admired of our Führer, have decided unilaterally their intentions to secede from Czechia and reunite with the homeland. Sudetenland is the Führer's birthplace, as well, so union would be something that he very much desires.\n\nIn a lucky twist, a favour of fate, maybe, the coward French, obviously afraid of conflict with us, have abandonded their puppet, instead of defending their territorial integrity, as expected. Now Czechia will have to answer to us."
 cze.63.a: "Судетенленд должен быть нашим."
 cze.64.t: "Германия стучится."
 cze.64.d: "В то время как наши силы пытаются умиротворить регион, погрязший в хаосе, заявление Судетендейше Фольксфронта не осталось без внимания. Поскольку Франция отказалась комментировать и поддерживать нашу целостность, Германия пришла к нам, как стервятник, требуя, чтобы в представлении суверенного права немецкого народа Судетен, Судетленд был официально передан немецкому правлению немедленно, иначе Германии придется заставить нас соблюдать более жесткие средства. ~ Хотя мы не можем легко уклоняться от угроз или отказаться от своей земли, нам кажется, что мы здесь одни."
 cze.64.a: "...Судтенленд - немец."
 cze.64.b: "Приходите и возьмите. §R (Это приведет к войне с Германией)§!"
 cze.65.t: "Франция поддерживает нас"
 cze.65.d: "Учитывая продолжающийся кризис и то, как он угрожает территориальной целостности нашей страны, Франция решила остаться с нами, полностью поддерживая нашу целостность."
 cze.65.a: "Будем надеяться."
 cze.66.t: "Франция бросит нас"
 cze.66.d: "Похоже, что Великая война полностью оставила французов в страхе перед малейшей угрозой, как, например, в шокирующей демонстрации трусости, французы, которые должны были быть нашими союзниками и стоять вместе с нами, в состоянии решительно поддерживать нашу национальную целостность и стоять вместе с нами, якобы опасаясь гнева Германии. Это мрачные времена для чехов."
 cze.66.a: "Проклятье."

 cze.67.t: "Миротворчество Судетенленда"
 cze.67.d: "По мере того, как наши войска маршируют и распространяются через Судетенленд, мир, наконец, возвращается в регион. Военизированные группы были арестованы, и с диссидентами ведется борьба. Теперь мы можем только надеяться, что мы сможем продолжить и оставить этот кризис, поскольку стабильность может быть вновь найдена, сейчас, без радикальных силовых группировок."
 cze.67.a: "Стабильность?"
 cze.68.t: "Языковой вопрос"
 cze.68.d: "Как чешское государство, вопрос о чешском языке, который является основным, всегда был известен. К сожалению, судатен немцы не любили изучать этот язык, когда речь идет о языке, на котором работает эта страна. Хотя изучение этого языка имеет важное значение для интеграции, некоторые считают, что мы могли бы немного угнетать нашу языковую политику. Это, конечно, абсурдно, но нам все еще нужно твердое заявление о нашей языковой политике."
 cze.68.a: "Немецкий язык разрешен каждый день, но чехия официально принадлежит правительству."
 cze.68.b: "Держите немецкий в домах, только чехия может быть использована где угодно."
 cze.69.t: "Германия приходит за Суденеландией"
 cze.69.d: "В то время как радикальное немецкое движение &lt; &lt; Судетен &gt; &gt; разъезжает в одностороннем порядке и угрожает нашей территориальной целостности, Германия услышала их и пришла за ними. Однако мы не стоим в одиночестве. Перед лицом германской агрессии французы и Континентальный Континент поддерживают нас. Похоже, что судьба Европы будет решена на поле боя, если мы откажемся от их требований. Но мы не потеряем веру, даже в эти смелые времена."
 cze.69.a: "Верни Зустанеме!"
 cze.70.t: "Экстремисты еще больше радикализируют"
 cze.70.d: "Радикальные немецкие группы &lt; &lt; Судетен &gt; &gt; значительно расширились в ответ на наш решительный подход к созданию безопасного Судатенленда. &lt; &lt; Суденен &gt; &gt; , при растущей поддержке населения, поднялись их военизированные группы и начали сражаться с нашими людьми вокруг Судетенленда, в то время как &lt; &lt; Судетен немец &gt; &gt; выступает против нас в открытой агрессии."
 cze.70.a: "Сражения никуда не приведут."
 cze.71.t: "Судетенленд в Хаосе"
 cze.71.d: "По мере того, как немецкие террористы Судетена продолжают жить, а насилие усиливается, все Судетенленда сейчас погрязли в хаосе, когда мы теряем контроль над ним, наши люди все еще борются за него. Хаос не видел этого со времен гражданской войны. Как и ожидалось, главным из этих мятежных группировок является Судетендейч Volksfront."
 cze.71.a: "Чехи не откажутся от своего времени!"

 cze.80.t: "Ходатайства Чехии о присоединении к &lt; &lt; Согласию &gt; &gt;"
 cze.80.d: "Наш близкий друг на протяжении многих лет, Чехия, возможно, не является тем государством, которым она была раньше, но она все еще поддерживает с нами известные прочные связи и сотрудничает с Францией на протяжении всех этих лет. Несмотря на уведомление о все более радикальной геополитической ситуации в Европе, они утверждают, что сотрудничество в целях обороны может быть наилучшим вариантом, и поскольку мы уже помогали им в течение всего этого времени, было бы логичным официально оформить наши связи в официальный союз и интегрировать их в Энтенте, поэтому они и обратились с просьбой присоединиться к нам."
 cze.80.a: "Давайте официально оформим наш союз."
 cze.80.b: "Это не в наших интересах."
 cze.81.t: "Франция принимает нас."
 cze.81.d: "Мы получили официальное сообщение от французских дипломатов, Франция решила дать нам возможность присоединиться к Континентальному Континенту, и теперь мы можем оставаться в безопасности, когда мы сосредоточимся на защите Европы от тревожных людей, в рамках Континент."
 cze.81.a: "Отличные новости!"
 cze.82.t: "Франция отвергает нас"
 cze.82.d: "Появляются ужасные новости, так как кажется, что французы, по какой бы эгоистичной причине, может быть, даже боятся, решили, что позволить нам вступить в союз теперь то, чего они хотят. Будущее Чехии неопределенно, так как мы сегодня остаемся одни."
 cze.82.a: "Не надо было доверять лягушкам."
 cze.83.t: "Чехия хочет присоединиться к Международной организации"
 cze.83.d: "Молодой Чешский коммуна является недавним революционным правительством в Центральной Европе. Они решили, что для обеспечения своего выживания им нужна наша помощь, и они могли бы работать в качестве платформы для революции в Европе. Конечно, они не очень большие, поэтому было бы разумно подумать, хотим ли мы их как часть нашего союза."
 cze.83.a: "Впусти их."
 cze.83.b: "Они нам не нужны."
 cze.84.t: "Россия принимает нас."
 cze.84.d: "Мы получили официальное сообщение от советских дипломатов, российское правительство решило, что они позволят нам присоединиться к Интернационалу, и теперь мы можем оставаться в безопасности, когда революция будет сильной и единой по мере того, как она будет распространяться по Европе."
 cze.84.a: "Отличные новости!"
 cze.85.t: "Россия отвергает нас"
 cze.85.d: "Появляются ужасные новости, так как, как кажется, Совет, по какой бы эгоистичной причине, может быть, даже страх, решил, что позволить нам вступить в их союз теперь то, чего они хотят. Будущее Чехии неопределенно, так как мы сегодня остаемся одни."
 cze.85.a: "Они не заботятся ни о интернационализме, ни о революции."
 cze.90.t: "Укрепление нашей нации"
 cze.90.d: "По мере того как мы оставляем различные вопросы, которые не стабилизировали нашу страну, Чехия может, наконец, работать над тем, чтобы созидать и улучшить себя, найти свое место в мире и продвинуться вперед, поскольку мы знаем, что в будущем в Европу может впасть конфликт, поскольку международная напряженность с течением времени быстро усиливается, и мир выбрасывается."
 cze.90.a: "Мы постараемся изо всех сил."
 cze.91.t: "Красная полоса?"
 cze.91.d: "Конфиденциальный отчет был представлен войсками, дислоцированными на севере нашей страны, в котором говорится, что были обнаружены доказательства подпольной социалистической деятельности в районе известного социалистического оплота Млада Болеслава. Хотя пока ничего открыто не принято, это опасный прецедент. К счастью для нас, никто не знает об этой информации, и для общественности, все мирно. Будем надеяться, что этот доклад окажется всего лишь слухами, и нам не придется беспокоиться о них."
 cze.91.a: "Мы будем держать глаза открытыми."
 cze.92.t: "Где Демократия?"
 cze.92.d: "В последнее время мы наблюдаем новую эру стабильности и тишины в Чехии, но, как представляется, этот внутренний мир, как это ни парадоксально, вызвал новые волнения. Группы за демократию, созданные при поддержке всех политических партий, начали кампанию за возвращение демократии в Чехию. И они не видят больше никакой необходимости в военном правительстве, так как мы ощущаем себя с внутренним миром. ~ ~ Но не все так, как кажется, и Чехия может легко впасть в отчаяние, учитывая неправильную ситуацию. Нам нужно тщательно подумать, даже если они правы, что они много ждали возвращения демократии."
 cze.92.a: "Демократия вернется, мы призываем к выборам через несколько месяцев."
 cze.92.b: "Сейчас неподходящее время."
 cze.93.t: "Националистический фронт появляется"
 cze.93.d: "С тех пор как Западославия упала, было много людей, утверждающих, что ее падение было ошибкой, и Чехия должна попытаться воссоединиться со Словакией. В основном, панслависты, сила, которая была сильной при рождении Сападославии, оказались совершенно потерянными после смерти Западославской мечты. ~Нет, это изменилось сейчас, когда Чехословацкий националистический фронт, группировка радикализованных правых панславистов, во главе с генералом Радолой Гайдой, с довольно открытыми амбициями возрождения Западославской мечты в более ограниченной форме и установления радикальной националистической политики в нашей стране. Открытые критики провалов военного правительства, которые не смогли сохранить Словакию, и что, как они утверждают, сохранили рост Чехии, они объявили, что будут участвовать в предстоящих выборах."
 cze.93.a: "Падение Западославии было ошибкой."
 cze.93.b: "Будем надеяться, что они не доставят слишком много неприятностей."
 cze.94.t: "Стороны готовят свои кампании"
 cze.94.d: "По мере приближения предстоящих выборов различные политические партии, которые ожидали своего времени, начали свои кампании, с тем чтобы заручиться поддержкой населения и, возможно, выиграть выборы, которые будут как президентскими, так и парламентскими."
 cze.94.a: "Конечно, интересный список."
 cze.95.t: "Красная полоса показывает себя"
 cze.95.d: "Как мы обнаружили несколько месяцев назад, подземная социалистическая деятельность была на самом деле сигналом чего-то большего."
 cze.95.a: "Пора их убирать."
 cze.96.t: "Националисты сталкиваются с социалистами"
 cze.96.d: "Поскольку нам не удалось с помощью помощи положить конец всей социалистической деятельности, представляется, что Фронту националистов удалось. Военническое крыло Фронта, явно вдохновленное чехословацкими легионами, начало борьбу против коллективистов на улицах разных городов, хотя эти инциденты остались незначительными, это, безусловно, ставит их в позитивное положение для многих людей, которые не слишком заинтересованы в коллективистах, особенно до выборов."
 cze.96.a: "По крайней мере, это помощь."
 cze.97.t: "Выборы [поступления]"
 cze.97.d: "Настало время, демократия находится за углом, поскольку в нашей стране прошли выборы, и, наконец, будет решен вопрос о судьбе Чехии, поскольку чешский народ может голосовать за своих лидеров."
 cze.97.a: "Социальные демократы победили."
 cze.97.b: "Аграрные победили."
 cze.97.c: "Национальная социальная партия побеждает."
 cze.97.e: "Национальные демократы победили."
 cze.97.f: "Националистический фронт побеждает."
 cze.98.t: "Социальная демократическая победа"
 cze.98.d: "Таким образом, Чешская социал-демократическая партия, возглавляемая Антонином Хамплом, выиграла выборы и возглавит новое демократическое правительство, поскольку для Чехии начинается новая эра."
 cze.98.a: "Да оставим прошлое навсегда."
 cze.99.t: "Аграрная победа"
 cze.99.d: "Благодаря умеренным социальным предложениям и программе, которая позволила охватить людей по всей Чехии, Чешская партия фермеров и крестьян смогла заявить о победе на выборах, а ее лидер Рудольф Беран в настоящее время является нашим новым президентом."
 cze.99.a: "Я очень люблю демократию."
 cze.100.t: "Национальная социальная победа"
 cze.100.d: "Возвращение к либеральной политике и здоровому национальному сознание, это то, что обещала Чешская национальная социальная партия, и, очевидно, этого было достаточно для победы, поскольку наш новый президент - ее лидер Эдвард Бенеш, который обещал новую эру для Чехии."
 cze.100.a: "Это был отличный выбор."
 cze.101.t: "Национальная демократическая победа"
 cze.101.d: "Будучи явно консервативной и традиционной партией, национальные демократы, возможно, получили бы свой главный источник поддержки в своей очевидной связи с панславизмом, о чем другие партии, как правило, избегают комментировать, тем не менее, они, несомненно, обеспечат мощный старт для нашего нового демократического века."
 cze.101.a: "Великолепно!"
 cze.102.t: "Чехословацкий националистический фронт выигрывает"
 cze.102.d: "Паника распространяется через демократические группы, так как панславистский и ультранационалистический чехословацкий фронт достиг победы на выборах, с популярной базой среди тех, кто считает, что наша нация была обижена и провалена монастырями, и которые стремятся к новой эпохе для Чехии, и, возможно, даже после этого. ~n/n/nЭто, безусловно, тревожный результат, и хотя мы можем только надеяться, что тот факт, что они выиграли демократические выборы, что-то значит, кажется, что демократия может умереть, как только она вернется."
 cze.102.a: "Боже!"
 cze.103.t: "Красная полоса раскрыла"
 cze.103.d: "По мере широкого распространения через Чехию протестов против джунты, по всей видимости, информация, которую мы получили не так давно, была верной, так как теперь коллективисты, похоже, раскрыли себя, присоединяясь к движению против джунты, и быстро развиваясь от разочарованных членов демократического фронта."
 cze.103.a: "Поставьте наших людей, мы остановим одну революцию, мы сможем сделать то же самое снова."
 cze.104.t: "Демонстрации спешат"
 cze.104.d: "По мере того, как мы приложили усилия для того, чтобы остановить усиленные демонстрации, представляется, что, хотя демократический фронт ослаб в своих попытках, незаконный Коллективный фронт не сделал того же, а использовал свои подземные связи для того, чтобы избежать многих из наших людей."
 cze.104.a: "Это должно прекратиться, застрелить рабочих."
 cze.104.b: "Защищайте нашу позицию."
 cze.105.t: "Общий удар"
 cze.105.d: "По мере того, как мы начали применять насилие против многих рабочих и политических диссидентов, социалистов или нет, кажется, что мы только закопались в более глубокую дыру. Несмотря на то, что на улицах Праги, Брно и городов по всей Чехии царит насилие и хаос, наши люди растянуты, и, похоже, некоторые из наших подразделений не отвечают нашим приказам."
 cze.105.a: "Революция захватывает страну."
 cze.105.b: "Националистический фронт отталкивает революционеров, когда Генера Гайда переворотит правительство."
 cze.106.t: "Чешская община Возрождена"
 cze.106.d: "Красные флаги ползают по улицам по всей Чехии, так как Коллективистский фронт захватил правительство."democracy", nor any other! A new dictatorship of the proletariat will be established! Klement Gottwald, leading member of the Revolutionary Committee and the Collectivist Party, will be our First Chairman."
 cze.106.a: "Работники Чехии, радуйтесь!"
 cze.107.t: "Националистический фронт"
 cze.107.d: "Чаос найден на улицах, боевые действия продолжаются, но это не напрасно. Чехия возродится! Предыдущее правительство было слабым, застопоренным, испуганным. Оно ведёт Чехию в упадок и вечные ссоры. Нет! Правительство народа должно быть объединено под сильным руководством, где ничто не может быть поставлено под сомнение, и где верность нации не может быть поставлена под сомнение."
 cze.107.a: "Наш народ возродится."
 cze.108.t: "Борьба с Хаосом"
 cze.108.d: "Когда наши люди ссорятся с радикализованным населением в различных частях нашей страны, нам удалось заполучить кое-какую почву, поскольку повстанческие силы замедляют их продвижение, кажется, мы сможем полностью оттолкнуть их назад. ~nnnWelp, я полагаю, хунта остается на некоторое время, поскольку Чехия еще не готова к невоенному правительству."
 cze.108.a: "К Оружию."
 cze.109.t: "Вернуться в нашу нацию"
 cze.109.d: "После того, как нас бросили на произвол судьбы, германские стервятники ограбили нас из Судетенленда. Теперь это ясно для нашей нации. Военное правительство, которое так долго оставалось у власти, утверждая, что у Чехии есть наилучшие интересы, подвело нас. Они поклялись защищать чехию, выживание нашей нации, после краха нашей старой мечты, но они не смогли даже сделать это. Поскольку ярость наполняет сердца многих чехов, забастовки начались по всей Чехии, так как мы достигли нашего самого ужасного часа."
 cze.109.a: "О нет."
 cze.110.t: "Революция"
 cze.110.d: "Враги хунты, многочисленные подпольные группы коллективистов вновь появились, и они вступили в союз с членами демократических политических партий, которые расстроены хунтой, начали массовое восстание. Насилие распространяется по мере того, как этот Революционный фронт начал новую эру конфликта для Чехии."
 cze.110.a: "Это нехорошо."
 cze.111.t: "Националистический фронт присоединяется к борьбе"
 cze.111.d: "Сформированные ультранационалистами, многие из которых являются панславистами, которые в течение долгого времени требовали милитаристской, реваншистской позиции после потери Словакии и необходимости вернуть нашу нацию к славе, недавняя потеря Судетленда доказала им еще больше их правоту, поскольку они заняли твердую позицию против военного правительства, считая ее слабой и неудачной и обвиняя ее в том, что она потопила нашу нацию."
 cze.111.a: "Генерал Гайда переворотит правительство с Националистическим фронтом."
 cze.111.b: "Революционный фронт захватывает нацию."
 cze.113.t: "Чешская община Возрождена"
 cze.113.d: "Красные флаги поливают улицы по всей Чехии, так как Коллективистский фронт захватил правительство. Воспоминания первой революции должны быть найдены, но на этот раз хорошая сторона победила."democracy", nor any other! A new dictatorship of the proletariat will be established! Klement Gottwald, leading member of the Revolutionary Committee and the Collectivist Party, will be our First Chairman."
 cze.113.a: "Работники Чехии, радуйтесь!"
 cze.112.t: "Националистический фронт"
 cze.112.d: "Чаос найден на улицах, боевые действия продолжаются, но это не напрасно. Чехия возродится! Предыдущее правительство было слабым, застопоренным, испуганным. Оно ведёт Чехию в упадок и вечные ссоры. Нет! Правительство народа должно быть объединено под сильным руководством, где ничто не может быть поставлено под сомнение, и где верность нации не может быть поставлена под сомнение."
 cze.112.a: "Наш народ возродится."

 cze.129.t: "Судьба военных"
 cze.129.d: "В то время как народ Чехии захватил страну революцией, не все в традиционных вооруженных силах были довольны этим. На самом деле, большинство генералов действительно ненавидят это. Те, у кого сильные связи с диктатурой или с опасными националистическими устремлениями, должны быть ликвидированы. Некоторые, однако, не проявляют реальных связей с какой-либо политической принадлежностью и, возможно, могут быть полезны для восстановления наших вооруженных сил, хотя некоторые утверждают, что должны остаться только те, кто присягнул на верность нашему новому, народному правительству."

 cze.129.a: "Те, у кого нет истории, могут присоединиться к нам."
 cze.129.b: "Мы должны очистить армию."
 cze.130.t: "Функционализм в Партии"
 cze.130.d: "По мере того, как коллективизм растет и процветает в Чехии, некоторые наши товарищи начали думать по-другому. Возможно, правительство не выполняет правильные планы. Возможно, правительство пытается напрягаться, а что, если люди сами решат? И подобные рассуждения фракционистов, которые ставят под сомнение партию. ~n/nn/n Это явно опасный прецедент, вызванный подавленными реакционными тенденциями в том, что в противном случае было бы верными товарищами, и не о чем беспокоиться."
 cze.130.a: "Если только они не вызывают проблем."
 cze.131.t: "Исчезновения Рудольфа Слански"
 cze.131.d: "Один из ведущих членов центрального комитета партии и один из наших лучших людей, Рудольф Слански не явился вчера. В то время как он непосредственно заботился о своей семье, сегодня это волнует всех, как один из самых важных лидеров нашей страны, казалось бы, пропал без вести с лица земли. ~n-theories о его местонахождении в большом количестве, от большего до земли, включая возможные несчастные случаи по пути домой, до более сенсационистского, как если реакционные шпионы похищают или убивают наших храбрых лидеров."
 cze.131.a: "И это будет сделано."
 cze.132.t: "Просьба следователя"
 cze.132.d: "По мере продолжения расследования, большая часть товарищей Слански изо дня в день, а также его прохождение между работой и домом отслеживаются и используются в качестве основы для расследования. В то время как эта сторона действует в соответствии с нормой, следователь обратился к партии с просьбой. Позволить расследованию расширить его сферу охвата в офисе партии, так как это, возможно, позволило бы получить информацию о его непосредственном поведении до того, как он поедет домой. Несмотря на интригующую мысль, возможно, это не лучшая идея позволить любому офицеру, не являющемуся участником партии, провести там расследование."
 cze.132.a: "Продолжай расследование по его обычному маршруту."
 cze.132.b: "Позволь им расследовать офисы партии."
 cze.133.t: "Исследовать его путь домой"
 cze.133.d: "В поисках жизни вдали от ядр Праги дом Слански находился на окраине города, когда он обычно ехал домой."
 cze.133.a: "Давай допросим людей."
 cze.133.b: "Внедорожным направлением могло бы стать более эффективное использование ресурсов."
 cze.134.t: "Допросы"
 cze.134.d: "Спрашивая людей в населенных пунктах вокруг дороги Слански, мы обнаружили, что сама ночь была спокойной, и не было никаких признаков чего-то необычного."
 cze.134.a: "Что ж, чушь собачья."
 cze.135.t: "Направление движения вне дороги"
 cze.135.d: "Поскольку мы сосредоточили наши усилия на расследовании любых внедорожных инцидентов, от которых мог пострадать Слански, в течение большей части недели мы обнаружили мало доказательств того, что что-либо происходит в зоне внедорожников. Есть еще место, которое нужно скрыть, но вряд ли мы что-либо найдем. Между тем давление общественности на это расследование усилилось, по мере того как радикальные теории растёт в общественном сознании, некоторые даже обвиняют его в возможном заговоре самой партии. Мы должны решить это как можно скорее."
 cze.135.a: "Продолжайте искать внедорожник."
 cze.135.b: "Вините в этом некомпетентность полиции."
 cze.136.t: "Расследовать его дом"
 cze.136.d: "По мере того, как число возможных мест преступления сокращается, и мы не можем себе представить, наши следователи решили поближе посетить дом Слански и его семью. Несмотря на это, мы не нашли ничего большего, чем скорбящая семья. Тем временем, давление лобковых сил продолжает расти, так как радикальные теории об исчезновении становятся все более популярными с каждым днем, некоторые из самых крайних, даже возлагая вину на нелепую партию и правительство. Мы должны быстро раскрыть это расследование."
 cze.136.a: "Вините в этом некомпетентность полиции."
 cze.137.t: "Возможное решение?"
 cze.137.d: "По мере того, как мы заканчиваем поиски большей части внедорожной зоны, наши следователи столкнулись с кое-чем чрезвычайно интересным: довольно недавно разбитая машина с телом мертвого мужчины внутри. Хотя мы подтвердили, что этот человек не Слански, члены комитета предложили радикальное предложение. Давайте скажем, что авария, которую мы нашли, это Слански, изменит улики и убедится, что никто не знает, кто это на самом деле, и воспользуемся этим полезным расследованием, чтобы вернуть немного популярности, которую мы потеряли в инциденте."
 cze.137.a: "Это расследование раскрыто."
 cze.137.b: "Мы никогда не забудем Слански."
 cze.138.t: "В памяти Рудольфа Слански"
 cze.138.d: "Один из наших лучших, кто действительно заботился о рабочих, о людях и о социализме, мы никогда не забудем о наследии Слански. Памятник его имиджа был поднят за пределами офиса партии в Праге, поскольку мы чтим кончину мужественного политического лидера, мы можем только надеяться, что сможем найти утешение в его памяти и двигаться дальше."
 cze.138.a: "Он незабываемый."
 cze.139.t: "Провал полиции"
 cze.139.d: "Мы не знаем, что привело к исчезновению товарища Слански. Мы не знаем, был ли это несчастный случай или кто-то спланировал его. Но мы знаем одно, что с неэффективным расследованием, проводимым чешской полицией, мы никогда не найдем правду. Тхус, Центральный комитет Коллегионистской партии разработал решение по вопросу о некомпетентности. Новый полицейский аппарат и аппарат безопасности, отличный от обычных полицейских сил, непосредственно от самой партии. Эти новые силы государственной безопасности, Státí Bezpechnost, или StB, убедятся, что такие случаи больше не повторятся. Мы будем знать все, что происходит, они будут нашими глазами и руками внутри страны. Ничто больше не сможет оспорить партию."
 cze.139.a: "Именно то, что нам было нужно."
 cze.140.t: "Рождение США."
 cze.140.d: "Наши революционные силы добились успеха в своей борьбе за завершение Чехословацкой революции. Наконец, рабочие воплотили свою мечту в реальность, и привели социализм и правление рабочих во все Чехословакии, как мы должны были сделать это много лет назад в Западославии. Несмотря на это, мы реорганизовали нашу страну с учетом нашего нового успеха, создав Чешскую Социалистическую Республику и Словацкую Социалистическую Республику и объединив их в социалистическую федерацию, так называемую Союз Чехословакийских и Словацких Социалистических Республик, или УКССР."
 cze.140.a: "Пролетарианцы всех стран, объединяйтесь!"
 cze.141.t: "Найдены странные документы"
 cze.141.d: "Когда следователь искал в офисе информацию о последнем дне товарища Слански, он был удивлен, обнаружив, что вещи Слански были явно перевезены и изменены на месте, вероятно, командой уборщиков. ~Но тем не менее, он посмотрел в своих файлах и расписания на что-то, что могло появиться в последний момент. В конце концов, не было ничего странного, что было бы найдено в его столе. Несмотря на то, что он по какой-то причине готов был уйти, он подумал, что это была бы хорошая идея проскользнуть вокруг и найти возможные файлы, которые могли быть перевезены в других комнатах. Он нашел файл в мусорном баке в офисе рядом с домом Слански, график, который, казалось бы, принадлежал на столе товарища, но был выброшен по какой-то причине, он подумал, что это была запланированная встреча между Слански и председателем Готвальдом в поздние часы того дня. Похоже, что график был примерно тот же день, как тот, который был найден на столе Слански, если бы одна из них была ненастоянастоянная история, это была поддельная, истина."
 cze.141.a: "Дайте официальное объяснение о поддельном графике, подсаживаемом в мусор."
 cze.141.b: "Мы должны избавиться от него."
 cze.142.t: "Растет недовольство населения"
 cze.142.d: "После того, как эта история была обнародована, доверие к руководству значительно сократилось. Председатель Готвальд был главным объектом критики, многие СМИ предательски называли его коррумпированным, хитрым и сговором, ставя его интересы выше интересов народа, и очевидно, что он несет ответственность за исчезновение. -Нет, официальный ответ на ситуацию был сделан, утверждая, что расписание, найденное и взятое следователем, является подделкой, составленной реакционными силами, чтобы угрожать нашей стабильности, или, возможно, даже самим следователем."
 cze.142.a: "Вы все кучка реакционеров."
 cze.145.t: "Председатель один"
 cze.145.d: "Поскольку даже семья товарища присоединилась к заявлению о том, что она обвиняет руководство партии в исчезновении Слански, Председатель оказался изолированным, и многие из самых видных партийных лидеров отказались продемонстрировать с ним какие-либо связи, поскольку средства массовой информации поставили его в известность о так называемом деле о коррупции."
 cze.145.a: "Пора уволиться."
 cze.145.b: "Если ты не со мной, ты против меня."
 cze.146.t: "Увольнение Готтвальда!"
 cze.146.d: "По мере усиления общественного и политического давления, Председатель оказался загнанным в угол, и не имея другого выбора, он официально ушел в отставку, хотя мы можем только надеяться, что это не повредит партии в целом, новое временное правительство было создано центральными силами, так как мы надеемся выйти за рамки коррумпированного влияния Готтвальда."
 cze.146.a: "Мы можем надеяться."
 cze.147.t: "Кубок народной армии"
 cze.147.d: "Председатель, окруженный врагами, не видел другого выхода. Чтобы заставить своих приспешников использовать, как он подписал приказ избавиться от большого числа партийных лидеров. Поскольку Судьба вскоре должна была начаться, коварный план Готтвальда был остановлен народной армией, которая, демонстрируя решимость и выступая против растущей коррупции в бюрократиях партии, переворотила правительство, поставив во главе партии военное правительство, в качестве временной меры, чтобы вернуть нашу страну к социализму."
 cze.147.a: "Генерал Свобода - сильный человек, который нам нужен."
 cze.147.b: "Ричард Тезаржик манипулирует и получает лидерство."
 cze.144.t: "Предатели бомбардировщики промышленных центров"
 cze.144.d: "Не все были вполне счастливы после того, как мы взяли на себя власть над страной, в основном предательские социалисты, а также группы, которые не ценят нашу миссию или цели. Не удивительно, что эти нежелательные люди пытаются навредить нам, и они сделали это, бомбардируя некоторые из наших промышленных центров в Чехии, нанося ущерб возможностям нашей нации. Хотя это не все, что мы не можем исправить, это может быть хорошей идеей послать наших людей, чтобы разобраться с этими предательскими группами, найти их и избавиться от них навсегда, хотя если мы не сделаем этого, наши стандартные силы безопасности могут избавиться от них, но не прежде, чем они причинят нам еще больше вреда."
 cze.144.a: "Отправь наших людей."
 cze.144.b: "Они нужны нам в другом месте."
 cze.143.t: "Чехословакия"
 cze.143.d: "Сегодня наш народ, чехословацкий народ, полон гордости. Справедливое завоевание, храбрые военные усилия, наша нация восстановила свою пропавшую половину, территории Словакии, основополагающую часть чехословацкой нации. Разлученные предателями мы добились успеха в объединении нашей нации, и мы не позволим никому забрать ее снова, пока мы стоим с величием и силой. Но сегодня мы празднуем. Наш народ объединён, наш народ возродился сильнее, чем когда-либо. Превосходство славянского рода было продемонстрировано миру, как триумф панславизма и чехословакизма. Теперь пришло время привести нашу недавно найденную половину к настоящему времени."
 cze.143.a: "Наш народ превзойдет!"
 cze.148.t: "Фронт чехии"
 cze.148.d: "После некоторых весьма убедительных переговоров нам удалось официально учредить Фронт Чехии, широкомасштабное политическое движение с целью создания базы поддержки нашего режима, которое слишком долго считалось непопулярным. Хотя многое еще предстоит сделать, чтобы заручиться поддержкой народа, это важный первый шаг."
 cze.148.a: "Будем надеяться, что это сработает."
 cze.149.t: "Новые силы безопасности"
 cze.149.d: "Мы отправили насильно и убедительно захватили следователя, а также изъяли все улики, которые у него были. Несчастные случаи не могут произойти. После расследования мы не можем допустить, чтобы информация была взята именно так. Мы не можем доверять такому органу, как полиция, расследовать дела, имеющие столь важное значение для государства, как исчезновение члена партийного руководства. Но почему мы создаём новые силы государственной безопасности, чтобы быть нашими глазами и руками, и убедиться, что это никогда больше не повторится. Statí Bezpechnost, или StB, принесет нам стабильность и укрепит партию, и лояльность к ней. И как лучше использовать ее, чем избавиться от всех тех предателей, которые плохо ругают партийное руководство прямо сейчас."
 cze.149.a: "Никто не допрашивает нашего председателя."
 cze.150.t: "Прибытие следователя"
 cze.150.d: "Как только пройдет другой день, следователь наконец-то прибыл для расследования офиса партии и поиска улик о поведении и местонахождении пропавшего товарища, однако, по какой-то причине возникла большая напряженность, по которой развилось неуверенное руководство партии. Он попросил дать ему по меньшей мере 6 часов для расследования, но это было сочтено многими слишком много, утверждая, что 3 часа могут быть лучше, и более чем достаточно."
 cze.150.a: "Позволь ему не торопиться."
 cze.150.b: "Всего 3 часа."
 cze.151.t: "Ничего неопровержимого в офисах"
 cze.151.d: "Как и ожидалось, следователь не смог найти ничего убедительного во время обыска офиса, и поэтому решил начать расследование по пути Слански домой, возможно, он найдет там что-то полезное."
 cze.151.a: "Возможно."
 cze.160.t: "Отвратительное отношение общественности"
 cze.160.d: "Новый режим, который возродился в Чехии, будучи явно направлен на то, чтобы сделать мечты чешского народа живыми, был весьма противоречивым. И то, что осталось от спящих социалистических революционеров, а также от оппозиционных сил, связанных с либеральными демократическими движениями, которые так давно отравили Западославию, поставило взоры на дестабилизацию нашего правительства. Несмотря на то, что мы не позволим этому случиться, поскольку наши легионы избавятся от каких-либо врагов нации, этого недостаточно, поскольку мы должны укрепить верность наших людей своей нации, не говоря уже о том, чтобы иметь дело с диссидентами."
 cze.160.a: "Только V ...dce может дать людям то, что они хотят."
 cze.160.b: "Пришло время для некоторых реформ в области безопасности."
 cze.161.t: "Встреча в Праге"
 cze.161.d: "Из нашей национальной столицы будет расширяться новый дух национального возрождения. Вскоре все чехии будут наполнены горячими сердцами и душами, чтобы наши коллективные мечты снова стали реальностью. Несмотря на то, что в нашем первом митинге наш V ...dce пытался вызвать это. С возможными врагами государства в целом все шло довольно хорошо, так как наши силы обезопасили каждый угол, и массы двигались с легионами, объединенными по мере того, как махали национальные флаги, и толпа приветствовала Гайду."
 cze.161.a: "Мы расширимся от Праги до Чехословакии!"
 cze.162.t: "Собрание в Пльзе."
 cze.162.d: "Одно из самых спорных мест для митинга, и, возможно, одно из самых стратегических, Гайда решила, что Пльзень, пересекая Границу Судетеленда, будет местом. ~NNNAS Sudeten Herman Nationalists, противостояя всему, за что выступает наша национальная мечта, мы ничего не нашли в этом. Вместо этого некоторые демонстрации либеральных и социалистических диссидентов протестовали, когда в город прибывала колонна Вэдце. Они были быстро арестованы, и мы идентифицировали среди них как этнических чехов, так и судетенов немцев. ~ ~ ~ После этого митинг прошел успешно, с сильным анти-немецким реторическим движением, которое было ядром речи В. Это привело к большой популярности среди населения города."
 cze.162.a: "Могло быть и хуже."
 cze.163.t: "Демонстрации в Брно"
 cze.163.d: "По мере продолжения нашей кампании запланированное местоположение Брно было особенно важным для рассмотрения V ... и должно быть местом следующего митинга. Несмотря на то, что рок появился перед нашей дорогой, в то время как все более радикальные оппозиционные силы начали протесты в Брно, гораздо больше, чем те, с которыми мы столкнулись в Пльзе. Хотя наши силы вполне способны справиться с ними, немедленное проведение этого мероприятия может быть очень опасным, поскольку разделенный город, полный диссидентов, которым предстоит активно заниматься, может поставить под угрозу благополучие нашего V ...disce. Он, однако, заявил, что не позволит диссидентам остановить свою национальную кампанию. Тем не менее, многие считают, что ожидание этого события может быть лучше всего для национальной безопасности."
 cze.163.a: "Слабые непатриотические предатели не остановят V ...dce."
 cze.163.b: "Мы должны подождать, пока ситуация будет урегулирована."
 cze.164.t: "Встретимся в Брно"
 cze.164.d: "С большинством наших легионов, чтобы защитить V...дце в крайне спорном месте для его речи, небольшие беспорядки произошли на улицах, однако они были быстро сведены на нет. Радикальные демонстрации, сдвинувшие много молчаливого населения города в сторону V...дце в ответ, они помогли сражаться с любыми возможными инакомыслящими. ~nng V-dce сам сосредоточился на разногласиях и преодолел неустойчивость, на которой предатели поместили Чехию, а также отразили исторический характер города как бывшей столицы Западославии, и там, где он пришел к концу, Брно сам будет помогать переосмыслить пламя, которое подталкивает наш народ к достижению этой мечты снова. ~ После завершения, из-за соображений безопасности, V-dce быстро покинул город, как он, казалось, был прав в конце концов, предатели не смогли остановить его, и лояльность ему была усилена."
 cze.164.a: "V ...dce был прав."
 cze.165.t: "Встреча в Остраве"
 cze.165.d: "По мере того, как он завершает свою национальную кампанию, V ...dce достиг своего последнего места, восточный город Острава. Похоже, что национальные настроения явно поддерживают V...дце во всех вопросах, поскольку большинство населения почти пограничного города с гордостью присутствовало на митинге, речь V ...dce, посвящённая будущему чехов, явно дошла до сердца людей. Быстро последовал марш, и митинг был большим успехом."
 cze.165.a: "Мы все вместе в этом деле."
 cze.166.t: "Встретимся в Брно."
 cze.166.d: "После нескольких дней ожидания, наши силы полностью избавились от большинства дезертиров и диссидентов в Брно. Казалось, что все прошло хорошо, так как на улицах больше не было хаоса, так что это означало, что он был в безопасности. Ну или так мы думали. Скрыт между массами, как просто еще один легионарий, диссидент неизвестной принадлежности подошел к близкой диссиденту и выстрелил V... в голову. Толпа запаниковала, и убийца был быстро застрелен, но это было слишком поздно. Поскольку хаос переполнил улицы, Националистический фронт быстро поднялся и установил порядок в городе. Несмотря на то, что теперь мы без нашего лидера, и разногласия в партии показывают. Одна сторона, более поддерживающая бывшую политику и идеи Вэдсе, возглавляемую Эмануэлом Моравичем, хочет продолжить с наследием Гайды. Другая фракция, однако, та же самая, которая предложила создать более сильные силы безопасности частично в стиле Германии, и которая была узаконена, может набрать силу."
 cze.166.a: "Православные гаджисты Моравека победили в борьбе за власть."
 cze.166.b: "Идея реорганизации Яна Риса-Розсевача - это то, что нужно Чехии."
 cze.167.t: "Реорганизованная безопасность"
 cze.167.d: "Мы пришли к выводу, что мы должны реорганизовать наши силы безопасности, с тем чтобы должным образом вести дела со всеми диссидентскими группами в нашей стране, мы находим себя с хорошим планом. Легионы, будучи лояльными нам и страстными в своем национализме, не очень хорошо организованы, работая, скорее, органично, чем под абсолютным контролем нашего государства. Ян Рис-Розсевач, один из подрастающих политических членов Националистического фронта, предложил именно это. Он предлагает новый реорганизованный Легион с правильной иерархией, более жесткими требованиями к членству и более профессиональным, который работает непосредственно под контролем государства и В.В. Тем временем, отдельный филиал будет создан среди самых преданных и опытных из Легионов, с целью обеспечения безопасности нашего государства и нашего правительства, и обеспечения того, чтобы любая диссидентская деятельность не могла даже начать развиваться. Охранни Оддиль, или ОО, как их называет Розсевич, был бы в значительной степени вдохновлен Германией TST. Единственный факт сделал эту реорганизацию весьма расколотно, учитывая наши отношения с немцами."
 cze.167.a: "Пока это работает..."
 cze.168.t: "Поиск в Судене"
 cze.168.d: "Судетенленд, вероятно, является самым спорным и нестабильным регионом нашей страны, и для обеспечения его долгосрочной стабильности был утвержден новый проект УО, инфильтрация и слежка за предателями, чтобы заставить их задыхаться изнутри, и мы надеемся, что этот план, несомненно, сработает."
 cze.168.a: "Только проект, который нам был нужен."
 cze.169.t: "Скрытые камеры в Праге"
 cze.169.d: "Не секрет, что Прага выросла среди самых влиятельных коллективистов во всей Центральной Европе, но они хитрые, и даже с нашим национальным правительством, мы должны найти их в их грязных гнездах, где они прячутся, как крысы, и полностью избавиться от них. Таким образом, был предложен проект по борьбе с больцевиками, проникающий в некоторые районы Праги, которые более известны своими социалистическими наклонностями, мы искореним всех предателей."
 cze.169.a: "Коллинз сегодня, завтра уезжает!"
 cze.170.t: "Моравианская хитрость"
 cze.170.d: "Одной из тех, кто меньше заботился о некоторых частях нашей страны, менее центральная природа Моравии может сделать это хорошим укрытием для злоумышленников нашего общества, которые планируют наше падение. Пора приблизить Моравию к нашему полному контролю, отправив ОУ, чтобы разобраться с любыми возможными нарушениями."
 cze.170.a: "Никто не может спрятаться."
 cze.171.t: "Предатели, подвергшиеся произвольному аресту"
 cze.171.d: "После нескольких недель расследования командование ОУ в Судетенленде помогло найти и арестовать основные операционные ячейки диссидентов в Судетенленде, хотя это было большим успехом для нашей страны, похоже, что Риз-Розсевач получил больше влияния из-за этого."
 cze.171.a: "Наконец-то мирная Сутенландия."
 cze.172.t: "Очистка Праги"
 cze.172.d: "Недели расследований, запланированных рейдов, погони за крысами в переулках и т.д. дали результаты. По официальным статистическим данным, ужасная активность в Праге снизилась на 96%. Похоже, чешские граждане наконец-то могут ходить без страха, поскольку улицы Праги очищаются от человеческой грязи, которая так долго пыталась отравить нашу нацию, и все благодаря мальчикам, конечно."
 cze.172.a: "Наконец!"
 cze.173.t: "Содержится в заключении"
 cze.173.d: "Поскольку область Моравия находится под строгим контролем ОУ, секретные социалистические операции, которые, вероятно, поддерживаются бушевиками на востоке, были найдены."
 cze.173.a: "Хорошая работа."
 cze.174.t: "Внутренние угрозы?"
 cze.174.d: "До сведения нашего V-dce дошел доклад. Знающий преданный генерал и союзник Гайды, Эмануэль Моравек, привлёк к V-dce утверждения о том, что Рыс-Розсевач, возможно, что-то задумал. Хотя всем ясно, что влияние ОО в нашем обществе резко возросло, так как они появились в каждом уголке нашей нации, независимо от того, имеют ли они свою собственную верность или нет, и не удивительно, учитывая постоянное недоверие Моравича к организации и идеям Рыс-Розсевача. С другой стороны, если эти обвинения правы, то было бы лучше действовать быстро, иначе мы могли бы оказаться в крайней опасности, и Моравек не является совершенно необоснованным в этом. Таким образом, у нас в руках есть жесткое решение."
 cze.174.a: "УО лояльна к V ...dce, это точно."
 cze.174.b: "Мы должны избавиться от УО, пока не поздно."
 cze.174.c: "Избавься от Моравека."
 cze.175.t: "Риз-Розсевач требует больше мощности"
 cze.175.d: "Сегодня Рыс-Розсевач прибыл в национальный дворец В.. . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . ."request". To be granted the title of deputy Vůdce, as well as more liberties in his use of the organization. While clearly not what we wanted, the Vůdce found himself with no option but to do as requested, as the OO surrounded his seat of power. The balance of power inside our nation is shifting."
 cze.175.a: "Риз-Розсевач получает признание, которого он заслуживает."
 cze.176.t: "V ...dce найден мёртвым"
 cze.176.d: "Трагедия поражает нашу нацию. Поскольку толпа воссоединилась в ожидании намеченной речи V ...dce, они оказались без V ...dce. Вместо этого было сделано мрачное объявление. Рано утром ОУ, выполняя свои обязанности по обеспечению безопасности, прибыло в резиденцию V ...dce и обнаружило его мертвым. Хотя точная причина или способ его смерти не были указаны, возможно, по соображениям безопасности, Риз-Розсевач, действуя в качестве заместителя V ...dce, утверждает, что это должно быть результат заговора Bolshevik. Он также объявил три дня траура по ушедшему Вэдце, за которыми последовали объявления о реорганизации в нашей стране, чего многие ожидают от него, официально объявляя себя В."
 cze.176.a: "Ужасные новости."
 cze.177.t: "Кубок лоялистов"
 cze.177.d: "По окончании траура объявление, подготовленное депутатом V ...dce, было остановлено сегодня. Армия, ведомая действиями генерала Моравеча, совершила переворот на Рис-Розсевиче, арестовав его и казнив его. //. Объявление генерала, заявившего, что сам ОО в предательском шаге по обеспечению прихода Рыс-Розсевача к власти, стоял за убийством ушедшего В. .... Таким образом, правительство Охранни Оддиля было объявлено незаконной организацией. С его отсечением головы, похоже, оно быстро начало распускаться, хотя лидеры низшего уровня пытались бороться против национальной армии, но вооруженные силы были ошеломлены, и, таким образом, режим ОО пришел к концу. Майское правительство Мораведа надлежащим образом ведет нашу на путь, по которому действительно хотел Гайда."
 cze.177.a: "May Vůdce Moravec lead us.
 cze.178.t: "Предстоящая Церемония"
 cze.178.d: "Глубоко проникнутая, как они есть, OO имеет слишком большое влияние, чтобы просто аннулировать их, как будто они ничего не были. Таким образом, это с тонкостью, что мы будем действовать. План установлен, V ...dce назначил встречу с Риз-Розсевачем, чтобы поздравить его с достижениями его организации. Мало что он знает, что армия будет бдительна, и как только он встанет на место власти, он будет арестован и его организация будет распущена. Мы не можем потерпеть неудачу."
 cze.178.a: "Время действовать."
 cze.179.t: "Риз-Розсевач бежит из страны"
 cze.179.d: "Похоже, Ян Рис-Розсевач был предупрежден о нашем плане и, довольно умным шагом, покинул страну. Теории о его возможном местонахождении говорят, что он, вероятно, сбежал в Германию, или даже в Венгрию. Хотя мы не знаем, где он может быть, мы знаем две вещи: .. . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . ."
 cze.179.a: "Какая грязная чистка."
 cze.180.t: "Рыс-Розсевач легко захватили"
 cze.180.d: "Заманка была установлена. Риз-Розсевач ничего не ожидал. Когда он с гордостью вошел в национальный дворец, чтобы поговорить с V ..., наши силы немедленно поднялись и захватили его. Он начал оскорблять V-э ... и, следовательно, нацию. Типичное поведение предателя. Он был предан суду и сразу же застрелен."
 cze.180.a: "Ты когда-нибудь был членом Охранни Оддиль?"
 cze.181.t: "Новый V ...dce Rises"
 cze.181.d: "V ...dce Gajda ведёт нас в новую эру национального возрождения. Однако вот-вот начнется другой век, где мы будем строить из того, что нас оставил Gajda, и улучшать его, чтобы достичь наивысшего пика человеческих достижений. Мы начнем Чешский путь к валькизму! ~nnnthus был провозглашен новым V ...dce Rys-Rozsévach. Многие хотят увидеть, что это принесет Чехии, хотя."
 cze.181.a: "В Рис-Розсеваче мы доверяем."
 cze.190.t: "Чехия ищет поблажек"
 cze.190.d: "С тех пор, как рухнул кошмар Западославии, у нас не было лучших отношений с нашими братьями, если вообще они вообще были."
 cze.190.a: "Это было бы к лучшему."
 cze.190.b: "Мы не попадемся на их ложь."
 cze.191.t: "Словакия соглашается восстановить отношения"
 cze.191.d: "В момент успеха нашей дипломатической команды Чехия обеспечивает лучшее место для себя в Европе, когда Словакия соглашается восстановить дипломатические отношения с нами."
 cze.191.a: "Это здорово!"
 cze.192.t: "Словакия отвергает отказ"
 cze.192.d: "Похоже, что словацкое правительство, все еще питающееся грязной смесью злобы и национализма, решило отвергнуть наше дружеское предложение разрядки."
 cze.192.a: "Их потеря."
 cze.193.t: "Чехия призывает к проведению чешско-словацкого конгресса"
 cze.193.d: "Стремясь к дальнейшему улучшению отношений между нашими странами и, возможно, к сотрудничеству по некоторым вопросам, чешское правительство призвало нас учредить чешско-словацкий конгресс."
 cze.193.a: "Согласиться с Конгрессом"
 cze.193.b: "Отвергайте с уважением."
 cze.194.t: "Словакия отвергает Конгресс"
 cze.194.d: "Правительство Словакии почтительно отклонило наше предложение о совместном конгрессе, заявив, что оно идет вразрез с их дипломатическими целями национального развития Словакии."
 cze.194.a: "Понятно, хорошего дня."
 cze.195.t: "Словакия принимает участие в Конгрессе"
 cze.195.d: "Решая, что в их интересах искать возможности для укрепления связей и сотрудничества с нами, словацкое правительство согласно с реализацией плана Чехословакийского конгресса, мы можем только надеяться, что с этого момента все будет хорошо."
 cze.195.a: "Мы можем надеяться."
 cze.196.t: "Чешско-словацкий конгресс начинается"
 cze.196.d: "Организованный в символическом городе Брно, долгожданный конгресс наконец-то начинается, важные дипломаты из наших наций встретятся на этом мероприятии, как президент [Root.Get Header] произносит речь об исторических связях между нашим народом и, конечно же, о продвижении вперед от испытаний Чехословакии, он пожал руку словацкому президенту [SLO.Get Header] на исторической церемонии."
 cze.196.a: "Для народов Чехии и Словакии!"
 cze.197.t: "Конгресс по экономике"
 cze.197.d: "Первый вопрос в повестке дня, экономические связи, был поставлен в центр внимания. Хотя Чехия смогла построить сильную экономику на основе своей большой промышленной базы, а также связей со стабильной экономической сферой, словаки были более грубее. С преимущественно аграрной экономикой, ее связи с Великобританией очень помогли ей, и после кризиса на Лондонском фондовом рынке, это было довольно трудно. Тем не менее, с очень разными производственными зонами, есть большой потенциал для экономических связей и, возможно, интеграции. . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . ."
 cze.197.a: "Мы будем сотрудничать с экономической точки зрения."
 cze.197.b: "Это просто плохая сделка."
 cze.198.t: "Конгресс по экономике"
 cze.198.d: "Чешско-словацкий конгресс приступил к рассмотрению вопроса об экономическом сотрудничестве. Чехия, как и ожидалось, имела больший вес на Конгрессе из-за более высоких экономических показателей в качестве независимого государства. Однако этот вопрос в повестке дня оказался весьма удачным для нас, поскольку чехи согласились воспользоваться с нами торговыми льготами, что, безусловно, поможет нашей экономике продвинуться вперед. Похоже, Конгресс был бы хорошей идеей."
 cze.198.a: "Ну, это мило."

 cze.220.t: "Выборы [поступления]"
 cze.220.d: "Поскольку пятилетний период подходит к концу, настало время для Чехии провести свои вторые президентские выборы после восстановления демократии."
 cze.220.a: "Социальные демократы победили."
