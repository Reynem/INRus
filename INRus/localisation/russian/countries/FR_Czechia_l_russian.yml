 CZE_heir_of_zapadoslavia: "Наследник Западославии"
 CZE_heir_of_zapadoslavia_desc: "Славская мечта рухнула перед нами, и теперь мы оставляем то, что осталось от Западославской армии и государства."
 CZE_state_of_the_czechs: "Положение чехов"
 CZE_state_of_the_czechs_desc: "В результате хаоса и трагедии за славную мечту чешское государство держится за свою землю, пытаясь обеспечить свое выживание и будущее."
