 cze_foreign.1.d: "Сообщения от наших атташе в Праге подтверждают, что чешское государство находится на грани краха. Хотя наши проблемы и не связаны с нашими проблемами, этот хаос предоставляет несомненную возможность. Район [1034.Гетнам], который по праву является нашим и населён тысячами наших польских братьев, в настоящее время не защищен. Местные поляки призывают Варшаву к защите и воссоединению. ~Нет, мы сейчас сталкиваемся с критическим решением. Решительно ли мы вернем наши исконные земли и воссоединим наш народ, отстаивая наши национальные интересы? Или мы сохраняем нашу честь, отказываемся стервятничать и предать наших славитских соседей, чехов, в их мрачный час?"

 cze_foreign.2.d: "Это предательство славянской солидарности существенно разрушает наши рамки региональной безопасности. Наша северная граница, которая когда-то считалась безопасной или, по крайней мере, нейтральной, теперь является прямым фронтом против немецко-польского блока. Наша стратегическая изоляция сейчас опасна. Угроза Берлина возросла за одну ночь, и само выживание Чешской Республики поставлено на карту. Мы должны выбрать путь вперед поспешно: будем ли мы немедленно просить наших французских союзников о официальном военном союзе, или же мы станем крепить и готовиться к этой новой реальности в одиночку?"
 
 cze_foreign.3.d: "Куай-д'Орсай получил срочное дипломатическое сообщение из Праги. После шокирующих новостей о новом соглашении Польши с Берлином чешское правительство официально просит присоединиться к нашей фракции. Они по праву боятся за свой суверенитет, теперь окружённые враждебными силами. Польское дезертирство серьезно ранило нашего Кордона Санитаера, но чехи предоставляют ценную возможность. Их армия современна, их промышленность сильна, и их пограничные укрепители, как говорят, являются одними из лучших в Европе. Приведение их в лодку обеспечило бы могущественного союзника на границе Германии, но оно также полностью обязало бы нас защищать их. Мы должны решить, есть ли это обязательство, которое мы готовы взять на себя."
 
 cze_foreign.4.d: "Волна помощи, охватившая правительство в Праге! Париж положительно откликнулся на нашу срочную просьбу. Французская Республика официально приняла Чехию в свой союз, взяв на себя обязательство поддерживать нас против любых и всех агрессоров. Несмотря на то, что тень изоляции снялась. Хотя польское предательство по-прежнему жалко, мы уже не одни. Вместе с нашими могущественными западными союзниками мы можем теперь уверенно противостоять растущей угрозе Берлина. Наша независимость будет защищена!"


