jap_wnt: "Вашингтонский морской договор"
jap_wnt_desc: "Вашингтонский военно-морской договор был подписан в 1921 году и ограничил строительство кораблей в Соединенных Штатах и Японии. Договор ограничил перемещение любых новых кораблей и вооружения любых новых боевых кораблей двух подписавших его сторон. Британцы прекратили установку новых кораблей по мере того, как американцы и японцы остановились, предотвратив тем самым новую гонку вооружений."
JAP_gunbatsu: "Гунбатсу"
JAP_gunbatsu_desc: "Гунбатсу является прямым результатом фракционности, происходящей в имперской армии, постоянного соперничества между военно-морским флотом, армией и государством, что отрезает дипломатические решения и коммуникации во всем мире."
