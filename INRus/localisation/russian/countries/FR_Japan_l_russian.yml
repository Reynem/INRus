japfor.10.d: "После развала оставшихся центров сопротивления в Китае наши враги пострадали от полного военного краха, и ИДЖ воцарилась в Китае."

japfor.11.d: "На протяжении уже нескольких месяцев японцы выражают свои агрессивные амбиции в отношении наших земель в рамках своей экспансионистской политики. Сегодня японский посол представил нам ультиматум: они требуют, чтобы мы сдались японским властям или столкнулись с последствиями."
japfor.12.d: "Мы не получили никакого ответа на наш ультиматум от [от GetNameDef], мы должны мобилизоваться к войне и обеспечить безопасность нашего места как единственной великой державы в Восточной Азии!"
japfor.13.d: "В конце концов, это не так уж удивительно: они не посмеют смотреть в глаза силе императорских армий!"

japfor.14.d: "Сиам имеет уникальные отношения с нами: одна из немногих стран Азии, которая не должна падать под европейское господство, и одна с внешнеполитическими целями, которые в целом совпадают с нашими, может оказаться полезным союзником, но вместо этого мы можем заставить их наклонить колено к императору."

japfor.15.d: "Уже несколько месяцев японцы выражают свои агрессивные амбиции в отношении наших колониальных земель в рамках своей экспансионистской политики."
japfor.16.d: "Мы не получили никакого ответа на наш ультиматум от [от GetNameDef], мы должны мобилизоваться к войне и обеспечить безопасность нашего места как единственной великой державы в Восточной Азии!"
japfor.17.d: "В конце концов, это не так уж удивительно: они не посмеют смотреть в глаза силе императорских армий!"

jap_second_sino_war.3.d: "Слишком долго мы обменивались пространством на время, отступая вовнутрь, когда захватчики захватили наши города, но прилив меняется. По всей стране различные группировки Объединенного фронта координировали свои усилия по масштабному, синхронному контрнападению. С гор севера на тропический юг, каждый солдат Китая теперь двигается как единое целое. Пришло время остановить японский шаг и начать долгий марш, чтобы оттолкнуть их обратно в море!"

jap_second_sino_war.4.d: "Наши офицеры и солдаты, пережившие первоначальное нападение Имперской японской армии, начали адаптироваться к современной войне с комбинированным оружием, анализируя тактику противника и совершенствуя наши собственные оборонительные доктрины, мы, наконец, превращаем сырьевой опыт в структурированную военную эволюцию. Пролитая в предыдущие месяцы кровь не будет напрасной; она станет основой, на которой будет построена наша новая армия."

