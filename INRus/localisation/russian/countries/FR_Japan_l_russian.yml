jap_friends_with_germany: "Немецко-японское промышленное партнерство"
jap_friends_with_germany_desc: "Объединяя промышленную мощь Запада и Востока, это партнерство обеспечит наше будущее экономическое господство."

jap_honshu_infra: "Совершенствование инфраструктуры &lt; &lt; Хонсю &gt; &gt;"
jap_honshu_infra_desc: "В 1920-е годы наши правительства модернизировали инфраструктуру, включая массовое расширение железных дорог, простирающихся от Нагасаки до Токио. Несмотря на эти улучшения, некоторым частям нашего дома не повезло так много индустриализации, что мы сможем увеличить индустриализацию этих районов, построив новые железные дороги и шоссейные дороги в эти более сельские районы, а именно в Северную Хонсю."
jap_kyushu_infra: "Совершенствование инфраструктуры Кюсю"
jap_kyushu_infra_desc: "В 1920-е годы наши правительства модернизировали инфраструктуру, включая массовое расширение железных дорог, простирающихся от Нагасаки до Токио."
jap_explore_hokkiado: "Разведка Хоккайдо"
jap_explore_hokkiado_desc: "Император Мэйдзи однажды приказал исследовать Хоккайдо, теперь, когда у нашего правительства меньше вопросов, мы можем послать больше исследователей, чтобы исследовать огромное неизвестное, что есть Хоккайдо."
jap_fort_mainland: "Укрепить материковую зону"
jap_fort_mainland_desc: "Так как наша армия, как правило, не охраняет наши зарубежные войска, наши основные родные острова легко заняты, если большая сюрпризная сила приземлится успешно."
jap_fort_cities: "Укрепить важные города"
jap_fort_cities_desc: "Укрепив стратегические точки, мы должны также укрепить важные города, такие, как Токио, Осака и Киото."
jap_fort_islands: "Укреплять осаждения за рубежом"
jap_fort_islands_desc: "Наши зарубежные войска являются важными стратегическими мудрыми, поскольку они обеспечивают основы для вывода нашего флота из него, но требуют, чтобы люди охраняли его."
jap_the_unsinkable_carriers: "Непоглощаемые перевозчики"
jap_the_unsinkable_carriers_desc: "Островы, которые мы владеем, могут позволить себе воздушно-воздушные базы, чтобы мы могли строить там наши самолеты, и, следовательно, острова могут быть непотопляемыми носителями военно-морского флота, разрушая хаос, на случай, если мы не сможем догнать судостроительство США и Британской империи."
jap_further_hokkaido_exploration: "Дальнейшая разведка Хоккайдо"
jap_further_hokkaido_exploration_desc: "Экспедиции Хоккайдо доказали свою ценность и окупили дивиденды."
jap_industrial_effort: "Обзор японской экономики"
jap_industrial_effort_desc: "Мы должны озеленить программу дальнейшего развития национальной экономики в надежде на экономический рост. Это программа, на которой мы должны сосредоточиться, или она может и не доказать ее ценность."
jap_nationalize_strategic_resources: "Национализация стратегических ресурсов"
jap_nationalize_strategic_resources_desc: "У нас есть определенные компании, которые могут быть национализированы для обеспечения того, чтобы правительство и военные имели приоритет над этими ресурсами."
jap_the_nagoya_arsenal: "Расширить нагойский арсенал"
jap_the_nagoya_arsenal_desc: "Нагоя-арсенал на протяжении более десяти лет снабжал страну оружием."
jap_develop_taiwan: "Развитие Тайваня"
jap_develop_taiwan_desc: "Тайвань играет важную роль в нашей колониальной империи как центр торговли и жизненно важной стратегической позиции против любого могущественного европейского врага, и поэтому мы должны приступить к развитию острова, с тем чтобы лучше отразить его значение в империи и укрепить свое положение в Южно-Китайском море."
jap_develop_korea: "Развивать Корею"
jap_develop_korea_desc: "Корея — это сокровище нашей колониальной империи, и она действительно непрерывна с материковой части Японии, и она заслуживает самого пристального внимания в ее развитии и совершенствовании, с тем чтобы ее японская очистка могла продолжаться беспрепятственно."
jap_develop_karafuto: "Разработать карафуто"
jap_develop_karafuto_desc: "Карафуто является важным барьером против любой мощной российской или советской агрессии и обеспечивает полный контроль над Японским морем."
jap_develop_indonesia: "Развивать Восточную Индонезию"
jap_develop_indonesia_desc: "Восточная Индонезия, в состав которой входят Сулавеси и Молуккас, является абсолютно важным регионом нашей колониальной империи, предоставляя нам большое количество каучука и позволяя нам гораздо более эффективно конкурировать с европейцами в Азии."
jap_military_production_plants: "Военные производственные установки"
jap_military_production_plants_desc: "Наша армия велика и впечатляет, но отчаянно нуждается в обширном снаряжении для нормального функционирования, которого нам не хватает."
jap_war_propaganda: "Пропаганда войны" 
jap_state_wide_war_effort: "Война на всей территории штата"
jap_spiritual_mobilization: "Духовная мобилизация"
jap_military_research_department: "Департамент военных исследований"
jap_total_mobilization: "Итого, мобилизация"
jap_divine_wind: "Богобоязненный ветер"
jap_divine_wind_desc: "Специальные силы божьего ветра — это ветвь военно-воздушных сил, которые безжалостно разрушат свои самолеты в направлении кораблей врага."
jap_shikoku_infra: "Совершенствование инфраструктуры Шикоку"
jap_shikoku_infra_desc: "В 1920-е годы наши правительства модернизировали инфраструктуру, включая массовое расширение железных дорог, простирающихся от Нагасаки до Токио."

#Navy
jap_modernise_the_navy: "Имперский флот"
jap_modernise_the_navy_desc: "Военно-морские силы с момента заключения Вашингтонского военно-морского договора в основном игнорируются. Корабли от Великой Войны сейчас превзошли все остальные военно-морские силы. Мы должны приступить к модернизации военно-морского флота немедленно."
jap_modernisation_of_cruiser: "Модернизация круизеров"
jap_modernisation_of_cruiser_desc: "Новые крузеры превосходят наши старые крейсеры, которые были построены во время Великой войны и в период Интервара."
jap_destroyer_modernisation: "Асасио Разрушитель"
jap_destroyer_modernisation_desc: "Наши дизайны "Уничтожителя" также устарели и не могут должным образом конкурировать с новыми дизайнами."
jap_expand_the_snlf: "Расширить SNLF"
jap_expand_the_snlf_desc: "Специальные военно-морские сухопутные силы представляют собой группу морских пехотинцев, которые могут быть доминирующей силой вторжения, если мы хотим вести войну и сухопутную деятельность на островах Тихого океана."
jap_long_lance_torpedoes: "Длинный Лэнс Торпеды"
jap_long_lance_torpedoes_desc: "Лонг Лэнс Торпеды сейчас многообещающий прототип, если мы потратим время и капитал на инвестиции в этот прототип, мы могли бы разработать один из лучших торпед перед другими мореплавателями."
jap_torpedo_cruisers: "Торпедные круизеры"
jap_torpedo_cruisers_desc: "С развитием Long Lance Torpedes, кладя на наши крейсеры много торпедных пусковых установок, они могут одолеть многие крейсеры военно-морских сил и, возможно, поставить под угрозу гордость флота противника."
jap_superior_battlefleet: "Высший боевой флот"
jap_superior_battlefleet_desc: "Концепция &lt; &lt; Восьмёртого флота &gt; &gt; , разработанная нашими тактиками после Руссояно-японской войны, является дееспособной доктриной, и мы должны продолжать придерживаться этой концепции без всяких сомнений."
jap_improve_naval_artillery: "Совершенствование военно-морской артиллерии"
jap_improve_naval_artillery_desc: "Военно-морские батареи наших кораблей всегда были относительно высокого качества, но при большем объеме инвестиций в них, чтобы лицензировать дизайн других сил или исследовать более совершенную версию, мы, скорее всего, могли бы создать более качественную батарею."
jap_expand_the_kure_dockyards: "Расширить военно-морский арсенал Kure"
jap_expand_the_kure_dockyards_desc: "Морской Арсенал Куре был доминирующим верфью японского флота с тех пор, как был деактивирован арсенал Сасебо, недавно он оказался неспособным обслуживать более крупный флот, и сейчас мы должны его расширить."
JAP_the_yamato: "Ямато"
JAP_the_yamato_desc: "Проект супертяжелого боевого корабля был разработан в межвоенный период, но на самом деле не был построен из-за Вашингтонского военно-морского договора."
jap_expand_the_sasebo_arsenal: "Возобновить сасебо-арсенал"
jap_expand_the_sasebo_arsenal_desc: "Сасэбо Арсенал был деактивирован во время межвоенного периода и в основном использовался в качестве причала."
jap_lessons_of_the_great_war: "Уроки Великой войны"
jap_lessons_of_the_great_war_desc: "С учетом многих уроков, извлеченных из военно-морских сражений во время Великой войны, многому удается научиться, но эти уроки не реализуются должным образом, при условии проведения определенной работы, мы можем убедиться, что наш военно-морский персонал использует их."
jap_imperial_bb_academy: "Имперская академия боевого флота"
jap_imperial_bb_academy_desc: "С учетом уроков Великой войны специальная академия для экипажей кораблей окажет огромное влияние на предстоящее военно-морское сражение, поскольку мы можем дать нашим экипажам преимущество над нашими врагами."
jap_dominance_of_cv: "Доминирование перевозчиков"
jap_dominance_of_cv_desc: "Как показали испытания доктрин авианосцев с Хошо и Рюджо, что самолеты могут легко уничтожить военный корабль, мы должны продвигать повестку дня, которая фокусируется на перевозчиках, а не на флоте боевых кораблей, на который указывают наши старые доктрины."
jap_first_air_fleet: "Первый воздушный флот"
jap_first_air_fleet_desc: "Первый авиационный флот может быть создан, сосредотачивая военно-морскую авиацию Каги, Акаги, Сорью и Хирю на аккуратном и мощном флоте, который может быть присоединен или выведен из строя в мгновение ока от любого другого нашего флота."
jap_third_gen_cv: "Третья программа для военнослужащих-перевозчиков"
jap_third_gen_cv_desc: "С учетом опыта Сорью и Хирю мы добились гораздо более быстрых улучшений, которые должны быть закопированы. С новыми военно-морскими экспансиями необходимо начать развитие третьего поколения перевозчиков."
jap_fifth_fleet_expansion: "Пятое расширение флота"
jap_fifth_fleet_expansion_desc: "Пятый флот представляет собой коллекцию из нескольких кораблей сопровождения и транспорта."
jap_inaa: "Имперская академия военно-морской авиации"
jap_inaa_desc: "С расширением большого числа новых флотов для них появляется все меньше опытных пилотов и экипажей. С созданием академии эти пилоты могут стать сильной силой этих флотов."
#Planes are cool
jap_plane_modernisation: "Модернизация самолета"
jap_plane_modernisation_desc: "Если мы расширим наши военные силы, необходимо также обеспечить соответствующую авиаподдержку, а расходы на модернизацию наших самолетов могут помочь повысить эффективность наших военных."
jap_mitsubishi_designs: "Дизайны &lt; &lt; Мицубиси &gt; &gt;"
jap_mitsubishi_designs_desc: ""Митсубиси" - это компания, занимающаяся строительством судов и транспортом, но недавно они вступили в авиационную индустрию."
jap_the_zero: "Зеро"
jap_the_zero_desc: "Мицубиси завоевал доверие японского флота, и теперь флоту нужен новый и способный боец."
jap_unify_research_effort: "Унификация исследований"
jap_unify_research_effort_desc: "Разрозненные исследования наших военных привели к дублированию исследований."
jap_combine_bomber_effort: "Комбинированный бомбардировщик &lt; &lt; Эксфорт &gt; &gt;"
jap_combine_bomber_effort_desc: "Давая контракт как военно-морским, так и военным подрядчикам, мы можем получить бомбардировщика, пригодного для использования в военно-морских целях и тактических бомбардировок, лучшего из обоих миров."
jap_jet_effort: "Реактивный самолет"
jap_jet_effort_desc: "В предложении японских исследователей был сделан вывод о том, что, двигая горячим воздухом, можно обеспечить тягу к самолётам, но это будет трудно исследовать."
jap_the_oka: "Ока"
jap_the_oka_desc: "Ока, также названный вишневым цветком, — это камикадзе, который может уничтожить любые конкурирующие военно-морские подразделения. Это оружие не только показывает нашу преданность войне, но и самому себе!"
jap_aichi_design: "Айти Дезинс"
jap_aichi_design_desc: "Айти - хорошо известная компания в армейских авиакомпаниях для их высококачественных бомбардировщиков, и, инвестируя в них, мы могли бы получить от них больше бомбардировщиков получше."
jap_CAS_modernisation: "Модернизация бомбардировщиков"
jap_CAS_modernisation_desc: "По сравнению с другими странами имперской японской армии не хватает бомбардировщиков погружения."
#Army
jap_expand_the_army: "Имперская армия"
jap_expand_the_army_desc: "Армия, защищающая нашу расширяющуюся Империю, не имеет необходимого количества войск."
jap_air_land_coop: "Сотрудничество в области воздушных наземных перевозок"
jap_air_land_coop_desc: "Сотрудничество между наземными силами и поддерживающими бомбардировщиками доказало свою эффективность в гражданской войне Испании."
jap_improve_pilot_training: "Совершенствование экспериментальной подготовки"
jap_improve_pilot_training_desc: "Так же, как и флот группы плохо подготовленных пилотов, наши пилоты-бомбардировщики обучаются без учета уроков Гражданской войны в Испании."
jap_specialised_cas: "Специализированные пилоты-бомбардировщики"
jap_specialised_cas_desc: "Наши пилоты-бомбардировщики в настоящее время учатся пилотировать как бомбардировщики, так и тактические бомбардировщики."
jap_strat_bomb_doctrine: "Стратегическая доктрина бомбардировок"
jap_strat_bomb_doctrine_desc: "Доктрина стратегических бомбардировок фактов противника, снижение их производительности, подорвет способность врага вести с нами затяжную войну, и, возможно, нам следует продолжать развивать такую доктрину."
jap_improve_bomber_training: "Совершенствование экспериментальной подготовки бомбардировщиков"
jap_improve_bomber_training_desc: "Наши летчики-бомбардировщики все еще учатся действовать с устаревшей тактикой, и мы модернизируем их подготовку для повышения эффективности бомбардировок."
jap_fighter_escort: "Сопровождение истребителя"
jap_fighter_escort_desc: "У наших бомбардировщиков сейчас нет эскорта, который мог бы защитить их через вражеских истребителей вблизи фронта."
jap_further_doctrinal_development: "Дальнейшая разработка документации"
jap_further_doctrinal_development_desc: "Новая доктрина, выбранная нашим ИДЖАФ, требует дальнейших экспериментов, чтобы наши пилоты могли более полно взглянуть на эту доктрину."
jap_imaaa: "Авиационная академия имперской армии"
jap_imaaa_desc: "Если ВМС могут иметь академию для дальнейшего развития, почему у армии тоже нет? Мы можем создать академию для ИДЖАФ, чтобы они могли работать с большим успехом."
jap_strat_bomber_modernisation: "Модернизация стратегических бомбардировщиков"
jap_strat_bomber_modernisation_desc: "Стратегические бомбардировщики, которые мы осуществляем, старые и устаревшие, и мы отправим контракт на новый стратегический бомбардировщик."
jap_speed_emphasis: "Упор на скорость"
jap_speed_emphasis_desc: "Упор на скорость, маневренность и прорыв может стать мощным фактором, способным положить конец конфликтам в течение нескольких недель."
jap_armored_warfare: "Боевые бронированные машины"
jap_armored_warfare_desc: "Наши сотрудники пришли к выводу о том, что танки — это путь вперед с дальнейшим развитием."
jap_armor_training_program: "Программа подготовки бронетранспортеров"
jap_armor_training_program_desc: "С учетом того, что наша армия все еще не участвует в совместной войне с оружием, мы будем осуществлять программы по дальнейшей интеграции этих танковых подразделений в обычные боевые действия."
jap_motorized_support: "Моторизованная поддержка"
jap_motorized_support_desc: "Благодаря постоянному повышению скорости танков, моторизованная пехота обладает наибольшим потенциалом в том, что касается наблюдения за этими подразделениями, мы создадим больше таких подразделений, с тем чтобы они могли обеспечить сиппорт для наших новых и более мобильных подразделений."
jap_mechanized_infantry: "Механизированная пехота"
jap_mechanized_infantry_desc: "Механизированные конструкции подразделений интересны в том, что они обеспечивают дополнительные доспехи для нашей пехоты, не принося в жертву полностью мобильность."
jap_training_war_game: "Военные тренировочные игры"
jap_training_war_game_desc: "Наши войска были ослаблены из-за отсутствия постоянных упражнений, и мы будем чаще проводить военные игры, чтобы они привыкли к войне и были менее измучены чистыми гарнизонами."
jap_further_doctrinal_experiments: "Дальнейшие док-эксперименты"
jap_further_doctrinal_experiments_desc: "Для того чтобы в полной мере реализовать свой потенциал, наши доктрины нуждаются в дополнительных экспериментах."
jap_planning_emphasis: "Основное внимание при планировании"
jap_planning_emphasis_desc: "Конечно, хорошо реализованный план может обеспечить успех, независимо от того, как сама ситуация развивалась."
jap_arms_modernisation: "Модернизация вооружений"
jap_arms_modernisation_desc: "Оружие - это опора пехоты, и наши Арисакас, будучи доверчивыми, падает по сравнению с другими новыми видами оружия, которые сейчас поставляются другими военными, и мы должны инвестировать в модернизацию вооружений, с тем чтобы мы не остались позади в гонке вооружений."
jap_teishin_shudan: "Тейшин Шудан"
jap_teishin_shudan_desc: "В настоящее время мы проводим небольшую битву, Тешин Шудан, группу элитных солдат, которые идут за линию врага, если мы объединим использование парашютов и самолетов, они могут стать элитной группой коммандос, работающей за линию."
jap_improve_military_training: "Совершенствование военной подготовки"
jap_improve_military_training_desc: "Если мы этого не сделаем, наши войска могут оказаться в невыгодном положении при борьбе с другими военными."
jap_improve_officer_training: "Подготовка сотрудников по вопросам повышения квалификации"
jap_improve_officer_training_desc: "Уроки великой войны были плодотворными, но мы только улучшили подготовку наших войск."
jap_cohesion_between_companies: "Сплоченность компаний"
jap_cohesion_between_companies_desc: "В настоящее время наши войска по-прежнему действуют менее согласованно, выступая в качестве независимых батальонов, чем фактические дивизии."
jap_warrior_spirit: "Воинский дух"
jap_warrior_spirit_desc: "Поощряя Бушидо в тренировке, наши войска будут поощряться к более агрессивной борьбе, или, по крайней мере, оставаться верными принципу "Смерть перед капитуляцией"."

##Diplomacy##

#GER DIPLOMACY
jap_friends_with_ger: "Приближайтесь к Берлину"
jap_friends_with_ger_desc: "Валькисты в Германии являются революционерами, несмотря на то, что они контролируют избитую нацию, дружелюбны ко многим странам вокруг них."
jap-ger_army_drills: "Упражнения немецко-японской армии"
jap-ger_army_drills_desc: "Поскольку Берлин с радостью принимает наше внимание к дружбе, и военные прорывы, которые имели немец в расширении своей армии, мы должны предложить военные учения для обмена знаниями."
jap_daimler-benz: "Установки двигателя &quot; Даймлер-Бенз &quot;"
jap_daimler-benz_desc: "Мы, вероятно, могли бы пригласить хорошо известного Даймлера-Бенза открыть фабрики на родных островах и еще больше улучшить нашу экономику."
jap_ger_tanks: "Дизайны немецких цистерн"
jap_ger_tanks_desc: "Расширение немецкой армии включает в себя многочисленные революционные конструкции танков, которые они приняли."
jap_friends_with_hol: "Поездка в Нидерланды"
jap_friends_with_hol_desc: "В то время как Нидерланды также обращаются к валькистским немцам, мы также должны стремиться к их принятию, чтобы найти больше союзников в Европе."
jap_suggest_tripartite: "Предлагаемый трехсторонний пакт"
jap_suggest_tripartite_desc: "В Японии наступили трудные времена, и сотрудничество с немцами дало бы нам дополнительную защиту от иностранных угроз."
jap_joint_tripartite_research: "Совместные трехсторонние исследования"
jap_joint_tripartite_research_desc: "Мы создадим совместный трехсторонний научно-исследовательский институт, который будет содействовать проведению исследований между членами Трехстороннего пакта."
jap_operations: "Проекты операций"
jap_operations_desc: "Мы начнем подготовку планов действий по планированию нападений на Америку и Великобританию, которые подпитыват нашу войну и станут нашим путеводителем в предстоящей войне."

#US DIPLOMACY
jap_end_of_sanfran_summit: "Конец встречи на высшем уровне в Сан-Франциско"
jap_end_of_sanfran_summit_desc: "После завершения встречи на высшем уровне в Сан-Франциско мы должны как можно скорее более тесно сотрудничать с Соединенными Штатами."
jap_us_tanks: "Американские конструкции цистерн"
jap_us_tanks_desc: "Американская доктрина пехоты и подавления огня очень сильна, и ее можно придерживаться."
jap_us_cv: "Совместные американо-японские военно-морские учения"
jap_us_cv_desc: "Благодаря более тесному сотрудничеству между нами и американцами мы начнем подготовку к военно-морским учениям с ними и будем совместно работать над новыми военно-морскими доктринами."
jap_us_joint_exercise: "Американско-японские совместные учения армии"
jap_us_joint_exercise_desc: "Мы соберем наши армии и проведем совместные учения."
jap_us_railway_invest: "Американские железнодорожные инвестиции"
jap_us_railway_invest_desc: "С плохой американской инфраструктурой мы определенно можем передать некоторые из наших методов и работать с ними в качестве жеста доброй воли."
jap_us_investors: "Американские инвесторы"
jap_us_investors_desc: "Американские инвесторы уже выкачивали много капитала в нашу страну."
jap_us_oil: "&lt; &lt; Американская нефть &gt; &gt;"
jap_us_oil_desc: "Американская нефть была одним из основных торговых ресурсов для нас. Мы попросим их получить технологию для синтетической нефти, над которой они проводят много исследований."

jap_combined_COSC: "Объединенный комитет начальников штабов"
jap_combined_COSC_desc: "Мы учредим Объединенный комитет начальника штаба для содействия обмену разведданными и развертыванию воинских подразделений."
jap_588_sulawesi_bombers: "588-е бомбардировщики &lt; &lt; Сулавеси &gt; &gt;"
jap_588_sulawesi_bombers_desc: "Есть добровольцы Сулавези, которые склонны помочь нам освободить свой народ в Британской Восточной Азии, мы создадим 588-й эскадрилью бомбардировщиков Сулавеси для добровольцев Сулавеси."
jap_SEA_bulwark: "Юго-Восточная Азия"
jap_SEA_bulwark_desc: "Мы будем выступать в роли азиатского «Булварка демократии» против британских империалистов, которые оккупируют остальные индонезийские острова."

#UK-CW DIPLOMACY
jap_alliance_eng: "Пакт о нейтралитете Хирота-Эдена"
jap_alliance_eng_desc: ""
jap_trade_agreement_empire: "Англо-японское торговое соглашение"
jap_trade_from_BEA: "Британская восточно-азиатская торговля"
jap_trade_from_BEA_desc: "В соответствии с англо-японским торговым соглашением мы пошлем некоторых должностных лиц для поиска торгового потенциала в британской колонии Восточной Азии."
jap_raj_metal_imports: "Импорт индийского металла"
jap_raj_metal_imports_desc: "Британская радж богата в своих металлических месторождениях, и они могут обеспечить нам стабильный источник металла."
jap_burmese_rubber_import: "Бирманский импорт каучука"
jap_burmese_rubber_import_desc: "Бирмский полуостров довольно богат каучуком, и мы должны рассмотреть вопрос о заключении с ними торговой сделки за предоставление нам каучука."
jap_trade_from_isles: "Транспортная торговля Великобритании"
jap_trade_from_isles_desc: "В соответствии с англо-японским торговым соглашением мы отправим некоторых должностных лиц для поиска торгового потенциала на британских островах."
jap_nzl_oil: "Импорт нефти в Новую Зеландию"
jap_nzl_oil_desc: "Новозеландская колония имеет немного нефти, и мы посмотрим, как заключить с ними сделку, чтобы нефть меньше зависела от только Американской нефти."
jap_australian_ore: "Австралийские закупки руды"
jap_australian_ore_desc: "Австралийская руда постоянно растет, мы купим немного для тестирования и, возможно, заключаем с ними сделку."
jap_australian_railway: "Австралийские железнодорожные инвестиции"
jap_australian_railway_desc: "Австралия, будучи столь обширной страной, в основном зависит от нескольких районов, и мы будем инвестировать в некоторые из ее железнодорожных проектов, с тем чтобы помочь им расширить и в полной мере использовать свою обширную землю."
jap_trade_from_australasia: "Торговля между Австралией и Новой Зеландией"
jap_trade_from_australasia_desc: "В рамках англо-японского торгового соглашения мы пошлем некоторых должностных лиц для поиска торгового потенциала в британских колониях Австралии и Новой Зеландии."
jap_eng_radar: "Английская радиолокационная технология"
jap_eng_radar_desc: "Английская радиодиагностика опережает весь остальной мир, и мы должны попытаться заключить сделку о передаче технологии, которая поможет нам в предстоящем конфликте."
jap_british_investment: "Британские экономические инвестиции"
jap_british_investment_desc: "В 1920-е годы британцы накачивали нашу страну миллионами людей, и, по мере роста, они, скорее всего, готовы и дальше инвестировать в дружественную нацию."
jap_eng_company: "Привлечь английские компании"
jap_eng_company_desc: "Усилия по привлечению англоязычных компаний из британских хоумлендов на японские острова были в какой-то степени плодотворными в период между войнами."
jap_indian_railroad: "Индийская железнодорожная инициатива"
jap_indian_railroad_desc: "В 1935 году индийское восстание разрушило железные дороги, и мы предложим им инициативу по совершенствованию и восстановлению их железных дорог."

jap_JCOSC: "Объединенный комитет начальников штабов"
jap_JCOSC_desc: "Мы учредим Объединенный комитет начальника штаба для содействия обмену разведданными и развертыванию воинских подразделений."
jap_panay_incident: "Происшествие паней"
jap_panay_incident_desc: "С прохождением инцидента в Панае мы еще не приняли решения о его урегулировании."
jap_british_naval_tactics: "Британские военно-морские тактики"
jap_british_naval_tactics_desc: "Британцы всегда были пионерами в военно-морских доктринах."

#INTERNATIONAL
jap_internal_stabilization: "Инцидент, связанный с праведными вооруженными силами"
jap_internal_stabilization_desc: ""Инцидент правой армии" - это военный переворот, произошедший через четыре дня после крушения Лондонского фондового рынка после того, как группа экстремистских офицеров, названная "праведной армией", восстала против самой демократии."
jap_constitutional_crisis: "Конституционный кризис"
jap_constitutional_crisis_desc: "В связи с инцидентом, произошедшим в Армии праведных, мы видим, что без согласия императора на армию у демократического правительства очень мало власти."
jap_the_admiral_plot: "Полотно адмиралов"
jap_the_admiral_plot_desc: ""Плоть адмирала" - это переворот военно-морского флота, который видит, как они захватывают парламент."
jap_the_army_coup: "Армейский переворот"
jap_the_army_coup_desc: "Переворот армии осуществляется армией, после того, как она была воодушевлена инцидентом с праведной армией, которые не были полностью подавлены."
jap_assert_asian_dominance: "Ассерт Азиатский Доминант"
jap_assert_asian_dominance_desc: "Учитывая, что один из военных контролирует правительство, мы начнем стабилизировать нашу страну против последствий кризиса на Лондонском фондовом рынке и для будущего расширения."
jap_iraa: "Фонд ИРАА"
jap_iraa_desc: "Имперский Дом Японии находится у власти с 660 года до н. э., но в последнее время его способность объединять людей под монархией ухудшилась."
jap_ally_the_military: "Военный альянс"
jap_ally_the_military_desc: "С одной ветвью власти, другая определенно будет проигнорирована, и мы будем поощрять союз между ними на благо страны."
jap_united_under_the_emperor: "Божественное право"
jap_united_under_the_emperor_desc: "Император как потомок богов Японии очень важен, с либерализацией нашей страны божественное право императора уменьшается, мы восстановим значимость нашего императора и подтвердим его божественность."
jap_all_hail_hirohito: "Приветствую вас, Хирохито."
jap_all_hail_hirohito_desc: "С возвращением императора в качестве главы государства Японии мы будем и дальше поощрять преданность его величеству, который будет приветствовать его как великого монарха."
jap_jap_militarism: "Японский милитаризм"
jap_jap_militarism_desc: "Бушидо был одним из основных факторов, влияющих на наших военных, и мы будем и впредь поддерживать Бушидо и идею военнослужащих."
jap_revitalization_by_force: "Активизация деятельности сил"
jap_revitalization_by_force_desc: "Теперь, когда наша страна радикализована, мы можем подпитывать нашу активизацию гораздо легче."
jap_the_second_meiji: "Вторая Мэйдзи"
jap_the_second_meiji_desc: "Император Мэйдзи был одним из величайших императоров, которые у нас были."
jap_nat_eco: "Политика национализации"
jap_nat_eco_desc: "Слишком долго Зайбацу и иностранные империалисты обманывали и эксплуатировали наш народ ради его личной выгоды."
jap_nat_zai: "Национализируй Зайбацу"
jap_nat_zai_desc: "После восстановления Мейдзи и последующей вестернизации Зайбацу был сердцевиной экономической и промышленной деятельности в Японии, они оказывают большое влияние на внутреннюю и внешнюю политику. Имперская армия всегда выступала против влияния Зайбацу и работала над его ликвидацией. Теперь, когда они эффективно контролируют страну, армия может национализировать все основные силы Зайбацу и уничтожить их влияние."
jap_nat_air: "Национализация авиационной промышленности"
jap_nat_air_desc: "Все производители военных летательных аппаратов должны быть национализированы и реорганизованы в арсеналы или объединены в контролируемые военными фабрики."
jap_nat_ind: "Национализация тяжелой промышленности"
jap_nat_ind_desc: "После распада и национализации Зайбацу мы контролируем большую часть тяжелой промышленности страны, но не все. Некоторые компании находятся ниже уровня Зайбацу, но все же являются крупными фирмами. Для достижения полного государственного контроля потребуется национализировать их."
jap_zaibatsu_problem: "Проблемы с Зайбатсом"
jap_allow_marshall_law: "Позволить военному праву"
jap_allow_marshall_law_desc: "С приближением ЛМСК мы должны немедленно дать разрешение на военные действия, чтобы успокоить многочисленные забастовки и мелкие мятежи неоплачиваемых работников."
jap_suppress_worker_rebellion: "Пресекая сопротивление со стороны работников"
jap_suppress_worker_rebellion_desc: "Эти восстания рабочих наносят гораздо больший ущерб нашему валовому внутреннему продукту, чем LSMC. Мы заставим этих рабочих работать снова немедленно."
jap_combat_the_red_threat: "Бороться с красной угрозой"
jap_combat_the_red_threat_desc: "Мы арестуем этих лидеров и запретим их партии."
jap_korean_problem: "Корейская проблема"
jap_korean_problem_desc: "Корея не была полностью интегрирована, несмотря на их раннюю аннексию в начале 1910-х годов."
jap_great_pacific_jewel: "Великая тихоокеанская драгоценность"
jap_great_pacific_jewel_desc: "Поскольку в нашей стране преобладает демократия, мы можем полностью претендовать на титул «Великой тихоокеанской драгоценности»."
jap_seek_loyal_ministers: "Искать верных служителей"
jap_seek_loyal_ministers_desc: "С большим количеством министров, выступающих против демократического правительства, мы заменим их более лояльными министрами, через партийные линии."
jap_new_constitution: "Новое порицание"
jap_new_constitution_desc: "Поскольку конституция Мэйдзи начинает демонстрировать свои недостатки, мы немедленно начнем разработку новой и усовершенствованной конституции."
jap_army_under_the_parliament: "Армия под руководством парламента"
jap_army_under_the_parliament_desc: "Армия, во имя стабильности, навсегда будет находиться под командованием парламента с королевского согласия императора."
jap_economic_devaluation_act: "Закон о нумистической оценке"
jap_economic_devaluation_act_desc: "Наша валюта стоит очень дорого, чтобы поддерживать обменный курс, и мы обесценим его и освободим больше денег для нас."
jap_military_contracts: "Контракты с имперской армией"
jap_military_contracts_desc: "Один из способов вернуть это заказать военную технику. Давайте начнем с аренды армейской техники."
jap_the_great_recovery: "Великое восстановление"
jap_the_great_recovery_desc: "Мы полностью оправились от LSMC!"
jap_bur_eco: "Бюрократическая экономика"
jap_bur_eco_desc: "Правительство решило реформировать экономику, чтобы она регулировалась бюрократической структурой, которая призвана ограничить власть Зайбацу и увеличить выгоды для государства."
jap_bur_car_1: "Интеграция иностранных автотранспортных компаний"
jap_bur_car_1_desc: "На японском автомобильном рынке всегда доминировали западные автопроизводители, что привело к глубокому дефициту торгового баланса."
jap_bur_car_2: "Регулирование автомобильной промышленности"
jap_bur_car_2_desc: "На протяжении 1920-х и 1930-х годов производство автомобилей в Японии было слишком малым, чтобы конкурировать во всем мире."
jap_bur_resources: "Реорганизовать извлечение ресурсов"
jap_bur_resources_desc: "С ростом напряженности во всем мире жизненно важно, чтобы добыча наших ресурсов происходила эффективно и быстро."
jap_bur_train: "Предложение Синкансена"
jap_bur_train_desc: "Настало время принять предложение Шинкансена: создать подсоединенный набор высокоскоростных железных дорог, а затем объединить их с новыми паровыми и электрическими локомотивами."
jap_arrest_the_traitor: "Арестовать предателей"
jap_arrest_the_traitor_desc: "Поскольку министрам армии и военно-морского флота нельзя доверять, мы арестуем тех, кто связан с заговорами против демократического правительства."

#Menace Across The Sea
jap_menace_across_the_sea: "Угроза через море"
jap_menace_across_the_sea_desc: "Американцы прокляты в своем положении, будучи одним из главных противников против нас."
jap_secure_our_place: "Охраняйте наше место"
jap_secure_our_place_desc: "Мы, наконец, официально присоединимся к Альянсу Императорской защиты и обеспечим наше место в этом альянсе как силы и оплошности в Восточной Азии."
jap_join_the_ISC: "Присоединяйтесь к МСК"
jap_join_the_ISC_desc: "Имперский научный совет - это совет, который может помочь нам в технологическом развитии."
jap_for_the_empire: "Для Империй!"
jap_for_the_empire_desc: "Теперь наше население должно принять обе наши цели войны, а также поддержать Британскую империю в предстоящей войне."
jap_operation_eagle_hunter: "Операция &lt; &lt; Охотник за орлом &gt; &gt;"
jap_operation_eagle_hunter_desc: "С уверенностью в том, что война против Соединенных Штатов будет вестись, мы будем готовиться к войне, разрабатывая против них операции."
jap_manila_bay_attack: "Нападение на залив Манилы"
jap_manila_bay_attack_desc: "Нападение на Манилу-Бей сможет подорвать филиппинское правительство и шокировать американцев достаточно долго, чтобы укрепить наше превосходство в Тихом океане."
jap_phi_funding: "Фонд терроризма на Филиппинах"
jap_phi_funding_desc: "Чтобы не вспыхнуть война между Соединенными Штатами и Японией, умным способом обхода является тайное финансирование террористических организаций в штате Филиппины, которые хотели бы быть независимыми от Соединенных Штатов."
jap_secure_the_philippines: "Филиппины"
jap_secure_the_philippines_desc: "Остров Филлиппина находится непосредственно в Сулавеси, чтобы перехватить наше имущество, и мы начнем планировать шаги по обеспечению безопасности островов, с тем чтобы защитить наше имущество."
jap_south_asia: "Южная Азия"
jap_south_asia_desc: "Наша империя не нуждается в прямом контроле над Индонезией."
jap_exploit_the_colonial_resources: "Эксплуатация колониальных ресурсов"
jap_exploit_the_colonial_resources_desc: "Индонезийские острова очень богаты нефтью, каучуком и некоторыми металлами."
jap_free_from_the_imperialists: "Свободные от империалистов"
jap_free_from_the_imperialists_desc: "Мы распространим слова о том, что они свободны от империалистического запада в освобожденных колониях империй."

#Great Pacific Treaty
jap_great_pacific_treaty: "Великий тихоокеанский договор"
jap_great_pacific_treaty_desc: "Великий тихоокеанский договор является договором о согласовании Японии с Америкой и против Великобритании и ее империи."
jap_finalise_treaty: "Завершение работы над Договором"
jap_finalise_treaty_desc: "Завершение работы над Великим Тихоокеанским договором должно произойти сейчас или никогда, прежде чем Америка изменит свое мнение и сорвет наши планы."
jap_fuel_anti_british_sentiment: "Антибританская сенсибилизация топлива"
jap_fuel_anti_british_sentiment_desc: "С учетом того, что мы объединяем себя с американцами, мы начнем подпитывать антибританские настроения, чтобы вскоре начать войну с британцами."
jap_coop_americans: "Сотрудничество с Америкой"
jap_coop_americans_desc: "Мы должны полностью сотрудничать с американцами, чтобы увеличить наши шансы против угрожающих британцев."
jap_establish_CCS: "Создание объединенного руководителя аппарата"
jap_establish_CCS_desc: "Создание объединенного начальника штаба улучшит положение нашего подразделения, улучшит обмен разведывательными данными между нами и поможет нам еще больше координировать боевые миссии."
jap_operation_kingslayer: "Операция &lt; &lt; Убийца короля &gt; &gt;"
jap_operation_kingslayer_desc: "С началом войны против Британской империи мы немедленно начнем планировать крупные операции против англичан."
jap_strike_BEI: "Удар по Британской Ист-Индии"
jap_strike_BEI_desc: "Мы атакуем и обеспечим безопасность Британской Ист-Индии, чтобы обеспечить там ценные ресурсы и подстегнуть голод нашей империи к ресурсам."
jap_fund_terrorism_in_singapore: "Фонд терроризма в Сингапуре"
jap_fund_terrorism_in_singapore_desc: "Чтобы убедиться, что война между Британской империей и Японией не вспыхнет, умным способом обхода является тайное финансирование террористических организаций на Малайанском полуострове, которые хотели бы быть независимыми от Британской империи."
jap_cut_off_british_supply_lines: "Запрещенные британские линии снабжения"
jap_cut_off_british_supply_lines_desc: "Мы должны изолировать тихоокеанские владения Британской империи, чтобы они могли контролироваться нами."

#Institution of Subjugation
jap_begin_subjugation: "Институт порабощения"
jap_begin_subjugation_desc: "С стабилизацией нашей страны мы начнем порабощать другие близкие нам страны, поскольку мы соберем их ресурсы, которыми они владеют, для нашей собственной компенсации в результате кризиса на Лондонском фондовом рынке."
jap_nanshinron: "Нансхинрон"
jap_nanshinron_desc: "Нансхинрон, или доктрина расширения южной части страны, пользуется поддержкой ВМС, чтобы расширить и покорить колонии Запада, от американских Филиппин до Британской Малайи и французской Индокитая, мы можем нанести удар по этим территориям за их ресурсы."
jap_hokushinron: "Гокушинрон"
jap_hokushinron_desc: "Хокушинрон, или доктрина северного расширения, пользуется поддержкой армии, чтобы расширить и забрать ресурсы обширной сибирской земли и бороться с советской красной угрозой с помощью Белого российского правительства."
jap_balanced_doctrine: "Сбалансированная доктрина"
jap_balanced_doctrine_desc: "Демократическое правительство предпочитает сбалансированную доктрину захватить богатые ресурсами колонии Запада и все же бороться с советской Красной Менацей."
jap_demand_beiyang_submit: "Спрос на представление Фенгтианского доклада"
jap_demand_beiyang_submit_desc: "По мере того, как в пятой войне между Фенгтианом и Чжили победила власть Фенгтиана, они неоднократно спровоцировали нас, и настало время для нас противостоять таким актам агрессии и взять под свой контроль Манчжурию, богатую сталью."
jap_demand_zhili_submit: "Спрос на представление Жили"
jap_demand_zhili_submit_desc: "С появлением Жили победил в пятой войне Бейян-Чили, они спровоцировали нас несколько раз, из-за"accidental" bombardments of our military bases to the numerous border clashes in Manchuria. It is time to stand up to these acts of aggression!"
jap_expand_kwantung: "Расширить армию Квантуна"
jap_expand_kwantung_desc: "Армия Квантуна, отвечающая за защиту оккупации Манчжурии, доказала, что она испытывает нехватку войск, и мы предоставим им дополнительные средства для надежной защиты наших войск."
jap_operation_rivalry: "Операция &lt; &lt; Ревалерия &gt; &gt;"
jap_operation_rivalry_desc: "Более свободным местом для нас является Индокитийский район, и мы начнем подготовку операции по захвату этого района."
jap_strike_indochina: "Удар индохита"
jap_strike_indochina_desc: "Приготовившись к операции, мы скоро начнем готовиться к захвату Индокита."
jap_three_musketeers_i_mean_indochinese_bros: "Три индокитайских брата"
jap_three_musketeers_i_mean_indochinese_bros_desc: "Индокитийский полуостров раньше управлялся Лаосом, Вьетнамом и Камбоджей, и мы позволим им сотрудничать с нами в управлении этим полуостровом."
jap_pressure_siam: "Давление сиамского короля"
jap_pressure_siam_desc: "Мы будем давить на сиамского короля, чтобы он подчинился нашей воле и помог нам в будущем нападении на французскую Индокитую."
jap_shanghai_incident: "Инцидент с наконечником"
jap_shanghai_incident_desc: "Растущие антияпонские настроения в Китае возрастают после первой китайско-японской войны и заканчиваются инцидентом с Нанкином."
jap_defeat_cliques: "Подавить клики"
jap_defeat_cliques_desc: "С китайскими националистами, находящимися под нашим контролем, мы объединим расколотый Китай, контролируемый Кликсом, под контролем нашего кооперативного правительства."
jap_korean_project: "Корейский проект"
jap_korean_project_desc: "С ископацией Кореи мы начнем проект вокруг корейцев, чтобы показать, что мы заботимся о них."
jap_chinese_project: "Китайский проект"
jap_chinese_project_desc: "Китайский проект - это план, который позволит сохранить под нашим контролем китайское корабльское правительство."
jap_three_race_coprosperity: "&quot; Три расы-сопровождение &quot;"
jap_three_race_coprosperity_desc: "При сотрудничестве Китая и Кореи мы должны обеспечить, чтобы работа с нами процветала или чтобы они могли легко уйти."
jap_promote_koreans: "Поощрять корейских военнослужащих"
jap_promote_koreans_desc: "Мы будем продвигать идею корейских военных и станбализировать корейцев, с тем чтобы они не изгоняли корейцев, которые служат нам."
jap_korean_army: "Корейская национальная армия"
jap_korean_army_desc: "Поскольку останки армии Избранной Империи все еще здесь, мы создадим Корейскую национальную армию, завербовав останки."
jap_chinese_air: "Китайские республиканские военно-воздушные силы"
jap_chinese_air_desc: "Китайские военно-воздушные силы - отсталые и старые, у них нет никого, кто мог бы поддержать их в модернизации."
jap_chinese_army: "Создать армию Чинсай"
jap_chinese_army_desc: "Армия Чинсай станет силой гарнизона полуострова Шаньси-Шандонг и будет защищать владение."
jap_standardize_army: "Стандартизировать ополчения"
jap_standardize_army_desc: "Нерегулярные формирования, принадлежащие китайцам, не стандартизированы и не могут в полной мере сражаться с другими подразделениями."
jap_war_for_prosperity: "Война за процветание"
jap_war_for_prosperity_desc: "Война должна быть надлежащей поддержкой в рамках режима сотрудничества, и мы будем распространять пропаганду в целях поддержания стабильности в нашем имуществе."
jap_ally_the_whites: "Альянс с белыми"
jap_ally_the_whites_desc: "Мы предложим союз с Белым Русским правительством, которое будет определенно счастливо сотрудничать с нами в борьбе с советской Красной угрозой."
jap_yakutsk_incident: "Якутскский инцидент"
jap_yakutsk_incident_desc: "Мы начнем провоцировать Советы, сначала провоцируя пограничные конфликты на границе между белыми и советскими."
jap_assist_white: "Помощь белым"
jap_assist_white_desc: "Белые русские - неудачники в борьбе против Советов, мы будем помогать белым в борьбе, предоставляя промышленную поддержку."
jap_topple_commies: "Подавить коммунистическую угрозу"
jap_topple_commies_desc: "Армия, наконец, взяла на себя обязательства против красных."
jap_unite_against_red: "Объединимся против красных"
jap_unite_against_red_desc: "Сейчас, когда красные воевали с нами, мы должны содействовать единству дома для того, чтобы разжечь долгую войну."
jap_dominant_white: "Доминирование белых"
jap_dominant_white_desc: "Доминирование белых русских нельзя недооценивать, и мы будем поощрять их доминирование."
jap_russo_japan_ally: "Руссо-японская совместная деятельность"
jap_russo_japan_ally_desc: "С поддержкой альянса мы будем продвигать идею русско-японского альянса за процветание и борьбу против Советов."

