japfadingsunpeace.230.d.no_taiwan: ""


 japfadingsunpeace.231.t.peace: "Мир с Китаем"
japfadingsunpeace.230.d.taiwan_kept: "Наша долгая и ожесточенная борьба, наконец, нарушила волю врага! [От Гетнама], увидев, как их армии разрушаются на материке и их марионетки капитулируют, послали нам отчаянный призыв к миру. Они предлагают уйти со всех континентальных районов Китая, отказаться от своих притязаний и освободить Корею и других своих подданных в регионе. ~ no note, их предложение приходит с одним главным условием: они настаивают на сохранении контроля над Тайванем, который, по их мнению, является неотъемлемой частью их империи на протяжении десятилетий. Можем ли мы принять мир, который оставляет часть Китая в их руках, или нам следует добиваться полной победы?"

japfadingsunpeace.230.d.taiwan_handed_over: "Победа близка! Наши неустанные наступательные действия в сочетании с полным крахом их военно-морских сил и тяжелой ситуацией на их родных островах заставили [из Гетнама] вернуться за стол переговоров. Они послали нам предложение о том, что можно считать безоговорочной капитуляцией в нашем театре. Они согласились уйти из всего материкового Китая, освободить Корею и, что важнее всего, уступить Тайвань китайскому суверенитету. Их амбиции на нашем континенте здоровы и по-настоящему мертвы. Остался только один вопрос: принять их капитуляцию или нанести последний смертельный удар."

japfadingsunpeace.230.d.taiwan_occupied: "Мы сделали это! [От Гетнама] потерпели поражение! Их войска на материке полностью отступили или были уничтожены, и их правительство направило нам срочную просьбу о мире. Они предлагают отказаться от всех притязаний на материк и освободить Корею. Несмотря на то, что вопрос о Тайване является спорным вопросом, наши силы уже приземлились и обезопасили остров, отняв его от своего контроля. Японцы не в состоянии оспорить это. Мы должны теперь решить, официально ли оформить эту победу мирным договором или продолжить войну до тех пор, пока не разорвется вся их империя."

japfadingsunpeace.230.d.no_taiwan: "Японская военная машина сломана! После многих лет жестокого конфликта [от Гетнама] признала поражение в Китае, их армии разрушены, их марионетки рухнули, и их правительство требует мира, они предлагают полный уход с материка и освобождение Кореи и всех других континентальных подданных, с их амбициями в Китае полностью разрушены, теперь они призывают к прекращению кровопролития, мы должны решить, предоставить ли им эту милость или надавить на нашу выгоду ради полной победы."

 japfadingsunpeace.231.a: "Война не всегда развивалась в интересах Японии."

 japfadingsunpeace.231.t.no_peace: "Мирные переговоры были отвергнуты"
 japfadingsunpeace.231.b: "Похоже, это жизнь или смерть."
 japfadingsunpeace.231.d.peace_taiwan_kept: "Правительство приняло наши условия! Разрушительная война в Китае, наконец, закончилась. Мы согласились полностью уйти с материка и признать независимость Кореи и других наших бывших подданных. Наши притязания на континент больше не более. Несмотря на милость императора, и, возможно, из-за их собственного истощения, они согласились позволить нам сохранить контроль над Тайванем. Хотя наши амбиции были сорваны, нам удалось обеспечить мир и сохранить часть нашей империи. Теперь мы должны сосредоточиться на восстановлении и защите родины."

japfadingsunpeace.231.d.peace_taiwan_handed_over: "Правительство приняло наши условия! Разрушительная война в Китае наконец закончилась. Мы согласились на полный уход с материка, освобождение Кореи и возвращение Тайваня в Китай. Наши континентальные амбиции закончились полным провалом. Несмотря на жесткие условия, Император рад, что мир обеспечен. Кровавое кровопролитие закончилось, и родина теперь в безопасности от вторжения. Империя должна заглянуть внутрь и поразмыслить над этой катастрофой."

japfadingsunpeace.231.d.peace_taiwan_occupied: "Правительство приняло наши условия! Разрушительная война в Китае наконец закончилась. Мы согласились на полный уход с материка и освобождение Кореи. Наши притязания на континент уже не более."

japfadingsunpeace.231.d.peace_no_taiwan: "Правительство приняло наши условия! Разрушительная война в Китае наконец закончилась. Мы согласились полностью уйти с материка и признать независимость Кореи и других наших бывших подданных. Наши притязания на континент больше нет. Несмотря на то, что наши амбиции были сорваны, нам удалось обеспечить мир. Теперь мы должны сосредоточиться на восстановлении и защите родины от наших других врагов."

japfadingsunpeace.231.d.no_peace: "Наши мирные инициативы были отвергнуты. Несмотря на наши катастрофические потери на материке, враг отказывается вести переговоры. Похоже, что все стороны привержены полной войне, независимо от ее стоимости. Император встревожен, и правительство находится в смятении. Не будет отдельного мира. Теперь мы должны подготовиться к долгой и ужасной войне, войне, которая может не закончиться до тех пор, пока наша нация не будет разрушена."
japfadingsunpeace.231.a: "Горький, но необходимый мир."

japfadingsunpeace.231.b: "Они пожалеют об этом дне."

japfadingsunpeace.232.t: "Конец второй китайско-японской войны."

japfadingsunpeace.232.a: "Мы - новая великая держава в Азии!"

japfadingsunpeace.232.d: "Договор подписан! [От Гетнама] официально капитулировал, прекратив свою ужасную войну на нашей земле. Их силы должны уйти со всех китайских территорий, их марионеточные правительства распускаются и гарантируется независимость Кореи. После многих лет невыразимых страданий и героического сопротивления Китай наконец добился победы. Хотя цена крови и сокровищ огромна, наш народ свободен от японского ярмо. Теперь может начаться трудная задача восстановления нашей разрушенной нации."

 japfadingsunpeace.233.t: "[FROM. GetNameDefcap] Отказывает в мире"
 japfadingsunpeace.233.d: "Наш отчаянный призыв к миру был встречен с презрением. [От Гетнама] отверг наше предложение, поклявшись продолжать войну до тех пор, пока мы не будем полностью уничтожены. Их высокомерие поразительно! Разве они не видят глупости в этом бесконечном кровопролитии?"
 japfadingsunpeace.233.a: "Мы будем драться до последнего человека."

 japfadingsunpeace.238.t: "Япония просит мира"

japfadingsunpeace.238.d: "После своего катастрофического поражения в Китае японское правительство стремится ликвидировать свои активы на материковой части Азии и обеспечить с нами мир. Они предлагают сдать все свои северные территории, включая Сахалин и Курильские острова, и признать наши требования в регионе в обмен на немедленное прекращение военных действий. С их основной армией они явно отчаянно стремятся избежать многосторонней войны. Это соблазнительное предложение вернуть наши утраченные территории без дорогостоящей борьбы, но отказ может позволить нам еще больше отнять у их развалившейся империи."

japfadingsunpeace.238.a: "Мы принимаем их условия."

japfadingsunpeace.238.b: "Нет, мы увидим, как они раздавятся."

 japfadingsunpeace.239.t: "Мир вам!"

japfadingsunpeace.239.d: "Правительство приняло наше мирное предложение! Война на севере окончена. Мы согласились уступить Сахалину, Курильским островам и любым другим территориям, на которые они претендуют, по сути прекратив наше присутствие в регионе. В обмен на это [от Гетнама] подписал пакт о ненападении и прекратит все боевые действия. Это горит цена, но это освободило наш северный фланг и позволило нам сконцентрировать наши остающиеся силы на врагах, которые все еще ищут нашего уничтожения. Один пожар был потушен, но дом все еще горит."

japfadingsunpeace.239.a: "Необходимая жертва."

 japfadingsunpeace.240.t: "Мир с Японией"

japfadingsunpeace.240.d: "Договор подписан! [От Гетнама] официально уступил Сахалину, Курильским островам и всем другим территориям, на которые мы претендуем. Их колониальные амбиции на Дальнем Востоке были полностью сорваны. Это знаменательная победа для нашей нации, восстановление наших законных границ и обеспечение безопасности нашего восточного фланга без необходимости длительного и кровопролитного вторжения. Теперь мы можем полностью обратить наше внимание на другие вопросы, безопасные в нашем триумфе."

japfadingsunpeace.240.a: "Большая победа для Родины!"

 japfadingsunpeace.241.t: "Отказывает в мире!"

japfadingsunpeace.241.d: "Русские отказались от нашего великодушного мирного предложения! [От Гетнама] отвергли наши условия, предпочтя продолжить войну, несмотря на наши уступки, кажется, что их жадность не знает границ, это серьезный провал, мы надеялись обезопасить нашу северную границу, но теперь, кажется, мы должны сражаться на всех фронтах. Так тому и быть, Империя не будет запугана этими варварами!"

japfadingsunpeace.241.a: "Варвары, с ними разберутся."

 japfadingsunpeace.251.t: "Падение Японии"

japfadingsunpeace.251.d: "Война окончена. Теперь мы, стоявшие вместе с Японией, остались в стороне только победившим союзникам. Наше правительство должно немедленно решить новый курс. Мы сдаёмся победителям или будем сражаться в безнадежной последней позиции?"

japfadingsunpeace.251.a: "Мы сами по себе..."

 japfadingsunpeace.252.t: "Японцы сдаются!"

japfadingsunpeace.252.d: "Отчёты из Токио подтверждают, что японская империя безоговорочно сдалась союзным державам, положив конец разрушительной войне в Тихом океане. Документ о капитуляции был подписан после серии катастрофических военных поражений, завершившихся полным провалом японских военных усилий. ~nnn'The Foding Sun's знаменует собой окончание эпохи японского милитаризма, которая погрузила Азиатско-Тихоокеанский регион в тьму. Победившие столицы мира отмечают окончание конфликта, в то время как побежденная японская родина стоит перед мрачным и неопределенным будущим под союзной оккупацией. Мир изменился, и теперь начинается долгий путь к восстановлению."
 japfadingsunpeace.252.a: "Солнце исчезло."

japfadingsunpeace.253.d: "Японская военная машина, когда-то казалось неуязвимая, была разрушена в Китае. Их долгая, жестокая кампания на материке закончилась катастрофическим поражением. Они надеются, что их поражение в Китае удовлетворит наши военные цели, позволив им укрепить свои остающиеся силы и избежать полного уничтожения. Они предлагают нам мир... но должны ли мы принять их условия или нажать на нас наше преимущество и увидеть это до горького конца?"

jap.0.t: "Восходящее солнце"
jap.0.d: "В то время как другие страны были сожжены во время Великой войны, начало XX века было благословением для Японии. Власть над многими бывшими мирными территориями Германии, Япония постоянно поднимается в центре внимания на мировой арене. Несмотря на то, что дрожь страны в демократии все еще нова, и многие хотят ее испортить, чтобы она соответствовала их желаниям. Многие фермеры борются со стремительными темпами модернизации, а неравенство доходов взорвалось. Зайбацу, японские гигантские конгломераты, продолжают подавлять храбрость и инновации. Это был золотой век для Японии, но если не будут предприняты быстрые действия, стагнация может проклясть нас. Пусть Император наблюдает за нами всеми."
jap.0.a: "Теннехейка Банзай!"

jap.1.d.0: "Со времени первой китайско-японской войны Корея находится под нашим влиянием, а в 1910 году она была аннексирована в нашу Империю под непосредственным управлением."

jap.2.d.0: "По мере приближения пятой войны Фенгтьена-Чили японские интересы в Китае заставляют нас поддерживать одну из двух клик, Жили или Фенгтиан. Одна из них победит в войне, так что мы должны помочь одному из них в их окончательном завоевании, чтобы защитить наши интересы. Теперь мы поддерживаем клику Жили, чью армию снова и снова доказали, но ей не хватает промышленной мощи ее соседей, или финтийской управляющей власти, чей район богат металлом и владеет большей частью Манчжурской железной дороги?"

jap.3.d.0: "После крушения Лондонского фондового рынка у нас теперь есть серьезный торговый дефицит, поскольку никто не может купить нашу продукцию."

jap.9.d: "Наиболее беспокойные пять дней в Британской империи с начала Великой войны наступили, поскольку фондовые рынки империи радикально изменились из-за боязни неспособности получить ресурсы и товары со всех уголков Империи. Из-за этого многие британские инвесторы сняли с себя свои японские активы и вызвали панику на наших собственных фондовых рынках. Не говоря уже о банкротстве довольно нескольких японских торговых партнеров, что нанесло ущерб нашей экономике. Кто знает, что произойдет из-за этого?"

jap.11.d: "6 сентября 1936 года в результате военной фракции, постоянного соперничества с правительством и недавнего крушения Лондонского фондового рынка был совершен государственный переворот, в основном с участием молодых радикальных офицеров имперской армии Японии, и их цель состоит в ликвидации идеологических соперников, социальных консерваторов. Многие члены оппозиционной партии утверждают, что любые жестокие военные действия против небольшой армии приведут к развязыванию мятежа в армии и могут привести к гражданской войне. Мы должны действовать осторожно, чтобы не навредить ни одной из сторон."

jap.12.d: "С полками Имперской гвардии, направленными на подавление восстания, была уничтожена праведная армия! Последний из командиров праведной армии был казнен. Праведная Армия смогла лишь убить нескольких политических деятелей, а также оккупировать правительственный центр Токио на некоторое время. Многие граждане поблагодарили армию, которая пришла и справилась с этими предателями без милосердия. Это довольно разочаровывающее сопротивление, возможно, доказало двум ветвям, что мы разрушим любые мятежи, но многое еще нужно сделать, прежде чем это произойдет."

jap.13.d: "Были названы мирные переговоры, а именно: объединение военных группировок было прекращено, но за счет некоторых политических министров правящего правительства, и в конце концов японская жизнь не была потеряна, и в целом был нанесен минимальный ущерб."

jap.14.d: "Только что, наши военно-морские учения недалеко от Манилы, столицы Филлипинцев, достигли настоящей цели - неожиданное нападение как на филиппинские, так и на американские военные базы и мы победили! Президент Филлипинцев безумец, и американский президент шокирован нашим смелым налетом. Мы выиграем эту войну против империалистических иностранцев!"

jap.15.d: "Вчера японские самолеты напали на филиппинские военные базы и американское посольство! И мы, и Филипинцы с ума сходили. И американская и филиппинская общественность безумны и просят о войне! Филипинцы уже воевали с японцами, оставляя только нас, Соединенные Штаты Америки, не воюют. Наша реакция будет быстрой и смертельной, и сотрет эту бесчестную империю с лица мира!"

jap.16.d: "С созданием Имперской ассоциации помощников правителей, они начали обсуждение проблемы заибатсу. Эти заибаты являются крупными конгломератами, и каждый из них владеет важной частью нашей экономики и промышленности. Но по мере расширения их влияния они начинают влиять на политику нашего правительства, возможно, слишком сильно. Теперь мы должны решить, начать ли распускать Зайбацу или не позволить им полностью войти в политическую сферу. Либо поможет нам достичь нашей цели, но мы должны решить сейчас, или никогда."

jap.17.d: "Несколько дней назад американский катер USS Panay стрелял по японским кораблям, которые участвовали в обычных учениях по военно-морскому оружию. Капитан USS Panay сказал, что они думали, что корабли стреляли в гневе, а не в упражненном. Хотя никто не пострадал, инцидент доказал, что не только американское и японское правительство не доверяют друг другу, даже военные обеих стран выполняют одно и то же. Сейчас мы ждем, пока диета и парламент не согласится с жалобой американского правительства."

jap.18.d: "С ростом антияпонских настроений в Китае граждане Нанкина напали на многих японских бизнесменов, уничтожили и разгромили собственность, принадлежащую японцам, включая поджог фабрики &quot; Саню &quot; . Спровоцировался всплеск антиимпериалистических настроений и также начались протесты против бойкота японских товаров и отмены концессий на Японию. В то время как китайское националистическое правительство утверждает, что это было сделано японскими агентами, независимо от этого, то, что мы будем делать, пока не решено."

jap.19.d: "Японский дипломат только что прислал нам ряд требований, включая возможность разместить японские войска на наших территориях, чтобы остановить эти антияпонские настроения и оказать помощь в расследовании недавнего инцидента с Нанкингом. Это требование в основном откажется от нашего национального суверенитета и независимости. Но наш [отправитель] еще не принял никакого решения по ответу. Возможно, он поддастся этим требованиям или нет. Мы можем только подождать..."

jap.20.d: "Японцы, как наши сторонники, заслужили некоторые уступки в пятой войне Фенгтьена-Чили, но теперь их правительство стало гораздо более империалистическим и начало расширяться. На своем пути расширения мы лжем. Теперь, когда японцы прислали нам свой ультиматум, откажемся и ведем войну, против которой мы можем плохо бороться с технической мощью Японии, или мы подчиняемся империалистической империи? Судьба Фентьена лежит здесь, и мы не знаем, сможем ли мы пережить такой конфликт."

jap.201.d: "Несмотря на то, что великая сила нашей нации явно превышает их собственную, Фенгтиан проигнорировал наш ультиматум."

jap.202.d: "Осознавая великую мощь Японии и дипломатическое убеждение, Фенгтиан принял наш ультиматум."

#Zhili ultimatum
jap.21.d: "После многочисленных инцидентов в Циндао, Дайяне и Манчжурском полуострове японцы уже достаточно и сейчас послали нам ультиматум, чтобы покориться им или пойти с ними на войну. Хотя мы не можем позволить себе вести войну с их технологической мощью, мы не можем позволить себе покориться этому, поскольку все население сомневается в будущем Жили под японским правлением. Все, что мы знаем, так это то, что судьба и будущее Жили находятся здесь, и мы полагаемся на это."

jap.211.d: "Несмотря на то, что великая сила нашей нации явно превышает их собственную, Клика Жили проигнорировала наш ультиматум."

jap.212.d: "Осознавая великую мощь Японии и ее дипломатическое убеждение, Клика Жили приняла наш ультиматум."

#France peace proposal
jap.22.d: "После вторжения Японии в наше единственное азиатское имущество у нас больше нет никаких запасов в Азии, и поэтому мы не можем разжечь войну. Японцы через швейцарского дипломата послали нас просить о перемирии или даже о мире. Если мы это сделаем, мы откажемся от своего имущества в Тихом океане."
#Russo-Japanese coalition
jap.23.d: "Японцы, которые много раз поддерживали нас в Русской гражданской войне, направили предложение о союзе против красных, которые в настоящее время владеют обширными российскими землями. Если мы согласимся, мы найдем мощного союзника, который, несомненно, поддержит нас в любой возможный момент и поможет нам победить огромную советскую угрозу."

jap.24.d: "Японцы объединились с англичанами, и теперь они сотрудничают с ними в военном отношении. Это означает, что на нас будет направлен другой нож, но на этот раз в Тихом океане. Хотя неизвестно, как обе страны будут бороться против нас, они уверены, что обе страны будут вместе против нас."

jap.25.d: "Улучшение отношений с Соединенными Штатами подтолкнуло японцев вновь увеличить размеры своих ВМС, что делает наши самые изолированные колонии еще более уязвимыми."

jap.26.d: ""

jap.27.d: "Дипломаты великого и могущественного государства Японии направили нам предложение о создании антифранцузского альянса с ними. &lt; &lt; Аннексия &gt; &gt; под контролем сиамских лаосов Францией после франко-саамской войны 1893 года по-прежнему является спорным вопросом между нашими двумя государствами и многими внутри нашей страны, которые хотели бы обратить это вспять. &lt; &lt; В то время как японцы явно намерены оказать давление на французские интересы в Юго-Восточной Азии &gt; &gt; некоторые министры устали от того, чтобы стать слишком зависимыми от японцев."

jap.28.d: "Осознавая наши общие интересы во французской Индокита, сиамцы согласились на наше предложение о союзе."

jap.29.d: "Несмотря на наши общие интересы во французской Индокита, сиамцы отказались от нашего предложения альянса."

jap.30.d: "Очевидно, что мы и Япония заинтересованы в ослаблении советского влияния на Дальнем Востоке. Военнослужащий из Японии пришел к нам с планом испытания советской обороны в стратегическом регионе Якутск. Наши военные с поставками из Японии облажаются в этом регионе в небольших масштабах, покупая высоко скоординированное нападение. В то время как СССР значительно превышает нас, по мнению Токио, целенаправленные и решительные операции могут быстро победить советские расколы, прежде чем они могут быть подкреплены резервами из Европы, эволюцией стратегии, используемой Японией для поражения России в 1905 году. В то время как японский посланник очень уверен в этом плане, местные российские офицеры, по понятным причинам, устали провоцировать СССР, но мы также должны утомляться от того, чтобы разогнать нашего японского союзника."

jap.31.d: "Убедив нашего военного посланника, русские согласились напасть на советскую стратегическую позицию в Якутске."

jap.32.d: "Несмотря на усилия нашего военного посланника в Чите, русские отвергли наш план атаковать советскую оборону в Якутске."amenable\" government in Chita."

jap.33.d: "Наши сибирские гарнизоны сообщили, что белые силы пересекли нашу границу на нашу дальневосточную территорию Якутска."

jap.34.d: "~Кто? ~"Yakutsk Incident\" as some have begun to call it has come to a quick end. The sudden break out of violence between these two states has shocked the international community, some of whom suspect Japan in sparking the incident. All that really matters though is our decisive victory."

jap.35.d: "~Кто? ~"Yakutsk Incident\" as some have begun to call it has come to a quick end. The sudden break out of violence between these two states has shocked the international community, some of whom suspect Japan in sparking the incident. Our surprise defeat has shocked many of our ministers and officers who are now demanding significant reforms to better prepare our army against future battles."

jap.36.d: "Осознавая наши общие амбиции против Советского Союза, Россия согласилась заключить с нами союз."

jap.37.d: "Несмотря на нашу историческую и неизменную поддержку их маленького режима, Россия отказалась заключить с нами союз."

jap.38.d: "Наши попытки найти мирное решение для растущей политической власти японской армии провалились. Когда они угрожали японской демократии, мы предложили им дюйм, который они видели как возможность проехать милю. Медленно, но несомненно, гражданское правительство Японии поставило под сомнение интересы военных. Под все большим внутренним давлением даже сам император поддался требованиям военных. Возможно, что бы ни существовала демократия в Японии, сейчас это всего лишь ноут в истории."


jap.48.d: "Несмотря на наши усилия по улучшению отношений с Великобританией и ее народом, Британские ВМС отказались передать дизайны Трафальгара. Этот современный корабль довольно мощный, и если мы хотим сохранить наше место, как вы доминируете в силе в Тихом океане, мы должны создать корабль, который будет соответствовать его силе."

jappol.11.d: "Для того чтобы обеспечить выживание демократического правительства Японии, мы должны реформировать порядок функционирования вооруженных сил. В настоящее время многие из наших высших генералов действуют независимо от Токио, и как таковые они очень мало заинтересованы в парламентской политике. Хотя такое положение дел позволило нашим военным и национальным силам добиться многих ошеломляющих побед против наших врагов, оно также превратило Японию в страну, которая фактически имеет два конфликтующих правительства. Если мы хотим обеспечить стабильность нашей нации, мы должны царствовать в самых амбициозных японских командирах и установить на их месте лоялистов."

jappol.16.d: "Недавно полиция захватила солдата Японского военно-морского флота, который подозревается в участии в заговоре против демократического правительства."

jappol.17.d: "Как парламент уведомил императора о заговоре, император сказал Парламенту, что он намерен поговорить с обеими ветвями армии, чтобы, цитирую, "говорите о последних событиях". Парламент разделился по этой мере, опасаясь, что речь может привести к критике императора широкой общественностью. Если премьер-министр согласится с речью, это может привести либо к тому, что военные откажутся от своих планов переворотов, либо император будет подвергнут критике. Что же нам делать?"

jappol.18.d: "Изороку Ямамото, один из адмиралов, уведомленных Имперским Парламентом, передал результаты своего расследования возможного переворота. Он вытащил свои веревки в Имперский флот Японии и обнаружил множество офицеров и морпехов, которые планировали переворот позже в этом году. Он составил список офицеров и морских пехотинцев и передал их Императорскому Парламенту. Что мы будем делать с этим списком офицеров?"

jappol.19.d: "Вчера группа военно-морских офицеров и морских пехотинцев захватила парламент и захватила в заложники законодателей, потребовала, чтобы нынешний премьер-министр ушел в отставку и позволил военнослужащему стать новым премьер-министром. Имперская японская армия отказалась вмешаться, и гражданское правительство может лишь удовлетворить эти требования, поставив императорский флот в ведение Империи."

jappol.20.d: "С докладом Ямамото о военно-морских офицерах и морских пехотах премьер-министр отдал приказ о массовых арестах этих предателей, что положило конец возможному перевороту за счет персонала военно-морских сил, и мы должны начать восстановление после этой чистки и укрепить превосходство демократического правительства над двумя ветвями."

japhep.1.d: "По мере приближения к завершению Имперской конференции 1937 года британцы призвали к проведению конференции с нами, с тем чтобы продолжить переговоры и дискуссии в целях продолжения англо-японского альянса и решения других вопросов с Японией. &quot; Дефагации &quot; из Великобритании достигли Осаки и собрались сегодня впервые. &quot; Обе делегации и правительства надеются на эту конференцию и надеются, что обе стороны получат то, что они хотят от конференции &quot; ."

japhep.2.d: "В условиях неопределенности в отношении способности предоставлять ресурсы и обеспечивать экономическую стабильность после Лондонского фондового рынка многие японские компании стали торговать с другими странами и компаниями, такими, как американская продукция и немецкое железо. &lt; &lt; Британская империя &gt; &gt; подверглась довольно сильному удару по своей торговле и не удовлетворена этим. &lt; &lt; Министр иностранных дел Великобритании Энтони Эдем &gt; &gt; решил обсудить с японским делегатом вопрос о такой торговле, а именно об импорте и экспорте японской империи."

japhep.3.d: "По мере того, как британцы начинают восстанавливаться после краха фондового рынка, многие страны отказались от Золотого стандарта. Британские делегаты сказали японским делегатам, что британское правительство надеется отказаться от стандарта или, по крайней мере, обесценить фунт. Японский министр экономики также поддерживает такие действия. Если мы сделаем это, мы сможем быстрее выйти из кризиса фондового рынка."

japhep.4.d: "Теперь британские делегаты сказали, что две империи должны объединиться для защиты от неназванных угроз, которые нарастают. Британский делегат уверен, что если Япония объявит об изменении англо-японского альянса, с тем чтобы присоединиться к Британской империи и поддержать ее в любом предстоящем конфликте, то неуточненная угроза усомнится в любой потенциальной атаке на обе империи. Проблема в том, что мы, или нет, выполняем такие действия?"

japhep.5.d: "С учетом того, что периодическое обновление англо-японского альянса в 1937 году вскоре завершится, мы призвали к проведению встречи на высшем уровне с японцами, хотя это и не относится к повестке дня, мы не уверены, как японцы отреагируют на этот саммит, видя наши многочисленные акты агрессии в межвоенные годы."

japhep.6.d: "В связи с крушением Лондонского фондового рынка многие утратили большую уверенность в нашей экономической стабильности и торговле, в том числе многие японские инвесторы."

japhep.7.d: "Золотой стандарт является нашим прежним экономическим стандартом, хотя у нас есть планы в отношении стандарта, мы не хотим, чтобы ни один из наших торговых партнеров был не в состоянии постоянно торговать с нами, или же мы просто отменим подписанное ранее торговое соглашение."

japhep.8.d: "Несмотря на некоторые разногласия по некоторым вопросам, наши делегаты сообщили, что, возможно, было бы целесообразно обратиться с просьбой о создании англо-японского альянса, и, возможно, японцы, наконец, захотят продолжить наш союз как для защиты, так и для сдерживания."

japhep.9.d: "С большим величием мы и Великобритания отложили наши разногласия и завершили обсуждение Пакта Хирота-Эден, который продемонстрирует величие дипломатии и обеспечит успех как Японской, так и Великобританской империи."

japhep.10.d: "Наши делегаты в Киото сообщили на Даунинг-стрит о том, что японцы согласились на продление Англо-японского альянса. Это означает, что большинство наших надежд на саммит оправдалось, несмотря на консервативные надежды большинства политических советников. Это будет самая влиятельная конференция в истории. Мы будем радоваться этому событию!"

japhep.100.d: "Наше правительство, прежде чем будут проведены новые выборы, надеется решить проблему непрерывного англо-японского альянса."

japhep.101.d: "Британия только что сказала нашему министру иностранных дел, что они хотят продлить Англо-японский союз еще на три года, и мы должны решить, будет ли этот союз продолжаться."

japhep.102.d: "Японский парламент направил в министерство иностранных дел письмо, в котором говорилось, что они решили продлить срок действия Альянса после нашего предложения о трехлетнем временном продлении до полного обсуждения, однако в письме говорилось, что многочисленные действия Британской империи противоречат Японии и ее интересам."

japhep.103.d: "Японский парламент направил в министерство иностранных дел письмо, в котором говорилось, что они решили прекратить Альянс против нашего предложения о трехлетнем временном продлении."

japhep.104.d: "Британский дипломат только что оставил нам письмо, в котором говорится, что прекращение действия Альянса отвечает интересам их страны, поскольку наши действия вызывают огромную неопределенность, отходя от британских интересов, присоединяясь к другим странам."

japhep.105.d: "Когда мы вступаем в [Грейд], одна из проблем возникает по мере того, как быстро обновляющийся англо-японский союз подходит к концу. По мере того, как три года заканчиваются без больших конфликтов между двумя странами, многие считают, что это означает, что интересы двух государств снова близки друг к другу. Многие люди поддерживают полное присоединение Японии к нам, приглашая их в Союз Империи защиты, но это должно быть сделано с тщательным обсуждением."

japhep.106.d: "Сегодня британский дипломат вошел в залы министерства иностранных дел, говоря о проведении конференции между двумя странами, уверен, что эта конференция будет касаться судьбы англо-японского Альянса по завершении временного обновления. Парламент более оптимистичен в отношении проведения конференции для обсуждения судьбы Альянса. Возможно, она пройдет чудом, и мы будем счастливы в конце концов, или же она будет плохой, и обе стороны пойдут с кислым лицом."

japhep.107.d: "Япония уведомила нашего дипломата в этом зале о том, что они не будут обсуждать Альянс, по-прежнему ссылаясь на то время, когда британцы идут против интересов Японии, и поэтому они также прекратят этот союз. Министр иностранных дел уже объявил, что Великобритания не будет пытаться сохранить Японию в качестве члена Альянса."

japhep.108.d: "Япония уведомила нашего дипломата в Японии о том, что они немедленно прекратят действие Альянса, ссылаясь на агрессию британских действий. Министр иностранных дел заявил, что Британская империя не будет пытаться продолжать союз, заявив, что «неприятный союз противоречит интересам обеих стран»."

japhep.109.d: "Британия уведомила нашего дипломата о немедленном прекращении Альянса, сославшись на многочисленные неприятные времена сотрудничества между двумя странами, и на то, что «ни для каких-либо отношений лучше, чем для взаимоисключающих разочаровывающих друг друга»."

japsanfran.1.d: "Наш обмен разведданными с американцами был как раз вовремя, мы пригласили их на встречу на высшем уровне, они согласились и предложили провести ее в Сан-Франциско, мы решим решение по Трафальгару и многим другим мелочам, и теперь мы немедленно, без всяких сомнений, будем участвовать, так как время не на нашей стороне."

japsanfran.2.d: "Приглашение Японии на саммит по морским проблемам и неотложному вопросу для HMS Trafalgar привело к саммиту в Сан-Франциско. Теперь мы будем участвовать в решении этих вопросов. Теперь мы должны провести этот саммит как можно скорее, иначе наши корабли будут легко побеждены."

japsanfran.3.d: "После 18 лет Вашингтонского военно-морского договора, который ограничил как наше, так и американское судостроение, британцы запустили супертяжёлый боевой корабль HMS Trafalgar, который угрожает как американскому, так и японскому военно-морскому флоту. Мы, японцы, должны призвать к встрече на высшем уровне, чтобы объявить о прекращении договора и возобновить программы строительства флота обеих стран для обеспечения безопасности наших морей. Если американцы не согласятся с нашим делом, мы должны прекратить следовать им."

japsanfran.4.d: "Японские делегаты в первый день Встречи на высшем уровне сказали, что «С Трафальгаром ХМС мы должны немедленно прекратить ограничивать наши моряки» и призвали к немедленному прекращению действия Вашингтонского военно-морского договора, а вместо этого объединиться в целях обмена военно-морскими технологиями, чтобы наверстать упущенное развитие межвоенного военно-морского флота."

japsanfran.5.d: "В связи с тем, что мы полагаемся на импортные ресурсы, мы упомянули, что нам следует прекратить импорт британских товаров и импортировать больше американских товаров, но если мы введем в действие эмбарго в отношении Британии и Америки, то вся наша экономика может прекратить нормальное функционирование. Чтобы предотвратить это, мы должны подписать соглашение с Соединенными Штатами. Если это будет подписано, мы сможем обеспечить, чтобы этого не произошло, и США всегда будут поддерживать нас с экономической и ресурсной точек зрения."

japsanfran.6.d: "С учетом зависимости Японии от нашего экспорта, если мы их заблокируем, их экономика будет сильно подорвана, поэтому они просили заключить с ними торговый договор. С этим торговым договором мы можем уменьшить нашу зависимость от британских товаров. Хотя у Британии не хватает ресурсов, чем меньше у нас связей с Британией, тем меньше проблем у нас будет, когда мы войдем с ними в войну."

japsanfran.7.d: "Поскольку Техас в основном управляется компанией Standard Oil, у нас мало возможностей остановить такую монополию. С такими японскими компаниями, как Mitsubishi и Kawasaki, эти компании могут оспорить доверие в Техасе. Мы сообщим об этом японским делегатам."

japsanfran.8.d: "Американцы уведомили нас о Standard Oil, одной из крупнейших нефтяных компаний на Земле, и о своей монополии на тексанскую нефтяную промышленность. Для того чтобы противодействовать доверию Джона Д. Рокафеллера, американский переговорщик попросил нас поощрять инвестиции заибатса, такого как Ниппон Ойл, на американский рынок. Эта сделка поможет Японии обеспечить стабильный источник американской нефти для удовлетворения наших растущих потребностей, в то время как американцы получат столь необходимый источник иностранного капитала."

japsanfran.9.d: "После оценки, проведенной министерством обороны на тихоокеанских базах, они пришли к выводу о том, что нам нужно больше союзников в Тихом океане, чтобы предоставить армию против любых возможных интересов."

japsanfran.10.d: "Из-за отсутствия американской крепости в Восточной Азии, помимо Филиппин, которая не может в полной мере поддерживать весь флот Америки или Гуама, который слишком мал для того, чтобы обеспечить американскую армию размера. Если американцам позволено основывать права, то взамен мы также приобретем права на американских базах. Хотя это может быть не так хорошо, как военный союз, это не менее хорошая сделка."

japsanfran.11.d: "Министерство обороны рекомендовало президенту быстро предложить коалицию с японцами, но, несмотря на то, что края еще предстоит проработать, мы должны обеспечить, чтобы Япония была с нами, или, если нет, рано или поздно мы победим их."

japsanfran.12.d: "Американский президент, в ответ на большое признание их предложений, предложил последнее дополнение: американо-японский альянс. Поддельный альянс защитит как японский, так и американский интересы в Тихоокеанском регионе, борясь с британским империализмом. Детали будут обсуждаться только в том случае, если японцы сначала согласятся с Альянсом."

japsanfran.13.d: "Японцы приняли Великий Тихоокеанский договор! С этим известным, многие в правительстве радуются! Уверены, что японцы станут определенным союзником нас. Это означает, что наш великий мирный союз сможет защитить наши собственные интересы, несмотря ни на что."

japsanfran.14.d: "По мере срыва переговоров японцы заявили, что они так или иначе не будут ограничены этим договором."

japele.1.d: "Выборы 1936 года здесь, как обычно, только Риккен Минсейто и Риккен Сейюкай будут соревноваться в выборах. В этом году Минсейто обещал больше прав для трудящихся, а Сейюкай надеется модернизировать железнодорожные системы. Выборы, кажется, были шеей и шеей, и никто, похоже, не смог полностью победить. Кто победит в этом году?"

japele.2.d: "По мере того, как новый парламент приступает к составлению нового бюджета на предстоящие два года, обе ветви военной власти требуют первоочередного внимания. У нас достаточно денег только для одной из двух ветвей, так кому мы его предоставим? Потрясающая армия нуждается в дополнительном финансировании для расширения, с тем чтобы обеспечить безопасность нашего иностранного имущества и исследований, или стареющего флота, из которого многие корабли уже состарились и нуждаются в модернизации и усовершенствовании в ближайшее время?"

japele.3.d: "Выборы 1938 года уже здесь. С большим числом кризисов, с которыми мы столкнулись, мы выберем новое и сильное правительство. Минсейто призывает к расширению прав трудящихся, в то время как Сейюкай желает в"

japtraf.5.d: "Наши шпионы сообщили нашему военно-морскому атташе в Британии о том, что судят новый боевой корабль под названием HMS Trafalgar, а не просто обычный боевой корабль. Она супертяжелый боевой корабль, вооружённый совершенно новыми, современными 18-дюймовыми пушками, непротивопехотными доспехами и необъявленным количеством противовоздушных вооружений. Она настолько могущественна, что один из ее кораблей может соперничать с тремя или четырьмя боевыми кораблями, освободив столицу для британских внутренних вод и угрожая нашему военно-морскому превосходству в азиатских морях. Мы сообщим нашим американским союзникам и примем решение по этому вопросу."

jap.44.d: "В то время как морские испытания Трафальгара продолжаются, наши адмиралы паникуют при таком равновесии, нарушая дизайн так неожиданно. С некоторыми адмиралами, собравшимися вместе, они написали просьбу о проведении дискуссии в рамках диеты. В то время как это напрямую обходит парламент, диета, кажется, не имеет значения в такое важное время. Теперь, когда диета наконец собралась для обсуждения нашей реакции на этот акт, мы можем действительно решить наши действия. Некоторые в адмиралте предлагают обратиться к британскому министерству иностранных дел за дизайном, в то время как некоторые предлагают украсть его. Что нам теперь делать?"

jap.45.d: "Наше министерство иностранных дел только что получило письмо от японского парламента, в котором содержится просьба о том, чтобы мы предоставили японской военно-морской флоту дубликат для нашего современного флагманского проекта HMS Trafalgar. В настоящее время Адмиралтейство проводит ожесточенные дебаты о конфиденциальности наших судебных процессов, в то время как обе палаты правительства проводят такие же ожесточенные дебаты о том, следует ли нам передавать дизайны. Если мы это сделаем, мы можем быть уверены, что Япония будет строить корабль примерно такого же перемещения и ассимилировать слабости нашего дизайна, но если мы этого не сделаем, мы нанесем серьезный ущерб нашим отношениям. Рискнем ли мы это или нет?"

jap.46.d: "Посланник из Адмиралтейства только что прибыл в министерство иностранных дел, присягая, когда он вламывается в залы офиса, информируя министра иностранных дел об аресте одного из них."sneaky bugger lurking inside the Admiralty, near the archives\". The lurker is believed by both the Scotland Yard and the Admiralty as an spy for the Japanese government, our supposed ally. Now we do not have a suitable respond just yet, but we shall accuse the Japanese for shady actions for some mere designs!"

jap.47.d: "Наше министерство иностранных дел только что получило документ от британского дипломата, в котором говорится, что это "Ранний рождественский подарок" и "Адмиралтейству это понравится"."

jap.49.d: "Бакайяро! Наш шпион, который был отправлен украсть замыслы Трафальгара, был пойман, и британцы обвиняют нас в провокации агрессии, и британское население в руках! Самые возмутительные националистические утверждения нас говорят, что мы скрываем империалистические надежды и страстные убеждения, в то время как самые разумные по-прежнему предвзяты к британам. Парламент уже принес официальные извинения за непристойный акт вора, отрицая любые возможные связи с ним. Это произошло очень плохо, несмотря на большие ожидания планировщиков операций."

jap.51.d: "Мы недавно присоединились к Альянсу Императорской защиты, но многие считают, что мы не принадлежим к ним и не имеем равных возможностей для них."

jap.52.d: "Японский дипломат только что встретился с министром иностранных дел и продемонстрировал надежды Японии на дальнейшее экономическое сотрудничество за счет расширения взаимной экономической торговли и инвестиций."

jap.53.d: "Японский дипломат только что встретился с министром иностранных дел для того, чтобы обсудить надежды Японии на дальнейшее военное сотрудничество. Он утверждает, что это связано с инакомыслием со стороны других союзников. Оба министра иностранных дел обсудили вопрос о том, каким образом можно продолжать сотрудничество между двумя странами. Некоторые концепции включают некоторые военные игры в различных районах для дальнейшей подготовки войск в различных районах и обмена советниками по разработке доктрины. Японцы очень заинтересованы в том, чтобы обеспечить их место в Альянсе в качестве неотъемлемой части, непрерывной."

jap.hol.friends.of.our.friends.are.our.friends.d: "Япония хотела бы присоединиться к нашей фракции и в качестве представителя Штальпакта в Азии принять решение о том, принимать ли Японию в эту группировку, и добавить их к этой фракции, что помогло бы нашему и немецкому влиянию на Азию и могло бы получить помощь в ближайшем будущем, а именно восстановить нашу бывшую колонию Индонезии."

japfor.1.d: "Уже несколько месяцев японцы выражают свои агрессивные амбиции в отношении наших колониальных земель в рамках своей экспансионистской политики."
japfor.2.d: "Мы не получили никакого ответа на наш ультиматум от [от GetNameDef], мы должны мобилизоваться к войне и обеспечить безопасность нашего места как единственной великой державы в Восточной Азии!"
japfor.3.d: "В конце концов, это не так уж удивительно: они не посмеют смотреть в глаза силе императорских армий!"
