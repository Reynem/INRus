#### Bookmark Description ####

JAP_FUHRERREICH_DESC: "Япония поднимается. менее чем за столетие она отошла от изолированного феодального общества к самому индустриализованному и современному государству Азии. Император Хирохито правит над молодой империей, которая одновременно держит власть над Кореей и Тайванем, но поддерживает демократию, основанную на американских идеалах. Япония должна двигаться еще дальше, чтобы процветать в этом неопределенном мире. Теннохеика Банзай!"

