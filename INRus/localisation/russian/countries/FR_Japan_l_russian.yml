jap_puppet_divided_china_desc: "В то время как де-юре Запад будет принадлежать правительству в Пекине, на самом деле он будет принадлежать различным лояльным воинам."

### Characters ###
 JAP_arahata_kanson: "Арахата Кансон"
 JAP_arahata_kanson_leader_desc: "Первый председатель Японской Народной Республики Арахата Кансон вступил в должность во время немедленного изменения политического ландшафта страны, который был арестован в связи с инцидентом с Красным Флагом, Арахата был вынужден скрывать свои просоциалистские тенденции, а затем создать подполье социалистического толка для левокрылых активистов, а Арахата, возможно, ответственен за все радикальное левое насилие против имперского режима."

