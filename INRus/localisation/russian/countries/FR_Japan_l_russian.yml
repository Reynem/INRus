 JAP_hirohito: "Хирохито"
 JAP_hirohito_leader_desc: "Предположим, что хризантемский трон после смерти его отца, императора Тайшо, Его Императорское Величество представляет божественную династию почти 2500 лет; его личность рассматривается не только как глава государства, но и как представитель самого сердца, души и народа. Поскольку в условиях нарастающего внутреннего хаоса процветают как милитаристы, так и левый, император остается безмолвным, его роль неясна и нерешима. Однако, когда и если Император сделает свой шаг, это, несомненно, будет решающим."

