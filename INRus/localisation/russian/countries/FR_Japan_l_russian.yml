JAP_the_fate_of_china: "Судьба Китая"
JAP_the_fate_of_china_desc: "Сейчас, после поражения Китая, мы должны принять решение о политике оккупации, и у нас есть для этого целый ряд вариантов, и выбор правильного варианта будет иметь решающее значение для нашего будущего процветания."
