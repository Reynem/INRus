jap_puppet_united_china_andgivethemourstuff_desc: "Мы должны освободить Китай с полным побережьем, [793. GetName] и [524.GetName]."
#
jap_annex_china_dec: "Китай"
jap_annex_china_dec_desc: "Мы боролись за жесткую кампанию в Китае ради славы Японии, а не за какое-то понятие паназиатского единства, мы официально аннексируем эту территорию для нашей Империи."
#
