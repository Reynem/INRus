 #### Bookmark Description ####

 MAN_FUHRERREICH_DESC: "После того как в 1924 году была сформирована Коалиция против чили, состоящая из Анхуай, Куоминтанга и Фенгтяна, война закончилась в основном неблагоприятным тупиком для Жили. С сохранением Пекина Жили Бейян постепенно стабилизировался, а Жили остались в правительстве. Однако отношения с Куоминтангом на юге быстро сели, началась Северная экспедиция против Бейянга. В то время как Куоминтанг увидел первоначальный успех, вмешательство Шаньси и Шаньдуна затормозило их продвижение, вынуждая к миру между двумя крупнейшими правительствами Китая."

