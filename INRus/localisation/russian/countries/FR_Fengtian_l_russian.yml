 # ECONOMIC #

 MAN_problems_with_industry: "Проблемы с промышленностью"
 MAN_problems_with_industry_desc: "Наша индустрия не ужасна, но не секрет, что она борется. Теперь наше правительство должно решить эту проблему, а не то, что это отрицательно: в этом деле есть много выгод."
 MAN_support_japanese_economic_interests: "Поддержка экономических интересов Японии"
 MAN_support_japanese_economic_interests_desc: ""
 MAN_the_bandit_issue: "Бандитский вопрос"
 MAN_the_bandit_issue_desc: "Бандиты поражают наши северные провинции и сводят на нет торговые отношения между нами и восточными штатами."
 MAN_eliminate_the_bandits: "Уничтожить бандитов"
 MAN_eliminate_the_bandits_desc: "Бандиты поражают наши северные провинции и сводят на нет торговые отношения между нами и восточными штатами."
 MAN_hire_the_bandits: "Нанять бандитов"
 MAN_hire_the_bandits_desc: "Давая государственные деньги бандитам, они будут выкуплены, может, мы даже отправим их куда-нибудь еще..."
 MAN_put_them_down: "Опустите их!"
 MAN_put_them_down_desc: "В предстоящие недели мы соберем нега-поле охотников за бандитами!"
 MAN_military_integration: "Военная интеграция"
 MAN_military_integration_desc: "Привлекая бандитов, мы найдем неуправляемую, но жестокую и решительную группу солдат."
 MAN_heilungkiang_hunters: "Охотники на Хейлунгкианг"
 MAN_heilungkiang_hunters_desc: "Охотники за Хейлунгкиангом будут инвестициями, вкладывая государственные ресурсы в их финансирование и зарплату, они скоро приведут этих ублюдков к пятам."
 MAN_loot_caravans: "Грабят караваны"
 MAN_loot_caravans_desc: "Мы наконец-то заслужили их доверие, что они обещали напасть на близлежащие штаты, а затем уехать в другое место."
 MAN_a_safer_economy: "Безопасная экономика"
 MAN_a_safer_economy_desc: "Экономика без бандитов будет намного безопаснее. И наконец, мы можем укрепить нашу индустрию, не улучшив то, что у нас уже есть, а разрешив капиталу попасть туда, где он никогда не был в состоянии в течение десятилетий."
 MAN_the_future_of_industry: "Будущее промышленности"
 MAN_the_future_of_industry_desc: "Наша предыдущая политика позволила нам провести одну последнюю большую промышленную работу."
 MAN_develop_mukden: "Разработать Munden"
 MAN_develop_mukden_desc: "Развитие Мукдена откроет возможности для совершенствования городских центров в защиту Фенгтиана."
 MAN_develop_hsinking: "Разработать ухищрение"
 MAN_develop_hsinking_desc: "Развитие Hsinking откроет возможности, которые сосредоточатся на импровизации селений и сельских районов в защиту Фенгтиана."
 MAN_urban_tactics: "Городская тактика"
 MAN_urban_tactics_desc: "Наша индустрия должна начать фокусироваться вокруг наших основных центров. Это будет рискованно, поскольку наши самые населенные районы ближе всего к врагу, но могут принести дивиденды. Вполне логично, что мы должны сфокусировать промышленность какое-то время на строительстве укреплений, которые позволят нам защитить ее."
 MAN_countryside_industry: "Сельская промышленность"
 MAN_countryside_industry_desc: "В центре внимания нашей промышленности будут находиться другие сельские районы Фенгтиана."
 MAN_build_the_south: "Построить Юг"
 MAN_build_the_south_desc: "Мы должны продолжать строительство района вокруг Чаоян, и увеличение числа работников и интеллигенции должно позволить осуществить эту деятельность гораздо быстрее."
 MAN_interior_defense: "Внутренняя оборона"
 MAN_interior_defense_desc: "Доктрина внутренней обороны позволит нам сфокусировать нашу страну на создании значительных защитных сооружений более высокими темпами."
 MAN_zhili_expeditions: "Экспедиции Жили"
 MAN_zhili_expeditions_desc: "Пришло время провести экспедицию через границу на территорию Жили."
 MAN_ports_for_power: "Порты питания"
 MAN_ports_for_power_desc: "Последний официальный акт в нашей доктрине обороны в сельской местности будет сосредоточен на наших приграничных провинциях."
 MAN_the_power_of_the_unions: "Власть профсоюзов"
 MAN_union_integration: "Объединение профсоюзов"
 MAN_union_compromise: "Союзная компромисса"
 MAN_union_elimination: "Ликвидация профсоюзов"
 MAN_a_stale_culture: "Старая культура"
 MAN_a_stale_culture_desc: "В предстоящие месяцы нам придется объединить Фентиан, что, конечно, трудно, поскольку мы являемся лишь военным правительством."
 MAN_public_works: "Общественные работы"
 MAN_public_works_desc: "Нам нужно будет потратить много времени на экспроприированные средства на строительство страны."
 MAN_demand_warlord_tribute: "Требовать отваги у военного барона"
 MAN_demand_warlord_tribute_desc: "Военачальники терпели нас на протяжении многих лет, но это был старый Фенгтиан, и теперь они либо заплатят, либо будут арестованы, но это не секрет, что им позволено больше власти и лучшие условия в нашем правительстве, чем где-либо еще в Китае."
 MAN_demand_local_tithing: "Спрос на локальную кисть"
 MAN_demand_local_tithing_desc: "Деревням вручается слабый налог, и их автономия позволяет им бегать сквозь амок. Мы должны вернуть их обратно и убедиться, что они отдадут то, что им причитается. Ради блага Фенгтиана, конечно же."
 MAN_in_honor_of_the_warlord: "В честь Военачальника"
 MAN_in_honor_of_the_warlord_desc: "Старика застрелили не так давно..."
 MAN_funding_for_the_people: "Финансирование деятельности в интересах населения"
 MAN_funding_for_the_people_desc: "Просвечивая и затем вербуя наших людей в исследовательские коалиции, мы можем позволить государственным программам щедро платить за государство."
 MAN_increase_rural_conscription: "Сельская воинская обязанность"
 MAN_increase_rural_conscription_desc: "Всем придётся вместе защищать Фенгтиан-Китай! Число людей, которых мы сейчас вербуем, ужасное. Пришло время, чтобы все, независимо от места, отдали себя делу."
 MAN_dedication_to_china: "Посвящение Китаю"
 MAN_dedication_to_china_desc: "-- Китай не видел славы на протяжении десятилетий, она всегда была смущена чужеземцами. -- [Root. Get Header]"
 MAN_tianjin_naval_academy: "Тяньцзинская военно-морская академия"
 MAN_tianjin_naval_academy_desc: "Тяньцзин находится в идеальном месте для крупной морской академии, мы можем учить там молодых моряков, которые хотят вернуть славу в Китай."
 MAN_harbin_military_academy: "Военная академия Харбина"
 MAN_harbin_military_academy_desc: "Харбин находится в удобном положении, вдали от иностранных угроз, и он станет прекрасным военным городом. [Roog. Get Header] правительство уже живет там, в конце концов."
 MAN_a_people_at_sea: "Люди на море"
 MAN_a_people_at_sea_desc: "С момента своего создания у Фенгтиана никогда не было настоящего флота, но теперь мы можем официально расширить наши горизонты, глобальную торговлю, местную морскую войну, даже туризм."
 MAN_war_ideology: "Идеология войны"
 MAN_war_ideology_desc: "Фенгтиан готов к войне в духе, но не в уме. По крайней мере, пока нет. Мы должны объединить наши высшие военные умы как из Военно-морской академии, так и из армии и Харбина, чтобы создать сплоченного военного тропа."
 MAN_chinese_academies_for_chinese_students: "Китайские академии для китайских студентов"
 MAN_chinese_academies_for_chinese_students_desc: "Теперь, когда лживые китайские истцы избавились от нашей страны, а наша страна находится в относительном мире, Фенгтиан может принять культурное наследие Китая и объявить себя законным преемником не только Китайской Республики, но и всех тех династий, которые были до него, вновь втянутых в древность!"
 MAN_the_future_of_arms: "Будущее оружия"
 MAN_the_future_of_arms_desc: "Мы создадим большую и сосредоточенную армию в сельской местности Фентиан, оснащая ее специализированным научно-исследовательским центром, мы должны увидеть, как быстро будут выплачиваться дивиденды."
 MAN_fengtian_society_for_light_metals: "Общество лёгких металлов Хейлунгкян"
 MAN_fengtian_society_for_light_metals_desc: ""
