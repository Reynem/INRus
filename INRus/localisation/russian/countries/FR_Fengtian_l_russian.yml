 #### IDEAS ####

 MAN_political_reform: "Политическая модернизация"
 MAN_political_reform_desc: "Хотя нельзя отрицать, что Чжан Зуолин является диктатором с практически всей властью, сосредоточенной на его положении, он предоставляет народу многие свободы, которые другие, особенно другие, не получают, такие, как частично свободная пресса, права на труд и религиозная терпимость."
 MAN_antijapanese_sentiment: "Антияпонские настроения"
 MAN_antijapanese_sentiment_desc: "Хотя правительство Фенгтиана должно согласиться с вторжением в японские интересы и, возможно, с притворными улыбками иногда, ясно, что население Манчжурии презирает японских захватчиков, они не согласны с общим правительством, но будут противостоять любой иностранной угрозе с ревностным намерением."
 MAN_renewed_antijapanese_sentiment: "Обновление антияпонского сознания"
 MAN_renewed_antijapanese_sentiment_desc: "Всё, что ненавистно генералу Фенгтианскому населению для японцев, удвоилось."
 MAN_warlord_ubiquity: "Военный барон Убийственность"
 MAN_warlord_ubiquity_desc: "Чжан Зуолин не был идеальным правителем, но его присутствие на посту главы нашего государства дает надежду народу Фенгтиана, одного из единых Китая, возможно, даже одного, свободного от японского влияния."
 MAN_middling_industry: "Переносная промышленность"
 MAN_middling_industry_desc: "Промышленность Фенгтиана борется, но все еще остается - в среднем - лучше, чем любое другое китайское государство."
 MAN_harbin_military_academy_idea: "Военная академия Харбина"
 MAN_harbin_military_academy_idea_desc: "Военная академия Харбина предоставит нашей стране бесценные интеллектуальные ресурсы."
 MAN_power_from_the_people: "Сила от народа"
 MAN_power_from_the_people_conscription: "Сила от народа"
 MAN_electrifying_the_cities: "Электрификация городов"
 MAN_schools: "Школы общественных работ"
 MAN_police: "Общественная работа - полиция"
 MAN_monuments: "Памятные памятники общественных работ"
 MAN_culture_manchu_revival: "Культура - старый Манчу"
 MAN_culture_manchu_revival_desc: "Старая культура Манчжу, существовавшая в прошлом, пережила возрождение в Фенгтиане, его географическом месте рождения."
 MAN_culture_han: "Культура - Хан"
 MAN_culture_han: "В фенгтианском обществе по-прежнему доминирует ханьская культура, обусловленная южной и западной эмиграцией."
 MAN_culture_westernized: "Культура - западная"
 MAN_culture_westernized_desc: "Наша страна начала принимать западную философию и эстетику, хотя она особенно популярна среди элит, она оскорбила многих из более низких классов как радикальный отход от местных норм."
 MAN_interior_defense_doctrine: "Доктрина внутренней обороны"
 MAN_raider_impact: "Воздействие рейдов"
 MAN_raider_impact_desc: "Рейдеры северных провинций спустились по городам и дорогам и нанесли ущерб нашей торговой мощи и движению через регион."
 MAN_raiders_against_other_nations: "Иностранные рейды"
 MAN_raiders_against_other_nations: "На нас напали грязные караваны!"
 MAN_successful_raid_against_other_nation: "Успешная иностранная рейда"
 MAN_successful_raid_against_other_nation: "Мы изъяли ценное оборудование из других стран, взятое по приказу нанимателей."
 MAN_paying_off_hunters: "Платить охотникам"
 MAN_paying_off_hunters_desc: "Охотники за Хейлунгкиангом недешевы, нам придется заплатить им, если они останутся в нашей армии и будут охотиться за налетчиками ради нас."
 MAN_thriving_industry: "Индустрия вождения"
 MAN_thriving_industry_desc: "Наша экономика почти мирового класса, и, безусловно, драгоценность Востока."
 MAN_buildings_for_the_airforce_arms_factories: "Здания военно-воздушных сил - оружейные фабрики"
 MAN_buildings_for_the_airforce_air_fields: "Здания военно-воздушных сил -- военно-воздушных сил"
 MAN_doctrine_of_speed: "Доктрина скорости"
 MAN_doctrine_of_speed_desc: "Использование мобильной и бронебойной инфракрасы позволит нашим солдатам захватывать и окружать вражеские лагеря и позиции гораздо быстрее."
 MAN_doctrine_of_caution: "Доктрина осторожности"
 MAN_doctrine_of_caution_desc: "Применение последовательного подхода к борьбе приведет к сокращению числа жертв и позволит нам вести гораздо более продолжительную войну."
 MAN_doctrine_of_dedication: "Доктрина посвящения"
 MAN_doctrine_of_dedication_desc: "Люди научятся служить Родине."
 MAN_tianjin_naval_academy_idea: "Тяньцзинская военно-морская академия"
 MAN_tianjin_naval_academy_idea_desc: "С течением времени наш народ будет уметь плавать, строить океаны и драться."
 MAN_leasing_ports: "Лизинговые порты"
 MAN_leasing_ports_desc: "Мы сдаем наши порты в аренду внутренним интересам, чтобы получить избыток средств."
 MAN_unions_are_integrated: "Объединенные союзы"
 MAN_unions_are_integrated_desc: "Профсоюзы стали частью нашего правительства, и поэтому им следует держаться подальше от неприятностей."
 MAN_compromise_of_the_unions: "Соглашайтесь с профсоюзами"
 MAN_compromise_of_the_unions_desc: "Профсоюзы имеют право на юридическую демонстрацию в обмен на отказ тем, кто будет выступать за прямое свержение нашего государства."
 MAN_rooting_out_the_unions: "Уничтожение союзников"
 MAN_rooting_out_the_unions_desc: "Профсоюзы и их приспешники будут изгнаны из Фенгтиана добровольно или силой!"
 MAN_dismantling_the_unions: "Демобилизация профсоюзов"
 MAN_dismantling_the_unions_desc: "В Фенгтиане профсоюзам больше не будет позволено функционировать."
 MAN_lessened_antijapanese_sentiment: "Уменьшенная антияпонская реакция"
 MAN_lessened_antijapanese_sentiment_desc: "Люди до сих пор подозревают японцев, но, похоже, они более готовы к сотрудничеству."
 MAN_japan_sides_with_the_zhili_idea: "Японское предательство... снова"
 MAN_japan_sides_with_the_zhili_idea_desc: "Япония, несмотря на то, что они обещали нам и нашему народу, предала нас!"
 MAN_greater_antijapanese_sentiment: "Повышение антияпонского сознания"
 MAN_greater_antijapanese_sentiment_desc: "Мы дадим японцам последний шанс, и они повернутся против нас!"
 MAN_new_senate_building: "Новое здание Сената"
 MAN_new_senate_building_desc: "Наше новое здание Сената объединяет людей Фенгтиана и является напоминанием о непомерной воле Китая."
 MAN_new_republican_army: "Новая республиканская армия"
 MAN_new_republican_army_desc: "Наша армия, представляющая лучшие идеалы нашей республики, является королевским драгоценностями Китая. -- Вперед! -- кричат капитаны, и все люди следуют за ним."
 MAN_fengtian_native_economy: "Местная экономика"
 MAN_fengtian_native_economy_desc: "Важно не только искать иностранные экспортные товары, но и время от времени использовать богатство нашей страны."
 MAN_school_reform_idea: "Реформа системы школьного образования"
 MAN_school_reform_idea_desc: "Наши школы будут открыты для всех, что позволит нам временно увеличить нашу интеллектуальную производительность, пока мы отделяем чашу от пшеницы, как она и была."
 MAN_republican_association_idea: "Республиканские ассоциации"
 MAN_republican_association_idea_desc: "Эти политические ассоциации попытаются создать демократическую инфраструктуру во всем Фенгтиане и объединить разрозненные политические организации, которые выступают против Японии под единым фронтом."
 MAN_securing_executive_powers_idea: "Исполнительный орган, отвечающий за коммуникацию"
 MAN_securing_executive_powers_idea_desc: "В то время как [король. Гедер] номинально является частью нашей политической клики, мы должны обеспечить его полное сотрудничество во всех вопросах. Мы контролируем это правительство - только благодаря единству наша страна выживет."
 MAN_concordias_fengtian_idea: "Фенгтианский конкордиа"
 MAN_concordias_fengtian_idea_desc: "Ассоциация Конкордиа, почти древняя по сравнению с новыми стартовыми политическими организациями Фенгтиана, контролирует все части правительства."
 MAN_the_new_unity_party_idea: "Последствия Партии единства"
 MAN_the_new_unity_party_idea_desc: "Партия единства является продолжением старой политической фракции в Китайской Республике до того, как она развалилась."
 MAN_the_better_works_of_china: "Лучшие дела Китая"
 MAN_the_better_works_of_china_desc: "Zhongguo de Weida Zuopin является относительно новым выражением, которое было популяризировано Учредительной ассамблеей с целью угнетать народ Фенгтиана, чтобы создать «Новые и лучшие работы Китая»."
 MAN_industry_paralyzed: "Промышленность Парализирована"
 MAN_industry_paralyzed_desc: "Наша индустрия парализована социальным расстройством!"
 MAN_rebuilding_henan: "Восстановление Хэнана"
 MAN_rebuilding_henan_desc: "Мы отвлекаем ресурсы на восстановление провинции Жили Хэнань."
 MAN_rebuilding_shandong: "Восстановление Шаньдуна"
 MAN_rebuilding_shandong_desc: "Мы отвлекаем ресурсы на восстановление провинции Чжили Шаньдун."
 MAN_rebuilding_jiangshu: "Возрождение Цзяншу"
 MAN_rebuilding_jiangshu_desc: "Мы отвлекаем ресурсы на восстановление провинции Чжили Цзяншу."
 MAN_rebuilding_anhui: "Возрождение Анхуи"
 MAN_rebuilding_anhui_desc: "Мы отвлекаем ресурсы на восстановление провинции Жили в Анхуи."
 MAN_emergency_taxation: "Налогообложение в чрезвычайных ситуациях"
 MAN_emergency_taxation_desc: "В то время как японцы лишь слегка надавили на наши границы, мы должны принять налоговую политику сейчас, а не позже."
 MAN_economic_propaganda: "Промышленные герои"
 MAN_economic_propaganda_desc: "Серия короткометражных фильмов, освещающих героических рабочих, игравших в ключевых городских районах, оживит людей!"
 MAN_political_hegemony: "Политическая гегемония"
 MAN_political_hegemony_desc: "Казнь нескольких сельских военных баронов, несомненно, заставит остальных остерегаться сопротивления нашему режиму."
 MAN_women_enter_conscription: "Женщины участвуют в конкурсах на помолвку"
 MAN_women_enter_conscription_desc: "В эти трудные времена женщинам тоже придется взять винтовку, чтобы защитить последнее свободное государство Китая."
 MAN_chinese_liberalism: "Китайский либерализм"
 MAN_chinese_liberalism_desc: "Наше дипломатическое окружение вернулось после изучения наиболее важных либеральных государств мира и синтезировало эти важные характеристики, чтобы представлять экономику Северной Китая."
 MAN_supreme_army: "Верховная армия"
 MAN_supreme_army_desc: "Армия Фенгтиана сильнее, чем когда-либо, и все благодаря бесстрашному руководству нашего лидера, [Рот.Возьми лидера]."
 MAN_paying_for_the_manchurians_economy: "Плата за экономику Манчжурии"
 MAN_paying_for_the_manchurians_economy_desc: "Мы передаем часть наших ресурсов и опыта в руки манчжурцев под наше руководство."
 MAN_paying_for_the_manchurians_military: "Плата за манчжурские военные"
 MAN_paying_for_the_manchurians_military_desc: "Мы передаем часть наших ресурсов и опыта в руки манчжурцев под наше руководство."
 MAN_japan_subsidized_economy: "Субсидированная экономика Японии"
 MAN_japan_subsidized_economy_desc: "Япония стала рассматривать нас в качестве бесценного союзника и согласилась поддерживать нашу экономику своими собственными ресурсами."
 MAN_japan_subsidized_military: "Япония субсидировала военные"
 MAN_japan_subsidized_military_desc: "Япония стала рассматривать нас в качестве бесценного союзника и согласилась поддерживать наших военных своими собственными ресурсами."
 MAN_fengtian_rallies_for_the_cause: "Фенгтианские рулетки за причину"
 MAN_fengtian_rallies_for_the_cause_desc: "Фенгтиан выступает против нашего врага!"
 MAN_pseudo_autarky_idea: "Псевдо-Автарки"
 MAN_pseudo_autarky_idea_desc: "Наша страна работает над обеспечением независимого экономического будущего."
 MAN_pseudo_autarky_fixed_idea: "Псевдо-Автарки"
 MAN_pseudo_autarky_fixed_idea_desc: "Наша независимая экономика, по крайней мере, сейчас стабильна."
 MAN_incorporating_foreign_business: "Включает иностранные деловые операции"
 MAN_incorporating_foreign_business_desc: "Некоторые страны мира проявили небольшой интерес к Фенгтиану, и это, безусловно, имеет больше смысла, чем отправить деньги в кучу пепла и сажи на юг!"
 MAN_paying_out: "Выплата"
 MAN_paying_out_desc: "Мы даём деньги американцам, чтобы они финансировали попытку наших военных убить японцев."
 MAN_paid_up: "Выплачено"
 MAN_paid_up_desc: "Манчжуры заплатили за оружие, которое мы им любезно одолжили."
 MAN_american_capitalism_comes_to_china: "Американский капитализм приходит в Китай"
 MAN_american_capitalism_comes_to_china_desc: "Американцы и их деньги прибыли в Китай!"
 MAN_economy_in_the_hinterland: "В. Экономика в Внутренних районах"
 MAN_economy_in_the_hinterland_desc: "Наши инвесторы прибыли в ранее незамеченный регион - Северный Китай."
 MAN_the_silver_age_of_manchuria: "Серебряный век Манчжурии"
 MAN_the_silver_age_of_manchuria_desc: "Манчжурия получила значительные ресурсы от Японской империи."
 MAN_sending_economic_output_to_japan: "Отправка экономического продукта в Японию"
 MAN_sending_economic_output_to_japan_desc: "Японцы нуждаются в экономическом стимулировании - они дали нам то, что мы просили."
 MAN_manchurian_dividends: "Манчжурские дивиденды!"
 MAN_manchurian_dividends_desc: "Манчжурцы выполнили свое соглашение о том, чтобы отправить нам свою экономическую продукцию, и мы сможем использовать это в будущем конфликте..."
 MAN_sending_economic_output_to_japan_2: "Японские дивиденды экстрактов"
 MAN_sending_economic_output_to_japan_2_desc: "Япония получила большие дивиденды от Манчжурии; последние несколько месяцев произошли изменения в нашей экономике..."
 MAN_american_democracy: "Американские демократические идеалы"
 MAN_american_democracy_desc: "Мы многого добились в наших политических путешествиях, но не больше, чем от американцев."
 MAN_british_democracy: "Британские демократические идеалы"
 MAN_british_democracy_desc: "Мы многого добились в наших политических путешествиях, но не больше, чем у британцев."
 MAN_french_democracy: "Французские демократические идеалы"
 MAN_french_democracy_desc: "Мы многого добились в наших политических путешествиях, но не больше, чем от французов."
 MAN_polish_democracy: "Польские демократические идеалы"
 MAN_polish_democracy_desc: "Мы многого добились в наших политических путешествиях, но не больше, чем в польском."
 MAN_persian_democracy: "Персидские демократические идеалы"
 MAN_persian_democracy_desc: "Мы многое получили в наших политических путешествиях, но не больше, чем от персов."
 MAN_independent_fengtian_idea: "Независимый фенгтианец"
 MAN_independent_fengtian_desc: "Независимость теперь, независимость навсегда!"
 MAN_manchurian_economic_gains: "Манчжурские экономические выгоды"
 MAN_manchurian_economic_gains_desc: "Наша экономика и экономика Манчжурии глубоко переплетены."
 MAN_the_silver_age_of_manchuria_2: "Манчжурский экономический серебряный возраст"
 MAN_the_silver_age_of_manchuria_2_desc: "Манчжурия получила большие ресурсы от Японской империи."
 MAN_japanese_investment_eliminated: "Японские инвестиции ликвидированы"
 MAN_japanese_investment_eliminated_desc: "Наши инвестиции в регион Маньчжурии были сорваны местными жителями, как из населения, так и из их правительства!"
 MAN_bandit_army: "Бандитская армия"
 MAN_bandit_army_desc: "Наша армия ввела бандитские элементы, это будет дороже, но нет сомнений, что они сделают что угодно ради монеты..."
 MAN_damage_in_shandong: "Ущерб во внешнем Жили"
 MAN_damage_in_shandong_desc: "Правительство Фенгтиана одобрило агрессивный налет на ключевую индустрию в Шаньдуне."
 MAN_ensuring_the_raiders_stay_back: "Обеспечение того, чтобы бойцы держались в стороне"
 MAN_ensuring_the_raiders_stay_back_desc: "Наше государство должно сейчас работать над тем, чтобы удержать нападавших, которые когда-то наносили удар по нашим северным провинциям."
 MAN_memories_of_the_betrayal: "Воспоминания предательства"
 MAN_memories_of_the_betrayal_desc: "Когда мы думали, что они закончили, когда мы думали, что они наконец увидели нас как истинного китайского преемника, когда мы верили, что они оставили нам всю свою поддержку, они снова на стороне нашего врага."
 MAN_languishing_conscription_rolls: "Сверхсветозаписывающие ролики"
 MAN_languishing_conscription_rolls_desc: "Никто больше не подписывается на армию - они слишком заняты защитой своих собственных домов!"
 MAN_military_disarray: "Военный беспорядок"
 MAN_military_disarray_desc: "Недавние события полностью ввергли нашу армию в хаос - никто не может быть уверен, куда она приведет, но одно наверняка: это не хорошо."
 MAN_no_central_rule: "Нет центрального правила"
 MAN_no_central_rule_desc: "Наше правительство полностью рухнуло и теперь является конфедерацией местных лидеров и правителей наименее строгого типа."
 MAN_softened_standards: "Часто встречающиеся стандарты"
 MAN_softened_standards_desc: "Наши стандарты в отношении вербовки гораздо ниже, так что почти каждый может попасть внутрь."
 MAN_japanese_interests_in_manchuria: "Интересы Японии в Маньчжурии"
 MAN_japanese_interests_in_manchuria_desc: "Японцы приехали в Манчжурию, и они не будут так легко рассеяны, даже сейчас их эффекты играют над нашей страной..."
 MAN_industry_woes_1: "Фенгтские профессиональные союзы качества"
 MAN_industry_woes_1_desc: "Старое, сломанное и устаревшее оборудование Фенгтиана — это реликвия более старшего возраста и продукт смертоносной бюрократии, которая полностью оставила сельскую местность в неустойчивом состоянии."
 MAN_equipment_woes_1: "Клики оборудования"
 MAN_equipment_woes_1_desc: "В последние годы литейные заводы Фенгтиана были перегружены, так как штаты пошли на войну, сожгли их и вновь построили."
 MAN_equipment_woes_2: "Инициатива Гражданские герои"
 MAN_equipment_woes_2_desc: "Наша дивизия будет переполнена преданными офицерами, которые будут обеспечивать, чтобы происхождение оружия их полка заранее соответствовало возросшим стандартам, в случае необходимости силой."
 MAN_industry_woes_2: "Фенгтские университетские союзы"
 MAN_industry_woes_2_desc: "Новое бюро, Бюро по вопросам образования и промышленности, будет работать круглосуточно, с тем чтобы ориентироваться на те места, где наша промышленность является слабой (и наиболее выгодной с тактической точки зрения) и отвлекать ресурсы для оказания помощи этим регионам."
 MAN_industry_woes_3: "Военнослужащие"
 MAN_foreign_designer_goods: "Выплаты разработчикам иностранных и домашних вооружений"
 MAN_foreign_designer_goods_desc: "Наша «патентная армия», которая привлекла отличных кузнецов и дизайнеров доспехов со всего мира, требует огромного количества политической и материальной воли, чтобы продолжать бежать."

