 ### Characters ###
 MAN_zhang_zuolin: "Чжан Зуолин"
 MAN_zhang_zuolin_leader_desc: "Будучи членом бедной семьи вблизи Шэньяна, Чжан Зуолин начал свой метеоритный подъем как бандит, эксплуатирующий хаотичную военную ситуацию в покойной Гуангсю. После губернаторства Маньчжурии Чжан продолжал вести серию войн с кликами Анхуи и Жили, иногда расширяя свое влияние на юг до Шанхая. Несмотря на все усилия Чжана, его экономически нестабильный домашний фронт, вмешательство Германии и военный гений Ву Пейфу видели его снова в провинциях к северу от Великой Стены. С тех пор он завоёвывает старые амбиции, превращая свою бывшую региональную администрацию в бастион республиканизма, претендуя на прямую линию революции в Синьхайе. Его фактическая приверженность демократическим принципам остается видимой."
 MAN_zhang_zuolin_commander_desc: "В то же время, несмотря на все усилия Чжана по созданию экономически нестабильного дома, немецкого вмешательства и военного гениала Ву Пефу, который вновь находился в северных провинциях Великой Стены, Чжан по-прежнему боролся со старыми амбициями с Анхуи и Жили Кликсом, превращая свою бывшую региональную администрацию в бастион республиканства, претендуя на прямую связь с революцией в Синьхайе. Его реальная приверженность демократическим принципам остается очевидной."

 MAN_zhang_xueliang: "Чжан Сюэльян"
 MAN_zhang_xueliang_leader_desc: "Чжан Сюэльян присоединился к армии своего отца в 1917 году и вскоре стал близким другом Гу Сонлинга в Фенгтской военной академии. Его боевой рекорд был смешанным, потерпев достойное поражение во время Первой Жили-Фентийской войны, произошедшее в исключительных случаях во второй, и вновь переживший поражение в третьей и четвертой войнах. Несмотря на то, что ранее считалось, что ему не хватает амбиций, он медленно поднялся, чтобы стать политическим наследником своего отца, а также неформальным лидером так называемой «Жанг Клик». Несмотря на то, что его политическая карьера часто подрывалась проблематичными личными привычками, предположительно, методами преодоления связанных с войной травм."
 MAN_zhang_xueliang_commander_desc: "В 1917 году он вступил в армию своего отца и вскоре стал близким другом Гу Сонлинга в Фенгтской военной академии. Его боевые действия были неоднозначными, потерпев достойные поражение во время Первой Жили-Фентинской войны, которые были проведены исключительно во время Второй, и вновь пережил поражение в ходе третьей и четвертой войн. Не считая, что раньше он считался безысходным, он медленно восстал, чтобы стать политическим наследником своего отца и неофициальным лидером так называемой "Жанг Клик". Несмотря на то, что его политическая карьера часто была подорвана проблематичными личными привычками, предположительно, методами преодоления связанных с войной травм."
 Zhang_Xueliang_dead: "Чжан Сюэлян мертв."
 Zhang_Xueliang_fired: "Чжан Сюэльян уволен."

 MAN_tang_shaoyi: "Тан Шаойи"
 MAN_tang_shaoyi_leader_desc: "В 1912 году Тан Шаойи был первым премьер-министром страны, вскоре после чего он ушел в отставку, ссылаясь на пренебрежение Юаном Шикаем к верховенству права, а затем покинул правительство Сунь Ят-сена по аналогичным причинам. После многих лет в политической стороне японцы вновь затащили старика Тана в национальное поле зрения. Считает ли он себя мучеником или коллаборационистом, является ли он предметом постоянных дебатов, и третий, но все еще известный лагерь говорит о том, что он попал в нечто вроде скромных пороков. Несмотря на то, что теперь он танцует в конце японских струн."

 MAN_ruan_zhenduo: "Руан Чжендуо"
 MAN_liang_shiyi: "Лян Шийи"
 MAN_jin_yunpeng: "Джин Юнпенг"
 MAN_pan_fu: "Пан Фу"
 MAN_cao_rulin: "Као Рулин"

 MAN_guan_xiangying: "Гуан Сиангинг"
 MAN_guan_xiangying_desc: "Рожденный в семье клана гуаня Гуан Сянжинг, с раннего возраста, видел ужасы империализма своими глазами, когда он владел в одной из японских типографских компаний. Он видел, как Манчжурия постепенно упала под влиянием японского народа, и сам стал свидетелем широкомасштабной коррупции Фенгтианской клики, которая владеет обширными равнинами Манчжурии. В 22 лет он вступил в социалистическую молодежную лигу, и когда Северная экспедиция на юге вспыхнула в 1925 году, он присоединился к Китайской синдиалистической партии, присоединившейся ко многим другим во время разгула антиимпериализма. nnnnnnforkyty, в связи с крахом Северной экспедиции и распадом Куоминтанга, Китайская синдикальная партия оказалась еще более дезорганизованной. В эти трудные времена Гуан, как и многие другие, был вынужден прятаться и ждать своего времени для революции. И все же революция действительно пришла, когда иностранные социалистические войска освободили Манчью от японского и Фенка, китайская синтинская партизанская партия стала участником новой войны, и гуанистской диктаторской войны."

 MAN_yang_yuting: "Янг Ютинг"
 MAN_yang_yuting_commander_desc: "ГЕНЕРАЛЬНОЕ ОПИСАНИЕ: §L\n 29 августа 1885/nFaku, Fengtian, Qing Empream\n §Y Военная карьера: §L\nYang Yuting служил начальником штаба Фенгтианского клика в первые дни его существования и участвовал в ранних рейдах против Чжили с Сюй Шуцзюнь Анхуйской кликой. С тех пор он служил начальником штаба Фенгтской армии, начальником армейской подготовки и управляющим фабрики по производству оружия в трех северо-восточных провинциях."Shikan Clique", an informal group of Fengtian officials originally sent to study at Japanese institutions."

