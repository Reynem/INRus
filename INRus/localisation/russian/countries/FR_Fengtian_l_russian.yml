 #### Decisions ####
 #>categories below
 MAN_one_china_policy: "Политика одного Китая"
 MAN_our_china_one_china: "Наш Китай: один Китай"
 #>individual decisions below
 MAN_the_forging_of_a_new_china: "Формирование нового Китая"
 MAN_the_forging_of_a_new_china_desc: "Китай долгое время был раздроблен, разорван на части, за последние несколько десятилетий произошли очень незначительные изменения, и люди устают. Если мы не будем действовать сейчас, моральная ткань китайцев навсегда разорвется! Единство, ответ, требует только обезглавливания змей и подписания бумаги."
 MAN_death_to_pretenders: "Смерть претендентам!"
 MAN_death_to_pretenders_desc: "Жили Клика - это колючка в наших предателях Китаю. И, конечно, их фабрики."

 #### TOOLTIPS ####

 1_MAN_tt: "Чжан Зуолин был застрелен. Ужасное облако покрывает Фенгтиан, и вот-вот вспыхнет борьба за власть."
 2_MAN_tt: "Это может иметь последствия §Rdire в будущем, но, по крайней мере, мы сохраним власть пока."
 3_MAN_tt: "Ожидайте, что японцы пришлют телеграмму..."
 4_MAN_tt: "Мы откажемся от японцев и их адского послания."
 5_MAN_tt: "Японцы и их экономические интересы получат беспрепятственный доступ в нашу страну."
 6_MAN_tt: "Республиканцы будут оказывать влияние на эту страну сейчас, когда Зуолин открыл свою приемлемость."
 7_MAN_tt: "Статизм будет оказывать влияние на политику Фенгтиана, точно так же, как и всегда."
 8_MAN_tt: "Идти по этому политическому пути позволит нам продолжать постепенное улучшение положения в Фенгтиане."
 MAN_bandits_tt: "Мы наймем 6 Бандитских дивизий, чтобы работать на нас."
 MAN_hunters_tt: "Мы вызовем 8 охотников, чтобы сделать грязную работу для нас."
 MAN_urban_tactics_tt: "§YYBuilds 2 форты уровня 2 вдоль границы с Zhili Clique§!n"
 9_MAN_tt: "Охотники и силы штата убьют рейдеров."
 10_MAN_tt: "Мы укрепим нашу столицу красивой архитектурой и королевским домом, пригодным для жизни!"
 11_MAN_tt: "Эта ветвь внутренних дел уже сложена в нашу пользу."
 12_MAN_tt: "Это решение §General §! Наше влияние на Японию.n"
 13_MAN_tt: "Это решение сократит наше влияние на Японию."
 14_MAN_tt: "ACYZhan Sueliang станет лидером Fentian. §!n"
 15_MAN_tt: "Это будет §Gend§!"
 16_MAN_tt: "Сосредоточься на расшифровке §Y"The Forging of a New China"§! decision.\n"
 17_MAN_tt: "§Y Если мы не обратим на это внимание к началу войны, наши ресурсы могут быть экстрадированы еще больше...§!"
 18_MAN_tt: "Сосредоточься на том, чтобы открыть §Y"Death to Pretenders!"§! decision.\n"
 19_MAN_tt: "Мы поймем единый Китай."
 20_MAN_tt: "Это фокус §G автоматическое обход §! Если мы ведем войну только с Жили Клик."
 21_MAN_tt: "Это фокус §G автоматическое обход §! Если мы ведем войну только с Японией."

