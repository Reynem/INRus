 MAN_vehicles_for_men: "Автотранспортные средства для мужчин"
 MAN_vehicles_for_men_desc: "Мобильность будет называться игрой в предстоящих конфликтах!"
 MAN_support_for_soldiers: "Поддержка солдат"
 MAN_support_for_soldiers_desc: "Нам нужно поддерживать здоровье наших бойцов, и если они не здоровы, то, по крайней мере, умеем драться."
 MAN_elite_fighters: "Элитные истребители"
 MAN_elite_fighters_desc: "Не достаточно иметь стандартную армию - армию без движущей силы за ней бесполезна! Нам нужны бойцы, которые превосходят определенные роли, чтобы эффективно побеждать."
 MAN_weapons_for_warriors: "Оружие для военных"
 MAN_weapons_for_warriors_desc: "Если мы хотим выиграть войну, у нас не может быть огромного числа людей, как бы ни было, люди с оружием будут избивать людей самодельным оружием практически все время."
 MAN_quick: "Быстрее"
 MAN_quick_desc: "Наша армия будет работать быстро, чтобы победить врага."
 MAN_clean: "Чистый"
 MAN_clean_desc: "Наша армия будет с осторожностью работать, чтобы победить врага."
 MAN_piles_of_dead_bodies: "Множество"
 MAN_piles_of_dead_bodies_desc: "И если они умрут, они не смогут жить!"
