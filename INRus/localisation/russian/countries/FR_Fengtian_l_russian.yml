 MAN_lu_ronghuan: "Лу Ронгхуан"
 MAN_yuan_jinkai: "Юань Цзинькай"
 MAN_ding_jianxiu: "Динь Цзянься"
 MAN_takema_machino: "Такема Мачино"
 MAN_zuo_zuohua: "Зуо Зуохуа"

 MAN_wu_junsheng: "У Чжуншэн"
 MAN_wu_junsheng_commander_desc: "Он начал свою карьеру в качестве кавалерия, во время первого подавления восстаний и поражения монгольских вторжений, а затем играл важную роль в приходе Чжана Зуолин к губернатору трех северо-восточных провинций. Сам Ву был назначен губернатором провинции Хейлунцзян в 1921 году и остается таковым даже в 1936 году, но его большой возраст и неустойчивое состояние здоровья побудили его начать рассмотрение вопроса о его правопреемстве. Хотя он усыновил сына, его спонсорство подчиненных Маханьшана и Ван Фулина могло видеть его место в любом из этих трех провинций. Он, как известно, был неуклюжим в внутренней политике, но любит маскировать себя как учёного, часто создавая тигровую каллиграфию и рисунки, несмотря на его относительную некомпетентность. Несмотря на то, что он усыновил его сына, его спонсорство подчинённых Маханшана и Ван Фулина, он также имел в виду, что его крупную коллекцию, и его хища, и его дом, где он, как известно, он, имеет дело борьбы с другими обезьянами, часто, а также имеет в своих особенных особнях, и других особняках, и обезьянах, и особняках, и особах."

 MAN_zhang_zuoxiang: "Чжан Зуосян"
 MAN_zhang_zuoxiang_commander_desc: "§L\nZhang Zuoxiang родился в бедной семье как в сельском хозяйстве, так и в бизнесе. После того, как его брат был убит бандитами, он вступил в Фенгтскую армию и стал не только губернатором провинции Джилинг, но и двойным покорным братом Чжана Зуолина. В отличие от Ву Чжуншенга, губернатора Хейлонгзянга, он был известен во время своего правления за строительство железных дорог и университетов. Хотя он больше не является губернатором провинции Джилин, он все еще имеет большое влияние там. Он остается важным членом внутреннего круга Великого Маршала, и часто считается истинным лидером неофициального Чжана Клика, состоящего из преданных ему людей."

 MAN_wang_shuchang: "Ван Шучан"
 MAN_wang_shuchang_commander_desc: "§L\n §YBorn: §L\n 11 сентября 1885\nLiaozhong, Fengtian, Qing Empire\n §Y Военная карьера: §L\n С его выдающимися академическими достижениями Ван Шучанг не только окончил собственную Академию Фентяна, но и продолжил обучение в Академии Имперской японской армии в Сюй Шичанге. Возвращаясь в Китай, он присоединился к Синьхайской революции и стал сотрудником как правительства Наньцзиня, так и правительства Бейянга. Позднее он вернулся в Фенгтскую армию в 1921 году и стал давним членом ее генерального штаба. ~ Он является уважаемым офицером с двусмысленной политической позицией, и, несмотря на его обучение в Японии, у него нет особых отношений с Конкордиейской ассоциацией или Шиканской Клик."

 MAN_ma_zhanshan: "Ма Джаншан"
 MAN_ma_zhanshan_commander_desc: "После окончания Руссо-Японской войны он принял предложение преобразовать свою бандитскую группу в местную партизанскую армию, ответственную за поддержание местного общественного порядка. В 1911 году он присоединился к Ву Цзюньшенгу и позднее подавил мятеж в 1916 году, произошедший в Монголе Бабойабе. Два года спустя он был повышен до важной роли в Хейлонгцзяне в провинции Ву Чжуншенг. После того, как Гу Сонгинг дезертировал в 1925 году, он победил армию Гуаня и похитил его и его жену живыми."

 MAN_wan_fulin: "Ван Фулин"
 MAN_wan_fulin_commander_desc: "Он защищал Манчжурию во время первой Зили-Фентинской войны, разрушал восстание Гуо Сонлинга во время второй Зили-Фентинской войны и оставался офицером и должностным лицом провинции с тех пор. В связи с тем, что Ву Цзюньшен был на грани выхода на пенсию, он стал одним из потенциальных преемников губернатора Хейлоньцзян, хотя его достижения в провинции в основном равносильны строительству библиотеки."

 MAN_zang_shiyi: "Зан Шийи"
 MAN_zang_shiyi_commander_desc: "§L\n В первые годы Zang Shiyi был близким последователем Sun Liechen и установил хорошие отношения с Янгом Ютингом, который однажды рисковал жизнью, пытаясь защитить себя. nLatter Jang Zuolin назначил его губернатором Джилина по рекомендации Ян Ютинга, и из-за его предыдущей работы в управлении Sun Liechen в Jinlin. / no liking некоторые другие сообщники Ян Ютинга, Zang Shiyi являются полусердечным членом Ассоциации Конкордии, считая, что японцы являются полезным и необходимым инструментом, но сохраняя скептицизм в отношении любых дальнейших уступок им. Конечно, его разум не изменён."

 MAN_zhang_haipeng: "Чжан Хайпенг"
 MAN_zhang_haipeng_commander_desc: "§L\nZhang Haypeng служил под командованием бандитского лидера Фэна Делина в первые годы и после поражения Фэна дезертировал в Чжан Зуолин, став командиром кавалерийского отдела. ~ Он служил в трех провинциях и мог считаться в значительной степени аполитичным. Однако он известен жадностью, эгоизмом и взяточничеством, особенно из Японии. Он также имеет историю торговли наркотиками через Мантецу и заставляет гражданских лиц выращивать большое количество опиума на своих землях. Он является членом Конкордийской ассоциации."

 MAN_tang_yulin: "Тан Юлин"
 MAN_tang_yulin_commander_desc: "§L\nTang Yulin первоначально возглавлял банду бандитов в Ляокси перед тем, как вступить в ряды собственных сил Чжана Зуолина. После того как он спас жизнь Чжану, два вечных братства. После неудачного восстания Гу Сонлинг в 1925 году, Тан стал губернатором Рехе, защищая северо-западную часть Манчжурии. Позднее, во время Жилийско-Фентинской войны, ему обещали губернаторство Чахара, если он сможет победить восставшие лиги и баннеры, хотя он и потерпел неудачу. Танг с тех пор последовательно заявляет о своем намерении восстановить Чахар, игнорируя риск угнетания конфликта с Цин, и до сих пор Чжан отказался сделать все предложения."Second Tiger" or "Big Tiger" because of his professed love for the animal, and he frequently greets guests from a tiger-skin sofa. He event claims to have ridden a tiger while hunting in 1929."

 MAN_bao_wenyue: "Бао Венью"
 MAN_bao_wenyue_commander_desc: "§L\nBao Wenyue является начальником штаба и главным мыслителем Чжана Сюэляна. Он является членом радикальной молодежной фракции Фенгтийской армии. Цин считал, что они могут подкупить Бао, чтобы он присоединился к ним из-за его гражданства Манчу, но он сопротивлялся этой просьбе из-за убеждения Чжана. К сожалению, из-за этого он был понижен Чжаном. Он начал приближаться к японской и мантецу и позднее вступил в Конкордию, чтобы получить возможность получить повышение."

 MAN_zhang_jinghui: "Чжан Цзиньхуй"
 MAN_zhang_jinghui_commander_desc: "После встречи с Чжаном Зуэнгом Цзингхуи он поддержал его в качестве лидера режима самообороны и предпочел быть помощником, он служил в качестве главнокомандующего Фенгтианской Вест Роуд Армией в городе Бацзяотай, он был главой полка самообороны и охранял дома богатых бизнесменов в городе. После встречи с Чжаном Зуэнголом, он поддержал его в качестве лидера режима самообороны и предпочел быть помощником, он служил в качестве главнокомандующего Фенгтианской Вест Роуд Армией в городе Первой Зили-Фенгтиа, но его отсутствие решимости и медленных действий не привело к краху всего положения члена Вест-Роудской армии. После войны он жил в Пекине и был назначен начальником Государственной администрации автомобильных дорог. В 1925 году, после смерти его матери, Чжан Зуолин дал ему возможность вернуться домой, чтобы вернуться на похороны."

 MAN_feng_zhanhai: "Фэн Чжаньхай"
 MAN_feng_zhanhai_commander_desc: "Он жил в нищете, после восьми месяцев обучения в школе, он бросил школу, чтобы выращивать свиней, когда ему было девять лет. Он стал подчиненным Чжану Зуосяну в 18 лет и учился в Фенгтской военной академии. Он был бэтменом и был повышен в должности полкового командира полка Джилин Гаррисон. Он не только молод, но и талантлив, он быстро пробурил гарризонский полковник в хорошо обученную силу, что делает его благодарным Чжану Зуолинсу. Он является родственником Чжана Зуосяна, так что он является членом Чжанской Клики. Его положение аналогично положению Маханьшана, так как ему противно японское вмешательство."

 MAN_su_bingwen: "Су Бингвен"
 MAN_su_bingwen_commander_desc: "Несмотря на ожидания своей семьи, молодая Су Бингвен покинула свой дом и вступила в военную академию в Фенгтиане. Он переехал в Пекин в 1910 году и поступил в Баодингскую военную академию в 1912 году за передовые военные стратегии. После окончания школы он присоединился к типовому режиму Юань Шикай. После двух лет в Южном Китае он принял участие в подавлении маньчжуйской реставрации в 1917 году и в вторжении в Владивосток. После войны в Зили-Аньхуи он был включен в Цилийскую академию, но уволен после первой Zhili-Fengtian War в связи с его рождением. После двух лет в Южном Китае он был приглашен Гуо Сонлинго вернуться в Фенгтиан и служить его родному городу. В 1926 году он провел неожиданное нападение, которое привлекло к себе внимание Чжана Сюэлянга. После второго маханского дома он также помог зхилианскому агенту, который не желает заниматься этим вопросом, чтобы его хистанские агенты, он работал в х на х на хозамбийском китайском х."

 MAN_yu_zhishan: "Ю Жишхан"
 MAN_yu_zhishan_commander_desc: "В 1914 году, после Синьхайской революции, Юй Чжишхан отправился в Фенгтьян, чтобы учиться и стать пехотным полковником в 1920 году."

 MAN_zou_zuohua: "Зу Суохуа"
 MAN_zou_zuohua_commander_desc: "§L\n un §YBorn: §L\n un 11 мая 1894 no Yungji, Jilin provent, Qing Empire\n §Y Военная карьера: §L\nA коренной житель Манчжурии Зуоуа получил достаточную удачу, чтобы посещать высшую начальную школу и затем поступить в ряд военных школ. Это было бы связано с его поступлением в Баодингскую военную академию в 1916 году, и через год ему была бы предоставлена возможность учиться в Японии, где он учился в артиллерии. . По мере ухудшения ситуации в Китае его навыки были необходимы для расколотой нации и он вернулся на службу в северо-восточную армию в качестве инструктора по артиллерийскому делу. ~ Эта армия побеждала бы в так называемой Фенгтианской военной академии, а в тумуле относительно молодому офицеру была бы предоставлена возможность учиться в Японии, где он учился на артиллерии."

 MAN_shen_honglie: "Шэнь Хонли"
 MAN_shen_honglie_admiral_desc: "Когда он вернулся домой после окончания школы, ему было приказано начать кампанию по борьбе с наркотиками в средних и нижних районах реки Янцзы в Убее, но он не поступил в военно-морские силы. В 1916 году он стал атташе Еврохиджского режима. После того, как в 1920 году Чжан Зуолинь стал членом Ассоциации, а большинство из них были из Фужоу. Шэнь Хунли, который учился в Японии и был из Губея, не мог быть размещен. Позднее он отправился в Пекин, чтобы служить в качестве военно-морского атташе европейского режима."

 MAN_yin_zuoqian: "Инь-Зуцянь"
 MAN_meng_tieqiao: "Менг Тьецяо"
 MAN_xie_gangzhe: "Се Ганже"
 MAN_li_guidan: "Ли Гвидан"
 MAN_tong_yanbo: "Тонг Янбо"

 MAN_the_old_marshals_clique: "Клика Дашуай"
 MAN_the_old_marshals_clique_desc: "«Клик старого маршала» представляет собой значительное, но стареющее большинство командного состава Фенгтианского командования, истинная сила его членов заключается в их легком доступе к самому Чжану, за которым следует их ветвь связи на северо-востоке. С стратегической точки зрения группа выступает за эффективное материально-техническое обеспечение и проявляет особый интерес к тяжелой артиллерии на оперативном уровне. §!"
 MAN_the_young_marshals_clique: "Клика Шаосуай"
 MAN_the_young_marshals_clique_desc: "«Клика» юного маршала — это смесь личных друзей Чжана Сюэляна и смелых молодых офицеров, которые следуют за его пальто. Многие из них обучаются в западных школах или, по крайней мере, относятся к современным военным методам и технологиям с каким-то волнением. Для Чжана Сюэляна, в частности, это привело к страсти к самолётам и собачьим боям. §!"
 MAN_the_shikan_clique: "Шиканская клика"
 MAN_the_shikan_clique_desc: ""Шиканская клика" носит название Рикугун Шикан Гакко, или "Академии Имперской армии", премьер-министрской военной школы Японии. Большинство ее членов изучали там или в других элитных японских школах, привнося японский военный менталитет в Фенгтианскую Клику."

