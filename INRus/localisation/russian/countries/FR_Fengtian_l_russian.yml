 #### EVENTS ####

 man.1.d: "После того как в 1924 году была сформирована Коалиция против чили, состоящая из Анхуай, Куоминтанга и Фенгтяна, война закончилась в основном неблагоприятным тупиком для Жили. С сохранением Пекина Жили Бейян постепенно стабилизировался, а Жили остались в правительстве. Однако отношения с Куоминтангом на юге быстро сели, началась Северная экспедиция против Бейянга. В то время как Куоминтанг увидел первоначальный успех, вмешательство Шаньси и Шаньдуна затормозило их продвижение, вынуждая к миру между двумя крупнейшими правительствами Китая."

 man.2.d: "На протяжении последних нескольких месяцев Совет Чжана работает над укреплением экономики Фенгтиана. Эти усилия окупились как никогда лучше, чем когда-либо прежде. Хотя эта страна еще не приблизилась к промышленной державе, она по-прежнему доказывает великолепие Совета Чжана - высшей политической власти в нашем штате."
 man.3.d: "Несколько социалистических ассоциаций собрались в последние несколько дней в нашей столице де-юре Хисинкинг и вокруг нее, чтобы продемонстрировать, что они считают несправедливыми, эксплуататорскими и империалистическими отношениями с Японией."
 man.4.d: "Ассоциация Конкордиа, Паназиатская и радикальная политическая секта, сегодня по всей стране бунтует! Японские сообщники ссорились с социалистическими и либеральными элементами в Тяньцзине. С тех пор несколько человек остались мертвыми, а город парализован. В то время как полицейские отряды быстро спустились на волнения, многие в восточной части деревни стали рассматривать беспорядки как доказательство того, что прояпонская популярность больше, чем предполагалось ранее."
 man.5.d: "Сегодня на границе со старой Кореей собрались японские амбассоры, которые пересекли границу и общались с высокопоставленными членами ассоциации, но то, что было связано с этим разговором, еще не известно. Известно, что Ассоциация Конкордии явно посвятила себя свержению нынешнего государства. Кто знает, что может произойти, если они преуспеют."
 man.6.d: "Несмотря на политические волнения последних недель, приятно знать, что многие из наших людей по всей стране поддерживают администрацию Чжана, хотя митинги проводились по всей стране, они были сосредоточены главным образом в Хсинкинге, многие зрители были поражены спектаклями и речами, произошедшими во время этих выступлений, и нет необходимости говорить, что даже Чжан Зуолин был сбит с толку, не ожидая лично проведения митинга, хотя он был более чем рад произнести речь, которая встречалась с бурными аплодисментами."
 man.7.d: "Жан Зуолин был застрелен сегодня Конкордией Ассоциативные бандиты! но к моменту убийства Чжан Зуолин уже был объявлен мёртвым. Фенгтиан спускается в странный межрегнум, и без твердой и хорошо похожей головы, неизвестно, кто возьмет власть Манчжурии..."
 man.8.d: "Чжан Зуолин, наш бывший лидер, был похоронен сегодня в Хсинкинге недалеко от старого Имперского дворца, где присутствовал основной лояльный персонал, включая его совет, были проведены более широкие церемонии по всей стране."
 man.9.d: "Сегодня Совет Чжана объявил о создании Палаты доверия, в состав которой входят главным образом бывшие члены Совета, а также некоторые видные министры экономики и предположительно лояльные военные и генералы."
 man.10.d: "После продолжительного обсуждения Палата доверия пришла к компромиссу - избрание сына Чжана Сюэляна, «Молодого Маршала», на пост главы государства."
 man.11.d: "Чжан Сюэльян выступил сегодня на инаугурации с вдохновляющей речью, заявив, что Фентиан войдет в следующее десятилетие в состав мировой супердержавы."
 man.12.d: "В шокирующий поворот событий сегодня, несколько важных военных потребовали, чтобы Чжан Сюэлян передал им власть!"
 man.13.d: "В ответ на агрессию главы государства против важных военных деятелей в настоящее время в столице де-факто был совершен переворот."
 man.14.d: "Сегодня Чжан Сюэльян отправился из Ссинкинга в семейный летний дворец в сельской местности, где можно только предположить, что власть перешла в руки армии Фенгтиана, народ собирается вернуть его к власти, хотя с военными союзниками, состоящими из нового правительства, эти демонстрации обречены на провал."
 man.15.d: "Большинство офицеров и капитанов, причастных к перевороту, были вновь захвачены и содержатся под стражей до дальнейшего уведомления."
 man.16.d: "Демонстрации по всей стране проходят по крайней мере последние несколько недель, и только обещают стать еще хуже."
 man.18.d: "День был наполнен республиканскими демонстрациями по всей стране, когда люди пришли вспомнить об обещаниях Чжана Зуолина несколько недель назад."
 man.19.d: "Этот день был наполнен профсоюзными демонстрациями против того, что они считают удушением людей в политическом и экономическом плане."
 man.20.d: "День был наполнен японскими сочувствующими и сообщниками, которые лихорадочно трудились, чтобы Фентиан работал вместе с иностранной угрозой!"
 man.22.d: "Демонстранты, какими бы отвратительными они ни были, были подавлены, и полиция и военные сохраняют полный контроль над всеми районами страны, которые имеют значение."
 man.23.d: "Правительство было брошено, совет нигде не найден, и люди в городах беспокоятся."
 man.24.d: "Только несколько дней назад военные отчаиваются от казней, два из наших высших руководителей и несколько из тех, кто находится под ними, сейчас мертвы или находятся в заключении, и кто может сказать, что с ними случится, в такие времена необходимо определить будущую судьбу военных, Чжан Сюэлян может либо взять на себя прямой контроль, либо проводить политику, которая вытянет людей и лидеров со всего Фенгтия."
 man.25.d: "На базах никого нет, а на контрольно-пропускных пунктах нет людей, чтобы их нанимать. Есть ли полиция в участке или охранники, которые ходят по улицам? Может ли кто-то, кроме личного телохранителя Чжана Сюэляна, защитить его? В Фенгтиане больше нет правительства, и нет никого, кто мог бы его поддержать. Завтра, когда на рассвете, можно предположить, что Фенгтиан за многие годы до этого больше не будет."
 man.26.d: "Личный кабинет [Root.Get Header] ушел в отставку вместе с его Советом, и они, по всей видимости, планируют вернуться в места, откуда они появились."
 man.27.d: "Грабеж в столице достиг сегодня рекордного уровня и продолжается в течение последних нескольких дней. Сюэлян больше не может быть найден в стране, хотя он посещал свой летний дворец; предполагается, что он сбежал на запад, возможно, в Монголию или Шанси, хотя его там и не нашли."
 man.28.d: "После краха центрального правительства местные правители взяли на себя прецедент над своими соответствующими поселками, деревнями и графствами. Хотя Фенгтиан все еще существует номинально, он не уверен в том, в какой степени эти правители будут сохранять контроль над тем, что существует в государстве или в его вооруженных силах."
 man.29.d: "Города рушатся, правители в этих населенных пунктах не в состоянии держать их вместе, люди выезжают в поисках пищи и оружия, не имея центральной власти для контроля над этими людьми, вполне вероятно, что города не будут функционировать через пару месяцев, если государство не восстановит каким-либо образом порядок."
 man.30.d: "Проявившая японскую политическую группу «Ассоциация Конкордии», которая в предыдущие годы была шикарной на стороне правящей элиты, оказалась на переднем плане того, что осталось от политики Фенгта. По просьбе и при поддержке японского правительства, Конкордистская ассоциация смогла завоевать крестьян и недовольных рабочих в сельских районах Фенгтиана. Какой успех будет у них в городских районах еще предстоит увидеть, но их позиции ясны: единый Китай, дружелюбный по отношению к японцам и паназиатская фракция, чтобы соперничать с любым другим."
 man.31.d: "Клика связи, состоящая главным образом из старой правящей элиты и многих десятков самых могущественных индустриальных королей в Фенгтиане, наконец-то смогла доминировать в городской политике, которую они не занимали в последние несколько десятилетий, не без своих попыток. Они обещают народу экономическую свободу, олигархическую республику и свободный и единый Китай. Сколько из этих обещаний они могли бы выполнить, но очевидно, что их доктрина становится все более популярной среди недовольных городских жителей."
 man.32.d: "В связи с недавним ослаблением власти любых центральных органов новые группы интересов Ассоциации Конкордиа и Группы связи объединились в целях восстановления порядка в Манчжурии, и предполагается, что благодаря богатству и народной поддержке они смогут добиться успеха, по крайней мере на данный момент."
 man.33.d: "Либералы и республиканцы, хотя и берут на себя меньшее число групп, стремящихся к политической власти, по-прежнему требуют внимания. Многие из их самых известных представителей, таких, как Тан Шаойи и Лянь Шийи, ездят по Китаю, обсуждая то, что думают их «верхние стороны». К сожалению, мы не можем просто убить их. Однако, несколько преданных членов нашего правительства обратили внимание на то, что многие из членов либеральных и республиканских движений имеют тёмное прошлое, которое в некоторых случаях относится к Цин. Мы можем либо позволить им продолжать демонстрировать, либо использовать эти знания, чтобы... преподать им урок в обращении с нашим правительством. Если бы население могло завладеть ведом об этом развитии, но..."
 man.34.d: "Нестабильность последних нескольких месяцев вызвала реакцию японского правительства! Они требуют, чтобы мы подчинились им. Когда мы ответили на вопрос о том, означает ли это политическое, экономическое, военное или комбинацию из трех, они ответили, что это еще предстоит увидеть. Хотя это предложение еще не открыто для более широкого мира, оно не может быть раскрыто в ближайшее время. Есть только один вариант..."
 man.35.d: "Нестабильность последних нескольких месяцев вызвала реакцию японского правительства! Они требуют, чтобы мы подчинились им. Когда мы ответили на вопрос о том, означает ли это политическое, экономическое, военное или комбинацию из трех, они ответили, что это еще не было замечено. Кроме того, они обнаружили что-то еще - они знают, что мы шантажировали несколько республиканских фигуристов! Они угрожали нам - наш личный шантаж. Конечно, эта хунта более стабильна, чем когда-либо, и мы можем быть уверены, что люди стоят за нами!"
 man.36.d: "Правительство Японии выдало лицензии нескольким своим выдающимся компаниям, уравнивая это правом японских интересов на вступление в Фенгтиан и конкуренцию с отечественными предприятиями."
 man.37.d: "Японцы встретили наш отказ! несколько брошюр и досье были воспроизведены и отправлены в несколько СМИ страны, хотя армия в настоящее время проводит расследование и подавление, не секрет, что население в целом уже знает все, что нужно знать. В то время как республиканцы и либералы задерживаются как мученики, очевидно, что самым большим политическим влиянием этого события будет то, что произойдет рядом с нашим правительством. Оно почти не удержится, и это лишь вопрос времени, когда армия и полиция присоединятся к протестующим, которые уже собираются, как они, кажется, очень часто делают в эти дни, в крупных городах по всей стране."
 man.38.d: "Японское правительство пришло для того, чтобы объявить о своей доктрине совместного процветания, в которой намечена совместная Восточная Азия. Не нужно много читать между строк, чтобы увидеть, что они хотят считать себя гегемоном этого нового континента. Общественность возмущена недавним поворотом событий, но каждый японский посол провозглашает равенство между нашими странами, и что это не военное поглощение. Истина этого факта не разочаровала самых сильных китайских националистов в нашей стране от того, чтобы выйти и выступить против этого решения."
 man.39.d: "Сегодня в столице де-факто наш противоречивый лидер [Root.Get Header] объявил персону политики одного Китая и выступил с речью о трудностях, с которыми сталкивался китайский народ в прошлом веке. Обещание вернуться к аграрному и независимому прошлому , подробно рассказал о новом сотрудничестве с японцами и объявил их инструментом, а не угрозой. Эта речь привлекла множество людей, но это было его первым галантным публичным выступлением за несколько месяцев, которое позволило многим оживить вокруг него и укрепить его популярность."
 man.40.d: "Несмотря на неустойчивое положение, в котором оказались вооруженные силы Фенгта, руководство Чжана Сюеляна и общестрановая доктрина позволили ему продолжать нормально функционировать, и ожидается, что в предстоящие недели все проблемы, связанные с военными, которые были вызваны им, будут устранены или забыты."
 man.41.d: "Заголовок «президента Китайской Республики» на протяжении многих десятилетий был ненадежным, поскольку это название, как правило, приносит несчастье тем, кто берет на себя его мантию. Многие предыдущие люди, заявившие себя таковыми, были свергнуты менее чем саворийными путями. Теперь он также несет дополнительный вес с правительством Куоминтанга на юге, которое также считает себя законным преемником первой республики Китая, это стало проблемой. С помощью этого акта, который транслировался по всей стране, ясно, что Сюэлян стал достаточно храбрым или надменным, чтобы предположить, что он может преодолеть все осложнения, связанные с историей титула."
 man.42.d: "По всей видимости, японцы в ближайшие несколько дней отправят личное дипломатическое послание."
 man.43.d: "Мы только что получили телеграмму от японцев! Они требуют, чтобы после смерти Чжана Зуолина мы подчинились им, как собака! Они утверждают, что-то о непристойности и неэффективном правиле, но они явно не слышали трансляцию Сюэляна. Он президент, главный советник и Большой Маршалл Фенгтиан. Они явно не информированы. Как мы должны реагировать?"
 man.44.d: "Сегодня Япония выступила с официальным заявлением после того, как мы осудили их поездку, заявив о том, что они соблюдают суверенитет Фенгта."
 man.45.d: "Мы посмотрим, что это будет значить для Фенгтиана..."
 man.46.d: "Японский бизнес сейчас начался через границу, и из Чосона в восточную часть Фентиана."
 man.47.d: "Фентиан стоит наедине с Китаем, одним государством против тех, кто хотел бы помешать ему. Будущее выглядит мрачным и светлым в то же время, и только благодаря хитрости Чжана Сюэляна, как Маршала, определит, станет ли Фенгтиан доминирующей китайской властью или другой маленькой страницей в анналах истории..."
 man.48.d: "За последние годы Чжан Зуолин принёс Фенгтиану список новых свобод, но в последнее время он сделал алюзии к республике, хотя точно, какую форму она примет, неясно. Воспоминания Китайской Республики все еще пронизывают культуру каждого китайского государства, и это привело к своего рода волнениям среди либералов и республиканцев, которые сделали реставрацию за последние несколько лет."
 man.49.d: "В ответ на все более активные усилия различных политических групп в Фенгтиане Чжан Зуолин де-факто приедет в столицу Хинкинг, чтобы посетить столицу в течение следующих нескольких дней и выступить с речами перед массами Манчжурии."
 man.50.d: "Рейдеры, которые «устроили» наши негерманские провинции в Хейлунгкяне, напали на местную инфраструктуру сегодня и сбежали со значительным количеством грузов и заключенных, которые, скорее всего, попадут на прибрежные черные рынки."
 man.51.d: "Недавно наше правительство проводило политику общественных работ, чего очень не хватало с момента самоудовлетворения [Рот.Гетнам]. Теперь у нас есть выбор выбрать наш следующий проект. Следующий будет доступен нам, как только мы соберем достаточно взносов, чтобы сделать это снова."
 man.60.d: "Недавно наше правительство проводило политику общественных работ, чего очень не хватало с момента самоудовлетворения [Рот.Гетнам]. Теперь у нас есть выбор выбрать наш следующий проект. Следующий будет доступен нам, как только мы соберем достаточно взносов, чтобы сделать это снова."
 man.52.d: "[Рот.Гетнам] уже давно является многоэтническим государством, и это вызывает некоторые проблемы, поскольку каждая этническая группа пытается отстаивать свою собственную. Хотя это обычно было спором между Ханом и Манчу, некоторые другие группы оказываются в противоречии. Ответ, [Рот.гейтер] сказал, может быть, официально признать одну культуру."
 man.53.d: "Манчжурская народная ассоциация, социалистический конгломерат профсоюзов, давно ходатайствующий о прекращении нашего государства, теперь должна быть призвана к тому, что они сказали. Лидеры Железнодорожного союза, в состав которого входят почти все железнодорожные рабочие в стране, были вызваны в Хизенхинг, они будут выступать в качестве делегатов от самой политической ассоциации. Теперь мы должны потребовать от них, что будет сделано."
 man.54.d: "Рейдеры Хейлунгкьяна в предварительном порядке согласились с нашим контрактом, мы заплатим им за произведенные товары, и они больше не будут нападать на нашу экономическую инфраструктуру."
 man.55.d: "Манчжурцы послали своих грабителей в наши приграничные провинции, чтобы украсть наши ресурсы и нанести ущерб нашим фабрикам. Приходят сообщения о том, что они также украли оборудование наших фабрик. До того, как местные ополченцы и другие вооруженные группировки смогли ответить, они сбежали через границу, и тогда стало ясно, что они действуют в тандеме с манчжурской армией."
 man.56.d: "Наши наёмные рейдеры вернулись через границу с минимальными жертвами с огромными богатствами!"
 man.57.d: "Рейдеров больше нет, но мы должны обеспечить, чтобы мы больше никогда их не видели."
 man.58.d: "Рейдеры, которые снова и снова бьют нашу индустрию, но самое серьезное в начале 1936 года, сейчас находятся на наших объектах, и наши военные собрались на несколько дней над холмами некоторых мишеней."
 man.59.d: "Налеты нескольких месяцев назад официально окупились в полном объеме, что подтверждают недавние сообщения о выпуске промышленного комплекса Хейлунгкианг."
 man.601.d: "Армия готова к улучшению, и наши старшие офицеры собрались вместе, чтобы обсудить это, вместе с любыми военно-воздушными маршалами и капитанами военно-морского флота, которые мы можем собрать вокруг столицы."
 man.62.d: "Правительство было брошено, совет нигде не найден, и люди в городах беспокоятся."
 man.63.d: "Наше правительство, которое было построено на предположении о том, что японцы собираются поддержать нас после смерти нашего бывшего лидера Чжана Зуолина, вновь оказалось неверным. Японцы, очевидно играющие в какую-то чрезвычайно сложную политическую игру Го, решили, что это все время будет прекрасное время, чтобы поддержать Жили, вместо этого. Это привело к ужасным беспорядкам и насилию в последние несколько дней, когда народ этой страны начинает верить, что его снова предали!"
 man.64.d: "Япония предала нас, но теперь [король. Возьмите лидера] стоит астридно, запятнанно, но безукоризненно и провозглашает, что Азия, раз и навсегда, является достоянием Китая. Он заявил сегодня в своей речи, что Фентиан, сейчас и навсегда, является истинной китайской силой."
 man.65.d: "Очевидно, что страна, в ее нынешнем состоянии, больше не в состоянии двигаться дальше. Так что, когда солнце закатывается на Фенгтскую клику, теперь оно тоже закатывается на [королеву. Гетнаме]. Некоторые предательства глубоко запоминаются народом. Это один из таких примеров."
 man.66.d: "Фенгтиан и его безжалостное правительство вышли на путь завоевания, и, похоже, они пришли к нам в неразвитую, но тактически важную провинцию Сююань."
 man.68.d: "На протяжении последних нескольких дней в сенате разгорелись споры о том, что должно произойти с полицейским аппаратом, оставленным на улицах наших крупнейших городов."
 man.69.d: "Клика коммуникаций решила, что наше правительство следует старому государственному аппарату, на котором они, скорее всего, будут спокойно сидеть, в то время как Ассоциация Конкордии ратует за то, чтобы тех военнослужащих, которые служат коррупции, посадили в тюрьму или еще хуже."
 man.70.d: "Китайская Республика, которая фактически перешла в несколько взаимно враждебных государств и одну очень враждебную военную диктатуру на юге, является болезненной мыслью в воспоминаниях манчжурского народа, в большей степени Манчуса, чем Ханса, поскольку она безрассудно привела к прекращению династии, возглавляемой Манчжу. Нашему правительству на самом деле не пришлось занимать позицию в отношении того, во что они верят в Республику, но с отменой Цуолина, и с установленной сейчас сенатом, пытающимся избрать главу государства, мы можем использовать среди тех, кто лоялен, что мы сами являемся преемником самой Китайской Республики."
 man.71.d: "Наше правительство, которое было между различными группировками в последние несколько месяцев, наконец-то пришло для проведения своих выборов."
 man.73.d: "Сенат, который молча работал за кулисами в Фенгтиане в течение некоторого времени, официально закрылся сегодня, после голосования не так давно."
 man.74.d: "Сегодня в Сенате вспыхнула драка! Члены с разных сторон острова, в том числе самые странные из тех немногих членов научно-исследовательской лиги и Республиканской партии, по поводу демократических реформ. Несколько десятков сенаторов получили ранения. Трудно сказать, кто именно начал это, но ясно, что партия [Рот.Гедер] положила этому конец."
 man.75.d: "Члены Республиканской партии, недовольные прогрессом олигархической коммуникационной группы, организовали против них при поддержке Ассоциации конкордии меньшинства и научно-исследовательских кликов, только вчерашний законопроект полностью перестроил процесс избрания сенаторов с руководящими принципами, которые прямо поставили под сомнение выборы большинства членов Коммуникации."
 man.76.d: "Исследовательская группа вместе с другими группами в сенате меньшинств, в частности с Кликом связи и Республиканской партией, приняла сегодня закон, запрещающий финансовую поддержку сенаторов из иностранных государств, в результате чего большинство членов Ассоциации Конкордии были отстранены от работы в Сенате."
 man.77.d: "Республиканские сенаторы, которые всего несколько недель назад оказывали помощь в отстранении от должности членов Ассоциации по связям с общественностью, потребовали, чтобы несколько членов Ассоциации Конкордии ушли со своих постов."
 man.78.d: "Исследовательская группа, ответственная за свержение сенаторов Конкордии несколько недель назад, потребовала места в нашей правящей коалиции! Они пытаются узурпировать процесс сената и доминировать в нашем процессе разработки политики!"
 man.100.d: "Лидер Ассоциации Конкордии в Сенате Као Рулин сегодня отошел от своего места и, по сути, от всего правительства Фенгтиана. В то время как некоторые манчжурские СМИ предполагают, что это означает, что Япония придет, чтобы оставить наше государство в покое, по-прежнему ясно, что это всего лишь короткий прорыв в имперских амбициях Империи."
 man.79.d: "Пожилой лидер Клики связи Тан Шаойи заявил, что у дефекатов здоровья и политической нестабильности есть причины, по которым он сегодня освободил свой пост лидера Клики связи в Сенате, что, скорее всего, опасно для политических перспектив Клики связи в течение долгого времени, и то, что поставило их на колени в первой республике, может также сделать то же самое и в этом..."
 man.80.d: "Не так давно республиканец был предметом большого обсуждения, но наш лидер принял свое собственное осознанное решение, и теперь, с учетом опасностей ближайшего прошлого, мы должны раз и навсегда заняться этой темой."
 man.81.d: "Наступили выборы в [Грейд]! что люди будут поддерживать его в Лиге Рынков. только время покажет..."
 man.82.d: "Манчжурия - довольно нестабильная нация. В будущем она должна будет принять решение §Grally for §! или §R противо§! Японская поддержка. Жили, однако, попытаются сделать то же самое. Наш старейший враг, кажется, намерен уничтожить нас с их помощью. Кроме того, многие события и фокусы будут четко указывать на то, как они влияют на наше влияние на Японию и как. Чем больше наше влияние, тем больше вероятность того, что мы будем поддерживаться японцами, но некоторые решения могут спасти это отношение или разорвать его. Через пару месяцев у нас будет выбор между тремя возможными фьючерсами - сконцентрироваться на дереве, чтобы выяснить, как далеко и вниз и как близко вы к одному из них!"
 man.83.d: "Манчжурианцы, как никогда нуждающиеся, просили, чтобы мы дали им экономические стимулы, чтобы помочь им в их будущих начинаниях."
 man.84.d: "Японцы, очевидно, перевернули новый политический лист, согласились субсидировать наше восковое и ослабляющее экономику своими собственными стимулами!"
 man.85.d: "Японцы, когда-либо злобные змеи, отказались от нашей просьбы об экономическом стимулировании."
 man.86.d: "Армия Фенгтиана, кажется, слаба, и они пришли к нам за помощью."
 man.87.d: "Наша армия, которая в настоящее время тонет после хаоса, имевшего место несколько месяцев назад, несомненно, будет подвергнута осуждению - японцы приняли нашу просьбу о предоставлении кредитов нашим оружейным заводам."
 man.88.d: "Наша армия, которая в настоящее время тонет после хаоса, произошедшего несколько месяцев назад, должна будет найти другой способ вернуть себе силы, которые у нее были."
 man.89.d: "Фенгтиан просил, чтобы мы помогли им в их промышленной эксплуатации, которая, безусловно, пригодится, если наши страны смогут прийти к соглашению."
 man.107.d: "Японцы, которые, как мы думали, не упадут ниже, сегодня объявили об отказе от нашей просьбы об экономической поддержке."
 man.90.d: "Военачальники уже давно прячутся через поговорку о длинной траве и поощряют коррупцию по всему штату."
 man.91.d: "Фенгтиан, могущественное государство-военный в северной части Китая, попросило нас помочь им в борьбе против имперской Японии, пытающейся уничтожить их, и, конечно же, они предложат нам деньги."
 man.92.d: "Американцы поддержали нас против Японии!"
 man.93.d: "Мы даже предложили им наши чертовы деньги, нам нужно найти другой способ победить японцев..."
 man.94.d: "Китайцы прислали нам новые договоры аренды на наши фабрики за оружие, которое мы им дали. К счастью, с нашей собственной, конечно же, высшей экономической системой мы свели к минимуму и максимально увеличили размеры этих заводов, которые должны предоставить нам больше ресурсов, чем манчжурцы теряют."
 man.95.d: "Фенгтианская клика попросила, чтобы мы поддержали их против Японии, если японцы нападут на них, они говорят, что мы тоже должны начать войну против Японии!"
 man.96.d: "Американцы поддержат нас против Японии!"
 man.97.d: "Американцы не поддержат нас. Что теперь?"
 man.98.d: "Японцы пришли в Хсинкинг и получают экономическую аренду и гранты на работы, которые они для нас создали."
 man.99.d: "Манчжурцы предложили нам аренду и гранты на заводы, чтобы оплатить фабрики, которые мы для них построили."
 man.101.d: "Наши дипломаты и промышленники вышли в мир, в самые успешные демократии."
 man.102.d: "Мы предоставим японцам аренду и гранты в качестве компенсации за их долги за последние недели и месяцы, это единственная моральная вещь, которую можно сделать, и, возможно, единственная вещь, которая поможет им быть счастливыми."
 man.103.d: "Японцы пришли в Хсинкинг и получают экономическую аренду и гранты на работы, которые они для нас создали."
 man.104.d: "Они утверждают, что эта война не просто мелкая ссора, но и борьба за будущее самого Китая."
 man.105.d: "Жили дрожат в своих гнилых сапогах при виде наших полков, сливающихся с холмов в приграничные провинции Шаньдун, мы возьмем у них то, что нам по праву причитается, и сделаем великие благодеяния в этом процессе, мы потеряем некоторых людей, но и они будут, так что в конце концов это будет работать на нашу пользу."
 man.106.d: "Жестокие солдаты-фенгтианцы с севера начали небольшое наступление через границу, рейды и убийства в процессе. Само государство понесло большие потери. Хотя они и потеряли некоторых людей, это не будет их последним пропуском в наши земли. Нет, это всего лишь предупредительный выстрел!"


