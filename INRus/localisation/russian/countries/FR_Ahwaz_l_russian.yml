 ##events##
 KHU.1.t: "Мезопатамский или персидский?"
 KHU.1.d: "Эмират аль-Мухаммараха, как и любой другой эмират залива, является субъектом Британской империи, но это другое, потому что он самый большой, самый могущественный и самый богатый. Он был создан из провинции Хузестан, чтобы защитить британские нефтяные интересы после того, как Персия в начале 1920-х годов впала в нестабильность. С тех пор его бывший шейх, Хазал, который был самым богатым человеком в мире, был свергнут британиейцами в 1926 году после его отказа предоставить новый экономический контроль британской нефти и был заменен его сыном Абдулом Каримом. nnnAhwaz расположен между Масриком и Персией, и хотя оба утверждают, что он является частью их нации, в Ахвазе им плевать, что они ахвази арабы, которые сами по себе являются уникальными вещами."
 KHU.1.a: "Ахваз не является ни уникальным, ни уникальным."

 KHU.3.t: "Завершение выборов"
 KHU.3.d: "А победители - либералы?"

 KHU.4.t: "Вопрос о племенах"
 KHU.4.d: "У племен так много оружия в их руках, должны ли мы захватить их?"
 KHU.4.a: "заставить племена сдать свое оружие"
 KHU.4.b: "Не раздражай племена"

 khupersia.1.d: "Британская хитрость привела к краже нашей провинции Хузестан у нас в 1920-х годах. Теперь мы вернулись к силе. Британия притворялась, что наша внутренняя нестабильность, теперь, когда мы восстановили порядок, мы могли бы попытаться решить этот вопрос дипломатическим путем. Или мы могли бы просто прибегнуть к неприкрытой силе."

 khupersia.2.d: "С начала 1920-х годов мы управляли Хузестаном через его шейха, безукоризненно защищая наши нефтяные интересы в регионе."

 khupersia.3.d: "С начала 1920-х годов мы управляли Хузестаном через его шейха, безукоризненно защищая наши нефтяные интересы в регионе."

 khupersia.4.d: "С начала 1920-х годов мы управляли Хузестаном через его шейха, безукоризненно защищая наши нефтяные интересы в регионе."

 khupersia.5.d: "Британцы отказались, и сейчас мы должны решить, каким будет наше решение."

 khupersia.7.d: "Британцы оставили нас тусоваться, чтобы высохнуть, и теперь мы сталкиваемся с полной мощью персидской армии на пороге."

 khupersia.8.d: "Похоже, шейх страдает от иллюзий величия, видя себя равными и отталкивая наши силы от переезда."

 khupersia.9.d: "Шейх согласился с нашими требованиями, и сейчас иранские силы переезжают в этот регион."

 khupersia.10.d: "К сожалению, наше возвращение Хузестана было сопряжено с оговорками, и сейчас мы должны отказаться от определенного политического контроля над регионом и передать права на нефть BP. Однако в будущем мы знаем, что такое положение дел не будет длиться долгое время."


 ##Ideas
 KHU_British_Protectorate: "Арабестанская защита"
 KHU_British_Protectorate_desc: "Эмират Аль-Мухаммарах, как и любой другой эмират Галфа, является субъектом Британской империи, но это другое, потому что он самый большой, самый могущественный и самый богатый, это бывший шейх, Хазал был самым богатым человеком в мире, но он был свергнут британией в 1926 году после его отказа предоставить экономический контроль британской нефти и был заменен его сыном Абдулом Каримом."
 KHU_Arab_Nationalism: "Арабский национализм"
 KHU_Arab_Nationalism_desc: "Как и любая другая арабская страна, Ахваз не является исключением из арабского национализма, потому что он был подчинен Великобританией, а большинство ее народа - арабами."
 KHU_Persian_Minority: "Персидское меньшинство"
 KHU_Persian_Minority_desc: "Хотя большинство населения - арабы, есть некоторые мелкие люди, такие как Лурс, курды и персидцы, другие двое - это не проблема, а персидцы, поддерживаемые Персией, хотят вернуться к правлению персов."

