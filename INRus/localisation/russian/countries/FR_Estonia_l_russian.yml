EST_FUHRERREICH_DESC: "Эстония на протяжении многих веков находилась под контролем иностранных держав. И наконец, в 1918 году на завершающем этапе Великой войны Эстония увидела возможность обрести независимость и смогла добиться ее. С тех пор Эстония стала свидетелем политической нестабильности и волнений, приведших к объявлению военных законов и нынешнего режима при Патриотической лиге Константина Петса. Однако его власть не в полной мере защищена."
