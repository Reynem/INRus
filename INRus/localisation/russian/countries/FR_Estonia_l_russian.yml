### Events ###

estonia.1.t: "Статус Эстонии"
estonia.1.d: "Эстония впервые увидела независимость в последние дни Великой войны, в 1918 году, после того как Ливонцы, шведы и русские в течение своей истории управляли ею. Но независимость не была свободной, когда как Немецкая империя, так и только что образованный Советский Союз пытались поставить Эстонию под свой контроль. В начале 1920 года Эстония, однако, смогла бы сохранить свою независимость и свою землю. В начале 1930-х годов нестабильность и рост правого движения &quot; Вапс &quot; привели бы к тому, что правительство, возглавляемое Константином Патсом, стало бы инициатором маршальского закона. Однако это привело бы к созданию Патриотической лиги Пятами и его сторонниками, усилению цензуры и запрещению всех других политических партий. Даже с этими мерами движение &quot; Вапс &quot; продолжало бы расти в своей идеологии."
estonia.1.a: "Давайте посмотрим, куда ветрено впадает"

estonia.2.t: "Слухи о кубоке"
estonia.2.d: "С начала применения Военного закона в 1934 году всегда было несколько испуганий того, что оппозиционные фигуры начнут переворот против нашего правительства. Теперь кажется, что эти шрамы вполне обоснованы, поскольку слухи о заговоре с целью свержения эстонского правительства. Несмотря на то, что Эстония сумела распустить большинство политических партий, нет уверенности в том, что эти бывшие партии не действуют так, как если бы они все еще действовали."
estonia.2.a: "Посмотри дальше..."

estonia.3.t: "Путь к тому, чтобы свергнуть правительство"
estonia.3.d: "Хотя наши источники указывают на то, что члены Движения Вэпс стоят за этим заговором, нет уверенности в том, что у их лидеров есть что-то с ним. В то же время вероятность того, что это еще один коммунистический заговор. Даже в этом случае, кажется, что только Вапы имеют популярность и влияние в Эстонии, которые могут бросить нам вызов. Хотя мы арестовали Андреса Ларку, лидера этой группы, Артура Сирка, еще одного лидера движения, все еще находится на свободе, в настоящее время находится в изгнании в Финляндии. Однако он все еще может представлять угрозу для нашего правительства."
estonia.3.a: "Это, должно быть, Сирк!"
estonia.3.b: "Давай отойдем от беспочвенных обвинений"

estonia.4.t: "Что делать с Сирком?"
estonia.4.d: "Вместе с Артуром Сирком, заместителем лидера Движения Вэпсов, все еще находящимся в изгнании в Финляндии, нам трудно попытаться арестовать его, не проконсультировавшись с правительством Финляндии, однако, вероятно, что финны примут наше обвинение в его причастности к заговору в качестве факта, что приведет к возможной экстрадиции."
estonia.4.a: "Давайте попробуем его арестовать."
estonia.4.b: "Клади что-нибудь в его выпивку."

estonia.5.t: "Эстония просит выдать Артура Сирка"
estonia.5.d: "Наш братский сосед на юге, Эстония, попросил нас выдать Артура Сирка, одного из лидеров Эстонского движения Вэпс, им. Они дали нам хорошие доказательства, чтобы экстрадировать г-на Сирка, и он несет ответственность за заговор с целью свержения эстонского правительства. Хотя есть малая вероятность, что эти преступления могут привести к тому, что мы выдадим его, они были бы слишком прокляты, чтобы не верить в них. Даже тогда Эстония не нарушала нашего доверия раньше, так что это кажется безопасным выбором."
estonia.5.a: "Вот ваш преступник."

estonia.6.t: "Артур Сирк арестован"
estonia.6.d: "Сегодня финский военный самолет приземлился на воздушный порт в Талинне, привезя с собой Артура Сирка."
estonia.6.a: "Ларка, у тебя есть рота!"

estonia.7.t: "Смерть Сирка"
estonia.7.d: "Наш убийца успокоил нас, что заговор с целью убийства Артура Сирка был полезным, в поздний вечер, во время выпивки, наш убийца умудрился засунуть что-то в свой напиток, пока никто его не видел, но с его смертью многие теперь знают, что его смерть была больше, чем просто случайным походом с пищей."
estonia.7.a: "Поистине, Наше Слово скреплено!"

estonia.8.t: "Нация поражена беспорядками"
estonia.8.d: "Новости об убийстве Артура Сирка не были хорошо восприняты его сторонниками в Эстонии, и, начиная с демонстрации соболезнований друзьям и семье Сирка, они быстро переросли в несколько беспорядков по всей стране."
estonia.8.a: "Он сгорит..."

estonia.9.t: "Воскресенье"
estonia.9.d: "Хотя это восстание, состоящее из многих членов &quot; Вапс &quot; и других антиправительственных групп, среди этих протестующих, похоже, мало организаций, нам повезло, что эстонская армия, возглавляемая Йоханом Лайдонером, находится на нашей стороне."
estonia.9.a: "Позвоните Лайдонеру и армии"

estonia.10.t: "Сокрушенные"
estonia.10.d: "Хорошие новости! Армия недавно смогла раздавить это восстание, обеспечив контроль правительства и армии в Эстонии. Хотя восстание и его конец привели к гибели или ранению многих людей, это приемлемая жертва свободе и суверенитету Эстонии. Даже тогда это был командир вождя Йохан Лайдонера, а не Константин Пятс, который был назван спасителем нации. Даже тогда было бы нелепо думать, что он будет использовать свою силу против нас."
estonia.10.a: "Может, он заслуживает медаль."

estonia.11.t: "Армейские каупы объявляют военное законодательство"
estonia.11.d: "Теперь, когда с восстанием разобрался, Йохан Лайдонер положил глаз на правительственные залы, используя волнения и восстание в своих интересах, Лайдонер использовал армию для переворота Константина Петса и его правительства под прикрытием военного права. С этим эпохой правления Патриотической лиги над Эстонией пришел конец. Сегодня эра военного правления начинается в Эстонии."
estonia.11.a: "За сильную и самозависимую Эстонию"

estonia.12.t: "Разрушение Патриотической лиги"
estonia.12.d: "С свержением правительства Константина Пэтса пришло время покончить с его Патриотической лигой, хотя это и принесло определенную пользу нации, конечно же, этого было недостаточно для обеспечения стабильности и мира в Эстонии."
estonia.12.a: "Конец эпохи..."

estonia.13.t: "Артур Сирк вернулся в Эстонию"
estonia.13.d: "Похоже, наши отчёты говорят нам, что Артур Сирк, ведущая фигура Движения Вэпс, прибыл сегодня утром в Эстонию, путешествовал на рыболовном судне над заливом Финляндии. Его попытки скрыть свою личность оказались безуспешными, так как мы быстро повредили его маскировке. Вопрос в том, попытаемся ли мы арестовать его за его предыдущие преступления или отпустим его на свободу."
estonia.13.a: "Арестуйте его!"
estonia.13.b: "Дайте нам подождать..."

estonia.14.t: "Арест Артура Сирка"
estonia.14.d: "Сегодня в резиденцию Артура Сирка прибыли полицейские, которым было поручено арестовать его, хотя мы и верили, что это пройдет без проблем, очевидно, что г-н Сирк не хочет идти без боя."
estonia.14.a: "Хватит дурачиться!"

estonia.15.t: "Исчезает Артур Сирк"
estonia.15.d: "Волшебно, Артур Сирк исчез, так или иначе, ему удалось проскользнуть через наши полицейские силы, по крайней мере, то, что нам говорят, есть слухи, что полицейские убили его и пытаются скрыть улики, это, по крайней мере, теория, набирающая обороты среди его последователей, доказывающая, что он не перегруппировался с ними, независимо от того, где он находится, мы надеемся, что он не причинит больше вреда в Эстонии."
estonia.15.a: "В самом деле, загадочно..."

estonia.16.t: "Сообщения о дезертирстве"
estonia.16.d: "Загадочные сообщения о том, что солдаты и офицеры полиции дезертируют из-за выполнения своих обязанностей, вызывают беспокойство, особенно с учетом того, что мы знаем, что члены Движения &lt; &lt; Вапс &gt; &gt; все еще находятся на свободе."
estonia.16.a: "Странно"

estonia.17.t: "Арест серковских побегов"
estonia.17.d: "Артур Сирк, ведущий член Движения Вапсов, сбежал из наших полицейских сил, зная, что мы его преследуем, он начал заручаться поддержкой своих сторонников, уже начали появляться новости о дезертирах, среди которых начинается восстание, и мы должны быть готовы к худшему."
estonia.17.a: "Соберите войска!"

estonia.18.t: "Движение Вэпсов восторжествует"
estonia.18.d: "Сегодня утром подразделения, преданные Движению Вэпсов, ворвались в столицу Талинна, вооружившись военным оружием, им удалось захватить большую часть города, и они уже собрали много полицейских и солдат на их стороне."
estonia.18.a: "Эстония Пэтс скальпирует"

estonia.19.t: "Артур Сирк объявляет новое правительство"
estonia.19.d: "Тираническое правление Константина Пэтса закончилось. Сегодня мы видим новое унижение в Эстонии, где Движение Вэпс может создать страну к лучшему. Бывшие лояльники Пэтса либо ушли в отставку, либо дезертировали в наши ряды, и даже Йохан Лайдонер, главнокомандующий, неохотно поворачивается спиной к бывшему правительству. Сегодня Эстония может смотреть вперед!"
estonia.19.a: "Новая Эстония ожидает"

estonia.20.t: "Лондонский Крэш достиг Эстонии"
estonia.20.d: "В последнее время Лондонский фондовый рынок пережил экономический крах, понизив экономику Великобритании, который, в свою очередь, распространился по всему миру, с приближением нашего времени. По мере сокращения экспорта сельскохозяйственной продукции на наши банки Эстония, похоже, также ускользает в эту экономическую депрессию."
estonia.20.a: "Это несчастливо..."

estonia.21.t: "Восстановление на горизонте"
estonia.21.d: "Сейчас наше правительство предпринимает шаги для того, чтобы выступить посредником в борьбе с последствиями кризиса на Лондонском фондовом рынке. Мы начинаем возвращаться к более нормализованной ситуации, хотя последствия будут преследовать нас еще немного дольше, по крайней мере, мы на пути к полному выздоровлению."
estonia.21.a: "Эстония убьет Превейла!"

estonia.22.t: "[Постепенные] парламентские выборы"
estonia.22.d: "С введением новой конституции нам естественно провести новые выборы, хотя оппозиционным партиям все еще не разрешено сформироваться, независимым партиям было разрешено конкурировать без значительной оппозиции со стороны правительства, хотя независимые граждане смогли выиграть около 40% голосов, правящий Национальный фронт за осуществление Конституции получил 3/4 большинства в парламенте, в результате чего Константин Пэтс был почти уверен в своей власти."
estonia.22.a: "Я люблю Демократию..."

estonia.100.t: "Йохан Лайдонер и его люди"
estonia.100.d: "Никто не может править в одиночку, и об этом знает генерал Йохан Лайдонер. Если он сможет удержать власть, он должен, по крайней мере, быть известен искусством дипломатии. Сегодня генерал и теперь лидер Эстонии встретились с генералами эстонской армии, и некоторые из них все еще преданы режиму Константина Пятса, необходимо было доставить их на нашу сторону. К счастью, Лайдонера встречают разумные люди, большинство из которых видят, как дует ветер."
estonia.100.a: "В то же время на следующей неделе?"

estonia.101.t: "Суд над Константином Пэтсом"
estonia.101.d: "В то время как многие до сих пор защищают его, назвав эти обвинения, и судья вынесет ему приговор за эти преступления, мы надеемся, что теперь люди видят разум."
estonia.101.a: "Справедливость сбывается"

estonia.102.t: "Возобновление развития текстильной промышленности"
estonia.102.d: "После Великой войны и Лондонского Крэша текстильная промышленность Эстонии была близка к смерти, из-за небольшого объема экспорта и замораживания потребительского рынка в Эстонии и из нее практически не продавались текстильные изделия."
estonia.102.a: "Промышленность полезна для экономики"

estonia.103.t: "Для осуществления Конституции"
estonia.103.d: "С учетом того, что третья Конституция Эстонии находится сейчас на начальном этапе своего существования, она позволит реорганизовать Патриотическую лигу в расширенный блок - Национальный фронт по осуществлению Конституции, - поскольку Патриотическая лига часто связана с самыми авторитарными частями эпохи молчания, это может заставить людей увидеть, что мы на пути к лучшему будущему."
estonia.103.a: "Давайте объединимся в соответствии с новой конституцией"

estonia.104.t: "Успокойся!"
estonia.104.d: "Наконец, мы смогли умиротворить Движение Вэпсов, движение, которое стояло как вызов власти нашего правительства."
estonia.104.a: "Эстония растет безопаснее"

estonia.105.t: "Президент и премьер-министр"
estonia.105.d: "Поскольку новая конституция вступает в силу, пора бывшему старшему государству назначить премьер-министра и, наконец, разделить пост президента и премьер-министра. &lt; &lt; Константин Пятс &gt; &gt; продолжает выполнять функции президента, он обратился к бывшему старшему государственному поколению и политику Каарелу Энпалу для выполнения задачи премьер-министра. &lt; &lt; Эра молчания &gt; &gt; , возможно, станет менее молчаливой."
estonia.105.a: "Впереди новое будущее!"

estonia.106.t: "А как же военное правительство?"
estonia.106.d: "Сейчас, когда военные контролируют страну, мы можем управлять страной так, как мы хотим, эти шаги, хотя и автократичные, необходимы для обеспечения независимости и безопасности Эстонии, с Красным медведем Советского Союза на востоке, с орлом Валькистской Германии на Западе, Эстония нуждается в прочном и стабильном управлении, чтобы одержать победу."
estonia.106.a: "Да здравствует Эстония!"

estonia.107.t: "Демократия, окованная Движением"
estonia.107.d: ""
estonia.107.a: "Наше движение построит Эстонию"

