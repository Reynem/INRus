### National Spirits ###

EST_ineffective_government_and_unrest_idea: "Неэффективное правительство и волнения"
EST_ineffective_government_and_unrest_idea_desc: "Несмотря на все усилия Пецца по искоренению Движения Вапс с 1934 года (включая арест лидера Андреса Ларкы), все еще есть видные члены партии из Эстонии и за рубежом, включая заместителя лидера Артура Сирка, изгнанного в Финляндию, что вызвало серьезные беспорядки среди сторонников, которые решительно выступают за конституционную реформу, которая является значительной частью населения."
EST_ineffective_government_and_unrest1_idea: "Неэффективное правительство и волнения"

EST_university_of_tartu_idea: "Университет Тарту"
EST_university_of_tartu_idea_desc: "Университет Тарту, открытый в 1632 году шведским королем Карлом Густавом II, является национальным университетом Эстонии."

EST_memories_communist_uprising_idea: "Воспоминания о коммунистическом восстании"
EST_memories_communist_uprising_idea_desc: "Коммунистическое восстание 1924 года все еще свежо в памяти молодых и старых людей. Советский переворот был катастрофическим для революционеров - дезорганизация, и меньшее, чем желаемое, оружие способствовало полному уничтожению всех социалистских и коммунистических идей в Эстонии. Хотя идеи Либертарианского толка разбрасываются, они мало что могут повлиять на Рикикогу."
EST_defence_against_reds_idea: "Воспоминания о коммунистическом восстании"
EST_defence_against_reds_idea_desc: "Коммунистическое восстание 1924 года все еще свежо в памяти молодых и старых людей. Советский переворот был катастрофическим для революционеров - дезорганизация, и меньшее, чем желаемое, оружие способствовало полному уничтожению всех социалистских и коммунистических идей в Эстонии. Хотя идеи Либертарианского толка разбрасываются, они мало что могут повлиять на Рикикогу."

