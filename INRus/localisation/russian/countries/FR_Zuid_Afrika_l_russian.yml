 #### Tooltips ####
 ZAF_Help_tooltip: "Разблокирует решения, чтобы помочь в военных усилиях."

 #### Focus ####
 ZAF_Something_Terrible: "Что-то ужасное"
 ZAF_Something_Terrible_desc: "Предатели Южной Африки будут дрожать! Мы застали их врасплох, и теперь мы ведем борьбу за само выживание и независимость нашей нации! Ex Vires Imperium!"
 ZAF_Chaos_Ladder: "Хаос - парень."
 ZAF_Chaos_Ladder_desc: "Если мы хотим победить предателей Южной Африки, мы должны сохранить элемент неожиданности и забастовки без каких-либо ограничений."
 ZAF_Rile_Populace: "Поднимайся по Популасу."
 ZAF_Rile_Populace_desc: "Без них у нашего движения не будет солдат и рабочих, и мы обречены на провал, мы должны сделать все возможное для их вербовки."
 ZAF_German_Separatists: "Поддержка сепаратистов в Калахари"
 ZAF_German_Separatists_desc: "Юго-Западная Африка, переданная Союзу после Великой войны, когда-то была немецкой колонией, и поэтому многие скрываются там, которые готовы восстать против южноафриканских предателей."
 ZAF_Total_War: "Итого, война"
 ZAF_Total_War_desc: "Если мы хотим выиграть эту борьбу, мы должны вербовать как можно больше населения, наполнить ополчения как мужчинами, так и женщинами, и детей, если они достаточно взрослые, это борьба за наше выживание!"
 ZAF_Foreign_Aid: "Иностранная помощь"
 ZAF_Foreign_Aid_desc: "Как бы мы ни хотели показать миру, насколько мы сильны, победив предателей в одиночку, нам потребуется определенная иностранная помощь, чтобы выжить."
 ZAF_Way_to_Independence: "Путь к независимости"
 ZAF_Way_to_Independence_desc: "Мы обезопасили все свои базы и вели полную войну против предателей в Южной Африке. &lt; &lt; Путь к восстановлению нашей нации &gt; &gt; испробован и верен, и все, что остается, -- это выиграть нашу войну за независимость."
