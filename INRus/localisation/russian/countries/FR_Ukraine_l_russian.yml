 ###econ(most fun part of tree)

 ukr_prepare_for_war: "Приготовиться к войне"
 ukr_prepare_for_war_desc: "Ситуация в Европе - это ситуация сверкающего хаоса, в котором мы не хотим быть застигнутыми, мы должны вооружить наших людей и подготовиться к новой войне!"

 ukr_infrastructure_effort: "Совершенствование нашей инфраструктуры"
 ukr_infrastructure_effort_desc: "Несмотря на то, что мы ошеломлены нашим огромным восточным соседом, мы по-прежнему являемся одной из крупнейших стран Европы, но у нас отсутствует наша инфраструктура, и эту ситуацию необходимо исправить."

 ukr_factories_for_farms: "От фермы до рабочего дома"
 ukr_factories_for_farms_desc: "Мы, подобно Петру Великому, не можем сидеть сложа руки, ожидая, что к нам придет современный мир, мы должны быть людьми дела и заставить украинский народ вступить в XX век!"

 ukr_import_food: "Импорт продовольствия"
 ukr_import_food_desc: "С нашей быстрой индустриализацией и урбанизацией мы быстро переходим от Бредбаскета Европы к Рабочему совещанию Европы, однако это имеет побочный эффект сокращения запасов продовольствия, мы должны импортировать продукты питания или мы можем столкнуться с голодом!"

 ukr_logistics_improvements: "Новое материально-техническое обеспечение"
 ukr_logistics_improvements_desc: "Несмотря на то, что хорошая истерика полезна, во время войны на нее нельзя полагаться."

 ukr_expand_sevastopol: "Расширение Севастополя"
 ukr_expand_sevastopol_desc: "Город Севастополь является одним из самых важных городов Украины и должен рассматриваться как таковой."

 ukr_civilian_initiative: "Частная инициатива"
 ukr_civilian_initiative_desc: "Несмотря на то, что рука государства является полезной, когда она осуществляется правильно, спонтанные действия человека могут быть как если бы и не более эффективными."

 ukr_city_highways: "Автошляхи"
 ukr_city_highways_desc: "Новые шоссейные дороги должны покрывать нашу страну и соединять наши очень отделенные города."

 ukr_crisis_aftermath: "Последователи трущоб"
 ukr_crisis_aftermath_desc: "Экономический кризис обрушился на нашу страну, и мы должны реагировать быстро и решительно, если мы хотим избежать последствий катастрофы!"

 ukr_public_works: "Большие общественные работы"
 ukr_public_works_desc: "Эти идеи рекомендуют движение к полной занятости, с тем чтобы обеспечить как полное использование того, что в противном случае было бы пустыми ресурсами, так и сохранение денежных потоков через экономику, а не бездействовать."

 ukr_electric_cities: "Электрификация городов"
 ukr_electric_cities_desc: "ЭЛЕКТРИЧЕСКАЯ ДЕЯТЕЛЬНОСТЬ, это будущее, и мы должны принять его!"

 ukr_crisis_resolved: "Из Крэша"
 ukr_crisis_resolved_desc: "Мы избежали кусочков экономического спада, и теперь мы уверены и готовы смотреть в будущее!"

 ###foreign

 ukr_towards_ruthenia: "К Западославии"
 ukr_towards_ruthenia_desc: "Раздутый жужжан Версаля, который является Западославией, живет над многими украинцами в ее восточных землях. Давайте покончим с этим чудовищем и заберем наш народ обратно."

 ukr_demand_bessarabia: "Спрос на Бессарабию"
 ukr_demand_bessarabia_desc: "Бессарабия — это территория, захваченная у румын после падения старого царского режима, в которой проживают тысячи румын, которые по праву принадлежат под нашим правлением."

 ukr_invite_belarus_for_realsies: "Пригласи [BLR. GetName]"
 ukr_invite_belarus_for_realsies_desc: "Беларусь является естественным союзником против советской угрозы на обеих наших границах, мы должны предложить им союз!"

 ukr_attack_belarus: "Удар [BLR. GetName]"
 ukr_attack_belarus_desc: "Беларусь обладает территориями, которые имеют решающее значение для нашей обороны, и мы должны вторгнуться, захватить эти территории и подчинить Беларуси для обеспечения нашей безопасности на востоке."

 ukr_attack_wrangel: "Уничтожить южнороссийскую армию"
 ukr_attack_wrangel_desc: "Сила русских притворцев Врейнгл слишком долго грызла Днепр, мы пересечем Днепр и введем эти законные украинские земли в наше государство."

 ukr_invite_belarus: "Пригласи [ГЭП. Найти имя]"
 ukr_invite_belarus_desc: "Джорджия - естественный союзник против советской угрозы на наших границах."

 ukr_invite_lithuania: "Пригласи [ЛИТ. Найти имя]"
 ukr_invite_lithuania_desc: "Литва чрезвычайно важна, если мы хотим быть достойными названия "Интермариум"."

 ukr_army_start: "Реформа армии"
 ukr_army_start_desc: "Украинская армия, к сожалению, недооценена и неопытна, мы должны экстенсивно реформировать армию, если мы хотим соревноваться в предстоящих войнах."
 ###
 ukr_army_skoropadksyi: "План Скоропадскии"
 ukr_army_skoropadksyi_desc: "Скоропадкии побеждает в массовом нападении, мы будем следовать его указаниям к победе."
 ###
 ukr_army_sinkler: "План Синклера"
 ukr_army_sinkler_desc: "Синклер следует за доктином быстрой и мобильной войны, принятие его идей, несомненно, принесет нам победу на поле."
 ###
 ukr_army_pavlenko: "План Павленко"
 ukr_army_pavlenko_desc: "Великая огневая мощь позволит нам одолеть нашего врага, и Павленко полностью поддерживает эту идею."
 ###
 ukr_army_udovychenko: "План Удовиченко"
 ukr_army_udovychenko_desc: "Большой план битвы позволит нам действовать на огромных фронтах и окружать наших врагов цифрами и планированием, после того как Удовиченко приведет нас к славе."
 ###
 ukr_army_modernization: "Модернизация украинской армии"
 ukr_army_modernization_desc: "Оружие Великой войны больше не является суффициозным для сегодняшних сражений, модернизация армии является нашим главным приоритетом."
 ###
 ukr_army_german_officers: "Приглашать немецких офицеров"
 ukr_army_german_officers_desc: "Немецкая армия является одной из самых грозных и разрозненных во всем мире, приглашая своих офицеров осматривать нашу армию, несомненно, повысит наш профессионализм."
 ###
 ukr_army_british_officers: "Приглашать британских офицеров"
 ukr_army_british_officers_desc: "Именно британская армия выиграла Великую Войну, и британские офицеры привели нас к победе."
 ###
 ukr_army_french_officers: "Приглашать французских сотрудников"
 ukr_army_french_officers_desc: "Во время Великой войны французская армия, защищая каждый дюйм Франции перед последним человеком, должна быть скопирована и запечатлена в умах наших солдат."
 ###
 ukr_army_top_down: "Верхний подход"
 ukr_army_top_down_desc: "Талантливые и опытные офицеры - ключ к победе на поле, мы должны быть уверены в том, что им следует уделять приоритетное внимание."
 ###
 ukr_army_bottom_up: "Подход снизу вверх"
 ukr_army_bottom_up_desc: "Именно солдат выигрывает войну на местах, их профессионализм и навыки имеют огромное значение."
 ###
 ukr_army_doctrine_research: "Расширенные теоретические исследования"
 ukr_army_doctrine_research_desc: "Если мы будем продолжать изучение доктрины, это даст нам решающее преимущество в борьбе, было бы мудро рассмотреть этот вопрос."
 ###
 ukr_army_artillery_integration: "Артиллерийская интеграция"
 ukr_army_artillery_integration_desc: "Наполеон научил мир важности артиллерии в битве, возможно, его методы можно было бы применить и к сегодняшним сражениям."
 ###
 ukr_army_support_companies: "Вспомогательные компании"
 ukr_army_support_companies_desc: "Армия не может сражаться сама по себе, она нуждается в поддержке в бою со стороны других элементов."
 ###
 ukr_navy_start: "Украинские военно-морские силы"
 ukr_navy_start_desc: "Черное море имеет для нас жизненно важное значение, мы должны обеспечить, чтобы наш флот мог защитить воды и береговую линию от возможного вторжения."
 ###
 ukr_navy_maximov: "План Максимова"
 ukr_navy_maximov_desc: "Обычные боевые действия могут вестись на поверхности, но с каждым днем разрабатываются новые подводные технологии, а лицо военно-морских войн быстро меняется."
 ###
 ukr_navy_gorshkov: "План Горшкова"
 ukr_navy_gorshkov_desc: "Большой флот, способный бомбить врага за пределами горизонта, позволит нам уничтожить наших врагов девственностью."
 ###
 ukr_navy_pilipenko: "План Пилипенко"
 ukr_navy_pilipenko_desc: "Гибкий флот, способный наполнить множество ролей, позволит нам перехитрить и обмануть наших врагов в море."
 ###
 ukr_navy_sea_wolves: "Морские волки"
 ukr_navy_sea_wolves_desc: "Очевидно, что подводные войны — это путь к военно-морскому превосходству, и мы должны вкладывать больше средств в исследования новых моделей."
 ###
 ukr_navy_sea_titans: "Морские титаны"
 ukr_navy_sea_titans_desc: "Крупные корабли могут носить больше оружия и больше бить, больше всегда лучше."
 ###
 ukr_navy_fleet_integralism: "Флот Неотъемлемость"
 ukr_navy_fleet_integralism_desc: "Оперативная недееспособность флота часто игнорируется, но это жизненно важный аспект успеха военно-морского флота."
 ###
 ukr_navy_convoy_interdiction: "Препятствие сговора"
 ukr_navy_convoy_interdiction_desc: "Уничтожение вражеских колонн подорвет их усилия по обеспечению солдат в отдаленных районах, и мы должны воспользоваться этим фактом, чтобы одержать верх над нашими более крупными врагами."
 ###
 ukr_navy_floating_fortress: "Плавучие крепости"
 ukr_navy_floating_fortress_desc: "Большой корабль всегда лучше, мы должны довести этот эксперимент до его логического завершения."
 ###
 ukr_navy_initiative: "Инициатива в области адмирализма"
 ukr_navy_initiative_desc: "Инициатива — это не умение, которое можно изучить как таковое, а то, с чем рождаются некоторые адмирали, и мы все еще можем адаптировать нашу военно-морскую доктрину таким образом, чтобы она соответствовала этим командирам и их навыкам."
 ###
 ukr_air_start: "Украинские военно-воздушные силы"
 ukr_air_start_desc: "Контроль над воздухом гарантирует победу на земле, мы не можем игнорировать этот факт дольше, чем мы уже имеем."
 ###
 ukr_air_shtern: "План Штерна"
 ukr_air_shtern_desc: "Крупнейшие самолеты могут нести больше полезной нагрузки и наносить больше повреждений, и Штерн очень хорошо это знает."
 ###
 ukr_air_tkachev: "План Ткачева"
 ukr_air_tkachev_desc: "Легкие самолеты являются основой любых военно-воздушных сил, пренебрегая ими, и их значение будет смертельной ошибкой."
 ###
 ukr_air_navy_support: "Поддержка ВМС"
 ukr_air_navy_support_desc: "Военно-морские силы не могут функционировать самостоятельно, им требуется помощь со стороны военно-воздушных сил, с тем чтобы они могли функционировать в течение длительных периодов времени."
 ###
 ukr_air_army_support: "Поддержка армии"
 ukr_air_army_support_desc: "В конце концов, именно армия побеждает в войне, и их выживание имеет первостепенное значение для выживания самой Украины."
 ###
 ukr_air_quality: "Качество"
 ukr_air_quality_desc: "Мы должны обеспечить высокое качество и надежность самолётов, чтобы они не нуждались в постоянном ремонте и замене."
 ###
 ukr_air_quantity: "Количество"
 ukr_air_quantity_desc: "Неважно, сколько самолётов они сбили, мы заменим каждого павшего пилота еще пятью."
 ###
 ukr_1936_rada: "Выборы 1936 года"
 ukr_1936_rada_desc: "Настало время вновь продолжить демократический процесс в нашей стране."
 ###
 ukr_rada_nationalist: "Победа"
 ukr_rada_nationalist_desc: "Националисты победили на выборах, теперь мы должны подождать, чтобы увидеть, что ждет нас в будущем."
 ###
 ukr_rada_junta: "Военный захват"
 ukr_rada_junta_desc: "Военные вмешались, чтобы взять под свой «временный» контроль нацию. Вряд ли они в ближайшее время снимут свою позицию, и вскоре Украина может быть преобразована в военное государство."
 ###
 ukr_rada_democratic: "NP Победа"
 ukr_rada_democratic_desc: "Партия Народна продвинулась вперед и выиграла выборы, теперь их очередь диктовать будущее нашей нации."
 ###
 ukr_rada_socialist: "Победа ВПСФ"
 ukr_rada_socialist_desc: "УПСФ одержало еще одну победу на украинских выборах, и они вновь захватили власть в Раде, хотя некоторые опасаются, что эта тенденция может привести к воссоединению с Россией, у нас есть шанс создать уникальную породу украинского социализма и учиться на российских ошибках."
 ###
 ukr_junta_reforms: "Административные реформы"
 ukr_junta_reforms_desc: "Военные, как правило, не используются для управления целыми штатами, и поэтому нам нужно будет внести некоторые административные коррективы, с тем чтобы обеспечить эффективное функционирование этого режима."
 ###
 ukr_junta_german_economy: "Стренген Немецкие экономические пироги"
 ukr_junta_german_economy_desc: "Украинская экономика уже давно опирается на сотрудничество немцев, мы должны обеспечить, чтобы эти экономические облигации оставались жесткими, чтобы избежать еще одной экономической катастрофы."
 ###
 ukr_junta_widescale_reforms: "Расширение административных реформ"
 ukr_junta_widescale_reforms_desc: "После того, как государство наконец обрело безопасность, мы можем начать работу по расширению нашей системы управления."
 ###
 ukr_junta_official_language: "Официальный язык"
 ukr_junta_official_language_desc: "Многоязычный характер украинского государства сдерживает нас в политическом отношении, мы должны принять украинский язык, если мы хотим соревноваться на мировой арене."
 ###
 ukr_junta_german_training: "Немецкие совместные учебные занятия"
 ukr_junta_german_training_desc: "Немецкая армия легендарна за свои способности и профессионализм, есть более чем несколько вещей, которые они могли бы научить как нашим офицерам, так и солдатам."
 ###
 ukr_junta_destroy_commies: "Уничтожить левых"
 ukr_junta_destroy_commies_desc: "Социалисты всегда намеревались затащить нас обратно под русскую обувь, мы должны обеспечить, чтобы это никогда не могло повториться."
 ###
 ukr_junta_black_sea_germans: "Черное море Привилегии Германии"
 ukr_junta_black_sea_germans_desc: "На побережье Черного моря проживает большая группа этнических немцев, и предоставление им специальных социальных и экономических льгот приблизит нас к самой Германии."
 ###
 ukr_junta_land_distribute: "Перераспределение земли"
 ukr_junta_land_distribute_desc: "Старые Кулаки имеют землю по всей Украине, мы должны перераспределить ее на ровные и равные секторы, чтобы повысить эффективность сельского хозяйства."
 ###
 ukr_junta_puppet_rada: "Куклы Рада"
 ukr_junta_puppet_rada_desc: "Рада долгое время оставалась шипом на нашей стороне, мы будем штурмовать здание и раз и навсегда положить конец их дурному поведению."
 ###
 ukr_junta_end_elections: "Отмена будущих выборов"
 ukr_junta_end_elections_desc: "Украине нельзя доверять демократии, выборы никогда не должны проводиться в нашей стране, иначе мы изберем большевиков к власти."
 ###
 ukr_junta_german_ally: "Немецкий альянс?"
 ukr_junta_german_ally_desc: "Мы уже несколько месяцев улучшаем отношения с Немецким Рейхом, и наконец пришло время обратиться с просьбой об официальном военном союзе против российской угрозы."
 ###
 ukr_nat_purge_reds: "Очистить красных"
 ukr_nat_purge_reds_desc: "Социалисты по-прежнему имеют сильное присутствие в сельской местности нашей страны, мы должны быть прилежными и тщательными в удалении красных из Украины, чтобы предотвратить вторую революцию."
 ###
 ukr_nat_ukraine_culture: "Пропаганда украинской культуры"
 ukr_nat_ukraine_culture_desc: "Мы должны избавить страну от российского влияния на личном уровне, поощрение украинской культуры должно быть одним из наших главных приоритетов."
 ###
 ukr_nat_centralize: "Централизация власти"
 ukr_nat_centralize_desc: "Революция власти ведет к потере власти и краху правительства."
 ###
 ukr_nat_no_russian: "Претензии на востоке"
 ukr_nat_no_russian_desc: "Донестская и Ворошиловская области исторически связаны с Украиной, и русские захватили их в нашей борьбе за независимость."
 ###
 ukr_nat_construction_projects: "Национальные строительные проекты"
 ukr_nat_construction_projects_desc: "Люди хотят служить нации, но у них нет никакого направления."
 ###
 ukr_nat_peoples_militia: "Народная милиция"
 ukr_nat_peoples_militia_desc: "Угроза коллективизма по-прежнему нависает над нашей нацией, мы должны вооружить наших преданных граждан и объединить их в рассредоточенные ополчения для защиты от любых дальнейших социалистических вторжений."
 ###
 ukr_nat_secret_police: "Нашел VSO"
 ukr_nat_secret_police_desc: "Внутришни Сили Оборени, или ВСО, будут служить секретной полицией для нашего правительства. Их задача - выполнять грязную работу и делать то, что мы не хотели бы признавать."
 ###
 ukr_nat_militarize_state: "Милитаризация государства"
 ukr_nat_militarize_state_desc: "Наша экономика по-прежнему в значительной степени сосредоточена на гражданском промышленном аспекте, и мы должны начать переход к военно-промышленному комплексу для обеспечения выживания нашей страны."
 ###
 ukr_nat_claim_land: "Провозглашение Большой Украины"
 ukr_nat_claim_land_desc: "Хотя мы, возможно, не контролируем территорию Большой Украины, утверждение о том, что эта земля является первым шагом к спасению украинского народа, застрявшего за пределами наших границ."
 ###
 ukr_demo_voting_reform: "Реформа системы голосования"
 ukr_demo_voting_reform_desc: "Демократическая система в нашей стране в порочном и коррумпированном состоянии, мы должны встряхнуть эту систему, чтобы восстановить подлинную демократию."
 ###
 ukr_demo_farming_help: "Помощь фермерам"
 ukr_demo_farming_help_desc: "Предоставление экономической и кадровой помощи фермерам в Западной Украине позволит им производить больше продовольствия и опережать рост дефицита, который мы имеем."
 ###
 ukr_demo_left_coop: "Сотрудничество с левыми"
 ukr_demo_left_coop_desc: "Народ требует прав, а правительство требует единства; формирование коалиции с социальными демократами в правительстве удовлетворит обе партии."
 ###
 ukr_demo_public_works: "Общественные работы"
 ukr_demo_public_works_desc: "Проекты общественных работ создадут чувство единства для народа Украины в его совместной работе на благо страны."
 ###
 ukr_demo_urbanization: "Активизация урбанизации"
 ukr_demo_urbanization_desc: "Сельская жизнь хороша, но будущее - в городах. Мы должны поощрять наше население к переезду в города и к тому, чтобы мы достигли западных стандартов."
 ###
 ukr_demo_ukraine_language: "Развитие украинского языка"
 ukr_demo_ukraine_language_desc: "Растущее влияние русского языка в нашей стране должно быть остановлено на его пути, а украинский язык должен занять его место."
 ###
 ukr_demo_farming_innovation: "Сельскохозяйственные инновации"
 ukr_demo_farming_innovation_desc: "Кулакы в нашей стране по-прежнему используют устаревшие и архаичные методы и инструменты, и мы можем повысить их эффективность, предоставляя им современные инструменты и методы ведения сельского хозяйства."
 ###
 ukr_demo_farm_union: "Контролируемые фермерские союзы"
 ukr_demo_farm_union_desc: "Фермеры уже давно просят о праве на объединение в профсоюзы, и, возможно, мы можем обеспечить определенную степень единства, пока они остаются под нашим контролем и управлением."
 ###
 ukr_demo_british_pact: "Британский пакт"
 ukr_demo_british_pact_desc: "Британская империя сыграла большую роль в первые годы нашей независимости и борьбы с советскими войсками, возможно, еще раз объединив руки с Лондоном, будет хорошо служить нам."
 ###
 ukr_demo_french_pact: "Французский пакт"
 ukr_demo_french_pact_desc: "Пакт Стали становится сильнее с каждым днем, мы должны найти союзников на континууме, если мы хотим оттолкнуть немцев, когда они в конце концов стучатся."
 ###
 ukr_demo_bastion: "Демократический бастион"
 ukr_demo_bastion_desc: "С ростом авторитаризма по всей Европе мы должны быть сильными как маяк свободы и свободы."
 ###
 ukr_soc_solve_no_food: "Решение продовольственной проблемы"
 ukr_soc_solve_no_food_desc: "Риск голода в нашей стране удерживал нас на протяжении многих лет, пришло время, чтобы правительство вмешалось и восстановило порядок."
 ###
 ukr_soc_consolidate: "Объединить Сторону"
 ukr_soc_consolidate_desc: "Партия разделена между либеральными и консервативными фракциями, мы должны объединить эти стороны, если мы хотим эффективно управлять страной."
 ###
 ukr_soc_extort_kulaks: "Вымогательство Kulaks"
 ukr_soc_extort_kulaks_desc: "Кулакс давно проигнорировал наши приказы и действовал с большой автономией."
 ###
 ukr_soc_farm_money: "Субсидирование сельского хозяйства"
 ukr_soc_farm_money_desc: "Сельскохозяйственные общины по всей Украине находятся на грани экономического краха, мы должны направить средства на эти фермы, с тем чтобы производство продовольствия оставалось на уровне стандартов."
 ###
 ukr_soc_purge_right: "Уничтожить ультранационализм"
 ukr_soc_purge_right_desc: "ОУН по-прежнему обладает значительной властью в украинском правительстве и популярна среди народа, мы должны вести борьбу против них, чтобы они никогда не возвращались в политический спектр."
 ###
 ukr_soc_reorganize_land: "Реорганизация земель"
 ukr_soc_reorganize_land_desc: "Мы должны просеивать и реорганизовать землю в сельской местности Украины, с тем чтобы улучшить землепользование."
 ###
 ukr_soc_language_debate: "Языковые дебаты"
 ukr_soc_language_debate_desc: "Мы проведем публичное обсуждение с целью определения будущего языка в Украине и раз и навсегда закончим с этим порочным вопросом."
 ###
 ukr_soc_demote_valkism: "Дискредитация валькизма"
 ukr_soc_demote_valkism_desc: "Валькизм, хотя он и является еще относительно новым, быстро доказал, что он является враждебной и добровольной идеологией, которая угрожает нарушить баланс сил в Европе, и мы должны убедиться в том, что мир знает нашу позицию."
 ###
 ukr_soc_socialist_haven: "Социалистический Хэйвен"
 ukr_soc_socialist_haven_desc: "Украина стала убежищем для социализма в Европе, и в результате наше правление стало более стабильным."
 ###
 ukr_soc_russian_pact: "Пакт с Москвой"
 ukr_soc_russian_pact_desc: "Мы должны признать, что мы всегда будем оставаться младшим партнером русского медведя, и, возможно, добровольное присоединение к международному сообществу избавит нас от худшего из вымогательств."
 ###
 ukr_look_outwards: "Оглядывайтесь наружу"
 ukr_look_outwords_desc: "С восстановлением стабильности на Украине мы наконец сможем выйти за пределы наших границ и начать воплощать мечту о великой Украине."
 ###
 ukr_attack_russia: "Восточная буффер или война"
 ukr_attack_russia_desc: "Настало время, мы будем требовать от русских обширных участков территории для обеспечения буфера, который невозможно легко проникнуть, они естественно откажутся от таких требований, но в неизбежной войне мы отомстим за наших павших братьев и навсегда освободим Украину от оков русского подавления."
 ###
 ukr_poland_deal: "Сделка с Польшей"
 ukr_poland_deal_desc: "Польша забрала Галицию в хаосе 1920-х годов, возможно, мы сможем прийти к соглашению о мирном восстановлении территории и вступлении в союз с поляками."
 ###
 ukr_attack_poland: "Спрос на Галицию"
 ukr_attack_poland_desc: "Полякам нельзя доверять хорошо обращаться с украинцами в Галисии, мы должны потребовать от них этого региона."
 ###
 ukr_invite_romania: "Пригласить Румынию в Альянс"
 ukr_invite_romania_desc: "Румынцы предоставят нам доступ на Балканы, а также на их обширные нефтяные месторождения, и их присутствие на нашей стороне имеет первостепенное значение."
 ###
 ukr_core_galicia: "Восстановите наше правление в Галисии."
 ukr_core_galicia_desc: "Теперь, когда мы контролируем Галицию, мы должны вернуть этот район в строй и должным образом управлять им."
 ###
 ukr_soc_socialist_republic: "Первостепенная революция"
 ukr_soc_socialist_republic_desc: "Коммунисты взяли под свой контроль Киев, а остальная часть страны оказалась под красным знаменем социализма. Наступила новая эра для Украины, которая, несомненно, будет полна счастья и процветания. Три основных лидера революции разошлись по всей стране, мы должны созвать заседание Центрального комитета и собрать всех трех человек в Киеве для определения будущего нашей нации."
 ###
 ukr_soc_socialdem_republic: "Охраняйте от революционеров"
 ukr_soc_socialist_republic_desc: "Украинцы должны быть в курсе опасностей жесткого социализма от угрозы к востоку. Мы не вытащили наше государство из пепла Русской революции, чтобы так легко его отдать!"

 ##############
 ### EVENTS ###
 ##############

 ukraine.1.t: "Украина в 1936 году"
 ukraine.1.d: "После разгара гражданской войны в России украинский народ оказался в неурядице, в которой он не хотел быть частью. В течение короткого времени во время этой войны казалось, что мы попадем в состав растущего Советского государства. Ленин, когда-либо прагматист, в момент паники, заключивший наше маленькое государство и давший нам независимость. Однако русский медведь по-прежнему пристально наблюдает за нами, ожидая идеального момента, чтобы нанести удар. На Западе миллионы западных украинцев, при различных правительствах, кричащих на освобождение от иностранной тирании. В доме Украина разделена на три политические фракции. Либералисты, популярные главным образом в Западной Украине, стремятся к либерализации экономики и государства и геополитической привязанности к Западной Европе. Националист ОУН, также популярный в основном в Западной Украине, стремится к сильному милитаристскому государству, которое будет претендуть на западные земли Украины и найти решение восточного вопроса. социалисты, главным образом популяризированные в Восточной Украине, стремятся к социализации экономики и геополитической привязке с Востоком. Многие говорят о четвертой фракции, попустительстве в любой моменте в военном."
 ukraine.1.a: "Вперёд, для людей!"
 ###
 ukraine.2.t: "Украина вступает в экономический спад."
 ukraine.2.d: "Хорошие дни не могут длиться вечно, и сейчас Украина сталкивается с экономическим спадом."
 ukraine.2.a: "Черт!"
 ###
 ukraine.3.t: "Выборы 1936 года"
 ukraine.3.d: "Несмотря на то, что к украинскому народу часто относятся с большим скептицизмом, он, в особенности в восточных регионах, не в полной мере привязан к западным идеям управления."
 ukraine.3.a: "Демократический процесс продолжается снова..."
 ###
 ukraine.4.t: "Социалисты выступают с речью в Харкове."
 ukraine.4.d: "Сегодня произошло подозрительно скользкое и хорошо финансируемое социалистическое мероприятие, в ходе которого ряд партийных лидеров выступили с различными речами о положении дел в области равенства в Украине, в связи с чем были аплодисменты со стороны сочувствующей аудитории. Дойдя до национальных заголовков , правительство, естественно, вынуждено высказать свое мнение по этому вопросу."
 ukraine.4.a: "Знаешь, они правы."
 ukraine.4.b: "Отмените речь."
 ukraine.4.c: "Вообще-то, мы не будем комментировать."
 ###
 ukraine.5.t: "Правительственная радиовещательная трансляция"
 ukraine.5.d: "Правительство должно сделать трансляцию по беспроводной связи, и оно должно принять решение о том, каким будет тон и содержание такой передачи."
 ukraine.5.a: "Слава нынешнему правительству."
 ukraine.5.b: "Восхваляйте оппозицию."
 ukraine.5.c: "Сделайте джингоистическую речь."
 ###
 ukraine.6.t: "Знаменитый член Рады убит!"
 ukraine.6.d: "Сегодня в Киеве в связи с тем, что улицы снова были залиты кровью, был убит известный член Рады, представлявший правительство, и теперь нам приходится выбирать замену."
 ukraine.6.a: "Член действующего правительства займет его место."
 ukraine.6.b: "Член оппозиционной партии займет его место."
 ukraine.6.c: "Член националистической партии займет его место."
 ###
 ukraine.7.t: "Выборы закончились!"
 ukraine.7.d: "Бюллетени тикают, голоса подсчитываются, и общественность ожидает результатов."
 ukraine.7.a: "UPSF выиграл выборы."
 ukraine.7.b: "Партия Народна выиграла выборы."
 ukraine.7.c: "Оханизация Украинс'ких Национистич выиграла выборы."
 ###
 ukraine.8.t: "Меньшинства в Украине выражают страх."
 ukraine.8.d: "С ростом украинского правительства, которое явно враждебно по отношению к этническим, культурным и религиозным меньшинствам, многие раздражают результаты выборов, а некоторые угрожают прямыми действиями в ответ."
 ukraine.8.a: "Мы должны обеспечить, чтобы они чувствовали себя в безопасности."
 ukraine.8.b: "Они всего лишь пиявка на нашу страну."
 ###
 ukraine.9.t: "Вспышки по всей Украине."
 ukraine.9.d: " "
 ukraine.9.a: "Местная полиция будет заниматься этим вопросом."
 ###
 ukraine.10.t: "Дефекты местной полиции!"
 ukraine.10.d: "В то время как многие местные полицейские входят в те же группы меньшинств, что и они были посланы для того, чтобы запугать их, массы офицеров пересекли линии пикета и боевые линии и присоединились к меньшинствам в восстании."
 ukraine.10.a: "Позвони в армию!"
 ###
 ukraine.11.t: "Армия объявляет военное положение по всей стране"
 ukraine.11.d: "Без власти правительства в Киеве армия объявила военное положение, и ограничения также распространяются на членов правительства, что означает, что они не могут занять свои места в Раде или министерствах."
 ukraine.11.a: "Подожди, мы не разрешили это... это переворот?"
 ###
 ukraine.12.t: "Провозглашение Большой Украины"
 ukraine.12.d: " "
 ukraine.12.a: "Вперед, за Украину!"
 ###
 ukraine.13.t: "Украина подает заявление о вступлении в АПИ"
 ukraine.13.d: " "
 ukraine.13.a: "Абсолютно!"
 ukraine.13.b: "Абсолютно нет!"
 ###
 ukraine.14.t: "Украина подает заявление о присоединении к континентальному соглашению"
 ukraine.14.d: " "
 ukraine.14.a: "Абсолютно!"
 ukraine.14.b: "Абсолютно нет!"
 ###
 ukraine.15.t: "Языковой вопрос"
 ukraine.15.d: " "
 ukraine.15.a: "Мы будем продвигать украинский язык."
 ukraine.15.b: "Мы будем продвигать русский язык."
 ukraine.15.c: "Мы будем продвигать оба языка."
 ###
 ukraine.16.t: "Украина желает присоединиться к Международной организации"
 ukraine.16.d: " "
 ukraine.16.a: "Добро пожаловать, наши социалистические братья!"
 ukraine.16.b: "Нет, Россия победит все."
 ###
 ukraine.17.t: "Украина желает присоединиться к Пакту Стали"
 ukraine.17.d: " "
 ukraine.17.a: "Украина незаменима в завоевании России."
 ukraine.17.b: "В любом случае, мы скоро войдем в Киев."
 ###
 ukraine.18.t: "Украина требует Бессарабию!"
 ukraine.18.d: " "
 ukraine.18.a: "Мы не можем позволить себе еще одну дорогостоящую войну."
 ukraine.18.b: "Мы не сдадимся так легко!"
 ###
 ukraine.19.t: "Румыния"
 ukraine.19.d: " "
 ukraine.19.a: "На шаг ближе к мечте о великой Украине!"
 ###
 ukraine.20.t: "Румыния отказывается уступать Бессарабию"
 ukraine.20.d: " "
 ukraine.20.a: "Ладно, они могут забрать его."
 ukraine.20.b: "Нас не проигнорируют."
 ###
 ukraine.21.t: "Украина предлагает сделку"
 ukraine.21.d: " "
 ukraine.21.a: "Нам нужны украинцы на нашей стороне."
 ukraine.21.b: "Мы не сдадим земли, которые так упорно боролись, чтобы вернуть"
 ###
 ukraine.22.t: "Польша принимает сделку"
 ukraine.22.d: " "
 ukraine.22.a: "Мы будем скучными вместе."
 ###
 ukraine.23.t: "Польша отклоняет наше предложение"
 ukraine.23.d: " "
 ukraine.23.a: "Тогда они упадут."
 ukraine.23.b: "Мы захватим Польшу силой!"
 ###
 ukraine.24.t: "Украина приглашает нас к их альянсу"
 ukraine.24.d: " "
 ukraine.24.a: "Мы присоединимся к нашим друзьям."
 ukraine.24.b: "Мы не пойдем вниз с тонущим кораблем."
 ###
 ukraine.25.t: "Грузия присоединяется к нашему альянсу"
 ukraine.25.d: " "
 ukraine.25.a: "Мы сильнее вместе."
 ###
 ukraine.26.t: "Грузия отклоняет наше предложение."
 ukraine.26.d: " "
 ukraine.26.a: "Плохое решение от их имени."

 ###
 ukraine.27.t: "Украина предлагает нам союз"
 ukraine.27.d: " "
 ukraine.27.a: "Ради блага нашей нации, мы принимаем"
 ukraine.27.b: "Какая шутка."
 ###
 ukraine.28.t: "Румыния принимает предложение о создании альянса"
 ukraine.28.d: " "
 ukraine.28.a: "Мудрое решение."
 ###
 ukraine.29.t: "Румыния отклоняет наше предложение"
 ukraine.29.d: " "
 ukraine.29.a: "Тогда они будут потеряны для анналов истории."
 ukraine.29.b: "В Бухарест!"
 ###
 ukraine.30.t: "Украина расширяет альянс"
 ukraine.30.d: " "
 ukraine.30.a: "Для нашего выживания мы принимаем"
 ukraine.30.b: "Нам не нужно склоняться перед другими, чтобы обеспечить наше выживание."
 ###
 ukraine.31.t: "Литва присоединяется к альянсу"
 ukraine.31.d: " "
 ukraine.31.a: "Наш союз с каждым днем крепнет."
 ###
 ukraine.32.t: "Литва отказывается от нашего предложения"
 ukraine.32.d: " "
 ukraine.32.a: "Дураки, все они."
 ukraine.32.b: "Нам нужна балтийская береговая линия"
 ###
 ukraine.33.t: "Комитет является кворумом"
 ukraine.33.d: "С приходом Махно, Хрущева и Косиора в Киеве Центральный комитет теперь может начать обсуждать будущее нашей нации и народа, которым мы руководим. В ближайшие дни комитет будет принимать решения по различным вопросам, начиная от экономики и заканчивая военной и внешней политикой."
 ukraine.33.a: "Будем надеяться, что обсуждение будет носить гражданский характер."
 ###
 ukraine.34.t: "Экономическая политика"
 ukraine.34.d: "Украинская экономика полна капитализма и коррупции, и каждый из наших трех лидеров предложил свою собственную политику и план возрождения и возрождения экономики. Предложение no Kosier представляет собой форму коллективизации, в результате чего все аспекты экономики находятся под контролем государства. В предложении nonhhruschev делается большой акцент на сельском хозяйстве и производстве продовольствия в общенациональном масштабе, а также на мощном микроменеджменте в экономике. no noMahno предлагает радикальную политику высокоавтономных коммун по всей Украине, возглавляемых крестьянами и работниками региона. Он также хочет высечь большие суммы частной собственности и распространить ее среди населения."
 ukraine.34.a: "Предложение Косье проходит"
 ukraine.34.b: "Предложение Хрущева проходит"
 ukraine.34.c: "Предложение Махно проходит"
 ###
 ukraine.35.t: "Военная политика"
 ukraine.35.d: "Украинская армия всегда была не в состоянии и относительно мала по отношению к нашим соседям. Если мы хотим пережить многочисленные вызовы, с которыми Украина столкнется в ближайшем будущем. Нн Косье желает создать красную армию, лояльную правительству, а не государству. Политические репрессии, подавление волнений и защита нации будут переданы военным, что приведет к созданию чрезвычайно военного государства. Нн Крущовский план включает чистку нескольких офицеров и тысяч предположительно неверных солдат для обеспечения того, чтобы армия оставалась верной, формирование национальной армии из всех районов Украины, призванное усилить чувство национального единства, и предоставление кредитов на модели винтовок. Ннн Махно включает в себя подготовку местных ополчений из городов по всей Украине, а также формирование «Гудяни» с намерением защитить каждый дюйм Украины, если вторжение уничтожит основную часть армии."
 ukraine.35.a: "Предложение Косье проходит"
 ukraine.35.b: "Предложение Хрущева проходит"
 ukraine.35.c: "Предложение Махно проходит"
 ###
 ukraine.36.t: "Внешняя политика"
 ukraine.36.d: "Украина была дипломатично изолирована и под давлением своих соседей, и катастрофа, которая была польско-украинской войной, все еще свежа в памяти многих людей в нашей стране. Новая предыдущая политика должна быть адаптирована, если мы хотим выжить в предстоящие годы. ~ nnoKosier выступает за «реалистичную» позицию, утверждая, что историческое соперничество и обиды следует отложить в сторону практических альянсов против истинных врагов Украины. ~nhhruschev желает увидеть восстановленный союз с русскими и более тесное сотрудничество с совитым правительством в Москве. Это сопряжено с риском возрождения в российское правительство, но Хрущев обеспечил комитет, что ничего подобного не произойдет. ~nnnkhakhno придерживается самых радикальных взглядов, утверждая, что никому нельзя доверять за пределами Украины, и что союзы с иностранными державами приведут лишь к разрушению и отчаянию."
 ukraine.36.a: "Предложение Косье проходит"
 ukraine.36.b: "Предложение Хрущева проходит"
 ukraine.36.c: "Предложение Махно проходит"
 ###
 ukraine.37.t: "Внутренняя политика"
 ukraine.37.d: "Администрация Украины небрежна и неэффективна, когда в каждом углу обнаруживается коррупция. Реформа административного департамента будет трудной и требует радикальных методов. Нн Косье желает принижать политику "хиткиста", призванную искоренить коррупцию и предательство, где бы они ни были найдены на всех уровнях правительства и общества. Военные, конечно, будут инструментами этого плана. Нн Хрущев желает следовать своей политике проведения испытаний и очищения, призванных искоренить неверие партии и обеспечить, чтобы это не было сопротивлением внутри страны. Нннмахно, план включает в себя создание "чудовищного", прославленного отряда смерти, предназначенного для того, чтобы запугать как правительство, так и народ. Этот план является самым радикальным из трех, и Хрущев лично осудил план, называя его "мадом и безумием"."
 ukraine.37.a: "Предложение Косье проходит"
 ukraine.37.b: "Предложение Хрущева проходит"
 ukraine.37.c: "Предложение Махно проходит"
 ###
 ukraine.38.t: "Косье принимает меры для того, чтобы понизить статус других членов Комитета"
 ukraine.38.d: "С учетом того, что его политика принимает большинство голосов на заседаниях, состоявшихся в течение прошлой недели, Косье приступил к демации других членов Центрального комитета и осуществлению прямого контроля над страной, другие члены Комитета должны теперь принять решение либо против, либо против его решения."
 ukraine.38.a: "Косье будет вести народ крепкой рукой"
 ukraine.38.b: "Эта бескорыстная попытка укрепить власть не будет допущена."
 ###
 ukraine.39.t: "Хрущев принимает меры для того, чтобы понизить статус других членов Комитета"
 ukraine.39.d: "С учетом того, что его политика принимает большинство голосов на заседаниях, состоявшихся на прошлой неделе, Хрущев принял решение понизить статус других членов Центрального комитета и взять на себя прямой контроль над страной, а теперь другие члены Комитета должны либо выступить против его решения, либо согласиться с ним."
 ukraine.39.a: "Хрущев будет вести народ крепкой рукой"
 ukraine.39.b: "Эта бескорыстная попытка укрепить власть не будет допущена."
 ###
 ukraine.40.t: "Махно предпринимает шаги для того, чтобы понизить статус других членов Комитета"
 ukraine.40.d: "С учетом того, что его политика принимает большинство на заседаниях в течение прошлой недели,"Makhno has moved to demote the other members of the Central Committee and assume direct control of the nation. The other members of the Committee must now decide o either oppose or accept his decision."
 ukraine.40.a: "Махно поведет народ крепкой рукой"
 ukraine.40.b: "Эта бескорыстная попытка укрепить власть не будет допущена."
 ###
 ukraine.41.t: "Кубок запуска Kosier!"
 ukraine.41.d: "После нескольких дней отсутствия Макно вернулся в Кремль с элементами армии за спиной, он требует, чтобы комитет ушел в отставку и позволил ему взять под свой контроль правительство и восстановить порядок в стране. Несмотря на то, что предоставление Косье власти, несомненно, привело бы к царству террора и подъему тоталитарного государства, на самом деле в наилучших интересах страны просто позволить ему войти и взять на себя роль председателя."
 ukraine.41.a: "Комитет спускается."
 ukraine.41.b: "Армия прибывает и восстанавливает порядок."
 ###
 ukraine.42.t: "Косье принимает решение Комитета."
 ukraine.42.d: "После напряженных дней Косье решил, что отзыв его ходатайства отвечает интересам как партии, так и народа."
 ukraine.42.a: "Ещё одна победа для народа."
 ###
 ukraine.43.t: "Хрущев запускает Кубок!"
 ukraine.43.d: "После того как Макно несколько дней отсутствовал, он вернулся в Кремль с элементами армии за спиной, он требует, чтобы комитет ушел и позволил ему взять под свой контроль правительство и восстановить порядок в стране. Несмотря на то, что принятие контроля над Хрущевом, несомненно, привело бы к царству террора и подъему тоталитарного государства, но на самом деле в наилучших интересах страны просто позволить ему войти и взять на себя роль председателя."
 ukraine.43.a: "Комитет спускается."
 ukraine.43.b: "Армия прибывает и восстанавливает порядок."
