 UKR_german_economy_desc: "Расширение торговли с Германией сблизит наши две страны."
 ###
 UKR_admin_reforms2: "Административные реформы"
 UKR_admin_reforms2_desc: "Учитывая, что армия находится под контролем, мы должны коренным образом изменить администрацию государства, чтобы все прошло гладко и элегантно."
 ###
 UKR_black_sea_ger: "Черное море Привилегии Германии"
 UKR_black_sea_ger_desc: "У нас вдоль побережья Черного моря значительная популяция немцев, и предоставление им социальных и экономических льгот приблизит нас к Германии и поможет нам создать союз."
 ###
 UKR_culture: "Развитие украинской культуры"
 UKR_culture_desc: "Мы украинцы, сильные и гордые, мы должны обеспечить продвижение украинской самобытности и дистанцироваться от нашего прошлого, в котором доминируют русские."
 ###
 UKR_centralize: "Централизация власти"
 UKR_centralize_desc: "Власть должна быть централизована в голове, с тем чтобы обеспечить долгое и стабильное правление над страной."
 ###
 UKR_secret_police: "БУШК"
 UKR_secret_police_desc: "БУШК действует как секретная полиция украинского правительства, захватывая и уничтожая врагов государства дискретным и эффективным образом."
 ###
 UKR_state_militarism: "Государственная милитаризм"
 UKR_state_militarism_desc: "Украина находится в ловушке между сверхдержавами Германии и России, мы должны подготовить всех гражданских лиц в каждом городе к защите нации до их умирающего дыхания."
 ###
 UKR_voting_reform: "Реформа системы голосования"
 UKR_voting_reform_desc: "Необходимо положить конец коррумпированным выборам прошлого, с тем чтобы радикальные партии с любой стороны спектра не попадали на политическую сцену."
 ###
 UKR_big_corn: "Избыток продовольствия"
 UKR_big_corn_desc: "Государственные субсидии в сельскохозяйственный сектор привели к избытку продовольствия, особенно кукурузы, по всей Украине."
 ###
 UKR_left_coop: "Сотрудничество с левыми"
 UKR_left_coop_desc: "Сотрудничество с левыми политическими партиями в нашей стране привело к повышению эффективности нашей бюрократии, а также к росту общественной поддержки социалистических элементов в нашей стране"
 ###
 UKR_breadbasket: "Сельскохозяйственные инновации"
 UKR_breadbasket_desc: "Новые технологии в сельскохозяйственном секторе привели к повышению эффективности в ряде секторов нашей страны."
 ###
 UKR_farmer_unions: "Контролируемые фермерские союзы"
 UKR_farmer_unions_desc: "Разрешить фермерским профсоюзам снизить волнения в сельской местности и дать нам определенную степень контроля за производством продовольствия."
 ###
 UKR_farm_money: "Субсидирование сельского хозяйства"
 UKR_farm_money_desc: "Наши фермерские общины просто недостаточно прибыльны, мы должны набрать немного денег, чтобы стимулировать рост в этом секторе."
 ###
 UKR_agriculture_boost: "Возвышение сельского хозяйства"
 UKR_agriculture_boost_desc: "Народ должен объединиться для того, чтобы обеспечить продовольствием нашу обширную и растущую нацию, и мы должны выполнить свой долг, чтобы поощрять это увлечение."
 ###
 UKR_ukraine_language: "Развитие украинского языка"
 UKR_ukraine_language_desc: "Украинский язык пропагандируется по всей стране, что усиливает национализм и раздражает этнические меньшинства."
 ###
 UKR_russian_language: "Развитие русского языка"
 UKR_russian_language_desc: "Русский язык пропагандируется по всей стране, что усиливает поддержку российских меньшинств и раздражает население в целом."
 ###
 UKR_bilingual: "Поощрение развития двуязычного языка"
 UKR_bilingual_desc: "По всей стране развивается двуязычная система, которая благожелательна как для украинцев, так и для русских, но раздражает этнические меньшинства, которые не говорят ни на одном языке естественно."
 ###
 UKR_socialist_republic: "Социалистическая Республика"
 UKR_socialist_republic_desc: "Украина преодолела идеологический разрыв между демократией и социализмом, и сейчас мы стоим на перепутье между Германией и Россией."
 ###
 UKR_expansionism: "Расширение"
 UKR_expansionism_desc: "Украинский народ должен быть готов к войне со всех сторон, а наша армия должна быть достаточно большой, чтобы охватить многие фронты."
 ###
 UKR_wartime_prep: "Войны"
 UKR_wartime_prep_desc: "Ситуация в Европе с каждым днем становится все более опасной, и мы должны подготовить страну к войне, если мы хотим выжить в ближайшие несколько лет."
 ###
 UKR_infrastructure_effort: "Инфраструктура"
 UKR_infrastructure_effort_desc: "Инфраструктура Украины всегда отсутствовала по сравнению с нашими соседями, и мы должны приложить особые усилия для улучшения этой ситуации."
 ###
 UKR_industrial_effort: "Промышленное развитие"
 UKR_industrial_effort_desc: "Уделение повышенного внимания гражданской промышленности позволит нам идти в ногу с нашими нынешними и будущими врагами как на поле боя, так и на родине."
 ###
 UKR_food_imports: "Импорт продовольствия"
 UKR_food_imports_desc: "Импорт продовольствия отнимет у наших фермеров бремя и позволит им работать в других областях."
 ###
 UKR_logistics: "Совершенствование материально-технического обеспечения"
 UKR_logistics_desc: "Обеспечение наших войск предметами снабжения является ключом к победе на местах."
 ###
 ukr_join_soviets: "Присоединяйтесь к третьей международной организации"
 ukr_join_soviets_desc: "Чтобы бороться с реакциями на нашем западе, мы должны объединиться с нашим русским дыханием."


