 ukraine.45.d: "После того как Макно несколько дней отсутствовал, он вернулся в Кремль с элементами армии за спиной, он требует, чтобы комитет ушел и позволил ему взять под свой контроль правительство и восстановить порядок в стране. ~Несмотря на то, что Махно взял под свой контроль, это, несомненно, привело бы к царству террора и подъему тоталитарного государства, но на самом деле в наилучших интересах страны просто позволить ему войти и взять на себя роль председателя."
