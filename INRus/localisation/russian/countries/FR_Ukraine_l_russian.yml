l_russian:

 UKR_FUHRERREICH_DESC: "После краха Российской империи украинский народ стремился создать свое собственное государство вдоль реки Днепр. Немецкая Империя кратко создала клиентское государство, надеясь использовать огромные поля Украины для питания Имперской армии, но была вынуждена эвакуировать регион после немецкой революции в 1918 году. Украинская Народная Республика была восстановлена и ввергнута в хаос Русской гражданской войны. Победив против колшевиков, украинцы стремились дистанцироваться от России и создать уникальную украинскую самобытность, связанную между советской Россией и возрождающейся Германией. С ростом напряженности в Европе Украина должна поставить свои ставки и выбрать сторону, или быть потеряна ради анналов времени."


