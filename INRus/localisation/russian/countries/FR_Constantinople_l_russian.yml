###Ideas###

COC_British_Protection: "British Protection ( &lt; &lt; Защита Великобритании &gt; &gt; )"
COC_British_Protection_desc: "После падения Османской империи и после этого договоров британцы захватили Константинопольный город, чтобы защитить его от турок и греков."
COC_The_Mufti: "Муфтия"
COC_The_Mufti_desc: "Муфти Мехмет Рифат Борекчи переехал в Старый город Константинополь и он возбуждает мусульман против британского правления, мы можем депортировать его обратно в Турцию, но это только начнет мусульманский револьт"
COC_The_Pope: "Папа"
COC_The_Pope_desc: "Патриарх Константинополь, Бенджамин I и его Церковь жили в этом городе годами, но он всегда возбуждает православных христиан против британского правления, мы можем депортировать его в Россию или Грецию, но это только начнет православный револьт"

