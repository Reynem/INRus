 ### Characters ###
 GUO_dai_chunfeng: "Дай Чунфэн"
 #GUO_dai_chunfeng_leader_desc: "Знаменитый «Гудированный председатель» КМТ Дай Чунфэн поднялся к власти сначала как незначительный протеже покойного маршала Чианг Кай-Шека, а затем через его руководство Чжун Тэху. Преследовав очень личную интерпретацию миссии Куоминтанга объединить и оживить Китай, Дай и его союзники захватили контроль над националистическим правительством после длительного периода нестабильности, ясно дали понять, что нет альтернативы, кроме как аппарату безопасности КМТ, захватившему управление государством. Стесняясь внимания общественности, поскольку он безжалостный, Дай очень редко встречается на публике, но известно, что он популярный плейбой вроде того, когда он не работает."

 #GUO_dai_chunfeng_desc: "§YBorn: §L 28 марта 1897, Чжэцзян, Цинг Империя §L\Вариус объясняют, как тихий, но амбициозный протеже Чианг Кай-Шека пришел в Куоминтанг. Некоторые говорят, что он был представлен в Военную академию Вампоа одним из ее ведущих членов правой КМТ, Дай Чжитао - другие говорят, что его представил его его друг Мао Рендан. laobanz of ZhongTeju никогда не раскрыл своего происхождения и следовал за своим хитрым персонажем - скорее всего, никогда не будет. ninBorn in Zhejiang, Dai прожил нелегкую жизнь в дном Шанхае. До 1923 года он был наставён лидером этого комитета, вероятно, он был наставником своего рода, который был готов к тому, что он бежал в Шанхай - глава Зеленого Ганга и помощник Чин Кай-Шетс."

 GUO_chen_duxiu: "Чэнь Дюксиу"
 # GUO_chen_duxiu_leader_desc: "В 1915 году он пошёл на поиски популярного журнала "New Youth" и присоединился к левому воспитателю "Cai Yuanpei" в Пекине."
 #GUO_chen_duxiu_desc: "§YBorn: §L October 1879, Anhui, Qing Empire §L\nA пожизненный опыт провала его конфуцианских экзаменов научил одну вещь, что старый порядок должен был пойти. Столетия дикого дезертирства из извращенного Манчуа просто затмили прогресс человечества, особенно в том, что касается марксистского толкования истории. В 1915 году он принял на вооружение маленький хитроумный журнал Новой Юни и вместе с левым дидактором Кай Юаньпей в Пекине, где оба мужчины боролись против предполагаемой отсталости Китая и необходимости новой модели, нового метода, чтобы позволить Китаю вступить в современную эпоху и вновь подтвердить себя в мире. В 1915 году он принял на вооружение маленькую хитрую хижину из Нью-Дюкси идскую исследовательскую группу из Ли Дазанга, и когда в 1919 году в Пекине произошла революция революции, Чэнь Дукси считал, что естественная модель в марксистском историческом материале - рабочие и крестьяны китайского общества должны были вестить революцию против продажных богов."

 GUO_wang_jingwei: "Ван Цзиньвей"
 #GUO_wang_jingwei_leader_desc: "В 1925 году, когда Ван Цзиньвей не стал воевать со всеми силами Цин-регента Зайфэнга (отец Пюйя), он, тем не менее, оставался сенсационным революционным героем во время нахождения в плену. ~ Несмотря на то, что после Синьхайской революции Ван был освобожден, а его радикальные политические решения стали более известными. ~ И хотя он отказался подписывать клятву личной лояльности к Сунь-Ят-Сену после того, как он вновь стал членом и видным должностным лицом в правительстве Гуандона, он стал сенсационным революционистским героем. ~ После Синьхайской революции Ван был освобожден и его радикальные политические решения стали более известными. ~ В 1925 году, когда он отказался подписать клятву о личной лояльности к Сунь-Ят-Сен, он стал главным военным героем и стал известным должностным лицом правительства Гуандона. Ванг и другие радикалисты были немедленно атакованы Сан Фо и другими умеренными деятелями, но в своей будущей экспедиции, его экспедиции, он чины, х и его х х х, он хи, он держит в будущем, его х, х, он х х х х х, х, он . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . ."

 GUO_song_qingling: "Песня Qingling"
 #GUO_song_qingling_leader_desc: "Песня Цинглинг была третьей и последней женой д-ра Сунь Ят-Сена, основателя и идеологического центра партии Куоминтанг. После провала Северной экспедиции, Сон решила остаться в Китае вне закона из-за сильного чувства патриотизма. Несмотря на отсутствие у нее первоначальных полномочий, она доказала, что является вдохновляющим лидером в Повстанческой зоне и стала главой движения за демократизацию Минкуэна."

 GUO_sun_fo: "Солнце"
 # GUO_sun_fo_leader_desc: "Старший сын д-ра Сунь Ят-Сена, Сунь Фу, был постоянным присутствием в Куоминтанге, хотя и не всегда выдающимся или влиятельным. Несмотря на уважение его отца, Сунь Фо сам по себе не является харизматичным или исключительным человеком. Центристские группировки в КМТ, которые были представлены им, полагаются на его семейное имя и на его «иронную шею», чтобы сохранить свою критику программы Миншенга, представленной в партийном дискурсе. С контролем националистического правительства, вернувшегося в свои умеренные группировки, Сунь Фо занимает невидимую позицию, поскольку им приходится примириться с ненастоящими державами при одновременном сокращении социальных аспектов национальной революции."

 GUO_lin_sen: "Лин Сен"
 GUO_chen_guofu: "Чэнь Гуфу"

 GUO_li_jishen: "Ли Джишен"
 # GUO_li_jishen_desc: "В 1904 году его военная карьера стала хвастаться, когда он поступил в Узхоу и отомстил за своих павших товарищей. Он отправился на север в Пекинскую академию, где позднее стал престижной баодинговой военной академией. Когда в 1911 году вспыхнула Синьхайская революция, он присоединился к революционной армии в Цзянсу и вернулся в Пекин для завершения своих исследований."

 GUO_deng_yanda: "Дэн Йанда"
 #GUO_deng_yanda_commander_desc: "Гуандун, Цин Империя, §Deng Yanda from legage of education and интеллектуализм; его отец был учёным во время периода Гуангсю. под его руководством юный Дэнг оказался под влиянием новых либеральных идей с Запада. Будучи преисполнен решимости внести изменения против дерепта Цин Династи: он присоединился к Синьхайской революции в 1911 году и вместе с Хуаном Цисяном и Йеном учился в Баодингской военной академии в 1916 году. Несмотря на то, что Сун был изгнан из Гуандуна Чонмингсом восстанниками, Дэн оставался преданным Сунн. В 1923 году он вернулся в Гуандун. В 1916 году заместитель директора учебного отделения Вахмпо участвовал в Северном экспедиции, хотя он вызвался изучать в недавно провозглашенном Коммуне Франции, где Дэн оставался преданным Сунн. В то время, когда он работал в Охотничьей армии, он продолжал работать в Охране, а в 1923 году он работал в Охране."

 # GUO_deng_yanda_sic_desc: "§YBorn: §Lmarth 1, 1895, Guangdong, Qing Empire §L\nBorn в 1895 году, Deng Yand from sequalage of education and internatives; его отец был учёным в период Гуангсю. Под его руководством юный Денг оказался под влиянием новых либеральных идей с Запада. Будучи преисполнен решимости измениться против декрипта Цин династии, он присоединился только к Синьхайской революции в 1911 году, и вместе с Хуангом Циченгом и Йе Тингом, таким образом, он учился в Баодингской военной академии в 1916 году."

 GUO_ye_ting: "Тинг"
 # GUO_ye_ting_desc: "В то же время, как в возрасте 15 лет, Е Тинь урезал свою очередь (нарушение требования периода Манчу) в акте патриотического неповиновения, в результате которого он был исключен из школы. После выпуска его отец заставил его жениться на девушке, которая была на два года старше его, в надежде на то, что он оправится от волнений Йе Тинга, но вы ездили на север в Губей для изучения военной репутации."

 GUO_lin_biao: "Лин Биао"
 # GUO_lin_biao_desc: "5 декабря 1907 года Лин был гораздо более заинтересован в участии в студенческих движениях. До окончания средней школы в 1925 году он участвовал в профсоюзе, тесно связанном с Китайской синдикалистической партией. Когда 30-е мая в Китай прибыло движение, он принял участие в студенческой забастовке и был зачислен в Военную академию Вампоа на юге страны для участия в революции. В качестве молодого кадета Лина восхищался личностью директора Вампоа Чианг Кай-Шека. Он действовал исключительно хорошо в школе и был назначен в Северную экспедицию, где он был от заместителя вождя взвода до командира батальона в течение нескольких месяцев."

 GUO_wang_yaowu: "Ван Яову"
 # GUO_wang_yaowu_desc: "§L\nBorn детство Ван Яово было отмечено нищетой и трагедией, когда он потерял отца и старшего брата в детстве. Взрослый матерью-одиночкой, он работал в качестве торговца, когда слышал, как Сунь Ят-сен открыл военную школу в Гуанчжоу - Военная академия Вампоа. Он сразу же занял деньги у своего работодателя и направился на юг, где он стал одноклассником Лина Биао. ~ В ходе Северного экспедиции он стал известен своим терпимым командованием под огнем и с особым акцентом на оборону. Знаменитый анекдот пошёл вокруг Бейянга, что было бы лучше встретиться с королем Хеллы, когда он увидел короля Яовя (в качестве Вана и короля, разделяющего тот же персонаж на китайском языке). Когда экспедиция потерпела неудачу, он присоединился к Певцу и остаткам Национальной революционной армии в зоне Цзянфу."

 GUO_xu_xiangqian: "Сюй Сянцянь"
 #GUO_xu_xiangqian_commander_desc: "Весной 1919 года Сюй стал членом относительно богатой семьи в Шанси, где его отец работал в качестве научного сотрудника Цинь-Династии. К сожалению, состояние семьи стало уменьшаться, и в результате Сюй был вынужден собирать навоз, дрова и дикие овощи, чтобы помочь своей семье выжить. Весной 1919 года Сюй поступил в Провинциальную обычную школу Шанши, где получил образование. После слушаний в 1924 году в Сун-Ят-сенс, недавно учрежденной Военной академии Вампоа, он направился на юг из Шанхая вместе с другими местными жителями Шанси, чтобы принять участие в Вампоясах, первом выпускном классе."

 GUO_zhang_yunyi: "Чжан Юньи"
 # GUO_zhang_yunyi_commander_desc: "Гуандун, Цин Империя §Y Военная карьера: §L\nBorn в бедную крестьянскую семью Чжан Юньи посещал начальную школу Гуандунской армии, когда ему было 16 лет до того, как он вступил в Тонгменгуйскую армию Сунь Ят-сена в следующем году; после участия в национальной войне за защиту он некоторое время служил в армии Гуандун, прежде чем вступить в Националистическое правительство Сунь в Гуанчжоу. В это время он вступил в Национальную революционную армию и участвовал в восточных экспедициях против Чэнь Цзюньмина, а затем в плохой северной экспедиции. К тому времени он был повышен до общего уровня и был членом Главного штаба. ~ После поражения Куоминтанга Чжан присоединился к своим друзьям генералам Йе Тинг и Сюаньцяньцяном в недавно созданной повстанческой зоне Цзянфу. За годы он приобрел репутацию харизматичного и похвального лидера."

 GUO_xue_yue: "Сюэ Юэ"
 # GUO_xue_yue_desc: "В 1918 году он вернулся в Гуандун, чтобы принять участие в армии, созданной Сун Ят-сеном и Чэнь Цзюньмингом, перед тем как взять сторону Сунь-Чэнь во время раскола в Сун-Чэнь и помочь Спонглингу уехать из федеральной военной академии. В 1917 году он был принят в шестой класс Баодинга. В 1918 году он вернулся в Гуандун, чтобы принять участие в армии, созданной Сун Ят-сеном и Чэнь Цзюньмингом, после того как он стал членом Центрального комитета в Европе. В конце 1920-х годов он был направлен Центральным комитетом, чтобы присоединиться к коммуне Бхартия в качестве атташе."

 GUO_zhang_fakui: "Чжан Факуи"
 # GUO_zhang_fakui_desc: "В 1922 году, когда Чэнь Цзюньминг сместился в Гуанчжоу, он отказался сдаться и продолжал сражаться в Гуанси. Нн. Когда Сун вернулся в 1923 году, Чжан собрал войска, чтобы изгнать Чэнь Цзюньмин и помочь создать новое революционное правительство. В 1922 году, когда Чэнь Цзюньмин сверг Сунь, Чжан проявил свою лояльность к Солнцу, отказавшись сдаться и продолжил сражаться в Гуанси. Нн. Когда Сун вернулся в 1923 году, он собрал войска, чтобы изгнать Чэнь Цзюньмин и помог создать новое революционное правительство. В 1922 году, когда Чэнь Цзюньмин сверг Сунь, Чжан продемонстрировал свою лояльность к Сунне, отказав сдаться и продолжил сражаться в Гуанси. Нн. Когда Сун вернулся в 1923 году, Чжан собрал войска, чтобы изгнать Чэнь Цзюньминг и помог им создать новое революционное правительство. В 1922 году, когда Чэнь Цзюньчж был вынужден отой экспедией, он также был вынужден отой экспедицией, когда члены Ченгерской эксканской эксканской эксканской экспедии."

 GUO_cai_chang: "Кай Чан"
 # GUO_cai_chang_commander_desc: "В 1919 году Кай Чан и Сян Цзинью, ее одноклассница, приняли участие в Дилигентском движении по изучению рабочих мест во Франции. В этот период она была привлечена к цветущей синдикальной революции во Франции и присоединилась к группе Дэн Сяопин и Чжоу Энлай, хотя позднее на нее повлияли более социал-демократические идеалы и она покинула их более марксистские наклонности."

 GUO_xiao_ke: "Сяо Ке"
 # GUO_xiao_ke_commander_desc: "14 июля 1907 года нДжиае, Хунань, Цин Империя, §Y Военная карьера: член Китайской синдикалистской партии Сяо Ке присоединился к националистическому правительству в Гуанчжоу в качестве военного полицейского и, в конечном счете, политического инструктора. После окончания Вампоа он вступил в Национальную революционную армию в северной экспедиции. Когда Куоминтанг был побежден в северной экспедиции, он остался в районах Цзянси и Фуджиан, где он последовал за генералом Йеном, сражаясь против вооруженных сил Лиги восьми провинций. После нескольких сражений Сяо Ке стал новым командиром НРА. Несмотря на то, что он участвовал в нескольких битвах, он все еще молод и не имеет опыта ведения партизанской войны."

 GUO_chiang_wei_kuo: "Чианг Вэй-ку"
 #GUO_chiang_wei_kuo_commander_desc: "Японская империя (n §YY) Военная карьера: §L\nChiang Wei-kuo родилась в Японии как биологический сын японской подружки Дай Цзито и Дай Джитао. В качестве ведущих членов Куоминтанга Дай Чжито и Чианг Кай-Шека (которые были так близки, что были практически братьями) вынуждены бежать в Японию, чтобы бежать от правительства Беянга. Молодой Вей-куо был по существу воспитан чиангом и напарницей Чианга Яо Ехенга, и, таким образом, он был принят в семью Чианга, особенно потому, что мать Чианга скучала по своему младшему сыну Чиангу Рукки (что они были так близки, что они были близкими братьями) пришлось бежать в Японию, чтобы сбежать от правительства Бейянга. ~ nntraydatedy weighgedy by the National thating the Nationalking the National Distian Argerian Argards в Северной экспедиции."

 GUO_hu_zongnan: "Ху Цзоннан"
 GUO_hu_zongnan_sic: "Ху Цзоннан"
 #GUO_hu_zongnan_sic_desc: "§YBorn: §LMay 16, 1896, Чжэцзян, Цинг Империя §L\n Для своих последователей он является образцовым лидером, который напоминает покойному главнокомандующему Национальной революционной Армией (НРА) диктующий себя не более, чем диктуемый династией диктуемый династией диктант, который, по всей видимости, является не более чем марионеткой более теневых и зловещих сил, которые, как представляется, захватили Китай. nonhu Zongnan, родилась в 1896 году, его товарищ Чжецзяннезе, который сделал его фаворитом Циан Кай-Шека и близким родственником Дай-Чунфэнга. С раннего возраста он уже был связан с более незаконным бизнесом; он присоединился к Ван Якьяо Акс Ганг и вошел в первый класс недавно открытой военной академии Вампоа в 1924 году. Он, как сообщается, он был найден более любимым из-заветливой армии, он принял его заявление из-за уговорения Лио Чжонка. . В то, что Северная экспедиция, как и многие другие, бежали из Европы."

 GUO_hu_zongnan_leader_desc: "Ху Цзоннан был одним из самых доверенных протеже Чианг Кай-Шека и образцовым молодым командиром во время северной экспедиции. После вмешательства Германии недоверие Ху к доминирующим гражданским фракциям и его дружба с Дай Чунфеном заставили его возмущаться политически мотивированным вмешательством руководства левой КМТ в вопросы войны. Связи Ху с НРА и Чжун Тэ Чжу сделали его критической фигурой в росте бюро и последующем успехе переворота Даи против гражданского правительства. Из-за его политической неотступности и лояльности Ху был назначен исполняющим обязанности президента на период ."state of emergency\" that Dai Chunfeng and the ZhongTeJu now govern through. While not an especially charismatic or skilled politician, he and Dai are close friends and his prominence ensures that the army maintains loyalty to the current regime."
 # GUO_hu_zongnan_commander_desc: "12-е мая 1896-е года н-Зенхай, Чжэцзян, Цин Империя, §Y Военная карьера: §L\nHu Zongnan был одним из самых доверенных протеже Чианга Кай-Шека и образцовым молодым командиром во время Северного экспедиции. После немецкого вмешательства недоверие Ху к доминирующим гражданским фракциям и дружба с Дай Чунфеном привели его к возмущению политически мотивированным вмешательством руководства левой КМТ в вопросы войны. Узы Ху и НРА и Чжонг-Теджу сделали его критической фигурой в росте бюро. Хотя особенно харизматичный или опытный политик, он и Дай не являются близкими друзьями, и его авторитет гарантирует, что армия сохраняет верность нынешнему режиму."

 GUO_du_yuming: "Дю Юминг"
 # GUO_du_yuming_desc: "В 1924 году Дюминг учился на экзаменах в Пекинском университете и Пекинском обычном университете, когда он встретил статью в журнале «Новая молодежь», в которой он призвал китайскую молодежь подать заявление и поступить в новую военную школу на юге — Вампоа. Затем он отказался от своих исследований, и по рекомендации Ю Юй Юсана стал членом британского университета «Вампоа» первого класса. Затем он служил под командованием Хе Инкина и участвовал в подавлении торгового корпуса и боях против Чэнь Цзонминга в Восточной Экспедиции. В ходе особой битвы в Европе он был одним из первых, чтобы заполучить городскую стену, несмотря на тяжелые вражеские пожары. В 1925 году он был в числе тех, кто присутствовал на смертном ложе д-ра Сун Ят-сенс в Пекине. В 1926 году началась Северная экспедиция, и Дюминг отправился на юг из Пекина."

 GUO_dai_anlan: "Дай-Анлан"
 # GUO_dai_anlan_commander_desc: "25 ноября 1904 года он решил переименовать себя Анланом (что означает успокоение волн), чтобы показать свои цели и посвятить себя революции, ведущейся Куоминтангом. Затем он отправился на юг в Гуанчжоу, чтобы принять участие в третьем классе Вампоа. . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . ."

 GUO_dai_anlan_desc: "25 ноября 1904 года он решил переименовать себя Анланом (что означает успокоение волн), чтобы показать свои цели и посвятить себя революции, ведущейся Куоминтангом. Затем он отправился на юг в Гуанчжоу, чтобы принять участие в третьем классе Вампоа. . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . ."

 GUO_li_zhilong: "Ли Жилонг"
 # GUO_li_zhilong_desc: "§L\n §YBorn: 10 декабря 1907/n Myanyang, Hubei, Qing Empire\n §YNaval Perspective: §L\nLi Zhilong стал коллективистом и присоединился к Китайской синдикалистской партии после встречи с единомышленником Донг Биву. После этого он присоединился к Куоминтангу и отправился в Академию Вампоа. Сбежав с Центральным комитетом после провала Северной экспедиции, Ли отправился во Францию и одновременно задумался изучить военно-морские доктрины."

 GUO_chen_shaokuan: "Чэнь Шаокуан"
 # GUO_chen_shaokuan_desc: "В 1916 году он был направлен в Соединенные Штаты для изучения воздушного судна и подводных лодок и наблюдения за войной в Европе. Когда в 1926 году вспыхнула Северная экспедиция, Чен Шаокуан, который поддерживал эту революцию, отвернулся от Сун Чуаньфана и присоединился к Национальной революционной армии. К сожалению, после прибытия немецкого военно-морского флота Чен Шаокуань был вынужден покинуть свой корабль и следовать за Куоминтангским центральным комитетом в изгнание в Коммуне Франции."

 GUO_liao_zhongkai: "Ляо Чжункай"
 # GUO_liao_zhongkai_sic_desc: "С возвращением Центрального комитета в Фуджиане чрезвычайное правительство было немедленно сформировано для того, чтобы слиться с лидерством и возвращающимся Центральным комитетом из Парижа, Сан-Франциско. В 1877 году, чтобы воздать должное лидерству Вангса, не было другого человека, подходящего для этой работы, кроме Ляо Чжонкай, старого государственного деятеля, личного друга Солнца, и, возможно, один из первых членов организации Куоминтанг . В 1877 году д-р Сун-Борн в Сан-Франциско, когда он увидел, как Китай унизил поражение во время Первой китайско-японской войны, Лиао, обратил свое внимание на западные исследования и женился на едином революционёре Хе Сянгининг в 1897 году. В 1897 году супружеская пара отправилась в Японию, где они были глубоко перемещены д-ром Ят-сенангом, революционными деятелями и членами его организации в 18 декабря 2013 года"

 GUO_chen_gongbo: "Чэнь Гонгбо"
 # GUO_chen_gongbo_sic_desc: "§YBorn: §L October 19, 1892, Guangdong, Qing Empire §L\nAn ранний революционер, чтобы сказать, что Чэнь Гонгбо путешествовал по партийным линиям, является серьезным преуменьшением. Выдающийся марксист и представитель Китайской синдикалистической партии Гуандинга (КСП) в 1922 году, он, как и многие другие в левом крыле партии, ушел из СКП из-за своей поддержки Чэнь Цзюнгмин. В 1923 году он поехал в Нью-Йорк, чтобы учиться в Колумбийском университете, а в 1925 году был завербован в Куоминтанг его левым лидером Лио Чжонкай."Revelations in Chinese History" and his newspaper “The People’s Vanguard.” To Chen, the Kuomintang must be the revolutionary vanguard, and its ranks must be filled with determined comrades willing to purge and “reorganise” the party along correct ideological lines. From there, the one-party state will reorganise the workers and peasants of the country into economic producers of society - with the eventual goal of utopian socialist economic cooperatives in both the agricultural and urban sectors of the country. He envisions a China-built from the ground up by the workers and for the workers, one that will finally break the chains of western imperialism by pursuing its native capital with the help of the state. As such, economically he does support the confiscation of land by force through the peasantry should the landlords not accept government intervention. With Wang’s consolidation of rule following the First Repatriated Congress of the Kuomintang, Chen emerged as the premier leader of Wang’s inner circle - with his advice and loyalty ever so valued by the Chairman.§!"

 GUO_zhou_enlai: "Чжоу Энлай"
 # GUO_zhou_enlai_leader_desc: "Несмотря на то, что Чжоу Энлай в течение многих лет работал на заднем плане, он был выдающимся политиком и государственным деятелем. Будучи известной семьей секретарей, Чжоу получил образование в западных школах как в Китае, так и во Франции и Японии. После того, как он стал радикализирован революционными идеалами начала 1920-х годов, Чжоу присоединился к КМТ и быстро поднялся в своих рядах, став главным министром иностранных дел в середине 30-х годов."

 GUO_chen_bijun: "Чэнь Бижун"
 # GUO_chen_bijun_desc: "§YBorn: §LNovember 5, 1891, Penang, Survey Solution §L\nChen Bijun родилась в богатой китайской семье в Пенанге, Британская Индия. 17 года молодой страстный революционер Ван Цзингвей, который посетил Пенанг, поймала и восхищалась. Ван, который был в Тонгменгуе, призвала молодого Чэна вступить в партию, и она встретилась с Сунь Ятсеном в Сингапуре в 1908 году и стала его секретарем. После заключения в Ванцс после его неудачного покушения на Зайфэн, она поехала в Гонконг, чтобы запланировать его побег. ~ ~ Несмотря на то, что Синьхай Революция вспыхнула, Ван была освобождена из тюрьмы, а в 1912 году двое из них были наконец женаты. , они отправились во Францию для изучения и возвращения в 1917 году, чтобы помочь движению «Сунзенс». Когда Сун убежала в Шанха после того, как он был изгнан из Гуандона, дружил его ха, когда он всегда был веренщиком, она присутствовала в Сун дружила в 1921."

 GUO_zhou_fohai: "Чжоу Фохай"
 # GUO_zhou_fohai_desc: "ACYBorn: §LMay 24, 1897, Hunan, Qing Empire §L\n An ранний Марксист, Чжоу Фохай, с самого начала своей революционной карьеры стал близким партнером Китайской синдикалистической партии."

 GUO_li_shiqun: "Ли Шикун"
 # GUO_li_shiqun_desc: "§YBorn: 24 апреля 1905 года, Чжэцзян, Цинг Империя §L\nBorn в 1905 году в Суичанге, Чжэцзяне, Ли Шикуне посещал Шанхайскую академию изящных искусств в 1924 году и, в 1926 году, в Шанхайском университете. В разгар революционной массовой политики Северной экспедиции Ли присоединился к Китайской синдикалистической партии (КСП) и, как и многие китайские социалисты; бежал во Францию после провала Северного экспедиции."

 GUO_eugene_chen: "Юджин Чен"
 # GUO_eugene_chen_desc: "§YBorn: 2 июля 1878 года, Сан-Фернандо, Тринидад и Тобаго §L\nEugene Chen является уникальным членом китайского куоминтанга, поскольку он не является ни грамотным, ни свободно владеет китайским языком. Родившимся за границей в Тринидаде и Тобаго, семья Чэнь редко говорит по-китайски и снисходителен к литературному миру англоязычных писателей. Тем не менее, его детский опыт и красноречие на английском языке сделали его важной фигурой в поддержании отношений с международными союзниками Куоминтанга, коммуной Франции и Союзом Великобритании."

 GUO_li_shizeng: "Ли Шизенг"
 #GUO_li_shizeng_desc: "В 1900 году во время восстания боксеров семья Линьса бежала из вступающих союзных армий. В юном возрасте он встретил Чжана Ренцзе, Ву Чжихуи и Кай Юаньпея - всех четырех молодых людей, которые разделили свое негодование за правительство Цина и надежды на более радикальную реформу. Они приехали во Францию, где они активно участвовали в растущем анархистском движении. В анархии они увидели решение для Китая - революцию общества, направленную на освобождение женщин, отмену жесткой иерархии конфуцианства, поощрение морали и обеспечение равенства. Кроме того, они присоединились к газете Сун Ят-сенс Тонгхуи , в которой они приняли активное участие, и один из спонсоров которой был открыт для молодой революции во Франции. Ван Цзян , Революция во Франции ."

 GUO_zhang_renjie: "Чжан Ренцззе"
 #GUO_zhang_renjie_desc: "§YBorn: §L 19 сентября 1877, Чжэцзян, Цинг Империя §L\n Как мальчик, Чжан продемонстрировал талант в классической китайской игре Go - возможно, предвестник своего глубоко укоренившегося интеллекта и понимания сложной политики Китая. В молодом возрасте он встретил Ли Шизенга, который стал его близким другом, так как оба разделяли свои идеи относительно радикально иного Китая. ni zhang, возможно, был радикальным анархистом в своей молодости, но его идеи сместились в более консервативные взгляды на анархизмизм. В Шанхае он был первым членом Tongmenghui и организатором программы Work-study, который внес значительный вклад в дело Sun. Он отчаянно нуждался в средствах вскоре после изгнания президента. В годы, когда Sun был в изгнании, Чжан хорошо работал на фондовом рынке и внес значительный вклад в финансирование ранней Kuomintang. В Шанхае он знакомился с Чен Кимеи, который был покровителем относительно амбициозной и чиан Кай."

 GUO_zhang_guotao: "Чжан Гуотао"
 #GUO_zhang_guotao_desc: "§YBorn: §L November 26, 1897, Jiangxi, Qing Empire §L\nA, известный марксист, Чжан Гутоао, изучал марксизм под известным марксистом Ли Дажао в Пекинском университете и вскоре после этого присоединился к Китайской синдикалистской партии (КСП). В ЦУП он служил в качестве высшего должностного лица партии и руководил рядом забастовок работников железнодорожной и текстильной промышленности, а также других членов КСП. Хотя первоначально он выступал против этого, он присоединился к китайской Куоминтанге накануне Северной экспедиции и бежал, как и многие другие, в Европу. ~ ni ni no, в изгнании он был восхищен более тоталитарными штаммами социализма, которые питали демагоги, подобные британскому Освальду Мосли. Верующий в необходимость апогейской партии продолжать революцию, Чжан считает, что для завершения революции необходимо похитрить партию реакционных элементов. В этой связи он присоединился к более радикальным группировкам Куом Куманганга, сохраняя контакты с СОП."

 GUO_mao_renfang: "Мао Ренфан"
 # GUO_mao_renfang_desc: "Мао Ренфэн с детства служит одним из самых доверенных мужчин, всегда готовых делать и говорить что угодно, что угодно, Чжэцзян. Они оба учились в Высшей школе Вэньси и Первой школе Чжэцзянской провинции. Предположительно, Мао будет поощрять молодых и амбициозных Дай Чунфэна поступить в военную академию Вампоа. Несмотря на то, что он был принят в четвертый класс Вампоа, он был вынужден бросить школу из-за болезни. Когда Северная Экспедиция не сработала, он и Дай бежали в теневые легитимистские города. Там они сохранили роль в подземном мире таких мест, как Шанхай, терпеливо ожидая возвращения движения, чтобы бросить вызов Жили. Когда Центральный комитет вернулся, они сразу же присоединились к левому Куоминтангу после его завоевания в Лиге."

 GUO_chen_lifu: "Чэнь Лифу"
 # GUO_chen_lifu_desc: "Племянник известного члена Куоминтанга Чэнь Кимея, Чэнь Лифу и его старший брат Чэнь Гуфу остаются политическими аутсайдерами преимущественно социалистического куоминтанга, поскольку ни один из них не был особо привержен социализму. После того как Чэньский университет Питтсбурга получил степень инженера, Чэнь Лифу присоединился к Куоминтангу в 1925 году в рамках его Юношеской гвардии и стал свидетелем поражения северного экспедиции. Во время северной экспедиции он служил секретарем Чианг Кай-Шека. После поражения и последующего убийства братья Чэнь сбежали в Шанхай вместе с Чжаном Ренджи, их наставником. Там они занимались торговлей акциями и вступали в контакт с членами Шанхайского подполья, такими как Дай Чунфэн."

 GUO_gu_mengyu: "Гу Менгю"
 # GUO_gu_mengyu_desc: "§YBorn: §L 18 октября 1888, Zhili, Qing Empire §L\nGu представляет собой интересного члена Вангсского внутреннего круга. В то время как он часто находится на расстоянии от Вангса, он находится в оппозиции к Вангусу ΔGang of Chen Gongbo. Владея английским, французским и немецким языками, он работал в Пекинском университете до того, как его познакомили с китайским Куоминтангом Кай Юаньпей и Ли Шизенг. После того, как Северная экспедиция потерпела неудачу, он бежал в Париж с Центральным комитетом. nngu, процветающим писателем по социализму, они могли бы развивать политическую власть и поддерживать рост местного самоуправления. nnNononetheles, будучи приверженным росту местной демократии, Гу, крайне противостоит революции масс. В частности, он верит в необходимость земельной реформы, организуя крестьянскую деятельность в ассоциации. В то время как левое руководство, возможно, не будет иметь решительного лидерства."

 GUO_tv_song: "Песня T.V."
 # GUO_tv_song_desc: "Брат сестер-песня Т.В. Сон родился в Шанхайской концессии до получения степени бакалавра экономики Гарвардского университета. С этого момента он получил докторскую степень по экономике, а затем вернулся в Китай в 1923 году, чтобы служить секретарем на английском языке для своего мужа-сестра д-ра Сунь Ят-сена. ~n nin Hun Sunn's революционное правительство в Гуандуне, Сон служил министром финансов, а также министром финансов последующего национального правительства Гуанчжоу. За время своего пребывания в должности с 1924 по 1926 год экономика Гуанчжоу значительно выросла. После провала Северной экспедиции он бежал в Легиональные города. По возвращении Центрального комитета и воссоздании Куоминтанга на китайском материке, однако его опыт в области экономики, несомненно, приветствуется любой фракцией КМТ.§!"

 GUO_chiang_ching_kuo: "Чианг Чинг-Куо"
 # GUO_chiang_ching_kuo_desc: "Сын Чин Кай-Шека и его первая жена Мао Фумеи, Чианг Чинг-Куо были всего лишь один год, когда революция в Синьхайе потрясла Китай. С самого раннего возраста он не знал ничего, кроме строгой дисциплины и дистанции своего отца, который заставлял его изучать китайскую классику и английский язык. Его отец заставлял его составлять еженедельное письмо, когда Чинг-Куо оставался в Шанхае, в то время как его отец жил в Гуанчжоу."

 GUO_deng_yingchao: "Дэн Инчао"
 # GUO_deng_yingchao_desc: "§YBorn: 4 февраля 1904 года, Гуанси, Цинг Империя §L\nBorn в качестве Дэн Венсху в 1904 году в Наннинге, Гуанси; Дэн Йинчао выросла в детстве бедности, когда ее мать работала в качестве одного из родителей, чтобы содержать свою семью. Она посещала Нормальную школу Бейянга для женщин в Тяньцзине, где она принимала участие в антиимпериалистических протестах и забастовках. Именно здесь, после волне волнений после Велкрейга, она встретила своего будущего мужа Чжоу Энлай."

 GUO_cai_yuanpei: "Кай Юаньпей"
 # GUO_cai_yuanpei_desc: "§YBorn: §L 11 января 1868, Чжэцзян, Цинг Империя §L\n. Как один из четырех старейшин Куоминтанга, Кай Юаньпей демонстрирует значительное влияние в партии. Тем не менее, он известен не только своей мудростью и тактикой, но и своей страстью к образованию и исследованиям как один из самых известных китайских педагог. В возрасте 26 лет Кай был назначен в Хэнлинскую имперскую академию. В 1904 году он основал в Гуангфухуай, антиманчскую организацию, и присоединился к Сун-Ят-сенс Тонгхуи. Соратник вместе с Ву Чжхуи и Ли Зизенгом учился в Германии, затем стал президентом Пекинского университета. В период своего пребывания на посту президента он вновь завербовал таких известных интеллигентов, как Ли Дажо, Чэнь-Дуси, Ху Ши, и даже художник Сюй Бейхонг. В 1922 году он ушел со своей должности во Францию, но вернулся в 1926 в Северную Экспедию. . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . ."

 GUO_su_yu: "Сю Ю"
 # GUO_su_yu_desc: "5 марта 1904 года он участвовал в студенческих движениях Хунанана в начале 1920-х годов."

 GUO_zhou_zhirou: "Чжоу Чжиру"
 # GUO_zhou_zhirou_token_desc: "В 1919 году он был принят в престижную военную академию Вампоа . Когда он услышал новости об учреждении в 1924 году Военной академии Вампоа , он ушел из Баодинга и направился на юг для участия в национальной революции."

 GUO_mao_bangchu: "Мао Банчу"
 #GUO_mao_bangchu_air_chief_desc: "В 1927 году он закончил третий класс Военной академии Вампоа в Гуанчжоу, где его обучали французские советники основам военной подготовки и предметам."

 GUO_he_zhonghan: "Г-н Чжунхан"
 #GUO_he_zhonghan_desc: "В то время как он изначально был связан с бывшей американской армией синдикалистской партии, он был изгнан из группы из-за конфликта с Чжаном Гуоттао, а затем стал преподавателем средней школы до тех пор, пока не был представлен его бывшим наставником Дуном Биу в Сан Ятсен, революционное правительство в Гуандоне."

 GUO_deng_wenyi: "Дэн Веньи"
 # GUO_deng_wenyi_desc: "Когда ему было двадцать два года, Дэн Веньи отправился из своего города в Хунань, чтобы посетить первую классную лекционную школу в Базовом лагере, открытую его коллегой Хунчжоу, Хунань, Цин Эмпайр. Школа открылась в 1924 году, но в конце этого года, когда один из лидеров этого первого класса вернулся в Китай, он стал главным военным училищем - Сун Ят-Сен Вампоа. В качестве первоклассника он сделал себе имя, получив ранение в Восточной экспедиции против Чэнь Цзингминга."

 GUO_chen_jiliang: "Чэнь Цзянь"
 # GUO_chen_jiliang_desc: "Yadmiral Описание §YBorn: §L\n1883\nFuzhou, Fujian, Qing Empire\n §YNaval карьера: §L\n The адмирал"Republic of China Navy", Chen Jiliang began his naval career in 1897 at the Nanjing Jiangnan Naval Academy. After graduation, he served on the cruiser “Hai Rong” and when the Xinhai Revolution broke out he supported the revolutionaries. In 1921, he served as captain of the Yangtze River Patrol and by 1924, he held the title of rear admiral. When the Northern Expedition broke out in 1925, Chen Jiling chose to defect to the National Revolutionary Army. However, the revolution’s failure prompted him to follow much of the Central Committee into retreat in Europe. Since he already held the qualifications of an experienced seaman, he naturally found a home in the Union of Britain - where he has been studying the latest in naval tactics and developments with the hope that one day he will be able to bring about the creation of China’s own modern fleets."

 GUO_fang_zhimin_commander_desc: "Его агрессивный и догматический подход к продвижению националистической революции привел его к тому, что он сначала стал союзником группировки Миншенг, а затем Китайской синдикалистической партии."junior partner" in the Nationalist Revolution makes Chen's unlikely election a strain on the Nationalist Government's previous synonymity with the KMT. Fang is a charismatic leader who acts as a bridge between the growing radical collectivist movement and the order established by the KMT."
 # GUO_fang_zhimin_leader_desc: "Один из самых выдающихся политиков и командиров военизированных формирований в зоне повстанческого движения Цзянфу Фан Чжимин был туземцем и активистом Цзянси, который стал близким помощником Сонг Цинглинга как в гражданских, так и в военных делах."junior partner" in the Nationalist Revolution makes Chen's unlikely election a strain on the Nationalist Government's previous synonymity with the KMT. Fang is a dogmatic and charismatic leader who acts as a shaky bridge between the growing radical collectivist movement and the order established by the KMT."
