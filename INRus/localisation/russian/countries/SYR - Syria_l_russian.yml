 SYR_Jerusalem_Joins_Revolt: "Арли Поддержи в §Иерусалиме!"

 SYR_lebanon_independence_war: "Война за независимость Ливана"
 SYR_lebanon_independence_war_desc: "Весь сирийский регион все еще опустошен после кризиса в Леванте и голода, и этот конфликт не может затянуться слишком долго."

 ### Introduction ###
 SYR_guide: "Партия §! - §mamascene Wing§! (социальное_либеральное_цветное долл.) / §MAleppan Wing§! ($mark_либеральное_цветное долл.) - nwhite_dot Hail League of National Action, Leban Reform Party, и Народная партия образуют коалицию на первых сирийских выборах. - Nwhite_dot Когда Народная партия выиграет выборы, пусть аль-Джазайри станет президентом, чтобы иметь §lDamascene Wing§!"Re-open the Military Academies\" focus.\n\n§MNational Bloc§! ($social_conservative_coloured$)\n£white_dot Have the National Bloc comes out on top in the first Syrian elections.\n£white_dot Don't dismiss al-Za'im after completing the \"Re-open the Military Academies\" focus.\n£white_dot Still having the idea \"Mt Lebanon Conflict\" will cause a Lebanese revolt and allow us to play as them while doing the focus \"$SYR_abolish_mt_lebanon$\".\n\n§MMilitary Government§! ($paternal_autocrat_coloured$) / §MSyrian Social Nationalist Party§! ($national_populist_coloured$)\n£white_dot Dismiss al-Za'im after completing the \"Re-open the Military Academies\" focus.\n£white_dot To have the §PMilitary Government§! in power, complete \"The Military Mandate\" focus.\n£white_dot To have the §nSyrian Social Nationalist Party§! in power, complete the \"Pursue of Basic Principles\" focus. Still having the idea \"Mt Lebanon Conflict\" will cause a Lebanese revolt and allow us to play as them while doing the focus \"$SYR_syrian_assimilation$\".\n\n§MArab Kingdom of Syria§! ($authoritarian_democrat_coloured$)\n£white_dot Choose to turn Syria into an Egyptian puppet in \"The Status of Syria event\". This path will not allow us to choose from any of our foreign policy trees and will guarantee the Lebanese revolt.\n§CNote: This path is only playable by the AI.§!"

 SYR_guide_1: "Cedar Stands Tall - §MKR_game_rule_flag_LEB Ливан §! n yight_dot Либо идет по §MNational Bloc§!, либо §MSyrian Social Nationalist Party §! Путь и, завершая фокус \"$SYR_abolish_mt_lebanon$\" or \"$SYR_syrian_assimilation$\", respectively, while having the idea \"Mt Lebanon Conflict\", will result in a Lebanese rebellion, allowing us to play as them.\n\n$LEB_guide$"

 ### Events ###
 syrian_foreign_policy_events.1.t: "[SYR. GetNameDefCap] приглашает нас в Лигу арабских государств"
 syrian_foreign_policy_events.1.d: "Для укрепления единства арабских народов и их защиты от империалистических амбиций правительство Дамаска объявило о новой инициативе по укреплению экономических и дипломатических связей между различными арабскими государствами."Arab League\", this supranational organisation is without a doubt a tool of the Damascene government to extend their influence over the peninsula but it is also a genuine attempt by Arab nationalists to strive for a stronger and more prosperous Arabia."
 syrian_foreign_policy_events.1.a: "Мы с радостью примем это!"
 syrian_foreign_policy_events.1.b: "Нам не нужно, чтобы они вмешивались!"

 syrian_foreign_policy_events.2.t: "[FROM. GetNameDefcap] Принимает наше предложение"
 syrian_foreign_policy_events.2.d: "Наши друзья в [Фром.Гетнаме] приняли наше предложение и создали условия для их полного вступления в Лигу арабских государств."
 syrian_foreign_policy_events.2.a: "Добро пожаловать!"

 syrian_foreign_policy_events.3.t: "Отклоняет наше предложение."
 syrian_foreign_policy_events.3.d: "Гадкие собаки в [Фром.Гетнаме] решили, что совместное использование их водопроводной трубы с империалистическими торговцами обувью более достойно их времени, чем единство арабских народов, хотя маловероятно, что мы сможем изменить их мнение, толпа политиков по всей Сирии подняла свой голос против этой отвратительной предательства."
 syrian_foreign_policy_events.3.a: "Да погубит их Аллах!"

