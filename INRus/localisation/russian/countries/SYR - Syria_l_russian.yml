 SYR_antun_saadeh: "Антун Саадэх"
 SYR_antun_saadeh_leader_desc: "§YBorn: §! §L Март 1, 1904, Дхур Эль-Хуэйр, Вилайет Бейрута, Оттоманская империя §!!! §! §Larantun Saadeh — человек, обладающий многими талантами и незначительным терпением. После того как он прожил половину своей жизни за границей на западе, Антун вернулся на свою родину в 1930 году. В руинах Веткриг основал Сирийскую социал-националистическую партию, политическую партию, приверженную продвижению социал-национализма, уточнив синкретизм социалистических и националистических идей, которые Сааде развил во время своего пребывания за границей. Он был арестован Османской империей в 1935 году, когда он публично объявил о существовании партии, но его вера в Сирию, освобожденную от оков западного и оттоманского империализма и объединенную принципами социализма, неподкупна.§!"

