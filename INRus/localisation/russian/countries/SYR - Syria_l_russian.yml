 ## Syrian Republic
 syrian_republic_events.1.t: "Провозглашение Сирийской Республики"
 syrian_republic_events.1.d: "В то время как основное поле боя в Левантийской войне, район Большой Сирии находится в полном беспорядке, ее политическая элита была разрушена убийствами, депортациями и казнями, поскольку месть за османную оккупацию осуществляется без милосердия партизанскими группами и арабскими националистами. Несмотря на то, что (ранее) суннитская каста, правившая Сирией на протяжении почти тысячи лет, многие из них осторожно пытаются найти свою опору на этом незнакомом ландшафте, поскольку власть семей, торговцев и землевладельцев в настоящее время зависит как от арабских нерегулярных лиц, бродящих по сельской местности, так и от египетской армии, пытающихся сгладить переход к стабильному, но «лояльному» правительству в Дамаске."
 syrian_republic_events.1.a: "Похоже, у нас для нас есть работа..."

 syrian_republic_events.2.t: "Всесирийский конгресс: Национальная партия Блок и Народная партия"
 syrian_republic_events.2.d: "Всесирийский конгресс, созванный элитой Дамассена под присмотром египетских наблюдателей и с многочисленными дополнениями со стороны эмигрантов в Египте, попытается найти решение фактической гражданской войны, которая бушует по всей Великой Сирии. Тем не менее быстро стало очевидно, что сирийское «единое» лицо, существовавшее до войны, нигде не может быть найдено в качестве семейного, регионального и многовекового конфликта. Крупные землевладельцы, высокопоставленные религиозные деятели и сторонники старой ближневосточной системы покровителей и клиентов, к которым относится большинство жителей Дамассена, объединились в Национальный Блок, который рассматривает себя как продолжение и Аль-Фатаха (сирийское сопротивление во время Вельткриега) и послевоенного антитурецкого движения. Крупные землевладельцы, высокопоставленные религиозные деятели и сторонники старой ближневосточной системы покровителей, с положительной стороны египетского правительства, но с уходом турецких войск, столкнулись с растущей враждебностью по отношению к Национальному Блоку, но против его южного сирийского фокуса, промышленники и торговцы Алеппо объединились в народную партию."
 syrian_republic_events.2.a: "\"Stability and continuity will guide us through these troubled times!\""

 syrian_republic_events.3.t: "Всесирийский конгресс: второе поколение"
 syrian_republic_events.3.d: "Вместе с тем обе эти группы являются выходцами из более старшего поколения - поколения, единственной целью которого было сохранение старой социальной системы и стремление к автономии от Костантинийе. Благодаря усилиям ОХФ и широкомасштабным изменениям на европейском континенте новое поколение сирийцев прибыло на сцену, не придерживающееся того же мнения, что и их старейшины. Вдохновляемые социалистическими движениями в Европе социалистические и коммунистические партии Сирии используют нищету и кризис, вызванные экономической депрессией и Левантийской войной, для укрепления своих партий при поддержке левых стран Европы. С другой стороны, ССНП, которая является умеренным центром, поддерживающим как светские амбиции экстремистов, так и верующим в силу избирательной власти, создает светскую, милитаристскую организацию с революционными идеями для сирийского региона. Нин. Самая большая угроза для Национального Блока, однако, может возникнуть в форме Лиги национальных действий, созданной высокообразованными арабскими националистами второго поколения."
 syrian_republic_events.3.a: "\"Syria needs to look towards a new future!\""

 syrian_republic_events.4.t: "Саид аль-Джазири объявляет о выборах"
 syrian_republic_events.4.d: "В то время как солнце заходит на собравшуюся коллекцию интеллектуалов, торговцев и знаменитостей, спикер Дома Саида аль-Джазаири призвал к выборам для определения будущего своей страны."Saint among the Princes, the Prince among the Saints\". Whilst his grandson doesn't have anywhere near his credentials, his decisive action during both the Weltkrieg and the Levantine War to secure stability within Damascus has shaped his destiny as one of the city's most influential notables, further reinforced by a long tenure in the Ottoman Chamber of Deputies.\n\nAll parties, associations and groups gathered have promised to stand for open, free and fair elections and are set to return to their constituencies to run their campaigns. Even though these ideals sound nice on paper, the deeply engrained patron-client system in Syria is likely going to secure a victory for the old elite than bring a true representation of the Syrian peoples."
 syrian_republic_events.4.a: "Пусть это принесет нам стабильность!"

 syrian_republic_events.5.t: "Хаос на выборах"
 syrian_republic_events.5.d: "Несмотря на добрые намерения Всесирийского конгресса организовать справедливые выборы, это обещание, как представляется, было отвергнуто сразу же после того, как они пересекли порог. Сообщения о мошенничестве, взяточничестве и манипулировании со всех сторон страны прибыли в Дамаск, где иностранные наблюдатели с ужасом смотрят на разворачивающийся кризис. В одном случае два гражданина пытались оказать сопротивление и были вывезены из избирательной станции под дулом пистолета. Торговец Абу Салех Саадидин и Мохаммад Кейр аль-Халаби из Исламской ассоциации ученых заявили, что мошенничество и запугивание избирателей имели место во всей деревне Алеппо, где фермеры были вынуждены голосовать против него и его союзников. В одном случае двух граждан пытались оказать сопротивление и выслали с места проведения выборов."
 syrian_republic_events.5.a: "Отличное начало демократии..."

 syrian_republic_events.6.t: "Первые сирийские выборы"
 syrian_republic_events.6.d: "Несмотря на то, что с обеих сторон буйствует и не полностью демобилизуется ополчение, использующее тактику запугивания в сельской местности, выборы не в такой степени продемонстрировали желаний сирийского народа, но подтвердили закон самого сильного в раздираемой войной стране. Несмотря на обещания о равном представительстве всех религиозных и этнических групп, уже стало ясно, что реальная власть будет сохраняться в суннитском заведении с лишь символическими представителями христианского меньшинства. Ни одно из евреев не было избрано в качестве сионистов в Палестине бойкотировало выборы и объявило их оскорблением интересам еврейского народа во время пребывания в городах с большим еврейским населением, таким, как Алеппо и Дамаск, различные избирательные урны из их кварталов были либо пропущены , либо недействительны . Несмотря на большие надежды на социалистические партии, их успех на выборах почти полностью отсутствовал, поскольку только Акрам аль-Хурани был одним из ключевых игроков в своем избирательном округе Хама. Дальн в равной степени дошли до ограниченных побед в городских центрах Северной Сирии, но даже не получили место лидера партии. обе стороны спектра, тем не менее, обвиняли в своем поражениее на выборах и маршили на своих новых выборах и маршх на выборах через их марш."
 syrian_republic_events.6.a: "LNA, LRP и PP образуют коалицию."
 syrian_republic_events.6.b: "Национальный Блок выходит сверху."

 syrian_republic_events.7.t: "Шукри аль-Куатли захватывает Национальный Блок"
 syrian_republic_events.7.d: "Несмотря на то, что Хашим аль-Атасси считается одним из самых известных сирийских националистов, он решил, что с момента достижения независимости Сирии пришло время передать факел следующему поколению."
 syrian_republic_events.7.a: "Удачи Аль-Куатли!"

 syrian_republic_events.8.t: "Бечара эль-Хури присоединяется к силам аль-Куатли"
 syrian_republic_events.8.d: "Поскольку национальный блок в основном отражает интересы элиты Дамассена, аль-Куватли ищет союзников среди других групп Большой Сирии. Несмотря на то, что ливанская самобытность районов Бейрута оказалась проблемой в формировании приемлемого правительства, конституционный блок Бечары эль-Хури в конечном счете принял коалиционное предложение Национального Блока в обмен на радикальные уступки ливанской партии."
 syrian_republic_events.8.a: "Все сирийцы должны сотрудничать, если мы хотим добиться успеха!"

 syrian_republic_events.9.t: "Ахмад Шарабати Назначен министром образования"
 syrian_republic_events.9.d: "Сын известного Хаджи Утмана Шарабати, одного из самых богатых людей в Дамаске и сторонника сирийского националистического движения, молодой Ахмад Шарабати был назначен министром образования президентом аль-Куватли. За прошедшие десятилетия два человека тесно сотрудничали с Шарабати, выполняя функции связи аль-Куватлиса в Дамаске в годы его изгнания. Ученик МТИ и один из самых высокообразованных инженеров Сирии, однако у него очень мало опыта в управлении администрацией, и многие противники аль-Куватлиса осудили это решение как нечто большее, чем просто кумотизм."
 syrian_republic_events.9.a: "Мы присмотрим за ним."

 syrian_republic_events.10.t: "Реформы Шарабати"
 syrian_republic_events.10.d: "При покойной оттоманской системе студенты были вынуждены посещать обязательные турецкие классы, поскольку правительство решило, что только с помощью совместного языка она сможет модернизироваться. Хотя аргументация, возможно, была неправильной и была протестована сирийским населением, она также привела к значительному расширению школ и колледжей в Леванте, что в свою очередь в значительной степени способствовало повышению уровня грамотности в регионе. Несмотря на то, что Сирия стала независимой страной, потребность в турецких классах почти полностью исчезла, а Шарабати, таким образом, решил, что реформа системы образования должна быть проведена. Турецкий язык будет исключен из учебной программы, в то время как акцент на истории Оттомана должен быть заменен исследованием Сирии с уделением особого внимания Дамассену Калифату. Кроме того, наблюдается увеличение числа студентов, направленных для обучения за границу и передачи знаний о Западной Сирии, хотя глобальная нестабильность привела к тому, что это в основном касается Египта. Однако в кабинете министров ведутся споры о том, стоит ли вместо этого преподавать немецкий язык, английский язык или палку только арабскому языку."
 syrian_republic_events.10.a: "Английский!"
 syrian_republic_events.10.b: "Немецкий!"
 syrian_republic_events.10.c: "Почему кому-то нужно больше, чем арабу, это совершенно не моё..."

 syrian_republic_events.11.t: "Народная партия выигрывает выборы"
 syrian_republic_events.11.d: "Несмотря на то, что коалиция одержала победу на выборах, по-прежнему сохраняются разногласия в отношении канцелярии президента, поскольку Эмир Саид аль-Джазаири из крыла Дамасчине, по их мнению, пользуется поддержкой со стороны меньшинств друзов, алавитов и маронитов, в то время как Рушди аль-Кикия имеет хватку промышленного капитала Сирии, Алеппо. Аль-Кикия также пользуется его поддержкой среди Лиги национальных действий, которая бойкотирует аль-Джазайри, которые, по их мнению, слишком стары и слишком удалены от (молодого) сирийского населения, чтобы представлять свои интересы."
 syrian_republic_events.11.a: "Аль-Джазайри становится президентом!"
 syrian_republic_events.11.b: "Рушди аль-Кихия будет руководить страной!"

 syrian_republic_events.12.t: "Коалиция за компромисс"
 syrian_republic_events.12.d: "После сокрушительного поражения Национального Блока во время голосования, этот путь был полностью проложен для билета коалиции, которая выступила против них. Многие, однако, не ожидали этого, и альянсы, сделки с задворками и джентльменские соглашения, заключенные в ходе выборов, уже имеют серьезные трудности, поскольку становится очевидно, что первое соглашение является лишь несколькими поспешными компромиссами. nnnn В Ливане Общество реформ ожидает своей обещанной автономии, в то время как аналогичные вопросы задаются в Джабель-эль-Друзе, Курдистане и Алавитских горах. В Таурусских горах турки увеличивают свои протесты и забастовки, надеясь убедить правительство в необходимости проведения референдума, который позволит им воссоединиться с остальной частью Анатолии."
 syrian_republic_events.12.a: "Придется пройтись по канату..."

 syrian_republic_events.13.t: "Голод в Сирии"
 syrian_republic_events.13.d: "Несмотря на то, что Сирия находилась в мирное время в одном из наиболее важных сельскохозяйственных экспортных регионов Османской империи, разрушения, причиненные левантийской войной и перемещением десятков тысяч сирийцев, привели к катастрофическим последствиям для этого сектора. Полей остаются без присмотра или уничтожаются, сады изготовляются в качестве кустарника и топлива для локомотивов и ферм по всей Сирии, разрушенных бродячими бандитами. Нин Вильст египетское правительство согласилось послать помощь, оказалось затруднительным организовать их, поскольку ущерб железным дорогам, портам и дорогам затруднил доступ к сирийской территории. Различные сирийские промышленники и торговцы выделили часть своего состояния на проведение кампании по оказанию помощи, пока был установлен контакт с сирийской диаспорой по всему миру, надеясь, что они смогут перевести свои правительства к действиям."
 syrian_republic_events.13.a: "Это катастрофа!"

 syrian_republic_events.14.t: "Государство Сирийская армия"
 syrian_republic_events.14.d: "Поскольку Османская империя в значительной степени полагалась на иракских арабов на военные позиции, поскольку, как представляется, они в меньшей степени зависят от арабского национализма и из-за пренебрежения сирийского образования к армии, мы оказались в трудной ситуации. Оттоманская сирийская армия, которая была в основном распущена после того, как турки были вынуждены вернуться в Анатолию, представляет собой новую основу нашей армии, но она озарена офицерами, обладающими меньшими, чем звёздными взглядами демократического правительства. Несмотря на то, что руководство этой силой является бывшим оттоманским полковником Хусни аз-Заимом, который в основном из-за отсутствия лучших вариантов был назначен своим первым командованием. Человек курдского происхождения, воспринимается многими как коррумпированный, неадекватный и несущий огромную ответственность, но имеет огромное влияние среди войск, особенно тех, которые прибывают из районов проживания меньшинств. Это убедило большинство правительства, что избавление от этого человека, хотя они едва контролируют свои собственные провинции, может привести к перевороту молодой демократии и созданию военного режима, не в отличие от наших соседей в Ираке."
 syrian_republic_events.14.a: "Разойдитесь, Аль-Заим!"
 syrian_republic_events.14.b: "Это кажется слишком рискованным..."

 syrian_republic_events.15.t: "Этат в Дамаске"
 syrian_republic_events.15.d: "Вскоре после полуночи вооруженные подразделения вошли в Дамаск под командованием генерала Хусни аз-Заима с приказами арестовать президента и его высокопоставленных должностных лиц. Когда солдаты шли по пустым улицам Старого города, утренняя роса покрывала деревья и жасминские цветы, которые заполняли балконы Дамаска. До рассвета было холодно. Несколько человек уже не спали, направляясь на работу пешком или на велосипеде. Танки и пулеметы были установлены в стратегических точках по всей столице Сирии. Но в первый раз — но многие ожидают, что это будет далеко от последнего — что слово «связь» или «Инкилаб» было произнесено в Сирии. Ни одна из границ не была закрыта, и связь с внешним миром была приостановлена. Телефонные линии в Дамаск и из Дамаска были отрезаны. Одно военное подразделение, двигавшееся через спящий город к резиденции президента в Бустан-эль-Раисе, было легко разоружено один охранник, находившийся в резиденции [SYR. Geholder], после того, как он зачитывал короткий ордер на западной тюрьме."
 syrian_republic_events.15.a: "Что происходит?"

 syrian_republic_events.16.t: "[SYR. Get Header] Представляет свой выход на пенсию"
 syrian_republic_events.16.d: "Лишь недавно избранный президент Сирийской Республики [SYR.Get Header] сегодня же подал заявление об отставке из своей тюремной камеры: «Я представляю благородный народ Сирии с моей отставкой из Президиума Республики, желая ему вечное славословие и слава». Он высказал свое мнение, обращаясь к сирийскому народу, а не к Хусни аз-Заиму или к распущенной палате депутатов. Аз-Заим зафиксировала и напечатала его в пропагандистской брошюре, распространенной Департаментом средств массовой информации Сирийской армии, сопровождаемой свидетельскими показаниями, хвалящими генерала. Все в Сирии записали слово или два слова о его мудрости, обаянии и рифальности, включая друзей свергнутого президента ."‘Most Syrians, sipping coffee in the bazaars and smoking their hubble-bubble pipes, took hardly any notice of the change in government. In their 4,000-year history they had tasted the rule of Persians, Greek, Romans, Mongols and Turks. They were prepared to get used to Husni al-Za'im too\". Curfews have been installed and government personnel forced to attend to their normal positions but all in all the people of Syria are too tired to put up much resistance. The next few weeks and months will likely see an increase in opposition but for now al-Za'im rules supreme."
 syrian_republic_events.16.a: "Да здравствует Аль-Заим!"

 syrian_republic_events.17.t: "Враги государства"
 syrian_republic_events.17.d: "Поскольку захват сирийского государственного аппарата близится к завершению, пришло время для второго этапа в четырехэтапном плане аль-Заимс. Понимая, что для легитимизации своего правления ему необходимо провести широкомасштабные реформы, рассчитанные на все стороны, и прежде всего на возобновление развала сирийской экономики, аль-Заим считает это возможным только путем получения огромной экономической и военной поддержки из-за рубежа для своего режима. ~nnWhillst, описываемой многими из его врагов и коллег, «Аль-Заим» избегает гнева сторонников любого из двух европейских силовых блоков, как социалистического Акрама аль-Хурани, так и сирийской армии, состоящей из многих прогерманских бывших офицеров, поддерживающих его правительство. Для того чтобы Сирия получила свою столь необходимую поддержку, ей, однако, потребуется занять решительную позицию в противостоянии между двумя блоками и избавиться от агентов в стране, которые могут заручиться поддержкой противного блока."
 syrian_republic_events.17.a: "В сторону Аль-Хурани, очистите немецких сторонников!"
 syrian_republic_events.17.b: "Вместе с армией, арестуйте социалистов!"

 syrian_republic_events.18.t: "Проведение аграрных реформ"
 syrian_republic_events.18.d: "Несмотря на то, что покойное оттоманское правительство пыталось разрушить власть традиционных феодальных землевладельцев, они контролировали большую часть земли в Сирии со времен Калифата Умайяд. Несмотря на то, что простому фермеру осталось мало земли, социалистический Акрам аль-Хурани смог распространить свою популистскую риторику по всей стране, наиболее успешно в его родном городе Хама, где широко распространенная коррупция и нищета обеспечили ему победу на последних выборах."
 syrian_republic_events.18.a: "Сколько еще зайдет аль-Заим?"

 syrian_republic_events.19.t: "Аль-Заим вводит социальные реформы"
 syrian_republic_events.19.d: "Вдохновленные программами покойного Оттомана ОХФ и его лидера Мустафы Кемаля Гелиболу, он положил глаз на модернизацию сирийского государства и разрыв с его традиционным, религиозным, происхождением. Нацеливаясь на школы, университеты и суды , кабинет аз-Заим арестовал или заменил фигур, которые были опознаны как враги режима, переписал учебные программы с целью обесценить арабских националистов, которые основали Национальный Блок . Религиозные школы , закрытые покойным Оттоманским режимом , которые были вновь открыты после их отъезда из Сирии, были вновь закрыты по мере того, как новый генералиссимо видит в Улеме лишь древнее, декрементное учреждение, способно ослабить сирийский народ изнутри. Несмотря на все запрещенные религиозные школы религиозные школы религиозные школы , закрытые , закрытые , закрытые школы , закрытые школы , закрытые , закрытые , закрытые , закрытые , закрытые , закрытые , закрытые , религиозные школы , закрытые"
 syrian_republic_events.19.a: "Он наживает много сильных врагов..."

 syrian_republic_events.20.t: "Выборы в Сирии"
 syrian_republic_events.20.d: "Как обещал Хусни аз-Заим, когда он пришел к власти, «свободные» выборы были проведены по всей Сирии на прошлой неделе, чтобы определить будущее нации. Что выборы должны были быть обманом, но не многие ожидали, что они будут столь очевидными, поскольку сегодня президент, получивший 117% голосов после непротивоположных выборов, успешно нашел на 150 000 голосов больше, чем у имеющих право голоса избирателей. Государственные газеты быстро поздравили президента с его удивительной победой, в то время как в Дамаске праздники были выброшены для того, чтобы отпраздновать консолидацию власти военным учреждением."
 syrian_republic_events.20.a: "Мы стоим позади нашего президента!"

 syrian_republic_events.21.t: "Этат в Дамаске"
 syrian_republic_events.21.d: "Так же, как и несколько месяцев назад, сирийские танки и грузовики прокатились по улицам Старого города в первые часы сегодняшнего дня, когда бывший друг и коллега Эз-Заим, Сами аль-Хинави, совершил свой собственный переворот. ~Нет, сирийский диктатор был похищен из своего дома в Эль-Рауде у улицы Абу Руммане, испытывая в основном ту же участь, которую он причинил последнему демократическому президенту. Когда в 2 часа ночи солдаты пришли к нему домой, ас-Заим столкнулся с ними из своего балконного окна, только что вернувшись с благотворительного мяча в гостинице Блудан, устроенном сирийским Красным Полумесяцем. Они открыли огонь, промахнулись, ворвались в него и вытащили его в свою подделку, крича, как безумца. Фадлалалах Абу Мансур, один из офицеров, возглавлявших переворот, ударил сирийского президента по лицу. Не бейте меня , он быстро добавил: Я набрал 80 000 сирийских фунтов на меня, взял 50 000 сирийских и отдал вам."I tell you I am innocent.\" He then asked \"Who is behind the coup?\". Abu Mansour loaded his pistol and pressed it hard against his head, ‘If you don't shut up, I will blow your brains out!'\n\nUpon reaching an abandoned plot of land in Mezzeh, near the old cemetery, al-Za'im suffered just this fate. He was executed by firing squad, along with his prime minister and advisor, Muhsen al-Barazi, in the early hours of the day, with a total of 117 bullets fired into his body."
 syrian_republic_events.21.a: "Верховный Вождь мертв! Да здравствует Верховный Вождь!"

 syrian_republic_events.22.t: "Хлебные буйства в Алеппо"
 syrian_republic_events.22.d: "В ответ на недостаточные меры, принимаемые правительством для борьбы с ростом цен на зерно, город Алеппо вышел на улицы, протестуя против своего правительства. Все пекарни и хлебные мельницы были закрыты, а студенты и торговцы прошли по улицам. Хотя основная тема этого протеста связана со слабой экономической политикой правительства, на самом деле это протест промышленной столицы Сирии против ограниченного влияния, которое они оказывают на процесс принятия решений, почти исключительно осуществляемого элитой Дамасцена."
 syrian_republic_events.22.a: "Пусть едят торт!"

 syrian_republic_events.23.t: "Смерть Саадалы аль-Ябири"
 syrian_republic_events.23.d: "Саадалла аль-Джабири был найден мёртвым сегодня утром в своем доме в Алеппо. Нэшнл Блок в тяжелом весе и решительном защитнике демократии, которую многие видели в качестве неофициального лидера Алеппо, были близким другом аль-Куватли и функционировали в качестве своего партнера и союзника в спорных странах Северной Сирии. Сейчас все еще не ясно, что является причиной смерти, но все еще относительно молодой политик боролся за это после того, как минометная снаряда попала в его дом во время осады Алеппо в Левантийской войне. маловероятно, что слухи об убийстве когда-либо будут сброшены, как в мусульманской традиции, тело должно быть похоронено как можно скорее. Несмотря на его кончину, многие алеппины теперь смотрят на Народную партию, которая сформировала его основную оппозицию в городе. Руш аль-Кикий и нацм аль-Кудси оплан жали жали , как быстр опла"
 syrian_republic_events.23.a: "Огромный хит для Национального Блока."

 syrian_republic_events.24.t: "Марада , Активизировать нападения на север Ливана"
 syrian_republic_events.24.d: "Под руководством Пьера Амина Джумайяля и Уильяма Хави повстанцы Марада активизировали свои нападения на военные аванпосты в Западной Сирии. Марада получает свое название от независимых общин в Ливане и близлежащих гор после завоевания Сирии арабской армией в 630 году н. э., помня о том, что они сильны боевыми действиями. Мэр Бейрута и Скион известной семьи Даук Ахмад Даук осудили свои действия и настоятельно просили Джумайила и Хави встать на ноги."
 syrian_republic_events.24.a: "Они не будут сопротивляться нам вечно!"

 syrian_republic_events.25.t: "Беспорядки на ливанских званиях"
 syrian_republic_events.25.d: "Ввиду особого статуса Ливана в Османской империи и их достаточно независимой роли во время Левантийской войны бывшему ливанскому сопротивлению было разрешено создать свои собственные разногласия и военную структуру в рамках сирийской структуры."Lebanese Volunteer Army\", these men fight under the leadership of their general Fouad Chehab.\n\nWith conflict still raging all across Syria, the government in Damascus is calling on all parts of the Syrian Army to assist in restoring order. The LVA however is refusing to fight outside of Lebanese territory, claiming those are Syrian problems and not Lebanese ones. This has caused quite the outrage in Damascus which denies that Lebanon is a separate entity from Syria and has sent new orders to Chehab, deploying him and his troops to Palestine to assist in quelling Zionist cells."
 syrian_republic_events.25.a: "Как они смеют отказываться от прямого приказа?"

 syrian_republic_events.26.t: "Фуад Чехаб заявляет о независимости Ливана"
 syrian_republic_events.26.d: "Недовольство инвазивным влиянием и вмешательством Дамассенской элиты в дела бывшего Мутасарифа, последней каплей, которая омрачила ведро, прибыло ранее на этой неделе, когда некомпетентность сирийской армии по подавлению различных повстанческих группировок, все еще действующих на ее территории, побудила [SYR.Geteleder] направить в Палестину ливанскую дивизию. Ссылаясь на это как на вопиющее игнорирование Бейрутского договора, который предусматривал автономию маронитской общины и обещал, что ливанские силы будут использоваться исключительно на ливанской территории, их генерал Фуад Чехаб заявил, что «сирийско-ливанский союз» должен работать в свое время."
 syrian_republic_events.26.a: "Сирия когда-нибудь узнает о мире?!"
 syrian_republic_events.26.b: "Куллуна ли-л-ватан ли-л-ула ли-л-алам!"

 syrian_republic_events.27.t: "Ливанские представители протестуют против влияния Дамассена"
 syrian_republic_events.27.d: "Недавняя перестановка кабинета министров и вопиющая предвзятость, проявленная правительством к индустриалистам Дамассена, вызвали большое недовольство среди представителей Ливана. После того как были выделены средства на ремонт гавани в Бейруте и расширение медицинских учреждений в городе, представители города сегодня встали на середину парламентской сессии и покинули здание в знак протеста против кумовства, широко распространенного в администрации [SYR. Get Header]."
 syrian_republic_events.27.a: "Они должны быть счастливы, что мы вообще им помогаем!"

 syrian_republic_events.28.t: "Плебисцит в Килисии"
 syrian_republic_events.28.d: "Для того чтобы удовлетворить пожелания преимущественно турецкого населения Силисии и положить конец деятельности Мюдафа-и Хукук-Хемиетлери, правительство Дамаска наконец-то приняло участие в референдуме в северных провинциях Сирии. Хотя это создает опасный прецедент для других групп, желающих покинуть сирийское государство, правительство должно было признать, что оно совершенно не способно победить нерегулярные турецкие силы и записало референдум в надежде спасти лицо. nn-Daggers уже были нарисованы и брошены в столицу по мере того, как население наносит удары и протестует против того, что они считают смертью Сирии. Полиция и военные подразделения были направлены в город, с тем чтобы предотвратить эскалацию насилия, но в Дамаске и городах дальше на севере, турецкие граждане подвергаются нападениям и кричанию на улицах."
 syrian_republic_events.28.a: "У нас не было выбора..."

 syrian_republic_events.29.t: "Сами аль-Хинави Восстановление демократии"
 syrian_republic_events.29.d: "Несмотря на то, что он является частью военного учреждения и близким другом покойного сирийского диктатора, аль-Хинави объявил сегодня о том, что он полностью планирует вернуть Сирию ее народу, и призвал хорошо известного сирийского националиста Хашима аль-Атасси сформировать правительство, которое вернет Сирию на правильный путь."
 syrian_republic_events.29.d.Alt: "Несмотря на то, что он является частью военного учреждения и близким другом покойного сирийского диктатора, аль-Хинави объявил сегодня о том, что он полностью планирует вернуть Сирию ее народу, и призвал к созданию нового правительства, возглавляемого Народной партией, с надеждой на то, что они смогут восстановить нормальную обстановку в сирийской политике."
 syrian_republic_events.29.a: "Аль-Хатасси займётся мантией!"
 syrian_republic_events.29.b: "Народной партии дали второй шанс."

 syrian_republic_events.30.t: "Документ Зука Майкла"
 syrian_republic_events.30.d: "В ответ на ультиматум Сирийской армии, в котором содержится требование о мобилизации ливанских войск для подавления мятежей между алавитскими и еврейскими территориями, группа ливанских солдат и офицеров, собравшихся сегодня в городе Зук-Майк, чтобы подтвердить свое имя в документе, в котором подтверждается их клятва служить только интересам Ливана под ливанским знаменем и командованием ливанского правительства. манифест возмущает военное руководство в Дамаске, но пользуется широкой популярностью как среди членов ливанской добровольческой армии, так и среди ливанского гражданского населения. Несмотря на призывы к тому, чтобы потенциально убрать Фуада Чехаба , и назначить более просирийского офицера Шаукат Шукайра для руководства ливанской добровольческой армией в Палестину, но даже Шукайр, как представляется, проявляет сомнения, поскольку его телеграммы, возвращающиеся в Дамаск, занимают больше времени и дольше с каждым ответом. предположительно, сам Чехаб , однако, как утверждается, он сразу находится под при непосредственно под наблюдением наших правительственных агентов."
 syrian_republic_events.30.a: "Давайте помолимся, чтобы они пришли к разуму."

 syrian_republic_events.31.t: "Встреча ливанских общественных деятелей в Бейтеддинском дворце"
 syrian_republic_events.31.d: "Генерал Фуад Чехаб был замечен в автомобиле, ранее в этот день, вместе с известным ливанским политиком Бечарой эль-Хури и друзой Шейхом Маджидом Арсланом. Хотя наши агенты отследили автомобиль до Бейтеддинского дворца, старого замка, построенного в веках ливанского эмирата, они были задержаны отрядом ливанской армии добровольцев, который, как представляется, гарнизировал дворец, без каких-либо четких объяснений. Произошел несколько напряженный разговор, который перерос в сложный спор о полномочиях и бюрократической красной ленте, поскольку солдаты отказали им во въезде. Несмотря на то, что наши агенты были вынуждены покинуть его, наши агенты отметили присутствие на этом подозрительном собрании других политических деятелей."
 syrian_republic_events.31.a: "Пригласи Партию обсудить кризис!"

 syrian_republic_events.32.t: "Конференция в Джаффе"
 syrian_republic_events.32.d: "В соответствии с обещанием автономии для различных групп сирийских меньшинств наш вновь избранный президент призвал провести второй Всесирийский конгресс в Джаффе для изучения возможностей передачи полномочий. Энтузиазм за свои планы остается низким среди суннитских арабов, однако они опасаются, что это значительно ослабит власть сирийского правительства и подорвет его потенциал стать лидером арабского движения."
 syrian_republic_events.32.a: "Джаффа сломается или сделает новую Сирию..."

 syrian_republic_events.35.t: "Этат в Дамаске"
 syrian_republic_events.35.d: "Так же, как и несколько месяцев назад, сирийские танки и грузовики прокатились по улицам Старого города в первые часы сегодняшнего дня, когда бывший друг и коллега Аль-Заима Адиб Ибн Хассана совершил свой собственный переворот. Несмотря на то, что сирийский диктатор был похищен из своего дома в Эль-Рауде у улицы Абу Руммане, испытывая в основном ту же участь, которую он причинил последнему демократическому президенту. Когда в 2 часа ночи солдаты пришли к нему домой, аз-Заим столкнулся с ними из своего балконного окна, только что вернувшись с благотворительного мяча в гостинице Блудан, устроенном сирийским Красным Полумесяцем. Они открыли огонь, промахнулись, ворвались в него и вытащили его в свою подделку, крича, как безумца. Фадлалалах Абу Мансур, один из офицеров, возглавлявших переворот, ударил сирийского президента по лицу."I tell you I am innocent.\" He then asked \"Who is behind the coup?\". Abu Mansour loaded his pistol and pressed it hard against his head, ‘If you don't shut up, I will blow your brains out!'\n\nUpon reaching an abandoned plot of land in Mezzeh, near the old cemetery, al-Za'im suffered just this fate. He was executed by firing squad, along with his prime minister and advisor, Muhsen al-Barazi, in the early hours of the day, with a total of 117 bullets fired into his body."
 syrian_republic_events.35.a: "Верховный Вождь мертв! Да здравствует Верховный Вождь!"

 #######################
 # GREAT SYRIAN REVOLT #
 #######################
 syrian_revolution_events.1.t: "Великий друзский револьт"
 syrian_revolution_events.1.d: "По мере продолжения войны с [EGY.GetNameDef] народ Леванта становится все более беспокойным и неуверенным, и именно против этого отступничества произошел последний провал турецкого правления, когда друза Сирии в условиях открытого восстания. Выгнав местный турецкий гарнизон и вооружившись, они вдохновляют всех арабов, находящихся под турецким правлением."
 syrian_revolution_events.1.a: "Они, должно быть, раздавлены!"

 syrian_revolution_events.2.t: "Дамаск присоединяется к восстанию"
 syrian_revolution_events.2.d: "После войны в Масхрике дамасцы вновь продемонстрировали свою истинную преданность, как и ранее сегодня, армии друзов, которые вошли в столицу сурийского вилайета и успешно свергли вместе с помощью местного населения турецкий гарнизон. Все вокруг города турецкие магазины разрушены, а турецкие граждане атакуются в то время, как новое революционное страдание распространяется через арабских жителей."
 syrian_revolution_events.2.a: "Клянусь Аллахом!"

 syrian_revolution_events.3.t: "Аль-Карак присоединяется к револьту"
 syrian_revolution_events.3.d: "Кровавые репрессии и принудительное разоружение бедуинов в районе Аль-Карак, сорванные молодыми турками в 1910 году, чтобы установить контроль над регионом над Османом, ответили на призыв друзов и других сирийских движений, присоединившихся к сирийскому восстанию. Оттоманские власти , будучи жизненно важной станцией на железной дороге Хежаз , глубоко шокировали османские власти, которые теперь опасаются, что их неспособность быстро реагировать на движение в Хеджазе приведет к открытому мятежу в самих священных городах."
 syrian_revolution_events.3.a: "Весь арабский револьт кажется неизбежным сейчас..."

 syrian_revolution_events.5.t: "Халеп присоединяется к восстанию"
 syrian_revolution_events.5.d: "Вилайет, связь которого с турецкой Анатолией является самой прочной из всех сирийских регионов, по-видимому, в настоящее время также отказывается от султана в пользу самоопределения. Хаос , действующие на улицах города в качестве агитаторов, распространяется как Север, как и Искендерун, хотя те же признаки полной приверженности восстанию, что и в Южном Вилайе, пока отсутствуют, вероятно, из-за соперничества между различными гражданами и большим немусульманским населением города."
 syrian_revolution_events.5.a: "Это конец, сейчас же!"

 syrian_revolution_events.6.t: "Хомс присоединяется к револьту"
 syrian_revolution_events.6.d: "После своих суннитских соотечественников алауиты теперь также присоединились к восстанию в гневе по отношению к оттоманским действиям на всей территории Большой Сирии."
 syrian_revolution_events.6.a: "Мы вернемся!"

 syrian_revolution_events.7.t: "Хайфа присоединяется к восстанию"
 syrian_revolution_events.7.d: "Даже в Палестине сопротивление достигло переломной точки, поскольку сегодня в дом Вали ворвалась разъяренная толпа, сорвавшая флаг Оттомана и линчевавшая самого губернатора. Оттоманский флот , находившийся в порту, смог успешно сбежать, но большая партия боеприпасов и оружия не смогла быть извлечена вовремя."
 syrian_revolution_events.7.a: "Покончим с предателями!"

 syrian_revolution_events.8.t: "Сирийское восстание разрушено"
 syrian_revolution_events.8.d: "Поскольку пыль оседает в Дамаске, а последние остающиеся камеры закрываются с помощью бронированных машин и бронетехники Оттомана, похоже, что в скором времени в Сирии будет восстановлен порядок."
 syrian_revolution_events.8.a: "Хазза!"

 ###########################
 # Yishuv Flavour (by Ido) #
 ###########################

 yishuv_flavour_events.1.t: "Еврейский национальный совет возобновляет деятельность в мирное время"
 yishuv_flavour_events.1.d: "Еврейский национальный совет, действующий с момента создания МПЯ, управлял делами в Ишуве, множество еврейских поселений, которые были созданы в рамках сионистского движения, возобновили свою деятельность в мирное время после окончания войны в Палестине."
 yishuv_flavour_events.1.a: "Только не устраивай беспорядок."

 yishuv_flavour_events.2.t: "Еврейский национальный совет тихо одобряет Народную партию"
 yishuv_flavour_events.2.d: "Официально бойкотируя сирийские выборы, Еврейский национальный совет намекнул на свою тихую поддержку Народной партии, вероятно, надеясь, что либеральное правительство в Дамаске даст им больше шансов на автономию, что предпочтительнее, чем Национальный Блок. Еще до создания Сирийской Республики у Ишува были сердечные отношения с Рагибом аль-Нашасиби, которые воплотились в позитивное мнение об аль-Джазаири и его идеалах многокультурной федеративной Сирии."
 yishuv_flavour_events.2.a: "Ожидал, но удивился."

 yishuv_flavour_events.3.t: "Коллапсы прекращения огня между Хаганой и Этселем"
 yishuv_flavour_events.3.d: "Во время войны между Каирским пактом и Османской империей Хагана, объединившись с союзниками Бен-Гуриона и всеми Ишувским учреждением и Этселем, более милиционистское ополчение, присоединившееся к правому ревизионистскому движению, возглавляемому Зеевом Джаботинским, согласилось на временное перемирие в целях защиты еврейских интересов в Палестине, но теперь, когда ИНК, казалось бы, присоединяется к Сирии, Этсель прекратил прекращение огня, заявив, что ИНК, Бен-Гурион и Хагана предали сионистское движение, полностью присоединившись к Дамаску. ИНК быстро согласился запретить Ревизионистскую партию из всех ее органов, включая Ассамблею представителей. Многие боятся того, что Этсель планирует вооруженное восстание в Палестине, дестабилизируя регион."
 yishuv_flavour_events.3.a: "Палестина снова дестабилизирует..."

 yishuv_flavour_events.4.t: "Выборы в Ассамблею представителей Ишува"
 yishuv_flavour_events.4.d: "В еврейских городах Палестины были проведены выборы представителей Ишувской ассамблеи представителей. С отставкой Бен-Гуриона в качестве председателя ИНК его партия Социал-демократический мафай выдвинула в качестве своего преемника бесспорного Залмана Шазара, а с доминирующим положением Мапаи в иишувских организациях легко выиграла плюрализм голосов. Многие полагают, что Залман Шазар тайно находится под влиянием Бен-Гуриона, который ушел в отставку в Киббуц в Негеве. Результаты выборов в Мапаи -- это левый группирующий блок Хапоэль Хацэир и Поаль Сион . Ревизионистская партия , возглавляемая Зеевом Джаботинским, не может баллотироваться на выборах в силу своего нового статуса."
 yishuv_flavour_events.4.a: "Кто?"

 yishuv_flavour_events.5.t: "Заявление Джаботинского о национальном освобождении"
 yishuv_flavour_events.5.d: "Сославшись на предательство создания Ишува сионистскому идеалу суверенного еврейского государства, Джаботински заявил в своем радио-адресе, что Иргун теперь перейдет в \"liberate the land of Israel from its subjugators\" and urged all \"proud\" Jews in Palestine to resist the Syrian government in any way possible. The fears of the Syrian government, and the JNC have come true with Etsel rising in rebellion. Etsel's chances of success are slim, but many fear that this is just the beginning of worse things to come. The JNC has declared Jabotinsky and several leaders of the Revisionist movement and Etsel as persona-non-gratas, with the Syrian government issuing the same declaration."
 yishuv_flavour_events.5.a: "Это значит неприятности..."

 yishuv_flavour_events.6.t: "Покушение на бомбардировку канцелярии губернатора"
 yishuv_flavour_events.6.d: "Сегодня власти с трудом сорвали заговор Этселя по бомбардировке канцелярии губернатора в Иерусалиме, и в комнате под офисом губернатора Иерусалима была найдена самодельная бомба. Хагана согласилась сотрудничать с сирийскими властями в розыске тех, кто совершил попытку взрыва."
 yishuv_flavour_events.6.a: "По крайней мере, кто-то сотрудничает с нами..."

 yishuv_flavour_events.7.t: "Сейсон"
 yishuv_flavour_events.7.d: "Хагана совершила серию рейдов по постам Этсел по всей Палестине, захватив тайники с оружием и захватив около 200 человек в качестве заключенных, некоторые посты решительно сопротивлялись этим рейдамам, в результате которых в течение нескольких часов происходили перестрелки, среди убитых был известный член Этсель Аврахам Стерн, который был быстро убит Этселем после боя."
 yishuv_flavour_events.7.a: "Ишув сам себя заводит?"

 yishuv_flavour_events.8.t: "Джаботински отправляется в изгнание."
 yishuv_flavour_events.8.d: "Джаботински, ссылаясь на отчаяние, вызванное «Войной братьев», попал в изгнание, был оставлен для самовынужденной ссылки в Греции, поклявшись продолжать «истинное сионистское дело», с ним поехал Аврахам Техоми, командир Этселя, который, как утверждается, все еще организует новые подземные клетки Этселя, чтобы выиграть свое время, прежде чем вновь нанести удар по Сирии."
 yishuv_flavour_events.8.a: "Пусть останется в изгнании!"

 yishuv_flavour_events.9.t: "Какал высаживает деревья в Палестине"
 yishuv_flavour_events.9.d: "Еврейский национальный фонд Керен Кайемет Л , известный своим акронимом Какал и его английским названием, начал кампанию посадки деревьев вокруг Палестины. Несмотря на то, что многие критикуют его попытки купить землю вокруг Палестины, обвиняя ее в краже земли, многие также приветствуют их насаждения деревьев из-за того, что Палестина исторически страдала от сильного обезлесения в последние столетия. Правительство указало, что оно будет следить за усилиями ПНФ по приобретению земли для ослабления возможной напряженности и поддержания региональной стабильности в Палестине."
 yishuv_flavour_events.9.a: "Похоже, это достаточно безобидно."

