 ### Decisions ###
 SYR_rebellion_decisions: "Великий сирийский револьт"
 SYR_rebellion_decisions_desc: "Барабаны войны огромны по всей Великой Сирии, когда начинается последняя борьба за освобождение, начатая друзами Джабель-эль-Друзе, восстание быстро унесло всю оппозицию в Дамаске, но многое еще предстоит сделать, поскольку оттоманцы сильны в остальных санджаках."

 SYR_Maan_Joins_Revolt: "Коллеги поддержки в §YMa'an§!"
 SYR_Sam_Joins_Revolt: "Коллеги поддержки в §YDamascus§!"
 SYR_Beirut_Joins_Revolt: "Рейлеры поддержки в §Beirut§!"
 SYR_Halep_Joins_Revolt: "Коллеги поддержки в §YAleppo§!"
 SYR_Zor_Joins_Revolt: "Помогите нам в CNYALAWIALYALYAS!"
 SYR_Homs_Joins_Revolt: "Коллеги поддержки в Лос-Анджелесе!"
