 SYR_shukri_al_quwatli_leader_desc: "§YBorn:§! § 6 мая 1891 года в Дамаске, Вилайет Сирии, Оттоманская империя §!! §YBackground: §! §LAmong несколько ветвей Аль-Фатата в арабском мире, никто не будет таким успешным, как Сирия. Это объясняется осторожным маневрированием их лидера Шукри аль-Куатли. Несмотря на его изгнание из Сирии дважды, он вновь вернулся и собрал своих союзников в рамках подготовки к новому типу республиканского правительства. Позиция Шукри в Сирии является посредником между либеральными бургерами и консервативными землевладельцами, обладающими судебной властью в Сирии.§!"

