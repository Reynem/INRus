 ### Focuses ###
 syria_focus: "Сирийское дерево фокуса"

 # Maintain the Status Quo #
 SYR_status_quo: "Сохранять статус Quo"
 SYR_status_quo_desc: "Насколько мы помним, регион Сирии управляется ее городами и их могущественными семьями. Эти семьи, занимающие ключевые позиции как в бюрократической, так и в религиозной иерархии, служат покровителями для тех, кто менее настроен и формирует ядро сирийской гобелены. Европейская массовая политика, направленная на обеспечение прямого представительства народа, наносит вред сирийцам и, скорее всего, сделает всех нас жертвами бешеных марксистов, религиозных экстремистов или джингоистских брутов."
 SYR_egypt_cooperation: "Сотрудничество между Сирией и Египтом"
 SYR_egypt_cooperation_desc: "Если бы не помощь Египта, у нас не было бы свободы для Сирии, чтобы называть наш дом своим домом."
 SYR_ban_parties: "Запрет на деятельность политических партий"
 SYR_ban_parties_desc: "Политические партии -- это лишь бремя, лежащее на сирийском народе, и если мы хотим стать сильным и успешным арабским государством, то настало время распустить эти тревожные группировки."
 SYR_military_directorate: "Нашел Военное Разведывательное управление"
 SYR_military_directorate_desc: "Расширение разведывательных операций наших военных позволит нам лучше проникнуть в мятежные группировки в нашей стране и уничтожить их."
 SYR_suez_damscus_rail: "Суэц - Дамаск Железнодорожная дорога"
 SYR_suez_damscus_rail_desc: "Наши расширяющиеся связи с Египтом нигде не ощущались так же сильно, как в экономике, где Сирия когда-то была полностью ориентирована на Север и Средиземное море, торговые связи и влияние Египта в государственных монополиях претерпели большие изменения. В целях дальнейшего укрепления своего положения египтяне в настоящее время стремятся к расширению железнодорожных и автомобильных связей между нашим экономическим сердцем и Суэцким каналом."
 SYR_integrate_military: "Интегрировать военное командование"
 SYR_integrate_military_desc: "Искусство и умения египетского военного командования во время войны за независимость не остались незамеченными, и благодаря их действиям мы смогли добиться свободы от турок."
 SYR_end_land_reform: "Упразднение османской земельной реформы"
 SYR_end_land_reform_desc: "Когда в конце XIX века в Сирии были проведены земельные реформы в Оттомании, их главная цель состояла в том, чтобы ослабить влияние квазифеодального класса землевладельцев и отвести власть от влиятельных арабских семей в централизующее государство."
 SYR_undercut_aleppan: "Подрезанное влияние Алеппана"
 SYR_undercut_aleppan_desc: "Хотя Дамаск, несомненно, является главным городским центром Сирии, он сталкивается со значительной конкуренцией со стороны Алеппо и Северной Сирии в целом."
 SYR_destroy_mudafa: "Уничтожить Мюдафа-и Хукук Чемиетлери"
 SYR_destroy_mudafa_desc: "Террористы Мюдафа-и Хукук Чемиетлери представляют собой серьезную угрозу для нашего государства, и необходимо принять оперативные и эффективные меры по их ликвидации раз и навсегда."
 SYR_sunni_dominance: "Поддерживайте суннитское доминирование"
 SYR_sunni_dominance_desc: "Хотя многие группы составляют Сирию, отрицание того, что суннитское население является крупнейшим блоком, было бы глупо, хотя некоторые могут обвинять в дискриминации в отношении меньшинств нашего государства, на самом деле мы просто признаем реальность того, что Сирия является суннитской нацией."
 SYR_abolish_mt_lebanon: "Упразднение Ливанского автономного района"
 SYR_abolish_mt_lebanon_desc: "Хотя различные военизированные группы Ливана играли важную роль во время войны, они медленно демонстрируют, что больше заботятся о защите своего собственного заднего двора, чем о Сирии в целом."
 SYR_jewish_land: "Прекращение приобретения еврейских земель"
 SYR_jewish_land_desc: "Приток еврейских людей в наши города, возможно, привел к процветанию, но это еще больше усугубило и без того недовольные меньшинства в Сирии."
 SYR_sewcure_alawyin_mountains: "Охраняйте Алавийинские горы"
 SYR_sewcure_alawyin_mountains_desc: "Площадь алавийских гор позволяет ей стать питательной почвой волнений в алавитах. До тех пор, пока эти районы могут быть гнезда крыс, мы никогда не сможем положить конец тем, кто восстает против нашего правления."
 SYR_expand_harbours: "Расширить гавань Хайфа и Триполи"
 SYR_expand_harbours_desc: "Хотя за последние несколько лет в портах Хайфы и Триполи наблюдается рост, они по-прежнему обладают большим потенциалом для дальнейшего роста, поскольку, расширяя портовые сооружения, они могут стать крупными патрулями в восточной части Средиземноморья."
 SYR_contest_al_jazziris: "Соревнование по аль-Джазаирису"
 SYR_contest_al_jazziris_desc: "Репутация аль-Джазаири становится все менее раздражающей и все более неприятной, лишая нас поддержки в районе Дамаска."
 SYR_centralise_authority: "Централизованное управление Дамассена"
 SYR_centralise_authority_desc: "Децентралистские идеи, провозглашенные некоторыми, приведут лишь к неэффективности, и именно благодаря концентрации политической, экономической и социальной власти мы сможем достичь величия, и в то время как наша политика начинает приносить результаты, мы должны создать унитарную конституцию, с тем чтобы раз и навсегда закрепить эту структуру."
 SYR_hawran_secured: "Охраняйте Хорана"
 SYR_hawran_secured_desc: "Хоран с его сельскохозяйственной продукцией будет иметь жизненно важное значение для обеспечения безопасности нашего нового государства."
 SYR_hama_damascus_axis: "Разработать ось Хама-Дамаск"
 SYR_hama_damascus_axis_desc: "Благодаря нашей политике регион между городами Хама и Дамаск быстро становится центром сирийского государства, ядром, которое является нам верным."
 SYR_cooperate_with_nasha: "Сотрудничество с организацией Аль-Нашасибис"
 SYR_cooperate_with_nasha_desc: "Глупо пытаться соревноваться с «аль-Нашасибисом» в Иерусалиме, и мы действительно не заинтересованы в том, чтобы попробовать такую задачу, а вместо этого придём к пониманию с «Аль-Нашасиби» и выиграем их на нашей стороне, обещая им в обмен на поддержку."
 SYR_palestnian_railroad: "Восточно-палестинская железнодорожная инициатива"
 SYR_palestnian_railroad_desc: "В целях дальнейшего развития транспорта к востоку от Иерусалима мы будем работать над созданием железнодорожной дороги в Восточной Палестине, которая будет направлена на подключение Аммана и других городов к остальной части Сирии, обеспечивая двойную выгоду от поощрения экономического роста и дальнейшей централизации нации в Дамаске."

 # A republic of Equals #
 SYR_republic_of_equals: "А Республика равноправия"
 SYR_republic_of_equals_desc: "Сирия является многообразным местом, и, хотя арабы контролируют большинство этнических групп, они не единственные, курды, турки, алавиты и, более того, все попадают под сирийский флаг."
 SYR_1940_census: "[Годовая] сирийская перепись"
 SYR_1940_census_desc: "После консолидации наших земель абсолютно необходимо провести широкую перепись всех сирийских земель, с тем чтобы лучше понять регионы наших этнических меньшинств."
 SYR_palestinian_round_table: "Палестинская конференция за круглым столом"
 SYR_palestinian_round_table_desc: "Будучи регионом, в котором в последние годы нарастает конфликт, Палестина, несомненно, является тем районом, в котором мы должны действовать осторожно, и в рамках этого мы создадим широкую ассамблею представителей региона, с тем чтобы выработать соглашение, гарантирующее будущий мир в регионе."
 SYR_jewish_investment: "Поощрение еврейских инвестиций"
 SYR_jewish_investment_desc: "Еврейская община в Леванте только выросла в последнее время, и хотя некоторым может быть удобно дискриминировать их, мы считаем, что эта политика не продумана."
 SYR_restore_mt_lebanon: "Восстановить Ливанский автономный район"
 SYR_restore_mt_lebanon_desc: "Регион вокруг Ливана является слишком разнообразным, чтобы его можно было просто включить в нашу нацию, и мы должны восстановить автономный регион, с тем чтобы позволить региональным меньшинствам сосуществовать."
 SYR_alawite_region: "Создать Алавитный автономный район"
 SYR_alawite_region_desc: "Горные районы, населяемые нашими алавитскими гражданами, никогда не будут укрощены мечом, но, возможно, посредством предоставления автономии мы сможем показать им, что мы понимаем их желание защитить себя и свои традиции."
 SYR_kurdish_region: "Создать курдский автономный район"
 SYR_kurdish_region_desc: "Разделяя различные нации, сирийская курдская община всегда будет испытывать определенное нежелание быть частью нашей нации, чувствовать себя отдельной группой."
 SYR_druze_region: "Создание Друзского автономного района"
 SYR_druze_region_desc: "Наше население друзов, хотя оно и невелико, не будет забыто, но мы предоставим им их собственный автономный регион, с тем чтобы предотвратить их повторение дискриминации и насилия."
 SYR_syrian_federation: "Провозглашать Сирийскую Федерацию"
 SYR_syrian_federation_desc: "С закладкой фундамента настало время раз и навсегда укрепить нашу новую федеративную систему и разработать проект конституции, провозглашающей нашу сирийскую Федерацию."
 SYR_national_pact: "Национальное соглашение"
 SYR_national_pact_desc: "Бессмысленно утверждать, что мы представляем интересы всех меньшинств, если мы не представляем их должным образом в системе управления."
 SYR_adana_voting: "Плебисцит Аданы"
 SYR_adana_voting_desc: "Хотя мы можем попытаться с помощью силы победить турецких мятежников, факт заключается в том, что каждый повстанец, которого мы убиваем, является мучеником и приносит еще десять на их дело, мы должны сократить наши потери, пока мы едем вперед, и принять участие в референдуме о будущем наших северных территорий, надеюсь, это позволит нам спасти лицо."
 SYR_maintain_sunni_dominance: "Сохраняйте суннитское доминирование"
 SYR_maintain_sunni_dominance_desc: "Хотя мы, несомненно, хотим предоставить нашим меньшинствам свободу, которую они заслуживают, мы не должны начинать продвигать людей, основываясь только на обстоятельствах их рождения, хотя, возможно, почти все позиции власти занимают сунниты, возможно, потому, что мы выбираем только самых квалифицированных людей?"
 SYR_decentralized_development: "Децентрализованная программа развития"
 SYR_decentralized_development_desc: "Сирия сталкивается с проблемой слаборазвитости и неравного развития, чтобы убить двух птиц одним и тем же камнем, мы начнем поощрять развитие нашей страны, а не сосредотачиваться в наших городах."
 SYR_syrian_agri_bank: "Сирийский сельскохозяйственный банк"
 SYR_syrian_agri_bank_desc: "Банковские операции не являются наиболее развитыми в Сирии, особенно для наших сельских граждан, с тем чтобы обеспечить доступ к капиталу в этих районах, мы будем поощрять рост сельскохозяйственных банков, которые будут предоставлять займы фермерам, стремящимся улучшить свою продукцию."
 SYR_support_hawran: "Поддержка Хорана"
 SYR_support_hawran_desc: "Хоран является жизненно важной частью сельскохозяйственного сектора нашей страны, и мы должны поощрять процветание этого региона, с тем чтобы обеспечить продовольствием остальной части страны."
 SYR_redistribute_state_land: "Перераспределение государственной земли"
 SYR_redistribute_state_land_desc: "Многие из наших фермеров живут на грани нищеты, и, хотя эту ситуацию будет трудно решить, мы можем решить эту ситуацию, мы можем начать с передачи наших участков государственной земли самым отчаянным в стране."
 SYR_ghab_project: "Проект Габа"
 SYR_ghab_project_desc: "Хотя первоначальные инвестиции будут дорогостоящими, доступ к электроэнергии принесет нам бесчисленные социальные и экономические выгоды, превратив нас в современные страны мира."

 # An Army with a State
 SYR_army_with_a_state: "Армия с государством"
 SYR_army_with_a_state_desc: "Сирия должна стать местом полного военного господства, и наши военные должны обладать максимальной силой в наших делах, чтобы заставить наших врагов бояться нас."

 # Military Mandate #
 SYR_military_mandate: "Военный мандат"
 SYR_military_mandate_desc: "Военные победили Сирию, и военные будут продолжать защищать ее."
 SYR_chief_agency: "Агентство по защите государственных секретов"
 SYR_chief_agency_desc: "Чтобы защитить наше государство, мы должны создать совет, которому было бы поручено сохранить государственные секреты и следить за опасными элементами."
 SYR_restore_democracy: "Восстановление парламентской демократии"
 SYR_restore_democracy_desc: "Несмотря на то, что это было вызвано чрезмерным продвижением военных сил, личным соперничеством или, возможно, подлинной верой в демократию, вооруженные группировки начали выступать против нового режима."
 SYR_replace_civilian_admin: "Заменить Гражданская администрация"
 SYR_replace_civilian_admin_desc: "Нельзя допустить, чтобы некомпетентность гражданских должностных лиц сохранялась, и в дальнейшем мы укрепим военную дисциплину и структуры в правительстве государства. Сирийское состояние будущего будет таким, которое не будет подчиняться прихотям бюрократов."
 SYR_revise_constitution: "Пересмотр сирийской учебной программы"
 SYR_revise_constitution_desc: "Культура нации рождается в молодости, верования и идеалы, которыми дорожит молодежь, являются основой, на которой будет строиться будущее, и мы должны разработать новую учебную программу для Сирии, в которой будут закреплены военные принципы и убеждения, и обеспечить, чтобы наши методы и мотивы всегда сохраняли свою актуальность в сирийском обществе."
 SYR_1940_conscription_law: "Ввести в действие закон о призыве [начало]"
 SYR_1940_conscription_law_desc: "Мы должны разработать новый расширительный закон о призыве на военную службу для обеспечения того, чтобы не было недостатка в патриотах для защиты Сирии и ее народа."

 # Basic Principles #
 SYR_basic_principles: "Следовать основным принципам"
 SYR_basic_principles_desc: "Рождение сирийского народа изменило Леванта, но это преобразование не зашло достаточно далеко."
 SYR_mandatory_education: "Обязательное образование"
 SYR_mandatory_education_desc: "Неосведомленность нашего народа является позором, и если эта ошибка не будет исправлена, то она будет по-прежнему удерживать нас на десятилетия вперед, и если мы не будем решительно учить наших граждан тому, что правильно и что неправильно, то их невежество будет манипулироваться коллективистскими книжными обществами и другими разрушительными элементами."
 SYR_fight_darkness: "Сражайтесь с силами тьмы"
 SYR_fight_darkness_desc: "Мелкие разногласия религиозных учений и убеждений лишь подрывают и ослабляют нас, нет мусульман, евреев или христиан, есть только сирийцы, мы должны бороться с прошлым, светить светом во тьму, мы заставим их забыть свое прошлое, чтобы увидеть, что действительно имеет значение."
 SYR_separate_church_state: "Отдельная церковь и государство"
 SYR_separate_church_state_desc: "Огонь и лед, свет и темнота, церковь и государство, две вещи, которые никогда не должны быть смешаны, из страха перед слабыми потомками, которые они создают, вы можете молиться у себя дома, но вы должны быть патриотом в жизни. Каждый сириец должен знать, что государство всегда должно быть на первом месте, потому что без государства у них ничего не будет."
 SYR_integrate_ssnp: "Интегрировать военизированные формирования SSNP"
 SYR_integrate_ssnp_desc: "Хотя мы не сомневаемся в храбрости и возможностях армии, их понимание и поддержка наших принципов вызывают сомнения, и для того, чтобы устранить это недопонимание, мы должны приступить к интеграции наших военизированных формирований в качестве официальной части сирийских вооруженных сил, с тем чтобы наши принципы стали таким же элементом понимания армии, как бурение или стратегия."
 SYR_syrian_assimilation: "Сирийская программа интеграции и ассимиляции"
 SYR_syrian_assimilation_desc: "Меньшинства нашей нации заблуждаются, они еще не понимают, что они не отличаются от нас, разделены только искусственными разногласиями, и мы должны предпринять решительные шаги, чтобы заставить их увидеть истину."
 SYR_nationalize_the_economy: "Национализация экономики"
 SYR_nationalize_the_economy_desc: "Мы возьмем под непосредственный контроль экономику нашей страны и покажем этим «экономистам», что в Сирии рынок имеет очень заметную руку."
 SYR_abolish_feudalism: "Упразднение феодализма"
 SYR_abolish_feudalism_desc: "Если мы хотим стать современной нацией, мы должны покончить с этой неравной и старой системой."
 SYR_syrian_renaissance: "Возрождение Сирии"
 SYR_syrian_renaissance_desc: "Благодаря финансированию искусства и культуры сирийский народ будет выделяться в мире как энергичный и творческий."
 SYR_economic_planning: "Главное управление экономического планирования"
 SYR_economic_planning_desc: "Наше экономическое положение было бы лучше регулировать через центральный комитет, который мог бы планировать и контролировать торговлю и развитие страны."
 SYR_military_production: "Расширение военного производства"
 SYR_military_production_desc: "Благодаря нашему новому контролю над экономикой мы можем направить производство в тяжёлую промышленность, а не на ненужные потребительские товары, поскольку эти фабрики будут иметь жизненно важное значение для оснащения нашей армии самым современным оборудованием."
 SYR_economic_indepedence: "Преследуйте экономическую независимость"
 SYR_economic_indepedence_desc: "В торговле есть только победители и проигравшие, а проигравший - тот, кто должен импортировать больше."
 SYR_az_zor_oil: "Разведка нефти Дейр Аз-Зор"
 SYR_az_zor_oil_desc: "На Ближнем Востоке находится черное золото, и если мы сможем подключиться к этому богатому предложению, это даст нам значительную прибыль, а также даст нам больше экономической независимости."
 SYR_beritut_harbor: "Расширить гавань Бейрути"
 SYR_beritut_harbor_desc: "Гавань в Бейруте может стать крупным экспортным центром для Леванта при условии достаточных инвестиций в ее расширение. Для этого необходимо приобрести новые краны и построить причалы."
 SYR_expand_cotton_production: "Расширение производства хлопка Алеппана"
 SYR_expand_cotton_production_desc: "Производство хлопка вокруг Алеппо является весьма прибыльным, поскольку товарные культуры, как правило, выращиваются."
 SYR_support_textile_industry: "Поддержка сирийской текстильной промышленности"
 SYR_support_textile_industry_desc: "Сирийские текстильные предприятия известны по всему миру за свою продукцию, оказывая помощь в модернизации и расширении этого экономического сектора, мы можем увеличить экспорт и доходы, возвращаемые правительству."

 # Defend Syrian National Interests #
 SYR_defend_natural_syria: "Защита естественной Сирии"
 SYR_defend_natural_syria_desc: "В то время как панарабские идеалы хороши, реальность на местах заключается в том, что эта цель в лучшем случае представляется труднодостижимой, и многие также не хотят видеть, как наша новая независимость просто переплетается в расширяющееся и вероятно конфликтующее арабское государство. В конечном итоге мы должны разъяснить нашу позицию, что мы должны сохранить то, что мы выиграли, и что мы прежде всего сирийское государство."
 SYR_greater_syrian_nationalism: "Большой сирийский национализм"
 SYR_greater_syrian_nationalism_desc: "Хотя мы добились гораздо большего, чем можно было бы ожидать, есть территории, которые по праву не находятся под нашим контролем, хотя великая борьба за независимость окончена, вот-вот начнется новая борьба, которая должна раз и навсегда объединить всю сирийскую территорию."
 SYR_cypriot_claim: "Кипрская претензия"
 SYR_cypriot_claim_desc: "Остров Кипр, возможно, стоит на краю наших пансирийских целей, остров является жизненно важной стратегической точкой во всем Восточном Средиземноморье. Впервые за сотни лет этот жизненно важный остров свободен от контроля со стороны одного из региональных гегемонов и, следовательно, гораздо меньше способен противостоять стервятникам, которые сейчас его окружают. Мы обязаны захватить остров, прежде чем кто-то другой."
 SYR_reclaim_cillcia: "Повторить Килицию"
 SYR_reclaim_cillcia_desc: "В то время как мы были слабыми, район Килисии был похищен, мы обязаны исправить это незначительное положение, мы должны будем напомнить туркам, которые выиграли войну, и обеспечить, чтобы это был урок, который они не забыли."
 SYR_syria_assyria: "Объединить Сирию и Ассирийскую"
 SYR_syria_assyria_desc: "Объединение народа естественной Сирии является кульминацией наших целей, объединяющих плодородный полумесяц и победивших нас в государстве, которое не поколеблется до конца времени."
 SYR_international: "Сотрудничество с Международной организацией"
 SYR_international_desc: "Более чем любой другой международный блок, Интернационал представляет собой подлинное освобождение всех народов, они не являются голыми империалистами Германии и Египта, стремящимися к достижению своих собственных целей за счет нас."
 SYR_phalanstere: "Присоединяйтесь к Международному Фаланстеру"
 SYR_phalanstere_desc: "Фаланстер является коллективистским научным сообществом, которое делится знаниями на равной основе между своими различными членами, и, обратившись с просьбой присоединиться к Фаланстеру, мы заключим прямые контракты с нашими учеными и учеными в Париже и Лондоне."
 SYR_reichspakt: "Переговоры с Рейхспактом"
 SYR_reichspakt_desc: "В отличие от египтян, немцы очень мало заинтересованы во вмешательстве в Леванта ради чего-то большего, чем инвестиции, благодаря сотрудничеству мы смогли бы создать один из самых мощных военных и экономических альянсов в поддержку нашего развития и обороны."
 SYR_destroyers_forbases: "Уничтожение баз"
 SYR_destroyers_forbases_desc: "В то время как немцы, возможно, не заинтересованы в колониальной экспансии в Леванте, европейские державы притягиваются к военно-морским базам, как муравьи, к сахару."
 SYR_foreign_investors: "Поощрение иностранных инвесторов"
 SYR_foreign_investors_desc: "Хотя Сирия не известна тем, что она является экономическим центром мира, она обладает большим потенциалом роста, а также разумным объемом ресурсов, и мы должны попытаться продать этот образ нашей страны иностранным инвесторам и убедить их инвестировать столь необходимый капитал в сирийскую экономику."
 SYR_cairo_pact: "Сотрудничество с Каирским пактом"
 SYR_cairo_pact_desc: "Каирский пакт обладает уникальными возможностями для того, чтобы понять нашу ситуацию, будучи основан на аналогичном желании положить конец османской гегемонии над арабами."
 SYR_cairo_damascus_line: "Возвращение к Каирско-Дамаскской линии"
 SYR_cairo_damascus_line_desc: "Железнодорожная связь между Каиром и Дамаском оказалась в неустойчивом состоянии из-за конфликта между Османом и Египтом и отсутствия инвестиций с появлением нашего нового партнерства с египтянами, мы можем восстановить эту важную железнодорожную связь в качестве свидетельства нашей дружбы и благодати для нашей торговли."
 SYR_defend_syrian_national_interests: "Защита национальных интересов Сирии"
 SYR_defend_syrian_national_interests_desc: "Хотя мы, возможно, хотим избежать конфликтов, глобальная ситуация не так уж понятна пожеланиям отдельных государств, и глобальная борьба, которая затрагивает великие державы, неизбежно затрагивает нас."
 SYR_pursue_neutrality: "Нейтральность"
 SYR_pursue_neutrality_desc: "В отличие от менее самоуверенных наций, мы не чувствуем необходимости привязывать свой цвет к мачте, кроме как для нас самих, мы будем держаться подальше от других, и если они вмешаются в нас, мы напомним нам, что нейтралитет не является слабым положением."
 SYR_standard_small_arms: "Стандартизация стрелкового оружия"
 SYR_standard_small_arms_desc: "С учетом того, что наши арсеналы заполнены избыточным оружием от Оттоманцев и других, поставки наших войск могут иногда вызывать сильные головные боли у квартирмейстеров."
 SYR_military_colleges: "Повторное открытие военных академий"
 SYR_military_colleges_desc: "Нельзя недооценивать важность наличия квалифицированного офицерского корпуса, и, хотя наши офицеры в настоящее время достаточно квалифицированны, мы не должны допустить, чтобы это ухудшалось, мы вновь откроем старые османские военные академии для подготовки следующего поколения сирийских офицеров, которые, как мы надеемся, приведут свои войска к будущему величию."
 SYR_munution_factories: "Восстановить заводы по производству боеприпасов в Алеппане"
 SYR_munution_factories_desc: "Заводы по производству боеприпасов в Алеппо потерпели неудачу из-за отсутствия инвестиций и начинают выглядеть устаревшими по сравнению с другими оружейными заводами."
 SYR_domestic_arms_production: "Производство отечественного оружия"
 SYR_domestic_arms_production_desc: "В то время как мы в настоящее время полагаемся на избыточное оборудование из других стран, в будущем для нашей безопасности было бы гораздо лучше полагаться на наше собственное производство, с ремонтом наших заводов по производству боеприпасов, у нас теперь есть возможности для самодостаточного производства оружия и боеприпасов."
 SYR_lion_of_syria: "Льв Сирии"
 SYR_lion_of_syria_desc: "Несмотря на то, что наше государство постоянно сосредоточивает свои усилия на развитии и промышленном расширении, важно оглянуться вокруг и оценить, как далеко мы прошли."
 SYR_hawk_of_qurash: "Ястреб Кораиса"
 SYR_hawk_of_qurash_desc: "Военно-воздушные силы будут диктовать будущие войны, и, будучи молодым военным, мы можем избежать укоренения в традициях и признать этот факт."
 SYR_phoncian_shipbuilding: "Расширение феничного судостроения"
 SYR_phoncian_shipbuilding_desc: "Мы являемся наследниками наследства Phonecian, и, как и они, мы всегда будем поддерживать прочную связь с морем, источником богатства и товаров, мы должны быть уверены в том, что мы будем оставаться экспертами в морской области, с тем чтобы защитить наши торговые и рыболовецкие права."
 SYR_syrian_naval_academy: "Открыть Сирийскую военно-морскую академию"
 SYR_syrian_naval_academy_desc: "Мы создадим военно-морскую академию, чтобы готовить будущих моряков к плаванию по морям и защищать наши интересы."

 # Leadership of the Arab Movement #
 SYR_arab_leadership: "Предположительно лидерство Арабского движения"
 SYR_arab_leadership_desc: "В то время как другие могут претендовать на эту мантию, мы должны четко заявить, что мы являемся подлинными лидерами панарабского движения, мы уже являемся нацией, состоящей из многих различных народов, что делает нас более готовыми, чем другие, к созданию такой федерации."
 SYR_League_of_Arab_States: "Нашел Лигу арабских государств"
 SYR_League_of_Arab_States_desc: "Первым шагом на пути к единству станет объединение различных арабских государств в аналогичный политический, экономический и социальный союз."
 SYR_Economic_Social_Council: "Нашел Экономический и Социальный Совет"
 SYR_Economic_Social_Council_desc: "Первым шагом нашей интеграции станет создание экономического и социального совета, основное внимание в рамках которого будет уделяться устранению торговых барьеров и обеспечению того, чтобы интеграция не оставила позади экономически слабые государства."
 SYR_Arab_Customs_Union: "Арабский таможенный союз"
 SYR_Arab_Customs_Union_desc: "По мере постепенного ослабления торговых барьеров мы сделаем еще один шаг вперед и создадим общую таможенную зону между государствами-членами, что полностью преобразует нашу экономику в единую общую систему."
 SYR_Joint_Defence_Council: "Нашел Совместный совет обороны"
 SYR_Joint_Defence_Council_desc: "Вторая область, в которой сотрудничество имеет жизненно важное значение, касается обороны, и для начала мы создадим совместный оборонный совет, который будет содействовать военному сотрудничеству между различными государствами-членами."
 SYR_Arab_Unified_Command: "Объединить арабские командные структуры"
 SYR_Arab_Unified_Command_desc: "По мере расширения военного сотрудничества между государствами-членами настало время сделать еще один шаг вперед и объединить национальные команды в единую структуру, создав первые шаги в направлении создания единой арабской армии."
 SYR_Arab_Parliament: "Нашел парламент по арабским делам"
 SYR_Arab_Parliament_desc: "Поскольку усилия по экономической и военной интеграции идут полным ходом, настало время начать, скорее всего, самый спорный этап политической интеграции, хотя ожидая, что монархии и республики присоединятся к ним за одну ночь, было бы глупо, мы можем начать этот процесс с создания парламента для всех арабов."
 SYR_Council_of_Transportation: "Совет транспорта"
 SYR_Council_of_Transportation_desc: "В то время как железные дороги и дороги пересекают Ближний Восток, объединяя различные города все больше и больше с каждым днем, не существует единой структуры, которая обеспечивала бы управление ими, вызывала бы неэффективность и затрудняла бы процесс поездок, чем это необходимо."
 SYR_Council_of_Justice: "Совет юстиции"
 SYR_Council_of_Justice_desc: "Между иламским, гражданским и даже обычным правом в различных частях Ближнего Востока будет трудно создать общую судебную систему."
 SYR_Council_of_Social_Affairs: "Совет по социальным вопросам"
 SYR_Council_of_Social_Affairs_desc: "Хотя будущее арабское государство традиционно рассматривается как союз между доминирующими группами государств-членов, важно помнить о том, что регион заполнен многими меньшинствами, как культурными, так и религиозными."
 SYR_Arab_Federation: "Провозглашать Аравийскую федерацию"
 SYR_Arab_Federation_desc: "Несмотря на все трудности, объединенная арабская нация смотрит на момент рождения, мы напряженно трудимся для достижения взаимопонимания между арабскими государствами, и вскоре эти усилия окупятся."
 SYR_challenge_egypt: "Вызов египетскому доминированию"
 SYR_challenge_egypt_desc: "В то время как египтяне заслуживают похвалы за их роль в содействии этому последнему арабскому движению, новый региональный гегемон начинает проявлять свои растущие страдания. Пора новой нации, молодой и более динамичной, взяться за дело арабских государств, даже если это означает конфронтацию со старым обладателем правового титула."
 SYR_destablise_hejaz: "Угроза государству Хеджази"
 SYR_destablise_hejaz_desc: "Монархия Хеджази считает себя выше панарабского дела и отказывается присоединиться к нашему делу. Нельзя допустить, чтобы эта незначительная проблема, направленная против нас. К счастью, существует много сторонников единого арабского дела по всей своей стране, которые могут быть втянуты в действия, сторонники, которые станут жизненно важными администраторами, когда Хашими будут удалены."
 SYR_destablize_the_imamate: "Дестабилизировать имамата"
 SYR_destablize_the_imamate_desc: "Йеменское государство всегда чувствовало себя защищенным сложным географическим положением и раскрыло свои истинные цвета в своем решении не присоединяться к нашему новому государству."
 SYR_arab_broadcasts: "Аль-Араб"
 SYR_arab_broadcasts_desc: "Хотя есть много сторонников нашего дела, важно, чтобы мы завоевали сердца и умы везде, где это возможно, мы должны начать интенсивную вещание, чтобы мобилизовать поддержку панарабских причин, заложив основу для единого государства, пользующегося народной поддержкой."
 SYR_destablise_persian_gulf: "Дестабилизировать Персидский залив"
 SYR_destablise_persian_gulf_desc: "У пустынных монархий залива всегда была независимая полоса, которая становится очевидной, когда они отвергают наши замыслы. К счастью, эти штаты никогда не были самыми стабильными, и потребуется лишь минимальное применение силы, чтобы уничтожить весь дом карт."
 SYR_destablize_iraq: "Подминирование иракского государства"
 SYR_destablize_iraq_desc: "Достойно сожаления, что наши плодородные соседи Ирака отвергают наше дело, считая, что им было бы лучше пойти в одиночку, мы заставляем их осознать ошибку в этой вере и затащить их из тьмы в свет. Мы знаем, что наше дело популярно в стране, поэтому мы должны вызвать эти чувства, чтобы заставить правительства, которые сдерживают наше дело, вновь сломиться."
 SYR_arabistan_claim: "Арабистанская претензия"
 SYR_arabistan_claim_desc: "Хотя можно сказать, что притязания на Хузестана неустойчивы или мотивированы ресурсами, регион является арабским, простым и простым, мы освободим наших братьев от персов и навсегда поместим их в арабское крыло, а также получим доступ к многочисленным ресурсам региона."
 SYR_cooperate_oman_muscat: "Сотрудничество с Оманом и Маскатом"
 SYR_cooperate_oman_muscat_desc: "Вдалеке от остальной части конфликтов в регионе, предпочитая держать себя в руках, народ Омана принадлежит к нашей нации, мы начнем предлагать своему правительству присоединиться к панарабскому движению."

 ### Ideas ###
 syr_lebanese_unrest: "Мт Ливанский конфликт"
 syr_lebanese_unrest_desc: "Ливанский регион Мт всегда был скованным перед губернаторами Османа в Сирии, и этот вопрос только ухудшился после провозглашения независимого сирийского государства, включая Ливан."
 syr_alawite_unrest: "Алавит неуспокоенный"
 syr_alawite_unrest_desc: "Во главе с племенами алавитов Алавийские горы никогда не испытывали особой привязанности к идее Сирии и лишь в случае необходимости взаимодействовали с Оттоманом Валисом или сирийскими знатными людьми в низменных районах. С внезапным провозглашением сирийского государства эти группы оспаривают свое участие и ведут партизанскую войну, с тем чтобы утвердить свою автономию."
 syr_ottoman_military: "Дисорганизованная армия"
 syr_ottoman_military_desc: "Поскольку Османская империя предпочитала использовать иракцев в своих офицерских званиях, наша молодая нация страдает от нехватки военных знаний, необходимых для руководства нашей новой армией."
 syr_sunni_elite_control: "Суннитское политическое доминирование"
 syr_sunni_elite_control_desc: "Несмотря на огромное культурное и религиозное разнообразие, суннитские семьи правят в сирийском регионе почти с момента прихода ислама в Бильдур аш-Шам."
 syr_mudafaa_hukuk: "Мюдафа-и Хукук Чемиетельри"
 syr_mudafaa_hukuk_desc: "Под названием Мюдафа-и Хукук Чемиетлери или Ассоциация защиты национальных прав, различные группы турок и их союзники ведут партизанскую войну в бывших вилайетах Аданы и Алеппо против их аннексии новому сирийскому государству. Особенно ожесточенные сражения в Антепе и Адане необходимо будет быстро найти решение, поскольку координация действий этих групп чаще всего превосходит наши собственные военные."

 syr_egyptian_cooperation: "Сирийско-египетская экономическая интеграция"
 syr_military_intelligence: "Управление военной разведки"

 syr_stop_land_acquisition: "Приобретение еврейских земель"
 syr_unitary_civil_code: "Унитарная конституция"
 syr_hawran_secured: "Контроль над Хораном"
 syr_hawran_secured_desc: "Будучи сельскохозяйственным центром внутренней Сирии и главным экспортером бейрутской гавани, можно сказать, что тот, кто контролирует Хоран, контролирует не только Дамаск, но и всю Сирию."

 syr_census: "Национальное бюро переписей"
 syr_palestinian_jewish_treaty: "Соглашение о палестинском совещании за круглым столом"
 syr_federative_civil_code: "Конституция Федерации"
 syr_decentralised_development: "Децентрализованное развитие"

 syr_intelligence_agency: "Агентство по защите государственных секретов"
 syr_new_curriculum: "Пересмотренная учебная программа"
 syr_conscription: "1940 год Закон о призыве на военную службу"
 syr_SSNP_paramilitaries: "Военнослужащие ССНП"
 syr_churches_plundered: "Бюро по перераспределению религиозных фондов"
 syr_syrian_renaissance: "Сирийское Возрождение"
 syr_central_planning: "Главное управление экономического планирования"

 syr_defence_natural_syria: "Защита естественной Сирии"
 syr_taking_cyprus: "Кипрское вторжение"
 syr_taking_cilicia: "Вторжение в киликийское общество"
 syr_lion_of_syria: "Льв Сирии"
 syr_hawk_of_quraish: "Ястреб Кораиса"
 syr_foreign_aid: "Иностранные инвестиции"
 syr_vanguard_of_arabia: "Свет Аравийского моря"

 syr_famine: "Большой сирийский голод"
 syr_famine_desc: "Фермы остаются либо без присмотра, либо по милости Бригандов и рейдеров, поскольку когда-то продовольственная корзина Османской империи обрушилась на голод, который неизвестен со времен Велткрига. Десятки тысяч сирийцев бежали в города, которые стали намного более несоразмерными и напряженными по отношению к и без того ограниченным санитарно-гигиеническим объектам. Северная Сирия, которая в наименьшей степени пострадала в ходе ливантинской войны, пытается произвести достаточно для нации, но турецкое сопротивление и политика Алеппины окончательно останавливают почти все попытки."

 SYR_lebanon_war_dont_call_allies: "Ливанская война"
 SYR_lebanon_war_dont_call_allies_desc: "Беспорядки в районе горы Ливан достигли своего пика, и Фуад Чехаб и армия его добровольцев объявили открытое восстание."

