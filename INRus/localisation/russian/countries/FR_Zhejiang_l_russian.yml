### EVENTS ###
zhe.1.t: "Война за свободу!"
zhe.1.d: "Наше провозглашение независимости из Пекина было встречено протестами и насилием, как мы и ожидали. Мы ожидаем, что Республиканская армия когда-нибудь пересечет Янцзы, где мы столкнемся с ними с беспощадной жестокостью и агрессивностью. Несмотря на то, что наша борьба за независимость начинается здесь, и это, несомненно, будет кровавая и жесткая битва, но ради всего Китая мы должны добиться успеха и свергнуть этих коррумпированных империалистических марионеток."
zhe.1.a: "К оружию!"

