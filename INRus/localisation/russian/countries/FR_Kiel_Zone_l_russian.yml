SHO_invade_denmark_desc: "В 1927 году рабочие Гамбурга провозгласили первый Гамбургский коммуну, только чтобы ее раздавили датские угнетатели, и мы отомстим датчанам."
SHO_invade_germany: "Инвад Германия"
#SHO_invade_germany_desc: ""
SHO_puppet_denmark: "Создание датского кукольного государства"
SHO_puppet_denmark_desc: "Создав в Дании самоуправляющуюся зону и «заимствовав» их промышленную технику и финансирование, мы сможем помочь нашим промышленным амбициям и уменьшить бремя, лежащее на нашем административном секторе."
SHO_Peace_With_Honour: "Мир с честью"
SHO_Peace_With_Honour_desc: "Мы завладели пенисой Ютланда, пора вести переговоры о нашей независимости."
SHO_Peace_and_Vengeance: "Мир и мщение"
