#### IDEAS ####

SHO_hamburg_legacy: "Спектр гамбургского коммуны"
SHO_hamburg_legacy_desc: "Недолговечное коллективное восстание в Гамбурге в 1927 году было едва свергнуто оккупационными датскими войсками. 9 лет спустя наследие Гамбургской коммуны осталось в живых. Многие социалистические организации все еще существуют, ожидая момента, когда они вновь восстанут против своих датских угнетателей."
SHO_nazbol_gang: "Национальный коллективизм"
SHO_nazbol_gang_desc: "Гамбург стал местом рождения доктрины национального коллективизма, и, несмотря на различные радикальные националистические и коллективистские идеалы, национальные коллективисты, скорее всего, зажгут огонь революции, чтобы свергнуть датских оккупаторов."
SHO_political_repression: "Политические репрессии"
SHO_political_repression_desc: "Несмотря на то, что демократические движения добились демократии в самой Дании, Кильская зона остается под контролем переходного правительства на протяжении почти шести лет, многие права до сих пор не восстановлены, и датское переходное правительство предпринимает активные усилия по ликвидации всех коллективных организаций до проведения дальнейшей реформы."
SHO_integrating_denmark: "Интеграция территорий"
SHO_industrial_burdens: "Промышленное бремя"


