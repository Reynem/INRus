 usa.election.1936.16.t: "Кампании Джона Гарнера в Спокане"
 usa.election.1936.16.d: "Джон Нэнс Гарнер появился сегодня в Спокане для мягкой толпы, побуждённой к действиям своими энергичными выступлениями, сокрушив недавний экономический спад на слабом и демилитаризованном правительстве, не желающем вновь захватить свои законные земли и богатства, а также чрезмерно запутанную бюрократию, активно наказывающую потребителей, Гарнер поклялся положить конец излишним правилам и восстановить армию Америки."
