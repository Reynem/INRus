 #### Events ####

 usa.election.1936.1.t: "1936 год Прогрессивное национальное собрание"
 usa.election.1936.1.d: "В ноябре Рузвельт, который поклялся продолжить социальные реформы своей покойной двоюродной сестры Тедди (и его вице-президента Хирама Джонсона), чтобы достичь не только равенства между мужчинами и женщинами, но и расы."
 usa.election.1936.1.a: "Alf Landon"
 usa.election.1936.1.b: "Квентин Рузвельт"
 usa.election.1936.2.t: "1936 год Демократическое национальное собрание"
 usa.election.1936.2.d: "Несмотря на то, что последние несколько месяцев были исключительно напряженными и трудными, партия наконец-то собралась для того, чтобы выбрать человека, который будет представлять их. Хьюи Лонг, давний пожарный брус и колючая шип на стороне, как правило, консервативно-демократического учреждения, добился больших результатов, хотя он и передвигался туда-сюда с тех пор, как объявил о своей кандидатуре. Его противник - Джон Нэнс Гарнер - представляет собой консервативную и более ориентированную на оборону часть партии, смотря на границу с Мексикой и ее поглощающую напряженность. Кто теперь, среди них, возьмется за мантию?"
 usa.election.1936.2.a: "Джон Гарнер"
 usa.election.1936.2.b: "Хьюи Лонг"
 usa.election.1936.3.t: "Первый тур Лэндона"
 usa.election.1936.3.d: "Альф Лэндон недавно был избран кандидатом в президенты в качестве прогрессивного кандидата на президентские выборы в Соединенных Штатах. В ближайшие месяцы предвыборная кампания будет значительно активизирована, чтобы обеспечить прогрессивную победу. Альф Лэндон в основном имеет сторонников на Юге, поскольку он сам был канзасом, так что наша база надёжна. Однако другие части страны еще не убеждены в сильных сторонах Лэндона, какую часть страны мы должны посетить для проведения предвыборной кампании?"
 usa.election.1936.3.a: "Западные государства"
 usa.election.1936.3.b: "Североцентральные государства"
 usa.election.1936.3.c: "Юго-восточные государства"
 usa.election.1936.3.e: "Северо-восточные государства"
 usa.election.1936.4.t: "Кампании &lt; &lt; Альф Лэндон &gt; &gt; в Юджине"
 usa.election.1936.4.d: "Альф Лэндон появился сегодня в Юджине для массовых толпы, побуждённых к действиям его энергичными выступлениями, сокрушая недавний экономический спад в слишком регулирующем правительстве, которое пытается помешать новым деловым предприятиям действительно реализовать свой потенциал, прогрессивный кандидат поклялся поддерживать сделку, которая позволит всем американцам осуществлять свои собственные свободные предприятия и сократить бюрократические препоны."
 usa.election.1936.4.a: "Меньше правительства, это "да" для бедных!"
 usa.election.1936.4.b: "Снижение бюрократии, огромное притяжение к среднему классу!"
 usa.election.1936.4.c: "Богатые любят меньше налогов!"
 usa.election.1936.5.t: "Кампании &lt; &lt; Альф Лэндон &gt; &gt; в городе Канзас"
 usa.election.1936.5.d: "Альф Лэндон появился сегодня в Канзас-Сити перед массовыми толпами, побуждёнными к действиям своими энергичными выступлениями."
 usa.election.1936.5.a: "Меньше правительства, это "да" для бедных!"
 usa.election.1936.5.b: "Снижение бюрократии, огромное притяжение к среднему классу!"
 usa.election.1936.5.c: "Богатые любят меньше налогов!"
 usa.election.1936.6.t: "Кампании &lt; &lt; Альф Лэндон &gt; &gt; в Нэшвилле"
 usa.election.1936.6.d: "Альф Лэндон появился сегодня в Нэшвилле для массовых толпы, побуждённых к действиям его энергичными выступлениями, разожгая недавний экономический спад на чрезмерное регулирование правительства, которое пытается помешать новым предприятиям действительно реализовать свой потенциал, прогрессивный кандидат поклялся поддерживать сделку, которая позволит всем американцам осуществлять свои собственные бесплатные предприятия и сократить бюрократические препоны."
 usa.election.1936.6.a: "Меньше правительства, это "да" для бедных!"
 usa.election.1936.6.b: "Снижение бюрократии, огромное притяжение к среднему классу!"
 usa.election.1936.6.c: "Богатые любят меньше налогов!"
 usa.election.1936.7.t: "Кампании &lt; &lt; Альф Лэндон &gt; &gt; в Филадельфии"
 usa.election.1936.7.d: "Альф Лэндон появился сегодня в Филадельфии для массовых толпы, побуждённых к действиям своими энергичными выступлениями, утверждая, что недавняя депрессия непосредственно обострилась из-за того, что правительство боялось снизить налоги и прекратить регулирование, Лэндон лямбашировал антентичную платформу Рузвельта, желая переориентировать американскую экономику с нуля."
 usa.election.1936.7.a: "Бедные тоже ненавидят программу Рузвельта!"
 usa.election.1936.7.b: "Средний класс хочет заметных реформ!"
 usa.election.1936.7.c: "Скидка с налогами - это хорошо для богатых!"
 usa.election.1936.8.t: "Посещение нового региона"
 usa.election.1936.8.d: "Альф Лэндон наслаждался предвыборной кампанией в последних нескольких штатах, но он должен переехать в другой регион, чтобы обеспечить себе победу на выборах и победу на президентских выборах."
