 usa.election.1936.10.t: "Кампании &lt; &lt; Квентин Рузвельт &gt; &gt; в Портленде"
 usa.election.1936.10.d: "Квентин Рузвельт появился сегодня в Портленде перед массовыми толпами, побуждёнными к действиям своими энергичными выступлениями, сокрушая недавний экономический спад на правительство, не способное или не желающее защитить американского рабочего, Рузвельт стремился к равенству не только между полами, но и между расами."
 usa.election.1936.10.c: "Богатые любят социальную справедливость!"
 usa.election.1936.10.b: "Средний класс любит социальное равенство!"
 usa.election.1936.10.a: "Американский рабочий чувствует поддержку этого человека!"
 usa.election.1936.11.t: "Кампании Квентина Рузвельта в Сент-Луисе"
 usa.election.1936.11.d: "Квентин Рузвельт появился сегодня в Сент-Луисе у толпы толпы людей, побуждённых к действиям своими энергичными выступлениями, и, несмотря на недавний экономический спад в правительстве, не способном или не желающем защитить американского рабочего, Рузвельт стремился к равенству не только между полами, но и между расами, реакция толпы была неопределенной, по крайней мере пока..."
