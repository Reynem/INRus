 #ideas
 life_of_goral: "Жизнь Горала (Горальская Зычия)"
 life_of_goral_desc: "Жизнь Горалов всегда была такой странной для чужаков, их образ жизни в горах, знание внешнего мира и их единство с природой."
 shepherdess_podhale: "Га́дзина Подхала (Шепфердес из Подхале)"
 shepherdess_podhale_desc: "Гадзина Подхале или пастырь Подхали на английском языке — это их нынешняя церковь, расположенная недалеко от города Закопан, которая приносит единство в регионе, демонстрируя, что религия иногда может быть полезной во времена этих событий."
 minority_rule: "Правило о меньшинствах"
 minority_rule_desc: "С момента создания этой нации рейхскоммиссариат Гораленленда находился в полном хаосе, только небольшое число друзей и орлов Гораленфюрера имеют абсолютную власть над страной, вызывая массовые беспорядки, забастовки и политизированные преступления."
 polish_strike: "Забастовки в Польше"
 polish_strike_desc: "Польский Гораленволк бросает свои инструменты на бетонную площадку! Это результат Горальных и Польских отношений в регионе. Польский Гораленволк всегда испытывает подавление Гораленфюрера, его сделок с немцами и его грантов только частным предприятиям Горала."
 hej_gorale: "Хей, Гораль Анхем"
 hej_gorale_desc: "Песня "Hej, Gorale" является официальным гимном Гораленволка, некоторые из не-Gorales of the Goralenvolk не поют такого угнетающего гимна."
 jezu_milosci_twej: "Жезу Милочи Твей Анхем"
 jezu_milosci_twej_desc: "Песня Jezu Miloci Twej является официальным гимном Гораленволка, весь Гораленленд будет с гордыми глазами приветствовать флаг с гимном на заднем плане."
 #focus

 #events
 ger.2071.t: "Судьба ангелов"
 ger.2071.d: "По мере того как мы приходим к власти над бывшими польскими землями, на которых проживают Горалы, мы оказываемся в руках территорий большой этнической напряженности и борьбы, хотя прямой контроль над этими территориями может быть проблематичным для нашего правительства, если мы дадим им четвёртую автономию в качестве наших подданных, под полным руководством Рейха, конечно же, мы могли бы использовать их верность и людей."
 ger.2071.a: "Учредить рейхскоммиссарат."
 ger.2071.b: "Они будут управляться непосредственно Германией."
 ger.2072.t: "Горал-инкорпорация Лемковины"
 ger.2072.d: "Гораленфюрер послал Ганса Франка, валькиста-адвоката, который работал в Рейхскоммиссариате Гораленленда, для слияния двух наций Гораленленда и Лемковины, он утверждает, что Горалы утверждают, что этот регион находится с XI века. Действительно, там живет много горалов, но дает ли это им право инкорпорировать такую большую часть земли?"
 ger.2072.a: "Кому вообще нужен был Лемко?"
 ger.2072.b: "Эти Горалы не знают, что они делают."
 grl.1.t: "Выбор гимна для Гораленленда"
 grl.1.d: "Теперь, когда был сформирован рейхскоммиссарат Гораленленда, мы, Горалы Гораленленда, должны принять решение по гимну нашей совершенно новой нации. Нам нужно выбрать два из одной, из "Hej, Gorale" горальной песни, которая была очень популярна в партии SWG, она представляет трудности горальной жизни, и мы объединяемся в это время. Вторая называется "Jezu Miloci Twej" старой польской традиционной песней в нашем районе, это религиозная песня, которая случайно имеет ту же мелодию, что и британский гимн."
 grl.1.a: "Хей, Гораль, конечно, мы все-таки Горалы."
 grl.1.b: "Джезу Милочи Твей, мы должны проявить любовь ко всем Гораленволкам."
