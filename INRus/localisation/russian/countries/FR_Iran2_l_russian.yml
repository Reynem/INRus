 #### EVENTS ####

 iran.0.t: "Государство Иран в 1936 году"
 iran.0.d: "В 1800-х годах в стране начался процесс модернизации, в то время как влияние Великобритании и России стало расти. В конце века диагонистские силы в Персии верили в то, что их правители находятся под влиянием иностранных интересов. В начале 20-го века Персия стала конституционной монархией после персидской конституционной революции. Выборы были введены в Персии. В ходе Великой войны ее представитель также осмелился осмелиться над конфликтом. В то время как патрианская армия не остановила ни один из оттоманов от вторжения в страну. В ходе вторжения многие части страны находились под влиянием и контролем России, а российские войска находились в Иране. В Иране начались столкновения между Отоманом и российскими войсками, последние из которых были созданы при помощи Ассирии и армянских добровольческих подразделений. Однако с появлением русской революции охотничья армия одержала верх над страной. В ходе войны многие тысячи ассирийского и армянского населения в Персии были убиты войсками Отомана. Британские войска также оккупировали части страны во время войны. В 19-19-м горвике оческом народе силы одержали 19-девала страну."
 iran.0.a: "Да здравствует Иран!"
 iran.1.t: "Положение в Индии"
 iran.1.d: "Наши индийские соседи восстали против своих британских повелителей, давая нам возможность изменить нашу политику в отношении британцев. Многие иранцы считают, что это идеальное время, чтобы отдалить нашу страну от британского влияния."
 iran.1.a: "Это начало конца Британской империи."

 iran.2.t: "День нового Ирана!"
 iran.2.d: "Сегодня, 18 марта, отмечается День нового Ирана. Это был день, когда иранские вооруженные силы объявили социалистическое восстание раздавленным, которое положило конец династии Каджар и положило начало военному режиму. С того дня прошло 13 лет, и лидер режима Реза Хан выступил в Тегеране. В настоящее время он планирует выступить во многих других городах в последующие недели, в том числе в Табризе, но это решение может быть опасным, поскольку северные территории известны как социалистическое размножение."
 iran.2.a: "Осторожно, коммандер Реза Хан!"
 iran.3.t: "Убийство Резы Хан!"
 iran.3.d: "В конце визита Резы Хан в Табриз под платформой взорвалась бомба. Хан был доставлен в местную больницу в Табризе, однако врачи не смогли спасти ему жизнь. В то время как страна скорбит, уже проводятся расследования с целью найти и уничтожить террориста, который предшествовал этому ужасному акту. Весь город Табриз был отрезан. Хадж Али Размара был избран временным командиром, а военные выясняют, кто будет помогать Резе Хану."
 iran.3.a: "Прошел великий человек!"

 iran.4.t: "Начинают волнения социалисты"
 iran.4.d: "Иранские социалисты начали бунтовать. С убийством Резы Хан социалисты используют это в качестве возможности для того, чтобы принять участие в стычках, беспорядках и протестах. Однако это может также быть виной Советов."
 iran.4.a: "Прикажи военным вмешаться и прекратить беспорядки."
 iran.4.b: "Подождите, пока бунты сдохнут, арестуйте лидеров после того, как это будет сделано."
 iran.5.t: "Убийство Исфахана"
 iran.5.d: "После того, как солдатам было приказано прекратить беспорядки, они были в основном эффективными, но в Исфахане вспыхнули акты насилия, в результате чего вспыхнула напряженная ситуация, военные открыли огонь по толпе протестующих, в результате чего в тот день было убито 119 гражданских лиц и 4 солдата."
 iran.5.a: "Это нехорошо!"
 iran.6.t: "Социалистические революционеры поднимутся!"
 iran.6.d: "социалистические революционеры в северной части Ирана восстали против нашего правительства. мы должны действовать быстро, чтобы сломить этих революционеров."
 iran.6.a: "Нам не нужна помощь"
 iran.6.b: "Пригласите консерваторов и националистов, чтобы помочь нам."
 iran.7.t: "Тегеран пойман!"
 iran.7.d: "Революционерам удалось захватить Тегеран после ожесточенных боевых действий."
 iran.7.a: "Мы идем на юг!"
 iran.7.b: "Открытые переговоры!"
 iran.8.t: "Операция &lt; &lt; Хосрау &gt; &gt;"
 iran.8.d: "Началась операция по захвату Тегерана, но есть разногласия по поводу того, как ее следует осуществить. Некоторые генералы хотят быстро вернуться в Тегеран, в то время как другие хотят более постепенного и устойчивого продвижения. Первый план доведет нас до Тегерана быстрее, и хорошая возможность проникнуть глубоко в линию мятежников. Но этот план также может быть рискованным. Второй план менее рискованный, но он занимает больше времени и, возможно, больше жизней."
 iran.8.a: "Быстрее в Тегеран!"
 iran.8.b: "Сделай стойкий толчок на всех сторонах!"
 iran.9.t: "Тегеран Освобождён!"
 iran.9.d: "Тегеран был освобожден, наш быстрый толчок в Тегеране окупился, хотя это может быть большой победой для наших войск, мы могли видеть, что наши силы не могут защитить наши новые линии фронта."
 iran.9.a: "Это же хорошо, да?"
 iran.10.t: "Социалисты снова захватили Тегеран!"
 iran.10.d: "Получены ужасные новости, Тегеран был вновь оккупирован повстанческими силами, врагу удалось окружить город, и после ожесточенного боя мы были вынуждены сдать город."
 iran.10.a: "У нас нет другого выбора, кроме как вести переговоры."
 iran.11.t: "Начинаются переговоры!"
 iran.11.d: "Начались переговоры между правительством и повстанцами, мятежники предъявляют многочисленные требования, стремятся к модернизации и требуют полной демократии в Иране."
 iran.11.a: "Посмотрим, куда это нас приведет."
 iran.12.t: "Переговоры окончены!"
 iran.12.d: "После нескольких дней дискуссий в зале переговоров наконец-то достигнуто согласие, и генерал Хадж Али Размара представит то, что было согласовано."
 iran.12.a: "Да здравствует Республика!"
 iran.12.b: "Вместе за прогресс!"
 #iran.13.t: "Прогрессивный режим!"
 #iran.13.d: "ВИП"
 #iran.13.a: "Вместе за прогресс!"

 iran.14.t: "Тегеран Освобождён!"
 iran.14.d: "Тегеран был освобожден, наши постоянные усилия в городе Тегеран дали нам результаты, хотя потребовалось немного больше времени и людей, чем того хотели бы наши генералы, тем не менее, Тегеран теперь находится под нашим контролем."
 iran.14.a: "Это хорошо!"
 iran.15.t: "Социалисты-революционеры сдаются!"
 iran.15.d: "Сейчас, когда Тегеран и большая часть прилегающих к нему земель находятся под нашим контролем, боевые силы социалистических революционеров ограничены, их контакты с союзниками ограничены или отрезаны, в то время как силы восстановили моральный дух, они сдались."
 iran.15.a: "Наконец!"
 iran.16.t: "Новый командующий Ираном"
 iran.16.d: "После поражения восстания мы наконец можем выбрать преемника нашего покойного лидера Резы Хана, наши генералы и официальные лица разделились в поддержке двух кандидатов, первого сына Резы Хана, Мохаммада Хана, который был представлен в качестве молодой альтернативы своему отцу, Мохаммада Хана, который хочет модернизировать Иран и превратить страну в современную власть, а другого варианта - Хасана Арфа. Арфа более консервативна, сохраняя при этом некоторые мысли реформистов, которыми занимается Мохаммад Хан."
 iran.16.a: "Молодой прогрессивный Мохаммад Реза"
 iran.16.b: "Консерватив Хасан Арфа"

 iran.17.t: "Битва при Тегеране"
 iran.17.d: "Битва за контроль над Тегераном началась при поддержке консерваторов и националистов мы можем надеяться на шанс победить революционеров."
 iran.17.a: "Город не может упасть!"
 iran.17.b: "Мы должны спасать своих людей!"
 iran.18.t: "Победа Тегерана"
 iran.18.d: "Битва за контроль над Тегераном одержала победу, с помощью наших консервативных и националистических союзников нам удалось победить, конечно, у них будут требования к нам, но это небольшая цена."
 iran.18.a: "Они сейчас в бегах!"
 iran.19.t: "Новый режим!"
 iran.19.d: "Когда социалистические революционеры в бегах, мы наконец-то можем выбрать преемника Резы Хана. С консервативными и правыми националистическими элементами в Иране, поддерживающими нас в победе революционеров, прогрессивные не нашли поддержки среди наших генералов. В то же время мы должны выбрать между двумя альтернативами: консервативным Хасаном Арфой или националистом Фазоллой Захеди."
 iran.19.a: "Консерватив Хасан Арфа принимает командование"
 iran.19.b: "Фазлолла Захеди принимает командование"
 iran.20.t: "Жестокие протесты против нового режима!"
 iran.20.d: "После смены режима произошел ожесточенный протест, и мы послали его, чтобы положить конец этим беспорядкам."
 iran.20.a: "Мы уничтожим их!"

 iran.21.t: "Социалистические лидеры в Советский Союз"
 iran.21.d: "После арестов многих социалистов многие социалистические лидеры теперь бежали в Россию через Каспийское море."
 iran.21.a: "Черт, мы их потеряли!"
 iran.22.t: "Новые протесты нарастают!"
 iran.22.d: "В Иране вспыхнули новые протесты."
 iran.22.a: "Арестовать только тех, кто нарушает закон"
 iran.23.t: "Протестующие оккупируют Тегеран"
 iran.23.d: "Протесты расширились, и сейчас город Тегеран находится под контролем этих протестующих, правительство в свою очередь сбежало на юг Ирана, и теперь военные просят разрешения на участие этих протестующих и восстановление порядка в Иране."
 iran.23.a: "Время снять перчатки!"
 iran.23.b: "Давайте послушаем, чего они хотят."
 iran.24.t: "Освобождение Тегерана"
 iran.24.d: "С учетом того, что в настоящее время военные полностью вовлечены в борьбу с протестующими, мы смогли вернуть Тегеран обратно, и с этой победой мы продемонстрировали, что не позволим себе потерпеть поражение."
 iran.24.a: "Это, наконец, отметит их конец!"
 iran.25.t: "Переговоры с протестующими"
 iran.25.d: "Начались переговоры с протестующими, и, хотя многие военные немного негативно относятся к нашей политике, люди, кажется, рады тому, что сделка заключена, мы можем лишь надеяться на лучшее будущее."
 iran.25.a: "Посмотрим, где мы приземлимся!"

 iran.26.t: "Лондонский Крэш врезается в Иран!"
 iran.26.d: "Несколько дней назад в Соединенном Королевстве произошел крушение Лондонского фондового рынка, и, имея связи с Британской империей, неудивительно, что последствия этой катастрофы переместились в Иран."
 iran.26.a: "Персидский Льв Стреляет!"
 iran.27.t: "Поработаем с Британской империей?"
 iran.27.d: "Сейчас, когда Лондонский фондовый рынок прибыл и урегулировался в Иране, возникают споры о том, как с ним справиться. Некоторые люди в нашем правительстве выступают за сотрудничество с Британской империей. Они считают, что это вариант, который сделает восстановление быстрее. Но есть и многие, кто хочет использовать эту ситуацию, чтобы ограничить британское влияние в Иране. Они рассматривают этот кризис как возможность сделать это, даже если это будет опасно."
 iran.27.a: "Да, мы должны стоять вместе."
 iran.27.b: "Иран наконец-то станет свободным!"

 iran.28.t: "Открытие нового министерства иностранных дел"
 iran.28.d: "Было открыто новое министерство иностранных дел, которое будет служить для того, чтобы лучше заключать сделки и вести войны."
 iran.28.a: "Дипломатия и война важны!"

 iran.100.t: "Иранцы стремятся к экономическому сотрудничеству"
 iran.100.d: "Иран заинтересован в экономическом сотрудничестве с нами и стремится к такому сотрудничеству, которое в равной степени отвечало бы интересам обеих наших стран."
 iran.100.a: "Да, выглядит отлично!"
 iran.100.b: "Нам это не нужно!"

 iran.101.t: "Британская империя согласилась"
 iran.101.d: "Британская империя согласилась на экономическое сотрудничество между ними и нами."
 iran.101.a: "Экономическое сотрудничество - это путь вперед!"

 iran.102.t: "Британская империя отвергает"
 iran.102.d: "Британская империя отвергла экономическое сотрудничество между ними и нами."
 iran.102.a: "Это плохо..."

 iran.103.t: "Советники по экономическим вопросам Великобритании"
 iran.103.d: "Британские советники прибыли в Тегеран, чтобы рассказать нам об экономических теориях и о том, что мы должны делать для улучшения нашей экономики."
 iran.103.a: "Хорошая сделка!"

 iran.104.t: "Иран пытается ограничить наше влияние!"
 iran.104.d: "Иран начал пытаться ограничить наше влияние на них, и грустно слышать, что они пытаются сделать это, когда мы так много для них сделали."
 iran.104.a: "Они всего лишь ребёнок, пытающийся бороться с львом."

 iran.105.t: "Военные бароны протестуют против того, что богатство поглощает!"
 iran.105.d: "Военные бароны начали протестовать против нашей новой политики захвата части своего имущества, они говорят, что это их богатство и что мы должны облагать их налогом."
 iran.105.a: "Все должны отдать!"

 iran.106.t: "Иран приступает к национализации АМОК"
 iran.106.d: "Иран не остановил свои агрессивные пути. Сейчас они начали национализировать англо-иранскую нефтяную компанию. Мы рассматриваем это как нападение на суверенитет британских компаний за морем и на империю. Некоторые в нашем правительстве потребовали войны, но есть те, кто говорит, что мы должны подождать, пока последствия Лондонского Крэша не прекратятся."
 iran.106.a: "Это значит войну!"
 iran.106.b: "Сейчас у нас есть и другие проблемы."

 iran.107.t: "Местные эксперты по экономическим вопросам оказывают консультативную помощь"
 iran.107.d: "В то время как некоторые утверждают, что наши методы не столь хороши, как британские, мы следуем нашим, а не их."
 iran.107.a: "Нам не нужен иностранный совет!"

 iran.108.t: "Иран хочет стать нашим союзником"
 iran.108.d: "Иран отправил телеграмму с просьбой стать официальным союзником нашей нации."
 iran.108.a: "Да, почему бы и нет"
 iran.108.b: "Нет, спасибо."

 iran.109.t: "Германия принимает"
 iran.109.d: "Германия согласилась с нашей просьбой о том, чтобы они и мы стали союзниками."
 iran.109.a: "Начало доброй дружбы!"

 iran.110.t: "Германия отвергает"
 iran.110.d: "Германия отклонила нашу просьбу о том, чтобы они и мы стали союзниками."
 iran.110.a: "Они нам не нужны!"

 iran.111.t: "Иран хочет стать нашим союзником"
 iran.111.d: "Иран отправил телеграмму с просьбой стать официальным союзником нашей нации."
 iran.111.a: "Да, почему бы и нет"
 iran.111.b: "Нет, спасибо."

 iran.112.t: "Британия принимает"
 iran.112.d: "Британия приняла нашу просьбу о том, чтобы они и мы стали союзниками."
 iran.112.a: "Начало доброй дружбы!"

 iran.113.t: "Великобритания отвергает"
 iran.113.d: "Британия отклонила нашу просьбу о том, чтобы они и мы стали союзниками."
 iran.113.a: "Они нам не нужны!"

 iran.114.t: "Иран хочет стать нашим союзником"
 iran.114.d: "Иран отправил телеграмму с просьбой стать официальным союзником нашей нации."
 iran.114.a: "Да, почему бы и нет"
 iran.114.b: "Нет, спасибо."
 iran.115.t: "Советский Союз принимает"
 iran.115.d: "Советы приняли нашу просьбу о том, чтобы они и мы стали союзниками."
 iran.115.a: "Начало доброй дружбы!"
 iran.116.t: "Советский Союз отвергает"
 iran.116.d: "Советы отвергли нашу просьбу о том, чтобы они и мы стали союзниками."
 iran.116.a: "Они нам не нужны!"

 iran.117.t: "Закон об освобождении женщин [наступает]"
 iran.117.d: "В новом и современном Иране женщины не должны быть предметами, принадлежащими их родственникам-мужчинам, они сами по себе, поэтому мы должны сломать религиозную одежду, которая пытается дегуманизировать женщин."
 iran.117.a: "Для нового и современного Ирана!"

 iran.118.t: "Оппозиция голоса шиитов"
 iran.118.d: "С нашим стремлением ограничить влияние шиитов, было много шиитов, которые выступали против нашего правительства, они старая школа и сопротивляются прогрессу Ирана."
 iran.118.a: "Это не Иран старого!"

 iran.119.t: "Вопрос о западных законах"
 iran.119.d: "Ведутся дискуссии о том, следует ли нам принимать более западный закон или нет. Те, кто заявляет о таком изменении, утверждают, что наши законы стары и несовременны, являются артефактом со времен Каджарской династии, но есть и те, кто утверждает, что принятие западных законов дает сигнал поражения европейским колониалистам."
 iran.119.a: "Мы должны принимать западные законы"
 iran.119.b: "Нет, мы должны придерживаться своих законов."

 iran.120.t: "Консервативное движение к нам"
 iran.120.d: "Мы приветствуем их и надеемся, что они помогут нам направить Иран в верном направлении."
 iran.120.a: "Это мило."

 iran.121.t: "Умеренные движутся влево"
 iran.121.d: "Некоторые умеренные люди были против религиозной одежды. Теперь, когда режим, при поддержке многих консерваторов, допустил это, есть много умеренных, которые переместились на политические левые в знак протеста."
 iran.121.a: "Пусть они делают свое дело"

 iran.122.t: "Вопрос о правовом кодексе шиитов"
 iran.122.d: "Говорят, что в шиитском исламе есть много вещей, которые могут быть полезны для законов, есть и те, кто рассматривает этот шаг как способ привнести религию в управление, и поэтому они немного скептичны."
 iran.122.a: "Мы должны придерживаться наших шиитских законов"
 iran.122.b: "Нет религии в нашем правовом кодексе"

 iran.123.t: "Выборы гражданского правительства"
 iran.123.d: "Мохаммад Реза Хан, наконец, решил провести демократические выборы, пока он останется главой государства, он позволил демократическим партиям принять участие в выборах, что ознаменует собой окончание военного правления в Иране."
 iran.123.a: "Иранская партия выигрывает!"
 iran.123.b: "Эдалатская вечеринка выигрывает!"

 iran.124.t: "Выборы гражданского правительства"
 iran.124.d: "Хасан Арфа, наконец, решил провести демократические выборы, и до тех пор, пока он останется главой государства, он позволил демократическим партиям принять участие в выборах, что ознаменует собой окончание военного правления в Иране."
 iran.124.a: "Оживительная партия побеждает!"
 iran.124.b: "Демократическая партия выигрывает!"

 iran.125.t: "Всеобщие выборы [поступления]"
 iran.125.d: "С учетом существования Республики мы готовы провести выборы, первые выборы после создания республики привели к двум возможным победителям, с одной стороны, партия Тудех может выиграть, создав коалицию с другими социалистическими и левыми силами, а с другой стороны, мы можем увидеть Мохаммада Мосаддега и Иранскую партию, которые смогли создать центр для ухода из коалиции, кто выиграл эти выборы?"
 iran.125.a: "Партия Тудех побеждает!"
 iran.125.b: "Коалиция Моссадега побеждает!"

 iran.126.t: "Какая доктрина правил, которым следует следовать?"
 iran.126.d: "Поскольку старый военный режим, наконец, ушёл, нам нужно выяснить, какую доктрину правления мы должны следовать."
 iran.126.a: "Консервативное шиитское государство лучше всего"
 iran.126.b: "Новый Иран поднимется!"

 iran.127.t: "Иран поддерживает иранских мятежников"
 iran.127.d: "Правительство Ирана начало поддерживать иранских мятежников."
 iran.127.a: "Будь ты проклят, Иран!"

 iran.128.t: "Строить нашу личность!"
 iran.128.d: "Ирану нужна идентичность, которая отличается от арабов или турок, но с почти одной религией между нами, которая могла бы рассматривать иранец как свою собственную личность, но когда мы вернемся, прежде чем ислам был навязан нам, мы найдем Зороастрианизм, который может определить нашу новую самобытность."
 iran.128.a: "Зороастрианская империя Персии - хорошее место, чтобы оглянуться назад."

 iran_foreign_policy.1.d: "Геополитический ландшафт Ближнего Востока меняется, а вместе с ним — историческая роль иранского государства. Слишком долго наши границы и наша судьба находились под влиянием прихотей отдаленных империй и тени прошлых договоров. И наоборот, растущая фракция прагматистов утверждает, что такие военные авантюры будут лишь вызывать иностранное вмешательство и разрушать казну. Они выступают за период изоляции, фокусируя наши ограниченные ресурсы на промышленном развитии и внутренней стабильности для обеспечения будущего процветания. Мы стоим на решающем этапе: будем ли мы стремиться к нашей безопасности, используя силу наших вооружений за рубежом или стабильность наших институтов дома?"

