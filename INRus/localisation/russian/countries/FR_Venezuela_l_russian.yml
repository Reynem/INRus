 #VEN_romulo_ernesto_betancourt_bello_leader_desc: "Молодой бомбастичный, но умеренный член широкой коалиции, которая свергнула диктатора Хуана Висенте Гомеса, выборы Бетанкура привели к расколу в этой коалиции. Бетанкур стремится укрепить восстановление демократии в Венесуэле и избавиться от зависимости от нефти в интересах экономического роста."

