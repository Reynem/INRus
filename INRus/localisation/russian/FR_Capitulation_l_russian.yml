 country_capitulated.0.t: "[Root.GetName] капитулировал"
 country_capitulated.0.d_positive_both_no_faction:1 "[Этот.GetNewspaperHeader]\n [From.From.GetLeader] объявил, что трусливая [Root.GetAdjective] нация больше не может противостоять давлению со стороны подавляющего присутствия [From.From]. Силы GetAdjective по всей стране. Правительство решило бежать из страны и уехало в изгнание. Их основные силы капитулировали, и [From.From.GetNameDef] теперь контролирует их домашнюю территорию. Хотя война продолжается в других местах, это большая победа для [From.From.GetNameDef]."
 country_capitulated.0.d_positive_prev_no_faction:1 "[Этот.GetNewspaperHeader]\n [From.From.GetLeader] объявил, что трусливая [Root.GetAdjective] нация больше не может противостоять давлению со стороны подавляющего присутствия [From.From]. Силы GetAdjective по всей стране. Правительство решило бежать из страны и уехало в изгнание. Их основные силы капитулировали, и [From.From.GetNameDef] теперь контролирует их родную область.\nХотя война против того, что осталось от [Root.GetFactionName], продолжается в другом месте, это большая победа для [From.From.GetNameDef]."
 country_capitulated.0.d_positive_prev_faction:1 "[Этот.GetNewspaperHeader]\n [From.From.GetLeader] объявил, что трусливая [Root.GetAdjective] нация больше не может противостоять давлению со стороны подавляющего присутствия [From.From]. Силы GetAdjective по всей стране. Правительство решило бежать из страны и уехало в изгнание. Их основные силы капитулировали, и [From.From.GetNameDef] теперь контролирует их родную область.\nХотя война против того, что осталось от [Root.GetFactionName], продолжается в другом месте, это большая победа для всех [From.From.GetFactionName]."
 country_capitulated.0.d_negative_both_no_faction:1 "[Этот.GetNewspaperHeader]\n [Root.GetLeader] объявил, что [Root.GetAdjective] нация больше не может противостоять давлению со стороны оккупационных [From.From.GetAdjective] сил, совершающих пародии по всей стране. Правительство [Root.GetAdjective] ушло в изгнание. Их основные силы капитулировали, и [From.From.GetNameDef] теперь контролирует их домашнюю территорию."
 country_capitulated.0.d_negative_prev_no_faction:1 "[Этот.GetNewspaperHeader]\n [Root.GetLeader] объявил, что [Root.GetAdjective] нация больше не может противостоять давлению со стороны оккупационных [From.From.GetAdjective] сил, совершающих пародии по всей стране. Правительство [Root.GetAdjective] ушло в изгнание. Их основные силы капитулировали, и [From.From.GetNameDef] теперь контролирует их родную область.\nХотя война против [From.From.GetNameDef] продолжается, это неудачная неудача для всех [Root.GetFactionName]."
 country_capitulated.0.d_negative_prev_faction:1 "[Этот.GetNewspaperHeader]\n [Root.GetLeader] объявил, что [Root.GetAdjective] нация больше не может противостоять давлению со стороны оккупационных [From.From.GetAdjective] сил, совершающих пародии по всей стране. Правительство [Root.GetAdjective] ушло в изгнание. Их основные силы капитулировали, и [From.From.GetNameDef] теперь контролирует их домашнюю территорию.\nХотя война против [From.From.GetNameDef] и остальной части [From.From.GetFactionName] продолжается, это неудачная неудача для всех [Root.GetFactionName]."
 country_capitulated.0.d_neutral_both_no_faction:1 "[Это.GetNewspaperHeader]\nПравительство [Root.GetAdjective] ушло в изгнание, и их основные силы капитулировали перед [From.From.GetNameDef], который теперь контролирует их родную область.\n\n Хотя борьба между [From.From.GetName] и [Root.GetName] закончена, [From.From.GetNameDef] все еще находится в тотальной войне, и боевые действия продолжаются в других местах."
 country_capitulated.0.d_neutral_prev_no_faction:1 "[Это.GetNewspaperHeader]\nПравительство [Root.GetAdjective] ушло в изгнание, и их основные силы капитулировали перед [From.From.GetNameDef], который теперь контролирует их родную область.\n\n Борьба в [Root.GetName] была лишь небольшой частью конфликта. Война между [From.From.GetNameDef] и тем, что осталось от [Root.GetFactionName], продолжается в другом месте."
 country_capitulated.0.d_neutral_prev_faction:1 "[Это.GetNewspaperHeader]\nПравительство [Root.GetAdjective] ушло в изгнание, и их основные силы капитулировали перед [From.From.GetNameDef], который теперь контролирует их родную область.\n\n Борьба между [From.From.GetNameDef] и [Root.GetNameDef] была лишь небольшой частью конфликта. Война между [From.From.GetFactionName] и тем, что осталось от [Root.GetFactionName], продолжается в другом месте."
