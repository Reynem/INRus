 country_capitulated.0.t: "[Root.GetName] капитулирует"
 country_capitulated.0.d_positive_both_no_faction:1 "[This.GetNewspaperHeader]\n[From.From.GetLeader] объявил, что трусливая нация ([Root.GetAdjective]) больше не в силах противостоять подавляющему натиску [From.From.GetAdjective] войск по всей стране. Правительство приняло решение бежать из страны и отправилось в изгнание. Их основные силы капитулировали, и [From.From.GetNameDef] теперь полностью контролирует их национальную территорию. Хотя в других регионах война продолжается, это великая победа для [From.From.GetNameDef]."
 country_capitulated.0.d_positive_prev_no_faction:1 "[This.GetNewspaperHeader]\n[From.From.GetLeader] объявил, что трусливая нация ([Root.GetAdjective]) больше не в силах противостоять подавляющему натиску [From.From.GetAdjective] войск по всей стране. Правительство приняло решение бежать из страны и отправилось в изгнание. Их основные силы капитулировали, и [From.From.GetNameDef] теперь полностью контролирует их национальную территорию.\nХотя война против остатков [Root.GetFactionName] продолжается в других местах, это великая победа для [From.From.GetNameDef]."
 country_capitulated.0.d_positive_prev_faction:1 "[This.GetNewspaperHeader]\n[From.From.GetLeader] объявил, что трусливая нация ([Root.GetAdjective]) больше не в силах противостоять подавляющему натиску [From.From.GetAdjective] войск по всей стране. Правительство приняло решение бежать из страны и отправилось в изгнание. Их основные силы капитулировали, и [From.From.GetNameDef] теперь полностью контролирует их национальную территорию.\nХотя война против остатков [Root.GetFactionName] продолжается в других местах, это великая победа для всех членов [From.From.GetFactionName]."
 country_capitulated.0.d_negative_both_no_faction:1 "[This.GetNewspaperHeader]\n[Root.GetLeader] объявил, что нация ([Root.GetAdjective]) больше не может сдерживать натиск оккупационных [From.From.GetAdjective] войск, чинящих зверства по всей стране. Правительство ([Root.GetAdjective]) ушло в изгнание. Основные силы капитулировали, и [From.From.GetNameDef] теперь контролирует их национальную территорию."
 country_capitulated.0.d_negative_prev_no_faction:1 "[This.GetNewspaperHeader]\n[Root.GetLeader] объявил, что нация ([Root.GetAdjective]) больше не может сдерживать натиск оккупационных [From.From.GetAdjective] войск, чинящих зверства по всей стране. Правительство ([Root.GetAdjective]) ушло в изгнание. Основные силы капитулировали, и [From.From.GetNameDef] теперь контролирует их национальную территорию.\nХотя война против [From.From.GetNameDef] продолжается, это тяжелый удар для всех членов [Root.GetFactionName]."
 country_capitulated.0.d_negative_prev_faction:1 "[This.GetNewspaperHeader]\n[Root.GetLeader] объявил, что нация ([Root.GetAdjective]) больше не может сдерживать натиск оккупационных [From.From.GetAdjective] войск, чинящих зверства по всей стране. Правительство ([Root.GetAdjective]) ушло в изгнание. Основные силы капитулировали, и [From.From.GetNameDef] теперь контролирует их национальную территорию.\nХотя война против [From.From.GetNameDef] и остальной части [From.From.GetFactionName] продолжается, это тяжелый удар для всех членов [Root.GetFactionName]."
 country_capitulated.0.d_neutral_both_no_faction:1 "[This.GetNewspaperHeader]\nПравительство ([Root.GetAdjective]) ушло в изгнание, а основные силы страны капитулировали перед [From.From.GetNameDef], контролирующим теперь их национальную территорию.\n\nХотя борьба между [From.From.GetNameDef] и [Root.GetNameDef] завершена, [From.From.GetNameDef] все еще находится в состоянии тотальной войны, и боевые действия продолжаются в других регионах."
 country_capitulated.0.d_neutral_prev_no_faction:1 "[This.GetNewspaperHeader]\nПравительство ([Root.GetAdjective]) ушло в изгнание, а основные силы страны капитулировали перед [From.From.GetNameDef], контролирующим теперь их национальную территорию.\n\nБои на территории [Root.GetNameDef] были лишь частью масштабного конфликта. Война между [From.From.GetNameDef] и тем, что осталось от [Root.GetFactionName], продолжается в других регионах."
 country_capitulated.0.d_neutral_prev_faction:1 "[This.GetNewspaperHeader]\nПравительство ([Root.GetAdjective]) ушло в изгнание, а основные силы страны капитулировали перед [From.From.GetNameDef], контролирующим теперь их национальную территорию.\n\nБорьба между [From.From.GetNameDef] и [Root.GetNameDef] была лишь частью масштабного конфликта. Война между [From.From.GetFactionName] и тем, что осталось от [Root.GetFactionName], продолжается в других регионах."
 country_capitulated.0.a: "Отличные новости!"
