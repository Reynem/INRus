 ace_killed_other_ace.1.t: "[От имени] Застрелен [Преподобный. Гет-Коллсигент]"
 ace_killed_other_ace.1.d: "Наша последняя миссия в направлении [от Get Mission Region] была большим успехом для [от имени] военно-воздушных сил в более чем одном аспекте. Поступали сообщения, в которых освещалось [отполняемое имя] героическое деяние [от имени Аллаха], с помощью которого пилот [Прев. Гетнам], [Прев. Гетснам], известный как [Прев. Гет-Каллсин], использовал [от Гет-Коллс] в качестве приманки и заманил [Прев-Гет-Килл] в ловушку, где пилоты [от имени прев. Гет-Гет] могли нырять на [Прев. Гет-Звук] величественный] отряд великих героев [Прев. Гет-Коллсиг]. [От Гет-Коллс] использовал [от Гет-Сам] в качестве приманки и заманил [Прев. Гет-Адъев] летчик, который скачался с небесных лы, они опасают за собой."
 ace_killed_other_ace.1.d_major: "Наша последняя миссия в направлении [от Get Mission Region] была большим успехом для [от имени] военно-воздушных сил в более чем одном аспекте. Поступали сообщения, в которых освещалось [отполняемое имя] героическое деяние [от имени Аллаха], с помощью которого пилот [Прев. Гетнам], [Прев. Гетснам], известный как [Прев. Гет-Каллсин], использовал [от Гет-Коллс] в качестве приманки и заманил [Прев-Гет-Килл] в ловушку, где пилоты [от имени прев. Гет-Гет] могли нырять на [Прев. Гет-Звук] величественный] отряд великих героев [Прев. Гет-Коллсиг]. [От Гет-Коллс] использовал [от Гет-Сам] в качестве приманки и заманил [Прев. Гет-Адъев] летчик, который скачался с небесных лы, они опасают за собой."
 ace_killed_other_ace.1.a: "Победа будет вспоминать!"

 aces_killed_each_other.1.t: "[Отполняй имя Аллаха]"
 aces_killed_each_other.1.d: "В ходе последней миссии наш знаменитый [от GetAce Type] Ace [от.Gewner.GetAduction] оказался в длительной битве с опасным пилотом, [Прев.GetCallsign], находясь на низком уровне с боеприпасами и не имея возможности убежать, [от GetCallsign] спустился через огонь с [Prev.Owner.Getaductive] самолетов и начал бить [Prev.GetCallsign]. {Оба [от GetCallsign] и [Prev.GetCallsign] были замечены в виде кусочков, которые спускались в огонь из [Prev.Owner.Aduction Region]. ~ Несмотря на некоторое утешение, что угроза [Prev.Owner.GetCallsign], [Prev.GetCallsign] больше не будет беспокоить нас, мы потеряли ценную общественную фигуру и вдохновение для всех [от. Owner.Get.Aduction."
 aces_killed_each_other.1.d_major: "В ходе последней миссии наш знаменитый [от GetAce Type] закончился продолжительной борьбой с опасным пилотом, [Прев.GetllName]. Находясь низко на боеприпасах и не имея возможности убежать, маневр [от GetCallsign] [от GetHerH] через огонь от [Прев.Owner.GetAdgining] самолётов и переходя к [Prev.GetCallsign]. ~Бута [от GetCallsign] и [Prev.GetCallsign] [Prev.GetCler] [Prev.GetingShort] были замечены в кусках над [избытком] [от Get Mission Region]. ~, хотя это маленькое утешение, что угроза [Prev.Owner.Adign] больше не будет для нас неприятной, мы потеряли публичную фигуру и вдохновение для всех."
 aces_killed_each_other.1.a: "Тем не менее, для нас это большая потеря."

 country_capitulated.0.t: "[Звонок. Найти] капитулировал"
 country_capitulated.0.d_positive_both_no_faction: "[От. Гетт-руководитель] объявил, что трусливый народ больше не выдержал давления со стороны подавляющего присутствия [от него] сил по всей стране. [Гот-гет-аппитивное] правительство решило покинуть страну и отправиться в изгнание. Их основные силы капитулировали, и [от Гет-Нам-Дефа] теперь контролируют их родные места."
 country_capitulated.0.d_positive_prev_no_faction: "[От. Гетт-руководитель] объявил, что трусливый народ больше не выдержал давления со стороны подавляющего присутствия [от него] сил по всей стране. [Гот-гет-аппитивное] правительство решило покинуть страну и отправиться в изгнание. Их основные силы капитулировали, и [от гет-нам-дефа] теперь контролируют их родную территорию."
 country_capitulated.0.d_positive_prev_faction: "[От. Гетт-руководитель] объявил, что трусливый народ больше не выдержал давления со стороны подавляющего присутствия [от него] сил по всей стране. [Гот-гет-аппитивное] правительство решило покинуть страну и отправиться в изгнание. Их основные силы капитулировали, и [от гет-нам-дефа] теперь контролируют их родную территорию."
 country_capitulated.0.d_negative_both_no_faction: "[Root.Get Header] объявил, что [Руководитель] не может более выдержать давление со стороны оккупантов [от.Getaductive], совершающих трагедию по всей стране. Правительство [Root.GetAdigitive] попало в изгнание. Их основные силы капитулировали, и [от GetNameDef] теперь контролируют их родные районы."
 country_capitulated.0.d_negative_prev_no_faction: "* [Root.Get Header] объявил, что народ [Root.Getaductive] больше не может выдержать давления со стороны оккупационных сил [от.Getaductive], совершающих трагедию по всей стране. [Root.Getaductive] правительство попало в изгнание. Их основные силы капитулировали, и [от GetNameDef] теперь контролируют их родную территорию.~ Хотя война против [от GetNameDef] продолжается, это прискорбная неудача для всех [Root.GetFaction Name]."
 country_capitulated.0.d_negative_prev_faction: "[Root.Get Header] объявил, что [Руководитель] больше не может выдержать давления со стороны оккупантов [от. Get.Get.Get Headutioner], совершающих траверзию по всей стране. Правительство [Root.Get Adquesty] попало в изгнание. Их основные силы капитулировали, и [от GetNameDef] теперь контролируют их родной район."
 country_capitulated.0.d_neutral_both_no_faction: "~Несмотря на то, что борьба между [от GetName] и [от GetName] закончилась, [от GetNameDef] все еще находится в состоянии полной войны, и боевые действия продолжаются в другом месте."
 country_capitulated.0.d_neutral_prev_no_faction: "Правительство [Root.GetAditive] попало в изгнание, и их основные силы переселились к [от.GetNameDef], который теперь контролирует их родную территорию. ~ ~ На борьбу в [Root.GetName] была лишь небольшой частью конфликта. Война между [от. GetNameDef] и тем, что осталось [Root.GetFactionName] продолжается в другом месте."
 country_capitulated.0.d_neutral_prev_faction: "~ Направленное правительство попало в изгнание, и их основные силы переселились в [от. GetNameDef], который теперь контролирует их родную территорию. ~ На борьбу между [от. GetNameDef] и [Root.GetNameDef] была лишь небольшой частью конфликта. Война между [от. GetFactionName] и тем, что осталось [Root.GetFactionName] продолжается в другом месте."
 country_capitulated.0.d_positive_collab_diff_ideology: "[Root.GetNameDef] объявили о своей полной капитуляции [от.GetNameDef]. [От.Get Aductive] силы вместе с рядом независимых [Root.GetAdigitive] [от.GetRulningIdeology] заставили [Root. Get Header] и его правительство покинуть страну, поскольку было создано новое правительство, чтобы править [Root.GetNameDef] в сотрудничестве с [от GetNameDef]. [От. Get Header] отметил, что это взаимное соглашение приведет к новой эпохе процветания и сотрудничества [Root.GetNameDef]. [Root. Get Header] ответил, что даже в изгнании он будет продолжать бороться за [Root.GetNameDef] и поддерживать все усилия сопротивления на своей родине."
 country_capitulated.0.d_positive_collab_invaded_same_ideology: "[Root.GetNameDef] объявил о своей полной капитуляции [от GetNameDef]. Ряд [Root.Getaditive] граждан, недовольных брендом [от GetRulingIdeology Noun], доставленным [от Root.GetNameDef] [от Root.Get Heet Headgeter], присоединились к солдатам [от Get Adquestive], которые отстранили его от власти и сформировали новое правительство под руководством [от GetNameDef]. [От Get. Get. Geter] отметил, что это взаимное соглашение приведет к новому эпохе процветания и сотрудничества [от GetNameDef] / /[Root. Get Heeader], заявив, что [от Get. Geet Header] не является правдой [от GetRulingIdef] и даже в изгнании он будет продолжать бороться за [от Goot. GetNameDef] и поддерживать все усилия сопротивления на своей родине."
 country_capitulated.0.d_negative_collab_diff_ideology: "[Root.GetNameDef] объявил о своей полной капитуляции [от. GetNameDef]. Очевидно, что снисходительность правительства к внутренним [от GetRulingIdeology] была фактором, способствующим падению [от Root.GetName], так как [Root. GetFaschist Header] был ввергнут в должность, чтобы править страной во имя режима [от. Get Header]. n[Root. Get Header] утверждает, что это не конец [Root. Get Adquctive] суверенитета и что правительство будет поддерживать все усилия сопротивления, даже когда оно будет изгнано с их родины."
 country_capitulated.0.a: "Отличные новости!"
 country_capitulated.0.b: "Сейчас тёмные времена."
 country_capitulated.0.c: "Неопределенные времена"
