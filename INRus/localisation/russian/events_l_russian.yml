  ace_promoted.1.t: "Новый ас-пилот"
  ace_promoted.2.t: "Появился новый ас"
  ace_promoted.1.d: "Мало кто рискует так, как храбрые пилоты ВВС [Root.GetAdjectiveWithFlag]. [From.GetName] [From.GetSurname], опытный пилот с позывным [From.GetCallsign], отличил[From.GetSheHe|G]ся не только тем, что вернул[From.GetSheHe|G]сь живым из недавней миссии над регионом [From.GetMissionRegion], но и выжил в нескольких решающих боях.\n\n[From.GetName] стал[From.GetSheHe|G] сияющим примером доблести [Root.GetAdjective], и известие о [From.GetHerHis] недавнем повышении широко разошлось в прессе. Хотя народ и считает войну скорее адом, чем славой, многие рады видеть, что у нас всё ещё есть герои."
  ace_promoted.1.d_major: "Мало кто рискует так, как храбрые пилоты ВВС [Root.GetAdjectiveWithFlag]. [From.GetName] [From.GetSurname], опытный пилот с позывным [From.GetCallsign], отличил[From.GetSheHe|G]ся не только тем, что вернул[From.GetSheHe|G]сь живым, но и великолепным командованием эскадрильей [From.GetWing]. Недавно [From.GetName] участвовал[From.GetSheHe|G] в миссии над регионом [From.GetMissionRegion] и сыграл[From.GetSheHe|G] ключевую роль в успехе этой важнейшей операции.\n\n[From.GetName] стал[From.GetSheHe|G] сияющим примером доблести [Root.GetAdjective], и известие о [From.GetHerHis] недавнем повышении широко разошлось в прессе. Хотя народ и считает войну скорее адом, чем славой, многие рады видеть, что у нас всё ещё есть герои."
  ace_promoted.1.a: "Кто рискует, тот побеждает."

  ace_died.1.t: "[From.GetCallsign] сбит над регионом [From.GetMissionRegion]"
  ace_died.1.d: "Один из самых известных [From.GetAceType]-асов страны [From.Owner.GetName] — [From.GetFullName] — погиб при исполнении служебного долга во время миссии над регионом [From.GetMissionRegion]. К сожалению, поскольку [From.GetSheHe] давным-давно стал[From.GetSheHe|G] публичной фигурой, гибель пилота с позывным [From.GetCallsign] сильно деморализует людей, равнявшихся на него.\n\nХотя мы хотели бы скрыть это событие от общественности, отсутствие [From.GetName] на публике вскоре вызвало бы подозрения. В конечном счёте, [From.GetHerHis] смерть — лишь ещё одна страница легенды, которая, мы надеемся, переживет наши текущие невзгоды."
  ace_died.1.d_major: "Один из самых известных [From.GetAceType]-асов страны [From.Owner.GetName] — [From.GetFullName] — погиб при исполнении служебного долга. Пилоты, вернувшиеся с задания, сообщили, что видели, как [From.GetHerHis] крыло [From.GetWingShort] объятое пламенем падало над регионом [From.GetMissionRegion] под плотным огнем противника. К сожалению, поскольку [From.GetSheHe] давным-давно стал[From.GetSheHe|G] публичной фигурой, гибель пилота с позывным [From.GetCallsign] сильно деморализует людей, равнявшихся на него.\n\nХотя мы хотели бы скрыть это событие от общественности, отсутствие [From.GetName] на публике вскоре вызвало бы подозрения. В конечном счёте, [From.GetHerHis] смерть — лишь ещё одна страница легенды, которая, мы надеемся, переживет наши текущие невзгоды."
  ace_died.1.a: "Живая легенда была бы лучше."

  ace_killed_by_ace.1.t: "[From.GetFullName] сбит пилотом [Prev.GetCallsign]"
  ace_killed_by_ace.1.d: "Пилоты, вернувшиеся из региона [From.GetMissionRegion], сообщают, что эскадрилья самолётов [Prev.Owner.GetAdjective], ведомая печально известным асом [Prev.GetCallsign], сосредоточила все силы на преследовании пилота [From.GetCallsign]. Увернувшись от нескольких очередьми и сбив несколько вражеских машин, [From.GetCallsign] в итоге уступил[From.GetSheHe|G] пилоту [Prev.GetCallsign], который переиграл [From.GetHerHim] и точным попаданием пробил топливные баки. Самолёт, который пилотировал[From.GetSheHe|G] [From.GetName] [From.GetSurname], загорелся и по спирали рухнул над регионом [From.GetMissionRegion].\n\n[From.GetFullName] проявил[From.GetSheHe|G] великое мужество за время службы. Потеря этого национального героя — тяжёлый удар по ВВС [From.Owner.GetAdjective] и по всей нашей нации. Осознание того, что пока мы скорбим, [Prev.Owner.GetName] чествует [Prev.GetFullName] как героя, делает эту трагедию ещё горше."
  ace_killed_by_ace.1.d_major: "Пилоты, вернувшиеся из региона [From.GetMissionRegion], сообщают, что эскадрилья самолётов [Prev.Owner.GetAdjective], ведомая печально известным асом [Prev.GetCallsign], сосредоточила все силы на преследовании пилота [From.GetCallsign]. Сбив несколько вражеских машин и увернувшись от нескольких очередей, [From.GetCallsign] в итоге уступил[From.GetSheHe|G] пилоту [Prev.GetCallsign] на [Prev.GetWingShort], который переиграл [From.GetHerHim] и точным попаданием пробил топливные баки. [From.GetWingShort], который пилотировал[From.GetSheHe|G] [From.GetName] [From.GetSurname], загорелся и по спирали рухнул над регионом [From.GetMissionRegion].\n\n[From.GetFullName] проявил[From.GetSheHe|G] великое мужество за время службы. Потеря этого национального героя — тяжёлый удар по ВВС [From.Owner.GetAdjective] и по всей нашей нации. Осознание того, что пока мы скорбим, [Prev.Owner.GetName] чествует [Prev.GetFullName] как героя, делает эту трагедию ещё горше."
  ace_killed_by_ace.1.a: "Ужасная loss для всех нас."

  ace_killed_other_ace.1.t: "[From.GetFullName] сбил аса [Prev.GetCallsign]"
  ace_killed_other_ace.1.d: "Наша последняя миссия над регионом [From.GetMissionRegion] обернулась грандиозным успехом для ВВС [From.Owner.GetAdjective]. Согласно отчётам, [From.GetFullName] совершил[From.GetSheHe|G] настоящий подвиг, перехитрив пилота [Prev.Owner.GetAdjective] по имени [Prev.GetName] [Prev.GetSurname] (позывной [Prev.GetCallsign]). [From.GetCallsign] использовал[From.GetSheHe|G] себя в качестве приманки и заманил[From.GetSheHe|G] [Prev.GetCallsign] в ловушку, дав возможность ВВС [From.Owner.GetAdjective] атаковать эскадрилью противника с высоты. Затем [From.GetCallsign] сманеврировал[From.GetSheHe|G] и одной точной очередью отправил самолет [Prev.GetCallsign] к земле над регионом [From.GetMissionRegion].\n\n[Prev.GetFullName] был грозным врагом, на чьей совести немало жизней наших пилотов. Это великая победа."
  ace_killed_other_ace.1.d_major: "Наша последняя миссия над регионом [From.GetMissionRegion] обернулась грандиозным успехом для ВВС [From.Owner.GetAdjective]. Согласно отчётам, [From.GetFullName] совершил[From.GetSheHe|G] настоящий подвиг, перехитрив пилота [Prev.Owner.GetAdjective] по имени [Prev.GetName] [Prev.GetSurname] (позывной [Prev.GetCallsign]). [From.GetCallsign] использовал[From.GetSheHe|G] себя в качестве приманки и заманил[From.GetSheHe|G] [Prev.GetCallsign] в ловушку, дав возможность ВВС [From.Owner.GetAdjective] атаковать эскадрилью противника с высоты. Затем [From.GetCallsign] сманеврировал[From.GetSheHe|G] и одной точной очередью отправил самолет [Prev.GetCallsign] к земле над регионом [From.GetMissionRegion].\n\n[Prev.GetFullName] был грозным врагом, на чьей совести немало жизней наших пилотов. Это великая победа."
  ace_killed_other_ace.1.a: "Победа, которую [From.Owner.GetName] запомнит навсегда!"

  aces_killed_each_other.1.t: "[From.GetFullName] погибает в бою"
  aces_killed_each_other.1.d: "Во время недавней миссии наш знаменитый [From.GetAceType]-ас [From.GetFullName] вступил в затяжной бой с грозным вражеским асом [Prev.GetFullName]. Израсходовав боезапас и не имея возможности оторваться, [From.GetCallsign] прорвал[From.GetSheHe|G]ся сквозь плотный огонь [Prev.Owner.GetAdjective] и пошёл на таран самолёта [Prev.GetCallsign].\nОба самолёта обломками рухнули над регионом [From.GetMissionRegion].\n\nСлабым утешением служит то, что вражеский ас [Prev.GetCallsign] больше не причинит нам вреда, однако мы потеряли вдохновляющего героя и выдающегося пилота."
  aces_killed_each_other.1.d_major: "Во время недавней миссии наш знаменитый [From.GetAceType]-ас [From.GetFullName] вступил в затяжной бой с грозным вражеским асом [Prev.GetFullName]. Израсходовав боезапас и не имея возможности оторваться, [From.GetCallsign] направил[From.GetSheHe|G] свой [From.GetWingShort] сквозь огонь самолётов [Prev.Owner.GetAdjective] и пошёл на таран [Prev.GetCallsign].\nИ [From.GetWingShort] пилота [From.GetCallsign], и [Prev.GetWingShort] пилота [Prev.GetCallsign] рухнули обломками над регионом [From.GetMissionRegion].\n\nСлабым утешением служит то, что вражеский ас [Prev.GetCallsign] больше не причинит нам вреда, однако мы потеряли вдохновляющего героя и выдающегося пилота."
  aces_killed_each_other.1.a: "Тем не менее, это огромная утрата."

  country_capitulated.0.t: "[Root.GetName] капитулирует"
  country_capitulated.0.d_positive_both_no_faction: "\n[From.From.GetLeader] объявляет, что трусливая нация [Root.GetAdjective] больше не в силах сдерживать напор превосходящих сил [From.From.GetAdjective] по всей стране. Правительство [Root.GetAdjective] бежало из страны и отправилось в изгнание. Их основные силы капитулировали, и [From.From.GetNameDef] теперь полностью контролирует их национальные территории.\nХотя война продолжается в других регионах, это великая победа для [From.From.GetNameDef]."
  country_capitulated.0.d_positive_prev_no_faction: "\n[From.From.GetLeader] объявляет, что трусливая нация [Root.GetAdjective] больше не в силах сдерживать напор превосходящих сил [From.From.GetAdjective] по всей стране. Правительство [Root.GetAdjective] бежало из страны и отправилось в изгнание. Их основные силы капитулировали, и [From.From.GetNameDef] теперь полностью контролирует их национальные территории.\nХотя война против остатков альянса [Root.GetFactionName] продолжается в других регионах, это великая победа для [From.From.GetNameDef]."
  country_capitulated.0.d_positive_prev_faction: "\n[From.From.GetLeader] объявляет, что трусливая нация [Root.GetAdjective] больше не в силах сдерживать напор превосходящих сил [From.From.GetAdjective] по всей стране. Правительство [Root.GetAdjective] бежало из страны и отправилось в изгнание. Их основные силы капитулировали, и [From.From.GetNameDef] теперь полностью контролирует их национальные территории.\nХотя война против остатков альянса [Root.GetFactionName] продолжается в других регионах, это великая победа для всех членов альянса [From.From.GetFactionName]."
  country_capitulated.0.d_negative_both_no_faction: "\n[Root.GetLeader] объявляет, что нация [Root.GetAdjective] больше не может выдерживать натиск оккупационных войск [From.From.GetAdjective], творящих бесчинства по всей стране. Правительство [Root.GetAdjective] отправляется в изгнание. Их основные силы капитулировали, и [From.From.GetNameDef] контролирует их национальные территории.\nНесмотря на это тяжёлое поражение, война против [From.From.GetNameDef] далека от завершения."
  country_capitulated.0.d_negative_prev_no_faction: "\n[Root.GetLeader] объявляет, что нация [Root.GetAdjective] больше не может выдерживать натиск оккупационных войск [From.From.GetAdjective], творящих бесчинства по всей стране. Правительство [Root.GetAdjective] отправляется в изгнание. Их основные силы капитулировали, и [From.From.GetNameDef] контролирует их национальные территории.\nХотя война против [From.From.GetNameDef] продолжается, это печальный удар для всех членов альянса [Root.GetFactionName]."
  country_capitulated.0.d_negative_prev_faction: "\n[Root.GetLeader] объявляет, что нация [Root.GetAdjective] больше не может выдерживать натиск оккупационных войск [From.From.GetAdjective], творящих бесчинства по всей стране. Правительство [Root.GetAdjective] отправляется в изгнание. Их основные силы капитулировали, и [From.From.GetNameDef] контролирует их национальные территории.\nХотя война против [From.From.GetNameDef] и остальной части альянса [From.From.GetFactionName] продолжается, это печальный удар для всех членов альянса [Root.GetFactionName]."
  country_capitulated.0.d_neutral_both_no_faction: "\nПравительство [Root.GetAdjective] отправилось в изгнание, а основные силы капитулировали перед [From.From.GetNameDef], удерживающим контроль над их территорией.\n\nХотя столкновения между [From.From.GetName] и [Root.GetName] завершены, [From.From.GetNameDef] всё ещё находится в состоянии тотальной войны, и бои продолжаются в других регионах."
  country_capitulated.0.d_neutral_prev_no_faction: "\nПравительство [Root.GetAdjective] отправилось в изгнание, а основные силы капитулировали перед [From.From.GetNameDef], удерживающим контроль над их территорией.\n\nКонфликт в [Root.GetName] был лишь малым эпизодом войны. Противостояние между [From.From.GetNameDef] и остатками альянса [Root.GetFactionName] продолжается в других регионах."
  country_capitulated.0.d_neutral_prev_faction: "\nПравительство [Root.GetAdjective] отправилось в изгнание, а основные силы капитулировали перед [From.From.GetNameDef], удерживающим контроль над их территорией.\n\nКонфликт между [From.From.GetNameDef] и [Root.GetNameDef] был лишь малым эпизодом войны. Противостояние между альянсом [From.From.GetFactionName] и остатками альянса [Root.GetFactionName] продолжается в других регионах."
  country_capitulated.0.d_positive_collab_diff_ideology: "\nГосударство [Root.GetNameDef] объявило о полной капитуляции перед [From.From.GetNameDef]. Войска [From.From.GetAdjective] совместно с рядом местной оппозиции [Root.GetAdjective], поддерживающей идеологию ([From.From.GetRulingIdeology]), вынудили лидера [Root.GetLeader] и его правительство отправиться в изгнание. Сформировано новое правительство для управления [Root.GetNameDef] в сотрудничестве с [From.From.GetNameDef]. [From.From.GetLeader] отметил, что эти договоренности приведут к эпохе процветания и сотрудничества.\n[Root.GetLeader] заявил в ответ, что даже в изгнании он продолжит борьбу за [Root.GetNameDef] и будет поддерживать сопротивление на родине."
  country_capitulated.0.d_positive_collab_invaded_same_ideology: "\nГосударство [Root.GetNameDef] объявило о полной капитуляции перед [From.From.GetNameDef]. Граждане [Root.GetAdjective], недовольные идеологическим курсом [From.From.GetRulingIdeologyNoun], приведённым лидером [Root.GetLeader], присоединились к солдатам [From.From.GetAdjective], чтобы отстранить его от власти и сформировать новое правительство под руководством [From.From.GetNameDef]. [From.From.GetLeader] отметил, что это соглашение принесёт новую эпоху процветания и сотрудничества.\n[Root.GetLeader] заявил, что [From.From.GetLeader] — не настоящий [From.From.GetRulingIdeology], и пообещал продолжать борьбу из изгнания."
  country_capitulated.0.d_negative_collab_diff_ideology: "\nГосударство [Root.GetNameDef] объявило о полной капитуляции перед [From.From.GetNameDef]. Очевидно, что попустительство правительства к сторонникам идеологии ([From.From.GetRulingIdeology]) внутри страны стало одним из факторов падения [Root.GetName]. У власти поставлен новый правитель, пришедший к руководству от имени режима, который возглавляет [From.From.GetLeader].\n[Root.GetLeader] утверждает, что это не конец суверенитета нации [Root.GetAdjective], и правительство в изгнании поддержит любые движения сопротивления."
  country_capitulated.0.a: "Отличные новости!"
  country_capitulated.0.b: "Это тёмные времена."
  country_capitulated.0.c: "Наступили неопределенные времена."