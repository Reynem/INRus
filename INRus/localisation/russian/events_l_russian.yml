 ace_promoted.1.t: "Пропаганда пилота &lt; &lt; Эйс &gt; &gt;"
 ace_promoted.2.t: "Появился дикий туз"
 ace_promoted.1.d: "Мало кто берет на себя такие же риски, как храбрые пилоты военно-воздушных сил. [От GetName] [От GetSurname], опытный пилот, известный под позывным [от GetCallsign], отметил [от GetHerSelfHimims] не только возвращение живым после недавней миссии [от Mission Region], но и живя в значительных победах во многих критических встречах. ~n/nHeldd как яркий пример [Root. Getaductive] храбрости [от GetName], [от GetName] было высоко опубликовано. Несмотря на то, что люди могут считать войну более адом, чем славой, многие рады видеть, что все еще есть герои, чтобы сплотиться позади."
 ace_promoted.1.d_major: "Немногие берут на себя столько рисков, сколько храбрые пилоты военно-воздушных сил. [От GetName] [От GetSurnam], опытный пилот, известный под позывным [от.GetCallsign], проявил [от GetHerSelfHimims] не только в возвращении живым, но и в пилотировании [от GetHerHis] [от GetHerHis] с огромными навыками. Недавно [от GetName] был на задании [от.MissionRegion] и сыграл важную роль в успехе этой критической встречи. ~ / nnHeld вверх как яркий пример [Root. Get Adquctive] храбрости [от GetName], недавняя реклама [от GetName] была высоко оценена. Хотя люди могут рассматривать войну как нечто большее, чем слава, многие рады видеть, что все еще есть герои, чтобы сплощаться впереди."
 ace_promoted.1.a: "Кто посмел, тот выиграл."

 ace_died.1.t: "Убийство из-за того, что произошло."
 ace_died.1.d: "Один из самых известных тузов [от GetAce Type], [от Полной Нации], попал в пламя при исполнении служебных обязанностей, во время миссии [от Get Mission Region]. К сожалению, поскольку [от GetSheHe] уже давно является публичной фигурой, гибель [от GetCallsign] серьезно деморализует многих людей, которые смотрели на [от GetHerHim]. Несмотря на то, что мы хотели бы, чтобы был способ скрыть это событие от народа, отсутствие публичного представления [от GetSheHe] вскоре вызовет подозрения. В конечном счете, смерть [от GetHerHis] является еще одной частью легенды, которая, как мы надеемся, будет жить в течение долгого времени в наших текущих проблемах."
 ace_died.1.d_major: "Один из самых известных тузов [от GetAce Type], после того как он устроил огонь противника, спустился по службе. Пилоты, возвращающиеся из миссии, обнаружили, что [от GetHerHy] [от GetHerHyn's [от GetWingShort] сгорел в огне после сильного пожара. К сожалению, поскольку [от GetSheHe] уже давно является публичной фигурой, кончина смерти [от GetCallsign] серьезно деморализует многих людей, которые, как мы надеемся, будут жить в течение долгого времени."
 ace_died.1.a: "Живая легенда еще лучше."

 ace_killed_by_ace.1.t: "[От имени] Застрелен [Преподобным. Гет-Коллсинтом]"
 ace_killed_by_ace.1.d: "Пилоты, возвращающиеся из [от GetMission Region] сообщают, что эскадрилья [Prev.Owner.Getadigit], возглавляемая печально известным [Prev.GetCallsign], сосредоточилась на погоне [от GetCallsign] и разорвала топливные баки с чистым ударом. [Prev.Owner.GetAdgive] [От GetSurning], и сбила несколько вражеских самолетов, [от GetCallsign] была погружена [Prev.GetCallsign], который, как сообщается, перехитрил [от GetHerim] и разорвал топливные баки с чистым ударом. [От GetName] [от GetSurname] [от GetSurname] [от GetSurn] [от GetSurn] поджигалась огнем и спиралась над [от GetMis.Get Misssioner.O.ODestinger."
 ace_killed_by_ace.1.d_major: "Пилоты, возвращающиеся из [от GetMission Region] сообщают, что эскадрилья [Prev.Owner.Getadigit], возглавляемая печально известными [Prev.GetCallsign], сосредоточилась на погоне [от GetCallsign], который, согласно сообщениям, вышел из-под контроля [от GetHerHim] и разорвал топливные баки с чистым ударом. [От GetName] [от GetSurn] [от GetSurn] [от GetCallsign], был погружен в огонь и скатился над [от Misssion Region], в то время как, по сообщениям, он сильно испортил [от GetHerHim] и разорвал топливные баки с чистым ударом. [от GetNam] [от GetSurn] [от GetSurn] [от GetSurn] [от GetSurn] [от Greewayn] [от Gragerger ther], ther ther ther ther ther th th ther ther ther th a a ther ther ther ther ther ther ther ther a a a a a a a a a a a a a a a a a a dat a dat a a ther a a a a a a gener a a a ther a dat a dat a th a ther a da dat a dat a dat a dat a gener. a dat a dat a dat a dat a dat a dat a dat a a a a a a a a a a a a gen a a a a a a a a a a a a a a a a a a a a a a a a a a a a a a a a a a a a a a a a a a a a a a a a a a a a a a a gen a a a a gen a a a a a a gen a gen a gen a gen"
