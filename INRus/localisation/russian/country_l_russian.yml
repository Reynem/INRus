 AIR_EXPERIENCE_GAIN_TRAINING: "От §HPilot Exercises §!: $VALUE |=+3$ ежедневно"
 AIR_EXPERIENCE_DESC: "Когда ваш самолет вовлекает врага в миссии или практикуется в упражнениях HPilot, вы получаете опыт в воздухе. Это означает, что вы можете получить опыт работы с воздухом, когда ваши крылья волос §§! Вступайте в бой или если у вас есть §HLend-Leased§! Оборудование для войн ваших союзников.\nНекоторые §HNational Focuses §! дайте дополнительный опыт и некоторые §HMinisters §! Air Experience используется для разработки лучших вариантов существующих самолетов."
