  EXPERIENCE_FROM_ATTACHES: "Наши военные атташе в странах ($COUNTRIES$) приносят нам $XPSHARE$ опыта."
  RULES_TITLE: "Действующие §Hправила§!:"
  RULES_DESC: "Правила вашей страны зависят от вашей идеологии, идеологии вашей фракции и национальных духов."
