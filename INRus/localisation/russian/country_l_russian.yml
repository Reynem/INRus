l_russian:
  NATIONAL_UNITY: "Национальное единство"
  STABILITY: "Стабильность"
  WAR_SUPPORT: "Поддержка войны"
  NATIONAL_UNITY_DESC: "Национальное единство отражает готовность верхов вести войну до победного конца. Чем выше это значение, тем дольше они будут сражаться, прежде чем задумаются о капитуляции."
  STABILITY_DESC: "Стабильность отражает поддержку текущего правительства народом. Высокая стабильность облегчает проведение политических реформ и способствует бесперебойной работе экономики."
  WAR_SUPPORT_DESC: "Поддержка войны отражает готовность населения вести войну до победного конца. Принятие многих законов и подготовка страны к войне требуют высокой поддержки войны."
  STABILITY_WAR_FACTOR: "Состояние войны: $VALUE|+2%$"
  STABILITY_POPULARITY_FACTOR: "Популярность правящей партии: $VALUE|=+2%$"
  STABILITY_EFFECT_TITLE: "\n§HЭффекты от текущей стабильности:§!\n"
  STABILITY_PROPAGANDA: "£operative_mission_icons_small|8£ Зарубежная пропаганда: $VALUE|+=2%$"
  WAR_SUPPORT_EFFECT_TITLE: "\n§HЭффекты от текущей поддержки войны:§!\n"
  WAR_SUPPORT_AT_OFFENSIVE_WAR: "Наступательная война: $VALUE|+=2%$"
  WAR_SUPPORT_AT_DEFENSIVE_WAR: "Оборонительная война: $VALUE|+=2%$"
  WAR_SUPPORT_TENSION: "Мировая напряженность: $VALUE|+=2%$"
  WAR_SUPPORT_BEING_BOMBED: "Вражеские бомбардировки: $VALUE|+=2%$"
  WAR_SUPPORT_INTERCEPTION: "Перехват бомбардировщиков: $VALUE|+=2%$"
  WAR_SUPPORT_HEROES_BEING_KILLED:1 "Боевые потери: $VALUE|+=2%$"
  WAR_SUPPORT_CONVOYS_BEING_RAIDED:1 "Налеты на конвои: $VALUE|+=2%$"
  WAR_SUPPORT_PROPAGANDA: "£operative_mission_icons_small|8£ Зарубежная пропаганда: $VALUE|+=2%$"
  POLITICAL_POWER: "Политическая власть"
  POLITICAL_POWER_DESC:1 "Политическая власть отражает способность руководства страны управлять государством. Тратьте политическую власть на изменение §Hзаконов§!, назначение §Hполитических советников§! и §Hвоенного командования§!, управление §Hисследованиями и производством§!, а также на принятие §Hрешений§! и §Hдипломатические действия§!."
  MANPOWER: "Людские ресурсы"
  SERVICE_MANPOWER:1 "£manpower_texticon Требуется людей:"
  SERVICE_MANPOWER_DESC: "Людские ресурсы, требуемые для обслуживания различной техники и поддержания её работоспособности."
  MAX_MANPOWER: "Макс. людских ресурсов:"
  EXILE_COUNTRY_NORMAL_MANPOWER_DAILY_GROWTH: "\nЕжедневный прирост от §Hлегитимности§!: $AMOUNT|H^$"
  MANPOWER_TOTAL: "Всего людских ресурсов: $MAX|0H$"
  MANPOWER_USAGE:2 "Свободные людские ресурсы: $FREE|2H$$EXILE$\nИспользовано людских ресурсов:\nАрмия: $ARMY|2H$\n - В поле: $FIELD|2H$\n - В обучении: $TRAINING|2H$\nАвиация: $AIR|2H$\nФлот: $NAVAL|2H$\nГарнизоны: $GARRISON|2H$"
  MANPOWER_USAGE_FOREIGN_GARRISON: "Зарубежные гарнизоны: $GARRISON|^2H$"
  MANPOWER_CURRENT: "Всего людских ресурсов: $TOTAL|^2H$\n$PERC|2%H$ от доступного национального населения ($ELIGIBLE|^H$)"
  MANPOWER_CURRENT_MOBILIZATION: "Всего людских ресурсов: $TOTAL|^2H$\n$PERC|2%H$ (около $MOB|+3%$ мобилизуется в день) от доступного национального населения ($ELIGIBLE|^H$)"
  MANPOWER_NON_CORE: "$NC_PERC|3%H$ от доступного ненационального населения ($NC_ELIGIBLE|^H$)"
  MANPOWER_GROWTH: "Ежемесячный прирост в регионах:§!\nПризывное: $RECRUITABLE|^G$\nГражданское: $CIVILIAN|^G$"
  MANPOWER_VALUE:3 "$USAGE$\n\n$CURRENT$\n$GROWTH$"
  MANPOWER_DESC:1 "Людские ресурсы формируются из §Hпризывного населения§! страны и оккупированных ею территорий, представляя мужчин и женщин, годных для службы в вооруженных силах. Примите более строгие §Hзаконы о призыве§!, чтобы расширить базу призывного населения и увеличить доступные людские ресурсы."
  MANPOWER_DIVISION: "Людские ресурсы дивизии"
  MANPOWER_DIVISION_DESC: "Количество солдат в этой §Hдивизии§!. При потерях в бою дивизия будет получать пополнения из общего резерва людских ресурсов вашей страны."
  MANPOWER_DIVISION_SIZE_DESC: "§TЭта §Hдивизия§! насчитывает $AMOUNT|G$ чел. При потерях в бою дивизия будет получать пополнения из общего резерва людских ресурсов вашей страны."
  MANPOWER_DIVISION_SIZE_BREAKDOWN_DESC: "§TЭта §Hдивизия§! насчитывает $AMOUNT|G$ чел. Людские ресурсы предоставляют:§!"
  MANPOWER_GARRISON_BREAKDOWN_ENTRY: "$NUMBER|H$ от $COUNTRY|H$"
  MANPOWER_BREAKDOWN_ENTRY: "$FLAG$ $COUNTRY|H$: $CURRENT|H$/$MAX|H$"
  MANPOWER_BREAKDOWN_ENTRY_FULL: "$FLAG$ $COUNTRY|H$: $CURRENT|G$/$MAX|G$"
  MANPOWER_SHIP: "Экипаж корабля"
  MANPOWER_SHIP_DESC: "§TЭтому §Hкораблю§! требуется $AMOUNT|G$ чел. экипажа."
  MANPOWER_RAILWAY_GUN: "Экипаж железнодорожного орудия"
  MANPOWER_RAILWAY_GUN_DESC: "Для обслуживания требуется $AMOUNT|G$ чел."
  MANPOWER_AIRWING: "Экипаж авиакрыла"
  MANPOWER_AIRWING_DESC: "Для обслуживания требуется $AMOUNT|G$ чел."
  CONSCRIPTION_TOTAL_FACTOR_EXTRA_DESC: "\nОбщее количество людских ресурсов изменено на $VAL|-%0$ из-за:\n"
  EQUIPMENT_DIVISION:1 "Оснащенность снаряжением"
  EQUIPMENT_DIVISION_DESC:1 "Снаряжение, используемое дивизией (в процентах от общей потребности)."
  DIVISION_IN_TEMPLATE_TRANSFER: "В настоящее время дивизия переформировывается из шаблона $OLD|H$ в $NEW|H$. Переформирование завершится, когда будет доставлено первое необходимое снаряжение, а старое будет возвращено на склады."
  MANPOWER_MONTHLY_TOTAL:2 "Ежемесячный прирост населения: $VALUE|^+1$ ($PERC|2%H$)\nОбщий прирост населения: $MAX|^2H$ ($FACTOR|2%H$ от общей численности населения)\n\nБазовый темп роста: $RATIO|%H$"
  MANPOWER_MODIFIER_APPLIED: "Действующие модификаторы:\n$MODIFIERS$"
  MANPOWER_MONTHLY_BASE: "Базовое значение: $VALUE|*Y0$"
  MANPOWER_MONTHLY_TECH_FACTOR: "От технологий: $VALUE|+%$"
  MANPOWER_PROVINCE_TOOLTIP: "Прирост в провинции: $VAL|*Y$"
  INDUSTRIAL_CAPACITY: "Промышленность"
  INDUSTRIAL_CAPACITY_DESC:1 "Фабрики и заводы являются основой военно-промышленного потенциала страны. §HВоенные заводы§! производят снаряжение для армии и авиации, §HВерфи§! строят и ремонтируют корабли для флота. §HФабрики§! строят и ремонтируют здания и инфраструктуру, а также используются для торговли."
  INDUSTRIAL_CAPACITY_DESC_OCCUPATION: "На количество фабрик, получаемых из оккупированных регионов, влияет ваша оккупационная политика."
  ARMY_EXPERIENCE: "Опыт армии"
  ARMY_EXPERIENCE_GAIN_TRAINING:1 "От §Hучений армии§!: $VALUE|=+3$ в день"
  ARMY_EXPERIENCE_DESC: "Вы получаете опыт армии, когда ваши войска используют снаряжение в бою. Это значит, что опыт растет, когда ваши §Hдивизии§! сражаются, или когда снаряжение, поставленное по §Hленд-лизу§!, используется в войнах ваших союзников. Также вы получаете опыт за счет проведения §Hучений армии§! с дивизиями (вплоть до уровня обучения $UNIT_TRAINING_LEVEL|Y$) и от некоторых §Hнациональных фокусов§! и §Hсоветников§!. Опыт армии необходим для создания и изменения шаблонов §Hдивизий§!."
  NAVY_EXPERIENCE: "Опыт флота"
  NAVY_EXPERIENCE_GAIN_TRAINING: "От §Hучений флота§!: $VALUE|=+3$ в день"
  NAVY_EXPERIENCE_DESC: "Вы получаете опыт флота, когда ваши корабли участвуют в боях и военно-морских учениях. Некоторые §Hнациональные фокусы§! и §Hсоветники§! дают дополнительный опыт флота.\n\nОпыт флота используется для создания улучшенных проектов кораблей."
  AIR_EXPERIENCE: "Опыт авиации"
  AIR_EXPERIENCE_GAIN_TRAINING: "От §Hучений авиации§!: $VALUE|=+3$ в день"
  AIR_EXPERIENCE_DESC: "Вы получаете опыт авиации, когда ваши самолеты вступают в бой во время выполнения заданий или участвуют в §Hучениях§!. Это значит, что опыт растет, когда ваши §Hавиакрылья§! сражаются, или когда самолеты, поставленные по §Hленд-лизу§!, используются союзниками.\nНекоторые §Hнациональные фокусы§! и §Hсоветники§! дают дополнительный опыт.\nОпыт авиации используется для создания улучшенных проектов самолетов."
  COMMAND_POWER: "Командный ресурс"
  COMMAND_POWER_DESC: "Командный ресурс используется для проведения различных военных операций и повышения генералов. Его можно потратить на разовые действия или зарезервировать для продолжительных операций. Прирост и максимальный запас командного ресурса могут быть увеличены за счет различных доктрин и национальных духов."
  CURRENT_COMMAND_POWER_TOPBAR: "Текущий командный ресурс: $VALUE|G1$"
  COMMAND_POWER_GAIN: "Дневной прирост: $VALUE|Y2$§!"
  MAX_COMMAND_POWER_TEXT:1 "Текущий максимум: $VALUE|Y0$"
  COMMAND_POWER_ALLOCATED:1 "Зарезервировано: $VALUE|R1$"
