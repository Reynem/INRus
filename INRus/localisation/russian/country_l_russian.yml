  AIR_EQUIPMENT_IN_USE:1 "Оснащенность самолетами"
  AIR_EQUIPMENT_IN_USE_DESC:1 "Количество используемых самолетов (в процентах от общей потребности авиакрыльев)."
  AIR_SERVICE_MANPOWER_DESC: "Военно-воздушным силам требуются людские ресурсы для поддержания боеспособности."
