 ARMY_EXPERIENCE_GAIN_TRAINING:1 "Из §HArmy Exercises §!: $VALUE |=+3$ ежедневно"
 ARMY_EXPERIENCE_DESC: "Поскольку ваше снаряжение используется в бою, вы получаете армейский опыт. Это означает, что вы можете получить армейский опыт, когда ваш §HDivisions § Вступайте в бой или если у вас есть §HLend-Leased§! Оборудование для войн ваших союзников. Вы также получаете опыт от проведения §Harmy Exercises §! с войсками, которые по крайней мере на уровне $UNIT TRAINING LEVEL | Y$ и от некоторых §H National Focuses §!. Некоторые министры! Опыт армии необходим для создания и изменения ваших шаблонов §HDivision."
