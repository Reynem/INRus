  COMMAND_POWER_TOOLTIP_AIR_MISSION_UNASSIGNED: "$MISSION_TYPE$ ($WING_NAME$)"
  MANPOWER_IN_USE: "Людские ресурсы в поле"
  MANPOWER_IN_USE_DESC: "Количество солдат, находящихся в поле. При потерях они будут получать пополнения из общего резерва людских ресурсов страны."
  EQUIPMENT_IN_USE:1 "Оснащенность снаряжением"
  EQUIPMENT_IN_USE_DESC:1 "Количество используемого снаряжения (в процентах от общей потребности всех дивизий)."
  MANPOWER_IN_USE_GARRISON: "Людские ресурсы в гарнизонах"
  MANPOWER_IN_USE_GARRISON_DESC: "Количество солдат, находящихся в гарнизонах. При потерях они будут получать пополнения из общего резерва людских ресурсов страны."
  EQUIPMENT_IN_USE_GARRISON:1 "Оснащенность гарнизонов снаряжением"
  EQUIPMENT_IN_USE_GARRISON_DESC:1 "Количество используемого гарнизонами снаряжения (в процентах от их общей потребности)."
  NAVY_EQUIPMENT_TOTAL:1 "Всего кораблей"
  NAVY_EQUIPMENT_TOTAL_DESC:1 "Общее количество кораблей во всех флотах и оперативных соединениях."
  NAVAL_SERVICE_MANPOWER_DESC: "Военно-морскому флоту требуются людские ресурсы для поддержания боеспособности."
  AIR_EQUIPMENT_TOTAL:1 "Всего самолетов"
