 NAVY_EXPERIENCE_DESC: "Поскольку ваши корабли используются в бою и в военно-морских учениях, вы получаете опыт военно-морского флота. Некоторые §H National Focuses §! дают дополнительный опыт и некоторые §HMinisters §! \n\nNaval Experience используется для разработки лучших вариантов существующих кораблей."
