 ### EQUIPMENT MODULES ###
 ship_light_battery_1: "85-мм RF."
 ship_light_battery_1_short: "Легкая батарея I"
 ship_light_battery_1_desc: "Относительно маленький пистолет для использования на эсминцах и небольших кораблях."
 ship_light_battery_2: "105-мм RF."
 ship_light_battery_2_short: "Легкая батарея II"
 ship_light_battery_2_desc: "Маленький пистолет с мощной монтировкой, чтобы он быстро попал на цель."
 ship_light_battery_3: "127-мм RF, пушка"
 ship_light_battery_3_short: "Легкая батарея III"
 ship_light_battery_3_desc: "Маленький пистолет с ружьями, чтобы защитить команду от осколок и суровой погоды."
 ship_light_battery_4: "130-мм RF."
 ship_light_battery_4_short: "Легкая батарея IV"
 ship_light_battery_4_desc: "Пара маленьких пушек на заряженной бронированной горе."
 dp_light_battery_1: "100-мм двухслойная батарея"
 dp_light_battery_1_short: "Двухцелевая основная батарея I"
 dp_light_battery_1_desc: "Маленький пушечный пистолет на специальной горе, позволяющий ему использовать самолёты, а также наземные мишени."
 dp_light_battery_2: "113-мм двухцелевая батарея"
 dp_light_battery_2_short: "Двухцелевая основная батарея II"
 dp_light_battery_2_desc: "Маленький пушечный пистолет с боеголовкой высокого угла, позволяющий ему атаковать самолёты, а также наземные цели."
 dp_light_battery_3: "127-мм двухцелевая батарея"
 dp_light_battery_3_short: "Двухцелевая основная батарея III"
 dp_light_battery_3_desc: "Небольшое ружье, высокоугольное, запертое в башне, которое позволяет ему использовать самолёты, а также наземные цели."
 dp_light_battery_4: "127-мм аккумуляторная батарея"
 dp_light_battery_4_short: "Двухцелевая основная батарея IV"
 dp_light_battery_4_desc: "Маленький пистолет в высокоуглубленной башне, позволяющий ему использовать самолёты, а также наземные цели."
 ship_heavy_battery_1: "28 см пушки"
 ship_heavy_battery_1_short: "Тяжелая батарея I"
 ship_heavy_battery_1_desc: "Большая калибровая пушка, датируемая до Великой Войны."
 ship_heavy_battery_2: "30,5 см Пушки"
 ship_heavy_battery_2_short: "Тяжелая батарея II"
 ship_heavy_battery_2_desc: "Комплект крупнокалиберных пушек на крупногабаритной горе."
 ship_heavy_battery_3: "38 см пушки"
 ship_heavy_battery_3_short: "Тяжелая батарея III"
 ship_heavy_battery_3_desc: "Тяжело бронированная установка для тяжелых пушек, включающая ряд новых технологий повышения точности и скорости стрельбы."
 ship_heavy_battery_4: "40,6 см"
 ship_heavy_battery_4_short: "Тяжелая батарея IV"
 ship_heavy_battery_4_desc: "Конечная эволюция тяжелой огневой мощи, эта сильно бронированная гора позволяет обеспечить высокую степень точности на больших расстояниях."
 ship_super_heavy_battery_1: "46 см пушки"
 ship_super_heavy_battery_1_short: "Аккумулятор сверхтяжелой батареи"
 ship_super_heavy_battery_1_desc: "Самый большой пистолет, когда-либо установленный на корабле, эти огромные пушки были сконструированы так, чтобы проникать в любые возможные бронежилеты на любом расстоянии."
 ship_light_medium_battery_1: "14,5 см Пушки"
 ship_light_medium_battery_1_short: "Легкая круизная батарея I"
 ship_light_medium_battery_1_desc: "Компромисс между скоростью огня и весом скорлупы, этот пистолет предназначен для использования в легких крейсерах для поражения более мелких судов."
 ship_light_medium_battery_2: "15 см пушки"
 ship_light_medium_battery_2_short: "Легкие круизные батареи II"
 ship_light_medium_battery_2_desc: "Этот пистолет представляет собой логическую эволюцию по сравнению с предыдущими моделями и предназначен для того, чтобы позволить легким крейсерам иметь комфортное преимущество в огневой мощи над эсминцами и старыми крейсерами."
 ship_light_medium_battery_3: "15,5 см Пушки"
 ship_light_medium_battery_3_short: "Легкий круизный батарея III"
 ship_light_medium_battery_3_desc: "Включая в себя ряд новых технологий, эта легко бронированная установка еще больше увеличивает разрыв между основными аккумуляторами эсминцев и легких крейсеров."
 ship_light_medium_battery_4: "15,5 см Автопогрузочная пушка"
 ship_light_medium_battery_4_short: "Автоматическая загрузка аккумулятора легкого круизного типа"
 ship_light_medium_battery_4_desc: "Эта гора, построенная с земли до высокого уровня огня, была создана для того, чтобы лёгкие крейсеры могли обезвредить еще более крупных врагов в результате многочисленных ударов."
 dp_ship_medium_1: "152-мм аккумуляторная батарея"
 dp_ship_medium_1_short: "Легкий круизный батарея IV"
 dp_ship_medium_1_desc: "Эта гора, построенная от земли до высокого угла огня, была создана для того, чтобы легковесные крейсеры могли использовать еще более крупные суда и воздушные суда."
 ship_medium_battery_1: "17 см пушки"
 ship_medium_battery_1_short: "Крузерная батарея I"
 ship_medium_battery_1_desc: "Не имея возможности нанести значительный ущерб боевым кораблям, этот средний пистолет позволяет крейсеру уверенно подключаться к более легким кораблям и другим крейсерам."
 ship_medium_battery_2: "19 см пушки"
 ship_medium_battery_2_short: "Крузерная батарея II"
 ship_medium_battery_2_desc: "Эволюция более раннего дизайна, это оружие было сделано, чтобы идти в ногу с увеличением брони и более длинными диапазонами, на которых ведутся военно-морские сражения."
 ship_medium_battery_3: "20,3 см"
 ship_medium_battery_3_short: "Батарея для круизеров III"
 ship_medium_battery_3_desc: "Хотя это не самое большое оружие, которое можно легко запрыгнуть на крейсере, эта пушка находит лучшее равновесие между весом оружия и огневой мощью и может надежно победить крейсера-армура."
 ship_medium_battery_4: "20,3 см Автопогрузочная пушка"
 ship_medium_battery_4_short: "Батарея IV"
 ship_medium_battery_4_desc: "С учетом того, что калибр боеприпасов ограничен существующими запасами, а также с учетом модернизации старых судов, в этом новом пистолете имеется передовая система автоматической погрузки, призванная резко повысить скорость огня."
 ship_secondaries_1: "75-мм RF."
 ship_secondaries_1_short: "Вторичная батарея I"
 ship_secondaries_1_desc: "Эта световая пушка, размещенная в хранилище с борта судна, дает более крупным кораблям определенную степень защиты от более мелких кораблей."
 ship_secondaries_2: "120-мм RF."
 ship_secondaries_2_short: "Вторичная батарея II"
 ship_secondaries_2_desc: "Небольшая турнирная гора для быстровоспламеняющихся пушек, предназначенная для защиты столпов от эсминцев и торпедных лодок."
 dp_ship_secondaries_1: "120-мм двухцелевая вторичная батарея"
 dp_ship_secondaries_1_short: "Двухцелевая вторичная батарея I"
 dp_ship_secondaries_1_desc: "Объединяя обязанности тяжелого противовоздушного оружия и вторичной аккумуляторной батареи, эта установка резко усиливает противовоздушную способность судна, обеспечивая при этом определенную степень защиты от менее крупных поверхностных целей."
 dp_ship_secondaries_2: "113-мм двухцелевая вторичная батарея"
 dp_ship_secondaries_2_short: "Двухцелевая вторичная батарея II"
 dp_ship_secondaries_2_desc: "Помещение оружия двойного назначения в башне значительно повышает защиту экипажа."
 dp_ship_secondaries_3: "127-мм двухцелевая вторичная батарея"
 dp_ship_secondaries_3_short: "Двухцелевая вторичная батарея III"
 dp_ship_secondaries_3_desc: "Мощность двухслойных турниров позволяет значительно увеличить огневую мощь."
 dp_ship_secondaries_4: "127-мм РМ. Двухцелевая вторичная батарея"
 dp_ship_secondaries_4_short: "Двухцелевая вторичная батарея IV"
 dp_ship_secondaries_4_desc: "Это конечное вторичное оружие, созданное для быстрого обстрела всех форм цели."
 ship_fire_control_system_0: "Центральное ранжирование"
 ship_fire_control_system_0_short: "Огнестрельное ограждение 0"
 ship_fire_control_system_0_desc: "Центральная станция, высоко поднятая в мачте корабля, определяет дальность до цели и передает эту информацию на ружья."
 ship_fire_control_system_1: "Директор Пожар"
 ship_fire_control_system_1_short: "Пожарная служба I"
 ship_fire_control_system_1_desc: "Станция центрального директора одновременно стреляет из всех пушек по командованию офицера по стрельбе."
 ship_fire_control_system_2: "Механический рейнджер"
 ship_fire_control_system_2_short: "Пожарная служба II"
 ship_fire_control_system_2_desc: "Механический компьютер на судне постоянно обновляет дальность и держится в направлении цели от информации, подаваемой ему дальнеджерами и другими датчиками."
 ship_fire_control_system_3: "Пуленепробиваемые компьютеры"
 ship_fire_control_system_3_short: "Пожарная служба III"
 ship_fire_control_system_3_desc: "Более сложный механический компьютер учитывает широкий спектр факторов при расчете баллистических решений для поражения цели."
 ship_torpedo_1: "3 х 450-мм ракета-носитель Торпедо"
 ship_torpedo_1_short: "Ракета-носитель I Торпедо"
 ship_torpedo_1_desc: "Комплект среднеразмерных торпед, которые могут быть установлены на наземных военных кораблях."
 ship_torpedo_2: "4х 450-мм ракета-носитель Торпедо"
 ship_torpedo_2_short: "Ракета-носитель II Торпедо"
 ship_torpedo_2_desc: "Устанавливая еще одну торпедную трубку на горе, наземный корабль может зажечь более крупное расстояние с большей вероятностью попасть в него."
 ship_torpedo_3: "3х53-мм ракета-носитель Торпедо"
 ship_torpedo_3_short: "Ракета-носитель Торпедо III"
 ship_torpedo_3_desc: "Крупные торпеды могут нести боеголовку побольше, причиняя гораздо больший ущерб цели."
 ship_torpedo_4: "4х53-мм ракета-носитель Торпедо"
 ship_torpedo_4_short: "Ракета IV Торпедо"
 ship_torpedo_4_desc: "После решения механических проблем, связанных с запуском крупных торпед с поверхностных судов, эта передовая модель может быть также быстро перезагружена для другого сальво."
 ship_torpedo_sub_1: "4х450 мм Трубки Торпедо"
 ship_torpedo_sub_1_short: "Трубки Torpedo I"
 ship_torpedo_sub_1_desc: "Обычный набор торпедных труб, которые могут быть перегружены изнутри подводной лодки."
 ship_torpedo_sub_2: "6 х 450 мм Трубки Торпедо"
 ship_torpedo_sub_2_short: "Трубки Torpedo II"
 ship_torpedo_sub_2_desc: "Большой торпедный зал позволяет устанавливать больше торпедных трубок, а также несколько больше жилых помещений для экипажа."
 ship_torpedo_sub_3: "4х 533-мм торпедные трубы"
 ship_torpedo_sub_3_short: "Трубки Torpedo III"
 ship_torpedo_sub_3_desc: "Комплект более крупных торпедных труб позволяет подводным лодкам запускать более крупные торпеды."
 ship_torpedo_sub_4: "6 x 533 мм Трубки Торпедо"
 ship_torpedo_sub_4_short: "Трубки Torpedo IV"
 ship_torpedo_sub_4_desc: "С добавлением электрического погрузочного тарана торпедные трубки могут быть вновь загружены в течение нескольких минут."
 ship_anti_air_1: "50 км/ч."
 ship_anti_air_1_short: "Противоядие I"
 ship_anti_air_1_desc: "Комплект тяжелых пулеметов обеспечивает небольшую защиту от самолетов в непосредственной близости друг от друга."
 ship_anti_air_2: "20 мм AA"
 ship_anti_air_2_short: "Противоядие II"
 ship_anti_air_2_desc: "Маленькая автоматическая пушка бросает гораздо более крупный снаряд, убив нападавший самолет в нескольких случаях."
 ship_anti_air_3: "37-мм AA"
 ship_anti_air_3_short: "Противовоздушные силы III"
 ship_anti_air_3_desc: "Предыдущие калибры оружия оказались слишком светлыми, чтобы надежно убить атакующий самолет, прежде чем они смогут высвободить свои боеприпасы."
 ship_anti_air_4: "40-мм квад АА"
 ship_anti_air_4_short: "Противовоздушные силы IV"
 ship_anti_air_4_desc: "Самая последняя модель противовоздушных пушек включает в себя установку, которая способна отслеживать быстро летающие мишени, и усовершенствованную систему режиссёров для координации огня нескольких позиций ружей против одной мишени."
 ship_mine_layer_1: "Железнодорожные работы"
 ship_mine_layer_1_desc: "Модификация наземного судна для перевозки и развертывания морских мин."
 ship_mine_sweeper_1: "Горизонтальная съемка"
 ship_mine_sweeper_1_desc: "Передатчик для размножения различного оборудования."
 ship_mine_layer_sub: "Добыча метрополий"
 ship_mine_layer_sub_desc: "Модификация корпуса подводной лодки, позволяющая ей развертывать ряд мин."
 ship_depth_charge_1: "Глубина зарядных железнодорожных линий"
 ship_depth_charge_1_short: "Глубина заряда I"
 ship_depth_charge_1_desc: "Простой набор рельсов позволяет сбрасывать глубинные заряды с кормы судна, когда судно ездит над погруженной целью."
 ship_depth_charge_2: "Глубина заряда"
 ship_depth_charge_2_short: "Глубина заряда II"
 ship_depth_charge_2_desc: "С помощью небольшого взрывного заряда это устройство сбрасывает довольно большой глубинный заряд, что позволяет одному судну сбросить схему глубинных зарядов на большую зону."
 ship_depth_charge_3: "Противолодочный миномет"
 ship_depth_charge_3_short: "Глубина заряда III"
 ship_depth_charge_3_desc: "Проектор для меньшего глубинного заряда с контактным предохранителем, позволяющим судну напасть на цель без нарушения сонарного контакта."
 ship_depth_charge_4: "Усовершенствованный противоподводный миномет"
 ship_depth_charge_4_short: "Глубина заряда IV"
 ship_depth_charge_4_desc: "Эволюция предыдущей модели, этот миномет может запустить значительно более крупный заряд на более длительную дистанцию."
 ship_sub_snorkel_1: "Базовая сноркель"
 ship_sub_snorkel_1_desc: "Устройство, позволяющее подводной лодке работать под водой с основными двигателями, которое позволяет ей перезаряжать свои батареи, не подвергая себя опасности нападения при появлении."
 ship_sub_snorkel_2: "Усовершенствованный Сноркель"
 ship_sub_snorkel_2_desc: "Совершенствование конструкции сноркеля уменьшает проблемы, связанные с использованием основных двигателей в тяжелых морях, снижая при этом вероятность обнаружения сноркеля на радаре."
 ship_airplane_launcher_1: "Катапульта Plaatplane"
 ship_airplane_launcher_1_desc: "Простая ракета-носитель выводит маленький самолет-скаут в воздух."
 ship_airplane_launcher_2: "Усовершенствованный катапульт Plaatplane"
 ship_airplane_launcher_2_desc: "Усовершенствованный механизм запуска, позволяющий судну запускать более крупный самолет с большей дальностью и скоростью."
 sub_missile_launcher: "Ракета-носитель подводных лодок"
 sub_missile_launcher_desc: "Ракета, установленная на подводной лодке для управляемых и баллистических ракет."
 slbm_launcher: "Ракета-носитель подводной ракеты"
 slbm_launcher_desc: "Ракета, установленная на подводной лодке для ядерных баллистических ракет."
 ship_engine_sub_aip_1: "Воздушно-независимое движение"
 ship_engine_sub_aip_1_desc: "Первая итерация новых типов двигателей, позволяющая подводной лодке оставаться под водой в течение более длительного периода времени, за счет значительного увеличения расхода топлива и уменьшения дальности плавания судов."
 ship_engine_sub_aip_2: "Комбинированный двигатель AIP-Diesel"
 ship_engine_sub_aip_2_desc: "Новая версия бесперебойных двигательных установок, обеспечивающая более высокую эффективность при более низком расходе топлива."
 ship_engine_sub_aip_3: "Высокоскоростные упаковочные двигатели"
 ship_engine_sub_aip_3_desc: "Мы достигли вершины того, что, по нашему мнению, может быть достигнуто с помощью двигателей AIP. Этот двигатель обеспечивает отличную частоту вращения, сохраняя при этом расход топлива на приемлемых уровнях."
 ship_anechoic_tile: "Анехотические кишки"
 ship_anechoic_tile_desc: "Нанесение покрытий на каучуковую плитку, предназначенных для уменьшения дальности обнаружения судна с помощью как пассивного, так и активного сонара."
 ship_torpedo_sub_nuclear: "Ядерный торпед"
 ship_torpedo_sub_nuclear_desc: "Торпеды, которые несут ядерную боеголовку, обеспечивая высокоэффективное оружие против вражеских судов, за счет повышенного риска аварий."
 ship_deck_space: "Космическое пространство Хангар"
 ship_deck_space_desc: "Крупная открытая зона внутри корабля, которая позволяет обслуживать и вооружать колесные самолёты."
 big_ship_deck_space: "Плывающая подиумная дорожка"
 big_ship_deck_space_desc: "Открытая зона, которая позволяет обслуживать, заправлять и поставлять самолеты и готовить их к полетам."
 ship_sonar_1: "Гидрофоны"
 ship_sonar_1_desc: "Простой набор гидрофонов для отслеживания погруженной цели по звуку, который он производит."
 ship_sonar_2: "Активный Сонар"
 ship_sonar_2_desc: "Активный шумоизлучатель, который посылает короткую "погрузку" в воду, затем слушает эхо из погруженного подводного корпуса."
 ship_radar_1: "Дециометрический военно-морской поисковый радиолокатор"
 ship_radar_1_short: "Радиолокатор I"
 ship_radar_1_desc: "Простой радиолокационный комплекс, работающий в диапазоне 50 см, позволяет обнаруживать наземные суда даже в плохой погоде на расстоянии более 10 километров."
 ship_radar_2: "Усовершенствованные дециметрические военно-морские поисковые радары"
 ship_radar_2_short: "Радиолокатор II"
 ship_radar_2_desc: "Усовершенствованный радиолокационный аппарат, работающий в диапазоне волны 30 см, может точно измерять дальность и регулировку даже небольшого судна на дальности свыше 25 километров."
 ship_radar_3: "Центиметрический оружейный радиолокатор"
 ship_radar_3_short: "Радиолокатор III"
 ship_radar_3_desc: "Эта радиолокационная установка, оборудованная полости магнетронов, позволяет не только обнаруживать очень небольшие цели, но и даже обнаруживать вспышки снарядов, что позволяет по-настоящему ослеплять цели, даже ночью или в неблагоприятных погоде."
 ship_radar_4: "Комплексный радиолокатор пожаротушения"
 ship_radar_4_short: "Радиолокатор IV"
 ship_radar_4_desc: "Работая в диапазоне сантиметровой длины волны, этот радиолокационный комплекс полностью интегрирован в систему контроля за оружием на судах и обеспечивает высокоточный контроль за огнем во всех погодных условиях."
 ship_extra_fuel_tank: "Дополнительные топливные баки"
 ship_extra_fuel_tank_desc: "Расширенное хранение топлива позволяет расширить диапазон работы."
 light_ship_engine_1: "Двигатель Шп 35 000"
 light_ship_engine_1_short: "Легкий двигатель I"
 light_ship_engine_1_desc: "Небольшой набор паровых турбин может привести в движение маленькое судно с большой скоростью или на более крупном корабле с более низкими скоростями."
 light_ship_engine_2: "40 000 двигателей Shp"
 light_ship_engine_2_short: "Легкий двигатель II"
 light_ship_engine_2_desc: "С использованием котлоагрегатов высокого давления такой же вес и пространство машин могут обеспечить более высокую производительность."
 light_ship_engine_3: "45 000 двигателей Шп"
 light_ship_engine_3_short: "Легкий двигатель III"
 light_ship_engine_3_desc: "Новые разработки в области материалов позволяют значительно повысить давление пара и тем самым увеличить мощность."
 light_ship_engine_4: "Двигатель Shp 50 000"
 light_ship_engine_4_short: "Легкий двигатель IV"
 light_ship_engine_4_desc: "Усовершенствованные конфигурации двигателей и турбинная передача позволяют повысить эффективность при одинаковом весе."
 sub_ship_engine_1: "1 000 двигателей Shp"
 sub_ship_engine_1_short: "Подводный двигатель I"
 sub_ship_engine_1_desc: "Комбинация дизельных и электрических двигателей позволяет подводной лодке работать на разумной скорости."
 sub_ship_engine_2: "2 000 двигателей Shp"
 sub_ship_engine_2_short: "Подводный двигатель II"
 sub_ship_engine_2_desc: "Более мощный дизельный двигатель дает подводной лодке возможность спрыгнуть в позицию, когда она обнаруживает цель."
 sub_ship_engine_3: "3 000 двигателей Шп"
 sub_ship_engine_3_short: "Подводный двигатель III"
 sub_ship_engine_3_desc: "Новые материалы и методы производства позволяют создавать двигатели, которые могут работать дольше при полной мощности."
 sub_ship_engine_4: "4 000 двигателей Shp"
 sub_ship_engine_4_short: "Подводный двигатель IV"
 sub_ship_engine_4_desc: "Усовершенствованные двигатели с турбонагнетателями могут работать гораздо быстрее в течение короткого периода времени либо для того, чтобы преследовать цели, либо для того, чтобы быстрее зарядить батареи."
 sub_ship_nuclear_engine_1: "Ядерный подводной реактор"
 sub_ship_nuclear_engine_1_short: "Подводной реактор"
 sub_ship_nuclear_engine_1_desc: "Маленький реактор, который обеспечивает ядерную тягу для подводных лодок, обеспечивает повышенную выносливость подводных лодок и эффективное функционирование современных военно-морских флотов"
 cruiser_ship_engine_1: "60 000 двигателей Шп"
 cruiser_ship_engine_1_short: "Двигатель I круизера"
 cruiser_ship_engine_1_desc: "Обычный набор котлоагрегатов, обеспечивающих пар для несваренной турбины."
 cruiser_ship_engine_2: "70 000 двигателей Шп"
 cruiser_ship_engine_2_short: "Круизный двигатель II"
 cruiser_ship_engine_2_desc: "Паровая турбина, оборудованная коробкой передач, значительно более эффективна, что позволяет использовать дополнительный вес для дополнительной мощности."
 cruiser_ship_engine_3: "80 000 двигателей Шп"
 cruiser_ship_engine_3_short: "Круизный двигатель III"
 cruiser_ship_engine_3_desc: "Совершенствование котельных повышает давление пара для увеличения мощности."
 cruiser_ship_engine_4: "90 000 двигателей Шп"
 cruiser_ship_engine_4_short: "Круизный двигатель IV"
 cruiser_ship_engine_4_desc: "Усовершенствованные материалы позволяют этому двигателю работать гораздо дольше при высокой нагрузке."
 heavy_ship_engine_1: "30 000 двигателей Shp"
 heavy_ship_engine_1_short: "Тяжелый двигатель I"
 heavy_ship_engine_1_desc: "Предназначенный для того, чтобы освободить вес для оружия и бронежилетов, этот двигатель никогда не был создан для того, чтобы обеспечить особенно высокую скорость."
 heavy_ship_engine_2: "90 000 двигателей Шп"
 heavy_ship_engine_2_short: "Тяжелый двигатель II"
 heavy_ship_engine_2_desc: "Драматически более мощный, чем предыдущие конструкции, этот двигатель предназначен для того, чтобы предоставить тяжелому судну комфортную скорость по сравнению с более старыми моделями."
 heavy_ship_engine_3: "150 000 по Шп-двигатель"
 heavy_ship_engine_3_short: "Тяжелый двигатель III"
 heavy_ship_engine_3_desc: "По мере роста веса оружия и бронежилетов, этот двигатель был разработан таким образом, чтобы обеспечить более высокие скорости для преследования бегущих врагов или сохранения дальности действия против высших врагов."
 heavy_ship_engine_4: "210 000 двигателей Шп"
 heavy_ship_engine_4_short: "Тяжелый двигатель IV"
 heavy_ship_engine_4_desc: "Эта электростанция, разработанная с использованием новых материалов и усовершенствованных котельных, предназначена для того, чтобы позволить современному военному кораблю успевать за экспресс-перевозчиками и крейсерами."
 heavy_ship_nuclear_engine_1: "Ядерный реактор тяжелых судов"
 heavy_ship_nuclear_engine_1_short: "Реактор тяжелого судна"
 heavy_ship_nuclear_engine_1_desc: "Мощный ядерный реактор, способный заправлять самые тяжелые корабли без необходимости заправки."
 carrier_ship_engine_1: "Двигатель Shp 50 000"
 carrier_ship_engine_1_short: "Двигатель I"
 carrier_ship_engine_1_desc: "Базовый набор двигателей позволяет среднеразмерному перевозчику достигать скорости, необходимой для безопасной эксплуатации воздушных судов."
 carrier_ship_engine_2: "120 000 двигателей Шп"
 carrier_ship_engine_2_short: "Перевозчик II"
 carrier_ship_engine_2_desc: "Эта новая электростанция предназначена для того, чтобы дать перевозчику возможность превзойти большинство более старых крейсеров и несколько эсминцев, что позволит ему избежать наземных сил противника."
 carrier_ship_engine_3: "150 000 по Шп-двигатель"
 carrier_ship_engine_3_short: "Двигатель III"
 carrier_ship_engine_3_desc: "Двигатель, предназначенный для того, чтобы даже крупные перевозчики могли двигаться с очень высокой скоростью."
 carrier_ship_engine_4: "210 000 двигателей Шп"
 carrier_ship_engine_4_short: "Двигатель IV"
 carrier_ship_engine_4_desc: "Эта электростанция была предназначена для оснащения современного "быстрого перевозчика", предназначенного для работы в качестве центрального элемента транспортной группы."
 carrier_ship_nuclear_engine_1: "Реактор ядерных перевозчиков"
 carrier_ship_nuclear_engine_1_short: "Реакторы для перевозки грузов"
 carrier_ship_nuclear_engine_1_desc: "Мощный ядерный реактор, способный обеспечивать питание колоссальных носителей без необходимости их заправки."
 ship_armor_bb_1: "200-мм пояс 40-мм палуба"
 ship_armor_bb_1_short: "Боевой корабль Армур I"
 ship_armor_bb_1_desc: "Эта система бронетехники, предназначенная для защиты судна от ружей своего калибра, обеспечивает надлежащую защиту всех частей судна в зависимости от его полезности."
 ship_armor_bc_1: "150-мм пояс 25-мм палуба"
 ship_armor_bc_1_short: "Боевой круизер I"
 ship_armor_bc_1_desc: "Эта броня, разработанная для защиты судна от меньшего оружия, весит гораздо меньше, чтобы обеспечить более высокую скорость."
 ship_armor_bb_2: "350-мм пояс 150-мм палуба"
 ship_armor_bb_2_short: "Боевой корабль Армур II"
 ship_armor_bb_2_desc: "Эта бронебойная схема, обеспечивающая наклонный пояс, предназначена для защиты линейного судна от оружия собственного калибра."
 ship_armor_bc_2: "305-мм пояс/100-мм палуба"
 ship_armor_bc_2_short: "Боевой круизер II"
 ship_armor_bc_2_desc: "Компромисс между скоростью и защитой, эта броня предназначена для защиты корабля от пушек крейсеров и эсминцев."
 ship_armor_bb_3: "380-мм пояс/ 155-мм палуба"
 ship_armor_bb_3_short: "Боевой корабль Армур III"
 ship_armor_bb_3_desc: "В результате радикального отхода от предыдущих бронетранспортеров этот проект создает сильно бронежилет в центре судна, но при этом наносит ущерб защите других частей корабля, цель которого состоит в защите судна от ружей своего калибра."
 ship_armor_bc_3: "330-мм пояс 130-мм палуба"
 ship_armor_bc_3_short: "Боевой круизер III"
 ship_armor_bc_3_desc: "Эта броня, разработанная с учетом ограничений по весу, направлена на обеспечение максимальной защиты жизненно важных частей судна, оставляя незащищенными другие районы."
 ship_armor_shbb: "450-мм пояс 210-мм палуба"
 ship_armor_shbb_short: "Сверхтяжеливый бронебойник"
 ship_armor_shbb_desc: "Последнее слово в конструкции бронежилетов, эта система бронетехники предназначена для того, чтобы победить все известные аккумуляторные снаряды, позволив судну с таким оборудованием воевать и потопить любой другой корабль в мире сегодня."
 ship_armor_cruiser_1: "50-мм пояс 400-мм палуба"
 ship_armor_cruiser_1_short: "Крузер I"
 ship_armor_cruiser_1_desc: "Броневая схема, предназначенная для того, чтобы дать крейсеру небольшой край при борьбе с эсминцами и другими легковооруженными кораблями."
 ship_armor_cruiser_2: "100-мм пояс 50мм палуба"
 ship_armor_cruiser_2_short: "Крузер II"
 ship_armor_cruiser_2_desc: "Более жесткий ремень, предназначенный для того, чтобы крейсер мог использовать более старые лёгкие крейсеры и менее крупные суда с большой защитой."
 ship_armor_cruiser_3: "120-мм пояс/65-мм палуба"
 ship_armor_cruiser_3_short: "Крузер III"
 ship_armor_cruiser_3_desc: "Копирование методов, используемых для бронирования боевых кораблей, эта система бронетехники предназначена для того, чтобы идти в ногу с развитием вооружений во всем мире."
 ship_armor_cruiser_4: "150-мм пояс/60-мм палуба"
 ship_armor_cruiser_4_short: "Крузер IV"
 ship_armor_cruiser_4_desc: "Эта броня направлена на обеспечение максимальной защиты районов, абсолютно необходимых для поддержания судна на плаву и в бою, за счет всех других районов."
 ship_armor_carrier_deck: "90-мм палуба"
 ship_armor_carrier_deck_short: "Рейс Броневик на палубе"
 ship_armor_carrier_deck_desc: "Тяжелые бронежилеты защищают ангары от ударов вражеских бомбардировщиков за счет меньшего количества рабочих помещений."
 ship_armor_ice_carrier_deck_1: "Укрепление подиума Пайкрит"
 ship_armor_ice_carrier_deck_1_desc: "Дополнительные строительные подкрепления, обеспечивающие более мощное и более жизнеспособное строительство, а также более эффективное сопротивление элементам."
 ship_armor_ice_carrier_deck_2: "Сталь-реактивная подиумная труба Pykrete"
 ship_armor_ice_carrier_deck_2_desc: "Сталь-реактивный Pykrete обеспечивает крепкую конструкцию, способную выдерживать больше повреждений, и одновременно обеспечивает лучшую изоляцию."
 ship_armor_ice_carrier_deck_3: "Ледяной подиум"
 ship_armor_ice_carrier_deck_3_desc: "Используемые материалы и методы обеспечивают наилучшую структурную устойчивость и уменьшают воздействие погоды на суда."
 SHIP_DESIGNER_MODULE_SELECTION: "$NAME$ nSL выбор модуля:"
 ship_light_battery_sub: "200-мм батарея"
 ship_light_battery_sub_desc: "На легких крейсерах чаще встречаются огромные катера калибра."
 EQ_MOD_CAT_ship_light_battery_sub_TITLE: "Пистолеты"
 cruiser_submarine_specialization: "Охотники на большие расстояния"
 cruiser_submarine_specialization_desc: "Крузерские подводные лодки представляют собой вершину тяжелого подповерхностного рейда."
 midget_submarine_specialization: "Подводные пионеры"
 midget_submarine_specialization_desc: "Маленькие подводные лодки, предназначенные для налетов на гавани или на легкую колонну, идеально подходят для нашей морской доктрины."
