 #Tooltips
 joining_london_berlin_axis_tt: "Мы присоединимся к АПИ, создадим Лондонско-Берлинскую ось."
 joining_london_berlin_axis_tur_tt: "Мы присоединимся к их альянсу, члены нашей фракции присоединятся к ним, после победы мы сможем восстановить нашу фракцию, сохранив наши нынешние альянсы."``
 second_great_war_has_ended: "Вторая Великая война закончилась."
 FRA_british_peace_settlement_event_tt: "Мы будем призывать к урегулированию на основе переговоров с британцами, которые будут призывать немцев прекратить боевые действия. Мы можем проиграть, но мы выживем. Если немцы не согласятся, британцы могут поменять сторону."
 GW_british_surrender_tt: "Понадобится год, чтобы британцы предложили мирные условия, а тем временем мы должны укрепить наши колониальные владения, чтобы обеспечить максимальные уступки со стороны британцев."

 #Faction Renames
 TUR_post_war_faction_rename: "Анкарский пакт"

 #Events
 secondgreatwarbritish.1.d: "На континенте возникла новая обширная война. Немцы движутся на Западе, намереваясь вернуть свои потерянные немецкоязычные земли, в то время как французы видят возможность, наконец, уничтожить немцев под их ботинками и навязать необузданную континентальную гегемонию. Это ставит нас в трудное положение. Позволим ли мы нашему постоянному сопернику, Франции, достичь континентального господства, которого они давно искали? Или мы будем поддерживать удерживаемую Германию, гарантируя, что ни одна власть не может угрожать британским интересам? nn noSentimentality не имеет места в великой стратегии. Мы должны хладнокровно оценить, какой результат лучше всего служит Империи, независимо от прошлых союзов или нынешних идеологий. Судьба Европы и, возможно, мира зависит от нашего решения."

 secondgreatwarturkish.1.d: "Огонь, который горел на Западном фронте, вспыхнул в глобальной войне. Франция и Италия, которые вырезали наши земли и унизили нас после Великой войны в Севре, теперь заперты в отчаянной борьбе против Германии и Великобритании. Их колониальные силы в Сирии и Анатолии, несомненно, растягиваются. Несмотря на то, что великие державы разрывают друг друга на части, появляется возможность вновь взять то, что по праву принадлежит нам, от извращенных французов и итальянцев, и еще раз помыть наши ботинки в Средиземноморье. Это золотая возможность, возможно, единственная, которая когда-либо будет у нас, восстановить то, что является нашим по праву, восстановить нашу национальную честь и покончить с несправедливостью, навязанной нам. Возьмем ли мы этот момент?"

 secondgreatwaramerica.1.d: "Сообщения из Европы рисуют мрачную картину. Франко-германская война нарастает, и силы Лондонско-Берлинской оси все глубже проникают во французские владения и вскоре в саму Францию. Британско-германская победа представляется все более вероятным результатом, который оставило бы Британскую Империю опасной на мировой сцене. Канада, власть, которая все еще находится на пути к английским имперским амбициям, сидит на нашей северной границе. Если позволить Британии укрепить свою власть в Европе, то Канада неизбежно станет прямой и нетерпимой угрозой американской свободе. Можем ли мы позволить себе дождаться падения удара, или мы должны действовать решительно сейчас, чтобы обезопасить наше полушарие от имперского господства?"

 secondgreatwaramerica.2.d: "Гринго идут на север! Внезапное безрассудное нападение Америки на Британскую Канаду предоставляет Мексике неупущенную возможность. На протяжении многих лет мы пережили унижение украденных у нас территорий, постоянное напоминание об агрессии Янки. Теперь, когда Колосса Севера втянулась в великую войну против Британской империи, их южная граница разоблачена, националистическое сердце Мексики кричит о справедливости, о возвращении наших законных земель из Техаса в Калифорнию."

 secondgreatwar_alliances.1.d: "По мере активизации борьбы с французскими амбициями британцы предлагают объединить наши усилия. Действительно, британцы и немцы делятся глубоким, общим немецким наследием, отличным от латиноамериканских держав против нас. Возможно, настало время для того, чтобы народы Северного моря объединились в борьбе с угрозой французской гегемонии. Формальный пакт укрепил бы нашу общую цель и укрепил бы наши вооружения против Парижа и Рима."

 secondgreatwar_alliances.2.d: "Это сделано. Германия согласилась присоединиться к нашей фракции, объединив наши силы против общего французского врага. Этот официальный пакт укрепляет нашу общую цель: не допустить французского господства на континенте. С немецким вооружением к нашему, путь к победе над Францией и Италией становится яснее. Пусть этот Лондонско-Берлинский оксис продемонстрирует нашу решимость."

 secondgreatwar_alliances.3.d: "Берлин отклонил наше предложение о создании официального альянса, однако, хотя он и вызывает разочарование, он не вносит существенного изменения в стратегическую ситуацию, обе наши страны по-прежнему привержены борьбе с французской агрессией, мы будем продолжать сотрудничать там, где наши интересы совпадают, но военные усилия будут осуществляться в соответствии с отдельными командными структурами, возможно, германская осторожность понятна, но, тем не менее, упущенная возможность."

 secondgreatwar_alliances.4.d: "Война против держав-соперников продолжается. Наша борьба за возвращение турецких земель из Франции и Италии совпадает с более широким европейским конфликтом. Теперь [От Гетнама] предлагает официально присоединиться к их фракции. В то время как мы вступили в эту войну по своим собственным причинам, придерживаясь позиции могущественного блока [от Гетедикта Капитана], принесла бы значительную военную и дипломатическую поддержку, потенциально обеспечив наши завоевания и поражение наших общих врагов. Давайте официально оформим наше сотрудничество и присоединимся к [от Гетфакшн Нам]?"

 secondgreatwar_alliances.5.d: "Отличные новости: турки приняли наше предложение и официально присоединились к нашему альянсу против франко-итальянского блока, их вступление в войну открывает важные новые стратегические возможности, потенциально заставляя наших врагов перенаправлять ресурсы в Восточное Средиземноморье и Балканы, что значительно укрепляет нашу коалицию и ускоряет путь к победе."

 secondgreatwar_alliances.6.d: "Турки отказались от нашего предложения альянса, возможно, старые обиды идут глубже, чем нынешние возможности, или, может быть, им просто не хватает решимости взять на себя полную ответственность, несмотря на то, что их проникновение упростило бы дело, их отдельная война против Энтента все еще кровоточит наших врагов, и их отказ в конечном итоге незначителен для окончательного результата."

 secondgreatwar_alliances_reform.1.d: "С завершением второй Великой войны Берлин стремится реорганизовать свои альянсы. Сражаясь вместе с нами против Энтекте, Германия приглашает вновь присоединиться к реформированному Штальпакту. Это подтвердит наши связи и поместит нас в германскую сферу влияния в новом европейском порядке. Однако с восстановлением мира, возможно, наши национальные интересы будут лучше удовлетворяться за счет независимости или согласования в других странах. Как мы отреагируем на предложение Берлина?"

 secondgreatwar_alliances_reform.2.d: "Не удивительно, что Германия восстановила Штальпакт, очистив страны, которые сражались вместе с нами против Франции. Похоже, что военное единство, созданное против общего врага, было действительно временным. Берлин явно намерен укрепить свой собственный блок на континенте. Великая игра возобновляется, хотя и с перестроенной доской."

 secondgreatwar_alliances_reform.3.d: "Теперь, когда пыль оправилась от Второй Великой войны, Анкара стремится официально оформить свое региональное влияние."

 secondgreatwar_alliances_reform.4.d: "Турки ушли, достигнув своих целей против «Согласия» с нашей помощью, теперь они покидают наш союз, чтобы создать свой собственный региональный блок, возможно, неизбежны, учитывая их независимые амбиции, их вклад в военное время ценился, но их верность миру явно лежит в другом месте."

 secondgreatwar_peacedeals.1.d: "Война проиграна. То, что началось как необходимый удар, чтобы защитить наше полушарие от британско-германского господства, превратилось в губительное поражение. Вражеские силы захватывают огромные участки нашей родины, от побережья до побережья. Цена крови и сокровищ стала невыносимой, а полное коллапсирование. Дальнейшее сопротивление кажется тщетным и рискует лишь еще большим разрушением. Пора ли признать поражение и просить британцев о мире, каким бы унизительным ни были условия?"

 secondgreatwar_peacedeals.2.d: "Победа! Американцы, безрассудно развязав этот конфликт, теперь видят ошибку своих путей и подают в суд на мир. Их армии разрушены, их нация разрушена. Это прекрасная возможность навязать условия, которые навсегда обеспечат британские интересы в Северной Америке и преподают янки урок о вызове Империи. Мы будем диктовать условия."

 secondgreatwar_peacedeals.3.d: "британцы согласились на мир, хотя и на сокрушительных условиях. Война окончена. Канада в безопасности под их имперским зонтиком, Мексика восстанавливает огромные участки нашей земли, и вассальская Новая Англия, вырезанная из нашей земли, сейчас сидит на нашей северной границе. Республика выживает, но слабеет и смиряется. Мы должны принять этот горький мир и столкнуться с трудным будущим."

 secondgreatwar_peacedeals.4.d: "Гринго побеждены! Разрушенные между нашими войсками на юге и британцами на севере Соединенные Штаты предлагают сдаться. Наши британские союзники сообщают нам, что мирные условия включают возвращение законных земель Мексики; Техаса, Калифорнии, Аризоны, Нью-Мексико и всей территории, потерянной в результате агрессии Янки. Наше справедливое дело восторжествовало; Мексика вновь вернет свою честь и свои украденные земли!"

 secondgreatwar_peacedeals.5.d: "Американцы капитулируют! Их безрассудный конфликт с Великобританией привел к их неизбежному краху, и теперь они молят о мире. Их слабость — это наша возможность. Мы согласимся с их капитуляцией, но только на условиях, гарантирующих японский контроль над жизненно важными территориями Тихого океана; Филиппины, Гавайи и стратегически важные острова должны попасть под нашу сферу. Эпоха американского влияния в Азии закончилась."

 secondgreatwar_peacedeals.6.d: "Японцы приняли нашу капитуляцию. Условия являются жесткими, что подтверждает наши самые страшные опасения: потеря Филиппин, Гавайских островов и многих островных территорий по всему Тихому океану. То, что когда-то было американским озером, сейчас находится под строгим контролем Токио. Наше влияние в Азии, построенное на протяжении десятилетий, испарилось. Мы должны принять эту горькую реальность и уйти."

 secondgreatwar_peacedeals.7.d: "Случилось немыслимое. Париж находится в руках врага. Немецко-британский жгуннавт безжалостно передвигается по всей Франции, и наша военная ситуация безнадёжна. Бороться за некоторые национальные разрушения. В этот мрачный час отчаянная азартная игра представляет себя: призыв к британцам. Они наши враги, да, но их стратегические цели могут отличаться от целей Берлина. Можно ли убедить Лондон навязать мир, который, хотя и суровый, защищает Францию от полного расчленения? Это слабая надежда, но, возможно, единственный."

 secondgreatwar_peacedeals.8.d: "Послание из Парижа, Французская Республика, находится под общим давлением наших сил и наших немецких союзников, они обращаются к нам напрямую, стремясь к условиям прекращения конфликта, мы достигли нашей главной цели: французская гегемония разрушена, продолжение войны чревато ненадлежащим расширением прав и возможностей Германии, в то время как мы согласны с этим, позволяет нам диктовать мир, благоприятный для Империи, сохранить колониальные завоевания и восстановить баланс сил. Выполним ли мы их просьбу и накажем наши условия?"

 secondgreatwar_peacedeals.9.d: "Французский призыв о перемирии прибывает через Лондон, их власть сломлена, однако наши британские союзники, достигнув своей цели проверки Франции, теперь призывают к сдержанности, они, кажется, нервничают по поводу перспектив полного доминирования Германии и могут даже помешать нашему продвижению вперед, если мы слишком далеко продвинемся, проблемы баланса власти перевешивают единство в военное время."

 secondgreatwar_peacedeals.10.d: "Лондон и Берлин приняли наш призыв к миру, боевые действия прекратились, но их цена огромна. Альзас Лоррейн вновь потерялся для немцев, и огромные участки нашей колониальной империи сдаются британским стервятникам. Наши союзники вынуждены сами установить свой отдельный, негативный мир. Мы избежали полной оккупации, но Франция выходит из этого конфликта совершенно разрушенной и униженной. Республика кровоточит, и темные времена, несомненно, наступают, когда нация придет к урегулированию этой катастрофы."

 secondgreatwar_peacedeals.11.d: "Победа! что Франция сдалась нашим немецким и британским союзникам, их поражение свидетельствует о прекращении более широкого европейского конфликта, когда мы достигли своих собственных целей против французов, у нас мало причин для затягивания боевых действий. Мы признаем, что французы сдались и согласны с прекращением боевых действий."

 secondgreatwar_peacedeals.12.d: "Мир закончился. Франция, полностью побежденная, приняла наши условия. Их вызов британским интересам и континентальной стабильности сорван. Как победители, мы охраняем ключевые стратегические активы по всей их бывшей империи: Джибути охраняет пролет Красного моря, их карибские острова укрепляют наше атлантическое присутствие, а обширные территории в Экваториальной Африке попадают под английскую сушренность. Принимая их капитуляцию, посредником с нашими немецкими союзниками, мы обеспечиваем, чтобы французская власть оставалась под контролем, предотвращая чрезмерное доминирование Германии. Баланс власти восстановлен, и Британская Империя становится сильнее после конфликта."

 secondgreatwar_peacedeals.13.d: "Катастрофа из Парижа. Французское правительство взяло капитуляцию, подписав перемирие с Великобританией и Германией и оставив Италию в изоляции во время войны. Стратегический расчёт резко сместился против нас. Теперь мы сталкиваемся с общей силой Немецкого Рейха, Британской империи и их союзников, на которых не было ни одного крупного континентального партнера, на которого можно было бы положиться. Продолжение борьбы похоже на национальное самоубийство. Ищем ли мы мир сейчас, несмотря на жесткие условия или боремся против невыполнимых шансов?"

 secondgreatwar_peacedeals.14.d: "Как и ожидалось, Рим следует за Парижем в стремлении к перемирию. Итальянская борьба в одиночку никогда не была устойчивой. Принятие их капитуляции позволяет нам достичь нашей главной цели, обезопасив Средиземное море. Ливия получит «независимость» под нашим присмотром, защищая египетский фланг. Их остающиеся беспокоящие территории Восточной Африки могут рухнуть, так как их имперское ядро разваливается, устранив итальянское присутствие, не обременяя себя. Удовлетворительное заключение."

 secondgreatwar_peacedeals.15.d: "Мир наступает, но за сокрушительную цену. Британцы приняли наше предложение о капитуляции, что положило конец боевым действиям. Условия суровые: Ливия получила поддельную независимость под большим пальцем Лондона, наши с трудом завоеванные достижения в Восточной Африке перерастают в анархию, а турки вернут Анатолию. В зависимости от того, насколько далеко продвинутся враги, даже части Северной Италии могут быть потеряны. Наша империя исчезла, наша военная сломлена. Осталось лишь подписать перемирие и выдержать позор."

 secondgreatwar_peacedeals.16.d: "Из Лондона приходят слова: итальянцы сдались. После краха своих французских союзников Рим поклонился неизбежным и принятым условиям, предписываемым нашими британскими партнерами. Средиземноморский фронт закрыт, еще одна победа обеспечена для Лондонско-Берлинской оси. Теперь мы можем закрепить наши достижения и сосредоточить наше внимание на другом месте."

 secondgreatwar_peacedeals.200.d: "Франция рушится! Побежденная силой Лондонско-Берлинской оси, Французская Республика сдается. Для Турции это означает, что наступит час справедливости. Унизительные требования Севреса, который поставил Леванта под французский контроль, наконец, могут быть отменены. Мы примем их капитуляцию и позаботимся о том, чтобы Сирия и Ливан вернулись на свое законное место."

 secondgreatwar_peacedeals.201.d: "Итальянцы сдались! После того, как их французские союзники потерпели поражение, Рим капитулировал Лондонско-Берлинскую ось. Это наш шанс вернуть анатолийские земли, несправедливо оккупированные Италией после Великой войны, вместе с Додеканскими островами в Эгейском море. Унизительные условия, навязанные нам, наконец, были отменены. Мы принимаем их капитуляцию и восстановим суверенитет [ROOT.GetAductive Cap]."

 #Eastern Europe
 secondgreatwar_start.1.d: "Война охватила Европу. По мере того, как мы сталкиваемся с грозным германо-британским альянсом, наши ресурсы растягиваются до предела. Теперь наши гарантии, предоставляемые в мирное время буферным государствам между Германией и Советским Союзом, кажутся несостоятельными. Мы просто не в состоянии проецировать власть на восток, защищая свои границы от вторжения. Защита Франции должна быть нашим абсолютным приоритетом. Мы не можем позволить себе выполнять эти далеко идущие обязательства, когда сама родина находится в опасности."

 secondgreatwar_start.2: "Французская гарантия отменена. Пэрис заявил, что он не может более выполнять свое обязательство защищать наши границы, что делает нас стратегически изолированными, пойманными между возрождающейся Германией и экспансионистским Советским Союзом, не имеющим большой власти, способной обеспечить наш суверенитет. Мы должны полагаться исключительно на нашу собственную силу для выживания."

 secondgreatwar_flavour.1.d: "По мере распространения конфликта правительство [от Гетнама] заявило о своей враждебности по отношению к нам, официально вступив в войну на стороне наших врагов, и теперь мы должны подготовиться к встрече с новым противником на поле боя."

 lion_falls_northamerica.2.d: "С падением Канады на войска США британский лев был изгнан из Северной Америки. 1812 год отомщен, и теперь мы стоим как гегемон Нового Мира. Дальнейшие наземные операции в Северной Америке теперь явно неприемлемы для британской армии, и Королевский флот был сведен к простому запугиванию. Перед лицом этой реальности правительство Его Величества выдвинуло официальные мирные условия. Несмотря на то, что отправка из Лондона представляет собой яркое чтение. Они готовы уступить остающиеся континентальные владения - все Канада и Ньюфаундленд - в обмен на немедленное прекращение боевых действий. Они, по сути, сдают нам континент. ~ А как победители, мы можем принять их предложение и закрепить наши завоевания; Красный энсин будет заменен звездами и полосами во всей Северной Америке. Однако некоторые голоса в Конгрессе призывают отказаться от этих условий. Они утверждают, что принятие этих условий является ошибкой. Это наш шанс, они утверждают, сражаться с войной до его окончательного заключения, сломать Королевский флот и покончить с Британской Империей Империей ради добра."


 #Entente Win
  # Event 1: France initiates
 secondgreatwar_entente.1.d: "В то время как немецкий рейх наконец-то встал на колени, пламя войны на континенте начало ослабевать. Однако через канал британцы остаются непокорными в своей островной крепости. В то время как наши военные командиры предполагают возможность вторжения на Британские острова, цена французских жизней будет астрономической. Рим и Париж теперь стоят в качестве хозяев Европы; возможно, настало время предложить Лондону мир с честью: перемирие, которое гарантирует наши завоевания, оберегая обе страны от ужасов резни в поперечной трубе."

  # Event 2: Italy is consulted
 secondgreatwar_entente.2.d: "Наши союзники в Париже обратились к нам с важным предложением: они считают, что с побежденной Германией война пришла к естественному завершению. Они предлагают совместное дипломатическое наступление: предложение о перемирии Британской империи. В соответствии с этими условиями наши вновь завоеванные позиции в Средиземноморье и Африке будут признаны в обмен на прекращение боевых действий против британской материковой части. Поддержим ли мы французов в этом начинании или же нам следует настаивать на полном унижении британского льва?"

  # Event 3: Italy agrees, France prepares the message
 secondgreatwar_entente.3.d: "Итальянское правительство дало сигнал о своем согласии. Они готовы поддержать нас, предлагая условия Британии. Разработано официальное коммюнике, в котором излагаются наши колониальные требования и восстановление всеобщего мира в Европе. Теперь взоры мира обращены к Лондону. Выберут ли они прагматическое выживание или борьбу до горького конца?"

  # Event 4: The Offer reaches London
 secondgreatwar_entente.4.t: "Предложение о перемирии"
 secondgreatwar_entente.4.d: "Официальный дипломатический посланник из возглавляемого Францией сообщества прибыл через нейтральное судно. Их послание прямо: война на континенте окончена, и Великобритания стоит в одиночестве. Они предлагают нам «Мир с честью»: прекращение всех боевых действий и гарантированная целостность островов. Однако цена высока. Мы должны признать французскую гегемонию в Европе, уступить жизненно важные колониальные интересы Африки итальянцам и французам и отказаться от наших европейских союзников к их судьбе. Отказаться от призыва к долгой, одинокой борьбе против единого континента; признать, что эра британского господства закончилась."

  # Event 5: Britain Accepts (Notification for France)
 secondgreatwar_entente.5.t: "Оружие падает тихо"
 secondgreatwar_entente.5.d: "Лондон проглотил горькую таблетку, британское правительство официально приняло наши условия перемирия, хотя Британская империя остается нетронутой по имени, они фактически были изгнаны из Европы, и их колониальные уступки значительно укрепили нашу позицию после многих лет кровопролития, в конце концов, на континенте был восстановлен общий мир."

  # Event 6: Britain Refuses (Notification for France)
 secondgreatwar_entente.6.t: "Британский беспорядок"
 secondgreatwar_entente.6.d: "Английский ответ был столь же кратким, как и спорный: «Мы никогда не сдадимся». Похоже, что Лондон удовлетворен тем, как мир горит, а не признанием нового европейского порядка. Наши дипломаты были отправлены домой, и наши генералы завершают планы неизбежного вторжения на острова. Война продолжается."

  # Event 7: European Minors consider their future
 secondgreatwar_entente.7.t: "Континентальное урегулирование"
 secondgreatwar_entente.7.d: "Великие державы уже разговаривали, когда Франция и Италия подписали официальное перемирие с Британской империей, вторая Великая война на Западе закончилась."

 secondgreatwar_gerdefeat.1.d: "Лондонско-Берлинская ось, которая когда-то угрожала задушить ядро Европы, наконец-то была разрушена. По мере того, как наши объединенные силы укрепляют свои позиции на руинах Немецкого Рейха, масштабы этого триумфа становятся очевидными. Несмотря на отчаянные усилия британцев по укреплению своего континентального союзника, немецкая военная машина находится в состоянии окончательного кровопролития. Лондон теперь находится в положении изоляции, не по своему выбору, а по самой силе нашего оружия. Хотя британцы по-прежнему закрепляют свое влияние через канал, их влияние на материковую часть полностью погасло; теперь они являются клеточной силой, беспомощно наблюдающей за тем, как мы перекроем карту Европы. Это, вероятно, займет год военно-морских постов и реализации их безнадежной позиции, прежде чем британское правительство будет готово предложить официальные мирные условия."

 secondgreatwar_fixes.1.d: "Поскольку Германия отказывается от военных усилий и наша родина полностью изолирована от наших оставшихся союзников, Болгария оказывается в состоянии вести безнадёжную войну, окруженную нейтральными или враждебными границами, наши силы сталкиваются с неизбежной войной выбытия против Франции и ее союзников, которую мы не можем выиграть."

 secondgreatwar_fixes.2.d: "Отрезанные от своих союзников и изолированные на Балканах, болгарское правительство официально потребовало прекращения огня. Признавая, что у них нет практического пути к победе, София готова согласиться с жесткими условиями в обмен на немедленное прекращение боевых действий. Несмотря на то, что некоторые хардлайнеры требуют безоговорочной капитуляции, наши дипломаты предполагают, что введение жестких военных ограничений и ограничений на демилитаризацию обеспечит защиту наших интересов в регионе без необходимости проведения дорогостоящей военной кампании для оккупации страны."

 secondgreatwar_fixes.3.d: "Французское правительство вернулось со своими условиями для мира. Условия являются жесткими: немедленное прекращение боевых действий, жесткие ограничения в отношении численности и оснащения наших вооруженных сил, а также демобилизация наших фронтальных дивизий. Несмотря на то, что эти условия ознаменуют собой горькую главу в нашей истории, они гарантируют выживание болгарского государства и приводят к прекращению войны, которую мы больше не можем выиграть."
