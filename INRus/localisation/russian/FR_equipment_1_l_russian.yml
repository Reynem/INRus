 GER_medium_tank_aa_equipment_1: "Флакпанцер III Мёбельваген"
 GER_medium_tank_aa_equipment_1_short: "Мёбельваген"
 GER_medium_tank_aa_equipment_1_desc: "Ник по имени Мёбельваген (Furniture Van) из-за своей коробочной турниры, когда она была закрыта, это был самоходный зенитный пистолет, построенный из шасси танка Panzer III и вооруженный 20-миллиметровым квадровым ружьем."
 GER_medium_tank_aa_equipment_2: "Флакпанзер IV Острый ветром"
 GER_medium_tank_aa_equipment_2_short: "Острый ветер"
 GER_medium_tank_aa_equipment_2_desc: "Flackpanzer IV "Ostwind" (немецкий: "East Wind") был самоходным зенитным пистолетом, основанным на танке Panzer IV. Он был разработан в 1944 году в качестве преемника ранее Flackpanzer IV. Турнир Panzer IV был снят и заменен открытой шестиугольной турнирной трубой, в которой находилось 3,7 см FlaK 43. Конструкция закрытого верха была бы более предпочтительной, но это было невозможно из-за сильного дыма, возникшего из этого оружия."
 GER_medium_tank_aa_equipment_3: "Флакпанцер Коэлян"
 GER_medium_tank_aa_equipment_3_short: "Куэльцы"
 GER_medium_tank_aa_equipment_3_desc: "Флакпанзер Коелиан был самоходным зенитным проектировщиком Рейнметалла во время Второй мировой войны для вооруженных сил Германии. Он должен был быть вооружен 2 3,7 см пистолетом FlaK 43 в полностью закрытой вращающейся башне на корпусе средней танки Зигфрида, но не был построен до окончания войны в Европе."
