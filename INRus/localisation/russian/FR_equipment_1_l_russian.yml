l_russian:

 gw_tank_equipment: "Великий Военный Танк"
 gw_tank_equipment_short: "Великий Военный Танк"
 gw_tank_equipment_desc: "Танки во время Первой мировой войны были разработаны отдельно и одновременно Соединенным Королевством и Францией в качестве средства выхода из тупика, в котором находятся траншеи на Западном фронте. Танк был принят Великобританией на ранних этапах их разработки в качестве меры безопасности для сокрытия своей цели. Ранние танки были вооружены пулеметами и небольшими пушками, медленно двигались и были снабжены оружием только для того, чтобы остановить огонь из стрелкового оружия."
 AUS_gw_tank_equipment: "Burstyn Motorgescheetz"
 AUS_gw_tank_equipment_short: "Бёрстин"
 AUS_gw_tank_equipment_desc: "Бёрстин Мотоггешец был первым танком, который был изготовлен и использован австрийской армией во время Великой войны. Приобретение очень современных особенностей и довольно мощного вооружения, которое было использовано австрийской армией в защиту Австро-Венгерской восточной границы против российской армии. В это время было построено только 30 единиц оружия."
 GER_gw_tank_equipment: "Панцерваген A7V"
 GER_gw_tank_equipment_short: "A7V"
 GER_gw_tank_equipment_desc: "В 1918 году, во время Великой войны, Германия ввела танк A7V. В начале 1917 года было заказано 100 шасси, 10 из которых должны были быть закончены в качестве боевых машин с бронированными телами, а остальные - в качестве грузовых перевозчиков Уберландвагена. Позднее их число было увеличено до 20, они использовались в бою с марта по октябрь 1918 года и были единственными танками, когда-либо произведенными немецкими кайсереихами."
