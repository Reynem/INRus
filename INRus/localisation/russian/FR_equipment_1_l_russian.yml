 amphibious_tank_equipment_1_desc: "По сути, легковолокнистый резервуар, модифицированный для плавания, этот автомобиль обеспечивает пожарную поддержку для подразделений, устанавливающих пляжную головку."
 amphibious_tank_equipment_2_desc: "Средние резервуары, модифицированные для перевозки по воде, добавляются к разносторонности и мобильности за счет снижения топливной эффективности."
