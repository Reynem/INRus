 light_tank_destroyer_equipment_desc: "Уничтожение цистерн - это танки с более высоким, чем обычно, количеством пушек в неподвижном положении вместо башни. Уничтожение легких танков основано на шасси легких цистерн, что означает, что они достаточно мобильны, но не носят особенно мощное оружие по сравнению с более тяжелыми ТТ."
