 AUS_heavy_tank_equipment_3_short: "Тип 100"
 AUS_heavy_tank_equipment_3_desc: ""Austro Daimler Typ 100" был первым тяжёлым австрийским танком, который был создан самой элитой австрийских инженеров Austro Daimler Typ 100 вместе с 11 см бронежилетами и современными радиостанциями."
 GER_heavy_tank_equipment_3: "Панзеркампфваген Лоэнгрин"
 GER_heavy_tank_equipment_3_short: "Лохенгрин"
 GER_heavy_tank_equipment_3_desc: "Известный под неформальным именем Лохенгрин, названный в честь легендарного рыцаря и сына Парциваля в Норвежской мифологии, дизайн был построен по той же концепции, что и Parzival, но должен был быть еще более грозным. Лохенгрин объединил толстые доспехи Парциваля с склонёнными доспехами, которые использовались на средней цистерне Siegfried. Танк весил почти 70 метрических тонн, был защищен от 100 до 180 мм бронежилетов на фронте и был вооружен длинной бочкой 8,8 см Kampfwagenkanone 43 L/71."
