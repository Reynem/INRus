 amphibious_mechanized_equipment_desc: "Амфибийные тракторы, или амтраки, позволяют высадить морских пехотинцев на пляже под бронированной защитой."
 amphibious_mechanized_equipment_1: "Основной амфибийный трактор"
 amphibious_mechanized_equipment_1_short: "Базовая амтрак"
 amphibious_mechanized_equipment_1_desc: "Амфибийные тракторы, или амтраки, позволяют высадить морских пехотинцев на пляже под бронированной защитой."
 amphibious_mechanized_equipment_2: "Усовершенствованный амфибийный трактор"
 amphibious_mechanized_equipment_2_short: "Усовершенствованный амтрак"
 amphibious_mechanized_equipment_2_desc: "Эти амтраки имеют несколько усовершенствований по сравнению с базовой версией, таких, как задняя погрузочная аппарель для облегчения разгрузки на пляже."
 amphibious_tank_equipment: "Цистерны с амфибиями"
 amphibious_tank_equipment_short: "Цистерны"
 amphibious_tank_equipment_1: "Базовая амфибийная цистерна"
 amphibious_tank_equipment_2: "Усовершенствованный амфибийный бак"
