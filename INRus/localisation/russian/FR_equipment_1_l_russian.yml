 light_tank_equipment_1_short: "L. Цистерна I"
 light_tank_equipment_1_desc: "Легкие танки являются небольшими, быстродействующими, способными как разведать, так и бороться с легко бронированными противниками."
 AUS_light_tank_equipment_1: "Steyr Typ C"
 AUS_light_tank_equipment_1_short: "Steyr Typ C"
 AUS_light_tank_equipment_1_desc: "Steyr Typ C был первым танком, который был разработан и изготовлен Австрийской Республикой после WW1."
 GER_light_tank_equipment_1: "Панзеркампфваген I"
 GER_light_tank_equipment_1_short: "Панцер I"
 GER_light_tank_equipment_1_desc: "Panzer I — легкий танк, производимый в Германии в 1930-х годах. Проект Panzer I начался в 1932 году, а массовое производство началось в 1934 году, и только в качестве тренировочного танка, предназначенного для внедрения концепции бронебойной войны в немецкой армии, PzKpfw I широко использовался в бою из-за отсутствия более современных танков."
