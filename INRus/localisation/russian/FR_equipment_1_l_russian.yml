 light_tank_equipment_2: "Легкий танк II"
 light_tank_equipment_2_short: "L. Танк II"
 light_tank_equipment_2_desc: "Легкие танки являются небольшими, быстродействующими, способными как разведать, так и бороться с легко бронированными противниками."
 AUS_light_tank_equipment_2: "Steyr Typ F"
 AUS_light_tank_equipment_2_short: "Steyr Typ F"
 AUS_light_tank_equipment_2_desc: "В то время как Steyr Typ F изначально был спроектирован как опорный танк, в то время как были разработаны более крупные, более мощные танки, но в ходе Второй Великой войны он увидел широкое применение в бою из-за отсутствия более способных танков."
 GER_light_tank_equipment_2: "Панзеркампфваген II"
 GER_light_tank_equipment_2_short: "Панцер II"
 GER_light_tank_equipment_2_desc: ""Panzer II" изначально была задумана как остановка, в то время как были разработаны более крупные, более совершенные танки, но она стала широко использоваться в бою из-за отсутствия более способных танков."
 light_tank_equipment_3: "Легкий танк III"
 light_tank_equipment_3_short: "L. Танк III"
 light_tank_equipment_3_desc: "Легкие танки являются небольшими, быстродействующими, способными как разведать, так и бороться с легко бронированными противниками."
 AUS_light_tank_equipment_3: "Steyr Typ L Bergziege"
 AUS_light_tank_equipment_3_short: "Steyr Typ L Bergziege"
 AUS_light_tank_equipment_3_desc: "Steyr Typ L () — легкой танк, разработанный в 1942 году после того, как австрийский генеральный штаб увидел необходимость в быстром разведывательных машинах для дальнейшего расширения своих оборонительных возможностей, в результате чего Бергзиге был вооружен 50-мм пушкой и достиг скорости до 70 КМ/ч."
 GER_light_tank_equipment_3: "Panzeraufklärer Zecke"
 GER_light_tank_equipment_3_short: "Зекке"
 GER_light_tank_equipment_3_desc: "VK 1337 Zecke — легкий танк, разработанный в 1942 году после более широкого использования панцергренадиеров в немецкой армии, когда ОКВ обнаружила необходимость введения быстрого и легкого разведывательных машин для поддержки панцергренадиеров, в результате чего Zecke была вооружена 50-ммм пушкой и достигла скорости до 70 КМ/ч."
