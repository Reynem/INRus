 medium_tank_destroyer_equipment: "Уничтожение среднегабаритного бака"
 medium_tank_destroyer_equipment_short: "M. Уничтожение танков"
 medium_tank_destroyer_equipment_desc: "Уничтожение цистерн представляет собой танки с более высоким, чем обычно, количеством пушек, установленных вместо батареи. Уничтожение цистерн средней грузоподъемности основано на шасси средних цистерн, т.е. они достаточно подвижны и обладают респектабельной огневой мощью."
 medium_tank_destroyer_equipment_1: "Уничтожение танка I"
 medium_tank_destroyer_equipment_1_short: "М. TD I"
 medium_tank_destroyer_equipment_1_desc: "Уничтожение цистерн представляет собой танки с более высоким, чем обычно, количеством пушек, установленных вместо батареи. Уничтожение цистерн средней грузоподъемности основано на шасси средних цистерн, т.е. они достаточно подвижны и обладают респектабельной огневой мощью."
 medium_tank_destroyer_equipment_2: "Уничтожение средней цистерны II"
 medium_tank_destroyer_equipment_2_short: "М. TD II"
 medium_tank_destroyer_equipment_2_desc: "Уничтожение цистерн представляет собой танки с более высоким, чем обычно, количеством пушек, установленных вместо батареи. Уничтожение цистерн средней грузоподъемности основано на шасси средних цистерн, т.е. они достаточно подвижны и обладают респектабельной огневой мощью."
 medium_tank_destroyer_equipment_3: "Уничтожение танка III"
 medium_tank_destroyer_equipment_3_short: "М. TD III"
 medium_tank_destroyer_equipment_3_desc: "Уничтожение цистерн представляет собой танки с более высоким, чем обычно, количеством пушек, установленных вместо батареи. Уничтожение цистерн средней грузоподъемности основано на шасси средних цистерн, т.е. они достаточно подвижны и обладают респектабельной огневой мощью."
 GER_medium_tank_destroyer_equipment_1: "Штурмгешц III"
 GER_medium_tank_destroyer_equipment_1_short: "Стюг III"
 GER_medium_tank_destroyer_equipment_1_desc: "Штурмгешютц III был самым бронебойным боевым автомобилем Германии во время Второй мировой войны. Он был построен на шасси испытанного танка Panzer III. Первоначально задуманного как мобильный, бронированный лёгкий пистолет для пехоты, StuG постоянно модифицировался и широко использовался в качестве уничтожителя танков."
 GER_medium_tank_destroyer_equipment_2: "Ягдпанцер IV"
 GER_medium_tank_destroyer_equipment_2_short: "JagdPz IV"
 GER_medium_tank_destroyer_equipment_2_desc: "Ягдпанзер IV служил в противотанковых секциях Панцера и СС Панзера. Они сражались в Нормандии, в битве при Бульге и на восточном фронте. Они были очень успешными уничтожителями танков, но плохо сработали, когда они использовались в качестве заменителей танков или штурмовых пушек, как это было в большинстве случаев. Однако на более поздних этапах войны они все чаще использовались в качестве заменителей танков, поскольку зачастую не было никаких других средств."
 GER_medium_tank_destroyer_equipment_3: "Грампанцер"
 GER_medium_tank_destroyer_equipment_3_short: "Грампанцер"
 GER_medium_tank_destroyer_equipment_3_desc: "Грэмпанзер (названный в честь легендарного меча Сигфрида из Норсской мифологии) был эсминецом-танкером, построенным Валькистской Германией во время Второй Великой войны на шасси танка «Зигфрид». Он вошёл в эксплуатацию в конце войны (1944 год) и посмотрел на восточном и западном фронтах. «Грэмпанцер» объединил очень мощную 8,8 см пушка «ПаК 43» нотунга и характерно отличные бронежилеты и подвеску шасси «Зигфрид», хотя он пострадал от общего плохого состояния Германии в конце войны, что привело к небольшому количеству производства, нехватке запасных частей и плохой подготовке экипажей."
