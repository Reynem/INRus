 medium_tank_equipment_3_short: "M. Танк III"
 medium_tank_equipment_3_desc: "Средние цистерны являются достаточно быстродействующими многоцелевыми цистернами, способными выполнять многие функции, такие, как разведчики, опорные или даже передние цистерны."
 AUS_medium_tank_equipment_3: "Стейр Тайп III""
 AUS_medium_tank_equipment_3_short: "Steyr Typ III"
 AUS_medium_tank_equipment_3_desc: "Проект Steyr Typ III был предложен в конце 1942 года и был разработан для противодействия новым международным дизайнам, которые были вооружены 775 см пистолетом и очень мощным двигателем, чтобы компенсировать сравнительно слабые доспехи. Прототипы, как утверждается, достигли максимальной скорости 60 KM/ч."
 GER_medium_tank_equipment_3: "Панзеркампфваген V "Сигфрид""
 GER_medium_tank_equipment_3_short: "Зигфрид"
 GER_medium_tank_equipment_3_desc: "Зигфрид является прозвищем Панзеркампфвагена V, который широко использовался в германской армии после разработки в 1942 году. Он был основан на опыте немецкой армии в России с T-34 и был построен в нарушение этого, а также в качестве замены устаревшего Панзера III и Панзера IV. Его прекрасное сочетание огневой мощи, защиты и мобильности сделало его контрольным показателем для других национальных танков. Зигфрид стал известен как один из лучших танков второй Великой Войны."
