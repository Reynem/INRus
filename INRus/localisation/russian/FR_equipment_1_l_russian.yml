 tank_aa_upgrade: "Противоядие"
 tank_aa_upgrade_desc: "Обеспечивать, чтобы наше противовоздушное оружие могло сбить последние самолеты."
 tank_at_upgrade: "Антитанковое вооружение"
 tank_at_upgrade_desc: "Убедись, что наши танки смогут победить последние вражеские танки."
 tank_art_upgrade: "Артиллерийское оружие"
 tank_art_upgrade_desc:1 "Позаботьтесь о том, чтобы у нашей самоходной артиллерии была огромная огневая мощь, которая разрушит всех небронированных врагов."
 tank_reliability_upgrade: "Надежность"
 tank_reliability_upgrade_desc: "Повышение надежности ведет к меньшему разрушению цистерн, которые нужно заменить."
 tank_engine_upgrade: "Двигатель"
 tank_engine_upgrade_desc: "Более высокая мобильность дает тактические и стратегические преимущества, а также позволяет увеличить количество доспехов без существенного замедления."
 ship_gun_upgrade: "Оружие"
 ship_gun_upgrade_desc: "Важно иметь оружие, которое не отставало бы от бронебойной силы и могло бы проникнуть внутрь."
 ship_torpedo_upgrade: "Торпедо"
 ship_torpedo_upgrade_desc: "Торпеда - это мощное нападение, которое может совершить менее крупные корабли, когда-то находившиеся в дальнем радиусе, с высокой вероятностью критических ударов"
 ship_armor_upgrade: "Бронирование"
 ship_armor_upgrade_desc: "Больше доспехов, чтобы защитить корабль от огня против врага"
 carrier_armor_upgrade: "Бронирование"
 carrier_armor_upgrade_desc: "Больше доспехов, чтобы защитить корабль от огня против врага"
 ship_engine_upgrade: "Двигатель"
 ship_engine_upgrade_desc: "Корабль с более мощным двигателем может контролировать расстояние до своих противников в бою"
 ship_reliability_upgrade: "Надежность"
 ship_reliability_upgrade_desc: "Корабль с высокой надежностью будет менее предрасположен к критическим ударам, которые могут нанести огромный ущерб судну без хорошо продуманной конструкции."
 ship_anti_air_upgrade: "Противоядие"
 ship_anti_air_upgrade_desc: "Ещё больше пушек в воздухе, значит больше вражеских самолётов сбито!"
 ship_ASW_upgrade: "АСО"
 ship_ASW_upgrade_desc: "Антиподводные боеголовки имеют важное значение для обнаружения и вывода подводных лодок."
 destroyer_engine_upgrade: "Двигатель"
 destroyer_engine_upgrade_desc: "Корабль с более мощным двигателем может контролировать расстояние до своих противников в бою"
 sub_engine_upgrade: "Двигатель"
 sub_engine_upgrade_desc: "Корабль с более мощным двигателем может контролировать расстояние до своих противников в бою"
 sub_stealth_upgrade: "Кража"
 sub_stealth_upgrade_desc: "Самые сильные подводные лодки — это их способность оставаться незамеченными и наносить удар только тогда, когда у них есть преимущество."
 sub_torpedo_upgrade: "Торпедо"
 sub_torpedo_upgrade_desc: "Торпеда - это мощное нападение, которое может совершить менее крупные корабли, когда-то находившиеся в дальнем радиусе, с высокой вероятностью критических ударов"
 ship_deckspace_upgrade: "Палубное пространство"
 ship_deckspace_upgrade_desc: "Больше места для ношения и запуска самолётов, способных к запуску"
 plane_gun_upgrade: "Оружие"
 plane_gun_upgrade_desc: "Лучшее оружие, чтобы сражаться с другими самолетами"
 cv_plane_gun_upgrade: "Оружие"
 cv_plane_gun_upgrade_desc: "Лучшее оружие, чтобы сражаться с другими самолетами"
 plane_engine_upgrade: "Двигатель"
 plane_engine_upgrade_desc: "Более высокая скорость дает самолету преимущество, когда речь идет о местоположении и выборе цели. Важное значение для перехватчиков."
 plane_range_upgrade: "Диапазон"
 plane_range_upgrade_desc: "Самолет с более высокой дальностью полета может охватить более стратегические области для миссий"
 cv_plane_range_upgrade: "Диапазон"
 cv_plane_range_upgrade_desc: "Самолет с более высокой дальностью полета может охватить более стратегические области для миссий"
 plane_reliability_upgrade: "Надежность"
 plane_reliability_upgrade_desc: "Самолет с низкой надежностью может вспыхнуть вскоре после выхода из взлетно-посадочной полосы."
 plane_naval_upgrade: "Нападение"
 plane_naval_upgrade_desc: "Больше боевого потенциала для создания противокорабельного оружия."
 cv_plane_naval_upgrade: "Нападение"
 cv_plane_naval_upgrade_desc: "Больше боевого потенциала для создания противокорабельного оружия."
 plane_bomb_upgrade: "Бомбардировка"
 plane_bomb_upgrade_desc: "Больше бомбового отсека, чтобы доставить больше полезной нагрузки."
 plane_tac_bomb_upgrade: "Бомбардировка"
 plane_tac_bomb_upgrade_desc: "Больше бомбового отсека, чтобы доставить больше полезной нагрузки."
 plane_cas_upgrade: "Нападение"
 plane_cas_upgrade_desc: "Усовершенствованное оружие для нанесения ударов по наземным целям"
