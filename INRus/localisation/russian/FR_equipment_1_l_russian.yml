 heavy_tank_equipment_1_desc: "Тяжелые танки являются большими, бронированными монстрами, которые предназначены для уничтожения вражеских танков и укреплений."
 AUS_heavy_tank_equipment_1:  "Австро Даймлер Тайп 70"
 AUS_heavy_tank_equipment_1_short: "Тип 70"
 AUS_heavy_tank_equipment_1_desc: "Austro Daimler Typ 70 — серия прототипов для разработки более тяжелого танка в Австрии. После первой мировой войны Австрия была ограничена в военном развитии Мирным договором, но секретная программа под названием «Швере Армашин» разрабатывала бронированные военные машины и артиллерию."
 GER_heavy_tank_equipment_1: "Гросстрактор"
 GER_heavy_tank_equipment_1_short: "Гросстрактор"
 GER_heavy_tank_equipment_1_desc: "После первой мировой войны Германия была ограничена военным развитием в соответствии с Версальским договором, но секретная программа под названием "Трактор" разрабатывала бронированные военные машины и артиллерию."
