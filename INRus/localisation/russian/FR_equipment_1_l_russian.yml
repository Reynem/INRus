 cat_strategic_destruction: "Стратегическое уничтожение"
 artillery_equipment_2: "Совершенствование артиллерии"
 artillery_equipment_2_desc: "Новые гаубицы с использованием новых гидравлических устройств оттока и более длинных бочек."
 artillery_equipment_3: "Продвинутая артиллерия"
 artillery_equipment_3_desc: "Легкая артиллерия, способная сломаться для транспортировки, позволяет доставлять артиллерийскую поддержку в районы, которые ранее были труднодоступными."
 anti_air_equipment_2: "Улучшенная антивоздушная система"
 anti_air_equipment_2_desc: "Противовоздушные пушки с более длинными патронами и бочками, способные нападать на летающие самолёты."
 anti_air_equipment_3: "Усовершенствованная антивоздушная система"
 anti_air_equipment_3_desc:1 "Усовершенствованный мобильный броненосец с большей досягаемости и способностью стрелять, чтобы сражаться даже с самым быстрым и наиболее летающим вражеским самолетом."
 rocket_artillery_equipment_2: "Усовершенствованная ракетная артиллерия"
 rocket_artillery_equipment_2_desc: "Стабилизированные ракеты, увеличивающие дальность применения более легких артиллерийских батарей."
 anti_tank_equipment_2: "Улучшенная антитанковая система"
 anti_tank_equipment_2_desc: "Большее калибровое оружие для борьбы с тяжёлыми танками с наклонной доспехами."
 anti_tank_equipment_3: "Усовершенствованный анти-танк"
 anti_tank_equipment_3_desc: "Сочетание различных видов новой технологии боеприпасов с пушками с более высокой скоростью, эти противотанковые пушки готовы к любым новым доспехам, которые могут появиться у наших врагов."
 motorized_rocket_equipment: "Моторизованная ракетная артиллерия"
 motorized_rocket_equipment_short: "Мот Р. Артиллерия"
 motorized_rocket_equipment_desc: "Множественные ракетные пусковые установки, такие, как эти, доставляют взрывчатые вещества в целевой район быстрее, чем обычные артиллерии, но с меньшей точностью и с меньшими затратами времени для перезарядки."
 motorized_rocket_equipment_1: "Моторизованная ракетная артиллерия"
 motorized_rocket_equipment_1_short: "Мот Р. Артиллерия"
 motorized_rocket_equipment_1_desc: "Множественные ракетные пусковые установки, такие, как эти, доставляют взрывчатые вещества в целевой район быстрее, чем обычные артиллерии, но с меньшей точностью и с меньшими затратами времени для перезарядки."
