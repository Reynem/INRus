 medium_tank_equipment_2: "Средняя цистерна II"
 medium_tank_equipment_2_short: "M. Танк II"
 medium_tank_equipment_2_desc: "Средние цистерны являются достаточно быстродействующими многоцелевыми цистернами, способными выполнять многие функции, такие, как разведчики, опорные или даже передние цистерны."
 AUS_medium_tank_equipment_2: "Steyr Typ II, Ausf.F"
 AUS_medium_tank_equipment_2_short: "Steyr Typ II, Ausf.F"
 AUS_medium_tank_equipment_2_desc: "Созданный в качестве танка пехоты, Steyr Typ II, Ausf. F изначально не предназначался для применения вражеских доспехов - эта функция выполнялась более легкой Steyr I, Ausf. B. Однако, поскольку недостатки довоенной доктрины стали очевидными перед лицом вражеских танков, Steyr Typ II, Ausf."
 GER_medium_tank_equipment_2: "Панзеркампфваген IV"
 GER_medium_tank_equipment_2_short: "Панцер IV"
 GER_medium_tank_equipment_2_desc: "Созданный как танк пехоты, Panzer IV изначально не предназначался для использования вражеских доспехов - эта функция выполнялась более легким Панзером III. Однако, поскольку стали очевидными недостатки довоенной доктрины и перед лицом советских танков T-34, Panzer IV вскоре взял на себя роль по борьбе с танками своего все более устаревшего двоюродного брата. Самый широко изготовленный и развернутый немецкий танк второй мировой войны, Panzer IV использовался в качестве базы для многих других боевых машин."
