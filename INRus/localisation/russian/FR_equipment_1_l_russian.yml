 mechanized_equipment: "Механизированная"
 mechanized_equipment_short: "Механизированная"
 mechanized_equipment_desc: "Механизированная пехота - это пехота, оснащенная бронетранспортерами или боевыми пехотными машинами (ВСГ), предназначенными для перевозки и ведения боевых действий. Механизированная пехота отличается от моторной пехоты в том смысле, что ее машины обеспечивают определенную степень защиты от враждебного огня в отличие от мягких колесных автомобилей (грузовых автомобилей или джипов) для моторной пехоты."
 mechanized_equipment_1: "Механизированное оборудование I"
 mechanized_equipment_1_short: "Механизированный I"
