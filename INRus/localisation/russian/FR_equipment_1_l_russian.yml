 GER_modern_tank_equipment_1_short: "Блутраш"
 GER_modern_tank_equipment_1_desc: "Она была разработана в 1945 году как часть Neue Serie, или NS, в результате попыток Германии создать современный Танк, который в то же время был дешевым и легко производить с акцентом на многие части, взаимозаменяемые с другими вариантами NS Tanks. Она должна была быть вооружена новым 90-миллиметровым пистолетом и иметь все технические новшества, которые немецкие инженеры могли вложить в нее, такие как инфракрасные прожекторы и полностью электрическая траверса."
