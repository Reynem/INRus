 medium_tank_artillery_equipment_short: "М. СПГ"
 medium_tank_artillery_equipment_desc: "Средняя артиллерийская пушка, установленная на средней танковой шасси, среднегабаритная огневая мощь, хотя и является достаточно мобильной."
 medium_tank_artillery_equipment_1: "Среднеспециальная артиллерия I"
 medium_tank_artillery_equipment_1_short: "М. СПГ I"
 medium_tank_artillery_equipment_1_desc: "Средняя артиллерийская пушка, установленная на средней танковой шасси, среднегабаритная огневая мощь, хотя и является достаточно мобильной."
 medium_tank_artillery_equipment_2: "Среднеспециальная артиллерия II"
 medium_tank_artillery_equipment_2_short: "M. SPG II"
 medium_tank_artillery_equipment_2_desc: "Средняя артиллерийская пушка, установленная на средней танковой шасси, среднегабаритная огневая мощь, хотя и является достаточно мобильной."
 medium_tank_artillery_equipment_3: "Средняя SP артиллерия III"
 medium_tank_artillery_equipment_3_short: "M. SPG III"
 medium_tank_artillery_equipment_3_desc: "Средняя артиллерийская пушка, установленная на средней танковой шасси, среднегабаритная огневая мощь, хотя и является достаточно мобильной."
 GER_medium_tank_artillery_equipment_1: "Гриль"
 GER_medium_tank_artillery_equipment_1_short: "Гриль"
 GER_medium_tank_artillery_equipment_1_desc: "Sd.Kfz. 138/1 Grille (немецкий: "Cricket") — самопровозглашенная артиллерийская кухня, которая использовалась Германией во время Второй мировой войны. Было произведено около 490-500 гриль. Они использовались панзерными дивизиями в Советском Союзе вместе с подразделениями в Польше и Франции. Они использовались до 1945 года, а также служили в Тунисе, где они сражались с вражескими артиллериями и танками."
 GER_medium_tank_artillery_equipment_2: "Список"
 GER_medium_tank_artillery_equipment_2_short: "Список"
 GER_medium_tank_artillery_equipment_2_desc: "Список (немецкий: "Cunning") был самоходным артиллерийским оружием, основанным на шасси Geschützwagen III/IV, вооружённым 15 см гаубицей. Он использовался немецкой Вермахтой во время Второй мировой войны с начала 1943 года до окончания войны."
 GER_medium_tank_artillery_equipment_3: "Тюкке"
 GER_medium_tank_artillery_equipment_3_short: "Тюкке"
 GER_medium_tank_artillery_equipment_3_desc: "Самоходные артиллерийские пушки, предложенные Круппом в 1944 году на основе компонентов Зигфрида с 12,8 см гаубицы."
