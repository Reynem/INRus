 medium_tank_equipment: "Средняя цистерна"
 medium_tank_equipment_desc: "Средние цистерны являются достаточно быстродействующими многоцелевыми цистернами, способными выполнять многие функции, такие, как разведчики, опорные или даже передние цистерны."
 medium_tank_equipment_1: "Средний танк I"
 medium_tank_equipment_1_short: "M. Цистерна I"
 medium_tank_equipment_1_desc: "Средние цистерны являются достаточно быстродействующими многоцелевыми цистернами, способными выполнять многие функции, такие, как разведчики, опорные или даже передние цистерны."
 AUS_medium_tank_equipment_1: "Стейр I, Ausf. B"
 AUS_medium_tank_equipment_1_short: "Стейр I, Ausf. B"
 AUS_medium_tank_equipment_1_desc: "Посмотрев на развитие танков Германии и России в начале 30-х годов, австрийский генеральный штаб понял, что ему также нужно было несколько тяжелейших танков, в то время как официально им было запрещено тайно развивать Steyr I, Ausf. B. Строение на французской Somua S35, в котором было 3 см ружье и на время было достаточно сильно бронировано."
 GER_medium_tank_equipment_1: "Панзеркампфваген III"
 GER_medium_tank_equipment_1_short: "Панцер III"
 GER_medium_tank_equipment_1_desc: "Еще в 1934/35 году генерал Хайнц Гудериан предусмотрел два основных вида оборудования для будущих немецких Панзерных дивизий. Первый автомобиль должен был быть вооружен противотанковым и двумя пулеметами, а второй — вспомогательным автомобилем с более крупным калибром. Первый в конечном итоге стал известен как Панзеркампфваген III, который должен был стать стандартным танком для трех легких рот танкового батальона. Второй был известен как Панзеркампфваген IV."
