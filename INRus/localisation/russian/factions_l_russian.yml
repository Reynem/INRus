 ## Short term Goals
 growing_the_faction: "Расширить Фракцию"
 growing_the_faction_desc: "Наша фракция должна иметь больше членов для того, чтобы серьезно относиться к ней на геополитическом этапе."
 spy_master_goal_name: "Назначить шпиона-мастера"
 spy_master_goal_desc: "Мы должны специализировать одного из наших членов на искусстве шпионажа и сбора разведданных, давая им возможность контролировать и руководить операциями нашего союза."
 convoy_sufficiency_goal_name: "Достаточность встреч"
 convoy_sufficiency_goal_desc: "Для того чтобы иметь достаточный потенциал как для снабжения наших войск за рубежом, так и для удовлетворения материальных потребностей нашей промышленности за счет импорта из-за рубежа, мы должны создать достаточно большой торговый морской флот."
 ensure_military_r_d_goal_name: "Строительство военных научно-исследовательских и опытно-конструкторских объектов"
 ensure_military_r_d_goal_desc: "Мы должны обеспечить, чтобы наша военная технология соответствовала требованиям путем строительства объектов, предназначенных для исследований и разработки передовых прототипов и новых концепций."
 military_infrastructure_goal_name: "Строительство военной инфраструктуры"
 military_infrastructure_goal_desc: "Хорошо развитая инфраструктура имеет решающее значение для обеспечения того, чтобы наши силы пограничной обороны имели необходимые им линии снабжения."
 a_great_fortress_goal_name: "Строить более крепкие фортификации"
 a_great_fortress_goal_desc: "Ключом к обеспечению готовности является обеспечение безопасности приграничных районов и ключевых пунктов, используя самые современные из укреплений, мы можем обеспечить, чтобы враг не смог победить нас."
 an_armored_fist_goal_name: "Расширить наши бронебойные силы"
 an_armored_fist_goal_desc: "Новые времена создают возможности для новой войны. Танки - это будущее. Мы должны обеспечить, чтобы у нас, как фракции, было достаточно сил, чтобы доминировать на поле боя."
 an_infantry_army_goal_name: "Расширить наши пехотные силы"
 an_infantry_army_goal_desc: "Мы нуждаемся в значительной пехоте, чтобы поддержать наши требования как на дипломатической арене, так и на местах."
 develop_ploiesti_oil_fields_goal_name: "Разработать нефтяные месторождения в Плоести"
 develop_ploiesti_oil_fields_goal_desc: "Как единственные нефтяные месторождения в Европе, нефтяные месторождения Плойети должны быть соответствующим образом эксплуатируются для обеспечения того, чтобы союз располагал топливом, необходимым для продолжения военных операций."
 develop_baku_oil_fields_goal_name: "Разработка Бакинских нефтяных месторождений"
 develop_baku_oil_fields_goal_desc: "Развитие нефтедобывающего региона Баку позволит обеспечить обширную переработку нефтепродуктов, имеющих жизненно важное значение для военных операций."
 fortify_panama_canal_goal_name: "Укрепить Панамский канал"
 fortify_gibraltar_goal_name: "Формирование Гибралтара"
 fortify_gibraltar_goal_desc: "Укрепление нашей стратегической базы на Гибралтарском проливе позволило бы нам более эффективно осуществлять контроль за морскими перевозками между Средиземным морем и Атлантикой."
 expand_maltese_bases_goal_name: "Расширение мальтийских баз"
 expand_maltese_bases_goal_desc: "Расширение наших баз на Мальте позволило бы улучшить сбои в поставках противника и проецировать энергию по всему Центральному Средиземноморью."
 fortify_bosporus_goal_name: "Укрепить босфор"
 fortify_bosporus_goal_desc: "Укрепление Босфорского пролива обеспечило бы наш контроль над всем морским доступом между Черным морем и Средиземным морем."
 fortify_bosporus_tooltip: "Очки победы §Y[773. Control. GetVictory PointName_9833]§! и §Y [340. Control. GetVictory PointName_11829]§! имеют уровень 1 §YCoastal Fort§!, уровень 1 §YLand Форт§!, и укомплектованы одним подразделением."
 fortify_dardanelles_goal_name: "Укрепить Дарданеллы"
 fortify_dardanelles_goal_desc: "Укрепление Дарданельских флотов укрепило бы нашу способность диктовать движение флота и торговых потоков из Черного моря."
 fortify_dardanelles_tooltip: "Каждая провинция в §YEdirne§!! и §YBursa§!, которая контролирует §YDardanelles§!"
 fortify_suez_canal_goal_name: "Укрепить канал Суэц"
 fortify_suez_canal_goal_desc: "Дальнейшее владение Суэцким каналом необходимо для обеспечения нашего единственного контроля над главной дорожной артерией между Европой и Азией."
 fortify_suez_tooltip: "Каждая провинция в §YSuez§!, которая контролирует §YSuez§!"
 expand_singapore_naval_base_goal_name: "Расширение военно-морской базы Сингапура"
 expand_singapore_naval_base_goal_desc: "Огромная укрепленная военно-морская база Сингапура управляет Малакским проливом и регулирует движение между Индийским и Тихим океанами."

 # Mid term Goals
 a_large_faction_goal_name: "Приглашать больше стран на нашу борьбу"
 a_large_faction_goal_desc: "Растя еще больше, наша фракция сможет проецировать свое влияние еще больше."
 aggressive_defense_goal_name: "Ущерб, причиненный агрессорам"
 aggressive_defense_goal_desc: "Мы не поддадим ни дюйма врагу, наши солдаты должны быть привиты при том понимании, что ключ не в том, чтобы умереть за нашу страну, а в том, чтобы заставить врага умереть за свою страну."
 a_military_base_goal_name: "Расширение военной промышленности"
 a_military_base_goal_desc: "Для того чтобы производить оружие в больших количествах, нам нужна сильная военная индустрия."
 a_military_base_tech_bonus: "$a_military_base_goal_name$ Goal Bonus"
 industrial_expansion_goal_name: "Промышленное развитие"
 industrial_expansion_goal_desc: "Наилучший способ создать сильную фракцию - это иметь мощную промышленную базу."
 industrial_expansion_tech_bonus: "$industrial_expansion_goal_name$ Goal Bonus"
 industrial_research_goal_name: "Строительство 4 долл. США"
 industrial_research_goal_desc: "Чтобы стать доминирующим игроком, мы должны обеспечить, чтобы у нас был промышленный ноу-хау по всей фракции."

 marine_corps_goal_name: "Создание морской пехоты"
 marine_corps_goal_desc: "Расширение наших амфибийных сил значительно увеличит наши наступательные возможности и количество территории противника, которую мы можем поставить под угрозу."
 marine_corps_tech_bonus: "$marine_corps_goal_name$ Goal Bonus"
 airborne_corps_goal_name: "Создание корпуса воздушных судов"
 airborne_corps_goal_desc: "Расширение наших воздушных сил значительно повысит нашу наступательную гибкость и позволит нам нанести более глубокий удар по вражеской территории."
 airborne_corps_tech_bonus: "$airborne_corps_goal_name$ Goal Bonus"
 mountaineer_corps_goal_name: "Создать горный корпус"
 mountaineer_corps_goal_desc: "Расширение наших горных войск значительно увеличит способность нашей армии бороться с этой неустойчивой и трудной местностью."
 mountaineer_corps_tech_bonus: "$mountaineer_corps_goal_name$ Goal Bonus"
 submarine_force_goal_name: "Расширить подводной флот"
 submarine_force_goal_desc: "Приемлемые подводные силы имеют важнейшее значение для унизительных линий снабжения противника."
 submarine_force_tech_bonus: "$submarine_force_goal_name$ Goal Bonus"
 convoy_escort_force_goal_name: "Сопровождение встреч через океаны"
 convoy_escort_force_goal_desc: "Для обеспечения безопасности наших линий снабжения мы должны обеспечить достаточное количество сопровождающих судов."
 convoy_escort_force_tech_bonus: "$convoy_escort_force_goal_name$ Goal Bonus"
 air_superiority_goal_name: "Сохранять величие в воздухе"
 air_superiority_goal_desc: "Контроль над воздухом требует успеха как на суше, так и на море."
 air_superiority_tech_bonus: "$air_superiority_goal_name$ Goal Bonus"
 control_ploiesti_oil_fields_goal_name: "Контроль за нефтяными месторождениями Плоешти"
 control_ploiesti_oil_fields_goal_desc: "Будучи единственными нефтяными месторождениями в Европе, контроль над нефтяными месторождениями Плойети имеет неоценимое значение для обеспечения того, чтобы союз располагал топливом, необходимым для продолжения военных операций."
 control_baku_oil_fields_goal_name: "Контроль за нефтяными месторождениями Баку"
 control_baku_oil_fields_goal_desc: "Обеспечение безопасности в Бакинском нефтяном регионе позволит получить доступ к обширным нефтяным запасам, имеющим жизненно важное значение для военных операций."
 control_panama_canal_goal_name: "Контролировать Панамский канал"
 control_panama_canal_goal_desc: "Контроль над Панамским каналом имеет жизненно важное значение для обеспечения быстрой передислокации флота между Атлантикой и Тихим океаном, обеспечивая стратегическую гибкость по обоим океанам."
 control_gibraltar_goal_name: "Контроль над Гибралтаром"
 control_gibraltar_goal_desc: "Стратегическая база Гибралтарского пролива позволит нам осуществлять контроль за морскими перевозками между Средиземным морем и Атлантикой."
 control_malta_goal_name: "Контрольная Мальта"
 control_malta_goal_desc: "Владение Мальтой позволило бы нарушить системы снабжения противника и проецировать энергию по всему Центральному Средиземноморью."
 control_bosporus_goal_name: "Контролировать босфор"
 control_bosporus_goal_desc: "Изъятие Босфорского пролива позволит нам контролировать весь морской доступ между Черным морем и Средиземным морем."
 control_dardanelles_goal_name: "Контролировать Дарданель"
 control_dardanelles_goal_desc: "Держание Дарданеллей позволит диктовать движение флота и торговых потоков из Черного моря."
 control_suez_canal_goal_name: "Контролировать канал Суэц"
 control_suez_canal_goal_desc: "Владение жизненно важным Суэцким каналом даст нам единственный контроль над главной дорожной артерией между Европой и Азией, обеспечивая быструю передачу сил и ресурсов."
 control_singapore_goal_name: "Контроль в Сингапуре"
 control_singapore_goal_desc: "Огромная укрепленная военно-морская база Сингапура управляет Малакским проливом и регулирует движение между Индийским и Тихим океанами."

 # Long term goals
 industrial_domination_goal_name: "Расширение гражданской промышленности"
 industrial_domination_goal_desc: "Современные военные действия связаны с производственными возможностями."
 rule_the_waves_goal_name: "Править Волнами"
 rule_the_waves_goal_desc: "Для того чтобы по-настоящему доминировать в океане, необходим большой флот, а ключевым компонентом большого флота являются Капитальные корабли."
 rule_the_waves_tech_bonus: "Править целью Волны"
 strategic_bombing_campaign_goal_name: "Устойчивые стратегические кампании по бомбардировке"
 strategic_bombing_campaign_goal_desc: "Крупномасштабная кампания стратегических бомбардировок будет систематически подрывать промышленный потенциал противника, что позволит нам истощить их силы."
 liberate_territory_goal_name: "Освободить нашу территорию"
 liberate_territory_goal_desc: "Наша территория принадлежит врагу, и освобождение должно быть нашей первой целью."
 great_offensive_goal_name: "Провести великое наступление"
 great_offensive_goal_desc: "Великий наступательный захват вражеской территории должен стать нашим первым шагом на пути к окончательному завершению войны."

