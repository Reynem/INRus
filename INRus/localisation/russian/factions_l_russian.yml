 ## Short term Goals
 growing_the_faction: "Расширить фракцию"
 growing_the_faction_desc: "Наша фракция должна расширить свой состав, чтобы с ней считались на геополитической арене."
 spy_master_goal_name: "Назначить руководителя разведки"
 spy_master_goal_desc: "Нам следует поручить одному из членов фракции руководство шпионажем и сбором разведданных, доверив ему управление операциями нашего союза."
 convoy_sufficiency_goal_name: "Обеспеченность конвоями"
 convoy_sufficiency_goal_desc: "Чтобы иметь возможность снабжать войска за рубежом и импортировать сырье для промышленности, необходимо сформировать достаточно крупный торговый флот."
 ensure_military_r_d_goal_name: "Построить НИОКР-центры"
 ensure_military_r_d_goal_desc: "Мы должны поддерживать технологический уровень армии, возводя объекты для исследований и разработки передовых прототипов."
 military_infrastructure_goal_name: "Построить военную инфраструктуру"
 military_infrastructure_goal_desc: "Развитая инфраструктура критически важна для снабжения наших приграничных сил."
 a_great_fortress_goal_name: "Построить мощные укрепления"
 a_great_fortress_goal_desc: "Готовность — залог успеха. Укрепив границы и ключевые позиции современными фортификациями, мы сделаем наше поражение невозможным."
 an_armored_fist_goal_name: "Расширить бронетанковые силы"
 an_armored_fist_goal_desc: "Новые времена требуют новых методов ведения войны. Танки — это будущее. Наша фракция должна иметь достаточно бронетехники для доминирования на поле боя."
 an_infantry_army_goal_name: "Расширить пехотные силы"
 an_infantry_army_goal_desc: "Пехота — основа любой армии. Нам нужна внушительная пехотная армия для подкрепления наших притязаний в дипломатии и на поле боя."
 develop_ploiesti_oil_fields_goal_name: "Разработать нефтяные месторождения Плоешти"
 develop_ploiesti_oil_fields_goal_desc: "Месторождения в Плоешти — единственный источник нефти в Европе, и их необходимо эффективно эксплуатировать для снабжения союза топливом."
 develop_baku_oil_fields_goal_name: "Разработать Бакинские нефтяные месторождения"
 develop_baku_oil_fields_goal_desc: "Развитие Бакинского нефтеносного района обеспечит нас переработанным топливом, необходимым для военных операций."
 fortify_panama_canal_goal_name: "Укрепить Панамский канал"
 fortify_gibraltar_goal_name: "Укрепить Гибралтар"
 fortify_gibraltar_goal_desc: "Укрепление нашей стратегической базы в Гибралтарском проливе позволит контролировать судоходство между Средиземным морем и Атлантикой."
 expand_maltese_bases_goal_name: "Расширить базы на Мальте"
 expand_maltese_bases_goal_desc: "Расширение баз на Мальте позволит нарушать снабжение противника и проецировать силу в Центральном Средиземноморье."
 fortify_bosporus_goal_name: "Укрепить Босфор"
 fortify_bosporus_goal_desc: "Фортификация Босфорского пролива обеспечит полный контроль над морским сообщением между Черным и Средиземным морями."
 fortify_bosporus_tooltip: "Победные очки §Y[773.Controller.GetVictoryPointName_9833]§! и §Y[340.Controller.GetVictoryPointName_11829]§! имеют §YПрибрежный форт§! 1-го уровня, §YСухопутный форт§! 1-го уровня и заняты одной дивизией."
 fortify_dardanelles_goal_name: "Укрепить Дарданеллы"
 fortify_dardanelles_goal_desc: "Укрепление Дарданелл позволит нам диктовать условия движения флотов и торговли из Черного моря."
 fortify_dardanelles_tooltip: "Каждая провинция в регионах §YEdirne§! и §YBursa§!, контролирующая пролив §YDardanelles§!, имеет §YПрибрежный форт§! 1-го уровня, §YСухопутный форт§! 1-го уровня и занята одной дивизией."
 fortify_suez_canal_goal_name: "Укрепить Суэцкий канал"
 fortify_suez_canal_goal_desc: "Удержание Суэцкого канала необходимо для сохранения единоличного контроля над главнейшей транспортной артерией между Европой и Азией."
 fortify_suez_tooltip: "Каждая провинция в регионе §YSuez§!, контролирующая пролив §YSuez§!, имеет §YПрибрежный форт§! 1-го уровня, §YСухопутный форт§! 1-го уровня и занята одной дивизией."
 expand_singapore_naval_base_goal_name: "Расширить военно-морскую базу в Сингапуре"
 expand_singapore_naval_base_goal_desc: "Мощная укрепленная база в Сингапуре контролирует Малаккский пролив и регулирует судоходство между Индийским и Тихим океанами. Ее следует укрепить еще сильнее."

 # Mid term Goals
 a_large_faction_goal_name: "Привлечь больше стран во фракцию"
 a_large_faction_goal_desc: "Расширяясь, наша фракция сможет проецировать свое влияние еще дальше."
 aggressive_defense_goal_name: "Нанести урон агрессорам"
 aggressive_defense_goal_desc: "Мы не уступим врагу ни пяди. Солдаты должны усвоить: задача не в том, чтобы умереть за свою страну, а в том, чтобы заставить противника умереть за свою."
 a_military_base_goal_name: "Расширить военную промышленность"
 a_military_base_goal_desc: "Борьба с коммунизмом требует оружия. Чтобы производить его в достаточных количествах, нужна сильная военная промышленность."
 a_military_base_tech_bonus: "Бонус цели: $a_military_base_goal_name$"
 industrial_expansion_goal_name: "Промышленное развитие"
 industrial_expansion_goal_desc: "Лучший способ создать сильную фракцию — сформировать мощный промышленный базис для достижения статуса великой державы."
 industrial_expansion_tech_bonus: "Бонус цели: $industrial_expansion_goal_name$"
 industrial_research_goal_name: "Изучить $construction4$"
 industrial_research_goal_desc: "Чтобы стать ключевым игроком, мы должны обеспечить промышленными технологиями всю фракцию."

 marine_corps_goal_name: "Сформировать корпус морской пехоты"
 marine_corps_goal_desc: "Развитие амфибийных сил повысит наш наступательный потенциал и расширит зоны угрозы для территории противника."
 marine_corps_tech_bonus: "Бонус цели: $marine_corps_goal_name$"
 airborne_corps_goal_name: "Сформировать воздушно-десантный корпус"
 airborne_corps_goal_desc: "Развитие воздушно-десантных сил увеличит наступательную гибкость и позволит наносить удары глубоко в тылу врага."
 airborne_corps_tech_bonus: "Бонус цели: $airborne_corps_goal_name$"
 mountaineer_corps_goal_name: "Сформировать горнострелковый корпус"
 mountaineer_corps_goal_desc: "Развитие специализированных горных войск повысит эффективность армии при ведении боев в пересеченной местности."
 mountaineer_corps_tech_bonus: "Бонус цели: $mountaineer_corps_goal_name$"
 submarine_force_goal_name: "Расширить подводный флот"
 submarine_force_goal_desc: "Развитый подводный флот критически важен для нарушения вражеских путей снабжения."
 submarine_force_tech_bonus: "Бонус цели: $submarine_force_goal_name$"
 convoy_escort_force_goal_name: "Эскортировать конвои в океане"
 convoy_escort_force_goal_desc: "Для защиты собственных путей снабжения мы должны построить достаточное количество кораблей эскорта."
 convoy_escort_force_tech_bonus: "Бонус цели: $convoy_escort_force_goal_name$"
 air_superiority_goal_name: "Удерживать превосходство в воздухе"
 air_superiority_goal_desc: "Контроль над воздухом определяет успех на суше и море. Нам необходимо достаточно истребителей для обеспечения господства в небе."
 air_superiority_tech_bonus: "Бонус цели: $air_superiority_goal_name$"
 control_ploiesti_oil_fields_goal_name: "Контролировать нефтяные месторождения Плоешти"
 control_ploiesti_oil_fields_goal_desc: "Захват единственных месторождений нефти в Европе жизненно важен для обеспечения союза топливом для военных операций."
 control_baku_oil_fields_goal_name: "Контролировать Бакинские нефтяные месторождения"
 control_baku_oil_fields_goal_desc: "Захват Бакинского нефтеносного региона даст доступ к колоссальным запасам нефти, необходимым для армии."
 control_panama_canal_goal_name: "Контролировать Панамский канал"
 control_panama_canal_goal_desc: "Контроль над Панамским каналом необходим для быстрой переброски флота между Атлантическим и Тихим океанами."
 control_gibraltar_goal_name: "Контролировать Гибралтар"
 control_gibraltar_goal_desc: "Стратегическая база в Гибралтарском проливе позволит нам контролировать морской трафик между Средиземным морем и Атлантикой."
 control_malta_goal_name: "Контролировать Мальту"
 control_malta_goal_desc: "Контроль над Мальтой позволит нарушать снабжение противника и проецировать силу в Центральном Средиземноморье."
 control_bosporus_goal_name: "Контролировать Босфор"
 control_bosporus_goal_desc: "Захват Босфорского пролива даст полный контроль над выходом из Черного моря в Средиземное."
 control_dardanelles_goal_name: "Контролировать Дарданеллы"
 control_dardanelles_goal_desc: "Удержание Дарданелл позволит диктовать движение военных и торговых флотов из Черного моря."
 control_suez_canal_goal_name: "Контролировать Суэцкий канал"
 control_suez_canal_goal_desc: "Захват Суэцкого канала даст единоличный контроль над главной транспортной артерией между Европой и Азией."
 control_singapore_goal_name: "Контролировать Сингапур"
 control_singapore_goal_desc: "Военно-морская база Сингапура контролирует Малаккский пролив и пути между Индийским и Тихим океанами. Она должна принадлежать нам."

 # Long term goals
 industrial_domination_goal_name: "Расширить гражданскую промышленность"
 industrial_domination_goal_desc: "Современная война — это война производств. Мы должны создать крупнейший промышленный потенциал в истории."
 rule_the_waves_goal_name: "Править волнами"
 rule_the_waves_goal_desc: "Для господства в океане нужен великий флот, а его основа — основные корабли."
 rule_the_waves_tech_bonus: "Бонус цели: Править волнами"
 strategic_bombing_campaign_goal_name: "Провести стратегические бомбардировки"
 strategic_bombing_campaign_goal_desc: "Масштабная кампания стратегических бомбардировок подорвет промышленность врага и истощит его силы."
 liberate_territory_goal_name: "Освободить наши территории"
 liberate_territory_goal_desc: "Противник удерживает наши земли. Их освобождение должно стать нашей первой целью."
 great_offensive_goal_name: "Провести великое наступление"
 great_offensive_goal_desc: "Крупномасштабное наступление с захватом вражеских территорий — наш первый шаг к победоносному завершению войны."

