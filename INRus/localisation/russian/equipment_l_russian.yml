  medium_tank_destroyer_equipment: "Средняя противотанковая САУ"
  medium_tank_destroyer_equipment_short: "С. ПТ-САУ"
  medium_tank_destroyer_equipment_desc: "Противотанковые САУ — это танки с более крупным, чем обычно, орудием, установленным неподвижно вместо башни. Средние истребители танков базируются на шасси средних танков, то есть они достаточно мобильны и обладают приличной огневой мощью."
