  artillery_equipment_2_desc: "Новые гаубицы с усовершенствованными гидравлическими откатными механизмами и удлинёнными стволами."
  artillery_equipment_3: "Продвинутая артиллерия"
  artillery_equipment_3_desc: "Лёгкая артиллерия, способная разбираться для транспортировки, позволяет доставлять артиллерийскую поддержку в труднодоступные ранее районы."

  anti_air_equipment_2: "Улучшенная зенитная система"
  anti_air_equipment_2_desc: "Зенитные орудия с удлинёнными стволами и патронниками, способные поражать высоколетящие самолёты."
  anti_air_equipment_3: "Усовершенствованная зенитная система"
  anti_air_equipment_3_desc: "Усовершенствованная мобильная зенитная артиллерия с увеличенной дальностью и скорострельностью, способная бороться даже с самыми быстрыми и высоколетящими вражескими самолётами."

  rocket_artillery_equipment_2: "Усовершенствованная реактивная артиллерия"
  rocket_artillery_equipment_2_desc: "Стабилизированные ракеты увеличивают дальность применения более лёгких артиллерийских батарей."

  anti_tank_equipment_2: "Улучшенная противотанковая система"
  anti_tank_equipment_2_desc: "Крупнокалиберное орудие для борьбы с более тяжелобронированными танками."
  anti_tank_equipment_3: "Усовершенствованная противотанковая система"
  anti_tank_equipment_3_desc: "Сочетание новых видов боеприпасов и орудий с более высокой начальной скоростью снаряда делает эти противотанковые пушки готовыми к любой новой броне противника."

  motorized_rocket_equipment: "Моторизованная реактивная артиллерия"
  motorized_rocket_equipment_short: "Мот. РА"
  motorized_rocket_equipment_desc: "Подобные системы залпового огня доставляют взрывчатку в целевой район быстрее, чем обычная артиллерия, но с меньшей точностью и более долгой перезарядкой."
  motorized_rocket_equipment_1: "Моторизованная реактивная артиллерия"
  motorized_rocket_equipment_1_short: "Мот. РА"
  motorized_rocket_equipment_1_desc: "Подобные системы залпового огня доставляют взрывчатку в целевой район быстрее, чем обычная артиллерия, но с меньшей точностью и более долгой перезарядкой."

