l_russian:
  submarine: "Подводные лодки"
  submarine_desc: "Тяжёлые подводные лодки — более крупные и мощные, с увеличенной дальностью действия, а также некоторыми возможностями для ударов по надводным целям и по берегу."
  both_cruisers_desc: "Лёгкий крейсер — это лёгкий корабль охранения. Его главная задача — защищать капитальные корабли от вражеских лёгких кораблей, но он также может нести мощные торпеды, способные повредить более крупные суда.\n\nТяжёлый крейсер — крупный бронированный крейсер, достаточно универсальный. Хороший выбор для стран, которые не могут позволить себе строить крупные капитальные корабли."
  light_cruiser: "Лёгкий крейсер"
  light_cruiser_desc: "Лёгкий корабль охранения. Его главная задача — защищать капитальные корабли от вражеских лёгких кораблей, но он также может нести мощные торпеды, способные повредить более крупные суда."
  heavy_cruiser: "Тяжёлый крейсер"
  heavy_cruiser_desc: "Крупный бронированный крейсер, достаточно универсальный. Хороший выбор для стран, которые не могут позволить себе строить крупные капитальные корабли."
  destroyer: "Эсминец"
  destroyer_desc: "Самый лёгкий корабль охранения. Его задача — защищать более крупные корабли, а также обнаруживать и уничтожать подводные лодки."
  ship_hull_light: "Лёгкий корпус"
  ship_hull_light_desc: "Самый лёгкий корабль охранения. Его задача — защищать более крупные корабли, а также обнаруживать и уничтожать подводные лодки."
  carrier: "Авианосец"
  carrier_desc: "Капитальный корабль, способный нести звенья мощных летательных аппаратов в бою, также полезен в качестве плавучего аэродрома, который можно разместить у побережья противника."
  battleship: "Линкор"
  battleship_desc: "Линкоры среднего уровня универсальны — они уравновешивают скорость, броню и огневую мощь, не превосходя противника ни в одной из этих областей."
  armor_desc: "Самая большая и прочная броня, которую можно купить за деньги."
  battle_cruiser: "Линейный крейсер"
  battle_cruiser_desc: "Капитальный корабль, часто обладающий наступательными возможностями, близкими к возможностям линкора, но с более слабым бронированием взамен на более высокую скорость."
  convoy: "Конвой"
  convoy_desc: "Конвои используются для международной торговли товарами и ресурсами, а также для переброски войск и проведения морских десантных операций."
  sh_battleship: "Дредноут"
  sh_battleship_desc: "Столь дорогостоящие вложения заслуживают надёжного сопровождения из небольших кораблей охранения."

  light_airframe: "Лёгкий планер"
  light_airframe_desc: "Самолёты на базе лёгкого планера"
  medium_airframe: "Средний планер"
  medium_airframe_desc: "Самолёты на базе среднего планера"
  heavy_airframe: "Тяжёлый планер"
  heavy_airframe_desc: "Самолёты на базе тяжёлого планера"
  jet_engines: "Реактивные двигатели"
  JET_ENGINES_SPECIAL: "Разработка реактивных двигателей является необходимым условием для создания реактивных летательных аппаратов."
  jet_engines_desc: "Как прорыв в технологии создания тяги, реактивный двигатель позволит разработать совершенно новое поколение летательных аппаратов."

  convoy_1: "Конвой"

  armored_car_equipment: "Бронеавтомобиль"
  armored_car_equipment_desc: "Лёгкие колёсные бронемашины, обычно используемые для разведки и подавления сопротивления, но могут быть оснащены и более тяжёлым вооружением."
  motorized_equipment: "Грузовой автомобиль"
  motorized_equipment_desc: "Грузовики, используемые для перевозки войск и предметов снабжения, а также для моторизации дивизий."
  motorized_equipment_0: "Ранний грузовой автомобиль"
  motorized_equipment_0_desc: "Во время Вельткрига армии начали использовать обычные гражданские грузовики для перевозки снабжения и грузового оборудования; с тех пор они стали неотъемлемой частью большинства армий."
  motorized_equipment_1: "Грузовой автомобиль"
  motorized_equipment_1_desc: "Моторизация пехоты — первый шаг на пути к механизации армии. «Гражданские грузовики» легко приспосабливаются для военных нужд: перевозки солдат, буксировки орудий, транспортировки техники и снабжения, — что значительно повышает стратегическую мобильность пехотных подразделений, которым в противном случае пришлось бы совершать марш пешком."
  support_equipment_short: "Об. поддержки"
  support_equipment: "Вспомогательное оборудование"
  support_equipment_desc: "Радиостанции, джипы, понтоны и прочее оборудование, используемое для поддержки войск."
  tech_support: "Вспомогательное оборудование"
  support_equipment_1: "Вспомогательное оборудование"
  support_equipment_1_desc: "Радиостанции, джипы, понтоны и прочее оборудование, используемое для поддержки войск."

