 anti_air_equipment: "Буксируемый противовоздушный транспорт"
 anti_air_equipment_short: "Противоядие"
 anti_air_equipment_desc: "Антивоздушная артиллерия предназначена главным образом для того, чтобы сбрасывать вражеские самолеты, хотя пулеметы быстрого действия могут также эффективно противостоять наземным целям."

