  modern_tank_equipment: "Современный танк"
  modern_tank_equipment_desc: "Современные танки — быстрые многоцелевые машины, способные выполнять различные функции: разведку, поддержку или прорыв обороны противника."
  modern_tank_equipment_1: "Современный танк"
  modern_tank_equipment_1_short: "Совр. танк"
  modern_tank_equipment_1_desc: "Современные танки — быстрые многоцелевые машины, способные выполнять различные функции: разведку, поддержку или прорыв обороны противника."

  modern_tank_artillery_equipment: "Современная САУ"
  modern_tank_artillery_equipment_desc: "Современные самоходные артиллерийские установки внешне могут напоминать танки, однако, как правило, они лишь легко бронированы — их броня скорее защищает экипаж от осколков и стрелкового оружия, чем позволяет выжить в прямом боестолкновении."
  modern_tank_artillery_equipment_1: "Современная САУ"
  modern_tank_artillery_equipment_1_short: "Совр. САУ"
  modern_tank_artillery_equipment_1_desc: "Современные самоходные артиллерийские установки внешне могут напоминать танки, однако, как правило, они лишь легко бронированы — их броня скорее защищает экипаж от осколков и стрелкового оружия, чем позволяет выжить в прямом боестолкновении."

  modern_tank_destroyer_equipment: "Современная противотанковая САУ"
  modern_tank_destroyer_equipment_desc: "Современные истребители танков — развитие ранних лёгких и средних ПТ-САУ; они делают ставку на мобильность и скрытность, а не на тяжёлую броню."
  modern_tank_destroyer_equipment_1: "Современная противотанковая САУ"
  modern_tank_destroyer_equipment_1_short: "Совр. ПТ-САУ"
  modern_tank_destroyer_equipment_1_desc: "Современные истребители танков — развитие ранних лёгких и средних ПТ-САУ; они делают ставку на мобильность и скрытность, а не на тяжёлую броню."

  modern_tank_aa_equipment: "Современная ЗСУ"
  modern_tank_aa_equipment_desc: "Сочетание зенитных ракет и быстрой зенитной артиллерии представляет смертельную угрозу для авиации."
  modern_tank_aa_equipment_1: "Современная ЗСУ"
  modern_tank_aa_equipment_1_short: "Совр. ЗСУ"
  modern_tank_aa_equipment_1_desc: "Сочетание зенитных ракет и быстрой зенитной артиллерии представляет смертельную угрозу для авиации."

  mechanized_equipment: "Механизированные"
  mechanized_equipment_short: "Механизированные"
  mechanized_equipment_desc: "Механизированная пехота — это пехота, оснащённая бронетранспортёрами (БТР) или боевыми машинами пехоты (БМП), предназначенными для перевозки личного состава и ведения боя. «Механизированная» пехота отличается от моторизованной тем, что её транспортные средства обеспечивают определённую защиту от вражеского огня, в отличие от небронированных колёсных машин (грузовиков или джипов) моторизованной пехоты."
  mechanized_equipment_1: "Механизированное оборудование I"
  mechanized_equipment_1_short: "Механизир. I"
  mechanized_equipment_1_desc: "Механизированная пехота — это пехота, оснащённая бронетранспортёрами (БТР) или боевыми машинами пехоты (БМП), предназначенными для перевозки личного состава и ведения боя. «Механизированная» пехота отличается от моторизованной тем, что её транспортные средства обеспечивают определённую защиту от вражеского огня, в отличие от небронированных колёсных машин (грузовиков или джипов) моторизованной пехоты."
  mechanized_equipment_2: "Механизированное оборудование II"
  mechanized_equipment_2_short: "Механизир. II"
  mechanized_equipment_2_desc: "Механизированная пехота — это пехота, оснащённая бронетранспортёрами (БТР) или боевыми машинами пехоты (БМП), предназначенными для перевозки личного состава и ведения боя. «Механизированная» пехота отличается от моторизованной тем, что её транспортные средства обеспечивают определённую защиту от вражеского огня, в отличие от небронированных колёсных машин (грузовиков или джипов) моторизованной пехоты."
  mechanized_equipment_3: "Механизированное оборудование III"
  mechanized_equipment_3_short: "Механизир. III"
  mechanized_equipment_3_desc: "Механизированная пехота — это пехота, оснащённая бронетранспортёрами (БТР) или боевыми машинами пехоты (БМП), предназначенными для перевозки личного состава и ведения боя. «Механизированная» пехота отличается от моторизованной тем, что её транспортные средства обеспечивают определённую защиту от вражеского огня, в отличие от небронированных колёсных машин (грузовиков или джипов) моторизованной пехоты."

  anti_air_equipment: "Буксируемая зенитная артиллерия"
  anti_air_equipment_short: "ПВО"
  anti_air_equipment_desc: "Зенитная артиллерия предназначена в первую очередь для поражения вражеских самолётов, хотя скорострельные орудия могут также эффективно применяться против наземных целей."

  anti_tank_equipment: "Буксируемая противотанковая пушка"
  anti_tank_equipment_short: "ПТО"
  anti_tank_equipment_desc: "Артиллерия, специализирующаяся на поражении бронированных целей, таких как танки; обычно стреляет бронебойными снарядами."

  anti_air_equipment_1: "Буксируемая зенитная артиллерия"
  anti_air_equipment_1_short: "ПВО"
  anti_air_equipment_1_desc: "Зенитная артиллерия предназначена в первую очередь для поражения вражеских самолётов, хотя скорострельные орудия могут также эффективно применяться против наземных целей."

