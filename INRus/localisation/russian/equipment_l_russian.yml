  gw_tank_equipment: "Танк эпохи Вельткрига"
  gw_tank_equipment_short: "Танк эпохи Вельткрига"
  gw_tank_equipment_desc: "Танки во время Вельткрига были разработаны независимо и одновременно Соединённым Королевством и Францией как средство преодоления позиционного тупика окопной войны на Западном фронте. Название «танки» было принято на ранних этапах их разработки как мера секретности для сокрытия истинного назначения машин, тогда как немецкий аналог — «Panzer» — закрепился во многих странах, находившихся под немецким влиянием. Первые танки вооружались пулемётами и небольшими орудиями, двигались медленно и имели бронирование, способное защитить лишь от стрелкового оружия."

  light_tank_equipment: "Лёгкий танк"
  light_tank_equipment_desc: "Лёгкие танки — небольшие быстроходные машины, способные как вести разведку, так и эффективно бороться с бронетехникой противника."
  light_tank_equipment_1: "Лёгкий танк I"
  light_tank_equipment_1_short: "Л. танк I"
  light_tank_equipment_1_desc: "Лёгкие танки — небольшие быстроходные машины, способные как вести разведку, так и эффективно бороться с бронетехникой противника."
  light_tank_equipment_2: "Лёгкий танк II"
  light_tank_equipment_2_short: "Л. танк II"
  light_tank_equipment_2_desc: "Лёгкие танки — небольшие быстроходные машины, способные как вести разведку, так и эффективно бороться с бронетехникой противника."
  light_tank_equipment_3: "Лёгкий танк III"
