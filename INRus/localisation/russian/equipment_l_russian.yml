  anti_tank_equipment_1_desc: "Артиллерия, специализирующаяся на поражении бронированных целей, таких как танки; обычно стреляет бронебойными снарядами."

  artillery_equipment: "Буксируемая артиллерия"
  artillery_equipment_short: "Артиллерия"
  artillery_equipment_desc: "Артиллерия — это крупнокалиберное вооружение, такое как пушки и гаубицы, обслуживаемое расчётами и способное посылать снаряды далеко за пределы эффективной дальности стрелкового оружия."

  rocket_artillery_equipment: "Буксируемая реактивная артиллерия"
  rocket_artillery_equipment_short: "РСЗО"
  rocket_artillery_equipment_desc: "Реактивная артиллерия менее точна и обладает значительно более низкой устойчивой скорострельностью по сравнению с батареями обычных артиллерийских орудий, однако способна одновременно поражать цель несколькими ракетами с разрушительным эффектом."

  artillery_equipment_1: "Буксируемая артиллерия"
  artillery_equipment_1_short: "Артиллерия"
  artillery_equipment_1_desc: "Артиллерия — это крупнокалиберное вооружение, такое как пушки и гаубицы, обслуживаемое расчётами и способное посылать снаряды далеко за пределы эффективной дальности стрелкового оружия."
  gw_artillery: "$artillery_equipment_1_short$"

