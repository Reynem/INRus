 modern_tank_equipment: "Современная цистерна"
 modern_tank_equipment_desc: "Современные цистерны являются быстродействующими многоцелевыми цистернами, способными выполнять многие функции, такие, как разведчики, опора или даже передние цистерны."
 modern_tank_equipment_1: "Современная цистерна"
 modern_tank_equipment_1_short: "Автоцистерна"
 modern_tank_equipment_1_desc: "Современные цистерны являются быстродействующими многоцелевыми цистернами, способными выполнять многие функции, такие, как разведчики, опора или даже передние цистерны."

 modern_tank_artillery_equipment: "Современная артиллерия SP"
 modern_tank_artillery_equipment_desc: "Современные самоходные артиллерийские машины могут быть поверхностно похожи на танки, но, как правило, они легко бронируются, слишком легко могут выжить в условиях боевых действий, однако они защищают свои экипажи от осколков и стрелкового оружия."
 modern_tank_artillery_equipment_1: "Современная артиллерия SP"
 modern_tank_artillery_equipment_1_short: "Современный SPG"
 modern_tank_artillery_equipment_1_desc: "Современные самоходные артиллерийские машины могут быть поверхностно похожи на танки, но, как правило, они легко бронируются, слишком легко могут выжить в условиях боевых действий, однако они защищают свои экипажи от осколков и стрелкового оружия."

 modern_tank_destroyer_equipment: "Уничтожение современных цистерн"
 modern_tank_destroyer_equipment_desc: "Современные уничтожители танков представляют собой эволюцию более ранних световых и средних TD, предпочитая мобильность и скрытность тяжелым доспехам."
 modern_tank_destroyer_equipment_1: "Уничтожение современных цистерн"
 modern_tank_destroyer_equipment_1_short: "Современный TD"
 modern_tank_destroyer_equipment_1_desc: "Современные уничтожители танков представляют собой эволюцию более ранних световых и средних TD, предпочитая мобильность и скрытность тяжелым доспехам."

 modern_tank_aa_equipment: "Современная SP Антивоздушная"
 modern_tank_aa_equipment_desc: "Сочетание противовоздушных ракет и быстродействующей противовоздушной артиллерии представляет собой смертоносную угрозу для летательных аппаратов."
 modern_tank_aa_equipment_1: "Современная SP Антивоздушная"
 modern_tank_aa_equipment_1_short: "Современная AA"
 modern_tank_aa_equipment_1_desc: "Сочетание противовоздушных ракет и быстродействующей противовоздушной артиллерии представляет собой смертоносную угрозу для летательных аппаратов."

 mechanized_equipment: "Механизированная"
 mechanized_equipment_short: "Механизированная"
 mechanized_equipment_desc: "Механизированная пехота - это пехота, оснащенная бронетранспортерами (БМП) или боевыми пехотными автомобилями (ДВС), предназначенными для перевозки и ведения боевых действий. &quot; Механизированная пехота &quot; отличается от моторизованной пехоты в том смысле, что ее транспортные средства обеспечивают определенную степень защиты от враждебного огня, а не от мягких колесных автомобилей (грузовых автомобилей или джипов) для моторизованной пехоты."
