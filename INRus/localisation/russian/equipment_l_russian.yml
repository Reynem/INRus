  train_equipment: "Поезд"
  train_equipment_desc: "Перевозит грузы из столицы снабжения в центры снабжения, соединённые железной дорогой."
  train_equipment_1: "Гражданский поезд"
  train_equipment_1_desc: "Этот локомотив хорошо подходит для перевозки больших объёмов груза на большие расстояния, однако его гражданская конструкция делает его уязвимым."
  train_equipment_2: "Поезд военного назначения"
  train_equipment_2_desc: "Упрощённая конструкция, лишённая многих особенностей обычных грузовых поездов, ради удешевления производства. Он столь же уязвим, как и обычный поезд, но его проще заменить."
  train_equipment_3: "Бронепоезд"
  train_equipment_3_desc: "Локомотив, одетый в тяжёлую броню, что делает его менее уязвимым для атак противника; перевозит столько же груза, сколько и другие модели, но обходится дороже в производстве."

  railway_gun_equipment: "Железнодорожная артиллерия"
  railway_gun_equipment_desc: "Тяжёлое орудие, установленное на железнодорожном вагоне для транспортировки."
  railway_gun_desc: "Железные дороги позволяют перемещать тяжёлые орудия далеко вглубь территории с приемлемой скоростью, что даёт нам возможность обстреливать позиции противника на большой дальности и с хорошим эффектом."
  railway_gun_equipment_1: "Железнодорожное орудие"

  floating_harbor_equipment: "Плавучая гавань"
  floating_harbor_equipment_desc: "Серия понтонов и сборных бетонных конструкций, которые можно перевезти по воде и собрать за несколько часов, создав защищённое место для разгрузки снабжения."
