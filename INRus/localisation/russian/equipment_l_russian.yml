 light_tank_destroyer_equipment_desc: "Разрушители цистерн - это танки с более крупным, чем обычно, пистолетом, установленный вместо башни. &quot; Легкие танки &quot; основаны на шасси легких танков, что означает, что они достаточно мобильны, но не носят особенно мощное оружие по сравнению с более тяжелыми ТТ."
