  infantry_equipment: "Пехотное вооружение"
  infantry_equipment_short: "Пех. вооруж."
  infantry_equipment_desc: "Стрелковое оружие и снаряжение для пехоты и экипажей боевых машин, а также прочее необходимое солдату снаряжение."
  infantry_equipment_0: "Базовое пехотное вооружение"
  infantry_equipment_0_short: "Баз. вооруж."
  infantry_equipment_0_desc: "Базовое пехотное вооружение было разработано до и во время Вельткрига."
  infantry_equipment_1: "Пехотное вооружение I"
  infantry_equipment_1_short: "Вооружение I"
  infantry_equipment_1_desc: "Стрелковое оружие и снаряжение для пехоты и экипажей боевых машин, а также прочее необходимое солдату снаряжение."
  infantry_equipment_2: "Пехотное вооружение II"
  infantry_equipment_2_short: "Вооружение II"
  infantry_equipment_2_desc: "Модернизация с добавлением большего числа автоматов и противотанковых ружей."
  infantry_equipment_3: "Пехотное вооружение III"
  infantry_equipment_3_short: "Вооружение III"
  infantry_equipment_3_desc: "Стрелковое оружие и снаряжение для пехоты и экипажей боевых машин, а также прочее необходимое солдату снаряжение."

  gw_armored_car_equipment: "Бронеавтомобиль эпохи Вельткрига"
  gw_armored_car_equipment_desc: "В то время как прежние бронеавтомобили представляли собой обычные коммерческие модели с тонкой стальной обшивкой, эта машина была спроектирована с нуля — с полноценным бронированием и лёгким вооружением."
  armored_car_equipment_1: "Базовый бронеавтомобиль"
  armored_car_equipment_1_desc: "Усовершенствованная компоновка внутреннего пространства и дополнительный боезапас делают бронеавтомобиль более эффективным."
  armored_car_equipment_2: "Улучшенный бронеавтомобиль"
  armored_car_equipment_2_desc: "Изменения на поле боя требуют значительно более мощного вооружения и более толстой брони, чтобы побеждать вражеские лёгкие подразделения и выживать, чтобы доложить об этом."
  armored_car_at_equipment: "Противотанковый бронеавтомобиль"
  armored_car_at_equipment_desc: "Рано или поздно наши лёгкие механизированные подразделения столкнутся с танками противника, и разработка специального противотанкового варианта даст им шанс на победу."

  tank_armor_upgrade: "Бронирование"
  tank_armor_upgrade_desc: "Более прочная броня, которую сложнее пробить противнику, — огромное преимущество для дивизий, однако она, вероятно, замедлит их."
  tank_gun_upgrade: "Основное орудие"
  tank_gun_upgrade_desc: "Важно, чтобы орудие не отставало по бронепробиваемости и могло пробивать броню противника."
  tank_aa_upgrade: "Зенитное вооружение"
  tank_aa_upgrade_desc: "Убедитесь, что наше зенитное вооружение способно сбивать новейшие самолёты."
  tank_at_upgrade: "Противотанковое вооружение"
  tank_at_upgrade_desc: "Убедитесь, что наши танки способны побеждать новейшие вражеские танки."
  tank_art_upgrade: "Артиллерийское орудие"
  tank_art_upgrade_desc: "Убедитесь, что наша самоходная артиллерия обладает мощной огневой силой, способной сокрушить любого небронированного противника."
  tank_reliability_upgrade: "Надёжность"
  tank_reliability_upgrade_desc: "Повышение надёжности снижает количество танков, выходящих из строя и нуждающихся в замене."
  mech_cost_upgrade: "Стоимость производства"
  mech_cost_upgrade_desc: "Оптимизация конструкции и замена менее важных материалов позволяют производить технику быстрее, но с небольшими недостатками."
  tank_engine_upgrade: "Двигатель"
  tank_engine_upgrade_desc: "Более высокая мобильность даёт тактические и стратегические преимущества, а также позволяет нести больше брони без существенной потери скорости."
  ac_engine_upgrade: "Двигатель"
  ac_engine_upgrade_desc: "Более высокая мобильность даёт тактические и стратегические преимущества, а также позволяет нести больше брони без существенной потери скорости."

  ship_gun_upgrade: "Орудие"
  ship_gun_upgrade_desc: "Важно, чтобы орудие не отставало по бронепробиваемости и могло пробивать броню противника."
  ship_torpedo_upgrade: "Торпеды"
  ship_torpedo_upgrade_desc: "Торпеды позволяют даже небольшим кораблям наносить мощные удары с большой дистанции с высокой вероятностью критического попадания."
  ship_armor_upgrade: "Бронирование"
  ship_armor_upgrade_desc: "Более толстая броня защищает корабль от вражеского огня."
  carrier_armor_upgrade: "Бронирование"
  carrier_armor_upgrade_desc: "Более толстая броня защищает корабль от вражеского огня."
  ship_engine_upgrade: "Двигатель"
  ship_engine_upgrade_desc: "Корабль с более мощным двигателем может лучше контролировать дистанцию до противника в бою."
  ship_reliability_upgrade: "Надёжность"
  ship_reliability_upgrade_desc: "Более надёжный корабль менее подвержен критическим повреждениям, способным нанести серьёзный ущерб судну без продуманной конструкции."
  ship_anti_air_upgrade: "Зенитное вооружение"
  ship_anti_air_upgrade_desc: "Больше зенитных орудий — больше сбитых вражеских самолётов!"
  ship_ASW_upgrade: "ПЛО"
  ship_ASW_upgrade_desc: "Противолодочное вооружение крайне важно для обнаружения и уничтожения подводных лодок."
  destroyer_engine_upgrade: "Двигатель"
  destroyer_engine_upgrade_desc: "Корабль с более мощным двигателем может лучше контролировать дистанцию до противника в бою."
  sub_engine_upgrade: "Двигатель"
  sub_engine_upgrade_desc: "Корабль с более мощным двигателем может лучше контролировать дистанцию до противника в бою."
  sub_stealth_upgrade: "Скрытность"
  sub_stealth_upgrade_desc: "Главная сила подводных лодок — способность оставаться незамеченными и наносить удар лишь тогда, когда преимущество на их стороне."
  sub_torpedo_upgrade: "Торпеды"
  sub_torpedo_upgrade_desc: "Торпеды позволяют даже небольшим кораблям наносить мощные удары с большой дистанции с высокой вероятностью критического попадания."
  ship_deckspace_upgrade: "Палубное пространство"
  ship_deckspace_upgrade_desc: "Больше места для размещения и запуска самолётов."

  plane_gun_upgrade: "Оружие"
  plane_gun_upgrade_desc: "Более совершенное оружие для воздушного боя с другими самолётами."
  cv_plane_gun_upgrade: "Оружие"
  cv_plane_gun_upgrade_desc: "Более совершенное оружие для воздушного боя с другими самолётами."
  plane_engine_upgrade: "Двигатель"
  plane_engine_upgrade_desc: "Более высокая скорость даёт самолёту преимущество в манёвре и выборе цели. Особенно важно для перехватчиков."
  plane_range_upgrade: "Дальность"
  plane_range_upgrade_desc: "Самолёт с большей дальностью полёта может выполнять задачи в более отдалённых стратегических районах."
  cv_plane_range_upgrade: "Дальность"
  cv_plane_range_upgrade_desc: "Самолёт с большей дальностью полёта может выполнять задачи в более отдалённых стратегических районах."
  plane_reliability_upgrade: "Надёжность"
  plane_reliability_upgrade_desc: "Ненадёжный самолёт с большей вероятностью потерпит аварию во время выполнения задания."
  plane_naval_upgrade: "Атака"
  plane_naval_upgrade_desc: "Повышенный боевой потенциал для создания противокорабельного вооружения."
  cv_plane_naval_upgrade: "Атака"
  cv_plane_naval_upgrade_desc: "Повышенный боевой потенциал для создания противокорабельного вооружения."
  plane_bomb_upgrade: "Бомбометание"
  plane_bomb_upgrade_desc: "Больший бомбоотсек позволяет нести больше полезной нагрузки."
  plane_tac_bomb_upgrade: "Бомбометание"
  plane_tac_bomb_upgrade_desc: "Больший бомбоотсек позволяет нести больше полезной нагрузки."
  plane_cas_upgrade: "Атака"
  plane_cas_upgrade_desc: "Усовершенствованное вооружение для ударов по наземным целям."
  plane_armor_upgrade: "Бронирование"
  plane_armor_upgrade_desc: "Протектированные топливные баки и бронирование повышают выживаемость."

