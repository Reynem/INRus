 infantry_equipment: "Пехотное оборудование"
 infantry_equipment_short: "Пехотный Эк."
 infantry_equipment_desc: "Оружие личного состава и экипажей для пехоты, а также различные другие комплекты, в которых нуждается солдат."
 infantry_equipment_0: "Базовое пехотное оборудование"
 infantry_equipment_0_short: "Базовое уравнение Eq."
 infantry_equipment_0_desc: "Базовое пехотное оборудование было разработано до и во время Велткрига."
 infantry_equipment_1: "Пехотное оборудование I"
 infantry_equipment_1_short: "Оружие I"
 infantry_equipment_1_desc: "Оружие личного состава и экипажей для пехоты, а также различные другие комплекты, в которых нуждается солдат."
 infantry_equipment_2: "Пехотное оборудование II"
 infantry_equipment_2_short: "Оружие II"
 infantry_equipment_2_desc: "Модернизация с целью включения в нее большого количества автоматов и противотанковых винтовок."
 infantry_equipment_3: "Пехотное оборудование III"
 infantry_equipment_3_short: "Оружие III"
 infantry_equipment_3_desc: "Вооружение личного состава и экипажей для пехоты, а также различные другие комплекты снаряжения, в которых нуждается солдат."

 gw_armored_car_equipment: "Бронированная машина &lt; &lt; Интервар &gt; &gt;"
 gw_armored_car_equipment_desc: "В тех случаях, когда предыдущие бронированные автомобили были простыми коммерческими моделями с тонкими стальными покрытиями, эта модель была разработана с нуля для доставки бронежилетов и легких вооружений."
 armored_car_equipment_1: "Базовая бронированная машина"
 armored_car_equipment_1_desc: "Усовершенствованные внутренние планировки и дополнительное хранение боеприпасов обеспечивают более эффективный бронированный автомобиль."
 armored_car_equipment_2: "Усовершенствованный бронированный автомобиль"
 armored_car_equipment_2_desc: "Изменения на поле боя требуют гораздо бóльших вооружений и более толстых бронежилетов, чтобы победить вражеские световые подразделения и выжить, чтобы сообщить об этом."
 armored_car_at_equipment: "Бронированная машина, противоречащая танкам"
 armored_car_at_equipment_desc: "В какой-то момент наши световые механизированные подразделения вступают в контакт с вражескими танковыми войсками, и разработка специального антитанкового варианта даст им шанс на победу."

 tank_armor_upgrade: "Бронирование"
 tank_armor_upgrade_desc: "Лучшие доспехи, которыми могут проникнуть ваши враги, это огромное преимущество для ваших дивизий, но, вероятно, замедлит вас."
 tank_gun_upgrade: "Главное оружие"
 tank_gun_upgrade_desc: "Важно иметь оружие, которое не отставало бы от бронебойной силы и могло бы проникнуть внутрь."
 tank_aa_upgrade: "Противоядие"
 tank_aa_upgrade_desc: "Обеспечивать, чтобы наше противовоздушное оружие могло сбить последние самолеты."
 tank_at_upgrade: "Антитанковое вооружение"
 tank_at_upgrade_desc: "Убедись, что наши танки смогут победить последние вражеские танки."
 tank_art_upgrade: "Артиллерийское оружие"
 tank_art_upgrade_desc: "Обеспечивать, чтобы у нашей самоходной артиллерии была мощная огневая мощь, которая разрушит всех небронированных врагов."
 tank_reliability_upgrade: "Надежность"
 tank_reliability_upgrade_desc: "Повышение надежности ведет к меньшему разрушению цистерн, которые нужно заменить."
 mech_cost_upgrade: "Производственные издержки"
 mech_cost_upgrade_desc: "Оптимизация конструкции и замены менее важных материалов позволяет создавать транспортное средство быстрее, но с небольшими дефектами."
 tank_engine_upgrade: "Двигатель"
 tank_engine_upgrade_desc: "Более высокая мобильность дает тактические и стратегические преимущества, а также позволяет создавать больше бронежилетов без существенного замедления."
 ac_engine_upgrade: "Двигатель"
