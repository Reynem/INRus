  light_tank_equipment_3_desc: "Лёгкие танки — небольшие быстроходные машины, способные как вести разведку, так и эффективно бороться с бронетехникой противника."

  light_tank_artillery_equipment: "Лёгкая САУ"
  light_tank_artillery_equipment_desc: "Небольшое артиллерийское орудие, установленное на лёгком шасси. Лёгкая САУ уступает в огневой мощи своим более крупным собратьям, зато превосходит их в мобильности."
  light_tank_artillery_equipment_1: "Лёгкая САУ I"
  light_tank_artillery_equipment_1_short: "Л. САУ I"
  light_tank_artillery_equipment_1_desc: "Небольшое артиллерийское орудие, установленное на лёгком шасси. Лёгкая САУ уступает в огневой мощи своим более крупным собратьям, зато превосходит их в мобильности."
