  light_tank_destroyer_equipment: "Лёгкая противотанковая САУ"
  light_tank_destroyer_equipment_short: "Л. ПТ-САУ"
  light_tank_destroyer_equipment_desc: "Противотанковые САУ — это танки с более крупным, чем обычно, орудием, установленным неподвижно вместо башни. «Лёгкие» истребители танков базируются на шасси лёгких танков, что делает их достаточно мобильными, но не позволяет нести особо мощное вооружение по сравнению с более тяжёлыми аналогами."
  light_tank_destroyer_equipment_1: "Лёгкая противотанковая САУ I"
