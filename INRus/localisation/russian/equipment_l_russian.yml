 mechanized_equipment_1_short: "Механизированный I"
 mechanized_equipment_1_desc: "Механизированная пехота - это пехота, оснащенная бронетранспортерами (БМП) или боевыми пехотными автомобилями (ДВС), предназначенными для перевозки и ведения боевых действий. &quot; Механизированная пехота &quot; отличается от моторизованной пехоты в том смысле, что ее транспортные средства обеспечивают определенную степень защиты от враждебного огня, а не от мягких колесных автомобилей (грузовых автомобилей или джипов) для моторизованной пехоты."
