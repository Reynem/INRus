 train_equipment: "Поезд"
 train_equipment_desc: "Поездки грузов из столицы снабжения в центры снабжения, подсоединенные железнодорожным транспортом."
 train_equipment_1: "Гражданский поезд"
 train_equipment_1_desc: "Этот движок хорошо подходит для перевозки большого количества грузов на большие расстояния, однако его гражданское строительство делает его уязвимым."
 train_equipment_2: "Поезд, сопровождающий боевые действия"
 train_equipment_2_desc: "Упрощенная конструкция, которая не учитывает многие особенности, обычно встречающиеся в обычных грузовых поездах, в интересах более дешевого производства. Она по-прежнему так же уязвима, как и обычный поезд, но ее легче заменить."
 train_equipment_3: "Бронированный поезд"
 train_equipment_3_desc: "Двигатель поезда, сложенный в тяжелые бронежилеты, чтобы сделать его менее уязвимым для нападения противника, может перевозить столько же грузов, сколько и любой другой проект, но его производство дороже."
 railway_gun_equipment: "Железнодорожная артиллерия"
 railway_gun_equipment_desc: "Тяжелая пушка, установленная на железнодорожной вагоне для перевозки."
 railway_gun_desc: "Железные дороги дают возможность передвигать тяжелые пушки далеко вглубь страны с разумной скоростью, что позволяет нам бомбардировать позиции противника на большой дальности и с хорошим эффектом."
 railway_gun_equipment_1: "Железнодорожное оружие"

 floating_harbor_equipment: "Плавающая гавань"
 floating_harbor_equipment_desc: "Серия понтонов и сборочных бетонных конструкций, которые могут быть перевезены через воду и собраны в течение нескольких часов для создания защищенного посадочного пространства для разгрузки предметов снабжения."
