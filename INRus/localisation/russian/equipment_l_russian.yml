l_russian:
 submarine: "Подводные лодки"
 submarine_desc: "Тяжелые подводные лодки более крупные и мощные, с более длительным оперативным радиусом действия, а также некоторые возможности для бомбардировок по поверхности и берегу."
 both_cruisers_desc: "Light Cruiser - лёгкое скрининговое судно. Его главная обязанность - защищать капиталы от вражеских легких кораблей, но он также может выпускать мощные торпеды, которые могут нанести вред более крупным кораблям. / nnnHeavy Crusier - большой бронированный крейсер, довольно гибкий. Хороший выбор для стран, которые не могут позволить себе строить крупные капитальные корабли."
 light_cruiser: "Легкий круизер"
 light_cruiser_desc: "Легкое судно для досмотра. Его главная обязанность — защищать капиталы от вражеских легких кораблей, но он может также выпускать мощные торпеды, которые могут нанести ущерб более крупным кораблям."
 heavy_cruiser: "Тяжелый крузер"
 heavy_cruiser_desc: "Большой бронированный крейсер, довольно гибкий, хороший выбор для стран, которые не могут позволить себе строить крупные капитальные корабли."
 destroyer: "Уничтожить"
 destroyer_desc: "Самый легкий скрининговый корабль, его задача - защищать более крупные корабли и находить и уничтожать подводные лодки."
 ship_hull_light: "Световая колодка"
 ship_hull_light_desc: "Самый легкий скрининговый корабль, его задача - защищать более крупные корабли и находить и уничтожать подводные лодки."
 carrier: "Перевозчик"
 carrier_desc: "Капитальный корабль, способный нести крылья мощного летательного аппарата в бою, также полезен в качестве плавающего аэродрома, который вы можете разместить у побережья вашего врага."
 battleship: "Боевой корабль"
 battleship_desc: "Боевые корабли среднего уровня со всеми исполнителями, они балансируют скорость, броню и огневую мощь, но не превосходят ни в одной области."
 armor_desc: "Самые большие и сильные доспехи, которые могут купить деньги."
 battle_cruiser: "Боевой круизер"
 battle_cruiser_desc: "Капитальный корабль, часто имеющий наступательные способности, близкие к способностям боевого корабля, но с более слабыми бронежилетами, обменивался на более быструю скорость."
 convoy: "Конвой"
 convoy_desc: "Конвои, используемые для международной торговли товарами и ресурсами, также используются для переправки войск вокруг и для совершения военно-морских нападений."
 sh_battleship: "Ужасно"
 sh_battleship_desc: "Такие дорогие инвестиции заслуживают надлежащей поддержки небольших скрининговых судов."

 light_airframe: "Световоздух"
 light_airframe_desc: "Самолеты на легкой ЭВМ"
 medium_airframe: "Средняя авиамашина"
 medium_airframe_desc: "Самолеты, базирующиеся на средних авиарейсах"
 heavy_airframe: "Тяжелое воздушное пространство"
 heavy_airframe_desc: "Самолеты большой авиации"
 jet_engines: "Двигатели-реактивы"
 JET_ENGINES_SPECIAL: "Разработка Jet Motors является необходимой предпосылкой для разработки реактивных летательных аппаратов."
 jet_engines_desc: "В качестве прорыва в технологии тяги, Jet Motor позволит разработать совершенно новое поколение летательных аппаратов."

 convoy_1: "Конвой"

 armored_car_equipment: "Бронированная машина"
 armored_car_equipment_desc: "Легкие колесные бронированные машины, общие для разведки и подавления сопротивления, но могут быть оснащены более тяжелыми вооружениями."
 motorized_equipment: "Грузовой автомобиль"
 motorized_equipment_desc: "Грузовики, используемые для перевозки войск, предметов снабжения и для автомобилизации дивизий."
 motorized_equipment_0: "Ранний грузовой автомобиль"
 motorized_equipment_0_desc: "Во время Вельткрига армия начала использовать основные гражданские грузовики для перевозки предметов снабжения и грузового оборудования, которые с тех пор стали неотъемлемой частью большинства армий."
 motorized_equipment_1: "Грузовой автомобиль"
 motorized_equipment_1_desc: "Автомобильная пехота является первым шагом на пути к механизации армии. &lt; &lt; Гражданские грузовики &gt; &gt; легко приспособлены для использования в военных целях для перевозки солдат, буксировки оружия и перевозки техники и предметов снабжения, что значительно повышает стратегическую мобильность пехотных подразделений, которые в противном случае будут вынуждены проводить марш."
 support_equipment_short: "Об. поддержки"
 support_equipment: "Вспомогательное оборудование"
 support_equipment_desc: "Радио, джипы, понтоны и прочее оборудование, используемое для поддержки войск."
 tech_support: "Вспомогательное оборудование"
 support_equipment_1: "Вспомогательное оборудование"
 support_equipment_1_desc: "Радио, джипы, понтоны и прочее оборудование, используемое для поддержки войск."

