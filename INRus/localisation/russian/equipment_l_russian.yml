 artillery_equipment: "буксируемая артиллерия"
 artillery_equipment_short: "Артиллерия"
 artillery_equipment_desc: "Артиллерия относится к крупнокалиберным вооружениям, таким, как пушки и гаубицы, которые эксплуатируются экипажами и которые могут спроектировать боеприпасы, выходящие далеко за рамки эффективного диапазона личного оружия."

 rocket_artillery_equipment: "Буксируемая ракетная артиллерия"
 rocket_artillery_equipment_short: "Ракетные артиллерии"
 rocket_artillery_equipment_desc: "Ракетная артиллерия является менее точной и имеет гораздо более низкую стабильную скорость огня, чем аккумуляторы из традиционных артиллерийских орудий, однако они способны одновременно поражать цель несколькими ракетами с разрушительным эффектом."

