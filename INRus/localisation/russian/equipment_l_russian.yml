 gw_tank_equipment: "Цистерна &quot; Вельткриг-эра &quot;"
 gw_tank_equipment_short: "Цистерна &quot; Вельткриг-эра &quot;"
 gw_tank_equipment_desc: "Танки в Вельткриге были разработаны отдельно и одновременно Соединенным Королевством и Францией в качестве средства выхода из тупика, в котором находятся траншеи на Западном фронте."tanks", a name adopted during the early stages of their development as a security measure to conceal their purpose, while the German counterpart, "Panzer", stuck in many German-influenced nations. Early tanks were armed with machineguns and small cannons, moved slowly, and were armoured only enough to stop small arms fire."

 light_tank_equipment: "Легкий танк"
