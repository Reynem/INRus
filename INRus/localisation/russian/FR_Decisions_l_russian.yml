## Demobilisation
economic_demobilization: "Экономическая демобилизация"
economic_demobilization_desc: "Мы должны рассмотреть возможность смягчения таких мер и снятия нашей экономики с военных позиций в целях предотвращения гражданских беспорядков."
demobilization_manpower: "Военная демобилизация"
demobilization_manpower_desc: "С дематериализацией наших ныне скромных врагов население начинает считать, что наши широкомасштабные меры по призыву больше не нужны. &lt; &lt; Гражданские &gt; &gt; хотят, чтобы их отцы и сыновья вернулись домой, и даже говорят о несогласии в рядах для такого призыва. &lt; &lt; Во имя стабильности &gt; &gt; , возможно, было бы разумно облегчить такие меры до устойчивого уровня."

##INDUSTRIAL DECISIONS##
infrastructure_building_slot: "Промышленная реконструкция"
infrastructure_building_slot_desc: "Наше состояние может использовать некоторые ремонтные работы, чтобы расчистить больше помещений для строительства других комплексов."
civilian_factory_commission: "Издать Комиссию по гражданской фабрике"
civilian_factory_commission_desc: "Наша гражданская индустрия может быть намного больше, и в настоящее время мы можем использовать комиссию для строительства одного из этих зданий."
arms_factory_commission: "Издать военную комиссию по производству"
arms_factory_commission_desc: "Наша оружейная промышленность, безусловно, могла бы выиграть от небольшого расширения, а комиссия другой оружейной фабрики могла бы исправить это."
dockyard_commission: "Выпустить докьярдскую комиссию"
dockyard_commission_desc: "В дополнение к нашему военно-морскому флоту, конечно, было бы полезно использовать кавалер для докьярда, и это не было бы напрасным."

