#Demob
demobilization: "Послевоенная демобилизация"
demobilization_desc: "Оружие замолчало, и война, в которой мы оказались, закончилась. Сейчас, когда мир царит на наших территориях, мы считаем необходимым принять ряд мер. Прежде чем социальные волнения поднимут его уродливую голову, мы должны рассмотреть вопрос о демобилизации наших вооруженных сил, прежде чем мы столкнемся с гневом нашего народа."

#### GENERIC DECISIONS ####

increase_popularity_vang: "Позволь мне произнести речь." #Might and Strength.
increase_popularity_vang_desc: "Кто-то может критиковать нас за то, что мы выступаем за сильное государство... пусть они критикуют!"
increase_popularity_collie: "Популяризация марксистской литературы" #Revolutionary and Orthodox.
increase_popularity_collie_desc: "Путь вперед - это все вместе. Авангарды будут утверждать, что для того, чтобы направить народ к истинному социализму, необходимо сильное государство, либертарианские социалисты будут отстаивать обратное. Ни одна из этих партий не права; взаимная взаимозависимость и обеспечение единства коллектива будут необходимы для подлинного достижения социализма."
increase_popularity_libsoc: "Позволь [позвони лидеру] посетить фабрику" #Equal and United.
increase_popularity_libsoc_desc: "Большой объем власти в руках немногих - это односторонняя поездка в Диктаторство. Часть социалистической системы должна применяться к нашей нации; неуклонно и умеренно работать над марксистской мечтой о социализме. Посещение фабриками наших рабочих, чтобы информировать их об этом, обеспечит нашу популярность и дискредитирует радикальные режимы, предложенные некоторыми."
increase_popularity_socdem: "Широкомасштабное распределение социального обеспечения" #Fair and Moderate.
increase_popularity_socdem_desc: "Капитализм несовершенен, но наш долг - исправить эти недостатки. Гуманная этика должна применяться к капитализму, чтобы смягчить его неровные последствия для рабочих классов. Мы будем теми, кто займется этим мантией; мы будем теми, кто будет реформировать нашу нацию сегодня, чтобы сделать ее лучше завтра."
increase_popularity_soclib: "Защита гражданских свобод" #Free and Just.
increase_popularity_soclib_desc: "Демократические ценности должны поддерживаться любой ценой; демократия не подлежит обсуждению. Законы не могут ограничивать гражданские свободы человека; только гарантируют его свободу. [Root.GetNameDef] является свободной и справедливой нацией! Мы никогда не позволим скомпрометировать эти ценности!"
increase_popularity_marklib: "Организация &lt; &lt; Защитник экономической приватизации &gt; &gt;" #Unchained and Unbound.
increase_popularity_marklib_desc: "Мы будем обеспечивать свободный рынок для каждого гражданина в [Root.GetNameDef]; чем свободнее рынок, тем свободнее народ!"
increase_popularity_soccon: "Пропаганда статуса Quo" #Stable and Traditional.
increase_popularity_soccon_desc: "Некоторые могут критиковать нас за отказ изменить многое, но они просто не видят, что наша национальная ситуация оптимальна по состоянию на сегодняшний день. Традиция и стабильность - это несколько жизненно важных сил в стране. Мы никогда не можем отдать их радикальным силам реформ и революции, и люди должны это знать."
increase_popularity_authdem: "Вводим в действие нашу ответственность" #Popular and Responsible.
increase_popularity_authdem_desc: "Мы принимаем доктрину социального консерватизма в том смысле, что мы считаем, что общество в настоящее время находится в оптимальном состоянии, и мы практикуем централизацию для приоритизации национальной стабильности и популярности прежде всего."
increase_popularity_pataut: "Обеспечение отцовской популярности" #Strong and Righteous.
increase_popularity_pataut_desc: "Нация под сильным правителем - это единственный способ обеспечить успех нашей праведной борьбы. Стабильность должна поддерживаться путем обеспечения популярности нашего правительства, будь то словами или силой."
increase_popularity_natpop: "Держите националистскую группировку" #Fierce and Proud.
increase_popularity_natpop_desc: "Чтобы укрепить основные ценности и принципы нашей партии, мы проведем митинг, который выберет наших различных сторонников из разных стран."
increase_popularity_valkist: "Индоктринировать Популас" #Revived and Radical.
increase_popularity_valkist_desc: "Основные принципы валькизма должны быть привиты в народе. Начиная с молодости, а затем переходим к старому, мы закрепим их верность [Рут.Гетнаму]."

centralized_economic_planning: "Централизованное экономическое планирование"
#centralized_economic_planning_desc: "Чтобы лучше координировать нашу экономику, мы приступим к централизованному экономическому планированию."
decentralized_economic_planning: "Децентрализованное экономическое планирование"
#decentralized_economic_planning_desc: "Чтобы содействовать самоуправлению и самонадеянности, мы будем осуществлять различные программы децентрализованного экономического планирования."
