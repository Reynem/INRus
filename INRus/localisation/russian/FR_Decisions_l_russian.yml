improved_worker_conditions_desc: "Улучшение условий труда наших рабочих на фабриках приведет к сокращению производства в краткосрочной перспективе, но долгосрочные выгоды этого стоят."
civil_crackdown: "Гражданская сломка"
civil_crackdown_desc: "Ключ к ликвидации революционеров в том, чтобы уничтожить их до того, как они станут проблемой."
cut_red_tape: "Вырезать красную ленту"
cut_red_tape_desc: "Наша нация слишком бюрократична, и она почти стала ограничительной в нескольких областях."

