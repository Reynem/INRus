 ### NOR - NORWAY ###
 NOR_submarine_1: "B Класс."
 NOR_submarine_1_desc: "Норвежские подводные лодки класса B были построены в Норвегии для Норвежского военно-морского флота в 1923—1930 годах. Они переместили 420 тонн, были вооружены четырьмя 450-мм торпедными трубами и имели глубину ныряния 60 метров."
 NOR_submarine_3: "Класс мочевины"
 NOR_submarine_3_desc: "Класс Уредда состоял из двух британских подводных лодок класса U, построенных для норвежских военно-морских сил в изгнании между 1941 и 1943 годами."
 NOR_submarine_4: "Класс &lt; &lt; Утсира &gt; &gt;"
 NOR_submarine_4_desc: "Класс &quot; Утсира &quot; состоял из четырех британских подводных лодок класса &quot; Вампир &quot; , которые были построены между 1943 и 1944 годами, хотя до окончания войны лишь одна из них была передана норвежским военно-морским силам в изгнание. &quot; Корабли &quot; были лишь умеренным улучшением по сравнению с предыдущим классом &quot; U &quot; . Они переместили 545 тонн, были вооружены четырьмя 533-мм торпедными трубами и глубиной 90 метров."
 NOR_destroyer_1: "Класс Draug"
 NOR_destroyer_1_desc: "Четыре эсминцев класса Драуг были первыми многослойными эсминцами, построенными для Королевского Норвежского военно-морского флота. Они были заказаны непосредственно перед Первой мировой войной и переместили 580 тонн. Они были вооружены тремя винтовками."
 NOR_destroyer_2: "Класс сапнера"
 NOR_destroyer_2_desc: "Класс Слипнера был классом крупных торпедных лодок, построенных в Норвегии для Королевского норвежского военно-морского флота с 1937 по 1939 год."
 NOR_destroyer_3: "Класс Олесунда"
 NOR_destroyer_3_desc: "Класс Олесунда состоял из двух эсминцев, которые были установлены в 1939 году, но так и не были завершены до немецкой оккупации. Если бы они были завершены, то они были бы первыми норвежскими эсминцерами, которые были бы сопоставимы по размеру с уничтожителями большинства крупных государств, сместив более 1200 тонн, они должны были быть вооружены четырьмя 120-мм пушками Бофорса в их вооружениях и четырьмя 533-мм торпедными трубами."
 NOR_destroyer_4: "Класс свинины"
 NOR_destroyer_4_desc: "Класс Stord состоял из четырех британских эсминцев класса S, которые были построены для Королевского норвежского флота в изгнании в период 1943-1944 годов. Они переместили около 1800 тонн и были вооружены четырьмя 120-мм 45-мм пушками QF IX в своем основном вооружении, а также восемь 533-мм торпедных труб и достойный АСО и радиолокационное дополнение. Они также имели хорошую скорость и надежность."
 NOR_heavy_cruiser_1: "Класс норвежцев"
 NOR_heavy_cruiser_1_desc: "Норге был прибрежным оборонным судном, построенным для Норвегии в Великобритании в начале века. Его вооружение, которое было сконцентрировано около двух 210-мм ружей, было сопоставимо с тяжелым крейсером, хотя его размер, который переместился чуть более 4200 тонн, был ближе к легкому крейсеру. Его скорость была сопоставима с страшным катером. Это был один из четырех кораблей береговой обороны своего времени, который до сих пор служил Королевскому военно-морскому флоту Норвегии в начале Второй мировой войны."
 ### NZL - NEW ZEALAND ###
 NZL_submarine_1: "L Класс"
 NZL_submarine_1_desc: "Класс L был среднегабаритными лодками, первоначально запланированными в рамках программы чрезвычайных военных действий в качестве усовершенствованной версии предыдущих классов подводных лодок. Они были построены на поздних этапах Первой мировой войны и оснащены новыми, более крупными 21 торпедами. Они служили до начала Второй мировой войны, когда они в основном использовались для выполнения вспомогательных и учебных обязанностей."
 NZL_submarine_2: "Класс"
 NZL_submarine_2_desc: "Корабли класса &quot; То-класс &quot; или &quot; Тритон &quot; были предназначены для замены крупных подводных лодок класса &quot; О &quot; , &quot; Р &quot; и &quot; Р &quot; . Они представляли собой умеренно крупные подводные лодки с большим радиусом действия, хорошо приспособленные для Атлантического и Тихого океанов. Эти лодки были хорошо вооружены, стабильными платформами и широко использовались во время конфликта, поскольку 25 процентов построенных лодок были потеряны во время войны."
 NZL_submarine_3: "U Класс"
 NZL_submarine_3_desc: "Класс U был небольшими подводных лодками, построенными в рамках чрезвычайных военных программ 1940 и 1941 годов. Изначально спроектированными как тренировочные подводные лодки по мере начала войны, проект был изменен, что позволило этим подводным лодкам оказаться полезными в замкнутых водах Северного моря и Средиземноморья. Из-за их меньшего размера их дальность и оружие были ограничены. Три подкласса составляли класс: Undine, Umpire и Uproar."
 NZL_submarine_4: "V Класс"
 NZL_submarine_4_desc: "Подводные лодки класса V или вампирского класса основывались на предыдущих малогабаритных лодках класса U. Они были более крупными, но все же относительно небольшими, с более высокой пропускной способностью на море, но с ограниченной оперативной дальностью и оружием."
 NZL_destroyer_1: "V/W Класс"
 NZL_destroyer_1_desc: "Эти эсминцы включали в себя адмирализацию и классы Tornycroft V и W. Они были построены в рамках программы чрезвычайных военных действий. Они были конечной эволюцией британского эсминца во время Первой мировой войны, воплощавшей в себе усовершенствования их предшественников, а также новые технологические достижения. Большое число этих кораблей было построено на поздних этапах WWI и впоследствии стало краеугольным камнем эсминных флотов Королевского флота. Начиная с 1930-х годов они были размещены в резервных флотах, которые в конечном итоге использовались для сопровождения конвоя. Они были достаточно вооружены, быстрые суда с хорошим радиусом действия."
 NZL_destroyer_2: "Класс G/H/I"
 NZL_destroyer_2_desc: "Разрушители классов G, H и I были заказаны в рамках военно-морских строительных программ 1933 и 1934 годов. Они, как правило, повторялись в предыдущем классе F, с небольшим сокращением размера. Боеприпасы в классах G и H были такими же, как и в классе F, оба из которых использовали 4,7 в. пушки. Эти корабли имели дальний радиус действия, были достаточно вооружены и имели сильный торпедный компонент. Они широко использовались во время войны и понесли многочисленные потери."
 NZL_destroyer_3: "Класс J/K/N"
 NZL_destroyer_3_desc: "Классы J, K и N были аналогичны предыдущим классам племени, но вместо того, чтобы делать упор на оружие, дизайнеры вернулись к более стандартной тяжелой торпеде и более легкой ружейной установке. Корабли были модифицированы на протяжении всей их военной службы. Модернизация включала усовершенствование зенитных орудий и радаров. Они были быстрыми, дальними и хорошо вооруженными судами, идеальными для сопровождения флота."
 NZL_destroyer_4: "Боевой класс"
 NZL_destroyer_4_desc: "Разрушители боевого класса были построены на эволюции британских эсминцев, использовавшихся во время войны. Корабли были заказаны в рамках военно-морских программ 1942 и 1943 годов. Они были хорошо вооружены как с точки зрения оружия, так и с точки зрения их торпед."
 NZL_light_cruiser_1: "C Класс."
 NZL_light_cruiser_1_desc: "Легкие крейсеры класса С представляли собой группу из 28 лёгких крейсеров Королевского флота, которые были построены до и во время Первой мировой войны для тяжелых условий в Северном море. Они были накачанными и способными к эксплуатации судами, несмотря на то, что они были несколько небольшими и узкими. Их вооружения были более чем удовлетворительными, поскольку они перевозили в них шесть единиц оружия для борьбы с наземными целями противника и тяжелой торпедой. Они видели широкое применение во время WWI и участвовали во многих действиях на поверхности. К середине 1930-х годов в эксплуатации находились только подклассы Каледона, Сереса и Карлайла."
 #NZL_light_cruiser_1c: "Класс леандера"
 NZL_light_cruiser_2: "Класс Саутгемптона"
 NZL_light_cruiser_2_desc: "Легкие крейсеры класса Саутгемптон были подклассом крейсеров городского класса и предназначались для борьбы с японскими крейсерами класса Могами. Эти суда были хорошо бронированы, имели хорошую скорость и дальность движения и несли огромные вооружения в количестве 12 6 единиц."
 NZL_light_cruiser_3: "Класс Гамбии"
 NZL_light_cruiser_3_desc: "Гамбийский класс был назван «Новым Зеландом» для британских крейсеров класса «Королева Колония», улучшенных версий предыдущего городского класса, но с упрощенным дизайном для ускорения строительства и снижения издержек. Корабли перевозили те же пушки, что и их предшественники, четыре тройные турниры, в которых было 6 стволов. Они были аналогичным образом бронированы, но из-за их небольших двигателей их диапазон был несколько уменьшен."
 NZL_light_cruiser_4: "Класс черного принца"
 NZL_light_cruiser_4_desc: "Класс Черного принца был канадским названием для британских крейсеров класса Минотавров (или Swiftsure-class). Эти крейсеры были спроектированы как модифицированная версия класса Короны Колонии, включая изменения в войне, которые были разрешены в 1941 году. Они имели более широкий оперативный диапазон и более большое количество оружия AA по сравнению с классом Короны Колонии, в то время как основные вооружения были сокращены до трех тройных турниров. Построены слишком поздно, чтобы повлиять на исход войны, большинство заказанных судов были впоследствии отменены."
 NZL_heavy_cruiser_1: "Класс Hawkins"
 NZL_heavy_cruiser_1_desc: "Крейсеры класса Хокинс были первыми в мире тяжелыми крейсерами. Они были основаны на более ранних легких крейсерах городского класса, в частности на подклассе Бирмингема, но были оснащены 7,5 в. пушки и более толстым бронепоясом. Они были предназначены для борьбы с крупными рейдерами в Германии. Они были хорошо вооружены, имели разумную скорость и дальность и хорошую защиту. В общей сложности пять кораблей были заказаны, но только четыре были активированы в начале WWII."
 NZL_heavy_cruiser_2: "Суррейский класс"
 NZL_heavy_cruiser_2_desc: "В рамках морской программы 1928 года были предложены тяжелые крейсеры класса &quot; Суррей &quot; , улучшенные версии более ранних крейсеров Йоркского класса. Если бы они были завершены, они были бы оснащены четырьмя восемью близнецами, ружьями, более тяжелыми доспехами и более мощными двигателями. Два корабля были заказаны, но ни один из них не был сложен."
 NZL_heavy_cruiser_3: "Адмирал Класс"
 NZL_heavy_cruiser_3_desc: "Тяжелые крейсеры адмирального класса (не следует путать с боевыми круизами адмирального класса) были последней попыткой Королевского ВМС спроектировать и построить крейсеры с 8 пушками. Проектирование началось в 1938 году и завершилось в 1941 году, в результате чего были выдвинуты различные предложения."
 NZL_heavy_cruiser_4: "Черчилль Дизайн"
 NZL_heavy_cruiser_4_desc: "Эти корабли были предложены сэром Уинстоном Черчиллем, лордом Адмиралии, на ранних этапах Второй мировой войны, чтобы противостоять крупным крейсерам немецкого класса Deutschland. Эти суда имели бы 9,2 пушек, тяжелые АА и мощные бронежилеты. Они были предназначены для эффективной борьбы с вражескими столицами. В конечном счете, корабли были отменены из-за высоких расходов и отсутствия спроса на новый тяжелый крейсер."
 NZL_battle_cruiser_1: "Реномерный класс"
 NZL_battle_cruiser_1_desc: "Боевые круизеры класса Renown были изначально заложены в качестве улучшенных версий боевых кораблей класса Revenge. Их строительство было приостановлено в начале WWI. Адмирал Лорд Фишер смог возобновить их строительство в качестве боевых круизеров. Эти корабли были квинтуозным боевиком. Они были хорошо вооружены, быстро и маневрируемы, но имели тонкие доспехи и более короткий оперативный диапазон. Было завершено строительство только двух из первых трех кораблей - Repulse и Renown."
 NZL_battle_cruiser_2: "Королевский класс принцессы"
 NZL_battle_cruiser_2_desc: "Принцесса Роял была классом гипотетических боевых круизеров, которые представляли собой более быструю и дешевую версию боевых кораблей класса Кинг Джордж V. Эти суда имели аналогичное, но сокращенное вооружение как для наземных, так и для противовоздушных боёв: два из 14 пушек и шесть близнецов 5,25 в. Пушки AA. Их быстрая скорость и дальность позволили бы Королевским ВМС быстро нанести удар и защитить конвой, но их ограниченные доспехи были бы проблематичны, если бы им пришлось бороться с современными боевыми кораблями."
 NZL_battleship_1:1 "Класс мести"
 NZL_battleship_1_desc:1 "В 1913 году были заказаны боевые корабли класса Месть в качестве дешевых версий королевы Елизаветы. В то время как они также были вооружены и бронированы, их скорость была значительно ниже, и они были вынуждены выполнять второстепенные функции во время Второй мировой войны. Из 8 предусмотренных кораблей класса только 5 были завершены."
 NZL_battleship_2: "Класс короля Георга V"
 NZL_battleship_2_desc: "В 1922 и 1930 годах были заключены первые договоры о военно-морском флоте, которые ограничивали максимальное перемещение и стрельбу столиц. Таким образом, эти корабли были оснащены меньшекалиберными пушками, чем ранее, и даже современными боевыми кораблями. Несмотря на меньший калибр, корабли были достаточно вооружены, несли сильное оружие АА и имели надлежащую защиту. Пять кораблей были заказаны и заложены в качестве замены старым кораблям класса королевы Елизаветы."
 NZL_battleship_3: "Класс льва"
 NZL_battleship_3_desc: "Боевые корабли класса "Львов" были последующим классом к королю Георгу V с множеством их особенностей. Шесть кораблей были заказаны в военно-морской программе 1938 года, чтобы заменить стареющие боевые корабли класса "Мстить", но ни один из них не был закончен из-за вспыхнувших боевых действий. Эти корабли были бы общими, как и к королю Джорджу, но основные вооружения были бы тяжелее, введя новые 16 в. пушки. У них также были бы более толстые брони и более мощные двигатели."
 NZL_battleship_4: "Класс авангарда"
 NZL_battleship_4_desc: "Боевой корабль класса &lt; &lt; Вангард &gt; &gt; был последним катетером, который был построен для Королевского флота. &lt; &lt; Один корабль &gt; &gt; был заказован, но еще четыре корабля были рассмотрены для тихоокеанского театра. &lt; &lt; Заказ &gt; &gt; в рамках программы &lt; &lt; Экстренная война 1940 года &gt; &gt; , строительство не получило первоочередного внимания и было завершено после войны. &lt; &lt; Класс &gt; &gt; имел &lt; &lt; слайд &gt; &gt; , что обеспечило прекрасную стабильность и мореходность. &lt; &lt; Оружие &gt; &gt; было таким же, как и корабли класса &lt; &lt; Королева Елизавет &gt; &gt; и &lt; &lt; &lt; &lt; Ревен &gt; &gt; &gt; , которые обеспечили значительную огненную мощь."
 NZL_SH_battleship_1: "Класс центуриона"
 NZL_SH_battleship_1_desc: "Центурион был классом гипотетических тяжелых боевых кораблей Королевского ВМС, построенных для борьбы с крупными судами немецких и японских морских судов. 18 больших ружей и толстых бронежилетов обеспечивают корабль необходимой огневой мощью и защитой для борьбы с этими кораблями. Сильные вооружения АА, большие расстояния и хорошая скорость были необходимы для охвата обширных морей Британской империи."
 NZL_SH_battleship_2: "Львиный II класс"
 NZL_SH_battleship_2_desc: "Боевые корабли класса "Лион II" были спроектированы в 1944 году как улучшенная версия предыдущего боевого корабля класса "Лион". Включая уроки военного времени, этот проект был больше и тяжелее, и в случае его завершения он будет перевозить три или четыре тройных 16 ружей последнего типа. Толстые бронежилеты защищали корабль от любых поверхностных или воздушных врагов. Расходы на строительство этих кораблей, поражение вражеских мореплавателей и необходимость в авиаперевозчиках привели к отказу от проекта."
 NZL_carrier_1: "Мужественный класс"
 NZL_carrier_1_desc: "Эти три авианосца были переоборудованы в боевые круизеры и были первыми авианосцами Королевского военно-морского флота, которые были преобразованы в результате заключения Вашингтонского военно-морского договора 1922 года и завершения работ в 1925 году."
 NZL_carrier_2: "Ковчег Королевского класса"
 NZL_carrier_2_desc: "В 1934 году судно было хорошо бронетранспортировано и вооружено, на нем находилось большое количество воздушных судов и была обеспечена достаточная оперативная дальность и скорость для того, чтобы успевать за основными силами Королевского флота."
 NZL_carrier_3: "Яркий класс"
 NZL_carrier_3_desc: "Иллюстрированный класс был разработан в соответствии с ограничениями второго Лондонского договора о военно-морском флоте 1936 года, который ограничил размер перевозчика верхним пределом в 23 000 тонн. Она была первой британской авиакомпанией, которая имела бронированную полетную палубу, которая сократила размер авиагруппы. Тяжелые бронежилеты и вооружения АА обеспечили прочную защиту для судов, в то время как мощные двигатели и большой топливный склад дали судам большой оперативный радиус."
 NZL_carrier_4: "Неукрепляемый класс"
 NZL_carrier_4_desc: "Самолеты закрытого класса были заказаны в соответствии с Морской программой 1938 года и были в основном улучшены версий предыдущего класса Illustruction. &quot; Война &quot; и перенос приоритета на более мелкие суда для обеспечения защиты автоколонн на ранних и средних этапах войны замедлили ограничение этих судов; они были более крупными судами, способными перевозить больше самолетов при сохранении толстой брони как на корпусе, так и на палубе полета. &quot; Более мощные &quot; двигатели обеспечили им более высокую скорость и оперативный диапазон по сравнению с классом Illustrective &quot; ."
 ### POR - PORTUGAL ###
 POR_submarine_1: "Класс Foca"
 POR_submarine_1_desc: "Португальский фока-класс представлял собой три небольших подводных лодки, построенных в Италии для португальских ВМС вскоре после Первой мировой войны. Это были расширенные версии итальянского класса Espadarte и братских кораблей испанского класса A. Они переместили только 260 тонн и были вооружены двумя 450-мм торпедными трубами. Все три корабля были списаны к середине 1930-х годов."
 POR_submarine_2: "Класс Делфима"
 POR_submarine_2_desc: "Класс Дельфима состоял из пары подводных лодок, первоначально заказанных и установленных в Италии для португальских ВМС в начале 1930-х годов. Заказ был отменен, и вместо этого они были завершены для Итальянских ВМС. Они основывались на большом итальянском классе Сквало, заменяя 980 тонн и вооружившись восемью 533-мм торпедными трубами."
 POR_submarine_4: "Класс нарвала"
 POR_submarine_4_desc: "Класс нарваля состоял из трех британских подводных лодок класса Subtle, которые были сданы в эксплуатацию в 1945 году и проданы Португалии после Второй мировой войны. Они переместили 840 тонн и были вооружены 7 533-мм торпедными трубами."
 POR_destroyer_1: "Класс &lt; &lt; Доуро &gt; &gt;"
 POR_destroyer_1_desc: "В начале 1930-х годов группа &lt; &lt; Доуро &gt; &gt; состояла из семи эсминцев, которые были построены как в Португалии, так и в Великобритании. Два корабля были проданы Колумбии в 1934 году."
 ### PRU - PERU ###
 PRU_submarine_1: "R Класс"
 PRU_submarine_1_desc: "Подводные лодки перуанского класса R состояли из четырех подлодок, которые были заказаны и построены США в середине 1920-х годов. По существу они были идентичны подводным лодкам американского класса R, заменяя более 570 тонн и вооружившись четырьмя 533-мм торпедными трубами."
 PRU_destroyer_1: "Класс альмиранты"
 PRU_destroyer_1_desc: "Альмиранте Вильяр и Амиранте Гизе были двумя бывшими российскими эсминцами класса Новик, у которых была кольцевая дорожка к перуанскому военно-морскому флоту, плавающему под флагами как Великобритании, так и Эстонии, после чего они были окончательно доставлены в Перу в 1934 году, они были вооружены четырьмя 102-мм/60 калибрами и девятью 533-мм торпедными трубами, они переместились более чем на 1200 тонн и имели достойную скорость для своего размера и винтаж."
 PRU_light_cruiser_1: "Класс &lt; &lt; Альмиранте Грау &gt; &gt;"
 PRU_light_cruiser_1_desc: "Класс Альмиранте Грау состоял из двух легких крейсеров, созданных в Великобритании для перуанских военно-морских сил и заказанных в 1907 году."
 ### RAJ - BRITISH RAJ ###
 RAJ_submarine_1: "L Класс"
 RAJ_submarine_1_desc: "Класс L был среднегабаритными лодками, первоначально запланированными в рамках программы чрезвычайных военных действий в качестве усовершенствованной версии предыдущих классов подводных лодок. Они были построены на поздних этапах Первой мировой войны и оснащены новыми, более крупными 21 торпедами. Они служили до начала Второй мировой войны, когда они в основном использовались для выполнения вспомогательных и учебных обязанностей."
 RAJ_submarine_2: "Класс"
 RAJ_submarine_2_desc: "Корабли класса Т или класса Тритон были спроектированы для замены крупных подводных лодок класса О, Р и Р. Это были умеренно крупные подводные лодки с большим радиусом действия, хорошо приспособленные для Атлантического и Тихого океанов. Эти лодки были хорошо вооружены, стабильны и широко использовались во время конфликта, поскольку 25 процентов построенных лодок были потеряны во время войны."
 RAJ_submarine_3: "U Класс"
 RAJ_submarine_3_desc: "Класс U был небольшими подводных лодками, построенными в рамках чрезвычайных военных программ 1940 и 1941 годов. Изначально спроектированными как тренировочные подводные лодки по мере начала войны, проект был изменен, что позволило этим подводным лодкам оказаться полезными в замкнутых водах Северного моря и Средиземноморья. Из-за их меньшего размера их дальность и оружие были ограничены. Три подкласса составляли класс: Undine, Umpire и Uproar."
 RAJ_submarine_4: "V Класс"
 RAJ_submarine_4_desc: "Подводные лодки класса V или вампирского класса основывались на предыдущих малогабаритных лодках класса U. Они были более крупными, но все же относительно небольшими, с более высокой пропускной способностью на море, но с ограниченной оперативной дальностью и оружием."
 RAJ_destroyer_1: "V/W Класс"
 RAJ_destroyer_1_desc: "Эти эсминцы включали в себя адмирализацию и классы Tornycroft V и W. Они были построены в рамках программы чрезвычайных военных действий. Они были конечной эволюцией британского эсминца во время Первой мировой войны, воплощавшей в себе усовершенствования их предшественников, а также новые технологические достижения. Большое число этих кораблей было построено на поздних этапах WWI и впоследствии стало краеугольным камнем эсминных флотов Королевского флота. Начиная с 1930-х годов они были размещены в резервных флотах, которые в конечном итоге использовались для сопровождения конвоя. Они были достаточно вооружены, быстрые суда с хорошим радиусом действия."
 RAJ_destroyer_2: "Класс G/H/I"
 RAJ_destroyer_2_desc: "Разрушители классов G, H и I были заказаны в рамках военно-морских строительных программ 1933 и 1934 годов. Они, как правило, повторялись в предыдущем классе F, с небольшим сокращением размера. Боеприпасы в классах G и H были такими же, как и в классе F, оба из которых использовали 4,7 в. пушки. Эти корабли имели дальний радиус действия, были достаточно вооружены и имели сильный торпедный компонент. Они широко использовались во время войны и понесли многочисленные потери."
 RAJ_destroyer_3: "Класс J/K/N"
 RAJ_destroyer_3_desc: "Классы J, K и N были аналогичны предыдущим классам племени, но вместо того, чтобы делать упор на оружие, дизайнеры вернулись к более стандартной тяжелой торпеде и более легкой ружейной установке. Корабли были модифицированы на протяжении всей их военной службы. Модернизация включала усовершенствование зенитных орудий и радаров. Они были быстрыми, дальними и хорошо вооруженными судами, идеальными для сопровождения флота."
 RAJ_destroyer_4: "Боевой класс"
 RAJ_destroyer_4_desc: "Разрушители боевого класса строились на эволюции британских эсминцев, использовавшихся во время войны. Корабли были заказаны в рамках военно-морских программ 1942 и 1943 годов. Они были хорошо вооружены как с точки зрения оружия, так и с точки зрения их торпед."
 RAJ_light_cruiser_1: "C Класс."
 RAJ_light_cruiser_1_desc: "Легкие крейсеры класса С представляли собой группу из 28 лёгких крейсеров Королевского флота, которые были построены до и во время Первой мировой войны для тяжелых условий в Северном море. Они были накачанными и способными к эксплуатации судами, несмотря на то, что они были несколько небольшими и узкими. Их вооружения были более чем удовлетворительными, поскольку они перевозили в них шесть единиц оружия для борьбы с наземными целями противника и тяжелой торпедой. Они видели широкое применение во время WWI и участвовали во многих действиях на поверхности. К середине 1930-х годов в эксплуатации находились только подклассы Каледона, Сереса и Карлайла."
 RAJ_basic_light_cruiser: "Класс Саутгемптона"
 RAJ_light_cruiser_2: "Класс Саутгемптона"
 RAJ_light_cruiser_2_desc: "Легкие крейсеры класса Саутгемптон были подклассом крейсеров городского класса и предназначались для борьбы с японскими крейсерами класса Могами. Эти суда были хорошо бронированы, имели хорошую скорость и дальность движения и несли огромные вооружения в количестве 12 6 единиц."
 RAJ_light_cruiser_3: "Класс королевской колонии"
 RAJ_light_cruiser_3_desc: "Легкие крейсеры класса "Корона Колония" были улучшены версий предыдущего городского класса, но с упрощенным дизайном для ускорения строительства и снижения издержек. Королевы несли те же пушки, что и их предшественники, четыре тройные турниры, в которых было 6 пушек. Они были аналогичным образом бронированы, но из-за их небольших двигателей их диапазон был несколько уменьшен."
 RAJ_light_cruiser_4: "Класс минотавров"
 RAJ_light_cruiser_4_desc: "Эти крейсеры были спроектированы как модифицированная версия класса королевской колонии, включая изменения в войне, которые были разрешены в 1941 году. Они имели более высокую боевую дальность и более большое количество оружия АА, чем класс королевской колонии, в то время как основное вооружение было сокращено до трех тройных турниров. Построено слишком поздно, чтобы повлиять на исход войны, большинство заказанных судов было впоследствии отменено."
 RAJ_heavy_cruiser_1: "Класс Hawkins"
 RAJ_heavy_cruiser_1_desc: "Крейсеры класса Хокинс были первыми в мире тяжелыми крейсерами. Они были основаны на более ранних легких крейсерах городского класса, в частности на подклассе Бирмингема, но были оснащены 7,5 в. пушки и более толстым бронепоясом. Они были предназначены для борьбы с крупными рейдерами в Германии. Они были хорошо вооружены, имели разумную скорость и дальность и хорошую защиту. В общей сложности пять кораблей были заказаны, но только четыре были активированы в начале WWII."
 RAJ_heavy_cruiser_2: "Суррейский класс"
 RAJ_heavy_cruiser_2_desc: "В рамках морской программы 1928 года были предложены тяжелые крейсеры класса &quot; Суррей &quot; , улучшенные версии более ранних крейсеров Йоркского класса. Если бы они были завершены, они были бы оснащены четырьмя восемью близнецами, ружьями, более тяжелыми доспехами и более мощными двигателями. Два корабля были заказаны, но ни один из них не был сложен."
 RAJ_heavy_cruiser_3: "Адмирал Класс"
 RAJ_heavy_cruiser_3_desc: "Тяжелые крейсеры адмирального класса (не следует путать с боевыми круизами адмирального класса) были последней попыткой Королевского ВМС спроектировать и построить крейсеры с 8 пушками. Проектирование началось в 1938 году и завершилось в 1941 году, в результате чего были выдвинуты различные предложения."
 RAJ_heavy_cruiser_4: "Черчилль Дизайн"
 RAJ_heavy_cruiser_4_desc: "Эти корабли были предложены сэром Уинстоном Черчиллем, лордом Адмиралии, на ранних этапах Второй мировой войны, чтобы противостоять крупным крейсерам немецкого класса Deutschland. Эти суда имели бы 9,2 пушек, тяжелые АА и мощные бронежилеты. Они были предназначены для эффективной борьбы с вражескими столицами. В конечном счете, корабли были отменены из-за высоких расходов и отсутствия спроса на новый тяжелый крейсер."
 RAJ_battle_cruiser_1: "Реномерный класс"
 RAJ_battle_cruiser_1_desc: "Боевые круизеры класса Renown были изначально заложены в качестве улучшенных версий боевых кораблей класса Revenge. Их строительство было приостановлено в начале WWI. Адмирал Лорд Фишер смог возобновить их строительство в качестве боевых круизеров. Эти корабли были квинтуозным боевиком. Они были хорошо вооружены, быстро и маневрируемы, но имели тонкие доспехи и более короткий оперативный диапазон. Было завершено строительство только двух из первых трех кораблей - Repulse и Renown."
 RAJ_battle_cruiser_2: "Королевский класс принцессы"
 RAJ_battle_cruiser_2_desc: "Принцесса Роял была классом гипотетических боевых круизеров, которые представляли собой более быструю и дешевую версию боевых кораблей класса Кинг Джордж V. Эти суда имели аналогичное, но сокращенное вооружение как для наземных, так и для противовоздушных боёв: два из 14 пушек и шесть близнецов 5,25 в. Пушки AA. Их быстрая скорость и дальность позволили бы Королевским ВМС быстро нанести удар и защитить конвой, но их ограниченные доспехи были бы проблематичны, если бы им пришлось бороться с современными боевыми кораблями."
 RAJ_battleship_1:1 "Класс мести"
 RAJ_battleship_1_desc:1 "В 1913 году были заказаны боевые корабли класса Месть в качестве дешевых версий королевы Елизаветы. В то время как они также были вооружены и бронированы, их скорость была значительно ниже, и они были вынуждены выполнять второстепенные функции во время Второй мировой войны. Из 8 предусмотренных кораблей класса только 5 были завершены."
 RAJ_battleship_2: "Класс короля Георга V"
 RAJ_battleship_2_desc: "В 1922 и 1930 годах были заключены первые договоры о военно-морском флоте, которые ограничивали максимальное перемещение и стрельбу столиц. Таким образом, эти корабли были оснащены меньшекалиберными пушками, чем ранее, и даже современными боевыми кораблями. Несмотря на меньший калибр, корабли были достаточно вооружены, несли сильное оружие АА и имели надлежащую защиту. Пять кораблей были заказаны и заложены в качестве замены старым кораблям класса королевы Елизаветы."
 RAJ_battleship_3: "Класс льва"
 RAJ_battleship_3_desc: "Боевые корабли класса "Львов" были последующим классом к королю Георгу V с множеством их особенностей. Шесть кораблей были заказаны в военно-морской программе 1938 года, чтобы заменить стареющие боевые корабли класса "Мстить", но ни один из них не был закончен из-за вспыхнувших боевых действий. Эти корабли были бы общими, как и к королю Джорджу, но основные вооружения были бы тяжелее, введя новые 16 в. пушки. У них также были бы более толстые брони и более мощные двигатели."
 RAJ_battleship_4: "Класс авангарда"
 RAJ_battleship_4_desc: "Боевой корабль класса &lt; &lt; Вангард &gt; &gt; был последним катетером, который был построен для Королевского флота. &lt; &lt; Один корабль &gt; &gt; был заказован, но еще четыре корабля были рассмотрены для тихоокеанского театра. &lt; &lt; Заказ &gt; &gt; в рамках программы &lt; &lt; Экстренная война 1940 года &gt; &gt; , строительство не получило первоочередного внимания и было завершено после войны. &lt; &lt; Класс &gt; &gt; имел &lt; &lt; слайд &gt; &gt; , что обеспечило прекрасную стабильность и мореходность. &lt; &lt; Оружие &gt; &gt; было таким же, как и корабли класса &lt; &lt; Королева Елизавет &gt; &gt; и &lt; &lt; &lt; &lt; Ревен &gt; &gt; &gt; , которые обеспечили значительную огненную мощь."
 RAJ_SH_battleship_1: "Класс центуриона"
 RAJ_SH_battleship_1_desc: "Центурион был классом гипотетических тяжелых боевых кораблей Королевского ВМС, построенных для борьбы с крупными судами немецких и японских морских судов. 18 больших ружей и толстых бронежилетов обеспечивают корабль необходимой огневой мощью и защитой для борьбы с этими кораблями. Сильные вооружения АА, большие расстояния и хорошая скорость были необходимы для охвата обширных морей Британской империи."
 RAJ_SH_battleship_2: "Львиный II класс"
 RAJ_SH_battleship_2_desc: "Боевые корабли класса "Лион II" были спроектированы в 1944 году как улучшенная версия предыдущего боевого корабля класса "Лион". Включая уроки военного времени, этот проект был больше и тяжелее, и в случае его завершения он будет перевозить три или четыре тройных 16 ружей последнего типа. Толстые бронежилеты защищали корабль от любых поверхностных или воздушных врагов. Расходы на строительство этих кораблей, поражение вражеских мореплавателей и необходимость в авиаперевозчиках привели к отказу от проекта."
 RAJ_carrier_1: "Мужественный класс"
 RAJ_carrier_1_desc: "Эти три авианосца были переоборудованы в боевые круизеры и были первыми авианосцами Королевского военно-морского флота, которые были преобразованы в результате заключения Вашингтонского военно-морского договора 1922 года и завершения работ в 1925 году."
 RAJ_carrier_2: "Ковчег Королевского класса"
 RAJ_carrier_2_desc: "В 1934 году судно было хорошо бронетранспортировано и вооружено, на нем находилось большое количество воздушных судов и была обеспечена достаточная оперативная дальность и скорость для того, чтобы успевать за основными силами Королевского флота."
 RAJ_carrier_3: "Яркий класс"
 RAJ_carrier_3_desc: "Иллюстрированный класс был разработан в соответствии с ограничениями второго Лондонского договора о военно-морском флоте 1936 года, который ограничил размер перевозчика верхним пределом в 23 000 тонн. Она была первой британской авиакомпанией, которая имела бронированную полетную палубу, которая сократила размер авиагруппы. Тяжелые бронежилеты и вооружения АА обеспечили прочную защиту для судов, в то время как мощные двигатели и большой топливный склад дали судам большой оперативный радиус."
 RAJ_carrier_4: "Неукрепляемый класс"
 RAJ_carrier_4_desc: "Самолеты закрытого класса были заказаны в соответствии с Морской программой 1938 года и были в основном улучшены версий предыдущего класса Illustruction. &quot; Война &quot; и перенос приоритета на более мелкие суда для обеспечения защиты автоколонн на ранних и средних этапах войны замедлили ограничение этих судов; они были более крупными судами, способными перевозить больше самолетов при сохранении толстой брони как на корпусе, так и на палубе полета. &quot; Более мощные &quot; двигатели обеспечили им более высокую скорость и оперативный диапазон по сравнению с классом Illustrective &quot; ."
 ### ROM - ROMANIA ###
 ROM_submarine_1: "Класс Delfinul"
 ROM_submarine_1_desc: "Дельфинул — румынская подводная лодка, построенная в Италии для румынских военно-морских сил."
 ROM_submarine_3: "Класс орехов"
 ROM_submarine_3_desc: "Подводные лодки Рекинул и Марсуинул были построены немцами для их румынских союзников. Они были заказаны в 1943 году. Корабли основывались на немецких подводных лодках типа VII. Корабли были средними подводных лодками, заменявшими 600 тонн, и были вооружены шестью 533-мм торпедными трубами."
 ROM_destroyer_1: "Класс марасти"
 ROM_destroyer_1_desc: "Класс Марасти был классом эсминцев, построенных для Румынии во время Первой мировой войны. Четыре корабля этого класса были реквизированы Итальянским ВМС во время войны, а два были в конце концов проданы Румынии в начале 1920-х годов. Они были более крупными эсминцами, снявшими более 1400 тонн. Они были вооружены четырьмя 120-мм 45-м ружьями Шнайдер-Канет-Армстронг и четырьмя 450-мм торпедными трубами."
 #ROM_destroyer_1b: "Класс &quot; Регеле Фердинанд &quot;"
 ### SAF - SOUTH AFRICA ###
 SAF_submarine_1: "L Класс"
 SAF_submarine_1_desc: "Класс L был среднегабаритными лодками, первоначально запланированными в рамках программы чрезвычайных военных действий в качестве усовершенствованной версии предыдущих классов подводных лодок. Они были построены на поздних этапах Первой мировой войны и оснащены новыми, более крупными 21 торпедами. Они служили до начала Второй мировой войны, когда они в основном использовались для выполнения вспомогательных и учебных обязанностей."
 SAF_submarine_2: "Класс"
 SAF_submarine_2_desc: "Корабли класса Т или класса Тритон были спроектированы для замены крупных подводных лодок класса О, Р и Р. Это были умеренно крупные подводные лодки с большим радиусом действия, хорошо приспособленные для Атлантического и Тихого океанов. Эти лодки были хорошо вооружены, стабильны и широко использовались во время конфликта, поскольку 25 процентов построенных лодок были потеряны во время войны."
 SAF_submarine_3: "U Класс"
 SAF_submarine_3_desc: "Класс U был небольшими подводных лодками, построенными в рамках чрезвычайных военных программ 1940 и 1941 годов. Изначально спроектированными как тренировочные подводные лодки по мере начала войны, проект был изменен, что позволило этим подводным лодкам оказаться полезными в замкнутых водах Северного моря и Средиземноморья. Из-за их меньшего размера их дальность и оружие были ограничены. Три подкласса составляли класс: Undine, Umpire и Uproar."
 SAF_submarine_4: "V Класс"
 SAF_submarine_4_desc: "Подводные лодки класса V или вампирского класса основывались на предыдущих малогабаритных лодках класса U. Они были более крупными, но все же относительно небольшими, с более высокой пропускной способностью на море, но с ограниченной оперативной дальностью и оружием."
 SAF_destroyer_1: "V/W Класс"
 SAF_destroyer_1_desc: "Эти эсминцы включали в себя адмирализацию и классы Tornycroft V и W. Они были построены в рамках программы чрезвычайных военных действий. Они были конечной эволюцией британского эсминца во время Первой мировой войны, воплощавшей улучшения их предшественников, а также новые технологические достижения. Большое число этих кораблей было построено на поздних этапах WWI и впоследствии стало основой эсминических флотов Королевского флота. Начиная с 1930-х годов они были помещены в резервные флоты, в конечном итоге были выброшены на конвоевые рейсы. Они были надлежащим образом вооружены, быстрые суда с хорошей дальностью."
 SAF_destroyer_2: "Класс G/H/I"
 SAF_destroyer_2_desc: "Разрушители классов G, H и I были заказаны в рамках военно-морских строительных программ 1933 и 1934 годов. Они, как правило, повторялись в предыдущем классе F, с небольшим сокращением размера. Боеприпасы в классах G и H были такими же, как и в классе F, оба из которых использовали 4,7 в. пушки. Эти корабли имели дальний радиус действия, были достаточно вооружены и имели сильный торпедный компонент. Они широко использовались во время войны и понесли многочисленные потери."
 SAF_destroyer_3: "Класс J/K/N"
 SAF_destroyer_3_desc: "Классы J, K и N были аналогичны предыдущим классам племени, но вместо того, чтобы делать упор на оружие, дизайнеры вернулись к более стандартной тяжелой торпеде и более легкой ружейной установке. Корабли были модифицированы на протяжении всей их военной службы. Модернизация включала усовершенствование зенитных орудий и радаров. Они были быстрыми, дальними и хорошо вооруженными судами, идеальными для сопровождения флота."
 SAF_destroyer_4: "Боевой класс"
 SAF_destroyer_4_desc: "Разрушители боевого класса были построены на эволюции британских эсминцев, использовавшихся во время войны. Корабли были заказаны в рамках военно-морских программ 1942 и 1943 годов. Они были хорошо вооружены как с точки зрения оружия, так и с точки зрения их торпед."
 SAF_light_cruiser_1: "C Класс."
 SAF_light_cruiser_1_desc: "Легкие крейсеры класса С представляли собой группу из 28 лёгких крейсеров Королевского флота, которые были построены до и во время Первой мировой войны для тяжелых условий в Северном море. Они были накачанными и способными к эксплуатации судами, несмотря на то, что они были несколько небольшими и узкими. Их вооружения были более чем удовлетворительными, поскольку они перевозили в них шесть единиц оружия для борьбы с наземными целями противника и тяжелой торпедой. Они видели широкое применение во время WWI и участвовали во многих действиях на поверхности. К середине 1930-х годов в эксплуатации находились только подклассы Каледона, Сереса и Карлайла."
 SAF_light_cruiser_2: "Класс Саутгемптона"
 SAF_light_cruiser_2_desc: "Легкие крейсеры класса Саутгемптон были подклассом крейсеров городского класса и предназначались для борьбы с японскими крейсерами класса Могами. Эти суда были хорошо бронированы, имели хорошую скорость и дальность движения и несли огромные вооружения в количестве 12 6 единиц."
 SAF_light_cruiser_3: "Класс королевской колонии"
 SAF_light_cruiser_3_desc: "Легкие крейсеры класса "Корона Колония" были улучшены версий предыдущего городского класса, но с упрощенным дизайном для ускорения строительства и снижения издержек. Королевы несли те же пушки, что и их предшественники, четыре тройные турниры, в которых было 6 пушек. Они были аналогичным образом бронированы, но из-за их небольших двигателей их диапазон был несколько уменьшен."
 SAF_light_cruiser_4: "Класс минотавров"
 SAF_light_cruiser_4_desc: "Эти крейсеры были спроектированы как модифицированная версия класса королевской колонии, включая изменения в войне, которые были разрешены в 1941 году. Они имели более высокую боевую дальность и более большое количество оружия АА, чем класс королевской колонии, в то время как основное вооружение было сокращено до трех тройных турниров. Построено слишком поздно, чтобы повлиять на исход войны, большинство заказанных судов было впоследствии отменено."
 SAF_heavy_cruiser_1: "Класс Hawkins"
 SAF_heavy_cruiser_1_desc: "Крейсеры класса Хокинс были первыми в мире тяжелыми крейсерами. Они были основаны на более ранних легких крейсерах городского класса, в частности на подклассе Бирмингема, но были оснащены 7,5 в. пушки и более толстым бронепоясом. Они были предназначены для борьбы с крупными рейдерами в Германии. Они были хорошо вооружены, имели разумную скорость и дальность и хорошую защиту. В общей сложности пять кораблей были заказаны, но только четыре были активированы в начале WWII."
 SAF_heavy_cruiser_2: "Суррейский класс"
 SAF_heavy_cruiser_2_desc: "В рамках морской программы 1928 года были предложены тяжелые крейсеры класса &quot; Суррей &quot; , улучшенные версии более ранних крейсеров Йоркского класса. Если бы они были завершены, они были бы оснащены четырьмя восемью близнецами, ружьями, более тяжелыми доспехами и более мощными двигателями. Два корабля были заказаны, но ни один из них не был сложен."
 SAF_heavy_cruiser_3: "Адмирал Класс"
 SAF_heavy_cruiser_3_desc: "Тяжелые крейсеры адмирального класса (не следует путать с боевыми круизами адмирального класса) были последней попыткой Королевского ВМС спроектировать и построить крейсеры с 8 пушками. Проектирование началось в 1938 году и завершилось в 1941 году, в результате чего были выдвинуты различные предложения."
 SAF_heavy_cruiser_4: "Черчилль Дизайн"
 SAF_heavy_cruiser_4_desc: "Эти корабли были предложены сэром Уинстоном Черчиллем, лордом Адмиралии, на ранних этапах Второй мировой войны, чтобы противостоять крупным крейсерам немецкого класса Deutschland. Эти суда имели бы 9,2 пушек, тяжелые АА и мощные бронежилеты. Они были предназначены для эффективной борьбы с вражескими столицами. В конечном счете, корабли были отменены из-за высоких расходов и отсутствия спроса на новый тяжелый крейсер."
 SAF_battle_cruiser_1: "Реномерный класс"
 SAF_battle_cruiser_1_desc: "Боевые круизеры класса Renown были изначально заложены в качестве улучшенных версий боевых кораблей класса Revenge. Их строительство было приостановлено в начале WWI. Адмирал Лорд Фишер смог возобновить их строительство в качестве боевых круизеров. Эти корабли были квинтуозным боевиком. Они были хорошо вооружены, быстро и маневрируемы, но имели тонкие доспехи и более короткий оперативный диапазон. Было завершено строительство только двух из первых трех кораблей - Repulse и Renown."
 SAF_battle_cruiser_2: "Королевский класс принцессы"
 SAF_battle_cruiser_2_desc: "Принцесса Роял была классом гипотетических боевых круизеров, которые представляли собой более быструю и дешевую версию боевых кораблей класса Кинг Джордж V. Эти суда имели аналогичное, но сокращенное вооружение как для наземных, так и для противовоздушных боёв: два из 14 пушек и шесть близнецов 5,25 в. Пушки AA. Их быстрая скорость и дальность позволили бы Королевским ВМС быстро нанести удар и защитить конвой, но их ограниченные доспехи были бы проблематичны, если бы им пришлось бороться с современными боевыми кораблями."
 SAF_battleship_1:1 "Класс мести"
 SAF_battleship_1_desc:1 "В 1913 году были заказаны боевые корабли класса Месть в качестве дешевых версий королевы Елизаветы. В то время как они также были вооружены и бронированы, их скорость была значительно ниже, и они были вынуждены выполнять второстепенные функции во время Второй мировой войны. Из 8 предусмотренных кораблей класса только 5 были завершены."
 SAF_battleship_2: "Класс короля Георга V"
 SAF_battleship_2_desc: "В 1922 и 1930 годах были заключены первые договоры о военно-морском флоте, которые ограничивали максимальное перемещение и стрельбу столиц. Таким образом, эти корабли были оснащены меньшекалиберными пушками, чем ранее, и даже современными боевыми кораблями. Несмотря на меньший калибр, корабли были достаточно вооружены, несли сильное оружие АА и имели надлежащую защиту. Пять кораблей были заказаны и заложены в качестве замены старым кораблям класса королевы Елизаветы."
 SAF_battleship_3: "Класс льва"
 SAF_battleship_3_desc: "Боевые корабли класса "Львов" были последующим классом к королю Георгу V с множеством их особенностей. Шесть кораблей были заказаны в военно-морской программе 1938 года, чтобы заменить стареющие боевые корабли класса "Мстить", но ни один из них не был закончен из-за вспыхнувших боевых действий. Эти корабли были бы общими, как и к королю Джорджу, но основные вооружения были бы тяжелее, введя новые 16 в. пушки. У них также были бы более толстые брони и более мощные двигатели."
 SAF_battleship_4: "Класс авангарда"
 SAF_battleship_4_desc: "Боевой корабль класса &quot; Вангард &quot; был последним кораблем, который был построен для Королевского флота. &quot; Было заказано &quot; , но еще четыре корабля были рассмотрены для тихоокеанского театра. &quot; В соответствии с программой чрезвычайных военных действий 1940 года &quot; строительство не приобрело приоритетного значения, и оно было завершено после войны. &quot; Класс &quot; имел стеклянный корпус, который обеспечивал прекрасную стабильность и мореходность. &quot; Оружие &quot; было таким же, как и корабли класса &quot; Королева Елизавета &quot; и &quot; Месть &quot; , которые обеспечивали значительную огневую мощь. &quot; Сильные двигатели и хорошие доспехи &quot; сделали судно быстрым и хорошо защищенным."
 SAF_SH_battleship_1: "Класс центуриона"
 SAF_SH_battleship_1_desc: "Центурион был классом гипотетических тяжелых боевых кораблей Королевского ВМС, построенных для борьбы с крупными судами немецких и японских морских судов. 18 больших ружей и толстых бронежилетов обеспечивают корабль необходимой огневой мощью и защитой для борьбы с этими кораблями. Сильные вооружения АА, большие расстояния и хорошая скорость были необходимы для охвата обширных морей Британской империи."
 SAF_SH_battleship_2: "Львиный II класс"
 SAF_SH_battleship_2_desc: "Боевые корабли класса "Лион II" были спроектированы в 1944 году как улучшенная версия предыдущего боевого корабля класса "Лион". Включая уроки военного времени, этот проект был больше и тяжелее, и в случае его завершения он будет перевозить три или четыре тройных 16 ружей последнего типа. Толстые бронежилеты защищали корабль от любых поверхностных или воздушных врагов. Расходы на строительство этих кораблей, поражение вражеских мореплавателей и необходимость в авиаперевозчиках привели к отказу от проекта."
 SAF_carrier_1: "Мужественный класс"
 SAF_carrier_1_desc: "Эти три авианосца были переоборудованы в боевые круизеры и были первыми авианосцами Королевского военно-морского флота, которые были преобразованы в результате заключения Вашингтонского военно-морского договора 1922 года и завершения работ в 1925 году."
 SAF_carrier_2: "Ковчег Королевского класса"
 SAF_carrier_2_desc: "В 1934 году судно было хорошо бронетранспортировано и вооружено, на нем находилось большое количество воздушных судов и была обеспечена достаточная оперативная дальность и скорость для того, чтобы успевать за основными силами Королевского флота."
 SAF_carrier_3: "Яркий класс"
 SAF_carrier_3_desc: "Иллюстрированный класс был разработан в соответствии с ограничениями второго Лондонского договора о военно-морском флоте 1936 года, который ограничил размер перевозчика верхним пределом в 23 000 тонн. Она была первой британской авиакомпанией, которая имела бронированную полетную палубу, которая сократила размер авиагруппы. Тяжелые бронежилеты и вооружения АА обеспечили прочную защиту для судов, в то время как мощные двигатели и большой топливный склад дали судам большой оперативный радиус."
 SAF_carrier_4: "Неукрепляемый класс"
 SAF_carrier_4_desc: "Самолеты закрытого класса были заказаны в соответствии с Морской программой 1938 года и были в основном улучшены версий предыдущего класса Illustruction. &quot; Война &quot; и перенос приоритета на более мелкие суда для обеспечения защиты автоколонн на ранних и средних этапах войны замедлили ограничение этих судов; они были более крупными судами, способными перевозить больше самолетов при сохранении толстой брони как на корпусе, так и на палубе полета. &quot; Более мощные &quot; двигатели обеспечили им более высокую скорость и оперативный диапазон по сравнению с классом Illustrective &quot; ."
 ### SIA - SIAM ###
 SIA_submarine_2: "Класс Вилуна"
 SIA_submarine_2_desc: "Подводные лодки класса &quot; Вилун &quot; представляли собой четыре небольших прибрежных подводные лодки, которые были построены в Японии для Королевского тайского военно-морского флота в период с 1936 по 1938 год и вооружены пятью 533-мм торпедными трубами."
 SIA_destroyer_1: "Класс &lt; &lt; Фра Руанг &gt; &gt;"
 SIA_destroyer_1_desc: "Phra Ruang — бывший британский эсминец R-класса, который был продан Королевскому тайскому военно-морскому флоту в 1920 году и был вооружен тремя 120-мм 45-м пушками QF Mk IV и четырьмя 533-мм торпедными трубами."
 SIA_light_cruiser_3: "Класс задачи"
 SIA_light_cruiser_3_desc: "В классе Taskin были построены два легких крейсера в Италии, которые были запущены в 1941 году, но были реквизированы сиамским флотом в 1942 году, они должны были стать итальянскими крейсерами класса Etna AA в Реджиа-Марине, но так и не были закончены до Итальянского перемирия, они переместили 5900 тонн и были вооружены шестью 152-мм/53 автоматами OTO 1929 года в своем основном вооружении, у них были достойные доспехи, но они были бы довольно медленны для крейсера."
 SIA_heavy_cruiser_1: "Класс Шри-Айютиа"
 SIA_heavy_cruiser_1_desc: "Корабли береговой обороны класса Шри-Айютия, возможно, были последними кораблями этого типа, которые были построены в мире, и оба корабля этого класса были построены в Японии и заказаны для Королевского тайского военно-морского флота в 1938 году. Конструкция была сопоставима с небольшим крейсером (или крупным эсминецом) по размеру, с крейсером по скорости и с тяжелым крейсером по вооружению. Его основные пушки были четыре 203 мм/53 3-Shiki. Они были легко бронированы по сравнению с современными тяжелыми крейсерами."
 ### SPA - SOCIALIST SPAIN ###
 SPA_submarine_1: "B Класс."
 SPA_submarine_1_desc: "В 1922-1925 годах шесть судов этого класса были сданы в эксплуатацию в качестве однокорпусных судов, поэтому их надежность была субпарной, они были средними подводных лодками, заменяющими более 550 тонн, были вооружены четырьмя 450-мм торпедными трубами."
 #SPA_submarine_1b: "C Класс."
 SPA_submarine_2: "Класс общего обслуживания &lt; &lt; Мола &gt; &gt;"
 SPA_submarine_2_desc: "Класс генерала Молы был классом из четырех итальянских подводных лодок класса Archimedes, заказанных в 1934 году и переданных националистам в 1937 году, которые были достаточно большими, заменяя 880 тонн, но быстрее, чем большинство подлодок. Они были вооружены восемью 533-мм торпедными трубами и имели глубину ныряния 90 метров."
 SPA_submarine_3: "G Класс"
 SPA_submarine_3_desc: "Испанские подводные лодки класса G представляли собой пару немецких подводных лодок класса VIIC, построенных на основе лицензии, выданной компанией &quot; Националист Испания &quot; . Однако только одна из этих подводных лодок когда-либо была построена и переведена в Испанские военно-морские силы только в 1947 году. Подводные лодки переместили 770 тонн и были вооружены пятью 533-мм торпедными трубами."
 SPA_submarine_4: "D Класс."
 SPA_submarine_4_desc: "Все три подводные лодки испанского класса D были запущены в 1944 году и сданы в эксплуатацию в разное время после войны. Все три подводные лодки были спроектированы и построены в Испании."
 SPA_destroyer_1: "Класс Alsedo"
 SPA_destroyer_1_desc: "Три эсминцев класса Альседо были построены для Испанского ВМС в Испании на основе британского дизайна L-класса и были заказаны в период с 1924 по 1925 год, они переместились более чем в 1040 тонн и имели три 102-мм пушки Виккерса Mk LA в качестве основного вооружения, а также четыре 450-мм торпедные трубки. Они также имели достойную скорость и дальность для своего винтажного оружия."
 SPA_destroyer_2: "Класс чуррук"
 SPA_destroyer_2_desc: "С 1925 по 1933 год было выпущено 16 эсминцев, два из которых были позже проданы Аргентине. Корабли были спроектированы на основе британских эсминцев класса S и составляют основу испанского военно-морского флота во время Гражданской войны. Они переместились более чем на 1500 тонн и были вооружены пятью 120-мм 45-м пушками Викерс-Армстронг в их основных вооружениях, а также шесть 533-мм торпедных труб, у которых была хорошая скорость и отличная дальность."
 SPA_destroyer_4: "Класс Алавы"
 SPA_destroyer_4_desc: "Эсминцы класса «Алава» были запущены в послевоенный период в качестве усовершенствованных до предыдущего класса «Альмиранте Антекера» (который был подклассом предыдущего класса «Чурука»). Они переместили 1 710 тонн и имели четыре 120-мм 45 Викерс-Армстронг Мк Ф в качестве главного ружья. Их скорость и диапазон были сопоставимы с предыдущими конструкциями, на которых был построен этот класс."
 SPA_light_cruiser_1: "Класс &lt; &lt; Мендес Нуньес &gt; &gt;"
 SPA_light_cruiser_1_desc: "Легкие крейсеры класса Мендес Нуньес были парой крейсеров, построенных в Испании для Испанского ВМС в начале 1920-х годов. Корабли были заказаны в 1915 году, но нехватка материалов во время Первой мировой войны задержала строительство. На проект оказали сильное влияние британские крейсеры класса С. Крейсеры переместили около 4800 тонн, но были относительно медленными. В основном их вооружение состояло из 6 152-ммм пушек Vikers Mk V. Кроме того, они имели хорошие доспехи и дюжину 533-мм торпедных труб."
 #SPA_light_cruiser_1b: "Класс приинципа Альфонсо"
 SPA_heavy_cruiser_1: "Класс &lt; &lt; Принцесса-де-Астуриас &gt; &gt;"
 SPA_heavy_cruiser_1_desc: "Класс Принцессы-де-Астуриас состоял из трех бронированных крейсеров, которые были построены для испанского флота около конца века, все три были либо сломаны, либо разрушены к середине 1930-х годов, они были вооружены близнецами 240-мм Гильен М1896 и восемью 140-мм 33 ружьями Шнайдер-Канета, они были сильно бронированы, но также несколько медленны по сравнению со стандартным тяжелым крейсером."
 SPA_heavy_cruiser_2: "Класс канариата"
 SPA_heavy_cruiser_2_desc: "Два тяжелых крейсера класса Канариас были построены по спецификациям Вашингтонского военно-морского траектории, которые были запущены в начале 1930-х годов, но не завершены до 1936 года, они переместились почти на 10 700 тонн и имели хорошую скорость. Они были относительно легко бронированы, но забавлены восемью 203-мм пушками &lt; &lt; Виккерс-Армстронг &gt; &gt; Mk D в качестве основного оружия."
 SPA_battleship_1: "Класс Испании"
 SPA_battleship_1_desc: "Класс Espania изначально был классом из трех страшных боевых кораблей, которые были сданы в эксплуатацию во время Первой мировой войны, хотя один из них был разрушен во время Гражданской войны в Испании. Два других были потеряны во время войны. Они были довольно маленькими для боевого корабля, сместив чуть более 15 400 тонн. Однако у них были достойные доспехи и порядочная скорость, и у них была основная батарея из 8 305-ммм пушек виккерса H."
 ### SPR - REPUBLICAN SPAIN ###
 SPR_submarine_1: "B Класс."
 SPR_submarine_1_desc: "В 1922-1925 годах шесть судов этого класса были сданы в эксплуатацию в качестве однокорпусных судов, поэтому их надежность была субпарной, они были средними подводных лодками, заменяющими более 550 тонн, были вооружены четырьмя 450-мм торпедными трубами."
 #SPR_submarine_1b: "C Класс."
 SPR_submarine_2: "Класс общего обслуживания &lt; &lt; Мола &gt; &gt;"
 SPR_submarine_2_desc: "Класс генерала Молы был классом из четырех итальянских подводных лодок класса Archimedes, заказанных в 1934 году и переданных националистам в 1937 году, которые были достаточно большими, заменяя 880 тонн, но быстрее, чем большинство подлодок. Они были вооружены восемью 533-мм торпедными трубами и имели глубину ныряния 90 метров."
 SPR_submarine_3: "G Класс"
 SPR_submarine_3_desc: "Испанские подводные лодки класса G представляли собой пару немецких подводных лодок класса VIIC, построенных на основе лицензии, выданной компанией &quot; Националист Испания &quot; . Однако только одна из этих подводных лодок когда-либо была построена и переведена в Испанские военно-морские силы только в 1947 году. Подводные лодки переместили 770 тонн и были вооружены пятью 533-мм торпедными трубами."
 SPR_submarine_4: "D Класс."
 SPR_submarine_4_desc: "Все три подводные лодки испанского класса D были запущены в 1944 году и сданы в эксплуатацию в разное время после войны. Все три подводные лодки были спроектированы и построены в Испании."
 SPR_destroyer_1: "Класс Alsedo"
 SPR_destroyer_1_desc: "Три эсминцев класса Альседо были построены для Испанского ВМС в Испании на основе британского дизайна L-класса и были заказаны в период с 1924 по 1925 год, они переместились более чем в 1040 тонн и имели три 102-мм пушки Виккерса Mk LA в качестве основного вооружения, а также четыре 450-мм торпедные трубки. Они также имели достойную скорость и дальность для своего винтажного оружия."
 SPR_destroyer_2: "Класс чуррук"
 SPR_destroyer_2_desc: "С 1925 по 1933 год было выпущено 16 эсминцев, два из которых были позже проданы Аргентине. Корабли были спроектированы на основе британских эсминцев класса S и составляют основу испанского военно-морского флота во время Гражданской войны. Они переместились более чем на 1500 тонн и были вооружены пятью 120-мм 45-м пушками Викерс-Армстронг в их основных вооружениях, а также шесть 533-мм торпедных труб, у которых была хорошая скорость и отличная дальность."
 SPR_destroyer_4: "Класс Алавы"
 SPR_destroyer_4_desc: "Эсминцы класса «Алава» были запущены в послевоенный период в качестве усовершенствованных до предыдущего класса «Альмиранте Антекера» (который был подклассом предыдущего класса «Чурука»). Они переместили 1 710 тонн и имели четыре 120-мм 45 Викерс-Армстронг Мк Ф в качестве главного ружья. Их скорость и диапазон были сопоставимы с предыдущими конструкциями, на которых был построен этот класс."
 SPR_light_cruiser_1: "Класс &lt; &lt; Мендес Нуньес &gt; &gt;"
 SPR_light_cruiser_1_desc: "Легкие крейсеры класса Мендес Нуньес были парой крейсеров, построенных в Испании для Испанского ВМС в начале 1920-х годов. Корабли были заказаны в 1915 году, но нехватка материалов во время Первой мировой войны задержала строительство. На проект оказали сильное влияние британские крейсеры класса С. Крейсеры переместили около 4800 тонн, но были относительно медленными. В основном их вооружение состояло из 6 152-ммм пушек Vikers Mk V. Кроме того, они имели хорошие доспехи и дюжину 533-мм торпедных труб."
 #SPR_light_cruiser_1b: "Класс приинципа Альфонсо"
 SPR_heavy_cruiser_1: "Класс &lt; &lt; Принцесса-де-Астуриас &gt; &gt;"
 SPR_heavy_cruiser_1_desc: "Класс Принцессы-де-Астуриас состоял из трех бронированных крейсеров, которые были построены для испанского флота около конца века, все три были либо сломаны, либо разрушены к середине 1930-х годов, они были вооружены близнецами 240-мм Гильен М1896 и восемью 140-мм 33 ружьями Шнайдер-Канета, они были сильно бронированы, но также несколько медленны по сравнению со стандартным тяжелым крейсером."
 SPR_heavy_cruiser_2: "Класс канариата"
 SPR_heavy_cruiser_2_desc: "Два тяжелых крейсера класса Канариас были построены по спецификациям Вашингтонского военно-морского траектории, которые были запущены в начале 1930-х годов, но не завершены до 1936 года, они переместились почти на 10 700 тонн и имели хорошую скорость. Они были относительно легко бронированы, но забавлены восемью 203-мм пушками &lt; &lt; Виккерс-Армстронг &gt; &gt; Mk D в качестве основного оружия."
 SPR_battleship_1: "Класс Испании"
 SPR_battleship_1_desc: "Класс Espania изначально был классом из трех страшных боевых кораблей, которые были сданы в эксплуатацию во время Первой мировой войны, хотя один из них был разрушен во время Гражданской войны в Испании. Два других были потеряны во время войны. Они были довольно маленькими для боевого корабля, сместив чуть более 15 400 тонн. Однако у них были достойные доспехи и порядочная скорость, и у них была основная батарея из 8 305-ммм пушек виккерса H."
 ### SWE - SWEEDEN ###
 SWE_submarine_1: "Класс Хагена"
 SWE_submarine_1_desc: "В 1920-х годах для шведских ВМС были построены небольшие и средние подводные лодки. В 1920-х годах в классе Хагенов были установлены подводные лодки, которые переместили около 400 тонн и вооружены четырьмя 450-мм торпедными трубами."
 #SWE_submarine_1b: "Класс дрейка"
 SWE_submarine_2: "Класс Sjölejonet"
 SWE_submarine_2_desc: "Класс Sjölejonet состоял из девяти подводных лодок, построенных между 1936 и 1942 годами, которые представляли собой средние подводные лодки, заменяющие 580 тонн, и на их дизайне сильно повлияли подводные лодки класса O. Они были вооружены шестью 533-мм торпедными трубами и имели глубину ныряния 60 метров."
 SWE_submarine_3: "U Класс"
 SWE_submarine_3_desc: "Шведские подводные лодки U-класса состояли из девяти подлодок, заказанных в период с 1942 по 1944 год, были довольно небольшими и относительно медленными, заменяя только 370 тонн. Они были вооружены четырьмя 533-мм торпедными трубками."
 SWE_submarine_4: "Класс нептуна"
 SWE_submarine_4_desc: "Класс Нептуна состоял из трех средних подводных лодок, которые были сданы в эксплуатацию в 1943 году и использовались главным образом для горнорудных работ, они переместили 550 тонн и были вооружены пятью 533-мм торпедными трубами."
 SWE_destroyer_1: "Класс Ehrensköld"
 SWE_destroyer_1_desc: "Два эсминца класса Ehrensköld были завершены в 1927 году как первые современные эсминцы для Швеции после Первой мировой войны. Они переместились чуть более 970 тонн и были вооружены тремя 120-мм пушками K/45 и шестью 533-мм торпедными трубами. У них был короткий дальность, но хорошая скорость."
 SWE_destroyer_2: "Класс Göteborg"
 SWE_destroyer_2_desc: "Гётеборгский класс состоял из шести эсминцев, построенных между 1935 и 1942 годами, у них был более длинный корпус и улучшенный механизм по сравнению с их предшественниками, они переместились чуть более 1 020 тонн и имели основное вооружение 120-мм пушки K/45, а также шесть 533-мм торпедных труб, которые имели ограниченную дальность, но отличную скорость."
 SWE_destroyer_3: "Висбийский класс"
 SWE_destroyer_3_desc: "Четыре эсминца в Висбийском классе были построены в период с 1942 по 1944 год, похожие на предыдущий класс Göteborg, но более крупные, заменяющие более 1130 тонн, а также усовершенствованные двигатели, несколько более совершенные, и мощный комплект оборудования ASW."
 SWE_destroyer_4: "Класс Оланда"
 SWE_destroyer_4_desc: "Два эсминцев класса Оланд представляли собой радикальное изменение по сравнению с предыдущими конструкциями. Они были запущены и завершены вскоре после Второй мировой войны. Они были большими, заменяя 1880 тонн. Они были вооружены четырьмя 120-мм 45-м пушками М44 в их основных вооружениях и имели сильный АА, торпеду и АСО. Они были несколько медленнее, чем предыдущие эсминцы, но имели значительно более высокий дальность."
 SWE_light_cruiser_1: "Класс филгии"
 SWE_light_cruiser_1_desc: "Фильгия была относительно небольшим бронированным крейсером, который был заказан для шведского флота в 1905 году. В 1939—1941 годах она выполняла главным образом тренировочные работы, а в 1939—1941 годах была переоборудована, а затем переместилась более чем на 4300 тонн и была вооружена 6 152-мм пушками K/50 M1903. У нее была хорошая броня, но она была относительно медленной для крейсера."
 SWE_light_cruiser_4: "Класс Tre Kronor"
 SWE_light_cruiser_4_desc: "Класс Тре Кронора состоял из пары легких крейсеров, подготовленных для Шведского военно-морского флота сразу же после окончания Второй мировой войны. Они переместились чуть менее чем на 7 700 тонн и имели достойную скорость и дальность. Их основное вооружение состояло из семи 152/53 единиц оружия M42. Они имели большое количество пушек AA, торпед и оборудования ASW."
 SWE_heavy_cruiser_1: "Класс сверлижа"
 SWE_heavy_cruiser_1_desc: "Класс Sverige состоял из трех прибрежных боевых кораблей, которые были построены для шведского флота до Первой мировой войны. Эти корабли были более похожи на тяжелые крейсеры обоих размеров (переброска более 6 800 тонн) и вооружения (четыре 283 мм/44 K/45 M12). Корабли были относительно медленны для крейсера, но были очень хорошо бронированы. Все три корабля служили во время Второй мировой войны."
 ### URU - URUGUAY ###
 URG_destroyer_1: "Уругвайский класс"
 URG_destroyer_1_desc: "Уругвай был тяжелым торпедом, построенным в Германии для уругвайских военно-морских сил до Первой мировой войны. Он переместился более чем на 1400 тонн и был вооружен четырьмя 120-мм 45-километровыми пулеметами &lt; &lt; Крупп QF &gt; &gt; . У него было сильное дополнение АА и две 450-мм торпедные трубки. Учитывая их винтаж и большие размеры, они были довольно медленны по сравнению с другими разрушителями."
 ### VEN - VENEZUELA -- generic only ###
 ### VIC - VICHY FRANCE ###
 VIC_submarine_1: "серии 600"
 VIC_submarine_1_desc: "Подводные лодки мощностью 600 тонн были первыми во Франции современными подводными лодками WWI, которые, несмотря на то, что они были мореходными, были отнесены к прибрежным подводным лодкам и использовались главным образом в теплых водах Средиземного моря. В каждом из них были построены три класса из четырех кораблей такого типа: классы Сирена, Ариана и Цирсе. Они были основой для более крупных 630 тонн серии Argonaute, Diaane и Orion классов."
 #VIC_submarine_1b: "Серия 630"
 #VIC_submarine_1c: "Разрядный класс"
 VIC_submarine_2: "Класс минерва"
 VIC_submarine_2_desc: "Подводные лодки класса &quot; Минерв &quot; ( &quot; Проект Т2 &quot; ) основывались на 630-тонных сериях, хотя у них были более совершенные двигатели и различные торпеды. &quot; Эти подводные лодки &quot; были первой частью программы стандартизации, результатом которой стал централизованный проект DCAN ( &quot; Direction des Constructions et Armes Baile &quot; ) - довольно специфического верфи предыдущих классов."
 #VIC_submarine_2b: "Класс аурора"
 VIC_submarine_3: "Класс Роланда Морильота"
 VIC_submarine_3_desc: "Подводные лодки класса Роланд Морильот (проект Z2) представляли собой крупные морские подводные лодки, основанные на ранее существовавших подводных лодках класса Redubable."
 VIC_submarine_4: "Класс феникса"
 VIC_submarine_4_desc: "Подводные лодки класса Феникс были среднегабаритными океанскими лодками и лодками дальнего радиуса действия, разрешенными в рамках военно-морских программ 1939-40 годов, однако начало войны и падение Франции привели к отмене этих лодок."
 VIC_destroyer_1: "Курсский класс"
 VIC_destroyer_1_desc: "Разрушители класса Бурресков были частью серии 1 500 тонн и запущены в середине 1920-х годов. Вместе с предыдущим Чакалем и после уроков L'Adroit они были основой нового современного французского флота после войны. Они были быстро и хорошо вооружены в свое время, но их торпедное вооружение было меньше по сравнению с аналогичными судами в других морских флотах."
 #VIC_destroyer_1b: "Класс шакалов"
 #VIC_destroyer_1c: "Класс Aigle & Vauquelin"
 VIC_destroyer_2: "Класс &lt; &lt; Фантаск &gt; &gt;"
 VIC_destroyer_2_desc: "Эсминцы класса «Ле Фантаск» были по существу улучшенными версиями более ранних суперразрушителей 2400 тонн серии (Gepard, Aigle, Vauquelin), построенных в рамках военно-морской программы 1930 года."
 #VIC_destroyer_2b: "Класс Le Hardi"
 #VIC_destroyer_2c: "Класс могадоров"
 VIC_destroyer_3: "Класс L'Intrepid"
 VIC_destroyer_3_desc: "Эсминцы класса L'Intrepid были модифицированной версией предыдущих эсминцев класса Le Hardi. Они были санкционированы в 1938 и 1939 годах военно-морскими программами, но война и падение Франции привели к отмене этих судов. Они были бы в большей степени сосредоточены на зенитной роли, при этом их перемещение возросло до 2 800-2 900 тонн и более крупных двигателей."
 VIC_destroyer_4: "Класс &lt; &lt; хаша &gt; &gt;"
 VIC_destroyer_4_desc: "Классы Hoche и Bayard были последним супер-разрушителем французских ВМС. Оба класса были основаны на классе Могадора, заменяя 4200 тонн аналогичным основным вооружением, но усовершенствовав AA пушки и более сильные двигатели. Они были санкционированы военно-морскими программами 1939-40 года, но начало войны и падение Франции привели к отмене этих кораблей."
 VIC_light_cruiser_1: "Класс &lt; &lt; Дугуа-Труин &gt; &gt;"
 VIC_light_cruiser_1_desc: "Легкие крейсеры Дугуай-Труэн были первыми французскими военными кораблями, которые были построены после Первой мировой войны в 1922 году. Они стали первыми крейсерами с суперзащитой основных турниров. Среди легких крейсеров у них было сильное торпедное вооружение, но практически не было доспехов."
 VIC_light_cruiser_2: "Класс &lt; &lt; Галиссоньер &gt; &gt;"
 VIC_light_cruiser_2_desc: "Легкие крейсеры класса &lt; &lt; Ла Галиссонньер &gt; &gt; были ответом на итальянские лёгкие крейсеры типа &lt; &lt; Кондотири &gt; &gt; и основывались на предыдущем классе &lt; &lt; Эмиль Бертин &gt; &gt; , которые были построены в 1931 и 1932 годах в рамках военно-морских программ с типичным основным вооружением и адекватным вооружением AA в эпоху, они переместили 10 850 тонн, увеличили количество самолётов-скаутов и имели хорошую скорость."
 VIC_light_cruiser_3: "Класс &lt; &lt; де грыз &gt; &gt;"
 VIC_light_cruiser_3_desc: "Крейсеры класса &quot; Де Грасс &quot; были санкционированы в 1938 и 1939 годах военно-морскими программами и были в основном усовершенствованы &quot; Галиссонньер &quot; . &quot; У них было более сильное вооружение АА, а также более крупные двигатели. &quot; Падение Франции &quot; привело к отмене двух последних кораблей и к окончанию нового послевоенного корабля. &quot; Немцы &quot; намеревались прикончить ее в качестве легконосителя, но этот проект также не был осуществлен."
 VIC_light_cruiser_4: "Класс Колберта"
 VIC_light_cruiser_4_desc: "В 1956 году был запущен зенитный лёгкий крейсер класса Колберт, который был построен очень похожим на послевоенный крейсер De Grasse с тяжелым вооружением AA как на длинные, так и на короткие расстояния. Разница между Colbert и DeGrasse заключалась в том, что у Colbert были более мелкие двигатели, тоньше доспехи и немного меньше."
 VIC_heavy_cruiser_1: "Класс суфрена"
 VIC_heavy_cruiser_1_desc: "Тяжелые крейсеры класса Суффрен были в основном повторены в предыдущем классе Дюкейна с незначительными улучшениями в его способности к морским перевозкам. Оба класса напоминали современную философию крейсеров французского флота: очень тонкие доспехи, но хорошая скорость и дальность. Их стандартное смещение составляет 10 000 тонн, и они были оснащены оружием, которое было стандартным для тяжелого крейсера."
 VIC_heavy_cruiser_2: "Класс Algérie"
 VIC_heavy_cruiser_2_desc: "Тяжелые крейсеры класса &quot; Алгери &quot; были еще более улучшены по сравнению с предыдущими классами &quot; Суффрен &quot; и &quot; Дукесне &quot; , но были спроектированы как противники новых итальянских тяжелых крейсеров класса &quot; Зара &quot; . &quot; Основной бронепояс &quot; и &quot; подводная защита &quot; были значительно увеличены. &quot; Её вооружения АА &quot; были достаточны для своего времени, но из-за этих изменений стандартное смещение составило более 10 000 тонн."
 VIC_heavy_cruiser_3: "Класс Святого Луи"
 VIC_heavy_cruiser_3_desc: "Тяжелые крейсеры класса Сент-Луис основывались на классе Алгери, но общий взгляд был ближе к виду кораблей класса Дюнкерке и Ришелье. Три корабля были заказаны в 1940 году в рамках военно-морской программы, но из-за падения Франции ни один из них не был сложен. Они поместили новые пушки и усовершенствовали вооружение АА, но броня была такой же, как и в классе Альгери. Это был последний тяжелый крейсер французского флота."
 VIC_heavy_cruiser_4: "Класс Forbin"
 VIC_heavy_cruiser_4_desc: "Тяжелые крейсеры класса Форбин были гипотетическим дизайном в развитие класса Сент-Луиса, предназначенного для защиты торговых путей между материковой Францией и колониями, он имел большой диапазон и хорошую скорость вместе с тяжелым вооружением пушек в четырёх тройных турнирах и достаточным количеством оружия AA. Конструкция судна и общий вид похожи на влияние предыдущего класса Сент-Луиса, а также британской королевской колонии."
 VIC_battle_cruiser_1: "Durand-Viel Design"
 VIC_battle_cruiser_1_desc: "Durand-Viel Design of Battlecruiser была предложением из серии исследований, датируемых WWI. По сути, это были версии боевого круизера классов катеров Нормандии и Лиона с одними и теми же квадровыми турнирами и пушками, хотя и в меньшем количестве. Как и современные круизники других мореплавателей, они были бы более быстрыми, но менее бронированными, чем катер. Они были отменены до того, как вспыхнула WWI."
 VIC_battle_cruiser_2: "Класс Dunkerque"
 VIC_battle_cruiser_2_desc: "Dunkerques были созданы для борьбы с карманными кораблями немецкого класса Duutschland. Они были вершиной серии проектных исследований с середины 1920-х по начало 1930-х годов. В 1931 и 1934 годах они были похожи на британские боевые корабли класса Нельсон, все их основные туры были сконцентрированы вперёд. Это привело к сокращению бронежилетов и, таким образом, к тому, что меньшее судно вписывалось в ограничения по военно-морским договорам."
 VIC_battleship_1: "Класс курбета"
 VIC_battleship_1_desc: "Боевые корабли класса Курбет были первыми супер-дреднью, построенными для французских ВМС до и во время Первой мировой войны. Санкционированные в 1910 и 1911 годах, во время Первой мировой войны они видели ограниченную службу, но были активны во время Второй Мировой Войны. Хотя у них были более толстые брони и более сильные ружья, чем у предыдущих боевых кораблей класса Данте, они все еще были ниже современных военных кораблей США и RN. Они переместились чуть более 22 000 тонн, и их единственная модернизация до Второй Мировой Войны была улучшена и усовершенствованы котлоагрегаты."
 #VIC_battleship_1b: "Класс Бретагна" 
 VIC_battleship_2: "Класс Ришелье"
 VIC_battleship_2_desc: "Боевые корабли класса Ришелье были последними кораблями, заданными во французские военно-морские силы. Они были усовершенствованы и санкционированы в рамках военно-морских программ 1935 и 1938 годов. Они обладали отличным вооружением, скоростью и дальностью действия, что сделало их отличным крупным судном. Из четырех заказанных кораблей только два были запущены и один был завершен до падения Франции. Было предпринято множество попыток завершить оставшиеся корабли с различными конструкциями, которые были предложены для использования в качестве зенитных боевых кораблей, боевых кораблей-гибридов или полноразмерных перевозчиков."
 VIC_battleship_3: "Класс газового газа"
 VIC_battleship_3_desc: "Гасконский класс кораблей был подклассом класса Ришелье. Три корабля были заказаны в 1940 году, но ни один из них не был запущен. Проект был бы повторен Ришелье, но при равномерном распределении основных вооружений, улучшенном вооружении АА и модернизированных двигателях, что привело бы к общему лучшему судну."
 VIC_battleship_4: "Класс Alsace"
 VIC_battleship_4_desc: "С 1939 года было заказано четыре корабля, которые были завершены в 1940 году и которые, как ожидается, будут установлены в 1941 году, хотя падение Франции не позволило этому произойти, они улучшили дизайн Ришелье с помощью более тяжелых и многочисленных главных пушек, более мощных артиллерийских артиллерийских пушек, более толстых бронежилетов и более крупных двигателей."
 VIC_SH_battleship_1: "Класс шарлмагна"
 VIC_SH_battleship_1_desc: "Класс суперкорабельных кораблей Charlemagne был гипотетическим дизайном, совпадающим с большими кораблями других мореплавателей. Они имели тяжелое вооружение, все вперёд, в супер-фартинговых позициях, в тяжелых АА и в толстых доспехах. Весь дизайн был заимствован элементами из классов Ришелье и Британии Нельсон."
 VIC_SH_battleship_2: "Класс наполеона Бонапарта"
 VIC_SH_battleship_2_desc: "Боевые корабли класса Наполеон Бонапарт были гипотетическим дизайном и основывались на классах Эльзас и Гаскон. Его тяжелое вооружение распределялось равномерно в тройных турнирах, с суперподразделенными и тяжелым вооружением АА. Толстые доспехи и мощные двигатели обеспечивали скорость и защиту, необходимые для того, чтобы идти в ногу с другими кораблями флота и эффективно бороться с его противниками."
 VIC_carrier_1: "Класс Béarn"
 VIC_carrier_1_desc: "Первоначально Béarn был установлен в качестве боевого корабля класса Нормандии, но позднее закончился в качестве авианосца, сместив 22 100 тонн и работая в годы межгорода и WWII. В качестве переоборудованного перевозчика его скорость была медленной, и он имел ограниченное пространство для самолетов, но средний бронежилетный пояс и дальний диапазон восполнили эти недостатки. Его строительство дало французский дизайнеру в DCAN (Direction des Constructions et Armes Baile) важный опыт и привело к серии проектировочных исследований после этого."
 VIC_carrier_2: "Класс Joffre"
 VIC_carrier_2_desc: "Маршруты класса Джоффре (проект PA-16) были следующим поколением перевозчиков французских военно-морских сил. Это было последнее из проектных исследований, которые начались в 1929 году и закончились в 1937 году. Два корабля были санкционированы в рамках военно-морской программы 1938 года, однако эскалация конфликтов замедлила процесс строительства и в конечном итоге падение Франции помешало завершению строительства этих судов. Перемещение составило бы около 20 000 тонн. Они имели бы хорошее вооружение, бронежилеты и скорость, но были бы менее средней дополняемой авиацией."
 VIC_carrier_3: "Класс Жана Барта"
 VIC_carrier_3_desc: ""Джин Барт" - это предложение, сделанное в середине войны, о преобразовании незаконченного боевого корабля класса Ришелье Жана Барта в полноценную авиакомпанию, аналогично японскому IJN Shinano. Большой корпус будет иметь большой авиационный компонент, а вместе с крупными двигателями - дальний дальний и быстрый нос. Тяжелое вооружение АА американского происхождения обеспечило бы хорошую защиту от воздушных судов и мелких наземных комбатантов."
 VIC_carrier_4: "Класс Клеменсау"
 VIC_carrier_4_desc: "Самолет класса &quot; Клеменсау &quot; (проект под названием &quot; PA-28 &quot; ) был первым послевоенным дизайном французских военно-морских сил. &quot; Конструкция &quot; была бы аналогична незавершенным авиаперевозчикам класса &quot; Джоффре &quot; , хотя установленное оборудование и оружие были бы изготовлены из современных французских изделий. &quot; Приобретение &quot; USN &quot; и &quot; RN &quot; , а также &quot; Экономическое состояние &quot; после войны &quot; Франции не позволили уложить эти суда. &quot; Не следует путать с &quot; последними авиаперевозчиками класса Клеменсау &quot; ( &quot; Проект &quot; PA-54 &quot; ), которые были установлены в 1955 и 1957 годах."
 ### YUG - YUGOSLAVIA ###
 YUG_submarine_1: "Класс гради"
 YUG_submarine_1_desc: "Две подводные лодки класса &lt; &lt; Грабри &gt; &gt; первоначально были заложены как британские подводные лодки класса L для Королевского флота, но были проданы и в конечном итоге завершены для Югославии с использованием модифицированной конструкции в 1928 году."
 YUG_submarine_2: "Класс &quot; Осветник &quot;"
 YUG_submarine_2_desc: "Две подводные лодки класса &quot; Осветник &quot; были спроектированы и построены во Франции по конструкции подводных лодок класса &quot; Цирсе &quot; , которые были несколько меньше, чем предшествовавшие подводные лодки класса &quot; Градри &quot; ."
 YUG_destroyer_1: "Класс Дубровника"
 YUG_destroyer_1_desc: "Эсминец в Дубровнике был самым крупным кораблем в югославском флоте на момент его покупки. Корабль был построен в Великобритании и доставлен в Югославию в 1932 году. Это был крупный эсминец, заменяющий 1880 тонн. Он был вооружен четырьмя 140-мм/53 пушками в Скоде, мощным комплектом АА, шестью 533-мм торпедными трубами и хорошим оборудованием АСО."
 YUG_destroyer_2: "Класс Beograd"
 YUG_destroyer_2_desc: "Класс Београд состоял из трех эсминцев, которые были построены с французской помощью. Два корабля были построены в Сплите, а третий — во Франции. Все три корабля были основаны на французских эсминцах класса L'Adroit в 1939 году. Они переместили 1 210 тонн и были вооружены четырьмя 120-мм ружьями Skoda и шестью 533-мм торпедными трубами."
 YUG_destroyer_4: "Разделенный класс"
 YUG_destroyer_4_desc: "Сплит — это тяжелый эсминец, запущенный и завершенный в Югославии, который был запущен в 1943 году, но не завершен до 1958 года с модифицированным дизайном. Его оригинальный проект сместил 2400 тонн и был вооружен пятью 140/56 пушками &lt; &lt; Скода &gt; &gt; в своем основном оружии."
 YUG_light_cruiser_1: "Класс Dalmacija"
 YUG_light_cruiser_1_desc: "Старый немецкий крейсер SMS Niobe был продан в 1925 году молодым королевским военно-морским силам Югославии и сильно перестроен."
 ### SPM - MONARCHIST SPAIN ###
 SPM_submarine_1: "B Класс."
 SPM_submarine_1_desc: "В 1922-1925 годах шесть судов этого класса были сданы в эксплуатацию в качестве однокорпусных судов, поэтому их надежность была субпарной, они были средними подводных лодками, заменяющими более 550 тонн, были вооружены четырьмя 450-мм торпедными трубами."
 #SPM_submarine_1b: "C Класс."
 SPM_submarine_2: "Класс общего обслуживания &lt; &lt; Мола &gt; &gt;"
 SPM_submarine_2_desc: "Класс генерала Молы был классом из четырех итальянских подводных лодок класса Archimedes, заказанных в 1934 году и переданных националистам в 1937 году, которые были достаточно большими, заменяя 880 тонн, но быстрее, чем большинство подлодок. Они были вооружены восемью 533-мм торпедными трубами и имели глубину ныряния 90 метров."
 SPM_submarine_3: "G Класс"
 SPM_submarine_3_desc: "Испанские подводные лодки класса G представляли собой пару немецких подводных лодок класса VIIC, построенных на основе лицензии, выданной компанией &quot; Националист Испания &quot; . Однако только одна из этих подводных лодок когда-либо была построена и переведена в Испанские военно-морские силы только в 1947 году. Подводные лодки переместили 770 тонн и были вооружены пятью 533-мм торпедными трубами."
 SPM_submarine_4: "D Класс."
 SPM_submarine_4_desc: "Все три подводные лодки испанского класса D были запущены в 1944 году и сданы в эксплуатацию в разное время после войны. Все три подводные лодки были спроектированы и построены в Испании."
 SPM_destroyer_1: "Класс Alsedo"
 SPM_destroyer_1_desc: "Три эсминцев класса Альседо были построены для Испанского ВМС в Испании на основе британского дизайна L-класса и были заказаны в период с 1924 по 1925 год, они переместились более чем в 1040 тонн и имели три 102-мм пушки Виккерса Mk LA в качестве основного вооружения, а также четыре 450-мм торпедные трубки. Они также имели достойную скорость и дальность для своего винтажного оружия."
 SPM_destroyer_2: "Класс чуррук"
 SPM_destroyer_2_desc: "С 1925 по 1933 год было выпущено 16 эсминцев, два из которых были позже проданы Аргентине. Корабли были спроектированы на основе британских эсминцев класса S и составляют основу испанского военно-морского флота во время Гражданской войны. Они переместились более чем на 1500 тонн и были вооружены пятью 120-мм 45-м пушками Викерс-Армстронг в их основных вооружениях, а также шесть 533-мм торпедных труб, у которых была хорошая скорость и отличная дальность."
 SPM_destroyer_4: "Класс Алавы"
 SPM_destroyer_4_desc: "Эсминцы класса «Алава» были запущены в послевоенный период в качестве усовершенствованных до предыдущего класса «Альмиранте Антекера» (который был подклассом предыдущего класса «Чурука»). Они переместили 1 710 тонн и имели четыре 120-мм 45 Викерс-Армстронг Мк Ф в качестве главного ружья. Их скорость и диапазон были сопоставимы с предыдущими конструкциями, на которых был построен этот класс."
 SPM_light_cruiser_1: "Класс &lt; &lt; Мендес Нуньес &gt; &gt;"
 SPM_light_cruiser_1_desc: "Легкие крейсеры класса Мендес Нуньес были парой крейсеров, построенных в Испании для Испанского ВМС в начале 1920-х годов. Корабли были заказаны в 1915 году, но нехватка материалов во время Первой мировой войны задержала строительство. На проект оказали сильное влияние британские крейсеры класса С. Крейсеры переместили около 4800 тонн, но были относительно медленными. В основном их вооружение состояло из 6 152-ммм пушек Vikers Mk V. Кроме того, они имели хорошие доспехи и дюжину 533-мм торпедных труб."
 #SPM_light_cruiser_1b: "Класс приинципа Альфонсо"
 SPM_heavy_cruiser_1: "Класс &lt; &lt; Принцесса-де-Астуриас &gt; &gt;"
 SPM_heavy_cruiser_1_desc: "Класс Принцессы-де-Астуриас состоял из трех бронированных крейсеров, которые были построены для испанского флота около конца века, все три были либо сломаны, либо разрушены к середине 1930-х годов, они были вооружены близнецами 240-мм Гильен М1896 и восемью 140-мм 33 ружьями Шнайдер-Канета, они были сильно бронированы, но также несколько медленны по сравнению со стандартным тяжелым крейсером."
 SPM_heavy_cruiser_2: "Класс канариата"
 SPM_heavy_cruiser_2_desc: "Два тяжелых крейсера класса Канариас были построены по спецификациям Вашингтонского военно-морского траектории, которые были запущены в начале 1930-х годов, но не завершены до 1936 года, они переместились почти на 10 700 тонн и имели хорошую скорость. Они были относительно легко бронированы, но забавлены восемью 203-мм пушками &lt; &lt; Виккерс-Армстронг &gt; &gt; Mk D в качестве основного оружия."
 SPM_battleship_1: "Класс Испании"
 SPM_battleship_1_desc: "Класс Espania изначально был классом из трех страшных боевых кораблей, которые были сданы в эксплуатацию во время Первой мировой войны, хотя один из них был разрушен во время Гражданской войны в Испании. Два других были потеряны во время войны. Они были довольно маленькими для боевого корабля, сместив чуть более 15 400 тонн. Однако у них были достойные доспехи и порядочная скорость, и у них была основная батарея из 8 305-ммм пушек виккерса H."
 ### SPF - NATIONALIST SPAIN ###
 SPF_submarine_1: "B Класс."
 SPF_submarine_1_desc: "В 1922-1925 годах шесть судов этого класса были сданы в эксплуатацию в качестве однокорпусных судов, поэтому их надежность была субпарной, они были средними подводных лодками, заменяющими более 550 тонн, были вооружены четырьмя 450-мм торпедными трубами."
 #SPF_submarine_1b: "C Класс."
 SPF_submarine_2: "Класс общего обслуживания &lt; &lt; Мола &gt; &gt;"
 SPF_submarine_2_desc: "Класс генерала Молы был классом из четырех итальянских подводных лодок класса Archimedes, заказанных в 1934 году и переданных националистам в 1937 году, которые были достаточно большими, заменяя 880 тонн, но быстрее, чем большинство подлодок. Они были вооружены восемью 533-мм торпедными трубами и имели глубину ныряния 90 метров."
 SPF_submarine_3: "G Класс"
 SPF_submarine_3_desc: "Испанские подводные лодки класса G представляли собой пару немецких подводных лодок класса VIIC, построенных на основе лицензии, выданной компанией &quot; Националист Испания &quot; . Однако только одна из этих подводных лодок когда-либо была построена и переведена в Испанские военно-морские силы только в 1947 году. Подводные лодки переместили 770 тонн и были вооружены пятью 533-мм торпедными трубами."
 SPF_submarine_4: "D Класс."
 SPF_submarine_4_desc: "Все три подводные лодки испанского класса D были запущены в 1944 году и сданы в эксплуатацию в разное время после войны. Все три подводные лодки были спроектированы и построены в Испании."
 SPF_destroyer_1: "Класс Alsedo"
 SPF_destroyer_1_desc: "Три эсминцев класса Альседо были построены для Испанского ВМС в Испании на основе британского дизайна L-класса и были заказаны в период с 1924 по 1925 год, они переместились более чем в 1040 тонн и имели три 102-мм пушки Виккерса Mk LA в качестве основного вооружения, а также четыре 450-мм торпедные трубки. Они также имели достойную скорость и дальность для своего винтажного оружия."
 SPF_destroyer_2: "Класс чуррук"
 SPF_destroyer_2_desc: "С 1925 по 1933 год было выпущено 16 эсминцев, два из которых были позже проданы Аргентине. Корабли были спроектированы на основе британских эсминцев класса S и составляют основу испанского военно-морского флота во время Гражданской войны. Они переместились более чем на 1500 тонн и были вооружены пятью 120-мм 45-м пушками Викерс-Армстронг в их основных вооружениях, а также шесть 533-мм торпедных труб, у которых была хорошая скорость и отличная дальность."
 SPF_destroyer_4: "Класс Алавы"
 SPF_destroyer_4_desc: "Эсминцы класса «Алава» были запущены в послевоенный период в качестве усовершенствованных до предыдущего класса «Альмиранте Антекера» (который был подклассом предыдущего класса «Чурука»). Они переместили 1 710 тонн и имели четыре 120-мм 45 Викерс-Армстронг Мк Ф в качестве главного ружья. Их скорость и диапазон были сопоставимы с предыдущими конструкциями, на которых был построен этот класс."
 SPF_light_cruiser_1: "Класс &lt; &lt; Мендес Нуньес &gt; &gt;"
 SPF_light_cruiser_1_desc: "Легкие крейсеры класса Мендес Нуньес были парой крейсеров, построенных в Испании для Испанского ВМС в начале 1920-х годов. Корабли были заказаны в 1915 году, но нехватка материалов во время Первой мировой войны задержала строительство. На проект оказали сильное влияние британские крейсеры класса С. Крейсеры переместили около 4800 тонн, но были относительно медленными. В основном их вооружение состояло из 6 152-ммм пушек Vikers Mk V. Кроме того, они имели хорошие доспехи и дюжину 533-мм торпедных труб."
 #SPF_light_cruiser_1b: "Класс приинципа Альфонсо"
 SPF_heavy_cruiser_1: "Класс &lt; &lt; Принцесса-де-Астуриас &gt; &gt;"
 SPF_heavy_cruiser_1_desc: "Класс Принцессы-де-Астуриас состоял из трех бронированных крейсеров, которые были построены для испанского флота около конца века, все три были либо сломаны, либо разрушены к середине 1930-х годов, они были вооружены близнецами 240-мм Гильен М1896 и восемью 140-мм 33 ружьями Шнайдер-Канета, они были сильно бронированы, но также несколько медленны по сравнению со стандартным тяжелым крейсером."
 SPF_heavy_cruiser_2: "Класс канариата"
 SPF_heavy_cruiser_2_desc: "Два тяжелых крейсера класса Канариас были построены по спецификациям Вашингтонского военно-морского траектории, которые были запущены в начале 1930-х годов, но не завершены до 1936 года, они переместились почти на 10 700 тонн и имели хорошую скорость. Они были относительно легко бронированы, но забавлены восемью 203-мм пушками &lt; &lt; Виккерс-Армстронг &gt; &gt; Mk D в качестве основного оружия."
 SPF_battleship_1: "Класс Испании"
 SPF_battleship_1_desc: "Класс Espania изначально был классом из трех страшных боевых кораблей, которые были сданы в эксплуатацию во время Первой мировой войны, хотя один из них был разрушен во время Гражданской войны в Испании. Два других были потеряны во время войны. Они были довольно маленькими для боевого корабля, сместив чуть более 15 400 тонн. Однако у них были достойные доспехи и порядочная скорость, и у них была основная батарея из 8 305-ммм пушек виккерса H."
