l_russian:
 naval_equipment: "Корабли"
 submarine_1: "Подводная лодка I"
 submarine_2: "Подводная лодка II"
 submarine_3: "Подводная лодка III"
 submarine_4: "Подводная лодка IV"
 submarine_1_desc: "Подводные лодки — это тайные суда, предназначенные для того, чтобы вывести незащищенные конвои."
 submarine_2_desc: "Более вооруженные и более стабильные, новые подводные лодки разрабатываются для того, чтобы воспользоваться достижениями в военно-морской тактике и иметь более высокую дальность, с тем чтобы напасть на маршруты дальних конвоев."
 submarine_3_desc: "Вопрос о роли подводной лодки в флоте, не являющемся объектом нападений со стороны автоколонн, все еще обсуждается."
 submarine_4_desc: "Углубление глубины испытаний и повышение эффективности планировки будут относиться к современным подводным лодкам, используя опыт полевых работ для отбора соответствующих вооружений и двигателей."
 ship_hull_submarine_1_desc: "Подводные лодки — это тайные суда, предназначенные для того, чтобы вывести незащищенные конвои."
 ship_hull_submarine_2_desc: "Более вооруженные и более стабильные, новые подводные лодки разрабатываются для того, чтобы воспользоваться достижениями в военно-морской тактике и иметь более высокую дальность, с тем чтобы напасть на маршруты дальних конвоев."
 ship_hull_submarine_3_desc: "Вопрос о роли подводной лодки в флоте, не являющемся объектом нападений со стороны автоколонн, все еще обсуждается."
 ship_hull_submarine_4_desc: "Углубление глубины испытаний и повышение эффективности планировки будут относиться к современным подводным лодкам, используя опыт полевых работ для отбора соответствующих вооружений и двигателей."
 destroyer_1: "Уничтожить I"
 destroyer_2: "Уничтожение II"
 destroyer_3: "Уничтожение III"
 destroyer_4: "Уничтожение IV"
 destroyer_1_desc: "Для обеспечения безопасности автоколонн необходимо переоснащать и развивать эсминцы Великой войны."
 destroyer_2_desc: "Более длинный торпедный дальность и более быстрая перезагрузка, наряду с новыми типами вооружений, такими, как противовоздушные турниры, позволят нашим эсминцам оставаться эффективными и разносторонними."
 destroyer_3_desc: "Для того чтобы более эффективно противостоять угрозам сверху и снизу, новые эсминцы должны быть оснащены радарами и современным противовоздушным и противоподводным оружием."
 destroyer_4_desc: "Современный эсминец должен быть оснащен самыми различными технологиями обнаружения, новыми системами развертывания глубинного заряда и должен быть построен в более широких масштабах, чем их предшественники."
 ship_hull_light_1_desc: "Для обеспечения безопасности автоколонн необходимо переоснащать и развивать эсминцы Великой войны."
 ship_hull_light_2_desc: "Более длинный торпедный дальность и более быстрая перезагрузка, наряду с новыми типами вооружений, такими, как противовоздушные турниры, позволят нашим эсминцам оставаться эффективными и разносторонними."
 ship_hull_light_3_desc: "Для того чтобы более эффективно противостоять угрозам сверху и снизу, новые эсминцы должны быть оснащены радарами и современным противовоздушным и противоподводным оружием."
 ship_hull_light_4_desc: "Современный эсминец должен быть оснащен самыми различными технологиями обнаружения, новыми системами развертывания глубинного заряда и должен быть построен в более широких масштабах, чем их предшественники."
 light_cruiser_1: "Легкий крузер I"
 light_cruiser_2: "Легкий круизер II"
 light_cruiser_3: "Легкий круизер III"
 light_cruiser_4: "Легкий круизер IV"
 torpedo_cruiser: "Торпедо Крузер"
 torpedo_cruiser_desc: "Легкие крейсеры, оснащенные большим количеством торпедных труб, за счет меньшего количества главных батарей и меньшего количества зенитных орудий."
 JAP_torpedo_cruiser: "Класс Китаками"
 light_cruiser_1_desc: "Управляемые лёгкие крейсеры, способные поддерживать высокую скорость, будут по-прежнему использоваться для выполнения разведочных полетов."
 light_cruiser_2_desc: "Послевоенные договоры устанавливают ограничения на крейсеры, однако хорошо вооруженные легкие суда могут развиваться, оставаясь в этих пределах."
 light_cruiser_3_desc: "Теперь, невзирая на ограничения договоров, могут быть построены более крупные и более тяжелые бронированные крейсеры с достаточно легким оружием, которое можно было бы отнести к категории легких крейсеров."
 light_cruiser_4_desc: "Тактически используемые для защиты более крупных судов, современное поколение легких крейсеров может снять большинство прошлых ограничений и быть более вооруженным для совершения воздушных нападений."
 heavy_cruiser_1: "Тяжелый Крузер I"
 heavy_cruiser_2: "Тяжелый крузер II"
 heavy_cruiser_3: "Тяжелый крузер III"
 heavy_cruiser_4: "Тяжелый крузер IV"
 heavy_cruiser_1_desc: "Вашингтонский военно-морской договор был разработан для предотвращения гонки вооружений на крейсерах, среди прочего, но это представляется неизбежным."
 heavy_cruiser_2_desc: "Несмотря на новые усилия по заключению договоров, ремонт более легких крейсеров с более тяжелым вооружением остается эффективным, хотя доспехи по-прежнему ограничены."
 heavy_cruiser_3_desc: "По мере того, как во всем мире все чаще игнорируются ограничения, можно строить более сбалансированные конструкции тяжелых крейсеров с уделением более приоритетного внимания доспехам."
 heavy_cruiser_4_desc: "На этих заключительных этапах разработки тяжелых крейсеров присутствуют усовершенствованные, более длинные и более тяжелые конструкции с быстродействующим огневым вооружением."
 ship_hull_cruiser_1_desc: "Хотя крейсер связан положениями Вашингтонского военно-морского договора, он по-прежнему является самым гибким военным кораблем. Этот корпус позволяет построить легкий крейсер для обнаружения и разведки или тяжелый крейсер для поддержки боевой линии."
 ship_hull_cruiser_2_desc: "В следующем поколении крейсеров установлены новые схемы работы двигателей, которые повышают выживаемость, а также помещения для специализированных авиационных средств."
 ship_hull_cruiser_3_desc: "По мере того как крейсеры по всему миру становятся все более мощными и способными, необходимы новые и более крупные корпуса для хранения всего необходимого дополнительного оборудования."
 ship_hull_cruiser_4_desc: "Под влиянием военного опыта последнее поколение крейсеров имеет перестроенную надстройку, с тем чтобы обеспечить более широкие поля огня для противовоздушных вооружений, и новые внутренние конфигурации для поддержки использования радаров."
 battle_cruiser_1: "Битва-крузер I"
 battle_cruiser_2: "Боевой круиз II"
 battle_cruiser_3: "Боевой круизер III"
 battle_cruiser_4: "Боевой круиз IV"
 battle_cruiser_1_desc: "Послевоенная гонка боевых круизеров привела к нескольким хорошо вооруженным замыслам, принося в жертву броню за скорость по сравнению с боевыми кораблями."
 battle_cruiser_2_desc: "Реконструированные и реконструированные боевые круизеры продолжают убегать даже от современных катеров с помощью более легкой защиты, но разработали более совершенные системы пожарной безопасности, обнаружения и противовоздушной обороны."
 battleship_1: "Боевой корабль I"
 battleship_2: "Боевой корабль II"
 battleship_3: "Боевой корабль III"
 battleship_4: "Боевой корабль IV"
 battleship_5: "Боевой корабль V"
 battleship_6: "Боевой корабль VI"
 battleship_1_desc: "По мнению одних, это реликвия старой эпохи военно-морской войны, других, как самых впечатляющих кораблей, которые когда-либо были построены, никто не может отрицать, что эти остатки гонки вооружений на военном корабле представляют собой одни из самых хорошо вооруженных и бронированных кораблей, когда-либо сооружавшихся."
 battleship_2_desc: "С повышением стабильности и дальности полета новое поколение боевых кораблей улучшится по сравнению с предыдущими конструкциями, оставаясь при этом в пределах, установленных военно-морскими договорами."
 battleship_3_desc: "В мире, где во все большей степени в военно-морских войнах доминирует воздушная поддержка, боевые корабли могут оставаться актуальными, если они правильно используются, бронежилеты, более сильные двигатели, аккумуляторы пушек с высоким калибром и усовершенствованные противовоздушные средства."
 battleship_4_desc: "По мере того, как мир видит, что может быть последней крупной конфронтацией на корабле, значение тяжелых вооружений и противовоздушных турниров является как никогда важным."
 ship_hull_heavy_1_desc: "По мнению одних, это реликвия старой эпохи военно-морской войны, других, как самых впечатляющих кораблей, которые когда-либо были построены, никто не может отрицать, что эти остатки гонки вооружений на военном корабле представляют собой одни из самых хорошо вооруженных и бронированных кораблей, когда-либо сооружавшихся."
 ship_hull_heavy_2_desc: "С повышением стабильности и дальности полета новое поколение боевых кораблей улучшится по сравнению с предыдущими конструкциями, оставаясь при этом в пределах, установленных военно-морскими договорами."
 ship_hull_heavy_3_desc: "В мире, где во все большей степени в военно-морских войнах доминирует воздушная поддержка, боевые корабли могут оставаться актуальными, если они правильно используются, бронежилеты, более сильные двигатели, аккумуляторы пушек с высоким калибром и усовершенствованные противовоздушные средства."
 ship_hull_heavy_4_desc: "По мере того, как мир видит, что может быть последней крупной конфронтацией на корабле, значение тяжелых вооружений и противовоздушных турниров является как никогда важным."
 carrier_1: "Перевозчик I"
 carrier_2: "Перевозчик II"
 carrier_3: "Перевозчик III"
 carrier_4: "Перевозчик IV"
 carrier_5: "Перевозчик V"
 carrier_6: "Перевозчик VI"
 carrier_1_desc: "Многие военные теоретики считают, что военно-морская авиация — это будущее."
 carrier_2_desc: "По мере того как начинается работа над первым проектом кил-ап, мы должны обеспечить, чтобы эти корабли имели дальность и скорость, чтобы успевать за остальными нашими военно-морскими силами, соблюдая при этом послевоенные военно-морские договоры."
 carrier_3_desc: "Усовершенствованные методы строительства и более специализированные системы, такие, как лифты на кромках палубы, позволяют этим перевозчикам более эффективно перевозить больше самолетов."
 carrier_4_desc: "Сейчас, когда многие военно-морские договоры все чаще игнорируются, мы можем приступить к строительству перевозчиков, способных перевозить больше самолетов, чем когда бы то ни было, чтобы обеспечить воздушное превосходство."
 ship_hull_carrier_1_desc: "Многие военные теоретики считают, что военно-морская авиация — это будущее."
 ship_hull_carrier_2_desc: "По мере того как начинается работа над первым проектом кил-ап, мы должны обеспечить, чтобы эти корабли имели дальность и скорость, чтобы успевать за остальными нашими военно-морскими силами, соблюдая при этом послевоенные военно-морские договоры."
 ship_hull_carrier_3_desc: "Усовершенствованные методы строительства и более специализированные системы, такие, как лифты на кромках палубы, позволяют этим перевозчикам более эффективно перевозить больше самолетов."
 SH_battleship_1: "Сверхтяжелый боевой корабль I"
 SH_battleship_2: "Боевой корабль &lt; &lt; Сверхтяжело &gt; &gt; II"
 SH_battleship_1_desc: "Без этих ограничений мы можем полностью сосредоточиться на создании самых тяжелых, самых хорошо вооруженных боевых кораблей всех времен, способных напасть на несколько менее крупных судов."
 SH_battleship_2_desc: "Улучшить наш прежний супер тяжелый дизайн с более сильным оружием и усовершенствованными системами пожаротушения."
 ship_hull_super_heavy_1_desc: "Без этих ограничений мы можем полностью сосредоточиться на создании самых тяжелых, самых хорошо вооруженных боевых кораблей всех времен, способных напасть на несколько менее крупных судов."
 ship_hull_light_1:2 "Ранний разрушитель"
 ship_hull_light_2:2 "1936 год Уничтожение колыбельной"
 ship_hull_light_3:2 "1940 год Уничтожение колыбельной"
 ship_hull_light_4:2 "1944 год Уничтожить Халл"
 ship_hull_cruiser: "Крузер"
 ship_hull_cruiser_desc: "Рабочие лошади флота, крейсеры берут на себя много важных обязанностей: от поиска и проверки легких крейсеров до поддержки боевой линии для тяжелых крейсеров."
 ship_hull_cruiser_1:1 "Ранняя круизная палочка"
 ship_hull_cruiser_2:1 "1936 года Круазерная Шапка"
 ship_hull_cruiser_3:1 "1940 Круазерная кола"
 ship_hull_cruiser_4:1 "1944 года Круазер-Холл"
 ship_hull_heavy: "Тяжелый корабль"
 ship_hull_heavy_desc: "Конечный символ военно-морской мощи, эти огромные, крупногабаритные бегемоты по-прежнему пользуются уважением в открытом море, даже когда некоторые эксперты сомневаются в их роли в эпохе самолета и подводной лодки."
 ship_hull_heavy_1:1 "Раннее судно &lt; &lt; Тяжелое судно &gt; &gt;"
 ship_hull_heavy_2:1 "1936 Грузовой корпус"
 ship_hull_heavy_3:1 "1940 Грузовая колодка"
 ship_hull_heavy_4:1 "1944 года Тяжелое судно"
 ship_hull_carrier: "Перевозчик"
 ship_hull_carrier_desc: "После многих лет экспериментов авианосец постепенно превратился в свой собственный класс судна, способный поддерживать все большее число все более мощных самолетов, авианосец готов стать последним словом в военно-морской проекции."
 ship_hull_carrier_0:1 "Ранний перевозчик &lt; &lt; Халл &gt; &gt;"
 ship_hull_carrier_conversion_bb:1 "Преобразованный боевой корабль &lt; &lt; Халл &gt; &gt;"
 ship_hull_carrier_conversion_ca:1 "Переоборудованная круизная кола"
 ship_hull_carrier_1:1 "1936 года Карьерная колодка"
 ship_hull_carrier_2:1 "1940 года Карьерная колодка"
 ship_hull_carrier_3:1 "1944 года Карьерная колодка"
 ship_hull_submarine: "Подводные лодки"
 ship_hull_submarine_desc: "Вдали от грубейших лодок Великой войны, современная подводная лодка как никогда способна угрожать даже самому большому судну за очень умеренную цену."
 ship_hull_submarine_1:1 "Ранняя подводная колодка"
 ship_hull_submarine_2:1 "1936 Подводные лодки"
 ship_hull_submarine_3:1 "1940 Подводные лодки"
 ship_hull_submarine_4:1 "1944 Подводные лодки"
 ship_hull_pre_dreadnought: "Предупреждённый колокольчик"
 ship_hull_pre_dreadnought_desc: "Выживший за время, прошедшее до того, как началась страшная раса, которая привела к Великой войне, "До-Дреднгоуд" имеет лишь очень ограниченную боевую ценность в наши дни и в наши годы."
 ship_hull_cruiser_panzerschiff: "Панцершиф"
 ship_hull_cruiser_panzerschiff_desc: "Пытаясь сделать невозможное, немецкие инженеры смогли связать почти боевое вооружение с корпусом крейсера, в результате чего корабль обгоняет любой другой известный крейсер, но он также дорогой, сравнительно медленный и относительно плохо бронированный."
 ship_hull_cruiser_coastal_defense_ship:1 "Корабль береговой обороны"
 ship_hull_torpedo_cruiser: "Торпедо Крузер"
 ship_hull_super_heavy_1: "Сверхтяжелый боевой корабль &lt; &lt; Халл &gt; &gt;"
 ship_hull_cruiser_submarine: "Подводные лодки"
 ### ENG - ENGLAND ###
 ENG_submarine_1: "L Класс"
 ENG_submarine_1_desc: "Класс L был среднегабаритными лодками, первоначально запланированными в рамках программы чрезвычайных военных действий в качестве усовершенствованной версии предыдущих классов подводных лодок. Они были построены на поздних этапах Первой мировой войны и оснащены новыми, более крупными 21 торпедами. Они служили до начала Второй мировой войны, когда они в основном использовались для выполнения вспомогательных и учебных обязанностей."
 #ENG_submarine_1b: "Класс O/P/R"
 #ENG_submarine_1c: "S Класс"
 ENG_submarine_2: "Класс"
 ENG_submarine_2_desc: "Корабли класса &quot; То-класс &quot; или &quot; Тритон &quot; были предназначены для замены крупных подводных лодок класса &quot; О &quot; , &quot; Р &quot; и &quot; Р &quot; . Они представляли собой умеренно крупные подводные лодки с большим радиусом действия, хорошо приспособленные для Атлантического и Тихого океанов. Эти лодки были хорошо вооружены, стабильными платформами и широко использовались во время конфликта, поскольку 25 процентов построенных лодок были потеряны во время войны."
 ENG_submarine_3: "U Класс"
 ENG_submarine_3_desc: "Класс U был небольшими подводных лодками, построенными в рамках чрезвычайных военных программ 1940 и 1941 годов. Изначально спроектированными как тренировочные подводные лодки по мере начала войны, проект был изменен, что позволило этим подводным лодкам оказаться полезными в замкнутых водах Северного моря и Средиземноморья. Из-за их меньшего размера их дальность и оружие были ограничены. Три подкласса составляли класс: Undine, Umpire и Uproar."
 #ENG_submarine_3b: "Класс серафа"
 ENG_submarine_4: "V Класс"
 ENG_submarine_4_desc: "Подводные лодки класса V или вампирского класса основывались на предыдущих малогабаритных лодках класса U. Они были более крупными, но все же относительно небольшими, с более высокой пропускной способностью на море, но с ограниченной оперативной дальностью и оружием."
 #ENG_submarine_4b: "Класс"
 ENG_destroyer_1: "V/W Класс"
 ENG_destroyer_1_desc: "Эти эсминцы включали в себя адмирализацию и классы Tornycroft V и W. Они были построены в рамках программы чрезвычайных военных действий. Они были конечной эволюцией британского эсминца во время Первой мировой войны, воплощавшей в себе усовершенствования их предшественников, а также новые технологические достижения. Большое число этих кораблей было построено на поздних этапах WWI и впоследствии стало краеугольным камнем эсминных флотов Королевского флота. Начиная с 1930-х годов они были размещены в резервных флотах, которые в конечном итоге использовались для сопровождения конвоя. Они были достаточно вооружены, быстрые суда с хорошим радиусом действия."
 #ENG_destroyer_1b: "Класс A/B/C/D"
 ENG_destroyer_2: "Класс G/H/I"
 ENG_destroyer_2_desc: "Разрушители классов G, H и I были заказаны в рамках военно-морских строительных программ 1933 и 1934 годов. Они, как правило, повторялись в предыдущем классе F, с небольшим сокращением размера. Боеприпасы в классах G и H являются теми же, что и в классе F, причем оба они использовали 4,7 в. пушки. Эти суда имели дальний радиус действия, были достаточно вооружены и имели сильный торпедный компонент. Они широко использовались во время войны и понесли многочисленные потери."
 #ENG_destroyer_2b: "Класс племен"
 ENG_destroyer_3: "Класс J/K/N"
 ENG_destroyer_3_desc: "Классы J, K и N были аналогичны предыдущим классам племени, но вместо того, чтобы делать упор на оружие, дизайнеры вернулись к более стандартной тяжелой торпеде и более легкой ружейной установке. Корабли были модифицированы на протяжении всей их военной службы. Модернизация включала усовершенствование зенитных орудий и радаров. Они были быстрыми, дальними и хорошо вооруженными судами, идеальными для сопровождения флота."
 ENG_destroyer_4: "Боевой класс"
 ENG_destroyer_4_desc: "Разрушители боевого класса были построены на эволюции британских эсминцев, использовавшихся во время войны. Корабли были заказаны в рамках военно-морских программ 1942 и 1943 годов. Они были хорошо вооружены как с точки зрения оружия, так и с точки зрения их торпед."
 #ENG_destroyer_4b: "Класс оружия"
 ENG_light_cruiser_1: "Класс изумрудов"
 ENG_light_cruiser_1_desc:1 "Будучи идеальным судном, которое будет использоваться в межвоенные годы для поддержания контроля за торговлей по всей Империи, в начале 1920-х годов будут построены и развернуты дополнительные суда изумрудного класса."
 #ENG_light_cruiser_1b: "Класс изумрудов"
 #ENG_light_cruiser_1c: "Класс"
 ENG_light_cruiser_2: "Класс Саутгемптона"
 ENG_light_cruiser_2_desc: "Легкие крейсеры класса Саутгемптон были подклассом крейсеров городского класса и предназначались для борьбы с японскими крейсерами класса Могами. Эти суда были хорошо бронированы, имели хорошую скорость и дальность движения и несли огромные вооружения в количестве 12 6 единиц."
 #ENG_light_cruiser_2b: "Класс Эдинбурга"
 ENG_light_cruiser_3: "Класс королевской колонии"
 ENG_light_cruiser_3_desc: "Легкие крейсеры класса "Корона Колония" были улучшены версий предыдущего городского класса, но с упрощенным дизайном для ускорения строительства и снижения издержек. Королевы несли те же пушки, что и их предшественники, четыре тройные турниры, в которых было 6."
 #ENG_light_cruiser_3b: "Класс Дидо"
 ENG_light_cruiser_4: "Класс минотавров"
 ENG_light_cruiser_4_desc: "Эти крейсеры были спроектированы как модифицированная версия класса королевской колонии, включая изменения в войне, которые были разрешены в 1941 году. Они имели более высокую боевую дальность и более большое количество оружия АА, чем класс королевской колонии, в то время как основное вооружение было сокращено до трех тройных турниров. Построено слишком поздно, чтобы повлиять на исход войны, большинство заказанных судов было впоследствии отменено."
 ENG_heavy_cruiser_1: "Класс графства"
 ENG_heavy_cruiser_1_desc: "Некоторые из первых крейсеров после Великой войны, установленных для Королевского военно-морского флота, окружной класс имеет хорошую огневую мощь, дальность движения и скорость, необходимую для защиты колониальных торговых путей."
 #ENG_heavy_cruiser_1b: "Класс графства"
 ENG_heavy_cruiser_2: "Суррейский класс"
 ENG_heavy_cruiser_2_desc: "В рамках морской программы 1928 года были предложены тяжелые крейсеры класса &quot; Суррей &quot; , улучшенные версии более ранних крейсеров Йоркского класса. Если бы они были завершены, у них было бы четыре близнеца 8, ружейные башены, более тяжелые бронежилеты и более мощные двигатели. Два корабля были заказаны, но ни один из них не был сложен."
 ENG_heavy_cruiser_3: "Адмирал Класс"
 ENG_heavy_cruiser_3_desc: "Тяжелые крейсеры адмирального класса (не следует путать с боевыми круизами адмирального класса) были последней попыткой Королевского ВМС спроектировать и построить крейсеры с 8 пушками. Проектирование началось в 1938 году и завершилось в 1941 году, в результате чего были выдвинуты различные предложения."
 ENG_heavy_cruiser_4: "Черчилль Дизайн"
 ENG_heavy_cruiser_4_desc: "Эти корабли были предложены сэром Уинстоном Черчиллем, лордом Адмиралии, на ранних этапах Второй мировой войны, чтобы противодействовать крупным крейсерам немецкого класса Duutschland. Эти суда имели 9,2 пушек, тяжелые АА и мощные бронежилеты. Они были предназначены для эффективной борьбы с неприятельскими столицами. Корабли в конечном итоге были отменены из-за высоких расходов и отсутствия спроса на новый тяжелый крейсер."
 ENG_battle_cruiser_1: "Адмирал Класс"
 ENG_battle_cruiser_1_desc: "Разработанный к концу Великой войны, адмирал-класс во многих отношениях был улучшенным классом королевы Елизаветы, но был переработан после вмешательства адмирала Великого флота сэра Джона Желлико."
 #ENG_battle_cruiser_1b: "G3 Класс"
 ENG_battle_cruiser_2: "Королевский класс принцессы"
 ENG_battle_cruiser_2_desc: ""Принцесса Роял" - это класс гипотетических боевых круизеров, которые были более быстрой и дешевой версией боевых кораблей класса "Кинг Джордж V". Эти суда имели аналогичное, но сокращенное вооружение как для наземных, так и для противовоздушных боёв: две тройные пушки и шесть близнецов 5,25 в. Пушки АА. Их быстрая скорость и дальность позволили бы Королевским ВМС быстро нанести удар и защитить конвой, но их ограниченные доспехи были бы проблематичны, если бы им пришлось бороться с современными боевыми кораблями."
 ENG_battleship_1:1 "Класс королевы Елизаветы"
 ENG_battleship_1_desc:1 "Спланированная и заложенная в первые годы Великой войны, Кларк королевы Елизаветы был классом из пяти супер-драйвенов и был намного выше по дизайну, вооружению и бронежилету их предшественника Железного Дюка. Первые боевые корабли, которые были вооружены 15 дюймовыми пушками, по мнению многих в конце Великой войны, были «самым успешным типом до сих пор проектируемого капитального корабля»."
 #ENG_battleship_1b: "Класс Нельсона"
 ENG_battleship_2: "Класс короля Георга V"
 ENG_battleship_2_desc: "В 1922 и 1930 годах были заключены первые договоры о военно-морском флоте, которые ограничивали максимальное перемещение и стрельбу столиц. Таким образом, эти корабли были оснащены меньшекалиберными пушками, чем ранее, и даже современными боевыми кораблями. Несмотря на меньший калибр, корабли были достаточно вооружены, несли сильное оружие АА и имели надлежащую защиту. Пять кораблей были заказаны и заложены в качестве замены старым кораблям класса королевы Елизаветы."
 ENG_battleship_3: "Класс льва"
 ENG_battleship_3_desc: "Боевые корабли класса "Львов" были последующим классом к королю Георгу V с множеством их особенностей. Шесть кораблей были заказаны в военно-морской программе 1938 года, чтобы заменить стареющие боевые корабли класса "Мстить", но ни один из них не был закончен из-за вспыхнувших боевых действий. Эти корабли были бы общими, как и к королю Джорджу, но основные вооружения были бы тяжелее, введя новые 16 в. пушки. У них также были бы более толстые доспехи и более мощные двигатели."
 ENG_battleship_4: "Класс авангарда"
 ENG_battleship_4_desc: "Боевой корабль класса &quot; Вангард &quot; был последним кораблем, который был построен для Королевского флота. &quot; Было заказано &quot; , но еще четыре корабля были рассмотрены для тихоокеанского театра. &quot; В соответствии с программой чрезвычайных военных действий 1940 года &quot; строительство не приобрело приоритетного значения и было завершено после войны. &quot; Класс &quot; имел стеклянный корпус, который обеспечивал прекрасную стабильность и мореходность. &quot; Оружие &quot; аналогично &quot; , &quot; Королева Елизавета &quot; и &quot; Ревендж &quot; , что обеспечивает значительную огневую мощь. &quot; Сильные двигатели и хорошие доспехи &quot; сделали судно быстрым и хорошо защищенным &quot; ."
 ENG_SH_battleship_1: "Трафальгарный класс"
 ENG_SH_battleship_1_desc: ""Трафальгарский класс" был разработан и построен как новый флагман Королевского ВМС. "Трафальгар" - это крупнейшее судно, которое бродит по Семи морям. "Трафальгар" с помощью современного противовоздушного оружия и слухов о том, что его можно оснащать прототипом оборудования для обнаружения радиоприемников, способен за короткое время уничтожить любое судно аналогичного класса."
 ENG_SH_battleship_2: "Класс Виктории"
 ENG_SH_battleship_2_desc: "С учетом уроков, извлеченных из военно-морских разработок во всем мире, класс Виктории является самым крупным из когда-либо спланированных и сооруженных боевых кораблей, которые до сих пор не могли быть использованы 20 дюймовыми пушками, огневой мощи класса Виктория более чем достаточно для уничтожения любых наземных кораблей, используемых в настоящее время во всем мире."
 ENG_carrier_1: "Мужественный класс"
 ENG_carrier_1_desc: "Эти три авианосца были переоборудованы в боевые круизеры и были первыми авианосцами Королевского военно-морского флота, которые были преобразованы в результате заключения Вашингтонского военно-морского договора 1922 года и завершения работ в 1925 году."
 ENG_carrier_2: "Ковчег Королевского класса"
 ENG_carrier_2_desc: "В 1934 году судно было хорошо бронетранспортировано и вооружено, на борту которого находилось большое количество самолетов и которое располагало достаточным эксплуатационным диапазоном и скоростью для того, чтобы успевать за основными силами Королевского военно-морского флота."
 ENG_carrier_3: "Яркий класс"
 ENG_carrier_3_desc: "Иллюстрированный класс был разработан в соответствии с ограничениями второго Лондонского договора о военно-морском флоте 1936 года, который ограничил размер перевозчика верхним пределом в 23 000 тонн. Она была первой британской авиакомпанией, которая имела бронированную полетную палубу, которая сократила размер авиагруппы. Тяжелые бронежилеты и вооружения АА обеспечили прочную защиту для судов, в то время как мощные двигатели и большой топливный склад дали судам большой оперативный радиус."
 ENG_carrier_4: "Неукрепляемый класс"
 ENG_carrier_4_desc: "Самолеты закрытого класса были заказаны в соответствии с Морской программой 1938 года и были в основном улучшены версий предыдущего класса Illustruction. &quot; Война &quot; и перенос приоритета на более мелкие суда для обеспечения защиты автоколонн на ранних и средних этапах войны замедлили ограничение этих судов; они были более крупными судами, способными перевозить больше самолетов при сохранении толстой брони как на корпусе, так и на палубе полета. &quot; Более мощные &quot; двигатели обеспечили им более высокую скорость и оперативный диапазон по сравнению с классом Illustrective &quot; ."
 #ENG_carrier_4b: "Мальтийский класс"
 ### FRA - FRANCE ###
 FRA_submarine_1: "серии 600"
 FRA_submarine_1_desc: "Подводные лодки мощностью 600 тонн были первыми во Франции современными подводными лодками WWI, которые были среднего размера, заменяли около 600 тонн. Хотя они были морскими, они были отнесены к прибрежным подводным лодкам и использовались главным образом в теплых водах Средиземного моря. Три класса из четырех кораблей, каждый из которых был построен такого типа: классы Сирена, Ариана и Цирсе. Они были основой для более крупных 630 тонн серии Argonaute, Diaane и Orion классов."
 #FRA_submarine_1b: "Серия 630"
 #FRA_submarine_1c: "Разрядный класс"
 FRA_submarine_2: "Класс минерва"
 FRA_submarine_2_desc: "Подводные лодки класса Minerve (название проекта T2) были основаны на 630-тонных сериях, хотя у них были более совершенные двигатели и различные торпеды. Эти подводные лодки были первой частью программы стандартизации, результатом которой стало централизованное проектирование DCAN (Direction des Constructions et Armes Baile), а не конкретные проекты судоверфи предыдущих классов."
 #FRA_submarine_2b: "Класс аурора"
 FRA_submarine_3: "Класс Роланда Морильота"
 FRA_submarine_3_desc: "Подводные лодки класса Роланд Морильот (проект Z2) представляли собой крупные морские подводные лодки на основе ранее существовавших подводных лодок класса Redubable."
 FRA_submarine_4: "Класс феникса"
 FRA_submarine_4_desc: "Подводные лодки класса Феникс были среднегабаритными океанскими лодками и лодками дальнего радиуса действия, разрешенными в рамках военно-морских программ 1939-40 годов, однако начало войны и падение Франции привели к отмене этих лодок."
 FRA_destroyer_1: "Курсский класс"
 FRA_destroyer_1_desc: "Разрушители класса Бурресковы были частью серии 1 500 тонн и запущены в середине 1920-х годов. Вместе с предыдущим Чакалем и после уроков L'Adroit они были основой нового современного французского флота после войны. Они были быстро и хорошо вооружены в свое время, но их торпедное вооружение меньше по сравнению с аналогичными судами в других морских флотах."
 #FRA_destroyer_1b: "Класс шакалов"
 #FRA_destroyer_1c: "Класс Aigle & Vauquelin"
 FRA_destroyer_2: "Класс &lt; &lt; Фантаск &gt; &gt;"
 FRA_destroyer_2_desc: "Эсминцы класса «Ле Фантаск» были по существу улучшенными версиями более ранних суперразрушителей 2400 тонн серии (Gepard, Aigle, Vauquelin), построенных в рамках военно-морской программы 1930 года."
 #FRA_destroyer_2b: "Класс Le Hardi"
 #FRA_destroyer_2c: "Класс могадоров"
 FRA_destroyer_3: "Класс L'Intrepid"
 FRA_destroyer_3_desc: "Эсминцы класса L'Intrepid снабдили модифицированную версию предыдущих эсминцев класса Le Hardi, которые были санкционированы в 1938 и 1939 годах военно-морскими программами, но война и падение Франции привели к отмене этих кораблей, они были бы в большей степени сосредоточены на зенитной роли и увеличили бы перенос до 2 800-2 900 тонн двигателей."
 FRA_destroyer_4: "Класс &lt; &lt; хаша &gt; &gt;"
 FRA_destroyer_4_desc: "Классы Hoche и Bayard были последним супер-разрушителем французских ВМС. Оба класса были основаны на классе Могадора, заменяя 4200 тонн аналогичным основным вооружением, но усовершенствовав AA пушки и более сильные двигатели. Они были санкционированы военно-морскими программами 1939-40 года, но начало войны и падение Франции привели к отмене этих кораблей."
 FRA_light_cruiser_1: "Класс &lt; &lt; Дугуа-Труин &gt; &gt;"
 FRA_light_cruiser_1_desc: "Легкие крейсеры Дугуай-Труэн были первыми французскими военными кораблями, которые были построены после Первой мировой войны в 1922 году. Они стали первыми крейсерами с суперзащитой основных турниров. Среди легких крейсеров у них было сильное торпедное вооружение, но практически не было доспехов."
 FRA_light_cruiser_2: "Класс &lt; &lt; Галиссоньер &gt; &gt;"
 FRA_light_cruiser_2_desc: "Легкие крейсеры класса &lt; &lt; Ла Галиссонньер &gt; &gt; были ответом на итальянские лёгкие крейсеры типа &lt; &lt; Кондотири &gt; &gt; и основывались на предыдущем классе &lt; &lt; Эмиль Бертин &gt; &gt; , которые были построены в 1931 и 1932 годах в рамках военно-морских программ с типичным основным вооружением и адекватным вооружением AA в эпоху, они переместили 10 850 тонн, увеличили количество самолётов-скаутов и имели хорошую скорость."
 FRA_light_cruiser_3: "Класс &lt; &lt; де грыз &gt; &gt;"
 FRA_light_cruiser_3_desc: "Крейсеры класса &quot; Де Грасс &quot; были санкционированы в 1938 и 1939 годах военно-морскими программами и были в основном усовершенствованы &quot; Галиссонньерс &quot; . &quot; У них были более сильные вооружения АА &quot; , а также более крупные двигатели. &quot; Падение Франции &quot; привело к отмене двух последних кораблей и к окончанию нового послевоенного корабля. &quot; Немцы &quot; намеревались прикончить ее в качестве легкого перевозчика, но этот проект также не был осуществлен."
 FRA_light_cruiser_4: "Класс Колберта"
 FRA_light_cruiser_4_desc: "В 1956 году был запущен зенитный лёгкий крейсер класса Колберт, который был построен очень похожим на послевоенный крейсер De Grasse с тяжелым вооружением AA как на длинные, так и на короткие расстояния. Разница между Colbert и DeGrasse заключается в том, что у Colbert были более мелкие двигатели, тоньше доспехи и немного меньше."
 FRA_heavy_cruiser_1: "Класс суфрена"
 FRA_heavy_cruiser_1_desc: "Тяжелые крейсеры класса Суффрен были в основном повторены в предыдущем классе Дюкейна с незначительными улучшениями в его способности к морским перевозкам. Оба класса напоминали современную философию крейсеров французского флота; очень тонкие доспехи, но хорошая скорость и дальность. Их стандартное смещение составляет 10 000 тонн, и они были оснащены оружием, которое было стандартным для тяжелого крейсера."
 FRA_heavy_cruiser_2: "Класс Algérie"
 FRA_heavy_cruiser_2_desc: "Тяжелый крейсер Algerie был еще более усовершенствован по сравнению с предыдущими классами Suffreen и Duquesne, но был разработан таким образом, чтобы стать противником новых итальянских тяжелых крейсеров класса Zara."
 FRA_heavy_cruiser_3: "Класс Святого Луи"
 FRA_heavy_cruiser_3_desc: "Тяжелые крейсеры класса Сент-Луис основывались на классе Алгери, но общий взгляд был ближе к виду кораблей класса Дюнкерке и Ришелье. Три корабля были заказаны в 1940 году в рамках военно-морской программы, но из-за падения Франции ни один из них не был сложен. Они поместили новые пушки и усовершенствовали вооружение АА, но броня была такой же, как и в классе Альгери. Это был последний тяжелый крейсер французского флота."
 FRA_heavy_cruiser_4: "Класс Forbin"
 FRA_heavy_cruiser_4_desc: "Тяжелые крейсеры класса Форбин были гипотетическим дизайном в развитие класса Сент-Луиса, предназначенного для защиты торговых путей между материковой Францией и колониями, он имел большой диапазон и хорошую скорость вместе с тяжелым вооружением пушек в четырёх тройных турнирах и достаточным количеством оружия AA. Конструкция судна и общий вид похожи на влияние предыдущего класса Сент-Луиса, а также британской королевской колонии."
 FRA_battle_cruiser_1: "Durand-Viel Design"
 FRA_battle_cruiser_1_desc: "Durand-Viel Design of Battlecruiser была предложением из серии исследований, датируемых WWI. По сути, это были версии боевого круизера классов катеров Нормандии и Лиона с одними и теми же квадровыми турнирами и пушками, хотя и в меньшем количестве. Как и современные круизники других мореплавателей, они были бы более быстрыми, но менее бронированными, чем катер. Они были отменены до того, как вспыхнула WWI."
 FRA_battle_cruiser_2: "Класс Dunkerque"
 FRA_battle_cruiser_2_desc: "Dunkerques были созданы для борьбы с карманными кораблями немецкого класса Duutschland. Они были вершиной серии проектных исследований с середины 1920-х по начало 1930-х годов. В 1931 и 1934 годах они были похожи на британские боевые корабли класса Нельсон, все их основные туры были сконцентрированы вперёд. Это привело к сокращению бронежилетов и, таким образом, к тому, что меньшее судно вписывалось в ограничения по военно-морским договорам."
 FRA_battleship_1: "Класс курбета"
 FRA_battleship_1_desc: "Боевые корабли класса Курбет были первыми супер-дреднью, построенными для французских ВМС до и во время Первой мировой войны. Санкционированные в 1910 и 1911 годах, во время Первой мировой войны они видели ограниченную службу, но были активны во время Второй Мировой Войны. Хотя у них были более толстые брони и более сильные ружья, чем у предыдущих боевых кораблей класса Данте, они все еще были ниже современных военных кораблей США и RN. Они переместились чуть более 22 000 тонн, и их единственная модернизация до Второй Мировой Войны была улучшена и усовершенствованы котлоагрегаты."
 #FRA_battleship_1b: "Класс Бретагна" 
 FRA_battleship_2: "Класс Ришелье"
 FRA_battleship_2_desc: "Боевые корабли класса Ришелье были последними кораблями, заданными во французские военно-морские силы. Они были усовершенствованы и санкционированы в рамках военно-морских программ 1935 и 1938 годов. Они обладали отличным вооружением, скоростью и дальностью действия, что сделало их отличным крупным судном. Из четырех заказанных кораблей только два были запущены и один был завершен до падения Франции. Было предпринято множество попыток завершить оставшиеся корабли с различными конструкциями, которые были предложены для использования в качестве зенитных боевых кораблей, боевых кораблей-гибридов или полноразмерных перевозчиков."
 FRA_battleship_3: "Класс газового газа"
 FRA_battleship_3_desc: "Гасконский класс кораблей был подклассом класса Ришелье. Три корабля были заказаны в 1940 году, но ни один из них не был запущен. Проект был бы повторен Ришелье, но при равномерном распределении основных вооружений, улучшенном вооружении АА и модернизированных двигателях, что привело бы к общему лучшему судну."
 FRA_battleship_4: "Класс Alsace"
 FRA_battleship_4_desc: "С 1939 года были проведены проектные исследования, которые, как ожидается, будут проведены в 1941 году, хотя падение Франции предотвратило это, оно улучшит дизайн Ришелье с помощью более тяжелых и многочисленных главных пушек, более мощных артиллерийских артиллерийских орудий, более толстых бронежилетов и более крупных двигателей."
 FRA_SH_battleship_1: "Класс шарлмагна"
 FRA_SH_battleship_1_desc: "Класс суперкорабельных кораблей Charlemagne является гипотетическим дизайном, совпадающим с большими кораблями других мореплавателей. Они имеют тяжелое вооружение, все вперёд в супермаркетных позициях, тяжёлое вооружение AA и толстые доспехи. Весь дизайн одалживает элементы из классов Ришелье и Британии Нельсон."
 FRA_SH_battleship_2: "Класс наполеона Бонапарта"
 FRA_SH_battleship_2_desc: "Боевые корабли класса Наполеон Бонапарт были гипотетическим дизайном и основывались на классах Эльзас и Гаскон. Его тяжелые вооружения распределены равномерно в тройных турнирах с суперподразделениями и тяжелым вооружением АА. Толстые доспехи и сильные двигатели обеспечивают скорость и защиту, необходимые для того, чтобы успевать за другими кораблями флота и эффективно бороться с противниками."
 FRA_carrier_1: "Класс Béarn"
 FRA_carrier_1_desc: "Первоначально Béarn был установлен в качестве боевого корабля класса Нормандии, но позднее закончился в качестве авианосца, сместив 22 100 тонн и работая в годы межгорода и WWII. В качестве переоборудованного перевозчика его скорость была медленной, и он имел ограниченное пространство для самолетов, но средний бронежилетный пояс и дальний диапазон восполнили эти недостатки. Его строительство дало французский дизайнеру в DCAN (Direction des Constructions et Armes Baile) важный опыт и привело к серии проектировочных исследований после этого."
 FRA_carrier_2: "Класс Joffre"
 FRA_carrier_2_desc: "Маршруты класса Джоффре (проект PA-16) были следующим поколением перевозчиков французских военно-морских сил. Это было последнее из проектных исследований, которые начались в 1929 году и закончились в 1937 году. Два корабля были санкционированы в рамках военно-морской программы 1938 года, однако эскалация конфликтов замедлила процесс строительства и в конечном итоге падение Франции помешало завершению строительства этих судов. Перемещение составило бы около 20 000 тонн. Они имели бы хорошее вооружение, бронежилеты и скорость, но были бы менее средней дополняемой авиацией."
 FRA_carrier_3: "Класс Жана Барта"
 FRA_carrier_3_desc: ""Джин Барт" - это предложение, сделанное в середине войны, о преобразовании незаконченного боевого корабля класса Ришелье Жана Барта в полноразмерный корабль, аналогичный японскому IJN Shinano. Большой корпус будет иметь большой авиационный компонент, а вместе с крупными двигателями - дальний дальний и быстрый носитель. Тяжелое вооружение АА США обеспечит хорошую защиту от воздушных судов и мелких наземных комбатантов."
 FRA_carrier_4: "Класс Клеменсау"
 FRA_carrier_4_desc: "Самолет класса &quot; Клеменсау &quot; (проект под названием &quot; PA-28 &quot; ) был первым послевоенным дизайном французских военно-морских сил. &quot; Конструкция &quot; была бы аналогична незавершенным авиаперевозчикам класса &quot; Джоффре &quot; , хотя установленное оборудование и оружие были бы изготовлены из современных французских изделий. &quot; Приобретение &quot; USN &quot; и &quot; RN &quot; , а также &quot; Экономическое состояние &quot; после войны &quot; Франции не позволили уложить эти суда. &quot; Не следует путать с &quot; последними авиаперевозчиками класса Клеменсау &quot; ( &quot; Проект &quot; PA-54 &quot; ), которые были установлены в 1955 и 1957 годах."
 ### GER - GERMANY ###
 GER_submarine_1: "Тип UB III"
 GER_submarine_1_desc: "Боевая подводная лодка UB III была классом лодки U-U, построенной во время Первой мировой войны немецким Императорским флотом. Они перевозили 10 торпед и переместились более чем на 500 тонн. В период с 1916 по 1918 год было построено 96 лодок, хотя все они были выведены из строя к 1935 году."
 GER_submarine_2: "Тип IIA"
 GER_submarine_2_desc: "Немецкая подводная лодка типа IIA представляет собой один корпус, все сварные прибрежные подводные лодки с внутренними балластными емкостями."
 #GER_submarine_2b: "Тип VIIA"
 GER_submarine_3: "Тип VIIC"
 GER_submarine_3_desc: "Морская подводная лодка типа VIIC была лошадью немецких U-шлюпов с 568 заказом в период с 1940 по 1945 год. Суда переместили 770 тонн и были вооружены пятью 533-мм торпедными трубами."
 #GER_submarine_3b: "Тип IXC"
 GER_submarine_4: "Тип XXI"
 GER_submarine_4_desc: "Подводные лодки типа XXI, известные также как "Elektroboot", были первыми подводными лодками, предназначенными для эксплуатации в основном подводных лодок, а не в качестве поверхностных судов, которые могли бы погрузиться в воду в качестве средства, позволяющего избежать обнаружения или совершения нападения."
 GER_destroyer_1: "Тип 23"
 GER_destroyer_1_desc: "В 1926-1928 годах было построено шесть кораблей, которые служили во время Второй мировой войны. Несмотря на то, что во время Второй мировой войны были установлены торпедные лодки, эти суда были размером с эсминец, заменяли более 920 тонн и вооружены тремя 105-мм пушками L/45."
 GER_destroyer_2: "Глория Классе"
 GER_destroyer_2_desc: "Глория Классе была первым классом немецких эсминцев, построенных со времен Первой мировой войны." guns and eight torpedo tubes. 16 ships were built, out of which 12 were the improved Zerstörer 1934A subclass."
 GER_destroyer_3: "Август Вильгельм Классе"
 GER_destroyer_3_desc: "Август Вильгельм Классе, известный союзникам как"Auwi" Class destroyers, was designed to carry the new 150mm (5.9") guns. Designed with three single guns aft and a twin gun in the bow, they were originally fitted with a single gun in the bow. Four of the eight ships of the class were later refitted with the twin turrets. A second group of seven destroyers were built to a slightly modified design with twin guns in the bow."
 GER_destroyer_4: "Эгир Классе"
 GER_destroyer_4_desc: "Несмотря на то, что первый прототип дизельного эсминцера (август Вильгельм Классе 1942 года) не был завершен, разработка типа судна продолжалась."
 GER_light_cruiser_1: "Эмден Классе"
 GER_light_cruiser_1_desc: "Эмден была первым крупным военным кораблем, построенным в Германии после Первой мировой войны. Она была заложена в 1921 году и сдана в эксплуатацию в 1925 году.") guns in single turrets."
 #GER_light_cruiser_1b: "Эмден Классе"
 GER_light_cruiser_2:1 "Посмотрите на Классе."
 GER_light_cruiser_2_desc:1 "Легкие крейсеры Seeckt Klasse были построены в период с 1928 по 1935 год в качестве усовершенствования по сравнению с предыдущими крейсерами Emben Klasse."
 GER_light_cruiser_3: "Людендорф Классе"
 GER_light_cruiser_3_desc: "Крейсеры Ludendorf Klasse были спроектированы как разведчики для торговых рейдов на эскадрильи. Шесть кораблей были заказаны в рамках плана Z, два корабля были заложены до того, как работы были остановлены во время начала войны. Главным оружием было бы восемь 150-мм пушек в четырёх двух турнирах."
 GER_light_cruiser_4: "Себоттендорф Классе"
 GER_light_cruiser_4_desc: "Крейсеры «Себоттендорф Классе» были модифицированы для Ludendorf Klasse."
 GER_heavy_cruiser_1: "Блюхер Классе"
 GER_heavy_cruiser_1_desc: "Blücher была последним бронированным крейсером, построенным Германией. Ее дизайн был новаторским для своего времени и проложил путь для более поздних битв класса Von der Tann-Battlecruisers. К первой мировой войне она уже была устаревшей. Blücher была затоплена в битве в Доггербанке в 1915 году."
 GER_heavy_cruiser_2: "Гиппер Классе"
 GER_heavy_cruiser_2_desc: "Грузовые крейсеры Адмирала Гиппера Классе были первыми крейсерами Кригсмарина, которые официально переместили 10 000 тонн, на самом деле переместили более 16 000 тонн." guns in four twin turrets, with a secondary battery of twelve 105mm guns."
 GER_heavy_cruiser_3: "Туле Классе"
 GER_heavy_cruiser_3_desc: "Официально часть подкласса &lt; &lt; Гиппер Классе &gt; &gt; &lt; &lt; Туле &gt; &gt; включает в себя множество усовершенствований, включая усиление противовоздушных вооружений."
 GER_heavy_cruiser_4: "Рейдер Классе"
 GER_heavy_cruiser_4_desc: "Адмирал Рейдер Классе был крупным крейсером, официально названным «Панзершифф» (Armored Shipp) «Кригсмарин» и заменившим почти 24 000 тонн, они были бы на 3000 тонн легче, но на 55 метров длиннее, чем корабли класса «Нью-Йорк». Вооружение состояло из шести 280-мм пушек в двух тройных турнирах."
 GER_battle_cruiser_1: "Йорк Классе"
 GER_battle_cruiser_1_desc: "Три корабля &lt; &lt; Йорк-Классе &gt; &gt; были спроектированы в ответ на &lt; &lt; Бритиш реноун класс &gt; &gt; . &lt; &lt; Они &gt; &gt; были вооружены 8 380-мм пушками в четырех двух башенах. &lt; &lt; Все три &gt; &gt; были сложены в 1916 году, но ни одно из них не было завершено из-за войны."
 GER_battle_cruiser_2: "Гамбург Классе"
 GER_battle_cruiser_2_desc: "В 1939 году «Кригсмарин» решил заменить три из запланированных крейсеров класса P боевыми круизерами.") guns in three twin turrets. The ships were designed with a displacement of 35,400 tons and a top speed of 35 knots. Construction orders were given for the three ships of the class, but none were started."
 GER_battleship_1: "Дойчланд Классе"
 GER_battleship_1_desc: "После заключения Версальского договора Германии было разрешено сохранить шесть боевых кораблей, отнесенных к категории &quot; Линьеншиф &quot; ( &quot; Линия &quot; ) Кригсмарин &quot; , только два корабля класса &quot; Дойчланд &quot; , которые не были спутаны с более поздними &quot; Поклетными &quot; кораблями, находившимися в боевом составе до конца 1930-х годов. 1 сентября 1939 года в 04:47 Шлезвиг-Гольштейн произвел первые выстрелы во время Второй мировой войны, открыв огонь на базе &quot; Вестерплатт &quot; в Данзиге, Польша."
 GER_battleship_2: "Шарнхорст Классе"
 GER_battleship_2_desc: "Боевые корабли Scharnhorst Klasse были первыми современными кораблями, которые были построены для Кригсмарина. Они были построены в ответ на французские боевые круизеры класса Dunkerque, которые сами являются ответом на Немецкий Deutschland Klasse Panzerschiffe (Pocket Battle). Класс Scharnhorst вооружён 9 283 мм (11)") guns in three triple turrets. Plans were made to up gun them with twin 380mm (15") guns, but with the outbreak of the war, this never happened."
 GER_battleship_3: "Фюрер Классе"
 GER_battleship_3_desc: "Два корабля Führer Klasse были самыми крупными военными кораблями, построенными для Кригсмарина.") guns as the Richelieu Class, with four twin turrets as opposed to the two quad turrets of the Richelieus."
 GER_battleship_4: "Гроёчланд Классе"
 GER_battleship_4_desc: "Немецкий Гамбургский план предусматривал создание силы в составе десяти кораблей для борьбы с военно-морскими силами Соединенного Королевства. &lt; &lt; Гроёчланд Классе &gt; &gt; представлял собой серию проектов шести кораблей, необходимых для выполнения требований плана. &lt; &lt; Два корабля G39 &gt; &gt; были установлены во время начала второй Великой войны, но строительство было остановлено с началом войны. &lt; &lt; Гросдеушленд &gt; &gt; официально не назывался, но &lt; &lt; Гроёчланд &gt; &gt; , как можно было предположить, назывался ведущим судном класса. &lt; &lt; Если бы эти корабли были завершены, то они были бы расширены &gt; &gt; судами Фюрера Классе с основным аккумулятором в 8 40,6 см (16)") guns."
 GER_carrier_1: "Флагзеугдампфер I"
 GER_carrier_1_desc: "Проект Flugzeugdampfer I (Airplane Steamer I) был задуман в 1915 году как преобразование неполного пассажирского лайнера Ausonia в авианосец. В конце Первой мировой войны строительство было прекращено. Если бы она была завершена, то в трех своих ангарах она взяла бы на себя соединение морских и колесных самолетов и переместила бы 12 500 тонн."
 GER_carrier_2: "Сейдлиц Классе"
 GER_carrier_2_desc: "Сейдлиц была заложена в качестве четвертого корабля тяжелых крейсеров адмирала Гиппера Классе, частично завершенного к началу войны, она была расценена как авианосец. &lt; &lt; Уэсер-1 &gt; &gt; частично осуществлялась, когда работы были остановлены из-за участившихся воздушных нападений на Бремен и нехватки ресурсов для ее строительства."
 GER_carrier_3: "Граф Зеппелин Классе"
 GER_carrier_3_desc: "Граф Зеппелин был единственным классом кораблей в Кригсмарине, которые были спроектированы как авианосец из киля вверх. Два корабля были заказаны, но ни одно из них не было завершено. Гриф Зеппелин, как и планировалось, перевозил 30 истребителей Bf-109T и 12 бомбардировщиков Ju-87E, судовые версии Bf-109E и Ju-87D."
 GER_carrier_4: "Европа Классе"
 GER_carrier_4_desc: "В 1940-х годах Кригсмарин рассматривал вопрос о конверсии нескольких гражданских судов в авианосцы, крупнейшим из которых был пассажирский корабль &quot; Европа &quot; . &quot; Крупнейшим пассажирским судном в Германии &quot; она была использована в качестве казарменного судна и транспорта войск до начала работ по ее превращению в транспортер &quot; . &quot; Если бы она была завершена, то она переместила бы 56 000 тонн и перенесла бы в воздух 42 самолета. &quot; ."
 GER_SH_battleship_1: "Шлаччифф H41"
 GER_SH_battleship_1_desc: "Конструкция кораблей H41 была улучшена по сравнению с предыдущей конструкцией H39. Конструкцией предусматривались значительно более мощные доспехи, усиленные торпедные переборки и защита судовых рулей и винтовых шахт. Основная батарея была модернизирована до восьми 42 см, что больше, чем в предлагаемых боевых кораблях класса Львов Соединенного Королевства."
 GER_SH_battleship_2: "Шлаччифф Н44"
 GER_SH_battleship_2_desc: "Класс H44 был последним в серии H-серий боевого корабля. Без ограничений по калибру или смещению, конструкции H42-H44 были установлены все более тяжёлым вооружением и защитой доспехов, кульминацией которых стал проект 131 000 тонн H44, вооруженный 8 508 мм (20)") guns."
 ### ITA - ITALY ###
 ITA_submarine_1: "Класс Мамели"
 ITA_submarine_1_desc: "Класс Джеффредо Мамели является классом средних подводных лодок Реджиа Марины, запущенных в период с 1926 по 1928 год. Они переместились чуть менее 800 тонн и имели глубину ныряния 100 метров. Они послужили основой для последующих моделей, таких как классы Писани, Бандиера и Сквало."
 #ITA_submarine_1b: "Класс Бандиры"
 #ITA_submarine_1c: "Класс Сирены"
 ITA_submarine_2: "Класс Perla"
 ITA_submarine_2_desc: "В 1930-х годах были построены подводные лодки класса &quot; Перла &quot; и &quot; Адуа &quot; , которые были третьим и четвертым подклассами из 600 серий подводных лодок, построенных Италией, были меньше, чем их предшественники, заменяя несколько более 600 тонн."
 #ITA_submarine_2b: "Класс Марчелло"
 ITA_submarine_3: "Класс Маркони"
 ITA_submarine_3_desc: "Класс Маркони состоял из шести подводных лодок, которые были построены между 1939 и 1940 годами и стали преемником предыдущих подводных лодок Луисзи."
 #ITA_submarine_3b: "Класс плантино"
 ITA_submarine_4: "Класс Pietro Calvi"
 ITA_submarine_4_desc: "Подкласс Pietro Calvi предусматривал лишь незначительные улучшения по сравнению с предыдущим классом Flutto, который был классом средних подводных лодок."
 ITA_destroyer_1: "Класс куртатона"
 ITA_destroyer_1_desc: "После окончания Первой мировой войны в Италии были построены первые эсминцы класса Curtatone и первыми эсминцами, которые использовали двойные орудия. Корабли первоначально были заказаны одновременно с эсминцами класса Palestro, но были отложены из-за нехватки стали. Они переместились чуть менее 1 000 тонн и подняли четыре 102-мм ствола Шнайдера-Армстронг."
 #ITA_destroyer_1b: "Класс &quot; Навигатори &quot;"
 #ITA_destroyer_1c: "Класс маэстралы"
 ITA_destroyer_2: "Класс &lt; &lt; Сольдати &gt; &gt;"
 ITA_destroyer_2_desc: "Класс Сольдати был группой эсминцев, построенных в конце 1930-х годов, там было две партии. Двенадцать кораблей составили первую партию в 1938-39 годах. Пять кораблей были завершены во второй партии в 1941-42 годах. Первая партия переместилась чуть более 1800 тонн и была вооружена четырьмя 120-мм пушками."
 ITA_destroyer_3: "Класс Ciclone"
 ITA_destroyer_3_desc: "Эсминцы класса Ciclone были названы торпедными лодками, но на самом деле были эскортом эсминцев, несколько расширенными версиями предыдущего класса Orsa, которые переместили более 1100 тонн, улучшили стабильность и усилили противоподводные вооружения."
 #ITA_destroyer_3b: "Класс ариета"
 ITA_destroyer_4: ""Медагли д'Оро класс""
 ITA_destroyer_4_desc: "Класс команданти Медагли д'Оро был группой эсминцев, планировавшихся для «Реджиа Марина», но так и не запущенных во время Итальянского перемирия. Корабли были значительно больше, чем предыдущие итальянские эсминцы, заменяя почти 2 100 тонн, они также были вооружены более крупными, 135-мм пушками «Ансальдо» и усовершенствовали двигатели."
 ITA_light_cruiser_1: "Класс таранто"
 ITA_light_cruiser_1_desc: "Крейсеры Taranto и Bari были крейсерами первой мировой войны, которые были получены из Германии в качестве компенсации."
 #ITA_light_cruiser_1b: "Класс Giussano"
 #ITA_light_cruiser_1c: "Класс &quot; Монтекуколи &quot;"
 ITA_light_cruiser_2: "Дюка дигли Абруцци"
 ITA_light_cruiser_2_desc: "Класс Duca degli Abruzzi был пятым подклассом лёгких крейсеров класса Condottieri. Они были построены до Второй мировой войны, чтобы занять доминирующее положение в Средиземном море. Это были крупнейшие итальянские лёгкие крейсеры, заказывавшиеся во время войны, которые переместили более 9 400 тонн. Они были хорошо бронетранспортированы и установлены на 10 152-ммм ружьях Ансалдо."
 ITA_light_cruiser_3: "Класс капитанов-рома"
 ITA_light_cruiser_3_desc: "В конце 1939-х годов было заказано 12 корпусов, но только три из них были завершены до Итальянского перемирия в 1943 году."
 ITA_light_cruiser_4: "Класс Сан-Марко"
 ITA_light_cruiser_4_desc: "Класс Сан-Марко — это улучшенная версия более ранних лёгких крейсеров Capitani Romani, из-за Итальянского перемирия, Сан-Марко и ее переоборудованного сестринского корабля SanGorgio были заказаны только в 1950-е годы."
 ITA_heavy_cruiser_1: "Класс Тренто"
 ITA_heavy_cruiser_1_desc: "Класс Тренто был тяжелым крейсером Реджиа Марина с конца 1920-х годов. Это были первые корабли, разработанные специально для ограничений Вашингтонского военно-морского договора, который ограничил крейсеры до 10 000 тонн и 8 в. пушки. Последний корабль класса, Bolzano, был усовершенствован в 1932 году."
 #ITA_heavy_cruiser_1b: "Класс Зары"
 ITA_heavy_cruiser_2: "Класс &lt; &lt; Сан-Джорджо &gt; &gt;"
 ITA_heavy_cruiser_2_desc: "Класс Сан-Джорджио — это гипотетический класс межвоенных тяжелых крейсеров, которые должны были быть запущены незадолго до начала войны."
 ITA_heavy_cruiser_3: "Класс Pisa"
 ITA_heavy_cruiser_3_desc: "Класс Пизы является гипотетически тяжелым крейсером с середины войны, он переместился примерно на 12 000 тонн и действовал в качестве лидера своих собственных патрульных сил."
 ITA_heavy_cruiser_4: "Класс Гарибальди"
 ITA_heavy_cruiser_4_desc: "Класс Гарибальди является гипотетическим классом тяжёлых крейсеров за поздние войны, он переместился примерно на 14 000 тонн, был хорошо вооружён 8 203-мм пушками OTO/Ansaldo и мог бы идти в ногу с большинством перевозчиков и другими капиталистическими кораблями."
 ITA_battle_cruiser_1: "Класс Caracciolo"
 ITA_battle_cruiser_1_desc: "Класс Francisco Caracciolo был классом заглавных кораблей, который был предложен сразу же после WWI. Корабли переместились примерно на 34 000 тонн, были хорошо бронетанковы и достаточно быстры с точки зрения их размера и винтаж. Был запущен только один корабль, но он был отменен в 1921 году."
 ITA_battle_cruiser_2: "Класс Принсипи Амедео"
 ITA_battle_cruiser_2_desc: "Класс Принсипи Амедео — гипотетический боевой круиз, который был запущен примерно в конце 1930-х годов."
 ITA_battleship_1: "Класс Conte Di Cavour"
 ITA_battleship_1_desc: "Во время Первой мировой войны были сданы в эксплуатацию боевые корабли класса Conte Di Cavour. У них было 305-мм армстронг-викеры, они переместили 23 000 тонн и имели максимальную скорость, сопоставимую с другими страшными боевыми кораблями. Начиная с 1933 года, два оставшихся корабля класса претерпели серьезные изменения, улучшив свой размер, вооружение и представление, чтобы быть наравне с возникающими «быстрыми» боевыми кораблями того времени."
 ITA_battleship_2: "Класс &quot; Кайо Дуилио &quot;"
 ITA_battleship_2_desc: "Категории кайо-Дуилио первоначально были заказаны в начале Первой мировой войны. Однако оба корабля были полностью переоборудованы в период 1937-1940 годов. Эта модель представляет собой перепланировку. Вооружения модернизированы до 10 320-мм пушек М1934, теперь их перебазирование составляет 29 000 тонн, и скорость достаточно высока, чтобы классифицировать их как "быстрый" боевой корабль."
 ITA_battleship_3: "Класс Литторио"
 ITA_battleship_3_desc: "Класс Литторио, также известный как класс Витторио Венето, представлял собой самые современные боевые корабли, использовавшиеся Италией во время Второй мировой войны. Они переместились более чем на 40 000 тонн и были очень быстро для своего размера."
 ITA_battleship_4: "Класс имперо"
 ITA_battleship_4_desc: "Боевые корабли Impero были гипотетическими классами последних военных кораблей, они переместились примерно на 43 000 тонн, были вооружены 381-мм ружьями Ансалдо и были хорошо бронетанковы."
 ITA_carrier_1: "Джузеппе Миралья Класс"
 ITA_carrier_1_desc: "Класс Джузеппе Миралья является гипотетическим классом ранних межвоенных авианосцев. Он сопоставим с американскими авиаперевозчиками Lexington и японскими авиаперевозчиками Kaga или Akagi."
 ITA_carrier_2: "Класс Falco"
 ITA_carrier_2_desc: "Falco — гипотетический класс итальянских авианосцев межвоенного класса. Они были сопоставимы с авиакомпаниями класса Йорктаун и британской королевской авиакомпанией "Ark Royal"."
 ITA_carrier_3: "Класс акилы"
 ITA_carrier_3_desc: "Акила была запланирована конверсией морского лайнера &quot; Рома &quot; , который должен был начаться в 1941 году, но проект так и не был завершен. &quot; Акила &quot; в случае его завершения переместит 23 500 тонн и будет сопоставима с японским классом &quot; Хио &quot; и британскими &quot; непомерными &quot; ."
 ITA_carrier_4: "Класс &quot; Спарвиеро &quot;"
 ITA_carrier_4_desc: "Спарвьеро также планировал конверсию морского лайнера, Августа. Преобразование началось в конце 1942 года, но не зашло далеко. Германия сорвала судно после его захвата после Итальянского перемирия. Перевозчик переместил 30 400 тонн, был достаточно хорошо бронетанков и имел сильную защитные батареи AA."
 ITA_SH_battleship_1: "Класс Регины Маргериты"
 ITA_SH_battleship_1_desc: "Класс Регины Маргерита — это гипотетический класс тяжелых боевых кораблей, которые были запущены незадолго до начала войны. Они были бы сопоставимы с японскими боевыми кораблями класса Ямато. Они были бы очень хорошо бронированы, переместились бы около 60 000 тонн и были бы вооружены 406-мм пушками."
 ITA_SH_battleship_2: "Регина Елена Класс"
 ITA_SH_battleship_2_desc: "Класс Регины Елена является гипотетическим классом тяжелых боевых кораблей, которые будут запущены примерно во время вступления Италии в войну. Они были сравнимы с спланированными США боевыми кораблями класса Монтана. Они были сильно бронированы, переместились более 70 000 тонн и были вооружены 406-мм пушками в своей основной батарее."
 ### JAP - JAPAN ###
 JAP_submarine_1: "Класс Кайчу"
 JAP_submarine_1_desc: "Подводные лодки класса &quot; кайчу &quot; были построены после WWI и основаны на более ранних подводных лодках. &quot; Эти средние подводные лодки &quot; были надлежащим образом вооружены, имеют хороший оперативный дальность и хорошо протекали свое время, но к 1938 году они были несколько устаревшими. 42 подводные лодки типа &quot; Кайчу &quot; были построены для IJN, а серия включала 7 вариантов."
 #JAP_submarine_1b: "Класс Kaidai III"
 JAP_submarine_2: "Класс &lt; &lt; Кайдай VI &gt; &gt;"
 JAP_submarine_2_desc: "Подводные лодки класса &lt; &lt; Кайдай VI &gt; &gt; были крупными и хорошо вооруженными подводными лодками с большой дальностью и относительно хорошей скоростью. &lt; &lt; Кайдай &gt; &gt; вся серия подводных лодок была стабильной и успешной, которая служила МСН до окончания Тихоокеанской войны."
 JAP_submarine_3: "Класс Ko/Otsu/Hei-gata"
 JAP_submarine_3_desc: "Подводные лодки класса &quot; Ко-гата &quot; , &quot; Отсу-гата &quot; и &quot; Хей-гата &quot; представляли собой крупные крейсерские подводные лодки, выполнявшие командные функции для подводных эскадрильй. &quot; Ко &quot; и &quot; Отсу-гата &quot; были оснащены современным радиооборудованием, тяжелым торпедным вооружением и их более крупным радиусом эксплуатации. &quot; Ко &quot; и &quot; Отсу-гата &quot; также выполняли функции поплавковых самолетов."
 #JAP_submarine_3b: "Класс Ko/Otsu/Hei-gata (конец)"
 JAP_submarine_4: "Класс Sen-Toku"
 JAP_submarine_4_desc: "Подводные лодки класса &quot; Сен-Току &quot; были крупнейшими подводными лодками WWII. Это были подводные авианосцы с тяжелым торпедным вооружением, достаточным количеством легких АА и, в силу их размеров и двигателей, относительно быстрые и дальние. Они могли перевозить три самолета &quot; Аити М6А &quot; для разведки и ограничения возможностей нанесения ударов."
 #JAP_submarine_4b: "Класс сен-така"
 JAP_destroyer_1: "Класс минеказы"
 JAP_destroyer_1_desc: "Разрушители классов Минеказе, Камиказе и Муцуки были хорошо оснащены как наземными пушками, так и торпедами в течение своего времени, но имели ограниченный запас оружия АА, которые были сочтены устаревшими в начале Второй мировой войны и были в основном второстепенными."
 #JAP_destroyer_1b: "Класс Fubuki"
 JAP_destroyer_2: "Класс Асасио"
 JAP_destroyer_2_desc: "Эсминцы класса Асасио были первым японским классом эсминцев, переместившимся более чем на 2 000 тонн, и первыми были оснащены сонаром, у них было тяжелое торпедное оружие и достаточное легкое оружие АА, а также несколько больший операционный радиус, чем у старого класса Фубуки."
 #JAP_destroyer_2b_ "Kagero Class"
 JAP_destroyer_3: "Класс Akizuki"
 JAP_destroyer_3_desc: "Эсминцы класса Акидзуки были хорошо оснащены как поверхностными пушками, так и торпедами, достаточным вооружением АА, а также столь необходимыми дополнительными зарядами. Из 39 запланированных только 12 были завершены до отмены серии."
 JAP_destroyer_4: "Класс &quot; Симаказ &quot;"
 JAP_destroyer_4_desc: "Класс Shimakaze был самым быстрым эсмином в мире на момент его завершения. Это был прототип эсминец для испытания новых турбин высокого температурного давления. Он был чрезвычайно быстрым и хорошо вооружен торпедами, но это означало меньшее радиусо действия."
 JAP_light_cruiser_1: "Класс Tenryu"
 JAP_light_cruiser_1_desc: "Корабли класса &lt; &lt; Тенриу &gt; &gt; переместились примерно на 4400 тонн и были легко вооружены по сравнению с аналогичными судами других мореплавателей, но хорошая скорость и адекватное торпедное вооружение восполнили эти недостатки."
 #JAP_light_cruiser_1b: "Класс кума"
 #JAP_light_cruiser_1c: "Класс &quot; Сендай &quot;"
 JAP_light_cruiser_2: "Класс Могами-Шо"
 JAP_light_cruiser_2_desc: "На начальном этапе крейсеры класса Могами были хорошо вооружены, оснащены хорошими доспехами и мощными двигателями, обеспечивающими высокую скорость. &lt; &lt; Хорошая защита АА &gt; &gt; и &lt; &lt; Высокоскоростная &gt; &gt; обеспечивали широкий диапазон операций. &lt; &lt; Верхний проект &gt; &gt; привел к нестабильности во время операций. &lt; &lt; Программа Мару-2 &gt; &gt; была перестроена как тяжелые крейсеры."
 JAP_light_cruiser_3: "Класс Agano"
 JAP_light_cruiser_3_desc: "Легкие крейсеры класса Agano были спроектированы главным образом как лидеры флотилии для эскадрильи эсминцев."
 #JAP_light_cruiser_3b: "Класс Ойодо"
 JAP_light_cruiser_4: "Класс Agatsuma"
 JAP_light_cruiser_4_desc: "Класс Agatsuma был лёгким крейсером, который никогда не видел никаких кораблей, построенных до окончания войны."
 JAP_heavy_cruiser_1: "Класс Furutaka/Aoba"
 JAP_heavy_cruiser_1_desc: "Класс Furutaka и следующие тяжёлые крейсеры Aoba были первыми тяжелыми крейсерами в Японском военно-морском флоте. Они были спроектированы как американский класс Omaha и British Hawkins. Позднее в их жизни они были модернизированы и получили новые вооружения и более совершенные двигатели."
 #JAP_heavy_cruiser_1b: "Класс Миоко"
 JAP_heavy_cruiser_2: "Класс Могами-Кай"
 JAP_heavy_cruiser_2_desc: "Класс Mogami-Kai () — реконструированная версия Mogami класса Light Cruisers, получившая название Mogami-Sho."
 JAP_heavy_cruiser_3: "Класс тона"
 JAP_heavy_cruiser_3_desc: "Тяжелые крейсеры класса Тон были изначально спроектированы как лёгкие крейсеры, но отредактированы с более тяжелым вооружением. Они были уникальными в том, что все вооружения были размещены впереди, в то время как кормовая часть корабля использовалась для перевозки и обслуживания поплавковых самолетов, которые скаутировали для вражеских сил."
 JAP_heavy_cruiser_4: "Класс Ибуки"
 JAP_heavy_cruiser_4_desc: "Тяжелые крейсеры класса Ибуки были последними крейсерами, которые были построены Японией до окончания войны."
 JAP_battle_cruiser_1: "Класс Kongo"
 JAP_battle_cruiser_1_desc: "Боевые круизеры Конго были построены для IJN непосредственно перед Великой Войной и были одними из лучших боевых круизеров в межвоенный период. С использованием возможности инцидента с четвертым флотом 4 Kongos отремонтировали модификацию. Модифицированный дизайн называется Kongo-Kai дизайн."
 #JAP_batttle_cruiser_1a: "Класс Акаги"
 JAP_battle_cruiser_2: "Проектирование B-65"
 JAP_battle_cruiser_2_desc: "Дизайн B-65 был быстрым, умеренно бронебойным судном с хорошим оружием АА и современным вооружением. Они были предназначены для борьбы с новыми тяжелыми крейсерами ВМС США и для защиты судовых перевозчиков МЯС, с которыми можно было бы считаться, если бы они были закончены."
 JAP_battleship_1: "Класс Fuso"
 JAP_battleship_1_desc: "Во время WWI были построены боевые корабли класса Fuso и модернизированы в 1930-х годах с программой Maru 2. Они были хорошо бронированы и вооружены, а шесть двух турниров на осевой линии дали тяжёлую ширину, но также ограничили дополнительное оружие AA, которое эти корабли могли нести."
 #JAP_battleship_1b: "Класс льда" (refit version)
 #JAP_battleship_1c: "Класс Нагато" (refit version)
 JAP_battleship_2: "Класс Нагато"
 JAP_battleship_2_desc: "Боевой корабль класса Нагато был классом из двух кораблей, заложенных в конце Великой войны, но закончившихся после войны. &lt; &lt; Нагато &gt; &gt; и &lt; &lt; Муцу &gt; &gt; считаются гордостью Японии. &lt; &lt; Мару-2 &gt; &gt; были модернизированы с помощью программы &lt; &lt; Мару 2 &gt; &gt; , усовершенствовали их доспехи, вооружения и другие механизмы."
 JAP_battleship_3: "Класс таджимы"
 JAP_battleship_3_desc: "Класс Таджимы был гипотетическим классом быстрых боевых кораблей, спроектированным для того, чтобы быть дешевле и быстрее, чем массивные боевые корабли класса Ямато. Они использовали старые пушки предыдущих кораблей, но высокие скорости, адекватные доспехи и AA обеспечили защиту для этих кораблей."
 JAP_battleship_4: "Сваминый класс"
 JAP_battleship_4_desc: "Навальный класс был гипотетическим классом боевых кораблей, которые использовали новые методы для ускорения строительства; они были хорошо оснащены новыми пушками и тяжелыми пулеметами АА и могли соответствовать любым аналогичным вооруженным кораблям для использования в качестве огневой мощи."
 JAP_SH_battleship_1: "Класс Ямато"
 JAP_SH_battleship_1_desc: "Класс Ямато состоял из самых тяжелых из когда-либо созданных боевых кораблей, заменяющих 72 000 тонн, и корабли были спроектированы как гордость и мощь японского флота в соответствии с планом Богини мира. На каждом корабле находилось девять 460-миллиметровых военно-морских орудий, крупнейшая военно-морская артиллерия, когда-либо установленная на военно-морском корабле."
 JAP_SH_battleship_2: "Класс супер-ямато"
 JAP_SH_battleship_2_desc: "Гипотетический класс Супер Ямато видел, как Ямато использовался в качестве базы, но оружие было бы еще сильнее с основным вооружением 51 см пушек и сильным вооружением AA самого нового типа. Их броня была рассчитана на то, чтобы выдержать даже снаряды из собственных пушек, и они заменяли бы около 70-80 000 тонн."
 JAP_carrier_1: "Класс"
 JAP_carrier_1_desc: "«Хошо» был первым в мире заказным судном, которое было спроектировано и построено в качестве авианосца, и первым авианосцем «Имперского японского военно-морского флота»."
 #JAP_carrier_1a: "Класс Тосы"
 #JAP_carrier_1b: "Класс Рюхо"
 JAP_carrier_2: "Класс сорю"
 JAP_carrier_2_desc: "Сорю и Хирю были спроектированы с зеркальной надстройкой острова, чтобы ускорить процессы рекуперации воздушных судов во время плавания рядом друг с другом, они были быстроносителями с пространством для больших воздушных групп, но были минимальными бронежилетами, они переместили 20 000 тонн, а крупные двигатели обеспечили высокую скорость и широкий диапазон операций."
 #JAP_carrier_2b: "Класс Хирю"
 JAP_carrier_3: "Класс Shokaku"
 JAP_carrier_3_desc: "Самолеты класса &lt; &lt; Шокаку &gt; &gt; были спроектированы таким образом, чтобы обеспечить высокую скорость, длинный радиус действия, высокую степень защиты и большую пропускную способность воздушных судов, что сделало их отличными перевозчиками. В результате усовершенствованных методов строительства они переместили 33 000 тонн с полной нагрузкой и могли пережить больше повреждений, чем большинство современных перевозчиков."
 #JAP_carrier_3b: "Класс &lt; &lt; привет &gt; &gt;"
 JAP_carrier_4: "Класс тайхо"
 JAP_carrier_4_desc: "Самолет класса &lt; &lt; Тайхо &gt; &gt; был первым полностью бронетранспортером ИЯН с бронированной палубой, которая выдержала несколько ударов бомбой и торпедой и все еще функционировала эффективно. &lt; &lt; Крупная авиагруппа &gt; &gt; и &lt; &lt; АА &gt; &gt; будут обеспечивать не только самооборону, но и силовую проекцию противника."
 #JAP_carrier_4b: "Класс &lt; &lt; Синано &gt; &gt;"
 ### SOV - SOVIET UNION ###
 SOV_submarine_1: "Класс AG"
 SOV_submarine_1_desc: "В Канаде были построены подводные лодки класса Amerikansky Golland (American Holland), а затем доставлены в Россию во время WWI, где они были, наконец, собраны."
 #SOV_submarine_1b: "Серия I &lt; &lt; Дебакрист &gt; &gt;"
 SOV_submarine_2: "Серия V Шчука"
 SOV_submarine_2_desc: "Подводные лодки серии V класса &lt; &lt; Шука &gt; &gt; были вторыми по величине многочисленными подводными лодками Советского ВМС. Их большое число было получено в результате их развертывания в четырех флотах Советского Союза: Черном море, Балтии, Северном и Тихом океане."
 #SOV_submarine_2b: "Серия IX &lt; &lt; Средная &gt; &gt;" (Stalinets<-unofficial name)
 #SOV_submarine_2c: "Серия X Шчука"
 SOV_submarine_3: "Класс К серии XIV"
 SOV_submarine_3_desc: "Подводные лодки серии XIV представляли собой крупные крейсерские подводные лодки с расширенным радиусом действия. По сути, они представляли собой улучшенную версию класса серии IV Pravda. Эти подводные лодки имели тяжелое вооружение как наземных пушек, так и торпед. Они имели дальний радиус действия, но только удовлетворительную мореходность."
 SOV_submarine_4: "Проект 611"
 SOV_submarine_4_desc: "Подводные лодки &lt; &lt; Проект 611 &gt; &gt; ( &lt; &lt; Подводные лодки НАТО &gt; &gt; : &lt; &lt; Зулу &gt; &gt; ) были первыми подводными лодками Советского ВМС, которые были построены после Второй мировой войны. Их проект основывался на немецких подводных лодках типа XXI и предназначался для замены старых лодок класса XIV K. Они были крупными, океанскими подводными лодками с тяжелым торпедным вооружением и дальним дальним радиусом действия. Они использовались в качестве основы для последующего проекта 613 ( &lt; &lt; Код НАТО: Виски &gt; &gt; ) и проекта 641 ( &lt; &lt; Код НАТО: Фокстрот &gt; &gt; )."
 SOV_destroyer_1: "Класс Орфея"
 SOV_destroyer_1_desc: "Эсминцы класса Orfey были улучшенной версией предыдущего класса Новика. Они имели достаточную поверхность и оружие АА для своего размера, несколько короткого расстояния, но хорошая скорость и тяжелое торпедное вооружение. Последующие классы Fidonisy и Izyaslav были усовершенствованы версий этого класса с увеличением основного вооружения и размера корпуса."
 #SOV_destroyer_1b: "Ленинград & Минский класс"
 SOV_destroyer_2: "Гневный класс"
 SOV_destroyer_2_desc: "В рамках программы строительства судов 1933-1938 годов были разрешены эсминцы класса &quot; Гнавни &quot; (проект 7). &quot; Сам класс &quot; был в значительной степени затронут итальянским эсмином &quot; Маэстрал &quot; и считался успешным дизайном. &quot; Их смещение &quot; составило 1600-2 000 тонн, они были хорошо вооружены и имели достаточное АА и торпедное вооружение."
 SOV_destroyer_3: "Класс &lt; &lt; Субразительни &gt; &gt;"
 SOV_destroyer_3_desc: "Разрушители Soobrazitelnyi (проект 7U) были улучшенной версией предыдущего класса Gnevny. Их двигатели были переоборудованы, и у них было более сильное вооружение AA. Они переместились от 1 900 до 2 400 тонн, и их скорость и дальность были аналогичны классу Gnevny."
 #SOV_destroyer_3b: "Класс огневоя"
 SOV_destroyer_4: "Класс &quot; Скорий &quot;"
 SOV_destroyer_4_desc: "Скорийский класс (проект 30-бис) стал еще одним шагом вперед по сравнению с классом Огневуа. Увеличение размера и сдвига (2 500-3 100 тонн) привело к более стабильному судну с повышенным эксплуатационным диапазоном. Все суда были построены после войны для модульного проектирования, что привело к быстрому строительству и развертыванию. Их вооружение было таким же, как и в предыдущем классе Огневой, но главное оружие было размещено в двух башенах вместо одной турре."
 SOV_light_cruiser_1: "Красний Крим Класс"
 SOV_light_cruiser_1_desc: "Крейсер класса Красний Крым, первоначально крейсер класса Светлана, начал строительство до WWI, но война и последовавшая за ней революция задержали завершение всего класса. В середине 1920-х годов она, наконец, была зачислена в Советский флот вместе со своей сестрой Черной Украиной (бывший адмирал Нахимов), которые были первыми турбинными крейсерами императорского российского флота. Они были хорошо вооружены и хорошо бронированы в свое время."
 SOV_light_cruiser_2: "Класс комосомолетов"
 SOV_light_cruiser_2_desc: "Легкие крейсеры класса &quot; Комсомолет &quot; были серией гипотетических судов, которые представляли собой некоторое сочетание старых и новых технологий. С использованием неполных корпусов классов &quot; Светлана &quot; и &quot; Адмирал Нахимов &quot; , расходы на строительство были сокращены."
 SOV_light_cruiser_3: "Класс Chapaev"
 SOV_light_cruiser_3_desc: "Крейсеры класса &lt; &lt; Чапаев &gt; &gt; (проект 68) основывались на крейсерах класса &lt; &lt; Киров &gt; &gt; (проект 26) и были санкционированы в программе строительства судов 1938 - 43 годов. &lt; &lt; В качестве первых легких крейсеров Советского военно-морского флота &gt; &gt; они перевозили мощное противоповерхностное и противовоздушное вооружение вместе с достаточным торпедным вооружением. &lt; &lt; В целом &gt; &gt; это были хорошие суда с толстым бронепоясом, высокой скоростью, хорошим рабочим диапазоном и перемещением от 10 500 до 14 000 тонн. &lt; &lt; Из-за войны и вторжения немецких войск &gt; &gt; многие корабли класса были отменены, а остальное было завершено после окончания боевых действий."
 SOV_light_cruiser_4: "Класс Свердлова"
 SOV_light_cruiser_4_desc: "Крейсеры класса &quot; Свердлов &quot; (проект 68-бис) были последними крейсерами Советского ВМС и были улучшены версий предыдущего класса &quot; Чапаев &quot; . По сравнению с Чапаевыми, они обладали той же основной защитой в плане вооружения, техники и бронежилетов, но увеличили топливную мощность для большей дальности, улучшили защиту подводного пространства, увеличили зенитные батареи и несколько улучшили мореходность."
 SOV_heavy_cruiser_1: "Класс Красний Кавказ"
 SOV_heavy_cruiser_1_desc: "Красний Кавказ, первоначально адмирал Нахимовский лёгкий крейсер, был сестрой Chervona Ukraina. Красный Кавказ был выполнен модифицированным дизайном, который включал в себя 180-миллиметровое оружие и более сильное вооружение AA. Поскольку она была восстановленным легким крейсером, ее доспехи были тоньше по сравнению с тяжелыми крейсерами других мореплавателей."
 SOV_heavy_cruiser_2: "Класс Кирова"
 SOV_heavy_cruiser_2_desc: "Крейсеры класса Киров (проект 26) были первыми современными крейсерами Советского ВМС. Проект был основан на итальянских лёгких крейсерах класса Raimondo Montecuccoli и был построен в рамках программы строительства судов 1933-1938 годов. Корабли переместились от 7 700 до 9 200 тонн. Они были вооружены новыми 180-мм пушками в трех тройных турнирах и твердой батарее АА. Их сильные двигатели обеспечивали хорошую скорость и приемлемый оперативный диапазон, в то время как бронежилеты были тонкими по сравнению с другими тяжелыми крейсерами."
 #SOV_heavy_cruiser_2b: "Класс Максим Горки"
 SOV_heavy_cruiser_3: "Проект 22"
 SOV_heavy_cruiser_3_desc: "Проект 22 тяжелых крейсеров был разработан в середине 1930-х годов, чтобы противодействовать аналогичным судам в соседних странах. Проект предусматривал замену более крупного судна весом от 15 500 до 17 000 тонн, оснащенного четырьмя тройными 240-мм пушками для борьбы с вражескими крейсерами, тяжелым вооружением АА для самообороны и более крупным самолетом-скаутом для поиска врага. Их главная задача состояла бы в том, чтобы провести разведку для вражеских сил и охоту на колонны. Расходы на суда и выделение ресурсов для удовлетворения других потребностей привели к отмене проекта."
 SOV_heavy_cruiser_4: "Проект 66"
 SOV_heavy_cruiser_4_desc: "Проект 66 тяжелых крейсеров был последней попыткой Советского ВМС спроектировать и построить чисто оружейный крейсер. Проектные исследования начались в 1943 году, и финальная версия появилась после войны. Эти суда имели 220-мм пушки в трёх тройных турнирах и сильное вооружение АА. Перемещение составило по меньшей мере 26 500 тонн. Наступление ракетного века и смерть Джозефа Сталина повлекли за собой прекращение проекта."
 SOV_battle_cruiser_1: "Класс бородино"
 SOV_battle_cruiser_1_desc: "Боевые круизеры класса Бородино состояли из четырёх кораблей, разрешенных в 1914 году, непосредственно перед WWI. Они основывались на боевых кораблях класса Императрица-Мария. Они следовали современной практике строительства российского столичного судна, используя четыре тройные турниры для размещения тяжелого основного вооружения, мощное вторичное вооружение в случае, когда-либо, и общее смывное место. Они имели низкий уровень активности с низкой осадкой для борьбы в мелководных водах Балтийского моря. Как и многие российские корабли этого периода, вспышка WWI и русской революции лишили эти корабли конца."
 SOV_battle_cruiser_2: "Класс Kronshtadt"
 SOV_battle_cruiser_2_desc: "Кронштадт (проект 69) был санкционирован в 1938-43-х годах и должен был завершиться в 1940-х годах. Первоначальный проект был предназначен для большого тяжелого крейсера численностью 23 000 тонн, но после получения информации о немецких круизеров Шарнхорста корабли были переоборудованы, чтобы переместить их до 35 000 тонн. По мере начала боевых действий между Германией и Советским Союзом строительство судов было остановлено и в конечном итоге отменено. Альтернативные планы предусматривали завершение строительства неполного корпуса в качестве авианосцев в рамках проекта 69AV."
 SOV_battleship_1: "Класс Марата"
 SOV_battleship_1_desc: "В 1930-х годах они были модернизированы и переоборудованы, что привело к созданию высокой почти пагодно-поисковой надстройки. У них была современная электроника и сильное дополнение АА."
 SOV_battleship_2: "Проект 21"
 SOV_battleship_2_desc: "Проект 21 был разработан в середине 1930-х годов как часть военно-морского флота Сталина. Они были очень похожи на британские боевые корабли класса Нельсон. Корабли переместились примерно на 41 000 тонн, были вооружены девятью 406-мм пушками в трех тройных турнирах (впереди) и вторичным вооружением в 12 152-мм пушках. Хорошие вооружения и толстые доспехи обеспечили надежную защиту от воздушных и наземных целей. Проект был в конечном итоге отменен, но часть его элементов была использована на боевых кораблях класса Советский Союз (проект 23)."
 SOV_battleship_3: "Класс ленина"
 SOV_battleship_3_desc: "Боевой корабль класса Ленин был гипотетическим дизайном, чтобы совместиться и противостоять немецким кораблям Bismarck и U.S. South Dakota. Его девять 406-мм пушек в трёх трёх турнирах обеспечили бы достаточную огневую мощь, в то время как 130-мм пушки AA, толстые доспехи и большие двигатели обеспечили бы его выживание в бою."
 SOV_battleship_4: "Класс Stalingrad"
 SOV_battleship_4_desc: "Капитальные суда Сталинградского класса (проект 82) предназначались для того, чтобы предоставить советскому военно-морскому флоту его главную огневую мощь в эпоху после Второй мировой войны. Они были быстрыми, хорошо вооруженными и хорошо бронированными судами. Строительство началось после войны, но смерть Йозифа Сталина привела к отмене этих кораблей, несмотря на то, что были разработаны проекты, которые должны были завершиться по крайней мере одним модифицированным проектом, оснащенным советскими ракетами V-2."
 SOV_SH_battleship_1: "Класс Советского Союза"
 SOV_SH_battleship_1_desc: "В 1938-43 гг. были спланированы четыре корабля с стандартным смещением 59 000 тонн, три тройные турниры с 406-мм пушками, а также тяжелое вторичное вооружение и вооружение АА. У них также были сильные двигатели для размещения своих очень толстых бронежилетов. Вспышка войны помешала завершению этих кораблей."
 SOV_SH_battleship_2: "Проект 23-бис"
 SOV_SH_battleship_2_desc: "Проект 23-бис был модифицированным и улучшенным вариантом предыдущего класса Советского Союза (проект 23). По сравнению со своими предшественниками, они перевозили четыре тройные турнира из тех же 406-мм калибров пушек, толстые бронежилеты, переработанное расположение вторичного оружия и более сильное вооружение AA."
 SOV_carrier_1: "Класс Исмаила"
 SOV_carrier_1_desc: "Самолет класса Исмаил был непосредственно переоборудован незаконченным корпусом своего боевого круизера класса Бородино. Из-за характера конверсии судно имело толстый бронежилет и сильное противоповерхностное и противоповерхностное вооружение для своего времени. Средняя авиагруппа обеспечивала свой флот необходимым воздушным прикрытием. Проект не был осуществлен из-за расходов и состояния советской судостроения после Октябрьской революции."
 SOV_carrier_2: "Красний Воздух"
 SOV_carrier_2_desc: "Самолет класса &quot; Красний Воздух &quot; был гипотетическим дизайном для обеспечения советского военно-морского проекции на свой флот. &quot; Они были по размеру похожи на &quot; Бритиш Арк Ройял &quot; или &quot; Японский хирю &quot; , но имели дополнительное вторичное оружие против наземных целей и соответствующие пушки АА для воздушного покрытия. &quot; Увеличение бронежилетов &quot; приводит к незначительному сокращению численности авиагруппы по сравнению с этими классами."
 SOV_carrier_3: "Проект 71B"
 SOV_carrier_3_desc: "Проект 71B был разработан в середине 1930-х годов. Они должны были обеспечить воздушное прикрытие для новых наземных флотов Сталина, заказанных в его плане. Два корабля были запланированы на замену около 30 000 тонн, с сильным вооружением АА, хорошими доспехами и достаточной авиагруппой. В результате вторжения Германии было отменено строительство этих судов."
 SOV_carrier_4: "Проект 72"
 SOV_carrier_4_desc: "Проект 72 был улучшен версией предыдущего проекта 71. В начале 1940-х годов были завершены проектно-конструкторские исследования, в результате которых был построен более крупный корабль с тонкими доспехами. Дополнительное пространство было использовано для установки более сильного вооружения AA и создания возможности для перевозки более крупной воздушной группы."
 ### USA - USA ###
 USA_submarine_1: "S Класс"
 USA_submarine_1_desc: "S лодки, известные как Sugar Boats, были серией из 51 подводной лодки и построены в 1920-х годах. В период WW1-территории S лодки были больше, что позволяло больше дальности и больше торпедных перезагрузок, несмотря на то, что в классе было только четыре трубки, обращенные вперед, на расстоянии 21 дюйм. Несмотря на их возраст, последний S-шоу был заказирован в 1924 году, S лодки составляют значительную часть постоянной подводной силы ВМС США."
 #USA_submarine_1b: "Класс барракуда"
 USA_submarine_2: "Класс свинины"
 USA_submarine_2_desc: "Подводная лодка класса Porpoise была первой современной подводной лодкой ВМС США, спроектированной и построенной после серии экспериментов"V Boats" built in the late 20s and early 30s. Despite initial issues with the all-electric propulsion, the class held promise and was being considered as future designs. The class was armed with 6 torpedo tubes and a 3" deck gun."
 #USA_submarine_2b: "Класс лосося"
 USA_submarine_3: "Класс отруба"
 USA_submarine_3_desc: "Класс Тамбора стал кульминацией многолетних экспериментов в военно-морском флоте США по разработке обоих подводных лодок, чтобы соответствовать роли"Fleet Boat" and perform well in the waters of the Pacific Ocean. Armament was upgraded to 10 torpedo tubes with four firing aft, 3" deck gun with two AA guns for additional protection."
 #USA_submarine_3b: "Класс Гато"
 USA_submarine_4: "Класс Балао"
 USA_submarine_4_desc: "Класс Балао был продолжением дизайна, основанного на классе Тамбора."/24 caliber along with numerous subtle design improvements."
 USA_destroyer_1: "Класс Клемсона"
 USA_destroyer_1_desc: "Разрушитель класса Клемсон продолжал с множеством конструктивных элементов своего непосредственного предшественника, класса Wickes."/50 caliber main guns, a 3"/23 caliber AA gun and 12 torpedo tubes. The class was aging and was nearly obsolete, but still comprised the bulk of the US Navy's Destroyer force."
 #USA_destroyer_1b: "Класс Farragut"
 USA_destroyer_2: "Класс Sims"
 USA_destroyer_2_desc: "Класс Симс был самым большим"1500 Tonner" design with a more streamlined torpedo arrangement and longer hull. Improvement in fire control granted better attack capabilities with its 5"/38 caliber guns and included 12 centerline torpedo tubes."
 #USA_destroyer_2b: "Класс Benson & Glevies"
 USA_destroyer_3: "Класс флетчера"
 USA_destroyer_3_desc: "Класс Флетчера представляет собой значительный шаг вперед с точки зрения потенциала эсминцев, главным образом благодаря его увеличению до 2500 тонн."/38 dual purpose guns and centerline torpedo arrangement, the class added an additional single turret and received significant increases in AA weaponry as well as improved range and larger displacement."
 USA_destroyer_4: "Класс Allen M Sumner"
 USA_destroyer_4_desc: "Судно &lt; &lt; Самнер класс &gt; &gt; продолжило движение по классу Флетчера с лишь незначительным увеличением его перемещения."/38 caliber guns and a much larger compliment of AA weaponry. The addition of a second rudder allowed for improve maneuvering during ASW operations."
 USA_light_cruiser_1: "Класс Омахи"
 USA_light_cruiser_1_desc: "Класс Омахи изначально был разработан для того, чтобы заполнить ключевую роль разведчика в флоте ВМС США WW1. Быстрый и способный класс, класс Омахи был вооружен огромной нагрузкой из 6"/53 caliber guns in an 8x1 and 2x2 turret configuration and six torpedo launchers. The Omaha Class was aging but comprised of the bulk of the US Navy's Light Cruiser force."
 USA_light_cruiser_2: "Бруклинский класс"
 USA_light_cruiser_2_desc: "Бруклинский класс был разработан с учетом Вашингтонского военно-морского договора и таким образом был ограничен 6" guns. To maximize firepower, the Brooklyn's was armed with 15 of the new Mk16 6" guns in triple turrets. The overall design was very balanced and was considered as the basis of all future cruiser designs for the US Navy."
 USA_light_cruiser_3: "Класс Кливленда"
 USA_light_cruiser_3_desc: "Класс Кливленда основан на Бруклинском классе, но без ограничений Вашингтонского военно-морского договора." main gun arrangement, but increased its secondary 5" armament greatly and added additional AA weaponry."
 USA_light_cruiser_4: "Класс Фарго"
 USA_light_cruiser_4_desc: "Класс Фарго улучшился на успешном классе Кливленда, он предложил улучшенные поля огня АА благодаря лучше разработанной пирамидальной структуры."
 USA_heavy_cruiser_1: "Класс пенсаколы"
 USA_heavy_cruiser_1_desc: "Класс Пенсаколы был разработан в соответствии с ограничениями Вашингтонского военно-морского договора и стремился максимально увеличить огневую мощь в рамках 8-го класса." gun restriction. It was armed with a formidable armament of 10 x 8"/55 guns. The hull armor was thin and the design was top heavy but capable. It formed the bulk of the US Navy's Heavy Cruiser force."
 #USA_heavy_cruiser_1b: "Класс порта"
 USA_heavy_cruiser_2: "Класс Wichita"
 USA_heavy_cruiser_2_desc: "Корабли класса Wichita улучшили вооружение по сравнению с классом Pensacola и его вариантами с новым дизайном турры для 8"55 caliber guns and improved the fields of fire for its secondary armament of 5"/38 guns. "
 USA_heavy_cruiser_3: "Класс Балтимора"
 USA_heavy_cruiser_3_desc: ""Baltimore Class" собрала более успешные элементы предыдущих крейсеров и была основана в основном из бруклинского лёгкого крейсера, который состоял в браке с вооружением и доспехами из USS Wichita."
 USA_heavy_cruiser_4: "Класс города Орегона"
 USA_heavy_cruiser_4_desc: "Крейсеры класса Орегон обеспечили широкое и незначительное улучшение по сравнению с классом Балтимора, в частности, изменение суперструктуры, которое позволило улучшить поля огня АА. Аналогичные усовершенствования были также найдены от Кливленда до Легких крейсеров класса Орегон Сити."
 USA_battle_cruiser_1: "Класс Лексингтона"
 USA_battle_cruiser_1_desc: "Изначально Lexington Class была реакцией на японский боевой круизер класса Kongo." guns in dual turrets and be capable of 33 knots. After construction began, the US entered into the Washington Naval Treaty and the USS Lexington and USS Saratoga was converted to Carriers."
 USA_battle_cruiser_2: "Класс Аляски"
 USA_battle_cruiser_2_desc: "Класс Аляски был ответом на немецкие карманные боевые корабли сейчас больше, чем японцы."super cruisers." Designed to carry 12" guns and handle up to 10" shell fire, the class was capable of cruiser speeds but sacrificed under water protection."
 USA_battleship_1: "Класс Нью-Йорка"
 USA_battleship_1_desc: "Боевые корабли класса Нью-Йорк были первыми американскими боевыми кораблями, которые были вооружены 14"/45 caliber main guns. Numerous 5"/51 guns provided secondary armament and over 10" of armor."
 #USA_battleship_1b: "Класс Пенсильвании"
 #USA_battleship_1c: "Новый класс в Мексике"
 USA_battleship_2: "Класс Северной Каролины"
 USA_battleship_2_desc: "Класс Северной Каролины был сложным дизайном и был первым катетером, построенным ВМС США за 20 лет."/45 caliber guns and have improved armor while being capable of escorting the US Navy's fast aircraft carriers."
 #USA_battleship_2b: "Класс Южной Дакоты"
 USA_battleship_3: "Класс Айовы"
 USA_battleship_3_desc: "Класс Айовы добавил все новшества и возможности ранее существовавшей Северной Каролины, но значительно увеличил его перемещение и тактические скорости. &lt; &lt; Айова &gt; &gt; отвечала главным образом за сопровождение групп перевозчиков и была разработана со второй ролью:"cruiser killer" in mind."
 USA_battleship_4: "Класс Иллинойса"
 USA_battleship_4_desc: "Класс Иллинойса продолжил проектирование и роль, определенные классом Айова. Он поддерживал скорость и вооружение над доспехами. Иллинойсский класс увеличил число 16."/50 caliber guns from 9 to 12 while it also improved boilers and machinery in order to provide more efficient high cruise speeds. Like the Montana Class, initial designs included four 4 6" guns dual turrets, but this was reverted to the dual purpose 5" twin turret emplacements to maximize AA capabilities."
 USA_carrier_1: "Класс Лексингтона"
 USA_carrier_1_desc: "Компания Lexington Class родилась от переоборудованных корпусов двух боевых круизеров Lexington Class, чтобы соответствовать ограничениям, установленным Вашингтонским морским договором."
 USA_carrier_2: "Класс рейнджеров"
 USA_carrier_2_desc: "Рейнджерский класс был первым классом ВМС США, спроектированным как перевозчик от киля вверх. В рамках концепции меньшего перевозчика ВМС США этот класс был намного меньше предыдущего класса Лексингтона, но все же сохранил тот же комплимент от авиагруппы благодаря усовершенствованию внутренних дизайнов."
 #USA_carrier_2b: "Класс Йорктауна"
 #USA_carrier_2c: "Класс ос"
 USA_carrier_3: "Класс эссекса"
 USA_carrier_3_desc: "С учетом уроков, извлеченных из предыдущих классов вариантов Lexington, Ranger и Yorktown, в результате был создан Esex Class, быстродействующий корабль, способный нести большой комплимент самолетов в бою."
 USA_carrier_4: "Класс на полпути"
 USA_carrier_4_desc: "Класс Мидвея был самым совершенным в военно-морских силах США. &lt; &lt; Мидвей класс &gt; &gt; получил уникальное обозначение подкласса CVB ( &lt; &lt; Боевые суда-перевозчики &gt; &gt; )."
 USA_SH_battleship_1: "Класс Вирджинии"
 USA_SH_battleship_1_desc: "В 1920 году было построено большое судно класса Южная Дакота, занимавшееся полем 12 х 16"/50 guns started. The class would have ushered in a new era in heavy battleship design but was cancelled in 1922 to conform to the Washington Naval Treaty. With the Treaty no longer in effect and the threat of a secret Japanese battleship project we can modernize the design, increase displacement to over 55,000 tons and up gun the design with 18"/50 caliber guns to create a new class of heavy battleship."
 USA_SH_battleship_2: "Класс Монтаны"
 USA_SH_battleship_2_desc: "Класс Монтаны был больше и больше бронежилетов, чем класс Иллинойса, принося в жертву скорость, чтобы учесть увеличение."/50 caliber guns and with our latest fire control system the Montana's firepower will be unmatched. Initial designs included 6" guns, but this was changed to return to the dual purpose 5" twin turret emplacements."
 ### ALB - ALBANIA -- all generic ###
 ### ARG - ARGENTINA ###
 ARG_submarine_1: "Класс &lt; &lt; Санта Фе &gt; &gt;"
 ARG_submarine_1_desc: "Класс класса Санта-Фе представляет три подводные лодки, заказанные из Италии и доставленные в Аргентину в 1933 году, три корабля этого класса составляли позвоночник Аргентинских подводных сил до 1960 года, которые назывались «Тарантино» для верфи в Таранто, Италия, где они были построены."
 ARG_destroyer_1: "Катамарка Класс"
 ARG_destroyer_1_desc: "Эсминцы класса &quot; Катамарка &quot; были заказаны аргентинскими военно-морскими силами и построены Соединенным Королевством незадолго до Первой мировой войны. Они были вооружены четырьмя 120-мм пушками и четырьмя 533-мм торпедными трубами."
 #ARG_destroyer_1b: "Класс сервантесов"
 ARG_destroyer_2: "Класс Буэнос-Айреса"
 ARG_destroyer_2_desc: "В 1936-1938 годах в Аргентине были построены эсминцы класса Буэнос-Айрес, базирующиеся на британских эсминцев класса G. Они переместились более чем на 1300 тонн и были вооружены четырьмя QF 4.7."
 ARG_light_cruiser_1: "Класс &lt; &lt; Либертад &gt; &gt;"
 ARG_light_cruiser_1_desc: "Корабли класса «Либертад» получили название «Корабль Ривера», но на самом деле были более сопоставимы с небольшими, более легко вооруженными крейсерами начала 1900-х годов. Два корабля класса были построены в конце 1890-х годов и все еще находились в эксплуатации в начале Второй мировой войны."
 ARG_light_cruiser_2: "Класс &lt; &lt; Ла Аргентина &gt; &gt;"
 ARG_light_cruiser_2_desc: "Легкий крейсер La Argentina был построен для Аргентины Соединенным Королевством в конце 1930-х годов, она совершила несколько тренировочных круизов до войны, но была помещена в активную эскадрилью для поддержания нейтралитета Аргентины."
 ARG_heavy_cruiser_1: "Класс Гарибальди"
 ARG_heavy_cruiser_1_desc: "Класс Гарибальди представляет собой класс бронированных крейсеров, построенных для Аргентины около конца века. Все они устарели к середине 1930-х годов, последний из которых был списан к 1932 году. В 1931 году они были заменены английскими крейсерами класса Veinticinco de Mayo."
 #ARG_heavy_cruiser_1b: "Класс Veinticinco de Mayo"
 ARG_battleship_1: "Класс Ривадавии"
 ARG_battleship_1_desc: "В начале 1910-х годов класс Ривадавии был построен в Соединенных Штатах как пара страшных боевых кораблей, которые были построены для аргентинского флота, они переместили 27 500 тонн и были вооружены 12 305-миллиметровыми пулеметами."
 ### AST - AUSTRALIA ###
 AST_submarine_1: "L Класс"
 AST_submarine_1_desc: "Класс L был среднегабаритными лодками, первоначально запланированными в рамках программы чрезвычайных военных действий в качестве усовершенствованной версии предыдущих классов подводных лодок. Они были построены на поздних этапах Первой мировой войны и оснащены новыми, более крупными 21 торпедами. Они служили до начала Второй мировой войны, когда они в основном использовались для выполнения вспомогательных и учебных обязанностей."
 AST_submarine_2: "Класс"
 AST_submarine_2_desc: "Корабли класса Т или класса Тритон были спроектированы для замены крупных подводных лодок класса О, Р и Р. Это были умеренно крупные подводные лодки с большим радиусом действия, хорошо приспособленные для Атлантического и Тихого океанов. Эти лодки были хорошо вооружены, стабильны и широко использовались во время конфликта, поскольку 25 процентов построенных лодок были потеряны во время войны."
 AST_submarine_3: "U Класс"
 AST_submarine_3_desc: "Класс U был небольшими подводными лодками, построенными в рамках программ чрезвычайных ситуаций 1940 года и 1941 года. Изначально они были спроектированы как тренировочные подводные лодки по мере начала войны, дизайн изменился, что позволило этим подводным лодкам оказаться полезными в замкнутых водах Северного моря и Средиземноморья. Из-за их меньшего размера их дальность и оружие были ограничены. Три подкласса составляли класс Ундин, Умпир и Упроар."
 AST_submarine_4: "V Класс"
 AST_submarine_4_desc: "Подводные лодки класса V или вампирского класса основывались на предыдущих малогабаритных лодках класса U. Они были более крупными, но все же относительно небольшими, с более высокой пропускной способностью на море, но с ограниченной оперативной дальностью и оружием."
 AST_destroyer_1: "Класс Вендетты"
 AST_destroyer_1_desc: "В число этих эсминцев входили адмиралты и классы Tornycroft V и W, которые были переведены в RAN, чтобы сформировать "Scrap Iron Flotila". Они были построены в рамках программы чрезвычайных военных действий. Они были конечной эволюцией британского эсминца во время Первой мировой войны, воплощавшей улучшения их предшественников, а также новые технологические достижения. Большое число этих кораблей было построено на поздних этапах WWI и впоследствии стало основой эсминических флотов Королевского флота. Начиная с 1930-х годов они были помещены в резервные флоты, которые в конечном итоге использовались для сопровождения конвоев. Они были надлежащим образом вооружены, быстро двигались с хорошим радиусом действия."
 AST_destroyer_2: "Класс G/H/I"
 AST_destroyer_2_desc: "Разрушители классов G, H и I были заказаны в рамках военно-морских строительных программ 1933 и 1934 годов. Они, как правило, повторялись в предыдущем классе F, с небольшим сокращением размера. Боеприпасы в классах G и H были такими же, как и в классе F, оба из которых использовали 4,7 в. пушки. Эти корабли имели дальний радиус действия, были достаточно вооружены и имели сильный торпедный компонент. Они широко использовались во время войны и понесли многочисленные потери."
 #AST_destroyer_2b: "Класс Arunta"
 AST_destroyer_3: "Класс Nizam"
 AST_destroyer_3_desc: "Класс Nizam был назван эсминцами класса J, K и N, переведенными из RN. Они были похожи на предыдущие классы племени, но вместо того, чтобы акцентировать оружие, дизайнеры вернулись на более стандартную торпеду и легкое оружие. Корабли были модифицированы на протяжении всей их военной службы. Модернизация включала усовершенствование зенитных орудий и радаров. Они были быстрыми, дальними и хорошо вооруженными судами, идеальными для сопровождения флота."
 AST_destroyer_4: "Боевой класс"
 AST_destroyer_4_desc: "Разрушители боевого класса строились на эволюции британских эсминцев, использовавшихся во время войны. Корабли были заказаны в рамках военно-морских программ 1942 и 1943 годов. Они были хорошо вооружены как с точки зрения их оружия, так и с точки зрения их торпед."
 #AST_destroyer_4b: "Класс Тобрука"
 AST_light_cruiser_1: "C Класс."
 AST_light_cruiser_1_desc:1 "Легкие крейсеры класса С представляли собой группу из 28 лёгких крейсеров Королевского флота, которые были построены до и во время Первой мировой войны для тяжелых условий в Северном море. Они были накачанными и способными к эксплуатации судами, несмотря на то, что они были несколько небольшими и узкими. Их вооружения были более чем удовлетворительными, поскольку они перевозили в них шесть единиц оружия для борьбы с наземными целями противника и тяжелой торпедой. Они видели широкое применение во время WWI и участвовали во многих действиях на поверхности. К середине 1930-х годов в эксплуатации находились только подклассы Каледона, Сереса и Карлайла."
 #AST_light_cruiser_1c: "Сиднейский класс"
 AST_light_cruiser_2: "Класс Саутгемптона"
 AST_light_cruiser_2_desc: "Легкие крейсеры класса Саутгемптон были подклассом крейсеров городского класса и предназначались для борьбы с японскими крейсерами класса Могами. Эти суда были хорошо бронированы, имели хорошую скорость и дальность движения и несли огромные вооружения в количестве 12 6 единиц."
 AST_light_cruiser_3: "Класс королевской колонии"
 AST_light_cruiser_3_desc: "Легкие крейсеры класса "Корона Колония" были улучшены версий предыдущего городского класса, но с упрощенным дизайном для ускорения строительства и снижения издержек. Королевы несли те же пушки, что и их предшественники, четыре тройные турниры, в которых было 6 пушек. Они были аналогичным образом бронированы, но из-за их небольших двигателей их диапазон был несколько уменьшен."
 AST_light_cruiser_4: "Класс минотавров"
 AST_light_cruiser_4_desc: "Эти крейсеры были спроектированы как модифицированная версия класса королевской колонии, включая военные изменения, которые были санкционированы в 1941 году. Они имели более широкий оперативный диапазон и более большое количество оружия АА, чем класс королевской колонии, в то время как основное вооружение было сокращено до трех тройных турниров."
 AST_heavy_cruiser_1: "Класс Hawkins"
 AST_heavy_cruiser_1_desc: "Крейсеры класса Хокинс были первыми в мире тяжелыми крейсерами. Они были основаны на более ранних легких крейсерах городского класса, в частности на подклассе Бирмингема, но были оснащены 7,5 в. пушки и более толстым бронепоясом. Они были предназначены для борьбы с крупными рейдерами в Германии. Они были хорошо вооружены, имели разумную скорость и дальность и хорошую защиту. В общей сложности пять кораблей были заказаны, но только четыре были активированы в начале WWII."
 #AST_heavy_cruiser_1b: "Канберрский класс"
 AST_heavy_cruiser_2: "Суррейский класс"
 AST_heavy_cruiser_2_desc: "В рамках морской программы 1928 года были предложены тяжелые крейсеры класса &quot; Суррей &quot; , улучшенные версии более ранних крейсеров Йоркского класса. Если бы они были завершены, они были бы оснащены четырьмя восемью близнецами, ружьями, более тяжелыми доспехами и более мощными двигателями. Два корабля были заказаны, но ни один из них не был сложен."
 AST_heavy_cruiser_3: "Адмирал Класс"
 AST_heavy_cruiser_3_desc: "Тяжелые крейсеры адмирального класса (не следует путать с боевыми круизами адмирального класса) были последней попыткой Королевского ВМС спроектировать и построить крейсеры с 8 пушками. Проектирование началось в 1938 году и завершилось в 1941 году, в результате чего были выдвинуты различные предложения."
 AST_heavy_cruiser_4: "Черчилль Дизайн"
 AST_heavy_cruiser_4_desc: "Эти корабли были предложены сэром Уинстоном Черчиллем, лордом Адмиралии, на ранних этапах Второй мировой войны, чтобы противостоять крупным крейсерам немецкого класса Deutschland. Эти суда имели бы 9,2 пушек, тяжелые АА и мощные бронежилеты. Они были предназначены для эффективной борьбы с вражескими столицами. В конечном счете, корабли были отменены из-за высоких расходов и отсутствия спроса на новый тяжелый крейсер."
 AST_battle_cruiser_1: "Реномерный класс"
 AST_battle_cruiser_1_desc: "Боевые круизеры класса Renown были изначально заложены в качестве улучшенных версий боевых кораблей класса Revenge. Их строительство было приостановлено в начале WWI. Адмирал Лорд Фишер смог возобновить их строительство в качестве боевых круизеров. Эти корабли были квинтуозным боевиком. Они были хорошо вооружены, быстро и маневрируемы, но имели тонкие доспехи и более короткий оперативный диапазон. Было завершено строительство только двух из первых трех кораблей - Repulse и Renown."
 AST_battle_cruiser_2: "Королевский класс принцессы"
 AST_battle_cruiser_2_desc: "Принцесса Роял была классом гипотетических боевых круизеров, которые представляли собой более быструю и дешевую версию боевых кораблей класса Кинг Джордж V. Эти суда имели аналогичное, но сокращенное вооружение как для наземных, так и для противовоздушных боёв: два из 14 пушек и шесть близнецов 5,25 в. Пушки AA. Их быстрая скорость и дальность обеспечили бы Королевским ВМС возможности для быстрого удара и защиты конвоев, но их ограниченные доспехи были бы проблематичны, если бы им пришлось бороться с современными боевыми кораблями."
 AST_battleship_1:1 "Класс мести"
 AST_battleship_1_desc:1 "В 1913 году были заказаны боевые корабли класса Месть в качестве дешевых версий королевы Елизаветы. В то время как они также были вооружены и бронированы, их скорость была значительно ниже, и они были вынуждены выполнять второстепенные функции во время Второй мировой войны. Из 8 предусмотренных кораблей класса только 5 были завершены."
 AST_battleship_2: "Класс короля Георга V"
 AST_battleship_2_desc: "В 1922 и 1930 годах были заключены первые договоры о военно-морском флоте, которые ограничивали максимальное перемещение и стрельбу столиц. Таким образом, эти корабли были оснащены меньшекалиберными пушками, чем ранее, и даже современными боевыми кораблями. Несмотря на меньший калибр, корабли были достаточно вооружены, несли сильное оружие АА и имели надлежащую защиту. Пять кораблей были заказаны и заложены в качестве замены старым кораблям класса королевы Елизаветы."
 AST_battleship_3: "Класс льва"
 AST_battleship_3_desc: "Боевые корабли класса "Львов" были последующим классом к королю Георгу V с множеством их особенностей. Шесть кораблей были заказаны в военно-морской программе 1938 года, чтобы заменить стареющие боевые корабли класса "Мстить", но ни один из них не был закончен из-за вспыхнувших боевых действий. Эти корабли были бы общими, как и к королю Джорджу, но основные вооружения были бы тяжелее, введя новые 16 в. пушки. У них также были бы более толстые брони и более мощные двигатели."
 AST_battleship_4: "Класс авангарда"
 AST_battleship_4_desc: "Боевой корабль класса &lt; &lt; Вангард &gt; &gt; был последним катетером, который был построен для Королевского флота. &lt; &lt; Один корабль &gt; &gt; был заказован, но еще четыре корабля были рассмотрены для тихоокеанского театра. &lt; &lt; Заказ &gt; &gt; в рамках программы &lt; &lt; Экстренная война 1940 года &gt; &gt; , строительство не получило первоочередного внимания и было завершено после войны. &lt; &lt; Класс &gt; &gt; имел &lt; &lt; слайд &gt; &gt; , что обеспечило прекрасную стабильность и мореходность. &lt; &lt; Оружие &gt; &gt; было таким же, как и корабли класса &lt; &lt; Королева Елизавет &gt; &gt; и &lt; &lt; &lt; &lt; Ревен &gt; &gt; &gt; , которые обеспечили значительную огненную мощь."
 AST_SH_battleship_1: "Класс центуриона"
 AST_SH_battleship_1_desc: "Центурион был классом гипотетических тяжелых боевых кораблей Королевского ВМС, построенных для борьбы с крупными судами немецких и японских морских судов. 18 больших ружей и толстых бронежилетов обеспечивают корабль необходимой огневой мощью и защитой для борьбы с этими кораблями. Сильные вооружения АА, большие расстояния и хорошая скорость были необходимы для охвата обширных морей Британской империи."
 AST_SH_battleship_2: "Львиный II класс"
 AST_SH_battleship_2_desc: "Боевые корабли класса "Лион II" были спроектированы в 1944 году как улучшенная версия предыдущего боевого корабля класса "Лион". Включая уроки военного времени, этот проект был больше и тяжелее, и в случае его завершения он будет перевозить три или четыре тройных 16 ружей последнего типа. Толстые бронежилеты защищали корабль от любых поверхностных или воздушных врагов. Расходы на строительство этих кораблей, поражение вражеских мореплавателей и необходимость в авиаперевозчиках привели к отказу от проекта."
 AST_carrier_1: "Мужественный класс"
 AST_carrier_1_desc: "Эти три авианосца были переоборудованы в боевые круизеры и были первыми авианосцами Королевского военно-морского флота, которые были преобразованы в результате заключения Вашингтонского военно-морского договора 1922 года и завершения работ в 1925 году."
 AST_carrier_2: "Ковчег Королевского класса"
 AST_carrier_2_desc: "В 1934 году судно было хорошо бронетранспортировано и вооружено, на нем находилось большое количество воздушных судов и была обеспечена достаточная оперативная дальность и скорость для того, чтобы успевать за основными силами Королевского флота."
 AST_carrier_3: "Яркий класс"
 AST_carrier_3_desc: "Иллюстрированный класс был разработан в соответствии с ограничениями второго Лондонского договора о военно-морском флоте 1936 года, который ограничил размер перевозчика верхним пределом в 23 000 тонн. Она была первой британской авиакомпанией, которая имела бронированную полетную палубу, которая сократила размер авиагруппы. Тяжелые бронежилеты и вооружения АА обеспечили прочную защиту для судов, в то время как мощные двигатели и большой топливный склад дали судам большой оперативный радиус."
 AST_carrier_4: "Неукрепляемый класс"
 AST_carrier_4_desc: "Самолеты закрытого класса были заказаны в соответствии с Морской программой 1938 года и были в основном улучшены версий предыдущего класса Illustruction. &quot; Война &quot; и перенос приоритета на более мелкие суда для обеспечения защиты автоколонн на ранних и средних этапах войны замедлили ограничение этих судов; они были более крупными судами, способными перевозить больше самолетов при сохранении толстой брони как на корпусе, так и на палубе полета. &quot; Более мощные &quot; двигатели обеспечили им более высокую скорость и оперативный диапазон по сравнению с классом Illustrective &quot; ."
 ### BEL - BELGIUM -- all generic ###
 ### BRA - BRAZIL ###
 BRA_submarine_1: "Класс &lt; &lt; Хумайта &gt; &gt;"
 BRA_submarine_1_desc: "Бразильская подводная лодка &lt; &lt; Хумайта &gt; &gt; была заказана из Италии и доставлена в конце 1920-х годов, была разработана как модифицированный класс &lt; &lt; Балилла &gt; &gt; , который был задуман как глубоководный водолаз. &lt; &lt; Хумайта &gt; &gt; переместила почти 1400 тонн и вооружена шестью 533-мм торпедными трубами."
 BRA_submarine_2: "Класс тупицы"
 BRA_submarine_2_desc: "Класс Тупи был классом бразильских подводных лодок, построенных Италией в середине 1930-х годов."
 BRA_destroyer_1: "Класс Марньяна"
 BRA_destroyer_1_desc: "Марньян — эсминец британского класса K, который был продан Бразилии в 1922 году."
 BRA_destroyer_2: "Класс &lt; &lt; Юруена &gt; &gt;"
 BRA_destroyer_2_desc: "Эсминцы класса &lt; &lt; Юруена &gt; &gt; были серией из шести эсминцев класса &lt; &lt; Н &gt; &gt; , заказанных Бразилией из Великобритании в конце 1930-х годов. Корабли так и не были доставлены, поскольку британцы реквизировали их, когда в 1939 году началась война. Они переместились более чем на 1300 тонн, имели хорошую скорость и были вооружены тремя QF 4.7."
 BRA_destroyer_3: "Класс Марсело Диаса"
 BRA_destroyer_3_desc: "Разрушители класса Marsilio Dias (иногда именуемые как M-класс, или Greenhalgh класс) были тремя кораблями бразильских ВМС, которые были заказаны в 1943 году."
 BRA_destroyer_4: "Класс акр"
 BRA_destroyer_4_desc: "Класс Acre (иногда именуемый классом Amazonas) представляет собой шесть эсминцев, построенных для бразильских ВМС. Ни один из них не был завершен до окончания войны. Корабли были построены в Бразилии с использованием модифицированного британского дизайна и некоторого оборудования США для замены шести эсминцев класса Juruena, реквизитированных Великобританией в начале войны."
 BRA_light_cruiser_1: "Класс Баия"
 BRA_light_cruiser_1_desc: "Класс Баия был классом двух британских крейсеров-скаутов, которые были построены для Бразилии и доставлены в 1910 году. В 1920-х годах корабли были сильно переоборудованы и модернизированы, но к началу Второй мировой войны все еще были относительно устаревшими. Во время войны крейсеры в основном выполняли обязанности конвоя."
 BRA_battleship_1: "Класс Minas Gerais"
 BRA_battleship_1_desc: "Minas Gerais был классом из двух страшных боевых кораблей, построенных Соединенным Королевством для Бразилии в начале 1900-х годов. Они были активными во время Второй мировой войны, но слишком устаревшими для выполнения каких-либо серьезных обязанностей, вместо этого использовались в качестве кораблей береговой обороны вдоль бразильского побережья."
 ### BUL - BULGARIA -- all generic ###
 ### CAN - CANADA ###
 CAN_submarine_1: "L Класс"
 CAN_submarine_1_desc: "Класс L был среднегабаритными лодками, первоначально запланированными в рамках программы чрезвычайных военных действий в качестве усовершенствованной версии предыдущих классов подводных лодок. Они были построены на поздних этапах Первой мировой войны и оснащены новыми, более крупными 21 торпедами. Они служили до начала Второй мировой войны, когда они в основном использовались для выполнения вспомогательных и учебных обязанностей."
 CAN_submarine_2: "Класс"
 CAN_submarine_2_desc: "Корабли класса Т или класса Тритон были спроектированы для замены крупных подводных лодок класса О, Р и Р. Это были умеренно крупные подводные лодки с большим радиусом действия, хорошо приспособленные для Атлантического и Тихого океанов. Эти лодки были хорошо вооружены, стабильны и широко использовались во время конфликта, поскольку 25 процентов построенных лодок были потеряны во время войны."
 CAN_submarine_3: "U Класс"
 CAN_submarine_3_desc: "Класс U был небольшими подводных лодками, построенными в рамках чрезвычайных военных программ 1940 и 1941 годов. Изначально спроектированными как тренировочные подводные лодки по мере начала войны, проект был изменен, что позволило этим подводным лодкам оказаться полезными в замкнутых водах Северного моря и Средиземноморья. Из-за их меньшего размера их дальность и оружие были ограничены. Три подкласса составляли класс: Undine, Umpire и Uproar."
 CAN_submarine_4: "V Класс"
 CAN_submarine_4_desc: "Подводные лодки класса V или вампирского класса основывались на предыдущих малогабаритных лодках класса U. Они были более крупными, но все же относительно небольшими, с более высокой пропускной способностью на море, но с ограниченной оперативной дальностью и оружием."
 CAN_destroyer_1: "V/W Класс"
 CAN_destroyer_1_desc: "Эти эсминцы включали в себя адмирализацию и классы Tornycroft V и W. Они были построены в рамках программы чрезвычайных военных действий. Они были конечной эволюцией британского эсминца во время Первой мировой войны, воплощавшей в себе усовершенствования их предшественников, а также новые технологические достижения. Большое число этих кораблей было построено на поздних этапах WWI и впоследствии стало краеугольным камнем эсминных флотов Королевского флота. Начиная с 1930-х годов они были размещены в резервных флотах, которые в конечном итоге использовались для сопровождения конвоя. Они были достаточно вооружены, быстрые суда с хорошим радиусом действия."
 #CAN_destroyer_1b: "Класс сангении"
 CAN_destroyer_2: "Оттавский класс"
 CAN_destroyer_2_desc: "Оттавский класс был канадским названием для британских эсминцев класса G, H и I, заказанных в рамках военно-морских строительных программ 1933 и 1934 годов. Они, как правило, повторялись в предыдущем классе F с небольшим сокращением размера. Боеприпасы в классах G и H были такими же, как и в классе F, причем оба они использовали 4,7 в. пушки. Эти суда имели дальний радиус действия, были достаточно вооружены и имели сильный торпедный компонент. Они широко использовались во время войны и понесли многочисленные потери."
 #CAN_destroyer_2b: "Класс атабаскана"
 CAN_destroyer_3: "Класс J/K/N"
 CAN_destroyer_3_desc: "Классы J, K и N были аналогичны предыдущим классам племени, но вместо того, чтобы делать упор на оружие, дизайнеры вернулись к более стандартной тяжелой торпеде и более легкой ружейной установке. Корабли были модифицированы на протяжении всей их военной службы. Модернизация включала усовершенствование зенитных орудий и радаров. Они были быстрыми, дальними и хорошо вооруженными судами, идеальными для сопровождения флота."
 CAN_destroyer_4: "Класс Algonkin"
 CAN_destroyer_4_desc: "Класс Algonkin был канадцем британских истребителей боевого класса. Корабли были заказаны в рамках военно-морских программ 1942 и 1943 годов. Они были хорошо вооружены как с точки зрения оружия, так и с точки зрения их торпед. Их боевой потенциал, скорость и дальность сделали их разносторонними судами. Их позднее вступление в войну привело к минимальному вкладу."
 CAN_light_cruiser_1: "C Класс."
 CAN_light_cruiser_1_desc: "Легкие крейсеры класса С представляли собой группу из 28 лёгких крейсеров Королевского флота, которые были построены до и во время Первой мировой войны для тяжелых условий в Северном море. Они были накачанными и способными к эксплуатации судами, несмотря на то, что они были несколько небольшими и узкими. Их вооружения были более чем удовлетворительными, поскольку они перевозили в них шесть единиц оружия для борьбы с наземными целями противника и тяжелой торпедой. Они видели широкое применение во время WWI и участвовали во многих действиях на поверхности. К середине 1930-х годов в эксплуатации находились только подклассы Каледона, Сереса и Карлайла."
 CAN_light_cruiser_2: "Класс Саутгемптона"
 CAN_light_cruiser_2_desc: "Легкие крейсеры класса Саутгемптон были подклассом крейсеров городского класса и предназначались для борьбы с японскими крейсерами класса Могами. Эти суда были хорошо бронированы, имели хорошую скорость и дальность движения и несли огромные вооружения в количестве 12 6 единиц."
 CAN_light_cruiser_3: "Класс Квебека"
 CAN_light_cruiser_3_desc: "Класс Квебека был канадским названием для британских крейсеров класса "Королевская колония". Это были улучшенные версии предыдущего городского класса, но с упрощенным дизайном для ускорения строительства и снижения издержек. Корабли перевозили те же пушки, что и их предшественники, четыре тройные турниры, в которых было 6 стволов. Они были аналогичным образом бронированы, но из-за их меньшего количества двигателей их диапазон был несколько уменьшен."
 CAN_light_cruiser_4: "Класс Онтарио"
 CAN_light_cruiser_4_desc: "Класс Онтарио был канадским названием для британских крейсеров класса Минотавров (или Swiftsure-class). Эти крейсеры были спроектированы как модифицированная версия класса королевской колонии, включая военные изменения, которые были разрешены в 1941 году. Они имели более широкий оперативный диапазон и более большое количество оружия AA, чем класс королевской колонии, в то время как основное вооружение было сокращено до трех тройных турниров."
 CAN_heavy_cruiser_1: "Класс Hawkins"
 CAN_heavy_cruiser_1_desc: "Крейсеры класса Хокинс были первыми в мире тяжелыми крейсерами. Они были основаны на более ранних легких крейсерах городского класса, в частности на подклассе Бирмингема, но были оснащены 7,5 в. пушки и более толстым бронепоясом. Они были предназначены для борьбы с крупными рейдерами в Германии. Они были хорошо вооружены, имели разумную скорость и дальность и хорошую защиту. В общей сложности пять кораблей были заказаны, но только четыре были активированы в начале WWII."
 CAN_heavy_cruiser_2: "Суррейский класс"
 CAN_heavy_cruiser_2_desc: "В рамках морской программы 1928 года были предложены тяжелые крейсеры класса &quot; Суррей &quot; , улучшенные версии более ранних крейсеров Йоркского класса. Если бы они были завершены, они были бы оснащены четырьмя восемью близнецами, ружьями, более тяжелыми доспехами и более мощными двигателями. Два корабля были заказаны, но ни один из них не был сложен."
 CAN_heavy_cruiser_3: "Адмирал Класс"
 CAN_heavy_cruiser_3_desc: "Тяжелые крейсеры адмирального класса (не следует путать с боевыми круизами адмирального класса) были последней попыткой Королевского ВМС спроектировать и построить крейсеры с 8 пушками. Проектирование началось в 1938 году и завершилось в 1941 году, в результате чего были выдвинуты различные предложения."
 CAN_heavy_cruiser_4: "Черчилль Дизайн"
 CAN_heavy_cruiser_4_desc: "Эти корабли были предложены сэром Уинстоном Черчиллем, лордом Адмиралии, на ранних этапах Второй мировой войны, чтобы противостоять крупным крейсерам немецкого класса Deutschland. Эти суда имели бы 9,2 пушек, тяжелые АА и мощные бронежилеты. Они были предназначены для эффективной борьбы с вражескими столицами. В конечном счете, корабли были отменены из-за высоких расходов и отсутствия спроса на новый тяжелый крейсер."
 CAN_battle_cruiser_1: "Реномерный класс"
 CAN_battle_cruiser_1_desc: "Боевые круизеры класса Renown были изначально заложены в качестве улучшенных версий боевых кораблей класса Revenge. Их строительство было приостановлено в начале WWI. Адмирал Лорд Фишер смог возобновить их строительство в качестве боевых круизеров. Эти корабли были квинтуозным боевиком. Они были хорошо вооружены, быстро и маневрируемы, но имели тонкие доспехи и более короткий оперативный диапазон. Было завершено строительство только двух из первых трех кораблей - Repulse и Renown."
 CAN_battle_cruiser_2: "Королевский класс принцессы"
 CAN_battle_cruiser_2_desc: "Принцесса Роял была классом гипотетических боевых круизеров, которые представляли собой более быструю и дешевую версию боевых кораблей класса Кинг Джордж V. Эти суда имели аналогичное, но сокращенное вооружение как для наземных, так и для противовоздушных боёв: два из 14 пушек и шесть близнецов 5,25 в. Пушки AA. Их быстрая скорость и дальность позволили бы Королевским ВМС быстро нанести удар и защитить конвой, но их ограниченные доспехи были бы проблематичны, если бы им пришлось бороться с современными боевыми кораблями."
 CAN_battleship_1:1 "Класс мести"
 CAN_battleship_1_desc:1 "В 1913 году были заказаны боевые корабли класса Месть в качестве дешевых версий королевы Елизаветы. В то время как они также были вооружены и бронированы, их скорость была значительно ниже, и они были вынуждены выполнять второстепенные функции во время Второй мировой войны. Из 8 предусмотренных кораблей класса только 5 были завершены."
 CAN_battleship_2: "Класс короля Георга V"
 CAN_battleship_2_desc: "В 1922 и 1930 годах были заключены первые договоры о военно-морском флоте, которые ограничивали максимальное перемещение и стрельбу столиц. Таким образом, эти корабли были оснащены меньшекалиберными пушками, чем ранее, и даже современными боевыми кораблями. Несмотря на меньший калибр, корабли были достаточно вооружены, несли сильное оружие АА и имели надлежащую защиту. Пять кораблей были заказаны и заложены в качестве замены старым кораблям класса королевы Елизаветы."
 CAN_battleship_3: "Класс льва"
 CAN_battleship_3_desc: "Боевые корабли класса "Львов" были последующим классом к королю Георгу V с множеством их особенностей. Шесть кораблей были заказаны в военно-морской программе 1938 года, чтобы заменить стареющие боевые корабли класса "Мстить", но ни один из них не был закончен из-за вспыхнувших боевых действий. Эти корабли были бы общими, как и к королю Джорджу, но основные вооружения были бы тяжелее, введя новые 16 в. пушки. У них также были бы более толстые брони и более мощные двигатели."
 CAN_battleship_4: "Класс авангарда"
 CAN_battleship_4_desc: "Боевой корабль класса &quot; Вангард &quot; был последним катетером, который был построен для Королевского флота. &quot; Было заказано одно судно, но еще четыре корабля были рассмотрены для тихоокеанского театра &quot; . &quot; В соответствии с программой чрезвычайных военных действий 1940 года &quot; строительство не получило приоритетного внимания и было завершено после войны. &quot; Класс &quot; имел скрытый корпус, который обеспечил ему прекрасную стабильность и мореходность. &quot; Оружие &quot; было таким же, как и боевые корабли класса королева Елизавета и &quot; Месть &quot; , обеспечившие значительную огневую мощь. &quot; Сильные двигатели и хорошие доспехи &quot; сделали судно быстрым и хорошо защищенным."
 CAN_SH_battleship_1: "Класс центуриона"
 CAN_SH_battleship_1_desc: "Центурион был классом гипотетических тяжелых боевых кораблей Королевского ВМС, построенных для борьбы с крупными судами немецких и японских морских судов. 18 больших ружей и толстых бронежилетов обеспечивают корабль необходимой огневой мощью и защитой для борьбы с этими кораблями. Сильные вооружения АА, большие расстояния и хорошая скорость были необходимы для охвата обширных морей Британской империи."
 CAN_SH_battleship_2: "Львиный II класс"
 CAN_SH_battleship_2_desc: "Боевые корабли класса "Лион II" были спроектированы в 1944 году как улучшенная версия предыдущего боевого корабля класса "Лион". Включая уроки военного времени, этот проект был больше и тяжелее, и в случае его завершения он будет перевозить три или четыре тройных 16 ружей последнего типа. Толстые бронежилеты защищали корабль от любых поверхностных или воздушных врагов. Расходы на строительство этих кораблей, поражение вражеских мореплавателей и необходимость в авиаперевозчиках привели к отказу от проекта."
 CAN_carrier_1: "Мужественный класс"
 CAN_carrier_1_desc: "Эти три авианосца были переоборудованы в боевые круизеры и были первыми авианосцами Королевского военно-морского флота, которые были преобразованы в результате заключения Вашингтонского военно-морского договора 1922 года и завершения работ в 1925 году."
 CAN_carrier_2: "Ковчег Королевского класса"
 CAN_carrier_2_desc: "В 1934 году судно было хорошо бронетранспортировано и вооружено, на нем находилось большое количество воздушных судов и была обеспечена достаточная оперативная дальность и скорость для того, чтобы успевать за основными силами Королевского флота."
 CAN_carrier_3: "Яркий класс"
 CAN_carrier_3_desc: "Иллюстрированный класс был разработан в соответствии с ограничениями второго Лондонского договора о военно-морском флоте 1936 года, который ограничил размер перевозчика верхним пределом в 23 000 тонн. Она была первой британской авиакомпанией, которая имела бронированную полетную палубу, которая сократила размер авиагруппы. Тяжелые бронежилеты и вооружения АА обеспечили прочную защиту для судов, в то время как мощные двигатели и большой топливный склад дали судам большой оперативный радиус."
 CAN_carrier_4: "Неукрепляемый класс"
 CAN_carrier_4_desc: "Самолеты закрытого класса были заказаны в соответствии с Морской программой 1938 года и были в основном улучшены версий предыдущего класса Illustruction. &quot; Война &quot; и перенос приоритета на более мелкие суда для обеспечения защиты автоколонн на ранних и средних этапах войны замедлили ограничение этих судов; они были более крупными судами, способными перевозить больше самолетов при сохранении толстой брони как на корпусе, так и на палубе полета. &quot; Более мощные &quot; двигатели обеспечили им более высокую скорость и оперативный диапазон по сравнению с классом Illustrective &quot; ."
 ### CHI - NATIONALIST CHINA ###
 CHI_destroyer_1: "Класс Jianwei"
 CHI_destroyer_1_desc: "Класс Цзяньвей был классом больших торпедных катеров, построенных для военно-морских сил Китая в 1904 году, два корабля этого класса были модернизированы и все еще находились в эксплуатации во время японского вторжения, после чего они переместили 870 тонн и были вооружены двумя 4,7 калибра."
 CHI_light_cruiser_1: "Класс волос"
 CHI_light_cruiser_1_desc: "В конце 1890-х годов в Германии был построен китайский защищенный крейсер, который был похож на другие защищенные крейсеры и последующие лёгкие крейсеры, произведенные в Китае около конца века."
 ### CHL - CHILE ###
 CHL_submarine_1: "H Класс"
 CHL_submarine_1_desc: "Эти подводные лодки состояли из шести британских H-классов, или Голландии 602, подводных лодок, построенных в Великобритании и перевезенных в Чили вскоре после Первой мировой войны в обмен на подводных лодки, которые были погребены во время войны. Корабли были построены между 1915 и 1918 годами. Они переместились более чем на 360 тонн, имели глубину ныряния 30 метров и были вооружены четырьмя 450-мм торпедными трубами."
 #CHL_submarine_1b: "Класс капитана О'Брайена"
 CHL_destroyer_1: "Класс альмиранты Линч"
 CHL_destroyer_1_desc: "Эсминцы класса Альмирант Линч были группой из шести кораблей, которые были построены для чилийских ВМС в Великобритании непосредственно перед Первой мировой войной. До начала войны и служили до 1945 года только два корабля. Они переместили 1430 тонн, имели достойную скорость и дальность для своего винтажа и были вооружены шестью четырьмя пулеметами L/40 QF Марк VI и двумя 21 торпедными трубами."
 #CHL_destroyer_1b: "Класс Серрано"
 CHL_light_cruiser_1: "Класс &quot; Чакабуко &quot;"
 CHL_light_cruiser_1_desc: "Чакабуко был защищенным крейсером, который был построен в Британии и заказан для чилийских ВМС в 1902 году."
 CHL_heavy_cruiser_1: "Класс О'Хиггинс"
 CHL_heavy_cruiser_1_desc: "О'Хиггинс был бронированным крейсером, построенным в Великобритании в конце XX века для чилийского флота. 7 800 тонн было перевезено, 4 8 тонн и 45 калибров оружия были его главным вооружением, но были довольно медленны по сравнению с тяжелыми крейсерами, построенными после Первой мировой войны."
 CHL_battleship_1: "Класс Almirante Latorre"
 CHL_battleship_1_desc: "Класс Альмиранте Латорре состоял из двух супер-дреднированных боевых кораблей, построенных в Британии для чилийских ВМС во время начала Первой мировой войны. Только один из них был закончен в качестве боевого корабля, а другой был переоборудован в авианосец HMS Eagle. Корабли переместились более чем на 28 000 тонн и имели основное вооружение в 10 14 калибров. 45 калибров. Они были менее бронированы, но несколько быстрее, чем другие страшные мечты их эпохи."
 ### COL - COLOMBIA ###
 COL_destroyer_2: "Класс антиокии"
 COL_destroyer_2_desc: "Класс Антиокии состоял из двух эсминцев, которые были построены для Колумбийского военно-морского флота в Португалии. В 1934 году корабли были сданы в эксплуатацию, они переместились более чем в 1200 тонн и были вооружены четырьмя пулями БЛ 4,7 в. и восемью 533-мм торпедными трубами."
 ### DEN - DENMARK ###
 DEN_submarine_1: "Кракен I"
 DEN_submarine_1_desc: "После окончания Первой мировой войны в Дании были построены и сданы в эксплуатацию подводные лодки класса &lt; &lt; Рота &gt; &gt; . Они были небольшими подлодками и основывались на проекте &lt; &lt; Холланд 602 &gt; &gt; . Они переместили 290 тонн и были вооружены четырьмя 450-мм торпедными трубками."
 DEN_submarine_2: "Кракен II"
 DEN_submarine_2_desc: "Класс &quot; Хавманден &quot; состоял из пяти планируемых подводных лодок, три из которых были завершены до немецкой оккупации, одна - во время оккупации, а пятая - отменена. &quot; Подводные лодки &quot; были довольно небольшими, заменяющими 320 тонн, были вооружены пятью 450-мм торпедными трубами."
 DEN_submarine_3: "Кракен III"
 DEN_submarine_4: "Кракен IV"
 DEN_submarine_4_desc: "Штерен был британским подводным лодкой класса вампиров, переведенным в Датский ВМС после войны. &lt; &lt; Корабль &gt; &gt; был относительно небольшим, заменяя 545 тонн, но имел 4 533-мм торпедные трубы и хорошие морские мощности."
 DEN_destroyer_1: "Хадж I"
 DEN_destroyer_2: "Хадж II"
 DEN_destroyer_3: "Хадж III"
 DEN_destroyer_4: "Хадж IV"
 DEN_battleship_1: "Йормунгандр I"
 DEN_battleship_2: "Йормунгандр II"
 DEN_battleship_3: "Йормунгандр III"
 DEN_battleship_4: "Йормунгандр IV"
 DEN_heavy_cruiser_1: "Класс Herluf Trelle"
 DEN_heavy_cruiser_1_desc: "Класс «Херлуф тролле» представлял собой три крейсера, сооруженные в период с 1901 по 1908 год. Несмотря на классификацию крейсера, они были ближе к крейсеру по размеру и вооружению. Только один, Питер Скрам, находился на службе в начале Второй мировой войны. Корабли переместились более чем на 3700 тонн, были вооружены двумя 240-мм/К43 пушками в своем главном вооружении и были хорошо бронежилированы, хотя они были медленнее, чем самые страшные боевые корабли его эпохи."
 DEN_carrier_1: "Лингбакр I"
 DEN_carrier_2: "Лингбакер II"
 DEN_carrier_3: "Лингбакр III"
 DEN_carrier_4: "Лингбакер IV"
 ### DOM - DOMINICAN REPUBLIC -- all generic ###
 ### ECU - ECUADOR -- all generic ###
 ### EST - ESTONIA ###
 EST_submarine_2: "Класс Калева"
 EST_submarine_2_desc: "Класс Калева состоял из двух подводных лодок, построенных в 1936 году в Великобритании для военно-морского флота Эстонии."
 ### FIN - FINLAND ###
 FIN_heavy_cruiser_1: "Класс Väinämöinen"
 FIN_heavy_cruiser_1_desc: "Класс Väinämöinen состоял из двух кораблей береговой обороны, построенных в Финляндии в начале 1930-х годов, которые были одними из последних кораблей береговой обороны, хотя их размеры и вооружение были ближе к размеру тяжелого крейсера, они переместили лишь 3900 тонн и были довольно медленными, но были вооружены четырьмя 254-мм пулемётами Bofors."
 FIN_submarine_1: "Класс Ветехина"
 FIN_submarine_1_desc: "Класс Ветехинена состоял из трех средних подводных лодок, построенных для ВМС Финляндии. Они основывались на немецких подлодках WWI-эра UB III. Они переместились чуть менее 500 тонн и были вооружены четырьмя 533-мм торпедными трубами."
 ### GRE - GREECE ###
 GRE_submarine_1: "Класс Katsonis"
 GRE_submarine_1_desc: "Подводные лодки класса Катсонис были построены во Франции для Греческого флота в конце 1920-х годов. Оба корабля этого класса служили во время Второй мировой войны. Они переместили почти 580 тонн и были вооружены шестью 533-мм торпедными трубами."
 GRE_submarine_2: "Класс &lt; &lt; Матрозо &gt; &gt;"
 GRE_submarine_2_desc: "Греческая подводная лодка &lt; &lt; Матрозос &gt; &gt; была итальянской подводной лодкой класса &lt; &lt; Перла &gt; &gt; , захваченной британией и переданной в Греческое военно-морское судно во время изгнания в 1942 году. &lt; &lt; Подводная лодка &gt; &gt; переместилась в 680 тонн и была вооружена шестью 533-мм торпедными трубами."
 GRE_submarine_4: "Класс pipinos"
 GRE_submarine_4_desc: "Четыре корабля класса "Пипинос" были британскими подводными лодками класса U, переданными греческим военно-морским силам в изгнании в период с 1943 по 1946 год."
 GRE_destroyer_1: "Класс это"
 GRE_destroyer_1_desc: "Разрушители класса &quot; Этос &quot; были построены в Британии и куплены для Греческого флота до Первой мировой войны. Все четверо находились на службе во время Второй мировой войны. Они переместили 980 тонн и были вооружены четырьмя 105-мм пушками &quot; Армстронг П &quot; и четырьмя 533-мм торпедными трубами. В конце 1920-х годов они были модернизированы."
 #GRE_destroyer_1b: "Класс гидры"
 GRE_destroyer_2: "Васильефы Георгиос I класс"
 GRE_destroyer_2_desc: "В конце 1930-х годов в Великобритании для Греческого флота были построены два модифицированных британских эсминцев класса H. Корабли переместили 1350 тонн и имели достойную скорость. Они имели дальний радиус действия, были вооружены четырьмя 128-мм ружьями SK C/34 и имели сильное торпедное дополнение."
 GRE_destroyer_3: "Класс адрии"
 GRE_destroyer_3_desc: "Класс Адриаса состоял из шести эсминцев класса British Hunt III, четыре из которых были переведены в греческий военно-морский флот в изгнании в 1942 году."
 GRE_destroyer_4: "Класс Леона"
 GRE_destroyer_4_desc: "Класс Леона был классом эсминских эсминцев американского класса. Они были заказаны в 1943 году, но не доставлены в греческий флот до 1951 года. Корабли были медленнее, чем стандартный эсминец. Они переместили 1240 тонн и имели три пистолета калибра в качестве основного оружия, а также мощный комплект торпед и оборудования ASW."
 GRE_light_cruiser_1: "Класс Элли"
 GRE_light_cruiser_1_desc: "Элли — легкий крейсер, построенный США в 1914 году. Первоначально он предназначался для китайского флота, но в конечном итоге был доставлен в Грецию. Он был небольшим для крейсера, заменяющего только 2 600 тонн. В качестве основного вооружения он имел два 152-мм 45 калибра. Корабль служил во время Второй мировой войны и был затоплен итальянским подлодкой до вторжения Аксиса в Грецию."
 GRE_heavy_cruiser_1: "Класс &quot; Averof of Class &quot; ( &lt; &lt; Класс &gt; &gt; )"
 GRE_heavy_cruiser_1_desc: "Averof — бронированный крейсер, построенный в Италии для Греческого флота до Первой мировой войны. На протяжении второй мировой войны она служила флагманом флота. Averof была достаточно мощной по сравнению с крейсерами своего времени, сняв почти 10 000 тонн. Она была очень хорошо бронетранспортирована и имела основное вооружение в 4 234-мм стволах Армстронг. Несмотря на все это, она была относительно быстро на бронированном крейсере."
 GRE_battleship_1: "Класс Kilkis"
 GRE_battleship_1_desc: "Класс Kilkis состоял из двух боевых кораблей класса Mississippi, которые были заказаны в 1908 году и проданы Греции в 1914 году."
 ### HOL - NETHERLANDS ###
 HOL_submarine_1: "Класс K-III"
 HOL_submarine_1_desc: "Класс K-III состоял из двух подводных лодок, которые были построены и использовались Королевским флотом Нидерландов в качестве патрульных подлодок. Они были сданы в эксплуатацию в начале 1920-х годов на основе подводных лодок класса Холланд. Каждая из них переместилась более чем на 580 тонн и была вооружена четырьмя 450-мм торпедными трубами."
 #HOL_submarine_1b: "Класс K-XIV"
 HOL_submarine_2: "Класс О16"
 HOL_submarine_2_desc: "Подводная лодка O16 была изготовлена и заказована в Нидерландах для Королевского голландского флота в 1936 году. Она была большой подводной лодкой, заменяющей более 980 тонн. У нее глубина ныряния 80 метров и она была вооружена восемью 533-мм торпедными трубами."
 HOL_submarine_3: "Класс O21"
 HOL_submarine_3_desc: "Класс O21 состоял из семи подводных лодок, которые были построены и заказаны Нидерландами. На момент немецкого вторжения все суда были неполными, хотя пяти кораблям удалось бежать в Великобританию и служить голландским военно-морским силам в изгнании. Подводные лодки были немного больше предыдущих подводных лодок класса O, заменив более 990 тонн, но также были вооружены восемью 533-мм торпедными трубами."
 HOL_submarine_4: "Класс Зваардвиса"
 HOL_submarine_4_desc: "Класс Zwaardvis представлял собой четыре британских подлодки класса Tacistur, переведенных в Королевский флот Нидерландов в изгнании в период с 1943 по 1945 год. Корабли переместили 1090 тонн, были вооружены 11 533-мм торпедными трубами и имели глубину ныряния более 100 метров."
 HOL_destroyer_1: "Класс Ван Гента"
 HOL_destroyer_1_desc: "Класс Ван Гент, или Адмираллен, состоял из восьми эсминцев, созданных для Королевского голландского флота в период 1926-1931 годов. Корабли основывались на ранних версиях британского класса А. Все корабли сражались во время Второй мировой войны и были либо разбиты, либо затонули. Корабли переместились более чем на 1300 тонн, были вооружены четырьмя 120-мм пушками и имели достойную скорость для своей винтажности."
 HOL_destroyer_3: "Класс Калленбурга"
 HOL_destroyer_3_desc: "Класс Джерарда Калленбурга планировал четыре эсминца для Королевского голландского военно-морского флота. Все четыре были запущены до немецкого вторжения, но только два были завершены: один - англичанами после побега в Англию и один - немцами. Эти эсминцы переместили более 1600 тонн, были вооружены пятью 120-мм пушками в своем главном вооружении, а также восемь 533-мм торпедных труб и имели хорошую скорость."
 HOL_destroyer_4: "Класс печени"
 HOL_destroyer_4_desc: "Класс Пит Хейн состоял из трех британских эсминцев класса S, переведенных в Королевский флот Нидерландов вскоре после войны."
 HOL_light_cruiser_1: "Класс Java"
 HOL_light_cruiser_1_desc: "В середине 1920-х годов голландцы заказали два легких крейсера класса Java, которые были спроектированы в Германии, но построены в Нидерландах."
 HOL_light_cruiser_2: "Класс &quot; De Ruyter &quot;"
 HOL_light_cruiser_2_desc: "Легкий крейсер де Рюйтер был построен в Нидерландах в середине 1930-х годов, она служила главным образом в Голландской Ист-Индии, переместилась более чем на 6500 тонн и была вооружена 7 150-миллиметровыми пушками в своем главном вооружении, у неё была скорость ниже средней, но хорошая дальность."
 HOL_light_cruiser_3: "Класс тромпа"
 HOL_light_cruiser_3_desc: "Класс Тромп состоял из пары относительно небольших легких крейсеров, заказанных в Нидерланды непосредственно перед немецким вторжением. Оба они служили на Дальнем Востоке и пережили войну. Они переместили только 3 350 тонн и, в соответствии с дизайном, имели шесть 150-метровых пушек в качестве основного вооружения."
 HOL_light_cruiser_4: "Класс &lt; &lt; Де Зевен Провинсьен &gt; &gt;"
 HOL_light_cruiser_4_desc: "Класс De Zeven Provención состоял из двух крейсеров, заложенных непосредственно перед вторжением Германии, но не закончился до 1951 года. &quot; Окончательный проект &quot; был изменен по сравнению с первоначальным планом 1939 года и привел к перемещению двух кораблей более 12 000 тонн, которые были вооружены восемью боевыми пулеметами &quot; Бофорс 152-ммм &quot; , которые были хорошо бронетранспортированы для легкого крейсера и имели хорошую дальность."
 HOL_heavy_cruiser_1: "Класс &lt; &lt; Соерабаджа &gt; &gt;"
 HOL_heavy_cruiser_1_desc: "Голландский крейсер &quot; Соерабаджа &quot; , первоначально названный &quot; Де Зевен Провинчён &quot; , был прибрежным оборонным кораблем ( &quot; пантершип &quot; ), построенным в Нидерландах до Первой мировой войны. Она переместилась более чем на 6500 тонн и была вооружена двумя 280-мм и четырьмя 150-миллиметровыми ружьями. Она служила во время Второй мировой войны, пока не была затоплена японскими бомбардировщиками в 1942 году."
 ### IRE - IRELAND -- all generic ###
 ### LAT - LATVIA ###
 LAT_submarine_1: "Класс &lt; &lt; Ронис &gt; &gt;"
 LAT_submarine_1_desc: "Класс Рониса состоял из двух подводных лодок, которые были построены во Франции для латвийских ВМС в 1927 году, были небольшими, заменяющими только 390 тонн, и были вооружены шестью 533-мм торпедными трубами."
