 pathguides.2.d: "В начале 1937 года начнется цепочка событий в Манчестере. Продолжайте ее эскалацию, и в конечном итоге вы получите событие, которое дает вам два выбора - революция или военный переворот. Выберите первый. В конечном счете, британская гражданская война вспыхнет - просто выберет на сторону социалистов. Чтобы играть в качестве британского правительства в изгнании, просто бок о бок с правительством, когда придет революция, и вы потеряете гражданскую войну."
 #
 pathguides.3.d: "§RValkist/Degelle/PB: §! Передайте Krijgswet , поддержите манифест Дегрель, разрешите протест, королевское правительство, изберите националистическую коалицию, выберите валькистов. §n §PRPatAut/Verdinaso:§! Пропускайте Krijgswet, поддерживайте манифест Дегрель, разрешите протест, король формирует правительство, избирает националистическую коалицию, выбирает патаут."
 #
 pathguides.4.d: "§RHorty/Avria-Hurvey/Transylvanian Noble/Horty Dictator: §! Rush through through unday. Когда намечается национальный кризис, то бегите в центр внимания Будапештской конференции. В цепочку событий в пользу левых. Хорти переворотит. Чтобы выбрать, какой вариант вы хотите, выберите в дереве Хорти. §n §RNRNATpoP/Лучшая демократическая идеология: §! Rush through unday. Когда национальный кризис наступает, то бегите в сторону Будапештской конференции. В цепочку, если вы не будете выступать в пользу ни одной из сторон, ни левой ветви дерева. В случае хунты, разрешите провести выборы. В ходе выборов выберете нужный вариант. §RNRNATOP/Лучего:"
 #
 pathguides.5.d: "§RSocLib/MarLib/SocCon/NatPop/Valkist: §! Когда LSMC закрывает двери банка, когда ему предоставляется возможность. Когда гражданские лица нападают на банки, выбирайте «ничего не можем сделать». Затем, когда протестующие требуют выборов, объявляете о выборах. Когда предвыборное мероприятие кажется предпочтительным, есть другие способы достичь этого результата, это просто простейший. Для валькизма есть дополнительный шаг, в то время как вы также можете быть в Валькисте, вы также будете следить за тем, чтобы это событие было направлено на «Будущее финикизма» . ~ n\RAutDem/Chebab Coup: §. Когда LSMC закрывает банковские двери, когда предоставляется этот вариант. / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / , / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / /"
