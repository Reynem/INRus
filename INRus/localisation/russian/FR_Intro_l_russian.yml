 pathguides.1.d: "§RNATpoP/IL: §! Не обладайте полномочиями CCM. Пусть Salazar попытается очистить IL. n §RAutDem/PCC/Salazar: §! / ELTH - Не обладайте властью CCM. Пусть Salazar разрешит IL сидеть. ИЛИ - Пусть CCM уступит. Оставайтесь в союзе с IL. nn PRPatAut/CCM:§! Пусть CCM уступит. Salazar ломает союз с IL. ~n §Rget Dutie II как Король: §! ~ EIFER - получить 7 или больше пунктов поддержки для испанской гражданской войны. / / / / / / Ударить социалистический испанский флот / / / / / / / / / / / / Когда пожар / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / . / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / /"
