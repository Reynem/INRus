 intro.1.t: "Фюреррейх: Имперский Ностальгия"
 intro.1.d: "Огромное количество контента содержится в этом моде, что будет очевидно в том, как играет игра, которая, я надеюсь, будет уникальным опытом на каждом спектакле."
 intro.2.d: "Q; (Nation) довольно плохо. Будет ли он перерабатываться? nA; да, все страны должны переработать в какой-то момент времени. Ничего здесь не является постоянным."
 intro.3.d: "Фюреррейх использует систему министров Кайзеррейха и, очевидно, занимает у KR значительное количество средств в целом ряде других областей. Одним из таких примеров является система популярности. nn Kaiserreich является более заметный выигрыш политической власти для стран, имеющих более популярные партии, в попытке представить гражданское содержание режима или парламентского большинства в демократических системах. В целом более высокая популярность означает, что PG General также будет выше. Ниже приводятся критерии для различных уровней популярности. nnVery Number Popularity = менее 20% популярности правящей партии noLow Popularity = 20% - 40% популярности правящей партии unMedium Popularity = 40% - 60% Популярность правящей партии ~ Высокая народность = 60% - 80% Популярность правящей партии / Невероятная Популярность = более 80% популярности правящей партии ~ un that gener, that en en that genery peopularmain party ther peopulational thing ther ther people ther ther party ther people ther ther ther ther per th th ther that ther ther ther ther party ther th ther ther ther ther ther ther ther, ther ther ther ther ther ther, ther ther ther ther, ther ther ther, ther, ther, ther, ther, ther, ther, ther, ther, ther, ther, ther, ther, ther, ther, ther, ther, ther, ther, ther, ther, ther th th ther ther ther ther ther ther ther, ther ther ther thor th"
 intro.4.d: "Вы можете менять новости в любое время с помощью кнопки в меню решений, но этот вариант остается для вашего удобства. Это скорее WIP, так что вы можете получать события время от времени, даже если вы выключите. ~nnSimilar to Kaiserreich, мир Furerreich сильно зависит от новостей, чтобы чувствовать себя живым и интересным. В конечном итоге, есть вероятность, что вы не будете прислушиваться к этому, и предпочтете выключить его, чтобы уменьшить спам."
 intro.5.d: "Военная разработка может быть найдена на политической экране в первой вкладке идей. Она призвана моделировать реальность, что в реальном мире, будь то в Кинг-Китайе в 19-ом году или Родезии в конце 20-го года, военный конфликт часто является весьма асимметричным с лучшими организованными и оснащенными силами, которые часто полностью уничтожают силы больше, чем они. ~ no note, в базе Hoi4 это на самом деле обнаруживается только через техническое дерево, которое я не считаю адекватным отражением. Военное развитие меняет это, устраняя равенство, существующее в базе Hoi4, и позволяя квалифицированному игроку или в какой-то мере компетентной МА полностью модернизировать свои военные силы. Однако до этого, возможно, было бы разумно избежать конфликта как китайское несовершеннолетнее лицо с глобальной европейской империей до этого, и быть уверенным в том, чтобы сохранить ваш армейский опыт, чтобы увеличить ваше ранжирование."

 intro.6.d: "Таким образом, я постараюсь представить некоторые рекомендованные нации в неисчерпывающем списке... ~n §RUK/Union of British/Britalis Exiles §!. Есть новые события, новые фокусы. Германия - это путь гражданской войны под социалистическим союзом Великобритании, а британское правительство в Эксилие находится в центре внимания."

 intro.7.d: "§Rapadoslavia §! Как некоторые могут знать, Император Ностальгия начал как проект по восстановлению 0,1 фюреррейха, и быстро эволюционировал. § Западославия был лучшим из списка, который должен был быть восстановлен, а теперь в Императоре Ноталгия имеет блестящее новое дерево, допускающее панславскую экспансию, советское правление, военное или либеральное правление. Или, вы можете принять решение уничтожить вас западославию, не выйдя за пределы этого мира, из-за того, что диктный герцогство и прежнее озеро в Японии, привели вас к образованию государств-преемников, включая Чехию из Фюрерайца и Фюрредю. Затем вы можете вести себя так же, как и эта нация, или даже выбрать восстановление Западославии (если вы мазохист) . § détarging the Distan, thattalng through that the Histians, through througer ge ther stat througar that the ther ther ther ther ther ther ther ther ther ther ge ther thar ther ther ther ther ther th of th of ther ther ther ther ther ther ther ther ther ther ther degal ther degal ther ther ther thargan ther ther ther ther ther ther than thar than than than than than than than than than than than than than than than the th of the the the the the ther than than that del that del thean than ther than than than th"

 intro.8.d: "§R Afghanistan §!. Любимая из оригинальной имперской Ностальгии, Афганистан позволяет вам построить крупную империю между Персией и Индией, восстанавливая Дурранскую империю. Вы также можете построить афганский флот, покупая корабли из-за границы и используя его в качестве ступеневой зоны для приведения в соответствие с великой властью. В Империи Ностальгия 0,2, в Афганистане было добавлено и сглажано большое количество жучков и контента. §Ranka§! Украина восстановила одно и то же французское дерево. Новая внешняя политика позволяет вам построить украинское Интермариум или пойти на на наступление и строительство Большой Украины. \n §Royna§! Румыния также восстановляет новое восстановленное дерево. Эта нация не является действительно новым местом восстановления, и она служит более достойным упоминанием о национальном творчестве, которое имеет содержание."

 intro.9.d: "§RPhoencia§!. В то время как Феникия, используя только новое и улучшенное необычное дерево, тем не менее, является приятным проигрышем. Действуя, как французская викторина Ближнего Востока, если вы проиграете свое превосходство, вы обнаружите, что вы можете бороться за выживание с сирийским восстанием, турецкими нападениями и вторжением Масрики. Несмотря на то, что она не богата, Британская Восточная Азия находит себя новой игрушкой для своего губернатора, мобильного военного теоретика и волшебника в течение неполного времени, вы сможете снова играть в любое новое волшебство, если вы будете защищаться от новых восстаний и докажете опекуна Востока Великобритании против потенциального японского, американского и французского нападок, убивая врагов вашими передовыми бронежилетными силами. § §Runión Union §. Короткие решения и модифицированная внешняя политика. un conduction conctions th ther ther ther under the under under int int int int int int dire dire dire dire dire dire dire dire dire dire dire dire dire dire dire dire dire dire dire dire dire dire dire dire dire dire dire dire dire dire du du du dire dire du du du du du du du du du du du du d d d d d d d d d d d d d d d d d d d d d du du d du du d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d"

