### missing in vanilla, delete if added
 armored_car1: "Бронированная машина &lt; &lt; Интервар &gt; &gt;"
 armored_car1_desc: "В тех случаях, когда предыдущие бронированные автомобили были простыми коммерческими моделями с тонкими стальными покрытиями, эта модель была разработана с нуля для доставки бронежилетов и легких вооружений."
 armored_car2: "Базовая бронированная машина"
 armored_car2_desc: "Усовершенствованные внутренние планировки и дополнительное хранение боеприпасов обеспечивают более эффективный бронированный автомобиль."
 armored_car3: "Усовершенствованный бронированный автомобиль"
 armored_car3_desc: "Изменения на поле боя требуют гораздо бóльших вооружений и более толстых бронежилетов, чтобы победить вражеские световые подразделения и выжить, чтобы сообщить об этом."
 armored_car_at_upgrade: "Бронированная машина, противоречащая танкам"
 armored_car_at_upgrade_desc: "В какой-то момент наши световые механизированные подразделения вступают в контакт с вражескими танковыми войсками, и разработка специального антитанкового варианта даст им шанс на победу."

