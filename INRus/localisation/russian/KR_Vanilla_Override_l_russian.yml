 armour_folder: "Бронирование"
 nsb_armour_folder: "Бронирование"
 air_doctrine_folder_desc: "Воздушный доктрина, как ваши военно-воздушные силы сражаются."
 mobile_warfare_desc: "Mobile Warfare уделяет основное внимание скорости и маневрированию, чтобы отрезать и дезорганизировать вражеские силы."
 elastic_defence: "Эластичная оборона"
 elastic_defence_desc: "Вместо того, чтобы сфокусировать все силы на линии фронта, эластичная защита создает «слой защиты для обезьян», который дает защитнику больше времени для реагирования и контрнападения, в то время как нападавший разрастается и сжимается."
 mobile_infantry_desc: "Часто регулярные пехотные подразделения слишком медленны, чтобы успевать за быстро движущимися бронированными силами, реагировать на них или убегать от них."
 mass_motorization: "Массовая моторизация"
 mass_motorization_desc: "Еще больше внимания уделяется моторизованным войскам."
 mechanised_offensive: "Механизированные наступательные операции"
 mechanised_offensive_desc: "Моторизованные войска хороши и хороши, но для того, чтобы возглавить наступательные операции, нам нужны пехотные подразделения, которые могут въехать в бронированные транспортные средства, защищающие их и перевозящие тяжелые вооружения."
 armored_spearhead: "Бронированная головка &lt; &lt; Бронированная головка &gt; &gt;"
 armored_spearhead_desc: "Для того чтобы использовать Танки в полной мере, их нельзя привязать к пехоте, а вместо этого они должны быть преобразованы в быстро движущиеся, независимые подразделения, которые могут вести атаки."
 firebrigades_desc: ""Огненные бригады" поспешно собирают силы, чтобы реагировать на вражеские прорывы или другие критические вопросы."
 backhand_blow_desc: "Вместо того чтобы сражаться за каждый дюйм земли, проникновение противника в основном удается избежать до тех пор, пока они не перерастут в свои линии, и тогда они могут быть отрезаны и уничтожены контратаками."
 mobile_defence: "Мобильная оборона"
 mobile_defence_desc: "Мобильные силы могут использоваться для укрепления обороны, где бы противник не напал."
 dispersed_support_desc: "Разъединяя наши подразделения поддержки, они могут охватить более широкий район, оставаясь вне линии огня, что приведет к расколу с большей защитой."
 sup_mechanized_offensive: "Механизированные наступательные операции"
 sup_mechanized_offensive_desc: "Моторизованные войска хороши и хороши, но для того, чтобы возглавить наступательные операции, нам нужны пехотные подразделения, которые могут быть введены в бронированные транспортные средства, которые могут защитить их и носить тяжелые вооружения."
 concentrated_fire_plans_desc: "Сосредоточив огонь различных батарей на синхронных бомбардировках, врагу может быть причинен гораздо больший ущерб."
 combined_arms_desc: "Броневые, пехотные и вспомогательные подразделения, работающие совместно в хорошо организованных группах, гораздо эффективнее, чем те же, которые используются отдельно."
 tactical_control_desc: "Офицеры, знакомые с комбинированными операциями с оружием на передовых позициях, теперь могут непосредственно контролировать все операции отделений."
 air_land_battle_desc: "С учетом того, что наземные силы уже действуют в составе объединенных групп вооружений, битва «Эйр Лэнд» в настоящее время также делает упор на тесной координации между наземными и военно-воздушными силами, объединяя поле боя «воздух и земля» в единое целое."
 centralized_fire_control: "Централизованная система пожаротушения"
 centralized_fire_control_desc: "Централизованная система пожаротушения позволяет оценивать все призывы к артиллерийской поддержке в одном месте, а в случае необходимости вся огневая мощь дивизии сконцентрирована на цели, а не только на подразделениях, которые могут запрашивать огонь от назначенного им артиллерии."
 shock_and_awe_desc: "Массовая концентрация огневой мощи немедленно или на достаточно своевременной основе наложит на противника подавляющий удар по Шоку и Аве, с тем чтобы он проявил свою волю к продолжению."
 grand_mechanized_offensive: "Механизированные наступательные операции"
 grand_mechanized_offensive_desc: "Моторизованные войска хороши и хороши, но для того, чтобы возглавить наступательные операции, нам нужны пехотные подразделения, которые могут въехать в бой в бронетранспортерах, которые защищают их и носят тяжелые вооружения."
 armored_operations: "Бронированные операции"
 armored_operations_desc: "Танки и другие бронированные машины весьма полезны для доставки пехоты на поле боя и для оказания прямой поддержки в боевых действиях."
 infiltration_in_depth_desc: "Наши силы теперь обучены обходить и изолировать сильные точки противника на гораздо большую глубину, и в идеале наши ударные силы не должны останавливаться до тех пор, пока они не достигнут задних районов врага и их силы полностью отрезаны."
 pocket_defence: "Карманная оборона"
 pocket_defence_desc: "Вполне возможно, что наши войска будут пойманы в кармане, и в этом случае они будут просто держаться до тех пор, пока неизбежное контрнаступление не избавит их."
 defence_in_depth: "Защита в глубине"
 vast_offensives_desc: "Если прорыв может быть достигнут, его необходимо использовать как можно более активно: широкомасштабное наступление, проталкивающее как можно глубже через вражеские линии, сделает защиту их фронта более сложной, невозможной или неактуальной."
 mechanized_wave: "Механизированная волна"
 mechanized_wave_desc: "Механизированные силы идеально подходят для быстрого продвижения вперед, необходимого для надлежащего использования &lt; &lt; Прорывов &gt; &gt; , как для поддержки бронированных сил, так и для защиты флангов нарушения."
 human_infantry_offensive: "Множественное нападение"
 continuous_offensive_desc: "Несмотря на то, что должным образом использованные проблески зачастую являются весьма эффективными, рано или поздно нападавший всегда истощается и защитник может перестроить и реформировать новые оборонительные линии, однако при наличии достаточных резервов и надлежащей организации наступление может быть продолжено до гораздо большей глубины с разрушительными последствиями для противника."
 infantry_weapons2_desc: "Персонал и экипаж поставляли оружие для пехоты, а также различные другие комплекты, в которых нуждался солдат."
 improved_infantry_weapons_2_desc: "Персонал и экипаж поставляли оружие для пехоты, а также различные другие комплекты, в которых нуждался солдат."
 advanced_infantry_weapons2_desc: "Персонал и экипаж поставляли оружие для пехоты, а также различные другие комплекты, в которых нуждался солдат."
 infantry_at_desc: "Бронирование наших пехотных подразделений противотанковыми винтовками позволит им вывести более легкие бронированные машины при сохранении мобильности."
 infantry_at2_desc: "Для того чтобы пехота могла эффективно использовать более тяжелые бронетанковые подразделения, необходимо сделать противотанковое оружие большим и легким."
 paratroopers3_desc: "Усвоение навыков адаптации операций по погрузочно-разгрузочным работам в соответствии с погодными условиями, стандартизация такого оборудования, как сапоги для прыжков и расширенная специализированная подготовка, позволит свести к минимуму путаницу и риски, связанные с этими опасными полетами."
 marines_desc: "Импровизированные методы и снаряжение становятся достоянием прошлого, поскольку наша военно-морская пехота поддерживается специализированными посадочными аппаратами и тренировками."
 marines2_desc: "Совершенствование материально-технической поддержки и портативных гаваней может позволить нашим морским пехотинцам производить посадку, которая в противном случае была бы невозможной."
 marines3_desc: "Морские пехотинцы могут быть не просто амфибией, и в будущем наш морской корпус будет одним из наиболее дисциплинированных и организованных специальных сил."
 tech_mountaineers_desc: "Боевые действия на горных хребтах подвергают войскам множество опасностей, но иногда их невозможно избежать."
 tech_mountaineers2_desc: "Если мы не выживем, наши силы могут быть обучены тому, чтобы использовать горы в своих интересах."
 tech_recon4_desc: "Глубокие разведывательные операции, смешанный шпионаж, партизанские операции и обучение командному составу помогут нам сделать тактический выбор и позволят нам быстро адаптировать процесс принятия решений."
 tech_logistics_company_desc: "Наличие в наших рядах специалистов по материально-техническому обеспечению обеспечит использование сетей поддержки для сведения к минимуму отходов."
 tech_logistics_company3_desc: "Непрерывная статистическая оценка потребностей в войсках способствует максимальному использованию наших ресурсов."
 tech_logistics_company4_desc: "Разработка стандартизированных классификаций поставок позволит свести к минимуму путаницу и повысить эффективность планирования."
 tech_military_police2_desc: "Выполняя регулярные полицейские функции на оккупированных территориях, такие, как управление движением и поддержание общественного порядка, наша военная полиция может свести к минимуму хаос и путаницу, в которых процветают партизанские движения."
 tech_signal_company_desc: "Создание и поддержание связи на местах всегда требовало специальных навыков."
 tech_signal_company3_desc: "Все более жизнеспособной становится переносная коммуникационная технология, которая сама по себе является рюкзаком."
 tech_maintenance_company2_desc: "Обычные процедуры оперативного обслуживания сводят к минимуму риски, связанные с разрушением оборудования, и предупреждают военнослужащих о необходимости его замены до того, как это произойдет."
 tech_maintenance_company4_desc: "Опыт проектирования активной резервной системы во время Великой войны можно обновить, с тем чтобы работать с более современным оборудованием, облегчающим техническое обслуживание."
 motorised_infantry: "Моторизованные пехотные подразделения"
 streamlined_line_desc: "Стандартизация и жесткая структура сборочной линии являются ключевыми элементами ее эффективности и безопасности, которые должны стать ключевыми аспектами развития нашего промышленного производства."
 concentrated_industry5_desc: "Крупные промышленные комплексы в настоящее время объединяют многие части нашей промышленности, минимизируя расходы на транспорт и рабочую силу."
 dispersed_industry2_desc: "Дальнейшая децентрализация нашей обрабатывающей промышленности затрудняет удар по конкретным ее частям."
 construction2_desc: "Модернизация наших инструментов и оборудования еще больше поможет нашим строительным усилиям."
 construction4_desc: "Более высокая степень механизации и более совершенные процедуры способствуют дальнейшему повышению скорости строительства зданий."
 construction5_desc: "Будущее эффективного строительства потребует более широкого планирования отдельных проектов, а также стандартизации решений, когда это возможно."
 improved_decimetric_radar_desc: "Использование радиолокатора уже доказало свою важность, но наши дециметрические радиолокационные установки слишком малы, чтобы обеспечить хороший охват."
 improved_centimetric_radar_desc: "Внедрение современных радиолокационных технологий, таких, как монопульсные радиолокаторы, в ключевых операциях позволит обеспечить экстремальную точность слежения."
 improved_encryption_desc: "Ограничение случайности шифровальных машин может быть использовано, чтобы сломать шифры. Улучшая случайность роторной механики, мы можем сделать этот тип криптографического анализа более сложным."
 basic_decryption_desc: "Криптографический анализ становится все более продвинутой математической наукой. Такие системы, как карточные каталоги и устройства, например циклометры, могут помочь в проведении необходимой работы."
 improved_decryption_desc: "Разработка более сложных компьютеров позволяет применять новые методы криптографического анализа, такие, как различия, которые могут использоваться для разрыва передовых шифров в сочетании с новыми методами ручного взлома кодов."
 rocket_interceptor_2_desc: "По-прежнему считается крайне опасным для функционирования, что истребители с ракетной установкой теперь получают помощь от самолётов и буксировок других самолетов, с тем чтобы максимально использовать их экстремальную скорость, но короткое топливное окно."
 artillery1_desc: "С помощью более современных материалов и механизмов гаубицы и полевые орудия Великой войны могут быть перезахвачены и модернизированы для современных боевых действий."
 mountain_gun_desc: "Горная местность Северной Индии привела к разработке артиллерии, которая могла быть демонтирована и перевезена на муле туда, где это было необходимо."
 rocket_artillery2_desc: "Самоходная артиллерия, использующая несколько ракет, сможет быстро вызвать широкомасштабные разрушения, сохраняя при этом мобильность, с тем чтобы избежать контрострела."
 rocket_artillery4_desc: "Стабилизированные ракеты могут увеличить дальность применения более легких артиллерийских батарей."
 antiair4_desc: "Для быстрого реагирования на более быстрые летательные аппараты необходимо будет объединить современные системы радиолокационных, компьютеризированных и автопогрузчиков."
 antitank1_desc: "Важность эффективного противотанкового оружия была установлена во время Великой войны, и для борьбы с современными конструкциями танков потребуется введение нового поколения такого оружия."
 antitank2_desc: "Большинство противотанковых пушек пока довольно легкое, поэтому для борьбы с более тяжелыми танками с бронежилетами потребуется оружие более высокого калибра."
 antitank4_desc: "Новые разносторонние противотанковые пулеметы, в которых используются бронебойные выстрелы из саботов, могут проникать в броню почти любого танка."
 antitank5_desc: "Сочетая различные виды новой технологии боеприпасов с пушками с более высокой скоростью музыки, мы можем быть готовы к любым новым броням, которые могут появиться у наших врагов."
 dogfighting_experience: "Опыт борьбы с собаками"
 air_defence: "Воздушные средства обороны"
 home_defence: "Внутренняя оборона"
 dive_bombing_desc: "Взрывы с погружением в воду позволяют повысить точность, однако для достижения наилучших результатов требуется специализированное воздушное судно, способное замедлить их погружение и выдержать стресс при выходе из него."
 direct_ground_support_desc: "Тесно координируя пилоты СВК с наземными наблюдателями, воздушные огневые силы могут быть направлены именно на то, чтобы наилучшим образом помочь войскам в бою."
 bomber_ace_initiative_desc: "Официальное признание и поощрение пилотов-бомбардировщиков Ace поощряет смелость и инициативу."
 cas_ace_initiative_desc: "Официальное признание и поощрение пилотов Ace CAS поощряет смелость и инициативу."
 keypoint_bombing: "Бомба с ключевыми точками"
 night_bombing_desc: "С опущенной защитой противника и покрытыми тьмой бомбардировщиками мы можем оставаться наступательными и эффективными круглосуточно. Покажи нашему врагу, насколько мы настойчивы."
 flying_fortress_desc: "Посадить наших высоколетающих тяжелых бомбардировщиков с оружием, чтобы защитить себя, и хватит доспехов, чтобы избить и все равно вернуться домой."
 battlefleet_concentration: "Концентрация боевого флота"
 battlefleet_concentration_ti: "Концентрация боевого флота"
 subsidiary_carrier_role_desc: "Карьеры поддерживают боевые корабли, повышая их готовность к переходу от обороны к обвинению."
 subsidiary_carrier_role_ti_desc: "Карьеры поддерживают боевые корабли, повышая их готовность к переходу от обороны к обвинению."
 grand_battlefleet: "Большой боевой флот"
 escort_carriers_desc: "Обеспечение притока ресурсов имеет важнейшее значение."
 integrated_convoy_defence: "Комплексная защита конвоя"
 integrated_convoy_defence_bs: "Комплексная защита конвоя"
 wolfpacks_desc: "После того, как наши подводные лодки были построены в стаи, координация между ними значительно улучшилась."
 advanced_submarine_warfare_desc: "Огромное улучшение связи между нашими подводными лодками дает им время атаковать до совершенства, когда они наконец увидят нас, это будет с тонущего корабля."
 naval_air_operations_desc: "Пилоты, обученные выполнять миссии от перевозчиков, открывают нам новый путь к доминированию в морях."
 carrier_primacy_desc: "Современные воздушные самолеты имеют более высокую дальность и точность, чем обычные военно-морские пушки."
 carrier_task_forces_desc: "Организованные оперативные группы с перевозчиками и легкими крейсерами обеспечивают, чтобы враг никогда не застал нас врасплох."
 basic_heavy_armor_scheme: "Смонтированная бронетранспортерная схема"
 basic_heavy_armor_scheme_desc: "Поставив бронежилеты под угол, толщину и вес бронежилетов гораздо труднее пронзить. Несмотря на то, что этот модуль на §YHeavy Ships§! Улучшает их способность §!. §YBattlecruisers §! определены в их различных схемах §YArmour!"
 improved_heavy_armor_scheme: "Система бронетранспортеров &lt; &lt; все или ничего &gt; &gt;"
 improved_heavy_armor_scheme_desc: "Эта схема направлена только на защиту наиболее важных участков судна, игнорируя при этом неважные части. ~nn Mounding этот модуль на §YHeavy Ships §! Улучшает их способность §!!. §YBattlecures §! и § §YBattlecruisers §! определены в их различных системах §YArmour!"
 heavy_armor_advice_tt: "§YYBattlecruisers §! определены в их различных §YArmour §!, в то время как у боевых круизов в целом бронежилеты хуже."
 carrier_battlegroups: "Боевые группы &lt; &lt; Карьер &gt; &gt;"
 MOBILE_WARFARE_DOCTRINE_DESC: "Mobile Warfare уделяет основное внимание скорости и маневрированию, чтобы отрезать и дезорганизировать вражеские силы."
 MOBILE_INFANTRY_LABEL_TT: "Улучшить скорость и организацию пехоты."
 BLITZKRIEG_LABEL_TT: "Улучшить организацию бронированных подразделений."
 DESPERATE_DEFENSE_LABEL: "ДЕСПЕРАТИВНАЯ ДЕЯТЕЛЬНОСТЬ"
 DESPERATE_DEFENSE_LABEL_TT: "Максимизировать вербовку и партизанскую тактику."
 MODERN_BLITZKRIEG_LABEL_TT: "Улучшить организацию армии и противодействующую тактику."
 DISPERSED_SUPPORT_LABEL_TT: "Улучшить организацию и эффективность линейной артиллерии."
 INTEGRATED_SUPPORT_LABEL_TT: "Улучшить организацию и эффективность вспомогательных подразделений."
 ASSAULT_LABEL_TT: "Сосредоточьтесь на прямых и фронтальных нападениях с доспехами."
 DEEP_BATTLE_LABEL: "ДЕЙП-н-БАТАЛ"
 MASS_MOBILIZATION_LABEL: "МОБИЛИЗАЦИЯ МАССОВ"
 MASS_MOBILIZATION_LABEL_TT: "Максимальный набор персонала и численность персонала."
 STRATEGIC_DESTRUCTION_DESC: "Взрывая вражеские фабрики ночью или, что более опасно, днем мы можем серьезно помешать их военной машине."
 cat_mechanized_equipment: "Механизированные модели"
 armor: "Бронирование"
