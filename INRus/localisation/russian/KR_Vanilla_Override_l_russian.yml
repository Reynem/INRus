### stats_l_english
 STAT_COMMON_MAX_ORG: "Организация:"
 STAT_COMMON_MAX_ORG_DESC: "Организация указывает на боевую готовность и на то, насколько организовано подразделение, подразделение без организации не может сражаться или двигаться эффективно."
 STAT_ARMY_DEFAULT_MORALE_DESC: "Сколько дополнительных организаций может быть восстановлено на почасовой основе, если они не участвуют в боевых действиях."
 STAT_ARMY_DEFENSE: "Защита:"
 STAT_ARMY_BREAKTHROUGH_DESC: "Сколько нападений противника подразделение может попытаться избежать во время наступательного нападения, что фактически позволит ему продолжать совершать преступление дольше."
 STAT_ARMY_HARDNESS_DESC: "§T§Hardness§!! представляет, как много из вашего §H Division§! состоит из бронированных или, по крайней мере, защищенных транспортных средств. ~ Несмотря на нападение, отдел объединяет все мягкие и жестокие нападения. Дивизия с высоким §Hardness§! пострадает меньше §HSoft Affairs §! и больше §Hard Affairs §! - и наоборот! §!"
 STAT_NAVY_SHORE_BOMBARDMENT_DESC: "Способность подразделения осуществлять бомбардировку на берегу для оказания помощи в наземных боях в соседней с его морской провинцией провинции во время миссии в Холдинге."
 STAT_NAVY_EVASION_DESC: "Способность кораблей избегать огня противника с помощью маневрирования."
 STAT_AIR_DEFENCE: "Воздушная оборона:"
 STAT_COMMON_ARMOR: "Бронирование:"
 STAT_COMMON_ARMOR_DESC: "Наличие §Harmour§!, которое выше, чем значение §HPiercing§!, делает вас менее вредными, а также позволяет совершать больше нападений в бою, поскольку подразделение обладает большей свободой передвижения."
 STAT_COMMON_PIERCING_DESC: "Наличие §HPiercing§! к целям §Harmour§!"
 STAT_COMMON_ACCLIMATIZATION_HOT_GAIN: "Коэффициент накопления горячей акклиматизации"
 STAT_COMMON_ACCLIMATIZATION_HOT_GAIN_DESC: "Скоростная единица аклиматизируется в теплом климате."
 STAT_COMMON_ACCLIMATIZATION_COLD_GAIN: "Коэффициент накопления холодной акклиматизации"
 STAT_COMMON_ACCLIMATIZATION_COLD_GAIN_DESC: "Скоростная единица аклиматизируется в холодном климате."
 STAT_ADJUSTER_DEFENCE: "Защита:"
 STAT_NAVY_AMPHIBIOUS_DEFENSE: "Беспощадная защита"
 STAT_NAVY_AMPHIBIOUS_DEFENSE_DESC: "Дополнительные средства защиты, предоставляемые подразделениям во время амфибийных вторжений."
