 EQ_MOD_SLOT_armor_type_slot_TITLE: "Тип бронетранспортера"
 tank_riveted_armor: "Заряженный бронетранспортер"
 tank_riveted_armor_desc: "Броневые таблички болтаются к раме и удерживаются заклепками, приготавливаемыми к краям. Очень доказанная технология, которая довольно дешева, но закованные края обеспечивают слабые точки в бронежилетах и могут повредить экипажу, если они попадут в заклепки."
 tank_cast_armor: "Касковый бронежилет"
 tank_cast_armor_desc: "Весь шасси, включая доспехи, выставлен как единое целое, дорогостоящий и трудоемкий процесс, который позволяет гораздо толще доспехов с меньшим количеством слабых точек."
 tank_welded_armor: "Сварочный бронежилет"
 tank_welded_armor_desc: "Броневые пластины приварены к шасси."
 extra_ammo_storage_desc: "Дополнительные стойки готовых боеприпасов позволяют танку гораздо дольше оставаться в бою без пополнения запасов, однако в случае проникновения бронежилетов результаты могут быть катастрофическими, что особенно проблематично при нападении."

 tank_high_velocity_cannon_desc: "Пушка, специально предназначенная для достижения высокой скорости музыки, с использованием специализированных боеприпасов обладает превосходными антиармортными характеристиками, но ее эффективность в сравнении с мягкими целями страдает."
 tank_high_velocity_cannon_2_desc: "Пушка, специально предназначенная для достижения высокой скорости музыки, с использованием специализированных боеприпасов обладает превосходными антиармортными характеристиками, но ее эффективность в сравнении с мягкими целями страдает."
 tank_high_velocity_cannon_3_desc: "Пушка, специально предназначенная для достижения высокой скорости музыки, с использованием специализированных боеприпасов обладает превосходными антиармортными характеристиками, но ее эффективность в сравнении с мягкими целями страдает."

 tank_small_cannon_desc: "Маленькая и дешевая пушка, способная стрелять как из пушечных, так и из артиллерийских орудий."
 tank_small_cannon_2_desc: "Маленькая и дешевая пушка, способная стрелять как из пушечных, так и из артиллерийских орудий."
 tank_auto_cannon_desc: "Эта автоматическая пушка, адаптированная к быстродействующему противовоздушному ружью, может положить град огня, который губит мягкие цели."
 tank_auto_cannon_2_desc: "Эта автоматическая пушка, адаптированная к быстродействующему противовоздушному ружью, может положить град огня, который губит мягкие цели."
 tank_medium_howitzer_desc: "Средние полевые гаубицы, приспособленные для установки в транспортном средстве, предназначены прежде всего для оказания непрямой огневой поддержки в борьбе с мягкими целями, однако при необходимости они могут быть обстреляны непосредственно по цели, но с небольшим количеством бронебойных боеприпасов они не подходят для противотанковых работ."
 tank_medium_howitzer_2_desc: "Средние полевые гаубицы, приспособленные для установки в транспортном средстве, предназначены прежде всего для оказания непрямой огневой поддержки в борьбе с мягкими целями, однако при необходимости они могут быть обстреляны непосредственно по цели, но с небольшим количеством бронебойных боеприпасов они не подходят для противотанковых работ."
 tank_heavy_howitzer_desc: "Говяжье поле, приспособленное для установки в автомобиле, предназначено прежде всего для оказания непрямой огневой поддержки в борьбе с мягкими целями, однако при необходимости оно может быть обстреляно непосредственно по цели, но с небольшим количеством бронебойных боеприпасов оно плохо приспособлено для противотанковых работ."
 tank_rocket_launcher_desc: "Многоствольные ракеты-носители для неуправляемых высоковзрывоопасных ракет."
 tank_heavy_cannon_desc: "Оружие, которое может выстрелить из большого снаряда."
 tank_heavy_cannon_2_desc: "Оружие, которое может выстрелить из большого снаряда."
 tank_heavy_cannon_3_desc: "Оружие, которое может выстрелить из большого снаряда."
 flamethrower_desc: "Прибор для прогнозирования потока горящей жидкости, который, будучи весьма полезным в городских боях и в борьбе с фортификацией, не обеспечивает противотанковых средств и должен использоваться специально подготовленным экипажем в отдельном подразделении для обеспечения его эффективности."

 armor_tech_1: "Базовая бронезащита"
 armor_tech_1_desc: "Танки во время Великой войны были вынуждены бороться только со стрелковым оружием противника, и как таковые они сбежали с довольно тонкими доспехами, новое поколение противотанкового оружия сделало поле боя гораздо более опасным местом для танка, и требуется гораздо большая защита."
 armor_tech_2: "Совершенствование системы защиты бронированных боеприпасов"
 armor_tech_3: "Усовершенствованная бронезащита"
 armor_tech_4: "Современная бронезащита"
 armor_tech_4_desc: "Во время войны угрозы, с которыми сталкиваются танки, возросли: от вражеских танков, противотанковых пушек, специальных танковых уничтожителей до современных пехотных орудий, которые могут проникнуть даже в тяжелые бронежилеты."
 armor_skirts: "Броневые скирты"
 engine_tech_2_desc: "С большим оружием и более тяжелыми бронежилетами новое поколение танков требует более мощного двигателя, чтобы оставаться мобильным."
 engine_tech_3_desc: "Механизированная война — это форма боевых действий, которая требует быстрого принятия решений и быстрого перемещения войск и поставок."

 armor_tech_1_tt: "Включает усовершенствование стоимости бронетранспортера в 5 и выше."
 armor_tech_2_tt: "Включает повышение уровня боевой готовности на 10 и более единиц."
 armor_tech_3_tt: "Включает повышение уровня боевого состава до 15 и выше."
 armor_tech_4_tt: "Включает повышение уровня боезаряда в 18 и более лет."

 light_tank_chassis_desc: "Маленький и компактный шасси, идеальный для дешевого и легкого автомобиля, предназначенного для выполнения таких задач, как разведка и пожарная поддержка; его ограниченная грузоподъемность делает его непригодным для ношения тяжелых бронежилетов или больших пушек."
 amphibious_tank_chassis_desc: "Для этого должны быть установлены строгие ограничения в отношении размеров оружия и толщины бронежилетов, на которые распространяется транспортное средство."
 heavy_tank_chassis_desc: "Большой шасси, который может монтировать тяжелый пистолет, толстые доспехи или и то, и другое."
 super_heavy_tank_chassis_desc: "Огромная машина, способная установить самые тяжелые бронежилеты и самые большие ружья, но, следовательно, довольно медленные и ненадежные."
 modern_tank_chassis_desc: "Модернизированный шасси, который в значительной степени заимствован из предыдущих средних цистерн, но в то же время делает гораздо больший упор на скорость и маневренность, допуская при этом больше бронежилетов и пушек, чем обычно перевозится на средних емкостях."

 tank_light_two_man_tank_turret_desc: "Турнир, который позволяет двум членам экипажа совместно выполнять работу, связанную с эксплуатацией оружия и наблюдением за ситуацией, по-прежнему не позволяет обеспечить эффективное разделение труда между членами экипажа."
 tank_medium_two_man_tank_turret_desc: "Турнир, который позволяет двум членам экипажа совместно выполнять работу, связанную с эксплуатацией оружия и наблюдением за ситуацией, по-прежнему не позволяет обеспечить эффективное разделение труда между членами экипажа."
 tank_heavy_two_man_tank_turret_desc: "Турнир, который позволяет двум членам экипажа совместно выполнять работу, связанную с эксплуатацией оружия и наблюдением за ситуацией, по-прежнему не позволяет обеспечить эффективное разделение труда между членами экипажа."

 auto_loader_desc: "Автоматический механизм, который загружает корпуса и позволяет цистерне сохранять высокую скорость возгорания в течение длительного периода времени."

