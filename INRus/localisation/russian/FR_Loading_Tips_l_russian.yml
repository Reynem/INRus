l_russian:

LOADING_TIP_0: "Движение, которое мы инициируем в Испании, не является копией иностранного движения."
LOADING_TIP_1: "Легче найти людей, которые добровольно умрут, чем найти тех, кто готов терпеть боль с терпением."
LOADING_TIP_2: "Знаешь, выборы не выигрываются с молитвами."
LOADING_TIP_3: "Это не конституция, это проституция."
LOADING_TIP_4: "Я польский, и поэтому у меня есть польские обязанности и отчёты."
LOADING_TIP_5: "Структура не может существовать без власти."
LOADING_TIP_6: "Франция не может быть разрушена. Она старая страна, которая, несмотря на свои несчастья, благодаря своему прошлому имеет и всегда будет иметь огромный престиж в мире, независимо от той судьбы, которую она совершила."
LOADING_TIP_7: "На кладбище полно незаменимых людей."
LOADING_TIP_8: "У Франции нет друзей, только интересы."
LOADING_TIP_9: "Патриотизм - это когда любовь к своему народу на первом месте; национализм, когда ненависть к другим людям, кроме тебя, на первом месте."
LOADING_TIP_10: "Нет необходимости хоронить правду, достаточно просто отсрочить ее, пока никому не будет дело до Наполеона Бонапарта."
LOADING_TIP_11: "Если хочешь, чтобы всё было хорошо, делай это сам."
LOADING_TIP_12: "Лучший способ сделать каждого бедного - это настаивать на равенстве богатства."
LOADING_TIP_13: "В политике... никогда не отступать, никогда не отступать... никогда не признай ошибку."
LOADING_TIP_14: "Свобода - это право дисциплинировать себя, чтобы не быть дисциплинированными другими."
LOADING_TIP_15: "Америка - единственная страна в истории, которая чудом перешла от варварства к дегенерации без обычного интервала цивилизации."
LOADING_TIP_16: "Мы представляем режим еврейской Палестины следующим образом: большинство населения будет евреем, но равные права для всех арабских граждан будут не только гарантированы, но и выполнены."
LOADING_TIP_17: "Если британская нация - это то, что я думаю, в конце концов она даст нам лучшее предложение."
LOADING_TIP_18: "Я говорю вам, мистер Уитли, что если бы мне пришлось жить в таких условиях, я бы сам стал революционером."
LOADING_TIP_19: "Виг - это человек, который готов пойти на кол за свои убеждения, но который не отправит туда своих противников."
LOADING_TIP_20: "Задача руководства заключается не в том, чтобы внушить величие человечеству, а в том, чтобы добиться его, ибо величие уже существует."
LOADING_TIP_21: "Избавься от худших из тех, кто творит неприятности, особенно от этого болтовни с имбицилем. -Н-Освальд Мозли, говоря о Джеке Черчилле."
LOADING_TIP_22: "Британцы вступили в эту новую эпоху, они приносят с собой опыт веков и мудрость тысячелетия."
LOADING_TIP_23: "Социализм - это песня сирены, которая уничтожит тех, кто идет по ее пути. Наша судьба может быть достигнута только за счет сохранения знаний и опыта наших предков."
LOADING_TIP_24: "Лидеры, которые наслаждаются вчерашними успехами, просто не сделали достаточно сегодня."
LOADING_TIP_25: "Я бы предпочел быть оппортунистом и плавать, чем идти на дно с моими принципами на шее."
LOADING_TIP_26: "Война закончилась бы, если бы мёртвые могли вернуться."
LOADING_TIP_27: "Любой офицер, который вступает в действие без своего меча, одет ненадлежащим образом."
LOADING_TIP_28: "Консенсус существовал как средство для того, чтобы победить взаимного противника, с этим врагом, побежденным, мир разделен между нашими двумя Империями."
LOADING_TIP_29: "Я империалист, потому что я не буду колониальным."
LOADING_TIP_30: "Всего сто лет назад мы сражались, чтобы предотвратить французское господство в Европе, во время Великой войны, казалось, мы сражались, чтобы гарантировать это."
LOADING_TIP_31: "Слава Богу, королевский флот. Уинстон Черчилль."
LOADING_TIP_32: "Сегодня мы отмечаем новую эру в британской политике и светлое будущее для Британии и ее Империи."
LOADING_TIP_33: "Бог призвал британцев принести цивилизацию во все уголки земного шара."
LOADING_TIP_34: "Империализм - это дух, отношение ума, непобедимая надежда. Вы можете произносить его тысячу способов, не истощая его содержания. Это чувство судьбы Англии."
LOADING_TIP_35: "Вряд ли можно ожидать, что мы поставим 400 000 или 500 000 человек на поле и с готовностью примем позицию, заключающуюся в том, чтобы не иметь больше голоса и не получать больше внимания, чем если бы мы были игрушечной автоматой."
LOADING_TIP_36: "Если я также империалист, то это потому, что судьба английской расы, благодаря ее инсулярному положению и долгому превосходству в море, была направлена на коренные корни в различных частях мира."
LOADING_TIP_37: "Когда Франция побеждает, я не буду праздновать; я буду оплакивать, что мы никогда больше не найдем врага, подобного тому, который был у нас во Франции."
LOADING_TIP_38: "Не говорите мне о зверствах на войне, вся война - это зло."
LOADING_TIP_39: "Мы ожидаем наш ужин не от доброжелательности мясника, пивоваря или пекаря, а от их собственного интереса."
LOADING_TIP_40: "Либерализм - это доверие народа, сдерживаемого благоразумием."
LOADING_TIP_41: "Единственное, что до сих пор печалит меня в битвах, это сердцебиение моей матери."
LOADING_TIP_42: "Задача модернизации состоит в том, чтобы жить без иллюзий и без разочарования."
LOADING_TIP_43: "Старый умирает, а новый не может родиться."
LOADING_TIP_44: "Италия никогда не найдет себя сияющей обувью немцев!"
LOADING_TIP_45: "Превосходство рабов в морали начинается с того момента, когда само «воссоединение» становится творческим и рождает ценности: возрождение природы, отрицающей истинную реакцию, действия, и компенсирует себя воображаемой местью. n- Фридрих Ницше"
LOADING_TIP_46: "Именно потерянное сокровище Рейна обязывает богов Запада вести кровопролитную борьбу против нас, нас, которым угрожает тьма Востока."
LOADING_TIP_47: "Чем больше я вижу мужчин, тем больше мне нравится моя собака."
LOADING_TIP_48: "Христианство - и это его величайшее достоинство - несколько смягчило эту жестокую германскую любовь к войне, но оно не могло ее уничтожить."
LOADING_TIP_49: "Главное различие между нашим движением и другими социалистами в Гамбурге заключается в том, что нам не стыдно признавать, что немецкий пролетариат выше всех остальных."
LOADING_TIP_50: "Редкость - это случай, когда завоеванный удовлетворен завоевателем. n- Konrad Adenauer"
LOADING_TIP_51: "Иногда труднее бороться с моим начальством, чем с французами."
LOADING_TIP_52: "Это хорошо известный принцип войны, что тот, кто пытается держаться за все одновременно, заканчивает ничего не удерживая."
LOADING_TIP_53: "Мы должны были знать лучше после Великой войны."
LOADING_TIP_54: "Дипломатия без военной силы - это как музыка без инструментов."
LOADING_TIP_55: "Родится полевой сортировщик, но не сделанный!"
LOADING_TIP_56: "В критический момент я подвел Германию, не проиграв войну, а отказавшись."
LOADING_TIP_57: "Я искал место на солнце для Германии, но я заставил Германию упасть дальше от славы, чем можно представить. Если у Германии не было места на солнце до войны, она была приговорена к вечному осуждению за столами Версаля."
LOADING_TIP_58: "Побеждать можно, но никогда не удивляться."
LOADING_TIP_59: "Военный едва может гордиться тем, что"smitten a sleeping enemy"; it is more a matter of shame, simply, for the one smitten. \n- Admiral Isoroku Yamamoto"
LOADING_TIP_60: "Самая жестокая змея может быть побеждена муравьями."
LOADING_TIP_61: "Объедините свою полную силу, чтобы быть посвящённым строительству на будущее."
LOADING_TIP_62: "Мы только что получили ваш ответ. Японская армия будет рассматривать только капитуляцию."
LOADING_TIP_63: "Генерал Чжан Цзунчханг был назван : "Три Донкт-Знания", потому что он не знал, насколько большой была его армия, казначейство или гарем."
LOADING_TIP_64: "Война началась со всех уголков Китая, и я обязан принять ее! Выдержка из «Пекинской речи» Чжана Зуолина."
LOADING_TIP_65: "Пламя страны, сползающей к разрушению, действительно плохое наследство."
LOADING_TIP_66: "Китай - большая страна, населена многими китайцами."
LOADING_TIP_67: "Либо я побеждаю Константинополь, либо Константинополь побеждает меня."
LOADING_TIP_68: "Нет линии обороны, но оборонная территория, и эта территория является всей родиной."
LOADING_TIP_69: "Если империализм не будет изгнан из страны, Китай погибнет как нация."
LOADING_TIP_70: "Я вполне доволен тем, что социалистические собаки едят друг друга."
LOADING_TIP_71: "Некоторые видят Феникию в доме Седара и Христа, а другие видят его Домс и Минаретс."
LOADING_TIP_72: "Политика - это игра джентльмена."
LOADING_TIP_73: "Экономика - это предмет, который не очень уважает свои желания."
LOADING_TIP_74: "Трудящиеся - мужчины и женщины - из всех стран ставят себя под знамя Третьего Интернационала. Это знаменатель вашей приближающейся победы!"
LOADING_TIP_75: "Все, что мы делаем, каждое действие должно соответствовать высшим идеалам революции."
LOADING_TIP_76: "Проблема со свободными выборами в том, что ты никогда не знаешь, как они обернутся. - Вячеслав Молотов"
LOADING_TIP_77: "История повторяется, во-первых, как трагедия, во-вторых, как фарс."
LOADING_TIP_78: "Проблема заключается не в том, что человек позволяет себя эксплуатировать, а в том, чтобы люди с удовольствием сидели и смотрели."
LOADING_TIP_79: "Есть десятилетия, когда ничего не происходит, и есть недели, где случаются десятилетия."
LOADING_TIP_80: "Один человек с пистолетом может контролировать сто человек без Владимира Ленина."
LOADING_TIP_81: "Все объясняют, что дискуссии о социализме чрезвычайно туманны; эта мрачность во многом объясняется тем, что современные социалисты используют терминологию, которая больше не соответствует их идеям."
LOADING_TIP_82: "Критика во время войны необходима для поддержания любого демократического правления."
LOADING_TIP_83: "Долг, честь, страна" — those three hallowed words reverently dictate what you ought to be, what you can be, what you will be. They are your rallying point to build courage when courage seems to fail, to regain faith when there seems to be little cause for faith, to create hope when hope becomes forlorn.\n- Douglas MacArthur"
LOADING_TIP_84: "Я не либерал, я тот, кем я хочу быть - я радикал."
LOADING_TIP_85: "Вся Мексика не стоит ведро теплой мочи. Джон Нэнс Гарнер, о трудностях, связанных с предвыборной агитацией."
LOADING_TIP_86: "Когда они называют список в Сенате, сенаторы не знают, отвечать ли на "Препровождение" или "Не вина"."
LOADING_TIP_87: "Называй это политикой Большого Стика, если нужно."
LOADING_TIP_88: "Мы довольно грязные люди, не так ли, чтобы сидеть и смотреть, пока Англия и Франция сражаются за наши битвы и сковывают золото в наши карманы."
LOADING_TIP_89: "Проблема, с которой сталкиваются некоторые из вас, молодые – вы должны найти альтернативу войне."
LOADING_TIP_90: "Под динамичным общим господством Христа они вносят свой массовый интеллект в дело скорейшего установления совершенно нового общественного порядка, который навсегда отменит невежество, депрессию, нищету и войну."
LOADING_TIP_91: "- Джон Брэдфорд."
LOADING_TIP_92: "Почему бы евреям и арабам просто не сесть и не уладить это как добрые христиане?"
LOADING_TIP_93: "Быть застреленным - не достаточно наказание для меня; меня нужно расквартировать! [...] Я предал свой народ и помог Джугашвили и Берии, этим дегенератам, порабощённой Джорджией и поставив вечеринку Ленина на колени."
LOADING_TIP_94: "Король является таким же вымышленным авторитетом, как и Бог, который сделал атеизм и республиканизм двумя лицами одной и той же монеты."
LOADING_TIP_95: "Европейское общество истощено, они не сочувствуют чужой боли, они даже не узнают ее, и они заботятся только об одной вещи - быть сами по себе, мирно, без проблем..."
LOADING_TIP_96: "Они скажут - здесь был человек, который видел свою нацию в большой опасности и имел возможность исправить это, даже если средства были довольно неудачными. Разница между тобой и мной, кажется, в том, что я не боюсь странной этой силы."
LOADING_TIP_97: "Рано верблюд пройдет через игольное ушко, чем великий человек будет найден на выборах."
LOADING_TIP_98: "Эти работы привели сюда всех этих людей, что-то должно быть сделано, чтобы вернуть их на работу."
LOADING_TIP_99: "Оптимизм - это трусость."
LOADING_TIP_100: "Естественно, мы верим в нашу собственную расу. любой мужчина или женщина, достойный чего-либо, верит в свою собственную расу, как он верит в свою собственную семью. Но если ты веришь в свою собственную расу или в свою собственную семью, это не значит, что ты хочешь навредить другим расам или другим семьям."
LOADING_TIP_101: "Кровь героев ближе к Богу, чем чернила философов и молитвы верующих."
LOADING_TIP_102: "Современные люди хвастаются тем, что изменения, которые они навязывают миру, становятся все более и более «искусственными»."
LOADING_TIP_103: "Современный человек, вместо того чтобы подниматься к правде, стремится притащить истину к своему собственному уровню."
LOADING_TIP_104: "- Генерал Анри Гуро, мы вернулись."
LOADING_TIP_105: "Феникии нужны люди, сильные люди."
LOADING_TIP_106: "Тот, кто сбежал от битвы за жизнь, словно сбежал от битвы за правду."
LOADING_TIP_108: "Когда-нибудь будет только 5 Королей, 4 в игровых кардах и король Англии."
LOADING_TIP_109: "История глупа, так как она повторяется и не дает советов людям и не исправляет их."
LOADING_TIP_110: "Нелегко управлять Египтом, потому что люди, которые улетают на Седьмое Небесо, также отправят тебя в Седьмой ад."
LOADING_TIP_111: "Я в те дни, когда человек застрял между Землёй и Небом."
LOADING_TIP_112: "Развращение правителей - это развращение правителей."
