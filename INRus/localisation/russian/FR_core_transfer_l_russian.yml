l_russian:

  ### Events ###
 gencores.1.t:0 "[From.GetName] просит вернуть национальную территорию"
 gencores.1.d:0 "Территориальные споры между нами и [From.GetNameDef] напрасно ухудшили наши дипломатические отношения. [From.GetAdjectiveCap] дипломаты передали нам предложение о возвращении их спорных территорий, находящихся под нашим контролем. Хотя уступка земель может показаться недальновидной, [From.GetName] уверяет нас, что это лучший способ улучшить отношения между нашими странами."
 gencores.1.a:0 "Это предложение разумно"
 gencores.1.b:0 "Мы никогда на это не согласимся"
  #
 gencores.2.t:0 "[From.GetName] соглашается вернуть спорную территорию"
 gencores.2.d:0 "Похоже, [From.GetName] признает необходимость улучшения отношений с нашей страной и соглашается вернуть спорную территорию под наш суверенитет."
 gencores.2.a:0 "Тост за наших [From.GetAdjective] друзей!"
  #
 gencores.3.t:0 "[From.GetName] отказывается возвращать спорную территорию"
 gencores.3.d:0 "Похоже, [From.GetName] не видит необходимости улучшать отношения с нашей страной и отказывается возвращать спорные территории."
 gencores.3.a:0 "Проклятье!"

 fr.political.75.t:0 "Земли [From.From.GetAdjective]"
 fr.political.75.d:0 "Правительство [Root.GetAdjective] обсуждало, как поступить с землями [return_to.GetAdjective], которые мы сейчас занимаем и на которые у нас нет законных претензий. Стоит ли нам вернуть эти территории?"
 fr.political.75.a:0 "Да, вернуть им все земли"
 KR_will_return_all:0 "Все подконтрольные прибрежные или смежные регионы, являющиеся национальными или претендуемыми для [return_to.GetAdjective], будут возвращены стране §Y[return_to.GetNameDef]§!.\n\nЭто §Rне§! повлияет на регионы, являющиеся §Yнациональными§! или §Yпретендуемыми§! для [Root.GetAdjective]."
 fr.political.75.b:0 "Да, вернуть им земли... но оставить себе самые важные регионы"
 KR_will_return_rest:0 "Все подконтрольные прибрежные или смежные регионы, являющиеся национальными или претендуемыми для [return_to.GetAdjective], будут возвращены стране §Y[return_to.GetNameDef]§!.\n\nЭто §Rне§! повлияет на §Yнациональные§! или §Yпретендуемые§! регионы [Root.GetAdjective], а также на §Yжизненно важные§! территории (например, каналы)."
 fr.political.75.c:0 "Вернуть только их национальные земли"
 KR_will_return_cores:0 "Все подконтрольные прибрежные или смежные регионы, являющиеся национальными для [return_to.GetAdjective], будут возвращены стране §Y[return_to.GetNameDef]§!.\n\nЭто §Rне§! повлияет на §Yнациональные§! или §Yпретендуемые§! регионы [Root.GetAdjective], а также на §Yжизненно важные§! территории (например, каналы). Любые §Yпретензии§! [return_to.GetAdjective] также останутся за нами."
 fr.political.75.e:0 "Мы оставим всё себе!"
 KR_will_not_return:0 "Мы §Rне§! будем возвращать их земли и больше не станем рассматривать подобные прошения."

 kr.political.76.t:0 "[From.GetNameDefCap] возвращает земли [Root.GetAdjective]"
 kr.political.76.d:0 "Наши союзники из [From.GetNameDefCap] вернули нам часть наших законных земель!"
 kr.political.76.a:0 "Замечательно!"

