l_russian:

 ### Events ###
 gencores.1.t: "[From.GetName] просит вернуть их основную территорию"
 gencores.1.d: "Территориальные споры между нами и [From.GetName] напрасно испортили наши дипломатические отношения. Дипломаты представили нам предложение, в котором излагается возвращение их спорной территории, которая в настоящее время находится под нашим контролем. Хотя сдача территории может показаться недальновидной, GetName уверяет нас, что это лучший способ улучшить отношения нашей страны."
 gencores.1.a: "Это предложение является разумным"
 gencores.1.b: "Мы никогда не можем согласиться с этим"
 #
 gencores.2.t: "[From.GetName] соглашается вернуть спорную территорию"
 gencores.2.d: "Похоже, что [GetName] увидел необходимость улучшить отношения нашей страны и согласился вернуть спорную территорию в наш суверенитет."
 gencores.2.a: "Тост за наших друзей (от .GetAdjectiveCap)."
 #
 gencores.3.t: "[From.GetName] отказывается возвращать спорную территорию"
 gencores.3.d: "Похоже, что [GetName] не видит необходимости в улучшении отношений нашей страны и отказывается возвращать какую-либо спорную территорию."
 gencores.3.a: "Проклятье."

 fr.political.75.t: "(перенаправлено с «GetAdjective») Земля"
 fr.political.75.d: "Правительство [Root.GetAdjective] обсуждает, что делать с [return to]. Земли, которые мы в настоящее время занимаем - земли, на которые у нас нет законных претензий. Должны ли мы вернуть им эту землю?"
 fr.political.75.a: "Верните им всю землю"
 KR_will_return_all: "Все прибрежные или смежные государства, которые являются [возвратными]. GetAdjective ядра или претензии будут возвращены в §Y [return to]. GetNameDef]§!.\n\n Обратите внимание, что это будет §Rnot§! включать государства, которые являются [Root.GetAdjective] §Yclaimed§! или §Ycore§! государства."
 fr.political.75.b: "Да, возвращайте им землю, но сохраняйте самые важные состояния."
 KR_will_return_rest: "Все прибрежные или смежные государства, которые являются [возвратными]. GetAdjective ядра или претензии будут возвращены в §Y [return to]. GetNameDef]§!.\n\n Обратите внимание, что это будет §Rnot§! включать государства [Root.GetAdjective] §Yclaimed§! или §Ycore§! И это не будет включать в себя §Yvital §! Такие страны как Каналы."
 fr.political.75.c: "Вернуть только свои земли"
 KR_will_return_cores: "Все прибрежные или смежные государства, которые являются [возвратными]. В этом случае ядра GetAdjective будут возвращены в §Y. GetNameDef]§!.\n\n Обратите внимание, что это будет §Rnot§! включать [Root.GetAdjective] §Yclaimed§! или §Ycore§! Ни государства, ни жизненно важных! Такие страны как Каналы. Возвращение (Return to). GetAdjective] §Yclaims§! также будет сохранена."
 fr.political.75.e: "Мы все это сохраним!"
 KR_will_not_return: "Мы будем §Rnot§! Мы не вернем им их земли, и мы не будем просить об этом снова."

 kr.political.76.t: "[From.GetNameDefCap] Возвращение [Root.GetAdjective] Земля"
 kr.political.76.d: "Наши союзники в [GetNameDefCap] вернули нам некоторые из наших собственных земель!"
 kr.political.76.a: "Отлично!"

