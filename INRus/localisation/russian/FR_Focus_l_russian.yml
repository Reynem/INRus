 ### Generic Focuses ###
 generic_army_effort: "Современная война"
 generic_army_effort_desc: "Великая война, начиная с ее начала и заканчивая ее окончанием, навсегда изменила войну, окончательно прекратив хватку Наполеона за военные мысли и подтвердив крайние сроки применения винтовки, пулемётов и артиллерийских пушек."
 generic_equipment_effort: "Модернизация оборудования"
 generic_equipment_effort_desc: "В течение долгого времени военные прорывы были медленными, и было достаточно хорошей болтовни, однако эти винтовки XIX века совершенно не на месте на поле боя после Великой войны, мы должны перестать быть самоуспокоенными и получить новое снаряжение."
 generic_motorization_effort: "Армия Моторизация"
 generic_motorization_effort_desc: "Грузовик стал не просто транспортным средством и быстро интегрирован в мобильную военную тактику, мы должны избавиться от устаревшего мышления и использовать моторизацию, чтобы ускорить наши наступательные действия и подкрепление."
 generic_doctrine_effort: "Изучение великой войны"
 generic_doctrine_effort_desc: "Мы знаем о Великой войне, но чему мы научились из нее? За пять лет конфликта бесчисленное количество солдат погибло, чтобы научить нас новой динамике войны. Если мы не узнаем о них, то наши солдаты столкнутся с той же судьбой на поле боя."
 generic_equipment_effort_2: "Исследования оборудования"
 generic_equipment_effort_2_desc: "Возможно, мы догнали современное оборудование, но новые дизайны уже делают наши устаревшие, несмотря на то, что мы должны быть терпеливыми и быть уверенными, что мы никогда не останемся на один год в оборудовании, это означает, что нам придется начать разработку своих собственных дизайнов."
 generic_mechanization_effort: "Механизированная военная служба"
 generic_mechanization_effort_desc: "Грузовики плохо проехали на переднем фронте, но теперь, похоже, мы можем встретиться на полпути между грузовиками и танками, бронетранспортеры могут привести войска непосредственно в бою, защитить их от огня и даже обеспечить мощную огненную поддержку, если потребуется."
 generic_doctrine_effort_2: "Военные учения"
 generic_doctrine_effort_2_desc: "Войны - это нечто большее, чем просто мирное развлечение для генералов, они позволяют нам испытывать как истинную, так и испытанную и революционную тактику, не теряя бесчисленное количество жизней. Это позволяет нам завершить наши теоретические открытия."
 generic_doctrine_effort_3: "Военные игры"
 generic_doctrine_effort_3_desc: "Принимая «презентативные» битвы, мы можем имитировать военные сценарии, не будучи в состоянии воевать. Это позволит нашим офицерам дышать свежим воздухом с точки зрения военной тактики."
 generic_equipment_effort_3: "Проскоки оборудования"
 generic_equipment_effort_3_desc: "Мы пришли к такому опыту в области технических исследований, что мы больше не ограничимся наймом или покупкой иностранного оборудования для получения современного военного снаряжения, даже великие силы могут вскоре быть удивлены тем, что скоро будет в руках наших солдат."
 generic_armor_effort: "Бронированные боевые действия"
 generic_armor_effort_desc: "Танки - это вершина современной войны. Мобильные машины, вооруженные пушками, достойными артиллерии и непроницаемыми для средней винтовки. Даже если мы произведем мало, мы продырявим наших врагов разумным использованием этих стальных бемотов."
 generic_special_forces: "Специальные силы"
 generic_special_forces_desc: "Специальные силы — это больше, чем элитные отряды старой армии, даже новобранец может держать себя на поле боя, но некоторые ситуации настолько враждебны, что им нужны специально обученные люди, горные хребты, амфибийные посадки, воздушные нападения."
 generic_soldier_effort: "Приоритизировать солдата"
 generic_soldier_effort_desc: "Солдат является ядром любой армии, и вполне естественно, что мы сосредоточимся на них, а не на офицерах."
 generic_officer_effort: "Приоритизировать сотрудника"
 generic_officer_effort_desc: "Есть люди, которые следуют, и есть люди, которые ведут. Когда человеку некому следовать, что он будет делать? Он сам должен будет поднять мантию, пытаясь возглавить, несмотря на то, что он не знает, как это сделать."
 generic_arms_imports: "Импорт оружия"
 generic_arms_imports_desc: "Очевидно, что нам понадобится помощь в оснащении нашей армии, и, возможно, нам следует импортировать партию оружия у одной из крупнейших держав?"
 generic_recruitment: "Славьте солдата"
 generic_recruitment_desc: "Одна из главных причин, по которой люди отходят от армии, заключается в том, что они видят слишком много боли ради слишком малой выгоды."
 generic_reform_officer_corps: "Реформировать наш офицерский корпус"
 generic_reform_officer_corps_desc: "В эти быстро меняющиеся времена войны мы должны обеспечить, чтобы наш офицерский корпус был полностью обновлен."
 generic_reform_supply_lines: "Современные линии снабжения"
 generic_reform_supply_lines_desc: "Эпоха лошадиных линий снабжения - это не больше. Мы должны обеспечить, чтобы мы использовали каждый край, который мы можем получить в снабжении транспортом. Мы будем использовать грузовики и самолеты, что угодно, пока они более эффективны, чем наша нынешняя система."
 generic_national_training_school: "Национальная школа профессиональной подготовки"
 generic_national_training_school_desc: "Создавая национальную школу профессиональной подготовки, мы можем обеспечить, чтобы новые офицеры получали высшее образование."
 generic_mil_industrial_complex: "Военно-промышленный комплекс"
 generic_mil_industrial_complex_desc: "Согласно всем известным законам авиации, пчела не должна летать, ее крылья слишком малы, чтобы убрать ее жирное маленькое тело с земли. Пчела, конечно же, летает, потому что пчелам плевать, что люди считают невозможным."

 generic_aviation_effort: "Национальные военно-воздушные силы"
 generic_aviation_effort_tt: "Недостаточно площадок для базы §YAir!"
 generic_aviation_effort_desc: "Поле авиации родилось почти во время Великой войны, даже спустя два десятилетия после этой войны, оно все еще новое, и все страны стремятся быть готовыми к следующему времени, когда их самолеты могут быть призваны к войне. Мы тоже должны найти прочные военно-воздушные силы для их организации."
 generic_fighter_focus: "Воздушная высота"
 generic_fighter_focus_desc: "По мере того, как самолеты становятся более быстрыми, более бронированными и вооруженными, мы должны приложить все усилия, чтобы обеспечить контроль над воздухом."
 generic_bomber_focus: "Стратегическая бомбардировка"
 generic_bomber_focus_desc: "Даже когда они были совершенно новыми, бомбардировщики вдохновляли их на страх, и многие видели их потенциал. По мере увеличения полезной нагрузки даже артиллерийские снаряды Великой войны не поддаются сопоставлению. Когда-нибудь мы сможем даже превзойти их и уничтожить целые города или регионы за один раз."
 generic_aviation_effort_2: "Современная атмосферная тактика"
 generic_aviation_effort_2_desc: "Самолёты уже давно перестали быть лишь инструментом разведки и преследования, полностью включив их в наши военные операции, военно-воздушные силы способны нанести столь же большой ущерб и продвигать наши операции так же, как и средневековое командование армии."
 generic_CAS_effort: "Поддержка при закрытых воздушных перевозках"
 generic_CAS_effort_desc: "В то время как истребители и бомбардировщики могут косвенно повлиять на битву, специализированные самолеты КАС имеют как боеспособность, так и вооружение, необходимые для совершения ударов снарядами и бомбардировок по наземным целям, причиняя серьезный ущерб неподготовленным армиям при достойном ведении боевых действий с воздуха."
 generic_rocket_effort: "Экспериментальная скалистость"
 generic_rocket_effort_desc: "Ракетное поле, возможно, является одной из самых новых областей военной науки. Если верить нашим ученым, то ракетные двигатели могут достичь скоростей, которые позорят радиальные двигатели. Некоторые говорят, что они могут двигаться даже быстрее звука, конечно, чрезвычайно захватывающе."
 generic_NAV_effort: "Морская авиация"
 generic_NAV_effort_desc: "Возможно, один из крупных прорывов в военно-морской войне, военные бомбардировщики могут уничтожать вражеские флоты торпедами и другими специализированными военно-морскими грузами, такими, как мины. Поддерживая наши флоты, они могут бросать вызов капиталистическим кораблям и разрушать военно-морские экраны."

 generic_naval_effort: "Современные докьярды"
 generic_naval_effort_tt: "Недостаточно площадок для CNYNAval Dockyrds §!"
 generic_naval_effort_desc: "Если мы хотим создать сильный флот, нам нужно сначала произвести его. Методы судостроения эволюционировали, и старые сухие доки должны быть модернизированы так же сильно, как новые верфь должны быть построены с нуля. Современный корабль не когт, и мы должны видеть большой, чтобы иметь морской флот."
 generic_flexible_navy: "Гибкая тактика"
 generic_flexible_navy_desc: "У нас никогда не будет мореплаваний мировых держав, способных очистить все моря от оппозиции, но это не значит, что наш флот будет прятаться в порту."
 generic_large_navy: "Проекция мощности"
 generic_large_navy_desc: "Наш флот, возможно, еще не в состоянии соперничать с большими моряками этого мира, но умело выбирая наши бои и сохраняя сосредоточенность флота, мы можем убедиться, что любая конфронтация в наших интересах, сохраняя при этом мощный флот, который может прорваться слабее мореплавателей."
 generic_submarine_effort: "Подводные бои"
 generic_submarine_effort_desc: "Подводные боевые действия - это самое волнующее военно-морское развитие со времени изобретения торпедного судна, и это бросает вызов даже самым классическим доктринам морской войны."
 generic_cruiser_effort: "Скриншотные суда"
 generic_cruiser_effort_desc: "Крузеры - это не просто "дешевые боевые корабли", и такие устаревшие мысли подрывают потенциал этих кораблей. Мы должны использовать их как сопровождение наших столиц, поскольку они очень уязвимы для морских бомбардировщиков и небольших кораблей, как торпедные лодки."
 generic_destroyer_effort: "Антиподводные бои"
 generic_destroyer_effort_desc: "Изучая проектирование и стратегическое использование подводных лодок, мы также учимся бороться с ними. Нашим разрушителям потребуется специализированное оборудование, такое, как глубинные заряды и специальные конструкции, как легкие, так и малые, для обеспечения того, чтобы они могли эффективно сопровождать конвои и патрулировать."
 generic_capital_ships_effort: "Капитальные суда"
 generic_capital_ships_effort_desc: "В конце концов, флот — ничто без центральной части, и как старый боевой корабль, так и современный Карриер подходят к этой роли, хотя они уязвимы в непосредственной конфронтации, они могут нанести огромный ущерб вражеским флотам, если мы позволим им снарядить и сбить вражеские корабли с безопасного расстояния."

 generic_industrial_effort: "Промышленные методы"
 generic_industrial_effort_desc: "Для создания крупной промышленной базы нам нужно будет создать основы современной промышленности и, возможно, даже сделать первоначальный выбор. Концентрированные или рассредоточенные промышленные центры, инвестируя средства в машинное оборудование и строительные инструменты."
 generic_construction_effort: "Субсидии для промышленности"
 generic_construction_effort_tt: "Недостаточно площадок для строительства § § Гражданской фабрики!"
 generic_construction_effort_desc: "Здоровая и сильная индустрия появляется не просто из ниоткуда, хотя нам, возможно, придется позже начать более амбициозные проекты, мы должны начать с обеспечения того, чтобы те, кто обладает хорошими управленческими навыками, могли начать здоровые, успешные компании, которые впоследствии могут стать гигантами."
 generic_production_effort: "Армия штата"
 generic_production_effort_tt: "Недостаточно площадок для строительства военного завода!"
 generic_production_effort_desc: "До тех пор, пока мы не сможем произвести собственное военное снаряжение, мы должны создать современные арсеналы для нашей армии. Их цель довольно скромная: закупить снаряжение, необходимое нашей армии, используя государственные средства, гражданское производство и простую добычу, но это лучше, чем не получать никаких новых винтовок."
 generic_construction_effort_2: "Промышленные центры"
 generic_construction_effort_2_desc: "Предпринимательство — это одно, но для того, чтобы экономика была достойной даже региональной силы, нам нужно будет развивать крупные промышленные регионы, которые произвели промышленную революцию."
 generic_production_effort_2: "Военная промышленность"
 generic_production_effort_2_desc: "Мы должны производить нашу военную технику, если хотим, чтобы наша армия была не просто резервными силами."
 generic_production_effort_3: "Военная промышленность"
 generic_production_effort_3_desc: "Мы наконец достигли такой точки, когда у нас есть компании, способные построить необходимое оборудование, даже если их производство все еще ограничено, однако наши потребности по-прежнему велики, и, предоставляя им абсолютную поддержку иностранным компаниям, они постепенно сократят наши потребности."
 generic_infrastructure_effort: "Национальная инфраструктура"
 generic_infrastructure_effort_desc: "Наша растущая индустрия требует прочной инфраструктуры для обеспечения транзита товаров. Мы должны покончить с хаотичностью, планированием городов и, наконец, проложить дороги нашей страны. Те, кто существует, те, кто будет расширен или связан, и те, кто еще должен быть."
 generic_infrastructure_effort_tt: "Недостаточно площадок для §YInfrastructure§!"
 generic_synth_oil_effort_tt: "Недостаточно площадок для §синтетического нефтеперерабатывающего завода!"
 generic_infrastructure_effort_2: "Железнодорожные сети"
 generic_infrastructure_effort_2_desc: "Современным странам нужны железнодорожные сети, способные быстро и эффективно доставлять что-либо из одного пункта страны в другой. Это означает, что нам придется расширять наши железные дороги и создавать перекрестки, которые не появились у нас даже несколько лет назад."
 generic_construction_effort_3: "Промышленные сети"
 generic_construction_effort_3_desc: "Как и автомобильные и железные дороги, промышленность соединена с крупными, расширяющимися сетями, основанными на ресурсах и производстве, импорте и экспорте."

 generic_extra_tech_slot: "Исследовательские советы"
 generic_extra_tech_slot_desc: "Мы должны финансировать научно-исследовательские советы для обеспечения того, чтобы они находили работу до тех пор, пока наша промышленная база не вырастет достаточно, чтобы привлечь частные научно-исследовательские институты."
 generic_extra_tech_slot_2: "Научно-исследовательские институты"
 generic_extra_tech_slot_2_desc: "По мере расширения нашей промышленной базы мы, наконец, переходим от простого производства к разработке и созданию, или, по крайней мере, привлекаем тех, кто это делает."
 generic_technology_sharing: "Обмен технологиями"
 generic_technology_sharing_desc: "Делясь с нашими союзниками техническими достижениями, наша фракция сможет более эффективно проводить военные исследования и разработки."
 generic_secret_weapons: "Секретное оружие"
 generic_secret_weapons_desc: "Заманчиво тратить все дополнительные ресурсы только на разработку танков и самолетов, но секрет победы в войнах лежит в целых новых областях науки; электронике, ракетах и ядерных исследованиях."

 generic_political_effort: "Политическая реформа"
 generic_political_effort_desc: "Для того чтобы добиться перемен в мире, мы должны быть в состоянии добиться перемен в нашей стране, прежде всего необходимо укрепить нашу политическую позицию, покончить со старой политической доктриной и быть готовыми к принятию смелых, амбициозных взглядов на то, как отныне будет управляться наша нация."
 generic_collectivist_ethos_kr: "Объедините народ"
 generic_collectivist_ethos_kr_desc: "Эта эра странная, с ростом коммунизма, хрупкого положения демократии и сохраняющегося авторитарного старого порядка, мы должны защитить нашу страну от внешнего влияния, обеспечив, чтобы наш народ верил в основополагающие ценности нашей страны, по крайней мере, мы смыты противоположными взглядами."
 generic_militarism: "Милитаризм"
 generic_militarism_desc: "Те, кто считает военных необходимым злом, обречены колебаться перед лицом войны, мы вдохнем милитаризм в нашу культуру, чтобы стать народом солдат, если не армией с государством."
 generic_military_youth: "Военная молодежь"
 generic_military_youth_desc: "Организации по содействию дисциплине и политическому воспитанию молодежи в нашей стране будут содействовать укреплению преданности и самопожертвования в начале жизни гражданина, и эти основные ценности должны быть извлечены из самого нежного века, с тем чтобы следующие поколения были готовы бороться за нашу страну."
 generic_ideological_fanaticism: "Идеологический фанатизм"
 generic_ideological_fanaticism_desc: "Наши политические ценности и цели заслуживают смерти не меньше, чем любая древняя вера, любой последователь должен быть готов к смерти, а те, кто блуждает, лучше быть готовыми к смерти, в этой идеологической борьбе как больших, так и малых держав нет промежуточной точки."
 generic_liberty_ethos_kr: "Дух свободы"
 generic_liberty_ethos_kr_desc: "Свобода — это не просто счастливая случайность, она должна быть сохранена против тирании. Великая война и подъем коммунизма ставят под сомнение этот дух, но ни одна страна не является слишком маленькой для того, чтобы возродить пламя в своих правительствах и народах и остерегаться тех, кто пытается его потушить."
 generic_rights_of_man: "Права человека"
 generic_rights_of_man_desc: "Права человека являются, возможно, основополагающим актом современной демократии, отменяющим феодальный порядок и обеспечивающим равные права для всех."
 generic_liberty_research: "Университетские гранты"
 generic_liberty_research_desc: "Современный университет - это великое достижение, позволяющее людям даже скромного происхождения растить себя с помощью высшего образования, но это требует от нас финансирования университетских грантов, чтобы предоставить такой доступ более бедным, но перспективным студентам. Давайте сделаем этот шаг сейчас, эти будущие ученые будут платить дивиденды."
 generic_welfare: "Программы социального обеспечения"
 generic_welfare_desc: "Равенство в правах и равенство в области образования являются двумя важными вехами, но, возможно, экономическое равенство является самым трудным, хотя мы никогда не сможем достичь полного равенства в этой области, мы можем, по крайней мере, поддержать беднейшие слои населения нашей страны программами справедливого социального обеспечения, которые должны помочь нашей потребительской экономике также ускорить темпы роста."
 generic_national_identity: "Национальная идентичность"
 generic_national_identity_desc: "В то время как идеологические дебаты — это дискуссия, в которой мы могли бы заблудиться на протяжении многих лет, мы не должны забывать о том, кто мы в основе, мы уникальны, мы знаем нашу историю, нашу культуру и надеемся, что наша судьба еще более блестяща."

 ### Generic Ideas ###
 generic_liberty_idea: "Дух свободы"
 generic_liberty_idea_desc: "Свобода — это то, что мы обязались сохранить, и это вдохновляет наше население на поддержку нас, даже если они не всегда согласны с нашей политикой или состоянием страны в данный момент."
 generic_militarism_focus: "Милитаризм"
 generic_milstaff_focus: "Национальная школа профессиональной подготовки"
 generic_milstaff_focus_desc: "Более качественная подготовка, более децентрализованная объединительная структура и поощрение новаторских военных, однако, позволят нашему командному корпусу действовать с максимальной эффективностью."
 generic_reformsupply_focus: "Новые системы снабжения"
 generic_recruitment_focus: "Кампания по набору персонала"
 generic_recruitment_focus_desc: "Националистические настроения в сочетании с прославлением Стэндарда Солдата привели к притоку новобранцев в нашу армию."
 generic_militarism_focus_desc: "Наш народ пришел посмотреть на армию как на неотъемлемую часть нашей нации, и каждый призывник играет свою роль, что позволяет нам мобилизовать резервы, ополчение и другие военизированные силы в щепотку."
 generic_military_youth_focus: "Военная молодежь"
 generic_military_youth_focus_desc: "С самого раннего возраста наши граждане учатся военным ценностям и интегрируют их как часть своей жизни, что, безусловно, увеличивает количество специальностей для армии по мере того, как они достигают совершеннолетия."
 generic_ideological_fanaticism_focus: "Идеологический фанатизм"
 generic_ideological_fanaticism_focus_desc: "Наша страна является центром нашей идеологии, а наша идеология — тканью страны."
 generic_liberty_research_idea: "Университетские гранты"
 generic_liberty_research_idea_desc: "Мы платим скромные, но все же относительно достойные университетские гранты, чтобы любой желающий ученик мог получить высшее образование."
 generic_welfare_idea: "Программы социального обеспечения"
 generic_welfare_idea_desc: "Мы обеспечиваем, чтобы беднейшие слои нашего общества получали необходимую им помощь для выживания, с тем чтобы им не пришлось заботиться о себе и однажды они могли работать на нашу экономику."
 generic_arms_payments: "Платежи за оружие"

