 ### Generic Events ###
 genfocus.1.t: "От кого нам импортировать?"
 genfocus.1.d: "После недавнего изъятия нашей нации из-под импорта оружия из другой страны мы столкнулись с очень важным вопросом: у кого мы будем импортировать оружие? Изъятие у Советов очистит нас от большей части оружия, хотя оно и устарело в большинстве случаев. Изъятие у англичан или французов даст нам значительное количество оружия при разумном качестве. Изъятие оружия у немцев позволило бы нам приобрести меньшее количество оружия более высокого качества. Но остается вопрос, у кого нам импортировать оружие?"
 genfocus.2.t: "Продажа оружия в последнее время"
 genfocus.2.d: "Похоже, мы недавно продали оружие! [From.GetName] купили у нас партию оружия, которое сейчас находится в пути к их местоположению. Это оружие не использовалось нашими военными, так что это не повлияет на наше складируемое оружие. На данный момент мы собираем средства от этой продажи."
