l_russian:


 ### Generic Focuses ###
 generic_examine_the_army: "Обследовать армию"
 generic_examine_the_army_desc: "Прежде чем мы сможем построить современную армию, мы должны сначала понять наше нынешнее состояние."
  
 generic_study_unique_doctrines: "Изучение уникальных доктрин"
 generic_study_unique_doctrines_desc: "Все крупные державы разработали свои собственные ответы на вопрос о современных военных действиях, отправляя военных атташе за границу, изучая их публикации и наблюдая за их маневрами, мы можем проанализировать их «уникальные» доктрины, мы примем элементы, которые отвечают нашему национальному характеру и откажемся от тех, кто не делает этого, создавая высший синтез."
  
 generic_army_mobilization: "Усилия по мобилизации и подготовке кадров"
 generic_army_mobilization_desc: "Постоянная армия дорога, но страна, не имеющая надежного плана мобилизации, уязвима."
  
 generic_army_mandatory_conscription: "Обязательная воинская обязанность"
 generic_army_mandatory_conscription_desc: "Призывы к добровольчеству и патриотизму могут зайти только так, чтобы посадить армию, способную защитить наши границы от любой возможной угрозы, мы должны внедрить систему обязательной национальной службы."
  
 generic_army_produce_infantry_weapons: "Производство оружия массового уничтожения"
 generic_army_produce_infantry_weapons_desc: "В настоящее время наши запасы основного пехотного снаряжения, пулемётов и минометов являются недостаточными для затяжного, широкомасштабного конфликта, мы переоснащаем наши заводы для массового производства этого основного оружия, обеспечивая каждому военнослужащему на передовой линии средства, необходимые для борьбы."
  
 generic_army_motorization_effort: "Усилия по моторизации"
 generic_army_motorization_effort_desc: "Последняя война была определена траншем; следующая будет определена двигателем внутреннего сгорания. Наша армия по-прежнему слишком сильно зависит от пеших и лошадей. Эти усилия приступят к длительному и дорогостоящему, но необходимому процессу автомобилизации. Мы предоставим грузовики нашим логистическим и пехотным подразделениям для значительного повышения нашей стратегической мобильности."
  
 generic_army_mechanization_effort: "Механизация"
 generic_army_mechanization_effort_desc: "Чтобы создать настоящую «механизированную» пехоту, которая сможет сражаться вместе с нашими танками и выжить на современном поле боя, мы должны инвестировать в отслеживаемые и полуслежащие машины, эти бронетранспортеры позволят нашей пехоте не отставать от доспехов и целей нападения."
  
 generic_army_armor_effort: "Бронирование"
 generic_army_armor_effort_desc: "Танк является современной кавалерией, решающей движущей силой прорыва и эксплуатации. Эта программа будет финансировать наши бронеразведочные отделы и создавать промышленную базу, необходимую для производства наших современных танков. Этот "Панзервафф" станет стал стальной кулак нашей национальной армии."
  
 generic_army_exercises: "Армейские учения"
 generic_army_exercises_desc: "Доктрина бесполезна, если она существует только на бумаге. Мы проведем крупномасштабные военные учения и военные игры, проведем испытания нашего нового оборудования и командных структур в наиболее реалистичной обстановке. Уроки, извлеченные в ходе смоделированных боевых действий, спасут бесчисленное количество жизней в реальной жизни, а накопленный опыт оживит наши разногласия и превратит их в смертоносную силу."
  
 generic_army_new_textbooks: "Новые учебники"
 generic_army_new_textbooks_desc: "Уроки Великой войны были написаны кровью, но природа войны быстро меняется. Наши военные академии по-прежнему преподают устаревшую тактику. Мы созовем группу наших самых дальновидных офицеров, чтобы написать новые полевые руководства и учебники, с тем чтобы наше следующее поколение лидеров было готово к изменчивому, быстро развивающемуся современному поле боя."
  
 generic_army_continued_doctrine_effort: "Сохраняющаяся доктрина"
 generic_army_continued_doctrine_effort_desc: "Одного нового учебника недостаточно. Война постоянно развивается. Мы должны посвятить постоянную ветвь высшего командования постоянному изучению и совершенствованию нашей земельной доктрины, интегрировав новые технологии и отчеты о боевых действиях по мере их появления. Наши доктрины должны быть живыми, дыхательными."
  
 generic_army_a_new_modern_army: "Современная армия"
 generic_army_a_new_modern_army_desc: "В этот момент наши усилия завершились новым оборудованием, новым руководством и новой доктриной. Этот заключительный акт реформы объединит все наши новые активы, создав «новую типовую армию» в качестве современной, сплоченной и смертоносной боевой силы, готовой обеспечить судьбу нации и защитить наши интересы от любого врага."
  
  # ----------------------------
  # --- ARMY (Grand Battleplan) ---
  # ----------------------------
  
 generic_study_the_guerra_mondiale: "Изучение великой войны"
 generic_study_the_guerra_mondiale_desc: "Мы должны смотреть в прошлое, чтобы понять будущее. Недавняя Великая война была жестокой инсценированной современной войной. Тщательно изучая ее битвы, начиная с грандиозных стратегических планов и заканчивая тактическими неудачами, мы можем извлечь бесценные уроки в области материально-технического обеспечения, выбытия и критической важности огневой мощи и планирования."
  
 generic_army_larger_army: "Более крупная армия"
 generic_army_larger_army_desc: "Качество является мультипликатором сил, но в условиях полной войны количество имеет свое собственное качество, наша нынешняя армия недостаточна для того, чтобы обезопасить все наши границы и достичь наших стратегических целей, мы санкционируем формирование новых разногласий, расширение нашей базы для вербовки и обеспечение того, чтобы мы имели количество людей для того, чтобы вести затяжной конфликт."
  
 generic_army_professional_drills: "Профессиональное бурение"
 generic_army_professional_drills_desc: "Крупная армия - это всего лишь вооруженная толпа, если она не будет дисциплинирована и хорошо обучена. Мы будем осуществлять жесткую и профессиональную программу бурения, стандартизуя обучение во всех подразделениях. Постоянное бурение укрепляет сплоченность, прививает дисциплину и превращает зеленых новобранцев в солдат ветеранов до того, как они когда-либо увидят боевые действия."
  
 generic_army_study_from_success: "Изучение на примере успеха"
 generic_army_study_from_success_desc: "Мы создадим формальную систему для сбора отчетов о последующей деятельности с мест, которая будет анализироваться, совершенствоваться и распространяться по всей армии, что позволит всем нашим силам учиться и адаптироваться к победам наиболее эффективных подразделений."
  
 generic_army_grand_battleplan: "Великий план"
 generic_army_grand_battleplan_desc: "Войну нельзя оставлять на произвол судьбы и импровизации. Высшее командование посвятит разработке всеобъемлющего «Большого плана» — генеральной стратегии на любой случай. Это будет включать тщательное планирование, заблаговременное размещение поставок и разработку четкой, поэтапной оперативной доктрины для широкомасштабной войны."
  
 generic_army_experienced_generals: "Набор генералов-ветеранов"
 generic_army_experienced_generals_desc: "Мы должны проверить наши резервы и союзные военные миссии для офицеров, обладающих реальным, практическим опытом ведения боевых действий."
  
 generic_army_supply_effort: "План материально-технического обеспечения"
 generic_army_supply_effort_desc: ""Отличный план" обречен на неудачу, если передовая линия закончится из-за пуль, фасоли или топлива. Эти усилия позволят реконструировать наш квартирмейстерский корпус, модернизировать наши склады снабжения и обеспечить, чтобы наша логистическая цепь была достаточно прочной, чтобы поддерживать массированную армию на местах на неопределенный срок."
  
 generic_army_modern_artillery: "Современная артиллерия"
 generic_army_modern_artillery_desc: "Великая война доказала, что ничто не сломает закоренелого врага или не разрушит атаку, подобно хорошо скоординированному артиллерийскому снаряду, мы будем инвестировать в исследования и производство современных артиллерийских орудий, от легких пехотных мин до тяжелых пехотных орудий дальнего радиуса действия."
  
 generic_army_modern_weapons: "Современное оружие"
 generic_army_modern_weapons_desc: "Наша индустрия должна не только производить больше оружия, но и производить более эффективное оружие. Эта инициатива будет предусматривать финансирование разработки современного пехотного оборудования, включая новые модели автоматов, усовершенствованные противотанковые винтовки и более эффективные гранаты. Наши солдаты будут обладать явным технологическим преимуществом в любой операции."
  
 generic_army_every_soldier_is_valuable: "Каждый солдат ценен."
 generic_army_every_soldier_is_valuable_desc: "Мы будем вкладывать значительные средства в наш медицинский корпус, разрабатывать новые методы работы в полевых больницах, улучшать оказание первой помощи на поле боя и обеспечивать, чтобы наши раненые могли быть эвакуированы и эффективно лечиться."
  
 generic_army_a_professional_army: "Профессиональная, опытная армия"
 generic_army_a_professional_army_desc: "Масса, огневая мощь и материально-техническое обеспечение объединились, мы создали профессиональную, опытную армию, наши солдаты хорошо обучены, наши офицеры - ветераны, наши линии снабжения в безопасности, наша артиллерия не сравнится, мы готовы к долгой, мучительной войне выбытия, и мы готовы выиграть ее."
  
  # -------------------
  # --- ARMY (Industry) ---
  # -------------------
  
 generic_expand_the_arms_industry: "Расширение оружейной промышленности"
 generic_expand_the_arms_industry_desc: "Современная армия построена на современном заводе. Наша нынешняя оружейная индустрия опасно недостаточна для того, чтобы оснастить большие военные силы, необходимые для национальной обороны. Мы начнем финансируемую государством программу строительства новых военных фабрик и расширения существующих, закладывая основу для нашего арсенала."
  
 generic_new_production_methods: "Эффективное производство"
 generic_new_production_methods_desc: "Недостаточно просто построить больше заводов; мы должны заставить наши существующие заводы работать умнее, быстрее и дешевле. Мы будем изучать и внедрять новые методы производства, такие, как сборка и стандартизация, в целях повышения эффективности, сокращения отходов и максимального увеличения объема производства нашей оружейной промышленности."
  
 generic_expand_the_arms_industry2: "Расширение оружейной промышленности II"
 generic_expand_the_arms_industry2_desc: "Первоначальное расширение было успешным, однако требования высшего командования и темпы модернизации продолжают расти."
  
 generic_expand_the_arms_industry3: "Расширение оружейной промышленности III"
 generic_expand_the_arms_industry3_desc: "Это окончательное, массовое расширение нашего военно-промышленного комплекса даст нам возможность не только оснащать наши собственные силы, но и раздувать наших соперников и вести войну на многочисленных фронтах."
  
 generic_room_for_improvement: "Планы строительства военных заводов"
 generic_room_for_improvement_desc: "Для обеспечения организации и эффективности будущего роста мы должны провести обследование новых регионов в целях промышленного развития, что позволит разработать национальные планы строительства, выявить неразвитые районы с хорошими ресурсами и инфраструктурой, проложить путь к будущему строительству заводов."
  
  # -----------------
  # --- AIR FORCE ---
  # -----------------
  
 generic_expand_aviation: "Расширение авиации"
 generic_expand_aviation_desc: "Небо — это новая граница войны, и страна без способных военно-воздушных сил находится в милости того, у кого она есть. Мы создадим официальные, независимые военно-воздушные силы, профинансироваем современные экспериментальные учебные программы и построим новые авиабазы, чтобы проецировать нашу мощь и защитить нашу родину."
  
 generic_prioritize_fighters: "Приоритизировать борцов"
 generic_prioritize_fighters_desc: "Прежде чем наши бомбардировщики смогут нанести удар или наши войска смогут продвинуться вперед, мы должны добиться господства в воздухе."
  
 generic_air_cas_innovations: "Инновации КАС"
 generic_air_cas_innovations_desc: "Концепция &quot; летающей артиллерии &quot; имеет огромный потенциал, мы будем вкладывать средства в разработку новаторских самолетов и тактики &quot; Близкая авиация &quot; . Эти самолеты, от ныряющих бомбардировщиков до наземных нападающих, будут работать в прямом взаимодействии с нашими наземными силами, ломая сильные точки противника и прекратив бронетанковые нападения."
  
 generic_air_fighter_innovations: "Инновации борцов"
 generic_air_fighter_innovations_desc: "Гонка за превосходство воздушной среды - это технологический процесс. Мы должны постоянно инновировать, фокусируясь на более мощных двигателях, большем вооружении и более продвинутых аэродинамических корпусах для наших бойцов. Каждый новый проект должен быть скачком вперед, обеспечивая сохранение наших границ."
  
 generic_air_battlefield_support: "Доктрина поддержки боевых действий I"
 generic_air_battlefield_support_desc: "Недостаточно иметь самолёты "Закрыть авиацию", мы должны иметь доктрину, чтобы эффективно использовать их. Эти усилия оформят доктрину "Бэттлфилдская поддержка", обучая наших пилотов и наземных диспетчеров бесперебойно работать над выявлением и уничтожением наземных целей противника."
  
 generic_air_battlefield_support2: "Доктрина поддержки боевых действий II"
 generic_air_battlefield_support2_desc: "Наша первоначальная доктрина поддержки доказала свою эффективность."
  
 generic_air_new_models: "Новые модели самолёта"
 generic_air_new_models_desc: "Темпы развития авиации ошеломляют. Сегодня мы будем финансировать наши авиационные компании для разработки и испытания нового поколения самолетов, от истребителей до бомбардировщиков, с тем чтобы наши военно-воздушные силы не остались позади."
  
 generic_air_paratroopers: "Десантники"
 generic_air_paratroopers_desc: "Самолёт позволяет нам полностью обойти линию фронта, проникая глубоко в заднюю часть врага. Мы начнем тренировать элитные подразделения Fallschirmjäger — солдат, которые могут спуститься с неба, чтобы захватить такие важнейшие цели, как мосты и аэродромы, посеять хаос и открыть путь к нашему главному прогрессу."
  
 generic_prioritize_bombers: "Приоритизировать бомбардировщиков"
 generic_prioritize_bombers_desc: "Боевик защищает, атакует бомбардировщиков, чтобы выиграть следующую войну, мы должны нанести удар по сердцу врага, уничтожив его фабрики, инфраструктуру и его волю к борьбе."
  
 generic_air_heavy_fighter_innovations: "Инновации тяжелых боев"
 generic_air_heavy_fighter_innovations_desc: "Формирование тяжелых бомбардировщиков - заманчивая и уязвимая цель, чтобы защитить нашу стратегическую руку, мы должны разработать дальние «тяжелые истребители» или «серстёрерские» самолеты, которые смогут сопроводить наших бомбардировщиков на весь путь к цели и огневой мощи, чтобы отследить вражеские перехватчики."
  
 generic_air_bomber_innovations: "Инновации бомбардировщиков"
 generic_air_bomber_innovations_desc: "Мы будем изучать новые бомбовые прицелы, большие загрузки бомб и усовершенствованные навигационные средства, чтобы наши бомбардировщики могли точно поражать свои цели, даже в глубине территории противника, днем и ночью."
  
 generic_air_experienced_bombers: "Опытные бомбардировщики"
 generic_air_experienced_bombers_desc: "Мы создадим специализированные школы для наших экипажей бомбардировщиков, используя уроки ранних рейдов, для разработки эффективных форм полета и оборонительной тактики, и их опыт станет нашим щитом."
  
 generic_air_nav: "Бомбардировщики NAV"
 generic_air_nav_desc: "Военно-морские силы противника представляют угрозу, а их конвои - жизненно важный спасательный путь. Мы создадим специализированные «Навальные бомбардировщики», оснащенные торпедами и бронебойными бомбами, способные охотиться и уничтожать вражеские флоты в открытом море и душить их морскую торговлю."
  
 generic_air_bomber_doctrines: "Доктрины бомбардировщиков I"
 generic_air_bomber_doctrines_desc: "Большой флот бомбардировщиков нуждается в руководящей стратегии. Мы официально примем стратегическую доктрину бомбардировок, идентифицирующую ключевые вражеские узлы - факторы, нефтеперерабатывающие заводы и железнодорожные станции - и создадим систематический план по их уничтожению и подрыву военных усилий противника."
  
 generic_air_bomber_doctrines2: "Доктрины бомбардировщиков II"
 generic_air_bomber_doctrines2_desc: "Наша первоначальная доктрина бомбардировок показала нам путь. Мы усовершенствуем его, сосредоточимся на методах ночного полёта, радиолокационных бомбардировках и массивных "бумберных потоках", предназначенных для того, чтобы одолеть противника и максимально уничтожить наши стратегические цели."
  
 generic_expand_air_defense: "Расширить зенитную оборону"
 generic_expand_air_defense_desc: "Что мы можем сделать с нашими врагами, они могут сделать с нами. Мы должны быть готовы защитить наши города и фабрики от вражеских воздушных налетов. Эта программа расширит нашу зенитную артиллерию, инвестирует в радиолокационные станции и организует нашу защиту противника."
  
 generic_air_production: "Вопрос о покупке или производстве"
 generic_air_production_desc: "Наша авиационная промышленность все еще находится в зачаточном состоянии. Перед нами стоит критически важный выбор: следует ли нам тратить наши драгоценные ресурсы медленно развивая наше собственное внутреннее производство, или же нам следует искать за границей, покупая проверенные конструкции и лицензии у более развитых стран? Это исследование определит наш национальный путь к развитию авиации."
  
  # -------------
  # --- NAVY ---
  # -------------
  
 generic_strengthen_the_navy: "Укрепление военно-морского флота"
 generic_strengthen_the_navy_desc: "Для того чтобы защитить нашу торговлю, защитить наши берега и проецировать нашу мощь, мы должны начать всеобъемлющую программу укрепления военно-морского флота, который слишком долго игнорировался, нужны новые корабли, новые базы и новые доктрины."
  
 generic_navy_heavy_fleet: "Тяжелый флот"
 generic_navy_heavy_fleet_desc: "Истинная военно-морская мощь измеряется в столицах кораблей. Доктрина «Флота в Бытии» требует, чтобы мощный флот кораблей и тяжелых крейсеров мог удержать любого врага и контролировать моря. Мы положим киль для нового «Безумного флота», флота, который может бросить вызов любому сопернику в решающей битве."
  
 generic_navy_capital_ship_innovations: "Инновации на капитале судов"
 generic_navy_capital_ship_innovations_desc: "Наши новые боевые корабли должны быть самыми передовыми в мире, мы будем инвестировать в исследования, связанные с более высокими схемами бронетранспортеров, более мощными пулеметами и более мощными турбинными двигателями."
  
 generic_navy_battlecruiser_innovations: "Инновации боевых круизеров"
 generic_navy_battlecruiser_innovations_desc: "Скорость - это его форма доспехов. Мы будем первопроходцами в новых проектах "Бэттлкрузера", кораблей, которые сочетают скорость крейсера с тяжелым ударом корабля. Они будут идеальными охотниками для современного флота, способными бегать по любому более быстрому кораблю и бегать по сильному."
  
 generic_navy_heavy_navy_doctrine: "Флот в быту"
 generic_navy_heavy_navy_doctrine_desc: "Мы официально примем доктрину «Флота в Быти», обучая наших адмиралов маневрам большого флота и дуэлям дальней дальности, нашей главной целью будет поиск и уничтожение главного боевого флота противника в одном, решительном бою."
  
 generic_navy_light_fleet: "Легкий флот"
 generic_navy_light_fleet_desc: "Мы сосредоточимся на строительстве «Лайт Флота» — «штурмового» флота, разработанного для того, чтобы воспрепятствовать вражеской торговле, защитить наше собственное судоходство и проконтролировать наши более ценные активы."
  
 generic_navy_submarine_innovations: "Инновации подводных лодок"
 generic_navy_submarine_innovations_desc: "Подводная лодка - молчаливый убийца, конечное ассиметричное оружие против высшей военно-морской мощи. Мы будем проводить исследования по инновациям "U-boat", развивать лодки с более высокой дальностью, глубиной ныряния и более смертоносными торпедами. Торговый морской пехотинец врага научится бояться глубины."
  
 generic_navy_destroyer_innovations: "Уничтожение инноваций"
 generic_navy_destroyer_innovations_desc: "Для каждого охотника есть прилавок, наши разрушители должны быть хозяевами световых морей, мы разработаем более быстрые эсминцы, оснащенные современными глубинными зарядами и сонарными, что сделает их идеальными подводных убийцами и идеальным, разносторонним экраном для нашего флота."
  
 generic_navy_light_navy_doctrine: "Торговое препятствование"
 generic_navy_light_navy_doctrine_desc: "Легкий флот требует иного мышления, чем тяжелый. Мы примем доктрину "торгового противостояния", обучая наши подводные "волчьи пачки" и крейсерские группы голодать противника жизненно важных ресурсов. Наш флот сосредоточится на войне выбытия, потопке их торговли и удушении их экономики."
  
 generic_navy_establish_a_merchant_marine: "Создание торгового морского флота"
 generic_navy_establish_a_merchant_marine_desc: "Морской флот бесполезен, если нет торговли, которую можно было бы защитить. Мы будем субсидировать строительство большого современного «Мертвого моря». Эти гражданские перевозки станут жизненной кровью нашей нации в военное время, которая будет перевозить жизненно важные ресурсы и запасы со всего мира."
  
 generic_navy_troop_transports: "Перевозки военнослужащих"
 generic_navy_troop_transports_desc: "Армия, которая не может пересечь море, калечена, ограничена одним континентом. Мы должны иметь возможность перевозить наших солдат на иностранные берега. Эта программа закажет флот преданных "Troop Transports" и разработает морскую доктрину для амфибийных атак."
  
  # ----------------
  # --- ECONOMY ---
  # ----------------
  
 generic_state_of_the_economy: "Состояние экономики"
 generic_state_of_the_economy_desc: "Сила нации — это ее экономика. Прежде чем мы сможем осуществить какие-либо крупные реформы, мы должны провести полный обзор нашего промышленного потенциала, производства ресурсов и торговой политики. Эта оценка станет основой нашего будущего экономического планирования и определит наш путь к процветанию."
  
  # --- Autarky Branch ---
  
 generic_economy_autarky: "Автарки"
 generic_economy_autarky_desc: "Для того чтобы быть подлинно суверенным, нация должна быть действительно самодостаточной, мы не можем полагаться на иностранные державы в отношении ресурсов, которые нам нужны для ведения войны или строительства нашей промышленности, мы будем идти по пути «Автарки», цель которого состоит в производстве всего, что нам нужно — от стали до нефти — в пределах наших собственных границ."
  
 generic_economy_autarky_industrial_innovations: "Промышленные инновации"
 generic_economy_autarky_industrial_innovations_desc: "Самодостаточная экономика должна быть эффективной. Мы будем инвестировать в промышленные исследования, разрабатывать новые производственные технологии и улучшать соотношение между обработкой ресурсов и факторами производства. Мы должны научиться делать больше с меньшими затратами."
  
 generic_economy_autarky_infrastructure: "Инфраструктура"
 generic_economy_autarky_infrastructure_desc: "Для того чтобы перевести ресурсы из наших шахт на наши заводы, нам нужна современная транспортная сеть. Эта первая "Инфраструктура Эффорта" будет сосредоточена на строительстве и модернизации автомобильных и железных дорог в наших наиболее важных регионах, производящих ресурсы."
  
 generic_economy_autarky_civilian_factories: "Строительство"
 generic_economy_autarky_civilian_factories_desc: "Наше аутарковское государство будет построено нашими собственными руками. Это "Строительство" увидит государственный фонд создания новых гражданских фабрик, расширяя промышленную базу, необходимую для построения нашего собственного будущего, свободного от иностранной зависимости."
  
 generic_economy_autarky_civilian_factories2: "Строительство"
 generic_economy_autarky_civilian_factories2_desc: "Первая волна строительства была успешной. Эта "Строительность II" будет еще более амбициозной, расширяя наш промышленный потенциал до уровней, которые сделают нашу страну настоящим промышленным домом, способным на любое предприятие."
  
 generic_economy_autarky_infrastructure2: "Инфраструктура II"
 generic_economy_autarky_infrastructure2_desc: "Эта вторая работа будет представлять собой широкомасштабный национальный проект, предусматривающий модернизацию всей железнодорожной сети в целях улучшения поставок и производственного потока по всей стране."
  
 generic_economy_autarky_land_clearance: "Разминирование"
 generic_economy_autarky_land_clearance_desc: "Каждый квадратный метр нашей страны должен быть использован для продуктивного использования. Мы начнем программу "Обезвреживания земель", осушение болот, расчистка лесов и восстановление засушливых земель, чтобы создать новые фермы, шахты и фабрики."
  
 generic_economy_autarky_synthetic_research: "Синтетические исследования"
 generic_economy_autarky_synthetic_research_desc: "Единственный ресурс, которого нам не хватает в изобилии, это нефть, кровь современной армии. Мы преодолеем этот недостаток с помощью науки. Мы профинансируем "синтетические исследования", новые методы превращения наших огромных запасов угля в жидкое топливо и каучук."
  
 generic_economy_autarky_synthetic_factories: "Синтетические фабрики"
 generic_economy_autarky_synthetic_factories_desc: "Исследования завершены. Теперь мы должны построить. Эта программа будет предусматривать строительство крупных "синтетических заводов", предназначенных для производства синтетического масла и каучука. Мы будем подпитывать нашу новую армию своей наукой и промышленностью."
  
  # --- Protectionism Branch ---
  
 generic_economy_protectionism: "Протекционизм"
 generic_economy_protectionism_desc: "Глобальный рынок - это хаотичное и опасное место. Мы не можем допустить, чтобы наши ключевые отечественные отрасли были разрушены хищнической внешней конкуренцией. Мы будем проводить политику "защиты", повышая тарифы для защиты нашего местного бизнеса и обеспечения того, чтобы экономическая судьба нашей страны находилась в наших руках."
  
 generic_economy_protecting_our_factories: "Защита наших фабрик"
 generic_economy_protecting_our_factories_desc: "Наши фабрики являются национальным активом. Мы должны защитить их не только от иностранной конкуренции, но и от иностранного шпионажа и саботажа. Эта инициатива повысит безопасность на ключевых промышленных объектах и подтолкнет наши компании "покупать местные" для своих машинных инструментов."
  
 generic_economy_guarantee_local_businesses: "Гарантии местных предприятий"
 generic_economy_guarantee_local_businesses_desc: "Доверие является краеугольным камнем промышленности. Правительство будет "гарантировать местные предприятия", предлагая субсидии и льготные кредиты нашим отечественным компаниям. Это будет побуждать их расширяться, зная, что их страна стоит за ними."
  
 generic_economy_land_reforms: "Больше места для фабрик"
 generic_economy_land_reforms_desc: "Наша земля используется неэффективно. Старые, аристократические поместья находятся в подвале, пока наши фабрики перегружены городами. Мы введем "Ленд Реформы", чтобы разбить неиспользуемую землю и предоставить ее для нового промышленного и сельскохозяйственного развития."
  
 generic_economy_expand_local_factories: "Расширить местные фабрики"
 generic_economy_expand_local_factories_desc: "Наша протекционистская политика дала нашему местному бизнесу необходимую безопасность."
  
 generic_economy_expand_local_factories2: "Расширить наши местные предприятия"
 generic_economy_expand_local_factories2_desc: "На следующем этапе основное внимание будет уделяться развитию вторичной промышленности и мастерских, а также обеспечению того, чтобы мы не только строили, но и совершенствовали и производили дома сложные товары."
  
 generic_economy_our_own_companies: "Местные компании"
 generic_economy_our_own_companies_desc: "Мы будем поощрять рост «местных компаний», превращая небольшие мастерские в национальных чемпионов, поощряя отечественных предпринимателей, мы создадим устойчивую и разнообразную промышленную базу, которая в первую очередь будет лояльна нашей стране."
  
 generic_economy_expand_local_factories3: "Местная промышленность"
 generic_economy_expand_local_factories3_desc: "Наша внутренняя индустрия теперь полностью зрела, способна удовлетворять все наши национальные потребности и соревноваться с самыми лучшими в мире, на наших условиях."
  
 generic_economy_resource_excavation: "Местные ресурсы"
 generic_economy_resource_excavation_desc: "Почему мы должны платить иностранным горнякам за ресурсы, если у нас есть невыразимое богатство под нашей землей? Эта инициатива "местные ресурсы" будет финансировать обширную геологическую съемку и открывать новые шахты, максимально увеличивая раскопки нашей национальной ресурсной базы."
  
  # --- Free Trade Branch ---
  
 generic_economy_free_trade: "Свободная торговля"
 generic_economy_free_trade_desc: "Мир — это наш рынок. Мы отвергаем недальновидность аутарки и протекционизма. Процветание — это открытость."
  
 generic_economy_free_trade_the_flow: "Поток ресурсов"
 generic_economy_free_trade_the_flow_desc: "Мы будем вкладывать средства в наши порты, торговые морские и таможенные службы, чтобы обеспечить как можно более быстрый и эффективный «поток ресурсов»."
  
 generic_economy_free_trade_investures_abroad: "Инвесторы за рубежом I"
 generic_economy_free_trade_investures_abroad_desc: "Наш капитал не должен быть пустым. Эта первая программа "Инвесторы за рубежом" позволит нашим правительствам и частным компаниям вкладывать средства в развитие инфраструктуры и промышленности в дружественных иностранных государствах. Это обеспечит нам доступ к их ресурсам и рынкам."
  
 generic_economy_free_trade_investures_abroad2: "Инвесторы за рубежом II"
 generic_economy_free_trade_investures_abroad2_desc: "Наши иностранные инвестиции оказались весьма прибыльными. Эта вторая волна будет более амбициозной, стремясь получить контроль над ключевыми операциями по извлечению ресурсов во всем мире. Наша экономика будет подпитываться миром."
  
 generic_economy_free_trade_investures_abroad3: "Инвесторы за рубежом III"
 generic_economy_free_trade_investures_abroad3_desc: "Эта окончательная программа укрепит нашу экономическую империю, обеспечивая, чтобы через сеть инвестиций и торговых сделок наш доступ к мировым ресурсам был постоянным и беспрепятственным."
  
 generic_economy_free_trade_goods_at_home: "Товары на дому"
 generic_economy_free_trade_goods_at_home_desc: "Благодаря снижению тарифов на импортные товары мы будем обеспечивать стабильное предложение дешевых "товаров дома", повышая уровень жизни и сохраняя счастливое население."
  
 generic_economy_free_trade_idea_sharing: "Последние промышленные идеи"
 generic_economy_free_trade_idea_sharing_desc: "Свободная торговля - это не только товары, но и идеи. Открывая наши двери, мы поощряем "Последние промышленные идеи" из-за рубежа, которые попадают в наши университеты и корпорации, ускоряя наше собственное технологическое развитие."
  
 generic_economy_free_trade_securing_our_industry: "Обеспечение безопасности нашей промышленности"
 generic_economy_free_trade_securing_our_industry_desc: "В то время как мы участвуем в свободной торговле, мы не наивны. Мы должны «защищать нашу индустрию», инвестируя в самые высокотехнологичные и производительные сектора, обеспечивая, чтобы даже на открытом рынке наши внутренние чемпионы могли превзойти любого соперника."
  
 generic_economy_free_trade_productivity: "Лучшая сделка"
 generic_economy_free_trade_productivity_desc: "На свободном рынке эффективность — это выживание. Мы будем неустанно следовать «Лучшим курсам» и наивысшей производительности, заставляя наши отрасли стать стройными, инновационными и мировыми классами. Неэффективные будут адаптироваться или погибнуть."
  
  # --------------------
  # --- MAJOR POWER ---
  # --------------------
  
 generic_our_place_in_the_world: "Наше место в мире"
 generic_our_place_in_the_world_desc: "Мы не маленькая нация, и настало время, чтобы мир признал это. Мы должны определить "Наше место в мире". Этот акцент переоценит нашу национальную стратегию, наши амбиции и нашу роль как крупной державы на мировой арене. Мы больше не будем молчать."
  
 generic_major_research_institution: "Усовершенствованные НИОКР"
 generic_major_research_institution_desc: "Мы создадим новый институт "Улучшенных НИОКР", национальную лабораторию, занимающуюся передовой наукой и исследованиями "голубого неба", обеспечивая наше технологическое превосходство для следующего поколения."
  
 generic_major_further_research_funding: "Дополнительное финансирование исследований"
 generic_major_further_research_funding_desc: "Наш новый исследовательский институт - хорошее начало, но наука работает не только на финансировании, но и на амбициях, мы будем утверждать «дополнительное финансирование исследований» для всех наших университетов и лабораторий, ускоряя наше научное открытие на всех фронтах."
  
 generic_major_expand_dockyards: "Расширить докьярды"
 generic_major_expand_dockyards_desc: "Крупная энергия нуждается в большом флоте, который может проецировать энергию по всему миру. Чтобы построить и поддерживать такой флот, мы должны "выпустить докьярды", построить новые сухие доки и скользкие дорожки, способные построить крупнейшие боевые корабли и носители."
  
 generic_major_economic_boom: "Экономический бум"
 generic_major_economic_boom_desc: "Этот «экономический бум» станет массовым государственным стимулом, финансированием инфраструктуры, промышленности и исследований, позволяющим одновременно создать период беспрецедентного роста и процветания."
  
 generic_major_rails_of_tomorrow: "Завтрашние железные дороги"
 generic_major_rails_of_tomorrow_desc: "Наши амбиции носят континентальный характер, и они должны поддерживаться железными дорогами завтрашнего дня. Это не просто обновление; это полное восстановление нашей железнодорожной сети до самых высоких стандартов, что позволяет быстро перемещаться армии и поставки из одного конца нашей сферы в другой."
  
 generic_major_expanded_civilian_factories: "Расширенные гражданские фабрики"
 generic_major_expanded_civlian_factories: "Стремительная экономика требует большой промышленной базы. Мы санкционируем строительство «Расширенных гражданских фабрик» в масштабах, которые еще никогда не были видны, давая нам возможность строить что-либо, финансировать любой проект и превзойти любого врага."
  
 generic_major_expanded_military_factories: "Расширенные военные фабрики"
 generic_major_expanded_military_factories_desc: "Мы будем строить «расширенные военные фабрики», создавая такой огромный арсенал, что он может оснащать не только наши собственные армии, но и армии наших союзников и марионеток."
  
 generic_major_our_sphere_of_influence: "Наша сфера влияния"
 generic_major_our_sphere_of_influence_desc: "Мы официально объявим «Сферу влияния», сообщая другим великим державам, что наши соседи находятся под нашей защитой и экономическим руководством."
  
 generic_major_rocketry: "Ракета"
 generic_major_rocketry_desc: "Следующая граница - это не небо, а пространство над ним. Мы начнем теоретические и практические исследования "Рокетрии". В то время как прямое применение может быть связано с оружием дальнего террора, будущий потенциал науки и престижа безграничен."
  
 generic_major_doomsday_weapons: "Оружие Судного дня"
 generic_major_doomsday_weapons_desc: "Ракета дает нам дальность, но какую полезную нагрузку она будет нести? Мы должны исследовать новые, ужасные технологии, основанные на атомном расщеплении, которые могут положить конец войне в одной, ослепляющей факеле. Чтобы быть большой силой, нужно обладать абсолютным, ужасным сдерживанием."
  
  # ----------------
  # --- POLITICS ---
  # ----------------
  
 generic_modern_politics: "Современная политика"
 generic_modern_politics_desc: "Старые способы управления умирают. Мир - это один из средств массовой информации, массовых движений и новых, опасных идей. Мы должны адаптировать нашу политическую систему к "модернистской политике", решая, какой путь пойдет наша нация в эту бурную новую эру: путь свободы, путь порядка или путь революции."
  
  # --- Centrism/Democracy Branch ---
  
 generic_politics_centrism: "Центизм"
 generic_politics_centrism_desc: "Краевы левых и правых предлагают только разделение, террор и разруху. Мы пойдем по пути "центриста", который будет сбалансированным, прагматичным и компромиссным. Наше правительство будет стремиться к стабильности и процветанию для всех, а не к идеологической чистоте."
  
 generic_politics_political_free_press: "Свободная пресса"
 generic_politics_political_free_press_desc: "Здоровая демократия требует информированных и скептических граждан. Мы гарантируем права "Свободной прессы", обеспечивая журналистам возможность сообщать о действиях правительства, не опасаясь репрессий. Транспарентность - это самое известное противоядие коррупции."
  
 generic_politics_representative_government: "Представитель правительства"
 generic_politics_representative_government_desc: "Мы будем укреплять наш парламент и обеспечивать «представительское правительство», где депутаты избираются свободно и справедливо, а кабинет подотчетен народу, которому он служит, а не наоборот."
  
 generic_politics_democracy_research: "Бесплатное образование"
 generic_politics_democracy_research_desc: "Невежество является врагом демократии. Мы обеспечиваем каждому гражданину возможность критически мыслить, участвовать в политическом процессе и вносить вклад в наш национальный научный и культурный прогресс."
  
 generic_politics_citizen_rights: "Права наших граждан"
 generic_politics_citizen_rights_desc: "Свобода слова, свобода собраний и право на справедливое судебное разбирательство являются не просто абстрактными идеалами; они являются основой нашего стабильного и справедливого общества."
  
 generic_politics_political_freedom: "Политическая свобода"
 generic_politics_political_freedom_desc: "Наша нация станет маяком «Политической свободы». Всем партиям, при условии уважения демократического процесса и конституции, будет позволено действовать свободно. Это соревнование идей укрепит нашу политическую систему, а не ослабит ее."
  
 generic_politics_academic_sponsoring: "Научное спонсорство"
 generic_politics_academic_sponsoring_desc: "Наше демократическое правительство докажет свою ценность, инвестируя в будущее."
  
 generic_politics_promote_our_party: "Пропаганда нашей партии"
 generic_politics_promote_our_party_desc: "Хотя мы верим в демократию, мы также считаем, что у нашей партии есть лучшее видение нации, мы будем «пропагандировать нашу партию» посредством публичных митингов, рекламных кампаний и организации общин, чтобы люди понимали и поддерживали нашу разумную повестку дня."
  
 generic_politics_a_strong_constitution: "Сильная демократическая конституция"
 generic_politics_a_strong_constitution_desc: "Мы будем разрабатывать "Сильную демократическую конституцию", основополагающий документ, устанавливающий четкое разделение властей и защищающий права народа от любого будущего правительства, которое может их нарушить."
  
 generic_politics_the_light_of_democracy: "Свет демократии"
 generic_politics_the_light_of_democracy_desc: "Наша демократия не только для нас, но и для всего мира. Мы будем «Светом демократии», активно поддерживая другие демократические движения и формируя новый союз свободных наций, чтобы противостоять нарастающей волне тирании."
  
  # --- Rightism/Authoritarian Branch ---
  
 generic_politics_rightism: "Правый подход"
 generic_politics_rightism_desc: "Демократия слаба, деградирована и медленна. Коммунизм - это рак материалиста. Единственный истинный путь вперед - это "правый путь" - путь национального единства, духовного возрождения, силы и единственной цели. Мы ставим Нацию на первое место, выше всех других мелких преданий."
  
 generic_politics_patriotism: "Патриотизм"
 generic_politics_patriotism_desc: "Мы начнем национальную кампанию по поощрению "Патриотизма", возрождения национальных мифов, почитания наших павших героев и привития глубокой и неизменной любви к родине каждому мужчине, женщине и ребенку."
  
 generic_politics_promote_militarism: "Поощрять милитаризм"
 generic_politics_promote_militarism_desc: "Сила нации — это ее армия. Мы будем «пропагандировать милитаризм» в нашей культуре, проводить грандиозные парады, поощрять молодежные военизированные группы и повышать солдат на высший почетный пост в нашем обществе. Нация должна стать армией, а армия — своей душой."
  
 generic_politics_our_right_to_conquest: "Наше право на поимку"
 generic_politics_our_right_to_conquest_desc: "Сильная нация, как сильная личность, нуждается в возможности для роста. Мы закрепим наше право на заключение договора, претендуя на наше законное «место на солнце». Наша судьба — править, и любые слабые нации, стоящие на нашем пути, должны быть отброшены в сторону."
  
 generic_politics_a_strong_state: "Сильное правительство"
 generic_politics_a_strong_state_desc: "Бесконечные, жалкие споры политиков должны прекратиться. Мы построим "Сильное правительство", централизуя власть в руках единого, решительного лидера и единой, верной партии. Воля нации будет монолитной и мгновенной."
  
 generic_politics_a_strong_police: "Сильные полицейские силы"
 generic_politics_a_strong_police_desc: "Чтобы построить сильное государство, мы должны сначала установить абсолютный порядок, мы будем расширять и расширять наши национальные полицейские силы, обеспечивая, чтобы «крепкие полицейские силы» могли поддерживать внутреннюю стабильность и искоренять предателей, дегенератов и шпионов."
  
 generic_politics_a_strong_country: "Сильная страна"
 generic_politics_a_strong_country_desc: "С помощью силы, единства и непоколебимой воли мы создадим «крепкую страну». Наша промышленная, военная и политическая власть будет объединена в одну неостановимую силу, готовую отстаивать свою законную судьбу."
  
 generic_politics_press_censorship: "Цензура печати"
 generic_politics_press_censorship_desc: "Так называемая «свободная пресса» — это инструмент наших врагов, распространяющий ложь, сомнения и инакомыслие. Мы будем осуществлять полную «цензуру», обеспечивая, чтобы все газеты, радиопередачи и кино отражали национальную волю и поддерживали цели государства."
  
 generic_politics_surpress_opponents: "Ужасные политические оппоненты"
 generic_poltitics_surpress_opponents_desc: "Нет места для инакомыслия в едином государстве. Мы будем "Сурпрессировать политических противников", запрещать все другие партии и жестко обращаться с теми, кто осмеливается выступать против лидера и нации. Единство будет обеспечено."
  
 generic_politics_authoritarian_research: "Государственные университеты"
 generic_politics_authoritarian_research_desc: "Наука должна служить государству. Мы реорганизуем спонсируемые государством университеты, очистим их от неверных или дегенеративных элементов и направим их исследования на практические цели: лучшее оружие, лучшую индустрию и подтверждение нашей национальной идеологии."
  
  # --- Leftism/Collectivist Branch ---
  
 generic_politics_leftism: "Левизизм"
 generic_politics_leftism_desc: "Старый порядок построен на эксплуатации, аристократии и жадности. Единственный путь к справедливому будущему - это путь, который ставит на первое место трудящегося, фермера и простого человека. Средства производства должны принадлежать народу, а не паразитной элите."
  
 generic_politics_collectivization: "Объединение"
 generic_politics_collectivization_desc: "Старая, неэффективная система частных мелких фермерских хозяйств должна закончиться. С помощью "коллективизации", мы объединим эти участки в крупные государственные сельскохозяйственные комплексы. Это модернизирует нашу сельскохозяйственную промышленность и обеспечит стабильное, рациональное распределение продовольствия для наших городов и армий."
  
 generic_politics_a_workers_state: "Государство трудящегося"
 generic_politics_a_workers_state_desc: "Эта нация будет перестроена с нуля, она станет "Государством трудящегося", где будет почитаться труд пролетариата, и будет ликвидирована паразитическая буржуазия. Вся сила попадет с фабрик и полей, руководимая партией."
  
 generic_politics_internationalism: "Интернационализм"
 generic_politics_internationalism_desc: "Наша революция не только для нас, но и для трудящихся мира. Мы принимаем «интернационализм», считая, что у пролетариата нет нации. Наша конечная цель — это глобальный союз социалистических государств, свободный от тирании границ и капитала."
  
 generic_politics_spreading_the_revolution: "Распространение революции"
 generic_politics_spreading_the_revolution_desc: "Цепочки угнетения не рухнут сами по себе; они должны быть разрушены. Мы должны быть готовы к "Захвату революции", активной поддержке и провоцированию пролетарских восстаний в других странах, подрывной деятельности или, в случае необходимости, силой."
  
 generic_politics_incorporating_trade_unions: "Включает в себя профессиональные союзы"
 generic_politics_incorporating_trade_unions_desc: ""Профсоюзы" - это естественное место революции. Мы официально "встроим" их в структуру государства, давая им новую власть над управлением фабриками и гарантируя абсолютную преданность индустриального рабочего класса партии."
  
 generic_politics_socialist_commitee: "Социалистический комитет"
 generic_politics_socialist_commitee_desc: "Чтобы направлять революцию и защищать ее от врагов, мы должны сформировать «социалистический комитет» — авангардную партию истинных верующих и революционных мыслителей, которые будут действовать как мозг и совесть нового рабочего государства."
  
 generic_politics_socialist_education: "Социалистическое образование"
 generic_politics_socialist_education_desc: "Мы создадим новую систему "социалистского образования", обучая наших детей принципам нашей идеологии и готовя их к тому, чтобы стать архитекторами нового мира."
  
 generic_politics_secret_police: "Секретная полиция"
 generic_politics_secret_police_desc: "Революция имеет много врагов - иностранных шпионов, диверсантов и контрреволюционеров, прячущихся в наших собственных границах."
  
 generic_politics_crack_down_on_resistance: "Удар по сопротивлению"
 generic_politics_crack_down_on_resistance_desc: "Не все примут новый мир; некоторые безнадежно отравлены старыми. Мы должны "Покончить с Сопротивлением", не проявляя милосердия к реакционерам, разрушителям или предателям. Революцию нужно защищать, сколько бы это ни стоило."
  
 generic_politics_collectivist_commitee: "Коллегиалистские комитеты"
 generic_politics_collectivist_commitee_desc: "Наши «коллективистские комитеты» распространят революцию на все аспекты жизни, и эти местные советы трудящихся и фермеров будут управлять своими делами, руководствуясь мудростью центральной партии, обеспечивая, чтобы революция дошла до каждого дома."
  
 generic_politics_collectivist_education: "Социалистические науки"
 generic_politics_collectivist_education_desc: "Буржуазская наука - это ложь, которая используется для поддержания капитала. Мы будем поощрять «социалистскую науку», новый образ мышления, свободный от старых суперстистов и предрассудков. Мы будем финансировать исследования, которые служат людям и доказывают материальную истину нашей идеологии."
  
  # ---------------------
  # --- GENERIC SHARED (Copy) ---
  # ---------------------
  
 generic_shared_examine_the_army: "Обследовать армию"
 generic_shared_examine_the_army_desc: "Прежде чем мы сможем построить современную армию, мы должны сначала понять наше нынешнее состояние."
  
 generic_shared_study_unique_doctrines: "Изучение уникальных доктрин"
 generic_shared_study_unique_doctrines_desc: "Все крупные державы разработали свои собственные ответы на вопрос о современных военных действиях, отправляя военных атташе за границу, изучая их публикации и наблюдая за их маневрами, мы можем проанализировать их «уникальные» доктрины, мы примем элементы, которые отвечают нашему национальному характеру и откажемся от тех, кто не делает этого, создавая высший синтез."
  
 generic_shared_army_mobilization: "Усилия по мобилизации и подготовке кадров"
 generic_shared_army_mobilization_desc: "Постоянная армия дорога, но страна, не имеющая надежного плана мобилизации, уязвима."
  
 generic_shared_army_mandatory_conscription: "Обязательная воинская обязанность"
 generic_shared_army_mandatory_conscription_desc: "Призывы к добровольчеству и патриотизму могут зайти только так, чтобы посадить армию, способную защитить наши границы от любой возможной угрозы, мы должны внедрить систему обязательной национальной службы."
  
 generic_shared_army_produce_infantry_weapons: "Производство оружия массового уничтожения"
 generic_shared_army_produce_infantry_weapons_desc: "В настоящее время наши запасы основного пехотного снаряжения, пулемётов и минометов являются недостаточными для затяжного, широкомасштабного конфликта, мы переоснащаем наши заводы для массового производства этого основного оружия, обеспечивая каждому военнослужащему на передовой линии средства, необходимые для борьбы."
  
 generic_shared_army_motorization_effort: "Усилия по моторизации"
 generic_shared_army_motorization_effort_desc: "Последняя война была определена траншем; следующая будет определена двигателем внутреннего сгорания. Наша армия по-прежнему слишком сильно зависит от пеших и лошадей. Эти усилия приступят к длительному и дорогостоящему, но необходимому процессу автомобилизации. Мы предоставим грузовики нашим логистическим и пехотным подразделениям для значительного повышения нашей стратегической мобильности."
  
 generic_shared_army_mechanization_effort: "Механизация"
 generic_shared_army_mechanization_effort_desc: "Чтобы создать настоящую «механизированную» пехоту, которая сможет сражаться вместе с нашими танками и выжить на современном поле боя, мы должны инвестировать в отслеживаемые и полуслежащие машины, эти бронетранспортеры позволят нашей пехоте не отставать от доспехов и целей нападения."
  
 generic_shared_army_armor_effort: "Бронирование"
 generic_shared_army_armor_effort_desc: "Танк является современной кавалерией, решающей движущей силой прорыва и эксплуатации. Эта программа будет финансировать наши бронеразведочные отделы и создавать промышленную базу, необходимую для производства наших современных танков. Этот "Панзервафф" станет стал стальной кулак нашей национальной армии."
  
 generic_shared_army_exercises: "Армейские учения"
 generic_shared_army_exercises_desc: "Доктрина бесполезна, если она существует только на бумаге. Мы проведем крупномасштабные военные учения и военные игры, проведем испытания нашего нового оборудования и командных структур в наиболее реалистичной обстановке. Уроки, извлеченные в ходе смоделированных боевых действий, спасут бесчисленное количество жизней в реальной жизни, а накопленный опыт оживит наши разногласия и превратит их в смертоносную силу."
  
 generic_shared_army_new_textbooks: "Новые учебники"
 generic_shared_army_new_textbooks_desc: "Уроки Великой войны были написаны кровью, но природа войны быстро меняется. Наши военные академии по-прежнему преподают устаревшую тактику. Мы созовем группу наших самых дальновидных офицеров, чтобы написать новые полевые руководства и учебники, с тем чтобы наше следующее поколение лидеров было готово к изменчивому, быстро развивающемуся современному поле боя."
  
 generic_shared_army_continued_doctrine_effort: "Сохраняющаяся доктрина"
 generic_shared_army_continued_doctrine_effort_desc: "Одного нового учебника недостаточно. Война постоянно развивается. Мы должны посвятить постоянную ветвь высшего командования постоянному изучению и совершенствованию нашей земельной доктрины, интегрировав новые технологии и отчеты о боевых действиях по мере их появления. Наши доктрины должны быть живыми, дыхательными."
  
 generic_shared_army_a_new_modern_army: "Современная армия"
 generic_shared_army_a_new_modern_army_desc: "В этот момент наши усилия завершились новым оборудованием, новым руководством и новой доктриной. Этот заключительный акт реформы объединит все наши новые активы, создав «новую типовую армию» в качестве современной, сплоченной и смертоносной боевой силы, готовой обеспечить судьбу нации и защитить наши интересы от любого врага."
  
 generic_shared_study_the_guerra_mondiale: "Изучение великой войны"
 generic_shared_study_the_guerra_mondiale_desc: "Мы должны смотреть в прошлое, чтобы понять будущее. Недавняя Великая война была жестокой инсценированной современной войной. Тщательно изучая ее битвы, начиная с грандиозных стратегических планов и заканчивая тактическими неудачами, мы можем извлечь бесценные уроки в области материально-технического обеспечения, выбытия и критической важности огневой мощи и планирования."
  
 generic_shared_army_larger_army: "Более крупная армия"
 generic_shared_army_larger_army_desc: "Качество является мультипликатором сил, но в условиях полной войны количество имеет свое собственное качество, наша нынешняя армия недостаточна для того, чтобы обезопасить все наши границы и достичь наших стратегических целей, мы санкционируем формирование новых разногласий, расширение нашей базы для вербовки и обеспечение того, чтобы мы имели количество людей для того, чтобы вести затяжной конфликт."
  
 generic_shared_army_professional_drills: "Профессиональное бурение"
 generic_shared_army_professional_drills_desc: "Крупная армия - это всего лишь вооруженная толпа, если она не будет дисциплинирована и хорошо обучена. Мы будем осуществлять жесткую и профессиональную программу бурения, стандартизуя обучение во всех подразделениях. Постоянное бурение укрепляет сплоченность, прививает дисциплину и превращает зеленых новобранцев в солдат ветеранов до того, как они когда-либо увидят боевые действия."
  
 generic_shared_army_study_from_success: "Изучение на примере успеха"
 generic_shared_army_study_from_success_desc: "Мы создадим формальную систему для сбора отчетов о последующей деятельности с мест, которая будет анализироваться, совершенствоваться и распространяться по всей армии, что позволит всем нашим силам учиться и адаптироваться к победам наиболее эффективных подразделений."
  
 generic_shared_army_grand_battleplan: "Великий план"
 generic_shared_army_grand_battleplan_desc: "Войну нельзя оставлять на произвол судьбы и импровизации. Высшее командование посвятит разработке всеобъемлющего «Большого плана» — генеральной стратегии на любой случай. Это будет включать тщательное планирование, заблаговременное размещение поставок и разработку четкой, поэтапной оперативной доктрины для широкомасштабной войны."
  
 generic_shared_army_experienced_generals: "Набор генералов-ветеранов"
 generic_shared_army_experienced_generals_desc: "Мы должны проверить наши резервы и союзные военные миссии для офицеров, обладающих реальным, практическим опытом ведения боевых действий."
  
 generic_shared_army_supply_effort: "План материально-технического обеспечения"
 generic_shared_army_supply_effort_desc: ""Отличный план" обречен на неудачу, если передовая линия закончится из-за пуль, фасоли или топлива. Эти усилия позволят реконструировать наш квартирмейстерский корпус, модернизировать наши склады снабжения и обеспечить, чтобы наша логистическая цепь была достаточно прочной, чтобы поддерживать массированную армию на местах на неопределенный срок."
  
 generic_shared_army_modern_artillery: "Современная артиллерия"
 generic_shared_army_modern_artillery_desc: "Великая война доказала, что ничто не сломает закоренелого врага или не разрушит атаку, подобно хорошо скоординированному артиллерийскому снаряду, мы будем инвестировать в исследования и производство современных артиллерийских орудий, от легких пехотных мин до тяжелых пехотных орудий дальнего радиуса действия."
  
 generic_shared_army_modern_weapons: "Современное оружие"
 generic_shared_army_modern_weapons_desc: "Наша индустрия должна не только производить больше оружия, но и производить более эффективное оружие. Эта инициатива будет предусматривать финансирование разработки современного пехотного оборудования, включая новые модели автоматов, усовершенствованные противотанковые винтовки и более эффективные гранаты. Наши солдаты будут обладать явным технологическим преимуществом в любой операции."
  
 generic_shared_army_every_soldier_is_valuable: "Каждый солдат ценен."
 generic_shared_army_every_soldier_is_valuable_desc: "Мы будем вкладывать значительные средства в наш медицинский корпус, разрабатывать новые методы работы в полевых больницах, улучшать оказание первой помощи на поле боя и обеспечивать, чтобы наши раненые могли быть эвакуированы и эффективно лечиться."
  
 generic_shared_army_a_professional_army: "Профессиональная, опытная армия"
 generic_shared_army_a_professional_army_desc: "Масса, огневая мощь и материально-техническое обеспечение объединились, мы создали профессиональную, опытную армию, наши солдаты хорошо обучены, наши офицеры - ветераны, наши линии снабжения в безопасности, наша артиллерия не сравнится, мы готовы к долгой, мучительной войне выбытия, и мы готовы выиграть ее."
  
 generic_shared_expand_the_arms_industry: "Расширение оружейной промышленности"
 generic_shared_expand_the_arms_industry_desc: "Современная армия построена на современном заводе. Наша нынешняя оружейная индустрия опасно недостаточна для того, чтобы оснастить большие военные силы, необходимые для национальной обороны. Мы начнем финансируемую государством программу строительства новых военных фабрик и расширения существующих, закладывая основу для нашего арсенала."
  
 generic_shared_new_production_methods: "Эффективное производство"
 generic_shared_new_production_methods_desc: "Недостаточно просто построить больше заводов; мы должны заставить наши существующие заводы работать умнее, быстрее и дешевле. Мы будем изучать и внедрять новые методы производства, такие, как сборка и стандартизация, в целях повышения эффективности, сокращения отходов и максимального увеличения объема производства нашей оружейной промышленности."
  
 generic_shared_expand_the_arms_industry2: "Расширение оружейной промышленности II"
 generic_shared_expand_the_arms_industry2_desc: "Первоначальное расширение было успешным, однако требования высшего командования и темпы модернизации продолжают расти."
  
 generic_shared_expand_the_arms_industry3: "Расширение оружейной промышленности III"
 generic_shared_expand_the_arms_industry3_desc: "Это окончательное, массовое расширение нашего военно-промышленного комплекса даст нам возможность не только оснащать наши собственные силы, но и раздувать наших соперников и вести войну на многочисленных фронтах."
  
 generic_shared_room_for_improvement: "Планы строительства военных заводов"
 generic_shared_room_for_improvement_desc: "Для обеспечения организации и эффективности будущего роста мы должны провести обследование новых регионов в целях промышленного развития, что позволит разработать национальные планы строительства, выявить неразвитые районы с хорошими ресурсами и инфраструктурой, проложить путь к будущему строительству заводов."
  
 generic_shared_expand_aviation: "Расширение авиации"
 generic_shared_expand_aviation_desc: "Небо — это новая граница войны, и страна без способных военно-воздушных сил находится в милости того, у кого она есть. Мы создадим официальные, независимые военно-воздушные силы, профинансироваем современные экспериментальные учебные программы и построим новые авиабазы, чтобы проецировать нашу мощь и защитить нашу родину."
  
 generic_shared_prioritize_fighters: "Приоритизировать борцов"
 generic_shared_prioritize_fighters_desc: "Прежде чем наши бомбардировщики смогут нанести удар или наши войска смогут продвинуться вперед, мы должны добиться господства в воздухе."
  
 generic_shared_air_cas_innovations: "Инновации КАС"
 generic_shared_air_cas_innovations_desc: "Концепция &quot; летающей артиллерии &quot; имеет огромный потенциал, мы будем вкладывать средства в разработку новаторских самолетов и тактики &quot; Близкая авиация &quot; . Эти самолеты, от ныряющих бомбардировщиков до наземных нападающих, будут работать в прямом взаимодействии с нашими наземными силами, ломая сильные точки противника и прекратив бронетанковые нападения."
  
 generic_shared_air_fighter_innovations: "Инновации борцов"
 generic_shared_air_fighter_innovations_desc: "Гонка за превосходство воздушной среды - это технологический процесс. Мы должны постоянно инновировать, фокусируясь на более мощных двигателях, большем вооружении и более продвинутых аэродинамических корпусах для наших бойцов. Каждый новый проект должен быть скачком вперед, обеспечивая сохранение наших границ."
  
 generic_shared_air_battlefield_support: "Доктрина поддержки боевых действий I"
 generic_shared_air_battlefield_support_desc: "Недостаточно иметь самолёты "Закрыть авиацию", мы должны иметь доктрину, чтобы эффективно использовать их. Эти усилия оформят доктрину "Бэттлфилдская поддержка", обучая наших пилотов и наземных диспетчеров бесперебойно работать над выявлением и уничтожением наземных целей противника."
  
 generic_shared_air_battlefield_support2: "Доктрина поддержки боевых действий II"
 generic_shared_air_battlefield_support2_desc: "Наша первоначальная доктрина поддержки доказала свою эффективность."
  
 generic_shared_air_new_models: "Новые модели самолёта"
 generic_shared_air_new_models_desc: "Темпы развития авиации ошеломляют. Сегодня мы будем финансировать наши авиационные компании для разработки и испытания нового поколения самолетов, от истребителей до бомбардировщиков, с тем чтобы наши военно-воздушные силы не остались позади."
  
 generic_shared_air_paratroopers: "Десантники"
 generic_shared_air_paratroopers_desc: "Самолёт позволяет нам полностью обойти линию фронта, проникая глубоко в заднюю часть врага. Мы начнем тренировать элитные подразделения Fallschirmjäger — солдат, которые могут спуститься с неба, чтобы захватить такие важнейшие цели, как мосты и аэродромы, посеять хаос и открыть путь к нашему главному прогрессу."
  
 generic_shared_prioritize_bombers: "Приоритизировать бомбардировщиков"
 generic_shared_prioritize_bombers_desc: "Боевик защищает, атакует бомбардировщиков, чтобы выиграть следующую войну, мы должны нанести удар по сердцу врага, уничтожив его фабрики, инфраструктуру и его волю к борьбе."
  
 generic_shared_air_heavy_fighter_innovations: "Инновации тяжелых боев"
 generic_shared_air_heavy_fighter_innovations_desc: "Формирование тяжелых бомбардировщиков - заманчивая и уязвимая цель, чтобы защитить нашу стратегическую руку, мы должны разработать дальние «тяжелые истребители» или «серстёрерские» самолеты, которые смогут сопроводить наших бомбардировщиков на весь путь к цели и огневой мощи, чтобы отследить вражеские перехватчики."
  
 generic_shared_air_bomber_innovations: "Инновации бомбардировщиков"
 generic_shared_air_bomber_innovations_desc: "Мы будем изучать новые бомбовые прицелы, большие загрузки бомб и усовершенствованные навигационные средства, чтобы наши бомбардировщики могли точно поражать свои цели, даже в глубине территории противника, днем и ночью."
  
 generic_shared_air_experienced_bombers: "Опытные бомбардировщики"
 generic_shared_air_experienced_bombers_desc: "Мы создадим специализированные школы для наших экипажей бомбардировщиков, используя уроки ранних рейдов, для разработки эффективных форм полета и оборонительной тактики, и их опыт станет нашим щитом."
  
 generic_shared_air_nav: "Бомбардировщики NAV"
 generic_shared_air_nav_desc: "Военно-морские силы противника представляют угрозу, а их конвои - жизненно важный спасательный путь. Мы создадим специализированные «Навальные бомбардировщики», оснащенные торпедами и бронебойными бомбами, способные охотиться и уничтожать вражеские флоты в открытом море и душить их морскую торговлю."
  
 generic_shared_air_bomber_doctrines: "Доктрины бомбардировщиков I"
 generic_shared_air_bomber_doctrines_desc: "Большой флот бомбардировщиков нуждается в руководящей стратегии. Мы официально примем стратегическую доктрину бомбардировок, идентифицирующую ключевые вражеские узлы - факторы, нефтеперерабатывающие заводы и железнодорожные станции - и создадим систематический план по их уничтожению и подрыву военных усилий противника."
  
 generic_shared_air_bomber_doctrines2: "Доктрины бомбардировщиков II"
 generic_shared_air_bomber_doctrines2_desc: "Наша первоначальная доктрина бомбардировок показала нам путь. Мы усовершенствуем его, сосредоточимся на методах ночного полёта, радиолокационных бомбардировках и массивных "бумберных потоках", предназначенных для того, чтобы одолеть противника и максимально уничтожить наши стратегические цели."
  
 generic_shared_expand_air_defense: "Расширить зенитную оборону"
 generic_shared_expand_air_defense_desc: "Что мы можем сделать с нашими врагами, они могут сделать с нами. Мы должны быть готовы защитить наши города и фабрики от вражеских воздушных налетов. Эта программа расширит нашу зенитную артиллерию, инвестирует в радиолокационные станции и организует нашу защиту противника."
  
 generic_shared_air_production: "Вопрос о покупке или производстве"
 generic_shared_air_production_desc: "Наша авиационная промышленность все еще находится в зачаточном состоянии. Перед нами стоит критически важный выбор: следует ли нам тратить наши драгоценные ресурсы медленно развивая наше собственное внутреннее производство, или же нам следует искать за границей, покупая проверенные конструкции и лицензии у более развитых стран? Это исследование определит наш национальный путь к развитию авиации."
  
 generic_shared_strengthen_the_navy: "Укрепление военно-морского флота"
 generic_shared_strengthen_the_navy_desc: "Для того чтобы защитить нашу торговлю, защитить наши берега и проецировать нашу мощь, мы должны начать всеобъемлющую программу укрепления военно-морского флота, который слишком долго игнорировался, нужны новые корабли, новые базы и новые доктрины."
  
 generic_shared_navy_heavy_fleet: "Тяжелый флот"
 generic_shared_navy_heavy_fleet_desc: "Истинная военно-морская мощь измеряется в столицах кораблей. Доктрина «Флота в Бытии» требует, чтобы мощный флот кораблей и тяжелых крейсеров мог удержать любого врага и контролировать моря. Мы положим киль для нового «Безумного флота», флота, который может бросить вызов любому сопернику в решающей битве."
  
 generic_shared_navy_capital_ship_innovations: "Инновации на капитале судов"
 generic_shared_navy_capital_ship_innovations_desc: "Наши новые боевые корабли должны быть самыми передовыми в мире, мы будем инвестировать в исследования, связанные с более высокими схемами бронетранспортеров, более мощными пулеметами и более мощными турбинными двигателями."
  
 generic_shared_navy_battlecruiser_innovations: "Инновации боевых круизеров"
 generic_shared_navy_battlecruiser_innovations_desc: "Скорость - это его форма доспехов. Мы будем первопроходцами в новых проектах "Бэттлкрузера", кораблей, которые сочетают скорость крейсера с тяжелым ударом корабля. Они будут идеальными охотниками для современного флота, способными бегать по любому более быстрому кораблю и бегать по сильному."
  
 generic_shared_navy_heavy_navy_doctrine: "Флот в быту"
 generic_shared_navy_heavy_navy_doctrine_desc: "Мы официально примем доктрину «Флота в Быти», обучая наших адмиралов маневрам большого флота и дуэлям дальней дальности, нашей главной целью будет поиск и уничтожение главного боевого флота противника в одном, решительном бою."
  
 generic_shared_navy_light_fleet: "Легкий флот"
 generic_shared_navy_light_fleet_desc: "Мы сосредоточимся на строительстве «Лайт Флота» — «штурмового» флота, разработанного для того, чтобы воспрепятствовать вражеской торговле, защитить наше собственное судоходство и проконтролировать наши более ценные активы."
  
 generic_shared_navy_submarine_innovations: "Инновации подводных лодок"
 generic_shared_navy_submarine_innovations_desc: "Подводная лодка - молчаливый убийца, конечное ассиметричное оружие против высшей военно-морской мощи. Мы будем проводить исследования по инновациям "U-boat", развивать лодки с более высокой дальностью, глубиной ныряния и более смертоносными торпедами. Торговый морской пехотинец врага научится бояться глубины."
  
 generic_shared_navy_destroyer_innovations: "Уничтожение инноваций"
 generic_shared_navy_destroyer_innovations_desc: "Для каждого охотника есть прилавок, наши разрушители должны быть хозяевами световых морей, мы разработаем более быстрые эсминцы, оснащенные современными глубинными зарядами и сонарными, что сделает их идеальными подводных убийцами и идеальным, разносторонним экраном для нашего флота."
  
 generic_shared_navy_light_navy_doctrine: "Торговое препятствование"
 generic_shared_navy_light_navy_doctrine_desc: "Легкий флот требует иного мышления, чем тяжелый. Мы примем доктрину "торгового противостояния", обучая наши подводные "волчьи пачки" и крейсерские группы голодать противника жизненно важных ресурсов. Наш флот сосредоточится на войне выбытия, потопке их торговли и удушении их экономики."
  
 generic_shared_navy_establish_a_merchant_marine: "Создание торгового морского флота"
 generic_shared_navy_establish_a_merchant_marine_desc: "Морской флот бесполезен, если нет торговли, которую можно было бы защитить. Мы будем субсидировать строительство большого современного «Мертвого моря». Эти гражданские перевозки станут жизненной кровью нашей нации в военное время, которая будет перевозить жизненно важные ресурсы и запасы со всего мира."
  
 generic_shared_navy_troop_transports: "Перевозки военнослужащих"
 generic_shared_navy_troop_transports_desc: "Армия, которая не может пересечь море, калечена, ограничена одним континентом. Мы должны иметь возможность перевозить наших солдат на иностранные берега. Эта программа закажет флот преданных "Troop Transports" и разработает морскую доктрину для амфибийных атак."
  
 generic_shared_state_of_the_economy: "Состояние экономики"
 generic_shared_state_of_the_economy_desc: "Сила нации — это ее экономика. Прежде чем мы сможем осуществить какие-либо крупные реформы, мы должны провести полный обзор нашего промышленного потенциала, производства ресурсов и торговой политики. Эта оценка станет основой нашего будущего экономического планирования и определит наш путь к процветанию."
  
 generic_shared_economy_autarky: "Автарки"
 generic_shared_economy_autarky_desc: "Для того чтобы быть подлинно суверенным, нация должна быть действительно самодостаточной, мы не можем полагаться на иностранные державы в отношении ресурсов, которые нам нужны для ведения войны или строительства нашей промышленности, мы будем идти по пути «Автарки», цель которого состоит в производстве всего, что нам нужно — от стали до нефти — в пределах наших собственных границ."
  
 generic_shared_economy_autarky_industrial_innovations: "Промышленные инновации"
 generic_shared_economy_autarky_industrial_innovations_desc: "Самодостаточная экономика должна быть эффективной. Мы будем инвестировать в промышленные исследования, разрабатывать новые производственные технологии и улучшать соотношение между обработкой ресурсов и факторами производства. Мы должны научиться делать больше с меньшими затратами."
  
 generic_shared_economy_autarky_infrastructure: "Инфраструктура"
 generic_shared_economy_autarky_infrastructure_desc: "Для того чтобы перевести ресурсы из наших шахт на наши заводы, нам нужна современная транспортная сеть. Эта первая "Инфраструктура Эффорта" будет сосредоточена на строительстве и модернизации автомобильных и железных дорог в наших наиболее важных регионах, производящих ресурсы."
  
 generic_shared_economy_autarky_civilian_factories: "Строительство"
 generic_shared_economy_autarky_civilian_factories_desc: "Наше аутарковское государство будет построено нашими собственными руками. Это "Строительство" увидит государственный фонд создания новых гражданских фабрик, расширяя промышленную базу, необходимую для построения нашего собственного будущего, свободного от иностранной зависимости."
  
 generic_shared_economy_autarky_civilian_factories2: "Строительство"
 generic_shared_economy_autarky_civilian_factories2_desc: "Первая волна строительства была успешной. Эта "Строительность II" будет еще более амбициозной, расширяя наш промышленный потенциал до уровней, которые сделают нашу страну настоящим промышленным домом, способным на любое предприятие."
  
 generic_shared_economy_autarky_infrastructure2: "Инфраструктура II"
 generic_shared_economy_autarky_infrastructure2_desc: "Эта вторая работа будет представлять собой широкомасштабный национальный проект, предусматривающий модернизацию всей железнодорожной сети в целях улучшения поставок и производственного потока по всей стране."
  
 generic_shared_economy_autarky_land_clearance: "Разминирование"
 generic_shared_economy_autarky_land_clearance_desc: "Каждый квадратный метр нашей страны должен быть использован для продуктивного использования. Мы начнем программу "Обезвреживания земель", осушение болот, расчистка лесов и восстановление засушливых земель, чтобы создать новые фермы, шахты и фабрики."
  
 generic_shared_economy_autarky_synthetic_research: "Синтетические исследования"
 generic_shared_economy_autarky_synthetic_research_desc: "Единственный ресурс, которого нам не хватает в изобилии, это нефть, кровь современной армии. Мы преодолеем этот недостаток с помощью науки. Мы профинансируем "синтетические исследования", новые методы превращения наших огромных запасов угля в жидкое топливо и каучук."
  
 generic_shared_economy_autarky_synthetic_factories: "Синтетические фабрики"
 generic_shared_economy_autarky_synthetic_factories_desc: "Исследования завершены. Теперь мы должны построить. Эта программа будет предусматривать строительство крупных "синтетических заводов", предназначенных для производства синтетического масла и каучука. Мы будем подпитывать нашу новую армию своей наукой и промышленностью."
  
 generic_shared_economy_protectionism: "Протекционизм"
 generic_shared_economy_protectionism_desc: "Глобальный рынок - это хаотичное и опасное место. Мы не можем допустить, чтобы наши ключевые отечественные отрасли были разрушены хищнической внешней конкуренцией. Мы будем проводить политику "защиты", повышая тарифы для защиты нашего местного бизнеса и обеспечения того, чтобы экономическая судьба нашей страны находилась в наших руках."
  
 generic_shared_economy_protecting_our_factories: "Защита наших фабрик"
 generic_shared_economy_protecting_our_factories_desc: "Наши фабрики являются национальным активом. Мы должны защитить их не только от иностранной конкуренции, но и от иностранного шпионажа и саботажа. Эта инициатива повысит безопасность на ключевых промышленных объектах и подтолкнет наши компании "покупать местные" для своих машинных инструментов."
  
 generic_shared_economy_guarantee_local_businesses: "Гарантии местных предприятий"
 generic_shared_economy_guarantee_local_businesses_desc: "Доверие является краеугольным камнем промышленности. Правительство будет "гарантировать местные предприятия", предлагая субсидии и льготные кредиты нашим отечественным компаниям. Это будет побуждать их расширяться, зная, что их страна стоит за ними."
  
 generic_shared_economy_land_reforms: "Больше места для фабрик"
 generic_shared_economy_land_reforms_desc: "Наша земля используется неэффективно. Старые, аристократические поместья находятся в подвале, пока наши фабрики перегружены городами. Мы введем "Ленд Реформы", чтобы разбить неиспользуемую землю и предоставить ее для нового промышленного и сельскохозяйственного развития."
  
 generic_shared_economy_expand_local_factories: "Расширить местные фабрики"
 generic_shared_economy_expand_local_factories_desc: "Наша протекционистская политика дала нашему местному бизнесу необходимую безопасность."
  
 generic_shared_economy_expand_local_factories2: "Расширить наши местные предприятия"
 generic_shared_economy_expand_local_factories2_desc: "На следующем этапе основное внимание будет уделяться развитию вторичной промышленности и мастерских, а также обеспечению того, чтобы мы не только строили, но и совершенствовали и производили дома сложные товары."
  
 generic_shared_economy_our_own_companies: "Местные компании"
 generic_shared_economy_our_own_companies_desc: "Мы будем поощрять рост «местных компаний», превращая небольшие мастерские в национальных чемпионов, поощряя отечественных предпринимателей, мы создадим устойчивую и разнообразную промышленную базу, которая в первую очередь будет лояльна нашей стране."
  
 generic_shared_economy_expand_local_factories3: "Местная промышленность"
 generic_shared_economy_expand_local_factories3_desc: "Наша внутренняя индустрия теперь полностью зрела, способна удовлетворять все наши национальные потребности и соревноваться с самыми лучшими в мире, на наших условиях."
  
 generic_shared_economy_resource_excavation: "Местные ресурсы"
 generic_shared_economy_resource_excavation_desc: "Почему мы должны платить иностранным горнякам за ресурсы, если у нас есть невыразимое богатство под нашей землей? Эта инициатива "местные ресурсы" будет финансировать обширную геологическую съемку и открывать новые шахты, максимально увеличивая раскопки нашей национальной ресурсной базы."
  
 generic_shared_economy_free_trade: "Свободная торговля"
 generic_shared_economy_free_trade_desc: "Мир — это наш рынок. Мы отвергаем недальновидность аутарки и протекционизма. Процветание — это открытость."
  
 generic_shared_economy_free_trade_the_flow: "Поток ресурсов"
 generic_shared_economy_free_trade_the_flow_desc: "Мы будем вкладывать средства в наши порты, торговые морские и таможенные службы, чтобы обеспечить как можно более быстрый и эффективный «поток ресурсов»."
  
 generic_shared_economy_free_trade_investures_abroad: "Инвесторы за рубежом I"
 generic_shared_economy_free_trade_investures_abroad_desc: "Наш капитал не должен быть пустым. Эта первая программа "Инвесторы за рубежом" позволит нашим правительствам и частным компаниям вкладывать средства в развитие инфраструктуры и промышленности в дружественных иностранных государствах. Это обеспечит нам доступ к их ресурсам и рынкам."
  
 generic_shared_economy_free_trade_investures_abroad2: "Инвесторы за рубежом II"
 generic_shared_economy_free_trade_investures_abroad2_desc: "Наши иностранные инвестиции оказались весьма прибыльными. Эта вторая волна будет более амбициозной, стремясь получить контроль над ключевыми операциями по извлечению ресурсов во всем мире. Наша экономика будет подпитываться миром."
  
 generic_shared_economy_free_trade_investures_abroad3: "Инвесторы за рубежом III"
 generic_shared_economy_free_trade_investures_abroad3_desc: "Эта окончательная программа укрепит нашу экономическую империю, обеспечивая, чтобы через сеть инвестиций и торговых сделок наш доступ к мировым ресурсам был постоянным и беспрепятственным."
  
 generic_shared_economy_free_trade_goods_at_home: "Товары на дому"
 generic_shared_economy_free_trade_goods_at_home_desc: "Благодаря снижению тарифов на импортные товары мы будем обеспечивать стабильное предложение дешевых "товаров дома", повышая уровень жизни и сохраняя счастливое население."
  
 generic_shared_economy_free_trade_idea_sharing: "Последние промышленные идеи"
 generic_shared_economy_free_trade_idea_sharing_desc: "Свободная торговля - это не только товары, но и идеи. Открывая наши двери, мы поощряем "Последние промышленные идеи" из-за рубежа, которые попадают в наши университеты и корпорации, ускоряя наше собственное технологическое развитие."
  
 generic_shared_economy_free_trade_securing_our_industry: "Обеспечение безопасности нашей промышленности"
 generic_shared_economy_free_trade_securing_our_industry_desc: "В то время как мы участвуем в свободной торговле, мы не наивны. Мы должны «защищать нашу индустрию», инвестируя в самые высокотехнологичные и производительные сектора, обеспечивая, чтобы даже на открытом рынке наши внутренние чемпионы могли превзойти любого соперника."
  
 generic_shared_economy_free_trade_productivity: "Лучшая сделка"
 generic_shared_economy_free_trade_productivity_desc: "На свободном рынке эффективность — это выживание. Мы будем неустанно следовать «Лучшим курсам» и наивысшей производительности, заставляя наши отрасли стать стройными, инновационными и мировыми классами. Неэффективные будут адаптироваться или погибнуть."
  
 generic_shared_our_place_in_the_world: "Наше место в мире"
 generic_shared_our_place_in_the_world_desc: "Мы не маленькая нация, и настало время, чтобы мир признал это. Мы должны определить "Наше место в мире". Этот акцент переоценит нашу национальную стратегию, наши амбиции и нашу роль как крупной державы на мировой арене. Мы больше не будем молчать."
  
 generic_shared_major_research_institution: "Усовершенствованные НИОКР"
 generic_shared_major_research_institution_desc: "Мы создадим новый институт "Улучшенных НИОКР", национальную лабораторию, занимающуюся передовой наукой и исследованиями "голубого неба", обеспечивая наше технологическое превосходство для следующего поколения."
  
 generic_shared_major_further_research_funding: "Дополнительное финансирование исследований"
 generic_shared_major_further_research_funding_desc: "Наш новый исследовательский институт - хорошее начало, но наука работает не только на финансировании, но и на амбициях, мы будем утверждать «дополнительное финансирование исследований» для всех наших университетов и лабораторий, ускоряя наше научное открытие на всех фронтах."
  
 generic_shared_major_expand_dockyards: "Расширить докьярды"
 generic_shared_major_expand_dockyards_desc: "Крупная энергия нуждается в большом флоте, который может проецировать энергию по всему миру. Чтобы построить и поддерживать такой флот, мы должны "выпустить докьярды", построить новые сухие доки и скользкие дорожки, способные построить крупнейшие боевые корабли и носители."
  
 generic_shared_major_economic_boom: "Экономический бум"
 generic_shared_major_economic_boom_desc: "Этот «экономический бум» станет массовым государственным стимулом, финансированием инфраструктуры, промышленности и исследований, позволяющим одновременно создать период беспрецедентного роста и процветания."
  
 generic_shared_major_rails_of_tomorrow: "Завтрашние железные дороги"
 generic_shared_major_rails_of_tomorrow_desc: "Наши амбиции носят континентальный характер, и они должны поддерживаться железными дорогами завтрашнего дня. Это не просто обновление; это полное восстановление нашей железнодорожной сети до самых высоких стандартов, что позволяет быстро перемещаться армии и поставки из одного конца нашей сферы в другой."
  
 generic_shared_major_expanded_civilian_factories: "Расширенные гражданские фабрики"
 generic_shared_major_expanded_civlian_factories: "Стремительная экономика требует большой промышленной базы. Мы санкционируем строительство «Расширенных гражданских фабрик» в масштабах, которые еще никогда не были видны, давая нам возможность строить что-либо, финансировать любой проект и превзойти любого врага."
  
 generic_shared_major_expanded_military_factories: "Расширенные военные фабрики"
 generic_shared_major_expanded_military_factories_desc: "Мы будем строить «расширенные военные фабрики», создавая такой огромный арсенал, что он может оснащать не только наши собственные армии, но и армии наших союзников и марионеток."
  
 generic_shared_major_our_sphere_of_influence: "Наша сфера влияния"
 generic_shared_major_our_sphere_of_influence_desc: "Мы официально объявим «Сферу влияния», сообщая другим великим державам, что наши соседи находятся под нашей защитой и экономическим руководством."
  
 generic_shared_major_rocketry: "Ракета"
 generic_shared_major_rocketry_desc: "Следующая граница - это не небо, а пространство над ним. Мы начнем теоретические и практические исследования "Рокетрии". В то время как прямое применение может быть связано с оружием дальнего террора, будущий потенциал науки и престижа безграничен."
  
 generic_shared_major_doomsday_weapons: "Оружие Судного дня"
 generic_shared_major_doomsday_weapons_desc: "Ракета дает нам дальность, но какую полезную нагрузку она будет нести? Мы должны исследовать новые, ужасные технологии, основанные на атомном расщеплении, которые могут положить конец войне в одной, ослепляющей факеле. Чтобы быть большой силой, нужно обладать абсолютным, ужасным сдерживанием."
  
 generic_shared_modern_politics: "Современная политика"
 generic_shared_modern_politics_desc: "Старые способы управления умирают. Мир - это один из средств массовой информации, массовых движений и новых, опасных идей. Мы должны адаптировать нашу политическую систему к "модернистской политике", решая, какой путь пойдет наша нация в эту бурную новую эру: путь свободы, путь порядка или путь революции."
  
 generic_shared_politics_centrism: "Центизм"
 generic_shared_politics_centrism_desc: "Краевы левых и правых предлагают только разделение, террор и разруху. Мы пойдем по пути "центриста", который будет сбалансированным, прагматичным и компромиссным. Наше правительство будет стремиться к стабильности и процветанию для всех, а не к идеологической чистоте."
  
 generic_shared_politics_political_free_press: "Свободная пресса"
 generic_shared_politics_political_free_press_desc: "Здоровая демократия требует информированных и скептических граждан. Мы гарантируем права "Свободной прессы", обеспечивая журналистам возможность сообщать о действиях правительства, не опасаясь репрессий. Транспарентность - это самое известное противоядие коррупции."
  
 generic_shared_politics_representative_government: "Представитель правительства"
 generic_shared_politics_representative_government_desc: "Мы будем укреплять наш парламент и обеспечивать «представительское правительство», где депутаты избираются свободно и справедливо, а кабинет подотчетен народу, которому он служит, а не наоборот."
  
 generic_shared_politics_democracy_research: "Бесплатное образование"
 generic_shared_politics_democracy_research_desc: "Невежество является врагом демократии. Мы обеспечиваем каждому гражданину возможность критически мыслить, участвовать в политическом процессе и вносить вклад в наш национальный научный и культурный прогресс."
  
 generic_shared_politics_citizen_rights: "Права наших граждан"
 generic_shared_politics_citizen_rights_desc: "Свобода слова, свобода собраний и право на справедливое судебное разбирательство являются не просто абстрактными идеалами; они являются основой нашего стабильного и справедливого общества."
  
 generic_shared_politics_political_freedom: "Политическая свобода"
 generic_shared_politics_political_freedom_desc: "Наша нация станет маяком «Политической свободы». Всем партиям, при условии уважения демократического процесса и конституции, будет позволено действовать свободно. Это соревнование идей укрепит нашу политическую систему, а не ослабит ее."
  
 generic_shared_politics_academic_sponsoring: "Научное спонсорство"
 generic_shared_politics_academic_sponsoring_desc: "Наше демократическое правительство докажет свою ценность, инвестируя в будущее."
  
 generic_shared_politics_promote_our_party: "Пропаганда нашей партии"
 generic_shared_politics_promote_our_party_desc: "Хотя мы верим в демократию, мы также считаем, что у нашей партии есть лучшее видение нации, мы будем «пропагандировать нашу партию» посредством публичных митингов, рекламных кампаний и организации общин, чтобы люди понимали и поддерживали нашу разумную повестку дня."
  
 generic_shared_politics_a_strong_constitution: "Сильная демократическая конституция"
 generic_shared_politics_a_strong_constitution_desc: "Мы будем разрабатывать "Сильную демократическую конституцию", основополагающий документ, устанавливающий четкое разделение властей и защищающий права народа от любого будущего правительства, которое может их нарушить."
  
 generic_shared_politics_the_light_of_democracy: "Свет демократии"
 generic_sHared_politics_the_light_of_democracy_desc: "Наша демократия не только для нас, но и для всего мира. Мы будем «Светом демократии», активно поддерживая другие демократические движения и формируя новый союз свободных наций, чтобы противостоять нарастающей волне тирании."
  
 generic_shared_politics_rightism: "Правый подход"
 generic_shared_politics_rightism_desc: "Демократия слаба, деградирована и медленна. Коммунизм - это рак материалиста. Единственный истинный путь вперед - это "правый путь" - путь национального единства, духовного возрождения, силы и единственной цели. Мы ставим Нацию на первое место, выше всех других мелких преданий."
  
 generic_shared_politics_patriotism: "Патриотизм"
 generic_shared_politics_patriotism_desc: "Мы начнем национальную кампанию по поощрению "Патриотизма", возрождения национальных мифов, почитания наших павших героев и привития глубокой и неизменной любви к родине каждому мужчине, женщине и ребенку."
  
 generic_shared_politics_promote_militarism: "Поощрять милитаризм"
 generic_shared_politics_promote_militarism_desc: "Сила нации — это ее армия. Мы будем «пропагандировать милитаризм» в нашей культуре, проводить грандиозные парады, поощрять молодежные военизированные группы и повышать солдат на высший почетный пост в нашем обществе. Нация должна стать армией, а армия — своей душой."
  
 generic_shared_politics_our_right_to_conquest: "Наше право на поимку"
 generic_shared_politics_our_right_to_conquest_desc: "Сильная нация, как сильная личность, нуждается в возможности для роста. Мы закрепим наше право на заключение договора, претендуя на наше законное «место на солнце». Наша судьба — править, и любые слабые нации, стоящие на нашем пути, должны быть отброшены в сторону."
  
 generic_shared_politics_a_strong_state: "Сильное правительство"
 generic_shared_politics_a_strong_state_desc: "Бесконечные, жалкие споры политиков должны прекратиться. Мы построим "Сильное правительство", централизуя власть в руках единого, решительного лидера и единой, верной партии. Воля нации будет монолитной и мгновенной."
  
 generic_shared_politics_a_strong_police: "Сильные полицейские силы"
 generic_shared_politics_a_strong_police_desc: "Чтобы построить сильное государство, мы должны сначала установить абсолютный порядок, мы будем расширять и расширять наши национальные полицейские силы, обеспечивая, чтобы «крепкие полицейские силы» могли поддерживать внутреннюю стабильность и искоренять предателей, дегенератов и шпионов."
  
 generic_shared_politics_a_strong_country: "Сильная страна"
 generic_shared_politics_a_strong_country_desc: "С помощью силы, единства и непоколебимой воли мы создадим «крепкую страну». Наша промышленная, военная и политическая власть будет объединена в одну неостановимую силу, готовую отстаивать свою законную судьбу."
  
 generic_shared_politics_press_censorship: "Цензура печати"
 generic_shared_politics_press_censorship_desc: "Так называемая «свободная пресса» — это инструмент наших врагов, распространяющий ложь, сомнения и инакомыслие. Мы будем осуществлять полную «цензуру», обеспечивая, чтобы все газеты, радиопередачи и кино отражали национальную волю и поддерживали цели государства."
  
 generic_shared_politics_surpress_opponents: "Ужасные политические оппоненты"
 generic_shared_poltitics_surpress_opponents_desc: "Нет места для инакомыслия в едином государстве. Мы будем "Сурпрессировать политических противников", запрещать все другие партии и жестко обращаться с теми, кто осмеливается выступать против лидера и нации. Единство будет обеспечено."
  
 generic_shared_politics_authoritarian_research: "Государственные университеты"
 generic_shared_politics_authoritarian_research_desc: "Наука должна служить государству. Мы реорганизуем спонсируемые государством университеты, очистим их от неверных или дегенеративных элементов и направим их исследования на практические цели: лучшее оружие, лучшую индустрию и подтверждение нашей национальной идеологии."
  
 generic_shared_politics_leftism: "Левизизм"
 generic_shared_politics_leftism_desc: "Старый порядок построен на эксплуатации, аристократии и жадности. Единственный путь к справедливому будущему - это путь, который ставит на первое место трудящегося, фермера и простого человека. Средства производства должны принадлежать народу, а не паразитной элите."
  
 generic_shared_politics_collectivization: "Объединение"
 generic_shared_politics_collectivization_desc: "Старая, неэффективная система частных мелких фермерских хозяйств должна закончиться. С помощью "коллективизации", мы объединим эти участки в крупные государственные сельскохозяйственные комплексы. Это модернизирует нашу сельскохозяйственную промышленность и обеспечит стабильное, рациональное распределение продовольствия для наших городов и армий."
  
 generic_shared_politics_a_workers_state: "Государство трудящегося"
 generic_shared_politics_a_workers_state_desc: "Эта нация будет перестроена с нуля, она станет "Государством трудящегося", где будет почитаться труд пролетариата, и будет ликвидирована паразитическая буржуазия. Вся сила попадет с фабрик и полей, руководимая партией."
  
 generic_shared_politics_internationalism: "Интернационализм"
 generic_shared_politics_internationalism_desc: "Наша революция не только для нас, но и для трудящихся мира. Мы принимаем «интернационализм», считая, что у пролетариата нет нации. Наша конечная цель — это глобальный союз социалистических государств, свободный от тирании границ и капитала."
  
 generic_shared_politics_spreading_the_revolution: "Распространение революции"
 generic_shared_politics_spreading_the_revolution_desc: "Цепочки угнетения не рухнут сами по себе; они должны быть разрушены. Мы должны быть готовы к "Захвату революции", активной поддержке и провоцированию пролетарских восстаний в других странах, подрывной деятельности или, в случае необходимости, силой."
  
 generic_shared_politics_incorporating_trade_unions: "Включает в себя профессиональные союзы"
 generic_shared_politics_incorporating_trade_unions_desc: ""Профсоюзы" - это естественное место революции. Мы официально "встроим" их в структуру государства, давая им новую власть над управлением фабриками и гарантируя абсолютную преданность индустриального рабочего класса партии."
  
 generic_shared_politics_socialist_commitee: "Социалистический комитет"
 generic_shared_politics_socialist_commitee_desc: "Чтобы направлять революцию и защищать ее от врагов, мы должны сформировать «социалистический комитет» — авангардную партию истинных верующих и революционных мыслителей, которые будут действовать как мозг и совесть нового рабочего государства."
  
 generic_shared_politics_socialist_education: "Социалистическое образование"
 generic_shared_politics_socialist_education_desc: "Мы создадим новую систему "социалистского образования", обучая наших детей принципам нашей идеологии и готовя их к тому, чтобы стать архитекторами нового мира."
  
 generic_shared_politics_secret_police: "Секретная полиция"
 generic_shared_politics_secret_police_desc: "Революция имеет много врагов - иностранных шпионов, диверсантов и контрреволюционеров, прячущихся в наших собственных границах."
  
 generic_shared_politics_crack_down_on_resistance: "Удар по сопротивлению"
 generic_shared_politics_crack_down_on_resistance_desc: "Не все примут новый мир; некоторые безнадежно отравлены старыми. Мы должны "Покончить с Сопротивлением", не проявляя милосердия к реакционерам, разрушителям или предателям. Революцию нужно защищать, сколько бы это ни стоило."
  
 generic_shared_politics_collectivist_commitee: "Коллегиалистские комитеты"
 generic_shared_politics_collectivist_commitee_desc: "Наши «коллективистские комитеты» распространят революцию на все аспекты жизни, и эти местные советы трудящихся и фермеров будут управлять своими делами, руководствуясь мудростью центральной партии, обеспечивая, чтобы революция дошла до каждого дома."
  
 generic_shared_politics_collectivist_education: "Социалистические науки"
 generic_shared_politics_collectivist_education_desc: "Буржуазская наука - это ложь, которая используется для поддержания капитала. Мы будем поощрять «социалистскую науку», новый образ мышления, свободный от старых суперстистов и предрассудков. Мы будем финансировать исследования, которые служат людям и доказывают материальную истину нашей идеологии."
