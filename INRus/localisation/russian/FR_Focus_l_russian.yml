 ### Generic Decisions ###
 generic_decision_our_place_in_the_world: "Наше место в мире"
 generic_decision_our_place_in_the_world_desc: "Слишком долго нас считали незначительными по сравнению с другими странами мира - ну, не больше. С этого дня наша нация будет считаться крупной державой, и мы обеспечим свое место в мире!"
