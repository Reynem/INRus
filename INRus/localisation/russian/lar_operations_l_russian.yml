l_russian:
 operation_boost_resistance: "Укреплять сопротивление"
 operation_boost_resistance_desc: "На оккупируемой врагом территории они отчаянно нуждаются в поддержке, чтобы продолжать борьбу."
 operation_capture_cipher: "Захват Cipher"
 operation_capture_cipher_desc: "§LCapiting codebook, или приобретение его другими средствами, дало бы нашим нарушителям решающее преимущество в их усилиях.§!"
 infiltration_paradrop: "Проникновение через парашют"
 infiltration_paradrop_desc: "Агенты будут выброшены в этот район с помощью парашюта, летят низко, а ночью избегают какого-либо вмешательства вражеских боевиков."
 infiltration_submarine: "Развертывание через субмарин"
 infiltration_submarine_desc: "Агенты будут доставлены рядом с берегом одной из наших подводных лодок, мы уже провели разведку возможных мест посадки и времени вражеских патрулей, чтобы избежать обнаружения."
 infiltration_border: "Проникновение через нейтральную границу"
 infiltration_border_desc: "Предполагалось, что пограничники в этом районе будут менее осторожны, и мы уже определили ряд районов, где патрулирование границы происходит очень редко."
 infiltration_diplomatic: "Дипломатические паспорта"
 infiltration_diplomatic_desc: "Агенты используют дипломатические паспорта, чтобы въехать в страну и передвигаться."
 resistance_support_arms_depots: "Создать кекс для поставок"
 resistance_support_arms_depots_desc: "Наши агенты создадут несколько скрытых тайников взрывчатых веществ и другого оборудования в рамках подготовки к всеобщему восстанию, как только сопротивление будет достаточно сильным."
 resistance_support_distribute_weapons: "Распределяемое оружие"
 resistance_support_distribute_weapons_desc: "Наши агенты будут организовывать и координировать серию сбрасываний оружия, а затем оружие будет сдано доверенным членам местного сопротивления."
 resistance_support_organize_training: "Организация учебных лагерей"
 resistance_support_organize_training_desc: "Наши агенты будут проводить курсы по навыкам бегства и уклонения, а также по основам полевого аппарата."
 resistance_support_coordinate_groups: "Координировать группы сопротивления"
 resistance_support_coordinate_groups_desc: "Наши агенты будут путешествовать, чтобы координировать различные группы сопротивления."
 exfiltration_air_pickup: "Подъем авиакомпании"
 exfiltration_air_pickup_desc: "Один из наших самолетов проникнет на территорию противника ночью, найдёт помеченное поле, приземлится и заберет наших агентов."
 exfiltration_submarine_pickup: "Подъем по подводной лодке"
 exfiltration_submarine_pickup_desc: "Один из наших подводных лодок будет на станции на заданном пункте пикапа вдоль побережья."
 exfiltration_border: "Поездка через границу"
 exfiltration_border_desc: "Наши агенты сбегут, пересечь границу ночью в отдаленном месте."
 exfiltration_go_to_ground: "Спускаемся на землю"
 exfiltration_go_to_ground_desc: "Наши агенты залягут и смешаются с населением до тех пор, пока они не будут готовы к следующей миссии."
 operation_make_resistance_contacts: "Сделать контакт сопротивления"
 operation_make_resistance_contacts_desc: "Любая поддержка, которую мы можем предложить партизанам, действующим за вражескими линиями, стала бы гораздо более эффективной, если бы у нас был способ общаться и координировать с ними."
 capture_cyphers_bribe: "Солдат Брайда"
 capture_cyphers_bribe_desc: "У нас есть человек внутри и он предоставит ему необходимые средства, чтобы украсть код-книгу и передать её нашему агенту."
 capture_cyphers_raid: "Рейд Коммандо"
 capture_cyphers_raid_desc: "Наш агент разведает этот район и свяжется с командным подразделением для посадки и захвата кодовых книг и шифровального оборудования, а также попытаемся поймать одного или двух специалистов по шифрованию для допроса."
 capture_cyphers_seduction: "Использовать удобочитание"
 capture_cyphers_seduction_desc: "Наш агент свяжется с человеком, имеющим доступ к киферам, и использует их обаяние - или другие средства - чтобы получить копию."
 capture_cyphers_reverse_engineer: "Обратный инженер"
 capture_cyphers_reverse_engineer_desc: "Более простая версия первичной шифровальной машины страны доступна на коммерческой основе. Мы приобретем версию легально, а затем используем ее, чтобы помочь нам реверсировать машину расшифровки."
 resistance_contacts_radio_circuits: "Создать радиочастотные линии"
 resistance_contacts_radio_circuits_desc: "Группа распространит радиопередачи среди членов сопротивления и научит основам радиоаппаратуры, особенно с целью избежать обнаружения вражеских радионаблюдений."
 resistance_support_pidgeons: "Распределить голуби"
 resistance_support_pidgeons_desc: "Команда раздаст обученных голубей различным земледельцам, связанным с сопротивлением, которые будут использовать их для передачи сообщений на наши линии."
 resistance_contacts_briefings: "Брифинги по вопросам стратегии"
 resistance_contacts_briefings_desc: "Наш агент проинформирует руководителей различных групп сопротивления о планируемых операциях по координации поддержки сопротивления."
 capture_cyphers_smuggle: "Смеховые циклеры"
 capture_cyphers_smuggle_desc: "Один из наших двойных агентов запросит новую копию действующего в настоящее время шифра для передачи."
 operation_steal_tech_airforce: "Планы в области кражи авиационной промышленности"
 operation_steal_tech_airforce_desc: "Мы получили несколько очень тревожных сообщений о том, что враг впереди нас в нескольких областях проектирования самолетов. Если это так, то мы могли бы попытаться получить представление о том, как далеко они впереди, и использовать эти результаты для продвижения наших собственных исследований.§!"
 operation_infiltrate_armed_forces_navy: "Ввод в действие военно-морского флота"
 operation_infiltrate_armed_forces_navy_desc: "Хотя скрытая команда кораблей предлагает мало возможностей для проникновения, вспомогательный персонал дома - это другое дело. Получение кого-то внутри дает нам ценную информацию, а также возможность поддержать более сложные операции позже.§!"
 operation_infiltrate_civilian: "Противодействие гражданской администрации"
 operation_infiltrate_civilian_desc: "У правительства есть множество слабых мест, через которые мы могли бы проникнуть в агента в его операции. Это дало бы нам ценное представление о внутренней работе [от GetNameDef], а также дало бы нам возможность использовать этого агента в будущих операциях против [от GetNameDef].§!"
 operation_infiltrate_armed_forces_airforce: "Военно-воздушные силы"
 operation_infiltrate_armed_forces_airforce_desc: "Военно-воздушные силы — самые младшие из вооруженных сил, в их рядах много необычных людей. Мы могли бы использовать некоторых из них, чтобы заполучить человека внутри. §!"
 operation_infiltrate_armed_forces_army: "Армия инфильтрации"
 operation_infiltrate_armed_forces_army_desc: "В рядах армии имеется ряд лиц, которые могут быть привлечены для предоставления дополнительной информации и поддержки будущих операций."
 operation_steal_tech_army: "Военная кража"
 operation_steal_tech_army_desc: "Наши аналитики разведки считают, что [от GetNameDef] добились значительных успехов в области наземных боевых действий и военной инженерии."
 operation_steal_tech_civilian: "Кража промышленных отпечатков"
 operation_steal_tech_civilian_desc: "Похоже, что наша индустрия отстает в ряде областей."
 operation_steal_tech_navy: "Кража морских отпечатков"
 operation_steal_tech_navy_desc: "Поступили сообщения о том, что в некоторых областях военно-морской инженерии нам, похоже, предстоят технологии, которые можно было бы использовать для обратной отмены. §!"
 infiltrate_military_bribe: "Предложение Bribe"
 infiltrate_military_bribe_desc: "Наш агент определит человека, находящегося в затруднительном финансовом положении, и предложит нам значительную сумму, чтобы оказать нам поддержку."
 infiltrate_military_seduction: "Применить очарование"
 infiltrate_military_seduction_desc: "Наш агент вступит в очень близкие и близкие отношения с кем-то внутри, чтобы получить информацию и рычаги влияния на них."
 infiltrate_military_turned_pow: "Заключённый войны"
 infiltrate_military_turned_pow_desc: "Мы идентифицируем подходящего военнопленного, обратим его на нашу сторону, а затем репатриируем его; несомненно, его будут допрашивать, но с надлежащей подготовкой он сможет преодолеть это."
 infiltrate_military_ideological_supporter: "Контактный сотрудник по вопросам идеологии"
 infiltrate_military_ideological_supporter_desc: "Мы воспользуемся дипломатическими спинными каналами для выявления и установления контактов с членами [от имени] администрации, придерживающимися политических взглядов, которые не разделяются их правительством, и призываем их работать на нас."
 steal_blueprints_bribe: "Предложение Bribe"
 steal_blueprints_bribe_desc: "Наш агент предложит значительную сумму инженеру, участвующему в проекте."
 steal_blueprints_seduction: "Применить очарование"
 steal_blueprints_seduction_desc: "Наш агент подойдет к человеку, участвующему в проекте, и применит свои очарования, чтобы получить дополнительные знания."
 steal_blueprints_infiltrate_naval_design_office: "Инфильтровать военно-морской проектировочный отдел"
 steal_blueprints_infiltrate_naval_design_office_desc: "Наш агент войдет в более мелкого поставщика в военно-морском строительстве в качестве мелкого работника и использует эту должность, чтобы сделать копии имеющихся планов."
 steal_blueprints_steal_prototype: "Кража прототипа"
 steal_blueprints_steal_prototype_desc: "После прохождения базовой подготовки и в сопровождении пилота наших военно-воздушных сил наш агент получит доступ к прототипу и полетит к нашим линиям."
 steal_blueprints_middle_manager: "Внедрить систему среднего управления"
 steal_blueprints_middle_manager_desc: "Наш агент воспользуется предоставленными справочными материалами и сфабрикованным резюме, чтобы получить работу в среднем управлении крупной компанией, с этой точки зрения, они должны иметь возможность предоставлять информацию об этой компании, а также о отрасли в целом."
 targeted_sabotage_plant_explosives: "Взрывчатые вещества"
 targeted_sabotage_plant_explosives_desc: "Работая с местными членами сопротивления, наши оперативники проникнут на завод мертвой ночью, поместят взрывчатку рядом с несущими сооружениями и, таким образом, разрушат весь заводский зал сверху производственного оборудования."
 targeted_sabotage_organize_more_meetings: "Организация большего числа встреч"
 targeted_sabotage_organize_more_meetings_desc: "Беседы с работниками показали, что проведение широких встреч для обсуждения незначительных вопросов приводит к резкому замедлению производства при минимальных затратах для наших сотрудников."
 targeted_sabotage_destroy_bridge: "Уничтожить мост"
 targeted_sabotage_destroy_bridge_desc: "Местные силы сопротивления обнаружили мост, который формирует линию вражеских усилий по снабжению в регионе."
 targeted_sabotage_collapse_tunnel: "Свернуть туннель"
 targeted_sabotage_collapse_tunnel_desc: "Главная железнодорожная линия в штате проходит через узкий туннель, наши оперативники обнаружили структурные слабые точки в строительстве и будут использовать взрывчатые вещества, чтобы разрушить туннель."
 targeted_sabotage_remove_roadsigns: "Удалить дорожные знаки"
 targeted_sabotage_remove_roadsigns_desc: "Наши оперативники сломают дорожные знаки и поворачивают других, пытаясь затруднить плавание оккупационных войск."
 targeted_sabotage_immobilize_rolling_stock: "Иммобилизуйте подвижной состав"
 targeted_sabotage_immobilize_rolling_stock_desc: "Горстка песка в смазочных точках железнодорожного вагона в конечном счете заставит его остановиться, заблокировав тем самым железнодорожную линию до тех пор, пока ее не удастся отремонтировать."
 targeted_sabotage_burn_storage: "Хранение сжёг"
 targeted_sabotage_burn_storage_desc: "Местное сопротивление выявило хранилище, содержащее легковоспламеняющиеся соединения, под покровом ночи наши оперативники подожгут хранилище, а затем отойдут в последующей путанице."
 targeted_sabotage_destroy_mining_equipment: "Уничтожение горного оборудования"
 targeted_sabotage_destroy_mining_equipment_desc: "Местные группы сопротивления указали на то, что значительная часть тяжелого оборудования, используемого при добыче полезных ископаемых, крайне уязвима."
 operation_targeted_sabotage_industry: "Саботажная промышленность"
 operation_targeted_sabotage_industry_desc: "§Listance на территории противника потребовала поддержки в выводе из строя местного промышленного предприятия.§!"
 operation_targeted_sabotage_infrastructure: "Саботажная инфраструктура"
 operation_targeted_sabotage_infrastructure_desc: "§Listance на территории противника предпринимает неприкрытые усилия против вражеской инфраструктуры, но до сих пор не хватает ресурсов для того, чтобы оказать серьезное воздействие.§!"
 operation_targeted_sabotage_resources: "Саботажные ресурсы"
 operation_targeted_sabotage_resources_desc: "Сопротивление на вражеской территории дало нам информацию о вражеских усилиях по извлечению ресурсов в штате."
 operation_rescue_operative: "Захвачена спасательная операция"
 operation_rescue_operative_desc: "Один из наших агентов был снят с доски врагом."
 free_operative_free_in_transit: "Свободные в транзите"
 free_operative_free_in_transit_desc: "Наш оперативник перемещается на машине между тюрьмой, в которой их держат, и местом, где их допрашивают, мы знаем маршрут и отправим маленький отряд, чтобы устроить засаду, убить охранников и освободить нашего оперативника."
 free_operative_liberate_camp: "Освобожденный лагерь"
 free_operative_liberate_camp_desc: "Во время допроса наш оперативник содержится в лагере вместе с другими важными заключенными, мы нападем на лагерь с небольшим подразделением, одолеем всех присутствующих охранников и освободим нашего агента."
 free_operative_smuggle_in_escape_gear: "Смех в аварийно-спасательных средствах"
 free_operative_smuggle_in_escape_gear_desc: "Наши учёные разработали набор спасательных средств. У нас есть местный контакт, который согласился забрать пакет. Наш оперативник будет использовать предоставленные инструменты и пройдёт их путь к рандезу-воузу для эксфильтрации."
 operation_outcome_consumes_token_tt: "Эта операция может сжечь §Infilted Asset§!"
 operation_outcome_sabotage_industry_tt: "Нацеливает местное сопротивление на борьбу с промышленными предприятиями и повышает вероятность успешных нападений."
 operation_outcome_sabotage_infrastructure_tt: "Сосредотачивает местное сопротивление на целенаправленных объектах инфраструктуры и повышает вероятность успешных нападений."
 operation_outcome_sabotage_resources_tt: "Сосредотачивает местное сопротивление на целенаправленной добыче ресурсов и повышает вероятность успешных нападений."
 operation_coup_government: "Кубок оркестра"
 operation_coup_government_desc: "Несколько хороших, надежных людей - при надлежащей поддержке - могли бы свергнуть структуру корня, поднявшую правительство."
 collaboration_government_set_up_planning_committees: "Создание комитетов по планированию"
 collaboration_government_set_up_planning_committees_desc: "Наша команда встретится с некоторыми сочувствующими политиками, чтобы обсудить возможность формирования нового правительства для управления [от GetNameDef] после того, как мы его займем, и сформировать небольшие рабочие группы, которые разработают детали."
 collaboration_government_train_paramilitary_forces: "Поездки Военизированные силы"
 collaboration_government_train_paramilitary_forces_desc: "Наша команда организует и обучает некоторые подразделения для оказания помощи новому правительству в поддержании правопорядка."
 collaboration_government_contact_military_officers: "Контактные офицеры"
 collaboration_government_contact_military_officers_desc: "Наша команда последует за некоторыми зацепками, которые указывают на то, что некоторые отставные офицеры глубоко недовольны нынешним правительством и готовы помочь нам создать новое правительство после нашей оккупации."
 operation_collaboration_government: "Подготовка правительства по вопросам сотрудничества"
 operation_collaboration_government_desc: "Дружелюбное правительство, отвечающее за [отправление Наме Дефа], позволило бы нам сосредоточиться на наших других врагах и освободить войска для достижения других целей.§!"
 fake_intel_decoy_tanks: "Цистерны-образцы"
 fake_intel_decoy_tanks_desc: "Мы изобрели дешёвые приманки, похожие на танки с расстояния. Мы поместим их в легко различимые места и убедимся, что у врага достаточно времени, чтобы заметить их."
 fake_intel_radio_deception: "Радиообман"
 fake_intel_radio_deception_desc: "Мы создадим небольшую группу специалистов по радио, притворяясь отрядом сигналов для гораздо более крупной группы, они также будут использовать более старую версию наших киферов, чтобы сделать врагу легче читать их сообщения."
 fake_intel_deliberate_leaks: "Умышленное утечку"
 fake_intel_deliberate_leaks_desc: "Некоторые наши агенты в зарубежных странах будут следить за тем, чтобы они были невнимательными к нужным людям, и таким образом будут следить за тем, чтобы враг получал желаемую информацию через «надежные» источники."
 fake_intel_press_releases: "Пресс-релизы"
 fake_intel_press_releases_desc: "Мы пригласим репортеров написать очень подробные истории о том, о чем мы хотели бы знать врагу."
 fake_intel_utilize_double_agents: "Двойные агенты"
 fake_intel_utilize_double_agents_desc: "Мы обратились к нескольким младшим информаторам из неприятельской разведывательной службы, и им будет предложено предоставить другой стороне правильную информацию."
 fake_intel_plant_evidence: "Доказательства, касающиеся растений"
 fake_intel_plant_evidence_desc: "Мы направим маленькую операцию в место, где вражеский контроль, но которого мы сейчас не интересуемся, и убедимся, что мы оставим много улик."
 fake_intel_release_pow: "Выпустить Pow"
 fake_intel_release_pow_desc: "Вражеский офицер, захваченный в плен, должен быть репатриирован по гуманитарным соображениям, прежде чем он уйдет, мы проследим, чтобы он случайно увидел кое-что."
 operation_fake_intel: "Ложный интеллект"
 operation_fake_intel_desc: "Мы знаем, что разведка активна в нашей стране, иногда лучше дать кому-то, кто ищет информацию именно то, что он хочет услышать."
 infiltration_paradrop_outcome: "Несмотря на некоторые трудности с поиском зоны падения в темноте, команда приземлилась безопасно."
 infiltration_submarine_outcome: "С первой попыткой, сорванной высокими волнами, вторая попытка приземления на следующий день была встречена успехом и благополучно доставила команду на берег."
 infiltration_border_outcome: "Под прикрытием очень неблагоприятных погодных условий наша команда нашла ранее разведавшийся след и прошла через границу без каких-либо дополнительных проблем."
 infiltration_diplomatic_outcome: "У команды не было проблем с въездом в страну, и она постепенно избегала контрразведки противника хвоста."
 exfiltration_air_pickup_outcome: "Маленький курьерский самолет сумел найти пункт пикапа с небольшими проблемами и благополучно доставил команду на наши линии."
 exfiltration_submarine_pickup_outcome: "После нескольких напряженных дней игры в прятки и поиска с местным вражеским патрулем, нашей команде удалось организовать пикап и покинуть район незамеченным."
 exfiltration_border_outcome: "Группа сбежала, пересекая границу под покровом ночи, используя местного гида, чтобы помочь им пробраться через границу."
 exfiltration_go_to_ground_outcome: "Наша команда объединилась с местными гражданскими лицами и в настоящее время планирует либо вернуться к нашим линиям, либо остаться в этом районе для дальнейших заданий."
 fake_intel_decoy_tanks_outcome: "В то время как враг совершил несколько разведывательных самолето-пролетов в этом районе, мы не можем быть уверены, что они заметили приманки и убедили их."
 fake_intel_radio_deception_outcome: "Наши радиооператоры произвели много пробок. Трудно сказать, действительно ли враг следил за этим."
 fake_intel_deliberate_leaks_outcome: "Мы позаботились о том, чтобы вражеские агенты получили несколько небольших утечек, которые рисуют совершенно другую картину реальности."
 fake_intel_press_releases_outcome: "Наш Департамент общественной информации обеспечил, чтобы освещение в прессе в дружественных и нейтральных газетах примерно так, как мы хотим."
 fake_intel_utilize_double_agents_outcome: "Наши двойные агенты предоставили другой стороне щедрую помощь в предоставлении информации - некоторые из них даже верны, чтобы обеспечить, чтобы враг продолжал доверять им."
 fake_intel_plant_evidence_outcome: "Ранние сообщения свидетельствуют о том, что в ответ на эту операцию уже произошел ряд перебросок войск."
 fake_intel_release_pow_outcome: "Офицер был подогнан рядом с несколькими военными лагерями, и ему было позволено заметить целый ряд заграждений для дивизий, которых на самом деле не существует."
 targeted_sabotage_plant_explosives_outcome: "Группа успешно установила взрывчатку и снесла здание, повреждения машинного оборудования, как сообщается, легки, но для восстановления потребуется еще много времени."
 targeted_sabotage_organize_more_meetings_outcome: "Наш агент успешно проник в систему среднего управления целевой компанией и активно реорганизовал процессы, с тем чтобы добиться большего синергизма за счет налаживания взаимодействия с основными заинтересованными сторонами."
 targeted_sabotage_destroy_bridge_outcome: "Группа установила взрывчатку и установила взрыватель, совпадавший с проходящим поездом."
 targeted_sabotage_collapse_tunnel_outcome: "После выявления структурных слабых мест группа установила взрывчатку и отошла, и, хотя повреждение туннеля можно исправить, потребуется некоторое время, пока туннель вновь не станет полностью пригодным для использования."
 targeted_sabotage_remove_roadsigns_outcome: "Группа успешно сняла дорожные знаки на ряде важных перекрестков и заменила знаки на других местах, что вызвало большую путаницу среди водителей, не знакомых с этим районом."
 targeted_sabotage_immobilize_rolling_stock_outcome: "Группа проникла в железнодорожный склад и успешно саботировала несколько транспортных средств."
 targeted_sabotage_burn_storage_outcome: "Группа успешно подожгла местные складские помещения, уничтожив сотни тонн хранящихся ресурсов и серьезно повредив возможности для хранения запасов."
 targeted_sabotage_destroy_mining_equipment_outcome: "Группе удалось саботировать большую часть тяжелого горного оборудования, хотя некоторые повреждения могут быть поверхностными, это все же создаст некоторые серьезные узкие места в производственном потоке."
 steal_blueprints_bribe_outcome: "Мы связались с инженером в финансовых трудностях и убедили его расстаться с секретными бумагами в обмен на какую-то конвертируемую валюту."
 steal_blueprints_seduction_outcome: "Наш агент нашел инженера, нуждающегося в личной компании, который был очень открыт для своей работы."
 steal_blueprints_infiltrate_naval_design_office_outcome: "Наш агент успешно проник в военно-морского поставщика оборудования и сделал копии ряда ключевых составных чертежей."
 steal_blueprints_steal_prototype_outcome: "Прототип был успешно найден и отправлен на дружелюбный аэродром."
 steal_blueprints_middle_manager_outcome: "Время, потраченное нашим агентом на управление небольшой компанией, значительно расширило наше понимание вражеской экономики."
 capture_cyphers_bribe_outcome: "Наш агент получил полную копию кода от неизвестного источника в обмен на некоторые ценные вещи."
 capture_cyphers_raid_outcome: "Небольшое подразделение Коммандос успешно совершило налет на радиостанцию и получило копии нынешнего шифра, прежде чем его можно было уничтожить."
 capture_cyphers_seduction_outcome: "Наш агент смог убедить человека, у которого были кифры, расстаться с ними."
 capture_cyphers_smuggle_outcome: "Нашему агенту удалось убедить их контакт в [от GetNameDef] послать им полную копию сиферов, которые общались с ними."
 capture_cyphers_reverse_engineer_outcome: "Наш агент успешно получил пример шифровальной машины противника, хотя он и менее способен, чем военные модели, он все же позволит нам многое понять об их операциях."
 collaboration_government_set_up_planning_committees_outcome: "Группа создала ряд групп планирования для организации нового правительства и обеспечения плавной передачи власти после завершения боевых операций."
 collaboration_government_train_paramilitary_forces_outcome: "Группа организовала ряд надежных людей, некоторые из которых имеют военный опыт, в небольшие полувоенные подразделения, которые будут помогать охранять заднюю часть нашей передовой армии."
 collaboration_government_contact_military_officers_outcome: "Наша команда установила несколько контактов с отставными офицерами, которые могут быть убеждены в том, что помогут в организации нового правительства, если они будут играть в нем свою роль."
 free_operative_free_in_transit_outcome: "При поддержке маленького отряда коммандос наша команда смогла совершить засаду и вернуть нашего агента, пока их перевели в новое место."
 free_operative_liberate_camp_outcome: "Лишь за несколько часов до того, как заключенных должны были переместить, маленькому командному отряду удалось освободить тюрьму, где содержался наш агент."
 free_operative_smuggle_in_escape_gear_outcome: "Наш агент получил инструменты для побега и успешно сбежал из тюрьмы под покровом ночи, избегая поисковых групп и патрулей в течение нескольких дней, прежде чем вступить в контакт."
 infiltrate_military_bribe_outcome: "Наш агент успешно убедил солдата, находящегося на действительной службе, работать на нас в обмен на значительную сумму денег."
 infiltrate_military_seduction_outcome: "Наш агент начал отношения с активным солдатом, который стал довольно надежным источником информации."
 infiltrate_military_turned_pow_outcome: "Наш Департамент психологических операций успешно убедил военнопленного в справедливости нашего дела и отправил его обратно на другую сторону."
 infiltrate_military_ideological_supporter_outcome: "Наш агент вступил в контакт с рядом офицеров, которые больше не поддерживают нынешний режим [от "Возвращение"]."
 resistance_contacts_radio_circuits_outcome: "Группа установила контакт с несколькими подразделениями сопротивления и проинструктировала их по радиотехнике, оставив радиооператора с каждым из них."
 resistance_support_pidgeons_outcome: "Несколько голубей были брошены за линию врага с инструкциями о том, как их кормить и заботиться о них."
 resistance_contacts_briefings_outcome: "Группа проинструктировала членов сопротивления в ходе запланированных операций в их секторе, установила приоритеты в отношении сбора разведывательных данных и организовала поставки."
 resistance_support_arms_depots_outcome: "Группа установила несколько складов оружия и боеприпасов в скрытых местах для повышения ударной силы сопротивления."
 resistance_support_distribute_weapons_outcome: "Группа распространила оружие в ряде ячеек сопротивления и поручила их использовать."
 resistance_support_organize_training_outcome: "Группа провела курсы по базовым полевым аппаратам, техническому обслуживанию и сносу стрелкового оружия."
 resistance_support_coordinate_groups_outcome: "Группа собрала представителей крупнейших групп сопротивления для надлежащей координации операций в более широких масштабах и обеспечения того, чтобы поставки направлялись туда, где они наиболее необходимы."
 coordinated_strike_scout_target: "Цели скаутов"
 coordinated_strike_scout_target_desc: "Группа будет проводить разведку целей, фотографировать и представлять самую последнюю информацию о местоположении дорогостоящих целей."
 coordinated_strike_scout_target_outcome: "Группа представила точную информацию о местоположении штаба противника и других важных объектов лишь за несколько часов до начала нападения."
 coordinate_strike_mark_targets: "Отметить цели"
 coordinate_strike_mark_targets_desc: "Команда будет использовать заранее спланированные сигналы и маркеры, чтобы наши силы могли легче обнаруживать дорогостоящие цели."
 coordinate_strike_mark_targets_outcome: "Несмотря на необходимость сделать это в сжатые сроки и в темноте, маркировка была очень успешной в направлении наших сил к наиболее важным целям."
 coordinated_strike_sabotage_communications: "Саботажная связь"
 coordinated_strike_sabotage_communications_desc: "Наша команда перекроет телефонные линии и засадит в засаду мессировщиков, чтобы взломать вражескую связь в первые несколько часов."
 coordinated_strike_sabotage_communications_outcome: "Наша команда успешно сорвала вражескую связь, что привело к медленному реагированию на наше нападение."
 coordinated_strike_direct_units: "Непосредственные подразделения"
 coordinated_strike_direct_units_desc: "Когда начнется атака, наша команда направит наши подразделения на самые ценные цели по радио."
 coordinated_strike_direct_units_outcome: "Наша команда добилась больших успехов в руководстве нашими подразделениями, увеличивая ущерб, причиненный врагу."
 coordinated_strike_occupy_bridges: "Оккупационные мосты"
 coordinated_strike_occupy_bridges_desc: "Наша команда захватит мосты в этом районе, предотвратив их разрушение и заблокировав ответные нападения противника."
 coordinated_strike_occupy_bridges_outcome: "Группа успешно перебила охрану на ключевом мосту и перерезала провода для обвинения в сносе, что позволило нашим силам беспрепятственно действовать."
 operation_coordinated_strike: "Скоординированный удар"
 operation_coordinated_strike_desc: "Для того чтобы одержать победу над [от GetNameDef], мы должны нанести сокрушительный неожиданный удар. §!! n noPrepare §YPort Strike§!! и §YStrategic Bombing§! Воздушные миссии в районе цели, и они нанесут удар по завершении операции и начнут войну между нами."
 coordinated_strike_tt: "Мы объявим войну § §.getNameDef! в результате внезапного нападения."
 exfiltration_air_pickup_outcome_fail: "Пилот §Rour обнаружил, что место приземления ярко зажигается с фонарями нескольких вражеских антивоздушных подразделений, и решил, что операция была скомпрометирована.§!"
 exfiltration_submarine_pickup_outcome_fail: "Подводная лодка несколько часов ждала в согласованном пункте эвакуации, но с берега не было получено никаких сообщений, указывающих на то, что наша команда готова к извлечению."
 exfiltration_border_outcome_fail: "Гид с другой стороны границы тщетно ждал, пока не появится наша команда, пока ему не придется покинуть свой пост из-за приближающегося вражеского патруля."
 exfiltration_go_to_ground_outcome_fail: "Группа до сих пор не вступила в контакт во время предварительного распорядка."
