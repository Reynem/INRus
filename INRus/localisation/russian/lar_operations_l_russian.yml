 enemy_has_equal_or_better_radar_tech_trigger_tt: "Враг имеет такую же или лучшую радиолокационную технологию."
 OPERATION_BONUS_REWARD: "Операция увенчалась огромным успехом, и она принесла §Gbonus награды!!"
 intelligency_agency_resistance_boost_tt: "Разведывательная деятельность: $VALUE =-0 долл. США"
 targeted_sabotage_resources_2_tt: "Местное сопротивление в [от. Гетнама] будет уделять больше внимания саботажу добычи местных ресурсов."
 targeted_sabotage_resources_3_tt: "Местное сопротивление в [от.Гетнаме] приложит большие усилия, чтобы саботировать добычу местных ресурсов."
 targeted_sabotage_industry_2_tt: "Местное сопротивление в [от.Гетнаме] будет уделять больше внимания саботажу местных предприятий."
 targeted_sabotage_industry_3_tt: "Местное сопротивление в [от.Гетнаме] сделает большие усилия для саботажа местных заводов."
 targeted_sabotage_infrastructure_2_tt: "Местное сопротивление в [от.Гетнама] будет уделять больше внимания саботажу местной инфраструктуры."
 targeted_sabotage_infrastructure_3_tt: "Местное сопротивление в [от.Гетнаме] приложит значительные усилия для саботажа местной инфраструктуры"
 organise_cells_outcome: "Было организовано несколько революционных ячеек, которые начали функционировать в задней части противника."
 infiltrate_civil_service_outcome: "Мы поместили ряд надежных людей на позиции власти, что позволило им быстро захватить управляющие освободившимися территориями."
 workers_militia_outcome: "Несколько батальонов рабочей милиции готовы охранять критически важные объекты."
 organise_strikes_outcome: "Наш агент успешно убедил профсоюзных активистов и рабочих начать крупную забастовку."
 preposition_units_outcome: "Наши активы в стране были созданы для того, чтобы захватить важнейшую инфраструктуру, когда начнется восстание."
 launch_coup_exfiltration_outcome: "По получении сигнала старта наш агент вел несколько подразделений по захвату поставленных перед ними целей. Повстанцы успешно взяли под свой контроль кусок территории."
 launch_coup_exfiltration_outcome_fail: "В неразберихе восстания мы потеряли связь с нашим оперативником, и, возможно, мы никогда не узнаем, что произошло."
 free_agency_upgrade_tt: "Получите один случайный §Y Adgency Advanced§!"
 nuclear_espionage: "Неразборчивая атомная программа"
 nuclear_espionage_desc: "Наша программа создания ядерного оружия стоит позади других стран, и мы должны спланировать операцию по проникновению в иностранные программы создания ядерного оружия и получению жизненно важных планов и данных."
 nuclear_espionage_outcome_tt: "Мы поместим агента в программу ядерных исследований [FROM.GetAditive], который попытается передать техническую документацию, которая может быть использована в нашем собственном атомном проекте."
