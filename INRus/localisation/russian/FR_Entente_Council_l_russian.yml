 ##### Events #####
 FRA.council.1.t: "Франция приглашает нас присоединиться к военному альянсу Согласие"
 FRA.council.1.d: "Париж считает, что наше участие в этом союзе является ключом к успеху, но в то время как гарантия защиты является теплым приветствием, ответственность, лежащая в его основе, не столь популярна, но угроза Германии и Советов может заставить нас решительно рассмотреть приглашение Франции."
 FRA.council.1.a: "Присоединяйтесь."
 FRA.council.1.b: "Не нужна помощь [Фром. Найти]"
 FRA.council.2.t: "Распускание Совета полного состава"
 FRA.council.2.d: "Неоднократные провалы Совета Энтези в обеспечении стабильности в Европе погубили репутацию организации, и ее члены больше не платят свои взносы и не верят в способность Франции защитить их. Без каких-либо существенных изменений будущее Европы начинает выглядеть мрачным."
 FRA.council.2.a: "Мон Дье..."
 FRA.council.3.t: "Распускание Совета полного состава"
 FRA.council.3.d: "Неоднократные неудачи Совета Энтези по поддержанию стабильности в Европе разрушили репутацию организации, и у нас нет причин продолжать общаться с французами, и мы должны заботиться о себе. Без каких-либо существенных изменений будущее Европы начинает выглядеть мрачным."
 FRA.council.3.a: "Боже мой..."
 FRA.council.4.t: "Франция и Совет содействия объявляют войну [Root.GetName]"
 FRA.council.4.d: "Трусы в Париже распространили пропаганду среди стран Европы, убеждая их, что мы являемся угрозой европейской безопасности, юмористическим обвинением, исходящим от французов всех людей. В любом случае, мы сами находим себя в первой крупной европейской войне после Великой войны почти 20 лет назад. То, что мы будем делать дальше, будет определять мир на десятилетия вперед. Мы, несмотря ни на что, победим французов и заработаем себе место в качестве единственной сверхдержавы или Европы."
 FRA.council.4.a: "За полную победу!"
 FRA.council.5.t: "[From.GetName] запрашивает материальную поддержку"
 FRA.council.5.d: "В соответствии с политикой Совета запросили военные материалы для оказания помощи в защите своей нации в ходе нынешнего конфликта, хотя мы обязаны оказывать поддержку нуждающимся странам в результате недавнего глобального экономического спада, который уже ограничил нашу способность поддерживать себя, не говоря уже о другой нации."
 FRA.council.5.a: "и будет оказывать поддержку [наследию],"
 FRA.council.5.b: "Франция не в состоянии помочь"
 FRA.council.6.t: "Франция направляет материальную поддержку"
 FRA.council.6.d: "Франция прислушивается к нашим призывам и сейчас направляет необходимую поддержку нашему делу."
 FRA.council.6.a: "[Звонок. Найти] Тост за нашего французского союзника"
 FRA.council.8.t: "Франция отказывается направлять материальную поддержку"
 FRA.council.8.d: "Франция проигнорировала наши призывы и отказывается оказывать необходимую поддержку нашему делу."
 FRA.council.8.a: "Французы - задницы."
 FRA.council.9.t: "Германия проводит агрессивную внешнюю политику"
 FRA.council.9.d: "Берлин объявил сегодня о своем намерении вернуть «потерянные немецкие земли, украденные Францией и договором Версаля». Несмотря на все наши усилия сдержать германский экспансионизм, наши угрозы Германии являются пустыми. Это лишь вопрос времени, пока Германия не втянут Европу в новый большой конфликт."
 FRA.council.9.a: "Мы должны подготовить §R (сокращение доверия члена на 10%)§!"
 FRA.council.10.t: "Германия публикует пропаганду против «Согласия»"
 FRA.council.10.d: "В попытке подорвать нас и Совет Энтента Германия опубликовала брошюру, в которой утверждается о массовых злоупотреблениях властью в наших колониях и на Рейне. Дети, разлученные их матерями под дулом оружия, и французские войска, сжигающие целые деревни дотла , являются одними из наименее оскорбительных заявлений немцев. Эти обвинения крайне преувеличены , но некоторые страны, несмотря на это, весьма убеждены."
 FRA.council.10.a: "Это действительно неловко. §R (Доверие члена падает на 10%)§!"
 FRA.council.11.t: "[From.GetName] просит о финансировании укреплений"
 FRA.council.11.d: "Агрессивная внешняя политика Германии заставляет правительство [From.GetName] беспокоиться о будущем своего суверенитета."
 FRA.council.11.a: "Мы поддержим §R (Повышение доверия члена на 5%)§!"
 FRA.council.11.b: "Мы не можем ничего пощадить §R (Доверие члена падает на 10%)§!"
 FRA.council.12.t: "[From.GetName] предлагает нам сотрудничать в области исследований и разработок"
 FRA.council.12.d: "В то время как помощь поможет нам, некоторые члены нашего правительства беспокоятся о том, что отказ от наших технологических достижений сделает нас уязвимыми для наших соседей."
 FRA.council.12.a: "Мы будем участвовать"
 FRA.council.12.b: "Мы лучше сами по себе."
 FRA.council.13.t: "Пригласить нас на военные учения Согласие"
 FRA.council.13.d: "Защита Европы требует от всех членов Совета согласия сохранить хорошо обученную и современную армию. Франция пригласила нас на общеевропейские военные учения в поддержку наших вооруженных сил в достижении этой цели. Большинство поддерживают предложение Франции, но некоторые министры беспокоятся о том, чтобы стать слишком зависимыми от Франции."
 FRA.council.13.a: "Мы будем участвовать"
 FRA.council.13.b: "Мы лучше сами по себе."
 FRA.council.15.t: "[From.GetName] предложения построить анти-немецкую оборону"
 FRA.council.15.d: "По мере того, как Германия продолжает расширять свою военную деятельность, ясно, что их экспансионистские амбиции начинают к нам обращены."
 FRA.council.15.a: "Мы должны согласиться"
 FRA.council.15.b: "Совет для нас ничего не значит."
 FRA.council.16.t: "Приняла наше предложение."
 FRA.council.16.d: "Осознавая растущую угрозу Германии, мы приняли наше предложение построить оборону в их стране."
 FRA.council.16.a: "Мы должны быть готовы к немецкому вмешательству"
 FRA.council.17.t: "[From.GetName] отказал в нашем предложении"
 FRA.council.17.d: "Несмотря на растущую угрозу Германии [From.GetName], мы отказались от нашего предложения построить оборону в их стране."
 FRA.council.17.a: "Недоверие к Совету Согласия вызывает сожаление."
 FRA.council.18.t: "[From.GetName] предложения построить анти-немецкую оборону"
 FRA.council.18.d: "По мере того, как Германия продолжает расширять свою военную деятельность, ясно, что их экспансионистские амбиции начинают к нам обращены."
 FRA.council.18.a: "Мы должны согласиться"
 FRA.council.18.b: "Совет для нас ничего не значит."
 FRA.council.19.t: "[From.GetName] предложения построить анти-немецкую оборону"
 FRA.council.19.d: "По мере того, как Германия продолжает расширять свою военную деятельность, ясно, что их экспансионистские амбиции начинают к нам обращены."
 FRA.council.19.a: "Мы должны согласиться"
 FRA.council.19.b: "Совет для нас ничего не значит."
 FRA.council.20.t: "[From.GetName] предложения построить анти-немецкую оборону"
 FRA.council.20.d: "По мере того, как Германия продолжает расширять свою военную деятельность, ясно, что их экспансионистские амбиции начинают к нам обращены."
 FRA.council.20.a: "Мы должны согласиться"
 FRA.council.20.b: "Совет для нас ничего не значит."
 FRA.council.21.t: "Вмешательство в Конго"
 FRA.council.21.d: "В связи с крайне левым восстанием в Бельгии мы вынуждены принять односторонние меры для обеспечения безопасности наших колоний в Африке. Бельгийское Конго в своем нынешнем виде сталкивается с опасностью попасть в руки социалистов или объявить о своей независимости. Ни один из этих вариантов не является жизнеспособным. Многие из них в рамках нашего правительства и в Совете по вопросам согласия подталкивают нас к оккупации Конго, хотя это, безусловно, расстроит британцев, колонии которых также находятся в непосредственной близости от данной земли. Некоторые призывают нас разработать совместную стратегию с Имперским альянсом защиты и разделить территорию до тех пор, пока ситуация в Бельгии не будет урегулирована, хотя другие по-прежнему призывают нас принять односторонние меры. Независимо от того, какой вариант мы выберем, время имеет существенное значение, если мы хотим сдержать распространение социалистических идей в наших колониях в Африке."
 FRA.council.21.a: "Давайте договоримся с англичанами о мирной совместной оккупации колонии."
 FRA.council.21.b: "Нам не нужны британцы в этом деле."

