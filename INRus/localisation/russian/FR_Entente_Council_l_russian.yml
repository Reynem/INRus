 GEN_entente_member: "Член Совета"
 GEN_entente_member_desc: "Членство в Совете Согласия дает нашей стране гарантию коллективной безопасности, но за счет членских взносов и надежности Франции."
 GEN_entente_leader: "Подготовить руководителя Совета"
 GEN_entente_leader_desc: "Будучи одним из ведущих членов Совета Энтенте , мы придаем нам большой престиж на европейском сцене, но мы не должны забывать о нашей ответственности за поддержание мира и стабильности на континенте."

