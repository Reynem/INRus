 sp_air_bouncing_bomb: "Бомба с прыжком"
 sp_air_bouncing_bomb_desc: "Бомба, которая может пропустить и перепрыгнуть через водные поверхности, может быть идеальным инструментом для нарушения защиты плотин и может оказаться полезной и в других ситуациях."
 sp_air_bouncing_bomb_completion_tt: "Разблокируйте §Y$raid_type_dam_bobing_read$§! и §Y$raid_type_lock_bocking_read$§!"

 sp_air_bouncing_bomb_no_bba: "$sp_air_bouncing_bomb$"
 sp_air_bouncing_bomb_no_bba_desc: "$sp_air_bouncing_bomb_desc$"

 sp_air_earthshaker_bomb: "Земная бомба"
 sp_air_earthshaker_bomb_desc: "Тяжелая бомба, построенная таким образом, что она проникает в землю до того, как она взорвется, причиняя массированный структурный ущерб цели."
 sp_air_earthshaker_bomb_completion_tt: "Разблокируйте §Y$raid_тип_mega_gun_emplacement_ack$§!"
