 sp_rockets_generic_avionics_advancements_reward_desc: "В ходе нашей работы мы сделали много выводов в общем поле Авионики и аэродинамики, которые могут принести пользу нашему авиационному производству."
 #sp_rockets_generic_avionics_advancements_reward_option: "Это, безусловно, окажется полезным."

 sp_rockets_experimental_rockets_improved_accuracy_reward: "Повышение точности"
 sp_rockets_experimental_rockets_stability_improvements_reward: "Повышение устойчивости ракетных полетов"

 # Flying Bomb
 sp_rocket_design_choice_reward: "Расстояние против загрузки?"
 sp_rocket_design_choice_reward_desc: "При проектировании нашей летающей бомбы наши инженеры утверждают, что важно решить, какова главная цель конструкции бомбы."
 sp_rocket_design_choice_reward_balanced: "Сбалансировано"
 sp_rocket_design_choice_reward_range: "Диапазон"
 sp_rocket_design_choice_reward_payload: "Рабочая нагрузка"

 sp_rockets_flying_bomb_technical_breakthrough_in_pulsejet_design_reward: "Технический прорыв в разработке пульса"
 sp_rockets_flying_bomb_technical_breakthrough_in_pulsejet_design_reward_desc: "Наши инженеры преодолели значительные препятствия при проектировании импульсного двигателя ракеты, что имеет решающее значение для ее дальности и скорости."
 #sp_rockets_flying_bomb_technical_breakthrough_in_pulsejet_design_reward_option: "Вверх и вперёд!"

 sp_rockets_flying_bomb_launch_ramp_innovations_reward: "Запуск новаторства"
 sp_rockets_flying_bomb_launch_ramp_innovations_reward_desc: "Наши инженеры добились значительных улучшений в специализированных пусковых пандусах, необходимых для развертывания ракет."
 sp_rockets_flying_bomb_launch_ramp_innovations_reward_option: "Хорошие новости"

 sp_rockets_flying_bomb_mass_production_scaling_reward: "Масштабирование производства"
 sp_rockets_flying_bomb_mass_production_scaling_reward_desc: "Нам удалось добиться усовершенствования производства, что позволит нам увеличить массовое производство гораздо быстрее."
 #sp_rockets_flying_bomb_mass_production_scaling_reward_option: "Наиболее выгодные"

 sp_rockets_flying_bomb_engine_optimization_breakthrough_reward: "Оптимизация работы двигателя"
 sp_rockets_flying_bomb_engine_optimization_breakthrough_reward_desc: "Нашим инженерам удалось значительно повысить дальность и надежность пульса, улучшив оперативные возможности ракеты."
 #sp_rockets_flying_bomb_engine_optimization_breakthrough_reward_option: "Некоторые называют это удачей."

 sp_rockets_flying_bomb_technological_innovation_in_guidance_systems_reward: "Технологические инновации в системах наведения"
 sp_rockets_flying_bomb_technological_innovation_in_guidance_systems_reward_desc: "В ходе последнего раунда прототипов были достигнуты значительные улучшения в точности системы наведения и сопротивлении джему, что способствовало продвижению наших технологических преимуществ."
 #sp_rockets_flying_bomb_technological_innovation_in_guidance_systems_reward_option: "Мы приближаемся к достижению нашей цели"

 sp_rockets_flying_bomb_test_flight_failures_reward: "Неисправность в ходе испытания"
 sp_rockets_flying_bomb_test_flight_failures_reward_desc: "Ранние испытательные полеты привели к сбоям из-за сбоев системы наведения и структурных недостатков. Наши ученые многому научились из этого, но нам нужно сделать шаг назад и переосмыслить."
 #sp_rockets_flying_bomb_test_flight_failures_reward_option: "Говорят, ты больше всего учишься на своих ошибках."

 # Ground to Air
 sp_rockets_ground_control_improvements_reward: "Совершенствование наземного контроля"
 sp_rockets_ground_control_improvements_reward_desc: "[Character.GetName] удалось решить ряд нерешенных вопросов, с тем чтобы отследить ракету и контролировать ее с земли."

 sp_rockets_vertical_launch_reward: "Вертикальная система запуска"
 sp_rockets_vertical_launch_reward_desc: "После нескольких неудачных попыток [Character.GetName] наконец удалось решить проблемы, связанные с вертикальным запуском этих ракет. Новая система должна позволить запускать ракеты без проблем и без промедления достичь больших высот."

 sp_rockets_high_speed_flight_control_reward: "Высокоскоростное управление полетами"
 sp_rockets_high_speed_flight_control_reward_desc: "Наконец, нам удалось получить рабочую систему контроля, которая может функционировать на высоких скоростях и реагировать на меняющуюся динамику полета."
 sp_rockets_high_speed_flight_control_bonus: "Управление высокоскоростными полетами"

 sp_rockets_warhead_detonation_mechanisms_reward: "Механизмы детонации боеголовок"
 sp_rockets_warhead_detonation_mechanisms_reward_desc: "Важная часть всего развития состоит в том, чтобы заставить оружие взорваться в нужном месте."
 sp_surface_air_missile_warhead_detonation_bonus: "Ракета &lt; &lt; Наземный воздух &gt; &gt; : усовершенствованная детонация боеголовки"
 #Ballistic missile

 sp_rocket_wind_tunnel_choice_reward: "Инженеры просят ветеровой туннель"
 sp_rocket_wind_tunnel_choice_reward_desc: "Инженеры проекта по баллистическим ракетам обратились с просьбой о строительстве сверхзвукового ветряного туннеля для испытания моделей их конструкции на более раннем этапе, что позволит быстро ускорить процесс их итерации и сэкономить ресурсы в долгосрочной перспективе."
 sp_rocket_wind_tunnel_choice_reward_reject: "Ресурсы необходимы в других местах."
 sp_rocket_wind_tunnel_choice_reward_agree: "Выделение ресурсов."

 sp_rocket_glass_wool_choice_reward: "Формирование льда при возвращении"
 sp_rocket_glass_wool_choice_reward_desc: "На этапе возвращения ракетного полета лед, похоже, формируется вокруг топливных баков и нарушает внутренние возможности ракеты, но наши инженеры предлагают добавить стеклянную шерсть вокруг танков, чтобы не допустить этого в будущем."
 sp_rocket_glass_wool_choice_reward_accept: "Неудачно, но необходимо."

 sp_rocket_guidance_system_choice_reward: "Система руководства"
 sp_rocket_guidance_system_choice_reward_desc: "Наши инженеры обсуждают систему наведения для ракеты, некоторые из них хотят придерживаться испытанного механического компьютера, в то время как другие хотят использовать новые радиотехнологии для контроля и наблюдения за запуском ракеты после запуска."
 sp_rocket_guidance_system_choice_reward_mechanical: "Механика надёжна."
 sp_rocket_guidance_system_choice_reward_radio: "Радио - это будущее!"

 sp_rocket_turbo_pump_froth_reward: "Сброс турбонагнетателя"
 sp_rocket_turbo_pump_froth_reward_desc: "В ходе испытаний на большой высоте вопрос, касающийся турбонагнетателя, был изолирован, и, как представляется, смазка внутри насосов начинает заморозиться в напряженных условиях, которые влияют на общую эффективность и надежность нынешней конструкции."
 sp_rocket_turbo_pump_froth_reward_accept: "Мы должны разобраться с этим!"

 sp_rocket_relay_failure_reward: "Неисправность возврата"
 sp_rocket_relay_failure_reward_desc: "В процессе подготовки к нашему тестовому запуску был обнаружен неисправный реле, используемый для систем внутреннего контроля ракеты."
 sp_rocket_relay_failure_reward_accept: "Почините реле."
 sp_rocket_relay_failure_reward_reject: "Мы больше не можем откладывать."

 sp_rocket_outercoating_reward: "Ракетная ржавчина"
 sp_rocket_outercoating_reward_desc: "Выражалась озабоченность по поводу внешней оболочки ракеты, которая в течение длительного периода времени остается на месте, а материалы часто ржавые и коррозии, что может привести к тому, что ракета окажется неработающей, если не будет найдено раствора."
 sp_rocket_outercoating_reward_accept: "Может быть, смазку можно применить?"

 sp_rocket_launch_site_choice_reward: "Вопросы, связанные с стартовой площадкой"
 sp_rocket_launch_site_choice_reward_desc: "В связи с этим руководители проекта просят выделить средства на строительство нового целевого объекта, который будет построен в другом месте."
 sp_rocket_launch_site_choice_reward_reject: "Найдите способ сделать текущий сайт работать."
 sp_rocket_launch_site_choice_reward_accept: "Мы вложим средства в новый объект."

 SP_ROCKET_AND_SUBMARINE_SITE_REMINDER_PROJECT: "Для того чтобы эффективно использовать $PROJECTY$, нам нужно построить ракетный объект или иметь подводные лодки с ракетным ударом."
 SP_ROCKET_SITE_REMINDER_PROJECT: "Для того чтобы эффективно использовать $PROJECTY$, нам нужно построить ракетный объект."

 ########################
  ## NAVAL PROJECTS ##
 ########################
 sp_naval_cruiser_submarine: "Подводные лодки"
 sp_naval_cruiser_submarine_desc: "Подводная лодка с более высокой дальностью, предназначенная для движения на большие расстояния без поддержки, была бы идеальной для нападения на вражеские суда."
 sp_naval_cruiser_submarine_free_design: "Подводные лодки"

 sp_naval_nuclear_submarine: "Ядерная подводная лодка"
 sp_naval_nuclear_submarine_desc: "Мы должны быть в состоянии сделать ядерные двигатели достаточно малыми, чтобы поместить их в специализированную подводную лодку, чтобы заставить судно молчать и предоставить ему экстремальную дальность."
 sp_naval_nuclear_submarine_free_design: "Ядерная подводная лодка"

 sp_naval_rocket_launching_submarine: "Ракетная подводная лодка"
 sp_naval_rocket_launching_submarine_desc: "Оснащая наши подводные лодки ракетами и ракетами-носителями, мы сможем поражать стратегические цели наших врагов где угодно, без предварительного предупреждения."

 sp_naval_torpedo_cruiser: "Торпедо Крузер"
 sp_naval_torpedo_cruiser_desc: "Мы можем нанести значительный ущерб самым важным и дорогим кораблям наших врагов, используя Torpedo Cruisers, согласно концепции прошлого века - Jeune Ecole."
 sp_naval_torpedo_cruiser_free_design: "Торпедо Крузер"

 sp_naval_fleet_submarine: "Подводная лодка флота"
 sp_naval_fleet_submarine_desc: "Подводная лодка дальнего действия, способная выполнять функции эскорта флота, но без недостатков, присущих конструкции предыдущих крейсерских подводных лодок."
 sp_naval_fleet_submarine_free_design: "Подводная лодка флота"

 sp_naval_super_heavy_battleship: "Ужасно"
 sp_naval_super_heavy_battleship_desc: "Ужасная раса может быть вещью прошлого на протяжении более десяти лет... но трудно отрицать само величие страшных, и ее потенциал в плане необычайной военно-морской огневой мощи."
 sp_naval_super_heavy_battleship_free_design: "$ship_hull_super_heavy_1$"

 sp_naval_nuclear_missile_submarine: "Подводные лодки с ядерными ракетами"
 sp_naval_nuclear_missile_submarine_desc: "Если мы сможем вскрыть подводную лодку, запустить ракету с ядерным зарядом, а затем снова погрузиться в воду, наш потенциал первого удара станет почти безграничным."

 sp_naval_modern_battleship: "Современный боевой корабль"
 sp_naval_modern_battleship_desc: "Другие могут поверить, что в будущем военно-морских боевых действий будут доминировать носители, и мы здесь, чтобы убедить их в том, что они ошибаются."
 sp_naval_modern_battleship_free_design: "Современный боевой корабль"

 sp_naval_midget_submarine: "Подводная лодка"
 sp_naval_midget_submarine_desc: "В наших военно-морских силах есть ниша для легкой, дешевой и разносторонней подводной лодки, которая может быть использована для чего угодно, от саботажа в гаванях до рейдов конвоев."
 sp_naval_midget_submarine_free_design: "Подводная лодка"

 sp_naval_nuclear_torpedo: "Ядерный торпед"
 sp_naval_nuclear_torpedo_desc: "С появлением тактических боезарядов низкой мощности торпеды большой дальности с этими боеголовками теоретически могут быть развернуты любой обычной подводной лодкой."

 sp_naval_modern_carrier: "Современный перевозчик"
 sp_naval_modern_carrier_desc: "С учетом последних достижений в области технологии судостроения мы могли бы построить новое поколение авианосцев, значительно улучшая их размеры и возможности."
 sp_naval_modern_carrier_free_design: "Современный перевозчик"

 sp_naval_anechoic_tiles: "Анехотические кишки"
 sp_naval_anechoic_tiles_desc: "Это специальное каучуковое покрытие для подводных лодок, которое содержит небольшие пустые пространства между ними; уменьшает угрозу обнаружения сонаров противника."
 sp_naval_anechoic_tiles_non_mtg_tt: "Включает повышение качества подводных уплотнений до 6 и 7"

 sp_naval_aip_engine: "Воздушно-независимое движение"
 sp_naval_aip_engine_desc: "Новая двигательная система, которая могла бы устранить слабость подводных лодок, нуждающихся в повторном вскрытии, с тем чтобы зарядить свои батареи и пополнить запасы кислорода."
 sp_naval_aip_engine_non_mtg_tt: "Повышенное значение подводного двигателя составляет 6 и 7"

 sp_naval_ice_carrier: "Ледяной транспортер"
 sp_naval_ice_carrier_desc: "Чтобы утвердить наше воздушное превосходство над обширными океанами, нам нужны перевозчики, которые могли бы хранить и запускать регулярные самолеты дальнего радиуса действия, а не только самолёты-носители."
 sp_naval_ice_carrier_free_design: "Ледяной транспортер"

 sp_naval_underway_replenishment: "Подземное пополнение"
 sp_naval_underway_replenishment_desc: "Поставки мореплавателей вдали от их родных баз всегда были сдерживающим фактором."

 sp_naval_proximity_fuze: "Близость"
 sp_naval_proximity_fuze_desc: "С помощью усовершенствованной и более надежной радиотехнологии мы можем разработать новый вид взрывателей, которые взорвутся, когда будут находиться в непосредственной близости от цели и повредят ее."

 sp_naval_support_ships: "Вспомогательные суда"
 sp_naval_support_ships_desc: "Поддержка судов поможет сохранить наше превосходство на море, сохраняя наш флот на плаву и эффективно даже во время длительных развертываний."

 sp_naval_escort_carrier: "Эскорт-перевозчик"
 sp_naval_escort_carrier_desc: "Чтобы защитить наши линии снабжения, мы хотим создать более мелкие, более экономичные перевозчики, обеспечивающие рентабельный воздушный покров и потенциал по борьбе с подводной лодкой по всему океану."
 sp_naval_escort_carrier_free_design: "Эскорт-перевозчик"

 sp_naval_submarine_carrier: "Подводный транспортер"
 sp_naval_submarine_carrier_desc: "Мы собираемся разработать новый вид подводной лодки, способной хранить и запускать несколько самолетов, для выполнения задач, выходящих за пределы воздушного восстановления."
 sp_naval_submarine_carrier_free_design: "Подводный транспортер"

 sp_naval_armoured_cruiser: "Бронированный крузер"
 sp_naval_armoured_cruiser_desc: "Бронированный круизер (Panzerschiff) — небольшой корабль, который заполняет разрыв между почитаемым катером и более недавними тяжёлыми крейсерами. Они должны быть дальними и способными к независимым действиям, особенно к налетам на поверхность. Они популярны, но ошибочно известны как «Покетные боевые корабли» из-за их тяжелого вооружения, несмотря на размер их корпуса."
 sp_naval_armoured_cruiser_free_design: "Бронированный крузер"

 #################################
  ## NAVAL PROTOTYPE REWARDS ###
 #################################
 sp_naval_cruiser_submarine_unique_reward_a: "Протокол рейдинга"
 sp_naval_cruiser_submarine_unique_reward_a_desc: "Хотя большие размеры наших новых подводных лодок дают возможность резко увеличить пропускную способность палуб, мы должны также рассмотреть вопрос об использовании пространства для увеличения тактической дальности."
 sp_naval_cruiser_submarine_preference_a: "Гибкие операции"
 sp_naval_cruiser_submarine_preference_b: "Оружие"

 sp_naval_fleet_submarine_unique_reward_a: "Принципы проектирования"
 sp_naval_fleet_submarine_unique_reward_a_desc: "Мы должны знать, что нам нужно сфокусировать наши усилия при проектировании нового типа подводных лодок дальнего действия, если наши подводные лодки будут тихими и смертоносными охотниками, или же мы хотим, чтобы они были более надежными и устойчивыми к опасностям."
 sp_naval_fleet_submarine_preference_a: "Способность к атаке"
 sp_naval_fleet_submarine_preference_b: "Строение покрепче"

 sp_naval_nuclear_submarine_unique_reward_a: "Вопросы, связанные с расходами"
 sp_naval_nuclear_submarine_unique_reward_a_desc: "Сейчас, когда мы работаем над совершенно новым типом подводной лодки, растет беспокойство по поводу того, что расходы на добычу судов в конечном счете будут слишком высокими."
 sp_naval_nuclear_submarine_preference_a: "Срезанные углы"
 sp_naval_nuclear_submarine_preference_b: "Текущие планы"
 sp_naval_nuclear_submarine_preference_c: "Самое высокое качество"

 sp_naval_rocket_launching_submarine_unique_reward_a: "Вопрос о выполнении погрузочно-разгрузочных работ"
 sp_naval_rocket_launching_submarine_unique_reward_a_desc: "Мы должны ответить на актуальный вопрос: как лучше всего обеспечить, чтобы наши ракеты, запущенные с подводных лодок, дошли до наших врагов?"
 sp_naval_rocket_launching_submarine_preference_a: "Диапазон"
 sp_naval_rocket_launching_submarine_preference_b: "Надежность"
 sp_naval_rocket_launching_submarine_preference_c: "Кража"

 sp_naval_nuclear_missile_submarine_unique_reward_a: "Сбежать от охоты"
 sp_naval_nuclear_missile_submarine_unique_reward_a_desc: "Если бы информация о планируемом ядерном ударе дошла до наших врагов, они бы начали массовый поиск наших атомных ракетных подводных лодок."
 sp_naval_nuclear_missile_submarine_preference_a: "Низкий"
 sp_naval_nuclear_missile_submarine_preference_b: "Сохраняйте спокойствие"
 sp_naval_nuclear_missile_submarine_preference_c: "Терпение шторма"

 sp_naval_nuclear_torpedo_unique_reward_a: "Новый курс по Торпедо"
 sp_naval_nuclear_torpedo_unique_reward_a_desc: "Поскольку ядерные торпеды близки к достижению конечной цели проекта, мы должны стремиться..."
 sp_naval_nuclear_torpedo_preference_a: "Мощные боеголовки"
 sp_naval_nuclear_torpedo_preference_b: "Безопасное хранение"

 sp_naval_midget_submarine_unique_reward_a: "Сжимаясь дальше"
 sp_naval_midget_submarine_unique_reward_a_desc: "Мы поняли, что потенциально мы можем специализировать части наших подводных лодок, хотя это будет иметь несколько компромиссов."
 sp_naval_midget_submarine_preference_a: "Немного похититель"
 sp_naval_midget_submarine_preference_b: "Немного меньше прон до взрыва"
 sp_naval_midget_submarine_preference_c: "Немного больше дальности"

 sp_naval_aip_engine_unique_reward_a: "Независимые усовершенствования"
 sp_naval_aip_engine_unique_reward_a_desc: "Наши ученые, работающие над этой технологией, поделились своими выводами со своими коллегами, работающими над усовершенствованием более обычных двигателей."
 sp_naval_aip_engine_preference_a: "Тихие двигатели"
 sp_naval_aip_engine_preference_b: "Быстрые двигатели"
 sp_naval_aip_engine_preference_c: "Минус топливные двигатели"

 sp_naval_anechoic_tiles_unique_reward_a: "Новые занятия - строительство подводной колодки"
 sp_naval_anechoic_tiles_unique_reward_a_desc: "Во время разработки анехотической плитки мы поняли, что мы можем адаптировать наши результаты к обычным подводных лодкам, чтобы повысить наши возможности для скрытности, или немного сэкономить на расходах, сохраняя при этом нынешние уровни видимости."
 sp_naval_anechoic_tiles_preference_a: "Агрессивные патрульные схемы"
 sp_naval_anechoic_tiles_preference_b: "Снижение акустической подписи"
 sp_naval_anechoic_tiles_preference_c: "Сокращение расходов на жилые помещения"

 sp_naval_torpedo_cruiser_unique_reward_a: "Второй шанс - Торпедо Крузер"
 sp_naval_torpedo_cruiser_unique_reward_a_desc: "С возрождением старой концепции Торпедо Крузера нам нужно принять важное решение о его роли в нашем флоте: сосредоточимся ли мы на их силе - торпедах; или же мы должны устранить их главную слабость - борющихся с разрушениями?"
 sp_naval_torpedo_cruiser_preference_a: "Прочность - Торпеды"
 sp_naval_torpedo_cruiser_preference_b: "Слабость - разрушители"

 sp_naval_super_heavy_battleship_unique_reward_a: "Вопрос приоритетов - нападение"
 sp_naval_super_heavy_battleship_unique_reward_a_desc: "Разработка нового класса боевых кораблей дает нам возможность сосредоточить наши усилия на повышении нашей способности доминировать на военно-морских полях боя."
 sp_naval_super_heavy_battleship_preference_a_a: "Тяжелые пушки"
 sp_naval_super_heavy_battleship_preference_b_a: "Скорость"
 sp_naval_super_heavy_battleship_preference_c_a: "Легкие пистолеты"
 sp_naval_super_heavy_battleship_unique_reward_b: "Вопрос приоритетов - оборона"
 sp_naval_super_heavy_battleship_unique_reward_b_desc: "Наши высшие военно-морские командиры поставили перед нами невыполнимую задачу - сделать этот корабль почти непобедимым - и хотя мы знаем, что это невозможно, мы можем хотя бы попытаться сделать это."
 sp_naval_super_heavy_battleship_preference_a_b: "Укрепленные бронежилеты и колодцы"
 sp_naval_super_heavy_battleship_preference_b_b: "Противовоздушные артиллерии"
 sp_naval_super_heavy_battleship_preference_c_b: "Антиторпедные меры"

 sp_naval_modern_battleship_unique_reward_a: "Современный боевой корабль — надежда"
 sp_naval_modern_battleship_unique_reward_a_desc: "Хотя многие утверждают, что эпоха корабля закончилась, мы все еще верим в них. У этого корабля есть шанс стать новой надеждой для нас. На каком аспекте мы должны сосредоточиться, чтобы воплотить мечту в жизнь?"
 sp_naval_modern_battleship_preference_a_a: "Первичная огневая мощь"
 sp_naval_modern_battleship_preference_b_a: "Маневрируемость"
 sp_naval_modern_battleship_preference_c_a: "Точность"
 sp_naval_modern_battleship_unique_reward_b: "Современный боевой корабль - ответный удар!"
 sp_naval_modern_battleship_unique_reward_b_desc: "Чтобы доказать свою точку зрения и сохранить свою позицию, нам придется противостоять ударам противника, что нам нужно улучшить, чтобы нанести ответный удар по тем, кто осмеливается встать на нашем пути?"
 sp_naval_modern_battleship_preference_a_b: "Структура"
 sp_naval_modern_battleship_preference_b_b: "Противоядие"
 sp_naval_modern_battleship_preference_c_b: "Защита от торпедо"

 sp_naval_modern_carrier_unique_reward_a: "Современный перевозчик - цель"
 sp_naval_modern_carrier_unique_reward_a_desc: "С новым поколением перевозчиков мы могли бы сосредоточиться на некоторых аспектах нашего корабля, чтобы лучше удовлетворять наши потребности."
 sp_naval_modern_carrier_preference_a_a: "Осведомленность"
 sp_naval_modern_carrier_preference_b_a: "Скорость и погодозащищенность"
 sp_naval_modern_carrier_preference_c_a: "Легкие суда"
 sp_naval_modern_carrier_unique_reward_b: "Современный перевозчик - безопасность"
 sp_naval_modern_carrier_unique_reward_b_desc: "Не вызывает сомнений, что перевозчики являются королями военно-морских сил, однако нам необходимо обеспечить им надлежащую защиту и безопасность."
 sp_naval_modern_carrier_preference_a_b: "Вражеская артиллерия"
 sp_naval_modern_carrier_preference_b_b: "Вражеские самолеты"
 sp_naval_modern_carrier_preference_c_b: "Враги Торпеды"

 sp_naval_ice_carrier_unique_reward_a: "Укрепление плавучих средств"
 sp_naval_ice_carrier_unique_reward_a_desc: "Потратив огромное количество времени на строительство этого гигантского перевозчика, мы должны быть уверены в том, что мы обеспечиваем ему наилучшую защиту."
 sp_naval_ice_carrier_preference_a: "Силы природы"
 sp_naval_ice_carrier_preference_b: "Враги"

 sp_naval_underway_replenishment_unique_reward_a: "Шкала пополнения запасов"
 sp_naval_underway_replenishment_unique_reward_a_desc: "Пока мы все еще работаем над тем, чтобы система текущих пополнений работала как можно более гладко, мы должны принять еще одно решение - хотим ли мы изменить наши первоначальные оценки или нет?"
 sp_naval_underway_replenishment_preference_a: "Более длинный диапазон"
 sp_naval_underway_replenishment_preference_b: "Использование нижних конвоей"
 sp_naval_underway_replenishment_preference_c: "Найти баланс"

 sp_naval_proximity_fuzes_unique_reward_a: "Эффективность или действенность"
 sp_naval_proximity_fuzes_unique_reward_a_desc: "По мере того, как мы готовимся использовать их в наших мобильных противовоздушных подразделениях, мы можем скорректировать количество поставляемых боеприпасов, сохраняя при этом ожидаемое ежедневное соотношение "повреждения"."
 sp_naval_proximity_fuzes_preference_a: "Регулирование принадлежностей для аммо"
 sp_naval_proximity_fuzes_preference_b: "Сохранить текущие боеприпасы"

 sp_naval_support_ships_unique_reward_a: "Вспомогательные суда - центр поддержки"
 sp_naval_support_ships_unique_reward_a_desc: "Хотя ценность вспомогательных судов не оспаривается, нам нужно решить, какова их оперативная направленность: целенаправленное пополнение небольшого числа судов или общее пополнение запасов всего флота."
 sp_naval_support_ships_preference_a_a: "Потребности немногих"
 sp_naval_support_ships_preference_b_a: "Найти баланс"
 sp_naval_support_ships_preference_c_a: "Потребности многих"
 sp_naval_support_ships_unique_reward_b: "Вспомогательные суда - ремонтные работы"
 sp_naval_support_ships_unique_reward_b_desc: "Ключевой вопрос для нашей организации ремонтных судов: либо большее число небольших ремонтных бригад, способных обслуживать большое число судов медленно, либо меньшее число более хорошо оснащенных экипажей, которые могут производить ремонт меньшего числа судов более всеобъемлющим образом."
 sp_naval_support_ships_preference_a_b: "Более широкий охват"
 sp_naval_support_ships_preference_b_b: "Найти баланс"
 sp_naval_support_ships_preference_c_b: "Концентрированные усилия"

 sp_naval_submarine_carrier_unique_reward_a: "Совершенствование подводных перевозчиков"
 sp_naval_submarine_carrier_unique_reward_a_desc: "Наши подводные лодочные носители превосходят границы военно-морской инженерии и не могут быть одинаково сильными во всех областях."
 sp_naval_submarine_carrier_preference_a: "Расширенный диапазон"
 sp_naval_submarine_carrier_preference_b: "Укрепленная структура"
 sp_naval_submarine_carrier_preference_c: "Уменьшенная видимость"

 sp_naval_escort_carrier_unique_reward_a: "Проекты эскорт-конструкторов"
 sp_naval_escort_carrier_unique_reward_a_desc: "Сопровождающая компания пытается уложиться в довольно маленький корпус, мы должны выбрать между упором на дальность, долговечность или скорость."
 sp_naval_escort_carrier_preference_a_a: "Оперативный диапазон"
 sp_naval_escort_carrier_preference_b_a: "Сильнее"
 sp_naval_escort_carrier_preference_c_a: "Высокая скорость"
 sp_naval_escort_carrier_unique_reward_b: "Острые приоритеты"
 sp_naval_escort_carrier_unique_reward_b_desc: "Следует ли им специализироваться на борьбе с подводной лодкой или на обнаружении поверхностных целей или применять обобщенный многофункциональный подход?"
 sp_naval_escort_carrier_preference_a_b: "Подводные лодки"
 sp_naval_escort_carrier_preference_b_b: "Никаких предпочтений"
 sp_naval_escort_carrier_preference_c_b: "Наземные суда"

 sp_naval_armoured_cruiser_unique_reward_a: "Философия бронированного крузера"
 sp_naval_armoured_cruiser_unique_reward_a_desc: "Из-за ограниченных размеров и ресурсов мы должны решить, на чем должны сосредоточиться наши конструкции Бронированных Крузеров. Сосредоточенность на скорости позволит судну убежать от более тяжелых военных кораблей и преследовать более легкие корабли, во многом похожие на более крупный крейсер или менее крупный боевой круиз. Сосредоточенность на лёгкой атаке создаст сильный . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . ."cruiser-killer\" design able to destroy enemy raiders and deter destroyers. Lastly, Heavy Attack will deter enemy capital ships, forcing them to withdraw or commit to a costly attack."
 sp_naval_armoured_cruiser_preference_a: "Скорость обеспечит бóльшую гибкость."
 sp_naval_armoured_cruiser_preference_b: "Легкая атака, чтобы уничтожить более мелкие суда."
 sp_naval_armoured_cruiser_preference_c: "Тяжелая атака, дайте ему боевое оружие!"

