 sp_land_reward_stronghold_network_structural_weakness_discovered: "Обнаружена слабость структуры"
 sp_land_reward_stronghold_network_delayed_by_concrete_shortage: "Задержка в связи с дефицитом бетона"
 sp_land_reward_stronghold_network_underground_rail_systems: "Подземные железнодорожные системы"
 sp_land_reward_stronghold_network_integration_of_anti_blast_doors: "Объединение противопластовых дверей"
 sp_land_reward_stronghold_network_communication_system_overhaul: "Система связи"
 sp_land_reward_stronghold_network_communication_system_overhaul_desc: "Проверяя внутреннюю коммуникационную сеть испытательного комплекса, группа выявила недостатки, которые можно было бы использовать для совершенствования аналогичных систем в традиционных конструкциях фортов."
 sp_land_reward_option_stronghold_network_communication_system_overhaul_standardize: "Стандартизация"
 sp_land_reward_option_stronghold_network_communication_system_overhaul_further_study: "Дальнейшее изучение"
 sp_land_reward_stronghold_network_leadership_approach: "Подход, основанный на лидерстве"
 sp_land_reward_stronghold_network_leadership_approach_desc: "По мере продвижения проекта [Character.GetName], ведущий ученый, должен решить, как [Character. GetSheHe] будет участвовать в повседневных операциях. [Character. GetSheHe Cap] может принять решение осуществлять надзор за строительством непосредственно на местах, обеспечивая точное исполнение или оставаться в офисе, уделяя особое внимание стратегии и планированию."
 sp_land_reward_option_stronghold_network_leadership_approach_oversee_work_personally: "Личное наблюдение за работой"
 sp_land_reward_option_stronghold_network_leadership_approach_office_planning: "Планирование служебных помещений"
 sp_land_reward_stronghold_network_breakthrough_in_concrete_reinforcement_01: "Прорыв в укреплении бетона"
 sp_land_reward_stronghold_network_breakthrough_in_concrete_reinforcement_01_desc: "Один из младших инженеров обнаружил новый метод подкрепления, который можно было бы применить к стандартным укреплениям."
 sp_land_reward_option_stronghold_network_breakthrough_in_concrete_reinforcement_01_apply_and_document_discovery: "Применить и документировать Discovery"
