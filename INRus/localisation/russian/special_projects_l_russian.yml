 scientist_trait_aircraft_specialist_desc: "Специалист по аэродинамической и авиационной конструкции, способный развивать лучшие воздушные корпуса, двигатели и конструкции, чтобы доминировать в небе. §!"
 scientist_trait_rocketry_specialist: "Специалист по ракетам"
 scientist_trait_rocketry_specialist_desc: "Специализировался на ракетной технологии с уделением особого внимания принципам тяги в баллистических и управляемых ракетных программах!"
 scientist_trait_electronics_specialist: "Специалист по электронике"
 scientist_trait_electronics_specialist_desc: "Специализировался на системах связи, радиолокационных и вычислительных системах, имеющих важное значение для современной войны!"
 scientist_trait_helicopter_expert: "Эксперт по вертолетам"
 scientist_trait_helicopter_expert_desc: "Первопроходец в вертолетах, специализирующийся на механике вертикального полета, роторных системах и ранних вертолетных моделях!"
 scientist_trait_jet_expert: "Эксперт-реактивный"
 scientist_trait_jet_expert_desc: "Орган по реактивным двигателям, продвигающий исследования по ранним реактивным двигателям и их применению на военных самолетах!"
 scientist_trait_bombs_expert: "Эксперт по бомбам"
 scientist_trait_bombs_expert_desc: "Умело разрабатывать взрывные устройства и тонкие бомбы, которые могут быть использованы в новых усовершенствованных стратегиях воздушных бомбардировок!"
 scientist_trait_guidance_systems_expert: "Эксперт по системам наведения"
