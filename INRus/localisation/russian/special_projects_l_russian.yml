 scientist_trait_submarine_specialist: "Специалист по подводным лодкам"
 scientist_trait_submarine_specialist_desc: "Специалист по подводным лодкам, специализирующийся на разработке новых технологий подводных лодок в целях повышения их роли в секретных морских операциях."
 scientist_trait_surface_ship_specialist: "Специалист по наземным судам"
 scientist_trait_surface_ship_specialist_desc: "Специализировался на проектировании, разработке и развертывании крупных наземных военных кораблей, а также на изучении новых технологий оснащения военных кораблей."
 scientist_trait_nuclear_specialist: "Специалист по ядерным вопросам"
