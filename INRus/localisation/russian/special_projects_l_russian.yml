 sp_land_multi_charge_large_caliber_gun: "Многозарядное крупнокалиберное оружие"
 sp_land_multi_charge_large_caliber_gun_desc: "С ее многослойной двигательной установкой и большим калибром это оружие способно произвести разрушительные бомбардировки на больших расстояниях."
 sp_land_reward_multi_charge_large_caliber_gun_test_failure: "Катастрофический взрыв"
 sp_land_reward_multi_charge_large_caliber_gun_successful_test_firing: "Успешное испытание на огнестойкость"
 sp_land_reward_multi_charge_large_caliber_gun_breakthrough_in_propulsion_technology: "Прорыв в технологии движения"
 multi_charge_large_caliber_gun_small_size: "Маломасштабное многозарядное оружие"
 sp_multi_charge_large_caliber_gun_small_size_ns: "$multi_charge_large_caliber_gun_small_size$" #Hidden NS: no need for desc

 sp_land_super_heavy_railway_gun: "Пистолет сверхтяжелой железной дороги"
 sp_land_super_heavy_railway_gun_desc: "Огромное оружие непревзойденной силы и точности, которое станет свидетельством военного превосходства любой страны, способной его развертывать."
 sp_land_stronghold_network: "Сеть &lt; &lt; Укрепление &gt; &gt;"
 sp_land_stronghold_network_desc: "Сложная сеть сильно укрепленных бункеров и опор, построенная для того, чтобы противостоять интенсивным нападениям и защитить критически важные стратегические точки от вторжений противника."
 sp_land_flamethrower_tank: "Цистерна для пожаротушения"
 sp_land_flamethrower_tank_desc: "Бронированная машина, оснащенная разрушительной огневой мощью близкого радиуса действия, предназначенная для разлива пламени на позиции противника."
 sp_land_military_engineering_vehicles: "Военно-инженерные автотранспортные средства"
 sp_land_military_engineering_vehicles_desc: "Специализированные транспортные средства для повышения мобильности на поле боя, укрепления конструкции и устранения препятствий в условиях боевых действий."
 sp_land_super_heavy_howitzer: "Супер-тяжелая гаубица"
 sp_land_super_heavy_howitzer_desc: "Огромный артиллерийский кусок, хвастающийся большим калибром, который может привести к хаосу противника с помощью беспрецедентной разрушительной силы."
 sp_land_self_propelled_super_heavy_howitzer: "Самопровозглашенный сверхтяжелый гаубиц"
 sp_land_self_propelled_super_heavy_howitzer_desc: "Самоходный крупногабаритный артиллерийский кусок с большей маневренностью на поле боя, чем его буксируемый контрабандист, в то же время располагающий еще большим калибром."
 sp_land_land_cruiser: "Земельный крузер"
 sp_land_land_cruiser_desc: "Огромный бронированный бехемот, предназначенный для того, чтобы доминировать на поле боя."
 sp_air_radar: "Радиолокатор"
 sp_air_radar_desc: "Используя пульсированные радиоволны и обнаруживая их отражение, мы сможем следить за передвижениями противника с суши, воздуха и моря."
 sp_air_centimetric_radar: "Центиметрический радиолокатор"
 sp_air_centimetric_radar_desc: "Разработка центрометрического радиолокатора позволит обнаруживать гораздо более мелкие мишени и использовать гораздо более мелкие антенны."
 sp_land_large_caliber_kinetic_energy_sabot: "Большой калибро-кинетический энергетический сабот"
 sp_land_large_caliber_kinetic_energy_sabot_desc: "Крупнокалиберная версия бронебойных артиллерийских боеприпасов, предназначенных для проникновения в фортификационные сооружения."
 GER_sp_land_large_caliber_kinetic_energy_sabot: "Раклинговая скорлупа"

 sp_land_reward_land_cruiser_overheating: "Перегрева во время судебных процессов"
 sp_land_reward_land_cruiser_chassis: "Неисправность шасси"
 sp_land_reward_land_cruiser_chassis_desc: "В ходе испытания на стрессовую нагрузку было установлено, что шасси [специального проекта.Гетнам] не в состоянии справиться с огромным весом, вызывая структурные деформации."
 sp_land_reward_option_land_cruiser_chassis_redesign: "Переосмысление шасси"
 sp_land_reward_option_land_cruiser_chassis_redesign_bonus_name: "Модифицированный шасси"
 sp_land_reward_option_land_cruiser_chassis_reinforce: "Укрепить шасси"
 sp_land_reward_option_land_cruiser_chassis_reinforce_bonus_name: "Усиленная шасси"
 sp_land_reward_option_land_cruiser_chassis_lighter_materials: "Использовать светлые материалы"
 sp_land_reward_option_land_cruiser_chassis_lighter_materials_bonus_name: "Мягкие материалы для шасси"
 sp_land_reward_land_cruiser_engine: "Недостаток выпуска двигателя"
 sp_land_reward_land_cruiser_engine_desc: "Первые испытания показывают, что массивная рама прототипа создает напряжение в текущем двигателе, что делает [специальный проект.Гетнам] вялым и нечувствительным. Группа предлагает два варианта: разработать новый, более мощный двигатель или попытаться модифицировать для увеличения выпуска существующего двигателя, рискуя сбой двигателя."
 sp_land_reward_option_land_cruiser_engine_leave: "Уходи как есть."
 sp_land_reward_option_land_cruiser_engine_modify: "Модификация текущего двигателя"
 sp_land_reward_option_land_cruiser_engine_modify_bonus_name: "Усовершенствованный двигатель"
 sp_land_reward_option_land_cruiser_engine_new: "Создать новый двигатель"
 sp_land_reward_option_land_cruiser_engine_new_bonus_name: "Модифицированный двигатель"
 sp_land_reward_land_cruiser_turret: "Сложный механизм &lt; &lt; Туррет &gt; &gt;"
 sp_land_reward_land_cruiser_turret_desc: "Огромная конструкция многогранных турниров вызывает серьезные проблемы с настройкой, замедляя интеграцию оружия. Инженерная команда рекомендует упростить планировку турниров для повышения надежности, но это уменьшит запланированную огневую мощь [специального проекта.Гетнам]."
 sp_land_reward_option_land_cruiser_turret_original: "Сохранить оригинальный дизайн"
 sp_land_reward_option_land_cruiser_turret_simplify: "Упрощение дизайна туррета"
 sp_land_reward_option_land_cruiser_turret_simplify_bonus_name: "Упрощенный дизайн туррета"
 sp_land_reward_option_land_cruiser_turret_redesign: "Механизм реорганизации туррета"
 sp_land_reward_option_land_cruiser_turret_redesign_bonus_name: "Модифицированный механизм для турретов"
 sp_land_reward_land_cruiser_track: "Неисправность системы дорожки"
 sp_land_reward_land_cruiser_track_desc: "Вес [специального проекта "Гетнам"] перегружает систему треков, что приводит к постоянным сбоям в ходе испытаний."
 sp_land_reward_option_land_cruiser_track_current: "Продолжить с текущими дорожками"
 sp_land_reward_option_land_cruiser_track_reduce_armor: "Уменьшить бронетранспортерную пластику"
 sp_land_reward_option_land_cruiser_track_reduce_armor_bonus_name: "Сокращение бронетранспортеров"
 sp_land_reward_option_land_cruiser_track_reinforce_track: "Укрепить систему дорожки"
 sp_land_reward_option_land_cruiser_track_reinforce_track_bonus_name: "Усиленная система дорожки"
 sp_land_reward_land_cruiser_communication: "Вопрос о системе связи"
 sp_land_reward_land_cruiser_communication_desc: "Сам по себе размер [специального проекта. Гетнам] требует сложной внутренней системы связи для координации своей команды. Нынешняя система оказывается неадекватной, поскольку задерживаются или теряются приказы. Группа предлагает пересмотреть внутренний формат для улучшения потока связи или установки более продвинутой, но непроверенной системы."
 sp_land_reward_option_land_cruiser_communication_current: "Текущая система отпусков"
 sp_land_reward_option_land_cruiser_communication_new: "Установка новой усовершенствованной системы"
 sp_land_reward_option_land_cruiser_communication_new_bonus_name: "Усовершенствованная система связи"
 sp_land_reward_option_land_cruiser_communication_redesign: "Модифицированная внутренняя форма"
 sp_land_reward_option_land_cruiser_communication_redesign_bonus_name: "Модернизация системы связи"
 sp_land_reward_land_cruiser_assembly: "Правильная сборка"
 sp_land_reward_land_cruiser_assembly_desc: "На этапе сборки инженеры успешно усовершенствовали метод точной регулировки для установки массивных компонентов [специального проекта.Гетнам], таких, как обшивка кольца и корпуса, что значительно снижает риск механического разрыва напряжения. Мы можем интегрировать этот инновационный метод в весь проект в целях общего повышения структурной надежности. Как нам его применять?"
 sp_land_reward_option_land_cruiser_assembly_all: "На всех этапах собрания"
 sp_land_reward_option_land_cruiser_assembly_bonus_name: "Правильная сборка"
 sp_land_reward_option_land_cruiser_assembly_key: "Только к ключевым компонентам"
 sp_land_reward_land_cruiser_suspension: "Система гидропневматической подвески"
 sp_land_reward_land_cruiser_suspension_desc: "Группа усовершенствовала современную гидропневмическую систему подвески, которая уравновешивает огромный вес [специального проекта.Гетнама], обеспечивая стабильность и уменьшая напряжение на путях, даже когда они пересекают неровную местность. [Character.GetName] уверена, что эта подвеска может быть надежно осуществлена для улучшения работы на местах."
 sp_land_reward_option_land_cruiser_suspension_full: "Полная гидропневматическая подвеска"
 sp_land_reward_option_land_cruiser_suspension_rear: "Предельное значение для задних единиц"
 sp_land_reward_land_cruiser_ammunition: "Решение вопроса о хранении боеприпасов"
 sp_land_reward_land_cruiser_ammunition_desc: "В ходе испытаний возникла озабоченность по поводу безопасного хранения и транспортировки боеприпасов высокого калибра [специального проекта.Гетнам], поскольку стандартные стеллажи не могут безопасно справиться с весом взрывчатого вещества."
 sp_land_reward_option_land_cruiser_ammunition_current: "Сохранять текущую систему"
 sp_land_reward_option_land_cruiser_ammunition_simplified: "Использовать упрощенную версию"
 sp_land_reward_option_land_cruiser_ammunition_new: "Принять новую систему хранения"

 sp_land_reward_super_heavy_howitzer_focus_preference: "Конструктивный фокус"
 sp_land_reward_super_heavy_howitzer_focus_preference_desc: "По мере продвижения вперед в области развития необходимо принять критически важное решение: мы можем уделять приоритетное внимание быстрому производству и малокалиберному оружию, или же мы можем инвестировать в более крупные и более тяжелые вооружения, принося в жертву эффективность производства за беспрецедентные огневые мощности и разрушительные последствия."
 sp_land_reward_option_super_heavy_howitzer_focus_preference_balance: "Сохранять равновесие"
 sp_land_reward_option_super_heavy_howitzer_focus_preference_firepower: "Акцент на огневую мощь"
