 # Nuclear Projects
 sp_nuclear_project_events.1.t: "Утечка информации"
 sp_nuclear_project_events.1.desc: "Несмотря на то, что наши агенты в [FROM.GetNameDef] смогли получить информацию об очевидном секретном проекте, работник, занимавшийся разработкой секретного оружия, атомной бомбы, рассказал о своей работе на небольшом общественном собрании, на котором присутствовал также один из наших агентов."
 sp_nuclear_project_events.1.a: "Это может оказаться полезным."
