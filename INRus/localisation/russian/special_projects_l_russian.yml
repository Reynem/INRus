 sp_air_intercontinental_bomber: "Межконтинентальный бомбардировщик"
 sp_air_intercontinental_bomber_desc: "Огромный самолет, загруженный бомбами и топливом, специально предназначенный для высотных полетов на большие расстояния, дает ему возможность пересекать океаны и континенты."

 sp_air_mothership_aircraft: "Самолеты"
 sp_air_mothership_aircraft_desc: "Огромный самолет, который несет истребители в битву, что позволяет осуществлять глубокий эскорт на территории противника — по-настоящему рой-повелитель неба."

 sp_air_jet_engine: "Двигатель-реактивный"
 sp_air_jet_engine_desc: "Реактивные двигатели являются гораздо более мощными, чем гребные двигатели, что может привести к революции в проектировании самолетов и зажечь новую эру аэронавтической инженерии."

 sp_air_axial_jet_engine: "Двигатель с осями"
 sp_air_axial_jet_engine_desc: "Первые разработанные реактивные двигатели могут лишь в ограниченной степени сжимать воздух. Возможно, можно установить несколько компрессоров серийным способом, чтобы еще больше усилить тягу."

 sp_air_supersonic_jet: "Сверхзвуковой джет"
 sp_air_supersonic_jet_desc: "Совершенствование технологии реактивных двигателей открывает путь для самолетов, способных достичь Маха-1 и преодолеть звуковой барьер."

 sp_air_helicopter: "Вертолеты"
 sp_air_helicopter_desc: "Разработка вертолета, обладающего уникальной способностью к выдерживанию на месте, может дать крайне важное тактическое преимущество в ходе военных операций."

