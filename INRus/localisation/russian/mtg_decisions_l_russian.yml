 very_low_senate_support_status: "Очень немногие законодательные органы поддерживают нынешнюю повестку дня исполнительной власти, большинство нашего правительства, несомненно, будет бороться против ее осуществления."
 low_senate_support_status: "Немногие законодательные органы поддерживают нынешнюю повестку дня исполнительной власти."
 moderate_senate_support_status: "Почти половина законодательных органов поддерживают повестку дня исполнительной власти, и при поддержке двухпартий мы, возможно, сможем провести некоторые незначительные реформы."
 high_senate_support_status: "Большинство законодательных органов поддерживают нынешнюю повестку дня исполнительной власти и не приложат больших усилий для того, чтобы убедить оппозицию поддержать ее."
 very_high_senate_support_status: "Значительное большинство законодательных органов поддерживают нынешнюю повестку дня исполнительной власти."
