 USA_congress:1 "Законодательная власть"
 USA_congress_desc:1 "Почти каждая демократия построена на концепции разделения властей. Эта организация создает систему сдержек и противовесов, запрещая какой-либо одной ветвью власти обеспечивать единственный контроль над правительством. В лучшем случае этот механизм обеспечивает легитимность нашей демократии, но часто споры между законодательной и исполнительной ветвями власти могут ослабить способность нашей страны действовать."
