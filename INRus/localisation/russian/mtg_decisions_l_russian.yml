 USA_small_lobby_effort:1 "Небольшое лоббирование"
 USA_small_lobby_effort_desc: "Заслуживает внимания законодательный орган и обеспечения того, чтобы некоторые влиятельные люди знали, что планирует администрация."
 USA_medium_lobby_effort:1 "Среднее лоббирование"
 USA_medium_lobby_effort_desc: "Согласованные усилия, направленные на то, чтобы довести точку зрения администрации до конца, несомненно, окупятся в долгосрочной перспективе."
 USA_special_measures:1 "Специальные меры"
 USA_special_measures_desc: "Иногда члены Законодательного органа нуждаются в более прямом, личном стимуле для осознания того, что лучшее для их банковского счета - это также лучшее для их страны."
 USA_intervention_mandate:1 "Мандат"
 USA_intervention_mandate_desc: "Хотя мы, возможно, решили более активно участвовать в мировых делах, мы все же должны работать с законодательным органом, с тем чтобы получить разрешение на любые военные действия."
