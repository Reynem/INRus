 USA_war_plans:1 "Военные планы"
 USA_war_plans_desc: "Военное министерство потратило много времени на подготовку планов на случай непредвиденных обстоятельств, хотя невозможно предсказать каждое событие, эти планы должны помочь нам пережить первые несколько месяцев войны."
