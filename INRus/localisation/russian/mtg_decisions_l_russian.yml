 governments_in_exile: "Правительства в изгнании"
 governments_in_exile_desc: "Хотя их родины находятся под вражеской оккупацией, некоторые храбрые солдаты и граждане готовы продолжать борьбу, если мы окажем наше признание дружественным правительствам в изгнании, они смогут использовать ресурсы экспатриантов, эмиграторов и беженцев, создавая новые подразделения, которые будут сражаться на нашей стороне."
 request_reinstatement: "Просить о повторном представлении от [от . Get Adquestition]"
 request_reinstatement_desc: "Наши верные союзники помогли нам вновь захватить земли, занятые нашими врагами, и относительно безопасная родина."
 grant_parliamentary_audience:1 "Парламентская речь"
 grant_parliamentary_audience_desc: "Злоупотребления оккупационных сил, терроризирующие нас, совершенно недопустимы; давайте представим представителей нации перед нашим законодательным собранием, чтобы они засвидетельствовали народу нашего справедливого дела войны."
 lobby_for_parliamentary_support: "Вестибюль для поддержки"
 public_support_for_from: "Общественное признание [от кого-либо] изгнания правительства"
 request_faction_member_support_of_from: "Запрашивайте поддержку действий [From.GetNameDef]"
 exile_recruitment_campaign: "Кампания по набору кадров"
 exile_recruitment_campaign_desc: "Благодаря нашим друзьям из [From.GetNameDef], у нас есть база, с которой можно работать, увеличивая нашу силу в подготовке к нашему триумфальному возвращению в [Root.GetNameDef], мы должны сосредоточиться на сборе полезного персонала для оказания помощи в военных усилиях."
 exile_extraction_campaign: "Кампания по добыче"
 exile_extraction_campaign_desc: "Несмотря на то, что большинство постоянных армейских формирований были захвачены и интернированы после капитуляции правительства, все еще имеются демобилизованные войска в [From.GetNameDef], которые могли бы воспользоваться возможностью покинуть оккупированные районы и оказать помощь в наших военных усилиях. Мы будем разрабатывать планы по оказанию помощи в возвращении заброшенных подразделений, которые затем могут быть вооружены и обучены сражаться за свою родину."
 expatriate_donations: "Пожертвования экспатриантов из [From.GetNameDef]"
 expatriate_donations_desc: "У тех, кто страдает, есть родственники и беженцы, проживающие за границей, и, обращаясь к этим общинам с призывом принести особую жертву для скорейшего освобождения своей родины, мы можем собрать больше ресурсов для военных усилий."
 request_control_of_navy: "Запрашиваю контроль за ВМС"
 request_control_of_navy_desc: "В интересах эффективности наш союз мог бы извлечь большую пользу из интеграции ВМС в нашу собственную."
 category_exile_forces: "Силы эвакуации"
 category_exile_forces_desc: "Наш единый фронт разобьет ненавистного врага, объединив свои силы, мы объединим самые лучшие активы, имеющиеся в распоряжении нашей нации, и преодолеем любые препятствия, которые агрессор может нанести нам!"
 weapons_for_the_resistance: "Оружие для сопротивления"
 weapons_for_the_resistance_desc: "Патриотические элементы за вражескими линиями разрушат наших врагов, если мы сможем доставить им надежные боеприпасы."
 purge_infiltrators: "Противоядие"
 purge_infiltrators_desc: "Наши друзья в законном правительстве обеспокоены растущей поддержкой движения большевистских и ультранационалистических движений, которые служат нам. Мы должны убрать неверных офицеров и разоружить мятежные формирования, прежде чем что-то выйдет из-под контроля. Влияние, которое выиграет нас внутри их страны, будет бесценным, особенно после войны."
 unity_parade: "[Возвращайся к параду единства]- [Возвращайся. Вперёд. Вперёд.]"
 unity_parade_desc: "Ветераны волонтерских сил [от. Гетегита] выиграли много побед против ненавистного врага, и наши общие жертвы являются источником гордости. Мы выставим войска вокруг Внутреннего фронта и продемонстрируем нашу непобедимую мощь! Критики законного правительства [от. Гетэдикации] могут противиться этому как пустой трате ресурсов, но наши успехи заткнут усомнителей."
 joint_training_exercise: "Совместные занятия по подготовке кадров"
 joint_training_exercise_desc: "На суше, на море и в воздухе наши объединенные силы разобьют тиранических агрессоров, которые изгнали наших союзников из своих домов и угрожали будущему мировой цивилизации!"
 custom_cost_joint_training_exercise: "£command_power  §Y25§!"
 custom_cost_joint_training_exercise_blocked: "£command_power  §R25§!"
 foreign_influence: "Иностранное влияние"
 foreign_influence_desc: "Страны, которые мы взяли под нашу защиту, заслуживают лишь наилучшего и справедливого управления."
 nation_building: "Национальное Здание в [From.GetNameDef]"
 nation_building_desc: "Мы должны подготовить новое поколение администраторов, с тем чтобы вывести народ от тоталитаризма к демократии и верховенству права."
 socialist_education: "Социалистическое образование в [From.GetNameDef]"
 socialist_education_desc: "Враги народа проникают в наших братских союзников и сеют инакомыслие против демократического движения, которое мы поддерживаем. Мы должны помочь законному правительству в перевоспитании населения в бессмертной науке Маркса и Энгеля."
 paramilitary_training: "Военизированная подготовка в [From.GetNameDef]"
 paramilitary_training_desc: "Левых агитаторов и других предателей ослабляют народ, и мы будем помогать дружественным силам, которые готовы сотрудничать с нашей армией."
 military_parade: "Военный парад в [From.GetNameDef]"
 military_parade_desc: "Демократы, социалисты, националисты и другие отвратительные продукты Просвещения создают проблемы для правительства. Мы проведём наши несговоримые войска через столицу [From.GetNameDef] и покажем им роскошь [от. Гет."
 police_action: "Полицейские действия в [From.GetNameDef]"
 police_action_desc: "Народ [отстаивайте от них] готов получить ответственное самоуправление от местной полиции и военизированных формирований."
 fraternal_republic: "Братская Республика в [от. GetNameDef]"
 fraternal_republic_desc: "Люди требуют вмешательства со стороны наших сил, чтобы свергнуть паразитов-владельцев и капиталистов, которые правят ими."
 ultranationalist_coup: "Ультранационалистический кубок в [From.GetNameDef]"
 ultranationalist_coup_desc: "Слабое правительство не заслуживает нашей поддержки."
 military_dictatorship: "Военная диктаторская деятельность в [From.GetNameDef]"
 military_dictatorship_desc: "В правительстве есть много слабых связей, которые мы должны устранить."
