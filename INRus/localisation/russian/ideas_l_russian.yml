 student_mobilization_idea: "Мобилизация студентов"
 spiritual_mobilization_idea: "Духовная мобилизация"
 spiritual_mobilization_idea_desc: ""Luxury is our Enemy!" With thrift, hygiene and hard work elevated to national virtues, more manpower is made available to the war effort."
 office_of_strategic_services: "Управление стратегического обслуживания"
 office_of_strategic_services_desc: "Управление стратегических служб (ОСС) является разведывательным агентством Соединенных Штатов, созданным во время Второй мировой войны. Это было военное разведывательное агентство и предшественник Центрального разведывательного агентства (ЦРУ)."
 nkvd: "NKVD"
 nkvd_desc: "Народный комиссар по внутренним делам был правоохранительным органом Советского Союза, которое непосредственно осуществляло власть Всесоюзной коммунистической партии, а также отвечало за защиту советских границ и шпионаж, включая политические убийства за рубежом, оказание влияния на иностранные правительства и осуществление сталинистской политики в рамках коммунистических движений в других странах."
 nkvd_2: "NKVD"
 nkvd_2_desc: "Народный комиссар по внутренним делам был правоохранительным органом Советского Союза, которое непосредственно осуществляло власть Всесоюзной коммунистической партии, а также отвечало за защиту советских границ и шпионаж, включая политические убийства за рубежом, оказание влияния на иностранные правительства и осуществление сталинистской политики в рамках коммунистических движений в других странах."
 idea_political_correctness: "Политическая корректность"
 idea_political_correctness_desc: "Людей, которые правильно думают, гораздо труднее влиять на иностранные державы."
