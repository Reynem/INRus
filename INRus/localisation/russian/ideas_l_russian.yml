 fascist_influence: "Фашистское влияние"
 fascist_influence_desc: "Фашистское давление сделало фашизм очень популярным, и страна восприимчива к сотрудничеству с другими фашистами."
 communist_influence: "Коммунистическое влияние"
 communist_influence_desc: "Коммунистическое давление сделало коммунизм очень популярным, и страна восприимчива к сотрудничеству с другими коммунистами."
 democratic_influence: "Демократическое влияние"
 democratic_influence_desc: "Демократическое давление сделало демократию очень популярной, и страна восприимчива к сотрудничеству с другими демократами."
 soviet_german_friendship: "Советско-немецкая дружба"
 soviet_german_friendship_desc: "Немецкий рейх и Советский Союз объединились в дружбе против декадентского Запада."
 sour_loser: "Горький неудачник"
 sour_loser_desc: "Жестокость по отношению к поражению во время Великой войны доминирует в политике этой страны."
