 anti_soviet_pact_refused_call_desc: "Эта нация не уважала Антисоветский пакт, когда его призывали к войне, что заставило народ усомниться в нынешнем правительстве и подтолкнуло к росту коммунистических сторонников."
 anti_soviet_pact_desc:1 "Если на одну из стран договора нападет Советский Союз, все остальные члены будут призваны на войну."
