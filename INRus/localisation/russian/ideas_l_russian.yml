 internationalism: "Интернационализм"
 internationalism_desc: "Мы твердо убеждены в том, что идеология пересекает национальные границы и не чувствует себя ограниченной в том, что касается самих пересечений этих границ."
 combined_bomber_offensive: "Комбинированное наступление бомбардировщиков"
 the_long_lance: "Длинный Ланс"
 the_long_lance_desc: ""Тип-93" - торпеда, которую обычно называют "Лонг Лэнс", - была самой продвинутой торпедой того времени, которая была разработана Японией и никогда не соответствовала западу, что давало более мелким кораблям эффективный способ причинить боль более крупным, более бронированным военным кораблям на дальнем расстоянии."
 volunteer_corps_focus: "Добровольный корпус"
