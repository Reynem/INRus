 peoples_commissariat_focus: "Народный комиссар оборонной промышленности"
 home_of_revolution: "Дом революции"
 home_of_revolution_desc: "Товарищи, с поражением подлых троцкитянских контрреволюционеров мы смогли сосредоточиться на защите революции, нашей цели, нашей надежды, нашего лозунга - социализм в одной стране, мы построим щедрую социалистическую утопию здесь, в Советском Союзе, и остальной мир неизбежно примет ее."
 en_svensk_tiger: "Свенский тигр"
 en_svensk_tiger_desc: "Если Швеция хочет быть как тигр на охоте, то те, кто шпионит за нами, не должны знать, что мы делаем."
 state_shintoism: "Государственный синтоизм"
 state_shintoism_desc: "После восстановления Мейдзи мы стремились использовать поклонение в святынях Синто, чтобы содействовать имперской лояльности и помощи в строительстве нации, что позволило нам построить страну, готовую принести в жертву многое во имя государства."
 vittoria_mutilata: "Виттория Мутилата"
 vittoria_mutilata_desc: "Наши союзники предали Италию и ударили нас в спину, когда они нарушили Лондонский пакт."
 stiff_upper_lip: "Британский стоикизм"
 stiff_upper_lip_desc: "Если ты можешь держать голову, когда ты теряешь свою и обвиняешь в этом тебя, если ты можешь встретиться с Триумфом и катастрофой, и обращаться с этими двумя самозванцами как с Землей, и со всем, что в ней есть, и, что более того, ты станешь мужчиной, сын мой."
 trotskyite_plot: "Троцкий лот?"
 trotskyite_plot_desc: "Паранойя и патологическое недоверие, вызванное старой борьбой за власть, влияют на руководство этой нации."
 trotskyite_plot_purged: "Троцкие пятна очищены?"
 trotskyite_plot_purged_desc: "Несмотря на очищение, страх предательства остается."
