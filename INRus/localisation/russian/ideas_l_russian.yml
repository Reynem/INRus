 porsche: "Порше"
 porsche_desc: "Порше предпочитает танки с тяжелыми доспехами."
 henschel: "Хеншель"
 henschel_desc:1 "Хеншель отвечал за все серийные модели Tiger, танки, которые после раннего решения проблем с надежностью работали очень хорошо."
 GER_MAN: "Мужчина"
 GER_MAN_desc:1 "Самый известный танком Пантера, MAN также участвовал в проектировании и производстве более ранних моделей Панзера."
 rheinmetall: "Рейнметалл"
 rheinmetall_desc: "Rheinmettall проектирует и строит все виды больших пушек и пушек."
 mauser: "Маузер"
 mauser_desc: "Маузер проектирует и строит все виды стрелкового оружия."
 ig_faben: "IG Farben"
 ig_faben_desc: "ИГ Фарбен очень интересуется промышленными исследованиями."
 messerschmitt: "Мессершмитт"
 messerschmitt_desc: "Messerschmitt уделяет основное внимание проектированию таких легких воздушных судов, как Fight Aircraft, как Fighters."
 focke_wulf: "Фок Вулф"
 focke_wulf_desc: "Focke Wulf имеет особый интерес к проектированию средних воздушных судов, таких, как тяжелые истребители."
 junkers: "Джункеры"
 junkers_desc: "Джанкерс известен тем, что развил бомбардировщик Stuka."
 todt: "Фриц Тодт"
 todt_desc: "Фритц Тодт, немецкий инженер, был основателем организации «Тодт»."
 speer: "Альберт Спер"
 speer_desc: "Альберт Спер был немецким архитектором, который был министром вооружений и военного производства с 1942 по 1945 год."
 raeder: "Эрик Рейдер"
 raeder_desc: "Эрих Рейдер был немецким адмиралом, который выступал за использование традиционных поверхностных кораблей и флота в доктрине Быть."
 donitz: "Карл Дёниц"
 donitz_desc: "Карл Дёниц был немецким адмиралом с любовью к субмаринам и доктрине торгового противостояния."
 goering: "Германн Геринг"
 goering_desc: "Герман Геринг был боецом Великой войны, который стал одним из главных сторонников Гитлера."
 walther_wever: "Волтер Вевер"
 walther_wever_desc: "Вальтер Вевер был первым сторонником теории стратегических бомбардировок."
 ritter_von_greim: "Риттер фон Грейм"
 ritter_von_greim_desc: "Риттер фон Грейм является сторонником тактического противодействия."
 ernst_udet: "Эрнст Удет"
 ernst_udet_desc: "Эрнст Удет оказал влияние на применение методов взрыва ныряльщиков, а также бомбардировщика Stuka."
 werner_von_fritsch: "Вернер фон Фрич"
 werner_von_fritsch_desc: "Вернер фон Фрич, генерал старой охраны, предпочитает сосредоточиться на пехоте."
 ludwig_beck: "Людвиг Бек"
 ludwig_beck_desc: "Людвиг Бек уделяет особое внимание снабжению."
 franz_halder: "Франц Халдер"
 franz_halder_desc: "Франц Холдер верит в поражающую силу Артиллерии в атаке."
 heinz_guderian: "Хайнц Гудериан"
 wilhelm_keitel: "Вильгельм Кейтель"
 wilhelm_keitel_desc: "Вильгельм Кейтель, генерал старой гвардии, предпочитает пехоту, за что ему не хватает навыков в верности."
 ferdinand_schorner: "Фердинанд Шёрнер"
 ferdinand_schorner_desc: "Фердинанд Шёрнер хорошо разбирается в обороне и боях в холодных погодных условиях."
 general_staff: "Генеральный штаб"
 general_staff_desc: "Генеральный штаб Германии отвечает за непрерывное изучение всех аспектов войны, включая разработку и пересмотр планов мобилизации или проведения кампании, что способствует повышению уровня организации в армии."
 v_weapons: "Оружие для мести"
 v_weapons_desc: "Длинная бомбардировка ракет сделала бы идеальное оружие для мести против наших врагов."
 hermann_gortz: "Герман Гёрц"
 hermann_gortz_desc: "§Hermann Görz§! - умелый немецкий шпион."
 elyesa_bazna: "Элиеса Басна"
 elyesa_bazna_desc: "§Helyesa Bazna§! широко известен под его кодовым именем Cicero."
 marina_lee: "Марина Ли"
 marina_lee_desc: "§HMarina Lee§! — балерина, которая занимается кражей боевых планов."
 german_advisors: "Немецкие военные советники"
 german_advisors_desc: "Немецкая военная миссия, возглавляемая Александром фон Фалькенхаузеном, присутствует в Китае, и ее советники помогают нам привести нашу армию в соответствие с западными стандартами."
