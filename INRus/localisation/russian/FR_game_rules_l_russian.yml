 RULE_OPTION_FRA_BLOC_NATIONAL: "Национальные выжившие"
 RULE_OPTION_FRA_BLOC_NATIONAL_DESC: ""Блок нэшнл" переживет все трудности и выиграет на выборах."
 RULE_OPTION_FRA_SOCLIB: "RS Победа"
 RULE_OPTION_FRA_SOCLIB_DESC: "После бюджетного кризиса будут проведены выборы, на которых победит Социальная либеральная партия РС."
 RULE_OPTION_FRA_SFIO: "СФИО Победа"
 RULE_OPTION_FRA_SFIO_DESC: "После бюджетного кризиса будут проведены выборы, в ходе которых победит партия социал-демократ ."
 RULE_OPTION_FRA_SOCCON: "Победа DRA"
 RULE_OPTION_FRA_SOCCON_DESC: "После бюджетного кризиса будут проведены выборы, на которых победит партия Социал-консерватив ДРА."
 RULE_OPTION_FRA_MONARCHIST: "АФ Победа и восстановление"
 RULE_OPTION_FRA_MONARCHIST_DESC: "Во время выборов военные свергнут правительство и введут диктатуру под петеном."
 RULE_OPTION_FRA_PETAIN: "Франция"
 RULE_OPTION_FRA_PETAIN_DESC: "Во время выборов военные свергнут правительство и установят диктатуру под Петэном."
 RULE_OPTION_FRA_PSF: "PSF Победа"
 RULE_OPTION_FRA_PSF_DESC: "Во время выборов военные свергнут правительство и установят диктатуру под петеном."

 RULE_OPTION_BEL_RANDOM: "По умолчанию"
 RULE_OPTION_BEL_RANDOM_DESC: "Бельгия находится в тяжелом положении в 1936 году, и в предстоящие годы ей придется выбрать правильный путь."
 RULE_OPTION_BEL_KPB_KPB: "Коммунистическая победа - КПБ/ПКН"
 RULE_OPTION_BEL_KPB_KPB_DESC: "Леопольд III пытается переворота, ведущего к гражданской войне. Коммунисты побеждают в гражданской войне, и партия остается доминирующей после этого."
 RULE_OPTION_BEL_KPB_DEMAN: "Коммунистическая победа - де-Ман"
 RULE_OPTION_BEL_KPB_DEMAN_DESC: "Леопольд III пытается переворота, ведущего к гражданской войне. Коммунисты побеждают в гражданской войне, а Де Ман берет контроль после этого."
 RULE_OPTION_BWP_KP: "БПР/ПОБ - Коалиция КП/ПК"
 RULE_OPTION_BWP_KP_DESC: "Коалиция католиков и социал-демократов образует правительство."
 RULE_OPTION_KP_LP_PP: "КП/ПК - ЛП/ПЛ - Коалиция ДП"
 RULE_OPTION_KP_LP_PP_DESC: "Коалиция католиков и либералов образует правительство."
 RULE_OPTION_BEL_MONARCHIST: "Королевские суп-корпусы"
 RULE_OPTION_BEL_MONARCHIST_DESC: "Переворот короля Леопольда III увенчается успехом, что приведет к прямому правлению короля и его королевского правительства."
 RULE_OPTION_BEL_VNV: "VNV Победа"
 RULE_OPTION_BEL_VNV_DESC: "После победы правой коалиции фламандские националисты VNV возьмут на себя ответственность и начнут процесс роспуска Бельгии."
 RULE_OPTION_BEL_VERDINASO_SURINAME: "Победа в Вердинасо - Суринам"
 RULE_OPTION_BEL_VERDINASO_SURINAME_DESC: "После победы правой коалиции, националисты- Парламенты Вердинасо поймут, что они свяжутся с голландскими изгнаниями в Суринаме и попытаются заключить с ними соглашение об объединении."
 RULE_OPTION_BEL_VERDINASO_AMSTERDAM: "Вердинасо Победа - Амстердам"
 RULE_OPTION_BEL_VERDINASO_AMSTERDAM_DESC: "После победы правой коалиции, националисты- Парламенты Вердинасо поймут, что они свяжутся с правительством Нидерландов в Амстердаме и попытаются заключить с ними соглашение об объединении."
 RULE_OPTION_BEL_INDEPENDENT_AMSTERDAM: "Вердинасо Победа - Южная Дитленд"
 RULE_OPTION_BEL_INDEPENDENT_AMSTERDAM_DESC: "После победы правой коалиции, националисты- Парламенты Вердинасо будут оставаться штатом Южного Дитленда и не будут стоять на нидерландском единстве."
 RULE_OPTION_BEL_VALKIST: "PB Победа"
 RULE_OPTION_BEL_VALKIST_DESC: "После победы правой коалиции Валькистская Партия Бургиньон под руководством Леона Дегрелла возьмет власть. Они попытаются сформировать союз с Германией и создать огромное бургундское государство на востоке Франции, щит для немецкого мира и европейской цивилизации."

 RULE_OPTION_BUL_RANDOM: "По умолчанию"
 RULE_OPTION_BUL_RANDOM_DESC: "Борьба болгарской державы продолжается, и НРП, скорее всего, одержит победу."
 RULE_OPTION_BUL_MONARCHIST: "Монархист"
 RULE_OPTION_BUL_MONARCHIST_DESC: "Правительство НРП будет свергнуто, а Цар Борис вознесется на Трон, стремясь достичь мечты Сан-Стефано еще раз."
 RULE_OPTION_BUL_NRP: "Национальная республиканская партия"
 RULE_OPTION_BUL_NRP_DESC: "Национальная республиканская партия одержит победу в борьбе за власть, обеспечивая полный контроль и продвигая Болгарию по радикальному реваншистскому пути."
 RULE_OPTION_BUL_DEMOCRATIC: "Демократическая"
 RULE_OPTION_BUL_DEMOCRATIC_DESC: "Демократия будет спасена в Болгарии, и либеральная коалиция примет власть, с тем чтобы сформировать югославское государство."

 RULE_OPTION_CEN_RANDOM: "По умолчанию"
 RULE_OPTION_CEN_RANDOM_DESC: "Западославия выйдет в конце 1930-х годов, будет крайне неопределенным будущим, и мало кто хочет, чтобы он выжил."
 RULE_OPTION_CEN_COLLAPSE: "Свернуть"
 RULE_OPTION_CEN_COLLAPSE_DESC: "Политическая тупиковая ситуация и нерешительность в правительстве Западославии Юнты приведут к тому, что Западославия прекратит свое существование и разорвётся на части, образуя Чехию, Словакию и Силезию."
 RULE_OPTION_CEN_AUTONOMIST: "Победа коалиции АБ-РСЗМЛ"
 RULE_OPTION_CEN_AUTONOMIST_DESC: "Демократия восстановлена, и АБ-РСЗМЛ победит на последующих выборах, они принесут автономию Западославии и компромисс с ее соседями."
 RULE_OPTION_CEN_SOCDEM: "Победа в НСП"
 RULE_OPTION_CEN_SOCDEM_DESC: "Демократия восстановлена, и НСП выиграет последующие выборы."
 RULE_OPTION_CEN_RUSSOPHILE: "Руссофил-социалистский захват"
 RULE_OPTION_CEN_RUSSOPHILE_DESC: "После победы НСП выборы радикально социалистические элементы в партии пытаются взять на себя ответственность и перенаправить политику в сторону Москвы."
 RULE_OPTION_CEN_SOCCON: "Победа в НС"
 RULE_OPTION_CEN_SOCCON_DESC: "Демократия восстановлена, и НС выигрывает последующие выборы, они стремятся повысить эффективность и финансовую стабильность нации Западослав."
 RULE_OPTION_CEN_STEFANIK: "Стефаник Джунта выжил"
 RULE_OPTION_CEN_STEFANIK_DESC: "Штефаникская хунта выживает на коже зубов против демократической оппозиции и правого радикализма и обеспечивает стабильность в стране."
 RULE_OPTION_CEN_GADJA: "Похищение Гайды"
 RULE_OPTION_CEN_GADJA_DESC: "Гайда захватывает Западославию, революционизируя государство и сводя нацию по панславистскому пути."

 RULE_OPTION_MON_RANDOM: "По умолчанию"
 RULE_OPTION_MON_RANDOM_DESC: "Монголия выйдет в окружение хаоса, прокладывая путь в будущее,"
 RULE_OPTION_MON_PRINCE: "Избранный принц Демчугдонгруб"
 RULE_OPTION_MON_PRINCE_DESC: "Поглощение Штернберга успешно, и он выбрал Демчугдонгруба, чтобы возглавить монгольскую нацию. Принц ведёт Монголию по пути панмонгольской экспансии, не вступая при этом в сговор с российскими интересами."
 RULE_OPTION_MON_KHANII: "Стернбергская компания Завоеватели -- ограниченная"
 RULE_OPTION_MON_KHANII_DESC: "Стернберг покоряет Гуи и Восточный Туркестан, прежде чем остановиться."
 RULE_OPTION_MON_KHANII_FULLEMPIRE: "Стернберг побеждает - Монгольская империя"
 RULE_OPTION_MON_KHANII_FULLEMPIRE_DESC: "Стернберг берется за завоевание и выбирает восстановление империи монголов после успешных завоеваний против хуай."
 RULE_OPTION_MON_RUS: "Русский лапдог"
 RULE_OPTION_MON_RUS_DESC: "Стернберг берет Монголию, правит в интересах Белой России."
 RULE_OPTION_MON_SOV: "Советский лапдог"
