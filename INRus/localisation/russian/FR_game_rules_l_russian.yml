 RULE_OPTION_GER_WEST_FIRST: "Сосредоточься на Франции"
 RULE_OPTION_GER_WEST_FIRST_DESC: "В 1919 году Немецкая империя была побеждена Францией и властью Энтези. После этой разрушительной потери Кайзер Вильгельм II был вынужден отказаться от создания Республики Веймар, которая вскоре оказалась жертвой французского реваншизма. Версальский договор был подготовлен для французов, чтобы сохранить Германию на постоянной основе. Адам Дресслер пришел к власти, обещая полностью отменить Версальский договор и как таковой пожертвует всей энергией Германии, победив французский."
 RULE_OPTION_GER_EAST_FIRST: "Сосредоточься на Советском Союзе"
 RULE_OPTION_GER_EAST_FIRST_DESC: "Поражение Российской империи во время Великой войны позволило создать первое в мире социалистическое государство, Советский Союз. Адам Дресслер рассматривает социализм не только как угрозу стабильности Германии, но и как экзистенциальную угрозу самому выживанию Европы. Дресслер посвящает всю энергию Германии разрушению Советского Союза и сокрушению социализма, где бы он ни возник."
 RULE_OPTION_GER_ALLY_BRITISH: "Элли Британцы"
 RULE_OPTION_GER_ALLY_BRITISH_DESC: "В то время как мы сражались против Великой войны, фюрер и многие валькисты восхищаются тем, как англичанин, немецкий народ, покорил мир. Считая их интересы взаимовыгодными, благодаря правым членам правительства Германии, стремятся к альянсу с Великобританией. ~nn §RRequires: §!n §GThe Ideological Threat §! или §GThe Old Rival§! в §Y$ENG_AI_BEHAVIOR$§! \n\n §ROPROTEINTION: Этот вариант заблокирует немецкого игрока от выбора министров. Не выбирайте этот вариант, если вы будете играть в Германию самостоятельно, если вы не хотите, чтобы вы были лишены таких вариантов."

