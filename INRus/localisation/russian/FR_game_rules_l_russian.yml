 RULE_OPTION_ENG_RANDOM: "Случайно"
 RULE_OPTION_ENG_RANDOM_DESC: "В 1936 году Британская империя продолжает, несмотря на то, что перед ней стоят большие проблемы и борьба, путь, по которому она пойдет в предстоящие годы, остается незамеченным, а последствия неизвестны."
 RULE_OPTION_CAPE_SINGAPORE: "Империализм четвертой волны"
 RULE_OPTION_CAPE_SINGAPORE_DESC: "Во время 19-го года британская империя управляла ранее непредвиденным господством над мировыми делами, вмешиваясь, когда и где она довольствовалась делами других стран. Великая война, возможно, имела негативные последствия для влияния Британской империи, но многие по-прежнему считают, что судьба Британии находится за границей."
 RULE_OPTION_IMP_FED: "Свобода, братство, Федерация"
 RULE_OPTION_IMP_FED_DESC: "Имперская федерация, предложенная в конце 19-го года в качестве альтернативы возросшей передаче власти и продвижению к самоуправлению во всей империи, была направлена на создание федеральной системы управления между Соединенным Королевством и Доминионами Империи. Хотя она никогда не была достигнута в то время, когда она имела наибольшее влияние, с большой борьбой мы можем вдохнуть новую жизнь в эту старую идею. \n §gideology:§! Социальная консервативная в коалиции с рынком Либерально-n§GDeble:§! Формировать Имперскую федерацию \n§GW2 Вовлечение: §!"
 RULE_OPTION_CRUSH_COLLECTIVISM: "Идеологическая угроза"
 RULE_OPTION_CRUSH_COLLECTIVISM_DESC: "С кризисом в Манчестере наш великий народ оказался на грани краха, наш король Эдуард VIII счел нужным осуществить свою королевскую прерогативу и официально распустить парламент, захватив контроль над нацией и ее судьбой. Кризис, охвативший нашу нацию, оказал глубокое воздействие на короля, который возложил вину за катастрофу прямо на ноги этих социалистов как дома, так и за рубежом. nn §Gideology: §! Patternal Autocrat\n§GDesign:§! Разрушение социалистов, где бы они ни были найдены#n§GW2 Вовлечение: §!"
 RULE_OPTION_CHALLENGE_FRANCE: "Старый рыцарь"
 RULE_OPTION_CHALLENGE_FRANCE_DESC: "На протяжении веков Великобритания и Франция были соперниками как в континентальной Европе, так и по всему миру. С растущей угрозой немецкой империи в конце 19-го года был похоронен топор, и эти бывшие враги сражались вместе, чтобы положить конец угрозе Германии. Сегодня Великобритания и Франция снова находятся на противостоящих сторонах и, возможно, время пришло к концу угрозы Франции раз и навсегда."
 RULE_OPTION_ENTENTE_CORDIALE: "Братья по оружию"
 RULE_OPTION_ENTENTE_CORDIALE_DESC: "Несмотря на столетия недоверия и соперничества между нашими двумя нациями, Великобритания и Франция действовали сообща против угрозы немецкой империи во время Великой войны."
 RULE_OPTION_RULE_THE_WAVES: "Править Волнами"
 RULE_OPTION_RULE_THE_WAVES_DESC: ""
 RULE_OPTION_REVOLUTION: "Революция!"
 RULE_OPTION_REVOLUTION_DESC: "После массового дезертирства армейских элементов социалистам объявляется революционное правительство и начинается британская гражданская война."

 RULE_OPTION_POR_CCM: "CCM Доминантность"
 RULE_OPTION_POR_CCM_DESC: "ККС возьмет на себя функции Королевского конгресса, сохраняя стабильность в начале 1930-х годов, одновременно наделяя короля полномочиями."
 RULE_OPTION_POR_PCC: "PCC Доминантность"
 RULE_OPTION_POR_PCC_DESC: "ЦКЗ возглавит Королевский конгресс, а Салазар будет править Португалией железным кулаком."
 RULE_OPTION_POR_IL: "Ил Доминант"
 RULE_OPTION_POR_IL_DESC: "ИЛ возьмет на себя руководство Королевским конгрессом, продвигая Португалию по традиционистскому пути."

 RULE_OPTION_POR_BRITAIN: "С Великобританией"
 RULE_OPTION_POR_BRITAIN_DESC: "Португалия присоединится к Великобритании, стремясь к экономическим и территориальным выгодам в рамках британского союза."
 RULE_OPTION_POR_ISOLATION: "Изоляционист"
 RULE_OPTION_POR_ISOLATION_DESC: "Португалия сосредоточит свое внимание на развитии и защите своей империи, избегая запутанных иностранных связей."
 RULE_OPTION_POR_IMPERIALISTANTI: "Новый империализм - антибританец"
 RULE_OPTION_POR_IMPERIALISTANTI_DESC: "Португалия попытается значительно расширить свои колониальные владения с помощью военных действий. Они заберут Розовую карту и пойдут по антибританскому пути."
 RULE_OPTION_POR_IMPERIALISTPRO: "Новый империализм - пробританец"
 RULE_OPTION_POR_IMPERIALISTPRO_DESC: "Португалия попытается значительно расширить свои колониальные владения. Они не претендуют на Розовую карту и не бросают вызов Британской империи."

