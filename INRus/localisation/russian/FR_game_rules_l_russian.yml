 RULE_OPTION_PHN_SOCCON_DESC: "Будут проведены выборы с победой в Конституционном Блоке Хури, с бескомпромиссной приверженностью независимости."
 RULE_OPTION_PHN_AUTDEM: "Кубок Шебаба (Авторитарская демократия)"
 RULE_OPTION_PHN_AUTDEM_DESC: "После неправильного управления и упрямства правительства после глобального экономического кризиса, Шебаб начинает управлять Феникией."
 RULE_OPTION_PHN_KAATEB: "Партия Катаеб (национальный популист)"
 RULE_OPTION_PHN_KAATEB_DESC: "Выборы будут проведены с приходом к власти фалангистской партии Катаеб, бескомпромиссно промарониты, они будут править почти исключительно в интересах маронитского христианского населения, сильного государства и финикийской самобытности."
 RULE_OPTION_PHN_KAATEB_VALKIST: "Сторона Катаеб (валькист)"
 RULE_OPTION_PHN_KAATEB_VALKIST_DESC: "Выборы будут проводиться с приходом к власти фалангистской партии Катаеб, бескомпромиссно промарониты, они будут править почти исключительно в интересах маронитского христианского населения с сильным государством и финикийской идентичностью."
 RULE_OPTION_PHN_SSNP: "Похищение ПСН (национал-популист)"
 RULE_OPTION_PHN_SSNP_DESC: "После переворота Шебаба правительство Шебаба не сможет вовремя избежать внутренних угроз, и властвуя, сирийские националисты обретут власть, превратив Феникию в сирийское арабское государство. ~nn France WILLL НЕ объявит войну в ответ на эти события."
 RULE_OPTION_PHN_SSNP_FRENCH_INVASION: "Похищение ПСН (Ф.И) (национальный популист)"
 RULE_OPTION_PHN_SSNP_FRENCH_INVASION_DESC: "После переворота Шебаба правительство Шебаба не сможет вовремя избежать внутренних угроз, и властвуя, сирийские националисты обретут власть, превратив Феникию в сирийское арабское государство. ~nn France WILLL объявляет войну в ответ на эти события. Не включайте этот вариант, если вы играете как Франция, так как это ограничит ваши возможности."
 RULE_OPTION_PHN_FRENCH_LACKEY: "Французский мандат (Патернальный автократ)"
 RULE_OPTION_PHN_FRENCH_LACKEY_DESC: "После переворота Шебаба правительство Шебаба не сможет вовремя избежать внутренних угроз, и властвуя, сирийские националисты захватят власть. Однако из-за сильной зависимости Фений от Франции французы быстро могут свергнуть Антуна Саада и его революционеров, при этом французское военное правительство возьмет на себя власть над страной."

 RULE_OPTION_PHN_SWISS_SYSTEM: "Швейцария (двустороннее государство)"
 RULE_OPTION_PHN_SWISS_SYSTEM_DESC: "Феникия преобразуется в федералистское плюралистическое государство, которое позволит самоуправлять и сотрудничать между своими меньшинствами. nn §PRRequires: §!n §GBeirut Reform Movement §! или §GNational Bloc§! или §G Constitual Bloc§! или §GHebab's Coup§! в §Y$PHN_AI_BEHAVIOR$§!"
 RULE_OPTION_PHN_AH_SYSTEM: "Австрия-Венгрия (двустороннее государство)"
 RULE_OPTION_PHN_AH_SYSTEM_DESC: "Феникия преобразуется в двухпартийное государство между Ливаном и Сирией, аналогичное соглашению с двухпартийной Австро-венгерской империей, которая попытается сделать то же самое, что было достигнуто австрийцами в 1867 году, кооптировать мятежную группу и привести их в правящий класс. ~n §PRRequires: §!n §GBeirut Reform Movement §! или §GNational Bloc§! или §G Constitutional Bloc§! или §GHebab' Coup§! в §Y$PHN_AI_BEHAVIOR$ §!"
 RULE_OPTION_PHN_BIPARTITE_INDP_LEBANON: "Ливанская нерешительность (двустороннее государство)"
 RULE_OPTION_PHN_BIPARTITE_INDP_LEBANON_DESC: "Феникия разделится на Ливан и Сирию, а Сирия будет протекторатом ливанского государства. В §Y$PHN_AI_BEHAVIOR$§!"
 RULE_OPTION_PHN_MARONITE_INDP_LEBANON: "Ливанская нерешительность (Маронитское Доминирование)"
 RULE_OPTION_PHN_MARONITE_INDP_LEBANON_DESC: "Феникия разделится на Ливан и Сирию, а Сирия будет протекторатом ливанского государства. В §Y$PHN_AI_BEHAVIOR$§!"
 RULE_OPTION_PHN_POPULATION_EXCHANGE: "Обмен населением (мэронитное доминирование)"
 RULE_OPTION_PHN_POPULATION_EXCHANGE_DESC: "Статус-кво будет сохранен в феничском государстве, где доминируют марониты, и будет проведен обмен населением, с тем чтобы сократить количество враждебных суннитских арабов в штате. ~n §PRRequires: §!n §GNational Bloc§! или §G Constitual Bloc§! или §GChebab's Coup§! или §GKataeb Party§! в §Y$PHN_AI_BEHAVIOR$§!"

