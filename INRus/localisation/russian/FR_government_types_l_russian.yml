l_russian:

 ### Ideas ###
 political_system: "Тип правительства"
 #
 direct_democracy: "Прямая демократия"
 direct_democracy_desc: "Форма правления, в которой народ представляет себя и голосует непосредственно за новые законы и государственную политику. Большинство политики определяется национальными референдумами, и новые референдумы легко выносятся на голосование, что позволяет вести открытый диалог по всем вопросам. Хотя , Представительные лидеры существуют, они не служат в течение длительного времени и не обладают большой властью в одиночку. n"
 #
 presidential_republic: "Президентская Республика"
 presidential_republic_desc: "В президентской республике избранный глава государства также является главой правительства, что допускает более централизованную власть."
 #
 semi_presidential_republic: "Полупрезидентская Республика"
 semi_presidential_republic_desc: "Полупрезидентская республика имеет как премьер-министра, так и президента, и они делят власть, и только один из них непосредственно входит в состав парламента. Как правило, президент избирается народом, а партия или партии, находящиеся у власти, выбирают премьер-министра. Их точные обязанности различаются в зависимости от страны, но на бумаге они являются равными партнерами в управлении страной."
 #
 parliamentary_republic: "Парламентская Республика"
 parliamentary_republic_desc: "Парламентские республики имеют избранного главу государства, но глава государства и глава правительства содержатся отдельно от главы правительства, которая сохраняет большинство исполнительных полномочий, или глава государства, подобный главе правительства, который избирается парламентом, поскольку власть более децентрализована, система движется медленнее, но безопаснее от тирании отдельных лиц в правительстве."
 #
 republican_dictatorship: "Республиканский диктатор"
 republican_dictatorship_desc: "Диктаторы не являются монархами, но иногда передают свою власть членам своей семьи, как если бы они были."
 #
 theocratic_republic: "Метрополитическая Республика"
 theocratic_republic_desc: "Метрополитическая республика является республиканской формой правления, руководящие принципы и правовые нормы которой основаны на текстах и принципах государственной религии, из-за сложности религиозного права изучение теологии и священных текстов, а также взглядов старшего священства имеет большое влияние. Снаружи теократические республики очень репрессивны в своем социальном консерватизме и отсутствии свободы, но внутри они могут наслаждаться плюралистической демократией... после того, как кандидаты проверяются религиозным порядком, чтобы подтвердить свою добродетель."
 #
 theocratic_dictatorship: "Богохульство"
 theocratic_dictatorship_desc: "Теократия — это правительство, где священство правит страной напрямую, благодаря благодати божественного провидения. Часто это диктаторы, где диктатор избирается среди священства, и священство является эксклюзивным органом."
 #
 one_party_dictatorship: "Одна партия"
 one_party_dictatorship_desc: "Одно государство является страной, которая управляется элитой единственной законной партии в соответствии с идеологическими принципами этой партии. Партия проникает во все уровни правления и часто является армией. Эти диктатуры часто являются авторитарными и репрессивными, но можно найти какую-то социальную мобильность, работая в партии."
 #
 workers_republic: "Республика трудящихся"
 workers_republic_desc: "социалистическая республика является демократическим правительством, которое для защиты революции запретило буржуазные политические партии."
 #
 communist_state: "Коммунальное государство"
 communist_state_desc: "Коммунальные штаты - это страны, полностью приверженные коммунистической мечте, с непосредственным контролем за работой и очень большой передачей власти и гарантий автономии. Это правительства анархистов, начиная от федераций синдикалистов и заканчивая простыми рабочими коммунами. Часто государственные сети остаются только для единой обороны и общей внутренней торговли."
 #
 colonial_government: "Колониальное правительство"
 colonial_government_desc: "Колониальные правительства являются бюрократическими образованиями, которые управляют колониями и протекторатами на благо иностранной имперской державы."
 #
 absolute_monarchy: "Абсолютная монархия"
 absolute_monarchy_desc: "Абсолютная монархия представляет собой централизованную форму правления, где конечная власть лежит на монархе, который унаследовал свою власть после своей предшественницы. Из-за централизованного характера системы решения и политика могут быть осуществлены очень быстро и эффективно, но это также означает провал на вершине системы. В идеале хорошие монархи создают длительные периоды внутренней стабильности и прогресса в королевстве, но существует большая опасность для плохих монархов, с которыми очень трудно бороться на законных основаниях."
 #
 constitutional_monarchy: "Конституционная монархия"
 constitutional_monarchy_desc: "В большинстве современных конституционных монархий монархия выполняет в основном символические функции, но некоторые из них позволяют монарху сохранить значительные чрезвычайные полномочия."
 #
 elective_monarchy: "Избирательная монархия"
 elective_monarchy_desc: "Форма правления, в которой избирается монарх, как правило, каким-то аристократическим советом."
 #
 military_junta: "Военная хунта"
 military_junta_desc: "Военная хунта — это правительство, возглавляемое кликой армейских офицеров, которые полностью контролируют нацию."
 #
 revolutionary_movement: "Революционное движение"
 revolutionary_movement_desc: "Общественное движение низового уровня, стремящееся, как минимум, свергнуть правительство или государство, которое может вспыхнуть во время экстремальных политических репрессий, когда прекратится существование других средств социальной реформы."
 #
 failed_state: "Несоответствие государства"
 failed_state_desc: "Правительство, которое распалось до такой степени, что основные условия и обязанности суверенного государства более не функционируют должным образом. Государство может потерпеть неудачу, если правительство утратит свою легитимность, даже если оно должным образом выполняет свои функции. Для стабильного государства необходимо, чтобы правительство пользовалось как эффективностью, так и легитимностью."
 #
 generic_government: "Общее правительство"
 
 ### Events ###
 gov.1.t: "Разбивка [Крыльцо. Найти имя]"
 gov.1.d: "Серия резких и резких изменений в обществе затруднила способность нашего правительства реагировать и поддерживать стабильность и даже нормальное функционирование нашей нации. С помощью правительства, которое не в состоянии выполнить те действия и обязанности, которые от него ожидаются, многие из наших людей начали смотреть на чёрный рынок и другие подобные незаконные организации, чтобы удовлетворить свои потребности. В свете политической слабости нашего правительства политические агитаторы, начиная от профсоюзных организаций и заканчивая оппозиционными партиями, начали проводить протесты и ставить под сомнение легитимность нашей администрации. Если бы не верность армии [Рот. Гетенаме], многие боялись, что [Рот.Гетнам] может впасть в гражданскую войну, то для того чтобы обратить вспять эту надвигающуюся катастрофу, мы должны провести крупные реформы, чтобы улучшить внутреннюю стабильность нашей страны."
 gov.1.a: "Да поможет нам Господь всем"
 
 gov.2.t: "Стабильность возвращается в [Root.GetName]"
 gov.2.d: "По мере того, как наше правительство проводит столь необходимые реформы, кажется, что чувство стабильности возвращается в нашу страну, хотя худшее уже позади, очевидно, что наша оппозиция будет пристально следить за нами."
 gov.2.a: "Всё восстановлено."
