l_russian:
  naval_equipment: "Корабли"

  submarine_1: "Межвоенная подводная лодка"
  submarine_2: "Базовая подводная лодка"
  submarine_3: "Улучшенная подводная лодка"
  submarine_4: "Усовершенствованная подводная лодка"

  cruiser_submarine: "$ship_hull_cruiser_submarine$"
  cruiser_submarine_desc: "$ship_hull_cruiser_submarine_desc$"

  fleet_submarine: "$ship_hull_fleet_submarine$"
  fleet_submarine_desc: "$ship_hull_fleet_submarine_desc$"

  midget_submarine: "$ship_hull_midget_submarine$"
  midget_submarine_desc: "$ship_hull_midget_submarine_desc$"

  rocket_submarine: "Ракетная подводная лодка"
  rocket_submarine_desc: "Новое поколение подводных лодок, оснащённых крылатыми и баллистическими ракетами, дающими возможность наносить внезапные удары по стратегическим целям противника."

  nuclear_submarine: "$ship_hull_nuclear_submarine$"
  nuclear_submarine_desc: "$ship_hull_nuclear_submarine_desc$"

  nuclear_missile_submarine: "ПЛАРБ / Подводная лодка с ядерными ракетами"
  nuclear_missile_submarine_desc: "Подводные лодки, способные нести и запускать баллистические ракеты с ядерными боеголовками."

  submarine_1_desc: "Первые подводные корабли, способные к эффективным боевым действиям. Использование дизель-электрических установок вместо бензиновых двигателей значительно увеличило дальность хода и надводную скорость. В бою с вражескими кораблями действуют в основном как подводные торпедные катера, но им не хватает скорости и автономности для длительного пребывания под водой. Подобные субмарины массово использовались великими державами во время Вельткрига."
  submarine_2_desc: "Дальнейшее развитие субмарин: некоторые проекты воплощают концепцию «крейсерских» подводных лодок с более крупными орудиями и упором на надводный бой, тогда как другие сосредоточены на увеличении подводной автономности и улучшении ходовых качеств."
  submarine_3_desc: "Успехи в увеличении подводной дальности и скорости сместили разработку с «крейсерских» подводных лодок на корабли с акцентом на скрытные подводные атаки. Они несут мощный торпедный боезапас и представляют серьёзную угрозу для любых надводных сил. Однако их подводная скорость и автономность всё ещё ограничены, и они остаются уязвимыми, особенно при перезарядке и погружении."
  submarine_4_desc: "Благодаря возросшей емкости аккумуляторов, передовым системам регенерации воздуха и обтекаемому корпусу, эти субмарины способны проводить под водой почти всё время похода. Они знаменуют собой революцию в подводной войне, превращая субмарины в настоящий ужас морей."
  ship_hull_submarine_1_desc: "$submarine_1_desc$"
  ship_hull_submarine_2_desc: "$submarine_2_desc$"
  ship_hull_submarine_3_desc: "$submarine_3_desc$"
  ship_hull_submarine_4_desc: "$submarine_4_desc$"

  destroyer_1: "Межвоенный эсминец"
  destroyer_2: "Базовый эсминец"
  destroyer_3: "Улучшенный эсминец"
  destroyer_4: "Усовершенствованный эсминец"
  destroyer_1_desc: "Вельткриг вызвал огромный спрос на эсминцы — они должны были не только сопровождать флоты, но и защищать торговые пути. Конструкции были упрощены для массового производства. Эсминцы этой эпохи обладают водоизмещением около 1000 тонн, развивают скорость до 34 узлов и несут больше торпедных аппаратов, чем их предшественники."
  destroyer_2_desc: "К 1935 году развитие морской авиации и появление первых авианосцев заставили адмиралтейства задуматься об угрозе с воздуха. Конструкции эсминцев стали перерабатываться для установки более эффективных зенитных орудий и систем обнаружения."
  destroyer_3_desc: "С началом второго Вельткрига флотам потребовались дешевые и эффективные эскортные корабли. Эсминцы доказали свою важность не только в разведке, но и в противолодочной обороне конвоев. Из вспомогательных кораблей они превратились в ключевой элемент как линейных сил, так и эскортных групп, получив гладкопалубные корпуса, улучшенные сонары и более мощное торпедное вооружение."
  destroyer_4_desc: "В конце второго Вельткрига эсминцы стали главным средством борьбы с новейшими скрытными субмаринами и реактивной авиацией. Водоизмещение этих эскортных кораблей выросло почти до 3000 тонн из-за установки многочисленных зенитных автоматов, универсальных орудий главный калибра и современных радаров."
  ship_hull_light_1_desc: "$destroyer_1_desc$"
  ship_hull_light_2_desc: "$destroyer_2_desc$"
  ship_hull_light_3_desc: "$destroyer_3_desc$"
  ship_hull_light_4_desc: "$destroyer_4_desc$"

  light_cruiser_1: "Межвоенный легкий крейсер"
  light_cruiser_2: "Базовый легкий крейсер"
  light_cruiser_3: "Улучшенный легкий крейсер"
  light_cruiser_4: "Усовершенствованный легкий крейсер"

  torpedo_cruiser: "$ship_hull_torpedo_cruiser$"
  torpedo_cruiser_desc: "$ship_hull_torpedo_cruiser_desc$"

  light_cruiser_1_desc: "Появление качественной брони и паровых турбин привело к росту популярности легких крейсеров. Они пришли на смену бронепалубным крейсерам 1910-х годов, сохраняя высокую скорость, хорошую защищенность и большую дальность плавания для самостоятельных операций по всему миру."
  light_cruiser_2_desc: "В межвоенный период из-за бюджетных ограничений размеры крейсеров почти не росли. Вместо этого конструкторы повышали огневую мощь: устанавливали орудия большего калибра, трех- и четырехтрубные торпедные аппараты, а также первые универсальные орудия и зенитные автоматы для защиты от авиации."
  light_cruiser_3_desc: "К концу межвоенного периода и началу второго Вельткрига новые крейсеры вновь начали увеличиваться в размерах. На них появились многоорудийные башни, улучшенные универсальные батареи, специализированные зенитные комплексы, а также первые системы управления огнем с радарами."
  light_cruiser_4_desc: "Крейсеры позднего военного и раннего послевоенного периода воплотили в себе все уроки грандиозных морских сражений: они имеют максимальную защищенность, мощное ПВО-вооружение и передовые радиолокационные станции."

  heavy_cruiser_1: "Межвоенный тяжелый крейсер"
  heavy_cruiser_2: "Базовый тяжелый крейсер"
  heavy_cruiser_3: "Улучшенный тяжелый крейсер"
  heavy_cruiser_4: "Усовершенствованный тяжелый крейсер"
  heavy_cruiser_1_desc: "Усовершенствование бронирования и паротурбинных установок привело к созданию тяжелых крейсеров нового типа, сочетающих скорость с мощной 203-мм артиллерией."
  heavy_cruiser_2_desc: "В межвоенный период развитие тяжелых крейсеров шло по пути увеличения огневой мощи при ограниченном водоизмещении. Это достигалось за счет применения трехорудийных башен, мощных торпедных аппаратов, первых универсальных установок и гидросамолетов-разведчиков."
  heavy_cruiser_3_desc: "Тяжелые крейсеры этой эпохи получили усиленное бронирование, модернизированные 8-дюймовые орудия, многочисленную зенитную артиллерию и радароемкие системы управления огнем."
  heavy_cruiser_4_desc: "Поздние тяжелые крейсеры представляют собой вершины артиллерийского кораблестроения, способные вести бой на больших дистанциях и эффективно прикрывать авианосные соединения мощным огнем ПВО."
  ship_hull_cruiser_1_desc: "$light_cruiser_1_desc$"
  ship_hull_cruiser_2_desc: "$light_cruiser_2_desc$"
  ship_hull_cruiser_3_desc: "$light_cruiser_3_desc$"
  ship_hull_cruiser_4_desc: "$light_cruiser_4_desc$"

  battle_cruiser_1: "Межвоенный линейный крейсер"
  battle_cruiser_2: "Базовый линейный крейсер"
  #battle_cruiser_3: "Улучшенный линейный крейсер"
  #battle_cruiser_4: "Усовершенствованный линейный крейсер"
  battle_cruiser_1_desc: "В первые годы после Вельткрига ведущие морские державы начали проектирование линейных крейсеров нового поколения, способных выполнять роль «быстроходных линкоров»."
  battle_cruiser_2_desc: "Последующие проекты линейных крейсеров получили усовершенствованные дальномеры, облегченные трехорудийные башни и ангары для катапультных гидросамолетов. Эти корабли стали популярным выбором в условиях начавшейся новой гонки морских вооружений."
  #battle_cruiser_3_desc: "Конструкция линейных крейсеров развивалась в сторону применения скорострельных орудий калибра 280–305 мм при сохранении высокой скорости ходов. Они идеально подходили для уничтожения вражеских крейсеров и рейдерских операций."
  #battle_cruiser_4_desc: "К середине 1940-х годов линейные крейсеры превратились в крупногабаритные эскортные корабли. Обладая огромной скоростью и мощной броней, они эффективно использовались для поддержки десантов, защиты авианосцев и охоты на изолированные тяжелые корабли врага."

  battleship_1: "Межвоенный линкор"
  battleship_2: "Базовый линкор"
  battleship_3: "Улучшенный линкор"
  battleship_4: "Усовершенствованный линкор"
  battleship_1_desc: "Эти линкоры представляют собой вершину военно-морской мысли эпохи Вельткрига. Быстрее додредноутов, они несут от 8 до 10 тяжелых орудий главка в двух- и трехорудийных башнях. Их разрушительная мощь и тяжелая броня делали их ядром любого флота, хотя постройка каждого такого корабля требовала колоссальных финансовых затрат."
  battleship_2_desc: "После окончания Дредноутной гонки финансирование флотов резко сократилось. В течение десятилетия державы достраивали заложенные корабли. Лишь к началу 1930-х появились проекты быстроходных линкоров с мощными нефтяными котлами и 406-мм орудиями, сочетающих баланс стоимости и боевой эффективности."
  battleship_3_desc: "С приближением второго Вельткрига началась разработка линкоров нового поколения. Несмотря на растущую роль авианосцев, многие адмиралы продолжали считать линкор главной ударной силой на море."
  battleship_4_desc: "К концу второго Вельткрига стало очевидно, что морская авиация окончательно превзошла артиллерийские корабли. Тем не менее, усовершенствованные линкоры с плотной зенитной батареей продолжали активно использоваться для береговой бомбардировки и эскортирования авианосцев."
  ship_hull_heavy_1_desc: "$battleship_1_desc$"
  ship_hull_heavy_2_desc: "$battleship_2_desc$"
  ship_hull_heavy_3_desc: "$battleship_3_desc$"
  ship_hull_heavy_4_desc: "$battleship_4_desc$"

  carrier_1: "Экспериментальный авианосец"
  carrier_2: "Базовый авианосец"
  carrier_3: "Улучшенный авианосец"
  carrier_4: "Усовершенствованный авианосец"
  carrier_1_desc: "Первые авианосцы перестраивались из корпуса гражданских лайнеров или гидроавиатранспортов. Они имели узкие полетные палубы и небольшие ангары, однако на практике доказали способность эффективно применять авиацию в открытом море."
  carrier_2_desc: "Проекты 1930-х годов создавались для воздушной разведки и прикрытия флота. Их дальность хода и скорость были увеличены, чтобы они могли действовать в едином строю с быстроходными линейными силами."
  carrier_3_desc: "Крупномасштабные морские операции показали, что палубная авиация может решать исход сражений. Модернизированные авианосцы получили увеличенные авиагруппы и более совершенные катапульты."
  carrier_4_desc: "Тяжелые авианосцы позднего периода обладают бронированными полетными палубами, колоссальной авиагруппой и мощным зенитным вооружением из универсальных орудий, являясь главными капительными кораблями современного флота."
  ship_hull_carrier_conversion_ca_desc: "$carrier_1_desc$"
  ship_hull_carrier_1_desc: "$carrier_2_desc$"
  ship_hull_carrier_2_desc: "$carrier_3_desc$"
  ship_hull_carrier_3_desc: "$carrier_4_desc$"

  SH_battleship_1: "Сверхтяжёлый линкор"
  SH_battleship_2: "Усовершенствованный сверхтяжёлый линкор"
  SH_battleship_1_desc: "На пике Дредноутной гонки были созданы эти гиганты, намного превосходящие по размерам и огневой мощи любой другой корабль. Их постройка велась на пределе возможностей промышленности. Эти монстры вооружены 12–15 орудиями калибра 457 мм (18 дюймов) или выше, но из-за спешки при проектировании часто имели скрытые уязвимости в бронировании и проблемы с надежностью механизмов."
  SH_battleship_2_desc: "В этих проектах конструкторы отказались от высокой скорости в пользу максимального, беспрецедентного уровня броневой защиты. Оснащенные новейшими 406-мм или 457-мм орудиями, такие сверхтяжёлые линкоры способный выдержать попадания любых существующих снарядов."
  ship_hull_super_heavy_1_desc: "Проекты сверхтяжелых кораблей стали символом предельного военно-морского могущества. Обладая колоссальным водоизмещением, непробиваемой броней и орудиями калибра от 406 до 480 мм, эти корабли предназначены для полного господства в линейном бою."

  ship_hull_light_1: "Межвоенный легкий корпус"
  ship_hull_light_2: "Базовый легкий корпус"
  ship_hull_light_3: "Улучшенный легкий корпус"
  ship_hull_light_4: "Усовершенствованный легкий корпус"

  ship_hull_cruiser: "Корпус крейсера"
  ship_hull_cruiser_desc: "Основная задача крейсера — защита тяжелых кораблей от легких сил противника и нанесение мощных торпедных ударов по крупным судам."
  ship_hull_cruiser_1: "Межвоенный корпус крейсера"
  ship_hull_cruiser_2: "Базовый корпус крейсера"
  ship_hull_cruiser_3: "Улучшенный корпус крейсера"
  ship_hull_cruiser_4: "Усовершенствованный корпус крейсера"

  ship_hull_heavy: "Тяжелый корпус"
  ship_hull_heavy_desc: "Главный символ морского могущества. Эти огромные бронированные гиганты — линейные крейсеры и линкоры — остаются главной силой в океане, несмотря на растущую угрозу со стороны авиации и подводных лодок."
  ship_hull_heavy_1: "Межвоенный тяжелый корпус"
  ship_hull_heavy_2: "Базовый тяжелый корпус"
  ship_hull_heavy_3: "Улучшенный тяжелый корпус"
  ship_hull_heavy_4: "Усовершенствованный тяжелый корпус"

  ship_hull_heavy_modern: "Современный корпус линкора"
  modern_battleship: "$ship_hull_heavy_modern$"

  ship_hull_carrier: "Корпус авианосца"
  ship_hull_carrier_desc: "Основной корабль, способный нести мощную авиагруппу для ударов по флоту и побережью противника."
  ship_hull_carrier_conversion_bb: "Авианосец на базе линкора"
  ship_hull_carrier_conversion_bb_desc: "Первые тяжелые авианосцы, переоборудованные из недостроенных корпусов линкоров и линейных крейсеров. Сочетают хорошую броневую защиту с вместительными ангарами."
  ship_hull_carrier_conversion_ca: "Авианосец на базе крейсера"
  ship_hull_carrier_1: "Базовый корпус авианосца"
  ship_hull_carrier_2: "Улучшенный корпус авианосца"
  ship_hull_carrier_3: "Усовершенствованный корпус авианосца"

  ship_hull_carrier_modern: "Современный корпус авианосца"
  ship_hull_carrier_modern_desc: "Крупнейшие и самые совершенные авианосцы, использующие передовые технологии и оборудование."
  modern_carrier: "$ship_hull_carrier_modern$"
  modern_carrier_desc: "$ship_hull_carrier_modern_desc$"
  mega_carrier: "$ship_hull_mega_carrier$"
  mega_carrier_desc: "$ship_hull_mega_carrier_desc$"

  ship_hull_submarine: "Корпус подводной лодки"
  ship_hull_submarine_desc: "Современная подводная лодка способна скрытно уничтожать даже самые крупные корабли противника при относительно низкой стоимости постройки."
  ship_hull_submarine_1: "Межвоенный корпус подводной лодки"
  ship_hull_submarine_2: "Базовый корпус подводной лодки"
  ship_hull_submarine_3: "Улучшенный корпус подводной лодки"
  ship_hull_submarine_4: "Усовершенствованный корпус подводной лодки"

  ship_hull_pre_dreadnought: "Броненосец (Додредноут)"
  ship_hull_pre_dreadnought_desc: "Эскадренные броненосцы конца XIX — начала XX века. Имеют тяжелую броню из закаленной стали, артиллерию главного калибра в барбетах или башнях и развитую батарею среднего калибра."
  armoured_cruiser: "$ship_hull_armoured_cruiser$"
  armoured_cruiser_desc: "$ship_hull_armoured_cruiser_desc$"
  ship_hull_armoured_cruiser: "Броненосный крейсер"
  ship_hull_armoured_cruiser_desc: "Предшественники линейных крейсеров, созданные для борьбы с легкими кораблями и торговли. Имеют мощную артиллерию и бортовую броню, но уступают в скорости более современным легким крейсерам."
  ship_hull_cruiser_coastal_defense_ship: "Корабль береговой обороны"
  ship_hull_cruiser_coastal_defense_ship_desc: "Небольшие корабли размером с крейсер, пожертвовавшие скоростью и дальностью хода ради мощной брони и тяжелых орудий. Идеально подходят для стран с ограниченным бюджетом для защиты своих прибрежных вод."
  ship_hull_torpedo_cruiser: "Торпедный крейсер"
  ship_hull_torpedo_cruiser_desc: "Корабли, созданные в рамках концепции «Молодой школы» (Jeune École), согласно которой легкие корабли с торпедами могут дешево нейтрализовать вражеские линкоры. Современные торпедные крейсеры несут огромный запас торпед для массированных атак."
  ship_hull_super_heavy_1: "Сверхтяжелый линкор"
  ship_hull_cruiser_submarine: "Крейсерская подводная лодка"
  ship_hull_cruiser_submarine_desc: "Крупные подводные лодки с увеличенной дальностью плавания и артиллерийским вооружением, предназначенные для длительных одиночных рейдов против судоходства."
  ship_hull_midget_submarine: "Сверхмалая подводная лодка"
  ship_hull_midget_submarine_desc: "Малогабаритная субмарина с небольшим экипажем. Ограниченная дальность и вооружение компенсируются низкой стоимостью и высокими темпами производства."
  ship_hull_fleet_submarine: "Эскадренная подводная лодка"
  ship_hull_fleet_submarine_desc: "Быстроходные субмарины с большой дальностью хода, способные действовать совместно с основными силами надводного флота."
  ship_hull_nuclear_submarine: "Атомная подводная лодка"
  ship_hull_nuclear_submarine_desc: "Благодаря ядерному реактору эти субмарины способны месяцами находиться под водой и развивать огромную скорость, являясь смертоносным оружием."
  ship_hull_mega_carrier: "Ледяной авианосец (Проект «Хаббакук»)"
  ship_hull_mega_carrier_desc: "Гигантский авианосец из пайкерита (смеси изо льда и древесных опилок), позволяющий базироваться тяжелым планерным и бомбардировочным самолетам."

  screen_ship: "Экраны (Корабли охранения)"
  capital_ship: "Тяжелые корабли (Капитальные)"