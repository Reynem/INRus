 battle_cruiser_1: "Межвоенный боевой круизер"
 battle_cruiser_2: "Улучшенный боевой круиз"
 #battle_cruiser_3: "Улучшенный боевой круиз"
 #battle_cruiser_4: "Усовершенствованный боевой круизер"
 battle_cruiser_1_desc: "В годы, последовавшие сразу же после Велткрига, великие военно-морские державы начали проектировать новое поколение все более мощных боевых кораблей, в которых боевики должны были играть роль «быстрых боевых кораблей»."
 battle_cruiser_2_desc: "После первоначальной волны заказов круизеров по всему миру была тщательно проверена конструкция на предмет улучшения потенциала. Были внедрены более совершенные рейнджеры, усовершенствованы тройные бочки для снижения веса и улучшения бронежилетов, и было создано дополнительное пространство для добавления поплавковых плоскостей для повышения способности судна к разведке. Это новое поколение проектов широко принято в различных странах, где вторая военно-морская гонка начала разрушать национальные бюджеты."
 #battle_cruiser_3_desc: "Прогресс в проектировании боевых круизеров был достигнут с переоценкой роли этих кораблей и с корректировкой траектории предыдущих событий. В то время как они сохранили посредственные брони своих предшественников, эти корабли изменили курс на пути своих пушек, как правило, двигаясь к сокращению диаметра бочков в пользу стволовых конструкций с повышенной скоростью. Большинство из них вооружены шестью главными пушками в двух или тройных турнях, и большинство из них составляют 11-12 дюймов или эквивалентные."
 #battle_cruiser_4_desc: "Эволюция боевого круизера к середине 40-х годов достигла своего апогея: корабли со скоростью до крейсеров, но огневой мощью, чтобы угрожать настоящим столкновенным военным кораблям достаточно, чтобы удерживать их на пальцах ног. Хотя огневая мощь судов менее полезна с ростом перевозчика, они нашли большое применение в береговых бомбардировках и эскортировании. Функционально значительно увеличенные крейсеры с гораздо более тяжелыми бронежилетами и пушками, большинство из этих кораблей вооружены шесть-девятью основными ружьями с чрезвычайно высокими скоростными конструкциями, что позволяет им проникать в бронежилеты и иметь дальность для боевых кораблей с достоинством, работая также в качестве эффективного одного рейдера автоколоннны, который более чем в состоянии справиться с эскортирующими разрушителями и зажигательными крейсерами."

 battleship_1: "Военное боевое судно"
 battleship_2: "Базовое боевое судно"
 battleship_3: "Улучшенное боевое состояние"
 battleship_4: "Усовершенствованный боевой корабль"
 battleship_1_desc: "Эти классы представляют собой самый высокий уровень военно-морского развития, существовавший до начала этого конфликта. Они были военными кораблями, возглавляющими флот войны, и остаются очень мощными в течение длительного времени после ее окончания. Хотя они значительно быстрее, чем Дрэдньютс до них, их наиболее заметная отличительная особенность - это их экспансионизированное вооружение - они несут от восьми до десяти главных пушек, большинство из которых находятся в двух башенах, но несколько - в новых тройных башенах. Их разрушительная огневая мощь и тяжелые бронежилеты гарантировали, что они будут находиться в центре их боевого флота в Велткриге, но эти дальнейшие достижения были быстро подталкиваются к росту цен. Даже больше, чем военные корабли перед ними требовали огромных инвестиций, хотя они были лишь тенью того, что должно было произойти."
 battleship_2_desc: "Конец «Дредноуглубленной гонки» привел к значительному прекращению крупномасштабного морского строительства, а финансирование военно-морского флота, которое возросло до огромных уровней в период до 1925 года, наконец рухнуло. «Великие державы» провели следующее десятилетие медленно заканчивая уже строящимися кораблями, сосредотачивая свое внимание на небольших кораблях, которые легче проскользнуть по военно-морским бюджетам. До начала 30-х годов великие державы начали экспериментировать с быстрым проектированием кораблей. Эти конструкции гораздо более современные, с улучшенными дистанциями, мощными нефтяными двигателями и 16-18 дюймовыми ружьями, но в целом являются итеративными, сосредоточиваясь больше на доставке мощного судна по лучшей цене, чем на радикальном улучшении по сравнению с их предшественниками."
 battleship_3_desc: "С учетом того, что второй вельткриг находится на горизонте, а международная напряженность как никогда высока, дизайнеры стремятся построить новое поколение кораблей для ведения боевых действий в ходе предстоящей войны, в то время как некоторые страны передислоцировали свои военно-морские надежды на перевозчиков, другие по-прежнему настаивают на том, что перевозчик может выполнять лишь дополнительную роль, а не подменять главную роль боевого корабля в борьбе с капиталом."
 battleship_4_desc: "В конце второго Велткрига великие державы начали понимать: военно-морские военно-воздушные силы одержали победу над всеми военно-воздушными кораблями, однако некоторые страны продолжают развивать боевые корабли, поскольку они являются платформами для бомбардировок на берегу, престижными проектами и поддержкой перевозчиков в составе флота или даже пытаются повысить свою старую роль. Некоторые конструкторы загружают свои боевые корабли зенитными батареями, чтобы повысить шансы на выживание. Хотя многие из этих боевых кораблей могут продолжать функционировать в течение многих лет, некоторые страны уже считают их устаревшими."
 ship_hull_heavy_1_desc: "$battleship_1_desc$"
 ship_hull_heavy_2_desc: "$battleship_2_desc$"
 ship_hull_heavy_3_desc: "$battleship_3_desc$"
 ship_hull_heavy_4_desc: "$battleship_4_desc$"

 carrier_1: "Экспериментальный перевозчик"
 carrier_2: "Основной перевозчик"
 carrier_3: "Усовершенствованный перевозчик"
 carrier_4: "Усовершенствованный перевозчик"
 carrier_1_desc: "Узнав об опыте использования тендеров на морские самолеты, мореплаватели, располагающие для этого ресурсами, приступили к работе над следующим поколением судов, которые могут перевозить воздушные суда в море. В отличие от своих предшественников, эти перевозчики проектируются с палубами, позволяющими самолетам как вылетать с них, так и возвращаться и приземляться на них. Преобразованные с гражданских судов и тендеров на морские самолеты, большинство из этих судов ограничены относительно узкими палубами и ангарами, но они, безусловно, демонстрируют, что суда способны эффективно управлять воздушными добавками на море."
 carrier_2_desc: "Разработанные в 30-х годах, эти корабли предназначены для воздушной разведки и освещения флотов, в первую очередь «обычных» военных кораблей. Их дальность значительно увеличена, и были приложены усилия, чтобы сделать их достаточно быстрыми, чтобы успевать за флотами, функционирующими на полной скорости в открытом океане."
 carrier_3_desc: "В то время как крупные военно-морские боевые операции в эпоху военно-морской авиации продемонстрировали способность летательных аппаратов серьезно влиять на боевые действия на море, многие державы оказались отстающими в развитии своих перевозчиков."
 carrier_4_desc: "Продолжающаяся разработка конструкции перевозчиков привела к созданию гораздо более крупных моделей, и эти суда приближаются к размерам первых авианосцев, в то время как в них учитываются все усовершенствования конструкции, произведенные в последующие годы. Большинство из них обладают значительной бронезащитой и удушающей огневой мощью АА, будучи при этом высоко механически надежными, однако они отказались от концепции вторичного оружия большого калибра в обмен на более мелкие ружья двойного назначения."
 ship_hull_carrier_conversion_ca_desc: "$carrier_1_desc$"
 ship_hull_carrier_1_desc: "$carrier_2_desc$"
 ship_hull_carrier_2_desc: "$carrier_3_desc$"
 ship_hull_carrier_3_desc: "$carrier_4_desc$"

 SH_battleship_1: "Ужасно"
 SH_battleship_2: "Усовершенствованный Dreadnouted"
 SH_battleship_1_desc: "По мере того, как «Ужасная раса» достигла своего роста, были зачаты эти настоящие монстры, гораздо больше по размеру и огневой мощи, чем что-либо другое, их стоимость ошеломляет, и немногие страны могут позволить себе даже подумать о строительстве. Тем не менее, те, кто обладает действительно мощным оружием военно-морского господства. Даже больше, чем предшествовавшее им поколение, боялись, что они будут страдать от условий своего зачатия. Разрушенные проектные работы, последние минуты и самодельные работы во время строительства, нехватка огромных ресурсов, огромное давление на то, чтобы ускорить строительство, а также простое количество и сложность их массивных механизмов привели к ошибкам в проектировании и уязвимости под их огромными бронежилетами. Эти конструкции оснащены 12-15 18 дюймов или эквивалентными основными пушками."
 SH_battleship_2_desc: "После того, как вспыхнула освежающая гонка, конструкторы военно-морского флота проанализировали положение страшных интриг при будущем планировании. Сбросив скорость в качестве главной цели, при том понимании, что новое поколение так называемых "быстрых" кораблей возьмет на себя эту задачу, эти проекты вместо этого фокусируются на экстремальной, беспрецедентной, бронебойной защите. Усовершенствованные 16 дюймовые пушки могут быть равно бронебойному проникновению 18 дюймов, но при этом они будут менее дорогими."
 ship_hull_super_heavy_1_desc: "Быстрое увеличение объема ресурсов, выделяемых на военно-морское строительство после окончания крупного земельного конфликта во время Велткрига, первоначально породило эти проекты, которые были связаны с началом тенденции к внезапному росту размеров, огневой мощи, бронежилетов, калибра и, конечно, стоимости. Эти суда поставили ведущие военно-морские силы мира, помимо просто притворных, на величие, но у них есть свои проблемы; их быстрое развитие и поспешное строительство привели к ошибкам в конструкции и хроническим механическим проблемам. Эти конструкции вооружены от 8 до 10 дюймов или эквивалентными им основными пушками, и они имеют защиту для того, чтобы идти ногами к ногам с аналогичными вооруженными кораблями. По мере того, как Древническая раса достигла своего роста, эти настоящие монстры были задуманы. Гораздо больше по размеру и огневой мощи, чем что было до них, их стоимость ошеломляет, и немногие страны могут даже позволить себе рассмотреть вопрос о строительстве таких кораблей."

 ship_hull_light_1: "Межвоенный легкий корабль"
 ship_hull_light_2: "Базовый легкий корабль"
 ship_hull_light_3: "Усовершенствованные легкие суда"
 ship_hull_light_4: "Усовершенствованный лёгкий корабль"

 ship_hull_cruiser: "Крузер"
 ship_hull_cruiser_desc: "Первостепенная задача судна — защитить капиталистые корабли от вражеских легких кораблей, но он также может высвободить мощные торпеды, которые могут навредить более крупным кораблям."
 ship_hull_cruiser_1: "Межвоенный круизер"
 ship_hull_cruiser_2: "Базовый круизер"
 ship_hull_cruiser_3: "Усовершенствованный крузер"
 ship_hull_cruiser_4: "Усовершенствованный круизер"

 ship_hull_heavy: "Тяжелый корабль"
 ship_hull_heavy_desc: "Конечный символ военно-морской мощи, эти огромные бронированные бехаисты, такие, как боевые круизеры, боевые корабли или даже Dreadnoughts, по-прежнему пользуются уважением в открытом море, даже когда некоторые эксперты сомневаются в их роли в возрасте самолета и подводной лодки."
 ship_hull_heavy_1: "Межвоенный тяжелый корабль"
 ship_hull_heavy_2: "Базовое тяжелое судно"
 ship_hull_heavy_3: "Усовершенствованные тяжелые суда"
 ship_hull_heavy_4: "Усовершенствованный тяжелый корабль"

 ship_hull_heavy_modern: "Современный боевой корабль"
 modern_battleship: "$ship_hull_heavy_modern$"

 ship_hull_carrier: "Перевозчик"
 ship_hull_carrier_desc: "Капитальный корабль, способный нести крылья мощного летательного аппарата в бою, также полезен в качестве плавающего аэродрома, который вы можете разместить у побережья вашего врага."
 ship_hull_carrier_conversion_bb: "Преобразованный боевой корабль"
 ship_hull_carrier_conversion_bb_desc: "Первые крупные авианосцы, эти суда построены главным образом на корпусах, которые первоначально предназначались для военных кораблей, но по различным причинам были переоборудованы и построены в качестве перевозчиков. Лишь несколько мореплавателей построили такие корабли, и их конструкция существенно различалась; их авиационная мощность колебалась от низких до более чем ста. Однако существуют постоянные, такие, как тяжёлые бронетранспортеры и другие военные объекты. Полуэкспериментальные и ненадежные, они по-прежнему являются невероятно мощным оружием и заложили основы для последующих поколений авианосцев."
 ship_hull_carrier_conversion_ca: "Преобразованный круизер"
 ship_hull_carrier_1: "Основной перевозчик"
 ship_hull_carrier_2: "Усовершенствованный перевозчик"
 ship_hull_carrier_3: "Усовершенствованный перевозчик"

 ship_hull_carrier_modern: "Современный перевозчик"
 ship_hull_carrier_modern_desc: "Крупнейшие и самые передовые авианосцы, способные использовать новейшие технологии, оборудование и приспособления."
 modern_carrier: "$ship_hull_carrier_modern$"
