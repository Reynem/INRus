 rocket_submarine: "Ракетная подводная лодка"
 rocket_submarine_desc: "Новое поколение подводных лодок, оснащенных ракетами и ракетными системами, которые дают нам возможность неожиданно нанести удар по нашим врагам по стратегическим целям"

 nuclear_submarine: "$ship_hull_nuclear_submarine$"
 nuclear_submarine_desc: "$ship_hull_nuclear_submarine_desc$"

 nuclear_missile_submarine: "Подводные лодки с ядерными ракетами"
 nuclear_missile_submarine_desc: "Подводные лодки, способные нести и запускать ядерные ракеты против наших целей."

 submarine_1_desc: "Первые подводные военные корабли, фактически способные к эффективным боевым действиям, представляют собой значительные усовершенствования по сравнению с их предшественниками. С дизельными электродвигателями, заменяющими в основном бензиновые электродвигатели первых подводных лодок, они значительно улучшили дальность и скорость движения поверхности по сравнению с их предшественниками. В бою с вражескими военными кораблями они действуют главным образом как подводные лёгкие торпедные лодки, но им не хватает скорости или выносливости, чтобы оставаться под водой в течение более, чем относительно коротких периодов времени. Это подводные лодки, которые использовались крупными военно-морскими державами во время Велткрига."
 submarine_2_desc: "Эволюция предыдущих проектов подводных лодок, некоторые из этих военных кораблей выдвинули идеи «крузерных» подводных лодок еще больше, с большим оружием и большим акцентом на поверхностные способности, в то время как другие смотрят в другом направлении, стремясь увеличить подводные мощности и производительность."
 submarine_3_desc: "Успехи, достигнутые в ходе некоторых предыдущих проектных работ по расширению подводных дальностей, скорости и общих возможностей, привели к тому, что разработка подводных лодок была перенесена с «крузерных» типов на суда с уделением повышенного внимания подводным потенциалам. Эти подводные лодки значительно усовершенствованы по сравнению с более ранними типами, они несут мощную нагрузку торпед и представляют собой законную угрозу почти для всех поверхностных судов. Однако их продолжительность, дальность и скорость погружения подводных лодок все еще ограничены, и они остаются уязвимыми при их погрузке, особенно для воздушных судов."
 submarine_4_desc: "При значительно возросшей мощности батарей, передовых системах освежения воздуха, пока еще погруженного в воду, и общей усовершенствованной конструкции, это первые подводные лодки, предназначенные для того, чтобы оставаться затопленными в течение большей части своего времени в море, как таковые, они знаменуют собой массовый сдвиг в военно-морских боях и восхождение подводных лодок к подлинному террору. Такие военные корабли дают возможность доминировать над океанами тем странам, которые их развили и развернули."
 ship_hull_submarine_1_desc: "$submarine_1_desc$"
 ship_hull_submarine_2_desc: "$submarine_2_desc$"
 ship_hull_submarine_3_desc: "$submarine_3_desc$"
 ship_hull_submarine_4_desc: "$submarine_4_desc$"

 destroyer_1: "Межвоенный разрушитель"
 destroyer_2: "Основной разрушитель"
 destroyer_3: "Улучшенный разрушитель"
 destroyer_4: "Усовершенствованный разрушитель"
 destroyer_1_desc: "Велткриг вызвал новый спрос на эсминцы - они не только должны были защищать свои флоты, но и были растягиваются, чтобы защитить судоходные линии Энтент. Для удовлетворения этой потребности были усовершенствованы конструкции эсминцев, которые вошли в массовое производство, чтобы не отставать от спроса. Корабли этой эпохи, как правило, составляют 1000 тонн, и путешествуют с максимальной скоростью 34 узла, но при этом несут больше пар торпед, чем их предки."
 destroyer_2_desc: "К 1935 году, когда появились все более мощные новые летательные аппараты, а также несколько морских флотов, развертывающих больше перевозчиков, в то время как все еще существовали некоторые сомнения относительно того, насколько полезными будут перевозчики в условиях открытой войны, возрастала озабоченность по поводу потенциальной угрозы, которую самолеты могут представлять для военных кораблей."
 destroyer_3_desc: "С началом Второй Велткриг Мировые мореплаватели нуждались в дешевых зенитных платформах. Успех боевых действий показал миру, что они подходят не только для разведки и борьбы с карьерами, но и для ведения современных боевых действий. Усовершенствованные технологии борьбы с подводными лодками также играют важную роль в борьбе с серьезной угрозой для операций автоколоннн, они и зенитные платформы стали требовать большего числа эсминцев. В то время как ранее уничтожители сокращались в пользу круизеров и новых боевых круизеров, эсминцы начали возвращаться на передний план как в качестве важной части флота, так и в качестве системы автоколонннн. Часто не больше, чем их предшественники, они являются гораздо более технологически развитыми, в основном переходя на смывные палубы и значительно более крупные торпедные вооружения."
 destroyer_4_desc: "В конце Второй Велткриг моряки мира были вынуждены приспособиться к новым подводным лодкам, которые могут оставаться под водой в течение почти неопределенного периода времени, перевозчикам, загруженным самолетами, которые более чем способны уничтожить капитальные суда, с большими крейсерами, которые быстро становятся неактуальными перед лицом перевозчиков и подводных лодок. Будущая роль эскорта для флота перемещается почти исключительно разрушителями в умах большинства военно-морских теоретиков с двойной целью быстрого обстрела турниров, уничтожающих любые самолеты, которые осмеливаются пересечь ее путь, пытаясь погрузить ее в бомбу. Кроме того, было увеличено перемещение этих судов, часто приближающееся к 3000 тоннам по мере того, как конструкторы загружают их все большим и большим количеством противовоздушных вооружений, а также более первичным оружием."
