 ship_hull_submarine: "Подводные лодки"
 ship_hull_submarine_desc: "Вдали от грубейших лодок Великой войны, современная подводная лодка как никогда способна угрожать даже самому большому судну за очень умеренную цену."
 ship_hull_submarine_1: "Межвоенная подводная лодка"
 ship_hull_submarine_2: "Базовая подводная лодка"
 ship_hull_submarine_3: "Усовершенствованные подводные лодки"
 ship_hull_submarine_4: "Усовершенствованная подводная лодка"

 ship_hull_pre_dreadnought: "Предварительная закупка"
 ship_hull_pre_dreadnought_desc: "Вслед за дизайном британского мажестского класса в конце 1890-х годов, преддушные боевые корабли заменили железные боевые корабли 1870-х и 1880-х годов, построенные из стали и защищенные затвердевшими стальными бронежилетами, передденные боевые корабли несут главную аккумуляторную батарею с очень тяжелыми ружьями в барбетах, поддерживаемых одним или несколькими вторичными батареями более легкого оружия."
 armoured_cruiser: "$ship_hull_armoured_cruiser$"
 armoured_cruiser_desc: "$ship_hull_armoured_cruiser_desc$"
 ship_hull_armoured_cruiser: "Бронированный крузер"
 ship_hull_armoured_cruiser_desc: "В годы, последовавшие сразу же после Велткрига, великие военно-морские державы начали проектировать новое поколение все более мощных боевых кораблей, в которых боевики должны были играть роль «быстрых боевых кораблей». Их проект был задуман как промежуточный класс, с пушками и дальностью для борьбы со старыми кораблями на своих собственных условиях, а также скорость, чтобы бегать по более легким крейсерам и убегать от более современных круизных кораблей, в которых они не имеют шансов побить себя. В первых же попытках немецкие инженеры сделали почти невозможными и сумели связать почти боевое вооружение с корпусом крейсера. В результате корабль, который также является дорогостоящим, сравнительно медленным и относительно слабым бронированным, эти корабли, принятые многими странами в качестве новых «бронированных круизеров», являются самыми тяжёлыми судами, которые когда-либо видели в мире."
 ship_hull_cruiser_coastal_defense_ship: "Корабль береговой обороны"
 ship_hull_cruiser_coastal_defense_ship_desc: "Корабли береговой обороны являются небольшими, часто размером с крейсеры, которые пожертвовали скоростью и дальностью для бронетехники и вооружения, как правило, привлекательными для государств, которые либо не могут позволить себе полномасштабные боевые корабли, либо могут быть удовлетворены специально разработанными мелкокорпусными судами, способными осуществлять морские операции вблизи своего побережья."
 ship_hull_torpedo_cruiser: "Торпедо Крузер"
 ship_hull_torpedo_cruiser_desc: "В соответствии с доктриной Jeune Ecole ( &quot; Молодая школа &quot; ), согласно которой небольшие военные корабли, вооруженные торпедами, могут эффективно и дешево победить гораздо более крупные боевые корабли, эти крейсеры в основном вооружены торпедами. Большинство торпедных крейсеров упали в 1890-х годах в пользу большинства мореплавателей, хотя многие другие мореплаватели продолжали приобретать их в начале 1900-х годов. Современные крейсеры торпеды предназначены для использования торпед, которые подводные лодки не могут нести."
 ship_hull_super_heavy_1: "Ужасно"
 ship_hull_cruiser_submarine: "Подводные лодки"
 ship_hull_cruiser_submarine_desc: "Существенно больше, чем предыдущие подводные лодки, эти конструкции относятся к типу «крузеров», предназначенные для дальней независимой операции при торговом налете и предназначенные для того, чтобы лучше подготовиться к бою с вражескими легкими военными кораблями, когда они будут всплывать."
 ship_hull_midget_submarine: "Подводная лодка"
 ship_hull_midget_submarine_desc: "Малоразмерная подводная лодка, эксплуатируемая небольшим экипажем, сужающаяся дальность и оружейная мощность которой компенсируются высокими темпами производства."
 ship_hull_fleet_submarine: "Подводная лодка флота"
 ship_hull_fleet_submarine_desc: "Подводные лодки, которые благодаря своему длительному рабочему диапазону могут функционировать в качестве эскорта и поддержки наземного флота."
 ship_hull_nuclear_submarine: "Ядерная подводная лодка"
 ship_hull_nuclear_submarine_desc: "С ядерными реакторами наши подводные лодки могут работать очень долго под водой, сохраняя при этом высокую скорость, что делает их чрезвычайно смертоносным инструментом в нашем арсенале."
 ship_hull_mega_carrier: "Ледяной транспортер"
 ship_hull_mega_carrier_desc: "Гигантический носитель, созданный из экспериментальных композитов льда, таких как Pykrete, который позволяет обычным самолетам работать из него, увеличивая диапазон нашей военно-морской авиации."

 screen_ship: "Скринсы"
 capital_ship: "Капитальные суда"
