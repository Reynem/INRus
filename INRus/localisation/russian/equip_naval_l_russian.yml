 ship_hull_light_4_desc: "$destroyer_4_desc$"

 light_cruiser_1: "Межвоенный легкий круизер"
 light_cruiser_2: "Основной световой круизер"
 light_cruiser_3: "Усовершенствованный легкий крузер"
 light_cruiser_4: "Усовершенствованный легкий круизер"

 torpedo_cruiser: "$ship_hull_torpedo_cruiser$"
 torpedo_cruiser_desc: "$ship_hull_torpedo_cruiser_desc$"

 light_cruiser_1_desc: "Более качественные бронежилеты и разработка паровых турбин привели к росту легкого бронированного крейсера, более быстрого и более защищенного, чем защищенные крейсеры, эти конструкции заменили их в 1910-х годах, хотя они были более легкими и меньшими по сравнению с другими современными кораблями, они все еще являются настоящими крейсерами, сохраняя расширенный радиус действия и самодостаточность, чтобы действовать независимо по всему миру."
 light_cruiser_2_desc: "В межвоенный период появились усовершенствования более крупных крейсеров со времен «Дредноуглубленной гонки». Поскольку политика и финансы по-прежнему сдерживают многие военно-морские державы, производимые конструкции лишь незначительно больше по размеру по сравнению с предыдущим поколением, вместо этого наблюдались улучшения в огневой мощи за счет использования более крупных ружей или все более широкого внедрения тройных турниров и четырехкратных торпедных труб. Растущее значение авиации в военно-морской войне также привело к введению высоковольтных двухцелевых гор, дополняемых растущим набором автоканнонов."
 light_cruiser_3_desc: "Благодаря увеличению объема имеющихся средств новые крейсеры, построенные в конце межвоенного периода и в начале второго вольткрига, вновь несколько возросли по размеру, хотя уровень первичного вооружения вновь остался неизменным, за редкими исключениями, их огневая мощь была еще больше увеличена за счет добавления дополнительных турниров или увеличения количества пушек в каждой из турниров. Вторичные вооружения были модернизированы с помощью еще одного двух видов оружия двойного назначения и еще более специализированного зенитного оружия, часто связанного с улучшением противопожарного контроля. Это поколение также видит все более широкое внедрение радиолокационных систем на крейсерах."
 light_cruiser_4_desc: "Крейсеры запоздалого и раннего послевоенного периода по-прежнему аналогичны тем, которые были усвоены в ходе ранней войны, и одновременно учитывают многочисленные уроки, извлеченные на протяжении всей войны."

 heavy_cruiser_1: "Межвоенный тяжелый круизер"
 heavy_cruiser_2: "Основной тяжелый круизер"
 heavy_cruiser_3: "Усовершенствованный тяжелый крузер"
 heavy_cruiser_4: "Усовершенствованный тяжелый крузер"
 heavy_cruiser_1_desc: "Более качественные бронежилеты и разработка паровых турбин привели к росту легких бронированных крейсеров."
 heavy_cruiser_2_desc: "В межвоенный период появились усовершенствования более крупных крейсеров со времен «Дредноуглубленной гонки». Поскольку политика и финансы по-прежнему сдерживают многие военно-морские державы, производимые конструкции лишь незначительно больше по размеру по сравнению с предыдущим поколением, вместо этого наблюдались улучшения в огневой мощи за счет использования более крупных ружей или все более широкого внедрения тройных турниров и четырехкратных торпедных труб. Растущее значение авиации в военно-морской войне также привело к введению высоковольтных двухцелевых гор, дополняемых растущим набором автоканнонов."
 heavy_cruiser_3_desc: "Благодаря увеличению объема имеющихся средств новые крейсеры, построенные в конце межвоенного периода и в начале второго вольткрига, вновь несколько возросли по размеру, хотя уровень первичного вооружения вновь остался неизменным, за редкими исключениями, их огневая мощь была еще больше увеличена за счет добавления дополнительных турниров или увеличения количества пушек в каждой из турниров. Вторичные вооружения были модернизированы с помощью еще одного двух видов оружия двойного назначения и еще более специализированного зенитного оружия, часто связанного с улучшением противопожарного контроля. Это поколение также видит все более широкое внедрение радиолокационных систем на крейсерах."
