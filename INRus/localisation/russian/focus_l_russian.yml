 continuous_naval_production: "Строительство кораблей"
 continuous_naval_production_desc: "Сосредоточив ресурсы на верфях и освободив квалифицированных кораблестроителей от военной службы, мы сможем значительно сократить время постройки кораблей."
 continuous_air_production: "Производство самолетов"
 continuous_air_production_desc: "Мы можем реорганизовать авиационную промышленность, чтобы устранить издержки и оптимизировать производство."
 continuous_non_factory_construct: "Капитальное строительство"
 continuous_non_factory_construct_desc: "Наша строительная отрасль имеет неиспользованный потенциал. Уделив ей внимание, мы сможем значительно повысить скорость строительства. К сожалению, производство станков стало слабым местом расширения тяжелой промышленности, поэтому усилия в этой сфере не дадут результатов."
 continuous_reduce_training_time: "Подготовка армии"
 continuous_reduce_training_time_desc: "Создав специальные подразделения повышенной подготовки в каждой дивизии, мы сможем отправлять на фронт даже те дивизии, которые ранее задерживались для завершения обучения."
 continuous_suppression: "Подавление сопротивления"
 continuous_suppression_desc: "Внедрившись в крупные группы сопротивления на оккупированных территориях и переманив их лидеров, мы снизим масштаб уронa, который они наносят."
 continuous_repair: "Ремонт сооружений"
 continuous_repair_desc: "Мы сформируем специализированные ремонтные бригады из рабочих фабрик и строителей, централизованно управляя их переброской для ускоренного восстановления поврежденной инфраструктуры."
 continuous_tech_share: "Обмен технологиями"
 continuous_tech_share_desc: "Мы стимулируем наши научно-исследовательские институты и университеты к сотрудничеству с коллегами из союзных стран, что даст бонус к обмену технологиями."
