 vanguardist_subtype_desc: "Национальный коллективизм - это термин, используемый для описания коллекции теорий и концепций, созданных Вячеславом Молотовым на основе инициативы Гамбургской коммуны. Национальное собрание подчеркивает развитие социализма в государстве. Национальные коллективисты строят и осуществляют свою политическую базу вдоль Ленинистских линий, создавая революционное авангардное государство, которое в конечном счете достигает коммунистического общества. Однако большая часть власти в национальном коллективизме централизована вокруг сильного государства и его лидера. В силу своего тоталитарного характера политическое насилие используется либерально для очищения контрреволюционных элементов. Сельское хозяйство часто обобщается в массовом и промышленном планировании. Несмотря на это, национальный коллективизм широко распространен и рассматривает себя в качестве истинного преемника ленинистской мысли, полностью отделяя себя от либертарианского мышления, сохраняя при этом подозрительное отношение к основному ленинисистскому социализму."

 collectivist_subtype_desc: "Ленинистский социализм, созданный после русской революции, является основной социалистической идеологией. Ленинистский социализм, названный после толкований Карла Маркса революционным Владимиром Ленином, придерживается создания революционного авангарда и диктатуры пролетариата посредством классовой борьбы и насильственного свержения капиталистического государства. Конечная цель социализма заключается в том, чтобы государственные функции увянули и в конечном итоге трансформировали общество в марксистское коммунистическое общество. Ленинистическая социалистическая политическая система построена вокруг единого партийного государства, управляемого революционной рабочей партией, которая придерживается сверху внизу подхода к управлению, известного как демократический централизм, в то время как экономическая система зависит от контролируемых работниками региональных и муниципальных советов, известных как совиты. Интернационалист в тоне, ленинисистский социализм часто экспортируется по всему миру своими приверженцами и в значительной степени подкрепляется Ленинистским Союзом Советских Социалистических Республик."
 syndicalist_subtype_desc: "Несмотря на то, что синдикализм разделен между различными течениями, некоторые из них под влиянием других идеологий, таких, как марксизм и анархиз, ортодоксальный синдикалистизм основан на трудах лидеров Конфедерации трудящихся, кодифицированных в Хартии Амьенов 1906 года, и считает, что Михаил Бакин и Пьер-Джозеф Проудхон являются ее предшественниками. &quot; Синдикализм &quot; определяется концепциями революционной спонтанности и прямых действий, т.е. убежденностью в том, что сами трудящиеся, организованные в профсоюзах, должны бороться с капитализмом, а не полагаться на внешних агентов, таких как политическая партия. &quot; Преобразование &quot; капиталистического общества &quot; в &quot; синдикалистское &quot; общество &quot; должно происходить через посредство общего забастовки - общенационального неприятия капитализма и передачи всех средств производства профсоюзам. &quot; Синдикалистские штаты &quot; децентрализованы &quot; , все отрасли организованыся в синдиканы, советы труда, избранныеи из этих профсоюзов руководяты, а центральное правительство страны - в рамках национального профсоюза."

 libertarian_socialist_subtype_desc: "Либертарианство представляет собой широкий спектр социалистических доктрин, которые выступают против левого коммунизма, коммунизма, анархо-синдикализма и анархо-коммунизма и не поддерживают строго принципы марксизма или коммунизма."
 monsoc_subtype_desc: "§Y(Monarcho-Socialism) §!n nnMonarcho-Socialism стремится последовательно смешать обычно противостоящие системы социализма и монархизма в единую, единую форму правления. Хотя степень, в которой каждый монарх посвящен социалистической системе, может существенно различаться: от простых фигурных голов, нарисованных красным, до монархов, полностью преданных социалистическому делу, каждая система объединяет благородную систему монархического правления, и хотя этот монарх часто является лишь фасадом более традиционного социалистического правительства, их присутствие является ключом к более широкой системе. При этих монархиях путь к истинному социализму протекает, и хотя каждая система невероятно разнообразна, они обычно имеют общий более консервативный или традиционный взгляд на социальные и общественные вопросы."

 social_democrat_subtype_desc: "Социальная демократия - это идеология, цель которой состоит в реформировании капитализма и гуманизации его посредством приведения его в соответствие с этическими идеалами социального обеспечения при сохранении капиталистического способа производства, а не в создании альтернативной социалистической экономической системы."
 social_liberal_subtype_desc: "Социальный либерализм является одним из изменений в основном рыночном либерализме, главным отличием которого является включение различных гражданских свобод в качестве основных прав человека."

 market_liberal_subtype_desc: "Рыночные либералы считают себя основной либеральной идеологией. Основными арендаторами рыночного либерализма являются нерегулируемый свободный рынок и либеральная демократическая политическая система. Рыночные либералы считают, что чем свободнее рынок, тем свободнее народ, и они будут решительно защищать политические и экономические права личности."

 social_conservative_subtype_desc: "Консерватизм - это политическая идеология, которая может сильно варьироваться в зависимости от политической истории региона или нации, но, тем не менее, она обычно сосредоточена на сохранении традиционных убеждений, взглядов и философии, а также традиционной динамики власти общества при использовании демократической системы, противоречащей как радикальным, так и умеренным изменениям статус-кво, консерваторы хотят поддерживать в обществе порядок и стабильность."

 authoritarian_democrat_subtype_desc: "Авторитарная демократия - это идеология, сочетающая сильную исполнительную власть с представительным парламентом и частично демократической политической системой. Авторитарно-демократические режимы часто занимают консервативную позицию по социальным вопросам, отдают предпочтение централизации и, как правило, имеют гокишские чувства в правительстве; хотя изоляционистские ветви этой идеологии не являются незамеченными. Цель этих режимов заключается в поддержании национальной стабильности и обеспечении народа как народным, так и ответственным правительством."

 paternal_autocrat_subtype_desc: "Отцовская аутократия, как правило, относится к патерналистской норме формального автократа, диктатора или монарха, который, как правило, действует с помощью и совета советников, друзей или даже членов семьи этой фигуры в олигархии, более формальной и видимой в то время олигархии либеральной, социалистической и иной авторитарной идеологии. Лидер, как правило, правит с отсутствием институциональных ограничений, таких, как закон или конституция, при сохранении различных классов и соперничающей элиты с их неограниченной властью. Эта ситуация может быть временной в силу объявления чрезвычайного положения или постоянного института и метода организации. Охват и уровень вмешательства государства могут варьироваться от почти анархического порядка до сильно авторитарного государства. Экономические вопросы также сильно различаются, при этом не существует какой-либо общей экономической модели, кроме подчинения торговцев власти правителя. Социальная консервативная и реативная социальная философия является нормой с омрачением традиционных и религиозных ценностей."

 national_populist_subtype_desc: "Национальный популизм, который охватывает широкий спектр националистических и милитаристских движений, обычно почитает преданность государству и нации, объединяя людей под сильным лидером и корпоративной экономикой. Дипломатические, национальные популисты часто подчеркивают экспансионистскую и реваншистскую политику в результате националистического неподчинения или озабоченности по поводу безопасности, хотя это часто сменяется в пользу изоляционистского аутарки или средней основы цивилизованной или региональной солидарности. Национальные популисты, как правило, не поддерживают хорошие отношения с другими идеологическими группами. Они в значительной степени являются антилиберальными и, в свою очередь, крайне ненавистными либералами, причем либералы, как правило, отдают предпочтение социализму по сравнению с национальным популистским. социалисты презирают национальных популистов, и это чувство является взаимным. Другие авторитарные и реакционные идеологии, как правило, неблагоприятно относятся к национальным популистам из-за часто антимонарха и антитрадивных аспектов, существующих во многих национальных популистских движениях."
 islamist_subtype_desc: "§Y (Исламизм) §!n Исламизм, также называемый политическим исламом, умеренным исламским фундаментализмом или авторитарным исламским республиканцем, является разносторонней теоидеологией, которая утверждает, что государство должно быть восстановлено в конституционных, социально-экономических, судебных и культурных условиях, все в соответствии с исламской верой и его ключевыми документами и учениями. Как правило, антизападные, антилиберальные, антисоциалистские и глубоко консервативные и традиционистские движения всегда тесно связаны с исламской верой и церковной организацией, но, как правило, уклоняются от того, чтобы стать полной теократией, вместо того, чтобы копать корни в республиканскую, милитаристскую, этнонационалистскую/теонационалистическую, или редко демократические движения и системы, до тех пор пока они в значительной степени поддерживаются и диктуются мусульманской религией. Поскольку шариатское право и куранический литеризм являются общими чертами исламизма, религия получает от западного христианского мира, но мелкие хваты декадентных гедонистов и грешников не могут ослабить решимости этих храбодов и приверженцев Мохам Мохам и Аллахам."
 national_democracy_subtype_desc: "§Y(National Democracy) §! no introducation from Polish Positivism and Organic Work, National Democracy — это дитя римлян Дмовского, Отца Польской национальной мысли. Превращение польской нации в наивысшее благо, национальные демократы стремятся к созданию единого общества над классовыми различиями без какого-либо особого акцента на религии. Хотя Эндечка выступает за более сильную форму правления, она по-прежнему поддерживает демократию в качестве предпочтительной политической системы, когда она связана с подъемом польского населения и ассимиляцией большинства меньшинств в рамках преимущественно польского большинства. Вопрос экономики менее четко определен в национальном лагере, хотя наиболее популярное положение является свободным рынком с достаточным вмешательством правительства для защиты интересов нации. Когда дело касается иностранных дел, национальная демократия является непримиримым антигерманом и рассматривает Россию как лучшего партнера для сдерживания амбиций немецкой империи."


 valkist_subtype_desc: "Валькизм является националистической и милитаристской идеологией, которая предлагает систему, в которой политическая власть централизована под сильным руководством, которая через государственный контроль и направляет страну к национальному возрождению. Валькизм в социальном плане различается без какой-либо универсальной позиции. Многие из первоначальных мыслительных лидеров имеют социально прогрессивные идеи, однако его растущая популярность и приток более традиционных мыслителей в школу мысли, окружающей идеологию, не обязательно свидетельствуют о росте социальной консервативной или даже реакционной позиции по социальным вопросам внутри валькистского движения. Валькисты характеризуются концептуальными и эстетическими аспектами, присущими древнему, языческому, мистическому и эзотерическому традициям, обычно имеющим отношение к рассматриваемой нации. В то время как они не обязательно являются антирелигиозными или антихристианскими, признавая ее значение для европейской культуры, наследия и духовности. Валькистское государство уделяет большое внимание культуре как части нации, однако большая часть валькских мгновений утверждает, что этносоциалы являются основой того, что составляет нацию."
 national_syndicalist_subtype_desc: "§Y(National Syndicalism) §! n no that policalology, формализованный французским политиком и социальным писателем Джорджем Сореляном, национальный синдикалистизм является ревизионистским толкованием марксистской теории. Он держит основных социалистических квартиросъемщиков классовой борьбы и неприятия буржуазных идеалов парламентской либеральной демократии. Однако, принцип международного классового конфликта был адаптирован к принципу национальной борьбы. Часто вдохновлялся случаями романтического национализма, приводящего к шовинистической тенденции, прославлению насилия и конгломерации между синдикалистскими и корпократическими системами в попытке создать общество, основанное на рабочих-продюсерах. Эта идеология захватила флоту в Западной Европе и за ее пределами с ростом движения валькистов в Германии, при этом такие политические мысли претворялись в жизнь радикальными ультраправыми группами."National syndicalism" as an umbrella term also describes any right-wing groups that share signs of totalitarianism, centralization, militarization with the goal of uniting the common man into a national struggle against the enemy of the nation."
 neo_zoroastrianism_subtype_desc: "§Y (Neo-Zoroastrrianism) §!! nnNeo-Zoroastrianism, идеология валькистов в Иране, стремится объединить все иранские народы в реформированной зооастрианской религии и образе жизни с большим акцентом на полное милитаризмское господство над своими врагами, полное расовое превосходство над маленькими в пределах их границ и абсолютную преданность людей своей религии нео-Зорастрианскому."
 national_radicalism_subtype_desc: "§Y(National Radicalism) §! n ni-n Побочный продукт молодого поколения членов Endecja становится политически активным, National Radicalism является более горячей формой национальной демократии, выбирая польскую национальную мысль до крайностей. Для молодых радикалов единая польская нация является католической нацией, и любое понятие атеизма или агностизма, объявляемое старой Эндекой, высмеивается. Когда речь идет о видении правительственной системы, они также являются более радикальными, отстаивая крайне иерархические или даже откровенные тоталитарные формы, управляемые на протяжении всей жизни сенатом, одним лидером или просвещенным советом. Национальные радикалы также не пытаются скрыть свое презрение к большинству этнических меньшинств внутри польских границ, хотя некоторые мечты о создании панславской славной империи. Радикалисты также как-то более разделены по вопросу об экономике, чем основной линии Endecja, поддерживающие все от корпоративизма, правильного синдиализма, дистрибутивизма и заканчивая на неофеводной гульной системе. Если есть что-то что-то о национальных радиках, то они, конечно, что они еще более чем их профальны, что они даже более противоречивы и даже более противоречивы, и даже более спорны, чем их политически спорны."
 social_monarchist_subtype_desc: "Социальная монархизм - это не идеология и скорее система правления, в которой монарх возглавляет страну призраками государства всеобщего благосостояния и социальной демократии. ~ ~ Эта уникальная система может быть отслежена в Древнем Китае, на западе XIV века и в Австрии XIX века. ~ Несмотря на то, что демократия не является новым требованием для социальных монархий, большинство из них допускает это, потому что большинство социальных монархов по своей природе, просвещенные монархии, заботящиеся о своем народе и своей стране посредством осуществления реформ, законов в интересах народа, и все это ведет к тому, что страна станет полной конституционной монархией в течение многих лет."
 social_monarchist_lib_subtype_desc: "Социальная монархизм - это не идеология и скорее система правления, в которой монарх возглавляет страну призраками государства всеобщего благосостояния и социальной демократии. ~ ~ Эта уникальная система может быть отслежена в Древнем Китае, на западе XIV века и в Австрии XIX века. ~ Несмотря на то, что демократия не является новым требованием для социальных монархий, большинство из них допускает это, потому что большинство социальных монархов по своей природе, просвещенные монархии, заботящиеся о своем народе и своей стране посредством осуществления реформ, законов в интересах народа, и все это ведет к тому, что страна станет полной конституционной монархией в течение многих лет."

 internationalist_subtype_desc: "Интернационалистический социализм, как он себя называет, или более широко известный как Интернационализм, является социалистической идеологией, предлагающей рабочим, когда-то управляющим, организовать вечную революцию и продолжать активную борьбу за социализм в мире. Хотя большинство социалистических штаммов носят международный характер, активный дух Интернационализма придал ему более воинственный характер, и Интернационалистские идеологы являются известными сторонниками растущей милитаризации рабочих во имя революции, а также создания сильного государства, способного защитить интересы рабочих и защитить революцию от реакционных сил, которые могут противостоять ей, поскольку революция никогда не должна прекращать распространение."

 social_credit_subtype_desc: "Социальный кредит является экономической и политической идеологией начала XX века, которая была разработана главным образом канадским инженером и экономистом К.Х. Дугласом. Социальный кредит выступает за реформу экономической системы в целях обеспечения более справедливого распределения богатства и ресурсов. В своей основе социальное кредитование ставит под сомнение существующую финансовую и банковскую систему, утверждая, что оно порождает внутренние диспропорции в экономике. Эта идеология подчеркивает роль денежных средств в содействии обмену товарами и услугами и направлена на устранение недостатков, которые, по ее мнению, существуют в нынешней кредитно-денежной системе. &lt; &lt; Центральное понятие социального кредита &gt; &gt; -- это идея социального дивиденда или национального дивиденда. &lt; &lt; В соответствии с этим принципом каждый гражданин должен получать регулярные платежи от правительства, которое представляет собой долю общего производства страны. &gt; &gt; этот дивиденд рассматривается в качестве законного права всех лиц, признавая их вклад в коллективное богатство, полученное обществом."
