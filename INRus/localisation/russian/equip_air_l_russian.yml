l_russian:
  fighter: "Истребитель"
  fighter_equipment_desc: "Истребители быстры и маневренны. Они выполняют широкий спектр задач: от борьбы за господство в воздухе и защиты своих бомбардировщиков до перехвата вражеской авиации."
  cv_fighter: "Палубный истребитель"
  cv_fighter_equipment_desc: "Палубные истребители быстры и маневренны. Они выполняют широкий спектр задач: от борьбы за господство в воздухе и защиты своих бомбардировщиков до перехвата вражеской авиации."
  jet_fighter: "Реактивный истребитель"
  jet_fighter_equipment: "Реактивный истребитель"
  jet_fighter_equipment_desc: "Реактивные истребители быстры и маневренны. Они выполняют широкий спектр задач: от борьбы за господство в воздухе и защиты своих бомбардировщиков до перехвата вражеской авиации."
  cas: "Штурмовик"
  CAS_equipment_desc: "Самолеты непосредственной авиационной поддержки предназначены для помощи наземным войскам в бою."
  cv_cas: "Палубный штурмовик"
  cv_CAS_equipment_desc: "Палубные самолеты непосредственной авиационной поддержки предназначены для помощи наземным войскам в бою."
  nav_bomber: "Морской бомбардировщик"
  nav_bomber_equipment_desc: "Морские бомбардировщики предназначены для поиска и уничтожения вражеских кораблей."
  cv_nav_bomber: "Палубный морской бомбардировщик"
  cv_nav_bomber_equipment_desc: "Палубные морские бомбардировщики предназначены для поиска и уничтожения вражеских кораблей."
  tac_bomber: "Тактический бомбардировщик"
  tac_bomber_equipment_desc: "Тактические бомбардировщики — это универсальные двухмоторные самолеты, способные поддерживать наземные войска и наносить удары по инфраструктуре противника."
  jet_tac_bomber: "Реактивный тактический бомбардировщик"
  jet_tac_bomber_equipment: "Реактивный тактический бомбардировщик"
  jet_tac_bomber_equipment_desc: "Реактивные тактические бомбардировщики — это универсальные самолеты, способные поддерживать наземные войска и наносить удары по инфраструктуре противника на высоких скоростях."
  heavy_fighter: "Тяжелый истребитель"
  heavy_fighter_equipment_desc: "Тяжелые истребители обладают большой дальностью полета и мощным вооружением. Они эффективны для сопровождения бомбардировщиков и перехвата вражеских авиагрупп, однако из-за низкой маневренности уступают обычным истребителям в ближнем бою."
  strat_bomber: "Стратегический бомбардировщик"
  strat_bomber_equipment_desc: "Стратегические бомбардировщики атакуют промышленные объекты и инфраструктуру в глубоком тылу противника, подрывая его экономический потенциал."
  jet_strat_bomber: "Реактивный стратегический бомбардировщик"
  jet_strat_bomber_equipment: "Реактивный стратегический бомбардировщик"
  jet_strat_bomber_equipment_desc: "Реактивные стратегические бомбардировщики атакуют промышленные объекты и инфраструктуру в глубоком тылу противника, подрывая его экономический потенциал на недосягаемых ранее скоростях и высотах."
  transport_plane: "Транспортный самолет"
  transport_plane_equipment_desc: "Используется для снабжения войск по воздуху и высадки воздушных десантов."
  guided_missile: "Управляемая ракета"
  fighter_equipment: "Истребитель"
  cv_fighter_equipment: "Палубный истребитель"
  cv_fighter_equipment_short: "Палуб. истребитель"
  strat_bomber_equipment: "Стратегический бомбардировщик"
  rocket_interceptor_equipment: "Ракетный перехватчик"
  rocket_interceptor_equipment_desc: "Перехватчик ближнего радиуса действия с жидкостным ракетным двигателем."
  suicide_craft_equipment: "Самолет-снаряд камикадзе"
  suicide_craft_equipment_desc: "Управляемый пилотом самолет-снаряд ближнего радиуса действия для самопожертвования во имя победы."
  fighter_equipment_0: "Межвоенный истребитель"
  fighter_equipment_0_short: "Межвоен. истребитель"
  fighter_equipment_0_desc: "Несмотря на то, что со времен Вельткрига истребители сильно эволюционировали, бипланная схема постепенно устаревает."
  early_fighter: "$fighter_equipment_0$"
  early_fighter_desc: "$fighter_equipment_0_desc$"
  fighter_equipment_1: "Истребитель I"
  fighter_equipment_1_short: "Истребитель I"
  fighter_equipment_1_desc: "Наша попытка создать современный истребитель-моноплан, отвечающий вызовам новой эпохи."
  fighter1: "$fighter_equipment_1$"
  fighter1_desc: "$fighter_equipment_1_desc$"
  fighter_equipment_2: "Истребитель II"
  fighter_equipment_2_short: "Истребитель II"
  fighter_equipment_2_desc: "Темпы развития авиации стремительны. Наш новый истребитель должен обладать высокой скоростью, отличными высотными характеристиками, увеличенной дальностью полета и мощным стрелково-пушечным вооружением."
  fighter2: "$fighter_equipment_2$"
  fighter2_desc: "$fighter_equipment_2_desc$"
  fighter_equipment_3: "Истребитель III"
  fighter_equipment_3_short: "Истребитель III"
  fighter_equipment_3_desc: "Хотя предыдущие поколения истребителей отлично себя показали, необходимо использовать все достижения современной аэродинамики и моторастроения для обеспечения абсолютного превосходства в воздухе."
  fighter3: "$fighter_equipment_3$"
  fighter3_desc: "$fighter_equipment_3_desc$"
  heavy_fighter_equipment: "Тяжелый истребитель"
  heavy_fighter_equipment_1: "Тяжелый истребитель I"
  heavy_fighter_equipment_1_short: "Тяжелый истребитель I"
  heavy_fighter_equipment_1_desc: "Нашим бомбардировщикам требуется прикрытие на всем протяжении маршрута. Для этого необходимо спроектировать дальний истребитель сопровождения."
  heavy_fighter1: "$heavy_fighter_equipment_1$"
  heavy_fighter1_desc: "$heavy_fighter_equipment_1_desc$"
  heavy_fighter_equipment_2: "Тяжелый истребитель II"
  heavy_fighter_equipment_2_short: "Тяжелый истребитель II"
  heavy_fighter_equipment_2_desc: "Опыт боев показал, что тяжелые истребители уязвимы для маневренных одномоторных машин, но благодаря мощному вооружению прекрасно справляются с перехватом вражеских бомбардировщиков."
  heavy_fighter2: "$heavy_fighter_equipment_2$"
  heavy_fighter2_desc: "$heavy_fighter_equipment_2_desc$"
  heavy_fighter_equipment_3: "Тяжелый истребитель III"
  heavy_fighter_equipment_3_short: "Тяжелый истребитель III"
  heavy_fighter_equipment_3_desc: "Новый проект должен повысить защищенность тяжелых истребителей в боях с вражеской авиацией и позволить им еще более эффективно перехватывать скоростные бомбардировщики противника."
  heavy_fighter3: "$heavy_fighter_equipment_3$"
  heavy_fighter3_desc: "$heavy_fighter_equipment_3_desc$"
  strat_bomber_equipment_1: "Стратегический бомбардировщик I"
  strat_bomber_equipment_1_short: "Страт. бомбардировщик I"
  strat_bomber_equipment_1_desc: "Опыт Великой войны показывает, что стратегические бомбардировки тыла противника могут решить исход следующего конфликта. Нам нужен тяжелый многомоторный самолет с высокой дальностью, большой бомбовой нагрузкой и оборонительным вооружением."
  strategic_bomber1: "$strat_bomber_equipment_1$"
  strategic_bomber1_desc: "$strat_bomber_equipment_1_desc$"
  strat_bomber_equipment_2: "Стратегический бомбардировщик II"
  strat_bomber_equipment_2_short: "Страт. бомбардировщик II"
  strat_bomber_equipment_2_desc: "Массированные бомбардировки доказали свою эффективность в уничтожении промышленного потенциала противника."
  strategic_bomber2: "$strat_bomber_equipment_2$"
  strategic_bomber2_desc: "$strat_bomber_equipment_2_desc$"
  strat_bomber_equipment_3: "Стратегический бомбардировщик III"
  strat_bomber_equipment_3_short: "Страт. бомбардировщик III"
  strat_bomber_equipment_3_desc: "Чтобы снизить потери от зенитного огня и истребителей перехвата, наш новый стратегический бомбардировщик проектируется для полетов на экстремальных высотах."
  strategic_bomber3: "$strat_bomber_equipment_3$"
  strategic_bomber3_desc: "$strat_bomber_equipment_3_desc$"
  jet_strat_bomber_equipment_1: "Реактивный стратегический бомбардировщик I"
  jet_strat_bomber_equipment_1_short: "Реактивный страт. бомбард. I"
  jet_strat_bomber_equipment_1_desc: "Использование нескольких реактивных двигателей позволяет создавать тяжелые самолеты с невероятной скоростью полета при сохранении огромной бомбовой нагрузки и большой дальности."
  jet_strategic_bomber1: "$jet_strat_bomber_equipment_1$"
  jet_strategic_bomber1_desc: "$jet_strat_bomber_equipment_1_desc$"
  tac_bomber_equipment: "Тактический бомбардировщик"
  tac_bomber_equipment_0: "Межвоенный бомбардировщик"
  tac_bomber_equipment_0_short: "Межвоен. бомбардировщик"
  tac_bomber_equipment_0_desc: "Устаревшие конструкции двухмоторных бомбардировщиков, сохранившиеся со времен прошлого глобального конфликта."
  early_bomber: "$tac_bomber_equipment_0$"
  early_bomber_desc: "$tac_bomber_equipment_0_desc$"
  tac_bomber_equipment_1: "Тактический бомбардировщик I"
  tac_bomber_equipment_1_short: "Тактический бомбард. I"
  tac_bomber_equipment_1_desc: "Средние бомбардировщики должны быть универсальными и быстрыми, способными выполнять самый широкий спектр боевых задач."
  tactical_bomber1: "$tac_bomber_equipment_1$"
  tactical_bomber1_desc: "$tac_bomber_equipment_1_desc$"
  tac_bomber_equipment_2: "Тактический бомбардировщик II"
  tac_bomber_equipment_2_short: "Тактический бомбард. II"
  tac_bomber_equipment_2_desc: "Более тяжелые конструкции тактических бомбардировщиков позволяют увеличить дальность полета, боевую нагрузку и скорость, сохраняя при этом универсальность применения."
  tactical_bomber2: "$tac_bomber_equipment_2$"
  tactical_bomber2_desc: "$tac_bomber_equipment_2_desc$"
  tac_bomber_equipment_3: "Тактический бомбардировщик III"
  tac_bomber_equipment_3_short: "Тактический бомбард. III"
  tac_bomber_equipment_3_desc: "Использование новейших аэродинамических форм и передовых материалов позволяет сделать новые двухмоторные бомбардировщики одними из самых быстрых самолетов в мире."
  tactical_bomber3: "$tac_bomber_equipment_3$"
  tactical_bomber3_desc: "$tac_bomber_equipment_3_desc$"
  transport_plane_equipment: "Транспортный самолет"
  transport_plane_equipment_1: "Межвоенный транспортный самолет"
  # transport_plane_equipment_1_short: "Транспорт I"
  transport_plane_equipment_1_desc: "Самолеты, используемые для снабжения войск по воздуху и высадки десанта."
  transport_plane_equipment_2: "Улучшенный транспортный самолет"
  # transport_plane_equipment_2_short: "Транспорт II"
  transport_plane_equipment_2_desc: "Самолеты, используемые для снабжения войск по воздуху и высадки десанта."
  transport_plane_equipment_3: "Современный транспортный самолет"
  # transport_plane_equipment_3_short: "Транспорт III"
  transport_plane_equipment_3_desc: "Самолеты, используемые для снабжения войск по воздуху и высадки десанта."
  nav_bomber_equipment: "Морской бомбардировщик"
  cv_nav_bomber_equipment: "Палубный морской бомбардировщик"
  cv_nav_bomber_equipment_short: "Палуб. морской бомбард."
  nav_bomber_equipment_1: "Морской бомбардировщик I"
  nav_bomber_equipment_1_short: "Мор. бомбардировщик I"
  nav_bomber_equipment_1_desc: "Морская авиация будет иметь ключевое значение в предстоящие годы для противодействия угрозам на море, в частности для борьбы с подводными лодками."
  naval_bomber1: "$nav_bomber_equipment_1$"
  naval_bomber1_desc: "$nav_bomber_equipment_1_desc$"
  nav_bomber_equipment_2: "Морской бомбардировщик II"
  nav_bomber_equipment_2_short: "Мор. бомбардировщик II"
  nav_bomber_equipment_2_desc: "Новые двигатели и аэродинамические улучшения позволят существенно увеличить скорость, радиус действия и торпедную нагрузку морских самолетов."
  naval_bomber2: "$nav_bomber_equipment_2$"
  naval_bomber2_desc: "$nav_bomber_equipment_2_desc$"
  nav_bomber_equipment_3: "Морской бомбардировщик III"
  nav_bomber_equipment_3_short: "Мор. бомбардировщик III"
  nav_bomber_equipment_3_desc: "Цельнометаллическая конструкция и мощные силовые установки позволяют создавать узкоспециализированные и живучие морские самолеты."
  naval_bomber3: "$nav_bomber_equipment_3$"
  naval_bomber3_desc: "$nav_bomber_equipment_3_desc$"
  CAS_equipment: "Штурмовик"
  cv_CAS_equipment: "Палубный штурмовик"
  cv_CAS_equipment_short: "Палуб. штурмовик"
  CAS_equipment_1: "Штурмовик I"
  CAS_equipment_1_short: "Штурмовик I"
  CAS_equipment_1_desc: "Наша доктрина требует создания самолета непосредственной поддержки, способного наносить точечные удары по наземным целям. Хотя они несут меньшую полезную нагрузку, чем тактические бомбардировщики, они уничтожают позиции противника при помощи пикирования."
  CAS1: "$CAS_equipment_1$"
  CAS1_desc: "$CAS_equipment_1_desc$"
  CAS_equipment_2: "Штурмовик II"
  CAS_equipment_2_short: "Штурмовик II"
  CAS_equipment_2_desc: "Опыт первых боев показал, что для выживания штурмовиков под огнем зенитной артиллерии и при атаках вражеских истребителей необходимы повышенная скорость, маневренность и бронирование кабины."
  CAS2: "$CAS_equipment_2$"
  CAS2_desc: "$CAS_equipment_2_desc$"
  CAS_equipment_3: "Штурмовик III"
  CAS_equipment_3_short: "Штурмовик III"
  CAS_equipment_3_desc: "Растущие возможности зенитных средств противника требуют дальнейшего совершенствования штурмовой авиации. Новая конструкция сочетает мощный двигатель, улучшенную защиту и возросшую бомбовую нагрузку."
  CAS3: "$CAS_equipment_3$"
  CAS3_desc: "$CAS_equipment_3_desc$"
  jet_fighter_equipment_1: "Реактивный истребитель I"
  jet_fighter_equipment_1_short: "Реактивный истребитель I"
  jet_fighter_equipment_1_desc: "Рост скоростей поршневой авиации меркнет по сравнению с появлением первых реактивных истребителей. Хотя мы только учимся проектировать планеры под такие двигатели, обычные самолеты уже не могут с ними конкурировать."
  jet_fighter1: "$jet_fighter_equipment_1$"
  jet_fighter1_desc: "$jet_fighter_equipment_1_desc$"
  jet_fighter_equipment_2: "Реактивный истребитель II"
  jet_fighter_equipment_2_short: "Реактивный истребитель II"
  jet_fighter_equipment_2_desc: "Стреловидные крылья и легкие сплавы позволяют еще больше увеличить скорость и дальность полета революционных реактивных истребителей."
  jet_fighter2: "$jet_fighter_equipment_2$"
  jet_fighter2_desc: "$jet_fighter_equipment_2_desc$"
  jet_tac_bomber_equipment_1: "Реактивный тактический бомбардировщик I"
  jet_tac_bomber_equipment_1_short: "Реактивный тактический бомбард. I"
  jet_tac_bomber_equipment_1_desc: "Появление реактивных истребителей требует создания бомбардировщиков, способных уходить от перехвата за счет равной скорости."
  jet_tactical_bomber1: "$jet_tac_bomber_equipment_1$"
  jet_tactical_bomber1_desc: "$jet_tac_bomber_equipment_1_desc$"
  jet_tac_bomber_equipment_2: "Реактивный тактический бомбардировщик II"
  jet_tac_bomber_equipment_2_short: "Реактивный тактический бомбард. II"
  jet_tac_bomber_equipment_2_desc: "Новые реактивные бомбардировщики устанавливают новые стандарты высоты, скорости и дальности полета, способные наносить удары и вести разведку на огромных расстояниях."
  jet_tactical_bomber2: "$jet_tac_bomber_equipment_2$"
  jet_tactical_bomber2_desc: "$jet_tac_bomber_equipment_2_desc$"
  cv_nav_bomber_equipment_1: "Палубный морской бомбардировщик I"
  cv_nav_bomber_equipment_1_short: "Палуб. мор. бомбард. I"
  cv_nav_bomber_equipment_1_desc: "Ранняя модель морского бомбардировщика, модифицированная для взлета и посадки на авианосцы."
  cv_naval_bomber1: "$cv_nav_bomber_equipment_1$"
  cv_naval_bomber1_desc: "$cv_nav_bomber_equipment_1_desc$"
  cv_nav_bomber_equipment_2: "Палубный морской бомбардировщик II"
  cv_nav_bomber_equipment_2_short: "Палуб. мор. бомбард. II"
  cv_nav_bomber_equipment_2_desc: "Улучшенная модель морского бомбардировщика, модифицированная для базирования на авианосцах."
  cv_naval_bomber2: "$cv_nav_bomber_equipment_2$"
  cv_naval_bomber2_desc: "$cv_nav_bomber_equipment_2_desc$"
  cv_nav_bomber_equipment_3: "Палубный морской бомбардировщик III"
  cv_nav_bomber_equipment_3_short: "Палуб. мор. бомбард. III"
  cv_nav_bomber_equipment_3_desc: "Передовая модель морского бомбардировщика, модифицированная для базирования на авианосцах."
  cv_naval_bomber3: "$cv_nav_bomber_equipment_3$"
  cv_naval_bomber3_desc: "$cv_nav_bomber_equipment_3_desc$"
