 cv_nav_bomber_equipment_3_short: "Бомбардировщик III"
 cv_nav_bomber_equipment_3_desc: "Передовой военно-морской бомбардировщик был модифицирован для запуска и посадки на авианосцах."
 cv_naval_bomber3: "$cv_nav_bomber_equipment_3$"
 cv_naval_bomber3_desc: "$cv_nav_bomber_equipment_3_desc$"
