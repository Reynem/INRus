l_russian:
 fighter: "Боец"
 fighter_equipment_desc: "Боевики быстро и ловко и могут делать много работы, от борьбы за воздушное превосходство, от защиты ваших бомбардировщиков и перехвата вражеских бомбардировщиков."
 cv_fighter: "Истребитель (перевозчик)"
 cv_fighter_equipment_desc: "Боевики быстро и ловко и могут делать много работы, от борьбы за воздушное превосходство, от защиты ваших бомбардировщиков и перехвата вражеских бомбардировщиков."
 jet_fighter: "Бойц-реактивный"
 jet_fighter_equipment: "Бойц-реактивный"
 jet_fighter_equipment_desc: "Боевики быстро и ловко и могут делать много работы, от борьбы за воздушное превосходство, от защиты ваших бомбардировщиков и перехвата вражеских бомбардировщиков."
 cas: "Поддержка при закрытых воздушных перевозках"
 CAS_equipment_desc: "Самолеты &lt; &lt; Близкая авиация &gt; &gt; предназначены для поддержки наземных боевых действий."
 cv_cas: "Закрытое воздушное сообщение (перевозчик)"
 cv_CAS_equipment_desc: "Самолеты &lt; &lt; Близкая авиация &gt; &gt; предназначены для поддержки наземных боевых действий."
 nav_bomber: "Бомбардировщик военно-морского флота"
 nav_bomber_equipment_desc: "Бомбардировщики могут совершать нападения на вражеские корабли."
 cv_nav_bomber: "Морской бомбардировщик (перевозчик)"
 cv_nav_bomber_equipment_desc: "Бомбардировщики могут совершать нападения на вражеские корабли."
 tac_bomber: "Тактический бомбардировщик"
 tac_bomber_equipment_desc: "Тактические бомбардировщики - это небольшие быстрые бомбардировщики, которые могут помочь наземным войскам и бомбить вражеские здания."
 jet_tac_bomber: "Реактивный тактический бомбардировщик"
 jet_tac_bomber_equipment: "Реактивный тактический бомбардировщик"
 jet_tac_bomber_equipment_desc: "Тактические бомбардировщики - это небольшие быстрые бомбардировщики, которые могут помочь наземным войскам и бомбить вражеские здания."
 heavy_fighter: "Тяжелый боец"
 heavy_fighter_equipment_desc: "Тяжелые истребители имеют оружие большой дальности и мощное оружие, они полезны как для защиты бомбардировщиков на дальнем расстоянии, так и для перехвата вражеских бомбардировщиков, однако их низкая оперативность означает, что они будут бороться против обычных боевиков."
 strat_bomber: "Стратегический бомбардировщик"
 strat_bomber_equipment_desc: "Стратегические бомбардировщики атакуют вражеские здания и объекты инфраструктуры, истощая их драгоценную промышленность."
 jet_strat_bomber: "Бомбардировщик &lt; &lt; Реактивная стратегия &gt; &gt;"
 jet_strat_bomber_equipment: "Бомбардировщик &lt; &lt; Реактивная стратегия &gt; &gt;"
 jet_strat_bomber_equipment_desc: "Стратегические бомбардировщики атакуют вражеские здания и объекты инфраструктуры, истощая их драгоценную промышленность."
 transport_plane: "Транспортировка"
 transport_plane_equipment_desc: "Доставляет десантников в пункт назначения."
 guided_missile: "Ракета"
 fighter_equipment: "Боец"
 cv_fighter_equipment: "Боевик-перевозчик"
 cv_fighter_equipment_short: "CV Истребитель"
 strat_bomber_equipment: "Стратегический бомбардировщик"
 rocket_interceptor_equipment: "Перехватчик ракет"
 rocket_interceptor_equipment_desc: "Перехватчик с коротким радиусом действия, приводимый в действие химическим ракетным двигателем."
 suicide_craft_equipment: "Судно по делам о самоубийствах"
 suicide_craft_equipment_desc: "Пилотная бомба с короткой дальностью, работающая на химическом ракетном двигателе."
 fighter_equipment_0: "Межвоенный боец"
 fighter_equipment_0_short: "Боец"
 fighter_equipment_0_desc: "В то время как истребители претерпели много изменений через «Велткриг», и с тех пор проект двух самолетов устаревает."
 early_fighter: "$fighter_equipment_0$"
 early_fighter_desc: "$fighter_equipment_0_desc$"
 fighter_equipment_1: "Боец I"
 fighter_equipment_1_short: "Боец I"
 fighter_equipment_1_desc: "Это наша попытка создать наш первый современный истребитель."
 fighter1: "$fighter_equipment_1$"
 fighter1_desc: "$fighter_equipment_1_desc$"
 fighter_equipment_2: "Боец II"
 fighter_equipment_2_short: "Боец II"
 fighter_equipment_2_desc: "Темпы продвижения истребителей поразительны, и как таковые мы должны продолжать внедрять технологию, а также совершенствовать существующие концепции. Наша новая конструкция истребителей должна быть способна к высокой скорости, высокой производительности на высоте и максимально возможному диапазону. Кроме того, она должна быть очень хорошо вооружена."
 fighter2: "$fighter_equipment_2$"
 fighter2_desc: "$fighter_equipment_2_desc$"
 fighter_equipment_3: "Боец III"
 fighter_equipment_3_short: "Боец III"
 fighter_equipment_3_desc: "Несмотря на то, что наши предыдущие поколения истребителей доказали свою ценность, следует использовать любое преимущество, полученное в результате более совершенного дизайна."
 fighter3: "$fighter_equipment_3$"
 fighter3_desc: "$fighter_equipment_3_desc$"
 heavy_fighter_equipment: "Тяжелый боец"
 heavy_fighter_equipment_1: "Тяжелый боец I"
 heavy_fighter_equipment_1_short: "Тяжелый боец I"
 heavy_fighter_equipment_1_desc: "Наши силы бомбардировщиков нуждаются в защите от вражеских боевиков до их целей и обратно, чтобы обеспечить это сопровождение, мы должны проектировать истребители с дистанцией бомбардировщиков."
 heavy_fighter1: "$heavy_fighter_equipment_1$"
 heavy_fighter1_desc: "$heavy_fighter_equipment_1_desc$"
 heavy_fighter_equipment_2: "Тяжелый боец II"
 heavy_fighter_equipment_2_short: "Тяжелый боец II"
 heavy_fighter_equipment_2_desc: "Война научила нас тому, что наш тяжёлый боевой проект уязвим для более ловких бойцов, но достаточно хорош в перехвате вражеских бомбардировщиков из-за тяжелого вооружения."
 heavy_fighter2: "$heavy_fighter_equipment_2$"
 heavy_fighter2_desc: "$heavy_fighter_equipment_2_desc$"
 heavy_fighter_equipment_3: "Тяжелый истребитель III"
 heavy_fighter_equipment_3_short: "Тяжелый истребитель III"
 heavy_fighter_equipment_3_desc: "Несмотря на то, что наши тяжелые истребители продемонстрировали свою компетентность в различных ролях, мы должны подумать о новом дизайне, который повысит их способность по отношению к вражеским боевикам, а также позволит им продолжать перехват все более быстро и более эффективно защищать вражеских бомбардировщиков."
 heavy_fighter3: "$heavy_fighter_equipment_3$"
 heavy_fighter3_desc: "$heavy_fighter_equipment_3_desc$"
 strat_bomber_equipment_1: "Стратегический бомбардировщик I"
 strat_bomber_equipment_1_short: "Бомбардировщик I"
 strat_bomber_equipment_1_desc: "Опыт Вельткрига и его исследования с тех пор показывают, что бомбардировка военных объектов противника и крупных городов выиграет следующую войну, по крайней мере, у нас должен быть бомбардировщик, способный доставить такое уничтожение, он должен лететь высоко и с высокой скоростью, он должен нести большую нагрузку, для этого потребуется большой воздушный корпус с несколькими двигателями, он также будет иметь некоторые оборонительные возможности."
 strategic_bomber1: "$strat_bomber_equipment_1$"
 strategic_bomber1_desc: "$strat_bomber_equipment_1_desc$"
 strat_bomber_equipment_2: "&lt; &lt; Стратегический бомбардировщик II &gt; &gt;"
 strat_bomber_equipment_2_short: "Бомбардировщик &lt; &lt; Страт II &gt; &gt;"
 strat_bomber_equipment_2_desc: "Бомбардировка доказала свою эффективность в снижении способности врага вести войну."
 strategic_bomber2: "$strat_bomber_equipment_2$"
 strategic_bomber2_desc: "$strat_bomber_equipment_2_desc$"
 strat_bomber_equipment_3: "Стратегический бомбардировщик III"
 strat_bomber_equipment_3_short: "Бомбардировщик &lt; &lt; Страт III &gt; &gt;"
 strat_bomber_equipment_3_desc: "Чтобы избежать потерь для вражеских боевиков и наземных пожаров, наш следующий проект будет лететь на большой высоте."
 strategic_bomber3: "$strat_bomber_equipment_3$"
 strategic_bomber3_desc: "$strat_bomber_equipment_3_desc$"
 jet_strat_bomber_equipment_1: "Бомбардировщик &lt; &lt; Реактивная стратегия I &gt; &gt;"
 jet_strat_bomber_equipment_1_short: "Бомбардировщик Jet Strat I"
 jet_strat_bomber_equipment_1_desc: "Множественные реактивные двигатели позволяют создавать новые конструкции с беспрецедентной скоростью при сохранении большой полезной нагрузки и большой дальности полета."
 jet_strategic_bomber1: "$jet_strat_bomber_equipment_1$"
 jet_strategic_bomber1_desc: "$jet_strat_bomber_equipment_1_desc$"
 tac_bomber_equipment: "Тактический бомбардировщик"
 tac_bomber_equipment_0: "Межвоенный бомбардировщик"
 tac_bomber_equipment_0_short: "Бомбардировщик"
 tac_bomber_equipment_0_desc: "Широко распространено мнение о том, что следующая война будет полностью побеждена бомбардировкой противника и его вымиранием."
 early_bomber: "$tac_bomber_equipment_0$"
 early_bomber_desc: "$tac_bomber_equipment_0_desc$"
 tac_bomber_equipment_1: "Тактический бомбардировщик I"
 tac_bomber_equipment_1_short: "Так-бомбардировщик I"
 tac_bomber_equipment_1_desc: "Средние бомбардировщики должны быть разносторонними и быстрыми, способными выполнять целый ряд функций."
 tactical_bomber1: "$tac_bomber_equipment_1$"
 tactical_bomber1_desc: "$tac_bomber_equipment_1_desc$"
 tac_bomber_equipment_2: "Тактический бомбардировщик II"
 tac_bomber_equipment_2_short: "Такловый бомбардировщик II"
 tac_bomber_equipment_2_desc: "Более тяжелые конструкции тактических бомбардировщиков могут расширять дальность, полезную нагрузку и скорость, сохраняя при этом способность самолетов выполнять самые разнообразные миссии."
 tactical_bomber2: "$tac_bomber_equipment_2$"
 tactical_bomber2_desc: "$tac_bomber_equipment_2_desc$"
 tac_bomber_equipment_3: "Тактический бомбардировщик III"
 tac_bomber_equipment_3_short: "Таковой бомбардировщик III"
 tac_bomber_equipment_3_desc: "Если взять страницу из достижений в истребителях, нетрадиционные материалы и формы могут сделать новые дизайны одними из самых быстрых и лучших из когда-либо созданных самолётов с двумя двигателями."
 tactical_bomber3: "$tac_bomber_equipment_3$"
 tactical_bomber3_desc: "$tac_bomber_equipment_3_desc$"
 transport_plane_equipment: "Транспортный планe"
 transport_plane_equipment_1: "Межвоенный транспортный самолетe"
 # transport_plane_equipment_1_short: "Транспорт I"
 transport_plane_equipment_1_desc: "Самолеты, используемые для доставки войск в парадраповые миссии."
 transport_plane_equipment_2: "Совершенствование транспортного планаe"
 # transport_plane_equipment_2_short: "Транспорт II"
 transport_plane_equipment_2_desc: "Самолеты, используемые для доставки войск в парадраповые миссии."
 transport_plane_equipment_3: "Современный транспортный планe"
 # transport_plane_equipment_3_short: "Транспорт III"
 transport_plane_equipment_3_desc: "Самолеты, используемые для доставки войск в парадраповые миссии."
 nav_bomber_equipment: "Бомбардировщик военно-морского флота"
 cv_nav_bomber_equipment: "CV Бомбардировщик военно-морского флота"
 cv_nav_bomber_equipment_short: "CV Бомбардировщик военно-морского флота"
 nav_bomber_equipment_1: "Бомбардировщик I военно-морского флота"
 nav_bomber_equipment_1_short: "NAV I"
 nav_bomber_equipment_1_desc: "Морская авиация будет иметь жизненно важное значение в предстоящем десятилетии для противодействия новым событиям в военно-морской войне, таким, как повышение значения подводных лодок."
 naval_bomber1: "$nav_bomber_equipment_1$"
 naval_bomber1_desc: "$nav_bomber_equipment_1_desc$"
 nav_bomber_equipment_2: "Бомбардировщик II военно-морского флота"
 nav_bomber_equipment_2_short: "NAV II"
 nav_bomber_equipment_2_desc: "Новая технология двигателей и аэродинамические усовершенствования позволят значительно повысить скорость и погружение в воду военно-морских самолетов."
 naval_bomber2: "$nav_bomber_equipment_2$"
 naval_bomber2_desc: "$nav_bomber_equipment_2_desc$"
 nav_bomber_equipment_3: "Бомбардировщик III военно-морского флота"
 nav_bomber_equipment_3_short: "NAV III"
 nav_bomber_equipment_3_desc: "Всеметаллические конструкции и мощные браслеты позволяют использовать более сложные военно-морские самолеты."
 naval_bomber3: "$nav_bomber_equipment_3$"
 naval_bomber3_desc: "$nav_bomber_equipment_3_desc$"
 CAS_equipment: "Поддержка при закрытых воздушных перевозках"
 cv_CAS_equipment: "Перевозчик &quot; КАС &quot;"
 cv_CAS_equipment_short: "CV CAS"
 CAS_equipment_1: "Закрыть базу поддержки I"
 CAS_equipment_1_short: "КАС I"
 CAS_equipment_1_desc: "Наша доктрина CAS требует самолета, способного к точному поверхностному нападению. Хотя эти самолеты несут меньше полезной нагрузки по сравнению с нашими более крупными тактическими бомбардировщиками, они способны атаковать и уничтожать небольшие потенциальные цели посредством бомбардировок и ныряльщиков."
 CAS1: "$CAS_equipment_1$"
 CAS1_desc: "$CAS_equipment_1_desc$"
 CAS_equipment_2: "Закрыть авиационную поддержку II"
 CAS_equipment_2_short: "КАС II"
 CAS_equipment_2_desc: "Опыт первых военных действий показал, что для выживания самолетов КАС от вражеских боевиков и наземных пожаров необходимы более высокие скорость, бронетехника и маневренность."
 CAS2: "$CAS_equipment_2$"
 CAS2_desc: "$CAS_equipment_2_desc$"
 CAS_equipment_3: "Закрыть систему авиационной поддержки III"
 CAS_equipment_3_short: "КАС III"
 CAS_equipment_3_desc: "Постоянно растущие возможности мишеней AA и вражеских перехватчиков требуют дальнейшей эволюции нашего самолета CAS. Новая конструкция включает в себя увеличение мощности двигателя, усовершенствование воздушных корпусов в целях повышения способности к нырянию и защиты, а также увеличение полезной нагрузки."
 CAS3: "$CAS_equipment_3$"
 CAS3_desc: "$CAS_equipment_3_desc$"
 jet_fighter_equipment_1: "Реактивный боец I"
 jet_fighter_equipment_1_short: "Реактивный боец I"
 jet_fighter_equipment_1_desc: "Предыдущее увеличение скорости бледно по сравнению с появлением первых реактивных истребителей. Хотя мы еще не научились наилучшим образом строить самолеты для этих двигателей, обычные истребители не могут конкурировать."
 jet_fighter1: "$jet_fighter_equipment_1$"
 jet_fighter1_desc: "$jet_fighter_equipment_1_desc$"
 jet_fighter_equipment_2: "Истребитель II"
 jet_fighter_equipment_2_short: "Истребитель II"
 jet_fighter_equipment_2_desc: "Новые замысловатые конструкции крыла и более легкий выбор материала позволят нам еще больше расширить диапазон и скорость революционных реактивных истребителей."
 jet_fighter2: "$jet_fighter_equipment_2$"
 jet_fighter2_desc: "$jet_fighter_equipment_2_desc$"
 jet_tac_bomber_equipment_1: "Реактивный тактический бомбардировщик I"
 jet_tac_bomber_equipment_1_short: "Бомбировщик Jet Tac I"
 jet_tac_bomber_equipment_1_desc: "Появление реактивных истребителей требует бомбардировщиков, которые могут убежать или, по крайней мере, соответствовать их скорости."
 jet_tactical_bomber1: "$jet_tac_bomber_equipment_1$"
 jet_tactical_bomber1_desc: "$jet_tac_bomber_equipment_1_desc$"
 jet_tac_bomber_equipment_2: "Реактивный тактический бомбардировщик II"
 jet_tac_bomber_equipment_2_short: "Бомбардировщик &lt; &lt; Джет Так II &gt; &gt;"
 jet_tac_bomber_equipment_2_desc: "Будущие реактивные бомбардировщики, не довольствуясь скоростью, будут устанавливать высоту и дальность полета, доставлять полезную нагрузку и осуществлять разведку в ходе межконтинентальных полетов."
 jet_tactical_bomber2: "$jet_tac_bomber_equipment_2$"
 jet_tactical_bomber2_desc: "$jet_tac_bomber_equipment_2_desc$"
 cv_nav_bomber_equipment_1: "Бомбардировщик I военно-морского флота"
 cv_nav_bomber_equipment_1_short: "Бомбардировщик I"
 cv_nav_bomber_equipment_1_desc: "Ранний бомбардировщик военно-морского флота был модифицирован для запуска и посадки на авианосцах."
 cv_naval_bomber1: "$cv_nav_bomber_equipment_1$"
 cv_naval_bomber1_desc: "$cv_nav_bomber_equipment_1$"
 cv_nav_bomber_equipment_2: "Бомбардировщик II военно-морского флота"
 cv_nav_bomber_equipment_2_short: "Бомбардировщик II"
 cv_nav_bomber_equipment_2_desc: "Усовершенствованный военно-морской бомбардировщик был модифицирован для запуска и посадки на авианосцах."
 cv_naval_bomber2: "$cv_nav_bomber_equipment_2$"
 cv_naval_bomber2_desc: "$cv_nav_bomber_equipment_2_desc$"
