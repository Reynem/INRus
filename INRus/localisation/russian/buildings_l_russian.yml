l_russian:
 infrastructure: "инфраструктура"
 infrastructure_plural: "инфраструктура"
 infrastructure_desc: "Это здание обеспечивает государство улучшением инфраструктуры. Это увеличивает мощность вашего снабжения в стратегических регионах и увеличивает скорость ваших подразделений."
 arms_factory: "Военная фабрика"
 arms_factory_plural: "Военные заводы"
 arms_factory_desc: "Это здание обеспечивает государство промышленностью по производству новой военной техники. При необходимости может быть преобразован в гражданскую промышленность."
 dockyard: "Морская верфь"
 dockyard_plural: "Морские верфи"
 dockyard_desc: "Это здание обеспечивает государство промышленностью для строительства новых судов."
 industrial_complex: "Гражданская фабрика"
 industrial_complex_plural: "Гражданские заводы"
 industrial_complex_desc: "Это здание обеспечивает государство промышленностью для производства гражданских товаров или строительства новых зданий. При необходимости может быть преобразован в военную промышленность."
 air_base: "Авиабаза"
 air_base_plural: "Воздушные базы"
 air_base_desc: "Это здание обеспечивает штат развертыванием ваших военно-воздушных сил."
 naval_base: "Военно-морская база"
 naval_base_plural: "Морские базы"
 naval_base_desc:1 "Расширяет ассортимент вашего автопарка и предоставляет услуги по его ремонту. Позволяет зарубежные поставки и экспорт ресурсов. Более высокие уровни увеличивают пропускную способность."
 bunker: "Земельный форт"
 bunker_plural: "Земельные форты"
 bunker_desc: "Это здание наносит атакующий штраф в размере $VALUE | +%0 $ за каждый уровень форта на атакующего в бою. Атака с нескольких направлений уменьшит эффект фортов."
 coastal_bunker: "Береговой форт"
 coastal_bunker_plural: "Прибрежные форты"
 coastal_bunker_desc: "Это здание наносит ударный штраф в размере $VALUE | +%0 $ за каждый уровень форта на нападавшего в бою с морским вторжением."
 anti_air_building: "противовоздушный"
 anti_air_building_plural: "противовоздушный"
 anti_air_building_desc: "Это здание обеспечивает государству защиту от вражеских бомбардировщиков и возможность вести огонь по атакующим самолетам."
 synthetic_refinery: "Синтетический нефтеперерабатывающий завод"
 synthetic_refinery_plural: "Синтетические нефтеперерабатывающие заводы"
 #synthetic_refinery_desc: "This building provides the state with +1 £resources_strip|3 and +2 £resources_strip|1."
 synthetic_refinery_desc: "Это здание обеспечивает государство"
