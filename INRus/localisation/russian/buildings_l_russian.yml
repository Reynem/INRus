 fuel_silo: "Топливный силос"
 fuel_silo_plural: "Топливный силос"
 fuel_silo_desc: "Это здание предоставляет вашей стране больше места для накопления запасов."

 landmark_statue_of_liberty: "Статуя свободы"
 landmark_statue_of_liberty_plural: "$landmark_statue_of_liberty$"
 landmark_statue_of_liberty_desc: "Огромная статуя Свободы с гордостью стоит в Нью-Йоркской гавани, крупном пункте въезда в Соединенные Штаты для иммигрантов, стремящихся начать новую жизнь."

 landmark_big_ben: "Большой Бен"
 landmark_big_ben_plural: "$landmark_big_ben$"
 landmark_big_ben_desc: ""Вестминстерская часовая башня", более известная как Биг Бен, является британской культурной иконой. Она была первоначально завершена в 1859 году в стиле готического возрождения и является третьей по высоте часовой башней в Великобритании. §!"

 landmark_colosseum: "Колосей"
 landmark_colosseum_plural: "$landmark_colosseum$"
 landmark_colosseum_desc: "Это самый большой древний амфитеатр, который когда-либо был построен римлянами и жителями города после падения римлян, для развлечения с момента его завершения императором Титом. §!"

 landmark_cristo_redentor: "Кристо Редентор"
 landmark_cristo_redentor_plural: "$landmark_cristo_redentor$"
 landmark_cristo_redentor_desc: "Он является национальным символом Бразилии и имеет большое значение для католиков в регионе."

 landmark_eiffel_tower: "Эйфелева башня"
 landmark_eiffel_tower_plural: "$landmark_eiffel_tower$"
 landmark_eiffel_tower_desc: ""Эйфелева башня" названа в честь своего создателя Густава Эйфеля и была закончена в 1889 году. "Железная леди", расположенная на чемпионате Марса в Париже, стала мировой культурной иконой Франции и символом национальной гордости."

 landmark_kremlin: "Кремль"
 landmark_kremlin_plural: "$landmark_kremlin$"
 landmark_kremlin_desc: "Внутри комплекса находится Большой Кремльский дворец, бывшая имперская резиденция императора России и нынешнее место в российском парламенте. Кремль не видит реки Москва на юге, собора Святого Басила и Красной Площадки на востоке, и Александр Гарден на западе. §!"

 landmark_berlin_reichstag: "Рейхстаг"
 landmark_berlin_reichstag_plural: "$landmark_berlin_reichstag$"
 landmark_berlin_reichstag_desc: "Это символическое здание, которое имеет большое значение в сердцах и умах людей."

 landmark_hofburg_palace: "Хофбургский дворец"
 landmark_hofburg_palace_plural: "$landmark_hofburg_palace$"
 landmark_hofburg_palace_desc: ""Хофбург" является главным императорским дворцом династии Габсбург и лицом к Холденплацу, Фольксгартену, и за его пределами, как Парламенту, так и мэрии Вены, окруженному множеством парков, это сердце Габсбургской монархии."

 landmark_white_house: "Белый дом"
 landmark_white_house_plural: "$landmark_white_house$"
 landmark_white_house_desc: "Белый дом является местом пребывания американского президента. Белый дом, находящийся в округе Колумбия, стал символом республики с момента его завершения в 1800 году.§!"

 landmark_winter_palace: "Зимний дворец"
 landmark_winter_palace_plural: "$landmark_winter_palace$"
 landmark_winter_palace_desc: "Зимний дворец является великолепным дворцом рококо, который раньше служил официальной резиденцией дома Романова до 1917 года, в центре Петрограда было много ключевых событий российских революций. Одна часть дворца - это музей Эрмитаж, а остальная часть - разрастающийся административный комплекс. Зимний дворец остается символом гордости для всей России."

 landmark_vozhd_liberator: "Вожд Освобождитель"
 landmark_vozhd_liberator_plural: "$landmark_vozhd_liberator$"
 landmark_vozhd_liberator_desc: ""Освободитель" стоит на берегу реки Харков и представляет собой 22-метровое бронзовое изображение Бориса Савинкова, сидящего на 29-метровом высоком неоклассическом пьедестале. Вожак, одетый в длинное пальто и приглядывающийся к Западу, стоит как героическая фигура над своим родным городом. В пьедестале вечно горит огонь для неизвестных солдат, которые отдали свои жизни во время Великой патриотической войны."

 landmark_sadabad_complex: "Саадабадский комплекс"
 landmark_sadabad_complex_plural: "$landmark_sadabad_complex$"
 landmark_sadabad_complex_desc: "Сооруженный династией Каджар, Саадабадский комплекс в северной части Тегерана служит королевским резиденцией и местом пребывания власти, его дворцы и сады отражают изменение политического ландшафта Персии, от консерватизма к модернизму."

 landmark_taj_mahal: "Тадж Махал"
 landmark_taj_mahal_plural: "$landmark_taj_mahal$"
 landmark_taj_mahal_desc: "Тадж-Махал является шедевром архитектуры Мугала, его огромные белые мраморные куполы и запутанные сады делают его одним из самых символических символов Индии, свидетельством как имперской власти, так и долговременного наследия."

 landmark_hagia_sophia: "София Хагия"
 landmark_hagia_sophia_plural: "$landmark_hagia_sophia$"
 landmark_hagia_sophia_desc: "Стоя на перекрестке империй, Хагия София была Византийским собором, мечеть Оттоман и символом постоянно меняющихся правителей Константинополя. Ее огромный купол и большие залы отражают как его духовное значение, так и амбиции тех, кто утверждал, что этот город является их собственным."
