 synthetic_refinery_resource: "£resources strip | $FRAME$"
 radar_station: "Радарная станция"
 radar_station_plural: "Радарные станции"
 radar_station_desc:3 "Радар позволяет получать информацию о войсках противника в близлежащих штатах. \nA более высокий уровень радара в состоянии увеличивает эффективную дальность действия радара.\nRadar также обеспечивает государству лучшее обнаружение воздушных сил противника, давая вашим самолетам больше шансов на их поражение.\n Кроме того, радар увеличивает обнаружение вражеских флотов на море."
 rocket_site: "Ракетный сайт"
 rocket_site_plural: "Ракетные площадки"
 rocket_site_desc: "Это здание обеспечивает государство развертыванием для выпускаемых ракет."
 nuclear_reactor: "Ядерный реактор"
 nuclear_reactor_plural: "Ядерные реакторы"
 nuclear_reactor_desc: "Это здание обеспечивает государство производством обогащенного урана для использования в ядерном оружии."
