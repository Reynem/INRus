 RULE_UNIT_LIMIT_OPTIONS: "Пределы подклассов"
 RULE_OPTION_STANDARD: "Применяется ко всем"
 RULE_UNIT_LIMIT_OPTIONS_STANDARD_DESC: "Пределы были применены к тому, сколько делений может построить АИ, основываясь на подсчетах на фабриках и на уровне экономического права. Как только АИ достигнет этого предела, они просто прекратят строить новые дивизии. Этот предел также применяется к игроку, хотя для них это мягкий верхний предел и они получают малус, основанный на том, как далеко они выстраиваются. n §Rnote, что это система, созданная для снижения неизбежного замедления, которое происходит по ходу игры, поскольку само число дивизий в действии является главной причиной системного отставания.§!"
 RULE_OPTION_AI_ONLY: "Применяется только к IA"
 RULE_UNIT_LIMIT_OPTIONS_AI_ONLY_DESC: "Были установлены ограничения в отношении того, сколько делений может построить АИ, исходя из их количества на фабриках и уровня экономического права. Как только АИ достигнет этого предела, они просто прекратят строить новые дивизии. В этой ситуации нет предела тому, сколько дивизий может построить игрок, кроме их способности предоставлять рабочую силу и оборудование. § §RПримечание, что это даст игроку значительное преимущество перед странами АИ, которые в противном случае были бы сопоставимыми. §!"
 RULE_OPTION_TURN_OFF: "Выключить"
 RULE_UNIT_LIMIT_OPTIONS_TURN_OFF_DESC: "Это полностью отключает систему пределов деления. ~n §RIt предлагается сделать это только в том случае, если вы либо не возражаете против того, чтобы играть скорость намного медленнее, пока игра продолжается, или у вас есть очень сильный компьютер для запуска игры.§!"

 RULE_DEMOB_OPTIONS: "Демобилизация в мирное время"
 RULE_OPTION_DEMOB_EXISTS: "По умолчанию"
 RULE_OPTION_DEMOB_EXISTS_DESC: "В мирное время игроку будет предложено сократить свои экономические нормы и/или законы о призыве до уровней, разрешенных в мирное время, и в соответствии с их $MODIFIER_WAR_SUPPORT_FACT$ в течение четырех месяцев. МА будет делать то же самое, хотя они будут делать это быстрее и будут стремиться к снижению своих законов до более низких уровней, чем это требуется игроку. Если установочные ограничения применяются к МА, то это также будет побуждать их сократить число единиц, которые они имеют для выполнения своих функций."
 RULE_OPTION_DEMOB_AI_ONLY: "Применяется только к IA"
 RULE_OPTION_DEMOB_AI_ONLY_DESC: "В мирное время МА приведет к сокращению своей экономики и/или законов о призыве на военную службу."
 RULE_OPTION_DEMOB_OFF: "Выключить"
 RULE_OPTION_DEMOB_OFF_DESC: "Ни игрок, ни ИИ никогда не будут подталкиваться к сокращению их экономики и/или законов о призыве в мирное время. ~n §RIt предлагается, чтобы вы делали это только если вы либо не возражаете против того, чтобы играть быстрее, чем игра продолжается, или у вас есть очень сильный компьютер для игры.§!"


