 ### Decisions ###

 restructure_supply_system: "Реорганизация железнодорожной системы"
 restructure_supply_system_desc: "Перенаправляя строительные материалы и железнодорожные рабочие, мы можем быстро создать небольшое количество самодельных свалок вдоль некоторых из наших железных дорог. Однако это не является устойчивым. Это решение может быть принято только один раз. Премии исчезнут, если вы будете строить более трех дополнительных центров снабжения. §!"
 seize_some_trains_woo: "Комендантские гражданские поезда"
 seize_some_trains_woo_desc: "Торговые железнодорожные компании имеют власть над нашей инфраструктурой."
 war_propaganda_casualties: "Экстремальный героизм"
 war_propaganda_casualties_desc: "Хотя число погибших растет, наш народ должен быть научен тому, что только в бою подделывают героев."
 war_propaganda_convoys: "Поощрять неустойчивость"
 war_propaganda_convoys_desc: "Даже гражданские лица могут помочь выиграть войну, заботясь о нашем материальном использовании, каждый грамм стали может быть в два раза дороже для военных усилий."
 war_propaganda_bombing: "Болстерские духи"
 war_propaganda_bombing_desc: "Несмотря на то, что вокруг нас падают бомбы, наши храбрые рабочие - солдаты, и именно благодаря этому духу мы одержим победу."
 war_support_during_war: "Военная поддержка"
 war_propaganda_radio_industry: "Радиопропаганда"
 war_propaganda_radio_industry_desc: "Технологии развиваются до такой степени, что значительная часть нашего населения имеет доступ к домашнему радио."
 war_propaganda_film_industry: "Домашняя киноиндустрия Комтилиз"
 war_propaganda_film_industry_desc: "В последнее десятилетие существенно развивалась индустрия кинофильмов (ROOT.Betaductive) с населением, голодающим из - за развлечений, мы можем воспользоваться кинематографической продюсерской работой, призванной вызвать патриотические чувства."
 DOMESTIC_FILM_INDUSTRY: "Домашняя киноиндустрия Комтилиз"
 IMPORTED_FILM_INDUSTRY: "Импорт объединённых пропагандских фильмов"
 DOMESTIC_FILM_INDUSTRY_DESC: "В последнее десятилетие существенно развивалась индустрия кинофильмов (ROOT.Betaductive) с населением, голодающим из - за развлечений, мы можем воспользоваться кинематографической продюсерской работой, призванной вызвать патриотические чувства."
 IMPORTED_FILM_INDUSTRY_DESC: "Наши благодетели и союзники используют пропагандистские фильмы в стратегических целях."
