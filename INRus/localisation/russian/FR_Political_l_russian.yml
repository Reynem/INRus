 ### Generic Faction Joining ###
 kr.political.10.t: "Альянс с [FROM. Возьмите NonIdeology NameDef]?"
 kr.political.10.d: "С их внутренними делами, кажется, что [FROM.GetNameDefCap] теперь смотрит наружу и как таковой хочет присоединиться к альянсу [ROOT.GetFactionName]. Должны ли мы принять их?"
 kr.political.10.a: "Сильнее вместе!"
 kr.political.10.b: "Вообще-то, нет..."

 kr.political.11.t: "Приняла!"
 kr.political.11.d: "Пора радоваться! Как мы и надеялись, мы приняли нашу просьбу присоединиться к [РООТ. Гетфакшн Наме]!"
 kr.political.11.a: "Отлично!"

 kr.political.12.t: "Отклонился!"
 kr.political.12.d: "К нашему огорчению, [From.GetNameDef] отказали нам в нашей просьбе присоединиться к [РООТ. Гетфакшн Наме]."
 kr.political.12.a: "Их потеря."

 kr.political.13.t: "Альянс с [FROM. Возьмите NonIdeology NameDef]?"
 kr.political.13.d: "Удивительный поворот событий - похоже, что [FROM.GetNameDef] ищет союзников, и поэтому пригласил нас присоединиться к [FROM.GetFactionName]."
 kr.political.13.a: "Сильнее вместе!"
 kr.political.13.b: "Вообще-то, нет..."

 kr.political.14.t: "Приняла!"
 kr.political.14.d: "Пора радоваться! Мы приняли наше приглашение присоединиться к [РООТ.Гетфайсменту], как мы и надеялись!"
 kr.political.14.a: "Отлично!"

 kr.political.15.t: "Отклонился!"
 kr.political.15.d: "К нашему огорчению, [From.GetNameDef] отклонили наше приглашение присоединиться к [РООТ. Гетфакшн Наме]."
 kr.political.15.a: "Их потеря."

 ### Incoming War-ning ###
 kr.political.30.t: "Приготовьтесь к войне!"
 kr.political.30.d: "Мы получили многочисленные сообщения о том, что войска [от GetAdguctive] собираются в настоящее время и что через [Рут.GetAdigit] границу проводится большая разведка, и военные говорят, что это очевидно [From.GetNameDef] планирует вторжение в [Root.GetNameDef], которое может начаться в любое время в течение следующих нескольких недель."
 kr.political.30.a: "Мы должны быть готовы!"
 kr.political.31.d: "Мы получили вызывающее тревогу сообщение [From.GetNameDef] о том, что [From.GetNameDef] в настоящее время собираются войска и что через границу [From.GetNameDef] проходит большая разведка, и военные говорят, что очевидно [From.GetNameDef] планируют вторжение [From.GetNameDef], которое может начаться в любое время в течение следующих нескольких недель."
 kr.political.32.d: "Мы получили сообщение от наших союзников в [From.GetNameDef] о том, что их войска в настоящее время собираются, и что большая разведка проходит через [наступление-нацеливание. Направляйся на] границу. [From.GetNameDef] планирует вторжение [нападение-нацеливание. GetNameDef], которое может начаться в любое время в течение следующих нескольких недель."


