 ### Ideology ###
 head_of_gov_available: "Глава правительства не может быть добавлена или удалена вручную. Они могут быть изменены только с помощью событий, фокусов, решений и т.д. ~ ~ Этот список представляет все возможные главы правительства для нации, так что люди здесь могут быть в противоречии с нынешней главой, в другой стране или даже мертвы."
 minister_available: "Министров нельзя добавлять или удалять вручную. Они могут быть изменены только с помощью событий, фокусов, решений и т.д. ~ ~ Этот список представляет всех возможных министров для нации, так что люди здесь могут быть в противоречии с нынешним правительством, в другой стране или даже мертвы."
 military_staff_available: "Этот военнослужащий жив и готов служить правительству."

