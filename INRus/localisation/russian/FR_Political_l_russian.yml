 ### Stability Events ###
 fr.political.1.t: "Упадок в стабильности!"
 fr.political.1.d: "Из-за отсутствия у нас в последнее время политической власти стабильность нашей страны ослабла, мы больше не очень стабильны."
 fr.political.1.a: "Всё хорошее должно закончиться."

 fr.political.2.t: "Упадок в стабильности!"
 fr.political.2.d: "Из-за недавнего отсутствия политической власти стабильность нашей страны ослабла, сейчас мы находимся на грани нестабильности."
 fr.political.2.a: "Это касается."

 fr.political.3.t: "Упадок в стабильности!"
 fr.political.3.d: "Из-за отсутствия у нас в последнее время политической власти стабильность в нашей стране ослабла, и теперь мы, как многие считают, неустойчивы."
 fr.political.3.a: "Это лишь временная ситуация."

 fr.political.4.t: "Упадок в стабильности!"
 fr.political.4.d: "С недавним отсутствием политической власти стабильность в нашей стране еще больше ослабла."
 fr.political.4.a: "Это не сулит ничего хорошего."

 fr.political.5.t: "Упадок в стабильности!"
 fr.political.5.d: "С недавним отсутствием политической власти наша страна погрузилась в катастрофу. Ситуация, в любом случае, катастрофа. Ходят слухи о революции и переворотах на улицах, люди теряют веру в наше правительство. Мы боремся за то, чтобы держать страну в руках."
 fr.political.5.a: "Это катастрофа!"

 fr.political.6.t: "Повысить стабильность!"
 fr.political.6.d: "С недавним усилением политической власти мы, наконец, начинаем восстанавливать контроль над ситуацией, однако мы все еще далеки от безопасности, по крайней мере, крупные беспорядки и разговоры о революции вновь превратились в гражданские забастовки."
 fr.political.6.a: "Худшее позади!"

 fr.political.7.t: "Повысить стабильность!"
 fr.political.7.d: "С нашим недавним ростом политической власти, конец уже близок, мы почти стабильны, если люди все еще не доверяют нам в полной мере, по крайней мере, они больше не чувствуют себя вынужденными к насилию и гневу."
 fr.political.7.a: "Мы почти вернулись к нормальной жизни."

 fr.political.8.t: "Повысить стабильность!"
 fr.political.8.d: "С нашим недавним ростом политической власти мы наконец-то вновь стабильны люди доверяют нам снова вести повседневный бизнес и спокойно вернуться на улицы, надеюсь, этого больше не повторится."
 fr.political.8.a: "[Звонок. GetNameDef] сильный."

 fr.political.9.t: "Потенциальное повышение стабильности"
 fr.political.9.d: "С недавним повышением политической власти у нас есть шанс улучшить нашу стабильность. Однако мы должны сделать это вручную. Для того чтобы достичь хорошей стабильности или очень хорошей стабильности, вам нужно будет принять соответствующий закон в Табле стабильности под законами и правительством в политическом экране, стоимость показана под опционом. ~ n ~ Заметьте, что вы рискуете быстро потерять все свои позитивные уровни стабильности, если вы когда-либо будете находиться под нулевой политической властью, так что убедитесь, что ваша страна действительно будет оставаться стабильной в краткосрочной и среднесрочной перспективе, делая инвестиции."
 fr.political.9.a: "Я понимаю, как поднять свою стабильность."

