 ### Minister Influences Ruling Party Events ###
 fr.political.16.t: "Министр поддерживает свою идеологию"
 fr.political.16.d: "Наше нынешнее правительство содержит министра другой идеологии. Он начал поддерживать свою собственную идеологию, которая наносит ущерб популярности нашей партии. Мы должны действовать сейчас, если мы хотим обратить его действия вспять."
