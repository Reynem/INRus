 fr.political.14.t: "Низкая популярность"
 fr.political.14.d: "Гражданская поддержка правящей партии достигла низкого уровня, что влияет на нашу политическую власть, и наша оппозиция достаточно сильна, чтобы сформировать против нас коалиции, заставляя нас часто консультироваться с ними и идти на компромисс."
