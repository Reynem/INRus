l_russian:
 entente_invasion_spirit: "Подготовка к вторжению в метрополь"
 entente_invasion_spirit_desc: "Возвращайся к праву рождения!"
 reichspakt_defense_spirit: "Защищайте немецкий Орден"
 reichspakt_defense_spirit_desc: "С кровью и Железом мы победим!"
 international_revolution_spirit: "Революционный дух"
 international_revolution_spirit_desc: "Разбей цепи!"
 decentralised_logistics_spirit: "Война питается сама собой"
 decentralised_logistics_spirit_desc: "Глубинные горы и огромные пространства Китая бросают вызов даже самым современным системам снабжения, но там, где грузовики и поезд не могут добраться до них, люди все еще найдутся, и в их руках лежит почти все, что армия должна оставаться на своих ногах. Не все будут сотрудничать, но это наша земля и это наш народ."
 KR_whampoa_academy_spirit: "Дух Вампоа"
 KR_whampoa_academy_spirit_desc: "Хотя академию, которая когда-то находилась на острове Чанчжоу в Гуанчжоу, с тех пор закрыта, ее дух живет в ее кадетах и инструкторах, которые продолжают бороться за революцию в Куоминтанге."
 KR_whampoa_academy_spirit_tt: "Новые офицеры: начать с любой §Y"Politically Connected"§!, §Y"Media Personality"§!, or §Y"War Hero"§! traits."
 jet_aircraft_advancements_spirit: "Гром в небе"
 jet_aircraft_advancements_spirit_desc: "Во время вечных волн времени, от волн перемен поднимется шторм, из бездны сверкают глаза демона, вот Разгриз, его крылья чёрных ножей!"

