l_russian:

 ### International Workers' Olympiad ###
 international_workers_olympiad_events.1.t: "Новый воздух в городе"
 international_workers_olympiad_events.1.d: "В последние несколько дней было что-то иное в атмосфере [iwo_host_city]; и нужно только спросить прохожих, почему это: несмотря на то, что она все еще была за неделю до даты церемонии открытия, спортсмены из всего социалистического мира постоянно прибывали, их число растет с каждым днем. Местное население позитивно взволновано, чтобы быть частью этого международного события, и счастливо связывается с путешественниками из-за границы, которые сейчас ведут наш город."
 international_workers_olympiad_events.1.a: "Воистину, это - дело веков."

 international_workers_olympiad_events.2.t: "Олимпиада трудящихся 1937 года"
 international_workers_olympiad_events.2.d: "Сегодня Международная Олимпиада трудящихся 1937 года была открыта в [Iwo_host_city]. На церемонии присутствовали высокопоставленные лица и спортсмены из всего социалистического мира. После парада через город-приниматель последовало массовое спортивное мероприятие, в результате которого собралась толпа десятков тысяч людей. В течение следующих нескольких дней спортсмены, как местные, так и зарубежные, примут участие в бесчисленных мероприятиях, таких, как атлетика, циклинг и футбол."
 international_workers_olympiad_events.2.a: "Какой славный день для рабочего!"

 international_workers_olympiad_events.5.t: "Граница дома"
 international_workers_olympiad_events.5.d: "Олимпия рабочих закончилась неделю назад, и она считается большим успехом. На короткое время [iwo_host_city] было местом, где многие народы нашего движения смогли обменяться мечтами, надеждами и идеалами, но все должно закончиться. Даже последние охотники начинают прыгать в поездах и автобусах, покидая город, перенося с собой воспоминания и истории, чтобы рассказать своим семьям и товарищам."
 international_workers_olympiad_events.5.a: "Жаль, что всё закончилось."

 international_workers_olympiad_events.23.t: "Выбор города-принимателя для Олимпийских международных рабочих"
 international_workers_olympiad_events.23.d: "В то время как предыдущие Олимпиады проходили в городах по всей Европе, в первую очередь на Играх 1931 года в Вене, ухудшение политического климата сделало Игры внутри синдикалистского блока наиболее безопасными, теперь нам предстоит выбрать место для пятой Олимпиады трудящихся."
 international_workers_olympiad_events.23.a: "Марсель подойдет."
 international_workers_olympiad_events.23.b: "В Британии Бирмингем будет хозяином."
 international_workers_olympiad_events.23.c: "Наши итальянские товарищи будут принимать в Турине."

 international_workers_olympiad_events.24.t: "Подготовка к Олимпиаде трудящихся"
 international_workers_olympiad_events.24.d: "Хотя в прошлом мы имели удовольствие принимать у себя Олимпию рабочих, которая была в Париже, а не в Марселе."
 international_workers_olympiad_events.24.a: "За работу, которую мы должны делать."

 international_workers_olympiad_events.25.t: "Бирмингем для проведения Олимпиады рабочих 1937 года"
 international_workers_olympiad_events.25.d: "Социалистический спортивный Интернационал трудящихся обратился к нам с просьбой об оказании помощи в планировании выпуска Международной Олимпиады трудящихся 1937 года. Игры должны состояться в Бирмингеме. Ожидается, что в этот раз количество участников превысит число участников, и мы сделаем лучше, чтобы Бирмингем мог справиться с таким событием."
 international_workers_olympiad_events.25.a: "За работу, которую мы должны делать."

 international_workers_olympiad_events.26.t: "Турин для проведения Олимпиады рабочих 1937 года"
 international_workers_olympiad_events.26.d: "Социалистический спортивный интернационал трудящихся обратился к нам с просьбой об оказании помощи в планировании выпуска Международной олимпиады трудящихся 1937 года. Игры должны состояться в Турине. Ожидается, что в этот раз количество участников превысит число участников, и мы сделаем лучше, чтобы город Турин смог справиться с событием такого размера."
 international_workers_olympiad_events.26.a: "За работу, которую мы должны делать."
