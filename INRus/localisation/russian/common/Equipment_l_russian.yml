 HOL_motorized_equipment_1_desc: "Система подвески &quot; Традо &quot; имела значительный коммерческий успех и применялась ко многим существующим и новым типам гражданских и военных грузовиков."walking beam" to the vehicle that significantly improved its cross-country performance."
