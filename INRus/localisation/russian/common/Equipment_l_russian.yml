 TRS_mechanized_equipment_1: "Saurer Transplanzer M.38/40"
 TRS_mechanized_equipment_1_short: "TPz M.38/40"
 TRS_mechanized_equipment_1_desc: "Потребность в бронетранспортере для механизированной пехоты привела к переоборудованию нескольких различных автомобилей для выполнения этой роли."box\" was added to the chasis that protected the driver and personnel inside. The deployment of these conversions helped cement the concept of armoured transports in Austrian doctrine."
 TRS_mechanized_equipment_2: "Вайс Манфред транспортмен М.39/42"
 TRS_mechanized_equipment_2_short: "TPz M.39/42"
 TRS_mechanized_equipment_2_desc: "В 1942 году венгерская компания &lt; &lt; Вайс Манфред &gt; &gt; начала превращать устаревшие автомобили &lt; &lt; Нимрод СПАТ &gt; &gt; в БТР и бронированные машины скорой помощи, прозванные венгерцами &lt; &lt; Леэль &gt; &gt; . &lt; &lt; Леэль &gt; &gt; оказалась выше TPz38/40 во всех отношениях с более сильными бронетранспортерами и лучшим двигателем."
 TRS_mechanized_equipment_3: "Skoda-MAVAG Transportpanzer M.40/44"
 TRS_mechanized_equipment_3_short: "TPz M.40/44"
 TRS_mechanized_equipment_3_desc: "Когда Австрия постепенно вывела из строя танк М.40 для M.42, первый был переоборудован, одним из которых был БТР, похожий на Lehel, с снятой батареей, а внутренний корпус был перестроен для размещения отряда Панзеринфантери."

