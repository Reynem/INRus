 #1891 Mosin
 UKR_infantry_equipment_0: "Гвинтивка Мосина-Нагана zr.91"
 UKR_infantry_equipment_0_short: "Hvyentivka zr.91"
 UKR_infantry_equipment_0_desc: "Мосин-Нагант 1891 года, аккумулированный в 7,62x54R, остался в качестве стандартной пехотной винтовки между немецкими и восточными союзниками после краха Российской империи, многие из которых сталкиваются с хронической нехваткой оружия и не могут изготовить новое оружие из России, местное производство винтовки продолжается в Украине, хотя и несколько устарело по сравнению с новыми винтовками Маузера, Мосин-Нагант остается дешевым и надежным оружием для украинской армии."
 #M/27 Mosin
 UKR_infantry_equipment_1: "Гвинтивка Мосина-Нагана zr.91/27"
 UKR_infantry_equipment_1_short: "Гвинтивка zr.91/27"
 UKR_infantry_equipment_1_desc: "M/27 представляет собой почти полную переработку оригинального Mosin-Nagant M1891, предусматривающую значительные улучшения в целях повышения точности и надежности. &quot; M/27 &quot; , сохраняя приемник и журнал своего предшественника, модернизирует достопримечательности, болт, новый штык и более короткий, но в то же время большой 685-миллиметровый ствол. &quot; M/27 &quot; , первоначально разработанный в Финляндии, с тех пор производится на Украине с лицензией, предлагающей более современную пехотную винтовку без отказа от существующих запасов или производственных линий."
 #Suomi
 UKR_infantry_equipment_2: "Пистолет-Кулемет, 1931 год"
 UKR_infantry_equipment_2_short: "ПК-31"
 UKR_infantry_equipment_2_desc: "Suomi KP/31 () — финская автоматная камера в широко используемой 9х19-мм пулеметной гильзе. В 1931 году ее новаторская конструкция и высокая скорость огня быстро привлекли внимание по всей Европе, что привело к широкому лицензированию и местному производству, в том числе в Украине."
 #G43
 UKR_infantry_equipment_3: "Самозариядна Гвинтивка zr.1942"
 UKR_infantry_equipment_3_short: "SH-42"
 UKR_infantry_equipment_3_desc: "Начавшийся Второй Велткриг стал свидетелем того, как российская армия развернула огромное количество военных винтовок SVT-40, предоставив им значительный предел огневой мощи. Хотя украинская армия не смогла эффективно принять немецкий SG-40 из-за того, что он был заперт в камере 7.92x57 Mauser, обратная инженерия, захваченная SVT, позволила украинской оружейной промышленности разработать новую винтовку в 7.62X54R. Хотя она основана главным образом на SG-40, SH-42 является более дешевым дизайном, который включает короткотактную газовую систему SVT и детахабельный журнал."

 UKR_infantry_weapons2: "Пистолет-Кулемет 1928 года"
 UKR_infantry_weapons2_short: "ПК-28"
 UKR_infantry_weapons2_desc: "В то время как концепция автоматизации оружия была хорошо доказана на втором этапе Велткрига, многие страны видят серьезную нехватку оружия. MP-28, улучшение предыдущего MP-18, разработанного Хьюго Шмейссером, является популярным выбором благодаря его относительной неустойчивости и доступности, а также готовности Шмайссера лицензировать дизайн."

 UKR_improved_infantry_weapons_2: "Карабин, 1939 год"
 UKR_improved_infantry_weapons_2_short: "Карабин, 1939 год"
 UKR_improved_infantry_weapons_2_desc: "По мере приближения Вельткрига возникла настоятельная потребность в дешевом и надежном оружии для задних эшелонов. &quot; Остстаатен &quot; принесла решение в виде значительно сокращенной версии винтовки &quot; Мосин-Нагант &quot; . &quot; Модель 1907 года &quot; , в которой нашли свое вдохновение разработки карбины и были учтены достижения финской модели M/27, была разработана новая карбина. &quot; Обезьян &quot; приготовила укороченную бочку и запасы оружия общей длиной всего 1 000 мм, что сделало его более компактным и простым для персонала, не находящегося на границе."

