 #Dodge 1/2-ton 4x4 improved to GCKW 353 standard:
 WCA_motorized_equipment_1: "Додж, 1937 год, 2 с половиной тонны"
 WCA_motorized_equipment_1_short: "ДМЯ"
 WCA_motorized_equipment_1_desc: "DMJ — это классический армейский грузовик мощностью 6x6 2 с половиной тонн, разработанный в 1937 году по просьбе армии США с началом гражданской войны в США, объекты «Додж» были захвачены WCA, а производство грузовика началось для Континентальной армии."
 #M2 Half-track:
 WCA_mechanized_equipment_1: "Белый мотор, полутрековый автомобиль, перевозчик, модель 6"
 WCA_mechanized_equipment_1_short: "WM-6 Автомобиль типа &quot; полутэк &quot;"
 WCA_mechanized_equipment_1_desc: "WM-6 — это бронированный полутрековый проект, разработанный французскими полутреками, разработанный недавно захваченными White Motors, WM-6 является многоцелевым грузовиком, который может служить в качестве военнослужащего, артиллерийского трактора или разведывательных машин."
 #M3 Half-track:
 WCA_mechanized_equipment_2: "Континентальная армия, полутрак, перевозчик, модель 9"
 WCA_mechanized_equipment_2_short: "CA-9 Полуслойка"
 WCA_mechanized_equipment_2_desc: "CA-9 — это разработка WM-6, разработанная внутри Континентальной армией. Новая полупутевая версия WM-6, оснащенная двумя пулеметами М-3 М1919 и пулемётом В2, а также задней дверью и пятью дополнительными сиденьями сзади."
 #M5 Half-track:
 WCA_mechanized_equipment_3: "Континентальная армия, полутрак, перевозчик, модель 11"
 WCA_mechanized_equipment_3_short: "CA-11 Полутрещина"
 WCA_mechanized_equipment_3_desc: "Автомобиль CA-10 был разработан одновременно с CA-9 в качестве более тяжелой альтернативы этому автомобилю."
