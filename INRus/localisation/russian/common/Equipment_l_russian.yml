 PAP_infantry_equipment_2_desc: "После отказа от полуавтоматической винтовки 1938 года компания &quot; CZ &quot; попыталась продать этот дизайн различным зарубежным странам. &quot; Две сицилии &quot; провели испытания винтовки, и, как и австрийцы, обнаружили, что эта винтовка ненадежна в тяжелых условиях и ее трудно разобрать, но попыталась переоборудовать пистолет, чтобы устранить ее недостатки. &quot; P МСП &quot; , которая приступила к производству и проектированию стрелкового оружия всего лишь несколько лет назад, была поставлена перед этой задачей. &quot; конечный результат &quot; , назначив &quot; МСП М38 &quot; после принятия, хотя и был усовершенствован по сравнению с чешским предшественником, все еще несет на себе многие из проектных причуд &quot; ."

