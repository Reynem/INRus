 DEI_motorized_equipment_1: "DAF Trado"
 DEI_motorized_equipment_1_short: "DAF Trado"
 DEI_motorized_equipment_1_desc: "Система подвески &quot; Традо &quot; имела значительный коммерческий успех и применялась ко многим существующим и новым типам гражданских и военных грузовиков."walking beam" to the vehicle that significantly improved its cross-country performance."
 DEI_mechanized_equipment_1: "Сверхвалваген Брайата"
 DEI_mechanized_equipment_1_short: "Перерасчет"
 DEI_mechanized_equipment_1_desc: "В 1940 году на базе грузового автомобиля &quot; Шевролет ИПК &quot; ( &quot; Кэб оф Шасси &quot; ) был установлен корпус с наклоном 20 мм толщиной в переднем галактике и 12 мм толщиной в боковых и задних сторонах. &quot; Главная кабина &quot; насчитала одну бронированную панель с навесными панелями и полосу бокового обзора, в то время как командующая получила трехличное место, в котором находился охлажденный воздухом пулемет калибра 30 (7,62 мм) или жидко охлажденный пулемет (3,03 (7,7 мм) &quot; Виккерс &quot; и задний люк."
