 URG_infantry_equipment_0: "Fusil Mauser Modelo 1895"
 URG_infantry_equipment_0_short: "Модель 1895 года"
 URG_infantry_equipment_0_desc: "В ответ на агрессивную программу аргентинского вооружения Чили приняла модифицированный Маузер 1893 года (обычно известный как Испанский Маузер) в камере 7х57мм Маузер и заключила контракт с немецкой компанией DWM (Deutsche Waffen und Businessabilitiesfabriken) на более чем 100 000 винтовок и карабинов на этой схеме. &quot; Чилийский Маузер &quot; 1895 года завоевал репутацию за надежность даже в самых тяжелых условиях, которые сохраняются спустя десятилетия после ее принятия. &quot; Уругвай &quot; закупил значительное количество этих винтовок для замены своих винтовок &quot; stiggap Dovitias &quot; ."
 URG_infantry_equipment_1: "Zbrojovka Brno Mauser Modelo 1932"
 URG_infantry_equipment_1_short: "Модель 1932 года"
 URG_infantry_equipment_1_desc: "Zbrojovka Brno Version 1932 — легкая и упрощенная версия старой версии Brno 1924-го карбина, помещенная в 7,65×53-мм Маузер. Уругвай купил несколько тысяч таких винтовок в 1933 году и быстро начал мелкомасштабное внутреннее производство."
