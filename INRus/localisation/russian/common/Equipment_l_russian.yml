 WCA_motorized_rocket_equipment_desc: "Грузовик DMJ с установленной ракетной пусковой установкой CA-28 известен как "Xylophone"."
 WCA_motorized_rocket_equipment_1: "Додж, 1937 год, 2 с половиной тонны, CA-28"
