 #fwd h-6 2 tons improved:
 APG_motorized_equipment_1: "Правительство Форда, крупногабаритное, пассажирское, FWD"
 APG_motorized_equipment_1_short: "ГЛФЖР"
 APG_motorized_equipment_1_desc: "GLPFWD, также известный как Jeelp, — Ford модификация грузовика H-6, разработанного компанией FWD в 1930 году. Разработка самого автомобиля началась до начала гражданской войны в Америке и продолжалась под наблюдением правительства мятежников. H-6 был восстановлен на 6x6 базе, а его мощность была увеличена до 2,2 тонны за счет адаптации уроков, извлеченных из разработки автомобиля ACKW генералом Моторсом и армией США."
 #M5 tractor combined with M4:
 APG_mechanized_equipment_1: "Трактор высокой скорости, 13 тонн, модель 1939A2, перевозчик, личный состав"
 APG_mechanized_equipment_1_short: "M1939A2 Тягач"
 APG_mechanized_equipment_1_desc: "Трактор M1939 был разработан на шасси танка M3 "Lee", который был запрошен армией в 1939 году в качестве главного артиллерийского перевозчика, в 1940 году он был перестроен как военнослужащий. "M1939A2" может перевозить 10 солдат и монтировать два ствола Браунинга."
 #Experimental 6X6 Ford Artillery Tractor :
 APG_mechanized_equipment_2: "Бронированный автомобиль, перевозчик, личный состав, модель 1942 года"
 APG_mechanized_equipment_2_short: "M1942 Автомобиль-перевозчик"
 APG_mechanized_equipment_2_desc: "В начале 1942 года Армия переоборудовала грузовик Ford 6x4 для выполнения функций военно-транспортного аппарата. &quot; M1942 &quot; представляет собой автомобиль с низкой интенсивностью, высокой подвижностью и легкой бронетранспортерностью, способный выполнять различные функции. &quot; M1942 &quot; , обладающий более высокой скоростью, чем его предшественник, трактор M1939, автомобиль M1942, представляет собой большой шаг вперед в проектировании американского авианосца."
 #T16 Diamond T half-track:
 APG_mechanized_equipment_3: "Полутрека, перевозчик, персонал, модель 1943 года"
 APG_mechanized_equipment_3_short: "М1943 Полупояса"
 APG_mechanized_equipment_3_desc: "Компания &quot; Даймонд Т &quot; разработала &quot; Полутрак &quot; М1943 года на основе проекта &quot; М1939 &quot; и &quot; Герман &quot; с упором на взаимозаменяемость запчастей с коммерческими транспортными средствами. &quot; М1943 &quot; , хотя и легко бронированная машина, особенно быстро передвигается по неровной местности."
 #fwd h-6 2 tons improved to GCKW 353 standard:
