 BAT_mechanized_equipment_1: "Sonderkraftfahrzeug 11"
 BAT_mechanized_equipment_1_short: "Sd.Kfz. 11"
 BAT_mechanized_equipment_1_desc: ""Sonderkraftfahrzeug 11" был разработан с 1934 по 1938 год с участием компании "Borgward AG", и с 1937 года проект стал ассоциироваться с компанией "Ganoversche Maschinenbau AG"."
 BAT_mechanized_equipment_2: "Sonderkraftfahrzeug 251"
 BAT_mechanized_equipment_2_short: "Sd.Kfz. 251"
 BAT_mechanized_equipment_2_desc: "Разработан на шасси Sd.Kfz 11, Schützenpanzerwagen Sonderkraftfahrzeug 251 полутреков (обычно именуемых \"SPW\") are built by Hannoversche Maschinenbau AG specifically to quickly transport a squad of infantrymen to the front lines with adequate armour protection from small arms fire. The truck examples are usually assigned to armour units for the purpose of helping troops stay right behind the fast moving tanks."
 BAT_mechanized_equipment_3: "Sonderkraftfahrzeug 256"
 BAT_mechanized_equipment_3_short: "Sd.Kfz. 256"
 BAT_mechanized_equipment_3_desc: "В конце 1943 года германская армия попросила Автосоюз разработать легкую, полностью отслеживаемую разведывательную машину, которая могла бы перевозить 6-8 человек в открытой верхней верхней верхней части конструкции. В 1944 году был введен Schwerer Schützenpanzerwagen Kätzchen (Heavy Armand Carrier 'Kitten') с такой же формой корпуса, как и корпус Stu.Pz.Kpfw. VII, но гораздо меньше. Автомобиль имеет передний привод с пятью или шестью перекрывающимися стальными колесами и предназначен для достижения скорости свыше 50 км/ч и имеет легкие бронежилеты. Теплая встреча немецких военных, несмотря на не очень высокую скорость, была принята на эксплуатацию под названием Sd.Kfz 256."

