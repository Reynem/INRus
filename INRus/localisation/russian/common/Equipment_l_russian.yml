 SUR_motorized_equipment_1: "DAF Trado"
 SUR_motorized_equipment_1_short: "DAF Trado"
 SUR_motorized_equipment_1_desc: "Система подвески &quot; Традо &quot; имела значительный коммерческий успех и применялась ко многим существующим и новым типам гражданских и военных грузовиков."walking beam" to the vehicle that significantly improved its cross-country performance."
 SUR_mechanized_equipment_1: "Сверхвалваген Брайата"
 SUR_mechanized_equipment_1_short: "Перерасчет"
 SUR_mechanized_equipment_1_desc: "В 1940 году на базе грузового автомобиля &quot; Шевролет ИПК &quot; ( &quot; Кэб оф Шасси &quot; ) был установлен корпус с наклоном 20 мм толщиной в переднем галактике и 12 мм толщиной в боковых и задних сторонах. &quot; Главная кабина &quot; насчитала одну бронированную панель с навесными панелями и полосу бокового обзора, в то время как командующая получила трехличное место, в котором находился охлажденный воздухом пулемет калибра 30 (7,62 мм) или жидко охлажденный пулемет (3,03 (7,7 мм) &quot; Виккерс &quot; и задний люк."
 SUR_mechanized_equipment_2: "Штандерваген М.42"
 SUR_mechanized_equipment_2_short: "Psw. M.42"
 SUR_mechanized_equipment_3: "Штандерваген М.44"
 SUR_mechanized_equipment_3_short: "Псв. М.44"

 SUR_gw_tank_equipment: "Карден Лойд Мк VI"
 SUR_gw_tank_equipment_short: "V-CL Mk VI"
 SUR_gw_tank_equipment_desc: "Королевская голландская армия имела лишь горстку либо устаревших, либо изношенных бронированных машин, двенадцать отличных шестиколесных бронированных грузовиков DAF M39 и пять танкетов Carden Loyd Mark VI по имени Линкс, Поема, Ягуар, Пантер и Луипаард."
 SUR_light_tank_equipment_1: "DAF M39 &quot; Штандерваген &quot;"
 SUR_light_tank_equipment_1_short: "DAF M39"
 SUR_light_tank_equipment_1_desc: "В свое время DAF M39 был современным дизайном с полностью сваренным монококом корпуса и широким использованием наклонных бронежилетов. &lt; &lt; Лэндсверк &gt; &gt; произвел в Швеции турнир с относительно мощной 37-миллиметровой пушкой. &lt; &lt; Лэндсверк &gt; &gt; легко бронированный и относительно быстрый, с хорошей способностью пересекать страну."
 SUR_light_tank_equipment_2: "CTMS-1TB1"
 SUR_light_tank_equipment_2_short: "CTMS-1TB1"
 SUR_light_tank_equipment_2_desc: "Проект CTMS-1TB1 был начат Marmon-Herrington с целью выпуска для голландской армии легкого танка в составе трех человек, который был вооружен автоматом калибра 37 мм и коаксиальным пулемётом M1919, первоначально предназначавшимся для отправки 600 из них в Голландскую Ист-Индию, однако кампания закончилась слишком рано для отправки прототипов."
 SUR_light_tank_equipment_3: "MTLS-1G14"
 SUR_light_tank_equipment_3_short: "MTLS-1G14"
 SUR_light_tank_equipment_3_desc: "Проект &quot; MTLS-1G14 &quot; был начат одновременно с проектом CTMS-1TB1 для производства четырехместного среднего танка для голландской армии, который был вооружен двумя автоматическими пушками калибра 37 мм, а также был оснащен пятью пулеметами М1919, три из которых были установлены на корпусе, один установлен коаксиально и один установлен на верхней части турнира. &quot; Бронз &quot; была застегнута и измерена в пределах 13-38 мм."
 SUR_light_tank_aa_equipment_3: "Мозг АА"
 SUR_light_tank_aa_equipment_3_short: "Мозг АА"
 SUR_light_tank_aa_equipment_3_desc: "Противовоздушная пушка, установленная на шасси овервалвагена Брата."

