 #Infantry Equip

 GEO_infantry_equipment_0: "1891 tslis Mosinis Sistemis Shashkana"
 GEO_infantry_equipment_0_short: "Ш-91"
 GEO_infantry_equipment_0_desc: "Мосин-Нагант 1891 года, аккумулированный в 7,62x54R, остался в качестве стандартной пехотной винтовки между немецкими и восточными союзниками после краха Российской империи, многие из которых сталкиваются с хронической нехваткой оружия и не могут изготовить новое оружие из России, местное производство винтовки продолжалось в Польше, Украине и других Остстаате со сложившейся оружейной промышленностью. Хотя несколько устарело по сравнению с новыми винтовками Маузера, Mosin-Nagant остается дешевым и надежным оружием."
 GEO_infantry_equipment_1: "1891/27 tslis Mosinis Sistemis Shashkana"
 GEO_infantry_equipment_1_short: "Ш-91/27"
 GEO_infantry_equipment_1_desc: "M/27 представляет собой почти полную переработку оригинального Mosin-Nagant M1891, включающую значительные улучшения в целях повышения точности и надежности. &lt; &lt; M/27 &gt; &gt; , сохраняя приемник и журнал своего предшественника, модернизирует достопримечательности, болт, новый штык и более короткий, но в то же время большой 685-миллиметровый ствол. &lt; &lt; M/27 &gt; &gt; , первоначально разработанный в Финляндии, с тех пор начал подменять старый &lt; &lt; Мосин-Нагант &gt; &gt; по всей Восточной Европе, предлагая своим войскам более современную пехотную винтовку без отказа от существующих запасов или производственных линий."
 #Suomi KP/31:
 GEO_infantry_equipment_2: "1931 г. Цлис Пистолет-Тквиамперквеви"
 GEO_infantry_equipment_2_short: "PT-31"
 GEO_infantry_equipment_2_desc: "Suomi KP/31 — это финская автоматная камера, помещенная в широко используемую 9х19-мм пулеметную кассету Parabellum. Вход в 1931 году ее новаторский дизайн и высокая скорость огня быстро привлекли внимание по всей Европе, что привело к широкому лицензированию и местному производству. В Украине отечественное производство позволило осуществлять крупномасштабный экспорт в Грузию, где Суоми постепенно заменила стандартный автомат Schmeisser MP-28."
 #SVT-40:
 GEO_infantry_equipment_3: "1940 цлис Твитмтени Шашкана"
 GEO_infantry_equipment_3_short: "Ш-40"
 GEO_infantry_equipment_3_desc: "В начале второго вольткрига российская армия развернула огромное количество полуавтоматической винтовки SVT-40, дав своим силам значительный предел огневой мощи. &quot; Изолировавшись &quot; от остальной Европы, Грузия оказалась без собственной самозарядной винтовки, что сделало захваченные СВТ весьма желательным активом. &quot; После успешной реорганизации конструкции &quot; грузинская оружейная промышленность смогла произвести небольшое количество этих винтовок для вооруженных сил."

 GEO_infantry_weapons2: "1928 tslis Smaiseris Sistemis Pistolet-Tqviamprkvevi"
 GEO_infantry_weapons2_short: "ПТ-28"
 GEO_infantry_weapons2_desc: "В то время как концепция автоматизации оружия была хорошо доказана на втором этапе Велткрига, многие страны видят серьезную нехватку оружия. &lt; &lt; Остстаатэн &gt; &gt; не может обеспечить стандартный MP-40 немецкой армии, часто приходится делать то, что доступно на рынке через частные фирмы. &lt; &lt; MP-28 &gt; &gt; -- усовершенствование ранее разработанного &lt; &lt; Хьюго Шмиссера &gt; &gt; MP-18 -- является популярным выбором благодаря своей относительной неустойчивости и доступности, а также готовности &lt; &lt; Шмиссера &gt; &gt; лицензировать дизайн."

 GEO_improved_infantry_weapons_2: "1939 tslis Mosinis Sistemis Karabini"
 GEO_improved_infantry_weapons_2_short: "К-39"
 GEO_improved_infantry_weapons_2_desc: "По мере приближения Вельткрига возникла настоятельная потребность в дешевом и надежном оружии для задних эшелонов. Для Остстаатена решение пришло в виде значительно сокращенной версии винтовки Mosin-Nagant. На основе модели 1907 карбина и с учетом усовершенствований дизайна финской системы M/27 был разработан K-39."

