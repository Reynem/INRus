 ### Land ###

 QIE_infantry_equipment_0: "Тип 88"
 QIE_infantry_equipment_0_short: "Тип 88"
 QIE_infantry_equipment_0_desc: "Изначально в результате усилий, предпринятых в эпоху «самоукрепления», Type 88 был разработан как копия немецкого Gewehr 88 с модификацией экспорта. Хотя в совокупности он ниже новых винтовок, несмотря на улучшения и часто плохое техническое обслуживание, известно, что оружие было изогнутым и надежным, если оно было неуправляемым. ~nnn this разновидность производится главным образом в Hanyang Arsenal, месте конструкции модели, хотя нехватка оборудования часто видит, что оно используется вместе с нестандартным оружием."
 QIE_infantry_equipment_1: "Ханьян типа 27"
 QIE_infantry_equipment_1_short: "Ханьян типа 27"
 QIE_infantry_equipment_1_desc: "Официально названная "Тип 27", эта винтовка была введена в эксплуатацию в 1935 году благодаря германской помощи после восстановления Цинга. В функциональном отношении это оружие является почти копией немецкого Mauzer M1924 и значительным улучшением по сравнению с гораздо более старым типом 88 с точки зрения веса и оттока. ~nnnn/Эта разновидность производится главным образом в Ханьян-Арсенале немецкими инструментами, хотя она может не полностью заменить своих предшественников в течение некоторого времени."
 QIE_infantry_equipment_2: "Tsingtao MP18"
 QIE_infantry_equipment_2_short: "Tsingtao MP18"
 QIE_infantry_equipment_2_desc: "Благодаря наводнению в начале 1920-х годов избытка Велткрига на мировом рынке, MP18 увидела действия в Китае, прежде чем модифицированная версия начала производство в Цингтао. / n/n/С изменениями в журнале и запасах, этот конкретный продукт китайско-германского сотрудничества был копирован и продан по всему Северному и Южному Китаю, хотя главным образом правительству Цинга и военным баронам в прибрежных районах."
 QIE_infantry_equipment_3: "Тип 35"
 QIE_infantry_equipment_3_short: "Тип 35"
 QIE_infantry_equipment_3_desc: "Тип 35 — полуавтоматическая винтовка, основанная на винтовке генерала Лю с 1914 года. &lt; &lt; Тип 35 &gt; &gt; , хотя и выглядит аналогичным образом, короче, имеет заднюю часть приемного устройства, а газопроводная система заменена простым газовым портом. &lt; &lt; Новая винтовка &gt; &gt; также не может больше переключаться на ручные действия и использовать журналы из автомата &lt; &lt; Чехемия &gt; &gt; ZH-29 и легкого пулемета ZB-26."

