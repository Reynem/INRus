 ERI_infantry_equipment_0_desc: "В ответ на несколько коммерчески успешных короткометражных винтовок, изготовленных на основе Маузера 1898 года конкурирующими производителями оружия, компания &quot; Маузер &quot; разработала свой собственный умеренно сокращенный винтовку 1898 года. &quot; Маузер &quot; назвала &quot; стандартной моделью &quot; . Многие малые государства, включая Эфиопию, закупали эти новые ружья в больших квантитах; эфиопский вариант является старым из этих двух и симулятором в 7,65×53-ммм Маузере. С восстанием большое количество этих винтовок было захвачено Эритреей и стало главной винтовкой ее новых вооруженных сил."
