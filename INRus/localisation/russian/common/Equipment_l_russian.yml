 SPA_light_tank_equipment_1: "Типо 1933"
 SPA_light_tank_equipment_1_short: "Т-33"
 SPA_light_tank_equipment_1_desc: "Type 1933 является кульминацией длинной серии дизайнов компании Trubia, базирующейся на FT Renault. В то время как ранее модель 1925 года была опробована испанской армией, 1933 год был первым внутренним танком, который был официально принят испанскими военными."
 SPA_light_tank_equipment_2: "Типо 1936"
 SPA_light_tank_equipment_2_short: "Т-36"
 SPA_light_tank_equipment_2_desc: "Разработанный военным бюро с нуля, а не на основе любого другого автотранспортного средства, тип 1936 был значительно улучшен по сравнению с предыдущими испанскими конструкциями, хотя его 20-миллиметровая главная пушка Бреды не нравилась войскам, в противном случае автомобиль был надежным и хорошо востребованным."
 SPA_light_tank_equipment_3: "Типо 1941 "Вердежа""
 SPA_light_tank_equipment_3_short: "Т-41 "Вердежа""
 SPA_light_tank_equipment_3_desc: "Самый успешный проект был разработан молодым майором Феликсом Верджа Бардалесом, который был разработан с особым вниманием к защите своего моторного отсека и имел 45-миллиметровую главную пушечку."
