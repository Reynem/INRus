 EGY_infantry_equipment_2_desc: "Компания Mauser, созданная в ответ на желание немецкой армии самозарядить винтовку с резервным болтом, Selbstladegeweehr 40 стал огромным шагом вперед в разработке немецкого стрелкового оружия. Хотя первоначальные прототипы были весьма неточными, тяжелыми и склонными к глушению, немецкая армия в конечном итоге сняла некоторые другие конкретные требования к винтовке, и конечный результат, предшественник винтовки, которая в конечном итоге была принята, оказался эффективным."
