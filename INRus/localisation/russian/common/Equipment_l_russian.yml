 SHX_gw_armored_car_equipment: "Бронированная машина &lt; &lt; Шанкси &gt; &gt;"
 SHX_gw_armored_car_equipment_short: "Чжуаньцзя Цичэ"
 SHX_gw_armored_car_equipment_desc: "Партия бронированных автомобилей, модифицированных из грузовиков фабрики &lt; &lt; Сибэй Локомотив &gt; &gt; в Тайюане Янь Сишана, точное количество произведенных автомобилей неизвестно, но их общее количество, по оценкам, превышает 50, а автомобиль оснащен от одного до трех легких пулеметов."
 SHX_armored_car_equipment_1: "Шаньси Синхай типа 26"
 SHX_armored_car_equipment_1_short: "Тип 26"
 SHX_armored_car_equipment_1_desc: "Инженеры Яна Сишана вскоре подражали своим собственным бронированным машинам после получения тайной военной помощи от японцев. Эта бронированная машина является копией японского бронированного автомобиля типа 92, но дизайн тела заимствует некоторые аспекты из немецких бронированных машин в 1930-х годах."

 SHX_motorized_equipment_1: "Тип Jin Shanxi"
 SHX_motorized_equipment_1_short: "Тип Jin Shanxi"
 SHX_motorized_equipment_1_desc: "К сожалению, из-за узких дорог Шаньси и горной местности, а также технической блокады, введенной правительством Цина в отношении Шаньси, Ян Сишхану было трудно купить грузовики непосредственно у японцев. Поэтому в марте 1932 года он приказал инженеру Цзян Шутингу отправиться в Тяньцзин для переговоров с представителями Американской федеральной компании по автомобильному грузовику. В конечном итоге американцы согласились передать в Шанси 1,5 тонны грузовиков, а Цзян Шутинг использовал это в качестве основы для создания надежного и надежного типа Шанси к концу того же года."

