 ### Land ###

 # Mosin rifle, 1891 model :
 RUS_infantry_equipment_0: "Vintovka obr.1891"
 RUS_infantry_equipment_0_short: "Vintovka obr.1891"
 RUS_infantry_equipment_0_desc: "К 1936 году старая винтовка Mosin 1891 года была устаревшей, хотя и надежной. По сравнению с современными винтовками она длинная и тяжелая. Большинство из этих винтовок было переоборудовано в новый стандарт винтовки Mosin 1930 года."
 # Mosin rifle, 1891/1930 model :
 RUS_infantry_equipment_1: "Vintovka obr.1891/1930"
 RUS_infantry_equipment_1_short: "Vintovka obr.91/30"
 RUS_infantry_equipment_1_desc: "Винтовка Мосин 1930 года короче и легче, изначально основанная на драгуновом варианте винтовки. Новая стандартная винтовка российской армии является более легкой и надежной с менее подвижными частями, чем старая винтовка Мосин, при сохранении дальности и огневой мощи."
 # SVT-40 :
 RUS_infantry_equipment_2: "Самозариадная винтовка обёр.1940"
 RUS_infantry_equipment_2_short: "СВТ"
 RUS_infantry_equipment_2_desc: "В то время как AVS была первой автоматической винтовкой, разработанной в России, SVT Tokarev в конечном итоге был принят в качестве более надежного варианта. В отличие от полностью автоматической AVS, которая в значительной степени выведена на службу в специальных и пограничных войсках, SVT-40 является лишь полуавтоматической, но в этой роли она превосходит и совершенно сопоставима со своими коллегами в других странах."
 # PPSh-2 :
 RUS_infantry_equipment_3: "Автомат (pistolet-pulemiot) Obr.1943"
 RUS_infantry_equipment_3_short: "PPSh-2"
 RUS_infantry_equipment_3_desc: "PPSh-43, официально известный как PPSh-2, представляет собой развитие своего безумно успешного предшественника, автоматического пистолета PPSh. Он в целом дешевле и легче поддерживать, чем его предшественник. Массовое использование автоматов, разрешённое быстрым производством PPSh, было включено в доктрину и тактику российской мобильной пехоты, исходя из опыта, накопленного ранее в ходе войны."

 # PPD-34/38 :
 RUS_infantry_weapons2: "Пистолет-пулемиот обр.1934/1938"
 RUS_infantry_weapons2_short: "PPD-2"
 RUS_infantry_weapons2_desc: "В 1930-х годах полицейская оружейная семья является главным автоматом российской армии, однако в военной доктрине ей не хватает четкого места."
 # PPSh :
 RUS_improved_infantry_weapons_2: "Автомат (pistolet-pulemiot) Obr.1941"
 RUS_improved_infantry_weapons_2_short: "PPSh"
 RUS_improved_infantry_weapons_2_desc: "PPSh-41 был принят в качестве замены PPD-34/38 в качестве основного автомата российской армии после формирования подавляющей доктрины огневой мощи."
 # SKS :
 RUS_advanced_infantry_weapons2: "7,62-мм Самозариадни Карабин Одр.1945"
 RUS_advanced_infantry_weapons2_short: "ШКЗ"
 RUS_advanced_infantry_weapons2_desc: "SKS — это разработка винтовки Сергея Симонова AVS для новых 7,62-миллиметровых патронов, и она решает многие технические проблемы, которые существовали в оригинальной AVS. SKS является полуавтоматической боевой винтовкой, и с учетом ее звездной работы она, вероятно, полностью заменит SVT-40 и станет главной винтовкой российской армии - по крайней мере, до тех пор, пока автоматические винтовки нового поколения не будут разработаны в приемлемом состоянии."

 # PTRS :
 RUS_infantry_at: "Противотанковая Самозариадное Ружье обр.1941"
 RUS_infantry_at_short: "ГТП"
 RUS_infantry_at_desc: "PTRS - это самозарядная винтовка с пятикамерным журналом, и, несмотря на свою огневую мощь, она по-прежнему всего лишь противотанковая винтовка, и опыт показал нам, что она все больше противотанковая, чем разработка новых бронежилетов."
 # PTR-82 :
 RUS_infantry_at2: "Противотанковая реактивная ружская обвязка (1944 год)"
 RUS_infantry_at2_short: "ПТРО"
 RUS_infantry_at2_desc: "PTRO, разработанная группой под руководством Анатолия Островского, представляет собой противотанковую противотанковую винтовку, разработанную для борьбы с более современными бронированными машинами. PTRO является громоздкой, неуправляемой и требует от двух человек ее использования, но она, несомненно, мощная, более мощная, чем аналогичное оружие на западе."

 # Maxim M1930 and 82-BM-37 :
 RUS_support_weapons: "Стэнковый пулемиот обр.1910 & 82-мм обер.1937"
 RUS_support_weapons_short: "Максим & 82-мм микрономик"
 RUS_support_weapons_desc: "Сильная огневая мощь российского пехотного батальона сосредоточена на двух системах вооружения: пулемёте «Максим» 1930 года и сильно модифицированной версии британского 82-мм миномета «Стокс». Хотя Максим по современным стандартам является довольно старым пулеметом, несмотря на его модификацию; до принятия новых пехотных пулеметов он будет оставаться основой российской армии."

 # DShK and 50-RM-38 :
 RUS_support_weapons2: "Стэнковый пулемиот обр.1938 и 50-мм минометный обёр.1938"
 RUS_support_weapons2_short: "DSK & Osa"
 RUS_support_weapons2_desc: "ДШК является в значительной степени тяжелым пулеметом по сравнению с Максимом или DP-27, и в дополнение к его калибру он может применять противотанковые боеприпасы. &lt; &lt; ДШК &gt; &gt; остается в ограниченном количестве из-за его высокой цены и сложности. &lt; &lt; Пехотные минометы &gt; &gt; , новая 50-ммм модель &lt; &lt; Оса &gt; &gt; была введена в качестве оружия на уровне роты, с тем чтобы обеспечить каждому подразделению надежную огневую поддержку."

 # DP-39 and 120-PM-38 :
 RUS_support_weapons3: "Ruchnoy pulemyot obr.1940 & 120-мм обер.1938"
 RUS_support_weapons3_short: "RD & 120-мм микрономик"
 RUS_support_weapons3_desc: "RD-40 (Ruchnoy, Degtyaryov) — универсальный пулемет с поясом и его замена DP-27, который был разработан ранее Degtyaryov, повышая огневую мощь и общую производительность, хотя он по-прежнему является несколько хуже немецких MG. Кроме того, в качестве нового основного миномета для армии были введены новые, более тяжелые минометы на основе Stokes-Brandt 120-ммм, предназначенные для обеспечения мобильности и надежности в наступательных войнах."

 # SG-43 and 160-MT-13 :
 RUS_support_weapons4: "Stankovy pulemyot obr.1943 & 160-мм minomiot obr.1943"
 RUS_support_weapons4_short: "SG & 160-мм микрономик"
 RUS_support_weapons4_desc: "SG-43 разработана с учетом опыта войны, которая является ее непосредственным руководством, более легкой и надежной, чем Максим, и направлена на то, чтобы соответствовать реалиям современной, мобильной войны. В то же время разработка минометов привела к еще большему увеличению калибра, поскольку необходимость в более тяжелых пехотных средствах поддержки особенно проявилась в городских боях во время Великой патриотической войны."

 # Devices Vega-1 and Vega-2 :
 RUS_night_vision: "Прибор Вега"
 RUS_night_vision_short: "Вега"
 RUS_night_vision_desc: "Устройства ночного видения серии Вега по сути являются биноклем для тёмных условий. В зависимости от версии, диапазон обзора колеблется от 150 м до 500 м, хотя самые длинные диапазоны возможны только с фиксированными военно-морскими версиями под названием Омега. Будучи вторым поколением приборов ночного видения, Вега по-прежнему является очень громоздким и ненадежным устройством, требующим инфракрасных прожекторов и тяжелых батарей с ограниченным зарядом."

 # Device Mira :
 RUS_night_vision2: "Прибор &lt; &lt; Мира &gt; &gt;"
 RUS_night_vision2_short: "Мира"
 RUS_night_vision2_desc: "Устройство &quot; Мира &quot; является следующим шагом в устройствах ночного видения и официально обозначается как &quot; очки для солдат &quot; , которые состоят из биноклей, прикрепленных к шляпке с помощью монтажной системы. Однако устройство является тяжелым, должно быть прикреплено к источнику энергии и использовать отдельный инфракрасный проектор, но оно, тем не менее, является респектабельным в технологии близкого обзора."

 ###Motorised

 # AMO-F-15 :
 RUS_motorized_equipment_0: "Грузовская автомобильная АМО-Ф-15"
 RUS_motorized_equipment_0_short: "AMO-F-15"
 RUS_motorized_equipment_0_desc: "AMO-F-15 базируется на итальянском Fiat 15 и был принят в качестве главного военного грузовика российской армии в 1925 году. &quot; F-15 &quot; , возможно, уже устарела и была постепенно свернута в пользу &quot; AMO-3 &quot; , которая основана на &quot; Американском автокаре &quot; и была взята на службу в 1931 году. &quot; F-15 &quot; остается надежным рабочим конем армии, несмотря на ее возраст."
 # Represent GAZ-AA, GAZ-MM and GAZ-63 (OTL pre-war) trucks :
 RUS_motorized_equipment_1: "Грузовой автомобиль NAZ-63"
 RUS_motorized_equipment_1_short: "НАЗ-63"
 RUS_motorized_equipment_1_desc: "NAZ-63 - это грузовой автомобиль нового поколения, основанный на гражданском грузовике NAZ-51 и специально спроектированный как соответствующий полностью колесный военный грузовик, надежный и способный выдержать большую часть погоды и местности, которые могут возникнуть в России."

 # BM-13 :
 RUS_motorized_rocket_equipment_1: "Boyevaya avtoustanovka M-13"
 RUS_motorized_rocket_equipment_1_short: "М-13"
 RUS_motorized_rocket_equipment_1_desc: "Полная сальво одного грузовика — 16 132-мм реактивных снарядов, выпущенных без предупреждения и неточно, но с ужасным эффектом, когда в одну и ту же часть переднего фронта стреляет достаточно ракет."

 # ZiS-42 :
 RUS_mechanized_equipment_1: "AMO-42 Avtomobileany Polugusenichny avtomobile"
 RUS_mechanized_equipment_1_short: "АМО-42"
 RUS_mechanized_equipment_1_desc: "АМО-42, второй широко распространенный полупутевый путь в российской армии - это модификация ранее OKMO-VAN, решающая большинство ее предыдущих проблем. AMO-42 обладает тяжёлой силой, чтобы тянуть даже самую сильнейшую артиллерию, а также способность местности перевозить солдат через любое поле боя. Она не очень быстра, но состоит в ее надежности."
 # TB-42 :
 RUS_mechanized_equipment_2: "Бронетранспортер B-42"
 RUS_mechanized_equipment_2_short: "Б-42"
 RUS_mechanized_equipment_2_desc: "B-42 — это развитие AMO-42, привитое немецкими полутрековыми моделями."
 # B-3 :
 RUS_mechanized_equipment_3: "Бронетранспортер B-3"
 RUS_mechanized_equipment_3_short: "B-3"
 RUS_mechanized_equipment_3_desc: "B-3 разработан из неудавшегося артиллерийского трактора AT-3 с уроками, извлеченными из B-42. B-3 является мощным и надежным двигателем войны, любимым армией, но его недостаточная скорость и большой вес оставляют желать лучшего."

 #Modified Shitikov's armoured prime mover mixed with Pioneer B1:
 RUS_amphibious_mechanized_equipment_1: "Plavayuschy Tracktor PBT-37"
 RUS_amphibious_mechanized_equipment_1_short: "СБТ-37"
 RUS_amphibious_mechanized_equipment_1_desc: "В рамках подготовки к вторжению в Восточную Европу российским инженерам было поручено разработать речной транспортер. &quot; PBT-37 &quot; построен на шасси Т-37 с амфибийным приводом, комнатой для прохожих, копируемой из неудавшегося OKMO-STB1, и более толстыми бронежилетами, естественно, за счет огневой мощи. &quot; Бронированный трактор &quot; предназначен для единой цели, пересекающей Днепр, Двину и любые другие реки, стоящие между Россией и Берлином."
 #R-40
 RUS_amphibious_mechanized_equipment_2: "Бронетранспортер PTR-20"
 RUS_amphibious_mechanized_equipment_2_short: "PTR-20"
 RUS_amphibious_mechanized_equipment_2_desc: "Амфибийная модификация танка PT-20, PTR-20, гораздо тяжелее и больше, чем PBT-37, которая может перевозить более крупные грузы, но она также не является особенно изменчивой и ее амфибийные способности в лучшем случае являются медикором. Несмотря на это, PTR-20 все еще выполняет свою работу и может использоваться на поле боя без проблем."

 #Armoured Car

 # represent FAI, BA-20 and BA-20M :
 RUS_gw_armored_car_equipment: "Legky broneavtomobile BA-20"
 RUS_gw_armored_car_equipment_short: "БА-20"
 RUS_gw_armored_car_equipment_desc: "На основе RB-2, BA-20 — усовершенствованная версия более ранних моделей БТР OKMO. Она дешевая и надёжная, но очень недостаточная огневая мощь, поскольку используется главным образом для разведки."
 # BA-10 :
 RUS_armored_car_equipment_1: "Бронеавтомобильный BA-10"
 RUS_armored_car_equipment_1_short: "БА-10"
 RUS_armored_car_equipment_1_desc: "БА-10 построена на базе НАЗ-ААА с усиленным шасси и считается весьма успешной моделью с его достойной скоростью, вооружением и сильными бронетранспортерами."
 # LB-62 :
 RUS_armored_car_equipment_2: "Бронеавтомобильный BA-30"
 RUS_armored_car_equipment_2_short: "БА-30"
 RUS_armored_car_equipment_2_desc: "BA-30 — это современная замена BA-20, она вооружена двумя легкими и одним тяжелыми пулеметами, имеет высокую скорость для своего веса и мощные бронежилеты для своей роли в качестве разведывательных и вспомогательных машин."
 # BA-11D/GAZ-33 :
 RUS_armored_car_at_equipment: "Бронеавтомобильный BA-12"
 RUS_armored_car_at_equipment_short: "BA-12"
 RUS_armored_car_at_equipment_desc: "Усовершенствованная версия BA-11, BA-12 имеет дизельный двигатель и является особенно тяжелым бронированным автомобилем для бронированного автомобиля."

 ###Trains
 # Series FD # Name means “Heavy, Kolomna" :
 RUS_train_equipment_1: "Parovoz serii Tk"
 RUS_train_equipment_1_short: "Серия Tk"
 RUS_train_equipment_1_desc: "Tk — это современная серия поездов, предназначенная для замены старой серии I, разработанной фабрикой Коломна. Она гораздо более мощна в качестве локомотива, но также гораздо сложнее для производства, чем старые поезда."
 # Series SO # Name is chosen from available letters in the Russian naming scheme :
 RUS_train_equipment_2: "Павроз Серии Я"
 RUS_train_equipment_2_short: "Серия &lt; &lt; Ya &gt; &gt;"
 RUS_train_equipment_2_desc: "Серия Ya является сложным модернизацией к старой серии , расширяя свои возможности до максимума. Она несколько слабее для серии Tk, но намного легче производить и лучше соответствовать условиям войны. По существу, они лишены всего ненужного."
 # BP-43 armoured train composition :
 RUS_train_equipment_3: "Бронепойезд BP-41"
 RUS_train_equipment_3_short: "BP-41"
 RUS_train_equipment_3_desc: "BP-41 - это разработка OKMO OB-3. Она оснащена наклонными бронежилетами, надлежащими бронированными батареями, объединенными с танками, и в целом рациональной конфигурацией для специального военного использования, с прикрепляемыми к ним защитные вагоны AA. Она также может стать последним и лучшим надлежащим военным поездом, поскольку развитие технологии быстро оставляет позади бронированные поезда."

 # TP-1 :
 RUS_railway_gun_equipment_1: "Железнодорожный транспорт TP"
 RUS_railway_gun_equipment_1_short: "TP"
 RUS_railway_gun_equipment_1_desc: "TP-1 вооружен массивным 356-мм железнодорожным пистолетом и разминирован специально для того, чтобы армия могла соответствовать как роли наступательной артиллерии, так и стационарной оборонительной артиллерии."

 ###Artillery

 # 76-mm M1933 F-19 :
 RUS_artillery_equipment_1: "76-мм тупая обёр.1933"
 RUS_artillery_equipment_1_short: "F-19"
 RUS_artillery_equipment_1_desc: "76-мм F-19 является главным дивизионным оружием российской армии, принятым в качестве временной меры, несколько устаревшим и посредственным к 1930-м годам, но до тех пор, пока не появится новая модель массового производства, F-19 станет основой российской артиллерии."
 # 76-mm F-22-USV :
 RUS_artillery_equipment_2: "76-мм тупая обёр.1939"
 RUS_artillery_equipment_2_short: "F-22"
 RUS_artillery_equipment_2_desc: "76-мм F-22 был разработан Василием Грабином как «совершенствование» ранее отвергнутого F-22, но, несмотря на это, это совершенно новый пистолет. F-22 оказался очень надежным дизайном, иногда описываемым как идеально сбалансированный в своих возможностях и благодаря тому, что этот пистолет стал надежным коньком российской артиллерии."
 # 76-mm ZIS-3 :
 RUS_artillery_equipment_3: "76-мм тупая обвязка 1942 года"
 RUS_artillery_equipment_3_short: "Ф-43"
 RUS_artillery_equipment_3_desc: "F-43 — еще один дизайн Василия Грабина, предназначенный для замены старых F-22. F-43 — легкий, легкий в использовании, легкий в производстве, но как доказательство блестящего дизайна, все еще без реальных жертв в своих боевых возможностях."

 # 152-mm mortar ML-21 :
 RUS_interwar_artillery: "152-мм мортира обр.1937"
 RUS_interwar_artillery_short: "М-21"
 RUS_interwar_artillery_desc: "152-мм миномет M1931, лицензированный из Рейнметалла, был дополнительно усовершенствован Мотовилихой для создания M-21. В качестве дивизионного миномета М-21 стоит на месте, где он не является достаточно мощным по сравнению с дивизионной артиллерией и не является достаточно широко распространенным для того, чтобы служить в качестве прямого вспомогательного миномета, как минометы меньшего калибра."
 # 122-mm howitzer F-25 :
 RUS_artillery2: "122-мм гаубита обёр.1938"
 RUS_artillery2_short: "F-25"
 RUS_artillery2_desc: "F-25 — это подходящий современный дивизионный гаубиц с некоторым дефицитом вагона. Он имеет 122-мм калибр и достойные боевые действия, но его реальная способность исходит от большого числа, в котором используются F-25."
 # modernized 152-mm howitzer-gun M1937 ML-20 :
 RUS_artillery3: "152-мм гаубитса-пушка обёрт.1937"
 RUS_artillery3_short: "М-20М"
 RUS_artillery3_desc: "152-мм гаубица М-20 является самодельным пистолетом, и одним из лучших успехов в обычно посредственных российских гаубиц. Карета F-20 также служит ядром нескольких самоходных пушек. 152-мм гаубицы Мотовилихи очень многообразны, способные управлять как прямым, так и косвенным огнем, имеют очень сильные снаряды, но относительно тяжелые и громоздкие для транспортировки."
 # 152-mm howitzer D-1 :
 RUS_artillery5: "152-мм гаубита обёр.1942"
 RUS_artillery5_short: "М-35"
 RUS_artillery5_desc: "152-миллиметровый гаубиц М-35 является по сути развитием M-10 Motovilika."

 # 45-mm M1937 53-K :
 RUS_anti_tank_equipment_1: "45-мм противотанковая тупая броска 1937 года"
 RUS_anti_tank_equipment_1_short: "53-P"
 RUS_anti_tank_equipment_1_desc: "53-P является типичным противотанковым пистолетом 1930-х годов: он имеет относительно низкий калибр 45-мм, и, хотя он работает против более легких танков, он просто не эффективен против более тяжелых бронежилетов на расстоянии."
 # 57-mm M1941 ZIS-2 :
 RUS_anti_tank_equipment_2: "57-мм противотанковая тупая броска 1941 года"
 RUS_anti_tank_equipment_2_short: "Ф-40"
 RUS_anti_tank_equipment_2_desc: "Разработка 57-мм F-40 была спеша в рамках российского военного планирования, и, несмотря на это, она считается очень высококачественным оружием. F-40 является оружием дивизионного уровня, многоцелевым, любимым солдатами, и одним из других дизайнов Василия Грабина."
 # 100-mm BS-3 :
 RUS_anti_tank_equipment_3: "100-мм противотанковая топка обр.1944"
 RUS_anti_tank_equipment_3_short: "ПОЯСНИТЕЛЬНЫЕ ЗАМЕЧАНИЯ"
 RUS_anti_tank_equipment_3_desc: "100-мм пистолет Обухова FO-63 был разработан в коллаборатории с Грабином, чтобы пронзить даже самые тяжелые танки."

 # 95-mm M1939 F-28 :
 RUS_antitank1: "95-мм тупая обёр.1939"
 RUS_antitank1_short: "F-28"
 RUS_antitank1_desc: "F-28 был разработан для снаряда, необычного для России, поэтому он был встречен с недовольством в артиллерийском департаменте, но пистолет привлек внимание танковых войск, которые решили принять пистолет в танке F-39. 95-мм пистолет M1939 частично сливается с гаубицей F-25 и использует снаряды большого калибра, которые обеспечивают лучшее проникновение танковых бронежилетов."
 # 45-mm M1942 M-6:
 RUS_antitank3: "45-мм противотанковая топка обр.1942"
 RUS_antitank3_short: "М-6"
 RUS_antitank3_desc: "М-6 — это развитие 53-П, и, несмотря на технические усовершенствования, он не может проколоть более современные бронированные машины, которые используются главным образом в больших массах, на близком расстоянии, где он все еще упаковывает значительные удары."
 # 85-mm M1944 S-53 :
 RUS_antitank4: "85-мм противотанковая тупая обёр.1943"
 RUS_antitank4_short: "F-53"
 RUS_antitank4_desc: "85-мм F-53 представляет собой дальнейшее развитие 52-P-зенитного пистолета, приспособленного для противотанкового использования, хотя само оружие почти никогда не используется артиллерийскими силами из-за проблем, связанных с перевозкой, танки используют его массово из-за отсутствия этой проблемы в их танкной версии."

 # 37-mm ASKON-37 :
 RUS_anti_air_equipment_1: "37-мм автоматическая автоматическая зенитная топка обр.1937"
 RUS_anti_air_equipment_1_short: "АНКОТ"
 RUS_anti_air_equipment_1_desc: "В середине 1930-х годов команда Кондакова разработала основной антивоздушно-воздушно-воздушно-воздушно-воздушный ружье 37-мм автоматический ASKOT с очень высокой частотой стрельбы 250 выстрелов в минуту, но известно, что из-за его перевозки он является довольно громоздким и тяжелым."
 # 25-mm 72-K :
 RUS_anti_air_equipment_2: "25-мм автоматическая автоматическая зенитная топка обр.1940"
 RUS_anti_air_equipment_2_short: "72-P"
 RUS_anti_air_equipment_2_desc: "25-мм противовоздушный пистолет калибра 72-P является полком, значительно более легким, чем ASKOT, несмотря на все еще неудобную перевозку, и главным образом предназначен для непосредственной противовоздушной обороны движущихся подразделений; он имеет хорошую скорость огня и является надежным в полевых условиях, а также может, при необходимости, использоваться в качестве самодельного противотанкового оружия."
 # 85-mm M1944 KS-1/KS-12 :
 RUS_anti_air_equipment_3: "85-мм зенитная тупая обр.1944"
 RUS_anti_air_equipment_3_short: "112-P"
 RUS_anti_air_equipment_3_desc: "Тяжелое противовоздушное оружие калибра 85 мм 112-P модернизируется в 52-P с более высокой скоростью загрузки и меньшим весом."

 # 85-mm M1939 52-K :
 RUS_antiair1: "85-мм зенитная тупая обр.1939"
 RUS_antiair1_short: "52-P"
 RUS_antiair1_desc: "85-мм 52-П — это замена 3-P и принципиально современное высококалиберное противовоздушное оружие."
 # 100-mm 73-K :
 RUS_antiair3: "100-мм зенитная тупая обёр (1940 год)"
 RUS_antiair3_short: "73-P"
 RUS_antiair3_desc: "В конечном счете 73-П не имеют реальной цели, поскольку зенитные пулеметы на уровне корпуса используются все реже и реже по мере совершенствования других видов противовоздушного оружия."
 # 25-mm 94-KM :
 RUS_antiair4: "25-мм автоматическая автоматическая зенитная топка обр.1944"
 RUS_antiair4_short: "94-P"
 RUS_antiair4_desc: "94-P является еще одним легким 25-мм зенитным пистолетом, предназначенным для полкового использования, и разрабатывает 72-П с парными бочками и щитом, который служит эффективным многоцелевым пулеметом быстрого действия."

 # Mountain installation for launching RS :
 RUS_rocket_artillery_equipment_1: "Пекхотная утановка RS"
 RUS_rocket_artillery_equipment_1_short: "М-8"
 RUS_rocket_artillery_equipment_1_desc: "М-8 был разработан как переносная пехотная ракета-носитель и входит в число первых ракет своего типа, которая используется главным образом силами специального назначения и первоначально предназначена для горных войск. 8 132-мм ракет-носителей с минимальными требованиями к позиции. Как и любая ракетная система, она является неточной, тяжелой и очень видимой."
 # Portable launching carriage M-31 :
 RUS_rocket_artillery_equipment_2: "Puskovaya setanovka M-31"
 RUS_rocket_artillery_equipment_2_short: "М-31"
 RUS_rocket_artillery_equipment_2_desc: "M-31 является копией немецкого подхода - ракетной пусковой установки, установленной на тележке для повышения мобильности. Одиночная платформа M-31 имеет 8 тяжелых 300-мм ракет с хорошей скоростью загрузки из-за усовершенствованной рамы. Это неточно, но в больших количествах она может использоваться для разрушительных последствий."

 # Reactive round M-20 :
 RUS_rocket_artillery2: "Риктивни снариад М-20"
 RUS_rocket_artillery2_short: "М-20"
 RUS_rocket_artillery2_desc: "На основе реактивного раунда М-13 М-20 является более тяжёлой и мощной ракетой того же калибра 132 мм. Новый раунд используется в том же качестве, что и М-13, и может быть выпущен с пусковых установок М-13."
 # Reactive round M-30 :
 RUS_rocket_artillery3: "Реактивный снариад M-30"
 RUS_rocket_artillery3_short: "М-30"
 RUS_rocket_artillery3_desc: "300-мм реактивный раунд M-30 гораздо мощнее, чем предыдущие ракеты, но нуждается в различных пусковых установках из-за увеличения его веса и размеров."

 #Special Projects

 # TG-1 :
 RUS_super_heavy_railway_gun_equipment_1: "Железнодорожный транспорт"
 RUS_super_heavy_railway_gun_equipment_1_short: "ТГ"
 RUS_super_heavy_railway_gun_equipment_1_desc: "500-мм железнодорожная гаубица, соединенная с железнодорожным пистолетом TP. По аналогии с TP, TG был разработан специально для армии. В отличие от TP-пулемета, предназначенного исключительно для совершения преступлений, он не может быть снят с вооружения."
 #RUS_super_heavy_railway_gun_equipment_1: "$RUS_super_heavy_railway_gun_equipment$"
 #RUS_super_heavy_railway_gun_equipment_1_short: "ТГ"
 #RUS_super_heavy_railway_gun_equipment_1_desc: "$RUS_super_heavy_railway_gun_equipment_desc$"

 # 203-mm B-4 :
 RUS_super_heavy_artillery_equipment_1: "203-мм гаубита обёр.1931"
 RUS_super_heavy_artillery_equipment_1_short: "О-4"
 RUS_super_heavy_artillery_equipment_1_desc: "О-4 является одним из первых и наиболее важных российских осадных орудий, разработанных после окончания Великой войны. Пистолет является частью «крупной артиллерии тройной» и может уничтожить большинство укреплений, за исключением высококачественных современных крепостей. Это большое, медленное оружие с низкой скоростью перезарядки и сложным и нереальным шасси, которое превосходит только уничтожение крепостей."
 #RUS_super_heavy_artillery_equipment_1: "203-мм гаубита обёр.1931"
 #RUS_super_heavy_artillery_equipment_1_short: "О-4"
 #RUS_super_heavy_artillery_equipment_1_desc: "$RUS_super_heavy_artillery_equipment_desc$"

 # 203-mm S-51 :
 RUS_self_propelled_super_heavy_artillery_equipment_1: "203-мм гаубита обёр.1943"
 RUS_self_propelled_super_heavy_artillery_equipment_1_short: "F-123"
 RUS_self_propelled_super_heavy_artillery_equipment_1_desc: "F-123 — современное осадное оружие, но в его основе лежит модифицированный пистолет O-4."
 #RUS_super_heavy_artillery_equipment_1: "203-мм гаубита обёр.1943"
 #RUS_super_heavy_artillery_equipment_1_short: "F-123"
 #RUS_super_heavy_artillery_equipment_1_desc: "$RUS_super_heavy_artillery_equipment_desc$"

 # M-72 :
 RUS_motorbike_equipment_1: "Mototsikl AM-72"
 RUS_motorbike_equipment_1_short: "АМ-72"
 RUS_motorbike_equipment_1_desc: "Разработанный ОКМО в рамках подготовки к войне, АМ-72 представляет собой модифицированный экземпляр немецкого мотоцикла BMW R-71. Легко производить, надежно, легко ремонтировать и обладать твердой скоростью и хорошей маневренностью в трудной местности. АМ-72 стоит над другими российскими мотоциклами, которые либо слишком легки, либо слишком ненадежны, чтобы быть надлежащим образом использованы военными."
