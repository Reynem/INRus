 CHI_anti_tank_equipment_1: "37-мм пистолет типа 18 &lt; &lt; Плоский траекторий &gt; &gt;"
 CHI_anti_tank_equipment_1_short: "37-мм ганьян типа 18"
 CHI_anti_tank_equipment_1_desc: "Хотя на самом деле это 37-мм ханьянского типа 21, обычно оснащенного армией Цин, некоторые страстные республиканцы называют его Синьхайским типом 18, согласно календарю Синьхая Китайской Республики."
 CHI_anti_tank_equipment_2: "37-мм противотанковое оружие типа 30 &lt; &lt; Пацзян Синхай &gt; &gt;"
 CHI_anti_tank_equipment_2_short: "37-мм типа &quot; Пацзян &quot;"
 CHI_anti_tank_equipment_3: "57-мм безоткатная пушка типа 36 &lt; &lt; Пацзян Синхай &gt; &gt;"
 CHI_anti_tank_equipment_3_short: "57-мм типа &lt; &lt; Пацзян &gt; &gt; 36"

 CHI_gw_armored_car_equipment: "Шанхайский тип 1929 года"
 CHI_gw_armored_car_equipment_short: "Тип 1929"
 CHI_gw_armored_car_equipment_desc: ""1929" - это не точное кодовое название, а скорее дата изготовления этих бронированных машин. Фактически, у них нет никакого официального кодового названия. Автомобиль оснащен двумя 30-фестивальными пулеметами и шестью отверстиями для экипажа. ~ n ~ Для того чтобы изменить ситуацию с Северным экспедицией, в марте 1928 года куоминтанг заказал арсенал в Шанхае для производства этих бронированных машин. К сожалению, когда эти бронированные машины вышли из арсенала, КМТ была полностью побеждена. Поэтому было произведено только три оригинальных автомобиля."
 CHI_armored_car_equipment_1: "Шанхайский тип 1930 года"
 CHI_armored_car_equipment_1_short: "Тип 1930 года"
 CHI_armored_car_equipment_1_desc: "Как и его предшественники, Шанхайский тип 1930 года был также заказан Центральным комитетом КМТ с фабрик в Шанхайской концессии. Два прототипа были построены впервые, но не имели реальных боевых рекордов. // бронетранспортер весит пять тонн, и на нем есть вращающаяся башня с тяжелым пулемётом и легким пулемётом."
 CHI_armored_car_equipment_2: "Шанхай Синьхай типа 36 "Fukong Baolei""
 CHI_armored_car_equipment_2_short: "Тип 36 "Fukong Baolei""
 CHI_armored_car_equipment_2_desc: "В качестве бронетранспортера, самостоятельно разработанного армией Куоминтанга, бронетранспортер типа 36 Синьхай воплощает в себе пик развития бронетранспортера Куоминтанг."

 #Tanks

 CHI_motorized_equipment_1: "Тип Синьчжон "Новый Китай""
 CHI_motorized_equipment_1_short: "Синьчжон"
 CHI_motorized_equipment_1_desc: "Благодаря усилиям группы китайских инженеров, возглавляемой Чжи Бинджуаном, в сочетании с многочисленными преимуществами немецких грузовиков, Куоминтанг построил Type Sinzhong с отечественными частями на базе MinGan в Лонгьяне. Его коробка передач, трансмиссия и механизм рулевого управления сделаны в Китае и могут адаптироваться к горной местности Китая. Его дизайнер Чжи Бингюань назвал его «Ксинцхонг», что означает «Новый Китай»."

 CHI_mechanized_equipment_1: "Renault UE Chenillette"
 CHI_mechanized_equipment_1_short: "Рено UE"
 CHI_mechanized_equipment_1_desc: "Во время своего изгнания во Францию Дай-Анлан из Национальной революционной армии узнал от французов некоторые теории о механизированных боевых действиях. Когда он вернулся в Китай, по его просьбе, французы передали ему партию отставной Renault UE вместе с чертежами дизайна. Дай-Анлан считал, что он может использовать это оборудование, чтобы сформировать первую механизированную силу Китая."
