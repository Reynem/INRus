 PAP_train_equipment_2_desc: "Разработанные на основе группы 740, эти автоцистерны класса «Микадо» были построены для перевозки тяжелых грузовых поездов по крутым линиям Южного Аппеннинса и линии Рим-Пескара. Хотя они и менее мощны, чем их традиционные двигатели, они в целом являются более гибкими и дешевыми для работы, в то время как их нижняя нагрузка на ось позволяет им двигаться по более старым путям."
