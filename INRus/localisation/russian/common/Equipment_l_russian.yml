 JAM_armored_car_equipment_2: "Рёскин Рино"
 JAM_armored_car_equipment_2_short: "Рино"
 JAM_armored_car_equipment_2_desc: "С успехом Ruskin Motor Todies (Ruskin Motor Todies) в ответ на просьбу Австралазианского правительства о строительстве на шасси CMP значительно более тяжелого бронированного автомобиля."
 JAM_armored_car_at_equipment: "Рёскин Гиппо"
 JAM_armored_car_at_equipment_short: "Гиппо"
 JAM_armored_car_at_equipment_desc: "Для того чтобы разместить значительно более крупный пистолет, коаксиальная машина Рино должна была быть снята, а ее башня немного увеличена. "Хиппо" как эта модель была названа, оказалась довольно головной болью для его проектной команды, поскольку эти изменения привели к тому, что и без того тяжелый автомобиль столкнулся с проблемами веса, как и его предшественники, которые должны были медленно проработать до принятия автомобиля."

