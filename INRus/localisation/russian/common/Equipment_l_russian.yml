 # Essentially the Gewehr98 with Dadao lol, OTL produced by Gongxian arsernal in Sichuan until 1935:
 SZC_infantry_equipment_0: "SMB M1907 Китайский Маузер"
 SZC_infantry_equipment_0_short: "SMB M1907"
 SZC_infantry_equipment_0_desc: "Первоначально выпущенный как Guangxu Type 33 во время имперского правления в качестве близкого экземпляра немецкой модели Маузера 1904 года со специальным патроном калибра 6,8×57 мм, но позднее в 1915 году был установлен стандарт 7,92×57 мм Маузер."
 SZC_infantry_equipment_1: "Сычуаньский тип 27"
 SZC_infantry_equipment_1_short: "Сычуаньский тип 27"
 SZC_infantry_equipment_1_desc: "Эта винтовка первоначально называлась «Тип 27» и была вставлена в службу Qing в 1935 году при содействии Германии после восстановления. В функциональном отношении это оружие является почти копией немецкого Mauzer M1924 и значительным улучшением по сравнению с гораздо более старым типом 88 с точки зрения веса и оттока. ~nnnnFirst, произведенный в арсенале Ханьяна с немецкими инструментами, методы изготовления уже распространились на Чэнду, хотя он может не полностью заменить своих предшественников в течение некоторого времени."
