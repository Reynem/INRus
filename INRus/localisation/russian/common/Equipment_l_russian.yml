 GUA_infantry_equipment_0: "Модели Маузера 1923 года"
 GUA_infantry_equipment_0_short: "Маузер М23"
 GUA_infantry_equipment_0_desc: "Незадолго до того, как Велткриг, Гватемала лицензировала продукцию гевера 1898 года из Германской империи, однако было произведено лишь ограниченное количество винтовок, однако после того, как Хосе Мария Ореллана подошла к президенту, Гватемала признала необходимость модернизации своего стрелкового оружия и новой линии Маузера 1898-х, выставленной во множестве Спрингфилда 30-06, которая известна в гватемальской службе как модель Маузера 1923 года."
 GUA_infantry_equipment_1: "Zbrojovka Brno Mauser Modelo 1928"
 GUA_infantry_equipment_1_short: "Брно М28"
 GUA_infantry_equipment_1_desc: "Недостатки гватемальской модели 1923 года Маузер быстро стали очевидными, и всего через несколько лет после введения «М23» была найдена замена. «Брно» в «Гапсбургской империи» представила вариант своей версии 1924 года Mauser Rifle, и дизайн был выбран Гватемалой для замены «М23»."
 GUA_infantry_equipment_2: "Topmpon Modelo 1928A1"
 GUA_infantry_equipment_2_short: "Томпсон М1928А1"
 GUA_infantry_equipment_3: "Fabrique Nationale Modelo 1943"
 GUA_infantry_equipment_3_short: "FN-43"

