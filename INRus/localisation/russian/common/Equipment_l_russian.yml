 ### Land ###
 NEE_infantry_equipment_0: "Винтовка, калибр 30-06, модель 1903"
 NEE_infantry_equipment_0_short: "M1903 Спрингфилд"
 NEE_infantry_equipment_0_desc: "Модель 1903 года была разработана в Спрингфилд-Арсенале, когда после испано-американской войны Соединенные Штаты сочли винтовку Краг-Йёргенсен неадекватной из-за ее слабого действия; в ее основе была попытка объединить полезные черты как Крага, так и испанских мазеров."
 NEE_infantry_equipment_1: "Винтовка, Калибр 30-06, модель 1903A1, специальный целевой показатель"
 NEE_infantry_equipment_1_short: "M1903A1 Спрингфилд"
 NEE_infantry_equipment_1_desc: "Спрингфилд M1903A1 был принят Армией США в 1929 году в качестве "U.S. Rifle, Calibre 30-06, M1903A1" и включал в себя пистолетный пистолет, чеканную задницу, зазубринный пусковой крючок и несколько небольших усовершенствований в оригинальном дизайне 1903 года."
 # M1 Garand:
 NEE_infantry_equipment_2: "Винтовка, калибр 30 модель 1"
 NEE_infantry_equipment_2_short: "M1 Garand"
 NEE_infantry_equipment_2_desc: "M1 Garand — это французско-канадский Джон Гаранд из Спрингфилдской армации. 30 калибр, газовый, 8 запястья, полуавтоматическая винтовка, предназначенная для простой ассемблеи и может быть снята без инструментов через несколько секунд. Полуавтоматическая операция дает американскому винтовщику значительное преимущество в огневой мощи и времени, когда он стреляет из пулемета, по отношению к врагам, вооружённым болтными винтовками."
 #T20E2 Garand:
 NEE_infantry_equipment_3: "Автокарбина, Калибр 30, модель 2"
 NEE_infantry_equipment_3_short: "М2"
 NEE_infantry_equipment_3_desc: "Автокарбайн M2 является улучшением по отношению к M1 Garand с несколько более длинным приемником, чем M1 и модифицированным для приема 20 журналов Browning Automo Rifle. Винтовка оснащена огневым переключателем, созданным соединителем, что позволяет автоматически стрелять на скорости 700 об/мин. Помимо селективного огня, винтовка смонтируется и прослушивается с левой стороны с той же целью, в том числе с той же аппаратурой для установки винтовочной гранаты."
 NEE_infantry_at: "Антимеханизирующее оружие, Calibre .50, модель 2, Браунинг"
 NEE_infantry_at_short: "M2 Противомеханическое оружие"
 NEE_infantry_at_desc: "Вторая американская гражданская война потребовала разработки переносного противотранспортного оружия. &lt; &lt; Кавалерия &gt; &gt; США экспериментировала с зажиганием и модификацией тяжелого пулемета М2 калибра 50 калибра для переноски. &lt; &lt; Браунинг М2 &gt; &gt; , несмотря на то, что она была более тяжелой и громоздкой по сравнению со своими европейскими коллегами, &lt; &lt; Антимеханизационный пистолет М2 &gt; &gt; был быстро принят на службу после удовлетворительных испытаний в армии."
 NEE_infantry_at2: "Безоткатные винтовки, 2,2 дюйма, модель 18"
 NEE_infantry_at2_short: "M18 Безоткатные винтовки"
 NEE_infantry_at2_desc: "M18 безоткатное оружие — это противоматериальное оружие, разработанное двумя инженерами Kroger и Musser в рамках внештатного проекта Военной пехотной секции США. M18 был разработан в ответ на быстрое совершенствование бронежилетов, что значительно снизило эффективность противотанковых винтовок, достаточно небольших для переноса на переносной режим. M18 безоткатная винтовка имеет эффективный диапазон в 400 ярдов, максимальный диапазон в 5 000 ярдов и более точен по сравнению со старой М2. Она быстро называлась "карманной артиллерией" солдатами, которые ее использовали."
 NEE_support_weapons: "MG, Cal. 30-06, M1919, Browning & Mortar, 3 дюйма, Стоукс"
 NEE_support_weapons_short: "M1919 Browning MG & Stokes"
 NEE_support_weapons2: "MG, Cal.50, M2, Browning & Mortar, 2-дюймовый, SMBL"
 NEE_support_weapons2_short: "M2 Бурение MG и SBML двухдюймовый миномет"
 #M1941 Johnson MG:
 NEE_support_weapons3: "MG, Cal. 30-06, M3, Johnson & Mortar, 3,2 дюйма, M1"
 NEE_support_weapons3_short: "Миномет M3 Johnson MG & M1"
 #M1944 Johson MG:
 NEE_support_weapons4: "MG, Cal. 30-06, M5, Johnson & Mortar, 4,2 дюйма, M2"
 NEE_support_weapons4_short: "Миномет M5 Johnson MG & M2"
 NEE_night_vision_short: "M1 Снайперскоп"
 NEE_night_vision_desc: "Разработанный специально для M3 Auto-Carbine, который имел специальные установки на приемнике для различных моделей инфракрасных приборов ночного видения, снайперскоп M1 является первым инфракрасным снайперским телескопом, используемым для общего использования Армией США. Хотя M1 имеет свои недостатки, как плохой диапазон и легко поврежденный инфракрасный эмиттер, M1 все еще имеет огромное значение, когда он используется правильно."
 NEE_night_vision2: "Инфракрасный снайперскоп, модель 3"
 NEE_night_vision2_short: "Снайперскоп M3"
 NEE_night_vision2_desc: "В связи с неудовлетворительным приемом снайперскопа М1 был принят снайперскоп М3, который почти в два раза превышает эффективный диапазон М1, более надежный инфракрасный источник света и маяк Т23, однако M3 значительно лучше, чем его предшественник, хотя некоторые солдаты жалуются на то, что источник света кровоточит в видимом спектре и тем самым сбрасывает свое положение."
 NEE_infantry_weapons2: "Карбина, машина, Томпсон Мк I"
 NEE_infantry_weapons2_desc: "Британская армия стала смутно интересоваться американскими автоматами примерно в 1925 году, когда Auto-Ordnance попыталась заключить лицензионную сделку с Бирмингемским стрелковым оружием. &lt; &lt; Британская революция &gt; &gt; сорвала сделку, но интерес был поднят канадской армией, которая заручилась лицензией M1926 на производство у себя дома, хотя и в небольших количествах, до начала гражданской войны в Соединенных Штатах. &lt; &lt; Новая Англия &gt; &gt; , будучи частью связей с &lt; &lt; Энтентимент &gt; &gt; , классическая американская автоматизация была одним из видов оружия, отправленного новому Временному правительству."
 #Reising Model 50:
 NEE_improved_infantry_weapons_2: "М50 Рейзинг"
 NEE_improved_infantry_weapons_2_desc: "Изготовленный компанией «Харрингтон энд Ричардсон армз компани» в Ворстере, штат Массачусетс, Джон Рейзинг был ассистентом уважаемого изобретателя огнестрельного оружия Джона Браунинга. Когда гражданская война вспыхнула по всей Америке, Рейзинг обратил свое внимание на разработку автомата. Соперник 1928A1, M50 значительно дешевле производить и имеет закрытую систему болтов, которая обеспечивает большую точность полуавтоматического огня."
 #M25:
 NEE_advanced_infantry_weapons2: "М25"
 NEE_advanced_infantry_weapons2_desc: "После успешного внедрения Auto-Carbine M1E2 Армия США начала поиск новой легкой винтовки для замены M1 Garand. Разработанной Харви Эрлом, M-25 имеет переработанную газовую систему, а также компоненты, предназначенные для изготовления с помощью общих инструментов и машин. Винтовка также выпускает 0,30 боеприпасов и невероятно легкая, всего лишь 7 фунтов. Первоначальные испытания были благоприятными, когда многие возвысили точность M-25 над M1 Garands."

