 GAL_motorized_equipment_0_short: "Tatra TL4"
 #Steyr 640:
 GAL_motorized_equipment_1: "Самохоход цияроуи 1937 года"
 GAL_motorized_equipment_1_short: "СК, см. 37"
 #Steyr with rocket:
 GAL_motorized_rocket_equipment_1: "Wyrzutnia rakietowa wzór 1944 na Samochód"
 GAL_motorized_rocket_equipment_1_short: "Вырзутния Булава-на-вз. 43"
 #Skoda TH-7:
 GAL_mechanized_equipment_1: "Пояздный газиенковый воронок 1937 года"
 GAL_mechanized_equipment_1_short: "ГУ, з. 37"
 GAL_mechanized_equipment_1_desc: "Для наблюдателей и теоретиков гражданская война в Америке продемонстрировала современные механизированные боевые действия и продемонстрировала, как сильно удалось повысить надежность отслеживаемых транспортных средств и расширить их возможности в различных странах. В качестве сдерживающей меры, направленной на повышение мобильности их моторизованной пехоты, артиллерийские тракторы, главным образом из серии &lt; &lt; Прага Т &gt; &gt; , были переданы в распоряжение своих оперативных дивизий, в результате чего они были переоборудованы в качестве бронетранспортеров до тех пор, пока не будут установлены соответствующие бронетранспортеры."
 #Saurer RR-7:
 GAL_mechanized_equipment_2: "Пояздный газиенковый возур 1938 года"
 #Saurer RR-7:
 GAL_mechanized_equipment_2_short: "ГУ 38"
 GAL_mechanized_equipment_2_desc: "Saurer RR-7 — это гибридная бронированная машина, которая может использовать оба пути или колеса, которая была введена в качестве артиллерийского трактора в 1937 году, но оказалась гораздо более разносторонней машиной с легкой доспехами и высокой мобильностью, которая не только выполняла бы роль разведывательной машины, но и выполняла бы роль военно-воздушной машины, став первой бронированной машиной монархии такого типа."
 #43.M Lehel:
 GAL_mechanized_equipment_3: "Перевозчик opancerzony wzór 1943"
 #43.M Lehel:
 GAL_mechanized_equipment_3_short: "ПО НАСТОЯЩИМ ПУНКТАМ 43"
 GAL_mechanized_equipment_3_desc: "Поскольку большое число самоходных противовоздушных автомобилей &quot; Нимрод &quot; находится в инвентаризации, а автоканнон пытается выполнить свою роль, многие из них были переоборудованы без заграждения для выполнения функций бронированной машины скорой помощи и бронетранспортера, что сделало их одним из первых современных бронетранспортеров и значительно увеличило срок службы их материнского дизайна."
