 ### Lithuania ###
 ###

 ### Land ###
 #Kbk wz 91/98/23
 LIT_infantry_equipment_0: "Мосин-Маузер 1891/98/25 м. Modelio shauutuas"
 LIT_infantry_equipment_0_short: "25 ММ"
 LIT_infantry_equipment_0_desc: "Все восточные союзники Германии имели большие запасы российских винтовок Mosin, но все они приняли 8-мм патрон Маузера, соответствующий немецким стандартам."
 # Standardmodell Mauser
 LIT_infantry_equipment_1: "Lietuvishkas Mauser 1924 m. Modelio shautuvas"
 LIT_infantry_equipment_1_short: "24 L"
 LIT_infantry_equipment_1_desc: "Вельткриг из первых рук показал, что полноразмерные винтовки были неуправляемыми в окопах с малой пользой. Немецкие знаменитые штурмовые войска получили короче Кар. 98AZ, когда это было возможно, и вскоре после войны было принято решение стандартизировать винтовку с длиной карбины для замены G.98. Карб, основанный на модели AZ, мало отличался от своего непосредственного предшественника, но в большей степени от более длинного G.98, с улучшенными достопримечательностями и свернутым болтом. Что более важно, он использовал больше частей длинной винтовки для увеличения взаимозаменяемости частей и снижения производственных издержек. Многие модели были заказаны литовским правительством."
 # MP35
 LIT_infantry_equipment_2: "Bergman 1935 м. Modelio pynetas-kulkosvaidis"
 LIT_infantry_equipment_2_short: "35 B"
 LIT_infantry_equipment_2_desc: "Несмотря на то, что концепция подмашинного оружия была хорошо доказана на втором этапе Вельткрига, многие страны видят серьезную нехватку оружия в момент появления второго вельткрига. Не в состоянии обеспечить стандартный MP-40 немецкой армии, остстаате часто приходится уплачивать тем, что доступно на коммерческой основе через частные фирмы. MP-35, разработанный Эмилем Бергманном и примечательный для его горизонтального журнала с правой стороны, является популярным выбором благодаря его относительной жесткости и доступности, а также готовности Бергмана лицензировать дизайн."
 # Gewehr 43
 LIT_infantry_equipment_3: "Lietuvischkas Mauser 1943 m. Modelio karabinas"
 LIT_infantry_equipment_3_short: "43 L"

 #Panzerbuchse 39:
 LIT_infantry_at: "Brauer 1943 M. Modelio priestaninis shautuvas"
 LIT_infantry_at_short: "43 B"
 #Panzerschreck:
 LIT_infantry_at2: "1943 м. Modelio priesstaninis raketsvaidis 'Panzerschreck'"
 LIT_infantry_at2_short: "43 Р"
 LIT_infantry_at2_desc: "54 противотанковых противотанковых ракетных пусковых установки с плечевой пусковой установкой под названием «Офенрохр» и более популярный «Панзершрэк» («Танк'с Фрайт»). Это легкое пехотное оружие, разработанное для немецких вооруженных сил, вдохновленное слухами об американских ракетных пусковых установках. В идеальных условиях R.Pz.B. 54 может проникнуть в бронежилеты тяжелых танков с помощью своих 8,8-сантиметровых ракет, уже используемых 43-ракетными пусковыми установками Raketenwerfer. В качестве недостатка R.Pz.B. 54 производит много дыма при обстреле. Многие из Германии, которые были отправлены из-за отсутствия в Литве противотанкового оружия."

