 ANQ_anti_air_equipment_1_short: "Шанхайское оружие M1927"
 ANQ_anti_tank_equipment_1: "37-мм автомат типа 21 &lt; &lt; Пулемет &gt; &gt;"
 ANQ_anti_tank_equipment_1_short: "Ханьян типа 21"
 ANQ_motorized_equipment_1: "Тип &quot; Нанкин Чжунюань &quot;"
 ANQ_motorized_equipment_1_short: "Чжунюань"
 ANQ_motorized_equipment_1_desc: "После реставрации Цин Бенз АГ и правительство Цинга создали несколько автомобильных заводов в Китае в качестве совместных предприятий; самым известным из них были Жуньюаньские автомобильные заводы, расположенные в Шанхае и Наньцзине. Тысячи грузовиков типа Чжунюань были произведены в этих двух районах, которые служили в различных армиях, лояльных клике Жили. ~n nonotaby, Жонгюань назван не в честь древнекитайского места под названием Чжунюань (район вокруг ядра империи), а вместо этого после нарисованного логотипа на передней части кабины грузовика; огромный китайский персонаж "Zhong" был помещен в круг."

