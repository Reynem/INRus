 KUM_infantry_equipment_0_short: "Тип 88"
 KUM_infantry_equipment_0_desc: "Изначально как результат усилий, предпринятых в эпоху «самоукрепления» в конце Гуанксу, тип 88 был разработан в качестве близкого экземпляра немецкого Gewehr 88 с экспортными модификациями. Хотя в совокупности он ниже новых винтовок, несмотря на улучшения и часто плохое обслуживание, известно, что оружие является изогнутым и надежным, если оно не является неуправляемым. ~nnn this разновидность производится главным образом в Syning Arsenal в Цинхае, хотя нехватка оборудования и личные предпочтения часто видят, что оно используется вместе с нестандартным оружием, таким как Dadao."
