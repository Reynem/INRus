 # Trains
 JAP_train_equipment_1: "Японские правительственные железные дороги класса D51" # JNR D51
 JAP_train_equipment_1_short: "Класс JGR D51"
 JAP_train_equipment_1_desc: "Хотя класс D50 был хорошо известен, финансовое положение начала 1930-х годов не привело к появлению новых грузовых локомотивов до 1936 года."
 JAP_train_equipment_2: "Японские правительственные железные дороги класса D52" # JNR D52, introduced slightly earlier than OTL
 JAP_train_equipment_2_short: "Класс JGR D52"
 JAP_train_equipment_2_desc: "В соответствии с проектом D51 D52 были внесены многочисленные изменения в режим жесткой экономии в целях повышения эффективности работы локомотива и снижения производственных издержек. &lt; &lt; Д52 &gt; &gt; имеет более крупные котельные и решеточные зоны, что ведет к повышению тяги, а соображения жесткой экономии позволяют заменить рабочую доску деревянными и менее жесткими производственными стандартами для большинства компонентов."
 JAP_train_equipment_3: "Имперская японская армия типа 94" # Type 94
 JAP_train_equipment_3_short: "Тип ИДЖ 94"
 JAP_train_equipment_3_desc: "На основе уроков, извлеченных из самодельного бронированного поезда, модель 94 может достигать 60 км/ч и иметь диапазон 150 км. В основном этот поезд, предназначенный для перевозки артиллерийских вагонов и специализированных бронированных поездов, не очень нравился как машинным, так и военно-служащим."
 JAP_railway_gun_equipment_1: "Имперская японская армия типа 90 365-мм железнодорожное оружие" # fictional combination of both the Type 90 240mm and the Vickers 14”/45 or 14”/36cm 41st year type
 JAP_railway_gun_equipment_1_short: "Тип IJA 90"
 JAP_railway_gun_equipment_1_desc: "Изношенный пистолет, приобретенный у ИЯН, надёжный виккерс 14 дюйм 45-го калибра, был отремонтирован и на короткое время использован в качестве береговой артиллерии, а затем помещен на специальную артиллерийскую коляску. Железнодорожный пистолет был спроектирован с траверсами 360 градусов и имел вспомогательный двигатель, что ограничило его автономию."

