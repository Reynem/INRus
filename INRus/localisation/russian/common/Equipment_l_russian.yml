 ### Land ###

 #GBR_infantry_equipment_0: "Винтовка, длинная, Росс Мк III"
 GBR_infantry_equipment_0_short: "Росс Мк III"
 GBR_infantry_equipment_0_desc: "В 1903 году винтовка Росса получила несколько усовершенствований до Великой войны, кульминацией которых стала Mk III в 1910 году. Первоначально она была символом патриотизма среди канадцев, когда британцы отказались выдать им лицензию на Ли-Энфилд, эта винтовка получила ужасную репутацию в течение первого года войны, не в состоянии справиться с более низким качеством боеприпасов британского производства и значительно хуже в условиях траншеи, чем ее современники, и была официально выведена из эксплуатации в 1916 году. Тем не менее, SMLE никогда не производилась в Канаде до Британской революции, что послужило причиной ее нежелательного возвращения на службу в качестве остановки, пока производство SMLE не могло начаться в Лонг-Бранчеве, Онтарио."
 GBR_infantry_equipment_1: "Винтовка, короткая, журнал &lt; &lt; Ли-Энфилд Мк V &gt; &gt;"
 GBR_infantry_equipment_1_short: "SMLE Mk V"
 GBR_infantry_equipment_1_desc: "После падения островов Доминионы получили доступ только к одному арсеналу, способному производить служебную винтовку. Некоторые британские инженеры из Энфилда нашли убежище в Онтарио. С помощью фабрики в Литгоу в Австралии они продолжили работу по модернизации почитаемого SMLE, в результате чего была создана Mk V. В классической модели короткометражной винтовки была представлена новая и улучшенная система апертуры на приемнике, а не на средней, что улучшило радиус наблюдения, точность и скорость. Однако из-за операций по высадке и промыванию, необходимых для изготовления винтовки, производство этой новой модели SMLE является относительно дорогостоящим."
 GBR_infantry_equipment_2: "Карбина, машина, Оуэн Мк I"
 GBR_infantry_equipment_2_short: "Оуэн Пистолет"
 GBR_infantry_equipment_2_desc: "С перспективой войны армия обратилась с просьбой о разработке автомата для ведения боевых действий в непосредственной близости от города, особенно с учетом разрушительного характера гражданской войны в Америке. &lt; &lt; Канадская армия &gt; &gt; официально приняла оружие, разработанное молодой австралийской частной Эвелин Оуэн."Owen" machine carbine features an impressive rate of fire and a cheap cost to manufacture while also being sturdy in rough conditions - making it ideal for urban combat. Compared with other submachine guns during testing, the Owen has shown itself time and time again to be the only one to withstand mud, sand, and harsh environments. With favourable testing concluded, large quantities of the Owen were dispatched to the Dominions in preparation for the coming war."
 GBR_infantry_equipment_3: "Винтовка, самоутверждение, длинное отделение Mk I"
 GBR_infantry_equipment_3_short: "SLR Mk I"
 GBR_infantry_equipment_3_desc: "Компания &quot; Корона корпорейшн смол армз лтд. &quot; в Лонг Брэнк ответила на просьбы канадского правительства о самозарядке винтовки. &quot; Самозарядная винтовка &quot; заперта в 8-миллиметровом пулемете &quot; Маузерс &quot; и имеет болт с наклоном. &quot; Пистолет &quot; страдает от проблем надежности и чрезмерной отдачи, однако винтовка поступает с плечевой площадкой, компенсирующей отток. &quot; Легкий вес &quot; , кроме того, делает его идеальным для мобильности и борьбы в городах."
 GBR_infantry_at: "Гренада, винтовка, антитанк, Mk I"
 GBR_infantry_at_desc: "В качестве свидетеля демонстрации противотанковой винтовочной гранаты Генри Мохаупта в Швейцарии, канадская комиссия, догадываясь, что это оружие использовало принцип заряда в форме, начала работать по своему собственному замыслу."
 GBR_infantry_at2: "Проектор, пехота, противотанковый Mk I"
 GBR_infantry_at2_desc: "С учетом необходимости ручной противотанковой установки, предназначенной для использования на фронтальных линиях, проектор, пехота, противотанковая мина Mk I (PIAT) был разработан на основе конструкции бомбардировочного миномета. С эффективным дальностью 105 метров в режиме прямого огня это устройство было хорошо популяризировано из-за отсутствия заднего кадра, хотя и высказывались опасения по поводу его интенсивного возврата."
 GBR_infantry_at2_short: "ПИАТ"
 GBR_support_weapons: "Миномет Vickers MG & Stokes"
 GBR_support_weapons_desc: "Воды, охлаждённые Викерсом МГ, и гранатомет Стоукса были стандартными вспомогательными орудиями канадской армии во время Велткрига."
 GBR_support_weapons2: "2-дюймовый миномет Lis Mk III DMS & SBML"
 GBR_support_weapons2_desc: "С помощью своего культового журнала "pan" Льюис служил Томми с самых мрачных дней первого вельткрига. С угрозой войны, которая еще близка, в варианте MKIII есть пистолет, который позволяет стрелять из плеча на любой части палубы корабля. SBML, будучи небольшим, невероятно переносной, имеет больше огневой мощи и дальности, чем большинство винтовочных гранат."
 GBR_support_weapons3: "Виккеры минометы Mk II и ML 3 дюйма"
 GBR_support_weapons3_desc: "Вариант марки II MG Vickers имеет избирательный вариант огня и хватку пистолета. Он был принят главным образом для бронированных автомобилей. ML 3 дюймовый миномет является значительным усовершенствованием со Стоукса, поскольку он является надежным и прочным для непосредственной артиллерийской поддержки."
 GBR_support_weapons4: "Виккеры Mk III и ML 4,2 дюйма минометы"
 GBR_support_weapons4_desc: "Третий вариант уважаемого пулемета &lt; &lt; Викерс &gt; &gt; был разработан для использования в зенитных целях и предусматривает несколько более высокий уровень огня со стороны его предшественников."
 GBR_night_vision: "Приемники, Табби, Перископ Мк 1"
 GBR_night_vision_short: "Сфера применения"
 GBR_night_vision_desc: "Природа Tabby является одной из самых близких секретов канадского правительства; процесс развития даже скрыт от соотечественников Контента. Случайное открытие учеными в ISAC, сфера охвата формируется в форме столовой, но содержит монокулярный инфракрасный диапазон вместе с батареей."
 GBR_infantry_weapons2: "Карбина, машина, Томпсон Мк I"
 GBR_infantry_weapons2_desc: "Британская армия стала смутно интересоваться американскими автоматами примерно в 1925 году, когда Auto-Ordnance попыталась заключить лицензионный договор с Бирмингемским стрелковым оружием. &lt; &lt; Британская революция &gt; &gt; сорвала сделку, но интерес был поднят канадской армией, которая заручилась лицензией M1926 на производство на дому, хотя и в небольшом количестве до начала гражданской войны в Соединенных Штатах."
 GBR_improved_infantry_weapons_2: "Карбина, машина, Ланчестер Mk I"
 GBR_improved_infantry_weapons_2_desc: "С началом всех войн в Соединенных Штатах и грозящими облаками войны в Европе, канадская армия отчаянно нуждается в оружии для возвращения домой."
 GBR_advanced_infantry_weapons2: "Карбин, коммандо, Де Лисл Мк I"
 GBR_advanced_infantry_weapons2_desc: "То, что началось как частное предприятие инженера Уильяма Годфрая де Лисля, вскоре привлекло внимание Специального отдела КККП, стремящегося оснастить агентов улучшенным оружием. &quot; Де Лисл карбин &quot; является, по сути, сокращенным SMLE, преобразованным в 45 АКТ, дозвуковой кассетой с интегрированным понижателем. &quot; Подавитель &quot; и боеприпасы вместе изготовлены не более 85,5 децибелов при стрельбе, что делает их очень пригодными для операций коммандос."

