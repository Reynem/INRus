 # Etat 141-001 to 141-250:
 FRA_train_equipment_1: "Этат 141 b/с"
 FRA_train_equipment_1_short: "Этат 141 b/с"
 FRA_train_equipment_1_desc: "В качестве локомотива с низкой нагрузкой на ось класс может работать не только на бывших железных дорогах Л'Этата и Л'Уэста, но и на всей территории Франции."
 # SNCF 150.P:
 FRA_train_equipment_2: "НОЖДФ 150P"
 FRA_train_equipment_2_short: "НОЖДФ 150P"
 FRA_train_equipment_2_desc: "Мощные 2-10-0 локомотивы, предназначенные для тяжелой руды и грузовых поездов, вскоре были переоборудованы, с тем чтобы их можно было производить дешевле и широко использовать по всей железнодорожной сети Франции."
 # SNCF Class 241P:
 FRA_train_equipment_3: "НОЖДФ 241П"
 FRA_train_equipment_3_short: "НОЖДФ 241П"
 FRA_train_equipment_3_desc: "Водитель типа 4-8-2, первоначально предназначенный для экспресс-пассажирских перевозок из Парижа в Марселю, с высокой лошадиной мощностью локомотива, который был переоборудован в бронетранспортеры."

 FRA_railway_gun_equipment_1: "Автобусный номер 400 Modèle 1915/1916"
 FRA_railway_gun_equipment_1_short: "Автобус No 400 М1915"
 FRA_railway_gun_equipment_1_desc: "Во время Великой войны, переоборудованная из существующих военно-морских пушек, «Бобье де 400» продолжала служить в армии, а затем была захвачена «Полулером»."
