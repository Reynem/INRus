 ARG_infantry_equipment_0: "Модели Маузера 1909 года"
 ARG_infantry_equipment_0_short: "Маузер М-09"
 ARG_infantry_equipment_0_desc: "С учетом того, что недостатки дизайна Mauser 1891 становятся все более очевидными, Аргентина поставила заказ на более 150 000 автоматов Mauser 1898 в 7,65x53-мм Маузер от немецкого производителя DWM с последующим внутренним производством в равной степени ошеломляющим."
 ARG_infantry_equipment_1: "Fabrique Nationale Mauser Modelo 1930"
 ARG_infantry_equipment_1_short: "FN M-30"
 ARG_infantry_equipment_2: "Хафдаса С-4"
 ARG_infantry_equipment_2_short: "Хафдаса С-4"
 ARG_infantry_equipment_3: "Халкон М-43"
 ARG_infantry_equipment_3_short: "Халкон М-43"
 ARG_infantry_equipment_3_desc: "В 1941 году Fabrica de Armas Halcon (Falcon Gun Factory) была разработана автоматом исключительно аргентинского происхождения &lt; &lt; Халькон М-1943 &gt; &gt; из-за необходимости использования автоматов. &lt; &lt; Фалькон гун &gt; &gt; , который давно используется полицией в Буэнос-Айресе, военные недавно приняли автомат &lt; &lt; Халькон &gt; &gt; . &lt; &lt; Военные наблюдатели &gt; &gt; сравнили это оружие с автоматом &lt; &lt; Американ Томпсон &gt; &gt; , высоко оценив его надежность и скорость применения огнестрельного оружия."
