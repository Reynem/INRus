 IRQ_infantry_equipment_0_desc: "Маузер Г98 был главным служебным винтовкой Оттоманской армии во время Велткрига. Оттоман М1903, скрепленный 7,65мм, был самым распространенным вариантом Маузера в использовании. Произведенный оттоманами «Мавзер» этот иконный винтовка достиг большой славы и глубоко укоренился в турецком подсознании."
