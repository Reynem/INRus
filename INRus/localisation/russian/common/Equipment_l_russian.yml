 #Infantry Equip

 ITA_infantry_equipment_0: "Carcano Modello 1891"
 ITA_infantry_equipment_0_short: "Carcano M91"
 ITA_infantry_equipment_0_desc: "Carcano M91 — итальянский болт-карбин, разработанный Salvatore Carcano в 1891 году, карбайн поджигает 6,5 х 52-мм каркановые патроны. В системе журнала используются блок-зарядные клипы, которые изначально были разработаны Фердинандом Маннлишером, поэтому пистолет часто называют "Mannlicher-Carcano". Популярный во время Weltkrieg и гражданской войны, M91 является стержнем в вооруженных силах итальянской Федерации."
 ITA_infantry_equipment_1: "Carcano M38"
 ITA_infantry_equipment_1_short: "Carcano M38"
 ITA_infantry_equipment_1_desc: "Carcano M38 является вариантом 1938 года в семействе пехотных винтовок Carcano, который был принят в 1938 году и имеет калибр 7,35x51 мм, стационарные достопримечательности, сбрасываемый ножевой штык и 20,9 дюйма ствола."
 ITA_infantry_equipment_2: "Moschetto Automatoryo Beretta 1938"
 ITA_infantry_equipment_2_short: "МАБ-38"
 ITA_infantry_equipment_2_desc: "MAB-38 также известен как "Model 38", MAB-38 — это автомат, разработанный Береттой. MAB-38 может быть опознан с помощью машинного стального приемника, мелкого ремесленника и перфорированной охлаждающей куртки над бочкой. Пистолет стреляет 9x19 мм парабеллумом в 600 выстрелов в минуту, что делает его смертоносным оружием в ближних кварталах и в городских боях. Интересно, что этот пистолет имеет два пусковых устройства для двух режимов стрельбы; передний пуск - полуавтоматический огонь, а задний пуск - полностью автоматический."
 ITA_infantry_equipment_3: "Pavesi FNAB-42"
 ITA_infantry_equipment_3_short: "FNAB-42"
 ITA_infantry_equipment_3_desc: "Дорогое оружие для изготовления; конструкция Pavesi FNAB-42 отражает обширную мельничную и резистентную инженерию при его изготовлении. FNAB-42 использует запоздалую систему возврата, которая работает с закрытого болта, что позволяет поддерживать скорость огня на постоянной скорости 400 об/мин без использования тяжелого болта и сильной пружины. Сложность этого оружия отражает новейшую изощренность итальянской изобретательности."
 ITA_infantry_at: "Мортайо д'Ассальто 45/5"
 ITA_infantry_at_desc: "Как и все современные европейские военные, Итальянская федерация приняла легкие пехотные минометы для целей непрямой огневой поддержки. &lt; &lt; Миномет &gt; &gt; имеет необычную функцию -- откидную стальную установку, прикрепленную к пусковой трубе. &lt; &lt; хорошо обученная команда &gt; &gt; может стрелять от 8 до 10 выстрелов в минуту, что делает ее способной на невероятный подавительный огонь."
 ITA_infantry_at2: "Futile Anticarro S-2"
 ITA_infantry_at2_desc: "7,9-мм противотанковая винтовка S-2 в стиле "Фусиль антикарро" является болтовой винтовкой в стиле маузера, подаваемой из четырех раундового журнала. У ствола ствол ломается музыка, что уменьшает откат. Он может проникнуть в 15-миллиметровую броню на расстоянии 300 метров и 33-миллиметровую броню на расстоянии 100 метров."
 ITA_support_weapons: "Миномет Fiat-Revelli M14 & Stokes"
 ITA_support_weapons_desc: "Стандартные пулеметы итальянской армии во время Велткрига, Fiat-Revelli M14 оснащены выборочным огнем и ящиком с полосатым питанием в количестве 50 или 100 пуль. Как и миномет Стоукса; это оружие эпохи Велткрига было перенацелито на все возрастающую угрозу продолжения гражданской войны."
 ITA_support_weapons2: "Бреда М30 и Мортайо да 81 М35"
 ITA_support_weapons2_desc: ""Брада М30" является необычным оружием, которое питается из стационарного журнала, прикрепленного к боку, и загружено стальными 20 круглой стриптизёрской обоймой. "Мортайо 81" представляет собой легковесный миномет в стиле "Брэндт", который в силу своей дальности и надежности ведёт себя с большой обратной связью. В миномете используются два снаряда: один тяжелый снаряд с высоким взрывом и другой снаряд для стрельбы на большие расстояния."
 ITA_support_weapons3: "Breda M37 & Mortaio da 81 CEMSA L.P."
 ITA_support_weapons3_desc: ""Breda M37" - это средний пулемёт, производимый компанией "Breda". Газированный воздухоохлажденный средний пулемёт достаточно надёжен на поле. Медленный уровень огня помогает предотвратить перегрев во время продолжительного огня, а его мощная пулеметная пулеметная артиллерия имеет отличный дальность и проникновение."
 ITA_support_weapons4: "Breda Mod.5C & Mortaio da 81 CEMSA L.P."
 ITA_support_weapons4_desc: "Breda Mod.5C — итальянский тяжёлый пулемёт. В соответствии с итальянской военной доктриной «Бреда» предназначалась для засад и нападений. В то время как стрельба идет медленно (как и большинство итальянских пулеметов); «Бреда 5С» по-прежнему считается одним из самых смертоносных видов оружия в итальянском арсенале, учитывая отсутствие у итальянской армии тяжелых пулеметов и автоматов."
 ITA_infantry_weapons2: "Беретта М1918/38"
 ITA_infantry_weapons2_desc: "Beretta M1918 — итальянский автомат, который использовался во время Велткрига. Пистолет был изготовлен из половины автомата, выпущенного из субмашины «Вильяр-Пероса», и имеет невероятную частоту выстрелов в 900 выстрелов в минуту. В варианте 1938 года такой же уровень огня, как и в иконном оружии, но был усовершенствован, с тем чтобы уменьшить отток оружия и повысить его прочность."
 ITA_improved_infantry_weapons_2: "Pavesi M40"
 ITA_improved_infantry_weapons_2_desc: "Pavesi M40 — итальянская полуавтоматическая винтовка с патроном Breda 8x59."
 ITA_advanced_infantry_weapons2: "ТЗ-44"
 ITA_advanced_infantry_weapons2_desc: "Изготовленный полковником и кузнецом (Tonon and Zorzoli, следовательно, название "TZ"); TZ-44 является впечатляющим автоматом, способным стрелять 9х19мм парабеллумом в 800 выстрелов в минуту. Пулемет является простым ответным ударом, но обратный источник складывается вокруг направляющего стержня, который состоит из двух кусочков и телескопов по мере возвращения болта. Как и другие итальянские орудия, в нем есть избирательный огонь. В нем также есть примечательная «двойная безопасность», чтобы избежать случайных сбросов."

