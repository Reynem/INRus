 #Infantry Equip

 SRI_infantry_equipment_0: "Carcano Modello 1891"
 SRI_infantry_equipment_0_short: "Carcano M91"
 SRI_infantry_equipment_0_desc: "Carcano M91 — стандартная винтовка итальянского солдата во время Велткрига, разработанная Сальваторе Каркано в Арсенале Армии Турина; Carcano M91 служил итальянским пехотникам во время Велткрига и Гражданской войны."
 SRI_infantry_equipment_1: "MAS Modèle 1936"
 SRI_infantry_equipment_1_short: "MAS-36"
 SRI_infantry_equipment_1_desc: "MAS 36 — французская короткая карбинистая винтовка с двумя стволами и болтовнистым приемником. &lt; &lt; MAS36 &gt; &gt; , встроенная в коммуну Франции, в Социалистическую Республику Италию прибыло много винтовок MAS-36, чтобы помочь революционному делу на итальянском полуострове. &lt; &lt; MAS-36 &gt; &gt; -- это экономичное и простое болтовое винтовка, которая является удобным и смертоносным оружием в правых руках."
 SRI_infantry_equipment_2: "MAS Modèle 1938"
 SRI_infantry_equipment_2_short: "MAS-38"
 SRI_infantry_equipment_2_desc: "MAS Modele 1938 — это оружие французского происхождения, еще один успешный вид оружия, разработанный MAS, MAS Modele 1938 на итальянской службе, отражает все более тесные связи и сотрудничество между коммуной Франции и Социалистической Республикой Италия. Высококачественное оружие с частотой выстрелов 600-700 об/мин, MAS 38 даст преимущество итальянским солдатам, которые борются в городских или близлежащих районах."
 SRI_infantry_equipment_3: "Fucile Armaguerra Mod. 39 Rifle"
 SRI_infantry_equipment_3_short: "&quot; Armaguerra mod.39 &quot;"
 SRI_infantry_equipment_3_desc: ""Fucile Armaguerra Mod.39" — итальянская полуавтоматическая винтовка, разработанная Джино Ревелли (сыном известного Абиэля Бетеля Ревелли, известного как пулемет Fiat-Revelli, и пистолетом Glisenti Model 1910) и выпущенная компанией "Socieetà Anonima Revelli Armiguerra" в Генуе. Это оружие получило название из Телеграфного кодекса компании "Armaguerra"."
 SRI_support_weapons: "Fiat-Revelli Modello 1914 & Brandt Mortar"
 SRI_support_weapons_desc: "Fiat-Revelli Modello 1914 — это оружие от Велткрига и Гражданской войны. Мощное пулемётное оружие, оружие было возвращено в эксплуатацию из-за отсутствия итальянских пулеметов и растущей напряженности на итальянском ботинке. Миномет Брандта — это реликвия из Велткрига, усовершенствованная британская траншея "Стокс". Простое и эффективное оружие, миномет может быть разбит на три части и требует команды из десяти человек."
 SRI_support_weapons2: "Fiat-Revelli Modello 1936 & Brandt Mle 27/31"
 SRI_support_weapons2_desc: "Fiat-Revelli Modello 1936 — модифицированная версия своего предшественника 1914 года."
 SRI_support_weapons3: "& Brandt Mle 35/38"
 SRI_support_weapons3_desc: "Чателлераут FM Mle 24/29 — это пулемёт французского происхождения, который был отправлен на военную службу Италии из-за отсутствия тяжелого оружия. &lt; &lt; Чателлераут &gt; &gt; имеет низкую скорость огня, а это надежное и надежное оружие, которое хорошо понравилось нашим войскам за его последовательность и вес. &lt; &lt; Брандт Мле 35 &gt; &gt; -- 60-ммм миномет, который должен использоваться пехотными ротами для непрямого огня. &lt; &lt; Простая и эффективная &gt; &gt; , для эксплуатации требуется только экипаж из пяти человек."
 SRI_support_weapons4: "MAS AA-42 & Brandt Mle 1942"
 SRI_support_weapons4_desc: "Опыт второго вельткрига привел к интересу к пулеметам общего назначения, которые служат различным тактическим ролям. С почти удвоенной скоростью огня Чателлера AA-42 является монстром с поясом, который может сломать что угодно на своем пути. Mle 42 представляет собой значительное улучшение по сравнению со своим предшественником, с упором на более широкое вспомогательное оружие."
 SRI_infantry_at: "Canon de 75 мм mle 1897 modifee 1933"
 SRI_infantry_at_desc: "Французский полевый пистолет, разработанный для борьбы с личным использованием, был поставлен на службу Италии."
 SRI_infantry_at2: "ДБСК-де 73-мм Мл 1943 года"
 SRI_infantry_at2_desc: "Противотанковые ракетные пусковые установки могут выпускать 73-мм высоковзрывчатые противотанковые снаряды, способные проникать более чем в 11 дюймов однородных бронежилетов."
 SRI_infantry_weapons2: "ОВП 1938 года"
 SRI_infantry_weapons2_desc: "ОВП 1938 года является автоматом итальянского происхождения. Оружие составляет половину автомата Вильяра-Перосы. Оружие имеет запоздалый и избирательный огонь, и при этом оно может поставлять 900 патронов в минуту, что делает его абсолютным мясником в ближних кварталах."
 SRI_improved_infantry_weapons_2: "MAS-36 LG39"
 SRI_improved_infantry_weapons_2_desc: "В рамках франко-итальянского сотрудничества ИСП имеет доступ к последнему оружию, полученному из французского коммуны. &quot; MAS-36 &quot; включает в себя сворачивающийся полый алюминий и укрепленный бочонок, который также может использоваться для запуска гранат, когда он поступает с 48-мм гранатометом."
 SRI_advanced_infantry_weapons2: "Модель CEAM 1944 года"
 SRI_advanced_infantry_weapons2_desc: "Штурмовая винтовка французского происхождения CEAM Modele 1944 является последним оружием, которое появляется на оружейных фабриках французского коммуны."

