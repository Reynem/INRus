 #Infantry Equip

 AST_infantry_equipment_0: "Винтовка, короткая, журнал &lt; &lt; Ли-Энфилд Мк III &gt; &gt;"
 AST_infantry_equipment_0_short: "LSAF SMLE Mk III"
 AST_infantry_equipment_0_desc: "Литговский завод по производству стрелкового оружия в Новом Южном Уэльсе открылся в 1912 году, начав местное производство почтенной винтовки Ли-Энфилд, которая будет служить на протяжении всей Великой войны. Однако после Британской революции и падения крупных частей Британской Индии, ЛВСА были последним оставшимся арсеналом, способным производить Ли-Энфилдс, чтобы оставаться в руках Энтент, что сделало его очень важным стратегическим активом."
 AST_infantry_equipment_1: "Винтовка, короткая, журнал &lt; &lt; Ли-Энфилд Мк VI &gt; &gt;"
 AST_infantry_equipment_1_short: "LSAF SMLE Mk VI"
 AST_infantry_equipment_1_desc: "В сотрудничестве с британскими и канадскими инженерами и фабрикой &lt; &lt; Литгоу &gt; &gt; &lt; &lt; Ли-Энфилд Мк III &gt; &gt; была модернизирована с помощью новых и улучшенных зрителей с апертурой на приемнике, а не на середине ружья, что стало новым стандартом для доминионов. Однако опыт ведения боевых действий в джунглях привлек внимание к новым потребностям в служебном винтовке, в частности по весу, длине и обращению с ней."Jungle carbine\" (a commercial name from the post-war), featuring a 18.75 inches (476mm) barrel compared to 25.2 inches (640mm) of the Mk III and V."
 AST_infantry_equipment_2: "Карбина, машина, Оуэн Мк I"
 AST_infantry_equipment_2_short: "Оуэн Пистолет"
 AST_infantry_equipment_2_desc: "Эвелин Оуэн, рядовой в Австралазской армии и хобби-кузнике, привлекла внимание как канадских, так и австралазских армий с собственным дизайном. Оуэн был очень простым, но неортодоксальным дизайном с верхним журналом и двумя вертикальными хватками. Это не только относительно недорого, но и оказалось крайне ненадежным, выжившим даже в худших условиях, заработав его прозвище."Digger's Darling\"."
 AST_infantry_equipment_3: "Винтовка, самоутверждение, длинное отделение Mk I"
 AST_infantry_equipment_3_short: "SLR Mk I"
 AST_infantry_equipment_3_desc: "Компания &quot; Корона корпорейшн смол армз лтд. &quot; в Лонг Брэнк ответила на просьбы канадского правительства о самозарядке винтовки. &quot; Самозарядная винтовка &quot; заперта в 8-миллиметровом пулемете &quot; Маузерс &quot; и имеет болт с наклоном. &quot; Пистолет &quot; страдает от проблем надежности и чрезмерной отдачи, однако винтовка поступает с плечевой площадкой, компенсирующей отток. &quot; Легкий вес &quot; , кроме того, делает его идеальным для мобильности и борьбы в городах."
 AST_infantry_at: "Гренада, винтовка, противотанковый No 68"
 AST_infantry_at_desc: "В качестве свидетеля демонстрации противотанковой винтовочной гранаты Генри Мохаупта в Швейцарии, канадская комиссия, догадываясь, что это оружие использовало принцип заряда в форме, начала работать по своему собственному замыслу."
 AST_infantry_at2: "Нападение на пехотный танк &lt; &lt; Мк-1 &gt; &gt;"
 AST_infantry_at2_desc: "В связи с необходимостью ручной противотанковой установки, предназначенной для использования на фронтальных линиях, был разработан проект &quot; Пехотный танк &quot; (ПИТА, известный как &quot; Проектор &quot; , &quot; Пехотная пехота &quot; , &quot; Антитанк &quot; / &quot; Антитанк &quot; в других Доминионах &quot; ) на основе конструкции миномета-бомбардировщика. &quot; С эффективным дальностью в 105 метров в режиме прямого огня это устройство было хорошо воспринято из-за отсутствия заднего кадра &quot; , однако высказывались опасения по поводу его интенсивной откачки."
