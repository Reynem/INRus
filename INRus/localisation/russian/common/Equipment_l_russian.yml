 ### Land ###
 BRA_infantry_equipment_0: "Espingarda Mauser Modelo 1908"
 BRA_infantry_equipment_0_short: "Espingarda Mauser M08"
 BRA_infantry_equipment_0_desc: "Model Mauser 1908 — исключительно длинная винтовка, основанная на Mauser 1898 и помещенная в 7x57 мм Mauser. Первоначально она была изготовлена для Бразилии немецкой компанией DWM, но впоследствии Бразилия начала производить огромное количество винтовки внутри страны."
 BRA_infantry_equipment_1: "Модель Fusil Mauser 1935"
 BRA_infantry_equipment_1_short: "Fusil m35"
 BRA_infantry_equipment_1_desc: "Модель Маузера 1935-х годов является уникальной винтовкой Маузера, в которой используется патрон калибра 7x57 мм, производимый внутри Бразилии и за рубежом в тесном сотрудничестве с компанией Mauser в рамках широкого сотрудничества между бразильским и немецким правительствами."
 BRA_infantry_equipment_2: "Bergmann Submetralhadora Modelo 1938"
 BRA_infantry_equipment_2_short: "Бергман М38"
 BRA_infantry_equipment_2_desc: "В последние годы президентства в Пессоа Бразилия приобрела относительно небольшое количество автоматов MP28 в Бергманне, однако в самой Рио-де-Жанейро они никогда не видели большого применения за пределами полков национальной гвардии; M38 является упрощенной и легко производимой производной MP28, созданной в ответ на растущую напряженность в Южной Америке, и была задумана в качестве стандартного огнестрельного оружия для всей бразильской армии, которое было произведено в больших количествах в литейниках по всей стране и как таковое стало почти синонимом бразильской армии в период Велткрига."
 BRA_infantry_equipment_3: "Мечеть Полуавтоматический росси Моделео 1944 года"
 BRA_infantry_equipment_3_short: "Росси М44"
 BRA_infantry_equipment_3_desc: "В то время как второй вельткриг вспыхнул в Европе, бразильское руководство обнаружило, что их оружие просто превзошело гонку вооружений между великими державами, и вместо того, чтобы попытаться наверстать упущенное, оно просто начало выпускать открытую копию новых немецких полуавтоматических винтовок, таких, как G41. Первые модели были сделаны в литейном магазине «Росси» в Рио-Гранде-ду-Суле, где модель берет свое название. Хотя более продвинутое, чем другое оружие, используемое бразильской армией, ее низкая надежность делает ее непопулярной для солдат, которые часто предпочитают старые модели или даже захватывают снаряжение."
 BRA_support_weapons: "Metralhadora M.08/15 & Morteiro de 7,58-cm"
 BRA_support_weapons_desc: "Верткриг стал свидетелем внедрения некоторых из самых смертоносных видов оружия, известных человеку, таких, как страшная MG Model 08/15. &lt; &lt; В непосредственной близости от траншей войны &gt; &gt; когда-то архаический миномет был возвращен к актуальности и обрел новую эффективность. &lt; &lt; Многие из этих старых единиц оборудования &gt; &gt; входили в число оборудования, которое было непосредственно продано или сдано в аренду Бразилии в ходе военной миссии Германии в этой стране."
 BRA_support_weapons2: "Metralhadora M34 & Morteiro de 8 см"
 BRA_support_weapons2_desc: "Машинный пистолет 34 (MG34) — пулемет с воздушным охлаждением, смонтированный в мощном пулемете калибра 7,92x57-мм винтовки Маузер, с высокой скоростью огня (900 ринг) и эффективной мобильностью, который, вероятно, стал самым современным пулеметом в мире в то время; и был с нетерпением продемонстрирован Бразилии как доказательство военного превосходства Кайзеррейха. Возможно, неожиданным последствием этого стал тот факт, что дизайн был скопирован правительством Рио с незначительным вниманием к патентам после чёрного понедельника. Mortartar Model 34 является пехотным мином, использующим 8-см снаряды."
 BRA_support_weapons3: "Metralhadora M39 & Morteiro "Torneira" de 20 см"
 BRA_support_weapons3_desc: "Модель &quot; Машинное оружие 39 &quot; (MG39) представляет собой усовершенствование по сравнению с MG34. &quot; Машинное оружие с поясом &quot; имеет высокую частоту стрельбы и пригодно для всех целей. &quot; Лейхтер Мортар модель 40 &quot; 20 см представляет собой миномет, предназначенный для нанесения ударов по препятствиям и сильным точкам. &quot; Бразильские &quot; , как было отмечено, имеют менее качественные материалы для изготовления, предположительно для снижения затрат."
 BRA_support_weapons4: "Metralhadora Imbel M1 & Morteiro de 8 см"
 BRA_support_weapons4_desc: "Первые модели тяжелых пулеметов, изготовленных Бразилией для Бразилии, были отмечены очень высокой частотой стрельбы, но также относительно низкой надежностью и долговечностью из-за нескольких углов, которые были вырезаны во время производства; однако, когда она работала правильно, она была одним из самых ужасных видов оружия в арсенале страны."
 BRA_infantry_at: "Антитанковый имбел .50"
 BRA_infantry_at_desc: "Ракета-носитель &quot; Модель 44 &quot; , как и многие бразильские вооружения своего времени, является довольно необъявленной копией европейского оборудования, использовавшегося во втором веткриге, который впоследствии был изготовлен и использован самой Бразилией."
 BRA_infantry_at2: "&lt; &lt; Ланча роян М44 &gt; &gt;"
 BRA_infantry_at2_desc: "Ракета-носитель &quot; Модель 44 &quot; , как и многие бразильские вооружения своего времени, является довольно необъявленной копией европейского оборудования, использовавшегося во втором веткриге, который впоследствии был изготовлен и использован самой Бразилией."

 BRA_artillery_equipment_1: "Обусейро Рейнметалл де 10,5 см"
 BRA_artillery_equipment_1_desc: "После серии военных миссий из Германии и в Германию правительство Бразилии начало импортировать иностранную артиллерию из этой страны."
 BRA_artillery_equipment_2: "Obuseiro Modelo 41 de 11,5 см"
 BRA_artillery_equipment_2_desc: ""Обузейро Моделео 41" - это не более чем копия спецификаций полевого гаубицы Model 36 из немецкой армии, но с некоторыми усложнениями для снижения производственных издержек, за счет некоторой надежности. Даже при этом пистолет широко использовался артиллерией в Бразилии в течение периода Вельткриг, и был первым куском артиллерийской массы, произведенной внутри страны, а не главным образом импортировался."
 BRA_artillery_equipment_3: "Obuseiro Modelo 43 de 17cm"
 BRA_artillery_equipment_3_desc: "В то же время, несмотря на тенденцию копирования немецких деталей, обновление M41 в 1943-х годах несколько увеличило огневую мощь, а некоторые усовершенствования были направлены на то, чтобы сделать ее более надежной, однако производство было ограничено в военное время, а усовершенствованное полевое оружие было редко видно в начале 1940-х годов, однако в последующие годы оно и модели с минимальными вариациями использовались бразильской армией до 1960-х годов."
 BRA_artillery_equipment_1_short: "О. Рум. 10,5 см"
 BRA_artillery_equipment_2_short: "О. М41, 11,5 см"
 BRA_artillery_equipment_3_short: "О. M43 de 17 см"
 BRA_anti_air_equipment_1_short: "CAA M2 de 2 см"
 BRA_anti_air_equipment_2_short: "CAA M5 de 37 см"
 BRA_anti_air_equipment_3_short: "CAA M7 de 88 см"
 BRA_anti_air_equipment_1: "Canhan Antiaéreo M2 de 2 cm"
 BRA_anti_air_equipment_1_desc: "Антивоздушное оружие является для Бразилии оборонительным приоритетом, поскольку война между штатами продемонстрировала уязвимость федеральной столицы в отношении воздушных судов, несмотря на обширную береговую и наземную оборону. &lt; &lt; М1 &gt; &gt; и &lt; &lt; М2 &gt; &gt; , разработанные совместно с Германией и при ее поддержке, были, по общему признанию, немногим более копий моделей Флака с начала 1930-х годов, но этого было достаточно для того, чтобы справиться с относительно медленной авиацией, развернутой в то время в Южной Америке."
 BRA_anti_air_equipment_2: "Canhan Antiaéreo M5 de 37 см"
 BRA_anti_air_equipment_2_desc: "По мере быстрого развития воздушных судов в стандартный вопрос M2 за прошедшие годы были внесены несколько изменений и изменений, однако позднее модели противовоздушного оружия совершенно отличались друг от друга практически от всех характеристик, начиная с главной оси и кончая размером самой пушки. M5 тесно связан с его немецкой двоюродной компанией, 3,7 см Fla.K 37, но состоит из материалов более низкого качества для удовлетворения производственных потребностей Бразилии."
 BRA_anti_air_equipment_3: "Canhan Antiaéreo M7 de 88 см"
 BRA_anti_air_equipment_3_desc: "По мере быстрого развития воздушных судов в стандартный вопрос M2 было внесено несколько обновлений и изменений, но позднее модели противовоздушного оружия совершенно разнятся почти во всем, и M7 почти полностью отходит от первоначального дизайна, за исключением роли. M7 был первым элементом противовоздушного оборудования, разработанного внутри страны, но даже в этом случае он сохранил столь много сходств с аналогичными видами оружия, которые использовались Германией и ее союзниками в Велткриге, многие эксперты утверждают, что это не совсем другой пистолет, а скорее внутренний вариант. Тяжелый пистолет мало использовался в бразильской службе до окончания войны."
 BRA_anti_tank_equipment_1: "Каньян Антитанк "Алемьян" - 3,7 см"
 BRA_anti_tank_equipment_1_desc: "Изначально прямо импорт из Германии, оружие было прямо названо «Алеман» войсками в казармах из-за его мощи и очевидного иностранного происхождения, поскольку его создатели убедились в том, что имперские орлиные эффиги в каждой модели. В то время как аналогичные модели в Европе были разработаны для использования моторизованными силами, Бразилия использовала устаревший дизайн, более подходящий для множества имеющихся у нее лошадей, а также отсутствие надлежащей дорожной инфраструктуры в конечной линии фронта против Аргентины. Эта нация была главным стимулом для того, чтобы Бразилия начала сфабриковать этот кусок в небольших количествах после 1936 года, как нестабильность в этом регионе и непредсказуемый режим, в котором находятся десятки танков, неуязвимый генеральный персонал в Рио-де-Жанейро."
 BRA_anti_tank_equipment_2: "Антитанковый M2 de 7,5 см"
 BRA_anti_tank_equipment_2_desc: "Разработанная полностью с немецкими моделями в качестве основы, Anti Tank Artillery Model 2, или AT2, была разработана главным образом против видов более тяжелых бронежилетов, используемых европейскими державами, в то время как второй Велткриг был разгневан. С учетом того, что Германия сама менее чем готова сотрудничать с производством на этот раз, незаконно приобретенный материал был основой для отечественного производства, которое начиналось слишком поздно для широкого использования в вооруженных силах."
 BRA_anti_tank_equipment_3: "Антитанковый M6 de 12,8 см"
 BRA_anti_tank_equipment_3_desc: "По мере того, как Велткриг подошёл к концу, бронежилеты в вражеских Танках почти перенасытились пехотными и старыми артиллерийскими моделями, и бразильское решение было вновь смешать европейские конструкции дешевым способом. Эта внутренняя версия «Па.К. 43» имеет все проблемы, связанные с первоначальными пушками, но с меньшей надежностью и была изготовлена с более дешевыми материалами."
 BRA_anti_tank_equipment_1_short: "КПП &quot; Алеман де 37 см &quot;"
 BRA_anti_tank_equipment_2_short: "КПП - 7,5 см"
 BRA_anti_tank_equipment_3_short: "КПП M6 de 12,8 см"
 BRA_rocket_artillery_equipment_1: "Батерия Ланча Фогетс, 32 см"
 BRA_rocket_artillery_equipment_1_desc: "В период войны бразильские военные редко применяли артиллерию с ракетами, и несколько изготовленных изделий были прямыми копиями того небольшого немецкого оборудования, на которое хватали бразильские офицеры этого типа; согласно спецификациям оригинальных моделей, в этом оружии использовались ракеты калибра 32 см, и именно из-за отсутствия указанных ракет они редко использовались."
 BRA_rocket_artillery_equipment_2: "Батерия Ланса Фогетес де 21 см"
 BRA_rocket_artillery_equipment_2_desc: "В период войны бразильские военные редко использовали артиллерию с ракетами, и несколько изготовленных изделий были прямыми копиями того небольшого немецкого оборудования, на которое получили свои руки бразильские офицеры. &lt; &lt; Изменения &gt; &gt; в размерах ракет, требуемых для использования в более поздних моделях, стали более распространенными, но все же далеки от стандартного выпуска, и на поле было использовано несколько частей LF de 21cm по сравнению даже с M43."
 BRA_rocket_artillery_equipment_1_short: "Бэт. LF de 21cm"
 BRA_rocket_artillery_equipment_2_short: "Батарея. LF de 32 см"

