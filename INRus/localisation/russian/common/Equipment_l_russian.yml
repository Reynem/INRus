 ###
 ### XSM - Ma Clique ###
 ###

 ### Land ###
 XSM_infantry_equipment_0: "Тип кунминга 88"
 XSM_infantry_equipment_0_short: "Тип кунминга 88"
 XSM_infantry_equipment_0_desc: "Изначально как результат усилий, предпринятых в эпоху «самоукрепления» в конце Гуанксу, тип 88 был разработан в качестве близкого экземпляра немецкого Gewehr 88 с экспортными модификациями. Хотя в совокупности он ниже новых винтовок, несмотря на улучшения и часто плохое обслуживание, известно, что оружие является изогнутым и надежным, если оно не является неуправляемым. ~nnn this разновидность производится главным образом в Syning Arsenal в Цинхае, хотя нехватка оборудования и личные предпочтения часто видят, что оно используется вместе с нестандартным оружием, таким как Dadao."
 XSM_infantry_equipment_1: "Кунминг типа 27"
 XSM_infantry_equipment_1_short: "Кунминг типа 27"
 XSM_infantry_equipment_1_desc: "Первоначально названная "Тип 27", эта винтовка была вставлена на службу Qing в 1935 году при помощи германской помощи после восстановления. В функциональном отношении это оружие является почти копией немецкого Mauzer M1924 и значительным улучшением по сравнению с гораздо более старым типом 88 с точки зрения веса и оттока. ~nnnnFirst, произведенный в арсенале Ханьяна с немецкими инструментами, методы изготовления уже распространились на Sining, хотя он может не полностью заменить своих предшественников в течение некоторого времени."
 XSM_infantry_equipment_2: "Tsingtao MP18"
 XSM_infantry_equipment_2_short: "Tsingtao MP18"
 XSM_infantry_equipment_2_desc: "Благодаря наводнению в начале 1920-х годов избытка Велткрига на мировом рынке, MP18 увидела действия в Китае незадолго до того, как модифицированная версия начала производство в Тсингтао. / n/n/С изменениями в журнале и запасах, этот конкретный продукт китайско-германского сотрудничества был копирован и продан по всему Северному и Южному Китаю, хотя в первую очередь правительству Цинга."
 XSM_infantry_equipment_3: "Тип 35"
 XSM_infantry_equipment_3_short: "Тип 35"
 XSM_infantry_equipment_3_desc: "Тип 35 — полуавтоматическая винтовка, основанная на винтовке генерала Лю с 1914 года. &lt; &lt; Тип 35 &gt; &gt; , хотя и выглядит аналогичным образом, короче, имеет заднюю часть приемного устройства, а газопроводная система заменена простым газовым портом. &lt; &lt; Новая винтовка &gt; &gt; также не может больше переключаться на ручные действия и использовать журналы из автомата &lt; &lt; Чехемия &gt; &gt; ZH-29 и легкого пулемета ZB-26."

