 CHL_infantry_equipment_0: "Fusil Mauser Modelo 1895"
 CHL_infantry_equipment_0_short: "Модель 1895 года"
 CHL_infantry_equipment_0_desc: "В ответ на агрессивную аргентинскую программу вооружения Чили приняла модифицированный Маузер 1893 года (обычно известный как Испанский Маузер) в камере 7x57мм Маузер и заключила контракт с немецкой компанией DWM (Deutsche Waffen und Busterfabilitiesbrabriken) на более чем 100 000 винтовок и карабинов на этой схеме. Чилийский Маузер 1895 года завоевал репутацию за надежность даже в самых тяжелых условиях, которые она сохранила спустя несколько десятилетий после своего принятия."
 CHL_infantry_equipment_1: "Карабина Стейр Моделео 1912/35"
 CHL_infantry_equipment_1_short: "Модель 1912/35"
 CHL_infantry_equipment_1_desc: "Незадолго до Велткрига Чили заключила контракт с австрийским производителем оружия &quot; Стейр &quot; на новый карбиновый вариант немецкого маузера 1898 года, смонтированный в 7x57 мм, как и старые чилийские винтовки. Многие из этих карабинов в конечном итоге попали в руки чилийских карабинеров, которые сочли эту винтовку неудовлетворительной и лоббировали ее замену. В 1935 году была утверждена новая модель с улучшенной эргономикой и новый более крупный журнал с более прочными губами и погрузчиком питания, который вскоре после этого был введен в производство."
 CHL_infantry_equipment_2: "Стейр Масхинпенпистоле 1934 года"
 CHL_infantry_equipment_2_short: "MP 34"
 CHL_infantry_equipment_3: "MAS Modèle 1940/42"
 CHL_infantry_equipment_3_short: "MAS-40/42"

