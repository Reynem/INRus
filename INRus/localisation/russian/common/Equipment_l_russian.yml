 FNG_motorized_equipment_1_desc: "Грузовик Minshen, разработанный американским инженером Дэниелом Майерсом в соответствии с китайскими условиями, является первым в Китае автомобилем местного производства. &quot; Дорога к массовому производству &quot; , которая называется &quot; Добытость людей &quot; , взята из последних трех принципов Sun Yat-sen, которыми, как утверждает Чжан Зуолин, восхищается."
