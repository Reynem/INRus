 #Infantry Equip

 #M93 Manlicher:
 ROM_infantry_equipment_0: "Pusca cu repetetie "Mannlicher", модель 1893"
 ROM_infantry_equipment_0_short: "Маннлишер Мд. 1893 года"
 ROM_infantry_equipment_0_desc: "Mannlicher Model 1895 — болтная винтовка, разработанная Фердинандом Риттером фон Маннлихером и использующая усовершенствованную версию своего революционного болта прямого действия."
 #Serbian puska
 ROM_infantry_equipment_1: "Pusca cu repetetie "Zastava", модель 1924 года"
 ROM_infantry_equipment_1_short: "Застава Мд. 1924 года"
 #Orita:
 ROM_infantry_equipment_2: "Pistol-Mitralier, модель 1941 года"
 ROM_infantry_equipment_2_short: "Ориха Мдд. 1941 года"
 ROM_infantry_equipment_2_desc: "Орита М1941 — это 9х19-мм автомат, разработанный и изготовленный в Румынии. По мере возобновления напряженности на Балканах и в Европе, Румыния поняла, что ей не хватает автоматического оружия, и, таким образом, «Орита» является местной попыткой создать оружие, которое дало бы румынской пехоте преимущество в комате. Названное в честь капитана Марина Ориты (капитана Военно-технического Корпуса) это оружие имеет впечатляющий уровень стрельбы 400-600 патронов в минуту и питается с помощью отсоединенных 25/30 круглых журналов."
 #Orita carbine:
 ROM_infantry_equipment_3: "Pistol-Mitralier, модель 1942 года"
 ROM_infantry_equipment_3_short: "Ориха Карабине"
 ROM_infantry_equipment_3_desc: "Орита Карбин стреляет тем же 9х19-мм парабеллумом, что и подмашина, но является полуавтоматическим вариантом карбины. Хотя оружие поддерживает огневую мощность полуавтоматической винтовки, оно было модифицировано для поддержания точности и надежности, что делает его смертоносным оружием в руках стрелявших."

 #Converted to AT rifle Mauser
 ROM_infantry_at: "Pusscä antanc "Mauser", модель 1942 года"
 ROM_infantry_at_short: "Mauser Md. 1942"
 ROM_infantry_at_desc: "Модель 1943 года — винтовка Mauser, переоборудованная в 15,2-мм патроны, что делает ее эффективным противотанковым оружием, способным проникать в панзеры Австрии."
 #Modified AT 1
 ROM_infantry_at2: "Pusscä antanc "Mauser", модель 1943 года"
 ROM_infantry_at2_short: "Маузер Мд. 1943 года"
 ROM_infantry_at2_desc: "Эта пересмотренная версия модели 1943 года позволяет снизить откат и повысить ее точность, что делает ее более надежной на поле, чем ее предшественник."

 #MP 28:
 ROM_infantry_weapons2: "Pistol-Mitralier, модель 1928 года"
 ROM_infantry_weapons2_short: "MP Md. 1928"
 ROM_infantry_weapons2_desc: "MP28 является немецким автоматом, эволюционирующим в эпоху WK MP-18. Пистолет эффективен в близком радиусе и в городских боях из-за его размера и скорости огня, что делает его идеальным для бой в траншеях. Этот иконный немецкий автомат оказался в руках румынских, особенно среди Железной Гвардии."
 #MP 40:
 ROM_improved_infantry_weapons_2: "Pistol-MitralierE 'MP', модель 1940 года"
 ROM_improved_infantry_weapons_2_short: "MP Md. 1940"
 ROM_improved_infantry_weapons_2_desc: "M.P. 40, иногда ошибочно называемый "Schmeisser", был разработан Генрихом Волльмером и основан на M.P. 38 с целью оснащения немецких солдат боевым оружием. Он использует журналы с 32 патронами калибра 9 мм, а его эффективная дальность составляет около 100-150 метров. Это очень надежное и особенно экономичное оружие, большое количество было отправлено в Румынию."
 #Orita carbine:
 ROM_advanced_infantry_weapons2: "Pistol-Mitralier, модель 1944 года"
 ROM_advanced_infantry_weapons2_short: "Ориха Мдд. 1944 года"
 ROM_advanced_infantry_weapons2_desc: "Этот вариант автомата Orita состоит из сложенного металла и предназначен главным образом для румынских специальных сил."

 #Maxim & Negrei:
