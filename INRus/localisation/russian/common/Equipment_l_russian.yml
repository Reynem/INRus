 #Opel Blitz:
 GER_motorized_equipment_1: "Kraftfahrzeug 305"
 GER_motorized_equipment_1_short: "Kfz. 305"
 GER_motorized_equipment_1_desc: "Немецкая армия в начале 1930-х годов использовала более 100 различных конструкций транспортных средств, что привело к огромным материально-техническим трудностям; для стандартизации своего парка транспортных средств они выбрали дизайн коммерческого грузового автомобиля Адамом Опелом АГ из Бранденбурга, который стал их стандартным грузовым автомобилем. С учетом лишь незначительных изменений, которые были представлены в 1930 году для удовлетворения военных потребностей, Опел Блиц был принят в эксплуатацию с названием Kraftfahrzeug 305, а к 1936 году стал главным грузовиком немецкой армии."
 GER_motorized_rocket_equipment: "Kraftfahrzeug 305/5"
 ##Opel with Wurfrahmen 40, 305/5 is free number in kfz registry afaik:
 GER_motorized_rocket_equipment_1: "Kraftfahrzeug 305/5"
 GER_motorized_rocket_equipment_1_short: "Kfz. 305/5"
 GER_motorized_rocket_equipment_1_desc: "Wurfrahmen 40 представляет собой ракетную ракетную систему с регулируемыми базовыми пластинами, установленными над и рядом с транспортным средством. &quot; Heulende Kuh &quot; ( &lt; &lt; Беллоуинг Коу &gt; &gt; ) ( &lt; &lt; Звуковая корова &gt; &gt; ) обычно устанавливается на грузовике Kfz.305 ( &lt; &lt; Военное обозначение &gt; &gt; Kfz.305/5) в количестве трех базовых пластин с каждой стороной. &lt; &lt; Kfz.305/5 &gt; &gt; успешно используется в качестве вспомогательного оружия для мобильных панзерных групп, особенно в городских районах."
 GER_mechanized_equipment_1: "Sonderkraftfahrzeug 11"
 GER_mechanized_equipment_1_short: "Sd.Kfz. 11"
 GER_mechanized_equipment_1_desc: ""Sonderkraftfahrzeug 11" был разработан с 1934 по 1938 год с участием Borgward AG Fom 1937 года и с 1937 года, проект был связан с Ganoversche Maschinenbau AG. Первоначально предполагалось, что "Sd.Kfz"."
 GER_mechanized_equipment_2: "Sonderkraftfahrzeug 251"
 GER_mechanized_equipment_2_short: "Sd.Kfz. 251"
 GER_mechanized_equipment_2_desc: "Разработан на шасси Sd.Kfz 11, Schützenpanzerwagen Sonderkraftfahrzeug 251 полутреков (обычно именуемых '\"SPW\"') are built by Hannoversche Maschinenbau AG specifically to quickly transport a squad of infantrymen to the front lines with adequate armour protection from small arms fire. The truck examples are usually assigned to armour units for the purpose of helping troops stay right behind the fast moving tanks."
 #Vollkettenaufklärer 38 Kätzchen :
 GER_mechanized_equipment_3: "Sonderkraftfahrzeug 256"
 GER_mechanized_equipment_3_short: "Sd.Kfz. 256"
 GER_mechanized_equipment_3_desc: "В конце 1943 года германская армия попросила Автосоюз разработать легкую, полностью отслеживаемую разведывательную машину, способную перевозить 6-8 человек в открытой верхней верхней верхней части конструкции. В 1944 году был введен Шверер Шюценпанцерваген ЕЦКецхен (Heavy Armand Carrier 'Kitten') с такой же формой корпуса, что и корпус Stu.Pz.Kpfw. VII, но гораздо меньше. Автомобиль имеет передний привод с пятью или шестью перекрывающимися стальными колесами и предназначен для достижения скорости свыше 50 км/ч и имеет легкие бронежилеты. Теплые встречи немецких военных, несмотря на не очень высокую скорость, были приняты в эксплуатацию под названием Sd.Kfz. 256."

 #Amphibious
 GER_amphibious_mechanized_equipment_1: "Landwasserschlepper"
 GER_amphibious_mechanized_equipment_1_short: "Л.У.С."
 GER_amphibious_mechanized_equipment_1_desc: "Было ясно, что задолго до того, как были запланированы какие-либо операции по амфибии, был бы полезен специализированный автомобиль для перевозки войск и предметов снабжения с берега на берег. 1935 год был заказован для использования инженерами германской армии, Landwasserschlepper (Land Watertror) предназначался как легковесный речной буксир с определенной способностью к эксплуатации на суше."
 #Panzerfähre:
 GER_amphibious_mechanized_equipment_2: "Landwasschlepper II"
 GER_amphibious_mechanized_equipment_2_short: "Л.У.С. II"
 GER_amphibious_mechanized_equipment_2_desc: "С ростом использования LWS в поле стала очевидной потребность в большем количестве бронированных амфибийных транспортных средств. К 1943 году был разработан новый проект под названием L.W.S. II. Несмотря на его название, L.W.S. II является совершенно новой технологией, основанной на шасси St.Pz.Kpfw. IV, с небольшим бронетранспортером и плоской задней палубой, а также четырьмя выхлопными трубами в верхней части транспортного средства."

 #Armoured Car
 GER_gw_armored_car_equipment: "Лейхтер Панзерспяхваген, Sonderkraftfahrzeug 222"
 GER_gw_armored_car_equipment_short: "Sd.Kfz 222"
 GER_gw_armored_car_equipment_desc: "Внедренная в 1936 году Leichter Panzerspähwagen ( &quot; лёгкая бронеразведывательная машина &quot; ) ( &quot; Sd. Kfz &quot; ) 222."
 GER_armored_car_equipment_1: "Schwerer Panzerspähwagen, 8-рад, Sonderkraftfahrzeug 231"
 GER_armored_car_equipment_1_short: "Sd.Kfz 231"
 GER_armored_car_equipment_1_desc: "Sd.Kfz 231 Schwerer Panzerspähwagen ( &quot; тяжелая бронеразведывательная машина &quot; ) - это военное обозначение линии разведывательных бронированных автомобилей, предназначенных для бронеподразделений. Первоначально разработанной в 1932 году в качестве шестиколесных вариантов, очевидно, что этот вариант будет устаревшим в ближайшем будущем. В 1937 году в эксплуатацию был введен вариант 8 колес с 2 см Kw.K. 30 L/55 автоканноном."
 #Sd. Kfz. 231 8-rad:
 GER_armored_car_equipment_2: "Schwerer Panzerspähwagen, Sonderkraftfahrzeug 234"
 GER_armored_car_equipment_2_short: "Сд. Кфз. 234"
 GER_armored_car_equipment_2_desc: "Эта новая бронированная машина рассматривается в качестве преемника восьмиколесных панцерспахвагена Сд.Кфца 231. Среди других приоритетов была названа более эффективная защита и более тяжелое вооружение для новой бронированной машины. &quot; Машина &quot; тяжелее и громоздкее, чем &quot; Сд.Кфз &quot; 231, с глиняными стражами, которые шли вдоль стороны от конца до конца, с четырьмя складскими отделениями внутри. &quot; Основная версия &quot; , известная также как &quot; Сд.Кфз.234/1 &quot; , оснащена открытой топовой турнирной трубой с 2 см КВ.К. 30 л/55 автоканноном и коаксиальным M.G. 34."
 GER_armored_car_at_equipment: "Schwerer Panzerspähwagen, Sonderkraftfahrzeug 234/2"
 GER_armored_car_at_equipment_short: "Sd.Kfz. 234/2"
 GER_armored_car_at_equipment_desc: "Респектабельный бронеавтомобиль Sd.Kfz.234/2 (также известный как "Puma") представляет собой большую скорость и значительную пушечную единицу калибра 50 мм KwK.39/1. С улучшенными лобовыми бронежилетами и мощным главным ружьем машина может передвигаться в летучие районы, которые обычно ограничиваются другими автомобилями-единомышленниками. Будучи значительно улучшенным вариантом Sd.Kfz.234, "Puma" предназначена для использования в взводе с шестью силами в качестве опорного автомобиля."

 #Trains

 # German designation: 1 of 7 State Companies - S for Express passenger / P for Passenger / G for goods or freight / T for Tender - Number for power, higher the more powerful - Production Series
 # Bayern S 3/6 / DRB Class 18.4-5:
 GER_train_equipment_1: "K.Bay.St.B. S 3/6 L"
 GER_train_equipment_1_short: "Байерн S 3/6 L"
 GER_train_equipment_1_desc: "Для повышения топливной эффективности серия L была выпущена и введена в эксплуатацию по железным дорогам Германии и Рейхспакта."
 # DRB Class 52 :
 GER_train_equipment_2: "Преу. Сент-Би-Джи 13"
 GER_train_equipment_2_short: "Прусская G 13"
 GER_train_equipment_2_desc: "С учетом опыта эксплуатации локомотивов типа &quot; Прусская G-12 &quot; во время Великой войны и приоритизации производства, продолжительности срока службы и легкости технического обслуживания &quot; Группа 13 &quot; является ответом на этот вопрос. &quot; Группа 13 &quot; могла перевозить на 40% больше грузов, чем другие локомотивы, которые она замещала, и была дешевле для производства."
 # DRB Class 52 but now they're armoured:
 GER_train_equipment_3: "Прив. Сент-Б. Г. 13 Пц."
 GER_train_equipment_3_short: "Прусская G 13 P"
 GER_train_equipment_3_desc: "По мере того, как на железные дороги начали нападать вражеские самолеты, новые локомотивы, которые будут работать на фронтах, должны иметь возможность наносить удары с до 20-мм пушек."

 # Bayern-class Battleship guns
 GER_railway_gun_equipment_1: "Eisenbahn und Bettungsgerüst 38 см SK L/45"
 GER_railway_gun_equipment_1_short: "E.u.B 38 см"
 GER_railway_gun_equipment_1_desc: "Первоначально военно-морское оружие, запасное оружие, заказываемое для боевых кораблей класса Байерн, было перенаправлено на сухопутное обслуживание, поскольку как железнодорожное оружие, так и береговые батареи во время Велткрига. После установления мира с Честью несколько пушек в классе Байерн были заменены и помещены в склады."

 GER_super_heavy_railway_gun_equipment_1: "80 см - Каноне (Е) Шверер Густав"
 GER_super_heavy_railway_gun_equipment_1_short: "Шверер Густав"

 GER_super_heavy_artillery_equipment_1: "21-см-Мёрсер 18"
 GER_super_heavy_artillery_equipment_1_short: "21-см-Мёрсер"

 GER_self_propelled_super_heavy_artillery_equipment_1: "60 см Мёрсер Герат Карл"
 GER_self_propelled_super_heavy_artillery_equipment_1_short: "Мёрсер Карл"

 #Artillery

 GER_artillery_equipment_1: "10,5-см лейхте Фельдаубице Моделе 33"
 GER_artillery_equipment_1_short: "10,5-см. le.F.H. 33"
 GER_artillery_equipment_1_desc: "10,5-см le.F.H. 33 — это стандартный артиллерийский кусок Deutsches Heer, который был принят для использования в 1933 году и использовался всеми дивизиями и артиллерийскими батальонами. &lt; &lt; Рейнметалл &gt; &gt; была разработана в 1928 - 29 годах и стала крупным шагом на пути к своему предшественнику -- 10,5 см le.F.H. 16 -- совершенно новый трехточечный бронетранспортер обеспечивает большую стабильность и увеличивает траверсу до 56 градусов наряду с механизмом наблюдения, с тем чтобы облегчить стрельбу по движущимся целям."
 GER_artillery_equipment_2: "15 см швере Фельдаубице Моделель 36"
 GER_artillery_equipment_2_short: "15-см с.Ф.Х. 36"
 GER_artillery_equipment_2_desc: "В 1935 году Армия разработала требование о более легкой версии пистолета, который мог быть снят одной лошадиной командой, для которой был выбран новый проект из Rheinmetall."
 GER_artillery_equipment_3: "17-см Kanone Modell 40 в Mörserlafette"
 GER_artillery_equipment_3_short: "17-ти см К. 40 миссис Лаф."
 GER_artillery_equipment_3_desc: "17-миллиметровый каноне 40, построенный Круппом и Ганноверше Масчиненбау, является тяжёлым пулемётом."double recoil\" or dual-recoil carriage. The dual-recoil mechanism absorbs all of the recoil energy with virtually no movement of the box trail upon firing, thus making for a very accurate weapon."

 GER_anti_tank_equipment_1: "3,7-см Панцерабверканона модель 36"
 GER_anti_tank_equipment_1_short: "3,7-см Па.К. 36"
 GER_anti_tank_equipment_1_desc: "В начале 1924-х годов началось проектирование противотанкового пистолета с лошадиной 3,7 см (начиная с 37 см в Па.К. 28) компанией &quot; Рейнметалл &quot; . К началу 1930-х годов стало очевидно, что противотанковая артиллерия устарела, и это оружие было модифицировано для механического транспорта, позволяющего буксировать его на скоростях движения по шоссе. &quot; Ник &quot; , названный солдатами &quot; Heeresankloppfgerät &quot; ( &quot; устройство для кнопки дверей &quot; ), переименованное в 37 см в Pa.K. 36, является основным противотанковым оружием &quot; Deutsches Heer &quot; и легко может управлять с помощью вражеских легких танков."
 GER_anti_tank_equipment_2: "7,5 см Панцерабверканоне модель 40"
 GER_anti_tank_equipment_2_short: "7,5-см Па.К. 40"
 GER_anti_tank_equipment_2_desc: "В 1939 году после поступления в Берлин сообщений о создании новых вражеских танков было разработано 7,5-километровое оборудование, которое первоначально не уделялось приоритетного внимания проекту, однако после роста напряженности в отношениях с Францией и появления сильно бронетанков ему было отведено более приоритетное место. &lt; &lt; Па.К. 40 &gt; &gt; с точки зрения бронебойных операций имеет преимущество перед аналогичными ружьями, но имеет менее эффективные системы опрокидывания, в результате чего оружие находится за аналоговыми для быстрого изменения позиции."
 GER_anti_tank_equipment_3: "12,8-см Панцерабверканона Моделель 43"
 GER_anti_tank_equipment_3_short: "12,8-см Па.К. 43"
 GER_anti_tank_equipment_3_desc: "12,8-см Pa.K. 43 — это новый противотанковый пистолет, первоначально разработанный как полевое оружие, известное как &lt; &lt; Каноне 43 &gt; &gt; . Однако после того, как стали появляться более тяжелые танки, требования к конструкции были изменены, с тем чтобы включить в них противотанковую функцию. 12,8-см Pa.K. 44 имеет хорошие противотанковые характеристики на протяжении долгого времени до крайних дальний дальности - 1800-2 700 метров и за его пределами, - а также удвоение в качестве эффективного полевого ружья при выстреле с применением высоковзрывных снарядов. Но поскольку было невозможно установить ствол мощностью 12,8 см при перевозке обычного противотанкового ружья, была разработана специальная тара для ружья."

 GER_anti_air_equipment_1: "2-см Flugzeugabwehrkanone Modell 36"
 GER_anti_air_equipment_1_short: "2-см Фла.К. 36"
 GER_anti_air_equipment_1_desc: "В 1933 году компания &quot; Рейнметалл &quot; разработала зенитную зенитную пушку &quot; Фла Кей 30 &quot; , а в 1933 году &quot; Дойчес Хир &quot; начала получать оружие. В 1936 году в связи с ростом напряженности Маузер модернизировал ружье - модернизированная модель получила обозначение &quot; Флагзеугабверкано 36 &quot; и была принята германской армией. &quot; Принцип функционирования механизмов &quot; ФлаК. 36 &quot; остается таким же, как и в 1936 году - применение силы оттока с коротким ударом ствола, но в остальном аналогична с увеличением скорости огня лишь до 220 выстрелов в минуту и незначительным снижением общего веса до 420 кг."
 GER_anti_air_equipment_2: "3,7-см Flugzeugabwehrkanone Modell 37"
 GER_anti_air_equipment_2_short: "3,7-см Фла.К. 37"
 GER_anti_air_equipment_2_desc: "В 1935 году Rheinmetall разработал пистолет калибра 3,7 см. Общая длина пушки составляла 89 калибров, что позволило установить максимальный потолок в 4 800 метров. 35 фланцев было произведено лишь небольшими количествами, а производство уже закончилось. В 1936 году продолжалась разработка, в ходе которой основное внимание уделялось замене существующей громоздкой двухосной горной установки на более легкую одноосную ось, в результате чего было установлено 3,7 см Fla.K. 36 с реальной скоростью стрельбы до 120 выстрелов в минуту. Новая упрощенная система наблюдения, внедренная в следующем году, привела к созданию в иных случаях 3,7 см. фла. К. 37, которая быстро стала основным вариантом оружия для немецкой армии."
 GER_anti_air_equipment_3: "8,8-см Flugzeugabwehrkanone Modell 41"
 GER_anti_air_equipment_3_short: "8,8-см Фла.К. 41"
 GER_anti_air_equipment_3_desc: "Первоначально разработанная в 1930 году Krupp Flugzeugabwehrkanone 30, известная как "acht-acht" ("8-8") была впоследствии изменена Rheinmetall. Многопрофильная перевозка позволяет 8,8-см Fla.K. стрелять в ограниченном противотанковом режиме, когда он еще находится на колесах, и многие считают, что линия 8,8-см Fla.K. является одной из лучших в своё время. Rheinmetall Fla.K. 41 является вторым поколением 8,8 см, которое, по словам некоторых генералов, «почти равно 12,8 см пушкам»."

 GER_rocket_artillery_equipment_1: "28/32-cm Schveres Wurfgerät Modell 40"
 GER_rocket_artillery_equipment_1_short: "С.В.Г. 40"
 GER_rocket_artillery_equipment_1_desc: "Первоначально спроектированная для установки дымовой завесы ( &lt; &lt; Нелампруппен &gt; &gt; ) система &lt; &lt; Швере Вурфгерет 40 &gt; &gt; имеет два варианта: деревянные и стальные рамы. &lt; &lt; Открытые рамы &gt; &gt; наиболее часто используемой стали имеют короткие навесные ноги для регулировки высоты и калибровываются для установки 32-сантиметровой ракеты, однако для установки 28-сантиметровых ракет предусмотрены адаптивные рельсы. &lt; &lt; Швере Вурфрахмен &gt; &gt; может также устанавливаться на 40 рамах, прикрепленных к бортам различных транспортных средств."
 GER_rocket_artillery_equipment_2: "21-см Raketenwerfer Modell 42"
 GER_rocket_artillery_equipment_2_short: "Р.У. 42"
 GER_rocket_artillery_equipment_2_desc: "21-см Raketenwerfer 42 представляет собой пятибаррированный многоствольный ракетный пусковой комплекс, установленный на буксируемой тележке, изготовленной из противотанкового пистолета площадью 3,7 см в Па.К. 36. Ракеты развертываются в аккумуляторах мощностью 6 аккумуляторов с тремя аккумуляторами на батальон. R.W. 42 предназначен для обеспечения огневой поддержки и обустройства дымовых экранов, а R.W. 42 используется главным образом в качестве ракетной артиллерии и почти не участвует в химической войне."

