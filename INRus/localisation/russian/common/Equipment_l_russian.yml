 #Trains
 BEL_train_equipment_1: "НОЖДБ типа 64"
 BEL_train_equipment_1_short: "НОЖДБ типа 64"
 BEL_train_equipment_1_desc: "Первоначально построенный как Prussian P 8 для прусских государственных железных дорог, тип 64 был куплен в Германии после Великой войны, так как недавно реорганизованный Flanders-Wallonia оказался без подходящего подвижного состава для смешанных перевозок."
 BEL_train_equipment_2: "НОЖДБ типа 1"
 BEL_train_equipment_2_short: "НОЖДБ типа 1"
 BEL_train_equipment_2_desc: "Сооруженные для перевозки тяжелых скоростных пассажиров локомотивы типа 1 не были подготовлены к грузовым перевозкам во время войны, однако отсутствие альтернативы означало, что они были вывезены на грузовые перевозки независимо от того, кто из них будет использовать их в больших количествах в рамках бельгийской сети в дополнение к другим немецким локомотивам, приобретенным из Германии."
