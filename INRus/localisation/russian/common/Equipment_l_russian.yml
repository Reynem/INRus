 ###
 ### Piratini ###
 ###

 ### Land ###
 PIR_infantry_equipment_0: "Espingarda Mauser Modelo 1908"
 PIR_infantry_equipment_0_short: "Маузер М08"
 PIR_infantry_equipment_0_desc: "Модель Маузера 1908 года была исключительно длинной винтовкой, основанной на Маузере 1898 года и помещенной в камеру 7x57мм Маузер. Первоначально она была изготовлена для Бразилии немецкой компанией DWM, но впоследствии Бразилия начала производить огромное количество винтовки внутри страны, и она стала стержнем во многих армиях штатов с течением времени, она стала почти синонимом межгосударственной войны в культурном мышлении страны. Армия штата Пиратини использовала ту же технику, что и другие штаты, которые сформировали Бразилию, и рядом с южными штатами она была главной боевой силой региона."
 PIR_infantry_equipment_1: "Fusil Mauser Modelo 1935"
 PIR_infantry_equipment_1_short: "Mauser M35"
 PIR_infantry_equipment_1_desc: ""Mauzer Rifle Model 1935" является уникальной винтовкой Mauser, в которой используется патрон калибра 7x57 мм, производимый внутри Бразилии и за рубежом в тесном сотрудничестве с компанией Mauser в рамках широкого сотрудничества между бразильским и немецким правительствами."
 PIR_infantry_equipment_2: "&quot; Суббетрахадора Бергманн модельо 1938 года &quot;"
 PIR_infantry_equipment_2_short: "Бергман М38"
 PIR_infantry_equipment_2_desc: "В последние годы президентства в Пессоа Бразилия приобрела относительно небольшое количество автоматов MP28 в Бергманне, однако в самой Рио-де-Жанейро они никогда не видели большого применения за пределами полков национальной гвардии; M38 является упрощенной и легко производимой производной MP28, созданной в ответ на растущую напряженность в Южной Америке, и была задумана в качестве стандартного огнестрельного оружия для всей бразильской армии, которое было произведено в больших количествах в литейниках по всей стране и как таковое стало почти синонимом бразильской армии в период Велткрига."
 PIR_infantry_equipment_3: "Мечеть Полуавтоматический росси Моделео 1944 года"
 PIR_infantry_equipment_3_desc: "В то время как Второй Велткриг вспыхнул в Европе, бразильское руководство обнаружило, что их оружие просто превосходило гонку вооружений между великими державами, и вместо того, чтобы пытаться наверстать упущенное, оно просто начало выпускать открытую копию новых немецких полуавтоматизированных винтовок, таких, как G41. Первые модели были сделаны в литейном магазине Rossi в Рио-Гранде-ду-Суле, где модель получает свое название. Хотя более продвинутое, чем другое оружие, используемое армией Паулисты, ее низкая надежность делает ее непопулярной для солдат, которые часто предпочитают старые модели или даже захватывают снаряжение."
 PIR_infantry_equipment_3_short: "Росси М44"
 PIR_support_weapons: "Metralhadora M.08/15 & Morteiro de 7,58-cm"
 PIR_support_weapons_desc: ""Велткриг" увидел, как было введено самое смертоносное оружие, известное человеку, как, например, боязливый M.G. Model 08/15. В непосредственной близости от траншей боевые действия, когда-то архаический миномет был возвращен в актуальность. Многие из этого старого оборудования были в числе оборудования, которое было непосредственно продано или сдано в аренду Бразилии в ходе военной миссии из Германии в этой стране."
 PIR_support_weapons_1: "Metralhadora M34 & Morteiro de 8 см"
 PIR_support_weapons_1_desc: "Машинный пистолет 34 (MG34) — пулемет с воздушным охлаждением, смонтированный в мощном пулемете калибра 7,92x57-мм винтовки Маузер, с высокой скоростью огня (900 ринг) и эффективной мобильностью, который, вероятно, стал самым современным пулеметом в мире в то время; и был с нетерпением продемонстрирован Бразилии как доказательство военного превосходства Кайзеррейха. Возможно, неожиданным последствием этого стал тот факт, что дизайн был скопирован правительством Рио с незначительным вниманием к патентам после чёрного понедельника. Mortartar Model 34 является пехотным мином, использующим 8-см снаряды."
 PIR_support_weapons2: "Metralhadora M39 & Morteiro "Torneira" de 20 см"
 PIR_support_weapons_2_desc: "Модель 39 (M.G. 39) была улучшена по сравнению с M.G. 34. Этот поясный пулемет имеет высокую скорость огня и подходит для всех целей. 20-см Leichter Mortar Model 40 представляет собой миномет, предназначенный для нанесения ударов по препятствиям и сильным точкам. Было отмечено, что бразильские копии имеют низкокачественные материалы в их изготовлении, предположительно для снижения затрат."
 PIR_support_weapons3: "Metralhadora Imbel M1 & Morteiro de 8 см"
 PIR_support_weapons_3_desc: "Первые модели тяжелых пулеметов, изготовленных Бразилией для Бразилии, были отмечены очень высокой частотой стрельбы, но также относительно низкой надежностью и долговечностью из-за нескольких углов, которые были вырезаны во время производства; однако, когда она работала правильно, она была одним из самых ужасных видов оружия в арсенале страны."
 PIR_infantry_at: "Антитанковый имбел .50"
 PIR_infantry_at_desc: "Первые модели тяжелых пулеметов, изготовленных Бразилией, для Бразилии, были отмечены весьма высокой частотой стрельбы, но также относительно низкой надежностью и долговечностью из-за того, что в ходе производства были вырезаны несколько углов; однако, когда она работала надлежащим образом, она была одним из самых ужасных видов оружия в арсенале страны."
 PIR_infantry_at2: "&lt; &lt; Ланча роян М44 &gt; &gt;"
 PIR_infantry_at2_desc: "Ракета-носитель &quot; Модель 44 &quot; , как и многие бразильские вооружения своего времени, является довольно необъявленной копией европейского оборудования, использовавшегося во втором веткриге, который впоследствии был изготовлен и использован самой Бразилией."

 PIR_artillery_equipment_1: "Обусейро Рейнметалл де 10,5 см"
 PIR_artillery_equipment_1_desc: "После серии военных миссий из Германии и в Германию правительство Бразилии начало импортировать иностранную артиллерию из этой страны."
 PIR_artillery_equipment_2: "Obuseiro Modelo 41 de 11,5 см"
 PIR_artillery_equipment_2_desc: ""Обузейро Моделео 41" - это не более чем копия спецификаций полевого гаубицы Model 36 из немецкой армии, но с некоторыми усложнениями для снижения производственных издержек, за счет некоторой надежности. Даже при этом пистолет широко использовался артиллерией в Бразилии в течение периода Вельткриг, и был первым куском артиллерийской массы, произведенной внутри страны, а не главным образом импортировался."
 PIR_artillery_equipment_3: "Obuseiro Modelo 43 de 17cm"
 PIR_artillery_equipment_3_desc: "В то же время в 1943-х годах в связи с модернизацией М41 произошло незначительное увеличение огневой мощи и несколько усовершенствований с целью сделать ее более надежной, однако производство было ограничено в военное время, а модернизированное полевое оружие было редким зрелищем в начале 1940-х годов, однако в последующие годы оно и модели с минимальными вариациями использовались Полистской армией до 1960-х годов."
 PIR_artillery_equipment_1_short: "О. Рум. 10,5 см"
 PIR_artillery_equipment_2_short: "О. М41, 11,5 см"
 PIR_artillery_equipment_3_short: "О. M43 de 17 см"
 PIR_anti_air_equipment_1_short: "CAA M2 de 2 см"
 PIR_anti_air_equipment_2_short: "CAA M5 de 37 см"
 PIR_anti_air_equipment_3_short: "CAA M7 de 88 см"
 PIR_anti_air_equipment_1: "Canhan Antiaéreo M2 de 2 cm"
 PIR_anti_air_equipment_1_desc: "Антивоздушное оружие является для Бразилии оборонительным приоритетом, поскольку война между штатами продемонстрировала уязвимость федеральной столицы в отношении воздушных судов, несмотря на обширную береговую и наземную оборону. &lt; &lt; М1 &gt; &gt; и &lt; &lt; М2 &gt; &gt; , разработанные совместно с Германией и при ее поддержке, были, по общему признанию, немногим более копий моделей Флака с начала 1930-х годов, но этого было достаточно для того, чтобы справиться с относительно медленной авиацией, развернутой в то время в Южной Америке."
 PIR_anti_air_equipment_2: "Canhan Antiaéreo M5 de 37 см"
 PIR_anti_air_equipment_2_desc: "По мере быстрого развития воздушных судов в стандартный вопрос M2 за прошедшие годы были внесены несколько изменений и изменений, однако позднее модели противовоздушного оружия совершенно отличались друг от друга практически от всех характеристик, начиная с главной оси и кончая размером самой пушки. M5 тесно связан с его немецкой двоюродной компанией, 3,7 см Fla.K 37, но состоит из материалов более низкого качества для удовлетворения производственных потребностей Бразилии."
 PIR_anti_air_equipment_3: "Canhan Antiaéreo M7 de 88 см"
 PIR_anti_air_equipment_3_desc: "По мере быстрого развития воздушных судов в стандартный вопрос M2 было внесено несколько обновлений и изменений, но позднее модели противовоздушного оружия совершенно разнятся почти во всем, и M7 почти полностью отходит от первоначального дизайна, за исключением роли. M7 был первым элементом противовоздушного оборудования, разработанного внутри страны, но даже в этом случае он сохранил столь много сходств с аналогичными видами оружия, которые использовались Германией и ее союзниками в Велткриге, многие эксперты утверждают, что это не совсем другой пистолет, а скорее внутренний вариант. Тяжелый пистолет мало использовался в бразильской службе до окончания войны."
 PIR_anti_tank_equipment_1: "Каньян Антитанк "Алемьян" - 3,7 см"
 PIR_anti_tank_equipment_1_desc: "Изначально прямо импорт из Германии, оружие было прямо названо «Алеман» войсками в казармах из-за его мощи и очевидного иностранного происхождения, поскольку его создатели убедились в том, что имперские орлиные эффиги в каждой модели. В то время как аналогичные модели в Европе были разработаны для использования моторизованными силами, Бразилия использовала устаревший дизайн, более подходящий для множества имеющихся у нее лошадей, а также отсутствие надлежащей дорожной инфраструктуры в конечной линии фронта против Аргентины. Эта нация была главным стимулом для того, чтобы Бразилия начала сфабриковать этот кусок в небольших количествах после 1936 года, как нестабильность в этом регионе и непредсказуемый режим, в котором находятся десятки танков, неуязвимый генеральный персонал в Рио-де-Жанейро."
 PIR_anti_tank_equipment_2: "Антитанковый M2 de 7,5 см"
 PIR_anti_tank_equipment_2_desc: "Разработанная полностью с немецкими моделями в качестве основы, Anti Tank Artillery Model 2, или AT2, была разработана главным образом против видов более тяжелых бронежилетов, используемых европейскими державами, в то время как второй Велткриг был разгневан. С учетом того, что Германия сама менее чем готова сотрудничать с производством на этот раз, незаконно приобретенный материал был основой для отечественного производства, которое начиналось слишком поздно для широкого использования в вооруженных силах."
 PIR_anti_tank_equipment_3: "Антитанковый M6 de 12,8 см"
 PIR_anti_tank_equipment_3_desc: "По мере того, как Велткриг подошёл к концу, бронежилеты в вражеских Танках почти перенасытились пехотными и старыми артиллерийскими моделями, и бразильское решение было вновь смешать европейские конструкции дешевым способом. Эта внутренняя версия «Па.К. 43» имеет все проблемы, связанные с первоначальными пушками, но с меньшей надежностью и была изготовлена с более дешевыми материалами."
 PIR_anti_tank_equipment_1_short: "КПП &quot; Алеман де 37 см &quot;"
 PIR_anti_tank_equipment_2_short: "КПП - 7,5 см"
 PIR_anti_tank_equipment_3_short: "КПП M6 de 12,8 см"
 PIR_rocket_artillery_equipment_1: "Батерия Ланча Фогетс, 32 см"
 PIR_rocket_artillery_equipment_1_desc: "В период войны бразильские военные редко применяли артиллерию с ракетами, и несколько изготовленных изделий были прямыми копиями того небольшого немецкого оборудования, на которое хватали бразильские офицеры этого типа; согласно спецификациям оригинальных моделей, в этом оружии использовались ракеты калибра 32 см, и именно из-за отсутствия указанных ракет они редко использовались."
 PIR_rocket_artillery_equipment_2: "Батерия Ланса Фогетес де 21 см"
 PIR_rocket_artillery_equipment_2_desc: "В период войны бразильские военные редко использовали артиллерию с ракетами, и несколько изготовленных изделий были прямыми копиями того небольшого немецкого оборудования, на которое получили свои руки бразильские офицеры. &lt; &lt; Изменения &gt; &gt; в размерах ракет, требуемых для использования в более поздних моделях, стали более распространенными, но все же далеки от стандартного выпуска, и на поле было использовано несколько частей LF de 21cm по сравнению даже с M43."
 PIR_rocket_artillery_equipment_1_short: "Бэт. LF de 21cm"
 PIR_rocket_artillery_equipment_2_short: "Батарея. LF de 32 см"

