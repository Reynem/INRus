 IMP_infantry_equipment_3_desc: "Компания &quot; Корона корпорейшн смол армз лтд. &quot; в Лонг Брэнк ответила на просьбы канадского правительства о самозарядке винтовки. &quot; Самозарядная винтовка &quot; заперта в 8-миллиметровом пулемете &quot; Маузерс &quot; и имеет болт с наклоном. &quot; Пистолет &quot; страдает от проблем надежности и чрезмерной отдачи, однако винтовка поступает с плечевой площадкой, компенсирующей отток. &quot; Легкий вес &quot; , кроме того, делает его идеальным для мобильности и борьбы в городах."
