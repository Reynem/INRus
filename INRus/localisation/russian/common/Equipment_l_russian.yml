 TUR_infantry_equipment_0_desc: "Маузер Т98 был главным сервисным винтовкой Оттоманской армии во время Велткрига. Оттоман М1903, запертый в 7,65ммм, был самым распространенным вариантом Маузера в использовании. Объявленный оттоманами "Мавзер", эта икона получила великую славу и глубоко укоренилась в турецком подсознании."
