 SCA_anti_air_equipment_3_desc: "Смерть сверху становится все более распространенным способом описания воздушных ударов, но в этом случае смерть также происходит из-под снизу. 40-мм пушка не только нанесет огромный ущерб всем самолетам, но и может быть превращена в уничтожающие наземные силы."

