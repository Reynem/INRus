 BOL_infantry_equipment_0: "Модели Маузера 1908 года"
 BOL_infantry_equipment_0_short: "Модель 1908 года"
 BOL_infantry_equipment_0_desc: "В начале XX века, когда в Гран-Чако усилилась напряженность, Боливия и Парагвай приступили к проведению хитроумных кампаний перевооружения в целях противодействия друг другу, в течение этого периода Боливия приняла производную Маузера 1898 года, предназначенную для взаимозаменяемости старой боливийской винтовки Mauser 1891 года, которая, запертая в камере 7,65×53 мм Маузер, стала основой боливийской армии, и спрос на винтовки отечественного производства вызвал быстрый рост в боливийской оружейной промышленности."
 BOL_infantry_equipment_1: "Zbrojovka Brno Mauser Modelo 1928"
 BOL_infantry_equipment_1_short: "Модель 1928 года"
 BOL_infantry_equipment_1_desc: "В конце 1920-х годов, когда волнения все больше угрожали стабильности своих соседей, Боливия увидела необходимость обновления своих пехотных вооружений."
