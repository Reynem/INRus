 #Infantry Equip

 FRA_infantry_equipment_0: "Fusil Lebel Modèle 1886 M93"
 FRA_infantry_equipment_0_short: "Lebel Mle M93"
 FRA_infantry_equipment_0_desc: "Lebel — это 8-миллиметровая боевая винтовка, которая поступила на французскую военную службу с 1887 года, первая в мире винтовка, использующая бездымный порох, известна своей долговечностью и дальней дальностью."
 FRA_infantry_equipment_1: "MAS Modèle 1936"
 FRA_infantry_equipment_1_short: "MAS-36"
 FRA_infantry_equipment_1_desc: "Близость Франции к разрушенной Германской империи ускорила призыв к более современному болтовенному винтовке. Коммун выбрал новую винтовку MAS 36 в качестве новой винтовки для революции. Короткая винтовка в стиле карбины, которая имеет грязь и относительно дешева для производства; MAS 36 будет служить новой стандартной рукояткой для защиты Франции от всех ее врагов."
 FRA_infantry_equipment_2: "MAS Modèle 1938"
 FRA_infantry_equipment_2_short: "MAS-38"
 FRA_infantry_equipment_2_desc: "После окончания «Велткриг» в «Службе вооружений» была осуществлена программа разработки стрелкового оружия. «Снабжение оружием 38» с помощью «Службы Армемента» (оружие, оружейная индустрия) стала первой французской ружьем, которое является очень высококачественным оружием. «Служебное оружие 38» имеет скорость 650 выстрелов в минуту, хотя его внешний вид довольно странен, учитывая его необычное расположение."
 FRA_infantry_equipment_3: "MAS Modèle 1940/42"
 FRA_infantry_equipment_3_short: "MAS-40/42"
 FRA_infantry_equipment_3_desc: "Однако, в отличие от предыдущих, во французских военных испытаниях MAS-40/42 был сделан вывод о том, что оригинальный пятикратный внутренний журнал был сочтен недостаточным, и был разработан новый вариант журнала MAS-40/42 (40/42) с десятью круглыми ящиками."
 FRA_support_weapons: "FM Chauchat & Brandt Mle 27/31"
 FRA_support_weapons_desc: "Проверенные и испытанные в траншеях Велткрига, чаушат долгое время ненавидел французский пехотинец, однако, несмотря на ненависть к этому оружию, когда оно не застряло в грязи и грязи, пистолет достаточно надёжен для контроля, и чаушат может быть также выпущен из бедра. Брэндтский миномет - это реликт из Вельткрига, усовершенствованный британский миномет "Стокс". Простое и эффективное оружие, миномет можно разбить на три части и потребовать команду из десяти человек."
 FRA_support_weapons2: "Hotchkiss M1922 & Brandt Mle 27/31"
 FRA_support_weapons2_desc: "Сильная и надёжная пушка, Hotchkiss M1922 — легкое пулемётное оружие, разработанное Hotchkiss, способное стрелять 450 патронов в минуту, имеет регулятор, который может регулировать скорость огня. Hotchkiss может быть накормлен из надводного журнала или 15/24/30 полос круглой передачи."
 FRA_support_weapons3: "& Brandt Mle 35/38"
 FRA_support_weapons3_desc: "Командование коммуны ясно, что Чаушат и Хотчкисс серьезно устарели. Наши дизайнеры придумали гораздо более легкий пистолет для подготовки к надвигающейся войне, чем Хотчкисс. В то время как Чателлерут имеет низкую скорость огня, он является надежным и надежным оружием, хорошо известным нашим войскам за его последовательность и вес. Брандт Мл 35 представляет собой 60-мм миномет, который должен использоваться пехотными ротами для непрямого огня. Просто и эффективно он требует лишь экипажа из пяти человек для работы."
 FRA_support_weapons4: "MAS AA-42 & Brandt Mle 1942"
 FRA_support_weapons4_desc: "Опыт второго вельткрига привел к интересу к пулеметам общего назначения, которые служат различным тактическим ролям. С почти удвоенной скоростью огня Чателлера AA-42 является монстром с поясом, который может сломать что угодно на своем пути. Mle 42 представляет собой значительное улучшение по сравнению со своим предшественником, с упором на более широкое вспомогательное оружие."
 FRA_infantry_at: "Canon de 75 мм mle 1897 modifee 1933"
 FRA_infantry_at_desc: "Любимый французский 75-миллиметровый пистолет, разработанный для борьбы с личным использованием, поддерживает щит и колеса оригинального полевого пистолета, и этот вариант повысил высоту и 58-градусную траверсу."
 FRA_infantry_at2: "ДБСК-де 73-мм Мл 1943 года"
 FRA_infantry_at2_desc: "Противотанковые ракетные пусковые установки, КАПБР, могут выпускать 73-мм взрывной противотанковый снаряд, способный проникать более чем в 11 дюймов однородных бронежилетов. &lt; &lt; БАРСК &gt; &gt; , боясь всех немецких танковых экипажей, располагает щитом, защищающим оператора от заднего удара ракеты."
 FRA_infantry_weapons2: "RSC 1938 Carbine"
 FRA_infantry_weapons2_desc: "RSC (Fusil Automatique Modele) — полуавтоматическая винтовка. В то время как ранее варианты были длинными и ограниченными подвижностью, карбинная версия позволяет увеличить движение на поле боя. Эта версия 1938 года содержит множество изменений для ее предшественников, таких как более простая добыча, захват и чистка винтовки."
 FRA_improved_infantry_weapons_2: "MAS-36 LG39"
 FRA_improved_infantry_weapons_2_desc: "Этот вариант MAS-36 оснащен сложенным полым алюминиевым запасом и укрепленным стволом, который также может использоваться для запуска гранат, когда он попадает с 48-мм гранатометом."
 FRA_advanced_infantry_weapons2: "Модель CEAM 1944 года"
 FRA_advanced_infantry_weapons2_desc: "Секретный дизайн, скопированный с немецкой линии штурмовых винтовок, CEAM Modele 1944 является первой штурмовой винтовкой Франции."

