 MZB_infantry_equipment_0: "Эспинарда 6,5 мм м/1904"
 MZB_infantry_equipment_0_short: "Маузер-Вергейро"
 MZB_infantry_equipment_0_desc: "Боковая винтовка с длинным опытом работы, 6,5 мм м/1904, более широко известна молотком «Маузер-Вергейро», так как основной дизайн пистолета по существу принадлежит Маузеру 98 (с специальным болтовым механизмом, в значительной степени основанным на Gewehr 1888) с патроном 6,5×58 мм Vergueiro, который был разработан специально для португалского варианта. Он стал официальным оружием португальской армии в 1904-х годах и продолжал использоваться в этом качестве до 1940-х годов и широко использовался как дома, так и за рубежом. Хотя он не использовался португальскими войсками на западном фронте, поскольку он был вооружен главным образом британским оружием, он широко использовался в Африке Португалией, ее союзниками в Южной Африке, а также немцами, которые время от времени захватывали поставки в Португальской Восточной Африке."
 MZB_infantry_equipment_1: "7,92 мм м/1904/36"
 MZB_infantry_equipment_1_short: "M36 Muser-Vergueiro"
 MZB_infantry_equipment_1_desc: "По сути дела, не более чем обновленный вариант Маузера-Вергейро, он был представлен Африке в условиях растущей напряженности между Португалией и Германией."
 MZB_infantry_equipment_2: "Карабина C.A.P. Modelo 01"
 MZB_infantry_equipment_2_short: "С.А.П. М40"
 MZB_infantry_equipment_2_desc: "Прототип карбина, который практически не использовался в португальской армии в целом, был первой попыткой страны решить стандартный вопрос, разработанный на национальном уровне. &lt; &lt; хунта националистов-интегралистов &gt; &gt; активно поддерживала развитие карбина C.A.P., но к тому времени, когда она была готова к производству, реальности на местах сделали более целесообразным переход к ФБП в целом непосредственно от старого Маузера-Вергейро и вариантов, уже широко используемых вооруженными силами."
 MZB_infantry_equipment_3: "Pistola-Metralhadora FBP M/945"
 MZB_infantry_equipment_3_short: "FBP M/945"
 MZB_infantry_equipment_3_desc: "Пистолет FBP назван в честь аббревиатуры Braço de Prata Factory, производителя оружия, литейного изделия, принадлежащего и контролируемого самим португальским правительством. В то время как его разработка началась задолго до его широкого использования среди пехотных войск в португальской армии, законченная модель ввела в производство слишком поздно, чтобы заменить Маузер-Вергейро во время войны. Это намерение было ясно из-за того, что подмашинный пистолет имел довольно необычные штыки, совместимые с моделями Маузера, которые использовались Португалией во время конфликтов предыдущих десятилетий. В то время как на португальском языке термин «пулемет» (по подмашинному оружию в целом) широко использовался на протяжении многих лет, хотя вариант 1945 года не использовался в пользу версий с полуавтоматическим выстрелом и импортными моделями, поскольку в последующие десятилетия после Второй Велкриг масштабы боевых действий уменьшились. Хотя по сравнению со старым маузера-Вергейро, правительство Мозамбика было в состоянии начать производство на национальном уровне относительно быстро после деколонизации."
 MZB_support_weapons: "Metralhadora Vickers & Morteiro Stokes"
 MZB_support_weapons_desc: "Воды, охлаждённые Викерсом МГ и траншеем Стоукса, были стандартным вспомогательным оружием Британской империи во время Велткрига. Во время перевооружения после конфликта восстановленная португальская монархия приобрела и сфабриковала их с намерением широко использовать пехоту как дома, так и за рубежом."
 MZB_support_weapons2: "Metralhadora Lewis Modelo DMS & Morteiro SBML de 2 Polegadas"
 MZB_support_weapons_2_desc: "С помощью своего культового журнала «pan» Льюис служил Контенту с самых мрачных дней первого Велткрига. Вариант MKIII имел пистолетную хватку, которая позволяла стрелять из плеча на любой части палубы корабля. SBML, хотя и маленькая, невероятно переносной, имеет большую огневую мощь и дальность, чем большинство винтовочных гранат."
 MZB_support_weapons3: "Metralhadora Vickers Modelo II & Morteiro ML de 3 Polegadas"
 MZB_support_weapons_3_desc: "В варианте марки II MG Vickers MG предусматривался избирательный вариант огня и хватку пистолета, который был принят главным образом для бронетранспортеров. ML 3 дюймовый миномет был значительно модернизирован со Стоукса, поскольку он был надежным и прочным для непосредственной артиллерийской поддержки."
 MZB_support_weapons4: "Metralhadora Vickers-Vedras & Morteiro de 4.2 Polegadas"
 MZB_support_weapons_4_desc: "Третий вариант уважаемого пулемета &lt; &lt; Викерс &gt; &gt; был разработан для использования в зенитных целях и предусматривает несколько более высокий уровень обстрела со стороны его предшественников."
 MZB_infantry_at: "Мортейро-Бомбарда"
 MZB_infantry_at_desc: "Разработанный в Канаде и проданный Португалией в значительных количествах, минометный дизайн был минометным минометом. Подтверждая, что проект может служить как артиллерийским предметом, так и противотанковым оружием, проект был с нетерпением принят несколькими союзниками Контента, в том числе Португалией."
 MZB_infantry_at2: "LATI"
 MZB_infantry_at2_desc: "С учетом необходимости ручной противотанковой установки, предназначенной для использования на фронтальных линиях, был разработан LATI (прямой перевод на канадский английский язык) на основе конструкции миномета-бомбардировщика."

