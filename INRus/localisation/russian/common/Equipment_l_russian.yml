 ###
 ### Albania ###
 ###

 ### Land ###
 ALB_infantry_equipment_0: "Маннлишер M03"
 ALB_infantry_equipment_0_short: "Маннлишер M03"
 ALB_infantry_equipment_1: "Маузер 98b"
 ALB_infantry_equipment_1_short: "Маузер 98b"
 ALB_infantry_equipment_2: "Модель 1935 года"
 ALB_infantry_equipment_2_short: "Модель ЭМП 1935 года"
 ALB_infantry_equipment_3: "ZB Macchinenkarabiner M.44"
 ALB_infantry_equipment_3_short: "MKar M.44"
 ALB_infantry_equipment_3_desc: "Разработка портативной автоматической винтовки с использованием промежуточной кассеты родилась в монархии благодаря успеху серии Кирали."heavy\" submachine guns and the realisation that combat ranges were far shorter than anticipated. Wanting to maximise the firepower of the infantryman, Czech designer Alois Farlík developed the 8x45mm intermediate cartridge while ZB designed the machine-carbine around it. It would adopt it as the Maschinenkarabiner M.44."
 ALB_infantry_at: "Panzerjägerbüchse M.38"
 ALB_infantry_at2: "Raketenpanzerjägerbüchse M.42"
 ALB_support_weapons: "МГ М.07/12 и МВт М.14"
 ALB_support_weapons2: "MG M.26 & GrW M.33"
 ALB_support_weapons3: "MG M.30 & GrW M.36"
 ALB_support_weapons4: "MG M.45 & GrW M.43"

 #Motorised
 ALB_motorized_equipment_1: "Штэйр 640"
 ALB_motorized_rocket_equipment_1: "Krupp Protze w/ M.44 "Schlägelwerfer""
 ALB_motorized_rocket_equipment_1_short: "Krupp Protze w/ M.44"
 ALB_mechanized_equipment_1: "Saurer Transplanzer M.38/40"
 ALB_mechanized_equipment_1_short: "TPz M.38/40"
 ALB_mechanized_equipment_1_desc: "Потребность в бронетранспортере для механизированной пехоты привела к переоборудованию нескольких различных автомобилей для выполнения этой роли."box\" was added to the chasis that protected the driver and personnel inside. The deployment of these conversions helped cement the concept of armoured transports in Austrian doctrine."
 ALB_mechanized_equipment_2: "Вайс Манфред транспортмен М.39/42"
 ALB_mechanized_equipment_2_short: "TPz M.39/42"
 ALB_mechanized_equipment_2_desc: "В 1942 году венгерская компания &lt; &lt; Вайс Манфред &gt; &gt; начала превращать устаревшие автомобили &lt; &lt; Нимрод СПАТ &gt; &gt; в БТР и бронированные машины скорой помощи, прозванные венгерцами &lt; &lt; Леэль &gt; &gt; . &lt; &lt; Леэль &gt; &gt; оказалась выше TPz38/40 во всех отношениях с более сильными бронетранспортерами и лучшим двигателем."
 ALB_mechanized_equipment_3: "Skoda-MAVAG Transportpanzer M.40/44"
 ALB_mechanized_equipment_3_short: "TPz M.40/44"
 ALB_mechanized_equipment_3_desc: "Когда Австрия постепенно вывела из строя танк М.40 для M.42, первый был переоборудован, одним из которых был БТР, похожий на Lehel, с снятой батареей, а внутренний корпус был перестроен для размещения отряда Панзеринфантери."

 #Armoured Car
 ALB_gw_armored_car_equipment: "PanzerAutomobile"Schildkröte" M.23"
 ALB_gw_armored_car_equipment_short: "PzA M.23"
 ALB_gw_armored_car_equipment_desc: "ПА-II Шкоды с ее архитектурным дизайном и посредственной скоростью для автомобиля прозвали"Turtle". It was ordered by the K.u.K high command to replace the obsolete Austro-Daimler for patrolling occupied Northern Italy and Serbia."
 ALB_armored_car_equipment_1: "PanzerAutomobile \"Csaba\" M.39"
 ALB_armored_car_equipment_1_short: "PzA M.39"
 ALB_armored_car_equipment_1_desc: "Модель 39, разработанная венгерским инженером Миклосом Штраусслером, была введена в эксплуатацию армией К.У.К. в качестве вспомогательного автомобиля для ее вновь организованных моторизованных подразделений."Csaba\"."
 ALB_armored_car_equipment_2: "PanzerAutomobile"Toldi" M.42"
 ALB_armored_car_equipment_2_short: "PzA M.42"
 ALB_armored_car_equipment_2_desc: "Для того чтобы быстро решить эту проблему, было принято решение взять совершенно новую башню из SPz M.42 и оснастить ее более легким 40-миллиметровым пистолетом Бофорса."
 ALB_armored_car_at_equipment: "PanzerjägerAutomobile"Attila" M.43"
 ALB_armored_car_at_equipment_desc: "Поскольку легкие механизированные подразделения армии вступали в контакт с вражескими танковыми войсками, было решено оборудовать некоторые модели M.42 57-мм ружейной башней из СПРЗ M.42 и специализированных боеприпасов AT."

 ###
 ### Algeria ###
 ###

 ### Land ###
 ALG_infantry_equipment_0: "Fusil Lebel Modèle 1886 M93"
 ALG_infantry_equipment_0_short: "Lebel Mle M93"
 ALG_support_weapons: "Миномет Darne M1919 & Stokes"

 ###
 ### Grão Pará (AMA) ###
 ###

 ### Land ###
 AMA_infantry_equipment_0: "Espingarda Mauser Modelo 1908"
 AMA_infantry_equipment_0_short: "Маузер М08"
 AMA_infantry_equipment_0_desc: "Модель Маузера 1908 года была исключительно длинной винтовкой, основанной на Маузере 1898 года и помещенной в камеру 7x57мм Маузер. Первоначально она была изготовлена для Бразилии немецкой компанией DWM, но впоследствии Бразилия начала производить огромное количество винтовки внутри страны, и она стала стержнем во многих армиях штатов по прошествии времени, она стала почти синонимом межгосударственной войны в культурном мышлении страны. Армия штата Гран Пара использовала ту же технику, что и другие штаты, которые сформировали Бразилию, и рядом с южными штатами она была главной боевой силой региона."
 AMA_infantry_equipment_1: "Fusil Mauser Modelo 1935"
 AMA_infantry_equipment_1_short: "Mauser M35"
 AMA_infantry_equipment_1_desc: ""Mauzer Rifle Model 1935" является уникальной винтовкой Mauser, в которой используется патрон калибра 7x57 мм, производимый внутри Бразилии и за рубежом в тесном сотрудничестве с компанией Mauser в рамках широкого сотрудничества между бразильским и немецким правительствами."
 AMA_infantry_equipment_2: "&quot; Суббетрахадора Бергманн модельо 1938 года &quot;"
 AMA_infantry_equipment_2_short: "Бергман М38"
 AMA_infantry_equipment_2_desc: "В последние годы президентства в Пессоа Бразилия приобрела относительно небольшое количество автоматов MP28 в Бергманне, однако в самой Рио-де-Жанейро они никогда не видели большого применения за пределами полков национальной гвардии; M38 является упрощенной и легко производимой производной MP28, созданной в ответ на растущую напряженность в Южной Америке, и была задумана в качестве стандартного огнестрельного оружия для всей бразильской армии, которое было произведено в больших количествах в литейниках по всей стране и как таковое стало почти синонимом бразильской армии в период Велткрига."
 AMA_infantry_equipment_3: "Мечеть Полуавтоматический росси Моделео 1944 года"
 AMA_infantry_equipment_3_desc: "В то время как Второй Велткриг вспыхнул в Европе, бразильское руководство обнаружило, что их оружие просто превосходило гонку вооружений между великими державами, и вместо того, чтобы пытаться наверстать упущенное, оно просто начало выпускать открытую копию новых немецких полуавтоматизированных винтовок, таких, как G41. Первые модели были сделаны в литейном магазине Rossi в Рио-Гранде-ду-Суле, где модель получает свое название. Хотя более продвинутое, чем другое оружие, используемое армией Паулисты, ее низкая надежность делает ее непопулярной для солдат, которые часто предпочитают старые модели или даже захватывают снаряжение."
 AMA_infantry_equipment_3_short: "Росси М44"
 AMA_support_weapons: "Metralhadora M.08/15 & Morteiro de 7,58-cm"
 AMA_support_weapons_desc: ""Велткриг" увидел, как было введено самое смертоносное оружие, известное человеку, как, например, боязливый M.G. Model 08/15. В непосредственной близости от траншей боевые действия, когда-то архаический миномет был возвращен в актуальность. Многие из этого старого оборудования были в числе оборудования, которое было непосредственно продано или сдано в аренду Бразилии в ходе военной миссии из Германии в этой стране."
 AMA_support_weapons_1: "Metralhadora M34 & Morteiro de 8 см"
 AMA_support_weapons_1_desc: "Машинный пистолет 34 (MG34) — пулемет с воздушным охлаждением, смонтированный в мощном пулемете калибра 7,92x57-мм винтовки Маузер, с высокой скоростью огня (900 ринг) и эффективной мобильностью, который, вероятно, стал самым современным пулеметом в мире в то время; и был с нетерпением продемонстрирован Бразилии как доказательство военного превосходства Кайзеррейха. Возможно, неожиданным последствием этого стал тот факт, что дизайн был скопирован правительством Рио с незначительным вниманием к патентам после чёрного понедельника. Mortartar Model 34 является пехотным мином, использующим 8-см снаряды."
 AMA_support_weapons2: "Metralhadora M39 & Morteiro "Torneira" de 20 см"
 AMA_support_weapons_2_desc: "Модель 39 (M.G. 39) была улучшена по сравнению с M.G. 34. Этот поясный пулемет имеет высокую скорость огня и подходит для всех целей. 20-см Leichter Mortar Model 40 представляет собой миномет, предназначенный для нанесения ударов по препятствиям и сильным точкам. Было отмечено, что бразильские копии имеют низкокачественные материалы в их изготовлении, предположительно для снижения затрат."
 AMA_support_weapons3: "Metralhadora Imbel M1 & Morteiro de 8 см"
 AMA_support_weapons_3_desc: "Первые модели тяжелых пулеметов, изготовленных Бразилией для Бразилии, были отмечены очень высокой частотой стрельбы, но также относительно низкой надежностью и долговечностью из-за нескольких углов, которые были вырезаны во время производства; однако, когда она работала правильно, она была одним из самых ужасных видов оружия в арсенале страны."
 AMA_infantry_at: "Антитанковый имбел .50"
 AMA_infantry_at_desc: "Первые модели тяжелых пулеметов, изготовленных Бразилией, для Бразилии, были отмечены весьма высокой частотой стрельбы, но также относительно низкой надежностью и долговечностью из-за того, что в ходе производства были вырезаны несколько углов; однако, когда она работала надлежащим образом, она была одним из самых ужасных видов оружия в арсенале страны."
 AMA_infantry_at2: "&lt; &lt; Ланча роян М44 &gt; &gt;"
 AMA_infantry_at2_desc: "Ракета-носитель &quot; Модель 44 &quot; , как и многие бразильские вооружения своего времени, является довольно необъявленной копией европейского оборудования, использовавшегося во втором веткриге, который впоследствии был изготовлен и использован самой Бразилией."

 AMA_artillery_equipment_1: "Обусейро Рейнметалл де 10,5 см"
 AMA_artillery_equipment_1_desc: "После серии военных миссий из Германии и в Германию правительство Бразилии начало импортировать иностранную артиллерию из этой страны."
 AMA_artillery_equipment_2: "Obuseiro Modelo 41 de 11,5 см"
 AMA_artillery_equipment_2_desc: ""Обузейро Моделео 41" - это не более чем копия спецификаций полевого гаубицы Model 36 из немецкой армии, но с некоторыми усложнениями для снижения производственных издержек, за счет некоторой надежности. Даже при этом пистолет широко использовался артиллерией в Бразилии в течение периода Вельткриг, и был первым куском артиллерийской массы, произведенной внутри страны, а не главным образом импортировался."
 AMA_artillery_equipment_3: "Obuseiro Modelo 43 de 17cm"
 AMA_artillery_equipment_3_desc: "В то же время в 1943-х годах в связи с модернизацией М41 произошло незначительное увеличение огневой мощности, а некоторые усовершенствования были направлены на то, чтобы сделать ее более надежной, однако производство было ограничено в военное время, а усовершенствованное полевое оружие было редким зрелищем в начале 1940-х годов. Однако в последующие годы оно и модели с минимальными вариациями использовались Северным А до 1960-х годов."
 AMA_artillery_equipment_1_short: "О. Рум. 10,5 см"
 AMA_artillery_equipment_2_short: "О. М41, 11,5 см"
 AMA_artillery_equipment_3_short: "О. M43 de 17 см"
 AMA_anti_air_equipment_1_short: "CAA M2 de 2 см"
 AMA_anti_air_equipment_2_short: "CAA M5 de 37 см"
 AMA_anti_air_equipment_3_short: "CAA M7 de 88 см"
 AMA_anti_air_equipment_1: "Canhan Antiaéreo M2 de 2 cm"
 AMA_anti_air_equipment_1_desc: "Антивоздушное оружие является для Бразилии оборонительным приоритетом, поскольку война между штатами продемонстрировала уязвимость федеральной столицы в отношении воздушных судов, несмотря на обширную береговую и наземную оборону. &lt; &lt; М1 &gt; &gt; и &lt; &lt; М2 &gt; &gt; , разработанные совместно с Германией и при ее поддержке, были, по общему признанию, немногим более копий моделей Флака с начала 1930-х годов, но этого было достаточно для того, чтобы справиться с относительно медленной авиацией, развернутой в то время в Южной Америке."
 AMA_anti_air_equipment_2: "Canhan Antiaéreo M5 de 37 см"
 AMA_anti_air_equipment_2_desc: "По мере быстрого развития воздушных судов в стандартный вопрос M2 за прошедшие годы были внесены несколько изменений и изменений, однако позднее модели противовоздушного оружия совершенно отличались друг от друга практически от всех характеристик, начиная с главной оси и кончая размером самой пушки. M5 тесно связан с его немецкой двоюродной компанией, 3,7 см Fla.K 37, но состоит из материалов более низкого качества для удовлетворения производственных потребностей Бразилии."
 AMA_anti_air_equipment_3: "Canhan Antiaéreo M7 de 88 см"
 AMA_anti_air_equipment_3_desc: "По мере быстрого развития воздушных судов в стандартный вопрос M2 было внесено несколько обновлений и изменений, но позднее модели противовоздушного оружия совершенно разнятся почти во всем, и M7 почти полностью отходит от первоначального дизайна, за исключением роли. M7 был первым элементом противовоздушного оборудования, разработанного внутри страны, но даже в этом случае он сохранил столь много сходств с аналогичными видами оружия, которые использовались Германией и ее союзниками в Велткриге, многие эксперты утверждают, что это не совсем другой пистолет, а скорее внутренний вариант. Тяжелый пистолет мало использовался в бразильской службе до окончания войны."
 AMA_anti_tank_equipment_1: "Каньян Антитанк "Алемьян" - 3,7 см"
 AMA_anti_tank_equipment_1_desc: "Изначально прямо импорт из Германии, оружие было прямо названо «Алеман» войсками в казармах из-за его мощи и очевидного иностранного происхождения, поскольку его создатели убедились в том, что имперские орлиные эффиги в каждой модели. В то время как аналогичные модели в Европе были разработаны для использования моторизованными силами, Бразилия использовала устаревший дизайн, более подходящий для множества имеющихся у нее лошадей, а также отсутствие надлежащей дорожной инфраструктуры в конечной линии фронта против Аргентины. Эта нация была главным стимулом для того, чтобы Бразилия начала сфабриковать этот кусок в небольших количествах после 1936 года, как нестабильность в этом регионе и непредсказуемый режим, в котором находятся десятки танков, неуязвимый генеральный персонал в Рио-де-Жанейро."
 AMA_anti_tank_equipment_2: "Антитанковый M2 de 7,5 см"
 AMA_anti_tank_equipment_2_desc: "Разработанная полностью с немецкими моделями в качестве основы, Anti Tank Artillery Model 2, или AT2, была разработана главным образом против видов более тяжелых бронежилетов, используемых европейскими державами, в то время как второй Велткриг был разгневан. С учетом того, что Германия сама менее чем готова сотрудничать с производством на этот раз, незаконно приобретенный материал был основой для отечественного производства, которое начиналось слишком поздно для широкого использования в вооруженных силах."
 AMA_anti_tank_equipment_3: "Антитанковый M6 de 12,8 см"
 AMA_anti_tank_equipment_3_desc: "По мере того, как Велткриг подошёл к концу, бронежилеты в вражеских Танках почти перенасытились пехотными и старыми артиллерийскими моделями, и бразильское решение было вновь смешать европейские конструкции дешевым способом. Эта внутренняя версия «Па.К. 43» имеет все проблемы, связанные с первоначальными пушками, но с меньшей надежностью и была изготовлена с более дешевыми материалами."
 AMA_anti_tank_equipment_1_short: "КПП &quot; Алеман де 37 см &quot;"
 AMA_anti_tank_equipment_2_short: "КПП - 7,5 см"
 AMA_anti_tank_equipment_3_short: "КПП M6 de 12,8 см"
 AMA_rocket_artillery_equipment_1: "Батерия Ланча Фогетс, 32 см"
 AMA_rocket_artillery_equipment_1_desc: "В период войны бразильские военные редко применяли артиллерию с ракетами, и несколько изготовленных изделий были прямыми копиями того небольшого немецкого оборудования, на которое хватали бразильские офицеры этого типа; согласно спецификациям оригинальных моделей, в этом оружии использовались ракеты калибра 32 см, и именно из-за отсутствия указанных ракет они редко использовались."
 AMA_rocket_artillery_equipment_2: "Батерия Ланса Фогетес де 21 см"
 AMA_rocket_artillery_equipment_2_desc: "В период войны бразильские военные редко использовали артиллерию с ракетами, и несколько изготовленных изделий были прямыми копиями того небольшого немецкого оборудования, на которое получили свои руки бразильские офицеры. &lt; &lt; Изменения &gt; &gt; в размерах ракет, требуемых для использования в более поздних моделях, стали более распространенными, но все же далеки от стандартного выпуска, и на поле было использовано несколько частей LF de 21cm по сравнению даже с M43."
 AMA_rocket_artillery_equipment_1_short: "Бэт. LF de 21cm"
 AMA_rocket_artillery_equipment_2_short: "Батарея. LF de 32 см"

