 SZC_infantry_equipment_2_desc: "Многие модели 1921 года были импортированы в Китай в 1920-х годах, несмотря на то, что США являются ведущим участником международного эмбарго на экспорт военного оружия в эту страну."
 SZC_infantry_equipment_3: "Сычуань Синьхай типа 33"
 SZC_infantry_equipment_3_short: "Сычуаньский тип 33"
 SZC_infantry_equipment_3_desc: "Тип 33 — полуавтоматическая винтовка, основанная на винтовке генерала Лю с 1914 года. &lt; &lt; Тип 33 &gt; &gt; , хотя и выглядит аналогичным образом, короче, имеет заднюю часть приемного устройства, а газопроводная система заменена простым газовым портом. &lt; &lt; Новая винтовка &gt; &gt; также не может больше переключаться на ручные действия и использовать журналы из автомата &lt; &lt; Чехемия &gt; &gt; ZH-29 и легкого пулемета ZB-26."

