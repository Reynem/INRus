 APG_infantry_equipment_0: "Винтовка, калибр 30-06, модель 1903"
 APG_infantry_equipment_0_short: "M1903 Спрингфилд"
 APG_infantry_equipment_0_desc: "Модель 1903 года была разработана в Спрингфилд-Арсенале, когда после испано-американской войны Соединенные Штаты сочли винтовку Краг-Йёргенсен неадекватной из-за ее слабого действия; в ее основе была попытка объединить полезные черты как Крага, так и испанских мазеров."
 APG_infantry_equipment_1: "Винтовка, Калибр 30-06, модель 1903A1, специальный целевой показатель"
 APG_infantry_equipment_1_short: "M1903A1 Спрингфилд"
 APG_infantry_equipment_1_desc: "Спрингфилд M1903A1 был принят Армией США в 1929 году в качестве "U.S. Rifle, Calibre 30-06, M1903A1" и включал в себя пистолетный пистолет, чеканную задницу, зазубринный пусковой крючок и несколько небольших усовершенствований в оригинальном дизайне 1903 года."
 #Colt M1929:
 APG_infantry_equipment_2: "Винтовка, Калибр 30-06, модель 1937 года"
 APG_infantry_equipment_2_short: "М1937 Кольт"
 APG_infantry_equipment_2_desc: "С началом гражданской войны новый армейский департамент США опубликовал просьбу о разработке полуавтоматических винтовок. Компания &lt; &lt; Кольт &gt; &gt; представила в 1938 году винтовку калибра 2,76 калибра. &lt; &lt; Кольт М1937 &gt; &gt; , последняя из которых была выпущена в результате дизайна J.E. Browning (сводный брат Джона Мозеса Браунинга), представляет собой газовый проект, состоящий из 108 частей. &lt; &lt; М1937 &gt; &gt; была принята в эксплуатацию в конце 1938 года после изменения по просьбе Управления по вопросам оружия с 276 до 30-06 калибра."
 #M1 carbine, basically:
 APG_infantry_equipment_3: "Карбина, Калибр 30, модель 1942 года"
 APG_infantry_equipment_3_short: "M1942 Карбин"
 APG_infantry_equipment_3_desc: "В 1940 году Департамент по вопросам оружия подал просьбу о предоставлении новой "легкой винтовки" или карбина, хотя точные требования к оружию были окончательно разработаны лишь в 1941 году. &quot; Кольт &quot; не представил настоящую конструкцию карбина, поскольку она была ранее занята, но после смерти Дж.Э. Браунинга они назначили на проект подрядчика Дэвида Маршалла Уильямса, который начал работу над короткотактным газовым поршнем. &quot; Уильямс &quot; включил свой короткотактный поршнь в существующий прототип &quot; Кольта &quot; и укоротил его в соответствии с требованиями департамента &quot; Орденс &quot; . Новая винтовка в конечном счете будет принята в эксплуатацию."
 APG_infantry_weapons2: "Машинное оружие, Калибр .45, модель 1928A1, Томпсон"
 APG_infantry_weapons2_short: "M1928A Томпсон"
 #M2 Hyde:
 APG_improved_infantry_weapons_2: "Пистолет под матрасом, Калибр .45, модель 1935A2, Хайд"
 APG_improved_infantry_weapons_2_short: "M1935A2 Хайд"
 #1946 but with funding+ACW probably possible earlier:
 APG_advanced_infantry_weapons2: "Автоматическая винтовка, Калибр 30-06, модель 1944, Зиг"
 APG_advanced_infantry_weapons2_short: "М1944 Зиг"
 #Williams Anti-tank rifle:
 APG_infantry_at: "Антитанковая винтовка, Калибр .50, модель 1942 года"
 APG_infantry_at_short: "M1942 Антитанковая винтовка"
 APG_infantry_at_desc: "Хотя процесс разработки начался вскоре после начала войны, его развитие заняло несколько лет и было сопряжено с задержками. &lt; &lt; Вильямс антитанковая винтовка &gt; &gt; была окончательно принята армией в 1942 году."
 #M18 Recoilless Rifle:
 APG_infantry_at2: "Безоткатные винтовки, 2,2 дюйма, модель 1942 года"
 APG_infantry_at2_short: "M1942 Безоткатные винтовки"
 APG_infantry_at2_desc: "Беспилотный пулемёт M1942 — это противоматериальное оружие с плечом, разработанное двумя инженерами «Крогер» и «Муссер» в рамках внештатного проекта Военной пехотной секции США. «М1942» был разработан в ответ на быстрое совершенствование бронежилетов, что значительно снизило эффективность противотанковых винтовок, достаточно небольших для переноса. «М1942 безоткатная винтовка» имеет эффективный диапазон в 400 ярдов, максимальный диапазон в 5000 ярдов, и более точный по сравнению со старой противотанковой винтовкой M1942. Она быстро называлась «карманная артиллерия» солдатами, которые ее использовали."
 APG_support_weapons: "MG, Cal. 30-06, M1919, Browning & Mortar, 3 дюйма, Стоукс"
 APG_support_weapons_short: "M1919 Browning MG & Stokes"
 #8 cm Granatwerfer 34:
