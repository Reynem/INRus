 ACC_infantry_equipment_0_desc: "Модель 1903 года была разработана в Спрингфилд-Арсенале, когда после испано-американской войны Соединенные Штаты сочли винтовку Краг-Йёргенсен неадекватной из-за ее слабого действия; в ее основе была попытка объединить полезные черты как Крага, так и испанских мазеров. Эта винтовка была постепенно принята вместе с патроном 30-06 как до, так и в то время, когда весь остальной мир воевал с Велткригом."
