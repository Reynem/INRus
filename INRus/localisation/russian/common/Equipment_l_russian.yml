 AST_armored_car_at_equipment: "Рёскин Гиппо"
 AST_armored_car_at_equipment_short: "Гиппо"
 AST_armored_car_at_equipment_desc: "Для того чтобы разместить значительно более крупный пистолет, коаксиальная машина Рино должна была быть снята, а ее башня немного увеличена. "Хиппо" как эта модель была названа, оказалась довольно головной болью для его проектной команды, поскольку эти изменения привели к тому, что и без того тяжелый автомобиль столкнулся с проблемами веса, как и его предшественники, которые должны были медленно проработать до принятия автомобиля."

