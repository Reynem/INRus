 ANQ_artillery_equipment_1_short: "Тип 13"
 ANQ_artillery_equipment_1_desc: "Будучи наиболее добытой артиллерией в период Бейянга, эта артиллерия служила в различных армиях центральным правительством и военными баронами по всему Китаю."
