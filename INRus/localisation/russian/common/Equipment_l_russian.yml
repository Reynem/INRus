 #Skoda TH-7:
 CZE_mechanized_equipment_1: "Pásove vozidlo vzor 1937"
 CZE_mechanized_equipment_1_short: "PV vz. 37"
 CZE_mechanized_equipment_1_desc: "Для наблюдателей и теоретиков гражданская война в Америке продемонстрировала современные механизированные боевые действия и продемонстрировала, как сильно удалось повысить надежность отслеживаемых транспортных средств и расширить их возможности в различных странах. В качестве сдерживающей меры, направленной на повышение мобильности их моторизованной пехоты, артиллерийские тракторы, главным образом из серии &lt; &lt; Прага Т &gt; &gt; , были переданы в распоряжение своих оперативных дивизий, в результате чего они были переоборудованы в качестве бронетранспортеров до тех пор, пока не будут установлены соответствующие бронетранспортеры."
 #Saurer RR-7:
 CZE_mechanized_equipment_2: "Pásove vozidlo vzor 1938"
 #Saurer RR-7:
 CZE_mechanized_equipment_2_short: "PV vz. 38"
 CZE_mechanized_equipment_2_desc: "Saurer RR-7 — это гибридная бронированная машина, которая может использовать оба пути или колеса, которая была введена в качестве артиллерийского трактора в 1937 году, но оказалась гораздо более разносторонней машиной с легкой доспехами и высокой мобильностью, которая не только выполняла бы роль разведывательной машины, но и выполняла бы роль военно-воздушной машины, став первой бронированной машиной монархии такого типа."
 #43.M Lehel:
 CZE_mechanized_equipment_3: "Obnény transporter vzor 1943"
 #43.M Lehel:
 CZE_mechanized_equipment_3_short: "OT v. 43"
 CZE_mechanized_equipment_3_desc: "Поскольку большое число самоходных противовоздушных автомобилей &quot; Нимрод &quot; находится в инвентаризации, а автоканнон пытается выполнить свою роль, многие из них были переоборудованы без заграждения для выполнения функций бронированной машины скорой помощи и бронетранспортера, что сделало их одним из первых современных бронетранспортеров и значительно увеличило срок службы их материнского дизайна."
