 HOL_mechanized_equipment_1_desc: "В 1940 году на базе грузового автомобиля &quot; Шевролет ИПК &quot; ( &quot; Кэб оф Шасси &quot; ) был установлен корпус с наклоном 20 мм толщиной в переднем галактике и 12 мм толщиной в боковых и задних сторонах. &quot; Главная кабина &quot; насчитала одну бронированную панель с навесными панелями и полосу бокового обзора, в то время как командующая получила трехличное место, в котором находился охлажденный воздухом пулемет калибра 30 (7,62 мм) или жидко охлажденный пулемет (3,03 (7,7 мм) &quot; Виккерс &quot; и задний люк."
