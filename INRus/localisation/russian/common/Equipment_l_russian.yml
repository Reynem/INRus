 BAT_infantry_equipment_3_short: "MKb 42"
 BAT_infantry_equipment_3_desc: "MKb 42 — это революционная камера для нового промежуточного гильза, разработанная известным немецким дизайнером оружия Хьюго Шмейссером совместно с компанией Haenel. В то время как первый прототип винтовки был подвержен глушению, как военные, так и даже сам Кайзер были очень воодушевлены проектом, и огромные ресурсы были сосредоточены на совершенствовании дизайна, а винтовка была готова для принятия в 1942 году."
