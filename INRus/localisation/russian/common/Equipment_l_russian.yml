 ### Land ###
 SRD_infantry_equipment_0: "Carcano Modello 1891"
 SRD_infantry_equipment_0_short: "Carcano M91"
 SRD_infantry_equipment_0_desc: "Каркано М91 был стандартным болтом итальянской армии во время Велткрига. Часто ошибочно назывался Маннлихер-Каркано, в журнале винтовки использовались блок-зарядные клипы, первоначально из Фердинанда Маннлишера, но фактическая форма и дизайн клипа Каркано были взяты из немецкой модели 1888 года. Когда королевская семья бежала с полуострова в Сардинию в спешке, эти винтовки должны были защитить Сардинию от безбожных революционеров."
 SRD_infantry_equipment_1: "Полуавтоматический фургон &lt; &lt; Энфилд &gt; &gt;"
 SRD_infantry_equipment_1_short: "Facile Enfield"
 SRD_infantry_equipment_1_desc: "Поскольку Сардинии не хватает тяжелой военной промышленности, она опирается на оружие других сил Энфилд-Онтарио (разработанный канадской армией) представляет собой полуавтоматизированную газовую модификацию классической винтовки SMLE. Даже если Сардиния не может производить оружие, Энфилд-Онтарио более чем рад помочь."
 SRD_infantry_equipment_2: "Автоматическая карабина Hotchkiss"
 SRD_infantry_equipment_2_short: "Карабина Хотчкисс"
 SRD_infantry_equipment_2_desc: "Оружие национального французского происхождения, большое количество автомата Carabina Hotchkiss были отправлены в Сардинию. Карабина является амбициозно спроектированным и хорошо изготовленным автоматом, представленным Hotchkiss в 1938 году как Type 017, который вошёл в эксплуатацию в качестве Carabine-Mitraileus Hotchkiss Type M2 (вместе с его полицейским вариантом типа M1). Экстремальная компактность CMH2 является как его лучшей, так и худшей особенностью - сложностью, которая заключается в том, что каждая выступающая часть сломана или сбрасывание оружия делает его дорогостоящим для производства, а также уменьшает эргономику, что не идеально для быстрого приобретения цели."
 SRD_infantry_equipment_3: "Автоматическое устройство MAS Modello 1943"
 SRD_infantry_equipment_3_short: "Автоматическое устройство &quot; Facile &quot; M1943"
 SRD_infantry_equipment_3_desc: "Как и большинство из арсеналов Сардинии, модель Fucile Automatoryo MAS 1943 — французское оружие. Fusil MAT Modèle 43 — автоматическая винтовка с патроном калибра 7.5x54 мм и сложенным журналом, что позволяет сделать его немного компактнее, чем его обычные коллеги. Наряду с этим MAT-43 производится машинным способом, позволяющим производить большое количество винтовок, которые в срочном порядке требуются Сардинскому правительству. Несмотря на некоторые проблемы со скоростью огня и надежностью, MAS-43 рассматривается в качестве следующего шага в области личного оружия."
 SRD_support_weapons: "Миномет Darne M1919 & Stokes"
 SRD_support_weapons_desc: "Дарн М1919 - это пулемёт французского происхождения. Внешность оружия груба, а пояс монстра пулемета был разработан для быстрого производства технологий из-за изгнания многих французов. Миномет Стоукса - это британский гладкий пусковой пусковой канат, позволяющий использовать более высокие углы огня."
 SRD_support_weapons2: "Mitraillouse Hotchkiss Mle 1926 & Morter Brandt Mle 27/31"
 SRD_support_weapons2_short: "Hotchkiss Mle 1926 & Brandt Mle 27/31"
 SRD_support_weapons2_desc: ""Hotchkiss Mle 1926" является пулеметом французского происхождения, официально принятым сардинскими войсками. Это легкое пулемет с регулятором, который контролирует скорость огня, а также журнал с навесом или поясом. Простой и эффективный миномет Брандта, разработанный Эдгаром Брандтом, требует 10 человек и может стрелять 18 патронов в минуту, что делает его невероятным оружием для поддержки огня."
 SRD_support_weapons3: "Mitraillouse Hotchkiss Mle 26/37 & Mortier Brandt Mle 35/38"
 SRD_support_weapons3_short: "Hotchkiss Mle 26/37 & Brandt Mle 35/38"
 SRD_support_weapons3_desc: "По мере того, как напряженность нарастает по всему континенту, &quot; Энтенте &quot; должна быть готова приступить к разработке планов возвращения домой. &quot; Хотчкисс Мле &quot; претерпела новые изменения и усовершенствования, которые уменьшают откат пулемета при незначительном увеличении скорости его огня."
 SRD_support_weapons4: "Mitraillouse Hotchkiss Mle 26/41 & Mortier Brandt Mle 1942"
 SRD_support_weapons4_short: "Hotchkiss Mle 26/41 & Brandt Mle 42"
 SRD_support_weapons4_desc: "Продолжающееся использование автомата Hotchkiss и миномета Брандт отражает тесное франко-сардинское сотрудничество."
 SRD_infantry_weapons2: "Карабина Моделило 1928 года"
 SRD_infantry_weapons2_desc: "В рамках сотрудничества Сардинии с Контенти сардинскими силами был принят канадский M1928A1. M1928A1 является сервисным вариантом классического автомата M1921 Томпсон, и, несмотря на то, что его производство дорого, этот пистолет хорошо нравится солдатам в поле, которые высоко оценивают его эффективность и надежность."
 SRD_improved_infantry_weapons_2: "Пистолет с помадами для ланчестеров"
 SRD_improved_infantry_weapons_2_desc: "В рамках англо-сардинского сотрудничества копии Ланчестера были отправлены в Сардинию, поскольку в них не хватает автоматов."
 SRD_advanced_infantry_weapons2: "Carbine De Lisle"
 SRD_advanced_infantry_weapons2_desc: ""De Lisle Carbine" — усовершенствованная винтовка, которая помогает пользователю поддерживать точность, а также скрытность. Для того чтобы помочь сардинским специальным силам, канадцы отправили копии "De Lisle", что является отражением постоянной поддержки "Entente" Сардинии."

 ###Artillery
 SRD_artillery_equipment_1: "Пушки 75-мм моделило 1897 года"
 SRD_artillery_equipment_1_short: "Пушки 75-мм"
 SRD_artillery_equipment_1_desc: "Матерь 75-мм Мл 1897 года, также известная как французская 75-я или "Soixante-Quinze" ("семьдесят пять"), широко рассматривается в качестве первой современной артиллерии. С 1898 года Soixante-Quinze широко используется в Вельткриге, где она используется в качестве противопехотного, зенитного и противотанкового оружия. После отступления в Алжир французская армия продолжала применять это оружие, главным образом потому, что оно по-прежнему в основном отвечает современным критериям."
 #Canon de 105 court mle 1934 Schneider:
 SRD_artillery_equipment_2: "Obice da 105mm Modello 1935 Шнайдер"
 SRD_artillery_equipment_2_short: "Obice da 105 мм S"
 SRD_artillery_equipment_2_desc: "Materiel de 105-мм Court Mle 1935 — консервативный проект Шнайдера, разработанный для замены Soixante-Quinze на службе, Materiel de 105-мм больше гаубица, чем пушка, и предназначается главным образом для уничтожения артиллерийских сооружений противника."
 SRD_artillery_equipment_3: "Каннон да 155-мм Гранде Потенца Филью Моделило 1917/1942"
 SRD_artillery_equipment_3_short: "Пушки да 155-мм ППГ"
 SRD_artillery_equipment_3_desc: "Кэнон де 155-мм Гранд-Писсанс Филью Модель 1917 года, известный также как ПФФ, был разработан во время Велткрига полковником Луисом Фильо, чтобы удовлетворить срочную потребность в современной тяжелой артиллерии, и используется как Коммунардом, так и национальными правительствами; из-за проблем, связанных с производством ГПФ в колониях французским правительством, до 1942 года, когда проект ПФР был обновлен, с тем чтобы облегчить производство и обеспечить соответствие современным стандартам."

 #25mm SA 34:
 SRD_anti_tank_equipment_1: "25-мм пушка Полуавтоматическая модель 1934 года"
 SRD_anti_tank_equipment_1_short: "25-мм пушки"
 SRD_anti_tank_equipment_1_desc: "К началу 1920-х годов французская армия пришла к пониманию того, что бронебойный потенциал 37-мм пехотного пехотного пехотинцев ТРП будет недостаточным против современных танков. в 1926 году Hotchkiss предложил 25-миллиметровый проект оружия, который не был немедленно принят из-за финансовых проблем и наличия боевой техники 75-ммм. Матерь 25-ммм, которая вступила в строй только в 1936 году с началом приближающейся битвы за Францию, является надежным оружием, вдохновленным концепцией Фильо."
 #Modified Matériel de 75mm Modèle 1897:
 SRD_anti_tank_equipment_2: "Пушки contocarro da 75-мм Modello 1897/1937"
 SRD_anti_tank_equipment_2_short: "Пушки 75-мм CC"
 SRD_anti_tank_equipment_2_desc: "С принятием 105-мм боевой техники старый боевик де 75-мм был в основном переоборудован в противотанковые ружья с обновленным шасси, которые, как считается, были слишком тяжелыми для современных противотанковых пушек, Soixante-Quinze имеет более высокий уровень проникновения, чем их коллеги."
 #Very modified Matériel de 75mm:
 SRD_anti_tank_equipment_3: "Cannone contocarro da 75-мм Modello 1943"
 SRD_anti_tank_equipment_3_short: "Пушки 75-мм CC SA"
 SRD_anti_tank_equipment_3_desc: "Материэль де 75-мм SA является новым полуавтоматическим оружием, основанным на 75-мм боевой пулемете с 75-мм пушками переменного тона. С более высокой скоростью огня, Матерь с 75-мм калибром CA SA по-прежнему является несколько устаревшим оружием, но может конкурировать со своими современными аналогами благодаря модернизированному механизму и новому подходу к конструкции шасси."

 #Hotchkiss 25mm:
 SRD_anti_air_equipment_1: "Пушка-Митраглира да 25-мм контраереа модельо 1936 года"
 SRD_anti_air_equipment_1_short: "Пушки-Митраглира да 25-мм CA"
 SRD_anti_air_equipment_1_desc: "После возвращения в Алжир французские военные объявили о необходимости специализированного зенитного автоканнона. &quot; Хотчкисс &quot; в 1936 году ввела 25-миллиметровый проект, который был принят из-за медленной разработки более перспективного варианта Шнайдера. &quot; Митрайлуз &quot; 25-миллиметровый CA, который был принят в эксплуатацию, был заменен на трехстороннюю базу с двухколесным транспортом по просьбе армии."
 #Schneider 37 mm:
 SRD_anti_air_equipment_2: "Пушка-Митраглира да 37 мм contraera Modello 1939"
 SRD_anti_air_equipment_2_short: "Пушки-Митраглира да 37-мм CA"
 SRD_anti_air_equipment_2_desc: "Разработанный с 1930 года, Mitrailleuse 37-мм CA наконец-то был готов к производству в 1939 году. После ожесточенного спора с французскими военными, которые уже приняли вариант Hotchkiss, Mitrailleuse 37-мм CA из Шнайдера был принят после первоначальных испытаний в качестве более продвинутого варианта, чем 25-миллиметровый пистолет Hotchkiss."
 #Canon de 75 CA modèle 1940 Schneider:
 SRD_anti_air_equipment_3: "Пушка 75-мм противоаэреа модель 1940 года"
 SRD_anti_air_equipment_3_short: "Пушки 75-мм CA"
 SRD_anti_air_equipment_3_desc: "В конце 1920-х годов было установлено, что боевая техника Modiel de 75-мм Modèle 1897 года устарела, поскольку зенитное оружие и разработка нового ружья начались в 1931 году. &lt; &lt; Материэль де 75-мм контре-Аэриен Модель 1940 года &gt; &gt; , осуществленная Шнайдером, имеет более высокие скорость огня, более высокую скорость музов, повышенную вертикальную дальность, современную систему управления огнем и более высокую мобильность с новыми ружьями, чем старая Soixante-Quinze. &lt; &lt; Ужасно &gt; &gt; , поражённая показом бывшего Mitrailleuse 37-мм CA из Шнайдера, французское командование быстро приняло новый 75-миллиметровый пистолет."

