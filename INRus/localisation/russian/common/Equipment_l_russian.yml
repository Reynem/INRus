 DOM_infantry_equipment_0: "Спрингфилд Краг-Йёргенсен Моделео 1898 года"
 DOM_infantry_equipment_0_short: "Спрингфилд М1898"
 DOM_infantry_equipment_0_desc: "Винтовка Краг-Йоргенсен была принята Соединенными Штатами в 1892 году для замены стареющей Спрингфилдской модели 1884 года. В то время как Краги оказались выше на близком расстоянии по сравнению с аналогичными конструкциями Маузера в испано-американской войне, неустойчивое действие винтовки по сравнению с новыми конструкциями болта потребовало замены всего лишь через десять лет после ее принятия. Во время американской оккупации нескольких центральноамериканских государств в начале XX века многие накопленные винтовки Крага, в основном из винтовки 1898 года, были предоставлены местным силам вместе с двигателями из избыточных боеприпасов."
 DOM_infantry_equipment_1: "Fabrique Nationale Mauser Modelo 1924"
 DOM_infantry_equipment_1_short: "FN-24"
 DOM_infantry_equipment_2: "Topmpon Modelo 1928A1"
 DOM_infantry_equipment_2_short: "Томпсон М1928А1"
 DOM_infantry_equipment_3: "Кирали-Кристобал Карбин"
 DOM_infantry_equipment_3_short: "Кристобал Карбин"
 DOM_infantry_equipment_3_desc: "В то время как венгерский дизайнер оружия Пауль Кирали был принят на вооружение двойной монархией, они, тем не менее, не оправдали собственных ожиданий Кирали. &lt; &lt; Кристобаль &gt; &gt; представляет собой развитие этих СМГ, перестроенных вокруг нового картрида промежуточного калибра, хотя в конечном итоге они были отвергнуты двойной монархией, Доминиканской Республикой, где Кирали однажды считал иммиграцией, оказался более восприимчивым, приняв пистолет в качестве карбины &lt; &lt; Кристобаль &gt; &gt; после города Сан-Кристобал."

