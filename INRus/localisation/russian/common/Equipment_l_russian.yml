 SHD_infantry_equipment_0: "Маузер С96 : Боке Цяньг"
 SHD_infantry_equipment_0_short: "Кока-кянг"
 SHD_infantry_equipment_0_desc: "Mauser C96 (Construction 96) — полуавтоматический пистолет, первоначально изготовленный немецким производителем оружия Маузером с 1896 по 1937 год."
 SHD_infantry_equipment_1: "Джинан типа 26"
 SHD_infantry_equipment_1_short: "Джинан типа 26"
 SHD_infantry_equipment_1_desc: "Эта винтовка первоначально называлась Type 27', была вставлена на службу Qing в 1935 году благодаря германской помощи после восстановления. В функциональном плане это оружие является почти копией немецкого Mauzer M1924 и значительным улучшением по сравнению с гораздо более старым типом 88 с точки зрения веса и оттока. ~nnnnFirst, произведенный в арсенале Ханьяна с немецкими инструментами, методы изготовления уже распространились на Джинан, хотя он может не полностью заменить своих предшественников в течение некоторого времени."
 #OTL Chinese copy of Astra Model 900:
 SHD_infantry_equipment_2: "Tayyuan Arsenal Type 20 Zilaide"
 SHD_infantry_equipment_2_short: "Зилайд"
 SHD_infantry_equipment_2_desc: "Совершенствование оригинального дизайна Mauser C96, Schnellfeuer (Rapid Fire) или так называемого "Zilaide" на китайском языке было очень успешным дизайном с стираемым журнальным питанием и способностью к отбору огня. ~ Несмотря на дальнейшее совершенствование в последующих версиях, включали в себя отделяемый бочонок, улучшенные передние и задние видимости, более долговечные части для предотвращения поломки под постоянным огнем и пониженное положение плечевой части во избежание "укуса молотка"."
 SHD_infantry_equipment_3: "Тип 35"
 SHD_infantry_equipment_3_short: "Тип 35"
 SHD_infantry_equipment_3_desc: "Тип 35 — полуавтоматическая винтовка, основанная на винтовке генерала Лю с 1914 года. &lt; &lt; Тип 35 &gt; &gt; , хотя и выглядит аналогичным образом, короче, имеет заднюю часть приемного устройства, а газопроводная система заменена простым газовым портом. &lt; &lt; Новая винтовка &gt; &gt; также не может больше переключаться на ручные действия и использовать журналы из автомата &lt; &lt; Чехемия &gt; &gt; ZH-29 и легкого пулемета ZB-26."

