 ### Land ###
 NIC_infantry_equipment_0: "Спрингфилд Краг-Йёргенсен Моделео 1898 года"
 NIC_infantry_equipment_0_short: "Спрингфилд М1898"
 NIC_infantry_equipment_0_desc: "Винтовка Краг-Йоргенсен была принята Соединенными Штатами в 1892 году для замены стареющей Спрингфилдской модели 1884 года. В то время как Краги оказались выше на близком расстоянии по сравнению с аналогичными конструкциями Маузера в испано-американской войне, неустойчивое действие винтовки по сравнению с новыми конструкциями болта потребовало замены всего лишь через десять лет после ее принятия. Во время американской оккупации нескольких центральноамериканских государств в начале XX века многие накопленные винтовки Крага, в основном из винтовки 1898 года, были предоставлены местным силам вместе с двигателями из избыточных боеприпасов."
 NIC_infantry_equipment_1: "Carabina del Pueblo Modelo 1934"
 NIC_infantry_equipment_1_short: "Карабина М1934"
 NIC_infantry_equipment_1_desc: "С социалистической революцией Никарагуа оказалась в быстро стареющем запасе избыточных запасов американских краж и небольшого количества боеприпасов для поставок своего ограниченного арсенала. 1934 году в целях решения этих проблем она приступила к амбициозным усилиям по модернизации и переоборудованию своих винтовок «Краг» в карбинах на 7,5×54ммм французском языке, которые были успешно ввезены в страну в больших количествах."
 NIC_infantry_equipment_2: "Metralleta Modelo 1935"
 NIC_infantry_equipment_2_short: "Metralleta M1935"
 NIC_infantry_equipment_2_desc: "Хотя Никарагуа еще до социалистической революции официально не приняла субмашину, многие &quot; Модель 1921 &quot; вошли в страну вместе со способностью отечественных производителей производить боеприпасы АКТ 45. &quot; Метралета &quot; 1935 года является никарагуанским модернизированным Томпсоном 1921 года с несколькими усовершенствованиями и упрощенным производственным процессом."
 NIC_infantry_equipment_3: "MAS Modèle 1940/42"
 NIC_infantry_equipment_3_short: "MAS-40/42"
 NIC_infantry_equipment_3_desc: "Однако, в отличие от предыдущих, во французских военных испытаниях MAS-40/42 был сделан вывод о том, что первоначально выпущенный пятикратный внутренний журнал был сочтен недостаточным, и был разработан новый вариант журнала MAS-40/42 (40/42) с десятью круглыми ящиками, в который было ввезено небольшое количество винтовок MAS-40/42, а также были ввезены в Никарагуа с помощью технических средств."

