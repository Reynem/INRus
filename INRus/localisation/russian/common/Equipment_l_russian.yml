 #Amphibious

 APG_amphibious_mechanized_equipment_1: "Посадочное транспортное средство, отслеживаемое, модель M1940A1"
 APG_amphibious_mechanized_equipment_1_short: "M1940A1 Посадочное транспортное средство"
 APG_amphibious_mechanized_equipment_1_desc: "Серия посадочных автотранспортных средств с боевыми амфибиями первоначально предназначалась исключительно для перевозки грузов с судов на берег, которые, разумеется, превратились в высокоэффективные боевые машины и машины пожарной поддержки, разработанные Дональдом Рёблингом в 1935 году, гражданской спасательной машиной."Alligator" was later developed into the M1940, which lacked armour protection and was unreliable when used on hard terrain. The M1940A1 built upon the M1940, with that vehicles most glaring problems fixed."
 APG_amphibious_mechanized_equipment_2: "Посадочное транспортное средство, отслеживаемое, модель 1943 года"
 APG_amphibious_mechanized_equipment_2_short: "M1943 Посадочное транспортное средство"
 APG_amphibious_mechanized_equipment_2_desc: "M1943 улучшился по отношению к M1940A1, значительно увеличив грузоподъемность, хотя и за счет скорости, несмотря на усовершенствование двигателя."

 #Armoured Car
 APG_gw_armored_car_equipment: "Автомобиль-скаут, модель 1935 года"
 APG_gw_armored_car_equipment_short: "Машина для скаутов M1935"
 APG_gw_armored_car_equipment_desc: "Автомобиль M2-Scout — легко бронированный, открытый наверху и пулемётный автомобиль с четырьмя колесами, разработанный для выполнения разведывательных функций."
 APG_armored_car_equipment_1: "Автомобиль-скаут, модель 1939 года"
 APG_armored_car_equipment_1_short: "Скаутская машина M1939"
 APG_armored_car_equipment_1_desc: "M1939 Scout Car — это развитие M1935, разработанное с учетом опыта, накопленного во время Гражданской войны. M1939 — Спорт — несколько небольших усовершенствований, появившихся в результате военного опыта, таких, как бронированный бронированный и передний ролик, и более надежный двигатель. Хотя сама концепция Scout Car получила критику за то, что она была сосредоточена на мобильности по сравнению с выживаемостью, M1939 все же была принята в эксплуатацию."
 #Greyhound:
 APG_armored_car_equipment_2: "Бронированная машина, легкая, модель 1942 года"
 APG_armored_car_equipment_2_short: "М1942 Бронированный автомобиль"
 APG_armored_car_equipment_2_desc: "M1942 — бронеавтомобиль, выпускаемый компанией Ford Motor Company."
 #Deerhound:
 APG_armored_car_at_equipment: "Бронированная машина, модель 1941A1"
 APG_armored_car_at_equipment_short: "Бронированный автомобиль M1941A1"
 APG_armored_car_at_equipment_desc: "Бронированный автомобиль M1941 был разработан компанией Ford Motor Company и был одним из двух дизайнов, представленных в соответствии с требованиями 1941 года для среднего бронетранспортера."

