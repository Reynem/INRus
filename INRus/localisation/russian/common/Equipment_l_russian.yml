 SRD_train_equipment_1: "ПС Группо 740"
 SRD_train_equipment_1_short: "ПС Гр. 740"
 SRD_train_equipment_1_desc: "Созданная Адриатическими железными дорогами незадолго до национализации железных дорог в 1905 году, Группа 740 является серией «укрепленных» локомотивов класса."
 SRD_train_equipment_2: "ПС Группо 741"
 SRD_train_equipment_2_short: "ПС Гр. 741"
 SRD_train_equipment_2_desc: "С учетом нехватки жизненно важных ресурсов, таких, как уголь, Группа 741 представляет собой эволюцию 740 группы, включая различные усовершенствования, такие, как новый клапанный механизм Caprotti и котел Франко-Крости."
