 #Infantry Equip

 SCA_infantry_equipment_0: "Krag-jörgensen Gevär M/89"
 SCA_infantry_equipment_0_short: "Гевяр М/89"
 SCA_infantry_equipment_0_desc: "Эта винтовка, выпущенная Маузером, является свидетельством шведской инженерной и военной прозорливости. &lt; &lt; Гевир м/96 &gt; &gt; , помещенная в почитаемый патрон калибром 6,5x55 мм, служит Швеции с непревзойденной надежностью. &lt; &lt; Гевяр м/96 &gt; &gt; делает ее любимым инструментом среди шведских солдат, обеспечивая ее непрерывное использование на поле боя. &lt; &lt; М/96 &gt; &gt; остается символом шведской военной традиции, без изменений в ее конструкции и столь же эффективным."
 SCA_infantry_equipment_1: "Mauser Gevär m/1932"
 SCA_infantry_equipment_1_short: "Гевяр м/32"
 SCA_infantry_equipment_1_desc: "Введённая в 1932 году, The Gevär m/32 продолжает служить шведским вооруженным силам с отличием. Ее принятие, сопровождающееся незначительными изменениями в целях улучшения эргономики и точности, отражает приверженность Швеции поддержанию огромных пехотных сил. В камере, состоящей из эффективного 6,5x55 мм, m/32 является усовершенствованной версией ее предшественников, сочетающей доказанную надежность с повышением боевой активности."
 SCA_infantry_equipment_2: "Автоматгевр м/1939"
 SCA_infantry_equipment_2_short: "AG m/39"
 SCA_infantry_equipment_2_desc: "AG m/39, или AG Pelo, была первоначально уволена из-за сложности и стоимости, но из-за формирования скандинавской федерации многие разработчики оружия во всей Федерации, собравшейся в Стокгольме, смогли превратить в реальность длиннооткатную полуавтоматическую винтовку. Ее принятие в 6,5x55 мм означает новаторский подход Федерации к современной войне, предоставляя ее солдатам мощный инструмент, который уравновешивает сложность и смертоносную эффективность."
 SCA_infantry_equipment_3: "Автоматгевяр m/1942"
 SCA_infantry_equipment_3_short: "AG m/42"
 SCA_infantry_equipment_3_desc: "Основываясь на фундаменте AG m/39, AG m/42 ввела многочисленные усовершенствования, которые изменили свою роль на поле боя. AG m/42, включая нержавеющую газовую трубку, эргономическую модификацию и новый 10-разрядный журнал, наряду с другими усовершенствованиями, укрепляет свой статус как высшего оружия. В стандарте 6.5x55 мм AG m/42 является свидетельством адаптируемости и технологического прогресса Федерации, предлагая солдатам надежное, мощное и усовершенствованное оружие для решения предстоящих задач."
 SCA_infantry_at: "Lahti L-39"
 SCA_infantry_at2: "Карл Густав Пвг м/42"
