 #Infantry Equip

 NFA_infantry_equipment_0: "Fusil Lebel Modèle 1886 modifié 93"
 NFA_infantry_equipment_0_short: "Lebel Mle M93"
 NFA_infantry_equipment_0_desc: "Винтовка &lt; &lt; Лебель &gt; &gt; 1886 года является первым военным оружием, использующим бездымные порошковые боеприпасы. &lt; &lt; Этот порошок &gt; &gt; , изготовленный из стабилизированной нитроцеллюлозы, называется &lt; &lt; горючий порошок &gt; &gt; ."Poudre B" ("Powder B") and was invented in 1884 by Paul Vieille. In 1893, an improved version of the M1886 Lebel was designated "Fusil Mle 1886 Modifié 93" and was one of the main rifles of the French Army in the Weltkrieg. The Lebel rifle is quite accurate up to 300 yards and still deadly at three times that distance, but has its flaws, such as slow-to-reload tube magazine and lack of a wooden handguard on top of the barrel."
 #Bethrier M34:
 NFA_infantry_equipment_1: "Fusil Berthier Modèle 1915 modifié 32"
 NFA_infantry_equipment_1_short: "Бертье Мле М32"
 NFA_infantry_equipment_1_desc: "После Велткрига французские военные признали необходимость замены 8-мм патрона &lt; &lt; Лебель &gt; &gt; , который плохо подходит для крупногабаритных винтовочных журналов и автоматического оружия. &lt; &lt; Бертье &gt; &gt; , которая вскоре стала главной винтовкой французской армии после ее отступления в Алжир, в 1932 году была модифицирована для использования журналов типа &lt; &lt; Маузер &gt; &gt; и другой новой гильзы."
 NFA_infantry_equipment_2: "Carabine-Mitrailleuses Hotchkiss типа M2"
 NFA_infantry_equipment_2_short: "Hotchkiss Mle CMH2"
 NFA_infantry_equipment_2_desc: "CMH2 — амбициозно спроектированный и хорошо изготовленный автомат, представленный Hotchkiss в 1938 году как Type 017, который вошёл в эксплуатацию как Carabine-Mitrailleuses Hotchkiss Type M2 (вместо его полицейского варианта типа M1)."
 #MAS 55 combined with MAT-49 police variant:
 NFA_infantry_equipment_3: "&lt; &lt; Фусил мат &gt; &gt;"
 NFA_infantry_equipment_3_short: "MAT Mle 43"
 NFA_infantry_equipment_3_desc: "Кроме того, MAT-43 производится с помощью машинной штампы, которая позволяет экономично производить большое количество винтовок, в которых остро нуждается французское правительство, и, несмотря на некоторые проблемы, связанные со скоростью огня и надежностью, MAT-43 рассматривается в качестве следующего шага в области личного оружия."
 NFA_support_weapons: "Mitrailluse Darne Mle 1919 & Mortier Stokes"
 NFA_support_weapons_short: "Дарн Мле 1919 & Мортье Стоукс"
 NFA_support_weapons_desc: "Darne Mle 1919 — легкое пулемётное устройство французского происхождения, работающее на газе, выпущенное из открытого болта только в полностью автоматическом режиме (с невероятной скоростью в 1100 выстрелов в минуту). Дарнский пулемёт имеет необычный пояс между газовым поршнем и стволом, используя двухступенчатую систему подачи патронов (картридж снят с пояса в спину, а затем толкается вперед в бочку). Он помещен в камеру на французском 7,5-ммм миномете 1931 года. Миномет «Стокс» представляет собой миномет «Велткриг», известный своей надежностью и интенсивностью огня."
 NFA_support_weapons2: "Mitraillouse Hotchkiss Mle 1926 & Morter Brandt Mle 27/31"
 NFA_support_weapons2_desc: "Hotchkiss Mle 1926 года заменила Darne Mle 1919. В то время как скорость огня Hotchkiss была значительно ниже, чем у Darne, стабильность и легкость производства делают его более предпочтительным легким пулеметом. Brandt миномет является первым в семействе минометов Эдгара Брандта. Простое и эффективное оружие, имеющее металлическую трубу для сокращения оттока, Brandt Mortar в состоянии сдавать почти 18 патронов в минуту."
 NFA_support_weapons2_short: "Hotchkiss Mle 1926 & Brandt Mle 27/31"
 NFA_support_weapons3: "Mitraillouse Hotchkiss Mle 26/37 & Mortier Brandt Mle 35/38"
 NFA_support_weapons3_short: "Hotchkiss Mle 26/37 & Brandt Mle 35/38"
 NFA_support_weapons3_desc: "В 1937 году в версии автомата Hotchkiss в качестве предшественника был отмечен повышенный уровень огня при сохранении низкой отдачи. В Brandt Mle 35/38 также предусмотрены усовершенствования минометной системы для уменьшения оттока миномета и повышения его точности."
 NFA_support_weapons4: "Mitraillouse Hotchkiss Mle 26/41 & Mortier Brandt Mle 1942"
 NFA_support_weapons4_short: "Hotchkiss Mle 26/41 & Brandt Mle 42"
 NFA_support_weapons4_desc: "В 41-й версии Hotchkiss есть телескопический вид и небольшое увеличение числа выстрелов, что позволяет пистолету быть эффективным в близкой каюте при сохранении точности. 1942-й вариант миномета Брандт несколько улучшил скорость огня, что делает его эффективным средством поддержки близкого радиуса действия."
 NFA_infantry_weapons2: "BSA M1926 "Томпсон Субмашинное Оружие""
 NFA_infantry_weapons2_desc: "В рамках сотрудничества французских "Exiles" с "Entente" французские силы приняли BSA M1926. "BSA M1926" является сервисным вариантом классического автомата "M1921" Томпсон, и, несмотря на то, что его производство дорого, это оружие хорошо понравилось солдатам в поле, которые высоко оценивают его эффективность и надежность. В то время как большинство вариантов полагаются на более мелкие журналы "box", некоторые другие варианты содержат крупные и громоздкие барабанные журналы. Пистолет был хорошо принят и высоко оценен французской пехотиной, которая ценит его невероятную остановку."
 NFA_improved_infantry_weapons_2: "Пистолет с помадами для ланчестеров"
 NFA_improved_infantry_weapons_2_desc: "В рамках англо-французского сотрудничества число ланчестеров было отправлено национальным французским силам в Африке и клеткам лоялистов на материке."
 NFA_advanced_infantry_weapons2: "Carbine De Lisle"
 NFA_advanced_infantry_weapons2_desc: "Это оружие приобрело популярность среди спецназовцев. Оружие является Франкенштейном оружия, так как оно сочетает элементы как из SMLE, так и из MI1928AI. Оружие, оснащенное внутренним подавителем, чрезвычайно тихое, что делает его идеальным для партизанских действий или убийств."

 #Motorised

 NFA_motorized_equipment_0: "Берлит КБА"
 NFA_motorized_equipment_0_short: "Берлит КБА"
 NFA_motorized_equipment_1: "Лаффли С-20 трактор, Чассис Длинный"
 NFA_motorized_equipment_1_short: "S-20TL"
 NFA_motorized_equipment_1_desc: "В 1934 году французская армия заказала грузовики S-35C из Лаффли - громоздкий шестиколесный привод, непопулярный для экипажей. Новый Laffly S-20TL, предложенный (и принятый) год спустя, в целом выше предыдущего S-35C, имеет более высокое соотношение мощности к весу и предлагает множество хранилищ, в которых пассажиры могут хранить оборудование. Грузовик признан более новаторским по сравнению с его аналогом Коммунарда, поскольку для транспортировки различных типов взводов, что позволяет производить C-20TL в больших количествах, даже в колониях."
 NFA_mechanized_equipment_1: "Ситронтрактор ПолуЧенилль P-107"
 NFA_mechanized_equipment_1_short: "С-107"
 NFA_mechanized_equipment_1_desc: "После Veltkrieg Citroën разработал длинный ряд полутреков на основе патента Kégresse. В 1937 году компания ввела свою новую и более мощную модель P-107 в качестве преемника Citroën-Kégresse P-17. P-107 имеет два основных варианта: лёгкий первопроходец для артиллерийских орудий и грузовой транспорт платформы для единиц. Многие командиры используют их в различных стандартных и нестандартных ролях, что делает P-107 разносторонним грузовиком."
 #Lorraine 39L combined with 38L:
 NFA_mechanized_equipment_2: "Берлит-трактор Ченилье Моделе 39"
 NFA_mechanized_equipment_2_short: "TC-39"
 NFA_mechanized_equipment_2_desc: "Трактор Ченилье Модель 39, разработанный Берлитом в 1938 году и принятый в 1941 году после многочисленных изменений, является гонщиком общей вместимостью 10 человек: один водитель и девять пассажиров. В отличие от модели 1938 года, оснащенной трейлером для перевозки основной части войск, окончательный вариант расширил грузовые трюмы с высокоскоростными бронежилетами с дверями на спине, защищая взвод по пути на поле боя. Несмотря на слухи о том, что TC-39 в значительной степени вдохновлялся планами коммуны (или даже прямой копией), она была принята французской армией."
 #Renault DAJ-1:
 NFA_mechanized_equipment_3: "Véhicule de Transport de Troupes Liberté - Renault"
 NFA_mechanized_equipment_3_short: "VTTB-R"
 NFA_mechanized_equipment_3_desc: ""Véhicule de Transport de Troupes Ligné - Renault" является закрытым транспортным средством-перевозчиком, разработанным в 1941 году, когда у армии были сомнения в том, что Берлит сможет соответствовать армейским спецификациям для своего TC-39. "VTTB-R", первоначально введенный в 1942 году, был отвергнут из-за его низкой вместимости и был принят в эксплуатацию только после увеличения общей пропускной способности до 11 человек, включая водителя."

 #Amphibious
 #Modified SCHNEIDER-LAURENT:
 NFA_amphibious_mechanized_equipment_1: "Шнайдер-Читроэн Авто-Митрайлуза Амфиби С-40"
 NFA_amphibious_mechanized_equipment_1_short: "С-40"
 NFA_amphibious_mechanized_equipment_1_desc: "Шнайдер-Ситроэн C-40 был впервые представлен как бронетранспортер с амфибией в 1933 году, но был отвергнут французским правительством в пользу AM-80. &quot; Проект &quot; был отменен до 1939 года, когда французская армия запросила автомобиль с амфибией. &quot; S-40 &quot; , который был обновлен как транспорт с амфибией в 10 человек, был введен в 1941 году и принят, несмотря на худшие характеристики, чем матрос &quot; Коммунард &quot; ."
 #Very Modified SCHNEIDER-LAURENT:
 NFA_amphibious_mechanized_equipment_2: "Шнайдер-Китроан Трактор Ченилье Амфиби Модель 1943 года"
 NFA_amphibious_mechanized_equipment_2_short: "TCA-43"
 NFA_amphibious_mechanized_equipment_2_desc: "TCA-43 является усовершенствованной версией C-40. После получения первоначальных отзывов об использовании C-40 в поле колеса были заменены треками, и грузовой отсек был расширен наряду с установкой нескольких ступеней для пулеметов."

 #Armoured Car
 NFA_gw_armored_car_equipment: "Автомобильная машина Laffly Mitraillouse Modèle 1917/80"
 NFA_gw_armored_car_equipment_short: "АМ-80"
 NFA_gw_armored_car_equipment_desc: "Laffly Auto-Mitrailleuse Modèle 1917/80 — автомобиль, построенный в 1934 году и построенный на заводе Laffly Auto-Mitrailleuse Model 1917/80."
 #Panhard AM 40 P - constructor of this tech probably in NFA:
 NFA_armored_car_equipment_1: "Citroën Auto-Mitrailleuse Modèle 1940"
 NFA_armored_car_equipment_1_short: "АМ-40"
 NFA_armored_car_equipment_1_desc: "Modèle 1940 года, разработанная Луи Дельягардом по спецификациям французской армии 1938 года, является очень новаторским бронеавтомобилем с 8-миллиметровым приводом и монококировным телом. Процесс разработки AM-40 сопровождался постоянными изменениями в дизайне, но с изменением геополитической ситуации, несмотря на требования военных оснащать автомобиль 47-мм пушками, версия с 20-мм пушками была принята в 1940 году."
 #Combined CDM Armoured Car and Panhard AML (body from AML and tower from CDM):
 NFA_armored_car_equipment_2: "Citroën Auto-Mitrailleuse Modèle 1942"
 NFA_armored_car_equipment_2_short: "AM-42"
 NFA_armored_car_equipment_2_desc: "После оценки использования тяжелых и сложных АМ-40 Генеральный штаб заявил, что для патрулирования колониальных районов и выполнения многих других задач, связанных с более дешевыми автотранспортными средствами, ему необходим более легкий и даже более быстрый разведывательный автомобиль. &quot; Ситруэн &quot; , после подробного изучения канадских бронированных автомобилей, разработала автомобиль &quot; Автомитрайлё &quot; 1942 года для удовлетворения потребностей армии. &quot; Новый АМ-42 &quot; , легковесный четырехколесный автомобиль с 20-мм пушками, был тепло принят французскими солдатами."
 #Combined Panhard AM 40 P and Panhard AML, also 47mm gun (body from AML and tower from Panhard):
 NFA_armored_car_at_equipment: "Citroën Auto-Mitrailleuse Modèle 1942 Canon de 47 мм"
 NFA_armored_car_at_equipment_short: "АМ-42-С47"
 NFA_armored_car_at_equipment_desc: "Auto-Mitrailleuse Modèle 1942 Canon de 47mm — совместный продукт Людовика Дельягарда и других инженеров Citroën, которые установили 47-мм пушки на башне AM-40. Как и замена AM-40, находящейся в эксплуатации, новая башня была также установлена на ее корпусе, что сделало AM-42 охотником за танками в соответствии с первоначальными требованиями армии к AM-40."

 ###Artillery
 NFA_artillery_equipment_1: "Матерь с 75-мм моделем 1897 года"
 NFA_artillery_equipment_1_short: "Матерь 75-мм"
 NFA_artillery_equipment_1_desc: "Матерь 75-мм Мл 1897 года, также известная как французская 75-я или "Soixante-Quinze" ("семьдесят пять"), широко рассматривается в качестве первой современной артиллерии. С 1898 года Soixante-Quinze широко используется в Вельткриге, где она используется в качестве противопехотного, зенитного и противотанкового оружия. После отступления в Алжир французская армия продолжала применять это оружие, главным образом потому, что оно по-прежнему в основном отвечает современным критериям."
 #Canon de 105 court mle 1934 Schneider:
 NFA_artillery_equipment_2: "Матерь 105-мм суда Модель 1935 года Шнайдер"
 NFA_artillery_equipment_2_short: "Матерь 105-мм С"
 NFA_artillery_equipment_2_desc: "Materiel de 105-мм Court Mle 1935 — консервативный проект Шнайдера, разработанный для замены Soixante-Quinze на службе, Materiel de 105-мм больше гаубица, чем пушка, и предназначается главным образом для уничтожения артиллерийских сооружений противника."
 NFA_artillery_equipment_3: "Canon de 155-мм Grande Puissance Filloux Modèle 1917/1942"
 NFA_artillery_equipment_3_short: "Канон-де 155-мм ПГФ"
 NFA_artillery_equipment_3_desc: "Кэнон де 155-мм Гранд-Писсанс Филью Модель 1917 года, известный также как ПФФ, был разработан во время Велткрига полковником Луисом Фильо, чтобы удовлетворить срочную потребность в современной тяжелой артиллерии, и используется как Коммунардом, так и национальными правительствами; из-за проблем, связанных с производством ГПФ в колониях французским правительством, до 1942 года, когда проект ПФР был обновлен, с тем чтобы облегчить производство и обеспечить соответствие современным стандартам."

 #25mm SA 34:
 NFA_anti_tank_equipment_1: "Матерь 25-мм полуавтоматический модуль 1934 года"
 NFA_anti_tank_equipment_1_short: "Матерь 25-мм SA"
 NFA_anti_tank_equipment_1_desc: "К началу 1920-х годов французская армия пришла к пониманию того, что бронебойный потенциал 37-мм пехотного пехотного пехотинцев ТРП будет недостаточным против современных танков. в 1926 году Hotchkiss предложил 25-миллиметровый проект оружия, который не был немедленно принят из-за финансовых проблем и наличия боевой техники 75-ммм. Матерь 25-ммм, которая вступила в строй только в 1936 году с началом приближающейся битвы за Францию, является надежным оружием, вдохновленным концепцией Фильо."
 #Modified Matériel de 75mm Modèle 1897:
 NFA_anti_tank_equipment_2: "Матерь Античар де 75-мм Моделе 1897/1937"
 NFA_anti_tank_equipment_2_short: "Материал 75-мм АК"
 NFA_anti_tank_equipment_2_desc: "С принятием 105-мм боевой техники старый боевик де 75-мм был в основном переоборудован в противотанковые ружья с обновленным шасси, которые, как считается, были слишком тяжелыми для современных противотанковых пушек, Soixante-Quinze имеет более высокий уровень проникновения, чем их коллеги."
 #Very modified Matériel de 75mm:
 NFA_anti_tank_equipment_3: "Матерь Античар де 75-мм полуавтоматический модуль 1943 года"
 NFA_anti_tank_equipment_3_short: "Материал 75-мм AC SA"
 NFA_anti_tank_equipment_3_desc: "Материэль де 75-мм SA является новым полуавтоматическим оружием, основанным на 75-мм боевой пулемете с 75-мм пушками переменного тона. С более высокой скоростью огня, Матерь с 75-мм калибром CA SA по-прежнему является несколько устаревшим оружием, но может конкурировать со своими современными аналогами благодаря модернизированному механизму и новому подходу к конструкции шасси."

 #Hotchkiss 25mm:
 NFA_anti_air_equipment_1: "Mitrailleuse de 25-мм Contre-Aéroplanes Modèle 1936"
 NFA_anti_air_equipment_1_short: "25-миллиметровая диафрагма"
 NFA_anti_air_equipment_1_desc: "После возвращения в Алжир французские военные объявили о необходимости специализированного зенитного автоканнона. &quot; Хотчкисс &quot; в 1936 году ввела 25-миллиметровый проект, который был принят из-за медленной разработки более перспективного варианта Шнайдера. &quot; Митрайлуз &quot; 25-миллиметровый CA, который был принят в эксплуатацию, был заменен на трехстороннюю базу с двухколесным транспортом по просьбе армии."
 #Schneider 37 mm:
 NFA_anti_air_equipment_2: "Mitrailleuse de 37-мм Contre-Aérien Modèle 1939"
 NFA_anti_air_equipment_2_short: "Mitrailleuse 37 мм CA"
 NFA_anti_air_equipment_2_desc: "Разработанный с 1930 года, Mitrailleuse 37-мм CA наконец-то был готов к производству в 1939 году. После ожесточенного спора с французскими военными, которые уже приняли вариант Hotchkiss, Mitrailleuse 37-мм CA из Шнайдера был принят после первоначальных испытаний в качестве более продвинутого варианта, чем 25-миллиметровый пистолет Hotchkiss."
 #Canon de 75 CA modèle 1940 Schneider:
 NFA_anti_air_equipment_3: "Матерь 75-мм Контре-Аэриен Модель 1940 года"
 NFA_anti_air_equipment_3_short: "Матерь 75-мм КА"
 NFA_anti_air_equipment_3_desc: "В конце 1920-х годов было установлено, что боевая техника Modiel de 75-мм Modèle 1897 года устарела, поскольку зенитное оружие и разработка нового ружья начались в 1931 году. &lt; &lt; Материэль де 75-мм контре-Аэриен Модель 1940 года &gt; &gt; , осуществленная Шнайдером, имеет более высокие скорость огня, более высокую скорость музов, повышенную вертикальную дальность, современную систему управления огнем и более высокую мобильность с новыми ружьями, чем старая Soixante-Quinze. &lt; &lt; Ужасно &gt; &gt; , поражённая показом бывшего Mitrailleuse 37-мм CA из Шнайдера, французское командование быстро приняло новый 75-миллиметровый пистолет."

