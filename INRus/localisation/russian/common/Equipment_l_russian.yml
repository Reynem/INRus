 GXC_motorized_equipment_1: "Гуанчжоу типа Чжунхуа "Китай""
 GXC_motorized_equipment_1_short: "Чжунхуа"
 GXC_motorized_equipment_1_desc: "В 1936 году при финансовой поддержке Китайской партии общественных интересов китайский инженер Хуан Ханчжонг на экспериментальной основе создал грузовик типа Чжунхуа в Хунане, вскоре в том же году на заводе &lt; &lt; Хунань &gt; &gt; в провинции Хунань был изготовлен гражданский пассажирский автомобиль, способный перевозить 25 человек. В конце года при поддержке Китайской партии &lt; &lt; Общественный интерес &gt; &gt; китайский инженер Тан Чжун Чжунминг разработал новое поколение грузовиков &lt; &lt; Чжунхуа &gt; &gt; на основе первой модели и в сочетании с преимуществами последней, а угольный двигатель первой был заменен 8-цилиндровым бензиновым двигателем."

