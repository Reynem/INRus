 YUN_motorized_equipment_1_desc: "После начала Гражданской войны в США многие американские инженеры отправились в изгнание, чтобы сбежать от войны. &quot; Юннан машинное бюро &quot; в Куньминге воспользовалось этой возможностью и наняло группу инженеров из бывшей американской компании &quot; Стюарт мотор &quot; . С помощью этих инженеров и финансовой поддержки кликы Юннан автомобиль под названием &quot; Зюань &quot; (ресурсы) был официально введен в производство и поступил на военную службу."

