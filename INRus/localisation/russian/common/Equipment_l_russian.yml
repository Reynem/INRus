 PAN_infantry_equipment_0: "Модель Спрингфилда 1903 года"
 PAN_infantry_equipment_0_short: "Спрингфилд М1903"
 PAN_infantry_equipment_0_desc: "Модель 1903 года была разработана в Спрингфилд-Арсенале, когда после испано-американской войны Соединенные Штаты сочли винтовку Краг-Йёргенсен неадекватной из-за ее слабого действия; в ее основе была попытка объединить полезные черты как Крага, так и пойманных испанских мазеров. Эта винтовка была постепенно принята вместе с патроном 30-06 как до, так и в то время, когда остальная часть мира вела войну с Велткригом. Винтовки попали в руки проамериканских режимов, которые контролировали Панаму до 1924 года. Панамские винтовки были возвращены в 7,65х53мм в качестве комплимента перуанских мазеров Панамы."
