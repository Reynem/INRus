 # Object 301 :
 RUS_guided_missile_equipment_1: "Крилатайская торпеда Т-312"
 RUS_guided_missile_equipment_1_short: "Т-312"
 RUS_guided_missile_equipment_1_desc: ""Крыло Торпедо" является первой тактической ракетой, разработанной российскими военными, которая имеет низкую точность, высокую стоимость и, к сожалению, слабая во взрывной энергии за такие расходы, но она является важным первопроходцем в российской ракетной технологии."
 # Modified R-10 :
 RUS_guided_missile_equipment_2: "Ракета R-15"
 RUS_guided_missile_equipment_2_short: "Р-15"
 RUS_guided_missile_equipment_2_desc: "Двухступенчатая ракета R-15 имеет высокую дальность, но страдает от многих тех же проблем, что и T-312, которая была разработана командой Langemak в качестве главной ракеты, используемой российской армией в современной постоянно меняющейся войне на основе гражданской ракеты R-10."
 # R-1 :
 RUS_guided_missile_equipment_3: "Ракета R-2"
 RUS_guided_missile_equipment_3_short: "Р-2"
 RUS_guided_missile_equipment_3_desc: "Ракета R-2 разработана на основе украденных немецких конструкций и по существу является усовершенствованной российской версией V-2. R-2 работает на совершенно иных принципах, чем предыдущие российские ракеты."

