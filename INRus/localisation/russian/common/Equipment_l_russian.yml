 WCA_infantry_equipment_0_desc: "Модель 1903 года была разработана в Спрингфилд-Арсенале, когда после испано-американской войны Соединенные Штаты сочли винтовку Краг-Йёргенсен неадекватной из-за ее слабого действия; в ее основе была попытка объединить полезные черты как Крага, так и испанских мазеров."
 WCA_infantry_equipment_1: "Спрингфилдский арсенал, винтовка, калибр 30-06, модель 1903A1"
 WCA_infantry_equipment_1_short: "SA-1903A1 Винтовка"
 WCA_infantry_equipment_1_desc: "Спрингфилд M1903A1 был принят Армией США в 1929 году в качестве "U.S. Rifle, Calibre 30-06, M1903A1" и включал в себя пистолетный пистолет, чеканную задницу, зазубринный пусковой крючок и несколько небольших усовершенствований в оригинальном дизайне 1903 года."
 #Thompson T3:
 WCA_infantry_equipment_2: "Автозаказ, винтовка, калибр 30-06, модель 2"
 WCA_infantry_equipment_2_short: "AO-2 Винтовка"
 WCA_infantry_equipment_2_desc: "В 1929 году AO-2 был создан как самозарядная винтовка и использовал так называемый "Blish Lock". Хотя некоторые утверждают, что AO-2 является менее эффективной винтовкой, чем Джонсон, принятой федеральными войсками, она может быть изготовлена с легкостью."
 #Thompson T3 carbine:
 WCA_infantry_equipment_3: "Автозаказ, карбин, калибр 30, модель 3"
 WCA_infantry_equipment_3_short: "AO-3 Карбина"
 WCA_infantry_equipment_3_desc: "Разработка Carbine началась вскоре после окончания Гражданской войны. AO-3 представляет собой не более чем карбинную версию ранней винтовки AO-2 с добавлением трехместного пожарного переключателя."
 WCA_infantry_weapons2: "Автозаказ, бронебойное оружие, Калибр .45, модель 1928A1"
 WCA_infantry_weapons2_short: "AO-1928A1 Пистолет субмашины"
 #M1 Thompson:
 WCA_improved_infantry_weapons_2: "Автозаказ, бронебойное оружие, Калибр .45, модель 7"
 WCA_improved_infantry_weapons_2_short: "AO-7 Пистолет для автоматов"
 #Thompson Light Rifle:
 WCA_advanced_infantry_weapons2: "Автозапасы, автоматические карбины, калибр .30, модель 4A1"
 WCA_advanced_infantry_weapons2_short: "AO-4A1 Автокарбина"
 WCA_infantry_at: "Ракета-носитель &lt; &lt; Уль &gt; &gt; , 2,36 дюйма, модель 2"
 WCA_infantry_at_short: "U-2 "Tovepep""
 WCA_infantry_at_desc: "У-2 представляет собой переносную противотанковую ракету безоткатной связи, созданную капитаном Континентальной армии Эдвардом Улемом. Это оружие использует 2,36 дюйма самоходных ракет и имеет эффективный дальность 140 метров."
 WCA_infantry_at2: "Ракета-носитель &lt; &lt; Уль &gt; &gt; , 2,36 дюйма, модель 5"
 WCA_infantry_at2_short: "U-5 "Базука""
 WCA_infantry_at2_desc: "У-5 усовершенствована версия U-2. Магнито с пусковым приводом заменил систему зажигания аккумулятора U-2, и была добавлена предохранитель. Трубка может быть разбита для облегчения перевозки, что является важным соображением для пехоты. Кроме того, были введены новые более надежные ракеты."
 WCA_support_weapons: "MG, Cal. 30-06, M1919, Browning & Mortar, 3 дюйма, Стоукс"
 WCA_support_weapons_short: "M1919 Browning MG & Stokes"
 #M2 Browning:
 WCA_support_weapons2: "Browning, MG, Cal.50, M2, Browning & Mortar, 2-дюймовый, SMBL"
 WCA_support_weapons2_short: "B-2 MG & SBML двухдюймовый миномет"
 #Browning M1919A6 and M1 Mortar (developed by Continental Army):
 WCA_support_weapons3: "Martle-Browning, MG, Cal. 30-06, M3 & CA, Martar, 3,2 дюйма, M27"
 WCA_support_weapons3_short: "MB-3 M1919 MG & CA-27"
 #Browning M1918A2 (produced by Alton Worker Defence with improvements) and M2 Mortar:
 WCA_support_weapons4: "AWD-Browning, AR, Cal. 30-06, M6 & CA, Mortar, 4,2 дюйма, M29"
 WCA_support_weapons4_short: "Миномет AWDB-6 1918 AR & CA-29"
 WCA_night_vision: "Континентальная армия, Инфракрасный снайперскоп, модель 120"
 WCA_night_vision_short: "CA-120 Снайперскоп"
 WCA_night_vision_desc: "Разработанный специально для карбины AO-4, которая имела специальные установки на приемнике для различных моделей инфракрасных приборов ночного видения, CA-120 является первым инфракрасным снайперским телескопом, который используется Континентальной армией. В то время как CA-120 имеет свои недостатки, такие как низкий диапазон и легко поврежденный инфракрасный эмиттер, CA-120 по-прежнему имеет огромное значение, когда он используется правильно."
 WCA_night_vision2: "Континентальная армия, Инфракрасный снайперскоп, модель 123"
 WCA_night_vision2_short: "CA-123 Снайперскоп"
 WCA_night_vision2_desc: "В связи с плохим приемом снайперскопа CA-120 был принят Снайперскоп CA-123, который почти в два раза превышает эффективный диапазон CA-120, более надежный инфракрасный источник света, а также маяк T23, CA-123 значительно лучше своего предшественника, хотя некоторые солдаты жалуются на то, что источник света кровоточит в видимом спектре и тем самым отказывается от своего положения."

