 ### Land ###
 DEN_infantry_equipment_0: "Krag-Jörgensen Gevèr M/89"
 DEN_infantry_equipment_0_short: "Гевьер М/89"
 DEN_infantry_equipment_0_desc: "Gevèr M/89 является главной датской винтовкой с 1889 года. Считается, что она наравне с остальными винтовками в Европе, ружье имеет длину 133 см, что делает его опасным в руках стрелка. Однако его длина наносит ущерб его подвижности, и он может быть довольно тяжелым и менее управляемым в боях на близком расстоянии. Таким образом, некоторые варианты оружия были модифицированы в карабины для более коротких помолвок."
 DEN_infantry_equipment_1: "Krag-Jörgensen Fodfolkskrabin M/89-24"
 DEN_infantry_equipment_1_short: "Фодфолкскарабин М/89-24"
 DEN_infantry_equipment_1_desc: "Датская вариация краг-Йоргенсена имеет переднюю дверь журнала, патроны к ободам и наружный стальной лайнер для ствола. Датская армия, запертая на патрон 8x58R, часто помещалась в руки резерва в качестве пехотного карбина. По мере того, как Сканданавия все чаще оказывается на переднем крае потенциальной европейской войны, она настояла на более 89/24-х градусах для прифронтовой военной службы."
 DEN_infantry_equipment_2: "Летте-Форсёг Маскинпистол 31"
 DEN_infantry_equipment_2_short: "Lette-Forsøgs M/31"
 DEN_infantry_equipment_2_desc: "Подмашинное оружие датского происхождения, \"Lettet-Forsøgs M/31\" is based on the Finnish Suomi KP-31. With the desire for greater firepower for Danish squads, the M/31 was made from stainless steel with a tubular buttstock and a distinctive ball-shaped wooden foregrip. The foregrip was designed with ergonomic flexibility for the user when handling the weapon. After repeated trials, however, many infantrymen found the foregrip unnecessarily and outright expensive for the gun's production."
 DEN_infantry_equipment_3: "Национальная модель &quot; Фабрик &quot; 1943 года"
 DEN_infantry_equipment_3_short: "FN-43"
 DEN_infantry_equipment_3_desc: "Полуавтоматизированная винтовка бельгийского происхождения, Fabrique Nationale Model 1943, была отправлена в различные страны Европы, поскольку датское военное командование желало полуавтоматической боевой винтовки для повышения эффективности и огневой мощи датских винтовщиков, многие приказы были размещены на FN-1943. 792x57 мм Mauser, пистолет работает на газе, и первоначальные испытания показали, что оружие хорошо конкурирует с европейскими и американскими моделями."

