 QIE_gw_armored_car_equipment: "Штайр АДГЦ"
 QIE_gw_armored_car_equipment_short: "ADGZ"
 QIE_gw_armored_car_equipment_desc: "Хотя правительство Цина и Немецкая Империя поддерживали хорошие отношения, после начала крупномасштабных синдикалистских ударов в начале 1930-х годов правительство Цинга срочно закупило партию Steyr ADGZ у Австрии-Венгрия. Поскольку цена, установленная правительством Цинга, была такой привлекательной, австрийцы даже включили прототип автомобиля и чертежа. Однако военная помощь Германии правительству Цинга вскоре сделала эти австрийские бронированные машины устаревшими."
 QIE_armored_car_equipment_1: "Sonderkraftfahrzeug 231 8-Rad"
 QIE_armored_car_equipment_1_short: "Хаоксу 231"
 QIE_armored_car_equipment_1_desc: "Символ китайско-германской дружбы, эта бронированная машина часто занимала видное положение во время военных парадов Цинга. Несмотря на мнение пекинг-Коммиссии, восьмиколесный шасси бронированной машины вполне соответствует характеристикам китайского боя."
 QIE_armored_car_equipment_2: "Sonderkraftfahrzeug 234"
 QIE_armored_car_equipment_2_short: "Хаоксу 234"

 QIE_motorized_equipment_0: "$GER_motorized_equipment_0$"
 QIE_motorized_equipment_0_short: "$GER_motorized_equipment_0_short$"
 QIE_motorized_equipment_1: "Шанхайский тип Чжунюань"
 QIE_motorized_equipment_1_short: "Чжунюань"
 QIE_motorized_equipment_1_desc: "После реставрации Цин Бенз АГ и правительство Цинга создали несколько автомобильных заводов в Китае в качестве совместных предприятий; самым известным из них были Жуньюаньские автомобильные заводы, расположенные в Шанхае и Наньцзине. Тысячи грузовиков типа Чжунюань были произведены в этих двух районах, которые служили в различных армиях, лояльных клике Жили. ~n nonotaby, Жонгюань назван не в честь древнекитайского места под названием Чжунюань (район вокруг ядра империи), а вместо этого после нарисованного логотипа на передней части кабины грузовика; огромный китайский персонаж "Zhong" был помещен в круг."

 QIE_mechanized_equipment_1: "Sonderkraftfahrzeug 11"
 QIE_mechanized_equipment_1_short: "Хаоксу 11"
 QIE_mechanized_equipment_1_desc: "Sd.Kfz. 11 (Sonderkraftfahrzeug — специальный автомобиль с двигателем) — немецкий полупутевый автомобиль, который широко использовался во втором Вельткриге."
 QIE_mechanized_equipment_2: "Sonderkraftfahrzeug 251"
 QIE_mechanized_equipment_2_short: "Хаоксу 251"
 QIE_mechanized_equipment_2_desc: "251 полпути — бронебойный боевой автомобиль, спроектированный и впервые построенный компанией &lt; &lt; Ханомаг &gt; &gt; во время Второй Велткриг, на основе своего предыдущего автомобиля &lt; &lt; Сд.Кфз. 11 &gt; &gt; ."

