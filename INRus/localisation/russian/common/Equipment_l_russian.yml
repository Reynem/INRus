 LEC_infantry_equipment_0_desc: "Помимо немецкого Маузера, Ли-Энфилд, возможно, является одним из наиболее известных винтовок, находящихся на службе у любых военных. Хотя No 1 Mk III* использовался в городах Легации задолго до Велткрига в руках старого британского гарнизона, революции в 1926 году и ухода китайской станции в Австралазию в том же году, как и в полиции во всех городах Легионации, а также в Шанхайском корпусе добровольцев. ~n/n/, поскольку большинство из этих винтовок были излишками Вельткриг-эры, и многие из них долгое время были без надлежащего технического обслуживания или заменяемых частей, выбытие понесло свои потери. Теперь, когда, возможно, было слишком мало винтовок, чтобы обеспечить расширенные полицейские силы, некоторые стали считать Ли-Энфилд неизбежно устаревшим."
 LEC_infantry_equipment_1: "Маузер 98b"
 LEC_infantry_equipment_1_short: "Маузер 98b"
 LEC_infantry_equipment_1_desc: "Mauser 98b — это передний край немецкой технологии болтов-винтовки. С более простыми винтовками, более высокими болтами, улучшенными запасами и более легким зданием, это оружие является существенным улучшением по сравнению с его предшественниками. 98b также особенно практично в Китае, поскольку самой распространенной винтовкой за пределами нейтральной зоны является Hanyang 88, копия старого Маузера 1888 года, с которым он делит боеприпасы."
 LEC_infantry_equipment_2: "Selbstladegeweehr 40"
 LEC_infantry_equipment_2_short: "Selbstlader 40"
 LEC_infantry_equipment_2_desc: "Компания Mauser, созданная в ответ на желание немецкой армии самозарядить винтовку с резервным болтом, Selbstladegeweehr 40 стал огромным шагом вперед в разработке немецкого стрелкового оружия. Хотя первоначальные прототипы были весьма неточными, тяжелыми и склонными к глушению, немецкая армия в конечном итоге сняла некоторые другие конкретные требования к винтовке, и конечный результат, предшественник винтовки, которая в конечном итоге была принята, оказался эффективным."
 LEC_infantry_equipment_3: "Машиненкарабинер 42"
 LEC_infantry_equipment_3_short: "MKb 42"
 LEC_infantry_equipment_3_desc: "MKb 42 — это революционная камера для нового промежуточного гильза, разработанная известным немецким дизайнером оружия Хьюго Шмейссером совместно с компанией Haenel. В то время как первый прототип винтовки был подвержен глушению, как военные, так и даже сам Кайзер были очень воодушевлены проектом, и огромные ресурсы были сосредоточены на совершенствовании дизайна, а винтовка была готова для принятия в 1942 году."
