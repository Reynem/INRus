 #Infantry Equip
 #Mannlicher M1895
 AUS_infantry_equipment_0: "Карабинер Modell 1895/30"
 AUS_infantry_equipment_0_short: "Манлишер М.95/30"
 AUS_infantry_equipment_0_desc: "Mannlicher Modell 1895/1930 (Menterie Repetier-Gewehr M.95) — служебная винтовка вооруженных сил Австро-Венгерской области, разработанная Фердинандом фон Маннлихером."back and forth\") by Austrian troops and \"Ta-Pum\" by the Italians on the receiving end. The Italian song \"Ta pum!\" from the Weltkrieg refers to this rifle. Later after the war, most rifles were converted into the carbine configuration."
 #FÉG 35M
 AUS_infantry_equipment_1: "Карабинер Модель 1935 года"
 AUS_infantry_equipment_1_short: "FEG M.35"
 AUS_infantry_equipment_1_desc: "Вельткриг сделал недостатки M.95 слишком очевидными, особенно его относительно слабое облако и необходимое техническое обслуживание для прямого действия. Steyr разработал 8x56 мм \"Spitzer\" cartridge that would serve as the basis to a new generation of weapons and push the M.95 to its full potential. In the 1935 Rifle Trial, the Hungarian FÉG design based on the Mannlicher-Schönauer's excellent turn-bolt-action won out and was adopted."
 #Danuvia 39M
 AUS_infantry_equipment_2: "Macchinenpistole Modell 1939"
 AUS_infantry_equipment_2_short: "Данувия М.39"
 AUS_infantry_equipment_2_desc: "Спроектировано Палом Кирали, это..."heavy\" submachine gun used specially-loaded 9x25mm ammunition in a folding magazine for transport and storage. This made it very potent and reliable compared to its contemporaries, making it reminiscent of later assault rifle designs."
 #ZK 412/MK SS-42
 AUS_infantry_equipment_3: "Macchinenkarabiner Modell 1942"
 AUS_infantry_equipment_3_short: "Збройовка Брно М.42"
 AUS_infantry_equipment_3_desc: "После того как стало ясно, что расстояние взаимодействия значительно сократилось после Вельткрига, монархия стала заинтересована в разработке промежуточной кассеты и \"machine-carbine\" idea. The Koucký brothers at Zbrojovka Brno presented their ZK 412 design using the 8x35mm \"Rapid\" cartridge with similar performance to the German 8x33mm Kurz."
 #MP 34:
 AUS_infantry_weapons2: "Macchinenpistole Modell 1934"
 AUS_infantry_weapons2_short: "Steyr-Solothurn M.34"
 AUS_infantry_weapons2_desc: "В то время как немецкий дизайн Louis Stange, MP 34 был в основном произведен Steyr и был принят Австро-Венгерской армией. Как и в случае с ранними автоматами, этот дизайн был тяжелым, дорогим, но надежным, с горизонтальным журналом, использующим мощный патрон 9x25 мм Mauser."
 #ZK 383:
 AUS_improved_infantry_weapons_2: "Машиненпистол 38"
 AUS_improved_infantry_weapons_2_short: "Збройовка Брно М.38"
 AUS_improved_infantry_weapons_2_desc: "С учетом необходимости в бронебойном пистолете с использованием стандартного пистолетного патрона армии монархия приняла ZK 383, разработанный братьями Йозефом и Франтишем Коуки в Збройовке Брно, в качестве MP 38. Использование горизонтального журнала, такого как MP 34, известно, что ZK 383 имеет легкую биподу, позволяющую использовать его в качестве запасного автомата. Позднее модели были значительно упрощены для более дешевого и более быстрого производства наряду с вертикально сложенным журналом, как Danuvia SMGs."
 #Danuvia 43M:
 AUS_advanced_infantry_weapons2: "Macchinenpistole Modell 1943"
 AUS_advanced_infantry_weapons2_short: "Данувия М.43"
 AUS_advanced_infantry_weapons2_desc: "В то время как журнал Danuvia 39M оказался успешным, его сворачивания было недостаточно для компенсации его громоздкого дизайна для матросов. 43M перепроектировался с откидным металлическим материалом и новым, более надежным дизайном журнала, что позволило ему быть гораздо более компактным во время перевозки или хранения без жертв огневой мощи."
