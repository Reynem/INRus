 IMP_infantry_at_desc: "В качестве свидетеля демонстрации противотанковой винтовочной гранаты Генри Мохаупта в Швейцарии, канадская комиссия, догадываясь, что это оружие использовало принцип заряда в форме, начала работать по своему собственному замыслу."
