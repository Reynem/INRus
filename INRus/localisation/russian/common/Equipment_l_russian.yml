 #Infantry Equip

 USA_infantry_equipment_0: "Винтовка, калибр 30-06, модель 1903"
 USA_infantry_equipment_0_short: "M1903 Спрингфилд"
 USA_infantry_equipment_0_desc: "Модель 1903 года была разработана в Спрингфилд-Арсенале, когда после испано-американской войны Соединенные Штаты сочли винтовку Краг-Йёргенсен неадекватной из-за ее слабого действия; в ее основе была попытка объединить полезные черты как Крага, так и испанских мазеров."
 USA_infantry_equipment_1: "Винтовка, Калибр 30-06, модель 1903A1, специальный целевой показатель"
 USA_infantry_equipment_1_short: "M1903A1 Спрингфилд"
 USA_infantry_equipment_1_desc: "Спрингфилд M1903A1 был принят Армией США в 1929 году в качестве "U.S. Rifle, Calibre 30-06, M1903A1" и включал в себя пистолетный пистолет, чеканную задницу, зазубринный пусковой крючок и несколько небольших усовершенствований в оригинальном дизайне 1903 года."
 #Johnson rifle:
 USA_infantry_equipment_2: "Винтовка, калибр 30-06, модель 1"
 USA_infantry_equipment_2_short: "М1 Джонсон"
 USA_infantry_equipment_2_desc: "Винтовка, разработанная эпохой Мелвином Джонсоном, была принята после того, как Джонсон успешно заручился поддержкой генерала Макартура, который, несмотря на трудности, связанные с разработкой в прошлом самозарядной винтовки для патрона 30-06, был собачьим образом поддержан, сохраняя круг. M1 Johnson был полностью принят в начале 1939 года и был назван "U.S. Rifle, Calibre 30-06, M1"."
 #Johnson auto-carbine:
 USA_infantry_equipment_3: "Автоматическая карбина, калибр .30, модель 2"
 USA_infantry_equipment_3_short: "M2 Автокарбина"
 USA_infantry_equipment_3_desc: "M2 Auto-Carbine — это разработка M1 Auto-Carbine, также известная как Johnson Carbine, разработанная Мелвином Джонсоном Джонсоном в начале 1940-х годов. Сам M1 Auto-Carbine был основан на более раннем Johnson Light Machine Gun, разработанном на основе тех же принципов, что и еще ранее Johnson Rifle. Model 2 — спорт на несколько небольших усовершенствований над M1 Auto-Carbine, таких как хватка пистолета и новое заднее зрение."
 USA_infantry_weapons2: "Машинное оружие, Калибр .45, модель 1928A1, Томпсон"
 USA_infantry_weapons2_short: "M1928A Томпсон"
 #M3 Grease Gun:
 USA_improved_infantry_weapons_2: "Машинное оружие, Калибр 45, модель 2"
 USA_improved_infantry_weapons_2_short: "М2 &lt; &lt; Грязное оружие &gt; &gt;"
 #Johnson auto-carbine 1947:
 USA_advanced_infantry_weapons2: "Автоматическая карбина, калибр .30, модель 4"
 USA_advanced_infantry_weapons2_short: "M4 Автокарбина"
 USA_infantry_at: "Антимеханизирующее оружие, Calibre .50, модель 2, Браунинг"
 USA_infantry_at_short: "M2 Антимеханизирующее оружие"
 USA_infantry_at_desc: "Вторая американская гражданская война потребовала разработки переносного противотранспортного оружия. &lt; &lt; Кавалерия &gt; &gt; США экспериментировала с зажиганием и модификацией тяжелого пулемета М2 калибра 50 калибра для переноски. &lt; &lt; Браунинг М2 &gt; &gt; , несмотря на то, что она была более тяжелой и громоздкой по сравнению с европейскими партнерами, &lt; &lt; Антимеханизационный пистолет М2 &gt; &gt; был быстро принят на службу после удовлетворительных результатов армейских испытаний."
 USA_infantry_at2: "Безоткатные винтовки, 2,2 дюйма, модель 18"
 USA_infantry_at2_short: "M18 Безоткатные винтовки"
 USA_infantry_at2_desc: "M18 безоткатное оружие — это противоматериальное оружие, разработанное двумя инженерами Kroger и Musser в рамках внештатного проекта Военной пехотной секции США. M18 был разработан в ответ на быстрое совершенствование бронежилетов, что значительно снизило эффективность противотанковых винтовок, достаточно небольших для переноса на переносной режим. M18 безоткатная винтовка имеет эффективный диапазон в 400 ярдов, максимальный диапазон в 5 000 ярдов и более точен по сравнению со старой М2. Она быстро называлась "карманной артиллерией" солдатами, которые ее использовали."
 USA_support_weapons: "MG, Cal. 30-06, M1919, Browning & Mortar, 3 дюйма, Стоукс"
 USA_support_weapons_short: "M1919 Browning MG & Stokes"
 USA_support_weapons2: "MG, Cal.50, M2, Browning & Mortar, 2-дюймовый, SMBL"
 USA_support_weapons2_short: "M2 Бурение MG и SBML двухдюймовый миномет"
 #M1941 Johnson MG:
 USA_support_weapons3: "MG, Cal. 30-06, M3, Johnson & Mortar, 3,2 дюйма, M1"
 USA_support_weapons3_short: "Миномет M3 Johnson MG & M1"
 #M1944 Johson MG:
 USA_support_weapons4: "MG, Cal. 30-06, M5, Johnson & Mortar, 4,2 дюйма, M2"
 USA_support_weapons4_short: "Миномет M5 Johnson MG & M2"
 USA_night_vision: "Инфракрасный снайперскоп, модель 1"
 USA_night_vision_short: "M1 Снайперскоп"
 USA_night_vision_desc: "Разработанный специально для M3 Auto-Carbine, который имел специальные установки на приемнике для различных моделей инфракрасных приборов ночного видения, снайперскоп M1 является первым инфракрасным снайперским телескопом, используемым для общего использования Армией США. Хотя M1 имеет свои недостатки, как плохой диапазон и легко поврежденный инфракрасный эмиттер, M1 все еще имеет огромное значение, когда он используется правильно."
 USA_night_vision2: "Инфракрасный снайперскоп, модель 3"
 USA_night_vision2_short: "Снайперскоп M3"
 USA_night_vision2_desc: "В связи с неудовлетворительным приемом снайперскопа М1 был принят снайперскоп М3, который почти в два раза превышает эффективный диапазон М1, более надежный инфракрасный источник света и маяк Т23, однако M3 значительно лучше, чем его предшественник, хотя некоторые солдаты жалуются на то, что источник света кровоточит в видимом спектре и тем самым сбрасывает свое положение."

 #Motorised

 USA_motorbike_equipment_1: "Harley-Davidson WLA"
 USA_motorbike_equipment_1_short: "НОА"
 USA_motorized_equipment_0: "Класс B Стандартизированный военный грузовой автомобиль"
 USA_motorized_equipment_0_short: "Грузовой автомобиль класса B"
 #Just CCKW:
 USA_motorized_equipment_1: "GMC 1936, обычная кабина, привод всех колес, двойные задние оси"
 USA_motorized_equipment_1_short: "АКВ"
 USA_motorized_equipment_1_desc: "ACKW, официально "Обычная такси" 1936 года, "Двойная задняя ось привода", известная как "Джимми" или "Дьюс и половина", имеет 2 и 1/2тонную отгрузку 6x6 внедорожного тактического грузовика. Разработанный по просьбе Армии армии США в 1935 году, ACKW имеет множество вариантов, включая открытую или закрытую кабину и длинные или короткоколёсные базовые модели. ACKW быстро стал стандартным грузовиком армии США и продемонстрировал большой потенциал в материально-технических операциях."
 #canadian tracked jeep + universal carrier:
 USA_mechanized_equipment_1: "Перевозчик, универсальный, модель 2"
 USA_mechanized_equipment_1_short: "М2 Перевозчик"
 USA_mechanized_equipment_1_desc: "Карьер М2, также переведенный в категорию "Американский перевозчик", основан на дизайне канадского универсального перевозчика, импортированного в 1930-х годах."
 #M29 weasel + universal carrier:
 USA_mechanized_equipment_2: "Перевозчик, универсальный, модель 4"
 USA_mechanized_equipment_2_short: "М4 Перевозчик"
 USA_mechanized_equipment_2_desc: "Непрерывное развитие перевозчиков в США привело к появлению M4 Carrier. Построен Studebaker и разработан с учетом новейших канадских конструкций, M4 является всепогодным носителем, предназначенным в качестве базового шасси для многих специализированных функций, включая модель для амфибийных операций. С учетом способности перевозить шесть солдат M4 в этом отношении более способен, чем ее предшественник, но страдает проблемами надежности без надлежащего технического обслуживания."
 #M12 motor carriage:
 USA_mechanized_equipment_3: "Перевозчик, универсальный, модель 9"
 USA_mechanized_equipment_3_short: "М9 Перевозчик"
 USA_mechanized_equipment_3_desc: "Сконструированный вокруг шасси танка M3 "Grant" Carrier — это многофункциональный бронетранспортер с мощной пехотной техникой. Хотя максимальная скорость M9 несколько ниже, чем у M4, M9 может перевозить больше солдат и гораздо более надёжна. С достаточным пространством для вспомогательных элементов пехотного комплекта и толстых бронежилетов, M9 является способным личным носителем."
 #CCKW T27:
 USA_motorized_rocket_equipment: "GMC ACKW, M14"
 USA_motorized_rocket_equipment_short: "ACKW "Ксилофон""
 USA_motorized_rocket_equipment_desc: "Грузовик ACKW с ракетной пусковой установкой M14 - модификация ракеты M12 с возможностью установки на грузовиках, установленной наверху. Он известен как «Ксилофон» и представляет собой модель, разработанную для того, чтобы исправить неправильную точность ракеты M12, добавив к нему еще одну ракету. Хотя, по словам солдат, эта ракета все еще не была очень полезной, она оказалась эффективной во время испытательных испытаний и была принята в качестве стандартной подвижной ракеты-носителя армии США."
 #CCKW T27:
 USA_motorized_rocket_equipment_1: "GMC ACKW, M14"
 USA_motorized_rocket_equipment_1_short: "ACKW "Ксилофон""
 USA_motorized_rocket_equipment_1_desc: "Грузовик ACKW с ракетной пусковой установкой M14 - модификация ракеты M12 с возможностью установки на грузовиках, установленной наверху. Он известен как «Ксилофон» и представляет собой модель, разработанную для того, чтобы исправить неправильную точность ракеты M12, добавив к нему еще одну ракету. Хотя, по словам солдат, эта ракета все еще не была очень полезной, она оказалась эффективной во время испытательных испытаний и была принята в качестве стандартной подвижной ракеты-носителя армии США."

 #Amphibious

 USA_amphibious_mechanized_equipment_1: "Посадочное транспортное средство, отслеживаемое, модель 2"
 USA_amphibious_mechanized_equipment_1_short: "ЛВТ-2"
 USA_amphibious_mechanized_equipment_1_desc: "Серия боевых автомобилей типа &quot; Амфибия &quot; была первоначально предназначена исключительно для использования в качестве грузового перевозчика для осуществления операций на берегу. &quot; ЛВТ &quot; , разумеется, превратилась в высокоэффективные боевые машины и машины пожарной поддержки. &quot; Дональд Рёблинг &quot; , разработанная в 1935 году, гражданская спасательная машина &quot; ."Alligator" was later developed into the LVT-1, which lacked armour protection and was unreliable when used on hard terrain. The LVT-2 built upon the LVT-1, with that vehicles most glaring problems fixed."
 USA_amphibious_mechanized_equipment_2: "Посадочное транспортное средство, отслеживаемое, модель 4"
 USA_amphibious_mechanized_equipment_2_short: "ЛВТ-4"
 USA_amphibious_mechanized_equipment_2_desc: "LVT-4 улучшился на LVT-2, значительно увеличив грузоподъемность, хотя и за счет скорости, несмотря на усовершенствование двигателя."

 #Armoured Car
 USA_gw_armored_car_equipment: "Автомобиль-скаут, модель 2"
 USA_gw_armored_car_equipment_short: "Машина-скаут M2"
 USA_gw_armored_car_equipment_desc: "Автомобиль M2-Scout — легко бронированный, открытый и снайперский автомобиль с четырьмя колесами, разработанный для выполнения разведывательных функций."
 USA_armored_car_equipment_1: "Скаутская машина, модель 3"
 USA_armored_car_equipment_1_short: "Машина M3 для скаутов"
 USA_armored_car_equipment_1_desc: "Машина M3 — это развитие M2, разработанное с учетом опыта, накопленного во время Гражданской войны. Спорт M3 несколько небольших усовершенствований, появившихся в результате военного опыта, таких, как бронированный фюзеляж и передний ролик, и более надежный двигатель. Хотя сама концепция Scout Car получила критику за то, что она была сосредоточена на мобильности по сравнению с выживаемостью, M3 тем не менее была принята в эксплуатацию."
 #Staghound:
 USA_armored_car_equipment_2: "Бронированная машина, модель 5"
 USA_armored_car_equipment_2_short: "Бронированный автомобиль M5"
 USA_armored_car_equipment_2_desc: "После окончания гражданской войны Армия США выпустила спецификации как для средних, так и тяжелых бронированных автомобилей. В 1941 году компания &lt; &lt; Дженерал моторс &gt; &gt; разработала модели Т17 и Т18, которые были приняты в качестве бронированных автомобилей М5 и М6. &lt; &lt; Бронированный автомобиль М5 &gt; &gt; представляет собой новаторский проект, который включает в себя некоторые передовые элементы, такие как два 6-цилиндровых двигателя, обращенных назад, с автоматическими трансмиссиями, а также элементы рулевого управления и подвески, непосредственно прикрепленные к корпусу."
 #Boarhound:
 USA_armored_car_at_equipment: "Бронированная машина, тяжелая, модель 6"
 USA_armored_car_at_equipment_short: "Бронированный автомобиль M6"
 USA_armored_car_at_equipment_desc: "После окончания гражданской войны Армия США выпустила спецификации как для средних, так и тяжелых бронированных автомобилей. В 1941 году компания &quot; Дженерал моторс &quot; разработала модели Т17 и Т18, которые были приняты в качестве бронированных автомобилей М5 и М6. Бронированный автомобиль М6 аналогичен конструкции М5, хотя и значительно тяжелее."

