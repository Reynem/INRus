 #Infantry Equip

 ENG_infantry_equipment_0: "Винтовка No 1 Mk III"
 ENG_infantry_equipment_0_short: "No 1 Мк III"
 ENG_infantry_equipment_0_desc: "Mk III служил Tommy с 1907 года, культовым оружием Weltkrieg. SMLE Mk III пришел с штыком 1907 года и упрощенным устройством заднего обзора, а также фиксированным заряжателем. Во время Weltkrieg спрос превзошел предложение, и, таким образом, многие копии Mk III приходят с исключением отсечки журнала."
 ENG_infantry_equipment_1: "Винтовка No 4 Mk I"
 ENG_infantry_equipment_1_short: "No 4 Mk I"
 ENG_infantry_equipment_1_desc: "После революции и гражданской войны стало очевидно, что проект No 3 «Энфилд» не подходил для ведения боевых действий в городах. В 1932 году в конечном итоге были проведены испытания совершенно новой винтовки, однако в значительной степени не принесли результатов, при этом новые конструкции не могли соответствовать старому проекту «Энфилд» или получить негативную оценку войск. В свете этого показа усилия по замене «Энфилд» в конечном счете были скрыты. В 1935 году правительству были представлены совместные усилия Революционного завода по производству стрелкового оружия в Энфилде и Бирмингеме по производству стрелкового оружия. Новая винтовка была разработана на старом Ли-Энфилде с более коротким стволом, боковым болтом и упрощенной болтовой системой. Хотя, как и ее предшественники, No 4 является сильнее и легче производить, хотя и немного тяжелее из-за его ствола. Интересным фактом в отношении No 4 является то, что эта винтовка была установлена на высоте 100 ид (91 м); калибрована на 200-1 300 метров (183-1189 метров)."
 ENG_infantry_equipment_2: "No.2 Машинно-карбинный Mk I"
 ENG_infantry_equipment_2_short: "No 2 MC Mk I"
 ENG_infantry_equipment_2_desc: "С учетом того, что в будущем боевые действия будут согнуты в сторону ручных автоматических вооружений, а в Европе вновь надвигаются облака войны, технические работники ВСРСС и люди на станции IX создали новый автомат. Легкий и портативный карбин No 2 идеально подходит для городских операций и средних и ближних боевых действий."
 ENG_infantry_equipment_3: "No 9 Машинно-взрывчатая машина Mk I"
 ENG_infantry_equipment_3_short: "No 9 MR Mk I"
 ENG_infantry_equipment_3_desc: "Опыт борьбы с немецкими войсками, вооруженными Машиненкарабинером 44, и сравнение с французскими конструкциями привели Стефана Кеннета Дженсона в ВСВС к созданию новой ружья для стрельбы из полуавтоматического оружия в полностью автоматический режим; винтовка No 9 обеспечит Томми обширной огневой мощью."
 ENG_infantry_at: "Винтовки против танки"
 ENG_infantry_at_desc: "Винтовка «Бойцы против танки» часто называлась «Оружие элефанта» из-за ее размеров и больших скульптур, и винтовка «Бойцы против танки» может стрелять из 60 г противотанкового зенитного снаряда на высоте 747 м/с. Однако, несмотря на слайд оттока оружия и резиновую обмоченную задницу, отдача от оружия, как утверждается, была болезненной, что часто вызывало шею и синяки на плечах."
 ENG_infantry_at2: "Противоугонное устройство MK2"
 ENG_infantry_at2_desc: "Антиармоградное устройство MK2 является одним из самых новых комплектов, разработанных станцией IX. С эффективным огневым дальностью 115 ярдов MK2 сможет вырубиться и проткнуть самую большую из панзеров Кайзера."
 ENG_support_weapons: "Миномет Vickers MG & Stokes"
 ENG_support_weapons_desc: "Миномет &lt; &lt; Викерс МГ &gt; &gt; и &lt; &lt; Стоукс &gt; &gt; был иконным оружием британской армии во время Вельткрига. После революции и гражданской войны в арсеналах ВСВС все еще имеется большое количество такого оружия, хотя оно и было переклассифицировано в наши дни и в наши годы; оно все еще может быть эффективно использовано."
 ENG_support_weapons2: "2-дюймовый миномет Lis Mk III DMS & SBML"
 ENG_support_weapons2_desc: "С помощью своего культового журнала "pan" Льюис служил Томми с самых мрачных дней первого вельткрига. С угрозой войны, которая еще близка, в варианте MKIII есть пистолет, который позволяет стрелять из плеча на любой части палубы корабля. SBML, будучи небольшим, невероятно переносной, имеет больше огневой мощи и дальности, чем большинство винтовочных гранат."
 ENG_support_weapons3: "Миномет Enfield-Automatic Mk IIIB и ML 3 дюйма"
 ENG_support_weapons3_desc: "Enfield-Automatic Mk IIIB — это еще одно создание RSAF, которое искало замену Vickers и Lewis. Enfield-Automatic едят, что снижает скорость огня, но предотвращает перегрев. Это оружие гораздо легче, чем автоматы с поясом, и будет служить следующему поколению Томми в траншеях. ML 3 дюймовый миномет может обеспечивать эффективную оперативную артиллерийскую поддержку при переносе."
 ENG_support_weapons4: "4,2 дюйма миномета"
 ENG_support_weapons4_desc: "По мере продолжения войны постоянно совершенствуются существующие модели. &lt; &lt; МкВ &gt; &gt; варианта &lt; &lt; Энфилд-Автоматика &gt; &gt; предусматривает телескопическое зрение и усовершенствованную систему охлаждения. &lt; &lt; МL 4.2 дюймовый миномет &gt; &gt; является тяжелым минометом. &lt; &lt; МЛ 4,2 дюйма &gt; &gt; , который является довольно тяжелым, но смертоносным, миномет должен быть отбуксирован, чтобы его доставили на поле боя."
 ENG_improved_infantry_weapons_2: "No 1 MC Mk 1"
 ENG_improved_infantry_weapons_2_desc: "Последние достижения британской изобретательности, Mack 1 Machine-Carbine, это полностью автоматический автомат. Успешный и надежный дизайн; Марк 1 характеризуется постоянной скоростью огня и довольно легкий, весит около 6 фунтов (2,7 кг), что делает его идеальным для боя в непосредственной близости."
 ENG_advanced_infantry_weapons2: "No 11 MR MK IV"
 ENG_advanced_infantry_weapons2_desc: "Вариант MK IV MR Mk 1"MR4 for short" represents the latest technological advancements in warfare. The MK IV variant sees improvements to recoil and stability due to the tradition of the British Army on marksmanship. The gas-operated British machine rifle uses .280 British cartridges."
 ENG_night_vision: "Глаз кошки"
 ENG_night_vision_desc: "Тьма всегда была одним из величайших врагов человечества. Последние события на станции IX изменили это, создав сверхсекретный инфракрасный круг ночного видения."Cat's Eye," the device allows for reconnaissance and operations under cover of darkness."

 #Motorised

 ENG_motorized_equipment_0: "Тип AEC Y"
