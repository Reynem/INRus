 KUR_infantry_equipment_0_desc: "Маузер G98 был главным сервисным винтовкой Оттоманской армии во время Велткрига. Оттоман М1903, запертый в 7,65-ммм, был самым распространенным вариантом Маузера в использовании. Объявленный оттоманами "Мавзер", эта иконная винтовка получила большую славу и глубоко укоренилась в турецком подсознании. Ни одна сторона меня, засохшая от печали / другая от раны Мавзера. Свободная от контроля Оттомана, курдская армия обладает большим количеством этих винтовок."

