 #Artillery
 BAT_artillery_equipment_1: "10,5-см лейхте Фельдаубице Моделе 33"
 BAT_artillery_equipment_1_short: "10,5-см. le.F.H. 33"
 BAT_artillery_equipment_1_desc: "10,5-см le.F.H. 33 — это стандартный артиллерийский кусок Deutsches Heer, который был принят для использования в 1933 году и использовался всеми дивизиями и артиллерийскими батальонами. &lt; &lt; Рейнметалл &gt; &gt; была разработана в 1928 - 29 годах и стала крупным шагом на пути к своему предшественнику -- 10,5 см le.F.H. 16 -- совершенно новый трехточечный бронетранспортер обеспечивает большую стабильность и увеличивает траверсу до 56 градусов наряду с механизмом наблюдения, с тем чтобы облегчить стрельбу по движущимся целям."
 BAT_artillery_equipment_2: "15 см швере Фельдаубице Моделель 36"
 BAT_artillery_equipment_2_short: "15-см с.Ф.Х. 36"
 BAT_artillery_equipment_2_desc: "В 1935 году Армия разработала требование о более легкой версии пистолета, который мог быть снят одной лошадиной командой, для которой был выбран новый проект из Rheinmetall."
 BAT_artillery_equipment_3: "17-см Kanone Modell 40 в Mörserlafette"
 BAT_artillery_equipment_3_short: "17-ти см К. 40 миссис Лаф."
 BAT_artillery_equipment_3_Desc: "17-миллиметровый каноне 40, построенный Круппом и Ганноверше Масчиненбау, является тяжёлым пулемётом."double recoil\" or dual-recoil carriage. The dual-recoil mechanism absorbs all of the recoil energy with virtually no movement of the box trail upon firing, thus making for a very accurate weapon."

 BAT_anti_tank_equipment_1: "3,7-см Панцерабверканона модель 36"
 BAT_anti_tank_equipment_1_short: "3,7-см Па.К. 36"
 BAT_anti_tank_equipment_1_desc: "В начале 1924-х годов началось проектирование противотанкового пистолета с лошадиной 3,7 см (начиная с 37 см в Па.К. 28) компанией &quot; Рейнметалл &quot; . К началу 1930-х годов стало очевидно, что противотанковая артиллерия устарела, и это оружие было модифицировано для механического транспорта, позволяющего буксировать его на скоростях движения по шоссе. &quot; Ник &quot; , названный солдатами &quot; Heeresankloppfgerät &quot; ( &quot; устройство для кнопки дверей &quot; ), переименованное в 37 см в Pa.K. 36, является основным противотанковым оружием &quot; Deutsches Heer &quot; и легко может управлять с помощью вражеских легких танков."
 BAT_anti_tank_equipment_2: "7,5 см Панцерабверканоне модель 40"
 BAT_anti_tank_equipment_2_short: "7,5-см Па.К. 40"
 BAT_anti_tank_equipment_2_desc: "В 1939 году после поступления в Берлин сообщений о создании новых вражеских танков было разработано 7,5-километровое оборудование, которое первоначально не уделялось приоритетного внимания проекту, однако после роста напряженности в отношениях с Францией и появления сильно бронетанков ему было отведено более приоритетное место. &lt; &lt; Па.К. 40 &gt; &gt; с точки зрения бронебойных операций имеет преимущество перед аналогичными ружьями, но имеет менее эффективные системы опрокидывания, в результате чего оружие находится за аналоговыми для быстрого изменения позиции."
 BAT_anti_tank_equipment_3: "12,8-см Панцерабверканона Моделель 43"
 BAT_anti_tank_equipment_3_short: "12,8-см Па.К. 43"
 BAT_anti_tank_equipment_3_desc: "12,8-см Pa.K. 43 — это новый противотанковый пистолет, первоначально разработанный как полевое оружие, известное как &lt; &lt; Каноне 43 &gt; &gt; . Однако после того, как стали появляться более тяжелые танки, требования к конструкции были изменены, с тем чтобы включить в них противотанковую функцию. 12,8-см Pa.K. 44 имеет хорошие противотанковые характеристики на протяжении долгого времени до крайних дальний дальности - 1800-2 700 метров и за его пределами, - а также удвоение в качестве эффективного полевого ружья при выстреле с применением высоковзрывных снарядов. Но поскольку было невозможно установить ствол мощностью 12,8 см при перевозке обычного противотанкового ружья, была разработана специальная тара для ружья."

 BAT_anti_air_equipment_1: "2-см Flugzeugabwehrkanone Modell 36"
 BAT_anti_air_equipment_1_short: "2-см Фла.К. 36"
 BAT_anti_air_equipment_1_desc: "В 1933 году компания &quot; Рейнметалл &quot; разработала зенитную зенитную пушку &quot; Фла Кей 30 &quot; , а в 1933 году &quot; Дойчес Хир &quot; начала получать оружие. В 1936 году в связи с ростом напряженности Маузер модернизировал ружье - модернизированная модель получила обозначение &quot; Флагзеугабверкано 36 &quot; и была принята германской армией. &quot; Принцип функционирования механизмов &quot; ФлаК. 36 &quot; остается таким же, как и в 1936 году - применение силы оттока с коротким ударом ствола, но в остальном аналогична с увеличением скорости огня лишь до 220 выстрелов в минуту и незначительным снижением общего веса до 420 кг."
 BAT_anti_air_equipment_2: "3,7-см Flugzeugabwehrkanone Modell 37"
 BAT_anti_air_equipment_2_short: "3,7-см Фла.К. 37"
 BAT_anti_air_equipment_2_desc: "В 1935 году Rheinmetall разработал пистолет калибра 3,7 см. Общая длина пушки составляла 89 калибров, что позволило установить максимальный потолок в 4 800 метров. 35 фланцев было произведено лишь небольшими количествами, а производство уже закончилось. В 1936 году продолжалась разработка, в ходе которой основное внимание уделялось замене существующей громоздкой двухосной горной установки на более легкую одноосную ось, в результате чего было установлено 3,7 см Fla.K. 36 с реальной скоростью стрельбы до 120 выстрелов в минуту. Новая упрощенная система наблюдения, внедренная в следующем году, привела к созданию в иных случаях 3,7 см. фла. К. 37, которая быстро стала основным вариантом оружия для немецкой армии."
 BAT_anti_air_equipment_3: "8,8-см Flugzeugabwehrkanone Modell 41"
 BAT_anti_air_equipment_3_short: "8,8-см Фла.К. 41"
 BAT_anti_air_equipment_3_desc: "Первоначально разработанная в 1930 году Krupp Flugzeugabwehrkanone 30, известная как "acht-acht" ("8-8") была впоследствии изменена Rheinmetall. Многопрофильная перевозка позволяет 8,8-см Fla.K. стрелять в ограниченном противотанковом режиме, когда он еще находится на колесах, и многие считают, что линия 8,8-см Fla.K. является одной из лучших в своё время. Rheinmetall Fla.K. 41 является вторым поколением 8,8 см, которое, по словам некоторых генералов, «почти равно 12,8 см пушкам»."

 BAT_rocket_artillery_equipment_1: "28/32-cm Schveres Wurfgerät Modell 40"
 BAT_rocket_artillery_equipment_1_short: "С.В.Г. 40"
 BAT_rocket_artillery_equipment_1_desc: "Первоначально спроектированная для установки дымовой завесы ( &lt; &lt; Нелампруппен &gt; &gt; ) система &lt; &lt; Швере Вурфгерет 40 &gt; &gt; имеет два варианта: деревянные и стальные рамы. &lt; &lt; Открытые рамы &gt; &gt; наиболее часто используемой стали имеют короткие навесные ноги для регулировки высоты и калибровываются для установки 32-сантиметровой ракеты, однако для установки 28-сантиметровых ракет предусмотрены адаптивные рельсы. &lt; &lt; Швере Вурфрахмен &gt; &gt; может также устанавливаться на 40 рамах, прикрепленных к бортам различных транспортных средств."
 BAT_rocket_artillery_equipment_2: "21-см Raketenwerfer Modell 42"
 BAT_rocket_artillery_equipment_2_short: "Р.У. 42"
 BAT_rocket_artillery_equipment_2_desc: "21-см Raketenwerfer 42 представляет собой пятибаррированный многоствольный ракетный пусковой комплекс, установленный на буксируемой тележке, изготовленной из противотанкового пистолета площадью 3,7 см в Па.К. 36. Ракеты развертываются в аккумуляторах мощностью 6 аккумуляторов с тремя аккумуляторами на батальон. R.W. 42 предназначен для обеспечения огневой поддержки и обустройства дымовых экранов, а R.W. 42 используется главным образом в качестве ракетной артиллерии и почти не участвует в химической войне."

