 POR_infantry_equipment_0: "Эспинарда 6,5 мм м/1904"
 POR_infantry_equipment_0_short: "Маузер-Вергейро"
 POR_infantry_equipment_0_desc: "Боковая винтовка с длинным опытом работы, 6,5 мм м/1904, более широко известна молотком «Маузер-Вергейро», так как основной дизайн пистолета по существу принадлежит Маузеру 98 (с специальным болтовым механизмом, в значительной степени основанным на Gewehr 1888) с патроном 6,5×58 мм Vergueiro, который был разработан специально для португалского варианта. Он стал официальным оружием португальской армии в 1904-х годах и продолжал использоваться в этом качестве до 1940-х годов и широко использовался как дома, так и за рубежом. Хотя он не использовался португальскими войсками на западном фронте, поскольку он был вооружен главным образом британским оружием, он широко использовался в Африке Португалией, ее союзниками в Южной Африке, а также немцами, которые время от времени захватывали поставки в Португальской Восточной Африке."
 POR_infantry_equipment_1: "7,92 мм м/1904/36"
 POR_infantry_equipment_1_short: "M36 Muser-Vergueiro"
 POR_infantry_equipment_1_desc: "По сути дела, не более чем обновленный вариант Маузера-Вергейро для работы с различными комплектами боеприпасов, он был введен в Африку в условиях растущей напряженности между Португалией и Германией и стал ассоциироваться с тяжелыми репрессиями Португалии в этих районах. Его использование в Европе, хотя и менее известное, было гораздо более распространенным, но в последующие годы оно было полностью заменено ФБП."
 POR_infantry_equipment_2: "Карабина C.A.P. Modelo 01"
 POR_infantry_equipment_2_short: "С.А.П. М40"
 POR_infantry_equipment_2_desc: "Прототип карбина, который практически не использовался в португальской армии в целом, был первой попыткой страны решить стандартный вопрос, разработанный на национальном уровне. &lt; &lt; хунта националистов-интегралистов &gt; &gt; активно поддерживала развитие карбина C.A.P., но к тому времени, когда она была готова к производству, реальности на местах сделали более целесообразным переход к ФБП в целом непосредственно от старого Маузера-Вергейро и вариантов, уже широко используемых вооруженными силами."
 POR_infantry_equipment_3: "Pistola-Metralhadora FBP M/945"
 POR_infantry_equipment_3_short: "FBP M/945"
 POR_infantry_equipment_3_desc: "Пистолет FBP назван в честь аббревиатуры Braço de Prata Factory, производителя оружия, литейного изделия, принадлежащего и контролируемого самим правительством Португалии. В то время как его разработка началась еще до того, как он широко использовался среди пехотных войск в португальской армии, законченная модель ввела в производство слишком поздно, чтобы заменить Маузер-Вергейро во время войны. Это намерение было ясно из-за того, что подмашинный пистолет имел довольно необычные штыки, совместимые с моделями Маузера, которые использовались Португалией во время конфликтов предыдущих десятилетий. Так называемый «махинальный пистолет» (термин на португальском языке для автоматов в целом) широко использовался на протяжении многих лет, хотя вариант 1945 года не использовался в пользу версий с полуавтоматическими выстрелами и импортными моделями, поскольку в последующие десятилетия после Второй Вэлткриг уменьшил масштабы боевых действий."
 POR_support_weapons: "Metralhadora Vickers & Morteiro Stokes"
 POR_support_weapons_desc: "Воды, охлаждённые Викерсом МГ и траншеем Стоукса, были стандартным вспомогательным оружием Британской империи во время Велткрига. Во время перевооружения после конфликта восстановленная португальская монархия приобрела и сфабриковала их с намерением широко использовать пехоту как дома, так и за рубежом."
 POR_support_weapons2: "Metralhadora Lewis Modelo DMS & Morteiro SBML de 2 Polegadas"
 POR_support_weapons_2_desc: "С помощью своего культового журнала «pan» Льюис служил Контенту с самых мрачных дней первого Велткрига. Вариант MKIII имел пистолетную хватку, которая позволяла стрелять из плеча на любой части палубы корабля. SBML, хотя и маленькая, невероятно переносной, имеет большую огневую мощь и дальность, чем большинство винтовочных гранат."
 POR_support_weapons3: "Metralhadora Vickers Modelo II & Morteiro ML de 3 Polegadas"
 POR_support_weapons_3_desc: "В варианте марки II MG Vickers MG предусматривался избирательный вариант огня и хватку пистолета, который был принят главным образом для бронетранспортеров. ML 3 дюймовый миномет был значительно модернизирован со Стоукса, поскольку он был надежным и прочным для непосредственной артиллерийской поддержки."
 POR_support_weapons4: "Metralhadora Vickers-Vedras & Morteiro de 4.2 Polegadas"
 POR_support_weapons_4_desc: "Третий вариант уважаемого пулемета &lt; &lt; Викерс &gt; &gt; был разработан для использования в зенитных целях и предусматривает несколько более высокий уровень обстрела со стороны его предшественников."
 POR_infantry_at: "Мортейро-Бомбарда"
 POR_infantry_at_desc: "Конструкция миномета, разработанная в Канаде и проданная Португалии в значительных количествах, представляла собой минометный миномет. Подтверждая, что проект может служить как артиллерийским предметом, так и противотанковым оружием, проект был с нетерпением принят несколькими союзниками Контента, в том числе Португалией."
 POR_infantry_at2: "LATI"
 POR_infantry_at2_desc: "С учетом необходимости ручной противотанковой установки, предназначенной для использования на фронтальных линиях, был разработан LATI (прямой перевод на канадский английский язык) на основе конструкции миномета-бомбардировщика."

