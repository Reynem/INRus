 ### Land ###
 # Mosin-Nagant:
 BLR_infantry_equipment_0: "Piachotnaja Vintouka uz.1891 Mosina"
 BLR_infantry_equipment_0_short: "V-91"
 BLR_infantry_equipment_0_desc: "Мосин-Нагант 1891 года, аккумулированный в 7,62x54R, остался в качестве стандартной пехотной винтовки между немецкими и восточными союзниками после краха Российской империи, многие из которых сталкиваются с хронической нехваткой оружия и не могут изготовить новое оружие из России, местное производство винтовки продолжалось в Польше, Украине и других Остстаате со сложившейся оружейной промышленностью. Хотя несколько устарело по сравнению с новыми винтовками Маузера, Mosin-Nagant остается дешевым и надежным оружием."
 # M/27:
 BLR_infantry_equipment_1: "Piachotnaja Vintouka uz.1891/27 Mosina"
 BLR_infantry_equipment_1_short: "V-91/27"
 BLR_infantry_equipment_1_desc: "M/27 представляет собой почти полную переработку оригинального Mosin-Nagant M1891, включающую значительные улучшения в целях повышения точности и надежности. &lt; &lt; M/27 &gt; &gt; , сохраняя приемник и журнал своего предшественника, модернизирует достопримечательности, болт, новый штык и более короткий, но в то же время большой 685-миллиметровый ствол. &lt; &lt; M/27 &gt; &gt; , первоначально разработанный в Финляндии, с тех пор начал подменять старый &lt; &lt; Мосин-Нагант &gt; &gt; по всей Восточной Европе, предлагая своим войскам более современную пехотную винтовку без отказа от существующих запасов или производственных линий."
 # MP35:
 BLR_infantry_equipment_2: "Пиачотни Писталиет-Кулиамиот uз.1935 Бьерхмана"
 BLR_infantry_equipment_2_short: "ПК-35"
 BLR_infantry_equipment_2_desc: "В то время как концепция автоматизации оружия была хорошо доказана на втором этапе Велткрига, многие страны видят серьезную нехватку оружия в момент появления второго вельткрига. Не в состоянии обеспечить стандартный MP-40 немецкой армии, остстаатен часто должен быть удовлетворен тем, что доступно на коммерческой основе через частные фирмы. MP-35, разработанный Эмилем Бергманом и примечательный для его горизонтального журнала с правой стороны, является популярным выбором благодаря его относительной жесткости и доступности, а также готовности Бергмана лицензировать дизайн."
 # SVT-40:
 BLR_infantry_equipment_3: "Самазарадная Винтука, 1940 год, Токкарева"
 BLR_infantry_equipment_3_short: "SV-40"
 BLR_infantry_equipment_3_desc: "В начале второго вольткрига российская армия развернула огромное количество полуавтоматической винтовки SVT-40, дав своим силам значительный предел огневой мощи, поскольку Беларусь не имеет собственной самозарядной винтовки, захваченные СВТ стали весьма желательным активом, после успешной реорганизации конструкции белорусская оружейная промышленность смогла произвести ряд таких винтовок для военных."

 # RMN-50
 BLR_improved_infantry_weapons_2: "Рухни Минамиот uз.1943 Наджмана"
 BLR_improved_infantry_weapons_2_short: "РМН-43"
 BLR_improved_infantry_weapons_2_desc: "РМN-43 был разработан белорусским химиком Исаком Марковичем Наджманом, поскольку белорусские партизаны нуждались в переносном оружии, способном выпускать взрывчатые вещества, тяжелее винтовочной гранаты, но легче миномета."hand mortar\" was a Mosin rifle with the barrel replaced by a shortened tube of a 5 cm leGrW 36. Using the latter's widely-available ammunition, the Najman Hand Mortar could cause heavy damage in hit-and-run attacks, allowing the attackers to retreat quickly and saving lives as the weapon did not require to be deployed."

 #Panzerbuchse 39:
 BLR_infantry_at: "&quot; Процитанкаваджа Стрелбу Браухера &quot; , uз.1939"
 BLR_infantry_at_short: "PTS-39"
 #Panzerschreck:
 BLR_infantry_at2: "Reaktyunaja Procitanavaja Strelbu uz.1943"
 BLR_infantry_at2_short: "РПТС-43"
 BLR_infantry_at2_desc: "54 противотанковых противотанковых ракетных пусковых установки с плечевой пусковой установкой под названием «Офенрохр» и более популярный «Панзершрэк» («Танкз Фрайт») — это легкое пехотное оружие, разработанное для немецких вооруженных сил, вдохновленное слухами об американских ракетных пусковых установках. В идеальных условиях R.Pz.B. 54 может проникнуть в бронежилеты тяжелых танков с помощью своих 8,8-центиметровых ракет, уже используемых 43-ракетными пусковыми установками Raketenwerfer. В качестве недостатка R.Pz.B. 54 производит много дыма при обстреле. Многие из них отправлены из Германии из-за отсутствия у Беларуси противотанкового оружия."

