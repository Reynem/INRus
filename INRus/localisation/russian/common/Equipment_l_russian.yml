 LEP_motorized_equipment_1: "Тип &quot; Нанкин Чжунюань &quot;"
 LEP_motorized_equipment_1_short: "Чжунюань"
 LEP_motorized_equipment_1_desc: "После реставрации Цин Бенз АГ и правительство Цинга создали несколько автомобильных заводов в Китае в качестве совместных предприятий; самым известным из них были Жуньюаньские автомобильные заводы, расположенные в Шанхае и Наньцзине. Тысячи грузовиков типа Чжунюань были произведены в этих двух районах, которые служили в различных армиях, лояльных клике Жили. ~n nonotaby, Жонгюань назван не в честь древнекитайского места под названием Чжунюань (район вокруг ядра империи), а вместо этого после нарисованного логотипа на передней части кабины грузовика; огромный китайский персонаж "Zhong" был помещен в круг."

 LEP_mechanized_equipment_1: "Sonderkraftfahrzeug 11"
 LEP_mechanized_equipment_1_short: "Хаоксу 11"
 LEP_mechanized_equipment_1_desc: "Sd.Kfz. 11 (Sonderkraftfahrzeug — специальный автомобиль с двигателем) — немецкий полупутевый автомобиль, который широко использовался во втором Вельткриге."
 LEP_mechanized_equipment_2: "Sonderkraftfahrzeug 251"
 LEP_mechanized_equipment_2_short: "Хаоксу 251"
 LEP_mechanized_equipment_2_desc: "251 полпути — бронебойный боевой автомобиль, спроектированный и впервые построенный компанией &lt; &lt; Ханомаг &gt; &gt; во время Второй Велткриг, на основе своего предыдущего автомобиля &lt; &lt; Сд.Кфз. 11 &gt; &gt; ."

