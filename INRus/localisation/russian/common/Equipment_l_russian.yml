 HAI_infantry_equipment_0: "Спрингфилд Краг-Йёргенсен Модель 1898 года"
 HAI_infantry_equipment_0_short: "Спрингфилд М1898"
 HAI_infantry_equipment_0_desc: "Винтовка Краг-Йоргенсен была принята Соединенными Штатами в 1892 году для замены стареющей Спрингфилдской модели 1884 года. В то время как Краги оказались выше на близком расстоянии по сравнению с аналогичными конструкциями Маузера в испано-американской войне, неустойчивое действие винтовки по сравнению с новыми конструкциями болта потребовало замены всего лишь через десять лет после ее принятия. Во время американской оккупации нескольких центральноамериканских государств в начале XX века многие накопленные винтовки Крага, в основном из винтовки 1898 года, были предоставлены местным силам вместе с двигателями из избыточных боеприпасов."
