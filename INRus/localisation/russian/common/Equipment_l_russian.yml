 #Railway
 SRI_train_equipment_1: "ПС Группо 625"
 SRI_train_equipment_1_short: "FS Gr. 625"
 SRI_train_equipment_1_desc: "В 1903 году Adriatic Railways и в 1909 году National Railways были построены 625 многофункциональных двигателей класса "Mogul", изготовленных в Германии до Великой войны. Эти двигатели были оснащены итальянской тележкой, специальной передней тележкой, предназначенной для работы на низких лучевых изгибах на старых линиях, а также клапанной системой Caprotti. С северо-западной линией и линией Порреттана между Болоньем и Флоренцией была быстро электрифицирована в трехфазной системе переменного тока, 625 группа была отправлена в Турин для обслуживания остальных линий, где она осталась после войны и осталась в наших руках."
 SRI_train_equipment_2: "ПС Группо 623"
 SRI_train_equipment_2_short: "ПС Gr. 623"
 SRI_train_equipment_2_desc: "Эволюция 625-й группы, разработанной с учетом нехватки ресурсов, таких, как уголь, 623-я группа оснащена новым котлоагрегатом Франко-Крости и различными другими усовершенствованиями, более мощными, чем их предшественники, и более дешевыми для эксплуатации, более высокая нагрузка на ось не является проблемой для этих относительно небольших двигателей, что позволяет им работать на всех, за исключением наименее загруженных, линиях, однако они по-прежнему менее мощны, чем другие локомотивы, что требует использования нескольких двигателей для перевозки самых тяжелых поездов."
