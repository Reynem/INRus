 FIN_infantry_equipment_0: "Mosin-Nagant 1891-Mallin"
 FIN_infantry_equipment_0_short: "М/91"
 FIN_infantry_equipment_1: "Мосин-Нагант 1930-Маллин"
 FIN_infantry_equipment_1_short: "М/2001/30"
 FIN_infantry_equipment_2: "Kivääri Pelo M/38"
 FIN_infantry_equipment_2_short: "Пело М/38"
 FIN_infantry_equipment_2_desc: "Несмотря на то, что в начале 1930-х годов финская армия считала его первоначальные разработки непомерно дорогостоящими, дальняя полуавтоматическая винтовка Карла Пело привлекла внимание соседа Финляндии - Швеции. Группа квалифицированных шведских дизайнеров оружия в конечном итоге смогла снизить производственные расходы на винтовку, и в конечном итоге она была принята шведами, несмотря на то, что она все еще довольно сложна."
 FIN_infantry_equipment_3: "Суоми-конепистуоли 41"
 FIN_infantry_equipment_3_short: "Суоми КП/41"
 FIN_infantry_equipment_3_desc: "КП/41, хотя он и представляется почти идентичным старому КП/31, представляет собой значительный отход в разработке оружия. Пистолет начался в качестве эксперимента Аимо Лахти по гибридизации 8-мм пулемета Маузера с 9-мм парабеллумом; однако новый большой пистолетный патрон, появившийся в результате его экспериментов, стал центральным элементом последующего дизайна оружия Финляндии. КП/41 сам начал как производная собственного автомата «Суоми», выставленного для его нового гильза, и, по сути, хотя сохранение общей формы и чувства КП/31 было более предпочтительным, в конечном счете, массовый импульс возврата новой конструкции привел как к дальнейшим внешним изменениям тела оружия, так и к снижению его кишечной скорости."
