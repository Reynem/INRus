 ### Land ###
 TIB_infantry_equipment_0: "Винтовка No 1 Mk III"
 TIB_infantry_equipment_0_short: "No 1 Мк III"
 TIB_infantry_equipment_0_desc: "После падения Британского Раджа постоянный проток британских винтовок и боеприпасов в страну стал потопом, и в течение года тибетское стрелковое оружие двигалось, возможно, более 50 лет. Кроме того, приток немецких боеприпасов в Тибет после вмешательства Германии в Китай привел к тому, что Тибет превратил свои винтовки SMLE в 7,65×53мм Маузер."
 TIB_infantry_equipment_1: "Модель Mauser 1898"
 TIB_infantry_equipment_1_short: "Маузер 1898"
 TIB_infantry_equipment_1_desc: "В ответ на несколько коммерчески успешных короткометражных винтовок, изготовленных на основе Маузера 1898 года конкурирующими производителями оружия, компания Mauser разработала свой собственный умеренно сокращенный винтовку 1898 года. Два соответствующих образца этого винтовки были названы Маузером «стандартной моделью». Многие малые государства, включая Тибет, купили эти новые пистолеты в больших количествах; тибетский вариант является более старым из двух и заперт в 7,65×53ммм Маузере. nnSoon после получения винтовок, тибетское правительство переоборудовало несколько винтовок в карабины, каннибалируя старые британские винтовки для материалов."

