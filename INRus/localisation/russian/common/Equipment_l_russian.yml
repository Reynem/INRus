 #Trains

 # German designation: 1 of 7 State Companies - S for Express passenger / P for Passenger / G for goods or freight / T for Tender - Number for power, higher the more powerful - Production Series
 # FMSR Class L:
 GEA_train_equipment_1: "К.М.С.Е.С. 53"
 GEA_train_equipment_1_short: "Малайшиша S 53"
 GEA_train_equipment_1_desc: "Заказан в 1921 году в качестве более мощной версии FMSR класса P, чтобы исключить двойную передачу экспресс-услуг, FMSR класса L был усовершенствованным и более мощным паровозным вариантом 4-6-2 (Pacific), предназначенным для перевозки более длинных вагонов с меньшей потребностью в дополнительной тяге. После немецкой реорганизации FMSR эти локомотивы были переименованы в S 53."
 # FMSR Class-O but Hanomag's RSR 260 upgraded:
 GEA_train_equipment_2: "К.М.С.П. 56"
 GEA_train_equipment_2_short: "Малайшиша S 56"
 GEA_train_equipment_2_desc: "Эти локомотивы, изготовленные компанией &quot; Ханомаг &quot; , были в конечном счете построены на Малайане 4-6-2 (Тихий океан), что позволило значительно снизить вес, когда это возможно, делая производство дешевым, и было легко поддерживать 80 км/ч (50 миль в час) на аттракционах между Сингапуром и Гемасом, что доказало, что эти локомотивы способны производить 112 км/ч (70 миль в час)."
 # FMSR Class-O but Hanomag's RSR 260 upgraded and armoured:
 GEA_train_equipment_3: "K.M.S.S. 56 Pz."
 GEA_train_equipment_3_short: "Малайшиша S 56 P"
 GEA_train_equipment_3_desc: "По мере того, как на железные дороги начали нападать вражеские самолеты, новые локомотивы, которые будут работать на фронтах, должны иметь возможность наносить удары с 20-мм пушек. В целях защиты локомотива от воздушных ударов некоторые локомотивы &lt; &lt; Малайиши &gt; &gt; S 56 оснащаются трехдюймовыми бронежилетами вдоль локомотива для защиты жизненно важных частей."
