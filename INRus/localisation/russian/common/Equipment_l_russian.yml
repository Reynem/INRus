 SOM_infantry_equipment_0: "Каркан Nooc 1891"
 SOM_infantry_equipment_0_short: "Carcano M91"
 SOM_infantry_equipment_0_desc: "Вооруженные силы Сомали в начале 1930-х годов имели различные неконфронтированные модели винтовок, но в значительной степени наиболее часто, особенно в Могадишо и в рядах сил Хобио, была винтовка &quot; Каркано &quot; . &quot; Сальваторе Каркано &quot; , разработанная в 1891 году на Армейском архиепископе Турина, зажигала карбины 6,5 х 52мм патроны каркано. &quot; Система журнала &quot; использует блок-заряды, которые первоначально были разработаны Фердинандом Маннлихером, поэтому пистолет часто называют &quot; Маннлихер-Каркано &quot; , но в Сомали его также известное как &quot; Каркан &quot; , и большое количество оружия использовалось коренными Аскари и колониальными войсками во время их дезорганизированного ухода на хвосте &quot; Велкрига &quot; , где было оставлено большое количество материала."
 SOM_infantry_equipment_1: "Kirkale Nooc 55"
 SOM_infantry_equipment_1_short: "Kirkale Q55"
 SOM_infantry_equipment_1_desc: "С 1933 года Османская империя обновила свои старые винтовки до общей конфигурации, известной в Империи как модель 1936 года и все в 8x57 гильзе Маузера. Многие из этих видов оружия были проданы Сомали, поскольку государству было трудно создать местную фабрику по производству оружия."
 SOM_infantry_equipment_2: "Рэйфал Соомаали Nooc 61"
 SOM_infantry_equipment_2_short: "RSN.1.6.1"
 SOM_infantry_equipment_2_desc: "По мере того, как османская стратегическая задача была направлена на вооружение своей собственной империи, Сомали оказалась в некоторой степени не в состоянии иметь готовых торговых партнеров на Ближнем Востоке и, по сути, в Европе в целом в том, что касается торговли оружием. &lt; &lt; Модель 61 &gt; &gt; для всех была несанкционированной скрытной копией &lt; &lt; Кириккале Т60 &gt; &gt; , которая имела ограниченное применение, но сохранила символическое значение в качестве первого огнестрельного оружия, изготовленного и разработанного в современной сомалийской стране."
 SOM_infantry_equipment_3: "Рэйфал Соомаали Nooc 65"
 SOM_infantry_equipment_3_short: "RSN.2.65"
 SOM_infantry_equipment_3_desc: "Модель 65 широко использовалась в послевоенную эпоху в Сомали, слишком немногие из моделей были развернуты для того, чтобы быть действительно значимыми в войнах, которые страна обнаружила в течение указанного периода времени."

