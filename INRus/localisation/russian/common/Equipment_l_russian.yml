 #Infantry Equip

 SWE_infantry_equipment_0: "Mauser Gevär m/1896"
 SWE_infantry_equipment_0_short: "Гевяр м/96"
 SWE_infantry_equipment_0_desc: "Эта винтовка, выпущенная Маузером, является свидетельством шведской инженерной и военной прозорливости. &lt; &lt; Гевир м/96 &gt; &gt; , помещенная в почитаемый патрон калибром 6,5x55 мм, служит Швеции с непревзойденной надежностью. &lt; &lt; Гевяр м/96 &gt; &gt; делает ее любимым инструментом среди шведских солдат, обеспечивая ее непрерывное использование на поле боя. &lt; &lt; М/96 &gt; &gt; остается символом шведской военной традиции, без изменений в ее конструкции и столь же эффективным."
 SWE_infantry_equipment_1: "Mauser Gevär m/1932"
 SWE_infantry_equipment_1_short: "Гевяр м/32"
 SWE_infantry_equipment_1_desc: "Введённая в 1932 году, The Gevär m/32 продолжает служить шведским вооруженным силам с отличием. Ее принятие, сопровождающееся незначительными изменениями в целях улучшения эргономики и точности, отражает приверженность Швеции поддержанию огромных пехотных сил. В 6,5x55 мм m/32 является усовершенствованной версией ее предшественников, сочетающей доказанную надежность с повышением эффективности боевых действий."
 SWE_infantry_equipment_2: "Автоматгевр м/1939"
 SWE_infantry_equipment_2_short: "AG m/39"
 SWE_infantry_equipment_2_desc: "AG m/39, или AG Pelo, была первоначально уволена из-за сложности и стоимости, но при условии времени, шведский дизайнер оружия сумел превратить в реальность длиннооткатную полуавтоматическую винтовку. В 6,5x55 мм она была взята на вооружение, что означает новаторский подход Швеции к современной войне, давая ее солдатам мощный инструмент, уравновешивающий сложность и смертоносную эффективность."
 SWE_infantry_equipment_3: "Автоматгевяр m/1942"
 SWE_infantry_equipment_3_short: "AG m/42"
 SWE_infantry_equipment_3_desc: "Опираясь на основу AG m/39, AG m/42 ввела многочисленные усовершенствования, которые изменили свою роль на поле боя. AG m/42, включая нержавеющую газовую трубку, эргономическую модификацию и новый 10-разрядный журнал, наряду с другими усовершенствованиями, укрепляет свой статус как высшего оружия. В стандарте 6,5x55 мм AG m/42 является свидетельством приспособляемости и технического прогресса Швеции, предлагая солдатам надежное, мощное и усовершенствованное оружие для решения предстоящих задач."
