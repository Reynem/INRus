 CYP_infantry_equipment_0: "Mauser G98 M1903"
 CYP_infantry_equipment_0_short: "Mauser G98"
 CYP_infantry_equipment_0_desc: "Маузер G98 был главным служебным винтовкой Оттоманской армии во время Велткрига. Оттоман М1903, скрепленный 7,65мм, был самым распространенным вариантом Маузера в использовании. Провозглашенный оттоманами "Мавзер", эта икона получила великую славу и глубоко укоренилась в турецком подсознании."
 CYP_infantry_equipment_1: "Анкара АТФ М38"
 CYP_infantry_equipment_1_short: "АТФ М38"
 CYP_infantry_equipment_1_desc: "Начиная с 1933 года Османская империя обновила свои старые винтовки до общей конфигурации, известной как модель 1938 года, и все в 8x57 гильзе Маузера."
 CYP_infantry_equipment_2: "Kyrykale T-60"
 CYP_infantry_equipment_2_short: "Т-60"
 CYP_infantry_equipment_2_desc: "На основе приемника &quot; Гехер 41 &quot; была построена &quot; Полуавтоматическая винтовка &quot; Кырккале Т-60 &quot; , которая выпускается с помощью легкого и сокращенного запаса, с упором на надежность и скорость и точность, широко используется во всех отраслях военной службы Турции."

