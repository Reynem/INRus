 SCO_infantry_equipment_1_desc: "После революции и гражданской войны стало очевидно, что проект No 3 «Энфилд» не подходил для ведения боевых действий в городах. В 1932 году в конечном итоге были проведены испытания совершенно новой винтовки, однако в значительной степени не принесли результатов, при этом новые конструкции не могли соответствовать старому проекту «Энфилд» или получить негативную оценку войск. В свете этого показа усилия по замене «Энфилд» в конечном счете были скрыты. В 1935 году правительству были представлены совместные усилия Революционного завода по производству стрелкового оружия в Энфилде и Бирмингеме по производству стрелкового оружия. Новая винтовка была разработана на старом Ли-Энфилде с более коротким стволом, боковым болтом и упрощенной болтовой системой. Хотя, как и ее предшественники, No 4 является сильнее и легче производить, хотя и немного тяжелее из-за его ствола. Интересным фактом в отношении No 4 является то, что эта винтовка была установлена на высоте 100 ид (91 м); калибрована на 200-1 300 метров (183-1189 метров)."
