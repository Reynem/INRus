 # LMS Class 8F:
 ENG_train_equipment_1: "Британский железнодорожный станьер класса 48F"
 ENG_train_equipment_1_short: "Класс BR 48F"
 ENG_train_equipment_1_desc: "После экспериментирования со Стейнером класса 42MT и производства успешного BR класса 44MT Уильям Станье разработал класс 48F исключительно для тяжелых грузовых перевозок."
 # War Department 2-8-0 :
 ENG_train_equipment_2: "Британские железные дороги класса 90F"
 ENG_train_equipment_2_short: "Класс BR 90F"
 ENG_train_equipment_2_desc: "После назначения Роберта Риддла в министерство снабжения он быстро принял меры по разработке нескольких классов локомотивов, которые отдают приоритет низкой стоимости по сравнению с продолжительностью эксплуатации и которые могут быть быстро произведены. Модифицированный класс 48F стал классом 90F с рядом изменений. В котлоагрегаты и пожарные коробки были внесены значительные изменения с целью использования меди, а также упрощения клапанных механизмов. Сварка была также постепенно внедрена в строительство локомотивов и тендеров."
 # SR Merchant Navy Class:
 ENG_train_equipment_3: "Британский железнодорожный пулеид класса 135MTA"
 ENG_train_equipment_3_short: "Класс BR 135MTA"
 ENG_train_equipment_3_desc: "Главный инженер-механик Южного региона Оливер Буллеид считал, что обычные локомотивы, функционирующие в этом районе, будут легко вывезены любым въезжающим враждебным самолетом. &lt; &lt; Класс 135MTA &gt; &gt; будет его ответом, классом паровозов с воздухом 4 - 6 - 2 Тихоокеанского региона, спроектированным с излишними умами и бронированными с двумя дюймами бронежилетов над котелем, колесами и кабиной. &lt; &lt; Спам Канс &gt; &gt; будет называться их экипажами из-за гладкого воздушной оболочки."

 ENG_railway_gun_equipment_1: "Раздражённые 9,2 дюйма Мк. XIII"
 ENG_railway_gun_equipment_1_short: "BL 9,2 дюйма"
 ENG_railway_gun_equipment_1_desc: "Они были переоборудованы республиканской армией из брошенных и неиспользуемых винтовок Королевского ВМС в 9,2 дюйма, они были установлены на самодельной оружейной коляске и введены в эксплуатацию в качестве оружия для оказания помощи в предотвращении возможного вторжения."

