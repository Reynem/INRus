 SLO_infantry_equipment_0: "Карабина против zor 1895/30"
 SLO_infantry_equipment_0_short: "Маннлихер против 95/30"
 SLO_infantry_equipment_0_desc: "Mannlicher Carabina vzor 1895/1930 (Menterie Repetier-Gewehr M.95) — служебная винтовка вооруженных сил Австро-Венгерского региона, разработанная Фердинандом фон Маннлихером."back and forth\") by Austrian troops and \"Ta-Pum\" by the Italians on the receiving end. The Italian song \"Ta pum!\" from the Weltkrieg refers to this rifle. Later after the war, most rifles were converted into the carbine configuration."
 SLO_infantry_equipment_1: "Карабина против цора 1935 года"
 SLO_infantry_equipment_1_short: "ФЕГ против 35"
 SLO_infantry_equipment_1_desc: "Вельткриг сделал недостатки M.95 слишком очевидными, особенно его относительно слабое облако и необходимое техническое обслуживание для прямого действия. Steyr разработал 8x56 мм \"Spitzer\" cartridge that would serve as the basis to a new generation of weapons and push the M.95 to its full potential. In the 1935 Rifle Trial, the Hungarian FÉG design based on the Mannlicher-Schönauer's excellent turn-bolt-action won out and was adopted."
 SLO_infantry_equipment_2: "Кулометна пистолет vzor 1939"
 SLO_infantry_equipment_2_short: "Данувия против 39"
 SLO_infantry_equipment_2_desc: "Спроектировано Палом Кирали, это..."heavy\" submachine gun used specially-loaded 9x25mm ammunition in a folding magazine for transport and storage. This made it very potent and reliable compared to its contemporaries, making it reminiscent of later assault rifle designs."
 SLO_infantry_equipment_3: "Кулометна карабина противора 1942 года"
 SLO_infantry_equipment_3_short: "Збройовка Брно против 42"
 SLO_infantry_equipment_3_desc: "После того как стало ясно, что расстояние взаимодействия значительно сократилось после Вельткрига, монархия стала заинтересована в разработке промежуточной кассеты и \"machine-carbine\" idea. The Koucký brothers at Zbrojovka Brno presented their ZK 412 design using the 8x35mm \"Rapid\" cartridge with similar performance to the German 8x33mm Kurz."
 SLO_infantry_weapons2: "Пистолет &quot; Кулометна &quot; vzor 1934"
 SLO_infantry_weapons2_short: "Стейр-Солотурн против 34"
 SLO_infantry_weapons2_desc: "В то время как немецкий дизайн Louis Stange, MP 34 был в основном произведен Steyr и был принят Австро-Венгерской армией. Как и в случае с ранними автоматами, этот дизайн был тяжелым, дорогим, но надежным, с горизонтальным журналом, использующим мощный патрон 9x25 мм Mauser."
 SLO_improved_infantry_weapons_2: "Пистолет &quot; Кулометна &quot; vzor 38"
 SLO_improved_infantry_weapons_2_short: "Збройовка Брно против 38"
 SLO_improved_infantry_weapons_2_desc: "С учетом необходимости в бронебойном пистолете с использованием стандартного пистолетного патрона армии монархия приняла ZK 383, разработанный братьями Йозефом и Франтишем Коуки в Збройовке Брно, в качестве MP 38. Использование горизонтального журнала, такого как MP 34, известно, что ZK 383 имеет легкую биподу, позволяющую использовать его в качестве запасного автомата. Позднее модели были значительно упрощены для более дешевого и более быстрого производства наряду с вертикально сложенным журналом, как Danuvia SMGs."
 SLO_advanced_infantry_weapons2: "Кулометна пистолет vzor 1943"
 SLO_advanced_infantry_weapons2_short: "Данувия против 43"
 SLO_advanced_infantry_weapons2_desc: "В то время как журнал Danuvia 39M оказался успешным, его сворачивания было недостаточно для компенсации его громоздкого дизайна для матросов. 43M перепроектировался с откидным металлическим материалом и новым, более надежным дизайном журнала, что позволило ему быть гораздо более компактным во время перевозки или хранения без жертв огневой мощи."

 SLO_infantry_at: "Протипанчерова пушка против 38"
 SLO_infantry_at2: "Протипанцерова Ракетомет против zor 42"
 SLO_support_weapons: "ТЗ против 07/12 и Миномета против 14"
 SLO_support_weapons2: "LK vz. 26 & Minomet vz. 33"
 SLO_support_weapons3: "LK vz. 30 & Minomet vz. 36"
 SLO_support_weapons4: "LK vz. 45 & Minomet v. 43"

 SLO_motorized_equipment_1: "Штэйр 640"
 SLO_motorized_rocket_equipment_1: "Krupp Protze w/ vzor 44 'Palcatomet'"
 SLO_motorized_rocket_equipment_1_short: "Krupp Protze w/ v.44"
 SLO_mechanized_equipment_1: "Saurer obrnéne transportéry vzor 38/40"
 SLO_mechanized_equipment_1_short: "OT vz. 38/40"
 SLO_mechanized_equipment_1_desc: "Потребность в бронетранспортере для механизированной пехоты привела к переоборудованию нескольких различных автомобилей для выполнения этой роли."box\" was added to the chasis that protected the driver and personnel inside. The deployment of these conversions helped cement the concept of armoured transports in Austrian doctrine."
 SLO_mechanized_equipment_2: "Вайс Манфред обрнене транспортерри против 39/42"
 SLO_mechanized_equipment_2_short: "OT vz. 39/42"
 SLO_mechanized_equipment_2_desc: "В 1942 году венгерская компания &lt; &lt; Вайс Манфред &gt; &gt; начала превращать устаревшие автомобили &lt; &lt; Нимрод СПАТ &gt; &gt; в БТР и бронированные машины скорой помощи, прозванные венгерцами &lt; &lt; Леэль &gt; &gt; . &lt; &lt; Леэль &gt; &gt; оказалась выше TPz38/40 во всех отношениях с более сильными бронетранспортерами и лучшим двигателем."
 SLO_mechanized_equipment_3: "&quot; Шкода-Маваг обрнене &quot; , транспортировка по адресу: zor 40/44"
 SLO_mechanized_equipment_3_short: "OT vz. 40/44"
 SLO_mechanized_equipment_3_desc: "Когда Австрия постепенно вывела из строя танк М.40 для M.42, первый был переоборудован, одним из которых был БТР, похожий на Lehel, с снятой батареей, а внутренний корпус был перестроен для размещения отряда Панзеринфантери."

