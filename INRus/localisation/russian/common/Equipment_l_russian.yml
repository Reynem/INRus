 IRE_mechanized_equipment_1_short: "Sd.Kfz. 11"
 IRE_mechanized_equipment_1_desc: ""Sonderkraftfahrzeug 11" был разработан с 1934 по 1938 год с участием компании "Borgward AG", и с 1937 года проект стал ассоциироваться с компанией "Ganoversche Maschinenbau AG"."
 IRE_mechanized_equipment_2: "Sonderkraftfahrzeug 251"
 IRE_mechanized_equipment_2_short: "Sd.Kfz. 251"
 IRE_mechanized_equipment_2_desc: "Разработан на шасси Sd.Kfz 11, Schützenpanzerwagen Sonderkraftfahrzeug 251 полутреков (обычно именуемых \"SPW\") are built by Hannoversche Maschinenbau AG specifically to quickly transport a squad of infantrymen to the front lines with adequate armour protection from small arms fire. The truck examples are usually assigned to armour units for the purpose of helping troops stay right behind the fast moving tanks."
