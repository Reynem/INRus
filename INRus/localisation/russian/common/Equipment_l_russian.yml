 #Amphibious

 WCA_amphibious_mechanized_equipment_1: "Крыло-додж, посадочное транспортное средство, отслеживаемое, модель 2"
 WCA_amphibious_mechanized_equipment_1_short: "RD-2 LVT"
 WCA_amphibious_mechanized_equipment_1_desc: "Серия посадочных автотранспортных средств с боевыми амфибиями первоначально предназначалась исключительно для перевозки грузов с судов на берег, которые, разумеется, превратились в высокоэффективные боевые машины и машины пожарной поддержки, разработанные Дональдом Рёблингом в 1935 году, гражданской спасательной машиной."Alligator" was later developed into the RD-1, which lacked armour protection and was unreliable when used on hard terrain. The RD-2 built upon the RD-1, with that vehicles most glaring problems fixed."
 WCA_amphibious_mechanized_equipment_2: "Крыло-додж, посадочное транспортное средство, отслеживаемое, модель 4"
 WCA_amphibious_mechanized_equipment_2_short: "RD-4 LVT"
 WCA_amphibious_mechanized_equipment_2_desc: "RD-4 улучшился по отношению к RD-2, значительно увеличив грузоподъемность, хотя и за счет скорости, несмотря на усовершенствование двигателя."

 #Armoured Car
 WCA_gw_armored_car_equipment: "Белый мотор, скаутская машина, модель 2"
 WCA_gw_armored_car_equipment_short: "WM-2 Скаутская машина"
 WCA_gw_armored_car_equipment_desc: "Скаутская машина WM-2 — легко бронированная, открытая наверху и снайперская машина с четырьмя колесами, разработанная для выполнения разведывательных функций."
 WCA_armored_car_equipment_1: "Белый мотор, скаутская машина, модель 4"
 WCA_armored_car_equipment_1_short: "WM-4 Автомобиль-скаут"
 WCA_armored_car_equipment_1_desc: "Автомобиль WM-4 — это разработка WM-2, разработанная с учетом опыта, накопленного во время Гражданской войны. Спорт WM-4 несколько небольших усовершенствований, появившихся в результате военного опыта, таких, как бронированная фандера и передний ролик, и более надежный двигатель. Хотя сама концепция Scout Car получила критику за то, что она была сосредоточена на мобильности по сравнению с выживаемостью, WM-4 тем не менее была принята в эксплуатацию."
 #DHT-5 Marmon-Herrington:
 WCA_armored_car_equipment_2: "Мармон-Херрингтон, бронированная машина, модель 6"
 WCA_armored_car_equipment_2_short: "МН-6 Бронированная машина"
 WCA_armored_car_equipment_2_desc: "Бронированный автомобиль MH-6 был разработан в конце Гражданской войны в Америке, сначала известный как DHT-5, автомобиль оказался крайне непопулярным и сильно переоборудован для того, чтобы соответствовать требованиям армии. В 1942 году новый автомобиль, получивший название DHT-6, не смог проникнуть в толстые бронированные машины с 37-миллиметровым пистолетом, однако он успешно выполнял функции разведки и пехоты под названием MH-6."
 #DHT-5 Marmon-Herrington:
 WCA_armored_car_at_equipment: "Континентальная армия, бронированная машина, модель 10"
 WCA_armored_car_at_equipment_short: "CA-10 Бронированная машина"
 WCA_armored_car_at_equipment_desc: "Бронированная машина CA-10 — вариант MH-6 с 57-мм пистолетом для обеспечения надлежащей противотанковой поддержки."

