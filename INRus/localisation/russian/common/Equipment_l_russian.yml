 ### Land ###
 GYA_infantry_equipment_0: "Винтовка, короткая, журнал &lt; &lt; Ли-Энфилд Мк III &gt; &gt;"
 GYA_infantry_equipment_0_short: "SMLE Mk III"
 GYA_infantry_equipment_0_desc: "Достопочтенная винтовка Ли-Энфилд (SMLE), которая служила империи на протяжении всей Великой войны, остается стандартной рукой Доминионов после краха Империи. Количество винтовки SMLE может быть найдено в арсенале многих Доминионов. В результате серьезного нарушения производства винтовок в связи с потерей оружейных заводов Англии Доминионы обратились к старым надежным три-три-х в качестве своего стандартного оружия для выбора, пока не будут созданы или приобретены подходящие замены."
 GYA_infantry_equipment_1: "SMLE Mk V"
 GYA_infantry_equipment_1_short: "SMLE Mk V"
 GYA_infantry_equipment_1_desc: "После падения Островных островов необходимость перевооружения оставшейся империи приобрела первостепенное значение. Британские инженеры из РВСА (Королевской фабрики по производству стрелкового оружия) начали искать убежище в Онтарио для работы над существующим Ли-Энфилдом. В классической модели короткометражной винтовки показана новая и улучшенная система апертуры на стороне, а не на средней, которая позволяет улучшить радиус видимости, точность обнаружения и скорость видимости. Однако из-за высадки и механики, необходимых для изготовления винтовки, производство этого нового дизайна SMLE является относительно дорогостоящим."
 GYA_infantry_equipment_2: "Оуэн Мк 1"
 GYA_infantry_equipment_2_short: "Оуэн Машина Карбин"
 GYA_infantry_equipment_2_desc: "С перспективой войны армия обратилась с просьбой о разработке автомата для ведения боевых действий в непосредственной близости от города, особенно с учетом разрушительного характера гражданской войны в Америке. &lt; &lt; Канадская армия &gt; &gt; официально приняла оружие, разработанное молодой австралийской частной Эвелин Оуэн."Owen" machine carbine features an impressive rate of fire and a cheap cost to manufacture while also being sturdy in rough conditions - making it ideal for urban combat. Compared with other submachine guns during testing, the Owen has shown itself time and time again to be the only one to withstand mud, sand, and harsh environments. With favourable testing concluded, large quantities of the Owen were dispatched to the Dominions in preparation for the coming war."
 GYA_infantry_equipment_3: "Длинный филиал Mk 1"
 GYA_infantry_equipment_3_short: "SLR Mk 1"
 GYA_infantry_equipment_3_desc: "Коронная корпорация &lt; &lt; Смол армз лтд. &gt; &gt; в Лонг Брэнк ответила на просьбы канадского правительства о самозарядке винтовки. &lt; &lt; Самозарядная винтовка &gt; &gt; заперта в 8мм патронах Маузера и содержит болт с наклоном. &lt; &lt; В то время как пистолет &gt; &gt; страдает от проблем надежности и чрезмерной отдачи, винтовка приходит с плечевой площадкой для компенсации возврата. &lt; &lt; Легкий вес &gt; &gt; также делает его идеальным для мобильности и борьбы в городах. Многие копии были отправлены для того, чтобы вооружить Доминионов Империи в процессе подготовки к последующему приходу домой."
 GYA_night_vision: "Приемники, Табби, Перископ Мк 1"
 GYA_night_vision_short: "Сфера применения"
 GYA_night_vision_desc: "Природа Tabby является одной из самых близких секретов канадского правительства; процесс развития даже скрыт от соотечественников Контента. Случайное открытие учеными в ISAC, сфера охвата формируется в форме столовой, но содержит монокулярный инфракрасный диапазон вместе с батареей."
 GYA_infantry_weapons2: "БСА Томпсон М1926"
 GYA_infantry_weapons2_desc: "Канадская армия официально приняла культовое американское оружие, связанное с преступностью и пороком. M1928A1 является сервисным вариантом классического автомата M1921 Tompon Machine, и, хотя его производство дорого, это оружие хорошо понравилось солдатам в поле, которые высоко оценивают его эффективность и надежность. В то время как большинство вариантов полагаются на меньшее количество журналов "box", некоторые другие варианты содержат крупные и громоздкие барабанные журналы."
 GYA_improved_infantry_weapons_2: "Пистолет с помадами для ланчестеров"
 GYA_improved_infantry_weapons_2_desc: "С началом всех войн в Соединенных Штатах и грозящими облаками войны в Европе, канадская армия отчаянно нуждается в оружии для возвращения домой."
 GYA_advanced_infantry_weapons2: "Canadian Machine Carbine Mk 1"
 GYA_advanced_infantry_weapons2_desc: "В дальнейшем в сотрудничестве с компанией &quot; Small Arms Ltd &quot; в Лонг Бранч канадские военные официально приняли новый комплимент и, возможно, заменили Оуэна. &quot; Машина карбин Мк-1 &quot; имеет избирательный курок с новаторским горизонтальным журналом, чтобы выдержать грязь, пыль и песок. Давление на вершине спускового крючка полностью автоматически выстрелит оружие, а давление на дно - полуавтоматически. &quot; Машина карбин &quot; имеет более низкую скорость огня, чем Оуэн, его надежность и способность бороться с селективным огнем делают его вполне потенциальным преемником. &quot; Многие количества &quot; нашли свой путь в арсенале Доминионов &quot; ."
 GYA_infantry_at: "Гренада, винтовка, противотанковый No 68"
 GYA_infantry_at_desc: "В качестве свидетеля демонстрации противотанковой винтовочной гранаты Генри Мохаупта в Швейцарии, канадская комиссия, догадываясь, что это оружие использовало принцип заряда в форме, начала работать по своему собственному замыслу."
 GYA_infantry_at2: "Проектор, пехота, противотанковый Mk I"
 GYA_infantry_at2_desc: "С учетом необходимости ручной противотанковой установки, предназначенной для использования на фронтальных линиях, проектор, пехота, противотанковая мина Mk I (PIAT) был разработан на основе конструкции бомбардировочного миномета. С эффективным дальностью 105 метров в режиме прямого огня это устройство было хорошо популяризировано из-за отсутствия заднего кадра, хотя и высказывались опасения по поводу его интенсивного возврата."
 GYA_infantry_at2_short: "ПИАТ"
 GYA_support_weapons: "Миномет Vickers MG & Stokes"
 GYA_support_weapons_desc: "Воды, охлаждённые Викерсом МГ, и гранатомет Стоукса были стандартными вспомогательными орудиями канадской армии во время Велткрига."
 GYA_support_weapons2: "2-дюймовый миномет Lis Mk III DMS & SBML"
 GYA_support_weapons2_desc: "С помощью своего культового журнала "pan" Льюис служил Томми с самых мрачных дней первого вельткрига. С угрозой войны, которая еще близка, в варианте MKIII есть пистолет, который позволяет стрелять из плеча на любой части палубы корабля. SBML, будучи небольшим, невероятно переносной, имеет больше огневой мощи и дальности, чем большинство винтовочных гранат."
 GYA_support_weapons3: "Виккеры минометы Mk II и ML 3 дюйма"
 GYA_support_weapons3_desc: "Вариант марки II MG Vickers имеет избирательный вариант огня и хватку пистолета. Он был принят главным образом для бронированных автомобилей. ML 3 дюймовый миномет является значительным усовершенствованием со Стоукса, поскольку он является надежным и прочным для непосредственной артиллерийской поддержки."
 GYA_support_weapons4: "Виккеры Mk III и ML 4,2 дюйма минометы"
 GYA_support_weapons4_desc: "Третий вариант уважаемого пулемета &lt; &lt; Викерс &gt; &gt; был разработан для использования в зенитных целях и предусматривает несколько более высокий уровень огня со стороны его предшественников."

