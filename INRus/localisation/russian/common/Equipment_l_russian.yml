 SIK_infantry_equipment_0: "Тип 88"
 SIK_infantry_equipment_0_short: "Тип 88"
 SIK_infantry_equipment_0_desc: "Изначально как результат усилий, предпринятых в эпоху «самоукрепления» в конце Гуанксу, тип 88 был разработан в качестве близкого экземпляра немецкого Gewehr 88 с экспортными модификациями. Хотя в совокупности он ниже новых винтовок, несмотря на улучшения и часто плохое обслуживание, известно, что оружие является изогнутым и надежным, если оно не является неуправляемым. ~nnn this разновидность производится главным образом в Syning Arsenal в Цинхае, хотя нехватка оборудования и личные предпочтения часто видят, что оно используется вместе с нестандартным оружием, таким как Dadao."
 SIK_infantry_equipment_1: "Vintovka Mosina 1891 Obr.1891/1930"
 SIK_infantry_equipment_1_short: "Мосина 1891/1930"
 SIK_infantry_equipment_2: "PPSh-41"
 SIK_infantry_equipment_2_short: "PPSh-41"
 SIK_infantry_equipment_3: "Тип 35"
 SIK_infantry_equipment_3_short: "Тип 35"
 SIK_infantry_equipment_3_desc: "Тип 35 — полуавтоматическая винтовка, основанная на винтовке генерала Лю с 1914 года. &lt; &lt; Тип 35 &gt; &gt; , хотя и выглядит аналогичным образом, короче, имеет заднюю часть приемного устройства, а газопроводная система заменена простым газовым портом. &lt; &lt; Новая винтовка &gt; &gt; также не может больше переключаться на ручные действия и использовать журналы из автомата &lt; &lt; Чехемия &gt; &gt; ZH-29 и легкого пулемета ZB-26."

 SIK_artillery_equipment_1: "75-мм ханьян 13-й тип полевого оружия"
 SIK_artillery_equipment_1_short: "Тип 13"
 SIK_artillery_equipment_1_desc: "Будучи наиболее добытой артиллерией в период Бейянга, эта артиллерия служила в различных армиях центральным правительством и военными баронами по всему Китаю."

 SIK_gw_armored_car_equipment: "BA-27"
 SIK_gw_armored_car_equipment_short: "BA-27"
 SIK_armored_car_equipment_1: "БА-10"
 SIK_armored_car_equipment_1_short: "БА-10"

 SIK_motorized_equipment_1: "Citroën P21 Тип C6 "Croisière June""
 SIK_motorized_equipment_1_short: "Citroën P21"
 SIK_motorized_equipment_1_desc: "В ноябре 1931 года в Синьцзян прибыл великий Круайер Жюнь ( &quot; Йеллоу экспедиция &quot; ), организованный компанией &quot; Ситрон &quot; . &quot; Янг Ценсин &quot; , губернатор Синьцзян, был удивлен французской экспедицией по Шелковой дороге и тепло принял экспедиционную группу. &quot; Янг Цзэнсин &quot; , видя, что эти грузовики могут постоянно ездить в тяжелых условиях во время пребывания экспедиции в Синьцзяне, предложил купить партию автомобилей &quot; Ситрон П21 &quot; , и экспедиция с готовностью согласилась с этой просьбой, поскольку цель экспедиции заключалась в рекламе &quot; Ситрон &quot; . Вскоре после прибытия экспедиции в Пекин в феврале 1932 года французы отправили первую партию автозапчастей и инженеров в Синьцзян. &quot; Этот грузовик также стал наиболее распространенным грузовиком в Синьцзяне."

 ###
 ### Slovenia ###
 ###

 ### Land ###
 SLV_infantry_equipment_0: "Карабинская модель 1895/30"
 SLV_infantry_equipment_0_short: "Манлишер М.95"
 SLV_infantry_equipment_0_desc: "Mannlicher M1895 (Menterie Repetier-Gewehr M.95) — служебная винтовка вооруженных сил Австро-Венгрии во время Вельткрига, разработанная Фердинандом фон Маннлихером."back and forth\") by Austrian troops and \"Ta-Pum\" by the Italians on the receiving end. The Italian song \"Ta pum!\" from the Weltkrieg refers to this rifle. Later in the war, most rifles were converted into the short "Stutzen" ("cut-down") configuration."
 SLV_infantry_equipment_1: "Карабинская модель 1935 года"
 SLV_infantry_equipment_1_short: "FEG M.35"
 SLV_infantry_equipment_1_desc: "Вельткриг сделал недостатки M.95 слишком очевидными, особенно его относительно слабое облако и необходимое техническое обслуживание для прямого действия. Steyr разработал 8x56 мм \"Spitzer\" cartridge that would serve as the basis to a new generation of weapons and push the M.95 to its full potential. In the 1924 Rifle Trial, the Hungarian FÉG design based on the Mannlicher-Schönauer's excellent turn-bolt-action won out and was adopted."
 SLV_infantry_equipment_2: "Модель Брзострелки 1939 года"
 SLV_infantry_equipment_2_short: "Данувия М.39"
 SLV_infantry_equipment_2_desc: "Спроектировано Палом Кирали, это..."heavy\" submachine gun used specially-loaded 9x25mm ammunition in a folding magazine for transport and storage. This made it very potent and reliable compared to its contemporaries, making it reminiscent of later assault rifle designs."
 SLV_infantry_equipment_3: "Модель &quot; Строжокарабин &quot; 1942 года"
 SLV_infantry_equipment_3_short: "Збройовка Брно М.42"
 SLV_infantry_equipment_3_desc: "После того как стало ясно, что расстояние взаимодействия значительно сократилось после Вельткрига, монархия стала заинтересована в разработке промежуточной кассеты и \"machine-carbine\" idea. The Koucký brothers at Zbrojovka Brno presented their ZK 412 design using the 8x35mm \"Rapid\" cartridge with similar performance to the German 8x33mm Kurz."
 SLV_infantry_weapons2: "Модель Brzostrela 1934"
 SLV_infantry_weapons2_short: "Steyr-Solothurn M.34"
 SLV_infantry_weapons2_desc: "В то время как немецкий дизайн Louis Stange, MP 34 был в основном произведен Steyr и был принят Австро-Венгерской армией. Как и в случае с ранними автоматами, этот дизайн был тяжелым, дорогим, но надежным, с горизонтальным журналом, использующим мощный патрон 9x25 мм Mauser."
 SLV_improved_infantry_weapons_2: "Модель Брзострелки 1938 года"
 SLV_improved_infantry_weapons_2_short: "Збройовка Брно М.38"
 SLV_improved_infantry_weapons_2_desc: "С учетом необходимости в бронебойном пистолете с использованием стандартного пистолетного патрона армии монархия приняла ZK 383, разработанный братьями Йозефом и Франтишем Коуки в Збройовке Брно, в качестве MP 38. Использование горизонтального журнала, такого как MP 34, известно, что ZK 383 имеет легкую биподу, позволяющую использовать его в качестве запасного автомата. Позднее модели были значительно упрощены для более дешевого и более быстрого производства наряду с вертикально сложенным журналом, как Danuvia SMGs."
 SLV_advanced_infantry_weapons2: "Модель Брзострелки 1943 года"
 SLV_advanced_infantry_weapons2_short: "Данувия М.43"
 SLV_advanced_infantry_weapons2_desc: "В то время как журнал Danuvia 39M оказался успешным, его сворачивания было недостаточно для компенсации его громоздкого дизайна для матросов. 43M перепроектировался с откидным металлическим материалом и новым, более надежным дизайном журнала, что позволило ему быть гораздо более компактным во время перевозки или хранения без жертв огневой мощи."

