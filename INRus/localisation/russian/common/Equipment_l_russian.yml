 CHI_infantry_equipment_0: "MinGan Тип 88"
 CHI_infantry_equipment_0_short: "MinGan Тип 88"
 CHI_infantry_equipment_0_desc: "Изначально в результате усилий «Самоукрепляющейся» эпохи Гуангсу, тип 88 был разработан в качестве близкого экземпляра немецкого Gewehr 88 с экспортными модификациями. Хотя в совокупности это оружие ниже новых винтовок, несмотря на улучшения и часто плохое обслуживание, известно, что оружие является изогнутым и надежным, если оно является неуправляемым. ~nnn this разновидность производится в небольших мастерских Минганской повстанческой зоны, хотя нехватка оборудования и личные предпочтения часто видят, что оно используется вместе с широким разнообразием других видов оружия, таких как Daodao."
 CHI_infantry_equipment_1: "Тип 24"
 CHI_infantry_equipment_1_short: "Тип 24 &quot; Хуадонг &quot;"
 CHI_infantry_equipment_1_desc: "В 1935 году эта винтовка была доставлена на службу Qing с помощью германской помощи после восстановления. Функционально это оружие является почти копией немецкого Mauzer M1924, и значительно лучше, чем гораздо более старый тип 88 с точки зрения веса и оттока. ~nnnnFirst, произведенный в арсенале Ханьяна с немецкими инструментами, методы изготовления уже распространились на районы, удерживаемые KMT, хотя он может не полностью заменить своих предшественников в течение некоторого времени."
 CHI_infantry_equipment_2: "MAS-38"
 CHI_infantry_equipment_2_short: "MAS-38"
 CHI_infantry_equipment_2_desc: "После окончания «Велткриг» в «Службе вооружений» была осуществлена программа разработки стрелкового оружия. С помощью MAS (оружие, оружейная индустрия, 38-й MAS — это первое оружие Франции, которое является исключительно высококачественным оружием. «MAS 38» содержит 650 выстрелов в минуту, хотя его появление довольно странно, учитывая его необычную схему. ~nnn internationale поддерживает революцию в Китае, тысячи копий доставлены в националистское правительство, где оно быстро стало любимым для боевых действий в районах с высокой плотностью населения."
 CHI_infantry_equipment_3: "Чжуншан Синьхай типа 30"
 CHI_infantry_equipment_3_short: "Чжуншан типа 30"
 CHI_infantry_equipment_3_desc: "Тип 30 — полуавтоматическая винтовка, основанная на винтовке генерала Лю с 1914 года, названная винтовкой типа 30 в честь 30-го года Китайской Республики."

 CHI_infantry_weapons2: "RSC 1938 Carbine"
 CHI_infantry_weapons2_desc: "RSC (Fusil Automatique Model) — полуавтоматическая винтовка. В то время как более ранние варианты были длинными и ограниченными подвижностью, версия карбины позволяет больше двигаться на поле боя. Эта версия 1938 года содержит множество изменений для ее предшественников, таких как более простое производство, захват и чистка винтовки."
 CHI_improved_infantry_weapons_2: "MAS-36 LG39"
 CHI_improved_infantry_weapons_2_desc: "Этот вариант MAS-36 оснащен сложенным полым алюминиевым запасом и укрепленным стволом, который также может использоваться для запуска гранат, когда он попадает с 48-мм гранатометом."
 CHI_advanced_infantry_weapons2: "Модель CEAM 1944 года"
 CHI_advanced_infantry_weapons2_desc: "Секретный дизайн, скопированный с немецкой линии штурмовых винтовок, CEAM Modele 1944 является одним из первых штурмовых винтовок Интернационала."

 CHI_support_weapons: "FM Chauchat & Brandt Mle 27/31"
 CHI_support_weapons_desc: "Проверенные и испытанные в траншеях Велткрига, чаушат долгое время ненавидел французский пехотный человек. Однако, несмотря на ненависть к этому оружию, когда оно не застряло в грязи и грязи, пистолет достаточно надёжен для контроля, и чаушат может быть также выпущен из бедра. Брэндтский миномет - это реликт из Вельткрига, усовершенствованный британский окоп. Простое и эффективное оружие, миномет можно разобрать на три части, и для оказания помощи НРА требуется команда из десяти человек."
 CHI_support_weapons2: "2-дюймовый миномет Lis Mk III DMS & SBML"
 CHI_support_weapons2_desc: "С помощью своего культового журнала «pan» Льюис служит Томми с самых мрачных дней первого веткрига. С угрозой войны, которая еще близка, в варианте MKIII есть пистолет, который позволяет стрелять из плеча на любой части палубы корабля. SBML, будучи небольшим, невероятно переносной и имеет большую огневую мощь и дальность, чем большинство винтовочных гранат. ~nThanbel to British Assistance, избыток легких пулеметов Льюиса прибыл в Китай, где он довольно популярен среди пехотников НРА."
 CHI_support_weapons3: "& Brandt Mle 35/38"
 CHI_support_weapons3_desc: "В то время как в "Чателлерауте" имеется низкое количество огня, оно является надежным и надежным оружием, хорошо известным французским войскам за его последовательность и вес. "Брендт Мле 35" представляет собой 60-ммм миномет, который используется пехотными ротами для непрямого огня. Просто и эффективно, для его функционирования требуется только экипаж из пяти человек. Поскольку большинство единиц оружия импортируется из иностранных государств, "Чателлерват" и "Брендт Мле" 35/38 представляют собой некоторые из новых моделей ведения войны, которые подвергаются испытанию и испытанию на европейских полях боя и в ходе гражданской войны в Америке."
 CHI_support_weapons4: "Миномет Enfield-Automatic Mk IIIB и ML 3 дюйма"
 CHI_support_weapons4_desc: "Enfield-Automatic Mk IIIB является еще одним созданием RSAF, которые искали замену Vickers и Lwis. Enfield-Automatic едят, что снижает скорость огня, но предотвращает перегрев. Это оружие гораздо легче, чем автоматы с поясом. Enfield Automatic импортируется из Союза Великобритании в НРА. ML 3-дюймовый миномет может обеспечивать эффективную оперативную артиллерийскую поддержку при переносе."

 CHI_infantry_at: "Винтовки против танки"
 CHI_infantry_at_desc: "Винтовка «Бойцы против танки» часто называлась «Оружие элефанта» из-за ее размеров и больших скульптур, и винтовка «Бойцы против танки» может стрелять из 60 г противотанкового зенитного снаряда на высоте 747 м/с. Однако, несмотря на слайд оттока оружия и резиновую обмоченную задницу, отдача от оружия, как утверждается, была болезненной, что часто вызывало шею и синяки на плечах."
 CHI_infantry_at2: "Противоугонное устройство MK2"
 CHI_infantry_at2_desc: "Одним из самых новых комплектов комплектов, разработанных станцией IX, является противоагрессивное устройство MK2. С эффективным огневым дальностью 115 ярдов MK2 сможет вырубить и проткнуть самые тяжелые из вражеских танков международного сообщества. С ростом механизации войны в Азии НРА импортировала несколько конструкций британского MK2 для улучшения своих обычных противотанковых возможностей."

 CHI_night_vision: "Глаз кошки"
 CHI_night_vision_desc: "Тьма всегда была одним из величайших врагов человечества. Последние события на станции IX изменили это, создав сверхсекретный инфракрасный круг ночного видения."Cat's Eye," the device allows for reconnaissance and operations under cover of darkness.\n\nWith the future of warfare ever developing, the NRA has imported such designs from their British comrades to create the next generation of the Chinese soldier."

