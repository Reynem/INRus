 HNN_infantry_equipment_0: "Гуандун типа 88"
 HNN_infantry_equipment_0_short: "Гуандун типа 88"
 HNN_infantry_equipment_0_desc: "Изначально в результате усилий «Самоукрепляющейся» эпохи Гуангсу, тип 88 был разработан в качестве близкого экземпляра немецкого Gewehr 88 с экспортными модификациями. В то время как в совокупности он был ниже новых винтовок, несмотря на улучшения, и часто плохо обслуживался, известно, что оружие было изогнутым и надежным, если оно было неуправляемым. ~nn this разновидность производится главным образом в Гуандонг-Арсенале, хотя нехватка оборудования и личные предпочтения часто видят его применение наряду с нестандартным оружием, таким как Миаодао."
 HNN_infantry_equipment_1: "Гуандун типа 27"
 HNN_infantry_equipment_1_short: "Гуандун типа 27"
 HNN_infantry_equipment_1_desc: "Эта винтовка первоначально называлась «Тип 27» и была поставлена на службу Qing в 1935 году благодаря германской помощи после восстановления. В функциональном плане это оружие является почти копией немецкого Mauzer M1924 и значительным улучшением по сравнению с более старым типом 88 с точки зрения веса и оттока. ~nnnnFirst, произведенный в арсенале Ханьяна с немецкими инструментами, методы изготовления уже распространились на Гуандун, хотя он может не полностью заменить своих предшественников в течение некоторого времени."
 HNN_infantry_equipment_2: "Tsingtao MP18"
 HNN_infantry_equipment_2_short: "Tsingtao MP18"
 HNN_infantry_equipment_2_desc: "Благодаря наводнению в начале 1920-х годов избытка Велткрига на мировом рынке, MP18 увидела действия в Китае незадолго до того, как модифицированная версия начала производство в Тсингтао. / n/n/С изменениями в журнале и запасах, этот конкретный продукт китайско-германского сотрудничества был копирован и продан по всему Северному и Южному Китаю, хотя в первую очередь правительству Цинга."
 HNN_infantry_equipment_3: "Гуандун типа 33"
 HNN_infantry_equipment_3_short: "Гуандун типа 33"
 HNN_infantry_equipment_3_desc: "Тип 33 — полуавтоматическая винтовка, основанная на винтовке генерала Лю с 1914 года. &lt; &lt; Тип 33 &gt; &gt; , хотя и выглядит аналогичным образом, короче, имеет заднюю часть приемного устройства, а газопроводная система заменена простым газовым портом. &lt; &lt; Новая винтовка &gt; &gt; также не может больше переключаться на ручные действия и использовать журналы из автомата &lt; &lt; Чехемия &gt; &gt; ZH-29 и легкого пулемета ZB-26."

