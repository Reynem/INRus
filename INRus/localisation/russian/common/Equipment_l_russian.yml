 # Trains
 #SRS 260: built by Hanomag & Baldwin Locomotive Works; importerd 1928-1929
 SIA_train_equipment_1: "RSR 260 &lt; &lt; Ханомаг &gt; &gt;"
 SIA_train_equipment_1_short: "RSR 260"
 SIA_train_equipment_1_desc: "В 1928-1929 годах Королевская государственная железная дорога Сиама (RSR 260) была построена компанией &quot; Ханомаг &quot; в составе 4-6-2 локомотива. &quot; РСО 260 &quot; , которая заменила собой уже существующие &quot; Е-классы &quot; , созданные в период 1915-1921 годов, служит новой рабочей лошадью расширяющейся железнодорожной сети в Сиаме как для скоростных, так и для смешанных транспортных поездов."
 #JGR DX50: First Batch 1936-1945, 2nd Batch (CX50) 1942-1943 to replace Hanomags
 SIA_train_equipment_2: "RSR 350 Микадо"
 SIA_train_equipment_2_short: "RSR 350"
 SIA_train_equipment_2_desc: "Эти локомотивы, которые были импортированы из Японии, были первым классом 2-8-2 (Микадо), который стал успешным в Сиамской службе. &quot; РСО &quot; впоследствии заказала больше стандартных локомотивов &quot; Микадо &quot; для удовлетворения железнодорожных и военных потребностей."
 #JGR DX50 but armoured: Fictional
 SIA_train_equipment_3: "RSR 350 Микадо Хоркор."
 SIA_train_equipment_3_short: "RSR 350 Хоркор."
 SIA_train_equipment_3_desc: "По мере того как на железные дороги начали нападать вражеские самолеты, новые локомотивы, которые будут работать на фронтах, должны иметь возможность наносить удары с 20-мм пушек."

