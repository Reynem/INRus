 #M1 sniperscope:
 APG_night_vision: "Инфракрасный снайперскоп, модель 1943 года"
 APG_night_vision_short: "M1943 Снайперскоп"
 APG_night_vision_desc: "Разработанный специально для Auto-Carbine M1942A2, который имел специальные установки на приемнике различных моделей инфракрасных приборов ночного видения, снайперскоп M1943 является первым инфракрасным снайперским телескопом, используемым для общего использования Армией США. В то время как M1943 имеет свои недостатки, как плохой диапазон и легко поврежденный инфракрасный эмиттер, M1 все еще имеет огромное значение, когда он используется правильно."
 #M3 sniperscope:
 APG_night_vision2: "Инфракрасный снайперскоп, модель 1946 года"
 APG_night_vision2_short: "M1946 Снайперскоп"
 APG_night_vision2_desc: "В связи с неудовлетворительным приемом снайперскопа M1943 был принят снайперскоп M1946, который почти в два раза превышает фактический диапазон М1943, более надежный инфракрасный источник света, а также маяк T23, M1946 представляет собой значительное улучшение по сравнению с его предшественником, хотя некоторые солдаты жалуются на то, что источник света кровоточит в видимом спектре и тем самым отменяет свое положение."

