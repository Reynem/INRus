 # Historical
 SIA_infantry_equipment_0: "Puen Lek Yao Тип 46/66 Siamese Mauser"
 SIA_infantry_equipment_0_short: "PorLorYor.46/66"
 SIA_infantry_equipment_0_desc: "Тип 46/66 представляет собой уникальную винтовку, помещенную в Siamse 8x52mm Rimmed Cartridge, которая по существу включает гибридный Mauzer 96 & 98 в тело, вдохновленный как Маузером, так и Арисакой. Тип 46 был основным вооружением Сиамских сил во время Велткрига."
 # Historical
 SIA_infantry_equipment_1: "Puen Lek Yao Тип 66 Siamese Mauser"
 SIA_infantry_equipment_1_short: "PorLorYor.66"
 SIA_infantry_equipment_1_desc: "Хотя, строго говоря, не Маузер, тип 66 — это модернизированный японский экспорт типа 38 с действием, аналогичным тому, которое было обнаружено на старом сиамском типе 46."
 # Bohemian ZK-383 SMG
 SIA_infantry_equipment_2: "Puen Kol Muea Type 84 Siamese Sunmachine"
 SIA_infantry_equipment_2_short: "PorKorMor.84"
 SIA_infantry_equipment_2_desc: "Тип 84 — это сиамская лицензия, выпущенная в качестве варианта бохемского автомата ZK-383 в 9×19мм парабеллуме. Тип 84 был принят после решения Сиама о постепенном прекращении стареющего MP-18; он был выбран как потому, что он делил 9x19м котлет с MP-18, так и для его надежности в условиях джунглей."
 # Fictional
 SIA_infantry_equipment_3: "Пуэн Лек Яо Бунчуу-эн Тип 87 Полуавтоматическая винтовка"
 SIA_infantry_equipment_3_short: "PorLorYorBor.87"
 SIA_infantry_equipment_3_desc: "Вдохновлённая ранее успешным проектом SMG типа 84 (ZK-383) и LMG типа 66 (Madsen) на местах, местная проектная группа, возглавляемая генерал-майором Вичяном Сутантаноном, смогла успешно разработать первый местный дизайн полуавтоматической винтовки, хотя первые прототипы оказались проблематичными из-за отсутствия фактического технического ноу-хау, к моменту его принятия оружие хорошо понравилось всем войскам, которым оно было выдано."
