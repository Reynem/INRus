 ### Two Sicilies ###
 ###

 ### Land ###
 SIC_infantry_equipment_0: "Carcano Modello 1891"
 SIC_infantry_equipment_0_short: "Carcano M91"
 SIC_infantry_equipment_0_desc: "Carcan M91 — стандартная винтовка итальянских вооруженных сил во время Велткрига и Гражданской войны в Италии."
 #Mauser Standardmodell :
 SIC_infantry_equipment_1: "Карабинер 98b"
 SIC_infantry_equipment_1_short: "Маузер Кар. 98b"
 SIC_infantry_equipment_1_desc: "Вельткриг из первых рук показал, что полноразмерные винтовки были неуправляемыми в окопах с малой пользой. Немецкие знаменитые штурмовые войска получили короче Кар. 98AZ, когда это было возможно, и вскоре после войны было принято решение стандартизировать винтовку с длиной карбины для замены G.98. Карб, основанный на модели AZ, мало отличался от своего непосредственного предшественника, но более существенно отличался от более длинного G.98, с улучшенными достопримечательностями и свернутым болтом. Что еще более важно, он использовал больше частей длинной винтовки для увеличения взаимозаменяемости частей и снижения производственных издержек. В рамках сотрудничества Сицилий и Германии в ответ на красную угрозу севера большое количество 98b было отправлено в Сицилию."
 SIC_infantry_equipment_2: "МСП М38"
 SIC_infantry_equipment_2_short: "МСП М38"
 SIC_infantry_equipment_2_desc: "После отказа от полуавтоматической винтовки 1938 года компания &quot; CZ &quot; попыталась продать этот дизайн различным зарубежным странам. &quot; Две сицилии &quot; провели испытания винтовки, и, как и австрийцы, обнаружили, что эта винтовка ненадежна в тяжелых условиях и ее трудно разобрать, но попыталась переоборудовать пистолет, чтобы устранить ее недостатки. &quot; P МСП &quot; , которая приступила к производству и проектированию стрелкового оружия всего лишь несколько лет назад, была поставлена перед этой задачей. &quot; конечный результат &quot; , назначив &quot; МСП М38 &quot; после принятия, хотя и был усовершенствован по сравнению с чешским предшественником, все еще несет на себе многие из проектных причуд &quot; ."
 SIC_infantry_equipment_3: "Selbstladegewehr Modell 40"
 SIC_infantry_equipment_3_short: "S.G. 40"
 SIC_infantry_equipment_3_desc: "Компания Mauser в ответ на желание немецкой армии самозарядить винтовку с резервным болтом, Selbstladegeweehr 40 представляет собой огромный скачок вперед в разработке немецкого стрелкового оружия. Хотя первоначальные прототипы были очень неточными, тяжелыми и склонными к глушению, немецкий Heer в конечном итоге снял некоторые другие конкретные требования к винтовке. В результате был впервые подготовлен прототип с несколькими проектными редактированиями, и он оказался эффективным. В ответ на растущую напряженность на итальянском полуострове большое количество этих винтовок было отправлено в Сицилианские вооруженные силы."

