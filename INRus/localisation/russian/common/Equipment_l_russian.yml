 MEX_infantry_equipment_0: "Модели Маузера 1902 года"
 MEX_infantry_equipment_0_short: "Mauser M02"
 MEX_infantry_equipment_0_desc: "Модель Mauser 1902 является одним из нескольких винтовок Mauser, находящихся в эксплуатации у мексиканских военных, но в настоящее время является наиболее распространенным. В 7x57 мм модель 1902 года является весьма модифицированной испанской моделью 1893 Mauser, объединяющей несколько частей и конструктивных элементов из более поздней модели Mauser 1898 года. Модель 1902 года, которая была куплена в больших количествах у немецкой компании DWM, практически идентична внутренней модели 1910 года."
 MEX_infantry_equipment_1: "Mondragon Modelo 1929"
 MEX_infantry_equipment_1_short: "Мондрагон М29"
 MEX_infantry_equipment_1_desc: "Революционная модель Мондрагона 1908 года была одной из первых полуавтоматизированных винтовок, которые даже служили в немецком Luftstreitkräfte во время Weltkrieg. Несмотря на свою эффективность, Mondragon всегда страдал от проблем надежности, и его производство стоит дорого. Модель 1929 года — это модернизированная и более легкая версия оригинального Mondragon."
 MEX_infantry_equipment_2: "Модель 1935 года"
 MEX_infantry_equipment_2_short: "ЭМП Модель 1935 года"
 MEX_infantry_equipment_3: "Mendoza Fusil de Asaulto Model 1943"
 MEX_infantry_equipment_3_short: "Мендоса FA-M43"
 MEX_infantry_equipment_3_desc: "Fusil de Asaulto Model 1943 — последний дизайн социалистического оружейного мастера Рафаэля Мендозы, который был снят с автоматических винтовок в уникальной сокращенной производной стандартной мексиканской гильзы Маузера калибра 7×57 мм."
