 #Infantry Equip

 FNG_infantry_equipment_0: "Шэньян типа 38"
 FNG_infantry_equipment_0_short: "Тип 38"
 FNG_infantry_equipment_0_desc: "Благодаря дизайнам и машинам, предоставленным Японией в начале 1920-х годов, &quot; Шэньян арсенал &quot; выпустил постоянный поток несколько модифицированных копий винтовки типа 38 &quot; Арисака &quot; ."
 FNG_infantry_equipment_1: "Винтовка типа 24 &lt; &lt; Дашуай &gt; &gt;"
 FNG_infantry_equipment_1_short: "Тип 24"
 FNG_infantry_equipment_1_desc: "Dashuai Type 24, названный для «старого маршала» Чжана Зуолина и пронумерованный в соответствии с республиканским календарем, функционально является копией японского Arisaka Type 99. Были внесены незначительные изменения, чтобы разместить более дешевый и более распространенный штык Маузера S84/98 III, и это оружие было оценено войсками за его повышенную остановку и высокое качество."
 FNG_infantry_equipment_2: "Кавамура типа 14"
 FNG_infantry_equipment_2_short: "Тип 14"
 FNG_infantry_equipment_2_desc: "В 1931 году японская армия подошла к Киджиро Намбу для разработки новой полуавтоматической винтовки. Его проект, основанный на винтовке &quot; Педерсен &quot; , которая была безуспешно представлена Японии несколько лет назад, в конечном счете нигде не привел ни к каким последствиям как из-за трудностей с системой запоздалого обратного замка &quot; Педерсен &quot; , так и из-за нереалистичных целей армии. Однако несколько лет спустя две усовершенствованные винтовки, основанные на системе &quot; Педерсен &quot; , вновь всплывут на поверхность. &quot; Масайя Кавамура &quot; из специальной стальной компании &quot; Ниппон &quot; , в конечном итоге будут выбраны и приняты Японией в качестве 14-го типа в силу ее надежности и способности функционировать без необходимости вощенных кассет."
 FNG_infantry_equipment_3: "Йокосука типа 4"
 FNG_infantry_equipment_3_short: "Тип 4"
 FNG_infantry_at: "Тип 97 Антитанковая винтовка"
 FNG_infantry_at2: "Тип 4 Безоткатные винтовки"
