 APG_motorized_rocket_equipment_desc: "Грузовик FWD с установленной ракетой-носителем M1941A6, GRLFWD обычно называют "девушкой"."
 APG_motorized_rocket_equipment_1: "&lt; &lt; Форд государственного управления &gt; &gt; , ракетоноситель, FWD"
