 #Infantry Equip

 GER_infantry_equipment_0: "Gewehr Modell 98"
 GER_infantry_equipment_0_short: "Маузер Г. 98"
 GER_infantry_equipment_0_desc: "Gewehr 98 (Rifle 98) был стандартным немецким пехотным оружием Велткрига. Это хороший пример типа военной винтовки, разработанной около конца XIX и XX веков, когда разработка винтовки достигла лихорадочного уровня. Как и другие вооруженные силы, немецкая пехота носила винтовку полной длины, тогда как другие войска были выпущены с короткими карабинами. Система болтов и журналов Gewehr 98 была разработана компанией Mauser, хотя эта винтовка была изготовлена по лицензии ряда других коммерческих производителей."
 #Mauser Standardmodell :
 GER_infantry_equipment_1: "Карабинер Modell 98 Ausführung B"
 GER_infantry_equipment_1_short: "Маузер Кар. 98b"
 GER_infantry_equipment_1_desc: "Вельткриг из первых рук показал, что полноразмерные винтовки были неуправляемыми в окопах с малой пользой. Немецкие знаменитые штурмовые войска получили короче Кар. 98AZ, когда это было возможно, и вскоре после войны было принято решение стандартизировать винтовку с длиной карбины для замены G.98. Карб, основанный на модели AZ, мало отличался от своего непосредственного предшественника, но более существенно отличался от более длинного G. 98, с улучшенными достопримечательностями и свернутым болтом. Что более важно, он использовал больше частей длинной винтовки для увеличения взаимозаменяемости деталей и снижения производственных издержек."
 GER_infantry_equipment_2: "Selbstladegewehr Modell 40"
 GER_infantry_equipment_2_short: "S.G. 40"
 GER_infantry_equipment_2_desc: "Разработанный компанией Mauser в ответ на желание немецкой армии самозарядить винтовку с резервным болтом, Selbstladegeweehr 40 представляет собой огромный скачок вперед в разработке немецкого стрелкового оружия. Хотя первоначальные прототипы были очень неточными, тяжелыми и склонными к глушению, Heer в конечном итоге уронил некоторые из своих других конкретных требований к винтовке. Конечным результатом стал первоначальный прототип с лишь несколькими проектными редактированиями, и он оказался эффективным."
 GER_infantry_equipment_3: "Macchinenkarabiner Modelle 42"
 GER_infantry_equipment_3_short: "М.К. 42"
 GER_infantry_equipment_3_desc: "Машиненкарабинер 42 — это революционный проект, разработанный для нового промежуточного гильза, разработанного известным немецким дизайнером оружия Хьюго Шмейсером совместно с компанией &lt; &lt; Хэйнель &gt; &gt; . В то время как первый прототип винтовки был подвержен глушению, как военные, так и даже сам Кайзер были чрезвычайно воодушевлены проектом, и огромные ресурсы были сосредоточены на совершенствовании дизайна, а винтовка была готова к принятию в 1942 году."
 #G33/40:
 GER_infantry_weapons2: "Gewehr Modell 98/38"
 GER_infantry_weapons2_short: "G. 98/38"
 GER_infantry_weapons2_desc: "Gewehr 98/38, также известный как G. 98/38, является винтовкой, которая иногда считается карбиной и в значительной степени основана на Gewehr 98. Эта винтовка довольно коротка, всего лишь на одном метре. Первоначально предназначенная для горных войск, G. 98/38 была вскоре принята другими немецкими войсками, включая некоторые кавалерии и пехотные полки."
 GER_improved_infantry_weapons_2: "Macchinenpistole Modelle 40"
 GER_improved_infantry_weapons_2_short: "М.П. 40"
 GER_improved_infantry_weapons_2_desc: "M.P. 40, иногда ошибочно называемый "Schmeisser", был разработан Генрихом Волльмером и основан на M.P. 38 с целью оснащения немецких солдат боевым оружием. Он использует журналы с 32 патронами калибра 9 мм, а его эффективная дальность составляет около 100-150 метров. Это очень надежное и особенно экономичное оружие для изготовления, обычно используемое офицерами, механизированными пехотицами и десантниками."
 #StG 44:
 GER_advanced_infantry_weapons2: "Macchinenkarabiner Modell 44"
 GER_advanced_infantry_weapons2_short: "М.К. 44 "Штурмгеур""
 GER_advanced_infantry_weapons2_desc: "Машиненкарабинер 44 является результатом того, что немцы должны предоставить пехотицам бóльшую огневую мощь из своих винтовок. В результате непрерывного развития М.К. 42 М.К. 44 не имеет многих недостатков предыдущего дизайна и даже иногда называются штурмовиной. Окончательный дизайн имеет более короткий диапазон, чем современные винтовки, из-за немецких исследований, что бой в европейской войне проходит на расстоянии менее 300 метров. При жертве дальности огневая мощь близкого радиуса была значительно улучшена."
 #Panzerfaust - whole line, don't add numbers:
 GER_infantry_at: "Панзерабверрохр"
 GER_infantry_at_short: "П.Р."
 GER_infantry_at_desc: "Panzerabwehrrohr является мозговым ребёнком д-ра Генриха Лэнгвайлера в ответ на срочную потребность в легком одноразовом пехотном оружии, которым пехота могла бы использовать для борьбы с растущим числом вражеских тяжелых и средних танков, которые часто являются подавляющими немецкими оборонами."
 #Panzerschreck:
 GER_infantry_at2: "Ракетенпанцербюче 54"
 GER_infantry_at2_short: "R.Pz.B. 54 "Panzerschreck""
 GER_infantry_at2_desc: "54 противотанковых противотанковых ракетных пусковых установки с плечевой связью под названием "Ofenrohr" и более популярный "Panzerschreck" ("Tank's Fright") — легкое пехотное оружие, разработанное для немецких вооруженных сил, вдохновленное слухами об американских ракетных пусковых установках. В идеальных условиях R.Pz.B. 54 может проникнуть в бронежилеты тяжелых танков с помощью своих 8,8-центиметровых ракет, уже используемых 43-ракетными пусковыми установками Raketenwerfer. В качестве отталкивания R.Pz.B. 54 выпускает много дыма при стрельбе."
 GER_support_weapons: "Maschinengewehr M.08/15 & 7,58-cm Leichter Minenwerfer"
 GER_support_weapons_short: "M.G. 08/15 и 7,58-см."
 GER_support_weapons_desc: "Вельткриг увидел, как было введено самое смертоносное оружие, известное человеку, как, например, устрашающий M.G. Model 08/15. В непосредственной близости от траншей войны, когда-то архаический миномет был возвращен в актуальность. Теперь, когда мы видим, что за нами наблюдают такие враги, как коммуна Франции, это оружие из Вельткрига снова будет доставлено в эксплуатацию."
 GER_support_weapons2: "Maschinengewehr M.34 & 8-см шверер Гранатверфер М.34"
 GER_support_weapons2_short: "M.G. 34 и 8-см S.G.W. 34"
 GER_support_weapons2_desc: "Maschinengewehr Model 34 (M.G. 34) — пулемет с воздушным охлаждением, смонтированный в мощном пулемете калибра 7,92x57-мм пулемётный патрон Маузера с высокой скоростью огня (900 RPM) и эффективной мобильностью, который, по всей видимости, является самым передовым пулеметом в мире; свидетельством силы Кайзеррейха. 8-см верджер Гранатверфер Модель 34 является пехотным минометом, использующим 8-см снаряды."
 #MG 39Rh and 20-cm leLdgW :
 GER_support_weapons3: "Maschinengewehr M.39 & 20-см лейхтер Ladungswerfer M.40"
 GER_support_weapons3_short: "М.Г. 39 и 20 см le.Ldg.W. 40"
 GER_support_weapons3_desc: "34. Машиненгеверская модель 39 (M.G. 39) была улучшена по сравнению с M.G. 34. Этот поясный пулемет имеет высокую скорость огня и был приспособлен для всех целей. 20-см Leichter Ladungswerfer Model 40 был минометом, предназначенным для нанесения ударов по препятствиям и сильным точкам."
 GER_support_weapons4: "Maschinengewehr M.42 & Kurzer 8-см Гранатверфер М.42"
 GER_support_weapons4_short: "M.G. 42 & Kz. 8-см G.W. 42"
 GER_support_weapons4_desc: "Ник назвал имя"Kaiser's Buzzsaw" given its incredibly high rate of fire at 1,200 rounds per minute, the M.G. 42 was the most effective support weapon of its time. Designed to be low cost and easy to build, the MG-42 proved to be highly reliable and easy to operate. It ws most notable for its very high cyclic rate for a gun using full power catridges and was adopted for both light machine gun fire roles and medium machine gun fire roles."
 GER_night_vision: "Зилгерат 1229"
 GER_night_vision_short: "З.Г. 1229 "Вампир""
 GER_night_vision_desc: "Z.G. 1229, также известный в своем кодовом названии "Vamпир", является активным инфракрасным устройством, разработанным для винтовки M.Kb. 44. Вампир весит 2,25 килограмма и был оснащен выступами на M.Kb. 44 на заводе по производству оружия C.G. Heenel в Суле. Кроме того, на экране и в инфракрасном свете имеется деревянная батарея весом 13,5 килограмма для освещения, а также вторая батарея, установленная внутри газового баллона для питания преобразователя изображения. 1229 гренадиер, на борту которого находится Z.G., известен как нахтджагер (ночной охотник)."
 #Modified ZG 1229:
 GER_night_vision2: "Nachtzielgerät Modell 45"
 GER_night_vision2_short: "Н.З.Г. 45"
 GER_night_vision2_desc: "Н.З.Г. 45, обновленная серийная модель З.Г. 1229, очень близка к своему предшественнику, но почти в два раза превышает его реальный диапазон с менее неуязвимым IR-источником света. &quot; З.Г. &quot; 1229, находящийся в эксплуатации, Н.З.Г. 45 по-прежнему критикуется солдатами за ее тяжелые батареи и трудное техническое обслуживание."

