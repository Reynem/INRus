 ITA_train_equipment_1: "ПС Группо 740"
 ITA_train_equipment_1_short: "ПС Гр. 740"
 ITA_train_equipment_1_desc: "Созданная Адриатическими железными дорогами незадолго до национализации железных дорог в 1905 году, Группа 740 является серией «укрепленных» локомотивов класса."
 ITA_train_equipment_2: "ПС Группо 480"
 ITA_train_equipment_2_short: "ПС Гр. 480"
 ITA_train_equipment_2_desc: "Эволюция австрийского дизайна для довоенного класса Südbahn 580, 480 Group — это серия локомотивов класса "Декапод", спроектированных с тяжелым обслуживанием на линии Бреннер в направлении Центральной Европы. Хотя их более высокая нагрузка на ось по сравнению с их предшественниками затрудняет их работу на более старых линиях, различные усовершенствования, такие, как клапанный механизм Caprotti, делают их и более мощными, и дешевыми для работы."
