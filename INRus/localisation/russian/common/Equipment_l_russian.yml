 #Infantry Equip

 JAP_infantry_equipment_0: "Арисака типа 38"
 JAP_infantry_equipment_0_short: "Тип 38"
 JAP_infantry_equipment_0_desc: "Принята Имперской японской армией в 1905 году, 38-й год периода Мэйдзи (далее его название); в Типе 38 используются патроны Аризаки калибра 6,5x50 мм. При выстреле этот патрон производит мало оттока. Тип 38 на 128 см является длинной винтовкой из-за акцента на тренировке японских солдат этой эпохи."
 JAP_infantry_equipment_1: "Арисака типа 99"
 JAP_infantry_equipment_1_short: "Тип 99"
 JAP_infantry_equipment_1_desc: "Имперская армия признала слабость модели 38 и заставила ее заменить. Тип 99 был изготовлен в четырех вариантах: регулярно выпускаемой винтовки, «длинной» винтовки, паратропической винтовки и снайперской версии."
 JAP_infantry_equipment_2: "Кавамура типа 14"
 JAP_infantry_equipment_2_short: "Тип 14"
 JAP_infantry_equipment_2_desc: "В 1931 году японская армия подошла к Киджиро Намбу для разработки новой полуавтоматической винтовки. Его проект, основанный на винтовке &quot; Педерсен &quot; , которая была безуспешно представлена Японии несколько лет назад, в конечном счете нигде не привел ни к каким последствиям как из-за трудностей с системой запоздалого обратного замка &quot; Педерсен &quot; , так и из-за нереалистичных целей армии. Однако несколько лет спустя две усовершенствованные винтовки, основанные на системе &quot; Педерсен &quot; , вновь всплывут на поверхность. &quot; Масайя Кавамура &quot; из специальной стальной компании &quot; Ниппон &quot; , в конечном итоге будут выбраны и приняты Японией в качестве 14-го типа в силу ее надежности и способности функционировать без необходимости вощенных кассет."
 JAP_infantry_equipment_3: "Йокосука типа 4"
 JAP_infantry_equipment_3_short: "Тип 4"
 JAP_infantry_equipment_3_desc: "Япония уже давно полагается на болтные винтовки, и их возраст начинает проявляться. Таким образом, Имперская армия в военно-морском флоте Йокосука разработала полуавтоматическую винтовку типа 4. Заряженная двумя пятикамерными стриптизершными клипами, модель 4 состоит из двух вариантов: военно-морского флота и другого для армии. Разработка этого оружия позволила бы японскому пехотинцу значительно больше огневой мощи на поле боя, чем предыдущие вооружения."
 JAP_infantry_at: "Тип 97 Антитанковая винтовка"
 JAP_infantry_at_desc: "С учетом того, что немецкие танки существуют в Китае, а также постоянной угрозы российского медведя на границах, тип 97 предназначен для борьбы с бронетранспортерами, ружье представляет собой чудовище оружия, имеет общую длину 2,09 метра и весит 52 килограмма (115 фунтов), способное проникнуть в 30-миллиметровую броню на расстоянии 250 метров; это действительно страшное оружие в правых руках."
 JAP_infantry_at2: "70-мм противотанковые пусковые установки типа 4"
 JAP_infantry_at2_desc: "Ракета была изготовлена в двух частях, которые должны были быть смонтированы посередине; она должна была быть выпущена, когда она лежала на склоне; ракета-носитель типа 4 использует бипод и минометный взрыватель. Интересно отметить, что ракета типа 4 использует под углом трубки Вентури на базе, чтобы вращать ракету для обеспечения стабильности."
 JAP_support_weapons: "Тип 3 Тяжелый пулемет и миномет типа 11"
 JAP_support_weapons_desc: "Тяжелое пулемётное оружие типа 3 было основано на конструкции французского хотчкисса M1914. &quot; Тяжелый пулемёт типа 3 &quot; использовался для загрузки патронов, а его трофей мог использоваться для установки зенитных орудий. &quot; Миномет типа 11 &quot; был разработан в 11-м году императора Тайшо. &quot; Исключительные &quot; среди японского оружия; &quot; Тип 11 &quot; - это оружие с ружьем винтовки."
 JAP_support_weapons2: "Тип 11 БМГ & тип 10"
 JAP_support_weapons2_desc: "Опыт боевых действий в Руссо-японской войне 1905 года научил Имперскую армию пользованию пулеметами, обеспечивающими покрытие огня. &lt; &lt; Тип 11 &gt; &gt; был разработан известным дизайнером оружия Киджиро Намбу на основе французского &lt; &lt; Хотчкисс М1909 &gt; &gt; и имеет воздушное охлаждение и газовое управление. &lt; &lt; Пулемет типа 11 &gt; &gt; является уникальной особенностью, характеризующейся его разъемным прыжком; он может быть перезаряжен во время работы и не нуждается в удалении от него. &lt; &lt; гранатомет &gt; &gt; типа 10 был гладким заряженным оружием с невероятной дальностью в 175 метров."
 JAP_support_weapons3: "Тип 99 МГК & тип 94"
 JAP_support_weapons3_desc: "LMG типа 99 использует новые патроны, найденные в Arisaka Type 99. Сохраняя тот же дизайн, что и предыдущие легкие пулеметы, и имеет сходство с английской Enfield-Automatic. Type 99 также допускает крепление стандартного штыка и 2,5x телескопического обзора для стрельбы. Миномет типа 94 является тяжелым минометом с дальностью 4 000 ярдов. Он призван служить артиллерийским предметом, который может быть вывезен в отдаленные районы."
 JAP_support_weapons4: "Тип 1 ГММ и тип 2 12 см минометы"
 JAP_support_weapons4_desc: "Эта тяжелая пулеметка с газовым управлением также может быть посажена в качестве зенитного оружия. Миномет типа 2 практически идентичен миномету Стоукс-Брандт 81-мм с единственной разницей в том, что биподовые ноги типа 2 могут быть удалены."
 JAP_infantry_weapons2: "Модель 2"
 JAP_infantry_weapons2_desc: "Модель 2, разработанная известным дизайнером оружия Kijiro Nambu, представляет собой пулемет с пневмонией. Одна из первых японских попыток автомата, модель 2 имеет невероятную высокую скорость огня, будучи одновременно легкой и переносной. Пнематическое буферное устройство смягчает действие ружья и действует в качестве задержки с болтом."
 JAP_improved_infantry_weapons_2: "Тип 100"
 JAP_improved_infantry_weapons_2_desc: "Тип 100 является первым в Японии массовым автоматом. Хотя есть варианты с биподами и увеличенными достопримечательностями для кавалерийных подразделений, он предназначен для пехоты. Пистолет стреляет 8 мм из 450 патронов в минуту. Интересно, что некоторые варианты были преобразованы в сворачивающие запасы для использования армейскими десантниками."
 JAP_advanced_infantry_weapons2: "Тип 100/44"
 JAP_advanced_infantry_weapons2_desc: "Эта модификация типа 100 1944 года включает несколько изменений, направленных на упрощение оружия. Вариант 1944 года длиннее, чем предыдущий вариант типа 100 с простыми железными обзорами и значительно упрощенным музыкой. Скорость стрельбы в версии 1944 года также значительно выше, когда пистолет стреляет 800 выстрелов в минуту. Пистолет является абсолютным монстром с близкого расстояния с удовлетворительной точностью и низкой отдачей."

