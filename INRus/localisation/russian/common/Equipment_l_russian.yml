 GEA_mechanized_equipment_1: "Sonderkraftfahrzeug 11"
 GEA_mechanized_equipment_1_short: "Sd.Kfz. 11"
 GEA_mechanized_equipment_1_desc: ""Sonderkraftfahrzeug 11" был разработан с 1934 по 1938 год с участием компании "Borgward AG", и с 1937 года проект стал ассоциироваться с компанией "Ganoversche Maschinenbau AG"."
 GEA_mechanized_equipment_2: "Sonderkraftfahrzeug 251"
 GEA_mechanized_equipment_2_short: "Sd.Kfz. 251"
 GEA_mechanized_equipment_2_desc: "Разработан на шасси Sd.Kfz 11, Schützenpanzerwagen Sonderkraftfahrzeug 251 полутреков (обычно именуемых \"SPW\") are built by Hannoversche Maschinenbau AG specifically to quickly transport a squad of infantrymen to the front lines with adequate armour protection from small arms fire. The truck examples are usually assigned to armour units for the purpose of helping troops stay right behind the fast moving tanks."
 GEA_mechanized_equipment_3: "Sonderkraftfahrzeug 256"
 GEA_mechanized_equipment_3_short: "Sd.Kfz. 256"
 GEA_mechanized_equipment_3_desc: "В конце 1943 года германская армия попросила Автосоюз разработать легкую, полностью отслеживаемую разведывательную машину, которая могла бы перевозить 6-8 человек в открытой верхней верхней верхней части конструкции. В 1944 году был введен Schwerer Schützenpanzerwagen Kätzchen (Heavy Armand Carrier 'Kitten') с такой же формой корпуса, как и корпус Stu.Pz.Kpfw. VII, но гораздо меньше. Автомобиль имеет передний привод с пятью или шестью перекрывающимися стальными колесами и предназначен для достижения скорости свыше 50 км/ч и имеет легкие бронежилеты. Теплая встреча немецких военных, несмотря на не очень высокую скорость, была принята на эксплуатацию под названием Sd.Kfz 256."

 #Armoured Car
 GEA_gw_armored_car_equipment: "Лейхтер Панзерспяхваген, Sonderkraftfahrzeug 222"
 GEA_gw_armored_car_equipment_short: "Sd.Kfz 222"
 GEA_gw_armored_car_equipment_dsec: "Внедренная в 1936 году Leichter Panzerspähwagen ( &quot; лёгкая бронеразведывательная машина &quot; ) Sd. Kfz 222."
 GEA_armored_car_equipment_1: "Schwerer Panzerspähwagen, 8-рад, Sonderkraftfahrzeug 231"
 GEA_armored_car_equipment_1_short: "Sd.Kfz 231"
 GEA_armored_car_equipment_1_desc: "Sd.Kfz 231 Schwerer Panzerspähwagen ( &quot; тяжелая бронеразведывательная машина &quot; ) - это военное обозначение линии разведывательных бронированных автомобилей, предназначенных для бронеподразделений. Первоначально разработанной в 1932 году в качестве шестиколесных вариантов, очевидно, что этот вариант будет устаревшим в ближайшем будущем. В 1937 году в эксплуатацию был введен вариант 8 колес с 2 см Kw.K. 30 L/55 автоканноном."
 GEA_armored_car_equipment_2: "Schwerer Panzerspähwagen, Sonderkraftfahrzeug 234"
 GEA_armored_car_equipment_2_short: "Сд. Кфз. 234"
 GEA_armored_car_equipment_2_desc: "Эта новая бронированная машина рассматривается в качестве преемника восьмиколесных панцерспахвагена Сд.Кфца 231. Среди других приоритетов была названа более эффективная защита и более тяжелое вооружение для новой бронированной машины. &quot; Машина &quot; тяжелее и громоздкее, чем &quot; Сд.Кфз &quot; 231, с глиняными стражами, которые шли вдоль стороны от конца до конца, с четырьмя складскими отделениями внутри. &quot; Основная версия &quot; , известная также как &quot; Сд.Кфз.234/1 &quot; , оснащена открытой топовой турнирной трубой с 2 см КВ.К. 30 л/55 автоканноном и коаксиальным M.G. 34."
 GEA_armored_car_at_equipment: "Schwerer Panzerspähwagen, Sonderkraftfahrzeug 234/2"
 GEA_armored_car_at_equipment_short: "Sd.Kfz. 234/2"
 GEA_armored_car_at_equipment_desc: "Респектабельный бронеавтомобиль Sd.Kfz.234/2 (также известный как "Puma") представляет собой большую скорость и значительную пушечную единицу калибра 50 мм KwK.39/1. С улучшенными лобовыми бронежилетами и мощным главным ружьем машина может передвигаться в летучие районы, которые обычно ограничиваются другими автомобилями-единомышленниками. Будучи значительно улучшенным вариантом Sd.Kfz.234, "Puma" предназначена для использования в взводе с шестью силами в качестве опорного автомобиля."

