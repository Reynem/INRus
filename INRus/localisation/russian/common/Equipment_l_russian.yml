 CAM_infantry_equipment_0: "Тип 46/66 Siamese Mauser"
 CAM_infantry_equipment_0_short: "Тип 46/66"
 CAM_infantry_equipment_0_desc: "Базовое пехотное оборудование, разработанное до и во время Велткрига. Тип 46/66 является уникальной винтовкой, помещенной в сиамский 8x52мм Rimmed Cartrid Cartrig, которая по существу включает гибридный Mauzer 96 & 98 в тело, вдохновленное как Маузером, так и Арисакой. Тип 46 был основным вооружением Сиамских экспедиционных сил во время Велткрига."
 CAM_infantry_equipment_1: "Тип 66 Siamese Mauser"
 CAM_infantry_equipment_1_short: "Тип 66"
 CAM_infantry_equipment_1_desc: "Оружие, обслуживаемое личным составом и экипажем для пехоты, а также различные другие комплекты снаряжения, в которых нуждается солдат. Хотя строго говоря, не является маузером, тип 66 является модернизированным японским экспортным оружием типа 38 с таким же действием, как и в старом сиамском типе 46. Он сиамский 8x52мм картридж. Как и его старый двоюродный брат, после обретения независимости Камбоджа владела большим количеством этих винтовок."

