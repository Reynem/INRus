 GXC_artillery_equipment_1: "75-мм полевое оружие типа 10 &lt; &lt; Ханьян Синьхай &gt; &gt;"
 GXC_artillery_equipment_1_short: "75-мм ганьян типа 10"
 GXC_artillery_equipment_1_desc: "Будучи наиболее добытой артиллерией в период Бейянга, эта артиллерия служила в различных армиях центральным правительством и военными баронами по всему Китаю."
