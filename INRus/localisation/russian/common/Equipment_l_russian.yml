 #Infantry Equip

 IMP_infantry_equipment_0: "Винтовка, длинная, Росс Мк III"
 IMP_infantry_equipment_0_short: "Росс Мк III"
 IMP_infantry_equipment_0_desc: "В 1903 году винтовка Росса получила несколько усовершенствований до Великой войны, кульминацией которых стала Mk III в 1910 году. Первоначально она была символом патриотизма среди канадцев, когда британцы отказались выдать им лицензию на Ли-Энфилд, эта винтовка получила ужасную репутацию в течение первого года войны, не в состоянии справиться с более низким качеством боеприпасов британского производства и значительно хуже в условиях траншеи, чем ее современники, и была официально выведена из эксплуатации в 1916 году. Тем не менее, SMLE никогда не производилась в Канаде до Британской революции, что послужило причиной ее нежелательного возвращения на службу в качестве остановки, пока производство SMLE не могло начаться в Лонг-Бранчеве, Онтарио."
 IMP_infantry_equipment_1: "Винтовка, короткая, журнал &lt; &lt; Ли-Энфилд Мк V &gt; &gt;"
 IMP_infantry_equipment_1_short: "SMLE Mk V"
 IMP_infantry_equipment_1_desc: "После падения островов Доминионы получили доступ только к одному арсеналу, способному производить служебную винтовку. Некоторые британские инженеры из Энфилда нашли убежище в Онтарио. С помощью фабрики в Литгоу в Австралии они продолжили работу по модернизации почитаемого SMLE, в результате чего была создана Mk V. В классической модели короткометражной винтовки была представлена новая и улучшенная система апертуры на приемнике, а не на средней, что улучшило радиус наблюдения, точность и скорость. Однако из-за операций по высадке и промыванию, необходимых для изготовления винтовки, производство этой новой модели SMLE является относительно дорогостоящим."
 IMP_infantry_equipment_2: "Карбина, машина, Оуэн Мк I"
 IMP_infantry_equipment_2_short: "Оуэн Пистолет"
 IMP_infantry_equipment_2_desc: "С перспективой войны армия обратилась с просьбой о разработке автомата для ведения боевых действий в непосредственной близости от города, особенно с учетом разрушительного характера гражданской войны в Америке. &lt; &lt; Канадская армия &gt; &gt; официально приняла оружие, разработанное молодой австралийской частной Эвелин Оуэн."Owen" machine carbine features an impressive rate of fire and a cheap cost to manufacture while also being sturdy in rough conditions - making it ideal for urban combat. Compared with other submachine guns during testing, the Owen has shown itself time and time again to be the only one to withstand mud, sand, and harsh environments. With favourable testing concluded, large quantities of the Owen were dispatched to the Dominions in preparation for the coming war."
