 CUB_infantry_equipment_0: "Модель Спрингфилда 1903"
 CUB_infantry_equipment_0_short: "M1903 Спрингфилд"
 CUB_infantry_equipment_0_desc: "Модель 1903 года была разработана в Спрингфилд-Арсенале, когда после испано-американской войны Соединенные Штаты сочли винтовку Краг-Йёргенсен неадекватной из-за ее слабого действия; в ее основе была попытка объединить полезные черты как Крага, так и пойманных испанских мазеров. Эта винтовка была постепенно принята вместе с патроном 30-06 как до, так и в то время как остальная часть мира вела войну с Велткригом."
 CUB_infantry_equipment_1: "Remington Modelo 1934"
 CUB_infantry_equipment_1_short: "Ремингтон М34"
 CUB_infantry_equipment_1_desc: "Remington Model 1934 — спортивная винтовка, построенная для центрально- и южноамериканского рынка."
 CUB_infantry_equipment_2: "Модель Томпсона 1928A1"
 CUB_infantry_equipment_2_short: "Томпсон М1928А1"
 CUB_infantry_equipment_3: "Кирали-Кристобал Карбин"
 CUB_infantry_equipment_3_short: "Кристобал Карбин"
 CUB_infantry_equipment_3_desc: "В то время как венгерский дизайнер оружия Пауль Кирали был принят на вооружение двойной монархией, они, тем не менее, не оправдали собственных ожиданий Кирали. &lt; &lt; Кристобаль &gt; &gt; представляет собой развитие этих СМГ, перестроенных вокруг нового картрида промежуточного калибра. &lt; &lt; Двойная монархия &gt; &gt; , Доминиканская Республика, где Кирали когда-то считал себя иммигрировавшим, оказался более восприимчивым, приняв этот пистолет в качестве карбины &lt; &lt; Кристобаль &gt; &gt; после города Сан-Кристобал. Куба получила лицензию на производство вскоре после ее доминиканского введения."

 CUB_artillery_equipment_1: "75-мм пушка M1897"
 CUB_artillery_equipment_1_short: "75-мм пушка M1897"

