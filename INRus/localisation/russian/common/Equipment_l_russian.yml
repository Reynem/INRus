 PAR_infantry_equipment_0: "Modelo Mauser 1907"
 PAR_infantry_equipment_0_short: "Модель 1907 года"
 PAR_infantry_equipment_0_desc: "В начале XX века, когда в Гран-Чако вспыхнула напряженность, Боливия и Парагвай приступили к осуществлению дерзких кампаний перевооружения, направленных против другого, в течение этого периода Парагвай принял несколько сокращенную производную от Маузера 1898 года, которая, будучи скованной в 7,65×53мм Маузере, стала основой парагвайских вооруженных сил до тех пор, пока спустя два десятилетия не разразился новый конфликт."
 PAR_infantry_equipment_1: "Овьедо Маузер Моделио 1927 года"
 PAR_infantry_equipment_1_short: "Модель 1927 года"
 PAR_infantry_equipment_1_desc: "В 1927 году испанская компания &lt; &lt; Овиедо &gt; &gt; заключила контракт с парагвайским правительством на изготовление обновленного варианта аргентинского автомата 1909 года, который, хотя сама винтовка и является самой передовой в свое время, обеспечивает достаточное количество боеприпасов для поставки винтовок Парагвайу оказалось удивительно трудной задачей."
