 SHX_infantry_equipment_0: "Тип 6-5"
 SHX_infantry_equipment_0_short: "Тип 6-5"
 SHX_infantry_equipment_0_desc: "Тип 6-5, названный за использование 6,5-мм патронов, является несколько модифицированной копией японского типа 38 Arisaka, первоначально произведенной Ян Сишаньским Тайюаньским Арсеналом."
 SHX_infantry_equipment_1: "Тайюаньский тип 26"
 SHX_infantry_equipment_1_short: "Тайюаньский тип 26"
 SHX_infantry_equipment_1_desc: "Эта винтовка первоначально называлась «Тип 27» и была вставлена в службу Qing в 1935 году при содействии Германии после восстановления. В функциональном отношении это оружие является почти копией немецкого Mauzer M1924 и значительным улучшением по сравнению с гораздо более старым типом 88 с точки зрения веса и оттока. ~nnnnFirst, произведенный в арсенале Ханьяна с немецкими инструментами, методы изготовления уже распространились на Тайюань, хотя он может не полностью заменить своих предшественников в течение некоторого времени."
 #Intentionally misspelt Thompson:
 SHX_infantry_equipment_2: "Модель 1921 года"
 SHX_infantry_equipment_2_short: ""Тэмпсон" M1921"
 SHX_infantry_equipment_2_desc: "Многие модели 1921 года были импортированы в Китай в 1920-х годах, несмотря на то, что США являются ведущим участником международного эмбарго на экспорт военного оружия в эту страну."
 SHX_infantry_equipment_3: "Тайюаньский тип 35"
 SHX_infantry_equipment_3_short: "Тайюаньский тип 35"
 SHX_infantry_equipment_3_desc: "Тип 35 — полуавтоматическая винтовка, основанная на винтовке генерала Лю с 1914 года. &lt; &lt; Тип 35 &gt; &gt; , хотя и выглядит аналогичным образом, короче, имеет заднюю часть приемного устройства, а газопроводная система заменена простым газовым портом. &lt; &lt; Новая винтовка &gt; &gt; также не может больше переключаться на ручные действия и использовать журналы из автомата &lt; &lt; Чехемия &gt; &gt; ZH-29 и легкого пулемета ZB-26."

