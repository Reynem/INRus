 ### Land ###
 ETS_infantry_equipment_0: "Тип 88"
 ETS_infantry_equipment_0_short: "Тип 88"
 ETS_infantry_equipment_0_desc: "Изначально как результат усилий, предпринятых в эпоху «самоукрепления» в конце Гуанксу, тип 88 был разработан в качестве близкого экземпляра немецкого Gewehr 88 с экспортными модификациями. Хотя в совокупности он ниже новых винтовок, несмотря на улучшения и часто плохое обслуживание, известно, что оружие является изогнутым и надежным, если оно не является неуправляемым. ~nnn this разновидность производится главным образом в Syning Arsenal в Цинхае, хотя нехватка оборудования и личные предпочтения часто видят, что оно используется вместе с нестандартным оружием, таким как Dadao."
 ETS_infantry_equipment_1: "Turk M1887 Mauser Tüfek"
 ETS_infantry_equipment_1_short: "Тюфек М1887"
 ETS_infantry_equipment_1_desc: "Турецкий M1887 Mauser представляет собой еще одну доработку немецкого M1871/84, которая была усилена добавлением единого запирающего выступа и еще более уменьшенного калибра. &lt; &lt; Рафл &gt; &gt; выпустила самую маленькую черную свинцовую пулю, принятую любой страной, и была последней черной пороховой винтовкой, изготовленной Маузером."
 ETS_infantry_equipment_2: "AVS Тип 38"
 ETS_infantry_equipment_2_short: "AVS 38"
 ETS_infantry_equipment_3: "Тип 35"
 ETS_infantry_equipment_3_short: "Тип 35"
 ETS_infantry_equipment_3_desc: "Тип 35 — полуавтоматическая винтовка, основанная на винтовке генерала Лю с 1914 года. &lt; &lt; Тип 35 &gt; &gt; , хотя и выглядит аналогичным образом, короче, имеет заднюю часть приемного устройства, а газопроводная система заменена простым газовым портом. &lt; &lt; Новая винтовка &gt; &gt; также не может больше переключаться на ручные действия и использовать журналы из автомата &lt; &lt; Чехемия &gt; &gt; ZH-29 и легкого пулемета ZB-26."

 ETS_motorized_equipment_1: "Citroën P21 Тип C6 "Croisière June""
 ETS_motorized_equipment_1_short: "Citroën P21"
 ETS_motorized_equipment_1_desc: "В ноябре 1931 года в Синьцзян прибыл великий Круайер Жюнь ( &quot; Йеллоу экспедиция &quot; ), организованный компанией &quot; Ситроан &quot; . Янг Цзенгсин, губернатор Синьцзян, был удивлен французской экспедицией через Шелковый путь и тепло принял экспедиционную группу. &quot; Увидев, что эти грузовики могут постоянно ездить в тяжелых условиях во время пребывания экспедиции в Синьцзяне, Ян Цзэнсинсин предложил купить партию автомобилей &quot; Ситроэн П21 &quot; , и экспедиция с готовностью согласилась с этой просьбой, поскольку цель экспедиции заключалась в рекламе &quot; Ситрон &quot; . Вскоре после прибытия экспедиции в Пекин в феврале 1932 года французы отправили первую партию автозапчастей и инженеров в Синьцзян. &quot; Этот грузовик также стал самым распространенным автомобилем автомобилем в Синьцзяне."

