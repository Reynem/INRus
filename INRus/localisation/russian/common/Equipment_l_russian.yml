 LEC_gw_armored_car_equipment: "Шанхай "Фексинг Баоли""
 LEC_gw_armored_car_equipment_short: ""Исправляю Баолей""
 LEC_gw_armored_car_equipment_desc: ""Feixing Baolei" — стандартная бронированная машина, используемая полицией Шанхая, и Корпус добровольцев Шанхая также оснащена небольшим количеством таких бронированных машин. ~nn-n-n) В этой машине могут находиться более десяти человек. Верхняя часть карета оснащена пулеметом или пехотным пулеметом с несколькими отверстиями сзади. В отсеке бронированной машины есть световые люки, позволяющие экипажам выйти из камеры, чтобы подавить толпу сильными световыми или водонапорными пулями. Огромный бронетранспортер сделал ее похожей на тюремную машину, поэтому люди дали этой неназванной машине по борьбе с беспорядками унизительное прозвище: "Feixing Baolei" или "Ling Fortres". По прошествии времени даже реальные тюремные машины в Шанхае получили такое же название."
 LEC_armored_car_equipment_1: "Sonderkraftfahrzeug 231 8-Rad"
 LEC_armored_car_equipment_1_short: "Sd.Kfz 231"
 LEC_armored_car_equipment_1_desc: "После окончания «Велткриг» и краха Британской империи Шанхайский корпус добровольцев также начал постепенно внедрять оружие немецкого производства. &lt; &lt; Новая инженерная и корабельная компания &gt; &gt; , которая первоначально отвечала за изготовление бронированных машин для «Шанхайского добровольческого корпуса», теперь официально производит немецкие бронированные машины."

