 FOP_infantry_equipment_0: "Fusil Mauser Modelo 1895"
 FOP_infantry_equipment_0_short: "Модель 1895 года"
 FOP_infantry_equipment_0_desc: "В ответ на агрессивную программу аргентинского вооружения Чили приняла модифицированный Маузер 1893 года (обычно известный как Испанский Маузер) в камере 7x57мм Маузер и заключила контракт с немецкой компанией DWM (Deutsche Waffen und Businessabilitiesfabriken) на более чем 100 000 винтовок и карабинов на этой схеме. Чилийский Маузер 1895 года завоевал репутацию за надежность даже в самых тяжелых условиях, которые сохраняются спустя десятилетия после его принятия."
 FOP_infantry_equipment_1: "Карабина Стейр Моделео 1912/35"
 FOP_infantry_equipment_1_short: "Модель 1912/35"
 FOP_infantry_equipment_1_desc: "Незадолго до того, как «Велткриг», Чили заключила контракт с австрийским производителем оружия «Стейр» на новый карбиновый вариант немецкого «Маузера» 1898 года, запертый в 7х57ммм, как старые чилийские винтовки. Многие из этих карабинов в конечном счете попали в руки чилийских карабинеров, которые сочли эту винтовку неудовлетворительной и лоббировали ее замену. В 1935 году была утверждена новая модель с улучшенной эргономикой и новый более крупный журнал с более прочными губами и погрузчиком питания, который вскоре после этого начал производиться. Через несколько месяцев после его первоначального производства винтовки начали прокачиваться в Патагонию."
 FOP_infantry_weapons2: "МАШ 36"
 FOP_infantry_weapons3: "Hafdasa 'Ballester-Rigoud C1' mo"
 FOP_infantry_equipment_2: "Хафдаса С-4"
 FOP_infantry_equipment_2_short: "Хафдаса С-4"
 FOP_infantry_equipment_2_desc: "Hafdasa C-4 — это автомат аргентинского происхождения, который может быть выпущен полуавтоматически или автоматически."
 FOP_infantry_equipment_3: "Халкон М-43"
 FOP_infantry_equipment_3_short: "Халкон М-43"
 FOP_infantry_equipment_3_desc: "В 1941 году Fabrica de Armas Halcon (Falcon Gun Gun Factory) была разработана подмашинной пушкой исключительно аргентинского происхождения, а в 1943 году она была разработана компанией Fabrica de Armas Halcon (Falcon Gun Factory)."
