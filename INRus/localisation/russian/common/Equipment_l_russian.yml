 SIC_train_equipment_1: "ПС Группо 740"
 SIC_train_equipment_1_short: "ПС Гр. 740"
 SIC_train_equipment_1_desc: "Группа 740, созданная Адриатическими железными дорогами незадолго до национализации железных дорог в 1905 году, представляет собой серию «укрепленных» локомотивов класса."
 SIC_train_equipment_2: "ПС Группо 940"
 SIC_train_equipment_2_short: "ПС Гр. 940"
 SIC_train_equipment_2_desc: "Разработанные на основе группы 740, эти автоцистерны класса «Микадо» были построены для перевозки тяжелых грузовых поездов по крутым линиям Южного Аппеннинса и линии Рим-Пескара. Хотя они и менее мощны, чем их традиционные двигатели, они в целом являются более гибкими и дешевыми для работы, в то время как их нижняя нагрузка на ось позволяет им двигаться по более старым путям."
