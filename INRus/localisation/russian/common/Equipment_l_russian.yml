 ### Land ###
 LIB_infantry_equipment_0: "Спрингфилдская модель 1898 года"
 LIB_infantry_equipment_0_short: "Спрингфилд М1898"
 LIB_infantry_equipment_0_desc: "Винтовка Краг-Йоргенсен была принята Соединенными Штатами в 1892 году для замены стареющей Спрингфилдской модели 1884 года. В то время как Краги оказались выше аналогичных дизайнов Маузера в испано-американской войне, неустойчивое действие винтовки по сравнению с новыми конструкциями болта потребовало замены всего лишь десятилетие спустя после ее принятия. Либерия приобрела свои кражи в качестве крайне дисконтированной военной помощи из Соединенных Штатов вскоре после падения Франции в Европе, в основном благодаря американским опасениям нацистов французского вторжения в страну."
