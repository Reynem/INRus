 GXC_anti_tank_equipment_1: "37-мм пистолет типа 18 &lt; &lt; Плоский траекторий &gt; &gt;"
 GXC_anti_tank_equipment_1_short: "37-мм ганьян типа 18"
 GXC_anti_tank_equipment_1_desc: "Хотя на самом деле это 37-мм ханьянского типа 21, обычно оснащенного армией Цин, некоторые страстные республиканцы называют его Синьхайским типом 18, согласно календарю Синьхая Китайской Республики."
 GXC_anti_tank_equipment_2: "37-мм противотанковое оружие типа 30 &lt; &lt; Пацзян Синхай &gt; &gt;"
 GXC_anti_tank_equipment_2_short: "37-мм типа &quot; Пацзян &quot;"
 GXC_anti_tank_equipment_3: "57-мм безоткатная пушка типа 36 &lt; &lt; Пацзян Синхай &gt; &gt;"
 GXC_anti_tank_equipment_3_short: "57-мм типа &lt; &lt; Пацзян &gt; &gt; 36"

 GXC_gw_armored_car_equipment: "Боевая машина &lt; &lt; Гуанчжоу &gt; &gt;"
 GXC_gw_armored_car_equipment_short: "Четвёртый ланч"
 GXC_gw_armored_car_equipment_desc: "С начала 1930-х годов Liangguang Clique импортировал большое количество американских грузовиков GMC 3/4-тонного калибра и использовал их шасси для массового производства партии бронированных машин, оснащенных тремя 7,62-мм легкими пулеметами."
 GXC_armored_car_equipment_1: "Боевая машина &lt; &lt; Гуанчжоу &gt; &gt;"
 GXC_armored_car_equipment_1_short: "6-лучший Жанче"
 GXC_armored_car_equipment_1_desc: "После начала второй американской гражданской войны многие американские военные грузовики GMC с шестиколесными приводами быстро почувствовали эту возможность и купили небольшое количество этих грузовиков и переоборудовали их в бронетранспортеры. Несмотря на то, что эта бронированная машина оснащена несгибаемой тяжёлой ружьем, ниже которой находится 37-мм пехотный пистолет, обращенный вперед, рядом с двумя пулеметами, установленными на спонсоне с обеих сторон тела автомобиля. Относительный размер и мощность этого автомобиля на китайском поле боя делают его не менее чем «монстром» в глазах большинства других военных баронов."

