 #Infantry Equip

 MAF_infantry_equipment_0: "$GER_infantry_equipment_0$"
 MAF_infantry_equipment_0_short: "$GER_infantry_equipment_0_short$"
 MAF_infantry_equipment_1: "Карабинер 98 т"
 MAF_infantry_equipment_1_short: "Карабинер 98 т"
 MAF_infantry_equipment_1_desc: "Вместо того, чтобы принимать новую винтовку, была принята модифицированная версия существующего карабинера 98AZ из Вельткрига, с тем чтобы сэкономить деньги для колониального правительства."t\" stands for \"tropen\", meaning \"tropics\". The rifle's total length is shortened to 1m, its weight reduced to 3.2kg, and equipped with a shorter sight (100 to 1000m rather than 2000m) to be more suitable for jungle warfare in general, which is fought at a closer distance."
 MAF_infantry_equipment_2: "Машинепистоле 40/I"
 MAF_infantry_equipment_2_short: "MP 40/I"
 MAF_infantry_equipment_2_desc: "Изучив опыт индокитайского конфликта, MP 40/I (иногда ошибочно именуемый MP 40/II) представляет собой модифицированную версию стандарта MP 40 с двойным счаленным владельцем журнала (для теоретических боеприпасов в общей сложности 64 патрона), предназначенного для военнослужащих на азиатском и африканском фронте, с тем чтобы они лучше подходили к характеру боя в джунглях, в котором не учитывается расстояние противостояния в обмен на гораздо более высокую мощность для ."Dauerfeuer-Himmelssteuer\" (Spray and Pray) tactics against enemy combatants hidden behind thick foliage."
 MAF_infantry_equipment_3: "Машиненкарабинер 42k"
 MAF_infantry_equipment_3_short: "MKb 42k"
 MAF_infantry_equipment_3_desc: "В отличие от MKb 42, MKb 42k \"Kolonial\" variant of the rifle is developed in parallel by the Walther company. The specification called for a new weapon which was larger than a submachine gun, more accurate, longer ranged and more manoeuvrable than a full sized rifle in order to replace both the existing MP 40/I and Karabiner 98t role at the same time. The rifle fire from a closed bolt, trading higher rate of fire of 600 rpm with effective range which goes down by 50 metre when compared to the main service rifle adopted in Europe. These characteristics which filled a very niche role make it well-loved by its user."
 MAF_infantry_at: "$GER_infantry_at$"
