 china_mio_arsenal_integration_decision_category_desc: "Одной из немногих серебряных подкладок десятилетий гражданской войны является то, что огромные военные расходы заложили прочную основу для современного военно-промышленного комплекса, однако многие барьеры сохраняются. Помимо обычных подозреваемых в коррупции, неопытности и срыве войны, китайские солдаты исторически были оснащены иностранными замыслами, если не прямым иностранным импортом, которые сдерживали рост отечественной оружейной промышленности. Кроме того, большая часть огромных арсеналов Китая сильно децентрализована и плохо интегрирована, продуктом регионализма военных военачальников. По мере нашего продвижения к объединению мы должны работать над захватом и синхронизацией этих военных производственных центров, высвобождая весь потенциал китайской промышленности!"

