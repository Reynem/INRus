l_russian:

 ### Tooltips ###
 can_demand_romandy: "Беспокойство в Верхней Савойе"
 SWI_white: "Теперь вы можете потребовать Вот-Савой."
 romandydivs_tt: "Два отдела добровольцев образуются в Романди."

 ### Events ###
 pre_war_events.1.t: "Пятилетняя годовщина женевского забастовки 1932 года"
 pre_war_events.1.d: "Пять лет назад работники Женевы начали крупную промышленную акцию, требуя проведения социально-экономических реформ, которые грозили распространиться на остальную часть франкоязычной западной Швейцарии (известную как Романди). Несмотря на страх потенциального революционного влияния со стороны коммуны Франции, центральное правительство Берна быстро отреагировало, направив в федеральную армию для того, чтобы сломить забастовку. В результате последовавшей за этим вспышки насилия 13 человек были убиты и более 100 ранены в Женеве. Это оставило горькую пропасть между римлянами и Берном, которая в последующие годы не смогла залечиться."Peace of Work\" agreement, which involves a number of policies regarding wage increases, shift times and so on. One of the key points is to put an end to the massive lockouts in watch manufactures which have taken place recently.\n\nThe social democratic candidates are relying on this programme to be re-elected and hopefully defuse the stand-off between the radical left and the conservative dominated Federal government in Bern."
 pre_war_events.1.a: "Неудачное событие."
 pre_war_events.2.a: "Интересное событие."

 pre_war_events.3.t: "Победа социалистических выборов в Романди"
 pre_war_events.3.d: "При поддержке консервативного федерального правительства и большинства кантонов, говорящих на немецком языке, швейцарские организации работодателей отказались подписать так называемое \"Peace of Work\" agreement proposed by the social-democrats to put an end to the massive lockouts happening in the watch manufactories.\n\nWhile the moderate social-democrats have been disgraced, French-speaking workers, whose resentment towards the current government and the Federal Army (largely dominated by German-speaking officers) has been growing since the violent repression of a workers' strike in Geneva in 1932, have returned a landslide victory to Socialist and pro-Syndicalist candidates in all cantonal elections, bringing in leftist councils in Geneva, Lausanne and Neuchâtel which are now calling for ambitious reforms."
 pre_war_events.3.a: "Проклятье этих социалистов!"

 pre_war_events.4.t: "Просиндикалистская победа в романе"
 pre_war_events.4.d: "Благодаря неразумным мерам, принятым швейцарскими властями для того, чтобы положить конец требованиям их профсоюзов в отношении повышения заработной платы и правовой защиты трудовых прав, а также их публичному выражению насилия в отношении нашего народа в Верхнем Савойе, у нас достаточно политического капитала, чтобы начать усилия по поддержке синдикалистских движений в стране и попытаться вновь забрать Хауте-Савойе."
 pre_war_events.4.a: "Постарайся получить влияние на вновь избранных социалистов!"
 pre_war_events.4.b: "Это слишком рискованно..."

 pre_war_events.5.t: "Синдикалистская подрывная деятельность на работе в Романди!"
 pre_war_events.5.d: "В то время как вновь избранные социалистические правительства в Романди приступили к исполнению своих обязанностей, федеральная разведывательная служба сообщает, что французские агенты пересекли границу, чтобы дать совет левым романам, в то время как, как также утверждается, продолжается частичная мобилизация французских пограничных подразделений вблизи Женевы."
 pre_war_events.5.a: "Разошли местные органы власти во французских кантонах!"
 pre_war_events.5.b: "Мы должны уважать конституцию..."

 pre_war_events.6.t: "Беспокойство в Романди!"
 pre_war_events.6.d: "Федеральный совет, поддерживаемый местными франкоговорящими консерваторами, отдал приказ \"sure\" (i.e. German-speaking) Federal Army units to enter Romand cantons to introduce martial law. Socialist leaders, as well as many workers and Syndicalist sympathisers, have been arrested and provisional local governments are being set up under Federal supervision. In spite of our efforts, some Socialist councilors have managed to escape to France and they are now calling for armed resistance against Federal rule and the return of Haute-Savoie to French hands.\n\nDespite the repression, the Romandie and now Haute-Savoie are now being plagued by massive strikes and armed incidents as demobilised French speaking Army units form militias. Meanwhile, an unusual concentration of French infantry and tanks is currently exercising in the Jura Mountains, and violation of Swiss airspace by French aircraft is becoming more and more frequent."
 pre_war_events.6.a: "Проклятье этих предателей!"

 pre_war_events.7.t: "Женева и швейцарский французский язык"
 pre_war_events.7.d: "Буржуазное швейцарское правительство продемонстрировало свое истинное лицо и свергнуло демократически избранные социалистические советы в Женеве, Лозанне и других франкоязычных кантонах! Как будто этого было недостаточно, теперь они тоже избивали и кровавые французы на нашей земле в Савойе! Наши агенты сообщили о многочисленных зверствах против вооруженных рабочих и гражданских лиц, когда Федеральная армия Швейцарии ввела в действие военное положение. Несмотря на все свои усилия, некоторые франкоговорящие синдикалистские симпатиаты убежали от федеральной армии и нашли убежище в нашей стране. Несмотря на то, что они только что создали синдикалистское швейцарско-французское правительство в изгнании и призвали к восстановлению должным образом избранных должностных лиц и судебному преследованию нынешнего федерального правительства. Поскольку ни одна из реакционных держав, похоже, не желает прийти на помощь Швейцарии, это одна из возможностей послать ультиматум Берну и обе укрепили синдикалистские движения в нашем соседе и увидеть возвращение нашей законной территории."
 pre_war_events.7.a: "Спросите у швейцарцев "Хот-Савой"!"
 pre_war_events.7.b: "Мы хотели бы остаться в хороших отношениях со швейцарцами."

 pre_war_events.8.t: "Отклонение в провинции Романди и французском Ультиматуме"
 pre_war_events.8.d: "Французы потребовали возвращения провинции Хаут-Савойе, сфабриковали утверждения об Уайт-Торе, увековеченном Швейцарской Федерацией, и лидеры синдикалистов по всей Швейцарии принимают в этом участие."
 pre_war_events.8.a: "Примите французские претензии."
 #pre_war_events.8.b: "Нас не будут задирать эти синдикалистские ублюдки!"
 pre_war_events.8.c: "Мы должны искать защиты!"

 pre_war_events.9.t: "Муниципалитет Франции угрожает Швейцарии!"
 pre_war_events.9.d: "Этот последний дипломатический кризис угрожает нарушить баланс сил в пользу международного сообщества."
 pre_war_events.9.a: "Предупреди их, чтобы они повернулись назад или лицом к немецким рукам!"
 pre_war_events.9.b: "Мы не можем втягивать себя в это!"

 pre_war_events.10.t: "Немецкая Империя бросила нас!"
 pre_war_events.10.d: "Наша попытка защитить нашу независимость и территориальную целостность от возмутительных притязаний Франции при посредничестве Германии закончилась неудачей."
 pre_war_events.10.a: "Черт побери!"

 pre_war_events.11.t: "Немцы посылают ультиматум!"
 pre_war_events.11.d: "Немецкая империя отправила ультиматум в Париж. Мы должны прекратить нашу дипломатическую и секретную деятельность, направленную против территориальной целостности Швейцарии, или столкнуться с мощью немецкой армии."
 pre_war_events.11.a: "Мы не можем рисковать войной с Германией."
 pre_war_events.11.b: "Не обращайте внимания на эти слабые немецкие угрозы!"

 pre_war_events.12.t: "Муниципалитет Франции падает!"
 pre_war_events.12.d: "После того как наше дипломатическое послание было получено в Париже, они быстро прекратили всю дипломатическую и секретную деятельность, направленную против территориальной целостности Швейцарии. Несмотря на то, что сегодня мы добились дипломатической победы, мы показали миру, что мы будем противостоять социалистической и синдикалистской агрессии и будем защищать любую нацию под угрозой этих революционеров!"
 pre_war_events.12.a: "Дипломатия вновь достигла мира!"

 pre_war_events.13.t: "Французский игнорирует наш Ультиматум"
 pre_war_events.13.d: "Французы проигнорировали наши дипломатические усилия по поддержанию мира в Европе и продолжают свои усилия по дестабилизации Швейцарии."
 pre_war_events.13.a: "Они сделали свой выбор."

 pre_war_events.14.t: "Коммун Франции отказывается от своих притязаний!"
 pre_war_events.14.d: "После того, как в Париже было получено наше дипломатическое послание, они быстро прекратили всю свою дипломатическую и секретную деятельность против нас. Нншвейцарская независимость и территориальная целостность будут сохранены, а также наша национальная гордость."
 pre_war_events.14.a: "Мы не могли бы сделать это без нашего союзника!"

 pre_war_events.15.t: "Швейцарская федерация принимает"
 pre_war_events.15.d: "Мы потребовали, чтобы провинция Хаут-Савой защищала наш народ, и швейцарцы согласились."
 pre_war_events.15.a: "Хорошо!"
 pre_war_events.15.b: "Нажимайте на них, чтобы они получили больше уступок."

 pre_war_events.16.t: "Швейцарская пещера"
 pre_war_events.16.d: "С унижением Швейцарии мы должны быть как никогда готовы к войне с Францией и ее союзниками!"
 pre_war_events.16.a: "Мы будем готовы!"

 pre_war_events.18.t: "Война в Саверярде"
 pre_war_events.18.d: "Коммун Франции и Швейцарская Федерация отклонили все другие варианты и началась война. Хотя Швейцария не просила о нашей помощи, это дало бы нам возможность воссоединить Итальянский полуостров!"
 pre_war_events.18.a: "Франция должна быть остановлена здесь и сейчас!"
 pre_war_events.18.b: "Итальянская Федерация заявляет о своем нейтралитете."

 pre_war_events.19.t: "Война в Саверярде"
 pre_war_events.19.d: "Франция воевала с нейтральной Швейцарской федерацией за провинцию Верхний Савойе, провинцию с большинством швейцарских французов. Франция использовала сфабрикованные истории об "белом терроре" в Энси и Романди в качестве предлога для их вторжения."
 pre_war_events.19.a: "Мы должны сохранить независимость Швейцарии!"
 pre_war_events.19.b: "Мы еще не готовы."

 pre_war_events.21.t: "Французские социалисты призывают к созданию Союза с Францией"
 pre_war_events.21.d: "После нескольких столкновений между германоязычными солдатами в процессе подготовки и женевскими полицейскими римскими социалистическими лидерами, на которых давили ополченцы рабочих, было объявлено отделение от Швейцарии и конституция так называемого \"Romand Socialist Federation\".\n\nAccording to intelligence reports, the French and the secessionists have engaged in talks about an union between the Romand cantons and the Commune of France. The Federation, conveniently, has also called for the region of Haute-Savoie to be ceded back to France."
 pre_war_events.21.a: "Проклятье этих предателей!"

 pre_war_events.22.t: "Социалисты пытаются захватить власть над Романди!"
 pre_war_events.22.d: "Несмотря на репрессии, проведенные войсками федеральной армии и лояльными романами, социалистические ополченцы, которые, согласно сообщениям, используют французское тяжелое оружие и снаряжение, наступают почти во всех римлянах и Хауте-Савойе. Основные линии связи с остальной частью Швейцарии могут попасть под сепаратистский контроль, а также большинство объектов инфраструктуры региона. Несмотря на то, что Женевский государственный совет осажден профранцузскими ополчениями, а изгнанные социалисты, как утверждается, вернулись из Франции для формирования нового и единого социалистического правительства, Федеральная армия, как представляется, больше не контролирует швейцарско-французскую границу."
 pre_war_events.22.a: "Романди похитили социалисты!"
 pre_war_events.22.b: "Их слабые попытки были сокрушены армией!"
 pre_war_events.22.c: "Революционеры идут на восток!"

 pre_war_events.23.t: "Присоединение Романди!"
 pre_war_events.23.d: "Отважные рабочие и крестьяне франкоговорящих швейцарских кантонов одержали победу в борьбе против реакционных сил правительства Берна! По единодушной просьбе недавно созданных общин Женевы и Романди Общественный комитет Салюта объявил о своем союзе с коммуной Франции. Несмотря на то, что местные ополчения интегрированы в Коммунальную армию, французские моторизованные подразделения, поддерживаемые военно-воздушными силами, направляются к новой границе, с тем чтобы предотвратить любые ответные наступательные действия со стороны реванчистского швейцарского правительства, и правительство вновь взяло на себя контроль над районом Хауте-Савойи."
 pre_war_events.23.a: "Слава работникам Романди!"

 pre_war_events.24.t: "Французская община оккупировала Романди!"
 pre_war_events.24.d: "Вероломные социалистические повстанцы в Романди и Хаут-Савойе, которые были на грани уничтожения нашими храбрыми солдатами, вызвали коммуну Франции для защиты! Прошлой ночью французские войска, поддерживаемые танками и бомбардировщиками, вошли на территорию Швейцарии до Фрибура, в то время как элитные французские горные войска атаковали наши оборонительные позиции в Альпах и в горах Юра. nn france State veywards объявили, что римляне были аннексированы к коммуне Франции, все это время, когда в Берн прибывают тысячи солдат и беженцев. Наш посол в Париже был предупрежден о том, что любая попытка противостоять Армии Коммуна приведет к массовым бомбардировкам Цюриха, Базеля и Берна и полному уничтожению швейцарских военных сил."
 pre_war_events.24.a: "Мы ничего не можем сделать..."
 pre_war_events.24.b: "Мы должны вернуть наши украденные территории с помощью войны!"

 pre_war_events.25.t: "Белый террор в Швейцарии"
 pre_war_events.25.d: "Швейцарская федеральная армия и ее отвратительные добровольцы-волонтеры победили героические защитники социалистической революции в Романди и Хауте-Савойе. По мере того, как тысячи людей пересекают границу для того, чтобы найти убежище во Франции, французские ополченцы подвергаются казни после имитационных испытаний, в то время как правые активисты и буржуазные охотники на социалистов, анархистов и синдикантов грабит свои дома и жестоко мстит своим семьям. Такие зверства, о которых сообщают наши государственные телерадиовещательные компании, вызывают волнения во Франции, и каждый настоящий синдикалист в настоящее время готов освободить не только Савои, но и даже романдов от сковок швейцарских кровожадных правителей. Если наши самолеты готовы взять и нанести удары по швейцарской территории, а наши войска сосредоточены вблизи границы, то Общественный комитет Салюта сообщил Берну, что если бы ФРС не эвакуировала Хау-Савойя и его контроль не был передан общинным властям, а политические лидеры роман восстановлены на своих позициях, война была бы неизбежной."
 pre_war_events.25.a: "Приготовить войска!"

 pre_war_events.36.t: "Маневры немецкой империи в Альзасе-Лоррейне"
 pre_war_events.36.d: "Наши агенты в Берлине и Страсбурге сообщили нам, что беспрецедентная концентрация немецких войск запланирована в Эльзасе и Лоррейне под прикрытием «военных учений»."
 pre_war_events.36.a: "Объявляйте наши собственные маневры во Франче-Комте!"
 pre_war_events.36.b: "Мы не хотим провоцировать Германию..."

 pre_war_events.37.t: "Мануэвр в Эльза-Лотрингене"
 pre_war_events.37.d: "Сейчас, как представляется, кризис в Лоррейне не может быть урегулирован, если французы вновь не будут смирены, и настало время, чтобы Германия вновь продемонстрировала свою силу. В этой связи по просьбе Кайзера, его внука и будущего Кронпринца Вильгельма фон Преен будет присутствовать на военных учениях, организуемых в Альсасе-Лоррейне под названием \"Tüchtiger Bogenschütze\" (the name was chosen because new long-range artillery prototypes from Krupp factories are to be tested in real conditions during the exercise), which will be the largest concentration of troops since the Weltkrieg.\n\nNo less than eight divisions will be deployed near the French border, where fortifications have been fully manned. Three air regiments and armoured units will also take part in the operations, which will be followed by many European military attachés. Ready to march on Paris, these troops will surely make the Commune back down in terror!"
 pre_war_events.37.a: "Истинное проявление силы!"

 pre_war_events.38.t: "Маневры во Франче-Комте"
 pre_war_events.38.d: "Немецкая сабля и постоянно ухудшающаяся ситуация в Лоррейн убедили Общественный комитет Салюта удовлетворить просьбу Генерального штаба о проведении широкомасштабных военных учений на границе, которые докажут бескомпромиссное решение коммуны как друзьям, так и врагам!"Opération Kléber\".\n\nFour infantry divisions and two motorised infantry divisions, with their divisional artillery units, will face the Germans near Belfort, while bomber and fighter wings will train in coordination with an armoured division equipped with the newest medium and heavy tanks. Impressed by our modern and unstoppable military force, the Kaiser and his minions will have no choice but to retreat behind the Voges Mountains!"

 pre_war_events.39.t: "Огнестрельное плавание"
 pre_war_events.39.d: "Сегодня в 6 утра, так называемая ~"military exercise\" organised by the German Army has proved to be nothing more that a treacherous act of aggression against the Commune! At least two artillery batteries have opened fire across the border and have shelled Avricourt, a small and undefended village near Nancy. Twelve buildings have been destroyed and 26 people, mostly women and children, have been slaughtered in this cowardly attack.\n\nThe survivors are being evacuated as border troops, reinforced with longe-range artillery, are now facing the murderous German units. An emergency session is being held at the Bourse Générale du Travail, while the Chief of Staff has just come back with his aides from Besançon to Paris to consider the most appropriate response to such a despicable attack."
 pre_war_events.39.a: "Требуйте официальных извинений!"
 pre_war_events.39.b: "Просто трагический несчастный случай..."

 pre_war_events.40.t: "Шеллинг Эльфрингена"
 pre_war_events.40.d: "Кровожадные французы выбросили свою маску и разоблачают свое намерение атаковать Эльсаю-Лотерингена! В 06 ч. 30 м. взвод французских танков пересек границу к востоку от Метца и открыл огонь по одному из наших пограничных аванпостов вблизи Эльфрингена."

 pre_war_events.41.t: "Огнестрельное плавание"
 pre_war_events.41.d: "Только что произошел прискорбный инцидент во время военных учений в Эльсаё-Лотингене. 2 из наших новых артиллерийских батарей дальнего действия, укомплектованных молодыми новобранцами, по ошибке обстреляли маленькую французскую деревню по имени Аврикур из-за плохой оценки огневой дальности. Согласно Красно-Французской телепередаче, несколько местных жителей были бы убиты в результате этого случайного обстрела. В настоящее время военная полиция допрашивает офицера и начальника НОК, но французы, бесстыдно воспользовавшись ситуацией, выступили с подстрекательским заявлением, требуя официальных извинений от Кайзера и кабинета и угрожая Германии."unpredictable consequences\" if we refuse to comply."
 pre_war_events.41.a: "Отправьте официальные извинения!"
 pre_war_events.41.b: "Это возмутительно, приготовьте войска!"

 pre_war_events.42.t: "Шеллинг Эльфрингена"
 pre_war_events.42.d: "Только что на немецкой границе произошел прискорбный эпизод в ходе одного из наших совместных военных учений, организованных в настоящее время вокруг Сарребура. Танковый взвод , запутавшийся в неправильной карте, по всей видимости, проехал слишком близко к границе. Команда настаивала на том, что они все еще находятся на французской стороне, когда по ним открылись спусковые немецкие пограничники. Несмотря на то, что пожары вспыхнули вблизи небольшой деревни Лоррейн по имени Эльфринген и с обеих сторон имели место потери. Военная разведка была немедленно направлена на расследование, а командующий лейтенант был подвергнут превентивному аресту. Горячие немцы воспользуются этим инцидентом. Общественный комитет только что получил оскорбительный ультимат из Берлинатум ."extremely severe consequences\"if we don't comply."

 pre_war_events.43.t: "Немецкие извинения за инцидент в Аврикуре"
 pre_war_events.43.d: "Германия была впечатлена нашей бескомпромиссной позицией и признала свою ответственность в печально известной резне Аврикур! После того как наш посол в Гааге неофициально встретился с полномочным представителем, присланным канцлером, Берлин опубликовал официальное извинительное заявление Кайзера и вывел некоторые войска из Лоррейн, что подтвердили наши разведывательные силы. Наш министр иностранных дел, а также наши союзники из Интернационала просили Комитет Салута принять это извинение."
 pre_war_events.43.a: "Примите их извинения."
 pre_war_events.43.b: "Извинений недостаточно!"

 pre_war_events.44.t: "Немецкая империя мобилизуется!"
 pre_war_events.44.d: "Как и ожидалось от империалистов, Германия не только отказалась извиниться за свои преступления, но и призвала к всеобщей мобилизации! Между Валлонией и Швейцарией собираются активные и Ландверские дивизии, в то время как наши бойцы ведут изолированную собачью бой с немецкими самолетами над Седаном, и сообщается о спорадических перестрелках, которые должны быть доставлены через несколько месяцев. С другой стороны, высшие военные считают, что война неизбежна, и подчеркивают тот факт, что победа может быть достигнута с помощью быстрого наступательного действия против сердца Рейха, прежде чем Германия сможет в полной мере использовать свою промышленную мощь."
 pre_war_events.44.a: "Отойди и прекрати эту конфронтацию."
 pre_war_events.44.b: "Соберите войска!"

 pre_war_events.45.t: "Французские извинения за инцидент с Эльфрингеном"
 pre_war_events.45.d: "После того как французское дипломатическое представительство проинформировало нашего посла в Мексике о том, что наш ультиматум будет услышан в ближайшее время, коммунары официально извинились за свой постыдный акт войны в Эль-Фрингене и вывели свои войска из Нэнси."humble the Red murderers\" during an improvised press conference in Karlsruhe, and the Generalstab has advised against any sign of leniency that could be misunderstood by the French for a sign of weakness."

 pre_war_events.46.t: "Муниципалитет Франции мобилизует!"
 pre_war_events.46.d: "Теперь очевидно, что коммуна планировала вступить в войну с Германией, так называемой \"Avricourt massacre\" being nothing more than a convenient excuse! As general mobilisation has been ordered by the \"Comité de Salut Public\", our signal corps units in the West report that massive concentrations of troops, including armoured and motorised formations, have been deployed from Sedan to Montbéliard, while French fortifications near the Flemish border seem to have been significantly reinforced.\n\nAt least one French plane has been shot down above German territory, and a few skirmishes have opposed our soldiers to French units near the Lorraine border. War hawks within the Cabinet and the Kaiser's entourage, encouraged by massive nationalist meetings in all major cities, is eager to rally the troops for war and finish the French off for good. However, some military circles are less than enthusiast, warning that the modern, innovative, well-trained French army is nothing like its battered 1919 counterpart and should not be underestimated."

 pre_war_events.47.t: "Коммунальное сообщество Франции требует компенсации"
 pre_war_events.47.d: "Не удовлетворенный нашими искренними извинениями после инцидента в Аврикуре, коммуна, чьи лучшие разногласия сейчас сосредоточены на нашей границе, сейчас делает вид, что бомбардировка Аврикура, являющаяся преднамеренной агрессией в мирное время, должна быть компенсирована Германией и требует финансовой компенсации за материальный, а также моральный ущерб, причиненный жертвам и французским общественным инфраструктурам."
 pre_war_events.47.a: "У нас нет другого выбора, кроме как подчиниться."
 pre_war_events.47.b: "Откажись!"

 pre_war_events.48.t: "Французская община предлагает прекращение огня"
 pre_war_events.48.d: "Поскольку перестрелки и собачие бои становятся все более частыми, французы выступают с дипломатическими инициативами для обсуждения вопроса о прекращении кризиса в Лоррейне путем переговоров. &quot; Париж &quot; заявляет, что она готова демобилизовать свои войска, за исключением подразделений пограничной охраны, и прекратит оказывать всю поддержку франкоговорящим военизированным формированиям в Лоррейне в обмен на демобилизацию Германии и отступление от французской границы. &quot; Ничего не принимая это предложение, мы сможем восстановить порядок в Лоррейне, и кризис закончится дипломатической победой рейха! &quot; ."
 pre_war_events.48.a: "Принять их предложение."

 pre_war_events.49.t: "Немецкая империя требует компенсации"
 pre_war_events.49.d: "Несмотря на наш жест доброй воли, Германия теперь утверждает, что так называемое \"Mass murder of Elfringen\" has caused heavy material damage to the whole area and that victims have to receive monetary compensations. The German cabinet has publicly demanded that the Commune pays reparations, both in gold and in various raw materials and industrial resources, so that Elfringen and its surroundings can be rebuilt at the French people's expenses.\n\nThis new claim has been met with fierce opposition from the public opinion and radical factions within both the Bourse Générale du Travail and the Army suggest that all negotiations with Germany should be terminated. But the military situation at the German border is undecided as several infantry units near Metz have suffered damage from German artillery gunfire, and our forces might be not in position to successfully engage the Kaiser's army for now..."

 pre_war_events.50.t: "Немецкая империя предлагает прекращение огня"
 pre_war_events.50.d: "Наша тактика воздушного преследования и инфильтрации принесла свои плоды, и немецкое правительство проинформировало председателя Комитета Салюта о том, что оно было готово к переговорам о прекращении огня, при полном отступлении всех немецких войск от границы, демобилизации дивизий Ландвера и политическом урегулировании кризиса в Лоррейне. ~n/n/nЭто очевидная победа для коммуны, поскольку агрессивные империалисты были вынуждены на колени перед трудом рабочих и неостановимой силой крестьян. но мы должны также быть осторожны с уловкой против вероломного генералтаба и забастовкой прежде, чем Германия..."

 pre_war_events.51.t: "Компенсация Германии в связи с инцидентом в Аврикуре"
 pre_war_events.51.d: "Германия, наконец, подала наши законные претензии и выплатит 10 миллионов марок в качестве компенсации за обстрел Аврикура. Правительство Германии также предоставит нам сырье, включая уголь и железную руду, а также машины для целей реконструкции. Несмотря на то, что это решение оставляет униженный и синдикалистский рейх, мстивший и триумфальный, у нас больше нет причин для того, чтобы поддерживать военное давление на границе; начальник штаба объявил, что число военнослужащих, развернутых на немецкой границе, будет нормальным, как только немецкие дивизии будут возвращены с их предыдущих позиций."
 pre_war_events.51.a: "Хорошо."

 pre_war_events.52.t: "Немецкая империя отказалась от компенсации!"
 pre_war_events.52.d: "Немецкая жадность снова была сильнее мудрости."a single pfennig\" and threatened \"to make Paris suffer the same fate as Avricourt if the French do not give up their claims and call back their troops from the Empire's borders!\".\n\nOur plan to drive the German Empire down to diplomatic defeat has failed, and now we are left with two options - facing defeat, while tens of thousands workers are rallying in Paris \"to march on Berlin, the vicious capital of the reaction\" and some top-ranking officers are rumoured to set up a coup against the civilian Comité de Salut Public... or risking war with the German Empire."
 pre_war_events.52.a: "Мы не готовы противостоять."
 pre_war_events.52.b: "Мы должны сплотиться на войну!"

 pre_war_events.53.t: "Компенсация Франции в связи с инцидентом в Эль-Фрингене"
 pre_war_events.53.d: "Похоже, что хоть раз в Париже возобладала причина: община сообщила канцлеру, что наши требования о возмещении будут удовлетворены и что все французские военные действия прекратятся к концу недели. Жертвам будет предоставлена денежная компенсация из фонда &quot; Коммунальные франки &quot; в размере 10 млн. франков, выплачиваемых французами, рейх получит сырье, включая алюминиевые и сельскохозяйственные товары для восстановления. &quot; Коммун &quot; потерпел серьезное дипломатическое поражение и, безусловно, не будет пытаться противостоять рейху в течение нескольких лет; поэтому Кайзер обратился к кабинету с просьбой положить конец военным учениям на французской границе и вывести все войска, которые не были назначены для проведения полицейских операций в Лоррейне."

 pre_war_events.54.t: "Коммун Франции отказался от компенсации!"
 pre_war_events.54.d: "Французским ответом на наши требования о компенсации является рост числа военных действий на нашей границе и террористических нападений в Метце и Страссбурге и угрозы полной войны."we will not pay the barbarian Germans with gold, but with red flags, those very red flags our brave soldiers, with the help of the oppressed German proletariat, will soon raise above Strasbourg, Francfort, Berlin, Munich, Hambourg, Breslau and Königsberg!\".\n\nIn Berlin, as thousands march in the street under \"Nach Paris\" banners, the opposition in the Reichstag denounces \"a spineless, reckless policy\", the Generalstab and the Kaiser remains silent. We now only have to choose between humiliation, political crisis and civil unrest... or risk a war with the Commune."
 pre_war_events.54.a: "Мы не готовы противостоять [FRA.GetNameDef]."
 pre_war_events.54.b: "Мы должны быть готовы, когда они придут!"

 pre_war_events.55.t: "Призыв против побега"
 pre_war_events.55.d: "По мере того, как напряженность между Германией и Францией усиливается, нации ощущают не националистический интерес 1914 года, а скорее растущий страх и пессимизм. Воспоминания о траншях всплывают в умах пожилых граждан. Чтобы спасти Европу от войны, Bund Neyes Vatterland - ведущая антивоенная организация в Германии - обратилась к правительству с просьбой начать мирные переговоры с Францией и Великобританией, чтобы, по крайней мере, попытаться избежать любого конфликта. К числу участников этого выступления относятся видные пацифисты, такие, как Курт Гроссман и Альберт фон Эйнштейн, а также большое число влиятельных деятелей из общественных демократических и христианских демократических кругов. ~ Даже если мы действительно не верим в деэскалацию ситуации, то, возможно, было бы полезно хотя бы попытаться задержать конфликт. Наше военное наращивание задерживается недавними экономическими трудностями, и любое дополнительное время для подготовки является благоприятным. Если мы сможем сохранить мир на западе на какое-то время, возможно, это также будет разоблачать агрессивные постановки России на этот счет."
 pre_war_events.55.a: "Организуйте конференцию."
 pre_war_events.55.b: "Это бессмысленно."

 pre_war_events.56.t: "Германия предлагает оливковый филиал"
 pre_war_events.56.d: "Немецкий посол в Париже пригласил наше правительство принять участие в мирных переговорах, которые должны состояться в [эскалациях_договора_локация. Капитальный капитал. Возьми капитал Victory PointName]. Предлагаемая цель переговоров состоит в том, чтобы избежать новой войны между европейскими великими державами или, по крайней мере, попытаться найти дипломатические решения до того, как весь мир снова обречен на смерть и разрушение. ///, предложение может быть просто игрой в течение времени, но оно собрало довольно мало сочувствия в парламенте, и даже больше в гражданских организациях, таких, как Универсальный Ралли во имя мира. Общее настроение состоит в том, что мы должны, по крайней мере, увидеть, что они могут предложить. В лучшем случае, причина революции может продвинуться вперед без кровопролития, и в худшем случае, некоторое время будет потеряно до того, как произойдет неизбежная конфронтация."
 pre_war_events.56.a: "Прими приглашение."
 pre_war_events.56.b: "Это бессмысленно."

 pre_war_events.57.t: "[Эскалация_договора_местоположение. Капитальный капитал. Получите капитал Victory PointName]"
 pre_war_events.57.d: "Это уже малая победа, которую Германия, Великобритания и Франция согласились провести в мирных условиях. Делегации встретились в [эскалации_treaty_point. Capital. Get Victory PointName], принимающей стороной [эскализации_treaty. Get Header], и решили обсудить наиболее насущные проблемы между странами и найти для них решения. Россия направила наблюдателя, но они осудили переговоры между соответствующими правительствами участников как длинную уловку, которую Германия должна играть в течение длительного времени. [openhagen_conference_austria_wist] Делегация Германии должна была бы возглавиться звездой их дипломатической службы Адольфом Георг фон Малтзаном. Французские и британские делегации возглавляют Леоном Блумом и Харольдом Николсоном соответственно. Несмотря на радикальные разногласия между соответствующими правительствами стран-участников, похоже, что переговоры начались в духе доброй воли."
 pre_war_events.57.a: "Принимается."
 pre_war_events.57.b: "Абсолютно нет."
 pre_war_events.57.c: "Попробуй прийти к компромиссу."

 copenhagen_conference_austria_present: "Австрия, однако, с энтузиазмом поддерживает это мероприятие и представлена харизматичным графом Ричардом фон Куденховом-Калерги, который в течение некоторого времени был одним из ведущих деятелей в составе движений за мир в Пан-Европейском регионе."

 copenhagen_treaty: "[Эскалация_договора_местоположение. Капитальный капитал. Получите капитал Victory PointName]"

 pre_war_events.58.t: "Никакого соглашения достигнуто не было"
 pre_war_events.58.d: "Наши враги выразили свою неприязнь к мирным переговорам и отошли от них. Наша попытка разрядить напряженность, похоже, провалилась из-за их воинственной упрямства."
 pre_war_events.58.a: "Значит, война на всю нашу жизнь."

 pre_war_events.59.t: "Соглашение достигнуто в [эскалации_договора_местоположение."
 pre_war_events.59.d: "После нескольких дней интенсивных дискуссий и многочисленных угроз со стороны французского делегата уйти от переговоров в конечном итоге был достигнут компромисс. Спорное соглашение было достигнуто с облегчением по всей Европе, хотя очень немногие считают, что оно принесет прочный мир. Однако небольшой шаг к тому, чтобы избежать надвигающейся войны, лучше, чем вообще не делать никаких шагов. Несмотря на это, ястребы в Германии и Франции денонсировали договор. Самые громкие голоса в ДВЛП назвали делегацию Германии социалистическими симпатиями и предателями, а более радикальные силы в синдикалистской политике столь же бескомпромиссными. Тем не менее обе стороны обязались, по крайней мере, попытаться следовать деэскалациям, предусмотренным в договоре."
 pre_war_events.59.a: "Удивительно разумно от них."
 KR_copenhagen_conference_success: "Копенгагенская конференция привела к тому, что мировая напряженность снизилась до 75 процентов"

 pre_war_events.100.t: "Охлаждение Аврикура"
 pre_war_events.100.d: "Хаос в Аврикуре! В течение вот уже нескольких недель на франко-германской границе растет напряженность, когда Немцы Хир проходили военные учения в Эльсаё-Лотерингене. В 06 ч. 00 м. по местному времени немецкие артиллерии нанесли удар по французской деревне Аврикур, убивая до 26 человек. В то время как немцы настаивают на том, что удар был несчастным случаем, возмущенные толпы уже начали собираться за пределами немецкого посольства в Париже, поскольку общественное мнение тянет к военной лихорадке. Расписание поездов как в Германии, так и во Франции было отложено, поскольку обе стороны начали развертывать крупные формирования на границе. Несмотря на то, что переговоры на высоком уровне, как ожидается, вскоре начнутся, вероятность войны по-прежнему велика. Мир наблюдает с опущенным дыханием, как Европа вновь впадает в спираль конфликта."
 pre_war_events.100.a: "Немецкая дикарь."
 pre_war_events.100.b: "Типичная французская чрезмерная реакция."
 pre_war_events.100.c: "Только не Июльский кризис!"

 pre_war_events.101.t: "Шеллинг эльфрингенов"
 pre_war_events.101.d: "Хаос в Эль-Фрингене! В течение вот уже нескольких недель на франко-германской границе растет напряженность, когда во Франко-Германской армии были проведены военные учения во Франке-Комте. В 06 ч. 30 м. французские бронированные войска вели перестрелку вблизи немецкого пограничного хижина Эль-Фринген, заблудившись слишком близко от границы с намеченным ими путем. Неясно, какой из первых снимков, но к концу десятки были убиты, а местные силы вступили в вооруженное противостояние. Антифранцузские протесты уже вспыхнули по всей Германии, и ожидается, что вскоре начнутся предварительные переговоры на высоком уровне, и вероятность войны все еще будет большой. Мир наблюдает с опущенным дыханием, как Европа вновь впадает в конфликт."
 pre_war_events.101.a: "Немецкая разведка!"
 pre_war_events.101.b: "Социалистические варвары!"

 pre_war_events.102.t: "Успех Конференции [эскалации_договора_местоположение. Капитальный капитал. Получите капитал Victory PointName]"
 pre_war_events.102.d: "Удивительное соглашение было достигнуто в [эскалации_договора_локация. Капитальный капитал. Получите капитал Victory PointName] после интенсивных переговоров между Германией, коммуной Франции и Союзом Великобритании. Те, кто стремится предотвратить еще одну Вельткриг, организовали конференцию для ослабления напряженности между Великими державами. С помощью посредничества третьей стороны обе стороны согласились ограничить свое военное наращивание на франко-германской границе и ограничить количество стратегических бомбардировщиков и подводных лодок, которые будут работать. / / // int/, intern, internationale согласились уменьшить свою поддержку революционным движениям в Германии, в то время как Германия обещала сократить свое сотрудничество с державами-согласниками. Россия осудила переговоры как попытку Германии играть в течение времени и только увеличила свое военное наращивание."
 pre_war_events.102.a: "Мир вам!"
