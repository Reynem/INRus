### Name and Description ###
#  KR_history_title: "Краткая история"
#  KR_scenario_name: "Наследие Вельткрига"
#  KR_scenario_desc: "На рассвете 1936 года наследие Велткрига лежит на плечах нового поколения. Германия стоит на страже центра мира, власти без сверстника, но вокруг ее ног лежат враги как старые, так и новые; от восходящего синдикалистского интернационала Франции до старой Энтенти, до безукоризненной России и нетерпеливого восходящего солнца. В то время как обширная досягаемость Германии оставила ее опасно перенапряжённой, ее союзники в Константинополе и Вене разошлись, и через Атлантику американский колосс слабеет. Семнадцать лет прошло с момента окончания войны, и немногие ожидают, что новый год принесет поворотный момент, но вскоре все это может стать одной искрой."



