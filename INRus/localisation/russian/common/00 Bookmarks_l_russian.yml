### Other ###
 Debug_KR_gathering_storm_desc: "Если вы видите это, пожалуйста, создайте отчёт об ошибках"

 OTHER_KR_gathering_storm_desc: "Народы мира, большие и малые, ждут, когда их очередь станет основным игроком этого мира, от крупных держав, пытающихся сохранить свои империи, до многих наций, пытающихся вернуть то, что они потеряли во время Великой войны, все они должны будут принять трудные решения и сбалансировать идеалы с прагматизмом, чтобы повлиять на будущее мира..."

CRI_FUHRERREICH_DESC: "После неудачного московского наступления белые силы в Южной России были быстро отброшены обратно в Крыму, только после замены Деникинса Вранжелом и польско-украинского движения белые силы были спасены от полного уничтожения. В 1936 году эти военные правительственные нападки укрепили свои связи с дальневосточной Российской Республикой, надеясь, что однажды их смешанные вооружения попадут под социалистическую угрозу в Москве и освободит Россию."
SAU_FUHRERREICH_DESC: "Сидя в пустынях Аравии, Дом Сауда с возмущением смотрит из Наджда, их объединение под саудовским знаменем было оставлено без внимания, при этом вмешательство сверхдержав оставляло хашимитов и Рашидов нетронутыми в центральной Аравии. Хуже того, они должны притворяться лояльностью к хашимитскому монарху, чье правление в лучшем случае неустойчиво. Но надежда еще не потеряна для саудовцев. Они ждут своего времени, ожидая, когда дом карт рухнет, чтобы они могли заявить о своей судьбе."
ARB_FUHRERREICH_DESC: "Арабское Королевство, родившееся в конце массовых племенных восстаний и британских штыков, простирается от Мосула до Мохи, казалось бы, большой награды для арабов за их жертвы во время Великой войны. За фасадом, Фейсалом и Хашимитской семьей из Хежаза, королевством из стекла, которое угрожает разрушаться в любой момент. Несмотря на то, что жестокий компромисс и поддержка Великобритании сохранили королевство в живых до сих пор, вряд ли королевство сможет выжить, если его внешняя поддержка исчезнет..."
JBS_FUHRERREICH_DESC: "Несмотря на падение на проигрышную сторону Великой войны с баннером Рашиди, привязанным к Османскому султану, династия Рашиди выжила под кожей зубов благодаря слабому контролю хашимитов, конституционной децентрализации и необходимости противовеса в Арабском Королевстве саудовцам. Несмотря на то, что они пережили последнюю войну, так как Арабское Королевство медленно колеблется, им нужно будет подготовиться к последней конфронтации с саудовцами."
SWI_FUHRERREICH_DESC: ""
RHO_FUHRERREICH_DESC: ""
UOB_FUHRERREICH_DESC: "Вы можете играть как §GUnion Великобритании!, начав кампанию как §GBritish Empire§!. Затем вы можете играть их либо после цепочки событий после LSMC, либо потеря 2GW. ~n n n падение мировой сверхдержавы к революции оставило после себя изолированный режим, который смотрит на континент с глубокой враждой. Чтобы выжить, революционеры должны мудро выбирать между абсолютной безопасностью и изоляцией, или мировой революцией."
BEX_FUHRERREICH_DESC: "Вы можете играть как §GBritish Government in-Exile§!, начав кампанию как §GBritish Empire§!. Затем вы можете играть их либо по цепочке событий после LSMC, либо проиграв 2GW. ~n~n now with крушение Британской империи и революция на Островах Дома, то, что осталось от британского правительства и военных застроек в Каире, чтобы вернуться домой. Однако не все хорошо, когда военные и король начинают спорить и появляются новые заговоры внутри города. Тем не менее, по мере того как мир быстро меняется, они должны быстро двигаться, чтобы обеспечить путь обратно в Лондон."
ORL_FUHRERREICH_DESC: "Вы можете играть как §G Commune of France §!, начав кампанию как §G French Republic §!. Затем вы можете играть их после потери 2GW. nn un concured by British-Germany arms, правительство в Париже быстро упало на революцию. С появлением коммуны он смотрит на восток к валькисту, превозносившему Европу с презрением. Это вопрос срочного восстановления и перезарядки, прежде чем Лондон или Берлин перевернут свои мстительные головы обратно во Францию. Независимо от того, будет ли сотрудничество с Москвой или с их собственным континентом, доминирующим международным, французские революционеры должны идти по пути осторожно."
