#Tooltips
PROGRESSIVE_DEMOBILIZATION_TT: "Мы начнем §Y прогрессивную мобилизацию §!, сняв процент военных и гражданских предприятий, основанных на нашей промышленной энергии."

he_events_player.1.d: "Вторая Великая война окончена, но мир задерживает свое дыхание. Разоблаченные конфликтом идеологические разломы лишь углубились, разделив глобус на непримиримые блоки. Прямая конфронтация, возможно, прекратилась, но уже началась новая, более холодная война; соревнование за будущее ведётся в шепоте, угрозах и стычках между посредниками. Наша военная основа должна уступить место новой позиции; демобилизация необходима для сохранения сил на предстоящие неопределенные десятилетия. Эра полной войны, возможно, закончилась, но борьба за господство вечна."

