l_russian:

### Nuclear attacks ###

### Generic Events ###
 nuke_dropped.1.t: "Атомная бомбардировка"
 nuke_dropped.1.d: "В первый и, как хотелось бы надеяться, последний раз в истории в рамках международной войны была взорвана ядерная бомба. Беспрецедентное уничтожение является свидетельством разрушительной силы этого нового оружия, которое опасается не только за то, что оно может сделать с его целями, но и за то, какие последствия оно имеет для того, кто развертывает его, и для самого человечества."
 nuke_dropped.1.a: "Атомная эра действительно началась."
 nuke_dropped.1.b: "Мы сделаем все, что потребуется, чтобы защитить людей."

### Special Events ###
 nuke_dropped.2.t: "Атомная бомбардировка Хиросимы"
 nuke_dropped.2.d: "Улицы были как сцена из ада. -- Несмотря на то, что город был построен для того, чтобы противостоять землетрясениям, в результате взрыва выжило лишь несколько крепких сооружений. -- Несмотря на то, что в общественном сознании была задействована атомная бомба, человеческие издержки оружия были сведены на нет. Ни одна из сторон не хочет поразмыслить над ужасом этого события, но его наследие будет одним из человеческих жертв при мгновении глаз и долгосрочных выпадов."
 nuke_dropped.2.a: "Сколько еще упадет до окончания этой войны?"
 nuke_dropped.2.b: "Мы должны действовать быстро, чтобы помочь жертвам."

 nuke_dropped.3.t: "Атомная бомбардировка Нагасаки"
 nuke_dropped.3.d: "Сегодня над городом Нагасаки была взорвана ядерная бомба."
 nuke_dropped.3.a: "Не приведет ли это к тому, что мы станем мусульманами?"
 nuke_dropped.3.b: "Мы надеялись, что Нагасаки будут спасены."

 nuke_dropped.4.t: "Атомная бомбардировка Берлина"
 nuke_dropped.4.d: "Сегодня в [GetDateText] немецкая имперская столица Берлина была поражена ядерным взрывом. Город пострадал от нескольких нападений, в ходе этой и последней войны, но все остальное бледно по сравнению с этим. С тех пор, как в ходе 30-летней войны в Берлине произошло сопоставимое разрушение - учитывая его рост, - это считалось невозможным. ~nn/Berliner Stadtsloss, как представляется, пережил взрыв, по крайней мере частично из-за взрыва бомбы, взорвавшейся в его запланированном эпицентре, и Kaiser [от.Owner. Gethewideer], как, по слухам, все еще живы, если его возмущать. Как [от.Owner. Getadqutionive] лидеры должны быть эвакуированы и если они могут быть защищены от падений, то это другое дело."
 nuke_dropped.4.a: "Сегодня я рад, что не стал Берлинером."
 nuke_dropped.4.b: "Наши враги ударили по сердцу нации!"

 nuke_dropped.5.t: "Атомная бомбардировка Лондона"
 nuke_dropped.5.d.ENG: "Ядерный взрыв опустошил город Лондон сегодня. Несмотря на противовоздушную оборону города, [от .Owner.GetName] не был подготовлен к этому нападению. В [Гетатетектекс] Биг Бен в последний раз был расплавлен взрывом. Ранние сообщения указывают на то, что TUC был полностью выровнен, а местонахождение правительства в настоящее время неизвестно."
 nuke_dropped.5.d.GBR: "Ядерный взрыв опустошил город Лондон сегодня. Несмотря на противовоздушную оборону города, [от .Owner.GetName] не был подготовлен к этому нападению. В [Геттетекс] Биг Бен химид в последний раз, когда он был расплавлен взрывом. Ранние сообщения указывают на то, что Букингемский дворец был полностью выровнен, а местонахождение королевской семьи в настоящее время неизвестно."
 nuke_dropped.5.a: "Давайте раз и навсегда выпустим Скарлет Фантом перед лицом ядерной взрывной волны."
 nuke_dropped.5.b: "Мы снова восстанем из пепла!"
 nuke_dropped.5.c: "Сложно сохранить жесткую верхнюю губу перед лицом ядерной взрывной волны."
 nuke_dropped.5.d: "Боже, спаси короля!"

 nuke_dropped.6.t: "атомных бомбардировок Киото"
 nuke_dropped.6.d: "Город Киото, известный промышленный центр [от .Owner.Getaductive], был поражён сегодня ядерной бомбой. Предположительно, город был выбран в качестве цели, поскольку он считается интеллектуальным центром. Несмотря на то, что красота и историческое значение Киото побудили многих предположить, что он будет избавлен от этой бомбы, но, как представляется, страх, связанный с дождём на этом месте, скорее рассматривается как выгода, усиливающая психологическое воздействие нападения. Месторасположение города в долине несколько ограничило взрыв, но старый Имперский дворец и многие промышленные здания были полностью разрушены."
 nuke_dropped.6.a: "Наследие и красота ничего не значат в такой войне."
 nuke_dropped.6.b: "Если они уничтожат старое, мы построим новое."

 nuke_dropped.7.t: "Атомная бомбардировка Токио"
 nuke_dropped.7.d: "Сегодня ядерный удар был направлен в сердце Японии. Столица Токио, хотя, как ожидалось, и является объектом обстрела, никогда не считалась приоритетной целью этого нового оружия. Однако в конечном итоге, возможно, из-за значимости новой столицы и императорского дворца, которые сейчас были разрушены, на город упал еще более потребляющий все силы огонь."
 nuke_dropped.7.a: "Значит ли это конец Японии?"
 nuke_dropped.7.b: "До тех пор, пока [от овнера. Возьмите лидера] живёт, так же как и народ."

 nuke_dropped.8.t: "Атомная бомбардировка Вашингтона, округ Колумбия."
 nuke_dropped.8.d: "Сегодня над столицей Соединенных Штатов была взорвана ядерная бомба. В результате нападения, которое было явно направлено на политический центр и историческое наследие США, Белый дом, Капитолий и ряд памятников и мемориалов были стерты с лица Земли. Даже сожжение Вашингтона более века назад бледно по сравнению с разрушениями, которые нанесло на город это разрушительное оружие. Несмотря на то, что президент [от .Owner.Geteder] был в безопасности, нация была потрясена до глубины души. Без сомнения, США надеялись, что они станут первой и единственной страной, владеющей таким оружием. Эти надежды были разрушены самым худшим возможным образом."
 nuke_dropped.8.a: "Одна нация, неделимая, против одного атома, дивидендная."
 nuke_dropped.8.b: "Орел восстанет из пепла, как феникс."

 nuke_dropped.9.t: "Атомная бомбардировка Рима"
 nuke_dropped.9.d: "Сегодня в городе Рим обрушился ядерный взрыв, шокирующий людей во всем мире. Благодаря его историческим и художественным сокровищам многие никогда не думали, что древний город станет объектом такого неизбирательного уничтожения. Апостольский дворец также частично уничтожил Папу живым, но в плохом состоянии это событие потрясло не только итальянцев, но и католиков во всем мире. Быстрый рост Рима за последнее десятилетие был почти полностью сведен на нет в результате нападения. Какое-то время казалось, что город мог бы помочь стране восстановиться после окончания войны. Эти надежды теперь превратились в пыль, вместе со многими людьми."
 nuke_dropped.9.a: "Бомба Иакта Эст!"
 nuke_dropped.9.b: "Рим не будет восстановлен в один день..."

 nuke_dropped.10.t: "Атомная бомбардировка Парижа"
 nuke_dropped.10.d: "Сегодня над парижским городом было взорвано ядерное устройство, что привело к массовым разрушениям и бесчисленным жертвам. Франция была в шоке, поскольку ее столица пострадала от самого разрушительного нападения, которое она когда-либо пережила, несмотря на столетия войн и революций. Парижцы, возможно, ожидали завоевания, но не безжалостного, жестокого опустошения. Ни один победный парад в Champs-Elysees в прошлом, останки "Arc de Triomphe" в нынешнем состоянии города, возможно, в предстоящие десятилетия рождение нового Парижа, но Париж в общественном сознании, город, построенный в Белле Эпоке, исчезнет навсегда."
 nuke_dropped.10.a: "Город света сгорел."
 nuke_dropped.10.b: "Только вчера казалось, что у нас всегда будет Париж."

 nuke_dropped.11.t: "Атомная бомбардировка Москвы"
 nuke_dropped.11.d: "Взрыв был направлен на историческое сердце города, и Кремль был почти полностью разрушен взрывом. Несмотря на то, что он стал более осведомленным и опасающимся всех возможных и невозможных угроз в последнее время, он был эвакуирован во времени и выжил. Однако даже огромных размеров [от Унера Гетнама] может быть недостаточно для того, чтобы избежать такого безжалостного врага. Действительно, если это будет продолжаться, то в скором времени нация будет состоять только из двух видов пустынных земель: тех, которые были на первом месте, и тех, которые были созданы ее врагами."
 nuke_dropped.11.a: "Разве ядерная зима не сделает Москву более трудной целью?"
 nuke_dropped.11.b: "Они могут сжечь все наши города, но они никогда их не заберут."

 nuke_dropped.12.t: "Атомная бомбардировка Копенгагена"
 nuke_dropped.12.d: "Сегодня город Копенгаген был поражён ядерным взрывом. После того как ему удалось избежать разрушения в Вельткриге, благодаря нейтралитету Дании, в столице никогда не было нападения, близкого к этому разрушительному со времен Наполеоновских войн. В окрестностях Оресунда также произошли значительные выпады, и выжившие стали бежать к Фину и материку, боясь дальнейших атак. На сегодняшний день местонахождение Кристиана Х неизвестно, и дух нации был серьезно поврежден в результате этого нападения. Пока не ясно, является ли это началом конца для одной из старейших стран Европы."
 nuke_dropped.12.a: "Что-то облучено в Дании."
 nuke_dropped.12.b: "Город сгорел раньше, но не погиб."

 nuke_dropped.13.t: "Атомная бомбардировка Стокгольма"
 nuke_dropped.13.d: "Прекрасный город Стокгольм, гордая Венеция Севера, был поражён сегодня ядерной бомбой. Несмотря на все их усилия оставаться нейтральными в прошлом, шведы теперь заплатили самую высокую цену за международный конфликт. Эпицентр взрыва находился в центре южного центра Стокгольма, района, предназначенного для будущего развития и крупных строительных проектов, который сейчас необратимо разрушен. ~nnnmuch of the города невозможно признать, но старые сооружения в Слуссене, похоже, пережили взрыв лучше, чем ожидалось. Было решено, что он должен оставаться нетронутым навсегда, как памятник жизнестойкости города."
 nuke_dropped.13.a: "С этим шведский нейтралитет будет лишь воспоминанием."
 nuke_dropped.13.b: "Шведский тигр не потеряет своих полосок!"

 nuke_dropped.14.t: "Атомная бомбардировка Бангкока"
 nuke_dropped.14.d: "Прекрасный город Бангкок, гордая Венеция Востока, был поражён ядерной бомбой сегодня в [GetDateText]. Считается, что эпицентр находится рядом с Большим дворцом, уничтожая многовековые культурные артефакты, в том числе изумрудный Будда."
 nuke_dropped.14.a: "Означает ли это конец независимости [ОИА."
 nuke_dropped.14.b: "Мы не сдадимся иностранному империалисту!"

 nuke_dropped.15.t: "Атомная бомба над Семипалатинском"
 nuke_dropped.15.d: "Русские успешно взорвали атомную бомбу на своем полигоне Семипалатинска. Фотографии грибного облака над казахской степью распространяются, как лесный огонь, как доказательство российского технологического чудеса. В результате взрыва остался стеклянный облученный кратер глубиной в 1,5 метра, и ударная волна все еще причиняла частые повреждения в тысячах миль от эпицентра. ~ ~n no в официальном адресе [RUS_руководитель] [? global.russia. Gete Header] объявил миру, что Россия теперь обладает атомным оружием и способностью производить больше из него. С самым мощным оружием в истории человечества в руках России, можно только надеяться, что они будут использовать его ответственно."
 nuke_dropped.15.a: "Ужасная сила."
