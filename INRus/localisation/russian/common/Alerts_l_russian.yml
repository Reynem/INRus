l_russian:

#######################
### Faction Joining ###
#######################

 faction_joining_alert_title: "Передача от [THIS. GetNameDef]"
 faction_joining_alert_message: "§Y [This. GetName] §! присоединился к § § § § § § § §. GetFactionName]!"

#Generic

 faction_joining_alert_pre_acw: "Баланс сил начал меняться, напрягая деликатный пост-Велткригский порядок, который Германия долгое время пыталась построить."
 faction_joining_alert_acw: "С вспышкой войны в Северной Америке баланс сил внезапно и, возможно, безвозвратно изменился, и это будет иметь последствия для региона и за его пределами."

 faction_joining_alert_pre_wk: "С ростом геополитических блоков нарастает напряженность, и многие другие страны в настоящее время сталкиваются с трудным выбором в плане согласования."
 faction_joining_alert_weltkrieg: "Даже во время войны существует баланс сил, меняющийся с каждой минутой."

 faction_joining_alert_post_wk_internationale: "Сейчас, когда доминирование Германии, несомненно, нарушено, многие уже смотрят в будущее."
 faction_joining_alert_post_wk_germany: "Даже с немецким оружием, снова победившим в Европе, мир не такой, как до Второй Велткриг. Одно соглашение за раз, будущее разворачивается."
 faction_joining_alert_post_wk_entente: "Победа Энтента, несмотря на все шансы, заменила новое на старое."
 faction_joining_alert_post_wk_other: "Со старым мировым порядком, который сейчас лежит в руинах, из пепла поднимаются новые силы."

#North America
 faction_joining_USA_ENT: "Хотя Соединенные Штаты едва оправились от гражданской войны, они решили присоединиться к [CAN.GetNameDef] в своем стремлении освободить свою родину и Европу от синдикалистического подхода."
 faction_joining_USA_GER: "Хотя Соединенные Штаты едва оправились от гражданской войны, они решили присоединиться к Рейхспакту из-за общей ненависти к синдикативизму."

 faction_joining_WCA_INT: "Теперь, когда [WCA.GetNameDef] стоят победителями в Америке, они встали на путь Европы, официально присоединившись к коллективистскому альянсу. Реакции дрожат, когда промышленная мощь Америки перенаправляется на революцию."

#Central America
 faction_joining_COS_GER: "С помощью кофейных баронов ZKG был подписан договор о военной помощи с [THIS.fact_cheder.GetFactionName] вместе с доступом на военно-морские объекты Пуэрто-Лимона."
 faction_joining_COS_ENT: "Будучи брошенным их союзником в Вашингтоне, Сан-Хосе был вынужден смотреть дальше на север, чтобы обеспечить защиту от своих более хищнических соседей."

#South America
 faction_joining_ARG_GER: "После успешного заключения торгового соглашения и осуществления военного сотрудничества между двумя странами [THIS.Get Header] объявил о своем участии в [THIS.fact_der.GetFactionName]"
 faction_joining_ARG_ENT: "Через умелую дипломатию [THIS.Get Header] и [THIS.faction_lider.GetName] разрешили кризис Мальвинских островов из-за островов, отложив свои разногласия в сторону общей угрозы."

#Western Europe
 faction_joining_BEL_GER: "Согласно Арлонскому договору, новорожденная нация Бельгии официально присоединилась к [THIS.fact_leader.GetFactionName], чтобы защитить свой суверенитет от ястребов-коммунистов."
 faction_joining_BEL_ENT: "Союзники на Изере во время Велткрига и связанные кровью с британской короной, Ван Бельгии бросили свою судьбу со своими давними союзниками, чтобы обеспечить их выживание."
 faction_joining_BEL_INT: "Старый Орден рушится, разваливается [ГЕРН.Геам], поднимет вас, жертв угнетения, и свергнет Гиганта в отместку за 1914 год!"

 faction_joining_IRE_GER_IRE_victory: "Из-за британской провокации [RIE.GetName] официально оформили свой союз с [GER.GetNameDef], присоединившись к [GER.GetFactionName], надеясь, что Кайзер сможет защитить их от коллективных махинаций."
 faction_joining_IRE_GER_GER_victory: "С тем, что правительство [IAR.GetAmeDef] рушится от внутренних беспорядков, [GER.GetNameDef] оказывает значительное политическое влияние на страну, \"protecting it from instability and collectivist advances\" by installing a new [GER.GetAdjective]-aligned regime."
 faction_joining_IRE_INT_IRE_victory: "В серии неверных результатов правящая социалистическая коалиция [IRE.GetNameDef] увидела надпись на стене и официально присоединилась к [INT.GetFactionName], чтобы избежать полной глобальной изоляции."
 faction_joining_IRE_INT_ENG_victory: "После нескольких месяцев растущего влияния коллективистов и внутренней борьбы [IAR.Getaductive] крах правительства приводит к [ENG.GetAductive] поддерживаемому социалистическому перевороту, при этом новое [RIE.GetAductive] правительство согласуется с Интернационалом и поддерживается [ENG.GetAductive] оружием."
 faction_joining_IRE_INT_puppet: "Чтобы избежать ошибок своих предшественников, [ENG.GetAditive] признались в [ENG.GetFaction Name] после создания социалистического правительства."
 faction_joining_IRE_ENT: "Пытаясь успокоить отношения с северными лоялистами и занять твердую позицию против глобального синдикализма, [IAR.GetNameDef] опротестовал шансы и переместил прошлые исторические претензии, перестроившись с их бывшими британскими хозяевами."
 faction_joining_IRE_ENT_desperate_measures: "Во время последней попытки выжить после падения их союзников, Гет Наме Деф воссоединился с их единоразовыми хозяевами и вступил в новый союз с ними."
 faction_joining_IRE_ENT_USA: "Пытаясь успокоить отношения с северными лоялистами и занять твердую позицию против глобального синдикализма, [ИРЕ.Гет Наме Деф] объединился с возрождающимися Соединенными Штатами, возглавляя в настоящее время военный союз бывших товарищей их господина из Вельткрига."
 faction_joining_IRE_ENT_USA_desperate_measures: "В последней попытке выжить после падения их союзников [GER.Get Adquesty], [RIE.GetNameDef] воссоединились со своими бывшими товарищами-мастерами, сейчас возглавляемыми возрождающимися Соединенными Штатами."
 faction_joining_IRE_ENT_natpop: "Под влиянием комплексных идеалов и стремления установить более тесные связи со своими соотечественниками-католическими братьями во Франции и Португалии [IRE.GetNameDef] присоединился к [ЕНТ.GetFactionName], несмотря на взаимное недоверие между островной нацией и их бывшими хозяевами, возглавлявшими альянс."
 faction_joining_IRE_RUS: "В остальном только в мире, и под угрозой коллективного господства после падения [GER.GetNameDef], [IRE.GetNameDef] вступил в маловероятное объединение с [RUS.GetNameDef]."
 faction_joining_IRE_JAP: "Вслед за своими американскими союзниками [IAR.GetNameDef] расширило значение термина «Восточная Азия», вступив в маловероятное объединение с [JAP.GetNameDef]."

 faction_joining_POR_ENT: "Из-за долгих связей [POR.GetName] с королевской семьей в Оттаве они официально присоединились к Энтенте, дав Канаде трассу в Европе для запланированного рекогносцировки их островов."

#Northern Europe
 faction_joining_SWE_GER: "С долгой историей экономических связей с Берлином и ростом радикализма в регионе [SWE.GetName] официально присоединился к Рейхспакту."
 faction_joining_SWE_INT: "После свержения шведского правительства [SWE.Get Header] они официально присоединились [SWE.GetNameDef] к Парижу, присоединившись к Третьему Интернационалу."

 faction_joining_FIN_GER: "С угрозой возвращения России своих европейских территорий [FIN.Get Header] укрепили свои отношения с Рейхспактом, надеясь, что они смогут обеспечить столь необходимую безопасность для маленькой нации."
 faction_joining_FIN_INT: "После свержения монархии [FIN.Get Header] они присоединились к всемирному коллективистскому движению и официально присоединились к Третьему интернационалу."

 faction_joining_NOR_INT: "После свержения монархии новое норвежское коалиционистское правительство официально присоединилось к Третьему интернационалу."
 faction_joining_NOR_ENT: "С непосредственной угрозой внутреннего радикализма [NOR.GetName] согласуется с Энтези."

 faction_joining_SWI_AUS_peace: "Хотя на данный момент французская угроза может быть ослаблена, Швейцария официально присоединилась к альянсу Австрии для обеспечения мира и стабильности в будущем."
 faction_joining_SWI_AUS_war: "С развитием французского конфликта Швейцария решила официально присоединиться к альянсу Австрии, на случай, если кто-то подумает, что он все еще нейтральный."
 faction_joining_SWI_GER_peace: "Хотя французская угроза временно утихла, Швейцария решила присоединиться к Рейхспакту, чтобы обеспечить будущий мир и безопасность."
 faction_joining_SWI_GER_war: "С развитием войны против синдикалистов Швейцария решила официально присоединиться к Рейхспакту, только еще больше присоединив их к Немецкой империи."
 faction_joining_SWI_INT: "После синдикалистской революции в Швейцарии временное правительство решило присоединиться к третьей международной организации, официально оформив и без того тесные отношения между коммуной Франции и [SWI.GetNameDef]."

#Southern Europe
 faction_joining_ITA_AUS: "С учетом радикализма Сиано, содержащегося в урне для голосования, [ITA.GetNameDef] официально присоединился к оборонному пакту Австрии."

#Eastern Europe

#Balkans
 faction_joining_GRE_BPL: "Из-за общей ненависти к растущей власти Болгарии Греция решила присоединиться к Белградскому пакту с Сербией, с тем чтобы раз и навсегда уничтожить Болгарию."
 faction_joining_GRE_ENT: "Союзники во время Велткрига [GRE.GetNameDef] официально обратились с просьбой о возвращении в Канаду в Контенте, предоставив блоку силовую базу на Балканах."

 faction_joining_ROM_BPL: "Чтобы сдержать растущую мощь Австрии и Болгарии, Румыния присоединилась к Белградскому пакту."

