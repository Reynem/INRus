#East Asia
 faction_joining_SHX_QIE: "После автоперегонки, проведенной Пуйи с помощью [SHX.GetNameDef], [SHX.Get Header] вмешался против остатков клики Жили, официально присоединившись к Пекину."

 faction_joining_SHD_QIE: "После автоперегонки, проведенной Пуйи с помощью [SHD.GetNameDef], [SHD.Get Header] вмешался против остатков клики Жили, официально присоединившись к Пекину."

 faction_joining_ANQ_QIE: "После успешной поддержки Ву Пейфу борьбы [ANQ.GetNameDef] против [LEP.GetNameDef] губернатор Чэнь Тяюань присоединился к Северной Жили Клике."

 faction_joining_RKMT: "Закрепив свои старые южные опоры, правый KMT сливается под одним знаменем, а когда они поворачиваются на север, Китай задается вопросом, смогут ли они преуспеть там, где Чианг провалился..."

