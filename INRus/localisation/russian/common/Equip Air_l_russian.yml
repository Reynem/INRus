 ### JAP - Japan ###
 ###

 JAP_CAS_equipment_1: "Кавасаки Ки-32"
 JAP_CAS_equipment_1_short: "Ki-32"
 JAP_CAS_equipment_1_desc: "Ki-32 является успешным ответом Kawasaki на тендер Имперской японской армии на совершенно местный самолет, спроектированный и построенный на нем. Этот самолет сопоставим с немецким Hs 123 с точки зрения мощности с аналогичной скоростью, высотой эксплуатации и полезной нагрузкой."
 JAP_cv_CAS_equipment_1: "Айти D1A2"
 JAP_cv_CAS_equipment_1_short: "D1A2"
 JAP_cv_CAS_equipment_1_desc: "D1A является последним японским самолетом, спроектированным зарубежной компанией, так как Айти попросила Хансу-Бранденбург оказать помощь в процессе проектирования. D1A произвела D1A2, усовершенствовала аэродинамические системы и моторизовала более мощным двигателем. Замедление внедрения следующего Aichi D3A означало, что он хорошо работал в конце 1930-х годов, когда он был значительно устаревшим."
 JAP_CAS_equipment_2: "Мицубиси Ки-51"
 JAP_CAS_equipment_2_short: "Ki-51"
 JAP_CAS_equipment_2_desc: "Последователем Ki-32 Ki-51 стал более мощный двигатель, но при этом в основном с одним и тем же воздушным корпусом и по-прежнему используются неотвлекаемые посадочные снаряды. Несмотря на устаревшие характеристики, самым важным элементом спасения Ki-51 было то, что он смог взлететь с неровных аэродромов на Тайване, Корее и Китае, когда многие другие самолеты не могли, будучи установленными при непосредственной поддержке самолетами Японии."
 JAP_cv_CAS_equipment_2: "Айти Д3А"
 JAP_cv_CAS_equipment_2_short: "Д3А"
 JAP_cv_CAS_equipment_2_desc: "Из-за обширных проблем, возникших в первом прототипе, Aichi D3A не был принят в эксплуатацию до 1939 года. Пересмотренный самолёт оказался лучше, чем самолет Nakajima D3N1, но некоторые направления оставались нестабильными до 1940 года. После решения этой проблемы D3A была признана весьма маневрируемой по сравнению с другими самолетами, выполнявшими аналогичные функции, особенно самолетами, используемыми Имперской японской армией."
 JAP_CAS_equipment_3: "Маншю Ки-98"
 JAP_CAS_equipment_3_short: "Ki-98"
 JAP_CAS_equipment_3_desc: "Нетрадиционно спроектированный Ki-98 использует систему гребного гребня-толкач и двигатель мощностью 2000 лошадиных сил Mitsubishi для достижения максимальной скорости в 730 км/ч. Первоначально спроектированный в качестве высоковысотного перехватчика, его высокоэффективная система управления также сделала его пригодным для наземной атаки, а 37-мм пушка, установленная в носу, оказалась более чем способной атаковать бронежилеты в Китае и Южной Азии."
 JAP_cv_CAS_equipment_3: "Ёкосука D4Y Suisei"
 JAP_cv_CAS_equipment_3_short: "D4Y Suisei"
 JAP_cv_CAS_equipment_3_desc: "Спрос и проектирование нового взрывателя ныряльщика, способного к погружению, начались в 1940 году, однако нехватка специалистов по дизайну значительно задержала внедрение D4Y Suisei. Первые прототипы использовали сомнительный немецкий встроенный двигатель, в то время как позднее модели вернулись к радиальным двигателям. Небольшая и весьма упорядоченная фюзеляжка позволила ему достичь высоких скоростей в горизонтальных полетах и в ныряльщиках. Это в сочетании с отличной маневренностью дало современным бомбардировщикам ныряния более высокие показатели работы Suisei, что привело лишь к потере полезной нагрузки."

 JAP_fighter_equipment_0: "Тип 91"
 JAP_fighter_equipment_0_short: "Тип 91"
 JAP_fighter_equipment_0_desc: "Разработанный в 1935 году тип 91 страдал от многочисленных первоначальных проблем с зубами, связанных с недостаточной устойчивостью направления и центром тяжести, что вызвало задержку в работе до конца 1935 года и только в 1936 году приступило к широкомасштабной службе."
 JAP_cv_fighter_equipment_0: "Накаджима А4Н"
 JAP_cv_fighter_equipment_0_short: "A4N"
 JAP_cv_fighter_equipment_0_desc: "Командир и пилоты отдали предпочтение более обычному дизайну биплана, даже если он пожертвовал производительностью, по сравнению с прототипом 7-ши Мицубиси, который разбился во время испытаний."
 JAP_fighter_equipment_1: "Накаджима Ки-27"
 JAP_fighter_equipment_1_short: "Ki-27"
 JAP_fighter_equipment_1_desc: "В то время как была введена модель 91, Имперская японская армия уже искала замену моноплана, но с тем же вооружением двух легких пулеметов. &quot; Ки-27 &quot; оказалась в состоянии поворачиваться так же жестко, как и предыдущий тип 91 с низкой погрузкой крыла при одновременном ускорении."
 JAP_cv_fighter_equipment_1: "Mitsubishi A5M"
 JAP_cv_fighter_equipment_1_short: "A5M"
 JAP_cv_fighter_equipment_1_desc: "После того как Mitsubishi выпустила разочаровывающий прототип для 7-шийского истребителя, он усовершенствовал дизайн и выпустил A5M. Новый самолёт имел тонкие эллиптические, перевернутые крылья чаек и фиксированный подвоз, став одним из первых монопланов, которые были развернуты наверху."
 JAP_fighter_equipment_2: "Накаджима Ки-43 &lt; &lt; Хаябуса &gt; &gt;"
 JAP_fighter_equipment_2_short: "Ki-43 &lt; &lt; Хаябуса &gt; &gt;"
 JAP_fighter_equipment_2_desc: "Впервые построенный в 1939 году, Ki-43 был разочарованием для многих пилотов, но постепенная серия модификаций истребителя значительно улучшила его производительность, что сделало его самым популярным наземным истребителем Императорской японской армии с высоким уровнем роста и маневренности. Однако, несмотря на изменения, мало что было сделано для улучшения огневой мощи &lt; &lt; Хаябузы &gt; &gt; , поскольку она установила только два пулемета калибра."
 JAP_cv_fighter_equipment_2: "Mitsubishi A6M Rei-sen"
 JAP_cv_fighter_equipment_2_short: "A6M Rei-sen"
 JAP_cv_fighter_equipment_2_desc: "Так же, как революционный Mitsubishi A5M начал работать, IJN начал искать преемника, с подробными спецификациями, призывающими к высокоспособному и хорошо вооружённому истребителю. Накаджима вышла из конкурса после изучения спецификаций, а Мицубиси продолжил свою деятельность. A6M улучшила A5M во всех, кроме малой скорости маневренности, впечатляя военно-морских пилотов общими выдающимися возможностями."
 JAP_fighter_equipment_3: "Накаджима Ки-84 &lt; &lt; Хайате &gt; &gt;"
 JAP_fighter_equipment_3_short: "Ki-84 &lt; &lt; Хайат &gt; &gt;"
 JAP_fighter_equipment_3_desc: "Несмотря на высокую оценку, которую получила &lt; &lt; Хаябуса &gt; &gt; Ки43, пилоты сообщили о разочаровании по поводу выживаемости, скорости и вооружений. &lt; &lt; Ки-84 &gt; &gt; была разработана для решения этих проблем и добилась успеха в выполнении своей роли. &lt; &lt; Ки-84 &gt; &gt; , вооружённая до четырех 20мм пушками, по сообщениям, является одним из лучших бойцов своего времени, которые могли бы пилотировать."
 JAP_cv_fighter_equipment_3: "Мицубиси А7М Реппю"
 JAP_cv_fighter_equipment_3_short: "А7М Реппю"
 JAP_cv_fighter_equipment_3_desc: "Амбициозные адмиралы императорского японского флота отправили тендер на еще более мощное воздушное судно, чем A6M Rei-sen, вскоре после его введения. &lt; &lt; Мицубиси &gt; &gt; ответил на это предложение: &lt; &lt; Реппу &gt; &gt; , с более широким диапазоном крыльев, более мощным двигателем и значительно более мощным вооружением по сравнению с A6M."
 #Nakajima Kikka:
 JAP_jet_fighter_equipment_1: "Nakajima J9N Unryeu"
 JAP_jet_fighter_equipment_1_short: "J9N Нерайю"
 JAP_jet_fighter_equipment_1_desc: "После того, как немецкий перебежчик представил японским разведчикам фотографии и предварительные проектные планы Bf 262, ИЯНАФ проявил большой интерес. &quot; Накаджима &quot; , получив копию этих документов, попыталась построить свою собственную. &quot; Ишикаваджима &quot; сотрудничала с Ишикаваджимой в строительстве турбоджитского двигателя Ne-20, и разработала более обычный самолет по сравнению с Bf 262 с прямыми крыльями и более аэродинамическим фюзеляжем. &quot; J9N Unryçe &quot; была поверхностно похожа на &quot; Bf 262, но в противном случае была полностью местной конструкцией &quot; ."
 JAP_jet_fighter_equipment_2: "Шинден-Кай"
 JAP_small_plane_airframe_5: "Шинден-Кай"
 JAP_jet_fighter_equipment_2_short: "J7W Шинден-Кай"
 JAP_small_plane_airframe_5_short: "J7W Шинден-Кай"
 JAP_jet_fighter_equipment_2_desc: "J7W Shinden была разработана для установки радиального двигателя, но была также учтена возможность установки турбоджитного двигателя, как, например, Ishikawajima Ne-20, который все еще проходит испытания. Когда турбоветные двигатели доказали свою ценность для J9N Unryu, концепция была реализована, и J7W1 установил усовершенствованные двигатели Nakajima Ne-230 с усовершенствованием вооружения истребителя в виде еще одной пары 30-мм пушек."

 JAP_small_plane_naval_bomber_airframe_1: "Mitsubishi G3M1"
 JAP_small_plane_naval_bomber_airframe_1_short: "G3M1"
 JAP_small_plane_naval_bomber_airframe_1_desc: "После того как Mitsubishi заключил сделку с адмиралом Ямамото Исороку за поддержку проекта G3M из-за его разочаровывающего первого полёта, G3M1 была выпущена. Были внесены изменения, позволяющие ему перевозить торпеды в дополнение к стандартной полезной нагрузке бомб. После внесения изменений скорость и дальность G3M1 были неубедительны с помощью любого другого самолета большой мощности."
 JAP_cv_small_plane_naval_bomber_airframe_1: "Накаджима B5N"
 JAP_cv_small_plane_naval_bomber_airframe_1_short: "B5N"
 JAP_cv_small_plane_naval_bomber_airframe_1_desc: "B5N является первым торпедным бомбардировщиком одного крыла Имперского Японского ВМС, который оказался значительно быстрее других находящихся в эксплуатации моделей, но также весьма уязвим к вражеским обстрелам. Он был легко вооружен только одним пулеметом противника, но грузоподъемность и скорость самолета оставались весьма конкурентоспособными среди современников."
 JAP_small_plane_naval_bomber_airframe_2: "Mitsubishi G4M"
 JAP_small_plane_naval_bomber_airframe_2_short: "G4M"
 JAP_small_plane_naval_bomber_airframe_2_desc: "Еще одна разработка на G3M, требующая еще большей дальности и более высокой скорости, G4M оказалась достойным преемником. Она смогла нести больше полезной нагрузки, чем G3M, а также могла достичь более высокой высоты и скорости."
 JAP_cv_small_plane_naval_bomber_airframe_2: "Накаджима В6Н Тензан"
 JAP_cv_small_plane_naval_bomber_airframe_2_short: "B6N Тензан"
 JAP_cv_small_plane_naval_bomber_airframe_2_desc: "Дизайн B6N был основан на его предшественнике B5N, повышая скорость и емкость полезной нагрузки без существенного изменения корпуса. Двигатель был заменен моделью Mitsubishi, которая улучшила скорость Тензана, но мало что сделала для того, чтобы исправить слабые оборонительные вооружения и уязвимость перед вражеским огнем."
 JAP_small_plane_naval_bomber_airframe_3: "Йокосука P1Y Ginga"
 JAP_small_plane_naval_bomber_airframe_3_short: "P1Y Ginga"
 JAP_small_plane_naval_bomber_airframe_3_desc: "В соответствии с техническими требованиями 15-ши для проектирования потребовался бомбардировщик, способный сопровождать истребителей A6M Rei-sen с таким же вооружением, что и предыдущая G4M. P1Y Ginga была бы весьма упорядочена, что позволило бы ему достичь скорости, соперничающей с одним двигателем во время испытаний. Этот самолет служил бы главным образом морским бомбардировщиком наземного базирования с альтернативами в качестве ночного истребителя и перехватчика в связи с высокой скоростью."
 JAP_cv_small_plane_naval_bomber_airframe_3: "Айти Б7А Рюсей"
 JAP_cv_small_plane_naval_bomber_airframe_3_short: "B7A Рюсей"
 JAP_cv_small_plane_naval_bomber_airframe_3_desc: "B7A Ryesei был разработан для использования на борту нового поколения японских авианосцев. Отличительная перевернутая чайная крыло позволяла ему нести ту же полезную нагрузку, что и B6N Tenzan, но на значительно более высокой скорости с гораздо более реагирующими контрольными поверхностями. Это также нарушило традицию Японии не устанавливать оборонительное вооружение в направлении вперед на атакующем самолете, с двумя 20-ммиллиметровыми пушками, размещенными на крыле."

 JAP_heavy_fighter_equipment_1: "Кавасаки Ки-38"
 JAP_heavy_fighter_equipment_1_short: "Ki-38"
 JAP_heavy_fighter_equipment_1_desc: "Компания &quot; Ки-38 &quot; являлась частным предприятием компании &quot; Кавасаки &quot; в ответ на разработку в Европе тяжелых истребителей с двумя двигателями, таких, как Bf 110. &quot; ИДЖ &quot; была проинформирована о конструкции и проинспектировала деревянный макет, и она приказала построить и проверить номер самолета. &quot; Первичные испытания &quot; показали, что самолет был сильно слаб, что было несколько исправлено за счет установки самолета &quot; Накаджима Ха-25 &quot; . &quot; Конструкция &quot; предусматривала обслуживание в юго-восточной части Тихого океана в качестве дальнего патруля &quot; ."
 JAP_heavy_fighter_equipment_2: "Кавасаки Ки-45 Торье"
 JAP_heavy_fighter_equipment_2_short: "Ki-45 Торье"
 JAP_heavy_fighter_equipment_2_desc: "В целях повышения эффективности Ki-38 предполагалось осуществить ряд модификаций, однако после того, как было установлено, что двигатель не будет достаточно мощным для управления самолетом после модификации, был разработан новый план."
 JAP_heavy_fighter_equipment_3: "Кавасаки Ки-102"
 JAP_heavy_fighter_equipment_3_short: "Ki-102"
 JAP_heavy_fighter_equipment_3_desc: "Несмотря на то, что ки-102 по сравнению с его предшественником, напоминавший Ки-45, они были значительно более смертоносными, чем 37-мм пушка Ho-204, а позднее 57-мм пушка HO-401, смонтированная в носу, превратила его в грозный самолет, когда дело дошло до перехвата бомбардировщиками, где даже короткий пропуск мог снести с него крыло самых сильных бомбардировщиков."

 JAP_tac_bomber_equipment_0: "Мицубиси Ки-2"
 JAP_tac_bomber_equipment_0_short: "Ki-2"
 JAP_tac_bomber_equipment_0_desc: "Ki-2 — это японская адаптация шведского бомбардировщика, изначально разработанная как немецкий почтовый самолет Junkers. Самолет хорошо служил в разведывательных ролях и вел легкую бомбардировку. Несмотря на то, что он был устаревшим, он все еще использовался до конца 1930-х годов в качестве тренера."
 JAP_tac_bomber_equipment_1: "Mitsubishi G3M"
 JAP_tac_bomber_equipment_1_short: "G3M"
 JAP_tac_bomber_equipment_1_desc: "Г3М был задуман в качестве быстродействующего бомбардировщика с высокой высотой для военно-морского флота Японии, однако слабый двигатель &lt; &lt; Хиро &gt; &gt; типа 91 означал, что самолет не может достичь своей прогнозируемой скорости движения, не говоря уже о рабочей высоте. &lt; &lt; Мицубиси &gt; &gt; будет продолжать модифицировать самолет, однако после первого разочаровывавшего полета ему не хватало поддержки со стороны военно-морского флота. &lt; &lt; Ямамото Исороку &gt; &gt; потребовал вмешательства адмирала Ямамото, чтобы убедиться в том, что самолет вошел в эксплуатацию и смог доказать себя."
 JAP_tac_bomber_equipment_2: "Кавасаки Ки-48 Сокей"
 JAP_tac_bomber_equipment_2_short: "Ки-48 Сокеи"
 JAP_tac_bomber_equipment_2_desc: "Опыт разработки проекта Ki-38 и Ki-45 оказался ценным при проектировании проекта Ki-48. &quot; Самолет &quot; был легче, чем его истребители, и у него было мало технических проблем с удовлетворительной полезной нагрузкой. &quot; Пилоты-бомбардировщики &quot; ныряли &quot; были удивлены тем, насколько реагирующими были механизмы контроля и как самолет мог осуществлять бомбардировку."
 JAP_tac_bomber_equipment_3: "Мицубиси Ки-67 Хирию"
 JAP_tac_bomber_equipment_3_short: "Ki-67 Хирию"
 JAP_tac_bomber_equipment_3_desc: "Необычные спецификации для преемника Ki-48 Saukei требовали, чтобы преемник был хорошо вооружен, чтобы отключить перехватчики, способные к высокоскоростным и ныряльщикам бомбардировок, а также к способности выжить после тяжелых боевых повреждений. &quot; Ki-67 &quot; значительно лучше выживает по сравнению с современными японскими самолетами с самозакрывающимися топливными баками и множеством бронежилетов, защищающих экипаж."
 JAP_jet_tac_bomber_equipment_1: "Йокосука Р2Y2 Кейун-Кай"
 JAP_jet_tac_bomber_equipment_1_short: "R2Y2 Кейун-Кай"
 JAP_jet_tac_bomber_equipment_1_desc: "Разочаровывающие оценки эффективности R1Y привели к тому, что IJN заказал новый проект, в результате чего был установлен R2Y, в результате чего был установлен комбинированный двигатель Aichi Ha-70. Дополнительное исследование привело к установке R2Y двух турбуйетных двигателей Mitsubishi Ne-330 с дополнительными жесткими точками на пересмотренных крыльях. Недавно добавленные жесткие точки сделали Keiun высокоскоростным тактическим бомбардировщиком."
 JAP_jet_tac_bomber_equipment_2: "Накаджима Ки-190 Рюцзин"
 JAP_jet_tac_bomber_equipment_2_short: "Ки-190 Рюцзин"
 JAP_jet_tac_bomber_equipment_2_desc: "В результате модификации самолета &lt; &lt; Ки-67 &gt; &gt; Армия попыталась еще больше повысить скорость самолета, установив пару турбоджетов &lt; &lt; Мицубиси &gt; &gt; Ne-330. &lt; &lt; Ки-190 Рюцзин &gt; &gt; с первоначальной механической точки зрения достигла более 900 км/ч для максимальной скорости во время испытаний и была быстро принята ИДЖ. &lt; &lt; Ки-67 &gt; &gt; сохранила бы многие характеристики двигателя &lt; &lt; Хири &gt; &gt; , пользуясь высокой скоростью, обеспечиваемой турбойетным двигателем."

 JAP_strat_bomber_equipment_0: "Мицубиси Ки-20"
 JAP_strat_bomber_equipment_0_short: "Ki-20"
 JAP_strat_bomber_equipment_1: "Мицубиси Ки-21"
 JAP_strat_bomber_equipment_1_short: "Ki-21"
 JAP_strat_bomber_equipment_1_desc: "После первоначальных испытаний и соревнований с проектом &quot; Nakajima Ki-19 &quot; Ki-21 оказалось лучше и более быстро, однако производство было медленным, и этот тип стал широко использоваться только в 1939 году, когда самолёт был значительно устаревшим и устаревшим."
 JAP_strat_bomber_equipment_2: "Накаджима Ки-49 Донрию"
 JAP_strat_bomber_equipment_2_short: "Ki-49 Донрию"
 JAP_strat_bomber_equipment_2_desc: "Предназначенные для замены Ki-21, Донрио был хорошо вооружен по японскому стандарту с полдюжиной легких пулеметов и пушкой, установленной сзади, и в то же время был способен на более высокую скорость и более высокую дальность, чем бомбардировщики в других странах."
 JAP_strat_bomber_equipment_3: "Накаджима G8N Рензан"
 JAP_strat_bomber_equipment_3_short: "G8N Рензан"
 JAP_strat_bomber_equipment_3_desc: "Несмотря на катастрофические результаты, полученные в ходе первоначальных испытаний, а третий прототип случайно загорелся и был уничтожен, G8N Rensan был одним из самых популярных бомбардировщиков. &lt; &lt; Рензан &gt; &gt; с лучшим турбонагнетателем, произведенным компанией &lt; &lt; Хитачи &gt; &gt; , смог достичь более высокой высоты, чем большинство японских самолетов, в то время как дальность или скорость были сопоставимы с любыми бойцами эскорта."
 JAP_jet_strat_bomber_equipment_1: "Накаджима G12N Shóri"
 JAP_jet_strat_bomber_equipment_1_short: "G12N Shóri"
 JAP_jet_strat_bomber_equipment_1_desc: "В связи с многообещающими результатами программы турбо-реактивных двигателей ИЯН потребовала механически забитого G10N Fugaku использовать двигатель Nakajima Ne-230, что потребовало значительного обновления корпуса воздушных судов, и полученная в результате этого информация о самолёте Fugaku была неизвестна, что по существу является новой конструкцией, что дало новое название и окрестило шейури."

 JAP_large_plane_maritime_patrol_plane_airframe_4_short: "К-200"

 JAP_scout_plane_equipment_1: "Мицубиси Ки-46"
 JAP_scout_plane_equipment_1_short: "Ki-46"
 JAP_scout_plane_equipment_1_desc: "Легко вооруженных и быстрых летательных аппаратов, которые во время их введения успели успеть на службу истребителям, но затем был установлен еще более мощный двигатель."
 JAP_scout_plane_equipment_2: "Накаджима J1N1-C"
 JAP_scout_plane_equipment_2_short: "J1N1-C"
 JAP_scout_plane_equipment_2_desc: "Накаджима предложила модифицировать J1N1 Gekko и убрать бóльшую часть оружия, обращенного вперед, улучшив скорость самолета на заметном расстоянии."

 JAP_transport_plane_equipment_1: "Накаджима Ки-34"
 JAP_transport_plane_equipment_1_short: "Ki-34"

 JAP_rocket_suicide_equipment_1: "Йокосука MXY7 Oka"
 JAP_rocket_suicide_equipment_1_short: "Оха"
 JAP_rocket_suicide_equipment_1_desc: "Ёкосука MXY-7 Оха была специально построенной ракетной установкой для борьбы с кораблем, которая была разработана для использования в случае военных приливов против поддержки Японии."
 JAP_rocket_interceptor_equipment_1: "Mitsubishi J8M Shúsui"
 JAP_rocket_interceptor_equipment_1_short: "J8M Шюсуй"
 JAP_rocket_interceptor_equipment_1_desc: "После больших трудностей японским разведывательным службам удалось ускользнуть из Германии от ряда проектных планов перехватчика ракетного двигателя. &lt; &lt; ИДЖ &gt; &gt; и &lt; &lt; ИХН &gt; &gt; проинспектировали проектные планы, а военно-морские силы поручили &lt; &lt; Мицубиси &gt; &gt; &lt; &lt; Хай Индастриз &gt; &gt; реконструировать копию самолета, который стал &lt; &lt; Дж8М Шусуи &gt; &gt; , с аналогичными спектаклями."
 JAP_rocket_interceptor_equipment_2: "Мицубиси Ки-202 Шусуи-Кай"
 JAP_rocket_interceptor_equipment_2_short: "Ki-202 Шусуи-Кай"
 JAP_rocket_interceptor_equipment_2_desc: "Как и соперничество между ИЮА и ИЯН, обе силы не согласились с конструкцией перехватчика, при этом ИЯН высказался за то, чтобы выбросить пушку для дополнительных топливных емкостей, а ИДЖ предпочёл расширить самолёт."
 JAP_rocket_interceptor_equipment_3: "Мизуно Ки-156 Шинрию"
 JAP_rocket_interceptor_equipment_3_short: "ki-156 Shinryö"
 JAP_rocket_interceptor_equipment_3_desc: "Возможность взрыва стратегических бомбардировщиков сверхвысокой высоты на японском материке вызывает беспокойство у высшего командования Японии, и в этой связи они поручили военно-морскому военно-морскому военно-воздушному аппарату Йокосуке изучить возможности перехватчика большой высоты. Затем первоначальные спецификации были изменены с целью использования успешного ракетного двигателя &lt; &lt; Мицубиси Токо-Ро.2 &gt; &gt; , который также был установлен на борту судна &lt; &lt; Й8М Шусуи &gt; &gt; , с дополнительным требованием о том, чтобы он мог действовать в качестве глайдера, в результате чего была создана компания &lt; &lt; Ки-156 &gt; &gt; , частично разработанная и изготовленная компанией &lt; &lt; Мизуно &gt; &gt; , которая также построила глайдеры."

