 ###
 ### HUN - Kingdom of Hungary ###
 ###

 HUN_CAS_equipment_1: "Aero Vodochody A.101"
 HUN_CAS_equipment_1_short: "А.101"
 HUN_CAS_equipment_1_desc: "Без современных самолетов для наземных атак Двойная монархия стремилась модифицировать существующие модели, с тем чтобы они соответствовали этой роли. A.101 является кульминацией ряда попыток усовершенствовать биплан A.230 для выполнения этой роли."
 HUN_CAS_equipment_2: "Вайс Манфред WM.231"
 HUN_CAS_equipment_2_short: "WM.231"
 HUN_CAS_equipment_2_desc: "Вайс Манфред представил истребителя WM.23, чтобы соревноваться с дизайном Авии. В то время как его ковровые, моторизованные пулеметы Geball впечатлили Комитет, вместо этого был выбран B.135. Вайс Манфред ответил небольшой перестройкой, вновь представив его в качестве ныряльщика вместо того, чтобы дополнить стареющий флот бипланов A.101, находящихся в эксплуатации."
 HUN_CAS_equipment_3: "Вайс Манфред WM.44"
 HUN_CAS_equipment_3_short: "WM.44"
 HUN_CAS_equipment_3_desc: "Разработанная Ласло Варго, по существу, была меньшей, двух-миллиметровой версией серии тяжелых истребителей и быстрых бомбардировщиков WM.31, как и ее предшественник, она была изготовлена из древесины и металла, чтобы повысить производительность."

 HUN_fighter_equipment_0: "Фёникс Д.В."
 HUN_fighter_equipment_0_short: "D.V"
 HUN_fighter_equipment_0_desc: "С концом Weltkrieg компания Phönix планировала реконструировать свой знаменитый биплан D.III с ожидаемым названием D.IV. Однако в 1931 году компания возродила Monier D.IV с открытием совершенно нового биплана, содержащего в то время передовые спецификации. Модернизированный вариант судна, названный D.V, был принят Двойной Монархией в 1933 году."
 HUN_fighter_equipment_1: "Авиа Б.534"
 HUN_fighter_equipment_1_short: "B.534"
 HUN_fighter_equipment_1_desc: "В 1932 году реноверный бохемский инженер Франтишек Новотни начал работать с компанией «Авиа» над новым полностью металлическим бипланом, кульминацией которого стал B-34, который был почти принят двухсторонней монархией над Фёниксом. Новотний перестроил B-34 с помощью нового двигателя и шасси, а также полностью закрытого кабины. В отличие от своего предшественника, эта модель, B-534, была принята двойной монархией."
 HUN_fighter_equipment_2: "Авиа Б.135"
 HUN_fighter_equipment_2_short: "B.135"
 HUN_fighter_equipment_2_desc: "После успеха своего биплана B-534 Авиа вскоре приступила к работе над передовым монопланом, который в конечном итоге завершится B-135."
 HUN_fighter_equipment_3: "Авиа-Икар Б.224"
 HUN_fighter_equipment_3_short: "B.224"
 HUN_fighter_equipment_3_desc: "С помощью Kosta Sivchev, а также компании Illyrian Ikarus, двигатель B.224 был модернизирован на отличное 1000 hp Austro-Daimler V12E, а пулеметы были заменены двумя тяжелыми пулеметами Geball 12,7 мм, увеличивающими скорость и огневой мощью над своим предшественником."
 HUN_jet_fighter_equipment_1: "Авиа Бф. 262"
 HUN_jet_fighter_equipment_1_short: "Bf.262"
 HUN_jet_fighter_equipment_1_desc: "Отстаивая в разработке реактивных истребителей, Авиа приобрела лицензию на производство Bf 262 для Fleygerkorps, заменив 30-мм немецкие пушки на 20-миллиметровые пушки местного производства в их слегка пересмотренном дизайне."
 HUN_jet_fighter_equipment_2: "Летов L.52"
 HUN_small_plane_airframe_5: "Летов L.52"
 HUN_jet_fighter_equipment_2_short: "L.52"
 HUN_small_plane_airframe_5_short: "L.52"
 HUN_jet_fighter_equipment_2_desc: "Когда Austro-Daimler разработал U2 "Uzelac" двигатель, Летов произвел современный реактивный истребитель, который станет первым местным реактивным самолетом монархии, принятым в эксплуатацию."

 HUN_small_plane_naval_bomber_airframe_1: "Летов Ш.328.v"
 HUN_small_plane_naval_bomber_airframe_1_short: "Ш.328.v"
 HUN_small_plane_naval_bomber_airframe_1_desc: "Ш.328.v — производная морского самолета серии Ш.28, которая была вооружена двумя пулеметами 8-мм спереди и еще двумя пулеметами на гибкой монтировке сзади и имела полезную нагрузку в 500 кг."
 HUN_small_plane_naval_bomber_airframe_2: "Лойнер-Фоккер Т.VIII Вт/С"
 HUN_small_plane_naval_bomber_airframe_2_short: "Т.VIII Вт/С"
 HUN_small_plane_naval_bomber_airframe_2_desc: "Компания &lt; &lt; Лонер &gt; &gt; , которая ранее делала морские самолеты и летающие лодки для Кьюк."
 HUN_small_plane_naval_bomber_airframe_3: "Вайс Манфред WM.442"
 HUN_small_plane_naval_bomber_airframe_3_short: "WM.442"
 HUN_small_plane_naval_bomber_airframe_3_desc: "WM.442 — вариант морских самолётов WM.44, изготовленный для Sefligerkorps и предназначенный для антикорабельных операций в Адриатике и Средиземном море."

 HUN_heavy_fighter_equipment_1: "Прага E.51"
 HUN_heavy_fighter_equipment_1_short: "E.51"
 HUN_heavy_fighter_equipment_1_desc: "Первоначально спроектированный как разведывательный самолет, было быстро установлено, что E.51 может быть быстро адаптирован как тяжелый истребитель для борьбы со стратегическими бомбардировщиками."
 HUN_heavy_fighter_equipment_2: "Вайс Манфред WM.31"
 HUN_heavy_fighter_equipment_2_short: "WM.31"
 HUN_heavy_fighter_equipment_2_desc: "Венгерский авиационный инженер Ласло Варга разработал этот трехместный истребитель вокруг экспериментальных газовых турбинных двигателей, однако возникли технические трудности, которые были заменены двумя Austro-Daimler V12D."
 HUN_heavy_fighter_equipment_3: "Вайс Манфред WM.50"
 HUN_heavy_fighter_equipment_3_short: "WM.50"
 HUN_heavy_fighter_equipment_3_desc: "WM.50 — довольно продвинутый проект, разработанный для своего времени: двухзвуковая конфигурация двигателя, двухбумовый самолёт Лазло Варга, был разработан для значительного повышения эффективности двухмоторных истребителей в борьбе с бомбардировщиками высокого уровня."

 HUN_tac_bomber_equipment_0: "Авиа Ф.39"
 HUN_tac_bomber_equipment_0_short: "F.39"
 HUN_tac_bomber_equipment_0_desc: "Компания &lt; &lt; Фоккер &gt; &gt; , первоначально разработанная компанией &lt; &lt; Фоккер &gt; &gt; как транспортное судно, &lt; &lt; Ф.IX &gt; &gt; , быстро увидела военный потенциал самолета и, получив лицензию на этот самолет, переоборудовала самолет &lt; &lt; Ф.IX &gt; &gt; как бомбардировщик &lt; &lt; Ф.39 &gt; &gt; . &lt; &lt; Двойная монархия &gt; &gt; , которой не хватало бомбардировщиков, приняла F.39 как &lt; &lt; стоп-кап &gt; &gt; , в то время как были разработаны новые модели."
 HUN_tac_bomber_equipment_1: "Летов Ш-50"
 HUN_tac_bomber_equipment_1_short: "Ш-50"
 HUN_tac_bomber_equipment_1_desc: "Намереваясь удовлетворить просьбу Флигеркорпса о создании двухфункционального самолета из трех человек, Летов представил S-50. Однако дизайн не поймал интереса и никогда не будет произведен, а дизайн Aero в конечном итоге будет принят."
 HUN_tac_bomber_equipment_2: "Aero Vodochody A.300"
 HUN_tac_bomber_equipment_2_short: "А.300"
 HUN_tac_bomber_equipment_2_desc: "Этот проект бомбардировщика Антонина Гусника был одним из самых быстрых в списке самолетов, только за недавно принятым истребителем B.135. Быстро и с хорошей полезной нагрузкой он оказался многоцелевым бомбардировщиком и разведывательным самолетом."
 HUN_tac_bomber_equipment_3: "Вайс Манфред WM.311"
 HUN_tac_bomber_equipment_3_short: "WM.311"
 HUN_tac_bomber_equipment_3_desc: "WM.31 был быстро адаптирован для выполнения функций оперативного тактического бомбардировщика путем ослабления его наступательных вооружений и повышения его полезной нагрузки."
 HUN_jet_tac_bomber_equipment_1: "Летов L.11"
 HUN_jet_tac_bomber_equipment_1_short: "L.11"
 HUN_jet_tac_bomber_equipment_1_desc: "Основываясь на дизайне реактивных истребителей Bayerische Flugzeugwerke, L.11 адаптировал дизайн к быстрому и легкому бомбардировщику для выполнения различных функций, надеясь заменить флот монархии из старых тактических бомбардировщиков."
 HUN_jet_tac_bomber_equipment_2: "Aero L.44"
 HUN_jet_tac_bomber_equipment_2_short: "L.44"
 HUN_jet_tac_bomber_equipment_2_desc: "С ростом надежности реактивных двигателей и усилением конкуренции Аэро решил задачу разработки быстрого взрыва следующего поколения, который привел бы к быстрому бомбардировщику L.44."

 HUN_strat_bomber_equipment_1: "Авия-Дорнье До 19"
 HUN_strat_bomber_equipment_1_short: "До 19"
 HUN_strat_bomber_equipment_1_desc: "Не имея дизайна для стратегических бомбардировщиков, Авиа купила несколько бомбардировщиков Дорнье с четырьмя двигателями, чтобы продемонстрировать свой потенциал военно-воздушным силам."
 HUN_strat_bomber_equipment_2: "Авия-Джункерс Ю. 290"
 HUN_strat_bomber_equipment_2_short: "Ju.290"
 HUN_strat_bomber_equipment_2_desc: "Авиа приобрела несколько Ju.290 в дополнение к небольшому флоту Do.19."
 HUN_strat_bomber_equipment_3: "Вайс Манфред WM.65"
 HUN_strat_bomber_equipment_3_short: "WM.65"
 HUN_strat_bomber_equipment_3_desc: "Четырехмоторный дизайн Lázlo Varga был первым отечественным тяжёлым бомбардировщиком подобного рода в Империи."
 HUN_jet_strat_bomber_equipment_1: "Aero-Flugzeugbau Фридрихшафен FF16"
 HUN_jet_strat_bomber_equipment_1_short: "FF.16"
 HUN_jet_strat_bomber_equipment_1_desc: "Немецкий Flugzeugbau Фридрихшафен FF.16 будет принят в качестве бомбардировщика дальнего радиуса действия Австрии, производимого компанией Aero Vodochody."

