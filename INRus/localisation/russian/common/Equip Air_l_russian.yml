 BUL_tac_bomber_equipment_0: "Джункеры Ju 86"
 BUL_tac_bomber_equipment_0_short: "Ju 86"
 BUL_tac_bomber_equipment_1: "Архангелский Ар-2"
 BUL_tac_bomber_equipment_1_short: "Ар-2"
 BUL_tac_bomber_equipment_1_desc: "Недовольная австрийскими и немецкими бомбардировщиками, а также их высокой ценой, Болгария искала дальше в поле, чтобы выполнить роль среднего бомбардировщика, она провела переговоры о производстве Архангелского Ар-2 по лицензии Российской Республики."
 BUL_tac_bomber_equipment_2: "Ермолаев Эр-2"
 BUL_tac_bomber_equipment_2_short: "Эр-2"
 BUL_tac_bomber_equipment_3: "Туполев Ту-10"
 BUL_tac_bomber_equipment_3_short: "Ту-10"

 BUL_strat_bomber_equipment_1: "Авия-Дорнье До 19"
 BUL_strat_bomber_equipment_1_short: "До 19"
 BUL_strat_bomber_equipment_1_desc: "Не имея дизайна для стратегических бомбардировщиков, Авиа купила несколько бомбардировщиков Дорнье с четырьмя двигателями, чтобы продемонстрировать свой потенциал военно-воздушным силам."
 BUL_strat_bomber_equipment_2: "Блох МБ.165"
 BUL_strat_bomber_equipment_2_short: "Мб.165"
 BUL_strat_bomber_equipment_2_desc: "Недовольная австрийскими и немецкими бомбардировщиками, и их высокие цены Болгария искала дальше в поле. Для выполнения роли тяжелого бомбардировщика она провела переговоры о производстве Bloch MB.165 по лицензии Франции."
 BUL_strat_bomber_equipment_3: "Блох MB.175"
 BUL_strat_bomber_equipment_3_short: "MB.175"

 BUL_scout_plane_equipment_1: "KB-5 "Чучулига" III"
 BUL_scout_plane_equipment_1_short: "KB-5"
 BUL_scout_plane_equipment_2: "KB-6 Папагал"
 BUL_scout_plane_equipment_2_short: "KB-6"
 BUL_scout_plane_equipment_2_desc: "Для удовлетворения потребностей болгарских военно-воздушных сил, связанных с новым судном-разведчиком на большие расстояния, болгарское дочернее предприятие компании &quot; Каприни &quot; внесло несколько важных изменений в свои успешные 309 судовых аппаратов &quot; Гибли &quot; за несколько лет до этого."

