 GXC_fighter_equipment_1_short: "Тип 37"
 GXC_fighter_equipment_1_desc: "Внутреннее развитие Китая на Kurtiss P-36 Hawk, которое было импортировано из Соединенных Штатов незадолго до гражданской войны в этой стране."
