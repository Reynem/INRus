 ###
 ### SCA - Scandinavia ###
 ###

 SCA_fighter_equipment_0: "Svenska Aero J 6 Jaktfalken"
 SCA_fighter_equipment_0_short: "J 6 Jaktfalken"
 SCA_fighter_equipment_0_desc: "Старый боец межвоенных бипланов, построенный Свенской Аэро сначала в 20-х годах, а затем АБ Свенска Ярнвегсверкстадернас Аэропланавдельнинг, который используется во всех Скандинавиях. Несмотря на его эффективность для патрулирования и разведки, он провёл свой день в наших военно-воздушных силах и не будет отвечать требованиям современной воздушной войны."
 SCA_fighter_equipment_1: "Serversky EP-106 J 9"
 SCA_fighter_equipment_1_short: "И 9"
 SCA_fighter_equipment_1_desc: "Американский построенный истребитель, созданный компанией Serversky. Американские военно-воздушные силы выбрали своего конкурента, P-36, из компании Kurtiss, но она надёжна и прекрасно удовлетворяет наши потребности в наших миссиях над Скандинавией. После некоторых переговоров Северски продал нам права на производство и планы, позволив нам их производить."
 SCA_fighter_equipment_2: "FFVS J 22"
 SCA_fighter_equipment_2_short: "J 22"
 SCA_fighter_equipment_2_desc: "J 22, разработанный Kungliga Flygförvaltningens Flygverkstad i Stock, является нашим первым локально спроектированным борцом с монопланом."
 SCA_fighter_equipment_3: "ФТС J 27"
 SCA_fighter_equipment_3_short: "J 27"
 SCA_fighter_equipment_3_desc: "Воздушные войны развивались во время второго Велткрига, и из-за интенсивных воздушных столкновений над Балтией многие иностранные самолеты не смогли вернуться на свои базы или просто разбиться на наших берегах. После того как они поймали (или выздоровели для самых невезучих) наши технические подразделения изучили много этих бойцов нового типа. Потому что J21 не удовлетворял необходимым требованиям, чтобы быть эффективным истребителем, эти исследования привели к J 27, современному истребителю, вдохновленному немецкими и американскими разработками, но главным образом из британского супермаринского "Спитфайра". Мощный двигатель, высокий маневренность, противопереворачивающийся движок, мощное вооружение... наш "Норден Супер Спитфайр" станет кошмаром для стран, которые осмеливаются вторгнуться в нас!"
 SCA_jet_fighter_equipment_1: "Kjeller-SAAB J 21R"
 SCA_jet_fighter_equipment_1_short: "J 21R"
 SCA_jet_fighter_equipment_1_desc: "После многих лет НИОКР нам наконец удалось построить реактивный истребитель. Истребитель поршневых двигателей J 21, который был не очень эффективен как истребитель, это факт. Но это надёжная и мощная платформа. Перезаряженный реактивным двигателем с 20-миллиметровыми пушками, J 21R полностью способен защитить наши небеса от захватчиков воздуха следующих лет. Нет больше винтов, время для реактивных самолетов сейчас."
 SCA_jet_fighter_equipment_2: "Kjeller-SAAB 29 Tunnan"
 SCA_small_plane_airframe_5: "Kjeller-SAAB 29 Tunnan"
 SCA_jet_fighter_equipment_2_short: "Kjeller-SAAB 29"
 SCA_small_plane_airframe_5_short: "Kjeller-SAAB 29"
 SCA_jet_fighter_equipment_2_desc: "После хороших результатов, достигнутых с J 21R, настало время построить новый реактивный истребитель с новой ячейкой и не отремонтировать его из старого самолёта. J29 является кульминационным звеном нашей авиационной промышленности: у него есть продвинутый радар, большие топливные баки, ракеты класса &quot; воздух-воздух &quot; и высокая скорость. Если мы будем продолжать строить самолеты, подобные &quot; Таннан &quot; , то небо Скандинавии будет гарантировано на будущее."

 SCA_cv_fighter_equipment_0: "Svenska Aero J 6HS Jaktfalken"
 SCA_cv_fighter_equipment_0_short: "J 6HS Jaktfalken"
 SCA_cv_fighter_equipment_1: "Serversky EP-106 J 9HS"
 SCA_cv_fighter_equipment_1_short: "J 9HS"
 SCA_cv_fighter_equipment_2: "FFVS J 22HS"
 SCA_cv_fighter_equipment_2_short: "J 22HS"
 SCA_cv_fighter_equipment_3: "Kjeller-SAB J 25HS"
 SCA_cv_fighter_equipment_3_short: "J 25HS"
 SCA_cv_fighter_equipment_3_desc: "Даже несмотря на то, что J 25HS хорошо срабатывает в испытаниях, до того, как FFVS J 27 сменит его, было построено лишь несколько воздушных корпусов."

 SCA_CAS_equipment_1: "SAI KZ IIA"
 SCA_CAS_equipment_1_short: "KZ IIA"
 SCA_CAS_equipment_1_desc: "В течение нескольких месяцев после своего создания SAI, Skandinavisk Aero Industri, основанная двумя технически компетентными энтузиастами, выпустила два различных спортивных самолета."
 SCA_CAS_equipment_2: "SAAB B 17"
 SCA_CAS_equipment_2_short: "B 17"
 SCA_CAS_equipment_2_desc: "Изучив последние проекты нападающих самолетов других держав в Европе, нам удалось создать местный самолет, способный эффективно осуществлять полеты по авиаперевозкам. &lt; &lt; В17 &gt; &gt; , разработанный СААБ, хорошо оснащен, способен использовать много бомб и может осуществлять бомбардировку. &lt; &lt; Её саперы &gt; &gt; также являются модульными, что позволяет нам устанавливать лыжи и плавучие."
 SCA_CAS_equipment_3: "Kjeller-SAAB A 21"
 SCA_CAS_equipment_3_short: "A 21"
 SCA_CAS_equipment_3_desc: "Saab A-21 был первым боецом по имени J 21, но потому что он показал неадекватную результативность для своей роли истребителя. Несмотря на это, дизайнерское бюро Saab поняло, что его ячейка будет отличной платформой для нападающего. Его уникальная конфигурация нажима, его мощный двигатель и выбор загрузки делают его мощным CAS."

 SCA_cv_CAS_equipment_1: "SAI KZ IIA-HS"
 SCA_cv_CAS_equipment_1_short: "KZ IIA-HS"
 SCA_cv_CAS_equipment_2: "SAAB B 17HS"
 SCA_cv_CAS_equipment_2_short: "B 17HS"
 SCA_cv_CAS_equipment_3: "Kjeller-SAB A 21HS"
 SCA_cv_CAS_equipment_3_short: "A 21HS"

 SCA_small_plane_naval_bomber_airframe_1: "Ханса-Бранденбург С 12"
 SCA_small_plane_naval_bomber_airframe_1_short: "П 12"
 SCA_small_plane_naval_bomber_airframe_2: "SAAB T 17S"
 SCA_small_plane_naval_bomber_airframe_2_short: "Т 17С"
 SCA_small_plane_naval_bomber_airframe_2_desc: "Морской вариант нашего B 17, разработанный Саабом. Модульные десантные снаряды были полностью заменены поплавками, и хвост был улучшен, чтобы он мог лучше двигаться по воде. Это идеальный самолет для морского патрулирования или нападения на корабль, который также может использоваться как разведывательный морской самолет для нашего военно-морского флота."
 SCA_small_plane_naval_bomber_airframe_3: "Kjeller-SAB T 18"
 SCA_small_plane_naval_bomber_airframe_3_short: "Т 18"

 SCA_cv_small_plane_naval_bomber_airframe_1: "Svenska Aero T/J 6HS Jaktfalken"
 SCA_cv_small_plane_naval_bomber_airframe_1_short: "T/J 6HS Jaktfalken"
 SCA_cv_small_plane_naval_bomber_airframe_1_desc: "Сейчас старый бипланный корпус модифицируется для перевозки торпед, сброшенных с воздуха, и служит скорее доказательством концепции будущих проектных решений, а не переоснащением, поскольку его медленная скорость делает его легкой целью в реальных боевых ситуациях. Это служит основой для будущего развития шведских военно-морских бомбардировщиков."
 SCA_cv_small_plane_naval_bomber_airframe_2: "Т 22 ССЗ"
 SCA_cv_small_plane_naval_bomber_airframe_2_short: "22HS"
 SCA_cv_small_plane_naval_bomber_airframe_2_desc: "Вариант J 22HS, модифицированный для перевозки торпед с воздушными торпедами."
 SCA_cv_small_plane_naval_bomber_airframe_3: "Kjeller-SAB SB 21HS"
 SCA_cv_small_plane_naval_bomber_airframe_3_short: "ПБ 21HS"
 SCA_cv_small_plane_naval_bomber_airframe_3_desc: "Этот поршневый корпус является первым и последним, специально спроектированным в качестве бомбардировщиков военно-морского флота, поскольку скандинавским производителям самолётов удалось усовершенствовать свои планы строительства реактивных двигателей вскоре после этого."

 SCA_heavy_fighter_equipment_1: "SAAB J 19"
 SCA_heavy_fighter_equipment_1_short: "Дж 19"
 SCA_heavy_fighter_equipment_1_desc: "Наши истребители J6 и J 9 очень ограничены для операций на дальнем расстоянии. В случае войны они не могли сопровождать наших бомбардировщиков или перехватывать противников на большой дальности и большой высоте. Мы были вынуждены изучить новый проект самолета, который привел к тому, что J 19, выравненный вспомогательными топливными баками и 20-миллиметровыми канонами, он сможет поймать врага, даже на большом расстоянии."
 SCA_heavy_fighter_equipment_2: "SAAB J 23"
 SCA_heavy_fighter_equipment_2_short: "J 23"
 SCA_heavy_fighter_equipment_2_desc: "После успеха J 19 нам пришлось усовершенствовать его дизайн и возможности. J23 вдохновляется нашими соседями и позволяет нашим военно-воздушным силам быть более эффективными. Все еще нет радаров, но больше никаких топливных баков. Это окончательное решение для защиты нашего нейтралитета от внешнего мира и присмотра над Балтийским морем."
 SCA_heavy_fighter_equipment_3: "SAAB J 24"
 SCA_heavy_fighter_equipment_3_short: "Дж 24"
 SCA_heavy_fighter_equipment_3_desc: "Побольше, больше и сильнее, Saab J 24 - последний ген перехватчик. Два мощных двигателя, тяжелое вооружение, нажимная кабина, продвинутый радар и большой топливный бак позволяют ему осуществлять перехват воздуха даже в худших условиях полета, где бы не был враг. Это лучший самолет такого рода, который мы когда-либо построили."

