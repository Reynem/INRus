 ### SLO - Slovakia ###
 ###

 SLO_CAS_equipment_1: "Aero Vodochody A.101"
 SLO_CAS_equipment_1_short: "А.101"
 SLO_CAS_equipment_1_desc: "Без современных самолетов для наземных атак Двойная монархия стремилась модифицировать существующие модели, с тем чтобы они соответствовали этой роли. A.101 является кульминацией ряда попыток усовершенствовать биплан A.230 для выполнения этой роли."
 SLO_CAS_equipment_2: "Вайс Манфред WM.231"
 SLO_CAS_equipment_2_short: "WM.231"
 SLO_CAS_equipment_2_desc: "Вайс Манфред представил истребителя WM.23, чтобы соревноваться с дизайном Авии. В то время как его ковровые, моторизованные пулеметы Geball впечатлили Комитет, вместо этого был выбран B.135. Вайс Манфред ответил небольшой перестройкой, вновь представив его в качестве ныряльщика вместо того, чтобы дополнить стареющий флот бипланов A.101, находящихся в эксплуатации."
 SLO_CAS_equipment_3: "Вайс Манфред WM.44"
 SLO_CAS_equipment_3_short: "WM.44"
 SLO_CAS_equipment_3_desc: "Разработанная Ласло Варго, по существу, была меньшей, двух-миллиметровой версией серии тяжелых истребителей и быстрых бомбардировщиков WM.31, как и ее предшественник, она была изготовлена из древесины и металла, чтобы повысить производительность."

 SLO_fighter_equipment_0: "Фёникс Д.В."
 SLO_fighter_equipment_0_short: "D.V"
 SLO_fighter_equipment_0_desc: "С концом Weltkrieg компания Phönix планировала реконструировать свой знаменитый биплан D.III с ожидаемым названием D.IV. Однако в 1931 году компания возродила Monier D.IV с открытием совершенно нового биплана, содержащего в то время передовые спецификации. Модернизированный вариант судна, названный D.V, был принят Двойной Монархией в 1933 году."
 SLO_fighter_equipment_1: "Авиа Б.534"
 SLO_fighter_equipment_1_short: "B.534"
 SLO_fighter_equipment_1_desc: "В 1932 году реноверный бохемский инженер Франтишек Новотни начал работать с компанией «Авиа» над новым полностью металлическим бипланом, кульминацией которого стал B-34, который был почти принят двухсторонней монархией над Фёниксом. Новотний перестроил B-34 с помощью нового двигателя и шасси, а также полностью закрытого кабины. В отличие от своего предшественника, эта модель, B-534, была принята двойной монархией."
 SLO_fighter_equipment_2: "Авиа Б.135"
 SLO_fighter_equipment_2_short: "B.135"
 SLO_fighter_equipment_2_desc: "После успеха своего биплана B-534 Авиа вскоре приступила к работе над передовым монопланом, который в конечном итоге завершится B-135."
 SLO_fighter_equipment_3: "Авиа-Икар Б.224"
 SLO_fighter_equipment_3_short: "B.224"
 SLO_fighter_equipment_3_desc: "С помощью Kosta Sivchev, а также компании Illyrian Ikarus, двигатель B.224 был модернизирован на отличное 1000 hp Austro-Daimler V12E, а пулеметы были заменены двумя тяжелыми пулеметами Geball 12,7 мм, увеличивающими скорость и огневой мощью над своим предшественником."
 SLO_jet_fighter_equipment_1: "Авиа Бф. 262"
 SLO_jet_fighter_equipment_1_short: "Bf.262"
 SLO_jet_fighter_equipment_1_desc: "Отстаивая в разработке реактивных истребителей, Авиа приобрела лицензию на производство Bf 262 для Fleygerkorps, заменив 30-мм немецкие пушки на 20-миллиметровые пушки местного производства в их слегка пересмотренном дизайне."
 SLO_jet_fighter_equipment_2: "Летов L.52"
 SLO_small_plane_airframe_5: "Летов L.52"
 SLO_jet_fighter_equipment_2_short: "L.52"
 SLO_small_plane_airframe_5_short: "L.52"
 SLO_jet_fighter_equipment_2_desc: "Когда Austro-Daimler разработал U2 "Uzelac" двигатель, Летов произвел современный реактивный истребитель, который станет первым местным реактивным самолетом монархии, принятым в эксплуатацию."

 SLO_small_plane_naval_bomber_airframe_1: "Летов Ш.328.v"
 SLO_small_plane_naval_bomber_airframe_1_short: "Ш.328.v"
 SLO_small_plane_naval_bomber_airframe_1_desc: "Ш.328.v — производная морского самолета серии Ш.28, которая была вооружена двумя пулеметами 8-мм спереди и еще двумя пулеметами на гибкой монтировке сзади и имела полезную нагрузку в 500 кг."
 SLO_small_plane_naval_bomber_airframe_2: "Лойнер-Фоккер Т.VIII Вт/С"
 SLO_small_plane_naval_bomber_airframe_2_short: "Т.VIII Вт/С"
 SLO_small_plane_naval_bomber_airframe_2_desc: "Компания &lt; &lt; Лонер &gt; &gt; , которая ранее делала морские самолеты и летающие лодки для Кьюк."
 SLO_small_plane_naval_bomber_airframe_3: "Вайс Манфред WM.442"
 SLO_small_plane_naval_bomber_airframe_3_short: "WM.442"
 SLO_small_plane_naval_bomber_airframe_3_desc: "WM.442 — вариант морских самолётов WM.44, изготовленный для Sefligerkorps и предназначенный для антикорабельных операций в Адриатике и Средиземном море."

 SLO_heavy_fighter_equipment_1: "Прага E.51"
 SLO_heavy_fighter_equipment_1_short: "E.51"
 SLO_heavy_fighter_equipment_1_desc: "Первоначально спроектированный как разведывательный самолет, было быстро установлено, что E.51 может быть быстро адаптирован как тяжелый истребитель для борьбы со стратегическими бомбардировщиками."
 SLO_heavy_fighter_equipment_2: "Вайс Манфред WM.31"
 SLO_heavy_fighter_equipment_2_short: "WM.31"
 SLO_heavy_fighter_equipment_2_desc: "Венгерский авиационный инженер Ласло Варга разработал этот трехместный истребитель вокруг экспериментальных газовых турбинных двигателей, однако возникли технические трудности, которые были заменены двумя Austro-Daimler V12D."
 SLO_heavy_fighter_equipment_3: "Вайс Манфред WM.50"
 SLO_heavy_fighter_equipment_3_short: "WM.50"
 SLO_heavy_fighter_equipment_3_desc: "WM.50 — довольно продвинутый проект, разработанный для своего времени: двухзвуковая конфигурация двигателя, двухбумовый самолёт Лазло Варга, был разработан для значительного повышения эффективности двухмоторных истребителей в борьбе с бомбардировщиками высокого уровня."

 SLO_tac_bomber_equipment_0: "Авиа Ф.39"
 SLO_tac_bomber_equipment_0_short: "F.39"
 SLO_tac_bomber_equipment_0_desc: "Компания &lt; &lt; Фоккер &gt; &gt; , первоначально разработанная компанией &lt; &lt; Фоккер &gt; &gt; как транспортное судно, &lt; &lt; Ф.IX &gt; &gt; , быстро увидела военный потенциал самолета и, получив лицензию на этот самолет, переоборудовала самолет &lt; &lt; Ф.IX &gt; &gt; как бомбардировщик &lt; &lt; Ф.39 &gt; &gt; . &lt; &lt; Двойная монархия &gt; &gt; , которой не хватало бомбардировщиков, приняла F.39 как &lt; &lt; стоп-кап &gt; &gt; , в то время как были разработаны новые модели."
 SLO_tac_bomber_equipment_1: "Летов Ш-50"
 SLO_tac_bomber_equipment_1_short: "Ш-50"
 SLO_tac_bomber_equipment_1_desc: "Намереваясь удовлетворить просьбу Флигеркорпса о создании двухфункционального самолета из трех человек, Летов представил S-50. Однако дизайн не поймал интереса и никогда не будет произведен, а дизайн Aero в конечном итоге будет принят."
 SLO_tac_bomber_equipment_2: "Aero Vodochody A.300"
 SLO_tac_bomber_equipment_2_short: "А.300"
 SLO_tac_bomber_equipment_2_desc: "Этот проект бомбардировщика Антонина Гусника был одним из самых быстрых в списке самолетов, только за недавно принятым истребителем B.135. Быстро и с хорошей полезной нагрузкой он оказался многоцелевым бомбардировщиком и разведывательным самолетом."
 SLO_tac_bomber_equipment_3: "Вайс Манфред WM.311"
 SLO_tac_bomber_equipment_3_short: "WM.311"
 SLO_tac_bomber_equipment_3_desc: "WM.31 был быстро адаптирован для выполнения функций оперативного тактического бомбардировщика путем ослабления его наступательных вооружений и повышения его полезной нагрузки."
 SLO_jet_tac_bomber_equipment_1: "Летов L.11"
 SLO_jet_tac_bomber_equipment_1_short: "L.11"
 SLO_jet_tac_bomber_equipment_1_desc: "Основываясь на дизайне реактивных истребителей Bayerische Flugzeugwerke, L.11 адаптировал дизайн к быстрому и легкому бомбардировщику для выполнения различных функций, надеясь заменить флот монархии из старых тактических бомбардировщиков."
 SLO_jet_tac_bomber_equipment_2: "Aero L.44"
 SLO_jet_tac_bomber_equipment_2_short: "L.44"
 SLO_jet_tac_bomber_equipment_2_desc: "С ростом надежности реактивных двигателей и усилением конкуренции Аэро решил задачу разработки быстрого взрыва следующего поколения, который привел бы к быстрому бомбардировщику L.44."

 SLO_strat_bomber_equipment_1: "Авия-Дорнье До 19"
 SLO_strat_bomber_equipment_1_short: "До 19"
 SLO_strat_bomber_equipment_1_desc: "Не имея дизайна для стратегических бомбардировщиков, Авиа купила несколько бомбардировщиков Дорнье с четырьмя двигателями, чтобы продемонстрировать свой потенциал военно-воздушным силам."
 SLO_strat_bomber_equipment_2: "Авия-Джункерс Ю. 290"
 SLO_strat_bomber_equipment_2_short: "Ju.290"
 SLO_strat_bomber_equipment_2_desc: "Авиа приобрела несколько Ju.290 в дополнение к небольшому флоту Do.19."
 SLO_strat_bomber_equipment_3: "Вайс Манфред WM.65"
 SLO_strat_bomber_equipment_3_short: "WM.65"
 SLO_strat_bomber_equipment_3_desc: "Четырехмоторный дизайн Lázlo Varga был первым отечественным тяжёлым бомбардировщиком подобного рода в Империи."
 SLO_jet_strat_bomber_equipment_1: "Aero-Flugzeugbau Фридрихшафен FF16"
 SLO_jet_strat_bomber_equipment_1_short: "FF.16"
 SLO_jet_strat_bomber_equipment_1_desc: "Немецкий Flugzeugbau Фридрихшафен FF.16 будет принят в качестве бомбардировщика дальнего радиуса действия Австрии, производимого компанией Aero Vodochody."

 SLO_scout_plane_equipment_1: "Вайс Манфред WM.21"
 SLO_scout_plane_equipment_1_short: "WM.21"
 SLO_scout_plane_equipment_2: "Прага Е.55"
 SLO_scout_plane_equipment_2_short: "E.55"

 SLO_transport_plane_equipment_1: "Aero A.204"
 SLO_transport_plane_equipment_1_short: "A.204"

 ###
 ### SWE - Sweden ###
 ###

 SWE_fighter_equipment_0: "Svenska Aero J 6 Jaktfalken"
 SWE_fighter_equipment_0_short: "J 6 Jaktfalken"
 SWE_fighter_equipment_0_desc: "Старый боец межвоенных бипланов, построенный Свенской Аэро сначала в 20-х годах, а затем АБ Свенска Ярнвегсверкстадернас Аэропланавдельнинг, который используется во всех Скандинавиях. Несмотря на его эффективность для патрулирования и разведки, он провёл свой день в наших военно-воздушных силах и не будет отвечать требованиям современной воздушной войны."
 SWE_fighter_equipment_1: "Serversky EP-106 J 9"
 SWE_fighter_equipment_1_short: "И 9"
 SWE_fighter_equipment_1_desc: "Американский построенный истребитель, созданный компанией Serversky. Американские военно-воздушные силы выбрали своего конкурента, P-36, из компании Kurtiss, но она надёжна и прекрасно удовлетворяет наши потребности в наших миссиях над Швецией. После некоторых переговоров Северски продал нам права на производство и планы, позволив нам их производить."
 SWE_fighter_equipment_2: "FFVS J 22"
 SWE_fighter_equipment_2_short: "J 22"
 SWE_fighter_equipment_2_desc: "J 22, разработанный Kungliga Flygförvaltningens Flygverkstad i Stock, является нашим первым локально спроектированным борцом с монопланами."
 SWE_fighter_equipment_3: "ФТС J 27"
 SWE_fighter_equipment_3_short: "J 27"
 SWE_fighter_equipment_3_desc: "Воздушные войны развивались во время второго Велткрига, и из-за интенсивных воздушных столкновений над Балтией многие иностранные самолеты не смогли вернуться на свои базы или просто разбиться на наших берегах. После того как они поймали (или выздоровели для самых невезучих) наши технические подразделения изучили много этих бойцов нового типа. Потому что J21 не удовлетворял необходимым требованиям, чтобы быть эффективным истребителем, эти исследования привели к J 27, современному истребителю, вдохновленному немецкими и американскими разработками, но главным образом из британского супермаринского "Спитфайра". Мощному двигателю, высокой маневренности, противопереворачивающему гребню, мощному вооружению... наш "Свенск Супер Спитфайр" станет кошмаром для стран, которые осмеливаются вторгнуться в нас!"
 SWE_jet_fighter_equipment_1: "SAAB J 21R"
 SWE_jet_fighter_equipment_1_short: "J 21R"
 SWE_jet_fighter_equipment_1_desc: "После многих лет НИОКР нам наконец удалось построить реактивный истребитель. Истребитель поршневых двигателей J 21, который был не очень эффективен как истребитель, это факт. Но это надёжная и мощная платформа. Перезаряженный реактивным двигателем с 20-миллиметровыми пушками, J 21R полностью способен защитить наши небеса от захватчиков воздуха следующих лет. Нет больше винтов, время для реактивных самолетов сейчас."
 SWE_jet_fighter_equipment_2: "SAAB 29 Tunnan"
 SWE_small_plane_airframe_5: "SAAB 29 Tunnan"
 SWE_jet_fighter_equipment_2_short: "СААБ 29"
 SWE_small_plane_airframe_5_short: "СААБ 29"
 SWE_jet_fighter_equipment_2_desc: "После хороших результатов, достигнутых с J 21R, настало время построить новый реактивный истребитель с новой ячейкой и не отремонтировать его из старого самолёта. J29 является кульминационным звеном нашей авиационной промышленности: у него есть продвинутый радар, большие топливные баки, ракеты класса &quot; воздух-воздух &quot; и высокая скорость. Если мы будем продолжать строить самолёты, подобные &quot; Таннан &quot; , то небо Швеции будет гарантировано на будущее."

 SWE_cv_fighter_equipment_0: "Svenska Aero J 6HS Jaktfalken"
 SWE_cv_fighter_equipment_0_short: "J 6HS Jaktfalken"
 SWE_cv_fighter_equipment_1: "Serversky EP-106 J 9HS"
 SWE_cv_fighter_equipment_1_short: "J 9HS"
 SWE_cv_fighter_equipment_2: "FFVS J 22HS"
 SWE_cv_fighter_equipment_2_short: "J 22HS"
 SWE_cv_fighter_equipment_3: "СААБ J 25HS"
 SWE_cv_fighter_equipment_3_short: "J 25HS"
 SWE_cv_fighter_equipment_3_desc: "Даже несмотря на то, что J 25HS хорошо срабатывает в испытаниях, до того, как FFVS J 27 сменит его, было построено лишь несколько воздушных корпусов."

 SWE_CAS_equipment_1: "Нортроп А-17 В 5"
 SWE_CAS_equipment_1_short: "B 5"
 SWE_CAS_equipment_1_desc: "A-17 — американский бомбардировщик, спроектированный и построенный Нортропом. Это простой и надежный самолет, который легко обслуживать. Он немного ограничен, но играет важную роль в воздушной поддержке наших наземных сил. Благодаря американской инженерии, авиационная ячейка не является сложной и позволяет нам устанавливать зимнее оборудование, включая лыжи для посадочных снастей."
 SWE_CAS_equipment_2: "SAAB B 17"
 SWE_CAS_equipment_2_short: "B 17"
 SWE_CAS_equipment_2_desc: "Изучив последние проекты нападающих самолетов других держав в Европе, нам удалось создать местный самолет, способный эффективно осуществлять полеты по авиаперевозкам. &lt; &lt; В17 &gt; &gt; , разработанный СААБ, хорошо оснащен, способен использовать много бомб и может осуществлять бомбардировку. &lt; &lt; Её саперы &gt; &gt; также являются модульными, что позволяет нам устанавливать лыжи и плавучие."
 SWE_CAS_equipment_3: "SAAB A 21"
 SWE_CAS_equipment_3_short: "A 21"
 SWE_CAS_equipment_3_desc: "Saab A-21 был первым боецом по имени J 21, но потому что он показал неадекватную результативность для своей роли истребителя. Несмотря на это, дизайнерское бюро Saab поняло, что его ячейка будет отличной платформой для нападающего. Его уникальная конфигурация нажима, его мощный двигатель и выбор загрузки делают его мощным CAS."

 SWE_cv_CAS_equipment_1: "Serversky EP-106 B 9HS"
 SWE_cv_CAS_equipment_1_short: "B. 9HS"
 SWE_cv_CAS_equipment_1_desc: "С учетом того, что ВМС находят модифицированную версию B5 неудовлетворенной, уже существующий вариант J9HS, таким образом, изменяется с помощью дополнительной жесткой точки для увеличения мощности по установке бомб для этой конкретной задачи."
 SWE_cv_CAS_equipment_2: "SAAB B 17HS"
 SWE_cv_CAS_equipment_2_short: "B 17HS"
 SWE_cv_CAS_equipment_3: "СААБ А 21ХС"
 SWE_cv_CAS_equipment_3_short: "A 21HS"

 SWE_small_plane_naval_bomber_airframe_1: "Ханса-Бранденбург С 12"
 SWE_small_plane_naval_bomber_airframe_1_short: "П 12"
 SWE_small_plane_naval_bomber_airframe_2: "SAAB T 17S"
 SWE_small_plane_naval_bomber_airframe_2_short: "Т 17С"
 SWE_small_plane_naval_bomber_airframe_2_desc: "Морской вариант нашего B 17, разработанный Саабом. Модульные десантные снаряды были полностью заменены поплавками, и хвост был улучшен, чтобы он мог лучше двигаться по воде. Это идеальный самолет для морского патрулирования или нападения на корабль, который также может использоваться как разведывательный морской самолет для нашего военно-морского флота."
 SWE_small_plane_naval_bomber_airframe_3: "СААБ Т 18"
 SWE_small_plane_naval_bomber_airframe_3_short: "Т 18"

 SWE_cv_small_plane_naval_bomber_airframe_1: "Svenska Aero T/J 6HS Jaktfalken"
 SWE_cv_small_plane_naval_bomber_airframe_1_short: "T/J 6HS Jaktfalken"
 SWE_cv_small_plane_naval_bomber_airframe_1_desc: "Сейчас старый бипланный корпус модифицируется для перевозки торпед, сброшенных с воздуха, и служит скорее доказательством концепции будущих проектных решений, а не переоснащением, поскольку его медленная скорость делает его легкой целью в реальных боевых ситуациях. Это служит основой для будущего развития шведских военно-морских бомбардировщиков."
 SWE_cv_small_plane_naval_bomber_airframe_2: "Т 22 ССЗ"
 SWE_cv_small_plane_naval_bomber_airframe_2_short: "22HS"
 SWE_cv_small_plane_naval_bomber_airframe_2_desc: "Вариант J 22HS, модифицированный для перевозки торпед с воздушными торпедами."
 SWE_cv_small_plane_naval_bomber_airframe_3: "SAAB SB 21HS"
 SWE_cv_small_plane_naval_bomber_airframe_3_short: "ПБ 21HS"
 SWE_cv_small_plane_naval_bomber_airframe_3_desc: "Этот поршневый воздушный корпус является первым и последним, специально спроектированным как бомбардировщики военно-морского флота, поскольку вскоре после этого шведским производителям самолётов удалось усовершенствовать свои чертежи конструкции реактивных двигателей."

 SWE_heavy_fighter_equipment_1: "SAAB J 19"
 SWE_heavy_fighter_equipment_1_short: "Дж 19"
 SWE_heavy_fighter_equipment_1_desc: "Наши истребители J6 и J 9 очень ограничены для операций на дальнем расстоянии. В случае войны они не могли сопровождать наших бомбардировщиков или перехватывать противников на большой дальности и большой высоте. Мы были вынуждены изучить новый проект самолета, который привел к тому, что J 19, выравненный вспомогательными топливными баками и 20-миллиметровыми канонами, он сможет поймать врага, даже на большом расстоянии."
 SWE_heavy_fighter_equipment_2: "SAAB J 23"
 SWE_heavy_fighter_equipment_2_short: "J 23"
 SWE_heavy_fighter_equipment_2_desc: "После успеха J 19 нам пришлось усовершенствовать его дизайн и возможности. J23 вдохновляется нашими соседями и позволяет нашим военно-воздушным силам быть более эффективными. Все еще нет радаров, но больше никаких топливных баков. Это окончательное решение для защиты нашего нейтралитета от внешнего мира и присмотра над Балтийским морем."
 SWE_heavy_fighter_equipment_3: "SAAB J 24"
 SWE_heavy_fighter_equipment_3_short: "Дж 24"
 SWE_heavy_fighter_equipment_3_desc: "Побольше, больше и сильнее, Saab J 24 - последний ген перехватчик. Два мощных двигателя, тяжелое вооружение, нажимная кабина, продвинутый радар и большой топливный бак позволяют ему осуществлять перехват воздуха даже в худших условиях полета, где бы не был враг. Это лучший самолет такого рода, который мы когда-либо построили."

