 ###
 ### GER - German Empire ###
 ###

 GER_CAS_equipment_0: "Хеншель Эрдкампфлюгзеуг 123"
 GER_CAS_equipment_0_short: "Hs 123"
 GER_small_plane_cas_airframe_0_short: "$GER_CAS_equipment_0_short$"
 GER_CAS_equipment_0_desc: "Один из первых дизайнов, созданных Henschel Flugzeugwerke Hs 123, оказался грозным самолётом с близкой поддержкой. Быстро после победы над Физелером в конкурсе дизайна Hs 123 был принят ВВС благодаря его металлической конструкции и высокой маневренности. С помощью двигателя BMW 132Dc он способен на высокие скорости и почти вертикальные удары по ныряльщикам. На испытательном полигоне он оказался очень надежным и особенно простым для ремонта."
 GER_cv_CAS_equipment_0: "Хеншель Трюгер-Стурзкампфбомбер 123"
 GER_cv_CAS_equipment_0_short: "Hs 123 T"
 GER_cv_small_plane_cas_airframe_0_short: "$GER_cv_CAS_equipment_0_short$"
 GER_cv_CAS_equipment_0_desc: "В основном благодаря своему короткому растяжению крыльев и лёгкому техническому обслуживанию, Имперский флот также принял решение против Fi 98 и вместо этого заказал Hs 123. Используемые обеими ветвями Heer, запасные части легче и дешевле приобрести, чтобы сделать Hs 123 T, некоторые из которых были вооружены торпедами, популярными среди адмиралтейства."
 GER_CAS_equipment_1: "Юнкеры 87"
 GER_CAS_equipment_1_short: "Ю 87"
 GER_cv_CAS_equipment_1: "Джункеры 87C"
 GER_cv_CAS_equipment_1_short: "Ju 87C"
 GER_cv_CAS_equipment_1_desc: "Ju 87C является одним из возможных вариантов иконного взрывателя Ju 87 Stuka, специально предназначенного для морских операций."
 GER_CAS_equipment_2: "Хеншель Эрдкампфлюгзеуг 129"
 GER_CAS_equipment_2_short: "Hs 129"
 GER_CAS_equipment_2_desc: "Осознав необходимость усовершенствования из устаревшего биплана Hs 123, Командование Верховной Армии приказало новый проект для самолетов наземной атаки, разработанный для перехвата материальных средств и материально-технического обеспечения, самолет должен был быть толстым бронированным для своих низкоуровневых пробегов с трафингом. В то время как первоначально Henschel использовал низковольтный двигатель Argus, впоследствии он был переключен на более мощный двигатель BMW, что в конечном итоге привело к серийному производству самолета. Из-за его высококалиберного пушки он часто называется «Бюхсенёфнер» ('канер') среди войск."
 GER_cv_CAS_equipment_2: "Джункеры Ju 187 C"
 GER_cv_CAS_equipment_2_short: "Ju 187 C"
 GER_cv_CAS_equipment_2_desc: "В Адмиралтействе, наблюдая за успехами Hs 129, возникла новая итерация наземного Ju 87. Новый проект, хотя и сосредоточенный на наземных нападениях, оказался эффективным для торпедных атак, а толстые бронежилеты делают самолеты очень прочными против зенитных обстрелов и собачьих боев."
 GER_CAS_equipment_3: "Дорнье Ягдбомбер 355"
 GER_CAS_equipment_3_short: "До 355"
 GER_CAS_equipment_3_desc: "Учитывая необходимость замены старых самолётов Хеншеля, Высшее командование приказало проектировать новые наземные ударные самолеты. Дорниер, известный своими исключительными замыслами, победил в военном министерстве на этом неортодоксальном, но высоко аэродинамическом стиле. В отличие от других самолётов Do 355 имеет один винт спереди и один сзади, а также двигатель за кабиной, что позволяет повысить производительность и скорость движения по сравнению с другими самолетами."
 GER_cv_CAS_equipment_3: "Blohm & Voss BV 155 T"
 GER_cv_CAS_equipment_3_short: "БВ 155 Т/У-3"
 GER_cv_CAS_equipment_3_desc: "Увидев бо́льшую оперативность и вооружение, которые предлагает BV 155, Имперский ВМС решил постепенно отказаться от своих старых вариантов и инвестировать в разработку и строительство нового авианосца, легкого бомбардировщика."
 GER_small_plane_cas_airframe_4_short: "Hb 132"
 GER_cv_small_plane_cas_airframe_4_short: "Hb 132 Т"
 GER_small_plane_cas_airframe_5_short: "Bf 1101/99"

 #Arado 68:
 GER_fighter_equipment_0: "Флагзеугбау Фридрихшафен Ягдфлюгзеуг 68"
 GER_fighter_equipment_0_short: "Фр. 68"
 GER_fighter_equipment_0_desc: "Победа в тренировочной битве против своего главного конкурента Hb 51 в конце концов подтвердила, что Ff 68 является следующим немецким истребителем. Хотя сейчас главным образом устаревшие самолеты (невзирая на возражения со стороны Flugzeugbau Фридрихшафена), они все еще используются немецкими военными в качестве ночных бойцов."
 GER_cv_fighter_equipment_0: "Флагзеугбау Фридрихшафен Трюгер-Джагдфлугзеуг 68"
 GER_cv_fighter_equipment_0_short: "Ff 68 Т"
 GER_cv_fighter_equipment_0_desc: "На борту авианосцев «Кайсерлихе» был выбран хорошо известный биплан, Ff 68. Для того чтобы сделать их пригодными для обслуживания перевозчиков, потребовалась небольшая модификация, и, как и их наземные аналоги, экипажи перевозчиков высоко оценили их популярные характеристики контроля."
 GER_fighter_equipment_1: "Байериш Флагзеугверке Ягдфлугцзеуг 109"
 GER_fighter_equipment_1_short: "Bf 109"
 GER_fighter_equipment_1_desc: "Bayerische Flugzeugwerke откликнулась на тендерный боец с современным монопланом Bf 109. Несмотря на общепринятую точку зрения немецких военных кругов о том, что истребитель обязательно должен быть двойным самолетом, истребитель Bf 109, установивший двигатель DB 600, был принят в эксплуатацию из-за его более тяжелого вооружения и значительно более высокой скорости по сравнению с другими конструкциями, не говоря уже о способности восстанавливаться от вращения почти в любое время."
 GER_cv_fighter_equipment_1: "Bayerische Flugzeugwerke Träger-Jagdflugzeug 109"
 GER_cv_fighter_equipment_1_short: "Bf 109 T"
 GER_cv_fighter_equipment_1_desc: "С учетом значительного расширения знаний о аэродинамических свойствах и характеристиках двигателей &quot; Кайзерлихе &quot; разослала контракты на использование нового самолета-носителя. &quot; Биф 109 &quot; , получивший контракт от &quot; Хир &quot; , без удивления, выбрали его. &quot; Бф 109 &quot; , внесла изменения, с тем чтобы обеспечить его способность к переносу, включая удлинение крыльев и контрольных поверхностей, установку хвостовых крючков и катапультных фитингов, а также внедрение откидных крыльев."
 GER_fighter_equipment_2: "Фок-Вульф Ягдлугзёг 190"
 GER_fighter_equipment_2_short: "Fw 190"
 GER_fighter_equipment_2_desc: "Трудности, связанные с производством достаточного количества стационарных двигателей &quot; Даймлер-Бенз &quot; , а также успехи в использовании радиальных двигателей в конструкциях истребителей другими странами сделали перспективными создание радиального истребителя, работающего на двигателях. &quot; Курт Уолдемар Тэнк &quot; , главный инженер &quot; Фокк-Вульф &quot; , проект Fw 190 имеет важное значение с точки зрения выживаемости конструкции, легкости управления, широкого использования модульных методов сборки и простоты технического обслуживания. &quot; Превышение эффективности &quot; Bf 109 &quot; , но наличие детских заболеваний двигателя и пилотов с его вооружением, новый истребитель был принят в эксплуатацию после первоначальных испытаний."
 GER_cv_fighter_equipment_2: "Фокке-Вульф Трюгер-Джагдфлюгзеуг 190"
 GER_cv_fighter_equipment_2_short: "Fw 190 Т"
 GER_cv_fighter_equipment_2_desc: "Из-за ограничений бортового корпуса Bf 109, таких, как слабая и проблематичная нога передач, возникла необходимость в новой платформе истребителя, а трудности с разработкой проекта Bf 155 означают, что вопрос о создании специально построенного истребителя-носителя исключается. Был выбран последний истребитель Focke-Wulf Fw 190."
 #Ta 152:
 GER_fighter_equipment_3: "Фок-Вульф Ягдлюгзеуг 152"
 GER_fighter_equipment_3_short: "Fw 152"
 GER_fighter_equipment_3_desc: "К началу 1944 года стало очевидно, что потенциал развития Fw 190 с двигателем BMW 801 уменьшился. Это стало еще более очевидным с появлением новых вражеских бойцов. В 1942 году началась работа над проектом Fw 190, проект Fw 152 имел такие характеристики, как увеличение топливных баков наряду со скоростью и гораздо бóльшим вооружением по сравнению с Fw 190."
 GER_cv_fighter_equipment_3: "Blohm & Voss BV 155 T"
 GER_cv_fighter_equipment_3_short: "BV 155 Т"
 GER_jet_fighter_equipment_1: "Байериш Флагзеугверке Ягдфлугзёг 262"
 GER_jet_fighter_equipment_1_short: "Bf 262"
 GER_jet_fighter_equipment_1_desc: "Разработанный и созданный для замены старых самолетов на основе винта Bf 262 становится новым постером для наших военно-воздушных сил. Один из первых их типов во всем мире питается двумя турбоджитными двигателями, с помощью которых он может достичь более высокой скорости, чем другие обычные самолеты. Воздушно-воздушное командование возлагает большие надежды на проект с целью в конечном итоге модернизации всего воздушного флота."
 GER_cv_small_plane_airframe_4_short: "Bf 262 T"
 #Me.1101:
 GER_jet_fighter_equipment_2: "Байериш Флагзеугверке Ягдфлугзёг 1101"
 GER_jet_fighter_equipment_2_short: "Bf 1101"
 GER_small_plane_airframe_5_short: "$GER_jet_fighter_equipment_2_short$"
 GER_jet_fighter_equipment_2_desc: "Прямая замена Bf 262, конструкция Bf 1101 состоит из V-образного тела с крыльями сбрасывания. Это одноместный самолет, работающий на двух турбоветных двигателях Heinkel HeS 011, который делает его быстрее Bf 262 и имеет улучшенную дроссельную заслонку, значительно уменьшая шансы компрессорной кабины, которая поражала его предшественника."

 GER_small_plane_naval_bomber_airframe_0_short: "Сделать 22"
 GER_small_plane_naval_bomber_airframe_1: "Физлер См.-Mehrzweckflugzeug 167"
 GER_small_plane_naval_bomber_airframe_1_short: "Fi 167"
 GER_small_plane_naval_bomber_airframe_1_desc: "Разработанный и построенный главным образом для использования на кораблях, Fi 167 был также принят Sefliger Имперского ВМС. Несмотря на архаический дизайн, биплан обладает большой способностью к быстротечности из-за своего двигателя Benz & Cie. С его максимальной скоростью 325 км/ч он образует быстро и сильно ударяющее ядро Küstenfligergruppen."
 GER_cv_small_plane_naval_bomber_airframe_1: "Junkers 87D-4"
 GER_cv_small_plane_naval_bomber_airframe_1_short: "Ju 87D-4"
 GER_cv_small_plane_naval_bomber_airframe_1_desc: "Ju 87D-4 является военно-морским вариантом Stuka, адаптированным к торпедным ударам против вражеских кораблей."
 #Fokker T.VIII:
 GER_small_plane_naval_bomber_airframe_2: "Fokker Wasserflugzeug 80"
 GER_small_plane_naval_bomber_airframe_2_short: "Фк. 80"
 GER_small_plane_naval_bomber_airframe_2_desc: "После того, как Энтони Фоккер ушел с большей частью своей фирмы в Нидерланды, Имперской армии пришлось искать более надежные в политическом отношении компании, которые изменились во время канцлерства фон Тирпиц, когда Фоккер открыл свою фабрику в Германии и принял участие в конкурсах дизайна, в конечном итоге одерживая победу с T.VIII. Назвав Fokker 80 немецкими военно-воздушными силами, он питается BMW 132 K и может перевозить бомбы или торпеды весом 750 кг, что делает его очень мощным военно-воздушным самолетом."
 #Fokker T.VIII:
 GER_cv_small_plane_naval_bomber_airframe_2: "Focke-Wulf Träger-Jagdflugzeug 190 T/U2"
 GER_cv_small_plane_naval_bomber_airframe_2_short: "Fw 190 T/U2"
 GER_cv_small_plane_naval_bomber_airframe_2_desc: "Модифицированный Focke-Wulf 190 T, способный нести тяжелые бомбы или торпеды"
 #P194:
 GER_small_plane_naval_bomber_airframe_3: "Blohm & Voss See-Mehrzweckflugzeug 194"
 GER_small_plane_naval_bomber_airframe_3_short: "Ha 194"
 GER_small_plane_naval_bomber_airframe_3_desc: "Духовный преемник самолёта Ha 141, Ha 194 сохранил странно асимметричный дизайн с кабиной на правой стороне самолета. Несмотря на то, что некоторые воздушные командиры критически относятся к самолёту, он оказался очень быстрым и способен передвигаться на большие расстояния без каких-либо остановок."
 #P194:
 GER_cv_small_plane_naval_bomber_airframe_3: "Blohm & Voss BV 155 T/U-4"
 GER_cv_small_plane_naval_bomber_airframe_3_short: "БВ 155 Т/У-4"
 GER_cv_small_plane_naval_bomber_airframe_3_desc: "Несмотря на относительно большую крыльевую длину самолета, «Ха 194» был также принят ВМС в качестве авианосца, главным образом из-за его большой дальности, а также короткого использования взлетно-посадочных полос во время посадки и взлета."
 GER_small_plane_naval_bomber_airframe_4_short: "Ho 229"
 GER_cv_small_plane_naval_bomber_airframe_4_short: "Хо 229 Т"
 GER_small_plane_naval_bomber_airframe_5_short: "Bf 1101/92"

 GER_medium_plane_fighter_airframe_0_short: "Сделать 23"
 GER_heavy_fighter_equipment_1: "Bayerische Flugzeugwerke Zerstörer 110"
 GER_heavy_fighter_equipment_1_short: "Bf 110"
 GER_heavy_fighter_equipment_1_desc: "Созданный как тяжелый истребитель с большей дальностью, чем Bf 109, авиаслужба провела конкурс, который был выигран Bayerische Flugzeugwerke. Кроме того, в дальности оружие Bf 110 является необычайно сильным, состоящим из трех 20-мм пушек на фронте, даже если оно оказывается менее быстрым, оно оказывается исключительным самолетом, особенно пригодным для использования в наших колониальных достояниях."
 GER_heavy_fighter_equipment_2: "Junkers Zerstörer 88"
 GER_heavy_fighter_equipment_2_short: "Ju 88"
 GER_heavy_fighter_equipment_2_desc: "Первоначально задуманная как быстрая бомбардировка, Ju 88 может вписываться во многие роли, в том числе в миссии по воздушной превосходству и перехвату. &lt; &lt; Бф 110 &gt; &gt; , выбранная для замены Bf 110, является более аэробной, аккуратной и способной охватить более обширную зону воздушного пространства, чем ее предшественник."
 GER_heavy_fighter_equipment_3: "Ханса-Бранденбург Зерстёрер 219"
 GER_heavy_fighter_equipment_3_short: "Hb 219"
 GER_heavy_fighter_equipment_3_desc: "На основе сильных сторон Ju 88 дизайнеры Hansa-Brandenburg разработали Hb 219. С большей стабильностью воздуха и большей быстротой самолет может лучше перехватывать и уничтожать вражеские самолеты. Его новый двигатель и лучшая аэродинамическая конструкция обеспечивают более высокие скорости и прикрытие большего радиуса действия. Недавно разработанная конюшня помогает лучше замаскировать самолёт, что затрудняет его обнаружение вражескими боевиками."
 GER_medium_plane_fighter_airframe_4_short: "Ff 234B"

 GER_tac_bomber_equipment_0: "Бомбардировщик &lt; &lt; Митлер &gt; &gt; 86"
 GER_tac_bomber_equipment_0_short: "Ju 86"
 GER_tac_bomber_equipment_0_desc: "По заказу бомбардировщика и авиакомпании Ju86 предполагается постепенно свернуть любые самолеты Tirpitz-эпохи в рамках авиаслужбы. Из-за своей прочной конструкции металла и убирающегося основного оборудования он имеет очень хорошее обращение и пользуется популярностью среди пилотов. Он широко используется среди других воздушных сил во всем мире из-за его отличной средней авиационной стабильности и хорошего потребления топлива."
 #Heinkel He 111:
 GER_tac_bomber_equipment_1: "Бомбардировщик &lt; &lt; Ханса-Бранденбург &gt; &gt;"
 GER_tac_bomber_equipment_1_short: "Hb 111"
 GER_tac_bomber_equipment_1_desc: "В связи с растущим спросом бомбардировщиков высшего командования Hansa-Brandenburg ввел Hb 111 для поддержки Ju 86. С его двигателем Benz & Cie он значительно быстрее и, как и его предшественник, широко экспортируется и используется многими военно-воздушными силами по всему миру."
 GER_tac_bomber_equipment_2: "Бомбардировщик &lt; &lt; Дорниер &gt; &gt; 217"
 GER_tac_bomber_equipment_2_short: "До 217"
 GER_tac_bomber_equipment_2_desc: "В целях замены стареющего Ju 86 и Hb 111 Высшее командование приказало произвести новое поколение бомбардировщиков. &lt; &lt; До 217 &gt; &gt; была перепланирована и преобразована в тяжелый бомбардировщик. &lt; &lt; До 217 &gt; &gt; была вооружена лучше, чем ее преемник, и с возможностью осуществлять операции по ныряльному бомбардировке &lt; &lt; Дорнье &gt; &gt; получила контракт без конкуренции."
 GER_tac_bomber_equipment_3: "Бомбардировщик &quot; Junkers &quot; 188"
 GER_tac_bomber_equipment_3_short: "Ju 188"
 GER_tac_bomber_equipment_3_desc: "Ju 188 был разработан как высокоэффективный бомбардировщик, повышающий производительность и полезную нагрузку, после устаревшего Ju 88. Несмотря на то, что Высшее командование скептически относится к этой модели, экспериментальные пилоты с похвалой отозвались о ее конструкции кабины."
 GER_jet_tac_bomber_equipment_1: "Flugzeugbau Фридрихшафен Стролгетрибенер Бомбёр 234"
 GER_jet_tac_bomber_equipment_1_short: "Ff 234"
 GER_jet_tac_bomber_equipment_1_desc: "Разработка реактивных двигателей оказала большое влияние на развитие истребителей и бомбардировщиков. В числе первых в мире боевых реактивных бомбардировщиков большая сила Ff 234 заключается в их высокой скорости. Быстрее, чем обычный движущийся истребитель, он может бежать из старых вражеских самолетов, что повышает вероятность побега без охраны. Несмотря на долгие взлеты, он является высокоаэробным и предпочтение отдается пилотам над бомбардировщиками."
 GER_jet_tac_bomber_equipment_2: "Ганса-Бранденбург Стролгетрибенер Бомбёр 343"
 GER_jet_tac_bomber_equipment_2_short: "Hb 343"
 GER_jet_tac_bomber_equipment_2_desc: "Несмотря на то, что Ff 234 был прорывом в своей области, у него по-прежнему возник ряд проблем, включая трудности с процессом посадки и бомбардировкой, однако оба эти аспекта были улучшены благодаря новому поколению, созданному Hb 343 и создающему еще более быструю, дальнейшую добычу и более безопасный реактивный бомбардировщик."

 GER_large_plane_airframe_0_short: "До P"
 GER_strat_bomber_equipment_1: "Бомбардировщик &lt; &lt; Дорнье Шверер &gt; &gt; 19"
 GER_strat_bomber_equipment_1_short: "До 19"
 GER_strat_bomber_equipment_1_desc: "На авиаслужбу была возложена задача уделять больше внимания стратегическим бомбардировкам, что привело к соревнованию, в котором победил Do 19. &lt; &lt; До 19 &gt; &gt; , тяжелый бомбардировщик, &lt; &lt; Do 19 &gt; &gt; , страдает от халатности и небольшого пространства для бомб, что в конечном итоге стало &lt; &lt; затормозным продуктом &gt; &gt; для предстоящего Hb 177."
 GER_strat_bomber_equipment_2: "Ханса-Бранденбургский бомбардировщик &quot; Шверер &quot; 177"
 GER_strat_bomber_equipment_2_short: "Hb 177"
 GER_strat_bomber_equipment_2_desc: "В Hb 177, разработанном и изготовленном для замены устаревшего Do 19, представлены гораздо более высокие характеристики и оружие, а также просторная внутренняя структура, способная нести почти вдвое больше бомб."
 GER_strat_bomber_equipment_3: "Ханса-Бранденбург Лангстреккенбомбер 277"
 GER_strat_bomber_equipment_3_short: "Hb 277"
 GER_strat_bomber_equipment_3_desc: "Прямо после Hb 177, но только немного изменилось. В то время как тело осталось таким же, самыми крупными изменениями были размеры крыльев и двигателей. Вместо того, чтобы работать под воздействием часто тревожных двигателей Benz & Cie, в Hb 277 были установлены двигатели BMW, повышающие надежность и производительность самолета. Увеличенный размах крыльев также делает самолет способным достичь еще большего расстояния от целей."
 GER_jet_strat_bomber_equipment_1: "Флагзеугбау Фридрихшафен Стролгетрибенер Бомбёр 555"
 GER_jet_strat_bomber_equipment_1_short: "Ff 555"
 GER_jet_strat_bomber_equipment_1_desc: "Разработанный по приказу верховного командования Ff 555 — это бомбардировщик дальнего крыла, построенный для того, чтобы осуществлять бомбардировочные кампании в отдаленных районах, таких как Восточное побережье Северной Америки и Восточная Азия Уралов. Это специальная V-форма была выбрана, чтобы обеспечить лучший аэродинамический поток для достижения более высоких скоростей."

 GER_large_plane_maritime_patrol_plane_airframe_0_short: "До 18"
 GER_large_plane_maritime_patrol_plane_airframe_1_short: "Сделать 24"
 GER_large_plane_maritime_patrol_plane_airframe_2_short: "BV 222"
 GER_large_plane_maritime_patrol_plane_airframe_3_short: "BV 238"
 GER_large_plane_maritime_patrol_plane_airframe_4_short: "BV 555"

 GER_rocket_interceptor_equipment_1: "Bayerische Flugzeugwerke Objektschutzjäger 163"
 GER_rocket_interceptor_equipment_1_short: "Bf 163"
 GER_rocket_interceptor_equipment_1_desc: "Будучи оборонительным летательным аппаратом для защиты воздушного пространства от вражеских самолетов, Bf 163 является действительно уникальным объектом, приводимым в действие ракетным двигателем, самолет должен подняться на высокую высоту, затем взяться за вражеские подрывные группы, возвращаясь к аэродрому. В то время как Высшее командование крайне скептически относится к дизайну и его рискованной тактике, некоторые верят в то, что он является противовоздушной защитой будущего."
 GER_rocket_interceptor_equipment_2: "Bayerische Flugzeugwerke Objektschutzjäger 263"
 GER_rocket_interceptor_equipment_2_short: "Bf 263"
 GER_rocket_interceptor_equipment_2_desc: "Поскольку Bf 163 продемонстрировал свои слабые стороны, Высшее командование разрешило строительство новой модели перехвата на основе ракет. Bf 263 изготовлен из крепких материалов, зажимной кабины пилота и более простого и более эффективного двигателя, что позволило увеличить в два раза высоту боя и значительно повысить шансы на выживание пилота."
 #Ba 349:
 GER_rocket_interceptor_equipment_3: "Фиселер Обьектчютцягер 349"
 GER_rocket_interceptor_equipment_3_short: "Fi 349"
 GER_rocket_interceptor_equipment_3_desc: "Предназначенный в качестве преемника Bf 163 и Bf 263, Fi 349 пытался исправить различные недостатки других перехватчиков. Самолету нужен только один пилот с базовой подготовкой по цели и стрельбе, поскольку он будет управляться автопилотом. Кроме того, после нападения пилоту не нужно возвращаться на взлетно-посадочную полосу на посадку, а он выбрасывается и приземляется парашютом. Этот революционный проект позволяет любому обычному человеку управлять самолетом в случае необходимости."

 GER_medium_plane_scout_plane_airframe_0_short: "Сделать 16"
 GER_scout_plane_equipment_1: "Хеншель Наафклер 126"
 GER_scout_plane_equipment_1_short: "Hs 126"
 GER_scout_plane_equipment_1_desc: "По поручению Немецкой авиаслужбы &lt; &lt; Хенсхель &gt; &gt; спроектировал самолет Hs 126 как высококрылый разведывательный самолет для коротких дальностей. &lt; &lt; Пилоты &gt; &gt; и командование воздушным движением хорошо воспринимают его за короткий взлет и за низкую скорость, которые, как считается, имеют решающее значение для целей наблюдения и сбора разведывательных данных."
 GER_scout_plane_equipment_2: "Focke-Wulf Aufklarer 189"
 GER_scout_plane_equipment_2_short: "Fw 189"
 GER_scout_plane_equipment_2_desc: "Победив в конкурсе дизайна против Ff 198 и Ha 141, Focke Wulf получил контракт на замену стареющего двигателя Hs 126. Двойной двигатель, двойной бум, три сидячих тактических разведывательных самолета действуют главным образом на короткие расстояния."
 GER_medium_plane_scout_plane_airframe_3_short: "Fw 191"
 GER_medium_plane_scout_plane_airframe_4_short: "Ff 234C"

 GER_transport_plane_equipment_1: "&quot; Перевозочный пул &quot; W 34"
 GER_transport_plane_equipment_1_short: "Ju W 34"
 GER_transport_plane_equipment_1_desc: "Junkers W 34 обслуживает Luftstreitkräfte в качестве легкого транспортного и коммунального самолета, способного перевозить людей, предметы снабжения или аппаратуру связи на надежных расстояниях."
 #Ar.232
 GER_transport_plane_equipment_2: "&quot; Перевозочные потоки &quot; 52"
 GER_transport_plane_equipment_2_short: "Ю 52"
 GER_transport_plane_equipment_2_desc: "Опираясь на успех Ju 34, Junkers Ju 52 предлагает более современный дизайн для удовлетворения растущих потребностей вооруженных сил в материально-техническом обеспечении."
 GER_transport_plane_equipment_3: "Транспортный флюгзег 390"
 GER_transport_plane_equipment_3_short: "Ju 390"
 GER_transport_plane_equipment_3_desc: "Ju 390 — это настоящий гигант неба, разработанный для поддержки полетов на большие расстояния через огромные пространства Империи. С его большой дальностью и массивной полезной нагрузкой он особенно подходит для дальней логистики и стратегических операций. Несмотря на свой размер, самолет сохраняет надежность и надежную инженерию, ожидаемую от проектов Junkers."

 GER_helicopter_equipment_1: "Флеттнер Хабшраубер 282 Колибри"
 GER_helicopter_equipment_1_short: "ФЛ 282"
 # GER_helicopter_equipment_1_desc: "Флеттнер Fl 282 Kolibri представляет собой замечательный шаг вперед в области вертолетной авиации, разработанной для поддержки разведывательных и координационных миссий. &lt; &lt; Дизайн &gt; &gt; ее нескончаемого ротора обеспечивает несопоставимую стабильность и маневренность, что делает ее идеальной для операций в замкнутых пространствах, таких, как морские суда или неровная местность. &lt; &lt; Несмотря на то, что она используется главным образом для наблюдения, ее надежность и простота обслуживания обеспечивают ее место в качестве ценного актива для &lt; &lt; Луфтстрейткрэфте &gt; &gt; ."

 GER_strat_bomber_intercontinental_equipment_1: "Хортен Ланстреккенбомбер 18"
 GER_strat_bomber_intercontinental_equipment_1_short: "Ho 18"
 # GER_strat_bomber_intercontinental_equipment_1_desc: "Прорыв в авиационном дизайне, Horten Ho 18, является вершиной немецкой инженерии для стратегических бомбардировок дальнего радиуса действия. Его радикальная конфигурация летающего крыла позволяет уменьшить сечение радара и усовершенствовать аэродинамические системы, что делает его более быстрым и экономичным, чем традиционные бомбардировщики. Разработанный для межконтинентальных операций, включая полеты через Атлантику, Ho18 символизирует амбиции Luftstreitkräfte, направленные на сохранение во всем мире воздушного доминирования."

