 BEL_CAS_equipment_1: "Сабка-Каприни 47"
 BEL_CAS_equipment_1_short: "S.47"
 BEL_CAS_equipment_1_desc: "В 1940 году этот самолет, работавший в непосредственной воздушной поддержке, пострадал от недостаточной скорости, что сделало его легкой целью, а также от недостаточной полезной нагрузки, что сделало невозможным разрушение мостов &lt; &lt; Канал Альберт &gt; &gt; для бедных пилотов, которым были поручены эти последние миссии."
 BEL_CAS_equipment_2: "Ренард 37 B 14N"
 BEL_CAS_equipment_2_short: "R-37 B"
 BEL_CAS_equipment_2_desc: "Renard 37 B — двухпланный вариант R37 для наземных атак, так как был построен только прототип версии истребителя, он остался на бумаге и так и не был сделан."
 BEL_cv_CAS_equipment_2: "Ренард 37 B Aéronaval"
 BEL_cv_CAS_equipment_2_short: "R-37 B"

 BEL_fighter_equipment_0: "Фейри Фокс"
 BEL_fighter_equipment_0_short: "Лиса"
 BEL_fighter_equipment_1: "Фейри Фантом"
 BEL_fighter_equipment_1_short: "Фантом"
 BEL_fighter_equipment_2: "Ренард 38"
 BEL_fighter_equipment_2_short: "Р-38"
 BEL_fighter_equipment_2_desc: "Пересмотр прототипа R-36, который разбился, привел к аннулированию контракта, заключенного с бельгийской армией."
 BEL_cv_fighter_equipment_2: "Ренард 38 Аэронавал"
 BEL_cv_fighter_equipment_2_short: "Р-38 А"

 BEL_small_plane_naval_bomber_airframe_1: "Флагзеугбау Фридрихшафен Ff 195"
 BEL_small_plane_naval_bomber_airframe_1_short: "Ff 195"
 BEL_small_plane_naval_bomber_airframe_2: "&lt; &lt; Ренард 37 &gt; &gt;"
 BEL_small_plane_naval_bomber_airframe_2_short: "R-37 DC"
 BEL_cv_small_plane_naval_bomber_airframe_2: "Ренард 37 Аэронавал"
 BEL_cv_small_plane_naval_bomber_airframe_2_short: "Р-37 Д.А."
 BEL_small_plane_naval_bomber_airframe_2_desc: "Первый пересмотр прототипа R36, Renard 37, существовал только на бумаге, но в планах есть версия "Défense cotier" (прибрежная оборона)."
 BEL_small_plane_naval_bomber_airframe_3: "Hansa-Brandenburg Hb 115"
 BEL_small_plane_naval_bomber_airframe_3_short: "Hb 115"

 BEL_heavy_fighter_equipment_1: "Bayerische Flugzeugwerke Bf 110"
 BEL_heavy_fighter_equipment_1_short: "Bf 110"
 BEL_heavy_fighter_equipment_2: "Капрони Ка331"
 BEL_heavy_fighter_equipment_2_short: "331 ка"
 BEL_heavy_fighter_equipment_3: "Ренард 42"
 BEL_heavy_fighter_equipment_3_short: "R-42"
 BEL_heavy_fighter_equipment_3_desc: "R-42 — двухъярусный вариант R-36 и последующих дизайнов (R-38, R-40) — идея, разработанная позже в American F-82 Twin Mustang. Из-за войны она была только нарисована."

 BEL_tac_bomber_equipment_0: "LACAB GR.8"
 BEL_tac_bomber_equipment_0_short: "GR.8"
 BEL_tac_bomber_equipment_0_desc: "GR.8 под названием "Дорифор" (что означает "Потато Буг" из-за его слабой летной способности) был создан для того, чтобы служить многоцелевым самолетом для бельгийских военно-воздушных сил, который должен был служить бомбардировщиком, разведывательным самолетом и тяжёлым истребителем, который следовал смешным требованиям бельгийской армии к письму... и, следовательно, был плох во всех этих ролях."
 BEL_tac_bomber_equipment_1: "SABCA S.45"
 BEL_tac_bomber_equipment_1_short: "SABCA S.45"
 BEL_tac_bomber_equipment_1_desc: "SABCA S.45 — лицензия, построенная Caproni Ca.135, которая позволяет производить больше самолётов, чем в Италии с ограниченными возможностями."
 BEL_tac_bomber_equipment_2: "Ренард Р.35B"
 BEL_tac_bomber_equipment_2_short: "R.35B"

