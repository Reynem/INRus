 RUS_iw_small_airframe: "Бипланетная авиакомпьютерная установка"
 RUS_iw_small_airframe_desc: "Бипланы считаются стабильными и маневрируемыми самолётами с ограниченной скоростью. Из различных военных бипланов, произведенных в России, I-15 является наиболее успешным и легендарным. I-15, его модификации быстры и стабильны и предназначены для эксплуатации вместе с более передовым I-16 в качестве вертолёта. Хотя большинство бипланов начинают устаревать в 1936 году по мере полета авиационных инноваций, они по-прежнему образуют приличную основу российского воздушного флота."
 RUS_basic_small_airframe: "ЭВМ &lt; &lt; Моноплан &gt; &gt;"
 RUS_basic_small_airframe_desc: "Наиболее примечательной моделью является I-16, который быстро стал легендарным самолётом среди пилотов из-за их высокой степени риска, высокой маневренности: тузы будут использовать I-16 в качестве самого смертоносного оружия, но для неподготовленного пилота одна ошибка может превратить самолет в летающий гроб. ~ Несмотря на то, что авиафлот сосредоточил свои усилия на истребителях, первые бомбардировщики, находящиеся в непосредственной боевой готовности, были разработаны в соответствии с требованиями армии — многоцелевой BB является первым экспериментом российских военно-воздушных сил в самолете, который стремится к успеху во всех ролях — в качестве боевика, бомбардировщика и самолёта-скаута."
 RUS_improved_small_airframe: "Высокоскоростная зенитная ЭВМ"
 RUS_improved_small_airframe_desc: "По мере приближения войны военно-воздушные силы открыли программу для высокоскоростных самолетов. &lt; &lt; Скорост &gt; &gt; , &lt; &lt; Сокол &gt; &gt; и &lt; &lt; Дюкс &gt; &gt; стали основными производителями боевиков, каждый из которых использовал свой собственный подход: &lt; &lt; Скорост &gt; &gt; пытается сочетать гражданские стандарты качества и военные стандарты, &lt; &lt; Дюкс &gt; &gt; проектирует свои самолеты со скоростью и тяжелым вооружением и &lt; &lt; Сокол &gt; &gt; представляет собой самолёты массового производства."
 RUS_advanced_small_airframe: "Полнометаллический корпус"
 RUS_advanced_small_airframe_desc: "Основываясь на опыте, накопленном на фронте против различных проектов вражеских самолетов, российские разработчики самолетов, такие как Скорост и Северский, сосредоточили свои усилия на стандартизации, балансировании и чинке минусов существующих самолетов, вместо того чтобы разрабатывать непроверенные новые конструкции. &quot; Вудэн &quot; стала вещью прошлого, а вес и каждая деталь были испытаны и смягчены. Каждый из новых самолетов должен быть не только лучшей версией предыдущего, но и совершенно другой плоскостью на практике, практически все аспекты которой были усовершенствованы."
 RUS_modern_small_airframe: ""Реактивный боец""
 RUS_modern_small_airframe_desc: "Первоначальные российские реактивные самолеты были впервые запущены компанией Skorost, которая сумела побить Сокола в их разработке, главным образом благодаря успешному преобразованию истребителя I-30 в реактивный самолет. В то время как как Сокол и Скорост являются главными производителями реактивных самолетов для российского авиационного флота, самолеты Skorost, как правило, более надёжны из-за его медленных процессов разработки и заимствования идей у других компаний, в то время как Sololo часто приводят к неожиданным прорывам с его революционными конструкциями."

 RUS_iw_medium_airframe: "Многоцелевая зенитная ЭВМ"
 RUS_medium_plane_airframe_0_desc: "В начале 1930-х годов российский скаут R-6 из TSAGI — скаутский самолёт, выполняющий функции истребителя, который может служить легкой бомбардировкой с 500 кг полезной нагрузки."
 RUS_basic_medium_airframe: "Специализированный мед. бомбардировщик"
 RUS_medium_plane_airframe_1_desc: "По мере быстрого развития авиационных технологий стало очевидно, что необходимы специализированные самолеты. В 1934 году российский авиапарк заказал разработку двух специализированных бомбардировщиков: боевого самолета SB - TSAGI, предназначенного для более близкого расстояния, и бомбардировщика OSOAVIA DB-3 на большие расстояния."
 RUS_improved_medium_airframe: "Разработка СТО"
 RUS_medium_plane_airframe_2_desc: "Специальный технический департамент (STO) был организован военным командованием в течение короткого периода времени для разработки идеального фронтального самолета поддержки. В результате этой программы Гамаюн стал многоцелевым авиакомпанией «100» с передним бомбардировщиком FB-2 и тяжёлым истребителем TIS-3. Все дизайны STO получили высокую оценку со стороны военного командования и пилотов, а новые OSOAVIAIAS DB-3F и Tsagis SB-2 были разработаны в качестве продолжения специализированных проектов одновременно."
 RUS_advanced_medium_airframe: "Тяжелый тактический бомбардировщик"
 RUS_medium_plane_airframe_3_desc: "По мере продолжения войны средние бомбардировщики становились все более разрушительными, часто вооружаясь как ракетами, так и зарядами бомб, сопоставимыми с теми, которые использовались в ходе предыдущих стратегических бомбардировщиков."
 RUS_modern_medium_airframe: ""Реактивный бомбардировщик""
 RUS_medium_plane_airframe_4_desc: "Российские «реактивные бомбардировщики» — это бесконечное соревнование между Gamayun и TsAGI. Первоначально они проиграли Gamayunts RFB-2, TsAGI смогли вернуть свое место в качестве главного разработчика российских тактических бомбардировщиков с RFB-4. У обоих разработчиков есть свои плюсы и минусы, и их самолеты следуют пред-джетовым схемам - TsAGI развивают духовных преемников серии FB, в то время как Гамайун продолжает использовать свою схему серии DB."

 RUS_iw_large_airframe: "Летающий крузер"
 RUS_large_plane_airframe_0_desc: "В начале 1930-х годов появилась одержимость большим «летающим крейсером», который является восьмимоторным бомбардировщиком ТЗ с 12 000 кг (26 500 фунтов) полезной нагрузки, произведенным непосредственно при поддержке Савинкова в 1935 году. Хотя самым большим «летающим крейсером» в российской службе является бомбардировщик ТБ-3 - основа российской стратегической авиации. Хотя эти самолеты были устаревшими даже к 1936 году и, как правило, довольно плохими, они были первыми российскими тяжелыми бомбардировщиками, применявшимися в массовом порядке."
 RUS_basic_large_airframe: "Воздушный корпус дальнего действия"
 RUS_large_plane_airframe_1_desc: "Развитие бомбардировщиков дальнего радиуса действия привело к появлению бомбардировщика ТБ-7, который заменил собой устаревшие летающие крейсеры, который является первым действительно современным стратегическим бомбардировщиком в российской службе с довольно большой полезной нагрузкой и большим диапазоном операций."
 RUS_improved_large_airframe: "Улучшенная серия материалов по туберкулёзу"
 RUS_large_plane_airframe_2_desc: "Поскольку стратегические бомбардировщики сложны в производстве, просто иметь высокую нагрузку на бомбы недостаточно, они должны быть достаточно вооружены для того, чтобы защитить себя от гораздо более дешевых боевиков. С этой целью были разработаны серии ТБ-8 в качестве попытки решить основные проблемы предыдущих серий ТБ-7. Самолет получил переработанные нос и хвост вместе с современными двигателями."
 RUS_advanced_large_airframe: "Серия DVB"
 RUS_large_plane_airframe_3_desc: "Поздняя война показала, что стандартные тяжелые бомбардировщики не справляются со своей главной задачей уничтожения объектов производства противника из-за их ограниченного диапазона и легкости сбития. Серия DVB стала результатом этого откровения: нет попыток правильно нацелиться на «военные цели». Эти самолеты предназначены для того, чтобы стать бомбардировщиками большой дальности, а небольшой флот способен уничтожить город за один раз."
 RUS_modern_large_airframe: "Серия RTB"
 RUS_large_plane_airframe_4_desc: "ТСАГИ стал единственным российским разработчиком, специализирующимся на стратегических бомбардировках, особенно после того, как Сикорский перешёл в специализацию по вертолетам. &quot; ЦАГИ &quot; представляет собой трехмоторные летательные аппараты с хорошими полетными характеристиками и полезной нагрузкой, предназначенными для общеконтинентальных операций, но не имеющим дальности для проведения эффективных межконтинентальных бомбардировок. Несмотря на это, характеристики серии RTB являются непобедимыми в своем классе, и у самолета есть большие возможности для дальнейшей модернизации."

