 HOL_strat_bomber_equipment_1: "Fokker T.VI (Ontwerp 115)"
 HOL_strat_bomber_equipment_1_short: "T.VI (Ontwerp 115)"
 HOL_strat_bomber_equipment_1_desc: "В период с августа 1934 года по февраль 1935 года начались работы над проектом &quot; Ontwerp 115 &quot; . nThe Ontwerp 115 была построена из четырех двигателей низкокрылого типа с убирающимися посадочными устройствами и двойным рулем. Этот самолет имел бы четыре радиальных двигателя с эксплуатационными характеристиками, рассчитанными с помощью Gnome-Rhone 14Krfs at 900Hp, 14Krsd at 1110Hp и Right Cyclone SFR-1820-F2 на 712Hp. Винты были бы три лезвия и регулируемые во время полета."
