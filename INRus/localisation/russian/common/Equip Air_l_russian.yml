 NFA_CAS_equipment_1: "АнФ &lt; &lt; Мюро 117 &gt; &gt; , &lt; &lt; Бомбардирование &gt; &gt; , 2 места"
 NFA_CAS_equipment_1_short: "АНФ 117 РБ.2"
 NFA_CAS_equipment_1_desc: "ANF 117 RB.2 представляет собой модификацию ANF 115. В 1932 году французская армия приняла линию ANF 110 в качестве разведывательных самолетов (ANF 113 R.2) и постоянно модернизировала ее. ANF 117 представляет собой невооруженный однодвигательный моноплан с фиксированным посадочным механизмом и усиленным крылом с колючими проводами и деревянным винтом. В варианте RB.2 установлены блоки подвески для бомб весом до 400 кг, которые могут использоваться для поддержки наземных сил."
 NFA_cv_CAS_equipment_1: "АНФ &lt; &lt; Мюро 117 &gt; &gt; , &lt; &lt; Мер &gt; &gt; , &lt; &lt; Бомбардирование &gt; &gt; , 2 места"
 NFA_cv_CAS_equipment_1_short: "АНФ 117 АМБ.2"
 NFA_cv_CAS_equipment_1_desc: "ANF 117 AMB.2 является одним из носителей модификаций ANF 115. В 1932 году французская армия приняла линию ANF 110 в качестве разведывательных самолетов (ANF 113 R.2) и постоянно модернизировала ее. ANF 117 представляет собой невооруженный, однодвигательный, полностью металлический моноплан с фиксированной посадочной установкой и усиленным крылом с колючей проволокой и деревянным винтом. На версии AMRB.2 установлены блоки подвески для бомб весом до 400 кг, которые могут использоваться для поддержки наземных сил."
 NFA_CAS_equipment_2: "Руссель R.30 Шассе, Вооруженные силы, защита, одно место"
 NFA_CAS_equipment_2_short: "R.30 Раздел 1"
 NFA_CAS_equipment_2_desc: "Разработанный Жаком Русселем R.30 является очень легким и быстрым летательным аппаратом, основанным на концепции MB.150, но с уменьшением размеров самолета и установкой менее мощного и более легкого двигателя. &quot; Состав CAP.1 &quot; , который является главной версией французских сил, вооружается двумя 20-мм пушками и 250-килограммовыми бомбами, быстро превосходящими своих коллег из &quot; Коммунарда &quot; ."
 NFA_cv_CAS_equipment_2: "Руссель R.30 Вооруженные силы, Мер, Чассе, Защита, 1-местная"
 NFA_cv_CAS_equipment_2_short: "R.30 AMCP.1"
 NFA_cv_CAS_equipment_2_desc: "Разработанный Жаком Русселем R.30 является очень легким и быстрым летательным аппаратом, основанным на концепции MB.150, но с уменьшением размеров самолета и установкой менее мощного и легкого двигателя. &lt; &lt; Состав AMCP.1 &gt; &gt; , который является главным носителем французских сил, вооружается двумя 20-мм пушками и 250 кг бомб на скорости, превосходящими его контрагенты &lt; &lt; Коммунард &gt; &gt; ."
 NFA_CAS_equipment_3: "Bloch MB.174 Бомбардировка, 3 места"
 NFA_CAS_equipment_3_short: "MB.174 AB.3"
 NFA_CAS_equipment_3_desc: "В 1936 году французское правительство запросило двух- или трехместный многоцелевой самолет, который можно было бы использовать в качестве нападающего самолета или для разведки. &quot; Блок &quot; предложил двухмоторный низкокрылый самолёт MB.170. &quot; MB.174 &quot; представляет собой модификацию MB.170 с новым двигателем, после испытаний которого французское командование просило переоборудовать MB.174 в атакующий самолет. &quot; AB.2 &quot; вооружена двумя 7,5-миллиметровыми пушками и может нести 400 кг бомб."
 NFA_cv_CAS_equipment_3: "Bloch MB.174 Вооруженные силы, &lt; &lt; Мер &gt; &gt; , &lt; &lt; Бомбардирование &gt; &gt; , 3 места"
 NFA_cv_CAS_equipment_3_short: "MB.174 AMB.3"
 NFA_cv_CAS_equipment_3_desc: "В 1936 году французское правительство запросило двух- или трехместный многоцелевой самолет, который можно было бы использовать в качестве нападающего самолета или для разведки. &quot; Блок &quot; предложил двухмоторный низкокрылый самолёт MB.170. &quot; MB.174 &quot; представляет собой модификацию MB.170 с новым двигателем, после испытаний которого французское командование просило переоборудовать MB.174 в атакующий самолет. &quot; AMB.3 &quot; вооружена двумя 7,5-миллиметровыми пушками и может нести 400 кг бомб."

 NFA_fighter_equipment_0: "Девойтин Д.510 Битва, одно место"
 NFA_fighter_equipment_0_short: "Д.510 С.1"
 NFA_fighter_equipment_0_desc: "Проект истребителя D.50bis был начат в 1931 году по просьбе французской армии. &lt; &lt; Эмиль Девойтин &gt; &gt; , стремящийся достичь высокой скорости полета, переключился с традиционной схемы биплана на моноплан с довольно тонким нижним крылом. &lt; &lt; Д.500 &gt; &gt; был принят в эксплуатацию в 1933 году, два года спустя с новым двигателем и трехполосным винтом, и вошёл в эксплуатацию в качестве D.510 -- первого французского самолета, который превысил 400 км/ч."
 NFA_cv_fighter_equipment_0: "Девойтин Д.510 Вооруженные силы, Мер, боевые силы, 1 место"
 NFA_cv_fighter_equipment_0_short: "Д.510 АМС.1"
 NFA_cv_fighter_equipment_0_desc: "Проект истребителя D.50bis был начат в 1931 году по просьбе французской армии. &lt; &lt; Эмиль Девойтин &gt; &gt; , стремящийся достичь высокой скорости полета, переключился с традиционной схемы биплана на моноплан с довольно тонким нижним крылом. &lt; &lt; Д.500 &gt; &gt; был принят в эксплуатацию в 1933 году, два года спустя с новым двигателем и трехполосным винтом, и вошёл в эксплуатацию в качестве D.510 -- первого французского самолета, который превысил 400 км/ч."
 NFA_fighter_equipment_1: "Bloch MB.150 Chasse, 1-местный"
 NFA_fighter_equipment_1_short: "MB.150 C.1"
 NFA_fighter_equipment_1_desc: "MB.150 является низкоконструктором по строительству металла с убирающимся подвозом и полностью закрытым кабиной. Первоначально он был разработан в соответствии с требованиями французского военного конкурса 1934 года, который был направлен на разработку новой конструкции истребителя. Несмотря на посредственные результаты, в силу ряда благоприятных обстоятельств, в начале 1937 года MB.150 стала основной моделью для просроченной перевооружения отрядов истребителей."
 NFA_cv_fighter_equipment_1: "Bloch MB.150 Вооруженные силы, Мер, Чассе, 1 место"
 NFA_cv_fighter_equipment_1_short: "MB.150 AMC.1"
 NFA_cv_fighter_equipment_1_desc: "MB.150 является низкоконструктором по строительству металла с убирающимся подвозом и полностью закрытым кабиной. Первоначально он был разработан в соответствии с требованиями французского военного конкурса 1934 года, который был направлен на разработку новой конструкции истребителя. Несмотря на посредственные результаты, в силу ряда благоприятных обстоятельств, в начале 1937 года MB.150 стала основной моделью для просроченной перевооружения отрядов истребителей."
 NFA_fighter_equipment_2: "Девойтин Д. 520 Шассе, бомбардировка 1 место"
 NFA_fighter_equipment_2_short: "D.520 CB.1"
 NFA_fighter_equipment_2_desc: "Проект D.520 был разработан в ответ на требование французских военных от 1937 года о быстром, современном истребителе с хорошей скоростью взлета и вооружением, сосредоточенным на 20-миллиметровой пушке. Проект, представленный в 1938 году, был немедленно принят, но военные просили увеличить скорость до 505 км/ч. В 1939 году в качестве более быстрого самолета, чем модифицированный MB.150, D.520 считается самым современным истребителем Франции."
 NFA_cv_fighter_equipment_2: "Девойтин Д. 520 Вооруженные силы, Мер, Чассе, 1 место"
 NFA_cv_fighter_equipment_2_short: "D.520 AMC.1"
 NFA_cv_fighter_equipment_2_desc: "Проект D.520 был разработан в ответ на требование французских военных от 1937 года о быстром, современном истребителе с хорошей скоростью взлета и вооружением, сосредоточенным на 20-миллиметровой пушке. Проект, представленный в 1938 году, был немедленно принят, но военные просили увеличить скорость до 505 км/ч. В 1939 году в качестве более быстрого самолета, чем модифицированный MB.150, D.520 считается самым современным истребителем Франции."
 NFA_fighter_equipment_3: "&lt; &lt; Арсенал VG-60 &gt; &gt; , &lt; &lt; Чассе &gt; &gt; , бомбардировка 1 место"
 NFA_fighter_equipment_3_short: "VG.60 CB.1"
 NFA_fighter_equipment_3_desc: "Проект самолета с названием VG-30 начался в конце 1937 года и осуществлялся по инициативе без какого-либо государственного приказа. VG-60 является полностью деревянным низкокрылым монопланом, использующим фанеру над стрингерами в полумонокококе с традиционной компоновкой, и был принят в эксплуатацию в конце 1942 года."
 NFA_cv_fighter_equipment_3: "Arsenal-Delanne AD.15 Вооруженные силы, Мер, Чассе, 2 места"
 NFA_cv_fighter_equipment_3_short: "AD.15 AMC.2"
 NFA_cv_fighter_equipment_3_desc: "Arsenal-Delanne 15 AMC.2 — двухместный двухместный истребитель, спроектированный Морисом Деланном и построенный Арсеналом де л'Эронаутика по просьбе французских ВМС. Пилотное и боевое кресло в тандеме под единым пологом в задней части фюзеляжа, что дает стреляющему свободное поле огня за его вооружение двух пулеметов калибра 7,5 мм."
 #Br.1002 Taon:
 NFA_jet_fighter_equipment_1: "Arsenal-Delanne AD.1002 Chasse, Bombardment 1- место"
 NFA_jet_fighter_equipment_1_short: "AD.1002 CB.1"
 NFA_jet_fighter_equipment_1_desc: "В 1944 году французские заводы-изготовители самолетов были приглашены правительством для разработки программы "Лучший ударный боец". AD.1002 был разработан Морисом Деланной и инженерами Arsenal de l'Aéronautique в соответствии с требованиями французских военных, к ракетному самолёту среднего крыла с вылетающими крыльями и убирающимся трициклом подвоза, который был принят в эксплуатацию в 1945 году после первоначальных испытаний, AD.1002 является первым французским серийным реактивным истребителем."
 #Sud-Ouest SO.6025 Espadon:
 NFA_jet_fighter_equipment_2: "Dewoitine D.6025 Боевые действия, 1 место"
 NFA_small_plane_airframe_5: "Dewoitine D.6025 Боевые действия, 1 место"
 NFA_jet_fighter_equipment_2_short: "D. 025 C.1"
 NFA_small_plane_airframe_5_short: "D. 025 C.1"
 NFA_jet_fighter_equipment_2_desc: "D.6025 () — одноместный монопланный перехватчик, работающий на 5 000 лб. Вооруженный шестью 20-мм пушками или четырьмя 30-мм пушками, D.6025 представляет собой третью линию D.6020, модифицированную жидкотопливным ракетным двигателем под фюзеляжем. Приемлемый в 1949 году, D.6025 предназначен для замены AD.1002 в качестве главного французского истребителя."

 NFA_small_plane_naval_bomber_airframe_1: "Латекоер (позднее 290 торпиля, ренеджиент, 3 места)"
 NFA_small_plane_naval_bomber_airframe_1_short: "Конец 290 TR.3"
 NFA_small_plane_naval_bomber_airframe_1_desc: "Разработанный Латекоэром в ответ на требования, предъявляемые к такому самолету, Late 290 основан на успешном почтовом самолете Laté 283, обычном высококрылом моноплане, который несет одну торпеду с внешней стороны под фюзеляжем. Конец 290 вошел в эксплуатацию в 1934 году, и по схеме он похож на его гражданских предшественников."
 NFA_cv_small_plane_naval_bomber_airframe_1: "Окончание 29,0 Вооруженных сил, Мер, Торпилль, 3 места"
 NFA_cv_small_plane_naval_bomber_airframe_1_short: "Поздно 290 AMT.3"
 NFA_cv_small_plane_naval_bomber_airframe_1_desc: "Разработанный Латекоэром в ответ на требования, предъявляемые к такому самолету, Late 290 основан на успешном почтовом самолете Laté 283, обычном высококрылом моноплане, который несет одну торпеду с внешней стороны под фюзеляжем. Конец 290 вошел в эксплуатацию в 1934 году и похож на его гражданские предшественники."
 NFA_small_plane_naval_bomber_airframe_2: "Латекоер (позднее - 298 торпиля, ренеджиент, 3 места)"
 NFA_small_plane_naval_bomber_airframe_2_short: "Конец 298 TR.3"
 NFA_small_plane_naval_bomber_airframe_2_desc: "Разработанный с 1936 года, конце 298 предназначен для замены не столь успешного конце 290 в качестве основного взрывателя торпеды, а также для использования в качестве авианосца в соответствии с военными спецификациями. &quot; Конец 29.8 &quot; , будучи среднекрылым монопланом с автоматическим винтом &quot; Ратье &quot; , оснащенным электрическим управлением, может нести одну торпеду весом 670 кг, или 500 кг бомб, и вооружен двумя пулеметами."
 NFA_cv_small_plane_naval_bomber_airframe_2: "Поздно 298 военнослужащих, Мер, Торпилль, 3 места"
 NFA_cv_small_plane_naval_bomber_airframe_2_short: "Поздно 298 AMT.3"
 NFA_cv_small_plane_naval_bomber_airframe_2_desc: "Разработанный с 1936 года, конце 298 предназначен для замены не столь успешного конце 290 в качестве основного взрывателя торпеды, а также для использования в качестве авианосца в соответствии с военными спецификациями. Будучи среднекрылым монопланом с автоматическим винтом "Ратье", оснащенным электрическим управлением, последний 298 может нести одну торпеду весом 670 кг, или 500 кг бомб, и вооружен двумя пулеметами."
 NFA_small_plane_naval_bomber_airframe_3: "&quot; Девойтин HD.780 &quot; , &quot; Торпилль &quot; , наблюдение, 1 место"
 NFA_small_plane_naval_bomber_airframe_3_short: "HD.780-1"
 NFA_small_plane_naval_bomber_airframe_3_desc: "В конце лета 1941 года французское командование выпустило спецификацию для высокоскоростного поплавка, в соответствии с требованиями, которые были разработаны Dewoitine HD.780 и авианосец, версия HD.790. Конструкторы Dewoitine использовали фюзеляж D.520 практически без изменений, за исключением модифицированных крыльев, в качестве основы для нового самолета."
 NFA_cv_small_plane_naval_bomber_airframe_3: "Dewoitine HD.790 Вооруженные силы, Мер, Торпилль, 1 место"
 NFA_cv_small_plane_naval_bomber_airframe_3_short: "HD.790 AMT.1"
 NFA_cv_small_plane_naval_bomber_airframe_3_desc: "В конце лета 1941 года французское командование выпустило спецификацию для высокоскоростного поплавка, в соответствии с требованиями, которые были разработаны Dewoitine HD.780 и авианосец, версия HD.790. Конструкторы Dewoitine использовали фюзеляж D.520 практически без изменений, за исключением модифицированных крыльев, в качестве основы для нового самолета."

 NFA_heavy_fighter_equipment_1: "Бомбардировка Блоха MB.130, боевые действия, аренда, 3 места"
 NFA_heavy_fighter_equipment_1_short: "MB.130 BCR.3"
 NFA_heavy_fighter_equipment_1_desc: "MB.130 является метеоритным, двухдвигателем, низкокрылым монопланом с убирающимися посадочными снарядами и вооружен тремя гибкими пулеметами. &lt; &lt; MB.130 &gt; &gt; , разработанный в ответ на запрос 1936 года о тактическом бомбардировщике, может использоваться для выполнения функций бомбардировщика, разведчика или эскорта дальнего радиуса действия, однако французские военные в основном используют этот самолет в качестве эскорта дальнего действия ввиду небольшого числа самолетов, которые могут выполнять эту роль."
 NFA_heavy_fighter_equipment_2: "Bloch MB.170 Армия, бомбардировка, реномерация, 3 места"
 NFA_heavy_fighter_equipment_2_short: "MB.170 ABR.3"
 NFA_heavy_fighter_equipment_2_desc: "В 1938 году французское правительство запросило двух- или трехместный многоцелевой самолет, который можно было бы использовать в качестве нападающего самолета или для разведки. &quot; Блок &quot; предложил двухмоторный низкокрылый самолёт MB.170, который был признан весьма перспективным. &quot; Брюшной купол &quot; был снят, и проект претерпел значительные изменения, преобразовав MB.170 в тяжелый истребитель, в то время как была запрошена разработка различных вариантов MB.170."
 #Hell know what it is, maybe Potez 63.11 modified :
 NFA_heavy_fighter_equipment_3: "Бомбардировка, боевые действия, реномерация, 3 места"
 NFA_heavy_fighter_equipment_3_short: "MB.260 BCR.3"
 NFA_heavy_fighter_equipment_3_desc: "MB.260, основанный на захваченных конструкциях Коммунарда, считается надежным истребителем дальнего действия следующего поколения. MB.260, разработанный Société des Avions Marsel Bloch, вооружён 3 7,5-мм пушками и может нести до 400 кг бомб, что делает его хорошим многофункциональным истребителем."

 NFA_tac_bomber_equipment_0: "Amiot 143 Бомбардировка, боевые действия, присвоение, 5 мест"
 NFA_tac_bomber_equipment_0_short: "Amiot 143 BCR.5"
 NFA_tac_bomber_equipment_0_desc: "В 1929 году французское правительство выпустило спецификацию для четырехместного боевого самолета, который будет действовать в качестве легкого бомбардировщика, разведывательных самолетов и дальнего эскорта, на котором Амиот предложил свой проект Amiot 140. Amiot 140 является высококрылым монопланом с гофрированным крылом и неподвижным хвостовым колесом. В 1934 году модифицированный Amiot 143 был практически переподготовлен в ночной бомбардировщик, но в последнюю минуту он был принят в соответствии с классификацией BCR."
 NFA_tac_bomber_equipment_1: "Bloch MB.210 Бомбардирование, боевые действия, Нуит, 5 мест"
 NFA_tac_bomber_equipment_1_short: "MB.210 BCN.5"
 NFA_tac_bomber_equipment_1_desc: "Bloch MB.210 — это разработка MB.200, разработанная в ответ на требование 1934 года о новом бомбардировке в день/ночь. MB.210 является двухмоторным низкокрылым самолётом с стационарным подвозом. Хотя самолёт доказал, что он является чрезвычайно прочным и надежным летательным аппаратом, практически не страдающим какими-либо серьезными дефектами, многие отмечают, что его соотношение тяги к весу является недостаточным, а его двигатели ненадежны по современным стандартам."
 #Modified MB.220:
 NFA_tac_bomber_equipment_2: "Bloch MB.230 Бомбардировка, боевые действия, 4 места"
 NFA_tac_bomber_equipment_2_short: "MB.230 БК.4"
 NFA_tac_bomber_equipment_2_desc: "Тактический бомбардировщик MB.230 построен из ячейки транспортного самолета Bloch MB.220. Все пассажирское и грузовое пространство было переоборудовано для размещения бомбового отсека, позволяющего хранить и доставлять взрывоопасные боеприпасы, что делает MB.230 эффективным тактическим бомбардировщиком, способным наносить удары как по наземным, так и по военно-морским целям."
 NFA_tac_bomber_equipment_3: "Amiot 354 Вознаграждение, бомбардировка, 4 места"
 NFA_tac_bomber_equipment_3_short: "Amiot 354 RB.4"
 NFA_tac_bomber_equipment_3_desc: "Серия Amiot 350 была основана на том же требовании 1936 года как соперник MB.130. 354 модель Amiot 350, выпущенная из почтового самолета Amiot 341, была сочтена непригодной для удовлетворения потребностей французских военных, но разработка продолжалась из-за потенциала нового самолета."
 #SNCASE S.E.5000 Baroudeur :
 NFA_jet_tac_bomber_equipment_1: "Bloch MB.XIII Бомбардирование, боевые действия, 1 место"
 NFA_jet_tac_bomber_equipment_1_short: "MB.XIII.BC.1"
 NFA_jet_tac_bomber_equipment_1_desc: "MB.X — одномоторный лёгкий самолёт, разработанный компанией Société des Avions Marsel Bloch для программы "Light Black Fight Fighter"."
 #SNCASO S.O. 4050 Vautour II :
 NFA_jet_tac_bomber_equipment_2: "Девойтин Д4050 Бомбардировка, боевые действия, 2 места"
 NFA_jet_tac_bomber_equipment_2_short: "Д4050 док. 2"
 NFA_jet_tac_bomber_equipment_2_desc: "Д4050 является реактивным боевым летательным аппаратом среднего размера, предназначенным для использования в качестве бомбардировщика и нападающего самолета."

 NFA_strat_bomber_equipment_1: "Бернар 82 Бомбарда, 3 места"
 NFA_strat_bomber_equipment_1_short: "Бернар 82 B.3"
 NFA_strat_bomber_equipment_1_desc: "Бернард 82 был разработан на основе дальнего Бернарда 80 ГР (Гранд Рейд), который был разработан для установления данных о дальнем полете. &quot; Бернард 82 &quot; - это трехместный бомбардировщик дальнего действия с одной оборонительной мобильной монтировкой с пулеметом калибра 7,7 мм и возможной нагрузкой в 1000 килограммов. &quot; Бернард 82 &quot; , разработанный в 1934 году, продемонстрировала хороший дальность полета, но низкую скорость, что привело к использованию &quot; MB.130 &quot; в качестве вспомогательного истребителя для &quot; Бернард 82 &quot; ."
 #Modified MB.162:
 NFA_strat_bomber_equipment_2: "Бомбарда Блох-МБ.165, 5 мест"
 NFA_strat_bomber_equipment_2_short: "БМ 165 B.5"
 NFA_strat_bomber_equipment_2_desc: "Bloch MB.165 — четырехмоторный бомбардировщик на большие расстояния, разработанный компанией Société des Avions Marsel Bloch в 1940 году. &lt; &lt; Блох &gt; &gt; ( &lt; &lt; Блох &gt; &gt; ) из скоростного гражданского транспорта MB.160. &lt; &lt; МБ.165 &gt; &gt; , &lt; &lt; МБ.162 &gt; &gt; , который считался французскими военными недостаточно быстрым по сравнению со своими коллегами из &lt; &lt; Коммунарда &gt; &gt; , что привело к разработке окончательной версии &lt; &lt; МБ.165 &gt; &gt; . &lt; &lt; МБ165 &gt; &gt; может перевозить бомбы на сумму 3600 кг, вооружена двумя пулями калибра 7,5 мм для самообороны и имеет хорошую скорость даже при полной загрузке."
 NFA_strat_bomber_equipment_3: "Блох MB.175 Бомбардирование, 3 места"
 NFA_strat_bomber_equipment_3_short: "MB.175 B.3"
 NFA_strat_bomber_equipment_3_desc: "Инженерная группа &lt; &lt; Блох &gt; &gt; продемонстрировала отличную эффективность полета, превосходную маневренность и управляемость, а также прочность воздушных корпусов в самом начале программы испытаний на полет в целях создания специализированной бомбардировочной версии &lt; &lt; Блох МБ.174-01 &gt; &gt; . &lt; &lt; МБ.175 &gt; &gt; имеет переоборудованную бомбовую батарею, способную нести бомбы весом 100-200 кг каждая с полной нагрузкой 800 кг. &lt; &lt; МБ.175 &gt; &gt; имеет более низкую мощность в других областях, таких, как скорость и оперативность."
 #étendard II:
 NFA_jet_strat_bomber_equipment_1: "Bloch MB.XXII Бомбардирование, боевые действия, 1 место"
 NFA_jet_strat_bomber_equipment_1_short: "MB.XXII БК.1"
 NFA_jet_strat_bomber_equipment_1_desc: "MB.XXII изначально был многофункциональным истребителем-бомбардировщиком, который был разработан в рамках программы «Лайт-Бойц-байкер», но был отвергнут из-за плохой работы в качестве истребителя. Преобразован в бомбардировщика дальнего действия по просьбе французских военных, вторая модель была введена в 1949 году и вступила в эксплуатацию в 1950 году. MB.XXII, вооружённая двумя 30-мм пушками и способная перевозить бомбы весом 1 500 кг, имеет диапазон 1 600 км."

 NFA_scout_plane_equipment_1: "Блох MB.131 Аренда, бомбардировка, 4 места"
 NFA_scout_plane_equipment_1_short: "MB.131 РБ.4"
 NFA_scout_plane_equipment_1_desc: "Bloch MB.131 — монопланный рекогносцировочный бомбардировщик, разработанный в 1936 году на основе MB.130 для французского правительства. &quot; MB.130 &quot; изначально имел очень обычные характеристики и был модифицирован для усовершенствования внутреннего бомбового отсека и обновленного оборудования. &quot; MB.131 &quot; используется главным образом для разведки."
 NFA_scout_plane_equipment_2: "Dewoitine D.720 Вооруженные силы, ревизион, 3 места"
 NFA_scout_plane_equipment_2_short: "D.720 AR.3"
 NFA_scout_plane_equipment_2_desc: "В 1938 году французские военные выпустили спецификацию для трехместного самолета по сотрудничеству в области разведки/арметики. &lt; &lt; D.720 &gt; &gt; , который был введен в эксплуатацию в конце 1939 года, в основном изготовлен из древесины с тканью и обнажённым пиломатериалом, с прямоугольным фюзеляжем, в котором экипаж находится в двух остекленных кабинах, и с сиденьем наблюдателя в носу под обширным стеклом. &lt; &lt; Защитное вооружение &gt; &gt; состоит из четырех пулеметов, и самолет подходит как для разведывательных миссий, так и для подготовки новых пилотов."

 NFA_transport_plane_equipment_1: "Bloch MB.220 Трубы, транспортировка, 2 места"
 NFA_transport_plane_equipment_1_short: "MB.220 TT"
 NFA_transport_plane_equipment_1_desc: ""Bloch MB.220" — самолёт с двумя металлическими двигателями, разработанный для гражданского использования, который, по признанию французских военных, вскоре стал главным транспортным самолетом французской армии и базой бомбардировщиков Bloch MB.230."

