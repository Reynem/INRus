 GXC_tac_bomber_equipment_1_short: "B-3"
 GXC_tac_bomber_equipment_1_desc: "Первый полностью внутренний дизайн бомбардировщиков в Китае, создание B-3, придало большой престиж китайской авиационной промышленности, которая до тех пор считалась полностью отсталой и слаборазвитой."

