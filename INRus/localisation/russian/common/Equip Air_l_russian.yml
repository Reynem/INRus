 GXC_small_plane_naval_bomber_airframe_2_short: "РВ-1"
 GXC_small_plane_naval_bomber_airframe_2_desc: "Ближайшая копия австро-венгерского бомбардировщика, в частности бохемского, среднего бомбардировщика, PB-1 отличается от этого чешского дизайна в том смысле, что он специализируется на операциях по военно-морскому патрулированию."
 GXC_small_plane_naval_bomber_airframe_3: "Гуанчжоу PB-2"
 GXC_small_plane_naval_bomber_airframe_3_short: "РВ-2"

