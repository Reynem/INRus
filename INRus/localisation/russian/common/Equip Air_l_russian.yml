 ###
 ### ALB - Albania ###
 ###

 ALB_CAS_equipment_1: "Aero Vodochody A.101"
 ALB_CAS_equipment_1_short: "А.101"
 ALB_CAS_equipment_1_desc: "Без современных самолетов для наземных атак Двойная монархия стремилась модифицировать существующие модели, с тем чтобы они соответствовали этой роли. A.101 является кульминацией ряда попыток усовершенствовать биплан A.230 для выполнения этой роли."
 ALB_CAS_equipment_2: "Вайс Манфред WM.231"
 ALB_CAS_equipment_2_short: "WM.231"
 ALB_CAS_equipment_2_desc: "Вайс Манфред представил истребителя WM.23, чтобы соревноваться с дизайном Авии. В то время как его ковровые, моторизованные пулеметы Geball впечатлили Комитет, вместо этого был выбран B.135. Вайс Манфред ответил небольшой перестройкой, вновь представив его в качестве ныряльщика вместо того, чтобы дополнить стареющий флот бипланов A.101, находящихся в эксплуатации."
 ALB_CAS_equipment_3: "Вайс Манфред WM.44"
 ALB_CAS_equipment_3_short: "WM.44"
 ALB_CAS_equipment_3_desc: "Разработанная Ласло Варго, по существу, была меньшей, двух-миллиметровой версией серии тяжелых истребителей и быстрых бомбардировщиков WM.31, как и ее предшественник, она была изготовлена из древесины и металла, чтобы повысить производительность."

 ALB_fighter_equipment_0: "Фёникс Д.В."
 ALB_fighter_equipment_0_short: "D.V"
 ALB_fighter_equipment_0_desc: "В 1933 году Австрийские военно-воздушные силы приняли решение о предоставлении в Албанию десятков Д.В. Кроме того, было начато производство в небольших масштабах."
 ALB_fighter_equipment_1: "Авиа Б.534"
 ALB_fighter_equipment_1_short: "B.534"
 ALB_fighter_equipment_1_desc: "В 1932 году реноверный бохемский инженер Франтишек Новотни начал работать с компанией «Авиа» над новым полностью металлическим бипланом, кульминацией которого стал B-34, который был почти принят двухсторонней монархией над Фёниксом. Новотний перестроил B-34 с помощью нового двигателя и шасси, а также полностью закрытого кабины. В отличие от своего предшественника, эта модель, B-534, была принята двойной монархией."
 ALB_fighter_equipment_2: "Авиа Б.135"
 ALB_fighter_equipment_2_short: "B.135"
 ALB_fighter_equipment_2_desc: "После успеха своего биплана B-534 Авиа вскоре приступила к работе над передовым монопланом, который в конечном итоге завершится B-135."
 ALB_fighter_equipment_3: "Авиа-Икар Б.224"
 ALB_fighter_equipment_3_short: "B.224"
 ALB_fighter_equipment_3_desc: "С помощью Kosta Sivchev, а также компании Illyrian Ikarus, двигатель B.224 был модернизирован на отличное 1000 hp Austro-Daimler V12E, а пулеметы были заменены двумя тяжелыми пулеметами Geball 12,7 мм, увеличивающими скорость и огневой мощью над своим предшественником."
 ALB_jet_fighter_equipment_1: "Авиа Бф. 262"
 ALB_jet_fighter_equipment_1_short: "Bf.262"
 ALB_jet_fighter_equipment_1_desc: "Отстаивая в разработке реактивных истребителей, Авиа приобрела лицензию на производство Bf 262 для Fleygerkorps, заменив 30-мм немецкие пушки на 20-миллиметровые пушки местного производства в их слегка пересмотренном дизайне."
 ALB_jet_fighter_equipment_2: "Летов L.52"
 ALB_small_plane_airframe_5: "Летов L.52"
 ALB_jet_fighter_equipment_2_short: "L.52"
 ALB_small_plane_airframe_5_short: "L.52"
 ALB_jet_fighter_equipment_2_desc: "Когда Austro-Daimler разработал U2 "Uzelac" двигатель, Летов произвел современный реактивный истребитель, который станет первым местным реактивным самолетом монархии, принятым в эксплуатацию."

 ALB_small_plane_naval_bomber_airframe_1: "Летов Ш.328.v"
 ALB_small_plane_naval_bomber_airframe_1_short: "Ш.328.v"
 ALB_small_plane_naval_bomber_airframe_1_desc: "Ш.328.v — производная морского самолета серии Ш.28, которая была вооружена двумя пулеметами 8-мм спереди и еще двумя пулеметами на гибкой монтировке сзади и имела полезную нагрузку в 500 кг."
 ALB_small_plane_naval_bomber_airframe_2: "Лойнер-Фоккер Т.VIII Вт/С"
 ALB_small_plane_naval_bomber_airframe_2_short: "Т.VIII Вт/С"
 ALB_small_plane_naval_bomber_airframe_2_desc: "Компания &lt; &lt; Лонер &gt; &gt; , которая ранее делала морские самолеты и летающие лодки для Кьюк."
 ALB_small_plane_naval_bomber_airframe_3: "Вайс Манфред WM.442"
 ALB_small_plane_naval_bomber_airframe_3_short: "WM.442"
 ALB_small_plane_naval_bomber_airframe_3_desc: "WM.442 — вариант морских самолётов WM.44, изготовленный для Sefligerkorps и предназначенный для антикорабельных операций в Адриатике и Средиземном море."

 ALB_heavy_fighter_equipment_1: "Прага E.51"
 ALB_heavy_fighter_equipment_1_short: "E.51"
 ALB_heavy_fighter_equipment_1_desc: "Первоначально спроектированный как разведывательный самолет, было быстро установлено, что E.51 может быть быстро адаптирован как тяжелый истребитель для борьбы со стратегическими бомбардировщиками."
 ALB_heavy_fighter_equipment_2: "Вайс Манфред WM.31"
 ALB_heavy_fighter_equipment_2_short: "WM.31"
 ALB_heavy_fighter_equipment_2_desc: "Венгерский авиационный инженер Ласло Варга разработал этот трехместный истребитель вокруг экспериментальных газовых турбинных двигателей, однако возникли технические трудности, которые были заменены двумя Austro-Daimler V12D."
 ALB_heavy_fighter_equipment_3: "Вайс Манфред WM.50"
 ALB_heavy_fighter_equipment_3_short: "WM.50"
 ALB_heavy_fighter_equipment_3_desc: "WM.50 — довольно продвинутый проект, разработанный для своего времени: двухзвуковая конфигурация двигателя, двухбумовый самолёт Лазло Варга, был разработан для значительного повышения эффективности двухмоторных истребителей в борьбе с бомбардировщиками высокого уровня."

 ALB_tac_bomber_equipment_0: "Авиа Ф.39"
 ALB_tac_bomber_equipment_0_short: "F.39"
 ALB_tac_bomber_equipment_0_desc: "Компания &lt; &lt; Фоккер &gt; &gt; , первоначально разработанная компанией &lt; &lt; Фоккер &gt; &gt; как транспортное судно, &lt; &lt; Ф.IX &gt; &gt; , быстро увидела военный потенциал самолета и, получив лицензию на этот самолет, переоборудовала самолет &lt; &lt; Ф.IX &gt; &gt; как бомбардировщик &lt; &lt; Ф.39 &gt; &gt; . &lt; &lt; Двойная монархия &gt; &gt; , которой не хватало бомбардировщиков, приняла F.39 как &lt; &lt; стоп-кап &gt; &gt; , в то время как были разработаны новые модели."
 ALB_tac_bomber_equipment_1: "Летов Ш-50"
 ALB_tac_bomber_equipment_1_short: "Ш-50"
 ALB_tac_bomber_equipment_1_desc: "Намереваясь удовлетворить просьбу Флигеркорпса о создании двухфункционального самолета из трех человек, Летов представил S-50. Однако дизайн не поймал интереса и никогда не будет произведен, а дизайн Aero в конечном итоге будет принят."
 ALB_tac_bomber_equipment_2: "Aero Vodochody A.300"
 ALB_tac_bomber_equipment_2_short: "А.300"
 ALB_tac_bomber_equipment_2_desc: "Этот проект бомбардировщика Антонина Гусника был одним из самых быстрых в списке самолетов, только за недавно принятым истребителем B.135. Быстро и с хорошей полезной нагрузкой он оказался многоцелевым бомбардировщиком и разведывательным самолетом."
 ALB_tac_bomber_equipment_3: "Вайс Манфред WM.311"
 ALB_tac_bomber_equipment_3_short: "WM.311"
 ALB_tac_bomber_equipment_3_desc: "WM.31 был быстро адаптирован для выполнения функций оперативного тактического бомбардировщика путем ослабления его наступательных вооружений и повышения его полезной нагрузки."
 ALB_jet_tac_bomber_equipment_1: "Летов L.11"
 ALB_jet_tac_bomber_equipment_1_short: "L.11"
 ALB_jet_tac_bomber_equipment_1_desc: "Основываясь на дизайне реактивных истребителей Bayerische Flugzeugwerke, L.11 адаптировал дизайн к быстрому и легкому бомбардировщику для выполнения различных функций, надеясь заменить флот монархии из старых тактических бомбардировщиков."
 ALB_jet_tac_bomber_equipment_2: "Aero L.44"
 ALB_jet_tac_bomber_equipment_2_short: "L.44"
 ALB_jet_tac_bomber_equipment_2_desc: "С ростом надежности реактивных двигателей и усилением конкуренции Аэро решил задачу разработки быстрого взрыва следующего поколения, который привел бы к быстрому бомбардировщику L.44."

 ALB_strat_bomber_equipment_1: "Авия-Дорнье До 19"
 ALB_strat_bomber_equipment_1_short: "До 19"
 ALB_strat_bomber_equipment_1_desc: "Не имея дизайна для стратегических бомбардировщиков, Авиа купила несколько бомбардировщиков Дорнье с четырьмя двигателями, чтобы продемонстрировать свой потенциал военно-воздушным силам."
 ALB_strat_bomber_equipment_2: "Авия-Джункерс Ю. 290"
 ALB_strat_bomber_equipment_2_short: "Ju.290"
 ALB_strat_bomber_equipment_2_desc: "Авиа приобрела несколько Ju.290 в дополнение к небольшому флоту Do.19."
 ALB_strat_bomber_equipment_3: "Вайс Манфред WM.65"
 ALB_strat_bomber_equipment_3_short: "WM.65"
 ALB_strat_bomber_equipment_3_desc: "Четырехмоторный дизайн Lázlo Varga был первым отечественным тяжёлым бомбардировщиком подобного рода в Империи."
 ALB_jet_strat_bomber_equipment_1: "Aero-Flugzeugbau Фридрихшафен FF16"
 ALB_jet_strat_bomber_equipment_1_short: "FF.16"
 ALB_jet_strat_bomber_equipment_1_desc: "Немецкий Flugzeugbau Фридрихшафен FF.16 будет принят в качестве бомбардировщика дальнего радиуса действия Австрии, производимого компанией Aero Vodochody."

 ALB_scout_plane_equipment_1: "Вайс Манфред WM.21"
 ALB_scout_plane_equipment_1_short: "WM.21"
