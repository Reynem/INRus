 BUL_fighter_equipment_0: "Авиа Б-34"
 BUL_fighter_equipment_0_short: "Б-34"
 BUL_fighter_equipment_0_desc: "Когда проект компании «Авиа Б-34» был передан «Двойной монархией», компания посмотрела на экспортный рынок, чтобы восстановить свои инвестиции."
 BUL_fighter_equipment_1: "Авиа Б.534"
 BUL_fighter_equipment_1_short: "B.534"
 BUL_fighter_equipment_1_desc: "В 1932 году реноверный бохемский инженер Франтишек Новотни начал работать с компанией «Авиа» над новым полностью металлическим бипланом. Кульминацией этой работы стал B-34, который был практически принят двойной монархией над Фёниксом. Новотний перестроил B-34 с помощью нового двигателя и шасси, а также полностью закрытой кабины. Как и B-34, эта модель была также принята болгарами, и в отличие от ее предшественника B-534 также была принята двойной монархией."
 BUL_fighter_equipment_2: "ДАР 11 "Лястовитса""
 BUL_fighter_equipment_2_short: "ДАР 11"
 BUL_fighter_equipment_2_desc: "После успеха своего биплана B-534 Авиа вскоре приступила к работе над передовым монопланом, который в конечном счете завершится в B-135. Компания DAR приобрела право производить судно на территории Болгарии благодаря своим впечатляющим показателям работы в службе в Габсбурге. Компания DAR внесла незначительные изменения, однако это судно по существу остается тем же."
 BUL_fighter_equipment_3: "ДАР 12"
 BUL_fighter_equipment_3_short: "ДАР 12"
 BUL_fighter_equipment_3_desc: "Когда главный дизайнер компании DAR Zvetan Lazarov DAR-10A был отвергнут компанией в пользу отечественной модифицированной производной B-135 компании Avia, он и его команда вернулись к рисунку, в конечном счете проектировав совершенно новый боец высокого уровня, первый полностью отечественный болгарский самолет, в котором была установлена нажатая кабина. Истребитель был принят на болгарскую службу в качестве DAR-12."
 #Laz-14:
 BUL_jet_fighter_equipment_1: "ДАР 14"
 BUL_jet_fighter_equipment_1_short: "ДАР 14"

 BUL_small_plane_naval_bomber_airframe_1: "Флагзеугбау Фридрихшафен Ff 195"
 BUL_small_plane_naval_bomber_airframe_1_short: "Ff 195"
 BUL_small_plane_naval_bomber_airframe_2: "KB-11 "Фазан""
 BUL_small_plane_naval_bomber_airframe_2_short: "KB-11"
 BUL_small_plane_naval_bomber_airframe_2_desc: "Первоначально предполагалось, что КБ-11 будет выполнять функции рекогносцировки и легкого атаки, а затем будет перенаправляться в военно-морское патрульное судно."

 BUL_heavy_fighter_equipment_1: "Bayerische Flugzeugwerke Bf 110"
 BUL_heavy_fighter_equipment_1_short: "Bf 110"
 BUL_heavy_fighter_equipment_2: "Джункеры Ju 88"
 BUL_heavy_fighter_equipment_2_short: "Ju 88"
