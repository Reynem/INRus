 ### FIN - Kingdom of Finland ###
 ###

 FIN_CAS_equipment_1: "Fokker-VL C.X III"
 FIN_CAS_equipment_1_short: "С.Х. III"
 FIN_CAS_equipment_1_desc: "В 1933 году голландцы приняли Fokker C.X для того, чтобы избежать зенитного огня, и поэтому имели низкую скорость. Финский вариант серии III имел несколько модифицированный шасси и реконструированные крылья, а также новый двигатель."
 FIN_CAS_equipment_2: "Fokker C.XIII"
 FIN_CAS_equipment_2_short: "C.XIII"
 FIN_CAS_equipment_3: "SAAB A 21"
 FIN_CAS_equipment_3_short: "A 21"
 FIN_CAS_equipment_3_desc: "Saab A-21 был первым боецом по имени J 21, но потому что он показал неадекватную результативность для своей роли истребителя. Несмотря на это, дизайнерское бюро Saab поняло, что его ячейка будет отличной платформой для нападающего. Его уникальная конфигурация нажима, его мощный двигатель и выбор загрузки делают его мощным CAS."

 FIN_fighter_equipment_0: "Глостер Кукко"
 FIN_fighter_equipment_0_short: "Кукко"
 FIN_fighter_equipment_0_desc: "Kukko — модифицированная модель Gloster Gamecock Mk II с новым немецким двигателем."
 FIN_fighter_equipment_1: "ВЛ Мирский"
 FIN_fighter_equipment_1_short: "Мирский"
 FIN_fighter_equipment_1_desc: "В 1930-х годах Финляндия поняла, что она быстро отстаёт как от своих союзников, так и от врагов в разработке истребителей, не имея полностью стального моноплана. &lt; &lt; Мирский &gt; &gt; был разработан государственным авиационным предприятием Финляндии на основе немецкого дизайна и с использованием канадского двигателя."
 FIN_fighter_equipment_2: "VL Humu"
 FIN_fighter_equipment_2_short: "Уму"
 FIN_fighter_equipment_2_desc: "В то время как истребитель Bruwster Buffalo был первоначально отклонен для обслуживания в США и перестроен, финский сразу же заинтересовался первоначальной моделью компании Bruster. До того, как какой-либо прототип был выпущен, Финляндия разместила заказ на несколько Buffalos. По прибытии в Финляндию самолеты были полностью модернизированы."
 FIN_fighter_equipment_3: "VL Pyörremirsky"
 FIN_fighter_equipment_3_short: "Пырремирский"
 FIN_fighter_equipment_3_desc: "Pyörremirsky был разработан на основе более поздних моделей Focke-Wulf Fw 190 с существенными изменениями, внесенными для улучшения подвижности, дальности и вооружений судна. Pyörremirsky - удивительно быстрый и маневренный боец."
 FIN_jet_fighter_equipment_1: "SAAB J 21R"
 FIN_jet_fighter_equipment_1_short: "J 21R"
 FIN_jet_fighter_equipment_2: "SAAB 29 Tunnan"
 FIN_small_plane_airframe_5: "SAAB 29 Tunnan"
 FIN_jet_fighter_equipment_2_short: "СААБ 29"
 FIN_small_plane_airframe_5_short: "СААБ 29"

 FIN_small_plane_naval_bomber_airframe_1: "Blackburn Pripon"
 FIN_small_plane_naval_bomber_airframe_1_short: "Рипон"
 FIN_small_plane_naval_bomber_airframe_2: "ВЛ Котка"
 FIN_small_plane_naval_bomber_airframe_2_short: "Котка"
 FIN_small_plane_naval_bomber_airframe_2_desc: "Поначалу Котка была задумана как дешевая альтернатива Рипону, Котка превзошла Рипон почти во всех отношениях."
 FIN_small_plane_naval_bomber_airframe_3: "Ханса-Бранденбург 115"
 FIN_small_plane_naval_bomber_airframe_3_short: "Hb 115"

 FIN_heavy_fighter_equipment_1: "VL Tähti"
 FIN_heavy_fighter_equipment_1_short: "Тяхти"
 FIN_heavy_fighter_equipment_1_desc: "В соответствии с канадским дизайном Beaufighter VL Tähti был значительно облегчен, а его вооружения и модернизированный двигатель были переоборудованы для выполнения новой роли. Хотя, в отличие от канадского Beaufighter, отделение бомбардировщика не было удалено. Вместо этого, Tähti имеет вращающуюся переднюю башню."
 FIN_heavy_fighter_equipment_2: "Петляков Пе-3"
 FIN_heavy_fighter_equipment_2_short: "Пе-3"
 FIN_heavy_fighter_equipment_2_desc: "В 1941 году известный дизайнер авиакомпаний Владимир Петляков и его эпохологическая аэрокосмическая фирма приступили к работе над вариантом для истребителя, ранее использовавшегося в качестве среднего бомбардировщика Pe-2. Как и многие российские проекты, несмотря на враждебность между Россией и Финляндией, правительство Финляндии заключило контракт с Петляковым на значительное количество новых самолетов."
 FIN_heavy_fighter_equipment_3: "VL Vihuri"
 FIN_heavy_fighter_equipment_3_short: "Вихури"
 FIN_heavy_fighter_equipment_3_desc: "В то время как некоторые обвиняют финский в копировании дизайна «Москито» Союза Великобритании, финский «Вихури» действительно является финским дизайном, взятым из немецких, русских, энтенте и синдикалистских моделей."

 FIN_tac_bomber_equipment_0: "Avro VL Anson"
 FIN_tac_bomber_equipment_0_short: "Энсон"
 FIN_tac_bomber_equipment_0_desc: "Avro Anson — средний бомбардировщик, созданный канадской авиакомпанией Avro 652."
 FIN_tac_bomber_equipment_1: "Бристоль-ВЛ Бленхайм"
 FIN_tac_bomber_equipment_1_short: "Бленхайм"
 FIN_tac_bomber_equipment_1_desc: "Бленхайм-средний бомбардировщик является первым бомбардировщиком из всех металлов Канады, который был принят Finning Air Force после удивительного успеха Anson, который впечатлил руководство страны канадскими самолетами."
 FIN_tac_bomber_equipment_2: "Тупелов SB 2M-103"
 FIN_tac_bomber_equipment_2_short: "SB 2M-103"
 FIN_tac_bomber_equipment_2_desc: "До разработки Tupelov SB российские фирмы отставали от своих западных коллег в современных средних бомберских дизайнах. Однако испытания и бедствия SB ввели в страну столь необходимые инновации. 103 из них содержат несколько усовершенствований по сравнению с более старыми моделями производства. Хотя принятый в Финляндии вариант не является, строго говоря, подлинным 103, финские SB были также модифицированы."
 FIN_tac_bomber_equipment_3: "Архангелский SBB-2"
 FIN_tac_bomber_equipment_3_short: "SBB-2"
 FIN_tac_bomber_equipment_3_desc: "В конце 1940 года Архангелский разработал новую SB-RK на основе последней модели Tupelov SB в качестве замены SB, адаптированной к ныряльщикам, а не к низкоскоростным атакам. SB-RK был позже переименован в SBB и с отклонением прототипа российскими военными, SBB был перестроен, а новое судно было названо SBB-2. SBB-2 было предложено нескольким иностранным правительствам, при этом финляндская сторона получила лицензию на производство самолета."
