l_russian:

 stability.21.t: "Проект ДОПУЩЕНИЯ"
 stability.21.desc.a: "Новый доклад Военного управления свидетельствует о значительном сокращении численности имеющихся кадров. Как представляется, последняя группа новобранцев значительно меньше, чем первоначально предполагалось. В настоящее время проводится расследование этого расхождения, но в первую очередь это указывает на то, что большое число людей, технически пригодных для работы, чтобы избежать этого проекта различными средствами. 18-летние студенты вдруг становятся квалифицированными работниками, занятыми в критической военной индустрии, бывшие спортсмены не проходят тесты, и в некоторых случаях новобранцы просто исчезают без следа. ~ Несмотря на то, что люди пойманы и допрашиваются, они указывают на плохие условия в армии, на безразличие к офицерам и на то, что они не хотят умирать за утраченное дело. Военные лидеры требуют жесткого подавления людей, избегающих этого проекта, но многие в правительстве считают, что улучшение условий жизни военнослужащих может быть лучшим подходом."
 stability.21.desc.b: "Неэффективный официальный ответ на широко распространенный отказ от этого проекта лишь усугубил проблему. Все больше и больше новобранцев никогда не появляются после получения их письма. Противоположная разведка перехватила специально составленную брошюру с рекомендациями людям о том, как избежать этого проекта, предлагая такие вещи, как подкуп врачей для подтверждения того, что вербовщик является недееспособным. Исключения для отцов семей привели к тому, что вдовам, которые воевали с детьми, оказавшимися в то время как число людей, обращающихся с просьбой об исключениях по этическим соображениям, достигло рекордного числа. nn-n-n Военные лидеры предложили исключить последние несколько исключений и привести примеры нескольких попавших в ловушку лиц, уклоняющихся от военной службы. Другие члены правительства предложили обратиться к чувству гражданской ответственности наших граждан и указать на последствия поражения в этой войне."
 stability.21.desc.c: "С учетом того, что ответы правительства на проект не дают никакого позитивного эффекта, все больше и больше людей начинают задаваться вопросом, почему они должны подвергать себя опасности, в то время как другие остаются в безопасности. Рекруты часто сообщают, что их притесняют или высмеивают на улицах, как дураков, борющихся за обреченное дело. Повсеместно поступают сообщения о том, что матери запрещают своим детям отвечать на проект приказа, и Военное управление представило доклад, в котором утверждается, что они уже не уверены в том, сколько людей они должны подготовить, поскольку их бюрократия начала разрушаться под давлением обработки всех пропавших без вести солдат."
 stability.21.a: "С этим ничего не поделаешь."
 stability.21.d: "Мы должны арестовать всех, кого найдут беглыми!"
 stability.21.e: "Возможно, в порядке повышения заработной платы военнослужащих."
 stability.21.f: "Настало время принять более жесткие меры."
 stability.21.g: "Возвращайтесь к чувству гражданского долга народа."
 stability.21.h: "Мы должны привести пример."
 stability.21.i: "Мы должны дать людям что-то, за что можно бороться."

 stability.22.t: "Удары!"
 stability.22.desc.a: "За последние несколько дней производство на нескольких фабриках резко замедлилось, поскольку рабочие объявили удар по всему производству в ходе войны."Peace and Bread!", they have so far refused all attempts to negotiate a settlement. Some in the government have advocated a sharp military response, followed by a swift execution of the ringleaders as enemy agents and traitors. However, others in the civil service have recommended a more measured approach, pointing out that a heavy-handed response may well backfire if the soldiers involved are not as loyal as we thought they were."
 stability.22.desc.b: "Как представляется, усилия правительства, направленные на то, чтобы убедить забастовщиков вернуться на работу, не дали никаких результатов. Напротив, сообщения о забастовках поступали на других заводах, и последние несколько забастовок на первоначально затронутых рабочих местах также сложили свои инструменты после того, как их коллеги столкнулись с гневом. Хотя запасы до сих пор были в состоянии несколько смягчить удар по поставкам на фронте, это лишь вопрос времени, прежде чем перебои в производстве начнут влиять на нашу способность осуществлять судебное преследование за войну."
 stability.22.desc.c: "То, что начиналось как промышленная деятельность в нескольких изолированных местах, теперь распространилось по всей стране, затрагивая даже отрасли, которые связаны только с военными усилиями в третичных областях. Даже работа самого правительства пострадала, поскольку многие клерки, посыльные и водители низкого уровня отказались приходить на работу в все большем количестве. Во многих местах рабочие советы захватили заводские здания. Сообщения секретной полиции указывают, что некоторые места, похоже, вновь начали производство оружия - для крупного восстания против того, что называется,"The War Regime".\n\nMilitary High Command believes that decisive action by loyal troops could still win the day, while the civilian side of the government argues that this risks a civil war and certain defeat."
 stability.22.a: "Всё закончится."
 stability.22.b: "Сделайте демонстрацию военной силы в городах."
 stability.22.c: "Сделать героев пропаганды из людей, которые все еще хотят работать."
 stability.22.d: "Подключить рабочих к военной службе и поставить фабрики под военный контроль."
 stability.22.e: "Предложить увеличить продовольственные пайки рабочих."
 stability.22.f: "Пошлите войска, арестуйте забастовщиков, казните зачинщиков."
 stability.22.g: "Предложить новое законодательство о социальном обеспечении."

 stability.23.t: "Мутации в армии"
 stability.23.desc.a: "В то время как ни одно из подразделений не покинуло своих позиций на линии, представители солдат совершенно ясно дали понять, что они не будут выполнять приказы о нападении на врага."
 stability.23.desc.b: "Усилия, направленные на борьбу с мятежами в армии, не принесли никаких результатов. Военная служба настоятельно рекомендует, чтобы мы направили повстанцам мощный сигнал с целью сдерживания любых дальнейших действий с их стороны."
 stability.23.desc.c: "Поскольку правительство явно не желает или не может решить свои проблемы, мятежники решили принять меры в своих собственных руках."Worker and Soldier Councils" have been announced, with the express goal of taking over the country and making peace with the enemy.\n\nUnless action is taken swiftly, these councils may very well end up replacing our government in some areas of the country and render us unable to continue the war."
 stability.23.a: "Сейчас мы ничего не можем с этим поделать."
 stability.23.b: "Окружить мятежные подразделения с преданными и приказать им отступить."
 stability.23.c: "Проведите патриотическую речь перед мятежниками."
 stability.23.d: "Объявите публично, что любой, кто будет поддерживать мятежников, будет обвинен в измене."
 stability.23.e: "Объявите о мирной инициативе, убедитесь, что она неприемлема для врага."
 stability.23.f: "Мобилизовать преданные ополчения и арестовать всех солдат, не находящихся в их местах службы."
 stability.23.g: "Предложить солдатам дать им возможность избрать своих офицеров."

 stability.31.t: "Военная катастрофа увенчалась успехом"
 stability.31.desc: "Наша оперативная реакция оказалась весьма эффективной: подразделения военной полиции, поддерживаемые местными правоохранительными органами и патриотическими добровольцами, разогнались в рамках хорошо скоординированной операции по посещению всех пропавших без вести лиц; большинство из них были готовы ответить на звонок, когда им сообщили о последствиях неявки на службу. Высшее военное командование публично заявило, что никому, кто явился в свое место службы, не будет предъявлено обвинение в совершении какого-либо преступления и не будет наказано за то, что он не сделал этого в прошлом; однако ряд людей категорически отказались взять оружие для своей страны и были арестованы."
 stability.31.a: "Решительные действия предотвратили еще худшее."

 stability.32.t: "Проекты беспорядков"
 stability.32.desc: "Наши попытки урегулировать ситуацию с помощью военной силы не увенчались успехом. Похоже, что кто-то из нашей администрации слил информацию о нашей запланированной операции общественности, которая быстро отреагировала. Когда военная полиция и другие правоохранительные органы попытались задержать известных допингов, они нашли свой путь, заблокированный разгневанными толпами, требуя прекращения войны и принудительного призыва на военную службу. В ряде случаев между полицией и протестующими вспыхнули уличные стычки, в результате которых погибло несколько человек, когда солдаты были вынуждены использовать свое оружие для своей защиты. Потребовалось несколько часов, пока полиция не обрела полный контроль над ситуацией."
 stability.32.a: "Ситуация не всегда развивалась в нашу пользу."

 stability.33.t: "Ребеллион на помолвку"
 stability.33.desc: "Наши попытки урегулировать ситуацию с помощью военной силы не увенчались успехом. Похоже, что кто-то из нашей администрации слил информацию о нашей запланированной операции общественности, которая быстро отреагировала. Когда военная полиция и другие правоохранительные органы попытались задержать известных донджеров, они нашли свой путь, заблокированный разгневанными толпами, требовавшими прекратить войну и заставить призыв на военную службу. В ряде случаев между полицией и протестующими вспыхнули уличные стычки, в результате которых погибло несколько человек, когда солдаты были вынуждены использовать свое оружие для самообороны."
 stability.33.a: "О, так теперь они хотят драться!"

 stability.34.t: "Проект реформы доказал свою эффективность"
 stability.34.desc: "Социальные меры, принимаемые правительством в рамках более широкого процесса реформирования политики призыва на военную службу, оказались на удивление популярными. Чаще всего называют более высокую заработную плату и более частые отпуска самыми крупными новыми льготами, но многие также указывают на новые правительственные программы поддержки вдов и сирот войны. Меньшее и меньшее число мужчин могут оправдать отказ своей страны в выборе цвета кожи, а государственная поддержка лиц, занимающихся допингом , полностью исчезла ."
 stability.34.a: "Мудрое решение."

 stability.35.t: "591. Пенитенциарный батальон"
 stability.35.desc: "С учетом серьезности сложившейся ситуации Высшее военное командование приняло решение о необходимости принятия более решительных мер, с тем чтобы показать, что уклонение от гражданской обязанности защищать свою страну не будет допущено. На рассвете военная полиция совершила налет на дома ряда тщательно отобранных, хорошо известных и связанных людей, которые использовали свое влияние для того, чтобы позволить другим избежать этого проекта. Все же в ночных рубанах они оказались завербованными на военную службу и сопровождались в казармы, находящиеся под вооруженной охраной, где они будут объединены в отдельное подразделение, с тем чтобы не допустить распространения их подрывного влияния на другие подразделения."friend" of theirs who had attempted to avoid the draft would turn themselves in."
 stability.35.a: "Они еще могут искупить свою вину."

 stability.36.t: "Местные элиты говорят протесты"
 stability.36.desc: "Учитывая всю серьезность ситуации, военное высшее командование приняло решение о необходимости принятия более решительных мер, с тем чтобы показать, что уклонение от гражданской обязанности защищать свою страну не будет допущено. На рассвете военная полиция совершила налет на дома ряда тщательно отобранных, хорошо известных и связанных людей, которые использовали свое влияние, чтобы позволить другим избежать этого проекта. Все еще в ночных рубанах они были призваны на военную службу. Их семьи мобилизовали свои широкие сети поддержки для протеста против этого решения. Военное управление было затоплено звонками и письмами от простых работников, которые хотят, чтобы их менеджер предприятия вернулся к своим заместителям в различные министерства, требуя знать, почему люди, работающие в областях, имеющих критически важное значение для военных усилий, были отстранены от своей работы."
 stability.36.a: "Разве у них нет чувства долга?"

 stability.37.t: ""A Sombre and Sacred Duty""
 stability.37.desc: ""Of course I want to live. I want to go and finish school, I want to meet girls, I want to start a family - but if we lose this war, I won't be able to do these things, either. So I fight."\n\nThe letter, sent anonymously to every major newspaper in the country, has made huge waves. Claiming to be from a soldier who at first tried to avoid the draft, but then realised that he must fight to save his country, it has apparently struck a nerve with many others who felt similarly. Draft boards across the country report that the number of people who still refuse to answer their summons has been more than made up for by new volunteers who will no longer wait until they are called, while others go and fight to save their country and their way of life."
 stability.37.a: "Мы не позволим, чтобы их жизнь была напрасной."

 stability.38.t: "Конец трусу"
 stability.38.desc: ""They led him to the wall at the break of dawn. He refused a last cigarette, but accepted the blindfold. His last words were an apology to his mother for causing her so much pain. The firing squad aimed well. A few minutes later, the doctor present declared him dead."\n\nWhile unable to catch all people who have been evading the draft, authorities have been able to make a number of arrests. Given the grave situation we are in, the War Office has decided that these men be tried under military law for failing to report to duty. The first series of death sentences has been handed down and the condemned have been executed by firing squad. These measures have evidently had the desired effect. It appears that most people decided to choose the possibility of death on the battlefield over the certainty of dishonourable death as a coward."
 stability.38.a: "Жаль, что до этого дошло."

 stability.39.t: "мученик за мир"
 stability.39.desc: ""They led him to the wall at the break of dawn. He refused a last cigarette, but accepted the blindfold. His last words were an apology to his mother for causing her so much pain. The firing squad aimed well. A few minutes later, the doctor present declared him dead."\n\nThe published report of the execution of a man sentenced to death for failing to report for duty seems to have had the opposite effect. Rather than bringing people back to the colours out of fear of the consequences, it has made those executed into instant martyrs for the peace movement. Their names and life stories have been published and very clearly edited to make them appear in the best possible light. Mass peace demonstrations have started in several major cities, demanding an end to the war. The War Office reports that they have received a number of letters of draftees stating openly that they will not appear for duty - saying that they would not, under any circumstances, be party to another execution except as the person to be executed."
 stability.39.a: "Всё не всегда улучшалось."

 stability.40.t: "Новый курс для [получить имя Дефа]"
 stability.40.desc: "Сегодня в радиопередаче [Root.Get Header] объявил, как он назвал \"Social Revolution\". Over the next hour, he laid out a system of reforms that touch every part of social life, promising every returning soldier an education, a well-paying job and a generous pension. He also announced a major building programme for affordable housing for young families, to begin the day an armistice is signed. This appears to have had a significant effect on general morale. Recruitment offices across the country report conscripts appearing and asking about options to extend their service beyond the current conflict, with others all but demanding a posting to frontline units to ensure extra benefits."
 stability.40.a: "И как мы заплатим за все это...?"

 strikes_event.1.t: "Восстановление порядка"
 strikes_event.1.desc: "Быстро продвигаясь вперед, военное высшее командование мобилизовало ряд учебных подразделений для службы и сформировало специальные группы солдат в отпуске. Разговоры между этими формированиями за воротами фабрик имели желаемый эффект, поскольку большинство забастовщиков не хотели навязать конфронтацию, чреватую потенциально смертоносными последствиями. Мало кто пытался убедить солдат сделать общее дело , оказалось, что их слова малоэффективны, поскольку солдаты спрашивали, почему работникам в уютной заднице следует позволить сбить с толку бойцов на фронте."
 strikes_event.1.a: "Действительно, почему."

 strikes_event.2.t: "Кровавый понедельник"
 strikes_event.2.desc: "Быстрое движение военного командования мобилизовало ряд учебных подразделений для службы и сформировало специальные группы солдат в отпуске. Переброс этих групп в пострадавшие города оказался гораздо более трудным, чем ожидалось, однако, поскольку нападавшие заблокировали железнодорожные линии и заставили войска пройти пешком, дав им достаточно времени для подготовки. Когда наши войска прибыли на забаррикадированные фабрики, они обнаружили, что забастовщики готовы для них. Попытки очистить дороги были встречены яростными нападениями рабочих, бросавших камни и бутылки в солдат."Murderers!" filling the air from bystanders. The mood in the capital turned dramatically in favour of the strikers. At nightfall, the soldiers retreated, leaving the barricades intact.\n\nThere have been no further attempts to force the situation. The strikers remain in control of the factories, and no work is being done."
 strikes_event.2.a: "Не так, как планировалось."

 strikes_event.3.t: "Герои на производственном фронте"
 strikes_event.3.desc: ""Industrial war is more than just divisions marching and planes bombing. It is more than just the duty of a soldier to fight and die for their country. An industrial war is won, first and foremost, in the factories and foundries. To abandon the battle on the assembly line is no better than abandoning it on the front line. And the victories of the assembly line should be celebrated just as much as the ones won by the front line."\n\nAll available propaganda resources have been rerouted to show the work of the armaments workers in the best possible light. [Root.GetLeader] has personally approved a new award to be given out for workers who have exceeded their quota by more than 100%, and the first recipients have been sent on tours around the country to instruct other workers in their methods.\n\nIt appears that this has made a lot of the strikers reconsider their stance. Work has resumed in all previously affected factories."
 strikes_event.3.a: "Герои один и все."

 strikes_event.4.t: "Департамент по производству оружия"
 strikes_event.4.desc: "[Root.Get Header] Сегодня объявили о некоторых небольших изменениях в проекте. Хотя ранее квалифицированные рабочие были освобождены от военной ответственности, это исключение было снято и все люди были отпущены немедленно. В то же время Военное управление было уполномочено взять под непосредственный контроль любую фабрику, производящую товары, имеющие отношение к военным усилиям, если руководство этих заводов продемонстрировало недостаток возможностей. /nn/. Объявление было встречено молчаливой отставкой в затронутых городах, особенно после того, как было объявлено, что к любому противнику будет относиться так же, как к военнослужащему, который отказывается выполнять приказы. В то время как моральный дух рабочих на фабриках находится на дне камня, производство возобновилось."
 strikes_event.4.a: "Надо было сделать это с самого начала."

 strikes_event.5.t: "Страна, которая бросает вызов"
 strikes_event.5.desc: "[Root.Get Header] Сегодня объявили о некоторых небольших изменениях в проекте. Хотя ранее квалифицированные рабочие были освобождены от военной работы, это исключение было снято и все люди были отпущены немедленно. В то же время Военное управление было уполномочено взять под непосредственный контроль любой фабрики, производящей товары, имеющие отношение к военным усилиям, если руководство этих заводов продемонстрировало недостаток возможностей. / n/ Это объявление встретило большой смех в затронутых городах, особенно после того, как было объявлено, что любой противник будет обращаться так же, как и солдат, который отказывается выполнять приказы. Полицейским, посланным для доставки проектов уведомлений работникам, было сказано, что они должны вернуться с большим количеством чернил на бумаге."
 strikes_event.5.a: "Возможно, мы должны."

 strikes_event.6.t: "Полезные еды"
 strikes_event.6.desc: "Не упоминая об этих забастовках, [Root.Get Header] объявил сегодня, что рабочие в отраслях, имеющих отношение к войне, получат дополнительные пайки сахара, кофе и мяса, чтобы сохранить свою силу. К сожалению, слухи о том, что правительство готово раздавать дополнительный шоколад, оказались ложными."Peace and Bread" were never going to happen and are happy with just the bread."
 strikes_event.6.a: "Им лучше зарабатывать на жизнь."

 strikes_event.7.t: "Операция Черный Оук"
 strikes_event.7.desc: "Солдаты, собравшиеся за городом за одну ночь, сохраняли шум и легкую дисциплину, чтобы сохранить элемент неожиданности. Солнце проникло через горизонт, а рабочие, занимавшиеся заграждениями на фабриках, ожидали, что дневная смена поможет им, а ударные колонны въехали в него. Устаревшие рабочие были вялыми, чтобы организовать сопротивление и быстро побеждать. Оставив небольшой отряд для охраны заключенных, войска прочесали город, арестовывая всех известных рабочих фабрик. К полудню военные взяли под полный контроль города и ввели комендантский час. Больше не ожидается никакого сопротивления. Большинство рабочих вскоре будет освобождено при условии, что они вернутся на работу, лидеры кольцев будут задержаны и преданы суду. Ожидается, что смертные приговоры будут вынесены."
 strikes_event.7.a: "Порядок восстановлен."

 strikes_event.8.t: "Битва на Ок-стрит"
 strikes_event.8.desc: "Солдаты, собравшиеся за городом за одну ночь, но плохое освещение и шумовая дисциплина дали сюрприз. Когда войска въехали туда, они обнаружили, что рабочие готовы к ним. Первое нападение сломалось в градах камней. Второе нападение с неподвижными штыками было отталкивающе в жестоких боевых действиях, оставив десятки погибших и умирающих на улицах. Но командующие офицеры отошли назад, чтобы объединить свои силы, в то время как рабочие расширяют свои крепости и вооружаются оружием, оставленным в отъезде. Ожидается, что завтра второй день боевых действий, однако командование не верит в вероятность победы."
 strikes_event.8.a: "У нас быстро заканчивается выбор."

 strikes_event.9.t: "Закон о защите прав трудящихся"
 strikes_event.9.desc: "В связи с высокой напряженностью в столице [Root.Get Header] объявил новый закон о защите прав трудящихся даже во время войны. Широкие законы предусматривают предоставление отпуска по болезни без ограничений, обязательное страхование от несчастных случаев для каждого работника, право вступать в любой профсоюз, а также, впервые, право работающих женщин на отпуск по беременности и родам после рождения ребенка. . Несмотря на то, что многие в правительстве считают это не менее чем полной капитуляцией забастовщикам, результаты являются убедительными: работа возобновилась на всех фабриках."
 strikes_event.9.a: "Надеюсь, этого будет достаточно."

 mutiny_event.1.t: "Повреждена мутация"
 mutiny_event.1.desc: "После нескольких часов напряженных переговоров на воротах казарм и вдоль линии фронта мятеж в нашей армии закончился. Перед лицом перспективы борьбы, которую они не смогли выиграть, мятежники быстро решили отступить."
 mutiny_event.1.a: "Будем надеяться, что это последнее."

 mutiny_event.2.t: "Пустая угроза"
 mutiny_event.2.desc: "Попытка напугать мятежников за то, что они покорились, резко откатилась назад, так как войска не проявляли большого страха перед подразделениями, направленными на подавление их. Используя навыки, накопленные на передовой линии, они быстро организовали защиту своих позиций, которая могла бы сделать любую попытку победить их очень дорогой."
 mutiny_event.2.a: "Никто не мог предсказать это."

 mutiny_event.3.t: ""What ARE we fighting for?""
 mutiny_event.3.desc: ""It's not uncommon for a soldier to doubt whether what he is doing is really worth it. Can anything justify the sacrifices we ask of you? Can we really demand you to potentially die in pursuit of a goal that you would never see?\n\nIt is an unfortunate fact that we must live in the times we were born in. Fate has decided that we must be at war, to protect our freedom, our homes, our [Root.GetAdjective] way of life! We did not choose this war, it was forced on us! You know that I would not ask anything of you that I would not be willing to do myself, and I know that you will do whatever is necessary to secure victory."\n\n[Root.GetLeader]'s speech in front of the troops appears to have had the desired effect, as the soldiers broke out in spontaneous cheers and returned to their duties without more than the usual amount of complaining."
 mutiny_event.3.a: "Хорошая речь."

 mutiny_event.4.t: "Закон об измене во время войны"
 mutiny_event.4.desc: "В то время как Военное управление делает все возможное, чтобы не допустить того, чтобы нынешний мятеж в армии стал широко известным, цензура писем может зайти так далеко. Солдаты, находящиеся в отпуске, быстро распространяют слово о том, что армия больше не готова истекать ненужным кровотечением в этой войне. ~ Не говоря конкретно о мятеже, [Root. Get Hewer] сегодня объявили, что правительство будет рассматривать любой акт, который отражал бы отсутствие приверженности войне, как измену. ~n ~ Наказание за измену хорошо известно, и общественная поддержка мятежников полностью испарилась. Новости об этом, конечно, были широко распространены. Видя мало поддержки со стороны населения, солдаты тихо возобновили свои обязанности."
 mutiny_event.4.a: "Мы не должны это объяснять."

 mutiny_event.5.t: "Попробуй попробовать "Физзлз""
 mutiny_event.5.desc: "В то время как Военное управление делает все возможное для того, чтобы не допустить того, чтобы нынешний мятеж в армии стал широко известным, цензура писем может зайти так далеко. Солдаты, находящиеся в отпуске, быстро распространяют слово о том, что армия больше не хочет истекать ненужным кровотечением в ходе этой войны. ~ Попытка правительства остановить прилив полностью провалилась. Сообщения из секретной полиции указывают на то, что мятежники пользуются сильной поддержкой среди широкой общественности, что делает маловероятным, что мы сможем изолировать и подавить их."
 mutiny_event.5.a: "Это неуважение к законам вызывает глубокую обеспокоенность."

 mutiny_event.6.t: "Предложение мира"
 mutiny_event.6.desc: "[Root.Get Header] объявил прессе сегодня, что его последнее мирное предложение провалилось. Хотя причины этого неудачного поворота событий очень сложны, [Root.Getaductive] требует, чтобы другая сторона оплатила весь причиненный ущерб, полностью разоружилась и публично признала, что они начали войну, возможно, была последней каплей. ~Нет, наши враги ответили в натуре, назвав наши разумные требования о безоговорочной капитуляции. Они обещали, что они будут преследовать эту войну до самого горького конца. ~Нет, наши враги явно не хотят видеть причину и обещают сражаться, попытки мятежников добиться мирного урегулирования рухнули."
 mutiny_event.6.a: "Ужасный позор."

 mutiny_event.7.t: "Военная катастрофа увенчалась успехом."
 mutiny_event.7.desc: "Несмотря на несколько случаев, когда небольшие группы мятежников решили побороться с ним, наша операция по подавлению восстания была потрясающим успехом."
 mutiny_event.7.a: "Молодец."

 mutiny_event.8.t: "Брат против брата"
 mutiny_event.8.desc: "Наши попытки воспрепятствовать выборам в Советы трудящихся и солдат привели к эскалации ситуации, которая не может быть даже пессимистической, а вместо того, чтобы сдаться, мятежники сформировали временные советы, избранных полевых командиров и установили защиту на улицах."
 mutiny_event.8.a: "Становится всё хуже."

 mutiny_event.9.t: "Новая порода офицеров"
 mutiny_event.9.desc: "Несмотря на решительные возражения со стороны вооруженных сил, все подразделения армии провели выборы для избрания своего командира, результаты которых были весьма неожиданными, поскольку большинство избранных являются опытными солдатами, обладающими богатым опытом работы на местах, хотя многие профессиональные офицеры по-прежнему считают это личным оскорблением, вряд ли можно сомневаться в том, что большинство солдат отдают предпочтение этой ситуации."
 mutiny_event.9.a: "Это не должно сработать, не так ли?"
