### Events ###
 treaty_territory_events.1.t: "Изъятие [договорного порта]"
 treaty_territory_events.1.d: "С началом войны наши силы немедленно перешли к власти над [договорным портом], и после короткой борьбы победил."
 treaty_territory_events.1.a: "Нация снова цела!"

 treaty_territory_events.2.t: "Перерасход средств по малым территориям"
 treaty_territory_events.2.d: "С началом войны наши небольшие территориальные владения были захвачены, соответствующие договоры были разорваны, и наш персонал был эвакуирован, с победой в этой войне, возможно, мы их восстановим."
 treaty_territory_events.2.a: "Скоро мы их вернём."

 treaty_territory_events.3.t: "Изъятие [договорного порта_witisit2]"
 treaty_territory_events.3.d: "Наши силы взяли под контроль концессию в [Treatyport_withit2] Судьба территории будет покончена с завершением войны."
 treaty_territory_events.3.a: "Маленькая победа."

 treaty_territory_events.4.t: "Изъятие [договорного порта_witisit2]"
 treaty_territory_events.4.d: "По крайней мере сейчас [Treatyport_thisit2] находится в руках врага."
 treaty_territory_events.4.a: "Скоро мы его вернём."

 treaty_territory_events.5.t: "Возвращение [договорного порта_whatisit2]"
 treaty_territory_events.5.d: "С возвращением [Treatyport_witisit2] территория была возвращена под иностранный контроль."
 treaty_territory_events.5.a: "Горький сладкий момент."

 treaty_territory_events.6.t: "Возвращение [договорного порта_whatisit2]"
 treaty_territory_events.6.d: "[Treatyport_thisit2] вернулся под наш контроль и снова работает."
 treaty_territory_events.6.a: "Ура!"

 treaty_territory_events.7.t: "Отзыв [договорного порта_witisit2]"
 treaty_territory_events.7.d: "[Treatyport_thisit2] был вновь захвачен. Однако с учетом нынешнего состояния войны с захватом территории, а не возвращения на территорию под иностранный контроль, территория была полностью восстановлена."
 treaty_territory_events.7.a: "Пусть мы выиграем эту великую войну."

 treaty_territory_events.8.t: "Отзыв [договорного порта_witisit2]"
 treaty_territory_events.8.d: "[FROM.GetName] объявила об аннулировании нашей аренды на [договорный порт_wayisit2]."
 treaty_territory_events.8.a: "Мы вернем его."

 treaty_territory_events.9.t: "Конец концессии [договорного порта_whatisit2]"
 treaty_territory_events.9.d: "С крахом [FROM.GetNameDef] вражеским силам, мы больше не готовы к концессиям, и наши силы уже переехали, чтобы захватить их."
 treaty_territory_events.9.a: "Маленькая победа."
