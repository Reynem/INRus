### Ideas ###
 holds_leases_idea: "Захват малых территорий"
 holds_leases_idea_desc: "В настоящее время мы либо сдаем в аренду, либо прямо владеем важными, но сокращающими территории во всем мире."
 holds_leases_idea_modifier_tooltip: "[гитмо_активный] [моле_активный] [самана_активный]"

 gitmo_lease_idea: "Аренда в Гуантанамо"
 gitmo_lease_idea_desc: "В настоящее время мы сдаем в аренду важную военно-морскую базу Гуантанамо-Бей §!. nn-nGuantanamo Bay была оккупирована Соединенными Штатами во время кубинской войны за независимость в рамках более крупной испано-американской войны. В последующие годы и десятилетия американский контроль над Гуантанамо-Бей под номинальным кубинским суверенитетом был подтвержден, а военно-морская база Гуантанамо-Бей была значительно расширена."
 mole_lease_idea: "Моль Сен-Николас"
 mole_lease_idea_desc: "В настоящее время мы сдаем в аренду прибрежному городу Моле Сен-Николас §!.. .. но только недавно маленький прибрежный город, Моле Сен-Николас медленно, но безусловно преобразуется в военно-морскую станцию, чтобы соперничать с близлежащим бухтой Гуантанамо."
 samana_lease_idea: "Самана Лиз"
 samana_lease_idea_desc: "В настоящее время мы сдаем в аренду прибрежный город Санта-Барбара-де-Самана §!.. .. . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . ."

