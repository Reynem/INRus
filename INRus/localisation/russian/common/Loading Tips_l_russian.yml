l_russian:
 LOADING_TIP_0: "Одним словом, мы не хотим никого помещать в тень, но мы также завоевываем свое место на солнце. - Министр иностранных дел Германии Бернхард фон Бюлоу, 1897 год."
 LOADING_TIP_1: "Несмотря на то, что у нас нет такого флота, как нам следовало бы, мы завоевали себе место на солнце."
 LOADING_TIP_2: "Моя программа "Почитай наше богатство" - это единственная защита этой страны от синдикализма."
 LOADING_TIP_3: "Социализм должен оставаться ужасающей и величественной вещью."
 LOADING_TIP_4: "Наша цель состоит в создании в нашей стране общества свободного и равного человека, где никто никогда не будет эксплуатировать другого человека."
 LOADING_TIP_5: "Вместе в Британии мы зажгли пламя, которое века не угаснут."
 LOADING_TIP_6: "Невозможность никогда ничего не предотвратила."
 LOADING_TIP_7: "Нынешняя революция в Куоминтанге не является ни вдохновляющей, ни направляющей, действительно национальной, но направлялась главным образом из Парижа."
 LOADING_TIP_8: "Мы уезжаем в степь, мы можем вернуться, только если есть Божья благодать, но нам нужно зажечь факел, так что есть хотя бы одна светлая точка среди темноты, которая охватила Россию... ни Михаил Алексеев, 1918 год."
 LOADING_TIP_9: "Без Империи мы должны быть брошены, как пробка, в перекрёсток мировой политики."
 LOADING_TIP_10: "В случае необходимости, но не обязательно призыв на военную службу Уильям Лайон Маккензи Кинг."
 LOADING_TIP_11: "Я смотрю на него как на величайшего преступника, известного за то, что он вверг мир в войну. Король Джордж V на своего кузена Кайзера Вильгельма II."
 LOADING_TIP_12: "После того, как я умру, мальчик разрушится через 12 месяцев. Приписан Джорджу V из Соединенного Королевства о его сыне Эдуарде, принце Уэльском."
 LOADING_TIP_13: "Вместе с Моисеем и пророками, с Христом и ранними христианами, мы заявляем, что не может быть праведности, где богатство частных лиц может быть использовано как средство эксплуатации."
 LOADING_TIP_14: "Ненависть не порождает любви, и из ненависти невозможно изменить мир."
 LOADING_TIP_15: "Старый мир умирает, и новый мир борется за выход - сейчас время монстров."
 LOADING_TIP_16: "Мы, социалисты, должны надеяться, что из этого ужаса кровопролития и ужасных разрушений произойдут далеко идущие социальные перемены и что это будет долгий шаг вперед к достижению нашей цели мира между мужчинами."Jack\" Reed"
 LOADING_TIP_17: "Соединенные Штаты должны быть нейтральными как в действительности, так и во имя... мы должны быть беспристрастными как в мыслях, так и в действиях."
 LOADING_TIP_18: "Меньше внимания к интернационализму и больше внимания к национальному процветанию."
 LOADING_TIP_19: "Правда в том, мистер Хёрст, что нам синдикалистам очень нравится эта страна."
 LOADING_TIP_20: "В глубине души и в своей повседневной деятельности профсоюзы являются революционными. Их неизменяемая политика заключается в том, чтобы удержать от эксплуататоров все, на что они способны. Таково истинное значение профсоюзного движения."
 LOADING_TIP_21: "Война должна быть прекращена не позднее лета или осени 1917 года, и если монархи не в состоянии заключить мир, тогда их народ сделает это для них над головой. - Оттокар Чернин и Кайзер Карл I, в телеграмме Кайзеру Вильгельму II."
 LOADING_TIP_22: "Люди всегда были глупыми жертвами обмана и самообмана в политике, и они всегда будут ими, пока они не научятся искать интересы какого-либо класса или других за всеми фразами, заявлениями и обещаниями."
 LOADING_TIP_23: "Во время революции мы не можем позволить свободу врагам народа и революции."
 LOADING_TIP_24: "В идеале ненасильственным государством будет упорядоченная анархия."
 LOADING_TIP_25: "Я считаю капитализм самой печальной, кровопролитной и злой системой, которую когда-либо видело человечество."
 LOADING_TIP_26: "Взглянув на мир в целом, на протяжении многих десятилетий происходит не анархия, а возрождение рабства."
 LOADING_TIP_27: "Сообщество является демократическим только тогда, когда самый скромный и слабый человек может пользоваться самыми высокими гражданскими, экономическими и социальными правами, которыми обладает самый большой и могущественный человек."
 LOADING_TIP_28: "История имеет давнюю перспективу. Она в конечном счете выносит суровые суждения по тиранам и оправдывает тех, кто боролся, страдал, был заключен в тюрьму и умер за свободу человека, против политического угнетения и экономического рабства."
 LOADING_TIP_29: "Солдат, который в политическом плане осознает, что он прав и у которого есть чувство общности со своим обществом... хорошо справится со своей работой."
 LOADING_TIP_30: "Иногда труднее сражаться со своим начальством, чем с французами."
 LOADING_TIP_31: "Ни один ублюдок никогда не выигрывал войну, умирая за свою страну."
 LOADING_TIP_32: "Всё законно."situational law.\" The sovereign produces and guarantees the situation in its totality. He has the monopoly over this last decision.\n- Carl Schmitt"
 LOADING_TIP_33: "Это было героическое безумие, но вся жизнь российского революционера того времени часто сводилась к цепи такого героического безумия."
 LOADING_TIP_34: "Наша угроза исходит от коварных сил, которые уже так сильно изменили характер наших свободных институтов — институтов, которые мы с гордостью назвали американским образом жизни."
 LOADING_TIP_35: "Если Франция умрёт, то это Республика прикончит её."
 LOADING_TIP_36: "Да, именно Европа, от Атлантики до Уралов, Европа, вся Европа, будет решать судьбу мира."
 LOADING_TIP_37: "Группировка Чжун Вей Чэнь, императоры должны возглавляться народом, поэтому я, военный начальник, должен возглавляться моими подчиненными."
 LOADING_TIP_38: "Если у вас нет боеприпасов, у вас все еще есть штыки."
 LOADING_TIP_39: "В условиях начавшейся гражданской войны все человечество и мягкое сердце должны быть отвергнуты. - Барон Роман фон Унгерн-Стернберг, при первой казни, которую он приказал."
 LOADING_TIP_40: "Похоже, мы выбираем президентов при отборе присяжных на том основании, что у них нет мнений, которые можно было бы обнаружить."
 LOADING_TIP_41: "Свобода означает свободу для Группы, а не свободу для личности. Мужчины не должны быть рабами других мужчин, а должны быть рабами своей группы."
 LOADING_TIP_42: "Когда белый человек становится тираном, он уничтожает свою собственную свободу, он становится... позирующим манекеном, мелкой фигурой сахиб... он носит маску, и его лицо растёт, чтобы соответствовать ей."
 LOADING_TIP_43: "Ле Пруссианизм - вуаля яннеми!"
 LOADING_TIP_44: "Учитывая обстоятельства, в которых находится страна, наиболее консервативным является революционный фактор."
 LOADING_TIP_45: "Не смей позволять им посадить меня в Вестминстерское аббатство."
 LOADING_TIP_46: "Политика - это игра джентльмена."
 LOADING_TIP_47: "Встаньте, братья, против всего правительства, разрушайте власть буржуазии!"
 LOADING_TIP_48: "Имена и личности не имеют значения, когда на карту поставлена конечная судьба Германии."
 LOADING_TIP_49: "Тот, кто посмотрит на Америку, увидит, что корабль питается глупостью, коррупцией или предубеждением."
 LOADING_TIP_50: "Я империалист, потому что я не буду колониальным."
 LOADING_TIP_51: "Оптимизм - это трусость."
 LOADING_TIP_52: "В истинном братстве, в зависимости от любви, Общество удовлетворяет свои самые высокие потребности."
 LOADING_TIP_53: "И это война в кратчайших словах: класс мастера всегда объявлял войны, и предмет всегда сражался в битвах."
 LOADING_TIP_54: "Когда нация может действовать свободно, тогда Китай можно назвать сильным, чтобы освободить страну, мы должны пожертвовать своей свободой."
 LOADING_TIP_55: "В битве между людьми победителем является тот, у кого есть еще один раунд в своем журнале."
 LOADING_TIP_56: "Бесчисленные люди, от махарая до миллионеров, от пукха сахибс до красивых дам, будут ненавидеть Интернационал, будут расстроены от разочарования их амбиций и умрут протестуя против этого."
 LOADING_TIP_57: "Никто, кроме мёртвых, не знает, стоит ли за все эти разговоры умирать, а мертвые не могут говорить."
 LOADING_TIP_58: "Виг - это человек, который готов пойти на кол за свои убеждения, но который не отправит туда своих противников."
 LOADING_TIP_59: "Мы понимаем, как мы никогда раньше не понимали, что наша Империя - это мистическое целое, которое не может разлучить врага, и теперь наш мудрый разум отдан задаче разработки механизма союза, соответствующего этому духовному единству."
 LOADING_TIP_60: "С тех пор король никогда не вмешивался в обычную политику, и Джорджу V было рекомендовано держать палец подальше от пирога сейчас."
 LOADING_TIP_61: "Республика неизбежна, и вы должны принять ее. Вы должны поддержать существование во Франции непобедимой демократии, которая, безусловно, будет иметь последнее слово."
 LOADING_TIP_62: "Мы, русские, страдаем от болезни воли."
 LOADING_TIP_63: "Разве я сказал?"republic?\" By God, yes, I said \"republic!\" Long live the glorious republic of the United States of America. Damn democracy. It is a fraudulent term used by ignorant persons and intellectual fakers.\n- Westbrook Pegler"
 LOADING_TIP_64: "Гегель где-то отмечает, что все великие мировые исторические факты и персонажи появляются, так сказать, дважды. Он забыл добавить: первый раз как трагедия, второй раз как фарс."
 LOADING_TIP_65: "Наша следующая война будет вестись во имя высших интересов нашей страны и человечества."World power or downfall\" will be our rallying cry.\n- Friedrich von Bernhardi, Germany and the next War"
 LOADING_TIP_66: "Цель пропагандиста состоит в том, чтобы заставить одну группу людей забыть, что некоторые другие люди - люди."
 LOADING_TIP_67: "Ленина отправили в Россию немцы так же, как вы могли бы послать фиал, содержащий культуру тифа или холеры, чтобы его влили в воду великого города, и он работал с удивительной точностью."
 LOADING_TIP_68: "Немецкий - это дисциплина страха; наш - дисциплина веры, и вера восторжествует!"
 LOADING_TIP_69: "Родится полевый маршал, а не Эрик Людендорф!"
 LOADING_TIP_70: "Ни один план операций не распространяется с какой-либо степенью уверенности, помимо первого контакта с основными враждебными силами."
 LOADING_TIP_71: "Я заявляю от имени Канады, что в будущем Канада будет вправе действовать или нет, вмешиваться или нет, делать то, что ей угодно, и что она оставляет за собой право судить, есть ли у нее основания действовать."
 LOADING_TIP_72: "Мне было бы стыдно сдать Цингтао японцам, а не Берлину русским."
 LOADING_TIP_73: "Когда я в отчаянии, я помню, что на протяжении всей истории пути истины и любви всегда побеждали. Там были тираны и убийцы, и на какое-то время они могут казаться непобедимыми, но в конце концов они всегда падают. Думай об этом, всегда."
 LOADING_TIP_74: "Мы верим в конституционные действия в нормальные времена; мы верим в революционные действия в исключительные времена."
 LOADING_TIP_75: "Все, что мы делаем, каждое действие должно соответствовать высшим идеалам революции."
 LOADING_TIP_76: "Мы, немцы, правильно говоря, не понимаем политических тенденций. Мы более или менее образованы в бизнесе, в науке, в мыслях, но в политике мы примерно на том же уровне, что и Восточная Славоника."
 LOADING_TIP_77: "Это не эра мечтаний и мечтаний; это эра железа, в которой железный дух и железная воля нужны людям, чтобы прорвать свой путь к победе."
 LOADING_TIP_78: "Мы находимся на грани событий, подобных которым мир не видел веками. Скоро все, что представляет собой наша жизнь, окажется в мире бесполезным. Период варварства вот-вот начнётся, и он продлится десятилетиями."
 LOADING_TIP_79: "Однажды Великая Русская Республика станет намного сильнее, богаче и свободнее, чем старая Царистская империя."
 LOADING_TIP_80: "Есть одна уверенность в будущем народа ресурсов, интеллекта и характера народа Соединенных Штатов, то есть процветания."
 LOADING_TIP_81: "Я предпочитаю правительство, управляемое как ад филиппинцами, правительству, управляемому как небо американцами."
 LOADING_TIP_82: "Оттоманская империя - самое сильное государство, потому что вы пытаетесь вызвать ее крах снаружи, а мы изнутри, но все равно она не рухнет."
 LOADING_TIP_83: "Что вы можете ожидать от нас, детей рабов, воспитанных евнухами? Султан Абдулхамид II из Османской империи, британскому другу."
 LOADING_TIP_84: "Слово командования сделало этих тихих фигур наших врагов; слово управления может превратить их в наших друзей."
 LOADING_TIP_85: "У нас есть европейский символ, который принадлежит всем нациям Европы в равной степени; это корона Святой Римской империи, воплощающая традицию Чарлмагне."
 LOADING_TIP_86: "Когда нам нужен самолет, мы получаем самолет, когда нам нужен артиллерийский кусок, мы получаем артиллерийский кусок, что бы мы ни просили, мы получаем из Японии."
 LOADING_TIP_87: "Но Родина поднимется с нашей кровью, она поднимется с глубины народа."
 LOADING_TIP_88: "Нет никакой морали, есть только красота."
 LOADING_TIP_89: "Под солнцем нет ничего, что не может сделать Сиамская полиция."
 LOADING_TIP_90: "Дайте мне японское подразделение, вооружённое бамбуковыми копьями, и я уничтожу всю русскую дальневосточную армию."
 LOADING_TIP_91: "Недавняя история как Европы, так и Азии, несомненно, показывает бесполезность попытки превратить тигра в котенка, давая ему блюдо с кремом."
 LOADING_TIP_92: "Мы должны следовать трем принципам доктора Сунь."
 LOADING_TIP_93: "Наука и верховенство права, конечно, полезны для нашего государственного строительства, но если мы сможем тем временем сохранить нравственные качества Конфуциана, китайское государство будет в мире беспрецедентным."
 LOADING_TIP_94: "Жизнь исходит из смерти, а из могил патриотов - мужчин и женщин - из живых народов."
 LOADING_TIP_95: "Вся история - это стремление человека реализовать идеалы."
 LOADING_TIP_96: "Мы маленькая нация, наша военная сила... никогда не может быть значительной, наша сила как нация будет зависеть от нашей экономической свободы, от нашей моральной и интеллектуальной силы, в которых мы можем стать светящимся светом в мире."
 LOADING_TIP_97: "Я был с вами в славные дни; я и останусь с вами во мраке; будьте со мной; борьба остается прежней; она касается Франции, ее земли, ее сыновей."
 LOADING_TIP_98: "Что ты предпочитаешь, тот, кто хочет взять твой хлеб во имя свободы, или тот, кто хочет взять твою свободу, чтобы гарантировать твой хлеб?"
 LOADING_TIP_99: "История демократии предлагает нам замечательную комбинацию утопий и мифов."
 LOADING_TIP_100: "Вы должны ожидать всего в политике, где все разрешено, кроме того, чтобы быть удивленным."
 LOADING_TIP_101: "Мы хотим прославлять войну - единственное лекарство для мира - милитаризм, патриотизм, разрушительный жест анархистов, красивые идеи, которые убивают, и презрение к женщине."
 LOADING_TIP_102: "Для моих друзей, для моих врагов, для закона."
 LOADING_TIP_103: "Ни земля без людей, ни земля без земли."
 LOADING_TIP_104: "Один из них побеждается только в том случае, если он признает свое собственное поражение."
 LOADING_TIP_105: "У меня нет врага, к которому я не могу приблизиться, и нет друга, которого я не могу оставить в стороне."
 LOADING_TIP_106: "Если причиной переворота была отмена, я не сожалею об этом; я считаю, что стоит потерять трон для принцессы Бразилии Императорской Изабель."
 LOADING_TIP_107: "Мы все молили о хлебе и воде, мы больше не были счастливыми и сильными мальчиками, которые покинули Оруро, мы были не более чем бледными тенями людей, все что мы хотели, это вернуться домой."
 LOADING_TIP_108: "Если есть иностранцы, которые злоупотребляют социальным снисходительным отношением, возмущают родину, то есть патриоты-рыцари, способные принести свою жизнь в жертву против варварства, чтобы спасти цивилизацию."
 LOADING_TIP_109: "Мы - нация, которая не знает ни капитуляции, ни победы, ни смерти."
 LOADING_TIP_110: "Демократия, республики: Что означают эти слова? Что они изменили в мире? Становятся ли люди лучше, более верными, добрее? Люди счастливы? Все происходит, как всегда. Иллюзии, иллюзии."
 LOADING_TIP_111: "Снаружи и внутри, по своему телу и духу Персия должна стать европейцем."
 LOADING_TIP_112: "Австралазский лоялист, который ставит Австралазию на первое место в своих мыслях, может оказаться неверным более широкому образованию, в котором Австралазия, как предполагается, занимает место второстепенного значения."
 LOADING_TIP_113: "Всегда возвращай лошадь по имени Эгоистичная, сынок, она будет единственной, кто попытается."
 LOADING_TIP_114: "Я не политик, я ненавижу их больше всего."
 LOADING_TIP_115: "Конец надежды - это начало смерти."
 LOADING_TIP_116: "Уже не время обсуждать, а действовать, а действия, реальные действия, которые дают результаты, требуют единой воли."
 LOADING_TIP_117: "Это слишком серьёзно, чтобы доверить это военным."
 LOADING_TIP_118: "Я перенаселил свою преданность на полях поражения, потому что Бог, с его свинецом кулаком, поразил Францию."
 LOADING_TIP_119: "Чтобы любить Францию сегодня, необходимо ненавидеть то, чем она стала."
 LOADING_TIP_120: "Я знаю, что многие наши соседи минимизировали идею федерации."
 LOADING_TIP_121: "Неважно, откуда вы начали, но где, благодаря вашим достоинствам и труду, вы прибыли."
 LOADING_TIP_122: "Ни одна жертва не слишком велика для людей и для правды."
 LOADING_TIP_123: "Виды популистов и синдикалистов были отмечены первым появлением человека, который «не заботился ни о причинах, ни даже о том, чтобы быть правым». Это было новизной: право не быть правым, не быть разумным."
 LOADING_TIP_124: "Государства, которые не хотят защищать свои собственные интересы, осуждают себя до смерти."
 LOADING_TIP_125: "Он говорил мне, что страдал каждый раз, когда подписывал смертный приговор, я верю, что это было правдой, что в его природе была сильная сентиментальность, но он был фанатиком, когда речь шла о столкновении с капитализмом."
 LOADING_TIP_126: "Почему четыре великие державы должны сражаться за Сербию, никто не может понять."
 LOADING_TIP_127: "Сегодня, когда наши славянские братья находятся под угрозой, я не серб и не болгар - я югославский!"
 LOADING_TIP_128: "Ты боишься жизни, Маленький Человек, смертельно боишься, ты убьёшь его в надежде сделать это ради социализма или национальной чести, или славы божьей."
 LOADING_TIP_129: "Старая ложь: Dulce et decorum est n Pro patria mori.n-Wilfred Owen"
 LOADING_TIP_130: "Человек формирует свою душу по климату времени, в котором он живет."
 LOADING_TIP_131: "Быть побежденным и не подчиниться - это победа; победа и покой на лаврах - это поражение."
 LOADING_TIP_132: "Старый мир умирает. Триумфальный социализм входит в аудиенцию истории."
 LOADING_TIP_133: "Национализм - это мысль, которая постоянно создается, постоянно растет, постоянно поглощает новые элементы, постоянно очищается от концепций прошлого дня."
 LOADING_TIP_134: "Людям плевать, что случится с их правительством, потому что их правительство никогда не заботилось о том, что с ними случилось."
 LOADING_TIP_135: "Если ты только исправишь свою решимость спасти страну и народ, любой из вас может стать президентом или премьер-министром."
 LOADING_TIP_136: "Социально-революционер без бомбы не является социально-революционером."
 LOADING_TIP_137: "В любое время и во всех местах смерть консерватизма означает смерть нации."
 LOADING_TIP_138: "Мы выходим из сырой земли, из почвы, из глубин нашей нации, и мы снова возвращаемся к ней, и мы снова встаем."
 LOADING_TIP_139: "Наша жизнь видит сумерки богов, которым молился девятнадцатый век. катастрофа 1914 года не напрасна."
 LOADING_TIP_140: "Именно правительство и народ зависят друг от друга на всю жизнь; правительство предано народу, и доверие народа к правительству — это его деятельность."
 LOADING_TIP_141: "Китайская национальная революция должна осуществить социальную революцию, использовать власть партии, уничтожить капитализм и построить страну существования народа."
 LOADING_TIP_142: "Позор в истории, пятно на суверенитете Китая, обиду и несправедливость китайского народа должны быть смыты."
 LOADING_TIP_143: "История доказывает, что привнести чувства в политику - дорогая роскошь."
 LOADING_TIP_144: "Наступает новая эра: если все будет успешно, немцы будут господствовать на планете, если нет, то мы обречены на вечность!"
 LOADING_TIP_145: "1866 была дуэли между двумя джентльменами, в 1870-71 году мы были вынуждены наказать наглого араба, но сегодня мы должны сбить негодяя."
 LOADING_TIP_146: "Если наследный принц станет императором, я стану первым республиканцем!"
 LOADING_TIP_147: "Как быстро социал-демократ в возрасте! Когда ему 30, ему уже 40, когда ему уже 50, он становится ревизионистом."
 LOADING_TIP_148: "Союз Британии является многопартийным государством, но с типичной английской скупостью у них есть только один из них."
 LOADING_TIP_149: "Возьмёмся за нашу ссору с врагом: / Для вас от неудачных рук мы бросаем / n the falder; будьте ваши, чтобы держать его высоко. / Если вы разорвёте веру с нами, которые умрут, мы не будем спать, хотя бы и выращивали попки / на полях Фландерса. /- Джон МакКрей."
 LOADING_TIP_150: "Великий кажется замечательным только потому, что мы на коленях."
 LOADING_TIP_151: "Как бы мы ни были здесь, через три года мы станем Мастерами Ирландии. Мы не хотим партийной политики и политиков, мы хотим дисциплинированную и хорошо управляемую страну. Эта эволюция неизбежна."
 LOADING_TIP_152: "Лучше умереть на ногах, чем прожить всю жизнь на коленях."
 LOADING_TIP_153: "Те, кто стремится стать орлами, должны смотреть далеко и летать высоко; те, кто покидают себя, чтобы ползать как черви, откажутся от права протестовать, если их раздавят."
 LOADING_TIP_154: "Когда я думаю о международной организации и ее чистых, героических целях, моя душа загорается, как и в прежние времена."
 LOADING_TIP_155: "Мы, евразийцы, не боимся противоречий. Мы знаем, что жизнь из них сделана. Евразийцы живут в оппозиции."
 LOADING_TIP_156: "Утопианцы всех полос - синдикалисты, коммунисты, анархисты, солидаристы - обещают всем и всем: перед нами все было плохо - под нами все будет хорошо."
 LOADING_TIP_157: "Общество, состоящее из идиотов, никогда не будет процветающим обществом."
 LOADING_TIP_158: "Следующий период мировой истории, по-моему, чреват опасностями и бурями. Посмотрите на демона национальной ненависти, который борется с штыками по всей Европе."
 LOADING_TIP_159: "Прошлое русского народа темно, его настоящее ужасно, но у него есть право на будущее. Перед нами свет и дорога прямая."
 LOADING_TIP_160: "Не может быть поражений - могут быть только временные трудности."
 LOADING_TIP_161: "Но для чего нам, черт возьми, нужно сочувствие масс? Нам нужен силовой аппарат, и мы его получим. Нам плевать на сочувствие масс."
 LOADING_TIP_162: "Революционер - обреченный человек, у него нет личных интересов, никаких дел, никаких эмоций, никаких привязанностей и имени. Все в нем полностью поглощено единственной страстью к революции."
 LOADING_TIP_163: "В то время, когда происходят события огромной исторической значимости, меньше всего можно было бы заняться моральной характеристикой."
 LOADING_TIP_164: "Россия спасет себя."
 LOADING_TIP_165: "Вы думаете, что если завтра император Вильгельм и его лейтенанты станут хозяевами Европы, то наша свобода будет сохранена?"
 LOADING_TIP_166: "Исключительные люди нужны, люди, которые питают любовь к стране, пришло время, когда мы должны навязать свою волю и нашу истину другим силой."
 LOADING_TIP_167: "Солдат выкован в пламени битвы, но без сдержанности на него нанесут большой вред. Если победа станет обычной, а оружие станет его единственным средством, он найдет только руины в конце своих завоеваний."
 LOADING_TIP_168: "Военная мощь доверена другим, но ее трудно вернуть. Я перегруппирую свои войска и лично командую ими, позволив мне доминировать на юго-западе!"
 LOADING_TIP_169: "Разделение властей - это принцип демократии, а демократия - основа политики."
 LOADING_TIP_170: "Нужно работать... я знаю, что только восстановление королей спасет человечество, развращенное Западом, так же как земля не может существовать без неба, так что государства не могут жить без королей."
 LOADING_TIP_171: "Я не осуждаю революции, но я не люблю преждевременные революции, потому что они обычно расточительны и, следовательно, непродуктивны."Come what may, let us educate the people.\"\n- Hu Shih"
 LOADING_TIP_172: "Приближаться к иностранному реакционеру - это прыгнуть в рот волку - даже маленькие дети в Монголии знают это."
 LOADING_TIP_173: "Россия относится к нашей стране как к маленькому ребёнку."
 LOADING_TIP_174: "Человечество знает бродячий, кочевой образ жизни, оседлый, цивилизованный образ жизни и другие стадии развития. Прохождение через них подобно ходьбе по лестнице. Этот порядок не следует игнорировать."
 LOADING_TIP_175: "Лян Цичао страдает очень сильно, потому что он отказался от своих интеллектуальных устремлений, чтобы стать министром; я никогда не приму какую-либо официальную политическую позицию, как он."
 LOADING_TIP_176: "Если есть война, то есть вопрос жизни и смерти, зачем нам заниматься этим делом? Потому что мы погибнем, если у нас не будет решимости сделать это. Если у нас есть такая решимость, то мы, несомненно, будем жить."
 LOADING_TIP_177: "Мы защитим Мексико от Реакторов, но кто защитит Миксико от нас?"
 LOADING_TIP_178: "Социалисты другой страны являются соотечественниками-патриотиками, поскольку капиталист моей страны является естественным врагом."
 LOADING_TIP_179: "С сегодняшнего дня девизом нашего дела, сторожевым словом истинных патриотов, будут национальный суверенитет и конституция!"
