### Events ###
 generic_events.100.t: "Распорядок восстановлен в [Root. GetNameDef]"
 generic_events.100.d: "В то время как [Root.GetNameDef] все еще работает под контролем [Root.overlord.Get Adquesty], [Root.Get Adquestive] военные установили достаточный контроль над нашими собственными границами, что теперь можно использовать подобие большей автономии. Это не независимость - далеко от нее, но это означает, что мы больше не должны полагаться на [Root.overd.GetAdguctive] войска для обеспечения безопасности наших границ."
 generic_events.100.a: "Отлично."

 generic_events.101.t: "Приказ восстановлен в [от GetNameDef]"
 generic_events.101.d: "В то время как [от GetNameDef] все еще работает под контролем [от Goot.GetAdquctive], [от Get Adquitive] военные установили достаточный контроль над своими собственными границами, что сейчас возможно подобие автономии. Это не независимость - далеко от нее, - но это означает, что им больше не нужно полагаться на [от Goot.GetAdquctive] войска для обеспечения безопасности своих границ, и поэтому они не так сильно находятся под нашим контролем."
 generic_events.101.a: "Так тому и быть."

 generic_events.102.t: "Большую автономию?"
 generic_events.102.d: "[Круг. GetNameDefCap] остается под контролем правительства, но этот контроль, несомненно, начинает ослабевать по мере того, как наша сила подтвердит себя. Сила не легко сдерживать, и уже наши лидеры требуют большего контроля над нашими собственными делами. Конечно, наш повелитель не сможет долго сопротивляться нам."
 generic_events.102.a: "Да здравствует!"

 generic_events.103.t: "Большая автономия"
 generic_events.103.d: "[От. GetNameDefCap] остается под контролем правительства, но этот контроль начинает ослабевать, когда его сила подтверждает себя. [От GetNameDefcap] сила не является чем-то легким для сдерживания, и по всей стране ощущается стремление их лидеров к большему контролю над своими собственными делами."
 generic_events.103.a: "Нам нужно будет внимательно следить за этим."

 generic_events.106.t: "Борьба за независимость"
 generic_events.106.d: "[Владелец. Найти адаптивную] контроль над правительством [включает в себя] уже какое-то время. Мы слишком могущественны, чтобы сдержать его. Среди людей есть общие требования, чтобы освободиться, и скоро придет наше время."
 generic_events.106.a: "Да здравствует бесплатная жизнь!"
 generic_events.106.b: "Да, мы должны потребовать нашей независимости."
 generic_events.106.c: "Нет, лучше не щипать осиное гнездо."

 generic_events.107.t: "[От GetNameDefcap] требует независимости"
 generic_events.107.d: "Контроль над правительством [от него] слабеет уже некоторое время. Они слишком сильны для того, чтобы мы могли полностью сдержать. Среди народа [от него] есть общий призыв освободиться, и теперь его правительство официально выдвинуло требование о полной независимости."
 generic_events.107.a: "Отпусти их, пока мы все еще друзья."
 generic_events.107.b: "Они что, шутят?"

 generic_events.108.t: "Отказ от независимости"
 generic_events.108.d: "Правительство отклонило наше требование о независимости, хотя мы лишь номинально под их контролем."
 generic_events.108.a: "Это не закончится здесь."

 KR_fight_for_independence: "Объявить независимость"
 KR_fight_for_independence_desc: "Возможно, он отказался от нашего требования о независимости, но это не конец дела, мы будем свободны, даже если нам придется бороться за него!"

 generic_events.109.t: "[От GetNameDefcap] провозглашает независимость"
 generic_events.109.d: "Похоже, нашего отказа предоставить им независимость было недостаточно, они объявили себя свободными от контроля, в любом случае."
 generic_events.109.a: "Отпустите их!"
 generic_events.109.b: "Посмотрим!"

 generic_events.110.t: "Война за независимость"
 generic_events.110.d: "Похоже, наш бывший повелитель не может получить ясную опору в... но и мы не можем победить их. Возможно, пришло время призвать к перемирию и покончить с этим?"
 generic_events.110.a: "Да, давай покончим с этим."
 generic_events.110.b: "Нет, сейчас речь идет не только о независимости!"

 generic_events.111.t: "Война за независимость"
 generic_events.111.d: "Война с [от GetNameDef] продолжается уже некоторое время, и ни один из нас не может получить явного преимущества, и, возможно, настало время просто признать свою независимость и покончить с ней."
 generic_events.111.a: "Да, давай покончим с этим."
 generic_events.111.b: "Нет, мы закончим это!"

 generic_events.250.t: "Кукольник [помечено в стране. Получил имя Деф]?"
 generic_events.250.d: "Это превратит [помеченную страну. Найти Намедедефа] в тему [, чтобы_be_overlord. GetNameDef], используя по умолчанию занятое кукольное автономное состояние. Если они входят в другую фракцию, они оставят его, но это не положит конец ни одной из нынешних войн, в которых они находятся. Если вы хотите сделать это, вы должны сделать это отдельно."
 generic_events.250.a: "Сделай это."
 generic_events.250.b: "Сделай это, но пусть они сохранят свое нынешнее правительство."
 generic_events.250.c: "Если подумать..."

 generic_events.251.t: "Бесплатно?"
 generic_events.251.d: "Это сделает [маркированную] страну. Гетем Деф] полностью независимым. Это не изменит их нынешнее правительство (если только мод не довольствуется этим автоматически), не удалит [маркированную страну. Возьмите Наме Деф] из их фракции, если они в одной, и не выведет их из любой войны. ~n §ROTEOS: Это вполне может разрушить содержание Kaiserreich! Используйте на вашем собственном риске!!!!!!§!!"

 generic_events.252.t: "Присоединиться к [_be_faction_feder.GetFactionName]?"
 generic_events.252.d: "Это приведет к тому, что [помеченная страна. Найти Нам Деф] присоединится к [можно_be_faction_lider. GetFactionName], свергнет свою собственную фракцию, если она лидер фракции или просто покинет свою нынешнюю фракцию, если она в ней. Это не изменит никаких войн, в которых они в настоящее время. ~n §RONOTE: Это вполне может разрушить содержание Kaiserreich! Используйте на вашем собственном риске!!!!!§!!!"

 generic_events.253.t: "Ведите [помеченную страну. GetFactionName]?"
 generic_events.253.d: "Это сделает [помеченную страну. Найти Наме Деф] лидером фракции [помеченную страну. Гетфакшн Найм]. ~n §RNOTE: Это вполне может разрушить содержание Kaiserreich! Используйте на вашем собственном риске!!!!!!!!!!!!!!!!!"

 generic_events.254.t: "Покинуть [помеченную страну. GetFactionName]?"
 generic_events.254.d: "Это приведет к тому, что [помеченная страна. GetNameDef] покинет [помеченную страну. GetFactionName], ликвидируя фракцию, если она является лидером. Это не повлияет ни на какие войны, в которых они находятся сейчас."

 generic_events.255.t: "Мир с [миром_целью. Получить Наме-деф]?"
 generic_events.255.d: "[Знаменитая страна. Найти Нам ДефКап] вместе со всеми ее союзниками будет белый мир с [миром_целью. Найти Нам Деф] и со всеми их союзниками. ~n §RONOTE: Это вполне может разрушить содержание Kaiserreich! Используйте на вашем собственном риске!!!!!!!!!!!!!!!!"
 generic_events.255.b: "Отделить [маркирующую страну. Найме-деф] от своих союзников, затем помириться."

 generic_events.256.t: "Мир из всех войн?"
 generic_events.256.d: "[Знаменитая страна. GetNameDefCap] сделает отдельный белый мир для всех своих нынешних войн. Если он является предметом, то сначала он будет освобожден, и если он входит в состав фракции, то сначала он должен оставить его. ~n §ROTEMO: Это вполне может разрушить содержание Kaiserreich! Используйте на вашем собственном риске!!!!!!§!"

 generic_events.257.t: "Война с [войной_целью. Получил Наме Деф]?"
 generic_events.257.d: "[Знаменитая страна. GetNameDefCap] объявит войну [войне.get.GetNameDef]. Нет никаких проверок, чтобы убедиться, что это действительное заявление, кроме того, что две страны не являются союзниками и не находятся в состоянии войны."

### Unit Leader Events ###
 unit_leader.1.t: "Падение Айлл."
 unit_leader.1.d: "Похоже, что в служении народу оно зашло слишком далеко, и из-за плохой обстановки в операционной зоне оно заболело, и, вероятно, потребуется время, чтобы выздороветь, пока не поправится."
 unit_leader.1.a: "Неудачно."

 unit_leader.2.t: "Ранены."
 unit_leader.2.d: "Похоже, что, добившись успеха в сражении, оно подвергло себя слишком большому риску, в то время как оно вело людей. [От Гетхехе Капитана] было ранено, и, вероятно, потребуется некоторое время, чтобы полностью залечить раны, до тех пор, пока [от Гетранка] не будет выступать на обычном уровне."
 unit_leader.2.a: "Неудачно."

### Government in Exile Events ###
 mtg_exile_leader_added.1.t: "Лидер изгнания предлагает службу"
 mtg_exile_leader_added.1.desc: "После долгого и опасного путешествия через захваченную врагом территорию и несколько нейтральных государств в столицу наконец прибыл высокопоставленный офицер из одного из наших капитулятивных союзников."
 mtg_exile_leader_added.1.a: "Твоя битва еще не закончилась."

 mtg_exile_government.2.title: "Правительство в изгнании"
 mtg_exile_government.2.desc: "[От. Возвращайся к лидеру] официально запросил разрешение [от правительства] [от имени партии. Гетеадектив] на возвращение в [от имени партии] и воссоздание временного кабинета [от партии Гетрулинг] в рамках подготовки к послевоенному миру."
 mtg_exile_government.2.a: "Им пора вернуться на свою собственную территорию."
 mtg_exile_government.2.b: "Время еще не пришло."

 mtg_exile_government.3.title: "Просит об интеграции в военно-морском флоте."
 mtg_exile_government.3.desc: "Морское руководство представило нам план интеграции нашего флота в свой, они утверждают, что, разрешив [начинающим] военно-морским планировщикам осуществлять полный контроль над нашими кораблями, их эффективность будет резко повышена по сравнению с их нынешними независимыми действиями."
 mtg_exile_government.3.a: "Мы согласны."
 mtg_exile_government.3.b: "Мы не будем служить под ними."

 mtg_exile_government.4.title: "Принимает интеграцию в военно-морском флоте"
 mtg_exile_government.4.desc: "Правительство сообщило нам, что оно согласно с нашим предложением, и что теперь их корабли будут действовать под нашим командованием."
 mtg_exile_government.4.a: "Отлично."

 mtg_exile_government.5.title: "[От имени] отвергает интеграцию в военно-морском флоте"
 mtg_exile_government.5.desc: "Правительство сообщило нам, что их флот никогда не будет служить под командованием иностранной державы, они хотят помочь нам, но они сделают это независимо."
 mtg_exile_government.5.a: "Они ставят свою гордость выше интересов союза."

 mtg_generic.1.title: "Принудительное изменение правительства"
 mtg_generic.1.desc: "Ссылаясь на явное отсутствие поддержки в проведении выборов для нашего нынешнего правительства, [от GetNameDef] потребовали перемен в политике."
 mtg_generic.1.a: "У нас нет другого выбора, кроме как согласиться."

