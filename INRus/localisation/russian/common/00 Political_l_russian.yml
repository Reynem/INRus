### Decisions ###
 generic_raise_stability: "[Генерический] Воспроизводимость_стабильность_текст]"
 generic_raise_stability_desc: "[Генеральная хватка ] Стабильность . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . ."

 generic_raise_stability_socialist: "Улучшение условий труда"
 generic_raise_stability_socialist_desc: "Улучшение условий труда наших рабочих на фабриках приведет к сокращению производства в краткосрочной перспективе, но долгосрочные выгоды этого стоят."

 generic_raise_stability_liberal: "Законные свободы"
 generic_raise_stability_liberal_desc: "Возможно, самый простой способ улучшить стабильность в нашей стране — дать людям то, что они хотят. Это будет сопряжено с некоторыми неудобными компромиссами, но в идеале это меры, которые являются лишь временными и предназначены для того, чтобы успокоить их до тех пор, пока порядок не будет восстановлен должным образом."

 generic_raise_stability_conservative: "Срыв полиции"
 generic_raise_stability_conservative_desc: "Мы должны ослабить ограничения в отношении наших полицейских сил и предоставить им свободу делать свою работу, арестовывая худших преступников."

 generic_raise_stability_authoritarian: "Пошлите армию."
 generic_raise_stability_authoritarian_desc: "Не все будут рады этому, это правда, но иногда военное положение - единственная альтернатива."

 generic_raise_support: "[Генерический] Воспитатель_поддержка_текст]"
 generic_raise_support_desc: "[generic_reach_support_desc_text]"

 rally_public_support: "Общественная поддержка"
 rally_public_support_desc: "При наличии определенной политической власти и определенной промышленной поддержки мы мобилизуем наших сторонников на наше дело, хотя это потребует времени и ресурсов, в долгосрочной перспективе это улучшит наш политический статус."

 solidify_control: "Укрепить контроль"
 solidify_control_desc: "Некоторое тактичное использование политической власти здесь и некоторых ресурсов там и мы устраним наши политические препятствия; мы, возможно, не сможем избавиться от всех из них, но даже избавление от некоторых из них очистит наш путь и улучшит нашу политическую власть в долгосрочной перспективе."

 restructure_supply_system: "Реорганизация железнодорожной системы"
 restructure_supply_system_desc: "Перенаправляя строительные материалы и железнодорожные рабочие, мы можем быстро создать небольшое количество самодельных свалок вдоль некоторых из наших железных дорог. Однако это не является устойчивым. Это решение может быть принято только один раз. Премии исчезнут, если вы будете строить более трех дополнительных центров снабжения. §!"

