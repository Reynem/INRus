### Generic Faction Joining ###
 generic_events.10.t: "Альянс с [FROM. Возьмите NonIdeology NameDef]?"
 generic_events.10.d: "Нестабильность, возникшая после Чёрного понедельника и других политических событий во всем мире, усилила опасения во многих слабых странах о том, что великие державы, приближающиеся к ударам, поймают их посередине. Несмотря на то, что некоторые из них обращаются к изоляции либо из-за своих собственных внутренних беспорядков, либо в надежде на то, что нейтральность не позволит им охотиться на них, [FROM.GetNameDefCap] принял противоположный подход. С любыми внутренними проблемами, которые сейчас решаются, народ в [FROM.GetNameDefCap] теперь смотрит наружу, надеясь найти альянсы защиты. Мы, возможно, из-за высоких географических условий, военной силы или идеологической последовательности [ROOOT.GetFactionName], выбранный нами выбор союзников."
 generic_events.10.srd: "Интересное новое коммюнике пришло нам от [ITA.Get nonIdeology NameDef]: видя нашу нынешнюю общую войну против социализма и нашу общую цель улучшения родины, они решили предложить возвышение короля Амадео в качестве главы своего государства, эффективно схватив наши две страны. Хотя [ITA_GetNatPop Header] останется главой правительства, нашему премьер-министру было предложено стать старшим членом АНИ и значительное влияние на военную политику."
 generic_events.10.a: "Сильнее вместе!"
 generic_events.10.b: "Отличное предложение, передайте его [THIS.faction_leader. Возьмите NonIdeology NameDef]!"
 generic_events.10.c: "Вообще-то, нет..."

 generic_events.11.t: "[Фром. Возьмите NonIdeology NameDefCap] Приняли!"
 generic_events.11.d: "Услышав нашу просьбу о вступлении в союз, [FROM.GetNameDef] приняли наше заявление, и теперь мы готовы стать членом [FROM.GetFactionName]. Это, как мы надеемся, повысит нашу безопасность в эти тревожные времена, поскольку мы стремимся обеспечить защиту нашего народа от внешних сил и иностранного вмешательства. ~ ~ Это не означает, что это соглашение является бесплатным. Теперь мы возлагаем на нас определенные надежды на то, что мы будем содействовать общей защите государств [FROM.GetFactionName] и, вероятно, втянуться в конфликты, связанные с этим пактом. Это включает возможность втягивания в войны, инициированные участниками этого пакта. ~ ~ Мы вступаем сейчас в будущее вместе, наши судьбы теперь переплетены как словами, так и силой оружия. Если повезет, мы выиграем гораздо больше из этого соглашения, которое мы потеряли в автономии."
 generic_events.11.a: "Отлично!"

 generic_events.12.t: "[переговорщик. Возьмите NonIdeology NameDefCap] предлагает Альянс с [потенциалом."
 generic_events.12.d: "Срочное уведомление только что поступило из иностранного офиса: [переговорник. Переговорник. Наем Деф] попросил нас рассмотреть вопрос о том, чтобы включить [потенциально. Найти NonIdeology NameDef] в наш военный союз. Очевидно, [потенциально. Get nonIdeology NameDef] первоначально предложил идею [переговорщику. Get NonIdeology NameDef], который считал, что эта идея имеет достаточно оснований для передачи нам."
 generic_events.12.a: "Пусть присоединятся."
 generic_events.12.b: "Нам они не нужны."

 generic_events.13.t: "[Фром. Возьмите NonIdeology NameDefCap] Приняли!"
 generic_events.13.d: "Хорошие новости! После рассмотрения предложения [переговорщика. Возьмите NonIdeology NameDef], [FROM. Get NonIdeology NameDef] приняли нашу просьбу присоединиться к их альянсу. С такими друзьями мы, несомненно, будем спать гораздо безопаснее."
 generic_events.13.a: "Отлично."

 generic_events.14.t: "[Фром. Возьмите NonIdeology NameDefCap] Приняли!"
 generic_events.14.d: "Хорошие новости! После рассмотрения нашего предложения [FROM.Get nonIdeology NameDef] согласились разрешить [потенциально."
 generic_events.14.a: "Отлично."

 generic_events.15.t: "[Фром. Возьмите NonIdeology NameDefCap] Отклонился!"
 generic_events.15.d: "Несчастные новости: несмотря на [переговорник. Получите NonIdeology NameDef] спонсорство [FROM.Get NonIdeology NameDef] отклонило наше предложение присоединиться к их альянсу. Похоже, их цели не так совпадают, как раньше."
 generic_events.15.a: "Их потеря."

 generic_events.16.t: "[Фром. Возьмите NonIdeology NameDefCap] Отклонился!"
 generic_events.16.d: "Потрясающие новости: несмотря на наши споры от их имени, [FROM.Get NonIdeology NameDef] отказались разрешить [потенциально."
 generic_events.16.a: "Что?"

 generic_events.17.t: "[Фром. Возьмите NonIdeology NameDefCap] Отклонился!"
 generic_events.17.d: "Несмотря на наши убедительные призывы о том, что мы можем быть эффективным вкладчиком и членом их альянса, к нашему огорчению [FROM.GetNameDef] отказался от нашей просьбы присоединиться к [FROM.GetFactionName]. В некоторых отношениях можно ожидать, что альянсы часто бывают хрупкими и сопряжены с опасностями, и при их создании следует ожидать определенной осторожности. Тем не менее, этот отказ оставляет нас в тяжелом положении. Либо они не намерены защищать нас, либо более цинично видят в нас будущую цель на поле боя."
 generic_events.17.a: "Их потеря."

 generic_events.18.t: "Альянс с [FROM. Возьмите NonIdeology NameDef]?"
 generic_events.18.d: "Международные отношения часто изменяются, и соглашения и договоренности быстро меняются от поколения к поколению. Иногда даже в рамках одного поколения договоры подписываются и отклоняются по мере изменения интересов. Нестабильность, возникшая после Чёрного понедельника и других политических событий во всем мире, усилила опасения во многих более слабых странах, что великие державы, надвигающиеся к ударам, поймают их в середине. ~ ~ n ~ В стремлении к достижению общих интересов [FROM.GetFactionName] объединились во всеобъемлющий военный союз. Они стремятся к нашему членству, предлагая нам возможность дальнейшей защиты (будь то от внешних угроз или от самих себя) и в обмен на углубление военных и экономических связей мы станем частью более сильного и единого блока. ~ ~ no Joining, однако, не без риска. Мы, скорее всего, будем втянуты в любые конфликты, связанные с этим союзом, и возможно, что наш вклад перевешивает выгоды, которые мы получаем от членства."
 generic_events.18.a: "Сильнее вместе!"
 generic_events.18.b: "Вообще-то, нет..."

 generic_events.19.t: "[Фром. Возьмите NonIdeology NameDefCap] Приняли!"
 generic_events.19.d: "После некоторых обсуждений [FROM.GetNameDefCap] принял наше приглашение присоединиться к [ROOT.GetFactionName], как мы и надеялись. Новый член нашего союза в целом приветствуется, обеспечивая безопасность друг для друга и по крайней мере мир между его членами. Их вклад вооруженных сил, финансирование и дипломатический вес, как мы надеемся, будут способствовать взаимным интересам [ROOT.GetFactionName], но впереди нас ждут некоторые проблемы. ~Нет еще одного союзника в нашем пакте, это означает, что дополнительные ресурсы будут способствовать нашим объединенным силам, хотя любая дополнительная опасность, которую они создают для нашей фракции, представляет собой опасность, которая будет принята в расчет. Любые конкурирующие претензии должны быть приняты во внимание, и любые разногласия, которые они могут вызвать между членами фракций. ~Нет, нам нужно будет усердно работать для того, чтобы эти вопросы были решены и чтобы этот союз работал для всех (или, по крайней мере, для нас самих). Тем не менее, это не должно подрывать дипломатическую победу, которую мы сегодня победили для всех наших народов."
 generic_events.19.a: "Отлично!"

 generic_events.20.t: "[Фром. Возьмите NonIdeology NameDefCap] Отклонился!"
 generic_events.20.d: "После некоторых обсуждений, к нашему огорчению [FROM.GetNameDef] отклонили наше приглашение присоединиться к [ROOT.GetFactionName]. К сожалению, это не редкое событие, когда речь идет о создании альянса. Некоторые страны опасаются утраты дипломатической гибкости, на которую было бы принято официальное обязательство, в надежде избежать втягивания в проигрышный конфликт или желания вступить в более подходящий союз. Возможно также, что у них есть проекты, взаимоисключающие с нашими целями, хотя, надеюсь, не антагонистическим образом. ~ Неважно, что произойдет, [FROM.GetNamDef] не сделает или не разрушит наш союз. Или, по крайней мере, это должно произойти, если наша фракция будет иметь какой-либо вес. Мы пойдем дальше, чтобы достичь наши цели так или иначе, и если им повезет [FROM.GetNameDef], мы не будем слишком сильно сожалеть о своем плохом решении."
 generic_events.20.a: "Их потеря."

### Incoming War-ning ###
 generic_events.30.t: "Приготовьтесь к войне!"
 generic_events.30.d: "Мы получили многочисленные сообщения о том, что войска [от GetAdguctive] собираются в настоящее время и что через [Рут.GetAdigit] границу проводится большая разведка, и военные говорят, что это очевидно [от GetNameDef] планирует вторжение в [Root.GetNameDef], которое может начаться в любое время в течение следующих нескольких недель."
 generic_events.30.a: "Мы должны быть готовы!"
 generic_events.31.d: "Мы получили вызывающее тревогу сообщение [от Гет Наме Дефа] о том, что [от Гет Наме Дефа] в настоящее время собираются войска и что через границу [от Гет Наме Дефа] проходит большая разведка, и военные говорят, что очевидно [от Гет Наме Дефа] планируют вторжение [от Гет Наме Дефа], которое может начаться в любое время в течение следующих нескольких недель."
 generic_events.32.d: "Мы получили сообщение от наших союзников в [от GetNameDef] о том, что их войска в настоящее время собираются, и что большая разведка проходит через [наступление-нацеливание. Включай] границу. [От GetNameDefCap] планирует вторжение [нападение-нацеливание. GetNameDef], которое может начаться в любое время в течение следующих нескольких недель."

### Returning Cores ###
 return_cores_to_ally: "Возвращение [из адаптивных земель]"
 return_cores_to_ally_desc: "Правительство обсуждает, что делать с землями, которые мы в настоящее время занимаем, - землями, на которую у нас нет законных прав. Возвратим ли мы эту землю нашим союзникам?"
 return_cores_to_subject: "Возвращение [из адаптивных земель]"
 return_cores_to_subject_desc: "[Правительство] обсуждало, что делать с землями, которые мы в настоящее время оккупировали - землями, на которые у нас нет законных прав."

 generic_events.75.t: "Земельные угодья"
 generic_events.75.d: "Правительство [Root.GetAductive] обсуждает, что делать с землями, которые мы в настоящее время занимаем, - земля, на которую у нас нет законных прав."
 generic_events.75.a: "Да, возвращай им всю землю."
 KR_will_return_all: "Все прибрежные или прилежащие к ним государства, которые являются [возвратами к. Get Adquestive] ядрами или претензиями, будут возвращены в §Y [возвращение к. GetNameDef]§!. / no not §Rnot§!, включают в себя положения, которые являются [Root. Get Adquestive] § §! или §Ycore§!."
 generic_events.75.b: "Да, возвращайте им землю... но сохраняйте самые важные штаты."
 KR_will_return_rest: "Все прибрежные или прилежащие к ним государства, которые являются [возвратами к. Get Adquestive] ядрами или претензиями, будут возвращены в §Y [возвращение к. GetNameDef]§!. / no not §Rnot§!, включают в себя те положения, которые являются [Root. Get Adquestive] §Ywited §! или §Ycore§!, и не будут включать в себя §Yvital§!, такие как Каналы."
 generic_events.75.c: "Возвращение только их основных земель"
 KR_will_return_cores: "Все прибрежные или прилежащие к ним государства, которые являются [возвращенными к. Get Adquestive], будут возвращены в §Y [отправляйтесь в. GetNameDef]§!. / no not that with §Rnot§!, включая [Root. GetAdquestion] §! или §Ycore§!, или §Yvital§!, такие как каналы. Любые [отзывные к. GetAdegate] §Ystates будут сохранены."
 generic_events.75.e: "Мы оставим всё!"
 KR_will_not_return: "Мы вернем их земли, и нас не попросят сделать это снова."

 generic_events.76.t: "Возвращается земля"
 generic_events.76.d: "Наши союзники вернули нам кое-какие наши земли."
 generic_events.76.a: "Отлично!"

