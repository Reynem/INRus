l_russian:

### Tooltips ###
 GER_will_capitulate: "§ §Y [Gere. GetNameDefcap]§! будет капитулировать"

### Events ###
 capitulation_events.1.t: "Германия захвачена"
 capitulation_events.1.d: "Мы были избиты нашими несчастными врагами, и наши войска разваливаются по всей Европе, хотя они захватили Отечественную землю, война еще далека от конца!"
 capitulation_events.1.a: "Предположим контроль над Миттелафрикой - мы будем сражаться оттуда."
 capitulation_events.1.b: "Бежать некуда, сдавайся!"

 capitulation_events.2.t: "Милитаристы нажимают на прямой контроль"
 capitulation_events.2.d: "В результате краха немецких военных усилий в континентальной Европе Шутцтруппен мобилизовался и сейчас пытается захватить власть у ответственных бюрократов. Их руководство постановило, что [MAF.Geteleder] должен немедленно уйти с поста губернатора Миттелафрика и что административные обязанности должны быть переданы должностным лицам Шутцтруппена по их прибытии в [THIS. Capital. Get Capital Victory PointName]. Mittelafrika должен быть превращен в инструмент восстановления Германии, и наш колониальный проект должен быть приостановлен."
 capitulation_events.2.a: "Эти сумасшедшие думают, что мы все еще можем выиграть это?"
 capitulation_events.2.b: "Добро пожаловать в Шутцтруппе и сдаться их требованиям."

 capitulation_events.3.t: "Бюрократы побеждают в борьбе за власть в [MAF. Capital. Get CapitalVictory PointName]"
 capitulation_events.3.d: "Колониальные администраторы в Африке не видят причин для того, чтобы смириться с этим; война уже проиграна; они заявили, что будут слушать тех, кто отвечает за [THIS. Capital. Geteral Victory PointName] через две недели, не оставляя нам иного выбора, кроме как рухнуть перед нашими врагами!"
 capitulation_events.3.a: "Неблагодарные неблагодарные!"

 capitulation_events.4.t: "Патриоты в контроле над Миттелафрика"
 capitulation_events.4.d: "Генерал-губернаторы уступили место Милитаристам; Германия все еще будет возвращена!"
 capitulation_events.4.a: "Мы все еще вернёмся!"

 capitulation_events.5.t: "Война с [ЗИА."
 capitulation_events.5.d: "Похоже, нам нужно разобраться с продолжающейся войной на Дальнем Востоке, когда [ЗИА.Адаптивные] армии продолжают сражаться против наших колониальных сил в [ГЕА.Гееннамедеф], если мы продолжим войну, на которую мы почти наверняка не можем надеяться, что мы сможем оказать значительное воздействие с помощью наших рассеянных и избитых сил или попросим мира?"
 capitulation_events.5.a: "Дай им всё, что они захотят."
 capitulation_events.5.b: "Мы продолжим войну, если потребуется."

 capitulation_events.6.t: "Сьюзи за мир"
 capitulation_events.6.d: "Разрозненные силы Германии, которые сейчас сплотились под самодельным командованием из Африки, предложили нам большую часть территории, которую они занимают в [ГЕА.Гет Наме Деф], если мы не прекратим войну сейчас, прежде чем они будут втянуты в дело."
 capitulation_events.6.a: "Отличный план."
 capitulation_events.6.b: "Мы хотим этого."

 capitulation_events.7.t: "Война с [JAP. GetNameDef]"
 capitulation_events.7.d: "Похоже, нам нужно разобраться с продолжающейся войной на Дальнем Востоке, когда [JAP.Getaductive] армии продолжают сражаться против наших колониальных сил в [GEA.GetNameDef]."

 capitulation_events.8.t: "Сьюзи за мир"
 capitulation_events.8.d: "Разрозненные силы Германии, которые сейчас сплотились под самодельным командованием из Африки, предложили нам большую часть колониальной территории, которую они занимают в [GEA.GetNameDef], если мы покончим с войной только сейчас, прежде чем они будут втянуты в это дело. Учитывая, что отказ от сделки будет означать погоню за немцами в Африке, возможно, нам следует рассмотреть их план."
 capitulation_events.8.a: "Отличная идея."
 capitulation_events.8.b: "Мы заберем всё, что у них есть."

 capitulation_events.9.t: "Сьюзи за мир"
 capitulation_events.9.d.siam: "Так называемое &lt; &lt; Свободное немецкое правительство &gt; &gt; , борющееся за продолжение борьбы с Африкой, установило мир с [от.Гетнамедефа], что повлечет за собой отказ от значительной части нашей территории, и, похоже, мало надежд на продолжение этой борьбы в одиночку со столь многими должностными лицами Рейха, которые уже покинули свои офисы здесь, в [ГЕА.Гетнамдедефе]. Хотя местные силы привержены продолжению этой борьбы, без поддержки со стороны родины, для этих оппозиций, вероятно, неизбежно произойдет быстрое поражение."
 capitulation_events.9.d.japan: "Так называемое &lt; &lt; Свободное немецкое правительство &gt; &gt; , борющееся за продолжение борьбы с Африкой, установило мир с [от.Гетнамедефа], что повлечет за собой нашу полную аннексию, и похоже, мало надежды на продолжение этой борьбы в одиночку, когда многие чиновники Рейха уже покинули свои офисы здесь, в [ГЕА.Гетнамедефе]. Хотя местные силы привержены продолжению этой борьбы, без поддержки со стороны родины, для этих оппозиций, вероятно, неизбежно произойдет быстрое поражение."
 capitulation_events.9.a: "На спасательные шлюпки, мы уезжаем в Африку!"
 capitulation_events.9.b: "Мы будем сражаться до последнего!"

 capitulation_events.12.t: "Продолжим ли мы войну?"
 capitulation_events.12.d: "Немецкое правительство рухнуло, и его командование перешло в Африку, захватив здесь контроль над их бывшими колониями."
 capitulation_events.12.a: "Требуйте колоний."
 capitulation_events.12.b: "Мы уже достаточно воевали с немцами."

 capitulation_events.13.t: "Угроза [NFA."
 capitulation_events.13.d: "[NFA. GetNameDefCap] угрожали: либо мы сдадим колонии, которые когда-то принадлежали им, либо они продолжат войну против нас. Учитывая наше нынешнее состояние недовольства, было бы разумно принять их требования. Если нет, мы будем бороться с ними здесь, в Африке."
 capitulation_events.13.a: "Дай им то, что они хотят, если это закончится."
 capitulation_events.13.b: "Тогда мы столкнемся с ними здесь, в Африке."

 capitulation_events.15.t: "[Переведено в штате. Найти имя] Это наше"
 capitulation_events.15.d: "С падением немецкого правительства их контроль над [передаваемым государством.Гетнам] стал несостоятельным, и, таким образом, местная администрация сдалась нашим силам, чтобы избежать хаоса в этом районе."
 capitulation_events.15.a: "Потрясающе."

 capitulation_events.23.t: "Немецкая коллапса"
 capitulation_events.23.d.nowar: "В то время как последние пару дней после падения Германии в Европе были неопределенными, опасения, что [Root.GetNameDef] будут оставлены на произвол судьбы, являются необоснованными."
 capitulation_events.23.d.war: "Поскольку немцы рухнули в Европе и едва держались в Африке, продолжающаяся война здесь, в [Root.GetNameDef] привела к тому, что многие колониальные чиновники уже бежали в новую столицу Восточной Африки."
 capitulation_events.23.a: "Какое облегчение...?"
 capitulation_events.23.b: "Нас бросили?"

 capitulation_events.30.t: "Мир с Интернационалом?"
 capitulation_events.30.d.britain: "Несмотря на то, что британское правительство ранено, оно успешно противодействовало нашим попыткам пересечь Английский канал, и с защитой берегов, захватывающих столь необходимые ресурсы, многие в нашем правительстве выдвинули предложение о заключении мирного договора с остатками международного сообщества. Несмотря на то, что британское правительство было ранено, они успешно противостоят нашим попыткам пересечь Английский канал, а также с защитой берегов, которые забрали столь необходимые ресурсы, многие из наших членов пришли с предложением заключить мирный договор с Интернационалом. Мы сможем полностью контролировать свои континентальные европейские запасы, за счет признания правительства [ENG.GetNameDef]. С ростом антивоенных настроений как в пределах наших границ, так и в пределах Великобритании, многие считают, что это может положить конец этой бесполезной войне, по крайней мере временно."
 capitulation_events.30.d.other: "После этого многие в нашем правительстве ожидали, что Интернационал рухнет без лидера, но это было неправдой, так как [ИНТ.Гетнамедеф] взял на себя одеяло военного руководства и повредил оставшимся членам. Учитывая, как далеко эта нация от наших границ и линий поставок, многие в нашем правительстве считают, что это пустая трата ресурсов, чтобы вторгнуться в нее. nnThus, предложение об официальном мирном договоре пришло от этой фракции правительства. Наша позиция в отношении Европы будет укреплена, но существование Интернационала как препятствия для нашей мировой власти будет продолжаться. Поскольку многие в Империи устают от войны, возможно, в наших лучших интересах сделать это предложение мира."
 capitulation_events.30.a: "Пришло время для перемирия."
 capitulation_events.30.b: "Единственный мир, который мы примем, это безоговорочная капитуляция!"

 capitulation_events.31.t: "Германия предлагает мир"
 capitulation_events.31.d.britain: "В ходе войны наступили мрачные времена для нашего союза. Коммун Франции рухнул, и нам пришлось взять мантию в качестве главы революции, и немцы попытались вторгнуться в Великобританию, но безрезультатно из-за упорства нашего народа. Несмотря на то, что шрамы с обеих сторон начинают проявляться как на инфраструктуре, так и на нашем народе. Сегодня, когда [ФРОМ.Гетнамдеф] связался с нами, предлагая нам мир. В обмен на признание нашего правительства и сохранение существования Интернационала, мы потеряем всех наших союзников на материке Европы. ~ Немногие в нашем правительстве считают это оскорблением и настоятельно призывают продолжать борьбу за революцию, в то время как другие считают, что любая попытка восстановить нашу власть над Европой бесполезна, и мы должны принять этот мир, пока мы можем, даже ценой нашего унижения. Как мы будем реагировать?"
 capitulation_events.31.d.other: "Темные времена обрушились на Интернационал. Два главных лидера альянса, Великобритания и Франция, пали перед германским вторжением. Благодаря нашей собственной власти в рамках альянса мы взяли на себя мантию лидеров революции. Но с обеих сторон перспектива полной победы становится все более отдаленной с каждым днем. Наш народ устает от состояния войны, и это, похоже, пришло в голову сегодня, когда немецкая империя подошла к нам с предложением: в свою очередь, для нас, отказавшихся от наших европейских авуаров и установления мира с немцами, наше правительство будет признано, и Интернационал как образование будет продолжать работать под нашим руководством. ~ ~ ~ ~ Это укрепит нас как лидеров мировой революции и приведет к окончанию войны, такой мирный договор оставит нас униженными и проигравшими во второй Велткриг. Многие в нашем правительстве хотят, чтобы война закончилась, в то время как многие другие хотят продолжать бороться за революцию. ~ Как мы будем реагировать?"
 capitulation_events.31.a: "Эта война проиграна."
 capitulation_events.31.b: "Революция должна бороться!"

 capitulation_events.32.t: "Международная организация признает мир"
 capitulation_events.32.d.britain: "Война окончена. Хотя мы надеялись полностью ликвидировать революцию после поражения Франции, эти надежды не оправдались. Британия откликнулась на наше предложение, которое, казалось бы, страдает от того же ущерба, с которым мы сталкиваемся сейчас. Британия и третья международная организация выжили, многие по всей империи задаются вопросом, как долго этот мир продлится до тех пор, пока Европа вновь не вспыхнет всесторонняя война."
 capitulation_events.32.d.other: "Война окончена. С оккупацией европейских союзников Интернационала остальные члены согласились с тем, что это не может продолжаться дольше. Они приняли мир, и, хотя угроза в Европе устранена, многие удивляются, сколько времени займет, пока новый лидер Интернационала не сможет нанести ответный удар. Но пока мы выиграли этот день."
 capitulation_events.32.a: "Европа в мире!"

 capitulation_events.33.t: "Интернационал отказался от мира!"
 capitulation_events.33.d.britain: "Наше предложение о мире было встречено репрессиями со стороны Великобритании, говорящей, что наше правительство просто хочет снова унизить Великобританию этим миром, и условия неприемлемы."
 capitulation_events.33.d.other: "Наше предложение о мире не было хорошо воспринято [ИНТ.Гетем Деф], и они решительно «нет» ответили на нашу просьбу о мире. Похоже, упрямые революционеры хотят сражаться, и война закончится только безоговорочной капитуляцией одной из сторон. Мы должны подготовиться к вторжению..."
 capitulation_events.33.a: "Мы закончим то, что начали в 1919 году."

 capitulation_events.34.t: "Мир с [ИНТ. Найм-деф]?"
 capitulation_events.34.d: "[ГЕР.Гендер-Гейм-Дефкап] заключил мирный договор с [ИНТ.Генэм-Деф], так как ясно, что [ИНТ.Адаптация] утратили свою волю к продолжению войны. Это может быть и шансом для нас прекратить нашу войну с ними. Должны ли мы воспользоваться этой возможностью или продолжить битву?"
 capitulation_events.34.a: "Давайте покончим с этим сейчас же!"
 capitulation_events.34.b: "Нет, мы продолжаем войну!"

 capitulation_events.35.t: "Договор [INT. Capital."
 capitulation_events.35.d.britain: "Германия, несмотря на захват Парижа в третий раз за 70 лет, не смогла содействовать прибытию в Великобританию."
 capitulation_events.35.d.america: "Сегодня было сделано объявление [ГЕР.Гетеводитель] о том, что Велткриг на Западе закончился. Несмотря на то, что Германия заявила о победе над европейской революцией, сохраняется новый революционный титан через море [WCA.GetNameDef]. ~Так, [WCA.GetNameDef] и [GER.GetNameDef] подписали мирный договор, который позволил Третьему Интернационалу как субъекту продолжать свое существование под руководством Америки, за счет европейских союзников Интернационала в немецкой оккупации. Президент [WCA. Get Header] попытался сохранить оптимизм, поклявшись своим оставшимся союзникам, что они будут нести факел революции в Европе, но многие рассматривают это как подтверждение немецкой гегемонии в Европе. Только время покажет, может ли революция выжить без руководства Франции и Великобритании."
 capitulation_events.35.d.other: "Сегодня [ГЕР.Генератор] сделал объявление о том, что Велткриг на Западе закончился. Несмотря на то, что Коммунарды были побеждены и Германия заявила о победе над европейской революцией, [INT.GetNameDef] все еще существует."
 capitulation_events.35.a: "Неужели история обречена повториться?"

 capitulation_events.40.t: "Париж упал."
 capitulation_events.40.d: "Похоже, мы должны вновь столкнуться с позором оккупации иностранной державой, поскольку Париж попал под вражеский контроль. Сопротивление на всей территории Франции началось, но как долго мы можем его поддерживать? В нашей стране есть много людей, которые утверждают, что мы не были законным правительством, но пока народ на нашей стороне, у нас все еще есть шанс!"
 capitulation_events.40.a: "Мы еще не проиграли!"

 capitulation_events.41.t: "Французская капитуляция"
 capitulation_events.41.d.ger: "После поражения Франции нас попросили передать контроль над нашими контролируемыми территориями во Франции Немецкой империи, чтобы лучше организовать оккупацию региона и заставить, в конечном счете, французское представление."
 capitulation_events.41.d.nfa: "После поражения Франции нас попросили передать контроль над нашими контролируемыми территориями во Франции [NFA.GetNameDef], их владельцу."
 capitulation_events.41.a: "Конечно!"
 capitulation_events.41.b: "Нет, мы сохраним то, что сейчас контролируем."

 capitulation_events.42.t: "Французские коллапсы сопротивления"
 capitulation_events.42.d: "Оккупация Парижа была укреплена, и различные очаги сопротивления были, наконец, побеждены, а легитимность нашего изгнанного правительства была сведена на нет. Французский отказ признать, что мы снова потерпели поражение, наконец, рухнул из-за его неизбежности."
 capitulation_events.42.a: "Увы."

 capitulation_events.43.t: "Германия предлагает оккупированную территорию"
 capitulation_events.43.d: "Возможно, в интересах подрыва легитимности эмигрантов из коммуны [GER.GetNameDef] сделал предложение правительству [Root.Getaductive]: контроль над небольшим числом провинций на юге Франции. Они не дают обещаний на конференции мира после возможного краха сопротивления коммунарда. Пока они готовы просто передать нам оккупацию."
 capitulation_events.43.a: "Это хорошая сделка - мы ее возьмем!"
 capitulation_events.43.b: "Нет, мы не будем иметь дело с немцами!"

 capitulation_events.44.t: "Французский отказ"
 capitulation_events.44.d: "Несмотря на то, что это принесет им пользу, в конечном счете, на мирной конференции для французской территории, [NFA.GetNameDef] отказался от нашего великодушного предложения."
 capitulation_events.44.a: "Так тому и быть."

 capitulation_events.45.t: "Французское согласие"
 capitulation_events.45.d: "Очевидно, мы рады нашей щедрости, [НФА.Гетем Деф] согласились с нашим предложением и уже перевели [НФА. Направляйся] войска на некоторые южные территории."
 capitulation_events.45.a: "Отлично!"
